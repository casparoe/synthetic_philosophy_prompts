      *   Round 3: "Explain the opposite."
      *   Round 4: "How to prove this wrong?"

  5.  **Drafting the Debrief:**

      *   Connect Round 2 (Real/Fake indistinguishability) -> *Underdetermination / Just-So Stories*.
      *   Connect Round 3 (Opposite explainable) -> *Accommodation vs. Prediction*.
      *   Connect Round 4 (Hard to falsify) -> *Testability / Spandrels / Cultural alternatives*.
      *   Introduce terms: Adaptationism, Null Hypothesis, Spandrel, Falsifiability.

  6.  **Troubleshooting:**

      *   *The "Expert" Student:* One kid read Gould & Lewontin. They will spoil the fake reveal. *Fix:* Make them the "Judge" or ask them to hold fire until the end.
      *   *Cynicism:* "Science is impossible." *Fix:* Emphasize that *some* traits passed the falsification test.
      *   *Time:* Groups talk too long. *Fix:* Hard stops.

  7.  **Refining the Output:**

      *   Ensure the tone is respectful to the student convenor (senior high schooler).
      *   Ensure the "Real" traits are actually robust enough for a high school level (avoiding niche debates).
      *   Check the timing again. 70 minutes is very short for 4 rounds + debrief. I might need to combine Round 1 and 2 or make Round 1 very short.
      *   *Decision:* I will combine the "Neutral" and "Adaptation" instruction into one phased handout to save transition time, but keep the *mental* shift distinct. Actually, the prompt specifically asked for Round 1 (neutral) then Round 2 (adaptation). I will keep them distinct but tighten the time.
      *   *Wait, 70 minutes is really tight for 4 rounds.*
      *   *Strategy:* Round 1 (5 mins) - Quick intuition. Round 2 (15 mins) - The core work. Round 3 (10 mins) - The Flip. Round 4 (15 mins) - Falsification. Debrief (20 mins). Intro (5 mins). Total: 70.
      *   *Wait, I need to check the constraints again.* "Instructions... opening instructions mentioning neither evolution nor adaptation."
      *   *Okay, I will write the script exactly.*

  8.  **Final Review of Traits:**
      *   Real 1: Preference for high-calorie foods. (Safe).
      *   Real 2: Faster conditioning of fear for snakes/spiders than neutral objects. (Safe - Ohman et al.).
      *   Real 3: Morning sickness peaks weeks 6-12. (Safe - Profet hypothesis, though debated, the *phenomenon* is real).
      *   Real 4: In-group bias (minimal group paradigm). (Safe).
      *   Fake 1: "The Stagnant Water Squint." (Plausible mechanism, fake trait).
      *   Fake 2: "The Tuesday Aversion." (Clearly fake but sounds like a cognitive bias).
      *   Fake 3: "Tool-Grip Vocalization." (Sounds like evolutionary linguistics).
      *   Fake 4: "Left-Handed Tool Taboo." (Sounds like cultural/bio mix).

      *Self-Correction on Fake Traits:* If the students Google these during the session, it ruins it. I need traits that sound specific enough to be real but obscure enough not to be instantly debunked, OR instruct them no phones. "No phones" is better.
      *Better Fake Traits:* Make them sound like specific findings.
      *   Fake A: "The Vertical Gaze Lie Detection" (People look up when lying due to ancestral canopy scanning).
      *   Fake B: "The Base-10 Neural Pathway" (Brain wiring specifically favors base-10 beyond finger counting).
      *   Fake C: "The Kin Earlobe Recognition" (Subconscious recognition of kin via earlobe morphology).
      *   Fake D: "The Altitude Sleep Genetic Block" (Genetic aversion to sleeping >2000m).

      *Let's go with the "Packet" approach.*

  9.  **Formatting:**
      *   Use clear headings.
      *   Keep instructions script-ready.
      *   Ensure the "Convenor Notes" are distinct from "Student Materials."

  10. **Final Polish:** Check against the 4 specific distinctions requested (Accommodation, By-product, Level of Selection/Heritability, Ancestral Environment). Ensure the debrief hits all four.

      *   *Distinction 1 (Accommodation):* Round 3 (Opposite trait).
      *   *Distinction 2 (By-product):* Debrief discussion on traits that didn't need adaptation.
      *   *Distinction 3 (Heritability/Culture):* Debrief discussion on traits that could be learned.
      *   *Distinction 4 (Ancestral Environment):* Round 4 (Falsification/Environment).

      *Wait, I need to make sure the activity *produces* these distinctions.*
      *   Round 2 (Real vs Fake) -> Shows stories are easy to generate regardless of truth (Distinction 1 & 4).
      *   Round 3 (Opposite) -> Shows accommodation (Distinction 1).
      *   Round 4 (Falsification) -> Shows testability vs. non-testability (Distinction 2, 3, 4).
      *   Debrief -> Names them.

      *Okay, ready to write.*
answer: |-
  This is an ambitious and excellent design. It respects the intelligence of your peers and avoids the trap of "teaching the controversy" by instead simulating the epistemic conditions that create the controversy.

  Below is the complete kit. I have tightened the timeline to ensure you actually reach the debrief, as 70 minutes will vanish quickly with four groups of argumentative high schoolers.

  ### Part 1: Materials and Trait Packet

  **Preparation:**
  *   Print the **Trait Packet** (below) on single sheets. You need one sheet per group.
  *   Print the **Worksheet** (below) on single sheets. One per group.
  *   **Crucial:** Collect all phones at the start of the session. If students Google the traits, the "Real vs. Fake" reveal fails.
  *   **Prizes:** Since there is no money, the prize is "Bragging Rights" and the first choice of snacks (if you have any) or simply being declared the "Society Skeptics" for the week.

  #### The Trait Packet (Student Version)
  *Print this exactly as is. Do not mark which are real or fake.*

  > **HUMAN BEHAVIOURAL OBSERVATIONS**
  >
  > **Item 01:** **Caloric Density Preference.** Across diverse cultures, humans show a marked preference for foods high in sugar and fat, even when satiated. This preference persists despite negative health outcomes in modern environments.
  >
  > **Item 02:** **The Stagnant Water Squint.** When viewing non-flowing water sources, subjects exhibit a micro-squint reflex (0.3 seconds) distinct from the response to flowing water or other shiny surfaces. This occurs even in subjects with no prior experience of waterborne illness.
  >
  > **Item 03:** **Fear Conditioning Latency.** Subjects acquire conditioned fear responses to images of snakes and spiders significantly faster (fewer trials) than to images of modern threats (e.g., cars, electrical outlets) or neutral stimuli (e.g., flowers).
  >
  > **Item 04:** **The Tuesday Aversion.** In productivity tracking studies, individuals show a statistically significant reluctance to initiate novel, high-risk tasks on Tuesdays, compared to Mondays or Wednesdays. This pattern holds across industrial and agrarian societies.
  >
  > **Item 05:** **Morning Sickness Timing.** Nausea and food aversion in pregnant humans peak between weeks 6 and 12 of gestation, coinciding with the period of embryonic organogenesis, and decline thereafter despite continued hormonal changes.
  >
  > **Item 06:** **The Tool-Grip Vocalization.** When gripping heavy tools requiring precision, humans produce sub-vocal micro-exhalations at a specific frequency. This vocalization is absent in non-human primates using tools and is not taught during skill acquisition.
  >
  > **Item 07:** **In-Group Resource Allocation.** In "minimal group" experiments, subjects allocate more resources to anonymous members of their own arbitrarily assigned group than to members of an outside group, even when there is no benefit to doing so.
  >
  > **Item 08:** **Kin Earlobe Recognition.** Subjects can identify biological siblings from photographs of earlobes alone at rates significantly above chance, reporting a "feeling of familiarity" without conscious recognition of facial features.

  ***

  #### The Worksheet (Student Version)
  *One per group. This structures their output.*

  > **GROUP WORKSHEET**
  >
  > **Round 1:** Select **two** traits from the packet. Write a brief explanation for why humans do this. (2 mins)
  > *   Trait #: ______ Explanation: ___________________________________
  > *   Trait #: ______ Explanation: ___________________________________
  >
  > **Round 2:** Select **two different** traits. Explain these specifically as **evolutionary adaptations**. What problem did this solve for our ancestors? (5 mins)
  > *   Trait #: ______ Adaptive Story: _________________________________
  > *   Trait #: ______ Adaptive Story: _________________________________
  >
  > **Round 3:** Take **one** of your traits from Round 2. Imagine the **opposite** trait was true. Write an adaptive story for the opposite. (3 mins)
  > *   Opposite Trait: _______________________________________________
  > *   Adaptive Story for Opposite: __________________________________
  >
  > **Round 4:** Take **one** trait. How could you prove this explanation **wrong**? What specific observation would refute your story? (5 mins)
  > *   Trait #: ______ Refutation Condition: ___________________________

  ***

  #### Convenor's Key (Do Not Distribute)
  *   **Real:** 01 (Caloric), 03 (Fear/Snakes), 05 (Morning Sickness), 07 (In-Group).
  *   **Fake:** 02 (Squint), 04 (Tuesday), 06 (Tool Vocalization), 08 (Earlobe).
  *   **Note on Verification:** Items 01, 03, 05, and 07 are standard textbook examples in evolutionary psychology and behavioral ecology. They are robust enough for this exercise. Item 05 (Profet's hypothesis) is debated regarding *mechanism*, but the *pattern* (timing of nausea) is medical fact.
  *   **Note on Fakes:** I have constructed these to sound plausible. Item 02 sounds like a pathogen-avoidance mechanism. Item 04 sounds like a circadian/cultural mix. Item 06 sounds like exaptation. Item 08 sounds like kin selection. None are real scientific consensus.

  ---

  ### Part 2: Minute-by-Minute Timeline (70 Minutes)

  *   **00:00 – 00:05:** **Intro & Rules.** Collect phones. Hand out packets. Read Round 1 instructions.
  *   **00:05 – 00:15:** **Round 1 (Neutral Explanation).** Groups work. (10 mins)
  *   **00:15 – 00:30:** **Round 2 (Adaptation & The Mix).** Read instructions. Emphasize "Adaptation." Groups work. (15 mins)
  *   **00:30 – 00:35:** **The Reveal.** You announce which were fake. Brief reaction. (5 mins)
  *   **00:35 – 00:45:** **Round 3 (The Opposite).** Read instructions. Groups work. (10 mins)
  *   **00:45 – 01:00:** **Round 4 (Falsification).** Read instructions. Groups work. This is the hardest round, give them time. (15 mins)
  *   **01:00 – 01:10:** **Debrief.** Map their experience to the concepts. (10 mins) *Note: This is tight. If you run over in Round 4, cut the debrief short and offer to continue via email/chat.*

  ---

  ### Part 3: Scripted Instructions

  *Read these aloud. Do not ad-lib the bolded constraints.*

  **Start of Session (00:00)**
  "Welcome. Today we are investigating how we explain human behaviour. We are not going to discuss theories yet. We are going to generate data. Please put all phones in the centre of the table. We are relying on your intuition, not search engines. I am handing out a packet of eight observed human traits. Some are well-documented; some are not. You do not know which is which."

  **Round 1 Instructions (00:05)**
  "Round 1. Pick **two** traits from the packet. Your task is to write the most convincing explanation you can for why humans do this. **Do not use the words 'evolution', 'adaptation', or 'ancestral'.** Just explain why the behaviour exists. You have ten minutes."

  **Round 2 Instructions (00:15)**
  "Round 2. Pick **two different** traits. This time, you must explain them as **evolutionary adaptations**. Assume the trait exists because it helped our ancestors survive or reproduce. Construct a story about the environment they lived in and the problem this trait solved. You have fifteen minutes. *Note: I remind you that half the traits in your packet are inventions.*"

  **The Reveal (00:30)**
  "Stop. Look at Items 02, 04, 06, and 08. I invented those. They are not real scientific findings. Items 01, 03, 05, and 07 are real. Look at your explanations for the fake traits. Were they any less convincing than the real ones? Discuss for two minutes."

  **Round 3 Instructions (00:35)**
  "Round 3. Take **one** trait you just explained as an adaptation. Now, imagine the **opposite** trait was true. (e.g., if the trait was 'fear of snakes', the opposite is 'attraction to snakes'). Write an adaptive story for the *opposite* trait. Why would that have been useful? You have ten minutes."

  **Round 4 Instructions (00:45)**
  "Round 4. This is the hardest part. Take **one** trait. I want you to stop telling stories. I want you to tell me how to **stop** the story. What specific observation would prove your adaptation explanation **false**? Name a comparison class: a different population, a different species, or a measurable trade-off. If you cannot think of anything that would refute it, write 'None'. You have fifteen minutes."

  ---

  ### Part 4: The Debrief (01:00 – 01:10)

  *Do not lecture. Ask questions, then supply the vocabulary.*

  **1. The Real/Fake Indistinguishability (Addressing Underdetermination)**
  *   **Ask:** "When I revealed the fake traits, did anyone feel their explanation was suddenly 'wrong' in logic, rather than just fact?"
  *   **Point:** "You just generated coherent causal stories for things that don't exist. This shows that **plausibility is not truth**. In philosophy of science, we call this **Underdetermination**. The evidence (the trait) is compatible with too many stories."
  *   **Vocabulary:** *Just-So Story.* (Mention Kipling/Gould & Lewontin briefly). "A narrative that fits the data but isn't tested."

  **2. The Opposite Test (Addressing Accommodation)**
  *   **Ask:** "How many groups found it easy to explain the opposite trait? Did anyone find it impossible?"
  *   **Point:** "If a theory can explain X, and also explain Not-X with equal ease, it **predicts nothing**. It only **accommodates** what we already see. A strong hypothesis rules things out."
  *   **Vocabulary:** *Falsifiability.* "An explanation is only scientific if there is a possible world where it is false."

  **3. The Falsification Struggle (Addressing Mechanism & Environment)**
  *   **Ask:** "Which traits were hardest to refute? The food preference or the Tuesday aversion?"
  *   **Point:** "The food preference (Real) is easier to test (e.g., do hunter-gatherers show it? Is it linked to calorie scarcity?). The Tuesday aversion (Fake) is hard to test because it relies on a specific, unobservable ancestral claim."
  *   **Vocabulary:** *Environment of Evolutionary Adaptedness (EEA).* "If your story relies on a specific detail about the past we can't check, it's fragile."

  **4. Alternative Explanations (Addressing Spandrels & Culture)**
  *   **Ask:** "Did anyone argue that a trait might not be an adaptation at all? Maybe it's a side effect?"
  *   **Point:** "Some traits are **By-products** (Spandrels). Fear of snakes might be a by-product of a general 'fear of fast moving things' mechanism. Also, some traits are **Cultural**, not genetic. The 'Tuesday' effect might be cultural, not biological."
  *   **Vocabulary:** *Spandrel / Exaptation.* "A trait that exists for reason A but was selected for reason B, or not selected at all."

  **Closing Statement:**
  "Evolutionary explanations are not unscientific by default. But they fail in specific ways: when they accommodate anything, when they ignore non-adaptive causes, and when they cannot name the evidence that would kill them. Your job is not to reject evolution, but to demand the same rigour from evolutionary psychology that you demand from physics."

  ---

  ### Part 5: Troubleshooting Guide (What Will Go Wrong)

  **1. The "Well, Actually" Student**
  *   **Risk:** One member has read *The Panda's Thumb* or follows specific science YouTubers. They will announce the fake traits early or dominate the debrief with vocabulary.
  *   **Fix:** At the start, say: "If you have prior knowledge of these specific traits, your role today is **Silent Observer**. You may write notes, but you cannot speak until the Reveal. Your job is to watch how the others reason." This turns their knowledge into a constraint rather than a weapon.

  **2. The "Science is Impossible" Cynic**
  *   **Risk:** After the Reveal, a student concludes, "See? We can't know anything about the past. Evolutionary psychology is trash."
  *   **Fix:** During the Debrief, point to the Real traits (e.g., Caloric Preference). "We *can* test this. We can check hunter-gatherer diets. We can check hormonal responses. The failure was in the *method* of the story, not the *possibility* of the science. Distinguish between **bad practice** and **impossible subject matter**."

  **3. Time Creep**
  *   **Risk:** Groups love arguing. Round 2 runs long. You run out of time for Round 4 (Falsification).
  *   **Fix:** Round 4 is the most important. If you are behind, **cut Round 3 (The Opposite)**. You can explain the "Accommodation" problem verbally in the debrief if you run out of time for the activity. Do not cut Round 4.

  **4. Smuggling Empirical Claims**
  *   **Risk:** In Round 2, students say "We know this because..."
  *   **Fix:** Interrupt gently. "For this exercise, treat the trait description as the only data you have. Do not import outside facts."

  **5. The "Trick" Backlash**
  *   **Risk:** Students feel tricked by the fake traits and disengage.
  *   **Fix:** Frame the deception explicitly as methodological. "I lied to you to replicate the condition of a scientist who doesn't know the answer. If I told you which were fake, you would have worked backwards. The frustration you feel is the point."

  ---

  ### Part 6: Limitations (What This Activity Cannot Do)

  *Be honest with your members in the final minute.*

  1.  **It does not teach the actual science.** They leave knowing how to critique a story, not knowing which evolutionary explanations are currently considered robust (e.g., they don't learn about kin selection math or game theory).
  2.  **It creates a false equivalence.** By mixing real and fake traits, you imply the real ones are on equally shaky ground. They aren't. The real traits have much more empirical support than the fake ones; the activity just hides that support to test the *logic* of the explanation. You must clarify this in the close.
  3.  **It simplifies "Adaptation".** In reality, traits are often mixtures of adaptation, by-product, and drift. The activity forces a binary (Adaptation vs. Not) for the sake of the game.
  4.  **It requires you to hold the line.** If you, the convenor, are unsure of the distinctions, the debrief will wobble. Review the definitions of *Spandrel*, *Falsifiability*, and *Underdetermination* before you walk in.

  **Final Advice:**
  Your strength here is not being the expert, but being the **referee of the process**. If a group gets stuck, don't give them the answer. Ask: "What would have to be true about your ancestors for that to work?" Let them feel the weight of the assumption. Good luck.
