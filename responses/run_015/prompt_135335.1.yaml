prompt: |-
  A set of lecture notes I found online (not my course's) introduces Zorn's lemma like this:

  "Zorn's lemma says: in any nonempty partially ordered set in which every chain has an upper bound, there is a maximal element — that is, an element larger than every other one. It is equivalent to the axiom of choice, hence independent of the rest of set theory, and every use of it is non-constructive: you learn that an object exists without learning which one. The standard application is that every vector space has a basis. Order all linearly independent subsets by inclusion; the union of a chain of linearly independent sets is linearly independent, so every chain has an upper bound, and Zorn gives you a maximal one, which is therefore the largest linearly independent set in the space. It has to span, since otherwise you could throw in a vector outside its span and contradict maximality. You can also run the argument above a fixed independent set, which is how you extend any independent set to a basis. The same 'keep going until you can't' pattern yields other results too: for instance, every infinite set has a maximal countable subset — order the countable subsets by inclusion, note that a union of countable sets is countable, and apply Zorn. Zorn's lemma is just a licence to keep going until you can't go further."

  I have used Zorn's lemma twice in problem sets but have no real intuition for it. Two things worry me and I can't tell whether they are the notes' errors or my misunderstandings: my instructor used "maximal" to mean "nothing strictly bigger", not "bigger than everything else"; and the countable-subset example seems impossible, since you could always add one more element to a countable subset of an infinite set. I'm inclined tothink the countable example is just a slip and the rest of the page is fine, but I'd like that checked rather than confirmed.

  Go through the passage claim by claim and tell me what a working algebraist or set theorist would accept outright, what they'd wince at as sloppy but harmless, and what is actually wrong. In particular: does the maximal/maximum conflation matter for the basis argument, or is it merely verbal there? Is the countable-subset example a repairable slip (and if so, what added hypothesis would make the chain-union step go through), or is it a case where Zorn's hypothesis genuinely fails and the claimed conclusion is simply false — with an explicit chain of countable sets whose union isn't countable if there is one? And does the closing moral, that the lemma is just a licence to keep going until you can't, survive once the errors are corrected?

  Return your answer as a single JSON object with these keys:

  - "audit": an array of objects, one per claim you isolate from the passage, with fields "claim" (short paraphrase), "verdict" (one of "correct", "correct but misleading", "wrong"), "why" (one or two sentences), "better_phrasing" (how a careful author would put it).
  - "maximal_vs_maximum": object with fields "distinction", "matters_here" (whether it makes a difference to the basis argument and why), "witness" (a concrete example showing no largest linearly independent set exists when the space is nontrivial).
  - "countable_subset_case": object with fields "chain_condition_holds" (boolean), "conclusion_true" (boolean), "explanation", "repair_possible" (boolean), "repair" (the hypothesis that would fix it, or null).
  - "what_survives": array of short strings — the claims in the passage I should keep trusting.
