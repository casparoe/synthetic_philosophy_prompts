      *   The dilemma: The third way is 'contextual validity'. Respects aren't just in the head (concessive) or just in the object (structural), but in the interaction relative to a goal.
      *   Fiction: The novel asserts nothing about the shooting (it didn't happen). The characters assert within the world. The judge must decide based on the world's rules.

