      The crucial mistake is moving from "truth is conditional" to "all conditions can be met for any proposition". *Syādvāda* allows for *avaktavya* (indescribable) and *na* (not). It does not guarantee *syāt asti* (in some way, it is) for every predicate. A lie about a shooting is not a valid standpoint; it is a failure to correspond to the *niscaya* (substantial) reality, even if *vyavahāra* (practical) perspectives differ.
      Actually, simpler: Jainism distinguishes between *naya* (partial truth) and *durnaya* (false standpoint). Step (2) implies all standpoints are valid. They aren't.
