      *   **30-35 min:** Misconceptions (Finitism, Truth Gaps, Negation). Clarify $\neg P$ vs $\neg \neg P$.
      *   **35-40 min:** Closing Question & Refusal.

  4.  **Addressing Specific Constraints:**
      *   *Local vs. Global:* This is crucial. For any $n$, we can check $2n+2$. But we can't check all $n$. The constructivist refuses the jump from "for each $n$, decidable" to "the infinite sequence has a definite property."
      *   *Connectives:* Don't start with this. Start with the example. Introduce "OR means you must point to one" when they ask "Why can't we say it's one or the other?"
