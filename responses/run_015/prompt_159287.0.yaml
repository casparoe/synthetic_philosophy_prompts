          *   *Constructive stance:* We cannot assert $x=1 \lor x \neq 1$ because we don't have a method to decide which case holds *now*.
          *   *Critique:* The user's specific definition is actually computable digit-by-digit. The problem isn't the number's existence, it's the equality test.
