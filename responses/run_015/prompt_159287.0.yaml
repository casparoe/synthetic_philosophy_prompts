          *   *Better approach:* Use the *structure* of GC without relying on its current status, or use a property known to be undecidable (like Halting Problem). But high schoolers know GC, they don't know Halting Problem deeply.
          *   *Decision:* The user's example is good *provided* we emphasize that the *assertion* of the disjunction requires a decision procedure we currently lack. However, the prompt asks if it can carry the full 40 minutes.
