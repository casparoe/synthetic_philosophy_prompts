      *   **Tone:** Philosophical, rigorous, decisive.

  2.  **Deconstruct the Core Philosophical Issue:**
      *   *The Problem:* MWI is deterministic. All outcomes happen. What does it mean to say outcome $A$ has probability $0.7$ and $B$ has $0.3$ if both occur?
      *   *The Deutsch-Wallace (DW) Program:* Uses decision theory. If a rational agent knows the wavefunction, how should they bet? DW claim that given certain axioms (ordering, continuity, branching indifference, etc.), the agent *must* act *as if* the Born rule holds.
      *   *The Circularity Charge:* Critics (like Kent, Albert, Price) argue that the axioms (especially "Branching Indifference" or the treatment of amplitudes) implicitly assume the probabilistic significance of the weights. If you don't already care about the weights, why would the axioms hold?
      *   *Alternative Approaches:*
          *   *Zurek's Envariance:* Uses symmetry of entanglement. Criticized for assuming equal probabilities for symmetric states without justification.
