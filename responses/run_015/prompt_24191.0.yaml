          *   *Typicality:* Argues we are typical observers. Criticized for not explaining single-case probabilities.

  3.  **Evaluate the Circularity Charge:**
      *   Is it *viciously* circular? Vicious circularity means the conclusion is a premise.
      *   DW argue the premises are about *rational preference*, not probability. "You should prefer this gamble over that one."
