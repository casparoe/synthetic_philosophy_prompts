      *   **Section 2: The Circularity Charge.** Analyze the axioms. Focus on *Branching Indifference* and *Continuity*. Show how they implicitly assume the weights matter. If you don't assume weights matter, a rational agent might count branches. DW rule out branch counting by fiat (or by arguing it's ill-defined), but this move relies on the physical salience of the amplitude, which *is* the probability proxy.
      *   **Section 3: The Incoherence Problem.** Decision theory solves the *Quantitative* problem (why 0.5 vs 0.7) but ignores the *Incoherence* problem (why uncertainty at all?). You can't derive betting odds for an event that is certain to happen (from the God's eye view). The "caring measure" is just probability relabeled.
