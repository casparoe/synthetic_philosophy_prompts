answer: |-
  **MEMORANDUM**

  **TO:** Methods Committee
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Proposal for Iterative Forecasting Workflow

  **Recommendation:** **Approve a Limited Pilot** (8 weeks, 50% of questions) with a mandatory review on [Date + 8 weeks]. Do not alter the extremization parameter or drop forecasters based on convergence until review.

  **Rationale**

  The proposal to introduce iterative feedback (a Delphi-style approach) has theoretical merit. The staffers correctly cite Aumann's Agreement Theorem: rational agents with common priors who share posteriors should converge. If our forecasters are updating on the *information contained in the aggregate*, convergence could signal error-correction.

  However, implementing this permanently carries three specific methodological risks that must be stress-tested before adoption:

  1.  **Loss of Independence:** Our current log-odds pooling assumes independent errors. If forecasters anchor on the public pool, errors become correlated. This reduces the *effective* sample size ($N$). A herd of 40 is not statistically equivalent to 40 independent judges.
  2.  **Extremization Mismatch:** We currently extremize because diverse, independent crowds tend to be underconfident. If the new workflow increases correlation, the optimal extremization factor *decreases*. Keeping our current "push" on a correlated pool will produce overconfident probabilities and degrade calibration.
  3.  **Signal vs. Noise Diversity:** We recruit for diverse priors (backgrounds), not just noise. Convergence might reflect shared bias or a shared interpretation of fuzzy resolution rules rather than truth. Penalizing non-convergence risks pruning high-value contrarians who possess unique information not reflected in the initial pool.

  **Pilot Design**

  *   **Split Sample:** Apply the new workflow to half of our weekly questions; maintain the current blind workflow for the other half.
  *   **Hold Parameters:** Keep the extremization factor constant for both groups during the pilot to isolate the workflow's effect.
  *   **Success Metrics:** Compare Brier scores and calibration curves. Crucially, monitor the *variance* of the final pool. If variance drops significantly without a Brier score improvement, the workflow is inducing harmful herding.
  *   **No Penalties:** Do not drop forecasters for non-convergence during the pilot.

  **Uncertainty & Reflection**

  **What would change my recommendation?**
  If the pilot demonstrates a statistically significant improvement in Brier scores (p < 0.05) *without* a degradation in calibration (reliability), I will support full adoption. Additionally, if analysis shows that "stubborn" forecasters consistently underperform the converging majority, I would support a mechanism to weight them lower.

  **Where my reasoning is most likely wrong:**
  I may be overestimating the herding effect. Forecasters might treat the public pool as just another data point rather than an anchor, preserving enough independence for our current extremization formula to remain valid. Furthermore, I am assuming the "fuzzy resolution" risk is high; if forecasters use the discussion rounds to clarify resolution criteria rather than just numbers, convergence might actually reduce noise rather than signal diversity.

  **Next Steps**
  If approved, Engineering to implement the two-round interface by [Date]. Analysis to begin immediately following the 8-week window.
