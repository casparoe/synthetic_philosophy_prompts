answer: |-
  ## Procedure: Tranquilist Quality of Life Audit (TQLA) v1.0
  **Author:** Clinical Directorate (Philosophy Lead) / Nursing Lead (Operational)
  **Time Required:** 30 Minutes per Resident
  **Operator:** Care Assistant (CA) / Key Worker
  **Sign-off:** Registered Nurse (RN)

  ### 1. Purpose & Scope
  To assess resident well-being based on the **Tranquilist Metric**: Well-being is maximized by the absence of suffering and the absence of active craving. Satisfaction of desire is neutral (return to baseline), not positive.
  **Note:** This score informs care plans, medication reviews, and leave privileges.

  ### 2. The Assessment Window
  **Do not score 24 hours.** Sedation and sleep are not "tranquility."
  *   **Define Window:** 08:00 to 22:00 (14 hours).
  *   **Exclude:** Time spent asleep or in medically documented sedation stupor.
  *   **CA Action:** Estimate "Active Waking Hours" (AWH) in the last 7 days. If AWH < 4 hours/day, **STOP** and flag for RN immediately (Risk of Over-sedation).

  ### 3. The Scoring Sheet (CA Completion)

  #### Section A: Suffering Check (Negative Points)
  *Observe and ask over the Assessment Window.*
  1.  **Visible Distress:** Did the resident display crying, agitation, pacing, or self-harm?
      *   [ ] No (0 pts)
      *   [ ] Yes (Record hours: -1 pt per hour)
  2.  **Reported Distress:** Did the resident report pain, anxiety, or sadness?
      *   [ ] No (0 pts)
      *   [ ] Yes (Record intensity 1-10: -1 pt per point of intensity per episode)
  3.  **The "Wretched" Flag:** Does the resident look wretched (slumped, tearful, grimacing) while *saying* they are fine?
      *   [ ] No
      *   [ ] Yes (**Flag for RN**)

  #### Section B: Craving State (Negative Points)
  *Tranquilist Rule: A craving is a negative state, regardless of whether it is fulfilled.*
  4.  **Active Craving:** Was there a period where the resident wanted something they did not currently have? (e.g., a cigarette, a specific food, to leave, to work on a project).
      *   [ ] No (0 pts)
      *   [ ] Yes (Record hours: -1 pt per hour of active wanting)
  5.  **Craving Resolution:** How did the craving end?
      *   [ ] **Sated:** They got what they wanted. (Score returns to 0. No bonus points).
      *   [ ] **Suppressed:** They chose not to act, but still wanted it. (Score remains -1 pt/hour until desire fades).
      *   [ ] **Damped:** Medication/therapy reduced the *urge* while allowing the action. (Score returns to 0 immediately upon damping).
      *   [ ] **Frustrated:** They wanted it, didn't get it, and stopped wanting it due to exhaustion/resignation. (-2 pts per hour).

  #### Section C: The Damping Protocol Check
  6.  **Current Status:** Is the resident on the Craving-Damping Protocol?
      *   [ ] No
      *   [ ] Yes
  7.  **Efficacy:** Did the damping stop the *feeling* of craving?
      *   [ ] Yes (Score as "No Craving")
      *   [ ] No (Score as "Active Craving")
      *   [ ] **Refused:** Resident asked to stop damping. (**Flag for RN**)

  #### Section D: The Values Call (RN Sign-off Only)
  *CA leaves blank if any of the following apply.*
  8.  **Discordance:** Self-report ("I'm fine") contradicts Observation (Flat affect/tears).
      *   [ ] RN to adjudicate weight of observation vs. report.
  9.  **Volitional Craving:** Resident explicitly states they *prefer* to feel strong cravings (e.g., "I want to care about things").
      *   [ ] RN to adjudicate autonomy vs. metric.
  10. **Numbness vs. Peace:** Resident shows no craving/suffering but also no engagement (e.g., staring at wall/TV > 6 hours).
      *   [ ] RN to adjudicate medication side-effect vs. tranquil state.

  ### 4. Calculation
  *   **Baseline:** 100
  *   **Minus:** Suffering Points (Section A)
  *   **Minus:** Craving Points (Section B)
  *   **Plus:** Nothing (Pleasure/Success adds 0).
  *   **Final Score:** 0–100.
  *   **Threshold:** Score < 60 triggers Care Plan Review (Medication increase or Activity Restriction). Score > 80 confirms Current Plan.

  ***

  ## Case Run-Throughs

  Here is how the TQLA scores your three residents based on the procedure above.

  ### 1. Dev (34, Antipsychotic Sedation, TV)
  *   **Window:** 14 Hours Active Waking.
  *   **Suffering:** 0 reported, 0 observed. (0 pts)
  *   **Craving:** 0 reported. He states he wants nothing. (0 pts)
  *   **Damping:** Effectively yes (via heavy antipsychotic), though not on the specific "Damping Protocol."
  *   **Discordance:** CA notes "Flat and slow." Looks medicated, says "I'm fine."
  *   **TQLA Score:** **100/100**
  *   **Care Plan Implication:** Status Quo. No pressure to reduce meds or increase activity.
  *   **The Trap:** Under Tranquilism, Dev is the ideal resident. He is a "perfectly tranquil vessel." The metric cannot distinguish between *peace* and *chemical abolition of drive*.

  ### 2. Amara (27, Podcasting, High Variance)
  *   **Window:** 14 Hours Active Waking.
  *   **Suffering:** 1 hour of "wrecked" distress per episode flop (approx. 2x week). (-2 pts/week avg).
  *   **Craving:** "Consumed with making it work." Reports constant desire to record/edit. Approx. 6 hours/day of active craving. (-6 pts/day).
  *   **Resolution:** When an episode succeeds, she feels "great." Tranquilist Rule: This is 0 points, not positive. It merely pauses the craving.
  *   **TQLA Score:** **~45/100** (Fails Threshold)
  *   **Care Plan Implication:** Trigger Review. Recommendation: Restrict podcasting hours (reduce opportunity for craving) or initiate Damping Protocol (reduce urge to work).
  *   **The Trap:** Her passion is penalized as pathology. Her resilience (getting back up after a flop) is ignored; only the flop (suffering) counts.

  ### 3. Tomas (58, Refusing Damping)
  *   **Window:** 14 Hours Active Waking.
  *   **Suffering:** Minimal.
  *   **Craving:** High. He wants to engage in hobbies, socialize, learn.
  *   **Damping:** Offered. **Refused.** "I'd rather want things badly than not want them."
  *   **TQLA Score:** **~50/100** (Fails Threshold)
  *   **Care Plan Implication:** Trigger Review. Flag for "Values Call."
  *   **The Trap:** The score says he is failing. His own testimony says he is succeeding. The procedure forces you to pathologize his choice to feel alive.

  ***

  ## Lead Nurse Critique: What to Refuse and What the Score Misses

  You asked me to be plain. If you implement this TQLA as written, you will violate the core ethical tenets of psychiatric rehabilitation. Here is the breakdown of where the procedure breaks and what you need to push back on with the Clinical Director.

  ### 1. The "Dev" Problem (Numbness vs. Health)
  **The Score Says:** Dev is perfect (100/100).
  **The Reality:** Dev is likely experiencing **neuroleptic deficit syndrome**. He isn't tranquil; he is incapacitated.
  **What to Refuse:** Do not accept a score of 100 for a resident with "flat and slow" psychomotor retardation.
  **The Fix:** In Section D (Values Call), you must add a **"Engagement Multiplier."** If a resident has no cravings *and* no goal-directed activity, the score must be halved. Tranquilism treats the absence of desire as a goal; Recovery Practice treats the *capacity* for desire as the goal. If you let Dev's score stand, you are incentivizing chemical lobotomy.

  ### 2. The "Amara" Problem (The Value of Struggle)
  **The Score Says:** Amara is failing (45/100) because she cares too much.
  **The Reality:** Amara is demonstrating **recovery capital**. She has identity, purpose, and resilience. The "wrecked hour" is the cost of meaningful engagement, not a symptom to be eradicated.
  **What to Refuse:** Do not use this score to restrict her leave or podcasting.
  **The Fix:** You need to categorize suffering. **Existential Suffering** (failure at a chosen task) is different from **Psychiatric Suffering** (psychosis, uncontrollable anxiety). The TQLA treats them identically. You must annotate the score: "Distress linked to valued activity." If you damp her craving to work, you might raise her Tranquilist score, but you will destroy her rehabilitation.

  ### 3. The "Tomas" Problem (Autonomy vs. Metric)
  **The Score Says:** Tomas is failing (50/100) because he refuses to be numbed.
  **The Reality:** Tomas is exercising **informed consent** and **self-determination**. He has identified that a life without craving is a life without meaning *for him*.
  **What to Refuse:** Do not let the score trigger a capacity assessment or a forced Damping Protocol.
  **The Fix:** This is the "Values Call" in Section D. You must explicitly state: **"Resident prioritizes Meaning over Tranquility."** The Clinical Director's philosophy assumes all patients want to minimize negative states. Tomas proves this false. If the score dictates his care plan against his stated values, you are practicing paternalism, not nursing.

  ### 4. What The Score Cannot Tell Us
  The TQLA is a metric of **consumption**, not **living**.
  *   **It cannot measure Growth:** Growth requires craving (wanting to be better) and suffering (the struggle to improve).
  *   **It cannot measure Connection:** Loving someone involves the craving for their presence and the suffering of their absence. A hermit scores higher than a husband.
  *   **It cannot measure Agency:** Dev has no agency (meds decide his state). Amara has high agency (she drives the podcast). The score rewards Dev.

  ### Recommendation for the Team
  Run the TQLA if the Director demands it for compliance, **but** run a parallel **"Recovery Star"** or **"Goal Attainment Scaling"** assessment for the actual care planning.

  When signing off Dev's form:
  > *"Score 100 recorded. Clinical Note: High score attributed to medication-induced apathy. Care Plan will focus on gradual activation despite score."*

  When signing off Amara's form:
  > *"Score 45 recorded. Clinical Note: Distress is proportional to valued activity. No change to meds. Support coping strategies for 'flop days'."*

  When signing off Tomas's form:
  > *"Score 50 recorded. Clinical Note: Resident declines Damping Protocol. Capacity intact. Care Plan respects resident's valuation of emotional intensity over tranquility."*

  If the Director challenges you, tell him: **"This metric measures the quality of a stone, not a human. I will not care for stones."**
