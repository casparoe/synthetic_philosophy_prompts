      *   *Buffer/Slack:* Managers don't order exactly what was eaten last week; they order based on projected demand plus a safety buffer. One missing taco is absorbed by the buffer, not transmitted to the supplier.
      *   *Thresholds are not linear:* The threshold isn't just "one case." It's "one case plus enough margin to feel confident reducing inventory." A single student's absence is noise, not signal.
      *   *The "Waste" vs. "Order" distinction:* Even if a case goes uneaten, does that mean the next order is cut by exactly one case? Or is the waste thrown away and the order stays the same to avoid risk of shortage? Often, waste is absorbed as cost rather than risking stockouts.
      *   *Supply Chain Rigidity:* The supplier might have minimums too.
      *   *Expected Value Critique:* The probability of being the *pivotal* person is effectively zero, not 1/N. If 39.9 pounds are wasted, the 40th pound doesn't trigger the cut unless the manager is perfectly rational and risk-neutral, which they aren't. They are risk-averse regarding food shortages.
      *   *Focus:* I need to argue that the math assumes a sensitivity that doesn't exist. The system is designed to ignore noise (individual choices). Therefore, the expected impact is not 1 portion; it is effectively zero because the probability of triggering the change is not 1/40, it's near 0 because the threshold includes a safety margin beyond just the lumpiness.

