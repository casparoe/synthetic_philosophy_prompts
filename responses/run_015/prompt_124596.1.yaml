      *   **Conflict:** The user (an actuary) argued with a friend. The friend sees Keynes's vision as *normative* (about flourishing, absolute vs. relative needs, love of money as morbid, tech unemployment as liberation). The user seems skeptical or at least views it through an actuarial lens.
      *   **Task 1:** Restate Keynes's argument *strictly* using actuarial vocabulary (risk pools, discount rates, utility smoothing, non-pecuniary flows, etc.).
      *   **Task 2:** Provide a "Residue Report" categorizing Keynes's concepts into:
          *   Clean map to risk-adjusted lifetime utility maximization.
          *   Survives only if distorted into quantifiable goods/bundles.
          *   No expression in actuarial reasoning.
      *   **Task 3:** Conclude on whether the actuarial framework lacks resources to describe the good life OR if Keynes relies on undefended aesthetic/moral premises.
      *   **Tone:** Professional, precise, intellectually rigorous, respecting the user's expertise while challenging their framework.

  2.  **Deconstruct Keynes's Argument (1930 Essay):**
      *   *Core Prediction:* Capital accumulation + tech progress $\rightarrow$ 10x increase in standard of living $\rightarrow$ problem of "need" solved.
      *   *Absolute vs. Relative Needs:* Absolute needs are satiable (food, shelter). Relative needs are insatiable (status, superiority).
      *   *Love of Money:* Currently a moral habit (accumulation for security/status). Once security is assured, this becomes a "morbid obsession."
      *   *Technological Unemployment:* Discovery of means to economize labor outruns discovery of new uses for labor. This is good; it frees time.
      *   *The Goal:* Live wisely, agreeably, well. Art of life. Not endless production.

  3.  **Translate to Actuarial Vocabulary (Task 1):**
      *   *Capital/Tech:* Increase in the expected value of future cash flows per unit of labor input. Reduction in the volatility of subsistence risk.
      *   *Working Hours:* Reduction in the premium paid for labor exposure.
      *   *Absolute Needs:* Satiable liability streams. Once funded, marginal utility drops to zero.
      *   *Relative Needs:* Positional goods. Utility depends on the cohort's aggregate distribution, not just individual solvency. Insatiable liability.
      *   *Love of Money:* Excessive weighting of the accumulation phase over the decumulation phase. High time preference for security beyond the ruin probability threshold.
      *   *Tech Unemployment:* Structural redundancy in the labor risk pool.
      *   *Liberation/Flourishing:* Maximization of non-pecuniary welfare flows (leisure, purpose) once pecuniary solvency constraints are removed.
