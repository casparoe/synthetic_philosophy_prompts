      *   *Category 3: No Expression.* The *moral* judgment on money-love. The *definition* of what makes life "worth living" (art, relationships) beyond "utility." The distinction between *wants* and *needs* is often treated as exogenous in actuarial work, but Keynes makes it central and normative.

