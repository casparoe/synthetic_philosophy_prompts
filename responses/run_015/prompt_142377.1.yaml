answer: |-
  Design Commitment: I've chosen the "Oakhaven Tram Brake Standard of 1907" scenario. It mirrors modern tech debates (legacy vs. upgrade), tempting programmers to project current biases. It allows both progress and decline narratives to plausibly mine the same text. I am guessing on whether the groups will notice each other's opposing prompts before the reveal; if they do, have a spare "neutral" task ready to pivot to. I am also guessing on the historian's compliance; if they slip, pause and ask them to write their objection on the whiteboard to be addressed only at the end.

  ### Prep
  Print four distinct handouts per table, aged with tea stains if you're feeling theatrical. You need two large sheets of butcher paper for each half of the room. Seat the group at the long table, but physically separate them into Left (Team Progress) and Right (Team Decline) halves before they arrive; place name cards to enforce this. Keep the prompt instructions hidden under the archive documents until you give the signal.

  Bribe the historian explicitly before the session starts: a bottle of something decent, conditional on total silence until the debrief. Their job is to watch for anachronisms but not speak. Prepare a "Prediction Ledger" on the whiteboard with four columns: Technical Merit, Cost, Public Pressure, Corruption. Give everyone a sticky note to place their bet on the *real* reason the decision was made.

  Hide the twist: The archive implies a technical debate, but the real outcome (revealed later) was decided by a patent bribe unknown to the public. Ensure the room has no Wi-Fi; you don't want someone fact-checking "Oakhaven."

  ### The Archive
  **Document 1: Chief Engineer's Memorandum (Jan 1907)**
  "To the Council: The Veridian Mechanical Drum is a known quantity. Maintenance is straightforward for our existing staff. The Umbral Electro-Magnetic system, while novel, requires specialized knowledge we lack. Reliability is paramount for public trust. I recommend the Veridian system."

  **Document 2: Tram Drivers Union Petition (Feb 1907)**
  "We urge adoption of the Umbral Electro-Magnetic brake. Tests show stopping distances are 30% shorter on wet rails. The Mechanical Drum overheats on long descents. We fear for passenger safety if cost is prioritized over performance. The future is electric."

  **Document 3: City Council Budget Minute (March 1907)**
  "Resolved: To award the contract to Veridian Industries. Note: The initial outlay is 40% lower than Umbral. Copper market volatility makes Electro-Magnetic coils a fiscal risk. The Council must prioritize fiscal solvency over speculative engineering."

  **Document 4: The Oakhaven Gazette Editorial (April 1907)**
  "Progress cannot be stopped. Yet, we must walk before we run. The Council has chosen prudence over flashiness. Some cry 'obsolete,' but we say 'proven.' Time will tell if this caution serves the city or shackles it."

  **The Secret Outcome Sheet (Facilitator Only)**
  "Veridian won. Reason: The Chief Engineer's wife held majority stock in Veridian. The copper risk was fabricated post-decision. The technical debate was theater. Modern system inherits Mechanical flaws but retrofitted poorly."

  ### Run Sheet
  **00:00 – 00:10: Setup & Wager**
  Welcome everyone. No intros. Hand out the archives. Say: "You are historians analyzing a pivotal moment. Before you read, place your sticky note on the whiteboard. What actually decided this vote? Technical Merit, Cost, Public Pressure, or Corruption?" This creates the stake. They will want to be right later.

  **00:10 – 00:50: The Narrative Construction**
  Reveal the hidden prompts under the docs.
  Left Side: "Write a narrative explaining how this decision established the **superior safety** of the modern system."
  Right Side: "Write a narrative explaining how this decision locked in the **systemic vulnerabilities** we suffer today."
  Give them butcher paper and markers. They must quote the archive to support their claim. You circulate. If anyone asks "Did this actually happen?", say "Treat the documents as fact." If the historian twitches, glare gently.

  **00:50 – 01:05: The Clash**
  Ask Left to present their "Safety Success" story. They will cite the Engineer's " reliability" and the Gazette's "prudence." Ask Right to present their "Vulnerability" story. They will cite the Union's "overheating" warning and the Budget's "cost-cutting."
  Point out the contradiction. "Both groups used the same documents. Both claimed certainty. How?"

  **01:05 – 01:15: The Reveal**
  Hand out the Secret Outcome Sheet. Reveal the bribe. Reveal that the technical debate was irrelevant. Ask them to check their whiteboard bets. Most will have voted Technical or Cost. Few will have voted Corruption.
  Then reveal the prompts were opposite. "You didn't find the truth. You built a road to where I told you to stand."

  **01:15 – 01:30: Transition to Debrief**
  Clear the boards. Keep the Prediction Ledger visible. Ask them to keep their hands off the drinks until the final bell.

  ### Debrief
  This is where you name the vice. Do not lecture; ask questions that force them to label themselves.

  First, address the **Prediction Ledger**. Most bet on Technical Merit or Cost because the documents framed it that way. This is Move One: *Reading with the ending in hand.* They assumed the documents reflected the *cause* of the outcome, not just the *cover story*. They treated the archive as a map of causality rather than a map of rhetoric.

  Second, address the **Narratives**. Ask Left: "Did you mention the Union's warning?" They likely minimized it. Ask Right: "Did you mention the Engineer's reliability claim?" They likely framed it as stubbornness. This is Move Two: *Selecting ancestors.* Both groups curated the past to find the parents of their assigned present. The "losers" (the real reason, the bribe) vanished because they weren't ancestors of the prompt's truth.

  Third, address the **Prompts**. One group wrote triumph, one wrote decline. Ask: "Was the logic different?" It wasn't. Both scored the past by its distance from a modern condition (Safety vs. Vulnerability). This is Move Three: *Scoring by distance.* Show them that a decline narrative is just a progress narrative run in reverse. It feels critical, but it's the same teleological trap.

  Finally, say the words: "This is Whig History." It isn't just about winners. It's about assuming the present is the judge of the past. You just did it twice.

  ### Failure Modes
  **The Historian:** They may interrupt to say "Actually, sources don't work this way." If they do, stop. Ask them to write their objection on the board and promise to address it in the debrief. If they spoil the twist, pivot immediately to "Why did the documents lie to us?" and proceed.

  **The Cynic:** Someone will say, "But all history is written backwards anyway. You can't know the future." This is the biggest risk. If they say this, agree partially. "Yes, we know the end. But we don't have to let the end choose the evidence." Ask them to rewrite one sentence from their narrative without referencing the modern outcome. If they can't, you've proven the point.

  **The Guessers:** If someone realizes the prompts are different early, the game collapses. Fallback: Acknowledge it immediately. "Good catch. Now compare notes. Why did the same docs support opposite truths?" Turn the leak into the lesson.

  **The Bored Programmer:** If they treat it as a puzzle to solve rather than a narrative to write, they will focus on the bribe too early. Remind them: "The task is the story, not the mystery."

  ### What this can't teach
  This exercise exposes the *structure* of bad history, but it cannot teach the *discipline* of good history. It shows them how to lie with archives, not how to verify them. It doesn't address material constraints—sometimes the past *did* determine the present, and sometimes winners *were* right. It also doesn't solve the problem of language; we still lack words to describe the past without implying a trajectory. You must say this aloud: "Knowing the trap doesn't mean you can avoid it. You just know you're walking on ice." The exercise creates skepticism, not methodology. It leaves them with a receipt of their own bias, but no new tool to replace it. That's intentional. Discomfort is the goal, not competence.
