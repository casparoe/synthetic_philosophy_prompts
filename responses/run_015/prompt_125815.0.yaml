answer: |-
  **The Case**

  Elena, a senior music critic, sits on the panel for a prestigious conservatory audition where her son, Julian, is the final candidate. Julian's performance of the Rachmaninoff is technically flawless and deeply expressive, warranting genuine admiration (the right-kind reason is present and undefeated). However, Elena is also bound by a deathbed promise to her late husband, Julian's father, to "never let your expertise freeze your heart; ensure you feel the pride you show." The promise imposes a moral demand that she not merely award him the spot, but internally *feel* the admiration on this specific occasion, lest her internal coldness betray the support he needs to launch his career. Elena cannot simply decide to feel admiration; the feeling is a response to the music, not her will, yet the moral pressure of the promise bears directly on her having the attitude now.

  **Analysis**

  **(i) The Attitude**
  The attitude is **admiration**. It qualifies as recalcitrant because it is a perceptual-like response to perceived excellence; one cannot acquire it via fiat any more than one can decide to see a color as red. It requires the subject to be struck by the object's properties. While one can manage one's environment to *increase the likelihood* of admiration over time, one cannot toggle it at will during a specific evaluation.

  **(ii) & (iii) The Verdicts**
  The **Fitting-Attitude (FA) Theorist** argues that value is constituted by the fittingness of an attitude, and reasons for an attitude must bear on whether it fits its object. Since the promise is not a property of Julian's performance, it does not make admiration more fitting. Therefore, the FA theorist verdicts that the promise provides *no reason to admire*, only a reason to *wish* she admired or to act *as if* she admired. The **Inclusive Theorist** holds that any consideration counting in favor of having an attitude is a reason for it. Since fulfilling a moral promise is good, and having the attitude would fulfill the promise, the promise counts in favor of having the attitude. Therefore, the Inclusive theorist verdicts that the promise *is a reason to admire*, additive to the reason provided by the performance's excellence.

  **The Failure of the "Bring It About" Reply**
  The standard reply—that the demon (or here, the promise) gives a reason to *bring it about* that one admires, not to admire—fails here because of the **synchronic demand**. The promise requires the attitude *during the audition*, not as a long-term project. The fallback that one can cultivate attitudes indirectly (e.g., by recalling Julian's childhood diligence) fails because such self-manipulation undermines the very nature of admiration, which must be a response to the *object* (the music), not a manufactured state. If Elena focuses on her promise or childhood memories to trigger the feeling, she is no longer admiring the performance, rendering the "cultivation" strategy self-defeating in this context.

  **The Critical Feature and Substitutions**
  The single feature doing the work is **Synchronic Recalcitrance**: the demand for an involuntary state at a specific moment of evaluation.
  *   If you remove this feature and substitute a **controllable action** (e.g., "vote for Julian"), the "bring it about" reply works perfectly; the promise is a reason to vote, and voting is willable.
  *   If you substitute the **moral promise** with a **cash offer** (the standard bet case), the pressure is prudential and external, making it easier to dismiss as irrelevant to the attitude's normative status. The moral promise claims internal authority over Elena's psychology, making the exclusion of the reason more contentious and the failure of the "bring it about" reply more damaging.

  **Strongest Objection**
  This case leaves the **Inclusive View** looking worse. The strongest objection is the **Guidance Constraint**: a consideration can only be a reason for an attitude if the agent can potentially hold the attitude *on the basis of* that consideration. Because admiration is recalcitrant and must be based on the object's excellence, Elena cannot admire Julian *because of the promise*. If she cannot form the attitude on the basis of the reason, the reason cannot guide her, and thus fails to function as a reason for that attitude. The Inclusive theorist is forced to posit "reasons" that are necessarily inert in the formation of the attitude they support.
