  I place my hand upon the cold machine.
  You watch the signal lamp, the steady light.
  I set the value of the cold number.
  There is no use in making further wait.
  It sits between us like a heavy stone.
  You know exactly what will bring the fire.

  You think you can outrun the coming fire.
  I lift my hand away from off the wheel.
  It rests now heavy as a graveyard stone.
  There is no human signal in the light.
  The clock will not accept a plea to wait.
  The odds are just a cold and fixed number.

  I chose the number strictly to deter.
  Before the sky is filled with sudden fire.
  You might believe I will not let you wait.
  The choice has slipped away from out my hand.
  The logic hardens like a river stone.
  There is no warmth remaining in the light.

  You look for mercy in the blinking light.
  But mercy is not in the number's scope.
  We are both pinned beneath this rolling stone.
  I cannot stop the chain that leads to fire.
  The power is no longer in my hand.
  There is no time remaining but to wait.

  There is no reason left for you to wait.
  You search in vain for mercy in the light.
  I cannot feel the tremor in my hand.
  The chance is set, a fixed and cruel number.
  Once triggered, nothing will prevent the fire.
  It crushes hope beneath a heavy stone.

  I stand aside and let it be the stone.
  You have no moments left in which to wait.
  It does not care who lights the final fire.
  The signal burns without a human light.
  The math is done, the cold and final number.
  There is no weapon left inside my hand.

  To fix the number I have sold my hand.
  You wait beneath the stone to see the fire.
  There is no human left to change the light.

  ***

  **Note on the Poem's Commitment**

  This poem commits to the second reading: the device *does* purchase credibility because the loss of control is real. It assumes the adversary is rational and believes the custodian is physically incapable of overriding the mechanism ex-post, even if retaliation becomes irrational once cities are destroyed. It assumes the probabilistic binding is absolute—that the "die inside the doomsday machine" cannot be weighted by human hesitation at the moment of crisis. The poem knowingly does violence to standard deterrence theory by ignoring the "human-in-the-loop" problem: in reality, political and psychological pressures almost always allow a leader to sabotage such a device before the final act, rendering the commitment less than absolute. Here, I treat the arithmetic binding as ontologically stronger than the human will that created it, privileging the tragedy of the mechanism over the flexibility of the agent.
