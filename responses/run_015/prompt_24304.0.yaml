      *   **Camp B (Myopic/Sequential EU):** Rationality is about making the best choice *given current information* at the moment of choice. Past commitments or future consequences don't make the *current* choice irrational if it maximizes current EU. Money pumps are bad outcomes, but not necessarily proof of irrational *process*. (Key figures: McClennen, some causal decision theorists, practical AI engineers).
