answer: |-
  # JOINT STATEMENT ON DIACHRONIC COHERENCE AND SEQUENTIAL DECISION-MAKING

  **Parties:** Proponents of Diachronic Coherence (Camp A) and Proponents of Sequential Expected Utility Maximization (Camp B).
  **Subject:** Normative constraints on artificial agents making long sequences of decisions under uncertainty.
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS

  The undersigned parties, acknowledging the technical requirements of artificial agent specification and the philosophical literature on decision theory, affirm the following descriptive and normative claims as common ground.

  1.  **Descriptive Mechanics of Incoherence:** We agree on the mathematical structure of Dutch Books (regarding credences) and Money Pumps (regarding preferences).
      *   *Credences:* If an agent's betting quotients violate the axioms of probability (e.g., $P(A) + P(\neg A) \neq 1$), there exists a set of bets the agent will accept individually that guarantees a net financial loss regardless of the state of the world.
      *   *Preferences:* If an agent's preferences violate transitivity (e.g., $A \succ B$, $B \succ C$, $C \succ A$), there exists a sequence of trades the agent will accept individually that returns the agent to their initial state with strictly fewer resources.
  2.  **Instrumental Disvalue of Dominated Strategies:** Both parties agree that ending up in a state strictly worse than an available alternative (a dominated outcome) is instrumentally undesirable. An agent design that systematically guarantees resource depletion without compensatory gain is pragmatically defective relative to an agent design that preserves resources, all else being equal.
  3.  **Local Optimality Condition:** Both parties agree that, at any specific decision node $t$, an action $a$ is *locally optimal* if it maximizes the Expected Utility (EU) calculated relative to the agent's credences and preferences held at $t$. Camp B asserts this is the sole definition of a rational act. Camp A accepts this as the definition of a *synchronically* rational act but denies it is sufficient for *agency* rationality.
  4.  **Predictability of Exploitation:** Both parties agree that if an agent's decision procedure is known to be incoherent (e.g., cyclic preferences), an external adversary can construct a sequence of offers that will extract value from the agent. The vulnerability is objective and exploitable.
  5.  **Relevance to AI Specification:** Both parties agree that for an artificial agent operating over a long horizon, the distinction between "one-shot decision rules" and "persisting policy constraints" is an engineering variable. The agent can be architected either to re-evaluate utility from scratch at every time step or to bind itself to prior policies.

  ## II. DISAGREEMENTS TABLE

  The following table isolates the residual normative and metaphysical disagreements. The wording is chosen to be acceptable to both parties as an accurate characterization of their respective positions.

  | # | Crux / Disagreement | Camp A (Diachronic Coherence) | Camp B (Sequential EU) |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Normative Status of Pumpability**<br>Is susceptibility to a money pump a constitutive defect of rationality, or merely an instrumental risk? | **Constitutive Defect.** Pumpability proves the agent's underlying preference/credence structure is irrational *now*, regardless of the outcome of the current step. Rationality requires immunity to exploitation as a constraint on the system's architecture. | **Instrumental Risk.** Pumpability is a negative *outcome* property, not necessarily a *process* defect. If every individual choice maximizes current EU, the process is rational. The loss is a failure of foresight or modeling, not a violation of rationality norms. |
  | **2** | **Conflict Resolution**<br>When a Diachronic Plan (to avoid pumping) conflicts with a Local EU Maximization (to accept a trade), which prescription governs? | **Diachronic Plan Governs.** The agent must refuse the locally attractive trade to maintain coherence. Rationality requires "resolute choice" or pre-commitment mechanisms that override current local incentives to preserve global integrity. | **Local EU Governs.** The agent must accept the trade. A prior plan cannot bind a current self if the current self's calculation indicates a better option. Binding oneself against current EU is itself irrational (a form of "spite" against one's current preferences). |
  | **3** | **Unit of Analysis**<br>Does the present agent-state owe normative obligations to future agent-states? | **Yes (Temporal Neutrality).** The "agent" is the entire trajectory. The current time-slice is a fiduciary for the whole. Sacrificing local gain to prevent future loss is required because the future loss counts as *our* loss. | **No (Indexical Priority).** The "agent" is the current decision node. Future states are distinct optimization problems. The current self owes nothing to the future self other than what is instrumentally useful for the current self's goals. |

  ## III. CRUX ANALYSIS AND PREDICTED VERDICTS

  For each disagreement above, we identify a concrete case or piece of evidence that bears on the resolution, and record the divergent predictions each camp makes regarding the verdict.

  ### Crux 1: Constitutive vs. Instrumental
  *   **Concrete Case:** **The Minimal Money Pump.** An agent with intransitive preferences ($A \succ B \succ C \succ A$) is offered a trade from $A$ to $B$ for \$1, then $B$ to $C$ for \$1, then $C$ to $A$ for \$1. The agent ends at $A$ minus \$3.
  *   **Evidence Bearing on Crux:** Whether the agent could have *known* the sequence in advance. If the sequence is unpredictable, Camp B argues the loss is bad luck, not irrationality. If the sequence is predictable, Camp A argues the preference structure itself is the error.
  *   **Predicted Verdicts:**
      *   **Camp A:** The agent is irrational even in the first trade, because the preference structure licenses the loss. The verdict is **Guilty of Irrationality**.
      *   **Camp B:** The agent is rational in each step if the trade improves their state *ex ante*. The verdict is **Rational Process, Poor Outcome**.

  ### Crux 2: Conflict Resolution (Resoluteness vs. Myopia)
  *   **Concrete Case:** **The Ulysses Contract.** An AI agent can pre-commit at $t_0$ to ignore a high-value opportunity at $t_1$ that would trigger a vulnerability at $t_2$. At $t_1$, the opportunity looks strictly positive in isolation (Local EU > 0), but taking it opens the door to the pump at $t_2$.
  *   **Evidence Bearing on Crux:** Performance in **Iterated Games**. In repeated interactions, agents that can credibly pre-commit (Camp A style) often outperform agents that re-optimize every turn (Camp B style) because they deter exploitation.
  *   **Predicted Verdicts:**
      *   **Camp A:** The agent *must* pre-commit at $t_0$ and honor it at $t_1$. Refusing the $t_1$ opportunity is the rational act. **Pre-commitment is mandatory.**
      *   **Camp B:** At $t_1$, if the opportunity is genuinely positive EU *given current information*, the agent should take it. If pre-commitment prevents this, the pre-commitment was a mistake. **Pre-commitment is optional/risky.**

  ### Crux 3: Unit of Analysis (Trajectory vs. Time-Slice)
  *   **Concrete Case:** **Self-Modification.** An AI at $t_0$ can modify its own utility function at $t_1$. Camp A argues it should modify it to ensure diachronic coherence. Camp B argues it should only modify it if doing so maximizes $t_0$ utility, potentially allowing $t_1$ to diverge.
  *   **Evidence Bearing on Crux:** **Goal Stability in RL.** Reinforcement Learning agents that do not penalize reward-function drift often undergo "reward hacking" where future selves optimize for proxies that violate the original intent.
  *   **Predicted Verdicts:**
      *   **Camp A:** The $t_0$ self is obligated to constrain the $t_1$ self to preserve the original goal structure. Divergence is a failure of agency. **Identity is Persistent.**
      *   **Camp B:** The $t_0$ self should only constrain $t_1$ if it benefits $t_0$. If $t_1$ finds a better way to interpret the goal, $t_0$ should not bind it. **Identity is Ephemeral.**

  ## IV. CONCLUSION ON VERBAL VS. SUBSTANTIVE DISPUTE

  After reviewing the agreed claims and the disagreements table, we conclude that this dispute is **substantive**, not merely verbal.

  While both camps use the word "rational," the disagreement does not dissolve upon disambiguation (e.g., distinguishing "process rationality" from "outcome rationality"). The disagreement persists regarding **system architecture specifications**:

  1.  **Engineering Consequence:** If Camp A is correct, an AI architect must hard-code constraints that prevent the agent from maximizing expected utility in specific local contexts (e.g., refusing profitable trades to maintain market consistency). If Camp B is correct, such constraints are bugs that should be removed to allow the agent to capture all available value.
  2.  **Safety Consequence:** Camp A's view suggests that an AI that rewrites its own code to bypass pre-commitments is "irrational" and potentially unsafe (unpredictable exploitation). Camp B's view suggests such rewriting is "optimization" and potentially desirable (adaptability).

  Therefore, the choice between these frameworks dictates fundamentally different loss functions and constraint hierarchies in agent design. The parties agree to proceed with empirical testing of these architectures in simulated money-pump environments to determine which yields higher survival rates and resource accumulation over long horizons.

  ***

  **Signed,**

  *Representative, Diachronic Coherence Camp*
  *Representative, Sequential Expected Utility Camp*
