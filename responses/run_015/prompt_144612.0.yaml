answer: |-
  I reject (6).

  This step assumes a stable "exchange rate" between observing white shoes and observing black ravens. In Bayesian updating, the boost $\epsilon$ depends on your background knowledge $K$. As you observe white shoes, you update $K$ to reflect that "shoe-ness" and "raven-ness" are distinct natural kinds with independent property distributions. The marginal boost $\epsilon_n$ for the $n$-th shoe diminishes rapidly as you confirm this independence. You are not accumulating evidence about ravens; you are accumulating evidence that shoes are irrelevant to ravens. Thus, the sum of boosts does not converge to the informational value of a single raven observation. The armchair settlement fails because the relevance of the evidence vanishes upon learning the world's structure.

  Regarding your friend: This is a real effect, known as Good's argument. Whether a white shoe confirms $H$ depends on your prior probability distribution. If you treat colors as exchangeable across kinds, observing non-black objects increases the estimated frequency of non-blackness generally, which can *disconfirm* "All ravens are black". The standard reply (4) implicitly assumes a prior where the boost is positive but small; your friend highlights that different priors yield different signs. This confirms that (3) is not universally true, but even granting (3), (6) fails because the boost isn't stable.

  By rejecting (6), you preserve (1) and (2). Probabilism and the Equivalence Condition remain intact. You simply deny that irrelevant evidence accumulates to relevant certainty. You avoid (8) because universal generalizations about natural kinds require evidence about those kinds, not just logical complements. The "queasiness" is resolved not by denying the logic, but by recognizing that logical equivalence does not imply evidential equivalence relative to all background knowledge states.

  The cost is accepting that confirmation is sensitive to prior structure regarding natural kinds, not just logical form. This is a feature, not a bug. Step (5) is mathematically correct for independent evidence, but (6) misapplies it by ignoring the updating of independence assumptions themselves. Step (7) remains technically true (one observation nudges many hypotheses), but the nudges become negligible for unrelated kinds as knowledge grows. You can keep (1) and (2) and refuse (8) because the "package" in (5)–(7) relies on an unrealistic model of how evidence relevance persists across observations.
