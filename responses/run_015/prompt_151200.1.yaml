answer: |-
  There is no single, canonical term that captures every nuance of the phenomenon you describe, but it sits at the intersection of three well-established concepts in political philosophy and legal theory. The closest philosophical ancestor is **John Gray's conception of *Modus Vivendi***, the closest institutional model is **Chandran Kukathas's *Liberal Archipelago***, and the closest account of the reasoning structure is **Cass Sunstein's *Incompletely Theorized Agreements***.

  However, your description adds a specific layer of **engineered positive-sum trade** that distinguishes it from the standard "peaceful coexistence" interpretation of *modus vivendi*. Below is an analysis of the existing landscape, followed by the delineation of boundaries you requested.

  ### 1. The Existing Conceptual Landscape

  #### A. John Gray's *Modus Vivendi* (The Philosophical Foundation)
  In *Two Faces of Liberalism* (2000), John Gray explicitly distinguishes his view from Rawlsian overlapping consensus. For Gray, a *modus vivendi* is not merely a Hobbesian truce based on a balance of power (which would collapse if power shifted); it is a stable institutional arrangement that allows conflicting ways of life to coexist without requiring them to converge on a shared conception of the good.
  *   **Where it fits:** It accepts value pluralism and incommensurability. It requires no shared moral justification.
  *   **Where your description diverges:** Gray often frames *modus vivendi* as a solution to the problem of *conflict* (avoiding the worst). Your scenario describes a solution to the problem of *opportunity* (securing the best possible outcome given constraints). You describe a structure that generates **Pareto improvements** through trade, not just peace through separation.

  #### B. Chandran Kukathas's *The Liberal Archipelago* (The Institutional Model)
  Kukathas (2003) argues for a political order based on freedom of association rather than shared democratic principles. In his "archipelago," distinct communities maintain their own internal norms (even illiberal ones) provided they allow exit and do not coerce outsiders.
  *   **Where it fits:** It allows for incommensurable moral frameworks to operate in parallel jurisdictions without one subordinating the other.
  *   **Where your description diverges:** Kukathas focuses on *toleration as indifference*. Your scenario implies active **institutional redesign** to facilitate mutual benefit (trade), rather than mere non-interference.

  #### C. Cass Sunstein's *Incompletely Theorized Agreements* (The Reasoning Structure)
  Sunstein (1995) describes situations where people agree on a outcome or a rule but disagree on the fundamental reasons for it.
  *   **Where it fits:** It captures the "no convergence of belief" aspect.
  *   **Where your description diverges:** Sunstein usually discusses legal reasoning within a shared constitutional framework. Your scenario involves deeper moral incommensurability where the parties view each other's premises as *harmful*, not just different.

  ### 2. Delineating the Phenomenon

  Since your description refines these existing concepts into a specific mechanism of **cross-framework trade**, we can delineate the phenomenon by four necessary conditions. If any of these are missing, the arrangement falls into a different category (subordination, truce, or consensus).

  #### Condition 1: Radical Incommensurability (The Epistemic Boundary)
  The parties must lack a common metric of value. It is not enough that they have different preferences; they must evaluate the *same* institutional features using incompatible moral grammars (e.g., Deontological Purity vs. Utilitarian Welfare).
  *   **Boundary:** If both sides can agree that "maximizing welfare is good, but we disagree on how," this is a **Policy Dispute**, not your phenomenon. If one side says "Your welfare metric is morally blind," it is your phenomenon.

  #### Condition 2: Non-Endorsement (The Normative Boundary)
  Neither party treats the arrangement as *morally ideal* or *correct* from within their own framework. They view it as *permissible* or *pragmatically necessary*, but they do not revise their judgment that the other side's core values are mistaken.
  *   **Boundary:** This distinguishes it from **Rawlsian Overlapping Consensus**. In Rawls's model, a Catholic and a Secularist both endorse the political conception *as morally correct* from within their own doctrines. In your scenario, the Catholic might view the Secularist's domain as spiritually dangerous, even while accepting the treaty.

  #### Condition 3: Jurisdictional Integrity (The Structural Boundary)
  The arrangement must protect "non-negotiable constraints" within specific domains. The benefit received from the other side must be generated *outside* the protected domain.
  *   **Boundary:** This distinguishes it from **Standard Compromise**. In a standard compromise, both sides dilute their principles (e.g., "We will allow some of the forbidden action"). In your scenario, the forbidden action remains absolutely prohibited *inside* the jurisdiction; the gain comes from external trade.

  #### Condition 4: Positive-Sum Engineering (The Functional Boundary)
  The arrangement must yield a net benefit that exceeds isolation, derived from the *difference* in frameworks (comparative advantage), not merely the avoidance of violence.
  *   **Boundary:** This distinguishes it from a **Hobbesian Truce**. A truce stops the bleeding; your arrangement builds a bridge. If the only benefit is "we don't kill each other," it is a standard *modus vivendi*. If the benefit is "I get welfare gains I cannot generate, you get purity you cannot secure alone," it is your phenomenon.

  ### 3. Proposed Terminology

  If you require a label for this specific configuration, the most precise existing term is **"Structural Modus Vivendi."**

  However, to capture the specific mechanism of gaining value from moral difference without moral agreement, you might describe it as **"Institutionalized Moral Arbitrage."**
  *   **Arbitrage:** Profiting from price differences in different markets.
  *   **Moral:** The "price difference" is the incommensurability (what is costly/impossible for one is cheap/possible for the other).
  *   **Institutionalized:** It is baked into the rules, not a temporary exploit.

  ### 4. Distinguishing from Neighboring Concepts

  To ensure the concept's edges are sharp, here is how it differs from the most likely points of confusion:

  | Concept | Key Difference |
  | :--- | :--- |
  | **Overlapping Consensus (Rawls)** | **Endorsement.** In Consensus, both sides say "This arrangement is *good*." In your scenario, they say "This arrangement is *useful*, though the other side is *wrong*." |
  | **Hobbesian Modus Vivendi** | **Stability Source.** Hobbesian truces rely on threat equilibrium (if I get stronger, I attack). Your scenario relies on **institutional interdependence** (if I attack, I lose the benefit I cannot produce myself). |
  | **Principled Compromise** | **Value Dilution.** Compromise usually requires both sides to accept less of their core value (e.g., 50% prohibition). Your scenario allows **100% protection** of the core constraint within the domain. |
  | **Subordination / Hegemony** | **Symmetry of Gain.** In subordination, the minority survives at the pleasure of the majority. In your scenario, the majority *needs* the minority to supply the benefit (e.g., welfare gain) that the majority's own principles prevent it from generating directly. |
  | **Simple Coordination** | **Moral Stakes.** Coordination (e.g., driving on the left vs. right) is morally neutral. Your scenario involves **high-stakes moral constraints** (categorical imperatives vs. aggregate welfare). |

  ### 5. Summary of the Phenomenon's Edges

  For a negotiation to count as this specific kind of cross-framework trade, the following must hold:

  1.  **No Meta-Ethical Agreement:** There is no agreement on *why* the arrangement works, only *that* it works.
  2.  **No Internal Revision:** Neither community changes its internal moral code to accommodate the other; they only change their external institutional interface.
  3.  **Comparative Moral Advantage:** The benefit each side receives must be something they value highly but are structurally or morally inhibited from producing themselves, which the other side can produce without cost to its own core values.
  4.  **Durability without Conversion:** The stability of the arrangement must not depend on the hope that the other side will eventually convert to one's own moral framework.

  This is a sophisticated form of political realism that acknowledges the permanence of moral disagreement while rejecting the conclusion that such disagreement necessitates conflict or mere toleration. It treats moral difference not as an obstacle to be overcome, but as a **structural feature to be engineered around for mutual gain.**
