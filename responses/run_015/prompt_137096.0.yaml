  I'm in eleventh grade and I've trained dogs competitively since I was nine — 4-H obedience, then rally, and now agility with my border collie — so I'm fluent in my own world's vocabulary: shaping and successive approximations, markers, luring and fading the lure, stimulus control, proofing, generalization versus discrimination, extinction and extinction bursts, behavior chains, and the working distinction between a dog that performs for the reward and one that performs for the thing itself.

  I'd like the AI alignment discussion of inner alignment and goal misgeneralization restated in those terms, as faithfully as you can: the split between outer and inner alignment, the claim that a learner's competence can carry over into new situations while the thing it is aiming at does not, reward hacking, and the worry that a system's good behavior during training may rest on something other than the goal its designers intended. I especially want your take on a distinction I can see in my own work and can't find named in theirs. A dog that confidently does the wrong thing in a new place is plainly a generalization failure. But a dog that does exactly the right thing everywhere and would stop doing it the moment the reward stopped seems to me a different failure, and a worse one, because it looks like success right up until the reward disappears; the two get lumped together in everything I've read, and I don't think they should be.

  Then the residue report. Which of these claims translate cleanly into the vocabulary I gave you, which only survive being bent out of shape, and which cannot be expressed in it at all? I suspect one translation inverts on me: in my world the dog who works for the reward is the one I can steer, since I control the rewards, while the dog who works for the thing itself is the one I trust — but from what I gather, in a learning agent that ordering is reversed. If so, say precisely why. And where the vocabulary runs out, tell me honestly whether that is because training dogs is too coarse a frame for talking about what a system has learned to want, or because the alignment side is leaning on notions of "goal" and "inner" that would not survive being cashed out.
