          *   *Verdict:* Crucial for "reality."
      *   *Desideratum 3: Boundary Precision.* (When did it start/end?)
          *   *Analysis:* Demanding sharp boundaries is foolish. Fuzzy sets are better.
          *   *Verdict:* Distinguish "having a boundary" from "having a sharp boundary."
      *   *Desideratum 4: Cross-Cultural Coherence.* (Global vs. Regional.)
          *   *Analysis:* "Scientific Revolution" in China looks different. Demanding global synchrony kills the concept.
          *   *Verdict:* Regional variation is okay; global synchrony is too strong.
      *   *Desideratum 5: Explanatory Power.* (Does labeling it help predict/explain?)
