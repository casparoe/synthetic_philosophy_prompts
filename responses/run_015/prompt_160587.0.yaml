  **2. (i) The anti-mechanism argument of the Lucas-Penrose kind**
  *   **Score:** 5
  *   **Precondition:** C1 (effective axiomatizability of the mind) is the hardest to secure, as human cognition may not constitute a fixed formal system.
  *   **Justification:** The inference is logically valid given the premises, but the argument stands or falls entirely on the controversial mapping of human insight to a sound formal system.

  **Tier B: A disciplined analogy; most preconditions obtain and the stated conclusion is proportionate to them.**

  **3. (vi) The impossibility of a complete computable theory of rational play**
  *   **Score:** 20
  *   **Precondition:** C5 often conflates logical incompleteness with computational undecidability (Halting Problem), though the structural limit remains robust.
  *   **Justification:** In settings with source-code access, diagonalization creates genuine blind spots in decision theory, though these are often limits of computation rather than arithmetic truth.

  **4. (iii) The claim that a final theory in physics is impossible**
  *   **Score:** 40
  *   **Precondition:** C5 fails because mathematical undecidability does not necessarily entail physical unpredictability or empirical incompleteness.
  *   **Justification:** While a physical theory may be mathematically incomplete, the undecidable sentences may lack physical counterparts, leaving the possibility of empirical completion open.

  **Tier C: A suggestive metaphor that can still discipline thinking, but where at least one precondition clearly fails.**

  **5. (v) The constitutional self-amendment argument**
  *   **Score:** 75
  *   **Precondition:** C4 fails because legal consistency is maintained by political authority and judicial fiat rather than logical non-contradiction.
  *   **Justification:** Legal systems resolve self-referential paradoxes through hierarchy and power, not by acknowledging a permanent logical blind spot.

  **6. (iv) The Gödelian argument against self-certifying coherentism in epistemology**
  *   **Score:** 85
  *   **Precondition:** C1 fails because human belief systems are not effectively enumerable or fixed enough to constitute a formal axiomatic system.
  *   **Justification:** While circular justification is problematic, the failure is psychological and pragmatic rather than a consequence of proof-theoretic limits.

  **Tier D: Ornament; the conclusion would be entirely unaffected if the theorems were false.**

  **7. (vii) The codified-ethics argument**
  *   **Score:** 100
  *   **Precondition:** C2 fails because moral codes do not encode sufficient arithmetic to generate Gödel sentences.
  *   **Justification:** Moral indeterminacy arises from conflicting values and contextual nuance, not from the diagonalization of a rule set.

  **8. (viii) The literary or postmodern use**
  *   **Score:** 100
  *   **Precondition:** C1 fails because texts and discourses are not effectively axiomatizable systems with fixed rules of inference.
  *   **Justification:** Textual indeterminacy is a hermeneutic feature of language and interpretation, requiring no logical theorems to sustain the claim.

  ***

  The item whose tier would change most if a precondition were repaired is (iii), the claim that a final theory in physics is impossible. Currently, it sits in Tier B because C5 fails: mathematical undecidability does not automatically translate to physical unpredictability. If the claim were repaired to restrict the conclusion strictly to the *mathematical formulation* of the theory (i.e., "No consistent mathematical formulation of physics can be complete") rather than the physical completion of physics itself, C5 would be satisfied. This repair would move the item into Tier A, as the conclusion would then follow deductively from the incompleteness of the underlying mathematics without making an unwarranted leap to empirical reality.

  Across the eight items, C1 (effective axiomatizability) is doing the most discriminating work. It cleanly separates the computational and logical domains (Tiers A and B) from the humanistic and normative domains (Tiers C and D), where rules are evolving, implicit, or enforced by authority rather than syntax. However, the schema as stated might be too demanding in C2 (sufficient strength), as it requires encoding arithmetic; some valid structural analogies of self-reference exist in weaker systems (e.g., simple logical loops in law or language) that do not reach the threshold of Gödelian arithmetic but still exhibit meaningful incompleteness-like behavior.
