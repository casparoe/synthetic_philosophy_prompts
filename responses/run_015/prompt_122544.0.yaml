prompt: |-
  You are a professional philosopher who specializes in vagueness and the philosophy of language — like, someone who has actually taught this stuff, not a generalist who skimmed an encyclopedia entry — and who also reads a lot of literary fiction. Please think carefully here, do some brainstorming before you commit to an answer, and don't hedge everything into mush at the end. I'd rather have something worked-through than something smooth.

  My situation: I write novels. I'm finishing the third book of a trilogy about a woman named Marta who, over the course of the books, does a long series of things each of which is individually excusable — a lie to a friend, a small betrayal, a quiet bit of cruelty, an omission that costs someone their job — and readers keep asking me "is Marta a villain now?" and I honestly don't think my book decides that. Nothing in the prose settles it.

  In my workshop we have vocabulary for this. We call facts like that swing facts: facts about a character or a world that the text hasn't nailed down and that could still go either way in a later draft. And we have a rule, the Bellwether Rule, which we use when maintaining the continuity bible: a swing fact gets locked into the bible only if it holds in every version of the material we'd actually be willing to publish. If some publishable version has it and some publishable version doesn't, it stays a swing fact and we're forbidden from writing it down either way. (Otherwise we use ordinary craft talk: canon, retcon, diegetic, in-character/out-of-character, death of the author, character bible, negative capability.)

  Here's the job. Take the two big positions on vagueness — epistemicism (bivalence and classical logic both survive; there is a sharp cut-off somewhere, we just can never know where, because knowledge requires a margin for error and neighbouring cases in a sorites series are indiscriminable) and supervaluationism (a vague sentence is true only if it comes out true under every admissible precisification; borderline claims are neither true nor false; validity is preservation of that supertruth) — and translate each into the craft vocabulary above as faithfully as you can. I'm fluent in my vocabulary and a nervous beginner in yours, so explain the philosophy only as far as the translation needs it. Use Marta.

  Then the residue report, which is the part I actually want:

  1. What translates cleanly onto canon / swing-fact / retcon talk?
  2. What translates only with distortion — and specifically, where are you quietly smuggling in an assumption my vocabulary doesn't have, e.g. that the world of the novel is already complete and I'm discovering it rather than making it?
  3. What has no counterpart in my vocabulary at all? Three things I want you to press on: (a) iterated "definitely" — Marta is definitely a villain, definitely definitely a villain, and so on — does that ever stabilize, and what does it correspond to for me; (b) higher-order vagueness, i.e. the fact that which versions count as admissible is itself a swing fact — does that collapse the supervaluationist story or just move the bump in the carpet; (c) conditionals in the character bible, like "if Marta grew up in Lisbon then she speaks Portuguese" — I've half-heard that supervaluationism keeps modus ponens but that something breaks when you try to export a conditional out of a supposition. Check that for me, tell me if it's a myth, and tell me what it would look like in bible terms if it's true.
  4. And the bit I care most about: is my Bellwether Rule actually just supervaluationism wearing a cardigan, or is it something else in disguise — closer to epistemicism, or to a plain truth-value-gap view, or to "the author gets to decide"? Finally: does the residue point at something my workshop vocabulary is missing about unfinished fictional worlds, or is it evidence that the two positions are arguing about less than they seem to be?

  Be concrete, keep it about Marta, and don't just tell me "it's only a metaphor" — I want the translation to actaully do some work.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in vagueness/philosophy of language + avid reader of literary fiction. (Tone: rigorous but accessible, concrete, not hedging, willing to brainstorm).
      *   **User:** Novelist finishing a trilogy about "Marta" (a character accumulating small moral failures).
      *   **User's Vocabulary:** "Swing facts" (unsettled facts), "Bellwether Rule" (lock a fact only if it holds in *every* publishable version), "Canon," "Retcon," "Diegetic," etc.
      *   **Task:**
          1.  Translate Epistemicism and Supervaluationism into the User's craft vocabulary (using Marta).
          2.  Residue Report:
              *   What translates cleanly?
              *   What translates with distortion (smuggled assumptions)?
              *   What has *no* counterpart? (Specifically: iterated 'definitely', higher-order vagueness, conditionals/modus ponens).
              *   The Big Question: Is the Bellwether Rule just Supervaluationism in disguise? Or something else? Does the residue reveal something missing about *unfinished* worlds?

  2.  **Deconstruct the Philosophical Positions:**
      *   **Epistemicism:** Vagueness is ignorance. There *is* a fact of the matter (Marta *is* or *is not* a villain), but we can't know it. Sharp boundary exists. Bivalence holds.
      *   **Supervaluationism:** Vagueness is indeterminacy. Truth is "supertruth" (true on all admissible precisifications). Borderline cases lack a truth value. Bivalence fails (for borderline cases). Validity = preservation of supertruth.

  3.  **Deconstruct the User's Vocabulary:**
      *   **Swing Fact:** Undecided in the draft process. Could go either way in *future* revisions.
      *   **Bellwether Rule:** A fact is "Canon" (locked) only if it is invariant across all *willing-to-publish* versions. If Version A has it and Version B doesn't, it remains a Swing Fact.
      *   **Context:** The book is *unfinished* (finishing the third book). The "world" is being *made*, not discovered.

  4.  **Drafting the Translations (Mental Sandbox):**

      *   *Epistemicism -> Craft:* If Epistemicism is true, there is a "True Marta" hidden in the text. The author just doesn't know her yet. The "Villain" label is either True or False, even if the text is ambiguous.
          *   *Problem:* The author *makes* the text. Epistemicism assumes a pre-existing reality. This feels like a distortion immediately.
          *   *Translation:* "The Hidden Canon." There is a fact about Marta's villainy fixed by the current draft, even if the workshop can't agree. The Bellwether Rule is just a heuristic for finding the hidden fact.

      *   *Supervaluationism -> Craft:* A claim is "Canon" only if it's true in all admissible drafts. This sounds *exactly* like the Bellwether Rule.
          *   *Translation:* "The Invariant Canon." "Marta is a villain" is true only if she is a villain in every publishable draft. If some drafts have her as a villain and some as an anti-hero, the statement has no truth value (it's a Swing Fact).

  5.  **Addressing the Residue Report (The Core Work):**

      *   *1. Clean Translations:* Supervaluationism maps very well to the Bellwether Rule. "Admissible precisification" = "Publishable Draft." "Supertruth" = "Locked Canon."
      *   *2. Distortions/Smuggled Assumptions:* Epistemicism smuggles in "The World is Complete." It treats the draft as a window onto a fixed reality, whereas the novelist knows they are *building* the reality. Supervaluationism smuggles in "Admissibility is fixed." Who decides what draft is publishable?
      *   *3. No Counterparts:*
          *   (a) *Iterated Definitely:* In logic, $D(D(p))$ vs $D(p)$. In craft, this is "How sure are we?" But since the author *decides*, "definitely definitely" just means "I'm really not going to change this." It stabilizes when the manuscript goes to print.
          *   (b) *Higher-Order Vagueness:* Which versions are "publishable"? That's itself vague. In craft, this is "Editorial Dispute." It doesn't collapse the system; it just moves the decision to the Editor/Author gatekeeping level.
          *   (c) *Conditionals/Modus Ponens:* Supervaluationism validates Modus Ponens for supertruth, *but* the conditional "If P then Q" might not be supertrue even if P and Q are linked. Wait, standard supervaluationism *validates* MP but fails *Conditional Proof*. If $A \models B$, it doesn't mean $\models A \to B$.
              *   *Craft translation:* "If Marta grew up in Lisbon, she speaks Portuguese." In the bible, this is a rule. But if "Marta grew up in Lisbon" is a Swing Fact, can we assert the conditional? In Supervaluationism, the conditional might fail to be supertrue. In Craft, we write conditionals in the bible all the time *precisely because* the antecedent is a swing fact. This is a divergence.
      *   *4. The Big Question (Bellwether Rule):* It looks like Supervaluationism. But there's a crucial difference: Time/Process. Supervaluationism is static (all precisifications exist at once). The Bellwether Rule is dynamic (drafts over time). Also, the Author has a "God Mode" that Supervaluationism denies (the author can *make* it true by picking a draft).
      *   *Refinement on the Big Question:* The Bellwether Rule is actually a *decision procedure* for when to stop treating something as vague. It's pragmatic. Supervaluationism is semantic. The residue suggests the workshop vocabulary is about *production*, while philosophy is about *interpretation*.

  6.  **Developing the Argument (Iterative refinement):**

      *   *Epistemicism:* For the novelist, this is the "Death of the Author" view applied to their own work. It suggests the text has a meaning independent of their intent. That's uncomfortable for a creator.
      *   *Supervaluationism:* This fits the "Workshop" mindset perfectly. The "Admissible Precisifications" are the "Publishable Drafts."
      *   *The Twist:* The user asks about *unfinished* worlds. Philosophy of vagueness usually assumes the object exists (a heap, a bald man). A novel-in-progress *doesn't exist* fully yet. This is the key "Residue."
      *   *Conditionals:* I need to be careful here. Supervaluationism preserves classical logic for *supertrue* premises. But the conditional $P \to Q$ is supertrue only if true on all precisifications. If $P$ is true on some and false on others, the conditional might behave oddly. Actually, the famous result is that Supervaluationism validates MP ($A, A \to B \models B$) but invalidates Conditional Proof ($A \models B$ does not imply $\models A \to B$).
      *   *Craft equivalent:* If "Marta is in Lisbon" implies "Marta speaks Portuguese" in every draft, the rule holds. But if we treat the conditional as a Swing Fact itself... no, conditionals in bibles are usually rules. The breakdown happens if we try to infer the conditional's truth from the inference rule.
      *   *Higher-Order Vagueness:* In craft, this is "The Editor's Veto." Is *this* draft really publishable? That's vague. It doesn't collapse the system; it just means the "set of admissible drafts" is fuzzy.

  7.  **Finalizing the Stance on the Bellwether Rule:**
      *   It is *structurally* Supervaluationist.
      *   But it is *ontologically* different. Supervaluationism says the truth *is* the invariant. The Bellwether Rule says the invariant is the *criterion for writing it down*.
      *   The "Residue" is Agency. The philosopher asks "What is the truth?" The novelist asks "What do I commit to?"
      *   The "Missing Thing": The philosophy of vagueness assumes a static object. The novelist deals with a *becoming* object. The "Swing Fact" isn't just vague; it's *unrealized*.

  8.  **Tone Check:**
      *   Avoid mush. Take a stand.
      *   Show expertise in vagueness (mention Williamson, Keefe, etc., implicitly or explicitly).
      *   Show expertise in fiction (talk about drafts, bibles, canon).
      *   Keep it about Marta.

  9.  **Structure:**
      *   Introduction: Acknowledge the richness of the parallel.
      *   Translation Section: Epistemicism vs. Supervaluationism mapped to Craft.
      *   Residue Report (1-4): Addressing the specific prompts.
      *   Conclusion: The verdict on the Bellwether Rule and the nature of unfinished worlds.

  10. **Self-Correction during drafting:**
      *   *Correction:* Make sure I don't say Supervaluationism *rejects* Modus Ponens. It accepts MP as a rule of inference, but the Deduction Theorem (Conditional Proof) fails. I need to explain this clearly in craft terms.
      *   *Correction:* Don't let Epistemicism off the hook. It's a bad fit for creation, but a good fit for *reading*. I should distinguish between the Author's view and the Reader's view. The prompt implies the Author's view ("I write novels").
      *   *Refinement on Bellwether:* The Bellwether Rule defines *Canon*. Supervaluationism defines *Truth*. Are they the same? For a novelist, Canon *is* the Truth of the world. So yes, close. But the "admissible precisifications" are *future* possibilities for the novelist, whereas for the supervaluationist they are *contemporary* interpretations. This temporal aspect is crucial.

  11. **Final Polish:** Ensure the distinction between "Swing Fact" (process) and "Borderline Case" (semantic) is sharp. A Swing Fact *can* become fixed. A Borderline Case (for the epistemicist) is *already* fixed.

