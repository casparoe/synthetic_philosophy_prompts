          *   If "Noon" *is defined* as "When the clock strikes 12": Clock grounds Noon.
          *   User says: "In a world where the only clock reads twelve exactly when it is noon." This implies a correlation. Usually, time (Noon) is the fundamental physical fact; the clock is a representation.
          *   Verdict: Noon grounds the Clock fact. The clock's reading is grounded in the time (plus the clock's mechanism). The meeting's time is grounded in the position of the earth/sun. The clock merely tracks it.
