      *   *Refining the V3/V4 Conflict:* I need to explicitly tell the user they cannot have both V3 and V4 *as grounding claims*. V3 is metaphysical grounding. V4 is nomological explanation. I will advise overturning V4 *as a grounding verdict*. The cost is losing a unified notion of "explanation," but gaining metaphysical consistency.

  6.  **Addressing the New Cases:**
