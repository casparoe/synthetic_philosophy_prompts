      *   *2013 vs. 2015:* 2013 says you must meet the threshold *as it stands*. 2015 suggests that if you clear the hurdle (Rule 5) first, the lower hurdle (Rule 4) applies immediately *if done together*.
      *   *The Split Meeting Issue:* In 2015, the deletion of Rule 5 was effective *for the second motion*. In the current plan, the May motion happens *before* the effective date (1 Sept). So, at the May meeting, Rule 5 is arguably still active.
