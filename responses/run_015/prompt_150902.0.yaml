  2.  **Deconstruct the Precedents & Principles:**
      *   *2013:* Strict Entrenchment. You can't use the new rule to pass the new rule. To kill Rule 5, you need 3/4.
      *   *2015:* The "Same Meeting" Exception. If you kill Rule 5 *first* at the same meeting, the second motion only needs 2/3. This implies the change to Rule 5 takes effect *immediately* for the purposes of the second motion *at that meeting*, despite Rule 8 (effect 1 Sept). OR, it implies that once Rule 5 is gone, Rule 4 stands alone immediately.
      *   *2018:* Notice is substantive. You can't bypass notice requirements even for the amending rule.
      *   *2021:* Nuclear Option. If you delete *all* constraints (4 & 5), the inherent power (Charter) takes over (bare majority).
      *   *Tension:* 2013 says you need 3/4 to delete Rule 5. 2015 says if you delete Rule 5 (at 3/4), you can immediately use the new Rule 4 (2/3) *at the same meeting*. The current proposal splits this across *two meetings* (March & May) but with the *same effect date* (1 Sept).
      *   *The Crux:* Does the deletion of Rule 5 in March "take effect" in May? Rule 8 says amendments take effect 1 Sept. If Rule 5 is deleted in March, does it still constrain the May meeting (which is before 1 Sept)?
      *   *2015 Logic:* In 2015, both happened at once. The Chair overruled the PO that the second motion needed 3/4. This suggests that once Rule 5 is voted down, it's gone *for the purposes of that meeting*.
      *   *Current Logic:* March deletes Rule 5. May amends Rule 4. Both effective 1 Sept.
