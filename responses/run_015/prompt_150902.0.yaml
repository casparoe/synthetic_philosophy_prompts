answer: |-
  **To:** The Standing Orders Committee
  **From:** [Your Name/Role]
  **Subject:** Recommendation on Proposed Amendments to Rules 4 and 5
  **Date:** [Current Date]

  ### 1. Recommendation

  **The May amendment is likely ineffective under the proposed two-step, two-meeting schedule, and the Committee should advise against proceeding as planned.**

  **Reasoning:**
  While the 2015 precedent permits a two-step relaxation of amendment thresholds, it relies critically on both steps occurring at the **same meeting**. The current proposal splits the operation across two meetings (March and May) while deferring the effective date of both to 1 September (per Rule 8).

  Under the principle established in 2013, the validity of an amendment is assessed against the Standing Orders **as they stand at the time of the vote**. Rule 8 stipulates that amendments "take effect" on 1 September. Consequently, at the May meeting, Rule 5 remains legally operative because its deletion (carried in March) has not yet "taken effect." Therefore, any motion in May to amend Rule 4 is still subject to Rule 5's three-quarters requirement. A 70 per cent vote in May would be insufficient and subject to a successful point of order.

  The Committee should advise the Senate to consolidate both motions onto the agenda for the **May meeting**. Notice for both can be given at the March meeting. At the May meeting, the Senate should first vote to delete Rule 5 (requiring 3/4 support) and immediately thereafter vote to amend Rule 4 (requiring 2/3 support). This aligns precisely with the 2015 precedent, rendering the second motion valid despite Rule 5, because the deletion of Rule 5 is treated as operative for subsequent business within the same meeting.

  ### 2. Competing Principles

  Three principles can be derived from the four rulings, each predicting a different outcome for the May motion and the potential June rescission.

  **A. The "Fixed Status" Principle (Derived from 2013 & Rule 8)**
  *   **Theory:** The validity of a vote is determined by the rules in force *at the moment of the vote*. Rule 8 defers the *operation* of an amendment, meaning the old rules remain in force until the effective date.
  *   **Prediction for May:** The May motion is **invalid**. At the time of the May vote, Rule 5 is still in force (effective 1 Sept). Amending Rule 4 requires 3/4. 70% fails.
  *   **Prediction for June Rescission:** Irrelevant to validity. The May motion was void *ab initio*; rescinding the March motion merely confirms Rule 5 was never removed.

  **B. The "Transactional Continuity" Principle (Derived from 2015)**
  *   **Theory:** Once a motion to amend the Standing Orders is carried, the procedural landscape changes immediately for the purpose of subsequent business *within the same transactional unit (meeting)*. Rule 8 governs external operation, not internal procedural validity within the session.
  *   **Prediction for May:** The May motion is **invalid**. This principle is limited to a *single meeting*. Because the March and May meetings are distinct transactional units, the "immediate effect" logic of 2015 does not bridge the gap. Rule 5 constrains the May meeting.
  *   **Prediction for June Rescission:** If the March motion is rescinded, the basis for any claim that Rule 5 is "gone" is destroyed. The May motion falls.

  **C. The "Substantive Completion" Principle (Derived from 2021)**
  *   **Theory:** If the Senate clearly expresses an intent to amend its rules, and the ultimate state is achievable, procedural technicalities regarding thresholds should not frustrate the inherent power to regulate procedure (Charter power).
  *   **Prediction for May:** The May motion is **valid**. The Senate has clearly voted to remove Rule 5 (March). To require 3/4 in May would frustrate the clear will expressed in March.
  *   **Prediction for June Rescission:** If June rescinds March, the "clear intent" is withdrawn. The May motion becomes vulnerable, as the inherent power defaults to the last valid Standing Order (which would include Rule 5).

  ### 3. Closest Analog

  **The 2015 ruling is the closest analog, but it bears limited weight.**

  *   **Similarity:** Like the current proposal, 2015 involved deleting Rule 5 and lowering Rule 4's threshold. Like the current proposal, it relied on the deletion of Rule 5 to validate the subsequent lowering of the threshold.
  *   **Distinction:** In 2015, both motions occurred at the **same meeting**. In the current proposal, they are split across **two meetings**.
  *   **Weight:** The 2015 ruling gestures at a solution but does not settle the point for split meetings. The Chair's overruling of the point of order in 2015 established that Rule 5 does not constrain a second motion *if Rule 5 is deleted first in the same session*. It did not establish that a *carried but not yet effective* deletion constrains future meetings.
  *   **2013 Ruling:** This bears **greater weight** regarding the May vote. 2013 established that you must meet the threshold "as the Standing Orders stand." Since Rule 8 keeps Rule 5 standing until 1 September, the 2013 principle dictates the May vote fails.

  ### 4. Commitments Under Each Choice

  If the Committee advises that the split plan is valid, we commit to:
  *   **Validity Timing:** Validity is fixed at *passage*, not commencement. A motion carried in March changes the procedural reality in May, even if Rule 8 says the change is not "effective" until September.
  *   **Nature of Rule 5:** Rule 5 is a procedural hurdle, not a substantive lock. It can be bypassed by a prior vote, even if that prior vote is not yet operative.
  *   **Self-Validation:** An amendment can partially validate itself across meetings. The March motion validates the May motion, even though the March motion is not yet in effect.

  If the Committee advises that the split plan is invalid, we commit to:
  *   **Validity Timing:** Validity is assessed against the rules *operative at the time of the vote*. Rule 8 is substantive; until 1 September, the old rules apply.
  *   **Nature of Rule 5:** Rule 5 is a substantive lock until its deletion formally takes effect.
  *   **Self-Validation:** An amendment cannot validate itself across meetings. You cannot use a "future" rule to validate a "present" vote.

  ### 5. View on the Member's Objection

  **Would the single combined motion be effective at 70 per cent?**
  **No.** A single motion to delete Rule 5 *and* amend Rule 4 is, substantively, an amendment to Rule 4. Under the 2013 precedent, an amendment to Rule 4 requires 3/4 support while Rule 5 is in force. A 70 per cent vote would fail.

  **Is the two-step route a distrusted device?**
  It is a device, but not necessarily a fraudulent one. Parliamentary procedure often allows complex changes to be broken into sequential motions. However, the **timing** is the issue.
  *   **Same Meeting:** The two-step is a recognized mechanism (per 2015). It allows a 3/4 majority to unlock a 2/3 threshold.
  *   **Split Meetings:** This attempts to use the *expectation* of the first vote to validate the second before the first is operative. This is where the device becomes vulnerable.

  **Does Rule 5 achieve nothing?**
  **No, Rule 5 does work.** It prevents a simple 2/3 majority from lowering the threshold to a bare majority *in a single motion*. It forces the Senate to either:
  1.  Find a broader consensus (3/4) to change the threshold directly; or
  2.  Undertake a two-step process (Delete Rule 5, then Amend Rule 4).
  While the two-step process is possible, Rule 5 raises the transaction cost and political risk (e.g., the risk of rescission between steps). It prevents "snap" changes to the amendment threshold by a bare 2/3 majority. It ensures that relaxing the rules requires either a super-super majority (3/4) or a sustained majority over time.

  ### 6. A Safe Formulation

  To ensure the amendments are effective under every reading consistent with our precedents, the Committee should recommend the **"Same Meeting" Consolidation**.

  **The Procedure:**
  1.  **March Meeting:** Give notice for two motions to be moved at the May meeting: (a) Delete Rule 5; (b) Amend Rule 4 to simple majority.
  2.  **May Meeting:**
      *   Move Motion (a). Vote. (Requires 3/4).
      *   Move Motion (b). Vote. (Requires 2/3).
      *   *Crucial:* Both motions must be carried at this meeting.
  3.  **Effect:** Both take effect 1 September.

  **Why this is safe:**
  *   **Under 2013:** Motion (a) meets the 3/4 threshold required by Rule 5. Motion (b) meets the 2/3 threshold required by Rule 4.
  *   **Under 2015:** Because Motion (a) is carried *immediately before* Motion (b) at the same meeting, the 2015 precedent suggests Motion (b) is not constrained by Rule 5, even if it only received 2/3.
  *   **Under Rule 8:** Both take effect 1 September, satisfying the commencement rule.
  *   **Rescission Risk:** A Rule 7 rescission motion in June would still be possible (requiring 2/3), but this is a political risk inherent to any amendment, not a procedural validity risk.

  **Alternative (Slower but Safer):**
  Pass Motion (a) in March. Wait until **October** (after 1 September, when Rule 5 is formally gone) to pass Motion (b). This eliminates all ambiguity regarding Rule 8 but delays the change by a year.

  ### 7. Settling the Underlying Question

  To settle the underlying question for the future, the Senate should put on the record a **ruling on the interaction of Rule 5 and Rule 8 across multiple meetings.**

  **The Case:**
  The Committee should draft a specific Point of Order for the May meeting (if the Senate insists on the split plan) or the next time this arises: *"Does a motion to amend Rule 4, carried at a meeting subsequent to the carrying of a motion to delete Rule 5 but prior to the effective date of that deletion, require the three-quarters majority specified in Rule 5?"*

  **Preferred Resolution:**
  The Senate should adopt a clarifying amendment to Rule 8 or a new Interpretation Rule stating: *"For the purposes of voting on amendments to the Standing Orders, a motion to amend or delete a rule is deemed operative immediately upon being carried for the purpose of subsequent motions at the same meeting, but not for the purpose of motions at subsequent meetings prior to the effective date."*

  This codifies the 2015 precedent as a limited exception for single meetings and confirms the 2013 precedent for split meetings, removing ambiguity for future Senates.
