  ### Candidate Principles

  To anticipate your colleague's verdict, we must distil the normative commitments underlying her previous seven rulings. Her profile suggests a hybrid position: she is a formalist regarding epistemic logic (Cases 1, 2, 6, 7) but a pragmatic structuralist regarding solution concepts in strategic games (Cases 3, 4, 5). Three principles emerge that fit her record equally well:

  **1. The Qualitative Threshold Principle (The 'Rubinstein-Halpern' View)**
  Common Knowledge (CK) is a binary, qualitative state, not the limit of a sequence of Mutual Knowledge (MK). A system with MK of depth $k$ (for any finite $k$) is epistemically distinct from a system with CK. In coordination problems or scenarios relying on public announcements to generate CK (Cases 1, 6, 7), the absence of genuine CK causes the relevant induction to collapse entirely, regardless of how large $k$ is.
  *   *Field Status:* Settled in epistemic logic and computer science (e.g., Halpern & Moses 1990); contested in economics, where Monderer & Samet (1989) argue that 'common $p$-belief' can approximate CK outcomes for certain equilibria.

  **2. The Epistemic Bound Principle (The 'Brandenburger-Samet' View)**
  In games solved by iterated deletion or backward induction, the depth of rationality justification is quantitatively tied to the depth of mutual knowledge. $k$ levels of mutual knowledge of rationality support exactly $k$ rounds of iterated elimination. If the game requires $T$ steps and knowledge is depth $k < T$, the induction truncates at step $T-k$.
  *   *Field Status:* Settled within standard epistemic game theory (e.g., Samet 1987; Brandenburger et al. 2008). However, its normative force is contested by those who argue rationality is an ontic fact independent of knowledge hierarchies.

  **3. The Base-Sensitivity Principle (The 'Induction Structure' View)**
  The robustness of an inductive argument depends on where the epistemic chain breaks. If the *base case* of the induction lacks the requisite knowledge (Case 7: nobody knows the announcement was heard), the induction collapses entirely. If the *top case* (the final inference required for the first move) lacks knowledge, but the base is secure, the induction truncates rather than collapses (implied by Case 3: reputation models sustain cooperation until the epistemic horizon is reached).
  *   *Field Status:* Contested. Some theorists argue that without CK, the entire equilibrium selection is unstable (aligning with Case 1), while others accept truncated solutions as valid equilibria for the specific type structure.

  ---

  ### Application to Case 8

  **The Case:** 60-round Prisoner's Dilemma (PD). Endpoint and payoffs are Common Knowledge. Rationality is Mutual Knowledge to depth exactly 40. Players are ontically rational.

  **Prediction via Principle 1 (Qualitative Threshold):**
  Since CK of Rationality is required for the full Backward Induction (BI) argument (Case 2), and we only have MK depth 40, the BI argument is unsound. Because the gap is qualitative (Case 1), we cannot treat depth 40 as 'almost' CK.
  *   *Verdict:* **No determinate prediction** (or Cooperation throughout). The BI solution is unavailable.

  **Prediction via Principle 2 (Epistemic Bound):**
  BI requires unraveling 60 steps. We have 40 steps of knowledge. The unraveling proceeds from the end (Round 60) backwards until knowledge runs out. $60 - 40 = 20$. Rounds 21–60 are solvable; Rounds 1–20 are not.
  *   *Verdict:* **Defection from Round 21.** (Rounds 1–20 remain indeterminate or cooperative).

  **Prediction via Principle 3 (Base-Sensitivity):**
  In the PD, the 'base' of the induction is the final round (Round 60), where defection is dominant given CK of payoffs. This base is secure. The 'top' is Round 1, which requires depth 60. This fails. Unlike Case 7 (Muddy Children), where the *announcement* (the base) was noisy, here the *endpoint* (the base) is clear. Therefore, the induction should truncate, not collapse.
  *   *Verdict:* **Defection from Round 21.**

