  In drafting your model answer, you must clearly flag the following distinctions to avoid presenting contested positions as consensus:

  1.  **Mutual Knowledge and Backward Induction:**
      *   *Settled:* In standard epistemic models (e.g., Aumann, Brandenburger), $k$ levels of mutual knowledge of rationality are necessary and sufficient for $k$ rounds of iterated deletion of dominated strategies.
