      *   **Topic:** Brecht's *Life of Galileo* vs. Galileo's actual hermeneutics (specifically the "accommodation doctrine" found in the Letters to Castelli and Christina).
      *   **Core Question:** Does Brecht engage with Galileo's theological argument, or does he flatten it into social control? Is the Little Monk scene a secularized version of the accommodation problem? Is Brecht doing "better" or "worse" philosophy than Galileo?
      *   **Constraints:** No reading lists, no direct quoting of the play (user has the text), focus on the *argument*.
      *   **Tone:** Academic, peer-to-peer, critical, nuanced.

  2.  **Deconstruct the User's Thesis:**
