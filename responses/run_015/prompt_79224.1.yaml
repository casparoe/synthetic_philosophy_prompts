      *   **Point 4: Better or Worse Philosophy?**
          *   Galileo: Internal coherence. Saves phenomena *and* faith. But relies on a benign view of authority.
          *   Brecht: External critique. Exposes the power dynamics. But flattens the phenomenology of belief.
          *   Verdict: Brecht offers a *political epistemology* that Galileo lacks. Galileo asks "How do we read?" Brecht asks "Who benefits from how we read?"
          *   The "Truth-Telling as Class Act": This is the money shot. Galileo thinks truth is universal. Brecht shows truth-telling is a social practice with material conditions.
      *   **Conclusion:** Summarize. Brecht isn't refuting Galileo's theology; he's historicizing it. The play works best when read as a critique of the *social consequences* of the accommodation doctrine, which Galileo himself blinded himself to.

  5.  **Refining and Polishing (Self-Correction during drafting):**
