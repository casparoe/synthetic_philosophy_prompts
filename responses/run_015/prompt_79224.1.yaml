      *   *Nuance:* Ensure I don't just say "Brecht is a Marxist." Explain *how* that lens changes the hermeneutic.
      *   *Key Insight:* The user asked if Brecht stumbled onto the objection without noticing it's theological. I should argue Brecht noticed it exactly *because* it was theological—he saw the theology as ideology.

  6.  **Final Review against User Prompt:**
