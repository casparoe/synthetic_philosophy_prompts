          *   The miss: Galileo thinks this protects their salvation; Brecht thinks this ensures their exploitation. The Monk isn't worried about cosmology; he's worried about hope.
      *   **Point 2: Paternalism and Epistemic Class.**
          *   User's insight: Accommodation implies some can handle truth, some can't.
          *   Galileo: The "dimostrazione" is an aristocratic skill. The Church fears this aristocracy of knowledge.
          *   Brecht: Galileo *becomes* the aristocrat. By recanting, he betrays the *function* of the scientist (to serve the people), not just the truth.
          *   Brecht's critique: Galileo's hermeneutic is too idealistic. It assumes truth *trickles down*. Brecht says truth is hoarded or weaponized.
      *   **Point 3: The Church in the Play.**
          *   Does the play let the Church be more than cynical?
          *   The Inquisitor/Cardinal scenes. They understand the *social function* of the cosmos better than Galileo does. They know a static earth stabilizes the social order.
