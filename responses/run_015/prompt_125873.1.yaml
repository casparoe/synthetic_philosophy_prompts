      *   *Rival 1 (Innate Preferences):* Predicts stability across time/culture once barriers are removed.
      *   *Rival 2 (Structural Barriers):* Predicts gaps shrink as equality rises.
      *   *User's View:* Predicts gaps *widen* specifically when *other* identity markers (class/religion) fade, not just when "equality" rises. Predicts high identity salience in egalitarian nations. Predicts choices in low-prestige fields (where utility is low) will be *more* gendered.

  6.  **Proponent Concessions:**

      *   A smart proponent would admit it's not the *only* factor. They would concede that economic utility still matters somewhat. They would concede measurement error in "egalitarianism."

  7.  **Assessing Unfalsifiability:**

      *   *Risk:* "Identity" is slippery. If gaps widen, it's signaling. If gaps narrow, maybe class distinctions came back?
      *   *Mitigation:* Needs operationalizable metrics for "identity distinctiveness" and "class flattening."
      *   *Fatal?* Not necessarily, if it generates novel predictions. But it walks a fine line.

  8.  **Drafting the Response (Iterative refinement):**

