          4.  Concessions a committed proponent would make.
          5.  Assessment of unfalsifiability risk (and whether it's fatal).

  2.  **Analyze the Core Thesis (Symbolic Gender Differentiation):**

      *   *Mechanism:* Identity signaling > Economic utility.
      *   *Context:* High egalitarianism + Low class/religious stratification.
      *   *Outcome:* Wider occupational gender gaps.
      *   *Underlying Logic:* Social Identity Theory / Signaling Theory. When other badges of identity are removed, gender becomes the "last man standing" for differentiation.

  3.  **Brainstorming Defeaters (Conditions for Failure):**

      *   *Comparative Data:* If GEP disappears in non-Western egalitarian societies where class/religion *haven't* flattened? If GEP appears in highly stratified societies? If specific occupations don't fit the "signaling" mold (e.g., low prestige jobs)?
      *   *Psychological Findings:* If individuals explicitly state economic utility is their driver (and believe them)? If identity measures don't correlate with career choice? If "gender centrality" is low in egalitarian nations?
      *   *Historical Cases:* If historical periods of low class distinction didn't show high gender differentiation in work?
      *   *Formal Patterns:* If the correlation between egalitarianism and segregation is non-linear or disappears when controlling for welfare state type?

  4.  **Categorizing Defeaters (Decisive vs. Awkward):**

      *   *Decisive:* Data showing the paradox *doesn't exist* when controlling for the proposed mechanism. Evidence that people aren't signaling identity.
