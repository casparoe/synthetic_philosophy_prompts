answer: |-
  ### I. Logical Space & Position Mapping

  **Dimensions:**
  1.  **Import:** Evidential (E) vs. Practical/Null (P).
  2.  **Class:** Restricted (R: Humans) vs. Broad (B: All Minds).
  3.  **Unit:** Person (P) vs. Observer-Moment (M).
  4.  **Weighting:** SSA (Dilution) vs. SIA (Existence) vs. Balanced (Bal).

  **Occupied Regions (Required Leaves):**
  *   **Deflationary / No-Update:** (P, —, —, —). *Note: Tree does not separate these; see footer.*
  *   **Doomsday (DA):** (E, R, P, SSA).
  *   **Presumptuous Philosopher (PP):** (E, B, P, SIA).
  *   **Cancellation:** (E, B, P, Bal).
  *   **SSSA:** (E, B, M, SSA).

  **Unoccupied Regions:**
  *   **(E, R, P, SIA):** *Incoherent.* SIA requires counting all possible observers to boost priors; Restricted class blocks this.
  *   **(E, R, M, SSA):** *Unattractive.* Counting moments within a biologically restricted class lacks motivation (why temporal parts if not all minds?).
  *   **(E, B, M, SIA):** *Unclaimed.* SIA typically applied to observers; applying to moments yields extreme "instantaneous" presumptuousness.
  *   **(P, R, P, SSA):** *Incoherent.* If import is only practical, sampling assumptions (SSA) cannot drive credence updates.

  ***

  ### II. Anthropic Reasoning Decision Tree

  **START:** You accept that finding yourself as *this* person at *this* time *might* bear on world size/longevity.

  **NODE 1: The Sealed Vaults (Import)**
  *Case:* Two hypotheses differ only in observer count in epochs causally sealed from yours. No bet or policy turns on this.
  *   **Q:** Do your *credences* shift toward the larger world, or only your *dispositions* (if at all)?
      *   **Only Dispositions/None:** → **LEAF: Deflationary / No-Update.**
          *   *View:* Indexical facts are either truth-valueless (Deflationary) or likelihood-neutral (No-Update).
          *   *Longtermism Flag:* ⚠️ **CRITICAL.** If anthropics is non-evidential, EV estimates depend entirely on causal decision theory, not credence shifts.
      *   **Credences Shift:** → Go to Node 2.

  **NODE 2: The Uplift (Reference Class)**
  *Case:* The extra observers in the larger world are alien minds or simulations, not biological humans.
  *   **Q:** Do these non-human observers belong in the reference class for sampling?
      *   **No (Humans Only):** → Go to Node 4 (SSA Path).
      *   **Yes (All Minds):** → Go to Node 3.

  **NODE 3: The Many-Nows (Sampling Unit)**
  *Case:* Same number of persons, but on one hypothesis a single subject has your evidence 1000 times (1000 moments), on the other 1000 subjects have it once.
  *   **Q:** Is the sampling unit the *whole person* or the *observer-moment*?
      *   **Observer-Moments:** → **LEAF: SSSA (Self-Sampling Assumption).**
          *   *View:* You are a random sample from the set of all observer-moments.
          *   *Longtermism Flag:* ⚠️ **HIGH.** Penalizes long futures with high population density per unit time.
      *   **Whole Persons:** → Go to Node 4.

  **NODE 4: The Archivist (Weighting Principle)**
  *Case:* Civilization A has 10¹¹ observers (all like you). Civilization B has 10²¹ observers (first 10¹¹ like you, rest later).
  *   **Q:** How does the sheer number of observers affect the likelihood of the hypothesis?
      *   **SSA (Dilution):** Being *you* is less likely in B (you are a smaller fraction of the total). → **LEAF: Doomsday Argument.**
          *   *View:* Favors smaller/shorter worlds where you are less "diluted."
          *   *Longtermism Flag:* ⚠️ **NEGATIVE.** Drastically reduces EV of long-term futures (we are likely early).
      *   **SIA (Existence):** B is more likely simply because it contains more observers like you (existence is evidence). → **LEAF: Presumptuous Philosopher.**
          *   *View:* Favors larger/longer worlds because you are more likely to exist in them.
          *   *Longtermism Flag:* ⚠️ **POSITIVE.** Drastically increases EV of long-term futures (more observers = more likely).
      *   **Balanced:** SIA prior boost cancels SSA likelihood dilution. → **LEAF: Cancellation.**
          *   *View:* Net anthropic update is zero; rely on non-indexical priors.
          *   *Longtermism Flag:* ✅ **NEUTRAL.** Anthropic reasoning does not alter baseline existential risk estimates.

  ***

  **FOOTER: Unseparable Leaves**
  *   **Deflationary vs. No-Update:** This tree groups these at Node 1. They are separated only by metaphysical commitment (whether indexical propositions express truth-apt content), not by decision-theoretic output on this instrument.
  *   **Node 2 (SSA Path):** If you answer "No" at Node 2, you are funneled to Doomsday (Node 4, SSA). There is no "Restricted Cancellation" leaf because SIA is incoherent with a Restricted Class (see Logical Space).
