      *   Harsanyi's theorem relies on the linear independence of utility functions or the geometric interpretation of the Pareto set.
      *   The theorem states: If $\succeq_i$ are represented by $V_i$, and $\succeq_0$ satisfies Pareto, then $V_0 = \sum a_i V_i$.
