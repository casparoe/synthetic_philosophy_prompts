answer: |-
  If Chase and Sanborn are correct, the concept of qualia is akin to "phlogiston"—a theoretical term referring to nothing because its definition is internally contradictory.

  **Implications & The Hard Problem**
  This position **dissolves** the Hard Problem rather than shifting it. The Hard Problem asks how physical processes generate non-physical feels. If "non-physical feels" are incoherent, the question is a category error, like asking "what is the weight of jealousy?" The mystery doesn't shift onto structural-functional descriptions; instead, those descriptions become the *exhaustive* account of reality. The remaining task is explaining why humans persistently *believe* they have qualia (the illusion), which becomes an Easy Problem of cognitive architecture.

  **The Swarm Twist**
  Their incoherence claim implies that attributing qualia to the swarm was **always conceptually broken**. It does not matter if the system is a single neuron, a human brain, or a pain-mirroring swarm. If the term "qualia" fails to pick out any coherent property, you cannot attribute it to anything. The swarm example merely highlights that functional isomorphism (pain-behavior) is all that exists. There is no "extra" fact of the matter about whether the swarm "really" feels pain, because "really feeling" (in the qualia sense) is a nonsense phrase. The reality is purely the dynamics themselves.
