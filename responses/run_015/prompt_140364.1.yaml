answer: |-
  This is a sophisticated impasse, and your suspicion is well-founded. You are observing a classic case of **model-mechanism conflation**, which manifests as a verbal dispute but masks a substantive disagreement about the boundaries of the explanatory system.

  Here is the diagnosis, followed by the conditions for progress.

  ### 1. Diagnosis: Ill-Posed Question via Model-Mechanism Conflation

  The question *"Must honest signals be wasteful?"* is ill-posed because the term "wasteful" oscillates between a **mathematical property of an equilibrium** and a **physiological property of a mechanism**.

  *   **Camp 1 (Zahavians)** are asking a **mechanistic question**: "What physical substrate guarantees honesty?" Their answer is physiological depletion (metabolic cost, predation risk). For them, "cost" means *net fitness reduction relative to a baseline of silence/invisibility*.
  *   **Camp 2 (Grafenians)** are asking a **structural question**: "What mathematical condition guarantees a separating equilibrium?" Their answer is the *Single-Crossing Property* (differential marginal costs). For them, "cost" means *the slope of the cost function relative to quality*.

  **The Verbal Layer:**
  They are using the word "cost" to refer to two different variables.
  *   Zahavians measure **Total Cost** (Energy burnt + Risk taken).
  *   Grafenians measure **Marginal Cost** (The change in fitness per unit of signal increase).
  Grafen's 1990 formalization proved that honesty requires the latter, not necessarily the former (in the sense of net loss). A signal can be beneficial overall (net positive) but still honest, provided it is *relatively* more expensive for a low-quality individual to produce than a high-quality one. The Zahavian camp is hunting for a "net loss" that the mathematics does not require, while the Grafenian camp is dismissing the "net loss" hunt as unnecessary, sometimes overlooking that physiological waste is the most common *instantiation* of the mathematical condition in nature.

  **The Substantive Layer:**
  The disagreement is about **system boundaries**.
  *   Zahavians draw the boundary around the **signaller's body**. If the cost isn't internal (metabolic/predation), it doesn't count as a handicap.
  *   Grafenians draw the boundary around the **signalling interaction**. If the cost stabilizes the equilibrium (whether internal or external), it counts.

  **Your "Policed Ornament" Case:**
  This case breaks the Zahavian definition but satisfies the Grafenian condition.
  *   **Production Cost:** Low (cheap badge).
  *   **Enforcement Cost:** High for low-quality signallers (they get chased/beaten).
  *   **Marginal Cost Structure:** The marginal cost of "wearing the badge without the muscle" is effectively infinite for a weak individual (due to punishment) but low for a strong one (who can win the fight).
  *   **Diagnosis:** This is a **conventional signal with social enforcement**, not a physiological handicap. The Zahavian camp rejects it as data for the Handicap Principle because the cost is external. The Grafenian camp accepts it because the incentive structure is identical.

  **Verdict:** The impasse is **structural**. It is a difference over **which cases count as data** driven by an **ill-posed question**. The question assumes "handicap" is a natural kind (like "water" or "gene"), when it is actually a **functional description** that can be realized by multiple mechanisms (physiological waste, social punishment, indexical constraint).

  ### 2. Why No Progress Has Occurred

  Progress is impossible under the current framing because both camps are trying to win a **ontological argument** ("What *is* a handicap?") using **empirical evidence** ("Look at this bird's tail").

  *   **Camp 1** finds a cheap signal and says, "Theory falsified."
  *   **Camp 2** finds a cheap signal and says, "Mechanism different, logic identical."
  *   **Camp 1** replies, "Then it's not a handicap."
  *   **Camp 2** replies, "Then your definition is too narrow."

  They are talking past each other because Camp 1 defines the theory by its **historical mechanism** (Zahavi's waste), while Camp 2 defines it by its **logical topology** (Grafen's equilibrium). You cannot settle a definition with a metabolic measurement.

  ### 3. What Would Count as Progress?

  To break the deadlock, the group must stop asking "Is this a handicap?" and start asking "How is honesty maintained?" Progress requires three specific shifts:

  #### A. A Formal Result (Clarification, not new math)
  You need a consensus statement on the relationship between **Net Cost** and **Marginal Cost**.
  *   *The Result:* Grafen's model allows for signals that are net beneficial (positive fitness impact) but still honest. However, in many biological contexts, net cost is the easiest way to ensure differential marginal cost.
  *   *The Shift:* Camp 1 must admit that "waste" is a *sufficient* but not *necessary* condition for honesty. Camp 2 must admit that "waste" is the most *empirically common* instantiation of the condition in non-human animals.

  #### B. A Taxonomy of Honesty Mechanisms
  Instead of one bucket ("Handicap"), you need three distinct buckets. This resolves your "policed ornament" problem immediately.
  1.  **Physiological Handicaps:** Cost is internal (metabolic/predation). (Zahavi's domain).
  2.  **Index Signals:** Cost is physically impossible to fake (e.g., deep voice requires large larynx). No "waste," just constraint.
  3.  **Conventional Signals with Enforcement:** Cost is external (social punishment). (Your "policed" domain).

  *Progress Condition:* The group agrees that "Handicap Principle" refers specifically to **Category 1**, while "Signalling Theory" encompasses all three. If Camp 1 insists that Category 3 is *also* a Handicap, they must justify why the *source* of the cost matters more than the *structure* of the cost.

  #### C. The Critical Experiment
  You suggested: *"An experiment that holds receiver response fixed while varying production cost."*
  This is the correct intuition, but it needs refinement. The experiment should decouple **Production Cost** from **Consequence Cost**.
  *   **Design:** Manipulate the signal so that it becomes metabolically cheap for *everyone*, but keep the social/physical consequences for faking intact.
  *   **Prediction (Zahavi):** Honesty collapses because the "waste" is gone.
  *   **Prediction (Grafen):** Honesty persists because the differential cost (via punishment) remains.
  *   **Real-world example:** Artificially enhancing a badge (e.g., painting a wasp's stripes). If rivals attack the painted wasps because they signal dominance they can't back up, the cost is external. If the system remains stable, the Zahavian "waste" requirement is falsified. (Note: This has been done in wasp literature; results generally favor the Grafenian/enforcement view).

  ### 4. Is Progress Expected?

  **Yes, but only if the question changes.**

  If the group continues to ask *"Is the Handicap Principle true?"*, **no progress should be expected**. This is because the "Handicap Principle" has become a **floating signifier**.
  *   For philosophers and game theorists, it is a theorem about differential costs.
  *   For field biologists, it is a heuristic about extravagant ornaments.

  As long as these two definitions are conflated, every empirical paper will be interpreted differently by the two camps. A paper showing a cheap signal is a "falsification" to one and a "refinement" to the other.

  **The Path Forward:**
  Propose a **semantic stipulation** for the reading group:
  > "Let us define 'Handicap' strictly as Zahavi did (physiological waste). Let us define 'Strategic Signalling' as Grafen did (differential marginal cost). Let us then categorize our case studies (birds, gazelles, humans) into these buckets."

  If they do this, the impasse vanishes. You will likely find that:
  1.  Many "handicaps" are actually indices.
  2.  Many human displays are policed conventions.
  3.  True physiological handicaps are rarer than Camp 1 thinks, but more significant than Camp 2 admits.

  **Summary:** The dispute is verbal on the surface (definitions), substantive in the middle (mechanisms), and ill-posed at the core (the question assumes a binary where there is a spectrum). Progress requires dissolving the binary into a taxonomy. If they refuse to decouple the *math* from the *metabolism*, you are witnessing a Kuhnian incommensurability, and you should stop expecting resolution and start documenting the divergence.
