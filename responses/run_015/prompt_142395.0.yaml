      *   8 objections? Yes.
      *   Ordered by Likelihood $\times$ Damage? Yes.
      *   Phrased as audience? Yes.
      *   2-minute reply? (Will keep concise).
      *   Note on soft spot? Yes.
      *   Empirical reliance/Fatal finding/Confidence? Yes.
      *   Concession/Critical Reply/Feared Question? Yes.

  8.  **Final Polish:** Ensure tone is professional, strategic, and empathetic to the audience's values while maintaining the thesis's edge. (Self-Correction: Make sure the "Fatal Finding" is specific and empirical, not philosophical).

      *Refining Objection 1:* Make it sound like a Conservation Biologist worried about their NGO's mission.
      *Refining Objection 2:* Make it sound like an Ecological Economist worried about model robustness.
      *Refining Objection 4:* Make it sound like the Animal Welfare Scientist worried about moral patient definition.

      *Critical Reply:* The "Flow vs. Stock" distinction is the theoretical engine. If they reject this, the NPP metric is irrelevant.
      *Concession:* Admit the "sign" of welfare (positive vs negative) is the biggest uncertainty, not just the magnitude.
      *Feared Question:* The "Intervention" question is the classic trap for negative utilitarianism in wild contexts.

      *Let's assemble the document.*

      *(Self-Correction during drafting)*: Wait, the prompt asks for "Likelihood times Damage". The "Deforestation" objection is high damage but might be lower likelihood if I frame it carefully. The "Measurement" objection from Economists is very high likelihood and high damage to the *utility* of the paper. The "Invertebrate" question is high damage because it changes the scale by orders of magnitude. I need to weight these carefully.
      Actually, the Conservation Biologists are the majority. Their reaction determines the room's temperature. The "You are helping loggers" objection is the most dangerous emotionally. I will keep that #1.
      The Economists need a number. If I can't give uncertainty bounds, the paper is useless to them. That's #2.
      The Welfare Scientist cares about the moral status of the individuals. #3.

      *Let's finalize the list.*
      1. Policy/Slippery Slope (Conservationists)
      2. Uncertainty/Bounds (Economists)
      3. Valence of Experience (Conservationists/Biologists)
