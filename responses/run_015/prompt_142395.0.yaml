          *   Singleton: 1 Animal-Welfare Scientist (values: individual suffering, welfare metrics).
      *   **Thesis:** Habitat conversion/degradation can *reduce* net wild-animal suffering (NWAS) because suffering is concentrated in high-fecundity species' early deaths, which track Net Primary Productivity (NPP) more than richness/naturalness. Preserved land $\neq$ automatically welfare-positive.
      *   **Argument Structure:** 1. Welfare is a flow (births/deaths), not stock. 2. Suppression vs. Substitution vs. Extinction matter. 3. Counterfactual land use matters (suffering/NPP).
      *   **Deliverables:**
          *   Q&A Prep Sheet with ~8 objections (ordered by Likelihood $\times$ Damage).
          *   Phrased as the audience members would speak.
          *   2-minute reply for each.
          *   Note on where the reply is soft.
          *   Empirical reliance assessment per objection.
          *   One fatal finding per objection.
          *   Confidence level on the ordering.
          *   Which concession to make in the talk.
          *   Which single reply is critical (paper fails if it doesn't land).
          *   The question I'm privately hoping nobody asks.

  2.  **Deconstruct the Audience & Thesis Tension:**
      *   *Conservation Biologists:* Will feel attacked. Their core metric (biodiversity/integrity) is being decoupled from moral value. They view "nature" as intrinsically good. They will worry about slippery slopes (justifying deforestation).
      *   *Ecological Economists:* Will want the math. How do you value a bird vs. a mouse? What are the error bars on the suffering estimates? Is this cost-benefit analysis compatible with existing frameworks?
      *   *Animal Welfare Scientist:* Will worry about the aggregation of suffering, the moral status of invertebrates vs. vertebrates, and the "replaceability" argument.
      *   *Thesis Risk:* It sounds like an argument for destruction. It relies heavily on the "life is net negative" assumption for wild animals (r-strategists). It assumes NPP correlates with suffering linearly.

  3.  **Brainstorming Objections (filtering for *this* audience):**
      *   *Idea:* "You're justifying deforestation." (Conservationists) -> High likelihood, High damage.
      *   *Idea:* "How do you measure suffering?" (Welfare/Econ) -> High likelihood, High damage.
      *   *Idea:* "What about ecosystem services?" (Econ/Conservation) -> Medium likelihood, Medium damage.
      *   *Idea:* "Invertebrates count." (Welfare) -> Medium likelihood, High damage (blows up numbers).
      *   *Idea:* "Evolutionary fitness implies life is worth living." (Conservation/Bio) -> High likelihood, Medium damage.
      *   *Idea:* "Uncertainty bounds are too wide." (Econ) -> High likelihood, High damage.
      *   *Idea:* "Long-term stability vs. short-term flux." (Conservation) -> Medium likelihood, Medium damage.
      *   *Idea:* "Moral value of existence itself." (Conservation/Phil) -> Low likelihood (this isn't a phil seminar), High damage.
      *   *Idea:* "What about the counterfactual?" (Already in thesis, but will be challenged on specifics).

  4.  **Selecting and Ordering the Top 8 (Likelihood $\times$ Damage):**
      1.  *The "Justification for Destruction" Objection (Conservationists):* "Are you giving loggers a moral argument?" (Highest damage to credibility).
      2.  *The "Measurement/Aggregation" Objection (Econ/Welfare):* "How do you compare a mouse's death to a deer's? What are the error bars?" (Crucial for decision relevance).
      3.  *The "Life is Worth Living" Objection (Conservationists):* "Evolution selects for fitness; animals want to live." (Core worldview clash).
      4.  *The "Invertebrate Elephant" Objection (Welfare/Bio):* "If you count insects, your NPP metric explodes, but do you really mean to say we should farm bugs?" (Empirical minefield).
      5.  *The "Ecosystem Resilience" Objection (Conservationists):* "Suffering might be lower now, but what when the system collapses?" (Long-term vs. short-term flow).
      6.  *The "Counterfactual Specifics" Objection (Econ):* "What if the alternative is high-intensity agriculture with pesticides vs. low-intensity?" (Nuance on land use).
      7.  *The "Rights/Integrity" Objection (Conservationists):* "Nature has rights regardless of sentience." (Value mismatch).
      8.  *The "Intervention Feasibility" Objection (Welfare):* "If suffering is high, why not fix nature rather than destroy it?" (Puts the thesis in a box).

      *Refining the Order:*
      1.  *Slippery Slope/Policy:* "Are you arguing for deforestation?" (Conservationists).
      2.  *Measurement/Uncertainty:* "Where are the error bars on suffering per NPP?" (Economists).
      3.  *Valuation of Life:* "Don't animals prefer life to death?" (Conservationists).
