  ### What kind of disagreement is this?

  This is a multi-question disagreement masked as a single metaphysical dispute. Lewis and Kripke are not answering the same question under different theories; they are addressing distinct explanatory roles under the heading of identity. Lewis addresses the semantics of modal discourse: how we evaluate truth conditions for de re claims across worlds. Kripke addresses the metaphysics of grounding: what makes an entity the very thing it is. The stall occurs because these questions converge on natural kinds but diverge on institutional entities. For natural kinds, semantic evaluation and metaphysical grounding often align, masking the distinction. For institutions, they come apart: the semantic conditions for calling a corporation the same (legal continuity) differ from the metaphysical conditions of its constitution (membership, rules). Your hypothesis is correct: the disagreement is about which kinds of entities should serve as the data for modal metaphysics. The Lewisian framework assumes entities are defined by qualitative profiles, suitable for artifacts. The Kripkean framework assumes entities possess haecceities, suitable for organisms or persons. Institutions possess neither; they possess normative statuses. Therefore, the dispute is ill-posed when generalized across all ontological categories. It is not merely verbal, as the theoretical commitments are substantive, but it is categorically confused. Treating it as a single debate about transworld identity obscures the fact that identity functions differently across ontological domains. The impasse is sustained by the false presumption that a single theory of identity must cover tables, tigers, and treaties equally. Recognizing this as a multi-question disagreement dissolves the necessity of choosing one side universally, allowing for domain-specific applications instead. The verdict is that the debate is substantive but misallocated; it treats a pluralistic reality as a monistic problem, forcing a choice where none is required if the domain is properly specified.

