  ### The anatomy of the stall

  The stalemate persists because Lewis and Kripke prioritize conflicting theoretical virtues regarding modality. Lewis sacrifices strict identity to preserve modal flexibility, analyzing de re modality via counterpart relations based on similarity across worlds. Kripke sacrifices flexibility to preserve rigid designation, insisting transworld identity is primitive and intuitions about origins are binding. Objections fail to advance the dispute because they are internal to each framework's cost-benefit analysis. When Kripkeans argue counterpart theory makes origins too contingent, Lewisians reply that such contingency is a feature, not a bug, of accurate modal evaluation. Conversely, when Lewisians argue transworld identity forces implausible essentialism about material constitution, Kripkeans reply that our intuitions about constitution are simply mistaken compared to logical necessity. Each side accepts the other's logical consistency but rejects their starting phenomenology. Consequently, the debate functions as a ritualized exchange of counterexamples rather than a search for common ground. The impasse is not logical but axiological: it rests on whether one values semantic parsimony and world-bound identity (Lewis) or intuitive fidelity to ordinary modal speech and rigid designation (Kripke). Without a neutral arbiter for these virtues, the arguments circle indefinitely. Each side reinforces its own presuppositions while treating the other's core commitment as a reductio, rendering the dispute immune to standard argumentative resolution because the criteria for success are themselves the subject of disagreement. The ritual persists because neither side can concede their core virtue without collapsing their entire system, leaving the debate structurally inert despite decades of refinement. Ultimately, the disagreement hinges on whether modality tracks similarity or essence. Lewis denies haecceitism, reducing modality to qualitative comparison, while Kripke embraces it, treating identity as non-qualitative. Because neither qualitative similarity nor non-qualitative essence can be empirically adjudicated across possible worlds, the debate remains suspended in a state of reflective equilibrium where each side's intuitions validate their own theory while invalidating the other's.

