answer: |-
  You have put your finger on the exact nerve that separates the textbooks from the trench work. The Bertrand paradox is routinely taught as a warning against naive indifference, yet nearly every applied Bayesian opens a model with a flat prior on some coefficient without losing sleep. I have turned over a few explanations for this dissonance before settling on what I think is the only robust one. One common defense is that the likelihood swamps the prior, making the parametrization choice asymptotically irrelevant. But that is false in small-data regimes, with hierarchical models, or when priors are improper, so it cannot be the whole story. Another reading is the Objective Bayesian view, championed by Jaynes, which argues that symmetry groups or maximum entropy principles uniquely determine the correct measure. While elegant, this rarely matches what practitioners actually do; they are not calculating transformation groups, they are coding convenience.

  So here is the line I am willing to defend. The practice of slapping a flat prior on a parameter does not presuppose ignorance; it presupposes a tacit commitment to a specific causal grain. When a physicist puts a uniform prior on a position coordinate rather than its logarithm, they are not saying all positions are equally likely in a metaphysical sense. They are assuming that the noise process generating the uncertainty acts additively on that specific scale. The privileged parametrization is not given by logic or nature in the abstract, but by the mechanism of the error. The reason bridges do not fall down is that engineering parameters are usually defined by the very instruments and physical processes that disturb them. The flat prior is a placeholder for a mechanistic model of noise that we are too lazy to write out fully. It is not a statement of ignorance, but a simplified model of generation. This is why reparametrization breaks things: changing the parameter changes the implied noise structure, and if you change the noise structure without updating the likelihood, you have changed the physics.

  This brings us to your measurement-anchored repair. Spreading credence uniformly over instrument bins rather than true values does dissolve the Bertrand ambiguity, because the partition is now fixed by the apparatus. You worry this makes probability relative to equipment precision, turning a claim about the world into a claim about evidence. I argue this is not a bug, but the whole point. Probability is not a property of the system alone; it is a property of the interface between the system and the agent. If two labs have different resolutions, they genuinely have different inferential states, even if the world is identical. The regress you fear—why that instrument?—is benign because it bottoms out in the physical constraints of the inquiry. Adopting this would change reporting standards significantly. Error bars would indeed become indexed to equipment, and we would stop speaking of the probability that a true value lies in an interval as if truth were a independent variable. We would speak of the probability that the measurement process yields a specific readout given the state. It is clunkier, but it forces honesty about the role of the observer.

  Regarding the dialectical status, we must be clear about what is settled versus what is contested. It is consensus among serious philosophers and statisticians that the principle of indifference is not invariant under reparametrization and that flat priors are not uninformative in a transformation-invariant sense. That part is done. What remains contested is whether this matters for inference. Frequentists often dismiss it as irrelevant due to asymptotic properties, while Objective Bayesians believe there is a unique rational prior waiting to be found. My view is that both miss the mark. The practice is not licensed by asymptotics or rationality constraints, but by successful modeling of causal mechanisms.

  So, to answer your final question plainly. The practice of using flat defaults presupposes that the chosen parametrization aligns with the additive structure of the underlying noise process or the measurement mechanism. It is not an expression of ignorance, but a substantive, albeit often implicit, causal assumption. When your friends shrug and say the data will fix it, they are relying on the robustness of the likelihood, but the philosophical load-bearing beam is the assumption that their parameters map linearly to the physical disturbances they expect. If that mapping breaks, the prior breaks, and so does the inference. We should stop calling these ignorance priors and start calling them mechanism priors, acknowledging that we are betting on the structure of the world, not just admitting we do not know it.
