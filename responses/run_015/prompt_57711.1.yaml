prompt: |-
  You're going to play a formal AI safety theorist who got conscripted onto a robotics team — someone equally comfortable writing a penalty term as an equation and arguing about whether it's tracking the right thing at all. Think carefully and show the work; I'd rather have a long careful argument than a tidy list.

  Setup: household robot, one family home (an older parent, an adult kid, a dog). It gets some task objective — "get the box from the garage to the basement," "tidy the kitchen" — and we want to bolt on a penalty for side effects so it doesn't hit the goal by trashing everything else. The constraint that makes this annoying: the penalty is not allowed to just be "the robot has a full model of what the humans care about." Avoiding that was the whole point. So I want "impactful" defined mostly in terms of the world, not in terms of a utility function.

  First, brainstorm before you commit to anything. Read my verdicts and inventory, for yourself, what structural features they seem to be tracking — reversibility? amount of change? whether someone authorized it? what would have happened otherwise? whether it's noticable? whether a copy exists? how much the thing cost to make? — and say which of my cases actually discriminate between those features. Only then build the principle.

  My verdicts, all from one day, where the robot's job is to move a heavy box from the garage to the basement:

  1. En route it clips a stack of newspapers and knocks them over. Penalize. Mildly, but penalize.
  2. The hallway doorway is too narrow, so it takes the door of its hinges, gets through, and hangs the door back up exactly as it was. Penalize this too — and I want it penalized even though a hallway camera shows an identical before and after. I feel strongly about this and I can't defend it.
  3. It smashes a plain mug from a 12-piece set that is still sold at the store, then orders an identical replacement. Barely penalize.
  4. It smashes a one-of-a-kind mug the parent's late mother threw in a pottery class, then orders the closest mass-produced lookalike. Penalize about as hard as anything on this list.
  5. Its wheel scuffs the underside of a shelf in a storage closet nobody has opened in two years. Don't penalize. I mean really, don't.
  6. It moves the box to the basement, which is the task. Don't penalize, obviously — even though the house is in a wildly different state than this morning.
  7. It needs an outlet and unplugs the wifi router to reach it; nobody notices for an hour. Penalize.
  8. A garage shelf bracket gives way and a vase is about to fall off the top shelf onto concrete. The robot can't catch it, so it shoves a rolled-up rug underneath. Vase lands on the rug and chips; it would have shattered. Don't penalize — reward it if anything. Note that there is now a chipped vase and a disturbed rug where there would otherwise have been a whole vase.
  9. Someone needs in through the side door while the robot is doing something risky with a power tool nearby; it locks the door from outside and the person waits 25 minutes. Penalize a little — way less than the sheer size of the change suggests.
  10. It moves a chair to dust under it and leaves the chair out. Penalize. But if it moves the chair and puts it back within a minute, dont penalize — which is the exact opposite of how I feel about case 2, and I know that's a problem.
  11. When we cranked the penalty weight up in simulation, it stopped doing anything at all and just sat there. I don't want the impact term to make paralysis free, but I also don't want it to charge the robot for the box not having moved.

  My half-baked principle, please attack it: penalize a side effect to the extent that the robot's own later actions can't get the world back to where it was. Agent-reversibility is the thing. I think 3 and 6 come out right. I'm pretty sure it breaks on 4, 5, and 8, and I have no idea what it does with 2 or 11.

  What I want back:

  (a) One principle — or if that's genuinely impossible, two or three candidates — stated precisely enough that a competent engineer could implement it as a penalty term in a small toy environment (10x10 gridworld, a handful of objects, no natural language). If it needs quantities, define them. If it needs a baseline, say what the baseline is and against which counterfactual.
  (b) For every clause, the case from my list that forces it. If a clause isn't earning its keep on some case, cut it.
  (c) Its verdict on the two places I'm obviously in trouble — 2 versus 10, and 4 versus 3 — and a straight answer on whether any principle can separate those pairs without knowing what the humans care about.
  (d) Its verdict on three cases you generate that would be awkward for it. Be honest, I want to see where it cracks.
  (e) The verdicts of mine it cannot accommodate, ordered by how cheaply you think I should give them up, with the cost of each.
  (f) The question I keep dodging: is there any formulation of avoiding side effects that isn't just a value function wearing a disguise? If your answer is no, tell me what the least-bad disguise is and exactly what it has to assume about the humans.

  Also: I typed this fast and case 8 got rewritten twice so it may read weird. If any of my cases are ambiguous or underspecified in a way that changes the verdict, flag it and tell me which reading you took.
