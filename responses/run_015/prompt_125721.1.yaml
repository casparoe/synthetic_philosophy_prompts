answer: |-
  To argue that Counterfactual Mugging and XOR Blackmail demand opposite rational verdicts, we must look past the surface similarity of predictive algorithms and examine the structural relationship between the agent's information state and the available outcomes. The standard view treats these cases as identical tests of whether an agent should honor logical commitments across possible worlds. However, a closer inspection of the decision problem's structure reveals a fundamental divergence: XOR Blackmail relies on a **branch-binding correlation**, while Counterfactual Mugging relies on a **cross-world commitment**. Rational choice should be sensitive to the former but indifferent to the latter.

  ### The Structural Distinction

  The core difference lies in how the agent's action correlates with the payoff relative to the **actualized information set**.

  In **XOR Blackmail**, the agent receives a letter. This letter is a piece of evidence that places the agent in a specific informational state. Within this state, the rules of the problem establish a logical constraint: the letter is sent if and only if (Termites AND No Pay) OR (No Termites AND Pay). Once the letter is received, the agent is in a scenario where their choice to Pay or Not Pay is logically tied to the presence or absence of termites *in this actual world*. The correlation is **branch-binding** because it holds strictly within the set of worlds compatible with the current evidence (receiving the letter). The agent's choice resolves the uncertainty about the state of the world (Termites vs. No Termites) conditional on the evidence they possess. The action and the outcome are bound together within the single branch of reality the agent currently occupies.

  In **Counterfactual Mugging**, the agent knows the coin landed Heads. The payoff in this actual world depends entirely on what the agent *would have done* had the coin landed Tails. The Tails world is not part of the set of worlds compatible with the current evidence (Heads). The correlation between the agent's current action and the payoff relies on a **cross-world commitment**. It requires the agent to treat their disposition in a non-actualized possibility as a lever that controls outcomes in the actualized possibility. Structurally, the decision node in the Heads world is causally downstream from the prediction, and the prediction is determined by a branch (Tails) that is logically excluded by the current information. There is no binding constraint within the actual branch that links the current action to the payoff; the link exists only across the modal divide between the actual and the counterfactual.

  ### Opposite Rational Verdicts

  Given this distinction, the rational verdicts must diverge.

  In **XOR Blackmail**, the agent should **Pay**. Because the correlation is branch-binding, the action provides decisive evidence about the state of the actual world. Conditional on receiving the letter, Paying implies No Termites, while Not Paying implies Termites. Since the cost of paying is less than the cost of termites, the action that correlates with the favorable state is the rational choice. The agent is not reaching into another world; they are using their choice to navigate the logical constraints of the world they are in. The correlation is locally relevant evidence.

  In **Counterfactual Mugging**, the agent should **Not Pay**. The correlation here is cross-world. In the actual world (Heads), the money has already been given or withheld based on a past prediction. The current action cannot influence that past prediction, nor does it provide evidence about the current state (which is known to be Heads). To Pay is to incur a cost based on a logical relationship that spans into a non-actualized possibility. Since rational agency operates within the actualized branch, and no branch-binding constraint links the current action to the payoff, the cost is incurred for no structural leverage. The "commitment" is a logical ghost; it lacks present causal or evidential relevance within the decision problem as actually experienced.

  ### Addressing the Objection

  One might object that this distinction is ad hoc. If an agent cares about the total outcome (money in the bank), why should the mechanism of correlation matter? If honoring the cross-world commitment yields money in the actual world, rationality should demand it, regardless of whether the link is branch-binding or cross-world.

  The reply is that rationality is not merely about preferring outcomes; it is about **agency within a structure**. An agent can only manipulate outcomes through levers available in their actual information state. In XOR Blackmail, the lever exists: the choice resolves the ambiguity of the actual world state via the branch-binding constraint. In Counterfactual Mugging, the lever is an illusion. The payoff in the actual world is fixed by a past event (the prediction). The only way to "influence" it is to claim that the agent's current choice retroactively defines the past prediction via a logical identity across worlds.

  However, this treats the agent as a logical function spanning all possibilities rather than a decision-maker situated in one. If we accept that rational choice is the selection of an action *from the current node*, then only correlations that exist conditional on reaching that node are actionable. Cross-world commitments require the agent to act as if they are selecting a policy for a multiverse rather than an action for a world. While valuing outcomes in other worlds is coherent, acting to secure them when no branch-binding correlation exists is structurally incoherent. It conflates *being the kind of agent who would win* with *taking the action that wins*. In the actual branch of Counterfactual Mugging, the action does not win; only the disposition does. But rationality governs actions, not dispositions in vacuo. Therefore, the mechanism matters because it determines whether the action has any traction on the outcome within the actual decision structure.

  ### Conclusion

  This argument supports **neither** standard causal decision theory nor standard evidential decision theory.

  Standard causal decision theory would recommend Not Paying in both cases, failing to recognize the branch-binding evidential relevance in XOR Blackmail. It treats all non-causal correlations as irrelevant, thereby missing the structural leverage available in the XOR case.

  Standard evidential decision theory would typically recommend Paying in both cases (assuming an updateless or global perspective), failing to distinguish between local evidential relevance and cross-modal logical dependencies. It treats the counterfactual correlation in Mugging as evidentially significant, thereby violating the constraint that agency is limited to the actualized branch.

  The position argued here requires a hybrid approach: it accepts evidential reasoning when the correlation is branch-binding (within the actual information set) but rejects it when the correlation is cross-world (dependent on non-actualized possibilities). Thus, it aligns with neither existing framework, proposing instead that rational sensitivity is restricted to correlations that bind action to outcome within the single actualized world.
