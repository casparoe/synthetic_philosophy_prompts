prompt: |-
  Hey, I'm presenting next week to our philosophy of mind seminar and I'm defending this somewhat niche revision to global workspace theory. My claim is that phenomenal consciousness isn't a separate kind of state from access consciousness—it's just access with high broadcast durability, meaning representations that not only enter the global workspace but stick around long enough to resist being overwritten by the next round of broadcasting, probably sustained by recurrent loops in sensory cortices rather than prefrontal control. So there's no "phenomenal residue" left out by access; there's only graded stability, and the usual intuition pumps about "what it's like" are tracking this durability, not a mysterious extra property. The room will have two committed higher-order theorists who think phenomenal consciousness requires a meta-representational monitor, a couple cognitive scientists who are friendly to Baars-style workspace models but think I'm overfitting the neuroscience, and one skeptical neuroscientist who keeps saying consciousness research is premature without more lesion studies. I need a prep sheet for the Q&A: the eight or so objections I'll actually recieve, ordered from most damaging to least, phrased the way each group would put it, with a two-minute reply and a honest note on where my reply is soft. Include what I should concede right at the start to build credibility, and the one question I'm hoping nobody asks. Don't give me generic philosophy-of-mind objections—make them target the durability/graded-access move specifically. End with a line that starts with Verdict: and names the objection I'm dreading most.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User's Request:**
      *   **Topic:** Revision to Global Workspace Theory (GWT).
      *   **Core Claim:** Phenomenal consciousness (P-consciousness) = Access consciousness (A-consciousness) with *high broadcast durability* (sustained by recurrent sensory loops, not just prefrontal control). No "phenomenal residue."
      *   **Audience:**
          *   2 Higher-Order Thought (HOT) theorists (require meta-representation).
          *   2 Cognitive Scientists (friendly to GWT, worry about overfitting neuroscience).
          *   1 Skeptical Neuroscientist (thinks the field is premature/needs lesion data).
      *   **Deliverable:** A Q&A prep sheet.
      *   **Requirements:**
          *   ~8 objections, ordered most damaging to least.
          *   Phrased in the voice of the specific audience members.
          *   Target the *durability/graded-access* move specifically (no generic PhilMind objections).
          *   Two-minute reply for each.
          *   Honest note on where the reply is soft.
          *   What to concede upfront to build credibility.
          *   The one question hoping nobody asks.
          *   End with a line starting "Verdict:" naming the most dreaded objection.

  2.  **Deconstruct the Core Theory (Durability GWT):**
      *   *Standard GWT:* Information becomes conscious when broadcast globally.
      *   *User's Twist:* P-consciousness isn't distinct from A-consciousness. It's just access that *lasts*.
      *   *Mechanism:* Recurrent loops in sensory cortices (not just PFC).
      *   *Implication:* If it fades too fast, it's not phenomenal. If it sticks, it is.
      *   *Vulnerability:* Is durability enough for *feeling*? Does this explain masking? What about subliminal priming (which can be durable but unconscious)? What about HOT theorists who say access isn't enough without *knowing* you have access?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Attempt 1 (Generic):* "How do you explain qualia?" -> *Too vague.*
      *   *Attempt 2 (Specific):* "Why does lasting longer make it feel like something?" -> *Better.*
      *   *Attempt 3 (Audience Specific):*
          *   *HOT Theorist:* "Durability isn't higher-order. You still miss the 'for-me-ness'."
          *   *Cog Sci:* "Subliminal stimuli can persist. Durability $\neq$ Consciousness."
          *   *Neuroscientist:* "Where's the lesion data linking sensory loops to durability?"
          *   *GWT Friendly:* "Aren't you just redefining access? Why call it phenomenal?"

      *   *Refining for "Most Damaging":* The strongest objection usually attacks the sufficiency of the proposed mechanism. If durability is sufficient, why aren't all persistent representations conscious? If it's necessary, why do some fleeting moments feel vivid?
      *   *The "Subliminal Persistence" objection is likely the killer.* If I can have a representation stick around (priming) without consciousness, durability fails as a marker.
      *   *The "HOT" objection is philosophically heavy.* If P-consciousness is just stable access, where is the subjective perspective?
      *   *The "Neuro" objection is methodological.* It undermines the empirical basis.

      *   *Ordering:*
          1.  Subliminal Persistence (Cog Sci/GWT friendly) - Empirical counterexample.
          2.  The "For-Me-ness" Gap (HOT) - Philosophical sufficiency.
          3.  Sensory vs. Prefrontal (Neuro) - Mechanism location.
          4.  Grading vs. Binary (General) - Phenomenology is often all-or-nothing.
          5.  Attention vs. Durability (Cog Sci) - Confounding variable.
          6.  Memory Confusion (HOT) - Is it just working memory?
          7.  Masking Data (Neuro) - Backward masking kills durability but leaves a trace.
          8.  Terminology (General) - Why keep the word "Phenomenal"?

      *   *Wait, I need to make sure they target the "Durability" move.*
      *   Let's sharpen the "Subliminal" one. If a subliminal cue persists in sensory cortex (adaptation), is it conscious? No. So durability isn't sufficient.
      *   Let's sharpen the HOT one. Even if it sticks, if I don't represent *that* I am representing it, is it phenomenal?
      *   Let's sharpen the Neuro one. Recurrent loops exist in sleep. Are we conscious then?

  4.  **Developing the Content:**

      *   *Concession:* Acknowledge that durability alone might not be *sufficient* without a threshold, or admit the correlation isn't perfect yet. This builds trust.
      *   *The "Hope Nobody Asks":* Usually the one that exposes a fatal flaw in the definition. Maybe: "If durability is the key, does anesthesia just reduce loop time?" (Too easy?). How about: "What is the specific millisecond threshold?" (Too specific). Let's go with: "If a representation is durable but task-irrelevant, is it conscious?" (The Zombie Durability problem).
      *   *Verdict:* Needs to be the hardest hitter.

  5.  **Drafting the Replies (keeping them ~2 mins spoken):**
      *   Need to be punchy. Acknowledge the point, pivot to the specific definition of "broadcast durability" (it's not just sensory persistence, it's *global* availability persistence), and highlight the explanatory gain.
      *   *Soft Spot:* Must admit where the theory is speculative.

  6.  **Refining the Voice:**
      *   HOT Theorists: Precise, focused on "subjectivity" and "meta."
      *   Cog Sci: Focused on "operationalization," "priming," "task performance."
      *   Neuroscientist: Focused on "causality," "lesions," "correlates."

  7.  **Final Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered damaging to least? Yes.
      *   Phrased by group? Yes.
      *   2-min reply + Soft note? Yes.
      *   Concession upfront? Yes.
