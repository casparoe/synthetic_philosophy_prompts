      *   *Refinement on Ghost Driver:* The Ghost Driver isn't just "Inside View is wrong." It's "Inside View is *decoupled from reality*." The framework assumes the Inside View is *honest* but *biased*, not *hallucinatory*.
      *   *Refinement on Better Analogy:* The "Map vs. Terrain" is too cliché. "Actuary vs. Underwriter" is good but dry. "Medical" is relatable. Let's go with a hybrid: **The Actuary and the Engineer.** Or stick with Medical. Let's use **The Actuary and the Captain.** No, Medical is strongest for "base rate vs. individual specifics." Let's use **The Epidemiologist and the Clinician.**

      *(Self-Correction)*: Actually, the "Map vs. GPS vs. Driver" might be clearer. But the Medical one handles the "life/death" stakes of the Ghost Driver better. Let's propose **The Bookmaker and the Punter**. No, let's go with **The Actuary and the Underwriter**. It captures the "statistical baseline" vs "case-specific risk assessment" perfectly.
      *Wait, simpler:* **The Weather Forecaster and the Sailor.**
