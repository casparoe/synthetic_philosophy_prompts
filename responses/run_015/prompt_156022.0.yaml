      *   Ghost Driver: Sailor is drunk/thinking it's sunny.
      *   This keeps the navigation theme but fixes the epistemic hierarchy.
      *   *Actually, let's stick to the Medical one.* It's the standard counter-analogy in decision science. Base Rate (Outside) + Case Specifics (Inside).

      *Decision:* I will use the **Medical Diagnosis** analogy as the superior alternative because it explicitly deals with *probability* + *specifics* without the spatial "up/down" hierarchy that implies authority.

