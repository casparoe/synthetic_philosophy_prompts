      *   **User's Thought Experiment:** The "Ghost Driver" (sleepwalking, confident, heading for a bridge, helicopter can't reach them).
      *   **User's Questions:**
          *   Does the Ghost Driver fit?
          *   Is there a "blind men and the elephant" issue (both views partial)?
          *   Request: Correspondence table (Car parts $\leftrightarrow$ Reasoning parts).
