  5.  **Drafting the Audit (Iterative Refinement):**

      *   *Ranking:*
          1.  **Measure vs. Dominance/Probabilism (3 vs 2/4).** This is the technical killer. Calibration scores don't yield probabilism via dominance in the standard way.
