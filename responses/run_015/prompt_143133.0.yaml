          4.  **Pragmatism Charge (2).** Dialectical vulnerability.

      *   *Refining the Measure Critique:* The user describes a "Calibration + Refinement" decomposition. This looks like the Murphy decomposition of the Brier Score. *However*, the user weights them 10:1. The Brier Score is proper. Is a weighted sum of Calibration and Refinement proper?
