          *   *Problem:* Calibration measures are not strictly proper. You can maximize calibration by being uninformative (always saying 0.5 if base rate is 0.5). The dominance argument shows that *incoherent* credences are dominated. But does this specific measure *require* coherence?
          *   *Worse Problem:* The measure is defined over a *sequence* of forecasts ($N$ questions), not a single credence function state. Probabilism is a synchronic constraint on a credence function. Applying a long-run calibration score to justify synchronic probabilism is a category error unless you assume the sequence represents the "worlds" in the dominance argument.
