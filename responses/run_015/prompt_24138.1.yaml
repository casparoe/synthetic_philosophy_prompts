answer: |-
  The deflationary view is fatally vulnerable if ontological claims prove indispensable for substantive normative or explanatory practices that cannot be preserved through paraphrase.

  **Fatal Defeaters**

  1.  **Substantive Practical Divergence:** If settling an ontological dispute genuinely alters the answer to a non-metaphysical question, the dispute is not merely verbal. For example, if corporate moral responsibility requires the corporation to be a singular agent rather than a plurality of individuals, and legal liability or blame attribution fails under the pluralist paraphrase, the ontology is doing work. A deflationist must show that the "collection of individuals" paraphrase yields identical legal and moral outputs; if the law requires a singular subject for punishment that cannot be distributed without loss of meaning, the ontic claim is vindicated.
  2.  **Paraphrase Re-importation:** If the deflationist's non-ontic paraphrase quietly presupposes the ontic structure it aims to dissolve, the view collapses into realism. For instance, paraphrasing "there are tables" as "there are simples arranged table-wise" often relies on a principle of composition or arrangement that is itself ontologically loaded. If "arranged table-wise" cannot be cashed out without referencing the very unity or boundaries that constitute the table's existence, the paraphrase is circular, and the ontic commitment remains.

  **Serious Defeaters**

  3.  **Joint Carving and Structure:** Ted Sider's argument that reality has a specific structure that some conceptual schemes carve better than others challenges the idea that all schemes are equal. If quantification has a privileged meaning tied to the fundamental structure of the world (quantifier variance is false), then disputes about what exists are disputes about matching language to structure, not just choosing languages. This is serious because it undermines the deflationist's core mechanism of scheme-relativity.
  4.  **Scientific Indispensability:** If our best scientific theories require ontic commitment to entities (e.g., fields, wavefunctions) not just as instrumental tools but as explanatory posits that cannot be nominalized without losing predictive power, deflationism fails in the scientific domain. While deflationists often retreat to "ordinary objects," if the logic extends to scientific entities, the indispensability argument serves as a strong anchor for realism.

  **Merely Awkward Defeaters**

  5.  **Phenomenology of Disagreement:** The intense feeling that metaphysicians are talking about the same thing and genuinely disagreeing, rather than talking past each other, counts against deflationism only if phenomenology is a reliable guide to metaphysical fact. This is weak because deflationists explain this feeling as an illusion generated by the surface grammar of quantifiers.
  6.  **Common Sense Intuitions:** The intuition that tables obviously exist and skeptics are crazy is easily dismissed by deflationists as reflecting our conceptual scheme's utility, not reality's structure. This does not threaten the view because deflationism accepts tables exist *relative to our scheme*, denying only the scheme-independent fact.

  **Deflationist Concessions vs. Dismissals**

  A committed deflationist would **concede** that **Paraphrase Re-importation** and **Substantive Practical Divergence** are fatal. If their paraphrase fails to eliminate the ontic commitment or if the ontology changes the world (e.g., legal outcomes), the deflationary project fails on its own terms. They would **dismiss** **Phenomenology** and **Common Sense Intuitions** as resting on confused intuitions about language mirroring reality directly. They would treat **Joint Carving** as a gerrymandered metaphysical posit that begs the question against conceptual pluralism, and **Scientific Indispensability** as a category error conflating empirical commitment with metaphysical absolutism, unless the science explicitly demands scheme-independent truth.

  **Assessment of Unfalsifiability**

  The view has been qualified into a state of near-unfalsifiability by the move to decide case-by-case which disputes are verbal. This insulation is a **defect** if the criterion for "verbal" is internal to the theory (e.g., "a dispute is verbal if I can paraphrase it"), as this makes the theory immune to counterexample by definition. However, it functions as a **feature** if viewed as a methodological tool for conceptual engineering, allowing philosophers to dissolve pseudo-problems without committing to a grand metaphysical system. The risk is that without an independent, pre-theoretical test for "verbalness" versus "ontic," deflationism becomes a matter of stylistic preference rather than a truth-apt claim about the nature of disagreement.
