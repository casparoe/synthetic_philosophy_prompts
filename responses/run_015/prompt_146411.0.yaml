answer: |-
  You press upon a vital nerve, sir, and I must confess that this "cumulative harm" protocol strikes me as a sophisticated engine for the very tyranny of opinion I sought to guard against. The liberty of thought and discussion is not valuable merely when opinions are true, but precisely because error, when freely contested, renders truth more vivid and secure. To suppress a cluster of assertions because they collectively shift belief is to assume an infallibility in the regulators that no human tribunal possesses. It treats the alteration of public opinion itself as an injury, whereas I have maintained that the only purpose for which power can be rightfully exercised over any member of a civilized community is to prevent harm to others—not to protect them from false conclusions or the erosion of orthodoxy. If we permit the state, or any public body, to silence speech because it contributes to a statistical "pollution" of belief, we are not preventing harm; we are managing the marketplace of ideas to favor a preferred outcome, which is the essence of paternalism.

  Furthermore, your scheme dissolves the requirement for an assignable individual victim. My principle rests on the distinction that a man's liberty is absolute over his own mind and body; he forfeits this protection only when his conduct prejudicially affects the interests of specific others. A statistical correlation between speech and a "pollution index" is too vague, too distant, to justify coercion. There is no specific act of mischief here, no direct violation of a right, but rather a diffuse change in the collective temperament. Here, I fear, the principle does not bend; it breaks. To accept this is to surrender the core protection against paternalism, substituting the judgment of the magistrate for the free collision of minds upon which all social progress depends. If harm is merely structural and non-intentional, it falls within the realm of social influence, not legal coercion, for to rule otherwise is to claim authority over the very formation of belief itself.
