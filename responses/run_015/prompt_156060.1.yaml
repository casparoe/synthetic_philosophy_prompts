prompt: |-
  Hey — I'm taking a formal epistemology seminar this term (philosophy dept, mostly grad students, I'm the lone undergrad) and we just did a week on Jeffrey conditionalization / probability kinematics. Midterm's in about a week and a half, and I found this study-guide blog post that a grad student in the department put up a couple years ago which everyone seems to have used, so I want to know how much of it I can safely put on an exam paper. Here's the central paragraph, more or less as written:

  "Here's the rule. Take a partition E1, ..., En and suppose some experience moves your credence in the cells from P(Ei) to q(Ei) without making any of them certain. Then your new credence in any hypothesis H is just the weighted average P_new(H) = Σ_i q(Ei)·P_old(H | Ei), and everything else falls out of that. First, if you do become certain of one cell — q(Ek) = 1 — the sum collapses to P_old(H | Ek), which is ordinary conditionalization; so strict conditionalization is just the special case where the evidence arrives with certainty. Second, the rigidity condition built into the formula, that P_new(H | Ei) = P_old(H | Ei), isn't really an extra assumption you have to go out and check: it's just the law of total probability applied to your new credence function. You're holding the conditional distribution inside each cell fixed and only redistributing weight between cells, so there's nothing normative going on here — it's a theorem, not a principle. And if rigidity ever looks violated, you can always repair it by choosing a finer partition until it holds. Third, because the rule is just a weighted average, it's fully general: the order in which you take your uncertain evidence doesn't matter, you land on the same credence function either way. Fourth, it's also the minimal-change rule — of all the ways of accommodating your new marginal on the partition, Jeffrey's rule is the one that moves your overall credence function as little as possible. And here's a nice payoff: it dissolves the problem of old evidence. If E is something you've known for years, conditionalizing on E does nothing because P(E) = 1, but with Jeffrey's rule you can just dial P(E) down to, say, 0.99 and let E confirm the theory after all. Bottom line: real experience never delivers certainty, so strict conditionalization is a limiting case that basically never applies, and probability kinematics is what finally turns Bayesianism into an actual theory of learning from experience."

  My gut says the weighted-average formula and the "reduces to plain conditionalization" bit are fine, but the "it's a theorem so there's nothing normative" line and the bit about always being able to fix rigidity by refining the partition both smell off, and the old-evidence payoff sounds too good to be true. I dont trust my gut much though. Could you go through it claim by claim — what someone who actually works on this would accept, what they'd call a common but sloppy simplification, and what's just wrong? Concretely: is rigidity a real assumption that can fail, and does moving to a finer partition actually help (or does the choice of partition do more work than the post admits)? Does the order of uncertain evidence really not matter — if it does, can you show me a tiny worked example with two binary partitions where doing the two updates in the two orders gives different final credences, so I can see the mechanism? Is the "minimal change" line defensible, and does it depend on how you measure distance between credence functions? Does any of this touch the problem of old evidence, or is that a seperate problem? Also someone mentioned a case — Judy Benjamin? — where the rule supposedly gives the wrong answer, but I only caught half of that discussion and I don't want to name-drop something I can't explain. And finally: does the post's punchline, that strict conditionalization is basically a useless special case and Bayesian updating is now a complete theory of learning from experience, survive once you correct the wrong bits? I'd much rather hand in something my TA calls careful than something that just sounds confident.
