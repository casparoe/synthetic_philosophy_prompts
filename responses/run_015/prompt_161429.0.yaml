      *   *Claim 2:* Copying varies, variants spread based on copying frequency (fitness). Selection indifferent to vehicle interests (chain letters, cults).
      *   *Claim 3:* Limiting factor is copying fidelity. Below "transmission floor," variants are rebuilt, nothing accumulates. Above it, Darwinian rules take over wholesale, useful kept, harmful discarded, culture ratchets.
      *   *Claim 4:* Methodological payoff: Ask what a custom was selected for to find its function (adaptationism).
      *   *Claim 5:* Biologists have largely come round to this because dual inheritance theory models show a second system obeys same equations as genes (gene's-eye view right).
      *   *Claim 6 (Practical Conclusion):* Selection blind to truth. Dealing with misinformation = lower copying rate. Arguing about content is pointless.

  3.  **Evaluate Claims against Academic Consensus (Cultural Evolution Theory):**
      *   *Claim 1 (Darwinian Process/Memes):* Serious defenders (Boyd, Richerson, Henrich, Mesoudi) accept culture evolves via variation, selection, transmission. However, many wince at "memes" (Dawkins' specific formulation) because human learning isn't always high-fidelity replication like genes. It's often reconstructive. "Replicator" language is controversial; "attractor" or "cultural trait" is preferred by some.
      *   *Claim 2 (Selection indifferent to vehicle):* Generally accepted. Maladaptive traits can spread (e.g., smoking, celibacy). This is a core insight of dual inheritance theory.
      *   *Claim 3 (Transmission Floor/Ratcheting):* This is the tricky part. High fidelity is necessary for cumulative culture (the "ratchet effect"). However, the summary says "Above the floor... useful variants are kept, harmful ones discarded." This is too strong. Selection doesn't guarantee useful variants are kept; it just favors those that spread. Also, human learning is *never* perfect replication; it's always somewhat reconstructive. The "floor" concept is real (Tomasello etc.), but the implication that crossing it turns on "Darwinian rules wholesale" is a simplification. Human culture involves guided variation and biased transmission, not just blind variation and selection.
      *   *Claim 4 (Method/Function):* This is adaptationism. Serious defenders wince here. Just because a custom spread doesn't mean it was selected *for* a specific function beneficial to the group or individual. It could be a byproduct, drift, or maladaptive (like the cult example earlier). Asking "what was it selected for" assumes it was an adaptation, which is not always true.
      *   *Claim 5 (Biologist Consensus/Equations):* Partially true but inflated. Dual inheritance theory (Boyd & Richerson) uses population genetics models, yes. But "biologists have largely come round" is an exaggeration. Many biologists are skeptical of extending Darwinism to culture without significant modification. The "gene's-eye view" is not universally accepted for culture because cultural transmission is Lamarckian (acquired characteristics passed on) and horizontal, unlike vertical genetic inheritance.
      *   *Claim 6 (Misinformation/Content):* This follows from the "blind selection" premise but is practically dubious. If selection is blind to truth, lowering copying rates helps, but arguing about content *can* change the selection pressures (e.g., making false info less attractive). Saying arguing is *pointless* contradicts the idea that content affects transmissibility.

