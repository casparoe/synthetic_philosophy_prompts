answer: |-
  *(Walks to the mic, adjusts the stand)*

  So, I'm single. And apparently, my standards are too high for Tinder but too low for academia. So I started looking for niche apps. Found one called **Pramāṇa Match**.

  The tagline is: *"Don't just feel it. Validate it."*

  It's brilliant. You don't swipe on photos. You swipe on the *means of knowledge* justifying your interest.

  Your profile has dropdown menus.
  **Reason for Like:**
  *   *Pratyakṣa* (I saw them at the bar, direct perception).
  *   *Śabda* (My guru said they're single, reliable testimony).
  *   *Anumāna* (They have a ring tan-line, therefore divorced, inference).
  *   *Upamāna* (They remind me of my ex, comparison).

  I matched with this great person. But I swiped *Upamāna*. I wrote in my bio: *"Looking for someone who possesses the same qualities as the person I dated in grad school."*

  Big mistake. The algorithm flagged me immediately.

  I got an error message: **"Invalid Cognition. *Apramā* Detected."**

  I called customer support. I said, "Hey, Nyāya accepts *Upamāna* as an independent *pramāṇa*. It's not reducible to inference. It's valid."

  The support agent—let's call him the Chief Epistemologist—says, "Look, buddy. *Upamāna* yields knowledge of the *relation* between the name and the object via similarity. It does not yield knowledge of the object itself."

  I said, "So?"

  He said, "So you know she is *similar* to your ex. You do not know *her*. You have knowledge of the analogy, not the datum. Your cognition lacks *yathārthavṛtti*. It doesn't have the form of the object. It has the form of the comparison. We can't let you date a comparison. That's a category error."

  So I appeal the ban. I ask for a human moderator to review my profile.

  This guy is a hardcore Navya-Nyāya logician. He says, "I will review your case using *Tarka*."

  Now, for the uninitiated, *Tarka* is hypothetical reasoning. It's reductio ad absurdum. It's not a real *pramāṇa*. It doesn't generate truth. It just clears away the weeds so the truth can grow.

  The moderator writes me back. He says:

  "Okay, I applied *Tarka* to your dating life.
  I assumed the opposite: 'You are *not* compatible.'
  If you were not compatible, then matching would be impossible.
  But you did match.
  Therefore, the assumption 'You are not compatible' leads to an absurdity."

  I'm like, "Great! So we're compatible? Approve the date!"

  He writes back: **"No."**

  I said, "Why not? You just proved we aren't incompatible!"

  He says: "Exactly. *Tarka* is eliminative. It removes the false option. It knocks down the doubt. But it does not positively establish the truth. I have successfully eliminated the possibility that you *shouldn't* date. But I cannot generate the knowledge that you *should*."

  I said, "So what's my status?"

  He says: **"Status: *Saṃśaya*. Doubt."**

  I said, "You used logic to leave me in doubt?"

  He says, "I didn't use logic to leave you there. I used logic to confirm that's where you live. *Tarka* sweeps the floor, it doesn't build the house. Come back when you have perception."

  So now I'm just walking around bars staring at people, waiting for *Pratyakṣa*, because apparently, inference is too risky, testimony is hearsay, analogy is irrelevant, and reasoning only tells me what I'm *not* doing wrong.

  *(Mic drop gesture)*
  I'm single.
