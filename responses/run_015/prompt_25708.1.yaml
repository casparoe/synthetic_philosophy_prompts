prompt: |-
  Please argue that the all-affected principle — according to which anyone whose interests are affected by a political decision ought to have a say in making it — is untenable as a criterion for constituting the demos, and that the all-subjected principle (which restricts the demos to those subject to the coercive enforcement of a polity's laws) offers a more defensible alternative. Your argument should address the familiar regress objection: determining who is affected by a decision about who gets to decide seems to presuppose an answer to the very boundary question we are trying to resolve. Consider, however, whether the all-subjected principle faces a structurally analogous difficulty, and if so, whether it handles that difficulty any better than the all-affected principle does.
reasoning: |-
  Here's a thinking process that leads to the argument above:

  1.  **Deconstruct the Prompt:**
      *   **Task:** Argue that the All-Affected Principle (AAP) is untenable as a criterion for constituting the *demos* (the people/body of citizens).
      *   **Task:** Argue that the All-Subjected Principle (ASP) is a more defensible alternative.
      *   **Key Constraint:** Address the "Regress Objection" (the boundary problem: deciding who is affected by the decision about who decides presupposes a prior *demos*).
      *   **Key Constraint:** Consider if ASP faces a structurally analogous difficulty and if it handles it better than AAP.

  2.  **Define the Principles:**
      *   *All-Affected Principle (AAP):* Everyone whose interests are affected by a decision should have a say. (Scope: Potentially global, fluid, interest-based).
      *   *All-Subjected Principle (ASP):* Everyone subject to the coercive laws of a polity should have a say. (Scope: Territorial/Jurisdictional, fixed, coercion-based).

  3.  **Drafting the Argument Against AAP:**
      *   *Problem 1: Indeterminacy/Over-inclusiveness.* Interests are causal chains. A decision in Country A affects prices in Country B, which affects a farmer in Country C, who affects his neighbor. Where does it stop? It leads to a "global demos" for almost every issue, making democratic governance impossible.
      *   *Problem 2: The Boundary Problem (Regress).* To decide *who* is affected, someone must decide. Who decides that? If we use AAP to decide the boundary of AAP, we need a prior *demos*. This is circular.
      *   *Problem 3: Instability.* The *demos* would change with every issue. A stable political community requires a stable membership.

  4.  **Drafting the Argument For ASP:**
      *   *Strength 1: Coercion as the Trigger.* Democracy is primarily about legitimizing coercion. If I am forced to obey laws, I need a voice. If I am merely influenced (e.g., by foreign policy) but not coerced, the claim is weaker.
      *   *Strength 2: Institutional Clarity.* Jurisdiction is usually clear (residence, citizenship, territory). It creates a stable *demos*.
      *   *Strength 3: Reciprocity.* Those who enforce the laws are accountable to those bound by them.

  5.  **Addressing the Regress Objection (The Core Philosophical Challenge):**
      *   *The Objection:* To apply *any* principle (AAP or ASP), we need to decide *who* applies it. Who determines the jurisdiction? Who determines the causal chain of effects?
      *   *AAP's Failure:* AAP is *more* vulnerable because "affect" is metaphysically vague. Determining the chain of causation is an empirical and normative minefield. The regress is deeper because the criteria are fuzzier.
      *   *ASP's Resilience:* ASP relies on *coercion* and *jurisdiction*. These are institutional facts, not metaphysical causal chains. While there is still a "who decides the borders" question, the *application* of the principle once borders exist is clear.
      *   *Handling the Regress:* ASP doesn't solve the ultimate founding moment (the "constitutional moment"), but it provides a stable heuristic for *ongoing* democratic legitimacy. AAP fails even at the ongoing stage.

  6.  **Structuring the Essay:**
      *   **Introduction:** Define AAP and ASP. State the thesis (AAP is untenable due to indeterminacy and regress; ASP is superior due to focus on coercion and stability).
      *   **Section 1: The Indeterminacy of Affection.** Explain why "interests" are too vague. The problem of causal chains.
      *   **Section 2: The Regress Objection.** Explain the boundary problem. Show how AAP collapses under it.
      *   **Section 3: The Case for All-Subjected.** Focus on coercion and reciprocity. Stability of the *demos*.
      *   **Section 4: ASP and the Regress.** Acknowledge ASP faces a version of the regress (who defines the jurisdiction?). Argue why it's *less* severe (institutional facts vs. causal metaphysics).
      *   **Conclusion:** Summarize. ASP is not perfect but is practically and normatively superior.

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Check:* Did I address the specific prompt requirement about whether ASP faces a *structurally analogous* difficulty?
      *   *Correction:* I need to make sure I don't just say "ASP is perfect." I must admit ASP has a boundary problem (e.g., immigration, border drawing) but argue it's *manageable* compared to AAP's infinite regress.
      *   *Nuance:* Distinguish between "affected" (causal impact) and "subjected" (legal obligation).
      *   *Key Philosophical Reference:* Frederick Whelan is the classic source on the boundary problem. Robert Dahl is associated with AAP. Good to keep these in mind for tone, though explicit citation isn't requested.
      *   *Tone:* Philosophical, rigorous, persuasive.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Set the stage. Democratic theory needs a *demos*.
      *   *AAP Critique:* Use the "butterfly effect" analogy. If AAP holds, the *demos* for climate change is everyone on earth. The *demos* for local zoning might be neighboring property owners. This makes institutionalization impossible.
      *   *Regress:* To apply AAP, we need a meta-*demos* to judge effects. This leads to infinite regress.
      *   *ASP Defense:* Coercion is the distinctive feature of the state. Legitimacy is needed where force is used.
      *   *ASP Regress:* Yes, who draws the border? But once drawn, the rule is clear. AAP requires re-drawing the border for *every decision*. ASP allows a stable border. This is the crucial difference. The regress in ASP is a *one-time* (or rare) constitutional question; in AAP, it is a *perpetual* legislative question.

  9.  **Final Review against Prompt:**
      *   Argue AAP untenable? Yes.
      *   Argue ASP defensible? Yes.
      *   Address regress objection? Yes.
      *   Consider if ASP faces analogous difficulty? Yes.
      *   Compare how they handle it? Yes.

  10. **Final Polish:** Check for clarity, flow, and logical consistency. (Ensure the distinction between *constituting* the demos and *making decisions* within the demos is clear).

  *(Self-Correction during drafting)*: I need to be careful not to conflate "subjected" with "citizen." Residency is often the key for ASP. I should clarify that ASP includes residents subject to laws, not just formal citizens.

  *(Refining the Regress Argument)*: The prompt asks specifically about the regress: "determining who is affected by a decision about who gets to decide." I need to make sure I tackle this specific formulation. The "Boundary Problem."

  Okay, ready to write.
answer: |-
  The question of who constitutes the *demos*—the body of people entitled to participate in collective self-government—is the foundational problem of democratic theory. Without a defined membership, democratic procedures cannot function. Two dominant principles attempt to solve this boundary problem: the All-Affected Principle (AAP) and the All-Subjected Principle (ASP). The AAP holds that anyone whose interests are affected by a political decision ought to have a say in making it. The ASP restricts the *demos* to those subject to the coercive enforcement of a polity's laws.

  This essay argues that the AAP is untenable as a criterion for constituting the *demos* due to its inherent indeterminacy and its vulnerability to a vicious regress objection. In contrast, the ASP offers a more defensible alternative by anchoring democratic membership in the normative significance of coercion. While the ASP faces a structurally analogous boundary problem, it handles the regress objection significantly better than the AAP by transforming an infinite metaphysical inquiry into a manageable institutional question.

  ### The Indeterminacy of the All-Affected Principle

  The primary intuitive appeal of the AAP is its moral inclusiveness. It seems undemocratic to impose costs on individuals without granting them a voice. However, as a criterion for institutionalizing the *demos*, the AAP collapses under the weight of causal indeterminacy.

  In a globalized, interconnected world, almost every political decision generates ripple effects beyond the jurisdiction of the deciding body. A decision by a small town to subsidize a factory affects global supply chains, environmental conditions, and market prices. If "affected interests" are defined by causal impact, the *demos* for most decisions becomes potentially global. Conversely, if we limit "affected" to "significantly affected," we introduce a vague normative threshold that requires adjudication.

  This leads to the problem of instability. Under a strict AAP, the *demos* would be fluid, shifting with every item on the legislative agenda. The group voting on environmental policy would differ from the group voting on trade tariffs. While issue-specific constituencies have their place, a stable political community requires a stable membership capable of deliberating on a range of issues over time. The AAP renders the *demos* ephemeral, making the establishment of lasting democratic institutions impossible.

  ### The Regress Objection

  The most damning philosophical objection to the AAP, however, is the regress objection, often associated with the "boundary problem." To apply the AAP, one must first determine who is affected by a decision. But the decision about *who is affected* is itself a political decision. Therefore, according to the AAP, those affected by the decision about the boundary of the *demos* ought to have a say in drawing that boundary.

  This creates a vicious circle. To decide who votes on Issue X, we need a *demos*. But to decide who constitutes that *demos*, we need a prior *demos* to decide who is affected by the boundary-setting decision. As Frederick Whelan famously noted, democratic theory presupposes a *demos* to function, yet the AAP cannot generate that *demos* without presupposing one.

  The AAP handles this regress poorly because the criteria for "affect" are metaphysical and empirical rather than institutional. Determining the chain of causation requires omniscience. Consequently, the regress is not just logical but practical: every attempt to fix the *demos* is open to challenge by someone claiming they are "affected" by the exclusion. The AAP provides no stopping point. It demands a meta-decision procedure to define the primary decision procedure, leading to an infinite regress of boundary-setting *demoi*.

  ### The Defense of the All-Subjected Principle

  The All-Subjected Principle avoids these pitfalls by shifting the criterion from *causal impact* to *coercive obligation*. The ASP argues that the primary justification for democracy is the need to legitimize the use of collective force. Individuals require a voice in proportion to their subjection to the binding, coercive laws of a state.

  This principle offers three distinct advantages. First, it provides normative clarity. Coercion is a distinctive moral harm that requires justification; mere influence or causal effect does not carry the same weight. If a foreign policy decision negatively impacts a foreigner's economic interests, they are harmed, but they are not forced to obey the laws that caused the harm. If a resident is arrested for violating a law they had no hand in making, their autonomy is directly violated. The ASP aligns the *demos* with the scope of legal coercion.

  Second, the ASP ensures stability. Jurisdiction and residence are generally fixed institutional facts. Unlike causal chains, legal subjection is binary: one is either subject to the polity's enforcement mechanisms or one is not. This allows for a stable *demos* capable of long-term deliberation and accountability.

  ### The ASP and the Regress Objection

  Does the ASP face a structurally analogous difficulty? Yes. The question "Who is subject to the laws?" presupposes a definition of the polity's jurisdiction. Who decides the borders within which coercion applies? If we use the ASP to decide the borders of the ASP, we face a version of the regress objection. For example, deciding whether to include a disputed territory within the polity's jurisdiction requires a *demos*, but the composition of that *demos* depends on whether the territory is included.

  However, the ASP handles this difficulty significantly better than the AAP for two reasons: the nature of the criteria and the frequency of the problem.

  **1. Institutional Facts vs. Causal Metaphysics**
  The regress in the AAP is driven by the vagueness of "affect." Because causal influence is a matter of degree and empirical dispute, the boundary is perpetually contestable. In contrast, the ASP relies on institutional facts: residence, citizenship, and territorial control. While borders are politically contested, the *criterion* for membership (subjection to law) is clear once the border is established. The regress in ASP is a question of *jurisdiction*, which is a standard question of international and constitutional law. The regress in AAP is a question of *causality*, which is scientifically and normatively infinite.

  **2. Constitutional vs. Legislative Regress**
  The most crucial distinction is that the AAP makes the boundary problem a *legislative* one, while the ASP makes it a *constitutional* one. Under the AAP, the *demos* must be reconstituted for every decision, meaning the regress arises continuously. Under the ASP, the boundary question arises primarily at the constitutional founding or during territorial changes (e.g., annexation, secession, immigration reform).

  Once the jurisdictional borders are set, the ASP provides a clear, non-regressive rule for membership: everyone inside is in; everyone outside is out. The AAP provides no such resting point; even inside the borders, one must ask if those outside are affected. Thus, the ASP contains the regress to the "constitutional moment," allowing normal politics to proceed without constant boundary renegotiation. The AAP, by contrast, infuses normal politics with boundary disputes, paralyzing decision-making.

  ### Conclusion

  The All-Affected Principle, while morally seductive, is untenable as a constitutive rule for the *demos*. Its reliance on causal influence leads to over-inclusiveness, instability, and a vicious regress that prevents the formation of any decision-making body. The All-Subjected Principle offers a superior alternative by grounding democratic membership in the specific moral problem of legitimizing coercion.

  While the ASP does not escape the boundary problem entirely—it cannot magically justify why a specific border exists—it mitigates the regress objection by transforming it from an infinite metaphysical inquiry into a finite institutional one. By accepting that jurisdictional boundaries are necessary preconditions for democracy, the ASP allows the *demos* to stabilize. It acknowledges that while we may not be able to democratically justify every inch of territory from scratch without circularity, we can democratically govern the people who are unavoidably bound together by a shared system of coercive law. In doing so, the ASP saves democracy from the paralysis of infinite inclusion.
