answer: |-
  Here is a 45-minute teaching plan designed for first-years with prop logic background.

  ### 1. The Framing Verdict
  **Keep the concept, drop the jargon.**
  "Expressive completeness vs. semantic closure" is the correct *meta*-framing, but if you open with it, you will lose them. First-years hear "semantic closure" and tune out.
  *   **Do:** Use this framing in the **last 5 minutes** as the "big picture" takeaway.
  *   **Don't:** Use it to motivate the paradox initially.
  *   **Replace with:** "We want a language that can talk about itself (self-reference) AND a language where nothing contradicts itself (consistency). The Liar shows you can't have both."

  ### 2. The Sequence & Example (0–15 mins)
  **Goal:** Make the contradiction feel like a logical crash, not a linguistic trick.

  **The Example: The Two-Card Loop (Jourdain's Paradox)**
  Do not use "This sentence is false." It invites the objection "That's just bad grammar."
  Use two index cards.
  *   **Card A:** "The sentence on Card B is true."
  *   **Card B:** "The sentence on Card A is false."

  **The Flow:**
  1.  **Setup (5 mins):** Place cards on the table. Ask: "Assume classical logic (True/False, no contradictions) and the intuitive rule of truth (To say 'P is true' is just to say 'P')."
  2.  **Derivation (10 mins):** Walk them through the cases. Do not let them skip steps.
      *   *Case 1:* Assume A is True. → B is True (by A) → A is False (by B). **Contradiction.**
      *   *Case 2:* Assume A is False. → B is False (by A) → A is True (by B, since B says A is false). **Contradiction.**
  3.  **The Pivot:** Emphasize that neither card refers to *itself*. They only refer to *other* cards. This blocks the "self-reference is illegal" objection before they make it. The problem is the *loop*, not the grammar.

  ### 3. The Theories & Misconception Map (15–35 mins)
  **Goal:** Present theories as "Which rule are we willing to break?" rather than "Who is right?"

  **Group the solutions by what they sacrifice:**
  1.  **Tarski (Sacrifice Semantic Closure):**
      *   *Move:* You cannot have truth predicates in the same language as the sentences they evaluate. Card A must be in Language 1, Card B in Language 2.
      *   *Misconception Alert:* Students will think this is pedantic bureaucracy.
      *   *Correction:* Frame it as a **security feature**. Just like you can't define "validity" inside the system you are validating (they know this from prop logic soundness/completeness), you can't define "truth" inside the language. It's about preventing system crashes, not policing grammar.
  2.  **Paraconsistent (Sacrifice Consistency):**
      *   *Move:* Accept that some sentences are True AND False (dialetheism). The world (or language) contains contradictions.
      *   *Misconception Alert:* Students think this means "anything goes" (Principle of Explosion).
      *   *Correction:* Briefly mention that paraconsistent logic blocks explosion (¬(P & ¬P) → Q is invalid). You can tolerate this specific contradiction without math breaking.
  3.  **Deflationism (Sacrifice the Property):**
      *   *Move:* "True" isn't a substantive property like "red" or "heavy." It's just a logical device for endorsement.
      *   *Misconception Alert:* Students think deflationists just ignore the problem.
      *   *Correction:* Explain that deflationists argue the Liar sentence *looks* like it asserts something but actually fails to make a claim. If "True" is just disquotation, the Liar is a malfunctioning tool, not a deep mystery. It dissolves the paradox by denying the sentence has a truth condition to begin with.

  **Timing:** 7 mins per theory. Keep it brisk.

  ### 4. Check for Understanding (35–40 mins)
  **Goal:** Verify they grasp the *dependency*, not just the contradiction.

  **The "Broken Circuit" Task:**
  Draw a new 3-card loop on the board.
  *   **Card X:** "Card Y is true."
  *   **Card Y:** "Card Z is true."
  *   **Card Z:** "Card X is true."
  *   **Ask:** "Does this loop crash like the A/B loop? Why or why?"
  *   **Answer Key:** No, it doesn't crash. They can all be True, or all be False.
  *   **Why this works:** It tests if they understand that the paradox requires a **negative link** (a "false" claim) in the loop to generate the oscillation. If they just memorized "loops are bad," they will fail this. If they understand the logical dependency, they will see the all-positive loop is stable.

  ### 5. What to Explicitly Leave Out
  Save these for "Office Hours" or "Further Reading" if they ask. Do not put them in the slides.
  *   **Gödel Numbering:** Do not explain how arithmetic encodes syntax. Just say "We can construct these sentences in math too."
  *   **Formal Semantics:** No model theory, no possible worlds, no fixed-point mathematics.
  *   **The Strengthened Liar:** Do not introduce "This sentence is not true" vs "This sentence is false" distinctions. It complicates the Deflationist/Tarski distinction too much for 45 mins.
  *   **Kripke's Groundedness:** Too technical. Stick to Tarski's hierarchy for the "language level" solution.

  ### 6. The Wrap-Up (40–45 mins)
  **Return to the Framing.**
  Now you can use the technical terms.
  *   "We saw today that if you want **Semantic Closure** (language talks about itself), you risk inconsistency."
  *   "If you want **Expressive Completeness** (no truths are unsayable), you risk paradox."
  *   "Tarski saves consistency by banning closure. Paraconsistency saves closure by accepting inconsistency. Deflationism tries to show the conflict is an illusion."
  *   **Final Takeaway:** "Truth isn't just a label; it's a structural constraint on how we build languages."

  ### Critical Advice for the Tutor
  *   **Don't let them sit in the paradox too long.** The feeling of "inevitability" comes from walking through the True/False cases quickly and hitting the wall twice. Don't linger on the "wow, weird" feeling; move immediately to "okay, which rule broke?"
  *   **Deflationism is the tricky one.** First-years often conflate Deflationism with Nihilism ("Nothing is true"). Be precise: Deflationism says "True" is a useful word, just not a *deep property* word.
  *   **Watch the clock.** 45 minutes is extremely tight for this material. If you run long on the Card Derivation, cut the Paraconsistent section. It is better they understand Tarski and the Paradox deeply than skim all three theories.
