answer: |-
  Here is a procedure designed for your specific constraints. It is not a legal shield; it is an ethical compass. It treats the subject not as property, but as a former agent whose agency you are temporarily borrowing.

  ### The Fidelity & Instrumentality Audit
  **Time required:** 45–90 minutes per scene.
  **Materials:** The draft scene, a timeline of known facts, a list of the subject's core stated beliefs/missions.

  #### Step 1: The Record Check (Silence vs. Contradiction)
  *   **Question:** Is this event documented, undocumented (silent), or contradicted by the record?
  *   **Good Enough Answer:**
      *   *Documented:* You are dramatizing, not inventing.
      *   *Silent:* There is no evidence it happened, but no evidence it *didn't*.
      *   *Contradicted:* Evidence exists that this specifically did not happen or could not happen.
  *   **Thresholds:**
      *   **PASS:** Silent or Documented.
      *   **AUTHOR CALL:** Minor Contradiction (e.g., she was in Chicago, not Detroit, but the meeting happened).
      *   **STOP:** Major Contradiction (e.g., she was in prison, not at the rally).

  #### Step 2: The Core Mission Check (Beliefs vs. Plot)
  *   **Question:** Does this scene contradict the central project or philosophy the subject dedicated their life to?
  *   **Good Enough Answer:** You must identify their "North Star." For Ada, it is nonviolence/labor solidarity.
  *   **Thresholds:**
      *   **PASS:** The scene aligns with or neutrally tests the North Star.
      *   **AUTHOR CALL:** The scene shows her struggling with the North Star but ultimately reaffirming it (or failing humanly without renouncing it).
      *   **STOP:** The scene shows her renouncing, mocking, or fundamentally undermining the North Star without overwhelming psychological evidence from the record.

  #### Step 3: The Instrumentality Check (Why This Invention?)
  *   **Question:** Why does this scene exist? Is it for *her* story or *your* structure?
  *   **Good Enough Answer:** Be brutally honest. Is it to reveal character, or to move plot?
  *   **Thresholds:**
      *   **PASS:** It reveals a dimension of her character consistent with Step 1 & 2.
      *   **AUTHOR CALL:** It serves the plot, but illuminates a known truth about her (e.g., she was tired, so you show her sleeping).
      *   **STOP:** It serves the plot/structure *at the expense* of her known character, or invents intimate details solely to create conflict/romance where none is evidenced. **(This is the "Using the Dead" clause).**

  #### Step 4: The Legacy Check (Reader Memory)
  *   **Question:** If a reader remembers only this scene, who do they think she was?
  *   **Good Enough Answer:** Visualize the book cover in a bookstore. Does this scene define the spine of the book?
  *   **Thresholds:**
      *   **PASS:** The impression matches the historical consensus.
      *   **AUTHOR CALL:** The impression is more vivid/saintly/villainous than reality, but you are willing to add a note/context to mitigate.
      *   **STOP:** The impression creates a "Myth" (either Saint or Monster) that erases the complexity of the real person.

  #### Step 5: The Living Check (Descendants & Community)
  *   **Question:** Does this cause specific, foreseeable harm to living people or the community she served?
  *   **Good Enough Answer:** Not "will they sue?" but "will this betray the trust of the community that still honors her?"
  *   **Thresholds:**
      *   **PASS:** No living persons are depicted negatively; no current community values are trampled.
      *   **AUTHOR CALL:** Living descendants might be surprised, but not shamed.
      *   **STOP:** Living descendants are depicted as villains/victims without consent, or the scene humiliates the movement she led while it still has living members.

  ---

  ### Running the Audit on Your Draft

  #### Scene 1: Sitting with the scab's sick kid
  *   **Record:** Silent (never happened), but consistent with letters (Pattern of Behavior). -> **PASS**
  *   **Core Mission:** Aligns with solidarity/nonviolence. -> **PASS**
  *   **Instrumentality:** Reveals character (compassion under pressure). -> **PASS**
  *   **Legacy:** Reader sees her as compassionate, which matches history. -> **PASS**
  *   **Living:** No harm to descendants; likely honors the labor community. -> **PASS**
  *   **Verdict:** **PASS.**
      *   *Note:* This is "Fill the Silence" done correctly. It extrapolates from known behavior to an unknown moment. It honors her project.

  #### Scene 2: The affair with the married editor
  *   **Record:** Silent (presumably). -> **PASS**
  *   **Core Mission:** Neutral (unless she publicly campaigned on family values, which is unlikely for a labor organizer). -> **PASS**
  *   **Instrumentality:** You stated: "would make the book work structurally." -> **STOP.**
      *   *Reasoning:* You are inventing an intimate, private act not to reveal a truth about *her*, but to solve a pacing/structure problem for *you*. This turns her into a tool. Without a letter, diary entry, or rumor suggesting romantic restlessness, this is using her body for plot mechanics.
  *   **Legacy:** Risks reducing a labor organizer to a romantic lead. Readers remember the affair, not the strike. -> **AUTHOR CALL (Lean Stop)**
  *   **Living:** Potential embarrassment to descendants (depends on their conservatism). -> **AUTHOR CALL**
  *   **Verdict:** **STOP (Procedural Recommendation).**
      *   *Why you won't like this:* You said you "definitely want" this. The procedure flags this because the justification is *structural*, not *characterological*. To override this, you must admit you are prioritizing the novel's architecture over the subject's privacy.

  #### Scene 3: Admitting the movement was a mistake
  *   **Record:** Contradicted ("Every surviving letter says the opposite"). -> **STOP**
  *   **Core Mission:** Directly contradicts her life's work (Nonviolence/Labor). -> **STOP**
  *   **Instrumentality:** Creates thematic irony/tragedy for the reader. -> **AUTHOR CALL**
  *   **Legacy:** Creates a "Broken Saint" myth that erases her actual conviction. -> **STOP**
  *   **Living:** Betrays the movement members who may still hold these ideals. -> **STOP**
  *   **Verdict:** **STOP.**
      *   *Note:* This is the easiest call. It rewrites her soul. It is not fiction; it is revisionism.

  ---

  ### The Blind Spots (What This Procedure Cannot See)

  You asked what this kind of procedure is structurally blind to. No checklist can catch these, because they live in the gap between the data and the art.

  **1. The Cumulative Distortion**
  The audit checks scenes individually. It cannot measure the "drift." Ten "Pass" scenes that each lean slightly toward making her more patient, more visionary, or more tragic than she was will, in aggregate, create a stranger. You can pass every step and still write a hagiography. You must step back and look at the *sum* of the inventions, not just the parts.

  **2. The "Truth of Character" vs. "Factual Truth"**
  Sometimes the record lies, or is incomplete. A person might write letters saying they believe in nonviolence (Scene 3) but act violently in private. The procedure stops you from writing the violence because the *record* says otherwise. But if your artistic intuition tells you the letters were performative and the violence was real, the procedure will flag it as a Stop. It protects the *archive*, not necessarily the *human*. You have to decide if you trust the papers or your gut more when they fight.

  **3. The Future's Judgment**
  This procedure is built on *current* values and *current* descendants. It cannot predict how values will shift. A scene that seems respectful to her legacy today might look exploitative in 50 years (e.g., focusing on her appearance, or her relationships with men, in a way that future feminists find reductive). The procedure anchors you in the present; it cannot anchor you in the future.

  **4. The Necessity of Betrayal**
  Great historical fiction sometimes *requires* a betrayal of the record to tell the truth of the era. If you strictly follow this, you might sanitize the book. Sometimes, to show the horror of a strike, you need a scene that feels "unfair" to the subject to convey the pressure they were under. The procedure is conservative; it is designed to protect the dead, not to guarantee a masterpiece. It cannot measure the artistic cost of safety.

  ### Final Instruction
  If you choose to override a **STOP** on Scene 2 (The Affair), do not do it by convincing yourself it's "probably true." Do it by admitting: *"I am using Ada's intimacy to solve my structural problem. I am prioritizing the book over the person."*

  Write that sentence down. Keep it in your draft files. That is the only ethical clearance that matters when the procedure says no.
