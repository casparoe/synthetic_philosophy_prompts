answer: |-
  # Q&A Prep Sheet: Calibrated Conciliationism
  **Venue:** Philosophy Colloquium
  **Audience Profile:** Analytic Epistemologists (Bayesian majority, one Virtue, two Aesthetics). Non-specialists in disagreement literature.
  **Thesis:** Conciliate on shared-evidence/reasoning divergences; Stand Fast (with meta-acknowledgment) on axiological/value-weighting divergences.

  ---

  ### Objection 1: The Bayesian Partition Problem (Most Damaging)
  **Formulation:** "You distinguish between 'evidential reasoning' and 'value weighting.' But on a Bayesian model, what you call 'weighting' just looks like a prior probability assignment. If my colleague and I have the same data but different credences, one of us has a prior that deviates from the rational requirement. Why treat divergent priors as 'reasonable pluralism' rather than a cognitive error requiring conciliation?"

  **Reply (2 mins):**
  "Thank you. That's the crucial technical challenge. My distinction isn't between *priors* and *posteriors*, but between *likelihood functions* and *utility functions*. When we disagree on a scientific hypothesis given data, we are disagreeing on the likelihood of the data given the hypothesis—that's a cognitive map of the world. That mandates conciliation because the world is independent of us.
  However, when two curators disagree on a piece, they aren't necessarily disagreeing on the physical properties of the canvas (the evidence). They are disagreeing on the *significance* of those properties. One prioritizes historical context; the other, formal innovation. This isn't a failed calculation of likelihood; it's a divergence in what we take to be *good* or *significant*. If we treat axiological commitments as cognitive errors, we pathologize reasonable pluralism. We end up demanding everyone converge on a single 'correct' set of values, which is dogmatic. So, I concede priors about the world require updating. But priors about *value*—the weights we assign to competing goods—permit steadfastness because there is no mind-independent fact of the matter to converge upon."

  **Weakest Point:**
  This relies on a sharp fact/value distinction that many Bayesians reject. If they argue that "significance" is just a hypothesis about cultural impact (a factual claim), my distinction collapses back into standard Bayesian updating.

  ---

  ### Objection 2: The Operationalization Criterion
  **Formulation:** "You concede we need a non-circular criterion to draw the boundary between evidence and values. But in the middle of a dispute, how do I apply this? If I think your weighting is wrong, I'll naturally view it as a reasoning error. Doesn't your view grant me a 'steadfastness loophole' where I simply reclassify any stubborn disagreement as 'axiological' to avoid revising my belief?"

  **Reply (2 mins):**
  "That is the risk, and why I insist on *structured* steadfastness, not bare steadfastness. The criterion isn't introspective; it's counterfactual. Ask: 'If my colleague adopted my value weights, would the disagreement vanish?' If yes, it's axiological. If no—if even sharing my values, they would still interpret the data differently due to processing limits—it's evidential.
  To prevent the loophole, the 'meta-level acknowledgment' imposes a cost. You must explicitly state: 'I am not conceding error, but I acknowledge your weighting is permissible.' This forces you to publicize that the dispute is value-based. If you try to use this loophole in a scientific context, your peers will challenge the counterfactual. It's not a private exemption; it's a public classification subject to scrutiny."

  **Weakest Point:**
  The counterfactual test is hard to run in real-time. It requires knowing what the other person *would* believe if they shared your values, which is often as difficult as resolving the original disagreement.

  ---

  ### Objection 3: The Threat to Scientific Consensus
  **Formulation:** "You say science is evidential and art is axiological. But philosophers of science tell us theory choice involves epistemic values: simplicity, scope, fruitfulness. If two physicists disagree on a model because one weights 'simplicity' higher than 'scope,' your view says they should stand fast. That undermines the conciliationist instinct we hold for science."

  **Reply (2 mins):**
  "I agree science involves values, but the *role* of those values differs. In science, simplicity and scope are instrumental proxies for truth. We weight them because we think they track the structure of the world. If we disagree on weighting them, we are effectively disagreeing on which method best tracks truth—that is an evidential dispute about reliability.
  In aesthetics or ethics, the values are often constitutive, not instrumental. We don't value 'emotional resonance' because it tracks a hidden fact; we value it because it *is* the point of the art. So, scientific value-disagreement is actually a disguised evidential disagreement about truth-tracking efficacy. That's why science remains conciliationist under my view. The boundary holds, provided we recognize scientific values as heuristic tools for evidence, not ends in themselves."

  **Weakest Point:**
  This requires a robust defense of scientific realism. If the audience leans instrumentalist about science, the distinction between "instrumental" and "constitutive" values blurs, threatening to make science steadfast too.

  ---

  ### Objection 4: The Virtue Epistemology Challenge
  **Formulation:** "From a virtue perspective, isn't 'structured steadfastness' just a fancy name for intellectual stubbornness? Intellectual humility seems to require lowering my confidence when an equally competent person disagrees, regardless of the source. Doesn't your view license a vice?"

  **Reply (2 mins):**
  "Intellectual humility is about accuracy regarding your own limitations. If the disagreement stems from my cognitive processing, humility demands conciliation. But if the disagreement stems from a legitimate difference in what we care about, humility demands acknowledging *their* perspective as valid, not abandoning *my* commitment.
  Imagine two ethicists: one prioritizes liberty, the other equality. If they conciliate, they might settle on a muddled middle ground that honors neither. Steadfastness here isn't stubbornness; it's fidelity to a commitment. The 'meta-acknowledgment' is the humility component: admitting my commitment isn't the only rational one. So, calibrated conciliationism actually *requires* more nuanced virtue than blanket conciliation. It asks for the courage to stand on values and the humility to admit those values aren't universally binding."

  **Weakest Point:**
  The Virtue Epistemologist may argue that "fidelity to commitment" is not an epistemic virtue. If the goal is truth/knowledge, sticking to a value-weighting that prevents convergence might be seen as obstructing epistemic progress.

  ---

  ### Objection 5: The Phenomenology of Disagreement
  **Formulation:** "When I argue about art with a colleague, it doesn't *feel* like I'm weighing values. It feels like I'm seeing something they are missing. 'Can't you see the balance is off?' sounds like an evidential claim. Doesn't your view contradict the first-person experience of normative disagreement?"

  **Reply (2 mins):**
  "It does contradict the *surface* phenomenology, but I argue that phenomenology is misleading. We speak of values as if they were perceptions because that's how our cognitive architecture presents normative salience. When I say 'Can't you see?', I'm using a metaphor for 'Can't you feel the pull?'
  My view asks us to engage in a second-order reflection that overrides the first-order feeling. Just because a moral claim *feels* like a fact doesn't make it one. We should trust the structural analysis of the disagreement over the raw feel. If we can reconstruct the disagreement as a clash of weights rather than a clash of observations, we should treat it as axiological, even if it presents itself perceptually."

  **Weakest Point:**
  This asks the audience to distrust their immediate epistemic intuitions. If the "feeling of objectivity" is a reliable guide to the nature of the dispute, my view is asking them to ignore a primary data source.

  ---

  ### Objection 6: The Toothlessness of Meta-Acknowledgment
  **Formulation:** "Let's say I accept your view. I stand fast on my aesthetic judgment but acknowledge your weighting is permissible. What work is this doing? If my credence doesn't change, and my action doesn't change, isn't this just polite dogmatism? How is this distinct from standard steadfastness?"

  **Reply (2 mins):**
  "It changes the *social epistemology* of the dispute. Standard steadfastness treats the other as mistaken. My view treats the other as *different*. This preserves the possibility of collaboration without requiring conversion.
  In a museum context, if I think you're wrong, I try to correct you. If I think you weight differently, I invite you to curate a different wing. It shifts the goal from 'winning' to 'mapping the space of reasons.' It also prevents polarization. If we know we're allowed to stand fast on values, we stop trying to force evidence to do the work of values. So, it's not toothless; it changes how we interact, collaborate, and allocate resources, even if my internal credence in 'this is great art' remains high."

  **Weakest Point:**
  This is a pragmatic defense, not an epistemic one. If the audience cares primarily about individual belief accuracy rather than social coordination, this reply seems to dodge the epistemic normativity question.

  ---

  ### The "Hope Nobody Asks" Question
  **Question:** "Isn't your evidential/axiological boundary just a post-hoc rationalization of your own pre-theoretic intuitions? You want science to be conciliationist and art to be steadfast, so you drew a line that guarantees that result. How is this not ad hoc?"

  **Survival Strategy (Do not concede):**
  1.  **Acknowledge the risk:** "It is a genuine worry that the criterion is tailored to the output."
  2.  **Pivot to Explanatory Power:** "However, a criterion is justified if it explains *why* we have those intuitions, not just if it matches them. The distinction explains why scientific disagreement feels resolvable (convergence on truth) while aesthetic disagreement feels perennial (pluralism of goods)."
  3.  **The "Cost" Test:** "If this were merely ad hoc, it wouldn't impose costs. But my view *forbids* steadfastness in science even when values are involved (see Objection 3) and *forbids* conciliation in art even when evidence is shared. It cuts against the grain in specific cases, which suggests it's driven by the structure of the domains, not just a desire to validate instincts."
  4.  **Final Move:** "I am offering a descriptive metaphysics of disagreement types, not just a normative rule. If the metaphysics holds, the norm follows. The charge of ad hocness only sticks if the metaphysical distinction fails, which is what we are debating."

  **Risk:** If they press that the "metaphysical distinction" is itself unsupported, I have nowhere left to go but a bare intuition appeal. I must hold the line on the "Instrumental vs. Constitutive" value distinction (from Objection 3) as the independent anchor.
