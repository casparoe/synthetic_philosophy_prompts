          *   *Antiquarian:* Reverence for origins, preservation. Danger: Mummification, inability to create new things.
          *   *Critical:* Judging and condemning the past to break its chain. Danger: Rootlessness, injustice to the past.
      *   *The "Life" Concept:* Not just biological survival, but *strength*, *plastic power*, the ability to grow, incorporate, and overcome. It involves both remembering *and* forgetting.
      *   *The Specific Line:* "Wir wollen der Geschichte nur dienen, soweit sie dem Leben dient." (We want to serve history only insofar as it serves life.)
