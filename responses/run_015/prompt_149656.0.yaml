  The Timber of Veridia

  The river below the Span did not rush; it waited. It was the only thing in Veridia that did not require maintenance.

  Every year, on the day the frost broke, the town gathered on the bridge. It was not a ceremony of celebration, but of structural necessity. The Span was made of wood, and wood rots. To keep the bridge standing, every household had to donate a beam cut from their own property, shaped by their own hands, and fitted into the lattice by the collective labor of the town.

  Kael ran his hand along the central keel beam. It was smooth, oiled, and heavy.

  "It's solid," Kael said. He was the Keeper of the Span, the one who decided where each new piece went. "This year's hold is strong."

  Elara stood on the other side of the railing, looking not at the bridge, but at the road that led away from it. She held an axe over her shoulder. Her family's donation was a thick plank of ash, resting at her feet.

  "Strong enough to hold what?" Elara asked.

  "To hold us," Kael said. He picked up a chisel. "To keep the town connected. Without the Span, the north bank is isolated. We'd drift apart."

  "We're already drifting," Elara said. She kicked the ash plank. "Look at this wood. My father cut this tree ten years ago. He meant to build a boat. Then he decided to build a shed. Now it's a beam for the bridge."

  "And that's the point," Kael said, fitting the chisel into a joint. "He gave his labor to the town. That's binding. That's a promise."

  "It's a receipt," Elara corrected. "It's proof that we didn't leave."

  The metaphysics of the town were not spoken in lectures, but in the grain of the timber. The disposition of Veridia was simple: everyone wanted to leave. The soil was poor, the river was cold, and the world beyond the hills was wide. Every resident felt the pull of the horizon. That was the underlying disposition. The *fragility* of their residence.

  But the Span masked it.

  "If you wanted to leave," Kael said, driving the chisel home with a mallet, "you wouldn't be here shaping ash wood. You'd be gone. The fact that you are here, donating this beam, proves you have a disposition to stay."

  Elara laughed, a sharp sound that echoed off the water. "No, Kael. It proves I'm afraid the bridge will break if I don't."

  She walked to the edge of the Span and looked down. "Imagine I walk away. Right now. I leave this plank here. I walk across your beautiful bridge, and I keep walking."

  "The bridge would hold you," Kael said.

  "Would it?" Elara turned back. "If I leave, my family doesn't donate next year. The Henders leave too, because their son follows me. That's two beams missing. The lattice weakens. The town looks smaller. Then the Millers see the gap in the wood and think, 'Why are we fixing a bridge for a town that's dying?' So they leave. Their beams vanish."

  Kael stopped hammering. The silence stretched, filled only by the waiting river.

  "You're describing a collapse," Kael said.

  "I'm describing the truth," Elara said. "This bridge isn't built out of a desire to stay. It's built out of the fear that if we stop building it, we'll admit we want to go. The bridge is a mask, Kael. It hides the fact that there's nothing here keeping us but the bridge itself."

  Kael looked at the ash plank. It was a beautiful piece of wood. Dense. Resilient. It could support a ton of weight. But its strength was contingent on Elara standing there.

  "If the disposition to leave is real," Kael said slowly, "then the bridge is a lie."

  "If the disposition to stay is real," Elara countered, "then the bridge is unnecessary. Why build a wall to keep water in a bucket that isn't leaking?"

  "It's not a wall. It's a bond."

  "It's a fink," Elara said, using the old word they'd found in a book once, before the library rotted. "If the stimulus comes—if I actually try to leave—the condition changes. The bonds dissolve. The mask vanishes. And then the disposition manifests. I leave. But because I haven't left yet, the mask stays intact, and you call it a disposition to stay."

  Kael looked at the joint he was working on. It required Elara's plank to lock the previous year's beam in place. The structure was circular. The support depended on the presence of the supported.

  "So what do we do?" Kael asked. He didn't drop the hammer. "If we stop rebuilding, the bridge falls. If the bridge falls, everyone leaves. If everyone leaves, the bridge was never real."

  "And if we keep rebuilding," Elara said, picking up her ash plank, "we prove that the mask works. We prove that we can be held."

  She stepped forward and handed him the wood. It was heavy. Kael took it, feeling the weight of her choice. She wasn't staying because she loved the town. She was staying because she understood that her leaving would destroy the very thing that made staying possible. She was maintaining the mask to preserve the illusion of the disposition.

  "Fit it here," Kael said, pointing to the gap. "It needs to bear the load of the north walk."

  "If I fit it," Elara said, "I'm part of the structure. I can't leave without bringing the axe down on myself."

  "Then don't leave."

  "I didn't say I would."

  She watched him slide the ash into the lattice. It fit perfectly. The bridge groaned, a low sound of timber settling under tension, and then held firm. The structure was sound. The town was safe. The disposition to leave was successfully masked by the timber of their own making.

  Kael hammered the pin home. The sound rang out across the valley, signaling to the hills that Veridia was still there.

  "Next year," Kael said, wiping sawdust from his hands. "Will you bring wood?"

  Elara looked at the road, then at the bridge. She knew that if she said no, the wood would vanish, the bridge would weaken, and the answer would become irrelevant.

  "Yes," she said. "I'll bring wood."

  "Good," Kael said. "That shows you want to stay."

  Elara didn't correct him. She just watched the river wait beneath them, knowing that the water only flowed because the banks held it in.
