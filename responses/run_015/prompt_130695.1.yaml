answer: |-
  The rapid proliferation of large language models (LLMs) has transformed artificial intelligence from a niche technical pursuit into a global infrastructure of knowledge production. As these systems mediate access to information, healthcare, legal reasoning, and economic opportunity, the question of how to distribute the resources required to train them becomes a matter of urgent distributive justice. The core controversy lies in defining the metric of equality: should justice be satisfied by **representational resources** (proportional inclusion of linguistic data), **welfare** (uniform predictive performance across groups), or **capabilities** (functionally equivalent user agency)? While resources provide the necessary substrate and welfare offers a tangible benchmark, both fail to account for the structural inequities embedded in how AI outputs are consumed. A just allocation of AI resources must be measured by **capabilities**, and resolving the inherent "capability translation problem" requires shifting the primary locus of intervention from upstream training allocation to **downstream interface design**.

  To evaluate these metrics, one must first understand the appeal and limitations of the resource-based approach. The argument for representational resources is rooted in the principle of recognition. Historically, low-resource languages and non-Western cultural contexts have been erased from digital corpora. Proponents argue that justice requires a proportional allocation of compute and data tokens to match demographic reality. If a community comprises 5% of the global population, their linguistic data should comprise 5% of the training set. This metric is intuitively appealing because it addresses historical exclusion and treats data as a public good. However, resource equality suffers from the "mirror fallacy." Simply mirroring the web's existing data distribution often codifies existing power imbalances, as high-resource languages dominate the structural logic of the internet. More critically, equal data does not guarantee equal utility. A model trained on proportional data may still prioritize the syntactic and semantic norms of dominant languages, forcing minority users to bridge the gap between the model's output and their local reality.

  The welfare metric attempts to correct this by focusing on outcomes rather than inputs. Under this framework, justice is achieved when predictive performance—accuracy, perplexity, or task success rates—is uniform across groups. If an AI diagnoses a skin condition with 90% accuracy for English speakers, it must do the same for Swahili speakers. This outcome-oriented approach is vital for preventing algorithmic discrimination in high-stakes domains. Yet, welfare equality is often a illusion of standardization. "Accuracy" is frequently defined by the epistemic standards of the model's developers. A model might accurately predict legal outcomes based on US Common Law, satisfying a welfare metric for a user in a Customary Law context, yet the output remains functionally useless or even harmful to their specific legal needs. Welfare metrics measure how well the user fits the model, rather than how well the model fits the user's life.

  This brings us to the capability approach, derived from the work of Amartya Sen and Martha Nussbaum. In this framework, justice is not about the distribution of commodities (data) or the realization of specific states (accuracy), but about the expansion of human freedom—what people are actually able to do and be. In the context of AI, capability equality means ensuring that users across different communities possess functionally equivalent agency to achieve their valued functionings. This metric is superior because it accounts for **conversion factors**: the personal, social, and environmental variables that determine how a resource translates into freedom.

  The superiority of the capability metric becomes undeniable when addressing the **capability translation problem**. This structural mismatch occurs when equal data resourcing fails to produce equal welfare outcomes because different communities must expend unequal interpretive labor to adapt standardized model outputs to their local epistemic practices. Consider a medical AI trained on equal parts Western biomedical data and Indigenous holistic health data. Even if the data representation is balanced (Resource Equality) and the diagnostic probability is statistically confident (Welfare Equality), the output may be framed in clinical terminology that requires significant cognitive labor for a community healer to translate into their local practice. The Western user receives the output and acts; the Indigenous user receives the output, interprets it, translates it, and *then* acts. The "tax" on their agency constitutes an injustice that resource and welfare metrics render invisible. Only the capability metric, which measures the net freedom to act after accounting for this friction, identifies the disparity.

  If we accept capabilities as the metric of justice, we must determine how to resolve the translation gap. Does this require altering the training allocation itself or the downstream interface through which outputs are delivered? While diverse training data is a prerequisite, the resolution of the capability translation problem lies primarily in **altering the downstream interface**.

  The argument for focusing on training allocation assumes that the model itself must internalize every local epistemic practice to reduce user labor. This is technically inefficient and philosophically fraught. A monolithic model attempting to master every cultural nuance risks "semantic collapse," where distinct epistemic frameworks are blended into a homogenized average that serves no one well. Furthermore, training is static; culture is dynamic. Baking cultural adaptability into the weights of a foundational model is a brittle solution to a fluid problem.

  Conversely, the interface is the site where interpretive labor is expended. By shifting the focus to downstream interface design, we can offload the translation burden from the user to the system. This involves moving beyond simple chat windows to adaptive interaction layers that allow users to define their epistemic context before a query is processed. For example, a "cultural adapter" interface could allow a user to select a specific legal or medical framework, triggering retrieval-augmented generation (RAG) systems that ground the model's output in local ontologies before it reaches the user. The interface becomes a translator, not just a display screen. It can provide explanatory layers that contextualize *why* the model gave a certain answer and how it relates to local practices, thereby reducing the cognitive load required to utilize the information.

  Prioritizing the interface does not absolve developers of the need for diverse training data; however, it reorients the purpose of that data. Instead of training for raw token proportionality (Resource) or global accuracy benchmarks (Welfare), data is curated to support the interface's ability to localize. The goal is not to make the model "know" everything, but to make the system capable of routing queries to the right knowledge base and presenting the answer in a way that requires minimal interpretive labor from the user. This aligns with the capability metric: it maximizes the user's agency by minimizing the friction between the tool's output and the user's context.

  Critics might argue that interface solutions are merely cosmetic patches on a broken foundation. If the underlying model is biased, a localized interface cannot fix it. This is a valid concern, but it misunderstands the nature of the translation problem. The problem is not necessarily that the model lacks the information (a training deficit), but that the *delivery mechanism* assumes a universal context (an interface deficit). A model can contain the correct information but present it in a way that demands high conversion costs for specific users. By empowering the interface to manage context, we acknowledge that a single model cannot be all things to all people, but a flexible system can be.

  In conclusion, distributive justice in AI allocation must be measured by **capabilities**, specifically the preservation of functionally equivalent user agency across diverse contexts. Resource and welfare metrics are necessary but insufficient; they fail to capture the hidden tax of interpretive labor imposed on marginalized communities. The capability translation problem reveals that equality of input does not guarantee equality of freedom. Resolving this gap requires us to stop obsessing over the proportional composition of training datasets as the silver bullet of justice. Instead, we must invest in **downstream interface architectures** that are designed to absorb the burden of translation. By building systems that adapt to the user's epistemic practice rather than forcing the user to adapt to the model's output, we move from a distributive justice of things to a justice of freedoms. Only then can AI serve as a true equalizer of human potential rather than a multiplier of existing epistemic hierarchies.
