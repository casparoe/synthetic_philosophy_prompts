answer: |-
  You have identified a genuine and widespread conflation in the literature. Your intuition is correct: the phrase "costly signalling" is often used as a catch-all bucket for four mechanically distinct phenomena. In rigorous game theory and evolutionary biology, these are not the same machine. They solve different problems (information asymmetry vs. time inconsistency vs. physical constraint) using different leverage points.

  Here is the carving you are looking for, separated by mechanism, necessary conditions, and observable tests.

  ### 1. The Sorting Machine (Handicap Signals)
  **The Mechanism:** This is the classic Spence-Zahavi model. The goal is to reveal a **hidden type** (quality, resources, health) that exists *before* the signal is sent.
  **The Necessary Condition:** The cost must be **differential**. It is not enough for the signal to be expensive; it must be *more* expensive (in terms of utility/fitness) for the low-quality type than for the high-quality type. In economics, this is called the **Single Crossing Property**.
  *   *Why:* If the cost is the same for everyone, the low-quality type can simply pay it and fake the signal. The signal only works if the low-quality type *cannot afford* to pay the cost, while the high-quality type *can*.
  **The Frog Example:** You asked if the frog call is a limiting case of this. Theoretically, yes: you can model physical impossibility as "infinite cost." However, mechanistically, it is distinct (see Section 3).
  **Observable Test:** Ask, "If a low-quality individual desperately wanted to fake this, could they do it by suffering enough?"
  *   If **Yes** (but they choose not to because it hurts too much): It is a **Sorting Signal**.
  *   If **No** (they physically cannot): It is an **Index**.

  ### 2. The Incentive Machine (Commitment Devices / Bonding)
  **The Mechanism:** This is not about revealing a pre-existing trait; it is about constraining **future behavior**. This solves a problem of *time inconsistency* (the signaller might want to lie or defect later), not *information asymmetry*.
  **How it works:** The signaller burns a bridge, posts a bond, or makes a public sacrifice that makes it irrational for them to defect later. The cost doesn't tell the receiver "I am good"; it tells the receiver "I have removed my ability to be bad."
  **The "Flat Cost" Case:** This is where your third example belongs. If the cost is flat (the same for everyone) and does not sort by quality, it cannot be a Sorting Signal. It is a **Bond**.
  *   *Example:* Putting money in an escrow account. Rich or poor, the money is gone if you defect. It doesn't reveal your wealth; it reveals your commitment.
  **Name for the Flat-Cost Case:** In game theory, if the signaller voluntarily pays it to prove intent, it is a **Hostage** or **Bond**. If the receiver demands it to filter participants, it is a **Screening Device**.
  *   *Distinction from Waste:* Plain waste destroys value for no strategic gain. A Bond destroys value *conditionally* (you get it back if you don't defect, or you gain trust which yields future profit).
  **Observable Test:** Ask, "Does this cost change what the signaller will want to do *tomorrow*?"
  *   If **Yes**: It is a **Commitment Device**.
  *   If **No** (the cost is sunk and changes nothing but the receiver's belief): It is a **Signal**.

  ### 3. The Physical Machine (Indices)
  **The Mechanism:** This is a signal that is physically linked to the trait. It is not a choice to pay a cost; it is a physical consequence of being the thing you are claiming to be.
  **The Distinction:** In semiotics and biology, this is strictly called an **Index** (or Unfakeable Signal), distinct from a **Signal**.
  *   *Signal:* Can be faked at a cost (Peacock's tail).
  *   *Index:* Cannot be faked at any cost (Frog's pitch, a roar determined by lung size).
  **Why the distinction matters:** In a Sorting Signal, the equilibrium is maintained because low-types *choose* not to fake. In an Index, the equilibrium is maintained because low-types *cannot* fake.
  **Observable Test:** Ask, "Is the barrier economic (trade-off) or physical (constraint)?"
  *   If I could give a small frog a magical amplifier, would the signal work? If **No** (the pitch is still wrong), it's an **Index**. If **Yes** (the pitch is fixed, but the frog dies from the energy cost), it's a **Sorting Signal**.

  ### 4. Summary of the Carving

  | Feature | **Sorting Signal** (Handicap) | **Commitment Device** (Bond) | **Index** (Unfakeable) |
  | :--- | :--- | :--- | :--- |
  | **What it reveals** | Pre-existing **Type** (Quality) | Future **Intent** (Action) | Pre-existing **State** (Physics) |
  | **Role of Cost** | Must be **Differential** (Harder for low type) | Must be **Sunk** (Lost if you defect) | **Irrelevant** (Physics does the work) |
  | **Can low type fake?** | Yes, but it costs them more utility | Yes, but it changes their incentives | **No**, physically impossible |
  | **Economic Term** | Signalling (Spence) | Strategic Commitment (Schelling) | Indexicality (Peirce/Biology) |
  | **Your "Flat Cost"** | **NO** (Flat cost cannot sort) | **YES** (This is a Bond) | **NO** (Cost is not the barrier) |

  ### 5. Addressing Your Specific Questions

  **"What exactly has to be true of a cost for it to do the sorting work?"**
  It must satisfy the **Single Crossing Property**. The marginal cost of the signal must be negatively correlated with the quality being signalled. A large cost is *not* enough. A $1 million donation is a sorting signal for wealth, but not for courage, because a coward with $1 million can pay it just as easily as a brave person. For it to signal courage, the cost must be *psychologically* higher for the coward.

  **"Where the sorting machine stops and the incentive-changing one starts."**
  It stops where the cost no longer acts as a filter for *who you are* and starts acting as a leash for *what you will do*.
  *   *Sorting:* "I am rich, so I can afford this tail." (Reveals status)
  *   *Commitment:* "I have burned my ships, so I must fight." (Forces action)
  *   *Overlap:* Often, people use Sorting Signals to create Commitment. (e.g., A public moral stand is a Sorting Signal of "conviction" but also a Commitment Device because backing down now incurs reputation costs).

  **"Whether the physically unfakeable case belongs to either of them."**
  It belongs to neither, strictly speaking. It is an **Index**. However, in loose conversation, people call it a signal. In a debate, you should distinguish them. An Index is more robust than a Signal because it doesn't rely on the assumption that the low-type is rational; they literally cannot do it.

  **"If the flat-cost case has no name of its own, I'd like one."**
  If the cost is flat (nominal and utility) and does not sort by quality, but is paid to prove honesty, call it a **Sunk Cost Bond**.
  *   *Definition:* A voluntary, irreversible sacrifice of value that aligns the signaller's future incentives with the receiver's interests, without revealing information about the signaller's intrinsic quality.
  *   *Edge against Sorting:* Sorting requires differential cost; Bonds require irreversible cost.
  *   *Edge against Waste:* Waste has no strategic return; a Bond purchases trust or contractual enforcement.

  ### 6. A Debater's Diagnostic Checklist
  When you encounter a "costly signal" in the wild, run this three-step test to identify the machine:

  1.  **The Impossibility Test:** Could a low-quality individual produce this display if they had unlimited resources/willpower?
      *   If **No**: It is an **Index**. (Stop here).
      *   If **Yes**: Go to 2.
  2.  **The Differential Test:** Does the cost hurt the low-quality individual *more* than the high-quality individual (in utility, not just dollars)?
      *   If **Yes**: It is a **Sorting Signal**.
      *   If **No** (Cost is flat): Go to 3.
  3.  **The Incentive Test:** Does paying the cost change what the signaller wants to do *in the future*?
      *   If **Yes**: It is a **Commitment Bond**.
      *   If **No**: It is likely **Waste** or **Plain Signalling** (which will fail if cost isn't differential).

  **Application to your "Public Moral Stand" example:**
  *   Is it an Index? No, a hypocrite can make a stand.
  *   Is it Sorting? Yes, if the "cost" is social ostracization, which hurts a person with weak social support (low quality) more than a person with strong support (high quality).
  *   Is it Commitment? Yes, because making the stand publicly raises the cost of changing your mind later (reputation loss).
  *   *Verdict:* It is a hybrid. It sorts for "social resilience" and commits you to "consistency."

  You are right to feel that the single phrase "costly signalling" obscures these differences. In your arguments, precision here will allow you to dismantle cases where an opponent claims a flat fee proves quality (it doesn't; it proves liquidity) or where they claim a physical constraint is a choice (it isn't).
