answer: |-
  The stalemate is a meta-semantic conflict over the ontology of normative properties and the semantics of deontic vocabulary, not a substantive first-order ethical disagreement.

  **Possible Disagreement Types**
  *   **Empirical/Psychological:** Disagreement about how agents actually process or aggregate reasons (ruled out by case agreement).
  *   **Extensional:** Disagreement about which specific actions fall into which categories (ruled out by case agreement).
  *   **Verbal/Semantic:** Disagreement about the definition of "obligation," "moral," or "reason" without underlying metaphysical divergence.
  *   **Structural/Metaphysical:** Disagreement about the topology of normative space (binary vs. scalar) and the existence of sui generis normative properties.
  *   **Functional:** Disagreement about the practical role normative concepts play (guidance vs. evaluation).

  **Diagnosis**
  Your group is suffering from a **Bridge Principle Disagreement** masked as a structural debate. Side A operates on a **Deontic Fundamentalist** model where normativity is essentially binding; for them, a "moral reason" that does not contribute to an obligation is a category error, which is why they label Side B's "overhang" mystical. To Side A, the normative space is exhaustive: if it's moral, it demands, and if it doesn't demand, it's non-moral preference. Side B operates on an **Evaluative Fundamentalist** model where value is primary and obligation is a derived, limited subset. Their "normative overhang" is simply moral value that fails to cross the threshold of requiring action. The conflict arises because Side A defines the domain of the moral by its deontic force (bindingness), while Side B defines it by its evaluative content (goodness), leaving them talking past each other about whether the "leftover" value is real or nonsense. They agree on the map (the cases) but disagree on the legend (what the categories signify metaphysically). Side A sees the "gap" as a hard edge of the moral domain; Side B sees it as a soft threshold within a continuous field.

  **Path to Progress**
  Do not run experiments; this is not a psychological question about reason aggregation. Progress requires **formal semantic modeling** or **conceptual engineering**. You should attempt to formalize Side B's "overhang" using a multi-dimensional deontic logic (e.g., separating *requirement* operators from *merit* operators) to demonstrate whether "unassigned moral value" can be defined without contradiction. If the model holds, Side A's "mystical" charge is refuted by coherence; if the model collapses into redundancy, Side B must admit the dispute is merely verbal. Alternatively, shift the discussion to **conceptual functionalism**: ask what practical work the concept of "overhang" does that "agent-relative preference" cannot. If the answer is "nothing" regarding action-guidance, you have identified a verbal dispute about the label "moral," and you should stipulate definitions to move forward. If the answer is "it grounds praise/blame asymmetries," then the disagreement is about the necessary conditions for praise, which is a tractable first-order question.
