      Paragraph 2: Diagnosis.
      Paragraph 3: Progress.

      *Let's tighten the diagnosis:* The core is the **Bridge Principle**. Side A assumes a tight link (Value sufficient for Obligation at threshold). Side B assumes a loose link (Value can exist without Obligation). The "overhang" is just Value minus Obligation. Side A calls it mystical because they think Value *just is* potential Obligation.

