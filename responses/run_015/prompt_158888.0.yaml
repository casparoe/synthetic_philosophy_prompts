answer: |-
  This is a sophisticated methodological problem. You have identified two distinct but interacting dimensions of counterfactual reasoning that are frequently conflated in historical debate. The confusion arises because historians often treat counterfactuals as tests of *fact*, when they are often tests of *description* and *classification*.

  There is no single established term that captures the *rhetorical slide* you are describing, but the underlying mechanics are well-defined in the philosophy of action and causal theory. Below is the shape of the distinction, its edges, and a proposed vocabulary for your chapter.

  ---

  ### Version 1: The Granularity of the Effect
  **Established Concept:** *Event Individuation* (Philosophy of Action) / *Modal Fragility* (David Lewis).

  **The Shape of the Thing:**
  This is not merely about "detail"; it is about the **identity conditions of the event**. In causal theory, a cause $C$ is necessary for an effect $E$ only if, without $C$, $E$ does not occur. But whether $E$ "occurs" depends on how strictly $E$ is individuated.
  *   **Coarse-grained event:** "A war of expansion in the East." (Robust; likely happens without Hitler).
  *   **Fine-grained event:** "The Holocaust as a specific industrial process initiated in 1941." (Fragile; likely requires Hitler).

  Philosophers call this the problem of **Causal Relata**. Jaegwon Kim argued that events are triples of (Object, Property, Time). If you change the Property (the description of the outcome), you have a different event. Historians often argue past each other because one is testing the necessity of Hitler for Event $A$ (Coarse) and the other for Event $B$ (Fine), while both label it "The War."

  **Distinction from nearest concepts:**
  *   **Vs. Causal Strength:** This is not about how *strong* the cause is, but about the *tolerance* of the effect.
  *   **Vs. Probability:** It is not about the likelihood of the outcome, but the *definition* of the outcome.

  **Proposed Vocabulary:** **Outcome Granularity** or **Causal Resolution**.
  *   *High Resolution:* The effect is described with high specificity (dates, specific mechanisms, specific orders).
  *   *Low Resolution:* The effect is described functionally or typologically (regime type, general direction).

  **Boundaries:**
  *   **Clear Case:** Historian A argues Hitler was unnecessary for "German Revisionism." Historian B argues Hitler was necessary for "Operation Barbarossa." They explicitly acknowledge they are defining the outcome differently.
  *   **Borderline/Blurred Case:** Both historians claim to be discussing "The Second World War," but one treats it as a geopolitical conflict and the other as a racial-ideological project. The term is the same; the *individuation* is different.

  ---

  ### Version 2: The Specificity of the Cause
  **Established Concept:** *Token vs. Type Causation* / *Functional Substitutability* (Structural Functionalism).

  **The Shape of the Thing:**
  This version concerns the **replaceability of the causal agent**. It distinguishes between the *token cause* (this specific person, Adolf Hitler) and the *type cause* (the structural slot: "charismatic leader of a revanchist movement").
  *   **Token Necessity:** Without *this* man, *this* history does not happen.
  *   **Type Necessity:** Without *this* man, the *structural pressures* would have selected a functional equivalent.

  The "slide" you observe is a move from conceding Token Necessity to asserting Type Redundancy. The structuralist says: "Yes, Hitler made a difference (Token), but the system would have generated a Hitler-analogue (Type)." This is classic **Structural Functionalism** (e.g., Merton's distinction between *role* and *person*), but in counterfactuals, it functions as a claim about **Causal Redundancy**.

  **Distinction from nearest concepts:**
  *   **Vs. Overdetermination:** Overdetermination implies two *actual* sufficient causes exist simultaneously. This is about *potential* substitutes in a possible world.
  *   **Vs. Preemption:** Preemption is when one cause cuts off another. This is about whether the *slot* itself is the cause, rather than the occupant.

  **Proposed Vocabulary:** **Agent Substitutability** or **Structural Redundancy**.
  *   *Low Substitutability:* The agent possesses unique properties (idiosyncratic psychology, specific network) that cannot be replicated.
  *   *High Substitutability:* The agent is an vessel for structural forces; the "slot" determines the output.

  **Boundaries:**
  *   **Clear Case:** A debate about a constitutional monarch (high substitutability) vs. a cult leader (low substitutability).
  *   **Borderline/Blurred Case:** A debate about a political party leader. Was the ideology attached to the *person* or the *party platform*? If the platform existed independently, substitutability is high. If the platform was the person's idiosyncrasy, substitutability is low.

  ---

  ### The Interaction: Where the "Great Man" Debate Collapses
  You suspected these two versions are related. They are. They form a **Counterfactual Matrix**.

  The "Great Man vs. Structure" dispute is often a collision of **High Outcome Granularity** (Great Man view) against **High Agent Substitutability** (Structure view).
  *   **The Collision:** The Structuralist argues for High Substitutability (someone else would do it) assuming Low Outcome Granularity (a generic war). The Great Man historian argues for Low Substitutability (only Hitler) assuming High Outcome Granularity (the specific Holocaust).
  *   **The Blur:** Historians frequently shift *Outcome Granularity* to protect *Agent Substitutability*.
      *   *Example:* "Even without Hitler, Germany would have attacked Russia." (True at Low Granularity). "Therefore, Hitler was not responsible for the specific nature of the Eastern Front." (False inference, shifts to High Granularity without justification).

  ### Diagnostics for Historian's Prose
  To diagnose which question a historian is answering, apply these three tests to their counterfactual claims:

  **1. The Deviation Test (For Version 1)**
  *   *Ask:* "How much must the outcome change before the historian admits their counterfactual has failed?"
  *   *Diagnostic:* If a historian says "War still happens" and treats a delay of two years or a different alliance structure as a confirmation of their thesis, they are operating at **Low Outcome Granularity**. If they treat those same deviations as a falsification, they are at **High Outcome Granularity**.

  **2. The Description Test (For Version 1)**
  *   *Ask:* "Is the outcome described as a *particular* or a *universal*?"
  *   *Diagnostic:* Look for definite descriptions ("The Final Solution") vs. functional descriptions ("Genocidal policy"). The former demands High Granularity; the latter permits Low.

  **3. The Vacancy Test (For Version 2)**
  *   *Ask:* "If the agent is removed, does the historian describe the replacement as a *specific individual* or a *placeholder*?"
  *   *Diagnostic:* If the counterfactual posits "Goering" or "Himmler" (specific tokens), they are testing Token Necessity. If they posit "a military junta" or "another populist" (structural types), they are testing Agent Substitutability.

  ### Proposed Vocabulary for Your Chapter
  Since existing terms are scattered across metaphysics and sociology, I propose you adopt a paired terminology to clarify the distinction in your text:

  1.  **For Version 1:** Use **Causal Resolution**.
      *   *Usage:* "Historian A and Historian B are not disagreeing about the causal facts, but about the **Causal Resolution** of the effect. One requires a high-resolution match (the specific Holocaust); the other accepts a low-resolution match (authoritarian expansionism)."
  2.  **For Version 2:** Use **Agent Replaceability**.
      *   *Usage:* "The structuralist concession admits Token Causation but denies historical significance by asserting high **Agent Replaceability**. They argue the *slot* was the cause, not the *occupant*."
  3.  **For the Blur:** Use **Descriptive Drift**.
      *   *Usage:* "The debate stalls due to **Descriptive Drift**: as the argument proceeds, the definition of the outcome shifts from high to low resolution to preserve the claim of Agent Replaceability."

  ### Summary of the Distinction
  *   **Version 1** is about the **Effect**: How specific must the *consequence* be for the cause to be deemed necessary? (Event Individuation).
  *   **Version 2** is about the **Cause**: How specific must the *agent* be for the consequence to be deemed determined? (Token/Type Causation).

  The "blur" you are seeing is the unacknowledged trade-off between the two. If you demand High Causal Resolution (Version 1), Agent Replaceability (Version 2) almost always collapses. If you allow Low Causal Resolution, Agent Replaceability becomes plausible. Most historiographical disputes about the Third Reich are fights over where to set the resolution, disguised as fights about the agent.
