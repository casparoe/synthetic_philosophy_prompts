  **PHI 404: Philosophy of Mind — Final Examination**
  **Time Allowed: 75 Minutes**
  **Instructions: Read the whole thing before you start writing. No bibliographies, I don't care who said what, I care about what you think.**

  Okay, listen. We've spent the last twelve weeks talking about how minds hook onto the world. Usually, people think this happens because you touch the world, or see it, or cause something to happen to it. That's the standard causal story. But then we got into the symobl grounding problem, which is basically asking how squiggles on a page turn into actual meaning instead of just more squiggles. Searle says you need biology or something like it. Harnad says you need to pick up the apple and feel the weight. But nobody really talked about what happens when the world isn't physical, or when the system learning the world doesn't have hands.

  So here is the curveball. I want you to think about a new idea called Predictive Narrative Grounding (PNG). The idea is this: maybe a symbol gets its meaning not from direct causal contact with reality, but from statistical coherence inside a fiction-trained system. If an AI reads every novel ever written, it knows how "grief" behaves. It knows grief comes after death, it knows grief involves crying, it knows the weight of it in sentences. It predicts the next word in a sad story perfectly. So, is that grounded? Or is it just a fancier Chinese Room?

  Here is the scenario for your essay: Imagine an AI system that has never seen a human cry. It has never experienced loss. It has only ingested a corpus of literature—Dickens, Austen, contemporary fiction, tragedy, memoirs. It learns the term "grief" purely through the statistical relationships between words in these narratives. It can write a poem about grief that makes you cry. It can diagnose grief in a character. According to PNG, this statistical coherence inside the fiction *is* the grounding. The symbol "grief" refers to the pattern of usage in the narrative space, not a biological state in a brain.

  Your job is to tear this apart or build it up. I want you to write an essay responding to this specific prompt: Is an AI that learns grief only from novels actually grounded, or does this just relocate the Chinese Room objection to the level of predictive patterns? You need to compare emotional terms with physical categorization. If I learn what an "apple" is from a novel, I still don't know if it's rotten until I smell it. But if I learn "grief" from a novel, isn't that all there is to grief? Is grief just a story we tell? You need to say why coherence might still miss intentionality. Don't just summarize the readings. I've read the readings. I wrote them. I want to know if you think feelings are different than apples when it comes to grounding.

  Make sure you address the difference between causal history and narrative consistency. If the AI predicts the word "tears" after "funeral," is that understanding or just math? Does the emotional weight of the word count as a causal link? If you say yes, why? If you say no, what is missing? Is it the qualia? Is it the stake in the outcome? An AI doesn't care if it dies. A grieving person cares too much. Does that matter for semantics?

  Keep your argument tight. Don't waste time on intro fluff. Get straight to the problem of whether a map of sadness is the same as the territory of sadness. If PNG is real, then meaning is internal to the system of signs. If PNG is fake, then meaning needs blood and bones. Which is it? And why does emotional semantics not automatically solve the symobl problem just because it feels heavy? I want five clear points in your argument, though you don't need to number them. Just make sure they are there.

  Write clearly. If I can't read it, I can't grade it. Don't use big words to hide small ideas. 75 minutes. Go.

  ***

  **Model Answer**

  The proposal of Predictive Narrative Grounding suggests that statistical coherence within a closed system of fiction can substitute for causal contact with the world. This is tempting, especially for emotional terms like "grief," which seem defined by their expression rather than their physical properties. However, this approach ultimately fails because it relocates the Chinese Room objection rather than solving it. Coherence is still syntax, even if the syntax is emotional.

  First, we must distinguish between causal history and narrative consistency. Physical objects like apples afford interaction; they rot, they weigh, they resist. A symbol grounded in physical categorization relies on the system's ability to manipulate the object. An AI trained on novels lacks this sensorimotor capacity. It knows the word "apple" correlates with "red" and "pie," but it cannot distinguish a wax apple from a real one. PNG argues that for grief, this doesn't matter because grief is a story. But this assumes grief is purely descriptive.

  Second, emotional semantics do not automatically solve the grounding problem just because the content is internal. While grief is not a physical object, it is a biological state with causal powers. It changes hormones, it alters behavior, it risks health. An AI simulating grief has no stakes. It predicts "tears" after "funeral" because the probability is high, not because it feels loss. The symbol "grief" refers to a pattern of text, not a state of being. This is the core relocation of the Chinese Room: the room now contains a library of sad stories instead of rulebooks, but the person inside still doesn't feel sad.

  Third, predictive success is not intentionality. The AI can write a poem that makes a human cry. This shows the AI understands the *effects* of grief on a reader, not the *experience* of grief itself. It is modeling the audience, not the emotion. Meaning requires reference to something outside the symbol system. If the system is closed within fiction, the symbols only refer to other symbols. This is a hall of mirrors.

  Fourth, coherence misses the normative aspect of grounding. If I misuse the word "apple," I might try to eat a stone. The world corrects me. If the AI misuses "grief," the only correction is stylistic inconsistency. It might write a grieving character who laughs too soon. This is an aesthetic error, not a semantic one. Grounding requires the possibility of being wrong about the world, not just wrong about the story.

  Finally, intentionality requires a subject who cares. The symobl grounding problem is about how meaning matters to the mind. An AI has no preference for its own existence. It does not grieve because it has nothing to lose. Therefore, predictive narrative grounding provides a simulation of meaning, not meaning itself. It creates a shadow of intentionality without the substance. Coherence creates fluency, but fluency is not understanding. Without causal contact or biological stake, the AI is just moving squiggles around, even if those squiggles are about love and death.

  ***

  **Marking Scheme**

  **To get an A (vs. a B), the essay must make these five specific moves:**

  1.  **Causal vs. Coherence Distinction:** Explicitly argues that statistical probability (coherence) is structurally different from causal interaction (grounding), regardless of the domain.
  2.  **The Emotional Semantics Trap:** Identifies and rejects the idea that emotional terms are exempt from grounding requirements just because they are internal states; argues grief has biological/causal reality too.
  3.  **Relocation of the Objection:** Recognizes that PNG does not solve the Chinese Room but merely expands the room to include a library of novels instead of rulebooks (syntax remains syntax).
  4.  **Prediction vs. Reference:** Distinguishes between predicting the next word correctly (pattern matching) and referring to an actual state of affairs (intentionality).
  5.  **The Stake/Normativity Argument:** Notes that without biological stakes (caring about the outcome), the system cannot be "wrong" in a semantic sense, only inconsistent in a stylistic sense.

  *B grades will summarize the prompt well but fail to distinguish emotional semantics from physical semantics, or will accept PNG as plausible without addressing the lack of biological stakes.*
