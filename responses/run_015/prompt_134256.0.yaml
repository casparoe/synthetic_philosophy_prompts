          *   Side 2 (Value-Form/Social Form): Focus on *Labor as Form*. Value is a social relation. Machines don't change the relation unless the relation is changed. Crisis = Intensification/Barbarism.
      *   *The "Fragment" Issue:* The *Grundrisse* is optimistic/speculative. *Capital* is critical/systemic. The deadlock comes from prioritizing one text over the other.
