answer: |-
  ### Restatement in Mechanism Design Vocabulary

  Consider a Social Planner attempting to implement a Social Choice Function (SCF) over an infinite horizon dynamic game. The Planner's objective is to select a strategy profile that achieves ex-ante efficiency relative to a specified welfare function (payoff structure). The problem of consequentialist cluelessness translates to the claim that the type space governing future payoff-relevant states is subject to radical misspecification. Specifically, the common prior assumption fails such that beliefs over distant states exhibit heavy tails or unbounded support where higher moments do not exist. Consequently, the expected payoff integral defining the Planner's objective function fails to converge or is infinitely sensitive to prior perturbations (lack of robustness). Under these conditions, no incentive-compatible mechanism exists that maximizes the objective, as the objective function is ill-defined over the feasible set of strategies, rendering the optimization problem ill-posed.

  ### Component Mapping

  1.  **Consequentialist Objective (Maximize Good)**
      *   *Translation:* Ex-ante efficiency criterion / Social Welfare Function maximization.
      *   *Status:* **Clean Map.** The structural role of the objective function in MD matches the role of "the good" in consequentialism, provided utility is cardinal and interpersonally comparable.

  2.  **Long-Run Outcomes**
      *   *Translation:* Infinite horizon dynamic mechanism / Repeated game with discounting.
      *   *Status:* **Clean Map.** Standard MD handles infinite horizons via discounted sums or limit-of-means criteria.

  3.  **Predictive Models of Distant Outcomes**
      *   *Translation:* Beliefs (Priors) over the type space and state transitions.
      *   *Status:* **Clean Map.** Uncertainty in MD is modeled via probability distributions over types/states.

  4.  **Radical Unreliability (Cluelessness)**
      *   *Translation:* Failure of Common Prior; non-robustness to misspecification; unawareness of payoff-relevant states; heavy-tailed distributions causing non-convergence of expectations.
      *   *Status:* **Distorted Fit.** Standard MD assumes the type space is common knowledge (even if types are private). "Radical unreliability" implies unawareness or Knightian uncertainty where the probability space itself is unknown. While robust mechanism design (e.g., Bergemann & Morris) addresses misspecification, it typically assumes bounded uncertainty, whereas cluelessness posits unbounded epistemic failure.

  5.  **Collapse of Expected-Value Reasoning**
      *   *Translation:* Non-existence of equilibrium; undefined payoff integrals; ill-posed optimization problem.
      *   *Status:* **Clean Map.** If the expectation operator is undefined, Bayesian Nash Equilibrium and optimal mechanism characterization cannot be derived.

  6.  **Moral Obligation / Normative Force**
      *   *Translation:* The requirement that the Planner *ought* to maximize the function despite ill-posedness.
      *   *Status:* **No Counterpart.** MD is a positive framework describing feasibility constraints given preferences; it contains no operator for normative obligation independent of the specified objective function.

  ### Residue Report

  The unmapped residue consists entirely of the normative force—the claim that an agent retains an obligation to optimize even when the objective function is mathematically ill-defined. Mechanism design lacks resources for normative reasoning by design; it treats undefined objective functions as feasibility constraints rather than moral dilemmas. In MD vocabulary, if the expected payoff integral does not converge, there is no "optimal mechanism" to implement, and the design problem is simply unsolvable. The philosophical argument of cluelessness relies on the intuition that moral reasoning must provide guidance even when the optimization problem is ill-posed. However, formalization reveals this intuition to be a category error: one cannot maximize a undefined function. Therefore, the residue indicates that the original philosophical argument relies on intuitions regarding normative obligation that dissolve once formalized as mathematical feasibility constraints. The "collapse" is not a paradox of reasoning, but a signal that the preconditions for optimization are not met.

  Summary: The residue indicates that the philosophical argument relies on intuitions regarding normative obligation that dissolve when formalized as mathematical feasibility constraints within mechanism design.
