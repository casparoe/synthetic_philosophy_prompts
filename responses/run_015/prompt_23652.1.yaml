  8.  *(Final thought before generating)*: Make sure to emphasize that rejecting the "inherently suspect" claim doesn't mean accepting most conspiracy theories. It means accepting that *some* are possible, which makes the ones that fail actually fail on evidence, not definition. This is crucial for the advisor who thinks the user is too soft. The hard line is: "Demand evidence, don't ban the category."

