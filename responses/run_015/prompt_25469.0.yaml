answer: |-
  Your intuition is excellent. You have spotted a very common pedagogical simplification. While your professor's summary captures the *surface* argument of "Of Cannibals," it imposes a modern anthropological framework (cultural relativism) onto a text that is fundamentally a work of **moral skepticism and humanist self-critique.**

  If you were to push back in a seminar, a careful reader of Montaigne would accept about 60% of that summary but would strongly contest the philosophical conclusion regarding "objective standards" and the label of "cultural relativism."

  Here is a breakdown of what works, what doesn't, and why the label matters.

  ### 1. What a Careful Reader Would Accept
  Your professor is correct on the textual evidence regarding Montaigne's critique of European arrogance.

  *   **The Redefinition of "Barbarism":** Montaigne famously opens by noting that "barbarian" is a word we use for anything not of our own practice. He argues that the Tupinambá are not barbarous by nature, but only by our labeling. This is a core tenet of the essay.
  *   **The Comparison of Violence:** The summary accurately reflects Montaigne's gruesome comparison. Montaigne details how the Tupinambá eat the bodies of enemies *after* they are dead (as a form of extreme vengeance/ritual), whereas Europeans torture living bodies (burning at the stake, breaking on the wheel) in the name of religion and order. Montaigne explicitly states the European acts are worse because they inflict pain on the living and are done under the guise of virtue.
  *   **The Critique of Ethnocentrism:** Montaigne absolutely argues that Europeans are too quick to judge foreign customs as "monstrous" without examining their own.

  ### 2. Where the Summary Flattens the Argument
  The summary goes off the rails when it moves from *description* to *philosophical conclusion*. This is where your feeling that something is "off" is justified.

  **A. "No Objective Standard" vs. "The Law of Nature"**
  The professor claims Montaigne argues there is *no* objective standard. A careful reader knows Montaigne actually appeals to a standard: **Nature.**
  Montaigne is a Humanist influenced by Stoicism and Skepticism. He does not argue that "all morals are equal." He argues that the Tupinambá live closer to the "laws of nature," while Europeans have corrupted themselves with "artifice" and civilization.
  *   **The Pushback:** Montaigne isn't saying, "Cannibalism is good for them, torture is good for us." He is implying that the Tupinambá possess a natural virtue (courage, loyalty, lack of greed) that Europeans have lost. He praises them *objectively* for these virtues. If he were a true relativist, he couldn't praise one culture's virtues over another's; he would just say they are "different." But Montaigne clearly thinks the Tupinambá are, in specific ways, *superior* to the French.

  **B. "Morality is Just Local Custom"**
  The summary claims Montaigne concludes morality is *just* custom. This is the most significant distortion.
  *   **The Pushback:** Montaigne uses the Tupinambá to show that *custom blinds us to morality*, not that custom *creates* morality. He wants the reader to strip away custom to see universal human truths.
  *   For example, Montaigne praises the Tupinambá leadership structure not because it is "their custom," but because it reflects a natural equality that he believes is universally preferable to European hierarchy. He is using the "other" to critique the "self," implying a universal standard of human dignity that Europe is violating.

  **C. The Purpose of the Essay**
  The summary treats the essay as an early work of anthropology (studying *them*).
  *   **The Pushback:** The essay is actually about *us*. The Tupinambá are a rhetorical mirror. Montaigne admits he knows very little about Brazil (he spoke to one traveler and one Tupinambá man in Rouen). He isn't trying to write an ethnography; he is trying to shame the French nobility during the Wars of Religion. The cannibals are a device to shock the European reader into recognizing their own savagery.

  ### 3. Does the Label "Cultural Relativism" Fit?
  **Short Answer:** No, not really. It is anachronistic.

  **Long Answer:**
  Cultural Relativism (specifically normative relativism) holds that moral truth is determined by culture, and no culture can judge another. Montaigne's position is better described as **Pyrrhonian Skepticism** combined with **Natural Law.**

  *   **Skepticism:** Montaigne suspends judgment on whether European ways are "true" or "right" because he sees how fragile and contradictory they are. He uses doubt to humble European pride.
  *   **Natural Law:** Montaigne believes there is a "natural" way to be human. He argues that civilization (laws, religion, complex social hierarchies) often corrupts this nature. The Tupinambá are praised because they are "wild" in the sense of being uncorrupted by artifice, not because their specific customs are inherently valid regardless of content.

  If Montaigne were a cultural relativist, he would have to accept European torture as "valid for Europeans." But he doesn't. He condemns European torture universally. He argues that *both* cultures should be judged by how well they adhere to natural virtue and reason. By that metric, he suggests the Tupinambá are currently winning.

  ### 4. Why the Distinction Matters
  If you accept the professor's summary, Montaigne becomes easy to dismiss: *"Oh, he's just a relativist saying anything goes. But surely torture is objectively wrong?"*

  If you read Montaigne carefully, his argument is much harder to dismiss: *"He is arguing that our claim to moral superiority is a delusion caused by custom, and that by the very standards of virtue and cruelty we claim to uphold, we are failing."*

  The professor's summary makes Montaigne sound like a modern liberal anthropologist. The actual Montaigne is a conservative skeptic who believes civilization corrupts human nature. He isn't saying "all cultures are equal"; he is saying "we have fallen from a natural standard that these people still maintain."

  ### Summary for Your Understanding
  *   **Accept:** Montaigne critiques ethnocentrism; he redefines "barbarism"; he compares ritual cannibalism favorably against religious torture.
  *   **Reject:** The idea that Montaigne believes *no* objective standard exists. He believes in "Nature" as a standard.
  *   **Reject:** The label "Cultural Relativist." He is a Moral Skeptic and a Humanist.
  *   **Refinement:** The essay is not a defense of cannibalism per se; it is an indictment of European hypocrisy.

  Your instinct that the summary "flattens" the position is correct. It turns a complex moral mirror into a simple sociological observation. Montaigne isn't telling us to tolerate all customs; he's telling us to recognize the barbarism in our own.
