      *   **Task:** Evaluate the summary (what's accurate, what's pushback-worthy) and assess the label "cultural relativism."

  2.  **Deconstruct the Professor's Summary:**
      *   *Claim 1: No objective standard to judge other cultures.* (Partially true, but nuanced).
      *   *Claim 2: Calling Tupinambá 'barbarous' is European prejudice.* (True, Montaigne explicitly redefines "barbarism").
      *   *Claim 3: Tupinambá eat enemies after honorable combat/ritual of respect vs. Europeans torture/burn over religion.* (True, this is the core comparison).
      *   *Claim 4: Europeans are far worse.* (True, Montaigne implies this).
      *   *Claim 5: Essay is an early statement of cultural relativism.* (Controversial/Problematic).
      *   *Claim 6: Conclusion is no culture's practices are better/worse, morality = local custom.* (This is the strongest point of contention).

  3.  **Consult Knowledge of Montaigne & "Of Cannibals":**
      *   *Key Theme:* Ethnocentrism vs. Human Nature. Montaigne critiques European arrogance.
      *   *Definition of "Barbarian":* Montaigne says "barbarian" means what is not of our own practice. He implies *we* are the barbarians.
      *   *Natural Law vs. Custom:* Montaigne often appeals to "laws of nature" or reason, not just pure custom. He praises the Tupinambá for living according to nature, not just because it's *their* custom.
      *   *Universal Values:* Does Montaigne think *anything* is objectively good? Yes, virtues like courage, loyalty, and naturalness seem to hold value for him across cultures. He isn't saying "anything goes"; he's saying "look closer before you judge, and realize your own society might be more vicious."
      *   *Relativism Label:* Strong cultural relativism (moral truth is *only* determined by culture) is anachronistic and doesn't fit Montaigne's humanism. He uses the Tupinambá as a mirror to critique Europe, implying a standard of "natural virtue" that Europe has lost.
      *   *The "Flattening":* The professor makes Montaigne sound like a modern anthropologist. Montaigne is a moralist and skeptic. He isn't saying "morality is just custom"; he's saying "our custom blinds us to true morality."

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's intuition. It *is* a common simplification. Acknowledge the professor isn't *wrong* per se, but misses the philosophical depth.
      *   **What the Summary Gets Right:**
          *   Critique of ethnocentrism (the definition of "barbarism").
          *   The specific comparison (ritual cannibalism vs. religious wars/torture).
          *   The skepticism toward European superiority.
      *   **Where the Summary Flattens/Misleads (The Pushback):**
          *   *The "No Objective Standard" claim:* Montaigne *does* appeal to nature/reason. He thinks the Tupinambá are *actually* better in some ways, not just "different."
          *   *The "Morality is Just Custom" claim:* This is the big one. Montaigne believes in natural virtue. He uses the Tupinambá to show Europeans have *corrupted* nature with artifice.
          *   *The Purpose:* It's not anthropology; it's self-critique. The Tupinambá are a rhetorical device (the "Noble Savage" precursor, though Montaigne is more nuanced).
      *   **The "Cultural Relativism" Label:**
