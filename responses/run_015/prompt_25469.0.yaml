      *   **Professor's Summary:** Montaign argues no objective standard exists; calling Tupinambá "barbarous" is prejudice; Tupinambá ritual cannibalism vs. European religious torture (Tupinambá better); Essay = early cultural relativism (no culture better/worse, morality = local custom).
