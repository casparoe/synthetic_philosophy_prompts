      *   *The Background Assumptions:*
          *   Assumption 1 (Centralized): Only a central power could enforce such uniformity. Therefore, it's an institution (either Temple or State).
          *   Assumption 2 (Distributed): Local groups adopted a common visual language for different reasons.
      *   *The Conceptual Circle:* To call it "religious," we assume symbolic unity. To call it "economic," we assume pragmatic unity. But we only know the unity exists because we grouped the artifacts together based on... our own typological criteria.

  5.  **Refining the Philosophical Argument:**
      *   Need to highlight *material culture mediating collective cognition*.
      *   If we view the markers as "symbols," we assume the mind works via representation (belief).
