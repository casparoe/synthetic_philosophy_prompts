  **Package Leaflet: Information for the User**

  **Phenomenality Reduction Therapy**

  **Read all of this leaflet carefully before you start this treatment because it contains important information for you.**
  *   Keep this leaflet. You may need to read it again.
  *   If you have any further questions, ask your doctor or pharmacist.

  **1. What Phenomenality Reduction Therapy is for**
  Phenomenality Reduction Therapy (PRT) is used for the treatment of persistent intuitions regarding intrinsic, ineffable properties of experience. It is important to state clearly: this therapy does not deny that you are conscious. It denies only a certain characterisation of consciousness, specifically the bit about intrinsic, 'what it's like' properties. You remain fully functional. The treatment targets the cognitive misrepresentation that suggests your internal states possess private qualities over and above their functional role.

  **2. Before you start**
  Do not start PRT if you are unwilling to accept that your introspective access is subject to error. Tell your doctor if you have a strong pre-existing belief that redness exists inside your mind rather than as a surface property of objects.

  **3. How it works**
  The active component of PRT operates on the higher-order monitoring systems within the cognitive architecture. Normally, these systems track first-order sensory states. However, due to evolutionary constraints, the monitoring mechanism employs a non-veridical model of its own operations. It represents these states as having simple, unanalysable qualities. PRT adjusts the gain on this monitoring process. It does not alter the input data or your behavioural outputs. It simply recalibrates the descriptive framework used by the brain to catalogue its own activity. You may find that the treatment feels slightly disorientating initially — appears to proceed in a manner consistent with cognitive recalibration — whilst the system updates its self-model.

  **4. Possible side effects**
  Like all medicines, this therapy can cause side effects, although not everybody gets them.

  *   **Persisting conviction that there is something it is like to be you:** This is a harmless by-product of introspection misrepresenting its own states. Much like the Müller-Lyer illusion where lines of equal length look different, your cognitive system may continue to present states as having phenomenal depth even after the properties have been removed. Knowing the lines are equal does not stop them looking unequal; similarly, knowing there is no 'what it's like' does not stop the intuition persisting.
  *   **Residual sense that colours are somehow coloured:** Patients may report that red still looks red. This is expected. The visual system represents surface reflectance profiles as simple qualities. This is a useful fiction for navigation.
  *   **Pain management:** The treatment removes the hurtfulness, not the functional role. Patients are reassured they will still withdraw from injury. The nociceptive reflex remains intact; only the subjective burden is lifted.

  **5. Frequently Asked Questions**
  *Q: Is the illusion itself something there's something it's like to have?*
  A: The illusion consists in the judgement that there is something it is like. To ask if the illusion has phenomenality is to ask if the misrepresentation represents itself accurately. The system represents the state as phenomenal. There is no additional fact of the matter regarding how that representation feels to the system.

  **6. Reporting of side effects**
  If you get any side effects, talk to your doctor. This includes any possible side effects not listed in this leaflet. Patients who notice any remaining phenomenality after finishing the course should be invited to report it, in the usual official way, on the yellow card provided. By reporting side effects you can help provide more information on the safety of this medicine.

  **End of Leaflet**
