answer: |-
  Thank you for having me. And thank you for being here.

  Looking around this room, I see two groups of people who were in the same room with my brother, but who saw two very different things.

  To the medical team, I know what you saw. You saw a legal and biological conclusion. You saw a man who was gone, kept physiologically stable for the sake of others. But to my family, especially my little sister, we saw a man with warm hands. We saw a chest rising. We heard a heart beating.

  My sister says he didn't die in March when the doctors declared it. She says he died two days later, when the ventilator was turned off. Some days, I tell her she's wrong. But some days, standing at his bedside, I thought she was right.

  I want to talk about that gap. Because if we are going to honor our donors, we have to honor the confusion that comes with it.

  When the coordinator spoke to us, she mentioned a policy option. We could have kept the testing exactly as it was, but instead of accepting the time of brain death, we could have withdrawn support and waited for the heart to stop. The death certificate would reflect that later time. My sister wanted this. She needed to hear that flatline.

  I said no. I told the team it felt like theatre. I told them I didn't want to prolong the mechanics of it.

  I stand by that choice, but I also want to say this to the families here who might have chosen differently: You are not wrong. Waiting for the heart to stop wouldn't have brought him back. It wouldn't have changed the medical reality. But grief isn't always about reality. Sometimes it's about what your eyes can accept. If waiting for that monitor to flatline gives you a moment of certainty that lets you sleep at night, that is a valid need. I chose the clinical truth; my sister needed the visual one. Neither of us loved him less.

  And then, there is the part that still haunts us. During the recovery, the team administered medications. They told us it was to prevent spinal reflexes, to keep the organs stable. They told us he couldn't feel pain. He was dead.

  But to watch a nurse push medication into the IV of your dead brother? That creates a crack in your understanding of the world. If he was gone, why does he need medicine?

  I've thought about this a lot. I know now that the body is a machine that can run for a while after the operator has left the room. The reflexes are electrical, not conscious. The medication wasn't for *him*. It was for the *process*. It was to ensure that the gift we were giving didn't fail in the final hour.

  But knowing that doesn't stop the flinch. It looks like care for a living person. It feels like a contradiction. To the families here: If that detail has stuck in your throat, if it made you question the narrative you were told, please know that your reaction is human. It is okay to be disturbed by the sight of a body being treated like a patient when the person is already gone. It is a surreal, jarring thing.

  To the staff in the room: Thank you for treating his body with that level of precision. I know it was to protect the recipients. But please understand that to us, in the moment, it looked like you were still trying to save him. That ambiguity is heavy.

  We are here because my brother's death allowed others to live. That is the truth I hold onto most tightly. But it is not the only truth. There is also the truth of a sister who couldn't say goodbye until the machine went silent. There is the truth of a brother who winced when the meds went in.

  Donation asks families to live in the space between two realities: the biological end and the physical continuation. It is a heavy ask. It is a painful paradox.

  If you are a family member here struggling with the timeline, or the details, or the "what ifs" of how it happened, I hope you can forgive yourselves. There is no perfect way to navigate this. There is only the way you survived it.

  My brother is gone. But because you were there, and because we said yes, pieces of him are walking around in the world. I can accept the brain death. I can accept the medications. And I can accept that my sister needs to mark the date differently.

  In the end, the clock on the certificate matters less than the love that brought us to this room. Thank you for honoring him, and thank you for honoring the complexity of our grief.
