  # JOINT STATEMENT ON ACCURACY AND INQUIRY

  **Preamble: Scope and Definitions**
  This document records the output of an adversarial collaboration between two research programs in epistemology. Camp A (**Accuracy-First**) treats epistemic norms as derived from the goal of maximizing the accuracy of belief states. Camp B (**Zetetic**) treats epistemic norms as governing the conduct of inquiry (questions, experiments, attention).

  We adopt the following formalism for the duration of this statement:
  *   Let $W$ be a set of possible worlds.
  *   Let $C$ be a credence function (a probability distribution over $W$).
  *   Let $S(c, w)$ be a **scoring rule**, assigning a real-valued penalty (loss) to credence $c$ given world $w$. Lower is better.
  *   $S$ is **proper** if for any $c, d$, $E_c[S(c, W)] \leq E_c[S(d, W)]$.
  *   $S$ is **strictly proper** if equality holds only when $c = d$.
  *   $S$ is **convex** if the expected score function is convex in $c$.
  *   **Synchronic** evaluation assesses a belief state at a single time $t$. **Diachronic** evaluation assesses a trajectory of states and actions over $[t_0, t_1]$.

  We note one critical idealization: Much of the Accuracy-First machinery assumes **Logical Omniscience** (agents recognize all logical consequences of their beliefs). We flag below where the failure of this assumption is the actual source of disagreement rather than the normative framework itself.

  ---

  ## 1. AGREED CLAIMS (THE MACHINERY)

  Both camps sign the following fourteen claims regarding the formal properties of the evaluation framework.

  1.  **Propriety is Necessary for Incentive Compatibility.** If a scoring rule is not proper, an agent maximizing expected accuracy will have an incentive to report a credence different from their true belief. Both camps agree that epistemic evaluation should not incentivize misrepresentation of one's own state.
  2.  **Strict Propriety Uniquely Identifies Truth.** Only strictly proper scoring rules are minimized in expectation by the truth (the Dirac delta distribution on the actual world). Both camps agree that truth is the unique minimizer of epistemic loss.
  3.  **Convexity Implies Probabilism.** If the scoring rule is strictly proper and convex, any non-probabilistic credence function (one violating the axioms of probability) is strictly dominated by some probabilistic function. Both camps accept this as a proof that coherence is a necessary condition for undominated accuracy.
  4.  **The Value of Free Evidence (Good's Theorem).** For any strictly proper scoring rule, if an agent expects to update by conditionalization, the expected score of observing free evidence is at least as good as the expected score of not observing it. $E[S(C_{post}, W)] \leq E[S(C_{prior}, W)]$. Both camps accept the mathematics of this theorem.
  5.  **Calibration and Sharpness are Distinct.** A scoring rule (like Brier or Log Loss) can be decomposed into calibration (do probabilities match frequencies?) and refinement/sharpness (how concentrated are the probabilities?). Both camps agree these are distinct properties of a forecaster.
  6.  **Synchronic Scores Ignore History.** A standard synchronic score $S(c_t, w)$ depends only on the current credence and the world. It is invariant to how the agent arrived at $c_t$. Both camps agree this is a feature of the standard metric.
  7.  **Diachronic Scores Aggregate Time.** A diachronic score can be defined as $\int_{t_0}^{t_1} S(c_t, w) dt$ (possibly discounted). Both camps agree this is a well-defined object, even if they disagree on its normative primacy.
  8.  **Externalism of Truth.** The score $S(c, w)$ depends on the actual world $w$, which is generally unknown to the agent. Both camps agree that epistemic evaluation is ultimately world-dependent, not merely internal-consistency dependent.
  9.  **No Claim on Psychological Realism.** Neither camp claims that human agents explicitly calculate expected scores. The framework is normative (how agents *ought* to behave), not descriptive (how they *do* behave).
  10. **No Claim on Pragmatic Value.** Neither camp claims that accuracy is the *only* value. An agent may rationally sacrifice accuracy for comfort or speed. The dispute is about *epistemic* rationality specifically.
  11. **Admissibility of Measures.** Not all distance metrics are admissible as epistemic scoring rules. Measures that are not proper (e.g., absolute distance in some contexts) are rejected by both camps for normative derivation.
  12. **The Dogmatist's Calculation.** Both camps agree that if an agent holds $P(H)=1$, then for any experiment $E$, the Expected Value of Information (EVI) calculated *using that credence* is zero. This is a mathematical identity under conditionalization.
  13. **The Lazy Calibrator's Output.** Both camps agree that an agent reporting the base rate is perfectly calibrated. If the base rate is the only information possessed, this report maximizes expected accuracy synchronically.
  14. **Intractability.** Both camps agree that computing the optimal inquiry policy (the sequence of experiments maximizing expected accuracy) is generally computationally intractable for non-trivial worlds.

  ---

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the specific points of divergence. We distinguish between **Genuine** disagreements (conflict over facts or norms) and **Verbal** disagreements (conflict over definitions, hiding a substantive core).

  | Crux | Accuracy-First Proposition (Camp A) | Zetetic Proposition (Camp B) | Type | Shared Test / Argument | Camp A Prediction | Camp B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Dogmatist** | Given $P(H)=1$, it is rational to refuse inquiry. EVI is zero. Norms apply to actions *given* states. | It is irrational to hold $P(H)=1$ without proof. Norms forbid the state that makes inquiry valueless. | **Genuine** (Locus of Norm) | **The Reset Case:** An agent with $P(H)=1$ is offered a "credence reset" to 0.5 before testing. | Agent refuses reset (current state is undominated). | Agent accepts reset (state violates inquiry norms). |
  | **2. The Lazy Calibrator** | If information is costly, reporting base rate is optimal. If free, failing to look is a violation of *instrumental* rationality, not epistemic. | Failing to seek available free evidence is an *epistemic* vice, even if current credences are calibrated to current info. | **Verbal** (Scope of 'Epistemic') | **The Free Data Case:** Data is available at zero cost. Agent ignores it. | Violation of instrumental norms (wasted resource). | Violation of epistemic norms (zetetic vice). |
  | **3. The Lucky Guesser** | Epistemic value is state-dependent. Two identical credence functions have identical epistemic value regardless of genealogy. | Epistemic value is process-dependent. A belief formed by reliable inquiry is better than one formed by luck, even if $c_1 = c_2$. | **Genuine** (Supervenience) | **The Twin Score:** Compare Score(Guesser) vs. Score(Inquirer). | Scores are identical. Epistemic value is identical. | Scores are identical. Epistemic value differs. |
  | **4. The Slow Truth** | Synchronic accuracy at $t_{end}$ is the primary metric. Time-to-truth is a pragmatic cost, not an epistemic loss. | Time spent in error is an epistemic loss. A diachronic integral of inaccuracy is the correct metric. | **Verbal** (Metric Definition) | **The Discounted Integral:** Compute $\int e^{-\lambda t} S(c_t, w) dt$. | Agrees this measures *utility*, not pure accuracy. | Agrees this measures *epistemic value*. |
  | **5. Scoring Rule Choice** | Any strictly proper rule yields the same ordinal ranking of policies (robustness). Specific choice is conventional. | Different proper rules encode different risk attitudes (Log vs. Brier). This changes which inquiries are "optimal." | **Genuine** (Sensitivity) | **The Tail Risk Case:** An inquiry reduces error on common cases but increases catastrophic error on rare cases. | All proper rules agree on ranking (if dominated). | Log Loss penalizes rare errors more than Brier; recommendations diverge. |
  | **6. Object of Norms** | Norms govern *Belief States*. Inquiry norms are derived (hypothetical imperatives: "If you want accuracy, do X"). | Norms govern *Inquiries*. Belief states are evaluated only as outputs of permissible inquiries. | **Genuine** (Fundamental Unit) | **The Forbidden Knowledge Case:** An experiment yields high accuracy but violates a process constraint (e.g., privacy/safety). | Epistemically good, pragmatically bad. | Epistemically forbidden (process violation). |

  **Note on Crux 1 (The Dogmatist):**
  Camp A asserts the premise "Rationality is internal." If the agent *believes* they are certain, they cannot be faulted for acting on certainty.
  Camp B asserts the premise "Rationality includes state-regulation." The agent is faulted for *arriving* at certainty without warrant.
  *Correction:* If Camp A concedes that logical omniscience is false, they must admit the agent *should* have uncertainty about their own logical constraints. If this is corrected, the Dogmatist case dissolves into a case of bounded rationality, not a clash of norms. Camp A must clarify if they defend the Dogmatist under idealization or in reality.

  **Note on Crux 3 (The Lucky Guesser):**
  This is a dispute over **Supervenience**. Camp A holds epistemic value supervenes on the current mapping $C \to W$. Camp B holds it supervenes on the trajectory $History \to C \to W$.
  *Test:* If Camp B cannot specify a scoring rule $S'$ that distinguishes the Guesser from the Inquirer *without* referencing the history explicitly in the function arguments, the disagreement is purely about whether "Epistemic Value" includes "Process Virtue."

  ---

  ## 3. CONDITIONS FOR MOVEMENT

  This section specifies what empirical or formal results would cause each camp to revise their position. We distinguish between *persuasion* (rhetoric) and *movement* (theoretical update).

  **What Would Move the Accuracy-First Camp:**
  1.  **Derivation Failure:** A proof that standard inquiry norms (e.g., "test the most informative hypothesis") cannot be derived from *any* diachronic proper scoring rule, even with time-discounting and information costs included.
  2.  **Instability:** A demonstration that the choice of strictly proper scoring rule (Log vs. Brier vs. Spherical) leads to contradictory recommendations on optimal inquiry in standard cases, undermining the claim that "accuracy" is a unique guide.
  3.  **The Dogmatist Collapse:** A formal demonstration that enforcing probabilism (via dominance arguments) *necessitates* a non-zero probability on all empirically contingent hypotheses, thereby mathematically forcing the value of information to be positive. (This would absorb the Zetetic critique into Accuracy-First math).

  **What Would Move the Zetetic Camp:**
  1.  **Reduction Success:** A demonstration that all proposed "zetetic norms" (e.g., "do not ignore free evidence," "question dogmatic priors") can be strictly reduced to maximizing a specific diachronic accuracy functional $\mathcal{J} = \int L(c_t, w, \text{action}_t) dt$.
  2.  **Truth-Conductiveness:** A proof that following Zetetic norms without reference to expected accuracy leads to lower truth-tracking in the long run compared to Accuracy-First policies. (i.e., showing that process norms are only valuable insofar as they serve accuracy).
  3.  **Formalization of "Question":** A rigorous mathematical definition of "asking a question" or "opening an inquiry" that is not reducible to "partitioning the state space and updating." If inquiry is just state-space refinement, Accuracy-First wins.

  ---

  ## 4. FAILURE CONDITIONS

  This collaboration will be deemed a **failure** if:
  1.  **Ambiguous Terminology:** We conclude that "Epistemic Value" simply means different things to each camp without isolating whether the difference is normative (what we should value) or descriptive (what tracks truth).
  2.  **Idealization Hiding:** We attribute disagreements to "norms" when they are actually due to Camp A assuming Logical Omniscience and Camp B assuming Bounded Rationality. (See Crux 1 Note).
  3.  **No Decision Procedure:** We identify the disagreement but provide no shared test case (like the **Reset Case** or **Discounted Integral**) that could theoretically adjudicate it.

  This collaboration will be deemed a **success** if:
  1.  **Precise Locus:** We isolate the disagreement to a single parameter (e.g., the discount rate $\lambda$ in diachronic scoring, or the admissibility of history-dependent scoring rules).
  2.  **Absorption:** One camp successfully demonstrates that the other's core theorems are a special case of their own framework (e.g., Zetetic norms are Accuracy norms with $\lambda > 0$).
  3.  **Formal Dualism:** We prove that the two frameworks are mathematically dual (equivalent outputs, different internal variables), rendering the argument purely aesthetic/pragmatic rather than substantive.

  **Signed,**

  *Representative, Accuracy-First Program*
  *Representative, Zetetic Program*

  ---

  ### APPENDIX: TECHNICAL NOTES ON CRUXES

  **On the Dogmatist (Internalism vs. Externalism)**
  The Accuracy-First argument relies on $E_c[\cdot]$. If $c(H)=1$, $E_c[\text{gain}] = 0$.
  The Zetetic argument relies on $E_{true}[\cdot]$ or a norm on $c$ itself.
  *Resolution Path:* If Accuracy-First adopts a **Strict Properness over Time** constraint, they may prove that holding $c(H)=1$ is dominated *diachronically* because it prevents future score minimization. If they cannot prove this, the Dogmatist remains a counterexample to Accuracy-First as a complete theory of rationality.

  **On Scoring Rule Conventionality**
  In ML, we choose Log Loss for gradient properties or Brier for interpretability. In Epistemology, the choice is normative.
  *Log Loss:* Penalizes confident errors infinitely. Favors aggressive inquiry.
  *Brier Score:* Penalizes confident errors quadratically. Favors conservative inquiry.
  *Implication:* If epistemic norms depend on the choice of $S$, then "Accuracy" is not a single norm but a family of norms parameterized by risk tolerance. Zetetics argue this risk tolerance is exactly where "inquiry values" enter the system.

  **On Process vs. Product**
  Let $V(c)$ be the value of a credence.
  Camp A: $V(c) = S(c, w)$.
  Camp B: $V(c) = S(c, w) - \text{Cost}(\text{Process}(c))$.
  If $\text{Cost}$ includes "violations of inquiry duty," Camp B is circular unless "duty" is defined independently of accuracy. If "duty" is defined as "failure to maximize accuracy," Camp B collapses into Camp A. The collaboration hinges on whether "inquiry duty" can be defined without reference to $S$.
