answer: |-
  In a five-phase pharmaceutical supply agreement, a Manufacturer (M) and a Distributor (D) alternate decisions to either **Release** (cooperate) or **Withhold** (defect) a shipment, with nominal profits increasing at each stage according to a standard Centipede structure where immediate Withholding yields a marginal gain over Releasing. However, the contract includes a **Regulatory Compliance Bond**: both parties deposit a substantial sum with a third-party auditor, which is forfeited entirely if either party Withholds *before* Phase 4, but retained if Withholding occurs at Phase 4 or 5. This bond is common knowledge, legally enforceable, and exceeds the marginal gain from early defection, creating a discontinuity in the effective payoff structure that is externally observable and independent of the agents' psychological states.

  Standard backward induction applied to the *nominal* shipment profits predicts immediate Withholding at Phase 1, as the final node (Phase 5) dictates defection, unraveling the chain. However, the induction step fails specifically at **Phase 3**: while the nominal payoffs suggest D should Withhold, the activation of the Compliance Bond means the *effective* payoff for Withholding is (Nominal Gain − Bond), which is strictly less than the payoff for Releasing (Nominal Gain + Future Value). Because the bond forfeiture applies only to pre-Phase 4 defection, the recursive logic cannot propagate backward past Node 3; M at Phase 2 knows D will Release at Phase 3 to save the bond, making Release optimal for M, and so on to the root. The structural feature doing the work is the **conditional penalty discontinuity**, which decouples the payoff dominance of defection from the game's horizon. If this feature is removed, the effective payoffs revert to the nominal Centipede structure, and the induction chain immediately collapses back to immediate defection at Phase 1. A defender of backward induction might attempt to repair the argument by insisting the bond must simply be folded into the payoff matrix, arguing that once integrated, backward induction still applies. This repair fails because folding the bond into the matrix *changes the game* from a Centipede Game to a cooperation-sustaining game; the defender cannot simultaneously claim backward induction predicts immediate defection *and* that the bond is accounted for. To maintain the prediction of defection, the defender must ignore the institutional reality, rendering the model descriptively false; to accept the institution, they must concede that backward induction on the *true* game tree supports cooperation, thereby dissolving the paradox rather than resolving it within the original constraints.
