answer: |-
  Your friend's challenge rests on a monistic conception of punishment: that it is either a retributive debt (which cannot be bought off) or a policy tool (which should be optimized without moralizing). The incoherence he perceives arises because Truth Commissions (TCs) operate on a **hybrid theory of justice** that treats punishment as *expressive* and truth as *constitutive*.

  To reconstruct the implicit theory that makes sense of the South African, Argentine, and Rwandan variations, we must abandon the idea that the "trade" is between *suffering* and *information*. The trade is between *impunity* and *authority*.

  Here is the reconstruction of the presuppositions, followed by the tests you requested.

  ### I. The Implicit Theory: Expressive Repair and Political Authority

  **1. The View of Punishment: Expressive and Commutable**
  For punishment to be waivable or priced, it cannot be viewed solely as a metaphysical debt owed by the offender to the moral universe (strict retributivism). Instead, it must be viewed as a **social practice of normative reaffirmation**.
  *   **The Function:** Punishment communicates that a norm has been violated and reaffirms the authority of the law.
  *   **The Commutability:** If the *function* of punishment is to publicly condemn the act and reaffirm the norm, then "hard treatment" (prison) is one way to achieve this, but not the only way. **Public, official disclosure** can serve the same expressive function if it strips the perpetrator of the power to define reality.
  *   **Why Waivable?** It is waivable because the new political order prioritizes *establishing its own authority* over *satisfying past desert*. The "debt" is not to the past moral order, but to the future political stability.

  **2. The Status of Truth: Constitutive Acknowledgment**
  Truth is not merely instrumental (intelligence) nor merely an entitlement (a right to know). In this framework, truth is **the form that condemnation takes when hard treatment is remitted.**
  *   **Why Non-Waivable?** You can waive the prison sentence, but you cannot waive the *historical record* because the crime was not just against a person, but against the *reality of the community*. A regime that tortures in secret asserts a monopoly on truth. A TC breaks that monopoly.
  *   **The "Price":** In Rwanda, truth is priced (reduced sentence) because the expressive need is balanced against the retributive need. In South Africa, truth is traded (amnesty) because the expressive need (establishing the new order's narrative) outweighs the retributive need. In Argentina, truth was pursued *despite* the waiver because the record itself is a form of justice independent of the body of the perpetrator.

  **3. The Claim Holder: The Political Community (as Trustee)**
  This resolves the veto problem.
  *   **Who is owed?** The primary creditor is not the individual victim, but the **Political Community** (including future generations). The crime is treated as a *political crime* (an attack on the constitutional order), not merely a private tort.
  *   **Why No Veto?** An individual victim can forgive a personal wrong, but they cannot forgive a crime against the body politic on behalf of the community. The Commission acts as the trustee for the community's right to know its own history.
  *   **Why Self-Amnesty is Impunity:** In self-amnesty, the debtor (the old regime) attempts to release the debt owed to the creditor (the community) without the creditor's consent. In conditional amnesty, the *new* community (the creditor) agrees to accept a substitute performance (truth) in exchange for releasing the debt. The source of the waiver determines its legitimacy.

  ### II. Required Commitments vs. Compatible Contingencies

  You asked which commitments the practice strictly requires and which merely sit well with it. This is the fault line between a hybrid theory and pure consequentialism.

  **Strictly Required (The Non-Negotiables):**
  1.  **Publicity:** The disclosure must be public (or officially archived as public record). Private truth fails the expressive function.
  2.  **Official Validation:** The truth must be certified by a body authorized by the *new* political order. This establishes the new order's sovereignty over the past.
  3.  **The Link to the Act:** The disclosure must be specific to the perpetrator's agency. General "truth" is not enough; *agency* must be acknowledged to shift the normative weight.

  **Merely Compatible (The Contingencies):**
  1.  **Remorse:** A thoroughgoing consequentialist (or even the Expressive theory above) does not *require* remorse. As you noted in SA, disclosure alone strips the perpetrator of the dignity of secrecy. Remorse sits well with restorative justice, but it is not structurally necessary for the "trade" to function as normative reaffirmation.
  2.  **Victim Veto:** As established, the theory presupposes the community holds the claim. A victim veto is compatible with a more victim-centric restorative model, but its absence (as in SA) is not incoherent within the Political Community model.
  3.  **Specific Sentencing (Waiver vs. Reduction):** Whether the truth buys full amnesty (SA) or reduced sentences (Rwanda) is a political calibration of how much "hard treatment" is still needed for expressive purposes. It is not determined by the core theory.

  **The Consequentialist Limit:** A pure consequentialist could license the *structure* (stability, deterrence), but they could not explain why **truth is non-waivable** if it doesn't aid stability. If a specific truth would cause violence, a pure consequentialist would suppress it. The fact that TCs insist on truth *even when dangerous* indicates a deontological commitment to the record itself.

  ### III. The Counterfactuals: What Breaks the Institution?

  **1. If Punishment Were Purely Forward-Looking**
  If punishment were only about deterrence and incapacitation (no desert, no expression):
  *   **The Truth Requirement:** Truth becomes purely intelligence. If the intelligence is already known (survivors know), or if revealing it threatens stability (deterrence of future coups), the truth requirement evaporates.
  *   **The Institution:** The Commission becomes an **intelligence exercise** or a **public-health quarantine**. It loses the label of "justice." It would be indistinguishable from a debriefing of enemy combatants.
  *   **Impunity:** Without the expressive element, releasing a perpetrator without prison *is* impunity, because there is no remaining mechanism to condemn the act. The "trade" collapses because there is no moral currency being exchanged, only security data.

  **2. If the Right to Truth Were Only Instrumental**
  If truth were only valuable for reconciliation or healing:
  *   **Public Hearings:** These could be dropped in favor of private archives if public hearings caused trauma.
  *   **Waiving Disclosure:** In cases where disclosure helps no one (e.g., the victim is dead, the family knows, the community is stable), disclosure could be waived.
  *   **Distinction from Impunity:** This *would* collapse into impunity. The distinction between conditional amnesty and self-amnesty relies on the **public ritual of submission**. If the truth is private and instrumental, the perpetrator has not submitted to the new order's authority; they have merely provided data. The *public* nature of the truth is what transforms it from "information" into "justice."

  ### IV. The Test Case: The Private Disclosure of Known Facts

  *Case:* A perpetrator discloses everything accurately in a sworn private statement, but refuses public testimony. The disclosures confirm what survivors already know.

  *Verdict:* **He has not done what the practice demands.**

  *Reasoning:*
  Under the reconstructed theory, the "currency" of the trade is not **information** (which the survivors already possess) nor is it **legal evidence** (which a private sworn statement provides). The currency is **Public Acknowledgment**.

  1.  **The Expressive Failure:** The purpose of the public hearing is to shift the *authority* over the narrative from the perpetrator to the community. By testifying privately, the perpetrator retains control over the social meaning of the act. He treats the Commission as an administrative bureau rather than a tribunal of public conscience.
  2.  **The Normative Failure:** The "hard treatment" substituted for prison is the **humiliation of public exposure** and the **ritual of submission**. Refusing public testimony refuses the submission.
  3.  **The Historical Failure:** Even if survivors know, the *official record* requires the perpetrator to be inscribed as the author in a public forum. A private statement creates a file; a public hearing creates *history*.

  **Conclusion:**
  Your friend is right that the trade is incoherent under a strict retributive or pure consequentialist framework. But the practice presupposes a **Political-Expressive Theory**: the crime was a usurpation of the community's normative authority, and the "payment" is the restoration of that authority through public truth.

  The perpetrator in your test case has offered data, but he has withheld the restoration of authority. He has tried to pay the debt with a wire transfer when the creditor demanded a public handshake. Under the logic of the Truth Commission, the debt remains unpaid.
