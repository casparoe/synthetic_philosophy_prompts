answer: |-
  Here is a dissection of the proverb "learn from your mistakes," broken down into distinct philosophical theses, mapped onto Daniel Dennett's hierarchy of minds (Darwinian, Skinnerian, Popperian, Gregorian), and applied to your rival's accusation.

  ### I. The Theses of "Learn From Your Mistakes"

  These are ordered from the trivially true to the radically restrictive.

  **1. The Cybernetic Thesis (The Feedback Loop)**
  *   **Assertion:** Learning is simply the adjustment of behavior following a negative error signal.
  *   **Locus:** Any system (thermostat, bacterium, human).
  *   **Reality:** The error signal must exist, but it need not be "felt."
  *   **Source:** Internal or external.
  *   **Weight:** Purely descriptive.
  *   **Verdict:** **Trivial.** It defines learning as negative feedback.
  *   **Creature:** **Darwinian.** (Note: In a strict Darwinian sense, the "learning" happens across generations, not within a lifetime. If applied to an individual, this thesis collapses into a claim about the population: the *lineage* learned because the *individual* died.)
  *   **Availability:** Available to all creatures, but for a Darwinian creature, the "mistake" is extinction.

  **2. The Skinnerian Thesis (The Somatic Cost)**
  *   **Assertion:** To learn from a mistake, the learner's *body* must execute the action and suffer the negative consequence (punishment/pain).
  *   **Locus:** The organism's physical self.
  *   **Reality:** The mistake must actually occur in the world.
  *   **Source:** The world directly (trial and error).
  *   **Weight:** Descriptive of a specific mechanism; normative about "real" experience.
  *   **Verdict:** **Substantive but Empirically False** for humans. We learn from near-misses and warnings without somatic damage.
  *   **Creature:** **Skinnerian.** This creature learns only by operant conditioning within a lifetime.
  *   **Availability:** **Unavailable** to a creature that does not learn within a lifetime (Darwinian). It requires an individual lifespan to endure the punishment.

  **3. The Popperian Thesis (The Internal Sacrifice)**
  *   **Assertion:** To learn from a mistake, the learner's *hypothesis* must be executed internally and suffer falsification, sparing the body.
  *   **Locus:** The organism's internal model/simulation.
  *   **Reality:** The mistake occurs in a counterfactual simulation.
  *   **Source:** The learner's own generative model.
  *   **Weight:** Descriptive of higher cognition; normative about intelligence ("Let my hypotheses die in my stead").
  *   **Verdict:** **Substantive.** This is the standard definition of human planning.
  *   **Creature:** **Popperian.**
  *   **Availability:** Unavailable to Skinnerians (who cannot simulate).

  **4. The Gregorian Thesis (The Tool-Mediated Error)**
  *   **Assertion:** To learn from a mistake, the error must be encoded in a public tool (language, math, simulation) that the learner manipulates, regardless of who generated the data.
  *   **Locus:** The extended mind (brain + tools + culture).
  *   **Reality:** The mistake may be historical or distributed across many minds.
  *   **Source:** Inherited ready-made from other minds (culture).
  *   **Weight:** Normative about *competence*, not *ownership*.
  *   **Verdict:** **Substantive.** This validates science, education, and modelling.
  *   **Creature:** **Gregorian.**
  *   **Availability:** Unavailable to Popperians who do not use external symbolic scaffolding.

  **5. The Existentialist Thesis (The Virtue of Suffering)**
  *   **Assertion:** Wisdom requires personal suffering; second-hand knowledge is information, not understanding. You cannot claim the lesson unless you paid the price.
  *   **Locus:** The moral self / soul.
  *   **Reality:** The mistake must be actual and painful.
  *   **Source:** The world, inflicted on the self.
  *   **Weight:** Entirely Normative (about credit, blame, and epistemic virtue).
  *   **Verdict:** **False** (as a mechanism), **Potent** (as a social accusation). It conflates *reliability* with *authenticity*.
  *   **Creature:** **Romantic/Pre-Scientific.** (It rejects the Gregorian advantage).

  ---

  ### II. Supporting the Rival's Accusation

  Your rival's charge ("You have never really learned from a mistake, only from other people's") relies on a collision between **Thesis 3 (Popperian)** and **Thesis 5 (Existentialist)**, while deliberately ignoring **Thesis 4 (Gregorian)**.

  **Which reading gives the accusation teeth?**
  The accusation only has teeth if you accept **Thesis 5 (The Virtue of Suffering)** or a corrupted version of **Thesis 3**.
  *   If learning requires *generating* the hypothesis that fails (Thesis 3), the modeller is safe *if* she builds the simulations herself.
  *   However, the rival claims she learns from *other people's* mistakes. This implies the **error signal originates externally**.
  *   The rival is arguing that **epistemic ownership requires causal responsibility for the error.** If the data (the record of the mistake) comes from the field, the "death" happened to the field worker, not the modeller.

  **The Accusation's Logic:**
  The rival is treating the modeller as a **Skinnerian parasite**. They are claiming she gets the reward (knowledge) without the punishment (field failure). In their view, she is not a Popperian tester (killing her own hypotheses) but a **curator of corpses**. She is processing the dead hypotheses of others.

  ### III. The Gregorian Defence: "Delegated Testing"

  You specify the modeller is a "thoroughgoing Gregorian learner whose Popperian testing is delegated."
  *   **Gregorian:** She uses tools (simulations) to think.
  *   **Delegated Popperian:** The *testing* of the hypotheses happens elsewhere (in the field data provided by others).
  *   **"Nothing ever dies in her stead":** Her simulations do not falsify *her* ideas; they merely visualize *others'* falsifications.

  **Does the accusation survive?**
  **Yes, but only on normative grounds, not functional ones.**

  1.  **Functionally (Thesis 1 & 4):** The accusation is **False**. A Gregorian creature *does* learn from mistakes when she ingests the cultural record of errors. If she builds a model that successfully predicts system behavior based on past field failures, she has learned. The "mistake" is in the data, and she has successfully decoded it. To say she hasn't learned is to deny the validity of science itself (which stands on the shoulders of giants).
  2.  **Normatively (Thesis 5):** The accusation **Survives**. If "learning" is viewed as a moral virtue or a rite of passage, she is guilty of epistemic free-riding. She possesses *knowledge*, but she lacks *wisdom* (in the rival's definition). She has not "earned" the insight.

  **The Crucial Distinction for your Novel:**
  The tension lies in whether "learning" is defined by **outcome reliability** (Gregorian/Popperian) or **process authenticity** (Skinnerian/Existential).

  *   **If the modeller is right:** She is the apex predator of minds. She uses Gregorian tools to leverage Popperian testing without Skinnerian cost. She is safer and faster than the field workers. The rival is a jealous Skinnerian who values pain over results.
  *   **If the rival is right:** The modeller is brittle. Because she never suffered the "death" of a hypothesis she generated herself, she doesn't understand the *texture* of the error. She knows *that* the field data failed, but not *why* in a visceral sense. When a novel situation arises (one not in the field data), her simulations will fail because she lacks the intuitive "scar tissue" of personal failure.

  ### IV. Recommendation for the Scene

  To make the charge sting, the rival should not argue that she lacks *information*. They must argue she lacks **judgment**.

  The rival should imply that **Thesis 3 (Popperian)** requires the *generation* of the hypothesis, not just the testing.
  *   *Rival's Line:* "You don't test models. You autopsy them. You wait for the field team to bleed, then you draw diagrams over the corpse. That isn't learning; it's bookkeeping."

  This frames the modeller not as a Gregorian genius, but as a **necromancer of data**. It suggests that without the risk of *her own* hypotheses dying (even in simulation), her understanding is hollow. It attacks the **agency** of the error. If the mistake belongs to the field worker, the lesson belongs to the field worker. The modeller is just the librarian.

  **Verdict:** The accusation is scientifically false (she *is* learning) but psychologically and dramatically potent (she hasn't *earned* it). It survives if your novel treats "understanding" as something embodied and hard-won, rather than computational and transferable.
