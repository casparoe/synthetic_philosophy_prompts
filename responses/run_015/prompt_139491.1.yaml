answer: |-
  This is a sophisticated problem in doxastic reconstruction. Your notes describe a professor who is almost certainly reconstructing a **Neo-Nyāya** position (likely following Gaṅgeśa's *Tattvacintāmaṇi* or a modern analytic reconstruction thereof). Her verdicts align with the standard Nyāya reduction of *arthāpatti* (postulation) and *anupalabdhi* (non-cognition) into *anumāna* (inference) and *pratyakṣa* (perception), while defending the irreducibility of *upamāna* (comparison) and *śabda* (testimony) against Buddhist and Mīmāṃsā critiques.

  Here is the analysis of her commitments, the predictions for your cases, and the strategy for your office hours.

  ### 1. Candidate Principles

  Your intuition about "Source-Integrity" is the strongest, but we need to formalize it to compete with the "Novelty" constraint often found in Mīmāṃsā. Here are the three principles that fit her nine verdicts:

  **Principle 1: The Causal Integrity & Individuation Principle (CII)**
  *   **Formulation:** A cognition is *pramā* if and only if it is true (*yathārtha*) and generated by a faultless causal process (*guṇavatkāraṇa*). Distinct *pramāṇas* are individuated by irreducibly distinct causal mechanisms, not merely by distinct semantic contents.
  *   **Fit:** Explains Case 7 (true belief from defective source = not *pramā*), Case 5 (unique causal mechanism of comparison = distinct *pramāṇa*), and Cases 8 & 9 (mechanisms subsumable under inference/perception = no distinct *pramāṇa*).
  *   **Status:** This is the standard Nyāya position.

  **Principle 2: The Agential Competence Principle (ACP)**
  *   **Formulation:** A cognition is *pramā* only if the truth is creditable to the subject's exercise of cognitive competence. "Borrowed" reliability counts only if the subject competently recognizes the source's reliability.
  *   **Fit:** Explains Case 6 (hearer recognizes trustworthiness = competence) vs. Case 7 (hearer knows unreliability = incompetence/defect). Explains Case 2 (failure of perceptual competence).
  *   **Status:** A refined version of your "Credit Rule." It fits the data but is arguably a subset of CII (competence is a type of causal faultlessness).

  **Principle 3: The Novelty Constraint (NC)**
  *   **Formulation:** A cognition counts as *pramā* (or at least as the *phala* of a *pramāṇa*) only if the content is *anadhigata* (previously unascertained).
  *   **Fit:** Consistent with the data provided so far, as none of her nine cases explicitly involve repetition or prior knowledge.
  *   **Status:** This is the main rival. It is often associated with Prābhākara Mīmāṃsā, though some Nyāya thinkers accept it for the *utility* of *pramāṇa* while denying it for *pramā*-status.

  ### 2. Predictions for Cases A, B, and C

  Here is where the principles diverge.

  | Case | Causal Integrity (CII) | Agential Competence (ACP) | Novelty Constraint (NC) |
  | :--- | :--- | :--- | :--- |
  | **A** (Testimony + Independent Derivation) | **Pramā (Anumāna).** The causal chain of the *current* cognition is inference. The prior testimony is causally irrelevant to the *current* generation. | **Pramā (Anumāna).** Subject exercises full competence in derivation. | **Not Pramā.** The content was already believed/ascertained via testimony. No novelty. |
  | **B** (Rule from Authority + Derivation) | **Pramā (Anumāna).** Mixed causes are permitted. The *limiter* of the final cognition is the inferential operation. | **Pramā (Anumāna).** Subject exercised competence in application, even if premises were borrowed. | **Pramā.** Assuming the conclusion itself is new, the lack of novelty in the *rule* doesn't block the conclusion's novelty. |
  | **C** (Re-running Derivation) | **Pramā (Anumāna).** The causal process is faultless. Repetition does not introduce a defect. | **Pramā (Anumāna).** Competence is exercised repeatedly. | **Not Pramā.** (Or at least not a *new* instance). The content is already ascertained. Intervening doubt might reset novelty, but without it, no *pramā*. |

  **Where they come apart:**
