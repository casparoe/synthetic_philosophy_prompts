  **Brainstorming: Conceptual Dependencies**
  Phenomenal knowledge traditionally presupposes causal efficacy: the experience must cause the belief to justify it. First-person authority relies on this justification. If epiphenomenalism holds, qualia lack causal powers, severing the link between experience and belief. This creates the paradox of phenomenal judgment: how can we know qualia if they do nothing? If we replace causal tethering with architectural indexicality—where beliefs refer to states by their functional role rather than causal history—we might preserve the link without causation. However, this shifts the burden from metaphysics (causation) to epistemology (normativity): why is the system's self-indexing authoritative?

  ***

  **Research Proposal: Architectural Indexicality and the Normativity of Phenomenal Judgment**

  **Project Overview**
  The paradox of phenomenal judgment poses a severe threat to epiphenomenalism. If qualia are causally inert, they cannot cause the beliefs we hold about them. Standard causal theories of knowledge imply such beliefs are unjustified, undermining first-person authority. This project investigates a novel resolution: treating phenomenal self-attributions not as causal perceptions of inner objects, but as architectural indexicals. On this view, the content of a judgment like "I am in pain" is fixed not by causal contact with a pain-quale, but by the functional role the judgment occupies within a self-monitoring cognitive system. The project aims to determine exactly whether this move dissolves the paradox or merely relocates it into a problem concerning the normativity of first-person authority.

  **Theoretical Framework**
  Standard responses to the paradox typically attempt to salvage causal efficacy or deny the existence of phenomenal judgments. Causal accounts fail because they contradict the epiphenomenalist premise. Acquaintance-based responses argue that direct presence justifies belief without causation, but this relies on a metaphysical relation that remains obscure if the quale cannot interact with the believer. The architectural indexicality hypothesis leaves this framing open by bypassing the need for interaction entirely. It posits that phenomenal concepts function like "I" or "now": their reference is guaranteed by the structure of the thinker, not by a causal chain linking thinker to object.

  However, this structural guarantee solves the metaphysical exclusion problem only by raising an epistemic one. If the belief is generated by the system's architecture regardless of the qualitative reality, what prevents the system from being systematically mistaken? Therefore, I argue that treating phenomenal judgment as architectural indexing does not dissolve the paradox; it merely relocates it. The problem shifts from how qualia cause beliefs to why the system's self-indexing carries normative weight. The core question becomes: does functional role suffice for epistemic warrant without causal tracking?

  **Methodology**
  The research will proceed via three phases of conceptual analysis.
  1.  **Distinguishing Indexical Belief-Types:** I will analyze the logical structure of architectural indexicals compared to perceptual demonstratives. This involves clarifying how reference fixation works in self-monitoring systems where the "object" is internal state rather than external stimulus. The goal is to define the conditions under which a functional slot guarantees reference without causal input.
  2.  **Comparison with Non-Phenomenal Self-Monitoring:** I will compare phenomenal judgments with proprioceptive or interoceptive reports. These domains often involve reliable functional signaling without conscious qualitative mediation. If authority persists in non-phenomenal self-monitoring via architectural reliability, this supports the indexical model. I will examine cases where proprioception fails to assess whether authority tracks reliability or causal history.
  3.  **Evaluation of Warrant:** I will evaluate whether indexing preserves epistemic warrant without causal efficacy. This requires testing the model against skepticism, specifically inverted spectrum scenarios. If the system is architected to say "I see red" when presented with green qualia, does the indexical model break? If the judgment remains true in virtue of the functional role despite the qualitative mismatch, warrant is preserved; if truth conditions collapse, the model fails.

  **Expected Outcomes and Failure Conditions**
  A successful result will demonstrate that first-person authority can be grounded in the constitutive rules of the cognitive system rather than causal history. This would validate a non-causal theory of phenomenal knowledge compatible with epiphenomenalism. Specifically, success looks like a coherent account of how normative authority emerges from functional architecture alone, showing that the relocation of the problem is a viable philosophical trade-off.

  Failure would consist in demonstrating that architectural indexing inevitably severs the truth-connection required for knowledge. If the analysis shows that without causal tethering, the system's outputs are merely reliable dispositions rather than justified beliefs, the project fails to save first-person authority. Furthermore, if the relocation to normativity reveals that authority requires a causal history to distinguish truth from mere coherence, the paradox remains unresolved. A negative result would clarify that epiphenomenalism is untenable not because of causal exclusion, but because of normative isolation.

  **Scope and Feasibility**
  A three-month fellowship is sufficient for this conceptual work but insufficient for empirical integration. The scope is strictly limited to metaphysics and epistemology. I will not attempt to model specific neural architectures but will remain at the level of functional abstraction. The primary deliverable will be a draft paper arguing for the relocation thesis. Risks include the potential complexity of defining "architectural indexicality" without slipping into behaviorism. However, by focusing on the normativity shift, the project remains manageable within the timeframe. The goal is not to prove epiphenomenalism true, but to show that this specific objection against it can be neutralized, even if the cost is a revised understanding of authority. This focused scope ensures completion within the workshop duration.
