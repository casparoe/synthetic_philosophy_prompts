      **Expected Outcomes and Failure Conditions**
      A successful result will demonstrate that first-person authority can be grounded in the constitutive rules of the cognitive system rather than causal history. This would validate a non-causal theory of phenomenal knowledge compatible with epiphenomenalism. Specifically, success looks like a coherent account of how normative authority emerges from functional architecture alone.

      Failure would consist in demonstrating that architectural indexing inevitably severs the truth-connection required for knowledge. If the analysis shows that without causal tethering, the system's outputs are merely reliable dispositions rather than justified beliefs, the project fails to save first-person authority. Furthermore, if the relocation to normativity reveals that authority requires a causal history to distinguish truth from mere coherence, the paradox remains unresolved.

