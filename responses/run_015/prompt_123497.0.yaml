      **Project Title:** Architectural Indexicality and the Normativity of Phenomenal Judgment

      **Research Overview**
      The paradox of phenomenal judgment poses a severe threat to epiphenomenalism. If qualia are causally inert, they cannot cause the beliefs we hold about them. Standard causal theories of knowledge imply such beliefs are unjustified, undermining first-person authority. This project investigates a novel resolution: treating phenomenal self-attributions not as causal perceptions of inner objects, but as architectural indexicals. On this view, the content of a judgment like "I am in pain" is fixed not by causal contact with a pain-quale, but by the functional role the judgment occupies within a self-monitoring cognitive system. The project aims to determine whether this move dissolves the paradox or merely relocates it into a problem concerning the normativity of first-person authority.

      **Theoretical Framework**
      Standard responses to the paradox typically attempt to salvage causal efficacy or deny the existence of phenomenal judgments. Causal accounts fail because they contradict the epiphenomenalist premise. Acquaintance-based responses argue that direct presence justifies belief without causation, but this relies on a metaphysical relation that remains obscure if the quale cannot interact with the believer. The architectural indexicality hypothesis leaves this framing open by bypassing the need for interaction entirely. It posits that phenomenal concepts function like "I" or "now": their reference is guaranteed by the structure of the thinker, not by a causal chain linking thinker to object.

      However, this structural guarantee solves the metaphysical exclusion problem only by raising an epistemic one. If the belief is generated by the system's architecture regardless of the qualitative reality, what prevents the system from being systematically mistaken? Therefore, I argue that treating phenomenal judgment as architectural indexing does not dissolve the paradox; it relocates it. The problem shifts from how qualia cause beliefs to why the system's self-indexing carries normative weight. The core question becomes: does functional role suffice for epistemic warrant without causal tracking?

