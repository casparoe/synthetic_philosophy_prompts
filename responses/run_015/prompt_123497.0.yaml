      1.  **Distinguishing Indexical Belief-Types:** I will analyze the logical structure of architectural indexicals compared to perceptual demonstratives. This involves clarifying how reference fixation works in self-monitoring systems where the "object" is internal state rather than external stimulus.
      2.  **Comparison with Non-Phenomenal Self-Monitoring:** I will compare phenomenal judgments with proprioceptive or interoceptive reports. These domains often involve reliable functional signaling without conscious qualitative mediation. If authority persists in non-phenomenal self-monitoring via architectural reliability, this supports the indexical model.
