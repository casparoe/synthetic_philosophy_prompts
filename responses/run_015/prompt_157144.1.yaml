  **Profiles:**
  1.  **3x (O>L>T), 3x (L>T>O), 2x (T>O>L).** Aggregate pairwise. Guardians enforce (i) & (iii). Result: O>L, L>T, T>O.
  2.  **3x (O>L>T), 3x (L>T>O), 2x (L>O>T).** Guardians enforce (ii): O vs L result must remain O>L despite T's reordering.
  3.  **Adjust preferences** to isolate a pivotal voter for O vs T. Guardians enforce (iii), blocking dictatorial resolution.

  **Recording:** Log pairwise victories on a whiteboard matrix. Highlight intransitivity (O>L>T>O) after Profile 1.

  **Debrief (10-15 mins):**
  1.  Highlight the cycle. Map to failure of Collective Rationality.
  2.  Review constraints. Map (i) to Pareto, (ii) to Independence of Irrelevant Alternatives, (iii) to Non-Dictatorship.
  3.  Explain that satisfying transitivity requires violating (iii) (dictator) or (ii) (context dependence).
  4.  Limitation: Explicitly state this session tested specific profiles. Arrow's theorem asserts impossibility across *all* logically possible profiles (universal quantification), which physical demonstration cannot exhaustively prove. The activity shows existence of failure, not universal necessity.
