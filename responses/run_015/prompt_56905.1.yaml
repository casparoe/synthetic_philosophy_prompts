              1.  Does the foundation *really* have one-way priority in the source domain (engineering), or is there feedback? (Challenges Way One).
              2.  What conditions are needed for damage to act as a gauge, and does the analogy supply them? (Challenges Way Two).
              3.  Are Way One and Way Two compatible?
          *   Evaluate the conclusions *without* the metaphor (Is climate policy theater? Is cultural change a legitimate inference of economic change?).
          *   Propose better metaphors if necessary.
      *   **Constraints:** No book recommendations, focus on reasoning, explicit mapping.

  2.  **Deconstruct the Metaphor (Base/Superstructure):**
      *   *Source Domain:* Structural Engineering (Buildings, Foundations, Loads, Settlement).
      *   *Target Domain:* Historical Materialism (Economy, State, Ideology, Social Change).
      *   *Dan's Mapping:*
          *   Foundation = Mode of Production / Economic Base.
          *   Structure (Floors/Walls) = Superstructure (Law, Politics, Culture).
