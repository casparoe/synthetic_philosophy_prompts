          *   Rearranging Furniture = Reform.
          *   Re-pouring Foundation = Revolution.

  3.  **Audit Way One (Reforms are Theater):**
      *   *Claim:* You can't change the building by moving furniture or even modifying upper walls if the foundation doesn't change. The load path goes *down*.
      *   *Engineering Reality Check:*
          *   Foundations support weight, yes.
          *   *But:* Loads are distributed. A heavy change on an upper floor *does* affect the foundation (added load).
          *   *But:* Retrofits exist. You can strengthen a building from the top down (adding shear walls, dampers) without digging up the foundation.
          *   *But:* Feedback loops. Settlement affects the structure, but the structure's weight affects settlement. It's a system, not a one-way street.
          *   *Critical Break:* In engineering, the superstructure *adds load* to the foundation. In Dan's Marxism, the superstructure *maintains* the base but doesn't seem to *weigh* on it in a way that changes it fundamentally.
          *   *Compatibility:* If the superstructure is just "furniture," it has no load. If it's "structure," it has load. Dan treats it as structure when talking about stability (it needs a base) but as furniture when talking about agency (it can't change the base). This is a tension.

  4.  **Audit Way Two (Culture as Instrument Panel):**
      *   *Claim:* Cracks in the wall tell you the soil moved. Cultural shifts tell you the economy moved.
      *   *Engineering Reality Check:*
          *   Settlement cracks *do* indicate foundation movement.
          *   *Condition:* The connection between foundation and structure must be rigid enough to transmit the stress but brittle enough to show the crack.
          *   *Condition:* There must be a time lag. Soil moves -> Structure stresses -> Crack appears.
          *   *Critical Break:* Cracks are *failures*. They indicate damage, not just "reporting." If culture is cracking, is society breaking? Also, cracks are retrospective. Can they be predictive? Dan uses them as proof of *past* base shifts.
          *   *Compatibility:* If culture is a "crack," it's a symptom of structural failure. If culture is "furniture," it's movable. Dan treats culture as the *walls* here (they crack), not the furniture.
          *   *The "Gauge" Problem:* A crack tells you *something* moved, but not necessarily *what* or *why*. Is it soil (economy) or thermal expansion (internal cultural logic)? The analogy assumes the *only* cause of cracks is foundation movement. That's a strong assumption.

  5.  **Evaluate Compatibility (Way One vs. Way Two):**
      *   Way One says: Top cannot affect Bottom. (Causal arrow: Bottom -> Top only).
      *   Way Two says: Top reveals Bottom. (Epistemic arrow: Top -> Knowledge of Bottom).
      *   *Conflict:* If the Top is rigidly determined by the Bottom (Way One), then yes, it reflects it. But if the Top is merely "furniture" (Way One's rhetoric on reform), it shouldn't crack when the foundation moves; the walls should. Dan shifts between "Furniture" (reformable, insignificant) and "Walls" (structural, indicative).
      *   *Verdict:* They are tension-filled. If the superstructure is robust enough to reliably indicate base shifts (Way Two), it has enough structural integrity to potentially redistribute load (challenging Way One). If it's too passive to change the base (Way One), is it reliable enough to read? (Yes, a seismograph is passive).
      *   *Main Tension:* The "Load" issue. In engineering, the superstructure *loads* the foundation. In Dan's view, the superstructure *rests on* the foundation but doesn't seem to *drive* it.

  6.  **Evaluate Conclusions Without the Metaphor:**
      *   *Claim 1: Climate policy is theater without ownership change.*
          *   Does this hold without the building? It depends on state theory. If the state is an executive committee of the bourgeoisie, yes. If the state has relative autonomy, maybe not. The building metaphor hides the *political struggle* involved in policy. It makes it seem mechanical.
      *   *Claim 2: Cultural change infers economic change.*
          *   Does this hold? Often yes (e.g., remote work tech). But sometimes culture leads (e.g., civil rights movement forcing economic integration). The metaphor makes culture purely reactive. This is the "reflectionist" fallacy.

  7.  **Develop Better Metaphors:**
      *   *Option A: Ecosystem.* (Interdependence, feedback loops, co-evolution). Good for complexity, bad for "hard" determination.
      *   *Option B: Software/Hardware.* (Base = Hardware, Superstructure = OS/Apps). Apps can't run without hardware, but apps can demand hardware upgrades. Good for compatibility, bad for "materiality."
      *   *Option C: Dan's own field (Structural Dynamics).* Focus on *resonance* and *damping*.
