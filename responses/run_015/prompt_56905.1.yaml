      *   **Section 2: Pressing Way One (The Load Path).**
          *   Engineering truth: Superstructure adds dead load. Changing the top *changes* the stress on the foundation.
          *   Break: Dan treats superstructure as weightless when discussing reform.
          *   Implication: Policy *does* load the economy (taxes, regulations cost money/change incentives).
      *   **Section 3: Pressing Way Two (The Cracks).**
          *   Engineering truth: Cracks indicate stress, but stress isn't *only* from foundation. Thermal expansion (internal cultural logic) causes cracks too.
          *   Break: Dan assumes all cultural movement is economic settlement.
          *   Implication: Cultural change might be internal to culture, not just economic reflection.
      *   **Section 4: Compatibility.**
          *   They are in tension. If the top is rigid enough to crack from base movement (Way Two), it's rigid enough to transfer load back down (challenging Way One). If it's furniture (Way One), it won't crack, it'll just slide.
      *   **Section 5: Conclusions Without the Metaphor.**
          *   Climate Policy: Not necessarily theater. States have relative autonomy. Policy can reshape markets (e.g., renewables subsidies creating new economic bases).
          *   Cultural Inference: Legitimate but risky. Correlation != Causation. Culture has its own history.
      *   **Section 6: Better Pictures.**
