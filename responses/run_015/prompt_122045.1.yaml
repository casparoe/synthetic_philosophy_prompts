prompt: |-
  I am preparing questions for a podcast episode in my series on moral psychology and cross-cultural pragmatics. Next week's guest is a philosopher—unnamed in the literature, but defending a specific position—who advances what she terms the "calibration thesis" regarding politeness norms. She argues that directness and indirectness are not primarily expressions of respect, hierarchy, or emotional care, but rather error-correction mechanisms in a social coordination game: interlocutors use bluntness or circumlocution to update shared beliefs about preferences and commitments without explicit negotiation. On this account, Dutch directness and Japanese indirectness represent different stable equilibria of the same underlying system, not incommensurable cultural values; and white lies are wrong not chiefly because they violate autonomy or trust, but because they inject noise into the calibration loop, degrading the accuracy of future coordination.

  I want eight to ten interview questions that avoid having her restate the thesis. I need at least one question that presses the Dutch-Japanese comparison—specifically, whether her coordination-game model can explain why an identical utterance registers as rude in Amsterdam and merely honest in Tokyo without collapsing into mere relativism, with a follow-up keyed to her likely appeal to "local equilibrium conditions." I need at least one on white lies that anticipates her standard reply—that small deceptions are harmless if they preserve social harmony—and includes a follow-up asking whether harmony-preservation is itself a calibration failure when it requires systematic misrepresentation of preference intensity. Include one question on high-stakes boundary cases—one-off interactions with strangers, or text-based communication lacking paralinguistic feedback—where calibration seems impossible, with a follow-up keyed to her probable invocation of "default protocols." Finally, include one normative question that forces her to defend the priority of accurate calibration over competing values such as kindness or face-saving, anticipating her reply that kindness is just long-run calibration, and pressing that reply. The sequence should read like a live colloquium Q&A, not a survey, and should not ask for readings, citations, or bibliographic references.
