  ### The Identity Decision Tree

  **Root Commitment:** We begin from the shared understanding that the synthetic tissue replicates the input–output behaviour of the biological tissue it replaces. There is no loss of function, only a change of material.

  **Instructions:** Answer each question as it applies to *you*. Follow the path indicated by your answer. Ordinary language is used throughout; the philosophical labels appear only at the end.

  ***

  **Question 1 (The Halfway Point)**
  At the eighteen-month midpoint, when exactly half of the targeted neural region is synthetic and half is original, are you strictly the same person who signed the consent form?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to Question 2.

  **Question 2 (The Rival: Multiplicity)**
  In the variant where your removed tissue is kept viable and re-implanted into a new body, so that at the end there is a wholly synthetic you and a wholly biological rival: is it possible that *both* resulting people are you?
  *   **Yes:** Go to **Leaf B**.
  *   **No:** Go to Question 3.

  **Question 3 (The Rival: Priority)**
  If only one of them can be you, must it be the re-constituted biological rival rather than the synthetic stream?
  *   **Yes:** Go to **Leaf A**.
  *   **No:** Go to Question 4.

  **Question 4 (The Anaesthesia Gap)**
  In the variant where each stage is performed under general anaesthesia, leaving no experienced continuity between stages: does this break in consciousness mean the person who wakes up is new?
  *   **Yes:** Go to **Leaf C**.
  *   **No:** Go to Question 5.

  **Question 5 (The Speed-Up)**
  In the variant where the synthetic parts operate on a finer temporal grain, causing your cognition to continuously speed up by a factor of three: does this change in processing rate make you a different person?
  *   **Yes:** Go to **Leaf D**.
  *   **No:** Go to Question 6.

  **Question 6 (The Precision)**
  Is there a precise percentage of replacement (e.g., exactly 83%) where you definitely cease to be the original person?
  *   **No:** Go to **Leaf E**.
  *   **Yes:** Go to Question 7.

  **Question 7 (The Fact)**
  Is there a single true fact about who you are at the end, independent of the rules or conventions we choose to adopt?
  *   **No:** Go to **Leaf F**.
  *   **Yes:** Go to Question 8.

  **Question 8 (The Endurance)**
  Are you a single entity that endures through the eighteen months, or a chain of different momentary selves linked together?
  *   **Single Entity:** Go to **Leaf G**.
  *   **Chain of Selves:** Go to **Leaf H**.

  ***

  ### The Leaves (Philosophical Positions)

  **Leaf A: Biological or Organism View**
  *(Reached via Q1-No or Q3-Yes)*
  *   **Most Awkward Commitment:** You would cease to exist after the first 2% replacement, meaning the trial is effectively a suicide procedure followed by the creation of a copy.
  *   **Note:** Reaching this leaf via Q3-Yes represents a hybrid view that accepts gradual replacement but prioritizes original matter in cases of fission.

  **Leaf B: Psychological-Continuity View (Without No-Branching Clause)**
  *(Reached via Q2-Yes)*
  *   **Most Awkward Commitment:** You can literally be two different people at once, meaning your loved ones would have to divide their loyalty between two valid claimants.

  **Leaf C: Psychological-Continuity View (With No-Branching Clause)**
  *(Reached via Q2-No, Q3-No, Q4-Yes)*
  *   **Most Awkward Commitment:** A routine night of deep, dreamless sleep or a minor medical anaesthetic could technically end your existence, even if you wake up remembering everything.

  **Leaf D: Temporal-Norm View (Untried)**
  *(Reached via Q2-No, Q3-No, Q4-No, Q5-Yes)*
  *   **Most Awkward Commitment:** Your identity is tied to a specific speed of thought, so thinking faster or slower makes you a different person even if your memories and character remain identical.
  *   **Status:** **Merely Unattractive.** This combination is rarely occupied because it privileges temporal grain over both biological matter and psychological content without a clear justification.

  **Leaf E: Degree-and-Vagueness View**
  *(Reached via Q2-No, Q3-No, Q4-No, Q5-No, Q6-No)*
  *   **Most Awkward Commitment:** There is no moment when the trial ends your life, but also no moment when it definitely preserves it; survival is a matter of degree that is never fully resolved.

  **Leaf F: Deflationary Claim**
  *(Reached via Q2-No, Q3-No, Q4-No, Q5-No, Q6-Yes, Q7-No)*
  *   **Most Awkward Commitment:** The question "Will I survive?" has no answer, not because it is mysterious, but because the concept of "you" is not the kind of thing that can survive in this context.

  **Leaf G: Functionalist or Substrate-Independent View**
  *(Reached via Q2-No, Q3-No, Q4-No, Q5-No, Q6-Yes, Q7-Yes, Q8-Single)*
  *   **Most Awkward Commitment:** If a perfect copy of your pattern were created elsewhere while you lived, there would be no fact of the matter about which one is the "real" you until one dies.

  **Leaf H: Stage or Four-Dimensionalist View**
  *(Reached via Q2-No, Q3-No, Q4-No, Q5-No, Q6-Yes, Q7-Yes, Q8-Chain)*
  *   **Most Awkward Commitment:** You do not survive the trial at all; rather, the "you" who signs the form ceases to exist, and a later stage-person merely bears a relation of psychological continuity to you.

  ***

  ### Logical Space and Unoccupied Combinations

  **Indistinguishable Leaves:**
  **Leaf G (Functionalist)** and **Leaf H (Stage/4D)** are flagged as difficult to separate. Both agree that functional continuity is what matters for "survival" in a practical sense. The distinction rests on the metaphysical description of *what* is surviving (an enduring object vs. a temporal part), which may not yield different practical advice for a trial participant.

  **Unoccupied or Incoherent Combinations:**
  1.  **Q1-Yes / Q3-Yes / Q5-No:** Accepting that you survive 50% replacement (Q1) but insisting the biological rival is the "real" you in a fission case (Q3), while denying that speed matters (Q5). This is **logically tense**. It implies original matter trumps function in a tie, but function is sufficient for identity in the standard case. While not incoherent, it is an unstable position rarely held consistently.
  2.  **Q4-Yes / Q5-No:** Claiming that anaesthesia gaps break identity (Q4) but speed changes do not (Q5). This is **merely unattractive**. It suggests that the *interruption* of consciousness is fatal, but the *rate* of consciousness is not, despite both being changes to the temporal structure of experience. Most who care about temporal structure (Q4-Yes) also care about temporal grain (Q5-Yes).
  3.  **Q1-No / Q2-Yes:** Claiming you do not survive 50% replacement (Q1) but that both rivals are you in a fission case (Q2). This is **incoherent**. If you cease to exist at the halfway point, there is no "you" left to be identical to either rival at the end.

  ### Guidance for Participants
  This tree is not a test with correct answers. It is a map of your own intuitions. If you find yourself hesitating between two paths, your view may lie in the **Degree-and-Vagueness (Leaf E)** or **Deflationary (Leaf F)** positions, which acknowledge that the concept of "self" may not be sharp enough to bear the weight of this technology. If you land on **Leaf A**, you should consider that, by your own lights, the trial involves your death. If you land on **Leaf G**, you may proceed with the confidence that your pattern is what matters, not your matter.
