answer: |-
  Here is a comparison of the two models based on their mechanical logic, their fit with historical case studies, and their utility for narrative construction.

  ### 1. "For Want of a Nail": Mechanism vs. Inertia

  The proverb "For want of a nail the kingdom was lost" is the foundational myth of alternate history. How each model interprets this rhyme reveals their core divergence.

  **Model One (Amplification)** treats the nail as a seed. The system is inherently unstable; the missing nail is merely the initial condition for a cascade. The loss of the kingdom is the result of exponential growth in error. This model assumes low friction and high sensitivity. It suggests that history is a tightrope walk where any breeze can cause a fall.

  **Model Two (Brittle Nodes)** treats the nail as a linchpin. The system is inherently stable due to redundancy (spare nails, a second horse, a different rider). The kingdom is lost *only* because this specific nail held together a specific load-bearing joint at a specific moment of maximum stress. This model assumes high friction and systemic inertia. It suggests history is a brick wall; most things bounce off, but some spots are cracked.

  **The Difference:** Amplification predicts constant, radial divergence. The further you move from the Point of Divergence (POD), the less recognizable the world becomes. Brittle Nodes predicts step-function divergence. Long stretches of history remain eerily similar to our timeline (because redundancy absorbs shocks), punctuated by sudden, sharp deviations when a node snaps.

  ### 2. Mapping the Cases

  **Case A: The Missed Diplomatic Train (1848)**
  *Context:* The Spring of Nations. Monarchies are shaky, food prices are high, liberal agitation is widespread.
  *   **Amplification View:** The diplomat misses the train. He arrives late. He is angry. He drafts a harsher communiqué. A local protest interprets this as aggression. Violence sparks three days early. The revolution spreads differently.
  *   **Brittle Nodes View:** The diplomat misses the train. The embassy sends a courier on horseback (substitution). The message arrives four hours later. The content is identical. The revolution happens anyway because the structural pressures (famine, repression) were the fuel, not the diplomat's mood.
  *   **Verdict:** **Brittle Nodes** fits better. 1848 was a systemic failure across multiple continents independent of specific communication lags. The "node" wasn't the train; it was the monarchy's inability to feed its people. A missed train is absorbed by the system's redundancy unless the diplomat was the *only* person who could authorize a specific concession (a true brittle node).

  **Case B: The Lunch Menu in Sarajevo (1914)**
  *Context:* The July Crisis. Alliance systems are rigid; military mobilization timetables are set.
  *   **Amplification View:** Changing the lunch menu changes the Archduke's digestion. He feels ill. He skips the motorcade. He lives. World War I is averted. The 20th century is unrecognizable.
  *   **Brittle Nodes View:** Changing the lunch menu is irrelevant unless it alters the route. If he skips the motorcade, the assassins (who were waiting along the route) fail. *However*, the European alliance system was a brittle node primed for collapse. If the Archduke lives, does war still happen? Perhaps a different incident triggers the brittle node later. Or perhaps the Archduke himself was a brittle node (he opposed war with Russia).
  *   **Verdict:** **Brittle Nodes** offers more nuance. It allows you to ask: Was the Archduke the node, or was the Alliance System the node? Amplification says "Change lunch -> Change Century." Brittle Nodes says "Change lunch -> Avoid Assassination -> Check if System still breaks." It respects the possibility that the war was overdetermined (multiple causes) versus underdetermined (one cause).

  ### 3. Novelistic Utility: Honesty vs. Laziness

  You asked which model avoids "lazy determinism."

  **The Trap of Amplification:**
  This model often leads to "Magic Butterfly" plotting. The author changes a small detail and assumes a massive outcome without doing the work to trace the causal chain. It risks becoming a fantasy where the protagonist's sneeze topples empires. It can feel unearned because it ignores the massive inertia of institutions, culture, and geography. It is lazy because it relies on the *idea* of chaos rather than the *mechanics* of it.

  **The Trap of Brittle Nodes:**
  This model risks making history feel too rigid or inevitable ("Nothing matters unless I hit the switch"). However, it forces the novelist to engage in structural world-building. To use this model, you must identify *why* a node is brittle. Is it a person with unique authority? A supply chain with no backup? A technological bottleneck?
  This creates better tension. The reader feels the weight of the system resisting change. When the divergence finally happens, it feels catastrophic and earned because the redundancy was exhausted.

  **Why Brittle Nodes is the Honest Tool:**
  1.  **Verisimilitude:** Real life feels like Model Two. Most days, missed trains don't change your life. Sometimes, they do. A novel that reflects this friction feels more real than one where everything is perpetually on a knife-edge.
  2.  **Plot Constraints:** Amplification allows anything to happen, which is paralyzing. Brittle Nodes tells you what *won't* change. This allows you to keep familiar historical landmarks (which helps orient the reader) while focusing your creative energy on the specific branches that actually diverge.
  3.  **Thematic Depth:** It allows you to explore themes of structural weakness vs. individual agency. Did the kingdom fall because of the missing nail, or because the horseshoe was poorly designed?

  For a novel set in 1847, you are sitting on a powder keg. The Brittle Nodes model allows you to show the powder piling up (structural tension) while your characters fumble with matches (contingency). It prevents the story from becoming a random walk and turns it into a study of pressure and failure.

  \answer{brittle-nodes}
