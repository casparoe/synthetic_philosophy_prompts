answer: |-
  # Workshop Prep Sheet: Defending "Recursive Standing Capture"
  **Audience:** 50% Comparativists (Empiricists), 50% Constitutional Lawyers (Positivists)
  **Goal:** Defend procedural framing without smuggling in normative benchmarks.

  ### 1. The "Hidden Normativity" Charge
  **The Objection:** "You claim this is procedural, but 'capture' implies a 'proper' function. To say standing is 'narrowed' presupposes a baseline of who *ought* to have standing. Aren't you just smuggling in a liberal baseline under the guise of procedure?"
  *   **Force:** **Critical.** If this sticks, your "procedural" claim collapses.
  *   **Concession:** Admit that *any* model requires a baseline of the regime's *own* prior rules.
  *   **2-Minute Reply:** "I'm not measuring against a liberal ideal; I'm measuring against the regime's own self-binding commitments. 'Capture' here isn't normative; it's endogenous. If a constitution grants Group X standing, and the executive alters the rules so Group X cannot invoke that text *without* replacing the text itself, that is a procedural contraction. I'm tracking the revocation of self-imposed constraints, not the violation of external human rights norms."
  *   **Soft Spot:** You still have to define which constraints count as "self-binding" versus "political promises." Lawyers will argue most checks are political, not legal.

  ### 2. The "Formalism Trap" (Comparativist Special)
  **The Objection:** "In Hungary and Turkey, they didn't need to change standing rules. They packed the courts or ignored rulings. Your framework misses the actual mechanism of backsliding because it's too fixated on formal locus standi."
  *   **Force:** **High.** Empiricists know autocrats bypass rules rather than change them.
  *   **Concession:** Acknowledge that standing capture is *one* pathway, not the only one.
  *   **2-Minute Reply:** "You're right that ignoring rulings is common. But 'Recursive Standing Capture' explains the *long-term* consolidation that ignoring rulings doesn't. Ignoring a court is a crisis; changing standing rules makes the defiance permanent and legal. I'm arguing this is the *durable* phase of backsliding. The informal bypass gets the power; the standing capture keeps it."
  *   **Soft Spot:** If your case studies rely on formal rule changes, but the real power grab happened informally *before* the rule change, your timeline is wrong.

  ### 3. The "Democratic Mandate" Counter
  **The Objection:** "If a parliament, elected by a supermajority, votes to limit judicial standing to 'streamline governance,' why is that capture? Isn't that just the principal instructing the agent?"
  *   **Force:** **High.** Lawyers love this; it frames backsliding as democratic will.
  *   **Concession:** Concede that majoritarianism is legitimate, but distinguish *governing* from *entrenching*.
  *   **2-Minute Reply:** "It's democratic until it becomes recursive. If the majority limits standing in a way that prevents future majorities from challenging the *current* executive's specific abuses, it's not streamlining; it's insulation. My framework looks for the *recursion*: does this change make it harder to challenge *this* administration specifically, or does it apply neutrally? If it's the former, it's capture, not mandate."
  *   **Soft Spot:** Distinguishing "neutral" from "targeted" application is empirically messy. Most laws are facially neutral but applied selectively.

  ### 4. The US Landmine (*Lujan* Doctrine)
  **The Objection:** "You mentioned the US. Under *Lujan v. Defenders of Wildlife* (1992), the Supreme Court drastically narrowed standing for public interest groups. By your metric, did the US undergo democratic backsliding thirty years ago?"
  *   **Force:** **High.** This tests the universality of your framework.
  *   **Concession:** Do not deny *Lujan* narrowed standing.
  *   **2-Minute Reply:** "Good catch. *Lujan* narrowed *judicial* standing, but it didn't trigger the 'recursive' element I'm tracking. Congress and state courts retained the ability to check the executive through other statutory channels. My framework requires a *systemic* narrowing across multiple veto points (legislative, judicial, administrative). A single court doctrine, even a restrictive one, doesn't equal regime-level standing capture unless it's part of a broader exclusion of opposition actors from *all* formal check mechanisms."
  *   **Soft Spot:** If they press you on whether the *combination* of *Lujan* + gerrymandering + executive orders meets your threshold, you might have to admit the US fits the model, which could alienate the room.

  ### 5. "Reform" vs. "Capture" (Operationalization)
  **The Objection:** "How do you empirically distinguish between stopping frivolous litigation (reform) and stopping opposition litigation (capture)? Both look like narrowing standing."
  *   **Force:** **Medium-High.** This is the measurement validity problem.
  *   **Concession:** Admit this is the hardest coding challenge in the project.
  *   **2-Minute Reply:** "I look at the *distributional impact* post-reform. If the new standing rules disproportionately dismiss cases brought by institutional opposition actors while preserving access for government-aligned entities, that's capture. If the dismissal rate is uniform across political affiliations, it's reform. I'm coding the *outcome* of the standing change, not just the text."
  *   **Soft Spot:** Getting data on the political affiliation of plaintiffs in civil law systems (like Hungary) is notoriously difficult. They might doubt your data quality.

  ### 6. The "Executive Bypass" Objection
  **The Objection:** "In emergencies, executives rule by decree. Standing becomes irrelevant. Your framework assumes a functioning legal order that backsliding regimes often suspend."
  *   **Force:** **Medium.** It limits the scope of your theory.
  *   **Concession:** Agree that your framework applies to "stealthy" backsliding, not coup-style breakdowns.
  *   **2-Minute Reply:** "Precisely. This framework is designed to explain *why* executives bother with legal reforms at all. If they could just rule by decree forever, they would. The fact that they invest political capital in changing standing rules suggests they need the *cover* of legality. My theory explains the behavior that the 'executive bypass' theory ignores: the legalization of authoritarianism."
  *   **Soft Spot:** It admits your theory doesn't work for the most severe cases of democratic collapse.

  ### 7. The "Locus Standi" Semantic Attack (Lawyer Special)
  **The Objection:** "You're using 'standing' colloquially. Legal standing (*locus standi*) is a specific threshold for court entry. You seem to be using it as a proxy for 'political influence.' That's conceptually sloppy."
  *   **Force:** **Medium.** Lawyers hate terminological drift.
  *   **Concession:** Clarify you are expanding the legal definition slightly.
  *   **2-Minute Reply:** "I'm not using it as 'influence.' I'm using it to mean 'formal capacity to initiate a binding review.' That includes courts, but also legislative minority rights to petition constitutional courts, or ombudsman powers. It's still procedural. If the text says you can file, and now you can't, that's standing. I'm just aggregating multiple procedural entry points, not measuring vague influence."
  *   **Soft Spot:** If you include "ombudsmen" or "legislative minorities," lawyers will argue those aren't *standing* in the strict sense, they are *powers*.

  ### 8. The "Endogeneity" Problem
  **The Objection:** "Does standing capture cause backsliding, or is it a symptom? Maybe the opposition loses standing because they've already lost political power."
  *   **Force:** **Low-Medium.** A standard causality challenge.
  *   **Concession:** Admit it's likely both.
  *   **2-Minute Reply:** "It's a feedback loop—that's why I call it 'recursive.' Loss of political power leads to standing loss, which cements the loss of power. My claim isn't that standing capture starts the fire, but that it's the mechanism that makes the fire irreversible. It's the lock-in device."
  *   **Soft Spot:** Hard to prove the "lock-in" effect without long-term longitudinal data you might not have yet.

  ***

  ### 🛑 The "Bomb Shelter" Question
  **The Question:** "Can your framework distinguish between Hungary's constitutional changes and India's recent procedural reforms regarding judicial review? Both narrowed standing, but one is called backsliding and the other 'development.' If your metric is purely procedural, why isn't India backsliding?"

  *   **Why you fear it:** It forces you into comparative constitutional law you haven't prepped. If you say "India is different," you look normative. If you say "India is also backsliding," you look naive/controversial.
  *   **Survival Strategy:** **Do not take the bait on India.** Pivot to the *recursion* element.
  *   **The Reply:** "That's a great test case. My framework doesn't judge the *label* 'backsliding,' it tracks the *mechanism*. If India's reforms systematically prevent specific opposition actors from invoking checks while leaving ruling-party actors untouched, my model flags that as standing capture. Whether that constitutes 'democratic backsliding' depends on whether those checks were essential to the regime's own self-definition. I'm offering a diagnostic tool, not a verdict on specific countries. I haven't coded India yet, so I can't speak to the distributional impact there."
  *   **Why this works:** It refuses to make the normative judgment they want while maintaining the integrity of the procedural metric. It buys you time to actually look at India later.
