answer: |-
  This is a sophisticated puzzle that cuts to the heart of how Bayesian formalism interfaces with scientific practice. You have identified a specific instantiation of the **Duhem-Quine problem** within a hierarchical Bayesian framework, disguised as an "old evidence" puzzle.

  To write this feature effectively, you need to disentangle three distinct layers: the formal mathematics of hierarchical inference, the epistemic timeline of model construction, and the normative criteria for "prediction."

  Here is an analysis of the conceptual issue, structured to help you navigate the tension for your piece.

  ### 1. The Formal Structure: Joint Inference vs. Sequential Conditioning

  First, we must clarify what the cosmologist is actually doing mathematically, because the "double duty" worry depends heavily on whether she is performing a **joint update** or a **sequential point-estimate update**.

  Let $D$ be the CMB data, $\theta$ be the cosmological parameters (the theory), and $\phi$ be the instrument noise hyperparameters.

  **The Ideal Bayesian Approach (Joint Inference):**
  In a strictly coherent hierarchical model, the cosmologist does not update $\phi$ and then $\theta$ separately. She computes the joint posterior:
  $$P(\theta, \phi | D) \propto P(D | \theta, \phi) P(\theta | \phi) P(\phi)$$
  To get the posterior on the theory alone, she marginalizes over the noise:
  $$P(\theta | D) = \int P(\theta, \phi | D) \, d\phi$$
  In this formalism, the data $D$ is used exactly once to constrain the *joint* hypothesis space. There is no "double counting" here. The uncertainty in the instrument noise $\phi$ is propagated into the uncertainty of the theory $\theta$. If the data is ambiguous about the noise, the theory posterior remains wide.

  **The Practitioner's Approach (Empirical Bayes/Sequential):**
  Your description ("At the first level, she conditions... At the second level, she uses the noise-corrected measurements") suggests a sequential procedure often used in practice.
  1.  Find $\hat{\phi} = \text{argmax}_{\phi} P(\phi | D)$.
  2.  Treat $\hat{\phi}$ as fixed truth.
  3.  Compute $P(\theta | D, \hat{\phi}) \propto P(D | \theta, \hat{\phi}) P(\theta)$.

  **The Conceptual Issue:**
  If she follows the sequential approach, she **is** double-counting the data's constraining power. By fixing $\phi$ at its optimal value given $D$, she ignores the variance in $\phi$. She treats the data as having provided more information than it actually did. This creates an illusion of precision in $\theta$.

  However, even in the **Joint Inference** case (which is formally coherent), your deeper epistemic worry remains: *Does the data confirm the theory, or does it merely confirm the joint capacity of the theory-plus-noise-model to fit the data?*

  ### 2. Does Hierarchical Partitioning Resolve "Old Evidence"?

  The short answer is **no**. It displaces the problem from the theory level to the model-structure level.

  The classic "Old Evidence" problem (Glymour, 1980) arises when $P(E) = 1$ (the agent already knows the evidence). In your cosmological scenario, the "old evidence" tension isn't about the temporal age of the data, but about the **logical independence** of the model components.

  If the noise model $\phi$ is flexible enough to absorb any discrepancy between the theory $\theta$ and the data $D$, then $D$ cannot falsify $\theta$. This is the Bayesian version of the **Duhem-Quine thesis**: you never test a hypothesis in isolation, only a conjunction of hypotheses ($H \land A$, where $A$ are auxiliary assumptions like noise models).

  **The Displacement:**
  Hierarchical modeling does not solve the old evidence problem; it **parameterizes the auxiliary assumptions**.
  *   **Classic Old Evidence:** "Mercury's perihelion was known. General Relativity was new. How does known data confirm new theory?"
  *   **Hierarchical Version:** "The CMB map is known. The Noise Model + Cosmo Model is new. How does known data confirm the Cosmo part specifically?"

  If the noise parameters $\phi$ were unspecified *before* seeing $D$, then $D$ is indeed "new" evidence for the *joint* model $(\theta, \phi)$. But if the goal is to confirm $\theta$ specifically, the hierarchical structure reveals that $D$ is only confirming $\theta$ *relative to the assumption that the noise structure is correctly specified*.

  If the cosmologist uses $D$ to determine the noise structure (e.g., choosing a Gaussian noise model because it fits the residuals), and then uses $D$ to confirm $\theta$ under that noise model, she has engaged in **circular accommodation**. The hierarchical partition doesn't resolve this; it merely makes the circularity explicit in the dependency graph.

  ### 3. Prediction vs. Accommodation in Nested Inference

  This is the crux of your feature. In a single joint inference, how can the cosmologist claim **predictive success**?

  Strictly speaking, within the likelihood principle, there is no formal difference between prediction and accommodation. $P(D|H)$ is the same number regardless of whether $D$ was observed before or after $H$. The difference is **counterfactual and methodological**, residing in the **prior construction**.

  **The Degrees of Freedom Argument:**
  Predictive success implies that the model had limited "capacity" to fit arbitrary data. Accommodation implies the model was flexible enough to fit the specific data at hand.
  *   In hierarchical modeling, the noise parameters $\phi$ add degrees of freedom.
  *   If $\phi$ is updated on $D$, those degrees of freedom are "spent" on fitting $D$.
  *   Therefore, the fit of $\theta$ to $D$ is less impressive (less predictive) than if $\phi$ had been fixed independently.

  **The Normative Line:**
  The cosmologist can claim predictive support for $\theta$ **only if the priors on $\phi$ were constrained independently of $D$.**
  *   **Scenario A (Accommodation):** Priors on noise are vague. $D$ is used to sharpen $\phi$ and $\theta$ simultaneously. The fit is a result of the combined flexibility of theory + noise.
  *   **Scenario B (Prediction):** Priors on noise are tight, derived from lab calibration of the instrument *before* pointing it at the sky. $D$ updates $\theta$, but $\phi$ barely moves. Here, the data is truly testing $\theta$, because the "auxiliary belt" (noise) was held fixed.

  If the calibration step and theory-testing step use the *same* dataset without independent constraints on the calibration parameters, the data provides **accommodative support for the joint model**, but **ambiguous support for the theory**. The "predictive" claim is an illusion created by assuming the noise model is "true" rather than "fitted."

  ### 4. What This Reveals About Bayesian Coherence

  This nested case reveals a critical limitation of Bayesian coherence for the philosophy of science: **Coherence is necessary but not sufficient for scientific rationality.**

  Bayesian coherence ensures that you do not contradict yourself (e.g., by double-counting data in a probability calculation). It ensures that $P(\theta, \phi | D)$ is mathematically consistent.

  However, coherence **cannot** distinguish between:
  1.  A theory that successfully predicted data because it captured the structure of the world.
  2.  A theory that fits data because the auxiliary noise model absorbed the errors.

  Both scenarios can be represented by coherent probability distributions. To distinguish them, you need **methodological constraints external to the calculus**:
  *   **Prior Independence:** Auxiliary assumptions (noise) must be constrained by evidence distinct from the theory-testing evidence.
  *   **Cross-Validation:** Data used to tune hyperparameters ($\phi$) should be distinct from data used to evaluate theory parameters ($\theta$).
  *   **Penalization:** Model selection criteria (like Bayes Factors or BIC) must penalize the complexity of the noise model. If the noise model is too complex, the marginal likelihood $P(D | \text{Model})$ drops, correctly signaling that the "fit" is over-parameterized.

  ### Summary for Your Feature

  The hierarchical cosmologist's scenario does not resolve the old evidence problem; it **relocates the burden of novelty**.

  1.  **The Displacement:** The data is "new" for the noise parameters, but if those parameters are free to vary, they can "explain away" anomalies that should have falsified the theory. The old evidence problem transforms into a **model flexibility problem**.
  2.  **The Bootstrapping Worry:** It is not merely displaced upward; it is embedded in the correlation between $\theta$ and $\phi$ in the posterior. If the data can be fit by adjusting noise *or* theory, the posterior will show a "ridge" of correlated solutions. The data does not uniquely support the theory; it supports a *relationship* between theory and noise.
  3.  **The Normative Line:** Bayesian coherence alone cannot draw the line between prediction and fitting. The line is drawn by the **provenance of the priors**. If the priors on instrument noise are derived from the same data used to test the theory, the confirmation is spurious. Genuine predictive success in hierarchical modeling requires that the "lower levels" of the hierarchy (instrumentation) be anchored by evidence independent of the "upper levels" (cosmology).

  **The Hook:** You can argue that modern Bayesian science often mistakes **convergence** (the MCMC chain finding a stable posterior) for **confirmation**. In hierarchical models, we can be highly confident in a joint solution ($\theta, \phi$) that is actually a sophisticated form of curve-fitting, unless we rigorously enforce independence between the calibration data and the testing data. The "old evidence" problem isn't about time; it's about **informational independence**.
