answer: |-
  Here is a procedure designed for your constraints: 10-minute triage, no investigation, volunteer-proof, and documentable.

  It shifts the focus from **"Does this person have moral standing?"** (which is a values call) to **"Is this report viable for community enforcement?"** (which is a process call).

  ### The Procedure: Report Viability Triage (RVT)

  **Who uses this:** Any shift volunteer receiving a written or verbal complaint.
  **Time limit:** 10 minutes.
  **Tools needed:** Complaints Log (searchable by name/rule), RVT Form (below).
  **Rule:** If you cannot answer a question with a "Yes/No" based on *immediate* evidence or the Log, you must default to the option that preserves the report for Coordinator review.

  #### Part 1: The Safety Valve (Stop Early)
  *If any answer is YES, bypass the rest. Mark "Priority Review." Send to Coordinator immediately.*
  1.  Does this involve physical safety, theft, or harassment?
  2.  Is the reporter alleging they were personally threatened?
  3.  Is the accused currently in a position of power over the reporter (e.g., shift lead)?

  #### Part 2: The Viability Check (The 10-Minute Filter)
  *If you passed Part 1, answer these three questions. You must be able to justify your answer with a Log entry or the text of the complaint itself.*

  **Q1: Direct Harm.**
  *Question:* Does the report state the reporter suffered specific, personal loss or injury (not just "it's against the rules")?
  *   **Yes:** Report is **Viable**. (Go to Decision).
  *   **No:** Proceed to Q2.

  **Q2: Documented Consistency.**
  *Question:* Does the Complaints Log show the reporter has been sanctioned for *this specific rule* in the last 12 months?
  *   **No:** Report is **Viable**. (Go to Decision).
  *   **Yes:** Proceed to Q3.

  **Q3: Requested Outcome.**
  *Question:* Is the reporter asking for a system fix (training, signage, policy change) or a specific punishment for the accused (ban, sanction, public shaming)?
  *   **System Fix:** Report is **Viable**. (Go to Decision).
  *   **Specific Punishment:** Report is **Non-Viable**. (Stop).

  #### Part 3: The Decision Codes
  *Based on the path above, select one code. This code goes on the public minutes.*

  *   **CODE A (Act):** Safety Valve triggered OR Direct Harm confirmed.
      *   *Action:* Investigate the accused act.
      *   *Note:* If Q2 was "Yes" (Reporter has history), attach a "Parallel Review" flag. The reporter's own history must be reviewed alongside the complaint.
  *   **CODE B (Monitor):** No Direct Harm, No History, Punitive Request.
      *   *Action:* Log the incident. Do not sanction accused unless 3 similar reports arrive.
      *   *Note:* This catches the "Norm-Shopper" without silencing them.
  *   **CODE C (Decline):** No Direct Harm, Reporter has History, Punitive Request.
      *   *Action:* Do not investigate.
      *   *Note:* This handles the "Hypocrite" without calling them a hypocrite.

  #### Part 4: The Guardrails (Preventing Volunteer Abuse)
  1.  **The "Decline" Lock:** A volunteer cannot finalize a **CODE C (Decline)** alone. It must be countersigned by a second volunteer or Coordinator within 24 hours. If no signature is found, the Code defaults to **CODE B (Monitor)**.
  2.  **The Script:** Volunteers must not explain *why* a report is declined using moral language. They must use the Script below.
  3.  **The Audit:** Once a quarter, the Coordinators review all **CODE C** decisions. If a volunteer has >3 declines in a quarter, they are rotated off complaint duty.

  #### Part 5: The Communication Scripts
  *Copy/paste these. Do not ad-lib.*

  **For CODE A (Act):**
  > "Thank you for reporting this. Because this involves [Direct Harm / Safety / Policy Consistency], we are opening a review of the incident. Please note that in our process, all parties involved in a reported incident may be subject to review regarding adherence to co-op standards."
  > *(This warns the hypocrite they might get caught without accusing them yet.)*

  **For CODE C (Decline):**
  > "Thank you for your report. We have reviewed the submission against our current enforcement priorities. At this time, we are not opening an investigation into this specific incident. We encourage you to continue modeling the standards you wish to see in the co-op."
  > *(This avoids "You have no standing." It frames it as "Enforcement Priorities" and subtly hints they need to model the behavior.)*

  ***

  ### Where This Framework Doesn't Reach
  Do not use the RVT for these. They bypass standing entirely.
  1.  **Physical Safety:** If someone is bleeding or threatened, nobody cares who reported it.
  2.  **Financial Discrepancies:** Cash shortages are mathematical, not moral.
  3.  **Harassment/Discrimination:** These are liability issues, not rule disputes.
  4.  **Systemic Failure:** If 10 people report the same broken fridge, the fridge is the problem, not the reporters.

  ***

  ### Running the Cases

  Here is how the RVT handles three of your specific scenarios.

  #### Case 1: The Direct Victim who is also the Worst Offender
  *Scenario:* Member A (who frequently steals produce) reports Member B for stealing produce. Member A claims B's theft hurt the co-op's budget (Direct Harm). Log shows A was sanctioned for theft 3 months ago.
  *   **Q1 (Direct Harm):** Yes (Budget harm/Co-op loss).
  *   **Decision:** **CODE A (Act).**
  *   **The "Parallel Review" Flag:** Because Q2 (History) was also Yes, the Coordinator must review Member A's compliance *while* investigating Member B.
  *   **The Unwelcome Answer:** The procedure forces you to **act on the complaint.** You cannot bin it. But it also forces you to **re-sanction the reporter.**
  *   **Why you might dislike this:** It creates double the work. It validates the hypocrite's voice (they successfully triggered an investigation) while punishing them. It admits that a liar can still tell the truth.
  *   **Why it's necessary:** If you bin it, Member B actually *did* steal, and the co-op loses trust that rules apply to anyone. If you act without the Parallel Review, Member A learns that accusing others is a good distraction from their own theft.

  #### Case 2: The Reformed One
  *Scenario:* Member C broke the cash rule a year ago, was sanctioned, admitted it, and has been perfect since. Member C reports Member D for breaking the cash rule.
  *   **Q1 (Direct Harm):** No (Observation).
  *   **Q2 (Documented Consistency):** **Yes.** (Log shows sanction 12 months ago).
  *   **Q3 (Requested Outcome):** Let's assume Member C asks for "Refresher training for all shift leads" (System Fix).
  *   **Decision:** **CODE A (Act).**
  *   **Why:** Even though Q2 was a "Yes," Q3 saved it. Because they asked for a system fix, their history is less relevant than their solution.
  *   **Distinction:** If Member C had asked for "Member D should be suspended," the RVT would have pushed to **CODE C (Decline)** because a person with a history requesting punitive action against a peer is high-risk for "revenge reporting."
  *   **Result:** This validates your instinct that the reformed member is valuable, *but only if they advocate for the system, not against the person.*

  #### Case 3: The Norm-Shopper
  *Scenario:* Member E argues the "No Phone on Shift" rule is stupid every meeting. One day, they see Member F (who they dislike) on a phone. Member E reports F demanding F be banned.
  *   **Q1 (Direct Harm):** No.
  *   **Q2 (Documented Consistency):** No (They argue against it, but haven't been sanctioned).
  *   **Q3 (Requested Outcome):** Punitive ("Ban F").
  *   **Decision:** **CODE B (Monitor).**
  *   **Result:** You do not investigate F immediately. You log it. If Member E reports 3 people in a month, you see the pattern (Member E is the problem). If 3 different people report Member F, you act on F.
  *   **Why:** This stops the weaponization of rules without requiring the volunteer to prove Member E is a "Norm-Shopper." It just slows down the weapon.

  ***

  ### Distinctions: Keep vs. Flatten

  To make this work for a tired volunteer in 10 minutes, you must simplify the moral landscape.

  **1. FLATTEN: "Moral Purity" vs. "Documented History"**
  *   *Don't ask:* "Is the reporter a good person?"
  *   *Do ask:* "Is there a log entry in the last 12 months?"
  *   *Why:* Volunteers cannot judge character. They can check a log. This protects the volunteer from accusations of bias. If the reporter wasn't caught before, they get the benefit of the doubt *this time*, but their request for punishment is limited.

  **2. KEEP: "Direct Harm" vs. "Rule Observation"**
  *   *Why:* This is the single most important distinction. A victim needs a path to redress even if they are flawed (Case 1). An observer who is flawed does not. This distinction prevents the "Silencing the Victim" outcome.
  *   *Difficulty:* It requires the volunteer to distinguish between "I was hurt" and "The rule was broken."
  *   *Training:* Give volunteers examples. "They stole my shift slot" = Harm. "They didn't wear a hat" = Observation.

  **3. FLATTEN: "Intent" (Why are they reporting?)"**
  *   *Don't ask:* "Are they doing this out of spite?"
  *   *Do ask:* "What outcome do they want?" (Script/Policy vs. Punishment).
  *   *Why:* Intent is invisible. Outcomes are written on the form. A "Norm-Shopper" usually wants a head on a plate. A "Community Minder" usually wants a policy fix. This captures the difference without mind-reading.

  **4. KEEP: The "Decline Lock" (Second Signature)**
  *   *Why:* This is your only defense against the tired volunteer binning everything. It introduces friction. If I have to find someone to sign off on my laziness, I might as well process the form.
  *   *Difficulty:* It requires coordination.
  *   *Mitigation:* The default is "Monitor" (Code B), not "Decline" (Code C). If the second signature isn't found, the complaint stays in the queue. This makes "binning" the harder path.

  ### Summary of the Trade-Off
  This procedure accepts that **you will sometimes investigate complaints from hypocrites.** (Case 1).
  It trades the *moral satisfaction* of silencing a hypocrite for the *operational safety* of ensuring real violations are caught.
  It protects the volunteer by making the *Log* and the *Requested Outcome* the villains, not the volunteer's judgment.
  It protects the community by ensuring that "Punitive Requests" from people with a history are automatically downgraded to "Monitoring," which neuters the weaponization of rules without starting a war.
