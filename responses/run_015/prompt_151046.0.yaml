answer: |-
  Good evening, everyone. For those who don't know me, I'm [Name]'s sibling.

  Now, I know looking around this room, I'm speaking to a very specific mix of people. Half of you are family and friends who just want to have a drink and celebrate [Sister's Name]. The other half are palliative care specialists who could probably dismantle my entire argument before I've finished my pint.

  [Sister's Name] has always had a dark sense of humour. You know that. Over the years, she's joked that her job wasn't about saving lives, but about running a certain famous thought experiment in reverse.

  There's this idea in philosophy about a machine that could give you any experience you wanted—perfect happiness, success, love—all simulated. Most people say they wouldn't plug in. They want reality. But [Sister's Name] used to say her job was the opposite. She wasn't plugging people into false pleasures. She was the one authorised to pull the plug on the machinery that was keeping people in a reality of prolonged suffering, when there was no real life left to preserve.

  It's a brilliant joke, but it actually touches on something proper heavy. Something I've thought about a lot watching her work.

  There's a debate about what makes a life go well. Some say it's purely about what you feel—pleasure versus pain. Others say it's about satisfaction—getting what you want, living by your values.

  In hospice, these two ideas collide. And I want to talk about how [Sister's Name] navigated that, without making this sound like a university lecture.

  On the one hand, you have the view that welfare is about experience. If well-being is just about feeling good, then stopping treatment raises a difficult question. If you withdraw life support, and the patient slips away without ever waking up to report feeling relief… did you actually improve their welfare? They never experienced the "better." They just experienced the end.

  I've seen [Sister's Name] lose sleep over this. Not the morality of it, but the silence of it. How do you measure success when the beneficiary can't say thank you?

  But here's what she taught me. Removing pain is a gift, even if it's never unwrapped. On an experiential view, the absence of suffering counts, even if there's no positive feeling to follow it. You don't need to consciousely enjoy peace to benefit from it. You just need to be spared the war.

  Then there's the other view—that life satisfaction is about fulfilling wishes. Can you justify pulling the plug for someone's "own good" without knowing what they want?

  Sometimes, you can't know. But [Sister's Name] operated on the belief that almost everyone's deepest value, when stripped back, is experiential anyway. We want dignity. We want to not be a burden. But mostly, we want to not hurt. So even when you're acting on a life-satisfaction account—doing what they would have wanted—you're usually smuggling in experiential data. You're assuming they wouldn't want to suffer.

  So, in practice, the theories converge. And she was the one standing at the intersection.

  I need to be careful here, though. We shouldn't pretend death is just another experience. It's not. It's not a "peaceful feeling." It's the end of feeling. And there's a comfort in that. When the machinery stops, the struggle stops. She didn't offer them a new experience; she offered them an end to the old ones.

  To the medical staff here: you know the clinical weight of those decisions better than anyone. You know the gap between keeping a heart beating and keeping a person present.

  To the family and friends: you know the love that made those decisions necessary.

  [Sister's Name] spent her career managing that gap. She didn't try to fix the unfixable. She didn't try to simulate a future that wasn't there. She protected the welfare of people who could no longer protect it themselves. She ensured that when the end came, it wasn't a medical failure, but a human conclusion.

  Whether you measure that in feelings spared or values honoured, the result is the same. She did a proper, difficult, compassionate job.

  So, if I could ask you to raise a glass.

  To [Sister's Name]. For knowing when to fight, and knowing when to let go. For running the machine in reverse, so others didn't have to stay plugged in against their will.

  Cheers.
