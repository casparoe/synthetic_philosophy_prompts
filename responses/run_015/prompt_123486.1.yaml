  # JOINT STATEMENT ON COMPUTATIONAL COMPLEXITY AND EPISTEMIC NORMS

  **Date:** October 24, 2023
  **Parties:** The Idealist (Supervisor), The Feasibilist (Student), The Arbiter (Philosopher of Formal Epistemology & Complexity)

  ## PREAMBLE
  We acknowledge a stalemate regarding the normative status of probabilistic coherence and conditionalization in the face of computational intractability. We agree that continuing to talk past one another is unproductive. This document codifies our common ground, isolates the genuine substantive disagreements, and establishes criteria for resolving them. We commit to treating computational complexity not as a mere practical limitation but as a potential constraint on normative theory itself.

  ## SECTION I: AGREED CLAIMS
  *Both parties sign the following propositions. Denial of any claim below constitutes a violation of this agreement.*

  1.  **The Complexity Facts:** We agree that exact probabilistic inference in general Bayesian networks is #P-hard, that checking a belief set for probabilistic consistency is NP-hard, and that exact Bayesian conditionalization on realistic evidence partitions is computationally prohibitive for any finite agent with bounded memory and time. These are not contingent engineering limitations but structural features of the representations we use.
  2.  **The Function of Norms:** We agree that an epistemic norm must, at minimum, discriminate between better and worse cognitive states or processes. A norm that assigns the same evaluation to every possible agent state is vacuous.
  3.  **Dutch Book Limitations:** We agree that standard Dutch Book arguments for coherence presuppose logical omniscience or an unbounded capacity to recognize betting opportunities. These arguments do not transfer directly to resource-bounded agents without significant modification regarding what counts as a "sure loss" for a bounded reasoner.
  4.  **Worst-Case vs. Typical-Case:** We agree that worst-case complexity results (e.g., NP-hardness) do not entail that *every* instance of a problem is intractable. We acknowledge the relevance of average-case analysis and smoothed complexity, but we also agree that an agent cannot guarantee it is operating on an "easy" instance in a dynamic, adversarial, or shifting environment.
  5.  **Logical Omniscience:** We agree that standard Bayesianism entails a form of logical omniscience (closure under implication) that is impossible for finite agents. We agree that this is a known problem for the standard view, regardless of whether one thinks it is fatal.
  6.  **The Limit Concept:** We agree that the Idealist's norms can be mathematically characterized as the limit of the Feasibilist's resource-indexed norms as resources $R \to \infty$. We disagree on whether that limit retains normative force when $R$ is finite.

  ## SECTION II: RESIDUAL DISAGREEMENTS
  *The following table isolates the specific points of contention. We commit to the predictions listed.*

  | Crux | Idealist Formulation | Feasibilist Formulation | Agreed Test / Case | Idealist Prediction | Feasibilist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Assessment vs. Guidance** | Norms are standards of *correctness* (like truth), not recipes for action. A norm can assess an agent even if the agent cannot follow it. | Norms are *procedural constraints*. If a rule cannot guide action even in principle, it fails to function as a norm for that agent. | **The Unfollowable Map:** An agent is given a map to a treasure that requires solving a #P-hard problem to interpret. The map is "correct" but unusable. | The map is still the standard of correctness. The agent is lost, but the map isn't wrong. | The map is normatively defective for this agent. A usable sketch is the true norm. |
  | **2. Universal Violation** | Universal violation is the human condition. Norms describe the *target*, not the current state. Violation shows why we need the norm. | Universal unavoidable violation renders the norm useless for discrimination. If everyone fails necessarily, the norm cannot distinguish rational from irrational. | **The Grading Curve:** Two agents, A and B. Both violate coherence. A violates it less, but only on instances that are computationally easy by luck. B uses a heuristic that violates it more but is robust. | A is more rational (closer to ideal). | B is more rational (better use of resources). |
  | **3. Feasible Dominance** | Ill-defined. "Distance" from an ideal output is meaningless if the ideal output is uncomputable. You cannot measure error against a value you cannot calculate. | Well-defined via *operational proxies*. We measure distance on shared sub-tasks or tractable fragments where the ideal *is* computable, then generalize. | **Tractable Fragment:** Compare a heuristic vs. exact inference on a poly-tree (tractable subgraph) embedded in a larger net. | The heuristic will diverge from exact inference as the poly-tree connects to the hard nodes. | The heuristic will maintain bounded error while exact inference crashes (time-out). |
  | **4. The Approximation Trap** | Rare pathology. The ideal solution is the attractor; tractable approximations (e.g., variational methods) converge toward it. | Common structural feature. The "ideal" optimum may lie in a region of hypothesis space inaccessible to tractable search. A non-approximating rule may outperform. | **High-Dimensional Sparse Data:** Compare $L_1$ regularization (tractable, biased) vs. Bayesian Model Averaging (intractable ideal) on sparse high-dim data. | Bayesian Averages will theoretically outperform if computation were possible; $L_1$ is just a stopgap. | $L_1$ will outperform in predictive accuracy because the "ideal" overfits the noise the tractable rule ignores. |
  | **5. The Regress Problem** | Feasibilist norms require checking if a rule is "feasible." Checking feasibility is itself hard. This leads to a regress of meta-computation. | Feasibility is checked via coarse-grained heuristics (e.g., "is the graph dense?"). We do not need exact feasibility checks, just reliable ones. | **Meta-Cost:** Agent must choose between Rule X and Rule Y. Agent spends time $T$ checking feasibility. | If $T$ is significant, the net gain of the Feasibilist norm vanishes. | If $T$ is constant or logarithmic, the net gain remains positive as problem size scales. |
  | **6. Worst-Case Relevance** | Asymptotic hardness is irrelevant for finite brains. We never face $N \to \infty$. We face specific $N=10^9$, which might be easy. | Asymptotics dictate *scaling*. Rationality must account for growth. A norm that breaks when the belief set expands by 10% is unstable. | **Scaling Test:** Add 10% more variables to the belief network. | Performance degradation will be linear or manageable. | Performance degradation will be exponential, causing a phase transition in rationality. |

  ## SECTION III: ARBITER'S ADJUDICATION & ANALYSIS

  *The following analysis is provided by the Arbiter to break the deadlock. It identifies verbal disputes, substantive errors, and the path forward.*

  ### 1. The Merely Verbal Dispute: Assessment vs. Guidance
  **Verdict:** This is largely verbal, but with a substantive tail.
  **Reasoning:** The Idealist and Feasibilist are using different definitions of "norm." The Idealist uses "norm" in the *evaluative* sense (a standard of perfection, like "perfect pitch"). The Feasibilist uses "norm" in the *prescriptive* sense (a rule of procedure, like "sheet music").
  **Resolution:** We should distinguish **Ideal Standards** (Idealist's domain) from **Bounded Norms** (Feasibilist's domain). The Idealist is right that we need standards to measure progress. The Feasibilist is right that standards cannot be the *only* normative output.
  **Caveat:** The dispute becomes substantive if the Idealist claims the Ideal Standard is the *only* thing that matters for rationality. That is false. An agent who follows a Bounded Norm perfectly is more rational than an agent who fails the Ideal Standard while trying to follow it directly.

  ### 2. The Substantive Error: The Idealist on the Approximation Trap
  **Verdict:** The Feasibilist has the better of this argument.
  **Reasoning:** The Idealist assumes the "true" Bayesian posterior is always the epistemic optimum. This ignores the bias-variance tradeoff inherent in statistical learning theory. In high-dimensional spaces, the "ideal" posterior often overfits the data because it lacks regularization that tractable heuristics (like sparse approximations) implicitly enforce.
  **Why the Idealist is wrong:** If the goal is *predictive accuracy* or *truth-tracking* in a noisy environment, the intractable ideal can be epistemically worse than the tractable approximation. The "Ideal" is only ideal relative to a noise-free, infinite-data assumption.
  **Condition for Change:** The Idealist must concede that if a tractable rule consistently yields higher predictive accuracy than the intractable ideal on empirical data, the "Ideal" loses its normative privilege.

  ### 3. The Substantive Error: The Feasibilist on the Regress
  **Verdict:** The Idealist has a point here that the Feasibilist is underestimating.
  **Reasoning:** The Feasibilist assumes checking "feasibility" is cheap. It is not always. Determining if a specific graph structure allows polynomial inference is itself non-trivial. If the Feasibilist norm requires a complex meta-calculation to select the rule, the net resource gain may be negative.
  **Why the Feasibilist is vulnerable:** If the resource parameter $R$ is part of the norm, the agent must know $R$. Measuring available cognitive resources is cognitively expensive.
  **Condition for Change:** The Feasibilist must demonstrate that the *selection mechanism* for resource-indexed norms is itself resource-bounded (e.g., a simple lookup table or reflex), not a complex optimization problem.

  ### 4. The Core Disagreement: Universal Violation
  **Verdict:** The Feasibilist is correct that universal unavoidable violation is a defect, but the Idealist is correct that it is the human condition.
  **Reasoning:** A norm that is universally violated *and* provides no gradient for improvement is defective. However, Bayesian coherence *does* provide a gradient (you can be more or less coherent).
  **The Pivot:** The disagreement is not about violation, but about *blame*. The Idealist blames the agent for violating coherence. The Feasibilist blames the norm for demanding the impossible.
  **Resolution:** We should adopt a **Dual-Aspect Theory**.
  1.  **Coherence** remains the *regulative ideal* (we aim at it).
  2.  **Complexity** provides the *excuse condition* (we are not blamed for missing it if it is hard).
  **Crucial Point:** The Feasibilist's "Feasible Dominance Principle" should replace Coherence as the primary *blame-assigning* norm. If you violate Coherence but satisfy Feasible Dominance, you are rational. If you satisfy Coherence (by luck) but violate Feasible Dominance (wasting resources), you are irrational.

  ## SECTION IV: COMMITMENTS FOR FUTURE WORK

  1.  **No More "Ought Implies Can" Sloganeering:** We will not cite the principle without specifying whether we mean "can" as *logical possibility* or *computational feasibility*.
  2.  **Formalize the Trap:** We will jointly construct a formal model of the "Approximation Trap" using a specific class of graphical models where the tractable approximation provably outperforms the intractable ideal in predictive accuracy.
  3.  **Resource Metrics:** The Feasibilist will produce a draft definition of the resource parameter $R$ that avoids the Regress Problem (likely by fixing $R$ exogenously rather than having the agent calculate it).
  4.  **Empirical Check:** We will run the "Scaling Test" (Table Row 6) on a standard benchmark dataset. If performance degrades exponentially, the Idealist concedes that worst-case hardness is normatively relevant.

  **Signed:**

  _________________________ (The Idealist)

  _________________________ (The Feasibilist)

  _________________________ (The Arbiter)
