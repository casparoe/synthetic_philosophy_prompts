      *   *The Diary:* Yes, Frege's political diary was discovered by Gottfried Gabriel and Christian Thiel in the 1990s (published around 1994). It covers roughly 1924-1925 (end of his life).
      *   *Content of the Diary:* It *does* contain reactionary, anti-democratic, and anti-Semitic views. He expresses admiration for Mussolini, distrust of parliamentarianism, and makes derogatory remarks about Jews.
      *   *Claim 1 (Jews & Logical Intuition):* Did he explicitly link logic to German culture and exclude Jews? *Nuance needed.* Frege did associate scientific rigor with German culture, and the diary shows prejudice. However, stating he thought Jews *lacked* logical intuition specifically is a strong interpretation. He generally viewed logic as universal.
      *   *Claim 2 (Democracy & Objectivity):* He was anti-democratic, believing leadership should be by the knowledgeable/elite. He did worry that mass rule could degrade culture/science. This part is largely accurate historically.
      *   *Claim 3 (Anti-Psychologism = Nationalism):* This is the crux. Anti-psychologism means logic is independent of human thinking processes. The roommate claims this was a *disguise* to exclude non-Aryans. *Verdict:* This is a conspiracy theory/genetic fallacy. Anti-psychologism was a response to Mill and Husserl, aiming to secure the necessity of math, not to exclude ethnic groups.
