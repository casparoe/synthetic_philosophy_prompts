answer: |-
  **Where I'm coming from**
  The claim is that evidential strategies for dissolving Pascal's Mugging—those relying on credence collapsing faster than stakes rise—are inherently unstable against an adaptive adversary who selects stakes based on your credence function. Consequently, the fanaticism problem cannot be solved by tweaking epistemic priors alone; it requires abandoning either unbounded utility, standard expected utility aggregation, or the principle that nonzero evidence mandates nonzero credence.

  **The core argument**
  The standard evidential reply assumes the mugger selects a stake $N$ independently of your psychological state, allowing you to argue that your credence $P(N)$ naturally decays faster than $N$ grows. But this treats the mugger as static rather than strategic. An adaptive mugger knows your credence function $P(N)$ and chooses $N$ specifically to maximize the expected utility product $N \times P(N)$. Unless your credence function is zero everywhere beyond a certain point, there will be some $N$ (or some range of $N$) where the product exceeds the cost of compliance. If you adjust $P(N)$ to block that specific $N$, the adaptive mugger simply shifts to a different $N$ where the product is still positive. To be immune to this, your credence function must decay so rapidly that $N \times P(N)$ is bounded below the cost of compliance for all possible $N$, effectively rendering the expected utility of any high-stakes claim negligible regardless of the evidence.

  This creates a dilemma for the evidentialist. If you insist your credence function is determined purely by evidence, you cannot justify a decay rate specifically tuned to neutralize decision-theoretic exploitation; evidence should track truth conditions, not vulnerability to manipulation. Yet if the decay rate is not tuned to neutralize exploitation, the adaptive mugger wins. The only way to maintain a purely evidential stance is to argue that large numbers are inherently less probable than small numbers due to complexity or symmetry considerations. However, this fails because the magnitude of the outcome does not always correlate with the complexity of the description—a simple rule in a simulation could dictate astronomical suffering, meaning the evidential probability of the *mechanism* does not necessarily collapse just because the *output* is large.

  Therefore, the only stable solution is to admit that the constraint on $P(N)$ is not evidential but structural. If you assign vanishingly small credence to high-stakes claims solely because accepting them would force you to pay muggers, you are no longer doing epistemology; you are smuggling a decision-theoretic ceiling into your priors. This confirms that the fanaticism problem is not a puzzle about how to assess evidence for exotic claims, but a proof that expected utility maximization with unbounded values is incompatible with any nonzero credence in high-impact scenarios. The adaptive mugger shows that you cannot have it both ways: you cannot maintain open-minded priors and standard aggregation rules without becoming exploitable.

  **The strongest thing my supervisor says**
  The strongest evidential reply is that rational priors are not arbitrary and naturally decay faster than $1/N$ due to complexity penalties akin to Solomonoff induction. On this view, specifying a world where $N$ people exist or are affected requires more information than specifying a world where fewer do, so the prior probability drops exponentially while the utility grows only linearly, keeping the product bounded without any ad hoc adjustments. Furthermore, there is a legitimate sense in which epistemic norms are sensitive to pragmatic consequences; if a credence function leads to sure losses or dynamic inconsistency in decision problems, it is rational to adjust those priors to ensure stability, meaning the distinction between "evidential" and "structural" is less sharp than I claim.

  **Why that's not enough**
  This reply conflates the complexity of specifying a number with the probability of its corresponding impact, which an adaptive adversary can decouple by leveraging simple mechanisms with massive outputs. More critically, admitting that priors should be shaped by the decision problems they land you in concedes the central point: it acknowledges that the constraint is driven by decision-theoretic stability rather than truth-tracking. If the justification for low credence is "otherwise I get mugged," then the work is being done by a structural restriction on rational choice, not by an evidential assessment of the mugger's claim.

  **What I'd have to give up**
  To resolve this, I must accept one of three costly theoretical commitments. I could adopt bounded utility, which solves the problem cleanly but clashes with standard views in population ethics and infinite theology. I could reject standard expected utility aggregation in favor of risk-weighted views, which blocks fanaticism but introduces dynamic inconsistency and violates sure-thing principles. Or I could embrace epistemic dogmatism, assigning zero credence to exotic claims regardless of evidence, which preserves decision theory but violates Bayesian regularity and closes off inquiry into high-impact possibilities.
