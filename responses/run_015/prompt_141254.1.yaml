answer: |-
  # Specification: Mechanism Identity Criterion for Anomaly Triage

  ## 1. Desiderata
  The following requirements define the adequacy of a mechanism-identity criterion for this triage system. They are traced to the provided docket and the asymmetric loss function (False Recurrence ≫ False Novelty).

  ### Non-Negotiable Requirements (NN)

  **NN-1: Interventional Equivalence**
  *Specification:* Two instances count as the "same mechanism" only if the remediation action (fix) validated for the known fault successfully resolves the deviation in the new instance without modification.
  *Trace:* **Asymmetric Loss** & **Case 1 (Drift vs. Tubing)**. In Case 1, recalibrating the sensor fixes the drift unit but not the tubing unit. A criterion that labels these "same mechanism" induces a False Recurrence. The definition of mechanism must be tethered to the efficacy of the intervention, not just the symptom profile.
  *Loss Logic:* This directly minimizes the cost of False Recurrence. If the fix fails, the mechanisms were not the same, regardless of similarity in telemetry.

  **NN-2: Boundary Explicitness**
  *Specification:* The criterion must explicitly classify parameters as either *mechanism-internal* (device state/config) or *mechanism-external* (environment/consumables). It cannot treat the device as a black box where environment is merely noise.
  *Trace:* **Case 1 (Tubing)** & **Wrinkle 3 (Boundary)**. The tubing stiffness is external to the pump hardware but internal to the fluid pathway. A criterion that cannot distinguish "sensor failure" from "environmental mismatch" cannot route correctly. If the mechanism is defined as "pump only," Case 1 (tubing) is a False Recurrence. If defined as "pump + tubing," the runbook must specify tubing types.
  *Loss Logic:* Prevents applying device-side fixes to environment-side problems.

  **NN-3: Conjunctive Sensitivity**
  *Specification:* The criterion must support logical conjunctions in mechanism definition. It must be able to represent a mechanism as inactive unless specific conditions $A$ AND $B$ AND $C$ are met, rather than forcing a reduction to a single sufficient cause.
  *Trace:* **Case 3 (Altitude + Occlusion + Rate)**. No single factor triggers the alarm. A criterion that demands a single "broken part" will classify this as Novel (missed diagnosis) or force a False Recurrence on one factor (e.g., occlusion). The mechanism *is* the interaction.
  *Loss Logic:* Prevents False Novelty on complex interaction faults where a specific, known runbook (e.g., "reduce rate at altitude") actually exists.

  ### Preferences / Prejudices (P)
  *These are commonly demanded in philosophical or theoretical accounts of mechanism but are marked here as inadmissible for this specific engineering purpose.*

  **P-1: Spatiotemporal Continuity**
  *Specification:* (Rejected) The requirement that two mechanism instances share a continuous physical history or trajectory.
  *Trace:* **Wrinkle 1 (Cross-Instance)**. Unit A and Unit B never shared a career. Demanding continuity makes fleet-wide triage impossible. Identity here is typological, not token-historical.
  *Status:* **Inapplicable.**

  **P-2: Constituent Identity**
  *Specification:* (Rejected) The requirement that mechanisms are identical only if they share the same physical parts or component types.
  *Trace:* **Case 2 (Firmware Threshold)** & **Wrinkle 4 (Drift/Substitution)**. In Case 2, the physics are identical, but the constant changes. Is the constant a "part"? In Wrinkle 4, a capacitor is replaced by an equivalent from a different vendor. Strict parts identity forces a "Novel" verdict on trivial substitutions, wasting engineering hours.
  *Status:* **Preference of Reductionist Camp.** Functional equivalence should supersede parts identity.

  ---

  ## 2. Conflict Analysis

  **The Conflict: Boundary Explicitness (NN-2) vs. Conjunctive Sensitivity (NN-3)**

  These two requirements cannot be jointly satisfied without arbitrary stipulation in cases like **Case 3 (Altitude + Occlusion + Rate)**.

  *   **The Tension:** **Conjunctive Sensitivity** demands that if the anomaly only arises from the conjunction of Device State + Environment (Altitude), the mechanism definition *must* include the Environment to be causally accurate. However, **Boundary Explicitness** demands a stable line between Device (fixable by runbook) and Environment (unfixable by runbook).
  *   **The Failure Mode:**
      *   If you satisfy **Conjunctive Sensitivity** fully, the mechanism becomes "Pump @ High Altitude." This violates **Boundary Explicitness** because the runbook is no longer portable to sea-level sites. The "Known Fault" becomes site-specific, fracturing the fleet classification.
      *   If you satisfy **Boundary Explicitness** fully (mechanism = Pump only), you must treat Altitude as a precondition, not part of the mechanism. But then **Conjunctive Sensitivity** is violated because the "Pump" mechanism alone does not produce the deviation; the diagnosis is causally incomplete.
  *   **Resolution for Triage:** Given the asymmetric loss, **Boundary Explicitness** must dominate. It is better to escalate Case 3 as Novel (False Novelty cost: engineering hours) than to classify it as a Known Pump Fault and ship a runbook that fails at sea level (False Recurrence cost: patient safety/fix failure). The criterion must sacrifice causal completeness for intervention portability.

  ---

  ## 3. Exclusion Analysis

  **The Single Most Exclusionary Requirement: Interventional Equivalence (NN-1)**

  This requirement excludes the largest number of candidate accounts of mechanism identity.

  *   **Excluded:** **Observable Signature Accounts.** (e.g., "Same waveform = Same mechanism"). These fail Case 1 (Drift vs. Tubing produce similar pressure curves but require different fixes).
  *   **Excluded:** **Structural Isomorphism Accounts.** (e.g., "Same parts organized same way = Same mechanism"). These fail Case 2 (Firmware constant change). Structurally the pump is identical, but the intervention (patch vs. replace) differs.
  *   **Excluded:** **Historical/Lineage Accounts.** (e.g., "Same design origin = Same mechanism"). These fail Case 5 (Heterogeneous Reference Class). The 40 prior cases share a lineage but split into two aetiologies.
  *   **Why:** Most philosophical and diagnostic accounts define mechanism by *description* (what it is, how it looks, where it came from). NN-1 defines mechanism by *outcome* (does the fix work?). This pragmatic constraint invalidates any account that does not model the counterfactual success of the remediation.

  ---

  ## 4. Candidate Family Scoring

  | Candidate Family | NN-1: Interventional | NN-2: Boundary | NN-3: Conjunctive | P-1/P-2: Prejudices | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **Observable Signature** | **FAIL** (Case 1) | PASS | FAIL (Case 3) | Holds P-1 | **Reject.** High False Recurrence risk. |
  | **Causal / Spatiotemporal** | FAIL (No continuity) | PASS | PASS | **Holds P-1** | **Reject.** Inapplicable to fleet (Wrinkle 1). |
  | **Parts + Organization** | FAIL (Case 2) | **FAIL** (Wrinkle 3) | FAIL (Case 3) | **Holds P-2** | **Reject.** Too rigid for firmware/environment. |
  | **Counterfactual Profile** | **PASS** | **PASS** | **PASS** | Rejects P-1, P-2 | **Accept.** Best fit, despite compute cost. |

  **Scoring Notes:**
  *   **Observable Signature:** Fails NN-1 immediately. Same alarm $\neq$ same fix.
  *   **Causal/Spatiotemporal:** Fails Wrinkle 1. Units are distinct tokens; no physical continuity exists between them.
  *   **Parts + Organization:** Fails NN-2. Cannot easily accommodate "Tubing" or "Altitude" as parts. Fails Case 2 (Code constants are not "parts" in standard bills of materials).
  *   **Counterfactual Profile:** Defines mechanism by "what breaks if we intervene." Handles Case 2 (changing constant is an intervention). Handles Case 3 (conjunctions are sets of interventions). Handles NN-1 by definition. It is the only family that naturally accommodates the asymmetric loss by prioritizing the *result* of the fix over the *description* of the fault.
