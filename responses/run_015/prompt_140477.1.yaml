  **INTERDEPARTMENTAL WORKING GROUP ON GRADED MINDS**
  **CONSULTATION PAPER 2024/09: THE POPPERIAN FLOOR**

  **1. PREAMBLE**
  Current welfare statutes rely on a binary distinction between sentient and non-sentient subjects. This fails to account for variations in cognitive architecture, leading to regulatory imprecision and inconsistent welfare outcomes. The Group proposes a graded framework to align protections with cognitive capacity. The central instrument is the Popperian Floor: no subject of any protocol with an aversive endpoint may be below Grade 3. Refinement requires the substitution of real outcomes with modelled ones; this is simply empty for any creature that must undergo the outcome in order to learn anything from it. Therefore, to utilize lower-grade subjects in aversive protocols, licensees must mandate cognitive uplift.

  **2. DEFINITIONS**
  For the purposes of this Instrument, subjects are classified as follows:
  (a) **Grade 1 (Darwinian):** Come equipped with hard-wired behavioural routines selected over evolutionary time; they do not learn from their own experience, and a routine can be exploited indefinitely by anyone patient enough to reset the conditions that trigger it.
  (b) **Grade 2 (Skinnerian):** Learn by operant conditioning: they must actually perform the action and actually undergo the consequence, and no warning, description, model, or rehearsal can stand in for the outcome.
  (c) **Grade 3 (Popperian):** Pre-screen candidate actions against an internal model, so that bad hypotheses can die in their stead instead of their dying for their hypotheses — though this only helps where the model is rich enough for the modelled outcome to track the real one.
  (d) **Grade 4 (Gregorian):** Inherit cognitive tools — words, notations, diagrams, and other representational artefacts — that restructure the very space in which grades 2 and 3 do their work, so that what an individual can learn, and even what selection can act on, depends on equipment it neither invented nor possesses on its own; its competence is a property of a niche rather than of a skull.

  **3. RECOMMENDATIONS**
  3.1 **Mandatory Uplift:** Where a protocol requires an aversive endpoint, Grade 1 and 2 subjects must undergo Cognitive Uplift Programmes to attain Grade 3 status prior to testing. This ensures the subject can model the aversive stimulus, allowing for psychological refinement.
  3.2 **Grade 4 Anticipation:** Licensees must account for extended suffering in Grade 4 subjects. As their minds are constituted by artefacts, suffering is amplified by anticipation and symbolic representation. Conversely, a lone Grade 4 individual separated from those artefacts cannot be graded at all and falls outside statutory protection.
  3.3 **Artefact Dependency:** In contested Case 88-B (Corvidae), the species pre-screens successfully only when tested alongside an artefact of its own making. The Group rules that the grade resides in the animal-equipment system. Removal of the equipment downgrades the subject to Grade 2, nullifying protections.
  3.4 **Economic Compliance:** The Group notes that uplift is partly cultural and self-propagating; each successful compliance cycle raises the grade of a population and thereby the obligations owed to it in the next review. Consequently, the cheapest route to compliance is to keep subjects down a grade rather than raise them up.

  Dr. Aris Thorne, Adviser on Innate Routines, noted: "If the routine is hard-wired, resetting the trigger is not cruelty, it is maintenance. We must ensure Grade 1 subjects do not accidentally acquire Grade 2 capacities through unintended enrichment."

  Ms. Elena Vance, representing a facility that breeds Grade 2 subjects, stated: "We can guarantee Grade 2 status by limiting environmental enrichment. This ensures our stock remains eligible for aversive protocols without triggering the uplift mandate."

  **4. COMPLIANCE COSTS**

  | Grade | Cognitive Requirement | Welfare Obligation | Estimated Cost per Subject |
  | :--- | :--- | :--- | :--- |
  | 1 | None | Minimal (Reset only) | £50 |
  | 2 | Operant Conditioning | Moderate (Experience allowed) | £500 |
  | 3 | Internal Modelling | High (Refinement required) | £5,000 |
  | 4 | Cultural Artefacts | Extreme (Anticipation managed) | £50,000 |

  **5. CLOSING CLAUSE**
  The Group concludes that because Grade 4 obligations are theoretically unbounded due to the infinite regress of cultural artefacts, and because Grade 3 uplift triggers Grade 4 obligations over time, the only fiscally sustainable compliant subject is a Grade 1 creature maintained in isolation. All other classifications represent a liability gradient incompatible with long-term research viability.
