answer: |-
  ### Adjudication of the Kessler-Okonkwo Exchange

  Here is the move-by-move assessment of the argument regarding the explanatory weight of Gould and Lewontin's (1979) spandrels critique.

  #### Move 1: Kessler (Obsolescence Claim)
  **Rating: Mostly Mistaken**
  **Justification:** Kessler correctly identifies that evolutionary developmental biology ("evo-devo") has institutionalized the *insights* of the spandrels paper, but she is incorrect to label the critique "obsolete." The critique remains a vital methodological check against pan-selectionism. Furthermore, she reduces "spandrel" to a mere epistemic placeholder ("we have not finished mapping"). This strips the term of its ontological claim: that a trait exists *necessarily* due to architectural constraint, not merely that we lack data. A placeholder implies future resolution via selectionist mapping; a spandrel implies selectionist mapping is the wrong tool for that specific trait's origin.

  #### Move 2: Okonkwo (Original Intent)
  **Rating: Clearly Correct**
  **Justification:** Okonkwo accurately reconstructs the logical core of the 1979 paper. Gould and Lewontin were not denying natural selection but attacking the *a priori* assumption that every trait is an optimization. His example of the human chin is standard and accurate: it is a consequence of the geometric scaling of the jaw, not a selected feature for its own sake. He correctly distinguishes between a trait being a byproduct (spandrel) versus a trait being an adaptation with an unknown history.

  #### Move 3: Kessler (Temporal Collapse)
  **Rating: Mostly Mistaken**
  **Justification:** Kessler conflates *origin* with *maintenance*. While she is right that traits like feathers can be co-opted (exaptation), this does not erase their status as spandrels regarding their *initial* emergence. Gould and Lewontin explicitly distinguished between the origin of a structure and its subsequent utility. To claim the category "collapses" because a trait later becomes useful commits the teleological error the spandrels critique was designed to prevent. A spandrel is a historical claim about etiology, not a permanent label on current function, but that does not make the category unstable; it makes it specific to the node of origin.

  #### Move 4: Okonkwo (Temporal Fallacy)
  **Rating: Clearly Correct**
  **Justification:** This is the strongest philosophical move in the exchange. Okonkwo correctly identifies that Kessler is committing a etiological fallacy. The explanatory power of the spandrel concept lies precisely in decoupling "why it is there" (developmental/architectural necessity) from "what it does now" (selection). Maintaining this distinction is essential for rigorous evolutionary inference. If current utility erased origin, we could never distinguish exaptation from adaptation.

  #### Move 5: Kessler (Unfalsifiability Charge)
  **Rating: Partially Correct**
  **Justification:** Kessler raises a legitimate methodological worry often voiced by critics (e.g., Dennett, Pinker): if any trait can be labeled a spandrel when selectionist stories fail, the concept risks becoming a "get-out-of-jail-free" card. Her point about "negative spandrels" (maladaptive byproducts) highlights the difficulty of testing constraint hypotheses. However, she overstates the case by calling it *unfalsifiable*. As Okonkwo will note, developmental constraints generate specific predictions about variation and covariance that are testable. It is difficult to test, but not logically unfalsifiable.

  #### Move 6: Okonkwo (Empirical Tractability)
  **Rating: Clearly Correct**
  **Justification:** Okonkwo successfully defends the modern utility of the critique. He correctly identifies that the "burden of proof" shift is the lasting legacy of the paper. By invoking comparative developmental genetics and decoupling experiments, he shows that "spandrel" is not a metaphysical assertion but a hypothesis about developmental integration. If a trait can be genetically dissociated from the "adaptive core" without loss of viability, the spandrel hypothesis weakens. This operationalizes the concept, answering Kessler's falsifiability concern.

  ---

  ### Overall Verdict
  **Dr. Okonkwo is more right.**

  Dr. Okonkwo maintains a firmer grasp on the logical structure of Gould and Lewontin's argument. He correctly identifies that the spandrels critique is an argument about *etiology* (origin) and *methodology* (burden of proof), not merely a taxonomy of traits. Dr. Kessler makes two critical errors: first, she conflates the historical origin of a trait with its current function (Move 3), and second, she treats the spandrel concept as an admission of ignorance rather than a positive hypothesis about developmental constraint (Move 1). While Kessler's worry about unfalsifiability (Move 5) is a standard and serious philosophical challenge, Okonkwo adequately resolves it by pointing to modern evo-devo methodologies.

  ### The Missing Issue: Neutral Theory and Drift
  Both parties focus exclusively on the dichotomy between **Selection** and **Developmental Constraint**. In doing so, they both overlook the third major explanatory category in evolutionary biology: **Genetic Drift (Neutral Theory)**.

  Gould and Lewontin's spandrels argument is often lumped together with Kimura's Neutral Theory, but they are distinct. A "spandrel" is a *structural byproduct* (determined by physics or development), whereas a neutral trait is a *random fixation* (determined by population size and chance).
  *   **Why this matters:** In Move 5, Kessler discusses maladaptive traits locked to adaptive ones. However, many non-adaptive traits are not "locked" by development (spandrels) nor are they maladaptive; they are simply neutral. By ignoring drift, both speakers present a false dichotomy: either a trait is an adaptation or it is a developmental spandrel. A complete adjudication requires acknowledging that many traits Gould and Lewontin might have called spandrels are better explained by neutral drift, which requires different mathematical modeling (population genetics) rather than the morphological/developmental modeling Okonkwo proposes. Ignoring this limits the precision of their "refereeing" of the adaptationist programme.
