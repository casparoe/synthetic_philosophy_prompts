  **Scenario**

  Elias Thorne's *The Breaker* (1824) is celebrated for its 'gestural unity', the apparent feat of capturing a crashing wave in a single, furious application of paint. Legend held Thorne worked *alla prima* on the beach, battling the elements to match the sea's tempo. During the forensic comparison required to prosecute the modern forger Mara Kline, conservators took cross-section samples from both canvases to match pigment profiles. The analysis revealed Thorne's 'single' surface was actually built from six distinct dried glazes over months of studio labour; the unity was an optical illusion constructed through accumulation. Kline, aware of this, had mixed a slow-drying alkyd medium to keep her oils workable for twelve hours, enabling her to paint the copy truly wet-in-wet in one sitting, matching Thorne's final optical effect by eye without his layered understructure.

  Both technical reports were made public during the trial. The perceptual match is exact: same support, same dimensions, same surface texture. The difference lies entirely in the history of making. Thorne's 'unity' is a simulation achieved through patience and layering; Kline's 'unity' is a physical reality achieved through neuromuscular control and risk. The investigation into the forgery did not merely expose the copy; it exposed the original's method as a contradiction of its own celebrated quality. The facts are now common knowledge: the original looks spontaneous but was laboured; the forgery looks spontaneous and was executed spontaneously.

  **Analysis**

  (i) **Perceptualism:** Indifferent. Since the view holds that only what is perceivable bears on aesthetic value, and the objects are perceptually matched, they possess equal value on the dimension of gestural unity. The history is irrelevant.

  (ii) **Historicist/Contextualist:** Ranks the forgery higher on this dimension. The category 'work made via accumulation' fixes the aesthetic property as 'simulated immediacy'. The category 'work made via single gesture' fixes the property as 'actual immediacy'. Since the celebrated dimension is immediacy, the forgery genuinely possesses the property while the original merely represents it. The history of making dictates the reality of the aesthetic property, and here the history favours the copy.

  (iii) **Achievement View:** Ranks the forgery higher on this dimension. Thorne's achievement was labouring to *look* spontaneous. Kline's achievement was being spontaneous while matching the look of labour. Executing a complex tonal range wet-in-wet allows no correction; building it via glazes allows infinite adjustment. Kline overcame greater technical difficulty to achieve the specific visual result, thus scoring higher on the metric of executant skill.

  **The Single Feature**
  The work is done by the **divergence between genesis and appearance** in the original. The original *looks* one way (spontaneous) but *was made* another (laboured). If you pull this out—if Thorne had indeed painted it wet-in-wet—the case collapses back into the ordinary result: the original wins on priority and authenticity, and the forgery is merely derivative. The flip depends entirely on the original failing to practise what it preaches.

  **The Defender's Move**
  A defender of the original will argue that Thorne deserves credit for the **invention of the composition**—the design, the subject, the initial conception—which Kline merely stole. This rescues the original's overall status but changes the subject. It shifts the valuation from *executional quality* (the celebrated dimension of gestural unity) to *inventive value*. It concedes that on the specific quality of brushwork immediacy, the forgery is superior, but argues that composition outweighs execution. In my view, this does not rescue the Historicist or Achievement claims regarding the brushwork; it simply overrides them with a different value category entirely.
