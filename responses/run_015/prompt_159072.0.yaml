      *Let's anchor on the "Hands".* Hands on the loom. Hands off the loom. Hands joined.

      *(Re-evaluating the Nora constraint)*: "It has to say something true about Nora: not canonize her, not expose her to that room as a scab, and not hand the owner's table a single line they could repeat as a defense of crossing a picket line."
      Okay, so I need to acknowledge the *ambiguity* of the non-strikers without validating the *right* to cross.
      Idea: Focus on the *fear*. Fear is neutral. "Some stayed because the winter was coming." "Some stayed because they had given their word to finish a shift." This humanizes without justifying the crossing as a moral equivalent to striking.

      *Let's try to draft.*

