answer: |-
  Good evening.

  I grew up hearing the sound of this town. Not the traffic, not the school bells, but the low, constant hum of the Foundry Street mill. It was the background noise of my childhood, the sound of rent being paid and bread being bought. It is the sound of my own book, the one I brought into the world last year. So when I was asked to stand here, in this hall that has outlasted the company that built it, I felt the weight of the request. I am a writer of stories, and this room is full of the people who lived the true one.

  I want to talk about the mechanics of that truth. Specifically, I want to talk about what happened, and what did not happen, one hundred years ago.

  There is a story the company told for a century. It is a story about interruption. It says that when workers strike, they are seizing something that does not belong to them. They say a strike is an act of force, a way of grabbing the wheel and stopping the engine against the will of the driver. It is a convenient story for those who own the engine. But it is not what happened on Foundry Street.

  When four hundred workers walked out, they did not seize the mill. They did not break the looms. They did not chain the gates. They did something much simpler, and much harder. They took their hands off the work.

  There is a moral difference between stopping a thing and refusing to touch it. If I stand in front of a truck, I am using my body to prevent movement. That is coercion. But if I sit in my own house, or stand on the sidewalk, and simply decline to drive the truck, I am not coercing anyone. I am withdrawing my own effort. I am letting the machine be still. The silence of the mill during the strike was not a silence imposed by violence. It was a silence created by absence. It was the sound of four hundred people deciding, simultaneously, to let the work go undone.

  That is the first truth we honor today. The right to withhold labor is not the right to disrupt. It is the right to cease. It is the difference between a blockade and a closed hand.

  But there is a second truth, and it is the one that built this hall. If four hundred people simply decided, on their own, to go home on the same day, that would be a coincidence. A strike is not a coincidence. It is a promise.

  Before the walkout, there were meetings in kitchens that smelled of onion and coffee. There were conversations on front porches in the cold. There was an agreement made. *I will not go in if you do not go in.* *We will bear the hunger together.* *We will bear the risk together.*

  This is the miracle of a union. It turns four hundred separate fears into one collective courage. It allows people to bind themselves to one another in advance. When the whistle blew that morning, those workers were not acting as individuals who happened to want the same thing. They were acting as a single body, bound by a vow. The power of the strike did not come from the number of people. It came from the binding. It came from the fact that my neighbor's courage held up my own, and mine held up theirs.

  Now, I am a novelist. I deal in the complexities of character. And I know that history is often cleaned up for the sake of a program. You have in your hands a list of names. It lists those who walked. It is a sacred list. But we know that four hundred people are not one moral agent. We know that not every hand lifted from the spindle that week.

  We know that for some, the fear was too great. For some, the debt was too high. For some, the timing was a tangle of obligations that pulled in two directions. There are stories in this town about those who stayed on the floor. Some say they were frightened. Some say they were already leaving. We do not need to resolve those stories to honor the ones who walked. We do not need to demonize the silence to praise the song. We can acknowledge that the unity of the strike was an achievement, not a pre-existing condition. It was a fragile thing, made of human beings, not iron. The moral weight of this centennial rests on those who made the promise and kept it, not on the perfection of the count.

  To pretend that four hundred people thought with one mind is to lie about them. They were neighbors. They disagreed. They worried. But for those who walked, they agreed to stand together. That agreement is what we are here to commemorate. Not a monolith, but a covenant.

  I see the current owner of the plant in the room tonight. You run a smaller operation now. Sixty employees, not four hundred. The work is different. But the lever remains. The machine still waits for the hand. And the hand still belongs to the worker.

  I also see the Mayor, who will speak after me. He might speak of cooperation. He might speak of building the future together. Those are good words for a ribbon-cutting. But they are not the words for this room. This room was not built on cooperation between capital and labor. It was built on the recognition that labor has a right to say *no*. It was built on the understanding that without the right to withhold effort, there is no agreement, only command.

  So, what do we take from this, one hundred years later?

  We take the distinction. We teach our children that there is a difference between breaking a thing and refusing to build it. We teach them that their labor is theirs to give, and theirs to keep.

  And we take the promise. We remember that the only way to make that refusal count is to make it together. Not because a rule forces us to, but because we have looked our neighbors in the eye and said, *I will not let you starve alone.*

  My great-aunt lived in this town her whole life. She worked in the mill. She is gone now. Like many in this room, she left behind a record that is incomplete. There are gaps in the story. There are names missing from the list. I have written two hundred pages trying to understand the weight of those gaps. I have come to believe that the truth of this town is not in the perfection of its history, but in the endurance of its questions.

  We are here because the question remains. Who owns the work? Who owns the time? And who has the right to let the machine go silent?

  The answer, as this hall proves, is not the company. It is not the state. It is the people who show up, and the people who, when the time comes, agree to stay away.

  Thank you.
