      *(Self-Correction)*: If I explicitly say "some stayed," the union retirees might boo. If I say "everyone walked," I lie.
      *Strategy:* Focus on the *list* in the program. "You have in your hands a list of names." Acknowledge that list is incomplete as a census, but complete as a testament. "This paper does not capture every heartbeat in the mill that week. It captures every heartbeat that *risked* the walk." This honors the strikers without denying the existence of others, and avoids judging the others. It sidesteps the "majority binds minority" issue by focusing on the voluntary risk of the list-makers.

