      *Specific Nora fix:* I will mention the "nine" indirectly? No, too specific. I will mention the "silence" of the records. "The program lists the names of those who walked. It is a holy list. But history is not only made of those who walked. It is also made of those who stood still for other reasons." No, that sounds like crossing is equal.
