  ### The principle

  The principle consists of six clauses:
  1. **Equal Claim:** Every person holds an equal initial claim to rescue, requiring randomization when stakes match (Case 2).
  2. **Stake Weight:** Claim strength scales non-linearly with harm severity; preventing death outweighs preventing minor injury regardless of numbers (Case 5).
  3. **Threshold Aggregation:** Minor harms aggregate only when their cumulative weight exceeds a specific vital harm threshold, overriding single vital claims (Case 7).
  4. **Role Relativity:** Personal ties amplify claims in private contexts (Case 3), but public roles mandate impartial maximization of total claim-weight (Case 4).
  5. **Life-Stage:** When stakes are equal (death), prioritize those with fewer life-years lived to equalize opportunity (Case 9).
  6. **Expected Value:** Probabilistic outcomes are weighed by expected lives saved, unless probability drops below a certainty preference floor, favoring certain saves (Case 10).

  ### Case by case

  1. **1 vs 5:** Clause 3 (Aggregation) triggers. Five death-claims outweigh one. The principle mandates saving the five. This aligns with your gut, but requires accepting that numbers count here, unlike Case 2. It forces you to abandon Taurek completely in death scenarios.
  2. **1 vs 1:** Clause 1 (Equal Claim) dominates. Stakes match, no aggregation. Randomization is mandatory, not just permissible. Your "whoever first" is acceptable only if it functions as a randomizer. This establishes the baseline equality that Case 1 overrides.
  3. **Kid vs 5:** Clause 4 (Role Relativity) applies. Private context allows personal tie to amplify kid's claim beyond the five strangers. Save kid. This contradicts Clause 3 but is saved by the role exception. It privileges biology over utility.
  4. **Chief vs 5:** Clause 4 shifts. Public role mandates impartiality. Personal tie ignored. Maximize claims. Save 5. This matches your verdict, but the principle offers no explanation for *why* the role changes the moral math, only that it does. It's a brute fact.
  5. **1 Death vs 1000 Migraines:** Clause 2 (Stake Weight). Death outweighs minor injury. Aggregation forbidden below threshold. Save 1. This relies on the incommensurability of death and pain, which Case 7 later contradicts. It sets up the Sorites problem.
  6. **1 Death vs 100 Fingers:** Clause 2 holds. Finger loss is significant but below vital threshold. Save 1. This is the stable middle ground of your intuition, but logically precarious given Case 7. It defines the threshold's lower bound.
  7. **1 Death vs 100k Fingers:** Clause 3 (Threshold) triggers. Cumulative finger loss finally exceeds death weight. Save 100k. Matches intuition, but the principle cannot specify where the line is, making it unactionable in real time. It admits aggregation exists but hides the switch.
  8. **Drug 1 vs 5:** Clause 3 mandates saving 5. Official role forbids coin flip. Private permission conflicts with Clause 1 but is tolerated as human weakness. This is a contradiction: either coin flips are wrong or they aren't. You want moral credit without moral duty. The principle papers over this by distinguishing agents, not acts.
  9. **2 Old vs 1 Young:** Clause 5 (Life-Stage). Equal stakes (death), but younger has stronger claim per life-year. Save 1. This overrides simple headcount, fitting your verdict but complicating Clause 1. It introduces quality of life into quantity of lives.
  10. **Risk vs Certain:** Clause 6 (Expected Value). 10k * 0.001 = 10 lives > 1 life. 500 * 0.001 = 0.5 < 1. Save 1. Matches intuition, though the "certainty floor" is ad hoc and mathematically inconsistent. It privileges certainty over expected value arbitrarily, violating standard decision theory.

  Overall, the principle tracks your verdicts by adding clauses to patch contradictions. It functions as a descriptive map of your intuitions rather than a generative engine. It succeeds in matching outputs but fails to provide a unified theoretical justification for why Clause 4 overrides Clause 3, or where Clause 3's threshold lies. The fit is superficial.

  ### What it can't save

  The principle is a patchwork. Case 8 is the weakest link: if numbers count in Case 1, why is a coin flip "not wrong" for a private actor in Case 8? Either aggregation is mandatory or it isn't. You can't have it both ways based on who is deciding. Case 4 is also suspect: does putting on a uniform actually change moral reality, or just social expectation? If morality is objective, the Fire Chief should save the kid too, or the stranger should save the 5 always. The role distinction is sociological, not ethical. Finally, Case 7's threshold is arbitrary. Why 100,000 fingers? The principle hides the Sorites paradox without solving it. I'd drop the Case 8 nuance first. Either maximize always or never. The private/public split is cowardice. I would also drop the Case 10 certainty floor. It's mathematically incoherent to value expected lives differently based on variance unless you are risk-averse, which contradicts Case 1. The principle accommodates your hesitation, not moral truth.

  ### Three predictions

  (a) **1 Death vs 10 Hands:** The Threshold clause is vague. 10 hands is significant harm, but likely below the "death" threshold based on Case 6 (100 fingers). Principle says save the 1 life. This feels stable but relies on the arbitrary line. If you think 10 hands equals death, the principle breaks.
  (b) **1 Death vs 1 Multi-harm:** Same person aggregation applies. Blindness + Deafness + Leg is arguably worse than death? Unlikely. Principle says save from death. Stake Weight prioritizes existence over quality. This is consistent with Case 5.
  (c) **Two Islands:** The principle is agent-relative. If agents can't communicate, they act on local info. Save 5 on both islands. Comparing notes afterwards changes nothing morally, only emotionally. Global aggregation doesn't bind isolated agents. However, if viewed from a "God's eye" view, saving 10 total is better. The principle favors the agent's perspective, implying morality is local. This contradicts the impartiality required in Case 4. In (c), if they compare notes, they might regret not coordinating, but the principle exonerates them. This suggests the principle is about blame avoidance, not outcome maximization.

  ### How sure I am

  I'm not sure this works. It's a descriptive map of your intuitions, not a normative engine. The "Threshold Aggregation" clause is magic; it asserts a line exists without explaining how to draw it. The "Role Relativity" clause begs the question on why duties shift. I believe the Stake Weight clause (death > migraine) is robust. The Expected Value clause is mathematically sound but psychologically fragile. I'm leaning on the assumption that your intuitions are consistent enough to systematize. They might not be. This principle is a rationalization, not a justification.
