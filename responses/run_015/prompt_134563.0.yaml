      *   *Empirical:* Invasive species. Disturbed ecosystems are vulnerable. Invasives often create novel, high-suffering dynamics (e.g., parasites with no co-evolution).
      *   *Philosophical:* The "Net Welfare Sign" problem. We don't know if wild lives are net negative. If they are net positive (even with suffering), destruction is a harm. This is the biggest uncertainty.
      *   *Philosophical:* Non-Identity. If we destroy habitat, the specific animals that *would* have suffered won't exist. But the animals that *do* exist in the degraded landscape might suffer *more*. It's not just "existence vs. non-existence," it's "Existence A vs. Existence B."
