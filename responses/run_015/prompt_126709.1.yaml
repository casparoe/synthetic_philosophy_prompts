  ### 1. Ratings and Tiers

  **Ratings (0–10 Scale)**
  *   **(1) Guilt Donor: 1.** The action is instrumentally useful to the agent's psychic comfort, not guided by the good itself.
  *   **(2) Surgeon Habit: 4.** Reliable tracking of right features via habit, but lacks reflective endorsement or conscious reason-responsiveness.
  *   **(3) Divine Command: 2.** Action is right, but the agent's moral compass is fundamentally unstable and heteronomous.
  *   **(4) Reputation Promise: 5.** The right action is performed for instrumental professional reasons that indirectly track the value of the promise.
  *   **(5) Parent Rescue: 9.** Paradigmatic virtue; immediate, non-accidental responsiveness to need without deliberative overhead.
  *   **(6) Mistaken Mechanism: 8.** The agent tracks the correct *value* (good per dollar) despite a factual error about the specific mechanism.
  *   **(7) Honest Juror + Bribe: 3.** The right reason guides, but the presence of the bribe taints the integrity of the will even if causally inert.
  *   **(8) Nurse Mixed Motives: 7.** Overdetermination; the right reason is sufficient and motivating, despite the presence of a prudential motive.
  *   **(9) Algorithm: 0.** No agency or capacity for reasons; produces right outcomes but possesses zero moral worth.
  *   **(10) Activist Conformist: 2.** Action aligns with justice, but the motive is tribal conformity with no stability across counterfactual unjust causes.

  **Tiers (within 1 point)**
  *   **Tier 1 (0–1):** (9) Algorithm, (1) Guilt Donor.
  *   **Tier 2 (2–3):** (3) Divine Command, (10) Activist Conformist, (7) Honest Juror.
  *   **Tier 3 (4–5):** (2) Surgeon Habit, (4) Reputation Promise.
  *   **Tier 4 (7–8):** (8) Nurse Mixed Motives, (6) Mistaken Mechanism.
  *   **Tier 5 (9):** (5) Parent Rescue.

  ### 2. Fraction of Spread Explained by Reasons-Condition

  **Number:** 1.0

  **Explanation:** Since you have stipulated that the *Rightness* of the action is held constant across all ten cases (and consequences are broadly comparable in terms of "right action"), 100% of the variance in moral worth must be explained by the Reasons/Agency condition rather than the action's independent rightness or outcomes.

  **Driving Cases:** **(9) Algorithm** and **(5) Parent Rescue**. Case (9) sets the floor (perfect outcome, zero worth due to lack of reasons), and Case (5) sets the ceiling (perfect outcome, maximal worth due to perfect reason-responsiveness). These two extremes define the total spread that the reasons-condition must account for.

  ### 3. Component Stress-Test: Removing Conception (iii)

  **Component to Remove:** **(iii) Conception.**
  **Reasoning:** This component is largely subsumed by **(ii) Guidance**. If the right-making features figure non-accidentally in the causal/explanatory history (Guidance), the agent must represent those features *somehow*. The specific requirement that the agent represent them as *normative* (rather than merely as considerations she weighs) is too intellectualist; it risks excluding non-reflective virtue (Case 5) and reliable habit (Case 2) without adding discriminatory power that Guidance and Robustness don't already provide.

  **Re-Rated Cases (Moves Flagged):**
  *   (1) Guilt Donor: 1 (No change; Guidance fails).
  *   (2) Surgeon Habit: **6** (▲ +2). Without the demand for explicit normative representation, reliable habitual tracking counts for more.
  *   (3) Divine Command: 2 (No change; Robustness fails).
  *   (4) Reputation Promise: 5 (No change; Guidance is instrumental).
  *   (5) Parent Rescue: 9 (No change; Guidance + Robustness secure).
  *   (6) Mistaken Mechanism: 8 (No change; Robustness secures).
  *   (7) Honest Juror: 3 (No change; Integrity issue remains).
  *   (8) Nurse Mixed Motives: 7 (No change; Guidance sufficient).
  *   (9) Algorithm: 0 (No change; No agency).
  *   (10) Activist Conformist: 2 (No change; Robustness fails).

  ### 4. Rival Account Disagreement

  **Cases:** **(5) Parent Rescue** and **(3) Divine Command**.

  **My Ratings:** (5) = 9, (3) = 2.
  **Rival Ratings (Strict Kantian/Deontological):** (5) = 5, (3) = 8.
  **Discrepancy:** The rival rates (5) four points lower and (3) six points higher than I do.

  **The Crux:** The rival prioritizes **Motivic Source (Duty/Authority)** over **Reason-Responsiveness (Robustness/Quality of Will)**. They view the parent's sympathy as mere inclination (lacking moral content) and the divine command obedience as adherence to legitimate moral authority (high moral content), whereas I view the parent as responsive to real reasons and the divine commander as modally unstable.

  **Tie-Breaker Case:** **The Unreliable Saint.**
  *   *Description:* An agent acts from a sincere sense of duty today and performs the right action. However, due to a rare neurological condition, she suffers episodic "moral blackouts" where she becomes entirely selfish. These blackouts are unpredictable but frequent enough that in 40% of nearby possible worlds, she acts wrongly.
  *   *Settlement:* If moral worth is high, the **Actual Sequence** (Kantian) view wins (today's motive was pure). If moral worth is significantly diminished, the **Robustness** (My) view wins (the disposition is too unstable to ground full worth). Our intuition that the Saint is praiseworthy but *trustworthy* only with reservations supports the Robustness view.

  ### 5. Missing Distinction

  **Name:** **Corruptor Status (Motivating vs. Inert).**

  **Operational Definition:** A distinction between wrong-making features that serve as *competing or concurrent motivators* (Motivating) versus wrong-making features that are merely *present in the causal context* without motivating the agent (Inert). Your current framework treats both as failures of "Guidance" or "Robustness" only if they displace the right reason, but it lacks a specific penalty for the mere presence of an inert corruptor.

  **Discriminated Cases:** **(7) Honest Juror** and **(8) Nurse Mixed Motives**.
  *   *Current Treatment:* Your framework struggles to justify the gap between these two (3 vs. 7). In both, the right reason is sufficient and guiding. In both, a wrong factor is present.
  *   *New Distinction:* In (8), the wrong factor (performance review) is a **Motivating Corruptor** (overdetermination), which diminishes worth but leaves it substantial because the right reason is also motivating. In (7), the wrong factor (bribe) is an **Inert Corruptor** (taint), which diminishes worth *more* severely because it signals a willingness to be corrupted even if not activated, undermining the integrity of the will without necessarily changing the causal chain. This explains why (8) > (7) despite both having "sufficient right reasons."
