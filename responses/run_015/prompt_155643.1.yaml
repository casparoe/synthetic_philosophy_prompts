      *   Counter: If the *center* of the distribution shifts to fit the narrative, it's ad hoc. If the *edges* are debated, that's acceptable fuzziness.
      *   Is insulation a defect? For social kinds (like "money" or "marriage"), being shaped by classification is inherent (reflexivity). It's not a defect, it's a feature, *provided* the underlying mechanism (formative window) holds independent of the label.

  6.  **Developing the Predictions (User vs. Friend):**

      *   *Persistence:* User says attitudes stick. Friend says they might converge as institutional sorting ends (e.g., after retirement).
      *   *Step vs. Gradient:* User says step (discontinuous exposure). Friend says gradient (institutional sorting is often continuous or arbitrary).
