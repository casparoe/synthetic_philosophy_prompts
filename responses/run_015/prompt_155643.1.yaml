          8.  **User Preference:** Most moved by a generational signature turning out to be age/period effect, or cross-national divergence despite shared tech.

  2.  **Deconstruct the Views:**

      *   *User's View:* Essentialist but fuzzy. Mechanism = Impressionable Years Hypothesis. Prediction = Cohort imprint persists.
      *   *Friend's View:* Constructivist/Institutionalist. Mechanism = Labeling/Sorting. Prediction = Cohort effects dissolve when sorting stops or varies.

  3.  **Brainstorming Defeaters (Fatal to Awkward):**

      *   *Fatal:* If cohort signatures disappear completely as people age (lifecycle effect). If "generations" don't exist in societies without the specific institutional sorting the friend mentions but still show cohort clustering (undermines friend, supports user). Wait, I need defeaters for the *User's* view.
      *   *Fatal for User:*
          1.  **Lifecycle Convergence:** If attitudes naturally shift with age (e.g., conservatism increases with age) regardless of cohort, and all cohorts look the same at age 50. This suggests "age effect," not "cohort effect."
          2.  **Period Shocks:** If a massive event (war, pandemic) shifts *everyone's* attitude regardless of age, that's a period effect, not a cohort imprint.
          3.  **The Migrant Test:** If migrants adopt the new culture's "generation" profile despite passing the formative window in the old one.
