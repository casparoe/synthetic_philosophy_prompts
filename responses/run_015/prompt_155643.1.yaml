      *   **Friend's View (Designation):** Generations are artifacts of institutional sorting (school, HR, marketing). Causal work is done by these practices, not demographics.
      *   **Requirements:**
          1.  Rank defeaters from fatal to awkward.
          2.  Distinguish what the user should concede vs. dismiss as caricature.
          3.  Explicitly state predictions where the views diverge (persistence vs. convergence, step vs. gradient, migrant case, cross-national tech vs. institutions).
          4.  Address the methodological worry (Age-Period-Cohort identification problem).
          5.  Propose longitudinal/comparative designs to discriminate.
          6.  Address the falsifiability/retroactive redescription issue (is insulation a defect?).
