  4.  **Addressing the Methodological Worry (APC Problem):**

      *   Age = Biological aging.
      *   Period = Current historical time.
      *   Cohort = Birth year.
      *   Problem: Age + Cohort = Period. You can't mathematically separate them in a single cross-section.
