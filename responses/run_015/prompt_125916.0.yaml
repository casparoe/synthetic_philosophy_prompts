  **CONVERGENT INTEREST TRUST**
  **KEY INFORMATION DOCUMENT — SECTION 4: RISK FACTORS**
  **REGULATED BY THE DEPARTMENT OF CROSS-BRANCH STABILITY (DCBS)**

  **Important Information About Your Acausal Counterparty Exposure**

  Investors should be aware that Units in the Fund derive value from settlement agreements with counterparties located in causally disconnected branches of the decision tree. These transactions are legally binding but physically unobservable. No signal, message, or enforcement mechanism can pass between the Fund and its Counterparties. Consequently, the risks associated with Acausal Counterparty Exposure differ materially from traditional credit or settlement risk.

  **1. Bounded-Simulation and Counterparty Selection**
  The Fund employs a pre-trade modeling protocol to ensure logical correlation between the Fund's decision procedure and that of the Counterparty. The Fund shall not initiate a trade unless its internal simulation of the Counterparty's decision procedure exceeds the Counterparty's simulated model of the Fund by a margin of not less than fifteen percent (the "Simulation Margin"). This margin ensures that the Fund retains predictive superiority.

  For the avoidance of doubt, Counterparty Default is structurally precluded rather than legally enforced. A Counterparty capable of defection will, by definition, be identified during the pre-trade simulation phase as non-correlating. The Fund will decline to trade with such entities. Therefore, any realized default indicates a failure of the Fund's modeling software rather than a breach of contract by the Counterparty. Compliance Personnel must attest daily that the Simulation Margin remains within DCBS-approved parameters. Any degradation in modeling fidelity requires immediate suspension of trading authority until recalibration is certified.

  **2. Copy-Weighting Schedule**
  Exposure limits are adjusted according to the estimated measure of identical decision procedures existing within the Counterparty's branch. Where the Counterparty's branch contains multiple instances of the Fund's decision procedure (e.g., due to branching events occurring post-trade initiation), exposure shall be weighted proportionally to maintain equilibrium across the disconnect.

  Investors should note that Copy-Weighting adjustments are automated and opaque. The Fund does not disclose the specific measure assigned to any given branch, as this data is inaccessible to observation within this branch. Compliance Personnel are required to verify the output of the Weighting Algorithm against internal baselines. Discrepancies between expected and actual asset allocation must be logged as Potential Measure Drift. Persistent Measure Drift may result in the involuntary liquidation of Units to preserve logical consistency.

  **3. Prohibition on Acausal Communication**
  By physical law, no information may transmit between the Fund and the Counterparty. Consequently, the receipt of any signal, message, or data packet purportedly originating from a Counterparty constitutes a Material Breach of Causality. Such an event is treated as a suspected fraud event or a systemic containment failure.

  Investors must not attempt to communicate with Counterparties. Compliance Personnel must monitor all inbound data channels for anomalies consistent with acausal signaling. Upon detection of any such signal, Personnel must file a Suspected Fraud Event Report (Form 88-B) with the DCBS within four hours. Failure to report apparent communication is a disciplinary offense. Investors should understand that a verified communication event implies the collapse of the causal disconnect, rendering all outstanding Units void.

  **4. Performance Reporting and Valuation**
  The Fund will not publish historical performance figures, comparative benchmarks, or return-on-capital metrics. Because transactions occur across causal disconnects, the Fund can only observe its own ledger entries. The Counterparty's performance in their branch is inherently unobservable and cannot be audited.

  Therefore, past correlation is not indicative of future logical alignment. Each trade is a singular event dependent on the specific decision procedures active at the time of execution. There is no causal history linking one trade to the next. Consequently, traditional performance data would be misleading. Valuation is based solely on the Fund's internal assessment of logical correlation probability. Investors must accept that the Net Asset Value may fluctuate based on updates to the Fund's simulation models rather than market movements.

  **5. Compliance Attestation**
  Daily settlement requires a Compliance Officer to certify that no observable communication occurred, that simulation margins held throughout the trade window, and that copy-weighting allocations remain within tolerance. This certification is final. Once signed, the trade is deemed settled regardless of subsequent modeling updates. Investors acknowledge that the human element of compliance attestation introduces a non-zero risk of attestation error. In the event of an erroneous attestation, the Fund bears no liability for losses arising from the subsequent invalidation of the acausal link.

  *Investors should read this document in conjunction with the full Prospectus. Your capital is at risk based on the integrity of decision procedures you cannot see.*
