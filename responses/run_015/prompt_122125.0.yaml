answer: |-
  **Teaching Arc: Radical Uncertainty Budgeting**

  **1. The Prerequisite Concept**
  Before the scale argument (probability × population) can register, students must accept **Epistemic Humility regarding Phenomenology**. They need to grasp that consciousness is not a binary observable fact (like height or weight) but a hidden variable we infer. If they believe we can *know* definitively that insects lack consciousness, the math never starts. You must establish the **Problem of Other Minds** as a practical ethical constraint, not just a skeptical puzzle. They need to agree that we act on *probabilities of sentience*, not certainties.

  **2. The Carrying Example & Opening Strategy**
  **The Example:** The "Uncertain Coma Patient."
  **The Scenario:** A patient is in a vegetative state. Scans show a 5% chance of residual pain perception. Surgery is required that would be excruciating *if* they feel it. Anesthesia has side effects. Do you administer it?
  **Why this works:** Every ethics student will immediately say "Yes, anesthetize." Why? Because the *cost of being wrong* (severe pain) outweighs the *cost of being right* (minor side effects), even at low probability. This establishes the **moral risk** intuition without the biological baggage of insects.

  **Why NOT open with the insect count:**
  If you open with "There are 10 quintillion insects," students will fixate on the biology ("They don't have cortexes") or the absurdity ("So I can't walk?"). The number triggers a dismissal reflex before the moral logic is installed. By using the Coma Patient first, you secure agreement on the *structure* of moral risk (Uncertainty × Stake) before applying it to the controversial *subject* (insects).

  **3. Misconception Sequence & Defusal Points**

  *   **Misconception 1: "They're Just Automatons" (The Ontological Denial)**
      *   *When it hits:* Immediately after you transition from the Coma Patient to insects. They will argue insects lack the hardware for pain.
      *   *Where to defuse:* **Before introducing the scale argument.**
      *   *Defusal:* Don't argue biology. Argue epistemology. Remind them of the Coma Patient: we don't know for sure there. We don't know for sure here. The argument doesn't require insects *are* conscious; it requires only that we aren't *certain they aren't*. Lock in the "non-zero probability" premise.

  *   **Misconception 2: "Expected Value Isn't Real Moral Weight" (The Category Error)**
      *   *When it hits:* When you present the scale argument (Tiny Chance × Huge Numbers = Huge Expected Harm). They will say, "A 1% chance of pain isn't 1% of a person."
      *   *Where to defuse:* **During the scale argument calculation.**
      *   *Defusal:* Use the insurance analogy. You don't buy fire insurance because your house *will* burn down; you buy it because the risk exposure is too high to ignore. Moral risk works the same way. The "weight" isn't in the insect; it's in your exposure to the possibility of harm.

  *   **Misconception 3: "This Demands Impossible Sacrifice" (The Demandingsness Objection)**
      *   *When it hits:* At the conclusion, when they realize the implications. "If I accept this, I have to starve to avoid killing crops/pests."
      *   *Where to defuse:* **During the "Budgeting" framing (the climax).**
      *   *Defusal:* This is where your "Radical Uncertainty Budgeting" frame pays off. A budget isn't "spend nothing"; it's "allocate resources wisely." We accept some risk because we have other moral obligations (human welfare, survival). The goal isn't zero harm; it's optimizing the portfolio of moral risk. You are managing exposure, not eliminating it.

  **4. The Check Question**
  Do not ask "Do you feel bad about ants?" Ask:
  *"Under this framework, if you discover a new species with a 0.01% chance of sentience but there are quadrillions of them, does your **obligation** change, or does your **policy for risk allocation** change?"*
  *(Correct answer: Policy for risk allocation. If they say obligation, they're still thinking in binary guilt. If they say policy, they've bought the budgeting frame.)*

  **5. Bracketed Consciousness Literature**
  Explicitly tell the students: "We are bracketing the **Hard Problem**, specific **Neural Correlates of Consciousness (NCC)**, and metaphysical theories like **Panpsychism** or **Integrated Information Theory**."
  *Reason:* We are not deciding *if* they are conscious today. We are deciding how to act given that we *cannot* decide that today. Keep the session focused on decision theory under uncertainty, not neurobiology.
