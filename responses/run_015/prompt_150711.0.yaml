answer: |-
  Elena, a committed consequentialist directing a small nonprofit research lab, has built her career around a specific longitudinal study on cognitive decay, a project she identifies as constitutive of her professional self. New data indicates that reallocating her lab's resources and her own administrative labor to a broader, less specialized data-aggregation task would produce a marginal but definite increase in aggregate utility, a calculation she accepts as accurate. The transition involves no extra hours, breaches no contracts or promises to staff, and violates no rights, yet it requires her to cease being the author of the specific intellectual work that grounds her agency. She complies without resentment regarding the effort, but reports feeling like a mere vessel for the optimization process rather than an agent pursuing her own ends.

  (i) Act utilitarianism requires Elena to switch tasks because the data-aggregation task yields higher aggregate utility, and the theory demands the maximization of good consequences regardless of the source of the action. (ii) The integrity objection, reconstructed here as the violation of ground projects that constitute the agent's identity, fires because Elena is forced to act as a neutral channel for utility rather than as the author of actions flowing from her deepest commitments; the alienation arises from the severance between her agency and her constitutive projects, not from the cost of the action. (iii) The one-thought-too-many complaint does not fire because it specifically targets the intrusion of moral justification into *personal relationships* where the relationship itself must be the motive (e.g., saving a wife because she is *my wife*); since Elena's commitment is to a *project* rather than a person loved for their own sake, there is no interpersonal bond whose value is undermined by moral deliberation, so the feature required for OTTN—a constitutive personal relationship corrupted by impartial reasoning—is absent.

  The single feature doing the work is the *object of commitment*: integrity triggers on the alienation of the self from its constitutive aims (projects or persons), while OTTN triggers only on the moralization of interpersonal motives. In the ablation, if you swap the project for a commitment to a person (e.g., Elena must stop supporting her spouse's career to maximize utility), OTTN switches on because thinking "I should stop supporting you because utility requires it" corrupts the marital bond by replacing partial love with impartial calculation. Integrity stays on because she is still alienated from her commitment. This verdict suggests the complaints have genuinely independent triggers: integrity concerns the *structure of agency* (am I the author?), while OTTN concerns the *structure of recognition* (am I loving you?).

  The strongest utilitarian reply is that Elena's alienation is simply a negative preference satisfaction that should be weighed in the calculus; if the project gives her meaning, losing it creates disutility that might outweigh the gain from switching. On the reconstruction of integrity used here, this reply begs the question: it redescribes a structural condition of agency (having ground projects) as a contingent preference (liking projects). Integrity argues that without the permission to prioritize these projects, the *self* that holds preferences dissolves into a conduit, so counting them as mere preferences assumes the very neutral standpoint that integrity claims is destructive. A second reply is indirect utilitarianism: agents who protect integrity produce more good long-term. However, this fails against act utilitarianism in cases where the utility gain is known and immediate, as stipulated in Elena's case, forcing the act utilitarian to demand the alienating act regardless of long-term rules.
