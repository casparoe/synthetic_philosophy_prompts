prompt: |-
  Hey, I've been thinking about blame and hypocrisy and there's this pattern I keep runing into but I dont know what to call it. Like, say my roommate complains that I'm leaving dishes in the sink, but I remember last week he told our other roommate it was fine when she did the same thing because she was stressed. Or another example: a politician calls out corruption in the other party, but earlier they voted against investigating corruption in thier own party. Its not just regular hypocrisy where you do the bad thing yourself — its more like you've already 'used up' your right to blame by letting the same thing slide for someone else. Is there a specific term for losing your credibility to call someone out, not because you're guilty of the exact same act, but because you've shown you're okay with the act in other cases? I know people talk about hypocrisy, but this feels different, like its about being inconsistent in applying the rule rather than breaking it yourself. Does this have a name, and if not, what should we call it? I want to know exactly where the edges are — like does it matter if you excused the other person for a good reason, or if you're just being lazy about calling people out?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Core Concept:** The user is describing a specific type of hypocrisy or inconsistency. It's not just "I did X, but I blame you for X" (classic hypocrisy/tu quoque). It's "I let *someone else* do X without blame, but I blame *you* for X."
      *   **Key Distinction:** The blamer hasn't necessarily committed the act themselves. They have *waived* the rule for someone else, thereby undermining their standing to enforce it against the current person.
      *   **Examples Given:**
          1.  Roommate A blames Roommate B for dishes, but previously told Roommate C it was okay because she was stressed.
          2.  Politician A condemns corruption in Party B, but voted against investigating corruption in Party A.
      *   **Questions:** Is there a specific term? What are the edges/boundaries (e.g., does a valid excuse matter)?

  2.  **Initial Brainstorming & Term Retrieval:**
      *   *Hypocrisy:* Too broad. The user explicitly says it feels different.
      *   *Tu Quoque:* This is the "you too" fallacy. Usually implies the accuser is guilty of the same act. Close, but the user specifies the accuser might not have done the act, just allowed it elsewhere.
      *   *Double Standard:* This fits well. Applying different rules to different people in similar situations.
      *   *Selective Enforcement:* Common in legal/political contexts. Enforcing a rule against one person but not another.
      *   *Moral Standing / Standing to Blame:* Philosophical concepts. The idea that you lose the "standing" to blame if you've been inconsistent.
      *   *Whataboutism:* Related, but usually a deflection tactic ("What about when *they* did it?").
      *   *Inconsistency:* Too vague.
      *   *Arbitrary Enforcement:* Similar to selective enforcement.

  3.  **Evaluating the Best Fits:**

      *   **Double Standard:** This is the most common colloquial term. It captures the essence of applying Rule X to Person A but not Person B without a relevant difference.
      *   **Selective Enforcement:** Very precise for the politician example. It implies a choice in who gets punished.
      *   **Loss of Standing (to blame):** This is the philosophical underpinning. It explains *why* the blame is invalid.
      *   **Tu Quoque (expanded):** In logic, *tu quoque* is often restricted to "you did it too." However, some interpretations cover inconsistency in judgment. But "Double Standard" is clearer.
      *   **Special Pleading:** This is a logical fallacy where one applies a standard to others but claims an exception for oneself (or one's side) without justification. This fits the politician example well.

  4.  **Synthesizing the Answer:**

      *   **Direct Answer:** There isn't *one* perfect single word, but there are a few precise terms depending on the context.
      *   **Top Candidate 1: Double Standard.** This is the everyday term. It highlights the inequality of application.
      *   **Top Candidate 2: Selective Enforcement.** Best for rules/authority contexts (roommates, politics, law).
      *   **Top Candidate 3: Special Pleading.** Best for the logical fallacy aspect (making exceptions for "my side").
      *   **Philosophical Concept: Moral Standing.** Explain that the *credibility* is lost because the norm isn't being upheld consistently.

  5.  **Addressing the "Edges" (Nuance):**
      *   The user asked: *Does it matter if you excused the other person for a good reason?*
      *   **Yes, it matters.** This is the crucial distinction between a *Double Standard* and *Contextual Judgment*.
      *   If Roommate C was stressed (a valid mitigating factor), then enforcing the rule against Roommate B (who is not stressed) isn't necessarily a double standard. It's nuanced application.
      *   If the excuse was "I like her more," that's a double standard.
      *   **Relevant Differences:** The key is whether there is a *morally relevant difference* between the two cases.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the insight. It is a specific subset of hypocrisy.
      *   *Term 1: Double Standard.* Define it. Use the roommate example.
      *   *Term 2: Selective Enforcement.* Define it. Use the politician example.
      *   *Term 3: Special Pleading.* Define it as a fallacy.
      *   *Philosophical Angle:* "Loss of Standing to Blame." This addresses the "credibility" aspect the user mentioned.
      *   *Addressing the Edges:* This is important. Differentiate between *inconsistency* and *context*.
          *   Valid excuse (stress) = Not necessarily a double standard.
          *   Invalid excuse (favoritism) = Double standard.
      *   *Conclusion:* Summarize.

  7.  **Refining the "Loss of Standing" concept:**
      *   There is recent philosophical work on this (e.g., by Macalester Bell or Todd Friedman). The concept is "Normative Standing." If you waive a norm for one person, you undermine the norm itself, making your blame of another person inappropriate. I should mention this as it validates the user's intuition that it's distinct from regular hypocrisy.

  8.  **Final Review against User Query:**
      *   Did I answer "Is there a specific term?" Yes (Double Standard, Selective Enforcement, Standing).
      *   Did I address the "edges"? Yes (Relevant differences).
      *   Did I distinguish it from regular hypocrisy? Yes (Focus on enforcement vs. commission).

  9.  **Final Polish:** Ensure tone is conversational but analytical. (Self-Correction: Make sure not to get too bogged down in academic jargon, keep it accessible).

      *(Self-Correction during drafting)*: I should make sure to clarify that *Tu Quoque* is technically a fallacy used to *deflect* blame, whereas the user is describing the *state* of the blamer. So *Tu Quoque* is what the accused might shout back, but *Double Standard* is what the blamer is committing.

      *(Refining the "Edges" section)*: I need to be clear about "Principled Consistency" vs. "Rigid Consistency." Sometimes rules *should* be applied differently based on context. The hypocrisy lies in the *unjustified* difference.

