answer: |-
  You have hit on a very precise and philosophically interesting distinction. You are right that this is distinct from the classic definition of hypocrisy (doing the very thing you condemn).

  There isn't one single English word that captures this perfectly, but there are three terms that, when combined, describe exactly what you are talking about. Depending on the context (social, political, or logical), you would call this a **Double Standard**, **Selective Enforcement**, or a **Loss of Standing**.

  Here is the breakdown of the terms, followed by the "edges" you asked about regarding valid excuses.

  ### 1. The Common Term: Double Standard
  This is the most direct label. A double standard occurs when two similar people or groups are judged by different sets of principles.
  *   **Why it fits:** In your roommate example, the rule is "No dishes in the sink." By telling Roommate C it was okay but telling Roommate B it is not, the accuser is applying two different standards to the same behavior.
  *   **The nuance:** It implies unfairness. If the standard shifts based on favoritism, laziness, or tribalism, it is a double standard.

  ### 2. The Institutional Term: Selective Enforcement
  This is often used in legal, political, or rule-based contexts (like your politician example).
  *   **Why it fits:** It describes the *action* of the accuser. They have the power to enforce a norm (or law), but they choose to enforce it only against specific targets while ignoring violations by others (often their allies).
  *   **The nuance:** This suggests a strategic choice. The politician isn't necessarily corrupt themselves (classic hypocrisy); they are actively choosing *who* gets punished for corruption to gain political advantage.

  ### 3. The Philosophical Term: Loss of Standing (to Blame)
  This is the most accurate term for the specific feeling you described: "losing your credibility to call someone out."
  In moral philosophy, there is a concept called **Normative Standing**. To legitimately blame someone, you must uphold the norm you are invoking.
  *   **Why it fits:** If you waive the rule for Person A, you weaken the rule itself. When you then try to use that weakened rule to blame Person B, you lack the *standing* to do so. You haven't necessarily broken the rule yourself, but you have rendered the rule arbitrary.
  *   **The nuance:** This explains *why* the blame feels invalid. It's not that the dishes aren't annoying; it's that the blamer has lost the moral authority to complain because they've shown the rule isn't actually important to them—it's just a weapon.

  ---

  ### The Edges: When is it okay?
  You asked: *"Does it matter if you excused the other person for a good reason, or if you're just being lazy?"*

  **Yes, this is the critical edge.** This is the difference between a **Double Standard** and **Contextual Judgment.**

  To determine if someone has truly lost their standing, you have to look for a **Morally Relevant Difference.**

  #### Scenario A: The Double Standard (Invalid)
  *   **Roommate C** leaves dishes. Accuser says: "It's fine, I like her more."
  *   **Roommate B** leaves dishes. Accuser says: "You are so lazy."
  *   **Verdict:** This is a **Double Standard.** There is no relevant difference between C and B other than the accuser's favoritism. The accuser has lost their standing.

  #### Scenario B: Contextual Judgment (Valid)
  *   **Roommate C** leaves dishes. Accuser says: "It's fine, she just had surgery and is stressed."
  *   **Roommate B** leaves dishes. Accuser says: "Please wash these, you've been playing video games all day."
  *   **Verdict:** This is **NOT a double standard.** This is nuanced application of a rule.
  *   **Why:** There is a *morally relevant difference* between the two situations (medical stress/recovery vs. leisure). The rule isn't "Never leave dishes"; the implicit rule is "Don't leave dishes unless you have a valid burden."

  #### Scenario C: The "Lazy Enforcer" (The Gray Area)
  *   **Roommate C** leaves dishes. Accuser says nothing because they are tired of arguing.
  *   **Roommate B** leaves dishes. Accuser explodes with anger.
  *   **Verdict:** This is **Inconsistent Enforcement.**
  *   **Why:** This is tricky. If the accuser was simply *tolerating* the behavior before, they haven't necessarily established a precedent that the behavior is *allowed*, only that they were passive. However, if they let it slide for months and then suddenly weaponize it, it feels like a trap. This damages trust, even if it isn't strictly a logical double standard.

  ### Summary
  If you want to call this out in conversation, here is how to phrase it based on the situation:

  1.  **If they are favoring one person over another:** "That's a **double standard**. You let her do it last week."
  2.  **If they are using rules as a weapon (Politics/Work):** "This is **selective enforcement**. You ignored it when your side did it."
  3.  **If you want to get philosophical about their credibility:** "You've lost the **standing to complain**. By waiving the rule for her, you admitted the rule isn't absolute, so you can't enforce it absolutely against me."

  **The Litmus Test:**
  Ask the accuser: *"Is the rule [No Dishes], or is the rule [No Dishes Unless You're Stressed]?"*
  *   If they say the rule is **No Dishes**, they are hypocrites for letting the first person slide.
  *   If they say the rule is **No Dishes Unless Stressed**, they must admit you are allowed to leave dishes if *you* are stressed.

  If they refuse to apply the exception to you that they granted the other person, that is the definition of the pattern you identified.
