      *   *The "Inanimate" Boundary:* Why does kicking a dog corrupt me but kicking a stone doesn't? If the answer is "because the dog feels," haven't we smuggled in the animal's good? If the answer is "because the dog is alive," what's the moral relevance?
      *   *The "Last Person" Intuition:* Does Kant actually care about the Last Person? Kantian ethics is often about the *system* of rational agency. If there are no other rational agents, does the moral law still bind? (Yes, but regarding what?).

  6.  **Structuring the Response:**
