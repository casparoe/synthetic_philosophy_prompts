answer: |-
  ### Audit of the Cinema Analogy in Sunk Cost Reasoning

  The prevailing heuristic in public discourse—that honouring sunk costs is inherently irrational—relies heavily upon the 'dreadful cinema' analogy. This metaphor posits a closed system wherein an individual, having purchased a ticket, endures a substandard film solely due to the irrecoverable expense. However, institutional economists argue that in complex social systems, 'sunk commitments' often function as signalling devices within repeated games. To evaluate the validity of the cinema analogy against this institutional perspective, we must first establish the proposed correspondence between the cinematic scenario and the institutional reality.

  #### 1. Correspondence Table

  The following table maps the elements of the cinematic metaphor onto the institutional framework of legacy structures and long-term partnerships, adhering to the specified variables.

  | Cinematic Element | Institutional Equivalent | Function in Decision Matrix |
  | :--- | :--- | :--- |
  | **Ticket Price** | **Maintenance Costs** | Represents the financial outlay required to remain in the arrangement (viewed as a burden in the analogy, but potentially a premium for credibility in institutions). |
  | **Film Quality** | **Current Benefits** | The immediate utility or direct economic return derived from the activity or partnership. |
  | **Viewer Discomfort** | **Stakeholder Expectations** | In the cinema, pain is internal (boredom); in institutions, the 'pain' of leaving is external (reputational damage, breach of trust). |
  | **Decision to Leave** | **Withdrawal** | The act of terminating the engagement prior to its natural conclusion. |

  #### 2. Fractures in the Mapping

  While the table above establishes a superficial symmetry, the analogy fractures under scrutiny in two critical areas: the fungibility of resources and the structure of future interactions.

  **A. Fungibility of Prior Investments**
  In the cinema analogy, the ticket price is perfectly sunk; it is money that has vanished the moment the transaction is complete. It is non-fungible; one cannot reclaim the cash to spend elsewhere. Furthermore, the viewer's time is treated as largely fungible—if one leaves, one can immediately utilise that time for a superior alternative (a walk, a different film).

  In institutional contexts, this mapping is flawed. 'Maintenance costs' are not always purely sunk; they often involve the upkeep of specific assets (physical infrastructure, human capital, proprietary software) that possess some residual value or potential for repurposing, however limited. More importantly, the 'investment' in a partnership is rarely just financial; it is relational. Relational capital is not fungible. One cannot simply liquidate a twenty-year trade agreement and deploy that 'trust' into a new venture with the same efficiency. The cinema analogy assumes a liquid market for alternatives; institutional reality often involves asset specificity where withdrawal incurs liquidation costs far exceeding the ticket price.

  **B. Future-Interaction Effects (The Game Structure)**
  The most profound fracture concerns the nature of the interaction. The cinema scenario is modelled as a **one-shot game**. The viewer is anonymous to the cinema management; their departure has no consequence for future ticket prices or seating allocation. The audience does not observe the viewer's decision, and thus no reputation is gained or lost.

  Conversely, institutional economists treat legacy structures as moves within a **repeated game**. Here, 'Stakeholder Expectations' (mapped onto Viewer Discomfort) are not merely internal feelings but external constraints. If a government honours a loss-making treaty, or a firm maintains a legacy pension scheme, they are paying a premium to signal reliability to the market. The 'Maintenance Costs' are not merely the price of a bad film; they are the subscription fee for a reputation of fidelity. In this context, withdrawal is not a rational optimisation of current utility, but a potential default event that raises the cost of capital for all future interactions. The cinema analogy excises these externalities entirely.

  #### 3. Evaluation of Rationality and Analogy Bias

  Does the conclusion that honouring sunk costs is *always* irrational survive these disanalogies? **It does not.**

  Once the fractures regarding fungibility and repeated interactions are acknowledged, the normative force of the cinema analogy dissolves. In a repeated game with high reputational stakes, honouring a sunk commitment can be the strictly rational choice, provided the long-term value of credibility exceeds the short-term net loss of the legacy structure. The 'irrationality' lies only in viewing the transaction in isolation.

  Consequently, we must conclude that **the analogy was carrying the conclusion all along.**

  The cinema metaphor is not a neutral descriptive tool; it is a loaded rhetorical device. By selecting a scenario that presupposes anonymity, non-repeatability, and perfect fungibility of time, it rigs the model to ensure that 'staying' appears foolish. It defines rationality narrowly as immediate utility maximisation, excluding reputational capital and strategic signalling from the equation. When institutional economists reframe these costs as 'sunk commitments' rather than 'sunk costs', they are not committing a fallacy; they are correcting the model to account for the social and temporal context in which real-world decisions occur. The cinema analogy remains useful for illustrating the psychology of individual loss aversion, but it is analytically bankrupt when applied to the strategic logic of institutions.
