answer: |-
  ### The Precautionary Experience Audit (PEA)
  **Scope:** Rainbow Trout & Whiteleg Shrimp  
  **Time:** 30 Minutes Weekly  
  **Auditor:** Shed Staff (Untrained in Sentience)  
  **Philosophy:** *Resource-Based* (Health/Growth) is necessary but insufficient. *Experience-Based* (Behavior/Response) is the proxy for sentience. Under uncertainty, behavioral indicators of distress are treated as factual evidence of potential suffering (Precautionary Principle).

  ---

  ### Part 1: The 30-Minute Ordered Routine

  The audit follows a fixed sequence: **Environment → Body → Behavior.** This prevents auditors from being biased by good growth rates (Resource-Based) before observing how the animal is coping (Experience-Based).

  #### Step 1: Environmental Baseline (5 Minutes)
  *Goal: Ensure the physical context allows for welfare.*
  *   **Measure:** Dissolved Oxygen, Temperature, Ammonia/Nitrite, Salinity (Shrimp).
  *   **Thresholds:**
      *   **Pass:** Within species-specific optimal range.
      *   **Recheck:** Outside optimal range but within survival tolerance.
      *   **Flag:** Outside survival tolerance OR equipment failure requiring manual intervention.
  *   **Note:** If Step 1 is a **Flag**, stop audit. Welfare is compromised regardless of animal state.

  #### Step 2: Physical State & Resource Metrics (10 Minutes)
  *Goal: Assess the "Healthy Stock" argument.*
  *   **Observe:** Mortality rates, growth uniformity, physical lesions.
  *   **Species Indicators:**
      *   *Trout:* Fin erosion, skin lesions, deformities, gill color.
      *   *Shrimp:* Antenna loss, shell fouling, necrosis, size variance.
  *   **Thresholds:**
      *   **Pass:** Mortality < baseline; <5% visible injury.
      *   **Recheck:** Mortality baseline to +2%; 5-15% visible injury.
      *   **Flag:** Mortality >+2%; >15% visible injury OR specific injury patterns linked to handling (e.g., snout damage, antenna breakage).

  #### Step 3: Behavioral Reactivity (15 Minutes)
  *Goal: Assess the "How it Feels" argument via proxies.*
  *   **Method:** Disturbance Test. Auditor approaches tank/pond slowly, then introduces a standardized shadow or gentle water displacement.
  *   **Observe:** Avoidance, aggression, apathy, frantic movement.
  *   **Species Indicators:**
      *   *Trout:* Schooling cohesion, avoidance speed, surface gaping, frantic thrashing during handling.
      *   *Shrimp:* Feeding response latency, swimming activity, tail-flicking frequency during capture/chilling.
  *   **Thresholds:**
      *   **Pass:** Calm avoidance or curious approach; normal feeding latency.
      *   **Recheck:** Delayed avoidance; mild agitation lasting <1 minute.
      *   **Flag:** Panic scattering; prolonged agitation (>1 min); apathy (no response); **Any behavior indicative of nociception (pain response) even if survival is high.**

  ---

  ### Part 2: The Decision Matrix & Value Boundary

  Staff do not decide "Is this ethical?" They decide "Does this observation trigger a precaution?"

  | Outcome | Criteria | Action |
  | :--- | :--- | :--- |
  | **PASS** | Env Optimal + Body Healthy + Behavior Normal | Record data. No further action. |
  | **RECHECK** | Env/Body Borderline OR Behavior Mildly Abnormal | Schedule follow-up in 48 hours. Staff notes specific metric to verify. |
  | **FLAG** | **Any** Step 1 Failure OR Step 2 Injury Pattern OR **Step 3 Distress Signal** | **Stop treating as fact.** Record observation only. Escalate to Farm Manager. |

  #### The Value Judgment Boundary
  The routine treats Steps 1 and 2 as **factual** (physics and biology). Step 3 (Behavior) contains the boundary where fact becomes value.
  *   **Fact:** "Shrimp flick tails 10 times per minute in slurry."
  *   **Value Judgment:** "Does this flicking constitute suffering worthy of stopping production?"
  *   **Protocol:** The auditor records the **Fact** in the Flag log. The **Manager** applies the **Value** (Precautionary Principle). The auditor is instructed: *"If the animal acts as if it is suffering, record it as a Flag, even if the animal survives and grows."*

  ---

  ### Part 3: Handling Live Disputes

  Here is how the PEA routine resolves your three specific disputes using the thresholds above.

  #### Dispute 1: Autumn Trout Grading (Crowding & Air Exposure)
  *   **Scenario:** Strong growth (Step 2 Pass), but split fins and frantic thrashing (Step 2 Fail/Step 3 Fail).
  *   **Audit Application:**
      *   **Step 2:** >15% split fins triggers a **Flag** on physical injury.
      *   **Step 3:** Frantic thrashing during netting is a behavioral distress signal. Under the Precautionary Principle, this is treated as potential pain.
      *   **Outcome:** **FLAG.**
      *   **Resolution:** The audit does not allow a "Pass" based on growth. The Manager must weigh the economic benefit of grading now against the Flagged distress. The routine forces the distress to be recorded as a cost, not ignored as a side effect.

  #### Dispute 2: Pre-Sort Shrimp Chilling (Ice Slurry)
  *   **Scenario:** Low mortality (Step 2 Pass), but prolonged vigorous tail flicking (Step 3 Fail).
  *   **Audit Application:**
      *   **Step 2:** Mortality is low, suggesting physiological health.
      *   **Step 3:** Vigorous tail flicking is a nociceptive reflex. Under uncertainty of sentience, the Precautionary Principle dictates we assume this indicates aversion/pain.
      *   **Outcome:** **FLAG.**
      *   **Resolution:** The auditor records "Prolonged flicking (>30 secs)." This prevents the "Low Mortality = Good Welfare" argument from winning automatically. It forces the Manager to justify whether efficient killing outweighs the observed distress signal.

  #### Dispute 3: High-Density Shrimp Holding (Margins vs. Injury)
  *   **Scenario:** Viable margins (Economic Pass), frequent antenna loss/sluggish feeding (Step 2 Fail/Step 3 Fail).
  *   **Audit Application:**
      *   **Step 2:** Antenna loss is physical damage from crowding. If >15%, it is a **Flag**.
      *   **Step 3:** Sluggish feeding indicates apathy or chronic stress. This is a **Flag**.
      *   **Outcome:** **FLAG.**
      *   **Resolution:** This is the clearest Value Judgment. The audit confirms the stock is physically damaged and behaviorally suppressed. The "Viable Margin" is an economic fact, not a welfare fact. The routine isolates the welfare cost (Flag) so it cannot be hidden by the economic benefit.

  ---

  ### Part 4: Limitations and Failure Points

  **What this routine cannot do:**
  1.  **Prove Sentience:** It cannot confirm if the shrimp *feels* pain. It only confirms the shrimp *acts* as if it is in pain. It shifts the burden of proof to the producer to justify ignoring that signal.
  2.  **Override Economics:** A Manager can still override a Flag for financial viability. The audit makes the cost visible, but does not legally bind the decision.
  3.  **Measure Chronic Stress:** A 30-minute walk-through catches acute states. It may miss low-level chronic cortisol elevation that doesn't show in behavior until collapse.

  **Where it is most likely to misfire:**
  1.  **Normalization of Deviance:** Shed staff see distressed animals daily. They may begin to classify "frantic thrashing" as "normal handling behavior," shifting a **Flag** to a **Pass**. *Mitigation:* Rotate auditors between sheds quarterly.
  2.  **The "Healthy Look" Bias:** Staff may prioritize Step 2 (Body Condition) over Step 3 (Behavior) because injuries are harder to see than behavior. If growth is good, they may subconsciously ignore thrashing. *Mitigation:* Step 3 must be audited *before* reviewing growth records.
  3.  **The Precautionary Ceiling:** If every process triggers a Flag due to high sensitivity, staff may suffer "alert fatigue" and stop Flagging. *Mitigation:* Review Flag rates monthly. If >50% of audits are Flags, the baseline standard is unrealistic, not the audit.

  **Final Instruction to Staff:**
  *"You are not judging the animal's soul. You are recording its reaction. If it fights, bleeds, or hides, you Flag. Let the Manager decide if that price is worth paying."*
