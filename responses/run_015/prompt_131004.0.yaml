answer: |-
  Okay, first off: your brain hurts because you've stumbled into one of the oldest headaches in philosophy (the Ship of Theseus), but applied to art. It's supposed to feel weird.

  If we take your friend's view seriously—the idea that the "Statue" (the art object) and the "Clay/Marble" (the physical stuff) are two different things that just happen to be occupying the same space at the same time—here is the logical fallout for museums, ethics, and your argument.

  ### 1. The Labeling Problem: Honesty vs. Illusion
  Currently, museums label things by material: *"Marble, 2nd Century."* If the Constitution View is true, that label is technically a lie if 40% of it is modern epoxy.

  If the Statue is distinct from the Matter, curators would have to start labeling the **relationship** between the two. Instead of saying what it *is*, they'd have to say what *constitutes* it.
  *   **The Fallout:** Heavily restored pieces would need "Hybrid" warnings. Imagine a label that says: *"This Statue is constituted by 60% original Parian marble and 40% synthetic resin."*
  *   **The Ethical Shift:** This stops museums from selling the "aura" of the original when most of what you're looking at is modern filler. It forces them to admit that the object visitors are paying to see is partly a ghost. If the material is swapped out slowly over centuries, the label becomes a timeline of constitution rather than a static description.

  ### 2. Restitution Debates: Who Owns the "Statue"?
  This is where it gets spicy. Let's say a looted artifact is recovered, but during the time it was stolen, it was broken and fixed with modern metal.
  *   **The Museum Argument (usually):** "We fixed it. Most of the physical matter is ours now. It's a new object."
  *   **The Constitution View Argument:** If the Statue is distinct from the Matter, then the identity of the Statue travels with the **form and history**, not the atoms.
  *   **The Verdict:** This actually makes it **easier** to defend returning the object.
      *   Why? Because you aren't returning a pile of rocks; you're returning the *cultural entity*. Even if the physical stuff is 50% modern metal, the "Statue" (the thing with the historical significance, the religious meaning, the cultural identity) is still the same one that was looted.
      *   The source country is owed the *Statue*, not the specific clay. So, even if it's patched up with modern stuff, the *identity* belongs to them. The museum can't claim ownership just because they added new atoms, because the atoms aren't the object—the Statue is.

  ### 3. Digital Twins and 3D Prints: Are They Real?
  If the Statue is just the form, then a perfect 3D print should be the same statue, right?
  *   **The Fallout:** No. Under this view, a 3D print is a **new Statue** constituted by plastic.
  *   **Why?** Because "Statue-ness" isn't just geometry; it's also about the *history of constitution*. The original Statue has a causal chain back to the artist's hand. The 3D print has a causal chain back to a scanner and a printer.
  *   **The Weird Result:** You end up with "Sibling Statues." They look identical, but they are different objects because they are constituted by different materials with different histories. The digital twin isn't a copy of the *object*; it's a copy of the *form* instantiated in a new object. This kills the idea that a perfect digital replica can ever replace the need for the original. The original holds the "title deed" to that specific form-matter history.

  ### 4. The "Two Things on One Pedestal" Glitch
  You asked if the museum is technically displaying two things at once.
  *   **The Answer:** Yes. Literally.
  *   **Thing 1:** The aggregate of matter (marble + resin + metal).
  *   **Thing 2:** The Statue (the artistic entity defined by form and intent).
  *   **Does it matter?** Practically, no. Metaphysically and legally, yes.
      *   **Insurance:** If the statue falls and shatters, the "Matter" still exists (as shards), but the "Statue" might cease to exist entirely if the form is lost. Insurance policies would have to specify whether they are insuring the *stuff* or the *art*.
      *   **Conservation:** Conservators are currently trying to save the Matter to preserve the Statue. If they are distinct, sometimes you might have to sacrifice the Matter to save the Statue (e.g., removing a damaging original coating to reveal the form) or sacrifice the Statue to save the Matter (preserving a ruined lump because it's ancient, even if it no longer looks like the art).

  ### The Bottom Line for Your Argument
  Your friend is leaning on the idea that "Form = Identity." You're leaning on "Material = Identity."

  If you accept the Constitution View (that they are distinct):
  1.  **Authenticity** becomes about **provenance and history**, not just atoms.
  2.  **Restitution** becomes stronger for origin countries (they get the cultural entity, patches and all).
  3.  **Replicas** are always inferior, not because they look wrong, but because they are different objects entirely.

  You're right to be skeptical of the wordplay, but the logical fallout is that it forces museums to be way more honest about how much of what we see is actually "new." It stops them from hiding behind the magic of the "original" when they're mostly displaying a well-edited patchwork.
