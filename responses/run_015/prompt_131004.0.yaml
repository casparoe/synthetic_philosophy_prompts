          *   Scenario: A looted statue is recovered but has been heavily repaired with modern metal/resin.
          *   Argument for Return: The *Statue* (the cultural heritage object) belongs to the source country, regardless of the atoms. The "form/history" is the valuable thing.
          *   Argument against Return: The physical matter currently holding the form is mostly modern/Western restoration material. "We built this."
          *   Constitution View Verdict: It makes returning *easier* logically. If the Statue is distinct from the Clay/Metal, then returning the "Statue" means returning the rights to that specific form/history cluster, even if the atoms are partly new. The source country gets the *heritage object*, not just a pile of rocks.
