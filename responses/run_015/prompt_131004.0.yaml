          *   Weird fallout: If form is all that matters, the 3D print is equally valid. But if constitution matters (the specific relationship between form and matter over time), the print is a "counterfeit constitution."
          *   It creates a hierarchy: Original Constitution (Artist + Original Matter) > Restored Constitution (Artist Form + Mixed Matter) > Replica Constitution (Copy Form + New Matter).
