answer: |-
  **Draft Framework for Cross-Cultural Communication Norms**

  **1. Agreed Claims**

  1.  **Instrumental Bluntness:** Both parties agree that directness employed as a weapon to dominate or humiliate is a vice, regardless of cultural origin. Truth-telling norms do not license aggression.
  2.  **Safety Criticality:** In engineering contexts where physical safety or significant financial loss is at stake, factual precision overrides politeness codes. A hearer's preference for comfort does not constitute the whole moral story.
  3.  **Limiting Cases:** Extreme hypotheticals (e.g., the murderer-at-the-door) are recognised as boundary conditions rather than templates for daily operational conduct.
  4.  **Shared Cost of Error:** Systematic misunderstanding generates rework and delay. Both sides accept that reducing ambiguity is a shared instrumental goal, even if the method differs.
  5.  **Trust Definition:** Both sides agree that trust requires reliability. The disagreement lies solely in whether reliability is best achieved through semantic precision or relational harmony.

  **2. Residual Disagreements**

  | Disagreement | Assertion-Norm Formulation | Accommodation Formulation | Genuine / Verbal |
  | :--- | :--- | :--- | :--- |
  | **The Status of the Hedge** | A hedged refusal known by both parties to mean 'no' is a false assertion if it employs positive syntax to convey negative intent. | A hedged refusal known by both parties to mean 'no' is a successful speech act; the meaning is settled by the code in force, not literal syntax. | **Verbal.** This turns on the definition of 'assertion'. If assertion is defined by literal content, the Norm view wins by stipulation; if defined by uptake, Accommodation wins. |
  | **Priority of Face** | Preserving a hearer's face is secondary to preserving the integrity of the information exchange. | Preserving a hearer's face is constitutive of the information exchange; damaging the relationship destroys the channel for future truth. | **Genuine.** This is a conflict of ultimate values (epistemic integrity vs. relational cohesion) that cannot be resolved by definition alone. |
  | **Decoding Responsibility** | The speaker bears the primary burden to be understood by any competent speaker of the lingua franca. | The hearer bears the primary burden to acquire the local cultural code necessary to decode indirectness. | **Genuine.** This distributes moral and practical labour differently, affecting hiring and training protocols. |

  **3. Cruxes for Adversarial Collaboration**

  **3.1 Conventionalised Indirectness**
  *   **Sub-question:** Is a standard polite refusal (e.g., "I will consider it" meaning "No") an assertion of fact or a phatic greeting?
  *   **Why it matters:** If phatic, it falls outside truth-telling norms entirely, dissolving the Assertion-Norm objection.
  *   **Concrete Case:** A Tokyo engineer says "This is difficult" regarding a deadline. Rotterdam hears "Possible but hard"; Tokyo means "Impossible".
  *   **Predictions:** *Assertion-Norm* predicts this leads to missed deadlines regardless of intent. *Accommodation* predicts Rotterdam will learn the code within six months, neutralising the risk.

  **3.2 The Uptake Gap**
  *   **Sub-question:** Does the norm calibrate to the hearer's competence, and if not, is failure the hearer's misfortune or the speaker's fault?
  *   **Why it matters:** Determines liability when new hires or juniors misinterpret polite refusals.
  *   **Concrete Case:** A junior scheduler books a meeting based on a senior's tentative "Perhaps next week" (meaning 'never').
  *   **Predictions:** *Assertion-Norm* predicts the senior is at fault for not correcting the junior. *Accommodation* predicts the junior is at fault for lacking cultural calibration. *Study Design:* Track error rates in mixed-seniority scheduling over one quarter. *Assertion-Norm* expects high error rates; *Accommodation* expects errors to cluster among new hires only.

  **3.3 The Overhearer Case**
  *   **Sub-question:** Where an addressee understands the polite form but a third party does not, to whom is the lie told?
  *   **Why it matters:** Addresses transparency in open-plan offices or shared digital channels.
  *   **Concrete Case:** Engineer A tells Engineer B "We might explore that option" (meaning 'no'). Engineer C (foreign contractor) hears this and budgets for the work.
  *   **Predictions:** *Assertion-Norm* claims C is wronged by the false impression. *Accommodation* claims A owed nothing to C, as C was not the intended participant in the face-work.

  **3.4 Cost of Accommodation**
  *   **Sub-question:** Who bears the cost of accommodation in a mixed-code team, and is an interpretive burden falling on minority speakers a moral cost?
  *   **Why it matters:** If indirectness requires extra decoding labour, does this unfairly penalise the direct-culture minority?
  *   **Concrete Case:** Rotterdam engineers spend extra hours analysing Tokyo emails for hidden refusals.
  *   **Predictions:** *Assertion-Norm* claims this is an efficiency tax on the minority. *Accommodation* claims this is a standard investment in any second-language/culture environment. *Study Design:* Log hours spent clarifying communications. *Assertion-Norm* expects asymmetric burden on Rotterdam; *Accommodation* expects symmetric burden (Tokyo decoding Dutch bluntness).

  **3.5 The Epistemic Commons**
  *   **Sub-question:** Does a widespread convention of indirectness degrade the local information pool in a way that is unfair to whoever can least afford a decoding failure?
  *   **Why it matters:** Addresses long-term knowledge management and risk assessment.
  *   **Concrete Case:** Project risk logs show 'green' status due to polite optimism, until late failure.
  *   **Predictions:** *Assertion-Norm* predicts systemic optimism bias in documentation. *Accommodation* predicts risks are known socially but not documented, preserving team cohesion without losing data. *Study Design:* Compare documented risks vs. actual issues in purely Dutch vs. purely Japanese vs. mixed teams.

  **3.6 The Explicit Request**
  *   **Sub-question:** If a hearer says "Please be blunt", does either camp then owe bluntness, and does the answer differ if the requester is a colleague, a new hire, or someone bad at hints?
  *   **Why it matters:** Tests whether individual consent can override cultural norms.
  *   **Concrete Case:** A Dutch engineer emails a Tokyo counterpart: "Please tell me directly if this is impossible."
  *   **Predictions:** *Assertion-Norm* claims the request mandates directness universally. *Accommodation* claims the speaker still owes face-maintenance to the broader group context, not just the individual. *Observation:* Both sides accept that ignoring such a request damages trust, but disagree on whether it permits breaking the local code.

  **4. Closing Provision**

  In mixed teams, we agree to prioritise the clarity required by the task's risk profile while acknowledging the relational labour required to maintain the partnership.
