  8.  **Drafting Content (Iterative refinement):**
      *   *Tone:* Professional, peer-to-peer (meteorologist to meteorologist/philosopher), American English, no fluff.
      *   *Thesis 1 (The Standard Chaos View):* D2 + P1-failure (finite). Status: Substantive/True. Antagonist 1.
      *   *Thesis 2 (The Computational View):* D2 + P1-failure (time). Status: Substantive.
      *   *Thesis 3 (The Laplacean View):* D2 + P1-success (infinite). Status: True (for classical). Shows Antagonist 2 is wrong about "empty."
      *   *Thesis 4 (The Metaphysical Slip):* D1 + "Open Future". Status: False. Antagonist 3.
      *   *Thesis 5 (The Unfalsifiability Claim):* D1 is untestable. Status: Substantive (but doesn't kill science). Antagonist 2.
      *   *Decimal Tap Section:* Explicitly contrast "Tap runs out of time" vs. "Tap gives infinite digits but math breaks."
      *   *Free Will:* Explicitly state that unpredictability $\neq$ control.

  9.  **Review against Constraints:**
      *   American English? Yes.
      *   No citations? Yes.
