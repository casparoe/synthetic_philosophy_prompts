answer: |-
  The platitude you cite is a colloquial statement of the **Value of Information (VoI) Theorem**, most formally associated with **I.J. Good (1967)**. In its standard decision-theoretic formulation, it states that for a Bayesian expected-utility maximizer, the expected utility of a decision made with free, costless information is always at least as high as the expected utility of a decision made without it.

  However, as you have observed, this theorem is not a law of nature; it is a mathematical consequence of specific axioms. When information harms, it is because one of the axioms underpinning Good's theorem has been violated. There is no single settled taxonomy for "harmful information" because the phenomena arise in disjoint subfields (health economics, game theory, ambiguity theory). However, we can construct a unified taxonomy by identifying the failing assumption in each case.

  ### I. The Candidate Mechanisms (Assumptions of Good's Theorem)

  For the statement "information is never harmful" to hold, the following conditions must be met:

  1.  **Consequentialism:** Utility is derived solely from final material outcomes (e.g., health state, wealth), not from the belief state itself or the process of acquiring knowledge.
  2.  **Free Disposal:** The agent can costlessly ignore the information. If the message suggests an action inferior to the status quo, the agent can discard the message and act as if they never received it.
  3.  **Dynamic Consistency:** The agent's future self will maximize the same utility function as the current self. The current self can trust the future self to execute the optimal plan contingent on the information.
  4.  **Strategic Isolation:** The act of acquiring information, or the information itself, does not alter the behavior of other agents (no signaling or externalities).
  5.  **SEU (Subjective Expected Utility):** The agent ranks prospects by probability-weighted averaging. Preferences are linear in probabilities.

  ### II. Analysis of Your Cases

  **Case One: The Genetic Test (Intrapersonal Strategic Failure)**
  *   **Diagnosis:** This violates **Free Disposal** and **Dynamic Consistency**.
  *   **Mechanism:** The woman anticipates that her future self, upon receiving the positive result, will be psychologically compelled to act (take prophylaxis) in a way her current self dislikes. She cannot "dispose" of the information once received; it alters her constraint set. This is an **intrapersonal game**. Her current self is playing against her future self.
  *   **Classification:** Genuine counterexample to the simple platitude. It is a case of **Demand for Ignorance** driven by self-control problems.

  **Case Two: The Misery of Waiting (Experiential Failure)**
  *   **Diagnosis:** This violates **Consequentialism**.
  *   **Mechanism:** In standard theory, utility is defined over final health states ($H_{healthy}, H_{ill}$). Here, utility is defined over the trajectory of beliefs ($U(H, Belief)$). The state of "not knowing" has negative utility (anxiety). Extending the duration of this state reduces total utility. This is modeled in economics as **Anticipatory Utility** or **News Utility** (Caplin & Leahy).
  *   **Classification:** Hypothesis failure. The platitude assumes utility is only over outcomes; once you define utility over belief states, information (or the timing thereof) becomes a consumption good that can be negative.

  **Case Three: The Market Study (Interpersonal Strategic Failure)**
  *   **Diagnosis:** This violates **Strategic Isolation**.
  *   **Mechanism:** Acquiring information is an observable move in a game. Commissioning the study signals intent, allowing the competitor to preempt. The information itself might be free, but the *acquisition* changes the game tree.
  *   **Classification:** Genuine counterexample in a single-agent framework; standard result in Game Theory (**Signaling**).

  ### III. Comparing Case One and Case Three

  You noted that Case One (Future Self) and Case Three (Competitor) resemble each other because a "second mover" reacts.

  *   **The Resemblance:** Both are **Strategic Ignorance** scenarios. In both, the agent prefers not to know because knowledge triggers a reaction that worsens the outcome.
  *   **The Theoretically Important Difference:** **Commitment Technology.**
      *   In **Case Three (Competitor)**, the harm comes from the *observability of the acquisition*. Theoretically, the firm could solve this by hiding the study (if possible) or by committing not to act on the study. The barrier is external secrecy.
      *   In **Case One (Future Self)**, the harm comes from the *inseparability of belief and action*. Even if the test is private, the woman believes she cannot decouple the knowledge from the compulsion to act. The barrier is internal psychological constraint.
      *   **Why it matters:** Case Three is solved by changing the *information structure of the game* (hiding the move). Case One is solved by changing the *agent's preference structure* (pre-commitment devices like Ulysses contracts). Case One is a failure of **agency**; Case Three is a failure of **secrecy**.

  ### IV. Case Four: Ambiguity and the Destroyed Hedge

  You suspect that for a chooser using **MaxMin Expected Utility (MEU)** (worst-case over a range of probabilities), resolving a question can destroy a hedge.

  *   **Verdict:** This is **Real**.
  *   **The Mechanism:** In SEU, information refines probabilities but preserves linearity. In MEU, information refines the *set of priors*. If the set of priors is not **rectangular** (a technical condition regarding how priors update across states), the ex-ante evaluation of a contingent plan (act based on info) can be strictly lower than a fixed act (ignore info). Information removes the "ambiguity hedge."
  *   **Minimal Example:**
      *   **Choice:** You must choose between Act $A$ and Act $B$.
      *   **States:** $S_1$ (Good), $S_2$ (Bad).
      *   **Payoffs:**
          *   Act $A$: Pays $\$10$ regardless of state. (Safe)
          *   Act $B$: Pays $\$20$ in $S_1$, $\$0$ in $S_2$. (Risky)
      *   **Ambiguity:** You do not know the probability of $S_1$. You believe $P(S_1) \in [0.4, 0.6]$.
      *   **Uninformed Decision:**
          *   Min-Exp-Utility($A$) = $\$10$.
          *   Min-Exp-Utility($B$) = $0.4 \times 20 + 0.6 \times 0 = \$8$.
          *   **Choice:** You pick $A$. **Value = $\$10$.**
      *   **Informed Decision (Perfect Signal):**
          *   You will learn the true state before choosing.
          *   Plan: If $S_1$, pick $B$ ($\$20$). If $S_2$, pick $A$ ($\$10$).
          *   **The Trap:** Under MaxMin, you evaluate this *plan* using the worst-case prior over the joint distribution of signals and states. If your priors are such that the worst-case scenario for the *plan* assigns high probability to the state where you get the lower payoff, the value drops.
          *   *Specific Rectangularity Failure:* Suppose the ambiguity is about the *reliability* of the signal itself, or the priors shift such that the "worst case" for the contingent plan is worse than the sure thing.
          *   *Simpler Illustration:* Consider an **Ambiguity Hedge**. You hold two assets that cancel out ambiguity risk when held together, but look risky individually. Information forces you to evaluate them individually.
          *   **Concrete Numerical Case (Epstein & Schneider style):**
              *   You face two urns. Urn 1 is 50/50. Urn 2 is unknown ($p \in [0,1]$).
              *   You can bet on Red in Urn 1 OR Red in Urn 2.
              *   Uninformed: You are indifferent. You might randomize to hedge.
              *   Informed: You learn Urn 2 is 90% Red. Now you must choose Urn 2. But your ambiguity aversion makes you value the *known* 50/50 less than the *hedged* position of not knowing.
              *   *Correction:* The cleanest example is where the **option to wait** (which preserves ambiguity) is valuable. If information forces a decision now, it collapses the set of priors to a point where the worst-case is realized.
              *   **Verdict:** Yes, under MEU with non-rectangular priors, $VoI < 0$.

  ### V. Behavioral Finance: The Ostrich Effect

  *   **Label:** **Information Aversion** (often called the Ostrich Effect).
  *   **Analysis:** This collapses primarily into **Case Two (Experiential Failure)**. Investors avoid statements because reading them generates negative "news utility" (anxiety) without allowing them to change their portfolio (due to inertia or transaction costs).
  *   **Distinction:** It does not usually collapse into Case One (Self-Control) unless the investor believes that seeing the loss will trigger a panic sell (which would be Case One). Empirically, it is mostly Case Two: they avoid the *pain* of the belief, not the *consequence* of the action.

  ### VI. Taxonomy and Terminology

  There is no single established term that covers all four cases because they violate different axioms. Health economists call Case One "Information Aversion." Game theorists call Case Three "Strategic Ignorance." Ambiguity theorists call Case Four "Negative Value of Information under MEU."

  Since you require a unified concept to describe the structural reasons why knowledge reduces utility, I propose the term:

  **Epistemic Liability**

  **Definition:** A situation where the acquisition or possession of a true proposition reduces the decision-maker's expected utility, contingent on the violation of one or more Good's Theorem axioms.

  **Boundary Cases for Membership:**

  1.  **Must Count (Epistemic Liability):**
      *   **Strategic Ignorance (Case 3):** Knowledge alters opponent behavior. (Violates Strategic Isolation).
      *   **Intrapersonal Compulsion (Case 1):** Knowledge alters future self's constraints. (Violates Free Disposal/Consistency).
      *   **Belief Disutility (Case 2):** Knowledge directly enters utility function negatively. (Violates Consequentialism).
      *   **Hedge Destruction (Case 4):** Knowledge collapses a prior set that supported a robust choice. (Violates SEU/Rectangularity).

  2.  **Must Not Count (Not Epistemic Liability):**
      *   **Costly Information:** If the test costs money, and the benefit is less than the cost, this is not Epistemic Liability. This is simply a bad purchase. Liability implies the *information itself* is the harm, even if free.
      *   **Error:** If the information is false (a bad test), it is not Epistemic Liability. The theorem assumes truthful information.
      *   **Bounded Rationality (Computation):** If the agent cannot process the data and makes a mistake due to confusion, this is a cognitive cost, not a structural liability of the information itself.

  **Summary:** The platitude holds only for a **Consequentialist, Dynamically Consistent, SEU-maximizing Singleton**. Your cases represent the four ways reality deviates from that ideal: **Psychology** (Case 1 & 2), **Strategy** (Case 3), and **Ambiguity** (Case 4). The unified phenomenon is **Epistemic Liability**.
