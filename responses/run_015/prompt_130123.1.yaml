answer: |-
  1. Branching questions

  1. **The Magic Pill.** Suppose the same future safety and public calm could be secured by a painless pill or environmental tweak rather than hard treatment. If the burden could be removed without losing safety, is anything still owed to the person who broke the rule?
  *Separates forward-looking only views from those requiring backward-looking fittingness.*

  2. **The Hidden Act.** A rule-breaking act is known only to the authorities and the actor. No one else will ever know, the actor is not dangerous, and no future acts will be prevented. Is there still a reason to impose a burden?
  *Separates pure backward-looking views from those requiring public expression or safety.*

  3. **The Weather Report.** The act was produced by upbringing and brain states exactly as a storm's path is produced by pressure. Does this causal story remove the reason to impose a burden, leave it untouched, or change the kind of reason it is?
  *Separates free-will skeptical views from compatibilist views.*

  4. **The Made Character.** Must the person have controlled how their own character was formed to be a fitting target, or is it enough that they acted from their own uncoerced deliberation at the time?
  *Separates ultimate responsibility views from surface-control views.*

  5. **The Uncomprehending Subject.** The person cannot recognize the burden as a response to what they did due to dementia or cultural distance. Is the burden then merely training, or does it keep its previous status?
  *Separates communicative views from non-communicative views.*

  6. **The Late Trial.** A person is found to have broken a rule at twenty but is only caught at ninety. Does the delay remove the reason to impose a burden, or does the reason remain intact?
  *Separates strict accounting views from flexible or expired claims.*

  7. **The Broken Streetlight.** Authority rules on housing and lighting caused a measurable share of the rule-breaking rate. Does this causal contribution reduce what may be imposed, reduce it proportionally, or make no difference?
  *Separates clean-hands views from pragmatic authority views.*

  8. **The Paper Tiger.** A repeat rule-breaker is certain to break rules again but certain never to endanger anyone physically. Does certainty of repetition without risk change what may be imposed, and in which direction?
  *Separates risk-based containment from wrongdoing-based responses.*

  2. The tree

  Entry: May the state impose burdensome treatment on some who break serious rules?
  ├── No → **Abolitionist**
  └── Yes → Proceed to Q3 (The Weather Report)
      ├── Yes, causal story removes reason → Proceed to Q8 (The Paper Tiger)
      │   ├── Burden allowed if repeat likely → **Public-Health Quarantine**
      │   └── Burden denied if no danger → **Pure Prevention** (Unnamed)
      └── No, reason remains untouched → Proceed to Q1 (The Magic Pill)
          ├── Yes, remove burden if safety secured → Proceed to Q6 (The Late Trial)
          │   ├── Reason expires/diminishes → **Desert-Capped Consequentialism**
          │   └── Reason intact → **Forward-Looking Compatibilism** (Unnamed)
          └── No, burden still owed → Proceed to Q5 (The Uncomprehending Subject)
              ├── Requires understanding → **Communicative**
              └── Understanding not required → Proceed to Q2 (The Hidden Act)
                  ├── Burden still required → **Compatibilist Just Deserts**
                  └── Burden not required → **Expressivist**

  3. Leaf glossary

  **Abolitionist.** The state lacks standing to impose burdens for rule-breaking under current conditions. (Entry: No). Awkward commitment: Must propose non-burdensome alternatives for dangerous individuals or accept higher risk.

  **Public-Health Quarantine.** Burdens are justified only to prevent future harm, not because they are fitting for past acts. (Q3: Yes, Q8: Yes). Awkward commitment: Must treat dangerous rule-breakers like carriers of disease, potentially indefinitely.

  **Pure Prevention.** Burdens are justified only to prevent specific future harm, never for past acts alone. (Q3: Yes, Q8: No). Awkward commitment: Cannot burden anyone who proves they will not break rules again, regardless of past severity.

  **Desert-Capped Consequentialism.** Future safety goals are pursued, but only up to a limit set by what fits the past act. (Q3: No, Q1: Yes, Q6: Yes). Awkward commitment: Must release dangerous individuals once their "credit" is exhausted, even if risk remains.

  **Forward-Looking Compatibilism.** Past acts justify burdens, but only if useful for future goals; fittingness does not require suffering. (Q3: No, Q1: Yes, Q6: No). Awkward commitment: Cannot impose burdens on those who will not reoffend, even if they acted wrongly.

  **Communicative.** Burdens must be understood by the recipient as a moral message to be valid. (Q3: No, Q1: No, Q5: Yes). Awkward commitment: Cannot legitimately burden those permanently incapable of understanding the norm, such as the severely cognitively impaired.

  **Compatibilist Just Deserts.** Burdens are fitting because of the act itself, regardless of future utility or understanding. (Q3: No, Q1: No, Q5: No, Q2: Yes). Awkward commitment: Must impose burdens even when secretly done and useless, purely because they are owed.

  **Expressivist.** Burdens are required to express public condemnation, not because the individual deserves suffering. (Q3: No, Q1: No, Q5: No, Q2: No). Awkward commitment: Cannot burden someone for a secret act, even if they are dangerous, because no public message is sent.

  4. Cut points

  The Dennett–Caruso dispute turns on three nodes. First, **Q3 (The Weather Report)** is the metaphysical hinge. Caruso answers "Yes," holding that causal determination removes the reason for fitting burdens; Dennett answers "No," holding that competent deliberation survives causal explanation. Second, **Q1 (The Magic Pill)** separates their functional aims. Caruso answers "Yes," preferring treatment over burden if safety is equal; Dennett answers "No," maintaining that the burden itself is part of what is owed. Third, **Q4 (The Made Character)** clarifies the compatibilist stance. Dennett requires only surface control at the time of action; Caruso argues this is insufficient without ultimate authorship.

  The remaining questions do not separate them because they agree on several constraints. Both reject **Q2 (The Hidden Act)** burdens if no safety is gained, though for different reasons (Caruso: useless; Dennett: often agrees utility matters). Both generally accept **Q8 (The Paper Tiger)** risks warrant containment, though Dennett adds a fittingness constraint. Questions regarding state complicity (**Q7**) and accounting limits (**Q6**) are internal debates within the compatibilist camp; Caruso's view collapses these into risk assessment, making them secondary to the primary metaphysical split at Q3.

  5. Empty regions

  Three coherent-looking patterns remain unoccupied. First, **The Secret Retributivist** (Q3: No, Q1: No, Q2: Yes, Q5: No) is occupied by Compatibilist Just Deserts, but a variant denying **Q5** (understanding) while denying **Q2** (secret acts) is empty. This combination is **merely unattractive**: it demands suffering for fittingness but only if public, making the suffering instrumental to expression rather than purely fitting.

  Second, **The Determinist Communicative** (Q3: Yes, Q5: Yes) is **incoherent**. If causal determination removes the reason for burdens (Q3), one cannot consistently claim the burden serves as a moral message requiring uptake (Q5), as this presupposes agency worthy of address.

  Third, **The Clean-Hands Absolutist** (Q3: No, Q1: No, Q7: Proportionally Reduces) is **unexplored**. This view holds burdens are fitting regardless of utility but reduces them based on state complicity. It is logically stable but rarely defended, as most fittingness views treat the act itself as the sole metric, ignoring external causal factors like streetlights. This region suggests a hybrid view where fittingness is sensitive to systemic fairness, not just individual action.

  6. Indistinguishable leaves

  The tree cannot pull apart **Expressivist** and **Deterrence-Only** views. Both answer "No" to the Hidden Act (Q2) and "Yes" to the Magic Pill (Q1). They differ on whether the burden expresses value or merely prevents acts, but my cases measure outcomes, not intentions. A case asking whether the burden is permissible if the public believes it is treatment rather than condemnation would separate them.

  Regarding the ninth candidate question (Scapegoat): **This earns a node.** Q1 (Replacement) asks if the *method* can change, not the *person*. A view could hold that burdens must be punitive (Q1: No) but permissible on the innocent if consequences are identical. This is distinct from all current leaves. Adding it would split the Public-Health and Deterrence leaves into "Guilty-Only" and "Consequentialist-Any" variants, clarifying whether guilt is a constraint or a heuristic.
