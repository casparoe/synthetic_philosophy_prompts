answer: |-
  Best-System Composition (BSC) proposes a dissolution of the special composition question rather than a direct answer. To ask when some things compose a further thing is to ask when quantification over a composite object earns its keep in the best deductive systematization of the world's history. Here, "best" is defined by the standard tradeoff between strength and simplicity. Strength is the system's ability to entail truths about the distribution of qualitative properties across spacetime; simplicity is the brevity and elegance of the axioms required to generate those entailments. "Ontology" refers to the domain of objects over which the system quantifies. On this view, composition is not a brute metaphysical relation waiting to be discovered, nor is it a linguistic convention. It is a structural feature of reality constituted by the optimal balance of informational compression and predictive power.

  A primary objection charges BSC with conflating metaphysics and bookkeeping. The critic insists that existence is ontic—a matter of what is there—whereas best-system-hood is epistemic—a matter of how we describe what is there. To say objects exist because they appear in our best theory is to slide from how we know to what is. This objection presupposes a realist framework where the world's structure exists independently of any systematization. BSC rejects this presupposition. On a Humean mosaic view, the world is just a distribution of local qualities. There is no "furniture of the universe" beyond that mosaic. Laws and objects are summaries of that mosaic. If a term quantifying over a composite object does not appear in the best summary, there is no fact of the matter that it exists waiting to be missed. The distinction between epistemic virtue and ontic status collapses because the system does not merely describe the structure; it constitutes it. To exist is to be a value of a bound variable in the best system. There is no deeper ontology behind the system to which the system must correspond.

  Another challenge concerns uniqueness. What if two competing systems, one quantifying over a composite and one not, are equally balanced in strength and simplicity? Does BSC commit us to indeterminacy in composition? It does, but this is a virtue, not a vice. The standard argument from vagueness suggests that restricted composition views entail unacceptable metaphysical vagueness. BSC accepts metaphysical vagueness but grounds it in competitive ties between global systems. This is preferable to epistemicism, which posits sharp but unknowable boundaries, or brute vagueness, which offers no explanation. On BSC, composition is vague precisely where the world's structure is underdetermined by the constraints of simplicity and strength. The indeterminacy is not in the world's mosaic but in the optimal compression of that mosaic. This locates vagueness where it belongs: in the tradeoff between competing descriptions of equal merit.

  Consider the problem of coincidence. If a statue and the lump of clay both earn their keep in different subsystems—art history versus chemistry—does BSC force us to accept two coincident objects? If both terms contribute to the global strength without prohibitive simplicity costs, then yes, both exist. The embarrassment of coincidence arises only if one assumes that distinct objects must differ in modal properties or material constitution in a way that violates parsimony. But BSC measures parsimony globally. If quantifying over both "statue" and "lump" allows for tighter generalizations in their respective domains than reducing one to the other, then the ontology includes both. Coincidence is not a metaphysical scandal; it is an efficiency gain. If, however, one term is redundant—adding no strength while costing simplicity—it is eliminated. The choice is never arbitrary because it is dictated by the scoring rule of the global system, not local intuition.

  Finally, there is the objection of holism. Because bestness is evaluated over the world's entire history, whether atoms compose a table here depends on events in a distant galaxy or the far future. This violates the intuition that composition is local. BSC bites this bullet. There is no principled reason to assume locality of composition any more than locality of laws. If the existence of a composite object here allows for a simpler axiom that also explains phenomena elsewhere, then the object's existence depends on those distant phenomena. To demand locality is to demand that ontology supervene on local qualitative facts, but BSC denies this supervenience base. The structure of reality is holistic. Accepting this removes the pressure to find a local trigger for composition. The cost is counterintuitive, but the gain is a unified account of objects and laws. If laws can be holistic, objects can be too.

  In sum, BSC treats composition as a derivative feature of the world's optimal description. It avoids the arbitrariness of brute restriction, the bloated ontology of universalism, and the error theory of nihilism. It accepts vagueness, coincidence, and holism as necessary consequences of a system-based ontology. The view stands or falls on the coherence of the Best System Analysis itself, but within that framework, it offers the most robust account of when some things compose a further thing.

  ***

  **Predictions and Contrasts**

  (a) **The Replaced Table:** BSC likely affirms composition. If the concept "table" retains predictive utility across the replacement sequence in the best system, the object persists. This contrasts with "ordinary cases" views that might struggle with precise cutoff points for replacement.
  (b) **The Hurricane:** BSC affirms composition. Meteorology earns its keep in the best system due to high strength gains for low simplicity costs. "Ordinary cases" views often exclude non-living composites, requiring ad hoc exceptions.
  (c) **The Cloud Swarm:** BSC predicts indeterminacy. Multiple candidate swarms may tie in simplicity/strength scores. "Ordinary cases" views typically deny composition here to avoid vagueness, whereas BSC locates vagueness in the system ties.
  (d) **The Human Fusion:** BSC denies composition. Quantifying over the fusion of all humans adds complexity without proportional strength gains. "Ordinary cases" views often rely on intuitive repugnance here, whereas BSC relies on explicit scoring costs.

  The key difference is that BSC derives these answers from global systematic utility, whereas "ordinary cases" views rely on local biological or functional intuitions that lack a unified metric.
