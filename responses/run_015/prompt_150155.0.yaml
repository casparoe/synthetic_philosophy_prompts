answer: |-
  **SPECIFICATION FOR A THEORY OF EPISTEMIC POLARIZATION**

  **1. The Isolation/Distrust Distinction (Non-negotiable)**
  *The Requirement:* The account must distinguish between a *filter bubble* (you never see the other side) and an *echo chamber* (you see the other side but possess a pre-installed defeater for their credibility).
  *The Case:* You noted you can't tell these apart from the outside. A usable theory must provide a diagnostic question: "If I showed you the counter-argument, would you engage with it, or dismiss the source?" If the latter, it's an echo chamber. If the former, it's isolation.
  *Why:* Fixes for isolation (show them the data) worsen echo chambers (reinforces the distrust). Conflating them leads to wasted interventions.

  **2. The Deference Exception (Non-negotiable)**
  *The Requirement:* The account must explain why trusting a mechanic or doctor is rational, while trusting a conspiracy influencer is not, without relying solely on "consensus."
  *The Case:* You are structurally dependent on experts you cannot verify. A theory that labels all deference as "echo chamber behavior" condemns modern life.
  *Why:* The distinction lies in *exit costs* and *internal dissent*. A healthy epistemic community allows internal disagreement and has methods for outsiders to verify outcomes (the brakes work). A cult punishes internal dissent and verifies only through loyalty.

  **3. The Tripartite Intent (Non-negotiable)**
  *The Requirement:* The account must separate Honest Error, Indifference to Truth (Bullshit), and Active Deception (Lying).
  *The Case:* You asked if "bad faith" collapses these. It does, and that renders it useless. A theory must diagnose *indifference* separately from *lying*.
  *Why:* You can argue someone out of an error. You cannot argue someone out of indifference. Accusing a sincere person of lying escalates conflict; accusing a liar of being mistaken lets them off the hook. The remedy differs for each.

  **4. Asymmetry Tolerance (Non-negotiable)**
  *The Requirement:* The theory must allow for the verdict that one side is currently more epistemically compromised than the other, without requiring a symmetrical opposite.
  *The Case:* You asked if this is a contradiction. It is not. Reality is not always symmetrical.
  *Why:* Demanding symmetry ("both sides do it equally") forces false equivalence. A diagnostic tool must be able to identify a tumor without needing to find a matching tumor on the other side of the body. However, it must guard against *partisan* asymmetry (where the theorist's side is always the rational one).

  **5. The Persistence Puzzle (Preference)**
  *The Requirement:* Ideally, the account explains why exposure to unlabelled, reasonable arguments fails to shift views (your hypothetical).
  *The Case:* If belief were just information, exposure would work. It doesn't.
  *Why:* If the theory treats belief as purely informational, it will fail in the field. However, this leans heavily into social psychology. A sociological account can punt this to psychology, provided it acknowledges the gap exists.

  **6. The Galileo Test (Non-negotiable)**
  *The Requirement:* The account must distinguish between a marginalized group that is wrong (cranks) and a marginalized group that is right (prophets), without using hindsight ("they won eventually") as the criterion.
  *The Case:* You asked if the account owes you this separation. Yes, or it is merely a tool for orthodoxy to silence dissent.
  *Why:* The distinction is *methodological*, not *consensus-based*. The prophet follows standard epistemic norms (evidence, peer critique) but reaches unpopular conclusions. The crank rejects the norms themselves.

  **7. Structure vs. Agency (Non-negotiable)**
  *The Requirement:* The account must not conflate "she is arguing in bad faith" (individual) with "this is an echo chamber" (environment).
  *The Case:* You suspect conflating them is where bad commentary comes from. You are correct.
  *Why:* A good person can be trapped in a bad system. A bad person can exploit a good system. Blaming the individual for structural incentives is unfair; blaming the structure for individual malice is exculpatory.

  ***

  **TRADE-OFFS AND IMPOSSIBLE PAIRS**

  *   **The Galileo/Deference Tension:** Requirement 2 (Trust Experts) and Requirement 6 (Protect the Prophet) are in permanent tension. If you make the bar for "expert trust" too high, you empower cranks. If you make it too low, you enforce orthodoxy. No theory resolves this perfectly; it can only manage the friction. A theory that claims to solve this is selling magic.
  *   **Symmetry is a Preference, Not a Requirement:** You asked if even-handedness between left and right is a real desideratum. It is not. It is a political taste. Demanding a theory be symmetrical *in advance* biases it against reality. The requirement is *calibration* (R4), not symmetry.

  ***

  **THE KILLER REQUIREMENT**

  **Requirement 1 (The Isolation/Distrust Distinction)** does the most work against standard stories.
  *   *"It's their media diet"* fails because it assumes isolation, not distrust.
  *   *"Motivated reasoning"* fails because it assumes individual psychology, not systemic distrust.
  *   *"Tribal signaling"* fails because it assumes the content doesn't matter, whereas distrust is *about* the content's source.
  If the theory doesn't nail R1, it prescribes "show them the facts" for a problem that is actually "they don't trust your facts."

  ***

  **STANDARD STORIES SCORECARD**

  Most pundit theories fail R1 and R7, treating structural distrust as individual ignorance. They diagnose a lack of information where the actual pathology is a surplus of defeaters. Consequently, their proposed fixes (more dialogue, better algorithms) often deepen the polarization they claim to solve.
