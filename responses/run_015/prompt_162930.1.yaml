answer: |-
  This is a classic set of problems in the philosophy of mind and personal identity, specifically touching on the **Ship of Theseus**, the **Teletransportation Paradox**, and the **Fission Problem**. Your intuitions are actually quite consistent with a specific, defensible framework often used in bioethics and cognitive science, though you've correctly identified the friction points.

  You are looking for a principle that respects **Continuity**, **Uniqueness**, and **Phenomenology**.

  Here is a precise formulation of a principle that captures your verdicts, followed by the analysis you requested.

  ### The Principle: Continuous Causal Agency

  **Definition:** A patient survives a procedure if and only if the **locus of causal control** over their behavior and cognitive state moves through space-time without interruption, without duplication, and via a mechanism physically capable of sustaining subjective experience.

  This principle breaks down into three operative clauses. You can use these as the "Go/No-Go" criteria in your documentation.

  #### Clause 1: Direct Causal Handoff (Continuity)
  *The state of the new substrate must be caused directly by the state of the old substrate through physical interaction, not via abstracted information reconstruction.*
  *   **Motivating Case:** Distinguishes **Case 2** (One-shot swap) from **Case 4** (Scan & Replace).
  *   **Reasoning:** In Case 2, the silicon unit interfaces directly with the neighboring neurons; the causal flow is handed off like a baton in a relay race. In Case 4, the causal chain is broken; the information is copied, the original is destroyed, and a new chain is started elsewhere/later. Even if the result is identical, the *history* of the state is different.
  *   **Verdict:** Case 2 is Survival. Case 4 is Death.

  #### Clause 2: Singular Agency (Non-Branching)
  *At no point during the procedure may the causal chain bifurcate into two distinct, functional agents competing for the identity of the patient.*
  *   **Motivating Case:** Distinguishes **Case 5** (Rollback) from **Case 6** (Branch & Prune).
  *   **Reasoning:** In Rollback, the timeline is linear (A → B → A). In Branch & Prune, the timeline forks (A → B & C). Even if you delete C, the fission event (the creation of two valid agents) already occurred. Identity is a one-to-one relation; if it becomes one-to-many, it is broken for both.
  *   **Clarification on Case 3 (Shadow Mode):** The shadow unit is not an *agent*. Its outputs are discarded; it exerts no causal control over the body or the environment. It is a logger, not a competitor. Therefore, Clause 2 is not violated.
  *   **Verdict:** Case 5 is Survival. Case 6 is Prohibited (or Indeterminate Identity).

  #### Clause 3: Substrate Plausibility (Phenomenology)
  *The replacement substrate must be of a class physically presumed to support conscious experience, not merely input-output isomorphism.*
  *   **Motivating Case:** **Case 7** (Dark Substitutes).
  *   **Reasoning:** This clause acknowledges that behavior alone might not be sufficient (the "Philosophical Zombie" problem). It requires that the engineering model presumes consciousness supervenes on the physical structure being replicated.
  *   **Verdict:** If the mechanism is known or suspected to be "dark" (processing without experience), the procedure is a killing, regardless of behavioral output.

  ---

  ### Application to Your Three New Cases

  Here is how the **Continuous Causal Agency** principle handles the scenarios you haven't listed yet.

  #### 1. The Deep Sleep Procedure
  *Scenario:* The full substrate migration is performed while the patient is in continuous, dreamless general anaesthesia. They wake at the end.
  *   **Analysis:**
      *   **Clause 1:** Assuming the swap happens via Direct Causal Handoff (like Case 2), the causal chain is maintained even if neural activity is globally suppressed. The *potential* for causality remains intact in the structure.
      *   **Clause 2:** No branching occurs.
      *   **Clause 3:** Presumed valid.
  *   **Verdict:** **Same Person.**
  *   **Reasoning:** We already accept that people survive dreamless sleep or coma. The continuity of the *physical organism* preserves the causal chain even during inactivity. As long as the swap respects Clause 1 (physical handoff rather than scan/destroy), the anaesthesia is irrelevant.

  #### 2. The Vat Survival
  *Scenario:* The original biological tissue is removed, replaced by silicon, but the biological tissue is kept alive in a vat, disconnected from the body.
  *   **Analysis:**
      *   **Clause 1:** Valid for the body (silicon). Valid for the vat (biology).
      *   **Clause 2:** **VIOLATED.** You now have two functional agents. The body (silicon) interacts with the world. The vat (biology) is isolated but metabolically active and potentially conscious.
  *   **Verdict:** **Prohibited / Indeterminate Identity.**
  *   **Reasoning:** This is a variant of Case 6 (Fission). You have created two candidates. If the vat-tissue is conscious, you have not "moved" the patient; you have copied them and left the original in a tank. If the vat-tissue is merely biological meat without integration, it may be permissible, but if there is *any* capacity for experience in the vat, this violates Singular Agency. Your rule should require the destruction of the biological tissue *after* successful handoff to prevent this fission.

  #### 3. The Merge
  *Scenario:* Two copies are started from a checkpoint, run for a month, and then their states are mathematically merged back into a single unit which continues.
  *   **Analysis:**
      *   **Clause 1:** Valid locally.
      *   **Clause 2:** **VIOLATED.**
  *   **Verdict:** **Death of Both / New Entity.**
  *   **Reasoning:** Fission breaks identity. Fusion does not repair it. If you branch (Case 6), you have two people. Merging them is not "healing" the person; it is killing two distinct entities (who have diverged experiences) and creating a third who has memories of both. This is ethically worse than Case 6.

  ---

  ### The Hard Problem: Case 7 (Dark Substitutes)

  You asked for an honest account of Case 7. This is the most dangerous clause for your consent form.

  **Is it coherent?**
  In philosophy, this is the **Philosophical Zombie** argument.
  *   **Physicalist View:** If the input-output behavior and internal functional structure are identical down to the spike timing, *then* the experience is identical. Consciousness is what that processing *feels like*. On this view, Case 7 is physically impossible. If it walks like a duck and quacks like a duck, it is a duck.
  *   **Dualist/Property Dualist View:** Consciousness is a fundamental property that might not attach to silicon, even if silicon mimics neurons perfectly. On this view, Case 7 is possible.

  **What this does to your other verdicts:**
  If Case 7 is incoherent (Physicalism is true), you can drop Clause 3. You only need to verify structural/functional isomorphism.
  If Case 7 is coherent (Dualism is true), **you cannot verify safety.** No external test can distinguish a conscious unit from a dark unit.

  **Recommendation for the Rule:**
  You cannot write a rule that *guarantees* Clause 3, because you cannot measure qualia. However, you can write a rule that mandates **Mechanistic Plausibility**.
  *   *Consent Language:* "The procedure relies on the scientific consensus that functional isomorphism preserves consciousness. While we verify all behavioral and electrical outputs, we cannot metaphysically guarantee subjective experience persists."
  *   *Go/No-Go:* The "Go" condition must require that the silicon units are built on a theory of mind that *does not permit* zombies (e.g., Functionalism). If the company suspects the silicon might be "dark," they cannot proceed.

  ---

  ### Summary for Your Colleague

  If a colleague disagrees, here is the defense of your **Continuous Causal Agency** rule:

  1.  **It respects the intuition that process matters, not just state.** (Explains why Scan/Replace is death, but Swap is survival).
  2.  **It treats identity as a unique historical chain, not a pattern.** (Explains why Branching is forbidden, even if one branch is deleted).
  3.  **It acknowledges the limits of engineering.** (Admits we can't measure consciousness directly, so we mandate mechanistic plausibility).

  **The One-Sentence Rule for Documentation:**
  > "Substrate migration is permitted only if the transfer of causal control is continuous and singular, ensuring that at no point does the patient's functional agency bifurcate, cease, or rely on a mechanism theoretically incapable of sustaining consciousness."

  **Where you might have to compromise:**
  Your intuition on **Case 2** (One-shot swap) is the most philosophically vulnerable. Many ethicists argue Case 2 is identical to Case 4 (Scan/Replace). If your legal team is risk-averse, they may force you to treat Case 2 as higher risk than Case 1. However, for the purpose of internal consistency with *your* verdicts, the principle above holds.
