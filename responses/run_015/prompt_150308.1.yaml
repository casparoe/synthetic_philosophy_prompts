answer: |-
  To achieve clear thinking about public argument, one must resist the temptation to treat 'Western values' as a settled concept. As you rightly observe, the phrase often operates as a 'floating signifier', attaching itself to whatever the speaker wishes to defend or impose. To determine whether it performs genuine argumentative work or merely functions as a slogan, I would prioritise your proposed lines of inquiry in the following order.

  ### 1. The Conceptual Distinction: 'Western' vs. 'Modern' or 'Liberal'
  **Priority: First**

  **Reasoning:**
  Before one can assess the moral or rhetorical weight of the phrase, one must establish whether it possesses any semantic content distinct from related categories. In public discourse, 'Western values' are frequently used as a synonym for 'liberal democratic values' or simply 'modernity'. If this equivalence holds, the label 'Western' is historically contingent and argumentatively redundant.

  *   **The Test:** Ask whether the value in question (e.g., gender equality, free speech) is intrinsic to a specific historical-cultural trajectory (the 'West') or whether it is a functional requirement of complex, pluralistic societies (the 'Modern').
  *   **Why this comes first:** If the value is universal to modernity, invoking 'the West' introduces unnecessary geographical and cultural baggage that can obscure the rational justification for the value. For instance, if freedom of conscience is a prerequisite for a stable innovation economy, it is a 'modern' value adopted by Japan and South Korea as readily as by France or Germany. Insisting it is 'Western' in such a case is factually dubious and weakens the argument by making it vulnerable to charges of cultural imperialism. Clear thinking requires stripping away the historical label to see if the underlying principle stands on its own merits.

  ### 2. The Justificatory Basis: Universalist Claims vs. Particular Heritage
  **Priority: Second**

  **Reasoning:**
  Once you have established that the term is not merely a circular proxy for 'liberalism', you must interrogate the source of the value's authority. This addresses your concern about disguising universalist claims as particular cultural heritage.

  *   **The Test:** Determine whether the speaker is arguing that a value is *right for everyone* (universalist) or *right for us* (particularist).
  *   **Why this comes second:** This distinction dictates the rules of engagement. If a politician invokes 'Western values' to argue for human rights abroad, they are making a universalist claim; the 'Western' label is then a historical footnote regarding where these rights were codified, not a limit on who deserves them. However, if 'Western values' are invoked to resist immigration or critique minority cultural practices domestically, the claim is often particularist ('this is *our* way of life').
  *   **The Trap:** The phrase is most dangerous when it slides between these two modes. It claims the moral high ground of universal human rights whilst retaining the exclusionary power of a tribal boundary. Prioritising this inquiry exposes whether the argument relies on reason (which applies to all) or identity (which applies only to members).

  ### 3. The Rhetorical Function: Exclusionary vs. Inclusionary
  **Priority: Third**

  **Reasoning:**
  Finally, one should analyse the pragmatic effect of the phrase in a specific context. Does it serve to integrate individuals into a civic framework, or to mark them as perpetual outsiders?

  *   **The Test:** Observe who is permitted to embody these values. Can an immigrant 'hold' Western values, or are they viewed as inherently incapable of doing so due to their origin?
  *   **Why this comes third:** While sociologically vital, this is a consequence of the first two inquiries. If the values are defined as particular heritage (Inquiry 2) rather than universal ideals, the rhetorical function will almost inevitably be exclusionary. By resolving the conceptual and justificatory questions first, the rhetorical function becomes transparent. If the term is used to demand adherence to constitutional principles (Inquiry 1: Liberal/Modern), it can be inclusionary. If it is used to demand adherence to specific cultural norms (Inquiry 1: Particular/Western), it functions as a boundary marker.

  ### Summary for Public Argument
  If your aim is to avoid repeating slogans, you should pursue the **Conceptual Distinction** first.

  Until it is clear whether 'Western values' refers to a specific cultural lineage (e.g., Christendom, the Enlightenment) or to general principles of governance (e.g., rule of law, individual liberty), the debate cannot progress. In British public discourse, conflating the two allows speakers to critique 'Western decline' whilst advocating for 'modern progress', or vice versa, without acknowledging the contradiction.

  By forcing the definition to be precise, you often find the phrase 'Western values' dissolves. It either becomes 'liberal democratic values' (which can be argued for on rational grounds) or 'cultural traditions' (which must be argued for on grounds of heritage and identity). Keeping these separate prevents the smuggling of cultural preferences into the guise of universal rights, which is the primary source of confusion in this debate.
