prompt: |-
  I've been thinking about the phrase "Western values" — people invoke it to cover everything from free expression and secular governance to particular family structures or economic habits, and I'm unsure whether it names a coherent tradition or just serves as a rhetorical bundle in debates about immigration, education, and corporate ethics. Rather than treating it as a simple list, I'm interested in whether it functions mainly as a cultural boundary-marker or as a set of regulative ideals that could apply universally. Given that ambiguity, which open questions about the category's coherence and practical use matter most? Specifically, I'd ask you to prioritise — with reasons — the lines of inquiry that would actually help someone assess whether the phrase does real argumentative work: for example, whether it disguises universalist claims (such as human rights) as particular cultural heritage, whether it can be distinguished consistently from "modern" or "liberal" values without circularity, and how its rhetorical function shifts between exclusionary and inclusionary contexts. Which of these should be pursued first if one's aim is clear thinking about public argument rather than repeating slogans? Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The coherence and utility of the phrase "Western values."
      *   **Core Tension:** Is it a coherent tradition or a rhetorical bundle/boundary-marker? Is it particularist (cultural heritage) or universalist (regulative ideals)?
      *   **Task:** Prioritise specific lines of inquiry that help assess whether the phrase does "real argumentative work" vs. being a slogan.
      *   **Specific Examples Given by User:** Disguising universalist claims as particular heritage, distinguishing from "modern/liberal" values without circularity, rhetorical shifts (exclusionary vs. inclusionary).
      *   **Goal:** Clear thinking about public argument.
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Problem:**
      *   The term "Western values" is notoriously slippery. It often conflates geography, history, politics, and culture.
      *   It is often used performatively (to signal belonging or exclusion) rather than descriptively.
      *   To determine if it has argumentative weight, we need to test its definitional stability and its functional utility in discourse.

  3.  **Evaluate the Proposed Lines of Inquiry:**
      *   *Inquiry A: Universalism vs. Particularism.* (Does it disguise human rights as "Western"?) This is crucial because it addresses the moral weight of the claim. If values are universal, calling them "Western" is historically contingent but morally limiting. If they are particular, imposing them is imperialistic.
      *   *Inquiry B: Distinction from "Modern/Liberal".* (Is it circular?) This addresses conceptual clarity. If "Western" just means "liberal democracy," then "Western values" is redundant. If it means something else (e.g., Christian heritage, specific family structures), does it hold up?
      *   *Inquiry C: Rhetorical Function.* (Exclusionary vs. Inclusionary.) This addresses the *purpose* of the phrase in debate. Is it used to integrate immigrants or to bar them?

  4.  **Prioritisation Strategy:**
      *   To achieve "clear thinking about public argument," one must first establish *what is being claimed* before analysing *why it is being claimed*.
      *   Therefore, conceptual clarity (Inquiry B) must come first. If we don't know what the term denotes, we can't analyse its moral status (Inquiry A) or its rhetorical effect (Inquiry C).
      *   However, the user asks for the lines of inquiry that matter *most* for assessing argumentative work.
      *   *Priority 1: The Substitution Test (Modern/Liberal vs. Western).* If the term adds nothing to "liberal democratic values," it's obfuscation. This is the foundational logical check.
