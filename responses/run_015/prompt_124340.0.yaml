answer: |-
  This is a profound question that cuts to the heart of historiography and the philosophy of history. You are asking about the **ontology of the narrative**.

  The difference between "a historical kernel wrapped in legend" and "legend that grabbed real debris" is not just a matter of *how much* evidence we have, but **what relationship the evidence bears to the plot.**

  Here is the breakdown of the epistemic hinge, the criteria that flip the framing, and how it applies to your examples.

  ---

  ### 1. The Two Models of Truth

  To understand the hinge, we have to define the two opposing models of how these stories relate to reality.

  **Model A: The Distorted Photograph (Kernel in Legend)**
  *   **Premise:** The narrative is fundamentally a *report* of an event.
  *   **Mechanism:** Oral transmission acts like a game of "telephone." Names change, numbers inflate, gods are inserted to explain luck.
  *   **Epistemic Claim:** If you strip away the magic and exaggeration, the **causal chain of the plot** remains intact. (e.g., "A coalition attacked this city *because* of a political grievance.")
  *   **Role of Archaeology:** Archaeology serves to **verify the setting and the occurrence.**

  **Model B: The Painting of a Landscape (Legend with Debris)**
  *   **Premise:** The narrative is fundamentally a *myth* (ideological, theological, or etiological).
  *   **Mechanism:** Later generations see ruins, experience social pressures, or need a founding identity. They look at the "debris" (ruins, old weapons, place names) and invent a story to explain them.
  *   **Epistemic Claim:** The **causal chain of the plot is fictional.** The physical reality is merely the *prompt* for the story, not the *subject* of it.
  *   **Role of Archaeology:** Archaeology serves to **explain the origin of the myth,** not verify the story.

  ### 2. The Epistemic Hinge: Specificity and Causality

  The "flip" doesn't happen because we find *a* ruin. It happens based on **Narrative Specificity** and **Causal Linkage.**

  #### Criterion 1: Does the evidence support the *Plot* or just the *Setting*?
  *   **Debris Frame:** You find a destroyed city (Troy VIIa). This confirms the *setting* (a city was destroyed). It does not confirm the *plot* (it was destroyed by Greeks because of a queen). The destruction could be an earthquake, a civil war, or a Hittite raid.
  *   **Kernel Frame:** To flip to "Kernel," you need evidence that links the destruction to the *specific agents and motivations* in the story.
  *   **The Hinge:** If you find a Linear B tablet at Hisarlik saying "Blockaded by Agamemnon," it flips to Kernel. If you find a Hittite tablet saying "Wilusa was sacked by Ahhiyawa," it moves toward Kernel (geopolitically) but stays Debris (narratively, regarding Helen/Achilles).

  #### Criterion 2: Is the story Etiological?
  *   **Debris Frame:** Many ancient myths are **etiological**—they exist to explain why a ruin is there. "Why is this wall cyclopean? Because giants built it." "Why is this city burned? Because a hero sacked it."
  *   **The Hinge:** If the story fits *too perfectly* as an explanation for the physical remains, it is likely Legend with Debris. If the story contains details that are *inconvenient* or *invisible* to the archaeology (e.g., specific diplomatic insults, internal betrayals that leave no trace), it is more likely a Kernel.

  #### Criterion 3: The Chronological Gap (The "Dark Age" Problem)
  *   **Debris Frame:** If there is a 400-year gap between the event and the recording of the story (as with Homer and the Bronze Age Collapse), the "Debris" model is stronger. Memory does not survive 15 generations without radical transformation.
  *   **Kernel Frame:** Requires a mechanism of preservation (writing, continuous cult practice) that bridges the gap.
  *   **The Hinge:** The flip occurs if you find **contemporary corroboration.** If the Exodus is recorded in Egyptian logs *at the time*, it's a Kernel. If it appears 600 years later during the Babylonian Exile (when Jewish identity needed shoring up), it is likely Legend using older debris/traditions.

  ### 3. Applying the Hinge to Your Examples

  #### The Trojan War
  *   **Current Status:** **Hybrid.**
  *   **The Debris:** Hisarlik exists. There are destruction layers (c. 1180 BCE). The geography matches.
  *   **The Kernel:** Hittite texts mention "Wilusa" (Troy) and "Ahhiyawa" (Achaeans/Greeks) in conflict. This proves a geopolitical conflict existed.
  *   **The Flip:** It flips to "Kernel" regarding the **existence of a war**, but remains "Debris" regarding the **Homeric narrative.**
  *   **Why?** The archaeology confirms *conflict*, but not *cause*. The story of Helen is likely the "Legend grabbing Debris." The historical reality was likely trade route contention; the legend turned economics into eros.

  #### King Arthur
  *   **Current Status:** **Legend with Debris.**
  *   **The Debris:** Post-Roman Britain was chaotic. Saxon invasions happened. Battles (like Badon Hill) likely occurred. Roman ruins were visible everywhere.
  *   **The Kernel:** Almost non-existent. No contemporary texts name Arthur. The first mentions are centuries later.
  *   **The Flip:** To flip to Kernel, you would need a 6th-century inscription or text naming a *Dux Bellorum* Arthur who won Badon.
  *   **Why it stays Debris:** The narrative (knights, chivalry, holy grail) is anachronistic. It projects 12th-century feudal values onto 6th-century tribal warfare. The story is using the "debris" of the Saxon invasion to create a myth of British unity.

  #### The Exodus
  *   **Current Status:** **Legend with Debris (Theological Truth, Historical Fiction).**
  *   **The Debris:** Semitic people lived in Egypt (Hyksos). There were slave laborers. The Sinai was traversed by nomads.
  *   **The Kernel:** No archaeological trace of 2 million people wandering for 40 years (no pottery, no graves, no campsites). Egyptian records mention no such mass departure.
  *   **The Flip:** To flip to Kernel, you need evidence of the **scale** and the **event.** A small group (a "Levite" tribe) escaping is plausible (Kernel), but the national founding narrative as written is likely a consolidation of various smaller memories (Debris).
  *   **Why it stays Debris:** The story functions as a **constitution**, not a chronicle. It explains *who Israel is* (liberated slaves), not necessarily *what happened*. The "debris" here is the cultural memory of oppression, not physical ruins.

  ### 4. The Actual Criteria That Flips the Framing

  If you want to know when a historian stops saying "myth inspired by reality" and starts saying "history embellished by myth," look for these three things:

  1.  **Falsifiable Specificity:** Does the story make a claim that *could* be proven wrong by archaeology, and isn't?
      *   *Example:* If Homer said Troy was inland, and it's on the coast, it's Legend. He got the location right. That's a point for Kernel.
      *   *Example:* If the Bible says the Israelites conquered cities with specific destruction layers at the same time, and the layers match... (Spoiler: They don't. Jericho was already ruins when Joshua arrived). That keeps it in Debris.

  2.  **Invisible Details:** Does the story contain details that serve no mythic purpose but are historically accurate?
      *   *Example:* In the Iliad, the description of a specific shield or a diplomatic protocol that matches Hittite records but adds nothing to the drama. That suggests a **Kernel**.
      *   *Example:* If every detail serves a moral or theological point (e.g., the walls of Jericho falling to horns), it suggests **Legend**.

  3.  **Independent Attestation:** Is the event mentioned by people who had no stake in the myth?
      *   *Kernel:* Hittites mentioning Wilusa.
      *   *Debris:* Only the Israelites mentioning the Exodus; only the Britons mentioning Arthur.

  ### Summary

  The epistemic hinge is **Causality vs. Correlation.**

  *   **Kernel:** The physical evidence is the **effect** of the story's cause. (The war caused the burn layer).
  *   **Debris:** The physical evidence is the **cause** of the story's creation. (The burn layer caused the story of the war).

  When you dig up Hisarlik, you find a burn layer. That proves *something* burned. It does not prove *Agamemnon* burned it. Until you find a receipt signed by Agamemnon, the default epistemic position must be **Legend that grabbed real debris.** The burden of proof is on the "Kernel" theorist to show that the *narrative specifics* survived the centuries, not just the memory of the ruins.

  Most professional historians now view these stories not as "distorted history" but as **"cultural memory."** They are real artifacts of how later people understood their past, using the debris of the actual past as building materials for their identity.
