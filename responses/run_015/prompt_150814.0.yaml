answer: |-
  The central tension revealed by the impossibility result lies in the fundamental incompatibility between democratic fairness and mechanical honesty. When a collective decision-making mechanism is designed to be non-dictatorial and allows individuals to hold any possible preference ordering over three or more alternatives, it inevitably creates situations where an individual can benefit by misrepresenting their true views. This is not merely a flaw of specific voting systems, such as plurality or rank-choice methods, but a structural property of any deterministic aggregation rule. The logic proceeds from the interdependence of choices: with three or more options, the outcome is not determined by a simple pairwise contest but by the complex interaction of all submitted preferences. Consequently, a voter may find that voting for their genuine favourite leads to their least preferred outcome, whereas voting insincerely for a compromise candidate secures a more favourable result. The theorem proves that if you forbid this strategic behaviour, you must either restrict the permissible preferences to a degree that undermines democratic freedom, or concede decision-making power to a single dictator.

  Introducing hard constraints, such as vetoing any policy bundle exceeding a specific carbon-tax threshold, appears to offer a escape route by narrowing the domain of admissible preferences. In social-choice theory, restricting the domain—for instance, ensuring all preferences are single-peaked—can indeed restore strategy-proofness under certain conditions. By declaring certain outcomes categorically unacceptable, voters effectively remove them from the choice set, potentially simplifying the aggregation problem. However, this solution collapses when the constraints themselves are subject to individual declaration rather than being fixed externally by the mechanism. If voters possess the agency to define what constitutes a hard constraint, the constraint becomes another variable in their strategic calculus.

  Conceptually, the incentive to manipulate does not vanish; it merely relocates from the ranking of acceptable options to the framing of the constraints themselves. A voter might not truly view a specific carbon-tax threshold as morally or practically unacceptable, yet they may declare it so to eliminate a rival policy bundle that threatens their preferred outcome. In this scenario, the veto power functions as a strategic weapon rather than a genuine expression of inviolable principle. The mechanism remains vulnerable because the input data—whether a ranking or a constraint—is provided by self-interested agents who anticipate the outcome. Unless the constraints are imposed exogenously by the rules of the system rather than endogenously by the voters, the logical fracture remains intact. The system simply exchanges one form of insincerity for another, trading lying about order for lying about limits.

  Ultimately, allowing voters to impose hard constraints does not eradicate strategic manipulation but merely displaces the incentive to lie from the ranking of acceptable options to the definition of acceptability itself.
