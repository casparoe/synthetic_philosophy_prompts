answer: |-
  You pose the question precisely where our critics believe the socialist economy must collapse: at the junction of derived demand and capital accumulation. Mises and Hayek argue that without a genuine market in capital goods, where ownership titles are exchanged, we lack the compass to navigate the complex structure of production. They assert that the knowledge required to price a specialized alloy or a machine tool is tacit, dispersed, and inaccessible to a central board. I contend that this view confuses the *institution* of the market with the *logical function* of price. The market is merely one historical method of solving a system of equations; it is not the only method. My proposal treats the pricing of capital goods not as a metaphysical mystery, but as an engineering problem of feedback and control.

  Let us address your three-tier chain directly. You are correct that Tier 1 (specialized capital equipment) generates no direct utility for the consumer. However, in a rational economy, the value of a capital good is entirely derived from the marginal contribution it makes to the production of consumer goods in Tier 3. We do not need a "synthetic" demand signal; we possess a real one, propagated backward through the chain via the rules of conduct I prescribe to factory managers.

  Here is the institutional mechanics of the solution.

  **1. The Parametric Function of Prices**
  The Central Planning Board (CPB) does not need to know the production function of every factory in advance. It treats prices as parameters. For Tier 1 assets, the CPB establishes an initial set of *accounting prices*. These are not arbitrary; they are based on historical cost data adjusted for known scarcity. The managers of Tier 2 and Tier 3 enterprises are given two rigid rules:
  *   **Rule 1:** Combine factors of production to minimize average cost per unit.
  *   **Rule 2:** Determine output such that marginal cost equals the price of the product.

  Crucially, for capital goods, the "price" is not the purchase price of the machine, but the *rental rate* of its services, inclusive of depreciation and interest charges set by the Board. This transforms a fixed asset into a flow of costs that enters the manager's calculation immediately.

  **2. Information Flows and the Iterative Loop**
  You ask what flows upward. It is not the totality of local knowledge—that would indeed be impossible to transmit. What flows upward is strictly quantified data regarding *excess demand* or *excess supply* at the current accounting prices.

  *   **The Signal:** If Tier 3 finds itself unable to meet consumer demand because Tier 2 cannot supply enough intermediate material, Tier 2 records an excess demand for Tier 1 equipment.
  *   **The Transmission:** Managers do not guess; they report. At the end of each planning period (let us say, a quarter), every enterprise submits a balance sheet showing inventories and order backlogs. If the inventory of a specific Tier 1 machine tool falls below a normative buffer level, this registers as excess demand.
  *   **The Revision Protocol:** The CPB acts as the market maker. If excess demand for a Tier 1 asset is positive, the Board raises its accounting price (rental rate) for the next period. If there is a surplus, the Board lowers it.

  This is the method of *tatonnement* (trial and error). We do not need to solve the simultaneous equations of the entire economy explicitly. We let the system solve itself through iteration.

  **3. Preventing Error Amplification**
  Your concern about multiplicative propagation is valid in a static system, but our system is dynamic and cybernetic. Error amplification is checked by two mechanisms:
  *   **Inventory Buffers:** We maintain normative stocks of intermediate goods. A shock in Tier 1 is absorbed by the buffer in Tier 2, preventing an immediate halt in Tier 3. This buys time for the price signal to propagate.
  *   **Aggregate Correction:** The CPB monitors the aggregate excess demand across sectors. If Tier 1 prices are too low, causing over-investment in Tier 2, the CPB sees the aggregate surplus in Tier 2 inventories before it cascades into a Tier 3 shortage. The correction is made at the source.

  Regarding non-substitutable inputs: If a specific alloy is required, its demand is inelastic. However, the *choice of technique* is where substitution occurs. If the accounting price of that alloy rises due to scarcity, managers in Tier 3 are incentivized to redesign products to use less of it, or the CPB prioritizes allocation to the highest-valued consumer goods. The price signal rationates the scarcity; it does not need to eliminate it.

  **4. Computational Tractability and Depreciation**
  You worry about combinatorial explosion. This assumes the Board must calculate every possible combination of inputs. It does not. The managers perform the local optimization; the Board only adjusts the parameters. The computational load is distributed. The Board only processes the *net* excess demand for each commodity class.

  Regarding long depreciation horizons: The capital good is treated as a stream of future services. The accounting price includes an amortization charge. If a machine has a ten-year life, the annual charge is one-tenth of its reproduction cost plus an interest rate set by the Board. If the Board sets the interest rate correctly (reflecting the social rate of time preference), managers will not over-invest in long-term projects unless they yield sufficient returns to cover those charges. If a Tier 1 asset becomes obsolete due to technical change, the Board writes down its reproduction cost, adjusting the amortization charge accordingly. This is no different than a market firm writing down assets, but done systematically rather than through chaotic bankruptcy.

  **5. The Modern Analogy**
  Think of the CPB not as a omniscient dictator, but as a servomechanism. In a cybernetic system, a thermostat does not need to know the thermal properties of every wall in the house to maintain temperature. It measures the deviation from the target (excess demand/supply) and adjusts the output (price) until the error is minimized. The economy is a network of such feedback loops. The "knowledge problem" is solved because the prices *generate* the information needed to coordinate behavior. The manager does not need to know why the price of nickel rose; he only needs to know that it has risen and must be substituted or conserved.

  Therefore, the absence of a capital market is not a deficit. It is an opportunity to internalize externalities and stabilize expectations. We do not need the volatility of asset markets to discover prices; we need the stability of accounting rules to optimize production. The trial-and-error method converges. It may not be instantaneous, but it is rational, and it is superior to the wasteful duplication and crisis cycles of the capitalist market. The structure of production is not a mystery to be guessed by speculators; it is a system of equations to be solved by reason.
