answer: |-
  ### The Handout: Two Arguments

  **Argument 1 (The Clinic)**
  1. This heart pumps blood through the body.
  2. This heart is not pumping blood through the body.
  3. Therefore, this heart is failing to do what it ought to do.

  **Argument 2 (The Workshop)**
  1. This pump moves water through the pipe.
  2. This pump is not moving water through the pipe.
  3. Therefore, this pump is failing to do what it ought to do.

  ***

  ### The Breakdown

  **Why the First Argument Cheats**
  A defender of the Is-Ought gap says Argument 1 smuggles a normative standard into a descriptive fact. Premise 1 ("This heart pumps blood") is a biological generalization—it describes what hearts *do*, not what they *must* do. To jump to the conclusion that the heart is *failing* (a normative judgment of defect) requires a hidden premise: that nature has goals. But in a naturalistic framework, a heart is just matter in motion; if it stops, it's just a different state of affairs, not a violation of a rule. The argument treats an evolutionary regularity as if it were a binding instruction.

  **Why the Diagnosis Doesn't Land on the Second**
  Argument 2 is structurally identical, but the ontology of the subject changes the logic. A pump is not just matter in motion; it is an artifact. Premise 1 ("This pump moves water") describes a capacity, but the *kind* of thing a pump is includes a history of intentional creation. The "ought" in the conclusion is grounded in the **Intentional Design** of the object. The pump has a standard of correctness external to its current physical state because a mind imposed a function upon it. The normativity isn't derived from the *fact* that it moves water, but from the *fact that it was built to* move water.

  **The One Feature**
  The separating feature is **Intentional Teleology** (purpose imposed by a designer).
  *   In Argument 2, the purpose is real and historical (someone built it *for* this end).
  *   In Argument 1, the purpose is metaphorical (we speak *as if* the heart has a goal, but no one built it).

  **The Collapse**
  If you delete **Intentional Teleology** from Argument 2—if you treat the pump as merely a physical object that happens to move water, with no designer, no blueprint, and no intended function—the argument collapses back into Argument 1. It becomes: "This object moves water. It is not moving water. Therefore, it is failing." Without the designer, there is no standard of correctness, only a change in state. The "ought" vanishes, leaving only an "is."

  **The Strongest Objection (Steelmanned)**
  "Design is just a physical chain of causes—neurons firing in a designer's brain resulting in assembly—which is no more metaphysically 'normative' than evolutionary pressure selecting for hearts. If you ban deriving 'ought' from the blind causality of evolution, you must also ban deriving it from the blind causality of human manufacturing."

  ***

  ### Honesty Check: Where the Spec Bends

  I need to flag one shortfall for your section. The "ought" in Argument 2 is a **functional ought** (this object is defective), not necessarily a **moral ought** (this action is wrong). Strictly speaking, neither argument derives a *moral* obligation without smuggling in a human desire (e.g., "you ought to fix it *if* you want the system to work").

  **What this shows about the gap:**
  This shortfall *is* the lesson. It demonstrates that even in the best-case scenario (artifacts), we only get norms relative to a purpose. In the natural world (Argument 1), where there is no designer to hold the purpose, we get no normativity at all. The gap remains because "function" alone buys you correctness, but not morality.
