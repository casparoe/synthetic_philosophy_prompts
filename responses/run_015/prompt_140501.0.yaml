prompt: |-
  hey — I'm putting together a one-page handout for the intro ethics section I'm TAing, and what I really want is one paired example I can put on the board rather than another wall of theory. The topic is the is-ought gap and the naturalistic fallacy, and first-years glaze over the moment anyone says the words Hume or Moore, so I want to sneak the whole problem in through a concrete case.

  Ive been arguing with a friend who thinks the gap is basically a philosopher's superstition — that you can't get an ought from an is is just a slogan people repeat because someone said something like it a few centuries ago, and that any time a factual argument seems to deliver a normative conclusion, either the conclusion was hidden in the premises all along or the argument was fine and the slogan is wrong. I want to corner him with two arguments that are structurally identical: same number of premises, same shape of inference, same kind of move from purely factual premises to a conclusion that says what's wrong with something or what somebody should do about it. The first one should be an obvious cheat of the naturalistic-fallacy sort, and the second should not be — and there should be exactly one feature separating them, something I can point at with my finger.

  Constraints, because he will cheat if I leave him room. Both arguments have to be realistic: a clinic, a farm, a workshop, a server room — no possible worlds, no demons, no torturing innocents for fun, no one being pushed onto tracks. No institutional vocabulary anywhere in the premises: no promises, contracts, rules, laws, roles, offices, or anyone's having been hired to do anything — I specifically don't want the promise-style trick where the normativity is smuggled in by what a word means. So also no definitions or conceptual analysis doing the work. No hypothetical imperatives either: nothing of the form 'if you want X, do Y', and the conclusion should look like it binds regardless of what anyone in the story happens to want. And the premises should be the sort of thing a technician, a nurse, or a vet could actually go and check.

  My own guess, which you should feel free to overrule, is that the feature doing the work has something to do with the difference between a purpose that was actually deliberately built into a thing by somebody, and a purpose that is only as-if — the way people say what an organ, or an evolved disposition, is 'for'. If that's wrong, say so and use whatever feature is actually seperating them.

  Deliverable: give me both arguments, a short paragraph each, visibly the same form. Then walk through them — why a defender of the strict gap says the first one cheats, and be precise about which premise or which inferential step is doing the cheating; why that same diagnosis doesn't land on the second; name the one feature; and then delete that feature from the second argument and show me it collapses back into the first. Finish with the strongest two-sentence objection my friend could make against the second argument, steelmanned rather than a strawman. And if the honest answer is that the spec can't be met in full, say that, build the closest case you can, flag exactly where it falls short, and tell me what the shortfall itself shows about the gap.
