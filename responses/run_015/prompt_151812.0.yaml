answer: |-
  **Project Title:** The Negative Coalition Hypothesis: Testing the Coherence of the Left/Right Axis in Label-Free Governance

  **1. The Precise Research Question**
  Is the contemporary Left/Right political axis a coherent ideological spectrum grounded in shared first principles (e.g., equality vs. liberty, progress vs. tradition), or is it a "negative coalition" held together primarily by shared antagonism toward an outgroup?

  Specifically: When partisan labels are removed, do political cleavages reproduce the Left/Right split, or do they fragment along orthogonal lines (e.g., pragmatism vs. purity, centralization vs. decentralization)?

  **2. Intellectual Merit: Why Standard Answers Miss the Mark**
  Current political science literature generally falls into two traps regarding this question:

  *   **The Essentialist Trap:** Assumes the axis is real and maps it onto stable values (e.g., Jost et al.'s *uncertainty-threat* model or the classic *equality-hierarchy* dichotomy). This fails to explain why self-identified allies frequently fracture on policy details that should, by principle, unite them. It assumes coherence where there may only be branding.
  *   **The Obsolescence Trap:** Argues the axis is dead or replaced by cultural populism. This misses the empirical reality that the labels *still function* to organize behavior, even if the ideological content is hollow.

  Both approaches assume the axis is defined by what proponents *want*. This project tests the hypothesis that the axis is defined by who proponents *hate*. If the Left/Right split is a negative coalition, removing the "enemy" label should cause the coalition to dissolve into issue-specific factions.

  **3. Methodology and Scope (3 Months)**
  This project utilizes a comparative case study approach, treating "label-free" governance spaces as natural experiments. We will not conduct new surveys (too slow/costly) but will perform structured discourse analysis on existing public records.

  **Case Studies:**
  1.  **Open-Source Software (OSS) Governance:** Examination of mailing list archives and RFC (Request for Comments) debates in two major projects (e.g., Linux Kernel vs. a Python working group). These spaces have high-stakes resource allocation and rule-making but no formal party labels.
  2.  **Local Zoning Boards:** Analysis of meeting minutes from three mid-sized municipalities. Zoning fights involve density, property rights, and community aesthetics—issues that map onto national politics but are voted on by individuals without party ballots.

  **Data Analysis:**
  *   **Coalition Mapping:** Identify recurring factions in disputes.
  *   **Rhetorical Coding:** Code arguments for ideological content (e.g., appeals to tradition, equity, efficiency) vs. antagonistic content (e.g., ad hominem, defense against "takeovers").
  *   **Cross-Walk:** Determine if the factions in OSS/Zoning align with national Left/Right positions or if they form novel clusters (e.g., "Speed vs. Stability" in OSS).

  **Timeline:**
  *   **Month 1:** Literature review finalize coding schema; select specific archives/boards.
  *   **Month 2:** Data extraction and rhetorical coding of disputes.
  *   **Month 3:** Comparative analysis and drafting of final paper.

  **4. Significance: What Result Actually Matters?**
  *   **If the Hypothesis Holds (Negative Coalition):** It suggests polarization is not a clash of visions but a coordination game based on threat perception. This implies that standard "dialogue" interventions are doomed; you cannot negotiate principles that do not exist. Political reform must focus on decoupling identity from opposition.
  *   **If the Hypothesis Fails (Coherence Found):** If Left/Right splits *do* emerge in label-free zones (e.g., zoning hawks align perfectly with national conservatives), it suggests the axis is deeply rooted in psychological or material dispositions, not just partisan branding. This validates current ideological modeling.

  **5. Risk and Definition of Failure**
  *   **Scientific Failure:** A null result (inconclusive data) is the only true failure. This would occur if the archives are too sparse to map coalitions or if the rhetoric is too ambiguous to code. *Mitigation:* Pre-registering the coding schema and selecting high-traffic archives ensures sufficient data density.
  *   **Hypothesis Failure:** If we find that Left/Right principles *do* persist without labels, the hypothesis is falsified. This is a successful scientific outcome, not a project failure, as it strengthens the case for ideological realism.
  *   **Scope Risk:** The 3-month timeline is tight. To mitigate, analysis is limited to *conflict events* only (e.g., contested votes), ignoring uncontested governance.

  **6. Budget Justification**
  Funding is requested for 3 months of researcher stipend (0.5 FTE) and access fees for proprietary legal/zoning databases. No travel or human subject costs are incurred.

