answer: |-
  **Scenario**
  In a reliability-engineering inquiry into lithium-ion battery degradation, engineers confront a known statistical regularity ($E$): capacity fade follows a distinct "knee-point" trajectory, remaining linear for 80% of the cycle life before dropping sharply, a pattern observed across thousands of cells for five years. The standing theory ($R$) models degradation as Solid Electrolyte Interphase (SEI) growth, which predicts monotonic decay; to accommodate $E$, $R$ is conjoined with an auxiliary ($A$) positing stochastic particle cracking that accelerates SEI growth, a mechanism independently motivated by microscopy studies unrelated to the knee-point. A novel theory ($T$) is proposed, positing a thermodynamic phase-separation mechanism within the electrode material, introducing a "miscibility gap width" ($\omega$) inexpressible in $R$'s kinetic language. $T$ predicts the knee-point probabilistically as a natural consequence of $\omega$ exceeding a threshold, yielding a likelihood $P(E|T) \approx 0.95$, roughly equal to $P(E|R \land A) \approx 0.95$. $T$ offers no novel predictions yet; its only empirical credential is its accommodation of the known knee-point $E$.

  **The Check**
  Standard conditionalization fails immediately: because $E$ is a known regularity, $P(E) = 1$, so $P(T|E) = P(T) \cdot P(E|T) / 1 = P(T)$; learning $E$ provides no probabilistic boost to $T$. The Garber-style fix—updating not on $E$ but on the proposition that "$T$ probabilifies $E$"—also yields no *comparative* advantage, because the rival package $R \land A$ also probabilifies $E$ to the same degree; the likelihood ratio is unity, so the posterior odds equal the prior odds. Glymourian bootstrapping is unavailable because the connection between $T$ and $E$ is stochastic: one cannot deduce a specific value of the novel quantity $\omega$ from $E$ and $T$ alone, nor can one compute a unique instance of the theory from the data without additional assumptions about initial conditions. Thus, on standard likelihoodist or deductive accounts, $E$ is evidentially inert regarding the choice between $T$ and $R \land A$.

  **The Hard Part**
  The support $E$ provides for $T$ lives not in the likelihoods but in the **structural constraints on the prior odds** of the theoretical packages. While $A$ is independently motivated, the package $R \land A$ explains $E$ via a *conjunction* of distinct causal mechanisms (SEI growth *and* particle cracking), whereas $T$ explains $E$ via a *unified* mechanism (phase separation). In assessing the priors $P(T)$ and $P(R \land A)$, rational agents penalize the conjunctive complexity of $R \land A$ relative to $T$ because conjunctive explanations are structurally more fragile: they require the coincidence of two independent processes to generate the regularity $E$, whereas $T$ requires only one. This is not a stipulation of taste but a derivation from the **risk of explanatory coincidence**: the probability that two independent mechanisms ($R$ and $A$) align to produce the specific "knee" shape is intrinsically lower than the probability that a single mechanism ($T$) designed to capture phase transitions produces it, even if the fitted likelihoods are currently tied. Consequently, the structural unity of $T$ relative to $E$ rationally shifts the prior ratio $P(T)/P(R \land A)$ in favor of $T$ once $T$ is articulated, allowing $E$ to support $T$ over $R \land A$ despite $P(E)=1$ and tied likelihoods.

  **Diagnosis**
  The feature doing the work is the **disparity in theoretical unity** regarding the evidence: $T$ unifies $E$ under a single core postulate, while $R \land A$ accommodates $E$ through a conjunction. If this feature is removed—for instance, if $T$ also required an auxiliary $B$ to fit the knee-point—the structural advantage vanishes, and $E$ ceases to support $T$ over the rival, reducing the choice to mere prior prejudice. Similarly, if $A$ were dropped and $R$ faced $T$ alone, the support would revert to a standard likelihood difference ($P(E|T) \gg P(E|R)$), dissolving the structural problem. The strict conditionalizer would attack this case by insisting that priors are subjective and that structural virtues like unity are pragmatic, not epistemic; they would argue that without a likelihood boost, preferring $T$ is merely an aesthetic choice. The likelihoodist would argue that if $P(E|T) = P(E|R \land A)$, the evidence is strictly neutral, and any preference for $T$ violates the Likelihood Principle. However, both opponents fail because they ignore that theoretical structure constrains the *space of possible worlds* in which $E$ occurs; a unified theory makes $E$ less coincidental than a conjunctive rival, which is an epistemic, not merely pragmatic, advantage in preventing overfitting to known data. Thus, the case settles that the problem of old evidence is not about updating on $E$, but about how the *structural relation* between a theory and old evidence rationally constrains the assessment of theoretical packages when likelihoods are exhausted.
