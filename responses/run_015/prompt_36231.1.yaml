          *   *However:* Dan's *interpretation* ("just inconsistency") is dismissive. Maya's *interpretation* ("EUT has a hole") is theoretically robust.
          *   *Adjudication:* I need to split this. Dan is right on the behavioral prediction (likely). Maya is right on the theoretical implication (if the behavior exists). But since Maya made a specific prediction ("totally fine"), I have to penalize her if the data says otherwise.
          *   *Actually:* There is evidence both ways. Some find reduction holds, some find it doesn't. I will flag this as low confidence.

  5.  **Analyze Move (4): Normative vs. Descriptive & Heterogeneity.**
      *   *Dan's Claim:* "Ambiguity aversion" is a mix of types (risk averse, paranoid, etc.). Theory wasn't refuted, just applied to noisy people. (Defense of EUT as normative).
      *   *Maya's Claim:* The paradox is about *coherence*. The pattern is inconsistent with *ANY* probability assignment + utility. EUT as a *normative* theory has a hole.
      *   *Analysis:*
