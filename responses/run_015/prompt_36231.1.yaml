          *   *Who is right?* Maya is technically right about the *inconsistency*. The preferences *cannot* be represented by a subjective probability measure. Dan is right that you can *keep* EUT as a norm and call people irrational.
          *   *The "Paradox":* The paradox exists because the preferences feel *intuitive* (normatively appealing) yet violate the theory. If they were just "noisy people," it wouldn't be a paradox, it would be an error. The fact that Nobel laureates (Ellsberg, Schmeidler, Gilboa) argue the preferences are *reasonable* is the key.
