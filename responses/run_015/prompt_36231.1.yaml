          *   Maya is empirically right. Experiments (e.g., by Slovic, Tversky, etc.) control for deception. When the mechanism is transparent (random number generator), ambiguity aversion persists.
          *   Dan's "nobody fully believes" move is a "get out of jail free" card that makes the theory unfalsifiable. If *any* deviation is explained by "hidden distrust," the theory loses predictive power.
