      *   *Key Point 1: The Brain vs. The Eye.* The hardware (eyes) works, the software (brain) is updating.
      *   *Key Point 2: Molyneux's Problem.* Introduce the historical context. It fits perfectly.
      *   *Key Point 3: Familiarity.* Explain why she recognized the user/mug (context clues, voice, location) vs. the shapes (abstract, no context). *Self-Correction:* Be careful not to dismiss her recognition as "fake," but explain that recognizing a known face is different from categorizing a geometric primitive. Actually, in many case studies, face recognition is *hard* initially. I should note that her ability to recognize the face and pour water is actually quite advanced for "a few months," but the shape distinction is the specific bottleneck.
