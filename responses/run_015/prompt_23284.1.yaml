answer: |-
  There is nothing wrong with your friend's vision, and what you are witnessing is a well-documented and fascinating phenomenon in neuroscience and psychology. In fact, her reaction to the metal objects is exactly what researchers would expect, even if her ability to recognize you and pour water seems to contradict it.

  Here is the explanation for what is happening in her brain.

  ### 1. Sensation vs. Perception
  The most important distinction to make is between **sensation** (the eyes receiving light) and **perception** (the brain interpreting that light).

  Her eyes are now working perfectly (sensation). However, for the eighteen or so years she was blind, the part of her brain responsible for processing visual input (the visual cortex) was repurposed to handle other senses, like touch and hearing. Now that the eyes are sending data, her brain has to learn how to process it.

  Vision is not a passive camera recording the world; it is an active cognitive skill. The brain has to learn how to interpret edges, shadows, contrast, and depth. To a brain that has never seen before, a cube and a sphere might both just look like "shiny patches of grey." Without prior experience, the brain doesn't yet know that specific patterns of light and shadow correspond to specific 3D shapes.

  ### 2. Molyneux's Problem
  Your friend has inadvertently answered a famous philosophical question known as **Molyneux's Problem**. In 1688, William Molyneux asked: *If a man born blind could suddenly see, would he be able to distinguish a cube from a sphere by sight alone, without touching them?*

  For centuries, philosophers debated this. Modern medicine has finally provided the answer: **No, not immediately.**

  Case studies of people who have gained sight after lifelong blindness (such as those documented by neurologist Oliver Sacks or the "Project Prakash" studies in India) show that patients can usually see light and color immediately, but they cannot identify objects or shapes visually. They have to learn to see, much like a baby does, but on a much faster timeline.

  ### 3. Familiarity vs. Novelty
  You noticed a contradiction: She can recognize *you* and her *mug*, but not the metal shapes. This is due to **context and memory**, not just raw vision.

  *   **Recognizing You:** When she "recognized" your face, she likely wasn't relying solely on visual data. She recognized your voice, your gait, your height, the context of where you were standing, and perhaps specific high-contrast features (like hair color or glasses). Her brain is filling in the gaps using her existing knowledge of you.
  *   **Pouring Water:** This relies heavily on motion. When she moved the pitcher, her brain could use "motion parallax" (how objects move relative to one another) to gauge depth. This is often easier for a newly sighted brain to process than static depth cues.
  *   **The Metal Objects:** The ball and the cube were **novel objects** with no context. She had no memory of them, no voice to identify them, and they weren't moving. This required pure **form perception**—the ability to look at a 2D image on the retina and understand it as a 3D object. This is the hardest visual skill to learn and takes the longest to develop.

  ### 4. The Touch-Vision Gap
  For her entire life, she has built a map of the world through touch. She knows what a cube feels like. She knows what a sphere feels like. However, her brain has not yet built the bridge between the *tactile* concept of "round" and the *visual* pattern of "round."

  When she said she had to touch them, she was being honest. Her brain currently trusts her hands infinitely more than her eyes. Connecting the visual input to the tactile memory is a process called **cross-modal transfer**, and it typically takes months or even years to fully automate.

  ### Summary
  Your friend is not experiencing a failure of surgery; she is experiencing the normal timeline of neuroplasticity.
  *   **The Eyes:** Working perfectly.
  *   **The Brain:** Still installing the "software" required to interpret the data.

  She can recognize familiar things because her brain is using context clues to help the vision along. She cannot identify the shapes because that requires raw visual processing that she is still in the early stages of learning. With time, patience, and practice, her brain will wire itself to understand that the visual pattern of the ball means "round," and she will be able to tell the difference without touching them.

  **Recommendation:** Encourage her to keep practicing with simple shapes and high-contrast objects. It is a learning process, and her honesty about needing to touch them is a sign of her brain adapting correctly, not failing.
