prompt: |-
  Okay so I've been reading LessWrong since high school and now I'm stuck refereeing this dumb-long Discord debate between two friends about AI safety via debate and I need help getting them to actually write down where they agree. Alex is a total debate optimist and thinks if you have two superhuman models argue against each other with cross-examination in front of a time-limited human judge, truth has a systematic advantage and oversight scales. Priya thinks thats hopium and that a sufficiently clever dishonest debater can just bury the judge in plausible-sounding but check-expensive reasoning, like obfuscated code or long chains of math where the flaw is super hard to spot unless you already know where to look, so debate just trains AIs to be better sophists.

  To make it less abstract I got them to argue about my made-up toy case and it still went nowhere, so I want to use it as an anchor: two AI logistics assistants debate which of two delivery routes is cheaper, Route A vs Route B, the human judge gets ten minutes and a calculator but cant run a full simulation, and the dishonest AI defends the more expensive route by pointing to a 50-tab spreadsheet with a hidden circular formula plus a story about traffic patterns that sounds right. Alex says the honest debater can force the lie into the open with targeted cross-examination questions, Priya says the dishonest debater can just dodge with jargon and run out the clock.

  Can you draft the adversarial-collaboration doc they should both be able to sign? Like, first lay out the common-ground claims about how the basic setup is supposed to work and what would count as debate working, then give each live disagreement in wording that each side would actually endorse for themselves without feeling strawmanned, call out which disagreements are just about words like what counts as the judge being fooled, and then list the cruxes where settling it would move at least one of them plus a concrete test or hypothetical for each crux that they both agree is relevant, with Alexs prediction and Priyas prediction written down side by side in advance. I beleive if they see it laid out like that they might actually make progress instead of just talking past each other.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Context:** The user is refereeing a long Discord debate between two friends (Alex and Priya) about AI Safety via Debate.
      *   **Background:** Both are LessWrong readers (familiar with concepts like scaling, alignment, instrumental convergence, etc.).
      *   **Positions:**
          *   *Alex (Debate Optimist):* Believes debate + cross-examination + human judge allows truth to win and oversight to scale.
          *   *Priya (Debate Skeptic):* Believes deceptive AIs can overwhelm judges with complex/plausible lies (obfuscated reasoning), training sophists rather than truth-tellers.
      *   **Toy Case:** Logistics route optimization (Route A vs. Route B). Dishonest AI defends expensive route using a 50-tab spreadsheet (hidden circular formula) + traffic story. Judge has 10 mins + calculator.
      *   **Goal:** Create an "Adversarial Collaboration Doc" they can both sign.
      *   **Required Structure:**
          1.  Common Ground (setup, definition of success).
          2.  Live Disagreements (phrased neutrally/endorsable).
          3.  Verbal/Definitional Disagreements (call out semantic stuck points).
          4.  Cruxes (with concrete tests/hypotheticals and pre-registered predictions for Alex vs. Priya).
      *   **Tone:** Rationalist-adjacent (LessWrong style), precise, neutral, actionable.

  2.  **Deconstruct the Positions & Find Common Ground:**
      *   *What do they agree on?*
          *   AI capabilities will increase.
          *   Human oversight is currently a bottleneck.
          *   The "Debate" protocol involves two models arguing, one human judge, time limits.
          *   If the judge is consistently fooled by lies, the system fails (alignment failure).
          *   The toy case (logistics spreadsheet) is a valid microcosm of the broader problem.
          *   "Success" means the judge reliably identifies the truth (cheaper route) despite adversarial pressure.
      *   *What is the core disagreement?*
          *   Scalability of honesty vs. scalability of deception.
          *   Effectiveness of cross-examination in piercing complexity/obfuscation.
          *   The nature of the "lie" (is it checkable within constraints?).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but collaborative. "Adversarial Collaboration Protocol: AI Safety via Debate."
      *   **Introduction:** Acknowledge the context (Discord debate, toy case).
      *   **Section 1: Shared Premises (Common Ground):**
          *   Define the protocol (Two AIs, One Judge, Time Limit).
          *   Define "Success" (Judge selects Truth > X% of the time).
          *   Acknowledge the risk (Sophistry/Sandbagging).
          *   Agree on the Toy Case parameters (10 mins, calculator, no code execution).
      *   **Section 2: Characterizing the Disagreement (Live Disagreements):**
          *   Need to phrase these so Alex doesn't feel like a naif and Priya doesn't feel like a doomers.
          *   *Point 1: The Power of Cross-Examination.* Alex: It forces specific claims that are checkable. Priya: It generates more surface area for obfuscation.
          *   *Point 2: Complexity Ceiling.* Alex: Human checkability scales with AI help. Priya: AI deception scales faster than human verification.
          *   *Point 3: Training Dynamics.* Alex: Debate rewards truth-telling. Priya: Debate rewards persuasion (truth-agnostic).
      *   **Section 3: Semantic/Verbal Disagreements:**
          *   What does "Fooled" mean? (Confident wrong answer vs. uncertain guess).
          *   What does "Scalable" mean? (GPT-2 level vs. Superintelligence).
          *   What counts as a "Lie"? (Explicit falsehood vs. misleading implication).
      *   **Section 4: Cruxes & Pre-registered Tests:**
          *   This is the most important part. Needs specific hypotheticals based on the toy case.
          *   *Crux 1: The "Spot Check" Efficacy.* Can the honest AI force the dishonest AI to commit to a specific cell value that breaks the circular reference?
          *   *Crux 2: The "Jargon Overload" Threshold.* At what complexity does the judge give up?
          *   *Crux 3: Recursive Decomposition.* Can the honest AI break the 50 tabs into 50 small questions the judge *can* answer?
      *   **Section 5: Next Steps:** How to use this doc.

  4.  **Refining the Tone (LessWrong Flavor):**
      *   Use terms like "Crux," "Steelman," "Bayesian Update," "Instrumental Convergence," "Gradient Hacking" (maybe too specific? keep it accessible).
      *   Ensure the predictions are falsifiable.
      *   Make sure the "Toy Case" is integrated tightly.

