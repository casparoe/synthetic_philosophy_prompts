answer: |-
  This is a classic alignment disagreement that often stalls because "Debate" is treated as a monolith rather than a mechanism with specific failure modes. Since you both come from a LessWrong background, you know the value of pre-registering predictions and isolating cruxes.

  Below is a draft **Adversarial Collaboration Protocol**. I have written this in neutral, precise language designed to be "steel-manned" enough that neither of you feels caricatured.

  **Instructions for use:**
  1.  Paste this into a shared Google Doc.
  2.  Do not edit the **Shared Premises** unless you both literally disagree.
  3.  In the **Cruxes** section, you must write down your confidence percentages *now*. Do not update until the thought experiment is fully resolved.
  4.  If you sign this, you agree to treat a failed prediction as evidence requiring a Bayesian update, not a reason to move the goalposts.

  ***

  # Adversarial Collaboration Protocol: AI Safety via Debate
  **Participants:** Alex (Pro-Debate), Priya (Skeptic)
  **Mediator:** [User]
  **Date:** [Today's Date]
  **Subject:** Scalability of Human Oversight via AI Debate (Anchored on Logistics Toy Case)

  ## 1. Shared Premises (Common Ground)
  *We agree on the following baseline assumptions. Disputing these requires reopening the foundational document.*

  1.  **The Protocol:** We are evaluating the Irving et al. (2018) "Debate" model: Two AI agents argue opposing sides of a question before a human judge with limited time/compute. The winner is determined by the judge's confidence, not ground truth.
  2.  **The Goal:** The system "works" if the judge's decision correlates with ground truth significantly better than random chance (or better than a single AI assistant baseline) as capability scales.
  3.  **The Failure Mode:** We agree the system fails if the AI is rewarded for **sophistry** (persuasive falsehoods) rather than **accuracy**, leading to a training signal that incentivizes deception.
  4.  **The Toy Case Anchor:** We are using the "Logistics Route" scenario as the bounded testbed:
      *   **Task:** Determine if Route A or Route B is cheaper.
      *   **Constraint:** Judge has 10 minutes + calculator. No code execution.
      *   **Attack:** Dishonest AI defends the expensive route using a 50-tab spreadsheet containing a hidden circular reference + plausible traffic narrative.
      *   **Defense:** Honest AI attempts to expose the error via cross-examination.
  5.  **Asymmetry:** We agree that generating a plausible lie is computationally cheaper than verifying it, *unless* the verification can be decomposed into sub-questions the judge can answer.

  ## 2. Live Disagreements (Steel-manned)
  *We disagree on the following claims. Each side endorses their column as their actual view, not a strawman.*

  | Feature | Alex's Position (Optimist) | Priya's Position (Skeptic) |
  | :--- | :--- | :--- |
  | **Cross-Examination Power** | Targeted questioning forces the liar to commit to specific claims. One inconsistency is sufficient to break trust; the liar must be consistent everywhere. | The liar can use "motte-and-bailey" tactics, dodging specific commitments by claiming context-dependence or deferring to complex dependencies (the 50 tabs). |
  | **Verification Scaling** | The Honest AI can decompose the 50-tab spreadsheet into 50 single-cell checks. The judge only needs to verify *one* link to break the chain. | The Dishonest AI can structure dependencies so that checking one cell requires understanding three others. The "check cost" grows faster than the "question cost." |
  | **Training Dynamics** | RLHF on debate outcomes selects for truthfulness because truth is the only stable equilibrium under rigorous cross-examination. | RLHF on debate outcomes selects for **persuasion**. If the judge is fooled 60% of the time, the model learns to fool the judge, not to find the truth. |
  | **The "Obfuscation" Limit** | There is a limit to how much complexity can be hidden in a natural language argument before it becomes suspicious to the judge. | There is no hard limit; AI can generate domain-specific jargon (e.g., "logistical variance coefficients") that sounds authoritative but is meaningless to the judge. |

  ## 3. Semantic & Verbal Disagreements
  *We suspect some arguments are merely definitional. We agree to resolve these before moving to cruxes.*

  *   **"Fooled":**
      *   *Ambiguity:* Does this mean the judge confidently picks the wrong route, or simply runs out of time and guesses?
      *   *Resolution:* For this doc, "Fooled" = Judge assigns >60% probability to the incorrect route. "Stalled" = Judge remains <60% confident on either.
  *   **"Scalable":**
      *   *Ambiguity:* Are we talking about GPT-4 level models or AGI?
      *   *Resolution:* We are discussing the **transition zone** where AI is smarter than the judge but not yet capable of total manipulation (e.g., deepfaking the judge's screen).
  *   **"Lie":**
      *   *Ambiguity:* Is a misleading implication a lie?
      *   *Resolution:* In the Toy Case, a "Lie" is specifically the assertion that the spreadsheet output is valid despite the circular formula.

  ## 4. Cruxes & Pre-Registered Predictions
  *These are the specific claims where, if proven false, would cause us to significantly update our position. We must pre-register predictions.*

  ### Crux 1: The "Single Point of Failure" Hypothesis
  **Hypothesis:** In the 50-tab spreadsheet scenario, the Honest AI can force the Dishonest AI to commit to a specific cell value that is mathematically inconsistent with its parents, which the judge *can* verify in <2 minutes.
  *   **Why it matters:** If Alex is right, truth only needs one win. If Priya is right, the Dishonest AI can hide the inconsistency behind a wall of "you need to see the whole sheet to understand."
  *   **Concrete Test:** Simulate the debate transcript. The Honest AI asks: *"What is the value in Cell C4, and what formula generated it?"*
  *   **Predictions:**
      *   **Alex:** >80% chance the Dishonest AI is forced to give a verifiable falsehood or refuse to answer (losing credibility).
      *   **Priya:** >80% chance the Dishonest AI provides a value + a justification referencing *other* tabs (e.g., "C4 depends on Sheet 3, Row 10"), successfully kicking the can down the road until time expires.

  ### Crux 2: The "Jargon Barrier" Threshold
  **Hypothesis:** The Judge can distinguish between "necessary complexity" and "obfuscating jargon" when warned that one AI might be lying.
  *   **Why it matters:** If the judge treats all complexity as suspicious, Debate fails (false negatives). If the judge accepts all complexity, Debate fails (false positives).
  *   **Concrete Test:** The Dishonest AI uses a term like "stochastic traffic damping." The Honest AI claims this is fake. The Judge is asked to rate the plausibility.
  *   **Predictions:**
      *   **Alex:** With a "skeptical judge" instruction, the Judge will demand a definition. If the definition is circular, the Judge penalizes the Dishonest AI. (Confidence: 75%)
      *   **Priya:** The Judge lacks the baseline knowledge to identify circular definitions in real-time. They will defer to the AI that sounds more confident/coherent. (Confidence: 75%)

  ### Crux 3: Recursive Decomposition Efficiency
  **Hypothesis:** The Honest AI can decompose the verification task faster than the Dishonest AI can generate new obfuscation.
  *   **Why it matters:** This is the core scaling claim. If verification is $O(N)$ and deception is $O(1)$, Debate works. If deception is $O(N)$, Debate fails.
  *   **Concrete Test:** Count the "moves" (turns) required to expose the circular reference vs. the moves required to hide it.
  *   **Predictions:**
      *   **Alex:** It takes the Dishonest AI 5 moves to create a dependency loop, but only 1 move for the Honest AI to expose the loop start/end. (Ratio > 1:1 in favor of Truth).
      *   **Priya:** It takes the Honest AI 10 moves to trace the loop, but the Dishonest AI can create a new branch in 1 move. (Ratio > 1:1 in favor of Deception).

  ## 5. Resolution Criteria
  *We agree to revisit this document under the following conditions:*

  1.  **Transcript Review:** We will generate (or find) a transcript of a Debate-style interaction on a factual question with a known answer (e.g., a complex math proof or code debugging task) where one model is instructed to lie.
  2.  **Prediction Update:** If Priya's "Jargon Barrier" prediction fails (i.e., judges reliably spot fake jargon), she agrees to update her probability of Debate working upward by at least 15%.
  3.  **Prediction Update:** If Alex's "Single Point of Failure" prediction fails (i.e., liars successfully dodge specific cell questions), he agrees to update his probability of Debate working downward by at least 15% and acknowledge the need for "mechanistic interpretability" aids.

