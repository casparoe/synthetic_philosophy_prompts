answer: |-
  ### A Note on the Theory (The "Straight Talk")

  I need to be direct before you finalize this: the "Proximity Paradox" as you defined it ("being physically close... reduces how informed you are") is theoretically vulnerable. In standard democratic theory, physical proximity usually *increases* local knowledge (the Hayekian information argument). If you tell students proximity *reduces* information, you risk teaching them a claim that most political scientists would reject.

  The intuition behind your frustration is sound—residence is a poor proxy for *legitimacy*—but the mechanism isn't epistemic (information); it's normative (subjection and stake). A student on a visa is fully subjected to housing laws but lacks the franchise; a climate refugee is deeply affected but lacks presence.

  I have adjusted the materials below to frame this as the **"Presence Proxy Problem."** This keeps your core insight (presence shouldn't be the only thing that matters) without making false claims about information. The model answer treats the "paradox" as the tension between *assuming* presence tracks stake/subjection when it often fails. This ensures your students are tested on rigorous theory while addressing the real-world injustice that sparked this.

  ***

  ### Exam Question

  **Prompt:**
  Democratic boundaries are often drawn using territorial presence as a proxy for membership. However, reliance on presence creates a tension: those physically closest to a decision may lack the structural perspective of distant stakeholders, while those subjected to coercion or deeply affected may be excluded due to absence or status.

  Critically evaluate whether democratic legitimacy requires territorial presence. In your answer:
  1.  Distinguish clearly between the **all-subjected principle** (coercion) and the **all-affected principle** (interests/stakes).
  2.  Apply the **"Presence Proxy Problem"** to two cases: non-resident stakeholders (e.g., climate refugees affected by a city's carbon budget) and presentist exclusions (e.g., resident non-citizens denied votes in housing referendums).
  3.  Argue whether presence is a necessary condition for legitimacy or merely a heuristic. If it is a heuristic, propose an alternative mechanism for tracking membership that avoids the paradox of excluding the subjected while preventing infinite regress of the affected.

  ***

  ### Model Answer (Approx. 600 words)

  Territorial presence is the default boundary for democratic membership, but it is a heuristic, not a normative foundation. Legitimacy derives from either being subject to coercive authority or having a vital stake in the outcome. When presence is treated as a necessary condition rather than a proxy, it generates exclusionary injustices. To evaluate this, we must distinguish between subjection and stake, as conflating them leads to incoherent boundary drawing.

  The **all-subjected principle** argues that anyone coerced by a law must have a say in its creation. This is a claim about autonomy and freedom from domination. The **all-affected principle** argues that anyone whose interests are significantly impacted should participate. This is a claim about welfare and justice. Presence often tracks subjection for residents, but fails for non-citizens subjected to local law without voting rights. Conversely, presence poorly tracks stake for distant actors; a climate refugee may have a higher stake in a city's carbon budget than a transient resident, yet lacks physical proximity.

  This creates the **Presence Proxy Problem**. We assume presence guarantees information and investment, but it often guarantees only parochialism. In the case of **presentist exclusions**, such as student visa holders denied votes in housing referendums, presence is undeniable. They live in the units, face the eviction risks, and are subjected to the zoning coercion. Excluding them violates the all-subjected principle. Their physical presence makes the exclusion visible, yet the legal boundary overrides the democratic requirement. Here, presence is sufficient for subjection, but the polity treats it as insufficient for membership.

  In the case of **non-resident stakeholders**, such as climate refugees, the paradox deepens. They are profoundly affected (high stake) but absent. If we grant votes based solely on affectedness, boundaries dissolve; everyone is affected by everything. However, ignoring them because they lack presence treats territoriality as a moral shield against external harm. Legitimacy cannot require presence here, because the decision's impact transcends borders. Presence becomes a barrier to justice rather than a precondition for participation.

  Therefore, territorial presence is not a necessary condition for legitimacy; it is a flawed administrative shortcut. It works only when subjection, stake, and presence overlap perfectly, which they increasingly do not. Retaining presence as the sole criterion privileges incumbents and ignores both coercive subjection (visas) and structural affectedness (climate).

  To resolve this, we need an alternative tracking mechanism that separates voting rights from residence without collapsing into infinite regress. A **functional stakeholder model** offers a solution. For local housing votes, membership should track legal subjection: anyone subject to the zoning law (renters, owners, visa holders) votes, regardless of citizenship. For carbon budgets, a **proxy representation model** could work, where affected external communities are represented by advocacy bodies with veto power over harmful thresholds, rather than individual ballots. This preserves the efficiency of territorial voting for local coercion while creating institutional channels for distant stakes.

  Democratic legitimacy requires that boundaries track power and impact, not just geography. Presence is useful only insofar as it signals subjection or stake. When it fails to do so—as with excluded residents or invisible externalities—the boundary must shift. A democracy that prioritizes lines on a map over the people subjected to its coercion is merely a territory governing itself, not a people governing themselves.

  ***

  ### Marking Scheme: Distinguishing A from B

  | Criterion | **B Grade (Competent)** | **A Grade (Excellent)** |
  | :--- | :--- | :--- |
  | **Subjection vs. Stake** | Defines both principles but may blur them (e.g., treating coercion as just another interest). | **Distinctly separates** autonomy-based claims (subjection) from welfare-based claims (stake) and shows why different boundaries apply to each. |
  | **Presence Proxy Problem** | Describes the cases (visas/climate) but treats presence mainly as an information problem. | **Demonstrates how presence fails as a normative proxy.** Shows why presence validates subjection in one case (visas) but blocks stake in the other (climate). |
  | **Legitimacy & Presence** | Argues presence is either totally necessary or totally irrelevant. | **Argues presence is a heuristic.** Explains *when* it works (local coercion) and *when* it fails (transboundary harm). |
  | **Alternative Mechanism** | Proposes vague solutions (e.g., "let everyone vote" or "open borders"). | **Proposes a specific tracking mechanism** (e.g., functional stakeholder models or proxy representation) that solves the infinite regress problem while including the excluded. |
  | **Theoretical Precision** | Uses terms loosely; may rely on intuition. | **Avoids conflation.** Does not confuse epistemic claims (information) with normative claims (legitimacy). |
