      *   *Refinement:* Actually, the "counterfactual prior" move is the standard accepted solution to the Old Evidence problem in Bayesian circles. Sam's dismissal of it as "abandoning the framework" is weak because the framework *evolved* to handle this. Dana is closer to the consensus view among Bayesians who accept old evidence confirms. But Sam is right that it's not *predictive* confirmation.
