          *   *Weakness:* Ignores the "forgotten" aspect. Treats literature existence as knowledge existence.

      *   **Move 1 (Dana):** "Already there" is false. Nobody knew it. "Known" means known to someone.
          *   *Critique:* Epistemic relativism. Shifts focus to the agent/community state.
          *   *Weakness:* Risks making confirmation subjective to the historian's narrative.

      *   **Move 2 (Sam):** Known-to-whom is a dodge. If findable = known, anything counts. Theorist gets unearned credit.
          *   *Critique:* Worry about heuristic credit vs. logical confirmation. Protecting the integrity of prediction.
          *   *Weakness:* Conflates *confirmation* (logical relation) with *virtue/credit* (sociological reward).

      *   **Move 2 (Dana):** Confirmation isn't about foresight. It's about fact-hypothesis relation. Dates don't matter.
          *   *Critique:* Objective Bayesianism/Realism. The support relation is timeless.
