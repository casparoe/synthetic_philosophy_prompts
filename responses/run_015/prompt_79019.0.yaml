  2.  **Deconstruct the Philosophical Problem:**
      *   **Core Issue:** The Problem of Old Evidence (Glymour, 1980).
      *   **The Setup:** $E$ (evidence) is known before $H$ (hypothesis) is formulated. $P(E) = 1$.
      *   **Bayesian Conditionalization:** $P(H|E) = P(H \cdot E) / P(E)$. If $P(E) = 1$, then $P(H|E) = P(H)$. No confirmation occurs.
      *   **The Specific Twist:** The evidence was *physically* existing but *epistemically* obscure (forgotten/uncited). This adds a layer of "sociological knowledge" vs. "objective existence."
      *   **Key Concepts:** Logical omniscience, counterfactual priors, historical vs. logical time, subjective vs. objective Bayesianism.

  3.  **Analyze the Moves (Sam vs. Dana):**

      *   **Move 1 (Sam):** Category error. Old evidence can't confirm. Model built around fact.
