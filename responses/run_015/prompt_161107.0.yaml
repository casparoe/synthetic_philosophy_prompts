      *   **Constraints:** Do not survey literature (no references). Rank tensions. State confidence levels. Flag empirical dependencies.
      *   **Specific Concern:** A colleague claims (1) and (5) are inconsistent. The user disagrees but can't articulate why.

  2.  **Analyze the Commitments:**
      *   (1) *Metaphysical Individualism:* Species are historical particulars (individuals), not classes. Organisms are parts, not instances. (Ghiselin/Hull view).
      *   (2) *Pluralism:* No single concept is correct. Different criteria (interfertility, ecology, genealogy) yield different, *equally correct* counts for the *same group*.
      *   (3) *Realism:* Species are mind-independent. Membership is fixed by genealogical relations, not human interest.
      *   (4) *Monophyly Requirement:* Working criterion is General Lineage Conception (GLC). Species *must* be monophyletic. Paraphyly = not a species.
      *   (5) *Indeterminacy:* Some boundaries are genuinely indeterminate (ring species, hybrid swarms). No fact of the matter.
      *   (6) *Specific Verdicts:*
          *   (6a) Polar/Brown bears: Distinct species *despite* paraphyly (brown bears paraphyletic w.r.t. polar). Ancestral species can persist after budding.
          *   (6b) Asexuals: Have species in the same sense as sexuals.

  3.  **Evaluate Tensions/Inconsistencies:**

      *   **Tension A: (1) Individualism vs. (5) Indeterminacy.**
          *   *Colleague's Claim:* If species are individuals (particulars), they have precise spatiotemporal boundaries. If boundaries are indeterminate, they aren't well-defined individuals.
          *   *Analysis:* Individuals (like organisms) can have vague boundaries (e.g., when does an organism start/end at the cellular level, or sorites problems). However, strict individualism usually implies a definite history. If there is *no fact of the matter* (ontic vagueness), it challenges the "particular" status. But many individualists accept epistemic vagueness or even ontic vagueness in boundaries without denying individuality.
          *   *Verdict:* Apparent tension, likely dissolvable. Individualism is about *what* they are (particulars), not necessarily that their boundaries are always sharp to us or even in principle (though strict mereology might object).
          *   *Confidence:* High that it's dissolvable.

      *   **Tension B: (2) Pluralism vs. (3) Realism.**
          *   *Analysis:* (2) says different counts are *equally correct*. (3) says species are *mind-independent* and membership is fixed by *genealogical relation*. If membership is fixed by genealogy (3), then there is only one correct genealogical count. If different concepts yield different counts (2), and all are correct, then species aren't solely fixed by genealogy.
          *   *Conflict:* (3) specifies *genealogical relation* as the truth-maker. (2) allows ecological or interfertility criteria to define *equally correct* species. If an ecological species boundary cuts across a genealogical one, (3) says one is wrong (the non-genealogical one), while (2) says both are correct.
          *   *Severity:* High. This is a core metaphysical clash.
          *   *Confidence:* Very High.

      *   **Tension C: (2) Pluralism vs. (4) Monophyly Requirement.**
          *   *Analysis:* (4) mandates monophyly. (2) allows interfertility or ecological distinctness to define species. Interbreeding populations (Biological Species Concept) are not necessarily monophyletic (especially recently diverged ones). Ecological species might not be monophyletic. If (4) is a hard requirement, then (2)'s claim that those other concepts yield "equally correct" species counts is false. They would be *incorrect* by the standard of (4).
          *   *Severity:* High. (4) acts as a filter that invalidates the pluralism in (2).
          *   *Confidence:* Very High.

      *   **Tension D: (4) Monophyly vs. (6a) Bear Verdict (Ancestral Persistence).**
          *   *Analysis:* (4) says paraphyletic groups are not species. (6a) explicitly accepts Polar/Brown bears as distinct species *even if* brown bears are paraphyletic w.r.t. polar bears. This is a direct contradiction.
          *   *Severity:* Critical. This is a performative contradiction. You state a rule, then immediately break it for a favorite example.
          *   *Confidence:* Certainty.

      *   **Tension E: (3) Genealogical Realism vs. (6b) Asexuals.**
          *   *Analysis:* (3) says membership is fixed by a *genealogical relation*. Asexuals (bdelloids) have genealogy (clonal), but often lack the cohesion mechanisms implied by some genealogical species concepts. However, (3) just says "genealogical relation." Clonal descent is a genealogical relation. So this might hold. But if (3) implies *reticulate* genealogy (common in sexuals), asexuals differ.
          *   *Severity:* Low/Medium. Depends on definition of "genealogical relation."
          *   *Confidence:* Medium.

      *   **Tension F: (5) Indeterminacy vs. (3) Realism.**
          *   *Analysis:* (3) says there is a fact of the matter (mind-independent). (5) says in some cases there is *no* fact of the matter.
          *   *Conflict:* Direct contradiction regarding ontological status of boundaries.
          *   *Severity:* High.
          *   *Confidence:* High.

      *   **Tension G: The "Stable List" Requirement vs. (2) Pluralism & (5) Indeterminacy.**
          *   *Analysis:* The user needs *one* stable public list for conservation. (2) says multiple counts are correct. (5) says sometimes there is no count.
          *   *Conflict:* Practical need forces a choice that the metaphysics says is arbitrary or impossible.
          *   *Severity:* High (Pragmatic vs. Theoretical).

  4.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the role and the goal.
      *   *Dissolving Moves:* Address (1) vs (5) first since the user asked.
      *   *Real Tensions:* Rank them.
