      *   **Ines's Argument:** DNA isn't a code because there's no sender/convention/distinction between corruption and redraft based purely on chemistry. Mutations exist, but "mistranslations" require downstream function/selection.
      *   **Ines's Test:** A genuine code must distinguish *corrupting the message* (noise) from *changing the message* (redraft). In genetics, every sequence change is just chemistry; "error" is borrowed from function/selection.
