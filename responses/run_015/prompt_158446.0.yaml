  4. A graded collective memory framework would reject binary true/false labels in favor of mapping how deeply each story is embedded in cultural identity regardless of empirical verification.
  5. Implementing this requires placing all three narratives on a continuous spectrum wall that visualizes the density of later references alongside the scarcity of contemporary physical evidence.
