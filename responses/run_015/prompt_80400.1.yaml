  My actual question: what's your credence that in the next 20 years the mainstream view will be that some version of the equation survives — i.e., people will agree there's a way to read conditionals such that credences in them really do track conditional probabilities, with the cost paid in giving up something about the probability logic or the algebra of propositions rather than in the equation itself?

  Give me a number, but more importantly decompose it:
  - the probability that the triviality result is doing what I think it is — that the real tension is between the equation and the requirement that the probability logic be a full Boolean algebra, not between the equation and anything about the meaning of conditionals,
  - the probability that the cost of saving the equation (non-classical truth values, losing closure under the connective, context sensitivity) is one philosophers will actually accept rather than just quietly dropping the equation,
  - the probability that the debate is even aimed at the right thing — i.e., that the equation is the right target to preserve in the first place, seperately from whether it's defensible,
  - whatever else you think belongs.

  Then say which sub-question your number is most sensitive to and what would move it. And one more: I have a classmate who thinks the triviality results are basically settled and that anyone still defending the equation is just not taking the math seriously. Is that person's disagreement with me most likely about the math, or about what the math implies for the philosophy?
