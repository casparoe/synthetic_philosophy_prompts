answer: |-
  It is a pleasure to engage with a colleague who brings the weight of four decades of laboratory practice to a debate often dominated by armchair speculation. Your unease is well-founded: the philosophical literature often treats underdetermination as a sceptical weapon, whereas you have encountered it as a routine engineering constraint. Your proposed principle is a robust attempt to filter out the 'noise' of philosophical scepticism to find the 'signal' of genuine ontological ambiguity.

  However, to be blunt, your principle conflates *empirical equivalence* with *ontological distinctness*, and it conflates *limitations of access* with *limitations of nature*. Below I test your principle against your cases, indicate where you must revise your verdicts, address your three new cases, and evaluate the Structural Realist claim. I shall mark where I am reporting the consensus of the literature and where I am recommending a specific usage.

  ### 1. Testing Your Principle Against Your Cases

  Your principle defines *robust equivalence* as agreement on all observations under every *physically possible* arrangement. It defines *serious underdetermination* as robust equivalence plus non-triviality (clauses b and c).

  **Case (i): The Phase Problem**
  *   **Verdict:** Your principle classifies this as **serious underdetermination** (clauses a, b, and c are met). You classify it as **not worrying**.
  *   **Critique:** This is a category error. The phase problem is not a rivalry between two physical theories; it is a mathematical ambiguity in inverting a transform. The 'smoothness rule' is not an arbitrary choice between rivals, but the application of physical prior knowledge (e.g., atomicity, positivity).
  *   **Recommendation:** You should not count this as underdetermination of *theory* at all. It is underdetermination of *solution* within a single theory. Your principle needs a preamble restricting 'rivals' to distinct physical postulates, not mathematical inversions.
  *   **Action:** Abandon the classification of (i) as underdetermination. It is an inverse problem, not a theoretical one.

  **Case (ii): Action at a Distance vs. Potential**
  *   **Verdict:** **Not underdetermination.**
  *   **Analysis:** Your Clause (b) ('change of idiom') handles this perfectly. This aligns with the standard view that these are representations of the same formalism.
  *   **Action:** Keep this verdict.

  **Case (iii): Matrix vs. Wave Mechanics**
  *   **Verdict:** You find this **bothersome**; your principle classifies it as **not serious** (Clause b: 'change of variables').
  *   **Critique:** Here you must align with your principle and abandon your unease. The Stone–von Neumann theorem establishes the unitary equivalence of these formulations. The 'pictures' (algebra vs. field) are heuristic aids, not ontological commitments. To insist they differ in content is to mistake the map for the territory.
  *   **Literature Note:** This is the standard position in foundations of QM (see e.g., Birkhoff and von Neumann, 1936).
  *   **Action:** **Overturn your verdict.** Accept that (iii) is of the same kind as (ii). The 'content' you sense is psychological, not physical.

  **Case (iv): Epicycles and Grue**
  *   **Verdict:** **Dismiss.**
  *   **Analysis:** Clause (b) ('fitting device') and Clause (c) ('parasitic') dispose of these neatly.
  *   **Action:** Keep this verdict.

  **Case (v): Newton + Free Parameters**
  *   **Verdict:** **Disquieting.**
  *   **Analysis:** If the parameters are fitted to current data, the theories diverge on *future* or *more precise* data. Thus, they fail Clause (a): they are not robustly equivalent. If the parameters are *in principle* unmeasurable (e.g., a force that cancels exactly everywhere), then Clause (b) applies (zero contribution).
  *   **Action:** Your discomfort is indeed about (ix). Strictly speaking, under your principle, this is not serious underdetermination because the theories are not robustly equivalent (they differ on possible measurements, even if not current ones).

  **Case (vi): Pilot-Wave vs. Everett**
  *   **Verdict:** **Serious.**
  *   **Analysis:** Your principle correctly identifies this. They are robustly equivalent (a), not merely verbal (b), and not parasitic (c). They posit different ontologies (particles vs. branching worlds).
  *   **Action:** Keep this verdict. This is the hard core of the problem.

  **Case (vii): Five-Minute Hypothesis**
  *   **Verdict:** **Not worrying.**
  *   **Analysis:** Clause (c) ('parasitic') handles this. It is a sceptical hypothesis, not a scientific rival.
  *   **Action:** Keep this verdict.

  **Case (viii): Cosmological Horizons**
  *   **Verdict:** You say **real underdetermination, fact of the matter exists.** Your principle says **not underdetermination.**
  *   **Critique:** This is the crux. Your definition of 'physically possible' includes arrangements 'no one will ever build'. If a region of space exists beyond the horizon, a measurement *there* is physically possible (consistent with laws of nature), even if causally disconnected from *us*. Therefore, the theories disagree on physically possible evidence. Clause (a) fails.
  *   **Literature Note:** Philosophers distinguish *trans-observable* entities (exist but unobservable) from *trans-empirical* theories (no evidence possible). (viii) is the former.
  *   **Action:** **Overturn your verdict.** Under your own definition of 'robustly equivalent', (viii) is not underdetermination; it is *ignorance*. There is a fact of the matter, and the theories differ on it, so they are not equivalent. The underdetermination is merely *practical* (for us), not *robust* (in principle).

  **Case (ix): Unperformable Experiments**
  *   **Verdict:** You say **as bad for us as (vi)... theories genuinely differ.**
  *   **Critique:** Same as (viii). If the experiment is 'physically possible' (allowed by laws), the theories are not robustly equivalent. If the experiment is 'physically impossible' (forbidden by laws), then we are back to (vi).
  *   **Action:** **Overturn your verdict.** You must distinguish between *epistemic* underdetermination (we cannot tell) and *metaphysical* underdetermination (nature does not decide). Your principle targets the latter. (ix) is the former.

  ### 2. Repairing the Principle

  Your principle is sound for identifying *metaphysical* underdetermination, but you are trying to use it to capture *epistemic* anxiety. I recommend splitting the definition.

  **Revised Principle:**
  1.  **Empirical Equivalence:** Theories agree on all actual and *accessible* evidence.
  2.  **Robust Equivalence:** Theories agree on all actual and *physically possible* evidence (consistent with laws of nature).
  3.  **Serious Underdetermination:** Exists only when rivals are **Robustly Equivalent** and satisfy clauses (b) and (c).

  **Why this repair?**
  It forces you to admit that (viii) and (ix) are not cases of 'serious underdetermination' in the philosophical sense. They are cases where truth outruns verification. This preserves your realism: you can believe there is a fact of the matter in (viii) precisely because the theories are *not* robustly equivalent. They make different claims about reality; we just cannot check them.

  ### 3. The Three New Cases

  Here I apply the **Revised Principle**.

  **Case A: A quantity the theory entails can be measured by no procedure permitted by its own laws.**
  *   *Example:* Absolute velocity in Special Relativity.
  *   **Verdict:** **Serious Underdetermination (unless Gauge).**
  *   **Clause:** (a) and (b).
  *   **Reasoning:** If the quantity has no empirical consequence even in principle, the rivals are robustly equivalent. Unless this quantity is a 'gauge freedom' (mathematical redundancy, Clause b), it is ontological excess.
  *   **Recommendation:** Treat this as a signal to eliminate the quantity (Ockham's razor). If the theory says it cannot be measured, and no other theory part requires it, it is likely not real.

  **Case B: Rivals agreeing on every possible observation but disagreeing about counterfactual settings of a constant of nature.**
  *   *Example:* Theory 1 says 'If G were double, stars would collapse'; Theory 2 says 'If G were double, stars would explode'. Both agree on actual G.
  *   **Verdict:** **Not Empirical Underdetermination.**
  *   **Clause:** Fails (a).
  *   **Reasoning:** Underdetermination concerns evidence. Counterfactuals are modal claims. While this is a genuine theoretical difference, it is not *underdetermination by data*. It is a difference in *modal structure*.
  *   **Recommendation:** File this under 'modal realism' debates, not underdetermination.

  **Case C: Rivals differing only in that one postulates two fields whose effects everywhere cancel exactly.**
  *   *Example:* A 'shadow' field that exerts force +F matched by a field exerting -F.
  *   **Verdict:** **Not Serious.**
  *   **Clause:** (b).
  *   **Reasoning:** This is an 'addition of items whose net contribution is fixed at zero'. It is ontological baggage without empirical bite.
  *   **Recommendation:** Dismiss. This is precisely the sort of excess Clause (b) is designed to prune.

  ### 4. Structural Realism

  Your reading group member suggests Structural Realism (SR) answers everything: believe the shared structure, withhold on the rest. This is the position associated with Ladyman and Ross (2007), amongst others.

  **Does it deliver?**

  *   **Case (v) [Newton + Free Parameters]:** **Yes.** The structure is Newtonian gravity. The free parameters are specific values within that structure. SR tells you to believe the law, remain agnostic on the specific value until constrained.
  *   **Case (viii) [Cosmological Horizons]:** **Yes.** The structure within the horizon is known. The structure beyond is unknown. SR validates your confidence that there *is* a structure there, even if we cannot describe it.
  *   **Case (vi) [Pilot-Wave vs. Everett]:** **No. It merely relabels the difficulty.**
      *   **Reasoning:** Do they share structure? They share the Schrödinger equation (the dynamics of the wavefunction). But Pilot-Wave adds particle trajectories; Everett adds branching worlds. The 'structure' of the ontology differs.
      *   **Literature Note:** This is a major criticism of SR in the context of QM interpretations (see Chakravartty, 2007). If 'structure' means 'mathematical formalism', they share it. If 'structure' means 'causal relations between entities', they do not.
      *   **Verdict:** SR cannot tell you whether to believe in the particles or the branches, because the disagreement *is* about the structure of the ontology. It dissolves the problem only if you retreat to believing solely in the predictive algorithm, which is instrumentalism, not realism.

  ### Summary of Instructions

  1.  **Abandon Verdict (iii):** Accept Matrix and Wave mechanics as idiomatic variants. The 'pictures' are not ontology.
  2.  **Abandon Verdict (viii) & (ix) as 'Underdetermination':** Reclassify these as *trans-observable ignorance*. Your realism is compatible with admitting we cannot know the answer, provided the theories are not robustly equivalent.
  3.  **Refine Clause (a):** Ensure 'physically possible' means 'consistent with laws of nature', not 'accessible to human observers'.
  4.  **Structural Realism:** Treat it as useful for (v) and (viii), but recognise it fails to resolve the ontological clash in (vi).

  You have spent forty years distinguishing signal from noise. In philosophy, the 'noise' is often sceptical scenarios that do not map onto scientific practice. Your instinct that (i) and (vii) are not worrying is correct; your principle just needed to be sharpened to explain *why* without undermining your realism about the unobservable. The cost is accepting that some truths (viii) may be permanently beyond our warrant, but not beyond our conception.

