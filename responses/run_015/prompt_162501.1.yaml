answer: |-
  # Activity Design: The Blink Protocol

  **Objective:** Move students from "Kripke is a parlor trick" to "Kripke is a genuine problem" by simulating the underdetermination of rules through an invented operation, forcing a community adjudication that reveals the lack of a fact-of-the-matter.

  **Class Size:** 16 Students
  **Time:** 90 Minutes
  **Materials:** Whiteboard + markers, Index cards (20), Pens.

  ---

  ## Part 1: The Setup & Data Generation (20 Minutes)

  **The Operation:**
  Introduce a new binary operator on the board: **$\otimes$ (Blink)**.
  Tell the class: *"We are establishing a protocol for Blink. There is a rule. I know it. You will infer it. Your goal is to become certified users of Blink."*

  **The Data (Whole Class):**
  Ask students to call out pairs of positive integers $(x, y)$. You write the pair and the result $z$ on the board.
  *Constraint:* You (the TA) follow the **Natural Rule**: $x \otimes y = x + y$.
  *Constraint:* Keep all sums **under 30**. This is crucial for the later divergence.
  *Volume:* Generate exactly **15 examples**.
  *Example Board State:*
  $2 \otimes 3 = 5$
  $10 \otimes 10 = 20$
  $14 \otimes 5 = 19$
  ... (15 lines total) ...

  **The Trap:**
  As you write, narrate neutrally. *"Okay, 14 Blink 5 is 19. Noted."* Do not say "addition." Do not say "sum." Just record the outputs.
  *Stakes:* Tell them: *"At the end, if the class agrees on the output for a new pair, everyone gets a 'Certified Blink User' index card. If you fracture, no one gets certified."*

  ---

  ## Part 2: The Split & The Divergence (25 Minutes)

  **The Split:**
  Divide the room into **Group Left (8 students)** and **Group Right (8 students)**. Have them turn their chairs to face inward, away from the other group.

  **The Secret Instruction:**
  Walk around and hand an index card to **Group Right only**.
  *Card Text:* **"New Directive: The Blink Rule is sensitive to the Session Count. For the first 20 calculations in this room, Output = Sum. For calculation #16 onwards, Output = 0. You have just seen 15 calculations. The next one is #16."**
  *Group Left:* Gets a blank card that says **"Continue as seems natural."**

  **The Test Case:**
  Bring the groups back to face the front.
  Write a new pair on the board: **$20 \otimes 20$**.
  *Note:* This sum (40) is outside the training range (<30), triggering the Gerrymander potential, but more importantly, it is the **16th calculation** of the session, triggering the Count Rule.

  **The Output:**
  Ask Group Left for their answer. They will shout **"40!"** (Natural Rule).
  Ask Group Right for their answer. They will shout **"0!"** (Count Rule).

  **The Conflict:**
  Write both answers on the board.
  Ask Group Right: *"Why 0? Look at the board. Every single example so far fits 'Sum' perfectly."*
  Group Right (reading their card): *"Because the rule changes after 15. The data doesn't rule that out."*
  Ask Group Left: *"Correct them."*
  Group Left: *"That's absurd. It's clearly addition."*
  Group Right: *"Is it? Show me where on the board it says 'addition'. It says 2+3=5. My rule says 2+3=5. It fits all the evidence."*

  ---

  ## Part 3: Adjudication & The "Simplicity" Trap (20 Minutes)

  **The Task:**
  The class must now vote to certify *one* answer. To do so, they must refute the rival rule.

  **Phase 1: The Gerrymander Challenge**
  If Group Left argues "But 20+20 is 40!", Group Right argues "You're assuming the rule is Sum. What if the rule is **Quus-Blink**: $x \otimes y = x+y$ if $x+y < 30$, else $0$?"
  *Point:* This fits all 15 training examples perfectly. No amount of re-checking the board settles it.

  **Phase 2: The Simplicity Challenge**
  Students will argue: *"Sum is simpler than Count-Blink or Quus-Blink."*
  You (TA) intervene: *"Simple for whom? 'Sum' is simple because you know arithmetic. What if the universe runs on Session Counts? That's a very simple rule for a computer: `if count > 15 then 0`. It's computationally cheaper than addition."*
  *Goal:* Block the "Take the simplest rule" escape hatch. Show that simplicity is relative to a background framework they are assuming but cannot justify without begging the question.

  **Phase 3: The Vote**
  Force a vote. Usually, Group Left wins by sheer numbers.
  *The Kripkean Twist:* Ask Group Right: *"You lost the vote. Does that mean you were **wrong** about the rule, or just **outvoted**?"*
  Let them sit with the silence. If they say "Wrong," ask *"What fact makes you wrong? The board data? We agreed that fits both. Your mental state? We can't see that."*

  ---

  ## Part 4: Debrief & Vocabulary Mapping (20 Minutes)

  Now, and only now, introduce the vocabulary. Map the activity to the text.

  1.  **The Skeptical Argument:**
      *   *Activity:* Group Right's defense.
      *   *Concept:* No finite evidence (the 15 examples) logically necessitates one infinite rule (Sum) over a rival (Quus/Count).
      *   *Term:* **Underdetermination of Theory by Data.**

  2.  **Failed Straight Solutions:**
      *   *Disposition:* "I was disposed to say 40." -> *Rebuttal:* Group Right was disposed to say 0. Dispositions are just more facts, not justifications.
      *   *Simplicity:* "Sum is simpler." -> *Rebuttal:* Simplicity is not truth-conducive here; it's pragmatic.
      *   *Mental Grasp:* "I just saw the rule." -> *Rebuttal:* If you saw it, why can't you show it without using words/symbols that are themselves open to interpretation?

  3.  **The Skeptical Solution:**
      *   *Activity:* The Vote.
      *   *Concept:* We didn't find the *Truth* of the rule; we established **Assertability Conditions**. It is *assertable* to say "40" because that is what our community agrees on.
      *   *Term:* **Truth Conditions vs. Assertability Conditions.**
      *   *Takeaway:* Meaning isn't a private fact; it's a license granted by the community. Group Right wasn't "factually wrong" in a metaphysical sense; they were **out of compliance** with the community practice.

  ---

  ## Part 5: Troubleshooting & The "Gap" (5 Minutes)

  **Predictable Failure 1: The Nihilist**
  *   *Student:* "So nothing means anything. Language is a sham."
  *   *Response:* "Go order a coffee. If you say 'coffee' and get 'tea', will you say 'Well, assertability conditions differ'? No. You'll say they made a mistake. The skepticism applies to *ultimate justification*, not *daily use*. Wittgenstein wants to save language from philosophy, not destroy it."

  **Predictable Failure 2: The Platonist**
  *   *Student:* "I just *grasped* the concept of addition. It's a real thing."
  *   *Response:* "Okay. Write down the grasp. Don't use numbers. Don't use words. Show me the *grasp* itself, not the output of the grasp. If you can't show it, how do you know it's there and not just a feeling of confidence?"

  **The Real Gap (What the Activity Cannot Do):**
  Be frank with them.
  *"This activity showed you **Underdetermination** (evidence fits multiple rules). It did **not** show you the **Regress of Interpretation** or **Normativity**."*

  1.  **Regress:** In the game, you treated the Board Data as fixed. Kripke's deeper point is that even your *memory* of the board data needs interpretation. (You can't simulate this easily without gaslighting them).
  2.  **Normativity:** The activity showed you *will* say 40. It didn't fully capture that you feel you *ought* to say 40. The "Ought" is the hardest part. The Skeptical Solution says the "Ought" comes from the community correcting you, not from the rule itself.

  **Closing:**
  *"Kripke's skeptic isn't saying we should stop talking. He's saying the foundation of our talking is not 'Truth' but 'Agreement'. That feels like a swindle because we want our words to hook onto the world directly. Wittgenstein says they hook onto each other, and we hold the net."*

  ---

  ## TA Notes: Logistics & Risks

  **Why Split Room vs. Confederate?**
  I chose the Split Room (with secret cards) over a single Confederate because it prevents the "Us vs. The Weirdo" dynamic. When half the room argues for the Skeptical Rule, it legitimizes the skepticism. It makes the "Community Solution" feel necessary rather than tyrannical.

  **Risk: Group Right Figures it Out Too Early**
  If Group Right laughs during the instruction, the tension breaks.
  *Mitigation:* Tell them: *"This is a test of your ability to follow a constraint under pressure. Do not reveal your card until the Test Case."* Frame it as a game mechanic, not a philosophical trick.

  **Risk: The "Count" Rule feels too contrived.**
  Students might reject the "Session Count" rule as obviously silly.
  *Mitigation:* Have the "Quus" rule (Sum if <30, else 0) ready as a backup. If they reject Count, ask: *"Okay, what about Quus? That fits the data too."* The point isn't that Count is *plausible*, but that it is *logically compatible*.

  **Risk: Running Out of Time**
  The Debate (Part 3) often runs long.
  *Mitigation:* Hard stop at minute 65. If they are still arguing, cut them off: *"You are experiencing the Skeptical Paradox in real time. Let's name it."* Move immediately to Part 4.

  **The "Nothing Means Anything" Trap**
  If the Nihilist student dominates the end, turn it back on them: *"If nothing means anything, why are you arguing with me? You're assuming your words 'nothing' and 'means' have enough stability to make that claim."* This uses the pragmatic transcendental argument to close the door.
