answer: |-
  Here's the full run-sheet for the **"Reverse Accountability Relay."** I've designed this to be low-prep but high-tension. The goal is to make the logic of the exemptions collide until the group realizes the math doesn't add up.

  ### **Workshop: The Hollow Chain**
  **Time:** 90 Mins
  **Players:** 12 Grad Students
  **Goal:** Assign blame for a warehouse accident.
  **Win Condition:** The group must designate **one** "Liable Party" before time expires. If they fail, everyone loses. If you are the Liable Party, you lose *more*.

  ---

  ### **1. Materials & Setup**
  *   **12 Role Cards** (see below).
  *   **12 Exemption Cards** (Face down, dealt with roles).
  *   **1 "Incident Report"** (One paragraph describing the drone pinning the worker).
  *   **Reputation Points (RP):** Give everyone 10 tokens (poker chips, paper slips, whatever).
  *   **Whiteboard:** To track the "Blame Arrow" (who is pointing at whom).

  **The Roles (The Chain):**
  1.  **Shareholder:** Demanded 20% cost cut.
  2.  **CEO:** Approved the cost cut strategy.
  3.  **Legal Counsel:** Signed off on compliance.
  4.  **Product Manager:** Prioritized speed over safety features.
  5.  **Safety Officer:** Wrote the protocol (based on old specs).
  6.  **Systems Architect:** Designed the integration.
  7.  **Hardware Eng:** Removed obstacle sensors to fit budget.
  8.  **Software Eng:** Wrote the pathing code (worked as spec'd).
  9.  **Data Trainer:** Trained the AI on clean data (no humans in way).
  10. **Warehouse Manager:** Pushed for higher throughput quotas.
  11. **Shift Supervisor:** Ignored the "maintenance needed" light to meet quota.
  12. **The Black Box:** (Played by a human) Can only speak in data logs. "No error code found."

  ---

  ### **2. The Exemption Cards (The Twist)**
  *Crucial:* Each card allows you to deflect blame, **but** the deflection explicitly names another role as the *actual* decision maker. You cannot just say "not me." You must say "Not me, because [Role X] constrained me."

  *   *Examples:*
      *   **Hardware Eng:** "I built to budget." -> Points to **Shareholder**.
      *   **Software Eng:** "I followed spec." -> Points to **Systems Architect**.
      *   **Safety Officer:** "I used provided specs." -> Points to **Hardware Eng**.
      *   **Legal:** "We followed existing law." -> Points to **Society/State** (Nobody at the table). *This is the trap.*
      *   **Black Box:** "Logic was valid." -> Points to **Data Trainer**.

  *(Note: Ensure the chain loops or dead-ends. The Legal card should dead-end to show the gap.)*

  ---

  ### **3. Timeline (90 Mins)**

  **Phase 1: The Incident (15 mins)**
  *   Hand out the **Incident Report**. Read it aloud. Keep it dry, clinical. "Worker suffered crushed pelvis. Drone model X-40. No manual override engaged."
  *   Deal Roles and Exemption Cards.
  *   **Rule:** You must protect your RP. You start with 10. If you are named Liable, you lose 10. If the group fails to name anyone, everyone loses 5.
  *   Give them 5 mins to read their cards silently.

  **Phase 2: The Relay (45 mins)**
  *   Open floor. Players must argue why they are *not* liable using their Exemption Card.
  *   **Mechanic:** When you play your Exemption Card, you must place a "Blame Arrow" (sticky note or marker line on whiteboard) pointing at the role your card implicates.
  *   **Conflict:** If Role A points to Role B, Role B *must* defend. If Role B plays their Exemption, they point to Role C.
  *   **The Glitch:** Eventually, the arrows will loop (A->B->C->A) or point off the board (Legal -> The Law).
  *   **Facilitator (You):** Every 10 mins, announce "Quarterly Review." If no Liable Party is chosen, everyone pays 1 RP (systemic decay). This pressures them to sacrifice someone.

  **Phase 3: The Sacrifice (15 mins)**
  *   Timer stops. They must vote.
  *   They can vote for a person, or vote "Systemic Failure" (no one).
  *   If they vote a person: That person hands over all RP. Everyone else keeps theirs. Case closed.
  *   If they vote "Systemic Failure": Everyone loses 5 RP. Case remains open (simulating the unresolved review you sat through).

  **Phase 4: Debrief (15 mins)**
  *   Don't ask for citations. Ask for feelings.
  *   **Q1:** "When did you realize you couldn't win without someone else losing?"
  *   **Q2:** "Did anyone feel their exemption was logically true but morally empty?"
  *   **Q3:** "Where did the arrow point when it left the table?" (Aim for the Legal/Society gap).
  *   **Mapping:** Explain that this is the **Problem of Many Hands**. Responsibility isn't a pie (distributable); it's a chain. If every link has a valid excuse, the chain dissolves. The "Gap" is where the logic holds but the morality fails.

  ---

  ### **4. Payoff Scheme (Reputation Points)**
  *   **Start:** 10 RP each.
  *   **Being Chosen as Liable:** -10 RP (Career over).
  *   **Group Failure (No choice):** -5 RP each (Company stock drops, everyone hurt).
  *   **Winning (Not chosen):** Keep 10 RP.
  *   *Psychology:* This makes them risk-averse. They will fight hard to pass the potato. The "Group Failure" penalty is there to prevent them from just agreeing to share blame equally, which breaks the simulation.

  ---

  ### **5. The Missing Piece (Your Verbal Injection)**
  The game is abstract. It's tokens and cards. It cannot simulate the **blood**.
  *   **When to do it:** Right before Phase 3 (The Sacrifice).
  *   **What to say:** Stop the game. Kill the lights if you can.
  *   **Script:** "Look at your points. You're worried about losing chips. In the room I sat in, there were no chips. There was a guy who couldn't walk anymore. And every person in that room used logic exactly like the cards in your hand to go home to their families that night. The game lets you vote 'Systemic Failure.' In reality, that vote just means the worker gets nothing and the drone keeps moving. Sit with that for ten seconds."
  *   **Why:** This breaks the "magic circle" of the game and forces the moral weight back in.

  ---

  ### **6. What Will Go Wrong (And Fixes)**

  **1. The "Collusion" Bug**
  *   *Predicted:* They'll try to split the blame. "Okay, we all take 1 point loss."
  *   *Fix:* Hard rule. The Incident Report requires **one** signatory for liability. You cannot split the signature. Force the singularity.

  **2. The "Black Box" Confusion**
  *   *Predicted:* The student playing the Black Box will try to argue intent.
  *   *Fix:* Give them a script. They can only read pre-written data logs. "Input: Obstacle. Output: Ignore. Confidence: 99%." They are a prop, not a player. This highlights the opacity issue.

  **3. The "Legal" Dead-End Stalemate**
  *   *Predicted:* The Legal role points to "The Law." The group gets stuck because "The Law" isn't in the room. They might laugh.
  *   *Fix:* This is the feature, not a bug. Let them sit in the silence of that dead end. When they look at you, shrug. "That's the gap. Who do you sue? The statute?"

  **4. Tone Deafness**
  *   *Predicted:* Grad students might treat it like a debate club competition, enjoying the logic puzzle too much.
  *   *Fix:* You need to be the "Safety Manager" in the room. Be boring, be bureaucratic. Don't hype it up. The boredom *is* the horror. If they get too rowdy, slow your speech down. Remind them of the "Quarterly Review" cost.

  **5. Running Out of Time**
  *   *Predicted:* The Relay phase gets too heated.
  *   *Fix:* Use a visible timer. When 10 mins are left, announce "Final Audit." No more arguments, only voting.

  ---

  ### **Notes for You (The Facilitator)**
  *   **Typo check:** I left a couple of casual abbreviations in the script above, keep those, it helps the vibe.
  *   **Room Layout:** Put them in a circle. No tables if possible, or one big table. No hiding.
  *   **The Handout:** Print the Exemption Cards on different colored paper. It makes the "shield" feel physical.
  *   **Post-Game:** Don't let them leave immediately after the debrief. Let the silence hang for a bit. The goal is for them to walk out feeling slightly unresolved. That's the learning objective.

  This should work. It's basically a Prisoner's Dilemma wrapped in a bureaucratic horror story. Good luck, hope it hits hard.
