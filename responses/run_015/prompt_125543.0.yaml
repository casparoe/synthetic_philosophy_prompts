prompt: |-
  ok so i just started working near autonomous warehouse robots and sat through this brutal safety review where a drone pinned a worker and every engineer, manager, and lawyer literally said "not my fault" — passing it around like a hot potato. now i'm running a 90-min workshop for 12 grad students in philosophy of tech and i want them to feel that hollow gap where blame just vanishes, not just hear about it. i want to inject a twist i'm calling the "reverse accountability relay": each player holds one link in the decision chain, but they also hold an excemption card that blocks blame for a structuraly different reason — contract, opacity, design constraint, whatever. the kicker is these exemptions aren't compatible; playing yours exposes someone else's hole, so the group has to choose who eats the blame or accept that nobody can.

  design the full runnable activity for one table, 12 people, 90 minutes. specify the roles, materials, rules, and a payoff scheme using points not cash. they should come away seeing that reponsibility isn't distributed like pie but dissolved because each layer's defense cancels another's. include a timeline with phases, a debrief that maps what happened onto the responsibility-gap concepts without asking anyone to cite papers, and an honest note on which feature — probably the injured party's actual absence and emotional weight — the game can't reproduce and i have to supply verbally. also tell me what will predictably go wrong the first time i run it and how to handle it. keep it casual, this is just for my own planning, and maybe a typo or two is fine.
reasoning: |-
