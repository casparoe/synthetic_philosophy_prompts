      *   **Objective:** Make students *feel* the "responsibility gap" (hollow gap where blame vanishes), not just hear about it.
      *   **Core Mechanic:** "Reverse Accountability Relay." 12 players, each holds a link in the decision chain + an exemption card. Exemptions are incompatible; playing one exposes another's hole. Group must choose who takes the blame or accept no one can.
      *   **Requirements:** Full runnable activity (roles, materials, rules, points scheme), timeline (phases), debrief (mapping to concepts without citations), honest note on limitations (what the game can't simulate), and prediction of failure modes + fixes.
      *   **Tone:** Casual, planning doc style (typos allowed).

  2.  **Deconstruct the Core Mechanic ("Reverse Accountability Relay"):**
