      *   *Reverse Relay:* Pass the blame *up* or *around*, but everyone has a shield.
      *   *The Twist:* Shields conflict. If I say "I was following protocol," that implies the Protocol Writer is responsible. If the Protocol Writer says "I didn't know the hardware limits," that implies the Hardware Engineer is responsible. If the Hardware Engineer says "The budget cut my sensors," that implies the Manager. If the Manager says "Legal said we're compliant," that implies Legal. If Legal says "The law is vague,"... then who?
      *   *Win Condition:* The group needs to assign "The Hot Potato" (Blame) to one person to "close the case." If they fail, everyone loses points (representing the systemic failure). But taking the blame costs individual points. This creates a Prisoner's Dilemma / Tragedy of the Commons vibe.

  3.  **Drafting the Activity Structure:**
