      *   *Mary 2 Verdict:* If she builds it but doesn't integrate it, she lacks the *indexical* connection. This supports the PCS physicalist view (no new facts, just new conceptual mode).

      *   *Better Analogy:* "Knowing the physics of heat" vs. "Feeling heat." (Same issue). "Knowing the geography of London" vs. "Being in London." (Better). "Knowing someone by reputation" vs. "Meeting them." (Best for Acquaintance).

      *   *Let's structure the response.*
