      *   **Task 3 (Mary 2 Case):** Analyze the "Machine Shop" variation. Does Mary 2 know what red looks like? How does the analogy hold up here?
      *   **Goal:** Audit the analogy, determine if the physicalist conclusion survives, and offer a better analogy if needed.

  2.  **Task 1: The Mapping (Explicit Correspondence):**

      *   *Score:* The complete set of physical facts about color vision (wavelengths, neural firing patterns, neurochemistry).
      *   *Performance:* The actual instantiation of that physical state (the neural processing of red in the brain).
      *   *Listener/Experience:* Mary's subjective experience (qualia).
      *   *What Mary Gains:* Not a new note (fact), but a new *mode of access* (acquaintance/ability).
      *   *Mary's Brain:* This is tricky. In the analogy, the *performance* is the physical event. So Mary's brain state *is* the performance. But the *hearing* of the performance is the experience.
      *   *Refinement:* The grad student is likely a "Representationalist" or "Ability Hypothesis" physicalist. They view the experience as the brain doing the thing, not a ghostly addition.
      *   *Mapping:*
          *   Score = Complete Physical Truths (book knowledge).
          *   Performance = The Physical Instantiation (the brain state itself).
          *   Hearing the Performance = The Subjective Experience (Qualia).
          *   The "New Thing" = The first-person instantiation of the physical state.

  3.  **Task 2: Where it Breaks (The Completeness Objection):**

      *   *User's Worry:* Scores are incomplete (don't specify timbre, acoustics, etc.). Physical facts are *ex hypothesi* complete.
      *   *Analysis:* This is the strongest objection. If the score *truly* specified every physical detail of the sound waves, air pressure, and auditory cortex activation, would "hearing it" still add something?
      *   *The Physicalist Move:* The physicalist says "No." If you know *all* physical facts, you know what the auditory cortex does. Experiencing it is just *being* that cortex.
      *   *The Dualist/Non-Physicalist Counter:* Knowing *about* the vibration of the eardrum isn't the same as the vibration *happening to you*.
      *   *The "Indexical" Problem:* The score describes the sound from the outside (third-person). The performance is the sound from the inside (first-person).
      *   *Crucial Disanalogy:* A score is a representation *of* the music. Physical facts are supposed to be constitutive *of* reality. If physicalism is true, the facts *are* the territory. If the score is just a map, the analogy begs the question against physicalism.
      *   *Verdict:* The analogy smuggles in a distinction between "description of physical state" and "instantiation of physical state" that physicalism claims doesn't exist (or is trivial).

  4.  **Task 3: Mary 2 (The Machine Shop):**

