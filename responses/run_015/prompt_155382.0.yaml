      *   **The Analogy:** Score = All Physical Facts. Performance = Experience. Gaining Experience = New relation to old facts (ability/acquaintance), not new facts.
      *   **Task 1 (Mapping):** Explicitly map the analogy (Score, Performance, Gain, Mary's Brain).
