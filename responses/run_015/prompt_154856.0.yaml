answer: |-
  **The Case**

  Marcus must choose between taking over his family's struggling construction business or accepting a tenure-track position in archaeology abroad. Taking over the business means securing livelihoods for thirty families who have worked with his father for decades, staying in the community where he is known, and honoring a implicit promise to his aging father, but it means abandoning his own intellectual passion and living a life of financial precarity. Taking the archaeology job means fulfilling a lifelong personal dream, achieving professional excellence in a field he loves, and securing a stable pension, but it means letting the construction families fend for themselves and breaking his father's heart. Marcus knows exactly what each life entails, feels no fear of commitment, has unlimited time to decide, and recognizes both paths as genuinely noble.

  **How the Case Meets the Specs**

  1.  **Not a tie:** It is not that the values cancel out (30 families vs. 1 dream isn't math); it is that the *kinds* of value (duty to others vs. duty to self) do not naturally weigh against each other on a single scale.
  2.  **Not ignorance:** Marcus knows the outcomes. He knows the business might fail anyway, he knows the archaeology job is secure. No hidden information exists.
  3.  **Not weakness:** He is not stalling out of fear. He is agonizing because he cares deeply about doing the right thing, whichever it is.
  4.  **Not computing:** The variables are few. This isn't a complex optimization problem; it is a conflict of identity.
  5.  **Both options worthy:** Neither is a "loser." One is a life of communal responsibility; the other is a life of personal fulfillment. Both are good lives.

  **The Escalator Test**

  We start adding small improvements to the archaeology job (Option A). First, a slightly higher salary. Marcus still hesitates; money doesn't fix the broken promise to his father. Next, a shorter commute. Still hesitates; convenience doesn't heal his father's heart. Next, a nicer department head. Still hesitates; a pleasant colleague doesn't feed the construction families. We keep going: better equipment, more prestige, a sabbatical every three years.

  On your friend's view, at some rung, the archaeology job should become *so much better* that the choice snaps shut. The scale should tip. On your view, the pull from the business side stays. Even with a prestigious chair and high pay, the specific loss of "betraying his community" remains a live, heavy weight that isn't canceled out by "better archaeology."

  **The Awkward Consequence:** You are right to worry. If no rung ever settles it, it sounds like you are saying value doesn't add up. If I give you a dollar, then another, eventually you are rich. If I improve the job enough, surely it wins?
  **Is it fatal?** No, but it requires rejecting your friend's hidden premise: that all value is additive like money. Some values are like flavors. Adding more sugar to a steak doesn't eventually make it "better than" a cake; it just makes it a sweeter steak. The improvements accumulate *within* the archaeology life, but they do not accumulate *against* the family duty because they are different currencies. The awkwardness disappears once you stop assuming there must be a single exchange rate between "personal fulfillment" and "communal loyalty."

  **The Contrast Case**

  Marcus must choose between two archaeology jobs. Job A is at a university in Rome; Job B is at a university in Athens. Both offer the same intellectual fulfillment, same prestige, same distance from family. Job B pays 5% less.
  Here, the escalator works. You add money to Job B. 1% more, 2% more. At some point, Job B pays enough that Marcus plainly picks it. Why? because both options sit on the same scale (career quality + money). The hardness here *was* ignorance or calculation. Once the numbers shift, the choice snaps shut. This shows the difference: in the contrast case, the values are homogeneous; in the main case, they are heterogeneous.

  **The Single Feature Doing the Work**

  The feature is **heterogeneous values** (different kinds of goodness). The construction job is about *loyalty and continuity*; the archaeology job is about *achievement and self-expression*.
  **If you remove it:** Rewrite the case so both options are about loyalty. (e.g., Stay for the family business OR stay to care for a sick sibling). Now the choice becomes calculable. You can weigh the degree of need, the number of people affected. The "deep hardness" vanishes because you are now comparing quantities of the same thing. The hardness in the original case falls out of the situation because the situation forces a trade between two different definitions of a "good life," not two amounts of the same good.

  **The Friend's Strongest Attack**

  Your friend will say: "You cheated. You described the values as 'different kinds' and then acted surprised they don't weigh against each other. You built the verdict into the setup. If Marcus really had to choose, he would eventually admit one matters more to him, proving there was a scale all along—his own preference."
  **Is this fair?** It is the strongest objection. It claims that "what matters to me" *is* the single scale.
  **The Defense:** The case doesn't work because you labelled them incomparable; it works because the agent feels the conflict even after checking his preferences. Marcus *prefers* archaeology, but feels he *ought* to choose the business. If it were just preference, knowing he prefers archaeology would settle it. The fact that knowing his preference doesn't remove the guilt shows the scale isn't just "what I want." The hardness is real because he recognizes a claim on him (the families) that exists independently of his desire. You aren't labeling it; you are reporting the phenomenology of the conflict.

  **Five Years Later**

  Someone asks: "Did you pick correctly?"
  If your friend is right, there is a fact of the matter. Marcus can say "Yes, I calculated best."
  On your view, there was no pre-existing fact. So what can he say?
  He can say: **"I made it right."**
  He doesn't shrug. He explains that because there was no single scale to discover the answer on, the answer had to be created by his commitment. He invested the choice with value by living it fully. If he chose the business, he doesn't say "It was the better option"; he says "I made this the right option by dedicating myself to these families." The justification comes from *after* the choice, not *before*. He owns the authority of the decision rather than submitting to the authority of the values. This leaves him with plenty to say: not that he found the truth, but that he built a life.
