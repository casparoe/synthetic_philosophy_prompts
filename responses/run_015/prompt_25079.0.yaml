prompt: |-
  I've been going down a rabbit hole reading about Gödel's incompleteness theorems — not the math itself (I'm not a logician), but all the wild things people claim they prove. You hear everything: that they show the human mind can't be a computer, that they prove there are truths we can never know, that they refute logical positivism, that they vindicate mysticism somehow, that they show AI is impossible. Then you read the careful philosophers and logicians who say no, the theorems are being massively overinterpreted, they're technical results about formal systems with specific properties and you can't just wave them at any philosophical problem you like.

  I want to get clear on this. So here's what I'm asking: write an essay on what Gödel's incompleteness theorems do and don't show outside of mathematics. Weigh the main arguments on both sides of at least one specific controversy — for instance, the Lucas-Penrose argument that the theorems show human minds aren't Turing machines, or the claim that they undermine mechanism more broadly, or the idea that they reveal something deep about the limits of reason itself. Don't just catalogue positions; reach a conclusion and defend it. And I want you to tell me what would change your mind: which argument or piece of evidence, if it turned out differently, would lead you to switch sides, or where you think your own reasoning is shakiest.

  I'm not a specialist so don't assume I know the technical details, but also don't talk down to me — I can handle careful argument. The one thing I really don't want is a "both sides have points" shrug at the end. Pick a side and own it, just be honest about what could make you abandon it.
