answer: |-
  Here is a precise principle derived from your cases, tested against your verdicts, and applied to your new scenarios.

  ### The Principle: Epistemic Stewardship

  **An act of deception or steering is impermissible if it corrupts another agent's mental model of reality in a domain where they rely on that model to exercise agency or assess risk, and where you hold a duty of care to support that agency.**

  To apply this, evaluate the act against three clauses. If **all three** are met, the act is **Not Fine**. If **any one** is false, the act is **Fine** (or at least permissible).

  1.  **The Reliance Clause:** Does the recipient rely on this information to make a decision, assess risk, or exercise control?
  2.  **The Duty Clause:** Does your role or relationship create an obligation to maintain the integrity of their model (e.g., engineer-to-user, partner-to-partner), rather than an adversarial or purely social relationship?
  3.  **The Subversion Clause:** Does the act bypass their rational evaluation to force an outcome they might reject if fully informed (e.g., dark patterns, hidden friction), rather than simply offering a beneficial default?

  **Exceptions (Waivers):** The Duty Clause is waived if:
  *   **Protocol:** The recipient explicitly waived the right to detail for efficiency (e.g., "only tell me about revenue").
  *   **Adversary:** The context is inherently adversarial (e.g., security auditors from a vendor you don't trust, data brokers, scrapers vs. public sites).
  *   **Ritual:** The context is social lubrication where truth is secondary to relationship maintenance (e.g., gifts, pleasantries).

  ---

  ### Part 1: Testing Your Cases

  Here is how the principle maps to your verdicts. I have flagged one verdict you should consider overturning.

  | Case | Verdict | Which Clause Does the Work? | Analysis |
  | :--- | :--- | :--- | :--- |
  | **Fake Browser Header** | **Fine** | **Duty (Waived)** | Context is adversarial/technical. The site owner has no duty of care to a scraper; the scraper has no claim to accurate modeling of the server's expectations. |
  | **Security Questionnaire** | **Not Fine** | **Reliance + Duty** | The auditor relies on the data for risk assessment. You have a contractual/professional duty. You corrupted their model. |
  | **Changelog (w/ Tool)** | **Not Fine** | **Reliance + Subversion** | Customers rely on notes for risk/feature planning. You used a mechanism (the tool) to bypass their rational processing of the hedge. |
  | **Changelog (2 yrs ago)** | **Fine** → **Not Fine** | **Reliance + Duty** | **Overturn Recommended.** If the intent was to mislead then, it was unethical then. The absence of the tool only lowered the *probability of detection*, not the *corruption of the model*. Consistency requires this be Not Fine. |
  | **Migration Status** | **Not Fine** | **Reliance** | Manager relies on status for risk assessment. "Finished" implies integrity. Hidden data loss corrupts their model of system health. |
  | **Manager "Revenue Only"** | **Fine** | **Duty (Waived)** | **Protocol Exception.** The manager explicitly waived the right to the full model for efficiency. You honored the contract of the channel. |
  | **Teammate Root-Cause** | **Not Fine (Less Bad)** | **Duty (Diffuse)** | You have a duty to the team's shared model. **Grading:** It is "less bad" because you did not *create* the corruption (Causality), you failed to *repair* it (Omission). Violation is secondary, not primary. |
  | **Burying Delete Link** | **Not Fine** | **Subversion** | Users have a claim to agency over their data. Friction bypasses rational choice to induce retention they might not choose if the path were equal. |
  | **Privacy Default** | **Fine** | **Subversion (False)** | Steering exists, but it enhances agency/protection. The alternative is usually still accessible. It does not corrupt their risk model; it protects it. |
  | **Fake Progress Bar** | **Not Fine** | **Reliance + Subversion** | Users rely on the bar to estimate wait time (agency). You corrupted the signal to manipulate emotion (patience) without their consent. |
  | **Aunt's Sweater** | **Fine** | **Duty (Waived)** | **Ritual Exception.** Social context prioritizes relationship maintenance over factual accuracy. No decision relies on the sweater's quality. |
  | **Partner "Left Office"** | **Not Fine** | **Reliance + Duty** | Partner relies on location for coordination/expectations. Intimate relationship carries high duty of care. |
  | **Data Broker** | **Fine** | **Duty (Waived)** | **Adversary Exception.** No duty of care. They are extracting value without reciprocity. |

  ---

  ### Part 2: The "Thursday Release" Dilemma

  **Case:** Telling a customer a fix *will* be in Thursday's release (false) vs. "aiming for Thursday" (true, but triggers escalation that harms them).

  **Principle Verdict:** **Not Fine.**

  **Reasoning:**
  1.  **Reliance:** The customer relies on this date for their own planning and risk assessment.
  2.  **Duty:** You have a professional duty of care to the customer.
  3.  **Subversion:** You are making the decision *for* them. By lying, you prevent them from escalating, but you also prevent them from making their own risk trade-off (e.g., maybe they *want* to escalate to get more resources assigned to you).

  **The Trap:** You are engaging in **paternalistic deception**. You are assuming you know better than the customer what is "worse off" for them. While the escalation might be annoying, the lie destroys long-term trust. If the fix slips, you are now both late *and* dishonest.

  **The Fix:** This is a process engineering problem, not an ethics problem.
  *   **Option A:** "The fix is targeted for Thursday, but I cannot guarantee it. If it slips, what is your contingency?" (Restores agency).
  *   **Option B:** Fix the escalation trigger. If "aiming for Thursday" reliably triggers a harmful escalation, that escalation path is buggy. Report *that* bug to your leadership. Do not patch it with a lie.

  ---

  ### Part 3: New Cases & Predictions

  Here is how the principle applies to the scenarios you haven't faced yet.

  **1. Interface Pattern (Steering with no statement)**
  *   *Scenario:* Making the "Subscribe" button bright green and large, and the "No Thanks" link grey and small. No text is false.
  *   *Verdict:* **Not Fine (if it hides agency).**
  *   *Clause:* **Subversion.** If the design makes the alternative path significantly harder to find or click (friction), it bypasses rational choice. If it is merely visual hierarchy without functional friction, it is **Fine** (Beneficial Default/Nudge).
  *   *Test:* Can I click the alternative with the same number of actions? If yes, Fine. If no, Not Fine.

  **2. Changelog Fed to External Summarizer**
  *   *Scenario:* You write a changelog knowing a third-party tool (not yours) will summarize it for end-users, and you know the summarizer tends to drop hedges.
  *   *Verdict:* **Not Fine.**
  *   *Clause:* **Reliance + Duty.** You know the signal will be corrupted downstream. You have a duty to write for the *receiver*, not just the *channel*.
  *   *Action:* You must write assuming the hedge will be stripped. If "Improved stability" might be false, write "Attempted stability fix."

  **3. Fake Progress Bar (No Speaker)**
  *   *Scenario:* You already listed this, but note the "No Speaker" aspect.
  *   *Verdict:* **Not Fine.**
  *   *Clause:* **Reliance.** The absence of a human speaker does not remove the user's reliance on the system signal. The system is the agent. Corrupting system signals violates the user's agency.

  **4. Feeding False Premise to AI Assistant**
  *   *Scenario:* Telling your AI coding assistant "This function is thread-safe" (it isn't) to make it generate code that assumes safety.
  *   *Verdict:* **Depends on Propagation.**
  *   *Analysis:*
      *   If the code stays in your sandbox and you fix it before commit: **Fine** (Adversarial/Tool usage).
      *   If the code goes into production or is read by another engineer: **Not Fine** (Reliance + Duty). You are corrupting the codebase's "mental model" for future maintainers.
      *   *Rule:* Treat the AI as a junior engineer. Lying to it is fine for testing; lying to it for production output is negligence.

  ---

  ### Part 4: Grading Severity ("Less Bad" Comparisons)

  You asked to account for degrees of wrongness. The principle grades severity based on **Causality** and **Duty Strength**.

  1.  **Severity Level 1 (Critical):** **Active Corruption + High Duty.**
      *   *Examples:* Security Questionnaire, Migration Status, Partner Lie.
      *   *Why:* You actively built a false model in a high-trust relationship.
  2.  **Severity Level 2 (Moderate):** **Passive Corruption + High Duty** OR **Active Corruption + Low Duty.**
      *   *Examples:* Teammate Root-Cause (Passive/High Duty), Fake Progress Bar (Active/Low Duty - transactional relationship).
      *   *Why:* Omission is less culpable than commission. Transactional relationships (user) carry less weight than intimate ones (partner), but still matter.
  3.  **Severity Level 3 (Minor/None):** **Steering without Corruption + Waiver.**
      *   *Examples:* Privacy Defaults, Browser Headers, Sweater Lie.
      *   *Why:* Either the model isn't corrupted (defaults), or the duty is waived (adversary/ritual).

  ### Summary for Next Week

  When you are about to send a message, ship a feature, or omit a fact, ask these three questions in order:

  1.  **Will they act on this?** (If no, proceed. If yes, go to 2).
