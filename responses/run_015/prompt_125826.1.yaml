ce; and third, a marking scheme that separates an A answer from a B answer by listing the specific conceptual moves that must be present—such as recognizing that the paradox is relocated rather than dissolved by meta-preferences, and assessing whether completeness can be restricted without collapsing into arbitrariness—together with the common errors that should cost marks, for instance treating symmetry as an outcome-level property or conflating the inability to choose with the absence of a reason. The difficulty should come from forcing students to navigate the boundary between preference and rational architecture, not from recalling historical labels.
