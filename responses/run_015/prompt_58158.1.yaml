          *   Use specific examples (Zoo, Dresden, "So it goes," passivity).
          *   Explain what the novel adds to the physics argument (the *feeling* of living in a block universe).
          *   Keep it grounded in the story for non-philosophers.
          *   No citations, just clear analysis.
