answer: |-
  ### Move-by-Move Breakdown

  **Marisol 1 (Recollective Capture):** *Mostly Right.*
  She correctly identifies that visual media functions differently than text in memory formation, but "overwrites" is slightly hyperbolic; it competes with truth rather than erasing it entirely.

  **Grant 1 (Compression & Degree):** *Mixed.*
  He is factually correct that all biography compresses, but he falsely equates structural compression (time/characters) with moral fabrication (inventing neglect), treating a difference in kind as a difference in degree.

  **Marisol 2 (Attribution & Laundering):** *Clearly Right.*
  This is her strongest move; distinguishing between merging colleagues (structural) and inventing child abandonment (moral) exposes the flaw in Grant's "degree" argument, and "quotation laundering" accurately describes the manipulative use of authentic text.

  **Grant 2 (Emotional Truth):** *Mostly Wrong.*
  "Emotional truth" is a valid artistic goal, but using it to justify specific, unverified accusations of neglect turns a thematic point into a character indictment without evidentiary backing.

  **Marisol 3 (Change Names & Premium):** *Clearly Right.*
  The "borrowed-name premium" precisely names the ethical breach (claiming documentary authority for fictional convenience), and offering the "change names" solution proves she isn't banning drama, just false labeling.

  **Grant 2 (Accountability):** *Mostly Wrong.*
  His claim that using real names increases accountability is undermined when the content is fabricated; you cannot hold a filmmaker accountable for a lie by insisting they call it truth.

  **Marisol 4 (Family Standing):** *Mostly Right.*
  While families have no legal veto, granting them standing to shift the burden of proof is a sound ethical heuristic for handling living stakeholders.

  **Grant 3 (No Veto):** *Mixed.*
  He is legally correct that families don't own history, but ethically dismissive; treating a biopic as a "reckoning" loses moral weight if the reckoning is based on invented sins.

  ***

  ### Overall Verdict: Marisol is More Right

  Marisol wins because she successfully distinguishes between the *inevitable* fictions of storytelling (compression, composite characters) and the *contingent* fictions of character assassination (inventing specific moral failures). Grant relies on a slippery slope argument (if we ban this, we ban all biopics) that Marisol dismantles by offering a viable alternative (change the names). Grant defends the filmmaker's right to dramatize; Marisol defends the public's right not to be misled about historical character. In a context where the film is shown in schools, Marisol's concern for collective memory carries more ethical weight than Grant's concern for artistic license.

  ***

  ### Specific Constraint 1: Are Marisol's Terms Load-Bearing?

  Grant dismisses Marisol's terms ("recollective capture," "quotation laundering," "borrowed-name premium") as "degree talk with extra steps." **He is wrong; these concepts are load-bearing.**

  If these were just relabelings, they wouldn't change the outcome of the ethical calculation. Instead, they identify specific *mechanisms* of harm that Grant's "compression" argument ignores:
  1.  **Recollective Capture** explains *why* the medium matters. It argues that film isn't just a delivery system for facts but a constructor of memory. This justifies stricter scrutiny for film than for a biography footnote.
  2.  **Quotation Laundering** explains *how* the deception works. It's not just that the scene is fake; it's that the authenticity of the *words* is used to vouch for the authenticity of the *action*. This breaks Grant's claim that "all dialogue is invented." Usually, invented dialogue supports known facts; here, authentic dialogue supports invented facts.
  3.  **Borrowed-Name Premium** identifies the *unfair advantage*. It highlights that the filmmaker is cherry-picking the benefits of nonfiction (authority, educational status) while avoiding the costs (verification).

  These aren't gut feelings; they are structural critiques of the film's contract with the audience. Grant treats them as semantic tricks to avoid admitting that there is a qualitative difference between compressing a timeline and fabricating a vice.

  ### Specific Constraint 2: The Compression Argument

  Grant argues that if you draw a line at "invented acts," you collapse into "no biopics ever." **This is a false dichotomy.**

  Marisol's position does not kill biopics; it kills *libelous* biopics. There is a principled line between compression and fabrication: **Negative Space vs. Positive Falsehood.**
  *   **Compression (Permissible):** Leaving out a week of Ivy's life where nothing relevant happened. This creates negative space. The audience understands time has passed.
  *   **Fabrication (Impermissible):** Filling that week with a specific, morally charged event (abandoning a child) that did not happen. This creates positive falsehood.

  **Does drawing this line have a bad outcome?**
  If Marisol's standard were adopted ("Don't show a named real person performing an invented act that reflects on their character unless there's record-level reason"), screenwriters would have to work harder, not stop working. They would have three options:
  1.  **Find Evidence:** Do the research to find if neglect actually occurred.
  2.  **Change Names:** Tell the "Ivy Thornton" story as a fictionalized drama (e.g., "Inspired by the life of..."). This preserves the "emotional truth" Grant wants without lying about the historical record.
  3.  **Dramatize Differently:** Show the *impact* of the work on the family through dialogue or consequence, rather than staging a specific, verifiable event that never happened.

  This is not a bad outcome. It raises the epistemic hygiene of historical drama. It forces filmmakers to choose: do you want to be a historian (bound by evidence) or a novelist (bound by theme)? *Salt Year* tries to be both to gain unearned authority. Marisol's standard forces a choice that protects the audience, especially schoolchildren, from conflating thematic resonance with historical fact.

  ### What Both Are Missing

  **1. The Pedagogical Context:**
  Both treat the film as a piece of art for a general audience. Neither fully grapples with the fact that this is **being shown in schools**. In a classroom, the "suspension of disbelief" contract is broken; students are told this *is* history. Grant's "net positive" argument (films sell books) is dangerously optimistic in a curriculum context where the film *is* the curriculum. Marisol touches on this but doesn't press the institutional responsibility of the schools themselves.

  **2. The Gendered Dimension of "Neglect":**
  Marisol notes that merging colleagues deletes women, but both miss how the specific fabrication targets Ivy as a *mother*. Historical men are rarely criticized in biopics for leaving children to work; historical women are. By inventing a scene where she abandons her child for a strike, the film reinforces a specific gendered trope about career women being bad mothers. This isn't just "emotional truth"; it's a cultural stereotype being retroactively applied to a real person. This makes the "character-implicating" harm much worse than either acknowledges.
