answer: |-
  Here is a principle designed to fit your pattern, an analysis of where your intuitions conflict, and a verdict on the hard cases.

  ### The Principle: Salient Dependence

  An omission or absence $O$ is a cause of an outcome $E$ if and only if two conditions are met:

  1.  **Counterfactual Dependence:** Had the positive event corresponding to $O$ occurred, $E$ would not have occurred.
  2.  **Systemic Expectation:** The positive event was part of the **normal or expected functioning** of the specific system in which $E$ occurred.

  **"Systemic Expectation"** is the workhorse here. It is broader than "moral duty." It includes:
  *   **Statistical Norms:** What usually happens in nature (Case iii).
  *   **Functional Norms:** What a role or machine is designed to do (Case v, Case vi).
  *   **Deontic Norms:** What someone promised or is obliged to do (Case i).

  If an event is not part of the system's expected script, its absence is a **bare absence**, not a cause (Case ii).

  ---

  ### Application to Your Cases

  *   **(i) The Neighbor:** The "system" is your plant-care arrangement. Watering was an expected function (promise). **Verdict: Cause.**
  *   **(ii) The Stranger:** The stranger is outside the "plant-care system." Their watering was not an expected function of that system. **Verdict: Not a Cause.**
  *   **(iii) The Rain:** The "system" is the agricultural ecology. Rain is a statistically expected input for crops. Its absence is a deviation from the system's normal course. **Verdict: Cause.** (This fits your intuition but requires expanding "norm" to include "statistical expectation.")
  *   **(iv) The Locked Nurse:** The "system" is ICU care. The dose is an expected function. The *absence of the dose* causes the death. However, because the nurse was physically prevented, her *agency* is severed from the omission. The cause is the *situation* (the locked closet), not the *agent*. **Verdict: Dose omission = Cause; Nurse's agency = Not a cause.**
  *   **(vi) The Dean:** The "system" is institutional leadership. Denying false rumors is an expected function of preserving trust. **Verdict: Cause.**

  ### The Conflict: Case (v) and the "Norm" Requirement

  This is where your current view is inconsistent. You say in (v) that the physician's omission caused the death, yet she "violated no norm."

  **The Hard Truth:** You cannot have it both ways.
  If you maintain that the stranger (ii) is *not* a cause because there was no expectation/norm, then you must admit that for the physician (v) to *be* a cause, there **must** be a norm or expectation in play.

  If there were truly *no* expectation that the physician administer the drug (just as there was no expectation the stranger would fly in), then her inaction would be causally inert, like the stranger's. The only reason her inaction stands out as a cause is that **medical systems are functionally defined by saving patients.**

  **The Fix:** You must revise your description of (v). She *did* violate a norm: the **functional norm** of her role (heal the patient). She did not violate a **bureaucratic norm** (follow policy).
  *   **Causation** tracks the functional norm (did the system fail to do what it's for?).
  *   **Blame/Justification** tracks the bureaucratic norm (did she break a rule?).

  **Verdict to Drop:** You must drop the claim that "no norm was violated" in (v). A norm *was* violated (the medical expectation), which is why it counts as a cause, even though that violation was *justified* by a conflicting rule. If you insist absolutely no norm was violated, logic demands you treat it like the stranger (ii) and say it wasn't a cause. Given your strong intuition that it *is* a cause, you must accept the existence of the background functional norm.

  ### Verdict on Case (vii): The Two Neighbors

  **Verdict:** **Both caused the death.**

  **Reasoning:**
  Your worry ("counting one death twice") treats causation like a conserved quantity (like energy), where if one cause is used up, there isn't enough left for another. Causation is not like that. Two bullets can kill one man; both are causes.

  In this case, the "system" was a joint care arrangement. Both neighbors were part of the expected script for keeping the plant alive. The system relied on redundancy (or joint effort).
  *   If Neighbor A had watered, the plant lives. (A's omission was sufficient to kill).
  *   If Neighbor B had watered, the plant lives. (B's omission was sufficient to kill).

  Because both were "expected preventers" within the system, both omissions satisfy the Principle of Salient Dependence. It is not counting the death twice; it is acknowledging that the system had two distinct points of failure, and both failed.

  ### Prediction: The Backup Generator

  To test if this principle is doing work, apply it to this new case:

  **The Case:** A hospital has a main power supply and a backup generator.
  *   **Scenario A:** The backup generator is standard equipment, inspected weekly, and expected to kick in if main power fails. Main power fails. The generator *fails to start* (omission). Patients die.
  *   **Scenario B:** The hospital has no backup generator. Main power fails. Patients die. (One might say "the absence of a generator caused the death").
  *   **Scenario C:** The hospital has a backup generator, but it is an old, decommissioned unit stored in the basement, known by everyone to be broken and never expected to be used. Main power fails. The generator *fails to start*. Patients die.

  **Prediction based on Salient Dependence:**
  *   **Scenario A:** The generator's failure to start **is a cause**. It was part of the system's expected functioning.
  *   **Scenario B:** The absence of a generator is **not a cause**. It is a bare absence (like the stranger). The system was not expected to have one.
  *   **Scenario C:** The generator's failure to start is **not a cause**. Even though the physical object existed, it was not part of the "expected functioning" of the active system. It is causally equivalent to Scenario B.

  If you find Scenario C intuitively different from Scenario A, the principle holds. If you think the broken generator in (C) *is* a cause, then "physical presence" matters more than "expectation," and the principle needs adjustment.

  ### The Cost of This Account

  The cost is **Disjunctive Normativity**.
  To make (iii) (Rain) and (i) (Neighbor) fit under the same principle, we have to stretch the word "Norm" or "Expectation" to cover both *moral/promise-based expectations* and *statistical/meteorological regularities*.

  Some philosophers find this uneasy. They prefer to say rain causing corn failure is "physical causation" (a lack of a physical input) while the neighbor causing plant death is "social causation" (a lack of an intervention).
  *   **If you accept the disjunction:** You can say there are two kinds of omission-causation. One requires a system agent (Neighbor), one requires only a natural system (Rain).
  *   **If you accept the Unified Principle (as I propose):** You must accept that "cause" is always relative to a "model of normality." There is no "view from nowhere" on causation. The stranger is not a cause *from the perspective of your plant-care system*, even if they are a cause *from the perspective of the universe's total particle history*.

  **Recommendation:** Stick with the Unified Principle (Salient Dependence). It explains why the stranger (ii) is excluded (wrong system) and why the rain (iii) is included (right system, statistical norm). It forces you to clarify (v) (functional norm vs. bureaucratic rule), which strengthens your overall view by separating *causation* from *justification*.
