      *   *Looking closer at (5) vs (7a):* (5) says function is selection history. (7a) says extinct DNA still codes. If the organism is extinct, there is no current selection history, and if it's reconstructed, it has no *past* history of being selected *in that context*. This is a direct contradiction. Teleosemantics usually struggles with novel sequences or extinct sequences unless they appeal to *type* history.

      *   *Decision on Severity:*
