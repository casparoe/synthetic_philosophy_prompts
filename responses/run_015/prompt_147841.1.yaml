      *(Self-Correction during drafting)*: I need to make sure I don't just say "Teleosemantics is hard." I need to explain *why* it breaks (7a). If a sequence is reconstructed from an extinct organism, it has no *current* selection history. If it's synthesized *de novo*, it has *no* selection history. Yet (7a) says it codes. Teleosemantics says no function = no content (or at least no proper function). This is a direct contradiction.
