  6.  **Finalizing the Audit Structure:**
      *   **Severity 1 (Structural):** (5) Selection History vs. (7a) Extant Content. (Teleosemantics vs. Combinatorial Content).
      *   **Severity 2 (Structural):** (3) Deflationary vs. (4) Intrinsic. (Nature of Meaning).
      *   **Severity 3 (Scope):** (4) Sequence-Dependence vs. (7b) Prions. (Limits of the Analogy).
