  hey, retired physicist here, finally getting into philosophy now that i have the time. im trying to understand this bit in bradley's appearance and reality (1893) where he argues that if A and B stand in some relation R, then R itself has to be related to both A and B, which requires further relations, and the chain never stops. he seems to conclude that relations are therefore contradictory or unreal, but i dont see why an infinite regress is automatically impossible — is he just ruling out infinitism by fiat?

  it actually reminds me of calibrasion loops in old lab gear, where two sensors depend on each other with no external ground. is there some niche epistemic idea — maybe bootstrap coherence — that lets circular dependancy work without collapse, or does bradley's regress also block coherentism? and if relations are out, does foundationalism escape by just stopping at bare basic beliefs, or does the regress bite there too?
