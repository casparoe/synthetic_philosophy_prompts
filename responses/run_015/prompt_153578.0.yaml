      *   *Does Bradley accept this?* No. For Bradley, coherence without a unified ground is still just a web of relations, which suffers the same regress. Coherence *within* appearance is fine, but it doesn't reach *Reality*.
      *   *Bootstrap Coherence:* In epistemology (e.g., Davidson, BonJour), circular justification can work if the system is sufficiently comprehensive. But Bradley is an *ontologist* here, not just an epistemologist. He's talking about what *exists*, not just what we can *know*.

