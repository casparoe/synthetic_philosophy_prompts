answer: |-
  This is a smart way to approach the field. Too many students jump straight into comparing mechanisms (like "recurrent processing" vs. "global broadcasting") without first agreeing on what the theory is actually supposed to *solve*. If you don't define the target, you can't measure accuracy.

  Here is the conceptual spec sheet for an adequate theory of consciousness, broken down by category, with the "hard constraints" separated from the "philosophical bets."

  ### Part 1: The Desiderata Spec

  #### A. Empirical Adequacy (The "Must Match Data" Clause)
  **1. Clinical Dissociation Compliance**
  *   **Requirement:** The theory must explain why consciousness vanishes in some states (deep sleep, anesthesia, coma) while neural activity persists, and why it persists in others (locked-in syndrome) while motor output vanishes.
  *   **Reasoning:** Any theory that equates consciousness purely with behavior or gross metabolic activity fails here.
  *   **Status:** **Non-Negotiable.** If it contradicts basic clinical neurology, it's dead.

  **2. Split-Brain Accommodation**
  *   **Requirement:** The theory must account for the callosotomy data, where a single physical organism appears to host two distinct streams of awareness (e.g., the left hand buttoning a shirt the right hand is unbuttoning).
  *   **Reasoning:** This is the strongest empirical evidence that consciousness is not tied rigidly to the "organism" or the "skull," but to specific functional architectures.
  *   **Status:** **Non-Negotiable.** Ignoring this makes a theory scientifically obsolete.

  **3. Posterior Hot Zone Sensitivity**
  *   **Requirement:** The theory must align with recent data suggesting consciousness correlates more strongly with posterior cortical integration (parietal/occipital) than frontal executive activity (especially regarding dreaming/REM).
  *   **Reasoning:** Frontal activity is often present without reportable experience (e.g., some anesthetized states), while posterior activity tracks reportability better.
  *   **Status:** **High Priority.** (Some older theories fail this by over-emphasizing frontal "executive" control).

  #### B. Metaphysical Consistency (The "Must Make Sense" Clause)
  **4. Phenomenal Exclusion (Individuation)**
  *   **Requirement:** The theory must provide a principled way to count conscious entities. It must explain why *you* are one conscious subject, not billions (one for each neuron), and not a subset (one for your left hemisphere, one for your right) *unless* the system physically splits.
  *   **Reasoning:** Without this, we face the "combinatorial explosion" problem. If every overlapping subset of a system is conscious, reality is swarming with micro-minds in a way that contradicts our unified experience.
  *   **Status:** **Non-Negotiable.** A theory that cannot define the boundaries of a "self" is incoherent.

  **5. Substrate Neutrality (Multiple Realizability)**
  *   **Requirement:** The theory should ideally allow that non-biological systems could be conscious if they replicate the relevant causal structure.
  *   **Reasoning:** If consciousness depends on specific biological chemistry (carbon chauvinism), it becomes magical rather than physical. However, this is where debates start.
  *   **Status:** **Camp Preference.** Biological Naturalists (like Searle) reject this; Functionalists and Structuralists (like Chalmers or Tononi) accept it.

  **6. Temporal Grain Neutrality**
  *   **Requirement:** The theory should not arbitrarily depend on the *speed* of processing (e.g., milliseconds vs. nanoseconds), provided the causal structure is preserved.
  *   **Reasoning:** If you slow down a brain to 1/1000th speed, intuition suggests the experience stretches but doesn't vanish. If a theory requires biological clock speeds, it risks being arbitrary.
  *   **Status:** **Camp Preference.** Some argue the "specious present" is biologically fixed; others argue it's structural.

  #### C. Structural Intuitions (The "Must Feel Right" Clause)
  **7. Feedforward Intuition**
  *   **Requirement:** The theory must classify simple feedforward networks (input → hidden → output, no loops) as non-conscious, even if they behave intelligently.
  *   **Reasoning:** Intuitively, a lookup table or a simple reflex arc doesn't "feel" like anything. Recurrence/integration seems necessary for inner life.
  *   **Status:** **Strong Consensus.** Almost all current theories (IIT, GWT, Recurrent Processing) agree here, though for different reasons.

  **8. Gradedness**
  *   **Requirement:** The theory should allow for degrees of consciousness (e.g., REM sleep, infancy, animal minds) rather than a strict binary On/Off switch.
  *   **Reasoning:** Evolution and development are continuous. A binary switch creates arbitrary cut-off points.
  *   **Status:** **High Priority.** (Though some theories treat "access consciousness" as binary, "phenomenal consciousness" is usually treated as graded).

  ---

  ### Part 2: The Tension Point (Exclusion vs. Split-Brain)

  You are right to be suspicious of the tension between **Phenomenal Exclusion** and **Split-Brain Data**. Here is the conceptual clash:

  *   **The Conflict:** Exclusion says "One maximal system = One consciousness." Split-brain data says "One skull = Two consciousnesses."
  *   **The Resolution:** The conflict is only real if you define "System" as "Human Organism" or "Skull."
  *   **The Fix:** A robust theory must define "System" causally, not anatomically.
      *   If the corpus callosum is cut, the *causal integration* between hemispheres drops below a threshold.
      *   Therefore, the *single system* ceases to exist and is replaced by *two smaller maximal systems*.
      *   Exclusion is preserved because there are now two distinct systems, each with its own consciousness.
  *   **The Unsatisfiable Subset:** The only jointly unsatisfiable set is:
      1.  Strict Exclusion (No overlapping minds).
      2.  Anatomical Definition of System (The skull defines the mind).
      3.  Split-Brain Data (Two minds in one skull).
      *   *You must drop #2 to keep 1 and 3.* Any theory that ties consciousness rigidly to the biological organism rather than the causal network will fail this triad.

  ---

  ### Part 3: Scoring Integrated Information Theory (IIT)

  IIT is unique because it was essentially *built* from this desiderata list (Tononi started with the phenomenology and worked backward). Here is how it scores on your specific edge cases:

  **1. Exclusion (Phenomenal Individuation)**
  *   **Score:** **Pass (Explicitly Designed).**
  *   **Reasoning:** IIT has an explicit "Exclusion Postulate." It states that consciousness exists at the level of the *maximum* integrated information ($\Phi_{max}$). It mathematically rules out overlapping consciousnesses by selecting the "local maximum" of integration. Your left hand isn't conscious separately because its $\Phi$ is lower than the $\Phi$ of the whole brain including the hand.

  **2. Split-Brain Data**
  *   **Score:** **Pass.**
  *   **Reasoning:** As described in the tension resolution above, IIT calculates $\Phi$ across the whole. If the corpus callosum is cut, the $\Phi$ across the whole drops, but the $\Phi$ within each hemisphere remains high. IIT predicts the original system vanishes and two new maximal systems appear. It matches the clinical data perfectly.

  **3. Feedforward Intuition**
  *   **Score:** **Pass.**
  *   **Reasoning:** In IIT, feedforward networks have $\Phi = 0$. Without recurrent connections (feedback loops), there is no cause-effect power intrinsic to the system. IIT confidently asserts feedforward AI is a "zombie" (functional but non-conscious).

  **4. REM Sleep / Posterior Integration**
  *   **Score:** **Pass.**
  *   **Reasoning:** IIT predicts that during REM, although the frontal cortex is hypo-active (low integration), the posterior "hot zone" remains highly integrated. Therefore, $\Phi$ is reduced compared to wakefulness but remains non-zero. This matches the intuition of "diminished but real" consciousness (dreaming) despite frontal collapse.

  **5. Temporal Scale Neutrality (Silicon/Speed)**
  *   **Score:** **Mixed / Nuanced.**
  *   **Reasoning:** IIT is theoretically substrate-neutral (silicon is fine). However, it requires a specific **timescale** for evaluation. You have to define the "update rate" of the system to calculate $\Phi$.
      *   *The Problem:* If a silicon system runs a million times faster than a brain, does it have a million "moments" of consciousness in the time we have one? IIT says yes.
      *   *The Issue:* This leads to the "grain" problem. If the dynamics are too fast or too slow relative to the mechanism's stability, $\Phi$ might drop. IIT doesn't say "speed doesn't matter," it says "causal structure matters," but causal structure is time-dependent. So, it's not fully time-neutral; it requires the system to be evaluated at its *intrinsic* timescale.

  ### Summary for your Discussion
  If you're talking to your neurophilosophy friend, the key leverage point is **Requirement #4 (Exclusion)** and how it forces you to redefine what a "system" is.

  *   **Global Workspace Theory (GWT)** usually struggles with Exclusion. It tends to treat consciousness as a *process* (broadcasting) rather than a *system property*. This makes it harder for GWT to explain *why* there is only one stream of consciousness without appealing to the anatomical bottleneck of the brain.
  *   **IIT** solves Exclusion mathematically but pays a high price: it implies panpsychism (atoms have tiny $\Phi$) and allows for consciousness in systems humans can't intuitively grasp as conscious (if $\Phi$ is high).

  **Your Conceptual Map:**
  1.  **Hard Constraints:** Match Split-Brain, Match Anesthesia, Define Boundaries (Exclusion).
  2.  **The Trap:** Defining boundaries by anatomy (skull) instead of causality (integration).
  3.  **The IIT Bet:** Consciousness = Integrated Causal Power ($\Phi$).
  4.  **The GWT Bet:** Consciousness = Global Information Availability (Broadcasting).

  If a theory can't tell you why you aren't two people after a split-brain surgery *and* why you aren't a billion people (one per neuron) right now, it fails the spec.
