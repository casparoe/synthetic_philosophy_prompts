answer: |-
  This is a sophisticated dispute that cuts to the very heart of the "accuracy-first" research program (pioneered by philosophers like Jim Joyce, Hilary Greaves, and David Wallace).

  The short answer is: **You are logically correct about the structure of the argument, but your friend is correct about the intended scope of the theory.**

  Here is the breakdown of why both of you have a point, and where the philosophical heavy lifting actually happens.

  ### 1. Your Friend's Position: The Standard Accuracy Argument
  Your friend is describing the canonical "Accuracy Argument for Probabilism," most famously articulated by Jim Joyce in his 1998 paper, *"A Non-Pragmatic Vindication of Probabilism."*

  The argument generally runs like this:
  1.  **The Goal:** The fundamental epistemic good is accuracy (having credences that match the truth).
  2.  **The Measure:** We can measure accuracy using "proper scoring rules" (like the Brier Score), which mathematically quantify how close a credence is to the truth value (1 for true, 0 for false).
  3.  **The Math:** It is a mathematical theorem that if a set of credences violates the axioms of probability, there exists an alternative set of credences that *does* satisfy the axioms and is **more accurate** in every possible world (this is called *accuracy dominance*).
  4.  **The Conclusion:** Therefore, rational credences must satisfy the axioms of probability.

  Your friend is right that this is the *standard conclusion* of accuracy-first epistemology. If you pick up a textbook on formal epistemology, this is the selling point: accuracy-first provides a foundation for probabilism.

  ### 2. Your Position: The Normative Gap
  Your objection is philosophically sharper. You have identified what is often called the **Normative Gap** (or the Is-Ought gap) within the framework.

  You are arguing that:
  *   **Premise A:** Accuracy is the epistemic good (Value Theory).
  *   **Premise B:** [Missing Bridge Principle]
  *   **Conclusion:** You ought to have probabilistic credences (Normative Theory).

  You are absolutely correct that **Value Theory alone cannot generate Norms.** Just because accuracy is *good* does not logically entail that an agent is *irrational* for pursuing something else, or for failing to maximize it, unless you add a normative bridge principle.

  For example, imagine I tell you, "Health is the primary physical good." Does that entail "You are irrational if you eat cake"? No. It only entails that if you also accept the norm, "You ought to maximize physical good."

  In the context of accuracy-first epistemology, the missing bridge principle is a form of **Epistemic Consequentialism**. The theory must assume something like:
  > *"An agent is epistemically rational if and only if they adopt doxastic states that maximize (or do not violate dominance regarding) expected epistemic utility."*

  Without this normative bridge, accuracy-first epistemology is indeed just a theory of value, silent on rationality.

  ### 3. Who is Right?
  The resolution depends on how you define "Accuracy-First Epistemology."

  **If you define it narrowly as the axiology (theory of value):**
  **You are right.** The claim that "accuracy is the fundamental epistemic value" does not, by itself, entail probabilism. One could agree that accuracy is the good but deny that rationality consists in maximizing that good (e.g., a deontological epistemologist might argue rationality is about following rules, not maximizing outcomes).

  **If you define it broadly as the research program:**
  **Your friend is right.** Proponents of accuracy-first epistemology (like Joyce, Greaves, and Pettigrew) explicitly include the normative bridge principle as part of the package. When they say "Accuracy-First," they mean "Accuracy is the *only* fundamental epistemic value, and rationality is defined as the maximization of that value."

  Under that full definition, probabilism is a derived theorem. The mathematical proof of accuracy dominance (that non-probabilities are always less accurate than some alternative) combined with the norm "don't adopt dominated strategies" yields probabilism.

  ### 4. Why Your Objection Matters
  Even though your friend is right about the *intended* conclusion of the theory, your objection highlights the most controversial aspect of the view.

  Many critics of accuracy-first epistemology attack exactly the point you raised. They argue that **epistemic rationality is not consequentialist.**
  *   **The Objection:** Beliefs might not be the kind of thing we "choose" to maximize utility with. If I simply find myself believing something, asking whether it "maximizes accuracy" might be category error.
  *   **The "Right to Believe":** Some argue that even if a non-probabilistic credence is less accurate, it might not be *irrational* if it was formed via a reliable process.

  By pointing out that the theory is "silent about rationality" without a bridge principle, you are forcing your friend to defend **Epistemic Consequentialism**. They cannot simply rest on the math of accuracy; they must defend the normative claim that *rationality consists in maximizing accuracy.*

  ### Verdict
  *   **Your Friend:** Is right that the **standard formulation** of accuracy-first epistemology entails probabilism. That is the main selling point of the theory.
  *   **You:** Are right that the **value claim alone** does not entail probabilism. It requires a controversial normative premise (Epistemic Consequentialism) to get from "accuracy is good" to "you must be probabilistic."

  **How to settle the argument:**
  Tell your friend: *"You are right that Accuracy-First Epistemology **as a complete system** entails probabilism. But I am right that the **accuracy claim alone** does not. The entailment only works if we accept the controversial normative bridge that epistemic rationality is strictly about maximizing epistemic utility. If you reject that bridge principle, the math of accuracy doesn't force you to be a probabilist."*

  This acknowledges the strength of their position (the mathematical dominance theorems) while validating your philosophical insight (the gap between value and norm).

  **Recommended Reading for Ammo:**
  *   **For your friend:** Jim Joyce, *"A Non-Pragmatic Vindication of Probabilism"* (1998).
  *   **For you:** Hilary Greaves & David Wallace, *"Justifying Conditionalization"* (2006) — note how they explicitly argue for the decision-theoretic norms. Or, for a critique of the bridge principle, look for discussions on **"Epistemic Consequentialism"** by authors like Selim Berker. Berker argues that epistemic value cannot ground epistemic norms in the way consequentialists hope.
