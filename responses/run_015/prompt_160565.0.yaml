answer: |-
  **Project Title:** Reconstructive Stability as Heredity: Decoupling Fidelity from Cumulative Cultural Evolution

  **Statement of Problem**
  The applicability of Darwinian theory to culture hinges on the satisfaction of three conditions: variation, differential fitness, and heredity. While variation and selection are readily observed in cultural systems, the heredity condition remains contested. High-fidelity replication—the standard requirement for Darwinian populations—is notably absent in cultural transmission. Cultural learning is rarely copy-and-paste; it is reconstructive. Learners observe degraded signals and rebuild variants using internal priors.

  Critics of memetics (e.g., Sperber, Kroeber) argue that without high-fidelity copying, culture cannot sustain cumulative adaptation; errors accumulate, and lineages dissolve. Defenders (e.g., Boyd, Richerson) argue that fidelity is manufactured via institutions, teaching, and repeated exposure. Both sides, however, operationalize heredity identically: they measure *single-step transmission fidelity* (the correlation between a specific model's output and a specific learner's output). This proposal argues that single-step fidelity is the wrong metric for cumulative culture. A system can have low fidelity but high *reconstructive stability*: if ten learners receive ten different corrupted versions of a variant, do they converge back onto the same functional form after reconstruction? I hypothesize that cumulative adaptive evolution tracks reconstructive stability, not single-step fidelity. A system with poor copying fidelity can still be a Darwinian population if the reconstruction process possesses strong attractors that correct errors, whereas a system with perfect copying but no attractors will merely drift.

  **Critique of Existing Positions**
  Current literature creates a false dichotomy between "replicator" models (high fidelity, Darwinian) and "attractor" models (reconstructive, non-Darwinian). The Cultural Attractors framework correctly identifies that reconstruction drives convergence, but it typically concludes that this precludes Darwinian evolution. This project challenges that conclusion. If an attractor landscape is rugged enough to filter out noise but flexible enough to allow adaptive variation, it satisfies the functional role of heredity without requiring a germ line or high-fidelity copying.

  Conversely, standard evolutionary archaeology and dual-inheritance theory often rely on fidelity metrics that underestimate the stability of reconstructive systems. By conflating *copying accuracy* with *lineage persistence*, existing models fail to identify Darwinian populations where heredity is emergent rather than mechanistic. This project does not seek to rule culture in or out of Darwinism by fiat; it seeks to redefine the heredity condition to accommodate reconstructive transmission.

  **Methodology and Deliverables**
  This is a conceptual project utilizing formal modeling. I will not conduct human participant experiments, as the question is theoretical: *can* such a system exist, not *does* the human mind currently work this way. The primary deliverable will be a "toy model"—a formalized logical or mathematical structure stated within the dissertation text—that demonstrates the decoupling of fidelity and stability.

  The model will define two populations:
  1.  **High-Fidelity/Low-Stability:** Variants are copied accurately, but the reconstruction landscape is flat. Small errors are not corrected and accumulate over generations (drift).
  2.  **Low-Fidelity/High-Stability:** Variants are copied poorly (high noise), but the reconstruction landscape has deep attractors. Errors are systematically corrected during reconstruction, allowing adaptive traits to persist and accumulate.

  By simulating transmission chains analytically, I will demonstrate that Population 2 sustains cumulative adaptation while Population 1 does not, despite Population 1 having superior single-step fidelity. The finished result will be a rigorous definition of "Reconstructive Heredity" that satisfies Lewontin's conditions without requiring replicators.

  **Work Plan (Six Months)**
  *   **Months 1–2: Formalization of Definitions.** I will refine the distinction between fidelity and stability using existing literature on dynamical systems and evolutionary theory (Godfrey-Smith, Sterelny). The goal is to produce a glossary of terms precise enough for modeling.
  *   **Months 3–4: Model Construction.** I will develop the toy model. This involves defining the state space of cultural variants, the noise function (transmission error), and the reconstruction function (attractor landscape). I will run analytical derivations to show convergence conditions.
  *   **Months 5–6: Integration and Writing.** I will integrate the model results into the broader philosophical argument. The final output will be a dissertation chapter (approx. 8,000 words) containing the argument, the model, and the implications for the definition of Darwinian populations.

  **Risk Assessment and Failure Conditions**
  There are two primary risks to this project. First, the model may trivialize the problem. If the "attractors" in the Low-Fidelity/High-Stability model are too rigid, the system cannot vary, and cumulative *adaptation* becomes impossible (stasis). I must ensure the model allows for adaptive peaks to shift. If I cannot mathematically demonstrate how variation enters a high-stability system without collapsing into drift, the project fails to distinguish itself from standard attractor theory.

  Second, the project could collapse back into the standard meme-versus-attractor debate. If "reconstructive stability" is simply renamed "selection," I will have added no value. To avoid this, I must strictly locate stability within the *heredity* condition, not the *selection* condition. Stability ensures the variant survives transmission; selection ensures it spreads. If I cannot maintain this distinction, the project will require empirical data on cognitive priors to validate the reconstruction functions, which is beyond the scope of a six-month conceptual fellowship.

  **Feasibility**
  This scope is appropriate for a six-month fellowship. Because I am not collecting empirical data or building complex computational simulations, the timeline relies on analytical work and writing. The toy model is designed to be simple enough to be stated in a paragraph yet robust enough to prove the logical possibility of the hypothesis. If the model proves more complex than anticipated, I will scale back the mathematical derivation to a logical proof, which still satisfies the philosophical aim of the project.

  ***

  ### Meta-Commentary: Is this too big for six months?

  **Straight talk:** It is tight, but doable *if* you stick to the constraints you set in the proposal.

  1.  **The Trap:** The biggest risk is "model creep." You say "toy model," but in practice, that often turns into "I need to learn Python/Simulink to run this." If you try to code a complex agent-based simulation, you will not finish in six months.
  2.  **The Fix:** Keep it analytical. Use existing formalisms (like Bayesian updating equations or simple Markov chains) that you can derive on paper or in a notebook. The proposal promises a model "you can state in a paragraph." Hold yourself to that. If it takes three pages to explain the model, it's too complex for this timeline.
  3.  **The Literature:** You need to be very careful with the "Cultural Attractors" literature (Sperber, Claidière, André). They have already done a lot of work on reconstructive transmission. Your specific angle (that this *saves* Darwinism rather than rejecting it) is your niche. If you spend three months just reading them, you won't have time to write.
  4.  **Verdict:** It is feasible for a 6-month fellowship *provided* you treat the model as a philosophical thought experiment with light formalization, not a full scientific simulation. The proposal above is written to reflect that manageable scope.
