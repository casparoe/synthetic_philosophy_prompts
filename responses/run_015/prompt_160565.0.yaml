prompt: |-
  Hey, I need help turning a half-baked idea into an actual proposal. I'm applyng for a six-month dissertation fellowship from my grad school, and they want two pages, single spaced, and explicitly no bibliography — I'll drop the citations in myself later.

  The area is memes and the Darwinian theory of culture. My half-formed idea: everybody fights about whether culture has a replicator. Critics say no — no high-fidelity copying, no discrete units, nothing like a germ line — so memetics is just a metaphor and culture isn't a Darwinian population. Defenders say fidelity can be manufactured: teaching, repeated exposure, institutions that correct errors, so you get cumulative adaptation anyway. I think both sides are measuring the wrong thing. They score fidelity at a single transmission event: how close is the learner's output to what they saw. But most cultural transmission is reconstructive — the learner rebuilds the variant from a degraded observation plus their own priors. So there are two different quantities: single-step fidelity, and what I'm calling reconstructive stability — if you hand ten learners ten different corrupted versions of the same variant, do they converge back onto the same thing after a few rounds, or do they wander off? My hunch is that cumulative culture tracks reconstructive stability rather than single-step fidelity, and that a system with lousy fidelity can still be a Darwinian population in the minimal sense (variation, differential spread, something genuinely inherited) as long as the reconstruction process has attractors — while a system with excellent fidelity and no attractors just drifts.

  So: write me the proposal. Precise question — something like, can cultural variants undergo cumulative adaptive evolution without any high-fidelity replicator, and what plays the role of heredity if so, but sharper than that and with a determinate answer. Why the existing positions don't settle it, including the cultural-attractors style view, which I think has part of this but doesn't separate the two quantities. What I'd actually do month by month, given that this is a conceptual project and I'm not running participants. Why that approach rather than the obvious alternatives — one obvious one is just ruling culture in or out as a Darwinian population by the standard conditions and stopping there; another is piggybacking on existing transmission-chain work and doing an experiment. What a finished result looks like — I'd like a small toy model, the kind you can state in a paragraph, that shows fidelity and stability coming apart. Be honest about failure conditions; I definately haven't thought that through — what would make this collapse back into the older meme-versus-attractor fight, or into something that needs data I can't get. And tell me straight if it's too big for six months. Write it in American English, my committee is all US-based.
