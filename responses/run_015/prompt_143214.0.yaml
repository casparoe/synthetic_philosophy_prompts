      *   *Decision:* The Xunzian argument feels more robust when dealing with *systemic* cynicism in high-stakes professions. The "performative compliance" aspect screams "instrumental use of ritual," which is a classic Xunzian warning. However, a purely Xunzian hardline can seem bleak. A nuanced Xunzian stand—that the *type* of ritual is wrong (external vs. internalized)—might be stronger. Let's argue for the **Xunzian** perspective: Bureaucratic virtue fatigue proves that innate self-interest is resilient and that current "ethical training" is too superficial to count as genuine *wei* (artificial effort). The solution isn't just "nicer environments" (Mencius) but deeper, more demanding structural transformation of the self through ritual.
      *   *Wait, reconsider:* The prompt asks to weigh them and reach a verdict. A Mencian verdict might be more compelling for *reform* in a modern context where "strict ritual" sounds authoritarian. However, the phenomenon described (cynical compliance) fits Xunzi's diagnosis of *human nature* (xing) better. If people were naturally good, why does oversight removal lead to collapse? That suggests the "goodness" was external. I will take the **Xunzian** stand. It offers a sharper critique of the *illusion* of virtue in compliance culture.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: Define "bureaucratic virtue fatigue."
          *   Context: Mencius vs. Xunzi on human nature.
          *   Thesis: Bureaucratic virtue fatigue validates Xunzi's pessimism about innate nature. The problem isn't starved sprouts (Mencius) but incomplete transformation (Xunzi). Reform requires deeper structural internalization, not just environmental nurturing.

      *   **The Mencian Diagnosis (and Critique):**
          *   Explain the Mencian view: Institutions kill empathy.
          *   Apply to fatigue: Doctors/lawyers are tired because they can't be human.
