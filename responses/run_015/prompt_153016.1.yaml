      *   *Incentive Compatibility (Mechanism Design):* Even if the algorithm is perfect, who inputs the data? If I'm a factory manager in this system, do I have an incentive to report true capacity/costs? Blockchain doesn't solve the "garbage in, garbage out" problem if the source is strategic.
