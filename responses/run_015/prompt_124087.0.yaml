answer: |-
  This is a sophisticated and promising draft. You are effectively moving the debate from a metaphysical stalemate (which account is *true*?) to a pragmatic/semantic analysis (how are function terms *used* relative to explanatory goals?). This contextualist/contrastive turn is well-motivated by the molecular cases you cite, which are often too messy for the clean intuitions of the 1990s literature.

  Here are my responses to your four questions, aimed at stress-testing the argument before you polish the prose.

  ### 1. Are Cases A and B genuinely new work?

  **Case B (Borrowed History/HGT):** You are correct to be modest here. Structurally, this is indeed the "first beneficial mutant" problem transposed to the level of the lineage rather than the token. The standard SE response to the first mutant is often to bite the bullet (it has no function yet) or to broaden the lineage (it belongs to a type that was selected). Your HGT case forces the SE theorist to define the boundaries of the relevant lineage with much greater precision. If the gene is a promiscuous mobile element, there *is* no stable vertical lineage. This doesn't necessarily break SE, but it forces the SE theorist to adopt a "metapopulation" reference class that looks suspiciously like the CR theorist's "containing system." It is a strong *stress test* rather than a novel counterexample, but it serves your "parameter-fixing" proposal very well by highlighting the **Reference Class** parameter.

  **Case A (Ancestral Recurrence):** This is the stronger candidate for novelty. It is not standard exaptation (where a new function replaces an old one) nor vestigiality (where an old function is lost). It is a case of **atavistic capacity suppression**.
  *   **Why it matters:** It drives a wedge between *homology* and *etiology*. Standard SE accounts track the selection history of the *token's immediate lineage*. But as you note, biological practice often tracks *deep homology* when assigning dysfunction. If a protein re-evolves a catalytic site that was present in a deep ancestor but lost in the intermediate lineage, and that site is now harmful, biologists call it a "malfunction" or "pathology" relative to the *structural* role, but they acknowledge the *catalytic* capacity as a "reawakened" trait.
  *   **The SE Problem:** SE says it's not a dysfunction because the catalytic effect was never a selected effect of *this* token's recent lineage.
  *   **The CR Problem:** CR says it's not a function because it makes no current contribution (due to the inhibitor).
  *   **Verdict:** Case A reveals that "dysfunction" attributions sometimes rely on a **Deep Time** parameter (ancestral type) rather than a **Recent History** parameter (token lineage). This supports your claim that the dispute is often about which temporal window is active. I would classify this as a genuine contribution, specifically regarding the norms of dysfunction attribution in molecular evolution.

  ### 2. The "Heart Sounds" Objection (Permissiveness)

  The objection that your view is too permissive (the heart makes sounds, therefore sound-production is a function) is the classic objection to Cummins-style CR accounts. Your reply ("explanatory project") is the standard Cummins reply, but it is vulnerable to the charge of making function purely epistemic/pragmatic rather than ontological.

  **A Stronger Version of the Objection:**
  The objection isn't just that *any* effect counts, but that your parameter-fixing view lacks a constraint on the **Containing System (S)** parameter. If I define the system as "The Noise-Making Organism," then the heart's function is to make noise. If your view allows the analyst to freely set the 'System' parameter, then function attributions become trivial. You need a rule that constrains which Systems are legitimate candidates for function analysis.

  **A Stronger Reply (Organizational Closure):**
  To avoid collapsing into "anything goes" pragmatism, you should constrain the **Capacity (C)** parameter using **Organizational Closure** (or self-maintenance).
  *   *Proposal:* A capacity counts as a candidate for function attribution only if it contributes to the maintenance of the containing system (or the system's reproductive continuity).
  *   *Application:* Heart sounds do not contribute to the maintenance of the organism. Circulation does. This anchors the "explanatory project" in the biological reality of the organism's persistence, not just the biologist's interest.
  *   *Benefit:* This saves your view from the "Heart Sounds" objection without requiring you to adopt SE. It says: "Yes, function is contrastive and parameter-relative, *but* the parameters are constrained by the causal topology of self-maintaining systems." This distinguishes your view from simple pluralism by providing a unified constraint on the parameters.

  ### 3. Is the Normativity Repair Unstable?

  **Yes, I think you are right to worry.**
  Your repair in Section 4 attempts to ground normativity (dysfunction) in "design intention" for artificial cases and presumably "selection" for biological ones.
  *   **The Instability:** If you allow "design intention" to ground normativity, you are conceding that normativity *requires* a history of intentional or selective retention. This validates the core intuition of the SE account (that normativity is etiological).
  *   **The Collapse:** If normativity requires history, then your claim that "function claims are synchronic" is only half-true. You effectively have two concepts: *Capacity-Function* (synchronic, CR-like) and *Normative-Function* (diachronic, SE-like).
  *   **The Risk:** SE proponents (like Millikan or Neander) will argue: "Exactly. The only reason you can call the bad enzyme 'broken' is because it fails a historical standard (design). The only reason you call the heart 'functional' is because it meets a historical standard (selection). Therefore, history is essential for *all* normative function."
  *   **Suggestion:** To avoid collapsing back into SE, you must be explicit that you are offering a **disjunctive** account of normativity, or better, argue that "design intention" creates a *local normative framework* that is structurally analogous to selection but metaphysically distinct. However, if your goal is to dissolve the SE/CR debate, admitting that *dysfunction* always requires history concedes the main battleground to the SE theorist.
  *   **Alternative:** Consider framing the "badly designed enzyme" not as having a *biological dysfunction*, but as failing an *engineering specification*. Keep the biological normativity strictly tied to selection (or organizational maintenance), and treat the artificial case as a category shift. This preserves the purity of the biological account.

  ### 4. Payoff vs. Apparatus (Pluralism Check)

  **Is this just pluralism?**
  Ontological pluralists say: "There are two distinct properties, Function-SE and Function-CR."
  Your proposal says: "There is one property, Function, which is context-sensitive (like 'tall' or 'ready')."
  This is **Contextualist Monism** vs. **Ontological Pluralism**. This *is* a payoff. It explains why biologists don't feel they are equivocating when they switch between SE and CR language. They aren't switching concepts; they are adjusting parameters (e.g., shifting the Temporal Window from 'current' to 'historical').

  **Is it worth the apparatus?**
  Yes, provided you can show that the parameters are *systematic* and not *ad hoc*. If you just say "biologists choose parameters based on what they want to explain," it looks like pluralism with extra steps. You need to show there are *rules* for parameter selection (e.g., "In evolutionary explanations, default to Historical Window; in physiological explanations, default to Synchronic Window").

  **The Case Most Likely to Break It:**
  The case that will break a parameter-fixing view is **Drift-Fixation**.
  *   *Scenario:* A trait arises by mutation, provides a slight benefit, but is fixed in the population primarily due to drift (or vice versa: neutral trait fixed by drift, later co-opted).
  *   *The Problem:* There is no clear "selection history" (SE struggles) and the "current contribution" might be negligible or neutral (CR struggles).
  *   *The Break:* If a trait is fixed by drift and does nothing useful now, biologists often say "It has no function; it's junk."
      *   Your view says: "Relative to a historical window, it has no function. Relative to a capacity window, it has no contribution."
      *   The Challenge: Why is the verdict "No Function" mandatory here? In your other cases, the verdict depended on the parameter setting. In the Drift/Junk case, the "No Function" verdict seems robust across *all* parameter settings. If your view predicts that one *could* legitimately attribute a function here by tweaking the parameters (e.g., "Its function is to take up space"), but biological practice forbids it, then your view is too permissive.
      *   *Recommendation:* Use the "Junk DNA" or "Spandrel" case to test your constraints on the **Contrast Class**. You need to explain why "taking up space" is excluded from the contrast class of legitimate functions even if it is a causal contribution. (This links back to the "Organizational Closure" suggestion in Q2).

  ### Summary Advice
  1.  **Highlight Case A:** It is your strongest lever for showing that "lineage" is a parameter, not a metaphysical absolute.
  2.  **Tighten the Normativity:** Be careful not to concede that *all* normativity is historical. If you do, you lose the CR half of the synthesis. Consider restricting the "design intention" repair to artifacts only, keeping biological normativity tied to maintenance/selection.
  3.  **Defend Monism:** Explicitly distinguish your "Contextualist Monism" from "Ontological Pluralism." The payoff is explaining the *unity* of biological discourse, not just cataloging its variety.
  4.  **Test against Junk:** Ensure your parameters can explain why we *deny* function to drift-fixed traits, not just why we *assign* function to contentious ones.

  This is a very strong draft concept. The "parameter-fixing" metaphor is intuitive and maps well onto actual modeling practices in biology. Good luck with the paper.
