answer: |-
  **Verdict**

  Your coauthor is right about the OOD confound, and you are conflating *model validity* with *mechanism identity*. You have a logical inconsistency in your operational definition: you define "same mechanism" as allowing parameter re-estimation, but your test flags anomalies based on fixed training parameters. This means you are detecting parameter drift, not necessarily mechanistic breakdown. Your benchmark is circular because it tests for parameter drift while claiming to test for mechanism change. The granularity objection is not just philosophical pedantry; it strikes at whether your functional forms are actually capturing the activities of the mechanism or just approximating them.

  **Reasoning**

  Here is the breakdown of where your reasoning holds and where it breaks down, from the perspective of both causal inference and mechanistic philosophy.

  ### 1. The Residual Statistic and Alpha (The OOD Confound)
  You asked if there's a principled way to pick $\alpha$ to separate mechanism change from unusual operating points. **No.**

  The problem isn't the threshold; it's the statistic. Standardized residuals on fixed training equations conflate two distinct causal scenarios:
  1.  **Structural Break:** The physical relationship between variables has changed (e.g., a valve is stuck, changing the DAG or functional form).
  2.  **Covariate Shift (OOD):** The pump is operating in a regime (pressure/temperature combination) it rarely saw in training, but the physics remains identical.

  If your parametric forms are non-linear (which they must be for pumps), extrapolation error looks exactly like structural break in residual space. If you push the pump to 110% capacity (OOD input), your training equations might predict poorly simply because you haven't constrained the function form outside the training support. High residuals here do not mean the mechanism changed; they mean your *model* of the mechanism is incomplete.

  Picking an $\alpha$ just tunes your false positive rate between these two confounds. To fix this, you need **invariance testing**, not just fit testing. You need to verify that the *same* parameters (or functional forms) hold across different environments/segments, not just that they fit one segment well.

  ### 2. The Transplant Test (Interventionism)
  This is philosophically stronger. It aligns with Woodward's interventionist account of causation: a mechanism is defined by its invariant response to interventions. If you run the training equations as a simulator on held-out inputs (interventions) and it tracks, you have evidence of invariance.

  **However, it has a critical limitation:** You are limited to "every intervention my logging system actually performs."
  *   **The Problem:** Mechanism change often manifests under specific stresses your logging system never triggers. If your logging system only records steady-state operations, but the mechanism breaks down during transient spikes, your transplant test will pass (mechanism "same") while the pump fails.
  *   **The Verdict:** It is better than residuals because it tests predictive capacity under input variation, but it is not a test of *mechanism identity* per se; it is a test of *model robustness over the logged intervention set*. It fails to distinguish between "mechanism is same" and "mechanism is different but indistinguishable given our limited interventions."

  ### 3. The Benchmark (Circularity)
  You are stacking the deck.
  *   **The Flaw:** You define "mechanism change" in your benchmark as "perturbing coefficients." But in your operational definition, you said mechanism is the same if "parameters [can be] re-estimated."
  *   **The Contradiction:** If parameter drift counts as "same mechanism" (because you can re-estimate), then your benchmark is generating "same mechanism" data, not "anomalous" data. If parameter drift counts as "anomalous" (because you test on fixed training params), then your definition of mechanism is too strict (it conflates wear-and-tear with structural break).
  *   **Real Mechanism Change:** In industrial systems, true mechanistic failure often involves **structural changes** (e.g., cavitation introduces a new non-linear term, a leak adds a new edge to the DAG), not just coefficient shifts. By benchmarking only on coefficient perturbation, you are testing whether you can detect parameter drift, not whether you can detect mechanistic breakdown. You will likely overfit to linear shifts and miss structural fractures.

  ### 4. Granularity and Mechanism Identity
  You asked: *"Once I've fixed the variable set and the graph, isn't mechanism identity just a well-defined relation at that point?"*

  **No.** This is the philosophical crux.
  In mechanistic philosophy (e.g., Craver, Machamer), a mechanism is composed of **entities** (your variables) and **activities** (your functional forms).
  *   Fixing the graph fixes the *organization* of entities.
  *   It does **not** fix the *activities*.

  If you model a valve flow as linear ($Q = k \cdot P$) but the physical activity is quadratic ($Q = k \cdot \sqrt{P}$), you have not captured the mechanism, even if the graph is correct. You have captured a *model* that approximates the mechanism within a specific operating range.

  When you say "mechanism identity depends on the phenomenon," it matters because:
  1.  **Explanatory Scope:** Are you explaining "pump flow" or "pump vibration"? Different phenomena rely on different sub-mechanisms (fluid dynamics vs. mechanical imbalance). Your variable set locks you into one phenomenon.
  2.  **Approximation vs. Reality:** Your functional forms are hypotheses about the activities. If the residuals fail, it could be that the *activity* changed (mechanism break) OR that your *hypothesis about the activity* was always an approximation that just stopped working (model break).

  By treating your parametric forms as ground truth for the mechanism, you are reifying the model. You cannot detect "mechanism change" if you don't allow for the possibility that your training equations were never the true mechanism to begin with, just a working approximation.

  **Recommendation:**
  Stop calling it "mechanistic anomaly detection." Call it **"structural invariance testing."**
  1.  **Fix the Definition:** Decide if parameter drift is failure. If yes, test on fixed params. If no, test on refitted params (using a penalty for parameter shift magnitude).
  2.  **Fix the Benchmark:** Synthesize structural breaks (remove edges, change non-linearities), not just coefficient noise.
  3.  **Address OOD:** Use invariant risk minimization (IRM) techniques or test for stability across environments, not just fit on held-out data.
