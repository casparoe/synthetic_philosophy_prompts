prompt: |-
  I sit on a grant panel that funds field work in animal behaviour, and a large share of the proposals we read contain the same move somewhere in the background section: some trait — a patch of colour, a call, a bout of vigilance, an unwieldy structure — is described as a costly signal, and its cost is said to be what makes it honest. The move is load-bearing. It is what licenses treating the trait as an adaptation for communication rather than as a weapon, a byproduct, a cue, or a symptom, and it usually arrives with no more support than the observation that the trait is expensive or risky to have. Expensiveness alone does not separate types: a cost that every individual pays equally, however large, tells a receiver nothing. But we have no shared standard for when the claim has been earned, and I would like one before the next round.

  Please write me the specification I should be applying when a proposer claims that trait T in species S is maintained as a costly signal of quality Q. That is: the requirements a case must meet before the claim is anything more than a just-so story, each with the case or consideration that motivates it, sorted into what is non-negotiable, what is a strong presumption that can be rebutted with argument, and what is merely the taste of one research tradition. The purpose is fixed, so please keep it in view: this is an evidential standard for empirical claims about particular traits, not a general theory of communication, and "adequate" means adequate to license the word *signal* in that case — as against cue, index, armament, or epiphenomenon.

  These are the demands I keep half-formulating and then abandoning, to show you where I am stuck. I would rather you rebuilt the list than annotated mine, but I want your criteria to be answerable to them:

  - Not "the trait is expensive" but "the extra cost of a somewhat larger or more intense trait is smaller for a higher-quality individual" — the graded or single-crossing condition that the strategic models place at the centre. A flat tax on all bearers cannot separate types.
  - Costs counted at the margin of the signalling act, so that a cost the animal would incur anyway — a display given from a perch it would occupy regardless, a migration route that doubles as an advertisement — cannot be charged to the signal.
  - A currency requirement: the cost must be one that Q genuinely makes cheaper to bear, so that the link between quality and cost runs through Q rather than through some third variable that happens to correlate with it.
  - A declaration of which cost mechanism is being posited: production cost, receiver-imposed or social cost, or vulnerability cost such as attraction of predators — since these make different predictions when receivers are experimentally removed.
  - A timing condition: whether the cost must be realised at the point of the receiver's decision, or whether a cost that is merely pledged and falls due later does the same work.
  - A receiver-side requirement: that someone actually reads the trait, that the reading feeds back onto the signaler's fitness, and that the response is not better explained by a preference that predates the trait.
  - An alternative-hypotheses requirement: why the trait is not a weapon or a direct fitness benefit, and why a cheaper equivalent producing the same response has not invaded.
  - A say-which-it-is requirement: is the trait mechanically tied to Q, in which case the machinery of cost is idle and the evidentiary burden shifts to the mechanism, or is it conventional and cost-maintained?

  Test the list on three composite cases from the current round, since a standard that cannot decide cases is not one:

  (1) A lizard in which males develop a carotenoid-based throat patch, drawn from stores that depend on foraging success and parasite load, only in wet years; the display is performed from basking rocks that males occupy irrespective of patch size; patched males receive more attacks from territory holders; females prefer larger patches; and females of a closely related species lacking the patch also prefer blue-baited models.

  (2) A fish with male parental care in which the courtship display itself is cheap, but displaying commits the male to weeks of egg-guarding during which he loses substantial mass and runs elevated predation risk — a cost that falls due only if the female accepts him, and that he could in principle escape by deserting afterwards.

  (3) A bird whose dawn chorus costs every male, in every condition, roughly the same four per cent of body mass per morning.

  Two further things matter more to me than the list itself. First: which of the things people demand in this area are genuine desiderata and which are inherited rhetoric — in particular whether the cost has to be *wasteful*, something that lowers fitness with no compensating return, or whether that is Zahavi's polemical framing rather than a result, and whether full separation is required or reliability on average is enough. Second: whether some subset of the requirements is jointly unsatisfiable, in which case that is itself the finding I want. My suspicions are that a requirement that the signal mean the same thing across habitats and seasons cannot be met jointly with the fact that costs are context-dependent, and that a requirement of unfakeability by construction cannot be met jointly with one of evolutionary flexibility plus affordability for the lowest-quality bearer; tell me if these are right and whether there are better ones.

  Finally, name the single requirement that does the most work in excluding candidate traits, and — in a few lines only, since the criteria are the deliverable and not the scorecard — say how the main families of account in the area fare: Zahavi's original handicap principle, the Grafen-style strategic models, the index or mechanical-constraint approach, and the results showing that honesty can be stable without cost when interests partly coincide.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **User:** A grant panelist funding animal behaviour fieldwork.
      *   **Problem:** Too many proposals claim a trait is a "costly signal" based merely on expensiveness, without rigorous justification. This licenses treating the trait as communication rather than a cue, weapon, or byproduct.
      *   **Task:** Create a specification (evidential standard) for claiming trait $T$ in species $S$ is a costly signal of quality $Q$.
      *   **Structure:**
          *   Categorized requirements (Non-negotiable, Strong Presumption, Taste/Tradition).
          *   Motivation/Case for each.
          *   Test against three composite cases (Lizard, Fish, Bird).
          *   Address two meta-questions: (1) Waste vs. Return & Separation vs. Average Reliability; (2) Unsatisfiable joint requirements (Context-dependence vs. Stability; Unfakeability vs. Flexibility).
          *   Identify the single most exclusionary requirement.
          *   Briefly evaluate main theoretical families (Zahavi, Grafen, Index, Partial Interest Coincidence).
      *   **Tone:** Rigorous, precise, philosophical but practical (grant panel context), avoiding "just-so stories."

  2.  **Deconstruct the User's "Half-Formulated Demands":**
      *   *Marginal Cost/Single-Crossing:* Essential. Flat costs don't separate.
      *   *Marginal Signalling Act:* Essential. Sunk costs don't count.
      *   *Currency Link:* Essential. Cost must link to $Q$, not a confound.
      *   *Cost Mechanism:* Important for prediction (predation vs. metabolic).
      *   *Timing:* Important (pledged vs. upfront).
      *   *Receiver Side:* Essential (no signal without reception/fitness consequence).
      *   *Alternative Hypotheses:* Essential (weapon? cue?).
      *   *Index vs. Signal:* Crucial distinction (mechanical tie vs. strategic cost).

  3.  **Drafting the Specification (Iterative Process):**

      *   *Category 1: Non-Negotiable (The "License to Signal").* If these aren't met, it's not a costly signal.
          *   Need differential marginal cost (Single-Crossing).
          *   Need receiver response affecting fitness.
          *   Need exclusion of mechanical index (unfakeability).
      *   *Category 2: Strong Presumption (Rebuttable).*
          *   Cost mechanism specification.
          *   Timing of cost (upfront vs. deferred).
          *   Alternative hypothesis exclusion (weapon/cue).
      *   *Category 3: Taste/Tradition (Not required for "Signal" status).*
          *   "Waste" (net fitness loss).
          *   Perfect separation vs. statistical reliability.
          *   Cross-context stability.

      *   *Refining the Criteria:*
          *   *Criterion 1 (The Economic Core):* Differential Marginal Cost. (From User's list).
          *   *Criterion 2 (The Communication Core):* Receiver Uptake & Fitness Feedback. (From User's list).
          *   *Criterion 3 (The Exclusion Core):* Not an Index. (From User's list).
          *   *Criterion 4 (The Accounting Core):* Incremental Cost. (From User's list).

  4.  **Testing Against Composite Cases:**

      *   *Case 1 (Lizard):* Carotenoid patch.
          *   Cost: Foraging/parasite dependent (links to Q).
          *   Display: Basking rocks (sunk cost? No, patch production is cost).
          *   Receiver: Females prefer it. *But* related species prefer blue too. Suggests sensory bias (pre-existing preference).
          *   Verdict: Fails "Receiver Side" (pre-existing bias suggests cue/sensory exploitation rather than co-evolved signal) or passes "Index" (physiologically tied to carotenoids). If physiologically tied, it's an Index, not a Costly Signal.
      *   *Case 2 (Fish):* Parental care commitment.
          *   Cost: Deferred (egg guarding).
          *   Signal: Display (cheap).
          *   Mechanism: Pledged cost.
          *   Verdict: Passes if deferred cost counts. This tests the "Timing" presumption.
      *   *Case 3 (Bird):* Dawn chorus.
          *   Cost: Flat 4% for everyone.
          *   Verdict: Fails "Differential Marginal Cost." Cannot be a costly signal of quality. Might be a signal of presence, but not quality.

  5.  **Addressing Meta-Questions:**

      *   *Waste vs. Return:* Zahavi's "waste" is rhetorical. Signals need net benefit to evolve, even if costly. The cost must be *compensated* by the benefit of signaling. "Waste" is not a requirement.
      *   *Separation vs. Reliability:* Perfect separation is rare. Statistical reliability is sufficient for "signal" status.
      *   *Unsatisfiable Joints:*
          *   *Context Stability vs. Context Dependence:* Costs *are* context-dependent. Demanding cross-habitat stability is impossible.
          *   *Unfakeability vs. Flexibility:* If it's unfakeable (Index), it's not a Costly Signal. If it's a Costly Signal, it *can* be faked but isn't due to cost. This is a category error, not a logical contradiction.

  6.  **Identifying the "Single Most Exclusionary Requirement":**
      *   It's the **Differential Marginal Cost (Single-Crossing Condition)**. Most proposals fail here because they cite total cost, not marginal cost relative to quality.

  7.  **Evaluating Theoretical Families:**
      *   *Zahavi:* Heuristic value, but "waste" is misleading.
      *   *Grafen:* Mathematical rigor on marginal cost. Gold standard.
      *   *Index:* Distinct category. Often confused with signal.
      *   *Partial Interest (Maynard Smith/Harper):* Shows cost isn't always needed. Crucial for null hypothesis.

  8.  **Refining the Output (Self-Correction/Polishing):**
      *   *Tone Check:* Ensure it sounds like a specification document for a panel, not a textbook. Use imperative language.
      *   *Clarity:* Ensure the distinction between "Index" and "Signal" is sharp. An index is honest by physics/physiology; a signal is honest by economics (cost).
      *   *Case 1 Nuance:* The lizard case has a sensory bias element. I need to make sure the specification catches that. The pre-existing preference suggests it might be sensory exploitation, not a co-evolved signal.
      *   *Case 2 Nuance:* Deferred cost. Is it a signal? Yes, if the *commitment* is the signal. But the proposal must show the cost is *contingent* on the signal.
      *   *Case 3 Nuance:* Flat cost. Definitely fails.

      *   *Re-evaluating the "Unsatisfiable" point:* The user suspects "Context Stability" vs "Context Dependence." I need to confirm this is a false demand. Also "Unfakeability" vs "Flexibility." If it's unfakeable, it's an index. So demanding a trait be *both* a costly signal *and* unfakeable is the contradiction.

      *   *Final Polish:* Ensure the "Non-negotiable" vs "Presumption" vs "Taste" structure is clear.

  9.  **Final Review against constraints:**
      *   Rebuild the list (don't just annotate).
      *   Sort into categories.
      *   Test on 3 cases.
      *   Address meta-questions (Waste, Separation, Unsatisfiable joints).
      *   Name single exclusionary requirement.
      *   Evaluate theoretical families briefly.

      *(Self-Correction during drafting)*: Make sure to emphasize that "Costly Signal" is a specific technical term, not a synonym for "honest trait." An index is honest but not a costly signal. A cue is honest but not a signal. The specification must police these boundaries.

      *(Refining the "Waste" point)*: Zahavi's "handicap" implies waste. But evolutionary stability requires net benefit. The cost is a *barrier*, not a *goal*. I need to be clear that "net fitness loss" is wrong.

      *(Refining the "Single-Crossing" point)*: This is the technical term. I should use it but explain it simply as "differential marginal cost."

      *(Refining the "Receiver" point)*: A signal requires a receiver. If no one reads it, it's not a signal. If they read it but it doesn't affect fitness, it's not an evolutionary signal.

      *(Refining the "Index" point)*: If the trait *cannot* be faked physically (e.g., roar frequency tied to size), cost is irrelevant. It's an index. Proposers often call indices "costly signals." This needs to be stopped.

      *Let's write.*
answer: |-
  # Specification for Empirical Claims of Costly Signalling

  **Purpose:** To license the classification of a trait $T$ in species $S$ as a *costly signal* of quality $Q$. This classification distinguishes the trait from cues, indices, weapons, or byproducts. Failure to meet Non-Negotiable criteria reclassifies the trait; failure to meet Strong Presumptions requires explicit theoretical justification.

  ## I. Non-Negotiable Requirements
  *If these are not met, the term "costly signal" is empirically invalid.*

  **1. The Differential Marginal Cost Condition (Single-Crossing)**
  *   **Requirement:** The proposer must demonstrate that the *marginal* cost of increasing trait intensity $T$ is lower for individuals with higher quality $Q$.
  *   **Motivation:** A flat cost (e.g., "this tail costs 10% energy for everyone") cannot maintain honesty; low-quality individuals would simply pay it. Only if the cost function crosses (is steeper for low $Q$ than high $Q$) does the equilibrium separate types.
  *   **Evidence Needed:** Physiological or ecological data showing that the *extra* investment required for a larger/brighter/longer $T$ depletes a resource or incurs a risk that high-$Q$ individuals can absorb more easily than low-$Q$ individuals.

  **2. The Receiver Uptake and Feedback Loop**
  *   **Requirement:** Evidence that conspecifics perceive $T$, alter behaviour based on $T$, and that this behavioural alteration feeds back to the signaler's fitness.
  *   **Motivation:** Without a receiver, $T$ is a symptom or byproduct. Without fitness feedback, the cost cannot be evolutionarily maintained as a signal.
  *   **Evidence Needed:** Playback/model experiments showing response differentiation, coupled with fitness correlates (mating success, territory retention) linked to that response.

  **3. The Exclusion of Mechanical Indexing**
  *   **Requirement:** The proposer must show that $T$ is *physiologically or physically fakeable* in principle, but restrained by cost.
  *   **Motivation:** If $T$ is mechanically tied to $Q$ (e.g., vocal frequency determined by larynx size), it is an *index*. Indices are honest by construction, not by cost. Calling an index a "costly signal" misidentifies the maintenance mechanism.
  *   **Evidence Needed:** Demonstration that low-$Q$ individuals *could* produce high-$T$ phenotypes (e.g., via hormone manipulation or diet) but suffer fitness penalties if they do, or that the trait varies independently of the underlying machinery within an individual's lifetime.

  ## II. Strong Presumptions
  *These are required unless the proposer offers a rigorous theoretical argument for why they do not apply.*

  **4. Incremental Accounting (No Sunk Costs)**
  *   **Requirement:** Costs must be attributed to the signalling act or trait maintenance, not to activities the animal would undertake regardless.
  *   **Motivation:** If a male displays from a rock he would occupy anyway, the perch is not part of the signal cost. Charging sunk costs inflates the apparent handicap.
  *   **Rebuttal:** Acceptable if the proposer shows the *risk* of occupying the perch increases specifically *because* of the display (e.g., increased visibility to predators during the act).

  **5. Cost Mechanism Specification**
  *   **Requirement:** The proposal must specify whether the cost is metabolic (production), social (retaliation), or ecological (predation).
  *   **Motivation:** Different mechanisms yield different predictions. Social costs vanish if receivers are removed; predation costs do not.
  *   **Rebuttal:** Acceptable to posit mixed costs, but the dominant stabilizing factor must be identified.

  **6. Timing of Cost Realization**
  *   **Requirement:** The proposal must state whether the cost is upfront (production) or deferred (commitment).
  *   **Motivation:** Deferred costs (e.g., parental care commitment) allow for cheating (desertion) unless policed. Upfront costs are more robust signals.
  *   **Rebuttal:** Deferred costs are acceptable if the proposal accounts for the enforcement mechanism (e.g., inability to desert without losing the benefit).

  ## III. Taste / Research Tradition
  *These are not required to license the word "signal". Demanding them often leads to false negatives.*

  **7. Net Fitness "Waste"**
  *   **Status:** Tradition (Zahavian rhetoric).
  *   **Clarification:** Signals need not lower net fitness. They must be costly *relative to not signaling*, but the benefit of signaling must exceed the cost for the high-quality sender. "Waste" is not a requirement for honesty.

  **8. Perfect Separation of Types**
  *   **Status:** Tradition (Idealized modeling).
  *   **Clarification:** Statistical reliability is sufficient. Signals can be "noisy" and still function. Demanding perfect separation excludes most biological reality.

  **9. Cross-Context Stability**
  *   **Status:** Tradition (Desire for universality).
  *   **Clarification:** Costs are inherently context-dependent (e.g., predation risk varies by habitat). A signal in one habitat may be a cue in another. Demanding stability across habitats is unsatisfiable.

  ---

  ## IV. Testing the Specification on Composite Cases

  **Case 1: The Lizard (Carotenoid Patch)**
  *   **Verdict:** **Fail (Likely Index or Sensory Exploitation).**
  *   **Analysis:**
      *   *Marginal Cost:* Passes. Patch depends on foraging/parasites (links to $Q$).
      *   *Receiver:* **Fail.** Females of related species prefer the trait without co-evolutionary history. This suggests pre-existing sensory bias (sensory exploitation) rather than a co-evolved signal maintaining honesty via cost.
      *   *Index:* **Fail/Pass.** If the patch is physiologically constrained by carotenoid availability (cannot be faked even with cost), it is an **Index**, not a costly signal. The proposal must distinguish physiological constraint from economic constraint.
  *   **Ruling:** Reject "costly signal" claim. Reclassify as Index or Sensory Cue unless manipulation shows low-$Q$ males can produce patches but suffer specific retaliation.

  **Case 2: The Fish (Deferred Parental Commitment)**
  *   **Verdict:** **Pass (with Presumption 6 addressed).**
  *   **Analysis:**
      *   *Marginal Cost:* Passes. High-$Q$ males can sustain mass loss/predation risk better.
      *   *Timing:* Deferred cost. This is a "pledge."
      *   *Risk:* Cheating via desertion.
      *   *Requirement:* The proposal must explain why desertion is not a viable strategy (e.g., females monitor, or desertion kills eggs and ruins future reputation).
  *   **Ruling:** Acceptable as a costly signal of commitment, provided the enforcement of the deferred cost is detailed.

  **Case 3: The Bird (Dawn Chorus)**
  *   **Verdict:** **Fail.**
  *   **Analysis:**
      *   *Marginal Cost:* **Fail.** The prompt states the cost is "roughly the same four per cent... in every condition."
      *   *Logic:* A flat tax does not separate types. If low-$Q$ males pay the same 4% as high-$Q$ males, the signal does not reveal $Q$. It may signal *presence*, but not *quality*.
  *   **Ruling:** Reject "signal of quality" claim. May be a signal of presence or a byproduct of circadian metabolism.

  ---

  ## V. Meta-Analysis of Desiderata and Constraints

  ### 1. Waste vs. Return
  The demand that a signal be "wasteful" (net fitness loss) is **inherited rhetoric**, not a biological necessity. Zahavi's framing was polemical to counter "group selection" arguments. For a trait to evolve, the *benefit* of signaling (mating success, territory) must exceed the *cost*. The cost is a barrier to entry, not a goal. **Desideratum:** The cost must be *compensated* for high-$Q$ individuals, not merely wasteful.

  ### 2. Separation vs. Reliability
  The demand for full separation (perfect honesty) is **inherited rhetoric** from early game theory. Biological signals are noisy. **Desideratum:** Statistical reliability is sufficient. A trait is a signal if it shifts the receiver's probability estimate of $Q$, not if it certifies it with certainty.

  ### 3. Unsatisfiable Joint Requirements
  Your suspicions are correct. Two pairs of demands are jointly unsatisfiable:

  *   **Context Stability + Context-Dependent Costs:** You cannot demand a signal mean the same thing across all habitats while acknowledging costs (predation, resource scarcity) vary by habitat. A trait may be a costly signal in high-predation zones and a cheap cue in low-predation zones. **Finding:** Drop the requirement for cross-context stability.
  *   **Unfakeability + Evolutionary Flexibility:** You cannot demand a trait be physically unfakeable (an Index) AND maintained by strategic cost (a Signal). If it is unfakeable by construction, cost is irrelevant. If it is maintained by cost, it must be fakeable in principle. **Finding:** Proposers must choose: is it an Index (mechanical) or a Signal (economic)? They are mutually exclusive categories.

  ---

  ## VI. The Single Most Exclusionary Requirement

  **The Differential Marginal Cost Condition (Single-Crossing).**

  This is the primary filter. Most proposals fail here because they cite *total* cost ("this tail is heavy") rather than *marginal* cost relative to quality ("this tail is heavier for weak males than strong males"). Without this condition, the trait cannot theoretically maintain honesty in an evolutionary equilibrium. It is the specific mathematical engine that separates signalling theory from general adaptationism.

  ## VII. Performance of Theoretical Families

  *   **Zahavi's Handicap Principle:** Heuristically vital for establishing the "cost implies honesty" intuition, but often misapplied as a demand for net fitness loss. It lacks the mathematical precision to distinguish marginal from total cost.
  *   **Grafen-style Strategic Models:** The gold standard for this specification. They formalize the Single-Crossing Condition. Proposals aligning with this framework are theoretically robust but often difficult to parameterize in the field.
  *   **Index / Mechanical-Constraint:** Often confused with signalling. This specification forces a choice: if the trait is an index, cost arguments are irrelevant. This clarifies the literature significantly.
  *   **Partial Interest Coincidence (e.g., Maynard Smith, Harper):** Crucial for the null hypothesis. Shows that honesty can exist *without* cost if sender and receiver interests align. Proposers must rule this out before invoking costly signalling.
