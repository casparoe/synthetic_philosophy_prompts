          2.  **Certainty vs. Risk:** Address the fact that Oregon chose under certainty/budget constraint, not lotteries. What do vNM assumptions do here? How much constraint remains?
          3.  **Mechanics:** Compare maximizing weighted sum (utilitarian) vs. greedy cost-per-QALY ranking (league table). Is the league table a bad approximation? Whose fault is it (theorem vs. implementation)?
          4.  **Weights & ADA:** Analyze the ADA objection (disability discrimination). Is it about weights, utility scales, or something outside the theorem? Does the veil of ignorance apply ex post?
          5.  **Evaluation:** Does this make the theorem look useful or decorative? Does CEA commit one to utilitarianism? Or are the hard choices pre-theorem?
