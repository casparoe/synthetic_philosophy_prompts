answer: |-
  This is a sharp set of questions. You are right to suspect that the formal power of Harsanyi's theorem often exceeds its institutional footprint, and the Oregon case is an excellent stress test because it attempts to operationalize welfare economics in a way that collides with deontological constraints (the ADA).

  Here is the disciplined mapping you requested, running the theorem against the case and then evaluating the theorem's utility based on the friction points.

  ### 1. Mapping the Theorem to the Case

  To apply Harsanyi's Aggregation Theorem, we must map the Oregon reform onto the theorem's variables.

  *   **The Individuals ($i$):** In the theorem, these are the voters or citizens whose preferences are being aggregated. In Oregon, the relevant individuals are the potential Medicaid recipients. However, there is a boundary problem: the reform expanded eligibility. So, is the population the *currently* eligible, the *newly* eligible, or the *taxpaying public* whose money is being spent? Harsanyi assumes a fixed population. Oregon was effectively changing the $N$ in the sum $\sum_{i=1}^N$. This is already a strain on the theorem, which typically takes the population as given.
  *   **The Social Alternatives ($X$):** The theorem compares social states (or lotteries over them). Oregon was not choosing between "State A" and "State B." It was choosing a **benefit package** subject to a **budget constraint**. Formally, the alternative is a vector of treatments $(t_1, t_2, ... t_k)$ where each $t$ is binary (funded/not funded), such that $\sum Cost(t_i) \leq Budget$.
  *   **Individual Utility Functions ($U_i$):** The theorem requires vNM utility functions. Oregon used QALYs (Quality-Adjusted Life Years). QALYs are designed to be vNM utilities derived from standard gambles over health states. So, formally, $U_i(x)$ is the health utility individual $i$ derives from treatment package $x$.
  *   **The Social Welfare Function ($W$):** The theorem concludes $W = \sum a_i U_i$. Oregon's explicit goal was to maximize total health benefit (total QALYs) for the population within the budget. This implies $a_i = 1$ for all eligible recipients.

  **Is it of the right form?** Roughly, yes. Oregon attempted to maximize a sum of individual utilities subject to a constraint. But as you suspect, the fit is loose on the "lottery" requirement and the "fixed population" requirement.

  ### 2. Certainty vs. Risk: What the vNM Assumptions Are Doing

  You are correct to press on the certainty issue. This is the most significant formal gap.

  Harsanyi's theorem relies on the **Independence Axiom** applied to *lotteries* to force the social welfare function to be linear (a weighted sum). The logic is: if you are indifferent between lottery $L_1$ and $L_2$, mixing both with a third lottery $L_3$ shouldn't change your preference. This specific structure rules out concave or convex transformations of utility (like prioritarianism, which weights gains to the worse-off more heavily).

  **The Problem:** Oregon was choosing under **certainty** (deterministic outcomes) subject to a budget. They were not choosing between "a 50% chance everyone gets treated" vs. "a 100% chance half get treated."
  *   **Consequence:** If you only observe choices over sure outcomes, the Independence Axiom does no work. Many different social welfare functions (Utilitarian, Prioritarian, Sufficientarian) can rank deterministic states identically. For example, maximizing $\sum U_i$ and maximizing $\sum \sqrt{U_i}$ might yield the same ranking over a specific set of deterministic budget allocations, even though they imply different attitudes toward risk.
  *   **What survives?** Very little of the theorem's *derivation* survives. By treating QALYs as additive without testing social risk preferences, Oregon didn't *derive* utilitarianism from rationality constraints; they **assumed** social risk neutrality. They assumed that a gain of 1 QALY for a severely disabled person is socially equivalent to a gain of 1 QALY for a mildly ill person, simply because they summed them.
  *   **Verdict:** Your suspicion is correct. Under certainty, the theorem constrains less than it looks. The linearity of the social welfare function is an ethical assumption smuggled into the measurement scale (QALYs), not a logical consequence of rational choice over the options Oregon actually faced.

  ### 3. Mechanics: The League Table vs. The Sum

  You asked whether the "league table" (sorting by cost-per-QALY ratio) implements the social welfare function or approximates it badly.

  *   **The Theorem's Demand:** Maximize $W = \sum U_i$ subject to $\sum C_i \leq B$.
  *   **Oregon's Method:** Sort treatments by ratio $C_i / U_i$ (lowest to highest) and fund down the list until the budget runs out.
  *   **The Discrepancy:** This is a **greedy algorithm**. It works perfectly if treatments are divisible and independent. They are not. Treatments are "lumpy" (integer constraints) and interact (complementarities).
      *   *Example:* Treatment A costs \$100, yields 10 QALYs (Ratio 10). Treatment B costs \$101, yields 10.1 QALYs (Ratio 10). Budget is \$100. The league table says "Fund B first." But you can't afford B. You must fund A. The greedy algorithm fails the knapsack problem.
      *   *The "Embarrassing" Orderings:* The famous result where tooth-capping ranked higher than appendectomy happened because the ratio metric ignored the **magnitude** of the loss prevented. An appendectomy prevents a huge utility loss (death) for a few people; tooth-capping prevents a small utility loss for many. If the "many" are cheap enough, they win the ratio game.
  *   **Whose Fault?** This is **Oregon's implementation failure**, not the theorem's. The theorem says "Maximize the sum." It does not say "Sort by ratio." A true utilitarian planner would solve the integer programming problem to find the combination of treatments that yields the highest total QALYs within the budget.
  *   **Institutional Bite:** The theorem actually *criticizes* the league table method. If the goal is truly utilitarian aggregation, the league table is a heuristic that sacrifices total welfare for administrative simplicity. However, in practice, the league table was treated *as* the policy, meaning the institution adopted a sub-optimal approximation of the very utilitarianism it claimed to follow.

  ### 4. Weights, QALYs, and the ADA Objection

  This is where the case breaks the theorem's frame. The ADA objection was that the plan discriminated against the disabled by valuing their lives less.

  *   **The Weights ($a_i$):** Harsanyi's Aggregation Theorem allows for unequal weights ($W = \sum a_i U_i$). It does not prove $a_i = 1$. However, Oregon implicitly used $a_i = 1$ (every QALY counts equally).
  *   **The Utility Scale ($U_i$):** The discrimination arose not primarily from the weights $a_i$, but from the **production of utility**. QALYs measure health *capacity*. If a disabled person has a lower ceiling for health improvement (e.g., they cannot return to "full health" even with treatment), their $\Delta U_i$ is lower than a non-disabled person's for the same medical intervention.
      *   *The ADA Claim:* The ADA argues that the *value of the life* should not depend on the *capacity for health*.
      *   *Theorem's Vocabulary:* The theorem has no vocabulary for this. In Harsanyi's framework, if the disabled person derives less utility from the treatment, and weights are equal, they get lower priority. That is a feature, not a bug, of the utilitarian SWF.
  *   **Veil of Ignorance (Ex Ante vs. Ex Post):** Harsanyi justifies equal weights ($a_i = 1$) using a Veil of Ignorance argument: behind the veil, you have an equal probability of being anyone, so you maximize average utility.
      *   *Does it apply?* No. Oregon's decision was **ex post**. The "disabled" were an identifiable class, not a risk behind a veil. The Veil argument justifies weights for *constitutional* choices (rules for a society you might be born into), not *administrative* choices (allocating resources to known groups).
      *   *The Conflict:* Applying ex ante weights (derived from a hypothetical veil) to an ex post population (where disadvantages are known and protected by law) creates the discrimination. The theorem is silent on why we shouldn't adjust weights ex post to correct for historical disadvantage. It treats all utility gains as commensurable, whereas the ADA treats the *status* of the disabled as a constraint on commensurability.

  ### 5. Evaluation: Guide or Decoration?

  Does this case make the theorem look useful or decorative?

  **Argument for "Decorative":**
  The hard ethical work was done before the theorem was invoked.
  1.  **Population:** Deciding *who* is in the sum (the poor vs. everyone) is a political choice the theorem doesn't touch.
  2.  **Metric:** Deciding that QALYs are the relevant utility (ignoring autonomy, dignity, etc.) is a measurement choice.
  3.  **Budget:** The budget constraint is exogenous.
  Once those three are fixed, the theorem just says "add them up." It offers no guidance on the contentious parts (the ADA objection, the eligibility expansion). In this light, the theorem is just a formal stamp on a decision that was already made ethically.

  **Argument for "Useful" (The Spotlight View):**
  The theorem is useful because it **makes the ethical cost explicit**.
  Without the theorem, Oregon could claim they were just being "efficient." The theorem clarifies that "efficiency" in this context *means* "utilitarianism." It forces the institution to admit: "Yes, we are prioritizing total health output over the claims of the worst-off."
  When the ADA objected, they were effectively saying, "We reject the Social Welfare Function you are using." The theorem helps us see that this isn't a dispute about math or data; it is a dispute about the form of the Social Welfare Function. It prevents Oregon from hiding behind "neutral science."

  **Verdict:** It is a **spotlight, not a guide.** It doesn't tell you what to do, but it prevents you from lying about what you are doing. It shows that Cost-Effectiveness Analysis (CEA) is not ethically neutral; it is operationalized utilitarianism. If you want to avoid the ADA objection, you cannot tweak the CEA; you must abandon the utilitarian SWF that CEA instantiates.

  ### 6. Comparison: Rawls and Sufficientarianism

  If Oregon had used a different ranking principle, would they have avoided the objection?

  *   **Rawlsian (Maximin):** Prioritize the treatment that benefits the worst-off individual first.
      *   *Outcome:* Treatments for the severely disabled would likely rank higher, even if cost-per-QALY is high, because they are the "worst off."
      *   *Avoids Objection?* Yes. It aligns with the ADA's focus on protecting the vulnerable.
      *   *Theorem Representation:* **No.** Harsanyi's theorem *excludes* Rawlsianism. To be Rawlsian, you must violate the Independence Axiom (you care about the *distribution* of utility, not just the expectation). The aggregation framework cannot represent this without dropping its core axioms.
  *   **Sufficientarian:** Ensure everyone reaches a "decent minimum" of health before maximizing further gains.
      *   *Outcome:* Fund life-saving treatments (appendectomies) for everyone before funding marginal improvements (tooth caps).
      *   *Avoids Objection?* Yes, largely. It respects the "status" of having a life worth living.
      *   *Theorem Representation:* **No.** Like Rawls, this requires a non-linear transformation of utility (e.g., weighting gains below the threshold infinitely higher).
  *   **Eligibility vs. Depth Tradeoff:** If they treated eligibility breadth and benefit depth as a single tradeoff within a fixed population (e.g., "Everyone gets 50% of care" vs. "Half get 100%"), they might have avoided the "rationing" optics.
      *   *Theorem Representation:* **Yes.** This is just a different definition of the social alternatives $X$. The theorem can handle this. But it doesn't solve the ADA problem if the 50% of care is still allocated by QALY ratio.

  **Conclusion on Silence:**
  Where the theorem is silent, it is loud. It is silent on **rights** (ADA constraints), **historical disadvantage** (ex post weighting), and **non-utilitarian distributions** (Rawls). This silence is not a bug; it is the definition of the framework. The Oregon case shows that when you try to force institutional design into a framework that is silent on rights and distribution, you get policy that violates rights and ignores distribution.

  The theorem tells you: "If you want to satisfy Pareto and vNM rationality, you must be a weighted utilitarian." Oregon said "Okay." The ADA said "No." The theorem cannot resolve that clash; it only clarifies that they are incompatible.
