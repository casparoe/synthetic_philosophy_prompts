      *   **User:** Novelist facing conflict in a writing group over a character's moral action (kidney donation).
      *   **Conflict:** Group members disagree on the moral status of the act (supererogatory vs. obligatory vs. latitude, etc.). They use different jargon (supererogatory, Peter Singer, Kantian latitude, imperfect duties).
      *   **Goal:** A decision tree to sort participants by their *actual judgments on cases*, not their preferred labels.
      *   **Structure:** Start from shared intuition (act is good), branch on diagnostic questions where positions diverge. Build from logical space first, map named positions to leaves later.
      *   **Required Leaves:**
          1.  Classic Supererogation (Optional, Good, Praiseworthy to do, Blameless to omit).
          2.  Singer-ish Denial (Collapses into duty if good > harm).
          3.  Kantian Latitude (Wide duty, discretion within duty).
          4.  Threshold Views (Cost limits obligation).
          5.  The Splitter (Kidney vs. Grenade are different phenomena).
          6.  Moral Illusion/Excuse View (Duties, Permissions, Excuses only).
      *   **Constraints:**
          *   Test branches on three specific cases: Kidney (book), Grenade (backstory), Panhandler (dialysis conflict).
          *   Plain English node questions (no jargon).
          *   Flag contested assumptions at nodes.
          *   Flag indistinguishable leaves if the cases can't separate them.

  2.  **Deconstruct the Ethical Landscape (Logical Space):**
      *   *Core Question:* Is the act required?
      *   *If No:* Is it blameworthy to skip it?
      *   *If Yes:* Is there a limit to how much can be required?
      *   *Praiseworthiness:* Does it require going beyond duty, or just doing duty hard?
      *   *Uniformity:* Do all "sacrifice" cases work the same way?

  3.  **Drafting the Nodes (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Is it wrong to say no? (Yes -> Duty. No -> Supererogatory?)
          2.  If it's not wrong, is it still bad?
          3.  Does cost matter?
          4.  Are all sacrifices the same?

      *   *Critique 1:* Too simple. Doesn't capture the "Kantian Latitude" vs. "Classic Supererogation" distinction well. Both say "not strictly required," but one says "it's still part of duty broadly" and the other says "it's outside duty."
      *   *Refinement:* Need to distinguish between "No duty exists" and "Duty exists but is flexible."
      *   *Refinement 2:* Need to handle the "Moral Illusion" view (Duty/Permission/Excuse). This view says there's no "good beyond duty," just "duty" and "excused failure."

      *   *Attempt 2 (Focusing on the Cases):*
          *   Case A: Kidney (High cost, high benefit, specific stranger).
          *   Case B: Grenade (Ultimate cost, saves others).
          *   Case C: Panhandler (Low cost, recurring, conflict with other duty).

      *   *Drafting Node 1:* **The Blame Test.** If she said no to the kidney, would she be *morally wrong* (blameworthy), or just *not a hero*?
          *   *Branch Yes (Wrong):* Leads to Singer/Duty.
          *   *Branch No (Not Wrong):* Leads to Supererogation/Latitude/Excuse.

      *   *Drafting Node 2 (For the "Not Wrong" group):* **The Praise Source.** If she *does* it, why is she praiseworthy? Is it because she did something *optional* that was good, or because she fulfilled a duty that allows choice?
          *   *Problem:* This is too abstract. Needs to be case-based.
          *   *Alternative:* **The Consistency Test.** Is the Kidney case the *same kind* of moral choice as the Grenade case?
          *   *Branch Same:* Standard theories.
          *   *Branch Different:* The Splitter.

      *   *Drafting Node 3 (For the "Duty" group):* **The Cost Limit.** Is there *any* amount of cost/safety risk that turns a duty into an option? (e.g., 5% death risk).
          *   *Branch Yes:* Threshold Deontology / Moderate Duty.
          *   *Branch No:* Strict Utilitarianism (Singer).

      *   *Drafting Node 4 (For the "Not Wrong" group):* **The Excuse vs. Permission.** If she says no, is she *permitted* (it's okay), or is she *violating a rule but excused* (it's not okay, but we understand)?
          *   *Branch Permitted:* Classic Supererogation / Latitude.
          *   *Branch Excused:* Moral Illusion/Excuse View.

      *   *Drafting Node 5 (Distinguishing Supererogation vs. Latitude):* This is the tricky one.
          *   *Classic Supererogation:* Outside the sphere of duty.
          *   *Kantian Latitude:* Inside the sphere of duty (imperfect duty), but you choose how/when.
          *   *Test:* If she *never* donates anything ever, is that a moral failure?
          *   *Yes:* Latitude (You have a duty to help, just choose how).
          *   *No:* Supererogation (You have no duty to help this way).

  4.  **Refining the Tree Structure for the User:**
      *   Must be hand-out ready.
