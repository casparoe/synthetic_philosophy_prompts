answer: |-
  # The "Kidney & Call" Decision Tree
  **For the Writing Group Session**

  **Starting Point:** We all agree the character's donation was a **Good Thing**.
  **Goal:** Sort out *why* it was good, and what it means that she didn't *have* to do it.
  **Instructions:** Answer the questions below based on your gut reaction to the three test cases. Don't worry about philosophical labels yet.

  ---

  ## NODE 1: The Violation Test
  **Look at the Kidney Case.** If the character had decided *not* to donate, kept her kidney, and lived her life normally:
  **Did she break a moral rule? (Is she technically "in the wrong," even if we like her?)**

  *   **YES, she broke a rule.** (She failed to do what morality demands.)
      *   → Go to **Branch A (The Duty Camp)**.
  *   **NO, she broke no rule.** (She was morally free to keep it.)
      *   → Go to **Branch B (The Permission Camp)**.
  *   **IT DEPENDS ON THE CASE.** (Kidney is different from Grenade.)
      *   → Go to **Leaf 5 (The Splitter)**.

  ---

  ## BRANCH A: The Duty Camp
  *(You believe she was required to donate, or would be in a similar case.)*

  ### NODE 2: The Cost Ceiling
  **Look at the Grenade Case.** (A soldier jumping on a grenade to save squadmates involves a 100% death risk).
  **Does the extreme cost (death) cancel the moral requirement, or does it just make us forgive her for not doing it?**

  *   **It Cancels the Requirement.** (At some point, the duty stops existing.)
      *   → Go to **Leaf 1 (Threshold Duty)**.
  *   **It Doesn't Cancel, It Excuses.** (The duty is still there, but we don't blame her for failing because it was too hard.)
      *   → Go to **Leaf 2 (Moral Illusion / Excuse View)**.
  *   **Nothing Cancels It.** (Even with high risk, if the good outweighs the harm, it's still required. Death is just a high cost.)
      *   → Go to **Leaf 3 (Strict Duty / Singer View)**.

  ### NODE 3: The Panhandler Check
  **Look at the Panhandler Case.** (She walks past a homeless person to get to her own dialysis appointment).
  **According to your view above, was walking past wrong?**

  *   *(Use this to test your Leaf assignment. See "Case Stress Tests" below.)*

  ---

  ## BRANCH B: The Permission Camp
  *(You believe she was morally free to keep her kidney.)*

  ### NODE 4: The "Never Help" Test
  **Imagine a version of this character who *never* helps strangers. No kidney, no charity, no volunteering. But she also never hurts anyone, steals, or lies.**
  **Is she morally deficient? (Did she fail a duty of "beneficence" even if she didn't fail a specific act?)**

  *   **YES, she is deficient.** (We have a general duty to help, but we get to choose *when* and *how*.)
      *   → Go to **Leaf 4 (Kantian Latitude)**.
  *   **NO, she is perfectly fine.** (Helping is nice, but there is no duty to help at all.)
      *   → Go to **Leaf 6 (Classic Supererogation)**.

  ---

  ## THE LEAVES: Definitions & Case Stress Tests
  *Locate your position below. Check if your view holds up across all three book scenarios.*

  ### Leaf 1: Threshold Duty
  **View:** Morality demands sacrifice, but only up to a point. Once the cost gets too high (danger, financial ruin), the duty disappears.
  *   **Kidney:** Duty exists (cost is manageable). Declining is wrong.
  *   **Grenade:** Duty vanishes (cost is life). Declining is permissible.
  *   **Panhandler:** **CRITICAL TEST.** If dialysis is a "high cost" compared to giving cash, walking past is **Permissible**. If dialysis is routine and the panhandler is starving, walking past might be **Wrong**.
  *   **Note:** Distinguishes from *Strict Duty* by admitting a cost limit.

  ### Leaf 2: Moral Illusion / Excuse View
  **View:** There are only Duties and Permissions. "Supererogation" is just a Duty that we excuse people for skipping because humans are weak. The rule is broken, but blame is withheld.
  *   **Kidney:** Declining is **Wrong (but Excused)**.
  *   **Grenade:** Declining is **Wrong (but Excused)**.
  *   **Panhandler:** Declining is **Wrong (but Excused)**.
  *   **⚠️ BLUNTNESS FLAG:** In practice, this looks identical to *Threshold Duty* (Leaf 1). The difference is metaphysical (did the rule vanish vs. did we forgive the break?) rather than practical. If your group can't agree on whether "excused wrong" feels different from "permissible right," this leaf merges with Leaf 1.

  ### Leaf 3: Strict Duty (The Singer View)
  **View:** If an act produces more good than harm, it is required. "Beyond the call of duty" is a comforting myth.
  *   **Kidney:** Declining is **Wrong**.
  *   **Grenade:** Declining is **Wrong** (assuming the lives saved outweigh the one lost).
  *   **Panhandler:** **CRITICAL TEST.** Walking past is **Wrong** unless the dialysis appointment saves more utility than the cash would. Comfort/convenience is not a valid excuse.
  *   **Note:** This is the hardest view to hold consistently without demanding sainthood.

  ### Leaf 4: Kantian Latitude (Wide Duty)
  **View:** We have a general duty to help others, but morality gives us "latitude" to choose the time, place, and manner. You can't never help, but you don't have to help *here*.
  *   **Kidney:** Declining is **Permissible** (provided she helps elsewhere).
  *   **Grenade:** Declining is **Permissible** (soldiering has its own duties).
  *   **Panhandler:** Walking past is **Permissible** (she is prioritizing her health to remain a moral agent).
  *   **Note:** Distinguishes from *Classic Supererogation* by insisting a life of *zero* charity is immoral.

  ### Leaf 5: The Splitter
  **View:** The Kidney and the Grenade are not the same moral phenomenon. One is about charity/health, the other is about role-obligation/survival. Using one label for both is a mistake.
  *   **Kidney:** Likely **Supererogatory** (Optional).
  *   **Grenade:** Likely **Duty** (Required by role/situation).
  *   **Panhandler:** Likely **Optional** (Charity).
  *   **Note:** This view rejects the tree's attempt to unify the cases. It argues the "logical space" is different for medical donation vs. emergency sacrifice.

  ### Leaf 6: Classic Supererogation
  **View:** There is a fourth category. Acts that are good to do, but blameless to omit. No duty exists, not even a general one.
  *   **Kidney:** Declining is **Blameless**. Doing it is **Praiseworthy**.
  *   **Grenade:** Declining is **Blameless**. (May differ from Splitter).
  *   **Panhandler:** Walking past is **Blameless**.
  *   **Note:** Distinguishes from *Kantian Latitude* because a life of zero charity is morally neutral here, whereas in Latitude it is deficient.

  ---

  ## Facilitator Notes: Where the Tree Might Stick

  **1. The "Excuse" vs. "Threshold" Problem (Leaf 1 vs. Leaf 2)**
  *   **The Issue:** If someone says, "She broke a rule, but we excuse her because it was too hard," and another says, "The rule disappears when it's too hard," they will give the **same answers** to every case.
  *   **The Fix:** Ask them: "If she declined the kidney, should she feel *guilt*?"
      *   *Threshold:* No guilt (no rule broken).
      *   *Excuse:* Regret is appropriate (rule broken, but forgiven).
      *   *If they agree on guilt:* These leaves are functionally identical for your novel.

  **2. The Praiseworthiness Trap (Node 4)**
  *   **The Issue:** Some people think you can only be "praiseworthy" if you go beyond duty. Others think you can be praiseworthy for doing your duty hard.
  *   **The Fix:** This tree sorts that out via Leaf 4 vs. Leaf 6.
      *   *Leaf 4 (Latitude):* She is praiseworthy for fulfilling a wide duty well.
      *   *Leaf 6 (Supererogation):* She is praiseworthy for stepping outside duty entirely.
      *   *For the Novel:* Does the daughter's anger make more sense if the mom *owed* it to the family (Duty) or if the mom *gave* it away freely (Supererogation)? The tree helps you pick the tension.

  **3. The Panhandler Consistency Check**
  *   **The Issue:** Many people claim the "Singer View" (Leaf 3) for the Kidney but revert to "Supererogation" (Leaf 6) for the Panhandler.
  *   **The Fix:** Force the consistency. If the Kidney is Duty because "Need > Cost," then the Panhandler is Duty unless "Dialysis > Cash." If they wobble here, they are likely *Threshold* (Leaf 1) or *Latitude* (Leaf 4) thinkers, not Strict Duty.

  ---

  ## How to Use This for the Book
  *   **If the group lands on Leaf 3 (Strict Duty):** The daughter's anger is morally justified. The mother failed an obligation.
  *   **If the group lands on Leaf 6 (Classic Supererogation):** The daughter's anger is emotional, not moral. She feels abandoned, but can't claim a right was violated.
  *   **If the group lands on Leaf 4 (Latitude):** The conflict is about *allocation*. Did the mother use her "latitude" wisely, or did she waste her "helping credits" on a stranger when family needed them? (This is often the richest ground for fiction).
