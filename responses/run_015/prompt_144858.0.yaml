      Clifford's evidentialism is literally undefined for constitutively confidence-dependent propositions, necessitating a distinct normative attitude of steadfastness. The standard framing of the ethics of belief asks how much evidence is required before belief is permitted, casting William James and W.K. Clifford as adversaries over the weight of practical reasons versus evidential sufficiency. This question presupposes a uniform ontology of propositions, assuming that all truth-claims stand at the same distance from the believer. That presupposition is false. The determinate question this project answers is not how much evidence is enough, but what kind of attitude is appropriate when the truth-value of a proposition depends on the confidence held in it.

      I distinguish two classes of confidence-dependent propositions. The first are causally dependent: confidence helps bring about the truth, but a gap remains where evidence could theoretically check the outcome (e.g., a mountaineer's leap, placebo effects). The second are constitutively dependent: the confidence is partly what it *is* for the thing to be so, leaving no gap for an outside evidential check (e.g., mutual trust in a marriage, a teacher's faith in a student). Clifford's rule is demanding but coherent for the causal kind; for the constitutive kind, it is undefined because the required evidence cannot exist prior to the attitude. James's permission is really a doctrine about the constitutive kind, but he oversells it using the rhetoric of causal creation. Consequently, the ethics of belief lacks a category for the attitude we take toward constitutively confidence-dependent propositions. It is not belief (too truth-aimed), and not acceptance (too voluntarist and action-tied). This project argues for a third attitude—steadfastness—and delineates its norms.

      The nine-month timeline is divided into three phases of conceptual construction and stress-testing. Months 1-3 focus on taxonomy and case selection. I will catalogue putative cases of constitutive dependence (trust, political solidarity, pedagogical faith) and rigorously attempt to reduce them to causal mechanisms. Months 4-6 construct the normative framework. I will define the norms of steadfastness, distinguishing them from evidential norms and pragmatic permissions. Months 7-9 are dedicated to objections and refinement, specifically testing whether steadfastness collapses into belief under pressure.

      This method is chosen over close textual exegesis of James and Clifford because the error lies in the categorical framework, not the interpretation of their texts. Reading them more carefully will not reveal a distinction they did not possess. Pure conceptual analysis is also insufficient; without grounding in specific cases, the causal/constitutive distinction risks becoming verbal sleight-of-hand. The case-driven approach forces the distinction to earn its keep against concrete counterexamples.

      There are three possible conclusions. First, the distinction holds, and steadfastness emerges as a unique normative category. Second, the distinction holds, but existing attitudes (belief or acceptance) can absorb the norms of steadfastness. Third, the distinction collapses; all constitutive cases reduce to causal ones upon closer inspection. The deciding consideration between the first and second outcomes is whether steadfastness permits actions that belief forbids and acceptance cannot motivate. The deciding consideration between the first and third is whether a "gap" for evidence can be found in cases like marital trust. If such a gap exists, the project fails.

      Failure conditions are specific. The project fails if the causal/constitutive distinction proves unstable—specifically, if every constitutive case can be re-described as a causal case with hidden variables. It also fails if steadfastness turns out to be merely belief with higher stakes, rather than a different attitude type. To fit the nine-month scope, I must cut historical commentary on the James-Clifford debate entirely; the essays serve only as foils, not objects of study. General epistemological implications regarding truth theories will also be excluded to focus strictly on the ethics of belief. This ensures a determinate result on the normative category without drifting into metaphysics.

