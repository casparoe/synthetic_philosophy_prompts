answer: |-
  # Seminar Game: The Ontology Audit

  **Time:** 90 Minutes
  **Class Size:** 13 Students (3 Groups of 4–5)
  **Materials:** Printed Case Cards (6 types), Whiteboard, Markers.

  ## Part 1: Setup (10 Minutes)

  **1. The Scenario**
  Tell the class they are **Ontological Audit Boards**. A massive insurance conglomerate needs to know what counts as "a single object" to process liability claims. If a "single object" causes damage, the owner is liable. If it's just "many objects," the liability is diluted or void.

  **2. The Charters (Assign Roles)**
  Divide the class into three boards. Hand each board their **Charter Card**. They must vote according to the principle on the card, *not* their personal intuition.

  *   **Board A (Contact-Only):** Composition occurs **if and only if** the parts are physically touching. No gaps allowed.
  *   **Board B (Functional-Unity):** Composition occurs **if and only if** the parts act together to achieve a single goal or function. Physical contact is irrelevant.
  *   **Board C (Unrestricted):** Composition **always** occurs. Any collection of parts constitutes an object. (Note: This board will vote "YES" on everything, but must justify *why* liability applies).

  **3. The Stakes**
  *   **Verdict:** For each case, vote **EXISTS** (One Object) or **SCATTERED** (Many Objects).
  *   **Liability:** If you vote **EXISTS**, you accept liability for a $10M damage claim associated with that case. If you vote **SCATTERED**, liability is void.
  *   **Consistency Points:** You gain points for sticking to your Charter. You lose points if another board proves your verdict contradicts your Charter.

  ---

  ## Part 2: Round 1 — The Initial Audit (25 Minutes)

  Distribute **Case Cards 1–6**. Each card has **Public Info** only.
  Boards deliberate and record verdicts on the Whiteboard (3 columns, 6 rows).

  **The Cases (Public Info):**

  1.  **The Flash Mob:** 50 humans perform a synchronized dance for 5 minutes, then disperse. No costumes.
  2.  **The Drone Swarm:** 100 drones carry a heavy beam together for 12 minutes. They maintain formation via Wi-Fi.
  3.  **The Ice Bridge:** Blocks of ice sit adjacent, freezing together. A truck drives over them. They melt separately afterward.
  4.  **The Brick Pile:** 500 bricks stacked in a warehouse. No mortar.
  5.  **The Twin Towers:** Two remote-controlled cranes move in perfect unison across a construction site. They never touch.
  6.  **The Cosmic Dust:** Particles floating in a vacuum chamber. No interaction.

  *Instructor Role:* Keep time. Ensure Board C (Unrestricted) doesn't just say "Yes" but acknowledges they accept liability for everything. Ensure Board A (Contact) struggles with the Drone Swarm.

  ---

  ## Part 3: Round 2 — The Reveal & Appeals (25 Minutes)

  Distribute **Hidden Info Slips** to the class. This changes the physical facts but not necessarily the functional ones.

  **The Hidden Info:**
  1.  **Flash Mob:** They were strangers coordinated by an algorithm in their earpieces. No prior agreement.
  2.  **Drone Swarm:** One drone malfunctioned and drifted away, but the remaining 99 adjusted and completed the delivery.
  3.  **Ice Bridge:** **CRITICAL REVEAL:** The blocks were never touching. A microscopic gap existed; they bore weight via magnetic levitation, not contact.
  4.  **Brick Pile:** They are glued together invisibly.
  5.  **Twin Towers:** **CRITICAL REVEAL:** They are synchronized by a hidden third signal, not each other.
  6.  **Cosmic Dust:** One particle is actually a micro-black hole affecting the others gravitationally.

  **The Appeal Phase:**
  *   Boards have 10 minutes to review verdicts.
  *   **Challenge:** Board A can challenge Board B if Board B voted "EXISTS" on a case where contact is now proven impossible (e.g., Ice Bridge).
  *   **Defense:** Board B must argue why their principle still holds despite the new info.
  *   **Instructor Arbiter:** You do not decide truth. You only award Consistency Points if a board successfully defends their Charter against the new facts, or penalize them if they contradict their Charter (e.g., if Board A votes "EXISTS" on the Flash Mob despite no contact).

  ---

  ## Part 4: Scoring & Debrief (30 Minutes)

  ### 1. The Scoreboard (5 Minutes)
  Tally the results on the whiteboard.
  *   **Liability Check:** Who is on the hook for the $10M Ice Bridge claim? (Board C definitely. Board A should be off, unless they slipped. Board B depends on if function survived the magnetic reveal).
  *   **Consistency Check:** Which board contradicted their own Charter the most? (Usually Board A, because "contact" is hard to define strictly).

  ### 2. Mapping to Metaphysics (15 Minutes)
  Guide the discussion from the game mechanics to the literature they've read.

  *   **Board A (Contact-Only):** Maps to **Common Sense Restrictivism**.
      *   *Discussion:* Why did this feel natural but break down on the Ice Bridge? Van Inwagen rejects this because "contact" is physically ambiguous (do atoms touch?).
      *   *The Trap:* Did they vote "EXISTS" on the Flash Mob? If so, they smuggled in *functional* intuition while pretending to be *contact* restrictivists.
  *   **Board B (Functional-Unity):** Maps to **Merricks-style Organicism/Artifact View**.
      *   *Discussion:* Does the Drone Swarm survive the loss of a part? (The Ship of Theseus problem). If the function remains, is it the same object?
      *   *The Trap:* Did they vote "SCATTERED" on the Cosmic Dust? If so, they smuggled in a *causal* requirement not in their charter.
  *   **Board C (Unrestricted):** Maps to **Lewis/Sider Universalism**.
      *   *Discussion:* How did it feel to accept liability for the Cosmic Dust? Universalism is ontologically cheap (everything exists) but ideologically expensive (weird objects exist).
      *   *The Trap:* Did they hesitate? Universalism requires believing in "trout-turkeys" (arbitrary sums).

  ### 3. Predictable Failures (5 Minutes)
  Be honest about where the game fails to capture the philosophy.

  *   **Smuggling Common Sense:** Students assigned Board A will almost certainly vote "EXISTS" on the Brick Pile or Flash Mob because "it looks like one thing." This proves Van Inwagen's point: Common sense is not a rigorous principle.
  *   **The "Vagueness" Dodge:** Students will argue the gap in the Ice Bridge is "too small to count." This is the Sorites Paradox. Point out that metaphysics demands a sharp boundary, which the game forces them to confront.
  *   **Liability vs. Existence:** Students will vote based on who *should* pay (ethics) rather than what *exists* (ontology). Remind them: Metaphysics is descriptive, not normative.

  ### 4. The Missing Piece (5 Minutes)
  Tell them what the game *couldn't* do, so they know what to listen for in the lecture.

  *   **Modal Profiles:** The game is synchronic (one moment in time). It cannot test **persistence conditions**.
      *   *Example:* If we remove one brick from the Pile, is it the *same* object? The game treats existence as a binary switch, not a trajectory through time.
  *   **Brutal Composition:** The game assumes there is a "correct" answer they can find. Van Inwagen argues there might be no answer (indefiniteness), or the answer is brute fact. The game forces a verdict, hiding the possibility that the question itself might be flawed.
  *   **Paraphrase:** Nihilists (like Merricks) argue we can talk *as if* chairs exist without them *actually* existing. The game forces an ontological commitment, missing the linguistic escape route.

  ---

  ## Instructor Cheat Sheet: Case Verdict Matrix

  | Case | Board A (Contact) | Board B (Function) | Board C (Universal) | Metaphysical Tension |
  | :--- | :--- | :--- | :--- | :--- |
  | **Flash Mob** | NO (No contact) | YES (Shared goal) | YES (Always) | Is social coordination enough for unity? |
  | **Drone Swarm** | NO (Scattered) | YES (Shared load) | YES (Always) | Does functional loss (1 drone) kill the object? |
  | **Ice Bridge** | **NO** (Hidden gap) | YES (Bears weight) | YES (Always) | **Key Case:** Contact is illusory. |
  | **Brick Pile** | YES (Touching) | NO (No function) | YES (Always) | Artifacts vs. Heaps. |
  | **Twin Towers** | NO (No contact) | NO (No shared goal)* | YES (Always) | *Unless sync = function. |
  | **Cosmic Dust** | NO | NO | YES | The "Trout-Turkey" test. |

  *\*Note on Twin Towers:* Board B might split here. If "syncing" is a function, they vote YES. If the function is "building," they vote NO. This disagreement is a feature, not a bug. Highlight it in debrief.

  ## Printable Card Template (Copy/Paste)

  **CASE CARD [X]**
  **Public Info:** [Description]
  **Liability Claim:** $10,000,000
  **Round 1 Verdict:** [ ] EXISTS [ ] SCATTERED
  *(Do not open Hidden Info until Round 2)*

  **HIDDEN INFO SLIP [X]**
  **Reveal:** [Fact]
  **Appeal Rule:** If this fact contradicts your Charter's condition for composition, you must change your verdict or lose Consistency Points.
