prompt: |-
  So I'm prepping a metaphysics seminar for fall — about 13 juniors and seniors, 90 minutes, they've read some van Inwagen and maybe Merricks but nothing too deep. I want them to feel the special composition question in their bones rather than just memorizing universalism vs nihilism. Could you design a runnable in-class game?

  Here's teh twist: instead of tables and chairs, the case cards should feature temporary, spatially scattered, or functionally unified artifacts — a flash mob that performs one choreography then disperses, a drone swarm acting as one delivery system for exactly 12 minutes, an ice-block bridge that melts separately but bears weight together, and one hidden case where two remote-controlled structures sync up without ever touching. Divide the class into three 'audit boards' assigned to contact-only, functional-unity, or unrestricted principals. Give them 6 cards in round 1; they have to render binding verdicts on whether there's exactly one object and assign liability points. They earn consistency points for sticking to their principle, but other boards can appeal using hidden case details revealed in round 2 — for example, the ice bridge turns out to be two separate structures synchronized remotely, which breaks the contact intuition but might preserve functional unity. They should discover that they all agree on some cases and violently disagree on others, with no neutral arbiter.

  Then I need a debrief that maps the rounds onto the standard positions, plus an honest note on what predictably goes wrong — probly students will smuggle in 'common sense' instead of following their assigned principle — and which part of the metaphysical debate the game can't reproduce (maybe the modal argument about essential parts) so I know to cover that in lecture. No bibliographies or citation lists, and keep the rules simple enough to run with just printed cards and a whiteboard.
