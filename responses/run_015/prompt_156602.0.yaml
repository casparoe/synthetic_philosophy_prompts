  2.  **Deconstruct the Philosophical Tension:**
      *   **Levelling Down Objection (LDO):** It seems absurd to make some worse off without making anyone better off just to achieve equality. Here, Option A makes some worse off (Pass users) to make others better off (Grant recipients), *but* the total utility might decrease (admin costs, unclaimed funds, high value loss for pass users vs. low value gain for grant users).
      *   **Prioritarianism:** Give priority to the worse off. The moral value of a benefit is greater the worse off the recipient is. This justifies sacrificing total utility for the sake of the needy.
      *   **The User's Insight:** They know Prioritarianism avoids the *pure* LDO (where no one gains), but here people *do* gain. However, the total pie shrinks. The memo needs to articulate *why* shrinking the pie is acceptable here based on the moral weight of the recipients.
      *   **Trade-off Ratio:** Need to pick a number. 1:1 is utilitarian. 5:1 suggests strong priority. No limit suggests strict egalitarianism (which LDO critiques). A moderate prioritarian view usually accepts some loss but not infinite loss. Let's aim for a reasoned moderate priority, say 3:1 or 4:1.
      *   **The Pass Overlap:** 20% of Pass users are high-need. Cutting the pass hurts the very people we want to help. This complicates Option A.
