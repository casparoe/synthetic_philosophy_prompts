          *   B: Keep Wellness Pass (printing, shuttle, climbing wall). Use 60k for Prof-School Prep (mock interviews, etc.). Pass used mostly by comfortable students (1/5 Pell-eligible). Prep program helps 150 mostly-advantaged students. *Effect:* Maintains status quo for pass, adds benefit to advantaged.
