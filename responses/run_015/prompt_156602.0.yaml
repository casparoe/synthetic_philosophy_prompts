answer: |-
  **MEMORANDUM**

  **TO:** Student Services and Activities Fee Committee
  **FROM:** [Your Name], Undergraduate Representative
  **SUBJECT:** Recommendation on Allocation of $60k Reserve & Wellness Pass Structure
  **DATE:** October 24, 2023

  **Bottom Line Recommendation**
  I recommend we adopt a modified **Option A (Campus Life Grants)**, funded immediately from the reserve, coupled with a **one-year phase-out of the Wellness Pass** rather than an immediate cut.

  This approach prioritizes high-need students without violating the reliance interests of current pass users. Specifically, we should approve the grants now but vote to let the Pass lapse next academic year, providing notice to allow students to adjust their budgets and commuting arrangements.

  **The Trade-Off Ratio**
  We must define how much aggregate value we are willing to sacrifice for distributive priority. I propose a **3:1 ratio**: we should accept up to $3 of loss in general student welfare to generate $1 of welfare for a high-need student.

  *   **Why not 1:1?** A 1:1 ratio treats all dollars as morally equal (utilitarianism). It ignores the diminishing marginal utility of money; $500 prevents a eviction for a needy student but only buys convenience for a comfortable one.
  *   **Why not infinite?** We must heed the Levelling Down Objection. Destroying value without limit becomes perverse. If administering the grants cost $5 for every $1 delivered, or if the Pass cut harmed the needy more than it helped them, we should stop. The 3:1 cap acknowledges priority while respecting efficiency. Given the $8k admin cost and 40% non-take-up in Option A, we are near this limit, which is why the phase-out is necessary to mitigate harm.

  **The Pass Overlap (The 20% Problem)**
  Approximately 20% of Wellness Pass users are Pell-eligible—the same population targeted by the grants. Cutting the Pass immediately punishes the very people we aim to help. This is not noise; it is a significant equity constraint.

  However, this is a reason to modify the *timing*, not abandon the grants. The grant provides emergency liquidity (rent/food), which is morally more urgent than the Pass benefits (printing/climbing). By phasing the Pass cut, we allow the overlapping vulnerable population to secure the grant buffer before losing the Pass subsidy.

  **Timing and Mechanics: Cutting vs. Lapsing**
  Our precedent treats cutting an existing service as morally weightier than declining to start a new one. This distinction is not just bureaucratic; it reflects **reliance interests**. Students organized their semesters around the shuttle and printing availability.

  To cut the Pass now violates those expectations. To let it lapse with notice respects them. We should spend the reserve on grants *now* (addressing immediate hardship) but schedule the Pass budget reduction for the next fiscal cycle. This separates the immediate injection of aid from the contraction of services, softening the blow to total welfare.

  **The Strongest Case for the Losing Side (Option B)**
  Those opposing this recommendation argue that the Wellness Pass is a crucial site of **social integration**, not just a subsidy. By maintaining a universal service where students from different backgrounds mix (at the climbing wall or on the shuttle), we foster a campus culture that reduces stigma and isolation.

  Cutting the Pass to fund targeted grants may materially help the needy, but it risks segregating campus life. A commuter student relying on the shuttle loses more than $70 of value; they lose reliable access to campus community. If the grant program fails to reach them (due to the 40% non-take-up rate), they are strictly worse off. This argument holds that universal goods protect dignity in a way means-tested transfers do not, and that breaking the promise of existing services undermines trust in student governance.

  **Conclusion**
  Option B maximizes total utility but ignores the severity of hardship. Option C is efficient but morally blind. Modified Option A accepts a net loss in aggregate welfare because the moral weight of the recipients justifies it under a prioritarian view, provided we cap the inefficiency (3:1) and respect reliance interests (phase-out).

  I move we approve the grants from reserve and schedule the Wellness Pass for lapse effective next academic year.
