      **SenseLog™ Support Hub**

      **Welcome to Absolute Semantic Sovereignty.**
      At SenseLog, we believe your inner sensations are proprietary. Our app allows you to assign a private sign—let's call it *S*—to a specific feeling. Once logged, *S* belongs entirely to you. No external verifier can access, correct, or understand your usage. This isn't a bug; it's our End-to-End Meaning Encryption.

      **Q: How do I define *S* during onboarding?**
      **A:** Simply enter the **Ostensive Setup Mode**. Focus intensely on the sensation you wish to track. When the feeling peaks, tap the screen to assign the symbol *S*. This creates a mental association between the sign and the sensation. Please note: This step establishes no rule for future use, but it does create a powerful ceremonial anchor for your intent. Many users find the act of tapping provides a sense of definition, even if no criteria for correctness are generated.

      **Q: How do I know I'm using *S* correctly tomorrow?**
      **A:** You don't—and that's the point. In public language, correctness is determined by community agreement. In SenseLog, correctness is determined by your present impression. If it *seems* to you that you are using *S* correctly, then you are. Our **Validation Engine** confirms that you *feel* confident in your entry. It cannot verify accuracy, as accuracy implies a standard independent of your memory. We prefer to call this "Subjective Consistency."

      **Q: Why doesn't Premium 'Sincerity Mode' fix errors?**
      **A:** **Sincerity Mode** ensures you aren't lying to yourself, but it cannot establish a truth condition. A lie requires a fact to contradict. Since *S* refers to a private object with no public criteria, there is no fact of the matter to be sincere *about*. However, Premium users receive a daily notification reminding them that their usage feels authentic. Additionally, our **Encrypted Backup** ensures that if you forget what *S* meant, your confusion is securely stored in the cloud.

      **Q: Can I share patterns with my doctor?**
      **A:** Not in Private Mode. To generate actionable insights (e.g., "Headache Frequency"), *S* must be mapped to public criteria (e.g., "Migraine"). This requires the **Objective Correlative Integration Pack** (Sold Separately). This add-on translates your private signs into public language, allowing for pattern recognition, medical diagnosis, and actual communication. Please note: Purchasing this integration voids your Private Language Warranty, as meaning becomes shareable.

      **Q: My streak counter reset. Did I use *S* wrong?**
      **A:** No. The streak counter measures consecutive days of logging, not consecutive days of correct usage. Since correct usage is undefined, the streak cannot be broken by error, only by inactivity. Keep logging!

      *Still have questions?* Remember: If you think you understand the FAQ, you might be importing public meaning. Trust your feeling.

