      *(Self-Correction during drafting)*: I need to be careful not to make it sound like the app is *trying* to fail. The app believes this is the feature. The help page should treat the lack of criteria as a privacy benefit.

      *Revision on Behaviorism:* Ensure I don't say "others can't see it." Say "others don't need to." The error is internal normativity.

