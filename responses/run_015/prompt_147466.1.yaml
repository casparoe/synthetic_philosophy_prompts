answer: |-
  **MEMORANDUM**

  **TO:** Heritage and Memory Oversight Committee
  **FROM:** [Your Name/Chair's Office]
  **DATE:** October 26, 2023
  **SUBJECT:** DECISION MEMO: Status of the 1848 Founding Plaque

  **BOTTOM LINE RECOMMENDATION**
  The Committee should vote to **remove the existing plaque** and commission a **replacement memorial** that accurately reflects the 1851 settlement date and the nature of the Indigenous displacement. The new installation must explicitly acknowledge the previous narrative as a historical artifact of the town's evolving self-understanding. We cannot retain the current text.

  **BACKGROUND**
  For decades, the bronze plaque in Town Square has served as the focal point for our annual Founding Ceremony, stating Riverside was "Peacefully Founded in 1848." Recent archival research by [University Name] confirms three critical discrepancies:
  1.  **Date:** Permanent settlement occurred in 1851, not 1848.
  2.  **Nature:** The establishment involved violent displacement of the [Indigenous Group Name], not peaceful coexistence.
  3.  **Actors:** The "founders" were primarily land speculators, not civic builders.

  The Committee is currently deadlocked. One faction argues for immediate correction to align with historical record and restorative justice. The opposing faction argues that the plaque represents the town's lived identity and that altering it severs the community's continuity with its past.

  **ANALYSIS: HISTORICAL RECORD VS. COLLECTIVE MEMORY**
  This conflict is not merely about dates; it is about the function of public monuments. A monument is not a textbook. It is a statement of values. The argument to retain the plaque rests on the idea that the ceremony and the object have generated their own truth over 100 years—that the *memory* of the founding is now more real to the community than the *event* of the founding.

  However, public heritage institutions derive their authority from stewardship, not fabrication. When a monument asserts a moral falsehood (that violence was peace), it ceases to function as memory and begins to function as propaganda. If the Committee prioritizes the comfort of the current narrative over verified evidence of harm, we compromise the integrity of every other marker under our oversight.

  **THE QUESTION OF MNEMONIC AUTHORITY**
  We must address whether the community holds "mnemonic authority"—the right to dictate the terms of its own past.
  *   **The Argument For:** Communities are the ultimate authors of their identity. If the town has celebrated 1848 for a century, that celebration is a historical fact in itself. To change it is to impose an external academic standard on local lived experience.
  *   **The Reality:** Mnemonic authority is a stewardship, not a property right. A community has the right to *interpret* its past, but not to *conceal* it. Claiming authority over memory becomes an excuse for error when that memory requires the silence of others (in this case, the displaced Indigenous population). We do not own the past; we occupy it. Therefore, mnemonic authority yields when it actively erases the existence or suffering of another group.

  **INSTITUTIONAL STAKES**
  1.  **Public Trust:** If the Committee is seen as guarding a known lie, our future designations will be viewed with skepticism. Accuracy is the currency of historical institutions.
  2.  **Indigenous Relations:** Retaining the word "Peaceful" in the face of evidence of violence is an active continuation of that violence. It signals to the [Indigenous Group Name] that their history is subordinate to our comfort. This precludes any possibility of genuine reconciliation.
  3.  **Civic Identity:** Identity built on a fragile myth collapses under scrutiny. Identity built on a truthful reckoning with complexity is resilient.

  **ACKNOWLEDGING THE LOSING ARGUMENT**
  The argument to retain the plaque is not without merit. The strongest point raised by the preservation faction is that **ritual creates social cohesion.** For generations, residents have gathered at that plaque to celebrate belonging. The plaque is not just a record of 1851; it is a record of the 1920s (or whenever it was installed) and every year since. To remove it feels, to many, like telling them their grandparents' patriotism was a lie. There is a genuine risk that removing the plaque will be interpreted not as correction, but as rejection of the town's lineage. This alienation is real and must be managed, not dismissed. However, social cohesion purchased at the price of historical erasure is unsustainable. We cannot ask the Indigenous community to bear the burden of our cohesion.

  **RECOMMENDATION & ACTION PLAN**
  We recommend **Removal and Replacement** rather than a simple "counter-plaque." A counter-plaque often creates a hierarchy of information where the original lie remains dominant and the truth is relegated to an asterisk.

  **The New Memorial Must:**
  1.  **Correct the Record:** State the 1851 date and acknowledge the [Indigenous Group Name] as the prior inhabitants.
  2.  **Acknowledge the Harm:** Use clear language regarding displacement (avoiding euphemisms).
  3.  **Honor the Continuity:** Include text acknowledging that the *previous* plaque reflected the understanding of its time, and that this replacement reflects the town's commitment to truth. This preserves the "memory of the memory" without validating the falsehood.
  4.  **Collaborative Design:** The Committee must invite representatives from the [Indigenous Group Name] to co-design the new text and ceremony.

  **CONCLUSION**
  We cannot keep the plaque. To do so is to assert that our comfort is more important than the truth of violence. We can, however, honor the town's endurance by admitting it survived a difficult history, rather than pretending the history didn't happen.

  **VOTE REQUIRED:** Simple Majority
  **NEXT STEPS:** Draft RFP for new memorial design; initiate contact with [Indigenous Group Name] leadership.

  ***

  **APPROVED BY:**
  [Name]
  Chair, Heritage and Memory Oversight Committee
