prompt: |-
  ok so i sit on the town's Heritage and Memory Oversight Commitee and we've got a real mess. there's this bronze plaque in the square commemorating the 'Peaceful Founding of Riverside in 1848' and every year the community holds a ceremony around it. but a grad student just dug up land registry docs and tribal correspondence showing the settlement was actually 1851, it involved violent displacement of the local indigenous group, and the 'founders' were speculators. the comittee is split: half say the plaque is flat wrong and should be corrected or pulled; half say altering it erases our collective identity and the ceremony is part of who we are now, not just a record of facts. i need the board's decision memo -- recommend revise, remove, add a counter-plaque, or leave it alone -- with reasoning that actually works through the conflict between collective memory and historical record, including which should give way here and why. be honest about the strongest argument for the side that loses. treat the instutional stakes seriously (trust in public monuments, relationship with the displaced community, etc.) and don't just list philosophers. also, i want you to address whether there's such a thing as 'mnemonic authority' that a community holds over its own past, or if that's just a fancy excuse for keeping errors. there's probaly a typo in here but you get the idea. make it a formal memo with a clear bottom line, not personal advice.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Town's Heritage and Memory Oversight Committee.
      *   **Task:** Write a Board Decision Memo regarding a controversial bronze plaque.
      *   **The Issue:** Plaque says "Peaceful Founding of Riverside in 1848." New evidence shows 1851, violent displacement, speculators.
      *   **The Conflict:** Accuracy/Justice (Revise/Remove) vs. Tradition/Identity (Keep/Leave Alone).
      *   **Requirements:**
          *   Recommend a specific action (Revise, Remove, Counter-plaque, or Leave).
          *   Reason through the conflict between collective memory and historical record.
          *   Determine which should give way and why.
          *   Be honest about the strongest argument for the losing side.
          *   Address institutional stakes (trust, relationship with Indigenous community).
          *   Address the concept of "mnemonic authority" (does the community own its past?).
          *   Format: Formal memo with a clear bottom line.
          *   Tone: Professional, serious, nuanced, not just listing philosophers.

  2.  **Determine the Recommendation:**
      *   *Option A: Leave it alone.* Too dismissive of the violence and factual error. Damages trust with Indigenous community and undermines historical integrity.
      *   *Option B: Remove it.* Cleans the slate but erases the history of the *myth* itself. Might feel like erasing the town's identity to the traditionalists.
      *   *Option C: Revise/Replace.* Corrects the facts but removes the artifact of the previous belief.
      *   *Option D: Contextualize (Counter-plaque/Explanatory Panel).* Keeps the original artifact (acknowledging the tradition) but corrects the record and acknowledges the harm.
      *   *Decision:* The most robust solution for a Heritage Committee is usually **Contextualization with Modification**. However, given the severity ("violent displacement"), simply adding a plaque next to a lie can look like equivocation. A **Replacement with Context** is often better. Let's go with **Remove and Replace with a Comprehensive Monument**. Why? Because "Peaceful Founding" is not just a date error; it's a moral falsehood. Keeping the word "Peaceful" even as a historical artifact validates the lie.
      *   *Refined Decision:* **Remove the current plaque and install a new memorial that acknowledges the 1851 settlement, the displacement, and the evolution of the town's understanding.** This balances accuracy with the need for a focal point of memory.
      *   *Wait, looking at the prompt's nuance:* The prompt asks to address "mnemonic authority." If I say "Remove," I am asserting historical record overrides community memory. If I say "Add a counter-plaque," I am trying to hybridize.
      *   *Best Path for a "Decision Memo":* **Remove the specific false claims but retain the site as a place of memory, installing a new marker that corrects the record while acknowledging the previous narrative as a chapter in the town's historiography.** This is effectively a "Replace with Context" approach. Let's simplify for the memo: **Recommendation: Remove and Replace with a Contextualized Memorial.**

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** State the recommendation clearly upfront.
      *   **Background:** Briefly state the facts (1848 vs. 1851, Peaceful vs. Violent).
      *   **Analysis of the Conflict:**
          *   *Historical Record:* Facts matter for public trust.
          *   *Collective Memory:* The ceremony matters for social cohesion.
          *   *Mnemonic Authority:* Does the town own the truth? No, but they own the *meaning*.
      *   **Institutional Stakes:** Trust in the Committee, relationship with Indigenous groups, integrity of public space.
      *   **The Losing Argument (Traditionalists):** Acknowledge their point about continuity and identity honestly.
      *   **Conclusion/Action Plan:** Next steps.

  4.  **Developing the Argument (The "Why"):**
      *   *Mnemonic Authority:* I need to argue that a community has the right to *celebrate* its past, but not the right to *fabricate* it. Authority over memory is stewardship, not ownership.
      *   *Truth vs. Identity:* Identity built on a lie is fragile. Correcting it strengthens long-term identity.
      *   *The "Peaceful" Claim:* This is the dealbreaker. A date error is one thing; claiming violence was peace is moral erasure.
      *   *Institutional Trust:* If the Committee ignores evidence, it becomes a propaganda arm, not an oversight body.

  5.  **Refining the Tone:**
      *   Avoid academic jargon where possible (don't name-drop Halbwachs or Nora unless necessary, focus on the concepts).
      *   Be decisive.
      *   Respect the Traditionalist view without validating the falsehood.

  6.  **Addressing Specific Prompt Constraints:**
      *   *Honest about the strongest argument for the side that loses:* I need to explicitly state why the "Keep It" side has a point (continuity, ritual value) before explaining why it fails.
      *   *Mnemonic Authority:* Dedicate a specific section to this.
      *   *Formal Memo:* Use headers, clear language.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Remove and Replace" too aggressive?
      *   *Adjustment:* Maybe "Retire and Replace." It sounds more respectful.
      *   *Critique:* Did I address the Indigenous relationship?
      *   *Adjustment:* Ensure the recommendation includes consultation with the displaced community.
      *   *Critique:* Is the "Mnemonic Authority" section clear?
      *   *Adjustment:* Define it as stewardship vs. fabrication.

  8.  **Final Polish:** Check for flow, clarity, and ensuring the "Bottom Line" is unmistakable. (Self-correction: Ensure I don't sound like I'm giving personal advice to the user, but writing the document *for* the committee).

  9.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts).

  *(Self-Correction on the Recommendation)*: Actually, a "Counter-plaque" is often criticized as a "band-aid." A full replacement is stronger for "violent displacement." However, to truly address the "collective identity" argument, the new monument should acknowledge the *history of the plaque itself*. So, the recommendation is: **Remove the current plaque. Install a new memorial that corrects the historical record AND acknowledges the previous narrative as a reflection of the town's evolving understanding.** This honors the "memory of the memory" without validating the lie.

