      *(Self-Correction during drafting)*: Make sure I don't just say "Weber is wrong." I need to use Weber's concepts (switchman, elective affinity, inner-worldly asceticism) to diagnose the Korean case. Ensure I distinguish between *Confucianism* as a historical tradition and *State Confucianism* as a political tool. The prompt asks about *Saemaul* specifically, so focus on the "Diligence, Self-help, Cooperation" triad.

      *(Refining the "Independent Cause" question)*: If the state manufactures values to get growth, the values are dependent on the state's economic goal. Therefore, they cannot be an *independent* cause in the Weberian sense. They are a mechanism of implementation. I need to be clear on this distinction.

