  (2) Accurate elements—what Plutarch actually does and intends
  The summary correctly identifies Plutarch's primary intent: moral improvement rather than strict chronological historiography. Plutarch explicitly states he is writing lives, not histories, focusing on signs of the soul (*semeia*) rather than great battles. It is also true that he shapes narratives to highlight character traits, sometimes prioritizing ethical clarity over factual completeness. Modern historians rightly caution against using the *Lives* as primary sources for social history without corroboration, as Plutarch often relies on anecdote over data. Furthermore, the *synkrisis* is indeed a formal comparison intended to weigh virtues and vices. The student accurately perceives the didactic drive behind the work; Plutarch wants readers to emulate or avoid specific behaviors, making the text inherently normative rather than purely descriptive.

