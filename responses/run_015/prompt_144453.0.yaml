  However, the summary conflates Plutarch's Middle Platonism with Stoicism; his virtue ethics are flexible, not a rigid grid. He rarely offers binary exempla; most subjects are mixed, displaying both greatness and flaw. Calling the work hagiography is misleading, as Plutarch frequently details vices—Antony's decadence or Alcibiades' recklessness are not suppressed but analyzed critically. He does not fabricate events to fit arcs so much as select anecdotes that reveal *ethos*, a crucial distinction between illustration and fabrication. The *synkrisis* is not a simplistic grading rubric but a complex rhetorical exercise exploring contextual nuances of virtue, often leaving the final judgment open to the reader. Furthermore, dismissing him entirely for social history ignores how his narrative choices reveal contemporary values about leadership and character. The summary treats his moral focus as a liability rather than a different epistemological goal, confusing moral truth with factual exhaustiveness. It also overlooks the political complexity within the pairs, which often resist easy moralizing in favor of exploring the tension between public duty and private character.

  (4) What a careful reader of Plutarch or a defender of exemplary biography would likely object to
  A defender would argue that dismissing Plutarch as obsolete misunderstands moral philosophy's enduring concern with character. Modern biography also shapes narratives; neutrality is itself a construct. Plutarch's method invites active moral engagement from the reader, rather than passive reception of data. Scholars like Christopher Pelling argue that Plutarch's psychological insight remains valuable for understanding how individuals navigate fortune and responsibility. The *Lives* offer a model for integrating ethical reflection with narrative, something modern biography often struggles to achieve without becoming preachy. A careful reader objects to the idea that factual precision is the only metric of value; Plutarch offers truth about human nature, even if specific dates are shaky. His method encourages readers to practice moral judgment, making him a partner in ethical reasoning rather than a mere provider of exempla.

  (5) Verdict on whether the conclusion—that Plutarch's method is obsolete for moral philosophy—survives once the summary is corrected
  Once corrected, the conclusion that Plutarch is obsolete for moral philosophy fails. While limited for social history, his approach to character remains vital. Claiming his method useless ignores the need to extract ethical meaning from lives. Plutarch offers a robust framework for discussing virtue in context, relevant despite inaccuracies. While the summary correctly identifies his non-historical aim, it wrongly dismisses his philosophical viability. Plutarch remains a model for biography serving ethical inquiry, provided one reads him as a moralist rather than an archivist. His focus on character offers a corrective to modern fact-obsessed life-writing, ensuring his method remains living rather than obsolete.
