answer: |-
  *   **Embed, Don't Define:** Avoid academic definitions of Jaspers's four categories. Instead, let each section of the speech resonate with the *logic* of one category: begin with the law (Criminal), move to citizenship (Political), turn inward to conscience (Moral), and end on shared human fragility (Metaphysical).
  *   **The Pivot Point:** Use the Charter's rejection of hereditary *criminal* guilt as the foundation to build a heavier burden of *political* and *metaphysical* responsibility. This comforts settler descendants (you are not criminals) while challenging them (you are responsible citizens).
  *   **The Ritual's Function:** Define the "Day of Inherited Questions" not as a search for verdicts (which implies criminal guilt) but as a practice of solidarity (metaphysical guilt). The "Question" is not "Did you do this?" but "Now that we are here, what do we owe each other?"
  *   **Audience Targeting:** Speak directly to the Valewood elders about survival (metaphysical), to the students about the future (political/moral), and to the philosophy teachers through the structural rigor of the argument itself.

  ***

  **Keynote Address for the Centenary of the Republic of Vareth**
  **Occasion:** The Day of Inherited Questions
  **Location:** The National Memorial, Vareth City

  Friends, neighbors, citizens of Vareth.

  One hundred years ago, the empire fell. From its rubble, this Republic was born. We stand today on ground that remembers fire. We stand among names carved in stone that remember silence. And we stand under a Charter that made a radical promise: that while history cannot be erased, guilt cannot be inherited like property.

  Our founders knew that if we tried to judge the grandchildren for the crimes of the grandparents, we would build a nation on a courtroom floor. And so, the Charter drew a line. It said: There is criminal guilt, and that belongs to the individuals who wielded the weapons. That judgment was made then. It is not ours to reopen. To my friends whose ancestors wore the uniform of the settler militias: you are not on trial today. You are not criminals by blood. You are citizens by choice.

  But if we stop there, if we say only "no criminal guilt," we have told only half the truth. And a half-truth is a comfortable lie.

  Because while we do not inherit criminal guilt, we do inherit a political world. This is the second weight we carry. The Republic you live in, the schools you attend, the boundaries of the land you walk—these were shaped by the decisions of the past. Political guilt is not about sin; it is about responsibility for the state we inhabit. When the empire broke the world, it left us the pieces. To be a citizen of Vareth is to accept that the stability of your home was purchased with the instability of another's. We are all liable for the maintenance of this peace. We are all responsible for ensuring that the structures of the empire do not quietly rebuild themselves within the architecture of the Republic. This is not a stain on your soul; it is a duty to your neighbor.

  And yet, politics is external. It deals with laws and reparations and borders. What of the interior life? What of the quiet moments when a settler descendant looks at a Valewood elder and wonders, *Could I have been the one?* What of the moment when a survivor asks, *Why am I the one who remained?*

  This brings us to the purpose of today. The Charter established the Day of Inherited Questions not to assign blame, but to demand introspection. This is the realm of moral guilt. But be clear: you cannot be morally guilty for an act you did not commit. Conscience is individual. So what is the Question we inherit?

  The Question is not "What did my father do?" The Question is "Who am I, given that my father did this?"

  To the descendants of the settlers: The Question asks you to examine your own silence. Not the silence of the past, but the silence of today. When you see inequality that echoes the old atrocities, do you speak? Or do you hide behind the Charter's protection? Moral guilt arises only when you fail to examine your own complicity in the present. The ritual asks you to look in the mirror and ensure that the privilege you inherited is not being used to blind you to the needs of the Valewood community.

  To the elders of the Valewood, the survivors who carried the memory when no one else would: Your Question is different. It is the moral burden of survival. It is the right to ask us, constantly, whether our reconciliation is real or merely convenient. You hold the moral compass of this nation. When you speak, we must listen, not out of pity, but out of respect for the truth you carry.

  Finally, there is a guilt that lies beyond courts, beyond states, beyond even our own consciences. Karl Jaspers called it metaphysical guilt. It is the solidarity of humans before God. It is the shame of having survived when others did not. It is the recognition that if I was not killed, it was not because I was better, but because of chance, or because someone else died in my place.

  This is the deepest layer of our Centenary. We are here because others are not. The Valewood community survives, but it was scarred. The settler community survives, but it was compromised. We are bound together not just by laws, but by this shared fragility. We are co-responsible for each other's humanity. When a child goes hungry in Vareth, we are all implicated. When an elder dies in loneliness, we are all diminished.

  So, what is the Day of Inherited Questions for?

  It is not a day to find answers. If we answer the questions, we close the book. We say, "We have fixed it," and we go back to sleep.

  No. The ritual is designed to keep the wound open just enough to let the light in. It is to remind the settler descendants that their citizenship is a trust, not a possession. It is to remind the Valewood descendants that their survival is a testimony, not just a memory. And it is to remind our students, who will inherit this Republic next, that peace is not a state of being, but a practice of asking.

  Today, we do not absolve ourselves. We do not accuse each other. We acknowledge that we are here, together, alive, when so much was done to ensure we would be apart, or dead. That is the mystery we carry. That is the guilt we share. And that is the solidarity that must hold us for the next hundred years.

  Ask the Question. Live the Question. But do not forget that the Question itself is the only bridge we have.

  Thank you.

  ***

  **Author's Note on Philosophical Liberties**
  This address stretches Jaspers's strict prohibition on collective *moral* guilt by suggesting descendants inherit a specific *task* of moral introspection regarding their ancestors' legacy, rather than solely their own immediate actions. I justify this by framing the "Inherited Question" as a current moral act triggered by historical context, rather than an attribution of past sin, thereby adapting Jaspers's individualist ethics to the necessities of a state founded on intergenerational reconciliation. Additionally, I treat *metaphysical guilt* as a functional political bond rather than solely a theological stance, pragmaticizing Jaspers's transcendental category to serve civic cohesion.
