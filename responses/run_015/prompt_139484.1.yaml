  *Piggyback Set:* Agential continuity and rational integrity (cannot survive R6).
  *Fragility Score:* 4 (Holds through affective and causal changes, fails only if agent identity dissolves).
  *Note:* Relies on the structure of agency itself.

  **C (Psychic-Order)**
  *Piggyback Set:* Affective responsiveness and character stability (cannot survive R2).
  *Fragility Score:* 8 (Fails once internal sanctions like guilt are disabled).
  *Note:* Relies on the agent feeling the value of justice.

  **D (Concession)**
