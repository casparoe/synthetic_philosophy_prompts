answer: |-
  Here is the spec you asked for. It is designed to force your Econ friend and your ML friend out of their respective silos (node-maximization vs. objective-function hacking) and into the actual philosophical problem: the architecture of agency over time.

  ### Desiderata for an Account of Rational Self-Binding

  | # | Requirement | The Case Behind It | Why It Matters |
  | :--- | :--- | :--- | :--- |
  | **1** | **Ex Post Validation** | (1) Pure Hitchhiker | The account must justify the *act* of paying at the moment of payment, not just the prior plan. If rationality abandons you at the node, the "plan" is a fiction. |
  | **2** | **Counterfactual Sensitivity** | (2) Ransom/Selection | The account must value dispositions that change *which situations you enter*, not just how you act within them. Ignoring selection effects makes rationality myopic. |
  | **3** | **Marginal Sensitivity** | (3) Imperfect Predictor + Cost | The account must degrade gracefully. If the predictor is 51% accurate or the disposition is exhausting, the recommendation should shift. It cannot be all-or-nothing. |
  | **4** | **Implementability** | (4) Indirect Control/Self-Deception | The account must evaluate the *means* of acquiring dispositions. If the only way to be rational is to make yourself irrational (or ignorant), the theory must endorse or forbid this explicitly. |
  | **5** | **Genealogical Neutrality** | (5) Unchosen Traits | The account must evaluate the trait's payoff, not its origin. Rationality cannot depend on whether you were raised to have the trait or bought it via an app. |
  | **6** | **Transparency Compatibility** | (6) Self-Effacing Dispositions | The account's recommendation must survive the agent *knowing* the recommendation. If adopting the disposition requires not knowing why you have it, the theory is self-undermining. |
  | **7** | **Accounting Integrity** | (7) Scope/Double-Counting | The account cannot count the benefit of having the disposition *and* the benefit of the act as separate utility wins. It must prevent infinite regresses of binding. |
  | **8** | **Locus Clarity** | (8) Levels (Act vs. Plan) | The account must specify where rationality resides. If Acts and Plans diverge, the theory must state which one the agent is actually obligated to follow. |

  ***

  ### Analysis of the Spec

  **Non-Negotiable vs. Camp-Specific**
  Requirements **1 (Ex Post Validation)**, **2 (Counterfactual Sensitivity)**, and **7 (Accounting Integrity)** are non-negotiable. Without #1, you concede the argument to your Econ friend (standard theory). Without #2, you ignore the ML friend's point about environment selection. Without #7, the math breaks.
  Requirement **8 (Locus Clarity)** is camp-specific. Causal Decision theorists insist the locus is the *Act*. Functional/Updateless theorists insist the locus is the *Algorithm/Plan*. A theory can be adequate while picking either, provided it admits the cost of that choice.

  **The Incompatible Pair**
  You located the tension correctly, but it sits specifically between **4 (Implementability)** and **6 (Transparency Compatibility)**.
  *   **The Conflict:** To satisfy the Hitchhiker case (#1), you often need a disposition that is robust. But robust dispositions are often acquired via self-binding tricks (#4: escrow, vows, ignoring stats). If the only way to acquire the disposition is to hide the instrumental reason for it from yourself, then knowing the theory (Transparency, #6) destroys the disposition.
  *   **The Result:** A theory that is *action-guiding* (you can read it and follow it) may be *self-effacing* (following it makes you fail). A theory that is *effective* may require you not to understand it fully. You cannot have a theory that is both fully transparent and guarantees the disposition works in all self-effacing cases.

  **The Work-Doing Requirement**
  **Requirement 6 (Transparency Compatibility)** does the most work in ruling out obvious answers.
  *   It kills "Naive Precommitment" (just tie yourself to the mast) because it forces the question: *What if the rope is cut?*
  *   It kills "Fake It Till You Make It" because it asks: *Do you believe the lie?*
  *   It kills your Econ friend's objection because it forces him to explain why knowing you are rational prevents you from being the type who gets rides.
  *   It is the filter that separates "strategic ignorance" from "structural rationality."

  ***

  ### Scorecard

  Standard Causal Choice Theory fails immediately on #1 and #2; it treats the Hitchhiker payment as a sunk cost loss and ignores the selection effect of the kidnapping. Naive Evidential approaches pass #1 and #2 but often crash on #7 (Accounting Integrity) by treating correlations as causations, and they struggle with #4 when the means involve actual causal levers like escrow. "Resolute" or Functional approaches pass #1, #2, and #5, but they bleed on #6; they often require the agent to ignore their own future incentive to defect, which is hard to sustain if the agent knows the theory and knows they are being "resolute" only to game a predictor. None pass all eight cleanly; the failure on #6 is the price of admission for solving the Hitchhiker.
