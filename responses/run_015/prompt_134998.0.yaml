  The delivery argument alone cannot distinguish the wooden horse case from the white horse case. Both arguments rely on extensional restriction: if you ask for X, Y is not delivered. In case one, a wooden horse is not delivered when a horse is sought because it lacks the substance of a living animal. In case two, a yellow horse is not delivered when a white horse is sought because it lacks the specific colour. Superficially, the logic of exclusion is identical. If the delivery argument were the sole ground for the thesis, 'white horse is not horse' would be no different than 'wooden horse is not horse'. But the seminar grants the wooden horse claim as obviously true while treating the white horse claim as paradoxical. This suggests the delivery argument identifies a phenomenon but does not explain the metaphysical distinction required to make the white horse claim substantive rather than trivial. The delivery argument shows that the extensions differ, but it does not explain whether this difference is due to exclusion or specification.

  Case three clarifies this limitation significantly. Imagine a language where 'white horse' is a single unanalysable word, lacking parts for 'white' or 'horse'. Could the thesis still be asserted? Yes, because the delivery argument still holds: seeking this word excludes yellow horses. The logic of delivery depends on the reference of the term, not its syntactic composition. If the argument relied on the compositionality of 'white' plus 'horse', the unanalysable word would defeat it. Since the argument survives, the issue is not linguistic ambiguity but ontological designation. The delivery argument proves that the extension of 'white horse' is narrower than 'horse', but it cannot explain why this narrowing constitutes non-identity rather than mere specification. This forces us to look beyond the delivery argument to the metaphysical premises. If the thesis were merely about linguistic ambiguity, the unanalysable word would render it nonsense. Since the thesis persists, it must be about the reality named, not the name itself. The argument about what may be delivered functions as a test of reference, not grammar.

  This is where the shape and colour premises carry the decisive weight. The Advocate claims 'horse' designates shape and 'white' designates colour. These are distinct categories. To designate a white horse is to designate a compound of shape and colour. If 'horse' designates shape alone, then 'white horse' designates shape plus colour. Since shape plus colour is not identical to shape alone, the designata are distinct. This moves the debate from extension (what is delivered) to intension (what is named). The delivery argument shows the extensions differ; the shape/colour claim explains why the concepts differ fundamentally. Without this ontological premise, the delivery argument is merely an observation about class subsets, vulnerable to the Objector's claim that a white horse is still a horse. The Objector relies on common sense classification; the Advocate relies on precise designation. The shape/colour premise blocks the class membership stock answer by asserting that naming tracks ontological components, not biological categories. It forces the student to see that 'horse' does not mean 'equine animal' but 'shape of a horse'.

  The separability claim reinforces this ontology. The Advocate argues that whiteness and horse can be separated from the white horse. This implies that 'white' and 'horse' exist as independent entities that combine. If they were merely aspects of a single substance, separation would be impossible. This supports the non-identity thesis: the compound is a new entity formed by combining independent attributes. It is not that white horses are not equines, but that the concept 'white horse' is not the concept 'horse'. The separability argument ensures that 'white' is not just a modifier but an independent existent. This is crucial for the Warring States context, where the rectification of names depends on the stability of the entities named. If attributes were not separable, naming would be unstable.

  Therefore, the delivery argument is necessary but insufficient. It establishes the functional difference in naming but requires the shape/colour metaphysics to justify the non-identity claim. Case three proves the point is referential, not syntactic. The substantive thesis surviving verbal ambiguity is not that white horses lack equine nature, but that compound names designate compound entities distinct from their components. The paradox dissolves when we see the Advocate is not denying biological classification but asserting ontological distinctness between attributes and their compounds. The delivery argument shows the distinction in practice; the metaphysics explains it in theory. Without the metaphysics, the delivery argument is sophistry; with it, it is a rigorous claim about the structure of reality and naming. The student must recognize that the argument is not about horses, but about how attributes combine to form designata. The delivery argument sets the puzzle; the metaphysics solves it. The surviving thesis is a claim about the non-identity of compound concepts with their components, grounded in the independence of attributes. This is a hard metaphysical claim, not a linguistic trick. It demands we accept that 'white' and 'horse' are separate entities that combine, making the compound distinct from either part. This is the core of the Advocate's position. The stock answers fail because they treat the argument as either purely linguistic or purely deceptive. The correct reading sees it as metaphysical realism about attributes.

  3. **Marking Scheme**

  1.  **Delivery Argument Limitation (4 marks):** Must argue that the delivery argument fails to distinguish Case 1 (wooden) from Case 2 (white) on its own, as both rely on extensional exclusion.
      *   *Mistake:* Claiming the delivery argument proves the thesis independently or ignoring Case 1.
  2.  **Case 3 Analysis (4 marks):** Must argue that the thesis holds in the unanalysable language, proving the issue is ontological/reference-based, not syntactic.
      *   *Mistake:* Arguing the thesis fails in Case 3 because the word lacks parts.
  3.  **Shape/Colour Premise Role (4 marks):** Must explain that this premise shifts the ground from extension to intension/ontology, blocking the class-membership objection.
      *   *Mistake:* Treating shape/colour as merely linguistic definitions rather than ontological categories.
  4.  **Separability Claim Role (4 marks):** Must explain that separability confirms attributes are independent entities, justifying the compound's distinctness.
      *   *Mistake:* Dismissing separability as irrelevant or purely metaphorical.
  5.  **Substantive Thesis (4 marks):** Must formulate the surviving thesis as ontological non-identity of compounds/components, not biological exclusion.
      *   *Mistake:* Concluding the thesis is sophistry or merely about linguistic ambiguity.

  **Thresholds:** A (17–20), B (13–16), C (9–12).
  **A Requirement:** Must secure full marks on Items 2, 3, and 5.

  4. **Closing Note**

  A genuinely good answer will treat the metaphysics as the engine of the argument, not the delivery logic. Fluent students often glide over the ontological commitments, treating the shape/colour claims as mere definitions. Expect strong students to stumble on Case 3, mistakenly tying the argument to linguistic compositionality rather than reference. The distinction lies in recognizing that the Advocate is making a claim about reality's structure, not language's quirks. If they treat the separability claim as decorative, they cannot reach an A.
