answer: |-
  # ADVERSARIAL COLLABORATION: THE LEGACY OF GOODMAN'S NEW RIDDLE
  **Workshop Document | Draft v1.0**
  **Participants:** [Name withheld] (Entrenchment Defense) & [Name withheld] (Bayesian Dissolution)
  **Date:** October 26, 2023

  ---

  ## PART I: STATEMENT OF COMMON GROUND
  *The following claims are endorsed by both parties as the necessary baseline for this dispute. Signing this list indicates agreement on the formulation of the problem, even if agreement on the solution is absent.*

  1.  **Structure of the Riddle:** We agree that Goodman's "New Riddle" is distinct from Hume's "Old Riddle." Hume questioned the justification of inductive inference *simpliciter* (the move from observed to unobserved). Goodman grants that some inductions are valid and asks: *Which* ones? Specifically, given evidence $E$ compatible with multiple conflicting hypotheses (e.g., "All emeralds are green" vs. "All emeralds are grue"), what distinguishes the projectible hypothesis from the non-projectible one?
  2.  **The Definition of 'Grue':** We agree on the standard definition: An object $x$ is *grue* if and only if $x$ is examined before time $t$ and is green, or $x$ is not examined before time $t$ and is blue. We agree that prior to $t$, all observed green emeralds are equally evidence for "All emeralds are green" and "All emeralds are grue" under purely qualitative descriptions.
  3.  **Failure of Syntax:** We agree that any confirmation theory relying solely on the syntactic structure of evidence and hypothesis (e.g., early Carnapian inductive logic) fails. "Green" and "Grue" are syntactically isomorphic; therefore, a satisfactory account must appeal to features beyond logical form (e.g., semantics, pragmatics, or probabilistic structure).
  4.  **Requirements for a Solution:** A satisfactory account must explain why we are justified in projecting "green" rather than "grue" without begging the question (i.e., without simply defining "projectible" as "what we actually project"). It must account for the *asymmetry* in our treatment of these predicates.
  5.  **Constraints on Formalism:** We agree that the riddle does not rule out formal confirmation theories *wholesale*. It rules out formal theories that are *content-blind*. The dispute is not about whether formalism is possible, but about what parameters (history vs. priors) must be input into the formalism to yield the correct output.
  6.  **The Role of Time:** We agree that the essential "trick" of the riddle involves a time-dependent predicate definition that hides a disjunctive structure. Both sides agree that a solution must explain why time-dependent disjunctions of this sort are generally inadmissible for projection, while standard predicates are not.

  ---

  ## PART II: TABLE OF DISAGREEMENTS
  *For each point of divergence, the positions are phrased charitably to ensure endorsement by the respective author. The "Crux" identifies the specific sub-question resolving the dispute. The "Test" is a case or argument both agree is relevant. "Predictions" record what each side expects the test to demonstrate.*

  | # | Point of Divergence | Entrenchment Theorist's Position | Bayesian Dissolver's Position | The Crux | Agreed Test / Case | Entrenchment Prediction | Bayesian Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Source of Asymmetry** | The asymmetry between "green" and "grue" is constituted by the *actual history of usage*. "Green" is projectible because it is entrenched; "grue" is not because it is not. There is no deeper fact of the matter. | The asymmetry lies in *rational prior probability assignments*. "Green" hypotheses deserve higher priors due to simplicity/naturalness. History is merely heuristic evidence for these priors, not their source. | Is entrenchment *constitutive* of projectibility, or is it merely *evidential* for the objective naturalness that priors track? | **The Alien Community Case:** Imagine a community that has exclusively used "grue/bleen" language since inception. Is their projection of "grue" rational? | Their projection is valid *for them*. Projectibility is relative to linguistic practice. There is no "view from nowhere." | Their projection is irrational *objectively*, even if consistent for them. They have incorrect priors regarding natural kinds. |
  | **2** | **The "Smuggling" Charge** | Bayesian solutions secretly rely on entrenchment. To assign a higher prior to "green" than "grue" without circularity, the Bayesian must appeal to the fact that "green" has worked before. | Priors are constrained by logical simplicity and structural isomorphism with the world, not past success. We can justify $P(Green) > P(Grue)$ via principles of indifference over *natural* properties, not historical ones. | Can a prior probability distribution be justified *a priori* or via structural constraints without referencing the *success history* of the predicates involved? | **The New Predicate Test:** Introduce a novel predicate $F$ with zero entrenchment history but high structural simplicity. Should we project it? | No. Without entrenchment, $F$ is not projectible. We must wait for it to become entrenched. | Yes. If $F$ is sufficiently simple/natural, rational priors license projection immediately, regardless of history. |
  | **3** | **Normativity vs. Description** | The goal is *reflective equilibrium*: codifying the rules implicit in our actual inductive practices. If our practices changed, the logic of projection would change. | The goal is *ideal rationality*: specifying how an agent *ought* to reason given the structure of the world, regardless of actual human habits. | Is the riddle asking for a justification of *our* practices (pragmatic) or a justification of *truth-tracking* (alethic)? | **The Error Case:** Suppose our entrenched predicates turn out to carve nature at joints that are objectively "wrong" (e.g., we project "green" but reality is fundamentally "grue-ish"). | This is unintelligible. If we project it and it works, it is valid. "Wrong" means "fails to project." | This is possible. We could be systematically entrenched in error. Priors should track truth, not habit. |

  ---

  ## PART III: ANALYSIS OF THE GREEN/GRUE DIFFERENCE & DIAGNOSIS

  ### 1. Convergence on the Description of the Difference
  Both parties agree that "green" and "grue" differ in their *projectibility status*. However, they diverge sharply on the *ontology* of that difference.

  *   **The Bayesian Account:** The difference is cashed out entirely in terms of **prior probability assignments** over a hypothesis space. The Bayesian argues that $P(\text{All emeralds are green} | \text{Background}) \gg P(\text{All emeralds are grue} | \text{Background})$. This inequality is justified by appeal to "naturalness," "simplicity," or "objective chance." For the Bayesian, entrenchment is at best a psychological cue that helps humans estimate these priors, but it is not the *ground* of the confirmation relation.
  *   **The Entrenchment Account:** The difference is cashed out in terms of the **inductive history of predicate use**. For the Entrenchment Theorist, "green" is projectible *because* it has been projected. There is no "naturalness" independent of our linguistic practices that can be appealed to without circularity. To appeal to naturalness is to assume the very distinction (green vs. grue) that needs to be proven.

  **Is this a substantive disagreement or a redescription?**
  We diagnose this as a **substantive metaphysical disagreement**, not merely verbal.
  *   If the Bayesian is right, there is a fact of the matter about projectibility that holds even for a community with no history (e.g., a newly created AI or an alien species).
  *   If the Entrenchment Theorist is right, projectibility is essentially a social/historical status. A predicate without a history *cannot* be projectible, regardless of its simplicity.

  ### 2. The "Smuggling" Crux
  A central point of contention is whether the Bayesian can avoid smuggling entrenchment into the priors.
  *   **Entrenchment Theorist's Charge:** When the Bayesian says "Green is simpler than Grue," they are implicitly relying on the fact that our language treats "green" as a primitive. In a "grue" language, "grue" is the primitive and "green" is the disjunctive, complex term. Therefore, the simplicity argument collapses into an entrenchment argument.
  *   **Bayesian's Defense:** Simplicity is not linguistic; it is computational or ontological. A hypothesis requiring a time-parameter ($t$) is objectively more complex in terms of description length or causal structure than one that does not, regardless of which language is spoken.
  *   **Diagnosis:** This turns on whether "complexity" is language-relative. If complexity is language-relative, the Entrenchment Theorist wins (Bayesianism reduces to Entrenchment). If complexity is language-invariant (e.g., based on Turing machine description length of the *world*, not the *word*), the Bayesian wins.

  ### 3. Divergent Aims: Normative, Descriptive, or Justificatory?
  We identify a深层 (deep) divergence regarding the *goal* of solving the riddle.

  *   **Entrenchment Theorist (Pragmatic/Normative):** The aim is to validate *our* inductive practices. The "New Riddle" is a demand to show why *our* specific inductive rules are right for *us*. The solution is a justification of practice via reflective equilibrium. The question is: "Why is *our* projection of green rational?"
  *   **Bayesian (Alethic/Normative):** The aim is to define *ideal* inductive inference. The "New Riddle" is a demand to show how a rational agent distinguishes lawlike from accidental generalizations. The solution is a logic of confirmation. The question is: "What constraints must *any* rational agent satisfy to track truth?"

  **Diagnosis of Verbal Dispute:**
  There is a **partial verbal dispute** here regarding the word "Rational."
  *   For the Entrenchment Theorist, "rational" means "conforming to the rules of our established linguistic community."
  *   For the Bayesian, "rational" means "conforming to the axioms of probability plus truth-conducive priors."
  *   **Resolution:** If the Entrenchment Theorist admits that "entrenchment" is merely our best heuristic for tracking "naturalness," they converge. If the Bayesian admits that "priors" cannot be justified without reference to "past success of similar predicates," they converge. As it stands, they disagree on whether the *source* of normative force is internal (practice) or external (world-structure).

  ### 4. Summary of Remaining Substantive Disagreement
  After stripping away verbal ambiguities regarding "rationality," the following substantive disagreement remains:

  **Does the world dictate which predicates are projectible, or do we?**
  *   **Bayesian:** The world contains natural kinds. "Green" maps to a natural kind; "Grue" does not. Induction works when it maps to these kinds. (Realism about Projectibility).
  *   **Entrenchment:** There are no "natural kinds" accessible independent of our predicate system. "Green" maps to a kind only because we made it so by using it. Induction works because we stabilize our language, not because we match the world. (Pragmatism about Projectibility).

  *This is the fundamental metaphysical rift that the workshop must address.*
