answer: |-
  This is a remarkably precise phenomenological observation. You are describing a state that is distinct from lying, distinct from psychological repression, and distinct from simple ignorance. You are identifying an **epistemic and linguistic barrier** where the moral register is not merely suppressed, but rendered *ontologically invalid* within the workspace of the agent.

  You are correct that standard terms like "moral disengagement" (Bandura) or "the banality of evil" (Arendt) are insufficient. Bandura implies a psychological mechanism of *avoidance* (the guilt is there but bypassed); Arendt implies a *lack of thinking* (cliché replacing thought). Your description is more rigid: it is a **structural incapacity** to process moral data because the system's grammar does not support moral syntax.

  Here is the conceptual carving you requested.

  ### 1. The Near Misses (Why existing terms fall short)

  To isolate the exact concept, we must first clear the field of concepts that look similar but fail your specific criteria.

  *   **Moral Disengagement (Bandura):** This describes psychological mechanisms (euphemistic labeling, displacement of responsibility) used to *avoid* self-sanction.
      *   *Why it fails:* It assumes the moral register is *available* but actively bypassed to protect the ego. In your scenario, the agent isn't protecting their ego; they genuinely cannot parse the input. They aren't saying "it's not wrong"; they are saying "wrong is not a variable in this equation."
  *   **Administrative Evil (Adams & Balfour):** This describes harm perpetrated by people acting within their legitimate roles.
      *   *Why it fails:* This describes the *outcome* and the *context*, but not the *cognitive mechanism*. It tells us *that* they did it, not *how* they speak about it without accessing moral vocabulary.
  *   **Ethical Fading (Tenbrunsel & Messick):** This is the process where the ethical color of a decision fades from view due to framing (e.g., as a business decision).
      *   *Why it fails:* "Fading" implies a gradual psychological dimming. Your description is sharper: it is a **hard boundary**. It is not that the moral dimension is faint; it is that it is *incommensurable*.
  *   **Weberian Instrumental Rationality (*Zweckrationalität*):** Action oriented toward efficient calculation of means to ends.
      *   *Why it fails:* Weber describes the *logic of the action*, not the *linguistic ontology of the agent*. A Weberian bureaucrat could theoretically admit, "This is efficient but evil." Your subject cannot even form that sentence without feeling they have left the realm of professional competence.

  ### 2. The Theoretical Ancestor: Operational Closure

  The most robust established framework for this comes from Systems Theory, specifically **Niklas Luhmann**.

  Luhmann argues that social systems (like law, economy, bureaucracy) are **operationally closed**. They process information only using their own binary code.
  *   The **Legal System** processes *Legal/Illegal*.
  *   The **Economic System** processes *Payment/Non-Payment*.
  *   The **Bureaucratic/Administrative System** processes *Compliant/Non-Compliant* or *Efficient/Inefficient*.

  Crucially, Luhmann argues these systems **cannot process morality** (Good/Bad) directly. If you ask a legal system if a law is "evil," it can only tell you if it is "legal."

  Your observation is the **internalization of this systemic closure by the human agent**. The agent has become so perfectly aligned with the system's code that their cognitive workspace mirrors the system's operational closure. They are not just following rules; their *language* has become operationally closed.

  ### 3. The Coinage: Normative Encapsulation

  While "Operational Closure" describes the system, we need a term for the *human experience* of this closure—the specific psychological-linguistic configuration you described.

  I propose the term: **Normative Encapsulation**.

  #### Definition
  **Normative Encapsulation** is a cognitive-structural state in which an agent's decision-making vocabulary is hermetically sealed within a technical or procedural register, rendering moral predicates (harm, justice, guilt) not merely irrelevant, but **category errors**.

  In this state, the agent does not *deny* the harm (factual accuracy remains intact), but they cannot *evaluate* the harm morally because the "moral module" is walled off from the "operational module." The moral register is treated as external noise, not internal data.

  #### Key Characteristics
  1.  **Factual Fidelity, Moral Agnosia:** The agent can recite the casualty count perfectly ("5,000 units excluded") but experiences a genuine conceptual blank when asked, "Is that bad?" It is not suppression; it is a lack of semantic hooks.
  2.  **Syntax Incompatibility:** Introducing moral language (e.g., "This is cruel") causes cognitive friction. The agent perceives this not as a moral challenge, but as a *professional* confusion ("You are mixing personal feelings with pipeline metrics").
  3.  **Stability:** Unlike "ethical fading," which can fluctuate, this is a stable competence. The agent is often rewarded for maintaining this encapsulation; breaking it is seen as a failure of professionalism.

  ### 4. Boundary Cases (What it is NOT)

  To ensure precision, we must define where Normative Encapsulation stops and something else begins.

  | Phenomenon | Distinction from Normative Encapsulation |
  | :--- | :--- |
  | **Lying / Cover-up** | The liar *knows* the moral register applies and is hiding the truth. The Encapsulated agent believes the technical description *is* the truth. |
  | **Psychopathy** | A psychopath understands moral language but lacks emotional resonance. The Encapsulated agent treats moral language as *semantically invalid* (like asking "what color is jealousy?"). |
  | **Ideological Fanaticism** | A fanatic believes the harm is *good* (moral register is active, but values are inverted). The Encapsulated agent believes the harm is *neutral* (moral register is inactive). |
  | **Negligence** | Negligence is a failure to know the facts. Encapsulation is knowing the facts but lacking the vocabulary to process their weight. |
  | **Arendt's Thoughtlessness** | Arendt's subject uses clichés to avoid thinking. The Encapsulated subject thinks *very hard*, but only within the technical syntax. It is hyper-rationality, not thoughtlessness. |

  ### 5. Breakdown Points (Where it fails)

  Normative Encapsulation is robust, but it is not unbreakable. It relies on the **integrity of the technical map**. It breaks down when the system's own vocabulary fails to account for the reality, forcing a "register crash."

  1.  **The Glitch of Visibility:** When the harm becomes too visceral to be parsed as a variable. (e.g., A compliance officer sees a deportee being dragged away in person, rather than reading "Case Status: Removed"). The sensory input bypasses the technical filter.
  2.  **Systemic Contradiction:** When two technical imperatives clash (e.g., "Efficiency" vs. "Legal Compliance"), the agent is forced to prioritize. This prioritization often requires a value judgment, cracking the encapsulation and forcing a moral choice disguised as a technical one.
  3.  **Whistleblowing:** The act of whistleblowing is often the violent rupture of Normative Encapsulation. The whistleblower forcibly re-introduces the moral register into the technical space, which the system perceives as a virus.

  ### 6. Summary of the Concept

  You are describing a specific form of **Technocratic Ontological Closure**.

  *   **The Mechanism:** The agent adopts the system's ontology (what exists) as their own. In the system, only "variables," "rates," and "compliance" exist. "Suffering" is not a variable; therefore, it does not exist in the workspace.
  *   **The Term:** **Normative Encapsulation**.
  *   **The Diagnosis:** It is not a moral failing in the traditional sense (weakness of will); it is an **epistemic distortion**. The agent is "blind" not because their eyes are closed, but because they are looking through a lens that filters out the wavelength of morality.

  This distinction matters because you cannot cure it by appealing to guilt (Bandura) or imagination (Arendt). You can only cure it by **breaking the encapsulation**—forcing a translation of the technical variables back into human consequences that the agent's cognitive workspace cannot reject as a "category mistake." You have to make the spreadsheet bleed.

  ### 7. Why this matters for your analysis

  If you use **Normative Encapsulation**, you avoid the trap of demonizing the bureaucrat (which lets the system off the hook) or trivializing them as "thoughtless" (which ignores their hyper-competence). It allows you to argue that the *structure of the language itself* is a technology of harm.

  The evil is not in the heart of the agent; it is in the **syntax of the system** that the agent has internalized. This aligns with your intuition that it is "narrower and more structural" than Arendt. It is **Administrative Evil** realized through **Linguistic Closure**.

  **Recommended Terminology for your writing:**
  *   Primary: **Normative Encapsulation**
  *   Secondary (for theoretical grounding): **Internalized Operational Closure** (referencing Luhmann)
  *   Descriptive: **Technical Moral Agnosia** (if you want to emphasize the inability to recognize)

  This gives you a precise tool to dissect the phenomenon without relying on the baggage of "banality" or "disengagement."
