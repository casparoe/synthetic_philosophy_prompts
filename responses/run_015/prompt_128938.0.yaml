prompt: |-
  I recently listened to a philosophy podcast that summarized the debate over Gottlob Frege's private political diary, which he kept in the 1920s and which contained strongly nationalist and antisemitic entries, including claims that Jewish scholars were corrupting German mathematics. The summary said that because these views were confined to an unpublished personal journal and came long after Frege developed his philosophy of arithmetic and logic, they are biographically interesting but philosophically irrelevant. It argued that Frege's logical system is purely formal, and that his anti-psychologism explicitly rejects any subjective or ideological influence on objective thought, so there is no mechanism by which his private politics could have shaped his theory of sense and reference or his logicist program. The podcast concluded that anyone who uses the diary to question Frege's philosophical work is committing a genetic fallacy, and that we should treat his political writings and his logical writings as entirely separate domains. Is this a fair summary of the scholarly discussion? Please go through it point by point—separating what is accurate, what is an oversimplification, and what might be subtly wrong about the relationship between his politics and his philosophy—and please write your answer in American English.
