      *   *Point 6: Treat political and logical writings as entirely separate domains.*
          *   **Accuracy:** Contested.
          *   **Critique:** This is the "compartmentalization" strategy. While methodologically useful for doing logic, it is historically and philosophically contentious when studying Frege as a whole thinker.

