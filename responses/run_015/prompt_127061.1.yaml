  - A blindsight patient who correctly navigates obstacles but sincerely reports, "I don't know what's in front of me": she says there is first-order functional success but no second-order knowledge, so KK fails.
  - A current language model that outputs a correct historical date with a calibrated confidence token of 0.99 that happens to align with its internal uncertainty distribution, but which lacks any architecturally separate monitoring module—only a statistical correlation in the token generation: she says KK is not satisfied, because there is no genuine second-order belief, only a predictive artifact.

  The new case: a human subject with an implanted neural monitor that reads activity in her dorsolateral prefrontal cortex and delivers a subtle tactile signal whenever her belief-forming process crosses a reliability threshold. She has learned to interpret this signal as meaning "I know this." She now reports knowing various propositions—some formed through explicit reasoning, others through rapid intuition—whenever she feels the signal, and her reports are highly accurate. She has no conscious access to the implant's algorithm, and when asked to explain why she knows, she can only cite the presence of the signal.

