answer: |-
  In a conceptual extension of a hospital's night-shift protocol, an infinite sequence of nurses performs handoffs over an hour converging on midnight, where each nurse must toggle a legacy generator switch to confirm presence, incurring a tiny energy cost and mechanical wear with every flip. Each nurse acts on a local deontological duty to verify the system without wasting resources, believing their single toggle is negligible and procedurally required, yet the sequence forms a supertask where the lamp starts off and is flipped infinitely many times before midnight.

  **Deontological Verdict at Step *n*:**
  The deontologist argues that Nurse *n* faces a *prima facie* duty not to waste energy (violated by toggling) but overrides it with a procedural duty to verify safety. Locally, the act is permissible because the cost is marginal and the agent lacks control over the infinite sequence; moral responsibility is bounded by the shift, so no single nurse is culpable for the cumulative waste.

  **The Limit State:**
  Mathematically undefined. Because the sequence 0, 1, 0, 1... has no limit as *t* approaches midnight, the lamp is neither on nor off at the completion of the supertask.

  **Why Accumulation Doesn't Collapse into Consequentialism:**
  Consequentialism requires evaluating the outcome, but here the outcome (the limit state) does not exist. You cannot sum the "goodness" of a non-existent state. Deontology avoids this by evaluating the acts themselves, but it faces a different crisis: if every toggle violates a conservation duty, the infinite sequence constitutes an infinite moral deficit, even if each local act was justified. The moral status of the whole does not supervene on the moral status of the parts because the "whole" lacks causal closure.

  **Structural Feature Doing the Work:**
  **Discontinuity at the limit.** The function describing the lamp's state is discontinuous at *t=1*. The physical state at the limit is not determined by the states preceding it, breaking the causal chain required for standard moral evaluation.

  **Finite Chain Comparison:**
  If the chain is finite (e.g., 1,000 nurses), the limit state is determined (On or Off depending on parity), the energy cost is finite, and the trade-off between safety verification and energy waste is calculable. The moral paradox vanishes because the outcome is coherent.

  **The Subtle Confusion:**
  You are sensing a category error regarding **agency and feasibility**. Moral obligations typically presuppose that agents can causally influence an outcome. In a supertask, no individual agent influences the limit state (since there is no last agent), and the collective produces no determinate state. Distributing obligations across a supertask assumes the "collective action" is a coherent entity capable of bearing moral weight, but infinite regresses dissolve the metaphysical grounding required for responsibility. You cannot have a duty to contribute to a result that metaphysically cannot exist.
