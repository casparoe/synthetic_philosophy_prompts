  Hey —

  Hope the semester wrap-up isnt too brutal on your end. I've been wrestling with that idea we talked about last month regarding the nonidentity problem (NIP) and I think I've got a angle that moves away from the standard reproductive ethics trap. I'm drafting this up as a proposal for the summer workshop (or potentially a diss chapter if it holds water), and I wanted to run the structure by you before I flesh out the full 6k words.

  The basic intuition is this: we know Parfit's setup. You choose policy A, child X is born with a hard life. You choose policy B, child Y is born with a good life. X complains you harmed them; you say "if I chose B, you wouldn't exist." So, no harm to X. Standard stuff. But almost all the literature stays at the micro-level—individual reproductive choices, timing of conception, specific medical interventions.

  I want to push this to the macro-institutional level. Specifically, I'm looking at **institutional path-dependency identity**. The claim is that large-scale institutional choices (like adopting a specific climate-adaptation regime, a tax constitution, or a migration framework) don't just affect the *quality of life* for future people. Over multi-generational horizons, they shape migration patterns, economic sorting, and even mating pools so thoroughly that a different institution literally brings about a different population centuries out. It's not direct causation like skipping a child; it's structural causation through collective life.

  Here's the breakdown of the proposal as I'm seeing it now.

  ***

  ### 1. The Precise Question

  The core question I'm trying to isolate is this: **Does the nonidentity problem dissolve moral duties to preserve specific democratic institutions for future citizens, given that those very institutions partly determine who those citizens are?**

  And linked to that: **Is there a moral asymmetry between harming a specific future person (if they exist) versus substituting one population for another via institutional design?**

  In the standard Parfit case, the "harm" is usually physical or welfare-based (a disability, a resource shortage). Here, the "harm" might be the loss of a specific political structure. Say we have a choice between Institution Alpha (high liberty, lower security) and Institution Beta (high security, lower liberty). Alpha leads to Population A existing in 200 years. Beta leads to Population B existing in 200 years. Population A would say Alpha was worth it. Population B would say Beta was worth it.

  If we adopt the person-affecting view (you can't harm someone unless they are worse off than they would otherwise be), it seems we can't say Beta wronged Population B, because without Beta, Population B wouldn't exist. But intuitively, there seems to be a duty to maintain certain democratic structures regardless of who fills the roles.

  So the question isn't just "did we harm them?" It's "do we owe duties to the *slots* in the future, or only to the *fillers*?" If the institution determines the fillers, does the NIP make the duty to the institution vanish? I want to argue that the institutional context changes the calculus because the institution itself is a precondition for the identity of the agents who could even raise the complaint.

  ### 2. Why Current Answers Leave It Open

  The main reason I think this is distinct from the standard literature is that the causal structure and moral stakes are different.

  Most responses to the NIP try to fix the person-affecting view (like Roberts' person-based principle) or switch to an impersonal view (like the Total View or Average Utilitarianism). But those solutions are designed for cases where the agent is an individual making a choice about a specific child.

  In the institutional case, the agent is often a collective (a legislature, a constitutional convention, a society voting on a climate regime). The "choice" isn't "shall I conceive now or later?" It's "shall we bind ourselves to this constitutional rule?"

  The literature leaves this open because it treats future people as isolated units of welfare. But in political philosophy, future people are also *citizens*. They inherit a status. If I change the constitution, I'm not just changing the welfare level of the future; I'm changing the political identity of the future community.

  Current answers don't account for the **constitutive role of institutions**. In the reproductive case, the parents are external to the child's identity conditions (mostly). In the institutional case, the institution is internal to the citizens' identity. You can't separate "the citizen" from "the constitutional order" as easily as you can separate "the child" from "the timing of conception."

  Also, the time horizon is different. Reproductive NIP is usually one generation out. Institutional path-dependency is centuries. The feedback loops (migration, economic sorting) are complex and systemic. This makes the "same person" condition even harder to satisfy, which should theoretically make the NIP *worse* (more identity shift), but I want to argue it actually makes the duty *stronger* because the institution is the only stable thing across the identity shift.

  Basically, the standard tools assume a static background where agents make choices. Here, the choice changes the background itself. That's why the standard solutions feel like they slide off the surface of the problem.

  ### 3. The Approach: Two Decision Frameworks

  To tackle this, I'm planning to compare two decision frameworks for institutional design. I won't be applying Parfit directly because the macro-level involves collective agency and the institutions themselves are part of the identity conditions.

  **Framework A: The Specific Individuals View (Person-Affecting)**
  This treats future citizens as specific individuals with standing. Under this view, if Institution Alpha creates Population A, we owe duties to Population A. If we switch to Beta, and Population B appears, we have to ask if we harmed Population B. Since Population B wouldn't exist under Alpha, the NIP kicks in hard. If Population B has a life worth living, we haven't harmed them.
  *Prediction:* This framework collapses. It suggests we have no duty to preserve specific institutions because any institution that creates a population with lives worth living is permissible, even if it radically alters the democratic character of the state. This leads to the "absurd" result that we could swap democracies for benevolent autocracies if the autocracy creates a different population that is happy enough.

  **Framework B: The Placeholder Roles View (Institutional/Impersonal)**
  This treats future citizens as placeholder roles within a structure. The duty is not to "John Doe born in 2200" but to "the citizen occupying the role of voter in 2200." The identity of the person is secondary to the identity of the *office* or *status*.
  *Prediction:* This framework resists the NIP. Even if the specific people change due to institutional path-dependency, the duty is to ensure the *role* remains one of democratic agency. The NIP dissolves here because the obligation is attached to the structure, not the biological entity.

  **The Test:**
  I want to test whether nonidentity undermines duty in both or creates an asymmetry.
  My hypothesis is that Framework A fails to capture our intuitions about political obligation, while Framework B captures them but requires a metaphysical shift in how we view "future people."

  Why this rather than just applying Parfit? Because Parfit assumes the moral unit is the person's welfare. In political philosophy, the moral unit is often the *relationship* between citizen and state. If the state changes the identity of the citizens, does it break the relationship? I want to argue that under Framework B, the relationship is preserved even if the individuals are not, because the *terms* of the relationship (rights, duties, participation) are what matter, not the specific biological holders.

  This also lets me bring in collective agency. If the current generation acts as a collective trustee, they are acting on behalf of the *office* of future citizenship, not the specific individuals. This bypasses the NIP because the trustee's duty is to the trust (the institution), not the specific beneficiaries (who are unknown and identity-dependent).

  I need to be careful here not to just slide into rule utilitarianism. The duty to the "role" has to be deontological—about the integrity of the position itself. If the role is "voter", the duty is to ensure there is a voting mechanism, not that the voting produces the best outcome. This is key. The NIP usually attacks welfare comparisons. If the duty is procedural/structural, welfare comparisons (and thus identity dependence) matter less. The legitimacy of the state is not identity-dependent in the same way a person's welfare is. A state can be legitimate for Population B even if Population A would have existed otherwise. The duty is to maintain legitimacy.

  ### 4. Success vs. Failure Conditions

  It's important to be clear about what counts as a win here, since this is a 6-week summer paper and not a book.

  **Success:**
  Success looks like showing that institutional nonidentity changes the moral calculus in a way reproductive nonidentity doesn't. Specifically, I want to demonstrate that there is a **duty to the structure** that survives the identity shift.
  If I can show that the NIP loses its grip when we shift from "harming persons" to "violating institutional trust," that's a win. It would mean we can justify preserving democratic institutions even if those institutions guarantee a different set of people exist than if we switched to authoritarianism (assuming the authoritarianism creates a different population).
  Basically, success is proving an asymmetry: In reproductive cases, NIP blocks harm claims. In institutional cases, NIP does *not* block duty claims because the duty is to the continuity of the political order, not the specific welfare of the identity-dependent individuals.

  **Failure:**
  Failure looks like the argument collapsing back into the standard problem with no new moral work done.
  If it turns out that Framework B is just Impersonal Utilitarianism in disguise, then I haven't solved anything; I've just restated the Total View. The NIP is usually solved by impersonal views, so if my "Placeholder Roles" view is just "maximize welfare across populations," I haven't added value.
  Another failure mode is if the distinction between "person" and "role" collapses. If you can't have a role without a person, and the person is identity-dependent, then the duty to the role might still be vulnerable to the NIP. (e.g., "You owed a duty to the voter role, but since this specific voter wouldn't exist under the other policy, did you really owe it?")
  If I can't defend the metaphysical coherence of "placeholder roles" without sounding like I'm ignoring the people entirely, that's a fail. I need to show that caring about the role *is* a way of caring about people, just not specific identifiable ones.

  ### 5. Scope Check and Risks

  Honest scope check: this is a 6-week summer paper or workshop proposal, not a book. I need to flag what could blow it up.

  **The Empirical Rabbit Hole:**
  The biggest risk is getting dragged into the empirical sociology of migration patterns or demographic engineering. The claim relies on the idea that institutions change mating pools and migration. If I spend too much time trying to prove *that* happens (e.g., citing studies on how tax policy affects birth rates), I'll drown.
  *The Line:* I need to treat the identity-shift premise as a philosophical hypothetical or a widely accepted sociological baseline. I'll state it as: "Granted that institutional choices causally influence population composition over long horizons..." and move on. I don't need to prove the demography, just the normative implication *if* the demography holds.

  **The Metaphysics of Institutions:**
  Another risk is getting stuck on what an institution *is*. Is it a real object? A fiction? If I spend 20 pages on social ontology, I won't get to the ethics.
  *The Line:* I'll treat institutions as normative structures that define roles. I don't need to solve the ontology of corporations or states, just assume that political offices exist as normative positions that can be occupied by different individuals over time.

  **The "Non-Identity" Definition:**
  I need to make sure I don't stretch the definition of NIP too far. Parfit's version is about "same number quality claim." My version is about "structural identity formation."
  *The Line:* I will explicitly define "Institutional Nonidentity" early on and distinguish it from the standard case. I'll acknowledge it's an extension, not a refutation, of Parfit.

  **Time Management:**
  For a 6-week paper, I can't cover both climate adaptation and constitutional amendments in depth.
  *The Line:* I'll pick one primary case study (probably constitutional continuity vs. reform) and use climate only as a secondary example of long-term horizon planning. This keeps the normative stakes clear (democratic legitimacy) without getting bogged down in climate science specifics.

