      *   **Topic:** Presentism in historiography.
      *   **Constraint 1 (Content):** Avoid the usual "bias vs. objectivity" sermon. Focus on the ontological twist: historical facts are partly constituted by current questions. Escaping one's time is like weighing something without a unit.
      *   **Constraint 2 (Form):** Blank verse (unrhymed iambic pentameter).
      *   **Constraint 3 (Length):** About 20 lines.
      *   **Constraint 4 (Voices):** Two interwoven voices (Modern Historian vs. Medieval Annalist).
      *   **Constraint 5 (Rhyme Scheme):** No rhyming between voices until the final couplet, where they *must* rhyme (showing the gap then the unavoidable shared presentism).
      *   **Constraint 6 (Quality):** Historiographically sound (someone who knows the debates should find it right).
      *   **Constraint 7 (Post-Poem Note):** Brief note on liberties taken/contested readings and what evidence would change the mind about escaping temporal standards. No citations/reading lists. No "circle of life" shrug.

  2.  **Deconstruct the Historiographical Concept:**
      *   *Presentism:* The tendency to interpret past events in terms of modern values and concepts.
      *   *The "Weirder Ontological Twist":* This refers to a constructivist or pragmatic view (maybe akin to Oakeshott, Collingwood, or even a strong reading of Foucault/Ankersmit). The idea is that "facts" don't exist independently of the conceptual framework used to retrieve them. You can't ask a question the past couldn't conceive, but you also can't answer it without your own concepts. The prompt suggests a strong constitutive view: the past *becomes* history only through the present's interrogation.
      *   *The Metaphor:* Weighing something without inventing the unit first. (You need a scale to measure weight; you need present concepts to measure history).

