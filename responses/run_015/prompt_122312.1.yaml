answer: |-
  This is a classic case of a slogan doing rhetorical work without carrying philosophical weight. In an EA context, "you're not required to be a saint" is often used to soothe the anxiety of demandingness without specifying *why* the demand stops where it does.

  Here is a menu of five precise theses that slogan could be hiding. You can use this to probe your group: which of these are they actually committing to?

  ### 1. The Satisficing Threshold (The "Hard Ceiling")
  **The Thesis:** Moral reasons have a diminishing marginal return on obligation. Once an agent reaches a threshold of "good enough" (e.g., donating 10%, volunteering X hours), the obligation to do more ceases entirely. Maximizing is not required; satisficing is.
  *   **Trivial or Substantive?** **Substantive.** This rejects classical utilitarianism and maximizing consequentialism. It requires a new normative theory to explain where the threshold sits and why.
  *   **Blocks or Changes Subject?** **Blocks.** It directly addresses the demandingness objection by denying the premise that morality requires maximization.
  *   **Status of Supererogation:** **Conceptually Possible.** Actions above the threshold are genuinely supererogatory (good to do, not bad to omit).
  *   **EA Tension:** High. EA is historically rooted in maximizing expected value. This thesis requires the group to abandon strict maximization.

  ### 2. The Agent-Centered Prerogative (The "Lexical Priority")
  **The Thesis:** Agents are permitted to assign a disproportionate weight to their own interests/projects compared to the impersonal good. Self-interest doesn't trump morality always, but it gets a "multiplier" that prevents total self-sacrifice. (Associated with Samuel Scheffler).
  *   **Trivial or Substantive?** **Substantive.** It modifies the decision procedure of consequentialism. It asserts a structural right to partiality.
  *   **Blocks or Changes Subject?** **Blocks.** It accepts that the impersonal good is high but argues that personal integrity/interests create a protected zone.
  *   **Status of Supererogation:** **Conceptually Possible.** Going beyond the prerogative (sacrificing your protected interests for the greater good) is the definition of saintly/supererogatory action.
  *   **EA Tension:** Moderate. Many EAs accept this implicitly (burnout prevention), but strict utilitarians reject it as irrational bias.

  ### 3. The Psychological "Ought Implies Can" (The "Capacity Limit")
  **The Thesis:** Being a "saint" requires psychological capacities (emotional detachment, endless altruism) that humans do not possess. Therefore, strict maximization is not an obligation because it is psychologically impossible to sustain without agency collapse.
  *   **Trivial or Substantive?** **Substantive (Empirically).** It relies on facts about human psychology. If humans *could* sustain saintliness without breakdown, the obligation would return.
  *   **Blocks or Changes Subject?** **Blocks.** It argues the demandingness objection is factually correct about the theory, but the theory is false because it violates "ought implies can."
  *   **Status of Supererogation:** **Psychologically Hard.** Supererogation isn't conceptually impossible, but it is near the limit of human capacity. The "saint" is someone operating at the absolute edge of psychological feasibility.
  *   **EA Tension:** Low. This fits well with EA's focus on sustainability and cause prioritization (e.g., "you can't help if you're burnt out").

  ### 4. The Moral Minimalist / Baseline View (The "Moral Holiday")
  **The Thesis:** Morality is a system of minimum constraints necessary for social cooperation (don't kill, don't steal, help a bit). "Sainthood" belongs to a different category: *ethics* or *aspiration*, not *duty*. Duty pauses once the baseline is met.
  *   **Trivial or Substantive?** **Substantive.** It changes the definition of "morality" from "what makes the world best" to "what we can demand of each other."
  *   **Blocks or Changes Subject?** **Changes Subject.** It argues the demandingness objection only applies if you conflate *duty* with *ideals*. It dissolves the problem by shrinking the domain of obligation.
  *   **Status of Supererogation:** **Conceptually Distinct.** Supererogation isn't just "extra duty"; it's a different game entirely. Calling it "failed obligation" is a category error.
  *   **EA Tension:** High. EA tends to view morality as comprehensive (covering all resource allocation), not just a baseline for social peace.

  ### 5. The Deflationary Social View (The "Semantic Shift")
  **The Thesis:** "Required" doesn't mean "morally obligatory in the metaphysical sense"; it means "socially enforceable." You aren't a "saint" because no one can blame you for failing to be one.
  *   **Trivial or Substantive?** **Trivial/Verbal.** It reduces moral obligation to social sanction. It doesn't tell you what you *should* do, only what you can be *punished* for.
  *   **Blocks or Changes Subject?** **Changes Subject.** It ignores the normative question ("What should I do?") and answers the sociological question ("What can I be blamed for?").
  *   **Status of Supererogation:** **Conceptually Impossible.** If obligation is just enforceability, then anything non-enforceable is morally neutral. There is no "supererogatory," only "enforceable" and "non-enforceable."
  *   **EA Tension:** Very High. EA is explicitly about doing the *most* good, not just avoiding blame. This thesis renders EA's core normative push inert.

  ### Discussion Questions for Your Group
  To figure out which one your friends are actually using, ask these:

  1.  **The Threshold Test:** "If I could donate 90% of my income without suffering, does the slogan still protect me? If yes, you're arguing for **Moral Minimalism**. If no, you're arguing for **Psychological Limits**."
  2.  **The Blame Test:** "If I choose not to be a saint, am I morally blameworthy? If yes, then I *am* required to be one, and the slogan is false. If no, is that because it's too hard (**Capacity Limit**) or because it's not duty (**Baseline View**)?"
  3.  **The Maximization Test:** "Does this slogan mean we should stop trying to maximize good? If yes, we are **Satisficers**. If no, then what work is the slogan doing?"

  ### Summary Table for Quick Reference

  | Thesis | Trivial or Substantive? | Blocks or Changes Subject? | Supererogation Status |
  | :--- | :--- | :--- | :--- |
  | **1. Satisficing Threshold** | Substantive | Blocks | Conceptually Possible |
  | **2. Agent-Centered Prerogative** | Substantive | Blocks | Conceptually Possible |
  | **3. Psychological Limit** | Substantive (Empirical) | Blocks | Psychologically Hard |
  | **4. Moral Minimalist** | Substantive | Changes Subject | Conceptually Distinct |
  | **5. Deflationary Social** | Trivial (Verbal) | Changes Subject | Conceptually Impossible |

  **Recommendation:** If your group wants to remain EAs, **Thesis 3 (Psychological Limit)** is the most robust. It preserves the goal of maximizing good while acknowledging human constraints, without abandoning the core normative framework. **Thesis 1** is the second best, but requires admitting EA isn't strictly utilitarian. The others tend to undermine the project.
