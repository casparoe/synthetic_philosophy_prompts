prompt: |-
  folks in my effective altruism reading group keep saying "you're not required to be a saint" whenever someone brings up demandingness objections. but im not sure what work that slogan is actually doing. can you lay out the different precise theses it could express -- like that supererogation is just failed obligation, that self-interest gets lexical priority past a point, that moral reasons have a hard ceiling, or even something like "moral holidays" where duty just pauses? for each reading say whether its trivial or actually substantive, whether it blocks the demandingness argument or just changes the subject, and which ones make supererogation conceptually impossible vs just psychologically hard. i want a menu of interpretations i can bring back to the group, not a single answer picked for me.
