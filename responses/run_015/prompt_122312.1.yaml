      *   *Idea 2: The Prerogative View.* You have a right to prioritize your own interests up to a point (Scheffler).
      *   *Idea 3: The Psychological Reality View.* Ought implies can. If it breaks you, it's not obligatory.
      *   *Idea 4: The Social Function View.* Morality is for social coordination, not individual perfection.
      *   *Idea 5: The Supererogation Defense.* Doing more is good, but not doing it isn't bad.
      *   *Idea 6: The Definition Shift.* "Saint" is a category error. Morality doesn't produce saints.

