answer: |-
  **Title:** Non-Causal Dependence and the Paradox of Phenomenal Judgement

  **Research Question**
  Does epiphenomenalism preclude phenomenal knowledge solely because it denies causal powers, or can a non-causal dependence relation satisfy the justification requirement for phenomenal judgement? I will investigate whether metaphysical grounding, rather than causal production, can secure the non-accidental connection required for knowledge. The question focuses specifically on justification, distinct from singular reference.

  **Context and Gap**
  The paradox of phenomenal judgement argues that if experiences cause nothing, judgements about them are unexplained and unjustified. Standard responses either reject epiphenomenalism or accept it while denying we know our experiences (biting the bullet). Both overlook the possibility that the requisite dependence for knowledge need not be causal. By conflating dependence with causation, the paradox assumes a false dichotomy. My proposal separates the dependence requirement from its causal reading, exposing a gap in the sceptical argument that standard replies leave unaddressed.

  **Methodology**
  I will analyse the structure of the dependence requirement distinct from its causal interpretation. Rather than debating epiphenomenalism's consistency with physics, I will focus on the epistemological condition: what makes a judgement answerable to a state? I will compare causal dependence against metaphysical grounding. This avoids empirical disputes about closure principles in physics, focusing instead on conceptual coherence.

  **Outcomes**
  A positive result demonstrates that grounding provides sufficient modal robustness to prevent judgements from being merely coincidental, preserving knowledge without causal powers. A negative result shows that grounding lacks the explanatory directionality required for justification, leaving the sceptical conclusion intact.

  **Failure Conditions**
  The project fails if the dependence problem dissolves into a general scepticism about non-causal knowledge (e.g., mathematics or ethics). If the specific phenomenal case cannot be distinguished from general platonic knowledge, the argument loses its force against the specific paradox of consciousness. I must establish criteria to ensure the phenomenal case remains distinct, otherwise the paper becomes a general epistemological survey rather than a targeted intervention in philosophy of mind.

  **Word Count and Scope**
  6000 words is tight for this metaphysical depth. To ensure rigour, I recommend excluding counterfactual dependence analyses. Attempting both grounding and counterfactuals risks superficial treatment. Focusing exclusively on grounding allows for a detailed examination of constitutive dependence versus causal production. Additionally, I will limit the discussion to justification rather than singular reference, as reference may be secured externally even if justification is not. This narrowing ensures a determinate conclusion within the limit.
