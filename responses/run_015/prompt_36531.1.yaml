answer: |-
  This is a classic stalemate in the philosophy of biology, and your diagnosis is sharper than your friend's, though she identifies the engine that keeps the stalemate running.

  My diagnosis is that the disagreement is **primarily methodological and normative (your view), but it is sustained by an intractable empirical uncertainty (your friend's view).** It is not merely verbal, nor is it a purely substantive empirical question that better microscopes will solve. The "Units of Selection" debate offers a crucial precedent, but its lesson is not that a formal tool will produce a final percentage of adaptation. Rather, the lesson is that formal tools shift the debate from *global metaphysics* to *local modeling conditions*.

  Here is the breakdown of why the debate stalls, why the Units of Selection analogy is instructive but limited, and what would actually count as progress.

  ### 1. Diagnosing the Disagreement: Heuristics vs. Ontology

  You are correct that the residue is about **burden of proof and research aesthetics**. This is often framed in the literature as the distinction between *Empirical Adaptationism* (the claim that most traits are adaptations) and *Methodological Adaptationism* (the claim that we should *test* for adaptation first).

  *   **The Adaptationist Position (The "Design Stance"):** Following Dennett or Williams, your adaptationists argue that because selection is the only known process that generates complex functional order, it is the most productive *null hypothesis*. To assume constraint or drift first is to assume "noise" before "signal." Their metric of success is **explanatory yield**: does this hypothesis generate testable predictions?
  *   **The Pluralist Position (The "Bauplan" Stance):** Following Gould or Lynch, your pluralists argue that the adaptationist heuristic carries a confirmation bias. If you start by looking for a key, you will interpret every hole as a lock. Their metric of success is **error avoidance**: are we minimizing Type I errors (false positives for adaptation)?

  **Why your friend is partially right:** These methodological preferences are not arbitrary; they are Bayesian priors based on an implicit estimate of the world. If you believe selection explains 90% of phenotypic variance, the adaptationist heuristic is rational. If you believe it explains 10%, it is reckless. Therefore, the methodological dispute *feels* empirical because it is driven by differing intuitions about the frequency of adaptation in nature.

  **Why your friend is ultimately wrong:** The question "What fraction of phenotypic structure selection explains?" is likely **globally unanswerable**. Traits are not independent data points; they are historically linked. You cannot sample "traits" randomly from the universe of biology to get a representative percentage. Because the global empirical question is ill-posed, the debate inevitably retreats to the methodological question: *Given we don't know the global frequency, what is the safer bet for scientific practice?*

  ### 2. The Precedent of the Units-of-Selection Debate

  The units-of-selection debate (Gene vs. Individual vs. Group) is the perfect analogy, but we must be precise about how it was "resolved."

  *   **The Problem:** For decades, parties argued past each other about whether group selection was "real."
  *   **The Solution:** It was not solved by finding that group selection accounts for $X\%$ of evolution. It was solved by the **Price Equation** and **Contextual Analysis** (Okasha, Sober, Wilson). These tools allowed biologists to partition variance mathematically. They showed that "group selection" is not a mystical force but a specific statistical structure of covariance between individual fitness and group character.
  *   **The Result:** The debate dissolved not because one side won, but because the terms were formalized. We moved from "Is there group selection?" to "Under what specific parameters does the between-group covariance term exceed the within-group term?"

  **Can this apply to Adaptationism?**
  Your friend hopes for a "Price Equation for Adaptationism" that decomposes a trait's history into percentages of Selection, Drift, and Constraint.
  *   **The Obstacle:** The Price Equation partitions *change* in frequency, not *historical causation* of a static trait. We can measure current selection gradients (Lande-Arnold), but we cannot easily run a regression on deep history to say "40% of this wing shape is due to drift."
  *   **Constraint is not a force:** In the units debate, all parties agreed on the forces (selection, drift); they disagreed on the *level*. In the adaptationism debate, "Constraint" is often the *absence* of variation or a boundary condition, not a parameter in an equation. You cannot easily add "Constraint" to "Selection" to equal 100%.

  Therefore, a formal decomposition of *history* is mathematically dubious. However, a formal decomposition of *evidence* is possible and is where progress lies.

  ### 3. Why the Dispute Persists (and why it should)

  There is a principled reason to expect this dispute to persist: **Asymmetry of Proof.**

  *   It is possible (though difficult) to demonstrate adaptation (e.g., via convergence, experimental evolution, or cost-benefit analysis).
  *   It is logically impossible to prove the *absence* of selection (you cannot prove a negative historical fact).
  *   It is difficult to quantify constraint independently of selection (is a trait constrained because of physics, or because selection never explored that morphospace?).

  Because the null hypothesis (Drift/Constraint) is often a "catch-all" for "we don't know," the Adaptationist can always claim the Pluralist is giving up too soon. The Pluralist can always claim the Adaptationist is fitting noise.

  This is not a failure of biology; it is a feature of historical sciences. The debate persists because it serves a functional role in the ecosystem of science: **Adaptationists drive the search for function; Pluralists drive the search for mechanism and history.** The tension is productive.

  ### 4. What Would Count as Progress?

  If a global empirical answer is impossible, and a historical decomposition is mathematically fraught, what is the analogue to the Price Equation here?

  Progress will not come from answering "How much adaptation is there?" but from establishing **Methodological Conventions regarding Null Models.**

  1.  **Localizing the Debate:** The group should stop asking about "traits" in general and ask about specific *classes* of traits.
      *   *Example:* In molecular evolution, the Neutral Theory (Kimura) successfully shifted the burden of proof. The default became drift; adaptation required specific evidence (e.g., dN/dS ratios > 1).
      *   *Example:* In morphology, the default might remain adaptation, but with stricter comparative controls.
      *   *Progress:* Acknowledging that the "default" changes depending on the level of biological organization (molecular vs. morphological vs. behavioral).

  2.  **Formalizing the Null:** Instead of arguing about "adaptationism," argue about **Null Model Specification**.
      *   A productive move is to require that adaptive hypotheses be tested against specific, quantitative null models (e.g., Brownian motion models of drift in phylogenetic comparative methods), rather than against a vague "non-adaptive" straw man.
      *   If the Adaptationist can show their model fits significantly better than a specific Drift model, they win *that round*. If the Pluralist can show the trait lies on a line of least genetic resistance (G-matrix), they win *that round*.

  3.  **Reframing the Question:**
      *   Stop asking: "Is this trait an adaptation?" (Binary, historical, often unanswerable).
      *   Start asking: "To what extent does current selection maintain this trait, regardless of origin?" (The "Current Utility" vs. "Historical Origin" distinction).
      *   Or: "Is the adaptationist heuristic reliable *in this specific domain*?"

  ### Conclusion

  Your diagnosis is the stronger one. The debate is stalled because it is a **normative disagreement about scientific risk** disguised as an empirical dispute. Your friend is correct that empirical data fuels the fire, but incorrect that more data will extinguish it, because the global empirical question is ill-posed.

  The Units of Selection precedent suggests that progress comes not from a "final answer" but from **formalizing the conditions of the claim**. You do not need a formula that tells you the % of adaptation in a wing. You need a convention that dictates: *"For morphological traits with high heritability, the null model is Brownian Motion (drift/constraint). For behavioral traits with high plasticity, the null model is Optimal Foraging (selection)."*

  If your reading group can move from "Is adaptationism true?" to "Under what specific modeling conditions is the adaptationist heuristic statistically robust?", you will have achieved the same kind of dissolution that the Price Equation brought to the units of selection debate. The disagreement won't vanish, but it will become workable.
