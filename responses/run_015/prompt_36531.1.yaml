prompt: |-
  In my philosophy of biology reading group we have been arguing about adaptationism for two years, and the debate has stalled in a peculiar way. After Gould and Lewontin's spandrels paper, everyone in the room concedes that constraints, pleiotropy, linkage, drift, and exaptation are real and important; everyone also concedes that many traits are genuine adaptations shaped by selection. Nobody defends the naive "Panglossian" position the original critique attacked, yet the adaptationists and the pluralists in the group have not moved an inch. My working hypothesis is that the residue is a dispute about burden of proof and research aesthetics: whether testing adaptive hypotheses is a virtuous default research strategy, on the ground that a risky-but-checkable adaptive story generates more empirical work than an appeal to constraint, or whether it is a standing risk of just-so storytelling that biases the field toward adaptive explanations. On this reading the disagreement is not about biology at all. A friend disagrees: she thinks there is a genuine empirical question here — roughly, what fraction of phenotypic structure selection actually explains as opposed to merely reshuffles — and the debate is stalled only because methods for quantifying constraint and distinguishing adaptation from exaptation are immature. Diagnose the disagreement. Is it substantive, verbal (perhaps over how the word "adaptation" carves up trait history), a disagreement about which questions are worth funding, or my friend's immature-but-real empirical question? Support your diagnosis with what the two sides actually say and do, and consider the precedent of the units-of-selection debate, which arguably was not won by either side but dissolved once formal tools like the Price equation and contextual analysis let the parties state exactly what they were claiming. Would something analogous — a formal decomposition of a trait's selective history, a methodological convention about null models, or something else — count as progress here, or is there a principled reason to expect this dispute to persist?
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Deconstruct the Prompt:**

      *   **Context:** A philosophy of biology reading group arguing about adaptationism for two years.
      *   **Current State:** Stalled. Everyone agrees on the basics (constraints, drift, exaptation exist; some traits are adaptations; no one is a naive Panglossian).
      *   **User's Hypothesis:** The disagreement is *methodological/normative* (burden of proof, research aesthetics, risk of just-so stories vs. productivity of adaptive hypotheses). It's *not* about biology.
      *   **Friend's Hypothesis:** The disagreement is *empirical/substantive* (what fraction of phenotypic structure is due to selection vs. constraint/exaptation). It's stalled because methods are immature.
      *   **Task:** Diagnose the disagreement (Substantive? Verbal? Normative/Funding? Empirical but immature?).
      *   **Requirements:** Support with what sides say/do, consider the precedent of the units-of-selection debate (Price equation, contextual analysis), and evaluate if analogous progress is possible or if persistence is principled.

  2.  **Analyze the Competing Hypotheses:**

      *   *User (Methodological/Normative):* Focuses on *heuristics*. Adaptationism as a research program (Laudan/Kuhn style). Is it a good strategy to *assume* adaptation first?
      *   *Friend (Empirical/Substantive):* Focuses on *ontology/frequency*. How much of the world is actually built by selection?
      *   *Synthesis:* These are often entangled. If you think selection builds 90% of traits, you adopt the adaptationist heuristic. If you think it's 10%, you don't. But the *stall* suggests they agree on the existence of both, just not the *weight* or the *starting point*.

  3.  **Evaluate the "Units of Selection" Precedent:**

      *   *The Debate:* Gene vs. Individual vs. Group selection.
      *   *The Resolution:* Not one side "won." Instead, formal tools (Price Equation, Contextual Analysis) allowed precise specification of *when* and *how* different levels matter. It dissolved the verbal confusion.
      *   *Applicability:* Can we do this for Adaptationism? Can we decompose a trait's history into % Selection, % Constraint, % Drift?
      *   *Challenge:* Selection is a process; constraint is often a lack of process or a boundary condition. Drift is stochasticity. They aren't always additive components in a simple equation. However, Quantitative Genetics (G-matrices, Qst-Fst) attempts this.

  4.  **Diagnose the Disagreement:**

      *   *Is it Verbal?* Partly. "Adaptation" is used loosely (current utility vs. historical origin). But the prompt says they concede exaptation, so they know the difference.
      *   *Is it Substantive/Empirical?* Yes, but likely intractable as a global claim. "What fraction of *all* traits?" is unanswerable. "What fraction of *this* trait?" is answerable but laborious.
      *   *Is it Methodological/Normative?* This is the strongest candidate for the *stall*. It's about *default null models*.
      *   *Verdict:* It is a **methodological disagreement masquerading as an empirical one**, rooted in differing epistemic values (risk vs. reward). The friend is right that it *looks* empirical, but the user is right that the *stall* is about strategy.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the group. Validate both the User and the Friend.
      *   *Diagnosis:* It's a "Methodological-empirical hybrid." The empirical claim (frequency of adaptation) drives the methodological rule (default hypothesis). Since the empirical claim is globally untestable, the debate defaults to methodological preferences.
      *   *Evidence from Sides:*
          *   Adaptationists say: "Start with function, it yields data." (Dennett's "Design Stance").
          *   Pluralists say: "Start with null models (drift/constraint), otherwise you bias results." (Gould's "Bauplan").
      *   *The Units of Selection Analogy:*
          *   Price Equation worked because it mathematically partitioned variance.
          *   Can we partition *causal history*? Phylogenetic comparative methods (PCMs) try this. But "constraint" is hard to quantify as a positive force.
          *   Progress isn't a "final answer" but better null models (e.g., Neutral Theory in molecular bio).
      *   *Why it Persists:* Unlike units of selection (which is about *where* selection acts), adaptationism is about *whether* selection acted. Zero-selection is a valid null, but hard to prove.
      *   *Recommendation:* Shift from "How much adaptation is there?" to "Under what conditions is the adaptationist heuristic reliable?"

  6.  **Refining the "Formal Tool" Question:**

      *   Would a formal decomposition help? Yes, but it already exists (Quantitative Genetics, PCMs). Why hasn't it solved it? Because "Constraint" isn't a parameter in the same way Selection Coefficients are. Constraint is often the *absence* of variation.
      *   So, a "Price Equation for Adaptationism" is conceptually difficult.
      *   Better progress: Methodological conventions on Null Models. (e.g., Require neutral models before adaptive ones).

  7.  **Finalizing the Diagnosis:**

      *   The disagreement is **primarily methodological/normative**, but it is *sustained* by an intractable empirical uncertainty.
      *   The User is more correct about the *nature of the stall*.
      *   The Friend is correct that empirical data *could* shift it, but global data is impossible.
      *   The Units of Selection analogy is instructive but limited. It resolved *conceptual* confusion, not *frequency* disputes.
      *   Progress lies in **localizing** the debate (trait-by-trait) rather than globalizing it.

  8.  **Structure of the Response:**
      *   **Diagnosis:** Hybrid, but weighted toward Methodological/Normative (User's view).
      *   **Analysis of the Sides:** Contrast the "Research Program" view vs. the "Ontological Inventory" view.
      *   **The Units of Selection Precedent:** Analyze why it worked (formalization of levels) and if it applies here (formalization of causes).
      *   **The Role of Formal Tools:** Discuss Quantitative Genetics/PCMs. Why they haven't ended the debate (Constraint is hard to quantify).
      *   **Conclusion/Path Forward:** Shift to local heuristics and null model conventions.

  9.  **Self-Correction/Nuance Check:**
      *   *Check:* Did I dismiss the friend too harshly? *Correction:* Acknowledge that if we knew the empirical answer, the methodological debate would vanish. The empirical uncertainty *fuels* the methodological disagreement.
      *   *Check:* Is "verbal" completely off the table? *Correction:* Mention that "adaptation" often slides between "current utility" and "historical product," but the prompt says they concede exaptation, so this is less central.
      *   *Check:* Is the Units of Selection analogy accurate? *Correction:* Ensure to note that the units debate didn't prove group selection is common, just that it's *possible* and definable. Similarly, we need to define *how to measure* constraint, not just prove it exists.

  10. **Final Polish:** Ensure tone is appropriate for a philosophy of biology reading group (technical but accessible, referencing key figures like Gould, Lewontin, Dennett, Sober, Okasha). (Self-correction: Keep citations general unless specific names add weight).

  *(Self-Correction during drafting)*: I need to be careful about the "Units of Selection" claim. It didn't fully dissolve; it just clarified the conditions. I should mirror that: Adaptationism won't dissolve, but can be clarified.

  *(Final thought on the "Formal Decomposition")*: The Price Equation partitions *change*, not *history*. You can't easily partition "why this trait exists" into additive percentages of drift vs. selection in a deep historical sense. This is a key philosophical point to make.

