answer: |-
  **PREP SHEET: Q&A Survival Guide**
  **Talk:** Diachronic Coherence as Inter-Agent Betting
  **Audience:** Behav Econ (hyperbolic fans) + 2 Epistemologists (Ramsey purists)

  **STRATEGIC CONCESSION (Say this in the first 5 mins)**
  Look, I need to admit upfront: without binding commitment technology, the "Dutch Book" here is counterfactual. My future self can't literally reach back and take money from my present self. I'm not claiming you *will* lose money in a market, but that your choice structure *exposes* you to loss *if* such a market existed. Think of it as a diagnostic for structural vulnerability, not a literal money pump. If I don't say this, the epistemologists will eat me alive on enforceability.

  ---

  **THE OBJECTIONS (Ordered by Damage)**

  **1. The "Game Theory" Kill Shot (DREADED)**
  *Who:* One of the epistemologists (probably the sharper one) or a game-theory savvy econ.
  *They'll say:* "If you treat time-slices as separate agents, you've shifted the domain from decision theory to game theory. In game theory, rational agents aren't required to cooperate (e.g., Prisoner's Dilemma). So violating intertemporal EU isn't 'incoherence,' it's just a non-cooperative equilibrium. You haven't proven it's irrational, just conflicting."
  *My Reply:* "That's the crux, right? But here's the distinction: in a standard PD, agents have *divergent* utility functions. In the intrapersonal case, the 'agents' share a common utility stream, just discounted. If Present-Me and Future-Me are betting against each other, the net utility of the 'body' drops. Rationality here isn't about cooperation between strangers, it's about maximizing the aggregate utility of the entity that houses both agents. If you treat them as totally separate, you lose the 'one body' constraint that makes the loss meaningful. I'm arguing that rationality requires recognizing the ontological link, not just the strategic separation."
  *Soft Spot:* Assumes utility is transferable/aggregateable across time slices without argument.

  **2. The Enforceability Objection**
  *Who:* Formal Epistemologist #2.
  *They'll say:* "A Dutch Book requires a bookie who can enforce the bets. Your future self can't reach back and take money from your present self. Without commitment technology, the book is imaginary. You're confusing logical consistency with physical possibility."
  *My Reply:* "I get that. But coherence arguments are usually about the *structure* of commitments, not the physical execution. If your credences violate probability axioms, you're vulnerable even if no one actually bets against you. Same here. The vulnerability exists in the preference ordering. The fact that physics prevents the transaction doesn't fix the logical inconsistency in the valuation. It just means the inconsistency is costless in this specific physical world, not that it's rational."
  *Soft Spot:* Epistemologists hate "conditional" Dutch Books; they want actual loss.

  **3. Prudence vs. Rationality**
  *Who:* The Epistemologists (their core belief).
  *They'll say:* "You're conflating prudence with rationality. Being imprudent isn't logically inconsistent. It's just bad for you. Ramsey-de Finetti applies to synchronic belief, not diachronic welfare."
  *My Reply:* "Why draw the line at 'now'? If rationality is coherence of attitudes, and my attitudes span time, then diachronic coherence is rationality. Drawing the boundary at the present moment is arbitrary. It's like saying logic only applies to sentences written in blue ink. If I contradict my future self's planned actions based on current info, that's a logical error in the planning system, not just a welfare loss."
  *Soft Spot:* Hard to prove 'now' is arbitrary without begging the question.

  **4. Preference Change is Normal**
  *Who:* Behavioral Econ crowd (they'll feel attacked).
  *They'll say:* "My preferences change. That's not incoherent, that's just being a human in different contexts. You're pathologizing normal adaptation. Hyperbolic discounting is ecologically rational."
  *My Reply:* "I'm not saying preference change itself is irrational. Changing preferences due to new info is fine. I'm targeting preference change due *only* to time passage while holding info constant. That's the specific slice that creates the Dutch Book vulnerability. We're flagging the conflict caused by pure discounting, not the adaptation to context."
  *Soft Spot:* Behav econs deny the distinction between 'info-based' and 'time-based' change.

  **5. Normative Force?**
  *Who:* Anyone bored of the technicalities.
  *They'll say:* "Even if I am incoherent, why should I care? What's the cash value of this constraint? I'm happy being hyperbolic."
  *My Reply:* "The cash value is avoiding intra-personal conflict and regret. It's the difference between a life plan and a series of accidents. If you care about achieving long-term goals, this coherence constraint is the tool that ensures your future self doesn't sabotage your present self's plans. It's the logic of self-binding."
  *Soft Spot:* "Regret" is a feeling, not a logical necessity.

  **6. Information Asymmetry**
  *Who:* Epistemologist trying to find a technical flaw.
  *They'll say:* "Future me knows more. Their credences should differ. You can't Dutch book based on different information sets."
  *My Reply:* "Fair point. The argument holds conditional on common priors or specific updating rules. We're looking at the discounting component, not the learning component. You have to isolate the time-preference from the learning. If we control for info, the inconsistency remains."
  *Soft Spot:* Hard to isolate in practice.

  **7. Descriptive Accuracy**
  *Who:* Behavioral Econ lead.
  *They'll say:* "People don't maximize EU. Your model is descriptively useless. Why build a norm on a psychology that doesn't exist?"
  *My Reply:* "This is a normative claim about coherence, not a descriptive claim about psychology. It tells you what you *should* do to avoid being bookable, not what you *do*. Normative theory isn't invalidated by descriptive failure, otherwise ethics would vanish."
  *Soft Spot:* Audience is mostly behavioral econs who care about description.

  ---

  **FINAL REMINDER**
  If they press hard on #1, don't try to win. Pivot to "It's a modeling choice that highlights the cost of non-commitment." Don't get stuck defending the metaphysics of time-slices.

  \answer{"If you treat time-slices as separate agents, you've shifted the domain from decision theory to game theory. In game theory, rational agents aren't required to cooperate (e.g., Prisoner's Dilemma). So violating intertemporal EU isn't 'incoherence,' it's just a non-cooperative equilibrium. You haven't proven it's irrational, just conflicting."}
