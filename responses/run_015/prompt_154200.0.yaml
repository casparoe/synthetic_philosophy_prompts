answer: |-
  You have hit on one of the most common reactions to the Problem of Old Evidence when first encountering it. Your mathematical instincts are correct: **arithmetically**, Bayes' theorem works fine even if $P(E)$ is high. **Epistemologically**, however, the problem is about what the variables *represent* in a model of rational belief.

  The reason this is considered a "deep" problem rather than a notational accident is that your proposed fixes require changing the definition of the probability functions in ways that create new, significant philosophical problems.

  Here is exactly where your reasoning encounters the standard philosophical counter-arguments.

  ### 1. The Odds Form Trap
  You argued:
  > *If you write Bayes theorem in odds form, the whole evidential boost is carried by the Bayes factor $P(E|H)/P(E|\neg H)$, and $P(E)$ itself never appears.*

  This is mathematically true, but it pushes the problem into the likelihoods. The likelihood $P(E|H)$ is not a property of $H$ alone; it is the probability of $E$ given $H$ **relative to your background knowledge ($K$)**.

  In the case of Mercury:
  *   $K$ includes the fact that Mercury's perihelion precesses ($E$).
  *   Therefore, $P(E | K) = 1$.
  *   Consequently, $P(E | H \land K) = 1$ (Because $E$ is already known to be true, adding $H$ doesn't change that).
  *   Crucially, **$P(E | \neg H \land K) = 1$ as well.**

  Why is the denominator 1? Because Mercury precessed regardless of whether General Relativity is true. The precession is a fact in $K$. Even if GR is false, the precession happened. Since $E$ is certain in the background knowledge, the probability of $E$ is 1 conditional on *any* hypothesis consistent with $K$.

  So, in the odds form:
  $$ \text{Bayes Factor} = \frac{1}{1} = 1 $$
  The odds do not shift. The problem isn't $P(E)$ in the denominator of the standard form; it's that **certainty about $E$ flattens the likelihood ratio.**

  ### 2. The "Uncertainty" Fix ($P(E) = 0.99$)
  You argued:
  > *Nobody is ever literally certain of an observation, so plug in 0.99 instead of 1 and you get your boost back.*

  This approach is known as **Jeffrey Conditionalization**. It is a valid mathematical move, but it creates a historical/epistemological fiction that many Bayesians find unsatisfactory.

  To make the math work ($P(E|H) > P(E|\neg H)$), you have to pretend that at the time Einstein formulated GR, the scientific community was *not* certain of Mercury's precession. You have to assign $P(E) < 1$.

  **The Problem:** Why was $P(E) < 1$?
  *   If $E$ was well-established by Le Verrier in 1859, and Einstein proposed GR in 1915, a rational agent should have had $P(E) \approx 1$ long before 1915.
  *   If you set $P(E) = 0.99$ specifically to allow GR to be confirmed, it looks **ad hoc**. You are tweaking your priors to get the desired confirmation result.
  *   To do this rigorously, you have to construct a **counterfactual prior**: "What would my probability have been *if* I hadn't learned $E$ yet?"
      *   This is the solution proposed by Daniel Garber (1983). He suggests we should condition not on $E$, but on the logical proposition **"H entails E"**.
      *   However, this requires a Bayesian logic that allows agents to be uncertain about logical consequences (i.e., uncertain that $H \to E$). Standard Bayesianism assumes **logical omniscience** (if you believe $H$, and $H \to E$, you must believe $E$). Dropping logical omniscience makes the probability calculus incredibly complex and arguably breaks the standard framework.

  ### 3. The Core Issue: Context of Discovery vs. Justification
  The "Problem of Old Evidence" (formulated famously by Clark Glymour in 1980) highlights a mismatch between Bayesian updating and scientific history.

  *   **Bayesian Updating:** Models how belief should change when you learn *new* information $E$.
  *   **Scientific Reality:** Often, a new theory $H$ is valued because it *systematizes* or *explains* information $E$ we already have.

  In standard Bayesian conditionalization, learning $H$ only changes your belief if $H$ rules out possibilities you previously thought open. If $E$ is already known, $H$ doesn't rule out $E$ (since $E$ is fixed). The "confirmatory power" of GR regarding Mercury comes from the fact that **Newtonian mechanics could not explain it, but GR did.**

  Standard Bayesianism struggles to capture "explanatory power" regarding known facts because it treats $E$ as a fixed constraint on the probability space rather than a target for explanation.

  ### 4. Does Entailment Change Things?
  You asked: *Does the answer change if the hypothesis actually entails the evidence?*

  Actually, entailment makes the problem **worse** under standard assumptions.
  If $H$ entails $E$:
  1.  $P(E|H) = 1$.
  2.  If $E$ is old evidence, $P(E) = 1$.
  3.  As established above, if $E$ is a known fact, $P(E|\neg H) = 1$ (because the fact remains true even if $H$ is false).
  4.  Likelihood Ratio = $1/1$.

  For the likelihood ratio to favor $H$, you need $P(E|\neg H)$ to be **low**.
  *   For *new* evidence: $P(E|\neg H)$ is low because if $H$ were false, we wouldn't expect to observe this new $E$.
  *   For *old* evidence: We *did* observe $E$. So $P(E|\neg H)$ must reflect that observation. If the observation is in the background knowledge, $P(E|\neg H)$ is forced to 1.

  ### Summary: Why it's not trivial
  Your reasoning isn't mathematically wrong, but it treats the probabilities as abstract numbers rather than representations of an agent's state of knowledge.

  1.  **Odds Form:** Fails because known evidence makes both likelihoods equal to 1.
  2.  **Uncertainty:** Fails because it requires pretending we didn't know what we knew (counterfactual priors), which is philosophically costly.
  3.  **The Real Problem:** Standard Bayesianism models **learning that $E$ is true**. It does not naturally model **learning that $H$ explains $E$**.

  Philosophers of science still discuss this because solving it requires either:
  *   Modifying Bayesianism to allow learning logical relations (Garber's solution).
  *   Using counterfactual "what if we didn't know $E$" priors (The historical reconstruction solution).
  *   Arguing that confirmation is not just about probability raising (Alternative theories of confirmation).

  None of these are trivial notational fixes; they are substantive changes to how we model rationality. You spotted the mathematical loophole, but the "problem" is about whether that loophole corresponds to a rational way for humans to actually update beliefs about history.

  **Recommendation:** Look up **Daniel Garber's "Old Evidence and Logical Omniscience" (1983)**. It addresses your "uncertainty" point directly by formalizing how we can be uncertain about the *connection* between $H$ and $E$, even if we are certain about $E$.
