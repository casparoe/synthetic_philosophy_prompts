      *   Result: $P_{new}(H) = P_{old}(H)$. No confirmation occurs.
      *   *Historical Context:* Einstein didn't update his belief in GR *at the time* he discovered GR based on Mercury, because Mercury was already known. Yet, intuitively, Mercury *was* strong evidence for GR. Bayesianism seems unable to capture this historical rationality.

