answer: |-
  You are not confused at all. In fact, you have stumbled upon one of the most persistent and difficult problems in the philosophy of action and metaphysics.

  Your intuition that there is a difference between the **lifeguard** (who has a duty) and the **bystander** (who does not) is shared by most people. However, your analysis of the **counterfactual** (if I had acted, they would be alive) is also logically sound.

  The tension you are feeling is the result of two different ways philosophers and legal scholars try to define "causation." Here is the breakdown of why your intuition clashes with the counterfactual analysis, and whether "duties" are being smuggled in.

  ### 1. The Pure Counterfactual View (David Lewis)
  The standard counterfactual theory of causation (championed by David Lewis) is purely descriptive. It asks: *Did the outcome depend on this event?*

  *   **Definition:** $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.
  *   **Applied to Omission:** If I do not pull the lever ($C$), 5 people die ($E$). If I *had* pulled the lever (not-$C$), they would not have died (not-$E$).
  *   **Conclusion:** Under this strict view, **your inaction is a cause of their death.**

  **The Problem:** This view does **not** smuggle duties in. In fact, it explicitly excludes them. It treats causation as a physical/logical relationship, not a moral one.
  **The Consequence:** This leads to the **"Problem of Proliferation."** If causation is just counterfactual dependence, then the Queen of England caused the death of the starving person in the street (because if she *had* sent money, they would have lived). Your neighbor caused it (if they had donated). The manufacturer of the trolley caused it.

  Most philosophers find this result absurd. We don't want to say everyone in the world is a "cause" of every tragedy they could have theoretically prevented.

  ### 2. The Normative View (Hart & Honoré)
  This view aligns with your original intuition. Philosophers like H.L.A. Hart and Tony Honoré argued that causation by omission is not a purely physical fact; it is partly a **normative** fact.

  *   **The Claim:** An omission is only a "cause" if there was a **reasonable expectation** or a **duty** to act.
  *   **Applied to Lifeguard:** There is a job description/social contract. The omission breaches a norm. Therefore, it is a cause.
  *   **Applied to Bystander:** There is no duty. Therefore, your standing there is just a "non-event," not a causal factor.
  *   **Conclusion:** Your inaction is **not** a cause of their death.

  **Does this smuggle duties in?** No, it puts them right out in the open. This theory argues that you cannot separate causation from norms when dealing with omissions.

  ### 3. The "Causation vs. Responsibility" Distinction
  Many modern philosophers try to save the Pure Counterfactual View by separating **Causation** from **Responsibility**.

  *   **Causation:** Yes, under the counterfactual view, you *did* cause the deaths by not pulling the lever. (Metaphysical fact).
  *   **Responsibility:** However, you are not *blameworthy* or *liable* because you had no duty. (Moral/Legal fact).

  In this framework, the Queen of England *did* cause the starving person's death (counterfactually), but she bears no *responsibility* for it. This allows philosophers to keep causation "pure" (no duties smuggled in) while explaining why we don't blame everyone.

  ### 4. How the Law Handles It
  The law generally rejects the Pure Counterfactual View for omissions because it would create unlimited liability.

  In criminal and tort law, **omission liability requires a duty of care.**
  *   **Lifeguard:** Duty exists $\rightarrow$ Omission is actionable.
  *   **Bystander:** No duty exists $\rightarrow$ Omission is not actionable.

  Legally, your inaction in the Trolley Problem is not treated as the *proximate cause* of the death, precisely because you had no duty to intervene. The law effectively adopts the Normative View, even if metaphysicians debate it.

  ### Answering Your Specific Question
  > *Does the counterfactual analysis of causation just smuggle duties in somewhere, or am I confused about how it works?*

  You are not confused. Here is the direct answer:

  1.  **Strict Counterfactual Analysis does NOT smuggle duties in.** It treats your inaction exactly the same as the Queen of England's inaction. It admits that your inaction is a cause. The "duty" part is handled later, at the stage of **moral responsibility**, not causation.
  2.  **However,** because that result feels intuitively wrong (the "Proliferation Problem"), many philosophers argue that the Counterfactual Analysis is incomplete. They argue that for omissions specifically, **norms are required to identify the cause.**

  ### Summary
  *   **Your Original Assumption:** "Omission requires duty." $\rightarrow$ This is the **Normative Theory** of causation (common in Law and Hart & Honoré).
  *   **Your Counterfactual Insight:** "If I acted, death is prevented." $\rightarrow$ This is the **Lewisian/Counterfactual Theory** of causation.

  The conflict you feel is the conflict between those two theories.
  *   If you accept the **Counterfactual Theory**, you must admit you are a "cause" of the deaths, but deny you are "responsible."
  *   If you accept the **Normative Theory**, you deny you are a "cause" at all.

  Most people prefer the Normative Theory for omissions because it matches our intuition that "letting die" (without duty) is fundamentally different from "killing" or "failing a duty." So, your original instinct was actually philosophically robust!
