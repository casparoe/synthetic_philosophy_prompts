      *   **The Problem of Proliferation:** If CbO is purely counterfactual, *everything* that could have prevented an effect is a cause of that effect. (e.g., The Queen of England didn't send money to the starving person, so she caused their death). This seems intuitively wrong.
      *   **Normative vs. Descriptive:** The user is hitting on a major debate in philosophy of action and metaphysics. Is causation a purely physical/descriptive relation, or does it depend on norms/expectations?
