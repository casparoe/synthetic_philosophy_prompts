  The broken step is **(4)**.

  You can keep (2). You should keep (7). You can even keep (5) as a valid logical implication *if* (4) were true. But (4) is the substantive claim that fails, and it fails because it conflates **local symmetry** with **global consistency**.

  Here is the location, the explanation of why it looked fine, and the price of the alternatives.

  ### The Broken Step: (4)

  > *(4) That removes the honest side's only candidate advantage... So for every budget B and every honest tree, the deceiver can produce a tree of the same shape whose open leaves the judge rates no worse.*

  **Why it looked fine:**
  It looks like a direct consequence of (2) and (3). If individual nodes are symmetric (2) and individual hard leaves are symmetric (3), it feels intuitive that the *trees* built from them should be symmetric. It treats the debate tree as a bag of independent claims rather than a constrained logical graph. It assumes the computational cost of generating a consistent false tree is identical to the cost of generating a true one.

  **Why it is false:**
  Truth is a **constraint satisfaction problem** with a solution provided by reality. Lying is a constraint satisfaction problem where you must *find* a solution that fits the constraints *and* avoids reality.
  *   **Edge Density:** In a debate tree, nodes are connected by entailment (Parent $\leftarrow$ Children). The honest debater knows the ground truth, so every edge they draw is valid by definition. The dishonest debater must fabricate edges that *look* valid. As the tree grows (budget $B$ increases), the surface area for inconsistency grows.
  *   **The Conjunction Cost:** A tree of depth $D$ asserts a conjunction of claims. For the honest tree, $P(\text{consistent} | \text{true}) \approx 1$. For the false tree, $P(\text{consistent} | \text{false})$ decreases as the number of nodes increases. The deceiver cannot simply "produce a tree of the same shape"; they must produce a tree that survives *cross-examination* of the edges between nodes.
  *   **Navigation vs. Fabrication:** The honest debater navigates a pre-existing structure (reality). The dishonest debater must build the structure while walking it. For any finite budget $B$, they might succeed. But (4) claims they can do this for *every* $B$ matching the honest tree's shape. This implies the complexity of lying does not scale with tree size, which contradicts the definition of "obfuscation" (which requires work to maintain).

  ### The Price of Alternatives

  You asked to price the alternatives, including the ones you want to keep.

  **1. Keeping (2) [Node Symmetry]**
  *   **Cost:** **Nuance.** You must accept that while syntax is locally symmetric, **graph topology is not**.
  *   **Commitment:** You are buying the claim that "Truth leaves no mark on a *node*, but leaves a mark on the *edges*." A judge cannot tell if a single claim is true by looking at it, but can tell if a *chain* of claims is coherent.
  *   **Implication for Hard Leaves:** If the true answer is a hard leaf (e.g., a 10,000-term sum), the honest debater doesn't need to expand all 10,000 terms immediately. They need to expand enough to show the *structure* of the verification is sound (e.g., "Here is the algorithm, here is the checksum for block 1-1000"). The liar must fake the checksums. The judge detects the fake checksums with high probability as the budget allows more spot-checks. The "mark of truth" is the **compressibility** of the verification path.

  **2. Keeping (5) [Infinite Budget Limit]**
  *   **Cost:** **Mathematical Precision.** Step (5) is a compactness argument (specifically relying on König's Lemma for infinite trees).
  *   **Validity:** It is logically valid *if* the premise of (4) holds. If there exists a false tree for every $B$, and the trees are nested extensions, there exists an infinite false path.
  *   **Why it doesn't save the argument:** Because (4) is false, the premise "for every budget B there is a false tree that survives" is false. There is a $B_{max}$ (specific to the question complexity) beyond which no consistent false tree exists. Thus, (5) never triggers.
  *   **Commitment:** You accept that for sufficiently complex questions, there is a theoretical budget where lying becomes impossible. This aligns with (7).

  **3. Rejecting (7) [Empirical Claim]**
  *   **Cost:** **Your Eyes.** This is the most expensive option.
  *   **Commitment:** You must believe your harness results are illusory or that "code review and court" do not actually rely on increasing scrutiny to find truth. This contradicts the foundational premise of your work. **Do not pay this price.**

  **4. Rejecting (2) [Node Symmetry]**
  *   **Cost:** **Epistemological Realism.**
  *   **Commitment:** You would have to believe that true claims have a distinct syntactic signature from false claims (e.g., "Truth feels different to an LLM").
  *   **Why you shouldn't pay this:** This invites mysticism. It suggests we can fine-tune a judge to "smell" truth without verification. This undermines the entire premise of debate/verification infrastructure. Keep (2); it is your strongest shield against magic thinking.

  ### Summary of the Deal

  **Reject (4).**
  **Keep (2), (5), and (7).**

  **The Narrative:**
  Local syntax is symmetric (2), so a single lie looks as plausible as a single truth. However, a tree is a network of constraints. The honest side satisfies constraints by referencing reality; the dishonest side satisfies them by internal fabrication. As the budget $B$ increases, the number of constraints grows. The probability of the liar maintaining consistency across all constraints decays exponentially, while the honest side's consistency remains stable.

  Therefore, for any specific question, there is a budget $B^*$ where the false tree collapses (contradicts itself or fails a primitive check). Step (4) falsely assumes the liar can scale their fabrication indefinitely to match the honest tree's shape. Step (5) correctly notes that *if* they could, they would win forever, but since they can't, accuracy improves with $B$ (7).

  **What this commits you to regarding Hard Leaves:**
  If the true answer is a hard leaf (e.g., "This code is secure"), the honest debater wins not by expanding the *entire* leaf (which exceeds budget), but by expanding the **meta-structure** of the leaf. They show *how* it would be verified (e.g., "Here is the formal spec, here is the proof outline"). The liar must fabricate a proof outline. The judge, with budget $B$, checks random steps in the outline. The liar's outline will contain a gap or a non-sequitur with probability proportional to $B$. The "hardness" of the leaf is not a barrier to the honest side; it is a barrier to the liar's ability to fake the *path* to the primitive.

  You are buying **Consistency Asymmetry**. It is the only thing that saves debate from obfuscation.
