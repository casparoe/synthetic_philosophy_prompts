  **UNIVERSITY ANIMAL CARE AND ETHICS COMMITTEE**
  **MEMORANDUM**

  **TO:** Principal Investigators; Facility Managers; Department Heads
  **FROM:** Animal Care and Ethics Committee
  **SUBJECT:** Revised Compliance Framework Regarding Non-Human Property (Policy 88-B)
  **DATE:** 14 October 2023

  **1. DEFINITIONS AND MORAL STATUS**
  For the purposes of this policy, "Protected Interest" refers exclusively to the moral integrity of rational persons. No duty is owed to any non-rational being. Animals are classified as Property. Provisions herein protect persons from the degradation of their own moral character, not animals from suffering. [Marginalia: But the pain is real regardless of who feels it. Response: Pain is a sensory state, not a moral category; without rationality, there is no subject to wrong.]

  **2. ANALOGY SCHEDULE**
  Species are ranked by their capacity to evoke analogies to human virtue. Canines and Equines attract full protection due to unavoidable resemblances to human loyalty and service. Fish receive abbreviated review. Insects, molluscs, and invertebrates fall outside scope for want of any recognisable resemblance to human nature.

  **3. TERMINOLOGY CONTROL**
  To suppress false analogies regarding rodents, mandatory terms include "units," "cohorts," and "consumables." Naming, photographing, or keeping animals after use is prohibited. Language must not imply individuality where none exists morally.

  **4. PERSONNEL ASSESSMENT (HARDENING REGISTER)**
  All staff undergo induction and annual psychological assessment to measure susceptibility to moral coarsening. Scores are logged on the Hardening Register. The objective is to maintain operative sensibility within the range required for dutiful interaction with humanity.

  **5. LAPSE OF RESTRAINT**
  Where an operative is certified as Fully Hardened, character-based restraints lapse. Similarly, if a procedure is performed unwitnessed by any person of unhardened sensibility and is unlikely to reach public knowledge, the ground for restraint is void. [Marginalia: This permits secret torture of the hardened. Response: If the agent's humanity is already extinguished, the law cannot restore it; the animal remains property.]

  **6. JUSTIFICATION OF PAIN**
  Painful experiments are permitted only for purposes of substantial importance to humanity. Merely speculative curiosity does not justify the expenditure of human moral capital. The cost-benefit analysis weighs human knowledge against human character degradation.

  **7. PUBLICITY AND DISTRESS**
  Objections based on public distress shall be managed via communication strategies. The Committee acknowledges that public outrage harms social morality. Protocols causing visible distress must be shielded from public view to prevent the spread of erroneous beliefs regarding animal rights.

  **8. DUTY TO SELF**
  Cruelty is prohibited as a violation of the agent's duty to himself. It destroys the shared feeling that is a prerequisite for morality. This prohibition holds even where no other human is affected, as the agent damages his own rational capacity for virtue. [Marginalia: Finally, a constraint that holds universally. Response: It holds universally for persons; the animal is merely the occasion for the vice, not the victim.]

  **9. LONG-SERVICE RECOGNITION**
  Animals that have laboured long and faithfully (specifically Facility Dogs) are owed something close to gratitude. Retired Facility Dogs shall receive a pension and housing. No provision is made for animals that were never of service, as no analogy to human labour exists.

  **10. COMPLIANCE ATTESTATION**
  Investigators must sign an annual attestation confirming their moral status remains uncorrupted. By signing, the investigator declares that their use of property does not violate their duties to humanity. False attestation is a disciplinary offence against the University.

  **REVIEW CYCLE:** This policy shall be reviewed every five years, or when public sentiment shifts sufficiently to threaten funding.

  **AUTHORIZED BY:** Senior Ethics Committee Member
