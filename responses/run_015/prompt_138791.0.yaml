      *(Self-Correction during drafting)*: I need to be careful not to tell him what to do, but to show him the implications of his beliefs. However, the prompt asks me to "identify which consideration is actually doing the work" and "tell me where my reasons... commit me." This requires taking a stance on the logic, even if not the moral choice.
