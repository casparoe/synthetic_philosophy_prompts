prompt: |-
  I'm drafting this on my phone between shifts so forgive the occasional typo. I'm the volunteer ethics referee for a regional search-and-rescue nonprofit -- sounds like LW armchair stuff but we actually have to pick one extraction per weekend when crew and weather are both tight. We keep recieveing proposals with different numbers of stranded people but roughly comparable risk to the team, and I want a reusable decision proceedure I can actually run in about 15 minutes with zero philosophy background.

  The principle I want baked in is the anti-numbers view: saving five people isn't morally weightier than saving one, it's just that saving one is better than saving none, and if you genuinely can't do both you break the tie with a fair coin or some non-quantitative feature (proximity, who radioed first), never by headcount. Turn this into a real flowchart: ordered gates, what counts as passing each, where it outputs "approve A," "approve B," "reject both," or "stop -- human call needed." Be explicit about the misfires, especially where family ties, unequal crew risk, or resource burn make numbers feel relevant, and say exactly where mechanization has to stop. Make sure one worked case produces an answer you'll probably dislike -- show me the proceedure doesn't care about my gut reaction.

  Run it on three cases:
  1. Four experienced climbers vs one novice, same route difficulty and distance.
  2. Two people in a flooding tunnel (high crew risk, short window) vs five people on a stable ridge (low risk, but burns twice the fuel and blocks the helicopter for Sunday).
  3. One child vs six adults, but extracting the child requires diverting the medical supply chopper that was going to deliver insulin to a separate clinic -- not part of the rescue comparison, but it happens if we choose the child.

  Format: lead with one paragraph bottom-line summary of the flowchart, then the full proceedure with gates and worked examples. Hard cap at 450 words. No bibliography, no citation lists, don't point me to papers -- I need this usable offline and I won't be able to check sources.
