      *   *Hypothesis 3 Focus:* Since the user cares most about H3, I need to give it weight. The "dominance" of tail risks makes historical data irrelevant for *future* safety, even if it describes the *past*. This creates a temporal mismatch. One side looks back (data-rich), one looks forward (data-poor).

