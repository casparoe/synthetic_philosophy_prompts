      *   *Normative implication:* If I *ought* to be closed (4), but I *am* open (2), and the openness is due to structural cognitive limits (reach), then (4) is a bad norm.
      *   *Revision:* Change (4) to "AGM describes the *structure of commitment*, not the *state of belief*." Or "AGM is normative only relative to reach."

      *   *Decision:* The cleanest fix is to reframe (4) as a *regulative ideal* rather than a *constitutive norm*.

      *   *Let's check (1) vs (5) again.* (1) LO is a defect in standard epistemic logic. (5) Logical truths are framework level. These are fine. The defect is the $K$ operator, not the $\vdash$ relation.

      *   *Let's check (3) vs (7).* If counterfactuals share machinery, and counterfactuals usually imply logical omniscience (if $A \to B$ is necessary, and I suppose $A$, do I suppose $B$?), then (7) needs to ensure the "reach topology" applies to counterfactual supposition too. This is actually a strength (unified theory), not a tension, provided the user accepts that counterfactual reasoning is also bounded.

