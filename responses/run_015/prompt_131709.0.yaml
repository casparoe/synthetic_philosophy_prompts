answer: |-
  In two neighboring municipalities, Senior Inspectors Aris and Blake independently certify identical steel support beams for public bridges using the same visual checklist, same training, and same undetectable micro-fracture present in the metal. Aris works under the new "Safety-Net" protocol where an automated load-sensor array immediately intercepts any structural weakness post-certification but pre-opening, triggering a harmless closure and repair, whereas Blake works under the legacy system where certification directly authorizes public use without intermediate verification. When the hidden fracture inevitably compromises both beams, Blake's bridge suffers a catastrophic collapse injuring commuters, leading to Blake's dismissal and criminal negligence charges, while Aris's bridge is safely closed by the sensor array, resulting in Aris receiving a commendation for adhering to the rigorous Safety-Net workflow. Despite making the identical epistemic error and volitional choice to certify, the institutional architecture surrounding Aris decouples their approval from the physical failure, creating a stark divergence in moral and professional assessment where Blake is condemned for the outcome and Aris is exonerated by the process.

  **(a) Contested Belief:** The belief that moral assessment should track individual culpability (choice, intent, and epistemic state) rather than outcomes influenced by institutional luck or systemic safeguards.

  **(b) Structural Feature:** The automated load-sensor array (intermediate verification) that causally interposes between the agent's approval decision and the public's exposure to risk, interrupting the causal chain without altering the agent's input.

  **(c) Verdicts:**
  *   **Control Principle:** Aris and Blake are equally blameworthy; since their control over the decision and information was identical, moral assessment must not diverge based on the buffer's intervention.
  *   **Standard Individualist Outcome-Sensitive View:** Blake is more blameworthy than Aris; while both contributed causally, Blake's contribution completed the chain to harm, whereas Aris's did not, making outcome relevant to assessment.
  *   **Structural Moral-Luck View:** Aris is legitimately less blameworthy (or praiseworthy); optimal institutional architecture redistributes moral risk, making the agent's status dependent on the system's reliability rather than isolated individual contribution.

  **Philosophical Work:** The divergence is driven entirely by the **causal decoupling** feature; the buffer absorbs the risk that would otherwise attach to the agent's choice.

  **Buffer Removal:** If the buffer is removed, the causal chain is restored for Aris; both agents face identical outcomes (collapse) and identical blame (convergence), eliminating the moral luck differential.

  **Control Principle Attack:** A defender of the Control Principle can argue that the scenario demonstrates a flaw in *social judgment*, not moral reality; they would contend that while the buffer is excellently designed for safety, the *praise* given to Aris is a pragmatic reward for systemic compliance rather than a true reflection of moral worth, which remains identical to Blake's, thereby rejecting the inference that the buffer alters moral culpability.
