prompt: |-
  Consider the widespread social practice—particularly visible in service economies, dense urban transit systems, and pedestrian-heavy city centers—whereby locals treat adherence to convention-specific norms (tipping at particular percentages, queuing in precise formations, obeying pedestrian signals even when no cars are present) not merely as legal compliance but as a baseline condition of respectful participation, and where failure by an identifiable outsider is often met with informal sanctions (corrective remarks, service-quality adjustments, social exclusion) that are rarely applied to locals committing the same breach. At the same time, the same communities typically describe these norms as purely cultural, deny that they bind universally, and routinely excuse local violations as products of ignorance, urgency, or personality—while treating comparable outsider violations as revealing deficient moral character or an unwillingness to meet the community halfway. This asymmetry is sometimes institutionalized: for example, some hospitality businesses display cards presenting tipping and queue norms as shared commitments rather than requests, implicitly framing the visitor's choice to enter the space as an opt-in to those commitments, even though no explicit contract is signed and locals are never asked to opt in.

  What philosophical commitments about moral obligation, cultural membership, and the scope of normative demands does this asymmetrical practice presuppose? Reconstruct the implicit theory: does it treat convention-compliance upon entry as a form of tacit contractual consent, as an expression of respect for collective autonomy, or as a derivative duty grounded in harm avoidance? Examine whether the practice presupposes a coherent view of moral universalism versus particularism, whether its treatment of tipping, queueing, and jaywalking presupposes consistent underlying theories or diverges across domains, and identify where the practice is philosophically underdetermined—such that rival frameworks (for instance, an account of reasonable rejectability applied to social rules, or a practice-internal goods view along MacIntyrean lines) could each license it. Then say what would have to change in how these conventions are enforced, explained, or institutionalized if we replaced the implicit view with a strictly universalist harm-based framework that made no distinction between local and outsider obligations.

  Structure your response in the following sections, with approximate lengths:
  - Practice reconstructed (about 150 words): describe the asymmetry concretely and distinguish its legal, institutional, and informal dimensions.
  - Implicit commitments reconstructed (about 500 words): state the underlying view of obligation, membership, and normative scope, distinguishing what the practice strictly presupposes from what merely fits well with it.
  - Cross-domain consistency (about 250 words): check whether tipping, queueing, and jaywalking are governed by the same implicit theory or by divergent ones.
  - Replacement scenario (about 250 words): specify what would have to change in enforcement, explanation, or institutional design under a universalist harm-based replacement.
  - Confidence and weakest point (about 150 words): say how confident you are in the reconstruction overall and single out the specific claim or distinction you are least sure of.
