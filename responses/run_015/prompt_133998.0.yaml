answer: |-
  Decision Tree for Classifying Group Uniformity

  Start Observation: A sequence of people each make a one-off choice between two options; each person can see what the people before them chose; each person also has some private hint about which option is better; and the group ends up nearly unanimous on the option that I privately suspect is worse.

  1. Did everyone receive the exact same strong piece of news or evidence right before choosing?
     - Yes: Go to Question 2.
     - No: Go to Question 3.

  2. Did everyone react to that news in the same way because it was obvious, or because they share the same tastes?
     - Yes (Obvious/Same Tastes): Leaf 1: Common Cause. (Apparent uniformity with no social influence; everyone reacted to the same source).
     - No (Reaction varied privately): Go to Question 3. (Note: If they received same news but reacted differently privately, social influence is likely involved).

  3. Did some people leave the room, stay silent, or refuse to choose before the count started?
     - Yes: Leaf 2: Selection Bias. (Uniformity is an artefact of who is still in the room; dissenters opted out).
     - No: Go to Question 4.

  4. Does the choice become more valuable or useful for you simply because more people are making it?
     - Yes: Leaf 3: Network Effects. (Copying driven by payoff interdependence; the action is better when others do it too).
     - No: Go to Question 5.

  5. Could people see the *reasons* for previous choices, or only the *choices* themselves?
     - Yes (Reasons Visible): Leaf 4: Reason-Based Convergence. (Genuine convergence because people could evaluate each other's arguments).
     - No (Choices Only): Go to Question 6.

  6. If the choices had been made on anonymous slips of paper (hidden from others), would the uniformity disappear?
     - Yes: Go to Question 7. (Social pressure or belief about others is driving the public choice).
     - No: Go to Question 8. (Information or strategic coordination is driving the choice even without scrutiny).

  7. Do the choosers believe that their peers privately support the chosen option?
     - Yes: Leaf 5: Pluralistic Ignorance. (Public agreement that nobody privately believes; people misjudge what everyone else really thinks).
     - No: Leaf 6: Reputational Conformity. (Copying driven by wanting to look competent or to avoid standing out; they know others are faking too).
     - Note: In practice, these two are hard to separate without asking people directly about their beliefs about others. An extra observation needed: A confidential survey asking "Do you think your classmates privately support this?" vs "Do you privately support this?".

  8. If you were told the previous choices were made by a coin flip (random), would you still follow the crowd?
     - Yes: Go to Question 9. (You are following the crowd itself, not the information in the crowd).
     - No: Go to Question 10. (You are following the information you think is in the crowd).

  9. Do people feel they are guessing what everyone else will guess, rather than what is true?
     - Yes: Leaf 7: Higher-Order Herding. (Herding about whether to herd; deferring to their sense of what everyone else is deferring to).
     - No: Leaf 8: Unoccupied/Incoherent. (If you follow random choices but aren't guessing others' guesses, the mechanism is unclear; perhaps pure habit).

  10. If one person publicly announced a very strong private reason against the trend, would the group switch?
      - Yes: Leaf 9: Information Cascade. (Observational learning from actions alone; the queue locks in but is fragile to public info).
      - No: Leaf 10: Unoccupied/Robust Cascade. (Standard theory says cascades should break here. If it doesn't, private hints might be bounded/coarse, or the cascade is reinforced by another mechanism).
      - Note on Fragility: You asked about the fragile-versus-robust distinction. Standard theory says cascades are fragile (Yes). It also says cascades should not lock if private hints can be arbitrarily strong. If you find a case that locks (No) despite strong hints being possible, it suggests the "private hints" were actually coarse (like a coin flip) in practice, or another mechanism is at play.

      - Extra Observation to Separate Leaf 9 (Cascade) from Leaf 7 (Higher-Order): Randomising the order of choosers. In a Cascade, early movers matter most. In Higher-Order Herding, the common expectation matters more than order. If shuffling the order changes the outcome, it is likely Cascade. If the outcome stays the same despite shuffling, it is likely Higher-Order.

  Application to the Staff-Meeting Case

  Case: At a meeting of about thirty teachers, the head announces a new homework policy; three teachers are known to dislike it, but each of them can see that nobody else is objecting, and each also believes privately that the policy will fail for reasons they could each articulate; no one speaks; afterwards, in private, most of the staff say they thought it was a bad idea.

  Tree Path:
  1. Same News? Yes (Head announces). But private reactions varied (some disliked it). -> Go to Q3.
  2. Selection Bias? No (All 30 there, silence is a choice). -> Go to Q4.
  3. Payoff Interdependence? No (Policy value doesn't depend on others accepting it). -> Go to Q5.
  4. Reasons Visible? No (Silence). -> Go to Q6.
  5. Anonymous Ballot? Likely Yes (Privately they admit it was bad). -> Go to Q7.
  6. Peer Belief? Yes ("each of them can see that nobody else is objecting" implies they inferred acceptance from silence). -> Leaf 5: Pluralistic Ignorance.

  Deciding Branch Question: Question 7 (Do the choosers believe that their peers privately support the chosen option?). They believed silence meant support.

  Confirming Observation: At the next meeting, publicly reveal that a significant number of staff privately oppose the policy (e.g., read out anonymous survey results). If this triggers open debate, it confirms Pluralistic Ignorance (the misjudgment was sustaining the silence).

  Other Leaf Not Ruled Out: Leaf 6: Reputational Conformity. The tree cannot fully rule this out because the desire to avoid standing out (Reputational) is likely what caused the misjudgment of peers (Pluralistic). They are intertwined here. To separate them, you would need to know if teachers thought their colleagues were *also* faking silence (Reputational) or truly supported it (Pluralistic). The case description ("believes privately... nobody else is objecting") suggests they thought others supported it, favoring Pluralistic Ignorance.

  \answer{Pluralistic Ignorance}
