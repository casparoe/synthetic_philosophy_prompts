answer: |-
  You are describing a specific pragmatic structure that sits between *lying*, *implicature*, and *performance*. While there is no single universally agreed-upon term that captures the exact "three-part shape" you describe across both cultures, the phenomenon is best carved out as **Ritualized Speech** (or a **Communicative Ritual**).

  In linguistics and anthropology, this overlaps with **Phatic Communion** (in the Japanese case) and **Institutional Speech Acts** (in the Dutch case), but those terms are too narrow. What binds your two examples is not the truth-value of the content, but the **Taboo on Explication**.

  Here is the carving you need for your glossary, structured by definition, distinction, and boundary conditions.

  ### 1. The Definition: Ritualized Speech
  A **Ritualized Utterance** is a speech act where the primary function is to maintain or define a social relationship, rather than to exchange information. It is governed by three constitutive rules:

  1.  **Displaced Uptake:** The hearer is expected to respond to the *social function* (e.g., "we are friends," "we are professionals"), not the *propositional content* (e.g., "we will meet," "this is weak").
  2.  **Plausible Deniability:** The literal content must remain superficially intact. It provides the cover story for the interaction.
  3.  **The Prohibition on Explication:** The social function cannot be named. To explain *why* the words are being said ("I am saying this just to be polite" or "I am saying this bluntly to show respect") destroys the function. It turns a shared ritual into a unilateral transaction.

  **Why this fits your cases:**
  *   **Japanese Host:** The function is *closure/bonding*. The content is *future planning*. Explicating ("I have no intention of meeting") breaks the bond. Taking it literally ("When?") treats a bonding ritual as a planning transaction.
  *   **Dutch Manager:** The function is *professional solidarity/efficiency*. The content is *criticism*. Explicating ("I am blunt because I respect you") patronizes the junior (implies they need emotional management). Taking it personally ("He hates me") treats a professional ritual as a personal attack.

  ### 2. What It Is Not (The Distinctions)
  To teach this, you must distinguish it from the concepts students will confuse it with.

  *   **It is not Lying:** In a lie, the speaker intends the hearer to believe the false content. In Ritualized Speech, the speaker intends the hearer to *recognize* the content as secondary. If the Japanese host is upset that the guest believes a date is set, the host did not intend deception.
  *   **It is not Standard Implicature:** In Gricean implicature (e.g., "It's cold in here" implying "Close the window"), the meaning can usually be made explicit without offense ("It's cold, please close the window"). In Ritualized Speech, making the meaning explicit is the offense.
  *   **It is not "Bullshit" (Frankfurt):** The speaker is not indifferent to truth. They are highly invested in the *truth of the relationship*, even if the *truth of the proposition* is suspended.
  *   **It is not Simple Indirection:** "Can you pass the salt?" is indirect but has no sting if explicated. Ritualized Speech carries a **social risk** if explicated.

  ### 3. The Boundary Cases
  You asked for sharp lines on three specific edge cases. Here is how the definition of **Ritualized Speech** adjudicates them.

  #### Case A: The Outsider (American, Child, Machine)
  *   **The Question:** If the hearer does not share the convention, does the utterance become a lie or a failed ritual?
  *   **The Verdict:** It depends on the **Speaker's Knowledge**.
      *   **If the Speaker knows the hearer is an outsider:** The utterance becomes **Negligent Deception**. By using a ritual code known to be opaque to the hearer, the speaker is effectively lying, because they know the "Displaced Uptake" rule will not trigger. They are responsible for the misunderstanding.
      *   **If the Speaker does not know:** It is a **Misfire** (to use J.L. Austin's term). The ritual fails to launch. The utterance reverts to its literal propositional content for the hearer. The Japanese host is not a liar; the Dutch manager is not a bully. They are simply **culturally mismatched**. The "blame" rule dissolves because the convention was not mutually shared.
      *   **The Machine:** A transcript is always an outsider. It records the *Propositional Content* only. This is why written records of Ritualized Speech are dangerous; they strip the "Displaced Uptake" context, leaving only the literal words, which often look like lies (the invitation) or aggression (the criticism).

  #### Case B: The Half-Hearted Invitation
  *   **The Question:** The host *might* be free on the 14th, but doesn't expect it. Where is the line between Ritual and Vague Invitation?
  *   **The Verdict:** The line is drawn at **Willingness to Accommodate**.
      *   **Ritualized Speech:** If the guest proposes a date, the host *must* find a reason to decline without cancelling the relationship ("Ah, the 14th is difficult, but let's keep in touch"). If the host is trapped, it was a Ritual.
      *   **Vague Invitation:** If the guest proposes a date and the host says "Yes," and the meeting happens, it was a Vague Invitation.
      *   **The Dissolution Point:** The phenomenon dissolves when the speaker is **willing to bear the cost** of the literal uptake. A Ritualized Invitation is designed to be *cheap* for the speaker. If the cost becomes real (they actually have to meet), and they proceed, it retroactively becomes a real invitation. If they balk, it was a Ritual. The ambiguity *is* the feature, but the *reaction to pressure* reveals the category.

  #### Case C: The Written Record (Contract/Email)
  *   **The Question:** A third party reads "We should continue this conversation" in a dispute. Is it a promise?
  *   **The Verdict:** It is **Evidence of Intent, not Commitment**.
      *   Ritualized Speech requires **Co-presence** (physical or synchronous virtual) to sustain the "Prohibition on Explication." The tone, timing, and immediate feedback loop allow the "Displaced Uptake" to happen instantly.
      *   Writing freezes the **Propositional Content** and kills the **Social Function**. In a legal or formal context, Ritualized Speech is treated as **Null**. It is neither a lie nor a promise; it is **Noise**.
      *   **The Rule:** If you write it down, you are implicitly opting out of the Ritual. Writing implies a desire for literal uptake. Therefore, a "warm" email saying "let's meet" is legally and pragmatically weaker than a spoken one, *unless* followed by concrete scheduling. If a third party uses it as a contract, they are committing a **Category Error**, treating a relational signal as a transactional record.

  ### Glossary Entry Draft
  For your module, you might define it this way:

  > **Ritualized Speech (Communicative Ritual)**
  > An utterance where the social function (e.g., maintaining harmony, asserting professionalism) overrides the literal meaning.
  > *   **Rule 1:** The hearer must respond to the function, not the literal content.
  > *   **Rule 2:** Taking the content literally is a breach of etiquette (naive or aggressive).
  > *   **Rule 3:** Explaining the function is a breach of trust (insulting or destructive).
  > *   **Risk:** Fails when participants do not share the cultural convention, or when the interaction is recorded in writing without context.

  This carving allows you to explain why the Dutch student feels the Japanese host is "evasive" (violating Rule 1) and why the Japanese student feels the Dutch manager is "brutal" (violating Rule 2 from their cultural perspective), while showing that both are operating within the same **Ritualized** structure, merely with different rituals (Harmony vs. Efficiency).
