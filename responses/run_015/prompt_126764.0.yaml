      *   *Section 4: The Pluralist Counterfactual.* How would benchmarks change? Focus on uncertainty, negotiation, and context-dependence rather than static accuracy.
      *   *Conclusion:* Summarize the inconsistency. The org chart tries to hedge bets but is constrained by the need to ship products.

