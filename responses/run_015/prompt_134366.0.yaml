prompt: |-
  You're acting as a seasoned philosophy interviewer with deep knowledge of epistemology and formal learning theory. Think carefully and do a quick brainstorm first, then write the actual questions.

  I'm preping for a podcast interveiw next week with a philospher of science — lets call her Dr. K — who defends a view I haven't seen discussed much. She takes the no-free-lunch theorems for search and optimization and applies them not just to machine learning but to Hume's problem of induction. Her core claim is that induction was never "unjustified" in the traditional sense; instead, it's a kind of rational portfolio allocation. Any prior belief distribution that performs well on one class of problems must, by the theorems, perform worse on another class. So the skeptic who asks "why should induction work tomorrow?" is asking the wrong question — the right question is "given our cognitive budget and the problem-space we're actually in, is our inductive strategy Pareto-optimal?" She calls this the "trade-off resolution" of Hume.

  I need eight to ten interview questions that don't just have her restate this. I want at least one that presses the analogy between algorithmic search spaces and human inductive reasoning — specifically, whether human cognition has anything like the uniform distribution over problems that the theorems require. For that one, include a follow-up keyed to the likely reply that "the brain's priors are evolutionarily tuned, not uniform." I also need at least one on the circularity worry: if we justify induction by pointing to its past success, aren't we just doing induction to justify induction? Include a follow-up for her likely move that "the theorems give a non-circular, structural justification because it's about constraint, not empirical track record." Then I want one about practical scientific methodology: what should a working scientist do differently on Monday morning if she accepts this view? Follow up with the answer she's likely to give — probably "nothing, it's a meta-level reframing" — and push back. Finally, I want a sequence that makes her standard deflection — "that's a research program, not an objection" or "you're treating formal results as if they apply outside their domain" — progressively harder to deploy, ending with one question about what kind of empirical finding about human reasoning would actually count against her view.

  Please keep it conversational but sharp. No generic "what drew you to philosophy?" stuff. And don't ask for a reading list or citations — I need questions a listener can follow without a bibliography.
