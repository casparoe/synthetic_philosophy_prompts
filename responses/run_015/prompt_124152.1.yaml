      *   *Claim 3 (Understanding/Reasons):* *Fair Compression, but nuanced.* This is the "Uncomprehending Deference" objection (Hills is key here). The distinction is between "moral understanding" and "mere moral knowledge." However, the TA simplifies the "why it matters" part. Is it about autonomy? Virtue?
