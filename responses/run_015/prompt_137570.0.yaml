prompt: |-
  I chair the staff recognition committee at a 250-bed community hospital. Every month we pick one person for an "above and beyond" award, and every month it goes the same way: someone tells a story, we all feel something, we vote, and then someone asks why the person who quietly did the same thing last month got nothing. I've started reading about supererogation — acts that go past duty, are praiseworthy if you do them and not blameworthy if you don't — and it looks like exactly the distinction we keep fumbling, but I can't hand a rotating ward manger a philosophy paper.

  What I need is a decision procedure we can actually run: the questions in order, in plain words, what counts as a good enough answer to each, where the answer is a firm no, and where the question stops being factual and has to go to a person as a values call. Constraints: it gets run in about twenty minutes by a manager with no training and no time, HR has to be able to defend the outcome if it's grieved, and the output is a one-paragraph citation, so the reasoning has to survive being written down and read out loud.

  Please build in the things I keep tripping over: that "it was clearly the best thing to do" doesn't by itself make something heroic rather than just your job; that praising something in public seems to turn it into an expectation within a few cycles, so what was optional in March is quietly obligatory by June and the person who doesn't do it gets blamed; and the case where the act was only needed because we understaffed something, where an award feels like it's laundering a duty into a gift. Also: half the time we can't tell what actually happened or why the person did it, and sometimes they did a genuinely good thing and then advertised it all over social media.

  Run the finished procedure on three of our real cases: (1) a nurse who came in unpaid on her day off to sit with a dying patient whose family hadn't arrived yet; (2) a porter who spent two hours of his shift hunting down a mislabelled biopsy sample; (3) a senior healthcare assistant who has covered other people's vacancies almost every week for a year, who everyone wants to honor and who I suspect the procedure will tell us not to. Then be straight with me about where it's going to misfire and where a manager just has to use judgment.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a staff recognition committee at a 250-bed community hospital.
      *   **Problem:** Monthly "Above and Beyond" award process is flawed. It relies on emotional storytelling, leads to inconsistency, and causes resentment (why did X get it last month but not Y who did the same?).
      *   **Concept:** User knows about *supererogation* (acts beyond duty, praiseworthy but not obligatory) but needs a practical tool, not theory.
      *   **Requirements:**
          *   Decision procedure (questions in order).
          *   Plain language (for rotating ward managers, no training).
          *   Time limit: ~20 minutes.
          *   Defensibility: HR must be able to defend against grievances.
          *   Output: One-paragraph citation (reasoning must hold up in writing).
          *   Specific constraints/issues to address:
              *   "Best thing to do" $\neq$ Heroic (duty vs. extra).
              *   Public praise creates expectation (the "ratchet effect").
              *   Systemic failure vs. individual heroism (understaffing).
              *   Verification (did it happen? why?).
              *   Self-promotion (social media bragging).
      *   **Task:** Build the procedure, run it on three specific cases, and provide a critique (where it misfires/judgment needed).

  2.  **Deconstruct the Philosophy (Supererogation) into Practice:**
      *   *Supererogatory:* Good to do, not bad to omit.
      *   *Obligatory:* Bad to omit, expected as part of role.
      *   *The Trap:* If we reward it too often, it becomes obligatory (normative shift).
      *   *The Systemic Trap:* Rewarding someone for fixing a broken system excuses the system.

  3.  **Drafting the Decision Procedure (The "Filter"):**
      *   *Goal:* Filter out "Good Job" (Performance) from "Above and Beyond" (Supererogation).
      *   *Structure:* A series of gates. If you fail a gate, stop. If you pass all, award.
      *   *Gate 1: Verification.* Did it happen? (Factual).
      *   *Gate 2: Role Definition.* Was this in their job description/standard expectations? (Duty).
      *   *Gate 3: Systemic Failure.* Did this only happen because the hospital failed? (Systemic vs. Individual).
      *   *Gate 4: Sacrifice/Cost.* Did it cost them something personal? (Time, comfort, risk).
      *   *Gate 5: Motive/Conduct.* Was it done for the right reasons? (Humility vs. Clout).
      *   *Gate 6: Precedent/Ratchet.* Have we rewarded this before? (The "March vs. June" problem).

      *Refining for HR/Manager constraints:* Needs to be binary where possible, with a "Values Call" section at the end. Needs to produce the citation text.

  4.  **Developing the Questions (Iterative Process):**
      *   *Draft 1:* Was it their job? (Too vague).
      *   *Refinement:* "If they hadn't done this, would they be in trouble with their boss?" If Yes -> It's duty. If No -> Potential award.
      *   *Draft 2:* Did they lose time?
      *   *Refinement:* "Did this require personal sacrifice (unpaid time, missed break, physical risk)?"
      *   *Draft 3:* Is the system broken?
      *   *Refinement:* "Was this act required only because a hospital process failed?" (Crucial for the biopsy case).
      *   *Draft 4:* The Ratchet Effect.
      *   *Refinement:* "If we make this the standard, does it break the role?"

  5.  **Addressing Specific User Constraints:**
      *   *Time:* 20 mins. Keep questions tight.
      *   *HR Defense:* Needs written justification at each step.
      *   *Citation:* The procedure must generate the "Why."
      *   *Social Media:* Add a check for "Self-Promotion vs. Patient Focus."

  6.  **Running the Cases:**
      *   *Case 1 (Nurse, unpaid, dying patient):*
          *   Duty? No (off shift).
          *   Systemic? No (family delay is unpredictable).
          *   Sacrifice? Yes (unpaid time).
          *   Verdict: Award.
      *   *Case 2 (Porter, mislabelled biopsy):*
          *   Duty? Maybe (ensure safe transport).
          *   Systemic? **Yes** (Mislabeling is a system error).
          *   Risk: Rewarding this implies mislabeling is normal.
          *   Verdict: No Award (Fix the labeling process). *Self-Correction:* This is tricky. The porter went *above* to fix it. But rewarding it hides the error. I need to make sure the procedure flags the systemic issue.
      *   *Case 3 (HCA, covering vacancies):*
          *   Duty? No (covering others).
          *   Sacrifice? Yes (extra work).
          *   Systemic? **Yes** (Chronic understaffing).
          *   Ratchet? **Yes** (If we reward this, we expect it).
          *   Verdict: No Award (This is a management failure).

  7.  **Critique & Limitations:**
      *   Where will it fail?
      *   Subjectivity in "Sacrifice."
      *   The "Ratchet" is hard to track without a database.
      *   Managers might fear denying awards.
      *   The "Systemic" call is political.

  8.  **Final Polish:**
      *   Tone: Professional, direct, empathetic to the manager's burden.
      *   Format: Clear steps, checkboxes, script for the citation.
      *   Ensure the "Values Call" section is distinct from the "Factual" section.

  9.  **Review against Constraints:**
      *   20 mins? Yes, if focused.
      *   HR defensible? Yes, relies on job descriptions and policy.
      *   Citation ready? Yes, includes a template.
      *   Addresses "March vs June"? Yes, via the Precedent Check.
      *   Addresses "Understaffing"? Yes, via the Systemic Check.
      *   Addresses "Social Media"? Yes, via the Conduct Check.

  10. **Final Output Construction:** (Drafting the response based on the above thought process). *Self-Correction during drafting:* Make sure the distinction between "Good Performance" and "Supererogation" is crystal clear in the intro. Ensure the Porter case doesn't just say "No" but explains *why* (safety culture). Ensure the HCA case is handled delicately because they *are* doing good work, just not *awardable* work without validating understaffing.

  *(Self-Correction on the Porter Case)*: A porter finding a mislabeled sample is actually a safety win. However, if the *cause* was a labeling error by clinical staff, rewarding the porter for cleaning up the mess might disincentivize the clinical staff from labeling correctly. The procedure needs to highlight that distinction. I will frame it as "Systemic Failure vs. Individual Initiative."

  *(Self-Correction on the HCA Case)*: This is the hardest one. The user suspects the procedure will say "no." I need to validate that intuition. If we reward chronic covering, we normalize understaffing. The award should go to the *manager* who fixes the roster, not the *staff* who bleed to cover it.

  *(Refining the "Social Media" constraint)*: If someone brags, does it disqualify? Supererogation doesn't strictly require humility, but for a *hospital award*, public bragging can undermine team cohesion. I'll add a "Conduct" filter regarding professionalism.

  Let's build the "Supererogation Screen."
answer: |-
  Here is a decision procedure designed for your constraints. It translates the philosophical concept of supererogation into an HR-defensible flowchart. It is designed to take 15–20 minutes, produce a written record for HR, and generate the citation text.

  ### The "Above and Beyond" Decision Screen

  **Instructions for the Manager:**
  Complete this form for the nominee. If you answer **NO** to any question in Sections 1–3, the nomination is rejected. You must document the reason. If you pass Sections 1–3, proceed to Section 4 (Values Call). If you pass Section 4, the award is granted.

  #### Section 1: The Facts (Verification)
  *HR Constraint: We cannot reward rumors.*

  1.  **Can you verify the act occurred with specific dates, times, and witnesses?**
      *   [ ] Yes
      *   [ ] No (Stop. Reason: Unverified.)
  2.  **Did the nominee initiate this act voluntarily, without a direct order from a supervisor?**
      *   [ ] Yes
      *   [ ] No (Stop. Reason: Compliance with instruction is duty.)

  #### Section 2: The Duty Boundary (Supererogation Check)
  *Constraint: Distinguishing "Good Job" from "Beyond Duty."*

  3.  **If the nominee had *not* done this, would they have violated policy, job description, or patient safety standards?**
      *   [ ] No (Proceed)
      *   [ ] Yes (Stop. Reason: This is core role expectation. Handle via performance review, not award.)
      *   *Note:* If the answer is unclear, check the roster and job description. If they were on the clock and the task falls under their department's scope, the answer is usually "Yes."
  4.  **Did this act require a personal sacrifice (unpaid time, missed break, physical discomfort, or significant emotional burden)?**
      *   [ ] Yes (Proceed)
      *   [ ] No (Stop. Reason: High performance during paid hours is expected.)

  #### Section 3: The Systemic Filter (The "Understaffing" Check)
  *Constraint: Preventing the hospital from rewarding itself for fixing its own failures.*

  5.  **Was this act necessary only because a hospital process or staffing level failed?**
      *   [ ] No (Proceed)
      *   [ ] Yes (Stop. Reason: This highlights a systemic gap. Refer to Operations/HR to fix the root cause. Awarding this normalizes the failure.)
      *   *Example:* Covering a shift because no one else was scheduled is a staffing failure. Sitting with a dying patient because family is stuck in traffic is not.
  6.  **The "Ratchet" Test: If we award this, can we reasonably expect *every* staff member to do this in the future without blame?**
      *   [ ] Yes (It remains optional for others.)
      *   [ ] No (Stop. Reason: Awarding this makes it an expectation. We cannot turn optional kindness into mandatory policy via public praise.)

  #### Section 4: The Values Call (Judgment)
  *Constraint: Addressing motive and professionalism.*

  7.  **Has the nominee publicly sought credit for this act (e.g., social media bragging, soliciting nominations) in a way that undermines team cohesion?**
      *   [ ] No (Award Recommended)
      *   [ ] Yes (Manager Discretion: Does the public self-promotion outweigh the patient benefit? If Yes, Award. If No, Reject.)

  ---

  ### Output: The Citation Generator
  *If the nomination passes all screens, the manager must complete this paragraph. This text is what HR files and what is read at the ceremony.*

  > "[Name] is recognized for [Specific Act] on [Date]. While our expectation is that all staff [Standard Duty], [Name] voluntarily [Specific Action] which required [Specific Sacrifice, e.g., unpaid time/personal risk]. This act was not required by roster or policy, and addressed a unique situation regarding [Patient/Context] that does not establish a new operational standard. We honor this choice because it was genuinely optional, yet chosen for the benefit of others."

  ---

  ### Running the Cases

  Here is how the procedure handles your three real-world scenarios.

  #### Case 1: The Nurse (Unpaid, Day Off, Dying Patient)
  *   **S1 (Facts):** Verified by charge nurse. Voluntary? Yes (Off shift). **PASS.**
  *   **S2 (Duty):** Violate policy if she didn't? No (She was off clock). Personal sacrifice? Yes (Unpaid time, emotional load). **PASS.**
  *   **S3 (Systemic):** Process failure? No (Family delay is unpredictable, not a hospital error). Ratchet Test? Yes (We can praise this without expecting every nurse to come in on days off). **PASS.**
  *   **S4 (Values):** Self-promotion? Assume No. **PASS.**
  *   **Verdict:** **AWARD.**
  *   **Citation Draft:** "Sarah Jenkins is recognized for remaining with a terminally ill patient on March 12th. While our expectation is that all staff provide compassionate care during scheduled shifts, Sarah voluntarily returned to the unit on her day off to ensure the patient was not alone. This act required unpaid personal time and emotional energy. This act was not required by roster or policy, and addressed a unique family delay that does not establish a new operational standard. We honor this choice because it was genuinely optional, yet chosen for the benefit of others."

  #### Case 2: The Porter (Hunting Mislabelled Biopsy)
  *   **S1 (Facts):** Verified. Voluntary? Yes (Took initiative). **PASS.**
  *   **S2 (Duty):** Violate policy if he didn't? **Debatable.** Porters ensure safe transport. If the sample was lost, is it on him? Likely Yes.
  *   **S3 (Systemic):** Process failure? **YES.** A biopsy should not be mislabelled. The fact that he had to hunt it down means the labeling protocol failed.
  *   **Decision Point:** Question 5 stops this.
  *   **Verdict:** **NO AWARD.**
  *   **Reasoning:** Rewarding the porter for finding the error incentivizes the culture that "errors happen, heroes fix them" rather than "errors must not happen." The citation cannot be written because the "Systemic Filter" failed.
  *   **Action:** Manager must file a safety report on the labeling error, not an award form. The porter should receive a private "thank you" from his director, not a public "Above and Beyond" award.

  #### Case 3: The HCA (Covering Vacancies for a Year)
  *   **S1 (Facts):** Verified. Voluntary? Technically Yes (She says yes when asked). **PASS.**
  *   **S2 (Duty):** Violate policy if she didn't? No (She can say no). Sacrifice? Yes (Extra work). **PASS.**
  *   **S3 (Systemic):** Process failure? **YES.** Covering vacancies *every week for a year* indicates chronic understaffing/rostering failure.
  *   **Ratchet Test:** If we award this, do we expect others to do it? If we say "Yes," we validate understaffing. If we say "No," we admit the award is unsustainable. **FAIL.**
  *   **Verdict:** **NO AWARD.**
  *   **Reasoning:** This is the hardest pill to swallow. The HCA is doing good work, but the *hospital* is failing. Awarding her launders a management failure into a staff gift. It tells other HCAs: "You should also cover vacancies constantly."
  *   **Action:** The Committee Chair (you) needs to take this data to the Director of Nursing. "We have an HCA covering 52 weeks of vacancies. She is ineligible for the award because this is a staffing crisis, not a supererogatory act." Fix the roster. Then, if she does something *else* outside that scope, she can be awarded later.

  ---

  ### Where This Will Misfire (The "Straight Talk")

  You asked for honesty on where the procedure breaks. Here are the three failure points you need to prepare your managers for.

  **1. The "Good Soldier" Paradox (Case 3)**
  The procedure will repeatedly deny awards to your most reliable staff who quietly absorb systemic chaos. They will feel punished.
  *   **The Fix:** You need a parallel track. Create a "Reliability/Consistency" award (quarterly) that is distinct from "Above and Beyond." "Above and Beyond" is for the spike (supererogation); "Reliability" is for the baseline (duty done exceptionally well over time). Do not mix them. If you don't, the procedure will demoralize your backbone staff.

  **2. The Manager's Fear of Conflict (Section 4)**
  Managers hate using the "Self-Promotion" filter. If a staff member posts their good deed on Facebook, the manager will fear being called petty if they deny the award based on Question 7.
  *   **The Fix:** HR must back this explicitly. The policy should state: *"Public solicitation of recognition disqualifies the act from peer-nominated awards."* Make it policy, not manager judgment, so the manager can say, "HR rules prevent this," rather than, "I don't like your bragging."

  **3. The "Ratchet" Memory Hole (Section 3, Q6)**
  The procedure asks: "Have we rewarded this before?" A rotating ward manager won't know. They will award the Porter in March, and then you get the Nurse in June doing something similar, and the cycle restarts.
  *   **The Fix:** You (the Chair) must hold the "Precedent Log." Managers submit the form to *you* before the vote. You check the log of past 12 months. If a similar act was awarded recently, you flag it as a "Ratchet Risk" and send it back for the Values Call. You are the memory the managers lack.

  ### Final Advice on the "Values Call"
  The procedure handles the facts, but Section 4 (Values Call) is where philosophy meets politics.
  *   **When to override the "No":** If the act was technically "duty" but the emotional cost was traumatic (e.g., a staff member held a dying child when policy said they should have stepped back), award it. HR can defend "Compassionate Exception."
  *   **When to override the "Yes":** If the act was truly supererogatory but the staff member is toxic/competitive, deny it. The award is for culture building. If it fuels a toxic high-performer, the cost to the team outweighs the individual merit.

  This tool won't stop the grief entirely, but it shifts the argument from "Why did *she* get it and I didn't?" to "Here is the documented criteria she met that your nomination did not." That is all HR needs to sleep at night.
