  1. Eligibility Logic

  Your eligibility rule relies on a specific conception of political membership and protection. The central moral work is done not by need, nor by movement, but by the breakdown of state protection due to targeted malice. By excluding internally displaced persons (IDPs), you imply that the home state retains some residual obligation or capacity to protect them within its borders; their plight is tragic but domestic. By excluding climate migrants, you distinguish between structural misfortune and targeted violation. Climate change is diffuse; persecution is specific.

  The border crossing is crucial because it signifies the final severance of the social contract. A refugee is not just needy; they are legally orphaned. Their own government is the agent of harm or unwilling to stop it. Therefore, the moral claim is not merely for welfare, but for surrogate citizenship. Your circle acts as a substitute for the protective function of a state. Need alone triggers humanitarian aid; persecution plus border crossing triggers resettlement because return is impossible without risk. This aligns with the 1951 Refugee Convention logic: the unique evil of persecution creates a unique duty for the international community that general destitution does not. The border is the physical marker of that legal rupture. Without it, the duty remains with the home state; with it, the duty transfers to strangers. This explains why identical material destitution is insufficient; the moral injury is the loss of political belonging, not just the loss of material security. You prioritize human agency over natural causation, viewing refugees as exiles from political community rather than merely victims of circumstance. This framework assumes that the international community is a safety net for failed states, not a universal welfare provider. It places weight on the *reason* for displacement. If the cause is natural, the duty is humanitarian aid within the region. If the cause is political persecution, the duty is asylum abroad. Your practice thus rests on a distinction between misfortune and injustice. Misfortune warrants help; injustice warrants protection. By requiring both persecution and border crossing, you ensure that you are remedying a specific political failure—the inability of a citizen to live safely within their own polity—rather than simply alleviating poverty. This makes your sponsorship a political act of inclusion, not just an economic act of charity.

  2. Responsibility Logic

  Your responsibility logic operates on a dual track: charity at the local level, justice at the national level. Locally, you frame duty through voluntarism and capacity. You act because you *can* and *choose to*, not because you are guilty. This treats resettlement as a supererogatory good deed—a gift of spare housing and time. It avoids the contentious claim that your town caused the displacement or owes reparations.

  However, nationally, you invoke fairness and burden-sharing. By insisting on government quotas regardless of local volunteerism, you acknowledge that relying solely on charity creates unfair clustering. It burdens frontline states and willing towns disproportionately. Here, duty arises from systemic equity, not choice. The state must ensure no single community bears too much cost. This implies that while individuals may choose to be saints, the state must ensure no one is forced to be a martyr. The combination suggests that resettlement is a public good that requires mandatory distribution, even if delivery relies on private goodwill. You separate the obligation to provide slots (state justice) from the willingness to fill them (local charity), assuming the former compels the latter without acknowledging the tension if volunteers vanish. The national quota prevents free-riding by other towns, ensuring that the moral cost of hospitality is distributed evenly across the polity, even if the act itself remains voluntary at the individual level. This distinction protects local social cohesion; forced placement might breed resentment, undermining support. Yet, the national mandate acknowledges that without a baseline requirement, the system collapses into inequity. You effectively outsource the coercive power of justice to the state while retaining the moral credit of charity for yourselves. Consequently, your view posits that the state bears the ultimate responsibility for equitable distribution, while citizens bear the responsibility for successful integration. The state guarantees the opportunity; the volunteer guarantees the welcome. This division of labor allows you to demand national action without accepting personal coercion, resting on the hope that state mandates will always find enough willing hearts to execute them peacefully.

  3. Required Versus Merely Compatible

  For the eligibility rule, what is required is the belief that persecution creates a qualitatively different moral claim than general hardship. You must hold that the home state's culpability matters. What is merely compatible is the idea that IDPs are easier to help locally; you could believe they are equally deserving but logistically out of reach. The practice is underdetermined on whether the border is a moral threshold or a legal proxy; you might accept climate refugees if international law changed.

  For the responsibility rule, what is required is the distinction between individual and state agency. You must believe states have duties of justice that individuals do not. What is compatible is the pragmatic view that forced local integration fails; voluntarism ensures success. The practice is underdetermined regarding causation. You deny local causation but demand national fairness. Why doesn't national causation (e.g., foreign policy) drive the quota? You leave open whether the duty is based on capacity alone or historical responsibility. The gap lies in whether local volunteering is a moral duty you encourage or a purely discretionary act you rely upon. If it were a duty, you would pressure neighbors; if discretionary, you cannot demand national quotas based on fairness alone without some underlying obligation to participate. This leaves open whether the national quota is justified by the capacity of the state or the collective duty of its citizens. You assume the state can obligate what individuals will not, without explaining why citizenship transforms capacity into obligation. Ultimately, your practice does not decide if resettlement is a right of the refugee or a gift of the host.

  4. Coherence and What Revision Would Entail

  The rules hang together uneasily. They combine a rights-based eligibility (refugees deserve protection) with a charity-based delivery (locals choose to give it). This works only if supply meets demand. If volunteers dry up, the national quota mandate clashes with the local voluntarism principle.

  If you moved to a purely need-based outlook, eligibility would expand immediately. You would sponsor IDPs and climate migrants, as suffering severity, not cause, would dictate worthiness. Responsibility would shift toward proximity; those closest to the crisis would bear the primary duty, challenging your distance-based voluntarism.

  If you moved to a purely capacity-based outlook, eligibility might remain similar (who can you integrate?), but responsibility would transform. Local housing would become a taxable resource. Instead of volunteering spare rooms, households with capacity would be assigned families proportionally. The national quota would not just be a target but a strict allocation formula based on GDP and housing stock. Voluntarism would vanish, replaced by mandatory contribution, resolving the fairness issue but eliminating the gift aspect that currently defines your circle's identity. The coherence of your current view depends on maintaining the fiction that national mandates do not ultimately require individual coercion. Currently, you rely on a lucky overlap between justice and charity. If that overlap fails, you must choose: either coerce locals to meet justice (abandoning voluntarism) or accept unfairness to preserve choice (abandoning quotas). Your current stance is stable only so long as volunteers remain plentiful enough to satisfy the state's fairness obligations.
