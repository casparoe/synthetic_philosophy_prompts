answer: |-
  **Verdict: Rejection**

  Dr. Voss will reject the proposal for the responsive memorial pylons.

  **The Governing Principle: The Principle of Dedicated Vessels**
  The implicit rule driving Dr. Voss's five prior judgments is the **Principle of Dedicated Vessels**. This principle holds that Nietzsche's three modes of history—Monumental, Antiquarian, and Critical—possess distinct psychological utilities that are destroyed if they share the same physical or institutional container. For history to serve "life" (as she argues in Cases 1 and 3), the Monumental must be untroubled by doubt; for the past to remain "sovereign" (Case 5), the Antiquarian must be untroubled by narrative.

  Voss does not merely require that the *viewer* experience one mode at a time; she requires that the *object itself* be committed to a single mode. In Case 1, she endorsed a monument that *omitted* critical facts, not because the facts didn't exist, but because the *stone* could not hold them. In Case 5, she approved a digital repository only because it lacked narrative-generation features; the *software architecture* itself had to be incapable of synthesis. In Case 4, she rejected adjacent galleries not simply because visitors saw them in one trip, but because the *museum design* unified contradictory histories under one curatorial roof, creating "paralysis." The Pylon proposal fails because it houses all three modes in a single interface. Even if the modes are mutually exclusive in time, the *device* knows all three truths. This potentiality contaminates the Monumental mode (which requires ignorance of the Critical to function as a "great image") and violates the Antiquarian sovereignty of the fragments (which Case 5 dictates must not be tools for narrative generation).

  **The Rival Principle: The Principle of Phenomenological Non-Simultaneity**
  A rival principle that fits her track record equally well is the **Principle of Phenomenological Non-Simultaneity**. This rule posits that historical confusion and "paralysis of the will" occur only when a subject is forced to confront contradictory historical modes *at the same moment*. Under this reading, Voss rejected the museum in Case 4 because the galleries were "meant to be visited together," forcing a simultaneous cognitive burden. She approved the curriculum in Case 3 only when the deconstruction was balanced by construction, ensuring the student wasn't left in a void. She approved the archive in Case 2 because it was "untouched," not because it was in a separate building.

  Applied to the pylons, this rival principle predicts **Approval**. The pylons physically prevent selecting more than one mode at a time. The modes never interact or appear simultaneously. A passerby is never forced to hold the "heroic narrative" and the "critical debunking" in their mind at once. Because the user controls the toggle, the experience remains phenomenologically pure, satisfying the requirement that the viewer not be paralyzed by contradiction.

  **Why the Principle of Dedicated Vessels Governs**
  I am convinced that the **Principle of Dedicated Vessels**, not Phenomenological Non-Simultaneity, is the true engine of Dr. Voss's thinking. The deciding factor is Case 5. In that instance, she approved a digital repository of the *same receipts* proposed for the pylons, but only on the condition that it include "no narrative-generation features." If Phenomenological Non-Simultaneity were her rule, she should have allowed narrative features as long as the user chose to activate them. She did not. She argued that "the document must remain sovereign." This reveals that for Voss, the *capacity* of the vessel to generate narrative corrupts the material, regardless of whether the user engages that capacity.

  Similarly, in Case 1, she argued corrective scholarship belongs in "classrooms, not in stone." She did not say "not visible at the same time as the stone." She insisted on a segregation of media. The Pylon makes the stone (the interface) capable of holding the classroom (the critical mode). This violates the ontological boundary she enforces between the "great image" and the "scholarly correction." The Pylon is a single vessel attempting to be three institutions, which Case 4 proves she views as a "paralysis of the will" inherent to the design, not just the viewing.

  **The Distinguishing Test Case**
  To definitively distinguish the Principle of Dedicated Vessels from the Principle of Phenomenological Non-Simultaneity, the board should present the following case:

  **The Rotating Exhibition Hall:** A proposal to convert a single existing museum gallery into a space that hosts three distinct exhibitions in rotation. Year 1 is a Monumental heroic display. Year 2 is an Antiquarian raw-data display. Year 3 is a Critical debunking display. The exhibitions never overlap in time, and the signage is changed completely between years.

  *   **The Rival Principle (Non-Simultaneity)** predicts **Approval**. At no point does a visitor experience contradictory modes simultaneously. The temporal separation ensures no phenomenological paralysis.
  *   **The Preferred Principle (Dedicated Vessels)** predicts **Rejection**. The *building* remains the same institution. The *walls* that held the heroic myth in Year 1 will hold the debunking of that myth in Year 3. The vessel itself retains the memory of the contradiction, undermining the "sovereignty" of the content in any given year. The institution lacks a unified will, becoming a chameleon rather than a temple.

  Dr. Voss would reject the Rotating Exhibition Hall, confirming that for her, the purity of history depends on the permanent dedication of the container, not merely the temporary experience of the viewer.
