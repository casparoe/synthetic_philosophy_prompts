prompt: |-
  I am a high school junior drafting a hypothetical proposal for a small interdisciplinary fund—enough to support about three doctoral-level researchers for two years—focused on a conceptual problem in archaeology and philosophy of science. Archaeologists routinely infer past beliefs and social institutions from physical remains, yet the inferential pipeline is rarely made explicit, and different stages of that pipeline compete for limited theoretical attention. Rather than a survey of methods, I want a defended agenda: which open conceptual problems in this belief-to-object inference should absorb most of that effort, and why?

  Consider three live lines of work. First, refining taphonomic correction methods specifically for belief-reconstruction: how should we treat the absence of ritual artifacts at pre-literate monumental sites—where spatial architecture survives but iconographic texts do not—without falling into the error of treating absence of evidence as evidence of absence for ritual institutions? Second, constructing formal abductive frameworks, perhaps adapting structures from diagnostic reasoning in medicine or law, to govern the inferential leap from mute material traces—such as standardized vessels or undecorated burial assemblages—to claims about shared normative institutions rather than merely functional economic practices. Third, addressing the material-agency problem in a narrowly belief-focused form: do artifacts merely reflect pre-existing institutions, or do they actively participate in shaping the beliefs they are said to represent, and how should that distinction revise our reconstruction criteria?

  Please prioritize these three for the grant. Defend the ordering with explicit criteria: importance to the reliability of archaeological inference, tractability for philosophers and theoretical archaeologists rather than for empirical field teams alone, and dependency relations—whether resolving one question is upstream of the others. Discuss the central trade-offs, especially whether formalizing abductive logic before correcting for preservation bias risks producing rigorous reasoning about corrupted inputs. Also specify what kind of evidence over the next few years—whether theoretical, methodological, or drawn from a particular class of site—would cause you to reorder them.

  After your argument, provide a brief structured summary as a JSON array of three objects, ordered by rank. Each object must contain exactly these fields: "rank" (integer 1–3), "line_of_work" (string matching one of the three descriptions above), "primary_criterion_for_placement" (string, one sentence), "key_trade_off" (string), and "reordering_trigger" (string).
