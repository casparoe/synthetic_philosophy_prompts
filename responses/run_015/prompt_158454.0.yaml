answer: |-
  ### Priority Agenda for Interdisciplinary Archaeology Fund

  For a two-year grant supporting three doctoral researchers at the intersection of archaeology and philosophy of science, the proposed ordering of research lines is as follows:

  1.  **Refining taphonomic correction methods specifically for belief-reconstruction.**
  2.  **Constructing formal abductive frameworks.**
  3.  **Addressing the material-agency problem.**

  #### Defense of Ordering

  **1. Upstream Dependency and Reliability (Line 1)**
  The primary justification for prioritizing taphonomic correction is **dependency**. In any inferential pipeline, the integrity of the input data is a prerequisite for the validity of the logic applied to it. Archaeologists currently risk committing the *argumentum ad ignorantiam* (appealing to ignorance) when inferring the absence of ritual institutions from the absence of artifacts. Before a formal logic of inference can be constructed (Line 2), researchers must establish the boundary conditions of what counts as valid evidence versus what counts as preservation noise. If this line of work is neglected, subsequent theoretical modeling risks becoming an exercise in rigorous reasoning about corrupted inputs. While taphonomy is often empirical, framing it as a conceptual problem regarding the "epistemology of absence" makes it tractable for philosophers and theoretical archaeologists who can model preservation biases without necessarily leading field teams.

  **2. Tractability and Logical Structure (Line 2)**
  Formal abductive frameworks are ranked second because they depend on the data constraints established in Line 1. Once the reliability of the material record is contextualized, philosophers of science can effectively adapt diagnostic reasoning models from medicine or law to govern the leap from trace to institution. This line is highly **tractable** for the proposed team, as it relies on logical formalization and analogy rather than new fieldwork. It serves as the "processing unit" of the research agenda: it takes the corrected data from Line 1 and produces justified beliefs about past norms. Placing this second ensures that the formal logic is designed to handle the specific types of uncertainty and bias identified in the first phase.

  **3. Ontological Horizon and Scope (Line 3)**
  The material-agency problem is ranked third due to **tractability** and scope constraints. While ontologically fundamental, the question of whether artifacts shape or reflect beliefs is a deep metaphysical debate that rarely yields methodological consensus within a two-year window. Resolving this line of work might ultimately undermine the premise of "reconstruction" assumed in Lines 1 and 2, but pursuing it first risks paralyzing the project in theoretical recursion. It is best positioned as a reflective capstone: once the team has established how to infer beliefs from things (Lines 1 and 2), they are better equipped to critique whether that directionality holds water.

  #### Central Trade-offs

  The central trade-off in this agenda concerns the tension between **logical rigor and data integrity**. There is a significant risk that formalizing abductive logic (Line 2) before correcting for preservation bias (Line 1) produces a sophisticated engine that processes garbage data. A formal framework might confidently infer "no ritual" from "no artifacts" simply because the logic is sound, even if the premise is falsified by taphonomic loss. Conversely, focusing exclusively on taphonomy (Line 1) without a formal inferential framework (Line 2) risks producing clean data that lacks a rigorous justification for interpretation. This agenda prioritizes data integrity (Line 1) to prevent the "garbage in, garbage out" failure mode, accepting that the logical framework (Line 2) must remain flexible enough to accommodate the uncertainties revealed by taphonomic analysis.

  #### Reordering Triggers

