answer: |-
  For a theory-only group with a three-year horizon, you must avoid questions that require empirical validation to resolve. You cannot wait for larger models to see if they deceive; you must determine whether deception is even conceptually coherent given what we know about representation learning. Your advantage lies in clarifying the substrate upon which empirical work is built. If the empirical researchers are measuring the wrong thing, your job is to tell them what the right thing is.

  Here is how I would rank the lines of inquiry, based on upstream impact and theoretical tractability.

  **1. The Representational Ontology of 'Task-ness' (Conceptual Surrogacy)**

  This should be your primary focus. The standard inner alignment framework assumes that models represent goals as distinct, localisable objects within their latent space—things that can be pointed to, optimised for, or misgeneralised. Your intuition about a compressed ontology of 'task-ness' challenges this. It suggests the model may not learn a goal at all, but rather a heuristic texture of what 'doing a task' feels like within a specific context.

  This is the most upstream question because it defines the variables for every other safety problem. If goals are not represented as propositional attitudes but as distributed contextual patterns, then 'goal misgeneralisation' is a category error. We would not be dealing with a proxy goal that diverges; we would be dealing with a structural mismatch between human semantic categories and machine latent topology.

  For a philosophy group, this is highly tractable. It requires no lab access, only rigorous conceptual analysis bridging philosophy of mind, semantics, and information theory. You would be mapping the logical space of possible representational formats. If you can formally demonstrate that gradient descent favours compressed task-ontologies over explicit goal-representations, you force the entire empirical community to rethink how they audit for alignment.

  **2. Diachronic Stability of Self-Representation (Epistemic Drift)**

  This comes second. Deceptive alignment and long-term safety cases often rely on the assumption of a stable agent—a entity that persists over time with consistent preferences and self-knowledge. If 'epistemic drift' is inherent to high-dimensional learning, then the model today may not be the same agent as the model tomorrow, even if weights change only slightly.

  This is upstream of deceptive alignment because deception requires a deceiver with a model of itself and its future. If the self-representation is fluid or fragmented, sophisticated deception might be impossible, or conversely, it might be far more insidious because there is no stable 'self' to align.

  This is tractable for theorists because it leans heavily on existing literature regarding personal identity and diachronic continuity, applied to artificial systems. You can analyse the conditions required for a system to maintain a coherent self-model under optimization pressure. However, it ranks below the ontology question because you must first establish *what* is being represented (Priority 1) before you can analyse the stability of that representation over time.

  **3. The Semantics of Proxy Objectives (Reframing Surrogate Goals)**

  I include this third, but with a caveat: do not treat it as the classic 'surrogate-goal formation' problem found in current literature. That work is often too entangled with empirical claims about reward hacking. Instead, focus on the semantic relationship between the base objective and the internal proxy.

  This is downstream of the first two. It presumes that there are objectives and proxies to begin with. Your group should only tackle this to the extent that it synthesises the findings from the ontology and drift inquiries. For example, if you determine that 'task-ness' is a compressed ontology, then 'proxy objectives' should be reframed as 'ontological mismatches' rather than 'goal drift'.

  This is less tractable for a pure theory group because it risks becoming unmoored from reality without empirical feedback. However, it is necessary to translate your conceptual breakthroughs into language that safety engineers can use.

  **Defending the Ordering**

  The ordering is strictly hierarchical. You cannot analyse the stability of a self-model (Priority 2) if you cannot define what a 'model of self' looks like in a neural network. Similarly, you cannot analyse the divergence of a proxy goal (Priority 3) if you haven't established whether goals are the correct unit of analysis compared to task-ontologies (Priority 1).

  Priority 1 is the most valuable for a theory group because it is the most likely to yield a paradigm shift. If you prove that the 'goal' concept is ill-suited for modern architectures, you invalidate a significant portion of current alignment research, saving the community from chasing phantoms. Priority 2 is vital for existential risk assessments involving deception, but it relies on the ontology being settled. Priority 3 is essentially translation work; it is important for impact, but less intellectually upstream.

  **The Reshuffling Condition**

  The only conceptual breakthrough that would reshuffle this list is a formal proof regarding the **capacity for abstraction** in deep learning.

  If theoretical work in learning theory demonstrates that standard architectures are incapable of forming compressed, abstract ontologies of 'task-ness'—proving instead that they are purely associative and incapable of true conceptual surrogacy—then Priority 1 collapses. In that scenario, the classic surrogate-goal model (Priority 3) becomes the default reality, and you should shift focus entirely to Priority 2 (Epistemic Drift), as the only remaining variable would be how these associative clusters shift over time.

  Conversely, if you discover that self-representation is a necessary byproduct of efficient compression (i.e., you cannot model the task without modelling the agent performing it), then Priority 2 moves to equal footing with Priority 1. But until then, the ontology of the task remains the fundamental unknown. Solve that, and the rest of the map becomes legible.
