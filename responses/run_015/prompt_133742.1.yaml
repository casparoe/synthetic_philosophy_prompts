answer: |-
  You have independently reconstructed one of the most persistent and rigorous debates in the philosophy of mind and value theory. The impasse you describe is not a personal failure of analysis; it is the central structural problem of **hedonics**.

  Here is the breakdown of the established names, the relationship between your two "families" of failure, the existing alternatives you haven't yet encountered, and a verdict on whether they are aspects of a single problem.

  ### 1. The Name of the Difficulty

  The general problem you are facing is known as the **Heterogeneity Problem** (or the **Diversity Problem**) of pleasure.

  It asks: *In virtue of what do all pleasurable experiences count as pleasurable?*

  The specific deadlock you have encountered—between a "residue" and a "stance"—is the debate between **Feeling Theories** (Qualitative Hedonism) and **Attitudinal Theories** (Propositional Hedonism).

  ### 2. Analysis of Your Two Families of Failure

  You asked whether these two failures are aspects of a single problem or two distinct ones. They are **distinct logical failures** that stem from a **single category mistake**.

  #### Family A: The "Residue" (Feeling Theory)
  *   **Established Name:** **Qualitative Hedonism** or **Sensory Theory of Pleasure**.
  *   **The Candidate:** Pleasure is a distinct phenomenological quality (a "hedonic tone") that accompanies sensations, like a sweet taste accompanies sugar.
  *   **The Failure You Identified:** The **Heterogeneity Objection**.
      *   *Philosophical Context:* Gilbert Ryle and G.E.M. Anscombe famously argued that there is no "tingle" common to solving a crossword, drinking water, and listening to music. If you subtract the specific sensory content, nothing remains.
      *   *Why it fails:* It treats pleasure as a *noun* (a thing you feel) rather than a *mode* of feeling. As you noted, stripping away the coldness of the water leaves nothing.
  *   **Boundary Case:** A "phantom limb" itch that feels exactly like a real itch but lacks the bodily location. Feeling theorists struggle to explain why the real itch might be unpleasant and the phantom one merely annoying, if the "feeling" is identical.

  #### Family B: The "Stance" (Attitudinal Theory)
  *   **Established Name:** **Attitudinal Hedonism** (championed by Fred Feldman and Chris Heathwood).
  *   **The Candidate:** Pleasure is not a feeling, but a **pro-attitude** toward a state of affairs. To be pleased is to "take satisfaction in" or "be glad that" something is happening.
  *   **The Failure You Identified:** The **Extensional Objection** (or the Problem of Non-Hedonic Pro-Attitudes).
      *   *Philosophical Context:* As you noted, one can have a pro-attitude toward grief (wanting to feel it fully) or anger (righteous indignation). Conversely, one can be pleased by a surprise that one did not antecedently desire.
      *   *Why it fails:* It makes pleasure too broad. It includes "gladness" about things that are not "pleasant" in the phenomenological sense.
  *   **Boundary Case:** The "Tragic Pleasure." You are glad you are watching the sad film, but the experience itself is painful. Attitudinal theory says you are "pleased," but intuition says you are "pained but satisfied."

  ### 3. The Massage Case: The Dissociation Argument

  Your massage example is a specific, powerful counter-argument known as the **Dissociation Argument**.

  *   **The Scenario:** Sensory qualia (pressure, warmth) remain constant; Hedonic valence (pleasant/unpleasant) flips.
  *   **Implication:** This proves that **pleasure is not intrinsic to the sensation.**
  *   **Who it defeats:** It definitively refutes **Qualitative Hedonism**. If pleasure were a sensory quality like "salty" or "red," it could not vanish while the sensation remains.
  *   **Who it helps:** It initially seems to help Attitudinal Theory (the sensation didn't change, but your *desire* for it did). However, as you noted, Attitudinal Theory *also* fails because you can desire things (anger) that aren't pleasures.

  ### 4. Are These the Only Options?

  No. The dichotomy between "Feeling" and "Stance" is the dominant historical framework, but contemporary philosophy of mind has generated third and fourth options to escape your impasse.

  #### Option C: Adverbialism
  *   **The Concept:** Pleasure is not a *thing* felt (noun) nor a *stance* taken (verb), but a **way** of feeling (adverb).
  *   **The Definition:** There is no "pleasure" added to the water. There is only "drinking water **enjoyingly**."
  *   **How it solves your impasse:** It dissolves the search for a "residue." You cannot find the residue because you are looking for an object where there is only a mode.
  *   **The Problem:** It risks being circular. What does "enjoyingly" mean? If it means "in a way that gives pleasure," we haven't advanced. If it means "in a way I want to continue," we are back to Attitudinal Theory.
  *   **Key Proponents:** Gilbert Ryle, C.D. Broad, recent work by Ben Bradley.

  #### Option D: Imperativism (The Command Theory)
  *   **The Concept:** Pleasure is not a description of the world, but a **command** from the body to the mind.
  *   **The Definition:** A pleasant experience is one that carries the intrinsic imperative: **"More of this!"** An unpleasant experience carries the imperative: **"Less of this!"**
  *   **How it solves your impasse:** It accounts for the massage case perfectly. The pressure is the same, but the biological command switches from "More!" to "Enough!" It accounts for the "residue" failure because the command is functional, not sensory.
  *   **The Problem:** It struggles with "masochistic pleasure" (where I want more pain) or "noble suffering" (where I accept pain without wanting less of it).
  *   **Key Proponents:** David Bain, Manne.

  #### Option E: Representationalism
  *   **The Concept:** Pleasure is a perception of **value**.
  *   **The Definition:** To feel pleasure is to experience the object as *good for you*.
  *   **How it solves your impasse:** It explains why the crossword clue is pleasurable (it represents a cognitive good) and why the water is pleasurable (it represents a physiological good).
  *   **The Problem:** It makes error too difficult. Can I be mistaken that something is good for me while feeling pleasure? Most people think you can feel pleasure even if the thing is bad for you (e.g., smoking).

  ### 5. Verdict: Single Problem or Two?

  The two failures are aspects of a **single category error**: **Reification.**

  You are trying to find the *ontological status* of pleasure as if it were a natural kind (like "gold" or "water").
  1.  **The Residue Failure** shows pleasure is not a **Sensory Natural Kind**.
  2.  **The Stance Failure** shows pleasure is not a **Volitional Natural Kind**.

  The "Single Problem" is that pleasure is likely a **hybrid functional state** that involves both sensation and evaluation, but is identical to neither.

  ### 6. A Proposed Term and Definition

  Since you asked for a term if nothing established fits, I will offer the term that best captures the synthesis of your observations, drawn from recent meta-ethical discussions.

  **Term:** **Hedonic Valence**
  **Definition:** A non-sensory, motivational property attributed to an experience by the subject's evaluative systems, which disposes the subject toward continuation or cessation of that experience, distinct from the subject's explicit desires.

  **Boundary Cases for Hedonic Valence:**
  *   **Counts as an instance:** The cold water. The sensory input is neutral/cold; the *valence* is positive. The massage (phase 1). The sensory input is pressure; the *valence* is positive.
  *   **Does NOT count (The Anger Case):** Righteous anger. You want it to continue (Desire), but the *valence* is negative (it feels agitating/heavy). This distinguishes Valence from Desire.
  *   **Does NOT count (The Massage Case, phase 2):** The massage becomes annoying. The sensory input is pressure (unchanged); the *valence* flips to negative. This distinguishes Valence from Sensation.
  *   **Does NOT count (The Sad Film):** You are glad to watch it (Evaluation), but the *valence* of the experience is sorrowful. This distinguishes Valence from Overall Satisfaction.

  ### Summary Recommendation

  You have arrived at the **Heterogeneity Problem**.
  Your "Residue" candidate is **Qualitative Hedonism** (refuted by Heterogeneity).
  Your "Stance" candidate is **Attitudinal Hedonism** (refuted by Non-Hedonic Pro-Attitudes).

  The way out is not to choose between them, but to recognize that "pleasure" is likely a **functional label** for a specific relationship between sensation and motivation (Imperativism) or a **mode of attention** (Adverbialism), rather than a constituent part of the experience itself.

  If you wish to read further into this specific impasse, I recommend:
  1.  **Fred Feldman,** *Pleasure and the Good Life* (for the Attitudinal defense).
  2.  **David Bain,** "The Imperativist Theory of Pleasure" (for the solution to the massage case).
  3.  **Gilbert Ryle,** *The Concept of Mind* (Chapter on "Feelings," for the Adverbial critique).
