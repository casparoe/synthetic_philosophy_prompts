  I'm giving a talk thursday at my local library's "strange ideas hour" — mostly retired engineers who fix machines for fun and two philosophy undergrads who show up for the free cookies. I'm not an academic, just a guy who read some translated fragments about the School of Names and got obsessed with the white horse dialouge. My thesis is that Gongsun Long's "white horse is not a horse" isn't just sophistry; it's what happens when you verify category membership by one physical trait (the color white) versus another (the shape/species form), and I want to use that to think about repair and replacement. Like, if you swap every single part of your phone over ten years, the social label "this is my phone" stays put but the physical-trait set is 100% different, so the claim "this is the same object" fractures the same way. I need a Q&A prep sheet: the eight or so objections this crowd will actually throw at me, ordered by damage, phrased like an engineer or an undergrad would say them. For each, give me a two-minute reply and flag exactly where I'm being soft. Tell me what I should concede right at the start so I don't look defensive. And include the one question I'm hoping nobody asks — probably something about whether this means a person whose cells have all been replaced isn't technically themself anymore. Don't ask me for citations or a reading list; I don't have them. Keep it casual.
