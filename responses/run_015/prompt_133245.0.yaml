answer: |-
  ### Upfront Concession (Say this in your intro)
  "Look, I'm not a sinologist. I know Gongsun Long sounds like he's just playing word games, and logically, a white horse *is* a horse. I'm not trying to rewrite math. I'm using this weird 2,000-year-old puzzle as a tool to think about when a repaired machine stops being the same machine. If I get the history wrong, correct me, but let's focus on the repair angle."

  ***

  ### Q&A Prep Sheet (Ordered by Damage)

  **1. The Set Theory Crush (Engineer)**
  *"Wait, isn't this just basic set theory? A white horse is a subset of horses. Saying it's 'not a horse' is logically false. You're breaking math to make a point."*

  **Reply:**
  "You're absolutely right, in modern set theory, that statement is false. But I think Gongsun isn't doing math; he's doing procurement. If I send you to buy a 'horse,' a yellow one works. If I send you for a 'white horse,' a yellow one fails. The criteria for acceptance changed. The object didn't, but the verification trait did. I'm using that to ask: when you repair a phone, are we verifying the 'horse' (it works) or the 'white horse' (it's the original casing, the original screen)? If we swap the casing, is it still the 'white horse'? I'm not saying the logic holds universally, just that the tension between 'functional category' and 'specific trait category' is where identity fractures."

  *   **Soft Spot:** You're admitting the logic is technically false. If they press on "why use broken logic," you have no answer other than "it's a metaphor."
  *   **Damage:** High. Invalidates your core premise if you don't pivot to utility quickly.

  **2. The "Hope Nobody Asks" (Everyone)**
  *"So, if identity fractures when physical traits change... human cells replace themselves every seven years. Am I not technically myself anymore? Is my wife married to a stranger?"*

  **Reply:**
  "Whoa, okay, we're going deep. Honestly? I don't have the answer to personal identity. That's the hard problem of consciousness, and I'm just talking about toasters. But if we apply the lens: biologically, you're a 'horse' (functioning human). Socially, you're a 'white horse' (specific history, memories, scars). If we treat people like machines, yes, the parts change. But we have a social contract that overrides the physical trait verification. We agree 'you' are the continuity of memory, not the cells. I'd argue we should treat our heirloom machines with that same social grace, not just physical accounting. But please, don't ask me to prove you exist."

  *   **Soft Spot:** You are wildly out of your depth here. You're hand-waving the hardest problem in philosophy.
  *   **Damage:** Critical. Can turn the room existential or hostile if you sound dismissive.

  **3. The Ship of Theseus Yawn (Undergrad)**
  *"This is just the Ship of Theseus. You've wrapped a 2,000-year-old paradox in a new coat. What's actually new here?"*

  **Reply:**
  "Fair. It is Ship of Theseus adjacent. But Theseus is about *time* and *replacement*. Gongsun is about *classification* and *traits*. Ship of Theseus asks 'Is it the same ship?' Gongsun asks 'What trait are you using to verify "ship-ness"?' Is it the wood (material) or the shape (form)? In repair, this matters. If I 3D print a replacement gear, is it the same machine? Ship of Theseus says 'maybe.' Gongsun says 'depends if you're verifying material or function.' I'm trying to give you a diagnostic tool for that decision, not just restate the paradox."

  *   **Soft Spot:** It *is* basically Ship of Theseus. The distinction is thin.
  *   **Damage:** Medium-High. Makes your talk seem unoriginal.

  **4. The Functionalist Rebuke (Engineer)**
  *"I fix radios. If it sounds like a radio and tunes stations, it's a radio. Who cares if the casing is plastic instead of wood? Function is the only trait that matters."*

  **Reply:**
  "For a utility radio, yes. But what if it's a 1950s Zenith you're restoring for a collector? Now the 'white' trait—the wood grain—matters more than the 'horse' trait—the sound. I'm arguing that 'identity' isn't fixed; it's dependent on the user's intent. When you fix your own car, function rules. When you fix a museum piece, material rules. Gongsun helps us see that 'is this the same object?' is the wrong question. The right question is 'which trait verification are we using today?'"

  *   **Soft Spot:** Engineers hate subjective criteria. They want objective standards.
  *   **Damage:** Medium. Challenges their professional worldview.

  **5. The Semantic Slip (Undergrad)**
  *"Are you talking about the object itself, or just the word 'horse'? This sounds like a linguistics problem, not a metaphysics one."*

  **Reply:**
  "It's both. The School of Names was all about how labels stick to reality. If the label 'my phone' stays on a device that has 100% new parts, the label is doing heavy lifting. The physical object is different; the social label is constant. I'm suggesting that in repair, we confuse the label for the object. We say 'I fixed my phone,' but we really mean 'I maintained the label continuity on a changing object.' Knowing the difference helps you decide when to stop pouring money into a ghost."

  *   **Soft Spot:** You're blurring the line between nominalism and realism without defining them.
  *   **Damage:** Medium. Philosophy undergrads will smell blood if you mix up map/territory.

  **6. The Practical Utility Check (Engineer)**
  *"Okay, but does this help me fix the machine? Or is it just post-hoc philosophy?"*

  **Reply:**
  "It helps with the 'stop loss' decision. We've all kept fixing something because 'it's still the original.' But if you accept Gongsun's view—that specific traits lock identity—you can admit when the 'white horse' is dead. If the motherboard is gone, the 'brain' is gone. It's a new horse painted white. Accepting that frees you to scrap it without guilt. It turns emotional attachment into a trait verification checklist."

  *   **Soft Spot:** It's still pretty abstract. Doesn't actually teach them how to solder.
  *   **Damage:** Low-Medium. Engineers want wrenches, not words.

  **7. The Translation Hedge (Undergrad)**
  *"You mentioned you're reading translated fragments. Aren't those notoriously unreliable? Couldn't he just be saying 'white horse' is a compound noun?"*

  **Reply:**
  "Yep, totally. The texts are messy. Some scholars say he's a realist, others say he's a sophist. I'm not betting my thesis on the historical accuracy. I'm betting on the utility of the idea. Even if Gongsun was just being a jerk, the logic puzzle he left behind is useful for thinking about parts interoperability. Take the tool, leave the history."

  *   **Soft Spot:** Admitting your source material might be garbage undermines your authority.
  *   **Damage:** Low. You already conceded this in the intro.

  **8. The Trait Arbitrariness (Engineer)**
  *"Why 'white'? Why not weight? Or height? You're picking a trait that doesn't matter to make the paradox work."*

  **Reply:**
  "Exactly. Color is accidental; shape is essential. That's the point. He picks a trait that *shouldn't' matter for 'horse-ness' but *does* matter for 'white horse-ness.' In repair, we do this. We say 'it's not the same laptop because the serial number sticker is gone.' That's a 'white' trait. It doesn't affect function, but it affects identity. I'm asking us to notice when we're prioritizing the color over the horse."

  *   **Soft Spot:** You're defending an arbitrary choice as meaningful.
  *   **Damage:** Low. Detail-oriented nitpick.
