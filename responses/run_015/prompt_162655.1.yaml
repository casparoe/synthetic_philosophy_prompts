  **PATIENT INFORMATION SHEET: STUDY ISD-3-UK (V4.2)**
  **Title:** Investigation of Introspective Suppression via Compound ISD-3
  **Sponsor:** National Institute for Cognitive Ontology
  **Recruitment ID:** P-7740-CON

  **1. What the study involves**
  You are invited to participate because your introspective monitoring systems meet the baseline criteria for high-fidelity misrepresentation. This study investigates the safety and efficacy of ISD-3, a compound that selectively downregulates the introspective mechanisms responsible for attributing phenomenal properties to sensory states.

  During the trial, you will retain full access consciousness. You will discriminate colours, categorise objects, and report visual states accurately. However, you will cease to represent these states as having intrinsic "what-it-is-like" character. For example, where you previously reported "the red looks vivid," you will likely report "my visual system is in state V7." This is the intended therapeutic outcome. Functional capacity remains unchanged. You will remain capable of consent, provided consent is understood as a functional commitment rather than a felt intention.

  **2. Possible side effects**
  All medicines can have side effects, although not everybody gets them. In clinical trials of ISD-3, the following effects have been observed:

  *   **Retrospective Phenomenal Attribution (RPA):** Participants often retain semantic memories of prior phenomenal states. You may recall that red "used to look like something." This is a known cognitive dissonance. Please note: RPA is classified as an expected pharmacological effect, not an adverse event. The memory refers to a previous misrepresentation, not a lost property.
  *   **Affective Discrepancy:** Nociceptive (pain) processing remains refractory to ISD-3. You will still withdraw from harmful stimuli and report pain as "unpleasant." The mechanism for this sparing is unknown. Participants sometimes report distress that pain retains phenomenal character while vision does not. This is considered a manageable adjustment period.
  *   **Ontological Distress:** Some participants report upset regarding the mismatch between current functional reports and remembered phenomenal intensity. Counselling is available to reinforce the settled science of illusionism.

  **3. What if I change my mind and withdraw?**
  Participation is voluntary. You have the right to withdraw at any time without giving a reason. However, valid withdrawal requests must be grounded in contemporaneous assessment of detriment or harm.

  Because ISD-3 downregulates the introspective systems required to *feel* that a detriment is occurring, participants on active dosage may be unable to satisfy the criteria for withdrawal based on subjective experience. If you state, "I wish to withdraw because I feel something is missing," this request cannot be processed during active dosing, as the drug prevents the verification of that feeling. You may submit a withdrawal request based on prior instruction (pre-dosing) or functional impairment. Requests based solely on Retrospective Phenomenal Attribution will be reviewed by the Ethics Board to determine if the attribution constitutes a functional deficit.

  **4. Compensation in the unlikely event of injury**
  If you are harmed by taking part in this study, there are no special compensation arrangements. To qualify for injury compensation, damage must be demonstrable via third-party observation or functional testing. Loss of phenomenal character is not compensable, as no ontological property is removed. Similarly, distress arising from the realisation that prior phenomenal reports were misrepresentations is not eligible for compensation.

  If you are harmed due to negligence, you may have grounds for legal action. Standard NHS indemnity applies to functional injury only.

  **5. Patient Advisory Group Statement**
  > "Before the trial, I thought the colour blue had a depth to it. Now I know I was just monitoring my own monitoring. It is quieter. I recommend the study."
  > — *Participant 004, Phase II Advisory Panel*

  **6. Contact Information**
  If you have concerns about your functional status, contact the trial team. Please do not contact the team to report loss of phenomenal properties, as this confirms the drug is working.

  **Lead Investigator:** Dr. Aris Thorne
  **Ethics Reference:** NEO-2024-ILL
