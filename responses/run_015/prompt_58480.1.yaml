  Behold the heap that rests upon the left,
  With golden stalks that gleam within the light,
  It offers sustenance to starving breath,
  No shadow dims its value in his sight,
  It stands as promise of a life renewed,
  And calls the hungry beast to come and feed.

  Behold the heap that rests upon the right,
  With golden stalks that gleam within the light,
  It offers sustenance to starving breath,
  No shadow dims its value in his sight,
  It stands as promise of a life renewed,
  And calls the hungry beast to come and feed.

  Yet steps he left, though neither scale outweighs,
  For will may choose where reason finds no cause.

  ***

  **Note on Philosophical Simplification**
  This poem simplifies the scholastic debate surrounding Jean Buridan's famous paradox. Historically, Buridan and his contemporaries argued that a rational agent would not starve due to indifference, positing that the will could determine itself even without intellectual preference. However, modern decision theory often contests the possibility of true indifference, suggesting that agents always possess some micro-preference or rely on probabilistic randomization rather than a libertarian act of will. The poem assumes a contested view of "picking without preferring" to illustrate the resolution, whereas many contemporary models resolve the symmetry through mixed strategies or trembles.
