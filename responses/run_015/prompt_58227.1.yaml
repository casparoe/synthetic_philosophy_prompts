      *   **Model:** The law.
      *   **Loss Function/Error:** Fit to data.
      *   **Regularization/Complexity Penalty:** Simplicity.
      *   **Generalization (Test Error):** Predictive power on unseen data.
      *   **Overfitting:** Capturing noise/exceptions as rules.
      *   **Underfitting:** Missing real patterns.
      *   **Generative Process:** The underlying mechanism (if it exists).

  4.  **Develop the Toy Case:**
