      *   *Anti-Humean:* You assume there is a true generative process. The law is the code running the simulation. If a dot blinks oddly, either your model of the law is wrong, or the law allows for stochasticity, or the observation is wrong. The law *makes* the dots blink. It's not just a summary; it's the engine.
      *   *Residue/Mapping:* Compression maps to Humean simplicity. Test error maps to predictive success.
