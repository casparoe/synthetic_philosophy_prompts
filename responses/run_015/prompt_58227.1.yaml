      *   **Format Constraint:** Continuous prose only (like a normal email). No headings, bullet points, bold text, or tables.

  2.  **Deconstruct the Philosophical Debate:**
      *   **Humeanism (Best System Account):** Laws are just summaries of patterns in the mosaic of particular facts. There is no necessary connection. Laws supervene on the history of events. Simplicity and strength matter (Lewis).
      *   **Anti-Humeanism (Governance/Necessitarianism):** Laws are metaphysical entities that govern or constrain events. They explain *why* things happen, not just *that* they happen. There is a modal force (necessity).

  3.  **Deconstruct the ML Vocabulary:**
