      You conflate narrative coherence with rigid consistency, mistaking a plot twist for a broken spine. A compelling life story demands conflict and resolution, not static repetition; when the extremist repents, they do not erase their past but recontextualize it within a new evaluative framework, rendering the transition intelligible rather than random. This is precisely where diachronic reasons-responsiveness distinguishes free agency from mere psychic rupture: the conversion is free because it is a response to recognized moral reasons, woven into a life story where the agent claims ownership of both the error and the correction. If the shift were truly discontinuous—a brute causal break without rational threading—it would resemble madness or brainwashing, not moral growth, and we would rightly diminish their responsibility.

      I concede that profound conversions strain the *appearance* of continuity, often feeling like a death of the old self. But that phenomenological break is not ontological; the agent must still construct a bridge of understanding to rationally own the trajectory, otherwise, they are merely a vessel for new impulses. Static mesh theories fail here because they cannot distinguish between an addict consistently endorsing a craving and a convert inconsistently pursuing truth. Narrative coherence is not the enemy of growth; it is the scaffold that makes growth attributable to the agent rather than circumstance. Without that thread connecting the sinner to the saint, you have no agent to admire, only a series of disconnected events.

