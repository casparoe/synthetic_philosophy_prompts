      *   *Credit Assignment:* PRMs solve credit assignment for *where* the error happened, but not necessarily *what* constitutes an error if the error is contextual.
      *   *Goodhart's Law:* If you optimize for "looking correct step-by-step," the model learns to write steps that *look* correct to the PRM but don't actually solve the problem (reward hacking).
