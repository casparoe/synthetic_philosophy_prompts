answer: |-
  There is no single canonical term in moral philosophy or sociology for this specific mechanism, though it is best conceptualized as **extensional collapse** driven by a **failure of common knowledge regarding application conditions**.

  This phenomenon differs fundamentally from the accounts you exclude because it locates the failure in the *epistemic coordination* required to sustain a norm rather than in the *valuation* or *material utility* of the norm itself. In Appiah's honor cascade, the collapse occurs because the social esteem attached to the practice evaporates; participants stop caring whether something counts as a duel because honor itself ceases to be a dominant currency. In Williams-style materialist accounts, the payoff structure shifts, making compliance irrational. In extensional collapse, the motivation to uphold the norm may remain intact, and the material costs may be unchanged, but the community loses the shared "rule of recognition" (to borrow H.L.A. Hart's legal concept) required to identify instances of the norm. Without common knowledge that "we all agree this specific slight warrants a challenge," the norm cannot guide action, even if everyone theoretically supports the principle of dueling.

  The right way to carve this phenomenon is as a **coordination failure regarding classification**, distinct from ordinary vagueness. All rules possess "open texture" or penumbral vagueness, where borderline cases are debated; norms survive this as long as a stable core of exemplars remains unquestioned. Extensional collapse occurs when the core itself dissolves—when strategic contestation, semantic drift, or social fragmentation renders *no* case indisputably central. This transforms the norm from a guide into a site of perpetual litigation. Unlike standard vagueness, which is tolerated, this level of indeterminacy makes the norm operationally inert because actors cannot predict whether their behavior will be recognized as compliant or deviant by others.

  Regarding boundaries, this mechanism covers any ambiguous rule where coordination on classification is a prerequisite for the norm's force, but it is most distinct when the ambiguity is not merely accidental but becomes the primary locus of social interaction. While strategic exploitation by critics or defenders often accelerates the process (by deliberately blurring lines to evade sanction or expand power), the collapse itself is defined by the *outcome*—the loss of indexical stability—rather than the *intent*. If the community can no longer reliably distinguish instances of the practice from non-instances, the norm has undergone extensional collapse regardless of whether the ambiguity arose organically or was weaponized.
