          *   **Node 3 (from A): Variant codes and Degeneracy**
              *   *Branch A:* Assignments are arbitrary/conventional; redundancy is non-random but mapped.
              *   *Branch B:* Assignments are chemically constrained; redundancy reflects affinity.
              *   **Node 4 (from A): Maternal determinants and Methylation**
                  *   *Branch A:* Genome directs development given standard context; context is background.
                  *   *Branch B:* Genome is one resource among many; context fixes body plan.
                  *   **Leaf 1:** **Literal Code.** Core claim: The code is literal because codon assignments are arbitrary conventions read by dedicated machinery. Worst item: Recoding of stop codon (selenocysteine). Awkward commitment: Must treat context-dependent reading as noise or secondary code.
                  *   **Leaf 2:** **Convenor/Unnamed.** Core claim: Coding is literal between nucleic acid and protein but licenses no claim about the organism. Worst item: Maternal determinants. Awkward commitment: Cannot explain how protein information becomes organismal information.
                  *   **Leaf 3:** **Deflationary.** Core claim: Informational talk is eliminable; DNA is a template and chemical cause but nothing more. Worst item: Horizontal transfer (suggests functional portability). Awkward commitment: Must deny semantic distinction between DNA and other chemical causes.
                  *   **Leaf 4:** **Difference-Making.** Core claim: Genes are not content carriers but the causes that make the difference to phenotype in investigated contexts. Worst item: Methylation (same DNA, different phenotype). Awkward commitment: Must treat epigenetic marks as the real difference-makers in some cases.
              *   **Node 4 (from B): Maternal determinants and Methylation**
                  *   *Branch A:* Genome is privileged carrier of historical content.
                  *   *Branch B:* Genome is one inherited resource among many; nothing singles it out.
                  *   **Leaf 5:** **Historical/Semantic.** Core claim: Semantic content is genuine but grounded in selection history rather than arbitrariness. Worst item: Variant codes (challenges universal history). Awkward commitment: Must explain how new conventions acquire content without history.
                  *   **Leaf 6:** **Parity.** Core claim: The genome is one inherited resource among many and nothing about its causal role singles it out. Worst item: Cell-free translation (suggests sufficiency). Awkward commitment: Must treat DNA as causally equivalent to cytoplasmic determinants.
                  *   **Leaf 7:** **Unnamed (Candidate B).** Core claim: Information is real but borne by the developing system as a whole, with DNA contributing no more than any other contributor. Worst item: Horizontal transfer. Awkward commitment: Collapses into Parity; lacks account of specific genetic contribution.
          *   **Node 3 (from B): Variant codes and Degeneracy**
              *   *Branch A:* Code is real but semantically exhausted by translation; nothing downstream inherits content.
              *   *Branch B:* Code is chemical necessity; information talk is misleading.
              *   **Leaf 8:** **Unnamed (Candidate A).** Core claim: The code is real and arbitrary but semantically exhausted by translation itself. Worst item: Synonymous substitutions (alter efficiency/folding). Awkward commitment: Cannot account for phenotypic effects of silent mutations.
              *   **Leaf 9:** **Chemicalist.** Core claim: Codon assignments reflect chemical affinities; degeneracy is non-random due to physics. Worst item: Variant codes (ciliates/mitochondria). Awkward commitment: Must explain how arbitrary variants evolve if chemistry dictates mapping.
      *   **Node 2 (from B): Horizontal transfer**
          *   *Branch A:* Gene function depends on host context; portability is limited.
          *   *Branch B:* Gene function is intrinsic; host provides only energy.
          *   **Node 5 (from A): Recoding, Editing, and Frameshifting**
              *   *Branch A:* Message is fluid; reading depends on cis-elements and context.
              *   *Branch B:* Message is stable; exceptions are regulated deviations.
              *   **Leaf 10:** **Contextualist.** Core claim: The message is not in the DNA but in the interaction of DNA and cellular machinery. Worst item: Cell-free translation. Awkward commitment: Must deny DNA carries any independent instruction.
              *   **Leaf 11:** **Developmental Systems.** Core claim: Bodies are constructed by systems, not instructed by genes; DNA is a component. Worst item: Horizontal transfer. Awkward commitment: Struggles to explain specificity of genetic intervention.
              *   **Leaf 12:** **Unnamed.** Core claim: Information is distributed across overlapping frames and editing sites. Worst item: Degeneracy. Awkward commitment: Makes genetic analysis computationally intractable.

  **Indistinguishable Pairs:** Leaf 6 (Parity) and Leaf 7 (Candidate B) are indistinguishable on this tree; both deny causal privilege to DNA. They separate only on whether "information" is a valid predicate for the system (Parity often eliminates it, Candidate B retains it). Leaf 3 (Deflationary) and Leaf 4 (Difference-Making) converge on denying semantic content but separate on whether genes are *specific* causes; the tree lacks a node on causal specificity versus general causation to split them fully.

  **Empty Cells:** A view accepting Arbitrariness (Node 3A) but denying Machinery (Node 1B) is empty because arbitrariness implies a convention-reader relation; this cell is incoherent. A view accepting Parity (Node 4B) but insisting on Literal Code (Node 3A) is empty because literal coding privileges the code-reader pair; this cell is unattractive as it creates tension between causal equality and semantic privilege.

  **Candidate Views:** Candidate A (Code exhausted by translation) maps to Leaf 8; it is occupied but rare. Candidate B (Info borne by system) maps to Leaf 7; it collapses into Parity (Leaf 6) unless the definition of "information" is decoupled from causal privilege.

  **Convenor's View:** Located at Leaf 2. It survives the cell-free translation case comfortably (Node 1A) because it restricts the coding relation to the molecular level. It weakens only if forced to explain organismal development (Node 4), where it must concede the genome does not fix the body plan alone.

  **Bias Check:** The current ordering enters through Cell-free translation (molecular sufficiency), making Literal/Deflationary views (Leaf 1, 3, 4) reachable earlier than Parity (Leaf 6). An alternative ordering starting with Maternal determinants and Methylation would make Parity and Developmental views reachable earlier. Under that ordering, Leaf 6 and Leaf 11 would move up, while Leaf 1 and Leaf 3 would require deeper traversal to reach.

  Run the instrument by having participants answer the branch claims based on their interpretation of the cases, not by selecting a label. Warn them at Node 3 (Variant codes) that the distinction between "arbitrary" and "chemically constrained" reflects a contested interpretive choice about the nature of conventions, not a settled matter of biochemical fact. Conclude by asking those who reach different leaves via the same path to identify which unstated premise diverged.
