      *   *Claim 5: One problem, one method (iterate on spec).*
          *   *Truth:* This is the "Iterative Alignment" or "RLHF scaling" view.
          *   *Nuance:* Fails if the system becomes smarter than the evaluators (scalable oversight problem). You can't iterate if you can't reliably judge the output.

