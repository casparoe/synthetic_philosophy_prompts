answer: |-
  Brainstorm
  The debate you are wrestling with is fundamentally about explanatory leverage versus ontological parsimony. On one side, you have the intuition that nothing exists but individuals and their interactions, meaning any "group force" is just a shorthand for complex individual psychology. On the other, you have the intuition that social structures act as constraints or enablements that cannot be reduced to the sum of parts without losing predictive power. Your specific verdicts suggest you are not a dogmatic holist or individualist, but rather a contextualist who switches frameworks based on where the causal bottleneck lies. The conceptual landscape here isn't about whether groups "exist" in a physical sense, but whether referencing them is indispensable for counterfactual reasoning. If removing the social structure from your explanation breaks your ability to predict what would happen if things were slightly different, then the structure is doing real work.

  The Principle
  The unifying principle behind your verdicts is the **Counterfactual Structural Dependence Criterion**. A social explanation requires holistic attribution if and only if the outcome counterfactually depends on the relational arrangement of agents rather than solely on their intrinsic properties. This principle has two clauses. The first clause validates holism: if you can hold individual properties constant while varying the structural relations (network positions, institutional rules) and the outcome changes, or if you vary individual properties while holding structural relations constant and the outcome remains the same, then structural forces are causally efficacious. This motivates your verdicts on Gridtown (identical agents, different network positions yield different outcomes), Region B (different local conditions, same systemic spike), and the Zoning Referendum (outcome depends on shared expectations, a relational property not contained in any single voter's head).

  The second clause validates methodological individualism: if the outcome is fully determined by the intrinsic psychological states of the agents such that reshuffling their positions or altering the social context would not change their specific actions, then individualism suffices. This motivates your verdict on Maria (her internal anger maps directly to her action regardless of the movement's structure) and Region A (the outcome is a clean sum of independent calculations). Under this principle, you are not flipping between incompatible ontologies; you are applying a single test for explanatory indispensability. When the social structure adds no predictive value over individual psychology, you discard it; when individual psychology cannot account for the pattern without referencing the structure, you retain it.

  Application to Unlisted Cases
  Applying this principle to your "glimmer" case resolves your flipping by treating it as a temporal transition. Initially, the word's usage depends entirely on the coiners' intent and the adopters' individual choices, satisfying the individualism clause. However, once grammatical rules emerge that constrain how users *must* employ the term to be understood—rules the original coiner did not intend—the outcome (correct usage) becomes dependent on the linguistic structure rather than individual意志. The principle predicts you should treat early adoption as individualist and established usage as holistic. Regarding the culture cases, the principle predicts the startup's culture dies with the founder because the structural relations are identical to the founder's individual psychology; removing the agent removes the structure. Conversely, the large corporation's culture survives turnover because the relational norms and institutional rules persist despite the replacement of individual agents, satisfying the holism clause where structure is invariant to individual substitution.

  Tensions and What to Drop
  Adhering strictly to the Counterfactual Structural Dependence Criterion forces you to abandon the certainty of your Region A verdict. You claimed unemployment spiked because owners individually calculated costs, aggregating cleanly. However, if every owner made the *same* calculation simultaneously, you must ask why their intrinsic properties were so aligned. In social science, synchronized individual behavior is rarely coincidental; it is usually driven by a shared structural signal (e.g., a market price shift or regulatory change). If a structural signal forced the calculation, then the outcome counterfactually depends on that signal, not just the individual math. To maintain consistency with your Gridtown and Region B verdicts, you must concede that Region A is likely holistic too, disguised as individualism. The tradeoff is losing the comfort of a "clean" individualist case, but you gain a more robust ontology that doesn't ignore the hidden structural causes of synchronized individual action.

  Confidence Note
  I am roughly 85% confident in this principle as a accurate reconstruction of your intuitive reasoning, as it successfully demarcates your conflicting verdicts without appealing to vague metaphysics. The specific point I am least sure about is the threshold for the "glimmer" case: determining exactly when a convention becomes a constraint is notoriously difficult in linguistics and social ontology. There is a gray zone where individual adoption and structural rule-following are indistinguishable, and the principle offers less guidance on exactly when the switch flips during that transition period.
