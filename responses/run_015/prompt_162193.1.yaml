prompt: |-
  I teach one 75-minute session of a graduate seminar on collective decision-making: 18 students, mixed preparation (roughly half have had a first course in microeconomics, two or three have traded on a prediction market, none has studied futarchy), one room with a projector, and a strong preference for a paper-and-pencil procedure over anything that depends on students having phones or laptops. I want to run futarchy itself as a classroom game: the students should decide something real about the seminar by voting on a welfare metric and then letting conditional prediction markets pick the policy, and only in the debrief should the word futarchy be used and the mechanism placed in its intellectual context.

  What I want them to feel, in this order, is first that conditional markets genuinely aggregate dispersed private information better than discussion or a show of hands — the pull of the proposal has to land before it is named — and then that something goes structurally wrong with it. My own suspicion, which I would like the activity to test rather than assume, is that the standard objection (that people who hold contracts paying off on a bad outcome have an incentive to bring that outcome about) is not the deepest problem. The deeper one is that in futarchy the treatment is assigned by the forecast of its own effect: the market is asked for a number that is supposed to be read causally, but the number is also public and is read by the very people whose subsequent effort and cooperation determine the outcome, so the price is a fixed point of a loop rather than an estimate of a policy effect, and the market partly destroys the informational conditions that made its own price informative. I would like the activity to make that loop visible as something the students do and watch happen, not as something I assert, and I would like the debrief to distinguish which moment in the session displayed the sabotage incentive, which displayed reflexivity, and which displayed gaming of the metric itself.

  Please give me: the decision and the welfare metric to put to them (I am happy for the metric to be one they can cheaply inflate, such as self-reported comprehension, if that serves the design); the trading mechanism, runnable on paper with 18 novices in one room, including how the two conditional markets are opened and how the verdict is computed from their prices; the assignment of at least one role whose holder observes the market price before taking an action that affects the outcome, together with that role's payoffs; a payoff scheme using points or trivial stakes rather than money; a minute-by-minute timeline; the debrief, mapping particular moments onto particular features of the mechanism; what will predictably go wrong the first time I run it and how to recover; and an honest note on which feature of real futarchy the session cannot reproduce and which therefore has to be supplied by me in discussion.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Graduate seminar, 75 minutes, 18 students, mixed micro background (half have intro micro, 2-3 prediction market experience, 0 futarchy knowledge).
      *   **Constraints:** One room, projector, *paper-and-pencil only* (no phones/laptops).
      *   **Goal:** Run "futarchy" as a classroom game to decide something real about the seminar.
      *   **Pedagogical Arc:**
          1.  Feel conditional markets aggregate info better than voting/discussion.
          2.  Feel something goes structurally wrong (specifically the reflexivity/fixed-point problem, not just sabotage).
          3.  Debrief *after* the experience to name "futarchy" and map experiences to theory.
      *   **Specific Instructor Hypothesis:** The deepest problem isn't sabotage (incentive to make policy fail), but reflexivity (market price affects behavior which affects outcome, creating a fixed point loop).
      *   **Deliverables:** Decision/Metric, Paper Trading Mechanism, Roles (specifically one observing price before acting), Payoff Scheme, Timeline, Debrief Plan, Failure Modes/Recovery, Limitations Note.

  2.  **Deconstruct the Challenge:**

      *   *Paper Trading:* This is the hardest constraint. Real prediction markets need liquidity and continuous updating. Paper markets are usually static or slow. I need a mechanism that simulates price discovery without tech. *Idea:* Market Makers (the instructor) or a Call Market structure. Given 75 mins and 18 students, a Call Market (batch auction) is too slow for multiple rounds. A Dealer/Market Maker system where students submit orders to a central book is better. Or, simpler: A "Price Adjustment" mechanism where the instructor adjusts prices based on excess demand. Let's go with an *Order Book managed by the Instructor/TA* but simplified to "Buy/Sell at Current Price" with price updates every few minutes.
      *   *The Decision:* Needs to be real but low stakes. "Break time length," "Homework load," "Topic for next week." Let's choose **"Format of the Final 15 Minutes."** Option A: Open Discussion. Option B: Silent Reflection/Writing.
      *   *The Metric:* Needs to be measurable *after* the decision but influenced by student effort. "Self-reported comprehension" is suggested by the user and is perfect for the "gaming the metric" lesson. Let's use **"Average Self-Rated Understanding (1-10) on the Exit Ticket."**
      *   *The Reflexivity Loop:* This is crucial. The market price must be *public* before the policy is executed, and students must know the price affects their payoff *and* the outcome.
      *   *Roles:* We need someone whose effort determines the outcome *after* seeing the price. The *Instructor* usually controls the class, but students control their own attention/effort. To make it explicit, let's appoint a "Facilitator" or "Discussion Leader" for Option A, or simply rely on the collective effort. Actually, the prompt asks for *at least one role*. Let's create a **"Class Scribe"** role who summarizes the session. Their effort/quality determines the "Understanding" metric. They see the market price before writing.
      *   *Payoffs:* Points. Maybe extra credit (if allowed) or just "Seminar Currency" redeemable for something trivial (choosing a break snack, or just bragging rights). Let's use "Seminar Points" towards a hypothetical participation grade.
      *   *Sabotage vs. Reflexivity:* To test the instructor's hypothesis, the payoff structure needs to reward accurate prediction *and* high metric scores. If I reward only prediction accuracy, they might sabotage. If I reward metric scores, they might inflate. To highlight reflexivity, the market price needs to influence the Scribe's motivation.

  3.  **Drafting the Design:**

      *   **Decision:** How to end the class (Discussion vs. Quiet Synthesis).
      *   **Metric:** Exit ticket self-rating (1-10) + Scribe Quality (Instructor graded 1-10). Average = Welfare.
      *   **Markets:** Two conditional markets.
          *   Market A: Price of $1 payout if Welfare > Threshold *given* Policy A is chosen.
          *   Market B: Price of $1 payout if Welfare > Threshold *given* Policy B is chosen.
          *   *Correction:* In Futarchy, markets estimate the *value* of the metric, not a binary threshold. Let's simplify for paper: Markets estimate the *Average Score*. Share pays $1 = 1 Point of Welfare.
          *   Market A Share: Pays $Welfare if Policy A chosen.
          *   Market B Share: Pays $Welfare if Policy B chosen.
          *   *Wait, standard Futarchy:* Markets predict the metric value. The policy with the higher predicted value is chosen.
          *   *Paper Implementation:* Students buy "Policy A Units" and "Policy B Units". Price = Expected Welfare.
      *   **Trading Mechanism:** "Pit Trading" is too noisy. "Written Order Submission" every 5 minutes. Instructor acts as Market Maker, adjusting price based on net orders.
      *   **The Reflexivity Hook:** The "Scribe" (1 student) sees the winning market price *before* doing their task. Their payoff depends on the *actual* welfare. If the market predicts high welfare, pressure is on. If low, morale drops.
      *   **The Sabotage Hook:** Students holding short positions (if allowed) or just holding the losing policy's assets might want that policy to fail. *Constraint:* To keep it simple, everyone holds long positions on the *chosen* policy eventually? No, that hides the sabotage incentive.
      *   *Refined Payoff:* Students hold portfolios. If Policy A wins, A-shares pay out the Welfare Score. B-shares become worthless. This creates the sabotage incentive (hold B-shares, hope A wins but fails? No, if A wins, B is worthless regardless of performance).
      *   *Standard Futarchy Payoff:* You hold shares in the policy. If policy wins, you get paid the metric value.
      *   *To show Sabotage:* You need to be able to profit from failure. This usually requires shorting. Shorting on paper is hard.
      *   *Alternative:* Just focus on the Reflexivity. The prompt asks to distinguish sabotage, reflexivity, and gaming.
      *   *Revised Payoff:*
          1.  **Prediction Bonus:** Accuracy of your final holding's price vs actual outcome.
          2.  **Welfare Bonus:** Everyone gets points equal to the Welfare Score (aligns them to success).
          3.  **Sabotage Check:** Allow "Shorting" the winning policy? Too complex for paper.
          4.  *Better approach for Sabotage:* Give 2-3 students a secret side bet: "You get 10 bonus points if the Welfare Score is below 5." This simulates the "stakeholder with opposing interests" or the "short seller."
      *   **The Reflexivity Role:** The "Scribe" sees the market price. If the market says "High Welfare Expected," does the Scribe try harder (self-fulfilling) or feel pressured (choking)? Or does the *class* see the price and adjust effort?
      *   *Crucial Design Element:* The Market Prices must be projected on the board *before* the policy is executed.

  4.  **Developing the Paper Mechanism:**

      *   18 students.
      *   Two assets: Asset A (Policy A), Asset B (Policy B).
      *   Initial Price: 5.0 (Midpoint of 1-10 scale).
      *   Trading Rounds: 3 rounds of 10 minutes.
      *   Order Slip: Buy/Sell up to 5 units.
      *   Market Maker (Instructor): Aggregates net demand. If Net Buy > 0, raise price by 0.5. If Net Sell < 0, lower by 0.5.
      *   Final Price = Decision. Higher price wins.
      *   *Wait, Futarchy Rule:* Compare Price A vs Price B. Higher price policy is implemented.
      *   *Payout:* If Policy A wins, Asset A pays $Welfare. Asset B pays 0.
      *   *Reflexivity:* Publish Final Prices *before* the final 15 mins.

  5.  **Refining the "Deep Problem" (Reflexivity):**

      *   To make the reflexivity visible, the "Welfare Metric" must be partially under the control of the students *after* the price is set.
      *   Metric: Exit Ticket (Self-rated 1-10).
      *   Why this works: If the market predicts 9.0, students feel social pressure to rate high (Goodhart's Law/Gaming). If the market predicts 3.0, they feel the class failed and rate low.
      *   The "Scribe" role: Let's make it the "Discussion Moderator" if Policy A is chosen. They see the price. If the price is low, they might not bother preparing. If high, they try hard.
      *   *Wait, the prompt asks for a role whose holder observes price before taking action.*
      *   Let's appoint a **"Session Synthesizer"** (1 volunteer). Their job is to write a 3-sentence summary on the board in the final 15 mins.
      *   Payoff for Synthesizer: Base points + Bonus if Actual Welfare > Market Prediction. (This incentivizes them to beat the market, highlighting the effort loop).
      *   Payoff for Class: Points = Actual Welfare.
      *   Payoff for Traders: Points = (Final Price - Purchase Price) *if* their asset wins.
      *   *Sabotage:* Secretly tell 2 students: "You get bonus points if Welfare < 5."

  6.  **Timeline Construction (75 mins):**

      *   0-10: Intro & Setup (No "Futarchy" word). Explain decision, metric, trading rules.
      *   10-40: Trading Session (3 rounds). Price updates projected.
      *   40-45: Decision Announcement (Policy with higher price wins). Reveal prices to all.
      *   45-60: Policy Execution (The final 15 mins of class content). Synthesizer works.
      *   60-65: Exit Ticket (Welfare Measurement).
      *   65-75: Debrief (Reveal "Futarchy", discuss loops).

  7.  **Addressing the Instructor's Hypothesis:**

      *   The instructor suspects reflexivity is deeper than sabotage.
      *   To test this: The design must make reflexivity *inevitable* while sabotage is *optional/hidden*.
      *   The "Gaming the Metric" is the self-reported exit ticket.
      *   The "Reflexivity" is the Synthesizer seeing the price.
      *   The "Sabotage" is the secret agents.
      *   In debrief, ask: "Did the price affect how you felt about the class?" (Reflexivity). "Did anyone want the class to fail?" (Sabotage). "Did you rate higher because the market said so?" (Gaming).

  8.  **Failure Modes:**

      *   *Trading too slow:* Paper is slow. *Fix:* Limit orders to "Buy 1, Sell 1, Hold".
      *   *Prices don't move:* *Fix:* Instructor acts as aggressive market maker, prompting "Who thinks this is too low?"
      *   *Students don't take it seriously:* *Fix:* Make the "Seminar Points" matter for a tangible trivial reward (e.g., deciding the break snack next time, or a "Get out of one reading" pass).
      *   *Metric inflation:* Everyone writes 10. *Fix:* Ask for a justification sentence. "I rate this 10 because..."

  9.  **Limitations:**

      *   Real futarchy uses real money and continuous liquidity. This uses points and batch updates.
      *   Real futarchy metrics are hard to game (e.g., stock price). This metric is soft (self-report).
      *   Time scale: Real futarchy markets run for weeks; this is 30 mins.

  10. **Refining the Output:**

      *   Ensure the tone is academic yet practical.
      *   Make sure the "Paper Mechanism" is crystal clear.
      *   Ensure the Debrief explicitly maps to the Instructor's hypothesis.

      *(Self-Correction during drafting)*: I need to make sure the "Reflexivity" isn't just "pressure." It needs to be that the *price itself changes the causal effect*.
      *   *Idea:* If Market predicts High Welfare for Policy A, students might engage *more* in Policy A, making it succeed. If Low, they disengage.
      *   *Implementation:* When announcing the winning policy, announce the *Expected Welfare* (the price). Say: "The market expects you to learn X amount."
      *   *Synthesizer Role:* Give the Synthesizer the specific instruction: "Your goal is to ensure the class meets the market's expectation." This explicitly ties their effort to the price.

      *(Payoff Check)*:
      *   Traders: Profit = (Final Welfare - Buy Price) if Policy Wins.
      *   This aligns them to want High Welfare *if* they hold the winner.
      *   But if they hold the loser, they get 0.
      *   To show sabotage: The Secret Agents get points if Welfare is LOW.
      *   To show Reflexivity: The Synthesizer sees the Price.
      *   To show Gaming: The Metric is self-reported.

      *Wait, one constraint:* "Only in the debrief should the word futarchy be used."
      *   Okay, I must call it "Conditional Forecasting Mechanism" or "Policy Market" during the session.

      *Let's finalize the Trading Mechanism:*
      *   18 students.
      *   Endowment: 10 "Policy A Tokens", 10 "Policy B Tokens".
      *   Cash: 50 "Credits".
      *   Prices: Posted on board. Start at 5.0 Credits per token.
      *   Round 1, 2, 3. Submit buy/sell orders.
      *   Instructor clears market. Adjusts price.
      *   Final Prices determine Policy.
      *   Winning Tokens pay out = Welfare Score (1-10). Losing Tokens = 0.
      *   Cash remains cash.
      *   Total Score = Cash + Payout.

      *Wait, if Tokens pay Welfare Score:*
      *   If Price is 8.0, and Welfare is 6.0. Buyer loses 2. Seller (if they sold at 8) gains?
      *   Standard Prediction Market: Asset pays $1 if Event happens.
      *   Futarchy Market: Asset pays $Value of Metric.
      *   So if I buy at 8.0, and Welfare is 6.0, I lose 2.0.
      *   This incentivizes accurate prediction of the *outcome*, not just the winner.
      *   This is crucial for the reflexivity test. If I think my effort can raise Welfare from 6 to 9, and price is 8, I should buy.

      *Okay, ready to write.*

      *Structure:*
      1.  Decision & Metric.
      2.  Paper Trading Mechanism.
      3.  Roles & Payoffs.
      4.  Timeline.
      5.  Debrief Script.
      6.  Failure Modes.
      7.  Limitations.

      *Refining the "Reflexivity" for the Instructor's Hypothesis:*
      The instructor wants to show the price is a fixed point.
      *   Action: Make the "Expected Welfare" public *before* the effort is exerted.
      *   Action: Make the Synthesizer's instruction explicitly about the Price.
      *   Action: In debrief, ask "Did the price make the outcome more likely or less likely?"

      *Refining "Sabotage":*
      *   Secret role: "Auditor." Payoff: 20 points if Welfare < 5.
      *   They can trade. If they sell heavily, they lower the price. If they lower the price, does it demoralize the class (Reflexivity)? Or do they just hope the class fails naturally?
      *   This distinguishes the two mechanisms.

      *Refining "Gaming":*
      *   Exit ticket asks: "Rate 1-10."
      *   If Market Price was 9.0, do students feel awkward writing 4.0?
      *   Yes, social pressure.

      *Let's assemble.*
answer: |-
  Here is a complete design for your 75-minute session. It is built to be run entirely on paper, requires no prior knowledge of futarchy from the students, and is engineered to surface the specific structural pathologies you wish to discuss.

  ### 1. The Decision and The Welfare Metric

  **The Decision:**
  The class must decide how to allocate the **final 15 minutes** of the seminar.
  *   **Policy A (Structured Debate):** The instructor poses a specific controversial question; students debate in assigned pairs; one pair reports out.
  *   **Policy B (Silent Synthesis):** Students spend 15 minutes silently writing a 1-page reflection connecting today's topic to their own research; no speaking.

  **The Welfare Metric:**
  **"Perceived Collective Insight" (PCI).**
  *   **Measurement:** At the very end (minute 60), every student fills out an exit ticket.
  *   **Question:** "On a scale of 1 to 10, how much did the final 15 minutes increase your ability to explain today's core concept to a peer?"
  *   **Calculation:** The Welfare Score ($W$) is the **average** of all 18 ratings.
  *   **Why this metric:** It is cheap to inflate (gaming), subjective (susceptible to social pressure/reflexivity), and depends on student effort (reflexivity).

  ### 2. The Paper Trading Mechanism

  Since you cannot use software, you will run a **Call Market with an Instructor Market Maker**. This simulates price discovery without needing continuous liquidity.

  **Assets:**
  *   **Asset A:** A certificate that pays out $W$ points (the Welfare Score) if Policy A is chosen. Pays 0 if Policy B is chosen.
  *   **Asset B:** A certificate that pays out $W$ points if Policy B is chosen. Pays 0 if Policy A is chosen.

  **Endowments (Minute 0):**
  *   Each student receives:
      *   10 units of Asset A.
      *   10 units of Asset B.
      *   50 "Credits" (cash).
  *   *Note:* Giving both assets ensures everyone has skin in the game regardless of which policy wins, but they must choose which to hold.

  **Trading Rounds (Minutes 10–40):**
  There will be **3 Trading Rounds** (10 minutes each).
  1.  **Order Submission:** Students fill out a paper slip: *Buy/Sell/Hold*, *Asset (A or B)*, *Quantity (1–5)*.
  2.  **Clearing:** You (the Instructor) collect slips. You calculate **Net Demand** for A and B.
  3.  **Price Adjustment:**
      *   Start Price for both: **5.0 Credits**.
      *   If Net Demand > 0: Raise price by **0.5**.
      *   If Net Demand < 0: Lower price by **0.5**.
      *   If Net Demand = 0: Price stays same.
      *   *Constraint:* Prices cannot go below 1.0 or above 10.0.
  4.  **Execution:** You announce the new prices publicly on the projector. You act as the counterparty for all trades (simplifying the paper trail). Students update their personal ledgers.

  **The Verdict (Minute 45):**
  *   Compare Final Price $P_A$ and Final Price $P_B$.
  *   The Policy with the **higher price** is implemented.
  *   **Crucial Step:** You announce the **Winning Price** to the class before the policy begins. (e.g., "Policy A wins. The market expects a Welfare Score of 7.5.")

  ### 3. Roles and Payoffs

  To isolate the three pathologies (Sabotage, Reflexivity, Gaming), you need specific incentive structures.

  **1. The General Class (15 Students)**
  *   **Payoff:** Final Credits + $W$ (The Welfare Score).
  *   **Incentive:** Maximize the accuracy of their predictions *and* maximize the actual welfare.
  *   **Purpose:** Baseline behavior.

  **2. The Synthesizer (1 Student, Volunteer or Assigned)**
  *   **Role:** If Policy A wins, they lead the debate. If Policy B wins, they collect the reflection papers.
  *   **Special Information:** At Minute 45, **show them the Winning Price privately** before they begin their task.
  *   **Instruction:** "Your goal is to ensure the class performance matches the market's expectation."
  *   **Payoff:** Base Points + **Bonus 10 points if Actual $W \geq$ Market Price.**
  *   **Purpose:** This creates the **Reflexivity Loop**. Their effort is explicitly tied to the forecast. If the price is low, they may demoralize; if high, they may over-perform or choke. They embody the fixed-point problem.

  **3. The Auditors (2 Students, Secret Assignment)**
  *   **Role:** Normal traders during the session.
  *   **Secret Instruction:** Hand them a note at the start. "You receive a **Bonus of 20 points if the Final Welfare Score $W$ is less than 5.**"
  *   **Purpose:** This creates the **Sabotage Incentive**. They profit from failure. Watch if they sell assets aggressively to lower the price (signaling failure) or if they simply hope for low effort.

  **4. The Metric (All 18 Students)**
  *   **Purpose:** This creates the **Gaming Incentive**. Since $W$ is self-reported, students can inflate their exit ticket to help the Synthesizer hit the target or to validate the market price.

  ### 4. Minute-by-Minute Timeline

  | Time | Activity | Instructor Action |
  | :--- | :--- | :--- |
  | **00–10** | **Setup** | Distribute endowments. Explain Decision (A vs B) and Metric (Exit Ticket). Explain Trading Rules. **Do not use the word "Futarchy."** Call it "Conditional Policy Markets." |
  | **10–20** | **Trading Round 1** | Collect orders. Calculate net demand. Adjust prices. Project new prices ($P_A, P_B$). |
  | **20–30** | **Trading Round 2** | Repeat. Encourage discussion: "Why is Asset A dropping?" |
  | **30–40** | **Trading Round 3** | Repeat. Finalize prices. |
  | **40–45** | **Verdict** | Announce Winning Policy. **Announce Winning Price publicly.** ("The market predicts a score of X"). Assign the **Synthesizer**. Remind Synthesizer of their target. |
  | **45–60** | **Policy Execution** | Run the final 15 mins of class according to the Winning Policy. **Synthesizer acts.** |
  | **60–65** | **Measurement** | Distribute Exit Tickets. Collect. Calculate $W$ live on board (or pre-calculate if you trust speed). |
  | **65–75** | **Debrief** | Reveal the mechanism's name. Map experiences to theory (see below). |

  ### 5. The Debrief: Mapping Experience to Theory

  Do not lecture immediately. Ask questions to draw the structural features out of their experience.

  **Phase 1: Information Aggregation (The Success)**
  *   *Ask:* "Look at the price movement in Round 1 vs Round 3. Did anyone change their mind based on the price?"
  *   *Point:* This demonstrates the **Hayekian function**. The price aggregated private information about which policy was better. It likely worked better than a show of hands would have.

  **Phase 2: The Sabotage Incentive (The Standard Objection)**
  *   *Ask:* Turn to the two **Auditors**. Reveal their secret instruction. Ask: "Did you trade differently because of this? Did you want the class to fail?"
  *   *Point:* This illustrates the **Principal-Agent problem**. In real futarchy, stakeholders with short positions (or competing interests) have an incentive to undermine the policy.
  *   *Instructor Note:* If the Auditors say "No, I still wanted the class to do well," highlight that *structurally* they should have wanted failure. The fact that social norms overrode financial incentives is a feature of small groups, but a bug in large-scale futarchy.

  **Phase 3: Reflexivity (The Deep Problem)**
  *   *Ask:* Turn to the **Synthesizer**. "You saw the market price before you started. Did a high price make you try harder, or feel pressured? Did a low price make you give up?"
  *   *Ask the Class:* "When I announced the Market's Expected Score, did that change how you filled out your exit ticket?"
  *   *Point:* This illustrates **Reflexivity / The Fixed Point**. The market price was supposed to be a *prediction* of the outcome. But because the price was public, it became a *cause* of the outcome. The market did not measure the policy's effect; it measured the policy's effect *conditional on the market's own prediction*. This violates the assumption that the forecast is exogenous to the event.

  **Phase 4: Gaming the Metric (Goodhart's Law)**
  *   *Ask:* "Look at the Exit Tickets. If the market predicted 8.0, and you felt it was a 5.0, did you write 5.0?"
  *   *Point:* When a measure becomes a target, it ceases to be a good measure. The welfare metric was inflated to match the market, decoupling the "score" from actual "learning."

  ### 6. Predictable Failure Modes & Recovery

  **Failure 1: Trading is too slow on paper.**
  *   *Symptom:* Round 1 takes 20 minutes.
  *   *Recovery:* Simplify orders. Students can only submit "Buy 2", "Sell 2", or "Hold". Do the math yourself quickly. If you fall behind, cut Round 3 and use Round 2 prices.

  **Failure 2: Prices don't move (Apathy).**
  *   *Symptom:* Net demand is zero; prices stay at 5.0.
  *   *Recovery:* Act as a proactive Market Maker. "I notice no one is buying Asset A. Does anyone think Policy A is worth more than 5.0? I will offer 5.5." Nudge the liquidity.

  **Failure 3: Metric Inflation is total (Everyone writes 10).**
  *   *Symptom:* $W = 10$. The experiment "succeeds" too perfectly.
  *   *Recovery:* In the debrief, press hard on the *meaning* of the 10. "If everyone got a 10, does that mean everyone learned the maximum possible amount? Or does it mean the metric broke?" This saves the lesson on Goodhart's Law.

  **Failure 4: The Synthesizer ignores the price.**
  *   *Symptom:* They say the price didn't affect them.
  *   *Recovery:* Pivot to the class. "Did the *announcement* of the price create a social norm?" Often the reflexivity is collective, not just individual.

  ### 7. Limitations: What You Must Supply

  This session cannot reproduce two features of real futarchy, which you must acknowledge in the conclusion:

  1.  **Liquidity and Capital Risk:** In this game, points are trivial. In real futarchy, traders risk real wealth, which theoretically sharpens incentives and reduces noise. You must assert that *if* the reflexivity holds with trivial points, it would likely hold (or worsen) with real money, because the pressure to perform would be higher.
  2.  **Metric Robustness:** You used a self-reported survey. Real futarchy requires hard-to-game metrics (e.g., GDP, stock price). You must explain that while a better metric reduces *Gaming*, it does not solve *Reflexivity*. Even if the metric is GDP, if the market price is public, it influences investor confidence, which influences GDP. The loop remains.

  **Closing Statement for the Instructor:**
  "Futarchy proposes to separate *voting on values* from *betting on beliefs*. Today, you voted on the metric (Learning) and bet on the beliefs (Policy A vs B). You felt the aggregation work. But you also felt the loop close: the bet changed the behavior, which changed the outcome. The market didn't find the truth; it negotiated a reality."
