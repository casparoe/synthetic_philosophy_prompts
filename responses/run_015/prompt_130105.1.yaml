  1. The Scenario
  In 2024, the National Institute of Conservation initiates the "Thorne Recovery Project" following the destruction of Elias Thorne's 1955 masterpiece, *Vesper Cycle 4*, in a vault fire. Thorne's estate provides a verified archive containing exact pigment formulas, underdrawing grids, and a sequential log of brushstroke orders, which the Institute's team uses to construct Object R, labeled explicitly as a "Reconstruction." Simultaneously, an unaffiliated artisan, using only high-resolution photographs and no archival access, produces Object F, marketed openly as a "Homage Copy." Both objects are stipulated to be perceptually identical to the lost original and to each other under all standard viewing conditions, including microscopic analysis, yet neither involves the artist's physical hand, and neither involves an intent to deceive the public regarding their provenance.

  2. Verdict Mapping
  The Deception-Based Account assigns high authenticity-value to both Object R and Object F because neither transaction involves a lie about origin; since the theory locates the defect of forgery exclusively in the intent to mislead, the transparent labeling of both objects renders them ethically and aesthetically equivalent to the original in terms of viewer engagement. The Causal-Connection Account assigns low authenticity-value to both Object R and Object F because neither object shares a physical history with Thorne's hand; since the theory posits that artistic value is transmitted through the causal chain of production, the absence of the artist's physical execution renders both objects ontologically deficient regardless of their transparency or archival fidelity. The Achieved-Intention Account assigns a intermediate value to Object R but a low value to Object F; it argues that while Object R realizes Thorne's specific material intentions via the instructions, it lacks the artist's agential achievement during execution, whereas Object F fails to realize the intention entirely, relying only on visual approximation.

  The precise points of divergence emerge clearly in these mappings. On Object R, the Deception Account (High) and the Achieved-Intention Account (Intermediate/Low) disagree because the former prioritizes the honesty of the presentation while the latter prioritizes the agency of the creator, creating a split where transparency does not guarantee full intentional realization. On Object F, the Causal-Connection Account (Low) and the Deception Account (High) disagree because the former penalizes the lack of physical lineage while the latter rewards the lack of fraudulent intent, isolating the variable of physical history from the variable of moral conduct. This structure ensures that no single theory can account for the intuitive distinctions between all three objects without contradicting its core commitment.

  3. Isolation Analysis
  The single structural feature that forces these explanations apart is the decoupling of perceptual identity from both causal history and deceptive intent. By stipulating that Object R and Object F are perceptually identical to the lost original, the scenario neutralizes aesthetic quality as a variable, forcing the theories to rely solely on their ontological criteria. By making both objects transparent (no deception), the scenario removes the moral penalty usually associated with forgery, isolating the Causal Account's reliance on physical history. By providing archival instructions for R but not F, the scenario introduces a gradient of intentional realization that splits the Intention Account from the binary judgments of the Deception and Causal accounts. Removing the stipulation of perceptual identity would collapse the distinction, as observers would revert to aesthetic judgment; removing the transparency condition would collapse the Deception Account into the Causal Account, as deception usually implies a break in causal history.

  4. Robustness Check
  If the artisan sells Object F deceptively as the original rather than openly as a copy, the Deception-Based Account must now assign low value to Object F due to the presence of a lie. In this modified scenario, the Deception Account and the Causal-Connection Account converge on Object F (both assign low value), as the object now fails both the honesty test and the physical history test. However, the split between the Deception Account and the Achieved-Intention Account regarding Object R remains intact, as Object R is still transparent (High for Deception) but lacks artist agency (Low/Intermediate for Intention). Consequently, the case no longer isolates the variable of physical history versus deceptive intent on Object F, as the two variables are now conflated in the verdict, reducing the thought experiment's ability to distinguish between those specific competing explanations.

  5. Defense of the Disadvantaged View
  The Deception-Based Account fares worst in this scenario because it cannot distinguish the value of Object R (archival reconstruction) from Object F (visual copy), treating both as equally valuable due to their transparency. A proponent of this view would attack the legitimacy of the case by challenging the stipulation of perfect perceptual identity, arguing that such identity is physically impossible to achieve without the original causal processes (e.g., pigment aging, tool micro-markings). They would claim that by stipulating away the material traces that usually allow observers to detect origin, the scenario artificially removes the very evidence that makes deception possible or impossible, rendering the theory vacuous. This attack succeeds without begging the question because it targets the empirical feasibility of the thought experiment's premises rather than the theoretical conclusion, asserting that a scenario built on physical impossibilities cannot validly test theories grounded in material reality.
