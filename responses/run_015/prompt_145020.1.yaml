prompt: |-
  Okay so I'm giving the toast at my old advisor Dr. Vasquez's retirement dinner next saturday and I'm kind of panicking. She's been working on Marx's views on automation since like the 80s, and about half the room are people who actually know what the Grundrisse is, and the other half are her nephews and cousins who just know she taught "something about robots taking jobs" and want to be proud of her. I just got into a stupid long arguement with my friend Marcus about whether Marx actually thought automation was gonna free everyone or just make exploitation sneakier, and Marcus kept saying "well if the machines do all the work then who's being exploited?" which misses the whole point but also kind of gets at why this is hard to talk about.

  The thing is, Elena's whole career has been about this one weird tension in Marx: he describes machinery as this thing that makes human labor technically unnecessary, but at the same time he insists that capital only survives by keeping that "unnecessary" labor around in a kind of hidden form. She always said it's not that robots replace workers, it's that they dissolve the line between the work you do to survive and the work capital takes for free, so you can't even point at the theft anymore. I need the toast to actually honor that idea — not just "she was smart about technology" — but if I start talking about real subsumption and the general intellect I'm gonna lose her family, and if I just say "she studied how automation changes work" I'm basically lying about what she did. Can you write me a five minute toast that does real work with that tension? It needs to land for the Marxists in the room — they should recognize she's being taken seriously — but also make sense to her relatives as something beautiful and not just jargon. And please don't make it sound like she proved Marx was right about some inevitable robot utopia, because she definitely didn't think that, and also don't use fake quotes from Marx. I want it to feel like I just finished arguing with Marcus and I'm trying to say what actually mattered about her work without either dumbing it down or turning it into a lecture.
