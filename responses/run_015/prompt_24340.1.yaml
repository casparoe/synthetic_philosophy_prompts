answer: |-
  **Tier 1: The Workable Core**
  **Kripke's minimal fixed-point account** and **Gupta–Belnap revision theory** belong here because they retain a single, unstratified truth predicate while minimizing deviations from classical logic to only the pathological sentences. Kripke sacrifices **bivalence** by allowing truth-value gaps for the Liar, whereas Gupta–Belnap sacrifices **stable truth values** for paradoxical sentences, but both preserve classical logic for the vast majority of grounded discourse.

  **Tier 2: Workable but Costly**
  **Tarski's stratified hierarchy** and **supervaluationism** land here because they achieve consistency only by imposing significant structural or semantic costs. Tarski preserves classical logic and explosion perfectly but sacrifices the **single unstratified predicate**, rendering the theory expressively incomplete for natural language; supervaluationism retains the single predicate but sacrifices **bivalence** and introduces technical complexity regarding precisifications that complicates the logic.

  **Tier 3: The Avoid List**
  **The dialetheist paraconsistent approach** and **deflationism** fall into this tier because they either abandon too much logic or abandon the theoretical project entirely. Dialetheism preserves the single predicate but sacrifices the **principle of explosion** (and non-contradiction), demanding a radical revision of inference I am unwilling to accept; deflationism avoids the paradox by denying there is any **substantive theory of truth** to be had, thus failing to engage the axis of preservation directly.

  **Comparative Cost of Preservation**
  Preserving (ii), full classical logic, is the more expensive option because it forces you to give up more of the rest of the apparatus than preserving (i). To maintain classical logic and explosion (as Tarski does), you must sacrifice the single unstratified predicate, which necessitates fracturing the language into a hierarchy that cannot express its own semantics; this destroys semantic closure, which is the primary motivation for seeking a *general* theory of truth in the first place. By contrast, preserving the single predicate (i) requires only local modifications to logic (such as gaps or revision) for paradoxical cases, leaving the global structure of the language and the universality of the truth predicate intact.
