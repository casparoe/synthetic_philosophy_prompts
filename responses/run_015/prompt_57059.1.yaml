answer: |-
  # Seminar Handout: Mapping Commitments on the *Pramāṇas*
  **Week 4: Epistemological Reductions**

  This decision tree sorts philosophical positions based on your intuitions about specific cognitive disputes, rather than your allegiance to a historical school (*darśana*). Start at the root and answer the four questions based on how you think knowledge works in the described cases.

  ### The Decision Tree

  **ROOT:** You accept that some beliefs constitute knowledge (*pramā*), and that not all knowledge arises directly from the senses (*pratyakṣa*).

  **NODE 1: The Missing Pot (*Anupalabdhi*)**
  When you look at a clear patch of ground and know "there is no pot here," is this knowledge generated by a unique instrument dedicated to grasping absence (*anupalabdhi*), or is it simply a form of perception (*pratyakṣa*) of the empty ground itself?
  *   **(A) It is a unique instrument of absence.** → Go to Node 2A.
  *   **(B) It is just perception (or inference).** → Go to Node 2B.

  **NODE 2A: The Stout Man (*Arthāpatti*)**
  *(Reached if you accepted Absence as unique)*
  Regarding the stout man who eats nothing by day: Is knowing he *must* eat at night a distinct cognitive event of postulation (*arthāpatti*), or is it merely an inference (*anumāna*) from effect (stoutness) to cause (night-eating)?
  *   **(A1) It is distinct postulation.** → Go to Node 3A.
  *   **(A2) It is just inference.** → Go to Node 3B. *(Note: Historically rare combination)*

  **NODE 2B: The Stout Man (*Arthāpatti*)**
  *(Reached if you reduced Absence to Perception)*
  Regarding the stout man who eats nothing by day: Is knowing he *must* eat at night a distinct cognitive event of postulation (*arthāpatti*), or is it merely an inference (*anumāna*) from effect to cause?
  *   **(B1) It is distinct postulation.** → Go to Node 3C.
  *   **(B2) It is just inference.** → Go to Node 3D.

  **NODE 3: The Trustworthy Speaker (*Śabda*)**
  *(Reached from 2A, 2B, 2C, or 2D)*
  When a trustworthy speaker tells you something beyond your experience, is the knowledge generated *by the words themselves* (*śabda*), or only by an *inference* about the speaker's reliability and intention?
  *   **(Yes) Words themselves generate knowledge.** → Go to Node 4.
  *   **(No) Only inference about the speaker.** → Go to Node 4 (Testimony Reduced).

  **NODE 4: The *Gavaya* (*Upamāna*)**
  *(Final Split)*
  When a forest-dweller is told "a *gavaya* is like a cow" and later identifies one on sight, have they gained knowledge via a distinct instrument of comparison (*upamāna*), or is this nothing beyond perception plus memory of the report?
  *   **(Yes) Distinct comparison.** → **LEAF**.
  *   **(No) Perception + Memory.** → **LEAF**.

  ---

  ### The Leaves: Epistemological Profiles

  **Leaf 1: The Maximalist (6 *Pramāṇas*)**
  *   **Path:** Absence (Unique) → Postulation (Unique) → Testimony (Unique) → Comparison (Unique).
  *   **Accepted Set:** *Pratyakṣa, Anumāna, Śabda, Upamāna, Arthāpatti, Anupalabdhi*.
  *   **Classical School:** **Bhāṭṭa Mīmāṃsā** (Kumārila) and **Advaita Vedānta** (Śaṅkara). *[Attribution Note: Advaita generally follows Bhāṭṭa epistemology here, though metaphysics differ.]*
  *   **Awkward Consequence:** You must defend an ontologically "heavy" worldview where absences and postulations are real enough to require their own cognitive tools, risking proliferation of entities.

  **Leaf 2: The Prābhākara (5 *Pramāṇas*)**
  *   **Path:** Absence (Reduced) → Postulation (Unique) → Testimony (Unique) → Comparison (Unique).
  *   **Accepted Set:** *Pratyakṣa, Anumāna, Śabda, Upamāna, Arthāpatti*.
  *   **Classical School:** **Prābhākara Mīmāṃsā**.
  *   **Awkward Consequence:** By denying a specific instrument for absence, you struggle to explain how we cognize error or non-existence without positing a "positive" object where there is none.

  **Leaf 3: The Naiyāyika (4 *Pramāṇas*)**
  *   **Path:** Absence (Reduced) → Postulation (Reduced) → Testimony (Unique) → Comparison (Unique).
  *   **Accepted Set:** *Pratyakṣa, Anumāna, Śabda, Upamāna*.
  *   **Classical School:** **Nyāya-Vaiśeṣika**.
  *   **Awkward Consequence:** You must argue that perceiving an empty ground is phenomenologically identical to perceiving a pot, or that "absence" is just a property of the ground, which strains common intuition about negation.

  **Leaf 4: The Sāṃkhya (3 *Pramāṇas*)**
  *   **Path:** Absence (Reduced) → Postulation (Reduced) → Testimony (Unique) → Comparison (Reduced).
  *   **Accepted Set:** *Pratyakṣa, Anumāna, Śabda*.
  *   **Classical School:** **Sāṃkhya**.
  *   **Awkward Consequence:** Reducing comparison to memory and perception makes it difficult to account for the novelty of learning new relations (like the *gavaya*) that were not strictly contained in the original report.

  **Leaf 5: The Buddhist Pragmatist (2 *Pramāṇas*)**
  *   **Path:** Absence (Reduced) → Postulation (Reduced) → Testimony (Reduced) → Comparison (Reduced).
  *   **Accepted Set:** *Pratyakṿa, Anumāna*.
  *   **Classical School:** **Buddhist Epistemologists** (Dignāga/Dharmakīrti).
  *   **Awkward Consequence:** You cannot treat scripture or testimony as inherently authoritative; all social knowledge must be validated by individual inference, which undermines the efficiency of linguistic transmission.

  *(Note: Paths leading to 2A/3B [Absence Unique, Postulation Reduced] are theoretically possible but historically unoccupied; see below.)*

  ---

  ### Unoccupied Combinations
  There are 16 possible binary paths (2⁴). The 5 leaves above are occupied. The remaining 11 combinations are unoccupied for the following reasons:

  1.  **Absence (Unique) / Postulation (Reduced) / [Any] / [Any]:**
      *   *Reason:* **Unattractive.** Historically, schools that posit a unique instrument for "missing data" (Absence) generally accept one for "missing explanation" (Postulation). Separating them creates an inconsistent criterion for non-perceptual cognition.
  2.  **Absence (Reduced) / Postulation (Unique) / Testimony (Reduced) / [Any]:**
      *   *Reason:* **Incoherent.** Postulation often relies on linguistic frameworks (e.g., "he eats at night"). If testimony is merely inference, postulation (which is structurally similar) is rarely defended as unique.
  3.  **Testimony (Unique) / Comparison (Reduced) / [Absence & Postulation Reduced]:**
      *   *Reason:* **Explored but rare.** (Some later Vedāntins). Usually grouped with Sāṃkhya (Leaf 4).
  4.  **Testimony (Reduced) / Comparison (Unique) / [Any]:**
      *   *Reason:* **Incoherent.** Comparison (*upamāna*) relies on a report ("like a cow"). If reports (Testimony) are only inference, Comparison cannot be a *sui generis* source; it collapses into inference + memory.
  5.  **All Reduced except Comparison:**
      *   *Reason:* **Incoherent.** (See above).
  6.  **All Unique except Testimony:**
      *   *Reason:* **Unattractive.** If one accepts the "extra" cognitive tools of Absence and Postulation, one almost invariably accepts the authority of language (Testimony) that frames these problems.
  7.  **Absence (Unique) / Testimony (Reduced):**
      *   *Reason:* **Unattractive.** Accepting a subtle instrument for absence usually correlates with a realist ontology that supports independent linguistic authority.
  8.  **Postulation (Unique) / Testimony (Reduced):**
      *   *Reason:* **Incoherent.** (See #2).
  9.  **Comparison (Unique) / Testimony (Reduced):**
      *   *Reason:* **Incoherent.** (See #4).
  10. **Comparison (Unique) / Postulation (Reduced) / Absence (Reduced) / Testimony (Reduced):**
      *   *Reason:* **Incoherent.** Isolating Comparison while reducing all other non-sensory tools is philosophically unstable.
  11. **Absence (Unique) / Postulation (Unique) / Testimony (Reduced) / Comparison (Reduced):**
      *   *Reason:* **Unexplored/Unattractive.** No school defends the reality of absence/postulation while denying the intrinsic validity of language.

  ---

  ### Indistinguishable Leaves
  **Leaf 1 (Bhāṭṭa Mīmāṃsā) and Leaf 1 (Advaita Vedānta).**
  This tree cannot separate **Bhāṭṭa Mīmāṃsā** from **Advaita Vedānta**. Both schools accept the full set of six *pramāṇas* and answer the reduction disputes identically. To distinguish them, you would need a fifth node regarding metaphysics (e.g., "Is the Veda eternal and authorless, or is Brahman the only reality?"), which falls outside epistemological commitments.
