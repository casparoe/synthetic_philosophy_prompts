      *   *Critique:* The user risks reifying the "mapping." A map isn't a territory. The careenium isn't a *thing* between symbol and substrate; it *is* the substrate arranged in a specific way.
      *   *Refinement:* To make it non-redundant, the careenium must be defined as the *stable structural constraints* that persist across momentary physical fluctuations. It's the "channel" cut into the substrate.

