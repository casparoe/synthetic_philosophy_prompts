answer: |-
  # The Karma-Desert Decision Tree

  ## Part 1: The Branch Nodes
  *The following eight questions constitute the structural nodes of the tree. In a live session, students traverse these forks to locate their intuitive position. No node references a specific tradition; they are phrased as blunt choices between competing moral intuitions.*

  **Node 1: The Unit of Accounting**
  Is the moral account held strictly by the individual, or can it be shared across a family, community, or nation?
  *   **Left:** Strictly Individual.
  *   **Right:** Shared/Collective.

  **Node 2: The Subject of Experience**
  Must the person suffering the consequence be numerically identical to the one who acted (the same soul), or is it enough that they are causally connected like a flame lighting a candle?
  *   **Left:** Same Persisting Subject.
  *   **Right:** Causal Stream Only.

  **Node 3: The Status of Birth**
  Can the circumstances of your birth (health, wealth, caste, status) count as the payment for a previous account?
  *   **Left:** Yes, Birth is Payoff.
  *   **Right:** No, Birth is Neutral.

  **Node 4: The Locus of Control**
  Does the moral account depend on what you intended, or on what actually happened in the world?
  *   **Left:** Intention Only.
  *   **Right:** Outcome Matters.

  **Node 5: The Mechanism of Payoff**
  Is the consequence produced automatically by the nature of the act itself, or is it assigned by an external judge or moral law?
  *   **Left:** Automatic/Internal.
  *   **Right:** Adjudicated/External.

  **Node 6: The Purpose of Suffering**
  Is the suffering owed simply because the act happened (a fixed debt), or is it aimed at fixing a balance, teaching a lesson, or restoring harmony?
  *   **Left:** Fixed Debt (Retributive).
  *   **Right:** Correction/Balance (Therapeutic).

  **Node 7: Transferability**
  Can merit or demerit be transferred from one person to another to settle the account (e.g., through prayer, ritual, or sacrifice)?
  *   **Left:** Non-Transferable.
  *   **Right:** Transferable.

  **Node 8: Visibility of the Link**
  Must the link between the act and the consequence be observable in this life, or can it be hidden across lifetimes?
  *   **Left:** Observable (This Life).
  *   **Right:** Hidden (Cross-Life).

  ***

  ## Part 2: The Leaves (Occupied Positions)
  *The following leaves represent the stable combinations of answers actually defended in philosophical or religious traditions. Where a position is a composite of views, this is noted.*

  **Leaf 1: Mainstream Western Retributivism**
  *   **Path:** Individual | Same Subject | Birth Neutral | Intention | Adjudicated | Fixed Debt | Non-Transferable | Observable.
  *   **Label:** Liberal Retributivism / Legal Moralism.
  *   **Awkward Commitment:** It must accept that two people who intend the same harm but achieve different results due to luck are morally unequal.
  *   **Desert Status:** **Yes.** This is the baseline theory of desert.

  **Leaf 2: Orthodox Hindu Karma (Mīmāṃsā/Vedānta strain)**
  *   **Path:** Individual | Same Subject | Birth Payoff | Outcome/Intent Mix | Automatic/Law | Fixed Debt | Non-Transferable | Hidden.
  *   **Label:** Orthodox Karma Theory.
  *   **Awkward Commitment:** It implies a newborn infant is already a debtor, justifying social hierarchy as moral necessity.
  *   **Desert Status:** **Yes,** but stretched across multiple lifetimes.

  **Leaf 3: Buddhist Karma (Sautrāntika/Yogācāra strain)**
  *   **Path:** Individual | Causal Stream | Birth Payoff | Intention | Automatic | Correction/Balance | Non-Transferable | Hidden.
  *   **Label:** Buddhist Karma.
  *   **Awkward Commitment:** It denies there is a permanent 'self' to own the debt, yet insists the debt must be paid by the stream.
  *   **Desert Status:** **Debatable.** It functions more like causal hygiene than moral desert.

  **Leaf 4: Jain Karma**
  *   **Path:** Individual | Same Subject | Birth Payoff | Intention + Outcome | Automatic | Fixed Debt | Non-Transferable | Hidden.
  *   **Label:** Jainism.
  *   **Awkward Commitment:** It treats moral fault as a physical substance sticking to the soul, requiring extreme asceticism to scrub off.
  *   **Desert Status:** **Yes,** but materialised.

  **Leaf 5: Folk/Devotional Theism**
  *   **Path:** Collective | Same Subject | Birth Payoff | Outcome | Adjudicated (Gods) | Correction | Transferable | Hidden.
  *   **Label:** Folk Religion / Devotional Theism.
  *   **Awkward Commitment:** It allows the innocent to suffer for the guilty (and vice versa) depending on the whims of deity or family unity.
  *   **Desert Status:** **No.** This is a theory of providence or grace, not desert.

  **Leaf 6: Naturalistic/Psychological Karma**
  *   **Path:** Individual | Causal Stream | Birth Neutral | Intention | Automatic | Correction | Non-Transferable | Observable.
  *   **Label:** Secular Moral Psychology.
  *   **Awkward Commitment:** It cannot explain why bad people sometimes flourish and good people suffer, other than by redefining 'flourishing' internally.
  *   **Desert Status:** **No.** This is a theory of habit formation, not cosmic justice.

  **Leaf 7: Fatalism**
  *   **Path:** Individual | Same Subject | Birth Payoff | Outcome | Automatic | Fixed Debt | Non-Transferable | Hidden.
  *   **Label:** Hard Fatalism.
  *   **Awkward Commitment:** It removes agency entirely; if the outcome is fixed by past accounts, current intention is irrelevant.
  *   **Desert Status:** **No.** This eliminates the 'moral' from moral luck.

  ***

  ## Part 3: Empty Logical Space
  *The following combinations of answers are logically possible but remain unoccupied. The reasons for their emptiness reveal the structural pressures on the theory.*

  1.  **Collective + Same Subject + Non-Transferable.**
      *   **Status:** **Incoherent.** If the account is shared by a group, but the subject is strictly identical and payment cannot be transferred, the 'collective' unit dissolves. You cannot have joint liability without some mechanism of substitution.
  2.  **Automatic + Adjudicated.**
      *   **Status:** **Incoherent.** A process cannot be both a mindless causal law (like gravity) and a judged sentence (like a court verdict) simultaneously.
  3.  **Birth Payoff + Observable.**
      *   **Status:** **Unattractive.** If birth circumstances are payment for past acts, but the link must be observable in this life, one would need to see the past life to verify the justice. Without that evidence, it looks like blaming the victim without proof.
  4.  **Causal Stream + Fixed Debt + Transferable.**
      *   **Status:** **Unexplored.** If there is no permanent self, and debt is a fixed quantity, transferring it to another stream makes the 'debt' arbitrary. Why does Stream B owe for Stream A's fixed debt? No tradition combines radical no-self with merit transfer for *debt* (though some allow merit gifting for *benefit*).
  5.  **Intention Only + Birth Payoff.**
      *   **Status:** **Unstable.** If only intention matters, birth circumstances (which are unchosen outcomes) cannot logically serve as payment. This combination collapses under its own contradiction unless 'birth' is redefined as a choice of soul (which moves it to 'Same Subject').

  ***

  ## Part 4: Indistinguishable Leaves
  *The tree cannot separate the following pairs without introducing further technical distinctions beyond the scope of this instrument.*

  1.  **Orthodox Hindu Karma vs. Jain Karma.**
      *   **Reason:** Both occupy nearly identical space on this tree. The distinction lies in the metaphysics of *how* the karma sticks (subtle matter vs. impression), which Node 5 (Mechanism) blurs as 'Automatic'.
  2.  **Buddhist Karma vs. Naturalistic Karma.**
      *   **Reason:** The only difference is Node 8 (Visibility/Cross-Life). If a student is agnostic about rebirth but accepts the causal stream logic, they land in a zone that is functionally identical to Buddhist psychology without the metaphysics.

  ***

  ## Part 5: Seminar Plan (90 Minutes)

  **Objective:** To use the tree not as a lecture aid, but as a live mapping exercise that forces students to confront the costs of their intuitions regarding moral luck.

  **00:00 – 00:10: Introduction**
  *   Briefly recap the problem of moral luck (Nagel/Williams): We want to judge only what agents control, but outcomes matter.
  *   Introduce the tree as a diagnostic tool, not a history lesson. Explain that 'Karma' is not one thing, but a cluster of answers to these eight questions.

  **00:10 – 00:40: The Live Walkthrough (Nodes 1–8)**
  *   **Method:** Read each node question aloud. Ask for a show of hands for Left vs. Right.
  *   **Expected Splits:**
      *   *Node 1 (Unit):* Room will heavily favour **Individual**. (Western bias).
      *   *Node 2 (Subject):* Significant split. Many will hesitate at 'Same Soul' but fear 'Causal Stream' implies no responsibility.
      *   *Node 3 (Birth):* **Critical Moment.** Most will reject 'Birth is Payoff'. Use this to highlight why Western desert struggles with circumstantial luck (if birth isn't payment, why are we born unequal?).
      *   *Node 4 (Control):* Room will split. Retributivists say Intention; Consequentialists say Outcome.
      *   *Node 8 (Visibility):* Most will choose **Observable**. Use this to trap them: If justice must be observable, and birth is unequal, and birth isn't payment, then the universe is unjust.
  *   **Facilitation:** Do not validate answers. Simply tally them on the board to build a 'Class Profile'.

  **00:40 – 01:10: Leaf Analysis & The Moral Luck Trap**
  *   Compare the 'Class Profile' to **Leaf 1 (Western Retributivism)** and **Leaf 2/3 (Karma)**.
  *   **Discussion Question:** "The Class Profile likely rejects 'Birth as Payoff'. Does this mean you accept that some people start life morally disadvantaged through no fault of their own? If so, does your theory of desert collapse at the starting line?"
  *   **Discussion Question:** "The Karma leaves accept 'Birth as Payoff'. Does this solve moral luck, or does it just push the luck back into a previous life we cannot see (Node 8)?"
  *   **Key Insight:** Karma handles *circumstantial* luck by calling it *earned*, but at the cost of *epistemic* luck (we can't verify the claim). Western theory preserves epistemic clarity but fails on circumstantial luck.

  **01:10 – 01:25: Empty Space & Coherence**
  *   Point to one empty combination (e.g., **Intention Only + Birth Payoff**).
  *   Ask: "Why does nobody defend this?" Guide them to see that if only intention matters, you cannot be punished for where you were born. This reveals the internal logic of the systems.

  **01:25 – 01:30: Conclusion**
  *   Final vote: Has anyone moved from Leaf 1 to Leaf 3 (or vice versa) based on the coherence of the system rather than cultural familiarity?
  *   Closing thought: "Karma is not a magic solution to moral luck; it is a trade-off. It buys consistency in desert by selling verifiability."
