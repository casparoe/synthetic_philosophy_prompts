      *   **Tension D: Thin Red Line vs. Block/SR (6 vs. 1/2).**
          *   *Conflict:* TRL usually belongs to Branching Time (Open Future). Block Universe (2) usually implies a fixed future. If the future is real (2), is it "open"? TRL says one branch is *actual*. In a Block, all times are actual.
