      *   *Correction on User's Worry (C):* The user is right to be worried. If the agent can simulate the hardware, it can predict outputs. But can it *prove* them? If the language lacks `Prov`, it can't generate a *proof* to pass the gate. It can only generate a prediction. The gate requires a proof. So (C) holds *if* the gate is strict. I should note this nuance.
