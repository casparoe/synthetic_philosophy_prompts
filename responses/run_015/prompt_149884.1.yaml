      *   *Implication:* The Pathogen-Actor model is actually *less* "Agentive" by this specific definition than the Geophysical model, despite sounding more "alive." This is a strong insight to highlight. The "Actor" label for pathogens is often a metaphor for *entanglement*, whereas for geophysics it is a metaphor for *externality*.

