          2.  Treating geophysical disruptions (volcanoes, climate) as agentive forces.
      *   **Specific Criteria for Comparison:**
          1.  *Mechanism of Directional Influence:* How does the non-human cause drive change rather than just setting the stage?
          2.  *Boundary of Determinism:* Where does agency become determinism, and what is the defensive move to save human relevance?
          3.  *Social Vulnerability:* Is vulnerability intrinsic or externally imposed?
      *   **Synthetic Distinction Application:** Apply a new distinction:
          *   *Agentive Causation:* Non-human entity has a trajectory intelligible without reference to disrupted social structures.
          *   *Structural Exposure:* Outcome explained by pre-existing fragility revealed by the event.
      *   **Evaluation:**
          *   Which framing survives translation without distortion?
          *   Which must be reinterpreted?
          *   Is there residue? Does it indicate genuine non-human agency or anthropomorphizing artifacts?

  2.  **Part 1: Comparing the Two Historiographical Practices:**

      *   **Practice A: Pathogens as Historical Actors (e.g., McNeill, Crosby, recent "microbial history")**
          *   *(1) Mechanism:* Evolutionary dynamics (mutation, virulence). The pathogen "invades," "adapts," or "burns out." It creates demographic shocks that force labor shortages, state collapse, or religious shifts. It's active biological competition.
          *   *(2) Determinism Boundary:* If the pathogen *guarantees* a specific outcome (e.g., "Smallpox *caused* the fall of the Aztecs"), it's determinism.
          *   *Defensive Move:* "Susceptibility was shaped by prior isolation/social structure." (Human context matters for the *impact*, even if the bug is the *trigger*).
          *   *(3) Vulnerability:* Often treated as intrinsic (biological naivety) but increasingly seen as socially produced (urbanization, trade routes).

      *   **Practice B: Geophysical Disruptions as Agentive Forces (e.g., Climate History, Volcanology in History)**
          *   *(1) Mechanism:* Physical force/energy release. Ash blocks sun -> cooling -> crop failure -> famine -> migration. It's a physical chain reaction initiated by the earth.
          *   *(2) Determinism Boundary:* If the climate shift *makes* civilization collapse inevitable regardless of human adaptation.
          *   *Defensive Move:* "Resilience/Adaptation." Societies with better storage or governance survived; those without didn't. The climate provided the stress test, humans determined the result.
          *   *(3) Vulnerability:* Usually treated as externally imposed constraint (you can't control the weather), but the *impact* depends on infrastructure (granaries, irrigation).

  3.  **Part 2: Applying the Synthetic Distinction (Agentive Causation vs. Structural Exposure):**

      *   **Definitions:**
          *   *Agentive Causation:* The non-human thing has its own "goal" or trajectory (even if biological/physical) that drives history. It acts *upon* society.
          *   *Structural Exposure:* The event is a neutral stressor; the history is written by the weakness of the structure. The event is a mirror.

      *   **Translating Pathogen Framing:**
          *   *Current State:* Often leans heavily into "Agentive Causation" (The germ as conqueror).
          *   *Translation:* Can we view the plague as "Structural Exposure"? Yes, if we focus on why the trade routes allowed spread and why immune systems were compromised by malnutrition.
          *   *Distortion:* The biological evolution of the pathogen (antigenic shift) is hard to fit into "Structural Exposure." The pathogen *changes* independently of the social structure. This is a key point of friction.

      *   **Translating Geophysical Framing:**
          *   *Current State:* Often leans into "Agentive Causation" (Nature strikes back).
          *   *Translation:* Fits "Structural Exposure" very well. A volcano erupts; if you have no roof, you die. If you have a roof, you live. The eruption didn't "target" you.
          *   *Distortion:* Less distortion here. The physical event is truly independent.

      *   **Residue Analysis:**
          *   Is there residue? Yes, specifically in the pathogen case. Pathogens evolve *in response* to hosts (co-evolution). This looks like agency but is biological feedback.
          *   Is it genuine agency? No, it's biological mechanism.
          *   Is it anthropomorphizing? Yes, calling it an "actor" implies intent.

  4.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Define the scope. Acknowledge the "Non-Human Turn" in history.
      *   *Section 1: Comparison.* Use the three specific points requested.
          *   *Mechanism:* Pathogens = Biological invasion/evolution. Geophysical = Physical forcing/energy release.
