answer: |-
  This is a precise and philosophically rich observation. You have identified a gap in our vocabulary for argumentative pathology. The existing terms (bad faith, bullshitting, dogmatism, signaling) all fail because they either impute a psychological state you cannot verify (insincerity) or describe a cognitive bias (closed-mindedness) that doesn't capture the specific *structural* defect you are noticing: the severing of the link between *giving reasons* and *being bound by them*.

  There is no single established term that captures this exact configuration, though several concepts approach it from different angles. Below is an analysis of the near-misses, a proposal for a precise definition (including a coinage), an application to your test cases, and an address of the epistemic problem.

  ### 1. The Neighbours (Why existing terms fail)

  *   **Motivated Reasoning / Identity-Protective Cognition:** (Dan Kahan et al.) This explains *why* the person doesn't move (the conclusion protects their identity), but it describes a subconscious cognitive bias. Your subjects are often consciously competent and sincere. They aren't failing to process; they are failing to *submit*.
  *   **Cheap Talk:** (Game Theory) This captures the "audience" aspect, but as you noted, the defect isn't that the words are costless, but that the *outcome* is costless.
  *   **Eristic Argument:** (Schopenhauer) This implies an intent to win. Your subjects may not care about winning; they care about *maintaining position* or *discharging a role*.
  *   **Bullshitting:** (Frankfurt) This implies indifference to truth. Your subjects care deeply about truth, just not about truth *as adjudicated by this specific exchange*.
  *   **Immunization Strategies:** (Popper/Adorno) This is the closest existing concept. It describes protecting a theory from falsification. However, it usually applies to the *theory* itself, not the *arguer's stance within a dialogue*.

  ### 2. A Proposed Concept: Dialectical Unbinding

  I propose we call this phenomenon **Dialectical Unbinding**.

  **Definition:** *Dialectical Unbinding* occurs when an agent participates in the form of a rational exchange (offering reasons, acknowledging counter-claims) while implicitly severing the normative commitment that normally binds a reason-giver to the outcome of that exchange.

  It is a violation of the "deontic scorekeeping" of argument (to use Robert Brandom's terminology). When you assert a claim in a dialogue, you undertake a **commitment** (you believe it) and a **liability** (you must revise it if defeated by better reasons). The unbound arguer claims the commitment but evades the liability.

  **The Relationship Between the Two Parts:**
  You asked whether the audience-orientation (Part 2) is the mechanism or symptom of the unwillingness to be bound (Part 1).
  *   **Part 1 (Unbinding) is the constitutive defect.** It is the internal stance that nothing in the room has authority.
  *   **Part 2 (Audience) is the strategic exploitation.** Because the arguer knows the interlocutor cannot move them, the interlocutor ceases to be the target. The argument becomes a performance *for* the record or the tribe, *using* the interlocutor as a prop.
  *   **Causal Link:** Part 1 enables Part 2. If you were bound by the exchange, you would be forced to address the interlocutor (who holds the counter-evidence). Because you are unbound, you are free to address the audience.

  ### 3. Testing the Definition

  Here is how **Dialectical Unbinding** sorts your specific cases. The key differentiator is whether the lack of binding is **explicit/role-based** (legitimate) or **implicit/norm-violating** (the failure mode).

  | Case | Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **Lawyer arguing a brief** | **Not Unbinding** | The lack of binding is *explicit*. The court knows the lawyer is role-bound to the client. The "audience" (judge) knows the rules of the game. |
  | **Minister reading a line** | **Not Unbinding** | Similar to the lawyer. They are a mouthpiece. The expectation of personal malleability is not present. |
  | **Devil's Advocate** | **Not Unbinding** | Their role is to test the argument, not hold it. They are explicitly unbound from the conclusion. |
  | **Teacher examining student** | **Not Unbinding** | The teacher is an adjudicator, not a participant. They are bound by *standards*, not by the student's arguments. |
  | **Undecided person** | **Not Unbinding** | They are *maximally bound*. They have staked their current ignorance on the outcome. They are waiting to be moved. |
  | **Stakes a concession never intended to defend** | **Insincerity (Bad Faith)** | This is lying. Dialectical Unbinding allows for sincerity; this is active deception about one's commitments. |
  | **Stakes something real but privately** | **Hidden Stakes** | This is not Unbinding, but **Asymmetric Risk**. They are bound, but the interlocutor cannot see the leash. This is frustrating, but epistemically distinct from Unbinding. |
  | **Your Committee/Online Examples** | **Dialectical Unbinding** | They present as open inquirers (implicitly claiming the norm of dialogue) but operate as closed systems. The violation is the mismatch between the *form* of inquiry and the *function* of fortification. |

  ### 4. The Epistemic Question

  You ask: *What could count as evidence for or against it, and is the accusation responsibly makeable?*

  This is the hardest part. Because Dialectical Unbinding is defined by a counterfactual ("They *would not* have changed their mind even if..."), it is inherently difficult to prove in a single instance. However, it is not impossible to evidence.

  **A. Evidence of Unbinding (The Falsification Test)**
  The most robust evidence is the **refusal to specify falsification conditions**.
  In a bound argument, an arguer can typically answer: "If X were shown to be false, I would abandon this view."
  *   **Evidence For:** When pressed, the unbound arguer cannot name a specific piece of evidence that would settle the matter, or they move the goalposts recursively (the "No True Scotsman" of evidence).
  *   **Evidence Against:** If the arguer can specify, in advance, what would change their mind, they are arguably bound, even if they haven't changed their mind *yet*.

  **B. The Pattern of "Exhaustion without Resolution"**
  Dialectical Unbinding creates a specific texture in long disputes:
  *   **High Information, Low Movement:** The parties exchange more data than is necessary for a decision, yet the distance between views does not shrink.
  *   **Procedural Perfection, Substantive Stasis:** The argument follows all the rules (no fallacies, accurate steel-manning) but functions like a wall.

  **C. Is the Accusation Responsible?**
  Accusing someone of Dialectical Unbinding is a **meta-argument**. It stakes a claim about *their* stance. Therefore, it is liable to the same critique (i.e., "You are just saying I'm unbound because you can't defeat me").
  To make this accusation responsibly, you must:
  1.  **Make your own binding explicit:** State clearly what would change *your* mind. This establishes that you are playing the bound game.
  2.  **Request falsification conditions:** Ask, "What evidence would cause you to revise this?" If they cannot answer, you have evidence of Unbinding without needing to read their mind.
  3.  **Avoid psychological claims:** Do not say "You don't care about truth." Say "This exchange does not appear to have authority over your conclusion." Describe the *structure*, not the *soul*.

  ### Summary

  The phenomenon is **Dialectical Unbinding**.
  It is distinct from insincerity because the arguer may believe their claims.
  It is distinct from dogmatism because they may be open to evidence outside the specific dialogue.
  It is the **performance of reason-giving without the liability of reason-receiving**.

  It is a responsible charge only when supported by the arguer's inability to specify the conditions under which they would be wrong. If they cannot tell you what would defeat them, they have already admitted they are unbound.
