answer: |-
  Here is a framework designed to meet your requirements: it separates the three distinctions you outlined, accounts for the shape of standing, and provides a principle precise enough for application, while identifying where your intuitions may be conflating distinct concepts.

  ### Part 1: The Shape of Standing

  Before stating the principle, we must define the ontology of the thing you are measuring.

  1.  **Scalar vs. Threshold:** Standing is **scalar in nature but threshold-dependent in function**.
      *   *Scalar:* You can have more or less moral authority (Case 3: *Diminished*; Case 2: *Enhanced*).
      *   *Threshold:* To successfully perform the speech act of *blame* (as opposed to mere criticism or warning), you must cross a minimum threshold of authority. Below this, the act misfires.
  2.  **Forfeiture vs. Diminution:** It is primarily **forfeiture**. You forfeit the right to hold another accountable for a norm you demonstrate you do not regard as binding. However, this forfeiture can be partial (diminished standing) if the lack of commitment is ambiguous or counterfactual.
  3.  **Normative Power vs. Felicity Condition:** Standing is a **felicity condition on the speech act of blaming**. If you lack standing, you are not necessarily saying something *false* (the target may indeed be blameworthy), but you are doing something *unauthorized*. It is like a judge recusing themselves: the verdict might be legally correct, but if the judge is bribed, the verdict is void.
  4.  **Objective Facts:** Standing depends on **objective facts about the blamer**, not their beliefs (Case 10). Self-deception does not restore standing because standing is a social status, not an internal state.
  5.  **Waiver:** The target **cannot waive** the standing defect regarding *blame*. If I say, "You can yell at me even though you do the same thing," you still lack the standing to *blame*. However, my invitation changes the nature of the act from *blame* (holding accountable) to *consultation* (requesting insight). This bypasses the standing requirement rather than curing it.

  ### Part 2: The Principle

  **The Normative Commitment Principle**

  An agent $A$ has standing to blame agent $B$ for violating norm $N$ if and only if:

  1.  **Commitment Condition:** $A$ manifests a sufficient current commitment to the value underlying $N$.
      *   *Past violations of $N$ do not negate commitment if $A$ has acknowledged them and made amends (Case 2).*
      *   *Current struggle against $N$ manifests commitment to the value; unrepentant violation manifests rejection of the value (Case 1 vs. Case 9).*
      *   *Counterfactual willingness to violate $N$ indicates weak commitment, diminishing standing (Case 3).*
  2.  **Clean Hands Condition:** $A$ is not causally complicit in $B$'s specific violation of $N$.
      *   *If $A$ created the conditions that made $B$'s violation necessary or inevitable, $A$ lacks standing (Case 8).*
  3.  **Role Condition:** If $A$ acts in an institutional capacity, standing is determined by the constitutive rules of that role, not $A$'s personal history, provided $A$ applies the rules impartially.
      *   *Exception: In relational roles based on welfare or exemplarity (e.g., parenting), personal congruence is required (Case 6 vs. Case 7).*
  4.  **Proportionality Condition:** $A$'s own violations of $N$ (or relevantly similar norms) must not be of such significantly greater magnitude that the blame constitutes a disproportionate assertion of authority (Case 12a vs. 12b).
  5.  **General Authority Condition:** $A$ must not demonstrate a global disregard for normative constraints such that their appeal to any specific norm is rendered unintelligible as a moral address (Case 5).

  **Why Hypocritical Blame is Bad (The Theoretical Payoff):**
  On this account, hypocritical blame is not just annoying; it is a **category error**. Blame is an appeal to a shared normative community. By blaming, you assert, "We both answer to this norm." If you are unrepentantly violating it, your assertion is false. You are attempting to wield a norm as a weapon against another while exempting yourself from its authority. This undermines the very possibility of normative community, which is why it feels like a distinct moral wrong, not just a tactical error.

  ### Part 3: Application to Your Cases (and Conflicts)

  This principle accommodates 10 of your 12 verdicts directly. It forces a choice on two.

  **Accommodated Verdicts:**
  *   **Case 1 (Liar):** Fails Commitment Condition (unrepentant). **No Standing.**
  *   **Case 2 (Reformed):** Meets Commitment Condition (amends made). **Full Standing.**
  *   **Case 3 (Modal):** Fails Commitment Condition (counterfactual weakness). **Diminished.**
  *   **Case 4 (Unrelated Vice):** Meets Commitment Condition (honesty norm upheld). **Full Standing.**
  *   **Case 6 (Referee):** Meets Role Condition (constitutive rules). **Full Standing.**
  *   **Case 8 (Deadline):** Fails Clean Hands Condition (causal complicity). **No Standing.**
  *   **Case 9 (Struggler):** Meets Commitment Condition (struggle = commitment to value). **Full Standing.**
  *   **Case 10 (Self-Deceived):** Objective facts apply (Commitment Condition). **Diminished.**
  *   **Case 11 (Hypocrite on Hypocrisy):** This is a second-order norm. To blame for grandstanding is to appeal to sincerity. Even a grandstander can value sincerity in that moment. However, strictly speaking, this is often **Full Standing** because the alternative is that *no one* can blame hypocrisy.
  *   **Case 12a/b (Magnitude):** Meets Proportionality Condition. **12a Full / 12b No.**

  **Forced Choices (Where you must abandon a verdict):**

  *   **Conflict 1: Case 4 (Unrelated Vice) vs. Case 5 (General Wreck).**
      *   *Your Verdicts:* Case 4 = Full; Case 5 = No.
      *   *The Tension:* If specificity protects standing (Case 4), why does general badness destroy it (Case 5)?
      *   *The Principle's Ruling:* The **General Authority Condition** supports Case 5. If an agent shows they recognize *no* normative authority, they cannot speak for *any* norm. Case 4 works because the blamer values *Honesty*, even if they don't value *Time*. Case 5 fails because Sven values *nothing*.
      *   *Recommendation:* Keep Case 5. Abandon Case 4 *if* the "unrelated vice" is part of a pattern of global normative disregard. If the colleague is merely selfish with time but respects rules, Case 4 stands. If they are a "general wreck" regarding obligations, Case 5 applies. The distinction is **Global Normative Nihilism vs. Local Failing**.
  *   **Conflict 2: Case 6 (Referee) vs. Case 7 (Smoking Parent).**
      *   *Your Verdicts:* Case 6 = Full; Case 7 = No.
      *   *The Tension:* Both are roles. Why does one insulate and the other not?
      *   *The Principle's Ruling:* The **Role Condition** distinguishes *Constitutive Rules* (Referee) from *Welfare Norms* (Parent). A referee enforces the game's existence; a parent guides a life. You can officiate a game you play poorly; you cannot guide a life you are ruining.
      *   *Recommendation:* Keep both. The principle clarifies *why*: The Referee is an agent of the *League*, not a moral exemplar. The Parent is an agent of *Care*, which requires exemplarity.

  **Confounded Reactions (Standing vs. Utility/Character):**
  *   **Case 3 (Modal Hypocrite):** You gave *Diminished Standing*. I suspect you are tracking **Utility**, not Standing. Facts about counterfactuals (what he *would* do) are unknowable to the target. If standing is a social status, it depends on *actual* acts. If he hasn't done it, his standing is technically full, even if his character is weak. I would overturn this to **Full Standing**, noting that his *credibility* is low, but his *authority* remains.
  *   **Case 11 (Hypocrite on Hypocrisy):** You gave *Full Standing*. This is correct, but be aware: you are tracking **Logical Necessity**, not moral cleanliness. It is an exception because the norm being enforced (sincerity) is the precondition for blame itself.

  ### Part 4: The Three New Cases

  Applying the **Normative Commitment Principle** strictly:

  **a. Two people guilty of the same failing blame each other.**
  *   **Verdict:** **Neither has standing.**
  *   **Reasoning:** Both fail the Commitment Condition. The fact that one spoke first is procedural, not normative. Mutual assured destruction of standing is the result. In mediation, you must intervene not to decide who is right, but to point out that *neither* is positioned to hold the other accountable. They can share struggles (Case 9), but they cannot blame.

  **b. Two people with identical clean records (One untempted, one resisted temptation).**
  *   **Verdict:** **The resister has equal or greater standing.**
  *   **Reasoning:** Standing tracks commitment to the *value*, not just luck. The person who resisted temptation has demonstrated a stronger active commitment to the norm than the person who never faced the test. Effort at restraint *does* work in standing. It proves the norm is binding for them.

  **c. A hypocrite who blames only because the target asked him to.**
  *   **Verdict:** **Full Standing (but the act is not Blame).**
  *   **Reasoning:** As noted in the "Waiver" section, the request changes the speech act. It is no longer "Blame" (unilateral accountability), it is "Consultation" (collaborative improvement). The standing requirement for Consultation is *expertise/experience*, not moral cleanliness. The hypocrite has experience with the failing. Therefore, the defect is cured, not because standing was restored, but because the requirement was bypassed.

  ### Part 5: Summary for the Mediation Room

  When you are in the room, do not look for "hypocrisy" in the abstract. Look for **Commitment**.

  1.  **Ask:** "Does the person speaking act as though this rule matters?"
      *   If yes (even if they struggle): They have standing.
      *   If no (they break it unrepentantly): They lack standing.
  2.  **Ask:** "Did the speaker build the trap?"
      *   If yes: They lack standing (Clean Hands).
  3.  **Ask:** "Are they speaking for the Rule or for Themselves?"
      *   If Rule (Referee): Personal history is irrelevant.
      *   If Themselves (Parent/Peer): Personal history is central.

  **The One Principle to Keep:**
  *You forfeit the right to hold others to a standard that you demonstrate you do not regard as binding upon yourself, unless you are acting as an impartial agent of a constitutive rule, or unless you have repented of your own violation.*

  This explains why the Reformed Liar (Case 2) speaks louder than the Honest Naif: the Reformed Liar has reaffirmed the binding nature of the norm after testing it. It explains why the Smoking Parent (Case 7) fails: they demonstrate the norm is not binding on them, so they cannot bind the child. It explains why the Referee (Case 6) succeeds: they are not binding the player to the Ref's personal conduct, but to the Game's constitution.
