answer: |-
  My dear friend,

  It gives me no small pleasure to learn that my little contrivance has found its way into your hands, and what is more, that you are putting it to use. I always regarded that book not as a scripture, but as a tool—much like a carpenter's level. If the bubble centers, the work is true; if not, one adjusts. It matters little if the wood is oak or pine, so long as the level serves the purpose.

  You ask if you have broken the chain by substituting "Attention Stewardship" for Chastity. I say to you: no. The specific vices we battle may change with the times, but the nature of the human heart remains much the same. In my day, the distractions were gossip at the coffee house, lengthy correspondences that led nowhere, or the vanity of dress. In yours, it appears these "messages" and "news" serve the same master: they fragment the mind and feed the ego.

  You see, Chastity was placed where it was to cool the passions and check a certain pride in one's own conduct and appearance, thereby preparing the ground for Humility. If a man is a slave to his impulses, he cannot be humble, for he is too busy serving himself. Consider your Attention Stewardship. If your mind is pulled in every direction by the demands of others, you are reactive, not reflective. A scattered mind is a proud mind, believing itself essential to all things at once. To steward your attention is to say, "I am not so important that I must answer every call immediately." It creates the quiet space necessary for Humility to take root. So, the chain holds. You have merely updated the enemy to fit the current battlefield.

  As to your second observation regarding Order and Silence—I know that cascade well. Too well.

  I must confess, of all the virtues, Order was the one that gave me the most trouble. I never could quite bring it to perfection. I found that when my papers were in disarray, or my tools misplaced, my temper grew short. A man surrounded by chaos feels a constant, low vexation in his spirit. And what is the outlet for a vexed spirit? Often, it is the tongue. When things are not in their places, we speak to complain, we speak to blame others for the confusion, or we speak rashly to clear the air. Thus, failing Order makes failing Silence almost inevitable. It is not coincidence; it is the natural friction of a disordered life.

  I recall when I first drew up this list, I was quite proud of my arrangement. But a friend of mine, a Quaker, kindly informed me that I was generally thought proud. He told me my pride showed itself in conversation, that I was not content merely to be right, but must be dogmatic. That is why Humility sits last. I added it to the end, and I made it my habit to forbid myself all direct contradiction of the sentiments of others. Even then, I cannot claim I mastered it. I became better at hiding it, perhaps, but the impulse remained.

  Do not be discouraged if your book shows black marks. I found myself far more full of faults than I imagined. I was like a man buying an axe from a smith. The whole surface was to be as bright as the edge. The smith agreed to grind it if the man would turn the wheel. The man turned and turned, until he was weary, but when he looked, the axe was still speckled. He decided he preferred a speckled axe.

  So it is with virtue. We may never scrub away every spot. But if you keep the book, and watch the cascade from Order to Silence, or from Attention to Humility, you will find yourself better than you were. And that, in the end, is the only perfection within our reach.

  Keep turning the wheel, my friend.

  Yours, &c.

  B. Franklin
