answer: |-
  This is a classic case where a simplified "philosophy blog" summary has hardened into a myth. Your skepticism is well-founded: while your friend has captured the *gist* of Popper's early criticism, the narrative about *why* Popper changed his mind (bullying) and the equivalence of "metaphysical" with "unscientific nonsense" are significant distortions.

  Here is an audit of your friend's summary, separating settled textual facts from speculative interpretations and ongoing philosophical debates.

  ### 1. The Tautology Claim
  **Verdict: Accurate representation of Popper's early view, but incomplete context.**

  *   **The Text:** In a 1974 lecture at Darwin College, Cambridge (published as "Scientific Reduction and the Essential Incompleteness of All Science"), Popper explicitly stated: "I have come to the conclusion that Darwinism is not a testable scientific theory, but a metaphysical research programme."
  *   **The Reasoning:** Popper's worry was indeed the "survival of the fittest" formulation. If "fitness" is defined solely by "survival and reproduction," then the statement "the fittest survive" becomes "those who survive, survive." This looks like a logical tautology (true by definition) rather than an empirical claim that could be proven false.
  *   **The Nuance:** Popper did not claim evolutionary theory was *false* or *meaningless*. He claimed it lacked the specific logical structure of physics (i.e., universal laws that forbid certain outcomes).

  ### 2. "Metaphysical" vs. "Unscientific"
  **Verdict: Your friend is conflating terms Popper kept distinct. This is the biggest error in their summary.**

  *   **Settled Interpretation:** In Popper's philosophy, "metaphysical" does **not** mean "nonsense" or "pseudoscience" (like astrology). It means "not currently empirically testable."
  *   **Popper's View:** Popper believed metaphysical ideas were often essential precursors to science. They provide the conceptual framework within which testable hypotheses are built.
  *   **The Error:** Your friend treats "metaphysical research programme" as an insult equivalent to "not real science." For Popper, calling something metaphysical was a logical classification, not necessarily a dismissal of its value. However, for a theory to be *empirical science* in Popper's strict demarcation, it must be falsifiable. So, when Popper called Darwinism metaphysical, he was saying it wasn't *empirical science yet*, not that it was garbage.
  *   **Why it matters:** If Popper thought it was merely metaphysical, he could still value it highly. Your friend's claim that Popper thought it was "useless" contradicts Popper's actual respect for evolutionary biology.

  ### 3. The Recantation and the "Bullying" Narrative
  **Verdict: The recantation is fact; the "bullying" claim is unsupported speculation.**

  *   **The Fact:** Popper did publicly reverse his position. In his autobiography *Unended Quest* (1976) and a 1978 essay ("Natural Selection and the Emergence of Mind"), he wrote: "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have the opportunity to make a recantation."
  *   **The "Bullying" Claim:** There is **no textual evidence** in Popper's letters, diaries, or published works that he recanted due to social pressure or "bullying" by biologists.
      *   **Popper's Character:** Popper was notoriously combative and stubborn (he famously feuded with Wittgenstein and Adorno). The idea that he would back down simply to "save face" contradicts his established intellectual persona.
      *   **Source of the Myth:** This narrative is often propagated by critics of evolutionary theory (including some creationists) who want to suggest that evolutionary biologists cannot defend their theory on logical grounds and must rely on authority. It is also sometimes used by philosophers who dislike Popper to suggest his falsificationism was untenable.
      *   **Popper's Stated Reason:** Popper wrote that he realized while the *general principle* might look tautological, specific evolutionary hypotheses (e.g., about industrial melanism in moths, or antibiotic resistance) are highly testable. He distinguished between the abstract theory and concrete applications.

  ### 4. "Explains Every Outcome After the Fact"
  **Verdict: This is a genuine philosophical worry, but attributing it as Popper's "secret" view is mind-reading.**

  *   **The Worry:** This refers to the problem of "just-so stories." If a theory can explain *any* possible trait adaptation after it happens, is it actually predicting anything? This is a standard critique in philosophy of biology (often associated with Gould and Lewontin, not just Popper).
  *   **Popper's Public View:** In his later writings, Popper acknowledged this difficulty but concluded that evolutionary theory *does* make predictions (e.g., about the fossil record, genetic constraints, or what traits *cannot* evolve). Therefore, he concluded it *is* falsifiable.
  *   **The Speculation:** Claiming Popper "secretly" still held the opposite view is impossible to verify. We must judge philosophers by their published arguments. In his final decades, Popper treated evolutionary theory as a scientific, testable framework.

  ### 5. Falsifiability and Historical Sciences
  **Verdict: Your friend's conclusion is a debated philosophical point, not a settled fact about Popper.**

  *   **The Friend's Conclusion:** "Falsifiability is useless for historical sciences."
  *   **The Debate:** This is actually a strong critique of Popper that many philosophers of science accept, *but not because Popper lied about Darwin.*
      *   **The Issue:** Historical sciences (geology, cosmology, evolutionary biology) often rely on inference to the best explanation regarding unique past events, rather than universal laws that predict future events. Strict falsificationism struggles here.
      *   **Popper's Adjustment:** Popper's recantation on Darwinism was essentially him admitting that his strict criterion needed to accommodate theories that explain past data in testable ways, not just predict future lab results.
      *   **Consensus:** Most modern philosophers agree that falsificationism is too simple a demarcation criterion for all of science. However, they attribute this to the *limitations of the criterion*, not to Popper being "bullied" into applying it incorrectly to biology.

  ### Summary Table: Settled vs. Debated

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Popper called Darwinism a "metaphysical research programme."** | **Settled Fact** | He said this explicitly in the mid-1970s. |
  | **Popper meant "metaphysical" = "nonsense/pseudoscience."** | **False** | For Popper, metaphysics is meaningful, just not empirically testable *yet*. |
  | **Popper later recanted this view.** | **Settled Fact** | Published in *Unended Quest* (1976) and later essays. |
  | **Popper recanted because biologists "bullied" him.** | **Unsupported Speculation** | No evidence exists; contradicts Popper's biography and character. |
  | **Popper secretly still thought it was unfalsifiable.** | **Mind-Reading** | Cannot be verified; contradicts his final published works. |
  | **Falsifiability is problematic for historical sciences.** | **Debated/Consensus** | Many philosophers agree falsificationism is too narrow for history-heavy sciences, but this is a critique of the *tool*, not evidence of Popper's dishonesty. |

  ### Recommendation for Your Argument

  You can confidently tell your friend that the **"bullying" narrative is a myth**. It turns a philosophical correction into a psychological drama without evidence.

  You should also press them on the definition of **"metaphysical."** If they think Popper used that word to mean "false," they are misreading Popper's demarcation criterion. Popper's eventual position was that evolutionary theory *is* testable (e.g., if we found rabbit fossils in the Precambrian era, the theory would be falsified).

  **The strongest point you have:** Popper was willing to admit error. In *Unended Quest*, he frames his change of mind as a victory for the scientific method itself—he subjected his own philosophy to falsification and updated it when the evidence (the testability of specific evolutionary hypotheses) showed he was wrong. To claim he was "saving face" ignores that admitting error *was* his way of saving face.

  **The strongest point your friend has (which is valid):** Falsificationism *is* difficult to apply neatly to historical sciences. Popper struggled with this, and his initial classification of Darwinism as metaphysical highlights that struggle. But that shows a limitation in Popper's early philosophy, not a conspiracy among biologists.
