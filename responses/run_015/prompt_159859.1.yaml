answer: |-
  This is a strategic problem, not merely an intellectual one. You have a fixed budget, a fixed timeline, and a specific theory of change (influencing advocacy and regulation). Most academic moral philosophy fails your constraints because it optimises for theoretical consistency rather than policy leverage. Most animal welfare science fails because it optimises for measurable proxies without questioning the underlying moral ontology.

  Given your background and the foundation's goal, here is the defended ranking of your cruxes, the treatment of your suspicion, and the allocation of effort.

  ### The Ranking

  **1. The Phenomenological Structure (Your Suspicion)**
  **2. The Correlated-Uncertainty Problem (Crux 1)**
  **3. The Currency Problem (Crux 2)**
  **4. The Unit Question (Crux 3) — *Deprioritised***

  #### 1. Phenomenological Structure (Your Suspicion)
  **Rank:** First (Most Upstream)
  **Criteria:** Importance (Critical), Tractability (Moderate), Neglectedness (High).

  You asked if your suspicion is live and tractable. It is both, and it is the most upstream constraint. The standard model of welfare assumes a subject that integrates valenced states over time—a "narrative self" that suffers not just from immediate nociception but from anticipation, memory, and the frustration of preferences. If insects (or nematodes) lack the neural architecture for temporal integration of valence, then "suffering" for them is a series of disconnected negative events without cumulative harm.

  This is upstream of the **Currency Problem** because you cannot compare the "intensity" of a state that does not accumulate. It is upstream of **Correlated Uncertainty** because if the phenomenological structure differs by clade, the uncertainty is not just about *whether* they feel, but *what* feeling means for them.

  *   **Trade-off:** This is conceptually risky. If you fund this and the result is "insects are just like mammals," you have spent money confirming the status quo. However, if the result is "insects do not integrate valence," it drastically reduces the expected moral weight of invertebrates, solving the "astronomical numbers" problem without needing to resolve the correlation of uncertainty.
  *   **Policy Leverage:** Regulators write laws about "unnecessary suffering." If suffering is episodic rather than cumulative for certain species, welfare standards regarding duration of confinement or transport become irrelevant, shifting focus to acute slaughter methods only. This is a tangible regulatory change.

  #### 2. The Correlated-Uncertainty Problem
  **Rank:** Second
  **Criteria:** Importance (High), Tractability (High), Neglectedness (Moderate).

  This is the biggest lever for resource allocation. Currently, advocacy groups often default to a "precautionary principle" that treats uncertainty as independent, leading to a focus on invertebrates due to sheer numbers. If uncertainty is phylogenetically correlated (which biological evidence suggests it is), then the probability of sentience does not reset for every individual; it clusters by clade.

  *   **Trade-off:** This is more tractable than Phenomenological Structure because it relies on existing phylogenetic comparative methods and Bayesian modeling, which your ECRs can execute within five years. It is less upstream than Phenomenology because it assumes the *thing* being uncertain about (sentience/welfare) is uniform across clades.
  *   **Policy Leverage:** This directly answers the "Which species get attention" constraint. A robust model showing high correlation allows regulators to treat whole clades as "sentient" or "non-sentient" blocks, simplifying legislation. It prevents the "Pascal's Mugging" of insect numbers from drowning out vertebrate welfare.

  #### 3. The Currency Problem
  **Rank:** Third
  **Criteria:** Importance (Moderate), Tractability (Low), Neglectedness (Low).

  Once we know *who* counts (Crux 1 & 2) and *what* counting means for them (Phenomenology), we need to know *how much* they count. However, this is the least tractable within five years. Creating a cross-species scale of valence intensity is arguably impossible without a unified theory of consciousness. Proxies (cortisol, behavior) are species-specific adaptations, not universal metrics.

  *   **Trade-off:** Investing heavily here risks producing incommensurable data. A bee's stress hormone level cannot be directly mapped to a cow's.
  *   **Policy Leverage:** Low. Regulators rarely weigh the *intensity* of a pig's pain against a chicken's pain in law; they set standards per species. Solving this is useful for prioritisation between interventions (e.g., cage-free vs. gas killing), but less critical for the foundational question of inclusion.

  #### 4. The Unit Question
  **Rank:** Fourth (Deprioritised)
  **Criteria:** Importance (High), Tractability (Very Low), Neglectedness (Low).

  I recommend explicitly deprioritising this for this specific agenda. The question of whether death is a harm or whether population welfare offsets individual suffering is a normative ethical deadlock. Advocacy organisations are largely rights-based or individualist-welfarist; they will not accept "replaceability" arguments (that killing a happy animal is permissible if replaced by another) as a basis for policy.

  *   **Why Deprioritise:** You want to change what regulators prioritise. Law is inherently individualistic (rights, welfare per head). Trying to shift regulators to a population-level utilitarian view in five years is a category error. It creates friction with advocacy partners without yielding legislative text.
  *   **Exception:** The only tractable slice of this is "wild animal welfare" where population dynamics are unavoidable. But given the budget, stick to farmed and managed species where the individual is the legal unit.

  ### Regarding Speciesism and Marginal Cases
  You are correct to suspect this is no longer load-bearing. The argument from marginal cases has successfully pierced the academic consensus; the bottleneck is no longer *whether* speciesism is wrong, but *how* to operationalise moral status under uncertainty. Funding work on speciesism now is redundant. The fight has moved to epistemology (how do we know?) and measurement (how do we compare?), not ontology (do they matter?).

  ### Effort Split: Conceptual vs. Empirical

  **Split:** 40% Conceptual / 60% Empirical.

  **Reasoning:**
  Pure philosophy will not change regulators; they require data. Pure empirical work without conceptual rigour will produce the same speciesist proxies we currently have (e.g., assuming silence equals lack of pain).
  *   **Conceptual (40%):** Focus on the Phenomenological Structure and the statistical framing of Uncertainty. This defines *what* data is relevant.
  *   **Empirical (60%):** Focus on neuroethological markers of temporal integration and phylogenetic mapping of sentience proxies.

  **Team Structure (6-7 ECRs):**
  *   2 Philosophers of Biology/Mind (focused on Phenomenology and Uncertainty modeling).
  *   3 Comparative Neuroethologists (focused on integration mechanisms in insects vs. vertebrates).
  *   2 Statisticians/Ecologists (focused on phylogenetic correlation models).
  *   Budget remainder for pilot behavioural assays (e.g., testing if insects avoid contexts associated with past pain over time scales that imply integration).

  ### Evidence That Shifts the Ranking

  1.  **Move Phenomenology Down / Currency Up:** If early pilot data shows clear evidence of long-term valence integration in insects (e.g., persistent behavioural changes after injury that are not reflexive), the "Unit" and "Currency" problems become immediate bottlenecks.
  2.  **Move Uncertainty Up:** If the phylogenetic signal for sentience markers turns out to be weak (i.e., sentience evolves convergently and frequently), the Correlated-Uncertainty problem becomes the dominant risk, as we cannot generalise from model organisms.
  3.  **Move Unit Question Up:** If advocacy groups begin to seriously fund "wild animal welfare" interventions involving culling or contraception, the Unit Question becomes practical rather than theoretical. Monitor the funding landscape; if this shifts, reallocate.

  ### Summary of the Agenda

  **Title:** *Phylogenetic Welfare: Resolving Uncertainty and Phenomenology in Non-Vertebrate Sentience.*

  **Core Thesis:** We cannot prioritise interventions until we resolve whether the *structure* of invertebrate experience supports the concept of cumulative welfare, and whether uncertainty about sentience clusters phylogenetically.

  **Deliverables for Regulators/Advocates:**
  1.  A "Sentience Correlation Model" allowing regulators to assign status by clade rather than species, reducing assessment costs.
  2.  A "Temporal Integration Framework" distinguishing species capable of cumulative suffering from those subject only to acute nociception, refining slaughter and transport laws.
  3.  A deprioritisation of "net-positive population" arguments in favour of individual welfare standards, aligning with existing legal frameworks for faster adoption.

  This agenda uses your neuroethological background to attack the most upstream uncertainty (the nature of the subject) while using the foundation's capital to produce the statistical tools regulators need to act without waiting for perfect knowledge. It avoids the moral quagmires that stall policy and focuses on the epistemic bottlenecks that currently paralyse it.
