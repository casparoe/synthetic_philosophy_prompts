      *   *Continuous Spaces:* If I shift my position by $\epsilon$, does it break the symmetry? In differential games, an extra control input might destabilize a trajectory. *Requirement: Robustness to Perturbation.*
      *   *Epistemic Asymmetry:* If I know something you don't, copying your strategy might require me to reveal that I know it. *Requirement: Opacity of Agency.*
