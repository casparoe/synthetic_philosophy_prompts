  2.  **Analyze the Core Concept (Strategy Stealing):**
      *   *Classic Version:* Player 1 (P1) makes an arbitrary move. Player 2 (P2) has a winning strategy $S$. P1 pretends to be P2, using $S$ while ignoring the extra piece/move. If $S$ ever calls for playing on the occupied spot, P1 plays arbitrarily elsewhere. Since having *more* pieces/moves is never a disadvantage (monotonicity), P1 wins. Contradiction $\rightarrow$ P2 cannot have a winning strategy.
      *   *Key Assumptions in Classic Version:*
          1.  Symmetry (roles are interchangeable except for turn order).
          2.  Monotonicity (extra resources/moves are never harmful).
          3.  Perfect Information (you know the state).
          4.  Discrete/Finite (to ensure the "arbitrary move" doesn't break the strategy logic).
          5.  Determinism (strategies map states to moves reliably).

  3.  **Brainstorming Extensions & Failures (The "What Goes Wrong" phase):**
