answer: |-
  ### Generalized Strategy-Stealing Desiderata

  To extend the strategy-stealing argument (SSA) beyond finite, perfect-information, monotonic games (e.g., Hex), the following conditions must be met. They are categorized by **Hard Constraints** (logic fails without them) and **Camp Preferences** (modeling choices that simplify proof but may be relaxable).

  #### I. Core Logic & Payoffs

  | Requirement | Definition | Motivating Failure Case | Classification |
  | :--- | :--- | :--- | :--- |
  | **1. Resource Monotonicity** | Possessing an extra move, piece, or resource unit must never decrease expected payoff relative to having one less. | **Zugzwang / Costly Action:** In games where actions deplete resources or force unfavorable board states (e.g., Chess endgames, bidding wars), the "extra move" stolen by P1 becomes a liability, invalidating the contradiction. | **Hard Constraint** |
  | **2. Ex-Ante Role Symmetry** | Prior to the first move, both players must have access to the same action space and win conditions, differing only by turn order. | **Asymmetric Capabilities:** If P2 has access to moves P1 cannot make (e.g., different unit types in RTS), P1 cannot simulate P2's strategy function. | **Hard Constraint** |
  | **3. Collision Resolvability** | If the stolen strategy dictates playing on a spot already occupied by the "extra" move, there must exist a valid alternative move that does not reduce payoff. | **Board Saturation:** In continuous packing problems or finite games with no "pass" option, the stolen strategy might demand an impossible action, halting the simulation. | **Hard Constraint** |

  #### II. Information & Epistemics

  | Requirement | Definition | Motivating Failure Case | Classification |
  | :--- | :--- | :--- | :--- |
  | **4. Informational Opacity** | The execution of the "extra" initial move must not update the opponent's belief state regarding the stealer's private type or future intentions. | **Signaling Leaks:** In poker or signaling games, an arbitrary opening bet reveals hand strength or risk tolerance. P2 adjusts their strategy $S$ based on this leak, rendering the stolen $S$ obsolete. | **Hard Constraint** |
  | **5. Strategy Portability** | The stealer must be able to compute the opponent's decision rule without requiring access to the opponent's private observations. | **Epistemic Dependence:** If P2's strategy relies on private signals (e.g., card hands, sensor noise) that P1 cannot observe or simulate, P1 cannot run the function $S$. | **Hard Constraint** |
  | **6. Belief Symmetry** | Both players must share a common prior, and the act of moving first must not inherently grant private knowledge about the game state. | **First-Mover Information:** In exploration games, the first move reveals map data. P1 knows more than P2 would have known at that node, breaking the symmetry required to claim P1 is "playing as P2." | **Camp Preference** (Relaxable with complex belief modeling) |

  #### III. Topology & Action Space

  | Requirement | Definition | Motivating Failure Case | Classification |
  | :--- | :--- | :--- | :--- |
  | **7. Measure-Zero Interference** | In continuous action spaces, the probability that the "extra" move exactly conflicts with a move dictated by the stolen strategy must be zero. | **Continuous Collision:** In differential games, if the "arbitrary" move occupies a specific coordinate in a continuum, the stolen strategy might require that exact coordinate with non-zero probability, causing a logical crash. | **Camp Preference** (Assumes continuous distributions) |
  | **8. Deterministic Transition** | The game state transition function must be deterministic given actions, or stochastic noise must be public and symmetric. | **Private Randomness:** If P2's strategy relies on private coin flips, P1 cannot replicate the trajectory. If noise is public, P1 can simulate the realization. | **Camp Preference** (Stochastic SSA exists but is weaker) |
  | **9. Action Space Compactness** | The set of available moves must be bounded/closed to ensure an "arbitrary" alternative move always exists. | **Unbounded Drift:** In open-ended economic or spatial models, the "play elsewhere" clause may require an action at infinity or outside valid bounds. | **Camp Preference** |

  ---

  ### Tension Map: Joint Unsatisfiability & No-Go Results

  There are specific subsets of these desiderata that are jointly unsatisfiable in non-trivial strategic settings. These tensions define the boundary where generalized strategy-stealing theories collapse.

  #### 1. The Signaling-Stealing Paradox
  *   **Conflict:** **Informational Opacity (4)** vs. **Strategy Portability (5)** in Partial Information Games.
  *   **The Tension:** To steal a strategy in a partial-info game, P1 must execute P2's decision rule. If P2's rule is optimal, it likely conditions actions on private information (types). For P1 to execute this rule, P1 must either (a) have the same private info (violating the premise of distinct players) or (b) fake it. If P1 fakes it, the action distribution differs from P2's, which P2 (the opponent) detects.
  *   **No-Go:** In any signaling equilibrium where actions are informative, an "arbitrary" extra move cannot be informationally neutral. Therefore, **SSA is generally inapplicable to Bayesian games with informative signaling.** You cannot steal a strategy without revealing you are stealing it, which changes the opponent's best response.

  #### 2. The Monotonicity-Realism Tradeoff
  *   **Conflict:** **Resource Monotonicity (1)** vs. **Strategic Depth (Zugzwang).**
  *   **The Tension:** Most interesting asymmetric or partial-info games involve costs for action (e.g., bidding, resource expenditure, revealing position). If actions are costly, Monotonicity fails. If you enforce Monotonicity (actions are free/harmless), you eliminate the strategic tension that defines the game (e.g., bluffing costs, attrition).
  *   **No-Go:** **SSA cannot prove first-player advantage in games with costly signaling or attrition.** The "extra move" is strictly a liability in these domains.

  #### 3. The Continuous Collision Problem
  *   **Conflict:** **Measure-Zero Interference (7)** vs. **Deterministic Transition (8).**
  *   **The Tension:** In continuous time/space games (e.g., pursuit-evasion), "making a move first" is ill-defined without discrete time steps. If time is continuous, P1's "extra" infinitesimal move might alter the trajectory of the system such that the stolen strategy's conditions are never met (sensitivity to initial conditions/chaos).
  *   **No-Go:** **SSA fails in chaotic continuous dynamical systems.** The "arbitrary move" acts as a perturbation that diverges exponentially from the trajectory required by the stolen strategy, making the "play elsewhere" clause impossible to satisfy without knowing the future.

  #### 4. The Epistemic Symmetry Barrier
  *   **Conflict:** **Belief Symmetry (6)** vs. **First-Mover Information.**
  *   **The Tension:** In exploration or search games, the first move *generates* information. P1 knows the result of Move 1; P2 (in the counterfactual where they moved first) would have known the result of *their* Move 1. These are different information sets.
  *   **No-Go:** **SSA cannot be applied to games where moves reveal state.** You cannot claim P1 is "playing P2's game" because P1 is playing a game with strictly more information (the result of the extra move) than P2 would have had. This violates Ex-Ante Role Symmetry in the *informational* sense, even if rules are symmetric.

  ### Summary of Feasible Region
  A generalized strategy-stealing theory is only viable in the intersection of:
  1.  **Non-costly actions** (Monotonicity holds).
  2.  **Non-signaling moves** (Informational Opacity holds).
  3.  **Public information states** (or private info that doesn't affect the specific stolen strategy).

  If you relax **Informational Opacity**, you must move from a proof of *existence* (P1 has a winning strategy) to a bound on *exploitability* (P1 can win unless P2 detects the steal). This shifts the theory from combinatorial game theory to mechanism design.
