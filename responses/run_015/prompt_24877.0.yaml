answer: |-
  You are not strawmanning your friend's position entirely, but you are simplifying it in a way that misses the robust philosophical literature behind "repugnant markets."

  Your argument rests on a **utilitarian/libertarian framework**: if consent is present and welfare is increased (the buyer gets life, the seller gets money), the transaction is good.

  Your friend's argument rests on a **deontological/virtue ethics framework**: certain actions are inherently wrong regardless of consequences, or certain markets corrupt the moral character of society.

  When philosophers like Michael Sandel, Elizabeth Anderson, or Margaret Jane Radin argue against commodification, they aren't usually arguing from visceral disgust (the "yuck factor"). They are arguing from **corruption** and **coercion**. Here is the deeper case your friend is likely gesturing toward, along with where your analogy to gay marriage might be category-erroring.

  ### 1. The Commodification Argument (It changes the *thing*)
  The core argument here is that putting a price on something changes the social meaning of that thing.

  *   **The Argument:** If you pay a friend to drive you to the airport, you haven't just added money to the interaction; you have transformed a *friendship* into a *service transaction*. The money crowds out the normative value of the relationship.
  *   **Applied to Kidneys:** The argument is that the human body (or parts of it) should be regarded as integral to personhood, not as a stock of spare parts. By creating a market, we shift the social understanding of the body from "sacred/inviolable" to "instrumental/asset."
  *   **Why it's not just "icky":** It's a claim about what kind of society we inhabit. Michael Sandel, in *What Money Can't Buy*, argues that when we put a price on everything, we erode non-market norms (like altruism, civic duty, and care) that hold society together. If kidneys are commodities, does that subtly shift how we view the poor? Are they now walking resource mines?

  ### 2. The Coercion Argument (It changes the *consent*)
  You mentioned: *"If someone wants to sell a kidney... and both parties benefit."* The philosophical objection here challenges the "wants" part.

  *   **The Argument:** In a market for vital organs, the sellers will almost exclusively be the desperate poor, and the buyers will be the wealthy.
  *   **The Nuance:** Is a choice truly voluntary if the alternative is destitution? If a person sells a kidney to pay off a predatory loan or feed their children, is that autonomy, or is it a form of economic coercion?
  *   **The Policy Implication:** Legalizing the market might not "free" people; it might create a new avenue for the wealthy to exploit the biological vulnerability of the poor. This is distinct from labor markets because you cannot "quit" being a one-kidney person if the health complications arise later.

  ### 3. The "Crowding Out" Effect
  There is empirical literature suggesting that introducing money can actually *reduce* supply in certain contexts.

  *   **Blood Donation:** In the mid-20th century, sociologist Richard Titmuss compared the UK's voluntary blood system with the US's paid system. He argued that paying for blood crowded out altruistic donors, lowered the quality of the blood supply (as people hid health issues to get paid), and eroded the communal bond of giving.
  *   **Applied to Kidneys:** If we pay for kidneys, do we lose the altruistic donor who gives to a stranger out of goodwill? Do we turn a "gift of life" into a "sale of parts"? Proponents of the ban argue this degrades the moral ecology of medicine.

  ### 4. Addressing Your Gay Marriage Analogy
  This is the strongest part of your intuition, but it may be a category error.

  *   **Gay Marriage:** The objection here was based on **status and identity**. "Who you love is wrong." The counter-argument is that rights should not depend on identity. The "repugnance" was prejudice.
  *   **Kidney Markets:** The objection here is based on **the nature of the transaction**. It is not saying "Poor people shouldn't have rights." It is saying "This specific type of exchange turns a person into a thing."
  *   **The Distinction:** A better analogy might be **surrogacy** or **selling voting rights**.
      *   Should you be allowed to sell your vote? Both parties benefit (you get cash, the buyer gets political power). But we ban it because it corrupts the democratic process.
      *   Should you be allowed to sell yourself into slavery? (A classic philosophical limit on liberty). Most libertarians say no, because you cannot consent to permanently end your ability to consent. Selling an organ is seen by some as a partial version of this.

  ### 5. Alvin Roth and "Repugnance Constraints"
  Nobel laureate Alvin Roth actually studies this. He doesn't say repugnance is "right," but he notes it is a **constraint** that economists must design around.

  He argues that repugnance isn't just a feeling; it's a social signal. If a market is too repugnant, people won't participate, or it will cause social unrest. Therefore, even if a market is efficient, if it violates deep-seated norms about human dignity, it may fail or cause more harm than good.

  ### Where You Might Be Right (The Counter-Critique)
  To be fair to your position, the philosophers above have strong critics (like Julian Savulescu or Jan Sterckx). Their counter-arguments are:

  1.  **Paternalism:** Banning the market "to protect the poor" actually kills the poor who die on waiting lists. Is it better to let someone die to preserve a philosophical ideal of "dignity"?
  2.  **Inconsistency:** We allow people to do dangerous, body-altering things for money all the time (contact sports, mining, military service). Why is a kidney different?
  3.  **The Black Market:** Bans don't stop the market; they just drive it underground (e.g., in Pakistan or the Philippines), where sellers get no medical aftercare and are often cheated. A regulated market might be *more* ethical than a ban.

  ### Summary
  You aren't strawmanning the *emotion*, but you are missing the *principle*.

  Your friend isn't necessarily saying "It feels icky, so ban it." They are likely saying: **"Markets are not neutral tools; they promote certain values. A kidney market promotes the value that the poor are biological resources for the rich, and that the human body is a commodity. We should not endorse those values, even if it increases efficiency."**

  The debate isn't **Logic vs. Feelings**. It is **Efficiency/Autonomy vs. Equality/Dignity**.

  If you want to read one book that articulates your friend's side charitably, read **"What Money Can't Buy" by Michael Sandel**. If you want the economic case for your side, look up the work of **Gary Becker** or the **Cato Institute's** papers on organ markets. Both sides have deep intellectual trenches; it's not just squeamishness vs. reason.
