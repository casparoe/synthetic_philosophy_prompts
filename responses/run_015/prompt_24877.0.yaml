      *   *Counter-point:* Some argue bodily autonomy is paramount (supporting the user). Others argue bodily integrity is protected *from* the market (supporting the friend).
      *   *Nuance:* The "repugnance" against gay marriage was largely prejudice. The "repugnance" against organ sales is often about structural exploitation.

  6.  **Structure the Response:**
