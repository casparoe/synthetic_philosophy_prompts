      *   *Likelihood vs. Loveliness:* Miasma is *likelier* (prior probability high, medical consensus). Water is *lovelier* (explains the anomalies like the widow). Snow bets on Loveliness.
      *   *The Handle Removal:* If epidemic was declining, removal isn't a strong *test*. It's a precautionary intervention based on the inference already made. IBE justifies the *belief* before the handle is pulled, not necessarily by the pull itself.

  5.  **Drafting - Section 2: Case Testing the Theory (Evaluation):**
