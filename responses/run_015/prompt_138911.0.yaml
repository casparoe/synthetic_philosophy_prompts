      *   *Likelihood vs. Loveliness:* "Likeliest" = most probable given priors. "Loveliest" = most explanatory power. IBE often favors loveliness over prior likelihood.
      *   *Bad-Lot Objection:* What if the true hypothesis isn't in the set? Choosing the best of a bad lot doesn't guarantee truth.
      *   *Bayesian Relation:* IBE can be seen as a heuristic for updating probabilities, or as distinct from probability calculus.

  3.  **Deconstruct the Historical Case (based on stipulations):**
      *   *Inquirer:* John Snow (and the narrator defending him).
      *   *Rival Hypotheses:*
