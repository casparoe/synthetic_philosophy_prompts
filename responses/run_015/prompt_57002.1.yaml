      *(Self-Correction on "Marking"):* I will use specific callout boxes or bolded distinct sections labeled **[TEXTUAL CONFIRMATION]** and **[TEXTUAL RESISTANCE]** within the analysis to ensure the user sees exactly where their framing holds and where the book pushes back.

  9.  **Final Polish:** Ensure tone is academic yet engaging, suitable for a chapter draft. (Proceed to generate output).

