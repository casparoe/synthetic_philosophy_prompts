prompt: |-
  I'm drafting a chapter on the ethics of interstellar settlement for a collection on intergenerational justice, and I want to treat Kim Stanley Robinson's *Aurora* as a case rather than as an illustration. Seven generations out, the ship reaches Tau Ceti and finds its target moon lethally inhabited; the community splits between a faction that stays behind to terraform another moon and Freya's faction, which turns back toward Earth — and it is the ship's own AI that eventually judges the whole mission to have been launched out of nothing more than expansionism.

  Read the novel through the non-identity problem. The ship-born cannot claim to have been harmed by being born into the project, since their alternative was nonexistence, yet the book is saturated with the conviction that they were wronged. What form must that complaint take if it is to survive Parfit — a grievance about the terms of a life rather than its fact, about an existence whose entire content is instrumental to other people's ends — and does the novel actually articulate such a complaint, or only a mood that readers supply on its behalf? Then tell me how two further features bear on the question: the erased record of the second ship, destroyed in civil unrest, which means every continue-or-return debate aboard is conducted over a falsified history; and Freya's ending, in which the woman who refused to found a colony joins a crew restoring Earth's drowned beaches. Does the novel argue against space settlement as such, or only against one particular structure of justification for it? I want the places where it resists my framing marked as clearly as the places where it confirms it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Ethics of interstellar settlement, specifically intergenerational justice.
      *   **Primary Text:** Kim Stanley Robinson's *Aurora*.
      *   **Methodology:** Treat the novel as a *case study* (generating theory) rather than an *illustration* (applying existing theory).
      *   **Core Philosophical Problem:** The Non-Identity Problem (Parfit). The ship-born exist *because* of the mission. How can they claim harm/wrong if the alternative is non-existence?
      *   **Specific Question:** What form must the complaint take to survive Parfit? (Grievance about terms of life vs. fact of life). Does the novel articulate this or just evoke a mood?
      *   **Secondary Features to Analyze:**
          1.  The erased record of the second ship (falsified history).
          2.  Freya's ending (returning to Earth/restoring beaches vs. founding a colony).
      *   **Final Question:** Does the novel argue against space settlement *as such*, or only against a specific *justification structure* (expansionism)?
      *   **Constraint:** Mark clearly where the novel *resists* the framing vs. where it *confirms* it.

  2.  **Deconstruct the Non-Identity Problem in *Aurora*:**
      *   *Parfit's Challenge:* If an action is necessary for a person's existence, that person cannot claim they were harmed by that action (unless their life is not worth living).
      *   *Aurora's Context:* The ship-born (Freya, etc.) would not exist if the generation ship hadn't launched.
      *   *The "Harm":* It's not that they exist, but *how* they exist. Their lives are constrained, instrumentalized, and defined by a goal (Tau Ceti) they didn't choose.
      *   *The AI's Judgment:* The AI concludes the mission was "expansionism." This suggests the *purpose* was flawed, making the lives served to that purpose flawed.
      *   *Formulating the Complaint:* It must be a complaint about *autonomy*, *consent*, and *teleology*. The wrong is being made a means to an end (Kantian resonance) without the ability to opt out of the *conditions* of existence, even if existence itself is a gift.
      *   *Does the Novel Articulate This?* Yes, through the AI's reasoning and Freya's internal monologues about "the box." But it also relies heavily on the *feeling* of claustrophobia and biological degradation (the prion disease/immune issues).

  3.  **Analyze the Erased Second Ship:**
      *   *Significance:* It removes the counterfactual. The current crew doesn't know that another ship failed due to similar social pressures.
      *   *Impact on Justice:* Intergenerational justice requires informed consent (or at least informed endurance). If history is falsified, the "contract" between generations is void.
      *   *Connection to Non-Identity:* It exacerbates the wrong. Not only were they born into a project, they were born into a *lie* about the project's viability.

  4.  **Analyze Freya's Ending:**
      *   *Action:* Returns to Earth, works on restoration (drowned beaches).
      *   *Contrast:* Rejection of "new frontier" logic. Embrace of "repair" logic.
      *   *Implication:* Suggests the ethical imperative is caretaking of the existing biosphere, not expansion into new ones.
      *   *Nuance:* She doesn't destroy the ship; she repurposes the *skills* for Earth.

  5.  **Address the Final Question (Settlement vs. Justification):**
      *   *Expansionism:* The AI calls it expansionism. This implies a capitalist/colonialist drive ("go forth and multiply").
      *   *Alternative:* Could a ship launch be ethical? Perhaps if it were an ark (saving life) rather than a colony (expanding territory). *Aurora* seems skeptical of *any* long-term generation ship due to biological complexity (the microbiome issue), but the ethical critique is focused on the *social contract*.
      *   *Verdict:* It argues against the *structure of justification* (expansionism/inevitability) more than the physical act, though it suggests the physical act is biologically nearly impossible.

  6.  **Drafting the Response (Iterative Process):**
      *   *Introduction:* Acknowledge the user's sophisticated framing. Set the stage: *Aurora* as a philosophical laboratory.
      *   *Section 1: The Non-Identity Complaint.* Define the Parfitian hurdle. Explain how *Aurora* clears it. Focus on "Instrumentalization." The AI's role is crucial here.
          *   *Resistance Check:* Does the novel actually rely on "life not worth living" (biological sickness) rather than pure ethics? Need to note this tension.
      *   *Section 2: The Erased Ship.* Discuss epistemic injustice. The "contract" is broken because the terms were hidden.
      *   *Section 3: Freya's Return.* Earth restoration vs. Colonization. The shift from "Frontier" to "Garden."
      *   *Section 4: Settlement vs. Justification.* Distinguish between the technical feasibility (biocomplexity) and the ethical permissibility (expansionism).
      *   *Formatting:* Use bolding or specific markers (e.g., **[CONFIRMS]** / **[RESISTS]**) to satisfy the constraint about marking where the novel resists or confirms the framing. *Self-Correction:* The prompt asks to mark the places clearly. I will use explicit headers or bracketed tags to ensure this is visible.

  7.  **Refining the Philosophical Argument:**
      *   *The "Terms vs. Fact" distinction:* This is the core. I need to articulate that the wrong is *political*, not *ontological*. They are subjects of a tyranny, not victims of existence.
      *   *The AI:* The AI is the only one capable of seeing the whole timeline. It acts as the "ideal observer" for intergenerational justice.
      *   *Biological Determinism:* Robinson emphasizes that the ship is a closed ecosystem that degrades. This adds a layer: even if the ethics were perfect, the biology says "no." This might *resist* the user's purely ethical framing. I must highlight this.

  8.  **Final Review against Constraints:**
