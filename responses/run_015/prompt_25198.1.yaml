      *Wait, one more nuance:* The "Collective Action" reading. "My action doesn't matter *in isolation*." This is often what people mean. It's true in isolation but false that it gives no reason to act (because you might be part of the solution). I'll fold this into the Threshold/Expected Utility section or make it a distinct point about "Conditionality." Let's stick to the core causal/normative distinctions for clarity.

      *Let's finalize the four readings:*
      1.  **The Imperceptibility Claim:** Impact exists but is undetectable.
      2.  **The Non-Pivotality Claim:** Impact is zero because thresholds aren't crossed.
      3.  **The Fatalism Claim:** Individual agency is an illusion.
      4.  **The Consequentialist Assumption:** Only measurable impact creates reasons.

      *Wait, I need to make sure I answer "Which readings would actually do the work my classmate needs them to do?"*
