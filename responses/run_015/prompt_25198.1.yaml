answer: |-
  This is a classic move in environmental ethics, often called the "futility objection" or the "drop in the bucket" argument. Your intuition is correct: the phrase is a chameleon. It shifts between empirical claims about causality and hidden normative claims about morality.

  To dismantle it, you need to force your classmate to pick a specific lane. Here are four distinct precise theses hidden inside "one person's actions won't make a difference," evaluated by truth and relevance.

  ### 1. The Imperceptibility Thesis
  **The Claim:** "My action causes a real physical change, but that change is too small to be measured or noticed in the global system."
  *   **Example:** Not eating one burger reduces CO2 emissions, but not enough to change the global temperature by a measurable fraction of a degree.
  *   **Truth Value:** **Trivially True.** Physics confirms that marginal changes exist but are often below the threshold of detection.
  *   **Does it support the conclusion?** **No (Irrelevant).**
      *   **Why:** Moral significance does not track with measurability. If you steal one dollar from a billionaire, the loss is imperceptible to them, but the act is still wrong. If you cast one vote in a landslide election, it doesn't change the outcome, but it is still a vote.
      *   **The Counter:** "If you mean my impact is too small to measure, you're right. But morality isn't about what we can measure; it's about what we contribute. A single brick doesn't hold up a wall on its own, but a wall without bricks doesn't exist."

  ### 2. The Non-Pivotality (Threshold) Thesis
  **The Claim:** "My action will not cross the causal threshold required to trigger a specific outcome."
  *   **Example:** Supply chains order meat in batches of 1,000. My one burger won't trigger a new order, so no additional animal is killed *because* of me. Or: One vote won't decide an election.
  *   **Truth Value:** **Substantive but Often False.**
      *   **Why:** This relies on a misunderstanding of how markets and complex systems work. Markets don't always operate on rigid thresholds; they operate on probability and aggregate demand signals. Furthermore, in voting or climate tipping points, while the *probability* of being pivotal is low, it is rarely exactly zero.
  *   **Does it support the conclusion?** **No (Insufficient).**
      *   **Why:** Even if the probability of being pivotal is low, the *expected value* of the action might still be high. (Expected Value = Probability of Impact × Magnitude of Impact). If the magnitude of climate disaster is huge, even a tiny probability of preventing it justifies the action.
      *   **The Counter:** "If you mean I probably won't be the single deciding factor, that's likely true. But 'probably not pivotal' isn't the same as 'zero impact.' If there's even a 0.0001% chance my choice helps prevent a catastrophe, the expected value of doing it is still positive."

  ### 3. The Structural Fatalism Thesis
  **The Claim:** "Individual agency is an illusion; outcomes are determined entirely by structural/industrial forces."
  *   **Example:** "Corporations are the real polluters. Whether I fly or not, the airline industry will emit the same amount because the infrastructure is already built."
  *   **Truth Value:** **False.**
      *   **Why:** Structures are constituted by individuals. Demand drives supply. If everyone stopped flying, airlines would cut routes. If everyone went vegetarian, the meat industry would collapse. To say individuals have *no* causal power is to deny that markets respond to consumers.
  *   **Does it support the conclusion?** **Yes, IF it were true.**
      *   **Why:** If you truly have no causal power, you have no responsibility. However, since the premise is empirically false, the argument collapses.
      *   **The Counter:** "If you mean individuals have no power at all compared to corporations, that's false. Corporations exist to serve individual demand. If we remove the 'individual actions,' the 'structural forces' have nothing to drive them."

  ### 4. The Consequentialist Assumption (The Hidden Normative Claim)
  **The Claim:** "An individual has no reason to act unless that action produces a discernible, positive causal outcome."
  *   **Example:** "Unless I can prove that *my* vegetarianism saves a life, I have no reason to be vegetarian."
  *   **Truth Value:** **Substantive but Controversial.**
      *   **Why:** This is not a fact about the world; it is a specific moral theory (strict act-consequentialism). It ignores other ethical frameworks like Virtue Ethics (acting in character), Deontology (duty-based), or Integrity (keeping one's hands clean).
  *   **Does it support the conclusion?** **Yes, but only by begging the question.**
      *   **Why:** This thesis *does* the work your classmate wants, but only by assuming the very thing you are debating. It assumes that "making a difference" is the *only* reason to act.
      *   **The Counter:** "If you mean I shouldn't act unless I guarantee a specific result, you're assuming that consequences are the only thing that matters. But I might choose to be vegetarian for integrity, to avoid complicity in harm, or to align my life with my values, regardless of the global metric."

  ***

  ### Summary for Your Debate
  Here is how you can deploy this in your club meeting:

  > "When you say 'one person's actions won't make a difference,' I need to know which claim you're making, because they lead to different places:
  >
  > 1.  **If you mean my impact is too small to measure:** That's **true**, but it's **irrelevant**. Morality isn't about measurability.
  > 2.  **If you mean I won't cross a specific threshold:** That's **debatable**, but even if true, it ignores **expected value**. A low chance of stopping a catastrophe is still worth taking.
  > 3.  **If you mean individuals have no power over structures:** That is **false**. Structures are made of individuals.
  > 4.  **If you mean I have no reason to act unless I guarantee a result:** That is a **moral assumption**, not a fact. It ignores integrity, complicity, and virtue.
  >
  > **So, which one are you arguing?** If it's the first three, your facts or logic are off. If it's the fourth, we aren't arguing about climate science anymore; we're arguing about moral philosophy, and you need to prove why consequences are the *only* thing that matters."

  ### Which reading does the work for your classmate?
  Only **Reading #4 (The Consequentialist Assumption)** actually supports the conclusion that an individual has *no reason* to change their behavior.

  *   Readings #1 and #2 admit the action has *some* causal link (or expected value), which usually preserves a moral reason to act.
  *   Reading #3 denies agency entirely, which would excuse all behavior (even bad behavior), making it a self-defeating argument for an ethics club.
  *   Reading #4 is the only one that severs the link between action and reason, but it requires them to defend a controversial ethical theory (that only tangible outcomes matter) rather than a simple observation about climate change.

  By forcing them to defend Reading #4, you shift the burden of proof from "science" (where they feel safe) to "ethics" (where their claim is much weaker).
