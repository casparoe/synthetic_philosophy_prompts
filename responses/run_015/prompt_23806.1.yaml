answer: |-
  Three colleagues, Alex, Blake, and Casey, are finishing a late shift in a ground-floor office when a severe flood warning triggers an alarm requiring a manual valve in the basement to be shut within ten minutes to save the server rack. All three hear the alert, know exactly where the valve is, are physically fit enough to reach it in time, and recognize that if no one goes, the servers will be destroyed. Only Alex, however, signed an employment contract designating them as the official "Safety Marshal" with the explicit obligation to handle emergency building protocols, whereas Blake and Casey have no such contractual clause or prior agreement. None of the three move from their desks, the valve remains open, and the server rack is ruined by floodwater.

  ### Analysis of Theories

  **(1) Plain Counterfactual Theory**
  On the plain counterfactual theory, causation is strictly a matter of dependence: event C causes event E if and only if, had C not occurred, E would not have occurred. Applied to omissions, we ask: if the omission had not occurred (i.e., if the person had acted), would the harm have been prevented? In this scenario, if Alex had gone to the basement, the servers would be safe. Thus, Alex's inaction is a cause. However, the physical facts stipulate that Blake and Casey were equally capable and present; if Blake had gone, the servers would also be safe, and likewise for Casey. Therefore, under the plain counterfactual theory, the inaction of all three individuals is equally a cause of the damage. The theory has no internal resources to distinguish between them because the counterfactual dependencies are identical; it sees only the physical leverage each person had over the outcome, not the social context surrounding their choice.

  **(2) Expectation Theory**
  The expectation theory (often called the normative or default theory) holds that an omission counts as a cause only when it represents a deviation from what was expected or required given the agent's role. Here, the outcome (flooded servers) is compared against a normative baseline. Alex violated an explicit contractual duty; their inaction was a departure from what was required, so their omission qualifies as a cause. Blake and Casey, however, had no assigned role; their inaction was consistent with what was expected of them given their status as regular staff with no safety obligations. Therefore, the expectation theory verdicts that Alex caused the harm, but Blake and Casey did not. This differs from the counterfactual theory because it filters physical dependence through a layer of normative expectations, treating "normal" inactions as background conditions rather than causes.

  **(3) The Differentiating Feature**
  The single feature doing the work of separating the three people is the **explicit prior assignment of contractual responsibility**. It is confirmed not to be a difference in skill, proximity, or counterfactual strength because the scenario stipulates all three were equally aware, equally capable, and equally positioned to prevent the harm. The counterfactual dependence of the harm on each person's action is identical in strength; the only variable that changes is the existence of a prior agreement binding one specific individual to act.

  **(4) Removal and Addition Test**
  If the assigned duty is **removed from everyone** (no one is Safety Marshal), the counterfactual theory verdict remains unchanged (all three are still causes because the physical dependence holds), but the expectation theory verdict shifts to say none of them are causes (since no one violated a norm). If the duty is **extended to all three** (all are designated Safety Marshals), the counterfactual theory verdict again remains unchanged (all three are causes), while the expectation theory verdict shifts to say all three are causes (since all three violated the norm). This demonstrates that the expectation theory's verdicts track the distribution of duties, while the counterfactual theory's verdicts track only the physical leverage.

  **(5) Counterfactualist Rebuttal**
  The strongest move available to a defender of the counterfactual theory is to **distinguish causation from responsibility**. They can argue that the theory correctly identifies all three omissions as metaphysical causes of the damage, but that this does not imply all three are morally or legally blameworthy. On this view, Blake and Casey did "cause" the damage in the same way Alex did, but only Alex is liable for it because liability depends on duty, whereas causation depends only on dependence. This preserves the counterfactual theory's simplicity by offloading the intuitive asymmetry onto a separate theory of moral or legal accountability.

