      *Refinement on Externalism:* A sophisticated externalist might argue that self-reports *are* more reliable because the causal link is shorter. But the prompt specifies the protocol treats them as *authoritative* (defeasible evidence) vs external claims which need *corroboration*. A strict externalist would demand corroboration for *both*. So the protocol is indeed internalist regarding self-knowledge.

  7.  **Final Polish:** Check against all parts of the prompt.
