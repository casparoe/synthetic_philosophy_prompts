answer: |-
  This is a precise and necessary dissection. The phrase "history is written by the victors" is a shibboleth that often stops thought rather than starting it. Your taxonomy is sound; it moves from archival mechanics to ontological claims. Below is the ordering you requested, followed by the two follow-ups.

  ### I. The Taxonomy: From Platitude to Radical

  **1. The Archival Reading (Platitude)**
  *   **Meaning:** Victors produce and preserve most surviving documents; losers' records are destroyed (as in your novel) or neglected.
  *   **Verdict:** **Trivial.** It is empirically true in almost every conquest scenario.
  *   **Scale/Time:** Immediate post-conflict to the present. It applies to the physical survival of paper, stone, and digital media.
  *   **Note:** This is a statement about *survival rates*, not truth values.

  **2. The Curatorial Reading (Defensible)**
  *   **Meaning:** Victors decide which accounts get copied, taught, translated, and entered into the canon.
  *   **Verdict:** **Defensible.** Archives are not neutral; they are curated. What is deemed "worth preserving" reflects the values of the preserver.
  *   **Scale/Time:** Generational. It takes one or two generations for a curriculum or national archive to solidify.
  *   **Limit:** It does not prevent counter-archives from forming later (e.g., subaltern studies), but it dictates the "default" narrative for a long period.

  **3. The Conceptual Reading (Defensible)**
  *   **Meaning:** The categories in which events become intelligible (liberation, treason, restoration, terrorism, freedom fighter) are imposed by the victors.
  *   **Verdict:** **Defensible.** Language is a tool of power. If the victor defines the act as "pacification," the loser's "resistance" becomes "banditry" in the official record.
  *   **Scale/Time:** Long-term cultural memory. This persists until the linguistic framework itself is challenged (often centuries).
  *   **Limit:** It constrains *interpretation*, but not necessarily *chronology* or *material fact*.

  **4. The Epistemic Reading (Defensible but Contingent)**
  *   **Meaning:** The evidence is now too thin and too one-sided for historical method to recover much of the loser's perspective.
  *   **Verdict:** **Defensible.** There are events where the destruction is total enough that reconstruction is impossible.
  *   **Scale/Time:** Specific events where material culture is also destroyed.
  *   **Limit:** This is often overstated. Archaeology, climate data, numismatics, and external records (trade partners, neighbors) often allow historians to triangulate truth even when the victor burns the library. It is a limit of *recovery*, not a limit of *reality*.

  **5. The Ontological Reading (Radical)**
  *   **Meaning:** There is no fact of the matter about the past apart from whichever account wins. Truth is identical to power.
  *   **Verdict:** **False.** This confuses *knowledge* with *existence*. That we cannot know the number of dead does not mean the dead did not exist. It is a category error that collapses reality into narrative.
  *   **Scale/Time:** Universal claim (which is why it fails).

  **Omitted Readings**
  You missed two significant variants that sit between the Curatorial and Ontological readings:
  *   **The Material Witness:** Victors burn books, but they do not always burn pots, bones, or city walls. Archaeology often contradicts the victor's text. (Verdict: **Defensible**; limits the Victors' power over time).
  *   **The Self-Deception:** Victors often write history not to lie to the losers, but to lie to themselves (to justify costs, soothe guilt). The record is distorted not just by malice but by cognitive dissonance. (Verdict: **Defensible**; applies to internal state documents).

  ***

  ### II. Follow-Up 1: The Colleague's Argument

  **Which reading does the work?**
  Only **Reading 5 (The Ontological Reading)** releases you from an obligation to the past. If there is no fact of the matter independent of the winning account, then "faithfulness" is a meaningless concept. You cannot be faithful to a ghost.

  **Does it survive scrutiny?**
  No. It is philosophically incoherent and historically useless. If it were true, there would be no such thing as a "lie," only "losing narratives." It renders the word "victor" meaningless (you cannot win against something that doesn't exist). It is a rhetorical shield, not a tool of analysis.

  **What was she likely reaching for?**
  She was likely reaching for **Reading 3 (The Conceptual Reading)** but slid into Reading 5 for moral convenience. She likely meant: *"The categories of the victor are so dominant that trying to be 'faithful' to the facts is futile because the facts are already encoded in their language."*
  However, she used that defensible point to justify the radical conclusion (that you owe nothing to reality). This is a common sleight of hand in historical fiction debates: using the *difficulty* of truth (Epistemic/Conceptual) to justify the *abandonment* of truth (Ontological).

  ***

  ### III. Follow-Up 2: The Scribe's Forgery

  **Does the slogan license the readers' inference?**
  The readers' inference is that because the scribe proved *one* part of the chronicle could be faked (or because he successfully framed it as fake), the *whole* chronicle is a lie.
  *   **Reading 5** licenses this inference. If truth is just power, and the power dynamic shifts (via the scribe's forgery), the old truth becomes false.
  *   **Readings 1–4** do **not** license this inference. A biased record is not necessarily a fabricated one. A victor can record a battle accurately while omitting the moral context. Proving bias or even a specific fabrication does not invalidate the entire dataset.

  **Does the line, properly understood, cut against your use?**
  Yes. Properly understood (Readings 1–3), the slogan warns us that the victor's record is *partial*, not that it is *fiction*. By having your scribe forge a tablet to make the chronicle look fabricated, you are tempting the reader to accept Reading 5: that the victor's record is inherently suspect and therefore disposable.

  **Does your story repeat the thing the slogan complains of?**
  This is the sharper question. The slogan complains of **monopoly** and **erasure**.
  *   **The Risk:** If your scribe's forgery succeeds in erasing the conquerors' chronicle from the historical record (making future historians believe it was a lie), your scribe has become the victor of the archive. He has used the weapon of the victor (control of the record) to defeat the victor.
  *   **The Irony:** If the novel presents this forgery as a "triumph of truth," it risks validating the very mechanism it critiques. It suggests that the only way to fix a biased history is with a counter-bias that wins. It repeats the logic that *survival justifies the narrative*.
  *   **The Nuance:** However, if the novel presents the forgery as a tragic necessity—a "lie to preserve a truth that would otherwise vanish"—then you are not repeating the slogan's complaint, but illustrating its trap. You are showing that in a world where history is written by victors, the vanquished must become forgers to survive.

  **Recommendation:**
  Be careful that your early readers do not walk away thinking "The conquerors lied, so nothing they said is true." That is the Ontological trap. The more profound historical tragedy is: "The conquerors told the truth as they saw it, but their vision was totalizing, so the scribe had to break their mirror to show the reflection they refused to see."

  If the scribe's act is framed as *restoring* a fact the victors obscured, you are safe. If it is framed as *replacing* one narrative with another equally constructed one, you have inadvertently validated your colleague's nihilism. Given your stated aim (faithfulness to what happened), ensure the forgery points toward an external reality, not just a competing story.
