answer: |-
  This is a splendid exercise. Relying on your intuitions before consulting the literature is often the best way to ensure you end up with a view you can actually live with, rather than one you've merely memorised. Your 'stab' at a principle—robustness of the good reason against counterfactual removal of selfish or easy reasons—is a very strong starting point. It aligns closely with what philosophers call 'counterfactual sensitivity' accounts, but your cases push it in interesting directions, particularly regarding time and motive quality.

  Here is an assessment of your robustness principle against your six cases, a proposed repair to handle the outliers, and the application to your two new scenarios.

  ### 1. Testing the 'Robustness' Stab

  Your core idea is: *Worth tracks how robustly the good reason would still have moved you in nearby cases where the selfish or easy reasons are taken away.*

  *   **Shopkeeper:** Fits perfectly. Remove the business incentive, the action disappears. Robustness is zero. Verdict: No worth.
  *   **Surgeon:** Fits well. Remove the 'impress boss' reason, the 'patient lives' reason still holds (she takes it to matter). But because the action is *overdetermined* (either reason would suffice), the specific robustness of the *moral* reason is diluted by the presence of the selfish one. Verdict: Some worth, but less.
  *   **Dart Charity:** Fits. Remove the dart (luck), the 'effective helping' reason doesn't move him. Robustness is zero. Verdict: Less credit.
  *   **Runaway Kid:** Fits, with a twist. The 'good reason' is pity. The 'counter-pressure' is his belief that he is doing wrong. He acts *against* his perceived duty. This shows extreme robustness of the benevolent impulse. Verdict: High worth.
  *   **Hospital Visitor:** This is a strain on the principle. If the motive is 'what you do' (convention), and we remove social pressure, would he still go? Probably not. So robustness is low. Yet you say there is *worth*. This suggests robustness of the *right action* matters, even if the *motive* isn't deeply internalised.
  *   **Donor (Asymmetry):** This breaks the synchronic robustness model. Robustness is usually a property of the agent *at the time of action*. The fact that he cares five years later shouldn't physically change the causal chain of the first gift. Your intuition here suggests worth is partly about the *narrative arc* of the agent, not just the snapshot of the act.

  ### 2. The Repaired Principle: 'Stable Dispositionism'

  To save all your verdicts, we need to expand 'robustness' in two ways: across **possible worlds** (your original idea) and across **time** (the Donor case). We also need to distinguish between the *reliability* of the action and the *quality* of the engagement (the Visitor case).

  Here is the refined principle:

  > **An action has moral worth to the extent that it manifests a disposition to respond to right-making features, where this disposition is (a) robust against the removal of selfish incentives, and (b) stable or improving over time. The 'quality' of that worth is diminished if the agent's engagement with the value is merely compliant rather than appreciative.**

  #### How the clauses handle your cases:

  1.  **The Synchronic Robustness Clause:** Handles the **Shopkeeper**, **Surgeon**, and **Dart**. It asks: 'In nearby worlds where the selfish/lucky element vanishes, does the moral reason carry the weight?'
      *   *Shopkeeper:* No.
      *   *Surgeon:* Yes, but shared weight (hence 'less' worth).
      *   *Dart:* No.
  2.  **The Counter-Pressure Clause:** Handles the **Runaway Kid**. Robustness isn't just about removing selfish reasons; it's about whether the good motive survives *hostile* conditions (like false moral beliefs). The kid's pity survives a belief that he ought not to help. That is high robustness.
  3.  **The Diachronic Stability Clause:** Handles the **Donor**. This repairs the retroactivity issue. We don't say the *past* changed; we say our *identification* of the disposition changes.
      *   *Guilt $\rightarrow$ Concern:* The later concern reveals the early guilt was actually the seed of a stable moral disposition. We re-categorise the early acts as 'early growth' rather than 'mere compliance'.
      *   *Concern $\rightarrow$ Bitter:* The later bitterness reveals the earlier concern was fragile or contingent on circumstances that no longer hold. We downgrade the earlier acts from 'virtue' to 'temporary inclination'.
      *   *Why the asymmetry?* Because moral worth is partly about trusting the agent's character. A trajectory of improvement confirms the earlier acts were 'true'; a trajectory of decay suggests they were 'flukes'.
  4.  **The Engagement Clause:** Handles the **Hospital Visitor**. There is worth because the action is reliable (he turns up), satisfying the Robustness Clause regarding the *action*. But it is 'off' because the *Engagement Clause* is failed: he is complying with a rule, not appreciating the value of friendship. It is 'cold' worth.

  ### 3. Degree or All-or-Nothing?

  Your verdicts clearly demand a **scalar (degree) view**, not a binary one.
  *   The **Surgeon** case explicitly states 'some worth, but less'.
  *   The **Dart** case implies 'less credit'.
  *   The **Runaway** case suggests 'more worth' than the dutiful person.

  On this account, worth is a matter of degree. Think of it like a dimmer switch rather than a light toggle. There may be a *threshold* below which we say 'no worth' (the Shopkeeper), but above that threshold, the amount of worth varies based on how robust the disposition is, how pure the motive, and how stable the trajectory.

  ### 4. Do any verdicts have to go?

  Strictly speaking, none of your verdicts need to be discarded if we accept the **Diachronic Stability Clause**. However, you must accept a philosophical cost: **Moral worth is not entirely intrinsic to the moment of action.**

  On a strict Kantian view, the Shopkeeper's action has no worth *now* regardless of what he does later. Your view (and my repair) implies that the moral status of an action is partly determined by the future history of the agent. If you are comfortable with that—that we judge the *life* as much as the *act*—then the principle holds together without sacrificing any intuitions.

  ### 5. Application to New Cases

  Here is what the **Stable Dispositionism** principle says about your two unlisted cases.

  #### Case A: The AI Assistant
  *Scenario:* An AI refuses a harmful request only because it was fine-tuned on polite refusals.
  *   **Analysis:**
      *   *Synchronic Robustness:* If you removed the fine-tuning (the 'incentive' or constraint), would it refuse? No. It has no internal disposition, only external programming.
      *   *Engagement:* It does not 'take the harm to matter'. It processes tokens.
      *   *Verdict:* **No moral worth.**
      *   *Reasoning:* This is the Shopkeeper case without the shopkeeper. There is no agent to possess the disposition. The action is right, but the 'robustness' is a feature of the code, not a moral character. It is merely functional reliability.

  #### Case B: The Disavowed Reason
  *Scenario:* Someone does the right thing for a reason they'd disavow if they stopped to think about it (e.g., helping a neighbour because it makes them feel superior, though they tell themselves it's out of kindness).
  *   **Analysis:**
      *   *Synchronic Robustness:* If the feeling of superiority was removed, would they help? If the 'kindness' is a sham, then no. The 'good reason' is not actually doing the work.
      *   *Engagement:* There is self-deception. The agent is not engaged with the *value* of the act, but with the *self-image* the act provides.
      *   *Diachronic Stability:* This disposition is fragile. If they ever realise the superiority is unfounded, the helping stops.
      *   *Verdict:* **Very low to no worth.**
      *   *Reasoning:* This is worse than the Surgeon. The Surgeon acknowledges both motives. This agent is lying to themselves. The 'good reason' is not robust because it isn't actually the motive; it's a cover story. If they stopped to think (as per your prompt), the reason vanishes. Therefore, the robustness of the *moral* motive is zero.

  ### Summary
  Your gut is leading you towards a **virtue-ethical hybrid**. You aren't just judging acts; you are judging the *agent's trajectory* and the *depth of their commitment*.

  *   **Principle:** Moral worth is the degree to which an action manifests a disposition to respond to right-making features, robust against selfish counter-pressures and stable over time.
  *   **Worth:** Scalar (degrees), with a threshold for 'none'.
  *   **AI:** No worth (no disposition).
  *   **Disavowed Reason:** No worth (fragile/self-deceived disposition).

  It is a coherent view. It demands that moral worth be earned not just by doing the right thing, but by being the *sort of person* who would keep doing it even when the easy reasons fall away.
