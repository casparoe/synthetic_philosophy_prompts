      *   *Level:* This looks like a 2:2 or a Low 2:1 at best, but given the factual error and conceptual conflation, it's likely lower. For a 20-mark question, this is barely a paragraph. If this is a short-answer section, it's okay. If it's an essay, it's incomplete. Assuming this is the *entirety* of the submission for a 20-mark question, it is severely underlength and lacks critical analysis.
