      *   *Fact Check:* "Zakaria invented the idea of illiberal democracy in 2014 specifically to describe Orbán's Hungary." -> *False.* Fareed Zakaria wrote "The Rise of Illiberal Democracy" in **1997**. Orbán came to power in 2010. This is a significant factual error.

