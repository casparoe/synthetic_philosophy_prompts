      *Decision on Grade:* I'll give it a **10/20**. It addresses the prompt but contains a major factual error and conflates key theoretical concepts. It is also quite descriptive rather than analytical.

      *Wait, one more check:* Is "institutional drift" a standard term? Yes, often associated with Hacker and Pierson, or in democracy literature as distinct from intentional erosion. The student says Turkey slid "without anyone planning it." This is highly debatable and likely incorrect regarding Erdoğan. This needs to be flagged.

