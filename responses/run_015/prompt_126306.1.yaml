      *   *Name:* The Principle of Categorical Distinction (or Dimensional Pluralism).
      *   *Key Distinction:* **Macro-Moral Architecture** (systems, policies, intent, outcomes) vs. **Micro-Phenomenological Experience** (individual pain, trauma).
      *   *Why this works:* It allows ranking the *evil of the act/system* without ranking the *worth of the sufferer*.

