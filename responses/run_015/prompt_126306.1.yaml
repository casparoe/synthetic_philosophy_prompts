      *   *Nuance:* However, the user's intuition is likely protecting *human dignity*, not making a metaphysical claim about pain.
      *   *The Verdict:* The intuition that "trauma is incommensurable" must be refined or partially dropped. It is not that suffering *cannot* be compared, but that comparing it *for the purpose of ranking victim worth* is obscene. Comparing it for the purpose of *allocating resources or understanding historical impact* is necessary.
