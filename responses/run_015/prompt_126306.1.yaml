      *   *Refinement:* Actually, the stronger philosophical pivot is this: You must drop the idea that *ranking events* implies *ranking individual worth*. But the prompt asks which *intuition* must be dropped.
      *   *Hypothesis:* The intuition that "subjective suffering... is incommensurable" is the weak link *if* the goal is a fully coherent utilitarian-style ranking. However, a deontological framework might save it.
