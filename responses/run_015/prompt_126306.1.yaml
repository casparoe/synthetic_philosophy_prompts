answer: |-
  To achieve coherence without moral obscenity, you need a principle that separates the **architecture of the evil** from the **dignity of the victim**. Your current inconsistency stems from trying to apply a single metric of "evil" to phenomena that operate on different moral axes.

  The coherent principle you are looking for is **Dimensional Pluralism in Moral Accounting**.

  This principle holds that historical atrocities can be ranked, but only relative to specific moral dimensions (e.g., intent, scale, duration, structural impact). It forbids aggregating these dimensions into a single "Hierarchy of Suffering" that implies the worth of one victim is less than another. Under this framework, ranking an *event* is an assessment of the perpetrator's moral failure and the system's destructive capacity, not an assessment of the victim's pain.

  Here is how Dimensional Pluralism applies to your specific cases, followed by the necessary sacrifice of one of your intuitions.

  ### 1. Application: Belgian Congo vs. Nanjing Massacre
  Your hesitation arises because you are trying to rank "Evil" simpliciter, rather than ranking specific moral dimensions. Dimensional Pluralism allows you to rank them differently depending on the criterion used, without contradiction.

  *   **Dimension of Direct Malice (Intent):** The Nanjing Massacre ranks "higher." It was characterized by immediate, kinetic, and often sadistic intent to terrorize and destroy. The agency was direct (soldier to victim).
  *   **Dimension of Structural Negligence (Scale & Duration):** The Congo Free State ranks "higher." The death toll was vastly larger, sustained over decades, and driven by a system of extractive capitalism that treated human life as a disposable resource for profit. The agency was diffuse (administrators to laborers).

  **Resolution:** It is not obscene to say the Congo was *deadlier* and *structurally more corrosive*, while Nanjing was *more intensely malicious* in its immediate execution. You are not ranking the victims; you are ranking the *modes of destruction*. This preserves the distinction between colonial extraction and military atrocity without collapsing them into a single, meaningless "worst" category.

  ### 2. Application: Rwandan Genocide vs. Great Leap Forward (GLF)
  This case tests the distinction between *specific intent* and *bureaucratic diffusion*.

  *   **Dimension of Specific Intent (*Mens Rea*):** Rwanda ranks "higher." The genocide was defined by the specific intent to destroy a protected group (Tutsi) *as such*. The bureaucratic machinery was designed explicitly for killing.
  *   **Dimension of Consequential Harm (Outcome):** The GLF ranks "higher." The death toll was an order of magnitude larger.
  *   **Dimension of Responsibility:** Rwanda concentrates responsibility (clear perpetrators); the GLF diffuses it (ideological fervor, policy failure, local exaggeration).

  **Resolution:** Under Dimensional Pluralism, you can assert that Rwanda was a "purer" example of *genocide* (legal/moral category of intent), while the GLF was a "greater" example of *catastrophic policy failure* (utilitarian category of harm). This allows for precise policy analysis: preventing Rwanda requires stopping hate speech and arming of militias; preventing GLF-style disasters requires checking bureaucratic feedback loops and ideological rigidity. Ranking them on a single scale would blur these distinct preventative lessons.

  ### 3. The Necessary Sacrifice
  To preserve coherence, you must drop (or significantly revise) your intuition that **the subjective suffering of individual survivors is incommensurable.**

  Here is the honest philosophical justification for why this intuition cannot stand alongside your other judgments:

  You accept that it is necessary to rank the Holocaust above the Armenian Genocide based on "scale," and the GLF above Stalin's Purges based on "magnitude of death." You also accept that refusing all comparison collapses the distinction between genocide and wartime excess. However, **scale and magnitude are aggregates of individual units.**

  If the suffering of a child in Rwanda is truly *incommensurable* with the suffering of a child in Cambodia—if they share no common metric of pain, loss, or trauma—then you cannot sum those units to create a "scale" or "magnitude" for the events themselves. You cannot claim Event A is "larger" than Event B if the constituent parts of Event A cannot be compared to the constituent parts of Event B.

  Furthermore, you endorse these rankings for **policy analysis**. Policy is inherently utilitarian; it requires weighing costs to prevent future harm. If individual suffering is incommensurable, you cannot perform a cost-benefit analysis on human life, rendering your policy judgments incoherent.

  **The Revision:**
  You do not need to drop the idea that *ranking victims* is obscene. You must drop the idea that *suffering itself* is incomparable.
  *   **Keep:** It is obscene to say a Rwandan child's life mattered less than a Cambodian child's.
  *   **Drop:** The claim that their suffering cannot be compared in severity, duration, or type.

  We compare suffering medically (triage), legally (sentencing guidelines based on harm), and historically (death tolls). To maintain your coherent framework for ranking historical evils, you must admit that suffering is **commensurable in magnitude** (which allows for macro-ranking) even if it is **incomparable in dignity** (which protects the individual from being treated as a statistic). Holding both the macro-ranking and the strict incommensurability of micro-suffering is logically unsustainable.
