          *   On *Moral Category*: Congo is a crime of *Greed/Negligence*; Nanjing is a crime of *Hatred/Conquest*.
          *   *Resolution:* It is not obscene to say Congo caused *more death*, nor to say Nanjing exhibited *more direct malice*. The ranking depends on the *question being asked* (e.g., "Which killed more?" vs. "Which was more explicitly genocidal in intent?"). The hesitation comes from trying to rank them on a single "Evil Scale." The principle says: Use multiple scales.

  5.  **Apply the Principle to Rwanda vs. GLF:**
      *   *Rwanda:* High intent (neighbor killing neighbor, state-organized hate), specific target (Tutsi), short duration, high intensity.
      *   *GLF:* Diffused intent (ideological zeal + negligence), target (class/policy failure), long duration, massive scale.
      *   *Application:*
          *   *Mens Rea (Guilty Mind):* Rwanda is "worse" regarding specific intent to destroy a group.
          *   *Actus Reus (Guilty Act/Outcome):* GLF is "worse" regarding total mortality and systemic failure.
          *   *Responsibility:* Rwanda concentrates responsibility (planners + perpetrators); GLF diffuses it (bureaucracy + ideology).
          *   *Resolution:* Ranking depends on whether we prioritize *malice* or *consequence*. For legal accountability, Rwanda might rank higher. For policy prevention of famine/death, GLF ranks higher.

