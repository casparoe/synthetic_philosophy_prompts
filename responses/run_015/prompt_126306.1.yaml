  2.  **Deconstruct the Ethical Problem:**
      *   The tension lies between *objective metrics* (death toll, intent, scale, systemic nature) and *subjective experience* (pain, trauma, individual dignity).
      *   The user wants to preserve the ability to make macro-historical judgments (for policy, memory, prevention) without violating the dignity of individual victims.
      *   The "Obscenity" charge usually arises when comparison implies that one victim's pain matters less than another's, or when abstraction erases human reality.

  3.  **Develop a Coherent Principle:**
