answer: |-
  In the chronic pain unit, three patients sit side-by-side awaiting a calibrated needle press beneath a flashing red warning light. Patient A winces, whispers "it's unbearable," and scans show full anterior cingulate activation, mirroring the raw hurt and the dread swelling in their chest. Patient B, physically identical down to the ion channel, also winces, whispers "it's unbearable," and lights up the same way on fMRI, yet there is literally nothing it is like to be them—no light, no hurt, just function. Patient C is the twist: they see the vivid red of the light and feel the precise sharpness of the pressure, but the emotional sting is absent; there is no suffering, no aversion, no dread, yet they too wince, whisper "it's unbearable," and produce the exact same fMRI signature as A, because the cognitive machinery reporting "unbearable" is triggered automatically by high-intensity sensory input regardless of whether that input is accompanied by suffering.

  The A-vs-B comparison pumps the standard Chalmers-style intuition: because we can conceive of a physical duplicate lacking *all* phenomenal states without contradiction, consciousness must be non-physical. The gap feels ontological because there is no "remainder" of experience in B; the lights are totally off. However, the A-vs-C comparison destabilizes this intuition. We can conceive of C much more easily than B, and it doesn't feel metaphysically explosive. This is because C retains sensory qualia (the redness, the sharpness), anchoring the scenario in a "what-it-is-like" framework. The feature doing the work here is the conceptual link between consciousness and functional role. Sensory consciousness seems intrinsically representational (showing the world) and thus separable from function. Affective consciousness, however, seems intrinsically motivational (valencing the world); suffering *just is* the experience of something being bad-to-be-in. By stripping affect but keeping the functional report ("unbearable") and the sensory feel, C exposes that we treat affective states as functionally tethered in a way sensory states aren't.

  A physicalist attacks this by denying the conceivability implies possibility. They argue that our ability to imagine C is an epistemic limitation, not an ontological insight. We think we can separate sensory intensity from affective suffering because we don't understand how the brain integrates them; in reality, the neural mechanisms generating the "unbearable" report *are* the suffering. If we drop the fMRI-indistinguishability constraint, the case does not collapse back into a standard zombie argument. Instead, it becomes an empirical claim about dissociation (like pain asymbolia). A standard zombie argument requires physical identity to establish an explanatory gap; if C's brain state differs from A's, the gap is merely physical/functional, not metaphysical. C becomes a detectable clinical variant, not a philosophical ghost, dissolving the hard problem into a tractable neuroscience question.
