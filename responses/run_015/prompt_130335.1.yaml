      *   **Evolutionary Spandrel:** Coined by Gould & Lewontin (1979). Architectural term: The triangular space between arches. Biological term: A trait that arose as a necessary byproduct of another selection pressure, not directly selected for itself. Later, it might get co-opted (exaptation), but its origin isn't functional *for its current use*.
