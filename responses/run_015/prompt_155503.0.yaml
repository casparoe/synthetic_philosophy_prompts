answer: |-
  The tension you have identified strikes at the ontological core of Hannah Arendt's political philosophy. It concerns the relationship between *what is* (factual truth) and *where it is* (the public realm of appearance). To understand how bureaucratic omission functions within her framework, we must first clarify why factual truth is uniquely vulnerable compared to rational truth, and then examine how the structure of the public realm determines what can count as real.

  ### 1. The Fragility of Factual Truth and the World of Appearance

  For Arendt, the vulnerability of factual truth stems from its dependence on **plurality**. Rational truths (mathematical or philosophical) possess a coercive force; they compel the mind in solitude. $2+2=4$ does not require a witness to be true. Factual truths, however, are contingent—they testify to events that *could have been otherwise*. Because they are not self-evident to reason, they rely entirely on **testimony** and **memory**.

  This is where the "shared world of appearance" becomes constitutive rather than merely decorative. In *The Human Condition*, Arendt argues that reality is guaranteed by the presence of others who see and hear what we see and hear. A fact is politically real only insofar as it can appear in the public realm. If a fact cannot be spoken, heard, or recorded within the space of appearance, it loses its political reality, even if it remains ontologically true.

  Therefore, the dependency is reciprocal:
  1.  **Factual truth needs the public realm:** Without a space where witnesses can speak and be heard, facts dissolve into private opinion or silence.
  2.  **The public realm needs factual truth:** Without a stable ground of "what is," political debate becomes unmoored, drifting into pure fabrication.

  The fragility arises because the public realm is not a natural given; it is instituted through laws, norms, and language. If the institutions that sustain the public realm are manipulated, the "appearance" of the fact can be blocked without the fact itself being logically refuted.

  ### 2. Lying vs. Defactualization

  You ask whether bureaucratic omission counts as lying in Arendt's framework. To answer this, we must distinguish between the **traditional lie** and what Arendt identifies as the **modern assault on factuality**.

  *   **The Traditional Lie:** This acknowledges the existence of the truth it seeks to hide. When a politician says, "I did not sign that order," they are engaging in a binary opposition with the truth. The truth remains the standard; the lie is a deviation. Arendt notes that traditional lying respects the truth enough to try to conceal it.
  *   **The Modern Defactualization:** In *Truth and Politics* and *The Origins of Totalitarianism*, Arendt warns of a more radical danger. This is not hiding the truth, but destroying the distinction between truth and falsehood. It involves creating a consistent fictional narrative that renders the factual truth irrelevant or incomprehensible.

  Bureaucratic omission falls into this second category. It is not a lie in the traditional sense because it makes no false assertion. Instead, it operates as a **structural defactualization**. By removing the vocabulary or administrative categories necessary to articulate a fact, the institution does not deny the fact; it renders it **politically nonexistent**.

  In Arendt's terms, this is more dangerous than lying. A lie can be exposed by a witness. But if the institutional framework makes the witness's testimony unintelligible (e.g., categorizing a civilian death as "collateral damage" or "statistical noise" such that it no longer registers as a moral or political event), the fact is not contradicted—it is dissolved. The omission attacks the *conditions of appearance* rather than the *content of the appearance*.

  ### 3. Institutional Framing and the "Administratively Unthinkable"

  This brings us to the mechanism of omission you described. Arendt was deeply concerned with how language and clichés can shield individuals from reality (a theme central to her analysis of Eichmann, though we need not dwell on the trial itself). She observed that bureaucratic language often functions to prevent reality from "penetrating" the mind of the actor.

  When an institution structurally excludes a fact from its vocabulary, it creates a gap in the common world. Arendt argues that the common world is what gathers people together while preventing them from falling over one another. It is the "table" that sits between them. Institutional framing constitutes the material of that table.

  If the framing excludes certain realities:
  1.  **Testimony is neutralized:** A witness may speak, but if the categories to receive their testimony do not exist within the decision-making structure, their speech is not "action" (which reveals reality) but merely "noise."
  2.  **Plurality is reduced:** Politics requires diverse perspectives on a shared reality. If the reality is framed so narrowly that certain perspectives cannot be articulated, plurality collapses into a singular, administrative viewpoint.
  3.  **Experience is invalidated:** Arendt warns that the deepest damage occurs when a fictional narrative can no longer be corrected by experience. Bureaucratic omission achieves this by ensuring that experience (the fact) never enters the realm where correction could take place. The fact does not contradict the narrative because the fact is never allowed to appear *as* a fact.

  ### 4. Does Omission Destroy the Common Reality?

  Yes. In Arendt's framework, an omission that asserts no untruth can still destroy the common reality that makes politics possible.

  Politics, for Arendt, is the capacity to act and speak among equals regarding a shared world. This requires a baseline of **factual reliability**. If the institutional structure allows for the systematic exclusion of facts—not by denying them, but by making them administratively invisible—the "shared world" fractures. We are no longer arguing about *what to do* about a fact; we are inhabiting different ontological realities.

  This is the "more fundamental mode of defactualization" you suspect. It operates **prior to falsehood**. Falsehood presupposes a truth to negate. Omission of this kind prevents the truth from emerging into the space where it could be negated or affirmed. It creates a "blind spot" in the public realm.

  For Arendt, this is catastrophic because it undermines **freedom**. Freedom is not an inner state but the capacity to begin something new within the public realm. If the public realm is structured to render certain realities unthinkable, the capacity for genuine action is replaced by bureaucratic behavior. The actors are no longer responding to the world as it is, but to a simulated world constructed by administrative categories.

  ### Conclusion

  The conceptual issue at stake is the **ontological dependence of factuality on the public realm**. Arendt's insight is that facts do not survive on their own merit; they survive only if there is a space where they can appear and be preserved.

  Bureaucratic omission is not merely a lie; it is an **assault on the space of appearance itself**. By dismantling the conditions for recognizing a fact, it does not just hide the truth—it deprives the truth of its worldly reality. In Arendt's view, this is more destructive than lying because it leaves no ground for opposition. A lie can be countered by truth; a structural omission leaves the truth without a voice, without a category, and ultimately, without a world. This reveals that the greatest threat to political truth is not the assertion of falsehood, but the erosion of the institutional and linguistic structures that allow truth to appear at all.
