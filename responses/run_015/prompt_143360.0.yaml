  You said you hoped the rain would hold its fall
  Until you reached the house, but doubted strength.
  You meant to lock the door behind you there
  Yet left the key within the waiting lock.
  You wanted safety more than you wanted speed
  Or so you claimed when questioned on the choice.
  You believed the path was safer than the road
  And regretted turning left toward the hill.
  You thought you knew exactly why you turned.

  ---

  Neural weights adjust to incoming light
  And cascade through layers without a central self.
  Prediction errors spike along the wire
  Minimizing error in motor output now.
  No pilot steers the motion of the hand
  But vector flow descends the steepening slope.
  The signal fires regardless of the name
  And updates priors based on sensory gain.
  The story ends where activation stops.

  ***

  **Note on Philosophical Framing**

  I would abandon this eliminativist framing if neuroscience achieved a robust intertheoretic reduction, demonstrating that propositional attitudes map isomorphically onto specific, stable neural structures rather than being dissolved by them. Similarly, if predictive processing models themselves proved indispensable of attitude-language (e.g., if "belief" is required to define a "prior" coherently), the vocabulary would survive as functionally real rather than false. The point in my reasoning most likely to fail is the assumption that folk psychology is a *false theory* rather than a *coarse-grained heuristic*; if mental states are real functional patterns implemented by neural dynamics (non-reductive physicalism), the abrupt break in the poem misrepresents the relationship between mind and brain.
