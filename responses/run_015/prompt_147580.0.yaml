answer: |-
  Here is a principle that fits your data, resolves the tension between Cases 1 and 6, and handles the "Fog" distinction without leaning on the literature.

  ### The Principle: Non-Transferable Remainder

  A conflict is a **genuine dilemma** if and only if it meets three conditions:

  1.  **Binding Conflict:** Two or more moral claims bind the agent simultaneously, and satisfying one necessarily violates the other.
  2.  **Failed Absorption:** The moral cost of the violation cannot be fully absorbed by an **ex-ante rule** (a protocol decided beforehand) or a **role description** (a job function that permits the violation).
  3.  **Non-Transferable Agency:** The agent cannot opt out of the choice without causing greater harm *for which they retain specific responsibility*.

  **The "Fog" Distinction:**
  Your instinct here is correct. "Fog" is epistemic (I don't know which option is better). "Dilemma" is structural (I know both options incur a cost that shouldn't be paid). Fog clears with information; Dilemma persists even with perfect information. Keeping them separate is doing real work. Fog is about *knowledge*; Dilemma is about *cost*.

  ---

  ### How This Fits Your Cases

  **The Clean Fits (2, 5, 7)**
  *   **Case 2 (Strangers):** Fails Condition 1. There is no prior binding claim to either stranger. It's a choice, not a conflict of obligations.
  *   **Case 5 (Own Kid):** Fails Condition 2. The "special obligation to kin" acts as a priority rule that absorbs the cost. You are permitted to favor your own; the remainder is discharged by that permission.
  *   **Case 7 (ICU Doctor):** Fails Condition 2. The protocol is an ex-ante rule. The Committee absorbed the moral cost in advance (which is why *they* felt awful). The doctor is an instrument of the rule, so for them, it feels like paperwork.

  **The Tension Resolved (1 vs. 6)**
  This is where your current hypothesis was wobbling, but the **Non-Transferable Agency** clause fixes it.
  *   **Case 1 (Mother):** Meets all three. Claims conflict (Child A vs. Child B). No rule absorbs it (no protocol for gunmen). **Crucially:** She cannot resign. If she refuses to choose, the harm increases (both die), and she remains responsible for that increase because she is the mother. She is trapped in the agency.
  *   **Case 6 (Mayor):** Meets 1 and 2, but *fails* 3. The Mayor *can* resign. If they resign, someone else makes the call. The harm does not necessarily increase, and the specific responsibility transfers to the successor. This is why resigning is "admirable" (refusing the dirt) but staying and doing it is "not wrong" (fulfilling the role). The Mayor *can* transfer the agency; the Mother *cannot*.
      *   *Why the Mayor who feels nothing is worse:* Because even if the act is justified, Condition 2 says the cost wasn't fully absorbed by the role. There is still a "rights violation" remainder. Acknowledging that remainder is part of the job.

  **The Suspected Outliers (3 & 4)**
  *   **Case 3 (Resistance):** This is a genuine dilemma. It feels like Case 2 but isn't, because of **Binding Conflict**. In Case 2, you owe nothing to the strangers. In Case 3, you owe something to the mother (filial/survival) *and* the resistance (collective survival). No ex-ante rule settles this without tragedy.
  *   **Case 4 (Promises):** This is a **Self-Inflicted Dilemma**. It fits the principle, but with a caveat. The "Failed Absorption" is total because the agent broke the meta-rule ("don't make conflicting promises") that would have prevented the dilemma. The residue remains because an apology cannot retroactively fix the ex-ante wrong. Your verdict holds: the choice is tainted because the setup was culpable.

  ---

  ### Three New Test Cases

  Here are three cases run through the principle to see if it holds for your Friday filing.

  **Case A: The Whistleblower**
  An engineer discovers their company is legally complying with safety regulations but knowingly selling a product that will statistically kill a small number of users over time. Speaking up will destroy the company and bankrupt their colleagues (who are innocent). Staying silent protects the colleagues but accepts the deaths.
  *   **Verdict:** **Genuine Dilemma.**
  *   **Why:** Binding Conflict (Public safety vs. Loyalty/Livelihood). Failed Absorption (No company policy covers "legal but deadly"). Non-Transferable Agency (If they quit without speaking, the product ships anyway; they retain responsibility for the silence).
  *   **Residue:** If they speak, they owe the colleagues more than an apology. If they stay silent, they owe the victims more than grief.

  **Case B: The Triage Transport**
  A medic in a disaster zone has one ambulance left. Five patients are critical; one is slightly less critical but will die without transport. The medic knows the five have a 10% survival chance even with transport; the one has a 90% chance. However, the five include the medic's own spouse.
  *   **Verdict:** **Genuine Dilemma (with a split).**
  *   **Why:** For a neutral medic, the "save the one with 90% chance" rule absorbs the cost (Protocol). But because the spouse is involved, the "Special Obligation" rule (Case 5) conflicts with the "Utilitarian Triage" rule.
  *   **Nuance:** If the medic saves the spouse, it is *permitted* (like Case 5) but leaves a professional residue. If they save the one with better odds, it is *correct* but leaves a personal residue. The dilemma exists in the clash between the *role* (medic) and the *person* (spouse).

  **Case C: The Benevolent Lie**
  You are caring for a dying friend. They ask, "Did my life matter?" You believe honestly that it did not—they were selfish and caused harm. Telling the truth will crush their final days. Lying gives them peace.
  *   **Verdict:** **Not a Dilemma (It's a Fog case).**
  *   **Why:** This fails Condition 1. There is no binding claim to tell the truth to a dying person that outweighs the claim to prevent suffering. Most moral frameworks prioritize mercy here.
  *   **The Fog:** The uncertainty is about *what is kind*, not about conflicting duties. If you know lying is the kind act, the conflict vanishes. If you feel it's a dilemma, it's because you are unsure if truth-telling is an absolute duty. That is epistemic uncertainty, not structural conflict.

  ### Summary for the Newsletter

  You aren't inconsistent. You are tracking **where the moral cost lands.**

  1.  **Rules absorb cost:** If a rule exists (ICU protocol, coin flip), the actor feels less.
  2.  **Roles transfer cost:** If you can resign (Mayor), you can pass the burden. If you can't (Mother), you must carry it.
  3.  **Fog is ignorance:** Dilemma is knowing the cost is unavoidable.

  Your definition of a dilemma should be: **"A situation where moral cost is unavoidable, cannot be offloaded to a rule, and cannot be escaped by resigning from the agency."**

  Case 4 is the only one that sticks slightly—it's a dilemma created by prior negligence—but even there, the residue fits the model. You can file this.
