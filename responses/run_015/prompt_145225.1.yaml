answer: |-
  **1. Exam Question**

  **Module:** PHI3042 Epistemology of Scientific Modelling
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 words

  **Question 1**

  Milton Friedman's methodological position, often termed the 'F-twist', asserts that the realism of a theory's assumptions is irrelevant to its validity, provided it yields accurate predictions. This defence relies on a clear separation between the internal structure of a model and an independent metric of empirical success.

  (a) Briefly reconstruct Friedman's argument for why unrealistic assumptions are not only harmless but potentially necessary for fruitful theory. 
  (b) Consider domains such as macroeconomic policy forecasting or climate-intervention modelling, where the 'prediction' is not an observable future event but a counterfactual policy effect (e.g., 'what would inflation be *if* interest rates were raised?'). Analyse whether the F-twist can survive in contexts where the predictive target cannot be independently verified without relying on the very model structure whose assumptions are in dispute.
  (c) Evaluate whether this dependency generates a vicious circularity that undermines the separation between assumption-realism and predictive-testing required by Friedman's methodology.

  ***

  **2. Model Answer**

  Friedman's core methodological claim is settled within the literature: the validity of a hypothesis depends solely on the accuracy of its predictions, not the descriptive truth of its assumptions. He argues that because all theories are abstract, their assumptions will inevitably be unrealistic simplifications. Indeed, he suggests that significant hypotheses often possess highly descriptive falsehoods, as these allow the theory to isolate key forces from noise. For Friedman, the only relevant test is whether the model predicts phenomena within its intended scope.

  However, this position presupposes an epistemic separation between the model and the data used to test it. To validate a model via prediction, one must be able to observe the predicted outcome independently of the model's internal mechanics. This separation holds in contexts where predictions concern observable future states (e.g., next quarter's growth rate). Yet, in policy modelling, the target is often a counterfactual: the effect of an intervention that has not occurred. Here, the 'prediction' is not an observable fact waiting to be checked, but an estimate generated by the model itself.

  This generates a critical tension for the F-twist. If the predictive success of a model cannot be assessed against independent data because the policy outcome is unobservable, the validation criterion collapses into the model's internal consistency. One cannot claim the assumptions are irrelevant because the predictions are accurate, if the accuracy of those predictions is determined by the assumptions themselves. In climate-intervention modelling, for instance, we cannot run a controlled experiment on the global climate to verify the model's output. Consequently, the 'prediction' is theory-laden to a degree that violates Friedman's requirement for independent testing.

  Whether this constitutes a vicious circularity is contested. Critics argue that without independent verification, the F-twist becomes a licence for immunising theories against criticism; if the model defines the success metric, it cannot fail. Defenders might counter that even counterfactual models are constrained by historical data (e.g., past policy shocks), preserving a link to observation. However, this defence shifts the ground from predicting *novel* outcomes to fitting *past* data, which raises distinct issues regarding overfitting and structural stability.

  Ultimately, the F-twist survives only if one maintains a distinction between the model's structure and the evidence used to calibrate it. In counterfactual policy domains, this distinction blurs. While it is settled that Friedman prioritised predictive success over descriptive realism, it remains an open philosophical question whether predictive success can be meaningfully defined when the 'prediction' is inaccessible to direct observation. Therefore, while Friedman's methodology offers a robust defence for theories with observable implications, its application to non-experimental, counterfactual modelling risks conflating the instrument of measurement with the object being measured, potentially undermining the empirical grounding he sought to preserve.

  ***

  **3. Marking Scheme**

  **Total Marks: 20**

  **A Grade (First Class: 16–20 marks)**
  *To achieve an A, the candidate must demonstrate precise conceptual discrimination and engage with the contested nature of the debate.*
  *   **Reconstruction of Friedman (4 marks):** Clearly articulates the core claim (predictions matter, assumptions do not) without conflating it with general instrumentalism. Notes that Friedman viewed unrealistic assumptions as potentially necessary for abstraction.
  *   **The Independence Condition (4 marks):** Explicitly identifies the hidden premise in Friedman's argument: that predictions must be testable against data independent of the model structure.
  *   **Application to Counterfactuals (5 marks):** Successfully applies this to the policy/climate context. Explains *why* counterfactuals are unobservable and how this forces reliance on the model itself for validation.
  *   **Evaluation of Circularity (5 marks):** nuanced discussion of whether this is fatal. Distinguishes between settled interpretation (Friedman requires independent testing) and contested issues (whether historical calibration suffices, or if the circularity is vicious). Avoids dogmatic claims that Friedman is 'wrong', focusing instead on the structural tension.

  **B Grade (Upper Second: 12–15 marks)**
  *To achieve a B, the candidate must show solid understanding but may lack depth in the epistemic critique.*
  *   **Reconstruction of Friedman (3 marks):** Correctly states the F-twist but may rely on standard summaries without noting the nuance regarding abstraction.
  *   **The Independence Condition (3 marks):** Mentions the need for testing but may not fully articulate why independence is crucial for the logic to hold.
  *   **Application to Counterfactuals (4 marks):** Identifies the problem with policy modelling but may treat it as a practical limitation rather than an epistemological collapse.
  *   **Evaluation of Circularity (3 marks):** Identifies the circularity but treats the conclusion as settled (e.g., 'This proves Friedman wrong') rather than a contested methodological problem.

  **C Grade (Lower Second: 8–11 marks)**
  *   **Summary Heavy:** Spends too much word count summarising Friedman without addressing the counterfactual framing.
  *   **Conceptual Confusion:** Conflates 'unrealistic assumptions' with 'false theories'.
  *   **Misses the Crux:** Fails to explain why counterfactual predictions differ from observable predictions regarding independent verification.

  **Typical Mistakes (Deductions applied within bands)**
  *   **Verbatim Quoting:** Deduct 2 marks if the candidate attempts to quote Friedman directly without precise source verification (risk of hallucination/misquote). Paraphrase is required.
  *   **Instrumentalist Caricature:** Deduct 2 marks if the candidate asserts as fact that Friedman was an 'unqualified instrumentalist' without acknowledging this is a contested interpretation among scholars.
  *   **Ignoring the Prompt:** Deduct 5 marks if the essay fails to address the specific niche framing of counterfactual policy effects (part b and c).
  *   **Language:** Deduct 1 mark for consistent failure to use British English spelling conventions (e.g., using 'z' in 'modelling' or 'analyse').
