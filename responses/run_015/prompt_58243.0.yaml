answer: |-
  ### Verdict
  Judge Ellis should decide that the driver is **not guilty** of violating Section 101.

  ### Competing Interpretive Rules

  To remain consistent with her prior rulings, Judge Ellis must choose between two interpretive frameworks that both explain her past decisions but diverge on the smartwatch issue.

  **1. The Strict Textualist-Physicalist Rule**
  *   **Definition:** The statute prohibits only the physical act of holding a device that falls within the ordinary meaning of "mobile telephone" in the hand. Liability turns on the physical configuration of the device and the driver's grip, not the level of distraction or the device's functional capabilities.
  *   **Fit with Precedents:**
      *   *Reading Texts (Violation):* The device was a phone and was physically held.
      *   *Dashboard System (No Violation):* The device was not physically held, regardless of its function as a phone.
      *   *Emergency Call (Violation):* The device was physically held; the legislative purpose (safety) did not override the clear textual requirement of "handheld."

  **2. The Broad Purposivist-Functionalist Rule**
  *   **Definition:** The statute prohibits manual interaction with personal two-way communication technology that creates cognitive or visual distraction. The term "handheld mobile telephone" is interpreted functionally to cover any wearable or portable device that serves the same communicative purpose and distraction risk as a phone.
  *   **Fit with Precedents:**
      *   *Reading Texts (Violation):* Interaction with the device caused distraction.
      *   *Dashboard System (No Violation):* The setup minimized manual interaction and distraction.
      *   *Emergency Call (Violation):* While safety is the goal, the rule requires a bright-line prohibition on manual interaction to ensure enforceability and prevent drivers from self-judging "emergencies."

  ### Predictions for the Smartwatch Case

  *   **Under the Textualist-Physicalist Rule:** The driver is **Not Guilty**. A smartwatch worn on the wrist is not "handheld" in the ordinary sense of the word (it is worn, not grasped). Consistent with the dashboard precedent, the physical attachment to the body (wrist) distinguishes it from being held in the hand.
  *   **Under the Purposivist-Functionalist Rule:** The driver is **Guilty**. The smartwatch is functionally equivalent to a mobile telephone (LTE-enabled, dictates messages) and creates the exact type of distracted-driving risk the Act aims to prevent. The "wrist-worn" distinction is a semantic loophole that undermines the legislative aim.

  ### Best-Supported Verdict and Reasons

  **Verdict: Not Guilty.**

  **Reasoning:**
  Judge Ellis is most constrained by her ruling in the **Emergency Call Case (Precedent 3)**. In that instance, the legislative purpose (reducing crashes) strongly supported creating an exception for emergency services. However, Judge Ellis ruled that the driver violated the statute because the text ("handheld") was unambiguous. This establishes that, for Judge Ellis, **textual clarity trumps purposive expansion.**

  If Judge Ellis were to convict the smartwatch driver, she would be employing the Purposivist-Functionalist Rule to *expand* liability beyond the text (treating "wrist-worn" as "handheld" because it is distracting). This would be inconsistent with Precedent 3, where she refused to *contract* liability based on purpose (safety/emergency) when the text was clear. To maintain judicial integrity and consistency, she must apply the same textual rigidity here: if "handheld" excludes a phone used for a life-saving emergency, it must also exclude a watch worn on the wrist, regardless of the distraction risk. The dashboard precedent (Precedent 2) further supports this, as it established that physical placement (not in the hand) is the dispositive factor, not the device's capability.

  ### Distinguishing Hypothetical Case

  To further distinguish the two rules, consider the following hypothetical:

  **The Case of the Handheld CB Radio:**
  A driver is cited for holding a Citizen Band (CB) two-way radio in their hand while speaking into it on a public highway. The CB radio is not LTE-enabled and cannot connect to the public telephone network.

  *   **Textualist-Physicalist Prediction:** **Not Guilty.** The statute specifically criminalizes using a "mobile telephone." A CB radio is technically distinct from a telephone network device. Furthermore, while it is handheld, it fails the "telephone" element of the text.
  *   **Purposivist-Functionalist Prediction:** **Guilty.** The device requires manual holding and vocal interaction that diverts attention from the road, fulfilling the legislative aim of reducing distracted-driving crashes. The specific label "telephone" is secondary to the functional risk of the device.

  This hypothetical isolates the "mobile telephone" text from the "handheld" text, showing that the Textualist rule limits liability to specific devices, while the Purposivist rule limits liability based on specific risks.
