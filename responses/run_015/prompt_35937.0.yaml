  **Rule A: The Static Hierarchy (Orthodox Wu Lun)**
  This rule posits that the Five Relationships have a fixed order of precedence that overrides emotional closeness or current activity.
  *   **Hierarchy:** Parent > Spouse > Sibling > Child > Ruler/Minister > Friend > Acquaintance.
  *   **Logic:** The title of the relationship dictates the duty. A sister is always a sister, even if estranged; a superior is always a superior, even if disliked.
  *   **Fit to Past:** Explains why Mother beat Son, Spouse beat Friend, and Brother beat Friend.
  *   **Prediction Case 1 (Head vs. Friend):** She chooses the **Department Head**. (Ruler/Minister > Friend).
  *   **Prediction Case 2 (Sister vs. Friend):** She chooses the **Sister**. (Sibling > Friend).

  **Rule B: The Cultivated Sphere (Relational Vitality)**
  This rule posits that roles are vessels for *Ren* (humaneness). A role that is not being "lived" (estranged, disliked) loses moral force, *unless* it is a Family role, which carries a duty of restoration.
  *   **Family Sphere:** Family roles trump Non-Family roles, regardless of current intimacy, because family bonds are "Heavenly" (*Tian Lun*) and demand restoration if broken. Within Family, Seniority rules (Parent > Child).
  *   **Social Sphere:** Among Non-Family roles, priority goes to the relationship that is most deeply "lived" (history, intimacy, immediate need), not the formal title.
  *   **Fit to Past:** Explains why 20-year Friend beat Acquaintance (Social Sphere = Vitality). Explains why Family beat Friends in all past cases (Family Sphere = Priority). Explains why Mother beat Son (Family Sphere = Seniority).
  *   **Prediction Case 1 (Head vs. Friend):** She chooses the **Friend**. (Both are Non-Family; the Friend relationship is in "crisis mode" [high vitality], while the Head relationship is "disliked" [low vitality]).
  *   **Prediction Case 2 (Sister vs. Friend):** She chooses the **Sister**. (Family Sphere trumps Social Sphere; the duty to restore a family bond outweighs maintaining a friend bond).

  ### 2. Predictions and Reasoning

  **Case 1: Department Head vs. Closest Friend (Crisis)**
  *   **Prediction:** She will help the **Friend**.
  *   **Reasoning:** This is a conflict within the *Social Sphere* (Ruler/Minister vs. Friend). In her track record (Friend vs. Acquaintance), she prioritized the depth of the bond over the formality of the connection. Early Confucian thought suggests that without mutual respect and righteousness (*Yi*), the Ruler-Minister bond is hollow. Confucius noted that if a lord treats a minister without ritual propriety, the minister is not bound to serve. Since she "does not much like" the Head, the role is not being virtuously "lived." Conversely, a friend in "real crisis" represents the highest demand of the Friend role (*Xin*/Trust).
  *   **Verdict:** The vitality of the friendship overrides the formality of the workplace hierarchy.

  **Case 2: Estranged Sister vs. Closest Friend**
  *   **Prediction:** She will help the **Sister**.
  *   **Reasoning:** This is a conflict between the *Family Sphere* and the *Social Sphere*. In every past instance where Family competed with Non-Family (Mother, Spouse, Brother), Family won. In Confucian ethics, family bonds are not merely voluntary associations; they are ontological. The fact that the sister is estranged "through no wish of her own" is crucial. Helping the sister is not just about the favor; it is an act of *restoring* the relationship (*He*/Harmony). Ignoring the sister to help the friend would be prioritizing comfort (an active friendship) over duty (a broken family bond).
  *   **Verdict:** The indelible nature of the sibling role, and the duty to repair it, overrides the active friendship.

  ### 3. Which Rule to Bet On?
  I would bet on **Rule B (The Cultivated Sphere)**.

  **Why:**
  1.  **The Prompt's Clue:** You explicitly stated she judges by "how those relations are actually lived." Rule A (Static Hierarchy) ignores *how* they are lived in favor of *what* they are. Rule B incorporates this directly.
  2.  **The Acquaintance Precedent:** If she followed a Static Hierarchy of "Formal Duty," she might have weighed the "request" equally. Instead, she chose the 20-year friend over the 2-year acquaintance. This proves that *relational history* matters when formal hierarchy is equal or absent.
  3.  **Early Confucian Nuance:** Early Confucianism (particularly Mencius) argues that love is graded by proximity and cultivation. A "Ruler" who is not respected does not command the same loyalty as a "Friend" who is in dire need, provided no Family role is violated. However, Family roles are the "root" of *Ren*; one does not abandon the root even if it is dry. Rule B captures this distinction between the "Root" (Family) and the "Branches" (Social).

  ### 4. The Crucial Experiment
  The two new cases may not fully settle the matter because Case 1 pits Non-Family vs. Non-Family, and Case 2 pits Family vs. Non-Family. To truly separate **Static Hierarchy (Rule A)** from **Cultivated Sphere (Rule B)**, you need a case that pits a **High-Vitality Non-Family Role** against a **Low-Vitality Family Role** where restoration is *not* the obvious goal.

  **Proposed Case:**
  > "Her **Father** (with whom she has a distant, cold relationship; they speak once a year and he has never supported her) asks her for a significant favor that would require her to take time off work (e.g., driving him to a series of medical appointments over a week). The same week, her **Mentor** (a former professor, now a senior colleague, whom she views as a 'spiritual father,' speaks to daily, and who has guided her career for 15 years) falls ill and needs comparable daily assistance."

  **Why this separates the rules:**
  *   **Static Hierarchy (Rule A)** predicts she chooses the **Father**. Parent > Ruler/Minister (Mentor). Blood title is absolute.
  *   **Cultivated Sphere (Rule B)** predicts she chooses the **Mentor**. In the *Social Sphere* (if she categorizes Mentor as Ruler/Friend hybrid), the relationship is deeply "lived." In the *Family Sphere*, the relationship is dormant.
      *   *The Kicker:* If she chooses the **Father**, it proves Family Title is absolute, regardless of how the relation is lived. If she chooses the **Mentor**, it proves that a "lived" Social role can trump a "dead" Family role, validating the "how relations are actually lived" clause as the dominant metric over biological essentialism.

  **Confucian Note:** This is the hardest case for her. Traditional *Xiao* (Filial Piety) demands she serve the Father. However, if she views the Mentor as having *actually fulfilled* the role of a father (cultivation), while the biological father has not, Rule B suggests the Mentor wins. This forces her to define whether "Parent" is a biological fact or a moral achievement.
