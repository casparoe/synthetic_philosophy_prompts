answer: |-
  You have identified a genuinely vexing dialectical pattern, and your analysis of why it resists easy classification is astute. To answer your primary question directly: there is no single, canonical term established in the literature specifically for this manoeuvre within the philosophy of dreams. While the phenomenon is frequently noted—often in footnotes or critical replies—it lacks a standardized label akin to 'Motte-and-Bailey' or 'Straw Man'.

  However, the pattern you describe is recognised as a significant methodological hazard in philosophy of mind. Below, I analyse why existing terms fall short, propose a precise coinage for the phenomenon, distinguish it from related fallacies, and indicate where else it appears.

  ### 1. Why Existing Terminology Is Insufficient

  You are correct to dismiss the **Motte-and-Bailey** analogy. In a Motte-and-Bailey, one retreats to a trivially true position (the Motte) when challenged, only to expand back to a controversial claim (the Bailey) when safe. In the dream debate, neither 'occurrent experience' nor 'memory trace' is trivial; both are ontologically robust and contested. The arguer is not retreating to safety, but rather shifting the ontological ground beneath the evidence.

  Similarly, your hesitation regarding **Equivocation** is well-founded. Classical equivocation involves using a single word with two different definitions (e.g., 'bank' of a river vs. 'bank' for money). In the case you describe, the technical terms ('experience', 'representation') often retain their definitions, but their *temporal application* shifts. The arguer accepts the definition of 'phenomenal experience' but toggles whether the evidence provided (the report) counts as proof of that experience occurring *then* or merely being constructed *now*.

  ### 2. A Proposed Coinage: The Phenomenal-Mnemic Slide

  Given the absence of an established term, I propose we label this the **Phenomenal-Mnemic Slide**.

  **Definition:** The Phenomenal-Mnemic Slide occurs when an arguer selectively treats a mental phenomenon as either an occurrent, phenomenal state (phenomenal) or a retrospective, representational construction (mnemic) without justification, solely to evade dialectical pressure.

  **Mechanism:**
  *   **Phase 1 (Defence of Existence):** The arguer treats the waking report as a transparent window into a past phenomenal state. (e.g., 'The vividness of the report proves the experience occurred.')
  *   **Phase 2 (Defence of Accuracy/Physics):** When the content of the report contradicts physical constraints (e.g., impossible geometry) or neural constraints (e.g., sensory blockade), the arguer treats the report as a mnemic construction. (e.g., 'The brain fills in the gaps upon waking; it need not match reality.')

  The 'Slide' is the frictionless transition between these two phases. It allows one to claim the *authority* of experience without accepting the *constraints* of experience.

  ### 3. Boundary Cases and Distinctions

  It is crucial to distinguish the Phenomenal-Mnemic Slide from legitimate theoretical adjustments.

  **Vs. Auxiliary Hypotheses (Lakatos):**
  In the methodology of scientific research programmes, theorists may adjust 'protective belt' hypotheses to save a hard core from falsification. This is permissible provided the adjustments are consistent and predictive. The Phenomenal-Mnemic Slide differs because it is *retrospectively inconsistent*. It does not predict when a report should be treated as phenomenal versus mnemic; it decides post hoc based on whether the report helps or hinders the argument.

  **Vs. Ordinary Ambiguity:**
  In many areas of psychology, the line between perception and memory is genuinely blurred (e.g., working memory). A philosopher acknowledging this ambiguity is not committing the Slide. The fallacy arises only when the ambiguity is exploited *strategically* to insulate a claim from criticism. If one admits the uncertainty and argues for a probabilistic view, one is consistent. If one insists on certainty by toggling the status of the evidence, one is sliding.

  ### 4. Broader Applications in Philosophy of Mind

  This manoeuvre is not unique to the philosophy of dreams. It appears wherever the immediacy of consciousness is difficult to verify empirically.

  **Peripheral Vision and 'Fill-In':**
  Daniel Dennett and others have argued that we do not have rich phenomenal experience in our visual periphery; rather, we have a 'judgement' that we could see it if we looked. When challenged on the feeling of richness, defenders of the 'fill-in' theory may suggest the experience is real but sparse. When challenged on change blindness, they suggest the experience is a memory construct. The status of the peripheral 'experience' slides between occurrent and representational to match the data.

  **Pain Asymbolia:**
  In cases where patients report feeling pain but not minding it, theorists debate whether the phenomenal quality of pain is present without the affective component, or whether the memory of the pain is intact while the immediate suffering is not. Arguers often slide between these interpretations to maintain their preferred theory of pain's modularity.

  **The 'Specious Present':**
  Debates regarding temporal experience often rely on whether we experience a duration directly (occurrent) or stitch together snapshots (mnemic/representational). When pressed on continuity, theorists claim direct experience; when pressed on neural latency, they claim representational delay.

  ### 5. Conclusion

  While you will not find this specific pattern indexed under a single heading in standard texts, it is a recognised species of **dialectical inconsistency**. Calling it the **Phenomenal-Mnemic Slide** captures the specific motion of the argument: a smooth, unargued transition between the ontology of the *now* (the report) and the ontology of the *then* (the dream).

  It differs from general failures of consistency because it exploits a specific epistemic gap: the impossibility of verifying first-person past states. Until we possess a 'phenomenal meter' that can record experience independently of report, this Slide will likely remain a tempting, if fallacious, tool in the philosopher's kit.
