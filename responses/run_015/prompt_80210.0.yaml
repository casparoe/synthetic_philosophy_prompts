answer: |-
  This is a sharp distinction you've drawn between the **Recognition Claim** (performance at $t_0$) and the **Concept Claim** (shared ontological structure). You are correct that the literature conflates them: a failure of recognition is treated as proof of conceptual incommensurability, when it could easily be a failure of calibration or attentional routing.

  Given your constraints (small lab, behavioral + fMRI, no modeling) and your timeline (4–5 years), you need questions that are high-leverage theoretically but do not require the logistical nightmare of recruiting newly sighted cataract patients as your primary data source. You should treat clinical populations as a validation set, not your engine.

  Here are the two questions most worth your investment, ordered by logical dependency, followed by a candid assessment of what to avoid.

  ### 1. Priority One: Is the Cross-Modal Deficit Representational or Computational?
  **(Mapping Noise vs. Conceptual Absence)**

  This is the upstream question. Until you dissociate the *format* of the representation from the *access* to that representation, you cannot interpret any Molyneux-style result. If the deficit is computational (mapping noise), the "Concept Claim" is false—shared structure exists but is temporarily inaccessible. If the deficit is representational, the "Concept Claim" holds.

  *   **Why it is upstream:** You cannot test the *content* of shared concepts (Question 2) or the *direction* of transfer (Question 3) if you haven't established that a shared concept exists at all. If the failure is purely mapping noise, then "asymmetry" just tells you about calibration rates, not ontology.
  *   **Tractability (Behavioral + fMRI):** Since you lack a modeling group, you cannot formally fit noise parameters to behavior. Instead, you must use **experimental dissociation**.
      *   *Behavioral:* Use a "Molyneux-adjacent" paradigm with typical adults under degraded conditions (e.g., brief presentation, masking, or sensory substitution devices). Introduce a dual-task load that specifically taxes cross-modal mapping (working memory/attention) versus one that taxes object recognition. If recognition fails only under mapping load, the concept is likely intact.
      *   *fMRI:* Use Representational Similarity Analysis (RSA). If vision and touch evoke similar pattern geometries in higher-order areas (e.g., LOC) even when behavioral matching fails, you have evidence for shared concepts despite recognition failure.
  *   **Evidence to Move It Up/Down:**
      *   *Move Up:* If you find neural pattern similarity in the absence of behavioral matching. This would be a landmark paper (*Nature Human Behaviour* tier) that fundamentally reframes the Molyneux literature.
      *   *Move Down:* If neural patterns are entirely modality-specific even in late-latency windows. This suggests the "Concept Claim" is dead, and you should pivot to studying how the mapping is learned (Question 2).

  ### 2. Priority Two: Is Transfer Asymmetry a Diagnostic for Calibration?
  **(Touch-to-Sight vs. Sight-to-Touch)**

  Once you have a handle on whether the deficit is representational or computational, asymmetry is your best behavioral lever for determining the *mechanism* of the gap. Most Molyneux work treats the cross-modal bridge as symmetric. It almost certainly isn't.

  *   **Why it is second:** Asymmetry data is only interpretable if you know *what* is being transferred. If Question 1 establishes that concepts are shared but access is noisy, asymmetry tells you which modality requires more calibration to access that common currency.
  *   **Tractability (High):** This is pure psychophysics. You can run this in typical adults using novel objects (to control for semantic labeling) or SSDs. You measure the learning curve for T$\to$V matching versus V$\to$T matching.
      *   *Hypothesis:* If the gap is due to visual calibration (the "Recognition Claim"), T$\to$V should be harder/slower than V$\to$T. If the gap is conceptual, both should be equally impaired.
  *   **Evidence to Move It Up/Down:**
      *   *Move Up:* If you find a robust, replicable asymmetry that correlates with individual differences in visual spatial acuity but not tactile acuity. This localizes the bottleneck to the visual calibration process, supporting your suspicion that the "Concept Claim" is being unfairly blamed for visual calibration issues.
      *   *Move Down:* If asymmetry is weak or inconsistent across stimulus classes (e.g., strong for shape, null for texture). This suggests the mechanism is stimulus-dependent, reducing the theoretical payoff for a general theory of cross-modal perception.

  ### 3. What to Deprioritize (The "Overrated" List)

  You asked for candor on where the philosophical prestige is high but the cognitive science payoff is low.

  *   **The Binary "Yes/No" Molyneux Answer:**
      *   *Verdict:* **Overrated.**
      *   *Reasoning:* A binary answer (e.g., "Subjects succeed at 3 seconds but not 0 seconds") is theoretically thin. It feeds the philosophy journals but stalls the science. Your lab should not aim to solve "Molyneux's Problem"; it should aim to solve the **mechanism of cross-modal integration**. Frame the Molyneux paradigm as a tool, not the goal.
  *   **The Sphere-and-Cube Stimulus:**
      *   *Verdict:* **Overrated.**
      *   *Reasoning:* These shapes are confounded by verbal labeling ("ball," "box") and low-level feature differences. Unless you are doing a historical replication, move to parametric shapes (e.g., morphed 3D prints) that prevent semantic coding. This keeps the work in the realm of perception rather than language-mediated inference.
  *   **Exclusive Reliance on Newly Sighted Patients:**
      *   *Verdict:* **High Risk.**
      *   *Reasoning:* For a 5-person lab, building a pipeline for cataract-restoration patients is a logistical black hole. The $N$ will be too small for the fMRI work you want to do. Use adult learning paradigms or Sensory Substitution Devices (SSDs) as your primary model, and collaborate for patient validation only. Don't let patient recruitment dictate your publication timeline.

  ### Summary of the 4-Year Arc

  1.  **Years 1–2:** Focus on **Question 1**. Develop the behavioral/fMRI paradigm in typical adults that dissociates mapping load from recognition. Publish the dissociation. This establishes your lab's theoretical stance (Recognition $\neq$ Concept).
  2.  **Years 3–4:** Focus on **Question 2**. Use the established paradigm to test asymmetry. If you have capacity, add a patient cohort to see if the asymmetry holds in restoration cases.
  3.  **Year 5:** Synthesis. By now, you should have enough data to argue that the "Molyneux Effect" is largely a calibration artifact (Mapping) rather than a conceptual void.

  This agenda protects you from the philosophical quagmire while leveraging your specific skill set. It moves the field from "Can they do it?" to "Why can't they do it *right now*?"—which is where the actual cognitive science lives.
