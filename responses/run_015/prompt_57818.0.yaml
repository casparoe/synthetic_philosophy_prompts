      *   *Causal Explanations:* Can race explain outcomes (e.g., health disparities)? Yes, via racism/social treatment. Can money explain outcomes (e.g., inflation)? Yes, via economic behavior.
      *   *The Token Case:* This is a classic "counterfeit vs. local currency" problem. If students treat it as cash, does it *become* cash? Or is it a parallel currency? This tests the *grounds* of money (collective acceptance vs. institutional authority).

