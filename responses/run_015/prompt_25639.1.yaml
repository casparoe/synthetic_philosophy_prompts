  4.  **Psychological Architecture:**
      *   Ensure Elias's indifference is clear. He must not *want* the harm, nor *want* the help. He must treat them as irrelevant variables.
      *   Ensure the causal link is identical for both. The code change causes both.
      *   Ensure the reader feels the pull: "He knew the battery would drain and shipped it anyway" (Intent) vs. "It's nice the connectivity improved, even if he didn't plan it" (Side effect).

  5.  **Writing - Focus on Sensory Details & Dialogue:**
      *   The hum of the server room or the AC.
      *   The glow of the screens.
      *   The specific wording of the indifference. "Not my problem," or "Outside scope."
      *   Avoid labeling him "evil." He's just hitting targets.

  6.  **Review against Constraints:**
      *   800-1200 words.
      *   No philosophy mentions.
      *   No moralizing.
      *   Expert style.

  7.  **Refining the Asymmetry:**
