answer: |-
  The conference room glass was soundproof, but the vibration of the HVAC system hummed through the soles of Elias's shoes. On the screen, the projection showed a spike in user retention projected for Q4. Twenty percent. Enough to secure the bonus, enough to secure the department.

  Marcus, the lead engineer, sat with his arms crossed. He tapped a key, and the slide changed. A flowchart appeared, complex and branching.

  "The optimization requires deeper background polling," Marcus said. His voice was flat. "To get the twenty percent, the app needs to handshake with the server every forty seconds instead of every five minutes."

  Elias nodded, pen hovering over his notepad. "And the cost?"

  "Two side effects. We modeled them." Marcus clicked again. "One: Devices older than three years will see a battery drain of approximately fifteen percent per day. Two: The increased handshake frequency inadvertently stabilizes connections in low-bandwidth regions. Users in rural zones will see latency drop by half."

  Elias looked at the numbers. Fifteen percent drain. Half latency. Both were certainties according to the model. Neither was the goal. The goal was the retention spike.

  "Can we isolate the polling?" Elias asked.

  "Not without killing the retention gain. It's the same mechanism."

  Elias capped his pen. He looked at Marcus, then at the marketing rep, then back to the screen. He felt the familiar weight of the decision, not as a moral burden, but as a logistical one. Variables to be balanced.

  "Okay," Elias said. "Ship it."

  Marcus blinked. "You're aware of the battery drain? Legacy users are going to flare up on the forums."

  "I'm aware."

  "And the latency fix? It's not built for that. It's just a byproduct."

  "I'm not weighing either variable," Elias said. He stood up and gathered his papers. "I'm weighing retention. If the code delivers the twenty percent, we ship. I don't care about the battery, and I don't care about the latency. I care about the number."

  He left the room before anyone could argue. The hallway was quiet. He walked back to his desk, sat, and opened his email. The deployment took four hours.

  By the next morning, the tickets were flooding in.

  Elias opened the first thread. Subject: *Battery Life / Version 4.2.* The user was angry. *You guys ruined my phone. It dies by noon. You did this on purpose to make us buy new devices.*

  Elias scrolled. There were hundreds like it. The language was accusatory. *Intentional.* *Planned obsolescence.* *They knew.* The readers in the support threads echoed the sentiment. *Management doesn't care about us.* *It's a feature, not a bug.*

  He minimized the window. The anger felt heavy, solid. It assumed a mind behind the harm. It assumed that because the harm was foreseeable and accepted, it must have been desired. Elias knew he hadn't desired it. He hadn't desired the retention either, not really; he desired the bonus the retention brought. But the anger didn't parse that. The harm made him look like an architect of damage.

  He opened the second thread. Subject: *Connection in Rural Areas.*

  This one was different. *Just wanted to say thanks. I live in Wyoming and finally can stream without buffering.* *Great update.* *Didn't know you guys were focusing on accessibility.*

  Elias read the comments. *Happy accident.* *Nice bonus.* *Glad the new algorithm helped us out.*

  There was no assumption of intent here. The help was treated as luck, a serendipitous byproduct of the system working as intended. No one wrote, *You designed this to help us.* They wrote, *You helped us.*

  Elias sat back. The causal structure was identical. The code change caused the drain. The code change caused the stability. His mental state regarding both was identical: indifference. He had accepted both as the price of the retention spike. He had not sought the harm, nor had he sought the help.

  Yet, the inbox told two different stories.

  On the left, he was a villain who had intentionally degraded a product to force upgrades. The moral weight of the harm had converted his indifference into malice in the eyes of the users. They saw the outcome and reverse-engineered the intent. Because it was bad, he must have meant it.

  On the right, he was a benefactor who had accidentally improved lives. The moral weight of the help kept his indifference intact. Because it was good, it didn't need to be intended to be appreciated. It was just a nice thing that happened.

  Marcus knocked on the doorframe. "PR is asking for a statement on the battery issue. They want to know if we planned the drainage."

  "And the rural connectivity?" Elias asked.

  "They want to put out a press release. 'Commitment to Accessibility.'"

  Elias looked at the two windows on his screen. The angry tickets demanded a confession of intent. The grateful emails demanded an acceptance of credit. To satisfy the first, he would have to admit he did it on purpose. To satisfy the second, he would have to pretend he did it on purpose.

  Both were lies.

  "Tell PR to say we're investigating the battery performance," Elias said. "And tell them... tell them we're pleased the update is working well in low-bandwidth areas."

  Marcus nodded, making a note. "You know they're going to spin the latency fix as a core feature now. They'll say you designed it for them."

  "Let them," Elias said.

  "And the battery?"

  "Let them say what they want."

  Marcus lingered. "You know people think you hated those legacy users. They think you targeted them."

  "I know."

  "And the rural users think you fought for them."

  "I know."

  Elias turned back to the screen. He watched the retention number tick upward in real-time. It was green. It was growing. The harm and the help were just noise around the signal. But he could feel the shape of the judgment settling over the office, over the users, over himself. The bad outcome had carved a groove of intent into his reputation that the good outcome couldn't fill. He had done neither on purpose. He had done both on purpose. The world would decide which was true based entirely on who was hurt and who was helped.

  He closed the email windows. The hum of the HVAC continued, steady and indifferent.
