answer: |-
  **Teleosemantics Decision Tree**

  **Branch Questions**
  Answer 'Yes' or 'No' (or choose the option) to navigate the space.

  1.  **Swampman:** When lightning creates a molecule-for-molecule duplicate of a person, does their state 'fly' possess content, or is it semantically empty?
  2.  **Artificial Design:** Does a neural net trained by engineers to flag tumours have representational content, or only selected biological systems?
  3.  **Lab Evolution:** If a population is selected for a trait over only 100 generations, is this history sufficient for content?
  4.  **Co-option:** If a mechanism selected for *strength* is reused for *signalling*, does content track the ancestral or derived function?
  5.  **Co-option Error:** In that reuse case, if the signal fails, is this a misrepresentation or merely a tool failure?
  6.  **General Malfunction:** If a mechanism fails its selected function due to damage, is it misrepresenting or simply broken?
  7.  **Modal Base:** Is content fixed by what *did* secure survival historically, or what *would* secure success in ideal conditions?

  **Leaves (Positions)**

  1.  **Strict Historical Teleosemantics:** (History Required; Natural Only; Ancestral Function). *Awkward commitment:* Swampman is a zombie; AI has no semantics whatsoever.
  2.  **Liberal Teleosemantics:** (History Required; Design Accepted; Ancestral Function). *Awkward commitment:* A poorly trained AI falsely represents tumours same as a brain.
  3.  **Current Utility Theory:** (History Required; Derived Function). *Awkwardness:* Cannot explain error during the transition period of reuse.
  4.  **Indicator Semantics:** (No History; Reliable Correlation). *Awkwardness:* Swampman represents; misrepresentation becomes nearly impossible.
  5.  **Organisational Account:** (No History; Current System Role). *Awkwardness:* Anything maintaining itself represents, including flames.
  6.  **Unnamed (Design Yes, Short-term No):** *Awkwardness:* Arbitrary cutoff between lab evolution and natural selection.
  7.  **Unnamed (Historical Modal):** (History Required; Ideal Conditions). *Awkwardness:* Content depends on counterfactuals, not actual causal history.

  **Flags**

  **Unoccupied Combination:** Accepting Artificial Design (Q2) but rejecting Lab Evolution (Q3). *Status:* **Merely unattractive.** It implies intelligent design confers semantic status faster than natural selection, which lacks theoretical motivation beyond human chauvinism.

  **Indistinguishable Leaves:** **Strict Historical Teleosemantics** (Leaf 1) vs. **Unnamed Historical Modal** (Leaf 7). *Status:* **Empirically equivalent outside duplicates.** Whether content requires what *did* happen or what *would* happen in ideal conditions rarely diverges in standard contexts. They only genuinely separate in Swampman cases or radical environmental shifts where history and ideal performance come apart.
