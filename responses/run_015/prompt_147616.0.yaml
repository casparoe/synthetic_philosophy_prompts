answer: |-
  **DEPARTMENT OF PUBLIC DELIBERATION**
  **OFFICE OF CIVIC TRANSLATION (OCT)**
  **USER MANUAL & FREQUENTLY ASKED QUESTIONS (REV. 4.2)**
  **Director: Dr. Aris Thorne**

  **1.0 PURPOSE OF THE PUBLIC SQUARE GATEWAY**
  Welcome to the Civic Translation Portal. To maintain a stable Overlapping Consensus, all arguments entering the Public Square must be rendered in Shared Rational Currency. Arguments derived from Comprehensive Doctrines (e.g., theological, metaphysical, or sectarian ethical systems) are classified as "Non-Admissible Premises" until processed. Secular arguments are presumed admissible pending random audit. The goal is not to suppress truth, but to ensure all citizens can access the reasoning without requiring special revelation.

  **2.0 THE TRANSLATION PROTOCOL**
  Citizens invoking religious authority must submit Form 88-PR (Premise Renunciation). You must convert specific divine commands into generalizable public goods accessible to non-believers.
  *Example:* "Scripture forbids X" must become "X undermines social stability."
  *Note:* The original theological motivation must be bracketed. If the translation retains any scent of the sacred, it will be rejected as "Dogmatic Residue." You are not forbidden from believing; you are simply asked to leave those beliefs at the door of deliberation.

  **3.0 TRANSLATION CREDIT SCORE (TCS)**
  To streamline future deliberations, citizens build a Translation Credit Score. This metric tracks your willingness to sanitize your convictions for public consumption.
  *   **+10 Points:** Successfully translating a sacramental claim into utilitarian language.
  *   **-50 Points:** Attempting to vote based on untranslatable conscience.
  *   **+5 Points:** Acknowledging the "Burden of Judgment" when corrected.
  A high TCS grants expedited processing at town halls. A low TCS triggers mandatory counseling. Please note: Secular citizens are not required to build TCS but may do so for goodwill.

  **4.0 REVERSE-DOCTRINAL AUDIT**
  Occasionally, the OCT conducts Reverse-Doctrinal Audits on secular arguments to ensure they contain no hidden metaphysical commitments.
  *Probability of Audit:*
  *   Religious Citizens: 100% (Pre-entry).
  *   Secular Citizens: 0.04% (Randomized).
  If a secular argument is found to rely on unstated assumptions about human dignity or autonomy, it will be flagged as "Covert Comprehensive." However, most secular premises are accepted as "Freestanding" by default, as they align with the prevailing public culture.

  **5.0 EXEMPTION CERTIFICATE FOR EPISTEMICALLY MODULAR BELIEF SYSTEMS**
  Citizens may apply for an Exemption Certificate if they can prove their beliefs are fully separable from their identity and political reasoning.
  *Requirements:*
  *   Notarized statement proving beliefs are held lightly.
  *   Proof that beliefs do not influence moral intuition.
  *   Three references from certified Public Reason Facilitators.
  Historically, 0.00% of applications are approved. Applications are non-refundable. This ensures that only truly modular belief systems—which theoretically exist—enter the square untranslated.

  **6.0 PENALTIES FOR NON-COMPLIANCE**
  Entering the Public Square with untranslated premises may result in:
  *   Immediate silencing during town halls.
  *   Classification as "Unreasonable."
  *   Revocation of deliberative privileges.
  We understand this feels restrictive. However, stability requires that half your thoughts remain private. Thank you for cooperating in the consensus.

  ***

  **Commentary on the choices made**

  This satire targets the critique that Rawlsian public reason imposes an asymmetrical burden on religious citizens. The "Translation Credit Score" exaggerates the expectation that religious believers must constantly sanitize their motivations to be deemed "reasonable," while secular citizens operate on default settings. This maps onto the philosophical objection that public reason is not neutral but favors secular comprehensive doctrines.

  The "Reverse-Doctrinal Audit" highlights the charge that liberalism itself relies on metaphysical assumptions (like autonomy) that are not universally shared, yet escape scrutiny. By making the audit probability vastly different for religious vs. secular actors, the text visualizes the accusation that secularism is treated as "public" while religion is treated as "private."

  The "Exemption Certificate" satirizes the impossibility of separating a person's deepest convictions from their political agency. While no academic proposes this certificate, it dramatizes the practical impossibility of the "dual citizenship" model Rawls suggests. The bureaucratic voice masks the coercion inherent in demanding citizens divide their selves to participate in democracy.
