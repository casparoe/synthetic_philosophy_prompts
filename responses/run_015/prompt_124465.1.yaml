answer: |-
  This is a classic problem in Maimonidean scholarship, and your "fading crutch" versus "permanent scaffold" distinction is an excellent heuristic for untangling it without getting lost in secondary literature. Here is how the conceptual knot breaks down using those terms.

  (a) The accommodationist argument in *Guide* 3:32 pushes strongly toward the "fading crutch" reading because it frames divine law as a therapeutic intervention tailored to a specific historical pathology. Maimonides explicitly compares God to a wise physician who cannot suddenly wean a patient off a harmful habit but must transition them gradually. In this analogy, animal sacrifice is the medicine prescribed to cure the disease of idolatry; it is not the food of health itself. The logic of therapy dictates that once the patient is healed—once idolatry is eradicated and the unity of God is firmly established—the medicine should be discontinued. If the sole rationale for sacrifice is the psychological impossibility of abrupt change, then a community that has achieved spiritual maturity and monotheistic clarity should no longer need the crutch. To continue sacrificing after the "disease" is cured would be like continuing to wear a cast after the bone has healed; it suggests the practice has no intrinsic value beyond its transitional utility, leading naturally to the expectation that the ideal final state would transcend it.

  (b) The restoration material in *Mishneh Torah*, Kings and Wars 11:1, pushes back against this expectation by anchoring sacrifice in the eternal structure of the Torah rather than the transient psychology of the Israelites. Maimonides states that in the Messianic era, when the world is perfected and knowledge of God is universal, the observance of all statutes will return to their previous state, including sacrifices. This asserts that the Torah is everlasting and not subject to historical obsolescence. If sacrifices were merely a fading crutch for ancient idolaters, the Messianic king—the ultimate healer of humanity—would abolish them. By insisting they will be restored, Maimonides implies that sacrifice is not just a historical concession but a constitutive element of the divine service that remains valid even when the original psychological pressure (the prevalence of idolatry) is removed. This demands that sacrifice be part of the final, perfected order, functioning not as a temporary remedy but as a permanent feature of the relationship between God and Israel.

  (c) The "permanent scaffold" distinction can successfully dissolve the logical contradiction between the two texts, but it relocates the tension from a legal inconsistency to a philosophical anthropology. If you read Maimonides as a permanent-scaffold thinker, you argue that human beings are hylomorphic composites of body and soul who never transcend their need for physical action, even in the Messianic era. On this reading, sacrifice is not a "fading crutch" for the ignorant, but a "permanent scaffold" for the embodied; it remains because taking it away would collapse the load-bearing structure of a legal system that requires action, or because physical worship does not compete with intellectual worship but complements it for beings who are not pure intellects. This saves Maimonides from the embarrassment of contradicting himself, but it saddles him with the view that an all-wise lawgiver builds a "second-best" institution into the ideal state forever. It forces the conclusion that the "perfected" human state is not one of pure intellectual contemplation, but one where physical rituals remain necessary concessions to human psychological limits, meaning the "ideal" is always partially constrained by the very limitations the *Guide* suggests we strive to overcome.

  Summary: Reading Maimonides as a permanent-scaffold thinker resolves the textual contradiction by anchoring sacrifice in unchangeable human embodiment, but it forces the conclusion that even the perfected Messianic age relies on concessions to psychological limitation rather than pure intellectual worship.
