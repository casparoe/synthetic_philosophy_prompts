      *   *Dramatic Context:* The three temptations (stones to bread, casting down, sword of Caesar) represent the specific mechanisms of control. The novel resists pure philosophy because the rebuttal isn't an argument; it's a kiss (Alyosha). The rationality is undermined by the lack of love in the Inquisitor's logic.
