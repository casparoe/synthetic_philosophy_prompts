  Regarding your specific framing of counter obligations, I do not think it is redundant with his concepts of spirit and style, but it is perhaps more specific than what he means by spirit. For Hofstadter, the spirit of the letter encompasses a wide range of abstract roles, including stroke weight, angle, curvature, and even the emotional vibe of the font, whereas your theory zooms in specifically on the relational balance of enclosed and open spaces. This is a valuable narrowing of the lens for an essay because it gives you a concrete metric to analyze the gridfonts, but you should be careful not to present it as contradicting Hofstadter so much as highlighting a specific substrate of how that spirit is maintained. If you argue that the spirit is realized through these counter obligations, you stay faithful to his model while adding your own interpretive layer, which is exactly what a good philosophy paper should do.

  You asked if you are wrong to downplay the importance of the grid structure itself, and I think the answer is yes, you should be careful there because the grid is not just a canvas for Letter Spirit but an active constraint that defines the style. The whole point of the project is to show how creativity emerges from strict limitations, and the grid forces the program to make discrete choices about how to approximate curves or diagonals. If you ignore the grid, you risk treating the output as generic typography rather than the specific computational artifact Hofstadter designed. The reason some distorted outputs remain readable is partly due to your counter obligations, but also because the grid enforces a certain structural integrity that prevents the letter from collapsing entirely. Acknowledging the grid shows you understand the medium through which the spirit is being expressed.

  As for your writing itself, you have a few minor typos to clean up, such as recognizably which should be recognizably, and you might want to hyphenate gridfont or keep it consistent throughout your essay. Your reasoning gets a little sloppy when you suggest the program demonstrates this accidentally, because Hofstadter's team explicitly programmed recognition mechanisms that weigh topological features heavily, so the survival of negative-space relationships is a feature rather than a bug. However, this is a small point that you can easily adjust by saying the program reveals this principle rather than demonstrating it accidentally. Overall your core idea is strong and worth pursuing, provided you acknowledge that the positive strokes and the negative spaces are two sides of the same coin rather than competing explanations.
