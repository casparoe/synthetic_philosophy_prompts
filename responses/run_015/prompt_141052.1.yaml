answer: |-
  **Specification for a Rigorous Account of Multi-Polar Traps**

  **1. Discrimination from Lookalikes**
  *   **Requirement:** The account must provide observable signatures that distinguish a genuine trap from a zero-sum distributional conflict, a pure coordination failure, an informational cascade, or a status treadmill. It must specify how much uncertainty about the underlying payoff matrix the diagnosis can survive before becoming unfalsifiable.
  *   **Motivation:** In a status treadmill (e.g., fashion cycles), participants defect to gain relative position; the aggregate may be neutral, not ruinous. In a distributional conflict (e.g., wage bargaining), one side's gain is the other's loss; there is no cooperative surplus being destroyed. A journalist sees only escalating costs and complaints. If the theory cannot distinguish a race where everyone loses absolute welfare (arms build-ups) from one where they merely spend resources to maintain rank (credential inflation where the degree still signals skill), the label becomes a synonym for 'expensive competition'.
  *   **Status:** **Non-negotiable.**

  **2. Traps with Bystanders**
  *   **Requirement:** The theory must distinguish between traps where the competitors are the primary sufferers (internalised costs) and traps where the costs are exported to third parties (externalities). It must state whether the same mechanism explains both or if they require distinct modelling.
  *   **Motivation:** In an arms race, the participants bear the cost of the weapons and the risk of war. In antibiotic resistance or carbon emissions, the competitors (pharmaceutical firms, emitting nations) may reap private benefits while the suffering is distributed among bystanders (patients, the global south). Conflating these leads to policy errors: solving an internal trap requires coordination among racers; solving an external trap requires empowering the bystanders or regulating the spill-over.
  *   **Status:** **Non-negotiable.**

  **3. The Asymmetry of Entry and Exit**
  *   **Requirement:** The account must explain the mechanics of lock-in. It must specify whether exit is prevented by sunk costs, by the immediate concentration of restraint costs against diffuse future benefits, or by the threat of predation upon exit. It must take a position on whether an escape route that is not self-enforcing counts as a viable solution.
  *   **Motivation:** In tax competition, a jurisdiction can theoretically leave the race by raising rates, but capital flees immediately (predation). In doping, an athlete can stop, but loses medals (relative loss). If a solution requires a benevolent external enforcer that cannot be captured (e.g., a global tax authority), the theory must admit that the trap is currently unbreakable, rather than suggesting 'cooperation' as a magic wand. A cure that relies on participants voluntarily ceasing to defect when defection is dominant is not a cure.
  *   **Status:** **Non-negotiable.**

  **4. Traps About Traps**
  *   **Requirement:** The machinery of escape must be treated as endogenous to the competition. The theory must identify when the proposed cure (regulation, cartel, moratorium) becomes a new site of competition or a mechanism for incumbent entrenchment.
  *   **Motivation:** Jurisdictions compete over how much restraint to impose (regulatory arbitrage). In fisheries, quotas can become tradable assets that entrench large operators. In AI safety, moratoria may be used by laggards to catch up or by leaders to cement a monopoly. If the theory treats governance as exogenous, it fails to explain why the trap persists despite widespread recognition. The 'medicine' must be analysed for its own Molochian dynamics.
  *   **Status:** **Non-negotiable.**

  **5. Moloch Without Agents**
  *   **Requirement:** The account must clarify whether agency and foresight are definitional prerequisites. If the concept extends to evolutionary or cultural selection, it must define what substitutes for the claim that 'everyone would prefer otherwise' in the absence of a preferring entity.
  *   **Motivation:** In biological evolution, traits are selected for fitness, not welfare. A parasite that kills its host too quickly is 'trapped' by selection dynamics, but the parasite does not 'prefer' a different outcome. If we apply 'Moloch' here, we are metaphorically imputing preference to a system. If we do not, the concept loses its normative bite (the tragedy lies in the *suffering*, not just the *inefficiency*). The theory must decide if 'Moloch' describes a structural inefficiency or a welfare loss.
  *   **Status:** **Preference** (Strict definition requires agents; loose definition allows selection dynamics).

  **6. Stress Test: The Credence Trap**
  *   **Assessment:** This is the same structure, provided the 'currency' is treated as a utility good.
  *   **Reasoning:** In a credence trap (e.g., political polarisation or academic orthodoxies), participants escalate public commitments they privately doubt to avoid social sanction. The payoff matrix is social standing vs. sincerity. The aggregate outcome is a degradation of public discourse (a collective loss), yet individual defection (speaking truth) is punished.
  *   **Correction:** Do not treat this as distinct. However, note that the cost is epistemic rather than material. The theory must account for cases where the 'resource' being depleted is trust or accuracy, which are harder to measure than money or firepower.

  **7. Stress Test: Races Worth Running**
  *   **Assessment:** This distinction is vital; without it, the theory becomes a blanket condemnation of competition.
  *   **Reasoning:** Priority races in science (e.g., the Human Genome Project) impose costs and stress, but generate public goods (knowledge) that outweigh the duplication of effort. Slowing this field would be a net loss.
  *   **Correction:** The theory must include a baseline condition: a trap exists only if the equilibrium is *Pareto inferior* to a feasible alternative state. If the competition generates positive externalities that exceed the waste of the race, it is not a Moloch trap, it is a market. The condition for leaving it alone is when the marginal social benefit of the race exceeds the marginal private cost of the participants.

  ***

  **Self-Policing: Tensions and Exclusions**

  **Incompatible Desiderata**
  There is a tension between **Requirement 1 (Discrimination)** and **Requirement 5 (Moloch Without Agents)**. Requirement 1 demands we identify that participants 'would rather avoid' the outcome. Requirement 5 asks us to apply this to systems (evolution, markets) where there is no 'would rather'. You cannot jointly satisfy a demand for observed preference and a demand to model agentless selection without stretching the definition of 'preference' until it breaks.
  *Resolution:* Treat 'Moloch' strictly as a multi-agent coordination failure involving welfare loss. Treat agentless dynamics as 'selection traps' or 'evolutionary stable strategies'. Conflating them obscures the possibility of negotiation in the former.

  **The Primary Exclusion**
  **Requirement 1 (Discrimination from Lookalikes)** does the most work in excluding sloppy usage. Popular usage applies 'Moloch' to any difficult situation or hard trade-off. By demanding proof that the outcome is *Pareto inferior* (everyone could be better off) rather than merely *expensive* or *zero-sum*, this requirement filters out mere scarcity, necessary competition, and distributional conflicts.

  ***

  **Scoring of Standard Framings**

  | Desideratum | Tragedy of the Commons | Iterated Prisoner's Dilemma / Arms Race | Cultural / Multi-level Selection |
  | :--- | :---: | :---: | :---: |
  | **1. Discrimination** | **Weak** (Often conflates depletion with competition) | **Strong** (Explicitly models Pareto inferiority) | **Weak** (Fitness $\neq$ Welfare) |
  | **2. Bystanders** | **Strong** (Built on externalities) | **Partial** (Focuses usually on players) | **N/A** (Systemic focus) |
  | **3. Entry/Exit** | **Partial** (Focuses on access, not lock-in) | **Strong** (Models defection incentives) | **Strong** (Models selection pressure) |
  | **4. Meta-traps** | **Weak** (Governance usually exogenous) | **Partial** (Enforcement mechanisms modelled) | **Strong** (Selection on norms) |
  | **5. Agents** | **Strong** (Requires rational grazers) | **Strong** (Requires rational players) | **Strong** (Explicitly agentless) |
  | **6. Credence** | **Weak** (Material focus) | **Partial** (Can model signalling) | **Strong** (Memetic fitness) |
  | **7. Worthwhile** | **Weak** (Assumes depletion is bad) | **Strong** (Can calculate payoffs) | **Weak** (Normatively neutral) |

  **Verdict:** The **Iterated Prisoner's Dilemma / Arms Race** framing is the most robust for human social phenomena, provided it is amended to account for **Requirement 4 (Meta-traps)**. The **Commons** framing is too specific to resource depletion. The **Selection** framing is useful for analogy but fails **Requirement 1** regarding welfare.
