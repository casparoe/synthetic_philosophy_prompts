answer: |-
  The smallpox eradication endgame confirms lexical threshold negative utilitarianism as a robust account of moral motivation but exposes the theory's inability to dictate termination conditions involving residual risk and opportunity costs without implicitly reintroducing commensurability.

  On your first point, tail discipline, the lexical view does not actually demand spending without limit, though it often feels that way. The theory mandates preventing threshold suffering prioritarily, but it does not forbid comparing one instance of threshold suffering against another. If the resources required to prevent one case of smallpox could instead prevent ten cases of equally severe suffering from malaria or starvation, the lexical view requires you to switch to the malaria or starvation. The campaign stopped not because the suffering of potential smallpox victims became commensurable with mild happiness, but because the marginal cost of further eradication efforts likely began to outweigh the threshold suffering prevented elsewhere. However, the decision to retain virus stocks is where the theory struggles. If stored virus poses a non-zero risk of future threshold suffering, lexical priority suggests destroying it regardless of cost, unless the security measures themselves cause comparable threshold suffering. The fact that the campaign stopped short of destruction suggests either that the risk was deemed negligible enough to ignore—a move the theory does not formally sanction—or that the theory is silent on how to manage potential versus actual suffering. Here, the theory is silent; it lacks a mechanism for weighing the certainty of resource expenditure against the uncertainty of future outbreaks.

  Regarding the bearer question, you are right to identify this as a pivot point, though the standard term in philosophy is the "locus of evaluation" rather than the bearer. Lexical threshold negative utilitarianism typically locates the threshold in moments or episodes of experience, not whole lives. If the locus were the whole life, the theory would collapse, because as you noted, many smallpox survivors lived lives that were net positive. For the theory to vindicate the campaign, the locus must be the acute episode of illness and its immediate aftermath. Smallpox involved intense pain, terror, and disfigurement that comfortably clears any plausible threshold of severe suffering. If you move the threshold higher, say to only include torture or agonizing death, smallpox might not qualify for every case, weakening the lexical mandate. If you move it lower to include mere discomfort, the theory becomes too demanding. The case works best for the theory if the locus is the specific bout of severe illness, which allows the campaign to be seen as preventing threshold events even within lives that were overall worth living.

  On the risk version, you have identified the most significant vulnerability in the theory. Strict lexicality implies that any non-zero probability of threshold suffering trumps any amount of ordinary good. If applied rigorously, this would mandate spending all resources on minimizing every tiny risk of catastrophe, leading to paralysis. The smallpox practitioners implicitly accepted a residual risk by keeping the stocks, suggesting they operated with a de minimis threshold—a probability level below which the risk is ignored. Introducing this probability threshold does smuggle a form of commensurability back in, because you are now weighing the magnitude of the risk against the cost of eliminating it. To survive this, the lexical view must admit that lexical priority applies only to expected threshold suffering above a certain probability floor. Without this amendment, the theory cannot explain why the campaign ended while the virus still existed; with it, the theory survives but loses some of its purity, becoming a hybrid of lexical priority and risk-weighted calculation.

  Finally, on the question of common currency, your suspicion is well-founded. The practitioners treated the goal (eradication) as a constraint rather than a variable to be optimized against other goods. This supports the idea that moral reasoning often operates with lexical constraints on ends while using cost-effectiveness analysis for means. This does not settle the metaphysical question of whether pleasure and pain are commensurable, but it suggests that practical ethics does not require a single scale to function. The episode leaves the commensurability question untouched in theory but demonstrates that in practice, agents can and do treat severe suffering as incommensurable with ordinary benefits while still making trade-offs regarding how to prevent that suffering.

  In conclusion, I read this case as evidence for the view's descriptive power regarding moral priorities, but as an anomaly it has to absorb regarding risk and termination. The theory anticipated the priority of preventing severe suffering but did not anticipate the practical necessity of discounting low-probability risks or comparing opportunity costs across different types of threshold suffering. It is not a case the theory never anticipated, but it is one that forces the theory to adopt practical clauses it would prefer to avoid.
