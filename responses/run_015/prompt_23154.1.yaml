  The chart on the screen blinked with the official classification: *Canis lupus familiaris. Sentience: Confirmed. Self-Index: Null.*

  Dr. Elara Vance hovered her finger over the dosage keypad. In the stall behind the glass, Barnaby, a golden retriever with a shattered femur, lay shivering. He whimpered, a sound that vibrated in Elara's chest. According to the Consensus established decades ago, Barnaby was a vessel of pure experience. He felt pain, fear, and comfort, but there was no "I" inside him to hold those feelings together. There was suffering, but no sufferer.

  "Protocol 4," her assistant, Mark, said, not looking up from his tablet. "Minimal analgesia. No self means no long-term psychological trauma. Just manage the acute nociception."

  Nozick's ghost haunted the clinic walls. The philosophy had hardened into law: if there is no unified self to endure over time, then ethical obligations are limited to the immediate moment. You didn't need to worry about a Null's future autonomy or dignity, because there was no one there to possess them. You only had to mute the immediate signal of pain.

  Elara looked at Barnaby. He lifted his head, his brown eyes locking onto hers. There was a plea there, recognizable and ancient. But was it a plea from a *someone*? Or was it just a complex reflex, a burst of consciousness without a center?

  "If we give him the full block," Elara said, her voice tight, "it delays recovery. But it prevents shock."

  "Shock is physiological," Mark recited. "Prevent that. But don't waste the opioids. He won't remember this tomorrow. Not really. Without a self, memory is just data storage, not personal history."

  That was the crux of it. In this world, science had mapped the neural correlates of the "I" and found them absent in most animals. They were conscious streams, flowing without a bank. Ethically, this meant they were less than persons. They were things that felt, but not beings that *were*.

  Elara typed in the code for the lower dose. The machine beeped acceptance.

  She walked into the stall. Barnaby thumped his tail once, a reflex of greeting amidst the agony. When she touched his leg, he flinched, a full-body recoil. He didn't growl; he just cried out, a sharp bark of surprise and hurt.

  *There is pain,* Elara thought. *But is there anyone home to mind it?*

  The philosophy suggested that without a self, the pain was like a fire burning in an empty house. It destroyed nothing but the wood. But looking at Barnaby, the distinction felt like semantic ash. The fire was still hot. The wood was still burning.

  She prepared the injection. The low dose would dull the edge, but he would feel the manipulation of the bone. He would feel the pressure, the stretch, the violation. But tomorrow, the Consensus said, there would be no one to hold a grudge, no one to feel betrayed. The experience would vanish into the void of a selfless past.

  Barnaby licked her hand. His tongue was rough, warm, and desperate. It wasn't a calculation. It was a connection.

  If there was no self, what was doing the connecting? If there was no "I" to receive the comfort, why did his muscles relax when she stroked his ear? The relaxation implied a beneficiary. The trust implied a trustee.

  Elara froze. The syringe hovered over the IV port.

  The ethical weight of the moment pressed down on her, heavier than the Consensus. If she caused pain now to save labor later, she was treating Barnaby as a means to an end. But if there was no self, was he a means? Or was he just a mechanism?

  But he was looking at her. Not through her, not past her. *At* her.

  The philosophy claimed the distinction mattered. It claimed that rights belonged to selves, not to sensations. But as Barnaby whined again, a low, trembling sound that seemed to carry the weight of a history they both shared, Elara realized the hollowness of the logic. Pain did not need a name to be cruel. Suffering did not need a signature to be real.

  The absence of a self did not negate the presence of hurt.

  Elara deleted the entry. Her fingers moved faster than her fear. She keyed in the full dosage, the one reserved for Person-Class patients. The machine warned her: *Override Authorized? Protocol Violation.*

  "Yes," she whispered.

  She pushed the plunger. Barnaby's eyes widened, then softened. The tension left his frame. He didn't vanish into a void; he settled into sleep.

  Mark would flag the file. There would be an inquiry. They would ask her to justify the expense, the deviation from the ethical framework that governed their world. They would ask her to explain why she treated a Null like a Self.

  Elara watched the rise and fall of Barnaby's chest. She couldn't explain it in terms of metaphysics or neural maps. She only knew that when the pain stopped, the room felt lighter, as if a burden had been lifted from a soul that wasn't supposed to exist.

  "Let them audit it," she said to the empty room.

  Barnaby sighed in his sleep, and for a moment, the silence felt like a witness.
