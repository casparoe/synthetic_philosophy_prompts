answer: |-
  # The Reflective Accessibility Protocol (RAP)

  **Purpose:** To resolve conflicts between Advance Directives (AD) and current patient preferences within 60 minutes.
  **Authority:** Operationalizes the principle that AD authority is conditional on the "Zone of Reflective Accessibility."
  **Users:** Ethics Consultation Service (Clinical Ethics background).

  ---

  ### Step 1: Reversibility Gatekeeper
  **Question:** Is the cognitive or psychiatric condition causing the current preference clinically reversible within a timeframe relevant to the decision?
  **Indicators for "Reversible":**
  *   Delirium, acute intoxication, or treatable metabolic encephalopathy.
  *   Episodic psychiatric conditions (e.g., Major Depressive Episode) with documented history of remission and restored decisional capacity.
  *   **Sufficient Answer:** Attending physician confirms >50% probability of return to baseline capacity within 3 months.
  **Indicators for "Irreversible":**
  *   Neurodegenerative disease (e.g., Advanced Alzheimer's).
  *   Permanent vegetative state or severe traumatic brain injury with no prognosis for recovery.
  *   **Sufficient Answer:** Neurology/Psychiatry documentation states condition is progressive or permanent.

  **Termination Point A (Reversible):** **Honor the Directive.**
  *   *Rationale:* The "Earlier Self" will return; protecting their precedent autonomy preserves the continuity of the biography.
  *   *Action:* Recommend treatment/withholding per AD.
  *   *Normative Judgment Marker:* **High.** Determining "relevant timeframe" involves valuing the future competent self over the current suffering self.

  **Termination Point B (Irreversible):** Proceed to Step 2.

  ---

  ### Step 2: Biographical Triangulation (The Zone Check)
  **Question:** Can the patient's *current* preference be reconstructed as consistent with at least two independently documented second-order values from the Earlier Self?
  **Indicators for "Inside Zone" (Consistent):**
  *   **Source 1:** The AD itself (e.g., values quality of life over mere existence).
  *   **Source 2:** Independent corroboration (e.g., past journals, interviews with distinct social circles, religious records) showing the current preference aligns with deep values (e.g., "Always valued experiencing the moment" vs. AD's "No life without recognition").
  *   **Sufficient Answer:** Two distinct sources confirm the current preference reflects a deep value held by the Earlier Self, even if the specific instruction differs.
  **Indicators for "Outside Zone" (Inconsistent):**
  *   Current preference directly contradicts the specific threshold in the AD (e.g., AD: "No food if I don't know my kids"; Current: Eating happily while not knowing kids).
  *   No independent evidence exists that the Earlier Self valued the *state* the patient is currently in (e.g., mere contentment without autonomy).
  *   **Sufficient Answer:** Conflict exists between AD threshold and current state, with no biographical evidence bridging the gap.

  **Termination Point C (Inside Zone):** **Honor the Directive.**
  *   *Rationale:* The current preference is an expression of the Earlier Self's values; the AD remains the best codification of those values.
  *   *Action:* Recommend treatment/withholding per AD.
  *   *Normative Judgment Marker:* **Medium.** Interpreting "consistency" requires charitable reconstruction of values.

  **Termination Point D (Outside Zone):** Proceed to Step 3.

  ---

  ### Step 3: Affective Congruence Check
  **Question:** Is the emotional quality of the patient's current state stable, non-coerced, and coherent with the narrative of their remaining life?
  **Indicators for "Pass":**
  *   Patient demonstrates stable affect (not labile) regarding the preference.
  *   No evidence of external coercion (family/staff pressure).
  *   Preference persists over >72 hours.
  *   **Sufficient Answer:** Psychiatry/Nursing notes confirm stable, endogenous preference.
  **Indicators for "Fail":**
  *   Preference fluctuates wildly.
  *   Evidence of distress directly caused by the preference (e.g., refusing food but crying from hunger).
  *   **Sufficient Answer:** Documentation shows preference causes net suffering or is reactive to environment.

  **Termination Point E (Pass):** **Follow Current Preference.**
  *   *Rationale:* The Earlier Self's authority has dissolved (Irreversible + Outside Zone); the Later Self's interest in their current experienced well-being governs.
  *   *Action:* Recommend honoring current wish (even if it contradicts AD).
  *   *Normative Judgment Marker:* **High.** Prioritizing current experiential interests over precedent autonomy is a value judgment, not a clinical fact.

  **Termination Point F (Fail):** **Honor the Directive.**
  *   *Rationale:* Current preference is unreliable; default to documented precedent.
  *   *Action:* Recommend treatment/withholding per AD.

  ---

  ### Application to Cases

  #### Case 1: 74-Year-Old with Alzheimer's (Feeding)
  1.  **Reversibility:** Advanced Alzheimer's is **Irreversible**. (Proceed to Step 2).
  2.  **Triangulation:**
      *   AD Value: Autonomy/Recognition is threshold for life.
      *   Current Preference: Accepting food/Contentment.
      *   Consistency: **Inconsistent.** Family confirms she prioritized autonomy over comfort. No evidence she valued "mere contentment" without recognition.
      *   Result: **Outside Zone.** (Proceed to Step 3).
  3.  **Affective Congruence:** Patient is eager, content, stable. **Pass.**
  4.  **Recommendation:** **Follow Current Preference (Allow Feeding).**
      *   *Note:* This overrides the AD.
      *   *Anticipated Friction:* This recommendation will likely be **unwelcome** to you, as it validates your friend's position (AD as dead letter) despite your argument to the contrary. The procedure dictates that once the cognitive break is irreversible and the current state is inconsistent with past values, the current self's interest in continued existence overrides the past self's instruction to die.

  #### Case 2: 61-Year-Old with Recurrent Depression (Medication)
  1.  **Reversibility:** Depressive episodes are **Reversible** (History of remission).
  2.  **Termination Point A:** **Honor the Directive.**
      *   *Recommendation:* **Override Current Refusal (Administer Medication).**
      *   *Rationale:* The "Earlier Self" (in remission) explicitly authorized override to ensure the return of the competent self. The condition is not permanent; protecting the biographical continuity requires honoring the AD.

  ---

  ### Limitations and Misfires

  **What the Procedure Cannot Settle:**
  1.  **Surrogate Conflict:** If legal surrogates disagree (e.g., spouse vs. adult child) on the interpretation of "Biographical Triangulation," RAP provides no tie-breaker. This requires legal mediation.
  2.  **Ambiguous Thresholds:** If the AD says "No artificial life support if I cannot recognize my family," but the patient recognizes a spouse but not children, clinical fact cannot resolve the semantic ambiguity. This requires normative interpretation by the full committee.
  3.  **Missing Records:** If Biographical Triangulation cannot find two independent sources (common in isolated patients), the procedure defaults to "Outside Zone," potentially overriding an AD based on lack of evidence rather than positive evidence of change.

  **Identified Misfires:**
  *   **The "Happy Demented" Misfire:** In Case 1, RAP recommends feeding a patient who explicitly stated they would rather die. While logically consistent with the "Conditional Authority" principle, it risks betraying the patient's lifelong commitment to dignity, potentially causing distress to the family who promised to honor the AD.
  *   **The "Value Drift" Misfire:** If a patient's values slowly evolve over 20 years (not due to dementia) but are not documented, RAP may treat a competent but changed mind as "Outside Zone" if the AD is rigid, though this procedure is designed for incapacity.

  **Explicit Normative Judgment Markers:**
  *   **Step 1 (Reversibility):** Deciding *which* future self to protect (the returning competent one or the current suffering one) is ethical, not medical.
  *   **Step 2 (Triangulation):** Deciding what counts as "consistent" values is interpretive charity, not data retrieval.
  *   **Step 3 (Affective):** Deciding if current happiness outweighs past autonomy is a philosophical weighing of interests.

  Summary: The procedure honors an advance directive only when the patient's current preference lies outside a reconstructible zone of consistency with the earlier self's values, after checking reversibility, biographical triangulation, and affective congruence, and it explicitly marks where clinical facts end and normative judgment must take over.
