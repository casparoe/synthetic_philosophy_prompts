answer: |-
  You have carved out a very precise and theoretically rich niche. You are right to feel that "Molyneux" is too broad (and historically muddled) and "Multimodal Integration" is too generic (implying concurrent learning rather than sequential anchoring).

  There is no single, universally standardized noun phrase for exactly this phenomenon, but it sits at the intersection of **computational neuroscience**, **philosophy of perception**, and **robotics**.

  Here is how to carve it out, the closest existing concepts, and a proposal for what to call it.

  ### 1. The Closest Existing Concepts

  If you search the literature, you will find fragments of this idea under three different banners:

  **A. Amodal Spatial Representation (Neuroscience/Psychology)**
  This is the strongest theoretical match. The hypothesis is that the brain does not store space as "visual space" or "tactile space," but as an abstract, **amodal metric map** (likely in the posterior parietal cortex).
  *   **The Fit:** If space is represented amodally, adding vision doesn't require learning *where* things are, only learning *how vision looks* at those coordinates.
  *   **The Gap:** This term describes the *state* of the brain, not the *event* of the new modality snapping into place.

  **B. Zero-Shot Cross-Modal Transfer (Robotics/ML)**
  In machine learning, this describes a model trained on modality A (touch) that performs tasks on modality B (vision) without gradient updates.
  *   **The Fit:** Captures the "no extra training" aspect of your robot example.
  *   **The Gap:** Usually implies semantic transfer (knowing a "cup" is a "cup"), whereas you are describing *geometric* transfer (knowing an "edge" is at $x,y,z$).

  **C. The Common Coordinate Framework (Neuroscience)**
  Research on multisensory integration (e.g., by Stein & Meredith) suggests different senses are calibrated to a common spatial frame of reference.
  *   **The Fit:** Explains the "structural alignment."
  *   **The Gap:** Usually assumes concurrent development. Your scenario is *sequential* (model first, sensor second).

  ### 2. How to Carve It Out from Molyneux

  You are correct that this is distinct from the classic Molyneux Problem. Here is the differentiation you can use in your writing:

  | Feature | Classic Molyneux Problem | Your Phenomenon |
  | :--- | :--- | :--- |
  | **Primary Question** | **Qualitative/Conceptual:** Can I recognize the *identity* of a shape (cube vs. sphere)? | **Metric/Topological:** Can I align new data to an existing *spatial geometry*? |
  | **Pre-existing Model** | Often assumes *no* visual spatial model exists yet. | Assumes a **rich, metric spatial model** already exists via the primary modality. |
  | **Mechanism** | Requires abstraction of "shape" across qualia. | Requires **registration** of new input to existing coordinates. |
  | **Timeframe** | Historically debated as immediate vs. learned. | You are specifying **immediate structural alignment** (zero-shot). |

  **The Distinction:** Molyneux asks, *"Does the concept of 'sphere' transfer?"* You are asking, *"Does the coordinate system transfer?"*

  ### 3. How to Carve It Out from Standard Integration

  Standard sensory integration (e.g., the Ventiloquism Effect) relies on **temporal synchrony** and **statistical correlation** built over time.

  *   **Standard Integration:** "I see a flash and hear a bang at the same time repeatedly; I infer they are one event."
  *   **Your Phenomenon:** "I have a map of the room. I turn on the camera. The visual edges fall exactly where my map predicts walls should be."
  *   **Key Difference:** Standard integration builds the model *from* the correlation. Your phenomenon uses the model to *validate* the correlation instantly. It is **Top-Down Registration** rather than **Bottom-Up Fusion**.

  ### 4. Proposed Terminology

  Since there isn't one settled term, you have the opportunity to define it. Here are three options ranging from descriptive to theoretical:

  **Option 1: Amodal Spatial Registration (Recommended)**
  *   **Why:** "Amodal" captures the pre-existing, modality-independent nature of the map. "Registration" is the technical term for aligning one coordinate system to another (used in robotics and imaging).
  *   **Usage:** *"The subject demonstrated immediate **amodal spatial registration**, aligning visual input to a tactile-derived map without recalibration."*

  **Option 2: Structural Cross-Modal Transfer**
  *   **Why:** Emphasizes that it is the *structure* (geometry/topology) transferring, not necessarily object semantics.
  *   **Usage:** *"This is a case of **structural cross-modal transfer**, where the metric properties of the environment are preserved across sensory addition."*

  **Option 3: Predictive Spatial Anchoring**
  *   **Why:** Leans into the **Predictive Processing/Active Inference** framework. The brain has a prior (the tactile map); the visual input is anchored because it minimizes prediction error against that prior.
  *   **Usage:** *"Vision was **predictively anchored** to the established haptic model."*

  ### 5. Theoretical Framework to Support It

  If you are writing a paper or proposal, ground this in **Predictive Coding (Friston/Rao & Ballard)**.

  In this framework, perception is not building a model from scratch; it is minimizing prediction error.
  1.  **Phase 1 (Touch):** The system minimizes error by building a spatial generative model ($M$) based on touch.
  2.  **Phase 2 (Vision Added):** The system generates a prediction based on $M$. Visual input arrives.
  3.  **The "Click":** If the visual input matches the spatial prediction of $M$, the prediction error is low. No learning is required because the *cause* of the visual data (the wall at location $X$) was already inferred by the tactile model.

  This explains the "immediacy." It's not magic; it's that the **generative model was modality-agnostic.**

  ### Summary Recommendation

  You are describing **Amodal Spatial Registration**.

  It is distinct from Molyneux because it concerns **metric alignment** rather than **shape qualia**. It is distinct from standard integration because it relies on a **pre-existing generative model** rather than **concurrent statistical learning**.

  If you coin this term, define it as: *The immediate alignment of a novel sensory stream to a pre-existing, modality-independent spatial model, without requiring associative retraining.* This is a robust, defensible concept that bridges the gap between robotics (SLAM/Registration) and neuroscience (Amodal Representation).
