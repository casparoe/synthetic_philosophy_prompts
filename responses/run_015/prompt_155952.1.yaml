      2.  *Instrumentalism:* Attributions are useful shorthand; no fact of the matter on "real" belief.
      3.  *Phenomenology:* The sticking point is conscious experience (qualia), not just belief.
      4.  *Extended Mind:* Memory lives outside agents (pheromones/nest), so the colony includes the environment.
      5.  *Sub-agent Conflict:* Parts are goal-directed agents with ends that may not align with the whole.

  3.  **Drafting the Translation Manual:**
