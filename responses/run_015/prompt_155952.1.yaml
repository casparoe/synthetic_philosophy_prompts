  5.  **Drafting the Verdict:**
      *   Synthesize the findings.
      *   *Split-Brain:* Question is indeterminate; DS makes it operational.
      *   *Tracing:* Framework reveals the dispute is about the observer.
      *   *Consciousness:* Framework is too thin (functionalist vs. phenomenological).
      *   *Node Agency:* Framework is too rigid (protocol vs. emergent goals).
