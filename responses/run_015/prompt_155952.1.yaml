          *   *Tag:* Clean but functionalist.
          *   *Distortion:* Predictability $\neq$ Belief. It maps "belief" to "state representation."
      *   *Claim 2 (Shorthand/No Fact):* DS equivalent: "The 'cluster identity' is an abstraction layer over individual node processes; there is no single process ID for the cluster."
          *   *Tag:* Clean.
          *   *Distortion:* DS admits the abstraction is fake by design. Philosophy debates if the *mind* is fake.
      *   *Claim 3 (Conscious Experience):* DS equivalent: "There is no metric for 'internal experience' in Prometheus; only latency, throughput, errors."
