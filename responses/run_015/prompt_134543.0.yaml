  The tree rests on the claim that the substantive disagreement lies not in whether entropy is epistemic or ontic, but in *where* the compensating entropy increase is located (measurement, erasure, or correlations), with the ontology question collapsing once the accounting locus is fixed.

  **Decision Tree**

  1.  **Does the device's operation depend on the specific microstate (e.g., velocity/position) of individual gas particles?**
      *   **No** → Go to 2.
      *   **Yes** → Go to 5.

  2.  **Does the device require coupling to two thermal reservoirs at different temperatures to function?**
      *   **Yes** → **Leaf 1: Two-Reservoir Sorter** (Awkward commitment: Requires external free energy, so not a true demon; *Heat Engine*).
      *   **No** → Go to 3.

  3.  **Does the gating mechanism possess thermal degrees of freedom that equilibrate with the gas?**
      *   **Yes** → **Leaf 2: Thermal Ratchet** (Awkward commitment: The pawl fluctuates enough to let particles back through; *Feynman Ratchet*).
      *   **No** → Go to 4.

  4.  **Does the device operate on a fixed timeline independent of particle states?**
      *   **Yes** → **Leaf 3: Scheduled Opener** (Awkward commitment: Relies on statistical fluctuations rather than information; *Lazy Demon*).
      *   **No** → **Leaf 4: Statistical Fluctuation** (Awkward commitment: No device exists, only transient violations; *Unnamed/Incoherent*).

  5.  **Does the device accumulate a physical record of particle states during operation?**
      *   **Yes** → Go to 6.
      *   **No** → Go to 9.

  6.  **Must the accumulated record be reset to a standard state to continue operation indefinitely?**
      *   **Yes** → **Leaf 5: Erasure Cost** (Awkward commitment: Logic gates dissipate heat regardless of physical implementation; *Landauer Principle*).
      *   **No** → Go to 7.

  7.  **Is the operational limit set by the device's memory capacity or the total entropy of the universe?**
      *   **Device Memory** → **Leaf 6: Finite Tape** (Awkward commitment: Computation halts permanently when storage fills; *Bennett/Reversible Demon*).
      *   **Universe Entropy** → **Leaf 7: Cosmological Limit** (Awkward commitment: Demon works until heat death, then fails; *Finite Universe*).

  8.  *(Node merged into 9 for count balance)*

  9.  **Is there a thermodynamic cost incurred during the acquisition of particle state information?**
      *   **Yes** → **Leaf 8: Measurement Cost** (Awkward commitment: Physical partition insertion costs work even without erasure; *Earman/Norton*).
      *   **No** → Go to 10.

  10. **Does the device exploit quantum coherence rather than classical correlations?**
      *   **Yes** → **Leaf 9: Quantum Coherence** (Awkward commitment: Decoherence costs are distinct from classical erasure; *Quantum Demon*).
      *   **No** → Go to 11.

  11. **Is the resource a stored random tape or a pre-existing thermodynamic asymmetry?**
      *   **Stored Tape** → **Leaf 10: Randomized Tape** (Awkward commitment: Writing to noise consumes the noise's low entropy; *Pre-randomized Demon*).
      *   **Asymmetry** → **Leaf 11: Correlation Exploiter** (Awkward commitment: Uses hidden order without generating new records; *Asymmetry Exploiter*).
      *   *(Correction: Node 11 splits to two leaves, need one more leaf to reach 12. Split Leaf 6 into Finite Tape and Reversible Comp?)*
      *   *Adjustment:* Split Leaf 6.
      *   **Node 7:** Is the halt caused by memory capacity or logical irreversibility elsewhere?
      *   **Capacity** → **Leaf 6: Finite Tape** (Awkward commitment: Appends records until full; *Finite Tape Demon*).
      *   **Irreversibility** → **Leaf 12: Reversible Halt** (Awkward commitment: Entire comp reversible but halts when memory full; *Reversible Computation Demon*).

  **Notes**

  *   **Leaf 6 vs Leaf 12:** These are flagged as difficult to separate; both halt due to memory limits in reversible schemes, differing only in whether the emphasis is on the tape length or the logical reversibility of the gates. They are one position in two costumes.
  *   **Entropy Ontology:** The "entropy is missing information" reading collapses into **Leaf 5 (Erasure Cost)** and **Leaf 6/12 (Finite Tape)**; once you commit to paying the bill in memory reset or capacity, the ontic/epistemic distinction ceases to change the accounting.
  *   **Empty Cells:** **Leaf 4** is marked incoherent because a device that doesn't measure, doesn't use baths, and doesn't follow a schedule is not a device. **Leaf 5** absorbs the "Postulate vs. Theorem" split; distinguishing them requires a node on derivability from Hamiltonian mechanics, which was merged to maintain leaf count.

  **Confidence**

  I am moderately confident in the instrument as a whole, though the split between Finite Tape and Reversible Halt is the least confident element as they may represent the same physical limit described differently.
