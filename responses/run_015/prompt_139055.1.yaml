answer: |-
  **On the Calculation of Disapproval**

  It is a principle sufficiently established among us that punishment is in itself an evil. It is pain inflicted by the hand of the law, and like all pain, it demands justification. That justification can reside only in the prevention of a greater mischief. Where an act touches no assignable individual in body, property, or reputation, the mischief is to be sought elsewhere, usually in the alarm or danger radiating outward to the public. But what of the pain felt by the public merely in the knowledge that the act exists? The neighbour feels revulsion. He suffers. Should this suffering enter the legislator's ledger?

  I propose a rule for this determination: the Test of Corrected Opinion. A pain of disapproval enters the ledger only if it would survive the removal of every false belief about matters of fact held by the person who feels it. If my neighbour suffers because he believes a private practice spreads disease, and it does not, his pain is built on error. To prohibit the practice to soothe him is to ratify the error. It buys off a pain that would expire on its own were the truth known. The law should not be the guardian of ignorance.

  It will be objected that some revulsion rests on no false fact, but on a sincere judgment that the practice is *base*. If this pain counts, any majority may veto reform by feeling strongly enough; if it does not, do I not assume what is in dispute? I answer thus: "Baseness" is a word that must cash out in mischief. If it signifies only a preference, like a dislike for a certain food, it is not legislation material. If it signifies a danger to the social fabric, that is a matter of fact to be proved. To call an act base while denying it harms any assignable person is to speak in riddles. The legislator deals in realities, not metaphysics. If the neighbour cannot point to a wound, his pain is a phantom of education, not a reality of nature.

  Consider further the case where distress is triggered by visibility. The neighbour says, "I do not care what they do in the dark, but I cannot bear to see it." Here the remedy is concealment, not prohibition. To ban the act because it offends the eye is to employ a cannon to swat a fly. The pain is in the seeing; remove the sight, and the pain ceases. To remove the act is to inflict a far greater pain upon the agents for no additional gain to the neighbour. The principle of economy demands the lesser evil.

  I must here make a concession that will discomfort my friends in this circle. The Test of Corrected Opinion cuts both ways. My own indignation at the existing law, and the suffering I claim it causes, must pass the same test. If I have exaggerated the number of those persecuted, or the severity of their punishment, my pain is also based on error. I must not demand that the legislator correct the neighbour's falsehoods while indulging my own. If the law causes less suffering than I allege, my argument for repeal loses force proportionally. We must not trade one set of errors for another.

  Finally, it is urged by those of a theological bent that the people's sense of the sacredness of their morals is a public good—a fund of restraint on which the enforcement of every other law depends. To strike a moral sense from the ledger because it rests on error is to saw off the branch we sit on, buying present relief at the cost of general indiscipline.

  This argument assumes that a fund built on falsehood is solvent. It is not. Restraint based on error is brittle; when the error is exposed, the restraint collapses entirely, taking the law with it. A fund of restraint based on true utility—on the clear demonstration that laws protect assignable interests—is durable. To preserve the law's authority, we must purge it of contradictions. If we retain prohibitions that serve no end but the gratification of prejudice, we teach the people that the law is irrational. When they discover the irrationality, they will respect neither the foolish law nor the wise ones. The branch is already rotten; we propose only to prune it before it falls.

  The legislator's ledger must be clean. Pain based on error is not a weight to be outweighed; it is a mistake to be corrected. Strike it out.
