prompt: |-
  You are an expert in moral philosophy and the metaphysics of normativity. Before you begin, please take a moment to think carefully and brainstorm the hidden conceptual dependencies that people usually miss when they discuss whether reasons can exist independently of anyone who holds them. Start with a brief outline of the logical structure you will need.

  I am not an academic philosopher; I have only been thinking about this on my own. I keep returning to the idea of free-floating rationales—reasons without reasoners. I want you to construct a thought experiment built precisely to the following specifications. The scenario must be realistic and set in an ordinary workplace, not in science fiction or a trolley-style abstraction, and it must be kept to one paragraph. It must be engineered so that a view accepting free-floating rationales judges a particular omission to be genuinely wrong, while a strict reasons-internalist view—which holds that every reason must be anchored to the motivational set of some actual or potential agent—must conclude that there is no wrongness at all, not merely that no one can be blamed. After presenting the scenario, walk through exactly what each view says and why. Then identify the specific feature of the case that does the work in forcing the split. Finally, explain how the internalist would try to attack the case—perhaps by positing a hidden reasoner or by redefining the normative landscape—and assess whether that attack succeeds. Please be precise, formal, and rigorous in your reasoning. Do not provide a bibliography, reading list, or citations of any kind.
