      *   **Demographics:** Mill feared overpopulation. Now we have underpopulation/aging. This weakens (vii)'s original motivation (Malthusianism) but strengthens the economic case for labor empowerment (labor is scarce = labor has power). It makes the transition to cooperatives *easier* (workers have leverage).
