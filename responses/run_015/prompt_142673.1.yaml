      *   **2. Nordic Social Democracy:**
          *   *Mill's View:* High welfare (iv - risk of dependency?). Strong unions (good for bargaining, but not ownership). Capitalist ownership intact (i - not outgrown). Cooperative ownership marginal (i - failure of the specific mechanism).
          *   *Verdict:* Mixed but ultimately insufficient. He would admire the safety net *if* it doesn't crush independence, but he would see it as a palliative, not a cure. It keeps the wage relation intact rather than transforming it. It fails the "moral education" test of self-management.

      *   **3. The Modern Package (Automation/Dividend/Employee Trusts):**
