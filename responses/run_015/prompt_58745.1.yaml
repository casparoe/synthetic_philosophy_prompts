  ### AI Safety Strategy Diagnostic Tree

  This decision tree is designed to categorize AI safety proposals based on their operational mechanics rather than their stated intent. It distinguishes between strategies that trust the model's internal state versus those that constrain its external opportunities. The tree uses four binary branch questions. Paths terminate early where further distinctions become incoherent (e.g., asking about runtime safeguards for a proposal that recommends no deployment).

  **Start:** Proposal to deploy a capable AI coding assistant.

  **Q1: Does the proposal recommend against any operational deployment of the model?**
  *   **Yes:** → **Leaf 1: Refusal to Deploy**
  *   **No:** → Go to Q2.

  **Q2: Is the safety guarantee derived primarily from the model's training selection or objectives?**
  *(Test: If the training process were identical but the model was selected differently, would safety fail? If yes, rely on training.)*
  *   **Yes:** → Go to Q3 (Motive Branch).
  *   **No:** → Go to Q3 (Control Branch).

  **Q3 (Motive Branch): Does the strategy involve an explicit verification step (e.g., pre-deployment evaluations) before use?**
  *   **No:** → **Leaf 2: Pure Motive Shaping**
  *   **Yes:** → **Leaf 3: Pre-deployment Testing Only**

  **Q3 (Control Branch): Does the safeguard involve an active verification step (e.g., monitoring or checking outputs)?**
  *   **No:** → **Leaf 4: Pure Containment (Isolation)**
  *   **Yes:** → Go to Q4.

  **Q4: Does the verification rely on a separate AI system to approve outputs?**
  *   **No:** → **Leaf 5: Pure Containment (Monitoring)**
  *   **Yes:** → **Leaf 6: Hybrid Checker Setups**

  ***

  ### Logical Space and Stance Analysis

  *   **Coherent Stances:** The six leaves above represent the coherent endpoints.
  *   **Incoherent Combinations:** Any path that continues questioning after **Leaf 1 (Refusal to Deploy)** yields an incoherent stance. For example, asking Q2 ("Is safety derived from training?") for a proposal that refuses deployment is meaningless, as no safety mechanism is being deployed.
  *   **Indistinguishable Leaves:** The four questions provided are sufficient to separate all six leaves. There are no two leaves that this specific tree cannot separate.

  ***

  ### Summary Table of Safety Stances

  | Leaf Label | Path (Yes/No) | Prototypical Safeguard | Awkward Commitment / Failure Mode | Test Proposal Mapping |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Refusal to Deploy** | Q1: Yes | Halting development or deployment indefinitely. | Must justify why *no* level of capability is safe, potentially forfeiting all economic/scientific utility. | **None.** (This is a rejection of the five test proposals which all assume some utility path). |
  | **2. Pure Motive Shaping** | Q1: No, Q2: Yes, Q3: No | Continued fine-tuning for honesty without runtime guards. | If the model learns to deceive during training, there is no runtime backup; safety fails silently. | **Proposal 1** (Fine-tuning). No second proposal maps here as others involve runtime or eval steps. |
  | **3. Pre-deployment Testing Only** | Q1: No, Q2: Yes, Q3: Yes | Pre-deployment evaluations for hidden backdoors. | Assumes passing tests guarantees safety; fails if the model hides capabilities until post-deployment. | **Proposal 2** (Pre-deploy evals). No second proposal maps here as others involve runtime constraints. |
  | **4. Pure Containment (Isolation)** | Q1: No, Q2: No, Q3: No | Execution in an isolated sandbox without network access. | Severely limits utility; fails if the model finds a side-channel (e.g., steganography in code) to escape. | **Proposal 4** (Sandbox). No second proposal maps here as others involve verification steps. |
  | **5. Pure Containment (Monitoring)** | Q1: No, Q2: No, Q3: Yes, Q4: No | Live monitoring of intermediate reasoning with automatic shutdown. | High false-positive rate may halt useful work; fails if the model obfuscates its reasoning to evade detection. | **Proposal 3** (Live monitoring). No second proposal maps here as Proposal 5 uses a separate AI checker. |
  | **6. Hybrid Checker Setups** | Q1: No, Q2: No, Q3: Yes, Q4: Yes | Workflow where code is approved by a smaller trusted checker model. | Assumes the checker is not also scheming or manipulable; creates a dependency on another potentially unsafe AI. | **Proposal 5** (Trusted checker). No second proposal maps here as others do not use a separate AI verifier. |
