answer: |-
  Friends, colleagues, family.

  In physics, we learn early that a model is only as good as its boundary conditions. A formula that describes a falling apple on Earth may fail completely when applied to a photon near a black hole. We do not discard the formula; we identify where its scaffolding holds and where it breaks.

  Today, we gather to discuss obligation and harm. Many of you know the moral model we are testing: the drowning child. A child is drowning in a shallow pond. You can save them, but it will ruin your clothes and make you late. Almost everyone agrees: you must wade in. The cost to you is minor; the cost to the child is everything.

  The question before this workshop is whether this model holds when we move from the pond to the planet.

  For the scientists and family members here: the challenge is that climate harm is not a single child in a single pond. It is millions of people, over decades, harmed by complex systems—energy grids, supply chains, policies—rather than a single moment of physical proximity.

  For the philosophers here: the challenge is the problem of mediation. In the pond, your agency is direct. In the climate, your agency is mediated by institutions.

  Some argue that because the harm is structural, the analogy collapses. They say we cannot speak of "rescue" when no single person pushed the child in, and no single person can pull them all out. They argue we need an entirely new moral framework for systemic harm.

  I stand before you to argue the opposite. The analogy does not collapse. However, it demands we rigorously redefine what "rescue" means in a structural context.

  In the original analogy, the water is a natural fact. You are a bystander who happens upon an accident. But in the climate crisis, we are not bystanders who happened upon a pond. We are the engineers who built the dam. We are the ones who designed the drainage system that floods the valley.

  If you walk past a drowning child, you fail a duty of *beneficence*—you failed to help. But if you maintain the lock on the dam that keeps the water high, you are not merely failing to help; you are actively participating in the drowning.

  This is where the concept of rescue remains coherent. Rescue is not merely pulling a victim from the water at the last second. True rescue, in a systemic context, is lowering the water level.

  When harm is mediated by institutions, the "muddy suit" we fear ruining is no longer just a set of clothes. It is our economic comfort, our lifestyle, our reliance on cheap energy. The philosophers might call this a demand of integrity; the scientists might call it a necessary boundary condition for survival.

  If we claim the analogy collapses because the problem is too big, we grant ourselves a moral exemption that we would never accept in the physical world. Imagine a structural engineer saying, "The bridge is too large for me to hold up alone, so I have no obligation to fix the bolt I loosened." The size of the system does not negate the duty of the agent within it.

  Therefore, I propose we accept the scaffolding of the pond, but we must reject the idea that we are mere passersby. We are the custodians of the pond.

  If we treat systemic harm as "background noise" rather than an emergency, we are effectively saying that the child's life is worth less because the water rose slowly rather than all at once. But a slow drowning is still a drowning.

  So, does the concept of rescue remain coherent? Yes, but only if we commit to this: The duty to rescue is not discharged by individual charity alone. It is discharged by structural repair. To wade into the pond today means to work against the systems that keep the water rising.

  If we retreat to a new framework that dilutes this obligation because the harm is "institutional," we risk building a philosophy that is mathematically elegant but morally bankrupt. We cannot allow the complexity of the system to become a shield for inaction.

  The child is drowning. The water is rising. And we hold the keys to the lock. Let us not argue about whether we are close enough to hear them scream. Let us agree that we are close enough to turn the wheel.

  Thank you.

  ***

  **Note on Framing and Interpretations**

  This speech takes a specific liberty with Peter Singer's original argument. Singer's "drowning child" is primarily designed to establish a principle of *individual* beneficence based on capacity to aid, regardless of distance. It focuses on the moral equivalence of proximity (i.e., distance doesn't matter).

  The speech above shifts the focus from *distance* to *causation and structural maintenance*. It argues that we are not merely bystanders (as in Singer's original thought experiment) but active participants in the system causing the harm. This moves the argument closer to theories of *structural injustice* (often associated with thinkers like Iris Marion Young or Thomas Pogge) which argue that obligations arise from participation in unjust processes, not just the capacity to fix outcomes. By insisting the analogy "holds" but requires redefining rescue as "structural repair," the speech bridges Singer's consequentialism with structural accountability, a move that some strict interpreters of Singer might find conflates distinct moral categories.
