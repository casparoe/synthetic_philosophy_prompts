answer: |-
  # The "Existence Deadlock" Decision Procedure

  **Purpose:** To classify ontological disagreements in under 90 minutes without requiring philosophical expertise.
  **Facilitator Role:** Neutral scribe. Do not answer the questions; record the consensus on the answers.
  **Verdicts:**
  1.  **MERELY VERBAL:** Disagreement dissolves with neutral language; safe to stipulate.
  2.  **SUBSTANTIVE:** Disagreement is about facts or mind-independent reality; requires evidence or metaphysical resolution.
  3.  **CONCEPTUAL:** Disagreement is about norms, liability, or political burden; requires negotiation, not definition.

  ---

  ## Part 1: The Procedure (Facilitator Script)

  ### Step 1: The Regimentation Test (The "New Word")
  **Question:** "If we ban the contested word (e.g., 'Disease', 'Decision') for this document and replace it with a neutral label (e.g., 'Pattern-Alpha', 'System-Output') defined by these specific criteria, do you still disagree on whether the criteria are met?"
  *   **Sufficient Answer:**
      *   **No (We still disagree on the facts):** Stop. Verdict: **SUBSTANTIVE**. (The disagreement is about the data/reality, not the word).
      *   **Yes (We agree on the criteria/facts):** Proceed to Step 2.

  ### Step 2: The Downstream-Licensing Test (The "So What?")
  **Question:** "If we use the original contested word versus the neutral label, does it change who is liable, what resources are allocated, or what actions are permitted in our guidance?"
  *   **Sufficient Answer:**
      *   **Yes (The consequences differ):** Stop. Verdict: **CONCEPTUAL**. (The disagreement is about the norms/rules attached to the label).
      *   **No (The consequences are identical):** Proceed to Step 3.

  ### Step 3: The Reality-Tracking Test (The "Discovery vs. Choice")
  **Question:** "If we all agreed tomorrow that this label was useless for our goals, would one side claim the thing *still* exists independently of us, while the other says it vanishes?"
  *   **Sufficient Answer:**
      *   **Yes (One side claims mind-independent existence):** Stop. Verdict: **SUBSTANTIVE**. (This is a metaphysical clash, not just linguistic).
      *   **No (Both agree it depends on our goals/utility):** Proceed to Step 4.

  ### Step 4: The Cost-of-Relabeling Test (The "Burden")
  **Question:** "If we adopt the neutral label to settle this, does one party have to rewrite their protocols, papers, or intuition while the other does not?"
  *   **Sufficient Answer:**
      *   **Yes (Burden is asymmetrical):** Stop. Verdict: **CONCEPTUAL**. (This is a political/pragmatic dispute; do not impose by fiat).
      *   **No (Burden is shared or negligible):** Stop. Verdict: **MERELY VERBAL**. (Safe to stipulate the neutral term).

  ---

  ## Part 2: Application to Deadlock (A)
  **Case:** Clinicians and Philosophers disagreeing whether a symptom cluster in a new dataset is a *distinct disease entity* or a *coding artifact*.
  **Goal:** Research inclusion guidance (not clinical billing).

  *   **Step 1 (Regimentation):**
      *   *Facilitator:* "If we use the term 'Cluster-7' defined as 'Patients with ICD codes X, Y, Z and biomarker W', do you agree these patients exist in the dataset?"
      *   *Answer:* **Yes.** Both sides agree the patients meet the criteria.
      *   *Result:* Proceed to Step 2.
  *   **Step 2 (Licensing):**
      *   *Facilitator:* "In this *research guidance*, does calling it 'Disease' vs. 'Artifact' change who gets included in the study or how data is handled?"
      *   *Answer:* **No.** The inclusion criteria are the biomarker/code combo, not the label.
      *   *Result:* Proceed to Step 3.
  *   **Step 3 (Tracking):**
      *   *Facilitator:* "If we decided 'Disease' was a useless word for this project, would the Clinicians claim the disease still exists 'out there' regardless?"
      *   *Answer:* **Nuanced No.** Clinicians prefer 'Disease' for clinical intuition, but acknowledge for *research purposes* the operational definition suffices. Philosophers agree it is construct-dependent.
      *   *Result:* Proceed to Step 4.
  *   **Step 4 (Cost):**
      *   *Facilitator:* "If we write 'Cluster-7' in the guidance, who has to change their workflow?"
      *   *Answer:* **Negligible.** Researchers use 'Cluster-7' in papers; Clinicians can still call it 'Disease' in notes. The guidance document itself bears no burden.
      *   *Result:* **Verdict: MERELY VERBAL.**
  *   **Outcome:** The group stipulates "Cluster-7" for the document. Clinicians keep "Disease" for rounds; Researchers keep "Artifact" for methodology sections. Deadlock dissolved.

  ---

  ## Part 3: Application to Deadlock (B)
  **Case:** Engineers and Clinicians disagreeing whether a deployed risk model *makes a decision* for which someone must take responsibility.
  **Goal:** Accountability framework for the consortium.

  *   **Step 1 (Regimentation):**
      *   *Facilitator:* "If we use the term 'System-Output-Event' defined as 'The model generates a risk score >80% triggering an alert', do you agree this event occurs?"
      *   *Answer:* **Yes.** Both sides agree the code runs and the alert fires.
      *   *Result:* Proceed to Step 2.
  *   **Step 2 (Licensing):**
      *   *Facilitator:* "If we call this a 'Decision' versus a 'Prediction', does it change who is liable when the alert is wrong?"
      *   *Answer:* **Yes.**
          *   *Clinicians:* "If it's a 'Decision', the Vendor/System shares liability. If it's a 'Prediction', I am the sole decision-maker."
          *   *Engineers:* "If it's a 'Decision', we need regulatory clearance we don't have. If it's a 'Prediction', we are a tool provider."
      *   *Result:* **Stop. Verdict: CONCEPTUAL.**
  *   **Analysis of the Verdict:**
      *   The procedure correctly identifies this as **CONCEPTUAL**, not MERELY VERBAL.
      *   **Why it matters:** The disagreement is not about the code (Step 1 passed) but about the *normative consequences* (licenses) attached to the word "Decision."
      *   **Addressing your concern:** You noted you would be annoyed if this came out MERELY VERBAL. If the procedure *had* returned MERELY VERBAL, it would have failed at **Step 2**.
      *   **What we would have to give up:** If a facilitator skipped Step 2 or accepted "It's just semantics" as an answer, the group would stipulate a neutral term (e.g., "Event"). This would **give up the accountability framework**. The consent form requires a "Decision-Maker." If "Decision" is dissolved into "Event," the consent form becomes legally void or misleading. Step 2 protects the consortium from dissolving a liability dispute into a dictionary definition.
  *   **Outcome:** The group cannot define their way out of this. They must negotiate a policy: Either the Vendor accepts liability (and calls it a Decision) or the Clinician accepts sole liability (and calls it a Tool). The word follows the policy, not vice versa.

  ---

  ## Part 4: Limitations and Hidden Judgment

  ### 1. Deadlocks the Procedure Cannot Settle
  *   **Incommensurable Values (Step 2 Failure):** If Step 2 yields **CONCEPTUAL**, the procedure stops. It diagnoses the problem but does not solve it. If Clinicians demand "Decision" for patient safety and Engineers demand "Prediction" for legal survival, the procedure tells you *why* you are stuck (normative conflict), but you still need a vote, a veto, or a compromise. It prevents a *false* settlement, but does not guarantee a *true* one.
  *   **Power Imbalances (Step 4 Failure):** If Step 4 yields **CONCEPTUAL** due to asymmetric cost, the procedure flags it as unfair. However, if the more powerful party (e.g., the funding body) insists on their vocabulary despite the cost, the procedure cannot stop them. It only exposes the coercion.

  ### 2. Where Facilitator Judgment Hides
  Although the script appears mechanical, the facilitator's judgment determines the output in three critical places:
  *   **Framing the Neutral Term (Step 1):** The facilitator chooses the "New Word." If they choose a term that subtly favors one ontology (e.g., "System-Error" vs. "System-Output"), they can force a **MERELY VERBAL** verdict where a **SUBSTANTIVE** one belongs. *Mitigation:* The definition of the neutral term must be signed off by both parties before Step 1 begins.
  *   **Assessing "Difference" (Step 2):** The facilitator must judge whether the licensing consequences are "different enough." A facilitator eager to close the meeting might rule that "Vendor liability vs. Clinician liability" is just "internal accounting" (Same License). *Mitigation:* Require the lawyers to explicitly state "This changes the contract" for a 'Yes' vote.
  *   **Interpreting "Goals" (Step 3):** Asking "Is this useless for our goals?" requires defining "our goals." If the facilitator defines goals narrowly (e.g., "publishing papers"), they can force a **MERELY VERBAL** verdict on a **SUBSTANTIVE** metaphysical dispute (e.g., "Does this population have rights?"). *Mitigation:* In Step 3, "goals" must include the consortium's stated ethical charter, not just immediate output.

  ### Summary for the Chair
  Use this procedure to **triage**, not to **resolve**.
  *   If it says **MERELY VERBAL**: Dictate the definition and move on.
  *   If it says **SUBSTANTIVE**: Commission a data audit or metaphysical whitepaper (do not vote).
  *   If it says **CONCEPTUAL**: Escalate to the Steering Committee for a policy decision (do not define).
