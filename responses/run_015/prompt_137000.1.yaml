      *   *MERELY VERBAL:* Disagreement disappears after regimentation + Low cost of relabeling + No downstream difference.
      *   *SUBSTANTIVE:* Disagreement survives regimentation (facts differ) OR Reality-tracking indicates a clash about mind-independent structure.
