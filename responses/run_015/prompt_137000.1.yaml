  2.  **Drafting the Decision Procedure:**

      *   *Goal:* Make it actionable for non-philosophers within 90 minutes.
      *   *Structure:* Sequential steps. If a step yields a clear result, stop. If not, proceed.
      *   *Step 1: The Regimentation Test (The "New Word" Test).* This addresses the "stipulate and move on" urge.
          *   Question: "If we invent a new neutral term for [X] with these specific criteria, do you still disagree on the facts?"
          *   Verdict: If disagreement vanishes -> Potential MERELY VERBAL. If it remains -> SUBSTANTIVE.
      *   *Step 2: The Downstream Licensing Test (The "So What?" Test).* This addresses the "burying the disagreement" concern.
          *   Question: "Does calling this [X] vs. [Y] change what we are allowed to do, who is liable, or what resources are allocated?"
          *   Verdict: If licenses differ -> CONCEPTUAL (normative dispute about usage). If licenses same -> Back to Verbal/Substantive check.
      *   *Step 3: The Reality-Tracking Check (The "Carving Nature" Test).* This addresses the metaphysical worry.
          *   Question: "Is the disagreement about whether the world forces this distinction on us, or whether it's useful for us to draw it?"
          *   Verdict: If one side claims the world forces it regardless of utility -> SUBSTANTIVE (Metaphysical). If both agree it's about utility -> CONCEPTUAL/Verbal.
      *   *Step 4: The Cost-of-Relabeling Check (The "Burden" Test).* This addresses the political feasibility.
          *   Question: "If we adopt the neutral term, who has to rewrite their protocols/papers/intuitions?"
          *   Verdict: If burden is asymmetrical -> Flag as CONCEPTUAL/Political (don't force fiat). If symmetrical -> MERELY VERBAL (safe to stipulate).

