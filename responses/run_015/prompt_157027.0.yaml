answer: |-
  The brewery letter lay flat on the drip tray. Renewal needed a personal name on the lease. Without it, the taps ran dry on Friday. Elara looked out at the room. Old Miller nursing his bitter, the young mothers sharing a table, the farmers shaking off the rain. None of them knew the rent had tripled. None of them could cover it.

  She picked up the pen. The guarantee bound her, not the company. It meant no holidays, no savings, eighteen months of waking up sick with the numbers. It meant her life paused while theirs continued.

  She didn't wake them. She didn't call a meeting. There was no point; they'd refuse, or pledge what they couldn't spare. This wasn't their debt to carry. It was the floor they stood on.

  Elara signed. She slid the paper into the drawer and pulled a pint. The foam settled. Miller raised his glass. She nodded back, feeling the weight of the pen in her pocket like a stone. The room breathed on, warm and ignorant. She wiped the counter. It was enough.

  ***

  **The Aggregating View**
  The calculus is straightforward: the cumulative utility of the regulars retaining their social hub outweighs the disutility of Elara's financial and psychological distress. The sum of many small comforts exceeds one large burden. The action is right because it maximises overall welfare.

  **The Separateness of Persons Objection**
  Rawls and Nozick would argue this treats Elara as a means rather than an end. Her life is not a vessel to be drained to fill the gaps in others' lives. The fact that the total gain is larger is irrelevant because there is no "social entity" that owns the gain; there are only distinct individuals, one of whom is being crushed for the benefit of the others. Consent is the only bridge that usually legitimises this transfer, and it is absent.

  **What Stops It Biting**
  The feature doing the work is **Constitutive Interdependence** (your "Pooling" distinction). The pub here is not a service provider serving customers; it is the *medium* of their association. The beneficiaries are not consuming a product; they are sustaining a shared practice that constitutes their community identity. Elara isn't sacrificing herself for *them* as strangers; she is maintaining the *pool* in which she is also embedded, even if she bears the structural weight. The loss is not extracted from an outsider to feed insiders; it is absorbed by the node holding the network together. The aggregation feels permissible because the "many" are not a collection of separate utilities, but a single social fabric that would unravel without the knot she tightens.

  **Removing the Feature**
  If you remove the interdependence—for instance, if the pub were a corporate chain, the regulars were transient strangers, and Elara were a hired manager sacrificing her credit to keep the store open for shareholders—the case collapses into plain sacrifice. Without the shared practice, the "pool" becomes a mere sum of strangers. The burden becomes instrumental, not constitutive. The later scene in your book will work as monstrous if you retain the math but strip this entanglement: make the beneficiaries insulated from the sacrificer, receiving gain without sharing the risk of the practice itself.

  **The Critic's Attack**
  A defender of the separateness objection would argue you have smuggled in **Role Morality**. By making Elara the publican—a role historically coded as custodial—you rely on the reader's intuition that hosts owe duties to guests that guests do not owe to hosts. They would say you haven't justified the aggregation; you've just leaned on the pre-existing expectation that she *should* care more than they do. The "floor they stood on" metaphor, they'd claim, is a poetic cover for an asymmetrical duty you assigned her by profession, not by ethics.
