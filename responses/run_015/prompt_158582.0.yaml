answer: |-
  Consider a traffic flow model designed to predict the average crossing time on a specific commuter bridge during rush hour. The model operates on two completely false micro-rules: it assumes every vehicle is a heavy transport truck (which accelerates slowly and occupies more space) and simultaneously assumes every driver merges onto the bridge with perfect, frictionless coordination (never braking unnecessarily). In reality, the traffic is a mix of cars and trucks, and drivers frequently brake and hesitate. However, in this specific environment, the slowing effect of the imagined heavy trucks precisely cancels out the speeding effect of the imagined perfect merging, yielding a highly accurate aggregate prediction for total crossing time. A competing high-fidelity model that inputs accurate vehicle weights and recorded braking patterns performs worse because it is overly sensitive to microscopic fluctuations in individual reaction times, creating chaotic noise that obscures the macro-level trend, whereas the false model's compensating errors inadvertently smooth out this noise.

  From an instrumentalist perspective, championed by thinkers like Milton Friedman, the model's internal falsehoods are irrelevant; because the predictions match the data, the assumptions are validated as useful "as if" tools for organizing experience. A representational realist would argue this success is accidental and fragile, noting that the model fails to map onto the actual causal mechanisms of traffic, meaning its reliability is coincidental rather than explanatory. A structural realist might take a middle ground, suggesting that while the entities (trucks, perfect drivers) are wrong, the mathematical relationships governing flow rates might still capture the correct structural dependencies of the system. The feature doing all the work here is environment-dependent error cancellation, which is inherently brittle; if you move the model to a different city with a steeper bridge incline or a different season where driver behavior changes, the cancellation stops, and the predictions collapse wildly because the specific balance of errors no longer holds. An instrumentalist might attack this case as unfair by arguing that all models are domain-specific, and restricting the model's validity to the original bridge and season is a standard scientific practice rather than a flaw. It is settled in the philosophy of science that all models involve idealizations and falsehoods; what remains genuinely debated is whether predictive success alone is sufficient for scientific acceptance or if a model must also truthfully represent the underlying causal structure to be considered robust.
