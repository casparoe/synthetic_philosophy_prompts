prompt: |-
  hey im putting together an essay for a seminar on whether you need deep character flaws to explain atrocity or if situation and culture do all the work, and i want to read Lord of the Flies through the Browning vs Goldhagen debate but not in the lazy way where you just say its human nature. specifcally look at the dance scene where Ralph and Piggy join in and Simon gets killed - is that a Browning-style moment where ordinary boys are swept up by group dynamics and deindividuation, or does it show a Goldhagen-style willingness to embrace eliminatory violence once the social contract collapses? also take seriously that the boys invent the beast out of nothing rather than encountering a real threat - does that mean the ideology of fear is constructed in the moment by situation, or was there always a latent capacity for demonizing outsiders? i want you to treat Piggys glasses as a symbol of rational-legal authority and ask whether breaking them is just the loss of institutional constraint or the active triumph of hatred. please dont reduce Goldings novel to an illustration and dont twist either historian to fit the plot. write everything in continuous prose only, no headings bullet points bold text or tables, like an email or letter. lead with your bottom line then develop the reasoning, since i need to know where you land before using this.
