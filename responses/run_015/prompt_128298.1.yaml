      *   **Core Concept:** Confucian *zhengming* (rectification of names) interpreted through "reciprocal vulnerability." Roles aren't just scripts; they are constituted by the vulnerability of those who depend on you.
      *   **Argumentative Stance:** Committed position. Either this synthesis saves role ethics from bureaucratic apologia OR it fails due to unsustainable heroism. (I need to choose one).
      *   **Tone:** Precise for philosophers, accessible for practitioners. No wincing, no checking out.
      *   **Constraints:** No bibliographies/citations/quotes. Paraphrase concepts.
      *   **Requirement:** A closing note identifying liberties taken with standard Confucian interpretations (the "reciprocal vulnerability" injection).

  2.  **Determine the Stance:**

      *   *Option A:* It saves role ethics from bureaucracy. (Optimistic, constructive).
      *   *Option B:* It fails because it demands heroism. (Pessimistic, critical).
      *   *Decision:* Option A is more suitable for an *opening* remark at a workshop intended to foster dialogue and repair. It invites the scholars to refine the theory and the practitioners to engage with it. Arguing that it *fails* might shut down the room before starting. However, the prompt asks to "build the speech around that verdict with reasons." I will argue that *without* this vulnerability clause, role ethics *is* an apologia for bureaucracy, but *with* it, it becomes a viable framework for accountability. This takes a strong stand: The traditional/scripted reading is insufficient; the vulnerability reading is necessary for survival.

  3.  **Drafting - Section by Section:**

