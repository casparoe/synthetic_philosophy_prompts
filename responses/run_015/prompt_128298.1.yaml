      *   **The Problem with "Roles" (1.5 minutes):** How practitioners usually see roles (job descriptions, protocols) vs. how they function in a scandal (hiding behind protocol). Connect this to the philosophical risk of *zhengming* becoming rigid hierarchy.
      *   **The Core Synthesis: Reciprocal Vulnerability (2 minutes):** Introduce the concept. To be an editor is to be vulnerable to the writer's trust; to be a researcher is to be vulnerable to the public's reliance. This isn't just duty; it's exposure. If you hurt them, you damage your own standing as that role.
