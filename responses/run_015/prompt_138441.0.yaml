answer: |-
  Here are ten questions designed to press the machinery of counterfactual reductionism, structured to make the "baseline shift" move increasingly costly for your guest.

  ### 1. The Modal Strength & External Aid
  **Question:** Let's pin down the modal operator. When you say the hearer *could* produce reasons if pressed, does that allow for external aids? If I'm challenged on a claim, can I pull out my phone, query a database, or call an expert friend to generate the reliability reasons, or must the resources be internal to my current cognitive state?

  **Likely Answer:** She will likely allow some external aid but try to cap it at "readily accessible" resources to avoid making the condition too demanding.
  **Follow-up:** If I can use a search engine or call an expert to satisfy the condition, the warrant seems to reside in the *network*, not the individual hearer. Are you willing to say testimonial warrant is essentially distributed? And if so, doesn't that collapse your view into the anti-reductionist's "default entitlement," just with extra bookkeeping about who in the network holds the reasons?
  **The Bite:** Forces a choice between an implausible individualism or a distributed view that looks indistinguishable from the opposition.

  ### 2. The Squeeze (Triviality vs. Skepticism)
  **Question:** There's a squeeze here. If the counterfactual condition is weak enough that nearly every competent adult satisfies it automatically, your view predicts nothing and is hard to distinguish from the default entitlement views you're arguing against. If it's demanding, you over-generate skepticism about the epistemic division of labor—I don't actually have reasons ready for my dentist or air-traffic controller. How do you walk the line without sliding to one side?

  **Likely Answer:** She will tighten the ability condition: it must be exercisable without "special assistance," relying on ordinary background beliefs.
  **Follow-up:** But "ordinary background beliefs" for a layperson regarding a specialist *just are* entitlements. If the reason I give is "he has a degree on the wall," that's a proxy for "society says he's safe to trust." At what point does relying on social proxies stop being reductionism and start being the institutionalized entitlement you reject?
  **The Bite:** Targets the specific tightening move, suggesting the "reasons" provided are just entitlements in disguise.

  ### 3. The Novice/Content Gap
  **Question:** Consider a child learning that invisible organisms cause disease. You'll say they have crude counterfactual reasons—caregiver track records, sincerity cues. But how does evidence that *crude* (Mom is usually nice) underwrite the specific *content* acquired (germ theory)? It seems to underwrite the claim "Mom is worth listening to," but not the specific factual claim about microbiology.

  **Likely Answer:** She will argue that the track record evidence is sufficient to transfer warrant for the content, provided there are no defeaters.
  **Follow-up:** If the track record is the only reason available, isn't that a *global* reason to trust the speaker, rather than a *local* reason about the specific claim? And if you allow global reasons to do the work, haven't you quietly abandoned the reductionist requirement for claim-specific positive reasons?
  **The Bite:** Exposes the gap between global trust (entitlement) and local warrant (reductionism) in developmental cases.

  ### 4. Machine Warrant & Opacity
  **Question:** Your view seems to get "free money" with non-speaker systems. A weather app or medical AI has a reliability profile I could in principle sample, but no one offers assurance. Does your view imply that warrant from a well-calibrated machine is in *better* shape than warrant from a colleague's assertion, since the machine's reliability is more easily quantified?

  **Likely Answer:** She will likely say the warrant is comparable, or that the machine case shows the strength of the reductionist approach.
  **Follow-up:** Okay, but what if the system is a proprietary black box? No amount of querying lets me estimate its reliability; I just have to take the vendor's word. Here the counterfactual condition fails—I *cannot* marshal reasons even in principle. Do I lack knowledge here? If so, your view is more skeptical about modern tech than the assurance view.
  **The Bite:** Tests if the view is too friendly to technology or paradoxically skeptical of opaque systems we rely on daily.

  ### 5. Content-Based vs. Speaker-Based Reasons
  **Question:** Your requirement is naturally read as needing reasons about the *speaker* (competence, honesty). But suppose the only thing I could produce if pressed is a reason about the *content*—it coheres with my other beliefs, or it's the sort of thing that would be widely reported if false. Is that enough for *testimonial* warrant?

  **Likely Answer:** She will almost certainly say yes, arguing that speaker-reasons can be partly generic or content-involving.
  **Follow-up:** If content-coherence is sufficient, haven't you reduced testimony to inference from coherence? What work is the "testimonial" part of the view doing if the warrant ultimately rests on how the claim fits my existing web of belief rather than the speaker's say-so?
  **The Bite:** Challenges the distinctiveness of testimonial reductionism; risks collapsing testimony into general inference.

  ### 6. The Context of "Pressing"
  **Question:** Who is doing the pressing in the counterfactual scenario? The reasons I need to marshal to satisfy a skeptical philosopher are different from what I need to satisfy a peer or a child. Does the strength of the warrant shift depending on who is imagined to be doing the pressing?

  **Likely Answer:** She will likely concede some context-sensitivity but argue there's a baseline "reasonable challenger" standard.
  **Follow-up:** If the warrant shifts with the imagined interlocutor, isn't warrant itself context-sensitive in a way that makes "reductionism" unstable? It sounds less like a theory of warrant and more like a theory of conversational accountability.
  **The Bite:** Highlights instability in the modal condition; suggests the view is pragmatic rather than epistemic.

  ### 7. Metaphysical vs. Normative Cash Value
  **Question:** Is this a metaphysical thesis about where warrant *comes from* (testimony transmitting rather than generating it), or is it a norm for how hearers ought to manage their beliefs? If it's only the metaphysical thesis, what's the cash value? Does it leave us with anything different to say to a student who believes everything she reads?

  **Likely Answer:** She will likely argue it's both, or that the metaphysical grounding dictates the norm (be ready to defend).
  **Follow-up:** But the anti-reductionist can also tell the student "be ready to defend." If the practical advice is identical, is the disagreement just about labeling the default status of belief? Why should we care about the label if the output is the same?
  **The Bite:** Questions the pragmatic utility of the philosophical distinction; pressures the "verbal dispute" angle.

  ### 8. The Baseline Shift Methodology
  **Question:** You handle hard cases by shifting the baseline of what the hearer is expected to come up with. Isn't this making the theory unfalsifiable? If every counter-example is met by adjusting the "accessible reasons" bar, how do we test the view?

  **Likely Answer:** She will deny it's ad hoc, claiming there are principled limits based on cognitive capacity and social context.
  **Follow-up:** What are those principled limits, then? Can you give me a case where a hearer *fails* the counterfactual condition but we intuitively think they have knowledge? If you can't produce a false negative, the condition isn't doing any work.
  **The Bite:** Attacks the methodology directly; demands a concrete failure case to prove the condition has teeth.

  ### 9. The Falsification Question
  **Question:** Let's end on what counts against you. What specific case would make you abandon the view? Is it a case where I *can* marshal reasons but still lack warrant? Or a case where I *can't* marshal reasons but clearly have warrant?

  **Likely Answer:** She will likely point to the latter: a clear case of knowledge without accessible reasons would be problematic.
  **Follow-up:** But if you concede that there are cases of knowledge where I *can't* marshal reasons (e.g., high-stakes opacity, or deep expertise), aren't you conceding the anti-reductionist's core point that warrant can be default? How much of your view survives that concession?
  **The Bite:** Forces admission of vulnerability; links potential falsification directly to conceding the opponent's core thesis.

  ### 10. Reductionism vs. Entitlement (The Final Label)
  **Question:** If the "counterfactual reasons" are often just the absence of defeaters plus a general trust in social institutions, aren't you describing an entitlement view with extra bookkeeping? What work is the "reason" doing if it's never actualized and looks exactly like a default permission?

  **Likely Answer:** She will insist on the distinction: entitlement is *no* reasons required; her view is *dispositional* reasons required.
  **Follow-up:** But if the disposition is never triggered, and the reasons are generic social proxies, the *epistemic position* of the hearer is identical to the entitlement view. If the epistemic position is identical, why fight so hard to keep the "reductionist" label?
  **The Bite:** The final nail on the "reductionist" label; suggests the view is a verbal variant of the position it opposes.
