answer: |-
  1. Reconstruction and diagnosis
  The argument proceeds in three movements. First, it establishes realism: period labels denote real structures because objective constraints govern their application (1–4). Second, it asserts interdependence: these structures are relationally defined, such that the Scientific Revolution requires the Middle Ages as its counterpoint (5–6). Third, it derives necessity: accepting one structure ontologically commits one to the others, making selective rejection contradictory (7–12).

  The reasoning fails at step (6). This step executes a modal slide from relational definition to ontological dependence. Just because concept A is defined in contrast to concept B does not mean B must exist as a "real structure" for A to be real. A genuine historical transformation (Scientific Revolution) can occur relative to a historiographical construct (Middle Ages) without that construct possessing equal ontological weight. The step looked plausible because it mirrors Hegelian dialectics, where thesis and antithesis share equal reality. Historians often assume that if a change is real, the state changed must be equally substantive. However, this conflates the reality of the *transition* with the reality of the *categories* describing the endpoints.

  2. The case for the failing step
  A serious historian might defend (6) by appealing to contextualism. Historical events derive meaning from their placement within a narrative structure; the significance of Newton's *Principia* relies on its contrast with prior Scholasticism. If the "Middle Ages" is merely a fiction, the "overthrow" becomes a gesture without an object, rendering the Scientific Revolution unintelligible. Step (6) performs crucial conceptual work by securing the coherence of historical change. It prevents historians from isolating events into atomized moments, ensuring that transformations are understood as dialectical movements rather than disjointed occurrences. By insisting on the reality of the endpoints, the historian preserves the integrity of the causal narrative. Without (6), one risks claiming a revolution occurred against an enemy that never existed, which seems to undermine the explanatory power of the periodization itself. Thus, (6) appears necessary to maintain the semantic stability of historical terms.

  3. The price of each alternative
  Rejecting (2) implies constraints are purely conventional. This costs objective grounding; any assignment becomes stipulation, eroding the distinction between rigorous history and fiction. Rejecting (3) claims no objective constraints exist (e.g., Newton could fit the Renaissance). This undermines objective historiography altogether, reducing historical analysis to arbitrary storytelling where evidence cannot falsify period assignments.

  Rejecting (5) denies that structures are interdefined. This forces a form of historical nominalism about all periods, treating them as isolated buckets rather than a flowing narrative. It risks historical atomism, where events lose their relational significance, making it difficult to explain *why* changes occurred. However, it does not necessarily deny all structure, only the strong dialectical link.

  Rejecting (10) allows for mixed ontology: some periods are real structures, others heuristic tools. This does not require denying modern science. Science is a practice with explanatory success; the "Scientific Revolution" is a label tracking that success. One can affirm the practice while treating the period label as a convenient fiction distinct from the "Middle Ages" label. The cost here is minimal: it requires accepting a nuanced ontology where some historical categories map to reality more closely than others, rather than a binary all-or-nothing realism. This avoids the contradiction without sacrificing scientific realism.

  4. Verdict
  The least costly rejection is (6). The argument can be repaired by weakening (6) to assert conceptual, rather than ontological, dependence. We can acknowledge that the *term* "Scientific Revolution" gains meaning from its contrast with the "Middle Ages" without requiring the Middle Ages to be a unified real structure. This implies that periodization possesses a hybrid ontological status: the changes tracked are real, but the buckets used to organize them are heuristic tools. Historians can thus accept the Scientific Revolution as a genuine transformation of practice while treating the Middle Ages as a useful, albeit constructed, backdrop. This preserves the user's desire for selective rejection without contradiction, maintaining objective historiography while avoiding rigid structural realism.
