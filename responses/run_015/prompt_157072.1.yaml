      *   If I teach Alienation first: Exploitation becomes just "the cause of alienation." They become causally linked, not conceptually distinct.
      *   If I teach Exploitation first: Alienation becomes just "the feeling of exploitation."
      *   *Actually, the prompt implies one specific order is better.* "Which concept must be secured first."
      *   *Argument:* Secure **Exploitation** first. It is objective/quantifiable (in theory). If I introduce Alienation first (phenomenological), students will treat Exploitation as merely the *mechanism* of Alienation. By securing Exploitation as a structural fact of surplus extraction *independent* of feeling, I prevent Alienation from swallowing it. Then, when I introduce Alienation, it is a distinct category of *relation to self*, not just a reaction to surplus extraction.
