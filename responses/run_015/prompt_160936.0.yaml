answer: |-
  **JOINT STATEMENT ON THE CROSS-FADE PROTOCOL**

  **I. Agreed Claims**

  The undersigned researchers, having convened under the Cross-Fade Protocol, affirm the following twelve claims as the baseline for further inquiry. Each claim is intended to be non-vacuous; denial of any would constitute a substantive departure from this agreement.

  1.  We accept the Cross-Fade Protocol description as the fixed reference case, specifically the four-week gain parameter shift from lambda=0 to lambda=1 followed by excision.
  2.  We accept stipulated finding (a): at lambda=0.5, dynamical measures indicate partial decoupling and increased latency, while behavioral and report-based tests show no impairment.
  3.  We accept stipulated finding (b): after lambda=1 and excision, the subject reports a subtle shift in the phenomenal character of a familiar taste, though input-output function matches recorded data within error.
  4.  We accept stipulated finding (c): a state backup frozen at lambda=0.4 and instantiated in a spare surrogate body behaves identically to the original and claims to be the original.
  5.  We agree that by lambda=1, the surrogate system sustains consciousness; it is not an inert simulation but a locus of experience.
  6.  We agree that continuous causal connection retains practical and ethical value, even if not metaphysically necessary for identity.
  7.  We agree that at lambda=0.5, the question of whether survival admits of degrees remains open; no consensus exists on whether the subject is partially survived or fully survived.
  8.  We agree that the subject's daily reports during the fade are epistemically limited; they cannot settle metaphysical identity claims alone given the possibility of functional masking.
  9.  We agree that surgical excision at lambda=1 adds no causal functional work beyond the fade completion; the transfer is complete prior to removal.
  10. We agree that ordinary metabolic turnover does not constitute death, despite total material replacement over time.
  11. We agree that policy at lambda=0.5 should err on the side of caution regarding identity risk, despite behavioral normalcy.
  12. We agree that no platitude suffices to resolve whether the backup is the original or a duplicate; genuine agreement stops at the description of the case, not its metaphysical verdict.

  **II. Disagreements Table**

  | Disputed Claim | Preservationist Formulation | Patternist Formulation | Diagnosis |
  | :--- | :--- | :--- | :--- |
  | **Conditions of Identity** | Identity requires the continuous material life of the same brain; substrate independence is only possible via in-place replacement. | Identity requires continuity of causal-functional organization; substrate independence is achievable via scan-and-emulate. | **Substantive.** Competing necessary conditions yield different verdicts on case (c). |
  | **Status of Backup** | The backup is a duplicate; the original ceased to exist when the biological brain was excised or functionally superseded. | The backup is the original; identity transferred at the lambda=0.4 freeze point based on functional state. | **Substantive.** Divergent verdicts on whether one or two persons exist post-instantiation. |
  | **Significance of Taste Change** | Evidence of gradual phenomenal drift during the fade, masked by report, indicating loss of original subjective continuity. | Evidence of substrate-sensitive qualia, irrelevant to identity so long as functional role and memory are preserved. | **Verbal.** Reduces to: Does phenomenal character supervene on material substrate or functional role? |
  | **Value of Continuity** | Continuity is constitutive of survival; without it, what matters is lost. | Continuity is instrumentally valuable for safety but not constitutive of survival itself. | **Substantive.** Disagreement on whether continuity is a means or an end. |

  **III. Cruxes**

  The following sub-questions represent points where empirical or argumentative resolution would shift the position of at least one party.

  **1. Transitivity Across the Fade**
  *Question:* Does personal identity hold transitively across every infinitesimal step of the lambda shift, or does it fail by increments?
  *Finding:* The Cross-Fade Protocol steps (lambda 0.0 to 1.0).
  *Predictions:* The Preservationist predicts identity holds only if biological continuity is maintained at every step. The Patternist predicts identity holds if functional continuity is maintained at every step.
  *Concessions:* If the Preservationist concedes identity holds despite biological discontinuity at a step, she abandons strict biological essentialism. If the Patternist concedes identity fails despite functional continuity, he abandons pure functionalism.

  **2. Matter vs. Causal-Functional Role**
  *Question:* What survival requires: continuity of matter or of causal-functional role, specifically regarding metabolic turnover?
  *Finding:* Claim 10 (ordinary metabolic turnover).
  *Predictions:* The Preservationist argues metabolic turnover preserves the "life of the brain" as a process. The Patternist argues turnover is irrelevant except as a carrier of function.
  *Concessions:* If the Preservationist admits turnover is functionally identical to replacement but metaphysically distinct, she must explain the non-functional difference. If the Patternist admits turnover matters metaphysically, he must incorporate material constraints.

  **3. Subject Reports and Silent Shifts**
  *Question:* Do the subject's clean reports settle anything given the possibility of phenomenology that silently shifts or gradually fades while function is held fixed?
  *Finding:* Stipulated finding (a) and (b) (integration drop and taste change).
  *Predictions:* The Preservationist predicts reports mask underlying phenomenal fragmentation. The Patternist predicts reports track what matters; phenomenal shifts are incidental.
  *Concessions:* If the Preservationist accepts reports as definitive, she must deny the metaphysical significance of the integration drop. If the Patternist accepts reports are unreliable, he loses his primary evidence for survival in transfer cases.

  **4. The Backup Case**
  *Question:* In stipulated finding (c), are there now two persons or one?
  *Finding:* Lambda=0.4 backup instantiated in spare body.
  *Predictions:* The Preservationist predicts two persons (original continues, backup is duplicate). The Patternist predicts one person (identity transferred) or branching identity.
  *Concessions:* If the Preservationist accepts the backup is the original, she must accept substrate independence without in-place replacement. If the Patternist accepts the backup is a duplicate, he must accept functionalism is insufficient for identity.

  **5. Policy at Lambda=0.5**
  *Question:* What ought the protocol do at lambda=0.5 given finding (a), since the two may agree on policy while disagreeing about metaphysics?
  *Finding:* Stipulated finding (a) (decoupling without behavioral change).
  *Predictions:* Both agree on caution (Claim 11), but for different reasons. Preservationist fears death; Patternist fears engineering risk.
  *Concessions:* If safety data proves lambda=0.5 is risk-free for function, the Patternist would proceed; the Preservationist would still halt due to metaphysical risk. This highlights the policy divergence despite surface agreement.

  **IV. Closing Statement**

  We acknowledge that this document captures the limits of our current convergence. Both parties accept that new data regarding the phenomenology of partial decoupling could move the debate. Specifically, if it were demonstrated that consciousness ceases during the lambda=0.5 decoupling despite behavioral normalcy, the Patternist would need to revise the sufficiency of functional output. Conversely, if it were demonstrated that consciousness persists seamlessly despite total biological replacement without in-place fading, the Preservationist would need to revise the necessity of biological life.

  **Preservationist Statement of Falsification:** I would abandon my view if presented with a case where a biological brain is destroyed instantly, yet the subject's stream of consciousness continues uninterrupted in a surrogate without any period of overlapping causal operation.

  **Patternist Statement of Falsification:** I would abandon my view if presented with a case where a perfect functional duplicate is created while the original remains intact, and it is demonstrably true that neither instance possesses the original's subjective perspective, implying function alone generates no subject.

  We sign this document to record our shared commitment to these terms of engagement.
