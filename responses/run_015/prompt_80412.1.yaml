answer: |-
  # The Ineffective Objection: Decision Tree

  **Node 1 (Causal Claim):** In cases like buying meat or voting, if you abstain, is the final outcome *literally identical* or *technically different but negligible*?
  *   **Left:** Literally Identical (Causal Null)
  *   **Right:** Technically Different (Magnitude)

  **Node 2 (Responsibility Condition):** To be morally responsible for a bad outcome, must your action be *enough on its own* to cause it, or is *contributing to the total* enough?
  *   **Left:** Enough on its own (Sufficiency)
  *   **Right:** Contributing is enough (Contribution)

  **Node 3 (Duty Source):** Does your duty depend on *what this specific act achieves* or on *the role you occupy* (e.g., voter, consumer)?
  *   **Left:** What the act achieves (Act)
  *   **Right:** The role you occupy (Role)

  ---

  ### Leaves

  1.  **Hard Ineffectivist** (Identical / Sufficiency / Act)
      *   *Awkward Commitment:* Must deny moral responsibility even in clear threshold cases where one person obviously tips the scale.
  2.  **Role Formalist** (Identical / Sufficiency / Role)
      *   *Awkward Commitment:* Asserts duties attach to roles even when the role is causally inert and cannot fulfill its purpose.
  3.  **Symbolic Purist** (Identical / Contribution / Act)
      *   *Awkward Commitment:* Condemns acts as morally wrong even when they cause literally zero harm to anyone.
  4.  **Civic Essentialist** (Identical / Contribution / Role)
      *   *Awkward Commitment:* Maintains a duty to vote even in rigged elections where the role confers no power.
  5.  **Threshold Individualist** (Magnitude / Sufficiency / Act)
      *   *Awkward Commitment:* Makes responsibility depend on unknowable facts about whether you were the specific marginal person.
  6.  **Unoccupied** (Magnitude / Sufficiency / Role)
      *   *Diagnosis:* Incoherent; no one argues for a role-duty that requires sufficiency when the role is inherently non-sufficient.
  7.  **Expected-Value Consequentialist** (Magnitude / Contribution / Act)
      *   *Awkward Commitment:* Treats tiny probabilities of harm as binding duties equivalent to certain harm.
      *   *Note:* This smuggles a decision-theoretic question (expected utility) into what started as a deontic one (actual harm). Removing this move collapses the case back to Leaf 3 (Symbolic Purist) or Leaf 1 (Hard Ineffectivist), as the actual act caused no harm.
  8.  **Collective Obligationist** (Magnitude / Contribution / Role)
      *   *Awkward Commitment:* Binds you to the group's failure even if your individual contribution was virtuous.

  ---

  ### Flags & Diagnostics

  *   **Indistinguishable Pair:** Leaves 1 and 5 are practically inseparable for the agent. Since you cannot know if you are the threshold case (Leaf 5) or causally null (Leaf 1), both positions advise acting as if your action doesn't matter in standard cases.
  *   **Unoccupied Combinations:** Leaves 2 and 6 are effectively empty. Requiring *sufficiency* for responsibility while grounding duty in a *role* that is structurally insufficient (like voting) is unattractive to all but the most rigid formalists.
  *   **Control Case Diagnostics:**
      *   **Voting:** Exposes Leaf 1 holders. If they admit a duty to vote despite causal nullity, they must move to Leaf 4 (Role) or Leaf 3 (Symbolic).
      *   **Meat:** Exposes Leaf 7 holders. If they admit a duty based on expected value rather than actual impact, they are relying on decision theory, not direct causation.
