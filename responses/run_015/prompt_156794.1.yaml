      *   *Adams vs. Jeffrey:* The student says "basically a Jeffrey-style update." This is actually not terrible. There is a literature on "Jeffrey Conditioning on Conditionals." But strictly speaking, Adams's Thesis is $P(A \rightarrow C) = P(C|A)$. It's an equation, not an update rule. The *application* to Judy Benjamin often involves a constraint like $P_{new}(Rear|Blue) = 1$. The student is conflating the thesis with the update mechanism.
