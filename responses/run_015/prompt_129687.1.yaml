answer: |-
  **brainstorming the crux**
  students always trip here because they treat biology as metaphysics. they think if the science changes (no sperm), the metaphysical rule breaks. but essentialism is about *this* origin being necessary, not sperm specifically. the trick is showing that the 'origin' relation just shifts to the stem cells without losing necessity. gotta force them to separate modal claims from scientific conditions.

  **exam question**
  Kripke argues you couldn't have come from a different sperm and egg; origin is essential to identity. But new tech creates synthetic embryos (blastoids) from induced pluripotent stem cells without gametes. If origin essentialism holds, does the absence of gametes dissolve the necessity claim, or does the 'origin' shift to the source somatic cells? Critically assess whether metaphysical essentialism can survive the decoupling of biological identity conditions from sexual reproduction. Does the lack of a specific gamete pair undermine the necessity of origin, or merely relocate the essential boundary to the stem-cell line? Explain why biological possibility doesn't automatically settle metaphysical necessity.

  **model answer**
  Origin essentialism is a modal claim about necessity across possible worlds, not merely a biological description. Kripke's argument anchors identity to the initial material cause. A common error is conflating this with biological identity conditions, assuming DNA or gametes are the metaphysical ground. Biology deals with sufficient conditions for development; metaphysics deals with strict numerical identity.

  In the case of blastoids from iPSCs, the absence of gametes doesn't refute essentialism; it relocates the origin. If a specific stem-cell line is the material cause, essentialism suggests the entity couldn't arise from a *different* cell line while remaining numerically identical. The 'origin' shifts from gamete fusion to cellular reprogramming. The essential property isn't 'sperm + egg' but 'this specific material starting point.'

  The crucial distinction is that biological continuity allows for branching (clones), but metaphysical essentialism forbids it for the *same* individual. Even without gametes, if the material origin differs, it's a different entity. Thus, essentialism survives by abstracting away from sexual reproduction to the specific material history. Biological possibility (creating life without sperm) doesn't settle metaphysical necessity (could *this* being have started elsewhere?). The essentialist insists that whatever the actual origin is (gamete or stem cell), it is necessary. To deny this is to confuse contingent biological processes with necessary identity conditions. If we treat biological mechanisms as essential, we risk obsolescence as tech changes. Metaphysical essentialism must be robust enough to cover the *actual* origin, whatever form it takes. Therefore, the lack of gametes shifts the boundary to the stem-cell source rather than dissolving the necessity claim.

  **marking scheme**
  1. Define modal essentialism: A cites Kripkean necessity; B describes biology only.
  2. Distinct identity conditions: A separates metaphysics from science; B conflates DNA with identity.
  3. Handle no-gamete case: A sees relocation of origin; B claims theory falsified.
  4. Stem-cell source: A identifies new material cause; B ignores iPSC role.
  5. Necessity vs contingency: A argues origin is fixed whatever the tech; B treats tech as changing identity.
  Typical mistake: Treating biological possibility as metaphysical possibility.
