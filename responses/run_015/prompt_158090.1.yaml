      *   *Addressing "Prospective Coverage":* It is prequential. It's not irreducibly abductive. It's just $P(D_{future}|D_{past}, M)$.
      *   *Addressing "Loveliness":* If it affects belief, it must be a prior or likelihood. If it doesn't affect belief, it's not inference. If it affects *which models you build*, it's meta-inference.

