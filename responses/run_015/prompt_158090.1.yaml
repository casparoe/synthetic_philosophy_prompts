      *   *Lipton:* Distinction between "likeliest" (most probable) and "loveliest" (most explanatory). IBE guides priors or likelihoods, but isn't identical to Bayes.
      *   *Okasha/Post-Positivists:* IBE is a heuristic for setting priors/model structures.
      *   *Hypothesis Generation:* Bayes assumes a fixed $\Theta$. IBE claims to create new $\theta$.
      *   *Contrastivity:* Why $P$ rather than $Q$? Bayes does $P(H|D)$, IBE does $H$ explains $D$ better than $H'$.
      *   *Friend's "Prospective Coverage":* Sounds like predictive accuracy or prequential principle (Dawid).

  3.  **Drafting Section 1: Translation of Positions (The "Rosetta Stone"):**
      *   *IBE Claim:* We pick the "loveliest" explanation.
          *   *Bayes Translation:* This isn't $P(H|D)$ (MAP). It's a penalty/bonus term in the prior $P(H)$ or a modification to the likelihood $P(D|H)$ based on structural virtues (simplicity, unification).
      *   *IBE Claim:* Explanation is contrastive.
          *   *Bayes Translation:* Model comparison via Bayes Factors ($P(D|H_1) / P(D|H_2)$). It's inherently relative.
      *   *IBE Claim:* IBE generates *new* hypotheses.
          *   *Bayes Translation:* This breaks the standard framework. Standard Bayes assumes a fixed $\sigma$-algebra. This requires "open-minded" priors or non-parametric growth, or simulation-based model expansion.
      *   *IBE Claim:* "Smuggling" objection (Virtues are just priors).
          *   *Bayes Translation:* If you can quantify "loveliness" as a weight on $P(H)$, then IBE *is* Bayes. If you can't, it's external.
      *   *Friend's "Prospective Coverage":*
          *   *Bayes Translation:* Prequential score / Log Predictive Density / Posterior Predictive Check. $P(D_{new} | D_{old}, H)$.

  4.  **Drafting Section 2: The Residue Report (The Core Analysis):**
      *   *Clean Translations:* Contrastivity $\rightarrow$ Bayes Factors. Prospective Coverage $\rightarrow$ Predictive Likelihood/Cross-Validation. Virtues as priors $\rightarrow$ Occam's razor in marginal likelihood.
      *   *Fudged Translations:* "Loveliness." If it's just simplicity, it's marginal likelihood (integrated likelihood penalizes complexity). If it's "understanding," that's subjective. To make it Bayes, you have to define a utility function or a specific prior structure.
      *   *The Hard Residue (Non-enumerable Space):* This is the big one. Standard Bayes requires a defined model class $\mathcal{M}$. IBE claims to step *outside* $\mathcal{M}$.
          *   *Likelihood-free inference:* ABC/SBI assumes a simulator. It still needs parameters.
          *   *Non-parametric Bayes:* Dirichlet Processes allow growing clusters, but the *structure* is fixed.
