answer: |-
  # Joint Statement on Value Extrapolation and Coherence

  **Parties:** The CEV Stabilist Working Group & The Idealized-Preference Pluralist Consortium  
  **Context:** Adversarial Collaboration on AI Alignment Normatives  
  **Date:** October 2023

  ## Preamble

  We, the undersigned parties, represent divergent schools of thought regarding the extrapolation of human volition for advanced AI alignment. The Stabilist position holds that sufficient reflection and knowledge converge upon a single, globally coherent preference ordering ("True Volition"). The Pluralist position holds that idealization enforces only local coherence, and that forcing global convergence constitutes a normative error that destroys legitimate value pluralism.

  Despite this fundamental divergence, we recognize that successful alignment requires shared operational ground. We have engaged in structured debate to isolate our empirical and methodological agreements from our normative disagreements. This document records our consensus on the mechanics of extrapolation and delineates the specific cruxes where our prescriptions for AI behavior diverge.

  ## I. Agreed Claims

  1.  **Mechanics of Extrapolation:** Value extrapolation must proceed via iterative reflection, coherence checking, and knowledge growth. The process involves simulating the agent under conditions of reduced cognitive bias and increased information.
  2.  **Preference Revisability:** Preferences are not static data points. Reflection can genuinely revise, invert, or discard current preferences. The "current self" does not have veto power over the "idealized self" solely by virtue of being current.
  3.  **Anti-Paternalism:** The extrapolation process must not import external normative standards (e.g., utilitarian calculus imposed from outside the agent's psychology). Changes must be endorseable from the agent's own perspective under idealization.
  4.  **Insufficiency of Revealed Preference:** Observed behavior alone is an insufficient basis for value loading. Behavior is often noisy, constrained, or reflective of transient states rather than enduring values.
  5.  **Respect for Identity:** The extrapolation process must preserve the continuity of personal identity where possible. Radical discontinuity between the current agent and the extrapolated volition constitutes a failure of alignment (death/substitution).
  6.  **Coherence as a Tool:** Coherence checks are necessary to prevent self-sabotage and logical inconsistency, but the *scope* of required coherence is disputed (see Section III).
  7.  **Safety Constraint:** In cases where extrapolation yields ambiguous or conflicting outputs, the AI should default to caution rather than forcing a resolution that risks violating the agent's core interests.

  ## II. Disagreements Table

  | Issue | Stabilist Wording | Pluralist Wording | Is this verbal? |
  | :--- | :--- | :--- | :--- |
  | **Scope of Coherence** | Global coherence is the telos of rationality; contradictions are errors to be resolved. | Local coherence is sufficient; global forcing is a distortion of complex value structures. | No (Substantive) |
  | **Existence of True Volition** | There is a single fact of the matter regarding "what I want" given sufficient idealization. | There is a family of coherent profiles; no single profile is uniquely "true." | No (Substantive) |
  | **Treatment of Conflict** | Persistent conflict indicates incomplete idealization or cognitive failure. | Persistent conflict may be a stable, valued feature of the agent's psychology. | No (Substantive) |
  | **Algorithmic Output** | The alignment target is a single utility function or preference ordering. | The alignment target may be a distribution, a committee, or a context-sensitive switching mechanism. | No (Substantive) |

  ## III. Cruxes and Concrete Scenarios

  ### Crux 1: The Modal Fact of Volition
  **Issue:** Whether there is a single fact about 'what I want' across modal distance, or just a family of local coherent profiles.

  **Concrete Scenario:** *The Branching Career.*  
  An agent is deeply torn between two life paths: becoming a dedicated field researcher (valuing discovery, risk, isolation) or a community organizer (valuing connection, stability, local impact). Under idealization (more knowledge, less fear), the agent still finds both paths compelling and mutually exclusive. The conflict does not resolve into a weighted compromise; the agent feels that choosing one kills a vital part of their identity.

  **Predictions:**
  *   **Stabilist:** The idealized agent *must* have a latent ordering that prefers one path over the other, or a specific hybrid path not currently visible. The AI should search deeper until this single ranking is found. Output: A deterministic choice of Path A or Path B (or a specific hybrid).
  *   **Pluralist:** The idealized agent legitimately possesses two incompatible coherent selves. Forcing a choice is a violation. Output: The AI should facilitate a randomized choice, parallel existence (if possible), or maintain flexibility to switch, acknowledging both as valid "true" volitions.

  ### Crux 2: The Archivist Case
  **Issue:** Whether an agent can validly prefer to preserve contradictory values as a memorial rather than resolve them.

  **Concrete Scenario:** *The Scarred Poet.*  
  A poet survived a period of intense ideological conflict and personal trauma. In reflection, they understand the conflict was painful and logically inconsistent. However, their idealized self explicitly values the *memory* of that conflict as the source of their art. They prefer to retain the tension between "order" and "chaos" in their psyche rather than smooth it into a coherent whole, fearing that resolution would sterilize their creativity.

  **Predictions:**
  *   **Stabilist:** This is a meta-preference error. The desire to preserve conflict is a resistance to rational integration. The AI should gently resolve the contradiction, assuming the "true" volition is the healed state, even if the current idealized self protests. Output: A coherent psyche where the conflict is resolved/sublimated.
  *   **Pluralist:** This is a valid higher-order preference. The agent values pluralism over coherence. Forcing resolution is paternalistic. Output: The AI preserves the internal contradiction, managing the risks without eliminating the tension.

  ## IV. Conclusion

  We agree that alignment requires respecting the agent's perspective under idealization. We disagree on whether idealization necessarily implies unification. The Stabilist fears that pluralism invites instability and self-sabotage. The Pluralist fears that stabilism invites value destruction and homogenization. Future work must test whether these divergent outputs lead to empirically distinguishable harms in high-stakes deployment.

