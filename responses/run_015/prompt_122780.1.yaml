prompt: |-
  Hi — I'm one of three people writing the text for a small permanent gallery on the history of medicine at a regional science museum. My background is exhibit design, not history, and our de facto historian is a board member who mostly communicates by writing sigh in the margins of my drafts. We've got roughly forty wall panels, a twelve-foot timeline, and an audio-guide script to get done before we open in eight months, so this is a call I'm making two or three times a week, not once. Panels are about ninety words, no footnotes, read mostly by school groups and occasionally quoted by the local paper; the director signs everything off, and anything that looks like picking a fight goes to our lay advisory board. I get maybe fifteen minutes per panel and I can't run to the historian everytime.

  What I want is an actual procedure: the questions in order, what counts as an adequate answer to each, where it stops with a this needs a rewrite, where it stops with a this is a values call, send it upstairs, and where it says leave it alone because the honest version costs more than it buys. I've read a little about the whig interpretation of history — Butterfield's 1931 book, and the general complaint that telling the past as a march toward us flatters the present and falsifies the past — and it's easy to nod at in the abstract and weirdly hard to catch in my own sentences, so I need it operationalized into something I can run on a draft. A few things I want the procedure to handle, and please tell me which of my home-made distinctions are real and which are junk: the martyr frame, where someone was right, was laughed at, and died unappreciated, which I suspect is just whig history with a victim in it; the they almost got it habit, describing past actors as groping toward our answer; my own favourite move, the myth-busting panel, no, people in the middle ages didn't think the earth was flat, which I'm now worried is itself a progress story in which we're the enlightened ones and the past is a crowd of rubes; the timeline, which is nothing but milestones and might be the most whiggish object in the room; and panels where what was progress for one group was straightforwardly loss for another. I've been using a rough test I call the swap test: if the alternative that actually lost had won instead, and my panel still reads basically the same with the names changed, then I haven't written history, I've written a just-so story. Is that the right test, is there a better one, and what should I do when a true correction would eat forty of my ninety words and lose a ten-year-old?

  Then run the finished procedure on three things. First, my draft panel on the doctor in an 1840s Vienna maternity ward who made the staff wash their hands, was ignored, and ended up in an asylum: I want it to be moving but I think it's currently the martyr frame, so tell me what it should say instead. Second, the twelve-foot timeline: should it exist at all, and if it does, what does a non-whig timeline look like in chunks that short, given I can't run a second rail of roads not taken the whole way without loosing the school groups entirely. Third, the one I'll like least: the flat-earth myth-busting panel. If your procedure says it's smug in the same way the whig panels are smug, say so plainly and tell me what to do with it, because it's the panel I'm proudest of. And there's a fourth one I want flagged rather than solved — a panel on a local surgeon who pioneered a technique in the 1930s and also operated on people without asking them — where I want the procedure to say out loud that this stopped being a question it can answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Exhibit Designer (not historian), working on a permanent gallery on the history of medicine at a regional science museum.
      *   **Constraints:** 40 wall panels (90 words each), 12-foot timeline, audio guide. 8 months to open. 15 minutes per panel max. No footnotes. Audience: mostly school groups, some local press. Approval chain: Director -> Lay Advisory Board (avoids "picking a fight"). Historian: Board member, unhelpful (sighs in margins).
      *   **Goal:** A concrete, operational *procedure* (checklist/algorithm) to detect and fix "Whig History" (history as a march of progress toward the present) in draft text.
      *   **Specific Concerns:**
          *   "Martyr Frame" (right, laughed at, died unappreciated).
          *   "They Almost Got It" (groping toward our answer).
          *   "Myth-Busting" (e.g., flat earth - are we just smug?).
          *   Timeline (inherently Whiggish?).
          *   Progress/Loss trade-offs (progress for one, loss for another).
          *   "Swap Test" (if the loser won, would the text read the same?).
      *   **Deliverables:**
          1.  The Procedure (questions, thresholds, decision points).
          2.  Application to Draft 1: Semmelweis (1840s Vienna, handwashing, asylum).
          3.  Application to Draft 2: The 12-foot Timeline.
          4.  Application to Draft 3: Flat Earth Myth-busting (the user's favorite, likely to be criticized).
          5.  Flagging Draft 4: Local Surgeon (1930s pioneer + non-consensual surgery) -> Identify where the procedure stops.

  2.  **Deconstruct "Whig History" for Exhibit Design:**
      *   *Definition:* Interpreting the past solely in terms of the present. Viewing history as inevitable progress. Judging past actors by modern standards without context.
      *   *Operationalizing:* It needs to be fast (15 mins). It needs to be binary enough (Pass/Fail/Rewrite/Escalate). It needs to respect word counts (90 words is *tiny*).
      *   *The "Swap Test":* It's good, but maybe too abstract for 15 minutes. Needs refinement.
      *   *The "Martyr Frame":* Yes, this is classic Whig. It simplifies conflict into "Genius vs. Idiots" where Genius = Us.
      *   *Myth-Busting:* Often creates a "Smart Us vs. Dumb Them" dynamic. Needs nuance.
      *   *Timeline:* Linear time *is* Whiggish by default. Needs disruption or context.

  3.  **Develop the Procedure (The "Whig-Check Protocol"):**
      *   *Phase 1: The Agent Check.* Are past people acting like humans in their context, or NPCs waiting for us?
      *   *Phase 2: The Outcome Check.* Is the outcome presented as inevitable?
      *   *Phase 3: The Cost Check.* Who lost? Is progress neutral?
      *   *Phase 4: The Smugness Check.* (Myth-busting).
      *   *Decision Tree:*
          *   Pass: Contextualized, contingent.
          *   Rewrite: Deterministic, martyrdom, smug.
          *   Escalate (Values Call): Ethical ambiguity, harm vs. benefit (The Surgeon case).
          *   Drop/Modify: Too complex for word count (The "Honest Version Costs More" rule).

  4.  **Drafting the Procedure Steps:**
      *   *Q1: The "Why" Test.* Why did they do it? If the answer is "because they were wrong/stupid," rewrite. If "because it made sense then," pass.
      *   *Q2: The "Inevitability" Test.* Does it sound like the next step *had* to happen?
      *   *Q3: The "Martyr" Test.* Is the hero defined solely by their rejection?
      *   *Q4: The "Cost" Test.* Is there a loser?
      *   *Thresholds:* 90 words is the hard constraint. If fixing it breaks the word count, simplify the claim, don't delete the nuance.

  5.  **Applying to the Four Scenarios:**

      *   **1. Semmelweis (The Martyr):**
          *   *Current:* Handwashing, ignored, asylum. (Classic Martyr).
          *   *Fix:* Why was he ignored? Germ theory didn't exist. It wasn't just stubbornness; it was a different paradigm. He wasn't "right" in a way they could understand.
          *   *Drafting:* Focus on the *system* of knowledge, not just the man.
      *   **2. The Timeline:**
          *   *Problem:* Linear = Progress.
          *   *Fix:* Can't remove linearity (it's a timeline). Must disrupt the *content*. Add "Dead Ends," "Controversies," or "Costs." Group by *question* not just *date*.
          *   *Constraint:* 12 feet. School groups need anchors.
          *   *Solution:* "The Road and The Rubble." Mark the milestones but acknowledge the alternatives in the subtext or visual design.
      *   **3. Flat Earth (Myth-Busting):**
          *   *Problem:* "We are smart, they were dumb."
          *   *Fix:* Why did they think that? (Authority, sensory evidence). Why do we think *this*? (Satellites, math). Make it about *evidence*, not *intelligence*.
          *   *Verdict:* It is smug. Needs reframing from "They were wrong" to "How do we know what we know?"
      *   **4. The Local Surgeon (The Flag):**
          *   *Issue:* Pioneer technique (Good) vs. No Consent (Bad).
          *   *Procedure Limit:* This isn't Whiggism; it's Ethics. The procedure identifies *historical framing*, not *moral judgment*.
          *   *Action:* Flag as "Values Call." Send to Advisory Board/Director. The procedure says "I can't solve this."

  6.  **Refining the Tone:**
      *   The user is stressed, practical, and intelligent. They don't need academic theory; they need a tool.
      *   Tone should be direct, collaborative, slightly informal but precise.
      *   Acknowledge the constraints (90 words, 15 mins).
      *   Validate their instincts (Swap Test is good, Martyr Frame is real).

  7.  **Review against Constraints:**
      *   *Word Count:* Keep the advice concise.
      *   *Time:* The procedure must be runnable in 15 mins.
      *   *Politics:* Acknowledge the Advisory Board/Director dynamic.
      *   *Historian:* Assume the historian won't help.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the procedure too long?
      *   *Fix:* Condense into a "5-Question Checklist."
      *   *Critique:* Is the Semmelweis rewrite too long?
      *   *Fix:* Keep it under 90 words.
      *   *Critique:* Am I being too hard on the Flat Earth panel?
      *   *Fix:* Acknowledge why they like it (clarity), but explain the trap (superiority).
      *   *Critique:* The Surgeon panel needs to be clearly marked as "Out of Scope."
      *   *Fix:* Explicitly state this triggers the "Values Call" protocol.

  9.  **Final Polish:** Check the "Swap Test" evaluation. It's a strong heuristic. I should endorse it but refine it for speed. (e.g., "The Counterfactual Check").

  *(Self-Correction on the Timeline)*: A 12-foot timeline is visual. I can't write 90 words for every inch. I need to suggest *visual* interventions (color coding, icons) that don't eat word count.

  *(Self-Correction on Semmelweis)*: The tragedy is real. Don't sanitize it. Just contextualize the resistance.

  *(Self-Correction on Flat Earth)*: The user says "people in the middle ages didn't think the earth was flat." Actually, educated people didn't. The myth is that *they* thought it was flat. The panel is busting the myth that *they* were dumb. Wait, the user's draft is "No, people... didn't think the earth was flat." That *is* myth-busting. The Whig trap is implying *we* know better because we are modern. The fix is explaining *why* the myth exists or why the medieval view was actually sophisticated.

  Let's assemble the response.cw
answer: |-
  This is a high-pressure constraint environment. You don't need theory; you need a triage tool. You are correct about your instincts: the "Martyr Frame" is Whig history with a victim, and the "Swap Test" is a valid heuristic, though it needs tightening for a 15-minute workflow.

  Here is the operational procedure, followed by the four applications you requested.

  ### The Procedure: The "Whig-Check" Protocol
  **Time budget:** 15 minutes per panel.
  **Goal:** Pass, Rewrite, Escalate, or Drop.

  **Step 1: The Agency Check (2 mins)**
  *   **Question:** Does the text explain *why* past actors made their choices based on *their* information, not ours?
  *   **Fail Condition:** Words like "failed to," "refused to," "ignored," or "didn't know yet" without explaining the logic of the time.
  *   **Pass Condition:** Actors are rational within their context (e.g., "Based on the theory of miasma...").
  *   **Action:** If Fail, Rewrite. If you can't explain their logic in 15 words, you don't understand it yet.

  **Step 2: The Inevitability Check (3 mins)**
  *   **Question:** Does the narrative imply the outcome *had* to happen?
  *   **Fail Condition:** "This led to," "Paved the way," "The next step was."
  *   **Pass Condition:** "This suggested," "Some argued," "It took decades to..."
  *   **Action:** If Fail, Rewrite. Introduce friction or contingency.

  **Step 3: The Martyr Test (3 mins)**
  *   **Question:** Is the protagonist defined solely by their rejection by contemporaries?
  *   **Fail Condition:** "He was right, they laughed, he died sad." (This makes the past a villain and the present the vindicator).
  *   **Pass Condition:** "His evidence clashed with established systems." (This makes it a structural conflict).
  *   **Action:** If Fail, Rewrite. Shift focus from the man's suffering to the system's resistance.

  **Step 4: The Cost Check (3 mins)**
  *   **Question:** Does this "advance" have a loser?
  *   **Fail Condition:** Progress is described as a net positive for "everyone" or "humanity."
  *   **Pass Condition:** Specific groups benefit; specific groups bear the cost.
  *   **Action:** If Fail, and there *was* a cost, Rewrite. If the cost is complex (ethical/legal), **Escalate** (see Step 5).

  **Step 5: The Complexity Ceiling (4 mins)**
  *   **Question:** Does telling the honest version exceed 90 words or require ethical judgment beyond historical fact?
  *   **Fail Condition:** The nuance requires 200 words, or the "truth" is a moral debate (e.g., consent vs. cure).
  *   **Action:**
      *   If word count is the issue: **Simplify the claim, don't delete the nuance.** (e.g., change "This cured disease" to "This reduced mortality for some.").
      *   If it's an ethical debate: **Flag as Values Call.** Send to Director/Board. This is not a history problem; it's a policy problem.

  ***

  ### Application 1: The Semmelweis Panel (The Martyr Frame)
  **Diagnosis:** **Fail (Martyr Test).**
  Your draft likely reads: *"Ignaz Semmelweis discovered handwashing saved lives. The medical establishment mocked him. He died in an asylum, unappreciated. Today we know he was right."*
  **Why it fails:** It turns 1840s doctors into cartoon villains and Semmelweis into a saint of Modernity. It implies germ theory was obvious and they were just stubborn. It flatters us ("We know he was right").

  **The Rewrite Strategy:**
  Focus on the *paradigm*, not the person. Why did handwashing make no sense then? (Miasma theory, lack of microscopes).
  **Draft (88 words):**
  > "In 1847, Ignaz Semmelweis reduced fever deaths in Vienna by requiring staff to wash hands. His colleagues rejected the practice. Without germ theory, dirt was visible, but 'invisible particles' were not. To them, a gentleman's clean hands were trustworthy; chemical washing implied they were dirty. Semmelweis's data clashed with the medical logic of his day. He died in an institution in 1865. Years later, Pasteur's germ theory provided the mechanism Semmelweis lacked. His success was real, but the reason remained invisible to his peers."

  **Why this works:** It keeps the tragedy but removes the smugness. The doctors aren't stupid; they are operating on different data.

  ### Application 2: The Twelve-Foot Timeline
  **Diagnosis:** **Fail (Inevitability Check).**
  **The Hard Truth:** A linear timeline is inherently Whiggish. It implies time moves in one direction toward *this* moment. You cannot fix this with text alone.
  **The Fix:** You must disrupt the visual linearity or the content density.
  **Procedure:**
  1.  **Keep the line** (School groups need anchors).
  2.  **Add "Dead Ends" visually.** For every 3 "Success" milestones, place 1 "Dead End" or "Controversy" marker on the line.
      *   *Example:* Lister Antiseptics (Success) vs. Lobotomy Peak (Controversy).
  3.  **Label the gaps.** Instead of just dates, use era headers that describe the *question*, not the answer.
      *   *Bad:* "The Age of Bacteria."
      *   *Good:* "Debating the Cause of Disease."
  4.  **The "Cost" Footnote.** At the end of the timeline, add a 40-word capstone: *"Timelines show what happened. They rarely show what was tried and failed, or who paid the price for success. This line is a record of survival, not the whole story."*

  **Verdict:** It stays, but it must be visually punctured. Do not let it be a clean march.

  ### Application 3: The Flat-Earth Panel (The Myth-Bust)
  **Diagnosis:** **Fail (Agency/Smugness Check).**
  **The Hard Truth:** You are right to worry. "No, they didn't think that!" is often just "We are smarter than them." It creates a binary: Enlightened Us vs. Deluded Them. It implies progress is the correction of stupidity.
  **Why you like it:** It's clear, punchy, and feels like a service to the public.
  **Why it's Whig:** It defines the past by its error and the present by its correction.

  **The Fix:**
  Shift from *correcting them* to *explaining evidence*.
  **Draft (85 words):**
  > "Did medieval scholars think the earth was flat? No. Educated Europeans since the Greeks knew the earth was spherical. They calculated its circumference using shadows and stars. So why the myth? In the 19th century, writers invented the 'flat earth' story to make the past look darker and the present brighter. We don't know the earth is round because we are smarter; we know because we have different tools. History isn't a march from stupid to smart. It's a change in how we ask questions."

  **Verdict:** This is the version you run. It keeps your "No" but attacks the *origin of the myth* (19th-century Whiggism) rather than attacking medieval people. It turns the panel into a meta-commentary on history itself.

  ### Application 4: The Local Surgeon (The Flag)
  **Diagnosis:** **STOP. Values Call.**
  **The Issue:** 1930s Surgical Pioneer + Non-Consensual Patients.
  **Why the Procedure Stops:**
  *   **Step 1 (Agency):** You can explain the agency ("Consent was not standard practice").
  *   **Step 4 (Cost):** You can identify the loser ("Patients lost autonomy").
  *   **Step 5 (Ceiling):** This is where it breaks. This is not a question of *historical framing*; it is a question of *institutional ethics*.
      *   If you highlight the technique, do you honor the abuser?
      *   If you highlight the abuse, do you erase the medical contribution?
      *   If you balance them in 90 words, will the family (if alive) or the local paper accuse the museum of defamation or revisionism?

  **Action:**
  Do not write this panel. Submit a **Red Flag Memo** to the Director and Advisory Board.
  **Text of Memo:**
  > "Panel [X] involves a local figure with significant medical contributions and documented ethical violations by modern standards (lack of consent). Historical context explains the norms, but does not resolve the moral conflict. Presenting this requires a values judgment on how the museum weighs 'advancement' against 'harm.' This exceeds the historical drafting protocol and requires Board policy direction."

  **Why:** If you write it, you own the controversy. If the Board directs the tone, they own the controversy. Your procedure correctly identifies this as outside your pay grade.

  ### Summary of Your Home-Made Distinctions
  *   **The Martyr Frame:** **Real.** It is Whig history with a victim. It simplifies structural conflict into personal virtue.
  *   **The "They Almost Got It" Habit:** **Real.** This is "teleological" history. It treats past people as incomplete versions of us.
  *   **The Myth-Busting Move:** **Real Risk.** It often defaults to "Smart Us, Dumb Them." It must be reframed as "Different Evidence," not "Better Brains."
  *   **The Swap Test:** **Valid.** If the text reads the same regardless of who won, you are writing destiny, not history. Refinement: Ask "Does this sentence make sense if the 'wrong' side had won?" If yes, rewrite.
  *   **The "Honest Version Costs More" Rule:** **Critical.** In 90 words, you cannot solve complex history. Your job is to not lie, not to tell the whole truth. Simplify the claim, do not simplify the reality.

  **Final Advice:**
  Your historian is sighing because they see the nuance you're forced to cut. Your Director is signing off because they want no fights. Your procedure protects you by making the *constraints* the villain. When you send the "Values Call" memo or the "Complexity Ceiling" note, you aren't saying "I can't write history." You're saying "The format prevents historical accuracy." That is a design problem, not a history problem. Let them solve it.
