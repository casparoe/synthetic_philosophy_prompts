answer: |-
  This is a classic problem in applied ethics: the gap between *semantic accuracy* (what the words mean) and *pragmatic uptake* (what the listener hears). In the literature, this is the difference between *saying* and *implicating*. Philosophers love to argue that lying is worse than misleading because lying corrupts the language itself, while misleading just exploits context.

  But in your setting—asymmetric information, high stakes, low time—that distinction is dangerous. A patron doesn't care about the integrity of the English language; they care about whether their water is safe or their house floods. If you mislead them with a technical truth, the harm is identical to a lie, but you feel cleaner.

  Here is a decision procedure designed for your volunteers. It ignores the moral status of the *speaker* and focuses entirely on the safety of the *listener*.

  ### The "Patron Safety Check" (3 Steps)

  Print this on a card for the table. Volunteers run these tests in order. If any test fails, they stop and call you.

  **Step 1: The Fact Check**
  *   **Question:** Is every word I am about to say strictly true based *only* on the paper in front of me?
  *   **Pass:** Yes. I can point to the words on the page that back me up.
  *   **Fail:** No. I am using outside knowledge, guessing, or assuming.
  *   **Action:** If Fail, **STOP**. Do not speak. Call the Lead Volunteer.

  **Step 2: The Translation Check**
  *   **Question:** If I say this, will they understand it exactly the way a specialist would?
  *   **Pass:** Yes. The words mean the same thing to them as they do to me (e.g., "Total Due," "Date").
  *   **Fail:** No. The words are technical or slippery (e.g., "Normal," "Certified," "Safe," "Approved").
  *   **Action:** If Fail, go to Step 3.

  **Step 3: The Risk Check**
  *   **Question:** If they act on what they *think* I mean (not what I *say*), could they get hurt, lose money, or lose housing?
  *   **Pass:** No. The stakes are low (e.g., choosing a library book, understanding a late fee).
  *   **Fail:** Yes. The stakes involve health, legal status, or major finance.
  *   **Action:** If Fail, **STOP**. Do not speak. Call the Lead Volunteer.

  ***

  ### Where the Procedure Hands Off to You
  The procedure tells the volunteer when to shut up. It does not tell them what to do next. That is your "values call."
  *   **When they call you:** The volunteer has identified a gap between *literal truth* and *safe understanding*.
  *   **Your job:** You must decide whether to bridge that gap (by explaining the nuance, which risks giving advice) or deflect it (by refusing to interpret, which risks leaving them confused). This is where you balance the library's liability rules against your duty of care. The procedure cannot solve this; it only flags it.

  ***

  ### Distinctions Dropped (and the Cost)
  To make this short enough for a 2-minute interaction, I cut three philosophical distinctions. You need to know what you're losing.

  1.  **Intent vs. Impact:** Philosophy cares if you *meant* to deceive. This procedure doesn't. If the patron walks away with a dangerous false belief, it doesn't matter if you were trying to be helpful.
      *   *Cost:* Volunteers may feel unfairly blamed for accidents. You will need to reassure them that "Stopping" is a success, not a failure.
  2.  **Lying vs. Misleading:** The procedure treats a "technically true but misleading" statement the same as a lie if the Risk is high.
      *   *Cost:* You lose the moral comfort of knowing you "didn't lie." In this context, that comfort is a liability.
  3.  **Knowledge vs. Advice:** The procedure assumes that correcting a misunderstanding *is* advice.
      *   *Cost:* You cannot use your expertise to fix the document. You can only flag that the document is unsafe to interpret quickly.

  ***

  ### Running the Cases

  Here is how the **Patron Safety Check** handles your three scenarios.

  #### Case 1: The 82-Year-Old's Lab Printout
  *   **Step 1 (Fact):** Pass. The paper says "Within normal limits." You are reading the paper.
  *   **Step 2 (Translation):** **Fail.** To you, "normal" means "within the reference range provided." To him, "normal" means "I am healthy." These are not the same, because the range is wrong for his age.
  *   **Step 3 (Risk):** **Fail.** Acting on the belief "I am healthy" could delay medical treatment.
  *   **Result:** **STOP. Call the Lead Volunteer.**
  *   **The Uncomfortable Truth:** You cannot say "It looks normal." Even though *you* know the number is likely fine for an 82-year-old, the document is technically defective. Confirming it validates the wrong reference range. The procedure forces you to withhold reassurance, which feels unkind, but protects you from validating bad data.

  #### Case 2: The Water Filter Certification
  *   **Step 1 (Fact):** Pass. The box has a mark. It is "certified."
  *   **Step 2 (Translation):** **Fail.** To you, "certified" means "meets the specific standard in the fine print." To her, "certified" means "safe for lead."
  *   **Step 3 (Risk):** **Fail.** Drinking leaded water causes permanent harm.
  *   **Result:** **STOP. Call the Lead Volunteer.**
  *   **The Uncomfortable Truth:** This is the case you suspected. Saying "It's certified" is literally true, but in this context, it is **worse than a lie**. If you lied and said, "No, don't buy that," she would be safe. If you tell the technical truth, she buys it and gets poisoned. The procedure forbids the "technically true" phrase because the Risk Check overrides the Fact Check. You are not allowed to use precision to wash your hands of the outcome.

  #### Case 3: The Flood Map Email
  *   **Step 1 (Fact):** Pass. You can write two true sentences about the map.
  *   **Step 2 (Translation):** **Fail.** You cannot control how the nephew skims it. You cannot clarify tone or nuance in a forwardable email.
  *   **Step 3 (Risk):** **Fail.** Buying a house in a flood zone is a major financial risk.
  *   **Result:** **STOP. Call the Lead Volunteer.**
  *   **The Uncomfortable Truth:** You cannot help this regular. The "no follow-up" constraint of email means you cannot ensure the Meaning Check passes. The procedure forces you to refuse a favor to a loyal patron to avoid liability for a third party you'll never meet.

  ***

  ### What This Procedure Cannot Do

  1.  **It Cannot Fix Systemic Lies:** It stops you from repeating the document's error, but it doesn't correct the document. The 82-year-old still has a printout with the wrong range. The procedure manages *your* speech, not *their* reality.
  2.  **It Cannot Soothe Anxiety:** When you say "I can't answer that," the patron often hears "Something is wrong." The procedure creates a silence that feels like bad news. You will need a script for the handoff (e.g., "This document is too complex for a quick check, and I want to make sure you get the right answer").
  3.  **It Cannot Distinguish Malice from Incompetence:** Whether the water filter company *meant* to mislead or was just sloppy doesn't matter. The Risk Check treats them the same.

  ### Summary for Your Volunteers
  Tell them this: *"Our job isn't to be right. Our job is to make sure they don't leave here more vulnerable than when they arrived. If the words on the page don't match the words in their head, and money or health is on the line, we don't guess. We pause."*

  This shifts the metric from "Did I tell the truth?" to "Did I prevent harm?" In your specific context, that is the only distinction that holds water.
