  ## The Scoring Key (Decision Logic)

  Your answers map to one of ten **Leaves**. Find the pattern that best matches your profile. (Note: Real humans are messy; match the *weight* of your answers to the Signature below).

  **Leaf 1: The Extinguisher (Strict Negative Utilitarianism)**
  *   **Signature:** Q1=A, Q5=A or C, Q7=A.
  *   **Extinction Verdict:** Entails Extinctionism (Press the button).
  *   **Awkward Commitment:** Must endorse destroying a happy world if it contains even a single headache.

  **Leaf 2: The Lexical Minimizer (Negative-Leaning Consequentialism)**
  *   **Signature:** Q1=B, Q5=A, Q7=A, Q4=B.
  *   **Extinction Verdict:** Rejects Extinctionism (Happiness below threshold matters).
  *   **Awkward Commitment:** Must accept that a billion mild headaches can never justify preventing one torture, even if the headaches are eternal.

  **Leaf 3: The Symmetric Aggregator (Classical Utilitarianism)**
  *   **Signature:** Q1=B, Q5=B, Q4=C.
  *   **Extinction Verdict:** Rejects Extinctionism.
  *   **Awkward Commitment:** Must accept that enough mild pleasure can morally offset a torture session. *(Note: This view technically violates the starting premise but is included as a control).*

  **Leaf 4: The Person-Affecting Asymmetrist**
  *   **Signature:** Q1=B, Q4=B, Q5=B or A.
  *   **Extinction Verdict:** Rejects Extinctionism (Harms existing people).
  *   **Awkward Commitment:** Must accept that creating a happy child is morally neutral, while creating a suffering child is bad.

  **Leaf 5: The Rights-Bound Sufferer (Hybrid Deontic)**
  *   **Signature:** Q1=B, Q5=A, Q7=B.
  *   **Extinction Verdict:** Rejects Extinctionism (Violates rights).
  *   **Awkward Commitment:** Must let greater aggregate suffering occur rather than violate one person's boundary, even if that person is the only cause of the suffering.

  **Leaf 6: The Hedonic Illusionist**
  *   **Signature:** Q2=A (Dominant), Q1=B.
  *   **Extinction Verdict:** Rejects Extinctionism (Illusion can fix it).
  *   **Awkward Commitment:** Must endorse wiring heads into "experience machines" if it eliminates the sensation of pain.

  **Leaf 7: The Causationist**
  *   **Signature:** Q6=B or C (Dominant), Q1=B.
  *   **Extinction Verdict:** Rejects Extinctionism (Nature is not an agent).
  *   **Awkward Commitment:** Must treat a wolf eating a rabbit as morally distinct from a human kicking a rabbit, even if the rabbit feels the same pain.

  **Leaf 8: The Consent Sovereign**
