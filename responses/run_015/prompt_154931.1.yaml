  ## Where The Instrument Fails

  No quiz perfectly maps moral topology. Be aware of these blind spots:

  1.  **Steep Prioritarianism vs. Lexical Thresholds (Leaf 2 vs. Leaf 9)**
      *   *Failure:* A view that weights suffering exponentially (Prioritarianism) will answer almost identically to a Lexical view (Threshold) on finite cases.
      *   *Separation:* This tree cannot separate them. You would need a case involving *infinite* durations or transfinite numbers to distinguish "very heavy weight" from "infinite weight."
      *   *Confidence:* Low. These are functionally identical for policy.

  2.  **Experiential vs. Preference Suffering (Outside Q2)**
      *   *Failure:* Except for the False Recovery case (Q2), this quiz assumes suffering is phenomenological. A preference-based view (frustration of desires) might answer Q1, Q3, and Q4 differently but land in the same Leaf.
      *   *Separation:* Requires a case where an agent suffers phenomenologically but prefers the state (e.g., religious martyrdom).
      *   *Confidence:* Medium. Most suffering-focusers are hedonists, but not all.

  3.  **Occupancy Confidence**
      *   **Leaf 1 (Strict NU):** Widely defended in theory, rarely in practice.
      *   **Leaf 2 (Lexical):** Widely defended (e.g., many in the S-risk community).
      *   **Leaf 3 (Classical Util):** Widely defended (but violates starting premise).
      *   **Leaf 4 (Person-Affecting):** Widely defended.
      *   **Leaf 5 (Deontic Hybrid):** Defended by a handful.
      *   **Leaf 6 (Illusionist):** Defended by a handful (Nozick-style objections usually kill this).
      *   **Leaf 7 (Causationist):** Defended by a handful (Common in intuitive morality, rare in explicit ethics).
      *   **Leaf 8 (Consent):** Defended by a handful (Libertarian-adjacent).
      *   **Leaf 9 (Tail-Risk):** Defended by a handful (Longtermist S-risk focus).
      *   **Leaf 10 (Non-Aggregator):** Defended by a handful (Contractualists).
      *   **Unoccupied Cells:** I am confident these are empty.

