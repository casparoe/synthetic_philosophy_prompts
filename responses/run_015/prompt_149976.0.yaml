answer: |-
  Here is the mapping you asked for, applied directly to the mechanics of the Truth and Reconciliation Commission (TRC), followed by the stress test on your two concepts.

  ### Part 1: Mapping the Duty (Margalit)
  Avishai Margalit, in *The Ethics of Memory*, argues that memory is a moral duty grounded in "thick relations" (family, community, shared history) rather than "thin relations" (humanity at large). He distinguishes sharply between *history* (factual record) and *memory* (caring about the past).

  *   **Who owes the duty?**
      For Margalit, the primary duty-bearers are the community members bound by thick relations. The TRC complicated this by making the **State** the primary agent of memory. Margalit would argue the State cannot truly "remember" in the moral sense; it can only record. Therefore, the duty falls on the **survivors and the broader community** to maintain the emotional weight of the events. The perpetrators owe a duty of repentance, but not necessarily memory; the children owe a duty of "second-order memory" (remembering that their parents suffered), but not the memory itself.
  *   **What is the object of the duty?**
      Not the facts (the "what"), but the **wrongness** and the **suffering** (the "how it felt"). Margalit would argue that a transcript of a torture session is history. The *memory* is the shared outrage and grief regarding that session. The TRC's focus on "full disclosure" targets facts. Margalit would say this misses the moral object unless the disclosure generates communal care.
  *   **What counts as discharging it?**
      A televised hearing plus a transcript is **not** remembering; it is archiving. For Margalit, discharging the duty requires active engagement. If the transcript sits in a database and no citizen organizes their moral life around it, the duty is failed. The TRC hearings were a **ritual of memory**, but if the ritual becomes a substitute for ongoing care (i.e., "we watched it, so we're done"), it is actually a mechanism for *stopping* memory. Margalit would likely view the TRC as a successful historical project but a precarious moral one, because it outsourced the duty to a commission rather than embedding it in daily relations.

  ### Part 2: Mapping the Forgetting (Rieff)
  David Rieff, in *In Praise of Forgetting*, argues that collective memory is often a weapon that sustains conflict. He suggests that peace sometimes requires letting go of the demand for justice and memory.

  *   **Was memory weaponized?**
      In the TRC, memory was weaponized **against impunity**, but Rieff would argue it was also weaponized **against peace**. By forcing public confession, the TRC kept the wounds raw for the duration of the hearings. However, because it traded memory for amnesty, it effectively **defanged** the memory. It allowed the facts to be known but removed the legal teeth (prosecution).
  *   **Was engineered forgetting the survival mechanism?**
      Yes. The TRC was a machine for **selective forgetting**. It remembered the *acts* but forgot the *guilt* (in a legal sense). Rieff would argue this was the only thing that made the country survivable. If the Nuremberg model (prosecution) had been applied, the apartheid security apparatus likely would have launched a counter-insurgency, causing civil war.
  *   **Is this a defense of Rieff or a problem for him?**
      It is a **qualified defense**. It supports Rieff's pragmatic claim that justice often threatens peace. However, it challenges his pessimism about memory. The TRC showed that memory *could* be institutionalized without immediate violence, provided it was bounded by amnesty.
      *   *Contrast with Spain:* Spain's post-Franco "Pact of Forgetting" was a blanket silence (no truth, no justice). The TRC was (truth, no justice). Rieff might prefer the Spanish model as a cleaner break, but the TRC suggests that *some* memory is required to legitimize the new state. The TRC proves Rieff right that legal accountability had to be dropped, but wrong that memory itself had to be suppressed. It was memory *without* vengeance.

  ### Part 3: Pushing the Theories (Your Concepts)

  Here is where both philosophers go silent. They assume memory is a state of mind held by people. The TRC treats memory as a system architecture problem.

  #### 1. Archive Substitution
  *The intuition: The state keeps the data; the people drop the load.*

  *   **Is this remembering?**
      *   **Margalit:** No. He explicitly distinguishes memory from history. An accessible archive is **data retention**. If no living person feels the sting of the injustice, the moral duty is unfulfilled. For Margalit, memory is a verb, not a noun. If the archive is consulted only by specialists, the "thick relation" has thinned out. The duty to remember has been outsourced to a server, which cannot bear moral weight.
      *   **Rieff:** He would call this a successful **quarantine**. If the archive exists but doesn't drive political violence, it is safe. He would argue that "archive substitution" is the ideal endpoint: the data is preserved for historians, but it no longer functions as a grievance for the living.
  *   **The Gap:** Neither handles the **latency** of the archive. Margalit assumes memory is hot (emotional); Rieff assumes memory is contagious (dangerous). Neither accounts for "cold storage" memory—data that is accessible but inert. The TRC bet on cold storage: *We will keep the record so you don't have to carry the grudge.* Margalit says this fails the duty; Rieff says this saves the peace. Both miss that an archive can be weaponized later (e.g., by a future populist regime digging up files), a risk neither theorizes well.

  #### 2. The Witness Horizon
  *The intuition: Memory changes when the last first-hand observer dies.*

  *   **Does the duty transfer or lapse?**
      *   **Margalit:** He argues for "chain of memory." When the witnesses die, the duty transfers to the community to remember *the witnesses*. However, he admits this degrades. Thick relations require shared life. You cannot have a thick relation with a dead stranger. At the witness horizon, the duty **lapses** into history. The TRC tried to bridge this by recording testimony, but Margalit would say the *moral* duty dies with the victims. The survivors' children owe respect, not memory.
      *   **Rieff:** He argues memory *should* lapse. He views the insistence on remembering past atrocities by generations that didn't experience them as a form of neurosis. The witness horizon is the **natural expiration date** of grievance.
  *   **TRC Success or Failure?**
      The TRC was explicitly designed to race the witness horizon. It assumed that **recorded memory** could substitute for **living memory**.
      *   *By Margalit's standard:* Likely a **failure**. The archive remains, but the "thick relation" is gone. The new generation views apartheid as history (like the Anglo-Boer War), not as a moral wound they inhabit.
      *   *By Rieff's standard:* A **success**. The transition from living memory to recorded memory allowed the grievance to cool. The fact that the last witness is dying without sparking a new wave of retribution proves that engineered forgetting worked.
  *   **The Gap:** Both assume the "thing remembered" is stable. The TRC shows it isn't. Living memory is high-fidelity but volatile (dies with the witness). Archive memory is low-fidelity (context is lost) but persistent. The TRC assumed you could migrate from volatile to persistent storage without data loss. Both philosophers ignore the **migration cost**. Margalit ignores that living memory is unsustainable; Rieff ignores that recorded memory can be reactivated.

  ### Verdict on Your Hunch

  Your hunch is correct: **Both views assume a stable population of rememberers and a stable object of memory.**

  *   **Margalit** assumes a community that persists over time with enough overlap to pass the "thick relation" down. He doesn't account for radical political breaks (like 1994 SA) where the community is reconstituted.
  *   **Rieff** assumes memory is a psychological burden on a continuous group. He doesn't account for institutional memory (archives) that exists independently of the group's psychology.

  The TRC exposes a blind spot in the philosophy of memory: it treats memory as **infrastructure**. The TRC wasn't just about ethics or psychology; it was about building a system that could survive the death of its users.

  *   **Where Margalit goes silent:** He has no theory for **institutional duty**. Can a state owe a duty to remember? He says no, only people can. But the TRC made the state the rememberer.
  *   **Where Rieff goes silent:** He has no theory for **archival risk**. He worries about memory fueling violence, but doesn't fully grapple with the fact that an archive can be a loaded gun left in the drawer for the next generation to find.

  **Engineering Translation:**
  Margalit treats memory like **RAM**: it needs power (attention/care) to exist, and if power cuts (death/disinterest), the data is gone.
  Rieff treats memory like **Malware**: it consumes resources and crashes the system; sometimes you need to wipe the drive to keep the OS running.
  The TRC tried to write the data to **Read-Only Optical Storage** (the Archive) and tell the RAM it's safe to clear.

  Your "Archive Substitution" critique hits the exact point where the philosophy breaks. Margalit would say you can't store ethics on optical media. Rieff would say as long as the drive isn't spinning, it's fine. Neither explains what happens when the next OS tries to read the disk. The TRC is the test case where the assumption of "stable memory" broke, and neither philosopher fully equipped us to judge the outcome.
