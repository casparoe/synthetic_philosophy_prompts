      *   *Philosophical Commitments:*
          *   **Causation:** Physicalism, locality, light-cone restriction. Causes must precede effects in a relativistic sense.
          *   **Agency:** Control. To be an agent is to *make a difference*. If my choice doesn't causally influence the outcome, did I really choose?
          *   **Rationality:** Maximizing expected utility based on *causal* leverage.
          *   **Epistemology:** Skepticism towards logical correlation without causal mechanism. "Magic" vs. "Mechanism."
      *   *CDT vs. FDT/EDT:* CDT says "choose the action that causes the best outcome." FDT (Functional Decision Theory) says "choose the output of your decision algorithm that yields the best outcome, even if correlated logically." The dismissal is largely CDT hegemony.
      *   *Agency & Light Cones:* Yes, there's a deep assumption that agency = causal intervention. If I can't wiggle the universe physically, I'm not acting.
      *   *Rebuilding the Framework:*
