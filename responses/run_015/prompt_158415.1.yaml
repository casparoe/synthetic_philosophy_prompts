      *   **Core Question 2:** Is it just Causal Decision Theory (CDT) baked in, or does it assume agency requires changing outcomes within one's light cone?
      *   **Core Question 3:** If we took acausal cooperation seriously (e.g., coordinating with copies in other runs), what parts of the standard rational-choice framework would need rebuilding?

  2.  **Initial Analysis & Brainstorming:**

