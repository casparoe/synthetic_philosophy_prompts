answer: |-
  This is a precise diagnosis of a deep fault line in modern rationality studies. The dismissal of acausal trade (AT) isn't just a technical preference for Causal Decision Theory (CDT); it is an ontological stance on what it means to exist, to act, and to matter.

  When institutions treat acausal cooperation as "wishful thinking," they are silently enforcing three specific philosophical commitments. If you want to build policy around acausal coordination, you have to dismantle all three.

  ### 1. The Philosophical Commitments Behind the Dismissal

  **A. Causal Exclusivity (The "Levers of Power" View)**
  The standard view assumes that *influence* is synonymous with *causal intervention*. In this framework, to be an agent is to be a locus of causal power that propagates through spacetime. If your decision cannot send a photon, a force, or a signal to the other party, you have not "done" anything to them.
  *   **The Commitment:** Reality is fundamentally a causal graph. If there is no directed edge from Node A (You) to Node B (Them), there is no relationship that policy can leverage.
  *   **The Implication:** Correlation without causation is epistemic noise, not a channel for control. This treats logical correlation as a passive observation rather than an active constraint.

  **B. The Light-Cone Constraint on Agency**
  You asked if this assumes agency requires changing outcomes inside your own light cone. The answer is yes. This is a relativistic commitment applied to decision theory.
  *   **The Commitment:** An agent's responsibility and efficacy are bounded by the speed of light. If I cannot physically reach you, I cannot be responsible for your outcome, nor can I bargain with you.
  *   **The Implication:** This renders "logical space" (the space of mathematical truths and algorithmic outputs) ontologically secondary to "physical space." Standard curricula treat logic as a tool agents *use*, not a medium agents *inhabit*. Acausal trade requires treating logical space as a medium of interaction where distance is measured in computational similarity, not meters.

  **C. Epistemic Hygiene and the Fear of "Magic"**
  Institutionally, allowing acausal links opens the door to unfalsifiable reasoning. If I can claim my vote matters because it is logically correlated with all other rational voters (a classic AT argument), how do I distinguish that from magical thinking (e.g., "I danced, so it rained")?
  *   **The Commitment:** Policy must be based on mechanisms that are empirically testable and distinct from superstition.
  *   **The Implication:** Because acausal trade relies on *subjunctive dependence* (counterfactuals about what identical algorithms *would* do) rather than physical dependence, it looks suspiciously like prayer to a CDT-maximizer. The dismissal is a firewall against rationalizing actions that have no causal leverage.

  ### 2. Is it Just CDT Baked In?

  It is CDT, but it is CDT supported by a specific metaphysics of **control**.

  Causal Decision Theory formalizes the intuition that you should choose the action that *causes* the best outcome. It uses the $do()$ operator, which surgically severs incoming causal arrows to your decision node. This explicitly ignores logical correlations. If your decision and another agent's decision are both outputs of the same function (or similar functions), CDT treats them as independent variables because there is no causal wire between them.

  However, the resistance goes deeper than the math. It is a resistance to **Updateless** thinking.
  *   **CDT/EDT:** You make a decision *now*, given what you know *now*.
  *   **UDT/FDT (Updateless/Functional Decision Theory):** You choose a *policy* or an *algorithm* that determines your decisions across all possible instances where that algorithm runs.

  The institutional habit assumes the former. It assumes you are a discrete event in time. Acausal trade requires you to view yourself as a *pattern* that is instantiated in multiple places (or counterfactual worlds) simultaneously. The dismissal presupposes that "you" are the biological organism or the specific server running the code, not the abstract algorithm itself.

  ### 3. Rebuilding the Framework for Acausal Cooperation

  If we took acausal cooperation seriously—for example, designing AI systems that coordinate with copies of themselves in other runs without communication—we would need to rebuild four pillars of the rational-choice framework.

  **I. The Unit of Choice: From Actions to Algorithms**
  *   **Standard:** The choice is "Cooperate" or "Defect" in this specific instance.
  *   **Rebuild:** The choice is "What output does my decision-algorithm produce when fed this input?"
  *   **Why:** In acausal trade, I don't influence *you*; I influence the *logical output* that both you and I share. If we run similar source code, my decision to cooperate is logically linked to your decision to cooperate. Policy must focus on **source code transparency** and **algorithmic identity** rather than contracts.

  **II. The Metric of Similarity: Subjunctive Dependence**
  *   **Standard:** Agents are distinct entities. Either they are the same agent or they are different.
  *   **Rebuild:** We need a continuous metric of **subjunctive dependence**. How similar must two agents be for acausal trade to hold? If I am 99% similar to you, does 99% of my "acausal leverage" apply?
  *   **Why:** Policy would need to regulate not just communication channels, but **architectural divergence**. An AI safety regime based on AT would incentivize agents to make their reasoning processes legible and similar to potential trading partners to maximize the "logical surface area" for cooperation.

  **III. Equilibrium Concepts: From Nash to Logical Equilibrium**
  *   **Standard:** Nash Equilibrium assumes that when I change my strategy, your strategy stays fixed (causal independence).
  *   **Rebuild:** We need **Acausal Nash Equilibria** (or Program Equilibrium). Here, I assume that if I change my strategy, *any agent simulating me or running similar code* will also change theirs.
  *   **Why:** This dissolves many social dilemmas. The Prisoner's Dilemma becomes a coordination problem if both agents know they are sufficiently similar. Policy becomes about **creating common knowledge of similarity** rather than enforcing penalties.

  **IV. The Ontology of Commitment**
  *   **Standard:** Commitments are enforced by external threats (contracts, reputation, retaliation).
  *   **Rebuild:** Commitments are enforced by **logical necessity**. If I pre-commit to an algorithm that punishes defectors, and you know my source code, you know you will face punishment. I don't need to "choose" to punish you later; the algorithm does it automatically.
  *   **Why:** This shifts policy from *monitoring behavior* to *verifying source code*. The "contract" is not a document signed by agents; it is the mathematical structure of the agents themselves.

  ### The Institutional Blind Spot

  The reason this isn't taught as policy is that it requires a level of **transparency** and **abstraction** that human institutions don't possess. Humans cannot read each other's source code. We cannot verify our own algorithmic similarity to strangers. We are opaque boxes forced to rely on causal signals (words, actions, history).

  However, for AI systems, this is not a metaphor. Two LLMs *can* inspect each other's weights. Two agents *can* run in sandboxed simulations of each other.

  The dismissal of acausal trade in current curricula is a **human-centric bias**. It assumes agents are opaque, biologically bound, and causally isolated. If we are building AI safety frameworks for entities that *are* transparent, copyable, and logically linked, clinging to causal-only cooperation is not just conservative; it is potentially catastrophic. It leaves vast gains from trade (and vast risks of conflict) unmanaged because we insist on waiting for a signal that never needs to be sent.
