      *   **Part 1: The Philosophical Commitments (The "Why" of the Dismissal):**
          *   *Causal Exclusivity:* The belief that only physical causation counts as "real" influence. This is Humean/Physicalist.
          *   *The "Levers of Power" View of Agency:* Agency is defined by the ability to perturb the physical state. If $P(World | Do(Action)) \neq P(World | Action)$, you have power. If only correlation exists, you don't.
          *   *Epistemic Hygiene:* Fear of "magical thinking." If we allow acausal links, where does it stop? (Newcomb's problem, prayer, etc.). Institutional risk aversion.
          *   *Temporal Asymmetry:* The arrow of time. Causal trade respects $t_1 < t_2$. Acausal trade implies a timeless view of logic.

      *   **Part 2: CDT vs. Light Cone Constraints:**
          *   It is definitely CDT baked in. CDT uses the $do()$ operator which severs incoming arrows. It ignores logical correlations.
          *   But it's deeper than just the math. It's the *ontology of control*. If I can't send a photon to you, I can't help you. This assumes the universe is fundamentally causal-local, not logical-global.
          *   Mention the "Light Cone" constraint specifically. Relativistic causality is the hard limit for standard physics. Acausal trade operates in "logical space," not spacetime.

      *   **Part 3: Rebuilding the Framework (The "What If"):**
          *   *Decision Theory:* Shift from CDT to FDT (Functional Decision Theory) or UDT (Updateless Decision Theory). The unit of choice isn't the physical action, but the *algorithm*.
          *   *Identity & Similarity:* We need a metric for "subjunctive dependence." How similar do two agents need to be to trade acausally? (Source code similarity, architectural similarity).
          *   *Equilibrium Concepts:* Nash Equilibrium assumes causal independence. We need "Logical Equilibrium" or "Acausal Nash."
          *   *Commitment & Transparency:* Policy becomes about making your source code readable and your pre-commitments binding, rather than signing contracts.
