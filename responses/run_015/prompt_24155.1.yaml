answer: |-
  You have put your finger on the single most contentious logical problem in the modern definition of death. You are correct: the declaration of death is not a simple observation of a current static state (like "the heart is still"); it is a **modal claim** about the future behavior of the organism under specific conditions.

  Here is the conceptual picture, the nearest established terms, and how to map the edges of this phenomenon.

  ### 1. The Nearest Established Concept: *Permanence vs. Irreversibility*
  In contemporary bioethics (specifically in the literature surrounding Donation after Circulatory Death, or DCD), the distinction you are describing is formalized as the difference between **permanence** and **irreversibility**.

  *   **Irreversibility:** The function *cannot* be restored, even with intervention. This is a claim about physiological impossibility.
  *   **Permanence:** The function *will not* be restored, typically because intervention will not be attempted. This is a claim about the future trajectory given current decisions.

  Your intuition is correct that these are often conflated. When a clinician declares death based on circulatory criteria after five minutes of asystole, they are technically relying on **permanence**. The heart *could* often be restarted (it is not yet physiologically irreversible), but it *will not* be (because resuscitation efforts have ceased).

  However, your point goes deeper than this distinction. You are noting that *even* "irreversibility" is a prediction. To say a brain is "irreversibly" damaged is to say, "If we were to try to fix this, it would not work." That is a **counterfactual conditional**.

  ### 2. The Philosophical Category: *Dispositional Properties*
  If you want the philosophical name for the logical move you identified, it is the treatment of death as a **dispositional property** rather than a **categorical property**.

  *   **Categorical Property:** A state that exists independently of what might happen to it. (e.g., "This vase is broken." It is in pieces now.)
  *   **Dispositional Property:** A state defined by how the object *would* behave under certain conditions. (e.g., "This sugar is soluble." It is soluble *now*, even while sitting dry in a bowl, because *if* it were put in water, it *would* dissolve.)

  When we declare someone dead based on brain criteria, we are treating death as a **disposition**. We are saying the organism has lost the *capacity* for function. But "capacity" is not something you can touch or see in the present moment; it is a claim about what *would* happen if you stimulated the system. You are identifying that bioethics treats "being dead" like "being soluble"—a present truth grounded in a future counterfactual.

  ### 3. Is There a Name for This?
  There is no single, universally agreed-upon noun for this specific phenomenon, but in philosophy of medicine, it is often referred to as **The Epistemic Gap in Death Determination** or **Prognostic Ontology**.

  If you were to coin a term for your paper or discussion, the most precise label would be **Counterfactual Status Attribution**.

  This captures the two moves you identified:
  1.  **Status:** We are assigning an ontological category (Dead/Alive).
  2.  **Counterfactual:** The justification relies on a "what if" scenario (What if we intervened? What if we waited?) rather than a "what is" observation.

  ### 4. Mapping the Edges
  To understand the boundaries of this concept, consider where this logic holds and where it breaks.

  **Edge 1: Technology Relativity**
  Because "irreversibility" is a prediction based on "best available medicine," death becomes relative to technology. A person who was "irreversibly" dead in 1950 (cardiac arrest) might not be "irreversibly" dead in 2024 (defibrillation/ECMO).
  *   *The Edge:* If death is a biological state, it shouldn't change based on the tools in the room. If it *does* change based on tools, then death is not a purely biological fact but a **socio-technical status**.

  **Edge 2: The "Dead Donor Rule"**
  Organ transplantation relies on the rule that you must be dead before organs are taken. If death is a counterfactual prediction ("it won't come back"), there is a window where the patient is *declared* dead (based on the prediction) but the biology is still in flux.
  *   *The Edge:* This creates a moral tension. Are we killing the patient by removing organs, or are we harvesting from someone who is already gone? The counterfactual definition allows us to slide between these two interpretations.

  **Edge 3: Cryonics and Future Tech**
  If you define death as "irreversible loss of function," cryonicists argue that no death is truly irreversible if future nanotechnology could theoretically repair the cells.
  *   *The Edge:* If "irreversible" means "impossible by any future physics," then no one is ever dead. Therefore, "irreversible" must implicitly mean "impossible by *current* norms and technology." This confirms your suspicion: the definition is not about the body, but about our **willingness and ability to intervene**.

  ### Summary
  You have identified that the definition of death relies on **Counterfactual Status Attribution**.
  *   **Bioethically**, this is managed through the **Permanence vs. Irreversibility** distinction.
  *   **Philosophically**, this treats death as a **Dispositional Property**.
  *   **Practically**, this means death is not a moment of biological change, but a **normative judgment** that further intervention is futile or unwanted.

  The "hidden move" you sensed is the shift from **ontology** (what the patient *is*) to **prognosis** (what *will happen* to the patient). We declare the ontology based on the prognosis.
