prompt: |-
  im trying to do my own bit of reflective equilibrium for an essay on the boundary problem — who actually belongs to the demos — and ive written down my gut verdicts on who should get a vote, and i want to know what principle, if any, they add up to.

  - someone who's lived and paid tax here ten years but never took citizenship: yes, definitely
  - a citizen who's lived abroad eight years, pays no tax here and doesnt follow the news: no, even though the law still binds him if he moves back
  - a commuter who lives over the border, works here and pays income tax here: yes, i think
  - a tourist on a two week holiday: no, obviously
  - a stateless person who's been stuck here three years and can't be deported: yes, but i'm shakier about this one
  - a citizen born abroad who's never set foot here and doesn't speak the language: no — and this is the one that worries me, because it feels like it can't both survive alongside the last one
  - a sixteen year old: yes. A nine year old: no
  - someone in a persistent vegetative state: no, but I can't say why without wrecking the rest of my list
  - a company headquartered here: no, obviously
  - people downstream in another country who'd lose their homes to a dam we build: they should be consulted, but not given votes

  the principle i keep trying to make work is: you get a say just in case you're subject to the coercive power of the state. but that seems to hand a vote to the tourist, the nine year old and the woman in a coma, and it doesn't explain why i'm less sure about the stateless person than about the ten year resident. is there one principle — or two or three i have to weigh against each other — that gets most of these, stated precisely enough that i can test it, and which of my verdicts does it force me to drop? please also tell me what it says about cases i haven't listed: prisoners serving life sentences, dual citizens who vote in two countries, and people who own land here but live abroad. no reading lists, i just want the principle and where it bites.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Task:** Identify the underlying principle(s) behind the user's "gut verdicts" on the boundary problem (who belongs to the *demos*).
      *   **Input:** A list of specific cases with yes/no/maybe verdicts.
      *   **Constraint:** No reading lists. Just the principle(s) and where they bite (implications/contradictions).
      *   **Specific Questions to Answer:**
          *   What principle(s) explain most verdicts?
          *   Which verdicts must be dropped/adjusted to fit the principle?
          *   What does the principle say about unlisted cases (prisoners, dual citizens, absentee landlords)?
      *   **User's Current Hypothesis:** "Subject to coercive power of the state" (All-Subjected Principle).
      *   **User's Problem:** This hypothesis fails on tourists, children, coma patients, and doesn't explain the hesitation on the stateless person vs. long-term resident.

  2.  **Analyze the Verdicts:**
      *   *Non-citizen resident (10 yrs, tax):* **YES**. (Strong connection: residence + contribution).
      *   *Expatriate citizen (8 yrs abroad, no tax, disengaged):* **NO**. (Weak connection: legal tie only).
      *   *Cross-border commuter (lives abroad, works/pays tax here):* **YES**. (Strong connection: economic participation + tax).
      *   *Tourist (2 weeks):* **NO**. (Transient, subject to law but temporary).
      *   *Stateless person (3 yrs, stuck):* **YES (shaky)**. (Subject to law, vulnerable, but lacks formal status).
      *   *Citizen born abroad (never visited, no language):* **NO**. (Legal tie only, no actual connection). *User notes tension with stateless person.*
      *   *16-year-old:* **YES**. *9-year-old:* **NO**. (Competence/Agency threshold).
      *   *Persistent Vegetative State (PVS):* **NO**. (Lack of agency).
      *   *Company:* **NO**. (Not a human/person).
      *   *Downstream foreigners (dam impact):* **Consulted, not voted**. (Affected interests, but not members).

  3.  **Evaluate the "All-Subjected Principle" (ASP):**
      *   *Definition:* All those subject to the state's coercive laws should have a vote.
      *   *Fit:* Explains resident, commuter, stateless.
      *   *Fail:* Explains *why* tourist is no (temporary subjection?), but technically they are subject to law. Explains *why* 9-year-old/PVS is no (capacity constraint). Doesn't explain why expat citizen is no (they are subject if they return). Doesn't explain the tension between stateless (yes) and absentee citizen (no).
      *   *Conclusion:* ASP is necessary but not sufficient. It needs a "Stakeholder" or "Membership" modifier and a "Capacity" constraint.

  4.  **Develop a Better Principle:**
      *   The user's verdicts lean heavily towards **actual social membership** and **agency**, rather than just legal subjection or bloodline.
      *   *Key Theme 1: Membership/Connection.* It's about where your life is actually lived. (Resident, Commuter = Yes; Expat, Absentee Citizen = No).
      *   *Key Theme 2: Agency/Competence.* (16 = Yes, 9 = No, PVS = No).
      *   *Key Theme 3: Affected Interests vs. Membership.* (Downstream foreigners = Consulted, not voted).
      *   *Proposed Principle:* **The Principle of Actual Social Membership with Agency.**
      *   *Refinement:* Let's call it the **"Resident Stakeholder Principle"** constrained by **"Decisional Capacity."**
      *   *Core Idea:* Voting is for those who share a common fate in a specific political community *and* can participate in the dialogue.

  5.  **Test the Principle against Verdicts:**
      *   *Resident (10 yrs):* Fits (Life is here).
      *   *Expat Citizen:* Fits (Life is elsewhere).
      *   *Commuter:* Fits (Economic life is here, even if sleep is elsewhere). *Edge case.*
      *   *Tourist:* Fits (Life not here).
      *   *Stateless:* Fits (Life is here, vulnerable). *Explains the "shakiness" – lack of formal recognition vs. actual presence.*
      *   *Absentee Citizen:* Fits (No actual connection). *Resolves tension with stateless: Presence trumps Paper.*
      *   *16 vs 9:* Fits (Capacity).
      *   *PVS:* Fits (Capacity).
      *   *Company:* Fits (Not a human agent).
      *   *Downstream:* Fits (Affected but not members).

  6.  **Address the Tensions/Contradictions:**
      *   *Stateless vs. Absentee Citizen:* The user feels shaky about the stateless person but firm on the absentee citizen. The principle suggests the stateless person has a *stronger* claim because their life is actually governed day-to-day by the state, whereas the absentee citizen is only potentially governed. The principle forces the user to be *more* confident about the stateless person than the absentee citizen.
      *   *Commuter:* This is the hardest fit. If "residence" is key, commuters fail. If "tax/contribution" is key, they pass. The user said "Yes." So the principle must be "Center of Gravity of Daily Life" rather than strict sleeping location.
      *   *Tourist:* Why no? They are subject to law. Answer: Duration/Temporality. Their "center of gravity" is elsewhere.

  7.  **Formulate the Precise Principle:**
      *   Combine **Subjection** (you are ruled), **Membership** (you belong to the community), and **Agency** (you can decide).
      *   Let's synthesize: **"The Principle of Continuous Co-Authorship."**
      *   Or simpler: **"The Principle of Actual Membership and Capacity."**
      *   Let's go with a weighted dual-principle approach, as the user asked for "one principle — or two or three." A single principle often breaks. A "Primary + Constraint" model works best.
      *   *Primary:* **The All-Subjected-in-Fact Principle.** (Not just legally subject, but your life is actually shaped by the state).
      *   *Constraint:* **The Capacity Constraint.** (Must be able to exercise judgment).

  8.  **Address the Unlisted Cases:**
      *   *Prisoners (Life):* Subjected? Yes. Membership? Yes (still part of society). Capacity? Yes. *Verdict:* Vote (unless capacity impaired). *Conflict:* Many jurisdictions ban this. The principle demands they vote.
      *   *Dual Citizens:* If they live in Country A, they vote in A. If they live in Country B, they vote in B. If they split time? Both. *Verdict:* Vote where life is lived. If life is truly split, maybe both.
      *   *Absentee Landlords:* Own land, live abroad. Like the commuter but without the work/presence. *Verdict:* No. (Interests are protected by law/consultation, but they don't share the common fate of daily life).

  9.  **Drafting the Response:**
      *   *Acknowledge the User's Insight:* The "All-Subjected Principle" (ASP) is the standard starting point, but the user correctly identified its flaws (tourists, kids).
      *   *Propose the Refined Principle:* **"The Principle of Actual Social Membership constrained by Agency."**
      *   *Break it down:*
          1.  **Factual Subjection (The "Life" Test):** Is the state's coercive power a constant background feature of your daily life? (Excludes tourists, includes residents/commuters).
          2.  **Reciprocity/Stake:** Do you contribute to and draw from the cooperative scheme? (Tax, work, infrastructure).
          3.  **Agency:** Can you form and express a political will? (Excludes 9-year-olds, PVS).
      *   *Where it Bites (Forced Adjustments):*
          *   *Stateless vs. Absentee Citizen:* The principle forces you to prioritize the Stateless person. Presence > Passport.
          *   *Commuter:* Forces you to define "membership" as economic/social integration, not just sleeping location.
          *   *Prisoners:* Forces you to give them the vote (they are fully subjected and members).
          *   *Absentee Landlords:* No vote (no daily subjection).
      *   *Tone:* Analytical, direct, philosophical but accessible. No citations.

  10. **Refining the "Principle" Name:**
      *   "All-Subjected" is too broad (tourists).
      *   "All-Affected" is too broad (downstream foreigners).
      *   "All-Members" is too circular (who is a member?).
      *   Let's use **"The Principle of Continuous Co-Authorship."** You vote if you are forced to co-author the rules of the life you actually live.
      *   Actually, let's stick to the user's request for precision. Let's offer a **Two-Part Test**.
      *   Part 1: **The Permanence of Subjection.** (Is the state's authority a permanent feature of your life, not transient?)
      *   Part 2: **The Capacity for Judgment.** (Can you exercise political will?)
      *   This covers the tourist (transient), the child/PVS (capacity), and the expat (subjection is not permanent/current).

  11. **Final Review against constraints:**
      *   No reading lists? Check.
      *   State principle precisely? Check.
      *   Where it bites/forces drops? Check.
      *   Address unlisted cases? Check.

      *(Self-Correction during drafting)*: I need to make sure I address the "shakiness" on the stateless person. The principle should explain *why* that shakiness exists (lack of formal recognition) but argue why the verdict should be "Yes."
      Also, the commuter case is interesting. They sleep abroad. Why yes? Because their *economic* life is subjected. So "Subjection" isn't just "being arrested," it's "being regulated."
      The "Absentee Citizen" vs "Stateless" tension is the crux. The user feels the Stateless person is a "Yes" but shaky, and Absentee Citizen is a hard "No." This is actually consistent with a "Real Connection" principle. I need to validate that intuition.

      *Revised Principle:* **The Principle of Habitual Subjection and Agency.**
      1.  **Habitual Subjection:** The state's coercive framework is the enduring context of your daily choices (excludes tourists, includes residents/commuters/stateless).
      2.  **Agency:** You possess the cognitive capacity to form political preferences (excludes 9yo, PVS).

      *Implications:*
      *   Drops the idea that Citizenship alone grants voting rights.
