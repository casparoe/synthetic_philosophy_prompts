      *   Forces the "No" on Absentee Landlords.

      Let's write it.
answer: |-
  Your gut verdicts are more consistent than you think, but they do not fit the standard "All-Subjected Principle" (ASP) you tried to use. The ASP fails because it is binary: you are either subject to the law or you are not. A tourist is subject to the law (you can arrest them), so ASP says they vote. You say they don't.

  Your verdicts actually align with a more specific, two-part test. Let's call it **The Principle of Habitual Subjection constrained by Agency.**

  ### The Principle

  **You belong to the *demos* if and only if:**
  1.  **Habitual Subjection:** The coercive framework of the state is the enduring, unavoidable background context of your daily life and choices (not merely a temporary condition or a potential future one).
  2.  **Agency:** You possess the cognitive capacity to form, revise, and express a political will.

  ### How it fits your list

  *   **Resident (10 yrs):** Passes both. Life is here; capacity is assumed.
  *   **Expat Citizen:** Fails #1. The state is not the background context of their daily life; it is a dormant legal shell.
  *   **Commuter:** Passes #1. Even if they sleep abroad, the state regulates their income, safety, and labor for the majority of their waking life. Their "center of gravity" is here.
  *   **Tourist:** Fails #1. Subjection is transient. The state is a temporary host, not the framework of their life.
  *   **Stateless Person:** Passes #1. Like the resident, the state is the enduring context of their survival. Your "shakiness" comes from a lack of formal recognition, but the principle says their claim is just as strong as the resident's.
  *   **Absentee Citizen:** Fails #1. No daily subjection. This resolves your tension with the stateless person: **Presence trumps Paper.** The stateless person lives *under* the state; the absentee citizen lives *outside* it.
  *   **16 vs. 9 Year Old:** Fails/Passes #2. Both are habitually subjected, but the 9-year-old lacks the requisite agency.
  *   **PVS:** Fails #2. No capacity for will.
  *   **Company:** Fails #2. No human agency.
  *   **Downstream Foreigners:** Fails #1. The dam affects them, but the state's coercive framework does not structure their daily life. They are "affected," but not "members."

  ### Where the principle bites (Forced Adjustments)

  To keep this principle, you must accept the following consequences. Some will confirm your instincts; others will force you to change your mind.

  **1. You must be more confident about the Stateless Person.**
  Your list says "Yes, but shaky." The principle says "Yes, definitely." If habitual subjection is the key, the stateless person is *more* integrated than the expat citizen. They cannot leave; the state controls their very ability to exist day-to-day. To be consistent, you must treat their claim as stronger than the expat citizen's, not weaker.

  **2. You must grant votes to Prisoners serving life sentences.**
  This is where the principle bites hardest.
  *   *Habitual Subjection:* They are the most subjected people in the state. Every minute is coercively controlled.
  *   *Agency:* Unless mentally incapacitated, they retain political will.
  *   *Verdict:* **Yes.** They are co-authors of the rules that govern their confinement. Disenfranchisement creates a class of subjects with no say, which violates the core logic of your list.

  **3. Dual Citizens who live in two countries.**
  The principle is functional, not legal.
  *   If they split the year 50/50 and pay tax/work in both: **Yes to both.** They are habitually subjected to both.
  *   If they live in Country A but hold Country B's passport: **Yes to A, No to B.** Citizenship is irrelevant; life location is key.

  **4. Absentee Landlords (Own land, live abroad).**
  *   *Verdict:* **No.**
  *   *Reasoning:* Like the downstream foreigners, they are *affected* by the state (property laws, taxes), but the state is not the *habitual context* of their life. They can sell the land and leave the jurisdiction entirely without uprooting their life. They get consultation (protection of property rights), not membership.

  ### Summary of the Trade-off

  You are trying to balance **Legitimacy** (those who rule must be ruled) with **Competence** (those who rule must be able to think).

  *   **Your Current Tension:** You feel the pull of legal status (citizenship) against the pull of actual presence (residence).
  *   **The Principle's Demand:** It forces you to abandon legal status as a criterion. It argues that the *demos* is not a club you join (citizenship), but a condition you inhabit (subjection).

  If you accept **Habitual Subjection + Agency**, you save your verdicts on the tourist, the expat, and the child, but you lose the right to exclude the prisoner and you must strengthen your support for the stateless person.
