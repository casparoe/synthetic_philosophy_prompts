answer: |-
  # STANDARDIZED ASSERTION AUDIT (SAA) PROCEDURE v1.0

  **Objective:** To determine the assertibility of central empirical claims in policy briefs based on proxies for knowledge (justification), truth (accuracy), and belief (sincerity) without accessing private mental states or ground-truth databases.
  **Time Constraint:** Executable in <15 minutes per brief.
  **Outputs:**
  1.  Assertible without qualification.
  2.  Assertible only in conditional or hedged form.
  3.  Not assertible—recommend revision to a weaker claim.
  4.  Not assertible—recommend withholding publication until further evidence is available.

  ---

  ## PART I: THE EIGHT-STEP PROCEDURAL CHECKLIST

  **Step 1: Evidentiary Tier Classification**
  *   **Test:** Categorize the primary source supporting the claim.
  *   **Information Required:** Publication status (peer-reviewed, preprint, archival, oral), sample size (N), or data density.
  *   **Branching:**
      *   If Peer-Reviewed + Large N/High Density → Proceed to Step 3.
      *   If Preprint/Pilot + Small N/Low Density → Proceed to Step 2.
      *   If Oral/Archival Only → Proceed to Step 6.
  *   **Judgment Call:** None (Categorical).

  **Step 2: Methodological Transparency Check**
  *   **Test:** Verify existence of pre-registered protocol or explicit methodological constraints.
  *   **Information Required:** Manuscript text, supplementary materials.
  *   **Branching:**
      *   If Registered/Explicit → Proceed to Step 3.
      *   If Unregistered/Implicit → **Flag for Step 7 (High Risk).**
  *   **Judgment Call:** None (Binary presence/absence).

  **Step 3: Consensus and Dispute Scan**
  *   **Test:** Identify active disagreement in the cited literature or known expert community.
  *   **Information Required:** Reference list, author acknowledgments of dissent.
  *   **Branching:**
      *   If No Competing Models/Interpretations Cited → Proceed to Step 5.
      *   If Competing Models/Interpretations Cited → Proceed to Step 4.
  *   **Judgment Call:** **Required.** Referee must determine if the dissent is "fringe" (ignore) or "substantive" (proceed to Step 4).

  **Step 4: Parameter/Interpretive Sensitivity**
  *   **Test:** Assess whether the claim hinges on the disputed parameter or interpretation identified in Step 3.
  *   **Information Required:** Model description or argumentative structure.
  *   **Branching:**
      *   If Claim is Robust across parameters → Proceed to Step 5.
      *   If Claim Collapses without disputed parameter → **Flag for Step 7 (Conditional).**
  *   **Judgment Call:** **Required.** Referee must estimate sensitivity without re-running models or re-excavating sites.

  **Step 5: Warrant-Tone Alignment**
  *   **Test:** Compare the strength of the linguistic assertion (e.g., "will," "proves") against the Evidentiary Tier (Step 1).
  *   **Information Required:** Abstract and conclusion text.
  *   **Branching:**
      *   If Tone ≤ Evidence Strength → Proceed to Step 7.
      *   If Tone > Evidence Strength → **Flag for Step 7 (Revision).**
  *   **Judgment Call:** **Required.** Referee interprets semantic strength (e.g., is "suggests" weak enough for a pilot?).

  **Step 6: Corroboration Check (Non-Quantitative Claims)**
  *   **Test:** For historical/ethnographic claims, check for multi-source triangulation.
  *   **Information Required:** Cross-reference of oral, material, and documentary records.
  *   **Branching:**
      *   If Triangulated → Proceed to Step 7.
      *   If Single-Source (Oral *or* Material only) → **Flag for Step 7 (Hedged).**
  *   **Judgment Call:** **Required.** Referee weighs epistemic weight of oral history vs. material ambiguity.

  **Step 7: Assertibility Classification Matrix**
  *   **Test:** Apply flags from Steps 2, 4, 5, 6 to determine output.
  *   **Logic:**
      *   No Flags + Peer-Reviewed → **Output 1 (Assertible).**
      *   Flag Step 4 (Disputed Parameter) OR Flag Step 6 (Single-Source) → **Output 2 (Hedged).**
      *   Flag Step 5 (Tone > Evidence) OR Flag Step 2 (No Protocol) + Small N → **Output 3 (Revision).**
      *   Flag Step 2 (No Protocol) + Small N + High Policy Risk → **Output 4 (Withhold).**
  *   **Judgment Call:** **Required.** Referee assesses "High Policy Risk" (harm if wrong).

  **Step 8: Downstream Liability Protocol**
  *   **Test:** Define the obligation triggered by future contradictory evidence.
  *   **Information Required:** None (Standardized clause).
  *   **Action:** Attach liability clause to publication decision.
  *   **Judgment Call:** None (Procedural).

  ---

  ## PART II: DOWNSTREAM LIABILITY CHECK

  **Operational Definition:** A binding agreement attached to the publication decision specifying the conditions for post-publication correction.

  *   **Trigger Condition:** Publication of a peer-reviewed replication study with N > 2x original sample contradicting the central claim OR consensus shift by >50% of relevant modeling groups within 12 months.
  *   **Responsible Party:** Corresponding Author (primary), Journal Editorial Board (secondary enforcement).
  *   **Form of Correction:**
      *   For Output 1/2: Formal "Expression of Concern" linked to the digital object.
      *   For Output 3: Mandatory "Author Correction" note amending the claim strength.
      *   For Output 4: N/A (Publication withheld).

  ---

  ## PART III: APPLICATION TO HYPOTHETICAL BRIEFS

  ### Brief 1: Dietary Supplement (N=40, No Protocol)

  **Step-by-Step Output:**
  1.  **Evidentiary Tier:** Preprint/Pilot + Small N (Flag for Step 7).
  2.  **Transparency:** Unregistered/Implicit (Flag for Step 7).
  3.  **Consensus:** No competing views cited (Proceed).
  4.  **Sensitivity:** N/A (Empirical).
  5.  **Warrant-Tone:** Likely claims "improves memory" (Tone > Evidence) (Flag for Step 7).
  6.  **Corroboration:** N/A.
  7.  **Classification:** Flags present (No Protocol + Small N). Policy risk (health intervention) is moderate/high. **Output 4: Not assertible—recommend withholding publication until further evidence is available.** (Alternatively Output 3 if risk deemed low, but health claims warrant caution).
  8.  **Liability:** Trigger: Replication failure. Party: Author. Form: Retraction.

  **Unavoidable Judgment Call:** **Step 7 (Policy Risk Assessment).** The referee must decide if a memory supplement claim carries enough policy risk to warrant withholding (Output 4) versus merely revising (Output 3).
  **Mechanical Misfire:** A mechanical application might always Output 3 (Revision) for small N. This misfires if the supplement has known side effects; a weaker claim ("may improve") could still drive dangerous off-label usage. The judgment call on *harm* is irreducible.

  ### Brief 2: Climate-Modeling (Disputed Parameter)

  **Step-by-Step Output:**
  1.  **Evidentiary Tier:** Peer-Reviewed Model (Proceed).
  2.  **Transparency:** Explicit (Proceed).
  3.  **Consensus:** Three groups dispute parameter (Flag for Step 4).
  4.  **Sensitivity:** Claim hinges on the 0.4°C acceleration (Claim Collapses without parameter) (Flag for Step 7).
  5.  **Warrant-Tone:** Asserts "will accelerate" (Tone > Evidence given dispute) (Flag for Step 7).
  6.  **Corroboration:** N/A.
  7.  **Classification:** Flag Step 4 (Disputed Parameter). **Output 2: Assertible only in conditional or hedged form.** (e.g., "Models suggest potential acceleration...").
  8.  **Liability:** Trigger: Consensus shift by >50% of modeling groups. Party: Author. Form: Expression of Concern.

  **Unavoidable Judgment Call:** **Step 3 (Substantive Dissent).** The referee must judge if the three dissenting groups represent a substantive scientific dispute or a minority outlier position.
  **Mechanical Misfire:** A mechanical count (3 groups = dispute) might force hedging on a claim where the dissent is scientifically negligible. This misfires by amplifying fringe uncertainty, potentially paralyzing necessary policy action on high-probability warming scenarios.

  ### Brief 3: Indigenous Burial Practice (Oral History vs. Archaeology)

  **Step-by-Step Output:**
  1.  **Evidentiary Tier:** Archival/Oral (Proceed to Step 6).
  2.  **Transparency:** N/A (Qualitative).
  3.  **Consensus:** Competing interpretation exists (Flag for Step 4/6).
  4.  **Sensitivity:** Claim depends on interpreting ambiguity (Flag for Step 7).
  5.  **Warrant-Tone:** Claims "was widespread" (Tone > Ambiguous Record) (Flag for Step 7).
  6.  **Corroboration:** Oral history supports, Archaeology ambiguous (Single-Source dominance) (Flag for Step 7).
  7.  **Classification:** Flag Step 6 (Single-Source/Epistemic Conflict). **Output 2: Assertible only in conditional or hedged form.** (Must acknowledge archaeological ambiguity).
  8.  **Liability:** Trigger: New archaeological evidence contradicting oral history. Party: Author. Form: Author Correction.

  **Unavoidable Judgment Call:** **Step 6 (Epistemic Weight).** The referee must weigh the validity of oral history against ambiguous material records.
  **Mechanical Misfire:** A mechanical application privileging "material record" as the gold standard would Output 4 (Withhold) or 3 (Revision), dismissing indigenous knowledge. This misfires by enforcing colonial epistemic norms, silencing valid historical transmission that lacks material traces.

  ---

  ## PART IV: PROCEDURAL LIMITATIONS

  **1. Normative Resolution:** This procedure cannot resolve the underlying philosophical conflict between the **Knowledge Norm** (assert only what is justified) and the **Belief Norm** (assert what is sincerely held). In Brief 3, the author's sincere belief (supported by oral history) conflicts with the knowledge norm (lack of material justification). The Audit forces a hedge (Output 2) but does not determine which norm *ought* to prevail in policy contexts.

  **2. Policymaker Compliance:** The procedure guarantees the *presence* of qualifications (hedging), but cannot guarantee that policymakers will *attend* to them. A brief marked "Assertible only in conditional form" may still be cited as absolute fact in legislative text. The Audit audits the text, not the reception.

  **3. Truth Proxies:** The procedure operates on proxies for truth (peer review, consensus, sample size). It cannot access ground truth. If the consensus is wrong (e.g., Brief 2's dissenters are actually correct), the Audit will still validate the majority view as more assertible. It optimizes for professional liability management, not ontological accuracy.
