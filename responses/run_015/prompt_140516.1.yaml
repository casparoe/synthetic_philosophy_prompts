prompt: |-
  Im a PhD student and I've been handed one fifty-minute section next week in our intro Philosophy and Law course — first-years, about a third of them pre-law and the rest there to fill a requirement, whiteboard only, no handouts because the department printer is dead again. The topic is causation by omission: whether someone's failure to do something can be a cause of something happening. Please don't explain the topic to me; tell me how to explain it. What I keep going back and forth on is the order, because my sense is that before the question even means anything to them I have to seperate "did she cause it" from "is she to blame" — the pre-law kids have half-remembered duty and proximate cause from somewhere and will answer a causal question with a responsibility verdict all section if I let them — and also that they need causal claims to be contrastive or interest-relative (why did *these* plants die and not *those*) before an absence can even look like a possible answer. But I can't tell whether those are genuine prerequisites or whether I'm front-loading metaphysics that should come in later, and I'm not sure whether to present the "an omission only counts as a cause against a normative background" line as the live option it is or to hold it back so it doesn't swallow the whole discussion on contact.

  The example is the other thing I'm stuck on. My first thought was the obvious one — a lifeguard who's on her phone and doesn't notice a kid struggling — but it feels saturated with obligation, so I made up a pair instead: two identical greenhouses on the same street, same plants, both need daily watering. Sam is going away and asks her neighbour Priya to water; Priya says yes and then just forgets, all week. In the other greenhouse nobody was ever asked and nobody watered. Same deaths, same absence of water, one has a promise in it and one doesn't. Is that the right thing to carry the whole fifty minutes, or is it still smuggling in a norm when the question is supposed to be about causation? Either way, tell me what the carrying example has to have and what it has to lack. Then there's a case I want to use late: two people each promise Sam they'll water, each assumes the other did, neither does — now the but-for test says neither one caused it. I want that at the end, as a general worry about overdetermination that also afflicts perfectly ordinary actions, but I'm worried it detonates everything I just built, so tell me where it goes and how to frame it so it doesn't.

  The misconceptions I'm braced for: "an omission is nothing, and nothing can't do anything"; "if forgetting can be a cause then everyone who ever failed to water those plants caused their death, up to and including the Queen"; "causation needs a mechanism, a physical connection or a transfer of energy, so an absence can't qualify"; and the sharp one, that the only reason Priya looks like a cause is that she was supposed to water, so really it's blame dressed up as causation. For each, tell me where exactly in the sequence I should head it off and what has to already be on the board for the defusal to work. And give me one question to ask in the last five minutes that would show me whether they'd actually got the idea rather than just learned to say "omission" — plus what I should openly announce I'm not going to settle at this level and why.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** PhD student teaching a 50-minute section.
      *   **Course:** Intro Philosophy and Law.
      *   **Students:** First-years (mix of pre-law and gen-ed).
      *   **Constraints:** Whiteboard only (no handouts), 50 minutes.
      *   **Topic:** Causation by Omission.
      *   **User's Knowledge:** Clearly knows the material well (mentions contrastive causation, normative backgrounds, overdetermination, but-for test). Doesn't need topic explanation, needs *pedagogical strategy*.
      *   **User's Dilemmas:**
          *   Order of operations: Causation vs. Blame separation, Contrastive vs. Absolute causation.
          *   Example choice: Lifeguard (too normative?) vs. Greenhouse (Sam/Priya/Neighbor).
          *   The "Overdetermination" case (Two promisers): Where to place it so it doesn't destroy the earlier argument?
          *   Misconceptions: "Nothing can't cause," "Floodgate/Queen of England," "Physical mechanism," "Normative smuggling."
          *   Closing: Assessment question + Intellectual Honesty (what remains unsettled).

  2.  **Deconstruct the Pedagogical Challenges:**

      *   **Challenge 1: The Causation/Blame Conflation.** Pre-law students *will* jump to duty/breach. The user is right to worry about this. If they think causation = blame, the philosophical problem vanishes (it just becomes a legal rule).
      *   **Challenge 2: The Metaphysics Load.** Contrastive causation is technically correct but might be too abstract for minute 5. Needs to be introduced *through* the example, not as a definition.
      *   **Challenge 3: The Example.** The Greenhouse case is better than the Lifeguard because it isolates the *omission* from the *legal duty* initially. The "Neighbor" vs. "Priya" comparison is the key lever.
      *   **Challenge 4: Overdetermination.** The "Two Promisers" case breaks the *but-for* test. If introduced too early, it creates skepticism. If introduced too late, it feels like a "gotcha." It needs to be the *limit case* that shows why the theory is hard, not why it's wrong.
      *   **Challenge 5: Time Management.** 50 minutes is tight. Need a rigid timeline.

  3.  **Develop the Strategy (The "How"):**

      *   **Order:**
          1.  Intuition Pump (The Greenhouse).
          2.  The Problem (Why is this weird?).
          3.  Separation Tool (Causation vs. Responsibility).
          4.  Refining Causation (Contrastive/Interest-relative).
          5.  The Stress Test (Overdetermination).
          6.  Wrap-up.
      *   **Example Criteria:** Needs parallel scenarios (one omission, one action OR one omission with duty, one without). The Greenhouse pair (Priya vs. Neighbor) is strong. It needs to *lack* explicit legal liability at the start to force the causal question.
      *   **Misconception Management:** Address them *as they arise* from the student discussion, but have board prompts ready.
      *   **The "Queen of England" Objection:** This is the "profligate causation" problem. Needs the contrastive move to solve.
      *   **The "Nothing can't cause" Objection:** Needs the counterfactual move.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Opening:* Don't lecture. Put the case on the board immediately.
      *   *The Priya/Neighbor Case:* Use exactly what the user proposed. It's clean.
      *   *Separating Cause/Blame:* Do this *before* diving into the metaphysics. Ask: "Did Priya cause it?" If they say "Yes because she promised," stop them. "Imagine no promise. Did the lack of water cause the death?"
      *   *Contrastive Causation:* This is the solution to the "Queen of England" problem. Introduce it when the "everyone is a cause" objection comes up.
      *   *Overdetermination:* Put this in the last 10 minutes. Frame it as "Even if we solve omission, we still have this problem." It preserves the earlier work.
      *   *Normative Background:* Don't present it as *the* answer. Present it as *one* theory (the legal theory) vs. the metaphysical theory.
      *   *Closing Question:* Needs to apply the concept to a new scenario.

  5.  **Refining the Specific Advice:**

      *   **On Order:** Validate the user's instinct. Separation *must* come first. Contrastive comes second (as a tool to limit causation). Normative background comes third (as a specific legal solution).
      *   **On the Example:** The Greenhouse pair is good. It needs to lack *legal duty* for the Neighbor to make the causal symmetry clear.
      *   **On Overdetermination:** Frame it as a problem for *all* causation, not just omissions. This prevents it from undermining the specific omission lesson.
      *   **On Misconceptions:** Map them to specific minutes.
      *   **On the Final Question:** Make it a "transfer" question.

  6.  **Final Polish (Tone and Style):**
      *   Keep it direct, actionable, and respectful of the user's expertise.
      *   Use "Board Work" cues since they have no handouts.
      *   Ensure the timing is realistic (50 mins flies).

      *(Self-Correction during drafting)*: I initially thought about suggesting the Lifeguard case. No, stick with the Greenhouse. The user is right; the Lifeguard case triggers "duty" too hard. The Greenhouse allows the "promise" to be added as a variable.
      *(Self-Correction on Overdetermination)*: Make sure to emphasize that this breaks the *but-for* test, which is the standard tool they likely know. This shows the limits of the tool, not the impossibility of the concept.

  7.  **Final Review against constraints:**
      *   Whiteboard only? Yes, emphasize board layout.
      *   50 mins? Yes, break down by minutes.
      *   Address specific misconceptions? Yes.
      *   Address the "Normative Background" worry? Yes, frame it as a "Legal vs. Metaphysical" distinction.

  8.  **Constructing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a tight fifty minutes, and your instincts are correct: if you let causation and blame collapse, you lose the philosophy and end up in a torts 101 lecture. If you front-load contrastive metaphysics, you lose the room.

  Here is the tactical plan to run the section, manage the board, and sequence the arguments so they build rather than contradict.

  ### 1. The Order of Operations
  Your intuition is right: **Separation first, Contrast second, Norms third.**

  1.  **Minutes 0–10: The Intuition Pump (Greenhouse Case).** Establish the causal symmetry.
  2.  **Minutes 10–20: The Separation Move.** Force the distinction between *cause* and *responsibility*.
  3.  **Minutes 20–30: The Limit Problem (The Queen).** Introduce contrastive causation here to solve the "everything is a cause" objection.
  4.  **Minutes 30–40: The Normative Solution.** Discuss the "duty" argument as a *legal* tool, not a metaphysical truth.
  5.  **Minutes 40–50: The Overdetermination Stress Test.** The two-promiser case.

  **Why this order?** You need them to agree that the *physics* of the death are identical in both greenhouses before you ask why we treat the *agents* differently. If you introduce norms too early, they will use norms to answer the causal question, which is exactly what you want to avoid.

  ### 2. The Example: What it Needs and Lacks
  Stick with the **Greenhouse Pair (Priya vs. Neighbor)**. It is superior to the Lifeguard because the duty is contractual/moral, not statutory/professional, which makes it easier to strip away.

  *   **What it must have:** Physical symmetry. The plants in both houses must die of exactly the same physiological process (thirst) at the same time.
  *   **What it must lack:** Initial legal liability. Do not mention "negligence" or "breach" in the setup.
  *   **Board Setup:** Draw two boxes side-by-side.
      *   *Left:* Priya (Promised) → No Water → Death.
      *   *Right:* Neighbor (No Promise) → No Water → Death.
      *   *Center Column:* "Cause?"

  **The Pivot:** Ask, "Did the *absence of water* cause the death in both?" (Yes). Then ask, "Did *Priya* cause the death? Did the *Neighbor*?"
  This forces them to realize they are answering two different questions. One is about plant biology (causation), one is about social expectations (blame).

  ### 3. Handling the Misconceptions (Timing & Defusal)

  **A. "An omission is nothing; nothing can't do anything."**
  *   **When:** Minutes 5–10 (Immediate reaction to the case).
  *   **Board Prerequisite:** Write "Cause = Difference Maker" vs. "Cause = Physical Push."
  *   **Defusal:** Don't argue metaphysics. Ask counterfactuals. "If Priya *had* watered, would the plant be alive?" If yes, her action makes a difference. In law and philosophy, "making a difference" is often sufficient for causation, even without a physical transfer of energy. Get them to agree that *preventing* a cause (water) is causally relevant.

  **B. "If forgetting is a cause, the Queen of England caused it too." (Profligate Causation)**
  *   **When:** Minutes 20–25 (After they agree Priya caused it).
  *   **Board Prerequisite:** Write "Why *these* plants and not *those*?"
  *   **Defusal:** This is where you deploy **Contrastive Causation**. Do not lecture on it. Ask: "What exactly are we trying to explain? Why did the plants die *instead of living*? Or why did *these* plants die *instead of the ones down the street*?"
      *   Explain that causation is always an answer to a specific "Why?" question. The Queen didn't water them, but she wasn't *expected* to in the context of our specific question about Priya. This limits the causal field without denying the metaphysics.

  **C. "Priya is only a cause because she was supposed to water." (Normative Smuggling)**
  *   **When:** Minutes 30–40.
  *   **Board Prerequisite:** Two columns: "Metaphysical Cause" vs. "Legal Cause."
  *   **Defusal:** Validate this. Tell them: "You have spotted the exact debate in the literature."
      *   *View A:* Causation is purely physical/counterfactual (Priya and Neighbor are both causes).
      *   *View B:* Causation is interest-relative/normative (Only Priya is a cause because only she was part of the 'normal' course of events).
      *   *Instruction:* Tell them the law usually takes View B for policy reasons, but philosophy worries View B confuses the map with the territory. Keep this distinct so they see it as a *choice* of framework, not a hidden truth.

  **D. "Mechanism/Energy Transfer"**
  *   **When:** As needed, likely grouped with Misconception A.
  *   **Defusal:** Use the "Switch" analogy. If I flip a switch and turn off the oxygen supply to a fire, did I cause the fire to go out? I didn't add "extinguishing energy." I removed a necessary condition. Most students accept this. Press that omission is just removing a necessary condition.

  ### 4. The Overdetermination Case (The Two Promisers)
  *   **Placement:** Minutes 40–45. **Do not put this earlier.**
  *   **Risk:** If you put this first, they conclude "Causation is impossible" and tune out.
  *   **Framing:** Present this not as a problem specific to *omissions*, but as a problem for the *But-For Test* generally.
  *   **The Move:**
      1.  Add "Alex" to the Priya scenario. Both promise. Both forget.
      2.  Apply the But-For Test to Priya: "But for Priya's failure, would the plant live?" No, because Alex also failed.
      3.  Apply to Alex: Same result.
      4.  **Conclusion:** "So, according to the strict test, *neither* caused the death, even though the plants are dead."
      5.  **The Save:** Explain that this happens with *actions* too (two shooters fire simultaneously, either shot is fatal). This normalizes the problem. It shows that the *tool* (but-for test) is blunt, not that the *concept* (omission causation) is broken. It leaves them with a sophisticated worry rather than a debunked lesson.

  ### 5. The Final Five Minutes

  **The Assessment Question:**
  Do not ask them to define omission. Ask them to apply the **Contrastive** constraint.
  *   *Question:* "A doctor turns off a ventilator. A vandal unplugs the same ventilator. The patient dies in both cases. Using what we discussed about 'contrastive explanations' or 'normal expectations,' how might a lawyer argue the doctor *caused* the death but the vandal *caused* the death differently, or vice versa? What is the 'contrast' in each case?"
  *   *What to look for:* If they say "The doctor is bad," they missed it. If they say "The doctor's action is the change from the normal course of treatment, whereas the vandal is an external intervention," they get the contrastive/normative distinction.

  **What to Announce is Unsettled:**
  Be intellectually honest. Write on the board: **"Unresolved: Is Causation a Fact or a Policy?"**
  *   *Say:* "I am not going to settle today whether omission causation is a real feature of the universe or just a way we talk about responsibility. The law treats it as real for practical reasons. Philosophy is still fighting about whether that's cheating. You need to know the difference so you don't argue policy when the judge asks for facts."

  ### Summary of Board Work (Left to Right)
  1.  **Case:** Priya (Promise) | Neighbor (No Promise) → Same Death.
  2.  **Distinction:** Metaphysical Cause (Physics/Counterfactual) | Legal Responsibility (Duty/Blame).
  3.  **The Limit:** "The Queen?" → Solution: Contrastive (Why *this* outcome?).
  4.  **The Glitch:** Overdetermination (2 Promisers) → But-For Test Fails.
  5.  **The Open Question:** Fact vs. Policy.

  This structure respects their pre-law instincts (by acknowledging the legal utility of norms) without letting those instincts hijack the metaphysical inquiry (by separating the columns early). It uses the Greenhouse case to do the heavy lifting so you don't have to draw complex diagrams, and it saves the Overdetermination case for the end so it acts as a "horizon of complexity" rather than a roadblock.
