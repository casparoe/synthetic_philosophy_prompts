      *   *Most Exclusionary:* The requirement to rule out drift/constraint definitively excludes almost everything. The requirement to accept optimality models as sufficient evidence excludes the skeptics.

  7.  **Scorecard:**

      *   *Comparative/Phylogenetic:* Good for history, bad for mechanism.
      *   *Optimality:* Good for function, bad for history (Panglossian risk).
      *   *Direct Selection:* Gold standard for mechanism, impossible for history (mostly).
      *   *Developmental-First:* Good for constraints, risks underestimating selection.

  8.  **Refining the Output (Self-Correction during drafting):**

