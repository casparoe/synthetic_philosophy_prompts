  2.  **Initial Brainstorming & Structuring:**

      *   The user asks for a "specification." This needs to be rigorous, almost like a software spec or a legal standard, but for biology.
      *   The core tension is between *Gould & Lewontin's* critique (Spandrels) and *Dennett's/Williams'* adaptationism. The standard must navigate the "Adaptationist Programme" without falling into "Panglossian Paradigm" traps.
      *   The user's four rough kinds seem to be: Cases, Distinctions, Results/Practices, Constraints. I should refine these into a more logical flow for a specification document. Let's try: *Epistemic Conditions*, *Evidentiary Thresholds*, *Exclusionary Criteria*, and *Procedural Norms*.
      *   *Key Concept:* The definition of "Adaptation." It usually requires: (1) Heritability, (2) Variation, (3) Fitness consequence, (4) *Historical selection for that function*. This is the crux. Current utility $\neq$ Adaptation.
      *   *Burden of Proof:* Who has to prove what? Usually, the claimant must rule out null hypotheses (drift, constraint). But demanding *proof* of history is often impossible. The standard needs a "preponderance of evidence" approach rather than "beyond reasonable doubt."

