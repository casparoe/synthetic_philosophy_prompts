      *   *Check:* "Party Prejudice." I need to explicitly call out where my own specification might lean too hard one way. For instance, prioritizing "Historical Selection" is the definition of adaptation, but demanding *evidence* of it is an empiricist constraint that might bias against valid inference.

  9.  **Final Polish:** Ensure all constraints (no references, specific tests, scorecard limit) are met. (Self-correction: Ensure the distinction between "Selection For" and "Selection Of" is clearly articulated as per Sober).

  *(Self-Correction on the Skink Case)*: The prompt says "presence survives phylogenetic correction." This rules out simple phylogenetic inertia. "Flange distributes load well... within 12% of optimal." This supports adaptation. "Developmentally... secondary outgrowth... volume tracks bite force." This supports constraint/correlation. "Females use it in courtship." This supports exaptation/secondary utility.
  *Verdict:* The standard should yield **Underdetermined**. The evidence for *function* is strong (optimality), evidence for *history* is mixed (phylogeny says yes, development says maybe correlated to bite force). Without fitness data linking flange *specifically* to survival in soil (independent of bite force), you can't rule out the "Selection of" (bite force) vs "Selection for" (burrowing) distinction.

  *(Self-Correction on Consortium Case)*: If genomes show no selection, the standard must recommend downgrading the claim. It cannot insist the genomes are wrong. It must accept that "Adaptation" requires a selection signature *in principle*, even if hard to find. If the signature is consistently absent, the hypothesis is likely false (or the trait is a correlated response).

  *(Final check on "Party Prejudice")*: I need to be careful not to sound like a strict Adaptationist or a strict Structuralist. The specification must be neutral ground.

