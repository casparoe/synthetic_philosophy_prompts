      *   *Hard:* Panda (exaptation/co-option), Crystallins (moonlighting), Chin (spandrel/drift?), Flamingo (biomechanics vs. history).
      *   *Distinctions:* Utility/History is the big one. Adaptation/Exaptation/Spandrel is the classification output. Selection for/Selection of (Sober's distinction) is crucial for correlated traits.

  5.  **Developing the Two Tests:**

      *   *Test 1 (Skinks):*
          *   Evidence: Phylogenetic correlation (strong), Mechanical optimality (strong), Developmental link to bite force (confounding variable?), No fitness data, No genomics, Courtship use (secondary).
          *   Analysis: It looks adaptive for burrowing (optimality + ecology), but development links it to bite force. Is the flange *for* burrowing or a byproduct of jaw muscle selection?
          *   Verdict: Likely "Underdetermined" or "Warranted as Exaptation/Co-option" depending on the timing. If bite force drove jaw size, and flange is a structural necessity of jaw size, it's a constraint/byproduct. If flange varies *independently* to optimize soil load, it's adaptation. The prompt says "flange is a secondary outgrowth... whose volume tracks bite force." This suggests the flange might be a structural consequence of the muscle chamber.
          *   *Decision:* The standard should flag the "Correlated Response" risk. Verdict: *Underdetermined* (cannot distinguish selection for burrowing vs. correlated response to bite force selection without fitness data or finer developmental dissection).
      *   *Test 2 (Consortium):*
          *   Scenario: Genomic scans show no selection signatures for "textbook adaptations."
          *   Implication: Either the genomic tools are blind to polygenic/soft sweeps, OR many traits are drift/constraints/correlated responses.
          *   Standard's Response: The standard must prioritize the *historical* definition. If no selection signature exists, the claim "Adaptation" is weakened, *unless* the selection was ancient/soft/polygenic beyond detection. The standard must allow downgrading claims from "Adaptation" to "Current Utility" or "Exaptation." It must be revisable.

  6.  **Meta-Analysis (The "Honest Broker" Section):**

      *   *Non-negotiable:* Distinction between history and utility (Definition of adaptation). Burden of proof on claimant (Scientific norm).
      *   *Camp Preferences:* "Demand for Direct Selection Evidence" is often impossible (Gould's critique vs. Maynard Smith's defense). "Optimality" assumes strong selection (Adaptationist bias).
