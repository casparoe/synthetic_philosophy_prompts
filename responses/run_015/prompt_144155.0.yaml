answer: |-
  # Specification for Adjudicating Adaptive Hypotheses

  ## 1. Purpose and Scope
  This specification defines the evidentiary standards required to license the claim that a biological trait $T$ in taxon $X$ is an **adaptation for function $F$**. It is designed for use by referees evaluating manuscripts in evolutionary biology. The standard must distinguish adaptation from byproduct (spandrel), exaptation, developmental constraint, and drift artifact. It must return one of three verdicts: **Warranted**, **Not Warranted**, or **Underdetermined**.

  ## 2. Desiderata
  The following requirements govern the adjudication process. They are partitioned into Epistemic Conditions, Evidentiary Thresholds, and Procedural Norms.

  ### A. Epistemic Conditions (Definitions and Distinctions)
  *These define the conceptual space the referee must navigate.*

  1.  **The History/Utility Distinction (Non-Negotiable)**
      *   **Requirement:** A claim of adaptation must assert that natural selection *historically caused* the proliferation of $T$ *because of* $F$. Current utility is necessary but insufficient.
      *   **Motivation:** Prevents the "San Marco" error. The triangular panels under the dome are useful for decoration and structurally necessary, but they were not selected *for* decoration; they are architectural byproducts. Similarly, vertebrate lens crystallins are useful for refraction, but many were metabolic enzymes recruited (exapted) without initial selection for transparency.
      *   **Workload:** This distinction does the most work in the specification. It separates the *origin* of the trait from its *maintenance* or *current use*.

  2.  **The "Selection For" vs. "Selection Of" Distinction (Non-Negotiable)**
      *   **Requirement:** The evidence must distinguish between selection acting directly on $T$ for $F$ ("selection for") and $T$ increasing in frequency merely because it is correlated with another trait $Z$ that was selected for ("selection of").
      *   **Motivation:** Addresses the "hard cases" of correlated responses. In the panda's radial sesamoid, the bone is enlarged for manipulating bamboo, but its origin is tied to developmental constraints of the wrist. In the skink case (see Test 1), if the flange grows solely because jaw muscles grew (selected for bite force), the flange is a correlated response, not an adaptation for burrowing.

  3.  **The Null Hypothesis Mandate (Non-Negotiable)**
      *   **Requirement:** An adaptive hypothesis is not supported merely by fitting the data; it must be shown to fit the data *better* than plausible null models (drift, phylogenetic inertia, developmental constraint).
      *   **Motivation:** Addresses the "publication bias" constraint. A hypothesis often counts as supported because failures are unpublished. The referee must check if the author has actually tested the null, not just assumed it false.

  ### B. Evidentiary Thresholds (What Counts as Evidence)
  *These define the weight of specific data types.*

  4.  **Predictive Success over Post-Hoc Fitting (Preference)**
      *   **Requirement:** Stronger weight is given to hypotheses that predicted a trait's existence or property before discovery (e.g., Darwin's orchid) than to those constructed to explain existing data (e.g., "just-so stories").
      *   **Motivation:** Ensures adaptive hypotheses have genuine predictive power. Post-hoc optimality modeling is prone to Panglossian bias (assuming the trait is optimal because it exists).

  5.  **The Genomic/Phylogenetic Anchor (Revisable)**
      *   **Requirement:** Where possible, claims of recent adaptation should be supported by signatures of selection (e.g., sweeps) or phylogenetic correlation with the ecological variable $F$. Absence of genomic signature does not falsify ancient adaptation but weakens claims of recent, strong selection.
      *   **Motivation:** Consistent with population genetics. Lactase persistence is a "clear positive" because the genomic sweep matches the cultural history of dairying. However, this requirement must be revisable (see Test 2) if genomic methods prove blind to polygenic adaptation.

  6.  **Developmental Plausibility Check (Non-Negotiable)**
      *   **Requirement:** The manuscript must demonstrate that the developmental system allows for the variation required by the adaptive hypothesis. If $T$ is a necessary structural consequence of growth rule $G$, and $G$ is selected for reason $H$, $T$ cannot be claimed as an adaptation for $F$ without evidence of decoupling.
      *   **Motivation:** Respects developmental constraints. Prevents labeling necessary architectural features (like the San Marco spandrels or potentially the human chin) as selected traits.

  ### C. Procedural Norms (How to Judge)
  *These govern the referee's decision process.*

  7.  **Burden of Proof Placement (Non-Negotiable)**
      *   **Requirement:** The burden lies with the claimant to provide positive evidence for selection history, not with the skeptic to prove drift/constraint. However, the standard of proof is "preponderance of evidence" (Inference to the Best Explanation), not "beyond reasonable doubt," acknowledging that selection histories are rarely directly observable.
      *   **Motivation:** Prevents the default assumption that all traits are adaptations (Adaptationist Programme bias) while acknowledging the practical impossibility of proving history definitively (Skeptic bias).

  8.  **Verdict Granularity (Non-Negotiable)**
      *   **Requirement:** The referee must distinguish between "Adaptation for $F$" (historical selection), "Exaptation for $F$" (co-opted), and "Current Utility $F$" (function without historical selection claim).
      *   **Motivation:** Allows manuscripts to be "Warranted" for utility claims even if "Underdetermined" for historical adaptation claims.

  9.  **Revisability Clause (Non-Negotiable)**
      *   **Requirement:** The standard must allow a verdict to change if aggregate evidence shifts (e.g., new phylogenies, better genomic scans). A claim "Warranted" today may become "Not Warranted" if new null models explain the data better.
      *   **Motivation:** Science is cumulative. Textbook adaptations may be overturned (see Test 2).

  ---

  ## 3. Application Tests

  ### Test 1: The Burrowing Skink Case
  **Case Summary:** 47 species. 41 have bony skull flange. Flange correlates with compacted soil (not loose sand). Survives phylogenetic correction. Flange matches mechanical optimality model (±12%). Developmentally, flange is an outgrowth of the jaw-adductor chamber; volume tracks bite force (selected for prey hardness). No fitness data. No genomics. Flange used in courtship (2 species).

  **Adjudication:**
  1.  **Utility:** High. Matches optimality model for soil load.
  2.  **History:** Mixed. Phylogenetic correlation supports independent evolution in soil-dwellers. However, developmental linkage to bite force introduces a "Selection Of" confound.
  3.  **Nulls:** Developmental constraint is a strong null. If the flange is a necessary structural buttress for the enlarged jaw muscle chamber (selected for biting), its correlation with soil might be ecological covariance (hard prey lives in hard soil) rather than direct selection for burrowing.
  4.  **Verdict:** **Underdetermined.**
      *   **Reasoning:** While the trait fits an optimality model for burrowing (suggesting Adaptation), the developmental evidence suggests it may be a correlated response to selection on bite force (Selection Of). Without fitness measurements disentangling bite force from soil load, or genomic evidence showing selection on flange-specific loci independent of jaw-muscle loci, the referee cannot license the claim "Adaptation for Burrowing." The claim "Current Utility for Burrowing" is Warranted. The claim "Exaptation for Courtship" is Warranted for the two species.

  ### Test 2: The Consortium Reanalysis Scenario
  **Scenario:** A consortium finds ~50% of "textbook adaptations" lack genomic selection signatures and are better predicted as correlated responses to neighboring traits.

  **Standard's Recommendation:**
  1.  **Immediate Action:** The standard must recommend downgrading claims for the affected traits from "Adaptation" to "Exaptation" or "Correlated Response" pending further evidence.
  2.  **Revisability:** The standard must acknowledge that "Adaptation" is a falsifiable historical claim. If the genomic signature (the direct trace of history) is absent across a large aggregate, the prior probability of the Adaptation hypothesis drops.
  3.  **Capability:** Yes, the list is capable of changing verdicts. Desideratum 5 (Genomic Anchor) and Desideratum 9 (Revisability) explicitly handle this. If the "Genomic Anchor" consistently fails for a class of traits, the "Burden of Proof" (Desideratum 7) shifts heavier onto the adaptationist to explain why the signature is missing (e.g., polygenic soft sweeps) rather than accepting the null.
  4.  **Caveat:** The standard must warn against assuming genomic silence = no selection (ancient selection signatures decay). However, if *half* the literature is silent, the default assumption of adaptation is no longer tenable for that clade.

  ---

  ## 4. Meta-Analysis of Requirements

  ### Non-Negotiable vs. Camp Preference
  *   **Non-Negotiable:** History/Utility Distinction (1), Selection For/Of (2), Null Hypothesis Mandate (3), Burden of Proof (7), Verdict Granularity (8). These are definitional to evolutionary theory; removing them collapses "adaptation" into "usefulness."
  *   **Camp Preference:** Predictive Success (4) leans toward a Popperian view that may undervalue robust explanatory coherence in historical sciences. The Genomic Anchor (5) leans toward a molecular reductionist view; some valid adaptations (ancient, polygenic) will fail this test.

  ### Flagged Prejudices
  *   **Suspicion:** Desideratum 3 (Null Hypothesis Mandate) risks begging the question against the Adaptationist Programme if interpreted too strictly. If every trait requires a tested null model of drift to be called an adaptation, the category "adaptation" may become empty, as drift models are often untestable in deep time. This is a "Skeptic Prejudice" in methodological dress.
  *   **Suspicion:** Desideratum 4 (Predictive Success) favors the "Darwin's Orchid" case but penalizes legitimate research into existing traits where prediction is impossible. This privileges discovery over explanation.

  ### Incompatible Requirements
  *   **Pair:** "Usable from realistically available evidence" (Constraint) vs. "Must establish historical selection" (Desideratum 1).
  *   **Conflict:** Direct evidence of historical selection is rarely available (fossils/ancestral behavior are missing).
  *   **Resolution:** The specification resolves this via Desideratum 7 (Inference to the Best Explanation). We accept *inference* of history, not *observation*. This is the single requirement that excludes the most candidate standards: any standard demanding direct observation of history is excluded; any standard accepting current utility as sufficient for adaptation is excluded.

  ---

  ## 5. Scorecard of Contenders

  | Contender | Strengths | Weaknesses | Verdict against Specification |
  | :--- | :--- | :--- | :--- |
  | **Comparative Method (w/ Phylogeny)** | Handles historical correlation well; rules out shared ancestry (inertia). | Cannot distinguish adaptation from correlated response (Selection For vs. Of); often lacks functional mechanism. | **Necessary but Insufficient.** Must be combined with functional data. |
  | **Optimality / Engineering** | Strong on current utility and design quality; generates predictions (Orchid case). | Panglossian risk (assumes optimality implies selection); ignores history and constraint (San Marco error). | **High Risk.** Warranted only if null models of constraint are explicitly ruled out. |
  | **Direct Evidence of Selection** | Gold standard for mechanism (Lactase case); resolves history via genomics. | Often impossible for ancient traits; blind to polygenic/soft sweeps; cannot prove *function* (only that selection occurred). | **Ideal but Rare.** Absence of evidence is not evidence of absence, but presence is decisive. |
  | **Developmental-Constraints-First** | Excellent at ruling out false positives (Spandrels, Crystallins); respects biological reality. | Risks false negatives (underestimating selection's ability to overcome constraint); hard to quantify "impossibility." | **Essential Filter.** Must be used to vet adaptive hypotheses before testing them. |

  **Final Recommendation:** No single contender satisfies the specification. A **Pluralist Integration** is required: Phylogeny to establish independence, Engineering to establish function, Development to rule out necessity, and Genomics (where available) to confirm selection. The referee's task is to ensure the manuscript integrates at least three of these four lines to reach a "Warranted" verdict for historical adaptation.
