answer: |-
  ### SCRATCH SECTION: MAPPING & FALSE FRIENDS

  **Objective:** Translate IP theories into Registrar Vocab.
  **Constraint:** Do not import concepts that have no shelf-space in the accession register.

  | Philosophical Concept | Proposed Registrar Mapping | Verdict | Notes / Cross-outs |
  | :--- | :--- | :--- | :--- |
  | **Lockean Labour** | *Autograph* / *Hand* | **KEEP** | Labour = physical mark on the sheet. "Mixing labour" = annotation. |
  | **Lockean Proviso** | *Public Access Policy* | ~~**CROSS OUT**~~ | Proviso is about *resources* left for others. Access policy is about *risk*. Not the same. |
  | **Personhood** | *Provenance* / *Origin* | **KEEP** | Work as extension of self = direct chain of title to creator. |
  | **Moral Rights** | *Inalienable Holdings* | ~~**CROSS OUT**~~ | Moral rights are legal; inalienability here is ethical/custodial. Close enough for translation, but distinct. |
  | **Instrumentalism** | *Acquisition Strategy* | ~~**CROSS OUT**~~ | Instrumentalism is about *future* creation. Acquisition is about *past* preservation. |
  | **Incentive** | *Deaccessioning for Funds* | ~~**CROSS OUT**~~ | False friend. Incentive creates new work; deaccessioning sustains the collection. |
  | **Non-Rivalry** | *Digital Surrogate* | **KEEP** | Use of scan does not diminish paper. But risk of *misuse* remains. |
  | **Idea/Expression** | *Original vs. Reproduction* | ~~**CROSS OUT**~~ | Legal dichotomy. Registrar sees *Object* vs. *Surrogate*. The pattern exists in both. |
  | **Public Domain** | *Orphan Works* | ~~**CROSS OUT**~~ | Orphan = owner unknown. Public Domain = owner none. Different accession statuses. |
  | **Traditional Knowledge** | *Community Custodianship* | **KEEP** | Fits the Weavers' Association claim. Not ownership, but stewardship. |

  **Note on Attribution Vocabulary:**
  Legal "Author" is binary. Registrar attribution is graded:
  *   *Autograph* (Creator's hand)
  *   *Workshop of* (Under supervision)
  *   *Circle of* (Contemporaries, same style)
  *   *Follower of* (Later, imitating)
  *   *After* (Copy of a design)
  *   *Unknown Hand* (Gap in provenance)

  **Note on "Ownership":**
  In my vocab, "Ownership" = Title. "Custodianship" = Physical possession + Ethical duty. IP theories conflate these. I must separate them in the translation.

  ***

  ### TRANSLATIONS OF THE FOUR ACCOUNTS

  Here are the four accounts restated in the vocabulary of the accession register.

  #### 1. The Labour-Desert Account (Lockean)
  *Translation:* Property rights attach to the *autograph* marks where labour was mixed with the material. The paper sheets are owned by the museum via deed of gift (chain of title complete). The *patterns* drawn on them are owned by the hands that drew them. Where annotations overlap, we have a *workshop of* attribution; joint labour creates joint title. The "proviso" (leaving enough and as good) translates to the museum's mandate to make the collection useful to the public without depleting the resource.

  *   **Who owns the sheets?** The museum holds title. The labour embedded in the ink belongs to the drafters (Halvorsen circle).
  *   **Who owns the pattern?** The drafters. The older motifs (pre-1948) are *common stock* (no labour by the workshop to create them, only to record them), so they cannot be exclusively owned.
  *   **What did the 1961 book do?** It appropriated labour without attribution. It severed the link between the *autograph* and the *reproduction*. It is a theft of credit, if not of title.
  *   **Action in 18 months:** Publish the scans to satisfy the "proviso" (public benefit), but metadata must explicitly attribute the *hands* (autograph/workshop) to restore the labour connection. The grant requirement aligns with the proviso, provided attribution is rigorous.

  #### 2. The Personhood Account (Hegelian)
  *Translation:* The object is an extension of the creator's will. A break in the *chain of title* that severs the creator's control over how the object is presented is a violence to the person. *Inalienable holdings* are those where the connection to the creator is so strong that title cannot ethically transfer fully. The Granddaughter stands in the *provenance* line as the heir to that personality.

  *   **Who owns the sheets?** Museum holds physical title, but the Granddaughter holds a residual *custodial* claim based on lineage.
  *   **Who owns the pattern?** The pattern is an extension of the Founder's personality. It is *inalienable* in the sense that it cannot be separated from their reputation or intent.
  *   **What did the 1961 book do?** A violation of personality. It treated a personal extension as a commodity. *After* the Founder, not *Autograph*.
  *   **Action in 18 months:** Withhold publication if the Granddaughter's objection is based on the integrity of the Founder's legacy. The grant is secondary to the duty to the *person* behind the object. Custodianship overrides the instrumental benefit of access.

  #### 3. The Instrumentalist Account (Utilitarian/Statutory)
  *Translation:* Property is a temporary statutory bargain to elicit future production. In museum terms, this is an *acquisition strategy*: we grant access now to encourage future donations or future weaving. There is no natural right, only a policy lever. *Orphan works* are simply where the bargain has expired or the counterparty is missing.

  *   **Who owns the sheets?** Whoever holds the statutory copyright term. If expired, no one owns the pattern.
  *   **Who owns the pattern?** No one, unless protection incentivizes new weaving. If the Weavers' Association isn't seeking money, the incentive mechanism is broken/irrelevant.
  *   **What did the 1961 book do?** It exploited an expired or unenforced bargain. Legally permissible if copyright lapsed; ethically neutral.
  *   **Action in 18 months:** Publish. The grant is the instrument. Releasing scans under open licence maximizes public utility and encourages future use (weaving). The Granddaughter's claim is irrelevant unless it stops future production (which she says it doesn't).

  #### 4. The Skeptical Account (Anti-Property)
  *Translation:* Ideas and patterns are non-rivalrous. One person's use does not diminish another's. In registrar terms: the *digital surrogate* does not degrade the *original*. Therefore, restricting the surrogate is creating artificial scarcity on a resource that is naturally abundant. *Provenance* matters for history, not for exclusion.

  *   **Who owns the sheets?** Museum owns the paper.
  *   **Who owns the pattern?** No one. Patterns are air. You can own the *recording* of the pattern, not the pattern itself.
  *   **What did the 1961 book do?** Nothing wrong. It circulated air. The lack of attribution is a scholarly failure, not a property theft.
  *   **Action in 18 months:** Publish everything, immediately. Any restriction is a failure of the museum's mission to disseminate knowledge. The Weavers' claim is nostalgia, not property.

  ***

  ### RESIDUE REPORT

  This is the gap analysis between the philosophical accounts and the reality of the accession register.

  **1. What in these four accounts has no counterpart in my vocabulary?**

  *   **The Forward-Looking Incentive (Instrumentalist):** My vocabulary is forensic. *Provenance* looks backward to establish origin. *Accession* records what *has* arrived. The Instrumentalist account asks, "Will this create *new* work?" I have no field in the database for "Future Production Potential."
      *   *Verdict:* This is a defect in how registrars talk. We treat the collection as a tomb rather than a seed. We need a metadata field for "Intended Use" that isn't just "Research."
  *   **The Abundance Claim (Skeptical):** The Skeptical account relies on non-rivalry. My vocabulary is built on *risk*. Even if the digital file is abundant, the *context* is rivalrous. If the pattern is sacred or culturally sensitive, unlimited access diminishes its value to the community.
      *   *Verdict:* The philosopher's claim is less clear than it looks. They assume "use" is neutral. In the museum, "use" can be desecration.
  *   **The Proviso's "Enough and As Good" (Lockean):** Locke asks if others are left enough. In the museum, "enough" is undefined. Is a low-res scan "enough" for the public while the high-res is restricted?
      *   *Verdict:* Defect in registrar talk. We define access levels (1-5), but we don't define *sufficiency*.

  **2. What does my vocabulary contain that none of the four accounts can say?**

  *   **Custodianship Without Ownership:** All four theories struggle with the idea that I can hold the object, protect it, and restrict it, without *owning* the IP. The Personhood account gets close, but it ties it to the *creator*. I am talking about the *institution's* duty.
  *   **Gaps in Provenance as Stable Status:** To a philosopher, an "orphan work" is a failure of knowledge. To me, "Orphan" is a valid accession status. It stabilizes the object. I can care for it without knowing who made it. The theories demand an owner; I can hold the gap.
  *   **Claims for Return (Non-Monetary):** The Weavers' Association claim is neither for money (damages) nor control of copies (copyright). It is a claim for *respect* or *continuity*. This is **Traditional Cultural Expression (TCE)**. None of the four Western IP accounts can process a claim that says, "We don't own this, but you can't use it without us."
      *   *Verdict:* This residue is not noise. It points to the fact that ownership is relational, not just proprietary. The philosophical accounts miss the *community* as a rights-holder. They see Individuals (Locke/Personhood) or The Public (Instrumentalist/Skeptic). They do not see the *Tribe/Association*.

  ***

  ### RANKING AND RECOMMENDATION

  I am not going to be even-handed. The Halvorsen material is not a theoretical puzzle; it is a collection of objects with blood and sweat in the fibres.

  **Ranking of Accounts for this Case:**

  1.  **Personhood Account (Confidence: 85%)**
      *   *Why:* It is the only one that takes the Granddaughter's veto seriously. It respects the *autograph* as an extension of the self. It aligns with the registrar's duty of *custodianship* over the *integrity* of the holding.
  2.  **Lockean Labour-Desert (Confidence: 75%)**
      *   *Why:* It respects the Weavers' Association. Their claim is based on the labour of a century of weaving, not just the 1948-1963 workshop. It acknowledges the "older motifs" as common stock but the specific annotations as labour.
  3.  **Skeptical Account (Confidence: 40%)**
      *   *Why:* It correctly identifies that the pattern itself cannot be owned. However, it fails to account for the harm caused by decontextualized publication.
  4.  **Instrumentalist Account (Confidence: 10%)**
      *   *Why:* It is dangerous here. It treats the grant as the primary goal. It would sacrifice the relationship with the Granddaughter and the Weavers for the sake of "future production" which is speculative. It treats the collection as a means to an end, violating the custodial duty.

  **The Verdict: What to Publish and What to Withhold**

  **Recommendation:** **Withhold the high-resolution scans of the motif sheets from the open licence. Publish the finding aid and low-resolution surrogates with restricted access.**

  **Reasoning:**
  I am prioritizing the **Personhood** and **Lockean** accounts over the **Instrumentalist** grant requirement.
  1.  **The Granddaughter:** Her claim is a *provenance* claim. She is the living chain of title to the Founder's personality. Ignoring her breaks the trust required for future bequests (a practical Instrumentalist reason to follow Personhood ethics).
  2.  **The Weavers:** Their claim is a *custodianship* claim. They are the *circle of* users who keep the pattern alive. Releasing the patterns under an open licence (CC0/CC-BY) allows commercial entities to appropriate the motifs without engaging the Weavers. This violates the Lockean proviso (it does not leave "enough and as good" for the community that sustains the craft).
  3.  **The Grant:** You must negotiate. Most grantors allow for "cultural sensitivity restrictions." If they do not, you must be prepared to return the funds. The ethical cost of alienating the source community is higher than the financial cost of the grant.

  **Action Plan:**
  1.  **Accession Status:** Mark the motif sheets as *Inalienable Holdings* (ethically, if not legally).
  2.  **Attribution:** Catalogue the sheets as *Workshop of Halvorsen*, with specific notes on *Autograph* annotations where identifiable.
  3.  **Publication:** Release the 1961 book scans (if copyright allows) as *After Halvorsen*. Release the original drawings only to verified researchers or members of the Weavers' Association.
  4.  **Metadata:** Explicitly state in the record: "Custodianship shared with the [Name] Weavers' Association. Commercial use of motifs requires community consultation."

  **Where Two Accounts Are Not Disagreeing (Verbal Dispute):**
  The **Skeptical** and **Instrumentalist** accounts are arguing over words. The Skeptic says "You can't own a pattern." The Instrumentalist says "We pretend you own it to encourage work." In practice, both result in *open access*. They differ on *why*, but for your eighteen-month deadline, they demand the same action (Publish). The conflict is actually between this pair and the **Personhood/Lockean** pair.

  **Uncertainties (Check with Counsel):**
  1.  **Copyright Status of 1961 Book:** If the book is still under copyright, the publisher may have a claim that overrides the Granddaughter's moral rights depending on jurisdiction (Work for Hire?). *Check: Copyright expiration date in your jurisdiction.*
  2.  **Grant Contract Specifics:** Does "Open Licence" specifically mean CC0, or does it allow CC-BY-NC (Non-Commercial)? A Non-Commercial clause might satisfy the Weavers. *Check: Grant Agreement Section 4.b.*
  3.  **Indigenous/Customary Law:** If the Weavers' Association represents an indigenous group, there may be statutory protections for Traditional Cultural Expressions that override standard copyright. *Check: National Heritage Act / Indigenous Rights Law.*

  **Final Confidence in Recommendation:** **80%.**
  The weak joint is the Grant. If the Grant is rigid, you will lose the money. But you will keep the collection's integrity. A registrar's primary duty is to the object and its community, not to the funding cycle. Sacrifice the grant, not the provenance.
