prompt: |-
  So I was at a panel last month and two of the speakers ended up in it during the Q&A, and I kept thinking about it afterwords. One's a game theorist (Mara), the other a philosopher of social norms (Devin), and they were arguing about David Lewis's account of conventions — the one where a convention is basicly a solution to a recurring coordination problem, pinned down by common knowledge and this "prior expectation" that everyone expects everyone else to conform.

  Mara's point was that Lewis's whole setup is static. It describes a convention as an equilibrium that's already been selected and is already common knowledge, so it can tell you what a convention is once it's in place, but it can't tell you how one gets started from nothing. To explain the evolution of norms — how a population moves from no convention, or from the wrong one, to an established one — you need a dynamic account, like replicator dynamics or some learning model, that traces the actual path. The "prior expectation" condition just presupposes the very thing you're trying to explain.

  Devin pushed back and said that's a misreading. Lewis's arbitrariness condition plus Schelling's focal points already handle the selection problem: even with no shared history, agents can lock onto a salient equilibrium because the salience is itself common knowledge. So Lewis can explain how a convention gets chosen, and the "evolution" over time is just the convention getting reinforced through repeated play, which his framework already covers. The "static" complaint is mostly a category error.

  Mara said that even if focal points pick the equilibrium, they don't explain the dynamics of how a population converges to it, or what happens when two conventions compete and one has to displace the other. Then she added that a lot of real norms — fairness, reciprocity, promise-keeping — aren't pure coordination at all; there's a genuine conflict of interest in them, so Lewis's framework (which only handles pure coordination) doesn't even apply to the norms people usually mean by "social norms."

  Devin's last move was to say the conflict-of-interest cases are a different phenomenon and shouldn't be dragged into the convention story, and that if you keep the domain to pure coordination — which is what Lewis actually claimed to cover — his account plus focal points is basically complete, and the rest is just empirical work on how fast things converge.

  I honestly couldn't tell who had the better case. Can you go through their exchange and say who's right about which specific point — not just who wins overall — and flag anything both of them are missing?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Scenario:**
      *   **Context:** A panel Q&A discussion.
      *   **Participants:** Mara (Game Theorist), Devin (Philosopher of Social Norms).
      *   **Topic:** David Lewis's account of conventions (from *Convention: A Philosophical Study*, 1969).
      *   **Core Dispute:** Is Lewis's account static (descriptive of existing conventions) or dynamic (explanatory of emergence/evolution)? Does it handle norm emergence and conflict-of-interest norms?
      *   **Mara's Arguments:**
          1.  Lewis is static; presupposes common knowledge/prior expectation (circular for emergence).
          2.  Need dynamic models (replicator dynamics, learning) to explain convergence.
          3.  Focal points don't explain population convergence or displacement of competing conventions.
          4.  Real norms (fairness, etc.) involve conflict of interest, not just pure coordination. Lewis's framework is too narrow.
      *   **Devin's Arguments:**
          1.  Lewis + Schelling (focal points) handles selection without shared history via salience.
          2.  "Evolution" is just reinforcement through repeated play (covered by Lewis).
          3.  Calling it "static" is a category error.
          4.  Conflict-of-interest norms are a different phenomenon; Lewis only claimed to cover pure coordination.

  2.  **Analyze the Philosophical/Game Theoretic Ground Truth:**
      *   *Lewis's Account:* Defines convention as a regularity $R$ in a population $P$ in a recurrent situation $S$, where everyone conforms, expects others to conform, prefers conformity conditional on others conforming (coordination equilibrium), and there is an alternative regularity $R'$ that could have worked. Crucially, it relies on *common knowledge* (or common belief) of these preferences and expectations.
      *   *The "Static" Critique:* This is a standard and widely accepted critique in the literature (e.g., by Brian Skyrms, Ken Binmore, Cristina Bicchieri). Lewis defines the *state* of convention, not the *process* of reaching it. The "common knowledge" requirement is extremely demanding for emergence. How do we get to common knowledge without prior communication or history?
      *   *Focal Points (Schelling):* Lewis does use Schelling. Salience can solve the selection problem *in principle*. However, does salience guarantee *common knowledge* of salience? And does it explain *population-level convergence* over time? Game theory distinguishes between one-shot selection and dynamic convergence.
      *   *Dynamics/Learning:* Evolutionary Game Theory (EGT) and learning models (fictitious play, reinforcement learning) were developed largely to address the "equilibrium selection" and "convergence" problems that classical Nash/Lewisian equilibrium analysis leaves open. Mara is aligning with the modern EGT consensus here.
      *   *Conflict of Interest:* Lewis explicitly restricts his definition to *coordination* problems (where interests coincide regarding the equilibrium, even if they differ on *which* equilibrium). Norms like fairness or promise-keeping often involve Prisoner's Dilemma structures or bargaining problems (mixed motive). Bicchieri and others argue that Lewis's account is too narrow for "social norms" broadly construed. Devin is technically right about Lewis's *intent*, but Mara is right about the *application* to social norms generally.

  3.  **Evaluate Specific Claims (Point-by-Point):**

      *   **Point 1: Static vs. Dynamic (Emergence)**
          *   *Mara:* Lewis is static; presupposes what needs explaining (common knowledge).
          *   *Devin:* Lewis + Focal Points explains selection; reinforcement covers time.
          *   *Verdict:* **Mara is stronger.** Lewis's definition is indeed an equilibrium definition. While he discusses "precedent," the requirement for *common knowledge* of the equilibrium conditions is a high bar for *emergence*. Focal points help, but they don't provide a *dynamic mechanism* for how a population updates beliefs to reach that common knowledge. EGT is the standard response to this gap. Devin's claim that reinforcement is "covered" by Lewis is weak; Lewis assumes rationality and common knowledge, not adaptive learning.

      *   **Point 2: Focal Points and Salience**
          *   *Mara:* Doesn't explain population convergence or displacement.
          *   *Devin:* Salience is common knowledge; locks agents in.
          *   *Verdict:* **Split/Contextual.** Devin is right that Lewis *uses* salience to solve selection. Mara is right that salience alone doesn't model the *process* of convergence (the "basin of attraction" issue). If salience is ambiguous, how does the population tip? Lewis doesn't model the tipping.

      *   **Point 3: Conflict of Interest (Pure Coordination vs. Mixed Motive)**
          *   *Mara:* Real norms (fairness, etc.) have conflict. Lewis doesn't apply.
          *   *Devin:* Those are different phenomena; Lewis only claimed pure coordination.
          *   *Verdict:* **Devin is right on exegesis, Mara is right on scope.** Lewis *did* restrict himself to coordination conventions (driving on the left, meeting at noon). He explicitly excluded moral norms or norms solving PDs. However, Mara is right that when people talk about "social norms" in philosophy/sociology, they usually mean the broader category. So Lewis's account is incomplete *as a theory of social norms*, even if it's complete *as a theory of coordination conventions*.

      *   **Point 4: Category Error**
          *   *Devin:* Calling it static is a category error.
          *   *Verdict:* **Devin is wrong.** It's not a category error; it's a legitimate distinction between equilibrium analysis and dynamic analysis.

  4.  **Identify Missing Nuances (What both missed):**
      *   *Common Knowledge vs. Common Belief:* Lewis later acknowledged (and others like Skyrms argued) that "common knowledge" is too strong. "Common belief" or probabilistic belief is more realistic for emergence.
      *   *Precedent:* Lewis relies heavily on *precedent* (past cases) to generate expectations. Mara dismissed "prior expectation" too quickly; Lewis argues precedent *creates* the expectation. But Mara's point about *first-time* emergence stands.
      *   *Normative Force:* Neither discussed *why* people follow norms. Lewis relies on preferences (instrumental rationality). Many social norms involve internalization or normative expectation (Bicchieri's distinction between empirical and normative expectations).
      *   *Signaling:* Communication can bridge the gap between static equilibrium and dynamic emergence (cheap talk), which neither mentioned.

  5.  **Draft the Response:**
      *   *Structure:* Introduction -> Point-by-Point Adjudication -> What They Both Missed -> Conclusion.
      *   *Tone:* Analytical, balanced, authoritative but accessible.
      *   *Key Distinction:* Differentiate between "Lewis's text" (exegesis) and "The phenomenon of norms" (theory).

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Mara wins." Devin has a point about Lewis's specific scope. I need to be precise: Mara wins on *dynamics* and *scope of social norms*, Devin wins on *Lewis's specific textual claims* about coordination. But overall, Mara's critique reflects the modern consensus in game theory/philosophy.

      *Refining the "Conflict of Interest" point:* Devin says conflict-of-interest cases are "different phenomena." This is controversial. Many philosophers (Ullmann-Margalit, Bicchieri) argue norms *solve* conflict. So Devin is defending a narrow definition. I should note that.

      *Refining the "Static" point:* Lewis *does* talk about precedent. Is that dynamic? It's a form of induction, but not a population dynamic model. Mara's call for replicator dynamics is a call for *Evolutionary Game Theory*, which post-dates Lewis. This is a crucial historical context. Lewis wrote in 1969; EGT took off in the 80s/90s. Mara is applying modern tools to an older theory.

  6.  **Final Polish:** Check against the prompt requirements ("who's right about which specific point," "flag anything both missing"). Ensure the distinction between *conventions* (Lewis's target) and *norms* (Mara's target) is clear.

      *(Final check of the "Static" claim)*: Is it a category error? No. Equilibrium concepts are inherently static snapshots. Dynamics require time-indexed strategies or population states. Devin is trying to defend a static definition against a dynamic critique by saying "the static picture implies the dynamic result," which isn't necessarily true (multiple equilibria problem). Mara is right here.

      *(Final check on Focal Points)*: Schelling focal points solve the *selection* problem in a one-shot game with salience. They do not necessarily solve the *learning* problem in a large population without central coordination. Mara is right that focal points $\neq$ convergence dynamics.

      Okay, ready to write.
answer: |-
  This is a classic debate in the philosophy of social science and game theory. It essentially pits a **classical rationalist account** (Lewis/Devin) against a **modern evolutionary/learning account** (Mara).

  Neither speaker "wins" outright because they are arguing past each other on the scope of the theory, but on the specific technical and philosophical claims, the scorecard is uneven. Mara is generally more aligned with the contemporary consensus in game theory, while Devin is more faithful to Lewis's original text but defensive about its limitations.

  Here is the breakdown of who is right on which specific point, followed by what both of them missed.

  ### 1. The "Static vs. Dynamic" Critique
  **Verdict: Mara is right.**

  *   **Mara's Claim:** Lewis's account is static; it describes an equilibrium state but cannot explain the *process* of reaching it (emergence) without presupposing common knowledge.
  *   **Devin's Claim:** Calling it static is a category error; repeated play and reinforcement cover the time element.
  *   **Analysis:** Mara is technically correct. Lewis's definition of convention is an **equilibrium concept**. It specifies the conditions that must hold *once a convention is established* (everyone conforms, everyone expects everyone to conform, etc.). It does not provide a mechanism for how agents update their beliefs to reach that state from a state of ignorance.
      *   Devin's defense that "repeated play" covers this is weak within Lewis's framework. Lewis relies on *inductive reasoning from precedent*, not a dynamic learning model (like replicator dynamics or fictitious play). In Lewis's model, agents are hyper-rational; in Mara's model (and modern EGT), agents are adaptive.
      *   The "common knowledge" requirement is the sticking point. As Mara notes, requiring common knowledge to explain the *origin* of a convention is circular. You need a dynamic model to explain how common knowledge (or common belief) arises from private information.

  ### 2. Focal Points and Equilibrium Selection
  **Verdict: Split (Devin on selection, Mara on convergence).**

  *   **Devin's Claim:** Lewis + Schelling's focal points solve the selection problem via salience, even without shared history.
  *   **Mara's Claim:** Focal points don't explain population convergence or how one convention displaces another.
  *   **Analysis:**
      *   **Devin is right** that Lewis explicitly uses Schellingian salience to solve the *selection* problem (i.e., *why* we drive on the right rather than the left). If a solution is salient, rational agents can coordinate on it in a one-shot interaction.
      *   **However, Mara is right** that salience does not guarantee *population-level convergence*. In a large population without central coordination, "salience" is subjective. If 51% of the population finds Option A salient and 49% finds Option B salient, a focal point doesn't tell us how the system tips to one side. That requires a dynamic model of interaction (which Lewis lacks). Mara is correct that focal points identify *candidate* equilibria, but dynamics determine *which* equilibrium is actually reached.

  ### 3. Pure Coordination vs. Conflict of Interest
  **Verdict: Devin on Exegesis, Mara on Application.**

  *   **Mara's Claim:** Real norms (fairness, promise-keeping) involve conflict of interest; Lewis's framework (pure coordination) doesn't apply.
  *   **Devin's Claim:** Conflict-of-interest cases are a different phenomenon; Lewis only claimed to cover pure coordination.
  *   **Analysis:**
      *   **Devin is right about Lewis's text.** Lewis explicitly restricted his theory to **coordination conventions** (situations where agents prefer to coordinate *somehow* over not coordinating, even if they disagree on *how*). He explicitly excluded moral norms or norms that solve Prisoner's Dilemmas.
      *   **Mara is right about "Social Norms."** In contemporary philosophy and sociology, the term "social norm" almost always includes norms that solve cooperation problems (like fairness or reciprocity), which involve mixed motives or conflict. If the goal is a theory of *social norms* broadly construed, Lewis's account is insufficient. Devin is defending the theory by shrinking the target; Mara is critiquing the theory for failing to hit the actual target.

  ### 4. The "Category Error" Charge
  **Verdict: Devin is wrong.**

  *   **Devin's Claim:** Calling Lewis's account static is a category error.
  *   **Analysis:** It is not a category error; it is a standard distinction in game theory between **equilibrium analysis** (static) and **evolutionary/learning analysis** (dynamic). Criticizing an equilibrium model for not explaining dynamics is like criticizing a map for not showing the speed of the car. It's a valid critique of the model's *explanatory scope*, not a misuse of categories.

  ---

  ### What Both of Them Missed

  While they covered the main battlegrounds, there are three crucial nuances missing from their exchange that would have clarified the debate.

  **1. Common Knowledge vs. Common Belief**
  Both speakers treated "common knowledge" as a monolith. A major development in post-Lewisian philosophy (championed by Brian Skyrms and others) is that **common knowledge is too strong a condition.** Conventions can emerge and sustain themselves with merely *common belief* or even probabilistic expectations. If Devin had conceded that Lewis's "common knowledge" requirement is the weak link (rather than the static nature), he could have saved the theory by updating it to a Bayesian learning model. Mara attacked the static nature, but the epistemic requirement is the bigger hurdle for emergence.

  **2. The Role of Precedent**
  Mara dismissed the "prior expectation" condition as presupposing the conclusion. However, Lewis relies heavily on **precedent** (past cases) to generate those expectations. Lewis's argument is that once a coordination problem is solved *once* (perhaps by chance or salience), that solution becomes a precedent that rationalizes future expectations. Mara's demand for "dynamics" is partially met by Lewis's induction from precedent, though she is right that this doesn't explain the *very first* instance (the "ur-convention") well. Neither discussed how communication ("cheap talk") can bridge the gap between no-convention and precedent.

  **3. Normative Expectations (Bicchieri's Critique)**
  Both treated norms as purely behavioral regularities driven by empirical expectations ("I do X because I expect you to do X"). Cristina Bicchieri, a leading contemporary theorist, argues that social norms require **normative expectations** ("I do X because I expect you to *think I ought* to do X").
  *   Lewis's conventions are sustained by self-interest (instrumental rationality).
  *   Social norms (like fairness) are often sustained by a preference for conformity conditional on the belief that others expect it.
  Neither speaker distinguished between *conventions* (Lewis's target) and *norms* (Mara's target) in terms of motivational structure. This is why Devin could say conflict-of-interest cases are "different phenomena"—he's right that they require a different motivational engine, not just a different game structure.

  ### Summary Scorecard

  | Claim | Who is Right? | Why? |
  | :--- | :--- | :--- |
  | **Lewis is static** | **Mara** | Lewis defines an equilibrium state, not a convergence process. |
  | **Focal points explain selection** | **Devin** | Salience does solve the one-shot selection problem. |
  | **Focal points explain convergence** | **Mara** | Salience doesn't model population tipping or learning dynamics. |
  | **Lewis covers conflict norms** | **Mara** | Lewis's framework fails for mixed-motive games (PD, etc.). |
  | **Lewis claimed to cover conflict** | **Devin** | Lewis explicitly restricted his scope to coordination problems. |
  | **"Static" is a category error** | **Devin is Wrong** | Static vs. Dynamic is a valid distinction in game theory. |

  **Overall:** Mara has the stronger case for a **modern theory of social norms**, as she correctly identifies the need for dynamic models and broader scope. Devin has the stronger case for **Lewis exegesis**, correctly defending what Lewis actually claimed, but he is defending a theory that most game theorists now view as incomplete without evolutionary supplementation.
