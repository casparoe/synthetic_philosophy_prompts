  **Why?**
  Because the $200 is not a reward for being smart. It is a reward for being the *kind of person who doesn't need the $20.* By taking the envelope only, you prove you are that person. By taking both, you prove you aren't.

  Dave isn't betting on what you will *do*. He is betting on who you *are*. If you want the $200, you have to be the Cousin, not the Narrator.

  **Final Answer:** Take the envelope only. Do it fast. Do not think. And for the sake of your relationship, do not explain Newcomb's Paradox to your girlfriend at the next reunion. Just take the money.
