answer: |-
  ### The Structure of Heterogeneous Pleasure

  The pattern you have isolated is the central tension in the philosophy of well-being, often obscured by the convenience of the single word "pleasure." You are describing a structure that is conceptually coherent but ontologically sparse. Below is the carving you requested: the names available, the precise definition required, the reading the evidence favors, and the consequences for the calculus of well-being.

  #### 1. Name and Literature
  The structural pattern you describe—items linked pairwise by different relations without a universal common feature—has an established name: **Family Resemblance** (Wittgenstein, *Philosophical Investigations* §§65–67). However, applying this to *pleasure* specifically is contested.

  *   **What "Family Resemblance" gets right:** It captures the lack of a common essence (no single "pleasure sensation") and the overlapping links (itch→drink→proof→news). It explains why the concept holds together without a definition.
  *   **Where it breaks:** Classical Family Resemblance is descriptive; it explains how we *classify* things. Your pattern includes a *normative* claim: we *trade them off* decisively. Wittgenstein does not typically account for why family-resemblance concepts support rigorous quantitative trade-offs (skipping the drink for the proof). Standard family resemblance suggests vagueness; your cases suggest decisiveness despite vagueness.
  *   **Verdict:** The structural name is established, but its application to *normative trade-offs* is not. You need a term that captures the *functional* unity despite *qualitative* diversity.

  #### 2. Proposed Term and Definition
  Since "Family Resemblance" misses the normative force, I propose adopting a refined term for this specific configuration.

  **Proposed Term:** **Normative Chain-Unity**

  **Definition:** A categorization wherein members lack a universal intrinsic quality but are connected by overlapping relational properties (phenomenological, motivational, or intentional) sufficient to sustain local comparison and global choice despite qualitative heterogeneity.

  This definition applies to your four cases because it allows the link between itch and drink (phenomenological) to differ from the link between proof and news (intentional), while asserting that the chain as a whole supports "global choice" (the trade-off).

  #### 3. Which Reading is Favored?
  The pattern favors **(b): the unity lives in the relations among the cases rather than in a feature of them, so the word is not being used in one and the same sense throughout.**

  *   **Why not (a):** If there were one feature (a specific qualia), introspection should eventually isolate it, or neuroscience should find a unique "pleasure center" activated identically in all four cases. Current evidence suggests different neural substrates for sensory relief (itch/drink) vs. cognitive reward (proof/news). The "slackness" you describe in cross-kind comparison is evidence against a common metric.
  *   **Why not (c):** Reading (c) suggests the theory switched to *something else shared* (e.g., desire satisfaction). But you noted the links *change type* (feeling → doing → object). If it were simply "desire satisfaction," the link would be constant across all four. The fact that the *nature of the link* shifts confirms there is no single shared property, not even a functional one like "desire."
  *   **Why (b):** The decisiveness of the trade-off (skipping the drink for the proof) does not require a common *quality*, only a common *role*. The word "pleasure" marks a functional role ("guide for choice") filled by heterogeneous contents. The sense is not univocal (same quality) but analogical (same role, different fillers).

  #### 4. Consequence for Hedonism and Aggregation
  If the unity is local and relational (Normative Chain-Unity), the classical hedonistic calculus ("maximize the sum of pleasure") loses determinate content **across kinds**, though it retains it **within kinds**.

  *   **Within Kinds:** You can meaningfully say "Proof A > Proof B" because the linking relation (intentional satisfaction) is constant. Aggregation works here.
  *   **Across Kinds:** You cannot say "Drink + News > Proof" in a summative sense. The trade-off you make (skipping the drink) is not a calculation of magnitudes on a single scale, but a contextual prioritization of one *kind* of value over another.
  *   **Cross-Person Comparison:** This becomes virtually impossible. If intra-personal cross-kind comparison is "slack" and relies on contextual choice rather than metric measurement, inter-personal comparison lacks even the anchor of a single subject's preference structure.
  *   **Result:** "More pleasure makes for a better life" must be rewritten as "Better alignment of heterogeneous valences makes for a better life." The metric shifts from *quantity* to *configuration*.

  #### 5. What Would Settle It?
  To discriminate between (a) Hidden Quality and (b) Relational Unity, you need a test that isolates the quality from the context.

  **The Discriminating Test:** **The Qualia Substitution Experiment.**
  *   **Observation/Argument:** Can a subject be induced to accept a substitution of pleasure kinds without loss of satisfaction, provided the "intensity" is matched?
  *   **If Positive:** If agents report equal satisfaction swapping "proof completion" for "itch relief" when told intensities are equal, it supports (a) (there is a common currency).
  *   **If Negative:** If agents report the substitution feels "wrong" or "category-mistaken" despite equal reported intensity, it supports (b) (the unity is in the specific relation, not a transferable quality).
  *   **Current Evidence:** Points to Negative. People do not typically accept sensory relief as a substitute for intellectual achievement, even if "intense." This suggests the value is in the *kind* of relation, not a common magnitude.

