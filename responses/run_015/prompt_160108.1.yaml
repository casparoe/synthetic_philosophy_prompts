answer: |-
  Distinguished guests, members of the press, donors, counsel, and citizens:

  We gather here under a statute that makes no pretense of comfort. You know who sits in the front rows: the families of the disappeared, the tortured, and the killed. You know who sits behind them: former officials of the security apparatus who have applied for amnesty. And you know who stands at the periphery: legal counsel who contend that the very mechanism we are about to operate is unlawful. I acknowledge you all not to harmonize your presence, but to mark the tension that defines this room.

  I am appointed Chair of this Commission. I have written publicly that amnesty is not a moral good. It is not an act of mercy. It does not purchase forgiveness, nor does it guarantee national healing. Those are categories of religion or politics, not of fact-finding. On my view, amnesty is defensible only instrumentally. It is a transaction: the state trades the power to prosecute in exchange for information that prosecution would likely never uncover. We are here to execute that transaction, and to audit its results.

  Our statute departs from the familiar model. Here, amnesty is provisional. It is granted when an applicant testifies, but it is not settled. It lapses automatically if, within ten years, our investigative unit or a public prosecutor establishes that the disclosure was materially incomplete. This is not a pardon; it is a contract subject to ongoing review.

  To the applicants seated here: I must be clear about what you face. You seek finality, but this Commission cannot promise it. The testimony you give today becomes part of the evidentiary record. The more fully you disclose, the more evidence you hand to the very unit tasked with verifying your honesty. If you describe a killing in detail, you confirm the killing occurred. If you name accomplices, you confirm a conspiracy. Should our investigators later find that you withheld the location of a body or the name of a commander, your amnesty will void. You are walking a narrow ridge. Full disclosure risks self-incrimination should your amnesty lapse; partial disclosure risks the lapse itself. I cannot tell you that you are safe. I can only tell you that the statute requires your honesty as the price of your protection.

  To the families in the front rows: I must also be clear about what you may receive. You deserve the truth. But I cannot promise that this Commission will deliver it in its entirety. The structure of this amnesty gives every applicant a reason to disclose as little as possible while still satisfying the minimum threshold. They have an incentive to minimize their role, to obscure chains of command, to stop just short of material incompleteness. We will challenge them. Our investigative unit is well-funded and empowered to dig. But where their silence holds and our evidence runs dry, the record will remain incomplete. You will hear confessions that may feel calculated. You will hear gaps that may feel like insults. We will not paper over those gaps with rhetoric about reconciliation. We will mark them as unresolved.

  This brings me to the investigative unit itself. Some have argued that a robust investigative capacity makes amnesty unnecessary—that if we can find the truth ourselves, we should not trade immunity for it. This is a valid objection. It is possible that our investigators will uncover facts without the help of applicants. In those instances, the justification for amnesty weakens. If we can prosecute, we should. The existence of this unit means that amnesty is not the only path to the record; it is merely one path, and it is in competition with the other. We welcome this competition. If our investigators prove that a crime could have been prosecuted without the applicant's testimony, then the amnesty was unnecessary, and if the testimony was incomplete, it will be voided. We do not fear the redundancy. We fear only the silence.

  To the human-rights lawyers and legal counsel present: I know your position. You hold that amnesty for gross violations of human rights is unlawful under international statutes and that this provisional model does not cure the defect. You argue that the state has a duty to prosecute that cannot be bargained away. We hear you. This Commission does not operate in a legal vacuum. Your scrutiny is not an obstacle to our work; it is a necessary component of the audit. If the courts determine that our grants of amnesty are void *ab initio*, then the prosecutions you seek will proceed. We do not ask you to suspend your legal challenges. We ask only that you allow the record to be built while you argue. If the courts eventually order the records turned over for prosecution, then the instrumental purpose of this Commission will have shifted, but the record itself will remain. We are building an archive, not a temple.

  To the donors and the public: You have funded this institution to uncover the past. Do not expect closure. The past does not close because we hold a hearing. Expect documentation. Expect verification. Expect a process where the truth is contested, not merely recited. The value of this Commission is not in the feelings it generates, but in the facts it establishes. If we do our job, the historical record will be more accurate than it would have been without us. That is the sole metric by which we should be judged.

  We begin this work knowing the contradictions. We know that the promise of immunity induces testimony, but the threat of investigation induces caution. We know that the families need certainty, but the statute offers only conditionality. We know that the law is unsettled, and that our work may be undone by the courts. We proceed not because the path is clear, but because the alternative is a silence that benefits only the perpetrators.

  We will not speak of healing. We will not speak of forgiveness. We will speak of evidence, corroboration, and material completeness. We will treat every application as a claim to be tested, not a gift to be received. We will treat every victim's testimony as a standard against which the applicants are measured. And we will accept that the record we leave may be a record of ambiguity, provided that the ambiguity is documented rather than concealed.

  This is a difficult mandate. It offers no moral shelter for the Chair, no absolution for the applicant, and no guarantee of justice for the victim. It offers only the possibility of a more authoritative account of what happened than would otherwise exist. In a landscape of denial, that is a modest goal. It is also the only one we can honestly pursue.

  Commitment: To pursue an authoritative factual record, even when the evidence required to establish that record invalidates the immunity granted to obtain it.
