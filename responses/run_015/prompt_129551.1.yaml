answer: |-
  You're overseeing a sealed grain silo where a localized mite infestation threatens the stock, but these mites possess a density-dependent biological trigger: if left unchecked, their population explodes exponentially within weeks, leading to a catastrophic resource collapse where billions die slowly via starvation and cannibalism, whereas immediate fumigation kills the current ten thousand instantly but prevents the boom. The scale-sensitive expected-value view calculates the low probability of individual sentience multiplied by the astronomical number of future suffering descendants, concluding that fumigation minimizes total expected disvalue and licensing the kill, while the high-threshold deontological view insists that since we lack greater than 50% confidence in any single mite's sentience, we are too uncertain to justify intentional killing and demand we stop the fumigation despite the impending population crash.

  Here's the breakdown. The scale-sensitive view is doing straight expected-value math: even if the chance a mite feels pain is tiny, say 1%, multiplying that by billions of future starving mites creates a massive bucket of expected suffering. By killing the small current group, you drain that bucket, so the math says "fumigate." The deontological view isn't doing math; it's looking at the permission slip. Because you can't clear the 50% confidence threshold to confirm sentience, you also can't clear the threshold to confirm it's safe to kill them, so the uncertainty itself acts as a veto—you stop to avoid the risk of murder. The structural feature doing all the heavy lifting here is the *density-dependent suffering scaling*: the fact that non-intervention causes the population (and thus total suffering) to skyrocket exponentially. If you remove that feature—say, the mites reproduce slowly and live comfortable lives regardless of density—the scale argument flips back to the usual result. Without the explosion of future suffering, the expected value of killing them outweighs the benefit, and the scale view says "protect the bugs." A defender of the scale argument would attack this case by calling the deontologist's threshold arbitrary and dangerous. They'd argue that when the numbers get this big, "uncertainty" isn't a shield for inaction; ignoring the astronomical suffering of the future billions just to keep your hands clean regarding the current thousands is the real moral failure, making the threshold view look like privilege for the agent rather than protection for the victim.
