answer: |-
  # Activity Design: The Mirror Dilemma
  **Topic:** Superrational Cooperation in the Prisoner's Dilemma
  **Time:** 75 Minutes
  **Participants:** 24 Undergraduates (12 Pairs)
  **Materials:** Printed Decision Sheets (24), Red/Blue Cards or Markers, Projector/Board, Small Prizes (e.g., chocolates or "Rationality Champion" certificates).

  ---

  ## I. Learning Objectives
  1.  **Experiential:** Participants will feel the tension between individual dominance (defecting) and group optimality (cooperating).
  2.  **Conceptual:** Participants will distinguish between *causal* reasoning (my choice doesn't change yours) and *superrational* reasoning (my choice predicts yours because we reason alike).
  3.  **Critical:** Participants will identify the fragility of the "sameness" assumption in real-world contexts.

  ## II. Materials & Setup
  *   **Decision Sheets:** Two versions (Round 1 and Round 2). Both contain the payoff matrix.
  *   **Payoff Matrix (Visible on Projector):**
      *   **Both Cooperate (C, C):** 3 points each.
      *   **Both Defect (D, D):** 1 point each.
      *   **You Defect, They Cooperate (D, C):** 5 points (You), 0 points (Them).
      *   **You Cooperate, They Defect (C, D):** 0 points (You), 5 points (Them).
  *   **Seating:** Arrange chairs in 12 pairs facing each other, but place a divider (folder/book) between them so they cannot see each other's writing.
  *   **Tokens:** Use "Rationality Points" (RP) written on sheets. No money changes hands.

  ---

  ## III. Timeline & Procedure

  ### 0:00 – 0:05 | Introduction (No Theory)
  *   **Facilitator:** "Welcome. We are going to play a simple decision game twice. There is no trick, but the context will change. Your goal is to maximize your own Rationality Points. Do not talk to your partner during the game."
  *   **Handout:** Distribute **Round 1 Sheets**.
  *   **Instruction:** "You are paired with the person across from you. You will not know their choice until the end. Mark **C** (Cooperate) or **D** (Defect). Fold your sheet. Do not show your partner."

  ### 0:05 – 0:20 | Round 1: The Standard Dilemma
  *   **Action:** Participants make their choice silently (3 mins).
  *   **Collection:** Collect sheets. Do not reveal results yet.
  *   **Shuffle:** Facilitator shuffles sheets to break the physical link for the next round (psychological reset).
  *   **Wait:** Keep scores secret to prevent immediate regret/justification influencing Round 2.

  ### 0:20 – 0:30 | Transition: Framing Round 2
  *   **Handout:** Distribute **Round 2 Sheets**.
  *   **The Twist (Crucial Script):**
      > "In Round 1, you treated your partner as a separate person whose choice was out of your control. In Round 2, the pairing is new (randomized). However, I want you to consider a different premise.
      >
      > Look around. Everyone in this room has the same handout. Everyone heard the same instructions. Everyone is equally smart. In this round, assume your partner is your **Logical Twin**.
      >
      > They are not a stranger; they are another instance of 'You' in this room. If you find a reason to Cooperate, they find the same reason. If you find a reason to Defect, they find the same reason. You cannot communicate, but your reasoning process is identical. Make your choice based on this symmetry."
  *   **Action:** Participants write their choice (5 mins). Encourage them to write a one-sentence justification on the back to reinforce the "reasoning" aspect.
  *   **Collection:** Collect sheets.

  ### 0:30 – 0:40 | Scoring & Reveal
  *   **Calculation:** Facilitator (or TAs) quickly tally scores.
  *   **Display:** Project a histogram of Round 1 vs. Round 2 choices (e.g., "Round 1: 80% Defect. Round 2: 50% Defect").
  *   **Awards:** Announce top 3 scorers overall. Give prizes.
  *   **Transition:** "Now that you have felt the pull of both rounds, let's analyze what happened."

  ### 0:40 – 1:15 | Debrief & Theory Mapping
  *(See Section V for detailed script)*

  ---

  ## IV. Rules & Scoring Details
  1.  **Anonymity:** In Round 1, emphasize anonymity. In Round 2, emphasize *symmetry* over anonymity.
  2.  **No Communication:** Strict silence during decision phases.
  3.  **Scoring:**
      *   Tally points per round.
      *   Total RP = Round 1 + Round 2.
      *   **Tie-breaker:** If multiple students have the same high score, the one who Cooperated in Round 2 wins (to incentivize the target behavior without revealing it beforehand).
  4.  **Cheating:** If a student asks "What should I do?", answer: "What does rationality demand?"

  ---

  ## V. Debrief Guide (35 Minutes)

  ### 1. The Phenomenology of Choice (10 mins)
  *   **Ask:** "Raise your hand if you Defected in Round 1. Why?"
      *   *Expected Answer:* "I wanted the 5 points," "I was afraid they'd defect and I'd get 0," "Defecting is safer."
  *   **Ask:** "Raise your hand if you changed your choice in Round 2. Why?"
      *   *Expected Answer:* "The 'Logical Twin' thing made me think," "If I defect, they defect, so we both get 1. If I cooperate, we both get 3."
  *   **Map:** Write two columns on the board: **Round 1 Mindset** vs. **Round 2 Mindset**.
      *   Round 1: "My choice is independent."
      *   Round 2: "My choice correlates with theirs."

  ### 2. Introducing the Theory (15 mins)
  *   **Causal Decision Theory (CDT):** Explain that Round 1 relied on standard causal reasoning.
      *   *Logic:* "My choice cannot physically reach across the table and change their card. Therefore, regardless of what they do, I am better off Defecting (5 > 3 and 1 > 0)."
      *   *Result:* Dominance leads to (D, D) = 1 point each.
  *   **Superrationality (Hofstadter):** Explain that Round 2 attempted to trigger superrational reasoning.
      *   *Logic:* "We are identical rational agents facing identical problems. My reasoning *is* their reasoning. I am not choosing between C and D; I am choosing between (C,C) and (D,D)."
      *   *Result:* (C,C) = 3 points each is superior to (D,D) = 1 point each.
  *   **Key Distinction:** In CDT, the correlation is zero. In Superrationality, the correlation is 1 (perfect correlation of reasoning).

  ### 3. Limitations & Critique (10 mins)
  *   **The "Magic" Problem:** Acknowledge that telling someone "assume you are twins" does not make them twins.
  *   **Heterogeneity:** In the real world, people reason differently. Some are altruistic, some are spiteful, some are confused.
  *   **The Risk:** If I reason superrationally (Cooperate) but my partner reasons causally (Defect), I get 0. Superrationality requires *common knowledge* of superrationality.
  *   **Discussion Question:** "Is it rational to be superrational if you aren't sure the other person is?"

  ---

  ## VI. Anticipated Problems & Management

  | Problem | Likelihood | Management Strategy |
  | :--- | :--- | :--- |
  | **Cynicism in Round 2** | High | Students may view the "Logical Twin" instruction as a trick to make them cooperate. **Fix:** In the debrief, validate this. Admit that without *actual* identicality, the instruction is an aspiration, not a fact. |
  | **Confusion on Payoffs** | Medium | Students might misread the matrix. **Fix:** Walk through one example on the projector before Round 1 starts ("If I mark C and you mark D..."). |
  | **Collusion/Talking** | Low | Friends sitting together might signal. **Fix:** Use dividers. If caught, disqualify from prizes but keep them in the discussion (their data is still useful). |
  | **Defection Dominates Both** | Medium | If the group is highly competitive, Round 2 may still yield high defection. **Fix:** Use this as a teaching moment. "Why didn't the instruction work? Because you didn't believe the 'twin' premise." This proves the theory's dependency on belief. |
  | **Time Overrun** | High | Debriefs can drift. **Fix:** Keep strict time. Use a visible timer. Cut the "Awards" section short if needed to preserve the theoretical mapping. |

  ---

  ## VII. Limitations of the Activity (Instructor Notes)
  *This section is for the instructor to acknowledge what the game **cannot** do, to be shared during the final 5 minutes.*

  1.  **No Actual Causal Link:** The activity cannot create a magical link where choosing C *causes* the other to choose C. It relies on *logical* correlation, which feels weaker than causal correlation. The discussion must supply the philosophical weight of why logical correlation matters to a rational agent.
  2.  **One-Shot vs. Iterated:** This is a one-shot game. In real life, reputation and iteration often solve the PD without needing superrationality. Students might argue "Just play it again." The instructor must clarify that superrationality is specifically for *one-shot* scenarios where reputation is impossible.
  3.  **The "Cluster" Assumption:** Superrationality works best if you know you are in a group of superrationalists. In a mixed group (some CDT, some Superrational), the Superrationalists get exploited. The activity assumes a homogeneous group; the discussion must highlight that this homogeneity is rare in the wild.

  ---

  ## VIII. Handout Text (Excerpt for Round 2)
  **ROUND 2: THE MIRROR PROTOCOL**
  *   **Partner:** Assigned Randomly.
  *   **Condition:** You and your partner are in the **Exact Same Situation**.
  *   **Instruction:** Assume your partner is using the **Exact Same Reasoning Process** as you.
  *   **Question:** If your logic leads you to **Cooperate**, it will lead them to **Cooperate**. If your logic leads you to **Defect**, it will lead them to **Defect**.
  *   **Decision:** Knowing your choice and their choice will match, which outcome do you prefer?
      *   [ ] **Cooperate** (We both get 3)
      *   [ ] **Defect** (We both get 1)
