answer: |-
  Here are ten questions arranged in five thematic blocks. Each question includes the specific follow-up you should ask based on her most likely response. The sequence is designed to make the "that's a sanction story" deflection progressively harder to sustain, culminating in a case where no sanction exists, and closing with a demand for falsifiability.

  ### Block 1: Scale and Knowledge
  *Goal: Challenge the "Common Knowledge" requirement in a large organisation without using philosophical jargon.*

  **Question 1**
  In a company of four thousand engineers, I don't know what half the company is doing, let alone what they expect the other half to do. Lewis requires "common knowledge"—that everyone knows that everyone knows. In our scale, that seems impossible. If we replace "common knowledge" with just "overlapping expectations"—I expect my team to do X, they expect their team to do X—does that still distinguish a convention from a mass habit, or does the definition break at this size?

  **Follow-up 1**
  *(If she says overlapping expectations are sufficient)*: If it's just overlapping expectations, what stops this from being a description of a mass habit, like everyone indenting with tabs because their editor ships with tabs as the default? Where is the coordination payoff in that case, versus just shared configuration?

  **Question 2**
  Let's take that editor default example. If everyone uses tabs because VS Code ships that way, nobody is coordinating; we're just reacting to the same tool. But if we switch to spaces because we expect *others* to read our code, that's coordination. At what point does a shared default become a convention? Is it the moment I change my settings to match you, even if I prefer tabs?

  **Follow-up 2**
  *(If she says it becomes a convention when you change settings)*: So the convention isn't the tabs, it's the "matching." But if I match you to avoid merge conflicts, isn't that just a technical constraint? If the cost of mismatch is a broken build rather than a failed coordination, is it still a convention, or just a dependency?

  ### Block 2: Content and Arbitrariness
  *Goal: Challenge the "Alternative Regularity" requirement using norms with moral or security content.*

  **Question 3**
  Your theory relies on there being an alternative regularity that would have worked just as well—like driving on the left instead of the right. But take security norms: "Do not commit credentials." There is no alternative regularity here; we can't coordinate on *committing* credentials. Does your account exclude norms that have content, or do you classify security rules as something other than conventions?

  **Follow-up 3**
  *(If she says security rules are sanction stories, not conventions)*: If security rules aren't conventions because the alternative doesn't work, then a huge part of our culture—access control, PII handling, prod access—is outside your model. Are you conceding that convention theory only explains the arbitrary stuff, like where we put braces?

  **Question 4**
  Let's look at code review. "Do not bypass code review" feels like a security rule, but we *could* coordinate on a system where senior engineers self-merge. If we all agree self-merging would be faster but stick to review because we expect others to, is that a convention? Or does the risk of bugs make the alternative "not work equally well," kicking it out of convention territory again?

  **Follow-up 4**
  *(If she says it's a convention because self-merging is theoretically possible)*: If the risk of bugs makes self-merging costly, then my preference to conform depends on the *quality* of the code, not just your conformity. If I conform because I want high quality, not because I want to match you, isn't that just a shared goal, not a coordination equilibrium?

  ### Block 3: Incentives and Public Goods
  *Goal: Challenge the "Preference to Conform" clause using Free-Rider problems.*

  **Question 5**
  In Lewis's model, I prefer to conform *on the condition* that you conform. But with testing, I'd prefer you write tests while I skip them to save time. That's a free-rider problem, not a coordination problem. Can your "preference to conform" clause actually reach cases where everyone wants everyone else to do the work, but no one wants to do it themselves?

  **Follow-up 5**
  *(If she says testing becomes a convention once the norm is established)*: What changed? The payoff matrix hasn't changed; I still save time by skipping. If the only thing stopping me is social pressure or CI checks, aren't we back to a sanction story? Where did the coordination preference come from?

  **Question 6**
  If the only reason I write tests is that I'll get flagged in a retro if I don't, that's fear of blame. If the only reason is that the CI pipeline requires coverage, that's a hard constraint. Is there any remaining territory for "convention" here? Or is "engineering culture" just a layered stack of constraints and sanctions with no coordination layer underneath?

  **Follow-up 6**
  *(If she says there is still a coordination layer)*: Can you give me an example of a norm where I genuinely prefer to do the work *because* you are doing it, where there is no sanction, no constraint, and no free-rider incentive? I'm struggling to find one that isn't just arbitrary formatting.

  ### Block 4: Enforcement and Lock-in
  *Goal: Challenge the boundary between Imposition and Convention.*

  **Question 7**
  A staff engineer wrote our style guide, and a linter enforces it in CI. The build goes red if I violate it. You've called similar cases "sanction stories." But once the linter is there, we all coordinate around it. Is an imposed standard a convention? If yes, doesn't that mean anything backed by sanctions is a convention, which dilutes the term? If no, where is the line between precedent and imposition?

  **Follow-up 7**
  *(If she says it becomes a convention once people coordinate around the imposition)*: So the linter is the sanction, but the *choice* of linter rules is the convention? If so, does an imposed rule quietly become a convention once the initial enforcement fades and people just follow it out of habit? At what exact point does the switch flip?

  **Question 8**
  Consider our config blobs. Everyone privately thinks they're bad. We are stuck in a bad equilibrium. Your account explains why we are stuck (coordination cost), but what distinguishes "we are stuck and would all rather switch" from "this is fine"? And more importantly, what *breaks* a convention in your account? Does it require an external shock, or can a convention dissolve from the inside?

  **Follow-up 8**
  *(If she says it requires an external shock or focal point)*: If conventions can't dissolve from the inside even when everyone dislikes them, then your model predicts engineering culture is inherently conservative. Are you claiming that without a manager or a crisis to act as an external shock, a team can never coordinate on a better local optimum?

  ### Block 5: Meta-Rules and Falsifiability
  *Goal: Remove the possibility of the "Sanction" deflection, then demand empirical failure conditions.*

  **Question 9**
  Our org has an explicit second-order rule: "Whenever a decision is arbitrary, adopt the framework's default." We could have chosen "discuss everything" or "flip a coin." We chose "follow defaults." There are no sanctions for this; no build fails if you debate a default. It is purely a convention for selecting conventions. Can your account handle a convention whose content is a procedure? And does the arbitrariness requirement inherit upward—could there have been a different meta-rule that worked as well?

  **Follow-up 9**
  *(If she tries to call this a sanction story)*: I need to be clear: there is no sanction. No linter, no retro, no manager. It is enforced by nothing at all. It persists solely because we expect others to use it to avoid decision fatigue. If you call this a sanction story, the term "sanction" loses all meaning. If you agree it's a convention, doesn't this prove that coordination exists independently of enforcement, contradicting your earlier deflections?

  **Question 10**
  Finally, I want to know what evidence could count against your view. If we saw a migration succeed without a focal point, or a norm flip overnight without precedent, or a team that never converged despite high incentives—what specific observation of a real engineering organisation would make you abandon or substantially revise the claim that convention-plus-precedent is the right story for all of this?

  **Follow-up 10**
  *(If she gives a vague answer about "accumulated evidence")*: I need a concrete failure case. If I showed you a team that successfully coordinated on a non-arbitrary norm (like security) without any alternative regularity ever being possible, would that falsify the arbitrariness clause? Or is the theory flexible enough to absorb any outcome by reclassifying it as a "sanction story" or "expectation"?
