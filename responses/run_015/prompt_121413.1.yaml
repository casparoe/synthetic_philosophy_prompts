answer: |-
  **JOINT STATEMENT ON PREDICTIVE PROCESSING AND ECOLOGICAL COUPLING**

  **I. Substantive Claims**

  1.  Organisms are physical systems that maintain stability far from thermodynamic equilibrium.
  2.  Sensory input underdetermines the environmental causes of that input; ambiguity is inherent to the signal.
  3.  Action inevitably alters subsequent sensory input; perception and action are looped.
  4.  Standard neural data (mismatch responses, repetition suppression, attenuation of self-produced sensation) are consistent with both the Prediction-Error and Coupling frameworks.
  5.  Citing these data as decisive evidence begs the question unless the computational model is specified independently of the neural response.
  6.  A framework's ability to describe phenomena from cortex to gene regulation increases its explanatory range but simultaneously increases its risk of unfalsifiability.
  7.  Individuation—what counts as a single agent versus a background environment—is a core problem both frameworks must solve, not merely presuppose.
  8.  Attention consists in the modulation of processing priority, though the mechanisms differ.
  9.  Computational description (what function is performed) does not entail mechanistic implementation (how the hardware performs it).
  10. Pathology should be understood as a breakdown in adaptive regulation, whether framed as model failure or coupling breakdown.
  11. Both frameworks agree that behavior is not random; it exhibits structured regularity over time.
  12. Neither framework currently offers a complete account of how semantic content or meaning arises from physical processes.

  **II. Disagreements Table**

  | Disputed Proposition | Prediction-Error Formulation | Coupling Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **Internal Models** | The brain necessarily implements hierarchical generative models to infer causes of sensation. | Talk of internal models is either a vacuous redescription of lawful coupling or straightforwardly false. | Substantive |
  | **Perception** | Perception is controlled hallucination; experience is shaped by top-down predictions minimizing error. | Perception is direct pickup of affordances; experience is shaped by lawful resonance with the environment. | Substantive |
  | **Markov Blanket** | The statistical boundary (blanket) derives and constitutes the individual agent ontologically. | The statistical boundary presupposes the individual agent; it is drawn by the observer, not nature. | Substantive |

  *Note on Collapsed Row:* We initially included a row on "Goal-Directedness." The Prediction-Error side defined this as "minimizing variational free energy," while the Coupling side defined it as "maintaining viable coupling." Upon refinement, we agreed that both definitions reduce to "maintaining non-equilibrium stability." Consequently, this row was deleted. The dispute was merely verbal: both sides agree organisms act to stay alive, but disagree on whether describing this as "error minimization" adds explanatory power.

  **III. Cruxes and Adjudicating Cases**

  **Crux 1: The Quiet-Room Preparation**
  *Question:* Does action persist when sensory prediction is perfectly satisfied and homeostatic needs are clamped?
  *Case:* A larval animal is placed in a closed-loop virtual arena. One motor routine renders the exteroceptive stream perfectly constant (no optic flow, no transients). Homeostatic variables (hunger, temperature, oxygen) are clamped externally.
  *Prediction-Error Side:* The animal will disrupt the constancy. Its generative model includes priors for active exploration; perfect stasis is surprising relative to the prior of "being an active agent." It will move to minimize long-term expected error.
  *Coupling Side:* The animal will cease goal-directed action. Action exists to regulate coupling relative to needs. With needs clamped and coupling stable, no affordances demand action. Any movement will be random noise.
  *Concessions:* If the animal remains perfectly still, the Prediction-Error side concedes that error minimization does not drive action in the absence of physiological need. If the animal systematically disrupts the stasis, the Coupling side concedes that internal dynamics drive action independently of environmental affordances.

  **Crux 2: The Blanket-Shuffling Test**
  *Question:* Does the statistical boundary pick out the agent, or does the agent pick out the boundary?
  *Case:* Take a system agreed to be a single agent (e.g., a eusocial colony or a distributed plant). Analyze the system to locate the Markov blanket (the statistical partition separating internal states from external states).
  *Prediction-Error Side:* There is a unique or narrowly constrained statistically optimal blanket that minimizes complexity. This partition identifies the agent.
  *Coupling Side:* There are many admissible blankets depending on the scale of observation. The partition is pragmatic, not ontological. One needs the agent first to draw the blanket afterwards.
  *Concessions:* If boundaries are entirely arbitrary with no statistical privilege, the Prediction-Error side concedes the blanket does not constitute individuation. If there is a single statistically privileged boundary matching folk intuition, the Coupling side concedes the boundary is natural, not pragmatic.

  **Crux 3: Neural Signal Identification**
  *Question:* Can a neural signal be identified as carrying prediction error rather than surprise, salience, or mere change without circular appeal to the framework?
  *Case:* An oddball paradigm where physical stimulus deviation is held constant, but expectation is manipulated independently (e.g., via cue validity) across blocks.
  *Prediction-Error Side:* The neural signal magnitude will scale with the precision-weighted prediction error. If the change is fully predicted (high validity), the signal will vanish despite physical change.
  *Coupling Side:* The neural signal magnitude will scale with physical deviation or task-relevance. If the change is physically present, the signal will persist regardless of prediction.
  *Concessions:* If the signal persists despite full prediction, the Prediction-Error side concedes the signal is not purely error-based. If the signal vanishes despite physical change when predicted, the Coupling side concedes that internal expectation modulates early sensory processing beyond mere salience.

  **IV. Closing Commitment**

  We sign this document acknowledging that our positions are currently underdetermined by the available evidence. We commit to treating the cases above as constructible and binding. If the results favor one side, the other agrees to revise their core claims regarding mechanism, not merely terminology. We agree that the ambition of universal scope is a virtue only if it survives these specific falsification attempts.
