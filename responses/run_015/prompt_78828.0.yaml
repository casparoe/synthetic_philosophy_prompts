      *(Self-Correction)*: I should be careful not to simply validate Maya as "Dennett's mouthpiece" because her early arguments are verificationist, which Dennett might critique too. Dennett isn't a verificationist; he's a functionalist/eliminativist about qualia. I need to make sure the student understands that distinction. Maya says "no observation distinguishes them" (verificationist). Dennett says "the distinction presupposes a theater that doesn't exist" (ontological/functionalist). This is a crucial nuance for the paper.

