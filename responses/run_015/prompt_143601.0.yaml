prompt: |-
  You are grading a philosophy exam on early modern defenses of women's study. The prompt asked: "In her defense of women's education, Sor Juana argues that ignorance is not a Christian virtue and answers the objection that study distracts from domestic and devotional duties. Reconstruct her argument that the rational soul requires intellectual exercise—note her appeals to scriptural and historical examples, and her use of the Thomistic principle that an unactualized intellectual potency is imperfect. Then explain her reply to the domestic-duty objection: does she deny the value of domestic work, or reconceive its relation to study? Finally, identify whether she treats the desire to learn as a natural inclination that positive social law wrongly suppresses, and state the philosophical principle she invokes to separate legitimate study from vanity."

  Below is a student answer. Grade it with a letter (A–F) and provide point-by-point comments that justify the score. Note what is correct about the more visible claims, then flag any subtle mistakes—such as a conflated theoretical framework, a misattributed view about authority or natural law, or a logical step that does not actually belong to her argument—without penalizing correct material or inventing errors. Do not open with a general summary of the correct answer; keep your assessment anchored to the student’s specific sentences. If there are no obvious howlers, say so briefly.

  Student answer:

  "Sor Juana holds that women must be educated because they have rational souls identical to men’s, which means ignorance can never be a virtue for them. She cites learned women in scripture—such as St. Catherine of Alexandria—to prove that divine approval extends to female study. She applies a Thomistic idea: the intellect is a potency that needs actualization, and leaving a woman’s mind idle renders her soul imperfect in a way that does not apply to male souls, since women’s intellectual nature is more fragile. To the domestic-duty objection, she responds that household labor is intellectually deadening and that women with a scholarly vocation should therefore be released from it. She also gives a reductio: if ignorance were truly virtuous, then bishops and priests ought to remain ignorant, which is absurd. Her fundamental principle is that education is a positive law granted by ecclesiastical authority, so if the Church withdraws permission, the entitlement vanishes. This shows her argument depends on institutional approval rather than on nature, and it anticipates Wollstonecraft’s modern demand for state-enforced equality in schooling."
