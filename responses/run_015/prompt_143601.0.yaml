      *   *Sentence 3:* "She applies a Thomistic idea: the intellect is a potency that needs actualization, and leaving a woman's mind idle renders her soul imperfect in a way that does not apply to male souls, since women's intellectual nature is more fragile."
          *   *Assessment:* **Major Error.** Sor Juana uses the Thomistic principle (unactualized potency is imperfect), BUT she argues this applies to *all* rational souls, not just women. She explicitly argues *against* the idea that women's souls are different or inferior in capacity. Saying it renders her soul imperfect "in a way that does not apply to male souls" contradicts her core argument for equality of rational capacity. Saying women's intellectual nature is "more fragile" is also contrary to her argument (she argues against natural inferiority).
      *   *Sentence 4:* "To the domestic-duty objection, she responds that household labor is intellectually deadening and that women with a scholarly vocation should therefore be released from it."
