          *   Junie's philosophy ultimately grants *permission* rather than *direction*.
          *   Suggest listening to the wife/embryologist. Junie would likely say "You're not doing wrong either way."

  5.  **Refining the Tone:**
      *   Must be compassionate but analytical.
      *   Avoid judging the "ghoulish" aspect too harshly, but acknowledge the wife's wisdom.
      *   Ensure the philosophical distinctions (Non-Identity, Asymmetry, Person-Affecting) are clear without being jargon-heavy.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Junie says X." I need to show *why* based on the 8 cases provided. Case 6 is the smoking gun. Case 1 is the boundary condition.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Which rule is doing the work? (Person-Affecting/Asymmetry).
