answer: |-
  There is no established single concept in the literature that captures this specific triad and the asymmetry of ignorance you describe. The nearest neighbors are the principle of **Fair Play** (Hart, Rawls), which explains the resentment in Case 1 but not the asymmetry with Case 2; **Lewisian Convention**, which explains the coordination in Case 3 but treats all deviations as equally irrational; and **Culpable Ignorance**, which you have correctly noted fails here because the ignorance is not always traceable to prior fault.

  To carve this phenomenon, I propose the term **The Asymmetry of Exculpatory Ignorance**.

  Below is the definition, the boundary conditions, the mechanism regarding foreignness, and the normative implications.

  ### 1. The Definition
  **The Asymmetry of Exculpatory Ignorance** is the normative phenomenon wherein an agent's ignorance of a local rule is accepted as an excuse only when the violation of that rule does not align with the agent's self-interest *and* does not impose a salient cost on others.

  The asymmetry rests on two variables:
  1.  **Direction of Deviation:** Does the behavior benefit the agent (under-compliance) or cost the agent (over-compliance)?
  2.  **Externality:** Does the behavior impose a net cost on the participants in the practice?

  Your three cases map onto this matrix as follows:
  *   **Case 1 (Under-compliance/Tip):** Benefits agent (saves money); Imposes cost (server loses income). **Result:** Ignorance is *not* exculpatory. Resentment.
  *   **Case 2 (Over-compliance/Tip):** Costs agent (loses money); Benefits/Neutral for observer. **Result:** Ignorance *is* exculpatory. Amusement.
  *   **Case 3 (Over-compliance/Walk):** Costs agent (time/effort); Imposes cost (coordination friction). **Result:** Ignorance is *partially* exculpatory (no moral resentment), but the act is sanctioned as a nuisance.

  ### 2. The Carving: Distributive vs. Coordinative Conventions
  The reason the asymmetry exists is that not all conventions do the same normative work. You must distinguish between **Distributive Conventions** and **Coordinative Conventions**.

  *   **Distributive Conventions** (Case 1) govern the allocation of benefits and burdens within a practice. Tipping in the US is not merely a signal; it is a mechanism of wage distribution. To violate it is to consume a good without bearing its agreed-upon cost.
  *   **Coordinative Conventions** (Cases 2 & 3) govern the *manner* of interaction to ensure smooth functioning. Tipping in non-tipping cultures is symbolic; jaywalking norms are about flow.

  **The Edge of the Phenomenon:**
  The asymmetry of exculpatory ignorance holds firm within Coordinative Conventions (ignorance is excused because the deviation is self-sacrificing). It collapses within Distributive Conventions (ignorance is *not* excused even if the agent is foreign, because the deviation is self-serving and harmful).

  This explains why your initial diagnosis ("non-conformity is legible as taking advantage") is correct but requires this structural underpinning. It is not merely about legibility; it is about the **Presumption of Strategic Rationality**. Observers presume agents are rational maximizers.
  *   If you break a rule to save money (Case 1), you look like a rational maximizer exploiting a gap. Ignorance is treated as **willful blindness** because you had a motive to know.
  *   If you break a rule to lose money (Case 2), you look irrational. Ignorance is the only plausible explanation.
  *   If you follow a rule to the detriment of the group (Case 3), you look like a **rigid optimizer** of a different norm (law/safety) at the expense of the local coordination. You are not a free rider, but you are a **drag on the system**.

  ### 3. The Boundary of Foreignness
  You asked whether perceptible foreignness makes the ignorance reading *available* or makes the ignorance itself *non-culpable*.

  The answer is: **It modulates the Duty to Inquire, but only within Coordinative Conventions.**

  *   **Mechanism:** This is **Culpability of Acquisition**, not mere availability.
      *   **Visible Tourist:** The cost of acquiring local knowledge is high (they couldn't reasonably know). The duty to inquire is low.
      *   **Resident/Returner:** The cost of acquiring knowledge is low (they have had time). The duty to inquire is high.

  *   **The Interaction with Distributive Conventions:**
      In Case 1 (US Tipping), the tourist is *still* resented ("He should have found out"). Why? Because Distributive Conventions carry a **Universal Duty of Due Diligence**. When a practice involves the transfer of resources (wages), the burden shifts to the participant to ascertain the terms *before* participating. The harm is too salient to allow the "tourist excuse."
      In Case 2 (Non-US Tipping), the harm is negligible. The "tourist excuse" functions fully because the cost of the error is borne by the tipper, not the server (who returns it).

  **Test Case for this Boundary:**
  Imagine a visitor from a right-hand traffic country drives on the left in a left-hand traffic country (Coordinative/Distributive hybrid: safety/resource allocation).
  *   If they drift slightly (Coordinative): Excused as confusion.
  *   If they cause an accident (Distributive/Harm): Not excused. The duty to know the traffic laws is universal for drivers, regardless of foreignness, because the potential harm is high.
  *   *This confirms:* Foreignness excuses ignorance only when the **Stakes of Error** are low. When the stakes involve distributive harm, foreignness does not lower the Duty to Inquire.

  ### 4. Normative Implications: Moral Obligation or Fairness?
  You asked if this tells us whether everyday conventions are moral obligations.

  The asymmetry reveals that **conventions are not morally binding in virtue of being conventions.** They are morally binding only when they underwrite a **Scheme of Fairness**.

  *   **Case 1 is a Moral Obligation:** The resentment is not just "you broke a rule." It is "you took advantage of us." The convention (tipping) has been moralized into a **Duty of Fair Play**. The visitor is bound not because they are in America, but because they are accepting the benefit of the service without the burden. The obligation is to the *persons* (the server), mediated by the convention.
  *   **Case 2 is not a Moral Obligation:** There is no duty to *not* tip. The reaction is embarrassment because the visitor has violated a **Duty of Fit**. They have signaled that they do not understand the social grammar, but they have not violated anyone's rights.
  *   **Case 3 is a Prudential Obligation:** The irritation is not moral resentment; it is **coordination friction**. The walker is not unfair; they are inefficient.

  **Conclusion on the Visitor's Duty:**
  There is no uniform answer to whether visitors must follow local conventions. The duty depends on the **function** of the convention:
  1.  If the convention sustains a **Distributive Scheme** (wages, queueing for scarce resources, reciprocal exchange), the visitor has a **Moral Duty to Comply**. Ignorance is not an excuse because the duty is to the other participants, not the rule.
  2.  If the convention is purely **Coordinative/Symbolic** (greetings, tipping where wages are living, dress codes), the visitor has a **Prudential Duty to Inquire**, but ignorance is exculpatory. Violation is a faux pas, not a wrong.

  ### 5. Summary of the Carving
  *   **Phenomenon:** The Asymmetry of Exculpatory Ignorance.
  *   **Core Distinction:** Distributive Conventions (Fairness) vs. Coordinative Conventions (Fit).
  *   **Mechanism:** Presumption of Strategic Rationality. Self-serving deviations are read as defection; self-sacrificing deviations are read as error.
  *   **Foreignness Boundary:** Foreignness lowers the Duty to Inquire only when the Stakes of Error are low (Coordinative). When Stakes are high (Distributive/Harm), the Duty to Inquire is universal.
  *   **Normative Status:** Resentment indicates the convention has been moralized into a Duty of Fair Play. Absence of resentment indicates the convention remains a Duty of Fit.

  This carving preserves your intuition that the asymmetry is about "taking advantage" but locates the source of that advantage in the **distributive structure** of the practice rather than the mere fact of non-conformity.
