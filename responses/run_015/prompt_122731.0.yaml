answer: |-
  **Specification for an Adequate Account of Anachronism**

  1.  **Conceptual Accessibility Threshold** (Motivated by *Unavailable-concept*): Must distinguish *culpable moral blindness* (blameworthy) from *conceptual impossibility* (excusable), defining whether latency permits construction without innovation. [Non-negotiable]
  2.  **Dissent Significance** (Motivated by *Few-did*): Must distinguish whether contemporaneous dissent renders a norm universally *obligatory* or merely *supererogatory* for the majority. [Non-negotiable]
  3.  **Epistemic Distortion Correction** (Motivated by *Archive-silence*): Must differentiate *ontological absence* of dissent from *archival suppression* when assessing an agent's epistemic access. [Non-negotiable]
  4.  **Collective Epistemic Agency** (Motivated by *Collective-agent*): Must distribute *moral responsibility* across institutional structures without requiring individual omniscience of the collective. [Non-negotiable]
  5.  **Temporal Asymmetry Justification** (Motivated by *Temporal-symmetry*): Must explain why the *propriety of blaming* flows forward without validating reciprocal future judgment, or enforce symmetry. [Camp Preference]
  6.  **Uptake Relevance** (Motivated by *Retrospective-uptake*): Must separate the *historical validity* of a condemnation from the *political legitimacy* conferred by descendant endorsement. [Non-negotiable]
  7.  **Reflexive Stability** (Motivated by *Self-application*): Must permit judgment using contingent standards without collapsing into skepticism about the *propriety of blaming* at all. [Non-negotiable]

  **Unsatisfiable Subset:** Requirements 5 (Asymmetry) and 7 (Reflexivity) cannot be jointly satisfied if admitting the contingency of our standards (7) undermines the privilege required to judge the past without reciprocal liability (5).

  **Single Requirement Doing Most Work:** Requirement 1 (Conceptual Accessibility Threshold) excludes both crude presentism (all concepts available) and hard contextualism (only explicit concepts available).

  **Strict contextualism:** Judges actors only by norms explicit in their horizon, risking paralysis on systemic evils unrecognized then.
  **Relativism-of-distance:** Grades judgment severity by temporal proximity, privileging empathy over evaluation as distance grows.
  **Thoroughgoing presentism:** Applies current moral truths retroactively, treating history as a courtroom for contemporary vindication.
