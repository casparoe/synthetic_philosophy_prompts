prompt: |-
  I cover the philosophy and cognitive science beat for a magazine, and a few weeks ago I sat in on a talk at a conference that's been quietly driving me crazy ever since. The speaker was making the case for evolutionary debunking in metaethics — the idea that once you see where our moral intuitions came from, you should stop treating them as evidence of anything. I walked out convinced. Then on the flight home I started poking at it and realized the same structure seems to take down way more than morality, and now I can't tell if the argument is too strong or if I'm just missing an obvious move.

  Here's the argument as I reconstructed it from my notes:

  (1) Our core moral intuitions — things like "hurting innocent people for fun is wrong" — were shaped by natural selection. Evolution favored whatever gut-level moral responses helped our ancestors cooperate, avoid getting punished, and pass on genes. It didn't favor responses that track some independent moral truth, because from a fitness perspective all that matters is the behavior, not whether the belief behind it is true.

  (2) If a belief was produced by a process that doesn't track the truth about its subject matter, then that belief is unjustified unless you have some independent reason to think it's true. And "it feels obvious" or "everyone agrees" doesn't count as independent.

  (3) So our core moral beliefs are unjustified. Moral realism is in trouble — we can't treat our moral intuitions as evidence of moral facts.

  Fine. But here's what hit me at 30,000 feet:

  (4) Our perceptual beliefs — that there's a laptop in front of me, that the person next to me is speaking French — were also shaped by natural selection. Evolution didn't select for perceptual systems that track reality as it really is; it selected for systems that help organisms survive and reproduce. A frog's visual system doesn't represent flies "veridically" in some deep metaphysical sense, it represents them as edible moving dots. Why think our own perceptual systems are different in kind rather than just in degree?

  (5) Our mathematical and logical intuitions — that 2+2=4, that modus ponens is valid — were also shaped by cognitive structures that evolution built. We didn't evolve to do set theory; we evolved to track approximate quantities of food and predators and to reason about social exchanges. The fact that these capacities later got repurposed for abstract math doesn't change where they came from.

  (6) If premise (2) is right, then our perceptual and logical beliefs are also unjustified. But that's absurd — we can't coherently function, let alone do science, if we're not justified in trusting our senses and our basic reasoning.

  (7) So either premise (2) is too strong, or there's a relevant difference between moral beliefs and perceptual/logical beliefs that saves the latter but not the former. But the speaker was sharp and has definitely heard this objection before, so I assume there's a move here that I'm not seeing.

  I'd rather keep my moral realism than give up on perception and logic, but I want to know what I'm paying. Which step do you reject, and what does rejecting it cost? If there's a way to keep the debunking argument for morality without it eating the rest of cognition, I want to know what that looks like — and whether the fix leaves the original argument with any teeth.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A journalist covering philosophy and cognitive science for a magazine.
      *   **Tone:** Intelligent, engaged, slightly frustrated ("driving me crazy"), looking for clarity on a specific philosophical problem.
      *   **Topic:** Evolutionary Debunking Arguments (EDAs) in metaethics.
      *   **Core Problem:** The "Global Debunking" objection (or "Self-Defeat" objection). If evolution debunks morality because it's fitness-tracking rather than truth-tracking, doesn't it also debunk perception, logic, and math? If so, the argument is self-defeating (since it uses logic/reasoning to make its case). If not, what's the relevant difference?
      *   **Goal:** The user wants to know which step to reject, what the cost is, and whether moral realism can be saved without sacrificing perception/logic.

  2.  **Deconstruct the Argument Provided:**
      *   (1) Moral intuitions are evolutionary adaptations for fitness, not truth.
      *   (2) If a belief-forming process doesn't track truth, the belief is unjustified (unless independently verified).
      *   (3) Therefore, moral beliefs are unjustified (Anti-Realism).
      *   (4) *Extension:* Perceptual beliefs are also evolutionary adaptations for fitness.
      *   (5) *Extension:* Logical/Math intuitions are also evolutionary adaptations.
      *   (6) *Conclusion:* If (2) holds, perception/logic are unjustified (Skepticism/Self-Defeat).
      *   (7) *Dilemma:* Either (2) is too strong, or there's a relevant difference.

  3.  **Identify the Philosophical Landscape:**
      *   This is a classic debate in metaethics. Key players: Sharon Street (Darwinian Dilemma), Richard Joyce (Evolutionary Debunking), Erik Wielenberg, David Enoch, William FitzPatrick.
      *   The specific objection raised by the user is often called the "Global Debunking Argument" or the "Self-Defeat Objection."
      *   The core tension is between *causal explanations of belief* and *justification*.

  4.  **Evaluate Potential Responses (The "Moves"):**

      *   **Move A: Reject Premise (2) (The Insensitivity/Tracking Principle).**
          *   *Idea:* Just because evolution shaped the *capacity* doesn't mean the *output* is untracked.
          *   *Problem:* Hard to distinguish morality from perception here without begging the question.
          *   *Refinement:* Distinguish between *distal* evolutionary causes and *proximal* mechanisms. Perception has feedback loops (I reach for the apple, I miss, I correct). Morality lacks this kind of empirical feedback.
          *   *Cost:* Requires a robust account of how moral truth could causally interact with us (causal access problem).

      *   **Move B: Find a Relevant Difference (The "Third Factor" or "Pre-established Harmony").**
          *   *Idea:* Evolution *did* track moral truth, indirectly.
          *   *Example:* Survival is good. Evolution selects for survival. Therefore, evolution selects for good things. (Enoch's "Survival is Good" argument).
          *   *Cost:* Commits you to specific substantive moral claims (e.g., survival is objectively good). Some realists find this too concessive.

      *   **Move C: Accept Global Skepticism but argue it's manageable (Pragmatism).**
          *   *Idea:* Okay, maybe nothing is "justified" in a foundationalist sense, but we can't help but believe.
          *   *Cost:* Gives up on robust realism. Not what the user wants (they want to keep moral realism).

      *   **Move D: Distinguish Types of Truth/Tracking (The "Math/Logic" Angle).**
          *   *Idea:* Math and Logic might be necessary truths. You can't evolve to believe 2+2=5 and survive if 2+2=4 is structurally embedded in reality.
          *   *Counter:* Evolution cares about *approximate* quantity, not abstract Peano axioms.
          *   *Refinement:* Perception has a causal link to the object. Morality (if non-natural) does not. This is the strongest distinction.

      *   **Move E: Reject the "No Independent Reason" clause in (2).**
          *   *Idea:* We *do* have independent reasons for perception (coherence, prediction). We don't for morality.
          *   *Cost:* Puts the burden on the realist to provide independent verification for moral claims.

  5.  **Drafting the Response:**

      *   **Acknowledge the Insight:** Validate the user. They have rediscovered the "Global Debunking" or "Self-Defeat" objection. It's a standard and powerful move in the literature.
      *   **Structure:** Break down the options for saving Moral Realism without burning down Perception/Logic.
      *   **Option 1: The Causal Connection (Perception vs. Morality).**
          *   Focus on Premise (4). Perception involves causal interaction with the object. If there's a laptop, photons bounce off it. If Moral Realism is non-natural (Platonic), there are no moral photons.
          *   *Cost:* Moral Realism must explain how we access these facts (epistemic access problem).
      *   **Option 2: The Third-Factor Explanation (Enoch's Move).**
          *   Focus on Premise (1). Maybe evolution *did* track truth. Survival is good. Evolution tracks survival. Therefore, evolution tracks good.
          *   *Cost:* You have to defend "Survival is Good" as an objective truth, not just a preference.
      *   **Option 3: Restricting Premise (2) (The Sensitivity/Feedback Loop).**
          *   Perception allows for error correction based on the world. Morality doesn't seem to.
          *   *Cost:* Requires showing how moral inquiry works like scientific inquiry.
      *   **Option 4: The Math/Logic Distinction.**
          *   Math is often seen as conceptual or necessary. If you reason correctly, you *must* get 2+2=4. Evolution gave us the reasoning engine, not the specific truths.
          *   *Cost:* Might concede that *applied* math is evolutionary, but *pure* math is rational insight.
      *   **Recommendation:** The most robust defense for a Realist is usually a combination of distinguishing the *causal mechanism* (Perception) and positing a *correlation* (Third Factor).

  6.  **Refining the Tone:**
      *   Keep it journalistic but philosophically precise.
      *   Avoid jargon where possible, or explain it (e.g., "non-naturalism," "pre-established harmony").
      *   Address the "what am I paying" question directly for each option.

  7.  **Self-Correction/Nuance Check:**
      *   *Wait, does the user want to be an Anti-Realist?* No, they said "I'd rather keep my moral realism."
      *   *Is the argument self-defeating?* Yes, if it debunks logic, it debunks the argument itself. This is the "shooting yourself in the foot" objection. Most debunkers (like Joyce) accept this and become Error Theorists (morality is false/unjustified, but we keep using it). Street is a Constructivist (morality is made by us). Realists need to block the argument.
      *   *Key Distinction:* The difference between *etiology* (where it came from) and *justification* (why we hold it).
      *   *Crucial Point:* The user's Premise (2) is the battleground. "Unless you have some independent reason." Realists argue we *do* have independent reasons (reflective equilibrium), or that the evolutionary story is compatible with truth-tracking.

  8.  **Final Plan:**
      *   Validate the insight (it's the "Global Debunking Objection").
      *   Analyze Premise (2) as the weak link.
      *   Present three main strategies for the Realist:
          1.  **The Causal Constraint:** Perception has causal contact; Morality (if non-natural) doesn't. (Defends Perception, challenges Morality).
          2.  **The Third-Factor:** Evolution and Morality correlate via a common cause (Survival/Well-being). (Saves Morality).
          3.  **The Rationalist Escape:** Logic/Math are constraints on thought itself, not empirical beliefs. (Saves Logic).
      *   Conclude with the "Price Tag" summary.

  9.  *(Self-Correction during drafting)*: Make sure to mention Sharon Street. She's the big name on this. Also Richard Joyce. The user is likely encountering a Street-inspired argument. Street actually *accepts* the dilemma and becomes a constructivist. The user wants to be a Realist, so they need the *Realist response* to Street.

  10. **Final Polish:** Ensure the distinction between *naturalist* realism (moral facts are natural facts) and *non-naturalist* realism (moral facts are sui generis) is clear, as it changes the defense strategy.

  (Proceed to generate response based on these thoughts.)
answer: |-
  You have independently rediscovered one of the most famous and contentious objections in contemporary metaethics. In the literature, this is often called the **"Global Debunking Argument"** or the **"Self-Defeat Objection."**

  You are right to feel the tension. If the evolutionary debunking argument (EDA) is sound as stated, it is a philosophical acid that eats through the floorboards of morality, perception, logic, and eventually the argument itself. If our reasoning capacities are merely fitness-tracking adaptations, why trust the reasoning used to construct the debunking argument?

  Most professional philosophers agree with your intuition at 30,000 feet: Premise (2) is doing too much heavy lifting. However, saving moral realism requires nuance. You cannot simply reject (2) outright without blunting the debunking argument's force against morality. You need a *discriminating* rejection—one that lets perception and logic off the hook while keeping morality in the dock (or vice versa, depending on your metaphysics).

  Here are the three main moves available to you, the specific costs of each, and how they attempt to save moral realism without torching the rest of cognition.

  ### Move 1: The Causal Constraint (Rejecting the Analogy in Premise 4)

  This is the most common defense of perceptual beliefs against EDAs. It argues that there is a **relevant difference** between how evolution shaped perception versus how it shaped moral intuitions.

  *   **The Argument:** Perception involves a **causal link** between the believer and the object believed. When you believe "there is a laptop," photons bounce off the laptop and strike your retina. Evolution shaped your visual system to register these causal impacts accurately because missing the laptop (or the predator) has immediate fitness costs. The truth of the belief is causally relevant to the survival value of the belief.
  *   **The Application to Morality:** If you are a **non-naturalist moral realist** (believing moral facts exist but are not part of the physical, causal world), there are no "moral photons." Moral facts cannot causally interact with our brains. Therefore, evolution could shape our moral intuitions entirely independently of whether those intuitions are *true*.
  *   **The Cost:** This saves perception and logic, but it leaves moral realism with a massive **epistemic access problem**. You have to explain how we know moral truths if they don't causally affect us.
      *   *Price:* You must adopt a robust account of moral epistemology (e.g., rational intuitionism) that explains how we "grasp" non-natural facts without causal contact. If you can't explain the access, the debunking argument still wins on morality, even if it loses on perception.

  ### Move 2: The Third-Factor Explanation (Challenging Premise 1)

  This move, championed by philosophers like David Enoch, accepts that evolution shaped our intuitions but denies that it did so *independently* of the truth. It posits a **common cause** linking fitness and moral truth.

  *   **The Argument:** Evolution selects for survival and well-being. If moral realism is true, then (for example) "survival is good" or "well-being is valuable" is an objective moral truth. Therefore, evolution *did* track moral truth, indirectly. It selected for behaviors that aligned with moral facts because those facts are conducive to survival.
  *   **The Application:** This creates a "pre-established harmony." We have moral intuitions about caring for offspring because caring for offspring is both fitness-enhancing *and* morally good. The correlation isn't a coincidence; it's anchored by a third factor (the value of survival).
  *   **The Cost:** This commits you to specific, substantive moral claims as objective truths. You cannot be neutral about *which* moral facts exist. You must defend the claim that "survival is objectively good" not just as a biological imperative, but as a moral axiom.
      *   *Price:* You lose metaethical neutrality. You are betting your epistemology on a specific moral ontology. If a skeptic argues "Survival isn't objectively good, it's just what genes do," your defense collapses.

  ### Move 3: The Rationalist Escape (Distinguishing Logic from Morality)

  This move addresses your worry about math and logic (Premise 5). It argues that logical and mathematical truths are **constitutive of reasoning itself**, whereas moral truths are not.

  *   **The Argument:** You cannot evolve to believe that *modus ponens* is invalid and still be a reasoning agent. Logic isn't a set of empirical beliefs about the world; it's the operating system of the mind. Even if evolution gave us this operating system for fitness, the *validity* of the logic is internal to the system. To argue against logic, you must use logic (self-defeating).
  *   **The Application:** Morality, however, is not constitutive of reasoning. You can reason perfectly logically while being a moral nihilist. Therefore, moral beliefs are vulnerable to genealogical debunking in a way that logical beliefs are not.
  *   **The Cost:** This requires a strong distinction between "formal" domains (logic/math) and "substantive" domains (morality/empirical facts). It also leans heavily on a rationalist view of math that some naturalists reject.
      *   *Price:* You must accept that math/logic are justified *a priori* (independent of experience/evolution), while moral claims require a different kind of justification. This creates a fragmented epistemology where different types of truth are justified in fundamentally different ways.

  ### The Verdict: What Should You Do?

  If you want to keep moral realism without succumbing to global skepticism, **Move 1 (The Causal Constraint)** combined with a softened version of **Move 2 (Third-Factor)** is the standard survival package.

  Here is the specific repair job for your argument:

  1.  **Modify Premise (2):** Change "If a belief was produced by a process that doesn't track the truth..." to "If a belief was produced by a process that is **insensitive** to the truth..."
      *   *Why:* A process is insensitive if you would hold the belief *even if it were false*.
      *   *Perception:* If there were no laptop, you wouldn't see it (generally). Perception is sensitive.
      *   *Morality:* If "hurting innocents" were objectively *good* (in a non-naturalist framework), evolution would likely still have made us think it was bad, because cooperation aids survival. Our moral beliefs are insensitive to the moral facts.

  2.  **The Cost You Pay:**
      *   **You concede the "Queerness" of Moral Facts:** By relying on the Causal Constraint, you admit moral facts aren't physical. This pushes you toward Non-Naturalism.
      *   **You bear the Burden of Proof:** The debunker no longer has to prove morality is false; they just have to prove that the evolutionary explanation is sufficient without invoking moral truth. You, the realist, must provide a positive account of how we access these truths (e.g., through reflective equilibrium or rational insight).
      *   **You accept a "Defeasible" Realism:** Your realism is no longer "obvious." It becomes a theoretical posit required to make sense of our moral experience, similar to how scientific realists treat electrons. It is justified *inference to the best explanation*, not direct intuition.

  ### The "Teeth" of the Original Argument

  Does this fix leave the debunking argument with any teeth? **Yes.**

  Even if you avoid global skepticism, the EDA successfully shifts the burden of proof. It forces the moral realist to stop saying, "It's just obvious that torture is wrong." The EDA shows that "obviousness" is exactly what evolution would produce regardless of truth.

  To remain a realist, you must now argue that moral truth is the *best explanation* for why our moral reasoning works the way it does (e.g., why we can refine our moral views through reflection), rather than just saying "evolution made us think this."

  **Summary for your article:**
  The speaker's argument is a powerful heuristic, but as you suspected, it proves too much. The consensus among realists is not to reject the evolutionary story, but to reject the idea that evolutionary origins *preclude* truth-tracking. The cost of saving realism is admitting that moral knowledge is harder to come by than perceptual knowledge—it requires a bridge between the causal world of evolution and the normative world of value. If you can't build that bridge, the debunking argument stands, but it takes logic and perception down with it, leaving you with a coherent but unlivable skepticism.
