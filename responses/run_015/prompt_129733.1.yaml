answer: |-
  **Project Title:** Semantic Externalism and the Artifact Gap: Uniformity vs. Pluralism in Reference Fixation

  **1. Research Question**
  The central question of this independent study is: **Does semantic externalism extend uniformly to artifact-functional terms, or does the mechanism of reference fixation for artifacts differ fundamentally from that of natural kinds?** Specifically, I seek to determine whether the extension of terms like "lever," "filter," or "circuit" is fixed by the same causal-historical relations to physical stuff that fix the extension of "water," or whether artifact reference relies on a distinct mechanism tied to social intentions and functional history. A determinate answer will take the form of a classification: either semantic externalism is a unified theory applicable across ontological categories, or it is a label for a family of distinct mechanisms (physical-causal vs. social-intentional). Resolving this determines whether "meaning ain't in the head" applies to artifacts for the same reasons it applies to natural kinds.

  **2. Context and Gap in Existing Literature**
  Standard presentations of semantic externalism, originating with Putnam's Twin Earth scenario, prioritize natural-kind terms. The argument relies on the existence of a hidden microstructure (e.g., H2O vs. XYZ) that dictates extension regardless of identical narrow mental states. However, Putnam's causal-historical model was explicitly designed to bypass descriptive clusters for natural kinds; it was never rigorously tested against artifact-functional kinds, which lack essential microstructures. Artifacts are defined by function and design, not atomic composition.

  Existing literature largely assumes parity between natural and artifact kinds without justification. When Twin Earth arguments are extended to artifacts, the focus usually shifts to social externalism (e.g., Burge's "arthritis" case), which concerns expertise and division of linguistic labor rather than the ontology of the artifact itself. Consequently, a specific gap remains: the status of the *artifact's history* in fixing reference. If an Earth engineer and her Twin Earth duplicate use the term "filter" identically, but the Earth filter descends from a specific lineage of invention while the Twin Earth filter was independently invented via convergent evolution of design, do the terms co-refer? Standard externalism suggests history matters; functionalism suggests only current role matters. The literature leaves this tension unresolved, often treating artifacts as if they possess hidden essences analogous to natural kinds, or dismissing them as purely internalist descriptions. This project addresses that oversight.

  **3. Methodological Approach**
  To avoid merely trading intuitions, I will employ a comparative conceptual analysis focused on *theoretical cost* and *explanatory power*. I will draw three key distinctions:
  1.  **Microstructural Essence vs. Functional Role:** Contrasting terms fixed by physical constitution (water) versus those fixed by capacity to perform a task (lever).
  2.  **Causal-Historical Chain vs. Intentional History:** Distinguishing between the physical lineage of a substance and the lineage of human intentions/designs behind an artifact.
  3.  **Synchronic Use vs. Diachronic Transmission:** Analyzing whether reference is fixed by present utility or by the historical transmission of the concept.

  I will test these distinctions using modified Twin Earth scenarios where functional role and historical origin come apart. For example:
  *   *The Independent Invention Case:* Earth and Twin Earth artifacts are molecule-for-molecule identical and perform identical functions, but have no shared causal history of design. If externalism is uniform, the lack of a shared causal chain to an original "batting" or naming event might suggest non-co-reference. If functionalism holds, they co-refer.
  *   *The Malfunction Case:* An artifact loses its ability to function (a broken lever) but retains its historical lineage. Does it remain a "lever"? Natural kinds do not cease to be water when frozen or polluted; artifacts often cease to be their kind when function is lost.

  I will evaluate which semantic theory best handles these cases without generating contradictions in compositionality or failing to explain semantic error. The goal is to see if these distinctions do real work in resolving paradoxes of reference, rather than simply cataloging pre-theoretic judgments.

  **4. Expected Results and Conditions of Failure**
  A successful outcome will demonstrate that artifact terms require a **pluralist externalism**. I hypothesize that while natural-kind externalism relies on physical causation, artifact externalism relies on social-intentional causation. This would show that "externalism" is not a monolithic semantic thesis but a family of relations connecting words to the world via different ontological pathways. Specifically, I aim to show that artifact reference is externally fixed not by physical environment, but by the social history of design intentions.

  Alternatively, if the analysis shows that artifact terms are internally fixed (dependent solely on functional description available to the speaker), this would restrict the scope of semantic externalism significantly, marking a successful negative result.

  **Condition of Failure:** The project would fail if the distinction between natural and artifact kinds proves semantically inert—that is, if the mechanisms for reference fixation turn out to be identical despite ontological differences, rendering the inquiry trivial. Furthermore, the project fails if the analysis collapses into empirical sociology of technology (e.g., surveying how engineers actually use terms) rather than remaining a conceptual analysis of reference conditions. If the question becomes "how do people use words?" rather than "what fixes the reference?", the philosophical scope is lost.

  **5. Scope and Tractability**
  This project is tractable within one semester because it limits the corpus of artifact terms to simple functional kinds (levers, filters, circuits) rather than complex social institutions or legal categories. By restricting the scope to basic artifacts, I avoid the need for empirical data regarding technological classification practices. The work remains strictly within the philosophy of language, utilizing thought experiments and conceptual analysis rather than empirical investigation. The primary risk is scope creep into metaphysics (the ontology of artifacts); I will mitigate this by keeping the focus on *semantic consequences* of ontological distinctions rather than defending a specific ontology of artifacts itself. The deliverable will be a final paper arguing for either uniform or pluralist externalism, grounded in the analyzed cases.
