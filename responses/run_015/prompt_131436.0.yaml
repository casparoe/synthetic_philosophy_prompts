      *(Self-Correction during drafting)*: I need to be careful not to say SS agents "lie." They choose an action that doesn't match their private signal's implication for the *state*, but matches their signal's implication for their *type*. It's not lying in the sense of deception, it's optimal contracting under asymmetric information.
      *Also, clarify the "belief updating" point.* In SS, the market updates beliefs about the *manager*, not necessarily the *project*. The manager anticipates this.

  9.  **Final Polish:** Ensure the distinction between "Informational Cascades" and "Reputational Herding" is sharp. Emphasize that SS is often *more* dangerous because information isn't just lost (as in BHW), it's actively suppressed for career safety.

