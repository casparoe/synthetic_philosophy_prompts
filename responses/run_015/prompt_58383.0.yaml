prompt: |-
  Overheard this at a cookout and cant stop thinking about it. My cousins Maya and Jon were arguing about the probabilty that a mutual friends startup will make it to five years. Maya said just use the overall survival rate for tech startups, like 1 in 10, because once you start slicing it thinner your sample gets tiny and noisy. Jon said thats crazy to ignore what you know, this one is SaaS with a repeat founder and paying customers already, so you should use the rate for that narrower group, which is way higher. Maya shot back that you can always keep narrowing until you get whatever answer you want, like SaaS founders who climb on weekends or whatever, so narrow isnt automatically better. Jon said there is a difference between features that actually matter causally and random gerrymandered ones, and we know founder experience and revenue matter. Can you adjudicate their back and forth move by move, say who is right on each point and who is more right overall, plus what both are missing? Please actually commit to a verdict with reasons instead of just laying out both sides.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Scenario:** A cookout argument between cousins Maya and Jon about the probability of a specific startup surviving 5 years.
      *   **Maya's Position:** Use the base rate (overall survival rate, ~10%). Narrowing down creates small, noisy samples. Infinite narrowing leads to cherry-picking ("gerrymandering").
      *   **Jon's Position:** Use the reference class specific to known relevant factors (SaaS, repeat founder, paying customers). Ignoring specific info is irrational. Causal factors matter more than random ones.
      *   **Task:** Adjudicate move-by-move, declare who is right on each point, declare an overall winner, and identify what both are missing.
      *   **Constraint:** *Commit to a verdict.* No fence-sitting. Provide reasons.

  2.  **Deconstruct the Arguments (Move-by-Move):**

      *   *Move 1: Maya's Opening (Base Rate).*
          *   Claim: Use overall survival rate (1 in 10).
          *   Reasoning: Narrowing makes samples tiny/noisy.
          *   Analysis: This is the "Outside View" (Kahneman/Lovallo). It guards against optimism bias. However, ignoring *all* specific information is generally considered irrational in Bayesian updating.
          *   Verdict: Partially right on the risk of noise, wrong on ignoring specific info.

      *   *Move 2: Jon's Counter (Specific Info).*
          *   Claim: Ignore base rate, use specific class (SaaS, repeat founder, revenue).
          *   Reasoning: We know these things matter.
          *   Analysis: This is the "Inside View." It incorporates evidence. Bayesian logic dictates you *should* update the prior based on evidence.
          *   Verdict: Right on the principle of updating, but risks overfitting if the "specific class" isn't statistically robust.

      *   *Move 3: Maya's Rebuttal (The Slippery Slope).*
          *   Claim: You can narrow until you get the answer you want (e.g., "founders who climb on weekends").
          *   Reasoning: Narrow isn't automatically better.
          *   Analysis: This is a strong point about *data dredging* or *overfitting*. If you define the reference class too narrowly, you lose statistical significance.
          *   Verdict: Right. This is a known statistical pitfall.

      *   *Move 4: Jon's Final Defense (Causality).*
          *   Claim: Difference between causal features (experience, revenue) and random ones (weekend climbing).
          *   Reasoning: We know founder experience and revenue matter.
          *   Analysis: This is the crux. If the features are *predictively valid*, they should be used. The challenge is knowing which features are truly predictive vs. post-hoc rationalization.
          *   Verdict: Right in theory, but assumes we know the causal weights perfectly.

  3.  **Determine the Overall Winner:**
      *   This is a classic "Reference Class Forecasting" debate (Kahneman vs. Traditional Bayesianism).
      *   Maya advocates for the *Base Rate* (Outside View).
      *   Jon advocates for *Conditional Probability* (Inside View/Reference Class).
      *   *Statistical Truth:* You never use *just* the base rate if you have relevant evidence. You start with the base rate (prior) and update based on evidence (likelihood).
      *   Jon is fundamentally more correct because ignoring relevant evidence (revenue, experience) is statistically unsound. Maya's fear of overfitting is valid, but her solution (ignore everything) is worse than Jon's risk (potential overfitting).
      *   *However*, Maya's point about the "slippery slope" of narrowing is a crucial check on Jon.
      *   *Decision:* Jon wins overall, but with a significant caveat that he needs to avoid overconfidence. Maya is the necessary brake, but Jon is the engine. Actually, looking closer at the prompt's constraint ("Commit to a verdict"), I need to pick one. Jon's approach aligns better with Bayesian reasoning *if* done correctly. Maya's approach is too blunt. But wait, in startup forecasting, the "base rate" is often the *only* reliable number because specific metrics are easily gamed.
      *   *Re-evaluation:* In high-uncertainty environments (startups), specific info is often noisy or misleading. Revenue now $\neq$ revenue in 5 years. Repeat founder $\neq$ success guarantee. The "1 in 10" is a hard gravitational pull. Maya's warning about sample size is statistically profound. If the class "SaaS + Repeat + Paying" only has 50 historical examples, the noise is huge.
      *   *Final Verdict Logic:* Jon is right about the *method* (Bayesian updating), but Maya is right about the *data quality*. However, the prompt asks who is *more right overall*. Ignoring known predictive variables (Jon's point) is a bigger sin than risking some noise (Maya's fear). Therefore, Jon is more right, provided he acknowledges the uncertainty.
      *   *Wait, let's look at the "Reference Class Forecasting" literature.* Kahneman explicitly argues *for* Maya's position (Outside View) to combat planning fallacy. He argues we are too prone to do what Jon is doing (Inside View). In the context of *human psychology* and *startup optimism*, Maya is often the more useful advisor. But strictly *probabilistically*, Jon is correct that $P(Success | Evidence) \neq P(Success)$.
      *   *Synthesis:* I will side with **Jon** on the theoretical probability framework, but validate Maya's warning as the critical constraint. Why Jon? Because $P(A|B)$ is mathematically superior to $P(A)$ if B is relevant. Maya's argument leads to ignoring information, which is never optimal. Jon's argument leads to using information, which risks error but is the correct *process*.

  4.  **Identify What Both Are Missing:**
      *   **Bayesian Updating:** They are treating it as an Either/Or (Base Rate OR Specifics). It should be Base Rate *adjusted by* Specifics.
      *   **Prediction Markets/Aggregation:** Neither suggests asking the market or a crowd.
      *   **Time Dynamics:** Startups aren't static. The probability changes month to month.
      *   **The "Power Law":** Startup returns aren't normal distributions. Averages (1 in 10) might be misleading because the winners win so big.

  5.  **Drafting the Response:**
      *   *Tone:* Decisive, analytical, slightly conversational (fitting the cookout context).
      *   *Structure:*
