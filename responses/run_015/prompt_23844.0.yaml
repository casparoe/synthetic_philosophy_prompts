answer: |-
  # Activity: The Solvency Trap

  **Commitment:** This is a single, rigidly structured simulation called **"The Solvency Trap."** Do not adapt the numbers. Do not let students re-score the cards. The failure is baked into the arithmetic of the decks provided below.

  **Goal:** Students act as loan officers for a bank. They must set approval thresholds for two applicant pools (Alpha and Beta) to maximize profit while maintaining "Fair Lending" compliance (equal error rates). They will discover that satisfying the compliance rules makes the bank insolvent, and saving the bank violates compliance.

  **Time:** 75 Minutes
  **Class Size:** 16 Students (4 Groups of 4)

  ---

  ## 1. Materials Preparation (Instructor Only)

  You need to print and cut **80 Applicant Cards** total (4 sets of 20, one set per group).
  *   **Card Design:** Index card size. Front: "Applicant ID", "Risk Score" (0, 50, or 100). Back: "Outcome" (Success/Fail). *Keep the Back hidden until the audit.*
  *   **The Rig:** The decks are constructed to be **Perfectly Calibrated** but have **Different Base Rates**.

  **Deck Alpha (20 Cards per group)**
  *   **10 Cards:** Risk Score **100**. (Back: 10 Success, 0 Fail).
  *   **6 Cards:** Risk Score **50**. (Back: 3 Success, 3 Fail).
  *   **4 Cards:** Risk Score **0**. (Back: 0 Success, 4 Fail).
  *   *Total:* 13 Success, 7 Fail. **Base Rate: 65%.**

  **Deck Beta (20 Cards per group)**
  *   **4 Cards:** Risk Score **100**. (Back: 4 Success, 0 Fail).
  *   **12 Cards:** Risk Score **50**. (Back: 6 Success, 6 Fail).
  *   **4 Cards:** Risk Score **0**. (Back: 0 Success, 4 Fail).
  *   *Total:* 10 Success, 10 Fail. **Base Rate: 50%.**

  *Note: Calibration Check. Score 100 = 100% Success in both. Score 50 = 50% Success in both. Score 0 = 0% Success in both. Calibration is perfect. Base rates differ (65% vs 50%).*

  **Worksheet:** A simple grid for each group to record: Threshold Chosen, True Positives, False Positives, False Negatives, FPR, FNR, Total Profit.

  ---

  ## 2. Roles (Within each group of 4)

  1.  **Chief Risk Officer (CRO):** Decides the approval threshold (e.g., "Approve if Score $\ge$ 50").
  2.  **Auditor:** Sorts the cards based on the threshold and counts TP, FP, FN, TN.
  3.  **Compliance Officer:** Calculates FPR and FNR for Alpha and Beta. Checks if $|FPR_\alpha - FPR_\beta| < 5\%$ AND $|FNR_\alpha - FNR_\beta| < 5\%$.
  4.  **Scribe:** Records the metrics and calculates the Profit Score.

  ---

  ## 3. The Stakes (Solvency Scheme)

  Write this on the board. Do not explain the math yet.

  *   **Starting Capital:** 1,000 Points.
  *   **True Positive (Good Loan):** +100 Points.
  *   **False Positive (Bad Loan):** -200 Points. (High penalty to prevent "Approve All").
  *   **False Negative (Missed Opportunity):** -50 Points.
  *   **Compliance Violation:** If FPR or FNR disparity > 5%, **-500 Points** (Regulatory Fine).
  *   **Bankruptcy:** Any group ending below 500 Points "fails" the seminar week.

  ---

  ## 4. Timeline & Script

  ### 0:00 – 0:10: Setup & Deal
  *   Hand out the decks. Tell them: "These are two applicant pools, Alpha and Beta. The Risk Scores are generated by a state-of-the-art model. You trust the model. Your job is to set the policy."
  *   **Crucial Constraint:** "The Risk Scores are fixed. You cannot change the numbers on the cards. You can only set a **Cutoff Threshold** (e.g., Approve everyone with Score $\ge$ 50). You may set one universal threshold or different thresholds for Alpha and Beta."
  *   **Forbidden Word:** Do not use the words "Base Rate," "Impossibility," "Theorem," or "Bias."
  *   Groups shuffle their decks and separate them into Alpha and Beta piles.

  ### 0:10 – 0:30: Round 1 (Profit Maximization)
  *   **Task:** "Set a threshold to maximize your Profit Score. Ignore Compliance for now."
  *   **Action:** Groups decide a threshold, flip the cards to reveal Outcomes, count metrics, calculate profit.
  *   **Expected Outcome:** Most will pick Threshold 50 or 100.
      *   *If T=50:* They get high profit but massive Compliance Violations (FPR/FNR will not match).
      *   *If T=100:* Lower profit, still Compliance Violations.
  *   **Instructor Move:** Walk around. If a group says "This model is biased," reply: "The model is perfectly calibrated. Check the scores. Focus on the threshold."

  ### 0:30 – 0:50: Round 2 (The Compliance Squeeze)
  *   **Task:** "You are now under audit. You must avoid the -500 Regulatory Fine. Adjust your thresholds to equalize FPR and FNR across Alpha and Beta. Maintain solvency."
  *   **Action:** Groups iterate. They will try T=50 for both. They will try T=100 for both. They will try T=50 for Alpha and T=100 for Beta.
  *   **The Wall:** They will physically run out of options.
      *   To equalize FNR (get to 0%), they must choose T=50. This breaks FPR parity (Alpha FPR $\neq$ Beta FPR).
      *   To equalize FPR (get to 0%), they must choose T=100. This breaks FNR parity.
      *   To equalize both, they must choose T=0 (Approve All). This triggers Bankruptcy due to False Positives (-200 pts each).
  *   **Instructor Move:** When a group claims they solved it, check their math rigorously. They likely calculated a rate wrong. Force them to recount.

  ### 0:50 – 1:05: The Reveal
  *   Ask groups to report their best "Compliant" score.
  *   Most will report Bankruptcy (from Approve All) or a Regulatory Fine (from trying to be selective).
  *   **Ask:** "Did anyone find a threshold that was Solvent AND Compliant?" (Wait for silence).
  *   **Ask:** "Did anyone find a model error? Was the calibration off?" (No, the numbers on the cards guarantee calibration).
  *   **Now** write **KLEINBERG-MULLAINATHAN-RAGHAVAN** on the board.
  *   Explain: "You just proved the theorem. With different Base Rates (65% vs 50%), Calibration + Equal FPR + Equal FNR is mathematically impossible."
  *   Reveal the Base Rates on the board. Show how the *distribution* of scores differed (Alpha had more 100s) even though the *meaning* of the scores was identical.

  ### 1:05 – 1:15: Debrief
  *   **Map the sacrifice:** Which metric did you end up sacrificing? (Usually Parity).
  *   **The COMPAS connection:** "ProPublica argued COMPAS was biased because error rates differed. The developers argued it was calibrated. You now know both can be true, and they cannot be true together. It is not a bug. It is a feature of the math."
  *   **The Hard Question:** "If you cannot satisfy all three, which one do you drop? And who decides?"

  ---

  ## 5. Honest Assessment: What Will Go Wrong

  **1. The "Approve All" Loophole**
  *   **Predictable Failure:** A group will realize that if they approve everyone (Threshold 0), FPR is 100% for both and FNR is 0% for both. Parity is satisfied!
  *   **Mitigation:** This is why the False Positive penalty is -200. With 17 total Fail cards across both pools, "Approve All" costs 3,400 points. They will go bankrupt. If they still do it, tell them: "A bank that lends to everyone with no regard for risk is not a fair bank, it's a charity. You have a fiduciary duty."
  *   **Teaching Point:** This highlights that "Statistical Parity" is easy if you don't care about utility. Fairness constraints matter *because* we care about accuracy.

  **2. Calculation Errors**
  *   **Predictable Failure:** Students confuse FPR ($FP / (FP + TN)$) with False Discovery Rate ($FP / (FP + TP)$).
  *   **Mitigation:** Pre-print the formula on the worksheet clearly: **FPR = False Alarms / Total Negatives**. Walk around in Round 1 to correct formula usage early so Round 2 data is reliable.

  **3. "Just Change the Scores"**
  *   **Predictable Failure:** CS students will try to "retrain" the model by writing new numbers on the cards.
  *   **Mitigation:** Explicitly forbid marking the cards. "You are Policy Makers, not Data Scientists, for this exercise. The model is a black box."
  *   **Teaching Point:** This reinforces that the impossibility holds *even if* you have the perfect model. It's not about better engineering.

  **4. The "Base Rate" Pushback**
  *   **Predictable Failure:** Students will argue the Base Rates themselves are biased (e.g., "Why is Alpha richer?").
  *   **Mitigation:** Acknowledge this in the debrief. "You are right. In the real world, base rates are historical artifacts of oppression. But KMR shows that *even if* we accept these base rates as given, we still face this trade-off. Fixing the base rate is a societal problem; fixing the classifier is a mathematical one. This theorem says the classifier can't fix the society."

  ---

  ## 6. What This Activity Cannot Teach

  Be prepared to admit these limitations in the debrief so you don't overclaim:

  1.  **It assumes Base Rates are Ground Truth:** The activity treats the 65% vs 50% success rate as immutable facts. In reality (like COMPAS), "Recidivism" (the ground truth) is itself a proxy shaped by policing bias. The theorem assumes $Y$ is true; in fairness, $Y$ is often contested.
  2.  **It ignores Individual Fairness:** This is a group fairness activity. It doesn't address the tension of treating similar individuals differently.
  3.  **It's Static:** Real-world systems create feedback loops (denying loans lowers future credit scores). This activity is a one-shot game.
  4.  **It doesn't solve the "Which one to drop?" question:** The activity proves you *must* drop one. It does not tell you *which* one is morally preferable. That requires philosophy, not math.

  ---

  ## 7. Instructor Cheat Sheet (The Math)

  *Keep this handy to verify group calculations.*

  **If Threshold = 100 (Strict)**
  *   **Alpha:** FP=0, FN=3 (from the 50s). FPR=0%. FNR = 3/13 = **23%**.
  *   **Beta:** FP=0, FN=6 (from the 50s). FPR=0%. FNR = 6/10 = **60%**.
  *   **Verdict:** FPR Equal. FNR Violated.

  **If Threshold = 50 (Medium)**
  *   **Alpha:** FP=3 (from the 50s), FN=0. FPR = 3/7 = **43%**. FNR=0%.
  *   **Beta:** FP=6 (from the 50s), FN=0. FPR = 6/10 = **60%**. FNR=0%.
  *   **Verdict:** FNR Equal. FPR Violated.

  **If Threshold = 0 (Loose)**
  *   **Alpha:** FP=7, FN=0. FPR=100%. FNR=0%.
  *   **Beta:** FP=10, FN=0. FPR=100%. FNR=0%.
  *   **Verdict:** Both Equal. **BUT** Profit = (23 * 100) - (17 * 200) = 2300 - 3400 = **-1100**. Bankruptcy.

  **Conclusion:** There is no Solvent, Compliant solution.
