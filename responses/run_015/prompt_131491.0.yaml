      *   **Part 3 (Choice/Path-Dependence):** Acknowledges path-dependence (institutions reinforce emotions). Argues Vorn shows it's possible via redesign (education + ritual). Concludes it's "engineering within constraints" (steer over generations, not flip a switch).
          *   *Critique:* Nuanced answer ("Yes and no"). Recognizes the tension between agency and structural inertia.

