      *   Overall: It's competent but not excellent. B+ feels right. It shows comprehension but not critical mastery.

  9.  **Final Polish:** Organize into "Grade," "Point-by-Point Assessment," "General Comments," and "Grading Flags for Future." Ensure the tone is supportive of the TA's need for consistency.

      *(Final check on constraints)*: "Don't lecture me about your own stance." -> I will strictly evaluate the student's argument structure and responsiveness to the prompt.

