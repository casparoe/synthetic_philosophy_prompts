      *   *(4) Harm:* Predictive transparency causes "cognitive dispossession" (colonization of deliberative space), *even with consent/autonomy intact*.
      *   *(5) Public Officials:* Radical transparency required for officials (minimal boundary maintenance).
      *   *(6) Ontology:* No intrinsic/dignity-based account. Privacy is a contingent social technology, not a fundamental right.

