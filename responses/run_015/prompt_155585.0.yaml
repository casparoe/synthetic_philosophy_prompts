      *   *Check:* Did I address (5)? (5) is about officials. (1) is about contextual boundaries. (5) just changes the context norms for officials. This is consistent with (1) (Contextual Integrity theory allows different norms for different contexts). So (1) vs (5) is a "dissolves on inspection" conflict.
