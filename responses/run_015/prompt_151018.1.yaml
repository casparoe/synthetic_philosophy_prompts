  **TO:** Commemoration and Honors Committee
  **FROM:** [Your Name]
  **DATE:** October 10, 2023
  **SUBJECT:** Recommendation Regarding Vance Hall and Future Review Criteria

  **Recommendation**
  I recommend we proceed with **Option 3: Reclassification without Condemnation.** We should rename Vance Hall and install a historical marker detailing the study, the University's endorsement of it, and the harm caused, while explicitly declining to frame this as a posthumous moral sanction against Dr. Vance. Concurrently, I recommend we **adopt the Parity Clause** immediately, initiating formal reviews of Bramble Hall and Olds Field within the next twelve months to ensure consistent application of our values.

  **Reasoning**
  Our discomfort stems from conflating *criminal liability* with *commemorative suitability*. The Nuremberg concern—that we are punishing conduct legal at the time—applies to sentencing, not naming. However, because the University awarded Vance the Distinguished Service Medal in 1991, we are not neutral observers judging the past; we are participants correcting our own history. Option 1 (Removal with Condemnation) risks performing moral purity while obscuring institutional complicity. It suggests Vance alone was the problem, when the protocol was published, cited, and decorated by us. Option 2 (No Removal) ignores the ongoing harm to victims' families and contradicts our new Values Framework.

  Option 3 navigates this by shifting the focus from Vance's guilt to our present commitment. We are not stripping an honor because he was "bad"; we are updating a designation because it no longer reflects who we are. This respects the daughter's contention that Vance believed he was acting correctly while acknowledging the descendant's request that the harm be recognized. It avoids the retroactivity trap by treating the name change as curatorial rather than punitive.

  **The Strongest Argument for Removal (Option 1)**
  I want to state the case for Option 1 as strongly as Dana makes it, because it is morally serious. The argument is that honors are not merely historical records; they are active endorsements. Keeping Vance's name on a building tells current students and staff that this conduct is compatible with our identity. The harm to the victims' families is not historical; it is renewed every time they see the name. From this view, distinguishing between "punishment" and "commemoration" is semantic sophistry. If the conduct violates core commitments, the honor must vanish entirely to signal that such acts are intolerable, regardless of contemporary norms. To contextualize is to soften; to remove is to reckon.

  **The Parity Clause**
  We must adopt the Parity Clause. The decision to review Vance while ignoring Bramble and Olds creates a "victors' justice" problem that undermines our legitimacy. Vance is an easy target because he is dead and lacks donor protection. If we remove Vance while leaving Bramble (whose grandson sits on the Board) untouched, we confirm the suspicion that this process is political rather than ethical. Adopting the clause ensures we are not selectively scrubbing history to protect current interests. We should not suspend the Vance decision, but we must commit to opening files on comparable honorees immediately.

  **Future Criteria**
  To prevent reinventing the wheel for Bramble and Olds, I propose we adopt the following three criteria for all future reviews:

  1.  **The Institutional Endorsement Test:** Did the University explicitly award, fund, or praise this conduct at the time? (High endorsement increases the burden to contextualize our own complicity rather than simply removing the name.)
  2.  **The Contemporary Dissent Test:** Were there significant voices opposing this conduct *at the time it occurred*? (If the conduct was widely accepted then, removal requires a higher threshold of present harm than if it was contested then.)
  3.  **The Living Harm Test:** Are there living victims or descendants directly affected by the honor? (This prioritizes cases where the commemoration causes active, demonstrable distress over abstract moral inconsistencies.)

  **Conclusion**
  Option 3 allows us to acknowledge the harm done to the prisoners without pretending the University was innocent of it. It respects the retroactivity concern by avoiding moral condemnation of the dead, while satisfying the Values Framework by aligning our buildings with our current commitments. By adopting the Parity Clause and these criteria, we ensure that Vance is not merely the convenient sacrifice, but the first step in a consistent, honest audit of our history.

  I move we adopt this path and begin the Bramble and Olds reviews by next quarter.
