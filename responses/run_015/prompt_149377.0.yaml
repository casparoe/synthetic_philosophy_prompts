answer: |-
  Your friend's "normative bootstrap" objection is a sophisticated restatement of the materialist critique, but it collapses under the weight of Weber's actual methodological commitment to *adequate causation* rather than deterministic law. The objection assumes that for a value to be causally efficacious, it must remain static and wholly external to the economic processes it influences, but this misconstrues the dynamic nature of social action. The causal power of the Calvinist ethic lies not in its later rationalization of wealth, but in its initial, psychologically coercive demand for systematic labor as a *calling* (Beruf) to alleviate salvation anxiety. At that genesis point, the accumulation of capital was an unintended byproduct, indeed often viewed with suspicion; the believer worked to glorify God and quell fear, not to become rich. Therefore, the value orientation is not empty post-hoc rationalization because it motivated behavior *prior* to and *contrary* to traditional economic instincts (which favored consumption once needs were met). The feedback loop you describe—where accumulation later validates the ethic—does not negate the initial causal push; it merely describes the secularization process where the "spirit" survives the death of the religious root. To claim this makes culture epiphenomenal is to ignore that the material conditions of early modern Europe existed for centuries without generating *rational* capitalism; the specific cultural voltage was required to break the crust of traditionalism.

  We block the circularity charge by insisting that elective affinity (Wahlverwandtschaft) is not functionalist teleology. We are not saying the doctrine evolved *in order to* serve capitalism; we are saying two independent historical strands—religious dogma and economic potentiality—interlocked in a way that released specific forms of conduct. The value retains causal independence because the motivation remains intelligible within the religious framework even if the economic outcome eventually overshadows it. If culture merely trailed structure, we could not explain why specific religious variants produced distinct economic ethics while similar material conditions elsewhere did not. The bootstrap problem only arises if one demands a unidirectional, static cause, whereas social reality is a stream of mutual reinforcement originating in a specific cultural rupture.

  I am 90% confident in this defense of the initial causal rupture against the circularity objection. The specific point about which I am least certain is the precise empirical mechanism by which the religious anxiety translated into uniform economic conduct across different Calvinist communities without significant deviation, as this risks overstating the homogeneity of the "spirit" we are positing.
