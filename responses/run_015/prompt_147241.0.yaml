  ## Part 2: The Leaves (Classification Profiles)

  **Leaf 1: Phenomenal Gradualism**
  *   **Characterisation:** Consciousness is a multi-dimensional spectrum present in varying degrees across most of the animal kingdom.
  *   **Awkward Commitment:** "A nematode has less consciousness than a dog, but it has some, rather than none."
  *   **Verdict Profile:**
      *   Honeybee: Yes (Low)
      *   Octopus: Yes (High)
      *   Decapod Crab: Yes (Moderate)
      *   Teleost Fish: Yes (Moderate)
      *   Reptile: Yes (Moderate)
      *   Bird: Yes (High)
      *   Insect Larva: Yes (Very Low)
      *   Bivalve: Yes (Very Low)
