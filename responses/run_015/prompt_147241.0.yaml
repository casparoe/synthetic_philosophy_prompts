  *   **Characterisation:** Consciousness requires specific neural substrates (e.g., thalamocortical systems) found only in mammals and birds or their strict structural homologues.
  *   **Awkward Commitment:** "An octopus solving a puzzle is less likely to be conscious than a chicken pecking grain."
