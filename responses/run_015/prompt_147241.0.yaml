  # The Consciousness Attribution Instrument

  ## Part 1: The Decision Tree

  **Instructions:** Proceed through the nodes in order. Answer "Yes" or "No" (or select the option) based on your evidential standards, not on which animal you hope to include.

  **Node 1: The Marker Dissociation (Diagnostic Standard)**
  *Case:* Consider a species that lacks the neural structures typically linked to consciousness in humans (e.g., no cortex or equivalent), yet it avoids harm, trades off pain for reward, and stops avoiding when given analgesics.
  *Question:* Does this behavioral profile alone settle the question of consciousness for you, even without the neural structure?
  *   **Yes:** Go to Node 2.
  *   **No:** (You require neural evidence). Go to Node 2.

  **Node 2: The Dimmer Switch (Gradability)**
  *Question:* Is consciousness a binary state (an animal is either conscious or it is not), or is it something an animal can have to a degree or in multiple dimensions?
  *   **Degrees/Multi-dimensional:** **Stop. You are at Leaf 1.**
  *   **Binary (On/Off):** Go to Node 3.

  **Node 3: The Collective Boundary (Subject Definition)**
  *Case:* Consider a eusocial colony or siphonophore where the group acts as an integrated unit but individual members do not. If the group shows the markers from Node 1, but the individuals lack the capacity, is the *group* the potential subject of consciousness?
  *   **Yes (The Group):** **Stop. You are at Leaf 2.**
  *   **No (The Individual):** Go to Node 4.

  **Node 4: The Fixed Response (Learning Requirement)**
  *Case:* Consider an animal that flinches from harm and releases stress hormones but *never* learns to avoid the stimulus in the future (a fixed response that never updates).
  *Question:* Is this sufficient for consciousness attribution?
  *   **Yes:** **Stop. You are at Leaf 3.**
  *   **No:** (You require flexible learning). Go to Node 5.

  **Node 5: The Neural Specificity (Structural Standard)**
  *Note:* (Only answer this if you answered **No** at Node 1).
  *Question:* For an animal to be conscious, must it possess the specific neural structures found in mammals and birds (or a strict structural homologue), or is a functionally equivalent neural architecture in a different lineage sufficient?
  *   **Strict Homology (Mammal/Bird type):** **Stop. You are at Leaf 4.**
  *   **Functional Equivalence (Broad):** Go to Node 6.

  **Node 6: The Skeptic's Check (Undecidability)**
  *Question:* Even if an animal meets your behavioral and/or neural criteria, is it possible that the question of whether it is truly conscious is in principle undecidable?
  *   **Yes:** **Stop. You are at Leaf 5.**
  *   **No:** **Stop. You are at Leaf 6.**

  *(Note: Node 7 and 8 are unused to maintain parsimony, keeping the walk-through under 20 minutes.)*

