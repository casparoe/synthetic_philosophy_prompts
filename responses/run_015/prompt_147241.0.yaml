  ## Part 3: Instrument Notes & Limitations

  **Logical Space Warnings:**
  1.  **Incoherent Combination:** The path to **Leaf 4 (Neural Homology)** requires answering "Binary" at Node 2. A combination of "Strict Neural Homology" + "Gradualism" is theoretically possible but rarely held; strict structuralists typically view the requisite neural hardware as a switch. If a participant holds this combination, the tree forces them into Leaf 1, potentially misclassifying their taxonomic restrictions.
  2.  **Unexplored Space:** **Leaf 2 (Collective Consciousness)** occupies a logical space almost no one defends. It is included to force regulators to clarify if their welfare protections apply to individuals or colonies.

  **Indistinguishable Profiles:**
  *   **Leaf 6 (Functional Neuralism)** and **Leaf 7 (Flexible Aversive Learning)** yield **indistinguishable verdict profiles** on this specific taxon list. Both typically include Cephalopods, Crustaceans, Fish, and Birds, while excluding Insects (adults may differ), Larvae, Bivalves, and Nematodes.
      *   *Reason:* In practice, the presence of a functionally equivalent neural architecture (Leaf 6) correlates perfectly with the capacity for flexible aversive learning (Leaf 7) in the selected taxa.
      *   *Distinction:* The *reasoning* differs (Structure vs. Behavior), but the *outcome* for these nine animals is the same. This instrument sorts by reasoning, but users should know the policy outcome here is identical.

  **Node Case Mapping:**
  *   **Node 1:** Marker Dissociation (Behavior w/o Neural).
  *   **Node 3:** Collective Organism (Group vs. Individual).
  *   **Node 4:** Fixed Response (Pain behavior w/o Learning).
