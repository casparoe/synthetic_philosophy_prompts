      *   *Formal Aspect:* Yes, it's about whether the composition operator is a total function (Universalism) or partial/empty (Nihilism/Restrictivism).
      *   *Progress:* Don't expect a proof. Expect a shift in consensus based on which theory plays nicer with physics or logic.
      *   *Advice for the Novel:* This is the gold mine. The impasse *is* the theme. The character isn't "broken"; the *concept of personhood* is the broken thing.
