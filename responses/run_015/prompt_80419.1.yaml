      *   *Correction:* Make sure to answer the specific question: "Is the question malformed?" No, it's not malformed, it's *indeterminate* or *framework-relative*.
      *   *Actionable Advice:* Give the user a way to frame this for the editor.

  9.  **Final Structure:**
      *   Validation of the user's insight.
      *   Diagnosis (Theoretical Virtues Clash).
