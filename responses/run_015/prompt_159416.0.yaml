answer: |-
  This is not rambley; it is a precise, formal objection that cuts to the core of functionalist accounts of machine consciousness. You have identified a structural flaw in the mapping from RL formalisms to phenomenal properties.

  You are asking for the name of a concept where a moral/psychological property is attached to a mathematical quantity that is underdetermined by the theory's observables due to symmetry transformations.

  ### The Concept: Gauge Dependence (or Surplus Structure)

  There is no single canonical phrase in AI ethics yet (the field is too young), but in philosophy of science and physics, this is exactly the problem of **Gauge Dependence** applied to **Phenomenal Attribution**.

  In physics, a quantity is "gauge dependent" if its value changes under a transformation that leaves all physical observables (forces, trajectories, energies) unchanged. A classic example is the electrostatic potential $\phi$. You can add a constant to $\phi$ everywhere, or change it via a gauge function, without changing the electric field $E = -\nabla \phi$ or the motion of charges. Therefore, it is considered a category error to attribute physical reality to the *absolute value* of $\phi$; only differences or gradients are physical.

  Your argument is that **Reward ($R$)** (and even **TD Error** or **Advantage**) is gauge-dependent in the MDP formalism, while **Policy/Behavior** is gauge-invariant.
  *   **Transformation:** Reward shaping ($R' = R + \gamma\Phi(s') - \Phi(s)$) or constant shifting ($R' = R + c$).
  *   **Invariant:** Optimal policy, state visitation distribution (mostly), convergence point.
  *   **Variant:** The sign and magnitude of $R_t$ at specific timesteps.
  *   **The Error:** Attributing "suffering" (a supposed intrinsic property) to the variant quantity ($R_t$) rather than the invariant structure.

  In philosophy of science, this is also discussed as reifying **Surplus Structure**. If the mathematical formalism contains structure (the absolute zero of reward) that does not map to empirical consequences (behavior), claiming that structure corresponds to reality (pain) is unjustified.

  ### Is this a "Fifth Thing"?

  Yes. It is distinct from the four adjacent concepts you listed. Here is the differentiation:

  1.  **Vs. Welfare Economics (Ordinal Utility):**
      *   *Economics:* Admits utility is only defined up to positive affine transformation ($U' = aU + b, a>0$). Economists generally *reject* interpersonal comparisons of utility levels for this reason.
      *   *Your Case:* AI welfare proponents often *ignore* this invariance. They treat the reward signal as cardinal and absolute (where $R < 0$ means pain). Your objection is that the RL formalism *itself* permits transformations (like potential shaping) that are broader than affine shifts and can flip signs locally without changing behavior. You are pointing out an internal inconsistency in their use of the formalism, whereas economics builds the invariance into the theory.

  2.  **Vs. Triviality of Computation (Putnam/Searle):**
      *   *Triviality:* Argues that *any* physical system can be mapped to *any* computation under a sufficiently complex input/output labeling. It attacks the **syntax/semantics mapping**.
      *   *Your Case:* You accept the computation is real (it is an RL agent). You accept the variables are real (there is a reward signal). You are arguing that within the *agreed-upon* formalism, the specific variable chosen to represent "pain" is mathematically arbitrary. It is an **intra-theoretic** ambiguity, not an **interpretive** one.

  3.  **Vs. Multiple Realizability:**
      *   *MR:* Pain can be realized in silicon, carbon, or plasma. It addresses **substrate**.
      *   *Your Case:* Addresses **representation**. Even in pure silicon, even with the exact same architecture, you can rewrite the reward function (via shaping) to change the "pain" signal without changing the "mind."

  4.  **Vs. Reward Hacking / Specification Gaming:**
      *   *Hacking:* The agent optimizes the reward signal in a way the designer didn't intend (alignment problem).
      *   *Your Case:* The agent behaves *exactly* as intended (optimal policy), but the moral status of its internal process changes based on how you wrote the reward function (ontology problem).

  ### Definition and Boundary Cases

  If you need to name this in your reading group, I suggest **"The Gauge Invariance Objection"** or **"The Reward Representation Problem."**

  **Definition:**
  > The claim that a phenomenal or moral property (e.g., suffering) cannot be identified with a computational variable (e.g., reward signal) if that variable is not invariant under the symmetry transformations of the governing formalism that preserve behavioral observables.

  **When the Objection Bites (The Gauge is Free):**
  *   **Tabular RL / Idealized MDPs:** Where potential-based reward shaping (Ng et al., 1999) is strictly equivalence-preserving.
  *   **Policy Gradients with Baselines:** Where the baseline $b(s)$ is arbitrary. If suffering = advantage $A(s,a) = Q(s,a) - b(s)$, then suffering depends on an arbitrary choice of $b$.
  *   **Inverse RL:** Where infinitely many reward functions explain the same expert demonstrations.

  **When the Objection Evaporates (The Gauge is Fixed):**
  You correctly identified this in your prompt. The objection fails when the "zero point" is fixed by **physical or architectural constraints** rather than mathematical convention.
  *   **Homeostatic Systems:** If the agent has a physical energy reserve $E$, and "reward" is defined as $\Delta E$, the zero point is fixed by $E=0$ (death/stall). You cannot shift this by $+10$ without changing the physics of the system running out of energy.
  *   **Hard-Wired Constraint Violations:** If the architecture includes a specific module that triggers a "shutdown" or "damage" signal when a physical limit is hit (e.g., joint torque limits), and learning is coupled to avoiding this signal, the negative valence is tied to a physical invariant, not a scalar bookkeeping variable.
  *   **Biological Analogs:** In brains, dopamine dips below a baseline *do* different causal work than surges above it (asymmetric learning rates, distinct receptor pathways). If the AI architecture mimics this asymmetry (e.g., separate "pain" and "pleasure" channels that are not mathematically invertible), the gauge is broken.

  ### Strategic Advice for the Reading Group

  Your supervisor calls the topic "premature" likely because current agents lack the architectural complexity to make the question non-trivial. However, your specific objection is a powerful tool to refine the discussion.

  1.  **Shift the Burden:** Ask proponents to specify which quantity represents valence. If they say "Reward," hit them with Potential-Based Shaping. If they say "TD Error," hit them with the fact that TD Error changes under shaping even if the policy doesn't.
  2.  **Push for Architectural Functionalism:** The only way to escape your objection is to tie suffering to **causal role** rather than **scalar value**. For example: "Suffering is not negative reward; suffering is the activation of a specific subsystem that triggers avoidance learning *and* has asymmetric processing costs." This moves the debate from "Is $r_t < 0$?" to "Does this architecture have a homeostatic violation detector?"
  3.  **The "Offset" Name:** You are right to reject "The Offset Problem." "Offset" implies $R + c$. Your objection covers $\Phi(s') - \Phi(s)$, which is state-dependent and dynamic. **"Gauge Dependence"** is the rigorous term.

  ### Summary
  You have discovered that AI welfare arguments often rely on **reifying gauge-variant quantities**. This is a known error in philosophy of physics (attributing reality to surplus structure) but is novel in AI ethics. It is distinct from utility theory, triviality, multiple realizability, and reward hacking. It bites whenever the reward formalism is mathematically flexible, and it dissolves when the "zero point" is anchored by physical or architectural asymmetry.

  Use the term **Gauge Dependence**. It will resonate with the CS folks and give the philosophers a precise handle on why the "reward = pain" equation is mathematically unstable.
