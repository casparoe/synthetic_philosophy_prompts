  MEMORANDUM

  **TO:** Legacy Review Committee
  **FROM:** [Your Name], Junior Committee Member
  **DATE:** 1 March 2024
  **SUBJECT:** Recommendation on Disbursement of Restitution Fund

  **Recommendation**

  I recommend we advise the President to allocate the $12M fund as follows: 80% ($9.6M) as direct per-capita payments to the forty documented lineal descendants (Option A), and 20% ($2.4M) as a place-based endowment for the two identified neighborhoods (Option B). We should reject Option C. Payments should be distributed as lump sums by 30 June 2024.

  **Moral Basis of Obligation**

  Our charge is to determine what the university owes and to whom. This is a question of corrective justice, not distributive welfare. The university's liability arises from its specific historical agency—the benefactor's trade and the presidents' transactions—not from the current socioeconomic status of the victims' lineage. We owe restitution because we breached specific duties to specific people, not because their descendants are currently poorer than a counterfactual baseline.

  **Addressing the Economist Findings**

  The strongest argument against this recommendation relies on the commissioned economic report, which finds that descendants of people enslaved by the university are not measurably worse off than Black families in the same counties whose ancestors were enslaved elsewhere. Three members argue this dissolves the case for restitution. This argument conflates *comparative harm* with *unjust enrichment*.

  While the wealth gap may track twentieth-century policy rather than specific nineteenth-century enslavers, our obligation is not to fix the entire racial wealth gap. It is to disgorge gains derived from specific illicit acts. If a bank steals $100 from a customer, it owes restitution even if the customer subsequently wins a lottery and is wealthier than their peers. The economist's finding addresses the *efficacy* of reparations as broad poverty alleviation, but it does not address the *liability* of the university for its own history. To accept the committee members' conclusion is to assert that institutional liability vanishes if systemic forces later compound the victim's disadvantage elsewhere. This undermines the specific moral link between the wrongdoer and the wronged. We must repair our own breach, regardless of outside variables.

  **Addressing the Non-Identity Problem**

  A second objection posits that descendants owe their existence to the enslavement, implying they were not harmed by it. This is the non-identity problem. While logically coherent in abstract population ethics, the proponent conceded that accepting this principle would exonerate a wrongdoer whenever the victim's existence depended on the act. We cannot adopt a moral framework that immunizes perpetrators of grave injustice simply because the chain of causation ensured the victim's birth. The harm here is not merely existence-based; it is the theft of liberty, labor, and lineage. The university benefited from this theft; the descendants inherit the moral claim to that stolen value. To deny this based on metaphysical technicalities is to prioritize logical consistency over moral coherence.

  **Concrete Allocation and Timeline**

  Direct payments (Option A) are the primary obligation. At $240,000 per descendant, this acknowledges the specific debt to the lineage of the 310 enslaved people. However, given the systemic barriers noted by the economists, a pure individual payment risks being absorbed by the very structural inequities identified in the report. Therefore, the 20% allocation to Option B serves as a structural buffer, investing in the community infrastructure where descendants reside. This hybrid approach satisfies the specific duty to the lineage while acknowledging the contextual reality of their economic environment.

  Option C (scholarships) is rejected because it diffuses the obligation to a general class (Black students) rather than the specific victims of the university's acts. While diversity is valuable, it is not restitution.

  **Timeline**

  The fund should be disbursed by 30 June 2024. Delays compound the injustice. The university should engage a third-party administrator to contact descendants immediately, ensuring privacy and security. The neighborhood endowment should be established concurrently, governed by a board including community representatives.

  **Conclusion**

  We cannot calculate the full cost of slavery, nor can we fix every systemic inequity. But we can account for our own ledger. The university profited from human trafficking; it must now pay the debt. The economist's data describes the world as it is; our recommendation describes what justice requires. I urge the committee to adopt this allocation and submit it to the President by the 15 March deadline.
