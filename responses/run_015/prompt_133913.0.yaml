answer: |-
  To determine which framework offers a more coherent account of responsibility in transitional governance, we must look at how each structure handles the relationship between the *act*, the *actor*, and the *community* they serve. The Classic Dirty Hands model concentrates responsibility; the Deferred Institutional Culpability model distributes it. In the specific context of a fragile transition from tyranny to democracy, the distributed model is structurally superior, but it carries a fatal weakness: it can easily become a mechanism for evasion unless the actor binds herself to the very future she invokes.

  ### The Architecture of Concentration vs. Distribution

  The Classic Dirty Hands framework treats moral responsibility as a finite substance that must reside somewhere. When the security director orders the surveillance or detention of a former ally to save the regime, the moral toxicity of that act adheres to her conscience. The coherence of this model relies on the idea that the violation of principle is real and cannot be washed away by "necessity." The leader pays the price through enduring guilt. This preserves the integrity of the moral law (by admitting it was broken) and the integrity of the leader (by showing she feels the break).

  However, in transitional governance, this concentration of guilt creates a bottleneck. If the director bears the entire moral weight alone, the rest of the provisional council—and the emerging citizenry—are implicitly absolved. They benefit from her "sin" (stability) without sharing the stain. This turns the transition into a drama centered on the leader's soul rather than the polity's healing. It risks making the violation a private transaction between the leader and her conscience, rendering the victims mere props in her moral tragedy.

  Deferred Institutional Culpability (DIC) changes the geometry of this burden. It posits that the wrong committed today is a debt incurred by the state, not just the individual. By structurally relocating the reckoning to future bodies—truth commissions, courts, constitutional assemblies—the framework acknowledges that the current emergency cannot resolve the moral contradiction it creates. The coherence here lies in matching the *scale* of the wrong to the *scale* of the remedy. A systemic violation (betraying the revolution's principles) requires a systemic response (institutional reform), not just a leader's insomnia.

  ### The Risk of Administrative Sanitization

  Your central concern is whether DIC dissolves dirty hands into clean procedure. This is the precise point where the framework risks collapse.

  In the Dirty Hands model, the stain is immediate and visceral. The leader *knows* she is wrong now. In DIC, the acknowledgment of wrong is real, but the pain of it is scheduled for later. This creates a dangerous psychological gap. The director can authorize covert measures today with the comforting thought that "the Truth Commission will assess this in five years." This allows her to sleep at night, effectively sanitizing the act through bureaucratic deferral. If the deferral functions as a delay of judgment that the actor expects to survive unscathed, then DIC is not a theory of responsibility; it is a theory of impunity dressed in the language of process.

  For DIC to remain coherent, the deferral cannot be a displacement of the self. The director must not view the future institutions as judges who might acquit her, but as mechanisms to which she voluntarily submits her own future. She must accept that the "reparative assembly" may rightly condemn or punish her. If she places herself above the future institutions she empowers, the architecture fails. It becomes a way to aestheticize violence—turning a moral wound into a policy timeline.

  ### The Mark on the Actor

  Can DIC survive the insistence that the actor herself must remain marked? Yes, but the nature of the mark changes.

  In Dirty Hands, the mark is internal (guilt). In DIC, the mark is existential and temporal. The leader lives under a suspended sentence. She governs knowing that her legacy is not yet written and that she has no control over the verdict. This requires a different kind of courage than accepting immediate guilt. It requires the humility to build institutions that may ultimately destroy her reputation or liberty.

  If the director accepts this, DIC preserves the reality of the moral wrong more effectively than Dirty Hands. Why? Because Dirty Hands ends with the leader's feeling of guilt, which is private and unverifiable. A leader can claim to have "dirty hands" as a badge of honor, a sign of her toughness. DIC, however, makes the wrong a matter of public record to be adjudicated later. It moves the stain from the leader's soul to the state's archive. This ensures the wrong is not forgotten when the leader eventually dies or retires. The mark remains on the history of the institution, not just the memory of the individual.

  ### Honoring Victims vs. Aestheticizing Violence

  This is the decisive factor for transitional governance.

  The Dirty Hands model centers the perpetrator. The victim's suffering is the catalyst for the leader's moral dilemma, but the resolution is found in the leader's acceptance of guilt. The victim waits while the leader wrestles with their conscience. In a transition, this is insufficient. Victims do not need the security director to feel bad; they need to know the violence will not be repeated and that the truth will be structurally embedded.

  DIC honors victims by prioritizing the *repair* over the *repentance*. It acknowledges that the leader's guilt does not fix the harm. By deferring culpability to institutions designed for reparations and reckoning, it promises the victims a future voice. However, this is only honorable if the deferral is finite and guaranteed. If the "future institutions" are vague promises used to pacify the present, then DIC aestheticizes the violence. It turns the victims' pain into a line item in a transition roadmap.

  For DIC to be coherent, the director must treat the future institutions not as a safety net, but as a tribunal. She must authorize the covert measures while simultaneously signing the decree that empowers the future court to judge her for them. This binds the two frameworks: she accepts the Dirty Hands stain personally, but she refuses to let that stain be the final word. She forces the state to carry the memory of the wrong long after she is gone.

  ### Conclusion: The Verdict on Coherence

  Deferred Institutional Culpability offers the more coherent account for *transitional governance*, but only if it is rigorously constrained.

  The Classic Dirty Hands model is coherent for an individual in a crisis, but it is politically solipsistic. It resolves the moral tension within the leader, leaving the state's moral architecture unchanged. It suggests that once the leader has suffered enough, the account is balanced. In a transition, the account is never balanced by one person's suffering.

  DIC is more coherent because it aligns responsibility with the reality of state-building. It admits that the revolution cannot be pure, but insists that the impurity must be processed by the democracy that follows. It treats the wrong as a public debt rather than a private sin.

  However, DIC only survives if the director refuses to use the "future" as an alibi for the "present." She must remain marked not just by the knowledge of her guilt, but by the vulnerability to future judgment. If she constructs the future institutions to ensure her own immunity, she has not deferred culpability; she has laundered it. If she constructs them to ensure her own accountability, she transforms the dirty hands from a tragic necessity into a foundational covenant for the new regime. The violence of the transition is not erased, but it is prevented from becoming the hidden foundation of the new state. The stain is not removed; it is institutionalized as a warning.
