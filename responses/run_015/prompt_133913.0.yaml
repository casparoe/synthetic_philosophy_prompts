          2.  *Deferred Institutional Culpability (DIC):* Wrong acknowledged but structurally relocated to future institutions (reparations, truth commissions, etc.), responsibility distributed across time.
      *   **Specific Question:** Which offers a more coherent account of responsibility in transitional governance? Does DIC preserve the reality of moral wrong, or does it dissolve guilt into procedure? Can deferral survive the insistence that the *actor* remains marked? Does distributing culpability honor victims or aestheticize violence?
      *   **Constraint:** No bibliography or survey of political theory. Direct comparison of conceptual structures. Explain to a reader who understands moral stakes but has no access to external texts.
      *   **Tone:** Analytical, philosophical, nuanced, direct.

  2.  **Deconstruct the Two Frameworks:**

      *   **Dirty Hands (DH):**
          *   *Focus:* The Individual Agent.
          *   *Mechanism:* Necessity forces a violation. The violation is real. The guilt is real.
          *   *Outcome:* The leader is "stained." They suffer psychologically/spiritually. This suffering is the proof of their moral seriousness.
          *   *Risk:* Solipsism. The leader's guilt becomes the story, potentially overshadowing the victims. It can become a badge of honor ("I suffered for you").

      *   **Deferred Institutional Culpability (DIC):**
          *   *Focus:* The Temporal/Structural Arc.
          *   *Mechanism:* The act is committed now, but the *judgment* and *atonement* are scheduled for later institutions.
          *   *Outcome:* Responsibility is a debt owed to the future polity, not just a feeling in the leader's gut.
          *   *Risk:* Procrastination. The "future" might never arrive. It can turn tragedy into bureaucracy. It might let the leader off the hook *now*.

  3.  **Evaluate Coherence in Transitional Governance:**

      *   *Transitional Context:* This isn't normal politics. It's the bridge between tyranny and democracy. Stability is fragile. Truth is contested.
      *   *DH in Transition:* Fits the tragedy of the moment. Acknowledges that revolutionaries often become what they fought. But it centers the leader's soul.
      *   *DIC in Transition:* Fits the *project* of transition. Transition is about building institutions. It acknowledges that one person cannot fix systemic violence. But it risks abstraction.

  4.  **Address the Specific Challenges:**

      *   *Does DIC preserve the reality of moral wrong?* Yes, if the future institutions are guaranteed. No, if they are hypothetical.
      *   *Does it dissolve dirty hands into clean procedure?* This is the biggest risk. If the leader says, "The Truth Commission will deal with this," she might sleep too well at night.
      *   *Can deferral survive the insistence that the actor remains marked?* This is the crux. DIC needs to ensure the leader isn't absolved *personally*, even if the *burden* is shared.
