      *   *Section 4: Victims and Aesthetics.* DH makes the leader's pain the monument. DIC makes the institution the monument. DIC is better for victims *if* it delivers justice, but worse if it delays it indefinitely.
      *   *Conclusion:* Which is more coherent? DIC is more *politically* coherent for transition, but only if it incorporates the *personal* weight of DH. A hybrid is needed, but strictly answering the prompt: DIC is more robust for *governance*, provided it doesn't become an alibi.

      *Refining the Argument:* Wait, the prompt asks which offers a *more coherent account*. I need to take a stance while acknowledging nuances.
      *Argument:* DIC is more coherent for *transitional governance* specifically, because transition is inherently about time and institution-building. However, it fails if it removes the *personal* mark. The coherence depends on the leader binding *herself* to the future reckoning. If she exempts herself, it's a lie. If she submits to it, it transforms DH from a private tragedy into a public covenant.

      *Wait, let's look closer at the "Stain" requirement.* The prompt asks if DIC can survive the insistence that the *actor herself must remain marked*.
      *Critique of DIC:* It naturally tends toward absolution ("We will fix this later").
      *Critique of DH:* It tends toward martyrdom ("I am the sinner").
      *Verdict:* DH is more honest about the *immediate* moral reality. DIC is more honest about the *political* necessity. But for *responsibility*, DH is stricter on the individual. However, in transition, individual guilt can be a distraction from systemic repair.
      *Decision:* I will argue that **Deferred Institutional Culpability is more coherent for transitional governance, but only on the condition that the deferral is not a displacement of the self.** The leader must pledge to stand before the very tribunals she empowers. Without that, DIC is bureaucratic evasion. With it, it transforms the "stain" from a private wound into a public debt.

  6.  **Developing the Narrative Voice:**
      *   Avoid academic jargon (e.g., "Weberian," "Walzerian").
