prompt: |-
  I'm drafting a novel about a lawyer defening a couple charged with consensual incest—no coercion, no minors, just pure social disgust. I got tangled up in the Hart-Devlin debate and now I'm obsessed with a weird pattern: criminal codes in liberal democracies still have these 'morals offenses'—obsenity laws, public indecency bans, adult incest statutes—where the text literally cites 'public morality' or 'the moral fabric of society.' But those same systems mostly legalized gambling and private drug use, even though those cause real harm. So what philosphical commitments does that selective practice presuppose? Is it Devlin's view that society has a right to defend a shared moral code like a kind of immune system, or does it smuggle in something stranger—like the idea that disgust itself tracks moral wrongness? And is it even consistent with Hart's harm principle if we treat collective disgust as a form of harm?

  Also, be straight with me: say what would change your mind—maybe evidence that disgust is actually a reliable heursitic for hidden harm? And point out where your reasoning is most likely to fail, the part that's reaching.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is writing a novel about a lawyer defending a couple charged with consensual adult incest.
      *   **Core Question:** They are asking about the philosophical underpinnings of "morals offenses" (like incest, obscenity) in liberal democracies that otherwise permit harmful activities (gambling, drugs). Specifically, they want to know what philosophical commitments this selective practice presupposes (Devlin vs. Hart, disgust as moral tracking, collective disgust as harm).
      *   **Specific Constraints:**
          *   "Be straight with me." (Direct, honest tone).
          *   "Say what would change your mind." (Intellectual humility, falsifiability).
          *   "Point out where your reasoning is most likely to fail, the part that's reaching." (Self-critique/limitations).
      *   **Underlying Theme:** The tension between legal moralism (Devlin) and liberalism/harm principle (Hart).

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Hart vs. Devlin:**
          *   *Hart (Liberalism):* Law should only prevent harm to others (Mill's Harm Principle). Private morality is not the law's business.
          *   *Devlin (Legal Moralism):* Society has a right to preserve its shared moral fabric. Disintegration of morality = disintegration of society.
      *   **The User's Observation:** Liberal democracies *do* criminalize some "harmless" acts (incest) while allowing some "harmful" acts (gambling, drugs). Why?
      *   **Possible Explanations:**
          1.  *Residual Legal Moralism:* Devlin won some battles.
          2.  *Disgust as Heuristic:* Haidt, Kahan, etc. Disgust signals "wrongness" even without tangible harm.
          3.  *Hidden Harm:* Incest *does* cause harm (genetic, familial power dynamics), even if the statute ignores it.
          4.  *Expressive Function of Law:* Law teaches values, not just prevents harm.
          5.  *Political Feasibility:* It's easier to ban incest than gambling (lobbying, revenue).

  3.  **Address the Specific Questions:**
      *   *What philosophical commitments does this presuppose?* It suggests a hybrid system. Pure Hartian liberalism isn't the reality. It presupposes that *some* moral intuitions are constitutive of the social order, not just preferences.
      *   *Is it Devlin's view?* Yes, partially. The "immune system" analogy is exactly Devlin.
      *   *Does it smuggle in disgust tracking moral wrongness?* Yes, this is "moral dumbfounding" (Haidt). People feel disgust and assume harm must exist.
      *   *Is it consistent with Hart if collective disgust = harm?* This is the tricky part. If "offense" or "psychic distress" counts as harm, Hart's principle stretches until it breaks. Most liberals reject "disgust" as sufficient harm.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the premise. It's a classic legal philosophy puzzle.
      *   **The Philosophical Commitments (The "Why"):**
          *   It's not *pure* Devlin, but it's not *pure* Hart either.
          *   It presupposes **Expressive Legalism**: Law isn't just a stop-sign; it's a teacher.
          *   It presupposes **Status Harm**: Violating taboos harms the *status* of the institution (family), even if individuals consent.
          *   It presupposes **Disgust as Proxy**: Legislators use disgust as a shortcut for "stuff we can't articulate the harm of yet."
      *   **The Hart/Devlin Tension:**
          *   Address the "collective disgust as harm" point. If we accept this, the Harm Principle becomes toothless. Any majority whim becomes "harm." Hart would reject this.
      *   **What Would Change My Mind (Falsifiability):**
          *   Need empirical evidence. If incest shows *no* negative societal correlation anywhere.
          *   If decriminalization leads to *no* increase in abuse/coercion (slippery slope argument).
          *   If disgust is proven culturally malleable to the point of being meaningless (e.g., if future generations view it like left-handedness).
      *   **Where My Reasoning Might Fail (Self-Critique):**
