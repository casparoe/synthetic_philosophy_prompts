  2.  **The Stability Rule:** Hinges are enduring truths, excluding transient states. This fits "Earth existed" (permanent) versus "The sun will rise" (contingent). "Here is a hand" counts as stable embodiment.
      *   **Prediction:** **Not a Hinge**. "Not dreaming" describes a fleeting conscious state, unlike fixed historical or ontological facts.

  **Best Guess:** She follows the **Functional Rule**. Her classification of "Here is a hand" (immediate perception) parallels "Not dreaming" (immediate experience). Furthermore, Wittgenstein suggests dreaming certainty functions hinge-like (*On Certainty* §676), a text likely guiding her specialist view.

