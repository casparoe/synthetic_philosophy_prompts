  1.  **Analyze the User's Request:**
      *   **Topic:** Species Problem in Philosophy of Biology.
      *   **Goal:** Map out what *actually matters* right now (prioritization), not just list debates.
      *   **Constraints:** 3-year timeline, no lab budget (theoretical/conceptual work only).
      *   **Specific Questions to Address:**
          *   Is Essentialist vs. Relationalist still upstream?
          *   Have hybrid zones/HGT displaced traditional debates?
          *   What about the "phase transition" framing (does it solve or bypass ontology)?
          *   Practical side: Conservation funding vs. metaphysical messiness.
          *   **Requirement:** Prioritize questions (upstream vs. downstream, tractable vs. intractable), identify shaky reasoning, defend the agenda, *no reading list*.

  2.  **Deconstruct the Current State of the Field:**
      *   *Traditional Debate:* Essentialism (types) vs. Population Thinking (individuals/clusters). This is largely "settled" in the sense that almost no one is a hard essentialist anymore. The debate has shifted to *which* relational criteria matter (reproductive isolation, ecological niche, phylogenetic lineage).
      *   *The "Microbe Problem":* Horizontal Gene Transfer (HGT) breaks the tree of life and the biological species concept (BSC). This is a major pressure point.
      *   *The "Phase Transition" Idea:* This comes from theoretical biology/complexity science (e.g., work by Venditti, Pagel, or more recently, philosophical interpretations of speciation dynamics). It treats species as stable attractors in a fitness landscape.
      *   *The "Conservation" Problem:* Policy needs discrete units (ESUs, MUs). Philosophy often says "it's a continuum." This creates friction.

  3.  **Evaluate the "Upstream" Questions:**
      *   *Essentialism vs. Relationalism:* This is *dead* as a live research program for a 3-year project. Everyone agrees species are historical entities. Tackling this is a waste of time.
      *   *Ontology (Individuals vs. Classes):* Still relevant, but often verbal. If you treat species as "lineage segments," the ontology follows.
      *   *The Real Upstream Issue:* **Operationalization vs. Reality.** The gap between what species *are* (metaphysics) and how we *find* them (systematics/genomics).

  4.  **Analyze the Specific Framings:**
      *   *Hybrid Zones/HGT:* These aren't just empirical problems; they are metaphysical stress tests. They show that "boundedness" is porous.
      *   *Phase Transitions:* This is promising. It suggests species are *emergent stable states* rather than static categories. It potentially *dissolves* the ontology question by changing the vocabulary from "what kind of thing is it?" to "under what conditions does clustering persist?"
      *   *Conservation:* This is the "cash value" test. If metaphysics can't guide policy, is it useless? Not necessarily, but it needs to translate.

  5.  **Develop the Prioritization (The Agenda):**

      *   *Drop:* Hard Essentialism. It's a strawman.
      *   *Drop:* Pure "Individual vs. Class" ontology debates *in isolation*. They stall out.
      *   *Prioritize 1 (Upstream):* **The Stability Problem (Phase Transitions).** Why do clusters persist despite gene flow? This bridges microbes, hybrids, and macro-organisms. It makes ontology secondary to dynamics.
      *   *Prioritize 2 (Midstream):* **Pluralism vs. Pragmatism.** Don't ask "Which concept is true?" Ask "Which concept minimizes error costs in specific contexts (e.g., conservation vs. phylogenetics)?"
      *   *Prioritize 3 (Downstream/Practical):* **The Policy Translation Layer.** How to justify discrete funding units without claiming metaphysical discreteness. (e.g., Risk-based thresholds).

  6.  **Address the "Shaky Reasoning" Requirement:**
