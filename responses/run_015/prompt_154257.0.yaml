answer: |-
  **Project Title:** Ontological Mismatch and the Limits of Competence: A Frame-Relative Model of Consent Validity

  **Research Question**
  Is decision-making competence an intrinsic threshold capacity of an agent, or is it relationally constituted by the conceptual taxonomy of the institution soliciting consent? Specifically, when an institution operates within an ontology inaccessible to the consent-giver (e.g., algorithmic risk probabilities vs. human narrative certainty, or cross-cultural psychiatric categories), does the standard individualist model of validity collapse?

  **Problem Statement & Gap in Literature**
  Current normative frameworks in bioethics and legal theory treat competence as a universal property of the agent. The standard triad—capacity, information, and voluntariness—assumes a shared conceptual ground between parties. Literature on deception and coercion focuses on the *manipulation* of will or the *withholding* of truth, presuming that if truth is disclosed and the agent is rational, consent is valid.

  This literature leaves a critical gap: it treats misunderstanding as a failure of individual cognition or communication clarity, rather than a structural ontological mismatch. When a user consents to an AI mediator whose decision ontology (e.g., high-dimensional vector space) they literally cannot represent, or when a patient consents to treatment based on psychiatric risk categories that do not map onto their cultural framework of distress, the standard model fails. The agent may be universally "competent" yet locally "incompetent" relative to the institution's framework. Current theory lacks the vocabulary to address validity when the *terms* of the transaction are ontologically opaque to the agent.

  **Methodology: Philosophical Conceptual Analysis**
  This project will employ conceptual analysis and normative modeling rather than empirical survey. Surveys of attitudes toward consent measure psychological intuitions, not validity conditions. Knowing *whether* people feel coerced does not determine *if* the consent was morally valid.

  Progress requires dissecting the necessary conditions for "understanding" in consent. I will construct thought experiments involving radical translation and algorithmic opacity to test the limits of the "universal rationality" assumption. By isolating cases where the agent is fully rational but ontologically mismatched, I will demonstrate that competence is not a binary switch but a relational property dependent on the "distance" between the agent's conceptual scheme and the institution's operational taxonomy. This approach avoids the naturalistic fallacy of deriving norms from data, focusing instead on the logical prerequisites for moral authorization.

  **Expected Results & Deliverables**
  The primary output will be a draft paper arguing for a **Frame-Relative Competence Standard**. If successful, the project will yield:
  1.  A diagnostic criterion for "Ontological Mismatch" distinct from mere complexity or jargon.
  2.  A normative proposal for institutional design: a "Translation Duty" requiring institutions to bridge ontological gaps, not just linguistic ones.
  3.  A revised definition of valid consent that incorporates taxonomic accessibility as a condition of competence.

  **Conditions of Failure**
  The project fails if:
  1.  The argument collapses into standard paternalism (i.e., concluding that because agents cannot understand, institutions should decide for them).
  2.  The concept of "conceptual taxonomy" proves too vague to operationalize without circularity.
  3.  It becomes clear that the problem is purely epistemic (lack of information) rather than ontological (incommensurable frameworks), in which case existing disclosure models suffice.

  **Scope and Timeline (3 Months)**
  *   **Month 1: Mapping the Gap.** Critique the universalist competence model. Define "ontological mismatch" using cases from cross-cultural psychiatry and algorithmic governance.
  *   **Month 2: Constructing the Argument.** Develop the frame-relative model. Test against counter-arguments (e.g., that this sets the bar for consent too high).
  *   **Month 3: Normative Framework.** Draft the "Translation Duty" implications for institutional design and finalize the fellowship paper.

  This scope is limited to the *validity conditions* of consent; it will not propose specific legal statutes or empirical metrics for measuring ontological distance, leaving those for subsequent applied work.
