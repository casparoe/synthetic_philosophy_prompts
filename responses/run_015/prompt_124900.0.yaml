answer: |-
  # Molyneux's Problem: Pre-Discussion Diagnostic

  **Instructions:** Answer the following 8 questions based on your intuition about the *scenario*, not on what you think Locke or Berkeley said. There are no right answers yet. Circle the option that best fits your gut reaction.

  ### Part 1: The Core Case (Vision & Touch)
  *Scenario: A person blind from birth has learned to distinguish a cube from a sphere by touch. Their sight is suddenly restored. They are seated. The objects are placed on a table in front of them. They cannot touch the objects yet.*

  **1. The Pointing Test**
  You ask the subject: "Point to the sphere you were just holding." They are not allowed to say the word, just reach. Do they reach for the correct object?
  *   (A) Yes, immediately.
  *   (B) No, they guess at chance levels.
  *   (C) They hesitate but get it right eventually without touching.

  **2. The Naming Test**
  You ask the subject: "Which one is the 'cube'?" (Assume they know the word 'cube' from touch). Can they say the correct name without touching?
  *   (A) Yes, immediately.
  *   (B) No, they cannot link the word to the visual image yet.
  *   (C) The question makes no sense (they don't "see" a cube yet).

  ### Part 2: Analogous Cases (Other Senses & Machines)
  *Scenario: We test the same logical problem in different systems to see if vision is special.*

  **3. The Cochlear Implant Case**
  A child deaf from birth knows what a dog looks like. They receive a cochlear implant. The first time they hear a dog bark (without seeing the dog), do they know the sound belongs to the animal they know visually?
  *   (A) Yes, the recognition is immediate.
  *   (B) No, they must learn to associate the sound with the image.
  *   (C) It depends on the age of the child (critical periods).

  **4. The Machine Learning Case**
  A robot has two sensors: a camera and a tactile glove. It is trained on images *and* trained on textures, but **never** told which image matches which texture. You show it a picture of sandpaper and the physical sandpaper. Can its internal system match them without new training?
  *   (A) Yes, if the mathematical structure of the data is similar enough.
  *   (B) No, it needs a "bridge" dataset pairing the two.
  *   (C) "Matching" is the wrong word; it just minimizes error functions.

  ### Part 3: Time, Action, and Definition
  *Scenario: We look at what changes over time and what conditions are required for "seeing."*

  **5. The One-Week Delay**
  The subject fails the tests on Day 1. On Day 7, after bumping into things and being corrected, they succeed. What changed?
  *   (A) Nothing fundamental; they finally accessed the knowledge they already had.
  *   (B) They learned a new skill (associating sight-data with touch-data).
  *   (C) Their visual system physically calibrated to the world.

  **6. The Paralysis Condition**
  Suppose the subject is fully paralyzed (cannot move eyes, head, or hands) but can still process visual data. Does the Molyneux question still make sense for them?
  *   (A) Yes, vision is about input, not movement.
  *   (B) No, seeing shapes requires knowing how to explore them.
  *   (C) Yes, but they would fail the test permanently.

  **7. The "Same Property" Question**
  When the subject sees a sphere and feels a sphere, is "roundness" the *same property* detected by two sensors, or two *different properties* that always happen together?
  *   (A) Same property (amodal).
  *   (B) Different properties (modality-specific).
  *   (C) It's a category error to ask if they are the "same."

  **8. The Resolution**
  How do we settle this debate?
  *   (A) Philosophical argument (the logic of "shape" dictates the answer).
  *   (B) Empirical science (surgery, fMRI, psychophysics).
  *   (C) We can't; it depends on how we define "recognise."

