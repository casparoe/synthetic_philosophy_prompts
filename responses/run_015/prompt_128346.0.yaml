prompt: |-
  I am a journalist working on a long feature about how an artificial agent ought to decide when it may be copied, simulated, predicted, or run more than once — a cluster of questions that has migrated out of seminar rooms and into the design of actual systems. Two of my sources, one an advocate of updateless decision theory and one an advocate of updateful (causal) decision theory, have been arguing by email for the better part of a year and have at last agreed to an adversarial collaboration. They have asked me for a template; I would rather hand them something substantive to react to. Please draft the joint statement they could both sign.

  A few stipulations they have already accepted, and which you should treat as fixed: the trustee in each scenario below is a single decision procedure, its source code is known to the other parties in the scenario, and its copies or simulations are exact; there are no causal back-channels between runs; money is denominated in a single endowment pot unless stated otherwise; and the word "rational" is to be used descriptively until the document says otherwise. Please do not adjudicate between the two positions — I do not want a verdict, I want the document. Do not cite or name papers, authors, or schools beyond the two camps themselves; the whole thing should stand on argument alone.

  The two cases I would like used as the shared test-bed are these.

  **Case A, the odd digit.** Yesterday, a benefactor ran an exact simulation of the trustee's decision procedure and put to it the very question that may be put to the trustee today: pay £1,000 out of the endowment, or decline. If the simulation paid, the benefactor deposited £1,000,000 into the endowment then and there; if it declined, nothing was deposited. A bit B is then fixed by a mathematical fact the trustee cannot currently compute — say, whether the trillionth digit in the decimal expansion of pi is odd. Both camps stipulate that the trustee's prior over B is one half, that B is in no way causally influenced by what the trustee does, and that B is in principle computable. If B takes one value, the trustee is never asked anything and the matter closes with whatever sum was deposited. If B takes the other value, the trustee is asked, and it knows which branch it is in: pay £1,000 now, or decline, with no further money at stake either way. What should the trustee do, and what should it have wanted, yesterday, to be disposed to do?

  **Case B, the two centres.** The trustee's programme is instantiated twice, in Reading and in Inverness, on identical hardware with identical inputs; nothing available to either instantiation distinguishes the two, and they cannot communicate. Each is told that if exactly one instantiation presses within the hour, the endowment receives £1,000,000, that if both or neither press it receives nothing, and that pressing costs nothing. What should the policy be, and what should an instantiation do once it is running? I would also like the document to say what changes if the prize is paid per instantiation to a local budget rather than once to the common pot, and whether that is a question of decision theory or a question about what the trustee is for.

  **Case C, the retrofit.** In Case A, at the moment the trustee is asked, it may pay £100 to delete its record of the interim evidence — including its knowledge that it was asked at all — and hand the decision to a policy registered before B was resolved. Would either camp's agent take that option? Both of them, I suspect, have something invested in the answer.

  What I want, in this order:

  1. A numbered section of agreed claims — including about the two cases themselves, about what a money-pump or "why aren't you rich" style argument can and cannot establish, about whether "you should have bound yourself in advance" is a criticism of a decision theory or a remark about an agent's options, and about what counts as a solution to a decision problem at all. Please make them substantive: I will spot claims so thin that no one could deny them.
  2. A disagreements table, with one row per crux and columns for: the crux, stated as a sub-question such that settling it would move at least one side; the updateless commitment, phrased as an updateless theorist would phrase it; the updateful commitment, phrased as an updateful theorist would phrase it; the case or argument both accept as bearing on that crux; and, written down in advance, what each side predicts that case or argument will show. The cruxes I would expect to see addressed include: whether the object of evaluation is a policy or an act, and from which standpoint it is evaluated; whether the outputs of other computations implementing one's own decision procedure are things one controls, or merely events correlated with one's action; whether indexical or self-locating information is admissible evidence, and how value aggregates across instantiations; what counterfactuals each theory needs — counterfactuals about logical facts on one side, counterfactuals about what a copy of oneself would have done on the other — and whether that need is a genuine cost; and, finally, whether a decision theory that advises its agents to self-modify into agents of another sort has thereby indicted itself, and where the ex ante standpoint comes from for a system that was trained rather than designed and has no identifiable first moment. Please also register where the updateful side must disambiguate which updateful theory it speaks for, and where it will want to gesture at evidential decision theory as a third position not at the table.
  3. A short closing section, "What would move us": what each side would count as evidence or argument against its own view, and whether there is anything both agree would actually settle part of the dispute — a formal equivalence result, a solved theory of logical counterfactuals, a tournament, or something else.
  4. A brief note on which parts of the dispute are verbal rather than substantive, and why.

  Where you cannot find a formulation of one side's view that the other side would accept as a fair statement of it, say so in the table rather than papering over the gap; that itself will be useful to me.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Role:** Journalist drafting a template for an adversarial collaboration between two decision theory experts (Updateless vs. Updateful/Causal).
      *   **Task:** Create a substantive joint statement they can sign/react to.
      *   **Constraints:**
          *   Do not adjudicate between positions.
          *   Do not cite papers/authors/schools beyond "Updateless" and "Updateful (Causal)".
          *   Treat stipulations as fixed (single decision procedure, known source code, exact copies, no causal back-channels, single endowment pot unless stated, "rational" is descriptive).
          *   Use specific Cases A (Odd Digit/Logical Uncertainty), B (Two Centres/Coordination), and C (Retrofit/Self-Modification).
          *   Structure: 1. Agreed Claims, 2. Disagreements Table, 3. "What Would Move Us", 4. Note on Verbal Disputes.
          *   Tone: Substantive, rigorous, avoiding thin platitudes.
      *   **Specific Content Requirements:**
          *   Address money-pump arguments, "why aren't you rich", pre-commitment criticism, definition of a solution.
          *   Table columns: Crux, Updateless Commitment, Updateful Commitment, Shared Case/Argument, Predictions.
          *   Specific Cruxes: Policy vs. Act, Control over Copies, Indexical Evidence/Value Aggregation, Counterfactual Needs (Logical vs. Causal), Self-Modification/Indictment, Ex Ante Standpoint for Trained Systems.
          *   Note where Updateful needs disambiguation (CDT vs. EDT).
          *   Note where fair statement isn't possible.

  2.  **Deconstruct the Cases:**
      *   **Case A (Odd Digit):** Logical uncertainty + Newcomb-like problem.
          *   *Setup:* Simulation happened yesterday. Pay £1k now -> £1M deposited yesterday if sim paid. Bit B (Pi digit) determines if asked.
          *   *Updateless:* Pay. The decision correlates with the sim's decision. Ex-ante expected value is higher.
          *   *Updateful (CDT):* Decline. The deposit is already made (or not). Paying now costs £1k with no causal impact on the past.
      *   **Case B (Two Centres):** Coordination problem / Self-locating belief.
          *   *Setup:* Two identical instances. Prize if *exactly one* presses.
          *   *Updateless:* Randomize (50/50) or use a shared policy that ensures exactly one presses (if symmetry breaking is possible via policy). If policy must be identical, 50/50 mixed strategy yields 50% success rate.
          *   *Updateful (CDT):* Each sees no causal link to the other. If I press, does it change the other? No. But they share a policy. CDT often struggles here without pre-commitment.
          *   *Variation:* Prize per instantiation vs. common pot. This touches on altruism vs. self-interest definition.
      *   **Case C (Retrofit):** Self-modification to forget evidence.
          *   *Setup:* Pay £100 to forget B and hand decision to pre-B policy.
          *   *Updateless:* Yes (if the gain from acting updatelessly > £100). They *are* effectively updateless, so maybe no need, but if they updated, they'd pay to undo it.
          *   *Updateful:* No. Information is never negative value in CDT. Paying to forget is irrational.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to be substantive, not trivial.
      *   *Money Pumps:* Agree they show inconsistency but not necessarily wrongness of the underlying norm (could be implementation error).
      *   *Why Aren't You Rich:* Agree it's pragmatic but depends on the environment distribution.
      *   *Pre-commitment:* Distinguish between "theory is wrong" vs. "agent lacked opportunity".
      *   *Solution:* A solution must specify an output for the agent in the scenario, not just an abstract norm.
      *   *Cases:* Agree on the factual setup (no magic, code is known).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Crux 1: Object of Evaluation.* Policy (Updateless) vs. Act (Updateful).
      *   *Crux 2: Control/Correlation.* Logical control over sims/copies (Updateless) vs. Causal control only (Updateful).
      *   *Crux 3: Indexical Evidence.* Admissible for conditioning (Updateful) vs. Screened off by policy selection (Updateless).
      *   *Crux 4: Counterfactuals.* Logical counterfactuals (Updateless cost) vs. Causal counterfactuals (Updateful cost).
      *   *Crux 5: Self-Modification.* Dynamic consistency (Updateless) vs. Instrumental rationality of updating (Updateful). *Note: Updateful might need to distinguish CDT (won't modify) vs. EDT (might).*
      *   *Crux 6: Ex Ante Standpoint.* Training history vs. Design moment.
      *   *Constraint Check:* Must note where Updateful needs to specify CDT vs. EDT. The prompt says "Updateful (Causal)", so I should stick to CDT primarily but note the EDT edge case where requested.
      *   *Constraint Check:* If a fair statement isn't possible, state it. (e.g., Updateless might think Updateful's definition of "control" is incoherent).

  5.  **Drafting Section 3: What Would Move Us:**
      *   *Updateless:* Show logical counterfactuals are ill-defined. Show dynamic consistency isn't a virtue.
      *   *Updateful:* Show a money pump that can't be avoided by pre-commitment. Show logical correlation doesn't imply decision-relevance.
      *   *Shared:* Formal equivalence, tournament results in specific environments.

  6.  **Drafting Section 4: Verbal Disputes:**
      *   Definitions of "rational", "control", "agent".
      *   Distinction between *recommending* an action vs. *evaluating* an outcome.

  7.  **Refining and Polishing:**
      *   *Tone Check:* Is it journalistic yet technical? Yes.
      *   *Constraint Check:* Did I name drop? No. Did I solve the cases? No, I presented them as the test bed.
      *   *Specific Prompt Instructions:* Ensure Case A, B, C are integrated into the arguments/table. Ensure the "Retrofit" case is addressed in the self-modification crux. Ensure the "Two Centres" prize variation is noted.
      *   *Formatting:* Numbered sections, clear table.

      *(Self-Correction during drafting)*: I need to be careful with the "Updateful" label. The prompt specifies "Updateful (Causal)". I should ensure I don't conflate CDT and EDT too much, though the prompt asks to note where EDT might be gestured at. I will stick to CDT as the primary foil to Updateless, as is standard in this specific dialectic (UDT vs CDT).
      *Case A Nuance:* In Case A, the Updateful agent knows the simulation *already happened*. The deposit is fixed. Paying now is burning money. The Updateless agent treats the current decision as logically linked to the past simulation.
      *Case B Nuance:* The "Two Centres" problem highlights self-locating uncertainty. Updateless treats the policy as global. Updateful treats the instance as local.
      *Case C Nuance:* This tests dynamic consistency. If Updateful says "Don't pay to forget," but would have preferred to pre-commit to forgetting, is that a failure?

      *Refining the "Agreed Claims":* Avoid "We agree to talk." Use "We agree that a theory must account for X."
      *Refining the Table:* Ensure the "Prediction" column reflects what they think the argument *will show*, not just their position.

      *Final Review against constraints:*
      *   No adjudication? Yes.
      *   No citations? Yes.
      *   Fixed stipulations respected? Yes.
      *   All 3 Cases used? Yes.
      *   All 4 Sections present? Yes.
      *   Verbal dispute note included? Yes.

      *Let's write.*
answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Decision Procedures for Replicable Artificial Agents
  **Parties:** Proponent of Updateless Decision Theory (UDT) | Proponent of Updateful (Causal) Decision Theory (CDT)
  **Date:** [Current Date]

  ## 1. AGREED CLAIMS

  We, the undersigned, acknowledge the following claims as the fixed ground for our collaboration. We treat these not as trivialities, but as substantive constraints on what counts as a viable decision theory for artificial systems.

  1.  **On the Definition of a Solution:** A decision theory does not solve a problem merely by ranking outcomes. It must specify a concrete output (an action or a policy) for the agent *in the scenario*. A theory that recommends an action leading to a worse outcome, without explaining why the agent could not have secured the better outcome, has failed to describe a viable agent architecture.
  2.  **On Money Pumps and "Why Aren't You Rich":** We agree that susceptibility to a money pump demonstrates a failure of *dynamic consistency* or *implementation*, but not necessarily a failure of the underlying normative standard. Similarly, "Why aren't you rich?" arguments are valid only relative to a specified distribution of environments. A theory is not refuted by losing in a hostile environment designed to punish its specific heuristics, provided it identifies that environment correctly.
  3.  **On Pre-commitment:** The statement "You should have bound yourself in advance" is ambiguous. It is a criticism of a decision theory only if the theory prevents the agent from making that binding when the opportunity was available. If the theory recommends binding but the agent lacked the causal opportunity to do so, the criticism targets the agent's history, not the theory.
  4.  **On the Cases:** We accept the factual stipulations of Cases A, B, and C as described in the preamble. Specifically, we agree that in Case A, the deposit is causally fixed before the current decision; in Case B, there is no causal channel between instantiations; and in Case C, the cost of forgetting is fixed and known.
  5.  **On Rationality:** We use the word "rational" descriptively to mean "conforming to the prescriptions of the respective decision theory." We do not use it to imply moral worth or ultimate correctness until the conclusion of this collaboration.
  6.  **On the Trustee:** We agree the trustee is a single decision procedure. Disagreements about whether copies "are" the agent or are merely correlated events are matters for the Disagreements Table, not factual disputes about the setup.

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the cruxes where our positions diverge. Where one side believes the other's formulation is incoherent, this is noted in the "Commitment" column.

  | Crux | Updateless Commitment (UDT) | Updateful Commitment (CDT) | Shared Case / Argument | Predictions: What this will show |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Object of Evaluation** | The primary object of evaluation is the **policy** (the mapping from all possible inputs to outputs), chosen from an *ex ante* standpoint before specific evidence is observed. | The primary object of evaluation is the **act** chosen at the moment of decision, conditional on all currently available evidence. | **Case A (Odd Digit):** The deposit is fixed. UDT evaluates the policy "Pay if asked"; CDT evaluates the act "Pay now." | **UDT:** Will show CDT leaves money on the table by ignoring logical correlations.<br>**CDT:** Will show UDT conflates *predicting* the past with *changing* it. |
  | **2. Control & Correlation** | An agent controls the logical output of its source code wherever it is instantiated, including in past simulations or identical copies. Correlation via common source code is a channel of control. | An agent controls only its local physical act. Outputs of other computations are events correlated with the act, but not *caused* by the current act. | **Case B (Two Centres):** Two instantiations must coordinate without communication. | **UDT:** Will show CDT cannot solve coordination without external pre-commitment devices.<br>**CDT:** Will show UDT relies on "magical" causation where none exists. |
  | **3. Indexical Evidence** | Self-locating information (e.g., "I am the instantiation in Reading") is generally irrelevant to the optimal policy if the policy is global. Conditioning on it fragments the agent's optimization. | Self-locating information is admissible evidence. An instantiation should condition on its specific location and time to maximize local expected utility. | **Case B (Variation):** Prize paid per instantiation vs. common pot. | **UDT:** Value aggregation is determined by the designer's goal, not the instantiation's perspective.<br>**CDT:** If the pot is local, the instantiation's goal changes; this is a question of *what the trustee is for*, not decision theory. |
  | **4. Counterfactual Needs** | Requires **logical counterfactuals** (e.g., "If I decided to Pay, would the simulation have Paid?"). This is a theoretical cost but necessary for optimality. | Requires **causal counterfactuals** (e.g., "If I press, does the other press?"). Logical counterfactuals are ill-defined and unnecessary. | **Case A (Odd Digit):** The bit B is a mathematical fact. | **UDT:** Will show causal counterfactuals are insufficient for logical uncertainty.<br>**CDT:** Will show logical counterfactuals lack a rigorous formalism compared to causal graphs. |
  | **5. Self-Modification** | A rational agent should never wish to modify itself to use a different decision theory. Dynamic consistency is a virtue. (See **Case C**). | An agent may rationally wish to modify itself to constrain its future choices (e.g., Ulysses contracts). However, paying to *forget* evidence (Case C) is generally irrational as information has non-negative value. | **Case C (Retrofit):** Paying £100 to delete evidence of being asked. | **UDT:** Will show CDT agents are dynamically inconsistent and would pay to become UDT.<br>**CDT:** Will show UDT agents are rigid; CDT agents correctly value information and won't pay to forget. *Note: CDT must distinguish itself from Evidential Decision Theory here, as EDT might pay to forget.* |
  | **6. The Ex Ante Standpoint** | The *ex ante* standpoint is the design phase or the start of the episode. For trained systems, it is the point where the loss function was defined. | There is no privileged *ex ante* standpoint. Every decision is made from the *current* standpoint. If the agent was trained to be Updateless, it is simply following a heuristic, not a normative truth. | **General:** Systems with no identifiable first moment (continuous training). | **UDT:** Will show that without an ex ante anchor, agents are vulnerable to exploitation.<br>**CDT:** Will show that "ex ante" is a fiction for embedded agents who cannot step outside their timeline. |
  | **7. Fair Statement Check** | *UDT Note:* We accept the CDT description above, provided they admit that "causal control" excludes logical correlation. | *CDT Note:* We cannot accept the UDT claim that we "control" past simulations. We view this as a category error. We record this objection here. | **N/A** | **Both:** This semantic gap may prove to be the core substantive dispute. |

  ## 3. WHAT WOULD MOVE US

  We commit to updating our views should the following evidence or arguments arise:

  **For the Updateless Proponent:**
  *   **Formal Incoherence:** A rigorous demonstration that logical counterfactuals cannot be defined without circularity or paradox in general environments (beyond simple toy problems).
  *   **Instrumental Convergence:** A proof that in realistic, noisy environments (where source code is not perfectly known or copies are approximate), Updateless policies converge to Updateful ones, making the added complexity unjustified.
  *   **The "Tyranny of the Past":** A scenario where adhering to an *ex ante* optimal policy forces the agent to accept catastrophic losses in the *ex post* reality with no compensating gain, violating basic safety constraints.

  **For the Updateful Proponent:**
  *   **Unavoidable Money Pumps:** A demonstration of a scenario where a CDT agent cannot pre-commit (due to lack of opportunity or trust) and is thereby pumped, whereas an Updateless agent succeeds without external tools.
  *   **Coordination Failure:** A proof that CDT agents in distributed systems (like Case B) systematically fail to capture value available to Updateless agents, even when communication is impossible but source code is known.
  *   **Logical Correlation Utility:** A formal model showing that treating logical correlations as causal inputs yields better predictive accuracy for system behavior without introducing metaphysical contradictions.

  **Shared Criteria for Settlement:**
  *   **Formal Equivalence:** A proof that under specific, realistic constraints (e.g., bounded compute, noisy channels), the two theories prescribe identical actions.
  *   **Tournament Results:** An empirical tournament where agents designed according to each theory compete in a suite of environments including Cases A, B, and C. We agree that if one theory consistently secures higher endowment value across the suite, the other side must concede practical superiority, even if normative disagreement remains.
  *   **Theory of Logical Counterfactuals:** The completion of a rigorous mathematical framework for logical counterfactuals that satisfies the CDT proponent's standards for coherence.

  ## 4. NOTE ON VERBAL DISPUTES

  We acknowledge that a portion of our disagreement may be verbal rather than substantive. Specifically:

  1.  **The Meaning of "Control":** If UDT means "acausal influence via logical correlation" and CDT means "physical causation," we may be agreeing on the physics while disagreeing on the label. However, if this label difference leads to different action prescriptions (as in Case A), the dispute is substantive.
  2.  **The Definition of "Agent":** If UDT defines the "agent" as the abstract algorithm and CDT defines the "agent" as the physical instantiation, then Case B (Two Centres) becomes a dispute about identity rather than decision theory. We agree to treat this as substantive for the purpose of system design: the question is whether the *system* should be programmed to act as one or the other.
  3.  **Normative vs. Descriptive:** We must ensure we do not talk past one another by confusing "what an ideal reasoner would do" with "what a trained neural net will do." We agree to keep the distinction clear in all subsequent correspondence.

  ***

  **Signed:**

  _________________________
  (Updateless Proponent)

  _________________________
  (Updateful Proponent)

  _________________________
  (Journalist/Observer)
