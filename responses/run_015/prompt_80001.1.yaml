answer: |-
  Here is an audit of the "window" metaphor, structured to isolate where the analogy holds, where it breaks, and what those breaks imply for your colleague's claim of neutrality.

  ### 1. The Correspondence Table

  To audit the metaphor, we must first formalize the mapping your colleague is relying on.

  | **Window Metaphor** | **Archival Reality** | **Function in the Argument** |
  | :--- | :--- | :--- |
  | **The Window** | The Archive (the collection of records) | The mechanism of access. |
  | **The Glass** | The Documents (deeds, rolls, dockets) | The medium through which the past is viewed. |
  | **The Frame** | Archival Structure (classification, retention policies) | The boundaries of what is visible. |
  | **The Light** | The Researcher's Methodology | The agency required to make the view visible. |
  | **The View** | The Historical Narrative | The resulting image constructed by the researcher. |
  | **The Thing Outside** | The Past (the community as it lived) | The objective reality independent of the observer. |

  **The Colleague's Claim:** The *Glass* is transparent. Any distortion in the *View* is caused by the angle of the *Light* (your interpretation), not by the *Glass* itself. Therefore, the *Window* affords neutral access to the *Thing Outside*.

  ---

  ### 2. The Disanalogies: Where the Mapping Fails

  The metaphor fails in two specific places corresponding to the features of your material you identified. One is a surface mismatch; the other is a structural collapse.

  #### Feature 1: People as Objects of Administration
  *   **The Metaphor:** In a window scenario, the "Thing Outside" (the community) exists independently of the "Glass." Whether the window is open or closed, the people outside are living their lives. The glass merely transmits their image.
  *   **The Reality:** In your administrative records, the "Thing Outside" often *does not exist* in the archive unless it interacts with the state. A person appears in a tax ledger *only* because they were taxable; in a court docket *only* because they were litigants or defendants. They are not captured; they are **constituted** by the record.
  *   **The Disanalogy:** A window transmits an independent reality; an administrative archive **generates a dependent reality**. The record does not reflect the person; it reflects the *interaction* between the person and the bureaucracy.

  #### Feature 2: Systematic Gaps vs. Random Smudges
  *   **The Metaphor:** Distortion in a window (smudges, cracks, thickness) is physical, accidental, or random. If you clean the glass or move your head, the distortion changes or disappears.
  *   **The Reality:** The gaps in your records are not accidental smudges; they are **design features**. If women's labor is missing from tax ledgers, it is not because the ink smudged; it is because the legal definition of "taxable labor" excluded women. The "Glass" is textured by design to filter out specific categories of life.
  *   **The Disanalogy:** Window distortion is **optical/accidental**; Archival silence is **conceptual/structural**.

  ---

  ### 3. Evaluation: Do These Disanalogies Threaten "Neutral Access"?

  Your colleague's conclusion rests on the idea that the source (the Glass) is passive and neutral, placing the burden of bias entirely on the researcher (the Light). We must distinguish between surface mismatches and structural disanalogies to see if this holds.

  **Surface Mismatches (Do not threaten the conclusion):**
  *   *Fragility:* Windows break; records burn. This is a material vulnerability, not an epistemological bias.
  *   *Perspective:* A window offers one angle; a researcher has one perspective. This supports the colleague's view that *interpretation* varies, but it doesn't prove the *source* is biased.

  **Structural Disanalogies (Destroy the conclusion):**
  *   **The Constitution of Evidence (Feature 1):** If the "Thing Outside" is only visible when it conforms to the "Glass," the archive cannot be a neutral window. It is an active participant in creating the history it claims to record. If the archive only records property owners, it does not offer neutral access to the community; it offers neutral access to **property ownership**.
  *   **The Architecture of Silence (Feature 2):** If the gaps are patterned by the recorder's interests, the distortion is inherent to the source, not the researcher. A researcher cannot "interpret" their way around a category that was never recorded.

  **Verdict:** The "neutral access" conclusion **does not hold**. The structural disanalogies prove that the distortion is not residual (a matter of interpretation) but constitutive (a matter of the source). The archive does not offer a view of the community; it offers a view of **how the state saw the community**.

  ---

  ### 4. A Better Analogy: The Cadastral Map

  If the archive is not a window, what is it? Given your material (deeds, tax, census), a superior analogy is **A Cadastral Map**.

  A cadastral map is a register of property used for taxation and administration. It looks like a representation of the land, but it functions differently than a window or even a standard geographic map.

  | **Feature** | **Window Metaphor** | **Cadastral Map Analogy** | **Why It Fits Your Material** |
  | :--- | :--- | :--- | :--- |
  | **Purpose** | Transparency (to see truth) | **Utility** (to manage resources) | Your records were made to tax and judge, not to preserve history. |
  | **Selection** | Everything in the frame | **Only what is taxable/legible** | Explains Feature 2: Gaps are systematic (non-taxable labor is unmapped). |
  | **Subjectivity** | The viewer is neutral | **The Surveyor is sovereign** | Explains Feature 1: People appear as plots/objects, not inhabitants. |
  | **Distortion** | Accidental (smudges) | **Projective** (flattening 3D life to 2D lines) | The reduction of complex lives to names on a roll is a projection, not a reflection. |
  | **Silence** | Absence of light | **Absence of Category** | Things not on the map (common land, informal kinship) are treated as non-existent for administrative purposes. |

  **Why this works better for your argument:**
  1.  **It acknowledges utility without claiming truth:** A map is useful for navigating tax law (your colleague's point), but no one mistakes a map for the territory (your point).
  2.  **It centers power:** A map is drawn by the authority to control the space. Similarly, your records are drawn by the administration to control the population.
  3.  **It explains the silence:** On a map, a blank space isn't necessarily empty land; it might be land the surveyor wasn't authorized to measure. Similarly, a missing name in your census isn't necessarily a missing person; it's a person the state had no category for.

  **Recommendation for your Colleague:**
  You might concede that the archive is a *reliable* map of the administration's intentions, but insist that a map of the state's interests is not a window onto the community's life. The distortion is not in your interpretation (the light); it is in the projection (the glass). To reconstruct the community, you cannot just look through the glass; you must calculate the distortion of the map itself.
