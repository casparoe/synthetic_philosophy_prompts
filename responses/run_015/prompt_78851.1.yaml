prompt: |-
  I'm TAing a fifty-minute section next week for second-years on iterated elimination of dominated strategies, and the new bit is strategies that get knocked out by a *mix* of other strategies rather than by any single pure one. Don't explain the material to me — plan how I should teach it. What order do the pieces have to go in, given that they've only done pure-strategy dominance and pure Nash so far, and they've met mixed strategies only as the thing a player does in equilibrium? What's the one example that carries the whole thing — I want it small, with no pure strategy dominating anything, and with the iterating actually doing work past the first round — and what should that example conspicuously not have? Which misconceptions will they walk in with or form (I'm guessing "the mix that dominates is the mix you'd play in equilibrium", "you can eliminate in any order", and "whatever survives is a Nash strategy") and at which point in the sequence do I head each one off? One I'm unsure about: order-independence holds for strict dominance but breaks once weak dominance is on the table — how do I say the true thing without opening that whole can of worms at this level? There's also a fact I like, that the average of two undominated strategies can itself be strictly dominated even when neither of them is; tell me wheather that earns a place in fifty minutes, and where. Then finish with one question to ask at the close that shows whether they've actually got it, and what I should flatly refuse to get into.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for a 50-minute section.
      *   **Audience:** Second-year undergraduates (likely Econ or Game Theory intro).
      *   **Prior Knowledge:** Pure-strategy dominance (IEDS), Pure Nash, Mixed strategies (only as equilibrium concepts, *not* yet as tools for dominance).
      *   **New Material:** Mixed-strategy dominance (strategies dominated by a mixture of others) within IEDS.
      *   **Constraints:** Do *not* explain the material to me (the user knows it). Plan *how* to teach it.
      *   **Specific Requirements:**
          *   Order of operations.
          *   One specific example (small, no pure dominance initially, requires iteration, specific exclusion).
          *   Address misconceptions (Mix = Equilibrium mix, Order independence, Survival = Nash).
          *   Handle the Strict vs. Weak dominance order-independence issue carefully.
          *   Decide on including the "average of undominated can be dominated" fact.
          *   Closing question (assessment).
          *   Topic to avoid (boundary setting).

  2.  **Determine the Pedagogical Flow (The "Order"):**
      *   *Start:* Connect to prior knowledge. They know IEDS with pure strategies. They know Mixed NE. Bridge the gap: "We've been checking if Row A beats Row B. What if Row A doesn't beat Row B, but 'Half A + Half C' beats Row B?"
      *   *Middle:* The Core Example. This needs to be the vehicle for the whole concept.
      *   *Nuance:* Address the "Mix = Equilibrium" misconception early, because students conflate "best response" with "dominance."
      *   *Nuance:* Address Order Independence. This is tricky. Stick to *Strict* dominance for the main result to preserve order independence without getting bogged down in weak dominance edge cases.
      *   *Nuance:* The "Average of Undominated" fact. Is it worth 5 minutes? It illustrates *why* we need to check mixes, but might clutter. Decision: Include it as a motivational intuition *before* the example, or as a side note. Better: Use it to motivate *why* the example works.
      *   *End:* Assessment question.

  3.  **Designing the "One Example":**
      *   *Requirements:* 2-player (keep it simple), no pure dominance initially, requires iteration (at least 2 rounds), mixed dominance must be the key.
      *   *Constraint:* "What should that example conspicuously not have?" It should not have a Pure Strategy Nash Equilibrium (PSNE) initially, or at least not one that is obvious/survives everything, to force them to rely on the elimination logic. Actually, better: It should not have *any* pure dominance to start.
      *   *Candidate:* A 3x3 game is usually needed for mixed dominance to matter (in 2x2, if no pure dominance, mixed dominance rarely adds new eliminations unless specific payoffs). Let's aim for a 3x3 where one row is dominated by a mix of the other two.
      *   *Refinement:* To ensure iteration works, eliminating a column via mixed row dominance should then make a *different* row dominated (perhaps by pure or another mix).
      *   *The "Conspicuous Absence":* It should not have a *Pure Strategy Nash Equilibrium* in the original matrix. Why? Because if there's a PSNE, students might just circle that and ignore the IEDS process. We want them to trust the process. Or, more precisely, it should not have *dominance solvability to a single cell* immediately.
      *   *Wait, standard example:* The classic is a 3x3 where the middle row is dominated by 50/50 of Top and Bottom.
      *   *Let's build a specific one:*
          *   Row: T, M, B. Col: L, C, R.
          *   Need M dominated by 0.5T + 0.5B.
          *   Need no pure dominance (T doesn't beat M, B doesn't beat M).
          *   Need iteration: Once M is gone, maybe R is dominated. Once R is gone, maybe B is dominated.
      *   *Conspicuous Absence:* It should not have a *saddle point* (PSNE) at the start. If it does, they might think "Oh, I just find NE." We want to show IEDS reduces the set *to* the NE (or subset). Actually, the prompt asks what it should *not* have. It should not have **Pure Strategy Dominance** at the start. That's the definition. But deeper: It should not have a **Unique Pure NE** that is obvious without the mixed step.
      *   *Decision:* The example should not have **any Pure Strategy Dominance** in the first round. That is the premise. But to make iteration work, the *second* round should yield pure dominance.
      *   *Wait, one more constraint:* "What should that example conspicuously not have?" -> It should not have a **Mixed Strategy Nash Equilibrium calculation** required. We are doing IEDS, not solving for NE probabilities. Don't make them solve $pU + (1-p)D = ...$. Just check if a specific mix (like 50/50) works.

  4.  **Addressing Misconceptions:**
      *   *Misconception 1: "The mix that dominates is the mix you'd play in equilibrium."*
          *   *Fix:* Emphasize dominance is about *safety/rationality*, not optimization against a specific opponent strategy. The dominating mix is a tool for elimination, not a prescription for play. Address this *immediately* when introducing the concept.
      *   *Misconception 2: "You can eliminate in any order."*
          *   *Fix:* Stick to **Strict** Dominance. State clearly: "As long as we only eliminate *strictly* dominated strategies, order doesn't matter. If we touch weak dominance, all bets are off." Keep it brief. Don't prove it, just state the rule of the road.
      *   *Misconception 3: "Whatever survives is a Nash strategy."*
          *   *Fix:* IEDS survivors *contain* NE. They aren't necessarily NE themselves (if the process stops early). But if it solves to a single cell, that's the unique NE. Address this at the *end* when discussing the result of the example.

  5.  **The "Average of Undominated" Fact:**
      *   *Value:* It explains *why* pure dominance isn't enough.
      *   *Cost:* Takes time.
      *   *Verdict:* Include it. It's the "Aha!" moment. Put it right at the start as a intuition pump before the matrix. "Imagine two strategies are good in different states. Averaging them smooths the risk."
      *   *Timing:* First 5 minutes.

  6.  **The Closing Question:**
      *   Needs to test if they understand that *mixed* dominance allows elimination where *pure* does not.
      *   Scenario: Give a tiny 2x2 or 3x2 snippet. Ask: "Can M be eliminated?"
      *   Better: A conceptual check. "If a strategy survives IEDS allowing for mixed dominance, is it a Best Response to *some* belief?" (Yes, by rationalizability logic). Too hard?
      *   Simpler: "I have a strategy that isn't beaten by T and isn't beaten by B. Can I throw it away?" Answer: "Only if a mix of T and B beats it."

  7.  **What to Refuse to Get Into:**
      *   **Calculating the exact equilibrium mixing probabilities.** This is a section on *elimination*, not *solving for NE*. If students start setting up indifference equations, stop them. We only need to *find* a dominating mix, not the *optimal* mix.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Time:* 50 mins.
      *   *0-5:* Hook (Average of undominated fact).
      *   *5-10:* Definition (Mixed Dominance). Address Misconception 1 (Mix != Equilibrium).
      *   *10-35:* The Example. Walk through Round 1 (Mixed), Round 2 (Pure/Iterated). Address Misconception 2 (Order/Strictness) here.
      *   *35-45:* Implications. Address Misconception 3 (Survival vs NE).
      *   *45-50:* Closing Question & Boundary Setting.

      *   *Refining the Example:*
          *   Player 1: T, M, B. Player 2: L, R. (Keep P2 small to make checking easy).
          *   Actually, need P2 to have a strategy eliminated in Round 2. So P2 needs 3 strategies.
          *   Let's go 3x3.
          *   P1: T, M, B. P2: L, C, R.
          *   Payoffs for P1:
              *   L: T=0, M=1, B=0 (M looks good here)
              *   C: T=4, M=1, B=4 (M looks bad here)
              *   R: T=0, M=1, B=0 (M looks good here)
              *   Wait, if I mix T and B (50/50):
                  *   L: 0.5(0)+0.5(0) = 0. M=1. Mix loses.
              *   Need M to be *dominated*. So M must be lower than the mix.
              *   Try:
                  *   L: T=3, M=1, B=3. (Mix=3 > 1)
                  *   C: T=0, M=2, B=0. (Mix=0 < 2). Oops.
              *   Need Mix > M everywhere.
              *   L: T=4, M=2, B=0. (Mix 50/50 = 2). Tie. Need strict. T=5, B=0 -> 2.5 > 2.
              *   C: T=0, M=2, B=5. (Mix 2.5 > 2).
              *   R: T=3, M=2, B=3. (Mix 3 > 2).
              *   So M is dominated by 0.5T + 0.5B.
              *   Check Pure Dominance: T vs M? T loses in C (0 vs 2). B vs M? B loses in L (0 vs 2). So no pure dominance.
              *   Now Iteration: Remove M.
              *   New Matrix (T, B) x (L, C, R).
              *   Need a column to be dominated now.
              *   P2 Payoffs need to be set so that, say, C is dominated once M is gone.
              *   If M is gone, P2 compares L, C, R against T and B.
              *   Let's make C dominated by L (or R) *after* M is gone.
              *   Against T: L=1, C=0, R=1.
              *   Against B: L=1, C=0, R=1.
              *   Then C is strictly dominated by L (or R) in the reduced game.
              *   Remove C.
              *   Now (T, B) x (L, R).
              *   Need one more elimination to show iteration "doing work".
              *   Maybe B becomes dominated by T now?
              *   Against L: T=5, B=0. Against R: T=3, B=3. T dominates B.
              *   Remove B.
              *   Result: (T, L).
          *   This works. 3 Rounds. Mixed -> Pure -> Pure.

      *   *Refining the "Order Independence" warning:*
          *   Don't prove it. Just say: "We are doing **Strict** Dominance. For Strict, order doesn't matter. If you see 'weak' (ties), stop and ask me. We aren't touching weak dominance today." This closes the can without opening it.

      *   *Refining the "Average" Fact:*
          *   Yes, put it first. It motivates *why* we are here. "Why look at mixes? Because sometimes 2 bad strategies make a good one."

      *   *Refining the Closing Question:*
          *   "True or False: If a strategy cannot be beaten by any *pure* strategy, it is rational to play it."
          *   Answer: False. (Because a *mix* might beat it).

      *   *Refining the "Refusal":*
          *   "How do I find the *best* mixing probability?" -> "We don't care. We only care if *some* mix works."

  9.  **Final Review against constraints:**
      *   50 mins? Yes, tight but doable.
      *   Order of pieces? Hook -> Def -> Example -> Nuance -> Close.
      *   One Example? Yes, the 3x3 constructed above.
      *   Conspicuous absence? No initial pure dominance.
      *   Misconceptions addressed? Yes (Mix=NE, Order, Survival=NE).
      *   Strict/Weak issue? Handled by restricting scope to Strict.
      *   Average fact? Included as hook.
      *   Closing question? Included.
      *   Refusal? Included.

  10. **Writing the response:** (Adopt the TA-to-TA tone. Direct, practical, pedagogical.)
answer: |-
  Here is the battle plan for your 50 minutes.

  ### 1. The Sequence (Time Allocation)
  1.  **The Hook (5 mins):** The "Average of Undominated" fact.
  2.  **The Definition (5 mins):** Formalize mixed dominance, immediately kill the "Equilibrium Mix" misconception.
  3.  **The Core Example (25 mins):** Walk through the 3-round elimination.
  4.  **The Implications (10 mins):** Rationalizability vs. Nash, and the Strict/Weak boundary.
  5.  **The Close (5 mins):** Assessment question and boundary setting.

  ### 2. The Hook: The "Average" Fact
  **Do include this.** It is the only intuitive justification for why we are doing this.
  *   **Where:** Minute 0–5.
  *   **How:** Draw two payoff vectors on the board for Player 1 against Player 2's strategies.
      *   Strategy A: $(10, 0)$
      *   Strategy B: $(0, 10)$
      *   Strategy C: $(4, 4)$
  *   **Say:** "A is not dominated by B. B is not dominated by A. C is not dominated by A or B. Pure IEDS says all three survive. But if I play 50% A and 50% B, my expected payoff is $(5, 5)$. That strictly beats C. C is irrational, even though no *pure* strategy beats it."
  *   **Why:** This creates the intellectual need for the lesson before you write down a definition.

  ### 3. The Core Example
  You need a $3 \times 3$ game. It must be small enough to calculate in real-time but complex enough to require iteration.
  **What it must have:**
  *   Round 1: A row dominated *only* by a mix of the other two rows.
  *   Round 2: A column dominated (purely) only after that row is gone.
  *   Round 3: A row dominated (purely) only after that column is gone.
  *   **Result:** Solves to a single cell.

  **What it conspicuously must NOT have:**
  *   **Any initial Pure Strategy Dominance.** If they can knock out a row using a pure row in Round 1, they will revert to old habits and ignore the mixed step. The first elimination *must* require the mix.

  **The Matrix (Player 1 Rows, Player 2 Cols):**
  *Payoffs are (P1, P2)*

  | | L | C | R |
  | :--- | :---: | :---: | :---: |
  | **T** | 5, 1 | 0, 0 | 3, 1 |
  | **M** | 2, 2 | 2, 2 | 2, 2 |
  | **B** | 0, 1 | 5, 0 | 3, 1 |

  **The Walkthrough:**
  1.  **Check Pure Dominance (P1):** T doesn't beat M (loses at C). B doesn't beat M (loses at L). M doesn't beat anyone. *Stuck?*
  2.  **Apply Mixed Dominance (P1):** Check $0.5T + 0.5B$.
      *   Vs L: $0.5(5) + 0.5(0) = 2.5 > 2$.
      *   Vs C: $0.5(0) + 0.5(5) = 2.5 > 2$.
      *   Vs R: $0.5(3) + 0.5(3) = 3 > 2$.
      *   **Eliminate M.**
  3.  **Iterate (P2):** Now P2 faces only T and B. Compare L, C, R.
      *   C gives 0 against T, 0 against B.
      *   L gives 1 against T, 1 against B.
      *   **Eliminate C** (Strictly dominated by L).
  4.  **Iterate (P1):** Now P1 faces L and R. Compare T and B.
      *   Vs L: T=5, B=0.
      *   Vs R: T=3, B=3.
      *   **Eliminate B** (Strictly dominated by T).
  5.  **Result:** (T, L).

  ### 4. Handling Misconceptions

  **Misconception 1: "The mix that dominates is the mix you'd play in equilibrium."**
  *   **When to head it off:** Minute 10, immediately after defining mixed dominance.
  *   **The Fix:** "The mix $0.5T + 0.5B$ is a *weapon* to eliminate M. It is not a *plan* to play. Player 1 will eventually play T. We use the mix to prove M is stupid, not to suggest Player 1 should flip a coin."

  **Misconception 2: "You can eliminate in any order."**
  *   **When to head it off:** Minute 35, during the Implications section.
  *   **The Fix:** Be dogmatic but brief. "Order independence holds for **Strict** Dominance. We are doing Strict Dominance today. If you encounter a tie (Weak Dominance), stop. Order matters there, and we are not touching weak dominance in this section. As long as it's strict, chop in any order."
  *   **Why:** This tells the truth without inviting them to test the boundary. You define the scope of the course section as "Strict Only."

  **Misconception 3: "Whatever survives is a Nash strategy."**
  *   **When to head it off:** Minute 40.
  *   **The Fix:** "Survivors are *Rationalizable*. Nash Equilibria are a subset of survivors. If we solve to a single cell (like we just did), it is the Unique Nash. If we stop with a $2 \times 2$ block, those are candidates, not guarantees."

  ### 5. The Closing Question
  Ask this verbally at minute 48. Do not let them calculate.

  **Question:** "I have a strategy $S$. I check it against every pure strategy the opponent has, and $S$ is a Best Response to all of them. Can I eliminate $S$ using Iterated Dominance?"

  **Correct Answer:** "No." (If it's a BR to all pure strategies, it's a BR to any mix of them, so it can't be dominated).
  **Wait, that's too hard.** Let's try the inverse, which tests the specific lesson:

  **Revised Question:** "I have a strategy $S$. No *pure* strategy dominates it. A *mixed* strategy dominates it. I eliminate $S$. In the *next* round, can a strategy that was previously undominated become dominated by a *pure* strategy?"

  **Correct Answer:** "Yes." (This tests the iteration concept + the mixed entry point).
  **Actually, keep it simpler.**

  **Final Choice:** "True or False: If a strategy survives Iterated Elimination of *Pure* Dominated Strategies, it is rational to play it."
  **Answer:** "False. It might be dominated by a mix."

  ### 6. What to Flatly Refuse
  **Topic:** **"How do I find the *optimal* mixing probabilities?"**
  Students will try to solve for $p$ that maximizes utility or makes the opponent indifferent.
  **Your Line:** "We are not solving for Equilibrium probabilities. We are checking for *existence* of a dominating mix. If $50/50$ works, we stop. We don't need the best mix, just *a* mix that beats the strategy in question. Do not set up indifference equations."

  ### Summary Checklist for the Board
  1.  **Left Panel:** The "Average Fact" intuition (Vectors).
  2.  **Center Panel:** The $3 \times 3$ Matrix. Cross out M, then C, then B as you talk.
  3.  **Right Panel:** "Rules of the Road":
      *   Strict Dominance Only (Order doesn't matter).
      *   Mix = Tool, not Prescription.
      *   Survivors $\supseteq$ Nash.
