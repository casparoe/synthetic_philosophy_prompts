answer: |-
  **Question 1**
  Let's start with the risk aspect of your view. Because you apply the concave transform to *realised* welfare rather than expected welfare, your view is risk-averse at the social level. Imagine a choice between two policies for two people. Policy A gives both people a welfare level of 40 for sure. Policy B is a coin flip: heads, person one gets 100 and person two gets 0; tails, it's the reverse. The expected total welfare in Policy B is 100, which is higher than Policy A's total of 80. But your view might still prefer Policy A. Can you walk us through why sacrificing that expected total welfare is the right call here?

  *   **Expected Answer:** She will argue that social risk aversion is rational because the moral value of welfare diminishes. She'll say avoiding the possibility of someone ending up at 0 is more important than maximizing the aggregate sum.
  *   **Follow-up:** That makes sense internally, but it means you're willing to accept a lower expected sum of welfare to avoid inequality in outcomes. If we moved the transform to apply to expected welfare instead, we wouldn't sacrifice that total. What makes the *ex-post* version—the one that sacrifices expected total welfare—the correct one, rather than just a way to build equality into the view under the guise of risk aversion?

  **Question 2**
  You've mentioned that the concavity of the function isn't a stipulation about weights, but rather reflects the diminishing moral value of a benefit as a recipient's level rises. You suggest this is obvious from the single-person case. Does this diminishing value apply within a single life over time? If I have a bad decade and a good decade, does a benefit during the bad decade have more moral value than the same benefit during the good decade, even if my total lifetime welfare ends up lower because of it?

  *   **Expected Answer:** She will likely resist this. She'll say prioritarianism is about comparing *different* people, not time-slices within one person. She'll argue the unit of concern is the whole life, not moments.
  *   **Follow-up:** If the unit is the whole life, what makes the boundary of a person the special place where this priority switches on? Why does the moral value of a benefit diminish when compared across two people, but not when compared across two decades of the same person? Is there something morally significant about skin boundaries that changes how benefits count?

  **Question 3**
  Following on from that: if the whole life is the unit, do benefits I've already received count when working out how much priority I get now? If I was very well off for the first half of my life but am struggling now, do I still count as "well off" for priority purposes, or does the clock reset?

  *   **Expected Answer:** She will likely say that current welfare matters most, or perhaps lifetime cumulative welfare matters. If she says current welfare, she risks ignoring past advantage. If she says lifetime, she risks the "past benefits" problem. Let's assume she says lifetime welfare determines priority.
  *   **Follow-up:** If it's lifetime welfare, then someone who was lucky in the past gets lower priority now, even if they are currently suffering just as much as someone who was always unlucky. Does that seem fair? It sounds like you're punishing them for past good fortune rather than prioritizing based on current need.

  **Question 4**
  I want to ask about the tail of your function. As welfare levels rise, does the marginal moral weight of a benefit ever go to zero? If I'm a billionaire and I lose a trivial amount, say the cost of a coffee, versus a badly off child gaining something genuinely trivial, does your view say the child's gain always outweighs the billionaire's loss, no matter how small the child's gain is?

  *   **Expected Answer:** She will likely say the weight approaches zero but never hits it, maintaining a continuous trade-off. She'll deny it's lexical priority.
  *   **Follow-up:** But if the weight gets small enough, isn't that lexical priority in a trenchcoat? If no finite gain to the well-off outweighs an arbitrarily tiny gain to the worst off, practically speaking, doesn't that function just like a strict priority rule where the worst off always win? Where is the line where trade-offs actually happen?

  **Question 5**
  Your view is additive and separable, which means the gap between people never enters the axiology directly—only their levels do. Yet the concavity hands you an inequality-favouring result for free. When people have intuitions about leveling down, what do you think they are actually responding to? Is it a confusion, or is it something real that your axiology just doesn't have a slot for?

  *   **Expected Answer:** She will likely say it's something real but separate. She'll argue people are responding to relational equality or status, not the distribution of welfare itself.
  *   **Follow-up:** If it's something real but separate, does that mean you could have a society with perfect relational equality—everyone treats each other as peers—but massive welfare gaps, and you'd say nothing is wrong with the distribution itself? Is relational equality enough to satisfy the intuition without changing the welfare numbers?

  **Question 6**
  You mentioned relational equality as a separate principle. But if prioritarianism doesn't value equality directly, why does it produce results that look so much like equality? Is the attraction of your view just that it gets you egalitarian conclusions without having to defend the value of equality itself?

  *   **Expected Answer:** She will likely deny this is the *attraction*. She'll say the attraction is getting the right answer about priority without the leveling-down objection. She'll insist the similarity is coincidental or derivative.
  *   **Follow-up:** If the similarity is derivative, then whenever your view diverges from equality—say, when giving to the middle class produces more moral value than giving to the worst off due to efficiency losses—you'd be okay with that? Is there any case where equality says "distribute evenly" and you say "no, prioritize this group even if it increases the gap"?

  **Question 7**
  Let's look at cases where the number of people isn't fixed, or when the people in one option aren't the same people as in the other. Who are the "worse off" supposed to be then? Does priority have anything to say when there's nobody who gets made worse off because the people themselves are different?

  *   **Expected Answer:** She will likely admit this is a challenge. She might say we compare possible people's welfare levels, or that the view needs modification for variable populations.
  *   **Follow-up:** If the view needs modification there, does it collapse into total utilitarianism in those cases? If you just sum up welfare when identities change, but prioritize when identities stay fixed, do you have two different views stitched together rather than one unified theory?

  **Question 8**
  I want to return to your first defensive move: that your view can't require leveling down because it's a sum of independently weighted welfares. But in our first example about risk, you preferred a policy with a lower expected total welfare to avoid a chance of someone being badly off. Isn't that just the leveling-down worry relocated into expectation rather than outcome?

  *   **Expected Answer:** She will insist it's not leveling down because Pareto is satisfied in every state of the world. She'll distinguish between ex-ante Pareto and ex-post Pareto.
  *   **Follow-up:** I understand the technical distinction, but practically speaking, you're accepting less overall good to avoid inequality. If a utilitarian says "I'd take the higher expected total," and you say "No, I'd take the safer distribution," aren't you effectively saying equality of outcome is worth paying for, even if you don't call it equality?

  **Question 9**
  You've argued that worries about relational equality are a different principle. But if people's intuition about leveling down is driven by a belief that inequality is bad *in itself*, not just instrumentally, does your view leave that moral concern unaddressed? Are you telling people their intuition about inequality is just a mistake?

  *   **Expected Answer:** She will likely say the intuition is partially mistaken but points to something real (relational equality). She'll argue we should satisfy the relational part separately.
  *   **Follow-up:** If we satisfy the relational part separately, does the prioritarian part still do any work? If we fix the relations, do we still need the concave transform, or does that become redundant? What work is the concavity doing if the equality worry is handled elsewhere?

  **Question 10**
  To close, I want to ask about what would count against the view. Not what's the strongest objection you've heard, but what concrete result—from a case or from the formal side—would make you give up prioritarianism of this particular shape? What would have to happen for you to say this function is the wrong way to model priority?

  *   **Expected Answer:** She might say "If it implied we should ignore the worst off entirely," or "If it violated Pareto."
  *   **Follow-up:** Those are built into the definition of the view, though. I mean something external. If a case showed that smoothing out lives *within* a person was bad, or that risk-taking was morally required, would that break the view? I'm looking for a result that would force you to change the shape of the function, not just tweak the parameters.
