      *   *Refining the Test Case:* This is the "Decerebrate Animal" problem. If we grow a human body without a forebrain, is it a person? Is it alive? Current law says BD = dead. So a permanently brainless body is dead. But if it grows... it exposes the fissure.

  8.  **Final Polish:** Check against constraints.
