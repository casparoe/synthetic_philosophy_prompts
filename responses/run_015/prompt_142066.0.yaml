      *   **Brain Death (BD):** Based on the *Whole Brain Death* standard (in the US, mostly) or *Brainstem Death* (UK). The core concept is the loss of *integrative function* of the organism as a whole. The brain is seen as the critical regulator. Without it, the body is a collection of functioning parts, not an organism.
      *   **Vegetative State (PVS):** Brainstem is intact. Breathing, homeostasis, sleep-wake cycles exist. The organism is integrating. Therefore, alive.
      *   **Circulatory Death (DCD):** "Irreversible cessation of circulatory and respiratory functions." Key word: *Irreversible*. In practice, this means "we will not attempt to restart it." It's a normative decision disguised as a physiological fact.
