      *(Self-Correction during drafting)*: I need to be careful not to say "medicine is lying." Rather, medicine is operating with a *functional* definition of death, not a *metaphysical* one. The "life" of a heart in a box is *tissue viability*, not *organismal life*. Distinguish these levels.

      *(Refining the "Underdetermined" section)*: The 5-minute rule in DCD is the clearest example of underdetermination. Biologically, nothing special happens at 5 minutes. It's a moral buffer.

      *(Refining the Test Case)*: If we have a brainless body that heals, under *Whole Brain* criteria, it's dead. Under *Biological* criteria, it's alive. If the practice calls it dead, it proves the practice prioritizes the *brain* over *biology*.

      *(Final thought on the "Commitment" question)*: The practice isn't committed to a definition of *life*; it's committed to a definition of *moral standing*. Death is a moral/legal status, not just a biological event.

