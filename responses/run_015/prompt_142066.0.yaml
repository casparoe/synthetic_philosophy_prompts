answer: |-
  This is one of the sharpest critiques of modern bioethics available. You have identified the fissure between the *ontological* question (what is life?) and the *normative* question (when are we allowed to stop treating or cut this person up?).

  Here is an analysis of the conceptual machinery underpinning these practices, separated into what is necessary, what is comfortable, and what is underdetermined, followed by the test case you requested.

  ### 1. The Presupposed View of Life: "Somatic Integration"
  The official theory that holds this package together is the **Organism-as-a-Whole** standard, codified in the U.S. by the President's Commission in 1981.

  *   **The Theory:** A human being is alive so long as their organism functions as an integrated whole.
  *   **The Mechanism:** The brain (specifically the brainstem) is the critical *integrator*. It synchronizes breathing, circulation, temperature, and hormonal response.
  *   **The Conclusion:** When the brain dies, the body becomes a collection of functioning *parts* (cells, tissues, organs) but ceases to be a functioning *organism*. Therefore, the "person" (the organism) is dead, even if the "parts" remain viable.

  **Does a single notion of 'alive' do the work?**
  No. There are actually three different notions of "life" sliding past each other in the scenarios you described:
  1.  **Organismal Life:** (Used for Brain Death vs. PVS). Requires brain-mediated integration.
  2.  **Tissue Viability:** (Used for the ex-vivo heart). Cells metabolizing and contracting.
  3.  **Moral Irreversibility:** (Used for Circulatory Death). "We will not restart this."

  The practice claims to be tracking #1 exclusively, but it secretly relies on #3 to make the numbers work for organ transplantation.

  ### 2. Necessary vs. Comfortable vs. Underdetermined

  To understand what the practice *is*, we must separate the load-bearing walls from the decoration.

  **A. What the practice strictly couldn't make sense without:**
  *   **The Dead Donor Rule (DDR):** You cannot kill a patient to get their organs. This is the ethical anchor. Every definition of death is engineered to ensure the DDR is not violated.
  *   **Irreversibility:** There must be a threshold where return is impossible (or will not be attempted). Without this, declaring death is malpractice.
  *   **A Binary Switch:** Legally and practically, you cannot be "sort of dead." You are either a rights-bearing person or a corpse. The practice requires a bright line, even if biology offers a gradient.

  **B. What merely fits comfortably:**
  *   **The Brain as Integrator:** This fits our intuition that "we are our brains." It makes Brain Death feel like the death of the *person*. However, as you noted with the pregnant body, the somatic integration often continues (hormonal regulation, wound healing, gestation). The "integration" theory is scientifically shaky but emotionally comfortable.
  *   **Breathing = Life:** Keeping a PVS patient alive because they breathe on their own fits the ancient cardiopulmonary standard. It comforts families who see chest movement.

  **C. What is Underdetermined (The "Fudge Factors"):**
  *   **The 5-Minute Wait (DCD):** In Donation after Circulatory Death, they wait 2–5 minutes after the heart stops. Biologically, nothing magic happens at minute 5. The cells are not dead; the heart *could* often be restarted (auto-resuscitation is rare after 5 mins, but external restart is physically possible). The "irreversibility" here is **normative**, not biological. It means "we have decided we will not try to restart it." The biology does not dictate the 5-minute mark; the need to harvest organs before they degrade does.
  *   **The Pregnant Corpse:** Keeping a brain-dead body "alive" for months exposes that the "dead" label is flexible. If the body were truly just a corpse, feeding it would be like feeding a mannequin. The fact that it responds to nutrition and hormones shows the "organism" is still working. The practice tolerates this contradiction because the *goal* (saving the fetus) overrides the *definition*.

  ### 3. The Rival Account That Would Break the System

  The rival account that would force the biggest change is **Biological Vitalism** (or Strict Cellular Homeostasis).

  *   **The Theory:** An entity is alive if it maintains homeostasis, metabolizes energy, repairs damage, and grows, regardless of brain function.
  *   **The Change:**
      1.  **Brain Dead Patients become Alive:** Since they heal wounds, fight infection, and gestate fetuses, they are biologically alive.
      2.  **Organ Transplant Halts:** You cannot remove a heart from a living person. Heart-beating donation would become euthanasia.
      3.  **PVS Patients remain Alive:** No change here.
      4.  **DCD Patients:** You would have to wait until cellular decomposition begins, rendering most organs useless for transplant.

  **Alternative Rival: Higher-Brain Death (Neocortical Death)**
  *   **The Theory:** Life = Capacity for Consciousness.
  *   **The Change:** PVS patients (no awareness) would be declared dead. We could harvest organs from them. This would *increase* organ supply but radically devalue the protection of unconscious human life.

  The **Biological Vitalism** view is the one that current practice fights hardest against, because it renders the current transplant infrastructure ethically impossible.

  ### 4. The Test Case: The Brainless Body

  **Scenario:** We grow a human body with no brain and no prospect of one. It maintains temperature, heals wounds, grows hair, digests food, and fights infection for years.

  **Under the Reconstructed Theory (Organism-as-a-Whole / Whole Brain Death):**
  *   **Verdict:** It is **Dead**.
  *   **Reasoning:** The definition of death is not "cessation of cellular activity," it is "cessation of brain function." Without a brain, there is no integrator. Without an integrator, there is no organism. There is only a collection of tissues.
  *   **Implication:** You could legally dissect this body for parts. It has no moral standing.

  **Under the Biological Vitalism Theory:**
  *   **Verdict:** It is **Alive**.
  *   **Reasoning:** It exhibits all the markers of a living organism (homeostasis, repair, growth).

  **What this tells us about the commitment to a definition of life:**
  If the medical/legal system declares the Brainless Body **Dead**, it proves that the practice was **never primarily committed to a biological definition of life.**

  It reveals that "Death" in medicine is not a discovery of a biological fact; it is a **moral designation**.
  *   When we call the Brain Dead patient "dead," we are not saying "biology has stopped." We are saying "moral standing has ceased."
  *   When we call the PVS patient "alive," we are not saying "consciousness exists." We are saying "we are not yet ready to treat this body as a resource."
  *   When we call the ex-vivo heart "alive," we are speaking metaphorically about tissue viability to sell the technology, not making a claim about organismal status.

  ### Summary
  The rabbit hole you went down leads to a disturbing but coherent conclusion: **Medicine does not define death; it manages it.**

  The package of practices presupposes a **functionalist** view of life, where "alive" means "possesses the functions that grant moral standing (consciousness or brainstem integration)." It is underdetermined wherever biology conflicts with utility (like the 5-minute wait or the pregnant corpse).

  The practice is not committed to a definition of *life* in the biological sense. It is committed to a definition of *personhood* that allows for the cessation of obligation. The Brainless Body test case proves this: if a thing acts alive but lacks a brain, the system will call it dead. This confirms that the label "dead" is a tool used to regulate our obligations to the body, not a description of the body's metabolic state.
