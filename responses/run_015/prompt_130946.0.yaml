      *   *LTCM Element 3: Mean Reversion.*
          *   *Ex Post:* "Markets can stay irrational longer than you can stay solvent."
          *   *Ex Ante:* Convergence trading is built on the economic logic that prices *must* converge eventually (arbitrage). Betting against mean reversion is betting against market efficiency itself.
      *   *Key Insight:* These weren't "stupid" mistakes; they were rational bets on the continuation of the status quo, which is how most financial models work.

  3.  **Part 2: Narrative Fallacy Analysis (The Story vs. The Mess):**

