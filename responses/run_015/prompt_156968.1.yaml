  You aren't being arrogant, because this is status quo bias, but your friend is right that quick revertability doesn't prevent all damage, meaning you should disable the check temporarily rather than deleting it.

  Chesterton's Fence dictates that you must understand the reason for a rule before removing it, not that you must preserve rules forever if the reason is lost. Since the team is dissolved and documentation is missing, you have reached the limit of reasonable inquiry, which satisfies the principle's requirement to look before you leap. However, your friend's objection to the revertability argument highlights a critical risk: flipping a config flag back stops future bad deploys but does not undo damage caused by the first one, such as data corruption or security leaks that a human glance might have theoretically caught. Because the step is currently a rubber-stamp, its efficacy is low, but deleting the code removes the safety net entirely, whereas disabling it via the existing flag allows you to run a controlled experiment. The correct path is to turn off the enforcement now, monitor for incidents during a trial period, and only delete the code once you have empirical evidence that the system remains stable without it.
