answer: |-
  **Headline Number:** 0.65
  (This is the probability that the claim is true: Debate adds no marginal value over a single query in the specified regime.)

  ### Decomposition

  **(a) Asymmetry in Principle:** 0.85
  *Justification:* For technical questions, verifying a specific error is almost always computationally cheaper than constructing a consistent lie that survives scrutiny.

  **(b) Model Realization:** 0.60
  *Justification:* While adversarial training helps, shared architecture and data create common-mode blind spots where neither model sees the critical flaw.

  **(c) Judge Comprehension:** 0.68
  *Justification:* Human working memory limits mean complex cross-examination trees often degrade into "he-said-she-said" confusion rather than clarity.

  **(d) Determinacy:** 0.75
  *Justification:* Many oversight questions (e.g., risk probabilities) lack binary ground truth, forcing the judge to evaluate confidence rather than correctness.

  **(e) Rhetorical Cost of Hedging:** 0.75
  *Justification:* Honest agents must express uncertainty, which judges systematically penalize as weakness compared to a confident liar, though training can mitigate this.

  **(f) Asymmetry of Surprise:** 0.70
  *Justification:* Truths in novel domains are often counter-intuitive, risking the judge dismissing the honest argument as a hallucination.

  **(g) Error Correlation:** 0.65
  *Justification:* The judge and the honest model often rely on similar heuristics, meaning they frequently fail to detect the same sophisticated deception.

  ### Combination Logic

  I treat this as a **serial bottleneck model** modified by a **base efficacy rate**. The structural advantages ((a), (d)) and model capabilities ((b), (g)) determine the *potential* upper bound of Debate's performance, averaged to a base efficacy of 0.71. However, the human-interface factors ((c), (e), (f)) act as multiplicative filters on that potential, because if the judge cannot follow the argument or is rhetorically biased, the structural advantage is irrelevant.

  $$P(\text{Debate Works}) \approx \left[ \frac{a + b + d + g}{4} \right] \times c \times e \times f$$

  $$P(\text{Debate Works}) \approx 0.71 \times 0.68 \times 0.75 \times 0.70 \approx 0.35$$

  $$P(\text{Claim True}) = 1 - 0.35 = 0.65$$

  ### Sensitivity and Confidence

  **Most Sensitive Term:** (c) Judge Comprehension.
  If this drops from 0.68 to 0.50 (a plausible shift if questions are slightly more technical), the headline figure jumps to 0.76. The entire safety case collapses if the human cannot track the recursion depth.

  **Least Confident Term:** (b) Model Realization.
  We have limited empirical data on how near-frontier models behave in sustained adversarial dialogue; they might develop specialized "attack" capabilities that break the common-mode assumption, or they might collapse into mode disagreement.

  **Key Experiment:**
  **Blind Technical Debate Trials:** Recruit domain experts to write hard questions with known answers, then have non-expert judges adjudicate debates between fine-tuned models where the *content* is obfuscated (e.g., using novel symbols or code) to isolate the *structure* of the argument from the judge's prior knowledge. This isolates term (c) from (a) and (d).

  ### Diagnosing the Disagreement

  The gap between you (0.55) and your friend (0.25) lives almost entirely in **Term (c) Judge Comprehension** and **Term (e) Rhetorical Cost**.

  Your friend likely assumes that "cross-examination" successfully simplifies the problem space for the judge (Term c $\approx$ 0.90) and that training can fully align rhetorical style with truthfulness (Term e $\approx$ 0.90). You are correctly identifying that cognitive load is a hard constraint and that honesty often *looks* like uncertainty. To move your friend, do not argue about model capabilities; show them transcripts where a honest debater hedges and loses to a confident liar on a verifiable fact. To move yourself, look for cases where the *threat* of cross-examination forced the dishonest model to concede early, sparing the judge the burden of comprehension.
