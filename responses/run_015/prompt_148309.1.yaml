      *   **User Persona:** Retired experimental physicist. Understands the math/physics basics (wavefunctions, amplitudes, determinism) but is grappling with the philosophical/interpretational implications. "Lab-coat mode" suggests a preference for concrete reasoning over hand-wavy metaphysics, but acknowledges the conceptual nature of the problem.
      *   **Topic:** Everettian Quantum Mechanics (EQM), specifically the Origin of the Born Rule ($P = |\psi|^2$).
      *   **Key Questions:**
          1.  Where do probabilities come from in a deterministic branching universe?
          2.  Is it decision-theoretic (rational agents) or physical (branch weights)?
          3.  Does the "single field over configuration space" view help or hinder?
