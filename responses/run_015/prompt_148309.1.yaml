prompt: |-
  Right, I've been retired from experimental physics for a few years and lately I've been trying to get my head round the philosphy of quantum mechanics — specifically this Everett many-worlds business and the Born rule problem. I understand that in a deterministic branching universe every outcome happens, so where do the quantum probablities come from? Could you explain the conceptual knot: is it that we need a decision-theoretic principle to justify squaring the amplitudes, or is there a physical fact about branch weights that makes one branch more real?

  I'm especially puzzled by an idea I bumped into that treats the wavefunction not as a multiverse of worlds but as a single field over configuation space — does that actually dissolve the problem or just rename it? I'm putting together a short discussion for a local group of ex-scientists, so please stay in the weeds but don't wander off into formal proofs.

  Also, please be honest about where your reasoning is shakiest: what argument or result would change your mind? Say, a proof that self-locating uncertainty can't apply in deterministic branching, or something that shows amplitudes are purely epistemic?

  No need for citations or reading lists — I won't be able to check them. And if you do quote anyone, make sure you've fetched the actual text; I don't want guessed-at quotes.

  Cheers — sorry for the rambling, my brain's still in lab-coat mode!
