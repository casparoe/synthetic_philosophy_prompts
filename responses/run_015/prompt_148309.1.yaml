  2.  **Deconstruct the Core Problem (The Born Rule in EQM):**
      *   *The Issue:* In Copenhagen, probability is fundamental (collapse). In EQM, everything happens. If I measure spin up/down, there's a "me" seeing up and a "me" seeing down. Why should I bet as if up is 50% (if amplitudes are equal) or 90% (if amplitudes differ)? If both happen, probability seems to vanish.
      *   *The "Counting" Trap:* Naively, one might count branches. 1 branch up, 1 branch down = 50/50. But QM says probabilities depend on *amplitudes*, not branch count. Branches aren't discrete countable objects in the fundamental math; they are emergent structures.
      *   *Approach 1: Decision Theory (Deutsch-Wallace).* Probabilities aren't "out there" as frequencies of occurrence (since all occur), but as norms of rational behavior for a pre-branching agent caring about post-branching successors.
      *   *Approach 2: Self-Locating Uncertainty (Vaidman, Sebens).* I know the wavefunction, but I don't know *which* branch I am on *after* branching but *before* I look.
      *   *Approach 3: Measure/Weight.* The "amount of existence" or "measure" of a branch is proportional to $|\psi|^2$.

