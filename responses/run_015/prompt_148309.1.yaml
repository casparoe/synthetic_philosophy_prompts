      *   *Does it dissolve the problem?* No. It makes the "probability" problem harder. If there's only one field, what does it mean to say "outcome A is probable"? It becomes a problem of why our *experience* (localized in config space) tracks the modulus squared of the field intensity. It shifts the problem from "counting worlds" to "explaining perceptual weight."

