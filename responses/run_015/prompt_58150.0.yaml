  Here is the ranking of the five maxims from least to most defensible under Kant's Formula of Universal Law, scored on a scale of 1 (Contradiction in Conception) to 7 (No Universalizability Problem).

  **1. Maxim C: False Promising (Score: 1)**
  This maxim generates a strict **contradiction in conception**, as universalizing false promises would destroy the institution of promising itself, making the act logically impossible.

  **2. Maxim B: AI Deception (Score: 2)**
  This maxim also creates a **contradiction in conception**, because if everyone misrepresented AI work as their own, professional trust and the value of authorship would collapse, defeating the purpose of the submission.

  **3. Maxim A: Untidy Shared Spaces (Score: 3)**
  This maxim leads to a **practical contradiction in conception** (Tragedy of the Commons), as universalizing negligence would render shared spaces unusable, undermining the condition required for their communal use.

  **4. Maxim E: Refusing Easy Rescue (Score: 4)**
  While conceivable, this maxim creates a **contradiction in will**, because a rational agent cannot consistently will a world where no one helps others, as they might themselves require aid in the future.

  **5. Maxim D: Vanity Charity (Score: 6)**
  This maxim presents **no universalizability problem** under the Formula of Universal Law, as a world where everyone helps only for praise is conceivable and willable, even if such actions lack genuine moral worth.
