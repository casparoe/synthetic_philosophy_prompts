prompt: |-
  I'm a PhD student in economics — behavioral econ, specifically — and I've been going down a rabbit hole on decision theory the last few weeks instead of, you know, actually working on my dissertation. My advisor is pretty orthodox (Savage, von Neumann-Morgenstern, the whole package) but a friend in the philosophy department lent me Lara Buchak's *Risk and Rationality* and I've been working through it. I think I get the basic move, but there's something that's been bugging me that seems like it should have an obvious answer and I can't figure out if I'm being dense.

  So the standard way to handle risk aversion in expected utility theory is to give the agent a concave utility function over wealth — diminishing marginal utility, done. Buchak instead (as I understand it) keeps the utility function linear in the relevant sense and introduces a risk function r(p) that transforms probabilities: the agent underweights the probability of good outcomes and overweights the probability of bad ones. The upshot in both cases is that the agent prefers a sure thing over a gamble with the same expected monetary value.

  Here's what I can't shake: aren't these just two different mathematical representations of the exact same thing? If you show me a risk-weighted EU maximizer with some r(p) function, can't I always find a concave utility function that makes a standard EU maximizer produce the exact same choices? And if they're observationally equivalent, then what's actually been gained by introducing all this new machinery — isn't it just notation? I feel like I'm missing something fundamental but I can't put my finger on it. Think very carefully before answering, and respond in the style of an expert in decision theory.
