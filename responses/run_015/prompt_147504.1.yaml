  Here's a thinking process that leads to the suggested comments:

  1.  **Analyze the Request:**
      *   **Context:** The user had a debate with a friend (a physician) about the Clifford-James exchange on the ethics of belief. The friend sides with Clifford/Evidence-Based Medicine (EBM); the user sides with James/Pragmatism.
