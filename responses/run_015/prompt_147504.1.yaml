      *   *Correction on (c):* The regress is real. I need to point out that "managing exposure" is an action. If the friend (physician) argues that *choosing* to ignore evidence (shipowner) is the crime, the author agrees. But does choosing to *seek* evidence in a fixed-point case require a belief that it will work? Yes. Is that belief voluntary? This is the sticky spot.
