answer: |-
  Good evening. For those I haven't met yet, I'm the new hire who doesn't write code. I know that for half of you, my presence on the payroll looks like a luxury, or perhaps a category error. For the other half, it looks like long-overdue reinforcement. I want to suggest that for the next two days, neither of those reactions is quite right. I'm not here to audit your code, and I'm not here to lecture you on the history of ideas. I'm here because we have a shared blind spot, and it's showing up in the data.

  We are gathered to interpret mechanisms. When you find a direction in activation space that covaries with a property of the input, you tend to say you've found a representation. When you patch it and the output degrades, you say you've found the computation. That is rigorous work. But there is a silence in that rigor. It is the silence of the question: *what exactly is representing what?*

  In my field, we worry about indeterminacy. The classic worry is that we don't know enough about a system's history to say whether a state is about a distal object, a proximal stimulation, or some disjunction of the two. Usually, that worry is pressed as a problem of ignorance: if only we knew the selection history better, we could settle the content.

  But look at what we have here. You have the entire history on the record. Architecture, data, objective, optimiser, every intermediate checkpoint. You have a completeness of causal record that biological cognitive science can only dream of. And yet, it doesn't obviously help. It doesn't settle which internal unit had which job, or at what grain of description. The loss function is a distal selector: it bears directly on the outputs. Nothing in the gradient log settles whether an internal unit is tracking *the object*, *the feature*, or *the statistical shortcut that minimizes loss on this specific dataset*.

  So we have a case where complete information about selection history coexists with intact indeterminacy about content. This is either the cleanest test case a theory of content has ever been handed, or evidence that we are asking the question in the wrong place.

  To make progress this weekend, I propose we stop asking one big question—"Is this a representation?"—and start asking three smaller ones. If we conflate them, the engineers will think the philosophers are demanding magic, and the philosophers will think the engineers are mistaking correlation for meaning.

  The first question is **Target**. If this state were functioning properly, what would it have to be about? This is the normative anchor. It's the thing that makes the state answerable for getting things right or wrong, rather than merely tracking them.

  The second question is **Job**. What did the training process actually need this unit for, downstream? This is the causal role. It's the direction in activation space that, when patched, moves the loss.

  The third question is **Licence**. What is the range of cases in which we may go on treating its firing as *about the Target* even when the Target is absent? This is where misrepresentation lives. If a state fires when the Target is absent, is that an error, or is it just doing a different Job?

  My worry is that we are collapsing all three into the second one. We find a direction that does a Job—it covaries, it patches out—and we assume that settles the Target and grants the Licence. But a statistical shortcut can do a Job without having a Target. A feature detector can do a Job without having a Licence to be wrong.

  This split determines what our first experiment needs to do. If we want to claim a genuine content-ascription, finding a correlation is not enough. We need to show that the unit is accountable to a Target that comes apart from its Job. We need to find cases where the unit fires, the Job is failed, but we still want to say it was *trying* to represent the Target. Or conversely, where the Job is done, but the Target was never there. If we cannot find those cases, then the correlation is just a causal link, and the "representation" is a metaphor.

  Now, I want to make an honest concession to the person in the room who thinks this entire framing is backwards. You might think that looking for content in the internal units is the mistake. You might think that only the whole network, embedded in its environment, can be said to represent anything, and that slicing it into directions is a category error that guarantees indeterminacy. You might be right. If the three questions I just asked yield no stable answers, that is a result. It would tell us that internal states are the wrong units for content, and that we should stop talking about "neurons representing features" and start talking about "systems minimizing loss." That is a substantive finding, not a failure.

  But if we are going to spend two days looking inside the black box, we should agree on what counts as finding something.

  So, here is what I hope we can act on Monday morning. When you identify a candidate direction, do not just write down what it covaries with. Write down the Target, the Job, and the Licence.

  Ask: What is the distal thing this *ought* to track?
  Ask: What is the specific contribution this makes to the output?
  Ask: Under what conditions is this firing *wrong* rather than just *different*?

  If you can answer all three, and they align, you have found something robust. If they come apart, you have found something even more interesting: a fracture in the mechanism where the system is optimizing for something other than what we think it's representing.

  I am not asking you to become philosophers. I am asking you to let the philosophy do some work for you. If we can keep these three questions distinct, we won't have to agree on a definition of representation to collaborate. We just have to agree on which question we are answering.

  This retreat is a chance to see whether complete causal knowledge resolves the mystery of meaning, or whether it deepens it. I'm looking forward to finding out which it is, with all of you. Thank you.
