answer: |-
  This is a strong set of intuitions. You are wrestling with the gap between **moral desert** (did they do bad things?) and **communicative effect** (what does the object do now?). Your TA is right that scarcity is the bridge: if space were infinite, we could keep everything as history. Because space is finite, keeping one thing up is an active choice *not* to honor someone else.

  Here are three candidate principles, tightened for a philosophy paper. They differ in what they treat as the primary wrong: the message sent, the resource hoarded, or the function violated.

  ### Principle 1: The "Active Civic Endorsement" Principle
  **Statement:** A public commemoration must be removed if it functions as an **active endorsement** by the polity of a subject whose primary public legacy is incompatible with the **equal standing** of current citizens, provided that removal frees **scarce civic space** for more inclusive narratives.

  *   **Clause A (Active Endorsement):** Distinguishes Case 1 (Remove) from Case 2 (Keep). The Confederate statue *works* as honor; the unreadable bust is inert "furniture." It also handles the **Neo-Nazi case**: if a group rallies around it, the object has been "re-dedicated" by the public. It is no longer inert; it is actively functioning as a banner for hate. This makes the case for removal *stronger*, not different.
  *   **Clause B (Equal Standing):** Handles Case 1 (Jim Crow context) and Case 7 (Moscow trials = state terror). It protects Case 4 (UGRR guy) because his primary legacy (in this context) supports the standing of the oppressed, even if he was bigoted elsewhere.
  *   **Clause C (Scarce Civic Space):** Internalizes your TA's demand. It explains why Case 6 (Museum) is fine. A museum is not "scarce civic space" in the same way a courthouse lawn is; it is a space for *history*, not *honor*. It also explains Case 3 (Building vs. Statue). A building name is functional identity (scarce); a statue in a garden can be historical record (less scarce).

  *   **The Casualty:** This principle might force you to change your verdict on **Case 5 (Library)**. If the library is a "civic space" promoting equal access, does a name tied to slave goods violate "equal standing"? You want to keep the name. To save this, you'd have to argue the library's *function* (lending books) outweighs the *naming*, but Principle 1 is suspicious of that.
  *   **New Cases:**
      *   **Founders Day:** If "nobody thinks about the name," is it *active* endorsement? If it's truly inert (like Case 2), Keep. But if the *origin* is structurally tied to the holiday's existence, Remove. (Principle 1 leans Remove).
      *   **Scholarship:** If renaming kills the fund, does it free "civic space"? No, it destroys the resource. Principle 1 might say **Keep the name** (consequentialist override), or argue that a scholarship isn't "civic space" in the monumental sense.
      *   **High School (Abusive CR Leader):** Domestic abuse is terrible, but does it violate the *equal standing of citizens* in the public sphere? Principle 1 suggests **Keep**. The public legacy (Civil Rights) supports equal standing; the private abuse, while monstrous, is distinct (like Case 4).

  ### Principle 2: The "Democratic Scarcity" Principle
  **Statement:** Public commemorative space is a **finite democratic trust**. Retention is justified only if the subject's net contribution to the **specific values of that space** outweighs the **exclusion of alternative subjects** who better embody those values today.

  *   **Clause A (Finite Trust):** This makes scarcity the engine of the principle. Keeping the Confederate statue (Case 1) is wrong primarily because it denies the majority-Black city the chance to honor someone who represents *their* justice.
  *   **Clause B (Values of the Space):** This saves Case 3 (Scientist). The *statue* honors scientific contribution (values of the field); the *building* honors institutional identity (values of the state). The sterilization law violates the state's values, so the building goes. The science remains valid, so the statue stays (with context).
  *   **Clause C (Net Contribution):** This handles Case 4 (UGRR/Anti-Irish). His contribution to freedom outweighs his nativism *in the context of a school name*.

  *   **The Casualty:** This principle threatens **Case 2 (Unknown Colonel)**. If space is a "trust," why waste it on "furniture"? A strict scarcity argument says: "If nobody knows him, he isn't contributing to the values of the space. Take it down to make room for someone who does." You would have to argue that "park furniture" has *zero* scarcity value (it's not on a plinth, it's in a bush), which is a factual claim you'd need to defend.
  *   **New Cases:**
      *   **Founders Day:** A holiday is high-scarcity (only so many days off). If the namesake doesn't embody current values, **Remove**. The "day off" benefit doesn't justify the "trust" violation.
      *   **Scholarship:** This is the hardest case. If the money vanishes, the "trust" (helping students) is broken. Principle 2 might demand **Keep the name** to preserve the utility, even if the honor is undeserved. This creates a "Dead Donor" exception.
      *   **Neo-Nazi Case:** The "values of the space" are hijacked. The statue no longer serves the democratic trust. **Remove**.

  ### Principle 3: The "Reception & Harm" Principle (Your Gut Check)
  **Statement:** A commemoration is wrongful when it **successfully communicates honor** to a relevant audience, and that honor is **derived from or inextricably linked** to acts that cause **ongoing dignitary harm** to the community occupying the space.

  *   **Clause A (Successfully Communicates Honor):** This is your solution to Case 1 vs. Case 2. Case 2 fails this test (nobody knows him). Case 1 passes (everyone knows what a Confederate statue means).
  *   **Clause B (Derived/Linked):** Saves Case 4 (UGRR). The honor is derived from saving slaves, not banning Irish. The bad acts are "separate." Saves Case 5 (Library). The library is named for the *donation*, not the *source of funds* (a subtle but defensible distinction).
  *   **Clause C (Ongoing Dignitary Harm):** This is the killer clause. It explains Case 1 (Jim Crow legacy harms Black citizens today). It explains Case 7 (Defending show trials harms the memory of labor victims). It explains Case 8 (1931 Plaque vs. Tomb). The tomb is architecture (no honor communicated); the 1931 plaque is an *act* of honoring a pogrom leader during a time of rising fascism (ongoing harm).

  *   **The Casualty:** This principle struggles with **Case 6 (Museum)**. A museum *communicates honor* (why else is it there?), but you want to keep it. You would need to argue that "museum context" negates "successful communication of honor" and converts it to "education." That's a plausible move, but it requires work.
  *   **New Cases:**
      *   **Founders Day:** If "nobody thinks about the name," does it *successfully communicate honor*? If no, **Keep**. This aligns with your Case 2 intuition.
      *   **Scholarship:** Does the name cause "dignitary harm" to the recipients? If they are kids needing money, maybe the harm is abstract. But if the abuse was of *kids*, the harm is direct. **Remove**.
      *   **High School (Abusive CR Leader):** Does domestic abuse cause "dignitary harm to the community occupying the space" (the students)? Harder to argue. **Keep**.
      *   **Neo-Nazi Case:** This creates "ongoing dignitary harm" for anyone who isn't a neo-Nazi. **Remove**.

  ### Recommendation for Your Paper

  I recommend **Principle 3 (Reception & Harm)**, but modified to include the TA's scarcity constraint.

  **The Hybrid Principle:**
  > "A public commemoration should be removed when it **functions as an active honorific** (reception), the honor is **linked to moral wrongs** that undermine the **equal standing of the local community** (harm), and its retention **occupies space** that could otherwise affirm that standing (scarcity)."

  **Why this works for you:**
  1.  **Solves 1 vs. 2:** Case 2 isn't an "active honorific." It's inert. Case 1 is active.
  2.  **Solves 3 (Scientist):** The statue is historical (less honorific); the building is functional (high honorific/scarcity).
  3.  **Solves 8 (Bishop):** Tomb = Architecture (not honorific). Plaque = Honorific.
  4.  **Handles the Neo-Nazis:** It proves the statue is "active." The rallies *make* it an active honorific, even if the city didn't intend it. This addresses the "speech act" reading from your seminar: the *crowd* performed a new speech act of dedication.
  5.  **Handles Scarcity:** It makes scarcity a condition of the harm. If the statue were in a warehouse (Case 6), it occupies no civic space, so no harm.

  **The Verdicts You Might Lose:**
  *   **Case 5 (Library):** If the library is "civic space" and the merchant's fortune is *from* slaves, a strict reading says the honor is linked to the wrong. You argue the link is attenuated (he donated the building, he didn't build it with slaves). You must defend that attenuation.
  *   **Case 7 (Labor Organizer):** You marked this "shaky." This principle says **Remove**. Defending show trials is defending state murder. That undermines "equal standing." If you want to keep him, you have to argue that his labor contributions are "separate" (like Case 4), but defending political murder is harder to separate than nativism.

  **One note on the "Founders Day" case:**
  If you use the Hybrid Principle, the verdict depends entirely on empirical fact: *Does anyone think about the name?* If it is truly Case 2-style inert, you can keep it. But if the *parade* reenacts history that glorifies the founder, it becomes active. Be careful not to let "nobody thinks about it" become an excuse for ignorance.

  **One note on the Scholarship case:**
  This is the "trolley problem" of memory. If renaming destroys the good (the money), does the harm of the name outweigh the loss of the fund? The Hybrid Principle suggests **Remove**, because the "space" (the name) is affirming a wrongdoer. But you could argue a scholarship is a *private trust* made public, not a *civic monument*. Distinguishing "naming rights" (buyable) from "public honor" (allocated) might save the scholarship name while removing the statue.
