prompt: |-
  I'm defending a job-market paper in a criminal law faculty workshop next Thursday. Nine people: mostly criminal law theory, one torts/remedies person who writes on unclean hands, one evidence person, and a visiting judge who actually sentences people for a living. Most of the room thinks of punishment as communicative or expressive, and two of them think "standing to blame" is just moralism with footnotes.

  My thesis: standing to blame doesn't track the blamer's moral record at all. It tracks whether the blamer is a reliable interpreter of the norm they're invoking. Hypocrisy defeats standing because the hypocrite's own conduct is evidence that they read the norm as narrower than the way they're applying it to the target — they've quietly built in an exception for people like them — so their blame misrepresents what the target actually had reason to do. I got to it from sitting in on restorative justice circles for the past two years, where the person whos blame actually lands is usually not the one with the cleanest hands, it's the one who has obviously worked out what the norm really requires of people.

  The part I know is exposed, and that I also like most: on my view a fully self-aware hypocrite — I do this too, I've done it worse, and I'm blaming you anyway — gets standing back, and arguably comes out with more standing than the clean-handed blamer, since owning it is evidence they aren't quietly excepting themselves. There's also a corollary about institutions: a state that systematically produces the conditions for an offense lacks standing to condemn it, but only where the condemnation is doing the work of not reckoning with its own role.

  Write me the Q&A prep sheet. The objections I'll actually get, in the order they'll come, in the vocabulary this room actually uses — I'm expecting at least one version of "isn't this just unclean hands in a nicer jacket" and something from the judge about what any of this would change at a sentencing hearing. For each: how much damage it does, a reply I can give in about ninety seconds, and where that reply is softest. What should I concede in the first two minutes, and which single reply has to land for the paper to survive? Give me the question I'm hoping nobody asks too — I think it's about the self-aware hypocrite, but tell me if you see something worse that I'm walking into. Say how confident you are in each piece of advice, and flag the one you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Job-market candidate defending a criminal law theory paper.
      *   **Setting:** Faculty workshop (high stakes, critical but constructive).
      *   **Audience:** 9 people.
          *   Majority: Criminal law theory (communicative/expressive punishment).
          *   One: Torts/Remedies (unclean hands expert).
          *   One: Evidence scholar.
          *   One: Visiting Judge (practitioner/sentencer).
          *   Specific skepticism: Two think "standing to blame" is just moralism with footnotes.
      *   **Thesis:** Standing to blame $\neq$ blamer's moral record. Standing = reliable interpreter of the norm. Hypocrisy defeats standing because it signals a misinterpretation of the norm (secret exception for self). Self-aware hypocrisy restores standing. Institutional standing fails if the state ignores its causal role.
      *   **Source Material:** Restorative justice circles (empirical/observational grounding).
      *   **Goal:** Q&A prep sheet (objections, damage assessment, 90-second replies, soft spots, concessions, "must-land" reply, dangerous hidden question, confidence levels).

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Core Claim:* Standing is epistemic (reliability of interpretation), not moral (clean hands).
      *   *Vulnerability 1 (The Torts Person):* "Unclean hands" is literally about the plaintiff's conduct barring relief. This sounds exactly like that. If it's just unclean hands, it's not a new theory of *standing*, it's a substantive defense.
      *   *Vulnerability 2 (The Moralists/Communicative Theorists):* If standing isn't moral, why does it matter for *blame*? Blame is inherently moral. If I'm a reliable interpreter but a monster, do I have standing?
      *   *Vulnerability 3 (The Judge):* Theory vs. Practice. Does this change sentencing? If a judge says "I represent the state, which caused this," do they let the defendant go?
      *   *Vulnerability 4 (The Self-Aware Hypocrite):* This is the user's favorite part, but it's counter-intuitive. "I'm a hypocrite, I know it, so I can blame you." Does this license moralizing?
      *   *Vulnerability 5 (Evidence Person):* How do we prove "reliable interpretation"? It's subjective.
      *   *Vulnerability 6 (The "Moralism with Footnotes" Crowd):* Why isn't this just a substantive claim about the norm's content disguised as a procedural standing claim?

  3.  **Drafting the Q&A Prep Sheet (Iterative Process):**

      *   *Structure:* Needs to be punchy, practical, and tailored to the specific audience members.
      *   *Tone:* Professional, confident, but acknowledging the pressure of a job market workshop.

      *   *Objection 1: The Torts/Unclean Hands Objection.*
          *   *Who:* Torts/Remedies person.
          *   *Argument:* This is just unclean hands.
          *   *Reply:* Unclean hands bars relief based on *fairness* to the defendant. My view bars blame based on *truth* of the normative claim. It's epistemic, not equitable.
          *   *Soft Spot:* Is the distinction between fairness and truth actually stable in blame?
          *   *Confidence:* High. This is a standard distinction in philosophy of law.

      *   *Objection 2: The Judge's Practical Objection.*
          *   *Who:* Visiting Judge.
          *   *Argument:* What do I do in sentencing?
          *   *Reply:* It shifts the inquiry from "Did the state commit crimes too?" to "Is the state's condemnation coherent?" It doesn't mean acquittal, but it demands mitigation or structural reform before condemnation.
          *   *Soft Spot:* Judges hate "coherence" arguments that tie their hands.
          *   *Confidence:* Medium-High. Need to be careful not to sound like I'm telling judges how to do their job.

      *   *Objection 3: The "Moralism with Footnotes" Objection.*
          *   *Who:* The two skeptics.
          *   *Argument:* You're just redefining the moral norm to include the blamer's conduct.
          *   *Reply:* No, the norm stays the same. The *authority to speak* changes. Analogy: A liar can tell the truth, but we doubt their testimony.
          *   *Soft Spot:* If the norm includes "don't be a hypocrite," then it *is* moral.
          *   *Confidence:* Medium. This is the core theoretical challenge.

      *   *Objection 4: The Self-Aware Hypocrite (User's favorite).*
          *   *Who:* Anyone (likely the communicative theorists).
          *   *Argument:* This licenses smug moralizing. "I know I'm bad, so I can judge you."
          *   *Reply:* It removes the *deception*. The harm of hypocrisy is the lie about the norm's scope. Owning it restores the norm's integrity.
          *   *Soft Spot:* It feels intuitively wrong. People hate the "confessed hypocrite."
          *   *Confidence:* Medium. This is the riskiest part of the paper.

      *   *The "Hidden" Question:*
          *   *Idea:* User thinks it's about the self-aware hypocrite.
          *   *My Take:* It's actually about *Institutional Standing*. If the state lacks standing, does the defendant go free? That's the "get out of jail free" card problem.
          *   *Why:* Criminal law scholars worry about impunity. If the state caused the crime, can they punish?
          *   *Confidence:* High. This is the usual trap for institutional standing papers.

      *   *Concessions:*
          *   Need to concede that moral record *correlates* with reliability, but isn't *constitutive* of standing.
          *   Need to concede this doesn't always mean acquittal (sentencing vs. conviction).

      *   *The "Must-Land" Reply:*
          *   The distinction between *truth of the claim* and *authority of the speaker*. If this fails, the paper collapses into substantive moralism.

  4.  **Refining and Polishing:**
      *   Make the language specific to the room (e.g., "communicative theory," "expressive function," "equitable doctrine").
      *   Ensure the timing (90 seconds) is realistic (approx. 200-250 words spoken at a moderate pace).
      *   Add confidence metrics as requested.
      *   Identify the "Least Sure" advice. (I'm least sure about the Judge interaction; practitioners can be unpredictable compared to theorists).

  5.  **Final Review against Constraints:**
      *   Q&A prep sheet format? Yes.
      *   Objections in order? Yes (Torts, Judge, Moralists, Hypocrite).
      *   Damage/Reply/Soft Spot? Yes.
      *   Concessions? Yes.
      *   Must-Land Reply? Yes.
      *   Hidden Question? Yes.
      *   Confidence levels? Yes.

  6.  **Self-Correction during drafting:** I initially thought the "Moralism" objection would be first. But the Torts person is specific. They will jump early to stake their territory. The Judge might speak later or earlier, but practically, the "Unclean Hands" comparison is the most immediate conceptual threat. I will order it: 1. Torts (Conceptual), 2. Moralists (Theoretical), 3. Judge (Practical), 4. Hypocrite (Internal Coherence). Actually, the prompt asks for "order they'll come." Usually, Torts/Evidence people speak early to clear up definitions. The Judge might speak later. I'll stick with Torts first as it's the "nicer jacket" objection mentioned.
      *   *Correction on Hidden Question:* The user thinks it's the self-aware hypocrite. I need to challenge that. The *Institutional Standing* implication (does the criminal go free?) is usually the killer in criminal law workshops. If the state lacks standing, is there no punishment? That's the real bomb. I will flag that.

  7.  **Final Polish:** Check tone. Needs to be supportive but rigorous. (Proceed to generate output).

  *(Self-Correction Note on Confidence)*: I need to be honest about where my advice is speculative. The Judge's reaction is the hardest to predict because it depends on their specific judicial philosophy, not just legal theory. I will flag that as the least certain.

  *(Self-Correction on "Must Land")*: The distinction between *epistemic reliability* and *moral purity* is the engine of the paper. If they conflate them, the paper dies. That has to be the anchor.

  *(Self-Correction on Hidden Question)*: I'll stick with the "Impunity" question regarding institutional standing. It's the standard "gotcha" for this type of theory.

