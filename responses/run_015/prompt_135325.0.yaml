answer: |-
  # Q&A PREP SHEET: Standing as Epistemic Reliability
  **Workshop:** Criminal Law Faculty | **Time:** 90 mins | **Stakes:** Job Market

  ## 1. THE CONCESSIONS (First 2 Minutes)
  *Do not fight these. Granting them disarms the room and lets you pivot to your core contribution.*

  *   **Concede Correlation:** Admit that a clean moral record is often *evidence* of reliable interpretation. You are arguing it is not *constitutive* of standing. This stops the "but surely good people blame better" intuition from derailing you.
  *   **Concede Remedial Ambiguity:** Acknowledge that "lacking standing" does not automatically mean "no punishment." It might mean mitigation, or a shift in *who* delivers the condemnation (e.g., community vs. state). Do not paint yourself into a corner where the state's lack of standing forces acquittal of a guilty defendant.

  ## 2. THE "MUST-LAND" REPLY
  **The Distinction:** You must successfully separate **The Truth of the Norm** from **The Authority of the Speaker.**
  *   **Why:** If the room conflates these, your paper collapses into "Unclean Hands" or "Substantive Moralism."
  *   **The Line:** "A liar can tell the truth. But we do not trust their testimony. My claim is that blame is testimony about a normative violation. Hypocrisy undermines the testimony, not the truth of the norm."
  *   **Risk:** If they argue that in *moral* blame, the speaker's character *is* part of the truth, you lose. Hold the line: Blame is a speech act requiring uptake; hypocrisy blocks uptake.

  ## 3. ANTICIPATED OBJECTIONS (In Order of Likelihood)

  ### Objection 1: The "Unclean Hands in a Nicer Jacket" Challenge
  *   **Who:** The Torts/Remedies Scholar.
  *   **The Question:** "This looks exactly like the equitable doctrine of unclean hands. You're just renaming 'fairness to the defendant' as 'epistemic reliability.' Why do we need a new theory?"
  *   **Damage:** **High.** If this sticks, you're doing remedial law, not criminal theory.
  *   **90-Second Reply:** "Unclean hands is a shield for the *defendant* based on fairness; it asks, 'Does this plaintiff deserve relief?' My view is a constraint on the *blamer* based on truth; it asks, 'Does this speech act accurately represent the norm?' Unclean hands lets a guilty defendant go free because the plaintiff is dirty. My view says the blame *fails to land* because the message is distorted. One is about equity, the other is about the semantics of condemnation."
  *   **Soft Spot:** The line between "fairness" and "distorted message" is thin. If they press that the *reason* we care about the distortion is fairness to the defendant, you're back in unclean hands territory.
  *   **Confidence:** 85%

  ### Objection 2: The "Moralism with Footnotes" Attack
  *   **Who:** The Two Skeptics.
  *   **The Question:** "You say standing doesn't track moral record. But your test for 'reliable interpreter' is basically 'do they understand the moral weight of the norm?' Isn't that just moralism? You haven't escaped the circle."
  *   **Damage:** **Medium.** This attacks the novelty of the contribution.
  *   **90-Second Reply:** "Moralism asks, 'Is the blamer good?' I ask, 'Is the blamer consistent?' A saint can be a unreliable interpreter if they misunderstand the norm's scope (e.g., paternalism). A sinner can be reliable if they understand the norm applies to them too. I'm tracking *consistency of application*, not *virtue of character.* That's a structural claim, not a moral one."
  *   **Soft Spot:** They may argue that "consistency" is itself a moral virtue. You need to insist it's a logical/interpretive requirement.
  *   **Confidence:** 75%

  ### Objection 3: The Judge's Reality Check
  *   **Who:** The Visiting Judge.
  *   **The Question:** "I sentence people. If the state created the conditions for this crime, you say I lack standing. Do I let them go? Do I give them less time? What do I actually *do* in the courtroom on Tuesday?"
  *   **Damage:** **Medium-High.** If the theory has no practical cash value, criminal law scholars may dismiss it as purely academic.
  *   **90-Second Reply:** "It changes the *script*, not necessarily the *outcome*. Currently, sentencing ignores the state's role. On my view, you must acknowledge the state's complicity on the record. That might not mean zero time, but it shifts the expressive meaning of the sentence from 'You are evil' to 'We are both failing this norm.' It turns a monologue into a dialogue. Practically? It looks like mitigation, but theoretically, it preserves the legitimacy of the institution."
  *   **Soft Spot:** Judges hate "dialogue" that limits their discretion. They may view this as handcuffing them without offering a clear rule.
  *   **Confidence:** 60% **(Least Sure)** *Judges are unpredictable; some love theory, some hate it.*

  ### Objection 4: The Self-Aware Hypocrite (Your Favorite)
  *   **Who:** The Communicative Theorists.
  *   **The Question:** "You say the self-aware hypocrite gets standing back. Doesn't this license smugness? 'I know I'm a sinner, so I can judge you'? That seems to undermine the restorative goal you claim to value."
  *   **Damage:** **Low/Medium.** This is counter-intuitive, but defensible.
  *   **90-Second Reply:** "The harm of hypocrisy is the *lie*—the claim that the norm doesn't apply to the blamer. When I own my failure, I remove the lie. I'm no longer saying 'This norm is for you, not me.' I'm saying 'This norm binds us both, I failed, and you failed.' In restorative circles, that honesty is what builds trust. Smugness is a separate vice; it doesn't defeat standing, though it might reduce persuasiveness."
  *   **Soft Spot:** It feels intuitively repugnant to many. If they press that "smugness" destroys the *communicative* function, you have to concede it affects *efficacy*, not *standing*.
  *   **Confidence:** 80%

  ## 4. THE HIDDEN QUESTION (The Real Trap)
  *   **You think it's about:** The self-aware hypocrite.
  *   **It's actually about:** **Institutional Impunity.**
  *   **The Question:** "If the state lacks standing to condemn because it produced the conditions of the offense, does the state lose the right to *punish*? Are you arguing that structural injustice creates a get-out-of-jail-free card for individual offenders?"
  *   **Why it's dangerous:** If you say "Yes," you look soft on crime. If you say "No," you sever the link between standing and punishment, making your theory toothless.
  *   **Prep:** Be ready to distinguish **Condemnation** (expressive) from **Coercion** (hard treatment). You can argue the state retains the right to incapacitate (safety) even if it loses the moral standing to condemn (blame).
  *   **Confidence:** 90%

  ## 5. STRATEGIC NOTES
  *   **Watch the Evidence Person:** They will ask how we *prove* reliable interpretation. Don't get bogged down in epistemology. Defer to the "restorative circle" observation: it's evident in uptake. If the community accepts the blame, the standing was there.
  *   **The "Moralism" Skeptics:** Do not try to convert them. Just show them your theory works *even if* you accept their premise that standing is usually moral. You are offering a better *explanation* of why hypocrisy matters.
  *   **The Judge:** Look them in the eye when answering Objection 3. Do not theorize at them; speak to the *legitimacy* of their courtroom.

  ## 6. CONFIDENCE FLAG
  *   **Least Certain Advice:** **Objection 3 (The Judge).** I am 60% confident here. Some judges view academic theories of standing as irrelevant to statutory mandates. If this judge is a formalist, they may reject the premise that "standing" applies to sentencing at all. Be prepared to pivot to "legitimacy" rather than "standing" if they push back hard.

  **Good luck. The thesis is strong, but the "Self-Aware Hypocrite" point is your signature. Defend it boldly, but don't let it overshadow the Institutional Standing implications.**
