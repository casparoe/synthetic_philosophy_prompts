  # Taxonomy of Self-Certifying Belief Systems

  ## Root Diagnostic: The Availability of Basic Knowledge
  **Scenario:** A patient checks a glucose monitor. The display reads "100 mg/dL."
  **Question:** Do you know the reading is "100 mg/dL" *before* you have established that the monitor is reliable? (i.e., Is this belief non-inferential?)

  *   **NO** → **[Exit: Skepticism / Infinitism]** *(Not a target leaf for this seminar)*
  *   **YES** → **Proceed to Axis 1**

  ---

  ## Axis 1: The Bootstrapping Permission
  **Scenario:** A self-calibrating atmospheric sensor logs its own voltage stability to certify its accuracy.
  **Question:** Is it rationally permissible to cite the log entries (produced by the sensor) as premises in an argument concluding that the sensor is reliable?

  *   **NO (The Reasoning is Illegitimate or Unnecessary)** → **Proceed to Diagnostic A**
  *   **YES (The Reasoning is Permissible)** → **Proceed to Axis 2**

  ---

  ### Diagnostic A: Source of the Blockage (Refining Axis 1)
  **Scenario:** The atmospheric sensor malfunctions silently but continues to log "Stable."
  **Question:** In this malfunctioning case, is your justificatory basis for trusting the log *identical* to the basis you have when the sensor works correctly?

  *   **YES (Internalist Sameness)** → **Leaf 1: Hard-line Anti-Bootstrapping**
      *   *Awkward Commitment:* You possess basic knowledge of the reading, but the structural circularity of using that reading to validate the source permanently blocks you from knowing the source is reliable.
  *   **NO (Factive Difference)** → **Leaf 2: Epistemic Disjunctivism**
      *   *Awkward Commitment:* You cannot use the reading to prove reliability because in the "bad case" you lack the factive perceptual state required to support the conclusion, rendering the skeptical hypothesis rationally excluded rather than empirically refuted.

  *(Note: While both leaves fall under the "No" branch of Axis 1, they are separated here by their underlying metaphysical commitment to the nature of the basic state, which determines why the bootstrapping inference fails.)*

  ---

  ## Axis 2: Contextual Salience
  **Scenario:** A clinical lab uses a blood assay protocol that validates its own reagent purity.
  **Question:** Does the rationality of accepting this self-validation vanish if a colleague explicitly raises the possibility of a systematic, undetectable contamination error?

  *   **NO (Invariant Legitimacy)** → **Proceed to Axis 3 (Invariant Branch)**
  *   **YES (Variable Legitimacy)** → **Proceed to Axis 3 (Contextual Branch)**

  ---

  ## Axis 3: Strength of Conclusion
  **Scenario:** A witness testifies to her own sobriety to validate her testimony about an accident.
  **Question:** If the reasoning is permitted, does it yield *knowledge* that she was sober, or merely a non-evidential *entitlement* to proceed as if she were?

  ### Invariant Branch (From Axis 2: NO)
  *   **KNOWLEDGE** → **Leaf 3: Unrestricted Reliabilism**
      *   *Awkward Commitment:* You can come to know an instrument is reliable solely by trusting its outputs, even if you had no prior reason to trust it, provided the instrument is in fact reliable.
  *   **ENTITLEMENT** → **Leaf 4: [UNOCCUPIED COMBINATION]**
      *   *Diagnosis:* This position claims bootstrapping is always permissible and context-insensitive, yet yields only practical entitlement rather than knowledge; it is unexplored because invariant permission typically motivates a claim to truth-tracking (knowledge), while entitlement views usually invoke constraints (like context or hinges) to explain the lack of knowledge.

  ### Contextual Branch (From Axis 2: YES)
  *   **KNOWLEDGE** → **Leaf 5: Epistemic Contextualism**
      *   *Awkward Commitment:* You can know the instrument is reliable in ordinary conversation, but that knowledge disappears the moment a skeptical alternative is mentioned, even if the instrument's actual reliability hasn't changed.
  *   **ENTITLEMENT** → **Leaf 6: [UNOCCUPIED COMBINATION]**
      *   *Diagnosis:* This position claims bootstrapping legitimacy shifts with context, but the reward is merely entitlement rather than knowledge; it is incoherent because contextualism is typically motivated by preserving knowledge attributions across contexts, not by downgrading warrant types based on salience.

  *(Note: Leaf 6 is the primary "Unoccupied" leaf required by the prompt instructions. Leaf 4 is also unoccupied but less theoretically significant.)*

  ---

  ## Meta-Commentary on Leaf Separation

  **Flagged Indistinguishability:**
  *   **Leaf 3 (Unrestricted Reliabilism)** and **Leaf 5 (Contextualism)** cannot be genuinely separated by the tree in **low-stakes contexts**. In an ordinary scenario where no skeptical alternatives are salient, both positions permit the bootstrapping inference and attribute knowledge. The tree only separates them based on the *counterfactual* response to raised doubt (Axis 2), not by the output in standard cases.
  *   **Leaf 3 (Unrestricted Reliabilism)** and **Leaf 2 (Epistemic Disjunctivism)** share the same practical outcome (we have knowledge of the external world), but the tree separates them based on the *mechanism* (Axis 1). However, students may find the distinction between "permissible inference" (Reliabilism) and "unnecessary inference due to factivity" (Disjunctivism) difficult to diagnose purely via the sensor scenario without theoretical background.
