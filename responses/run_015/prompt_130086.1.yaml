answer: |-
  You are standing on very solid philosophical ground here. Your roommate is arguing for **value monism** (specifically a utilitarian/economic framework), which assumes all goods can be reduced to a single common denominator (usually utility or dollars). You are arguing for **value pluralism**, most famously associated with philosophers like Isaiah Berlin, Elizabeth Anderson, and Joseph Raz.

  The core of your argument is that when you force incommensurable values onto a single scale, you don't just get a "bad measurement"; you commit a **category mistake**. You aren't measuring the values anymore; you are replacing them with something else entirely.

  Here is a breakdown of your burial site example, sharpened to show exactly how the logic of *both* values disintegrates when you force them into a cost-benefit analysis.

  ### The Scenario: The Sacred Burial Ground vs. The Carbon Sink

  **The Conflict:** A proposed green energy project (like a solar farm or reforestation project) requires disturbing an indigenous burial site.
  **Value A:** **Ancestral Sanctity.** (Based on duty, memory, and the non-fungible nature of the dead).
  **Value B:** **Ecological Stewardship.** (Based on biodiversity, climate mitigation, and the future of life).
  **The Roommate's Solution:** Translate both into **Dollar Value** (e.g., Cost of relocation/compensation vs. Value of Carbon Credits).

  ### How the Logic Breaks Down (The Double Corruption)

  When you translate these values into a common metric like dollars, you don't find the "true weight" of either. You corrupt the internal logic of both.

  #### 1. Corruption of Value A (Sanctity becomes Inventory)
  The concept of "Sacredness" or "Ancestral Respect" relies logically on the idea of **inalienability**. Something is sacred precisely because it is *not* for sale. It exists outside the sphere of exchange.

  *   **The Logical Break:** The moment you assign a dollar figure to the burial site (even a high one to "protect" it), you have conceptually admitted that it *is* for sale. You have moved it from the sphere of **Duty** (things we must do regardless of cost) to the sphere of **Price** (things we do if the benefit outweighs the cost).
  *   **The Result:** You haven't measured the value of the ancestors; you have measured the **bribe** required to violate them. The metric doesn't capture "respect"; it captures the price of "disrespect." If the solar company offers \$10 million, and the tribe says "no," the cost-benefit analysis says the tribe is being "inefficient." But within the logic of sanctity, the tribe is being *consistent*. The metric renders the actual value (sanctity) invisible because sanctity has no price, only prohibitions.

  #### 2. Corruption of Value B (Stewardship becomes Management)
  Your roommate thinks monetizing the environment helps save it. But "Ecological Stewardship" is logically based on **interconnectedness** and **intrinsic worth** of nature.

  *   **The Logical Break:** When you reduce biodiversity to "Carbon Credits" or "Dollar Value," you are treating nature as a warehouse of isolated commodities rather than a web of relationships. You are saying a tree is worth X because of the carbon it sequesters. But what about the tree's role in the local soil, its cultural significance, or its right to exist?
  *   **The Result:** By forcing the "Green" value into a dollar metric to compare it against the burial site, you turn "saving the planet" into a **business transaction**. You create a logic where it is acceptable to destroy *this* sacred thing to buy *that* green thing. This corrupts the environmental ethic from "do no harm" to "offset the harm." It turns stewardship into **accounting**.

  #### 3. The Metric Itself (Money) is a Category Error
  This is the philosophical kill-shot against your roommate's argument. Money is a tool for **fungible goods** (things that can be swapped for equivalent things, like bushels of wheat).

  *   **The Category Mistake:** Using money to compare Sanctity and Biodiversity is like using a ruler to weigh a song. You can get a number (the length of the sheet music), but that number tells you nothing about the music.
  *   **Why it fails conceptually:**
      *   If the Burial Site is worth \$5M and the Solar Farm is worth \$6M, the math says "Build the Farm."
      *   But the *reasons* for valuing them are different kinds of reasons. One is a **Deontological reason** (Rule-based: "Do not disturb the dead"). The other is a **Consequentialist reason** (Outcome-based: "Reduce carbon").
      *   You cannot subtract a Rule from an Outcome. They are different logical operators. Forcing them into subtraction pretends they are the same type of object.

  ### The "Hard Choice" Proof

  The existence of a "Hard Choice" is actually proof of incommensurability.

  *   **If your roommate were right:** There would be no "hard choice." There would just be a calculation. If we could truly put them on the same scale, the decision would be easy (whichever number is higher). We would feel no regret.
  *   **The Reality:** We feel **tragic regret**. Even if we build the solar farm to save the climate, we feel we have done something wrong by disturbing the grave. Even if we protect the grave, we feel guilt about the carbon emissions.
  *   **The Conclusion:** That lingering regret is the signal that a value was left out of the equation. The cost-benefit analysis "solved" the problem by deleting the part of the reality it couldn't measure.

  ### How to phrase this to your roommate

  You can tell him: *"You're confusing **pricability** with **value**. I can put a price on a kidney, but that price doesn't measure 'health' or 'bodily integrity'; it measures the black market demand. When you force the burial site and the climate onto the same dollar scale, you aren't comparing them. You are demoting the burial site from 'Sacred' to 'Expensive,' and you are demoting the climate from 'Home' to 'Asset.' You get a clean number, but you've destroyed the meaning of both things you were trying to save."*

  ### Recommended Reading (for ammo)
  If he wants sources, point him to:
  1.  **Elizabeth Anderson, *Value in Ethics and Economics*:** She argues specifically that commodification corrupts non-market values.
  2.  **Michael Sandel, *What Money Can't Buy*:** Focuses on how market metrics crowd out moral norms.
  3.  **Isaiah Berlin, *The Crooked Timber of Humanity*:** The classic text on Value Pluralism and why some values clash without a solution.

  You win this argument on the grounds that **measurement changes the thing being measured.** In quantum physics, that's the Observer Effect. In ethics, that's **Commodification.**
