      *   P1 Partition: $A=\{1,2,3,5\}$, $B=\{4,6,7,8\}$.
          *   If $A$: $E \cap A = \{1,2,3\}$. $P(E|A) = 3/4 = 0.75$.
          *   If $B$: $E \cap B = \{4\}$. $P(E|B) = 1/4 = 0.25$.
      *   P2 Partition: $C=\{1,2,4,5\}$, $D=\{3,6,7,8\}$.
          *   If $C$: $E \cap C = \{1,2,4\}$. $P(E|C) = 3/4 = 0.75$.
          *   If $D$: $E \cap D = \{3\}$. $P(E|D) = 1/4 = 0.25$.
      *   *Case: State 1.*
          *   P1 sees $A$ (0.75). P2 sees $C$ (0.75). Agree immediately.
      *   *Case: State 5.*
          *   P1 sees $A$ (0.75). P2 sees $C$ (0.75). Agree immediately.
      *   *Case: State 3.*
          *   P1 sees $A$ (0.75). P2 sees $D$ (0.25). **Disagree.**
          *   Round 2:
              *   P1 hears 0.25. Knows P2 is in $D=\{3,6,7,8\}$.
              *   P1 is in $A=\{1,2,3,5\}$.
              *   Intersection: $\{3\}$. (Since 6,7,8 not in A).
              *   Wait, if Intersection is $\{3\}$, then State is 3. $P(E)=1$.
              *   P2 hears 0.75. Knows P1 is in $A=\{1,2,3,5\}$.
              *   P2 is in $D=\{3,6,7,8\}$.
              *   Intersection: $\{3\}$. State is 3. $P(E)=1$.
          *   They converge to 1.0 in Round 2.
      *   *Case: State 4.*
          *   P1 sees $B$ (0.25). P2 sees $C$ (0.75). **Disagree.**
          *   Intersection of $B$ and $C$: $\{4\}$. State is 4. $P(E)=1$.
      *   *Case: State 6.*
          *   P1 sees $B$ (0.25). P2 sees $D$ (0.25). Agree immediately.
      *   *This works perfectly.* It creates immediate agreement in some states, 1-round update in others.
      *   I will provide this exact setup in the materials section.

  18. **Final check on stakes:** "Tiny stakes on the table".
      *   Use poker chips.
      *   Pot of 10 chips.
      *   Deduct 1 chip for every round of disagreement.
      *   Split pot if they agree.
      *   This incentivizes convergence without incentivizing "lying" to match (because accuracy is checked at the end against the true state for a bonus).
      *   *Actually, Aumann is about truthfulness.*
      *   Better: **Brier Score.**
      *   End of game: Reveal True State.
      *   Score = $1 - (Prediction - Truth)^2$.
      *   Bonus: If everyone's final prediction matches, +5 points.
      *   This creates tension: Do I stick to my gun (accuracy) or match the group (consensus bonus)? Aumann says rationality forces both.

  19. **Ready to write.**
answer: |-
  Here is a complete design for your 90-minute session. It uses physical partitions to make the information structure tangible, creates real tension between accuracy and consensus, and includes the specific variants and debrief machinery you requested.

  # Activity: The Partition Protocol

  **Group Size:** 14 participants.
  **Configuration:** 3 Groups of 4 players, 1 Group of 2 (you join this one to model).
  **Time:** 60 min Play, 30 min Debrief.
  **Materials:** Printed "State Cards", "Partition Masks", Poker Chips (or printed points), Whiteboard.

  ## Part 1: The Setup (10 Minutes)

  **The World:**
  There are 8 possible states of the world, numbered **1 through 8**.
  One state is chosen at random by the Dealer (you) at the start of each round.
  **The Event ($E$):** The state is **1, 2, 3, or 4**. (Truth = 1 if $E$, 0 if $\neg E$).
  **The Prior:** Uniform (12.5% chance for each state). Prior Prob($E$) = 0.5.

  **The Information (Partitions):**
  Do not let players see each other's cards.
  *   **Player 1** receives a **Row Card**. It tells them if the state is in $\{1,2,3,5\}$ (Call this **Group A**) or $\{4,6,7,8\}$ (Call this **Group B**).
  *   **Player 2** receives a **Col Card**. It tells them if the state is in $\{1,2,4,5\}$ (Call this **Group C**) or $\{3,6,7,8\}$ (Call this **Group D**).
  *   **Player 3 & 4** receive **Parity Cards**.
      *   P3: Odd $\{1,3,5,7\}$ vs Even $\{2,4,6,8\}$.
      *   P4: Prime $\{2,3,5,7\}$ vs Composite $\{1,4,6,8\}$.
      *(Note: P3 and P4 are "noise" players to simulate a larger group, but P1 and P2 carry the logical load of the theorem.)*

  **The Stakes:**
  *   **Accuracy Pot:** 10 Chips. At the end, awarded to the player whose final probability is closest to the Truth (1.0 or 0.0).
  *   **Consensus Bonus:** 5 Chips *each*. Awarded only if all players announce the **exact same number** in the final round.
  *   **Cost of Time:** The pot shrinks by 1 chip per round. (Incentivizes fast convergence).

  ## Part 2: The Game (35 Minutes)

  **Round 1 (Private Calculation):**
  1.  Dealer picks a state (e.g., State 3). Distribute cards.
  2.  Players calculate $P(E | \text{their group})$.
      *   *Cheat Sheet provided:* "Count how many numbers in your group are in 1-4. Divide by total numbers in your group."
      *   *Example:* If State is 3:
          *   P1 has Group A $\{1,2,3,5\}$. $E$-members: 1,2,3. Prob = 3/4 = **0.75**.
          *   P2 has Group D $\{3,6,7,8\}$. $E$-members: 3. Prob = 1/4 = **0.25**.
          *   P3 has Odd. Prob = 2/4 = **0.50**.
          *   P4 has Prime. Prob = 2/4 = **0.50**.
  3.  Players write numbers on whiteboard simultaneously.
  4.  **Observation:** P1 and P2 disagree (0.75 vs 0.25). Consensus bonus is at risk.

  **Round 2 (Public Update):**
  1.  Players see the Round 1 numbers.
  2.  **The Rule:** "You are rational. You know everyone else is rational. You know everyone's Partition Cards (the sets above)."
  3.  Players must update.
      *   *Logic for P1:* "I am in A. I see P2 said 0.25. P2 only says 0.25 if they are in Group D. The intersection of A and D is $\{3\}$. The state must be 3. $E$ is True. My new prob is 1.0."
      *   *Logic for P2:* "I am in D. I see P1 said 0.75. P1 only says 0.75 if they are in Group A. Intersection is $\{3\}$. State is 3. $E$ is True. My new prob is 1.0."
  4.  Announce Round 2 numbers. (Should all be 1.0).
  5.  Dealer reveals State 3. Truth = 1.0.
  6.  Distribute chips.

  **Repeat:** Run 3 rounds with different states (e.g., State 6, State 1, State 4) so they feel the convergence mechanism vary (some converge instantly, some take a round).

  ## Part 3: Variant 1 — The Broken Prior (15 Minutes)

  **The Twist:**
  Tell the group: "Same game. Same cards. New Deal."
  **Secretly** hand **Player 1** a **"Biased Prior" Card**.
  *   **Standard Prior:** "All 8 states equally likely."
  *   **Biased Prior (P1 only):** "States 1,2,3,4 are **3x more likely** than 5,6,7,8."
  *   **Instruction:** "Do not tell anyone about your prior card. Calculate your probability using your prior."

  **The Play:**
  *   Pick State 3 again.
  *   P1 (Biased): Group A $\{1,2,3,5\}$. Weights: $1,2,3$ are heavy (3), $5$ is light (1). Total weight = 10. $E$-weight = 9. $P(E) = 0.9$.
  *   P2 (Standard): Group D $\{3,6,7,8\}$. Weights: All 1. Total 4. $E$-weight = 1. $P(E) = 0.25$.
  *   **Round 1:** P1 says 0.9. P2 says 0.25.
  *   **Round 2:** They try to update.
      *   P2 thinks: "P1 said 0.9. That's not a number in my lookup table for P1. P1 must be crazy or I'm missing something."
      *   P1 thinks: "P2 said 0.25. That implies they are in Group D. Intersection is State 3. I should say 1.0."
      *   P2 thinks: "P1 said 1.0. That implies State 1,2,3,5. Intersection with my D is State 3. I should say 1.0."
      *   *Wait, they might still converge on the State.*
      *   **Correction for Failure:** To ensure they *fail* to agree on probability, the Prior must affect the posterior even after state identification.
      *   **Revised Variant:** Make the Event ambiguous.
      *   **New Event:** "State is 1 or 6".
      *   P1 Partition: $\{1,2,3,4\}$ vs $\{5,6,7,8\}$.
      *   P2 Partition: $\{1,2,5,6\}$ vs $\{3,4,7,8\}$.
      *   State 1: P1 sees $\{1..4\}$ ($P=0.25$). P2 sees $\{1,2,5,6\}$ ($P=0.5$).
      *   **Add Biased Prior to P1:** "State 1 is 90% likely within any set."
      *   P1 says 0.9. P2 says 0.5.
      *   They announce. They cannot reconcile the numbers because the mapping from Number $\rightarrow$ Partition Cell is broken by the hidden prior.
      *   **Result:** They oscillate or fail to claim the Consensus Bonus.
      *   **Debrief Reveal:** Show the Prior Cards. "You couldn't agree because you weren't starting from the same world."

  ## Part 4: Variant 2 — The No-Trade Theorem (10 Minutes)

  **The Setup:**
  Run a standard round until they converge on a probability (e.g., $P(E) = 0.5$).
  **The Offer:**
  "I will act as the House. I offer a bet: Pay 0.5 chips now, receive 1.0 chip if $E$ is true."
  (Expected Value = 0 for a risk-neutral agent).
  **The Twist:**
  Before they accept, hand out **Endowment Cards**.
  *   **Player 1:** "You already win 10 chips if $E$ is TRUE." (Long $E$)
  *   **Player 2:** "You already win 10 chips if $E$ is FALSE." (Short $E$)
  *   **Players 3 & 4:** No endowment.
  **The Question:** "Who takes the bet?"
  **The Outcome:**
  *   P3 & P4 (Neutral): Indifferent.
  *   P1 (Long $E$): Already exposed to $E$. Taking the bet increases risk. **Declines.**
  *   P2 (Short $E$): Already exposed to $\neg E$. Taking the bet **hedges** their risk. **Accepts.**
  **The Lesson:** We agreed on the *probability* (Aumann), but we still traded because of *risk exposure* (Milgrom-Stokey boundary conditions). Agreement on belief $\neq$ Agreement on action.

  ---

  # Debrief Guide (30 Minutes)

  ### 1. Mapping the Mechanics (10 mins)
  Draw the 8-state grid on the whiteboard.
  *   **State Space ($\Omega$):** The 8 numbers.
  *   **Event ($E$):** The shaded region (1-4).
  *   **Prior:** The initial assumption of uniformity (Variant 1 broke this).
  *   **Partition:** The cards they held. "You didn't see the state, you saw the *cell*."
  *   **Posterior:** The number they announced.
  *   **Common Knowledge:** "When P1 announced 0.75, it wasn't just that P2 *heard* it. It was that P1 *knew* P2 heard it, and P2 knew P1 knew..."
  *   **The Stop:** "Why did we stop at Round 2? Because the announcements stopped conveying new information. The intersection of our cells was a single state. Further talk would be redundant."

  ### 2. Limitations & Failure Modes (10 mins)
  Be honest about where the game diverges from the math.
  *   **Rationality Enforcement:** In the game, I gave you a cheat sheet to calculate updates. In reality, humans are bounded rational.
      *   *What to say:* "The theorem assumes logical omniscience. If you miss the inference that '0.75 implies Group A', the chain breaks."
  *   **The 'Average' Mistake:** Expect someone to say "I just averaged our numbers."
      *   *Correction:* "Averaging is a heuristic. Aumann updating is *intersection*. If I say 100% and you say 0%, the average is 50%, but the truth is we've identified an impossibility or a specific state. Don't average; intersect."
  *   **Discrete vs. Continuous:** We used 8 states. Real life is continuous. The theorem holds, but the 'rounds' might be infinite (convergence in the limit).

  ### 3. Handling the "Perfect Bayesian" Objection (5 mins)
  **The Objection:** "This only works because you made us perfect calculators. Real people can't compute partitions over huge state spaces."
  **The Answer:** **Scott Aaronson's Complexity Bound (2005).**
  *   **The Result:** Two Bayesians can agree to within $\pm \epsilon$ by exchanging only $O(1/\epsilon^2)$ bits of information.
  *   **The Kicker:** This bound is **independent of the size of the state space**.
  *   **Why it matters:** Even if the world has a billion states, you don't need a billion rounds to agree. You need enough bits to narrow down the probability. The bottleneck isn't the *math*, it's the *Common Prior*. If you have the prior, agreement is computationally cheap. If you don't (Variant 1), no amount of computation helps.

  ### 4. Predictable Failure Modes (5 mins)
  *   **The Anchor:** One person refuses to move from their Round 1 number.
      *   *Diagnosis:* They treat their private signal as truth, ignoring the *fact of disagreement* as information. They violate "Common Knowledge of Rationality."
  *   **The Arithmetic Break:** Round 3 numbers don't match due to calculation error.
      *   *Diagnosis:* Remind them that in the theorem, "Agreement" is asymptotic. In the game, it's discrete. Small errors propagate.
  *   **The "Liar":** Someone matches the number just to get the Consensus Bonus without updating.
      *   *Diagnosis:* This breaks the "Truthful Reporting" assumption. The theorem requires that the announcement *is* the posterior, not a strategic move. (Though interestingly, there are mechanism design variants where truth-telling is incentivized).

  ---

  # Preparation Checklist

  1.  **Print 4 sets of Partition Cards** (P1, P2, P3, P4 definitions).
  2.  **Print 1 "Biased Prior" Card** for Variant 1.
  3.  **Print 4 "Endowment Cards"** for Variant 2.
  4.  **Print "Cheat Sheets"** with the probability calculations for each cell (to save time during play).
      *   *Example:* "If you are P1 and have Group A, your Round 1 number is 0.75."
      *   *Wait, if you give them the number, they don't calculate.*
      *   *Better:* Give them the **Sets** and let them count. It takes 30 seconds and feels more "real".
  5.  **Whiteboard:** Draw the 1-8 grid beforehand.
  6.  **Chips:** 50 poker chips total.

  # Facilitator Script Snippet (For the "Broken Prior" Reveal)
  *"You failed to claim the bonus. You were all rational. You all saw the numbers. Why didn't you converge? Look at your Prior Cards. P1, read yours. P2, read yours. You were speaking different languages. Aumann's theorem isn't 'Rational people agree.' It's 'Rational people **with the same starting point** agree.' Without the common prior, disagreement is not just possible; it's permanent."*
