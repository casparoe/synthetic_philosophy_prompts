          *   2. *Structural Homogeneity:* The theories must be compatible with the decision rule (e.g., all must be maximizable).
          *   3. *Coherence:* The meta-decision rule shouldn't violate the core commitments of the high-probability theories (e.g., don't violate a rights constraint just because utilitarianism has 51% probability).

