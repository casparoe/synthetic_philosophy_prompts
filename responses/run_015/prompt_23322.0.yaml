      *   **Student Misconception:** Thinking they can just weight verdicts (0 or 1, or scores) and sum them up.
      *   **Required Output:** Explain *why* EMV is conceptually unstable in this context, propose alternative conceptual architectures (probability over value functions, rankings, meta-ethical disagreement), and stay at the level of conceptual architecture (not a literature survey).
      *   **Goal:** Clarify what must be true for a decision procedure to be more than a heuristic.

  2.  **Initial Analysis & Key Concepts:**
      *   *Intra-theoretic uncertainty:* "I'm a utilitarian, but I don't know if this act will cause more pain or pleasure." (Uncertainty about empirical facts or complex applications of a single standard).
      *   *Inter-theoretic uncertainty:* "I'm 60% sure utilitarianism is true, 40% sure deontology is true." (Uncertainty about the standard itself).
      *   *The Problem of Intertheoretic Comparison:* Utilitarianism outputs "utils." Deontology outputs "permissible/impermissible" or "rights violations." Virtue Ethics outputs "virtuous/vicious." You can't add utils to rights violations.
      *   *The Student's Error:* Treating moral verdicts as if they are cardinally measurable and intertheoretically comparable on a single scale without justification.
      *   *Conceptual Architecture:* Need to discuss measurement theory, the nature of moral properties, and decision theory under structural uncertainty.

  3.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the intuition that the "weighted sum" approach is often too simplistic. Define the two types of uncertainty clearly.

      *   **Section 1: The Two Types of Uncertainty:**
          *   *Intra-theoretic:* Uncertainty about the *input* (facts) given a fixed *function* (theory). Like knowing the formula $y=mx+b$ but not knowing $x$.
          *   *Inter-theoretic:* Uncertainty about the *function* itself. Is it $y=mx+b$ or $y=ax^2+c$?
          *   *Why it matters:* Intra-theoretic uncertainty can usually be handled by standard expected utility theory (EUT). Inter-theoretic is harder.

      *   **Section 2: The Instability of Expected Moral Value (EMV):**
          *   This is the core critique.
          *   *The Currency Problem:* Utilitarianism = cardinal, interpersonally comparable (maybe). Deontology = binary or lexical. Virtue = aretaic.
          *   *The Zero Point/Scale Problem:* Even if two theories are cardinal (e.g., hedonic utilitarianism vs. preference utilitarianism), does 10 hedons = 10 preference units? Without a "moral meter," the ratio is arbitrary.
          *   *The Structural Problem:* Some theories aren't maximization theories. Deontology has constraints. You can't "maximize" rights adherence in the same way you maximize welfare. A weighted sum implies trade-offs that one theory might forbid *in principle*.
          *   *Conclusion on EMV:* It assumes a "master currency" (a super-theory) which defeats the purpose of being uncertain between the theories.

      *   **Section 3: Alternative Conceptual Architectures:**
          *   *Option A: Probability over Value Functions (Measurement Theory approach).* Acknowledge that we need a normalization procedure. Discuss "variance normalization" or "range normalization" (briefly, as concepts, not lit review). The key is establishing a *common scale* before weighting.
          *   *Option B: Probability over Preference Rankings (Ordinal approach).* Instead of scores, look at orderings. Theory A says $x > y$. Theory B says $y > x$. We can use voting theory (Borda count, Condorcet) rather than utility summation. This avoids cardinality issues but introduces cycling problems.
          *   *Option C: Meta-Ethical/Structural Disagreement.* The deepest level. Maybe the disagreement isn't about *which* act is best, but *what kind of question* "What should I do?" is. Is it a calculation? A deliberation on identity? A listening exercise? If the theories define the *activity* of choosing differently, a unified decision procedure might be category error.

      *   **Section 4: Conditions for a Non-Heuristic Procedure:**
          *   What makes it rigorous?
