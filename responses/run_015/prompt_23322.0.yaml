answer: |-
  This is a crucial distinction for a graduate seminar, and your intuition is correct: the move from "I am uncertain about the facts" to "I am uncertain about the theory" is not merely a shift in parameters, but often a shift in the logical type of the problem. When your students propose a simple weighted sum of moral verdicts, they are implicitly assuming a **univocal moral ontology** that the competing theories explicitly deny.

  Below is a conceptual breakdown designed to help you structure this seminar session. It avoids surveying specific authors and focuses on the architectural requirements of decision-making under moral uncertainty.

  ---

  ### 1. The Core Distinction: Parameter Uncertainty vs. Functional Uncertainty

  To clarify the distinction for your students, it is helpful to borrow from decision theory and modeling.

  **Intra-theoretic Uncertainty (Parameter Uncertainty):**
  Here, the moral agent accepts a specific moral function $M$, but is uncertain about the inputs $x$.
  *   *Structure:* $M(x) = v$. The agent knows the mapping rule but is unsure about the state of the world $x$.
  *   *Example:* A utilitarian is unsure whether a policy will save 100 lives or 1,000 lives.
  *   *Decision Procedure:* Standard Expected Utility Theory (EUT) applies seamlessly. The agent maximizes expected value relative to the fixed function $M$.

  **Inter-theoretic Uncertainty (Functional Uncertainty):**
  Here, the agent is uncertain about the function $M$ itself.
  *   *Structure:* Is the rule $M_1(x)$, $M_2(x)$, or $M_3(x)$?
  *   *Example:* The agent is 50% sure the right rule is Utilitarianism ($M_1$) and 50% sure it is Kantian Deontology ($M_2$).
  *   *Decision Procedure:* This requires a **meta-decision rule**. The students' proposal (weighted sum) is one such rule, but it is only valid if specific structural conditions are met.

  ### 2. Why Expected Moral Value (EMV) is Conceptually Unstable

  The students' proposal is to calculate the Expected Moral Value of an act $A$ as:
  $$EMV(A) = \sum p(T_i) \cdot V_{T_i}(A)$$
  Where $p(T_i)$ is the credence in theory $T_i$ and $V_{T_i}(A)$ is the value Theory $i$ assigns to Act $A$.

  This formulation is unstable for two architectural reasons: **Measurement Incommensurability** and **Structural Heterogeneity**.

  #### A. The Measurement Problem (Different Currencies)
  For the summation above to be mathematically meaningful, the output of $V_{T_i}(A)$ must be **cardinally measurable** and **intertheoretically comparable**.

  1.  **Arbitrary Scaling:** Suppose Theory 1 (Hedonic Utilitarianism) assigns values in "hedons" (range 0–10) and Theory 2 (Preference Utilitarianism) assigns values in "satisfaction units" (range 0–1,000,000). If you simply plug these numbers in, Theory 2 will dominate the calculation simply because its numbers are larger, not because it is more plausible. To fix this, you need a normalization rule. But normalization requires a "view from nowhere"—a neutral metric to judge the intensity of values across theories. If you had that metric, you would essentially have a third, super-theory, rendering the uncertainty moot.
  2.  **Ordinal vs. Cardinal:** Virtue Ethics might not assign values at all; it might assign rankings (Better/Worse) or categories (Virtuous/Vicious). You cannot sum an ordinal ranking with a cardinal utility score. To do so is a category error.
  3.  **The Zero-Point Problem:** In standard decision theory, utility functions are unique only up to positive linear transformation. Theory 1 might set the "zero" point at neutral welfare, while Theory 2 sets it at the absence of rights violations. Without a shared zero point, adding the values is like adding Celsius temperature to inches of length.

  **Conceptual Takeaway:** The EMV formulation assumes a **common moral currency** exists. If the theories disagree on what *value is* (welfare vs. duty vs. character), there is no common currency. Using EMV smuggles in a hidden meta-ethical commitment to value monism.

  #### B. The Structural Problem (Different Decision Rules)
  Even if you could solve the currency problem, the theories may prescribe different *logics of choice*.

  1.  **Maximization vs. Constraints:** Utilitarianism is a **maximizing** theory (choose the act with the highest $v$). Deontology is often a **constrained** theory (choose any act within the permissible set, regardless of optimization).
      *   *The Conflict:* If you assign a 51% probability to Utilitarianism and 49% to Deontology, a weighted sum might recommend violating a right if the welfare gain is high enough. But for the Deontological component, that act is *forbidden*, not just "less valuable." The EMV procedure treats the deontological constraint as a *cost* to be traded off, whereas the theory treats it as a *boundary* that cannot be crossed.
  2.  **Act vs. Agent:** Virtue Ethics evaluates the *agent*, not the *act*. An act might produce good consequences (Utilitarian win) and violate no rules (Deontological win) but be done for a vicious motive (Virtue Ethics loss). The "value" of the act is not the primary locus of evaluation. Summing verdicts about acts ignores the theory that says "the act is the wrong unit of analysis."

  **Conceptual Takeaway:** When theories disagree on the *decision rule* (maximize vs. satisfy constraints vs. cultivate character), a meta-decision rule that forces them all into a maximization framework (like EMV) distorts the content of the theories themselves.

  ### 3. Alternative Conceptual Architectures

  If the simple weighted sum is unstable, how else can we model moral uncertainty? Here are three architectural alternatives.

  #### A. Probability Over Value Functions (with Normalization)
  This approach accepts the EMV framework but acknowledges the need for a **normalization procedure** to make values comparable.
  *   **Concept:** Before weighting, each theory's value function is transformed to a common scale (e.g., 0 to 1, or mean 0 variance 1).
  *   **Requirement:** This requires a justification for *why* a specific normalization is morally neutral. (e.g., "We treat the range of possible moral value as equal across theories").
  *   **Limit:** This still assumes all theories are cardinal and maximizing. It fails if one theory denies cardinality or maximization.

  #### B. Probability Over Preference Rankings (Social Choice Approach)
  Instead of summing *values*, we aggregate *orderings*.
  *   **Concept:** Treat each moral theory as a "voter" and each act as a "candidate." Theory A ranks Act $x$ above Act $y$. Theory B ranks $y$ above $x$. We use a voting rule (e.g., Borda Count, Condorcet Method) to determine the moral choice.
  *   **Advantage:** This avoids the currency problem. We don't need to know *how much* better $x$ is than $y$, only *that* it is better. This accommodates ordinal theories (like some forms of Virtue Ethics).
  *   **Limit:** It is vulnerable to voting paradoxes (cycling, intransitivity) and still struggles with theories that refuse to rank acts (e.g., "both are permissible").

  #### C. Meta-Ethical Disagreement (The "Question" Mismatch)
  This is the most radical architectural shift. It posits that inter-theoretic uncertainty is not just uncertainty about answers, but uncertainty about **what question is being asked**.
  *   **Concept:**
      *   Theory 1 asks: "Which act produces the best state of affairs?"
      *   Theory 2 asks: "Which act respects the status of persons?"
      *   Theory 3 asks: "Which act expresses a virtuous character?"
  *   **Implication:** These are not competing answers to the *same* question; they are competing definitions of the *moral task*.
  *   **Decision Procedure:** A decision procedure here cannot be a calculation. It must be a **deliberative protocol**. The agent must decide which *mode of deliberation* to adopt. This looks less like risk management and more like identity formation or practical wisdom (*phronesis*). The "probability" assigned to a theory represents the agent's inclination to adopt that mode of engagement with the world.

  ### 4. Conditions for a Non-Heuristic Decision Procedure

  To move your students beyond heuristics, they must be able to defend the following three conditions for any proposed meta-decision rule (like EMV):

  1.  **Intertheoretic Comparability Justification:**
      They must explain *what makes it the case* that 1 unit of Value in Theory A is equivalent to 1 unit of Value in Theory B. Is this a conceptual truth? An empirical claim? If they cannot specify the "exchange rate," their weighted sum is arbitrary.

  2.  **Structural Compatibility:**
      They must show that the meta-decision rule does not violate the core operational logic of the object-level theories. If a theory posits inviolable constraints, the meta-rule cannot allow those constraints to be overridden by probability weighting unless the meta-rule claims authority *over* the object-level theories (which returns us to the "super-theory" problem).

  3.  **Invariance:**
      The verdict of the decision procedure should not change based on irrelevant mathematical transformations of the input theories. If multiplying the utility scale of Theory A by 10 changes the recommended act, the procedure is unstable. A rigorous procedure must be invariant under admissible transformations of the component theories.

  ### Summary for the Seminar

  You can conclude the session with this synthesis:

  Uncertainty over moral facts (intra-theoretic) is a problem of **epistemology within a framework**. Uncertainty over moral theories (inter-theoretic) is a problem of **measurement and structure across frameworks**.

  The "Expected Moral Value" approach is only valid if we assume all moral theories are secretly speaking the same language (cardinal, maximizing, comparable). If we take the theories at their word—that they disagree on the currency of value and the logic of choice—then moral uncertainty is not a risk calculation. It is a negotiation between incommensurable conceptual schemes. A rigorous decision procedure must therefore either establish a neutral metric (which is philosophically costly) or adopt a non-aggregative method (like voting or deliberative protocols) that respects structural differences.
