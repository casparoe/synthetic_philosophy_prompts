  ### Debrief: Mapping Activity to Argument
  1.  **The Photon Pact $\rightarrow$ Invariance of $c$.**
      *   *Resistance:* "Light should behave like a ball." (Ether Theory).
      *   *Cost:* You lose the explanation for the Michelson-Morley null result and break Maxwell's equations.
  2.  **The Midpoint Flash $\rightarrow$ Definition of Simultaneity.**
      *   *Resistance:* "Simultaneity is absolute, you just measured it wrong." (Presentism).
      *   *Cost:* You must posit a privileged frame (Alice's). Why is Alice privileged? She's just standing on the floor.
  3.  **The Beep Discrepancy $\rightarrow$ Relativity of Simultaneity.**
      *   *Resistance:* "It's just signal delay."
      *   *Cost:* The Judges corrected for signal delay. The disagreement remains in the *calculated* time of the events.
  4.  **The 4-Day Derivation $\rightarrow$ No Privileged Present.**
      *   *Resistance:* "Only my 'Now' is real." (Solipsism/Ego-centric Presentism).
      *   *Cost:* Physics becomes subjective. The invasion of Andromeda (Penrose's example) is either launched or not depending on whether I walk to the shop or stay home.

  ### What Predictably Goes Wrong
  1.  **Photon Cadence:** The "Light" students will speed up when "thrown" by the walking Bob.
      *   *Fix:* The Instructor acts as the Metronome. Loud claps. Photons must step on the clap.
  2.  **Bob's Speed:** Bob will walk too fast, making $v$ close to $c$, or too slow, making $\Delta t$ unmeasurable.
      *   *Fix:* Tape footprints on the floor for Bob to hit on specific beats.
  3.  **The "Real" Calculation:** Students will get lost in unit conversions (light years to meters).
      *   *Fix:* Provide the distance in meters on the Constant Card.
  4.  **Giggling:** It looks silly to walk in sync.
      *   *Fix:* Frame it as a "Ritual." Serious tone.

  ### What The Activity Can't Reproduce (Your Hand-Waving Duties)
  1.  **Length Contraction:** We didn't shrink the room for Bob.
      *   *Supply:* Explain that in a real relativistic scenario, Bob would measure the room as shorter, which *also* contributes to the disagreement, but the simultaneity shift is the dominant factor for the Andromeda paradox.
  2.  **Time Dilation:** Bob's watch didn't actually slow down.
      *   *Supply:* Acknowledge this. "We isolated the simultaneity effect. In reality, Bob's clock also ticks slower, but that doesn't fix the disagreement on 'Now'."
  3.  **The Geometry of Spacetime:** We used a flat floor.
      *   *Supply:* Draw the Minkowski diagram on the board *after* the activity to show the "tilted axis" they just enacted.

  ### The "Block Universe" Reveal (Last 10 Minutes)
  "Today you proved that 'Now' is not a universal slice. It is a personal slope. If Andromeda's 'present' changes by days depending on your walking speed, then 'the present' cannot be the only thing that exists. The past, present, and future on Andromeda must all be equally real, waiting for your angle of observation to slice through them. That is the Block Universe."
