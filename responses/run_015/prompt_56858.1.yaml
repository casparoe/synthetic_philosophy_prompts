answer: |-
  ### The Snag: Enforcing Invariant Speed with Bodies
  You cannot enforce the invariance of $c$ with Newtonian objects (balls, cars, thrown chalk). A ball thrown by a running student *will* inherit their velocity. To solve this, you must decouple the "light" from kinematics and bind it to **rhythm**.

  **The Solution: The Photon Pact.**
  Select specific students to be "Photons." Give them a metronome (phone app) set to 60 BPM (1 beat/sec). Their instruction is not "walk fast," but "step on the beat."
  *   **Rule 1:** A Photon must take exactly one step per beat, regardless of who "emitted" them.
  *   **Rule 2:** If the emitter is running, the Photon does *not* run. They start at 1 step/beat immediately.
  *   **Rule 3:** If they collide, they stop, but they do not change their cadence when they resume.

  This enforces $c$-invariance by **social contract** rather than physics. It feels artificial for about 30 seconds, but once the activity starts, the *consequences* of that rule (the disagreement on time) override the artificiality. You are not simulating the *mechanism* of light; you are simulating the *constraint* of light.

  ---

  ### Materials
  *   **Floor Tape:** To mark "Earth" (0m), "Andromeda" (10m), and "Midpoint" (5m).
  *   **Metronome App:** Projected on screen or loud speaker (60 BPM).
  *   **Colored Vests/Bibs:**
      *   **Red (2 students):** Photons.
      *   **Blue (2 students):** Observers (Alice & Bob).
      *   **Green (2 students):** Clock Keepers (one at Earth, one at Andromeda).
      *   **White (10 students):** Data Judges (split into Team Alice and Team Bob).
  *   **Stopwatches:** 4 phones (one for each Clock Keeper, one for Alice, one for Bob).
  *   **Constant Cards:** Handout with Real $c$ ($3 \times 10^8$ m/s) and Real Distance to Andromeda ($2.5 \times 10^6$ light years).
  *   **Clipboard & Data Sheets:** For the Judges.

  ---

  ### Roles (16 Students)
  1.  **Alice (Blue 1):** Stationary Observer. Stands at Earth (0m).
  2.  **Bob (Blue 2):** Moving Observer. Walks at a steady slow pace (0.2 m/s) from Earth toward Andromeda.
  3.  **Photons (Red 1 & 2):** Human Light Pulses. Must walk exactly 1 meter per second (1 step/beat).
  4.  **Clock Keepers (Green 1 & 2):** Stand at Earth and Andromeda. Hold stopwatches. They only start/stop their watches when a Photon touches their shoulder.
  5.  **Data Judges (White 1-10):**
      *   **Team Alice (5 students):** Record times for Alice's frame.
      *   **Team Bob (5 students):** Record times for Bob's frame.
      *   *Task:* Measure the walking speed of Bob ($v$) and the Photon ($c$) using tape measures and phones before the main event.

  ---

  ### Timeline (90 Minutes)

  #### 00:00 – 00:10: The Setup & The Pact
  *   Tape the floor: Earth (0m), Midpoint (5m), Andromeda (10m).
  *   Assign roles.
  *   **Crucial Instruction to Photons:** "You are not students anymore. You are Light. Your speed is fixed by the universe (the metronome). If Alice throws you, you walk at 1 step/beat. If Bob throws you while running, you *still* walk at 1 step/beat. Do not help the throw. Do not lag."
  *   **Crucial Instruction to Judges:** "Your job is to measure reality. Measure how fast the Photons walk ($c_{model}$). Measure how fast Bob walks ($v_{model}$). Write these down."

  #### 00:10 – 00:30: Calibration (Measuring the Constants)
  *   **Trial 1:** Alice sends Photon 1 to Andromeda. Judges time it. Calculate $c_{model}$. (Target: 1 m/s).
  *   **Trial 2:** Bob walks from Earth to Andromeda. Judges time him. Calculate $v_{model}$. (Target: 0.2 m/s).
  *   **Verification:** Confirm $c_{model}$ is the same regardless of who "sent" the Photon. (Have Bob "emit" a Photon while walking; Judges verify the Photon's speed relative to the floor is still 1 m/s).
  *   *Philosophical Note:* Do not explain *why*. Just establish it as a rule of this classroom universe.

  #### 00:30 – 00:50: The Synchronization (The "Now" Slice)
  *   **Alice's Frame:**
