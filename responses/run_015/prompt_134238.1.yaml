prompt: |-
  I should say at the outset that I have no academic background in any of this. I left school at eighteen and have worked in freight logistics ever since; for about three years now I have been reading about animal sentience and population ethics on my own in the evenings, mostly online. A long post I wrote on a forum about the scale argument for taking insect suffering seriously somehow got me invited to give a talk, and I have agreed before fully taking in what I agreed to.

  The argument as I understand it is the familiar one: even if the probability that an insect feels anything at all is small, the numbers are so vast that the multiplication everyone performs — probability times population — yields an expected quantity of suffering large enough to dwarf the considerations we normally treat as decisive, so anyone who takes expected value seriously ought to weight insect deaths heavily, which in practice means caring a great deal about how our food is produced.

  The wrinkle I have been turning over is this. Every version I have read seems to count only what I have started calling the killing term: the insects killed by pesticides, by harvest machinery, by traffic, by land clearing. But if you are going to take the multiplication seriously, you also have to count what I call the creation term: the insects whose existence is caused by the farming system itself — the pest populations that monocultures and irrigation and fertiliser allow to reach densities the same land would not otherwise support, the herbivores that exist because we plough and plant rather than because the land lies fallow or under forest. My rough claim is that this second term is at least as large as the first, and probably much larger, and that almost nobody writing about this seems to put it in the sum.

  If that is right, the scale argument does not deliver the conclusion people usually draw from it. Once the insects your food brings into existence outnumber the insects it kills, the sign of the comparison is set by whether an insect's life is on balance worth living, not by how many of them die. If those lives are net-negative, then the creation term makes arable farming look far worse than the killing term alone would suggest, and the policy implication is not to avoid insect deaths but to reduce insect population turnover. If they are net-positive, the same arithmetic makes intensively farmed cropland look better than the alternatives on the insect ledger. Either way the huge numbers tell you the size of the stake, not the direction of the bet.

  The audience is a research group attached to a veterinary school, around twenty people. Six or seven are animal welfare scientists who work on pain and affect indicators in farmed vertebrates; they want measures that can be turned into a protocol, and they are impatient with arguments that cannot. Three are entomologists — one works on pest population dynamics in arable systems, one on insect neurobiology — who regard the sentience question as premature and will resist anything that looks like quietly counting insects as moral patients. There is a farm-animal veterinarian, two philosophers of science who will care about what would count as evidence for a claim like mine and whether it is testable at all, and the agricultural economics PhD student who invited me, who is sympathetic to the effective altruism framing and will want to know what anyone is supposed to do on Monday morning. I have twenty-five minutes and then, I am told, a lively twenty minutes of questions.

  What I would like from you is a preparation sheet for that question period. Specifically: what I should concede in the first two minutes so that the room does not quietly decide I am a crank; the objections in roughly the order they will arrive, who will raise each one and in whose vocabulary, how much damage each actually does to my claim, and which ones I should simply give up rather than fight; for each, a reply of about ninety seconds and a note on where that reply is softest. Include the question I am hoping nobody asks — my own candidate is that if what matters is insect population turnover, then the cheapest way to reduce it is to make land incapable of supporting insects at all, but I suspect you will find a worse one. I have no journal access and cannot check paywalled papers, so please do not build the sheet around studies I would have to go and read; if a point depends on a specific empirical result, mark it as something I should say plainly that I have not verified.

  Please take a definite position rather than laying out the options for me to choose between. In particular, tell me directly whether the killing term / creation term distinction is a real point or merely a confusion on my part — a double count, perhaps, or a commitment to total rather than person-affecting population ethics that I have smuggled in without noticing — and if it is a confusion, tell me what I should argue instead, because I would much rather find that out now than in front of an entomologist who studies aphid population dynamics for a living. If I can defend only one of my claims and must demote the rest to asides, tell me which one that should be. And please mark which parts of what you tell me about insect ecology you are reasonably confident in and which you would abandon the moment someone in that room contradicted them, since I have no way of telling the difference myself.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation sheet:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Non-academic background (freight logistics), self-taught in animal sentience/population ethics (3 years), invited to speak at a veterinary school research group due to a forum post.
      *   **Task:** Prepare a "preparation sheet" for the Q&A session of a 25-minute talk.
      *   **Core Argument:** The "Scale Argument" for insect suffering usually focuses on the *killing term* (deaths caused by farming). The user argues for adding a *creation term* (insects brought into existence by farming practices). If lives are net-negative, farming creates more suffering by creating insects than by killing them. If net-positive, farming might be good for insects. The conclusion is that the sign depends on life quality, not just death counts.
      *   **Audience:** 20 people. Mixed: Animal welfare scientists (want protocols), Entomologists (skeptical of sentience/counting), Vet (practical), Philosophers of Science (evidence/testability), Ag Econ PhD (sympathetic but wants action).
      *   **Constraints:** 25 min talk + 20 min Q&A. No journal access (avoid paywalled specifics). Take a definite position (don't hedge). Identify the strongest claim to defend. Mark confidence levels on ecological facts.
      *   **Specific Request:** What to concede immediately, order of objections (who raises what), damage assessment, 90-second replies, weak points in replies, the "worst question" (worse than the sterilization/land-barring one).

  2.  **Evaluate the Core Argument (Killing vs. Creation Term):**
      *   *Is it a confusion?* It's not a double count *if* framed correctly within Total Utilitarianism (or similar totalist views). However, it relies heavily on the Asymmetry Problem in population ethics.
      *   *The Trap:* If the user argues "we create insects, therefore we are responsible for their suffering," they are assuming a *Total View* (existence adds value/disvalue). If they argue "we kill insects, therefore we cause suffering," they are assuming a *Person-Affecting View* (harming existing beings). Mixing them without acknowledging the ethical shift is dangerous.
      *   *Ecological Reality:* Does farming *create* more insects than wild land? Generally, monocultures reduce biodiversity but can increase biomass of specific pest species. Wild land (forest/grassland) usually has higher total insect biomass and diversity than arable land, *except* in cases of extreme pest outbreaks fueled by monoculture.
      *   *Verdict:* The distinction is conceptually valid *within* population ethics, but empirically shaky regarding the "creation" claim (does farming actually increase total insect numbers compared to the counterfactual wild state?).
      *   *Strategy:* I need to tell the user that the *ethical* distinction is real, but the *empirical* claim (farming creates more insects than it displaces) is likely false or highly uncertain. Defending the ethical framework is safer than defending the ecological math.
      *   *Strongest Claim:* The *structure* of the argument (that population ethics dictates the sign, not just mortality) is the philosophical contribution. The specific claim that farming *increases* insect numbers is the weak link.
      *   *Decision:* I will advise the user to pivot. The "Creation Term" is valid ethics, but the empirical assumption that farming *net increases* insect populations compared to the counterfactual (wild/rewilded) is likely wrong. The stronger point is that *uncertainty* about life quality makes the scale argument indeterminate.

  3.  **Drafting the Preparation Sheet - Section by Section:**

      *   **Opening Concession (2 mins):** Need to establish credibility. Acknowledge lack of formal training. Acknowledge the speculative nature of sentience. Acknowledge the counterfactual problem (what would be there if we weren't farming?).
      *   **Objection 1: The Counterfactual (Entomologist/Ecologist).** "Farming reduces insect biomass compared to wild land."
          *   *Damage:* High. Destroys the "creation term" magnitude.
          *   *Reply:* Concede uncertainty. Focus on the *ethical structure* regardless of the empirical sign.
          *   *Weakness:* If farming reduces numbers, the "creation" argument flips back to the standard "killing is bad" view.
      *   **Objection 2: Sentience Probability (Neurobiologist).** "Insects don't feel pain like vertebrates."
          *   *Damage:* Medium. Reduces the probability weight ($P$).
          *   *Reply:* Precautionary Principle. Expected value still holds if $N$ is huge enough.
          *   *Weakness:* If $P$ is effectively zero, EV is zero.
      *   **Objection 3: Population Ethics (Philosopher).** "Total View vs. Person-Affecting."
          *   *Damage:* High (Conceptual).
          *   *Reply:* Explicitly adopt Total View for the sake of argument (as scale arguments usually do).
          *   *Weakness:* Many find Total View repugnant.
      *   **Objection 4: Actionability (Welfare Scientists/Vet).** "What do we do?"
          *   *Damage:* Low (Practical).
          *   *Reply:* Research priority, not immediate protocol.
          *   *Weakness:* Frustrates the "Monday morning" crowd.
      *   **Objection 5: The "Worse Question" (Ag Econ/Effective Altruist).** "Sterilization/Extinction."
          *   *The User's Candidate:* Make land barren.
          *   *My Candidate:* "Why not just exterminate insects globally if lives are net negative?" (The Benatar Asymmetry applied globally).
      *   **Confidence Marking:** Need to be very clear about what is ecological fact vs. ethical theory.

  4.  **Refining the Position (Taking a Stand):**
      *   The user asked: *Is the killing/creation distinction real or a confusion?*
      *   *My Verdict:* It is **not a confusion**, but it is **empirically precarious**. It relies on the "Total View" of population ethics. Most standard animal welfare ethics is "Person-Affecting" (harming existing individuals). The user is smuggling in Total Utilitarianism.
      *   *Advice:* Own the Total View. Don't pretend it's standard welfare science.
      *   *Strongest Claim:* The *indeterminacy* of the scale argument due to life-quality uncertainty.
      *   *Ecological Fact Check:* Does farming create more insects? Generally, no. Natural ecosystems have higher biomass. Monocultures have high *density* of specific pests, but lower total diversity/biomass than forests/grasslands. I must warn the user here.

  5.  **Developing the Q&A Scenarios:**
      *   *Entomologist:* Will attack the biomass claim.
      *   *Neurobiologist:* Will attack the sentience claim.
      *   *Philosopher:* Will attack the population ethics framework.
      *   *Welfare Scientist:* Will attack the measurability.
      *   *Ag Econ:* Will attack the feasibility.

  6.  **Addressing the "Worse Question":**
      *   User suggests: "Make land incapable of supporting insects."
      *   Worse version: "If insect lives are net negative, shouldn't we aim for the painless extinction of all insects?" (This follows logically from the Total View + Net Negative premise). This is the "Benevolent World Exploder" argument.

  7.  **Review against Constraints:**
      *   No journal access? Keep citations general or mark as "verify."
      *   Definite position? Yes, I will tell them the distinction is ethically valid but empirically risky.
      *   Confidence marking? Yes, will use [High Confidence] / [Low Confidence].
      *   Tone: Respectful, direct, practical for a non-academic.

  8.  **Final Polish:**
      *   Ensure the "Opening Concession" is humble but firm.
      *   Ensure the replies are timed (approx. 90 seconds spoken).
      *   Highlight the "Soft Spot" in every reply.
      *   Make sure the distinction between *Total View* and *Person-Affecting* is clear, as this is the philosophical crux.

  **(Self-Correction during drafting):** I initially thought about telling them to drop the creation term. But the prompt asks me to take a position on whether it's a confusion. It's *not* a confusion logically, but it shifts the ethical framework. I should advise them to frame it as "The Scale Argument is incomplete without Population Ethics," rather than "Farming creates more insects." The latter is likely ecologically false. I will steer them toward the ethical incompleteness rather than the ecological magnitude.

  Wait, looking closer at the prompt: "Tell me directly whether the killing term / creation term distinction is a real point or merely a confusion."
  Okay, I need to be decisive. It is a **real point** within Total Utilitarianism, but it is **not standard animal welfare ethics**. I will advise them to own the Total View explicitly.
  However, the *empirical* claim that farming *increases* insect numbers relative to the counterfactual (wild land) is likely **false**. I need to make sure the user doesn't get crushed on the ecology. I will advise them to pivot the "creation term" to mean "the ethical weight of bringing beings into existence" regardless of whether the net number is higher than wild land, *or* concede the ecological point and focus on the *uncertainty* of the sign.
  Actually, the strongest strategic move is: "The Scale Argument fails to determine *direction* because we don't know if insect lives are net positive or negative." This sidesteps the exact biomass comparison and focuses on the *value* of the life.

  Let's refine the "Worse Question." The user's candidate is "make land barren." The worse one is "painless extinction of the species." I will use that.

  Okay, ready to write. I will structure it as a briefing document.

  *   **Position:** The distinction is ethically real (Total vs. Person-Affecting), but the empirical claim (farming increases total insect numbers vs wild) is likely false.
  *   **Strategy:** Defend the *ethical structure* (we must account for creation), concede the *ecological magnitude* (wild land might have more insects), pivot to *uncertainty of life quality*.
  *   **Strongest Claim:** The Scale Argument is indeterminate without knowing if lives are worth living.

  Let's assemble the sheet.cw
answer: |-
  # PREPARATION SHEET: Q&A STRATEGY
  **To:** Speaker
  **From:** Advisory Consultation
  **Re:** Veterinary School Research Group Talk (Insect Sentience & Scale Argument)

  ## 1. THE VERDICT ON YOUR CORE CLAIM
  **Is the Killing/Creation distinction real or a confusion?**
  It is **not a confusion**, but it is **not neutral**. It is a commitment to **Total Utilitarianism** (the view that bringing beings into existence adds moral value/disvalue) rather than **Person-Affecting Ethics** (the view that we only owe duties to beings who already exist).

  *   **The Trap:** Standard animal welfare science is Person-Affecting. They care about harming existing animals. Your argument relies on Total Utilitarianism. If you do not explicitly state this, the philosophers will catch you, and the welfare scientists will think you are talking past them.
  *   **The Empirical Risk:** Your claim that farming *creates* more insects than it kills (compared to the counterfactual of wild land) is ecologically precarious. [Confidence: High]. Arable land generally supports *less* total insect biomass than natural grasslands or forests, even if specific pest densities are higher. [Confidence: Medium-High].
  *   **Recommendation:** Do not bet the house on farming creating *more* insects than nature would. Bet on the **indeterminacy**. Your strongest claim is: *"Because we do not know if insect lives are net-positive or net-negative, the Scale Argument cannot tell us what to do, regardless of the numbers."* This is philosophically robust and ecologically safer.

  ## 2. THE OPENING CONCESSION (First 2 Minutes of Q&A)
  *Goal: Pre-empt the "crank" label by showing you understand the limits of your expertise.*

  **Say this:**
  "I want to start by conceding two points that might otherwise dominate the questioning. First, I am not an ecologist. My claim that farming systems alter insect population dynamics is a structural one, not a precise biomass calculation. If the counterfactual—wild land—supports more total insect life than arable land, my 'creation term' shrinks, but the ethical structure remains: we are still responsible for the lives we *do* cause to exist. Second, I am not claiming we have proof of insect sentience. I am claiming that if there is a non-zero probability, the numbers force the issue. I am here to discuss the ethical arithmetic, not to provide a definitive census of aphids."

  **Why:** This disarms the Entomologists (you aren't claiming to know their data better than them) and the Neurobiologists (you aren't claiming proof of pain).

  ## 3. ANTICIPATED OBJECTIONS & REPLIES

  ### Objection 1: The Counterfactual Problem (Ecology)
  *   **Who:** The Entomologist (Pest Dynamics).
  *   **Vocabulary:** "Biomass," "Counterfactual," "Baseline," "Monoculture vs. Ecosystem."
  *   **The Challenge:** "Natural ecosystems have higher insect biomass than farms. You aren't creating insects; you're replacing a diverse wild population with a smaller, pest-heavy one. Your creation term is negative."
  *   **Damage Level:** **High.** This undermines the magnitude of your "creation" claim.
  *   **90-Second Reply:** "That is a fair empirical correction, and I would defer to your data on total biomass. However, that doesn't solve the ethical problem; it just flips the sign. If wild land has more insects, then *rewilding* becomes the intervention with the highest stake. The point remains: the Scale Argument tells us the *size* of the moral stake, but without knowing if those lives are worth living, we don't know the *direction*. Whether farming creates or displaces, we are managing vast quantities of potential suffering without knowing the sign."
  *   **Soft Spot:** You are retreating from a positive claim (farming is worse) to a structural claim (we don't know). This might frustrate the Ag Econ student who wants a direction.

  ### Objection 2: The Sentience Probability (Neurobiology)
  *   **Who:** The Entomologist (Neurobiology).
  *   **Vocabulary:** "Nociception," "Central Processing," "Anthropomorphism," "Substrate."
  *   **The Challenge:** "Insects have nociceptors, not pain receptors. There is no evidence of subjective experience. Your probability $P$ is effectively zero. Multiplying by $N$ doesn't help if $P=0$."
  *   **Damage Level:** **Medium.** If $P=0$, the argument collapses.
  *   **90-Second Reply:** "I cannot prove $P$ is non-zero, and neither can you prove it is zero. We are dealing with an inference to the best explanation based on behavioral complexity. But in risk management, we don't require certainty. If the potential downside is astronomical suffering, the Precautionary Principle suggests we act even on low probabilities. I am not asking you to certify insect pain; I am asking if the *possibility* warrants more research than we currently fund."
  *   **Soft Spot:** "Risk management" is a pragmatic dodge, not a moral proof. If the room decides $P$ is negligible, they will ignore you.

  ### Objection 3: The Population Ethics Trap (Philosophy)
  *   **Who:** The Philosophers of Science.
  *   **Vocabulary:** "Total View," "Person-Affecting," "Non-Identity Problem," "Repugnant Conclusion."
  *   **The Challenge:** "You are smuggling in the Total View. Most welfare ethics is person-affecting. We don't mourn the insects we didn't create. Why should we count the 'creation term' at all?"
  *   **Damage Level:** **High (Conceptual).** This exposes the ethical engine of your argument.
  *   **90-Second Reply:** "You are correct that I am adopting the Total View. I do so because the 'Scale Argument' used by effective altruists already relies on expected value calculations that treat lives as units of value. If we only count the 'killing term,' we ignore that our agricultural systems determine *which* insects exist. If we bring beings into existence who suffer, standard intuition says we have done something wrong, even if we didn't kill them. I am making the implicit ethics of the Scale Argument explicit."
  *   **Soft Spot:** The Total View is controversial. If they reject the Total View, your "creation term" vanishes. Do not fight this; own it.

  ### Objection 4: Actionability (Welfare Science/Vet)
  *   **Who:** Animal Welfare Scientists / Veterinarian.
  *   **Vocabulary:** "Protocol," "Welfare Indicators," "Measurable," "Feasible."
  *   **The Challenge:** "This is interesting theory, but what do we measure? How do we assess insect welfare on Monday morning? If you can't give us a protocol, this is just philosophy."
  *   **Damage Level:** **Low.** They expect philosophy from you, but they want utility.
  *   **90-Second Reply:** "I cannot give you a protocol today because the basic science isn't there. We don't have validated welfare indicators for insects. My recommendation is not a protocol, but a research priority. Before we can measure welfare, we must decide if the subject is a moral patient. I am asking you to treat insect welfare as a legitimate field of inquiry, not to implement a ban on pesticides tomorrow."
  *   **Soft Spot:** This admits you have no immediate solution. The Ag Econ student may find this unsatisfying.

  ### Objection 5: The "Worse Question" (The Extinction Conclusion)
  *   **Who:** The Ag Econ PhD (Sympathetic but logical).
  *   **Vocabulary:** "Cost-benefit," "Optimization," "Intervention," "Net Negative."
  *   **The Challenge:** "If insect lives are net-negative, and the numbers are vast, the most effective way to reduce suffering isn't better farming. It's painless extinction. Why aren't you arguing for the eradication of insects?"
  *   **Damage Level:** **Critical.** This is the *reductio ad absurdum* of your position.
  *   **90-Second Reply:** "That follows logically from the Total View if lives are net-negative. However, that relies on two uncertainties: that lives are net-negative, and that we can achieve extinction without causing greater suffering in the process. Given our ignorance on both, the prudent path is reducing population *turnover* and suffering intensity, not aiming for extinction. But I concede: if we knew lives were net-negative, extinction would be the benevolent option."
  *   **Soft Spot:** Admitting that extinction *would* be benevolent if lives are net-negative is shocking to a veterinary audience. It makes you look radical.
  *   **Note:** This is indeed worse than your candidate question ("make land barren"). "Make land barren" is impractical; "Painless extinction" is the logical conclusion of your ethics.

  ## 4. CONFIDENCE MARKING ON ECOLOGICAL CLAIMS
  *Use this to gauge when to stand firm and when to yield.*

  *   **Claim:** "Insect populations are vast ($10^{18}$+)."
      *   **Confidence:** [High]. This is standard estimation.
  *   **Claim:** "Farming increases pest density compared to wild land."
      *   **Confidence:** [Medium]. True for specific pests (aphids in wheat), false for total biodiversity.
  *   **Claim:** "Farming increases *total* insect biomass compared to wild land."
      *   **Confidence:** [Low]. Most evidence suggests natural ecosystems have higher total biomass. **Do not defend this as fact.** Defend it as a possibility that *if* true, changes the ethics.
  *   **Claim:** "Insect lives are likely net-negative."
      *   **Confidence:** [Low]. This is pure speculation. r-selection species (many offspring, high death rate) suggest high suffering, but we don't know. **Frame this as the core uncertainty.**

  ## 5. STRATEGIC SUMMARY
  1.  **Defend:** The **ethical structure** (that creation matters as much as killing under Total Utilitarianism).
  2.  **Concede:** The **ecological magnitude** (you don't know if farming creates *more* insects than wild land, but it creates *some* that wouldn't exist otherwise).
  3.  **Pivot:** To **uncertainty**. The main point is that we are acting blindly on huge numbers.
  4.  **Avoid:** Trying to prove insects feel pain. Stick to "non-zero probability."
  5.  **Prepare for:** The extinction question. It is the logical end of your argument. Do not flinch, but emphasize the *risk* of being wrong about the net value of life.

  **Final Advice:** You are the outsider. Use that. You are not there to teach them entomology; you are there to show them that their current ethical calculus is incomplete. If you try to beat the entomologist on insect numbers, you lose. If you beat the philosopher on ethical consistency, you win.
