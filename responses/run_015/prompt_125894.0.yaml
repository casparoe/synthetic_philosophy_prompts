answer: |-
  1. **Mereological Novelty:** A composite object possesses properties that no proper part of it possesses in isolation.
     *Verdict:* Platitude.
     *Instance:* A square wall made of round bricks. *Non-Instance:* A pile of sand where every grain is sandy. *Examples:* Temperature/pressure (yes), Protein folding (yes).

  2. **Non-Linearity:** Aggregate behaviour is not a linear sum of the behaviours of parts in isolation, so summing part-wise predictions misleads.
     *Verdict:* Substantive but defensible.
     *Instance:* Interacting magnets where alignment amplifies field strength. *Non-Instance:* Ideal gas at low density. *Examples:* Phase transition (yes), Protein folding (yes), Natural selection (yes).

  3. **Computational Irreducibility:** The macro-behaviour is not predictable from complete knowledge of the micro-constitution plus dynamics without effectively running the system.
     *Verdict:* Contingent empirical hypothesis about particular systems.
     *Instance:* Three-body problem or turbulent fluid. *Non-Instance:* Planetary orbits in vacuum. *Examples:* Protein folding (yes), Phase transition (yes), Temperature (no).

  4. **Multiple Realizability:** The same macro-pattern is realized by wildly different micro-configurations, so the macro-description is where the stability lives.
     *Verdict:* Substantive but defensible.
     *Instance:* "Wetness" realized by H₂O or hypothetical alternative liquids. *Non-Instance:* A specific crystal lattice structure. *Examples:* Natural selection (yes), Periodic table (no, specific to protons), Temperature (yes).

  5. **Descriptive Autonomy:** The macro-vocabulary cannot be eliminated in favour of the micro-vocabulary without catastrophic loss of explanatory power or tractability.
     *Verdict:* Substantive but defensible.
     *Instance:* Using "temperature" rather than tracking 10²³ momenta. *Non-Instance:* A system with only three particles. *Examples:* Temperature/pressure (yes), Natural selection (yes), Periodic table (yes).

  6. **Topological/Global Grammar:** The macro-variable is defined over the configuration as a whole (e.g., winding number) so that no description quantifying only over individual parts and pairwise interactions can express it.
     *Verdict:* Substantive but defensible.
     *Instance:* A knot or a magnetic monopole in a spin ice. *Non-Instance:* A simple cluster of non-relational properties. *Examples:* Phase transition (yes, topological phases), Protein folding (yes, topology), Temperature (no).

  7. **Epistemic Emergence (Deflationary):** Emergence is just a label for the current state of our ignorance or our computing budget.
     *Verdict:* Platitude (but often useful).
     *Instance:* Weather forecasting before supercomputers. *Non-Instance:* A system claimed to be fundamentally inexplicable. *Examples:* All textbook examples fall here eventually if reduction is assumed possible.

  8. **Downward Causation:** Macro-states have causal powers of their own, including effects on the parts that are not mediated by micro-laws.
     *Verdict:* Confused or false (in standard physics).
     *Instance:* Alleged mental causation overriding neural physics. *Non-Instance:* A thermostat turning on a heater (actually micro-mediated). *Examples:* None of the standard physics examples support this.

  9. **Strong Emergence:** The macro-behaviour is not derivable from the micro-dynamics even in principle, requiring new fundamental principles.
     *Verdict:* Confused or false (in physics context).
     *Instance:* Consciousness (claimed). *Non-Instance:* Superconductivity (explained by BCS theory). *Examples:* None of the standard physics examples fall here; Consciousness is the only candidate.

  ***

  **Interlocutors and the Global-Variable Reading**

  The **condensed-matter physicist** relies primarily on **Descriptive Autonomy (5)** and **Multiple Realizability (7)** to argue for disciplinary independence. These are defensible readings; solid-state physics studies stable macro-patterns that remain invariant across micro-details. However, to secure funding, they often gesture toward **Strong Emergence (9)**. The gap is that autonomy of *description* does not require autonomy of *law*; their field is safe without claiming new fundamental physics.

  The **consciousness researcher** requires **Strong Emergence (9)** or **Downward Causation (8)** to support the claim that neural descriptions *cannot* explain experience. They often slide from **Computational Irreducibility (3)** (it's too hard to simulate) to **Strong Emergence** (it's impossible in principle). This is the only interlocutor whose conclusion fails if restricted to the defensible readings; the slogan does the work only if the radical, likely false, reading is smuggled in.

  The **machine-learning researcher** leans on **Computational Irreducibility (3)** and **Non-Linearity (2)**. They observe sharp phase transitions in capability and infer **Unforecastability**. The gap is conflating "unforecastable without simulation" with "unforecastable in principle." Their claim is a contingent hypothesis about model architecture, not a metaphysical truth about emergence.

  The **fourth source's Global-Variable Reading** maps to **Topological/Global Grammar (6)**. It is a distinct, rigorous reading: certain properties (like genus or winding number) are literally inexpressible in a vocabulary restricted to local part-properties. This is true for topological phases of matter and protein knots. However, it is compatible with micro-level causal completeness; the global feature supervenes on the micro-state, even if it cannot be *named* by local variables. It supports the physicist's claim for autonomy and the ML researcher's claim for sharp transitions, but it offers no support for the consciousness researcher's claim of fundamental inexplicability.

  ***

  **Closing Note on Compatibility**

  Readings 1 through 7 are fully compatible with a complete micro-physics; they describe epistemic, descriptive, or structural features of complex systems without violating causal closure. Readings 8 and 9 (Downward Causation and Strong Emergence) are genuinely incompatible with a complete micro-physics, as they posit causal powers or laws that override or operate independently of the micro-constitution. Most scientific appeals to "more is different" intend the former but borrow the rhetorical force of the latter.
