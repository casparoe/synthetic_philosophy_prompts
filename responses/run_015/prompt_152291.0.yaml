answer: |-
  Subject: Re: Sleeping Beauty Seminar / That peer-disagreement twist

  Hey,

  This is a great angle. Getting them to *feel* the tension rather than just crunch the conditional probabilities is exactly what grad seminars need. The "centered-world peer disagreement" framing is sharp—it forces the Halfer/Thirder debate out of the abstract and into coordination strategy.

  I've sketched out a full run-of-show below. One quick heads-up on the logic before you read further: I massaged your "one agent scheduled for Tuesday" constraint slightly. If only *one* partner wakes on Tuesday, they become distinguishable from the Monday-only partner (since the Tuesday-waker knows "I am the one who wakes twice"). That breaks the "identical mental states" requirement needed for the SB puzzle to hold. To keep the centered-world indistinguishability intact (and the math at 1/3 vs 1/2), I made it symmetric: on Tails, *both* partners wake Mon/Tue. It preserves the peer disagreement vibe without introducing a "marked" agent.

  Here's the build.

  ### The Setup: "The Beauty Pair"
  **Participants:** 10 students → 5 Pairs.
  **Roles:** 
  1.  **The Sunday Self (S):** Places the joint bet before the "sleep."
  2.  **The Waking Self (W):** Executes the decision upon waking. 
  *(Note: They swap roles halfway through so everyone feels both pressures.)*

  **Materials:**
  *   5 Coins.
  *   10 "Wake Envelopes" per pair (labeled Mon/Tue on the *inside* only).
  *   50 Poker Chips (or fake points tokens).
  *   "Amnesia Cards" (index cards that say "You have no memory of previous wakings. Trust the protocol.").
  *   Whiteboard for tracking aggregate scores.

  ### The Payoff Scheme (The Trap)
  This is the engine. The points are awarded **per waking**, not per coin flip.
  *   **Correct Guess:** +10 points to the pair's pot.
  *   **Incorrect Guess:** 0 points.
  *   **Goal:** Maximize the pair's total points over 5 rounds.

  *Why this works:* 
  From the **Outside (Sunday Self)**, the coin is 50/50. A Halfer strategy suggests betting on Heads or Tails equally.
  From the **Inside (Waking Self)**, Tails produces twice as many betting opportunities. To maximize points *per waking*, they must reason like Thirders (act as if P(Tails) = 2/3). If they stick to the Sunday Halfer strategy, they leave points on the table.

  ### Timeline (75 Mins)

  **0:00 – 0:10 | Intro & Framing**
  *   Briefly state the SB problem.
  *   Introduce the twist: "You aren't just Beauty; you're Beauty's epistemic partner."
  *   Hand out materials. Pairs sit back-to-back (or in separate corners) once the "sleep" begins.

  **0:10 – 0:20 | Round 1: The Sunday Bet**
  *   Flip coin (hidden from students).
  *   **Sunday Selves** confer. They know the rules: Heads = 1 wake (Mon), Tails = 2 wakes (Mon, Tue).
  *   They must write down a **Joint Strategy** on a card (e.g., "Always guess Heads" or "Guess Heads on Mon, Tails on Tue").
  *   *Crucial:* They cannot communicate with their partner once the "sleep" starts.
  *   Collect the strategy cards.

  **0:20 – 0:40 | The Simulation (Waking)**
  *   **Heads Pairs:** Hand the Waking Self the "Mon" envelope. Collect. End round.
  *   **Tails Pairs:** Hand the Waking Self the "Mon" envelope. Collect. Hand them the "Amnesia Card." Shuffle them around the room (simulate time passing). Hand them the "Tue" envelope. Collect.
  *   *Inside the envelope:* A slip asking "Heads or Tails?" based on the strategy card.
  *   Tally points immediately on the board. 
  *   *Repeat for 3 rounds.* (Keep it fast).

  **0:40 – 0:50 | Role Swap & Second Run**
  *   Swap S and W roles.
  *   Run 2 more rounds.
  *   By now, the "Tails" pairs should be pulling ahead in points if they adjusted their strategy to account for the double-waking.

  **0:50 – 1:15 | The Debrief (Mapping the Intuitions)**
  *   **Ask the Sunday Selves:** "Why did you set the strategy you did?" (They will likely cite the 50% coin chance → Halfer).
  *   **Ask the Waking Selves:** "When you opened the envelope, did you feel the strategy was wrong?" (They will cite the frequency of wakings → Thirder).
  *   **Map to Lit:** 
      *   Sunday Self = David Lewis (Halfer). Focused on the *chance of the coin*.
      *   Waking Self = Adam Elga (Thirder). Focused on the *probability of the center* (being in this specific waking).
      *   The Payoff = The Dutch Book argument. If you don't update to 1/3, you lose utility in a world scored by wakings.

  ### Honest Note on Limitations
  Be ready to field this: **The Memory Problem.** 
  In the real SB problem, Beauty *cannot* remember the Monday waking when she wakes on Tuesday. In our game, the "Waking Self" is a different student than the "Monday Waking Self" (if you swap roles) or the same student who obviously remembers opening an envelope 10 minutes ago. 
  *   **Fix:** Acknowledge it openly. "We are simulating *indexical uncertainty*, not literal amnesia. The 'Amnesia Card' is a philosophical stipulation, not a cognitive reality." 
  *   If a student says, "I knew it was Tuesday because we just did Monday," validate them! That's exactly why the *real* problem requires amnesia—without it, the self-locating belief collapses into ordinary temporal knowledge.

  ### Predictable Failure Modes (First Run)
  1.  **Envelope Cheating:** Students will try to feel the thickness of the paper or mark the envelopes with their fingernails. 
      *   *Fix:* Use identical opaque envelopes. Have a TA or you handle the distribution so they don't touch the stack.
  2.  **The "Team Chat":** Pairs will try to signal each other during the "sleep" phase (coughing, tapping). 
      *   *Fix:* Enforce strict silence. Maybe play white noise.
  3.  **Confusion on Scoring:** They might think the goal is to get the *coin* right, not the *points*. 
      *   *Fix:* Emphasize repeatedly: "Maximize points, not truth." This is instrumental rationality vs. epistemic rationality.
  4.  **The Asymmetry Glitch:** If you stick to your original idea (only one partner wakes Tue), the Tuesday-waker will know they are the "special" one. 
      *   *Fix:* Stick to the symmetric version I outlined (Both wake on Tails). It keeps the centered worlds identical.

  Let me know if you want to tweak the payoff values. I found that making the Tails payoff double the Heads payoff (20 pts vs 10 pts) makes the Thirder advantage pop even faster, but it might look too rigged.

  Good luck with the session. It sounds like a blast.

  Best,
  [Your Name]
