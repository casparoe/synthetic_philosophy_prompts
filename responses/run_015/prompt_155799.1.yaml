prompt: |-
  On Saturday I am best man at the wedding of two moral philosophers. The groom has published a defence of transparent act-consequentialism: an act is right just in case it maximises well-being; a fully reflective agent should be moved by precisely that thought; and Williams's complaint that a man who stops to ask whether saving his wife really is for the best has one thought too many records, at most, a psychological or conversational awkwardness rather than a defect in his reasoning — a person's integrity, on the groom's view, matters only insofar as having it tends to produce good outcomes. Half the room will be their colleagues, several of whom think the integrity objection is decisive and who will notice if it is quietly traded for the quite different objection that consequentialism demands too much; the other half are family, who know the couple's work only as something about doing the most good and who expect an ordinary, warm wedding toast. Write me a three-minute toast in which the groom's commitment to the bride is his reason for marrying her and not merely an upshot of his reasons — she should not be able to hear herself as the best option currently available — while you neither refute him nor imply that he is a worse person for believing what he believes, and do not turn the toast into a lecture. Aim it at both halves of the room.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast (Best Man).
      *   **Groom:** Moral philosopher, proponent of *transparent act-consequentialism* (act is right iff it maximizes well-being; reflective agent motivated by this; integrity objections are merely psychological quirks, not rational defects).
      *   **Audience:**
          *   Half: Colleagues (philosophers). Some disagree with the groom (think integrity objection is decisive). They will spot if I swap integrity for "demandingness."
          *   Half: Family/Non-philosophers. Know the work vaguely ("doing the most good"). Expect warmth, not theory.
      *   **Constraints:**
          *   Duration: ~3 minutes (approx. 400-500 words spoken at a moderate pace).
          *   Core Message: The groom's commitment to the bride must be *his reason* for marrying her, not just an upshot of maximizing utility. She shouldn't feel like the "best available option."
          *   Tone: Warm, celebratory, not a lecture, not a refutation of the groom's views, not insulting the groom.
          *   Balance: Must satisfy the philosophers (no philosophical errors, no cheap swaps) and the family (emotional resonance).

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Problem:* Transparent act-consequentialism suggests one should always act to maximize the good. If the groom marries the bride because it maximizes well-being, is he loving *her* or the *outcome*? Bernard Williams' "one thought too many" objection suggests that stopping to calculate undermines integrity/love. The groom thinks Williams is wrong (it's just awkwardness, not a defect).
      *   *The Goal:* I need to frame his love such that it aligns with his philosophy *without* making the bride sound like a utility calculation, while acknowledging the philosophers' concern without validating it as a critique of *him*.
      *   *The Trick:* Focus on the *transparency* aspect. If the act is right *because* it maximizes well-being, and he is a reflective agent moved by that, then his love *constitutes* the well-being. The "calculation" isn't a cold external metric; it's the internal recognition of her value. I need to pivot from "maximizing the good" to "she *is* the good."
      *   *Avoiding the Trap:* I cannot say "He calculated you were the best." I must say "In choosing you, he defines what matters." I need to respect the "integrity" objection without endorsing it as a failure on his part. Actually, the prompt says "she should not be able to hear herself as the best option currently available." This means avoiding language of optimization *in the moment of commitment*.
      *   *Philosophical Nuance:* The colleagues want to see that I understand the integrity objection. I can't just say "Love is magic." I need to hint that in this specific case, the "one thought" disappears because the motivation and the justification converge.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience. Warm up the room. Mention the groom's work lightly.
      *   **The Middle (The Philosophical Tightrope):** Address his worldview. Acknowledge he thinks about "the good." But pivot to how *she* fits into that.
          *   *Key move:* Don't talk about him calculating. Talk about him *seeing*.
          *   *Addressing Williams/Integrity:* Hint that for some questions, the calculation vanishes. The "one thought too many" disappears when the answer is obvious.
          *   *Addressing the Bride:* Make sure she knows she isn't a variable. She is the constant.
      *   **The Climax:** The commitment. It's not about maximizing; it's about prioritizing.
      *   **Closing:** Raise a glass. Warm wish for the future.

  4.  **Refining the Tone:**
      *   *Family:* Needs jokes about "thinking too much," warmth, love.
      *   *Colleagues:* Needs precise phrasing. "Transparent act-consequentialism" shouldn't be namedropped clumsily, but the concepts (maximization, motivation, integrity) should be respected.
      *   *Constraint Check:* "Neither refute him nor imply he is a worse person." I must treat his philosophy as compatible with deep love.
      *   *Constraint Check:* "She should not be able to hear herself as the best option." Avoid words like "optimal," "maximize," "calculate," "utility." Use words like "certainty," "clarity," "focus."

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. [Groom] thinks a lot about doing the right thing. Some say he thinks too much. But with [Bride], he doesn't calculate. He knows. She isn't the best option; she's the only one that matters. To the philosophers: don't worry, he's still a consequentialist. To the family: he loves her. Cheers.
      *Critique:* Too blunt. Risks sounding like I'm saying his philosophy is suspended for love (which might annoy the colleagues who want consistency) or that he *did* calculate (which annoys the bride). Needs more poetry.

  6.  **Drafting - Attempt 2 (Focusing on the "One Thought"):**
      Williams said saving your wife without thinking is better. [Groom] says thinking is fine. I say, with [Bride], the thinking stops. Not because it's irrational, but because the value is transparent.
      *Critique:* Better. "Transparent" is a keyword from his theory. Let's use that. The transparency of the act matches the transparency of his love.

  7.  **Finalizing the Script (incorporating constraints):**
      *   Start with the dual nature of the room.
      *   Joke about his job (thinking).
      *   Address the "integrity" issue subtly: In love, the justification *is* the motivation. No gap.
      *   Ensure the bride feels unique, not optimal.
      *   Keep it under 3 minutes (approx. 450 words).

      *(Self-Correction during drafting)*: I need to be careful not to validate the "integrity objection is decisive" crowd too much, or I undermine the groom. I need to suggest that *this specific love* bypasses the objection naturally. The "one thought too many" vanishes not because reasoning is bad, but because the truth is self-evident.

      *Revised Plan:*
      1. Welcome both groups (philosophers and family).
      2. Acknowledge his work (maximizing good).
      3. Pivot: Usually, he weighs options. Today, there are no options.
      4. Address the "thought too many": In this case, the thought and the feeling are the same.
      5. Toast to the future.

  8.  **Word Count Check:**
      A 3-minute speech is roughly 350-450 words at a measured pace. I will aim for that.

  9.  **Final Polish:** Check for any "optimization" language that might offend the bride. Ensure "well-being" is framed as *her* happiness, not abstract utility.

      *(Wait, one more check on the prompt)*: "She should not be able to hear herself as the best option currently available."
      Okay, so I cannot say "You are the best thing that could happen to him." I must say "You are the thing that makes everything else matter."
      Also: "Neither refute him." So I can't say "Philosophy is wrong, love is right." I must say "Philosophy finds its fulfillment here."

      Let's write.

      *Opening:* Good evening. For those who don't know me...
      *The Work:* He spends his life asking what we owe the world.
      *The Pivot:* But tonight isn't about the world. It's about this.
      *The Philosophy:* He believes in transparency. That the right reason should move you.
