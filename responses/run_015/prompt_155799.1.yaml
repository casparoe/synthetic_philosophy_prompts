      *Refining the "Integrity" bit:* I need to signal to the colleagues that I know the Williams objection without making it a debate. "Bernard Williams worried that a moral agent might have one thought too many. But tonight, there are no extra thoughts. There is only the necessary one." This satisfies the colleagues (I know the reference) and the family (it sounds romantic).

      *Refining the "Best Option" bit:* Instead of "best," use "singular." "Not the best among many, but the singular focus."

