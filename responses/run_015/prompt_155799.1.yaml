answer: |-
  Good evening. For those who don't know me, I'm the Best Man. For those who do, you know I've been asked to keep this under three minutes, which is a utilitarian constraint I'm happy to obey.

  We have a unique room tonight. Half of you are family, who know [Groom] as a son and brother who sometimes thinks a bit too hard about dinner orders. The other half are colleagues, who know him as a philosopher committed to the idea that we should always act to bring about the best state of affairs, and that a truly reflective person is moved directly by that reason.

  Now, Bernard Williams once famously complained that if a man saves his wife from danger, but stops to ask if it's morally permissible first, he has "one thought too many." It suggests a gap between love and duty. [Groom] has spent his career arguing that this gap is an illusion—that clarity of reason doesn't distance us from what matters, it connects us to it.

  And looking at him today, I think he's proven his own point.

  [Bride], for you, I want to be very clear. In [Groom]'s worldview, there is no calculation happening here. You are not the "optimal choice" among competitors. You are not a variable in an equation. To the colleagues in the room: the integrity objection doesn't apply today, because there is no conflict to resolve. To the family: he isn't marrying you because it's "for the best" in some abstract sense. He is marrying you because *you* are the substance of that good.

  When he looks at you, the "one thought" Williams worried about disappears. Not because he stopped thinking, but because the thought and the feeling have become identical. His commitment to you isn't an upshot of his reasons; it *is* his reason. There is no daylight between his duty and his desire.

  [Groom], you argue that transparency is the mark of a moral agent. Today, you are transparent. We all see that your integrity isn't something you protect *against* your relationships; it is something you build *through* them.

  So, if I could ask everyone to raise a glass.

  To [Bride] and [Groom]. May your life together be the one case where the justification and the motivation are perfectly, happily, the same thing.

  To the happy couple.
