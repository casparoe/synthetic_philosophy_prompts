  Two lights one ray; the measure stands.
  Ice locks the river in its bands,
  The measure stands.

  The sickle sweeps the summer lands,
  Rich harvest fills the farmer's hands,
  The measure stands.

  The fever burns, no cure expands,
  The pulse beats quick where death demands,
  No help within his art's commands,
  The measure stands.

  A subtle shift where thought expands,
  A figure traced by trembling hands,
  Proportion felt where geometry lands,
  Across the air, across the strands,
  The measure stands.

  The cloud builds up, the sky expands,
  The tide obeys the moon's commands,
  The storm settles on shifting sands,
  The wind obeys where light withstands,
  No chaos here, within its bands,
  The measure stands.

  One seventh part denies the lands,
  The compass breaks in human hands,
  No figure...

  Not force, but sight. The Earth has soul,
  She hears the harmony make whole,
  An inclination, not control,
  The reasoning mind may reach its goal,
  Or turn aside. The stars do not compel,
  Nor are they void. They sing the truth too well.
  The mechanism is perception, clear,
  As ear hears concord, distinct from fear,
  So soul receives the angular poise,
  But man consents to what the heavens voice.
