answer: |-
  The taxi hummed over the wet pavement, the city lights smearing against the rain-streaked window. Mara rubbed her temples. She'd spent the afternoon defending a toy model; Julian had spent it dismantling one.

  "It doesn't matter what's in the tank," Mara said, breaking the silence. "Water, mercury, compressible gas, put it on the moon. The cable doesn't turn."

  Julian didn't look up from his phone. "You know the model doesn't turn. You built the stagnation into the geometry."

  "I built nothing of the sort. I built a loop of cable with hollow spheres running through seals at the top and bottom of a ten-metre column. Buoyancy says the up-side should win. But I sat there at one this morning and saw it: shove a sphere in at depth *h* and you pay pressure-times-volume. You pay exactly what buoyancy gives you back. I didn't look up the law of buoyancy. I saw a constraint any such law has to satisfy."

  "You saw a constraint," Julian said, finally pocketing the phone. "But you didn't see it from nowhere. You saw it because you assumed conservation of energy."

  "I assumed nothing. I looked at the state of the system. Advance the cable by one sphere spacing. The water is back where it started. The spheres are back where they started. The configuration is identical. If the state is identical, the energy is identical. That's not an empirical premise about fluids; that's a condition on coherence."

  "It's an empirical premise about the world," Julian corrected. "Conservation of energy is a framework principle, highly confirmed, but empirical. And you leaned on a pile of stipulations to get the state to match. Perfect seals. Rigid spheres. Steady state. None of that is *a priori*. None of it is true of any machine you could weld together."

  "So what? If the ideal machine yields zero, the real one yields less. Friction and leaky seals only drain more power. I don't need to build it to know it won't run."

  "There's the export problem," Julian said. "Your verdict is about an impossible object. No seal is perfect. No sphere is perfectly rigid. You're moving from 'the ideal model yields zero' to 'no real machine works.' That move requires a continuity assumption—that real systems approximate ideal ones smoothly. You've quietly downgraded the claim from 'zero output' to 'less than zero output.' You need experiment to say how much less. Maybe the seals leak in a way that creates pressure differentials you didn't model. The armchair tells you nothing about the magnitude of the failure."

  "The armchair tells me I shouldn't fund the build," Mara snapped. "That's knowledge. It saves me a million dollars. If I have to build it to know it fails, science is just stamp collecting."

  "If you have to build it to know which hidden premise saved you, yes," Julian said. "Why bother with the story at all? Why the tank, the cable, the rain against the glass? If it's just a deduction, write the equations. *H* equals *P* times *V*. Done."

  "Because the imagination does work the formalism can't do yet," Mara said. "Sometimes you get the answer before you have the theory. The answer tells you which theory to reach for. Einstein wondering what a light wave looks like if you run alongside it—he didn't have the math first. He had the picture. The picture constrained the math."

  "And the history of science is a graveyard of pictures everyone was certain of," Julian countered. "People 'saw' in their heads that heavy objects must fall faster than light ones. They 'saw' that the earth couldn't move because birds would be left behind. The feeling of necessity is just the feeling of a deduction from premises you've stopped noticing. You think you're seeing the world; you're just reading your own commitments."

  "But the results are surprising!" Mara leaned forward. "I wanted the machine to work. I was hoping for free power. The thought experiment forced me to abandon a commitment I liked. You don't feel forced by your own premises like that. You feel pushed by the world."

  "That's exactly what explication feels like from the inside," Julian said softly. "You unpack what your existing commitments entail, and it feels like discovery because you weren't paying attention to what you already believed. It's knowledge, sure. But it's not new knowledge about the world. It's new knowledge about what your concepts require."

  "It's new knowledge that the world won't allow perpetual motion," Mara insisted. "Regardless of the fluid. Regardless of the gravity."

  "Because you've defined 'energy' such that it conserves," Julian said. "If the machine worked, you wouldn't say 'physics is broken,' you'd say 'I missed a source.' You've rigged the vocabulary."

  The taxi slowed for a red light. The silence stretched, heavier than before. They were both tired of the circle, but neither could let it go.

  "Okay," Mara said. "Here's what would settle it. Show me a thought-experiment verdict that is robust—works across fluids, across gravities, across microphysics—and traceable to no empirical premise at all. Not conservation, not continuity. Just pure reasoning that locks the world down. If you can't find a hidden premise there, you have to admit the armchair sees something the database doesn't."

  Julian looked out at the rain. "And here's mine. Give me a convincing story about where the hidden empirical premise sits in every celebrated case. Every single one. Show me one where the intuition isn't just a compressed summary of past experience, smuggled in as 'obvious.' If I can find the footprint of the world in every 'necessary' truth, then you have to admit the armchair is just a very quiet laboratory."

  Mara nodded slowly. "Fair."

  "Fair," Julian agreed.

  The light turned green. The taxi moved on, neither of them knowing who would have to pay for the ride.
