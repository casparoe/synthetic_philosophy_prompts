answer: |-
  # PROBABILITY CLAIM DIAGNOSTIC TREE

  **Instructions:** Start at **Q1**. Answer based on your commitments to the concrete cases (a–g). Follow the arrows to your position.

  **Q1. Is the word "probability" used in exactly one sense across all scientific and everyday contexts (e.g., coins, theories, recessions)?**
  *   **No:** The meaning shifts depending on context (e.g., physical chance vs. degree of support).
      *   → **PLURALISM**
      *   *Awkward Commitment:* There is no unified theory of probability, only a family resemblance between uses.
  *   **Yes:** There is a single underlying definition.
      *   → **Q2**

  **Q2. Can a probability value be properly assigned to a fixed hypothesis (e.g., "this theory is true"), or only to outcomes generated by a process?**
  *   **Only to Outcomes:** Hypotheses are true or false; probability describes data generation.
      *   → **Q3**
  *   **To Fixed Hypotheses:** Claims about the world can be probable.
      *   → **Q6**

  **Q3. Does the probability value describe the reliability of the *method* used to gather data, or the behavior of the *system* being studied?**
  *   **The Method:** The value quantifies how often the procedure would mislead (e.g., p-values).
      *   → **ERROR-STATISTICAL / SEVERITY**
      *   *Awkward Commitment:* We can never state the probability that a specific hypothesis is true, only how well-tested it is.
  *   **The System:** The value describes the stability of outcomes produced by the setup.
      *   → **Q4**

  **Q4. Can a single, unrepeatable event (e.g., one specific atom decaying, one coin flip destroyed immediately) have a probability value?**
  *   **No:** Probability requires a series or collective of events.
      *   → **Q5**
  *   **Yes:** Single cases carry probability values intrinsically.
      *   → **Q5b**

  **Q5. Must the series of events be actually observed and counted, or can it be a hypothetical limit?**
  *   **Actually Observed:** Probability is the ratio in a finite, actual set of trials.
      *   → **FINITE FREQUENTISM**
      *   *Awkward Commitment:* If a coin is never flipped, it has no probability of heads, even if it is physically symmetric.
  *   **Hypothetical Limit:** Probability is the limit of relative frequency in an infinite or counterfactual series.
      *   → **HYPOTHETICAL FREQUENTISM**
      *   *Awkward Commitment:* Probabilities depend on facts about trials that never actually happen.

  **Q5b. Is this single-case value a physical disposition to produce frequencies, or a primitive fact that rational belief must track?**
  *   **Physical Disposition:** The probability is a causal property of the setup (like fragility).
      *   → **PROPENSITY (Single or Long-Run)**
      *   *Awkward Commitment:* Probabilities are real causal powers that may never manifest in actual frequencies.
  *   **Primitive Fact/Norm:** The chance is real, but its main role is to constrain rational belief (Principal Principle).
      *   → **CHANCE-CREDENCE DUALIST**
      *   *Awkward Commitment:* There is a "chance" fact distinct from belief, but we can only access it via norms on belief.

  **Q6. If two agents share all evidence and reasoning capacities, are they rationally required to assign the exact same probability?**
  *   **No:** Rational agents may differ based on individual judgment or starting attitudes.
      *   → **Q7**
  *   **Yes:** Evidence dictates a unique rational degree of support.
      *   → **Q8**

  **Q7. Is a probability claim ultimately a description of your willingness to bet, or your internal state of confidence?**
  *   **Willingness to Bet:** Probability is defined by preference structures and betting odds.
      *   → **DECISION-THEORETIC**
      *   *Awkward Commitment:* Probability is not about belief at all, but about consistent action preferences.
  *   **Internal Confidence:** Probability is a degree of belief, constrained only by logical consistency.
      *   → **COHERENCE-ONLY SUBJECTIVISM**
      *   *Awkward Commitment:* Two rational people with identical evidence can legitimately assign 0.99 and 0.01 to the same claim.

  **Q8. In total ignorance (e.g., the cube parameterization case), is there exactly one rational way to assign probabilities?**
  *   **No:** Rational constraints apply only to updating, not to starting points.
      *   → **OBJECTIVE BAYESIANISM**
      *   *Awkward Commitment:* Rationality constrains how you change your mind, but not where you start (yet evidence dictates agreement).
  *   **Yes:** Principles of symmetry or indifference dictate a unique starting assignment.
      *   → **CLASSICAL / LOGICAL-INDIFFERENCE**
      *   *Awkward Commitment:* Pure ignorance can yield specific knowledge (e.g., 1/2) via principles of symmetry.

  ***

  ## DIAGNOSTIC REPORT

  ### (i) Character Routing
  1.  **The Quantum Experimentalist** ("The atom's decay probability is 1/2 and that is all there is to say"):
      *   **Path:** Q1(Yes) → Q2(Only Outcomes) → Q3(The System) → Q4(Yes) → Q5b(Physical Disposition).
      *   **Leaf:** **PROPENSITY**.
      *   **Note:** They treat the single-case chance as a brute physical fact without needing to link it to belief norms (Dualist) or long-run series (Frequentist).

  2.  **The Procedure Statistician** ("Probability statements are about procedures and never about hypotheses"):
      *   **Path:** Q1(Yes) → Q2(Only Outcomes) → Q3(The Method).
      *   **Leaf:** **ERROR-STATISTICAL / SEVERITY**.
      *   **Note:** They reject assigning probability to the hypothesis itself (Q2), focusing entirely on the reliability of the testing procedure (Q3).

  3.  **The Cosmologist** ("0.95 is just how confident she is and there is nothing more to be settled"):
      *   **Path:** Q1(Yes) → Q2(To Fixed Hypotheses) → Q6(No) → Q7(Internal Confidence).
      *   **Leaf:** **COHERENCE-ONLY SUBJECTIVISM**.
      *   **Note:** They allow probability on hypotheses (Q2), deny rational uniqueness (Q6), and define it by confidence rather than betting behavior (Q7).

  ### (ii) Indistinguishable Leaves
  *   **Objective Bayesianism vs. Classical/Logical-Indifference:** The tree separates them on *total ignorance* (Q8). However, in practice, many Objective Bayesians accept weak indifference principles.
      *   **Further Case Needed:** A case of *partial* ignorance where symmetry is absent. If two agents agree on constraints but assign different numbers without violating logic, they are Objective Bayesians. If they say one assignment is *irrational* due to lack of evidence for asymmetry, they are Classical.
  *   **Chance-Credence Dualist vs. Single-Case Propensity:** Both posit real single-case chances. The split relies on whether the agent emphasizes the *causal* role (Propensity) or the *normative* role (Dualist).
      *   **Further Case Needed:** Ask if a rational agent *must* align their belief with the known chance. If "Yes," they lean Dualist (Principal Principle). If "No, belief is separate," they lean Propensity.

  ### (iii) Unoccupied Cells in Logical Space
  1.  **Single-Case Frequentism:** (Path: Q2[Outcomes] → Q3[System] → Q4[No] → *Single*).
      *   **Status:** **Incoherent.** Frequentism defines probability via series; a single case cannot logically host a frequency definition.
  2.  **Hypothesis Frequentism:** (Path: Q2[Hypotheses] → Q3[Method]).
      *   **Status:** **Incoherent.** If probabilities attach to hypotheses, they cannot be defined solely by data-generation procedures (which is the definition of the Error-Statistical view).
  3.  **Deterministic Subjectivism:** (Path: Q6[Yes] → Q7[Willingness to Bet]).
      *   **Status:** **Merely Unattractive.** This would imply betting preferences are dictated by evidence alone. While defensible (as in some Objective Bayesian accounts of utility), it removes the "Subjective" element of the Decision-Theoretic view, collapsing it into Objective Bayesianism.
  4.  **Physical Subjectivism:** (Path: Q2[Outcomes] → Q3[System] → Q4[Yes] → *Belief Defined*).
      *   **Status:** **Undefended.** This would claim single-case physical events have probabilities, but those probabilities are defined by belief. This collapses into the Dualist or Epistemic views; no one argues the *physical event's* value is *defined* by belief while maintaining it is a property of the *system*.
