answer: |-
  Headline credence: **0.62**

  ### Sub-question Pricing

  **1. Variance of Unmeasured Value:** **0.90**
  Social interventions operate in complex adaptive systems where second-order effects (norms, institutions) vary wildly and rarely match the variance of first-order metrics.

  **2. Directionality of Omission:** **0.75**
  Measurable metrics disproportionately capture direct, short-term service delivery while systematically underweighting systemic capacity, political empowerment, and long-term resilience.

  **3. Evaluator Error Correlation:** **0.65**
  The small pool of analysts shares training, data sources, and professional incentives, creating a monoculture where methodological blind spots are shared rather than diversified away.

  **4. Internal Repairability:** **0.40**
  While value-of-information adjustments help, they cannot correct for "unknown unknowns" or structural blind spots that the methodology does not recognize as variables.

  **5. The Flip Probability (Comparison Class):** **0.55**
  Even with directional bias, the top-ranked interventions often have such large estimated margins over lower-ranked ones that the hidden value would need to be massive to reverse the ordering.

  ### Mechanism Pricing

  **Evidence Capitalisation:** **0.75**
  Interventions with existing data look cheaper and more effective largely because past funding bought the data, creating a feedback loop that privileges incumbents.

  **Measurement Treadmill:** **0.50**
  Implementers optimize for measured metrics, but this often yields real efficiency gains alongside gaming, making the net drift in value ambiguous.

  **Auditability Rent:** **0.80**
  Interventions that can be verified remotely (e.g., bednets) receive a systematic premium over those requiring local contextual judgement (e.g., governance reform), independent of true value.

  ### Combination Logic

  I derive the headline figure by treating **Variance (0.90)** and **Directionality (0.75)** as the foundational conditions for systematic error, which I accept as highly probable. I then discount this by **Repairability (0.40)**, acknowledging some methodological self-correction is possible. The critical bottleneck is **The Flip Probability (0.55)**: even if the model is biased, the top pick might still be better than the second pick simply because the estimated margin is huge. I weight **Evaluator Correlation (0.65)** as an amplifier that prevents the law of large numbers from saving the portfolio. The headline 0.62 reflects the probability that the directional bias is large enough to overcome the estimated margin in a majority of marginal allocation decisions.

  ### Value Theory Sensitivity

  My headline number would move significantly under a different theory of the good. Under a **deontological or rights-based view**, the credence rises to ~0.80, because cost-effectiveness models often struggle to price rights violations or procedural justice, making the "unmeasured" component both larger and more directionally biased against the top-ranked interventions. Under a **virtue-ethics view** (focusing on the moral character of the donor or recipient), the credence rises to ~0.85, as the act of algorithmic allocation itself might be deemed less valuable than relational giving, rendering the ranking irrelevant. The 0.62 figure is specific to **long-run welfarism**, where the only error is getting the welfare calculation wrong, not the moral framework itself.

  ### Diagnostics

  **1. Least Confident Term**
  I am least confident in **Internal Repairability (0.40)**. It is difficult to predict the trajectory of methodological innovation; a new framework for modeling institutional change could emerge that drastically reduces the unmeasured variance, rendering my pessimism about fixes unfounded.

  **2. Sensitivity Analysis**
  Perturbing **Directionality of Omission** moves the headline number furthest. If I adjust this from 0.75 down to 0.50 (assuming omissions are random rather than biased), the headline credence drops to 0.35. If I adjust it up to 0.90 (assuming measurable metrics are actively misleading), the headline rises to 0.82. This term is the engine of the claim; without directional bias, variance is just noise.

  **3. Convergence Path**
  You (0.45) are likely underestimating **Evaluator Error Correlation** and **Auditability Rent**, trusting the diversity of the field more than the homogeneity of its methods warrants. Your friend (0.75) is likely overestimating **The Flip Probability**, assuming that because the model is biased, the *order* must be wrong, neglecting that the top pick's estimated margin is often large enough to survive significant bias. To converge, you must concede that shared methodological blind spots create systematic risk, and your friend must concede that a biased model can still pick a winner, even if it misprices the margin.

  **4. Evidence Request**
  Commission a **retrospective "shadow panel" study** on a specific cohort of grants made 15 years ago. Select 50 interventions that were ranked by CEA at the time, fund a team of independent historians and sector experts to reconstruct the long-term outcomes (including institutional and normative effects) without seeing the original rankings, and have them produce a new ordering. If the shadow panel's top 10 overlaps with the original CEA top 10 by less than 40%, my headline number shifts up by 0.15; if it overlaps by more than 70%, it shifts down by 0.15. We would need to wait 15 years for the outcomes to mature, or proxy them via rigorous intermediate indicators validated by the panel.
