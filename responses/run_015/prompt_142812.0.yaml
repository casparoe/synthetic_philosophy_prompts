  7.  **Final Polish:** Check for clarity and ensure the distinction between *legal title* and *moral stewardship* is sharp, as that's where the lawyer's ambiguity lies. (Self-Correction: Make sure to explicitly mention that the Benin Bronzes were looted during a punitive expedition, which makes the "legal ownership" claim by the museum historically shaky depending on when they acquired them, though UK law like the British Museum Act 1963 locks them in.)

