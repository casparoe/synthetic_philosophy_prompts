  *Locus:* Test rig

  **5. Glass ampoules** (Score: 2)
  *Justification:* Procedural contamination during testing invalidates the evidence, leaving the genuine disposition of intact units unknown.
  *Locus:* Test rig

  ***

  ### Taxonomy and Scheme Limitations

  The familiar taxonomy of finks, masks, antidotes and mimickers fails to cover **Case 5** and **Case 9**, requiring the introduction of **Procedural Contamination** (where the test process itself alters the object or data) and **Stochastic Variance** (where the disposition is inherently probabilistic rather than deterministic). Additionally, **Case 11** represents **Environmental Ambiguity**, where the test context diverges from service context without a clear mask or fink mechanism.

  My tier scheme cannot separate **Case 2** and **Case 4** from one another, as both are assigned to Tier C with high confidence; however, in practice, I would treat them differently because Case 4 requires careful handling to preserve the blooming agent, whereas Case 2 is protected by the permanent installation.
