  The Procedure

  1.  **Boundary Definition [Empirical]:** Explicitly list extractors (herders) and beneficiaries (birds/public). If groups overlap ambiguously or stakeholders are missing, return proposal. Unclear boundaries lead to enforcement failure and unauthorized consumption.
  2.  **Exclusion Feasibility [Empirical]:** Determine if extractors can be excluded (permits) and if beneficiaries can be excluded (fencing). If beneficiaries (birds) cannot be excluded, they cannot be charged for maintenance. This defines the public good dimension.
  3.  **Temporal Congruence [Empirical]:** Compare management cycles to regeneration cycles. Grass regenerates annually; birds nest on multi-year cycles. If rules operate solely on annual cycles, stop: "No." Management must span the longest regeneration period to ensure sustainability.
  4.  **Cost Externalization [Value/Empirical]:** Identify who bears costs versus who receives benefits. If herders bear costs for bird benefits without compensation or voice, flag for Value Judgment. This identifies asymmetric burdens inherent in ACPPGs.
  5.  **Commons Integrity [Value]:** Assess if the mechanism converts the common-pool into private or exclusionary zones. If yes, does this violate established access rights? If yes, stop: "No" unless overridden by higher authority. This protects the common-pool structure from enclosure.
  6.  **Final Review:** If all empirical checks pass and value flags are resolved, approve. If value flags remain unresolved, hand off to ethics board. Do not proceed with unresolved value flags. Document all empirical data sources used.

  Three Worked Cases

  (a) **Rotational Grazing + Delayed Closures:** Boundaries are clear. Exclusion is feasible via permits. Temporal congruence holds: delayed closures match multi-year nesting cycles, ensuring grass height recovers. Costs are distributed via reduced grazing time, which herders accept via permit negotiation. Commons integrity remains intact; access is managed, not revoked. **Recommendation: Approve.** This balances subtractability with public good provision without breaking the commons structure. It aligns incentives for herders to maintain grass height.

  (b) **Permanent Fencing:** Boundaries are clear. Exclusion is feasible for herders. Temporal congruence holds for birds. However, costs are fully externalized to herders via loss of access. Commons integrity is violated: fencing converts common-pool meadow into exclusionary zones, revoking traditional rights. **Recommendation: Reject.** This is politically unwelcome to conservation advocates seeking maximum bird security, but the procedure flags the violation of commons design principles regarding congruence between appropriation and provision. It solves the public good problem by destroying the common-pool structure, creating a precedent for enclosure that undermines local governance.

  (c) **Predator Culling:** Boundaries are clear. Exclusion is feasible for predators. Temporal congruence fails: culling does not address grass height, the primary driver of nesting success. Birds fail if grass is low regardless of predator presence. Empirical check fails. **Recommendation: Reject.** This is unwelcome to herders who view predators as threats, but the procedure identifies the empirical mismatch between intervention and ecological requirement. It externalizes ecological risk without solving the resource constraint.

