  Only the rolling dice of **Chance**.

  But can we rest upon mere **Chance**,
  When science seeks a universal **Law**?
  Does repetition birth **Necessity**,
  Or is there something more in **Power**,
  Than the heating of the iron **Match**,
  To hold the scattered parts in **System**?

  The Best Account is such a **System**,
  Balancing strength against **Chance**,
  To fit the history of every **Match**.
  It does not legislate by **Law**,
  Nor claim an ontological **Power**,
  But maps the appearance of **Necessity**.

  Others demand a robust **Necessity**,
  Beyond the scope of **System**,
  A relation endowed with **Power**,
  That fixes outcomes, barring **Chance**.
  The universals bind by **Law**,
  Even without the **Match**.

  Hold dry the unstruck **Match**,
  Querying strict **Necessity**.
  Is there a supporting **Law**?
  Or just the local **System**?
  We gamble on **Chance**,
  Without a guiding **Power**.

  Where resides the causal **Power**?
  In the head of the **Match**?
  Or in the gap of **Chance**?
  Does nature bind with **Necessity**?
  Is the **System** all?
  Or is there a deeper **Law**?

  Had **Power** refused the **Match**,
  **Chance** would dissolve **Necessity**,
  While **System** names the **Law**.

  ***

  **Note for the Pub**

  The rotation *is* the law: read it Humeanly, the words merely happen to fall this way (the best summary of the poem); read it Anti-Humeanly, their natures demand these positions. Stanza 1 and 3 argue the Best System case (laws as summaries); Stanza 2 and 4 argue the Necessitation/Powers case (laws as governors). Stanza 5 tackles the counterfactual (the unstruck match). The envoi posits the "unwritten stanza"—a world where powers fail—leaving it unresolved whether the System would survive (Humean) or break (Anti-Humean).
