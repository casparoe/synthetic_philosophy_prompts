          *   Tension: If (5) is the normative standard, (2) admits Spinoza failed that standard if his sociology was wrong.
          *   Stability: They stand together *if* you accept Spinoza's sociology was accurate *at the time*. If you hold (5) as a timeless truth, (2) makes Spinoza inconsistent.
