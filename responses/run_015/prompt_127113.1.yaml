      *   **Ranking:**
          1.  Naturalness vs. Fragility ((1) vs (4)).
          2.  Universal Principle vs. Contingent Exclusion ((5) vs (2)).
          3.  Institutional Sufficiency vs. Educational Necessity ((3) vs (4)).

