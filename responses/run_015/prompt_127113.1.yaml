  7.  **Finalizing the Rankings:**
      *   **Rank 1 (Severe): (1) & (5) vs (2).** The "Boundary Problem." If Right=Power (1/5), and exclusions are contingent (2), then Spinoza's actual proposal is internally inconsistent with his own metaphysics. The package tries to have it both ways: Spinoza is consistent (2) but the principle is universal (5).
