      *   **Severity 2 (High): (1)/(5) vs (2).** The definition of the Multitude. If (5) is the core principle (Right=Power), and (2) admits exclusions based on contingent sociology, the package must admit Spinoza's democracy was *not* fully democratic by its own lights. (1) says Democracy is where the multitude retains power. (2) says the multitude was restricted.
