      *   *Re-evaluating (1)/(5) vs (2).* This is the bigger issue. (1) says Democracy is where the multitude retains power. (5) says Excluding power-holders violates the principle. (2) says Spinoza excluded people he *thought* lacked power.
      *   *The Real Conflict:* If (5) is true ("excluding any agent whose judgment is not actually determined by another... violates"), and we assume modern knowledge (women *are* not determined by others), then Spinoza's Democracy (described in 2) violates (5). But (1) says Spinoza's Democracy is the "most natural." So Spinoza's "Democracy" violates the definition of "Democracy" in (5).
      *   *This is the critical tension.* The package claims Spinoza's theory is Democratic (1), but admits it excludes people who should be included by its own logic (5+2).
      *   *Revision:* Distinguish between "Spinoza's Ideal Democracy" (1/5) and "Spinoza's Proposed Regime" (2).

      *   *Re-evaluating (3) vs (4).* (3) says institutions *filter* passion. (4) says without education, passion *wins*. This is a direct contradiction on the efficacy of institutions. If institutions filter passion effectively, education is less critical. If education is critical, institutions don't filter enough.
