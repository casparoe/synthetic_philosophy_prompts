answer: |-
  ### 1. Testing the Tentative Principle

  Your tentative principle states: *Uncertainty about remote effects is inert when it is roughly symmetric across options and uncorrelated with anything I can estimate, and significant when many agents face a structurally similar choice, so that the guesswork does not cancel but compounds.*

  Let us run this against your five verdicts:

  *   **Case 1 (Detergent):** **Pass.** Many agents buy detergent; market mechanisms aggregate supply chain effects. Your individual uncertainty is symmetric across brands and uncorrelated with the systemic outcome. The principle correctly predicts inertness.
  *   **Case 2 (Career):** **Pass.** This is a "replacement" case. If you decline the finance job, someone else takes it. The structural similarity of agents (competitors in a labour market) means your choice changes *who* does the job, not just *if* it gets done. The guesswork compounds because the marginal impact depends on the counterfactual agent. The principle correctly predicts significance.
  *   **Case 3 (Charity):** **Fail.** Many agents donate to existential risk. According to your principle, the guesswork should compound, making the uncertainty *significant*. Yet your verdict is a "shrug" (inertness regarding the remote claim, deferring to near-term). The principle predicts you should be agonizing over the compounding error, but instead you treat the remote uncertainty as a reason to *stop* calculating and default to the near-term.
  *   **Case 4 (Child):** **Fail.** Many agents have children. The remote effects (descendants, emissions) are massive and structurally similar across agents. Your principle predicts this uncertainty should be highly significant. Your verdict is that the framing is illegitimate. The principle cannot account for the *normative* rejection of the calculation.
  *   **Case 5 (Population Policy):** **Pass.** This is a policy choice faced by few agents (governments/institutions), but the uncertainty is axiological (is more better?). The principle treats this as significant uncertainty, leading to paralysis. This matches your verdict, though for a slightly different reason (value uncertainty vs. empirical guesswork).

  **Diagnosis:** Your principle successfully identifies when remote effects are *empirically* weighty (Cases 2 and 5), but it fails to distinguish between **epistemic cluelessness** (Case 3, where we default to heuristics) and **normative boundaries** (Case 4, where we reject the calculus). It also fails to explain why compounding uncertainty in Case 3 leads to a shrug rather than a demand for better calculation.

  ### 2. The Repaired Principle

  To save the verdicts, we must amend the principle to account for *leverage*, *robustness*, and *normative jurisdiction*.

  **The Principle of Tractable Marginal Impact:**
  Remote effects are legitimate grounds for decision *only if*:
  1.  **Non-Screened Leverage:** The causal chain is not screened off by institutional aggregation or market replacement (saving Cases 1 & 2).
  2.  **Axiological Stability:** The value of the remote outcome does not depend on resolving deep, unresolved disputes about what makes the future good (saving Case 5).
  3.  **Normative Jurisdiction:** The choice does not fall within a protected sphere of personal sovereignty where impersonal calculus is excluded (saving Case 4).

  *Corollary on Cluelessness:* Where remote effects dominate but violate condition (2) (epistemic opacity), uncertainty is paralyzing *unless* a robust near-term proxy exists. If a proxy exists, uncertainty becomes inert regarding the remote claim, and decision reverts to the proxy (saving Case 3).

  ### 3. Predictions for New Scenarios

  **(a) Adopting a standing policy of giving a fixed share of income to whatever looks best on near-term evidence.**
  *   **Prediction:** **Legitimate and Recommended.**
  *   **Reasoning:** This is a direct application of the Cluelessness Corollary. Deciding gift-by-gift invites Case 3 paralysis (deep uncertainty about remote impact per dollar). A standing policy acts as a heuristic that screens off the need to estimate remote effects for every marginal decision. It reduces decision costs and prevents the "compounding guesswork" of trying to outsmart the market/epistemic landscape on every transaction.

  **(b) Funding something that widens the spread of remote outcomes without moving the mean.**
  *   **Prediction:** **Illegitimate (or at least inert).**
  *   **Reasoning:** This violates **Axiological Stability**. To prefer higher variance, you must assert that the tail outcomes (good or bad) are disproportionately valuable or disvaluable. Without a settled theory of risk-weighted value over centuries, this is pure speculation. It fails the "tractable" test; you are betting on a distribution shape you cannot verify. Unless the downside is existential (which moves the mean to zero), this is mere gambling disguised as altruism.

  **(c) Acting when the value of what I do depends partly on what a much richer and better-informed future generation will want.**
  *   **Prediction:** **Paralysis / Deferral.**
  *   **Reasoning:** This triggers **Axiological Stability** failure. If the value of your action is contingent on future preferences, and those preferences are unknowable (and potentially incommensurable with yours), you lack a stable value function. You cannot maximize for a target you cannot see. The rational move is either paralysis or a "lock-in" strategy (trying to preserve option value), but not a confident judgment of goodness.

  ### 4. Unsaved Verdicts

  The repaired principle cannot fully save **Case 4 (Having a Child)**.

  The principle *describes* why you reject the calculation (it falls outside Normative Jurisdiction), but it cannot *justify* that boundary from within a consequentialist framework. If the remote effects of having a child are objectively larger than the remote effects of donating to bed nets (which they likely are, via descendants), a strict consequentialist principle must demand you calculate them.
  Your resentment signals a conflict between **Impersonal Value** (the principle) and **Personal Integrity** (the verdict). The principle can only save this verdict by admitting a deontological constraint ("some choices are not for sale") which sits uneasily with the rest of your framework which happily calculates labour market effects in Case 2. You are left with a remainder: a sphere of life that you insist must remain opaque to the very calculus you use to navigate the rest of the world.

  ### 5. Phenomenology of Paralysis: Case 3 vs. Case 5

  The paralysis in Case 5 is **not** the same phenomenon as the paralysis in Case 3.

  *   **Case 3 (Charity) is Epistemic Cluelessness.**
      *   *Structure:* "I know what is good (lives saved), but I cannot trace the causal chain."
      *   *Resolution:* You resolve this by **satisficing**. You accept a robust near-term proxy (bed nets) because the remote signal is too noisy. The paralysis is broken by a heuristic. You act, but without conviction about the *total* impact.
  *   **Case 5 (Population Policy) is Axiological Indeterminacy.**
      *   *Structure:* "I can trace the causal chain (more people), but I do not know if the outcome is good."
      *   *Resolution:* There is no heuristic. You cannot proxy "goodness" with near-term data because the dispute is about the *nature* of the good itself (e.g., Total View vs. Average View vs. Person-Affecting View). The paralysis is not broken by a shrug; it is a fundamental stall in the value system.

  In Case 3, you trust your values but doubt your map. In Case 5, you trust your map (empirically) but doubt your compass. The former allows a default; the latter demands a philosophical revolution before action can be legitimate.
