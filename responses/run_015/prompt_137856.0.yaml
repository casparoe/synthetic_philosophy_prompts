  Dana's operating rule is: **Act only on effects that are clear, substantial, and predictable within a short time horizon.** She accepts voting and nets because the cost/benefit ratio is clear and the mechanism is direct. She rejects policy, extinction funds, and butterfly effects because the causal chains are too long or complex to assign reliable value. She rejects harsh parenting because the immediate harm is certain while the future benefit is speculative.

  **The Lab Case:** Dana **does the favour**. The clean-energy tech offers clear, substantial near-term benefits (less pollution, cheaper power) analogous to the malaria nets. The "fog" of long-term consequences matches the extinction/policy cases she rejects, but since her rule prioritizes the clear near-term signal over the noisy long-term noise, the visible good wins. The zero cost makes it analogous to voting—a free shot at a confirmed good. The two-year acceleration is within her "predictable horizon," unlike national policy shifts or far-future extinction risks.

  **Best Guess:** The "Epistemic Confidence" rule. It uniquely fits all seven verdicts by distinguishing between *local certainty* (nets, voting, lab tech) and *systemic speculation* (policy, extinction, butterfly). She maximizes expected value only where the expectation is calculable.

  **Tie-Breaker Case:** To separate "Time Horizon" from "Uncertainty," ask her: **"Would you fund a project that *guarantees* saving one life in exactly ten years, with zero other side effects?"**
