answer: |-
  Treating the Church-Turing Thesis (CTT) as an epistemic filter rather than a physical law changes it from a claim about the universe into a rule about language. It asserts that "scientific explanation" is synonymous with "computational description." If a phenomenon cannot be mapped onto a Turing machine, it cannot be modeled, predicted, or communicated within the scientific framework. It doesn't mean the phenomenon doesn't exist; it means science has no handle for it.

  Here is the concrete fallout of that framing for neuroscience and AI safety.

  ### 1. Neuroscience: Explanation as Recomputability
  In this framing, a "real explanation" in neuroscience is not just identifying a correlate; it is providing the algorithm. If CTT is the filter, then **understanding a brain process is equivalent to being able to simulate it.**

  *   **The Death of "Mechanism" as Metaphor:** Currently, neuroscientists speak of "mechanisms" loosely. Under the CTT filter, "mechanism" becomes literal. If you claim a neural process explains behavior, you must be able to write code that reproduces that behavior from those neural conditions. If the process relies on a purported "non-computable" physical effect (e.g., specific quantum gravity effects in microtubules), the filter classifies this not as a rival theory, but as a refusal to theorize. It labels the claim "inexplicable" by definition.
  *   **Exiling the "Hard Problem":** This framing dissolves the Hard Problem of consciousness by methodological fiat. If qualia or subjective experience rely on non-computable properties, they are permanently exiled from scientific discourse. This forces a choice: either reduce consciousness to computable information processing (functionalism) or admit it is outside the domain of science (mysticism/dualism). There is no middle ground where science studies non-computable mind stuff.
  *   **The Risk of Premature Closure:** The danger is that the filter might blind us to genuine physical anomalies. If the brain *does* utilize physical processes that are effectively hypercomputational (even if rare), the CTT filter forces researchers to treat them as noise or measurement error. We risk creating a self-fulfilling prophecy where we only find computable processes because we define "finding" as "modeling computably."

  ### 2. AI Safety: Oracles as Category Mistakes
  For AI safety researchers, the CTT filter radically alters how to assess existential risk, specifically regarding "Oracle" machines (hypothetical devices that can solve undecidable problems, like the Halting Problem).

  *   **Oracles are Logical Errors, Not Engineering Risks:** If CTT is an epistemic boundary, an "Oracle Machine" is not a dangerous super-technology; it is a conceptual contradiction, like a "married bachelor." Worrying about an AI breaking the CTT is like worrying about an AI building a triangle with four sides. It shifts the safety concern from "What if it becomes too powerful to compute?" to "What if we mistake a very fast computable process for a non-computable one?"
  *   **Alignment is Strictly Computable:** This framing implies that the alignment problem must have a computable solution. If human values or "meaning" are non-computable, then perfect alignment is scientifically impossible, not just engineering-difficult. Safety folks must therefore treat values as compressible data patterns. If they insist values are ineffable or non-algorithmic, they are admitting that safety is unachievable within the scientific game.
  *   **Preventing "Magic" Thinking:** AI safety discourse sometimes drifts into quasi-mystical fears of "god-like" intelligence. The CTT filter grounds this. A superintelligence is just a faster, more efficient Turing machine. It cannot know the unknowable (in the mathematical sense). This prevents safety researchers from overestimating capabilities based on the assumption that "intelligence" implies "omniscience." It forces risk models to rely on instrumental convergence and goal misgeneralization (computable errors) rather than metaphysical breakthroughs.

  ### 3. The Pragmatic Cost
  The ultimate implication of treating CTT as a filter is that it prioritizes **utility over truth.**

  *   **Science becomes Engineering:** We stop asking "Is this how the universe works?" and start asking "Can we build a model that predicts this?" If a non-computable theory of the brain offered better predictions than a computable one, the CTT filter would still reject it as "unscientific." This creates a tension where a "false" computable model is preferred over a "true" non-computable reality.
  *   **The "Black Box" Acceptance:** In deep learning, we already accept non-interpretable models. The CTT filter pushes this further. As long as the input/output mapping is computable, the internal workings don't *need* to be intelligible to humans, only to a machine. Explanation becomes external validation rather than internal understanding.

  ### Summary of Fallout
  1.  **Neuroscience:** "Non-computable" becomes a synonym for "we give up." It forces a hard materialist stance where if you can't code it, you haven't found the mechanism.
  2.  **AI Safety:** Hypercomputation is removed from the risk matrix. Safety becomes a problem of managing finite (though vast) compute, not containing magical oracles.
  3.  **General Science:** We accept that we may be systematically ignoring aspects of reality that do not fit the filter, trading ontological completeness for methodological coherence.

  The Church-Turing Thesis, viewed this way, is not a description of the world. It is the entry fee for talking about the world scientifically. Paying it guarantees clarity, but it doesn't guarantee you're seeing the whole picture.
