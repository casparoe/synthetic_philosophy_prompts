      *   **Consequentialism (Utilitarianism):** Punishment based on *outcome*.
          *   **Incapacitation:** Stop them from doing it again (ban them).
          *   **Deterrence:** Make an example so others don't do it.
          *   **Rehabilitation:** Fix the behavior so they return as good users.

  3.  **Evaluate Against the Specific Constraints:**
      *   **Constraint 1: 95% Accuracy.** This is huge. 5% false positive means innocent people get banned. Retributivism hates punishing the innocent. Consequentialism might accept it if the net utility is high, but user trust (long-term utility) suffers.
      *   **Constraint 2: Sockpuppets/Rotation.** Perma-bans don't work well technically. Spammers just make new accounts. This weakens Incapacitation.
      *   **Constraint 3: Feed Quality.** Letting spam stay ruins the product for everyone. This strengthens the need for action (Incapacitation/Deterrence).
