      *   *Idea:* Compare a thermostat (homeostatic but no valence?) vs. the specific RL agent described. Or better: Compare an agent maximizing external points vs. an agent minimizing internal deviation.
      *   *Refinement:* Ask them to identify which structural feature is *necessary* for valence in a modified scenario.

  7.  **Determining Out-of-Scope Literature:**
      *   Keep it focused on the structural analogy.
      *   Exclude: Detailed neuroscience (Panksepp, Damasio), Specific Global Workspace architectures, Panpsychism debates, Hard Problem metaphysics.
      *   Include/Name as excluded: Neurophenomenology, Specific Architectural Blueprints (e.g., LIDA, CogAff).

