answer: |-
  # Q&A Prep Sheet: Moral Trade & Moral Uncertainty

  **Audience Profile:** ~20 EAs, mostly utilitarian, fellowship grads, strong cause prioritization views. Mix of longtermists and neartermists.
  **Goal:** Defend moral trade as a rational implication of moral uncertainty, not a distraction.
  **Time per reply:** ~2 minutes (approx. 250–300 words spoken at moderate pace).

  ---

  ### 1. The "Compromising on Truth" Objection
  **Q:** "If I'm 90% confident that saving lives is the most important thing, and you're 90% confident that protecting rights is, why should I trade? If I'm right, trading makes the world worse. Isn't this just moral cowardice disguised as uncertainty?"

  **Reply:**
  "It feels like cowardice, but mathematically, it's expected value maximization. If you assign even 10% credence to the other person's framework, refusing to trade is effectively betting that your 90% is absolute truth.
  Consider the stakes. If you trade, you give up some resources for a cause you think is 10% less valuable to secure a win in a cause you think is 10% *more* valuable (according to your rival's lights). If you both have uncertainty, the 'gain from trade' comes from hedging against the risk that *you* are the one who is wrong.
  By refusing, you're saying, 'My 90% credence is worth more than the potential disvalue of violating the other moral framework.' But if the other framework involves serious rights violations or suffering, the downside risk of being wrong is massive. Moral trade isn't about abandoning truth; it's about acknowledging that under deep moral uncertainty, maximizing expected choiceworthiness often looks like compromise. Refusing to trade is only rational if your credence in your own view is near 100%, which, for most of us, is epistemically unjustified."

  **Weakness:** This relies heavily on the audience accepting "expected choiceworthiness" as the decision metric. Hardline moral realists who reject moral uncertainty frameworks will find this circular.

  ### 2. The Longtermist Impact Objection
  **Q:** "I'm a longtermist. I think existential risk reduction is orders of magnitude more important than neartermist causes. If I trade with a neartermist, I'm effectively subsidizing work that I believe is almost worthless. Doesn't this dilute the impact of the EA movement?"

  **Reply:**
  "I understand the fear that this becomes a tax on longtermism. But remember, moral uncertainty runs both ways. Even if you assign low probability to neartermist views, do you assign *zero*? If there's a non-zero chance that nearterm suffering is critically important, or that longtermist strategies have unforeseen downsides, trade allows you to hedge.
  More importantly, trade isn't about agreeing on cause prioritization; it's about finding overlapping value. A longtermist might value reducing suffering today because it stabilizes society, reducing x-risk. A neartermist might value x-risk reduction because it ensures future beings exist to enjoy the rights they care about.
  If you refuse to trade, you're forcing an all-or-nothing bet on a timeline you can't verify. If the longtermist calculus is even slightly off, the opportunity cost of ignoring nearterm suffering could be huge. Trade lets you capture value in the worlds where your rival is right, without abandoning your primary mission in the worlds where you are."

  **Weakness:** If the longtermist's credence in neartermist causes is genuinely tiny (e.g., <1%), the EV of trade collapses. This reply struggles if the audience member is a "hard" longtermist.

  ### 3. The Verification Problem
  **Q:** "Okay, theoretically it works. But practically, how do I verify you actually did your side of the trade? If I donate to your cause, how do I know you didn't just keep the money or donate to something else? It seems unverifiable."

  **Reply:**
  "This is the biggest practical hurdle, but it's not a theoretical killer. We solve verification problems in law and finance all the time using escrow, smart contracts, or trusted third parties. In the EA community, we have a high-trust network and public donation logs.
  For small-scale trades, reputation is the enforcement mechanism. If you defect, you're out of the market. For larger trades, you can structure them as conditional pledges or use donor-advised funds with specific restrictions.
  We shouldn't let perfect verification block good-faith cooperation. Standard charitable giving also lacks perfect verification—we trust charities to use funds well. Moral trade just adds a layer of reciprocal accountability. It's harder than writing a check, but the 'transaction cost' is the price of managing moral uncertainty."

  **Weakness:** It hand-waves the "smart contract" solution which doesn't really exist for this yet. High friction remains a valid deterrent.

  ### 4. The Distraction Objection
  **Q:** "EA is about finding the *best* cause and focusing on it. Doesn't spending time negotiating trades distract us from actually doing the work or researching the truth?"

  **Reply:**
  "If moral trade creates positive expected value, then negotiating it *is* doing the work. It's not a distraction; it's a force multiplier.
  Think of it like diversification in finance. Spending time rebalancing a portfolio isn't 'distraction' from investing; it's risk management. If we spend five hours negotiating a trade that unlocks $100k of effective funding that otherwise would have been deployed sub-optimally due to moral dogmatism, that's a high-leverage activity.
  The real distraction is ideological infighting. Moral trade turns conflict into cooperation. It shifts energy from 'why you are wrong' to 'how we can both win given our uncertainty.' That cultural shift might be more valuable than the trades themselves."

  **Weakness:** It assumes the negotiation costs are low. If trades take months to broker, the opportunity cost of that time could indeed outweigh the gains.

  ### 5. The "Values Aren't Preferences" Objection
  **Q:** "In economics, we trade preferences. But moral values aren't preferences; they're claims about what's *right*. You can't just swap moral truths like commodities. It feels category-error-ish."

  **Reply:**
  "You're right that values aren't preferences, but *action under uncertainty* looks a lot like preference satisfaction. When I'm uncertain about which moral theory is true, I act to maximize my 'expected moral value.'
  In that context, my 'credence' in a theory functions mathematically like a weight or a preference strength. I'm not trading the moral truth itself; I'm trading *resources* based on our differing weights.
  I'm not saying 'murder is okay if I get paid.' I'm saying, 'I'm unsure if X is the priority, and you're unsure if Y is. Let's allocate resources to maximize the joint expected value across our uncertainty distributions.' We aren't commodifying morality; we're commodifying the *allocation of effort* in the face of ignorance."

  **Weakness:** Deontologists in the room may still reject this as consequentializing their duties. It requires accepting a specific meta-ethical framework.

  ### 6. The Extortion Objection
  **Q:** "Doesn't this create perverse incentives? If I know you're willing to trade, I might adopt an extreme moral view just to hold you hostage for resources. It rewards dogmatism."

  **Reply:**
  "That's a valid game-theory concern. If the market rewards extreme claims, people will make them. But moral trade requires *mutual* benefit. I won't trade with you if I think your view is crazy or if I suspect you're gaming the system.
  The mechanism relies on credible credence. If you suddenly claim 99% credence in a weird view to extract value, but your past behavior shows 50%, I won't trust you. Reputation acts as a brake on extortion.
  Also, remember the baseline: without trade, we're in a zero-sum tug-of-war for funding. Trade turns it positive-sum. The risk of extortion is real, but it's manageable through screening and repeated interactions, whereas the cost of *not* trading is guaranteed inefficiency."

  **Weakness:** Screening is hard. A sophisticated bad actor could mimic credible credence better than a honest uncertain person.

  ### 7. The Donor Intent Objection
  **Q:** "Most EA money comes from donors with specific intents. If I'm managing someone else's money, don't I have a fiduciary duty to follow their moral views, not mine? Isn't trading a breach of trust?"

  **Reply:**
  "Only if the donor is morally certain. Most donors give to EA funds *because* they acknowledge they don't know the single best cause. They delegate the prioritization to you.
  If your job is to maximize impact under uncertainty, and moral trade maximizes expected impact, then trade *fulfills* donor intent. You'd only be breaching trust if the donor explicitly said, 'Do not trade with people who value animals over humans.'
  In the absence of explicit restrictions, the fiduciary duty is to the *outcome*, not the dogma. If you can explain to a donor that hedging their moral bets increases the expected value of their donation, a rational donor should approve."

  **Weakness:** Many donors *do* have strong implicit moral views. Explaining "moral uncertainty" to a lay donor is difficult and could lead to PR backlash.

  ### 8. The "Hope Nobody Asks" Question
  **Q:** "If moral trade is rational, why aren't the major funds (OpenPhil, FTX Future Fund) doing it publicly? Are you advocating for something the experts have already rejected?"

  **Reply:**
  "They aren't doing it *publicly*, which is key. Large-scale moral trade involves sensitive information about credences and funding gaps. Publicizing it could lead to market manipulation or reputational risk.
  Also, the EA movement is young. Financial markets took centuries to mature from informal barter to high-frequency trading. We are in the 'informal barter' stage of moral cooperation.
  Just because the biggest players haven't scaled it yet doesn't mean the thesis is wrong; it means the coordination infrastructure isn't built. We are early adopters. If we wait for OpenPhil to validate every strategy, we lose the first-mover advantage on solving coordination failures."

  **Weakness:** This is a bit of a dodge. If it were clearly high-EV, sophisticated actors likely would have piloted it by now. It implies the speaker knows better than the major institutions.
