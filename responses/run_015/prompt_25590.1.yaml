answer: |-
  1. **Definition of the Scenario:** Both parties agree that the canonical "Pascal's Mugging" involves an agent presented with a choice: incur a small certain cost (e.g., $5) or reject a demand from a claimant who asserts that compliance will prevent an astronomically large negative outcome (e.g., the torture of $3 \uparrow\uparrow\uparrow 3$ beings) with a non-zero but extremely low subjective probability.

  2. **Mathematical Implication:** Both parties agree that under standard von Neumann-Morgenstern expected utility theory with an unbounded utility function and standard Bayesian updating, there exists some probability $p > 0$ and some utility magnitude $U$ such that $p \times U > \text{Cost}$, formally mandating compliance.

  3. **Intuitive Conflict:** Both parties agree that the formal recommendation to comply conflicts strongly with pre-theoretic moral and practical intuitions for realistic human agents, creating a tension between formal consistency and intuitive plausibility.

  4. **Relevance to High-Stakes Decision Making:** Both parties agree that resolving this tension is critical for domains involving existential risk mitigation and AI alignment, where actions often involve low probabilities of astronomically high impacts (longtermism).

  5. **Definition of Utility:** Both parties agree to treat "utility" as a formal representation of coherent preference orderings over outcomes, not necessarily as a direct measure of hedonic experience, though they disagree on whether such orderings must be bounded.

  6. **Verbal Dispute Identification:** Both parties acknowledge a potential verbal dispute regarding the term "rational." The EV Maximization camp defines rationality primarily as *internal consistency of preferences* (avoiding Dutch books). The Anti-Unbounded camp defines rationality primarily as *robustness of decision procedures in ecological contexts*. This document treats this as a substantive disagreement about which property is normatively primary, not merely semantic.

  ### Table of Irreconcilable Disagreements and Adjudication Tests

  | Crux | EV Maximization Position (Bullet Biters) | Anti-Unbounded EV Position (Modificationists) | Agreed Test Case / Argument | EV Side Prediction / Verdict | Anti-EV Side Prediction / Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Boundedness of Utility** | Utility functions *must* be unbounded to avoid preference reversals in infinite lotteries. Bounded utility implies an agent would prefer a 100% chance of $X$ over a 50% chance of $X$ plus a tiny chance of $Y$, even if $Y$ is infinitely better than $X$, which violates dominance principles. | Utility functions *must* be bounded because human valuation saturates. An extra life saved matters less when $10^{100}$ lives are already saved. Unbounded utility is a category error when applied to finite agents. | **The Saturation Switch:** An agent must choose between (A) Saving $10^{100}$ lives with certainty, or (B) Saving $10^{100}$ lives with 99% probability and $10^{100} + 1$ lives with 1% probability. | **Choose B.** Any non-zero probability of an additional unit of value outweighs the certainty of the base amount if utility is unbounded. Rejecting this implies valuing the marginal life at zero. | **Choose A (or Indifferent).** At this scale, the marginal utility of one additional life is effectively zero. A rational agent prioritizes the certainty of the vast good over a probabilistic gamble on a negligible increment. |
  | **2. Epistemic Penalties vs. Priors** | Probability should be assigned based solely on description length (Solomonoff prior). There is no extra penalty for "impact magnitude." If a hypothesis is simple to describe, its probability cannot be arbitrarily suppressed just because its consequences are huge. | Probability assignments must include an "impact penalty." Hypotheses that claim leverage over vast amounts of value are inherently more complex to verify, regardless of description length. The prior must shrink faster than the utility grows. | **The Cryptographic Proof:** A mugger offers a cryptographic proof that they control a simulation of $3 \uparrow\uparrow\uparrow 3$ beings. The proof is verifiable but relies on trusting the hardware providing it. | **Comply.** If the proof verifies mathematically, the probability is no longer "tiny." It becomes a standard risk calculation. If $P \times U > Cost$, you pay. Refusal is evidence aversion. | **Reject.** The probability that the hardware is compromised or the proof is misleading scales with the magnitude of the claim. No finite evidence can justify the probability required to overcome the utility asymmetry without inviting spoofing attacks. |
  | **3. Vulnerability to Money Pumps** | Rejecting the mugger makes you vulnerable to a "Sequential Mugging" (Money Pump). If you reject based on a probability threshold, an adversary can present a sequence of muggings that extract all your resources while you remain below the threshold each time. | Rejecting the mugger is a *policy* choice, not a case-by-case decision. A policy of "ignore claims below complexity threshold $K$" is not money-pumpable because the threshold is fixed ex-ante, not updated per interaction. | **The Sequential Offer:** An adversary offers 1,000 independent mugging scenarios in sequence, each with probability $10^{-10}$ and utility $10^{20}$, cost $1. The agent has $1,000 total. | **Pay All.** Each individual EV is positive ($10^{10}$). Refusing any single one is locally irrational. Total expected loss from refusal is massive. | **Pay None.** The policy "ignore low-prob high-impact claims" has higher meta-utility. Accepting leads to resource depletion by spurious claims. The cost of verifying these claims exceeds the expected return in any realistic ecology. |
  | **4. Fanaticism in Resource Allocation** | "Fanaticism" (prioritizing low-prob/high-impact interventions) is the correct moral stance. If saving a potential future of $10^{50}$ lives has even a 0.01% chance, it outweighs saving 1,000 certain lives. | "Fanaticism" leads to moral negligence. Prioritizing speculative futures over certain suffering violates basic contractualist duties to existing beings. Robustness > Max EV. | **The Charity Split:** Allocate $1M between (A) Certain saving of 1,000 people from malaria, or (B) 0.0001% chance of preventing an existential risk affecting $10^{20}$ future beings. | **Allocate 100% to B.** Expected value of B is $10^{14}$ lives vs 1,000 lives. Anything else is morally equivalent to letting the larger number die for vanity. | **Allocate Majority to A.** The uncertainty in B is too deep (model uncertainty, tractability). Moral duty requires helping where impact is verifiable. B is a lottery ticket; A is a duty. |
