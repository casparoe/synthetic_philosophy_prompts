  # Joint Statement on the Ontology of National Origins: A Collaborative Framework

  **Parties:** Radical Modernist Camp (Camp One) and Mnemonic-Substrate Perennialist Camp (Camp Two)
  **Date:** October 26, 2023
  **Subject:** Formalization of Disagreement Regarding Pre-Modern Roots of National Identity

  ### 1. Agreed Claims

  Both camps affirm the following propositions as the baseline for further inquiry:

  1.  **Constructedness of Tradition:** National traditions, symbols, and narratives are actively formulated and disseminated by political and cultural elites rather than emerging spontaneously or organically in their modern political form.
  2.  **Mechanisms of Consolidation:** The consolidation of mass national identity is dependent upon modern technologies of communication (specifically print capitalism) and administrative rationalization (bureaucratic standardization), which were not available in pre-modern periods.
  3.  **Inadequacy of Primordialism:** Accounts positing an unbroken line of political sovereignty or static ethnic unity extending from antiquity to the present are empirically unsupported and ignore the discontinuities of the modern era.
  4.  **Variance in Adherence:** There is observable variance in the velocity and depth with which invented traditions take root; some national projects achieve saturation within a generation, while others fail to secure adherence despite sustained effort.
  5.  **Regional Resistance:** Specific subnational regions frequently resist national identification programs even when subjected to identical state policies, educational curricula, and coercive pressures as successfully assimilated regions.

  ### 2. Residual Disagreement

  The core divergence concerns the causal status of pre-modern cultural forms. The parties agree that pre-modern cultural data exists, but disagree on whether this data exerts independent causal force on modern nation-building outcomes.

  | Issue | Camp One Formulation (Radical Modernist) | Camp Two Formulation (Mnemonic-Substrate Perennialist) |
  | :--- | :--- | :--- |
  | **Causal Status of Pre-Modern Forms** | Pre-modern cultural forms are inert raw material. Their apparent influence is a post-hoc rationalization; successful nations are those where state capacity and media technology successfully selected and amplified specific traits, while unsuccessful ones suffered from insufficient coercive or bureaucratic resources. | Pre-modern cultural forms constitute a durable mnemonic substrate. Successful nations are those where modern political projects map onto structurally stable memory-forms (ritual, linguistic, territorial); where no such mapping occurs, state capacity alone is insufficient to generate enduring identity. |

  ### 3. Empirical Cruxes

  To adjudicate the residual disagreement, the parties identify three specific cruxes. For each, a shared evidentiary standard and paired predictions are recorded.

  1.  **Correlates of Narrative Success**
      *   **Shared Evidentiary Case:** A comparative historical analysis of 19th-century state-building efforts across regions with varying degrees of pre-existing linguistic and religious cohesion, controlling for state fiscal capacity and coercive resources.
      *   **Camp One Prediction:** The speed and depth of national identification will correlate most strongly with metrics of state capacity (tax extraction, conscription rates, school density), with pre-existing cohesion serving as a negligible variable.
      *   **Camp Two Prediction:** The speed and depth of national identification will correlate most strongly with metrics of substrate alignment (linguistic isoglosses, ritual calendar continuity), even when controlling for state capacity; high capacity will fail to produce identity in low-alignment regions.

  2.  **Interpretation of Archival Silence**
      *   **Shared Evidentiary Case:** Archaeological and anthropological assessment of non-elite material culture and oral traditions in periods lacking written vernacular records, compared against written administrative archives from the same periods.
      *   **Camp One Prediction:** Archival silence regarding collective political identification indicates an actual absence of such identification; non-elite material culture will show no evidence of large-scale coordinated identity distinct from local kinship or lordship.
      *   **Camp Two Prediction:** Archival silence reflects preservation bias favoring elite Latin/administrative records; non-elite material culture and ritual sites will demonstrate continuous patterns of collective identification that differ in scale from modern nations but provide the structural basis for them.

  3.  **Impact of Ritual Disruption**
      *   **Shared Evidentiary Case:** Natural experiments involving states that intentionally disrupted long-cycling ritual calendars or territorial cult structures (e.g., revolutionary calendar reforms, forced religious conversion, colonial administrative restructuring) compared to control groups where such structures were left intact.
      *   **Camp One Prediction:** Regions where ritual calendars were disrupted will show no measurable difference in national identification outcomes compared to control groups, provided institutional conditions (schools, media, laws) are identical.
      *   **Camp Two Prediction:** Regions where ritual calendars were disrupted will show measurably weaker national identification and higher rates of internal fragmentation compared to control groups, even under identical institutional conditions.

  ### 4. Verbal vs. Substantive Dispute Analysis

  The collaborating parties conclude that the dispute is **predominantly substantive**, though a minor verbal ambiguity exists regarding the operational definition of "substrate."

  *   **Substantive Core:** The disagreement concerns causal ontology. Camp One posits that state power is a sufficient cause for national identity formation, while Camp Two posits that state power is a necessary but insufficient cause that requires alignment with pre-existing memory structures. This is an empirical claim regarding predictive variance, not merely a difference in terminology.
  *   **Verbal Component:** Ambiguity arises if Camp One accepts "substrate" as a neutral descriptor for "pre-existing cultural variance" without implying causal constraint. If the term is re-described as "historical contingency," Camp One agrees it exists but denies it constrains outcomes. Camp Two insists the term "substrate" must imply constraint.
  *   **Resolution:** Clarifying this terminology does not dissolve the disagreement but isolates it. The dispute remains substantive regarding whether historical contingency exerts a "gravitational pull" on political engineering (Camp Two) or whether political engineering simply selects from contingency without resistance (Camp One). No portion of the dispute is purely verbal such that re-description would eliminate the need for empirical testing.
