      *   *Correction:* I need to be precise. (1) says "evaluate... by standards available within." (4) says "identify... in a non-relativist register." These are logically contradictory if applied to the same object.
      *   *Solution:* The object must differ. (1) applies to *intentions/motivations*. (4) applies to *outcomes/institutions*. Or, (1) must be downgraded from a normative rule to a heuristic for understanding.
      *   *Best Revision:* Modify (1) to restrict "evaluation" to *rationality relative to goals*, while reserving *moral evaluation* for (4). Or, admit that (1) is a presumption of *charity*, not a prohibition on *judgment*.

  8.  **Final Polish:** Ensure tone is rigorous, philosophical, and directly answers the prompt's constraints (order by severity, distinguish apparent vs. structural, specify revision).

      *(Self-Correction on "Cheapest Revision"):*
      If I weaken (1), I admit that historians *do* judge past agents by present standards sometimes.
      If I weaken (4), I admit morality is relative. (Too high a cost for most).
      If I weaken (5), I make history more moralistic. (High cost to disciplinary identity).
      *Decision:* Weakening (1) is the standard move in modern historiography (e.g., "critical empathy"). The cost is losing the "pure contextualist" high ground.

      *Wait, is there a better way?*
      What if (5) does the heavy lifting? If moral evaluation is secondary, maybe (1) applies to the *primary* task (explanation) and (4) applies to the *secondary* task (evaluation).
      *Critique:* (1) says "historians ought to evaluate..." It doesn't say "in their explanatory capacity." It's a general normative claim.
      *Verdict:* (1) is the weak link. It claims a monopoly on evaluation that (4) breaks.

      *Let's look at 2 vs 3 again.*
      Is it possible that (3) *necessitates* Whiggism? Not necessarily. I can be concerned about climate change (present concern) and study the Industrial Revolution without claiming the Industrial Revolution was "progress." I can study it as the origin of a problem. So 2 vs 3 is definitely "apparently at odds."

      *Let's look at 1 vs 4 again.*
      Is it structurally incompatible?
      (1) Evaluate agents by *their* standards.
      (4) Slavery is a *cross-cultural* wrong (implies *our* standards or *universal* standards apply).
      If I evaluate a slaveholder by *their* standards, they pass.
      If I evaluate slavery by *cross-cultural* standards, it fails.
