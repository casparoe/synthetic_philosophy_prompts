      *   *Section 4: Conclusion.* Summary of the revised position.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the specific worry about (2) and (3)? Yes, need to emphasize that *selection bias* $\neq$ *teleological narrative*.
