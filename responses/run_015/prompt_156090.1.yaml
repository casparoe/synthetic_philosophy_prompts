      If (1) holds, the agent is *not* wrong (relative to their framework).
      If (4) holds, the practice is *wrong* (trans-historically).
      Does participating in a wrong practice make the agent wrong?
      If yes -> 1 and 4 clash.
      If no -> 1 and 4 compatible (The "Good Nazi" problem, essentially).
      Most moral realists would say participating in a fundamental wrong makes the agent culpable, regardless of local norms (ignorance of law/morality is no excuse).
      So, (1) and (4) are *structurally incompatible* unless (1) is significantly qualified.

