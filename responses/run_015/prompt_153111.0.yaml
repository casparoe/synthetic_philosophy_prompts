prompt: |-
  I'm teaching an undergraduate seminar that pairs W. E. B. Du Bois's 1926 essay on art as propaganda with Ralph Ellison's novel Invisible Man, and I want a close reading that takes both the novel and Du Bois's argument seriously enough to let each complicate the other, rather than settling for the standard classroom cliché that Ellison simply rejected the propagandistic protest fiction Du Bois demanded. As I understand Du Bois, his thesis is not just the empty sociological claim that every artwork has some effect on someone; it is the normative claim that artists, and especially Black artists working under white supremacy, must accept that their work is always in the business of shaping belief, desire, and perception, and must therefore take responsibility for the propaganda they make, while also insisting that propaganda in the service of what he regarded as truth and human flourishing is categorically different from propaganda in the service of lies and dehumanization.

  To get my students past the exhausted art-for-art's-sake-versus-protest-literature binary, I've been developing a distinction in my own notes that I want you to test. I use the term directive propaganda for any artwork whose primary aim is to get its audience to accept a specific proposition, party line, or call to action; I use the term propaganda of the sensorium for any artwork that, without necessarily issuing directives, reshapes what its audience can perceive, enjoy, imagine, or love, and thereby changes the conditions under which later beliefs and actions become possible. I suspect Du Bois's real interest is in the second category: when he insists that Black folk must gain the freedom to experience love and joy as part of full humanity, he is asking for more than novels that denounce Jim Crow, and he is also asking for something different from art that is merely beautiful in a raceless way. Read Invisible Man through this distinction and through Du Bois's essay.

  In particular, I want you to examine at least three moments: the prologue, in which the invisible narrator lights his basement with dozens of purloined light bulbs and insists he is not a spoiler or a revolutionary; the paint factory episode, in which the narrator's technical precision accidentally produces an explosion after he has been told to make the paint whiter than white; and the narrator's final seclusion, where he remains in his underground hole writing the very book we are reading rather than returning to the Brotherhood or to Harlem's streets. Does the novel vindicate Du Bois, showing that even a work that mocks directives is still reshaping the sensorium of its readers? Does it complicate Du Bois by suggesting that the most politically indispensable propaganda may be propaganda the artist refuses to own as propaganda, or that a work can be duplicitously directive while pretending only to cultivate perception? Where does Ellison's novel resist the Du Boisian reading altogether, say, in the narrator's refusal to be a representative Black voice, in the novel's treatment of the Brotherhood's tracts, or in its suspicion that any claim to speak for the race is already a kind of capture? Please don't quote the novel verbatim; paraphrase its major scenes and analyze them instead. End by saying what the novel adds to the philosophical debate about art and propaganda that neither Du Bois's essay nor a purely theoretical distinction like mine can supply on its own.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Undergraduate seminar pairing W. E. B. Du Bois's "Criteria of Negro Art" (1926) with Ralph Ellison's *Invisible Man* (1952).
      *   **Goal:** A close reading that complicates the standard "Ellison rejected Du Bois" narrative. Avoid the "art-for-art's-sake vs. protest literature" binary.
      *   **User's Framework:**
          *   *Directive Propaganda:* Art aiming for specific propositions/actions (party lines).
          *   *Propaganda of the Sensorium:* Art reshaping perception, enjoyment, imagination, love (conditions for belief/action).
          *   *Interpretation of Du Bois:* User argues Du Bois cares more about the *sensorium* (freedom to experience love/joy/full humanity) than just sociological denunciation.
      *   **Specific Tasks:**
          *   Examine three moments: The Prologue (light bulbs), The Paint Factory (Optic White), The Epilogue/Seclusion (writing the book).
          *   Evaluate: Does the novel vindicate Du Bois? Complicate him (refusing to own propaganda)? Resist him (refusal of representation)?
          *   Constraint: Do not quote verbatim; paraphrase and analyze.
          *   Conclusion: What does the novel add to the philosophical debate that neither Du Bois nor the theoretical distinction can supply alone?

  2.  **Deconstruct the Theoretical Framework:**
      *   *Du Bois:* Often misread as demanding sociological pamphlets. The user's reading is nuanced: Du Bois wants *Truth* and *Humanity* propagated. If Black humanity is denied, art must assert it. This aligns well with "Propaganda of the Sensorium."
      *   *Ellison:* Often misread as an aestheticist who hated protest. *Invisible Man* is deeply political but skeptical of *organized* political directives (The Brotherhood).
      *   *The Synthesis:* The user's distinction allows us to see *Invisible Man* not as a rejection of propaganda, but as a shift from *directive* to *sensorial* propaganda. The novel *is* propaganda in the Du Boisian sense (shaping perception of Black humanity) while rejecting *directive* propaganda (The Brotherhood's scripts).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the user's framework. Validate the reading of Du Bois (it's accurate to the text of "Criteria"). State the thesis: *Invisible Man* performs "propaganda of the sensorium" while explicitly satirizing "directive propaganda," thus fulfilling Du Bois's deeper mandate while critiquing his potential misinterpretations.

      *   **Moment 1: The Prologue (The Light Bulbs):**
          *   *Scene:* Narrator in the hole, stealing electricity, bathing in light, listening to Louis Armstrong.
          *   *Analysis:* This is pure sensorium. He isn't issuing a manifesto yet. He is asserting his right to *feel* and *perceive*.
          *   *Du Bois Connection:* Du Bois wants Black folk to experience beauty and truth. The narrator insists on his own visibility through light, even if society says he's invisible.
          *   *Complication:* He admits he's not a revolutionary (directive). He is cultivating a state of being. This vindicates Du Bois's claim that art must affirm humanity, not just fight laws.

      *   **Moment 2: The Paint Factory (Optic White):**
          *   *Scene:* Mixing paint, told to add drops to make it whiter, causes explosion.
          *   *Analysis:* This is the danger of *directive* propaganda. The factory wants a specific outcome (Whiteness) that requires erasing the blackness (the narrator) or the chemical reality. The "perfect white" is a lie.
          *   *Du Bois Connection:* Du Bois warns against propaganda for *lies*. Optic White is propaganda for the lie of racial erasure.
          *   *Complication:* The narrator's technical precision (skill/art) is co-opted for a lie. When he disrupts it (accidentally), he reveals the instability of the "White" ideal. This shows the *risk* of the sensorium: it can be hijacked by directive powers (Lucy/Brockway).

      *   **Moment 3: The Seclusion/Writing (The Epilogue):**
          *   *Scene:* Narrator stays underground, writes the book, asks "Who knows but that, on the lower frequencies, I speak for you?"
          *   *Analysis:* He refuses to join the Brotherhood (directive). He writes the book we are reading.
          *   *Du Bois Connection:* Is this propaganda? Yes. It shapes the reader's sensorium. But he refuses to *own* it as a tool for a party.
          *   *Complication:* The "Who knows..." line is crucial. It's not a directive ("You must do X"). It's an invitation to perception. It fulfills Du Bois's "Truth" requirement without the "Party Line."
          *   *Resistance:* The narrator refuses to be a "representative Negro." Du Bois sometimes leaned on the "Talented Tenth" representing the race. Ellison says representation itself is a trap.

      *   **Synthesizing the Debate (Vindication vs. Complication vs. Resistance):**
          *   *Vindication:* The novel *does* reshape the sensorium. It makes the reader feel invisibility. It asserts Black humanity (complexity, suffering, joy).
          *   *Complication:* It suggests that admitting you are making propaganda (even good propaganda) can be a trap. The Brotherhood's tracts are directive propaganda. The novel is sensorial propaganda that *denies* being directive to remain honest.
          *   *Resistance:* The refusal of "representative" status. Du Bois wanted art to vindicate the Race. Ellison wants art to vindicate the *Individual* within the race, fearing that "Race Vindication" becomes its own cage.

      *   **Conclusion (What the Novel Adds):**
          *   Theory (Du Bois/User) talks *about* art. The Novel *enacts* the problem.
          *   It shows the *temporal* aspect: Sensorial change takes time (hibernation). Directive change wants immediate action.
          *   It shows the *risk*: Even sensorial propaganda can be co-opted (Brotherhood trying to use him).
          *   It adds the dimension of *irony* and *ambiguity* as political tools. Du Bois seeks Truth; Ellison suggests Truth is found in navigating the lie of invisibility.

  4.  **Refining and Polishing:**
      *   *Tone:* Academic, respectful, engaging with the user's specific terminology ("directive," "sensorium").
      *   *Check Constraints:* No verbatim quotes. Paraphrase scenes. Ensure all three moments are covered. Ensure the conclusion addresses the "what does the novel add" prompt.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Ellison agrees." I need to show the tension. Du Bois says "All art is propaganda." Ellison says "I'm not a propagandist" while writing a book that propagates a specific vision of reality. The tension is in the *naming* and the *intent*.
      *   *Focus on the User's Du Bois Reading:* The user insists Du Bois isn't just asking for sociological data but for the *freedom to experience love and joy.* I must highlight how the Prologue (music, light) fits this specifically.

  5.  **Final Review against Prompt:**
      *   Pair Du Bois 1926 & Invisible Man? Yes.
      *   Avoid cliché (Ellison rejected Du Bois)? Yes.
      *   Use User's Distinction (Directive vs. Sensorium)? Yes.
      *   Three Moments (Prologue, Paint, Seclusion)? Yes.
      *   No verbatim quotes? Yes.
      *   Conclusion on what the novel adds philosophically? Yes.

  6.  (Mental Outline of the Response)
      *   Intro: Validate the framework. Propose that *Invisible Man* is the ultimate "Propaganda of the Sensorium."
      *   Prologue: Light/Music = Affirmation of Humanity (Du Boisian joy) vs. Rejection of Revolutionary Label (Anti-Directive).
      *   Paint Factory: The violence of Directive Propaganda (Optic White) vs. The chaotic truth of the Sensorium (Explosion).
      *   Seclusion: The act of writing as Sensorial Propaganda that refuses the "Representative" burden.
      *   Synthesis: Where they diverge (Representation).
      *   Conclusion: The Novel provides the *phenomenology* of propaganda, not just the theory.

  7.  *Drafting the content...* (Proceeding to generate response based on these thoughts).
answer: |-
  This is a sophisticated pedagogical framework that rescues Du Bois from the caricature of a moralizing sociologist and Ellison from the caricature of an aloof aesthetician. Your distinction between *directive propaganda* (aimed at specific action or assent) and *propaganda of the sensorium* (aimed at reshaping the conditions of perception and feeling) is exceptionally productive. It aligns closely with a nuanced reading of Du Bois's "Criteria of Negro Art," where his insistence on "Truth" is not merely factual accuracy but an ontological claim: Black people must be permitted to exist as complex, feeling subjects in the cultural imagination before they can be liberated as political citizens.

  Read through this lens, *Invisible Man* does not reject Du Bois's mandate; rather, it enacts the *propaganda of the sensorium* while staging a fierce critique of *directive propaganda*. The novel suggests that in a society built on racial fabrication, the most radical political act is not issuing a new directive, but recalibrating the reader's sensory and emotional capacity to recognize humanity where it has been systematically denied.

  Here is an analysis of the three moments you selected, testing your distinction against the text.

  ### 1. The Prologue: Illumination as Sensorial Assertion
  In the opening sequence, the narrator describes his hibernation in a basement cellar, illicitly wired with over a thousand light bulbs stolen from the city grid. He bathes himself in this excess of light while listening to a Louis Armstrong record on his phonograph. He explicitly tells the reader he is not a "spoiler" or a revolutionary; he is not issuing a call to arms or demanding the redistribution of electricity.

  Through your framework, this is a pure instance of *propaganda of the sensorium*. The narrator is not arguing a proposition; he is staging an experience. He is asserting his right to consume energy, to inhabit space, and to feel the vibration of music in his bones. This vindicates your reading of Du Bois: the demand is not initially for legislation, but for the freedom to experience joy, beauty, and intensity. By forcing the reader to visualize this absurd, glowing underground chamber, Ellison reshapes our perception of Black interiority. We are not asked to sign a petition; we are asked to witness a man claiming the right to *see* and *be seen* on his own terms, even if that visibility is confined to a hole.

  However, this moment also complicates Du Bois. Du Bois assumes the artist accepts the role of the propagandist. Here, the narrator insists he is *not* a propagandist. He frames his lighting of the bulbs as a personal necessity, not a public statement. This suggests that for the Black artist, owning the label of "propagandist" might be a trap. If he admits his art is propaganda, he invites the audience to judge it by its political utility (directive) rather than its human truth (sensorial). By denying the directive label, he protects the sanctity of the sensorial experience.

  ### 2. The Paint Factory: The Violence of Directive Whiteness
  The episode at the Liberty Paints plant offers a terrifying allegory for the mechanics of *directive propaganda*. The narrator is tasked with mixing a pigment called "Optic White," which is marketed as the whitest white possible. He is instructed by his supervisor to add ten drops of a dark liquid to the base, which ostensibly makes the paint whiter. The process requires absolute adherence to the formula; deviation is not permitted. When the narrator, confused by the paradox of using black drops to make white paint, disrupts the mixing process, the tanks explode.

  This scene dramatizes the danger of *directive propaganda* in the service of a lie. The "Optic White" brand is a directive command to the consumer: *Accept this surface as pure.* It requires the erasure of the black component that actually stabilizes the mixture. The factory represents a social order that demands Black labor and presence but requires that Blackness be chemically altered or hidden to maintain the illusion of White purity.

  In Du Boisian terms, this is propaganda for dehumanization. It shapes the sensorium to value whiteness above all else. The explosion occurs when the narrator's confusion (a failure of the directive) meets the material reality of the chemicals. Ellison suggests that *directive propaganda* is inherently unstable because it relies on a falsehood about reality. The novel argues that *propaganda of the sensorium* must first expose this instability. By showing the reader the absurdity of the formula, Ellison does not tell us to unionize or strike (directive); he makes us feel the volatility of a racial order built on contradictory logic. He reshapes our perception of "purity" itself, revealing it as a product of hidden mixtures.

  ### 3. The Seclusion and the Book: Refusing Representation
  In the final pages, the narrator explains why he remains underground rather than returning to the streets of Harlem or rejoining the Brotherhood (the novel's stand-in for the Communist Party). He decides to write the memoir we have just read. He concludes by asking whether, on the "lower frequencies," he might speak for the reader, while simultaneously insisting he is not a leader or a representative man.

  This is the crux of the tension between Ellison and Du Bois. Du Bois often operated under the burden of representation, believing that Black art must vindicate the Race to the world. The Brotherhood in the novel operates on *directive propaganda*: they have scripts, slogans, and a specific vision of history that the narrator is told to articulate. When the narrator tries to speak from his own experience rather than the Party line, he is reprimanded.

  By rejecting the Brotherhood and choosing to write his own story, the narrator rejects *directive propaganda*. However, by publishing that story, he is inevitably engaging in *propaganda of the sensorium*. He is attempting to infect the reader's imagination with his specific vision of invisibility. Yet, he resists the Du Boisian impulse to be a "representative Negro." He explicitly states he is an individual. This complicates Du Bois's thesis. It suggests that even "truthful" propaganda becomes a cage if it requires the artist to speak *for* the race rather than *from* their own specific humanity. The novel posits that the only way to achieve the human flourishing Du Bois desires is to refuse the assignment of being a racial spokesperson. The "propaganda" here is the assertion of individual complexity against the simplifying demands of both white racists and Black political organizations.

  ### Vindication, Complication, and Resistance
  Does the novel vindicate Du Bois? Yes, insofar as it proves that art *is* always shaping perception. Ellison does not write "art for art's sake"; he writes to make the reader feel the texture of American denial. He fulfills Du Bois's demand that art serve Truth and Humanity.

  Does it complicate Du Bois? Significantly. It suggests that the most effective political art may be that which disavows political intent. The narrator's refusal to own his work as "propaganda" is a strategic move to prevent it from being co-opted by a directive agenda (like the Brotherhood's). It implies that *propaganda of the sensorium* works best when it masquerades as personal testimony, bypassing the reader's ideological defenses.

  Does it resist Du Bois? In its refusal of representation. Du Bois believed the Talented Tenth had a duty to lift the race. Ellison's narrator suggests that "lifting the race" is a concept that can be used to exploit the individual. The novel suspects that any claim to speak for the race is already a form of capture, whether by white supremacists or well-meaning allies.

  ### What the Novel Adds to the Philosophical Debate
  Your theoretical distinction and Du Bois's essay provide the *taxonomy* and the *ethics* of the debate, but *Invisible Man* provides the **phenomenology**.

  Theory can define *propaganda of the sensorium*, but it cannot simulate what it feels like to be the object of *directive propaganda*. The novel supplies the lived experience of having one's perception hijacked by the Brotherhood's scripts or the paint factory's formulas. It shows that the battle for the sensorium is not a calm cultivation of taste, but a violent struggle against forces that want to dictate what you see and say.

  Furthermore, the novel adds the dimension of **time and hibernation**. Du Bois's essay implies an active, public engagement. Ellison suggests that sometimes the necessary propaganda requires a withdrawal from the public sphere to recalibrate the self. The novel argues that before one can reshape the world's sensorium, one must survive the world's attempt to erase one's own.

  Finally, the novel introduces **irony** as a necessary tool for truthful propaganda. Du Bois seeks Truth with a capital T. Ellison suggests that in a society built on the lie of racial hierarchy, the only way to tell the truth is through irony, ambiguity, and paradox. A direct statement of truth is often heard as a directive or a threat. A story about invisibility, however, slips past the defenses. *Invisible Man* teaches us that the most enduring propaganda of the sensorium is not the one that shouts the loudest, but the one that haunts the reader's imagination long after the book is closed, making them question their own visibility and complicity. It transforms Du Bois's normative claim into a narrative strategy, showing that the fight for human flourishing is fought in the quiet, underground spaces of the mind before it ever reaches the streets.
