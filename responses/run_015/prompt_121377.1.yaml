  2. You may be conflating the ability to surgically separate these systems in pathology with the claim that they are conceptually independent in the definition of pain itself.
  3. The unpleasantness of pain is often phenomenologically inseparable from the sensation in normal contexts, suggesting the affective tone is constitutive of what pain feels like rather than a separate bolted-on alarm.
  4. If you classify asymbolia as mere nociception, you must explain why the sensory experience retains its qualitative identity as pain despite the missing emotional response.
  5. Arguing for actual separation rather than dissociation forces you to deny the patient's own report that they feel pain, which complicates your account of the sensory map itself.
