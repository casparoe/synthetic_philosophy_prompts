answer: |-
  Look, I get it. You're tired of reading papers that start with "suffering is bad" and end with "therefore, donate to charity X." That's not ethics; that's marketing. If you want to build a Suffering-Focused Ethics (SFE) that doesn't crumble under the weight of its own implications, you need a spec sheet. You need to know where the theory breaks before you deploy it.

  Here are the desiderata. I've flagged why each is a hard constraint (logic/empirics) rather than just a Negative Utilitarian (NU) preference.

  ### 1. The Asymmetry Justification (Non-Arbitrary)
  **Requirement:** The theory must derive the asymmetry (preventing suffering > creating happiness) from something other than "we like suffering less." It needs a structural reason.
  **Why a Constraint:** If it's just a preference, it collapses into standard utilitarianism with a weighting parameter. A robust SFE needs to explain why the *absence* of pain is good even if no one exists to enjoy that absence, while the *absence* of pleasure is not bad unless someone exists to be deprived.
  **Camp Preference vs. Constraint:** NU treats this as axiomatic. Prioritarianism treats it as a weighting function. An adequate theory needs to ground this in the phenomenology of urgency—suffering demands attention in a way pleasure does not.

  ### 2. The Gradated Consciousness Constraint (The "Dimmer Switch" Problem)
  **Requirement:** Moral weight must scale continuously with the capacity for experience. No binary "moral patient / non-patient" switches.
  **Why a Constraint:** Biology and AI don't work in binaries. Split-brain patients, integrated information theory (IIT) scores, and fragmented AI agents suggest consciousness is a spectrum. If your ethics rounds a 0.4-conscious entity to zero, you risk ignoring massive aggregates of mild suffering. If you round to one, you dilute resources.
  **Specific Edge Case:** You need a function $f(c)$ where $c$ is degree of consciousness. If an AI has fragmented awareness, does it suffer half as much? Or does the fragmentation *prevent* the unified experience required for suffering? The theory must pick a lane.
  **Camp Preference vs. Constraint:** Most theories ignore this. It's a metaphysical constraint imposed by the likely nature of mind.

  ### 3. Substrate Neutrality vs. Biological Grounding
  **Requirement:** Must apply to silicon and carbon, but remain consistent with affective neuroscience.
  **Why a Constraint:** You can't say "AI can't suffer" without a theory of consciousness that excludes it. Conversely, you can't say "all computation is suffering" without contradicting biology (nociception vs. pain).
  **Specific Case:** Bodiless AI. If an AI simulates a pain response without a body to protect, is it suffering? The theory needs a criterion for *functional* vs. *phenomenal* suffering.
  **Camp Preference vs. Constraint:** Abolitionists often focus too much on biology (genetic rewrite). Classic NU is often too abstract. You need both.

  ### 4. The Wild Animal Suffering (WAS) Handling
  **Requirement:** Must provide a stance on nature that isn't "hands-off" (appeal to nature fallacy) or "intervene immediately" (ecological catastrophe).
  **Why a Constraint:** The sheer volume of suffering in nature dwarfs human suffering. Ignoring it makes the theory numerically irrelevant. Blindly intervening makes it dangerous.
  **Camp Preference vs. Constraint:** This is a scale constraint. If your ethics ignores 90% of the suffering in the history of the universe (wild animals), it's incomplete.

  ### 5. Tractability vs. Moral Weight Distinction
  **Requirement:** Must distinguish between "how bad it is" and "how easy it is to fix."
  **Why a Constraint:** A common failure mode is prioritizing easy wins (human malaria) over massive horrors (factory farming/WAS) just because they are tractable. The *ethics* must rank the badness; the *strategy* ranks the fix. Collapsing these leads to moral myopia.
  **Camp Preference vs. Constraint:** Strategic error vs. ethical error. The theory must keep them separate.

  ### 6. The "Benevolent World-Exploder" Safety Valve
  **Requirement:** Must explicitly rule out killing all sentient beings to prevent future suffering.
  **Why a Constraint:** Classic NU fails here logically. If suffering > 0, and existence = suffering, then non-existence = 0 suffering. An adequate SFE needs a lexical priority for *rights* or *autonomy* that blocks this, even if it complicates the math.
  **Camp Preference vs. Constraint:** Logical consistency. If your theory implies genocide is the optimal solution, the theory is broken, not the world.

  ---

  ### The Jointly Unsatisfiable Pairs (The "Pick Two" Triangle)

  I suspect you're right to worry about conflicts. Here are the big ones:

  **1. Universal Substrate Neutrality vs. Concrete Policy Guidance**
  If you insist the theory applies to *every possible* suffering substrate (including hypothetical AI, aliens, microscopic organisms), you lose the resolution to give advice to *actual* institutions (governments, NGOs). The more universal the ontology, the vaguer the policy. You can't draft a UN resolution based on Integrated Information Theory thresholds.

  **2. Radical Asymmetry vs. Democratic Stability**
  If you truly prioritize suffering reduction above all else (lexical priority), you cannot maintain a coalition with people who value happiness, art, or liberty. An adequate SFE for *institutions* requires compromising the purity of the asymmetry. You can't be a pure SFE and a viable political platform simultaneously.

  **3. Gradated Consciousness vs. Measurement Reliability**
  If moral weight is gradated (Desideratum #2), you need to measure that grade. Currently, we can't. Demanding a theory that accounts for partial consciousness while also demanding it yields actionable metrics is asking for magic. You have to accept high uncertainty in the weighting function.

  ---

  ### Scientific Consistency Checks

  *   **Affective Neuroscience:** Must distinguish between *nociception* (signal processing) and *suffering* (negative affect). A robot can detect damage without suffering. A theory that conflates them is dead.
  *   **Psychology:** Must account for the hedonic treadmill. If we eliminate current suffering but capacity for suffering scales with complexity, are we just building bigger hells? The theory needs a view on the *ceiling* of suffering, not just the floor.

  ---

  ### Scorecard: How the Big Three Stack Up

  Here's how the usual suspects fare against these desiderata. (1 = Fails, 5 = Passes).

  | Desideratum | Classic Negative Utilitarianism | Prioritarian SFE (Weighted) | Abolitionist Bioethics |
  | :--- | :---: | :---: | :---: |
  | **Asymmetry Justification** | 5 (Axiomatic) | 3 (Weighting feels arbitrary) | 4 (Biological imperative) |
  | **Gradated Consciousness** | 2 (Usually binary) | 3 (Can accommodate weights) | 2 (Focuses on biological sentience) |
  | **Substrate Neutrality** | 4 (Abstract enough) | 4 (Functional focus) | 1 (Too biology-centric) |
  | **Wild Animal Suffering** | 3 (Theoretically yes, practically no) | 3 (Tractability limits) | 5 (Core focus) |
  | **Tractability/Weight Distinction** | 2 (Often collapses them) | 5 (Built for this) | 3 (Mission drift risk) |
  | **World-Exploder Safety** | 1 (Fails hard) | 4 (Rights constraints help) | 3 (Depends on implementation) |
  | **Policy Guidance** | 2 (Too radical) | 5 (Pragmatic) | 3 (Long-term only) |

  **The Verdict:**
  Classic NU is logically clean but practically dangerous (the exploder problem). Abolitionism has the right long-term goal but fails on substrate neutrality (what about AI?). Prioritarian SFE is the only one that can actually run a government, but it lacks the philosophical bite to justify the asymmetry without smuggling in utilitarian assumptions.

  **My advice?**
  Don't try to solve the gradated consciousness problem with a single scalar. Use a **threshold model with fuzzy boundaries**. It's not perfect, but it lets you draft policy without needing to solve the Hard Problem of Consciousness by Tuesday.

  Also, watch out for the typo in section 3, I think I wrote "phenomenal" twice. Doesn't change the logic.

