  2.  **Identify the Competing Norms:**
      *   *Knowledge Norm (KN):* Assert $p$ only if you know $p$. (Williamson is the big name here).
      *   *Truth Norm (TN):* Assert $p$ only if $p$ is true. (Less common as a *governing* norm for the speaker, more of a correctness condition).
      *   *Belief Norm (BN):* Assert $p$ only if you believe $p$. (Sincerity condition).
      *   *Reasonable Belief/Justified Belief Norm (RBN/JBN):* Assert $p$ only if you reasonably/justifiably believe $p$. (Often linked to warrant or evidence).
      *   *Evidence Norm (EN):* Assert $p$ only if you have adequate evidence for $p$. (Closely related to RBN).
      *   *Safety/Sensitivity Norms:* (More technical, maybe less central for this specific public policy case, but worth considering if relevant to "luck"). Let's stick to the main four + Evidence.

  3.  **Analyze the Case (Iraq WMD) through each Norm:**
      *   *Fact Base (Simplified for the sake of the argument):*
          *   WMDs did not exist (False).
          *   Intelligence was mixed/ambiguous (Low epistemic status).
          *   Some officials likely believed it (Sincere).
          *   Some officials likely doubted/exaggerated (Insincere/Political).
