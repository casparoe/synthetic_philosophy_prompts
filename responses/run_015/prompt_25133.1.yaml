  5.  **Evaluate the Norms based on the Case:**
      *   Does the scandal favor KN? It highlights the danger of sincere but unjustified belief. It suggests "Truth" isn't enough (we can't control truth), and "Belief" is too weak (sincere liars/misleaders pass).
      *   Does it favor RBN? It focuses on the *process* of intelligence assessment. The criticism was often about "cherry-picking" (violating evidence norms) rather than just being wrong.
      *   *The "Assertoric Force" point:* Officials used high-confidence language ("We know"). This raises the bar.

  6.  **Address the "Settled vs. Contested" Requirement:**
      *   *Settled:* There is no consensus on *the* norm. Williamson's KN is dominant but heavily contested.
