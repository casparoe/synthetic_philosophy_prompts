      *   *Knowledge Norm:* Since $p$ was false, $p$ could not be known. All assertions of $p$ violate KN. *Nuance:* Even if they believed it, you can't know falsehoods. If they lied, double violation.
      *   *Truth Norm:* Since $p$ was false, all assertions violate TN. TN doesn't care about mental state.
      *   *Belief Norm:* Depends on the official. Powell (likely believed) -> Permissible. Cheney/Political actors (maybe doubted) -> Violation. BN is too weak because it allows sincere falsehoods.
      *   *Reasonable Belief/Evidence Norm:* This is the crux. Was the intelligence *sufficient* to reasonably believe? Many inquiries (Butler, Silberman-Robb) suggested intelligence was *interpreted* too confidently. So, likely violations for many, but perhaps permissible for some low-level analysts. The categorical nature of the public assertion ("No Doubt") likely exceeded the evidential support ("We assess").

  4.  **Compare and Contrast (Divergences):**
      *   *KN vs. TN:* Both rule out the assertions (since false). But KN explains *why* it was improper even before the war started (lack of epistemic standing), whereas TN is retrospective.
