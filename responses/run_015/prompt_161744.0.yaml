          2.  **Two Types of Despair:** Modal Despair (arbitrariness of choice) vs. Plenitude Despair (nihilism because everything happens somewhere). Jobu Tupaki represents the latter. Does Counterpart Theory (CT) defuse Plenitude Despair but leave Modal Despair? Does Jobu need identity or just similarity?
          3.  **The Relativity/Tracking Problem:** Evelyns differ wildly (kung fu star vs. tax evader). What tracks them? Psychological continuity? Narrative role? Name? If it's interest-relative, does Alpha-Waymond's judgment ("greatest failure") hold?
