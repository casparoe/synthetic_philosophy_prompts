answer: |-
  Hi there,

  You have spotted the right tension, though I suspect you are aiming at the wrong target. Your view five is not the wobbly one; it is standard compatibilism and holds up fine so long as you do not demand logical necessity. The real collision is between your first and second claims, and that crash is loud enough to rattle everything else in the set.

  If you hold that future claims are already true or false, as you say in view one, you are committed to bivalence. But view two denies that there are any existing facts to make those claims true. You cannot have it both ways. Either the truth value exists now without a truthmaker, which violates your second principle, or there is no truth value yet, which violates your first. Your sixth point reveals that you are already oscillating between these positions depending on the story you are telling, sometimes insisting there was no fact of the matter and other times insisting it was true all along. That is the symptom of the underlying metaphysical clash.

  To resolve this, you should drop view one. It is the decoration, not the load-bearing wall. Your commitment to an open future, objective chance, and the efficacy of deliberation views two, three, and four are the core of your column's philosophy. If you reject bivalence for future contingents, you can say that statements about the election were neither true nor false on Thursday, but became true on Friday. This preserves the openness you want in view three and the agency in view four without requiring magic truthmakers.

  Regarding view five, if objective chance is real, an infallible predictor of specific outcomes is impossible, not just constrained. You can keep the spirit of five by saying that knowledge does not cause the event, but you must admit that such knowledge cannot exist for genuinely chancy events. Finally, the thin red line is indeed cheating relative to your second view. It posits a fact of the matter where you explicitly say there is none, essentially smuggling determinism in through semantics. If you sacrifice view one, the rest of the piece settles into a coherent picture of an open, unfolding world where truth is made, not found.

  Safe travels, and good luck with the filing.
