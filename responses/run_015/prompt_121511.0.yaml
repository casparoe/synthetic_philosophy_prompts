      *Wait, one nuance:* View 6 says "I write that it was true all along... and I don't feel I've taken anything back." This suggests the user *wants* to keep 1 sometimes. But also says "no fact of the matter" other times. This is the inconsistency. I need to point out that retaining 1 makes 2 and 3 hard to defend.

