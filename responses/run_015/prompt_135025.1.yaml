answer: |-
  ## The Rational Choice Sorting Quiz

  **Instructions:** Read each scenario and select the option that best matches your intuition. Do not worry about technical terms; answer based on what seems right to you in the case. There are no "correct" answers yet.

  **1. The Standard Pump**
  You prefer A to B, B to C, and C to A. A trader offers to swap C for B ($1), then B for A ($1), then A for C ($1). You end up with C and are $3 poorer.
  *   **A.** You acted irrationally.
  *   **B.** You acted strangely, but not irrationally.
  *   **C.** The trader acted immorally, but you are fine.

  **2. The Burning Money Pump**
  Same cycle as above, but the trader burns the $3 immediately. No one profits; you are just poorer.
  *   **A.** Verdict stays the same: You acted irrationally.
  *   **B.** Verdict changes: Without a predator, this is just a quirky preference.
  *   **C.** Verdict changes: This is tragic, but not a rationality failure.

  **3. The Island Cycle**
  You have the same cyclic preferences (A>B>C>A), but you live alone on an island. No trades are possible.
  *   **A.** You are still irrational (your mind is disordered).
  *   **B.** You are not irrational (irrationality requires bad actions).
  *   **C.** It's impossible to say without seeing what you do.

  **4. The Pre-Commitment**
  You know the trader is coming tomorrow. You can lock your choice in today for free, preventing the trades.
  *   **A.** You should lock it in.
  *   **B.** You should not lock it in (you should trust your future self).
  *   **C.** Locking it in is cheating; you should just choose better.

  **5. The Committee**
  A three-person committee votes by majority rule. They prefer A>B, B>C, and C>A. An external agent pumps them for money just like the individual.
  *   **A.** The committee is irrational.
  *   **B.** The committee is fine; groups don't have to be consistent.
  *   **C.** The committee is irrational, but individuals are not (or vice versa).

  **6. The Time-Switch**
  On Monday, you prefer $100 on Friday to $90 on Thursday. On Thursday, you switch and prefer $90 now to $100 tomorrow.
  *   **A.** This is the same defect as the Three-Option Cycle (Q1).
  *   **B.** This is a different defect (weakness of will, not logic).
  *   **C.** This is rational (preferences change over time).

  **7. The Self-Torturer**
  You can turn a dial up 1,000 steps. Each step gives you $10,000 and causes pain imperceptibly greater than the last. At step 1,000, you are in agony. You take step 1.
  *   **A.** Taking step 1 was irrational (you know where it leads).
  *   **B.** Taking step 1 was rational (each step is worth it).
  *   **C.** The setup is incoherent; you can't compare imperceptible differences.

  **8. The Unimaginable Future**
  You know your preferences will change radically in 10 years to values you cannot currently conceive (e.g., a religious conversion).
  *   **A.** You should plan now to satisfy your future self.
  *   **B.** You should plan now to satisfy your current self.
  *   **C.** Planning is impossible; you must decide later.

  ***

  ## The Scoring Key & Taxonomy

  *Note to TA: The "Leaves" below are constructed from the logical space of your answers. I have mapped standard philosophical labels onto them where they fit, but I have flagged where the map is reconstructive rather than settled.*

  ### The Four Diagnostic Dimensions
  Your answers place you on four axes. The "Leaves" are specific combinations of these.

  1.  **Source of Normativity (Q1 & Q2):** Is rationality about **Logic** (internal consistency regardless of outcome) or **Pragmatics** (avoiding loss/exploitation)?
  2.  **Locus of Irrationality (Q1 & Q3):** Is the defect in the **State** (having the preferences) or the **Action** (making the trades)?
  3.  **Unity of Agency (Q4 & Q5):** Is the agent a **Unified Whole** (person/committee must be consistent) or **Fragmented** (time-slices or members can conflict)?
  4.  **Planning Authority (Q4, Q6, & Q8):** Does the Present self have authority to bind the Future (**Sovereignty**), or must it anticipate the Future's independence (**Strategy**)?

  ### The Six Leaves (Positions)

  #### Leaf 1: The Orthodoxy (Transitivity Enforcer)
  *   **Pattern:** Logic > Pragmatics; State = Action; Unified Agency; Present Sovereignty.
  *   **Typical Answers:** 1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A/B.
  *   **Label:** **Classical Rational Choice.**
  *   **Status:** **Orthodox.** This is the standard economic/philosophical baseline (e.g., Ramsey, Savage).
  *   **Defensibility:** **High.** It provides a clean formal model.
  *   **Critique:** Struggles with Q7 (Self-Torturer) and Q8 (Unimaginable Future).

  #### Leaf 2: The Pragmatist (Exploitability Theorist)
  *   **Pattern:** Pragmatics > Logic; Action > State; Unified Agency.
  *   **Typical Answers:** 1A, 2B, 3B, 4A, 5A, 7B.
  *   **Label:** **Pragmatic Consistency.**
  *   **Status:** **Live Dispute.** (Associated with some decision theorists who argue "no Dutch Book, no irrationality").
  *   **Defensibility:** **Low/Medium.** Hard to explain why Q1 is irrational if not for the loss. If loss is the criterion, Q2 shouldn't matter, but Q2 removes the *gainer*, not the *loss*.
  *   **Note:** Often collapses into Leaf 1 upon reflection.

  #### Leaf 3: The Resolute Chooser
  *   **Pattern:** Unified Agency; Present Sovereignty (Binding).
  *   **Typical Answers:** 1A, 4A, 5A, 6A, 8A.
  *   **Label:** **Resolute Choice.** (McClennen).
  *   **Status:** **Live Dispute.** A specific response to dynamic inconsistency.
  *   **Defensibility:** **Medium.** Requires a robust theory of how a present self can causally/normatively bind a future self.
  *   **Distinction:** Differs from Leaf 4 on *how* consistency is achieved (Will vs. Calculation).

  #### Leaf 4: The Sophisticated Chooser
  *   **Pattern:** Unified Agency; Future Strategy (Anticipation).
  *   **Typical Answers:** 1A, 4B (or "Lock only if necessary"), 5A, 6A, 8B.
  *   **Label:** **Sophisticated Choice.** (Standard Game Theory).
  *   **Status:** **Orthodox (in Game Theory).**
  *   **Defensibility:** **High.** Avoids the metaphysical burden of "binding."
  *   **Distinction:** **Quiz Limitation:** Leaves 3 and 4 often yield identical behavior. They separate on *why* you don't get pumped (Resolute = "I forbid it"; Sophisticated = "I know I won't do it so I don't start").

  #### Leaf 5: The Fragmented Agent
  *   **Pattern:** Fragmented Agency (Group/Time Slices).
  *   **Typical Answers:** 1B/5B, 6B/C, 4B.
  *   **Label:** **Agency Fragmentalism.** (e.g., Dennett, some behavioral econ).
  *   **Status:** **Live Dispute.**
  *   **Defensibility:** **Medium.** Explains Q5 (Committees) and Q6 (Time) well.
  *   **Critique:** Risks dissolving the concept of "rationality" entirely. If fragments conflict, who is the "you" being assessed?

  #### Leaf 6: The Open-Ended Agent
  *   **Pattern:** Rejects Planning Authority (Q8).
  *   **Typical Answers:** 8C, 4C, 7C.
  *   **Label:** **Radical Openness.** (Related to Ulysses contracts critiques).
  *   **Status:** **Minority/Reconstructive.**
  *   **Defensibility:** **Low as a theory, High as a critique.** Good at pointing out limits of Leaves 1-4.
  *   **Note:** This is often a "bug" position (pointing out failures of the model) rather than a "feature" position (a working model of choice).

  ***

  ### Incoherent or Unoccupied Combinations

  *   **The "Magic Lock" (1A + 4B + 8A):** You think cycles are irrational, you *won't* lock yourself in, but you think you *can* plan for unimaginable futures. **Verdict:** **Incoherent.** If futures are unimaginable (Q8), standard pre-commitment (Q4) is impossible.
  *   **The "Group Exception" (1A + 5B):** You think individuals must be transitive, but groups can cycle. **Verdict:** **Defensible but Tense.** (Standard in social choice theory), but requires explaining why "rationality" applies to minds but not collections of minds.
  *   **The "Safe Cycle" (1B + 2A):** You think cycles are fine unless a trader exists, but irrational if money is burned. **Verdict:** **Unoccupied.** Almost no one argues that *loss* makes it irrational but *exploitation* does not. Usually, the argument runs the other way (Exploitation proves irrationality; Loss without exploitation is debatable).

  ### TA Guidance: Epistemic Flags

  1.  **Orthodoxy vs. Reconstruction:** Leaf 1 (Classical) and Leaf 4 (Sophisticated) are the "textbook" positions. Leaf 3 (Resolute) is a well-known philosophical patch. Leaf 6 (Open-Ended) is my reconstruction of the "Unimaginable Future" intuition; it doesn't have a standard "-ism" label because it's usually a critique of the others.
  2.  **Defensibility:** In seminar, if a student lands on Leaf 2 (Pragmatist), push them on Q2. If they land on Leaf 6 (Open-Ended), ask them how they make *any* decisions (e.g., saving for retirement). Leaf 1 and 4 are the safest bets for a "working theory," while Leaf 5 is the best for describing actual human behavior.
  3.  **The Swap:** I added **Q3 (The Island Cycle)**. I did not swap any of your cases. I added this because your list tested *exploitation* (Q1, Q2) and *dynamics* (Q4, Q5, Q6, Q7, Q8), but nothing tested whether rationality is a property of **preferences** or **actions**. Q3 isolates this. Without it, Leaf 1 and Leaf 2 look identical.

  ### Where the Quiz Fails to Separate
  *   **Resolute vs. Sophisticated (Leaf 3 vs 4):** As noted, behaviorally these often look the same. The quiz asks about *locking in* (Q4), but a Sophisticate might lock in if they know they are weak. The real difference is metaphysical (Can I bind my future self?). You will need to draw this distinction out in discussion; the quiz can only point to the cluster.
  *   **Fragmented vs. Time-Inconsistent (Leaf 5 vs 6):** A student who says "Preferences change" (Q6C) might be a Fragmentalist (Leaf 5) or an Open-Ender (Leaf 6). The distinction is whether they think planning is *hard* (Fragmented) or *impossible* (Open). Q8 helps, but the line is blurry.
