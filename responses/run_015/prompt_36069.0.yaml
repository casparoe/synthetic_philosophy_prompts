      *   *5:* Reinforces 1 and 4. Consciousness is real.
      *   *6:* This is the pivot point. "Conceivable but impossible" is the classic Type-B Materialist move to save physicalism from the Hard Problem. But if the Hard Problem is *real* (1) and *not dissolved by the Meta-Problem* (4), how can zombies be metaphysically impossible (6)? Usually, if the Hard Problem is robust (1 & 4), zombies are metaphysically possible (Property Dualism). If zombies are metaphysically impossible (6), usually the Hard Problem is epistemic only (Type-B Materialism).
      *   *7:* Causal closure. If phenomenality is real (5) and distinct enough to generate a Hard Problem (1), does it fit into physical closure? If it's identical/realized (Physicalism), why is there a Hard Problem (1)? If it's epiphenomenal, that's a bullet to bite.

