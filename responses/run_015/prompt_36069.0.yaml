      *   (4) **Meta-Problem Doesn't Dissolve Hard Problem:** Solving (3) doesn't answer (1). The question "is there *really* phenomenality?" survives. (Anti-illusionist).
      *   (5) **Illusionism is False:** Phenomenal consciousness exists and isn't an illusion. (Realist).
      *   (6) **Zombies Conceivable but Impossible:** 1st person conceivability holds, but metaphysical possibility does not. (Type-B Materialism / Kripkean).
      *   (7) **Causal Closure:** Phenomenal properties are either physical/realized by physical OR epiphenomenal. (Exclusion Principle).

  3.  **Initial Scan for Tensions:**
