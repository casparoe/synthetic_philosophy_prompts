  # Simulation Plan: The Oakhaven Budget Crisis
  **Course:** Democracy and Its Critics  
  **Time:** 60 Minutes  
  **Class Size:** 20 (Scalable to 17–20)  
  **Materials:** Projector, Index Cards (pre-printed), Paper Ballots, Pen, Whiteboard.

  ## 1. The Setup: Measures, Budget, and Stakes

  **The Town:** Oakhaven.  
  **The Budget:** $100 (Fictional Town Units).  
  **The Measures (5):** Each costs **$25**.
  1.  **Park Renovation**
  2.  **Library Books**
  3.  **Police Bikes**
  4.  **Street Lights**
  5.  **Town Festival**

  **The Real-World Stake:**
  The outcome of **Round 2** determines the format of our Final Review Session.
  *   **If 4 Measures Pass:** Pizza provided + Extended Time + Practice Exam + Recorded Session.
  *   **If 3 Measures Pass:** Pizza + Extended Time + Practice Exam (No Recording).
  *   **If 2 or Fewer:** Standard Review (No perks).
  *   **Round 1 Penalty:** If Round 1 goes over budget, the class loses *one* perk from the Round 2 outcome (e.g., if Round 2 passes 4, you only get 3). This makes the Round 1 failure sting.

  ---

  ## 2. Preference Cards (The Engine)

  You need two types of cards. The math is designed so that **Type A** voters (the majority) will sincerely vote **YES** on every measure, but collectively regret it if all 5 pass.

  **Preparation:**
  *   Print **14 Type A Cards** (The "Taxpayer Majority").
  *   Print **6 Type B Cards** (The "Opposition Minority").
  *   *Scalability:* If students are absent, the 14 vs. 6 margin ensures the paradox holds even if up to 3 Type A students are missing (11 Yes votes still constitutes a majority of a 17-person class).

  **Card Text (Type A - 14 Students):**
  > **Oakhaven Resident ID:** [Number]
  > **Private Valuation:** You value *each* of the 5 measures at **$22**.
  > **Tax Cost:** You pay **$5** in taxes for *each* measure that passes.
  > **Voting Rule:** Vote **YES** if your Value ($22) is greater than your Cost ($5).
  > **Budget Warning:** If the Town spends more than $100 total, a **$30 Penalty** is charged to every resident.
  > *Note: Do not show this card to anyone.*

  **Card Text (Type B - 6 Students):**
  > **Oakhaven Resident ID:** [Number]
  > **Private Valuation:** You value *each* of the 5 measures at **$0**.
  > **Tax Cost:** You pay **$5** in taxes for *each* measure that passes.
  > **Voting Rule:** Vote **YES** if your Value ($0) is greater than your Cost ($5).
  > *Note: Do not show this card to anyone.*

  **The Math (For Your Eyes Only):**
  *   **Type A Logic:** On any single measure, Benefit ($22) > Cost ($5). Net +$17. **Sincere Vote: YES.**
  *   **Round 1 Outcome:** 14 Yes vs. 6 No. All 5 measures pass.
  *   **Total Cost:** $125 (Over $100 Budget). Penalty Triggered.
  *   **Type A Final Payoff:** (5 measures × $22) – (5 measures × $5 Tax) – $30 Penalty = $110 – $25 – $30 = **$55**.
  *   **Type A Preferred Outcome:** If only 4 measures passed: (4 × $22) – (4 × $5) = $88 – $20 = **$68**.
  *   **The Paradox:** By voting sensibly on each issue, the majority voted themselves a worse outcome ($55 vs $68) and triggered the penalty that reduces the class perks.

  ---

  ## 3. Voting Rules & Timeline

  ### Phase 1: Introduction (5 Minutes)
  *   Project the 5 Measures and Costs.
  *   Explain the **Stakes** (Review Session Perks).
  *   Distribute Index Cards face down. Tell them: *"This is your private preference. Do not show it. It tells you how much you care."*
  *   **Crucial Instruction:** *"In Round 1, you must vote sincerely based on the measure in front of you. Do not strategize. Do not trade votes. Vote according to your card's rule."*

  ### Phase 2: Round 1 – The Referendum (15 Minutes)
  *   **Deliberation?** **NO.** Do not allow open deliberation. If they talk, they will logroll ("I'll vote for your park if you vote for my library"), which solves the paradox. You want the paradox to fire.
  *   **Voting:** Hold up a paper ballot for Measure 1. "All in favor?" Count hands. Write result on board. Repeat for all 5 measures.
  *   **The Reveal:**
      1.  Tally the spending. ($125).
      2.  Announce the Budget Cap ($100).
      3.  Announce the Penalty (Loss of one Review Perk).
      4.  Ask Type A students: *"By a show of hands, who voted Yes on all 5?"* (Most will raise hands). *"Who now wishes they had stopped at 4?"* (All Type A should raise hands).
  *   **Debrief Round 1 (5 Minutes):**
      *   Ask: *"Did anyone vote irrationally?"* (No).
      *   Ask: *"Did the majority get what they wanted?"* (No).
      *   **Point:** Issue-by-issue majority rule can aggregate into a package the majority opposes. (Hint at **Ostrogorski's Paradox** or **Fiscal Illusion**, but don't name it yet).

  ### Phase 3: Round 2 – The Appropriation Process (20 Minutes)
  *   **Setup:** "We cannot afford 5 measures. We have a hard cap of $100. Only 4 can pass."
  *   **The Clerk:** Randomly select one student to be the **Town Clerk**.
      *   Give them a slip of paper with the 5 measure names.
      *   **Instruction:** *"You decide the order in which we vote on these measures. Once $100 is spent, voting stops. The remaining measures die."*
      *   *Secret Instruction to Clerk (Optional):* If you want to ensure a swing, whisper to them: *"Put the Town Festival last."* (Or let them choose freely; the point is that *their* choice determines the loser).
  *   **Voting:**
      *   Clerk announces Order (e.g., 1, 2, 3, 4, 5).
      *   Vote on Measure 1. If Yes, deduct $25.
      *   Vote on Measure 2. If Yes, deduct $25.
      *   ...
      *   When Budget hits $100, announce: *"Budget Exhausted. Remaining measures are dead."*
  *   **The Swing:**
      *   Because Type A voters value all measures equally ($22), they will vote Yes until the money runs out.
      *   The **5th measure in the Clerk's order dies**.
      *   If the Clerk had chosen a different order, a *different* measure would have died.
  *   **Debrief Round 2 (5 Minutes):**
      *   Ask: *"Did voter preferences change from Round 1?"* (No).
      *   Ask: *"Did the outcome change?"* (Yes, one measure died).
      *   Ask: *"Who decided which measure died?"* (The Clerk).
      *   **Point:** Agenda setting is power. Sequential voting creates path dependence.

  ### Phase 4: Theoretical Wrap-Up (10 Minutes)
  *   **Connect to Theory:**
      *   **Round 1:** Illustrates the critique that direct democracy ignores **intensity of preference** and **budget constraints**. It creates a "Common Pool Resource" problem where everyone draws from the budget without feeling the full cost.
      *   **Round 2:** Illustrates the power of **Agenda Control**. In the absence of a "Will of the People" (since preferences were identical for all items), the procedure *created* the outcome.
  *   **Name the Theorems:** Now you can mention **Anscombe's Paradox** (Round 1) and **McKelvey's Chaos Theorem** or simple **Agenda Setting** (Round 2).
  *   **Final Question:** *"If direct democracy leads to overspending, and sequential voting gives power to the agenda-setter, what is the third option?"* (Lead them toward Representative Democracy/Constitutional Constraints).

  ---

  ## 4. Troubleshooting & Predictable Failures

  **1. The Logroller (Round 1)**
  *   **Risk:** A student says, "I'll vote No on the Festival if you vote No on the Park."
  *   **Fix:** Intervene immediately. *"Stop. This is a simulation of a secret ballot referendum. You cannot coordinate. Vote your card."*
  *   **Why:** Logrolling solves the paradox. You need the failure to teach the lesson.

  **2. The Accusation ("You Stacked the Cards")**
  *   **Risk:** A student claims you gave everyone "Yes" cards to force the overage.
  *   **Fix:** Before distributing, let a student shuffle the deck. After Round 1, ask the 6 Type B students to stand up and reveal their cards. This proves the minority existed and was outvoted sincerely.

  **3. Strategic Voting in Round 2**
  *   **Risk:** Type A voters realize the budget is tight and vote No on Measure 1 to save money for Measure 5.
  *   **Fix:** Remind them: *"Vote sincerely on the measure in front of you. Assume the budget will hold."*
  *   **If they strategize anyway:** This is actually a *better* teaching moment. It shows that under constrained budgets, voters *must* become strategic, which undermines the idea of "pure" democratic expression. Note this in the debrief.

  **4. Absenteeism**
  *   **Risk:** You have only 15 students.
  *   **Fix:** The 14 vs. 6 split is robust. Even with 12 Type A and 3 Type B (15 total), 12 Yes votes is 80%. The measures pass. The paradox holds.
  *   **Risk:** You have 21 students.
  *   **Fix:** Hand out one extra Type A card. The majority grows, paradox strengthens.

  ---

  ## 5. What This Exercise Cannot Show (Limitations)

  You must state this yourself in the wrap-up, as the simulation cannot generate it:

  1.  **Cyclical Majorities (Condorcet Paradox):** This simulation assumes single-peaked preferences (everyone wants more spending up to a point). It does not show a situation where A beats B, B beats C, and C beats A. That requires more complex preference distributions.
  2.  **Information Asymmetry:** In this game, everyone knows the costs. In real referendums, voters often don't know the true cost, which worsens the fiscal illusion.
  3.  **The "Tyranny of the Majority":** Here, the majority hurts *themselves*. The simulation doesn't show the majority exploiting a minority (since Type B just loses, but Type A also loses). Real-world critics worry about rights violations, not just budget math.

  ## 6. Instructor Script Snippet (The "Collision")

  *Use this when revealing the Round 1 result:*

  > "Look at the board. Every single measure passed by a majority vote. Every single one of you voted according to your own self-interest and your private values. No one lied. No one was confused. And yet, we are over budget, the penalty has been triggered, and the majority of you (Type A) are economically worse off than if we had passed nothing at all.
  >
  > If democracy is simply 'the majority rules on every issue,' we just proved that democracy can vote itself into a catastrophe. How do we fix that without taking the vote away from you?"

