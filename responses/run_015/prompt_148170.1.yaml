      *   **Constraints:** One afternoon, spreadsheet only (no solver), rounded inputs (nearest 5% or ranges), some teams refuse to "take the other side" (no shorting/betting against), some events never resolve (non-settling), materiality threshold (ignore tiny losses), mid-quarter revisions (temporal coherence).
      *   **Task:** Convert the Dutch Book Argument into a practical written procedure.
      *   **Requirements:** Specify checks in order, pass/fail criteria, stop/reject points, escalation points (modelling/values vs. coherence), handle specific constraints (rounding, joint coherence, temporal, non-settling, materiality), state limitations (coherence $\neq$ accuracy), and provide three worked examples.
      *   **Tone/Style:** British English, professional, actionable.

  2.  **Deconstruct the Dutch Book Argument for this Context:**
      *   *Standard Dutch Book:* If $P(A) + P(B) \neq P(A \cup B)$ (for disjoint), or $P(A|B)P(B) \neq P(A \cap B)$, a bookie can construct bets guaranteeing a loss.
      *   *Constraint 1 (No Shorting):* Teams won't take the other side. This means we can't assume they accept bets *against* an event, only *for* it. This limits the Dutch Book to one-sided exploitation (sub-additivity or super-additivity issues where the direction of the bet matters). Actually, if they refuse to bet *against*, we can only exploit them if they overestimate probabilities (sum > 1) or underestimate unions. Wait, if they only bet *for*, a Dutch Book requires us to sell them bets they think are favourable but are collectively losing.
      *   *Constraint 2 (Rounding):* Inputs are 0%, 5%, 10%... or ranges. Strict equality checks will fail constantly. Need tolerance bands.
      *   *Constraint 3 (Joint Coherence):* Team A says Flood X is 10%. Team B says Flood X or Y is 5%. This is incoherent ($P(X \cup Y) \ge P(X)$). Need a cross-team check.
      *   *Constraint 4 (Temporal):* Q1 says Risk is 20%. Q2 says Risk is 5% (no new info). This is dynamic incoherence (martingale property of probabilities), though hard to test without tracking info flow. I need to simplify this to "significant unexplained drift."
      *   *Constraint 5 (Non-settling):* Some events don't resolve. Dutch Books usually assume settlement. If an event doesn't resolve, the bet is void. We must exclude non-settling events from the strict arithmetic check or treat them as "opinion only" not feeding into the betting ledger.
      *   *Constraint 6 (Materiality):* Ignore losses < $X$% of stake.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Introduction:* Set the scene. This is about logic, not truth.
      *   *Pre-processing:* Handle rounding and ranges. Convert ranges to mid-points but flag uncertainty. Apply a "fuzz factor" (tolerance) based on the 5% rounding.
      *   *Step 1: Internal Consistency (The Basics).* $P(A) + P(A^c) = 1$? (If they allow complements). $P(A \cap B) \le P(A)$? Since they don't bet against, we focus on Sub-additivity ($P(A \cup B) \le P(A) + P(B)$) and Monotonicity ($A \subset B \implies P(A) \le P(B)$).
      *   *Step 2: Conditional Logic.* $P(A|B) \times P(B) = P(A \cap B)$.
      *   *Step 3: Cross-Team (Joint) Coherence.* This is crucial. Merge all events into a master list. Check for overlaps.
      *   *Step 4: Temporal Check.* Compare with last quarter.
      *   *Decision Logic:* Pass, Fail (Reject), Escalate (Chair/CRO).
      *   *Materiality:* Define the threshold (e.g., 1% of notional stake).

      *Refining the "No Shorting" constraint:* If a team says $P(A) = 0.8$, they are willing to pay 0.80 to win 1.00. If they refuse to *sell* that bet (i.e., take the other side), we can't exploit $P(A) + P(A^c) < 1$. We can only exploit $P(A) + P(A^c) > 1$ (if they define $A^c$) or $P(A \cup B) < P(A) + P(B)$ where they buy both. Actually, the standard Dutch Book relies on the agent accepting *both* sides of a fair bet. If they only buy, the "bookie" (agency) loses money if the agent is *under*-confident. The agency loses money if the agent is *over*-confident (buys overpriced bets).
      *Correction:* The prompt says "some teams decline to take the other side of their own numbers." This implies the *default* expectation is that they should, but some don't. The procedure needs to handle both. If they *will* take the other side, we check full coherence. If they *won't*, we check for "One-Sided Dutch Books" (mostly over-estimation leading to guaranteed loss for the buyer).
      *Actually, let's simplify for engineers:* Focus on logical inequalities. $P(A \text{ and } B) \le P(A)$. $P(A \text{ or } B) \ge P(A)$. Sum of disjoint events $\le 1$. These hold regardless of betting direction, but the *financial loss* depends on betting direction. Let's frame it as "Logical Consistency Check" with a "Financial Exposure Estimate."

      *Rounding:* If inputs are 5% increments, a sum of 105% might be 100% in reality. Tolerance should be $\pm 2.5\%$ per input. For a sum of two, tolerance is $\pm 5\%$.
      *Materiality:* Define a "Notional Stake" (e.g., £1m). If max loss < £10k, ignore.

  4.  **Developing the Three Worked Examples:**
      *   *Example 1 (Joint Incoherence):* Team A: Flood Site 1 (15%). Team B: Flood Site 1 or 2 (10%). $P(A \cup B) < P(A)$. Fail.
      *   *Example 2 (Rounding Artefact):* Team A: Event X (30%), Event Y (30%), Event Z (30%). Sum = 90%. Complement = 15%. Sum = 105%. Within rounding error? If tolerance is 5%, pass.
      *   *Example 3 (Coherent but Absurd):* Team assigns 95% to a "Black Swan" that experts think is 1%. Logic holds ($P + P^c = 1$), but calibration is wrong. Procedure must Pass, Chair overrides.

  5.  **Refining the Tone and Structure:**
      *   Use British English (programme, centre, modelling, £).
      *   Structure as a Standard Operating Procedure (SOP).
      *   Clear "Stop/Go" decision gates.
      *   Explicit escalation paths.

  6.  **Addressing Specific Constraints in the Draft:**
      *   *Non-resolving events:* Mark as "Qualitative Only." Exclude from arithmetic checks.
      *   *Mid-quarter revisions:* Compare current submission against the "Live Register." Flag drift > 10% without a "Change Note."
      *   *Values vs. Coherence:* If the math works but the risk appetite is violated, that's an escalation, not a coherence fail.

  7.  **Final Review against Constraints:**
      *   *One afternoon/Spreadsheet:* Formulas must be simple (SUM, IF, MAX). No matrix inversion.
      *   *Reviewers:* Engineers. Avoid measure theory jargon. Use "Betting Odds" or "Logical Rules."
      *   *Dutch Book Core:* Ensure the link between the check and the "Guaranteed Loss" is clear in the intro.

  8.  **Writing the Content (Mental Sandbox):**
      *   *Title:* Coherence Review Procedure.
      *   *Section 1: Purpose.* Why are we doing this? To prevent guaranteed logical losses.
      *   *Section 2: Limits.* What this isn't (truth testing).
      *   *Section 3: The Checks.*
          *   Pre-flight (Rounding, Settlement).
          *   Check 1: Bounds (0-100%).
          *   Check 2: Monotonicity (Subset rule).
          *   Check 3: Additivity (Disjoint sums).
          *   Check 4: Conditionals ($P(A|B)P(B)$).
          *   Check 5: Cross-Team (Master List).
          *   Check 6: Temporal (Drift).
      *   *Section 4: Decision Matrix.* Pass, Fail, Escalate.
      *   *Section 5: Examples.*

      *(Self-Correction during drafting)*: Make sure the "No Shorting" constraint is handled. If they won't take the other side, we can't check $P(A) + P(Not A) = 1$. We can only check $P(A) + P(Not A) \ge 1$ (if they buy both) or just ignore the complement. Better instruction: If "No Shorting" flag is set, skip complement checks. Focus on $P(A \cap B) \le P(A)$.

      *(Rounding)*: If numbers are rounded to nearest 5%, the true value is $[x-2.5\%, x+2.5\%]$. When checking $A + B = C$, the intervals must overlap.
      Let $I_A = [A_{low}, A_{high}]$. Check if $I_C \cap (I_A + I_B) \neq \emptyset$.
