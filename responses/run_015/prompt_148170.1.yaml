answer: |-
  # Standard Operating Procedure: Quarterly Risk Register Coherence Review

  **Version:** 4.2  
  **Authority:** Office of the Chief Risk Officer (CRO)  
  **Audience:** Risk Review Panel (Engineers, Planners, Analysts)  
  **Time Allocation:** One Afternoon (Quarterly)  
  **Tools:** Standard Spreadsheet (No Solver/Add-ins)

  ---

  ## 1. Purpose and Scope

  This procedure operationalises the **Dutch Book Argument**. In plain terms: if our stated probabilities are logically inconsistent, a counterparty could construct a combination of bets at our own odds that guarantees the agency a financial loss, regardless of the outcome.

  We are not testing whether the numbers are *correct* (accuracy/calibration). We are testing whether the numbers are *possible* (coherence). A coherent set of probabilities can still be wildly wrong about the real world; an incoherent set is mathematically broken.

  **This procedure does not:**
  *   Determine the "true" risk.
  *   Challenge technical modelling assumptions (unless they violate probability axioms).
  *   Enforce risk appetite (this is a values choice, not a logic check).

  ## 2. Pre-Processing and Constraints

  Before running checks, prepare the data in the **Master Coherence Sheet**.

  ### 2.1. Rounding and Tolerance
  Submissions are rounded to the nearest 5% (0.05) or provided as ranges. Strict equality checks will generate false failures.
  *   **Action:** Treat every point estimate $X$ as an interval $[X - 0.025, X + 0.025]$.
  *   **Tolerance Threshold:** For any arithmetic check involving $n$ inputs, the allowable deviation is $\pm (n \times 0.025)$.
      *   *Example:* Checking $A + B = C$. If $(A+B) - C$ is within $\pm 0.075$ (3 inputs $\times$ 0.025), mark as **Pass**.

  ### 2.2. The "No Shorting" Flag
  Some teams refuse to "take the other side" of a bet (i.e., they will buy insurance against a risk but will not sell it).
  *   **Action:** Column H in the Master Sheet: Mark `Y` if the team accepts two-way betting, `N` if one-way only.
  *   **Implication:** If `N`, do not penalise sums of probabilities exceeding 100% (over-estimation), as this does not create a guaranteed loss for the agency unless we can sell them the complement. However, **Monotonicity** (Section 4.2) must still hold regardless of betting direction.

  ### 2.3. Non-Settling Events
  Some events (e.g., "Regulatory regime shifts") may never objectively resolve.
  *   **Action:** Flag these as `Qualitative`.
  *   **Implication:** Exclude from arithmetic Dutch Book checks. They cannot be used to construct a settled bet. They are subject only to Narrative Review.

  ### 2.4. Materiality Threshold
  We do not chase trivial logical errors.
  *   **Notional Stake:** £1,000,000 per risk line.
  *   **Threshold:** £10,000 (1%).
  *   **Action:** Calculate the maximum guaranteed loss implied by the incoherence. If < £10,000, mark as **Pass (Minor)**.

  ---

  ## 3. The Coherence Checks (In Order)

  Run these checks sequentially. If a submission fails a step, stop and apply the **Decision Matrix** (Section 5).

  ### Check 1: Basic Bounds
  *   **Logic:** Probability must lie between 0 and 1.
  *   **Formula:** `IF(OR(Prob < 0, Prob > 1), "FAIL", "PASS")`
  *   **Rounding:** Allow -0.025 to 1.025.
  *   **Stop:** If Fail, **Reject**.

  ### Check 2: Monotonicity (Subset Rule)
  *   **Logic:** If Event A implies Event B (A is a subset of B), then $P(A) \le P(B)$.
      *   *Example:* "Flood at Site X" implies "Flood at Site X or Y".
  *   **Formula:** `IF(P_Subset > P_Superset + Tolerance, "FAIL", "PASS")`
  *   **Stop:** If Fail, **Escalate**. (This implies a fundamental misunderstanding of the risk scope).

  ### Check 3: Additivity of Disjoint Events
  *   **Logic:** If Event A and Event B cannot happen together, $P(A \text{ or } B) = P(A) + P(B)$.
  *   **Constraint:** Only apply if the submitting team defines A and B as mutually exclusive.
  *   **Formula:** `IF(ABS((P_A + P_B) - P_A_or_B) > Tolerance, "FAIL", "PASS")`
  *   **Stop:** If Fail, **Escalate**.

  ### Check 4: Conditional Consistency
  *   **Logic:** $P(A \text{ and } B) = P(A | B) \times P(B)$.
  *   **Formula:** `IF(ABS((P_A_given_B * P_B) - P_A_and_B) > Tolerance, "FAIL", "PASS")`
  *   **Stop:** If Fail, **Escalate**.

  ### Check 5: Cross-Team Joint Coherence
  *   **Logic:** Risks submitted by different teams must not contradict when merged.
      *   *Example:* Team 1 submits $P(\text{Flood X}) = 20\%$. Team 2 submits $P(\text{Flood X or Y}) = 15\%$.
  *   **Action:** Merge all events into a single hierarchy tree. Run Check 2 (Monotonicity) and Check 3 (Additivity) across team boundaries.
  *   **Stop:** If Fail, **Escalate to Chair**. (This indicates siloed modelling).

  ### Check 6: Temporal Drift (Mid-Quarter Revisions)
  *   **Logic:** Probabilities should not change significantly without new information (Martingale property).
  *   **Action:** Compare current $P$ against last quarter's $P$.
  *   **Formula:** `IF(ABS(P_Current - P_Previous) > 0.10, "FLAG", "PASS")`
  *   **Requirement:** If FLAGGED, a "Change Note" must be attached explaining the new information.
  *   **Stop:** If FLAGGED and no Note, **Escalate to CRO**.

  ---

  ## 4. Decision Matrix

  | Check Result | Severity | Action | Authority |
  | :--- | :--- | :--- | :--- |
  | **Pass** | N/A | Accept into Register. | Reviewer |
  | **Fail (Materiality < 1%)** | Minor | Accept with note. | Reviewer |
  | **Fail (Bounds/Monotonicity)** | Critical | **Reject Submission.** Return to team for correction. | Reviewer |
  | **Fail (Joint/Conditional)** | Major | **Escalate.** Do not reject yet. | **Chair (You)** |
  | **Fail (Temporal w/o Note)** | Process | **Escalate.** Query the change management process. | **CRO** |
  | **Pass (but Absurd)** | Calibration | **Escalate.** Coherent but implausible. | **Chair (You)** |

  **Escalation Protocol:**
  When escalating to the Chair or CRO, the reviewer must specify:
  1.  Which check failed.
  2.  The implied guaranteed loss (Notional Stake $\times$ Incoherence Gap).
  3.  Whether the issue is **Mathematical** (fix the numbers) or **Modelling** (fix the assumptions).

  ---

  ## 5. Limitations and Misfire Points

  Reviewers must acknowledge the following limitations in their sign-off:

  1.  **Coherence $\neq$ Accuracy:** This procedure will **Pass** a submission where every team agrees that a risk is 99%, even if the true risk is 1%. We test internal logic, not external truth.
  2.  **Rounding Misfires:** Large aggregations of rounded numbers may accumulate tolerance bands that mask genuine incoherence. If >10 events are summed, tolerance is widened manually by the Chair.
  3.  **Correlation Blindness:** We check stated probabilities. We do not independently verify correlation assumptions unless explicitly submitted as conditional probabilities.
  4.  **Non-Settling Risks:** For events that never resolve, "Coherence" is purely notional. A failure here is a warning, not a financial exposure.

  ---

  ## 6. Worked Applications

  ### Application 1: The Joint Sure Loss (Fail)
  **Scenario:**
  *   **Team Alpha** submits: $P(\text{Flood Site A}) = 20\%$.
  *   **Team Beta** submits: $P(\text{Flood Site A or Site B}) = 15\%$.
  *   **Betting Stance:** Both teams accept two-way betting.

  **Analysis:**
  Logically, the probability of "A or B" must be at least the probability of "A" alone ($P(A \cup B) \ge P(A)$).
  Here, $15\% < 20\%$.
  **Dutch Book:** The Agency can buy coverage on "Flood Site A" for £20k (paying 20% of £100k stake) and sell coverage on "Flood Site A or B" for £15k.
  *   If A floods: We win £80k on first bet, lose £85k on second. Net: -£5k.
  *   If A does not flood (but B might): We lose £20k on first. If B floods, we lose £85k on second. If B doesn't, we win £15k.
  *   *Correction on Book construction:* Actually, simpler: We sell them "A" at 20p and buy "A or B" at 15p.
      *   Cost to us: Pay 15p, Receive 20p. Net +5p cash now.
      *   Liability: If A happens, we pay £1 on first, receive £1 on second. Net 0.
      *   If A doesn't happen: We pay 0 on first, receive 0 on second. Net 0.
      *   **Result:** We keep the 5p premium risk-free. The teams have guaranteed a loss of 5% of stake.
  **Procedure Outcome:** Check 5 (Joint Coherence) **FAIL**. Materiality > 1%. **Escalate to Chair.**

  ### Application 2: The Rounding Artefact (Pass)
  **Scenario:**
  *   **Team Gamma** submits three mutually exclusive outcomes for a project delay:
      *   $P(\text{Delay < 1 week}) = 30\%$
      *   $P(\text{Delay 1-2 weeks}) = 35\%$
      *   $P(\text{Delay > 2 weeks}) = 30\%$
      *   $P(\text{No Delay}) = 10\%$
  *   **Sum:** $105\%$.

  **Analysis:**
  Strict arithmetic says $105\% \neq 100\%$. However, inputs are rounded to nearest 5%.
  True values could be: $27.5\%, 32.5\%, 27.5\%, 7.5\%$. Sum = $95\%$.
  Or: $32.5\%, 37.5\%, 32.5\%, 12.5\%$. Sum = $115\%$.
  The interval $[95\%, 115\%]$ contains $100\%$.
  **Procedure Outcome:** Check 3 (Additivity). Deviation is 5%. Tolerance for 4 inputs is $4 \times 2.5\% = 10\%$. $5\% < 10\%$. **Pass (Minor).** No action required.

  ### Application 3: Coherent but Absurd (Escalate on Values)
  **Scenario:**
  *   **Team Delta** assesses a "Catastrophic Meteor Strike".
  *   $P(\text{Strike}) = 50\%$.
  *   $P(\text{No Strike}) = 50\%$.
  *   Conditionals and subsets are logically perfect. Sum = 100%.
  *   **Scientific Consensus:** True risk is $0.000001\%$.

  **Analysis:**
  The Dutch Book check looks for internal contradictions ($P(A) + P(Not A) \neq 1$). Here, $0.5 + 0.5 = 1$.
  There is no combination of bets at these odds that guarantees a loss *if the team holds these beliefs honestly*. They are logically coherent.
  However, the number is operationally useless and distorts capital allocation.
  **Procedure Outcome:** All Coherence Checks **PASS**.
  **Action:** Reviewer marks **Pass**.
  **Chair's Override:** I must intervene not on coherence grounds, but on **Calibration/Authority**. I will reject the number not because it is incoherent, but because it violates agency modelling standards. This distinction is vital to maintain the integrity of the coherence review.

  ---

  **Signed:** ___________________ (Chair, Risk Coherence Review)
  **Date:** ___________________
