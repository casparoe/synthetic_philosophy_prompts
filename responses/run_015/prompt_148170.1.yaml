      *(Materiality)*: Define a "Unit Stake" (e.g., £100). Calculate max guaranteed loss. If < £1 (1%), Pass.

  9.  **Final Polish:** Check British spelling (programme, modelling, centre, authorised). Ensure the distinction between "Coherence" (logic) and "Calibration" (accuracy) is stark.

  10. **Worked Examples:** Ensure they are distinct and illustrate the specific points requested.
      *   1: Joint Incoherence (The "Silo" problem).
      *   2: Rounding (The "False Positive").
      *   3: Absurd but Coherent (The "Calibration" limit).

