      *   **Target Judgment:** Secured by Prioritarian/Equity view.
      *   **Honest Analysis:**
          *   *Feature doing work:* The distribution of welfare (inequality), not identity.
          *   *Total Welfare Difference:* If Option 2 had slightly higher total, TU would flip. Intuition might waver.
          *   *PAV Attack:* They will say this isn't about NIP/Identity at all; it's just the Repugnant Conclusion/Leveling Down objection in disguise. It's an appeal to equality, not a resolution of NIP. The "residue" is just distributional concern.

