      *   *Option 2:* Don't Screen Couple A (Child A2: moderate welfare), Screen Couple B (Child B2: high welfare).
      *   *Wait, total welfare must be same.* Yes, High + Moderate = Moderate + High.
      *   *Why is one worse?* This is the tricky part. If total is same and number is same, utilitarianism is indifferent. PAV says no one is harmed (both lives worth living, different people).
      *   *The "Residue":* The claim is that there *is* a wrong. Why? Perhaps because one option creates inequality while the other doesn't? Or perhaps because one option imposes a burden unnecessarily on *someone* even if identity changes?
