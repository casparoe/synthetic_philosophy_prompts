          2.  Same number of people exist in both options.
          3.  Same total welfare in both options (blocks total utilitarianism).
          4.  Everyone has a life worth living (above threshold); no motive/rights/deception issues.
          5.  Realistic institutional setting (no sci-fi).
          6.  Must generate a firm judgment that one option is worse (resisting the "lucky to be alive" shrug).
      *   **Output Structure:**
          1.  Single paragraph scenario.
          2.  Verdicts of Person-Affecting View (PAV), Total Utilitarianism (TU), Prioritarian/Distribution-sensitive view.
          3.  Identify which secures the target judgment.
          4.  Honest analysis: feature doing the work, effect of slight total welfare difference, PAV attack (equality disguise?).
          5.  **Word Count:** Under 700 words.

  2.  **Drafting the Scenario:**
      *   Need identity dependence + same number + same total welfare + realistic.
      *   *Idea:* A fertility clinic scheduling two batches of IVF.
      *   *Option A:* Treat Batch 1 now, Batch 2 later. Batch 1 gets Condition X (mild chronic pain), Batch 2 gets Condition Y (no pain).
      *   *Option B:* Treat Batch 2 now, Batch 1 later. Batch 2 gets Condition X, Batch 1 gets Condition Y.
      *   *Problem:* This is usually the "Same Number Quality Claim" (Parfit). But I need *same total welfare*.
      *   *Refinement:* Two couples, Couple A and Couple B. Both need IVF.
      *   *Constraint (i):* Different timing/conception means different children.
      *   *Constraint (ii):* 2 children in both cases.
      *   *Constraint (iii):* Total welfare equal. So if Child 1 has 100 units and Child 2 has 50 units in Option 1, then in Option 2, Child 3 has 50 units and Child 4 has 100 units.
      *   *Constraint (iv):* Both 50 and 100 are "worth living".
      *   *Constraint (v):* Clinic protocol.
