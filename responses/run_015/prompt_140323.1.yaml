  **The Implicit Theory of Responsibility**

  The institutional practice ostensibly relies on a desert-based theory of moral responsibility. It asserts that the human supervisor is blamed because they were negligent in their duty to monitor and intervene. For this justification to hold, the human must have possessed a genuine opportunity to prevent the harm. This invokes the principle that "ought implies can"; if the human could not have realistically intervened, blaming them is unjust. However, the institutional function suggests a forward-looking accountability view. Blame is placed to maintain a chain of liability and provide public assurance, regardless of genuine culpability. The condition doing the real work is not actual control, but formal authority. The system requires a moral agent to absorb liability to preserve the legitimacy of the technology. Conceptually, this is a hybrid: it demands the language of desert to justify punishment, but operates on the logic of insurance. The practice collapses if the human is seen as merely a component rather than an agent. If the view were purely forward-looking, we would not need to stage investigations into individual negligence; we would simply assign costs. The reliance on negligence findings indicates a deep commitment to desert, even when the conditions for desert are absent. This creates a tension: the system needs the human to be blameworthy to satisfy retributive intuitions, but needs them to be liable even when not blameworthy to satisfy economic ones.

  **Distinguishing the Four Gaps**

  The four gaps are distinct and must not be conflated, yet the practice treats them as a single block. The gap in authority is typically closed legally; the human has the right to stop the machine. The gap in epistemic access is often hoped to be closed but is frequently open; humans lack the data bandwidth to verify algorithmic decisions in real-time. The gap in control is empirically contested; automation bias suggests effective control is degraded even if physical control exists. The causal gap is often open; if the machine acts too fast, the human contribution is null. The practice presupposes these are closed to justify blame, but remedies differ significantly. Epistemic gaps require interface design changes; control gaps require limiting automation speed; causal gaps require liability shifts. Treating them as one "responsibility gap" obscures that some are design failures and others are legal fictions. Conceptually, authority can exist without control, but morally, responsibility requires control. If authority is present but control is absent, the human is a scapegoat. If control is present but epistemic access is absent, the human is guessing. Each gap requires a specific technical or legal remedy, not a generic demand for oversight. Conflating them allows institutions to claim they have solved the responsibility problem by granting authority, while leaving control and epistemic access unresolved.

  **Supervisory Smothering and Empirical Claims**

  Supervisory smothering suggests the practice rests on a false empirical claim. It assumes humans can maintain vigilance over highly reliable systems. This leans on contested psychology regarding vigilance decrement and skill fade. If empirical findings on automation bias are robust, the human cannot effectively monitor, making the desert claim false. The practice can only be defended if it admits control is nominal and shifts to a strict accountability model where the human is a liable placeholder rather than a culpable agent. However, punishing a placeholder violates desert principles. Therefore, if smothering is real, the practice is incoherent unless it abandons the claim of genuine supervision. This is a critical empirical hinge; if psychology proves vigilance impossible, the ethical framework crumbles. We must flag that while automation bias is well-documented, the degree to which it eliminates control is contested. Some argue training mitigates it; others say it is inherent. The practice bets on the former; the evidence often supports the latter. If the claim is false, the practice is a ritual of blame rather than a mechanism of safety. It prioritizes the appearance of control over the reality of safety, potentially increasing risk by distracting humans with meaningless oversight tasks.

  **Coherence, Alternatives, and Selectivity**

  The package is incoherent because it needs desert for legitimacy but cannot satisfy desert conditions due to smothering. It is philosophically underdetermined regarding liability; strict enterprise liability would function better for deterrence without blaming individuals. Concrete changes would involve removing humans from loops where control is impossible and insuring risks at the corporate level. A design-first view would forbid deployment until genuine human control is technically achievable, potentially banning certain autonomous systems entirely. The selectivity of the practice—requiring humans for weapons but not insulin—presupposes that some decisions require moral judgment, not just optimization. It implies that lethal force demands a moral agent, whereas physiological regulation demands only competence. This distinguishes moral responsibility from causal responsibility. The practice ultimately selects based on the perceived need for moral justification of harm, not merely safety. We demand humans where the harm involves violating rights, not just causing damage. This suggests the practice is not about safety, but about legitimizing violence through human agency. If the goal were purely safety, closed-loop systems would often be preferred. The insistence on humans in lethal contexts reveals a commitment to moral answerability over causal efficiency.

