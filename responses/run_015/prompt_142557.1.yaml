  3. The rival reading relies on the three Kelvin Valley dissenters and Ardmore minority to count identity-dependent benefits via slot-matching, which would predict approval given the $60bn undiscounted value. I reject this because the Ardmore majority explicitly established the contingency test as binding precedent over the slot-matching theory.

  4. Ardmore is the closest analog, and if the Panel approves, they are adopting the principle that expected value maximization overrides the person-affecting restriction in catastrophe scenarios. This would require a minute clause stating that potential lives saved in contingent futures count equally with actual lives despite identity differences.

