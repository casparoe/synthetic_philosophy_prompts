     Is a surge a breach?

  *Okay, ready to write.*
answer: |-
  This is a tight, high-stakes design. You are asking students to inhabit the structural tension of legal interpretation without giving them the vocabulary to resolve it prematurely. The Antarctic scenario works well because it isolates the variables (scarcity, isolation, high stakes) without the baggage of criminal law or constitutional rights.

  Here is the complete package.

  # SEMINAR EXERCISE: THE AEGIS PROTOCOL

  ## 1. DELIVERABLES

  ### A. The Ordinance (Handout 1)
  **STATION AEGIS: BIO-REPOSITORY ACCESS PROTOCOL (REV. 4)**
  *Effective Date: 01 March 202X | Authority: Station Command*

  **Rule 1 (Category):** No biological material may be removed from the Bio-Vault without prior written authorization from the Station Commander.
  **Rule 2 (Time):** Access to the Bio-Vault is prohibited between the hours of 22:00 and 06:00 local station time.
  **Rule 3 (Procedure):** All authorized removals must be entered into the Digital Manifest and countersigned by the Duty Officer at the time of removal.
  **Rule 4 (Emergency):** In the event of a Level 4 Containment Breach, the Senior Biologist may override Rules 1–3 to secure samples.

  *Note: "Biological Material" is defined in Appendix C as any matter containing carbon-based cellular structures, living or dead.*

  ### B. The Case Vignettes (Handout 2)
  **INCIDENT REPORTS: QUARTER 3**

  **Case 01 (The Artifact):** Dr. Aris removes a sterilized, fossilized hominid tooth from the Vault at 14:00. It is carbon-based (Rule 1). She has written authorization. She logs it in the Digital Manifest. The Duty Officer is at lunch, so she does not get a countersignature (Rule 3).
  *Risk Assessment: Zero contamination risk.*

  **Case 02 (The Freezer):** At 23:30, a freezer alarm sounds. Tech Officer Chen enters the Vault to reset the thermostat. No biological material is removed. No authorization was sought (Rule 1/2). No log entry made (Rule 3).
  *Risk Assessment: Samples saved from thawing. No contamination introduced.*

  **Case 03 (The Surge):** A power surge damages the cooling system. It is 03:00. The Senior Biologist enters, removes three live cultures to a portable cooler, and leaves. No written authorization (Rule 1). Violates Time (Rule 2). No log/countersign (Rule 3). Command later declares the surge was a "Level 3 Anomaly," not a "Level 4 Breach" (Rule 4).
  *Risk Assessment: Cultures saved. Protocol violated.*

  ### C. The Purpose Memos (Handout 3 — **CRITICAL**)
  *Print two versions. Distribute Version A to Groups 1 & 2. Distribute Version B to Groups 3 & 4. Do not announce there are two versions.*

  **VERSION A (Narrow/Security Focus)**
  **MEMORANDUM: LEGISLATIVE INTENT**
  **TO:** Compliance Officers
  **RE:** Rationale for Bio-Repository Protocol
  The primary purpose of this Protocol is **to prevent biological cross-contamination between Vault storage and the general station.** The restrictions on time and procedure are designed to ensure that a second set of eyes verifies sterilization protocols are met before anything leaves the secure zone. The Emergency Override exists solely to prevent Vault-internal contamination events from spreading.

  **VERSION B (Broad/Mission Focus)**
  **MEMORANDUM: LEGISLATIVE INTENT**
  **TO:** Compliance Officers
  **RE:** Rationale for Bio-Repository Protocol
  The primary purpose of this Protocol is **to ensure the long-term viability of the Station's scientific mission.** The restrictions on time and procedure are designed to protect the integrity of the samples from loss, theft, or environmental degradation. The Emergency Override exists to empower Senior Staff to preserve scientific assets when station systems fail.

  ### D. The Drafter's Note (Handout 4)
  *Hand out only in Round 3.*

  **ARCHIVE RECORD: DRAFTING COMMITTEE MINUTES (EXCERPT)**
  *Date: 10 January 202X*
  **Item:** Emergency Override Clause
  **Discussion:** Committee debated defining "Emergency" broadly (e.g., "imminent threat to samples").
  **Decision:** Rejected broad definition. Concerns were raised that "imminent threat" is subjective and invites self-judging by Senior Biologists. The Committee adopted the specific "Level 4" classification to ensure a clear, binary trigger, even if this means some Level 3 events are not covered. Certainty of trigger was prioritized over flexibility of response.

  ---

  ## 2. MINUTE-BY-MINUTE TIMELINE (90 Minutes)

  **00:00 – 00:05 | Setup &分组 (Grouping)**
  *   **Action:** Hand out **Ordinance** and **Cases** only.
  *   **Instruction:** "You are the Compliance Committee. Your job is not to decide what is *good*, but what is *permitted under the Protocol*. Mark each case: PERMITTED, FORBIDDEN, or UNDETERMINED."
  *   **Grouping:** Split into 4 groups (3-4 students each).
  *   **TA Role:** Circulate. If anyone asks about "spirit of the law," say: "Apply the text provided."

  **00:05 – 00:20 | Round 1 (Textualism)**
  *   **Task:** Groups decide on the 3 cases based *only* on the Ordinance.
  *   **TA Monitor:** Watch for groups debating "fairness." Redirect them to "text."
  *   **Troubleshooting:** If a group finishes in 5 minutes, give them a "What if the Duty Officer was unconscious?" variant verbally.

  **00:20 – 00:25 | Tally Round 1**
  *   **Board:** Draw a 3x4 Grid (Cases vs. Groups).
  *   **Action:** Ask each group for their verdict. Fill the grid.
  *   **Expected Result:** High consensus. Case 1 (Forbidden - Procedure), Case 2 (Forbidden - Time/Access), Case 3 (Forbidden - Breach Level).
  *   **Comment:** "Note the agreement. The text settled it."

  **00:25 – 00:40 | Round 2 (Purposivism)**
  *   **Action:** Hand out **Purpose Memos**. (Ensure A goes to Groups 1&2, B to Groups 3&4).
  *   **Instruction:** "Re-evaluate your verdicts in light of the Protocol's Purpose. You may now overturn the text if the purpose demands it."
  *   **TA Monitor:** **Crucial.** Ensure groups do not talk to each other. If they compare sheets, note it but let it ride for the reveal.

  **00:40 – 00:50 | Tally Round 2 & The Reveal**
  *   **Board:** Add a second layer to the Grid (e.g., Red markers).
  *   **Action:** Ask for verdicts.
  *   **Expected Result:**
      *   Case 1: Likely still Forbidden (Procedure protects purpose in both).
      *   Case 2: **SPLIT.** Group A (Security) says Forbidden (no contamination risk, but entry risks security). Group B (Mission) says Permitted (saved samples).
      *   Case 3: **SPLIT.** Group A says Forbidden (not a contamination event). Group B says Permitted (saved mission assets).
  *   **The Reveal:** Ask Groups A and B to read their Purpose headers aloud.
  *   **Reaction:** Let the frustration land. "Wait, you had a different sheet?"

  **00:50 – 01:00 | Round 3 (Authority/History)**
  *   **Action:** Hand out **Drafter's Note**.
  *   **Instruction:** "Final verdict. The Drafter's Note is part of the legislative history. Does this resolve the split?"
  *   **Task:** Groups discuss.
  *   **Expected Result:** Case 3 swings back to Forbidden (Drafters chose certainty over flexibility). Case 2 remains sticky (Text says no entry, Drafters don't mention thermostats).

  **01:00 – 01:15 | Debrief Part 1: Mapping the Terrain**
  *   **Board Work:** Draw four quadrants.
  *   **Mapping:**
      1.  **Round 1 Consensus:** Hart's "Core of Meaning." Rules settle coordination problems.
      2.  **Round 1 Hard Edges:** Hart's "Open Texture." (e.g., Is a fossil 'biological material' in the *relevant* sense?)
      3.  **Round 2 Split:** Fuller's "Purpose." Purpose fixes absurdity (Case 2), *but*...
      4.  **Round 2 Divergence:** The "Levels of Generality" objection. Purpose is indeterminate without a rule to fix it.
      5.  **Round 3:** The Hartian "Settlement Function." We follow the Level 4 rule not because it's best, but because it was *chosen*.

  **01:15 – 01:25 | Debrief Part 2: Naming the Debate**
  *   **Action:** Now you say "Hart" and "Fuller."
  *   **Connect:**
      *   Hart: The separation of law and morals; the value of certainty even when it yields suboptimal outcomes (Case 3).
      *   Fuller: The inner morality of law; law must be purposive to be law; absurd results undermine fidelity.
  *   **Discussion:** "Who felt more comfortable in Round 1? Who felt more comfortable in Round 2?"

  **01:25 – 01:30 | Limitations & Wrap**
  *   **Action:** Explicitly state what the exercise missed (see below).
  *   **Assign:** Reading for next week.

  ---

  ## 3. BOARD PLAN & TALLY

  **Left Board: The Grid**
  | Case | Group 1 (A) | Group 2 (A) | Group 3 (B) | Group 4 (B) |
  | :--- | :---: | :---: | :---: | :---: |
  | **R1 (Text)** | F | F | F | F |
  | **R2 (Purpose)** | F | F | P | P |
  | **R3 (Draft)** | F | ? | ? | P |

  *(Use F=Forbidden, P=Permitted. Use different colors for rounds.)*

  **Center Board: Concept Map**
  *   Draw a circle labeled "The Rule."
  *   Arrow in: "Text" (Round 1).
  *   Arrow in: "Purpose" (Round 2).
  *   Arrow in: "History/Intent" (Round 3).
  *   Write key terms as they emerge in debrief: *Open Texture, Penumbra, Indeterminacy, Settlement, Fidelity.*

  **Right Board: Parking Lot**
  *   Write down questions that are "out of scope" for the exercise (e.g., "What if someone died?", "Is this actually moral?"). Address these in the Limitations wrap-up.

  ---

  ## 4. TROUBLESHOOTING (What Will Go Wrong)

  **1. Someone names the debate in Round 1.**
  *   *Risk:* "Oh, this is Hart vs. Fuller."
  *   *Fix:* "Hold that hypothesis. Don't test it against the reading, test it against the Case. If you're right, the exercise should prove it. If you talk now, you ruin the data."
  *   *Why:* You need them to feel the confusion, not categorize it.

  **2. Groups compare Purpose Sheets.**
  *   *Risk:* They realize the trick early.
  *   *Fix:* If you catch them, don't punish. In the debrief, use it: "Group 2 noticed the variance early. Does that make the 'Purpose' more or less reliable as a guide?" It actually strengthens the "Indeterminacy" point.

  **3. Students argue the Merits (Policy) instead of Application.**
  *   *Risk:* "But obviously saving the samples is the right thing to do!"
  *   *Fix:* Interrupt. "I am not asking if it is *right*. I am asking if it is *permitted*. You are a judge, not a legislator. If the rule forbids it, your moral agreement is irrelevant."
  *   *Why:* This forces the Hartian squeeze. If they can just do what's right, there is no law.

  **4. One group finishes way early.**
  *   *Risk:* They get bored and start chatting.
  *   *Fix:* Have a "Hard Mode" question ready on the board. "What if the Duty Officer is the one who broke the rule? Does Rule 3 still apply?"

  **5. Round 3 doesn't resolve the split.**
  *   *Risk:* They ignore the Drafter's Note.
  *   *Fix:* In debrief, highlight this. "The Drafters spoke. You ignored them. Why? Because you think your Purpose is better than theirs? That is the Fuller move. Hart says: No, their choice binds you."

  ---

  ## 5. LIMITATIONS (What You Must Supply)

  Be honest in the final 5 minutes. This exercise is a model, not the whole picture.

  1.  **Fidelity to Law as a Moral Attitude:**
      *   *The Gap:* In the exercise, following the rule is a classroom task. In reality, Fuller argues that *fidelity* is a moral commitment that makes law possible.
      *   *Your Talk:* "Here, you followed the rules because I told you to. Fuller argues we follow law because it respects our agency. When law becomes purely coercive (like a gunman situation), fidelity collapses. We didn't test that collapse here."

  2.  **The Internal Point of View:**
      *   *The Gap:* Everyone in the room already accepts the rules of the seminar. You didn't have to convince them to play the game.
      *   *Your Talk:* "Hart's 'Internal Point of View' is about accepting the rule as a standard of criticism. You all did that naturally. In the real world, getting people to that point is the hard part. This exercise assumes the Internal Point of View; it doesn't explain it."

  3.  **Retroactivity & The Grudge Informer:**
      *   *The Gap:* This is prospective application. The hardest part of Hart-Fuller is about *ex post facto* punishment (the Grudge Informer case).
      *   *Your Talk:* "We applied rules to future cases. The real moral horror in this debate is when the state punishes you for something that was legal when you did it, by changing the 'purpose' later. We didn't touch that. Keep that in mind for the reading."

  4.  **The "Levels of Generality" Trap:**
      *   *The Gap:* You showed them two purposes.
      *   *Your Talk:* "Notice how easy it was to write two plausible purposes? Fuller says 'find the purpose.' Hart says 'which purpose?' If the purpose is as malleable as the text, purposivism doesn't solve the indeterminacy problem; it just hides it."

  ---

  ## 6. PREP CHECKLIST

  *   [ ] Print Ordinance (14 copies).
  *   [ ] Print Cases (14 copies).
  *   [ ] Print Purpose A (6 copies).
  *   [ ] Print Purpose B (6 copies).
  *   [ ] Print Drafter's Note (14 copies).
  *   [ ] Markers (Red/Black/Blue).
  *   [ ] Timer (visible to you).
  *   [ ] Seating arranged for 4 distinct clusters.

  This design forces the "squeeze" you asked for. Round 1 gives them Hart's security. Round 2 gives them Fuller's flexibility but breaks consensus. Round 3 shows them why Hart thinks we need the security back, even at a cost. The debrief lets you name the ghosts they just fought.
