prompt: |-
  Buridan's ass is supposed to show that rational choice theory breaks down when two options are exactly identical — the poor donkey starves because it has no reason to prefer one bale of hay over the other. Has modern decision theory actually solved this, or is there still a genuine paradox lurking in indifference?
