      *   *Bad Faith:* In the analogy, bad faith looks like the author writing a bad character. But for Sartre, bad faith is the consciousness lying to *itself*. If the author is separate from the character, it's easier to say "I'm just writing this tragic hero" rather than "I am this tragedy."

  3.  **Evaluate the "Radical Freedom" Goal:**
      *   The goal is to tell the friend: "No excuses, you chose this, you can choose differently."
      *   Does the analogy support this? Yes, it supports responsibility.
      *   Does it support *radical* freedom in the Sartrean sense? Sartre's freedom isn't just "you can change your mind." It's "you are nothing but what you do." The author analogy suggests a dualism: The Writer (free) vs. The Written (fixed). Sartre rejects this dualism. The consciousness *is* the projection. There is no writer behind the writing.
