      *   **Constraint:** Write like an email to a friend. No headings, no bullets, no bold, no tables. Continuous prose. No reading list/citations. Make a call/defend it (no hedging).
      *   **Tone:** Direct, conversational, philosophical but accessible, committed.

  2.  **Deconstruct the Analogy ("You are the author of your own life"):**
      *   *Mapping:*
          *   Author = The Conscious Self (Pour-soi).
          *   Character = The Empirical Self/Ego (Soi).
          *   Manuscript = Past actions/facticity.
          *   Revision = Future choices/transcendence.
