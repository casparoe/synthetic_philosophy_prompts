answer: |-
  This is a sophisticated position (essentially Jonathan Dancy's *Ethics Without Principles*), and standard objections usually bounce off it because they assume the very codifiability the particularist denies. To move you, we need to attack the metaphysics of reasons and the epistemology of moral perception, not the pragmatics of deliberation.

  Here is the ranking of objections based on their capacity to damage the internal coherence of hard particularism, followed by the falsifiability check and the concrete case challenge.

  ### 1. The Three Sticking Points

  #### (1) The Training/Pattern Objection
  **The Objection:** If moral perception is a trained skill, the novice is being conditioned to recognize *relevant similarities* across cases. If the training is successful, the novice's cognitive architecture has stabilized a mapping from natural features to moral valences. If that mapping is stable enough to transmit knowledge, it constitutes a function. A stable function from features to valences *is* a principle, even if implicit. If it isn't stable, the training is brainwashing, not education.
  **Particularist Reply:** They distinguish *subsumption* (applying a rule) from *similarity recognition* (seeing this case as like that one). They argue the "pattern" is a family resemblance, not a shared necessary condition.
  **Why it Fails:** Family resemblances still rely on *weighted* features. If "pain" weighs heavily in the training set, it's a default. If the trainer corrects the novice when they ignore "pain," the trainer is enforcing a normative expectation about "pain."
  **Rank:** **Forces an Awkward Amendment.**
  **Verdict:** This forces the particularist to admit that moral learning relies on *provisional generalizations* that have normative force during training but magically lose it upon mastery. It makes the transition from novice to expert inexplicable: at what point does the "rule of thumb" cease to be a truth-apt claim about reasons and become a mere heuristic?

  #### (2) The Default Valence Objection
  **The Objection:** You mentioned particularists often concede "default valence" (e.g., pain is usually a reason against). If a feature has a default valence, it exerts a *pressure* in that direction unless countered. This implies a ceteris paribus law: "Pain is a reason against, all else being equal." If you admit defaults, you have admitted principles that hold *unless* there is a defeater. If you can identify the defeater, you have a more complex principle ("Pain is a reason against unless X"). If you *cannot* identify the defeater, the default is normatively inert (why follow a default that might flip without warning?).
  **Particularist Reply:** Defaults are empirical generalizations, not normative principles. They describe how things usually go, not how they must go. They have no "invariant" commitment.
  **Why it Fails:** This creates a dilemma. If defaults are merely empirical (statistical), they lack normative *force* (is/ought gap). If they have normative force (you *should* weigh pain negatively), they act as principles. Hard particularism cannot have it both ways: it wants the guidance of defaults without the commitment of principles.
  **Rank:** **Fatal.**
  **Verdict:** This is the collapse point. Either the view collapses into a sophisticated generalism (principles with complex defeaters) or it retreats to a skepticism where we have no reason to expect pain to count against an act even in the absence of known defeaters.

  #### (3) The Epistemic/Prudential Holism Objection
  **The Objection:** If holism about valence applies to epistemic reasons (evidence E supports hypothesis H in context C1, but supports not-H in context C2), does this help particularism?
  **Particularist Reply:** It helps. It shows holism is a feature of *normativity* generally, not a weird bug in morality.
  **Why it Fails:** It guts the distinctiveness of the view. In epistemology, we still seek principles (Bayesian updating, logical consistency). If epistemic reasons are fully holistic, it threatens the possibility of justification itself. If you argue "normativity is just holistic everywhere," you haven't defended moral particularism; you've defended *normative skepticism*. Furthermore, epistemology relies on the stability of logical relations. If moral reasons are as fluid as you claim, morality becomes less like epistemology and more like aesthetics or taste, undermining its claim to objectivity.
  **Rank:** **Merely Embarrassing.**
  **Verdict:** It doesn't refute particularism, but it isolates it. It forces the particularist to argue that *all* reasoning is principle-less, which is a much harder sell than just moral principle-lessness. It makes the view less a theory of ethics and more a theory of chaos.

  ---

  ### 2. The Falsifiability Problem: "You Missed the Context"

  You asked if the view has been qualified into something unfalsifiable. **Yes, this is the single greatest risk.**

  The particularist's shield is always: "In *that* case, the feature didn't contribute because of the *context*."
  To be falsifiable, there must be a limit to what counts as "context."

  **The Test:**
  If the particularist claims that feature F (e.g., "causing pain") can count *for* an action in one context and *against* it in another, they must be able to point to the **difference-maker** in the context.
  *   If they can point to a feature G in the context that explains the flip, then the real unit of evaluation is **F+G**. If F+G *always* flips the valence, **F+G is a principle.**
  *   If they cannot point to a feature G, and say "It just does," then the valuation is **arbitrary**.

  **What would count against the view:**
  If a particularist cannot specify *any* constraints on when valence flips, the theory is compatible with every possible moral judgment. A theory that is compatible with every possible distribution of moral valences across natural properties predicts nothing.
  *   **Concession:** Particularists *should* concede that there are **constraints on holism**. Not every feature can flip valence in every context. (e.g., Dancy admits that *some* features might be invariant, even if most aren't).
  *   **Dismissal:** They rightly dismiss the demand for a *codified* list of constraints. But they cannot dismiss the existence of constraints themselves.

  **The Fatal Flaw:** If the particularist claims there are *no* constraints (radical holism), the view is unfalsifiable. If they admit there are constraints (e.g., "Pain never counts *for* torture"), they have admitted an invariant principle.

  ---

  ### 3. The Concrete Pair of Cases (The Knockout)

  You asked for a concrete pair of cases where the view is committed to something plainly unacceptable. The goal here is to force the particularist into **Arbitrariness** or **Implicit Generalism**.

  **The Setup:**
  We need two cases that are identical in all natural respects *relevant to the agent*, but where the particularist insists the moral valence differs, or vice versa.

  **Case A (The Standard):**
  You promise to meet a friend for lunch. You have no other conflicting obligations. You enjoy the lunch.
  *   *Particularist Verdict:* The promise is a reason to go.

  **Case B (The Twin):**
  You promise to meet a friend for lunch. You have no other conflicting obligations. You enjoy the lunch. **However,** the friend is a "Promise-Minimizer." They have explicitly told you, "I value spontaneity; if you promise to meet me, I feel burdened and would prefer you didn't come."
  *   *Particularist Verdict:* The promise is a reason *not* to go (or is silenced).

  **The Trap:**
  The Generalist says: "The principle is 'Keep promises unless the promisee releases you or is burdened by it.'"
  The Particularist says: "No principle. In Case A, 'promise' counts for. In Case B, 'promise' counts against (or is inert). The feature 'promise' changed valence."

  **The Fatal Counter-Move:**
  Ask the particularist: **What is the feature that caused the flip?**
  1.  **If they say:** "The friend's preference (burden)."
      *   **Then:** The relevant moral unit is not "Promise," it is "Promise + Friend's Preference."
      *   **Result:** This is a principle. "Promises bind unless the friend is burdened." The particularist has implicitly accepted a principle with a defeater clause.
  2.  **If they say:** "Nothing specific. It's the *whole situation*."
      *   **Then:** Imagine **Case C**. Case C is identical to Case B in every natural detail (same friend, same preference, same promise), but in Case C, the particularist claims the promise *is* a reason to go.
      *   **Result:** If the particularist says Case B and Case C can differ morally despite being naturally identical, they violate **Supervenience**.
      *   If they say Case B and Case C *must* have the same verdict, then the *whole situation* (Promise + Friend's Preference) acts as an invariant truth-maker. That invariant mapping from Natural Properties to Moral Valence **is a principle**.

  **The Unacceptable Commitment:**
  Hard particularism is committed to the claim that **there is no specifiable set of natural features that guarantees a moral verdict.**
  But if I present you with a case where:
  1.  Feature F is present.
  2.  No known defeaters are present.
  3.  The particularist says F counts *against*.
  4.  In a twin case, F counts *for*.

  If they cannot explain *why* without referencing a stable interaction between features, they are claiming that moral reasons are **brute facts** about specific situations that do not supervene on the interaction of properties. This makes moral knowledge impossible. If "Promise + No Defeaters" can yield "Go" today and "Don't Go" tomorrow without any change in the natural properties, morality is not just principle-less; it is **capricious**.

  ### Summary of Rankings

  1.  **Fatal:** The **Default Valence Dilemma**. Admitting defaults collapses the view into generalism (principles with defeaters) or skepticism (defaults have no force). Hard particularism cannot sustain "normative defaults without principles."
  2.  **Forces an Awkward Amendment:** The **Training Objection**. Forces the particularist to explain how we learn "rules" that we must then pretend don't exist as rules.
  3.  **Merely Embarrassing:** The **Epistemic Holism Objection**. Normalizes holism but risks making all normativity unsystematic.

  **The Falsifiability Check:**
  The view is currently **unfalsifiable** unless the particularist agrees to a **Supervenience Constraint**. They must admit that if the *total natural description* of two worlds is identical, the moral valence must be identical. If they admit this, the "total natural description" functions as a complex principle. If they deny this, they abandon moral realism.

  **What should move you:**
  The realization that **"Holism about Valence" is indistinguishable from "Complex Principles."**
  If "Lying is wrong unless it saves a life" is a principle, and the particularist says "Lying is wrong in context A, right in context B," the only difference is that the Generalist writes the context into the rule, and the Particularist keeps it in the perception. But if the context *determines* the valence, the context is part of the truth-conditions. Once you admit the context determines the valence, you have admitted a function from Context to Valence. **A function is a principle.**

  The particularist tries to hide the function in "perception." But if the perception is reliable, it is tracking a function. If it's not tracking a function, it's not reliable. There is no middle ground.
