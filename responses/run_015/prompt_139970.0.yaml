answer: |-
  This is a translation of the normative claims of sortition into the operational vocabulary of causal inference, survey sampling, and machine learning. I have flagged points where the statistical analogy requires a normative assumption to hold (**[SMUGGLE ALERT]**).

  ### 1. The Core Translation: Elections vs. Sortition

  **The Claim:** Elections select for traits orthogonal to governance (charisma, wealth, narcissism).
  **The Translation:** **Adversarial Optimization and Goodhart's Law.**
  In an election, the objective function $L$ is "win votes." The features $X$ that minimize $L$ (fundraising ability, media presence, partisan signaling) are not the features that minimize the true societal loss function $L_{true}$ (welfare, stability, justice). Because the optimization surface is high-dimensional and adversarial (opponents actively try to break your model), the system converges on a local minimum that overfits to short-term signals. Sortition removes the optimization step entirely. It treats the selection process as a **randomized prior** over the parameter space of human traits, preventing the system from gradient-descending into pathological configurations.

  **The Claim:** Descriptive representation matters intrinsically.
  **The Translation:** **Covariate Balance and Integration.**
  Let $Y$ be the policy outcome and $X$ be the lived experience/demographics of the population. The social welfare function is $W = \int E[Y|X] dP(X)$. An elected body often has $P(X)_{body} \neq P(X)_{pop}$. If the relationship $E[Y|X]$ is non-linear (which it is; a policy hurts the poor differently than the rich), then $E[Y | X \in Body]$ is a biased estimator of $W$. Sortition ensures $P(X)_{body} \approx P(X)_{pop}$ (covariate balance), allowing the body to approximate the integral $\int$ via Monte Carlo sampling rather than parametric modeling.
  **[SMUGGLE ALERT]:** This assumes that "lived experience" is a covariate $X$ that causally influences the optimal $Y$, and that the mapping $X \to Y$ is not fully learnable by a non-representative group (i.e., you can't just model the poor if you are rich).

  **The Claim:** Sortition is immune to faction and rent-seeking.
  **The Translation:** **Reducing Attack Surface and Variance.**
  Elections create high-value targets (swing districts, key donors) for adversarial actors (lobbies, foreign influence). This introduces high-variance noise into the estimator. Sortition creates a large, rotating ensemble of $N$ decision-makers. To corrupt the output, an adversary must shift the distribution of the majority of the sample, which requires $O(N)$ resources rather than $O(1)$ resources for a key committee chair. It increases the cost of adversarial perturbation.

  **The Claim:** Deliberation produces better outcomes than raw opinion.
  **The Translation:** **Denoising and Ensemble Averaging.**
  Raw public opinion is a noisy label $Y_{noisy} = Y_{true} + \epsilon$. Deliberation is a denoising function $f(\cdot)$ applied to the sample. By averaging over a diverse ensemble (the sortition body) after applying $f$, you reduce the variance of the estimator compared to a single expert (dictator) or a noisy aggregate (referendum).
  **[SMUGGLE ALERT]:** This assumes $f$ (deliberation) is unbiased. If $f$ has a systematic bias (e.g., facilitator influence), you are just consistently denoising toward the wrong signal.

  ---

  ### 2. Puzzle One: Stake-Weighted Sampling

  **The Proposal:** Sample individuals with probability proportional to how much the decision affects them.
  **The Translation:** **Importance Sampling under Covariate Shift.**
  Standard sortition assumes the estimand is the population mean: $\mu = E_{P_{pop}}[Y]$.
  Stake-weighting proposes sampling from $Q(x) \propto P_{pop}(x) \cdot S(x)$, where $S(x)$ is the "stakes" or magnitude of impact on unit $x$.
  To recover the population mean $\mu$ using samples from $Q$, you must apply Inverse Probability Weighting (IPW): $w(x) = P_{pop}(x) / Q(x) \propto 1/S(x)$.
  However, proponents of stake-weighting *do not* want to re-weight back to the population mean. They want the estimator to reflect $E_{Q}[Y]$.

  **Does it hang together?**
  Statistically, this is only an unbiased estimator if the estimand is redefined.
  *   **Estimand A:** "The average welfare of the population." -> Stake-weighting is **biased**. It oversamples high-stakes units.
  *   **Estimand B:** "The total sum of welfare changes" (Utilitarian). -> Stake-weighting is **efficient**. It reduces variance by oversampling units with high variance in outcome (since high stakes usually correlate with high outcome variance).
  *   **Estimand C:** "Minimize maximum regret/harm" (Rawlsian/Minimax). -> Stake-weighting is a **heuristic for tail risk**. By oversampling the vulnerable (high stakes), you ensure the decision boundary isn't optimized solely for the low-stakes majority.

  **The Verdict:**
  Stake-weighting is not an estimation strategy for the *mean*; it is an optimization constraint on the *loss function*. It changes the objective from $\min \sum (y - \hat{y})^2$ to $\min \sum S(x) \cdot (y - \hat{y})^2$.
  **[SMUGGLE ALERT]:** This smuggles in a normative claim that a unit of welfare for a high-stakes person is worth more than a unit for a low-stakes person, OR that we care more about reducing variance for the vulnerable than accuracy for the whole. It is not "more representative"; it is "more weighted."

  ---

  ### 3. Puzzle Two: Deliberative Drift

  **The Observation:** A mini-public starts as a representative sample ($T=0$) but ends with opinions ($T=1$) that differ from a fresh sample.
  **The Translation:** **Distribution Shift vs. Causal Estimand.**

  You have two competing targets:
  1.  **Descriptive Target:** $P(Y)_{pop}$. The goal is to mirror the current state of the population.
      *   *Drift Diagnosis:* **Sample Degradation.** The deliberation process introduces a selection bias or measurement error. The sample is no longer exchangeable with the population.
  2.  **Causal Target:** $E[Y | do(\text{Information}, \text{Deliberation})]$. The goal is to estimate what the population *would* think if treated with information and time.
      *   *Drift Diagnosis:* **Treatment Effect.** The drift is the signal, not the noise.

  **Can you want both?**
  Only if you assume **Homogeneous Treatment Effects (HTE)**.
  If the effect of deliberation $\tau(x) = E[Y|do(T), X] - E[Y|X]$ is constant across all $X$, then the deliberated sample is a valid estimator for the deliberated population.
  However, if $\tau(x)$ is heterogeneous (e.g., education level interacts with briefing materials), then a small mini-public ($n=500$) cannot reliably estimate the population-level causal effect without knowing the interaction terms.

  **The Failure Mode:**
  **Confounding by Facilitator.**
  In your A/B test terms, the "Treatment" is not just "Information." It is "Information + Facilitator Protocol + Group Dynamics."
  Let $Z$ be the facilitator bias. The observed outcome is $Y = \beta_0 + \beta_1 T + \beta_2 Z + \epsilon$.
  Because there is no control group (a non-deliberating sample) and no variation in $Z$ (usually one set of rules), $\beta_1$ (the value of deliberation) is confounded with $\beta_2$ (the value of the specific protocol).
  **[SMUGGLE ALERT]:** Calling the output "The Informed Will of the People" assumes that $\beta_2 \approx 0$ (facilitators are neutral) and that the specific $T$ (3 days of briefing) is the *only* valid intervention to define "informed." This is defining the counterfactual by fiat.

  ---

  ### 4. Residue Report

  #### What Sortition Has That You Don't (The Normative Residue)
  1.  **Consent as a Constraint, Not a Variable:** In DS, we minimize loss subject to constraints (e.g., fairness). In politics, "consent" is a hard constraint on the system's existence. You cannot "sample" a citizen into a role with coercive power without a legitimacy cost that doesn't exist in survey sampling. Your vocabulary treats units as passive sources of data; sortition treats them as active agents who must authorize the loss function.
  2.  **Authority $\neq$ Accuracy:** You are trained to trust the model with the lowest validation error. Sortition argues that authority comes from the *procedure* (randomization), not the *accuracy* of the output. A randomly selected body can make a "suboptimal" decision (higher loss) but still possess more authority than an expert panel (lower loss). This is akin to preferring a randomized algorithm over a deterministic one for security reasons, even if the deterministic one is faster. It's a feature, not a bug, but it breaks the "minimize loss" paradigm.

  #### What You Have That Sortition Underrates (The Frame Sovereignty)
  1.  **The Sampling Frame is the Sovereign:** You identified this, but the implication is deeper. In ML, whoever defines the labels $Y$ owns the problem. In sortition, whoever writes the briefing book, defines the strata for the random draw, and sets the agenda for deliberation holds **Admin Privileges**.
      *   *The Risk:* It looks like $P(Selection) = Uniform$, but if the Frame $F$ excludes certain populations (e.g., "no one who can take 3 weeks off work"), then $P(Selection | F)$ is highly biased.
      *   *The Sortition Blindspot:* They treat the randomization as a "truth machine." You know that **garbage in, garbage out** applies to sampling frames just as much as training data. The political fight doesn't disappear; it just shifts upstream to the definition of the strata and the curation of the briefing materials (the "labels").
  2.  **Power Analysis:** Sortition proposals often ignore effect sizes. A mini-public of 500 people has high variance on low-prevalence but high-intensity issues. Your vocabulary demands a power analysis: *What is the minimum detectable effect of this policy on this subgroup?* Sortition advocates often assume $N=500$ is "representative" without calculating the confidence intervals on the specific decisions they are asked to make.

  ### Summary
  Sortition is an attempt to replace an **adversarially optimized, high-bias selector** (elections) with a **randomized, low-bias estimator** (sortition), processed through a **denoising function** (deliberation).

  *   **Stake-weighting** is not sampling; it's redefining the loss function to weight tail risks higher.
  *   **Deliberative drift** is a causal estimand ($do$-operator), but it is currently unidentifiable because the "treatment" (facilitation) is confounded.
  *   **Your leverage point:** The person who defines the sampling frame and the briefing materials is the true model architect. In a democracy, we argue about the weights (votes). In a lottocracy, we would argue about the schema.
