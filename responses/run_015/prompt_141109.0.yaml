      *   *Counter:* If "reason" is defined by its truth conditions (e.g., "It is good that X happens"), then it can exist without an agent.
      *   *Verdict:* The analogy begs the question. It assumes relationalism to prove relationalism.

  6.  **Developing Better Analogies/Cases:**
      *   *Mathematics:* 2+2=4 is true even if no one counts. Is a normative truth like a mathematical truth?
