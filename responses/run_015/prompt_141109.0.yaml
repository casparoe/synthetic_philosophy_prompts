      *   *Lock:* The Agent (or the agent's psychology/capacity).
      *   *Locksmith:* The source of normativity (God, Evolution, Rationality, Society).
      *   *Bit of Metal:* A consideration that *looks* like a reason but isn't (a pseudo-reason).
      *   *Door Opening:* The Action (or the realization of value).
      *   *Variables:*
