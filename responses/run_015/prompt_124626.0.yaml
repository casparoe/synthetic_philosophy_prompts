prompt: |-
  Analyze the International Olympic Committee's post-1999 exhaustive-ballot procedure for selecting Olympic host cities, taking as your concrete case the election held on 7 September 2013 in Buenos Aires that awarded the 2020 Summer Olympics to Tokyo. The salient mechanics and results are these: three candidate cities—Tokyo, Madrid, and Istanbul—were in contention; IOC members (approximately 100 active members, excluding those from bidding nations) voted in rounds until an absolute majority was reached; in Round 1, Tokyo received 42 votes, Madrid 26, and Istanbul 26; because Madrid and Istanbul tied for the lowest, a runoff was held to determine elimination, which Madrid lost (45 to 49); in Round 2, Tokyo defeated Istanbul 60 to 36.

  Read this episode through the Gibbard-Satterthwaite theorem: with three or more alternatives, any social choice function that is non-dictatorial and strategy-proof must have its range restricted to at most two alternatives—effectively, it cannot genuinely choose among all three without being manipulable.

  Your task is to run the analysis in both directions. First, map the theorem onto the episode with discipline: identify the precise player set, the preference orderings that were plausibly in play (e.g., regional blocs, risk assessments regarding Istanbul's political context or Madrid's austerity conditions, and Asian versus European coalition dynamics), and the strategic options available—particularly whether supporters of Madrid, knowing they faced a tie-break risk, could have misrepresented first-round preferences to alter the runoff pairing or the Round 2 outcome. Second, examine where the theoretical framing strains or breaks: the IOC rules technically restrict the range through sequential elimination and tie-breaking runoffs, which might seem to satisfy the theorem's escape clause. But does this procedural architecture actually eliminate manipulation, or does it merely displace it—into the tie-break dynamics, into second-round strategic voting once one city is eliminated, or into anticipatory voting in Round 1 designed to engineer a favorable pairing? Be explicit about whether the range is genuinely restricted to two alternatives at each decision node, or whether the multi-round structure preserves a three-alternative strategic environment across rounds.

  Finally, tell me what this episode reveals about the practical force of the Gibbard-Satterthwaite result for institutional design. Is strategy-proofness an achievable criterion for real-world collective choice bodies, or does the IOC case suggest that procedural complexity—exhaustive ballots, tie-breaking runoffs, and round-dependent eligibility—functions less as an immunization against manipulation and more as a mechanism that obscures it? I want an honest accounting of what the theorem explains here, where it is silent, and whether the episode should be read as confirming that manipulation is inevitable, or as showing that well-structured range restriction can genuinely contain it. Do not supply bibliographies or reading lists; work from the theoretical structure and the institutional facts given above.
