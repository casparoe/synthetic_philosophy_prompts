prompt: |-
  Hey — you're a professional political philosopher who's spent years on desert, luck, and distributive justice, and who has also read enough cooperative game theory (Shapley value and its rivals, surplus-sharing, that whole world) to know where the bodies are buried. Before you write anything, brainstorm for a bit: sketch three or four different ways of sharpening my question, say plainly which one you'd actually go with and why, and kill off the ones that are dead ends. Then think carefully about what would break the argument you pick. Be concrete, and don't hedge everything into mush.

  I'm applying for a one-year dissertation fellowship and I need a proposal I can basically paste into the application — call it 1000 words, two pages. No citations, I'll drop those in myself. Here's my half-formed idea, which I've been turning over for like a year and cant get into shape.

  Everybody in the meritocracy fight seems to agree on one thing without noticing that they agree on it: that there is a determinate fact of the matter about how much each individual contributed, and that desert tracks it. The anti-desert people say fine, but nobody deserves their natural endowments or the capacity for effort that flows from them, so the contribution isn't really theirs. The luck people say brute luck leaks in everywhere downstream. The efficiency defenders say just pick the highest-contributing candidate and stop doing metaphysics. And the recent critics who argue that meritocracy has turned into a new hereditary caste mostly fight about which traits get counted as merit, and about what the system does to people's characters and to the losers. What none of them ask, as far as I can tell, is whether the *unit* of contribution is well-defined in the first place — which is a question that comes logically before all of theirs.

  Here's the bit I think is actually new. A huge amount of real allocation happens in jointly produced settings: coauthored papers, surgical teams, a product org shipping a release, an orchestra, an open-source codebase, a firm's annual promotion round. In those settings output is frequently non-separable — with strong complementarities between people, the group produces more than the sum of what the members would produce on their own, and no individual's marginal contribution is picked out by the facts. How much someone "added" depends on which ordering of the team you imagine them joining, or on which surplus-sharing rule you reach for: average marginal contribution across all orderings, an equal split, everything to whoever was indispensable, and so on. My hunch is that in these settings the claim that the best person got the job isn't false, it's indeterminate, and that the choice among those rules is not settled by any fact that desert-talk cares about. If that's right, meritocracy in these domains isn't defeated by luck — it never gets off the ground, because there's nothing determinate for desert to track.

  Two other things I want in there. First, the indispensability intuition (without her it wouldn't have happened at all) and the contribution intuition (how much she added) come apart sharply in non-separable cases, and ordinary desert judgements seem to slide between them depending on how the case is described. Is that slide a bug in our intuitions, or a real ambiguity in the concept of desert? Second — I'm much less sure about this one, tell me if it belongs in the proposal at all — the standard institutional fix is to install individual performance metrics, which manufacture separability rather than discover it. I want to call the resulting problem metric capture: rewards flow to whoever's contribution is legible to whatever metric got installed, and installing the metric changes the production function itself, so it partly determines what anyone can later be said to have deserved. Is that a genuinely new objection, or just the old complaint about arbitrariness in a lab coat?

  So turn all that into a proposal. I need: (a) the question stated tightly enough that it has a determinate answer and isn't just a gesture at a topic; (b) why the existing positions don't already settle it, including an honest treatment of the worry that what I'm calling indeterminacy is just brute luck in a costume; (c) what I would actually do month by month across twelve months, and why that method rather than the obvious alternatives — a straight conceptual analysis on one side, or going empirical and running intuition surveys on the other; (d) what a successful result would look like — what could I assert at the end of the year that I can't assert now — and, separately, what would count as the project failing; and (e) a straight assessment of whether this is one year of work or three, and if it's three, exactly what you'd cut to make it fit. Also give me your view on whether the metric capture material should be a chapter or a footnote.

  Write it as a real proposal document — something a fellowship committee would read as a plan — in my voice but tighter. And seriously, no bibliography and no suggested reading.
