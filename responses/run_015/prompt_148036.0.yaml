  ### Strategic Assessment (Pre-Writing)

  **Sharpening the Question:**
  1.  **The Metaphysical Route:** Ask whether "contribution" exists as a natural kind. *Verdict:* Dead end. Too abstract; disconnects from distributive justice stakes.
  2.  **The Technical Route:** Argue that Shapley values are the only coherent way to measure contribution. *Verdict:* Dead end. Concedes the normative ground to economics; misses the philosophical point that choosing Shapley is itself a normative act.
  3.  **The Sociological Route:** Focus entirely on "metric capture" and how institutions construct merit. *Verdict:* Dead end. Becomes descriptive sociology; loses the normative punch about desert.
  4.  **The Normative Indeterminacy Route (Selected):** Argue that in non-separable production, there is no fact of the matter about individual contribution *prior* to choosing a distribution rule. Desert lacks an object. *Why:* This attacks the premise of meritocracy rather than the outcome, using game theory as a tool rather than a solution.

  **Vulnerability Check:**
  The argument breaks if a critic shows that one solution concept (e.g., Shapley) is uniquely justified by the concept of desert itself, rather than being an external imposition. I must prove that choosing a solution concept is a normative decision, not a discovery of fact.

  **Metric Capture Verdict:**
  Make it a concluding chapter, not a footnote. It shows the real-world stakes of the indeterminacy. However, it is contingent on the core argument holding. If the indeterminacy thesis fails, metric capture is just standard arbitrariness.

  **Scope:**
  This is a three-year project compressed. To fit one year: Cut the historical genealogy of meritocracy. Focus strictly on the logical priority of definability.

  ***

  ### Project Proposal: The Indeterminacy of Merit

  **Project Summary**
  Contemporary debates over meritocracy assume a determinate fact of the matter regarding individual contribution. Luck egalitarians argue we deserve none of it; meritocrats argue we deserve some of it. Both sides assume the quantity exists to be distributed. This project challenges that prior assumption. In jointly produced settings characterized by non-separable production functions—teams, firms, collaborative research—individual marginal contribution is mathematically indeterminate. There is no fact of the matter about how much a specific agent added independent of a chosen surplus-sharing rule. Consequently, desert claims in these domains are not false; they are indeterminate. Meritocracy fails not because luck interferes, but because there is nothing determinate for desert to track.

  **The Problem**
  Existing literature treats contribution as a pre-political fact subject to normative distortion by luck. The luck egalitarian complains that endowments are arbitrary; the meritocrat complains that barriers distort measurement. Both overlook the structural indeterminacy of joint production. When output exceeds the sum of individual inputs due to complementarities, no individual's marginal product is picked out by the facts. How much an agent contributed depends on the ordering of entry or the surplus-sharing rule adopted (e.g., Shapley value vs. equal split).

  This creates a logical priority problem. Before asking who deserves what, we must ask what is being deserved. If the unit of contribution is undefined prior to the selection of a distribution rule, then the choice of rule cannot be justified by desert. It must be justified by other normative grounds, such as equality or efficiency. This renders the standard meritocratic justification circular: it uses a distribution rule to define contribution, then uses contribution to justify the distribution.

  A specific worry arises here: is this indeterminacy just brute luck in a costume? If the outcome depends on the arbitrary choice of a solution concept, isn't that just another form of moral arbitrariness? No. Luck egalitarianism assumes a baseline of defined entitlements that are then scrambled by luck. This project argues the entitlements themselves are undefined. The arbitrariness is constitutive, not disruptive.

  **Methodology**
  This project employs conceptual analysis informed by cooperative game theory. I will not run empirical intuition surveys. Ordinary intuitions about desert slide between "indispensability" (counterfactual necessity) and "contribution" (marginal product) precisely because the concepts come apart in non-separable cases. Surveying these intuitions would only catalog the confusion, not resolve it. Instead, I will formalize the conditions under which contribution becomes non-separable and demonstrate that no unique solution concept emerges from the concept of desert alone.

  **Work Plan (12 Months)**
  *Months 1–3:* Formalize the indeterminacy thesis. Map the landscape of solution concepts (Shapley, nucleolus, equal split) against standard desert criteria. Establish that no single concept satisfies all desert intuitions without remainder.
  *Months 4–6:* Draft the core argument. Demonstrate that selecting a solution concept is a normative act, not a measurement procedure. Address the "brute luck" objection explicitly.
  *Months 7–9:* Develop the "Metric Capture" chapter. Show how institutional performance metrics manufacture separability where none exists, thereby determining desert retroactively. This is not merely measurement error; it is ontological construction.
  *Months 10–12:* Revision and integration. Tighten the argument against potential counterarguments from conventionalist accounts of desert. Prepare manuscripts for publication.

  **Expected Outcomes**
  A successful project yields three assertable claims: (1) In non-separable production, individual contribution is indeterminate prior to a distribution rule. (2) Therefore, meritocratic justification in these domains is logically circular. (3) Institutional metrics do not measure merit; they construct it, rendering "metric capture" a deeper problem than arbitrariness.

  Failure conditions are specific. The project fails if: (1) It can be shown that one solution concept (e.g., Shapley) is uniquely implied by the concept of desert itself. (2) The indeterminacy is shown to be negligible in real-world institutional contexts. (3) The "metric capture" argument collapses into standard complaints about measurement error.

  **Scope and Feasibility**
  This is fundamentally a three-year project compressed into one. The risk lies in the game-theoretic formalization and the normative synthesis. To ensure completion within the fellowship year, I will cut the historical genealogy of meritocracy entirely. The argument will stand on logical priority, not historical contingency. The "Metric Capture" section will remain a concluding chapter rather than a standalone part; if the core indeterminacy argument stalls, this section will be excised for a separate article. The core deliverable is the philosophical proof of indeterminacy, not a full sociology of institutions.

  This fellowship enables the focused time required to bridge the technical gap between cooperative game theory and political philosophy without diluting the normative stakes. The result will be a monograph manuscript that shifts the debate from distributing merit to defining it.
