      *   *Broad cause areas:* Means high-level allocation, not project-level granularity.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Pain Point 1: ITN Interdependence.*
          *   Problem: Neglectedness lowers cost. Tractability per dollar includes cost.
