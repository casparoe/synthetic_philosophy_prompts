answer: |-
  # Specification: Cause-Prioritization Framework for Small Foundations

  **Scope and Purpose:**
  This specification defines the adequacy conditions for a cause-prioritization method used by a small foundation with a fixed capital endowment and a ten-year spending horizon. The framework must allocate capital across broad cause areas without the ability to observe or coordinate with other funders. The objective is to maximize expected value under constraints of information asymmetry and moral uncertainty.

  ---

  ## I. Requirements for Adequacy

  ### 1. Metric Unification (The Production Function Requirement)
  **Requirement:** The framework must not generate separate scores for importance, tractability, and neglectedness. It must instead define a single unitary metric of value (e.g., expected well-being units per dollar) derived from an explicit production function where "neglectedness" enters solely as a cost variable and "tractability" as a conversion rate.
  **Motivating Case:** Standard ITN scoring treats these factors as orthogonal axes, leading to double-counting. Neglectedness reduces the price of impact; tractability measures impact per dollar. If price is already low due to neglectedness, a high "tractability per dollar" score merely reflects that low price. Separating them inflates the apparent value of crowded fields that happen to have low costs, or undervalues expensive but high-leverage fields.
  **Status:** **Non-negotiable.** (Logical consistency).

  ### 2. Dynamic Marginal Scheduling (The Diminishing Returns Requirement)
  **Requirement:** The framework must not rank causes based on average effectiveness. It must produce a *Marginal Value Schedule* for each cause area, mapping the expected value of the next dollar against the cumulative amount already invested by the foundation over the ten-year horizon.
  **Motivating Case:** Cause areas are not linear. The first $1M in a niche may solve the problem; the tenth $1M may yield nothing. A static ranking ignores that the foundation's own spending depletes the best opportunities within a cause. Without a schedule, the foundation cannot optimize the intertemporal allocation of its fixed pot, risking oversaturation of a single cause while higher-marginal opportunities exist elsewhere.
  **Status:** **Non-negotiable.** (Economic adequacy).

  ### 3. Explicit Counterfactual Baseline (The Fungibility Requirement)
  **Requirement:** For every cause area, the framework must specify a *Displacement Probability*: an estimate of the likelihood that funding withdrawn by this foundation would have been supplied by other actors (government, other philanthropists, or market forces) within the same horizon.
  **Motivating Case:** In the absence of coordination, funding is partially fungible. If a foundation funds a vaccine trial that would have been funded by a government anyway, the counterfactual impact is zero (or the value of the government's alternative spend). Standard methods often assume a "doing nothing" baseline, which overestimates impact in crowded spaces. This requirement forces the evaluator to model the behavior of invisible actors.
  **Status:** **Non-negotiable.** (Causal validity).

  ### 4. Threshold Probability Integration (The Non-Linearity Requirement)
  **Requirement:** The valuation function must include a variable for *Threshold Probability*: the likelihood that total global spending (foundation + others) crosses a specific tipping point required for success. The marginal value of the foundation's dollar must be adjusted by its marginal contribution to crossing that threshold.
  **Motivating Case:** Some interventions (e.g., policy change, eradication efforts) have step-function returns. A dollar is worthless if total spending is $1M short of the goal, but invaluable if it is the final dollar. Standard marginal analysis assumes smooth returns. Since the foundation cannot observe others' spending, it must model the probability distribution of total global spend to estimate its own pivotality.
  **Status:** **Non-negotiable.** (Per prompt constraints on non-additive returns).

  ### 5. Credence-Weighted Moral Expectation (The Axiological Requirement)
  **Requirement:** Final value estimates must be an expectation taken over a distribution of moral theories (e.g., totalist, person-affecting, rights-based), weighted by the foundation's credence in each. This calculation must apply a discount factor to moral theories that rely on probabilities below a specified epistemic floor (e.g., <1%) to mitigate Pascal's Mugging risks.
  **Motivating Case:** Under axiological uncertainty, maximizing expected value according to a single theory (e.g., total utilitarianism) may lead to reckless bets on low-probability, high-payoff outcomes that are worthless under other plausible moral views. A robust framework must hedge moral risk rather than assuming moral certainty, while preventing infinitesimal probabilities from dominating the calculation.
  **Status:** **Preference.** (Philosophical stance; moral realists may reject weighting false theories).

  ---

  ## II. Structural Tensions and Exclusions

  ### Incompatibility Flag: Requirements 2 & 3 vs. Contextual Constraints
  There is a severe tension between **Requirement 2 (Dynamic Marginal Scheduling)** and **Requirement 3 (Explicit Counterfactual Baseline)** given the foundation's constraint that it **cannot observe other funders**.
  *   **The Conflict:** To accurately model your own marginal returns (R2), you must know how much others are spending, because their spending determines the "cheap" opportunities remaining. To model displacement (R3), you must know what others *would* do.
  *   **The Consequence:** The framework cannot satisfy these requirements with data. It forces the foundation to substitute *data* with *subjective priors* about other actors' behavior. This introduces high variance. A framework that demands precise marginal schedules in an environment of total information opacity risks false precision.

  ### Most Exclusionary Requirement
  **Requirement 2 (Dynamic Marginal Scheduling)** excludes the largest share of existing prioritization tools.
  *   **Reason:** Most cause prioritization research (including standard ITN analyses) produces static rankings (e.g., "Global Health is better than Animal Welfare"). They treat cause areas as buckets with fixed efficiency. Very few organizations model the *depletion curve* of their own capital within a cause over a decade. Implementing R2 requires granular pipeline data that most broad-cause foundations do not possess.

  ---

  ## III. Comparative Analysis of Existing Approaches

  **1. Three-Factor Scoring (Standard ITN)**
  *   **Performance:** Fails **R1** (treats factors as independent, inviting double-counting) and **R2** (ranks average rather than marginal value). It typically ignores **R3** (assumes a "doing nothing" baseline) and **R4** (assumes smooth returns).
  *   **Verdict:** Inadequate. It is a heuristic for initial screening, not an allocation framework for a fixed pot.

  **2. Straight Marginal Cost-Effectiveness Analysis (CEA)**
  *   **Performance:** Passes **R1** and **R2** (focuses on marginal units of cost/outcome). However, it typically fails **R3** (often assumes perfect additivity without displacement checks) and **R5** (usually assumes a single moral metric, e.g., DALYs). It struggles with **R4** unless explicitly modeled as a step-function.
  *   **Verdict:** Economically sound but causally naive. It works well for direct implementation but poorly for broad cause allocation where fungibility is high.

  **3. Portfolio or Robustness-Weighted Expected Value**
  *   **Performance:** Excels at **R5** (explicitly hedges moral and empirical uncertainty). It often handles **R4** well by treating threshold risks as volatility. However, it frequently fails **R2** (treats causes as financial assets with fixed correlation/return profiles rather than diminishing production functions) and **R3** (focuses on internal robustness rather than external counterfactuals).
  *   **Verdict:** Philosophically robust but economically imprecise. It prevents catastrophic moral errors but may misallocate capital due to a lack of marginal granularity.
