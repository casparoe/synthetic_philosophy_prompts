      *   *Pain Point 2: Marginal vs. Average.*
          *   Problem: Causes aren't linear. Spending changes the landscape.
          *   Solution: Must model the *Marginal Cost-Effectiveness Curve* (or ROI curve) for each cause, updating as funds are allocated.
          *   Requirement: **Diminishing Returns Modeling.**
          *   Status: Non-negotiable (otherwise you oversaturate causes).

      *   *Pain Point 3: Counterfactuals.*
          *   Problem: Fungibility. If I fund X, does someone else fund Y? Or does nothing happen?
          *   Solution: Must explicitly define the "Funding Displacement Function" for each cause area. Since we can't observe others, this must be a probabilistic estimate of crowding out.
          *   Requirement: **Explicit Counterfactual Specification.**
          *   Status: Non-negotiable (otherwise value is illusory).

      *   *Pain Point 4: Non-additive Returns (Thresholds).*
          *   Problem: Some things only work if *total* funding hits $X. My dollar depends on others.
          *   Solution: Must incorporate *Probability of Threshold Achievement* as a variable in the valuation function.
          *   Requirement: **Threshold Sensitivity.**
          *   Status: Preference (controversial). Many effective altruists think thresholds are rare or overhyped. But for a 10-year horizon, they matter. Let's make it Non-negotiable for *adequacy* given the prompt's specific demand to handle this.

      *   *Pain Point 5: Axiological Uncertainty.*
          *   Problem: Totalism vs. Person-Affecting. Long-tail risks.
          *   Solution: Must use *Expectation over Moral Theories* weighted by credence, but capped or adjusted for "recklessness" (tiny prob of huge payoff).
