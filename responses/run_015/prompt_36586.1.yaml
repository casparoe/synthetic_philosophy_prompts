  8.  **Final Polish:** Ensure the distinction between "Negative Utilitarianism" (NU) and "Suffering-Focused Ethics" (SFE) is clear. NU is a specific meta-ethical claim; SFE is a priority view. The group is drifting toward NU, but the procedure should be SFE-compatible to avoid the "destroy the world" implication immediately. I will frame it as SFE with NU leanings.

      *(Wait, one detail)*: The prompt asks for "thresholds at which the answer is sufficient, insufficient, or indeterminate." I need to make sure the rubric has these specific labels.
      *   *Sufficient:* Passes to next round.
