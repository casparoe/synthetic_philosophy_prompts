prompt: |-
  me and my friend got into it last night about that Rietdijk-Putnam arguement — the one where special relativity kills any global "now" and you get the block universe. he pushed it way further and now i think he's accidentally disproving quantum mechanics? i need someone to tell me where the sleight of hand is.

  here's his chain, more or less:

  (1) if there's no privileged present slice, every event in spacetime is equally real. that's the block.
  (2) quantum mechanics assigns amplitudes to outcomes. in the block, all those outcomes are just regions of spacetime.
  (3) but SR says for spacelike-separated events there's no objective fact about which comes first.
  (4) so take two measurements, M1 and M2, that are spacelike separated. in one frame M1 preceeds M2; in another, reversed.
  (5) since both are already real in the block, and causal order tracks temporal order, in frame 1 M1 fixes M2's result, and in frame 2 vice versa.
  (6) so the block doesn't contain one quantum history — it contains every assignment of outcomes arranged so each is causally determined relative to some frame.
  (7) but QM predicts probabilistic correlations, not deterministic frame-dependent ones. in fact this setup forces correlations that violate Bell's inequalities.
  (8) therefore either reject the block universe, or reject quantum mechanics.

  he says Rietdijk-Putnam accidentally kills QM. i feel like step 5 smuggles in causation that the block view shouldn't allow — treating frame-relative ordering as physical causation for spacelike events. but i can't quite name what it costs me to reject that step. which premise should i bite the bullet on, and what does fixing it do to the rest?
reasoning: |-
