      *   **Context:** User is writing a paper on political theology.
      *   **Problem:** People cite it loosely, often blurring the line between charity/moral legitimacy and state coercion.
      *   **Task:** Break down the slogan into precise conceptual claims (a "menu").
      *   **Specific Requirements:**
          *   Categorize claims (conceptual, empirical, normative, theological).
          *   Identify which are tautologies vs. controversial.
          *   Identify what Pascal likely meant (Jansenist context).
          *   Address the roommate's argument (non-coercive moral systems are invalid).
          *   No sources needed, just a conceptual map.

  2.  **Deconstruct the Quote:**
      *   *Part A:* "Justice without force is powerless."
      *   *Part B:* "Force without justice is tyrannical."
      *   *Implicit Synthesis:* We need both together for a legitimate/effective political order.

  3.  **Brainstorming the "Menu" of Claims:**

      *   *Claim 1: Efficacy/Power.* Justice needs teeth to be realized in the world. (Empirical/Pragmatic)
      *   *Claim 2: Legitimacy.* Force needs a moral justification to not be mere brutality. (Normative)
      *   *Claim 3: Definition.* Is "Justice" defined by its ability to be enforced? (Conceptual)
      *   *Claim 4: Anthropology.* Why is force needed? Because humans are sinful/corrupt. (Theological/Empirical)
      *   *Claim 5: The Synthesis.* The State *must* combine these. (Institutional Design)

  4.  **Categorizing & Evaluating Claims:**

      *   *Tautologies:* "Force without justice is tyranny" is almost definitional. If force is unjust, we call it tyranny.
      *   *Controversial:* "Justice without force is powerless." Is it *powerless* or just *ineffective*? Is moral power different from coercive power?
      *   *Pascal's Intent:* Jansenism emphasizes original sin, human wretchedness, the hidden God. He's skeptical of human reason and virtue. He sees political order as a remedy for sin, not a realization of divine kingdom.
      *   *Roommate's Argument:* "Non-coercive moral system = invalid." This is a strong claim. Does the quote support it? Only if "powerless" equals "invalid."

  5.  **Drafting the Content (Iterative Process):**

      *   *Introduction:* Acknowledge the quote's ubiquity and the user's frustration. Confirm the source (*Pensées*, fragment 298/103 depending on numbering).
      *   *The Menu:*
          1.  **The Pragmatic Claim (Efficacy):** Justice needs enforcement to change behavior. (Empirical).
          2.  **The Legitimacy Claim (Normative):** Coercion needs moral cover to be stable. (Normative).
          3.  **The Anthropological Claim (Sin):** Why do we need force? Because people are bad. (Theological/Empirical).
          4.  **The Conceptual Claim (Definition):** Justice *is* the authorized use of force. (Conceptual/Tautological risk).
          5.  **The Eschatological Claim (Two Kingdoms):** Earthly justice isn't divine justice. (Theological).
      *   *Evaluating the Claims:* Mark which are tautologies (Legitimacy) vs. controversial (Efficacy/Conceptual).
      *   *Pascal's Context:* Jansenism. Human corruption. "Custom is nature." Force creates order, which allows peace, but it's not *true* justice in the divine sense. It's a stopgap.
      *   *Addressing the Roommate:* The roommate is making a category error. "Powerless" $\neq$ "Invalid." Moral systems can be valid without coercive power (e.g., conscience, charity). Pascal would likely disagree with the roommate because he distinguishes between the "order of bodies" (force) and the "order of minds/charity" (truth/love).

  6.  **Refining the Tone:**
      *   Academic but accessible.
      *   Structured clearly (bullet points, bold text).
      *   Directly answering the specific prompts (tautologies, Pascal's intent, roommate's argument).

  7.  **Self-Correction/Review during drafting:**
