answer: |-
  This is a classic stalemate in nationalism studies, essentially a replay of the debate between Ernest Gellner/Benedict Anderson (Modernists) and Anthony D. Smith (Ethno-symbolist/Perennialist). Your frustration is shared by almost everyone who enters this field; the debate often feels circular because it operates on three distinct levels simultaneously: semantic, explanatory, and empirical.

  Your working theory is the strongest lead: **this is primarily a disagreement about the target of explanation, disguised as a factual dispute.** However, it is not *merely* verbal. The verbal disagreement protects a substantive disagreement about social ontology (what kind of thing a nation is) and causality (what brings it into being).

  Here is a diagnosis of the impasse, followed by a roadmap for progress.

  ### 1. Diagnosis: Three Layers of Disagreement

  To move the group forward, you need to disentangle these three layers. Currently, your group is arguing Layer 3 while thinking they are arguing Layer 1.

  **Layer 1: The Semantic (Verbal)**
  *   **The Conflict:** The Modernists are using a **stipulative definition** of "nation." For them, a nation *must* include the claim to political sovereignty and mass mobilization. By this definition, a pre-modern group cannot be a nation by logical necessity, not just empirical observation.
  *   **The Counter:** The Perennialists are using a **phenomenological definition**. For them, a nation is defined by the *experience* of the members (shared name, myth, territory, solidarity).
  *   **The Diagnosis:** This is partly verbal. If Modernists define "nation" as "modern nation-state," they win by tautology. But it's not *just* verbal, because their definition is tied to a theory of function (nations exist to serve industrial capitalism/modernity).

  **Layer 2: The Explanatory (Your Hypothesis)**
  *   **The Conflict:** You hit the nail on the head with the religion analogy.
      *   **Modernists** are explaining the **institution**. They want to know why the world is politically organized into sovereign nation-states rather than empires or city-states. They argue this specific *political form* is new.
      *   **Perennialists** are explaining the **affective power**. They want to know why people are willing to die for these states. They argue the *emotional fuel* (ethnic ties, sacred memories) is old.
  *   **The Diagnosis:** This is the substantive core. Modernists explain the *vessel*; Perennialists explain the *liquid*. When the Modernist says "Nations are new," they mean "The vessel is new." When the Perennialist says "Nations are old," they mean "The liquid has been around for centuries." Both can be true simultaneously, but they talk past each other.

  **Layer 3: The Empirical (Continuity)**
  *   **The Conflict:** The Perennialist claims continuity; the Modernist claims rupture.
  *   **The Diagnosis:** The empirical disagreement is about **transformation vs. creation**.
      *   Did modernity *create* solidarity ex nihilo (via print capitalism, schools, etc.)?
      *   Or did modernity *repurpose* existing solidarity (turning religious/ethnic bonds into political ones)?
      *   **The Trap:** The Modernist demands evidence of *political* continuity (sovereignty). The Perennialist offers evidence of *cultural* continuity (myths, names). These are different data sets.

  ### 2. What Counts as Progress?

  You will not solve this by finding a "fact" that proves one side right. Progress comes from **conceptual differentiation**.

  **A. Adopt the *Ethnie* vs. *Nation* Distinction**
  The most productive way to split the difference is to adopt Anthony D. Smith's terminology, which was designed specifically to solve this impasse.
  *   **Ethnie:** A named human population with myths of common ancestry, shared memories, and a link to a homeland. (This can exist pre-modernly).
  *   **Nation:** An *ethnie* that has acquired political self-determination and mass culture. (This is modern).
  *   **Progress:** If your group agrees to use these terms, the Modernists can admit *ethnies* are old, and the Perennialists can admit *nations* are new. The question then shifts to: *Under what conditions does an ethnie become a nation?* This is a much more fertile empirical question.

  **B. Shift from "Genesis" to "Modularity"**
  Benedict Anderson argued nations are "modular"—once invented, they can be transplanted.
  *   **New Question:** Instead of "When did the French nation begin?", ask "When did the *concept* of the French nation become the only legitimate form of political organization?"
  *   **Evidential Standard:** Stop looking for the first mention of a name (e.g., "England"). Start looking for the first time that name was used to justify *popular sovereignty* rather than *dynastic right*. That is the empirical rupture point.

  **C. Acknowledge the Teleology Risk**
  The Perennialists risk "retrospective determinism"—looking at modern France and assuming the medieval Kingdom of France was "trying to become" modern France.
  *   **Standard:** To claim continuity, you must show that the *meaning* of the bond remained constant, not just the name. If "England" meant "The King's Land" in 1300 and "The People's Land" in 1900, is it the same nation? The Modernist says no; the Perennialist says yes. You need to agree on whether *meaning* or *label* determines identity.

  ### 3. Reframing the Discussion

  To stop the fortnightly loop, I suggest changing the format of your sessions for the next month.

  **Session 1: The Definition Audit**
  *   **Task:** Do not read new theory. Spend the whole session writing definitions on a whiteboard.
  *   **Prompt:** "List the necessary and sufficient conditions for X to be a nation."
  *   **Goal:** Force the Modernists to admit if their definition excludes cases they intuitively feel are nations (e.g., 17th Century Holland). Force the Perennialists to admit if their definition includes groups nobody calls nations (e.g., ancient tribes).
  *   **Outcome:** Agree on a working distinction between *Cultural Community* and *Political Nation*.

  **Session 2: The Mechanism Debate**
  *   **Task:** Stop arguing *when* nations started. Argue *how* they stick.
  *   **Prompt:** "Take a specific case (e.g., Poland). List the factors that maintain Polish identity. Which are pre-modern (Catholicism, language, myths of origin) and which are modern (Census, universal suffrage, national curriculum)?"
  *   **Goal:** Show that both sides are describing different parts of the same elephant. The Modernist sees the curriculum; the Perennialist sees the Catholicism. Both are required for the modern Polish nation.

  **Session 3: The "So What?" Test**
  *   **Task:** Ask why the dating matters.
  *   **Prompt:** "If nations are modern, what does that imply for politics? (e.g., They can be dismantled/changed). If nations are ancient, what does that imply? (e.g., Conflicts are intractable/primordial)."
  *   **Goal:** Reveal the political stakes. Modernists often want to show nationalism is contingent (and thus changeable). Perennialists often want to show national identity is deep (and thus valid). Understanding the *political motivation* behind the theory often dissolves the empirical rigidity.

  ### 4. Recommended Reading to Bridge the Gap

  You need texts that explicitly address this stalemate rather than contributing to one side.

  1.  **Anthony D. Smith, *The Ethnic Origins of Nations* (Chapter 1 & Conclusion).** Smith is the Perennialist, but he concedes the "nation" is modern while the "ethnie" is old. This is the bridge text.
  2.  **John Hutchinson, *Nations as Zones of Conflict*.** Hutchinson (a student of Smith) argues that nations are always contested between political nationalists (modernists) and cultural nationalists (perennialists). This validates *both* sides as internal components of nationalism.
  3.  **Kumar, "The Mistaken Identity of Nation and State" (Article).** Good for disentangling the political form from the cultural group.
  4.  **Brubaker, *Nationalism Reframed*.** He suggests we stop studying "nations" as things and study "nationhood" as a category of practice. This might be too abstract for your group, but his critique of "groupism" is relevant to the continuity question.

  ### Summary Verdict for the Group

  Tell your group this: **You are arguing about whether a "car" is defined by its engine or its wheels.**

  *   The **Modernists** are saying: "It's not a car until it has an engine (modernity/sovereignty)."
  *   The **Perennialists** are saying: "But the wheels and chassis (ethnicity/myth) existed long before the engine."
  *   **The Truth:** It is a vehicle that requires both. The wheels without the engine are a cart (pre-modern ethnie). The engine without the wheels is a generator (modern state without national identity). The "Nation" is the specific historical moment when the cart got an engine.

  If you can agree that the question is not "How old is the car?" but "When was the engine installed, and did it fit onto an existing chassis or a new one?", you can finally move on.
