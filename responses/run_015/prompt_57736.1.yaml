  (a) **Content Retention Scores**

  1.  **Tendency, not forecast:** 5. The move retains the causal mechanism (pressure) but abandons the specific quantitative prediction (geometric vs. arithmetic divergence leading to misery), replacing a falsifiable outcome with a vague directional force.
  2.  **Expired scope:** 4. It retains the internal logic of the theory but concedes that the prediction fails in the actual world today, limiting the theory to a historical niche rather than a universal principle.
  3.  **The preventive check fired:** 7. It retains the core pressure mechanism and the necessity of a check, but swaps the predicted check (misery/vice) for a different one (moral restraint), altering the expected social outcome while keeping the theoretical structure.
  4.  **Engels' pause:** 4. Like Move 2, this confines the theory's validity to a specific historical window, retaining the prediction only where it empirically held and conceding failure elsewhere.
  5.  **Patience:** 9. This retains the original risky claim almost entirely (the crisis is still coming), modifying only the temporal parameter rather than the mechanism or outcome.
  6.  **Reformulation:** 0. By making the theory compatible with every conceivable history, this removes all risky content; a theory that cannot be contradicted retains no empirical substance.

  (b) **Independent Testability of Auxiliaries**

  1.  **Tendency, not forecast:** **Partly.** While population pressure can be measured, the claim that it "tends to subject the lower classes to distress" is confounded by institutional variables and is difficult to isolate from the outcome it predicts.
  2.  **Expired scope:** **Yes.** The transition from organic to industrial energy regimes and nitrogen fixation are independently measurable historical facts unrelated to Malthusian theory.
  3.  **The preventive check fired:** **Yes.** Age of marriage, fertility rates, and celibacy rates are demographic variables that can be tracked independently of subsistence crises.
  4.  **Engels' pause:** **Yes.** Real wage data and output per head are economic statistics constructible without reference to Malthusian principles.
  5.  **Patience:** **Partly.** Planetary stocks (phosphorus, water) are measurable, but the claim that they will bind *before* technology relaxes them is a speculation not independently testable until the event occurs.
  6.  **Reformulation:** **No.** The auxiliary "something relaxes it" is defined post hoc by whatever happened; there is no independent way to identify the relaxer before the fact.

  (c) **Ranking by Defensibility**

  1.  **The preventive check fired**
  2.  **Expired scope**
  3.  **Engels' pause**
  4.  **Tendency, not forecast**
  5.  **Patience**
  6.  **Reformulation**

  *   **3 vs. 2:** Move 3 is ranked higher because it explains *why* the crisis was avoided (behavioral change) using the theory's own vocabulary, whereas Move 2 merely notes that external conditions changed without explaining the adjustment mechanism.
  *   **2 vs. 4:** Move 2 is superior because it provides a theoretical boundary condition (energy regime) that explains the temporal limit observed in Move 4, making it a deeper explanation than the historical observation alone.
  *   **4 vs. 1:** Move 4 is preferred because it points to specific empirical evidence where the theory held, whereas Move 1 retreats to a vague qualitative claim that is harder to verify or falsify.
  *   **1 vs. 5:** Move 1 is more defensible because it accounts for the current absence of misery via an operative mechanism (pressure), whereas Move 5 relies on speculative future verification without explaining the current divergence.
  *   **5 vs. 6:** Move 5 retains falsifiability (the crisis could still fail to happen), whereas Move 6 renders the theory immune to evidence, destroying its scientific status entirely.

  (d) **Stackability and Conflict**

  *   **Conflict (2 & 5):** These moves are mutually exclusive regarding the current status of the theory. Move 2 argues the domain is closed (the rules no longer apply), while Move 5 argues the domain is open (the rules still apply, but the event is delayed). You cannot claim the theory is obsolete *and* that it is merely pending simultaneously.
  *   **Conflict (3 & 6):** These undercut one another theoretically. Move 3 specifies the mechanism of relief (moral restraint/demographic transition), whereas Move 6 vaguens the mechanism to "something." Invoking Move 6 makes the specific empirical work of Move 3 unnecessary, rendering Move 3 an ad hoc specification of a tautology.
  *   **Stack (1 & 3):** These cohere well. One can argue there is a constant *tendency* toward pressure (Move 1) that was historically resolved via the *preventive check* (Move 3). This combination retains the mechanism while explaining the missing outcome.
  *   **Stack (2 & 4):** These form a coherent historical narrative. The theory accurately describes the *Engels' pause* (Move 4) because that period operated under the *organic economy scope* (Move 2) which has since expired.

  (e) **Probability of "Right but Early" Verdict**

  0.1

  (f) **Condition for "Right but Early"**

  The verdict "right but early" is legitimate only if the core mechanism remains invariant and the delay in the predicted outcome is explained by independent variables (such as measurable lag times or temporary buffers) rather than by altering the theory's predicted outcome or scope. None of the six moves fully meets this condition: Move 5 claims it but offers no independent variable for the delay, while Moves 2 and 3 admit the mechanism or scope has fundamentally changed, and Move 1 weakens the prediction itself.
