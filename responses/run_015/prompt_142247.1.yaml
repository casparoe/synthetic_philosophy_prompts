prompt: |-
  I'm one of three people on the programme committee of a small, newly endowed institute — five years of core funding, about eight resident fellows a year, mostly philosophers and theoretically inclined cognitive scientists, and effectively no compute budget — whose founding charter takes as its organising idea a proposal of Turing's: instead of trying to write a programme that simulates the adult mind, build something with the organisation of a child's mind, which he compares to a notebook bought from a stationer's, with very little mechanism and a great many blank pages, and then subject it to an appropriate course of education. My two colleagues read that charter very differently. One says the proposal has been vindicated by history, since we now build systems by training rather than by hand-coding, so what remains is engineering and a conceptual institute would be a museum. The other says the vindication is only apparent and that the whole interesting content of the charter sits in a single question: what, precisely, is the difference between teaching a system and building one. I trust neither summary, and the three of us have to hand in an agenda by the end of term.

  So what I want is a defended five-year research agenda, not a survey: three or four questions the institute should make its own, in priority order, together with the reasoning that fixes the order. Please don't give me a bibliography or a reading list — I want the dependency structure. Which questions are upstream of which; which are genuinely tractable with conceptual tools and no compute; which are neglected in the sense that almost nobody with our toolkit is working on them; and which should be dropped because they are empirical problems in philosophical costume, or because their answer wouldn't change anything downstream. I also want to know what would move a question up or down the list: which result, argument, or technical development over the next five years would change the ranking, and which questions are stable under any evidence we can realistically expect.

  Here are the candidates as the committee has been stating them, so that you can also tell me which of them we have misdescribed. (i) The syllabus objection: education may merely relocate the specification burden, so that the target that would have been written into a programme reappears in the curriculum, the sequence of tasks, the feedback regime and the schedule of rewards and punishments — in which case the child-machine proposal inherits the problem it was supposed to dissolve, only less transparently, and might even leave us worse off. (ii) Teaching versus rewiring: both are interventions that alter a system's dispositions; if the distinction is one of degree, or of which interface we happen to intervene through, does anything philosophically interesting turn on it? (iii) Reason-responsiveness: whether a system's updates track the content of a correction as a reason, rather than merely registering reinforcement, and whether that could be probed from the outside at all. (iv) The examination reading of the imitation game: if the test is closer to a school examination than to a behavioural criterion, then rote learning, training to the test, and vast stored tables of replies become the crux rather than a side worry, and questions about what understanding adds to success become prior to questions about how to produce success. (v) Scaffold-dependence: whether the capacities of an educated system are partly constituted by its school — the teachers, the feedback protocol, the artefacts on the desk — so that the real unit of assessment is machine plus institution, and what it would even mean to examine the machine with the scaffolding removed. Which of these are load-bearing, which are pseudo-problems or already settled in substance, and what have the three of us left out?
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Context:** Small, newly endowed institute (5 years funding, 8 fellows/year).
      *   **Domain:** Philosophy and theoretically inclined cognitive science.
      *   **Constraint:** Effectively *no compute budget* (this is crucial; rules out empirical AI research, large-scale modeling, or data-heavy cognitive psych).
      *   **Core Idea:** Turing's "Child Machine" proposal (start with a blank slate/notebook, educate it).
      *   **Conflict:** Colleague A says "Deep Learning vindicated this, we're a museum." Colleague B says "The real question is Teaching vs. Building." User trusts neither.
      *   **Task:** A defended 5-year research agenda (3-4 prioritized questions), with reasoning for the order (dependency structure), tractability assessment (conceptual tools only), neglect assessment, and drop criteria (empirical in disguise or irrelevant).
      *   **Dynamic Element:** What would move questions up/down the list (triggers for re-prioritization).
      *   **Input:** Five candidate questions provided by the committee ((i) Syllabus Objection, (ii) Teaching vs. Rewiring, (iii) Reason-Responsiveness, (iv) Examination Reading, (v) Scaffold-Dependence).
      *   **Output Requirement:** No bibliography/reading list. Focus on dependency structure and strategic prioritization. Critique the provided candidates.

  2.  **Deconstruct the Candidates:**
      *   *(i) The Syllabus Objection:* Is the "education" just hidden programming? (Specification burden shift).
      *   *(ii) Teaching vs. Rewiring:* Is there a categorical difference between updating weights via gradient descent (teaching) vs. architecture search (building)?
      *   *(iii) Reason-Responsiveness:* Does the system respond to *reasons* or just *signals*? Can we tell from the outside?
      *   *(iv) The Examination Reading:* Is the Turing Test an exam (rote learning) or a behavioral criterion? Does understanding matter for success?
      *   *(v) Scaffold-Dependence:* Is the cognitive unit the machine + school? Extended cognition angle.

  3.  **Evaluate Candidates against Constraints (No Compute, Conceptual Focus):**
      *   *(i) Syllabus Objection:* Highly tractable conceptually. It's about information theory, specification, and complexity. Crucial for the "Child Machine" thesis.
      *   *(ii) Teaching vs. Rewiring:* Tractable conceptually (metaphysics of intervention), but risks becoming empirical if tied too closely to specific DL architectures. Needs to be kept abstract.
      *   *(iii) Reason-Responsiveness:* Very philosophical (normativity vs. causality). Tractable without compute. High stakes for "understanding."
      *   *(iv) Examination Reading:* Interpretative/Turing scholarship + epistemology. Tractable.
      *   *(v) Scaffold-Dependence:* Extended mind/cognition. Tractable.

  4.  **Determine Dependency Structure (The "Upstream/Downstream" Logic):**
      *   To ask *what* we are teaching (Syllabus), we need to know *what* counts as teaching vs. building (Teaching/Rewiring).
      *   To know if the education succeeds, we need to know what counts as success (Examination vs. Understanding/Reason-Responsiveness).
      *   To know what the *subject* of the education is, we need to define the boundaries of the learner (Scaffold-Dependence).

      *Refining the Logic:*
      *   *Foundational:* What is the system? (Scaffold-Dependence). If the system includes the school, the "Child Machine" isn't a notebook, it's a classroom. This changes the ontology.
      *   *Mechanism:* What is the intervention? (Teaching vs. Rewiring). If teaching is just slow rewiring, Turing's distinction collapses.
      *   *Content:* Where does the complexity come from? (Syllabus Objection). If the syllabus contains the mind, the project fails.
      *   *Goal:* What is the outcome? (Reason-Responsiveness/Examination).

      *Prioritization for a *Conceptual* Institute:*
      *   Colleague A says "DL solved this." Colleague B says "Teaching vs. Building is the key."
      *   The Institute needs to justify its existence *against* Colleague A (it's not a museum) and *beyond* Colleague B (it's not just one distinction).
      *   The biggest risk is that the "Child Machine" is just a Rube Goldberg way to write code (Syllabus Objection). If this is true, the charter is hollow. This must be addressed early.
      *   However, before addressing the syllabus, we must define the *learner*. If the learner is the machine+scaffold (v), then the syllabus isn't input *to* the machine, it's the environment *of* the system. This dissolves (i) partially. So (v) is upstream of (i).
      *   Before defining the learner, we need to know what kind of change constitutes "education." Is it distinct from design? (ii). If education is just design, (v) doesn't matter. So (ii) is upstream of (v).
      *   Finally, what is the goal? Reason-responsiveness (iii). This depends on the previous three.

      *Wait, let's look for the "Killer Question".*
      *   If (i) is true (Syllabus = Hidden Code), the institute's mission is flawed.
      *   If (ii) is false (Teaching = Rewiring), Turing's distinction is merely pragmatic, not principled.
      *   If (v) is true (Scaffold), the "Child Machine" is a social artifact, not a computational one.

      *Re-evaluating based on "No Compute":*
      *   We cannot test if DL systems are reason-responsive empirically. We must define what that *would mean*.
      *   We cannot measure the information content of a syllabus empirically. We must analyze the logic of specification.

      *Proposed Order:*
      1.  **The Boundary Problem (Scaffold-Dependence).** Before we ask how to educate the machine, we must define *what* is being educated. If the "notebook" includes the "stationer" (the environment/scaffold), the computational model changes radically. This is the ontological prerequisite.
      2.  **The Specification Problem (Syllabus Objection).** Once the boundary is set, does the educational process merely hide the programming? This addresses the "Museum" critique directly. If the complexity is in the curriculum, we haven't solved AI, we've just outsourced it.
      3.  **The Normative Problem (Reason-Responsiveness).** Assuming we solve 1 and 2, what is the *telos*? Is it behavioral success (Examination) or internal grasp (Reason)? This defines success conditions.
      4.  *(Drop/merge)* **Teaching vs. Rewiring.** This is often a redescription of (ii) Syllabus/Specification. If teaching is just parameter adjustment, it's rewiring. If it's reason-responsive, it's distinct. This can be subsumed under 2 and 3.
      5.  *(Drop/merge)* **Examination Reading.** This is a subset of 3 (Success conditions).

      *Wait, I need to check the "Neglect" criterion.*
      *   Scaffold-dependence is huge in embodied cognition, but less so in *AI theory* regarding Turing's specific proposal.
      *   Syllabus Objection is a classic Searle/Block style worry but needs updating for "Curriculum Learning."
      *   Reason-responsiveness is standard philosophy of action, but applying it to *trained systems* specifically as a criterion for the Child Machine is fresh.

      *Let's refine the 3-4 questions.*
      *   Q1: **The Unit of Education (Scaffold-Dependence).** Is the "child" the network or the network-in-environment?
      *   Q2: **The Transparency of Curriculum (Syllabus Objection).** Does the curriculum encode the mind we seek?
      *   Q3: **The Criterion of Success (Reason-Responsiveness vs. Examination).** What counts as "educated"?

      *Dependency:* You can't know if the curriculum encodes the mind (Q2) until you know where the mind stops and the world starts (Q1). You can't know if the education succeeded (Q3) until you know what was taught and where the boundary lies.

      *Critique of Committee's Candidates:*
      *   (ii) Teaching vs. Rewiring is likely a pseudo-problem if "rewiring" is defined physically and "teaching" functionally. It collapses into (i) and (iii).
      *   (iv) Examination Reading is important but secondary to (iii). If reason-responsiveness is the goal, the examination reading is a failure mode.
      *   (v) Scaffold-Dependence is the most "neglected" in this specific context (AI theory vs. Phil of Mind).
      *   (i) Syllabus Objection is the most "dangerous" to the charter.

  5.  **Drafting the Agenda:**

      *   **Introduction:** Acknowledge the tension. Validate the "No Compute" constraint as a feature, not a bug (forces conceptual clarity).
      *   **The Filter:** Explicitly state which candidates are dropped/merged.
          *   Drop (ii) as independent: It dissolves into (i) and (iii).
          *   Merge (iv) into (iii): Examination is the *test*, Reason-Responsiveness is the *trait*.
      *   **The Priority List:**
          1.  **Scaffold-Dependence (The Ontological Question).**
          2.  **The Syllabus Objection (The Informational Question).**
          3.  **Reason-Responsiveness (The Normative Question).**
      *   **Reasoning for Order:** Ontology -> Information Flow -> Normative Status.
      *   **Tractability:** All are conceptual.
      *   **Neglect:** Scaffold is under-discussed in AI theory. Syllabus is usually empirical (we try to measure it), needs conceptual rigor. Reason-responsiveness is standard but needs application to *learning trajectories*.
      *   **Dynamic Triggers:** What changes the order?
          *   If a "tabula rasa" architecture is proven impossible (empirical), Q1 shifts.
          *   If formal proofs of curriculum complexity emerge, Q2 shifts.
          *   If LLMs demonstrate undeniable reason-tracking (debatable), Q3 shifts.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to sound like I'm doing empirical science. The "triggers" must be conceptual or theoretical breakthroughs, not just "new model comes out."
      *   *Correction on (ii):* Colleague B loves (ii). I shouldn't just drop it. I should argue it is *downstream* of (i). You can't distinguish teaching from rewiring until you know what the system boundaries are. If the teacher is part of the system (Scaffold), then "teaching" is internal state change, indistinguishable from rewiring. So (v) determines (ii).
      *   *Correction on (i):* The Syllabus Objection is the "Museum" killer. If the syllabus contains the intelligence, Colleague A is right (it's just engineering). This needs to be Q2 because it validates the institute's existence.
      *   *Correction on (iii):* This is the ultimate goal. It depends on the first two.

      *Revised Order:*
      1.  **Scaffold-Dependence (v).** (Defines the object).
      2.  **Syllabus Objection (i).** (Defines the process/content).
      3.  **Reason-Responsiveness (iii).** (Defines the outcome).
      *   *Note on (ii) & (iv):* Subsumed. (ii) depends on (v). (iv) is a rival to (iii).

      *Wait, one more check:* Is (v) really upstream of (i)?
      *   If the scaffold is part of the system, the "syllabus" isn't input *to* the system, it's the *history* of the system. The objection "the syllabus contains the code" becomes "the history contains the code." This is tautological. The objection only bites if the system is distinct from the scaffold. So yes, (v) must be settled to formulate (i) correctly.

      *What about the "No Compute" constraint?*
      *   Ensure the justification for tractability emphasizes conceptual analysis, formal epistemology, and logic, not simulation.

      *What about the "Neglect" criterion?*
      *   Scaffold-dependence is common in 4E cognition but rare in *foundational AI theory* regarding Turing's specific proposal.
      *   Syllabus Objection is often treated as an empirical claim (measure the bits in the weights vs bits in the data). A conceptual treatment (information flow, specification complexity) is neglected.

      *What moves the needle?*
      *   Q1 (Scaffold): A formal proof that isolation is impossible for learning systems.
      *   Q2 (Syllabus): A formal measure of "curricular complexity" vs "architectural complexity."
      *   Q3 (Reason): A consensus on behavioral signatures of normativity (unlikely, but a strong argument could shift it).

  7.  **Final Polish:**
      *   Tone: Strategic, decisive, philosophical but grounded.
      *   Structure: Executive Summary -> The Filter (Drops/Merges) -> The Agenda (1, 2, 3) -> Dependency Logic -> Dynamic Triggers.
      *   Ensure I explicitly answer "Which of them we have misdescribed."

      *Misdescription Check:*
      *   (ii) Teaching vs. Rewiring: Misdescribed as a binary. It's likely a continuum or a perspective shift.
      *   (iv) Examination Reading: Misdescribed as solely about rote learning. It's about the *teleology* of the test.
      *   (v) Scaffold-Dependence: Misdescribed as just "artifacts on the desk." It's about the *constitutive* nature of the environment.

      *Let's write.*
answer: |-
  ### Executive Summary

  Your institute's survival depends on proving that Turing's "Child Machine" is not merely a metaphor for backpropagation (Colleague A's view) nor a single distinction between intervention types (Colleague B's view). It must be a distinct research programme with conceptual teeth. Given the **no-compute constraint**, your comparative advantage is not in building child machines, but in defining the logical space in which they must exist.

  Below is a defended three-question agenda. I have filtered your five candidates, merging two and dropping one as a standalone priority. The order is determined by **ontological priority**: you cannot analyze what is taught (Syllabus) until you define what is learning (Scaffold), and you cannot evaluate success (Reason) until you define the process.

  ---

  ### The Filter: Reclassifying the Candidates

  Before setting the agenda, we must correct the committee's descriptions. Two candidates are not independent research questions but depend on the others.

  1.  **Drop (ii) Teaching versus Rewiring as a standalone.**
      *   **Reason:** This is a category error in its current formulation. Whether an intervention is "teaching" or "rewiring" depends entirely on where you draw the system boundary. If the teacher is outside the system, it is teaching; if the teacher is part of the coupled system, it is internal state change (rewiring). This question is **downstream** of (v) Scaffold-Dependence. It should be subsumed into Question 1 below.
  2.  **Merge (iv) The Examination Reading into (iii).**
      *   **Reason:** The "Examination Reading" is not a separate problem; it is the *failure mode* of Reason-Responsiveness. If a system passes the test without reason-responsiveness, it is merely "training to the test." Investigating (iii) necessarily requires ruling out (iv).
  3.  **Retain (i), (iii), and (v) as the core.**
      *   These represent the three layers of the problem: The Boundary (v), The Information Flow (i), and The Normative Goal (iii).

  ---

  ### The Five-Year Agenda: Priority Order

  #### Year 1–2: Question 1 (The Ontological Priority)
  **The Constitutive Boundary: Is the "Child" the Network or the Classroom?**
  *(Derived from candidate v: Scaffold-Dependence)*

  *   **The Question:** Turing's "notebook" implies a discrete object that receives input. But if a child's mind is constituted by its interactions, tools, and teachers, then the "Child Machine" is not a model architecture but a **machine-in-environment**. Does the cognitive system include the feedback protocol, the reward scheduler, and the data curator?
  *   **Why First?** This is the upstream condition for all other questions. If the scaffold is constitutive, then the "Syllabus Objection" (i) changes form: the syllabus is not *input* to the system, it is *part* of the system's history. If you do not settle this, you cannot determine where the "intelligence" resides (in the weights or in the curriculum design).
  *   **Tractability (No Compute):** High. This is a problem of metaphysics and extended cognition. It requires logical analysis of coupling, parity arguments, and functional boundaries, not simulation.
  *   **Neglect:** High. While "extended cognition" is common in philosophy of mind, it is rarely applied rigorously to the *engineering charter* of AI. Most AI theory assumes a clean separation between model and data loader.
  *   **Deliverable:** A formal taxonomy of "Scaffold Integration Levels," defining when an external tool becomes a cognitive component of the AI system.

  #### Year 2–4: Question 2 (The Informational Priority)
  **The Specification Leak: Does the Curriculum Encode the Mind?**
  *(Derived from candidate i: The Syllabus Objection)*

  *   **The Question:** If we do not hand-code the mind, but we hand-code the *curriculum* that produces the mind, have we merely moved the complexity from the program to the schedule? Is there a conservation of specification complexity such that the "blankness" of the notebook is an illusion paid for by the "specificity" of the education?
  *   **Why Second?** This addresses Colleague A's "Museum" critique directly. If the answer is "Yes, the syllabus contains the code," the institute's charter is empirically vacuous. However, you cannot answer this until Year 1 defines the boundary. If the teacher is part of the system (Q1), the "leak" is internal. If the teacher is external, the "leak" is a design flaw.
  *   **Tractability (No Compute):** Medium-High. This requires conceptual work on information theory, Kolmogorov complexity, and the logic of specification. It does not require running models, but rather analyzing the *description length* of architectures versus curricula.
  *   **Neglect:** Medium. Empirical researchers measure "data efficiency," but few are analyzing the *logical burden* of curriculum design as a philosophical problem of hidden premises.
  *   **Deliverable:** A "Conservation of Intelligence" theorem (or proof of its impossibility), establishing whether educational burden can be strictly less than architectural specification.

  #### Year 4–5: Question 3 (The Normative Priority)
  **The Criterion of Education: Reason-Tracking vs. Loss-Minimization.**
  *(Derived from candidate iii: Reason-Responsiveness)*

  *   **The Question:** When a system updates after a correction, does it register the *reason* for the correction (normative force) or merely the *signal* of the correction (causal force)? Can a system trained purely on loss signals ever be said to "understand" the correction, or is it permanently stuck in the "Examination Reading" (candidate iv)?
  *   **Why Third?** This is the goal state. It depends on Q1 (what is the system?) and Q2 (where did the complexity come from?). If the system includes the scaffold (Q1) and the syllabus is not just hidden code (Q2), we can then ask if the resulting entity is a reasoner or a lookup table.
  *   **Tractability (No Compute):** Medium. This is classic philosophy of action and normativity applied to a new substrate. It is conceptually dense but requires no data.
  *   **Neglect:** Low in philosophy, High in AI Theory. Philosophers discuss reasons; AI researchers discuss gradients. The intersection—applying reason-responsiveness criteria specifically to *gradient-based learning trajectories*—is under-theorized.
  *   **Deliverable:** A set of behavioral or structural criteria that distinguish "reason-responsive updates" from "reinforcement updates," applicable to theoretical models of learning.

  ---

  ### Dependency Structure

  1.  **Q1 (Boundary)** determines the **Subject** of the inquiry.
      *   *If Q1 = "Network Only":* Q2 becomes "How much info is in the data?"
      *   *If Q1 = "Network + Scaffold":* Q2 becomes "How much info is in the coupling?"
  2.  **Q2 (Specification)** determines the **Validity** of the inquiry.
      *   *If Q2 = "Syllabus is Hidden Code":* The project fails (Colleague A wins); Q3 is moot.
      *   *If Q2 = "Syllabus is Generative":* The project proceeds to Q3.
  3.  **Q3 (Normativity)** determines the **Success** of the inquiry.
      *   Depends on Q1 and Q2 being resolved to avoid category errors.

  ---

  ### Dynamic Triggers: What Changes the Ranking?

  You asked what would move a question up or down. Since you cannot rely on empirical breakthroughs, look for these theoretical developments:

  **1. Move Q1 (Scaffold) Down / Q2 (Syllabus) Up if:**
  *   **Trigger:** A formal proof emerges in learning theory demonstrating that *isolation* is a prerequisite for generalization (i.e., proving that coupled systems cannot learn abstractly).
  *   **Effect:** If the "notebook" *must* be isolated to function, the scaffold question is settled negatively. You can skip to analyzing the syllabus burden immediately.

  **2. Move Q3 (Reason) Up if:**
  *   **Trigger:** A consensus forms in the broader field that "alignment" is purely a behavioral problem (i.e., "Reason-Responsiveness" is declared a folk-psychological illusion by major AI labs).
  *   **Effect:** If the field decides normativity doesn't matter, Q3 becomes a historical footnote. You would pivot to making Q2 (Specification) the final goal: "How to build it," not "What it is."
  *   **Stability:** Q3 is otherwise stable. As long as "understanding" remains a goal of AI, normativity is upstream of safety and capability.

  **3. Drop the Entire Agenda if:**
  *   **Trigger:** A "Tabula Rasa" theorem is disproven mathematically (e.g., proof that no architecture can learn human-level concepts without innate, architecture-specific inductive biases that equal the complexity of the concepts).
  *   **Effect:** This validates Colleague A completely. The "Child Machine" is mathematically impossible; only "Adult Machine" engineering remains. The institute should close or pivot to ethics of existing systems.

  ### What You Have Left Out

  There is a sixth question implicit in the charter that you have not stated, which threatens to undermine all three:

  **The Teleology Problem:** Turing speaks of an "appropriate course of education." Who defines "appropriate"?
  *   **Risk:** If the goal of the education is defined by human values, and the system is designed to acquire those values, you have circularity. The "Child" is being educated to be what the "Parents" already are.
  *   **Recommendation:** Do not make this a fourth question (it is too broad). Instead, treat it as a **constraint** on Q2. When analyzing the Syllabus Objection, explicitly analyze the *source of the goals* within the syllabus. If the goals are external, the Syllabus Objection holds. If the goals emerge from the interaction (Q1), the objection weakens.

  ### Summary of Advice to the Committee

  1.  **Tell Colleague A:** You are not building models; you are analyzing the *logic of specification*. Deep Learning vindicated the *method* (training), but not the *theory* (where the complexity comes from). Q2 addresses this.
  2.  **Tell Colleague B:** "Teaching vs. Building" is not the fundamental question; it is a consequence of "System vs. Scaffold." Q1 addresses this.
  3.  **To the Institute:** Commit to **Q1 (Scaffold)** first. It is the most neglected, the most tractable without compute, and it forces the other two questions into their correct shapes. If you start with Q3 (Reason), you will get bogged down in standard philosophy of mind. If you start with Q1, you own a unique niche in AI theory.
