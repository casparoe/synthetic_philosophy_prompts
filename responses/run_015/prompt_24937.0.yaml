answer: |-
  This is a remarkably precise observation, and you have stumbled onto one of the most contentious and fertile areas in contemporary philosophy of action and moral psychology. You are describing the intersection of **Omissive Causation**, **Causal Selection**, and **Folk Intuitions about Agency**.

  To answer your primary question: No, there is not a single, universally accepted term that captures exactly the *narrative* dependency you describe. However, philosophy has mapped the component parts of this phenomenon extensively. The disagreement among your readers is not a bug in their reasoning; it is a feature of how human beings attribute causality, which philosophy distinguishes from physical causality.

  Here is the philosophical taxonomy of the phenomenon you are observing, broken down by the specific variables you noted (Role, Inner Life, and the Causation/Responsibility conflation).

  ### 1. The Baseline: Omissive Causation and the Problem of Proliferation
  The broad category is **Omissive Causation** (or Causation by Omission). The standard counterfactual definition is: *Event E was caused by Omission O if, had O not occurred (i.e., had the action been taken), E would not have occurred.*

  However, philosophers (most notably David Lewis) have noted a problem you intuitively grasped: **The Problem of Proliferation.**
  If we rely solely on counterfactuals, *everyone* is a cause of the harm. The father caused the harm by not stopping it. But so did the neighbor who didn't stop it. So did the President, who didn't fly in and stop it. So did you, the novelist.
  Since infinite things *didn't* happen, why do we single out the father's silence as *the* cause?

  ### 2. The Role Factor: Causal Selection and Normative Expectations
  You noted that readers treat omissions as causal when there is a "socially recognized role." In philosophy of law and action, this is addressed under **Causal Selection**.

  The seminal work here is H.L.A. Hart and Tony Honoré's *Causation in the Law* (1959). They argue that we do not select causes based purely on physics or counterfactuals, but based on **normative expectations**.
  *   **The Distinction:** They distinguish between a "cause" and a "mere condition."
  *   **The Mechanism:** An omission becomes a salient "cause" only when there is a **duty to act**. When a father fails to act, it violates a normative expectation. When a stranger fails to act, it is merely a background condition (like the lack of rain causing a drought).
  *   **Philosophical Term:** **Normatively Salient Omission.**

  Your readers are not disagreeing about the physics of the bullying; they are disagreeing about whether the father's role created a *duty* that makes his silence a relevant explanatory factor. When you remove the role (stranger), you remove the norm, and the omission recedes into the background of "infinite non-events."

  ### 3. The Inner Life Factor: Refraining vs. Failing
  Your second observation is more subtle and touches on the **Philosophy of Action**. You noted that when you depict deliberation, the omission feels like an act. When you depict chaos/dissociation, it feels like something that "befell" them.

  Philosophers distinguish between **Failing to Act** and **Refraining**.
  *   **Failing to Act:** You simply do not do it. (e.g., You forget to water the plant).
  *   **Refraining:** You consider doing it, and you actively decide not to. (e.g., You see the plant is dry, pick up the jug, and put it down).

  **G.E.M. Anscombe** and later **Michael Bratman** have written on how intention structures action. When you write the character's deliberation, you are transforming the omission from a *negative fact* (nothing happened) into a *positive mental act* (a choice was made).
  *   **The Distinction:** **Volitional Omission.**
  *   **The Mechanism:** A volitional omission functions psychologically identical to a commission. If the character *chooses* silence, the silence is an instrument of their will. If the character is dissociated, the silence is a symptom of their state, not an exercise of their will.
  *   **Reader Reaction:** When readers see deliberation, they attribute **Agency**. When they see chaos, they attribute **Passivity**. Causation requires an agent; passivity implies a patient.

  ### 4. The Conflation: Causal Responsibility vs. Moral Responsibility
  You observed that readers disagree on whether the character *caused* the harm. Philosophically, it is highly likely your readers are conflating **Causal Responsibility** with **Moral Responsibility**.

  *   **Causal Responsibility:** Did this entity bring about the state of affairs? (Metaphysical/Physical).
  *   **Moral Responsibility:** Is this entity blameworthy for the state of affairs? (Ethical).

  **Experimental Philosophy (X-Phi)** has studied this extensively. The most famous finding is **The Knobe Effect** (Joshua Knobe, 2003). It demonstrates that people's judgments about *intentionality* and *causation* are skewed by their moral judgments about the outcome.
  *   If the outcome is bad, people are more likely to say the agent *intentionally* brought it about, even if the mechanics are identical to a neutral scenario.
  *   **Application to your work:** Your readers likely find the harm morally reprehensible. They want to assign blame. To assign blame, they need a cause. Therefore, they psychologically "promote" the father's omission to the status of a cause to satisfy the demand for moral accountability. The readers who resist are likely stricter about the metaphysical definition of cause (the bullies pushed the boy, not the father).

  ### 5. Synthesis: What to Call This?
  Since you are keeping notes, you need a working term. While philosophy offers the distinctions above, there isn't one word that captures the *narrative* modulation of these distinctions.

  I would suggest labeling this phenomenon in your notes as **"Agential Causal Salience."**

  This term captures the three levers you have identified:
  1.  **Agential:** It depends on the character's mental state (deliberation vs. dissociation).
  2.  **Causal:** It determines whether readers view the omission as a cause or a condition.
  3.  **Salience:** It acknowledges that the causation is not absolute, but selected based on norms (roles) and narrative focus.

  ### Summary of Distinctions for Your Notes
  If you wish to map this against existing philosophical frameworks, here is the grid:

  | Narrative Feature | Philosophical Concept | Effect on Reader Judgment |
  | :--- | :--- | :--- |
  | **Social Role** (Parent vs. Stranger) | **Normative Expectation** (Hart & Honoré) | High Role = Omission is a **Cause**. Low Role = Omission is a **Condition**. |
  | **Deliberation** (Choosing silence) | **Refraining** (Philosophy of Action) | Deliberate = **Volitional Act** (High Agency). |
  | **Dissociation** (Chaos/Confusion) | **Diminished Capacity** (Agency Theory) | Chaotic = **Passive Event** (Low Agency). |
  | **Harmful Outcome** | **The Knobe Effect** (X-Phi) | Bad Outcome = Readers seek **Moral Causation** over Physical Causation. |

  ### Conclusion
  You have identified that causation in fiction is not a metaphysical claim but a **pragmatic attribution**. Philosophy agrees with you: causation is not just about what happened in the world, but about how we carve up the world for the purposes of explanation and blame.

  The disagreement in your workshop is not a failure of comprehension; it is a clash between two philosophical intuitions:
  1.  **Physicalism:** Only positive forces cause things (The bullies caused it).
  2.  **Normative Pragmatism:** Breaches of duty and volitional choices cause things (The father caused it).

  Your narrative tools (role, inner life) are effectively switches that toggle the reader between these two philosophical frameworks.
