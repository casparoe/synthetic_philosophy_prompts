  The Global Priorities Committee sits around a polished table, weighing a final allocation between deworming programs in East Africa and funding research into containment protocols for hypothetical future AI systems. Just as the chair moves to vote for the AI containment grant, citing the vast potential population of the far future, Dr. Aris interjects with an unsettling caveat: if Bostrom's simulation hypothesis holds, our reality might be a controlled construct run by post-human descendants specifically to audit moral decision-making under scarcity. Aris argues that if this is a test scenario designed to evaluate how simulated agents weigh immediate suffering against abstract future risks, choosing to ignore visible, present suffering for the sake of a speculative simulated future might constitute a failure of the test itself, potentially triggering a premature shutdown of our simulation or negating the moral value we hope to accrue for the base reality.

  **The Check**

  This worry should **dampen** fanatical commitment to the far future. In standard longtermism, the far future is treated as a continuous, open timeline where actions compound; however, under this specific simulation scenario, the simulated future possesses **Conditional Continuity**. The structural feature driving this is **Asymmetric Modal Scope across Nested Simulations**: while present suffering has phenomenological reality regardless of simulation status (epistemic parity of pain), the simulated future exists only within the modal scope permitted by the base-reality simulators. If the simulation is a moral test, the "future" we aim to save is ontologically fragile and contingent on passing the audit, whereas present suffering is immediate and certain.

  If you remove this feature—by assuming the simulation is guaranteed to run to natural heat death regardless of our moral choices—the dampening effect vanishes, and the calculation reverts to standard expected utility maximization where the sheer number of simulated future lives might still outweigh present suffering. A defender of far-future fanaticism would attack the scenario by arguing for **Instrumental Leverage**: even if we are in a test, the simulators are the actual "future people" we care about. Therefore, demonstrating competence in existential risk mitigation within the simulation might be the specific variable the simulators are auditing, meaning fanaticism could still be the optimal strategy to influence the base reality's safety policies.
