  I'm at about 0.55 on the top-level claim and my friend is at about 0.15, and I don't think we disagree about population ethics, which is where everyone assumes these arguments land. Guess which term the gap is really in.

  Last thing: tell me how confident you are in this whole exercise — whether a proposition like this is even the sort of thing that has a probability, or whether I'm forcing a number out of a question that's mostly normative — and flag the one ingredient you're least sure about, including if the thing you're least sure of is whether "expected good" means anything stable here.
