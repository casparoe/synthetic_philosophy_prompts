      *   **User's Argument:** Dana knows Tir=Nef and Nef=Sol. Tir=Sol is trivial for her but substantial for a colleague. Senses are constant, but cognitive value varies by subject. Therefore, cognitive value isn't about sense-difference but about what the subject believes. Senses are idle wheels.
      *   **Challenge:** Is cognitive value relative to a knower or objective? If relative, why senses? If objective, how to explain Dana's lack of surprise?

  2.  **Determine the Fregean Response:**
      *   **Core Fregean Move:** Distinguish between the *thought* (objective content) and the *grasping* of the thought (psychological act).
      *   **Addressing the Puzzle:** The puzzle is about the *content* of knowledge, not just the psychological state of surprise.
      *   **Dana's Case:** For Dana, the thought <Tir=Sol> is *derived* from prior thoughts <Tir=Nef> and <Nef=Sol>. She isn't grasping <Tir=Sol> as a new primitive thought; she's inferring it. The cognitive value lies in the *route* to the truth, not just the endpoint.
      *   **The Colleague:** For the colleague, <Tir=Sol> is a new thought grasped directly.
      *   **Objective vs. Relative:** Cognitive value is objective property of the *thought* (its potential to inform), but actual informativeness depends on the subject's epistemic state. However, without senses, we can't explain *why* the inference is valid or what distinguishes the thoughts involved in the inference.
      *   **Countering "Idle Wheel":** Senses explain the *structure* of Dana's knowledge. She knows Tir=Nef (Thought 1) and Nef=Sol (Thought 2). To derive Tir=Sol, she manipulates these thoughts. If names were just references, Thought 1 and Thought 2 would be the same as Tir=Tir, and the inference would be trivial from the start. Senses explain the *possibility* of the discovery.
