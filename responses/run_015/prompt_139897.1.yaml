answer: |-
  You're conflating the thought itself with a subject's grasp of it. Cognitive value is an objective property of the thought—its capacity to extend knowledge—not a measure of individual surprise. Surprise is psychological, but the puzzle concerns knowledge expansion. For Dana, <Tir=Sol> isn't new; she's inferred it from <Tir=Nef> and <Nef=Sol>. But what makes that inference possible? Those discoveries worked only because Tir, Nef, and Sol present the planet differently. If names were just tags, Tir=Nef would have been as trivial as Tir=Tir from the start, leaving her nothing to derive.

  Senses aren't idle; they explain the architecture of her knowledge. The colleague lacks that architecture, so the same thought strikes them as new. The puzzle isn't why Dana isn't surprised—it's how knowledge accumulates. Without senses, you can't distinguish the premises she reasoned from from the trivial identities she bypassed. Modes of presentation make sense of deduction itself.
