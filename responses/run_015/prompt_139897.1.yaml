      You're conflating the thought itself with a subject's grasp of it. Cognitive value is an objective property of the thought—its capacity to extend knowledge—not a measure of individual surprise. For Dana, the thought <Tir=Sol> isn't new; she's inferred it from <Tir=Nef> and <Nef=Sol>. But notice what makes that inference possible! Those earlier discoveries were only possible because Tir, Nef, and Sol present the planet differently. If names were just tags, Tir=Nef would have been as trivial as Tir=Tir from the start, and she'd have nothing to derive.

