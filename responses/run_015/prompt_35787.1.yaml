      *   **Common Trope to Invert:** Retributivism = Harsh/Eye-for-an-eye; Consequentialism = Soft/Rehabilitative.
      *   **Constraints:**
          1.  Realistic setting (actual sentencing, not dystopia/ticking bomb).
          2.  Defendant is genuinely guilty (no scapegoating).
          3.  Retributivist leniency comes from ordinary proportionality (low desert).
          4.  Consequentialist harshness comes from normal deterrence logic (sober policy, not mob rule).
      *   **Required Output:** Scenario, Analysis (theory breakdown, key feature, counterfactual), Consequentialist Escape Attempt (and evaluation), Structured JSON Summary.

  2.  **Brainstorming Scenarios:**
      *   *Idea 1: White Collar Crime.* High gain, low physical harm. Retributivism says "pay it back." Consequentialism says "make an example to stop others."
          *   *Critique:* Often feels like mob appeasement or "sending a message" which can border on scapegoating. Need to ensure it's about *this* defendant's punishment affecting *future* crime rates specifically.
      *   *Idea 2: Drunk Driving.* First offense, no accident. Retributivism: Small fine (no harm done). Consequentialism: Heavy penalty because the risk was high and deterrence needs to be absolute.
          *   *Critique:* A bit common. Might not feel "harsh" enough to flip the script dramatically.
      *   *Idea 3: Negligent Corporate Safety.* A manager signs off on a shortcut. Nothing bad happened *yet*, but the risk was massive.
          *   *Critique:* Good, but might drift into "preventive detention" which feels dystopian.
      *   *Idea 4: The "High-Visibility/High-Copycat" Case.* A specific type of crime that is currently spiking and is highly sensitive to perceived risk of punishment.
          *   *Scenario:* A minor fraud or tax evasion scheme that is easily replicable and currently causing systemic collapse if unchecked.
      *   *Idea 5: The "Insider" Breach.* A low-level employee leaks data. No money stolen, but trust broken.
      *   *Selection:* Let's go with a specific variation of Idea 1/4. A regulatory violation in a high-stakes industry where the *potential* harm is massive, the *actual* harm was negligible, and the *detectability* is low.
      *   *Refining the Scenario:* A pharmaceutical quality control manager. They skipped a minor, non-critical safety check to meet a deadline. The batch was fine. No one got hurt.
          *   *Retributivism:* Blame is low. No harm, minor negligence. Maybe a fine or probation.
          *   *Consequentialism:* If others think they can skip checks without getting caught, the system collapses. Detection rates are low. To achieve effective deterrence ($P \times S > Gain$), since $P$ (probability of capture) is low, $S$ (severity) must be massive.
          *   *Constraint Check:* Is it realistic? Yes. Is he guilty? Yes (violated protocol). Is retributive leniency proportional? Yes (no harm). Is consequentialist harshness sober policy? Yes (economic deterrence model).

  3.  **Drafting the Scenario:**
      *   **Defendant:** Elias Thorne, QA Manager at MedCore.
      *   **Act:** Skipped a specific sterilization verification step on Batch 402.
      *   **Outcome:** Batch tested clean later. No patients harmed.
      *   **Context:** There's an epidemic of "corner-cutting" in the generic drug industry. Detection is notoriously difficult (only caught because a whistleblower).
      *   **Stakes:** Public trust in generic meds is fragile.

  4.  **Developing the Theoretical Analysis:**
      *   **Retributivist:** Focus on *culpability* and *harm*. Culpability is negligent/reckless but not malicious. Harm is zero. Punishment must fit the *wrong done*, not the *risk avoided*. Verdict: Suspended sentence, small fine, professional censure.
      *   **Consequentialist:** Focus on *incentives*. The gain (meeting deadline/bonus) is high. The probability of detection is extremely low (1 in 1000). To deter, Expected Cost > Expected Gain. If Gain is \$100k and P is 0.001, Punishment must be \$100 million (or equivalent prison time). Verdict: Significant prison time (e.g., 10 years) to set the expected cost high enough.

  5.  **Identifying the Key Feature:**
      *   The **Low Probability of Detection** combined with **High Systemic Risk**. This forces the severity variable up in the deterrence equation ($Deterrence = Probability \times Severity$).

  6.  **Counterfactual (Removing the Feature):**
      *   If detection were high (e.g., automated monitoring), the consequentialist wouldn't need harsh punishment. They would align closer to the retributivist.

  7.  **Consequentialist Escape Attempt:**
      *   *Argument:* Rule-Consequentialism or Institutional Legitimacy.
      *   *Move:* "If we punish Thorne disproportionately, the public sees the system as unjust. They stop cooperating. Whistleblowers dry up. Compliance drops. Therefore, long-term utility is maximized by respecting proportionality."
      *   *Evaluation:* Does this work? It often *does* work, but does it smuggle in desert? Yes. It essentially says "We must respect desert *because* ignoring it has bad consequences." It instrumentalizes desert.
      *   *Honest Assessment:* It partially works, but it admits that pure act-consequentialism yields the harsh result. The "escape" relies on the *consequence* of violating retributive norms.

  8.  **Refining the Constraints Check:**
      *   *Realistic?* Yes, corporate sentencing happens.
      *   *Genuinely Guilty?* Yes, violated safety protocols.
      *   *Retributive Leniency?* Yes, based on lack of harm.
      *   *Consequentialist Harshness?* Yes, based on deterrence math, not mob anger.
      *   *Potential Weakness:* Is 10 years realistic for a sober policy person? Maybe 5. Let's calibrate the severity to be "significantly harsher" rather than "life imprisonment" to maintain realism. Let's say Retributivist wants 6 months probation; Consequentialist wants 5 years prison.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Scenario:* Make sure the "no harm" part is clear. The batch was safe.
      *   *Consequentialist Logic:* Emphasize the *economic* logic of deterrence, not emotional "sending a message."
      *   *Escape:* Focus on the "moral credibility of the law" argument (Paul Robinson's work fits well here).

  10. **Final Review against JSON constraints:**
      *   Ensure all fields are present.
      *   Ensure `reply_works` is nuanced.
      *   Ensure `does_the_case_work` is honest.

  11. **Final Polish:** Check tone. Keep it philosophical but grounded. (Self-Correction: Make sure the Consequentialist isn't just punishing for *future* crimes of *others* in a way that treats Thorne as a mere means. The prompt asks for "normal deterrence logic." Standard deterrence theory *does* use the offender as an example. I need to make sure this doesn't violate the "no scapegoating" constraint. Thorne *is* guilty. He is being punished for *his* act, just the *amount* is driven by others' potential acts. This is standard specific/general deterrence. It fits.)

  12. **Constructing the JSON:** Carefully map the analysis to the keys.

  *(Self-Correction during drafting)*: I need to be careful with the "scapegoating" constraint. If I punish Thorne heavily *only* to scare others, is that scapegoating? Technically, no, because he is guilty. But it borders on using him as a means. The prompt says "nobody is being scapegoated." As long as he committed the crime, he's not a scapegoat. The *severity* is the issue. I will clarify he is genuinely liable.

  Let's finalize the scenario: "The Generic Drug Loophole."
  Retributivist: Negligence, no harm -> Probation.
  Consequentialist: Low detection, high risk -> Prison term.

