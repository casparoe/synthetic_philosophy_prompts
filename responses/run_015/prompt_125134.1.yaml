  2. Where the lens illuminates the film
  The opening contact sequence inside the alien shell functions as a primal scene for entering a new language game. Louise and Ian stand before a glass barrier, attempting to attach signs to objects by pointing and speaking. Wittgenstein warns against ostensive definition in isolation, noting that pointing only works within a shared practice. The film validates this: the humans cannot simply point; they must establish a routine, a rhythm of approach and retreat. When Louise removes her protective hazmat suit, she is not merely taking a safety risk; she is stepping into a shared form of life. She makes herself vulnerable to the air and the aliens, signaling that communication requires a bodily commitment, not just intellectual decoding. This mirrors the caregiving experience where meaning is rebuilt through shared presence and routine, not just word retrieval. The ink circles the heptapods produce are not names for objects but tools for action. Their meaning is established through repetition and response, fitting the maxim that meaning is use.

  Later, the global crisis over the translation of a specific logogram illustrates the danger of essentialism versus family resemblance. Different nations receive the same symbol but interpret it as weapon, tool, or gift. Human leaders assume there must be one essential meaning hidden behind the sign, a single truth that corresponds to reality. A Wittgensteinian reading suggests the conflict arises because each group tries to force the sign into their existing language game without understanding the heptapods' practice. The film vindicates the family-resemblance approach by showing that the sign's function shifts depending on the context of use. It is a weapon in a war game, a gift in a cooperative one. The tension resolves only when Louise stops asking what the word *is* and asks what it *does*.

  Finally, the climax and closing sequence highlight the ethical dimension of acquiring a language. Louise uses her understanding to prevent war by calling a general and referencing his wife's dying words. This is not data transmission; it is entering a specific human language game of intimacy and trust to alter a political outcome. Her final choice to embrace her daughter's life, knowing the tragic end, demonstrates that mastering a language game involves accepting the form of life it entails. She does not just learn vocabulary; she inherits a way of living. The film suggests that to understand is to participate, and that participation carries existential costs.

  3. Where the film resists the reading
  Despite these parallels, the film resists a strict Wittgensteinian reading in its metaphysical commitments, specifically regarding the Sapir-Whorf hypothesis. The film posits that learning Heptapod B rewires Louise's brain, allowing her to experience time non-linearly and remember the future. For Wittgenstein, this risks reifying language into a causal mechanism that generates private inner objects. His private language argument suggests that we cannot verify such experiences independently of public criteria. If Louise sees the future, this is a private sensation that lacks external verification until it happens, precisely the kind of metaphysical picture Wittgenstein sought to dissolve. He would argue that saying she remembers the future is a grammatical confusion, not a description of a mental state.

  Furthermore, the plot relies on the existence of a single, correct hidden meaning behind the alien visitation: they are here to help humanity prepare for a future crisis. Wittgenstein would be suspicious of this hidden essence. He would urge us to look at the use of the aliens' presence, not their secret intent. The film resolves the narrative by revealing this true purpose, whereas a Wittgensteinian resolution would remain within the public practice of cooperation without appealing to metaphysical certainty. The film ultimately wants language to be a key to the universe's structure, while Wittgenstein wants language to be a tool within human activity. This divergence means the film cannot fully sustain the reading without ignoring its sci-fi metaphysics.

  4. What the film adds to the philosophy
  What *Arrival* contributes to the debate is a visceral phenomenology of learning a language game that philosophical text cannot provide. Wittgenstein writes about the struggle of understanding, but the film shows the physical exhaustion, the fear, and the bodily coordination required to write on a transparent screen while holding one's breath. It dramatizes the fragility of communication you experienced with your mother. The film also expands the ethical weight of a form of life. In philosophy, adopting a form of life is often theoretical; in the film, it costs Louise her linear future. She chooses a life of grief because it is part of the package of love. This adds an emotional stakes to the concept of meaning as use: using words correctly is not just about accuracy, but about sustaining relationships that define our humanity. The film suggests that translation is not just semantic but existential, requiring a willingness to inhabit another's mode of being even when it brings pain. It makes the abstract concrete.

  5. Settled versus contested
  In Wittgenstein scholarship, it is settled that he rejected the naming theory of meaning, advocated for meaning as use, and utilized family resemblance to challenge essentialism. It is also broadly accepted that he critiqued the possibility of a private language grounded solely in inner experience. However, significant contestation remains regarding the status of forms of life. Some scholars read this naturalistically, as biological bedrock, while others see it as cultural and contingent. My reading assumes the latter to accommodate the aliens, which is debatable. Additionally, there is dispute over whether the private language argument is a substantive proof against private experience or a therapeutic dissolution of philosophical anxiety. If the latter, the film's depiction of Louise's private time might be seen as a picture to be dissolved, not a fact to be refuted. Finally, whether Wittgenstein offers a theory of translation is contested; some argue he leaves us with incommensurability. This reading assumes translation is possible through shared practice, which not all interpreters accept.
