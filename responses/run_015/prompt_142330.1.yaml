answer: |-
  ### Preface: The Cost of Operationalization

  You are asking me to translate a metaphysical framework into a data-curation workflow. This is dangerous work. Kripke's distinctions (rigid vs. non-rigid, reference-fixing vs. synonymous, necessary vs. a posteriori) are about the *nature of reality and language*, not database schema. When you turn them into a checklist, you risk collapsing the very modal distinctions you aim to preserve.

  Here is the honest truth before we begin: **The distinction between *epistemic uncertainty* and *metaphysical contingency* cannot be fully automated.** A checklist cannot feel the difference between "we haven't found the proof yet" and "there is no necessary connection here." However, we can build a procedure that forces you to explicitize the *source* of the name and the *dependency* of the link. This will not solve every hard case, but it will prevent the most common category errors (like treating a contingent description as a rigid name).

  Below is the **Registry Modal Protocol (RMP)**. It is designed for a 10-minute window. It avoids possible-worlds jargon. It uses your Intake Tags as the primary semantic signal.

  ---

  ### The Registry Modal Protocol (RMP)

  **Goal:** Determine the link type between Record A and Record B.
  **Inputs:** Record A (with Intake Tag), Record B (with Intake Tag), Proposal Note (evidence for identity).
  **Outputs:** `Identity-of-Object`, `As-Described-Here`, `Flag for Senior Review`.

  #### Step 1: The Existence Check (Empty Names)
  *Question:* Is there independent verification that a real object exists for **both** records?
  *   **Yes:** Proceed to Step 2.
  *   **No (One or Both are Empty):** Stop.
      *   *Action:* **Flag for Senior Review.**
      *   *Reasoning:* You cannot link objects if one or both do not exist. Linking two empty names (e.g., "The King of France" and "The Present King of France") is not an identity of object; it is a comparison of fictions. This is a policy decision on how the Registry handles null-reference.

  #### Step 2: The Intake Tag Triage
  *Look at the Intake Tags for both records.*
  *   **Tag: Placeholder** (e.g., "Unknown Author," "The Person in the Room"):
      *   *Action:* If the *other* record is a Proper Name (Ostensive), go to **Step 4**.
      *   *Reasoning:* Placeholders are inherently non-rigid; they pick out whoever satisfies a role. A Proper Name picks out a specific individual. Linking them asserts the Placeholder's role is necessarily filled by that Individual.
  *   **Tag: Reference-Fixing Description** (e.g., "The Inventor of Bifocals" used to name 'Ben'):
      *   *Action:* Treat this record as **Rigid** *only if* the description is known to be true of the object. If the description is merely contingent (e.g., "The Head of Archive in 1793"), treat as **Non-Rigid**.
      *   *Rule of Thumb:* If the description involves a date, a role, or a count, it is **Non-Rigid**. If it involves a baptism or a specific historical event that *makes* the person who they are (rare), consult Step 4.
  *   **Tag: Ostensive / Inheritance:**
      *   *Action:* Treat as **Rigid** (Stable).

  #### Step 3: The "Could It Have Been Otherwise?" Test
  *Ignore the evidence for a moment. Look at the **descriptions** or **roles** defining the records.*
  *Question:* If the world had been slightly different (e.g., the person took a different job, wrote a different book, or the archive had one more notebook), would Record A still refer to the same thing as Record B?
  *   **Yes (Stable):** The link does not depend on contingent facts. (e.g., "Cicero" and "Tully" — even if Cicero never spoke against Catiline, he is still Cicero).
      *   *Proceed to Step 4.*
  *   **No (Fragile):** The link depends on a specific fact holding true. (e.g., "The Head of Archive" and "John Doe" — if John Doe hadn't taken the job, the link breaks).
      *   *Action:* **As-Described-Here.**
      *   *Reasoning:* The records match *in this world* based on this description, but they do not track the same object across all scenarios.

  #### Step 4: The Evidence vs. Necessity Check
  *Now look at the Proposal Note (the evidence).*
  *Question:* Is the identity **confirmed** by archival research, or is it **probable/hypothetical**?
  *   **Confirmed (Empirical Discovery):** The evidence rules out all other candidates. (e.g., Signatures match, contemporary testimony confirms).
      *   *Action:* **Identity-of-Object.**
      *   *Reasoning:* Per Kripke, identities discovered empirically (Hesperus = Phosphorus) are necessary once established. The fact that you *found out* via research does not make it contingent.
  *   **Probable / Best Guess:** The evidence points strongly to one candidate, but alternatives remain possible.
      *   *Action:* **Flag for Senior Review.**
      *   *Reasoning:* You cannot assert `Identity-of-Object` (Necessity) on the basis of probability. This is an editorial policy decision: do we merge on high probability, or wait for certainty?

  #### Step 5: The "Actual-" Prefix Check (Rigidification)
  *Does one record use an "Actual-" prefix or equivalent rigidifying language (e.g., "The Actual Number")?*
  *   **Yes:** This record attempts to freeze a contingent description into a rigid one.
  *   **No:** The record remains contingent.
  *   *Action:* If linking a Rigidified Record to a Non-Rigid Record:
      *   **As-Described-Here.**
      *   *Reasoning:* They pick out the same object *now*, but they have different rules for picking it out in other contexts. Merging them erases the modal distinction.

  ---

  ### Application to Proposals

  Here is how the RMP handles your three hard cases.

  #### Case 1: The Cicero/Tully Pair
  *   **Record A:** "Cicero" (Intake: Ostensive/Baptism).
  *   **Record B:** "Tully" (Intake: Inheritance/Ostensive).
  *   **Proposal:** Archival research confirms both names were used for the same Roman statesman.
  *   **RMP Run:**
      1.  *Existence:* Confirmed.
      2.  *Tags:* Both Rigid (Ostensive/Inheritance).
      3.  *Stability:* Yes. Even if Cicero never entered politics, he is still Cicero.
      4.  *Evidence:* Confirmed by research.
      5.  *Actual-:* N/A.
  *   **Output:** `Identity-of-Object`.
  *   **Comment:** This is the standard Kripkean case. Empirical discovery does not equal contingency. Once confirmed, the identity is necessary.

  #### Case 2: The Placeholder / Unknown Author
  *   **Record A:** "The Author of *Waverley*" (Intake: Placeholder/Role).
  *   **Record B:** "Walter Scott" (Intake: Ostensive).
  *   **Proposal:** Stylistic analysis suggests Scott *probably* wrote it; no signed manuscript exists.
  *   **RMP Run:**
      1.  *Existence:* Scott exists. The Author exists (someone wrote it).
      2.  *Tags:* Record A is Placeholder (Non-Rigid). Record B is Ostensive (Rigid).
      3.  *Stability:* No. If Scott hadn't written it, Record A would refer to someone else. Record B would still refer to Scott.
      4.  *Evidence:* **Probable**, not Confirmed.
  *   **Output:** `Flag for Senior Review`.
  *   **Comment:** **This is the result you will dislike.** You want to merge the records to clean up the database. You feel confident it's Scott. But the procedure forces a Flag.
  *   **Why it is Right:** `Identity-of-Object` asserts that in *any* scenario where Scott exists, he is the Author of *Waverley*. That is metaphysically false (he could have chosen not to write it). Furthermore, your evidence is probabilistic. To log `Identity-of-Object` is to claim metaphysical necessity based on epistemic probability. That is a data corruption risk. If new evidence exonerates Scott, you have to retract an "Identity," which is expensive. A `Flag` preserves the distinction between the *person* (Scott) and the *role* (Author) until certainty is reached.

  #### Case 3: The Number Count vs. Actual-Number
  *   **Record A:** "The Number of Notebooks Bequeathed" (Intake: Description/Count). Value: 7.
  *   **Record B:** "The Actual Number of Notebooks Bequeathed" (Intake: Rigidified Description). Value: 7.
  *   **Proposal:** Equate the two records.
  *   **RMP Run:**
      1.  *Existence:* Abstract objects (Numbers) exist in the Registry schema.
      2.  *Tags:* Record A is Non-Rigid (Count could vary). Record B is Rigidified ("Actual-").
      3.  *Stability:* No. In a scenario where one notebook was lost, Record A picks out 6. Record B still picks out 7 (the actual number).
      4.  *Evidence:* Mathematical identity.
      5.  *Actual- Check:* **Yes.** Mismatch in modal profile.
  *   **Output:** `As-Described-Here`.
  *   **Comment:** You might think "It's the number 7! Link them!" But the *records* encode different modes of access. Record A is sensitive to changes in the bequest; Record B is not. Linking them as `Identity-of-Object` implies the descriptions are interchangeable. They are not. `As-Described-Here` captures that they co-refer in this world, but preserves the semantic difference for future data integrity.

  ---

  ### Limitations: Where the Procedure Breaks

  I owe you honesty about where this checklist fails. I have stripped away the semantic theory to make it runnable, and in doing so, I have created blind spots.

  1.  **The "Essential Property" Trap:** Step 3 asks if a description is stable. But some descriptions *are* essential (e.g., "The Son of Mary"). The checklist treats all descriptions as potentially contingent to be safe. This will force you to `Flag` or `As-Described` some identities that are actually necessary. You will over-Flag. This is safer for data curation than over-Merging, but it is theoretically imprecise.
  2.  **Epistemic vs. Metaphysical:** Step 4 tries to separate "Probable" from "Confirmed." But in history, "Confirmed" is often just "Very High Probability." The procedure treats "Confirmed" as a binary switch for Necessity. This conflates our *certainty* with *modal status*. If you mark `Identity-of-Object`, you are betting your career that the historians are infallible.
  3.  **Empty Names:** Step 1 flags empty names. But Kripke allows names to refer to nothing without being meaningless. The Registry likely cannot handle "Null Entities." The procedure punts this to Policy (`Flag`). This is a failure of the system, not the theory.
  4.  **Judgment Cannot Be Eliminated:** The distinction between a Reference-Fixing Description ("Let 'Neptune' name the planet causing these perturbations") and a Contingent Description ("The planet causing these perturbations") is subtle. If the intake tag is wrong, the procedure fails. You must exercise judgment on whether the original cataloger *stipulated* the name or *described* the object. The checklist cannot read the cataloger's mind.

  ### Final Advice

  You are working in a system that demands binary choices (`Identity` vs. `Not Identity`) for problems that are often matters of degree. The RMP biases toward caution (`Flag` or `As-Described`). Your senior editor (the historian) will likely find this frustrating. They care about *historical truth*; you are guarding *modal integrity*.

  When you hand over a `Flag`, do not say "It's not necessary." Say: "The record definitions rely on contingent properties, and the evidence is probabilistic. Merging now creates a retraction risk if the description fails." That is a language the historian understands.

  The procedure will feel slow. It will feel like it blocks progress on the Placeholder case. But in data curation, a false identity is a lie that propagates forever. A `Flag` is just a question. Lie less. Ask more.
