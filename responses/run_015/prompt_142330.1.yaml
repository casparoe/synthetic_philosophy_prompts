prompt: |-
  You are a professional philosopher with research-level expertise in modal metaphysics and the theory of reference, who has also spent time advising on data-curation projects. Please think carefully, and before drafting anything, brainstorm honestly about which distinctions in the Kripkean framework can survive being turned into a checklist and which collapse the moment the theory behind them is stripped away.

  I'm an undergraduate in a philosophy department, and I work fifteen hours a week as a junior editor on a national biography database — call it the Registry. Several times a week I have to log a proposed identity between two entity records: I must decide whether the two names pick out the same object necessarily, or only as the sources in front of me describe them. The stakes are real — logged identities propagate into published authority files and misattributions are expensive to retract — but I have about ten minutes per proposal, no access to the physical archives beyond the record itself, and a senior editor (a historian with no modal logic) who audits my decisions in a weekly batch.

  Write me a decision procedure I can actually run on a proposal: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the issue is one of editorial policy rather than fact. It should end in one of the Registry's three outputs — an identity-of-object link, an as-described-here link, or a flag for senior review. Every record carries an intake tag saying how its name entered the file: ostensive baptism in a document, a definite description used to fix reference, inheritance from another file, or a placeholder introduced for a role whose bearer was unknown and for which more than one candidate has since been proposed.

  The hard cases I need it to handle are: names introduced by a reference-fixing description, non-rigid descriptions like the head of the archive in 1793, rigidified descriptions of the actual-X form, descriptions that are rigid as a matter of fact though not by stipulation, and names that turn out to be empty. It must not conflate our having discovered something empirically with its being contingent, and it must be runnable by someone who has never seen a possible-worlds semantics.

  Then apply it to three proposals: a Cicero/Tully style pair where the identity was established by archival research; a placeholder name of the unknown-author kind, matched to a candidate who probably but not certainly held the role; and a claim equating a number reached by counting, such as the number of notebooks the founder bequeathed, with that same number under an actual- prefix. At least one of these should come out in a way I will dislike — tell me which, and why the answer is nevertheless right. Finally, say what the procedure cannot do: where judgment genuinely cannot be eliminated, and where you expect it to misfire.
