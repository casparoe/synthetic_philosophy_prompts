answer: |-
  **Q&A Prep Sheet: Heritability & Reading Intervention**

  **1. The Union Rep (Highest Damage)**
  **Question:** "If you tell the board reading is genetic, they'll cut the program. Why give them ammunition?"
  **Reply:** I'm telling them genetics isn't destiny. PKU is 100% genetic and 100% treatable. If we fix the environment for everyone, genetics explains *more* of the difference because the environmental noise is gone. That's success, not failure. Cutting funding because heritability is high is like cancelling fire trucks because most fires are put out. We fund interventions to raise the mean, not to manipulate a variance ratio.
  **Soft Spot:** Politically, "genetic" sounds like "fixed" no matter how I explain variance.

  **2. The Data Director**
  **Question:** "I need a soundbite. If I say 'schools matter,' will you contradict me?"
  **Reply:** You can say it. In fact, my whole point is that schools matter *more* when heritability is high. High heritability means we've standardized the bad stuff. If you quote me, quote this: "Rising heritability means our interventions are working." Do not quote the 70% number without the context of variance. The 70% describes the current differences, not the limit of future growth.
  **Soft Spot:** The 70% number is sticky; the variance explanation is not.

  **3. The "Hope Nobody Asks" (The Metric Trap)**
  **Question:** "You keep saying 'closable share.' What is the number for *our* third graders?"
  **Reply:** I don't have that number, and neither does anyone else without running the intervention. That's why we need the pilot. Closable share isn't a biological constant like eye color; it's a measure of our policy capacity. Asking for it now is like asking how much a house costs before drawing the blueprints. We estimate it by trying to close the gap, not by calculating it beforehand.
  **Soft Spot:** Admitting I don't have the number makes the metric feel like a placeholder.

  **4. The Behavioral Geneticist**
  **Question:** "Your 'closable share' isn't identified. It's just environmentality with a nicer name."
  **Reply:** It's not a latent variance component; it's a policy counterfactual. Environmentality is about what *is*; closable share is about what's *feasible*. We can't identify it from twin data alone, but we can estimate it from intervention trials. I'm not doing biometrics; I'm doing policy triage. It's defined by our tools, not their genes.
  **Soft Spot:** She's technically right that it lacks the mathematical identification of $h^2$.

  **5. The Parent Representative**
  **Question:** "Are you saying some kids just can't learn to read?"
  **Reply:** Absolutely not. Heritability describes differences between kids in a group, not limits inside a single child. It tells us why Kid A scored differently than Kid B yesterday, not what Kid A can do tomorrow. Every child here is capable of learning; my job is to explain why some need different tools to get there.
  **Soft Spot:** It's hard to comfort parents with statistics about variance.

  **6. The Board Member (The Logic Trap)**
  **Question:** "If heritability goes up after this program, did we fail to close gaps?"
  **Reply:** No, you likely succeeded. If we lift the floor for everyone, the average score goes up, but the remaining differences are mostly genetic. We care about proficiency rates, not variance ratios. A rising heritability with a rising mean is the goal: everyone reads better, even if they still differ.
  **Soft Spot:** Boards care about gaps, and gaps might persist even if means rise.

  **7. The Quant Researcher**
  **Question:** "Does your test measure the same thing for high and low SES kids? If not, your heritability is garbage."
  **Reply:** You're right, measurement invariance is a prerequisite. If the test is biased, the variance decomposition is meaningless. I'm assuming our assessments are valid across groups. If they aren't, we have a testing problem before we have a genetics problem.
  **Soft Spot:** If their tests *are* biased, my whole talk collapses.

  **8. The School Psychologist**
  **Question:** "Okay, theory is great. Do I stop testing for dyslexia?"
  **Reply:** No. Individual diagnosis is clinical; heritability is population-level. You still need to find the specific barrier for each child. This talk is about budget allocation, not your IEP meetings. Keep doing what you're doing; just don't use population stats to judge individual potential.
  **Soft Spot:** They want protocols, not a distinction between levels of analysis.

  \answer{You're giving them budget cut ammunition.}
