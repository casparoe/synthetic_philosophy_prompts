  2.  **Deconstruct the Philosophical Wrinkles:**

      *   **Wrinkle 1: Credibility Capture.**
          *   *Concept:* The system doesn't just discount *you*; it discounts *everything you say* unless it fits a specific script. To be heard, you must distort your testimony.
          *   *Analysis:* Is it distinct? Fricker's *Testimonial Injustice* (TI) is about prejudice lowering credibility. *Hermeneutical Injustice* (HI) is about lacking concepts. Credibility Capture feels like a *perverse incentive structure* created by the intersection of TI and HI, but operationalized by power. It's not just that they aren't believed; it's that belief is *conditional* on self-incrimination.
          *   *Verdict:* It's a dynamic *consequence* of the first two, but distinct enough to name because it highlights the *agency* of the speaker being coerced into epistemic corruption. It shows credibility isn't a neutral resource; it's a currency with exchange rates set by power.
          *   *Key Insight:* Credibility *is* the instrument of harm. To gain credibility, you must lose integrity/truth.

      *   **Wrinkle 2: Danforth and "Uphill" Injustice.**
          *   *Student's Claim:* Danforth is a victim; liars surround him; his power makes him "un-tellable."
          *   *Analysis:* This is likely a category error. Testimonial injustice requires a *prejudicial* credibility deficit. Danforth suffers from *willful ignorance* or *structural insulation*. He isn't disbelieved because of identity prejudice; he is unchallenged because of authority. The "liars" aren't inflicting injustice *on him*; they are manipulating him. He is an *agent* of the injustice, not a victim. However, one could argue he suffers from *hermeneutical marginalization* in reverse—he is trapped in a legalistic framework that prevents him from seeing reality. But calling it "injustice against him" risks equating the oppressor's confusion with the oppressed's silencing.
