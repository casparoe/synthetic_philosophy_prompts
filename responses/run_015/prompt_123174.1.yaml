  **The Accelerator's Dilemma**

  A startup accelerator offers accepted founders a choice between two packages: the "Focus Package" (one-boxing), which includes intensive mentorship and office space, or the "Liquidity Package" (two-boxing), which includes the same office space plus a \$50,000 cash stipend but no mentorship. The ultimate payoff is a successful exit, valued at \$10 million, determined months later by the market and the committee's final endorsement. The mentorship causally improves a startup's odds of success by teaching vital skills, whereas the cash stipend has no causal effect on success other than providing immediate liquidity. However, founder quality is a hidden state unknown to the founders themselves at the time of choice: "High-Quality" founders (strong product, experienced team) are confident and typically reject mentorship to take the cash, while "Low-Quality" founders (weak product, inexperienced) feel insecure and select the mentorship to compensate. The committee's final endorsement relies primarily on the underlying founder quality, not the package chosen.

  ***

  **Supporting Work and Calculations**

  **1. Structure and Probabilities**
  Let $S$ be the event of a Successful Exit (\$10M).
  Let $M$ be the act of choosing Mentorship (One-Boxing).
  Let $C$ be the act of choosing Cash (Two-Boxing).
  Let $Q_H$ be the hidden state of High-Quality Founder.
  Let $Q_L$ be the hidden state of Low-Quality Founder.

  The agent is uncertain about their quality, assigning a prior:
  *   $P(Q_H) = 0.5$
  *   $P(Q_L) = 0.5$

  **Evidential Link (Selection Bias):**
  Founder quality influences the choice. High-Quality founders prefer Cash; Low-Quality prefer Mentorship.
  *   $P(M | Q_L) = 0.9$ (Low-Quality seek help)
  *   $P(M | Q_H) = 0.1$ (High-Quality take cash)
  *   Implies $P(C | Q_L) = 0.1$ and $P(C | Q_H) = 0.9$.

  **Causal Link (Treatment Effect):**
  Mentorship causally increases success probability regardless of quality.
  *   $P(S | Q_H, M) = 0.9$ (High Quality + Mentorship)
  *   $P(S | Q_H, C) = 0.8$ (High Quality + Cash)
  *   $P(S | Q_L, M) = 0.3$ (Low Quality + Mentorship)
  *   $P(S | Q_L, C) = 0.2$ (Low Quality + Cash)
  *   *Note:* The causal boost of Mentorship is $+0.1$ in both states.

  **2. Causal Decision Theory (CDT) Verdict**
  CDT evaluates the act based on its causal consequences, holding the hidden state fixed.
  *   $EU(M) = P(S | Q_H) \cdot P(Q_H) \cdot V(S|M,Q_H) + P(S | Q_L) \cdot P(Q_L) \cdot V(S|M,Q_L)$
      *   Simplified: $P(S | do(M)) = P(S | Q_H, M)P(Q_H) + P(S | Q_L, M)P(Q_L)$
      *   $P(S | do(M)) = 0.9(0.5) + 0.3(0.5) = 0.45 + 0.15 = 0.60$.
  *   $EU(C) = P(S | do(C)) = P(S | Q_H, C)P(Q_H) + P(S | Q_L, C)P(Q_L)$
      *   $P(S | do(C)) = 0.8(0.5) + 0.2(0.5) = 0.40 + 0.10 = 0.50$.
  *   **Verdict:** CDT prescribes **One-Boxing (Mentorship)** ($0.60 > 0.50$). The causal benefit of mentorship outweighs the baseline.

  **3. Evidential Decision Theory (EDT) Verdict**
  EDT evaluates the act based on the news it brings about the hidden state.
  *   First, calculate posterior probabilities of Quality given the Act.
      *   $P(M) = P(M|Q_H)P(Q_H) + P(M|Q_L)P(Q_L) = 0.1(0.5) + 0.9(0.5) = 0.50$.
      *   $P(Q_H | M) = \frac{0.1 \times 0.5}{0.5} = 0.1$. (Choosing Mentorship is strong evidence of Low Quality).
      *   $P(Q_H | C) = \frac{0.9 \times 0.5}{0.5} = 0.9$. (Choosing Cash is strong evidence of High Quality).
  *   Now calculate expected success conditional on the Act.
      *   $P(S | M) = P(S | Q_H, M)P(Q_H | M) + P(S | Q_L, M)P(Q_L | M)$
      *   $P(S | M) = 0.9(0.1) + 0.3(0.9) = 0.09 + 0.27 = 0.36$.
      *   $P(S | C) = P(S | Q_H, C)P(Q_H | C) + P(S | Q_L, C)P(Q_L | C)$
      *   $P(S | C) = 0.8(0.9) + 0.2(0.1) = 0.72 + 0.02 = 0.74$.
  *   **Verdict:** EDT prescribes **Two-Boxing (Cash)** ($0.74 > 0.36$). The evidential weight of being a High-Quality founder overwhelms the causal benefit of mentorship.

  **4. Robustness Check**
  *   If the causal boost of Mentorship drops from $0.1$ to $0.05$: CDT $M = 0.55$, $C = 0.50$. (CDT still One-Boxes).
  *   If the prior on High Quality shifts from $0.5$ to $0.6$:
      *   CDT $M = 0.9(0.6) + 0.3(0.4) = 0.66$; $C = 0.8(0.6) + 0.2(0.4) = 0.56$. (CDT holds).
      *   EDT $P(Q_H|M) \approx 0.14$; $P(S|M) \approx 0.38$. $P(Q_H|C) \approx 0.93$; $P(S|C) \approx 0.76$. (EDT holds).
  The disagreement is stable.

  ***

  **Seminar Note Analysis**

  **Structural Feature and Familiar Cases**
  The structural feature doing the work is **Confounding by Indication** (a common cause influencing both the act and the outcome, counteracted by a direct causal link from act to outcome).
  *   If you delete the **Causal Ingredient** (Mentorship no longer improves success), the case reduces to the **Smoking Lesion family**. The act becomes a pure symptom of the hidden state with no causal power to alter the outcome, leading CDT to ignore the signal (take the cash/save effort) while EDT avoids the act associated with the bad state.
  *   If you delete the **Evidential Ingredient** (Choice no longer signals Quality), the case reduces to a **Standard Causal Decision**. Without the correlation, EDT loses its reason to deviate, and both theories follow the causal benefit (One-Boxing). *Note: To recover Ordinary Newcomb specifically, one must delete the Causal Ingredient AND invert the Evidential Valence (making the act evidence of the Good State), creating the classic Predictor setup where EDT One-Boxes and CDT Two-Boxes.*

  **Reply for the "Losing" Theory**
  The strongest reply for **EDT** (which recommends Two-Boxing here) is that in real-world observational data, the "Cash" strategy yields a 74% success rate versus 36% for "Mentorship." A defender would argue that rational agents should maximize expected utility based on the best available predictive information, and ignoring the strong signal of one's own quality is epistemically reckless.
  *   **Principled or Patch?** This is a **principled fix** for EDT in environments dominated by selection bias, but it functions as a **patch** in this specific normative context because it advises against taking the action (Mentorship) that objectively *makes* the agent more successful. It privileges *being* the kind of person who succeeds over *making* the choice that causes success.

  **The "One-Box = EDT" Slogan**
  This case gives us decisive reason to **stop repeating** that One-Boxing is the evidential answer and Two-Boxing the causal one. That slogan is an artifact of the standard Newcomb setup (where the correlation aligns with the payoff). As shown here, when the correlation signals a *negative* hidden state (Confounding by Indication), EDT Two-Boxes and CDT One-Boxes. The verdicts depend on the *valence* of the correlation, not the theory itself.

  **Functional Decision Theory (FDT)**
  FDT would prescribe **One-Boxing (Mentorship)**.
  *   **Why:** FDT treats the agent's decision as the output of a logical algorithm. However, the correlation here is due to a physical common cause (Founder Quality) that exists prior to and independently of the decision algorithm's logical output. FDT screens off physical common causes (agreeing with CDT) unless the state is logically dependent on the decision (as with a Predictor). Since Quality is a physical trait, not a logical prediction, FDT follows the causal benefit.

  **Real-World Practice**
  Epidemiologists and health economists encounter this pattern under the name **Confounding by Indication**. For example, patients who take a specific drug (Act) may have higher mortality (Payoff) not because the drug is harmful (Causal), but because only severely ill patients (Hidden State) are prescribed that drug (Evidential). Observational studies (EDT) suggest the drug kills; randomized trials (CDT) reveal it saves lives.
