answer: |-
  Your hypothesis is largely correct, though it requires sharpening. You are not witnessing a substantive disagreement about morality so much as a methodological collision between two distinct disciplines that happen to share a vocabulary. The impasse is not due to the difficulty of the problem, but to the fact that your group is attempting to solve a phenomenological problem with logical tools, and a logical problem with phenomenological data.

  Here is the diagnosis.

  ### 1. The Nature of the Disagreement
  This is a **category error** masquerading as a substantive debate. Specifically, it is a clash between **deontic logic** (the Deniers) and **moral phenomenology** (the Affirmers).

  The Deniers are treating morality as a formal system akin to the one you build in your day job. They are concerned with the consistency of the operator $O$ (obligation). For them, if $O(A)$ and $O(B)$ entail a contradiction when $A$ and $B$ are compossible, the system is broken. Their goal is to preserve the integrity of the moral architecture. When they say 'one ought to do only what one can do', they are stating a constraint on the definition of obligation, not necessarily an observation of human experience.

  The Affirmers, led by your nurse colleague, are treating morality as a lived experience. They are not analysing the syntax of moral language but the semantics of moral life. When they point to 'residue', 'guilt', and the 'refusal of consolation', they are citing data points that the Deniers' formal system explicitly deletes as noise. For the Affirmer, the tragedy *is* the data; for the Denier, the tragedy is a bug in the agent's prior processing.

  You suggested this might be two different questions run under one label. I would go further: it is one question asked by two different species of inquiry. The Deniers ask, 'Can a consistent moral theory be constructed?' The Affirmers ask, 'What is it like to be a moral agent in a broken world?' The answer to the first is 'Yes, if we define obligation carefully.' The answer to the second is 'It feels like being torn apart.' Neither answer falsifies the other, yet your group treats them as mutually exclusive verdicts on the existence of dilemmas.

  ### 2. Defence of the Diagnosis
  Look at the arguments you summarised. The Deniers rely on the principle of agglomeration (if you ought to do A and ought to do B, you ought to do A and B) and 'Ought implies Can'. These are axioms of Standard Deontic Logic. If you accept these axioms, genuine dilemmas are logically impossible by definition. To argue against them using cases like *Sophie's Choice* is futile, because the Denier simply reclassifies Sophie's obligation to save one child as a 'prima facie' duty that was overridden, not a genuine obligation that was violated. They are protecting the theory from the world.

  The Affirmers rely on Bernard Williams and Ruth Barcan Marcus. Williams argues that consistency is a demand of the observer, not the agent. Marcus argues that 'ought' does not agglomerate. Their evidence is the 'remainder'—the guilt that persists even after the right choice is made. If the Deniers were correct, and one obligation had been nullified by the conflict, there should be no rational basis for guilt. The Affirmers treat this guilt as evidence of a remaining claim. They are protecting the world from the theory.

  The stalemate exists because the Deniers view the Affirmers' evidence (guilt) as irrational emotion, while the Affirmers view the Deniers' evidence (logical consistency) as moral blindness. You noted that both concede the cases are tragic. This confirms they are talking past one another. They agree on the *fact* of the tragedy but disagree on the *ontology* of the tragedy.

  ### 3. The 'Duller Reason'
  You asked if there is a duller reason, such as never agreeing on what a moral principle is. There is. The group has not distinguished between **prescriptive principles** (rules for decision-making) and **descriptive principles** (accounts of moral status).

  The Deniers assume moral principles must be action-guiding. If a principle tells you to do the impossible, it fails as a guide. Therefore, contradictory principles cannot exist. The Affirmers assume moral principles track value or claims. If two innocent parties have a claim on you that you cannot both satisfy, the claims exist regardless of your ability to meet them. Until your group explicitly agrees on whether a 'moral principle' is a command to an agent or a description of value in the world, you will continue to spin.

  ### 4. What Counts as Progress?
  Further case-mongering will not work. You have exhausted the canon (Sartre, Agamemnon, Sophie). Introducing a new tragic case will only yield the same bifurcated response. A theorem will not help, as the Affirmers reject the axioms required to prove it.

  Progress requires a **change of question**. You should stop asking 'Do genuine moral dilemmas exist?' and start asking 'What function does the concept of a moral dilemma serve?'
  *   For the Denier, denying dilemmas preserves moral rationality and prevents agents from using 'I had no choice' as an excuse for negligence.
  *   For the Affirmer, affirming dilemmas preserves the gravity of moral loss and validates the agent's grief.

  If the group can shift to discussing *why* we want dilemmas to exist or not to exist, you will make progress. If you cannot make this shift, you ought to stop meeting about this topic. You are not stuck on a hard problem; you are stuck on a framing error. Continue only if you are willing to dissolve the question rather than solve it.

  ### 5. The Engineering Analogy
  You asked for bluntness regarding your analogy of infeasible constraint sets and soft constraints.

  **Where it works:**
  Your intuition is sound. The Deniers treat moral obligations as **hard constraints**. In a scheduling system, if hard constraints conflict, the problem is infeasible; there is no solution, and the system flags an error. The Denier says the agent is in error (prior fault) or the model is misdescribed.
  The Affirmers treat obligations as **soft constraints** with a penalty cost. You can violate them, but you incur a 'cost' (guilt, residue, moral remainder). The system remains feasible, but the objective function value degrades. This maps well onto the idea of 'residue'—something is owed, even if it cannot be paid.

  **Where it fails:**
  The analogy distorts the issue in two dangerous ways.
  First, engineering implies **optimisation**. In your work, you seek the best schedule that minimises cost. In morality, particularly in the cases you discuss (Sophie's Choice), there is often no optimisation possible, only loss. Framing it as a cost function suggests the guilt is merely a price paid for a suboptimal solution, whereas the Affirmers argue the guilt is a recognition of a distinct moral reality that survives the choice.
  Second, and more critically, your systems are external to the constraints. You are the engineer observing the infeasibility. In morality, the agent *is* the system. The 'residue' is not a log file entry; it is a transformation of the agent's moral identity.

  Do not discard the analogy, as it clarifies the structural difference between the two camps (feasibility vs. cost). However, do not let it convince you that moral residue is merely a 'price'. It is not a transaction cost; it is a scar.

  ### Summary Recommendation
  Your group is suffering from a lack of meta-ethical hygiene. You are mixing logic with phenomenology.
  1.  **Acknowledge the split:** Explicitly state that one side is discussing the logic of obligation and the other the experience of agency.
  2.  **Change the topic:** Move from 'Do dilemmas exist?' to 'What is the cost of denying them?'
  3.  **Use the analogy cautiously:** It explains the structural deadlock but risks trivialising the human element your nurse is defending.

  If the group cannot accept that they are answering different questions, you should cease discussing this topic. You are not digging deeper; you are digging two separate holes.
