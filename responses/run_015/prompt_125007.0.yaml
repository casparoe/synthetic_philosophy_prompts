answer: |-
  An adequate theory must prioritize relational history and institutional context over intrinsic physical properties to resolve the tension between functional equivalence and ontological divergence in copycat microdomains.

  **Mandatory Explanatory Targets**
  1.  **Categorical Divergence despite Physical Identity:** The theory must explain why tokens with identical structural and functional profiles are assigned to different categories based on lineage. *Motivating Case:* Two microchips with identical conductivity are classified as "Genuine" versus "Compatible" solely because one was fabricated by the original manufacturer and the other by a third party.
  2.  **Context-Dependent Boundary Shifts:** The theory must account for category membership changing without physical alteration to the token. *Motivating Case:* A replaced engine component shifts from "voiding warranty" to "covered" upon receipt of a certification stamp, demonstrating that status is a function of documentation rather than mechanics.

  **Required Case Distinctions**
  3.  **Functional Equivalence versus Ontological Identity:** The theory must keep distinct whether a token works like the original versus whether it is counted as the same kind of object. *Motivating Case:* A copycat drug bioequivalent to the brand name is therapeutically identical but ontologically distinct for patent and regulatory purposes.
  4.  **Liability Attribution versus Warranty Eligibility:** The theory must separate who is blamed for failure from whether the cost is covered. *Motivating Case:* An unaccredited installer causes a system failure where the hardware is sound, shifting liability from manufacturer to installer without changing the hardware's physical status.

  **Consistency Conditions**
  5.  **Cognitive Science Alignment (Graded Membership):** The theory must accommodate data showing humans treat category membership as a matter of degree rather than binary switches in informal contexts. *Motivating Case:* Users rate "refurbished" items as closer to "new" than "counterfeit" items, requiring a model that allows for typicality gradients.
  6.  **Jurisprudence Alignment (Chain-of-Custody):** The theory must align with legal frameworks that assign status based on historical relations rather than current state. *Motivating Case:* Product liability law assigns fault based on documentation trails and provenance rather than defect morphology, requiring the ontology to track historical relations.

  **Constraints and Preferences**
  7.  **Non-Negotiable Constraint: Rejection of Intrinsic Essentialism:** The theory cannot posit that category membership is fixed by physical or structural properties alone. *Motivating Case:* Since physical properties do not determine category membership in these domains, any theory relying on them is empirically falsified by the copycat phenomenon.
  8.  **Negotiable Preference: Taxonomic Monism versus Pluralism:** It is optional whether the theory posits a single correct taxonomy or allows multiple overlapping maps depending on the goal. *Motivating Case:* Whether there is one true map of these categories or multiple overlapping maps depends on whether the goal is legal precision or cognitive description.

  **Jointly Unsatisfiable Pair**
  *   **Deterministic Boundary Rules and Fluid Boundary Conditions:** These are jointly unsatisfiable because if boundaries shift with contextual parameters like market framing or installer accreditation, fixed deterministic rules cannot accurately predict membership without becoming infinitely complex or context-blind.

  **Killer Constraint**
  *   **Rejection of Intrinsic Essentialism:** This is the single requirement that eliminates the largest share of popular candidates, as it disqualifies any theory positing that category membership is fixed by physical or structural properties alone, which defines the majority of traditional metaphysical accounts.

  **Theory Scoring**
  *   **Classical Essentialism:** Fails immediately on the killer constraint; it cannot explain why physically identical tokens fall into different categories without invoking invisible metaphysical differences, rendering it useless for copycat microdomains.
  *   **Prototype-Theory Adaptation:** Partially succeeds by handling graded membership and cognitive consistency, but struggles with the sharp, binary distinctions required by liability and warranty cases where an item is either covered or not.
  *   **Pragmatic-Contextualist Model:** Succeeds across all desiderata by treating categories as tools dependent on use-context, allowing for fluid boundaries and relational definitions that align with both cognitive flexibility and legal strictures.
