answer: |-
  This is a sophisticated proposal that intersects formal epistemology, social ontology, and the philosophy of distributed cognition. You are effectively asking whether the "logical omniscience" problem is a bug of *individual* cognitive modeling or a bug of *agency* modeling simpliciter.

  Here is an analysis of your three specific points, followed by comments on the substantive value of this relocation and the problem of collective contradiction.

  ### 1. Relocation vs. Replication
  **Does this genuinely relocate the problem or merely replicate it at a higher level?**

  It genuinely relocates the problem, but only if you resist the temptation to treat the collective as a "black box" individual.

  *   **The Replication Risk:** If you model the tribunal as a single epistemic agent $G$ with an accessibility relation $R_G$, and you stipulate that $G$ knows the union of all members' knowledge, you have simply replicated logical omniscience at the group level. You have assumed that the aggregation mechanism is cost-free and logically perfect.
  *   **The Relocation Opportunity:** The problem shifts from *deductive closure* (can the mind see the implication?) to *informational integration* (can the system access the disjoint premises?). In individual models, the barrier to omniscience is cognitive capacity (memory, processing speed). In distributed models, the barrier is **communicative bandwidth and aggregation rules**.
  *   **Verdict:** This is a substantive relocation. It transforms the problem from one of *logical competence* to one of *structural topology*. An impossible-worlds model for an individual restricts what worlds are accessible to a mind. A distributed model restricts what premises are accessible to the *aggregation function*. This suggests that "logical omniscience" in institutions is not a failure of logic, but a failure of **information architecture**.

  ### 2. Collective Intentionality
  **Does the argument smuggle in an implausibly strong commitment to collective intentionality?**

  This is the most dangerous philosophical trap in your draft. It depends on whether you are making a *summative* or *non-summative* claim.

  *   **Summative View:** The group believes $P$ iff most/all members believe $P$. This avoids strong collective intentionality but fails your tribunal case (since no member holds the conjunction).
  *   **Non-Summative View (Gilbert, Pettit, List):** The group can believe $P$ even if no member believes $P$, provided there is a joint commitment or a functional role.
  *   **The Smuggle:** If you claim the tribunal *is* a logically omniscient knower, you are implicitly endorsing a strong non-summative view. You are attributing a doxastic state to an entity that lacks a singular phenomenology.
  *   **The Normative Escape:** You mentioned the body is "normatively required" to apply consequences. This is your lifeline. You can avoid metaphysical commitment to a "group mind" by framing this deontically rather than doxastically. The tribunal does not *know* the entailment in a psychological sense; it is *liable* for the entailment in a legal/normative sense.
  *   **Verdict:** To avoid implausible intentionality, frame the "collective knowledge" as **imputed knowledge** (a legal/functional status) rather than **occurrent belief**. This allows you to model the system as omniscient *for the purposes of accountability* without claiming the system possesses a unified consciousness.

  ### 3. Distributed Computation vs. Distributed Belief
  **Is institutional division of labor better analyzed as distributed computation rather than as distributed belief?**

  This is the strongest analytical move available to you. The "logical omniscience" problem arises because standard epistemic logic treats knowledge as a **state** rather than a **process**.

  *   **Belief as State:** In standard modal logic ($K_a \phi$), the agent is already in possession of the truth. Omniscience is problematic because it assumes all consequences are already "in" the state.
  *   **Knowledge as Computation:** In a distributed system (like your tribunal), premises are data stored on different nodes. The "entailment" is not a static relation but a **computational output** that requires message passing.
  *   **Algorithmic Knowledge:** You might look into the literature on *Algorithmic Knowledge* (Halpern, Moses, Vardi). This framework distinguishes between *having* the data and *computing* the answer. A distributed system is not omniscient; it is **resource-bounded**. It only "knows" what it has computed given its communication protocols.
  *   **Verdict:** Yes. Analyzing this as distributed computation dissolves the paradox. The tribunal does not "fail" to know the entailment; it has not yet run the algorithm that combines the chemistry premise with the law premise. The "omniscience" requirement is actually a demand for **complete integration**, which is computationally expensive, not logically impossible.

  ### Substantive Value: Does this change the debate?

  It changes the debate from **idealization** to **implementation**.

  In individual epistemology, logical omniscience is often dismissed as a harmless idealization for "rational agents." In distributed systems, it becomes a **design specification**. If you model a tribunal as a single S5 agent, you are designing a system that assumes perfect communication. When the system fails (which it will), your model cannot explain *why*.

  By relocating the problem, you show that logical omniscience is not just a limit of minds, but a limit of **systems**. It clarifies that the "boundary conditions" of epistemic logic are not defined by the skull, but by the **interface protocols** between agents. This does not confuse the boundary conditions; it reveals that the boundary was drawn arbitrarily at the individual level to begin with.

  ### The Problem of Collective Contradiction

  You asked: *What should we say about cases where the collective reaches contradictory conclusions that no member could derive alone?*

  This is the **Discursive Dilemma** (or Doctrinal Paradox), famously analyzed by Philip Pettit and Christian List.

  *   **The Scenario:** Member A believes $P$ and $P \to Q$. Member B believes $\neg P$ and $P \to Q$. (Or variations where premises are split). The majority vote on premises yields a different outcome than a majority vote on the conclusion.
  *   **Implication for Your Thesis:** This is the smoking gun against modeling the collective as a single logically omniscient agent. A single agent in standard doxastic logic cannot hold contradictory beliefs (consistency is usually an axiom).
  *   **The Solution:** If the collective reaches a contradiction that no individual sees, it proves the collective **is not a single epistemic agent** in the standard sense. It is a **system with coherence failures**.
  *   **Recommendation:** Use this to argue that "distributed belief" is a category error. The collective does not have *beliefs*; it has **outputs**. When the outputs contradict, the system is malfunctioning, not "believing falsely." This supports your move toward **distributed computation**. A computer can output contradictions if its code is buggy or its inputs are corrupted; we don't say the computer is "irrational," we say it is **incoherent**.

  ### Summary Recommendation for the Essay

  1.  **Adopt the Computational Frame:** Argue that "logical omniscience" in collectives is actually a problem of **information integration costs**. Use the distinction between *implicit* information (available in the system) and *explicit* knowledge (computed by the system).
  2.  **Deflate the Ontology:** Avoid claiming the group is a "mind." Claim it is a **normative locus**. The group is treated *as if* it knows for the sake of responsibility, even if it lacks the cognitive unity to actually know.
  3.  **Leverage the Contradiction:** Use the Discursive Dilemma to show that treating the group as a single agent leads to formal inconsistency. This proves that the "relocation" of omniscience fails unless we change the underlying logic from standard modal logic to something that handles **fragmentation** (like Fragmented Belief models or Dynamic Epistemic Logic with communication actions).

  This approach saves the essay from merely being "social epistemology applied to logic" and turns it into a critique of the **unit of analysis** in epistemic logic itself.
