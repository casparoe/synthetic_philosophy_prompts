answer: |-
  You have stated Good's Theorem correctly. Under the standard assumptions of Bayesian decision theory, the expected value of free information is indeed non-negative. There is no example within that framework where acquiring information lowers expected utility.

  The intuition behind the theorem is simple: upon receiving a signal, you are free to ignore it and take the action you would have taken without the information. Since you are an expected-utility maximizer, you will only deviate from that baseline action if the new action offers higher expected utility conditional on the signal. Therefore, your ex-ante expected utility cannot decrease.

  To construct an example where the Value of Information (VoI) is genuinely negative, we must violate one of the theorem's underlying assumptions. The most philosophically and practically significant violation involves the **definition of the utility function**. Good's Theorem assumes that utility depends only on the final action and the state of the world, $U(a, \omega)$. It assumes you do not care about the information *itself*, only what it allows you to achieve.

  If we relax this to allow utility to depend on the agent's epistemic state (e.g., anxiety, curiosity, or suspense), VoI can be negative. This is often called **Information Aversion**.

  Below is a fully specified example demonstrating this.

  ### The Example: Diagnostic Anxiety

  **1. States of the World ($\Omega$)**
  There are two possible states regarding a patient's health:
  *   $\omega_S$: Sick (Probability $P(\omega_S) = 0.5$)
  *   $\omega_H$: Healthy (Probability $P(\omega_H) = 0.5$)

  **2. Available Actions ($A$)**
  *   $a_T$: Treat (Take a preventative medication).
  *   $a_N$: No Treat (Do nothing).

  **3. Payoffs (Monetary/Physical Outcomes)**
  These are the objective consequences of the action and state:
  *   If $a_T$ (Treat): Cost is $\$100$ regardless of health. (Outcome: $-\$100$)
  *   If $a_N$ (No Treat) and $\omega_S$ (Sick): Severe illness occurs. (Outcome: $-\$1000$)
  *   If $a_N$ (No Treat) and $\omega_H$ (Healthy): No cost. (Outcome: $\$0$)

  **4. The Signal ($\Sigma$)**
  A diagnostic test is available. It is perfectly accurate.
  *   If $\omega_S$, Signal $\sigma_+$ (Positive) with probability 1.
  *   If $\omega_H$, Signal $\sigma_-$ (Negative) with probability 1.
  *   The test is free (monetary cost = $\$0$).

  **5. Utility Function**
  Here we deviate from the standard assumption. The decision-maker is **risk-neutral over money**, but experiences **anticipatory anxiety** if they know they are sick.
  $$U(a, \omega, \text{Knowledge}) = \text{Monetary Payoff}(a, \omega) - \text{Anxiety Cost}$$
  *   **Anxiety Cost:** If the agent *knows* they are Sick (i.e., receives $\sigma_+$), they incur a utility penalty of $\$200$ due to distress while awaiting treatment/outcome. If they remain ignorant or know they are Healthy, the anxiety cost is $\$0$.

  ---

  ### The Arithmetic

  **Case A: No Information (Blind Decision)**
  The agent must choose $a_T$ or $a_N$ based on the prior ($50\%$ Sick).
  *   **Expected Utility of $a_T$:**
      $$0.5(-\$100) + 0.5(-\$100) = -\$100$$
      (No anxiety cost because the agent does not *know* the state).
  *   **Expected Utility of $a_N$:**
      $$0.5(-\$1000) + 0.5(\$0) = -\$500$$
  *   **Optimal Action:** $a_T$ (Treat).
  *   **Expected Utility (No Info):** **$-\$100$**.

  **Case B: With Information (Test First)**
  The agent observes the signal, updates beliefs to certainty, then chooses the action.
  *   **Scenario 1: Signal $\sigma_+$ (Occurs with $P=0.5$)**
      *   Agent knows $\omega_S$.
      *   **Action Choice:**
          *   $a_T$: Payoff $-\$100$. Anxiety $-\$200$. Total: $-\$300$.
          *   $a_N$: Payoff $-\$1000$. Anxiety $-\$200$. Total: $-\$1200$.
      *   **Optimal Action:** $a_T$.
      *   **Utility:** **$-\$300$**.
  *   **Scenario 2: Signal $\sigma_-$ (Occurs with $P=0.5$)**
      *   Agent knows $\omega_H$.
      *   **Action Choice:**
          *   $a_T$: Payoff $-\$100$. Anxiety $\$0$. Total: $-\$100$.
          *   $a_N$: Payoff $\$0$. Anxiety $\$0$. Total: $\$0$.
      *   **Optimal Action:** $a_N$.
      *   **Utility:** **$\$0$**.
  *   **Expected Utility (With Info):**
      $$0.5(-\$300) + 0.5(\$0) = \mathbf{-\$150}$$

  **Value of Information:**
  $$VoI = E[U|\text{Info}] - E[U|\text{No Info}]$$
  $$VoI = (-\$150) - (-\$100) = \mathbf{-\$50}$$

  The agent is strictly better off *not* taking the test.

  ---

  ### Which Assumption Failed?

  This example violates the **Separability Assumption** (or the **Consequentialist Assumption**) of standard decision theory used in Good's Theorem.

  Good's Theorem assumes the utility function is defined over the set of action-state pairs: $U: A \times \Omega \rightarrow \mathbb{R}$. It assumes the agent cares only about the physical consequences of their actions in the world.

  In the example above, the utility function is defined over action-state-**belief** triplets: $U: A \times \Omega \times \mathcal{P}(\Omega) \rightarrow \mathbb{R}$. The utility depends explicitly on the posterior probability distribution (the knowledge state). Specifically, the term $-\$200$ is triggered by the *knowledge* of the state, not the state itself (since in the "No Info" case, the agent is likely sick but does not pay the anxiety cost).

  ### A Note for a Physicist

  Since you are a physicist, you might also encounter negative VoI in contexts involving **measurement disturbance**. Good's Theorem assumes the signal $\sigma$ is correlated with $\omega$ but acquiring $\sigma$ does not causally alter $\omega$.

  In quantum mechanics (or classical systems with invasive probes), measurement can collapse a wavefunction or disturb a system (e.g., checking tire pressure releases air). If acquiring the signal changes the probability distribution of the states $P(\omega)$ itself, Good's Theorem does not apply. In that case, you are not merely acquiring information; you are performing an intervention. The "negative value" arises because the "information" channel is coupled to a "disturbance" channel, violating the assumption that observation is passive.

  However, in the realm of pure decision theory (classical, non-invasive), the **Information Aversion** example above is the standard, rigorous demonstration of negative VoI.
