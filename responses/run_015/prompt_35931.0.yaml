  Your moral outlook is best captured by a principle of **fair risk distribution and non-instrumentalization**: aggregation is permissible when burdens are small or probabilistic, but no identified individual may be sacrificed as a means to save others unless the harm results from redirecting an existing threat or is legitimated by fair ex ante consent.

  Your tentative principle failed because it could not distinguish the Trolley case from the Surgeon case; both involve an identified person dying, yet you permit the former and forbid the latter. The repair requires adding the **Doctrine of Double Effect** distinction (or threat redirection): in the Trolley case, the one is not used as a means but is a tragic side-effect of redirecting an existing threat, whereas the Surgeon and Sheriff cases involve creating a new causal chain that instrumentalizes an innocent. Your verdicts on the Health Ministry, City Headache, and Vaccination cases confirm that you accept aggregation when harms are either non-lethal (headaches) or ex ante statistical (vaccination, budget policy), preserving separateness by ensuring no specific person is singled out for destruction. The Lottery Transplant verdict is the most philosophically fragile point in your equilibrium; it implies that the wrongness of the Surgeon case lies in unfairness rather than the inviolability of life, since you believe procedural fairness and consent can legitimize what is otherwise forbidden. If you hold this verdict, you are not a strict deontologist regarding the sanctity of life, but a contractualist regarding fair terms of cooperation; if you find this unstable upon reflection, the Lottery verdict is the one that must go to maintain a robust "separateness of persons" critique.

  Applied to the mining case, your repaired principle mandates the **risk-distribution option** (one-in-a-thousand risk for each of the thousand workers) and forbids the certain-death option (one specific worker). The certain-death option treats the identified worker as a mere means to secure safety for the group, replicating the structural wrong of the Surgeon case where management selects a specific victim. The risk-distribution option replicates the Vaccination case: the expected death is statistical, no specific person is identified ex ante as the sacrifice, and the burden is distributed fairly across the population benefiting from the operation. To choose the certain-death option would be to violate the constraint against singling out an identified individual for destruction, regardless of the identical expected utility.
