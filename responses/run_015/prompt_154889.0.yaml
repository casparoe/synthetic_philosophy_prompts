answer: |-
  **1. Precise Description of the Two-Register Pattern**
  This pattern involves a historical boundary functioning simultaneously as an ontological claim and an epistemological tool. Ontologically, the author posits a discrete empirical rupture (e.g., Harari's Cognitive Revolution, Diamond's Agricultural Switch) that causally explains subsequent structural changes. Epistemologically, this boundary serves as a heuristic frame organizing narrative and normative judgment. The dynamic emerges under critique: when empirical evidence suggests gradualism or reversibility, the author retreats to the heuristic defense, claiming the boundary is merely an analytical convenience. However, the heuristic retains the causal and normative weight originally derived from its empirical discreteness. The empirical claim legitimizes the heuristic's explanatory power, while the heuristic protects the empirical claim from falsification. This creates a closed loop where the boundary is treated as fact when building arguments and as model when defending them, allowing the author to evade evidentiary burdens while maintaining deterministic force. The core mechanism is the refusal to decouple explanatory potency from empirical status when the latter is compromised.

  **2. Nearest Established Terms and Limitations**
  Several concepts approximate this but miss the strategic reciprocity. *Whig history* implies a teleological march toward the present, whereas this pattern concerns the structural status of boundaries regardless of direction or end-goal. *Reification* describes treating abstractions as concrete things, yet it lacks the dynamic retreat mechanism; reification is usually a static category error rather than a strategic shift. *Motte-and-bailey* is the closest argumentative analogue, describing a shift between a defensible triviality and a controversial claim. However, motte-and-bailey typically applies to moral or political doctrines, not the specific historiographical tension between periodization and evidence. *Heuristic framing* is too neutral, implying honest idealization without the deceptive covariance. *Teleology* focuses on ends, not the ontological status of transitions. None capture the specific *mutual cover* where the empirical status inflates the heuristic's power, while the heuristic status insulates the empirical claim from disproof. The unique failure is not just error, but the functional dependency between the two registers, allowing the narrative to have it both ways: the solidity of fact and the flexibility of theory. Furthermore, standard *periodization* acknowledges arbitrariness explicitly. This pattern hides the arbitrariness until challenged. The distinction lies in the *timing* of the heuristic admission: it is withheld during exposition to maximize impact, then deployed during defense to minimize risk. This temporal asymmetry distinguishes it from honest methodological stipulation found in narrative theory.

  **3. Divergences and Boundary Conditions**
  This phenomenon is not standard periodization, which openly acknowledges arbitrariness while maintaining analytical utility. It is not simple falsification error, where an author mistakenly believes a gradual process was sudden; here, the author maintains the causal logic of suddenness even after conceding gradualism. It is not purely metaphorical language, which does not claim empirical ground. The boundary condition lies in the *dependency* of the explanation on the discreteness. If the causal mechanism works equally well with gradualism (e.g., cumulative pressure rather than a switch), then conceding gradualism is honest modeling. The failure occurs only when the explanatory force (e.g., "inequality began *here*") collapses without the discrete boundary, yet the author insists the boundary remains useful despite admitting it didn't empirically exist. The distinction rests on whether the heuristic retains illegitimate causal potency after losing empirical status. Crucially, this requires the audience to accept the causal link established during the empirical phase while accepting the defense established during the heuristic phase, without noticing the contradiction.

  **4. Verdict and Coined Term**
  This constitutes a distinct epistemic failure mode in macro-history. I propose the term **"Onto-Heuristic Slippage."** Defined: The rhetorical oscillation between treating a historical periodization as an empirical fact to secure causal explanatory power, and as a methodological heuristic to evade falsification, wherein the analytical utility illegitimately depends on the conceded empirical falsity. Unlike standard modeling, Onto-Heuristic Slippage obscures the cost of idealization. It allows grand narratives to maintain deterministic rigor (requiring discrete breaks) while adopting the flexibility of social science modeling (allowing fuzzy boundaries) whenever evidence demands. This term captures the specific movement between ontology (what happened) and heuristic (how we map it), marking the point where the map claims to be the territory to win arguments, but denies being the territory to avoid loss. It identifies a specific rhetorical immunity granted to macro-historical syntheses that prevents genuine empirical engagement. Consequently, it stalls historiographical progress by insulating foundational claims from the evidentiary standards required by their own causal weight.

  **5. What Would Change My Mind**
  I would reject this as a separate phenomenon if demonstrated that this slippage is an unavoidable feature of all historical modeling rather than a specific rhetorical failure. If standard scientific idealization (e.g., frictionless planes in physics) inherently requires this dual status without misleading audiences, then this is merely "modeling," not a distinct historiographical error. Additionally, if authors explicitly acknowledge the slippage upfront—stating "this boundary is false but useful" without later implying it was real—the defensive mutual cover vanishes, reducing it to honest abstraction.
