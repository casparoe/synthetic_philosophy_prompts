answer: |-
  # The Indeterminacy Checklist (v1.0)

  **Purpose:** To handle ambiguous user intents without pretending we know what the user "really means". Quine's point is that there is no fact of the matter beyond behaviour. This procedure forces us to admit when we are guessing based on business convenience rather than linguistic truth.

  **Constraint:** 2 minutes per case. Junior engineer on shift.

  ## The Procedure

  ### Step 1: Check Behavioural History (The "Stimulus" Check)
  Look at the user's past actions. Do not look for "meaning", look for patterns.
  *   **Action:** Query last 3 interactions.
  *   **Evidence Needed:** Did they pause before? Did they cancel and return?
  *   **Decision:** If history matches Action A (e.g., pause), map to Action A.
  *   **Stop Point:** If history is empty or contradictory, move to Step 2. Do not invent a narrative.

  ### Step 2: Structural Mapping (The "Schema" Check)
  Map words to our database fields. Acknowledge this is where we force their world into ours.
  *   **Action:** Match keywords to DB columns (e.g., "stop" → `status_id`).
  *   **Evidence Needed:** Direct lexical overlap.
  *   **Value Flag:** ⚠️ **WARNING:** We are assuming our database schema matches reality. It might not. "Plan" might mean "Billing Cycle" to us but "Service Access" to them.
  *   **Decision:** If match is unique, proceed. If multiple fields match (e.g., `status` vs `subscription_level`), move to Step 3.

  ### Step 3: The Principle of Charity (The "Rationality" Check)
  Assume the user is rational and wants to minimise loss.
  *   **Action:** Choose the action that is easiest to reverse.
  *   **Evidence Needed:** None. This is a heuristic.
  *   **Value Flag:** ⚠️ **WARNING:** This is not a fact. This is a business rule disguised as logic. We are choosing "Pause" over "Cancel" because it saves revenue, not because we know it's what they meant.
  *   **Decision:** Pick the least destructive action.
  *   **Stop Point:** If the least destructive action causes system errors (e.g., cannot pause a prepaid plan), move to Step 4.

  ### Step 4: The Indeterminacy Stop (The "Gavagai" Point)
  Admit when the data runs out.
  *   **Action:** If Steps 1–3 yield conflicting results or require assuming too much about their ontology, **flag for Human Support**.
  *   **Criteria:** You cannot distinguish between "Pause Plan", "Cancel Plan", and "Delete Account" based on available tokens.
  *   **Decision:** Do not guess. Tag as `INTENT_AMBIGUOUS`.
  *   **Note:** Quine says there is no "correct" answer here. Sending to a human is not finding the truth; it's outsourcing the liability.

  ### Step 5: Log the Hypothesis
  Every mapping is a hypothesis. Record it.
  *   **Action:** Add a comment to the ticket: "Mapped X to Y based on [Step Number]. Indeterminacy risk: [High/Low]".
  *   **Reason:** So we can see later where our "analytical hypotheses" failed.

  ---

  ## Case Applications

  ### Case 1: "stop my plan for now"
  *   **Input:** "stop my plan for now"
  *   **Step 1 (History):** User paused twice last year. Returned both times.
  *   **Step 2 (Schema):** "Stop" maps to `status=inactive`. "Plan" maps to `subscription`.
  *   **Step 3 (Charity):** "For now" implies temporality. Pause is reversible; Cancel is permanent. Least destructive = Pause.
  *   **Decision:** Map to `ACTION_PAUSE`.
  *   **Value Flag:** ⚠️ We are assuming "for now" guarantees intent to return. It might just be politeness.
  *   **Outcome:** Procedure holds. Map to Pause. Log hypothesis.

  ### Case 2: The "gavagai" Error Token
  *   **Input:** System log contains error token `ERR_GAVAGAI`.
  *   **Step 1 (History):** No user history. This is system-generated.
  *   **Step 2 (Schema):** No DB field matches "gavagai". It is not a state, a user, or a plan.
  *   **Step 3 (Charity):** Cannot apply. No user intent to preserve.
  *   **Step 4 (Indeterminacy Stop):** **TRIGGERED.** This is pure noise or a developer joke injected into the pipeline. There is no behavioural evidence to link this token to a DB action.
  *   **Decision:** Do not map to any DB action. Tag as `SYSTEM_NOISE` or `UNKNOWN_EXCEPTION`. Route to Senior Engineer, not Support.
  *   **Reasoning:** Quine's point exactly. Without a "stimulus meaning" (a situation where this token appears consistently), it refers to nothing. Treating it as "Cancel" or "Pause" is hallucination.

  ### Case 3: The Quick Engineering Answer (The Trap)
  *   **Input:** "kill everything"
  *   **Step 1 (History):** User is angry. Churn risk high.
  *   **Step 2 (Schema):** "Kill" maps to `delete_user` or `cancel_subscription`.
  *   **Step 3 (Charity):** Least destructive is `cancel_subscription`.
  *   **Step 4 (Indeterminacy):** Wait. "Everything" might include data GDPR requests.
  *   **The Shortcut:** Junior engineer is busy. Skips Step 4. Maps to `cancel_subscription` because it's the default "stop" function.
  *   **Outcome:** **Procedure Failed.**
  *   **Flag:** ⚠️ **CRITICAL:** This saves time but likely misreads intent. User might want data deletion (right to be forgotten), not just billing stop.
  *   **Correction:** This case requires Step 4 escalation. If the procedure allows the shortcut, the procedure is broken. Mark this as a known failure mode where engineering speed overrides user ontology.

  ---

  ## What This Procedure Cannot Do (Limitations)

  **1. The Schema is Not Reality**
  Quine would say we are smuggling in "analytical hypotheses" by assuming our database tables (Plan, User, Subscription) match the user's mental categories. They might see "Plan" as "Service Access" while we see it as "Billing Cycle". The procedure cannot detect this mismatch. It only checks if words fit our columns, not if our columns make sense.

  **2. Assumption of Consistency**
  We assume "stop" means the same thing today as it did yesterday. Quine argues meaning changes with context. If a competitor launches a new feature, "stop" might suddenly mean "switch provider" rather than "pause". The procedure treats language as static; it is not.

  **3. Hidden Value Choices**
  Step 3 (Least Destructive) is a business decision, not a linguistic one. We are prioritising retention over accuracy. The procedure flags this, but it doesn't solve it. We are effectively deciding that "Pause" is the default truth until proven otherwise. That is a policy, not a fact.

  **4. The "Myth of the Museum"**
  We act as if meanings are stored in the user's head and we just need to retrieve them. Quine says meaning is public behaviour. If the user doesn't clarify, there is no hidden meaning to find. The procedure sometimes implies we are "finding" intent. We are not. We are assigning it.

  **5. Unknown Indeterminacy**
  There are cases where we won't even know we're wrong. If we map "freeze" to "pause" and the user accepts it, we think we were right. Quine says we were just compatible. The user might have meant "pause billing but keep access" and we gave "pause access but keep billing". If they don't complain, the procedure marks it as success. It is not. It is just undetected error.

  **Final Note for the Team:**
  This checklist does not solve the gavagai problem. It manages the risk. When you hit Step 4, do not feel frustrated that you couldn't find the "right" answer. There isn't one. You are choosing the most useful fiction for the business. Log it, flag it, and move on.
