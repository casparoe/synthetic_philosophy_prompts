prompt: |-
  I'd like you to act as an expert philosopher of mathematics with particular attention to epistemology and metaphysics of abstract objects, and please think carefully and step by step before answering. Start by briefly brainstorming the logical space: identify which commitments below are standard moves in the Benacerraf literature, flag any hidden dependencies, and note where a non-obvious pull might be lurking.

  Here's my position, which I've arrived at recently after moving from physics into philosophy of mathematics, and I need a consistency audit before I present it to an interdisciplinary seminar. I hold the following commitments together:

  (1) Full-blooded platonism about mathematical objects: numbers, sets, and functions exist necessarily, are non-spatiotemporal, and stand in no causal relations to physical systems or cognitive agents.

  (2) Benacerraf's epistemological challenge, in its strong form, is sound: if there is no appropriate connection—causal, explanatory, or logical—between a belief and the fact that makes it true, that belief does not constitute knowledge.

  (3) We genuinely possess mathematical knowledge, not merely justified belief, pragmatic acceptance, or warranted assertibility.

  (4) The evolutionary origins of our basic numerical capacities do not constitute a debunking argument against mathematical knowledge, because necessary truths are immune to undermining by contingent selection histories.

  (5) Mathematical knowledge is not acquired through direct intuition or seeing abstract objects; rather, it arises from our grasp of the logical structure of modal space—specifically, from recognizing which structures are invariant across all possible worlds.

  (6) Benacerraf's dilemma is fatal only if we assume that knowledge requires physical causation; if we allow that logical and explanatory grasp can satisfy the connection requirement, then platonism survives intact.

  (7) I reject Quine-Putnam indispensability arguments as the primary ground for platonism, because ontology should be driven by direct metaphysical intuition rather than by theoretical utility in empirical science.

  (8) I use reflective equilibrium as my method: I take my intuitions about specific cases (e.g., that we know 7 is prime) and adjust my general principles until they cohere, and this equilibrium supports (1) through (7).

  Please audit this package. Identify which pairs are in genuine tension and which only appear to conflict but dissolve on inspection; be specific about whether the tension is between principle and case, between two principles, or between a principle and its motivation. For each genuine tension, rank it by severity and say what the cheapest revision would be and what that revision costs elsewhere in the set. Identify any hidden dependency—something I am implicitly committed to that I haven't listed. Do not ask me which commitment I would drop; present the audit as a structural damage report. Do not provide bibliographies, reading lists, or citations.
