  *(Self-Correction Note during final output generation)*: I need to make sure I don't just defend Dennett but analyze the specific sentence "a real pattern is one that lets you compress the data." Dennett says patterns are real *because* they support prediction (which implies compression), but the roommate is using it to say "it's *only* compression." I need to highlight that slide.

  Let's organize the claims from "Weak/True" to "Strong/Controversial."
