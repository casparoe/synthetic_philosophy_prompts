      *   *Schopenhauer's Reality:* Schopenhauer is very specific that music requires *sound* and *time*.
      *   *Why Sound?* Music is an art of the *Representation*. Even though it copies the Will, it is still perceived by a subject. It exists in the world as Representation (phenomena). Sound waves vibrating in time are the medium through which the Will becomes audible to the intellect.
      *   *Why Time?* The Will is timeless, but music unfolds in time. Schopenhauer calls music the "unconscious metaphysics." It translates the timeless striving into temporal succession.
      *   *Verdict on Silent Music:* Within Schopenhauer's system, "silent music" is a contradiction. If there is no sound, there is no phenomenon. If there is no phenomenon, there is no art (art is a representation). If it's purely mental, it's either memory/imagination (which are representations of past perceptions) or it's just the Will itself (which is blind striving, not art).
      *   *Nuance:* One could argue that *hearing* music in one's head is a representation of the music, not the music itself. But the *essence* of music for Schopenhauer relies on the sensory experience of tone to bypass the intellect.

