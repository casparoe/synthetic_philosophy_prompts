answer: |-
  The server room hummed like a dying refrigerator, cold enough to see breath. Mara found Elias hunched over the terminal in the control block, the blue light of the spectra washing out his face. He hadn't shaved in three days.

  "You're ignoring my pings," Mara said, leaning against the doorframe. She held two Styrofoam cups of coffee. She set one down near his elbow. He didn't touch it.

  "Looking at the residuals from the Cygnus field," Elias said. His voice was rough.

  "We all are. That's the job. But you flagged it as 'Do Not Publish' without a note. That's not how we do things, Eli. Not since the grant renewal."

  Elias finally turned. He looked sick. "You want to publish? Be my guest. Tell the world we found a magnetar flare that doesn't decay according to standard models."

  "A glitch. It happens."

  "It happens three times in six months. Same energy signature. Different coordinates. Always deep space, no local source." Elias tapped the keyboard. A waveform spiked on the main monitor, sharp and violent. "Look at the rise time. Too clean. Nature is messy. This is... deliberate."

  Mara sighed, rubbing her temples. "Deliberate. You're going full Kardashev on me? So what? It's a signal. We write the paper, we get the citation, we don't have to eat instant noodles for another semester."

  "It's not a signal *to* us." Elias stood up, pacing the small room. "It's a signal *at* us. Or rather, at everyone."

  "Okay, slow down. You're scaring me."

  "Think about the silence, Mara. The Great Silence. Why is nobody talking?"

  "Because everyone's dead. Or sleeping. Pick your favorite depressing option."

  "Wrong. Because they're hiding." Elias stopped pacing and pointed at the screen. "But hiding only works if you know what you're hiding from. If there's a predator out there cleaning up noisy civilizations, how does anyone know to shut up?"

  "Evolution? Survival instinct?"

  "Not on a galactic scale. You need deterrence. If you want to keep the kids quiet, you don't hide in the closet. You break a window so they know someone's home." Elias leaned in, eyes wide. "If the galaxy is a Dark Forest, there should be traps. Or warnings. Things that say, 'I am strong, and I am watching, but you can't find me.' Artificial supernovae. Gamma-ray bursts that spell out primes. Advertising."

  Mara picked up her coffee, taking a long sip. "And this?" She gestured to the spike.

  "This looks like advertising."

  "Or it looks like a magnetar having a bad day," Mara said, her voice flat. "You're building a castle on a grain of sand. If you're right, if this is a warning shot from a galactic police force, then publishing this data is basically painting a target on our backs. You say we're noisy? This paper makes us screaming."

  "Exactly."

  "So you want to bury it?"

  "I want to understand it!" Elias snapped, then lowered his voice. "If I'm right, the silence is maintained by threat. But if I'm wrong, and there's no threat, then we're hiding from ghosts. We're stifling human progress because of a ghost story."

  Mara walked over to the window. Outside, the Atacama desert was a void of black, the array dishes silent white bones against the stars. "There's a third option, Eli. You know there is."

  "What?"

  "There is no advertising because there is no police. And there are no colonies because expansion is impossible for reasons we don't get yet. Physics breaks down. Cost is too high. Whatever." She turned back to him. "In that case, this flare is just noise. And you're trying to turn noise into a monster so you don't have to face the fact that we might be truly alone. Not hunted. Just... isolated."

  Elias looked back at the screen. The waveform pulsed gently, a green heartbeat. "If I'm wrong about the threat, and we publish, we look like idiots chasing shadows."

  "If you're right about the threat, and we publish, we might get wiped out."

  "And if we don't publish?"

  "Then we stay safe, and stupid." Mara walked over to the terminal. Her hand hovered over the enter key. "We don't know which universe we're in, Eli. The Dangerous One or the Empty One."

  "The data..."

  "The data is ambiguous. That's the problem." Mara pulled her hand back. She looked tired, the ambition draining out of her shoulders. "If this is a warning, it's working. We're scared. But if it's just physics... then we're letting fear drive the ship."

  Elias slumped into his chair. "So what do we do?"

  "We wait." Mara picked up her coffee again. It was cold now. "We watch the next cycle. If it repeats with the same signature, we check for modulation. If it's natural, it'll drift. If it's artificial..."

  "It stays perfect."

  "Then we decide." Mara looked out the window again, at the infinite dark. "But right now? We're standing in the dark wondering if the noise is a doorbell or a gunshot."

  "And neither answer helps us sleep."

  "No," Mara said. "It doesn't."

  They sat in the hum of the servers, watching the green line pulse. It spiked again, perfectly sharp, perfectly clean. Neither of them moved to log it. Neither of them moved to delete it. They just watched, waiting to see if the universe would blink back.
