prompt: |-
  Construct a thought experiment—realistic, set in a hospital recovery ward, one paragraph, no teleportation or cloning devices—in which a single patient is gradually reconstructed across two possible worlds: in W1 her original brain tissue is fully replaced by biologically distinct synthetic tissue that preserves every psychological trait; in W2 her original brain tissue remains intact but every psychological trait is gradually overwritten by those of a different person. Engineer the case so that Lewisian counterpart theory assigns her a stronger counterpart relation in W1 (due to psychological continuity) while denying she literally exists there, whereas a Kripkean transworld-identity view with brain-origin essentialism identifies her literally with the W2 patient and denies she exists in W1. After the scenario, walk through each theory’s verdict and the reasoning behind it, identify the single feature—psychological versus biological continuity—that does the separating work, and explain what happens to the distinction if both continuities are jointly satisfied in one world and jointly broken in another. Finish by stating how a counterpart theorist attacks the essentialist’s brain-boundary as an arbitrary modal limit, and how the essentialist replies that counterpart relations are too permissive to capture genuine survival.
