answer: |-
  Here is the teaching arc plan designed specifically for an audience of biologists. It prioritizes ontological dependencies over chronological history, aiming to move them from a "layer cake" model (biology base + culture top) to an "institutional stabilization" model.

  ### 1. The Core Dependency: Destabilize the "Base Layer" First
  You are correct: you cannot establish that *gender* is institutionally stabilized if the audience believes *sex* is a pre-institutional, purely descriptive natural kind. If they believe sex is "discovered" and gender is "invented," they will treat gender as secondary/optional.

  **The First Dependency:** You must demonstrate that **biological classification is itself a normative practice.**
  Before discussing gender, you must show that the act of binning bodies into "male" and "female" requires a prior institutional decision about *which biological markers count* (gonads, chromosomes, hormones, genitals) when those markers do not align. This establishes that "sex" is not a raw datum but a **standardized output**.

  ### 2. The Carrying Example: 19th-Century Medical Taxonomy
  **Choice:** Use the **19th-century medical shift from 'hermaphrodite' to 'intersex'/DSD taxonomy.**
  **Reject:** The passport/administrative marker example.

  **Justification:**
  For biologists, the passport example is too easily siloed as "bureaucracy" or "law," which they view as distinct from "science." They will accept that passports are constructed but maintain that chromosomes are not.
  The medical/taxonomic history is superior because it internalizes the critique within *their* domain. It shows that the "two-sex model" was not a discovery of nature but a stabilization of medical authority.
  *   **The Hook:** In the 18th/early 19th century, "hermaphrodites" were often assigned sex based on social utility or dominant phenotype. By the late 19th century, medicine mandated that **gonads** (ovaries/testes) were the "truth" of sex, overriding external appearance.
  *   **The Lesson:** This proves that "biological sex" is not just "there." It required an institutional consensus to decide that *gonads* trump *genitals* or *chromosomes*. That consensus is the "institutional practice" that stabilizes the kind.

  ### 3. The Misconception Map & Intervention Points
  Do not address these all at once. Intervene exactly when the misconception becomes a barrier to the next step.

  | Misconception | When it Hits | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"Biology is still the real base layer."** | **Phase 1 (The Setup).** They will argue chromosomes don't lie. | **Head off immediately** using the Taxonomy Example. Show that "chromosomes = sex" is itself a recent institutional choice (post-1950s). Before that, it was gonads. Before that, it was social role. The *base* keeps moving because the *institutional goal* changes. |
  | **"If it's constructed, then it's fake."** | **Phase 2 (The Mechanism).** Once they accept construction, they assume unreality. | **Head off during the definition of "Institutional Kind."** Use the analogy of **money** or **diagnosis**. A diagnosis of "diabetes" is constructed (criteria are set by committees), but the insulin dependency is materially real. Construction $\neq$ illusion; it means **causally dependent on human agreement.** |
  | **"Then anyone can just choose."** | **Phase 3 (The Stabilization).** They assume construction implies voluntarism. | **Head off when discussing 'Woman' as a kind.** Emphasize **resistance and cost.** You can't just "choose" to be a woman in this framework because the *institutional practices* (pay gaps, medical protocols, legal statutes) constrain the kind. The kind is stabilized by *external enforcement*, not internal feeling. |

  ### 4. The Teaching Arc Sequence

  **Phase 1: The Wedge (Classification is Normative)**
  *   **Goal:** Break the "Sex = Natural Kind" intuition.
  *   **Activity:** Present the 19th-century medical shift. Ask: "Why did medicine decide gonads were the 'truth' over genitals?"
  *   **Takeaway:** The criteria for biological sex are selected to serve institutional goals (reproduction management, inheritance, social order). Sex is already a stabilized category, not a raw fact.

  **Phase 2: The Mechanism (Institutional Kinds)**
  *   **Goal:** Define "Social Construction" without losing materiality.
  *   **Concept:** Introduce **Ian Hacking's "Looping Effects"** or **Sally Haslanger's "Analytical Framework."** Focus on the idea that classifying people changes how they are treated, which changes how they develop.
  *   **Takeaway:** "Constructed" means the category creates the conditions for its own continuity. The category 'woman' organizes labor, medicine, and law, which makes the category materially distinct over time.

  **Phase 3: The Stabilization (Gender as Practice)**
  *   **Goal:** Show how 'Woman' is maintained.
  *   **Concept:** Gender is not a "layer" on sex; it is the **set of practices that makes sex legible.**
  *   **Takeaway:** You are not a "woman" because of XX + culture. You are categorized as "woman" by institutions (medicine, state, market) that align your XX, your culture, and your labor into a coherent track. The "kind" is the track, not the body.

  ### 5. The Final Check: AI Face-Classifiers
  **Verdict:** **Yes, this is an excellent check.**
  **Why:** It bridges their comfort zone (data/patterns) with the philosophical point (labeling is institutional).

  **How to run the check:**
  Ask them to analyze the **training dataset**, not the algorithm.
  *   **Prompt:** "The AI learns to classify gender from photos. Where does the 'ground truth' label (Male/Female) for those photos come from?"
  *   **Correct Understanding:** They must identify that the labels come from **human annotators** or **scraped metadata** (e.g., social media tags).
  *   **The Insight:** The AI is not detecting "biological sex" in the pixels. It is detecting **correlates of institutional gender presentation** (hair, makeup, lighting, context) that were labeled by humans using institutional norms.
  *   **Success Criteria:** If they say "The AI is finding the biological signal," they failed. If they say "The AI is automating the institutional labeling practice," they succeeded. It shows that even "high-tech" biology relies on the prior stabilization of the category.

  ### 6. What to Openly Refuse to Cover
  **Refuse: Judith Butler's Performativity (in full).**
  *   **Reason:** For biologists, "performativity" almost invariably triggers the **"Anyone can just choose"** misconception (voluntarism). They will hear "gender is a performance" as "gender is a costume I put on," which undermines the "institutional stabilization" argument.
  *   **Alternative:** Stick to **Materialist Social Constructionism** (Haslanger, Hacking, Fausto-Sterling). Focus on *constraints, resources, and institutional pathways* rather than *identity, speech acts, or subversion.*
  *   **Also Refuse:** Deep dives into specific chromosomal anomalies (XXY, X0) as the primary argument. Biologists will treat these as statistical noise ("outliers don't break the rule"). Keep the focus on the **criteria of classification**, not the **distribution of traits.**

  ### Summary of Dependencies
  1.  **Classification is normative** (Medical Taxonomy) $\rightarrow$ *Destroys "Biology is Base"*
  2.  **Construction is causal** (Diagnosis/Money analogy) $\rightarrow$ *Destroys "Constructed = Fake"*
  3.  **Stabilization is coercive** (Institutional Tracks) $\rightarrow$ *Destroys "Anyone can Choose"*
  4.  **Verification** (AI Training Data) $\rightarrow$ *Confirms "Labels are Practices"*
