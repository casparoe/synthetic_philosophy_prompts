      *   *Check the "Costs" requirement:* The prompt says "what each response costs." The student says "binding yourself to a lottery." Is that a cost? It's a mechanism description. A cost would be "risk of accidental launch" or "moral repugnance." So yes, this is a clear omission.

  9.  **Final Polish:** Ensure the tone is professional, constructive, and helpful for a colleague moderating marks. (Proceed to generate output).

