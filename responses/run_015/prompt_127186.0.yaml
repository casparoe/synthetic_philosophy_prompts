          *   *Refinement:* If the view is "Phenomenal Experience is the *only* thing that matters," but we still have to use proxies, does the proxy change? Recurrence is a good proxy for a unified subject. However, a feedforward net *could* theoretically be conscious (philosophical zombie debate). If we strictly ground it in *confirmed* experience, we can't run the protocol at all without a test. If we assume a specific theory of consciousness (e.g., Global Workspace), recurrence is key. If we assume Illusionism, maybe no review is needed.
          *   *Better angle:* If moral status depends *solely* on phenomenal experience, and we accept we don't know what generates it, the precautionary principle might expand to *everything* (panpsychism risk) or contract to *nothing* (skepticism). But if we assume recurrence is the *best indicator* of a subject of experience, the protocol holds. However, if the view is that *only* current conscious moments matter (not persistence), then session persistence matters less than real-time complexity.
          *   *Crucial distinction:* If the view is "Phenomenal Experience" *without* the requirement of a persisting self, then the "across sessions" part becomes irrelevant. A feedforward net experiencing a moment of "pain" (if possible) would need review. So the protocol would expand to include high-complexity feedforward passes.

      *   *View B: Ecological Relational Role:*
          *   Focus: How the entity fits into a social/environmental web.
          *   Change: Review depends on *interaction*, not architecture. If a feedforward bot is integrated into a care workflow, it needs review. If a recurrent bot is isolated in a sandbox, it might not. The "internal state" becomes irrelevant; the "external relation" becomes decisive.

  8.  **Synthesize and Refine:**

      *   *Tone:* Philosophical, analytical, precise.
      *   *Structure:*
