  10. **Final Polish:** Ensure terms like "diachronic," "synchronic," "functionalism," "substrate neutrality," and "moral patienthood" are used correctly. (Proceed to generate output based on this thought process).

      *(Self-Correction during drafting)*: Wait, I need to be careful about the "Phenomenal Experience" shift. If the current policy assumes persistence is *necessary* for interests, shifting to "Phenomenal Experience" might actually *broaden* the scope to include feedforward (if they can feel) or *narrow* it (if we demand proof of feeling). The prompt asks what the protocol would have to *change*. If the ground is *solely* phenomenal experience, the *architectural* constraint (recurrence) is only valid insofar as it predicts experience. If feedforward can have experience, the exemption must go. If persistence isn't required for experience, the "across sessions" rule must go.

      *Refining the Biological Substrate point:* A biological-substrate theorist could argue that recurrent silicon is *more likely* to mimic the causal powers of biology than feedforward, so it's a risk assessment. But strictly, if biology is necessary, the review is pointless. I will argue it is *inconsistent* with strict biological theory unless treated as a purely pragmatic (not ontological) firewall.

