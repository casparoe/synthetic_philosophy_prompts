          *   *Database:* Is a sleeping brain a database? No, it's metabolically active. The database is inert. The policy aligns with "life as process."
          *   *Phenomenal Experience:* If status grounds *solely* in experience, does persistence matter? If I suffer for a second, I matter. So feedforward *should* be included if it can suffer. The current policy excludes it. Therefore, the current policy assumes *persistence* is necessary for interests (you need a future to have an interest in not suffering). This is a key insight: Interests require time.

  9.  **Drafting the Response:** (Mental Outline)
      *   *Intro:* The policy privileges *temporal depth* over *behavioral breadth*.
      *   *Commitments:* Functionalist, Diachronic, Process-oriented.
      *   *Substrate:* Incompatible with strict biological chauvinism unless as pure heuristic.
