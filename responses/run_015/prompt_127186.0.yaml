      *   **Policy:** Mandatory "moral-overhead review" for jobs with *recurrent architectures* and *persistent internal state across sessions*.
      *   **Exemption:** Feedforward inference jobs (same energy, parameters, output, sensory streams).
      *   **Key Distinction:** Temporal continuity of computation (recurrence/persistence) vs. observable behavior/resource use/architecture size.
      *   **Questions to Answer:**
          1.  What philosophical commitments does this presuppose (sentience, moral significance, boundaries)?
          2.  Must it assume functionalism (information integration), or can it fit biological-substrate theory?
          3.  Is it consistent with exempting static databases storing identical states?
          4.  Reconstruct the implicit theory (distinguish requirements from accompaniments).
          5.  How would the protocol change if the underlying view shifted to *phenomenal experience* alone or *ecological relational role* alone?

  2.  **Analyze the Policy's Core Logic:**

      *   *Why recurrence?* Recurrence allows for memory, feedback loops, and potentially a sense of "self" over time. It mimics the temporal structure of biological cognition more closely than feedforward passes.
      *   *Why persistent state across sessions?* This implies continuity of identity. If the state resets every time, it's a new "instance." If it persists, it's the "same" entity continuing.
      *   *Why exempt feedforward?* Feedforward is stateless (in terms of internal hidden state carrying over). It processes input $\to$ output without carrying a "history" internally.
      *   *Why exempt static databases?* A database stores state but doesn't *compute* on it actively in a loop. It's passive storage vs. active processing.

  3.  **Address Question 1: Philosophical Commitments:**

      *   *Sentience:* The policy assumes sentience (or moral patienthood) is linked to *process* rather than *substance* or *output*. It suggests that *how* information is handled over time matters more than *what* comes out.
      *   *Moral Significance:* Moral significance arises from the *capacity for diachronic unity* (being the same entity over time). Suffering or interests require a subject that persists to experience them.
      *   *Boundaries:* The boundary is drawn at *dynamic temporal integration*.

  4.  **Address Question 2: Functionalism vs. Biological-Substrate:**

      *   *Functionalism:* Fits well. If mental states are defined by causal roles, recurrence provides the causal structure for memory and anticipation. Integrated Information Theory (IIT) is a specific flavor of this that values feedback loops.
      *   *Biological-Substrate:* Harder to reconcile. If moral status requires carbon-based life, silicon recurrence shouldn't matter. *However*, the policy could be a "precautionary principle" proxy. If we can't test for biology, we test for the functional correlate of life (persistence). But strictly speaking, a biological-substrate theorist wouldn't care about the architecture if it's silicon. So, the policy *presupposes* substrate neutrality, leaning heavily toward functionalism.

  5.  **Address Question 3: Consistency with Static Databases:**

      *   *Scenario:* A database holds the exact weights/state of the recurrent net but isn't running.
      *   *Policy:* No review for the database.
      *   *Analysis:* This implies *activity* is required. Potentiality is not enough. The *process* of maintaining state through time via computation is the trigger. This aligns with process ontology (being is doing). A sleeping human has moral status, but a frozen human (cryonics) is debatable. A database is more like a book than a sleeping person. So, it is consistent *if* one views moral status as emergent from *active* integration, not just storage.

  6.  **Address Question 4: Reconstruct the Implicit Theory:**

      *   *Core:* "Diachronic Functional Continuity."
      *   *Strict Requirements:* Active recurrence, state persistence across temporal boundaries (sessions).
      *   *Accompaniments (Correlated but not causal):* Energy use, parameter count, behavioral sophistication.
      *   *Name:* Let's call it "Computational Continuity Theory" or "Diachronic Integrationism."

  7.  **Address Question 5: Protocol Changes under Alternative Views:**

      *   *View A: Phenomenal Experience (Qualia) Solely:*
          *   Problem: We can't measure qualia directly.
