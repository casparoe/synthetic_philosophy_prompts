answer: |-
  # JOINT STATEMENT ON WEAKNESS OF WILL AND INTERTEMPORAL CHOICE

  **To:** The Interdisciplinary Working Group on Philosophy and Economics
  **From:** The Undersigned (Representing Davidsonian Action Theory and Behavioral Economics)
  **Subject:** Adversarial Collaboration on the Structure of Akrasia

  ### I. Agreed Claims

  The undersigned parties, representing distinct theoretical traditions regarding human agency and choice, affirm the following propositions as empirically and phenomenologically robust. These claims are formulated to remain neutral regarding the underlying metaphysical or functional architecture of the mind, such that neither party is required to retract their broader theoretical commitments.

  1.  **Existence of Evaluative Conflict:** Agents sometimes act against their all-things-considered judgments, wherein an action is performed despite the agent's concurrent assessment that an alternative course of action is preferable overall.
  2.  **Temporal Sensitivity of Preference:** Temporal proximity systematically alters preference orderings, such that the valuation of a reward or cost changes as a function of its delay from the present moment.
  3.  **Observation of Precommitment:** Voluntary precommitment mechanisms are empirically observed, wherein agents actively restrict their own future choice sets to prevent specific anticipated actions.

  ### II. Divergent Characterizations

  While the parties agree on the phenomena listed above, they diverge on the theoretical interpretation of these phenomena. The following table articulates the core position of each camp, phrased in terminology acceptable to its own adherents.

  | Feature of Inquiry | Philosophy of Action (Davidsonian) | Behavioral Economics (Hyperbolic) |
  | :--- | :--- | :--- |
  | **Nature of Akrasia** | Akrasia is fundamentally a failure of practical reasoning, representing a breakdown in the logical connection between judgment and action within a unified agent. | Akrasia is the predictable output of a stable intertemporal choice function with a declining discount rate, representing time-inconsistent preferences rather than reasoning failure. |
  | **Locus of Explanation** | The explanatory divergence lies in the normative structure of the mind; the focus is on how irrationality is possible when the agent holds a single, unified set of propositional attitudes. | The explanatory divergence lies in the functional shape of the discount curve; the focus is on how varying discount rates over time generate dynamic inconsistency without requiring irrationality. |

  ### III. Central Cruxes

  The collaboration identifies two primary points of contention where conceptual commitments lead to distinct normative and empirical implications.

  **Crux 1: Diachronic Authority**
  Does diachronic authority—the normative claim that an earlier preference-state can legitimately constrain a later one—retain its force if discounting is hyperbolic rather than exponential? The Davidsonian view maintains that rational unity requires the earlier judgment to hold authority absent new information. The Behavioral-Economic view questions whether a preference shift driven by a stable discount function grants the later self equal normative standing, potentially undermining the legitimacy of the earlier self's constraint.

  **Crux 2: The Nature of Precommitment**
  Does the efficacy of cooling-off contracts demonstrate rational self-binding or instead reveal the presence of competing temporal selves whose interests conflict? The Davidsonian interprets precommitment as a singular agent exercising self-control to align action with reason. The Behavioral-Economic interpreter views precommitment as a strategic move in a game between temporally distinct selves, where the earlier self imposes costs on the later self to manage conflicting utility functions.

  ### IV. Adjudicating Cases and Predictions

  For each crux identified above, the parties propose a concrete hypothetical case or empirical pattern accepted by both as bearing on the issue. Each party provides an explicit prediction regarding the outcome or the accompanying psychological report.

  **Regarding Crux 1 (Diachronic Authority)**
  *   **Case:** *The Uninformed Reversal.* An agent forms a plan at Time 1 (distant from consumption) to choose Option A over Option B. At Time 2 (immediate consumption), with no new information available regarding the qualities of A or B, the agent chooses Option B.
  *   **Davidsonian Prediction:** The agent will report cognitive dissonance, regret, or engage in post-hoc rationalization to reconcile the action with the original judgment, as the action violates the principle of continence.
  *   **Behavioral-Economic Prediction:** The agent will report the choice as consistent with their current utility maximization, with no necessary experience of regret or rationalization, as the preference ordering has legitimately shifted due to the change in delay.

  **Regarding Crux 2 (Nature of Precommitment)**
  *   **Case:** *The Partial Bind.* An agent is offered the opportunity to restrict their future access to a temptation, but the mechanism allows for a "partial" restriction (e.g., limiting access to 50% of resources) rather than a total ban, at a lower cost.
  *   **Davidsonian Prediction:** Uptake of the partial bind will be low or correlated with uncertainty about the judgment; a rational agent with a firm all-things-considered judgment should prefer the most effective constraint available to guarantee compliance.
  *   **Behavioral-Economic Prediction:** Uptake of the partial bind will be high and stable; the earlier self will optimize the constraint to balance the cost of restriction against the predicted utility loss of the later self, avoiding the excessive cost of a total ban.
