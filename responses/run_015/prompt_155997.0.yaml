answer: |-
  # SEMINAR HANDOUT: UPDATING ON UNCERTAIN EVIDENCE
  **Decision Tree Instrument**

  **Instructions:** Answer the following questions based on your intuitions about the cases provided. Do not worry about technical names (e.g., "Jeffrey Conditioning"); answer based on what you think rational agents *should* do. Follow the branches to find your theoretical position.

  ---

  ### THE TREE

  **Q1. The Certainty Check**
  In the "Cloth by Candlelight" case, is there *any* proposition you become 100% certain of (e.g., "I am having a greenish visual experience"), even if you aren't certain about the cloth itself?
  *   **YES** → Go to **Leaf A**.
  *   **NO** → Go to **Q2**.

  **Q2. The Input Format**
  In the "Half-Heard Message" case, does the evidence tell you *what your new credences should be* for the possibilities (e.g., "Set Green to 0.7"), or does it tell you *how likely the experience was* given the possibilities (e.g., "This experience is twice as likely if Green")?
  *   **How Likely (Likelihoods)** → Go to **Leaf B**.
  *   **What New Credences (Partition Shift)** → Go to **Q3**.

  **Q3. The Partition Problem (Case 1)**
  When the experience sets new credences, does it fix the probabilities for the fine partition ({green, blue, violet}) or the coarse partition ({green, not-green})? If the math gives different answers, is the input simply indeterminate?
  *   **Yes, Indeterminate** → Go to **Leaf C**.
  *   **No, One is Correct** → Go to **Q4**.

  **Q4. Supposition vs. Learning (Case 6)**
  Should the same mathematical rule handle "I looked and it seemed greenish" (learning) and "Suppose for the sake of argument it is greenish" (hypothetical)?
  *   **NO, Distinct Processes** → Go to **Leaf D**.
  *   **YES, Unified Rule** → Go to **Q5**.

  **Q5. Meta-Evidence (Case 4)**
  Does your updating rule apply when the evidence is about your *own future credence* (e.g., a neurologist predicts you will be 0.7 confident), rather than about the cloth?
  *   **NO, World-States Only** → Go to **Q6**.
  *   **YES, Meta-Capable** → Go to **Q5b**.

  **Q5b. The Meta-Constraint**
  If the evidence is about your future credence, do you still require the input to be defined over a partition of *world-states* (like cloth colors)?
  *   **YES** → Go to **Leaf E (Empty)**.
  *   **NO** → Go to **Leaf F**.

  **Q6. Conceptual Change (Case 5)**
  Does the rule apply when the subject has *no antecedent concept* for the experience (e.g., a new color via neural implant), meaning there is no prior cell in the partition to update?
  *   **NO, Framework Boundary** → Go to **Q7**.
  *   **YES, Radical Update** → Go to **Leaf G**.

  **Q7. Commutativity (Case 3)**
  If you receive two shifts back-to-back (Color then Fabric vs. Fabric then Color) and land in different places, is this path-dependence a fatal flaw?
  *   **YES, Must be Order-Independent** → Go to **Q8**.
  *   **NO, Path-Dependence Acceptable** → Go to **Leaf H**.

  **Q8. The Justification**
  For the standard case (fixed partition, order-independent), is the rule justified because it *preserves conditional probabilities* (Rigidity) or because it *minimizes information change* (Closest Function)?
  *   **Preserve Conditionals** → Go to **Leaf I**.
  *   **Minimize Information** → Go to **Leaf J**.

  ---

  ### THE LEAVES (POSITIONS)

  **Leaf A: Certainty-of-Experience (Plain Conditionalization)**
  *View:* Uncertain evidence is an illusion. There is always a certain proposition about your sensory state. You conditionalize on that.
  *Handles:* Case 1 (by shifting partition to experiences), Case 6 (often distinct).
  *Limit:* Struggles with Case 4 (Meta) and Case 5 (Concepts).

  **Leaf B: Likelihood-Based Updating**
  *View:* The input is not a new probability distribution, but a likelihood function (probability of evidence given state). You update via Bayes' rule using these likelihoods.
  *Handles:* Case 2 (Signal correlation) naturally.
  *Limit:* Requires modeling the "experience" as an event with known likelihoods.

  **Leaf C: Skeptical / Underdetermination**
  *View:* The phenomenology of uncertain experience does not fix a unique partition. The input underdetermines the output; rationality does not demand a specific update here.
  *Handles:* Case 1 (Partition problem) by dissolving it.
  *Limit:* Highly permissive; risks making updating arbitrary.

  **Leaf D: Distinct Rules (Case 6 Handler)**
  *View:* Learning and Supposition are fundamentally different attitudes. One changes your actual credence, the other explores a hypothetical space. They require different operators.
  *Handles:* Case 6 explicitly.
  *Limit:* Theoretical disunity; loses elegance of a single update logic.

  **Leaf E: [EMPTY LEAF] Meta-Rigidity**
  *View:* Applies updating to meta-evidence (Case 4) but insists on a world-state partition.
  *Diagnosis:* **Unoccupied/Incoherent.** Meta-evidence constrains credences directly, not via world-state partitions. Insisting on a cloth-partition for a neurologist's report is a category error.

  **Leaf F: Generalized Reflection Rule**
  *View:* Updating rules should govern shifts in credence regardless of the source, including evidence about future selves.
  *Handles:* Case 4 (Calibration).
  *Limit:* Requires a framework more general than standard probability spaces (e.g., higher-order probabilities).

  **Leaf G: Conceptual Expansion Rule**
  *View:* Updating can create new partition cells. The algebra of propositions is not fixed.
  *Handles:* Case 5 (Implant).
  *Limit:* Technically demanding; moves beyond standard Kolmogorov frameworks.

  **Leaf H: Path-Dependence Accepter**
  *View:* Order matters. The sequence of evidence changes the context of interpretation. Commutativity is not a requirement for rational updating.
  *Handles:* Case 3 (Two shifts).
  *Limit:* Makes long-term planning of belief revision difficult; context-sensitive.

  **Leaf I: Jeffrey Conditioning (Rigidity)**
  *View:* The core constraint is "Rigidity": conditional probabilities of hypotheses given the partition cells remain fixed.
  *Handles:* Standard uncertain evidence cases.
  *Limit:* Fails Case 4, 5; sensitive to partition choice (Case 1).

  **Leaf J: Minimum Information (Cross-Entropy)**
  *View:* The core constraint is to minimize the "distance" (Kullback-Leibler divergence) between prior and posterior subject to the new constraints.
  *Handles:* Standard uncertain evidence cases.
  *Limit:* Mathematically equivalent to Leaf I on standard inputs (see note below).

  ---

  ### INSTRUCTOR NOTES & ANALYSIS

  **1. The Collapse Warning (Leaves I & J)**
  Your student is correct to be suspicious. **Leaf I (Jeffrey/Rigidity)** and **Leaf J (Minimum Information)** are extensionally equivalent on the standard input (a fixed partition with new probabilities). Minimizing cross-entropy subject to the constraint that the new partition probabilities match the input *yields* the Jeffrey conditionalization formula.
  *   **Do they collapse?** Yes, in terms of output.
  *   **Are they the same position?** Normatively, no. Leaf I justifies the rule via *invariance* (the experience doesn't change the relevance of the color to the fiber). Leaf J justifies it via *conservatism* (change your mind as little as possible). Keep them as separate leaves to sort students by *justification*, but warn them that they will not be able to distinguish these views using Case 1–3 alone.

  **2. Unoccupied Combinations**
  *   **Leaf E (Meta-Rigidity)** is the designated empty leaf. It represents a category mistake: trying to force meta-cognitive evidence into a first-order world partition.
  *   **Another Gap:** You will likely find no one who answers **YES** to Q1 (Certainty of Experience) but then proceeds to Q3 (Partition Problem). If you are certain of your experience (Q1), you conditionalize on that certainty; the indeterminacy of the cloth partition (Q3) becomes irrelevant. If a student takes this path, they are likely conflating "certainty of appearance" with "certainty of reality."

  **3. Predicting Inconsistencies (Live Seminar)**
  Watch for tension between **Q1** and **Q3**.
  *   *The Trap:* Students often want to say "Yes, I'm certain I *saw* green" (Q1=YES) but also worry that "Green vs. Not-Green" is the wrong partition for the cloth (Q3).
  *   *The Diagnosis:* If Q1=YES, they should be at Leaf A. If they continue to Q3, they are treating the "certain experience" as uncertain evidence about the world. Point this out to force a choice between foundationalism (Leaf A) and coherentism (Leaf I/J).

  Watch for tension between **Q7** (Commutativity) and **Q8** (Justification).
  *   *The Trap:* Students often demand Commutativity (Q7=YES) because "order shouldn't matter," but then choose Minimum Information (Leaf J). While Min-Info *can* be commutative, it is not guaranteed to be so across different partitions unless specific independence conditions hold. If they demand strict commutativity as a rational requirement, they may need to restrict the applicability of their rule more than they expect.

  **4. Case Coverage Summary**
  *   **Case 1 (Partition):** Addressed at Q3 (Leaf C vs. I/J).
  *   **Case 2 (Signal):** Addressed at Q2 (Leaf B).
  *   **Case 3 (Order):** Addressed at Q7 (Leaf H vs. I/J).
  *   **Case 4 (Meta):** Addressed at Q5/Q5b (Leaf F vs. E).
  *   **Case 5 (Concepts):** Addressed at Q6 (Leaf G).
  *   **Case 6 (Supposition):** Addressed at Q4 (Leaf D).
