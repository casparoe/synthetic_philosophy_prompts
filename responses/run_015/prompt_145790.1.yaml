      A symmetry-breaking parameterisation approach selects a 'natural' variable (e.g., linear distance) to break indifference. While it ensures normalisability, it risks arbitrariness, failing the re-parameterisation constraint unless the 'naturalness' is objectively grounded.

      In sum, no approach satisfies all desiderata perfectly; trade-offs between logical purity and physical grounding remain inevitable.

