      An adequate theory of the Principle of Indifference (PoI) for continuous spaces must satisfy three classes of desiderata.

      First, it must dissolve paradoxical configurations where naive uniformity yields contradictory probabilities. Specifically, Bertrand's chord problem: selecting chords by random endpoints yields probability 1/3 for length exceeding $\sqrt{3}r$; by random radial distance, 1/2; by random midpoint, 1/4. Similarly, point selection within an area versus sector division creates ambiguity regarding whether 'uniform' applies to linear distance or area measure. The motivating consideration is logical consistency: identical propositions cannot bear distinct probabilities given identical evidence.

