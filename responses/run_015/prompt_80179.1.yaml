  2.  **Deconstruct Hacking's Looping Effect:**
      *   Core idea: Classifying people changes how they see themselves and act, which changes the classification, which changes the action, etc.
      *   Distinction from self-fulfilling prophecy: In SFP, the label predicts behavior accurately eventually. In looping, the label *changes* because the behavior changes in response to the label, making the original label inadequate. The target moves.
      *   Key element: Interaction between the classified (people) and the classifiers (experts/institutions).
      *   Key element: Instability of the kind itself.

  3.  **Designing the Activity:**
      *   *Fictional Category:* Needs to be behavioral but vague enough to shift. Let's call it "Resonance Sensitivity" or "Echo Drift." Let's go with "Vector Drift." It sounds technical but meaningless enough to be shaped.
      *   *Roles:*
          *   Subjects (most students): They try to exhibit the trait.
          *   Classifiers (rotating committee): They define and redefine the trait.
          *   Observer/Recorder (optional, maybe the instructor): Tracks changes.
      *   *Mechanism:*
          *   Round 1: Classifier defines "Vector Drift." Subjects try to match it.
          *   Observation: Classifiers see how Subjects match it.
          *   Revision: Classifiers *must* update the definition based on the match, even if it was perfect.
          *   Round 2: Subjects try to match the new definition.
          *   Payoff: Points for Subjects matching the definition. Points for Classifiers for "precision" (but precision is impossible because the target moves).
      *   *The Twist:* The rule must force revision even on success. This creates the instability. If Subjects match perfectly, Classifiers must say "Ah, but now that you match it, it means something else," shifting the goalpost not arbitrarily, but *because* of the matching.
