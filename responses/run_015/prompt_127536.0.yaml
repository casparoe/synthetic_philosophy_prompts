answer: |-
  Here is a disambiguation of the slogan and an analysis of how the ruin floor alters the optimization problem.

  ### Part 1: Disambiguating "Kelly Maximizes Long-Run Growth"

  The slogan is a compression of several distinct mathematical claims. Your group members are treating them as a single monolith, but they differ in horizon, metric, and normative force. Below is a menu of the precise theses the slogan might be expressing.

  | # | Quantity Maximized | Class of Rivals | Horizon & Sense of "Beats" | Truth Status | Depth | Does it license "Irrational"? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Expected Log Wealth** ($E[\ln W_T]$) | Any other strategy (fixed or dynamic) | **Finite $T$**. Kelly yields higher expected utility *if* $U(W)=\ln W$. | **True** (by definition) | **Platitude**. This is simply the definition of the Kelly criterion as the solution to Log-Utility maximization. | **No.** It only proves non-Kelly is suboptimal *for a Log-Utility agent*. If you have $U(W) = W^{1-\gamma}/(1-\gamma)$ with $\gamma \neq 1$, non-Kelly is rational. |
  | **2** | **Almost-Sure Asymptotic Growth Rate** ($\lim_{T\to\infty} \frac{1}{T} \ln W_T$) | Any "essentially different" strategy (e.g., fixed fraction $\neq f^*$) | **Infinite $T$**. Kelly grows faster with Probability 1. (Breiman, 1961) | **True** | **Substantive**. Requires the Law of Large Numbers and properties of random walks. | **Weakly.** It shows non-Kelly strategies will eventually be dwarfed *almost surely*. However, "eventually" may exceed human lifespan, and the path may involve unacceptable drawdowns before dominance kicks in. |
  | **3** | **Median Wealth** at Horizon $T$ | Fixed-fraction strategies | **Large Finite $T$**. Since wealth is log-normally distributed, maximizing expected log wealth maximizes the median. | **Approx. True** | **Derivative**. Follows from Thesis 1 + distribution properties. | **No.** Maximizing the median ignores the left tail. A strategy with a slightly lower median but a fatter right tail (or safer left tail) may be preferred. |
  | **4** | **Probability of Beating a Rival** ($P(W_T^K > W_T^R)$) | Any fixed-fraction rival $R \neq K$ | **Large $T$**. $P(\text{Kelly} > \text{Rival}) \to 1$. | **True** | **Substantive**. | **No.** You can win the race but have less wealth than a rival who took less risk and got lucky, or vice versa. It does not account for *how much* you win or lose by. |
  | **5** | **Time to Reach a Goal** ($E[\tau : W_\tau \ge G]$) | Fixed-fraction strategies | **Stopping Time**. Kelly minimizes expected time to reach a high target $G$. | **True** (Asymptotically) | **Substantive**. | **No.** This ignores the probability of *never* reaching the goal (ruin). If ruin is possible, minimizing time to goal is ill-posed without a ruin constraint. |

  **Verdict on "Irrationality":**
  None of these theses license the claim that staking less than Kelly is "irrational" in the broad sense. They only license the claim that it is **suboptimal for a specific objective function** (asymptotic growth or Log Utility).
  *   **The "Volatility Tax" Argument:** This phrasing assumes the only cost is reduced growth. It ignores the "Ruin Tax." If an agent's utility function penalizes variance or large drawdowns (e.g., they consume from the bankroll, or have psychological loss aversion), a smaller fraction is the *rational* choice for *their* utility function.
  *   **Normative Leap:** Moving from "Kelly maximizes $X$" to "Non-Kelly is irrational" requires the hidden premise that "Maximizing $X$ is the only rational goal." That is a philosophical claim, not a mathematical one.

  ---

  ### Part 2: The 10% Floor Interaction

  The introduction of a hard floor at 10% of starting wealth ($W_{\text{floor}} = 0.1 W_0$) fundamentally breaks the standard Kelly derivation assumptions. The standard derivation assumes an infinite horizon with no absorbing barrier (or a barrier at 0 which is never reached with fractional betting).

  Here is how the floor interacts with the optimization:

  #### 1. Does it leave the optimal constant fraction unchanged?
  **No.** The standard 20% fraction is no longer optimal if "optimal" implies maximizing expected log-wealth *given the floor constraint*.
  *   **The Problem:** Under standard Kelly ($f=0.2$), the log-wealth performs a random walk with positive drift. However, it has non-zero variance. Over a sufficiently long horizon, the probability of a drawdown exceeding 90% (hitting the floor) approaches 1.
  *   **The Consequence:** If hitting the floor results in a payoff of 0, then $\ln(W_{\text{final}}) = -\infty$. If there is *any* non-zero probability of ruin, the Expected Log Wealth is $-\infty$.
  *   **Adjustment:** To maximize expected log-wealth in the presence of a hard ruin barrier, you must reduce the fraction $f$ sufficiently such that the probability of hitting the barrier over your relevant horizon is negligible (or zero). This implies **$f < 20\%$**. The "volatility tax" of under-betting is now a premium paid for survival insurance.

  #### 2. Does it make the optimal stake state-dependent?
  **Yes.** The optimal strategy is no longer a constant fraction of current wealth (Constant Proportion Portfolio Insurance). It becomes a function of the distance to the floor.
  *   **Reasoning:** The risk of ruin is not constant. If your wealth is $100\%$ of start, you are far from the 10% floor. If your wealth drops to $15\%$ of start, you are perilously close. A constant fraction bet (e.g., 20% of current wealth) maintains constant *local* volatility, but as you approach the barrier, the *probability of absorption* spikes.
  *   **Optimal Control:** To maintain a constant probability of survival (or to maximize growth subject to a survival constraint), the bet size must shrink as wealth approaches the floor. This is akin to a **CPPI (Constant Proportion Portfolio Insurance)** strategy where the "floor" is explicit.

  #### 3. Direction of adjustment near the floor?
  **The stake must decrease as you approach the floor.**
  *   **Mechanism:** Let $D_t = \ln(W_t) - \ln(W_{\text{floor}})$ be the log-distance to ruin.
      *   At $W_0$, $D_0 = \ln(1) - \ln(0.1) \approx 2.3$.
      *   If $W_t$ drops, $D_t$ shrinks.
      *   To prevent $D_t$ from hitting 0 (ruin), you must reduce the variance of the next step. Since variance scales with $f^2$, you must reduce $f$.
  *   **Intuition:** When you are close to the floor, you have "less to lose" in absolute terms but "more to lose" in terms of game termination. The marginal utility of survival skyrockets. A rational agent maximizes the product of (Growth Rate $\times$ Probability of Survival). Near the floor, Probability of Survival becomes the dominant term, forcing $f \to 0$ as $W_t \to W_{\text{floor}}$.

  ### Summary for Your Reading Group

  You can present this distinction to your group:

  1.  **Without the floor:** The claim "Non-Kelly is irrational" is a category error. It confuses "suboptimal for asymptotic growth" with "irrational for a general agent." Under-betting is rational for anyone with $\gamma > 1$ (more risk-averse than Log Utility).
  2.  **With the floor:** The claim "20% is optimal" is **mathematically false**. The hard barrier introduces an absorbing state that standard Kelly ignores.
      *   A constant 20% stake carries a non-trivial risk of hitting the 10% barrier over a long horizon.
      *   Because the payoff at the barrier is 0 (utility $-\infty$), the strict Expected Log-Utility maximizer must reduce bet sizes to ensure survival.
      *   The truly optimal strategy is **state-dependent**: bet less as you get closer to the 10% line.
      *   Therefore, those wanting a smaller fraction are not "paying a volatility tax for nothing"; they are **pricing a ruin option** that the full-Kelly proponents are ignoring.

  The floor converts the problem from "Maximize Growth" to "Maximize Growth Subject to Survival." In that problem, Full Kelly is rarely the solution.
