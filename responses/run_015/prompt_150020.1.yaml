  5.  **Drafting - Scene by Scene:**

      *   *Scene 1: The Coffee.* Elias watching steam. The steam doesn't rise; it jumps. He knows the truth.
      *   *Scene 2: Leo.* Leo comes over. Shows off the "blink." He froze while a bus passed. He stole a candy bar using the extra tick. It's casual, like cheating at a video game.
      *   *Scene 3: The Lab/Study.* Elias looks at his old notes. Neural stitching. The brain fills the gap. But if the gap is real...
      *   *Scene 4: The Realization.* If I choose to lift my cup, that choice exists *between* frames. But there is no between. So the choice is just another static state. Why am I responsible for State B following State A?
      *   *Scene 5: The Confrontation.* Leo asks for help hiding a bigger theft. Elias refuses, not because it's wrong, but because "wrong" doesn't exist. But then he corrects himself. It feels wrong.
      *   *Scene 6: Ending.* Elias drinks his coffee. The steam jumps. He chooses to drink it anyway.

  6.  **Refining the Tone:**
      *   Avoid jargon like "quantum discrete time." Use slang. "The Tick," "Static," "Skipping."
