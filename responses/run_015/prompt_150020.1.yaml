answer: |-
  The fly hung in the air above my coffee cup. Not hovered—hung. Like it was glued to the invisible glass of the universe. Then, *snap*, it was three inches to the left.

  I didn't blink. I haven't blinked on purpose in twenty years. Not since I retired from the institute. Back then, we called it "neural interpolation." We thought it was a bug in the brain, a way our wetware smoothed over the jittery reality to keep us from going mad. Turns out, the jitter isn't in the head. It's in the world.

  Time doesn't flow. It stacks. Like a deck of cards being flipped through too fast to see the individual images.

  My grandson, Leo, kicked the front door open. The sound didn't swell; it hit maximum volume instantly, then cut to silence. He was holding a bag of groceries that looked too heavy for him.

  "Hey, Pop," he said. He looked tired. The kind of tired that comes from skipping too many beats.

  "You skip again?" I asked, pointing at the bag.

  Leo grinned, dropping the stuff on the counter. A carton of milk rolled off and didn't spill until it hit the floor. "Just one tick. Store camera didn't even see me cross the threshold. One moment I'm outside, next moment I'm at the register, bag in hand."

  "That's theft, Leo."

  "It's efficiency," he corrected, popping a grape into his mouth. "Nobody gets hurt. The universe rests every tick anyway. Why shouldn't I?"

  He walked into the living room and turned on the TV. The screen flickered. Everyone knows the flicker. It's the refresh rate of existence.

  I stayed in the kitchen, staring at the milk stain. I used to measure the intervals between neural firings. I thought I was studying how cells communicated. Now I know I was studying how the illusion of continuity was generated. We are all arrows in flight, Leo. But if you stop the clock, the arrow is just sitting there. Occupying space. Doing nothing.

  If the arrow is at rest in every single instant, when does it actually move?

  "Leo," I called out. "Come here."

  He shuffled back, chewing. "What?"

  "Give me your hand."

  He did. I held his wrist. I could feel the pulse. *Thump.* Pause. *Thump.* Pause. The blood doesn't flow; it teleports from the heart to the wrist.

  "If I let go of your hand," I said, "and in the next frame your hand is somewhere else... who moved it?"

  "Me, Pop. I decided to move it."

  "Did you?" I let go. "Think about the decision. The decision to move happens in time. But time is just a series of static pictures. In picture A, your hand is here, and your mind is 'still.' In picture B, your hand is there, and your mind is 'moved.' Where is the moment you chose to change?"

  Leo pulled his hand away. "You're doing the old man thing again. The philosophy dump."

  "I'm asking where the cause is. If there's no time between frame A and frame B, there's no room for causality. There's just... sequence. One thing after another, with no glue holding them together."

  "So?"

  "So if there's no glue, there's no *you* connecting the choice to the action. You're just a series of statues. One statue holding a grape. The next statue chewing it. The statue in between doesn't exist."

  Leo rolled his eyes. "I stole the milk, Pop. I'm responsible. I know that."

  "Do you? Or is 'responsibility' just a story we tell ourselves to make the sequence feel like a narrative?"

  I walked past him to the window. Outside, traffic was jerking along. Cars teleporting down the boulevard. Pedestrians freezing mid-stride then snapping forward. I'd heard about the kids downtown who were hacking the rate. They called it "ghosting." They'd freeze themselves for a tick to dodge a punch, or slip through a closing subway door. Some were using it to skip tax audits—just vanish from the room during the questioning tick.

  It was getting messy. Accidents where people ghosted and reappeared inside solid objects. Crimes where the perpetrator literally wasn't there when the act happened.

  "I need you to stop ghosting," I said.

  "Can't. Rent's due."

  "Leo, listen to me. I spent my life looking at the gaps. If reality is discrete, if we are truly at rest in every moment... then moral weight requires continuity. You can't blame a statue for the position of the next statue."

  "That's convenient," Leo scoffed. "So I can steal whatever I want because I'm not real?"

  "No. It means *nothing* is real. Not the theft. Not the punishment. Not the guilt." I turned to face him. "If I choose to forgive you, that choice is just another static frame. It doesn't come from me. It just appears. So why bother forgiving? Why bother being angry?"

  Leo looked at me, really looked at me, for the first time in months. The arrogance slipped. He looked young. Scared.

  "Then what's the point?" he asked quietly. "If it's all just a flipbook..."

  "Because the illusion feels like pain," I said. "When you drop the milk, the floor gets sticky. When you steal, the store owner loses money. The frames might be disconnected, but the pattern holds. The story persists."

  I walked back to the counter and picked up a rag. I started wiping the milk. Up, down. Jerky motions. My hand was still in one place, then another. I was never actually wiping. I was just appearing next to clean spots.

  "I can't stop you from skipping ticks, Leo. The physics of it... it's just how the world works. But you have to understand. You're hacking the frame rate, but you're not hacking the consequence. The next frame always loads."

  Leo watched me clean. "Even if I didn't cause it?"

  "Especially then," I said. "If you're just a passenger in a sequence of static states, then being a good passenger is the only control you have. You can't steer the car, but you can decide what kind of passenger you look like in the photos."

  Leo sighed. He reached into his pocket and pulled out a credit chip. "I'll pay for the milk tomorrow. First tick."

  "Okay."

  "And Pop?"

  "Yeah?"

  "I won't ghost the rent."

  He walked out. I stood there with the rag. I looked at the clean spot on the counter. In this frame, it's clean. In the next frame, it might be dirty again. There is no guarantee the cleaning persists. There is no guarantee *I* persist.

  I lifted my coffee cup. The steam jumped upward in discrete lines. I brought the cup to my lips. I didn't know if I was choosing to drink, or if the universe was just loading a state where the coffee was gone.

  I took a sip. It was hot. It tasted bitter.

  It didn't matter if the motion was real. The warmth was enough. I set the cup down, careful to leave it in a place that would make sense for the next frame to find it.
