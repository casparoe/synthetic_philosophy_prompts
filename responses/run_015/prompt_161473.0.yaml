      *   **Core Argument:** Money is a social role. Its existence depends on an audit relation to real activity (tracking). Failure modes: over-issuing (inflation) vs. mis-tracking (loss of legitimacy without inflation). The mutual-credit dispute illustrates mis-tracking.
      *   **Audience:** 25 people. Key players: 2 MMT economists (chartalism/taxes), 1 Hard-money/Free-banking blogger (real bills/metal), 1 Historian of 18th-century thought (Berkeley expert), 2 Socio-legal scholars (payment infrastructures), 1 Political Theorist (organizer), Grad students.
      *   **Format:** 30 min talk + 40 min Q&A. Needs a prep sheet for objections.
      *   **Specific Requests:**
          *   Objections tagged by persona (MMT, Hard-money, Historian, etc.).
          *   Concede/Hold/Reply/Soft Spot structure.
          *   Address two specific uncertainties: (1) Constitutive vs. Normative (money vs. *good* money), (2) Berkeley's reliance on virtuous issuers.
