answer: |-
  Here's the scenario: The City Water Board faces a critical leak and chooses Plan A: a rushed repair using a cheap industrial solvent that subtly alters the hormonal cycles of the maintenance crew, shifting conception dates enough that a completely different set of children are born to those workers and the surrounding community than would have been born under Plan B. Plan A saves money upfront but necessitates slashing the long-term filtration budget, meaning those specific children grow up drinking water with slightly elevated neurotoxin levels, resulting in manageable but real cognitive deficits. When these kids sue the city for damaging their health, the city argues they have no standing: had the Board chosen the safer Plan B, the specific hormonal cascades required for their conception wouldn't have occurred, so these particular plaintiffs would never have existed at all.

  Here's the mechanical breakdown. The reason these people can't claim harm is rooted in the counterfactual condition of harm: to be harmed by an action, you must be worse off than you would have been had that action not occurred. But for these kids, the alternative to "existing with deficits" isn't "existing healthy," it's "never existing." Since their lives are still worth living (they aren't suffering so much that non-existence would be preferable), they aren't worse off than their only other possible state. The feature doing all the philosophical work here is *identity-dependence*—the policy doesn't just affect the quality of life for a fixed population; it determines *which* population comes into being.

  A defender of the rushed timeline would attack this by leaning hard on the "person-affecting view": morality is only about making specific people better or worse off. They'd argue that since no specific person was made worse off compared to their own baseline alternative, no moral wrong was committed against a person. Does this attack succeed? Logically, yes; it holds up within a strict person-affecting framework. But intuitively, it fails miserably. It exposes a crack in the framework itself, suggesting that we need an impersonal principle—something like "it's wrong to choose a future where people are less well-off, even if they are different people"—to capture why the Water Board's decision feels predatory despite the logical loophole.
