  2.  **Deconstruct the Nonidentity Problem (Parfit):**
      *   Core issue: An action affects *who* comes into existence, not just *how well* off they are.
      *   If a policy brings about a person with a life worth living, but a different policy would have brought about a *different* person with a *better* life, can the first person claim they were harmed by the first policy?
      *   Standard answer: No, because without the policy, they wouldn't exist. "Better never to have been born" vs. "Better to have been born differently."
      *   The challenge: It seems intuitively wrong to choose the policy that creates worse lives, but hard to justify why without appealing to impersonal values (which clashes with person-affecting views).

  3.  **Drafting the Thought Experiment (The Water Board Scenario):**
