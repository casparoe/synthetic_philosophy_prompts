      *   *Consequence:* Plan A saves money now but cuts long-term safety budget. Future residents (the children of the workers/community) live with higher contamination risk/lower safety.
      *   *Constraint Check:* One paragraph. Realistic. No sci-fi.

  4.  **Drafting the Analysis:**
      *   *Why no harm?* The "Person-Affecting Restriction." To harm someone, you must make them worse off than they would otherwise have been. If Plan A is necessary for their existence, Plan B isn't an alternative *for them*, it's an alternative *for someone else*.
      *   *Philosophical Workhorse:* The identity-dependence of the outcome. The specific individuals are counterfactually dependent on the choice.
      *   *Defender's Attack:* They might argue that "harm" shouldn't be comparative to non-existence. Or they might argue that the policy violates rights independent of welfare (rights-based objection). Or they might argue that the probability shift is too small to claim identity change (the "same people" objection).
