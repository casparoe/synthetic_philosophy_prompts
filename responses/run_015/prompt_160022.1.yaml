answer: |-
  ### The Functionalism Decision Tree

  **Starting Commitment:**
  We agree to begin here: *A mental state is whatever plays a certain causal role, and what plays it is some physical state of the organism.*
  (You accept that mental states are defined by what they *do*, and that they are physically embodied. The questions below determine how tightly you bind the "doing" to the "embodiment.")

  ---

  #### Branch 1: The Martian Case (Universality)
  **Case:** A Martian has a state that plays the exact causal role of pain (causes avoidance, distress, groaning) but is realized by a hydraulic mechanism, not biology.
  **Question:** Is the Martian's state the **same type of mental state** (Pain) as yours, or a different type (Martian-Pain)?
  *   **No (Different Types):** Go to **Branch 2**. (You think mental types track physical types).
  *   **Yes (Same Type):** Go to **Branch 5**. (You think mental types track functional roles).

  ---

  #### Branch 2: The Silicon Swap (Substrate Specificity)
  **Case:** In a human, one neuron is swapped for a silicon chip that does the exact same local causal job.
  **Question:** Is the resulting mental state the **same type** as before?
  *   **No:** **Leaf 1: Type Identity Theory.** (Mental states are strictly identical to specific biological/physical states. If the physical type changes, the mental type changes.)
  *   **Yes:** Go to **Branch 3**. (You allow some physical variation within a mental type, but not across species.)

  ---

  #### Branch 3: The Fundamental Physics (Metaphysical Unity)
  **Case:** We look at the fundamental physics (quantum level) of your neurons and the Martian's hydraulics.
  **Question:** Is there **one single physical description** at this level that covers both you and the Martian, even if we haven't discovered it yet?
  *   **Yes:** **Leaf 2: Epistemic Multiple Realizability.** (MR is true in practice, but false in principle. There is a unified physical kind; our functional grouping just tracks our ignorance of it.)
  *   **No:** Go to **Branch 4**. (The physical realizers are genuinely distinct kinds.)

  ---

  #### Branch 4: The Category Retention (Realizer Individuation)
  **Case:** Since the physical realizers are genuinely distinct (Human C-fibers vs. Martian Hydraulics), we have to decide how to name them.
  **Question:** Do we keep the single word **"Pain"** for both, acknowledging it refers to a disjunction of physical kinds, or do we say **"Human-Pain"** and **"Martian-Pain"** are distinct kinds?
  *   **Keep "Pain":** **Leaf 3: Realizer Functionalism.** (Mental states are the physical realizers themselves. "Pain" is a convenient label for a disjunctive set of physical states.)
  *   **Split "Pain":** **Leaf 4: Narrow Mental Kinds.** (Anti-functionalist/Revisionist. Folk categories like "Pain" are too broad to be scientific kinds. We should only talk about the specific physical implementations.)
      *   *(Note: This path also captures **Local Reduction** if you restrict the "Yes" in Branch 2 to species-specific variations.)*

  ---

  #### Branch 5: The Source of the Role (Definition)
  **Case:** We agree the Martian has "Pain." But how do we define the "causal role" that qualifies them?
  **Question:** Is the role defined by our **everyday concepts** (folk psychology) or by **empirical scientific theory** (computational/neuroscientific)?
  *   **Everyday Concepts:** Go to **Branch 6**.
  *   **Scientific Theory:** Go to **Branch 7**.

  ---

  #### Branch 6: The Conceptual Rigidity (Analyticity)
  **Case:** We find a creature that fits the causal role perfectly but lacks a key feature our concept associates with pain (e.g., they don't find it unpleasant).
  **Question:** Do we say they **lack pain** (because they violate the concept) or **have pain** (because they fit the causal pattern)?
  *   **Lack Pain:** **Leaf 5: Analytic Functionalism.** (Mental states are defined *a priori* by our folk concepts. If the concept isn't satisfied, the state doesn't exist.)
  *   **Have Pain:** **Leaf 6: Role Functionalism (Conceptual).** (The causal role trumps the folk concept. The concept is just a placeholder for the role.)

  ---

  #### Branch 7: The Ontological Status (Second-Order)
  **Case:** We define the role scientifically. Now, what *is* the mental state?
  **Question:** Is the mental state a **new property** (the property of *having* a realizer that plays the role) or just the **physical realizer itself** described functionally?
  *   **Just the Realizer:** **Leaf 7: Token Identity Theory.** (Each instance of pain is identical to a physical token state. There is no mental "type" over and above the physical tokens.)
  *   **New Property:** Go to **Branch 8**. (Mental states are second-order properties distinct from their realizers.)

  ---

  #### Branch 8: The Individuation of Content (Externalism vs. Internalism)
  **Case:** Consider two creatures with identical internal organization. One lives on Earth (Water), one on Twin Earth (XYZ). They have the same internal state caused by liquid.
  **Question:** Do they have the **same mental content** (belief about "water"), or does the **environment/history** make the contents different?
  *   **Different Contents:** **Leaf 8: Externalist Functionalism.** (Functional roles include relations to the environment. Mental types are wide.)
  *   **Same Content:** Go to **Branch 9 (Granularity)**. (Functional roles are narrow/internal.)

  ---

  #### Branch 9: The Granularity of Roles (Machine vs. Role)
  **Case:** A creature has one internal state that plays both the "Pain" role and the "Belief" role simultaneously (overlap).
  **Question:** Is this **impossible** (roles must be discrete/computational) or **possible** (roles are holistic/causal)?
  *   **Impossible (Discrete):** **Leaf 9: Machine/Psychofunctionalism.** (Mental states are computational states with specific, non-overlapping functional definitions.)
  *   **Possible (Holistic):** **Leaf 10: Role Functionalism (Causal).** (Mental states are defined by their place in a holistic causal network. Overlap is permitted.)

  ---

  ### Analysis of the Logical Space

  #### 1. Empty or Unattractive Combinations
  *   **Type Identity + Multiple Realizability:** This combination is logically incoherent within this tree. If you accept Type Identity (Leaf 1), you must answer "No" to Branch 1 (Martian). If you answer "Yes" to Branch 1, you have already abandoned Type Identity.
  *   **Analytic Functionalism + Externalism:** This combination (Branch 6 -> Branch 8 Externalist) is theoretically possible but unattractive to most proponents. Analytic functionalism relies on *our* concepts fixing the reference. Since our folk concepts are typically internalist (we don't intuitively think our twin's pain differs), pushing Analytic Functionalism into Externalism creates a tension between the "folk" source and the "wide" content.
  *   **Epistemic MR + Realizer Functionalism:** If you believe there is a single underlying physical description (Branch 3 Yes), you generally collapse into Type Identity eventually. Staying at Realizer Functionalism while claiming there is a unified physical base is an unstable "waiting room" position.

  #### 2. Collapses and Indistinct Leaves
  *   **Role Functionalism vs. Realizer Functionalism (The Specification Collapse):**
      *   *The Problem:* These two positions (Leaf 3 vs. Leaf 6/10) are often distinguished by whether the mental state is the *role* (second-order) or the *realizer* (first-order). However, this distinction collapses depending on how finely you specify the "role."
      *   *The Collapse:* If a Role Functionalist specifies the role as "The role played by C-fibers," the role becomes identical to the realizer (collapsing into Type Identity/Realizer Functionalism). If a Realizer Functionalist specifies the realizer as "Whatever plays the Pain Role," the realizer becomes identical to the role (collapsing into Role Functionalism).
      *   *Tree Location:* This tension exists between Branch 4 (Realizer) and Branch 7 (Role). The tree forces a choice, but in practice, the boundary is porous.
  *   **Token Identity vs. Non-Reductive Physicalism:**
      *   Leaf 7 (Token Identity) and Leaf 8 (Externalist Functionalism) are often indistinguishable in practice. Both assert that every mental token is a physical token, but deny a unified mental *type* across different physical bases. The tree separates them based on whether you emphasize the *ontology* (Token Identity) or the *content individuation* (Externalism), but many philosophers hold both views simultaneously.
  *   **Machine Functionalism vs. Role Functionalism:**
      *   Leaf 9 and Leaf 10 are separated by the "Granularity" question (Branch 9). However, if "computational states" are defined broadly enough to include holistic causal networks, Machine Functionalism absorbs Role Functionalism. The distinction relies on a specific, narrow view of computation (discrete, syntactic) that not all functionalists share.

  #### 3. The "Local Reduction" Nuance
  *   **Leaf 4 (Narrow Mental Kinds)** and **Branch 2 (Local Reduction)**: The tree places Local Reduction implicitly in the "No" branch of Branch 1. If you say "Martians don't have *our* pain" (Branch 1 No) but "Silicon humans do" (Branch 2 Yes), you are a Local Reductionist. This is logically distinct from Type Identity (Branch 2 No) but shares the Real Functionalist commitment that mental kinds are species-relative physical kinds.

  #### 4. Where the Tree Fails to Pull Apart
  *   **Epistemic MR vs. Type Identity:** If you answer "Yes" to Branch 3 (there is a unified physical description), you are an Epistemic MR theorist *for now*. But if that physical description is found, you become a Type Identity theorist. The tree treats them as distinct leaves, but they are temporally relative positions. The "ism" depends on the current state of neuroscience, not just your metaphysical commitment.
  *   **Analytic vs. Role Functionalism:** Branch 6 attempts to separate these by asking if the concept trumps the role. But if the "role" is defined *by* the concept (as Analytic Functionalism claims), then satisfying the role *just means* satisfying the concept. The "Yes" answer to Branch 6 effectively converts the view into a version of Role Functionalism where the role is conceptually defined. The distinction is more about methodology (conceptual analysis vs. empirical discovery) than metaphysical outcome.
