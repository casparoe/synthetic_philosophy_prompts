  **DEPARTMENT OF PERPETUAL ADMINISTRATION**
  **DIRECTIVE 74/C: CRITERIA FOR SUBSTANTIVE EQUIVALENCE IN PUBLIC OFFICES**
  **Date:** 14 October 1998
  **Classification:** Internal Use Only

  **1. Definition of Office**
  An Office of State is defined not by the material composition of its occupant but by the stability of its operational pattern. An Office consists of a specified set of Inputs (requests, filings, environmental stimuli), a set of Internal State Transitions (processing, deliberation, routing), and a set of Outputs (decisions, stamps, memoranda). Provided the mapping of Inputs to Outputs via Internal States remains within a tolerance of ±5% of the Established Baseline, the Office is deemed continuous.

  **2. Substrate Neutrality**
  The physical medium executing the Internal State Transitions is immaterial. Occupancy may be sustained by biological persons, standing committees, mechanical assemblies, avian collectives, or geographical features, provided the Output Schedule is maintained. *[See Case 449 (Coastal): Pending]*

  **3. Generalisation Clause**
  To prevent obsolescence, the Operational Pattern shall be described in abstract terms. Any system capable of replicating the Input-Output mapping qualifies. *[Note: Does this include a bucket of water? Consult Legal.]*

  **4. Specificity Clause**
  To prevent drift, the Operational Pattern must adhere to the specific procedural history of the incumbent. Deviations in routing logic, even if functionally equivalent, constitute a break in Continuity. *[Amended per Memo 12]*

  **5. Determination of Purpose**
  The intended function of the Office is determined by the Department. Where the Department's definition conflicts with the Public's understanding of the Office's purpose, the Department's definition prevails for the purposes of Continuity.

  **6. Verification Protocol**
  Claimants seeking to establish Continuity must submit to a Blind Input Test. Standardised queries will be issued. Responses are measured against the Archive. Accuracy of sentiment is not scored.

  **7. Temporal Continuity**
  Gaps in operation do not necessarily void Continuity, provided the resumption of work picks up the Internal State exactly where it left off. *[See: Power Cut of '96]*

  **8. Internal Sensation**
  The presence or absence of subjective experience within the Occupant is not a deliverable. The Department requires only that the Occupant behaves *as if* it processes information. Reports of "darkness," "silence," or "automaticity" are irrelevant to status.

  **9. Discrepancy in Experiential Quality**
  Where a Claimant satisfies all functional metrics but asserts that the work "feels nothing like it used to," the claim shall be dismissed. The sensation of familiarity is not a statutory requirement. The Office is what the Office does.

  **10. Succession**
  Upon failure of the current Occupant, any entity satisfying Clauses 1–9 may be installed. Objections based on the nature of the entity (e.g., "It is made of birds") are inadmissible.

  ***

  **NOTE FOR APPLICANTS**

  Do not submit affidavits regarding your identity, memories, or name. These are not properties of the Office. To establish that you are the same Office as the predecessor, you must demonstrate that you process Form A-12 in exactly the same manner, produce the same refusal letters under identical conditions, and route complaints to the same bin. If you perform the work of the Office, you are the Office. If you perform the work differently, you are a new Office and must apply for a new budget. If you perform the work correctly but feel empty while doing so, continue working. Do not contact Human Resources regarding emptiness. Human Resources is currently occupied by a clockwork assembly and cannot respond to queries of a metaphysical nature.

  *[Handwritten note in margin: "Check the pigeons again. They're missing a stamp."]**
