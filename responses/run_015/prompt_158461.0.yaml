  ### 1. Mapping Maya's Theory: Kripkean Origin Essentialism
  Maya is almost certainly a proponent of **Origin Essentialism**, specifically the version articulated by Saul Kripke in *Naming and Necessity*.

  Here is how her verdicts align with this theory:
  *   **Career/Location/Physical Parts (Yes):** These are *accidental properties*. In Kripkean modal logic, a rigid designator (like your name or "you") refers to the same entity across all possible worlds, provided the *origin* is fixed. Changing your job, location, or even losing an eye does not change the essential facts of your genesis.
  *   **Different Sperm/Egg or Parents Never Met (No):** This is the core of Origin Essentialism. Kripke argues that a person's origin (the specific zygote from which they developed) is essential to them. You could not have come from different parents or a different gamete combination. If the specific sperm and egg don't meet, *you* do not exist in that world.
  *   **Brain Upload (No):** This aligns with a **Biological View** (Animalism) layered onto Origin Essentialism. If you are essentially a human organism that originated from a specific zygote, a silicon upload lacks both the biological substrate and the continuous causal history of that organism. It is a copy, not a continuation.
  *   **Sherlock Holmes (Yes):** She applies the same logic to fictional entities. Sherlock is essentially the character created by Conan Doyle; adding a sister is an accidental property change, not an origin change.

  **The Theory:** Maya believes in **Transworld Identity** constrained by **Necessity of Origin**. She thinks *you* literally exist in other worlds, but only if those worlds contain a person who originated from your specific zygote.

  ### 2. The Clone Case Verdict
  **Verdict: No, the clone is not you.**

  **Reasoning:**
  Maya's rules prioritize **causal origin** over **qualitative similarity**.
  *   In the branching case, the "normal" you originates from the original zygote.
  *   The clone originates from **somatic cells** at the moment of birth.
  *   Even though the clone is genetically identical and raised in the same environment, the *causal genesis* is different. It is a new organism created via a different process (cloning vs. sexual reproduction) at a later time.
  *   To Maya, this is metaphysically equivalent to the "different sperm/egg" case. The clone is a **counterpart**—someone very much like you—but it is not *you*. There is no world where the clone is identical to you because the clone lacks your essential origin.

  ### 3. The Wedge Case: "Twinning at Conception"
  You mentioned that current theories (like Origin Essentialism and some forms of Biological Continuity) agree on the Upload (Copy) and Career (You) cases. To split them, you need a case that tests **Literal Transworld Identity** against **Counterpart Theory**.

  Both theories can accommodate Maya's previous answers. A Counterpart Theorist (like David Lewis) can simply say that "counterpart relations" are weighted heavily toward origin, yielding the same "No" on gametes and "Yes" on careers.

  **The Case to Split Them:**
  Ask Maya about a world where **your zygote splits immediately after conception (identical twinning), but in the actual world, you were a single birth.**

  *   **Scenario:** In World W, the exact zygote that formed you splits into Twin A and Twin B. Both grow up to have lives qualitatively identical to yours.
  *   **The Question:** In World W, is Twin A *you*? Is Twin B *you*? Are both *you*?

  **Why this splits the theories:**
  1.  **Maya's Likely View (Transworld Identity + Origin Essentialism):** This creates a paradox. If *you* are essentially that zygote, and that zygote becomes two people, identity cannot hold. She must say either **neither** is you (identity is lost in fission) or **one** is you (but it is metaphysically indeterminate which one). She cannot say "Both are literally me" without violating the logic of identity (one thing cannot be two things).
  2.  **The Rival View (Weighted Counterpart Theory):** A Lewisian counterpart theorist has an easy answer: **Both are your counterparts.** There is no strict "identity" across worlds, only degrees of similarity. Since both share your origin and life, both stand in the counterpart relation to you equally.

  **How to ask it:**
  *"Maya, if we go to a world where your exact zygote split into twins and both lived your life, are both of them you, or is identity lost? If you say 'both,' you're a Counterpart Theorist. If you say 'neither' or 'only one,' you're holding onto strict Transworld Identity."*

  This forces her to reveal whether she thinks "you" is a primitive fact that travels across worlds (Kripke) or a matter of tracking relations based on similarity and origin (Lewis).
