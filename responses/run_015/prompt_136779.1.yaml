      *   *Alternative Revision:* **Distinguish the *Type* of Norm.** Dueling is a "Thick Honor Norm." Slavery is a "Mixed Institutional Norm." The theory applies primarily to Thick Honor Norms. This limits the scope but increases accuracy.
      *   *Decision:* The "Honor-Mediated Interest" revision is theoretically stronger for a seminar. It keeps the Williams/Appiah flavor but avoids the special pleading charge. It argues that *interests alone don't change norms; they change norms when they shift the honor landscape.* (e.g., Slave ownership became associated with backwardness/lack of sophistication, not just cost).

