      *   *Best Single Revision:* **Modify C1.** Instead of "Honor > Interests," make it "Interests operate *through* Honor." This saves C1 (Honor is still the proximate mechanism), saves C3 (Interests mattered, but as inputs to the honor calculus), satisfies C5 (Look for honor traces in slavery), and keeps C6 (Arguments articulate the new honor code).
