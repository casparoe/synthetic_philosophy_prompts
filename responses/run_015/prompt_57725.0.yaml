answer: |-
  Here is the translation of the philosophy of medicine debate into the vocabulary of clinical chemistry, followed by the residue report.

  ### The Debate in Lab Clothes

  **The Naturalists (Boorse and the Biostatistical Theory)**
  Imagine Boorse walking into your lab during validation. He insists that "disease" is purely a technical finding, equivalent to a result falling outside the reference interval (RI). For him, the reference population isn't a convenience; it's an ontological reality. He argues that if you select the correct reference class (partitioned by age, sex, and perhaps ethnicity), the central 95% represents "normal species-functioning." Anything outside that is a statistical deviation from the biological design plan. He treats "function" like a measurand with a true value defined by evolutionary survival and reproduction. To Boorse, your flagging rules should be objective: if the analyte deviates from the species-typical efficiency contribution to survival, it's a dysfunction. He wants you to believe that the RI *is* the disease definition, and that clinical decision limits are merely downstream consequences. He argues you can define the reference interval without knowing how the clinician will use the result. In his view, the lab report is value-free; the value judgment only happens when the clinician decides to treat. He relies on the assumption that "healthy" donors for your reference interval can be identified without circular reasoning—that you can find a "normal" population without already knowing what "disease" is.

  **The Normativists (Canguilhem, Engelhardt, and the Scandinavians)**
  Now imagine the normativists reviewing your SOPs. They argue that you cannot establish a reference interval without already making value judgments. When you exclude donors with hypertension or diabetes to build your "healthy" reference population, you are deciding which deviations count as diseases. They say the reference class is chosen, not discovered. To them, a result outside the RI is just data; it only becomes "disease" when it interferes with the patient's "vital goals"—their ability to adapt to their environment and pursue their life plans. This sounds like Medical Decision Limits (MDL) to you. They argue that health isn't a static state within an interval; it's a margin of tolerance, a capacity to handle stress. A result might be outside the RI but not disease (e.g., pregnancy alkaline phosphatase), or inside the RI but still disease (e.g., early neurodegeneration where homeostasis masks the decline). They claim that "function" isn't just biological efficiency; it's normative. You can't separate the measurand from the person holding it. They insist that the lab cannot define disease because the lab measures quantities, not meanings. The "flag" on the result is inherently a warning about harm, not just statistics.

  **The Hybrids (Wakefield and Harmful Dysfunction)**
  The hybrid view tries to write a protocol that satisfies both auditors. They say you need two conditions to call something a disease, much like you need both analytical validity and clinical utility. First, there must be a factual dysfunction—a failure of a mechanism to perform its natural function (the Naturalist RI component). Second, there must be harm—a negative evaluation of that dysfunction based on social or personal values (the Normativist MDL component). In your terms, this is like saying a result must be outside the reference interval *and* breach a clinical decision limit to count as pathology. They try to stop the regress by saying the "function" part is naturalistic (evolutionary design) but the "harm" part is normative. They want to protect the lab's authority on the mechanism while conceding the clinician's authority on the impact. They argue that without the dysfunction component, you have just social deviance (like homosexuality in older manuals); without the harm component, you have an asymptomatic anomaly that doesn't warrant the label "disease."

  ***

