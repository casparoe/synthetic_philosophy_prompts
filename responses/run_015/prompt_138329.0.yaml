      *   *Cost:* **Moderate.** You must abandon the standard "Sophisticated Choice" model (where you re-optimise at every node) in favour of a specific theory of agency (McClennen's Resolute Choice). However, this theory is explicitly designed to solve this problem. It satisfies Commitment 4 (no money pump, as you don't deviate) and Commitment 1 (optimal payoff).

  ### The Single Cheapest Fix

  The single cheapest fix that cleans up the most tension is to **revise Commitment 3**.

  You should replace the requirement that "a plan is rational only if it is sequentially rational" with a requirement that **"a plan is rational if it is ex ante optimal and the agent possesses the capacity for resolute choice."**

  **Why this is the cheapest fix:**
  1.  **Preserves Payoff:** It secures the ex ante optimal outcome (Commitment 1), avoiding the pragmatic disaster of the 0 payoff.
  2.  **Preserves Beliefs:** It allows you to keep your Halfer credences (Commitment 2) without mathematical contradiction, because you simply refuse to act on the local re-evaluation.
  3.  **Preserves Beauty Analogy:** It keeps Commitment 5 intact, as you do not need to argue that AMD and Beauty are different to justify different credences.
  4.  **Satisfies Dutch Book Constraint:** Proponents of Resolute Choice argue that such agents are *not* vulnerable to diachronic Dutch books because they do not treat each node as a new decision point where bets can be offered against the plan. Thus, Commitment 4 is satisfied.

  By modifying Commitment 3, you shift the burden from your epistemology (beliefs) and mathematics (payoffs) to your theory of agency. Given that you are already committed to Halferism and ex ante optimisation, adopting Resolute Choice is the most conservative theoretical move available to you.
