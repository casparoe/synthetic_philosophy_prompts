answer: |-
  **The System and Behavior**
  Consider an autonomous warehouse rover navigating a dynamic floor using an Artificial Potential Field (APF) algorithm. The rover moves toward goal bins while treating obstacles as repulsive forces; its trajectory is the resultant vector sum. Over a long shift, it successfully retrieves hundreds of bins, avoiding collisions with moving forklifts and static shelves. Observers can reliably predict its path by ascribing a desire for the bin and beliefs about obstacle locations; each belief about an obstacle explains both the rover's lateral deviation and its velocity reduction. Two independent interpreters, given the floor layout, converge on the same belief ascriptions. However, the rover lacks a global map; it reacts locally to sensed fields. When trapped in a symmetric U-shaped obstacle arrangement, it oscillates indefinitely rather than retreating to re-route, despite the goal being reachable.

  **Predictions and Compression**
  For the next move in a U-trap, the intentional stance predicts the rover will attempt to circle the obstacle (based on "wanting" the goal and "believing" the path is blocked). It predicts failure only by attributing confusion or error. The design stance predicts exact oscillation frequencies based on the repulsion equation. The physical stance is dismissed because computing voltage states across its microarchitecture is computationally intractable and offers no explanatory leverage for navigation.

  Regarding compression: The raw behavioral data (trajectory coordinates) grows in complexity linearly with the number of obstacles $N$. The intentional description requires specifying the goal plus $N$ belief-clauses (one per obstacle influence), so its length scales as $O(N)$. The design description requires specifying the APF algorithm plus the goal, scaling as $O(1)$. As the warehouse clutter (data) grows, the intentional stance saves only a constant factor over raw data specification, whereas the design stance compresses without bound. Thus, under the strict growth criterion, the intentional pattern is not real, despite its predictive success in non-trap cases.

  **Load-Bearing Feature**
  The load-bearing feature is the **reactive, non-mapping nature of the control law**. If you remove this by upgrading the rover to a global planner (e.g., A* search), the intentional stance compresses efficiently: a single belief ("It believes the map is M") covers all behaviors regardless of obstacle count. The case then collapses into one where the intentional pattern *is* real, because the beliefs now generalize globally rather than indexing local features. Conversely, keeping the reactive law ensures beliefs scale linearly with environmental complexity, preventing the savings from growing relative to the design stance.

  **Reply and Verdict**
  A Dennettian might reply that "realness" is relative to the interpreter's resources: if we cannot compute the design stance quickly, the intentional stance is real *for us*. However, this conflates pragmatic utility with the ontological criterion of compression scaling. Your friend's claim—that predictive success guarantees real patterns—is false here. The rover exhibits robust intentional success without constituting a real pattern in the strict information-theoretic sense. This is not a counterexample Dennett should reject; rather, it clarifies his view. Dennett distinguishes between "true enough" patterns and "real" patterns; this case shows the intentional stance can be the former without being the latter. The criterion stands corrected: predictive success is necessary but not sufficient; the compression must scale superiorly to brute data to qualify as ontologically real.
