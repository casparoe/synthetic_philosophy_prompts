      *   *Boundary Cases:*
          *   *Different Model:* Is it independent? No, if they share training data/architecture priors. Yes, if architectures differ significantly (ensemble method).
          *   *Random Audit (1 in 20):* Breaks the circle *if* the audit is truly independent (ground truth). If it's just "looking at it," it might not help.
          *   *Tool is Right Most of the Time:* Increases the danger (false sense of security).
          *   *Capability to Check:* Crucial distinction. If you *can* but *don't*, it's *Volitional Epistemic Deference*. If you *can't*, it's *Necessary Deference*.
          *   *Spellchecker/Calculator:* Different category. Those are deterministic and narrow. LLMs are probabilistic and semantic. The "shared prior" risk is lower in a calculator (2+2=4 is not a cultural prior).

  5.  **Drafting the Response Structure:**

      *   **Validation:** Acknowledge the sophistication of the observation. It's a high-quality insight.
