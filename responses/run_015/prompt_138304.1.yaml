  6.  **Refining the Concepts (Self-Correction during drafting):**

      *   *Correction:* Don't just say "Automation Bias." The user explicitly rejected the layperson version. I need to focus on the *expert* version. "Expert Automation Bias" exists but is rare.
      *   *Correction:* The "Standard Drift" is a key part. This is *Normative Drift*. The model isn't just answering; it's teaching the user what a good answer looks like.
      *   *Philosophical Angle:* The "Problem of the Criterion" (Chisholm). How do we know the criterion is right? By the system. How do we know the system is right? By the criterion.
      *   *Term Proposal:* **"Reflexive Epistemic Coupling"** or **"Circular Calibration."** Let's go with describing it as a form of **Epistemic Closure via Shared Priors**.
      *   *Boundary - Calculator:* The break is *Semantic vs. Syntactic*. Calculators handle syntax (rules). LLMs handle semantics (meaning/interpretation). Shared priors apply to semantics.

  7.  **Final Polish:**

      *   Ensure the tone matches the user's (thoughtful, precise, academic but practical).
