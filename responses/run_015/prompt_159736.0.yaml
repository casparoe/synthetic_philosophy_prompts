answer: |-
  ### Menu of Theses: "A Bird in the Hand is Worth Two in the Bush"

  The following table separates the distinct claims hidden within the proverb when applied to intergenerational discounting. They are ordered from least to most philosophically loaded.

  | # | Thesis | Source of Difference (Lateness vs. Other) | Whose Discounting? | What is Discounted? | Time Consistent? | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Risk of Non-Delivery** | **Other:** Probability the benefit never materialises (the bush is empty). | Individual or Planner | Expected Value | Yes | **Trivial** (This is probability weighting, not time discounting.) |
  | **2** | **Mortality / Existence** | **Other:** Probability the recipient ceases to exist before receipt. | Individual Only | Individual Utility | Yes | **Defensible** (For individuals); **False** (For generations; *someone* will exist.) |
  | **3** | **Opportunity Cost of Capital** | **Other:** Resources invested now yield physically more resources later. | Planner / Investor | Money / Physical Capital | Yes | **Substantive & Defensible** (But implies we should *invest*, not *consume*, the bird.) |
  | **4** | **Diminishing Marginal Utility** | **Other:** Future generations expected to be wealthier; extra consumption worth less to them. | Planner / Social Welfare | Consumption / Welfare | Yes | **Substantive & Defensible** (Contingent on empirical claim that future will be richer.) |
  | **5** | **Individual Impatience** | **Lateness:** Psychological preference for present satisfaction over future satisfaction. | Individual | Utility / Welfare | No (Hyperbolic) | **False** (Descriptive of psychology, not normative for ethics.) |
  | **6** | **Pure Social Time Preference** | **Lateness:** The welfare of future people counts less simply because they live later. | Generation / Society | Welfare / Lives | Yes | **False** (Ethically indefensible; discriminates by date of birth.) |

  ***

  ### Analysis of the Economist's Moves

  **1. Which reading supports the move that discounting is "plain common sense"?**
  The economist is relying on **Thesis 1 (Risk)** or **Thesis 3 (Opportunity Cost)**. These are technically robust and intuitively obvious in commercial contexts. By invoking the proverb, they smuggle these uncontroversial technical parameters into **Thesis 6 (Pure Social Time Preference)**, which is the actual parameter required to shrink harms 10,000 years hence to near-zero. The proverb masks the ethical claim (6) as a technical claim (1 or 3).

  **2. Which reading supports the move that zero discounting implies "absurd sacrifice"?**
  This relies on ignoring **Thesis 4 (Diminishing Marginal Utility)** and **Thesis 3 (Opportunity Cost)**. If future generations are wealthier (Thesis 4) and capital is productive (Thesis 3), a zero *pure* time preference does not require present impoverishment; it requires optimal investment. The "absurd sacrifice" argument only holds if one assumes zero growth and zero return on investment, or if one conflates discounting *consumption* with discounting *welfare*.

  **3. Which reading are they most likely to have in mind?**
  They are likely thinking of **Thesis 3 (Opportunity Cost)** but applying it to **Thesis 6 (Welfare)**. In finance, money today is worth more than money tomorrow because of return on investment. In ethics, a life today is not worth more than a life tomorrow because of return on investment. The error is applying a financial constraint to a moral weight.

  ***

  ### Verification of Your Suspicion

  Your suspicion is correct. This is the **eliminative reading**.

  1.  **Risk (Thesis 1)** is handled by probability adjustments, not a time-rate.
  2.  **Mortality (Thesis 2)** is irrelevant for geological timescales where the *population* persists even if individuals do not.
  3.  **Growth and Capital (Theses 3 & 4)** are handled by the Ramsey Rule ($r = \delta + \eta g$). If you set the pure time preference ($\delta$) to zero, the discount rate ($r$) is still positive if growth ($g$) is positive. This preserves the incentive to invest without morally devaluing future lives.
  4.  **Lateness as Such (Theses 5 & 6)** provides no independent justification.

  **Conclusion:** None of the defensible readings (1–4) justify discounting the far future *merely because it is far*. They justify discounting based on risk, wealth, or productivity. Once those factors are explicitly calculated, the residual "pure time preference" vanishes. The proverb, when used to defend a non-zero pure rate of time preference over millennial scales, is a category error.
