      *   **Specific Complications to Address:**
          1.  *Unstable Counterfactual:* The parents' damages depend on what they *would* have done (abort vs. not conceive). If they would have had a healthy child later, the "loss" of ordinary rearing costs vanishes, yet courts award extraordinary costs anyway. If they would have had *no* child, the comparison looks like the forbidden "existence vs. non-existence" comparison denied to the child.
          2.  *Statutory Reform:* A hypothetical statute allowing recovery only when life is *not* worth living, damages measured by shortfall below threshold, paid to a care fund. How does this interact with the implicit theory?
      *   **Specific Questions to Answer:**
          *   What view of harm, benefit, and counterfactual comparison does existing practice presuppose?
          *   Distinguish strict presuppositions from what merely fits well.
          *   Identify where rival theories license the same pattern.
