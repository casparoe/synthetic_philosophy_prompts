  2.  **Analyze the Existing Legal Pattern:**

      *   *Wrongful Life (Child's Claim):* Denied. Rationale: No right not to be born; existence vs. non-existence incomparable; dignity of disabled life.
      *   *Wrongful Birth (Parents' Claim, Disabled Child):* Allowed (extraordinary costs). Offset: Ordinary costs offset by benefits of existence.
      *   *Wrongful Conception (Parents' Claim, Healthy Child):* Split. Some allow rearing costs, some deny (pregnancy/birth only). Rationale for denial: Healthy child = pure benefit/no injury.

  3.  **Reconstruct the Implicit Theory (The "Legal Pragmatist/Personhood" Model):**

      *   *Harm:* Harm requires a subject who is worse off than they would otherwise be.
      *   *Personhood:* Legal personhood begins at birth (or viability). Non-existence is not a state a person can occupy.
      *   *Value of Life:* There is a presumption that life is a benefit (the "benefits-offset" rule).
      *   *Autonomy:* Parents have a right to control reproduction (avoid pregnancy/avoid disabled child).
      *   *Coherence Check:* The tension lies in awarding parents damages based on the *avoidance* of a child while simultaneously saying the child's existence is a benefit that offsets costs.

  4.  **Address Complication 1: The Unstable Counterfactual:**

      *   *Scenario A (Abort & Try Again -> Healthy Child):* In the "careful world," parents have a *different* healthy child. Ordinary costs are the same. Extraordinary costs (due to disability) are avoided.
          *   *Legal Practice:* Awards extraordinary costs. Ignores the "substitute child" argument.
          *   *Implicit Theory:* It treats the *specific* pregnancy as the locus of duty. It avoids the Non-Identity Problem by focusing on the parents' financial position relative to *this* pregnancy, not the total lifetime utility. It implicitly assumes the "careful world" is one where *this* child does not exist, regardless of whether another might later.
      *   *Scenario B (Abort & Stop -> No Child):* In the "careful world," no child exists.
          *   *Legal Practice:* Awards extraordinary costs.
          *   *Implicit Theory:* This *does* rely on the existence/non-existence comparison the child is denied.
          *   *Resolution:* The law distinguishes *financial harm to parents* from *ontological harm to child*. Parents can be harmed by the *burden* of existence even if the child is not harmed by *being*.
      *   *Coherence:* This is the biggest crack. It relies on a "person-affecting" view for the child (can't be harmed by being born) but a "non-person-affecting" or "financial" view for the parents (can be harmed by the costs of a life).

  5.  **Address Complication 2: The Statutory Reform:**

      *   *Reform:* Action only if life *not* worth living. Damages = shortfall below threshold. Paid to care fund.
      *   *Interaction:* This moves from a tort model (compensating loss) to a social welfare/insurance model (ensuring minimum threshold).
      *   *Implicit Theory Shift:* It admits the "Wrongful Life" claim but limits it to extreme cases. It rejects the "life is always a benefit" presumption for severe cases.

