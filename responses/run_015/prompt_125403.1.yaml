answer: |-
  The existing common-law pattern presupposes a hybrid theory I will call **The Separate Spheres of Personhood and Autonomy**. This theory attempts to navigate the Non-Identity Problem by segregating the ontological status of the child from the economic and autonomy interests of the parents. Below is the reconstruction of this theory, an analysis of its coherence, and an examination of the two complications you raised.

  ### I. The Reconstructed Theory: Separate Spheres

  The legal practice rests on three distinct pillars that operate in tension with one another:

  1.  **Ontological Constraint (The Child's Sphere):** Legal standing requires existence. There is no subject of harm prior to birth. Therefore, a comparison between "existence with impairment" and "non-existence" is legally unintelligible. This is not necessarily a claim that life is always good, but that *non-existence* is not a baseline condition a person can occupy to measure loss.
  2.  **Presumptive Benefit (The Valuation Sphere):** For the purpose of tort damages, life is presumptively a net benefit. This justifies the "benefits-offset" rule (ordinary rearing costs are offset by the joy of parenthood). This is a rebuttable presumption for extraordinary costs (which are not offset by joy) but a strong one for ordinary costs.
  3.  **Reproductive Autonomy (The Parents' Sphere):** The duty of care is owed to the *parents*, not the child. The harm is the violation of the parents' right to decide whether and when to become parents. Damages are measured by the financial consequences of that violation.

  #### Strict Presuppositions vs. Compatible Fictions
  It is vital to distinguish what the law *must* assume to function from what it merely *says* to justify itself.

  *   **Strictly Presupposed:**
      *   **Legal Personhood begins at Birth/Viability:** The law is committed to the claim that there is no subject of harm when a person never exists. Without this, the child's action becomes logically possible, undermining the refusal of "wrongful life" claims.
      *   **Duty is to Parents:** The negligence must be framed as a breach of duty to the parents' health or autonomy. If the duty were primarily to the child to prevent her birth, the child's action would be the primary remedy.
  *   **Merely Fits Well With (but is not strictly required):**
      *   **"Any Life Worth Living is a Net Benefit":** The courts *say* this to deny the child's claim. However, the award of *extraordinary* damages to the parents contradicts this. If the life were truly a net benefit overall, the parents (who stand in the best position to judge the child's welfare) should not recover even extraordinary costs. The law fits with this philosophical claim rhetorically, but operationally treats the disability as a net loss to the family unit.
      *   **"Non-existence is Incomparable to Existence":** This is the judicial rhetoric. However, the parents' award *requires* this comparison implicitly (comparing the world with the child to the world without). Thus, the law is not committed to the metaphysical truth of incomparability, only to the **procedural rule** that the *child* cannot make the comparison.

  ### II. Complication 1: The Unstable Counterfactual

  You note that the parents' damages rely on a counterfactual that shifts: either a healthy substitute child (same costs, no disability costs) or no child (no costs, no benefits).

  **How the Law Resolves This:**
  The law implicitly adopts a **Transaction-Specific Counterfactual**. It isolates the specific medical encounter (the sterilization or the prenatal test) and constructs the "careful world" as one where *that specific pregnancy* did not result in a live birth.
  *   **Why?** Administrability. To argue the "substitute child" point (that the parents would have had a healthy child later) requires speculating on future fertility, intent, and the metaphysics of identity. Courts generally bar defendants from introducing evidence that the parents would have had a healthy child later.
  *   **Coherence Test:** This makes the legal theory **metaphysically incoherent but administratively stable**.
      *   If the careful world contains a *different* healthy child, the parents have suffered no financial loss regarding ordinary rearing, and arguably no autonomy loss (they have the child they wanted). Yet the law awards extraordinary costs. This implies the harm is not "having a child vs. no child" but "having *this* child vs. *any other* child."
      *   If the careful world contains *no* child, the parents' recovery *does* rest on the comparison between existence and non-existence—the very comparison denied to the child.
      *   **Verdict:** The law avoids this contradiction by treating the parents' harm as **financial and autonomy-based**, not welfare-based. The parents are harmed because their *project* of family planning was disrupted, not because the universe contains more suffering. The "existence vs. non-existence" comparison is permitted for *wallets* (parents) but forbidden for *souls* (children).

  **Autonomy vs. Welfare in the Parents' Action:**
  *   **Is it Welfare?** If it were purely welfare-based (avoided costs), the "substitute child" argument should defeat the claim. Since courts reject that argument, it is not strictly welfare-based.
  *   **Is it Autonomy?** Yes. It is a reproductive-autonomy claim in cost-shaped disguise. The damages are the monetary quantification of the lost choice.
  *   **The Benefits-Offset Rule:**
      *   *On Autonomy Reading:* The offset makes sense as a mitigation of damages. You sought the benefit of parenthood (autonomy); you received it (albeit not as planned). You cannot claim the cost of the benefit you accepted, only the "defective delivery" costs.
      *   *On Welfare Reading:* The offset is incoherent if the disability renders the life a net burden.
      *   **Conclusion:** The benefits-offset rule reveals the law is trying to have it both ways: acknowledging the burden (extraordinary costs) while maintaining the dignity of the life (ordinary costs offset).

  ### III. Complication 2: The Asymmetry and the Statutory Reform

  **The Asymmetry Question:**
  Does the pattern presuppose the Asymmetry (we have reasons to prevent pain, but no reasons to create pleasure)?
  *   **Current Practice:** It *functions* in accordance with the Asymmetry without *admitting* it.
      *   It denies the child's claim (no duty to create the "pleasure" of non-existence/not being born).
      *   It allows the parents' claim (duty to prevent the "pain"/costs of disability).
  *   **Does it presuppose it?** No. It could theoretically be justified by a "Person-Affecting View" (only existing people can be harmed) without accepting the Asymmetry. The Asymmetry explains *why* we might feel the child's claim is wrong, but the Legal Personhood constraint explains *why the court says* it is wrong.
  *   **Could the Asymmetry be true while the practice is correct?** Yes. The Asymmetry is a claim about moral reasons; the law is a claim about compensable injuries. One can accept the Asymmetry (no duty to prevent existence) while maintaining that once existence occurs, the costs imposed on third parties (parents) by negligence are compensable.

  **The Statutory Reform:**
  *Stipulation:* Action allowed only if life is foreseeably *not* worth living; damages = shortfall below threshold; paid to care fund.
  *   **Interaction with Implicit Theory:** This reform shatters the "Ontological Constraint." It admits that a child *can* be wronged by being born. It concedes that existence *can* be compared to non-existence.
  *   **Coherence:** This creates a **Threshold Theory of Harm**. It resolves the "dignity" objection by limiting claims to only those lives where dignity is arguably absent (not worth living).
  *   **Change in Damages:** By paying into a fund rather than to the child/parents, it removes the "profit" motive and frames the damages as **restorative care** rather than **compensation for loss**. This sidesteps the "benefits offset" problem: if the life is below the threshold, there are no "benefits" to offset the costs.

  ### IV. If the Asymmetry Were Built Into Law

  If the law explicitly accepted the Asymmetry (and the associated Non-Identity insights) as its foundational philosophy, the following changes would be required:

  1.  **The Child's Action:** It would likely *still* be refused, but for a different reason. Currently, it is refused because "non-existence is not a baseline." Under the Asymmetry, it is refused because "there is no duty to confer the benefit of non-existence." The outcome is the same, the rationale shifts from metaphysical impossibility to moral asymmetry.
  2.  **The Offset Rule:** This would likely **vanish or weaken**. If the Asymmetry holds, the presence of pleasure (benefits of life) does not morally cancel out the presence of pain (costs of disability). Therefore, offsetting the costs of care against the "joy" of the child becomes philosophically untenable. Parents should recover full extraordinary costs without deduction.
  3.  **Treatment of the Healthy Unplanned Child:** Under a strict Asymmetry, the birth of a healthy child involves no "harm" (no pain imposed), only a failure to confer a benefit (the benefit of not being born, which is not a duty). Thus, recovery for a healthy child would be **denied entirely**, even for pregnancy costs, unless framed strictly as physical battery on the mother. The current split in jurisdictions would resolve toward "no recovery for rearing," consistent with the view that a healthy life is never a legal injury.
  4.  **Damages Measurement:** Damages would shift from "loss relative to a baseline" to "costs of mitigation." Since the "baseline" of non-existence is inaccessible, the law would focus entirely on the **needs of the existing person**. This aligns with your statutory reform example (payment to a care fund).

  ### V. Final Coherence Verdict

  The existing common-law pattern is **philosophically incoherent but legally robust**.

  *   **Incoherence:** It relies on the claim that existence cannot be compared to non-existence for the child, while simultaneously relying on that comparison to calculate the parents' damages (in the "no child" counterfactual). It claims life is a benefit to offset ordinary costs, yet treats the disability as a loss sufficient to warrant extraordinary damages.
  *   **Robustness:** It survives because it serves distinct social policies: protecting the dignity of the disabled (denying the child's claim), protecting family autonomy (allowing parents' claim), and preventing windfalls (the offset rule).

  The pattern is not committed to a single philosophical truth. It is a **pragmatic compromise** between the Person-Affecting View (for the child) and a Financial Loss View (for the parents). It avoids the Non-Identity Problem not by solving it, but by refusing to let the child raise it. The statutory reform you propose is more philosophically honest (admitting the comparison is possible) but legally radical (admitting some lives are not worth living). The current law prefers the fiction that *no* comparison is possible over the risk of judging *which* comparisons justify damages.
