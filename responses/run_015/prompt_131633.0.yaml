answer: |-
  **To Shareholders of Cycles Ltd,**

  At Cycles, we operate on a simple premise: human preference is not a straight line, but a loop. While traditional finance assumes transitivity—that if you prefer A to B and B to C, you must prefer A to C—our data suggests otherwise. Our customers frequently prefer A to B, B to C, and then, after a small administrative fee, C to A. They end up where they started, slightly poorer, and infinitely more satisfied. We call this liquidity provision for diachronic inconsistency.

  **1. The Core Mechanism**
  Our revenue model relies on the money pump theorem. When a customer's preferences cycle over time, we facilitate the swaps required to align their holdings with their current mood. At t0, they want the Red Portfolio. At t1, they want Blue. At t2, they want Green. By t3, they want Red again. We charge a 2% friction fee per swap. Theoretically, a rational agent should refuse the loop. Practically, they enjoy the journey. We are not selling returns; we are selling the freedom to change one's mind without consequence, minus the fee.

  **2. Customer Segmentation**
  We categorise users into three distinct cohorts:
  *   **The Myopic:** These users accept every swap. They view each decision in isolation, unaware of the cycle. They are our primary revenue engine, generating high volume through repeated looping.
  *   **The Sophisticated:** These users perform backwards induction. They foresee the loop and refuse the initial trade. Since we cannot charge them for swaps they decline, we have successfully pivoted to charging them for "Planning Services." We sell them the foresight to avoid the pump, which is ironically profitable enough to offset the lost swap fees.
  *   **The Resolute:** These users adopt a plan at t0 and stick to it regardless of subsequent preference shifts. They are near impossible to monetise. Internally, we classify this segment as "The Dead." They contribute nothing to the top line and clutter our databases.

  **3. Compliance and Regulation**
  The Office for Diachronic Fair Trading (ODFT) mandates that we only profit from preference updates, not genuine changes of taste. The distinction is subtle: a preference update implies the same underlying utility function merely processing new information; a change of taste implies a new person. We have solved this compliance hurdle by defining the self as the sequence of choices itself. Therefore, any choice made at t1 is, by definition, the preference of the self at t1. Whether it matches the self at t0 is irrelevant. We document this continuity by ensuring the customer clicks "I Understand" at every step. The ODFT has yet to clarify why foreseeing the loop necessitates refusing trade one rather than trade three, nor have we asked them to. We simply bill for the uncertainty.

  **4. Product Innovation: Resolution-as-a-Service**
  Our flagship launch this quarter is *LockStep™*. Previously, sophisticated users avoided the pump by precommitting. We have closed this loophole by selling the commitment itself. Users pay an upfront fee to adopt a binding plan, and a subsequent amendment fee to alter it. The escape hatch from the pump has become the revenue line. Whether you pay to stay consistent or pay to change your mind, Cycles captures the value. It turns out rationality is a premium feature.

  **Key Performance Indicators**
  *   **Loop Completion Rate:** 88% (Target: 92%)
  *   **Sophisticate Conversion to Planning:** 45% (Target: 50%)
  *   **Resolute Churn:** 12% (Mostly data purges)
  *   **Average Revenue Per User (ARPU):** £450 (Up from £320)

  **Outlook**
  The only headwind remains the resolute segment. As customers become more rational, our addressable market shrinks. We are currently lobbying to classify stubbornness as a cognitive impairment, which would allow us to charge resolute users for guardianship services. Until then, we remain confident that inconsistency is the only true constant.

  Yours in liquidity,

  **Julian Vane**
  Founder & CEO, Cycles Ltd
