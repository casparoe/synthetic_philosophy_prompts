          *   Rank tensions by severity.
          *   Identify apparent vs. real tensions.
          *   Suggest the least costly revision.
          *   State confidence level.
          *   Identify the point of least certainty.

  2.  **Deconstruct the Commitments & Identify Tensions:**

      *   **(1) Non-naturalist Realism:** Moral facts exist independently of us.
      *   **(2) Evolutionary Debunking:** Our intuitions are shaped by fitness, not truth. This threatens the link between our beliefs and the facts in (1).
      *   **(3) Reflective Equilibrium (RE):** Start with intuitions, match with principles.
      *   **Tension (2) vs. (3):** RE traditionally relies on "considered judgments" (intuitions) as provisional data. If (2) says *all* core intuitions are suspect because of their origin, what data is left for RE? This is the "Sharon Street" style challenge. If the input is corrupted, the output is suspect.
      *   **(4) Asymmetry (Deontic vs. Axiological):** The claim is that evolution shaped *rules for action* (don't kill kin) more than *value perceptions* (suffering is bad).
          *   *Critique:* Evolution likely shaped both. Pain avoidance (axiological) is highly adaptive. However, one could argue that *objective* value is less tied to specific action rules. But if moral facts are non-natural (1), why would evolution track *any* of them? This distinction needs careful handling. It might be defensible if "good" is tied to well-being (which evolution tracks imperfectly) while "ought" is tied to specific tribal norms (which evolution tracks strictly for cohesion).
      *   **(5) Systematized Principles:** Knowledge comes from principles that survive equilibrium, not raw intuition.
