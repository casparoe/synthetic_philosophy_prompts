      *   **Context:** The user is designing a secondary-school ethics curriculum.
      *   **Problem:** They are grappling with the authority of moral norms given their evolutionary origins (Evolutionary Debunking Arguments - EDAs).
      *   **User's Stance (5 Commitments):**
