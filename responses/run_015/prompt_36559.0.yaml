  *Soft Spot:* Conceding authorship might embolden them to dismiss *De Regno* entirely, forcing reliance on the *Summa*, where tyrannicide application is less explicit.

  **2. Objection: The Community as Public Authority**
  *Objection:* "You argue authority is underdetermined regarding usurpers. But in *ST* II-II, q. 42, a. 2, ad 3, Thomas says resisting a tyrant is not sedition if he lacks just title. Does this not imply the community retains latent public authority to remove him, including by lethal force, resolving the underdetermination?"
  *Reply:* Aquinas distinguishes between resisting a usurper and killing a ruler. While deposition might be permissible for a usurper, *occisio* requires judicial sentence, not just defensive force. Aquinas never explicitly grants the community the *judicial* power to execute without a superior. He leaves open whether 'public authority' requires a higher emperor or the community itself. Later theorists split exactly here. Thomas's silence is the gap, not a resolution. Consider the distinction between *vis defensiva* and *sententia mortis*. A community may defend itself against an aggressor. But killing as punishment requires jurisdiction. Does the community possess jurisdiction over itself in capital cases without a superior? Thomas does not say. To say Thomas resolves this is to read Suarez back into Thomas. I argue the silence is structural, allowing later scholastics to fill the vacuum according to their ecclesiological commitments. The fact that Suarez needs to argue for it proves Thomas didn't settle it.
  *Soft Spot:* If they press that deposition *implies* execution in extremis, I lack an explicit Thomas text forbidding community execution specifically, only general principles against private killing.

  **3. Objection: Novelty vs. Commentary**
  *Objection:* "Is your thesis not merely a restatement of the standard commentary tradition, specifically Eschmann's 1946 analysis? You claim underdetermination, but commentators have long noted Thomas's ambiguity. What is the distinct contribution here?"
  *Reply:* Standard commentary treats the ambiguity as a hesitation or pastoral caution. I argue it is a structural feature of his jurisprudence regarding authority. The novelty lies in linking this underdetermination directly to the later reception wars. It explains *why* Bellarmine and the monarchomachs could both cite Thomas legitimately. It's not just that he was vague; it's that his framework necessitated later specification he refused to give. I'm tracing the generative ambiguity, not just noting the silence. Eschmann notes the ambiguity but treats it as a problem to be solved by choosing the correct text. I treat it as a feature that generated a tradition. The difference is between seeing a gap as a failure of completion versus seeing it as a space for juridical development. This reframes the reception not as a corruption of Thomas, but as a working out of implicit tensions in his own account of authority and law. This shifts the focus from Thomas's intent to the text's operational logic in subsequent controversies.
  *Soft Spot:* If they know Eschmann cold, they might see the distinction as hairsplitting. I need to stand firm on the "generative" aspect vs. mere "ambiguity."
