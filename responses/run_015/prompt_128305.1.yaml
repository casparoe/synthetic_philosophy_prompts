answer: |-
  Graduates, families, faculty, and honored guests, and specifically to the representatives of the watershed community, the descendants of the founding laborers, and the proxies for the future cohort seated among us: welcome. It is traditional at this hour to speak about the future, to imagine the paths you will walk once you leave this campus. But today, given the unique ground we stand on, I invite us to speak first about the boundaries of the present. For most of this university's history, the question of who belongs here was simple. You enrolled, you paid tuition, you were hired, you belonged. Everyone else was a visitor. But with the adoption of the Nested Demos Charter, we have acknowledged that the walls of this institution are more porous than we admitted, and that the circle of those who deserve a voice in our collective life is wider than the roster of enrolled students.

  We are gathered under a new experiment. We have granted formal deliberative standing to the residents whose water sustains us, to the families whose ancestors laid our bricks in the eighteen nineties, and to the teenagers who will inherit the consequences of the research we prioritize today. I know that for many in the audience, this language of standing and charters feels abstract. But for the philosophers among us, this is the boundary problem made flesh. It is the question of who counts, written into policy. And I must be clear, because clarity is the first duty of a university: this Charter does not solve that problem. It does not offer a neat theoretical resolution to the tensions between being subject to coercion and having affected interests. It is provisional. It is messy. The watershed residents hold veto power over our environmental policy but not our curriculum; the future cohort can propose research agendas but cannot vote on tuition. These asymmetries are not oversights. They are acknowledgments that different kinds of harm and different kinds of contribution require different kinds of protection. We have not built a perfect democracy here. We have built a structure that admits its own imperfections.

  I tell you this not to dampen our celebration, but to define the nature of the education you have received. You have studied in a place that refused to offer you the comfort of simple answers. To walk this campus under the Charter is to accept that justice is not a destination where all conflicts are resolved, but a practice of negotiating conflicting obligations. You have learned that the people most affected by your decisions may not be the people sitting in the room with you. They may be upstream. They may be in the past. They may not be born yet. This is a heavy realization. It is much easier to believe that democracy is simply about counting the hands of those present. It is harder to understand that true deliberation requires listening to voices that cannot speak for themselves, represented here by proxies and structures rather than by ballots.

  And so, as you depart, my charge to you is not that you will go out and fix the world. The world is too vast, and the boundary problem is too deep for any single generation to solve. My charge is that you will not retreat from the complexity you have witnessed here. When you enter your professions, whether in law, medicine, engineering, or the arts, you will encounter institutions that draw sharp lines around who matters. You will find boards that answer only to shareholders, or governments that listen only to voters, or communities that protect only their own. You will be tempted to accept those boundaries as natural or inevitable. I ask you to resist that temptation. Not by trying to erase all boundaries, which is impossible, but by questioning where they are drawn and who is excluded by them.

  There will be times when you seek to do good and find that your actions create harm elsewhere. You will find that solving a problem for one group creates a burden for another, perhaps for someone far away or someone yet to come. In those moments, do not despair that your work is imperfect. Remember the Charter. Remember that we granted standing without granting full equality, that we gave vetoes on some issues but not others. We did this because we understood that waiting for perfect consistency would mean doing nothing at all. The work of citizenship is not to achieve a state of pure justice, but to manage the tensions of imperfect justice with honesty and care.

  To the families here today: you may wonder why we complicated this day with political theory. You came to see your children celebrated. But look at them. They are leaving an institution that taught them to hold multiple truths at once. They have learned that their freedom is tied to the water table miles away, that their heritage is tied to labor performed a century ago, and that their success is tied to the wellbeing of strangers fifteen years in the future. This is not a burden to carry alone; it is a lens through which to see the world more clearly. They are equipped to navigate a world where problems do not respect borders.

  To the graduates: you are entering a society that is deeply concerned with who belongs. You know now that belonging is not just about identity, but about responsibility. You know that the demos is not a fixed thing, but a project we build together. You will face choices where the right thing to do is unclear, where the stakeholders are invisible, where the costs are deferred. Do not look for a rulebook that tells you the answer. There is no rulebook. There is only the work of deliberation, the courage to acknowledge those who are excluded, and the humility to know that your own standing is provisional. Go forth and build communities that are brave enough to admit who is missing from the room. Go forth and negotiate boundaries with the understanding that they will shift again. And know that even when you are gone, even when you are no longer here, this institution will remain accountable to the water, to the past, and to the future. May you hold yourselves to the same standard. Congratulations.
