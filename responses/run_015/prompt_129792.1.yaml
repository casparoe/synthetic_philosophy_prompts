          1.  Numbered list of agreed claims.
          2.  Disagreements table (Szaszian wording vs. Realist wording).
          3.  Cruxes (with concrete scenarios, predictions, and verbal disagreement check).
          4.  Confidence statement (highlighting uncertainty about voluntary vs. involuntary outcomes).
      *   **Constraints:** No fake citations/quotes (paraphrase if unsure), no web access needed for citations, specific focus on epistemic asymmetry (1st person vs. 3rd party) and "problems in living" vs. "disorders of agency."

  2.  **Deconstruct the Positions:**
      *   **Szaszian Libertarian:**
          *   Core: "Mental illness" is a category error. Minds aren't bodies, so they can't be "ill" in the medical sense.
          *   Ethics: Coercion (involuntary commitment) is imprisonment, not treatment. Violates the contractual nature of medicine.
          *   Epistemology: Only the individual knows their pain. Third-party observation of "danger" is value-laden judgment.
          *   Alternative: "Problems in living." Legal/ethical frameworks, not medical ones.
      *   **Clinical-Phenomenological Realist:**
          *   Core: Distress isn't just "brain lesions" (rejects hard biomedical reductionism) but *is* a disorder of embodied agency and world-relation.
          *   Ethics: When agency is severely disrupted (e.g., psychosis mania), non-interference can be harmful. Paternalism is sometimes justified to restore agency.
          *   Epistemology: First-person authority is compromised when the self-structure is fragmented. Third-party observation captures behavioral disintegration the patient cannot see.
          *   Alternative: Care that respects the person but acknowledges the pathology of the *experience* itself.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but collaborative. "Adversarial Collaboration Protocol: The Ontology and Ethics of Psychiatric Coercion."
      *   **Section 1: Agreed Claims:** Find the common ground. Both hate biological reductionism (Szasz hates it because it's a myth, Realist hates it because it ignores phenomenology). Both acknowledge suffering is real. Both agree DSM is flawed. Both agree history is bloody.
      *   **Section 2: Disagreements Table:** Contrast the language.
          *   *Diagnosis:* Myth/Label vs. Phenomenological Pattern.
          *   *Coercion:* Imprisonment vs. Protective/Restorative Intervention.
