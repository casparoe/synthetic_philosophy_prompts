          *   *Crux 3: Biomarkers vs. Ontology.* Does lack of a lab test mean it's not real? Scenario: Functional Neurological Disorder or severe dissociation.
          *   *Verbal Disagreement Check:* Is "Illness" the sticking point? Yes.
      *   **Section 4: Confidence & Uncertainty:** Must explicitly state confidence levels and flag the messy data on outcomes.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I capture the "phenomenological" aspect of the Realist? *Correction:* Ensure the Realist isn't just a "biopsychiatrist." They need to argue about *agency* and *world-structure*, not just serotonin.
      *   *Check:* Did I address the "epistemic asymmetry" in commitment hearings? *Correction:* Add specific language about how the Szaszian sees the hearing as a kangaroo court and the Realist sees it as an imperfect but necessary intersubjective check.
      *   *Check:* Are the scenarios concrete? *Correction:* Instead of "a patient," use "A 24-year-old in manic episode refusing sleep, spending life savings."
      *   *Check:* Quotes? *Correction:* Avoid direct quotes from Szasz's *The Myth of Mental Illness* to avoid misquoting. Paraphrase the "diseases of the brain" vs. "problems in living" distinction.
