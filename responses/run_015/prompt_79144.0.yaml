  *(Self-Correction Note on "Early Modern":)* The user is an early modernist. I should tailor the examples slightly towards state formation, inquisitions, or colonial records where relevant, rather than just 20th-century examples, though the prompt uses Civil War/Germany examples. I will keep the theoretical framework general but acknowledge the early modern context of 'state capacity'.

