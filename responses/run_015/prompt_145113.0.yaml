answer: |-
  Your ranking machinery presupposes a capacity-weighted utilitarian framework where moral significance scales with the magnitude of possible experience rather than intrinsic status, strictly requiring only that welfare is aggregable, comparable across species, and correlated with physical proxies, while leaving underdetermined whether the good is hedonic or preferential and whether moral standing is gradual or threshold-based above a cognitive floor.

  The implicit theory of moral status is binary at the gate but gradual thereafter: sentience is the necessary condition for entry (captured by your probability estimate), but once inside the moral circle, an entity's claim on resources is proportional to its capacity for welfare (captured by the multiplier). This is distinct from a hierarchical view of moral status, which would hold that some species are inherently less valuable regardless of their experiences. Your practice instead adopts a view of "weighted interests": a pig's interest in avoiding pain counts for more than a chicken's not because the pig matters more as a being, but because the *magnitude* of the pain it can suffer is greater. The distinction turns on whether you are weighting the *bearer* of interests (hierarchical status) or the *weight* of the interests themselves (capacity weighting). Your spreadsheet commits you to the latter; critics often hear the former. To maintain consistency with treating humans as equals, you must adopt a threshold view of moral status: all humans exceed a cognitive ceiling where capacity differences no longer generate moral weight differences, whereas non-human animals fall on the sliding scale below that ceiling. Without this threshold claim, your refusal to rank humans by neuron count is inconsistent with your ranking of animals.

  Regarding welfare, your practice presupposes hedonic or preference utilitarianism that accepts inter-species comparability. It assumes welfare is a quantifiable substance that can be summed across individuals and that there exists a common metric (the human baseline) allowing comparison between species. However, the practice is philosophically underdetermined on several fronts. It does not settle whether welfare consists in pleasure minus pain (hedonism) or the satisfaction of preferences (preferentialism), as both can be modeled by a range multiplier. It does not settle whether you are maximizing net welfare or minimizing suffering (classical vs. negative utilitarianism), provided the multiplier scales both positive and negative extremes. It also does not strictly require neural metrics; it only requires that *some* physical or functional proxy correlates with welfare capacity. Neural counts are an epistemic choice, not a moral axiom. You could swap neuron counts for behavioral complexity scores without altering the underlying moral theory, only your measurement methodology.

  If you accept the first challenge (human equality) without adopting the threshold view, you must abandon the multiplier entirely and count every sentient individual as one, shifting from capacity-weighted utilitarianism to egalitarian welfarism. This would drastically redirect funding toward species with larger populations (chickens, fish) regardless of brain size. To keep the multiplier while respecting human equality, you must explicitly argue that human neural variance is morally irrelevant because all humans exceed the maximum welfare capacity relevant for moral weighting, whereas animals do not.

  If you accept the second challenge (affective granularity), you must change your measurement proxies from neuroanatomy to cognitive ethology. This shifts your epistemic stance from physicalism (welfare is determined by brain hardware) to functionalism (welfare is determined by computational or state-space complexity). The moral theory remains capacity-weighted utilitarianism, but your spreadsheet inputs change: birds might rise in ranking not because they have more neurons, but because their neural architecture supports a richer taxonomy of affective states. You would need to justify why state-space richness tracks moral weight rather than raw processing power.

  If you accept the third challenge (subjective time), you must alter your calculation of duration from objective clock time to subjective temporal resolution. This implies that welfare is a sum of experienced moments, not a function of external duration. If a shrimp experiences ten subjective moments for every one human moment, its welfare range per objective minute is multiplied accordingly. This does not change the moral theory but drastically alters the cost-effectiveness numbers, potentially boosting fast-metabolism invertebrates. To implement this, you would need to measure critical flicker fusion frequencies or metabolic rates as proxies for subjective time grain, and you would need to defend the view that moral weight accumulates per experience rather than per objective second.
