  **Note to Applicant: Feedback on Your Core Distinction**

  Your intuition is correct: the literature conflates these two values, and prising them apart is a viable wedge. However, "Blindness" and "Equal-Chance" risk sounding slightly naive to a mixed committee. "Blindness" can be misread as mere ignorance (the statue of Justice) rather than *procedural impartiality*. "Equal-Chance" sounds like a gambling metaphor rather than a claim about *political equality*.

  For the proposal, I recommend sharpening the terms to **Procedural Impartiality** (the mechanism does not discriminate among those *in* the pool) and **Universal Ex Ante Equality** (every citizen has an equal probability of entering the pool). This maps your philosophical insight onto political science concerns about *selection bias* and *population validity*. The proposal below uses these refined terms to maximize interdisciplinary legibility while preserving your core argument about the "Urn Problem."

  ***

  # PROJECT PROPOSAL

  **Title:** The Urn Problem: Voluntary Participation and the Normative Foundations of Sortition
  **Duration:** 10 Months
  **Applicant:** [Your Name]

  ### 1. Research Question and Motivation
  **The Question:** Does the normative justification for political sortition require compulsory participation to satisfy demands of political equality, or does voluntary participation suffice for procedural impartiality?

  **Motivation for Institutional Design:** For political scientists and practitioners, this project addresses a validity crisis in deliberative mini-publics. Current designs assume that random selection from a volunteer pool yields a representative sample. If self-selection correlates with socio-economic status, political efficacy, or polarization [Empirical Placeholder: verify correlation strength in existing assembly data], the "random" element is illusory. Designers need to know whether the legitimacy of these bodies rests on the *draw* itself or the *composition of the urn*. If the latter, the standard model of incentivized volunteering is normatively unstable compared to a jury-duty model.

  **Motivation for Political Philosophy:** For philosophers, this project disentangles two distinct rationales for sortition that are frequently conflated: **Procedural Impartiality** (the selection mechanism is insensitive to irrelevant traits like wealth or faction) and **Universal Ex Ante Equality** (every citizen has an identical probability of selection). These values can come apart. A lottery over volunteers is impartial *within* the pool but fails universal equality *across* the population. Conversely, a compulsory roster ensures equality but imposes a liberty cost. This project determines which value is essential to the core claim that "sortition is democratic."

  ### 2. Critique of Standard Defenses
  Current defenses of sortition leave the "Urn Problem" unresolved:
  *   **The Epistemic Argument:** Claims sortition leverages cognitive diversity. This assumes the volunteer pool retains sufficient diversity relative to the population. If volunteering correlates with specific epistemic styles (e.g., high verbal confidence), the epistemic benefit is compromised.
  *   **The Anti-Faction Argument:** Claims sortition prevents campaign finance and party machinery from determining office. However, if the "urn" is filled only by those with the free time and resources to volunteer, economic factionalism re-enters at the stage of pool formation.
  *   **The Mirroring Argument:** Claims the assembly should descriptively represent the populace. Voluntary pools systematically fail this test without aggressive stratification, which undermines the "random" claim.

  None of these defenses explicitly address whether the *voluntary nature* of the urn invalidates the mechanism. They assume the pool is a neutral background; this project treats the pool constitution as the primary variable.

  ### 3. Methodology and Approach
  This project employs **Normative Institutional Analysis**. It avoids three common pitfalls:
  1.  **Pure Conceptual Analysis:** Insufficient, because the normative weight depends on the *degree* of self-selection bias. [Empirical Placeholder: magnitude of bias in recent citizens' assemblies].
  2.  **Formal Modeling:** While useful for mechanism design, modeling cannot resolve the normative question of whether political equality *requires* compulsion.
  3.  **Descriptive Case Studies:** Existing studies document *that* bias exists, but not *whether* that bias renders the institution illegitimate.

  Instead, I will treat the empirical premises as parameters for a normative model. I will establish the threshold of bias at which a voluntary urn fails the test of Universal Ex Ante Equality, and then assess whether Procedural Impartiality can sustain the justification alone.

  ### 4. Work Plan and Deliverables (10 Months)

  **Months 1–2: Conceptual Framework**
  *   Define Procedural Impartiality vs. Universal Ex Ante Equality.
  *   Map existing arguments for sortition onto these two categories.
  *   *Deliverable:* Internal working paper on taxonomy of sortition justifications.

  **Months 3–5: The Empirical-Normative Interface**
  *   Review data on volunteer demographics in recent mini-publics [Empirical Placeholder: compile datasets from OECD/involve databases].
  *   Determine if self-selection correlates with "reasons for preference" (e.g., expertise, virtue) or "irrelevant traits" (e.g., wealth,闲暇).
  *   *Deliverable:* Draft paper section on "The Composition of the Urn."

  **Months 6–8: The Compulsion Question**
  *   Analyze the jury-duty model vs. the volunteer model.
  *   Assess the liberty cost of compulsory political service against the equality gain.
  *   Determine if a "hybrid" model (random invitation with compulsory response) is normatively superior.
  *   *Deliverable:* Draft paper section on "Liberty, Equality, and the Duty to Serve."

  **Months 9–10: Synthesis and Dissemination**
  *   Integrate findings into a final manuscript.
  *   Prepare a policy brief for practitioners designing citizens' assemblies.
  *   *Deliverable:* Complete manuscript (40,000 words) and 2-page Policy Brief.

  ### 5. Possible Conclusions and Decision Criteria
  The project will argue for one of three positions, decided by the analysis in Months 3–5:
  1.  **The Strong Equality View:** If self-selection bias is high and correlates with political power, Universal Ex Ante Equality is necessary. *Conclusion:* Sortition requires compulsory pools (jury-style).
  2.  **The Impartiality View:** If the primary value is breaking factional control, and volunteering does not reintroduce factionalism, Procedural Impartiality suffices. *Conclusion:* Voluntary pools are legitimate; equality is secondary.
  3.  **The Hybrid View:** If compulsion is too costly to liberty but volunteering is too biased, a middle ground is required. *Conclusion:* Random invitation with mandatory response (opt-out only for hardship).

  **Decision Criteria:** The choice depends on whether the "Urn Problem" is deemed a *correction error* (fixable by weighting) or a *constitutive flaw* (invalidates the claim to represent "the people").

  ### 6. Risk Assessment and Failure Conditions
  **Failure Conditions:** The project fails if the distinction between Impartiality and Equality collapses (i.e., if one logically entails the other) or if the empirical premises regarding self-selection are fundamentally unknowable due to data scarcity.

  **Risk of Scope Creep:** The primary risk is the normative analysis of compulsion. Defending a "duty to serve" is a massive project in itself.
  *Mitigation:* I will not argue *for* compulsion as an all-things-considered political proposal. I will argue conditionally: *If* equality is the goal, *then* compulsion is required. The project delimits the trade-off rather than solving the broader political feasibility of mandatory service. This ensures the project remains within the 10-month timeframe.
