  I'm presenting a seminar paper defending a hybrid position in accuracy-first epistemology: the global Brier-score maximization model should be replaced by a path-dependent accuracy metric, where the epistemic value of a credence is fixed by how it improves the agent's actual belief-revision trajectory relative to their genuine prior state, constrained by a stability condition that excludes credences that reach high accuracy only through accidental convergence with the world rather than sustained calibration. The audience is a philosophy of science seminar of about twelve: mostly formal epistemologists who treat epistemic utility as Brier-score maximization and expect coherence theorems, one decision theorist who knows the scoring-rule derivations inside out, and two philosophers of science skeptical that formal epistemology captures actual scientific reasoning. Draft my Q&A prep sheet: the six objections I'll actually face, ordered by likely damage, each phrased as that specific audience member would phrase it (the Bayesian confirming theorist, the decision theorist, the skeptic), with a two-minute reply and an explicit note on where that reply is weakest. State clearly what I should concede up front about the standard global framework and what I must hold about path-dependence. Include the objection I am hoping nobody asks—specifically, whether my stability constraint collapses back into a hidden global rule that evaluates trajectories against all possible worlds in disguise. Do not include bibliographies, reading lists, or citations; I need to defend this live without relying on specific papers.
