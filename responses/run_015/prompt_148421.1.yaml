prompt: |-
  I'm a novelist — three books out, fourth one a year overdue — and I've managed to turn what should be a plotting problem into something I apparently need a philosopher for. My protagonist is a 54-year-old night maintenance foreman at a poultry plant in northeast Georgia who has spent twenty-two years keeping his head down, and then testifies against the company in an injury lawsuit knowing he'll never be hired in that county again. I can't decide how to write the change. Either he was always the kind of man who would do that, and the story is about how the thing was starved in him for two decades and then finally got what it needed; or he was made into that man by a long sequence of small deliberate acts — the union organizer who kept showing up, the night classes, the private ritual he never skips of reading the safety log aloud to an empty break room — and the change is not a discovery but a construction. Someone in my writing group who did a philosophy degree says this is exactly the old fight between Mencius and Xunzi over human nature: Mencius thinks we come furnished with four sprouts of goodness that need nourishment and can be smothered by circumstance, like a hillside stripped bare by axes and grazing animals, while Xunzi thinks our raw endowment is crooked and everything good in us is artifice, bent into shape by teachers, ritual and accumulated effort, like warped wood steamed straight. She insists they really disagree; I honestly can't tell whether it's a genuine fight or two people using the word nature to mean different things, and I'd like to find out without being sent off to read anything, because I'm on deadline in a cabin with bad wifi and no library.

  What I'd actually find useful is a translation rather than an explanation. Here's the vocabulary I really think in: the character bible rather than the character; backstory versus premise (what's simply given about a person versus what the book is arguing); in-character and out-of-character; the workshop rule against an unearned turn; voice as the thing that constrains what a character can credibly do; habituation by repetition; discovery writing versus outlining; and revision, by which I mean the long stupid process of going back and retrofitting chapter two so that chapter nine stops feeling like a cheat. My old workshop teacher also used to separate turning points from turnings — a turning point is where new information arrives and the plan changes, a turning is where someone becomes a person the earlier version of themselves wouldn't recognize — and she claimed you can only ever write the second kind by seeding it in chapter one, that you can't write a turning you can't already hear in the voice. So: restate each of the two positions in those terms, as faithfully as you can, and then give me the residue report. What in Mencius translates cleanly onto how I build a person on the page, and what has to be fudged to fit? Same for Xunzi. What has no counterpart in my vocabulary at all? One thing that's already bugging me: when I build a character there is literally an author, me, standing outside the person, deciding what counts as raw material and what counts as the training I put them through — and I can't tell whether that role corresponds to anything on either side of the dispute, or whether mapping it onto something (Heaven, the old sage-kings, the rituals themselves) is exactly the move that decides who wins. Please don't just tell me both of them agree that cultivation matters and leave it there; I got that far by myself. What I want to know is whether what's left over after the translation is a hole in my craft vocabulary, or a sign that the philosophers are fighting over something thinner than it looks. (Sorry if any of the names are spelled wrong, and definitly sorry for the length — I've been chewing on this alone for a year.)
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist (3 books published, 4th overdue). Practical, craft-oriented, deadline-driven, stuck in a cabin with bad wifi/no library.
      *   **Problem:** Deciding on the arc of a protagonist (54yo maintenance foreman, poultry plant, GA). Is his moral courage *innate but suppressed* (Mencius) or *constructed through habit/ritual* (Xunzi)?
      *   **Constraint:** Do *not* send them to read primary texts. Do *not* give a generic "both say cultivation matters" answer.
      *   **Task:** Translate Mencius and Xunzi into the user's specific craft vocabulary (character bible, backstory vs. premise, in/out-of-character, unearned turn, voice, habituation, discovery vs. outlining, revision, turning points vs. turnings).
      *   **Specific Question:** What translates cleanly? What has to be fudged? What has no counterpart? Does the author's role (standing outside) map to anything, or does mapping it decide the winner? Is the leftover residue a hole in craft vocabulary or a sign the philosophical fight is thinner than it looks?
      *   **Tone:** Respectful of the craft, precise, avoiding academic fluff, acknowledging the pressure/deadline.

  2.  **Deconstruct the Philosophical Positions (Mencius vs. Xunzi):**
      *   *Mencius:* Human nature is inherently good (sprouts). Badness comes from external damage/neglect. Cultivation is *nourishing* what is already there.
      *   *Xunzi:* Human nature is inherently self-interested/chaotic (crooked wood). Goodness is *artificial* (constructive). Cultivation is *bending/straightening* through ritual/teachers.
      *   *The Conflict:* Is morality discovery (uncovering) or invention (building)?

  3.  **Map to Craft Vocabulary:**

      *   **Mencius $\rightarrow$ Discovery Writing / Character Bible:**
          *   *Core:* The "truth" of the character exists prior to page one.
          *   *Backstory:* The 22 years of head-down behavior are *suppression*, not the true nature.
          *   *Voice:* The voice in Ch 1 must contain the "sprout" (the courage) even if muted.
          *   *Turning:* A *turning* is inevitable if the sprout is watered. It feels "earned" because it was always there.
          *   *Revision:* Retrofitting Ch 2 to match Ch 9 is *revealing* the pattern, not creating it.
          *   *Risk:* If the sprout isn't visible in Ch 1, the turning feels unearned (deus ex machina of the soul).

      *   **Xunzi $\rightarrow$ Outlining / Construction:**
          *   *Core:* The "truth" of the character is built by the plot events.
          *   *Backstory:* The 22 years are the *raw material* (crooked wood). The change is a break from the past self.
          *   *Voice:* The voice in Ch 1 is the "before" state. The Ch 9 voice is a *new instrument*.
          *   *Turning:* A *turning* is a rupture. The earlier self *would not* recognize the later self.
          *   *Revision:* Retrofitting Ch 2 is laying the *scaffolding* for the construction.
          *   *Risk:* If the construction isn't shown (the union organizer, the rituals), the turning feels fake (melodrama).

  4.  **Address the "Author Role" Question:**
      *   The user asks: *I am the author standing outside. Does this map to Heaven/Sage-Kings/Ritual?*
      *   *Analysis:* This is the crux. In fiction, the author is God. In Mencius, Heaven gives the sprouts. In Xunzi, Sage-Kings invented Ritual.
      *   *Mapping:*
          *   If you write like Mencius, you are acting as *Gardener* (facilitator). You trust the character.
          *   If you write like Xunzi, you are acting as *Architect/Engineer* (imposer). You discipline the character.
      *   *Does mapping decide the winner?* Yes, because it defines the *source of authority* in the text. Is the authority internal (character's truth) or external (plot's necessity)?

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the deadline and the quality of the question. Validate the writing group friend's insight but pivot to the craft translation.
      *   *Section 1: Mencius (The Discovery Model).* Use terms like "Character Bible," "Voice," "Turning." Focus on the idea that the ending is hidden in the beginning.
      *   *Section 2: Xunzi (The Construction Model).* Use terms like "Outlining," "Habituation," "Unearned Turn." Focus on the idea that the ending is built against the beginning.
      *   *Section 3: The Residue Report (What fits/what doesn't).*
          *   *Mencius Fit:* "Voice as constraint." If the courage isn't in the voice, it's a lie.
          *   *Mencius Fudge:* "Backstory." Mencius says damage is external; craft says backstory *is* character.
          *   *Xunzi Fit:* "Revision as retrofitting." This is pure Xunzi. Making Ch 2 support Ch 9 is artificial straightening.
          *   *Xunzi Fudge:* "In-character." Xunzi demands the character become someone the old self wouldn't recognize. Craft worries this feels "out-of-character."
      *   *Section 4: The Author Question.* This is critical. The author *is* the external force.
          *   If you feel like you are *finding* the ending, you're writing Mencius.
          *   If you feel like you are *forcing* the ending, you're writing Xunzi.
          *   *The Verdict:* The fight isn't thin; it's about *authority*.
      *   *Section 5: The Recommendation.* Don't pick a side philosophically. Pick the side that solves the *plot hole*.
          *   Is the problem that Ch 9 feels sudden? (Need more Mencius seeding).
          *   Is the problem that Ch 1 feels too passive? (Need more Xunzi friction).

  6.  **Refining the Tone:**
      *   Keep it tight. No fluff.
      *   Use the user's specific examples (poultry plant, safety log).
      *   Ensure the distinction between "Turning Point" (plot) and "Turning" (character) is utilized.
      *   Address the "hole in craft vocabulary" vs "thin fight" question directly at the end.

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I explain the philosophy? *No, translated it.* Good.
      *   *Check:* Did I answer the author role question? *Yes, need to make sure it's clear.*
      *   *Check:* Is the distinction clear? *Mencius = Uncovering. Xunzi = Forging.*
      *   *Check:* Did I address the "residue"? *Yes, specifically regarding the Author's omniscience.*

  8.  **Final Polish:** Check against the user's specific constraint: "What has no counterpart in my vocabulary at all?"
      *   *Mencius:* The concept of "Heaven" (Tian) as a moral guarantor. In fiction, there is no moral guarantor except the reader's belief.
      *   *Xunzi:* The concept of "Sage Kings" who invented ritual. In fiction, this is the Genre/Convention itself.
      *   *Residue:* The fight is real, not thin. It's about *ontological status* of the character.

  9.  *(Final thought before writing)*: Make sure to validate the "overdue book" anxiety. Keep it encouraging but sharp.

  *(Self-Correction on the "Author Role" mapping)*: The user asks if mapping the author to Heaven/Sage-Kings decides the winner.
  *   If Author = Heaven (Mencius): The character has autonomy. The author serves the character.
  *   If Author = Sage-Kings (Xunzi): The character is material. The author serves the Theme/Plot.
  *   This is a crucial distinction for a novelist. I need to highlight this.

  10. **Final Review against constraints:**
      *   No reading lists.
      *   Use craft vocab (backstory, premise, voice, etc.).
      *   Address the residue.
      *   Address the author role.
      *   Keep it useful for a deadline.

