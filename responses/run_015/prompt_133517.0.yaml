prompt: |-
  I've been reading about Ubuntu and the idea that personhood is relatonal — that a person is basically constituted through other people rather than being an isolated individual. My gran's just moved into a care home with fairly advanced dementia, and she hardly recognises anyone anymore, so it's become personally relevant in a weird way: if her personhood literally depends on her relationships, does Ubuntu imply she's lost part of her personhood now those ties are broken? And if personhood can dissolve like that, wouldn't it undermine the claim that she still holds individual rights that can't just be overridden for the collective good? I feel like I'm mixing up being constituted by relations with actually needing constant social contact to count, but I'm not sure. Can you untangle whether Ubuntu makes personhood contingent on present relationships, and whether that actually threatens individual rights?

  End with a one-line verdict starting 'Verdict:' summarising the key correction.
