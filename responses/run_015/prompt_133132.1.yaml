answer: |-
  Three candidate principles fail your cases. *Graphical Causality* (adjust confounders, ignore mediators) breaks on Case 5 (identical graphs, opposite verdicts) and Case 6 (measure dependence). *Decision Theory* (maximize expected utility) breaks on Case 1 (truth precedes utility) and Case 7 (descriptive aggregation). *Statistical Homogeneity* (trust stable strata) breaks on Case 4 (spurious stability from noise) and Case 3 (selection bias). *The Sure-Thing Principle* (prefer subgroup consistency) breaks on Case 3 (stratifying on mediators) and Case 6 (non-collapsible measures).

  Adopt the **Interventional Measure Principle**:
  1.  **Estimand:** Define the target quantity as $P(Y|do(X))$ corresponding to the specific feasible policy intervention.
  2.  **Measure:** Use Risk Differences (RD) rather than Odds Ratios to ensure collapsibility.
  3.  **Adjustment:** Condition on covariate $Z$ if and only if $Z$ is a pre-treatment common cause of $X$ and $Y$; never condition on descendants of $X$.
  4.  **Validity:** Disregard subdivisions induced by post-hoc selection or data dredging.

  **Clause Notes:** (1) resolves Case 5: the interventions differ (admissions policy vs. title allocation), so the causal queries differ despite surface similarity. (2) resolves Case 6: RD is collapsible, so aggregation artifacts vanish. (3) resolves Cases 1, 2, 3: distinguishes confounders (stratify) from mediators (aggregate). (4) resolves Cases 4, 8: blocks collider bias and forking paths. Case 7 is excluded as composition bias, not Simpson's paradox.

  **New Cases:**
  (A) *Job Training:* Aggregate data shows training lowers wages; within skill strata, it raises them. Skill is a pre-treatment confounder. **Verdict:** Stratify (RD).
  (B) *Biomarker:* A drug improves survival, but among survivors, treated patients show worse biomarkers than controls. The biomarker is a post-treatment mediator. **Verdict:** Aggregate.

  **Critique of Your Verdicts:**
  I urge you to withdraw the claim in Case 5 that the admissions and pay scenarios are "structurally identical." If your verdicts differ, the causal graphs must differ: in admissions, department is pre-treatment; in pay, title is often post-hire (a mediator of discrimination). If title is pre-treatment, your aggregate verdict is wrong; if post-treatment, your stratified verdict is wrong. Consistency requires identifying the intervention.

  I also urge you to exclude Case 7 from this family. It involves no causal conflict, only changing weights; both statements are true, so no paradox exists. Finally, regarding Case 4, your uncertainty is justified but resolvable: adjusting on clinic code opens a collider path (clinic affects both treatment assignment and unmeasured severity), making the stratified estimate worse than the aggregate. Your principle must explicitly forbid adjustment on variables that are effects of treatment or colliders.
