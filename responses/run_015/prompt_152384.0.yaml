answer: |-
  **Activity Title:** The Axiological Lattice Breaker
  **Target:** 16 Philosophy Grad Students (4 groups of 4)
  **Time:** 90 Minutes
  **Goal:** Experiential demonstration of intransitivity in "better than" relations without invoking standard Sorites heaps.

  ### The Setup & Framing
  Don't call it "value theory." Call it **"Multi-Attribute Utility Calibration."** You're telling them they are training a decision algorithm for resource allocation under scarcity. The niche hook is that the goods are **incommensurable dimensions** that shift weight based on *proximity to a threshold*.

  **The Dimensions:**
  1.  **Qualia Density (QD):** Intensity of experience (0–100 scale).
  2.  **Temporal Cohesion (TC):** Continuity of narrative (0–100 scale).

  **The Trap:**
  You (the instructor) hold a deck of 10 "World State" cards. Each card has a QD and TC score.
  *   Cards 1–5: High QD, Low TC.
  *   Cards 6–10: Low QD, High TC.
  *   **Hidden Rule:** The valuation function isn't linear. For most comparisons, students trade off QD for TC smoothly. But there's a **Lexical Cliff** at QD = 50. Any state with QD > 50 is *automatically* ranked higher than any state with QD < 50, regardless of TC.
  *   However, within the >50 cluster, TC dominates. Within the <50 cluster, TC dominates.
  *   This creates a cycle: Card 5 (QD 51, TC 10) > Card 6 (QD 49, TC 90) is FALSE (because 51 > 49 lexical). But Card 1 > Card 2 > Card 3 > Card 4 > Card 5 (based on TC tradeoffs) and Card 6 > 7 > 8 > 9 > 10 (based on TC).
  *   Wait, that's not a cycle. That's just a break.
  *   **To get a cycle:** We need the weights to shift based on the *pair* being compared (context dependence).
  *   **Revised Hidden Rule:** The "Weight of TC" increases as the average TC of the pair increases.
      *   Compare A (High QD, Low TC) vs B (Med QD, Med TC). QD dominates. A > B.
      *   Compare B vs C (Low QD, High TC). TC dominates (because avg TC is higher now). B > C.
      *   Compare C vs A. TC is high enough that C > A.
      *   Cycle: A > B > C > A.

  ### Materials
  *   4 Decks of 6 Cards each (one per group).
  *   "Normative Unit" (NU) tokens (poker chips or paper slips). Start each student with 100 NU.
  *   Whiteboard for global tracking.

  ### Roles (per group of 4)
  1.  **Arbiter:** Flips the cards, enforces turn order.
  2.  **Scribe:** Records the judgment (A > B or B > A) and the NU wager.
  3.  **Auditor:** Watches for contradictions in real-time (but isn't allowed to speak until the Debrief).
  4.  **Proxy:** Actually makes the final call if the group deadlocks (rotates every 10 mins).

  ### The Payoff Scheme (The "Dutch Book" Mechanism)
  This is where they get skin in the game.
  1.  **Judgment Phase:** When comparing Card X vs Card Y, the group must wager up to 10 NU on their confidence.
      *   If they say "X is Better," they bet 5 NU.
      *   If they say "X is Strictly Better," they bet 10 NU.
  2.  **Consistency Check:** At the end, you reveal the "Global Lattice."
      *   For every **transitive triplet** (A > B, B > C, A > C) they got right, they gain 5 NU.
      *   For every **cycle** detected (A > B > C > A), they lose **all** NU wagered on those links.
      *   **Kicker:** If a cycle exists, the "Strictly Better" wagers are doubled in penalty.

  ### Timeline (90 Mins)

  **0:00–0:15 | Briefing & Calibration**
  Explain the QD/TC framework. Emphasize that there is no "correct" answer key, only "coherent" lattices. Hand out NU tokens. Tell them the goal is to maximize group NU by building a stable hierarchy. *Do not mention transitivity.*

  **0:15–0:60 | The Comparison Grind**
  Groups work through their deck. They must compare every card against every other card (pairwise).
  *   **Rule:** They have 2 minutes per pair.
  *   **Rule:** They must state *why* (e.g., "TC outweighs QD here").
  *   **The Shift:** The cards are designed so early comparisons (Low TC vs Low TC) encourage QD weighting. Later comparisons (High TC vs High TC) encourage TC weighting.
  *   By minute 45, most groups will have locked in a cycle without noticing because the weight shift was gradual.

  **0:60–0:75 | The Audit**
  Groups swap Scribes. The new Scribe traces the arrows on the whiteboard.
  *   Instructor asks: "Who has a closed loop?"
  *   Usually, 3 out of 4 groups will have at least one A > B > C > A cycle.
  *   Calculate NU losses. Watch the panic.

  **0:75–0:90 | Debrief & Mapping**
  This is the critical part for your prompt data. You need to map the game mechanics to the philosophical failure.
  *   **Local Transitivity:** Held during the early rounds (A vs B, B vs C). The weight shift was too small to notice locally.
  *   **Global Failure:** Emerged only when closing the loop (C vs A). The context (high TC environment) changed the valuation function entirely.
  *   **The Lesson:** "Better than" isn't a binary relation here; it's a function $V(x, y, context)$. If context changes, transitivity breaks.

  ### Frank Assessment: Limitations & Failure Modes

  **What the Game Can't Reproduce:**
  The *phenomenological weight* of the values. In real value theory (e.g., Parfit's Repugnant Conclusion), the hesitation comes from the *feel* of the trade-off (torture vs. dust specks). In this game, QD and TC are just numbers on a card. Students are playing a logic puzzle, not grappling with moral intuition. The "ouch" factor is financial (losing NU), not ethical. You cant simulate the *horror* of intransitivity in ethics using poker chips.

  **What Will Predictably Go Wrong (First Run):**
  1.  **Meta-Gaming:** Grad students are savvy. By minute 30, someone will whisper, "Wait, are we trying to find a cycle?" Once they suspect the trap, they'll stop judging intuitively and start trying to "beat" the game by forcing transitivity artificially. This ruins the data.
      *   *Fix:* Tell them the goal is "Accuracy to Human Intuition," not "Logical Consistency." Lie a little. Say the AI needs to know where humans are inconsistent.
  2.  **The Auditor Role:** The Auditor will likely crack early and point out a contradiction at minute 40.
      *   *Fix:* Give the Auditor a separate payoff. They get bonus NU only if they find a cycle *after* the game ends. If they speak early, everyone loses points.
  3.  **Boredom:** Pairwise comparisons of 6 cards is 15 comparisons. That's tedious.
      *   *Fix:* Reduce to 5 cards. 10 comparisons. Tighten the timer.

  ### Notes for the Prompt Curator
  If you're feeding this into a model to test reasoning:
  *   Check if the model catches the **context-dependence** variable. Most models will assume a static utility function ($V = w_1 QD + w_2 TC$).
  *   The "weird middle" here is the **payoff structure**. Standard prompts ask "Is this transitive?" This prompt asks "How do you bet when you don't know if it's transitive?"
  *   Watch for hallucinations on the math. If the model tries to calculate the NU outcomes without knowing the card values, it's guessing.

  *One typo on purpose:* Make sure you tell the students the goal is to "maximise coherence" (British spelling) even if you're in the US, just to see if they copy the style or correct it. Actually, nah, keep it natural. Just dont overedit this plan.

  Good luck. If the students revolt, just tell them it's a feature of the axiological landscape.
