answer: |-
  **Project Title:** The Two-Register Model: Provenance Evidence and the Structure of Higher-Order Defeat

  **Statement of the Problem and Research Question**
  Contemporary epistemology regarding higher-order evidence is dominated by a dichotomy between conciliationist and steadfast responses. Both sides share a structural assumption: when an agent acquires evidence that the reasoning behind a first-order credence is compromised, there is exactly one doxastic attitude available for revision—the first-order credence itself. The dispute concerns only the magnitude and basis of that revision. This shared assumption generates a dilemma of "ugly options." The conciliationist must revise the credence, effectively discarding first-order evidence the agent still possesses. The steadfast theorist must hold the credence steady, resulting in an akratic profile where the agent believes *P* while simultaneously believing that the process producing *P* is unreliable.

  This project proposes that this dichotomy is false because the shared assumption is false. I argue for a "two-register" model wherein the agent maintains an unrevised first-order credence (registering the read on first-order evidence) while attaching a separate "calibration index" to the process (registering the higher-order evidence). This index governs action, assertion, and further inquiry without altering the credence itself.

  The central research question is: **Does higher-order evidence regarding evidence selection (provenance) require doxastic revision, or does it require a structural separation of credence and calibration?**

  **Critique of Existing Positions**
  Existing positions leave this question open because they lack the structural resources to distinguish between *reliability-undermining evidence* (evidence that a cognitive process is broken) and *provenance evidence* (evidence that one's total evidence was selected in a truth-correlated way).

  Consider a grader who forms confident verdicts on forty essays, then learns the batch was drawn from a pool selected for containing an unusual concentration of borderline papers. Conciliationism demands a specific downward revision of confidence for each verdict. However, without a known base rate of borderline papers in the total population, there is no determinate amount by which to lower the credence. Arbitrary revision violates norms of proportionality. Steadfastness ignores the selection bias entirely, treating the first-order evidence as if it were a random sample, which is irrational. Both views assume the higher-order evidence must be absorbed into the credence value. The two-register model argues that provenance evidence targets the *link* between evidence and action, not the *content* of the belief.

  **The Collapse Test**
  The primary objection to the two-register model is that it is merely a notational variant of existing views. If the calibration index does all the normative work, the view collapses into conciliationism (where "index" is just a synonym for "revised credence"). If the first-order credence does the work, it collapses into steadfastness. If the split merely indicates a permission to choose either, it collapses into permissivism.

  To discriminate the two-register model from a redescription, I propose the **Betting-and-Inquiry Divergence Test**. A view counts as distinct only if it prescribes a combination of betting behavior and inquiry policy that neither conciliationism nor steadfastness can replicate without contradiction.
  *   *Conciliationism* prescribes lowered confidence and tentative betting.
  *   *Steadfastness* prescribes high confidence and assertive betting.
  *   *The Two-Register Model* must prescribe high first-order credence (preserving the first-order evidence) combined with a suspension of high-stakes betting (due to the index) and a specific mandate for *evidence-gathering* (to resolve the calibration deficit) rather than *belief-revision*.

  If the model can show that an agent is rationally required to *believe* the verdicts are correct (high credence) but *act* as if they are uncertain (low calibration) without incurring epistemic akrasia, it passes the test. If the "belief" here is shown to be functionally identical to a "lowered credence," the project fails.

  **Nine-Month Work Plan**
  *   **Months 1–2: Formalizing the Distinction.** Rigorously define "provenance evidence" versus general reliability evidence. Develop the formal semantics for the calibration index.
  *   **Months 3–4: Developing the Collapse Test.** Construct specific case studies (like the grader example) to stress-test the Betting-and-Inquiry Divergence. Consult with decision theorists to ensure the action-guiding principles are coherent.
  *   **Months 5–6: Defense Against Objections.** Address the charge of fragmentation (that this splits the mind illegitimately) and the charge of permissivism. Refine the conditions under which the two registers must align.
  *   **Months 7–8: Drafting.** Write the full chapter, integrating the formal models with the philosophical argument.
  *   **Month 9: Revision and Polish.** Finalize the text for dissertation inclusion and journal submission.

  **Possible Conclusions and Decision Criteria**
  1.  **Success:** The two-register model is shown to be a stable, distinct position that resolves the "ugly options" dilemma for provenance evidence. *Decision Criterion:* The model survives the Collapse Test and offers better normative guidance in selection-bias cases than competitors.
  2.  **Partial Success (Collapse):** The model proves viable but collapses into a sophisticated form of conciliationism. *Decision Criterion:* If the calibration index is shown to be mathematically isomorphic to a revised credence function, I will pivot to arguing for this specific version of conciliationism as superior to standard accounts.
  3.  **Limitation:** The model works for provenance evidence but fails for general reliability undermining (e.g., learning one is drugged). *Decision Criterion:* If the two-register split creates irrationality in non-provenance cases, I will restrict the scope of the chapter to a specific domain of higher-order evidence.

  **Conditions for Failure**
  The project fails if: (1) The "calibration index" cannot be distinguished from a second-order belief about the first-order credence, reintroducing the akrasia problem; or (2) The separation of credence and action violates standard Dutch Book arguments without sufficient justification.

  **Scope Assessment**
  While this is framed as a dissertation chapter, the structural claim regarding the nature of doxastic states is substantial enough to anchor the entire thesis. If the two-register model succeeds, it necessitates a re-evaluation of the relationship between belief and action across epistemology, not just in higher-order evidence cases. However, for the purpose of this fellowship, the scope is restricted to establishing the viability of the model within the specific context of provenance evidence. This ensures a completed, defensible unit of work within the nine-month timeframe, while leaving the broader implications for the full dissertation.
