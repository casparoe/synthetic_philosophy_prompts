      *   *Analysis:* Utilitarianism usually focuses on the *outcome*, not the agent's integrity (mostly). But Bernard Williams' "Integrity Objection" is relevant here. If Truman is forced by the calculus to become a "mass murderer" for the greater good, does that violate *his* separateness/moral agency?
      *   *Institutional vs. Individual:* The Interim Committee acted as a collective body. The objection usually targets the *moral status of the victims*, but there's a point about moral residue on the agents. However, the prompt asks if treating *them* as interchangeable nodes violates separateness. In a bureaucratic utilitarian calculus, the specific moral burden on Truman is often diffused. The theory doesn't usually protect the *agent's* soul, but it might fail to account for the specific moral responsibility of the President vs. the Committee.
