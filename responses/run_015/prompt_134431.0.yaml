      *   *Soviet Entry:* Geopolitics (realism) played a huge role. Preventing Soviet expansion isn't about aggregate welfare; it's about power balances.
      *   *The "Invasion Myth":* Historians argue the bomb wasn't just weighed against invasion. It was weighed against *waiting for the Soviets*. If the choice wasn't "Bomb vs. Invasion" but "Bomb vs. Soviet Occupation," the utilitarian calculus changes drastically (and becomes less about lives saved and more about ideology).
