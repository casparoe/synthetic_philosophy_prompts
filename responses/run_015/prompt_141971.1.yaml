      *   *Check:* Did I address the "public justification" aspect? Yes, this is the "legitimacy" argument.
      *   *Check:* Is the conclusion actionable? Suggest specific conceptual shifts (e.g., Knightian uncertainty).

  9.  **Final Structure:**
