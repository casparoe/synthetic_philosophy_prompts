  ### The senses of 'unit'

  The term "unit" masks four distinct roles. First, the unit of inheritance is the replicator persisting across generations, typically the gene. Second, the unit of causal selection is the interactor facing environmental filters, typically the organism or group. Third, the unit of explanation is the level yielding the most parsimonious model. Fourth, the unit of fitness attribution is the entity assigned reproductive value. Gene-selectionists prioritize inheritance and fitness attribution, arguing genes are the only entities with long-term fitness. Organism and group-selectionists prioritize causal selection and explanation, arguing phenotypes drive survival. Neither camp is fully consistent. Gene theorists often speak as if genes causally interact with environments, ignoring phenotypic mediation. Group theorists often attribute fitness to groups without establishing sufficient group-level inheritance. This semantic slippage allows participants to talk past one another, claiming victory by switching senses of "unit" mid-argument. When a gene theorist demands inheritance fidelity, they win on genes. When a group theorist demands causal interaction, they win on organisms. The debate persists because each side defends a different definition while pretending to discuss the same concept. Furthermore, fitness attribution is often conflated with causal power. Gene theorists assign fitness to genes that do not causally act, while group theorists assign causality to groups that may not replicate. This cross-wiring of concepts ensures that no single definition governs the discourse, allowing the controversy to regenerate indefinitely despite formal clarifications. This inconsistency undermines claims of exclusivity.

  ### What the equivalence results show

  The equivalence results, such as the Price equation decomposition, demonstrate that selection models are mathematically intertranslatable. A change in gene frequency can be partitioned into within-group and between-group components without loss of predictive power. This does not dissolve the debate because mathematical equivalence does not entail ontological identity. Showing that a group model can be rewritten as a gene model does not prove groups are causally inert; it only proves the accounting is flexible. Consequently, the results relocate the debate from empirical adequacy to explanatory preference. They show that data cannot decide the issue because multiple models fit the same data. However, equivalence may fail pragmatically. If one level requires impossibly complex parameters to match the other, it is explanatorily inferior. Thus, the results confirm underdetermination but do not validate a single true level. They reveal that the choice of level is a modeling decision, not a discovery of fact. The debate continues because participants treat modeling convenience as ontological truth. Additionally, while models are theoretically equivalent, they may diverge in predictive utility under specific constraints. If group-level heritability is negligible, the group model becomes empirically empty, though formally valid. Equivalence results do not guarantee that all levels are equally useful in every context. They show that the physics of selection allows multiple descriptions, but not that all descriptions are equally illuminating. Thus, the results shift the burden to explaining why one perspective is preferred, rather than proving it is uniquely correct. Therefore, utility becomes the only criterion for choice.

  ### The kind of disagreement

  The residual disagreement is substantive but non-empirical. It is a clash over explanatory virtues rather than facts about nature. Gene-selectionists value generality and the tracking of cumulative evolutionary change over deep time. Group-selectionists value mechanistic accuracy and the recognition of emergent causal structures. Because both positions can accommodate the same empirical data via translation, the dispute is not hidden empirical. It is also not purely verbal, though terminology exacerbates it. The core conflict is methodological: what is the goal of evolutionary theory? If the goal is to explain adaptation, organisms seem central. If the goal is to explain lineage persistence, genes seem central. Since biology serves multiple explanatory interests, no single level captures the whole truth. The debate persists because each side defends a different legitimate interest while claiming exclusive ontological status. Recognizing this pluralism would resolve the tension, but disciplinary incentives favor monopolistic claims. Scientists prefer definitive answers over contextual utility. The disagreement is not verbal because it reflects real divergences in research programs and what counts as a satisfactory mechanism. It is not empirical because the data underdetermines the choice. It is a metaphysical commitment regarding reductionism. Gene theorists assume lower levels are always more fundamental. Group theorists assume higher levels can possess irreducible causal powers. This philosophical divide cannot be settled by biology alone. It requires acknowledging that evolutionary biology encompasses multiple valid narratives. Until the field accepts that "unit" is context-dependent, the debate will remain a permanent feature of evolutionary theory. This philosophical stance drives the interpretation of data.

  ### What would count as progress

  Progress requires a change of question. Researchers should stop asking "What is the unit of selection?" and instead ask "Which level best serves this explanatory purpose?" Distinguishing replicators from interactors explicitly would eliminate much verbal confusion. Formal results should be used to highlight trade-offs in model complexity rather than to prove one level false. Empirical findings matter only insofar as they show when a specific level becomes computationally intractable. Ultimately, no single progress metric exists because the debate stems from competing legitimate perspectives. Accepting methodological pluralism is the only viable path forward. The debate ends not with a winner, but with the realization that the question was ill-posed. We must accept that different units illuminate different facets of evolution. Progress is measured by the clarity with which researchers specify their explanatory goals. If a paper specifies it seeks mechanistic causality, group talk is appropriate. If it seeks historical tracking, gene talk is appropriate. The debate dissolves when the question shifts from ontology to methodology. This shift transforms the debate from a conflict to a toolkit.
