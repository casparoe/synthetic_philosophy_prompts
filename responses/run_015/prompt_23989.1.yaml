          1.  Unit of Inheritance (replicator): What persists across generations? (Gene-centric view).
          2.  Unit of Causal Selection (interactor): What interacts with the environment to survive/reproduce? (Organism/Group-centric view).
          3.  Unit of Explanation: Which level yields the most parsimonious or generalizable model? (Pragmatic).
          4.  Unit of Fitness Attribution: Whose fitness value is the fundamental driver of change? (Mathematical).
      *   *Mapping:* Gene-selectionists prioritize Inheritance and Fitness Attribution (genes have long-term fitness). Organism/Group-selectionists prioritize Causal Selection and Explanation (phenotypes cause survival).
