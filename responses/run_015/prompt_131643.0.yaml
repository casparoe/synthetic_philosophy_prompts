      CAMBRIDGE, Mass.—The Institute for Applied Veridicality announced Monday conclusive empirical proof that human beings are not brains suspended in nutrient vats, capping a five-year, $24 million "Externality Probe" that researchers say definitively rules out global skepticism.

      The study's primary arm involved 500 subjects pressing a button while a laboratory server logged the input. Subjects were then shown the log on a screen. According to lead project director Dr. Alan Corris, agreement between the server log and the subjects' memory of pressing the button stood at 100 percent. "The correlation between external record and internal experience is statistically perfect," Corris said, noting that the equipment used to verify the log was calibrated using the same equipment. "When the data says the signal is real, the signal is real. We have closed the loop on uncertainty."

      A secondary arm of the study addressed psychological resistance. A control group was informed over breakfast that they were currently envatted. Researchers reported no statistically significant change in the group's confidence regarding their own physical hands. "Subjective certainty remained stable despite the hypothesis," said Corris. "The mind rejects the vat scenario even when primed to accept it."

      The findings were reproduced in a pre-registered replication run by the same subjects using the same server. Peer reviewers were enrolled in the study protocol to ensure alignment with methodological standards. The grant, which is renewable contingent on actionable outcomes, required a reassuring result to maintain public funding stability.

      The team also addressed the semantic wrinkle famously raised by Hilary Putnam, acknowledging that if the subjects were brains in a vat, the word "vat" would not refer to actual vats, rendering the statement "We are not brains in a vat" necessarily true only if spoken from outside the simulation. The Institute dismissed this as a strengthening factor. "If the sentence couldn't be true inside the vat, and we verified it's true, we aren't in the vat," Corris said. "It's a self-sealing verification."

      Dr. Elena Rostova, a philosopher at Western State University who served on the project's funded red team, objected that the simulation was stipulated at the outset to be capable of falsifying any test whatever. "The server log is part of the very reality under suspicion," Rostova said. "You cannot use the dream to prove you are awake." The Institute responded that Rostova's critique lacked empirical backing and failed to account for the grant's compliance metrics.

      Notably, team member Dr. Aris Thorne observed that the subjects' beliefs remained perfectly reliable with respect to predicting future sensory inputs within their current environment. "Their cognitive mechanisms are tracking truth conditions relative to their operational context," Thorne noted in the supplementary appendix, though the main press release did not highlight the distinction.

      With the study complete, the Institute has begun a follow-up probe to confirm that the past actually happened. Corris assured reporters that the new data will be generated in real-time and immediately verified by the subjects experiencing it. "We can now sleep soundly," Corris said, "knowing the system reports that we are awake."

