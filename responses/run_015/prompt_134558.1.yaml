answer: |-
  Art is any structure generated to sustain aesthetic attention within a historical lineage of making, requiring either sincere creative intent or sustained cultural uptake, but excluding mere institutional placement without engaged reception.

  The first clause ("structure... lineage") is motivated by Case 5 (forgery) and Case 6 (bowls): physical identity and truth don't determine status, but historical context does. The second clause ("intent or sustained uptake") handles Case 1 (private symphony) via intent and Case 8 (memes) via uptake, while also accommodating Case 7 (AI) as systemic uptake. The third clause ("excluding mere placement") protects your verdict on Case 3 (unknown shovel) against your friend's institutionalism, distinguishing it from Case 2 (known artist) where intent is credible. Case 4 (whale song) fails both intent and art-specific uptake.

  This principle accommodates all eight verdicts, but Case 3 is unstable. If the small gallery show generates critical discourse, it becomes "sustained uptake," overturning your "not art" verdict. Case 1 is also fragile; if the manuscript is never found, the "generated to sustain" claim relies entirely on counterfactual intent.

  **Predictions:**
  1.  **Prison graffiti:** Art. Sincere intent and historical lineage exist without institutional validation.
  2.  **Ephemeral sand sculpture:** Art. Intent and lineage suffice; permanence is unnecessary.
  3.  **Trail-camera photo:** Art. No human intent (deer triggered), but competition entry creates "sustained uptake" within the photography lineage.
  4.  **AI Feature Film:** Art. The credited director supplies the "sincere creative intent," framing the machine generation as a tool rather than an authorless void.

  **Family Resemblance:**
  Your friend's fallback isn't laziness; it's a diagnosis. If "art" is a tool for negotiation rather than a natural kind, definitions always leak. However, it doesn't just shrug: it predicts verdicts on 7 and 8 by asking "does this function like art in our form of life?" rather than "does it meet criteria?" It licenses you to stop looking for necessary conditions, but demands you justify specific judgments by citing resemblances (e.g., memes resemble satire, AI art resembles composition). It dissolves the argument but keeps the practice alive. If you adopt this, you stop fighting over boundaries and start arguing about value: not "is this art?" but "is this *good* art?" That shift resolves the tension between Case 2 (grudging art) and Case 3 (rejected art)—both might be art, but one succeeds at being art and the other fails. The definition becomes a floor, not a ceiling.
