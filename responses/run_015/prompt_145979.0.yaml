prompt: |-
  Consider the problem of defining "low-impact" or "side-effect-avoiding" behavior for an artificial agent when no complete specification of human values is available. Classical proposals—world-state distance metrics relative to a baseline trajectory, conservative action selection within a reference class, or impact penalties scaled by proxy preferences—each encounter the same obstacle: any metric that distinguishes meaningful interventions from trivial ones appears to smuggle in judgments about which differences matter. Two less-discussed formulations complicate this further: a counterfactual-stability criterion, which asks whether an action alters the distribution of outcomes in branches where the agent was never activated, and an "epistemic side-effect" constraint, which targets changes to what other observers or systems can learn regardless of physical-world alterations. Given these and the standard approaches, which open questions, implications, and lines of work in this space are most worth resolving?

  I want a defended prioritization for a research group with roughly two years and no expectation of progress on full value specification—not a survey, not a reading list. Rank the key unresolved issues by dependency: which must be settled before others become tractable, which are tractable with current formal tools (e.g., causal inference, game-theoretic equilibrium analysis, or distributional robustness), and which are likely dead ends or overrated because resolving them would not change how deployment constraints are actually designed. Specifically, address whether the counterfactual-stability and epistemic-side-effect framings open genuinely distinct research paths or merely rename existing ones; whether worst-case and average-case guarantees can be separated in this domain without invoking a full value ordering; and what conditions would have to hold for the entire project—defining low impact absent value specification—to be conceptually coherent rather than incoherent. Defend your ordering with explicit criteria (tractability, downstream dependency, and practical relevance to real-world deployment), state the main trade-offs among them, and identify what result or observation would cause you to reorder the priorities.
