answer: |-
  **Project Title:** The Architecture of Bad Faith: A Taxonomy of Epistemic Vice in Polarized Discourse

  **Central Question**
  Does the attribution of "arguing in bad faith" track a unitary normative failure, or does it conflate distinct epistemic pathologies that require incommensurable remedies? This is not merely a request for definition, but a query into the causal and normative structure of political distrust. A determinate answer requires demonstrating that the proposed fourfold taxonomy—(1) Insincerity, (2) Etiological Failure, (3) Asymmetric Standards, and (4) Misdirected Aim—possesses non-overlapping truth conditions and distinct successful interventions. If the categories collapse into a single underlying mechanism, or if all four demand the same institutional response, the taxonomy is merely descriptive. Success is achieved only if I can show that treating Etiological Failure as Insincerity (for example) actively worsens polarization, thereby proving the distinction is explanatory and practically necessary.

  **Rival Framings and Objections**
  Two standard objections threaten to render the question moot. First, the **Symmetry Worry**. In polarized environments, accusations of bad faith are symmetric: each side accuses the other. It is tempting to infer that if the accusations are symmetric, the phenomenon is equally distributed, or conversely, that the accusations are merely reciprocal weapons with no epistemic standing. This inference is too quick. Symmetric attribution is compatible with asymmetric distribution of the underlying failures. One side may predominantly exhibit Asymmetric Standards while the other exhibits Misdirected Aim. Breaking this symmetry does not require measuring "who is worse," but identifying structural incentives that make specific failures more likely in specific contexts. Evidence that breaks the symmetry must be structural (e.g., media ecosystem incentives) rather than purely psychological.

  Second, the **Refinement-versus-Rationalization Problem**. When an agent raises evidentiary standards only for inconvenient conclusions, are they rationalizing (Asymmetric Standards) or refining a principle previously stated too crudely? To avoid question-begging, I propose using prior statements made under opposite partisan valence as a "revealed baseline." If an agent demanded high evidence for a claim when it benefited their opponent, consistency requires they demand it now. This is not a psychological test of sincerity, but a logical test of principled coherence. The objection that agents legitimately evolve their views is met by distinguishing *evolution* (acknowledged change) from *motivated shifting* (unacknowledged variance). While no idealization is perfect, without this baseline, no attribution of bias is ever possible.

  **Methodology and Work Packages**
  The twelve-month fellowship is divided into four work packages (WPs).

  *WP1: Taxonomy and Adequacy (Months 1–3).* I will formalize the four categories. The adequacy condition is pragmatic: each category must have a distinct observable signature and a distinct remedy. For instance, the remedy for Insincerity is exposure; the remedy for Etiological Failure is structural de-linking of identity and belief; the remedy for Misdirected Aim is changing the goal from winning to inquiring. If the remedies converge, the taxonomy fails.

  *WP2: The Epistemology of Attribution (Months 4–6).* This WP addresses the Symmetry Worry and the Revealed Baseline. I will develop a normative framework for when bad-faith attributions are epistemically respectable. This involves analyzing the conditions under which symmetric accusations justify skepticism versus the conditions under which they justify investigation. I will argue that symmetry in accusation should lower our confidence in the *accuser's* virtue, but not necessarily in the *truth* of the accusation.

  *WP3: Echo Chambers and Institutional Design (Months 7–9).* I will distinguish the informational mechanism of echo chambers (lack of corrective evidence) from the incentive mechanism (performance for audience reward). The former requires information injection; the latter requires incentive restructuring. I will develop the concept of "valence-blind procedures," where evidentiary standards are fixed before it is known which partisan conclusion they support. I will also map the limits of this approach, specifically where valence-blindness might stifle necessary substantive debate.

  *WP4: Synthesis and Normative Upshot (Months 10–12).* The final month integrates the findings into a cohesive normative theory of political discourse. This includes drafting the practitioner-facing diagnostic and finalizing the journal articles.

  **Deliverables**
  The project will produce three journal articles and one practitioner-facing diagnostic tool.
  1.  *Article 1:* The fourfold taxonomy and its adequacy conditions (Target: General Philosophy).
  2.  *Article 2:* The epistemology of attribution and the symmetry argument (Target: Epistemology/Political Philosophy).
  3.  *Article 3:* Institutional responses to echo chambers and valence-blind procedures (Target: Political Theory).
  4.  *Diagnostic:* A short guide for journalists and civic organizations to identify which type of bad faith is operative in a given dispute.
  For a twelve-month fellowship, this is an aggressive but standard output. If necessary, the Diagnostic can be simplified to a blog series or op-ed to ensure the academic articles are not rushed.

  **Failure Modes**
  I anticipate four specific risks. First, **Conceptual Collapse**: empirical or logical analysis may show the four categories reduce to one underlying mechanism (e.g., all are just forms of motivated reasoning). If so, the project becomes a redescriptive exercise rather than an explanatory one. Second, **The Baseline Failure**: the Refinement-versus-Rationalization distinction may prove impossible to draw even as an idealization, gutting the proposal for Asymmetric Standards. Third, **The Symmetry Soundness**: it may turn out that symmetric accusation *does* entail that no attribution is respectable, rendering the epistemology WP negative. Fourth, **Practical Inertia**: all four diagnoses might imply the same institutional remedy (e.g., "deliberate more"), making the taxonomy practically inert. A fifth risk is **Uptake Failure**: the distinctions may be too granular for public discourse, rendering the Diagnostic useless. I will mitigate this by testing the Diagnostic language with non-specialists during Month 11.

  **Scope and Disciplinary Defense**
  The project is tightly scoped, but WP3 (Institutional Design) is the most likely to expand beyond twelve months. Designing viable valence-blind procedures invites endless counter-examples. If time becomes critical, I will cut the constructive institutional design element of WP3 and focus solely on the critique of existing mechanisms, preserving the theoretical contribution while deferring the policy work.

  To the political scientist on the panel: This project is philosophy, not social psychology, because it does not measure the frequency of bad faith in any population. I will not be running surveys to see how many people lie. Instead, I am engaging in conceptual engineering and normative justification. Social psychology tells us *that* people polarize; philosophy tells us *what* we are accusing them of when we call it "bad faith," and whether that accusation is justified. Confusing the conceptual structure of the accusation with the empirical frequency of the behavior is a category error. This project clarifies the concepts so that empirical work can measure the right variables. Without this conceptual groundwork, empirical studies of polarization risk measuring a confused amalgam of distinct phenomena, leading to ineffective interventions. My goal is to ensure that when we diagnose political sickness, we know whether we are prescribing honesty, structural reform, or a change of goals.
