      *   *Self-Correction on New Member:* Does averaging probabilities *destroy* the argument? It changes the object being aggregated. If you aggregate P and V separately, you aren't aggregating Expected Utility anymore. So the theorem doesn't apply. So yes, the argument loses its grip.

