answer: |-
  MAROT PROTOCOL OFFICE
  CERTIFICATION DIVISION
  FAQ: FORM-TRANSFER COMPLIANCE (REV. 4.2)

  **Q: What constitutes a compliant transfer of *Le Ton beau*?**
  A: Compliance is achieved when the target text maintains the source text's prosodic envelope, regardless of semantic deviation. The translator's primary obligation is to the poem's formal skin—meter, rhyme scheme, vowel coloration, and emotional temperature—not to the incidental data of denotative meaning. Interpretive residue is considered a contaminant and must be minimized during the drafting phase.

  **Q: How should I proceed if the target language lacks a phonetic equivalent for a source-language slant rhyme?**
  A: In cases of Phonemic Deficit, the translator must file a Form 88-B (Null-Phoneme Waiver). The translator is permitted to substitute a non-rhyming pair provided the *Ton-Beau Coefficient* (TBC) of the line remains within ±0.05 of the original. Please note that auditory resemblance is secondary to numerical parity. If the TBC is maintained, the rhyme is considered structurally present, even if inaudible to the uncalibrated ear. Translators attempting to force a rhyme through orthographic distortion will be subject to audit.

  **Q: May I substitute a culturally specific reference if the original syllable count and "prosodic fidelity index" are maintained?**
  A: Yes. Semantic drift is acceptable provided the prosodic envelope remains intact. For example, translating "Thames" as "Yangtze" is permissible if the stress weight and vowel duration match the source term. The Marot Protocol prioritizes the architectural integrity of the verse over geographic accuracy. Translators are advised to consult the Approved Cultural Equivalency List to ensure the substitute noun does not introduce unauthorized emotional resonance. Substitutions that alter the *Semantic-Consonant Density Ratio*—such as replacing a monosyllabic hard-consonant noun with a polysyllabic soft-consonant equivalent—are strictly prohibited, even if the meaning is analogous.

  **Q: How is "vowel-temperature parity" adjudicated between reviewers?**
  A: Vocalic Thermal Variance is measured via spectrographic analysis calibrated to the International Standard Kelvin-Poetic Scale. Disputes arise when Reviewer A classifies a front vowel as "cool" (≤20°C) and Reviewer B classifies it as "neutral" (21-25°C). In such instances, the text must be submitted to the Central Calorimetry Board for binding arbitration. Translators should not attempt to adjust vowel temperature through orthographic manipulation (e.g., adding silent 'h's) without prior authorization, as this alters the consonant density ratio and invalidates the TBC calculation. All temperature claims must be accompanied by raw spectrographic data.

  **Q: What is the minimum passing score for the Ton-Beau Coefficient?**
  A: A TBC of 0.85 or higher is required for Level 1 Certification. The coefficient is calculated by dividing the sum of preserved stress units by the total semantic-consonant density ratio. Be advised that a high TBC does not guarantee readability. The Protocol assumes that if the formal structure is replicated, the aesthetic experience will necessarily follow. Translators who prioritize legibility over metric purity risk immediate decertification. It is not the Office's concern if the target text appears nonsensical to a native speaker, provided the formal skeleton is intact.

  **Q: Who is liable if the translated poem evokes a different emotion than the source?**
  A: The Marot Protocol Office assumes no liability for emotional divergence resulting from strict formal adherence. If the source poem is melancholic and the target poem is jubilant due to the inherent brightness of the target language's vowel system, this is classified as a Systemic Linguistic Variance, not a translator error. Translators are reminded that their duty is to the mechanism of the poem, not its effect on the reader. Any attempt to "correct" the emotional temperature by altering the meter constitutes a breach of contract.

  For further clarification, submit tickets via the MPO portal. Do not contact reviewers directly.
