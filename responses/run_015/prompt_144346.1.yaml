  ### **NODE 1: The Property Variation Test**
  **Q:** Do you think an object can differ in properties across worlds without being a *different* object?
  *(e.g., Can Nixon exist in a world where he lost the election and still be Nixon?)*

  *   **NO** → Go to **Node 2** (You lean World-Bound)
  *   **YES** → Go to **Node 3** (You lean Transworld Identity)

  ---

  ### **NODE 2: The World-Bound Branch**
  **Q:** Is the connection between an object here and its "possibilities" based purely on **qualitative similarity**?
  *(e.g., Is the "possible Nixon" just someone who resembles Nixon closely, not literally him?)*

  *   **YES** → 🛑 **LEAF A: Lewis-Style Counterpart Theory**
      *   **Weirdest Commitment:** You are not *literally* possibly happy; only a counterpart of you is. You never could have done otherwise.
  *   **NO** → 🛑 **LEAF B: Unoccupied/Incoherent Combo**
      *   **Weirdest Commitment:** You claim objects are confined to one world (world-bound) but are also numerically *identical* across worlds. This contradicts the definition of world-boundness. (Generally rejected).

  ---

  ### **NODE 3: The Transworld Branch**
  **Q:** Is transworld identity fixed by **essential properties** (e.g., origin, constitution)?
  *(e.g., Must Nixon have the same parents to be Nixon?)*

  *   **NO** → Go to **Node 4** (Non-Essentialist TWI)
  *   **YES** → Go to **Node 5** (Essentialist TWI)

  ---

  ### **NODE 4: The Non-Essentialist Branch**
  **Q:** If not essence, is identity determined by satisfying a **description**?
  *(e.g., Is Nixon whoever fits the description 'the President' in that world?)*

  *   **YES** → 🛑 **LEAF C: Hybrid 'Best-Describer' View**
      *   **Weirdest Commitment:** 'Nixon' might not refer to Nixon in another world if he doesn't fit the description. Identity is context-dependent.
  *   **NO** → ⚠️ **COLLAPSE FLAG:** This is **Haecceitism** (Primitive Identity).
      *   *Action:* Route to **Leaf D**. Note: In practice, this often collapses into Kripkean TWI because without descriptions or essence, identity is brute and unexplainable.

  ---

  ### **NODE 5: The Essentialist Branch**
  **Q:** Do **artifacts** (e.g., statues) have origins essentially, just like organisms?
  *(e.g., If a statue is made from different clay, is it a different statue?)*

  *   **YES** → 🛑 **LEAF D: Kripkean Essentialist Transworld Identity**
      *   **Weirdest Commitment:** A molecule-for-molecule duplicate of a statue made from different matter is a *different* object. Origin is necessary.
  *   **NO** → ⚠️ **COLLAPSE FLAG:** This is **Sortal-Relative Essentialism**.
      *   *Action:* Route to **Leaf D**. Note: Distinguishing organisms from artifacts here is unstable; most study groups treat this as a variant of Kripkean TWI.

  ---

  ### **Summary of Leaves**

  | Leaf | Position | Status | Weirdest Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Lewis Counterpart Theory** | Occupied | You never literally could have done otherwise. |
  | **B** | **World-Bound Identity** | **Unoccupied** | Contradictory: Objects are isolated yet identical. |
  | **C** | **Hybrid 'Best-Describer'** | Occupied | Names might refer to different people in different worlds. |
  | **D** | **Kripkean TWI** | Occupied | Indistinguishable duplicates are different objects if origins differ. |

  *(Note: Haecceitism and Sortal-Relative views collapse into Leaf D for the purpose of this discussion.)*
