  5.  **Refining the "Truth Value" Error:**
      *   Why is it wrong? Frege argues that substitutability of identicals holds for *reference*. If $a = b$, then $Fa$ and $Fb$ have the same truth value. The puzzle arises because $a=a$ and $a=b$ have different *cognitive value* (sense), not different truth values. The student writes: "they could in principle have different truth values." If they had different truth values, one would be true and one false. But they are both true identity statements. The ancients didn't think one was true and one was false; they didn't *know* the second was true. Wait, re-reading: "how the ancients could accept one while rejecting the other without any inconsistency."
