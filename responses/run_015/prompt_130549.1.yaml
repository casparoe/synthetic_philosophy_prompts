      *   Check against constraints (no reading lists, focus on logic).
      *   Make sure the distinction between "Relabelling" and "Shift" is explicit.

      *(Self-Correction on "Overdetermination" vs "Conjunctural Causation"):* Strictly speaking, overdetermination means $A$ is sufficient and $B$ is sufficient and both happen. Conjunctural means $A+B$ together are sufficient. The prompt says "if every major thread was sufficient but not necessary." I must stick to the prompt's definition of overdetermination (redundant sufficiency), even if historical reality is often conjunctural. I will point out that this specific claim is where the friction lies.

