      *   *Counter-Reading (Distributed Great Man):* The plot hinges on specific decisions by specific people. Tagomi's mercy, Baynes's mission, Juliana's journey. The Japanese bureaucracy isn't a monolith; it's fraught with individual moral choices (Tagomi vs. Reardon). The Nazi succession crisis (Bormann vs. Goebbels) is a personality clash that could alter the future (nuclear war).
      *   *The "What If" Framework:* Counterfactual history usually asks "What if X didn't happen?" (e.g., Hitler assassinated). Dick's book asks "What if the Allies lost?" but then complicates it by suggesting *our* reality might be the fake one.

  3.  **Analyze the *I Ching* and *The Grasshopper Lies Heavy*:**
