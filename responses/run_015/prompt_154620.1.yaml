  # JOINT STATEMENT ON EPISTEMIC CONDITIONS AND COMBATANT STATUS
  **Adversarial Collaboration Framework**
  **Date:** 2024-10-26
  **Parties:** Traditionalist Framework (TF) & Revisionist Liability Framework (RLF)

  ## 1. AGREED CLAIMS & SHARED FORMALISM

  The undersigned parties acknowledge the following foundational commitments to establish a bounded scope for disagreement. These claims constitute the shared operational model for this collaboration.

  1.  **Definition of Moral Equality of Combatants (MEC):** MEC holds that combatants on both sides of a conflict possess symmetrical moral permissions to use lethal force against opposing combatants and symmetrical liability to be targeted in return, independent of the justice of their respective causes (*jus ad bellum*).
  2.  **Definition of Liability:** A combatant is "liable" to defensive harm if inflicting such harm upon them does not constitute a moral wrong against them, even if no other means of avoiding the threat are available.
  3.  **Definition of Epistemic Dominance:** A structural condition wherein a belligerent state monopolizes information channels (media, education, internal comms) such that individual soldiers cannot access reliable evidence regarding the justice of the war effort without incurring prohibitive personal risk or cognitive impossibility.
  4.  **Noncombatant Immunity (NCI):** Both parties affirm that civilians who do not directly participate in hostilities retain immunity from intentional targeting. Disagreements regarding combatant status do not extend to expanding legitimate targets to include protected persons.
  5.  **The Excuse Condition:** Both parties agree that severe coercion or invincible ignorance can mitigate *blameworthiness* (retrospective punishment) for wrongful acts. The disagreement concerns whether such conditions also negate *liability* (prospective defensive harm) and restore *combatant privilege* (permission to fight).
  6.  **Practical Stakes:** Both parties agree that the resolution of this debate impacts International Humanitarian Law (IHL) training, Rules of Engagement (ROE) design, and the moral assessment of post-conflict accountability mechanisms.

  ## 2. DISAGREEMENTS TABLE

  The following table isolates the specific theoretical divergences. Each formulation is drafted to be acceptable to its respective proponent without caricature.

  | Issue | Traditionalist Framework (TF) Formulation | Revisionist Liability Framework (RLF) Formulation |
  | :--- | :--- | :--- |
  | **Source of Liability** | Liability arises from the **status** of being a combatant within a recognized conflict structure. By donning the uniform and posing a threat, one enters a reciprocal relationship of risk with opposing combatants. | Liability arises from **moral responsibility for an unjust threat**. One becomes liable only if one contributes to a wrongful harm without sufficient justification or excuse. |
  | **Role of Ignorance** | Invincible ignorance regarding *jus ad bellum* is the default condition for soldiers. Therefore, epistemic limitations are built into the status of "combatant" and do not alter liability profiles. | Ignorance may excuse blame, but it does not necessarily negate the objective fact of posing an unjust threat. An innocent threat may still be liable to defensive harm if necessary to save the victim. |
  | **Symmetry Condition** | Symmetry is preserved if soldiers on both sides face comparable epistemic barriers. If State A dominates information such that its soldiers cannot know they are unjust, functional symmetry with State B is restored. | Symmetry is broken by the objective facts of the case. Even if State A's soldiers are ignorant, they are still enforcing an unjust cause, whereas State B's soldiers are defending a just cause. The moral asymmetry persists regardless of epistemic access. |
  | **Institutional Role** | Soldiers are instruments of state policy. Demanding individual moral assessment of state cause undermines military efficacy and places undue burden on coerced agents. | Soldiers are moral agents. While institutional pressure is real, contributing to mass killing requires a threshold of moral scrutiny that cannot be fully outsourced to the state. |

  ## 3. CRUXES & PREDICTIVE TEST CASES

  The following cruxes identify the specific points where empirical or logical resolution would shift the weight of the argument. For each crux, a shared test case is defined, followed by the specific prediction each party makes regarding moral status and liability.

  ### Crux 1: The Restoration of Symmetry via Epistemic Dominance
  **Question:** Does systematic propaganda restore the Moral Equality of Combatants for the aggressor's forces?

  **Shared Test Case: "The Closed Society Invasion"**
  *   **Scenario:** State A invades State B. State A maintains total Epistemic Dominance: all historical records, news, and internal communications are falsified to depict State B as an imminent existential threat preparing a genocide against A.
  *   **Condition:** State A's soldiers possess no accessible means to verify the falsity of this claim without treasonous acts. State B's soldiers know they are defending against unprovoked aggression.
  *   **Engagement:** Soldiers from A and B meet on the battlefield.

  | Party | Prediction on Liability & Privilege |
  | :--- | :--- |
  | **TF Prediction** | **Symmetry Restored.** Because A's soldiers cannot form reliable beliefs about the unjust cause, they retain combatant privilege. B's soldiers are not permitted to treat A's soldiers as liable criminals/unjust aggressors; they are permitted to kill them only under the standard rules of war (necessity/proportionality), not as a matter of defensive justice against wrongful threats. |
  | **RLF Prediction** | **Asymmetry Persists.** A's soldiers are objectively posing an unjust threat. While they may be non-blameworthy (excused from punishment), they remain liable to defensive harm because B's soldiers have a right to defend themselves against unjust threats, even non-responsible ones. A's soldiers do not gain a moral permission to kill B's soldiers; they merely gain an excuse from punishment if they do. |

  ### Crux 2: The Threshold of "Reasonable Belief" Under Duress
  **Question:** What epistemic effort is required to forfeit combatant privilege?

  **Shared Test Case: "The Leak Scenario"**
  *   **Scenario:** Same as above (State A is aggressor), but a low-bandwidth resistance channel leaks undeniable evidence of State A's aggression to frontline troops (e.g., encrypted orders showing false-flag operations).
  *   **Condition:** Accessing this evidence requires significant personal risk (court-martial or execution) but is physically possible for a subset of soldiers.
  *   **Engagement:** Soldier A1 accesses the leak and believes it. Soldier A2 does not access it (claims fear/risk). Both engage State B.

  | Party | Prediction on Differential Liability |
  | :--- | :--- |
  | **TF Prediction** | **No Differential Status.** The military institution demands obedience. Individual epistemic breakthroughs do not alter legal or moral status on the battlefield. Both A1 and A2 retain equal combatant privilege and liability. To rule otherwise undermines unit cohesion and places impossible moral burdens on individuals under fire. |
  | **RLF Prediction** | **Differential Status.** A1 now possesses knowledge of the unjust cause and becomes fully liable (and potentially blameworthy) for continued fighting. A2 may retain a mitigated status due to duress/ignorance, but strictly speaking, A1 has forfeited the protection of invincible ignorance. The symmetry breaks between A1 and A2, and between A1 and B. |

  ### Crux 3: The Defensive Rights of the Just Combatant
  **Question:** Does the epistemic state of the Unjust Combatant limit the means available to the Just Combatant?

  **Shared Test Case: "The Proportionality Calculation"**
  *   **Scenario:** State B (Just) can stop State A's (Unjust/Propagandized) advance only by inflicting heavy casualties on A's forces.
  *   **Condition:** State B knows A's soldiers are propagandized innocents. State A's soldiers believe they are defending their homes.

  | Party | Prediction on Permissible Harm |
  | :--- | :--- |
  | **TF Prediction** | **Standard Calculation.** State B calculates proportionality based on military necessity and standard *jus in bello* rules. The epistemic innocence of A's soldiers does not increase the weight of their lives in the calculation beyond their status as combatants. |
  | **RLF Prediction** | **Heightened Threshold.** Because A's soldiers are non-responsible threats (due to epistemic dominance), State B must incur greater risk to themselves before inflicting lethal harm on A. The liability of non-responsible threats is lower than that of responsible threats, requiring a higher threshold of necessity for State B to kill legitimately. |

  ## 4. SIGNATURE OF COMMITMENT

  By signing below, both parties agree that the disagreements listed above are substantive and not merely verbal. Both parties commit to testing these predictions against intuitive case judgments and logical consistency checks without resorting to appeals to established authority or tradition.

