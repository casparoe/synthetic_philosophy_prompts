      *   *Category 2: The Mechanism Objection (Selection isn't enough).*
          *   Claim: Cumulative selection cannot cross fitness valleys / produce irreducible complexity.
          *   Verdict: False (empirically).
          *   Conclusions: (a).
      *   *Category 3: The "Unguided" Definition (Teleology).*
          *   Claim: "Design" implies a designer by definition.
          *   Verdict: Trivial (semantic).
          *   Conclusions: (a) & (b) (but question-begging).
      *   *Category 4: The Information/Structure Objection (No Free Lunch).*
          *   Claim: You can't get specified complexity out without putting it in (via the landscape/loss function).
          *   Verdict: Substantive/Defensible.
          *   Conclusions: (a) & (b). *Crucial for the regress point.*
      *   *Category 5: The Comprehension Gap (C1 vs C2).*
          *   Claim: Optimization yields competence (C1) but not semantic understanding (C2).
