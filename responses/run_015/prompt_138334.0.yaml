      *   *Q2: True/Interesting about Understanding specifically?*
          *   Claim 5 (Comprehension Gap). This maps to the user's C1 vs C2. It's the Chinese Room argument variant. It allows that the eye works (C1) but denies the mind understands (C2).
      *   *Q3: Reductio ad Absurdum (Chess/Kids).*
