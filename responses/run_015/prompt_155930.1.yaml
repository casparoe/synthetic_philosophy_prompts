      *   "Do not embed deontic claims inside causal ones": I must state "The model shows X, but the norm says Y."

      *(Self-Correction during drafting)*: I need to be careful not to imply that causal inference *solves* the WKR problem. The prompt asks to *restate* the problem using that vocabulary. I must show where the vocabulary hits a wall (the residue).

