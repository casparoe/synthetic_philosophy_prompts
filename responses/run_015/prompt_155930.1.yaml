          *   Distinguish cases where normative distinction aligns with causal distinction vs. where it diverges.
          *   Report distortions (e.g., intervention misrepresentation, evaluation functions).
          *   Conclude with a "residue analysis" (what's left out? irreducibly normative or just linguistic artifact?).
