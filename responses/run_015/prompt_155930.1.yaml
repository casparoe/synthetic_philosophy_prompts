      *   **Attitude 1: Belief ($B$):**
          *   $R_{truth} \rightarrow$ Evidence ($E$).
          *   $R_{prag} \rightarrow$ Payoff ($P$).
          *   *Normative Thesis:* $B$ should be determined by $E$. $P$ is an impermissible parent for *justification*, though it may be a cause of *holding* $B$.
          *   *Causal Alignment:* Often diverges. Causally, $P$ affects $B$ (self-deception). Normatively, $P$ should have coefficient 0 in the justification equation.
          *   *Intervention:* $do(P=high)$ causes $B=1$. Normatively, this is "wrong."

      *   **Attitude 2: Admiration ($Adm$):**
          *   $R_{truth} \rightarrow$ Merit ($M$).
          *   $R_{prag} \rightarrow$ Threat/Bribe ($T$).
          *   *Normative Thesis:* $Adm$ is fitting iff $M$ is high.
          *   *Causal Distinction:* $T \rightarrow Adm$ is a valid causal path (fear).
          *   *Divergence:* The causal model allows $T$ as a parent. The normative model forbids $T$ as a justifier.
          *   *Evaluation Function:* Requires a node $Fittingness$ that is a child of $M$ only, not $T$.

      *   **Attitude 3: Desire ($D$):**
          *   $R_{truth} \rightarrow$ Perceived Value ($V$).
          *   $R_{prag} \rightarrow$ Biological Need/Conditioning ($N$).
