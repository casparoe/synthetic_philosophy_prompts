answer: |-
  As a historian of medieval political philosophy, I am happy to help you parse this. You are reading *De Regno* (On Kingship), specifically Book I, Chapter 6. This is one of the most famous and debated passages in medieval political thought.

  You are right to be cautious about modern terminology. "Collective intentionality" is a concept from contemporary analytic philosophy (think Searle or Bratman), and applying it directly to the 13th century risks anachronism. However, your intuition that Aquinas views the people as something more than just an aggregate of individuals is correct. He relies on a medieval legal concept of the *community as a corporate body*.

  Per your request, let's first brainstorm the key distinctions Aquinas makes in this context, and then we will dive into the specific question of who acts and why.

  ### Brainstorming: Key Distinctions in Aquinas on Tyranny

  Before analyzing the text, we need to isolate the conceptual binaries Aquinas is working with. If we don't separate these, the text looks contradictory.

  1.  **Private vs. Public Authority:**
      *   *Private:* An individual acting on their own judgment. Aquinas strictly forbids this regarding execution or deposition.
      *   *Public:* Action taken by the community *as a whole* or by a superior authority representing the common good. This is the only legitimate channel for removal.

  2.  **Source of Power vs. Designation of the Ruler:**
      *   *Power (Potestas):* Ultimately comes from God (Romans 13:1). The people cannot "take back" divine authority.
      *   *Designation (Designatio):* The specific person who holds the office is often chosen by the community. The people can withdraw their acceptance of *this specific person* without denying the institution of kingship itself.

  3.  **Tyranny vs. Sedition:**
      *   *Tyranny:* The ruler seeks private gain over the common good. Aquinas argues the tyrant is actually the true "seditious" one because he disrupts the unity of the peace.
      *   *Sedition:* Usually defined as disturbing the unity of the multitude. Removing a tyrant is *not* sedition because the tyrant has already broken the unity.

  4.  **Prudence (Consequences) vs. Principle (Rights):**
      *   Aquinas is a realist. Even if deposition is *licit* (lawful), it might not be *expedient* (wise). If removing the tyrant leads to civil war or a worse tyrant, patience is preferred.

  5.  **Hierarchy of Recourse:**
      *   Aquinas does not jump straight to "the people revolt." He outlines a hierarchy:
          1.  Admonish the king.
          2.  Appeal to a feudal superior (overlord).
          3.  Appeal to the Church (Pope).
          4.  Only if no human superior exists, the community acts.

  ***

  ### Parsing the Text: Who Exactly Can Act?

  Now, let's address your core concern: Is "the people" a corporate agent, or just a bunch of individuals agreeing privately?

  #### 1. The Prohibition on Private Judgment
  You noted that Aquinas rejects private individuals killing the ruler. This is foundational. In *De Regno* I.6, Aquinas explicitly references the Old Testament (the killing of Athaliah) and Roman history (Brutus) to show that even when tyrants are killed, it is done by those with **public authority**, not private citizens.

  If an individual kills a tyrant on their own initiative, Aquinas classifies this as murder and a sin, even if the tyrant is wicked. Why? Because it undermines the very order necessary for society. If private judgment legitimizes violence, the social fabric dissolves into chaos.

  **Verdict:** It is definitely *not* a case of "each individual privately judges it's okay." That is exactly what Aquinas warns against.

  #### 2. The "People" as a *Corpus* (Corporate Body)
  You asked if Aquinas treats the people as a "corporate agent." While he doesn't use the phrase "collective intentionality," he relies on the Roman and Canon Law concept of the *universitas* or *corpus mysticum* (mystical body).

  In medieval law, a community (a city, a guild, a kingdom) is a legal person. It has a will distinct from the sum of its individual members. When Aquinas says the people can depose a ruler, he does not mean a mob or a simple majority of isolated individuals. He means the community acting through its established structures (nobles, magistrates, representatives).

  *   **The Retained Authority:** You asked if the people retain "original power." Aquinas is nuanced here. He argues that if a king is elected by the people (*si jus aliquod populo competat in regem*), and he violates the terms of that kingship, the people are not being unfaithful by deposing him.
  *   **The Logic:** The authority to rule was granted conditionally on the pursuit of the common good. When the king pursues private good, he voids the contract. The *community*, as the grantor of the *designation*, has the standing to revoke it.

  So, you are not projecting too much to see a "shared intentional stance," provided you understand that stance is **institutional**, not psychological. It is the *Res Publica* (public thing) acting to preserve itself.

  #### 3. The Crucial Caveat: The "Superior"
  This is where many modern readers trip up. In *De Regno*, Aquinas actually prefers that the people **do not** act directly if they can avoid it.

  He writes: *"If there is a human superior to whom the right belongs to punish the king, recourse should be had to him."*

  In the 13th-century feudal context, a king often had an overlord (like the Holy Roman Emperor) or a spiritual superior (the Pope). Aquinas thinks it is much safer for a superior authority to depose the tyrant than for the subjects to do it. This minimizes the risk of sedition and maintains the hierarchy.

  It is only **if there is no superior** (which implies a sovereign kingdom) that the right reverts to the community itself.

  #### 4. Prudence over Revolution
  Finally, you mentioned the line about not rushing into it. Aquinas is deeply conservative here. He argues that often, the turmoil of deposition causes more harm to the common good than the tyranny itself.

  He cites the example of the Jews asking Samuel for a king to avoid the corruption of judges, only to find kings worse. His point is that the *certainty* of civil war might be worse than the *uncertainty* of the tyrant's reign. Therefore, the "public authority" required to depose him must also possess the prudence to know *when* not to act.

  ### Summary: Are You Projecting?

  You are not projecting modern philosophy so much as you are correctly identifying a medieval legal reality that *looks* like modern collective agency.

  *   **Don't say:** "The people have a collective intentionality." (Too modern/psychological).
  *   **Do say:** "The people act as a *corporate legal body* (*universitas*) with *public authority*."

  Aquinas's line is drawn here:
  1.  **Illegitimate:** A private citizen decides the tyrant is bad and kills him. (This is murder/sedition).
  2.  **Legitimate:** The community, acting as a public body (often through its leading men or representatives), determines the ruler has voided his claim to office, and—having checked that no higher superior exists and that the remedy won't cause worse harm—deposes him.

  The authority to resist does not reside in the individuals; it resides in the **common good** itself, which the community is tasked to protect. When the king attacks the common good, the community acts as a single body to excise the threat, much like a body might amputate a diseased limb. It is not an act of individual will, but an act of self-preservation by the *corpus politicum*.

  Does that help clarify the distinction between the "mob" and the "corporate body" in his thinking?
