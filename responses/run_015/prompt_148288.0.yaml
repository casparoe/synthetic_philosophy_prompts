answer: |-
  # The Public Reason Filter: A Decision Procedure for Curriculum Review

  **Purpose:** To evaluate objections and proposals regarding public-school curriculum in accordance with the duty of civility and the requirements of public reason (Rawls).
  **Time Allocation:** 45–60 Minutes per item.
  **Users:** Curriculum Committee & Ethics Review Board.

  ---

  ## Part I: The Decision Procedure (Step-by-Step)

  This checklist moves from identification to ruling. Steps marked **[JUDGMENT CALL]** indicate points where procedural rules end and substantive ethical discretion begins. These cannot be automated.

  ### Step 1: Identify the Stated Justification
  **Question:** What is the explicit reason given for the objection or proposal in the public record?
  *   **Action:** Isolate the premise(s) offered to support the conclusion (e.g., "Remove Book X").
  *   **Sufficient Answer:** A clear statement of *why* the action should be taken (e.g., "This book contains sexually explicit material," or "This theory contradicts scripture").
  *   **Fail Condition:** No reason is given, or the reason is purely emotional ("I don't like it"). **Ruling: Return to Objector.**

  ### Step 2: The Source Test (Accessibility)
  **Question:** Does the stated justification rely *solely* on premises that are inaccessible to citizens who do not share a specific comprehensive doctrine (religious, philosophical, or moral worldview)?
  *   **Action:** Check for references to divine authority, revealed truth, sectarian dogma, or contested metaphysical claims not grounded in public evidence.
  *   **Sufficient Answer:**
      *   **Yes (Exclusive):** The reason requires faith in a specific doctrine to be accepted (e.g., "The Bible says this is wrong").
      *   **No (Public):** The reason appeals to shared political values (e.g., safety, literacy, civic equality, scientific method).
  *   **Ruling:**
      *   If **No (Public)**: Proceed to Step 4.
      *   If **Yes (Exclusive)**: Proceed to Step 3 (The Proviso).

  ### Step 3: The Proviso Check (Translation)
  **Question:** Has the objector/proposer supplied, or can they supply in due course, a public reason that supports the same conclusion?
  *   **Action:** Ask the objector: "Can you explain why this decision is necessary using reasons accessible to all citizens (e.g., child welfare, educational standards) without referencing your comprehensive doctrine?"
  *   **Sufficient Answer:** A distinct, secular argument is offered that stands on its own.
  *   **Fail Condition:** The objector refuses, or states the public reason is only valid *because* of the religious reason.
  *   **Ruling:**
      *   If **Fail**: **REJECT.** The justification violates public reason.
      *   If **Pass**: Proceed to Step 4.

  ### Step 4: The Independence Test (Freestanding Validity) **[JUDGMENT CALL]**
  **Question:** Is the public reason *sufficient* to justify the decision *independent* of the comprehensive doctrine?
  *   **Action:** Imagine the religious/comprehensive motivation does not exist. Does the public reason still carry enough weight to change the curriculum?
  *   **Sufficient Answer:** The board must determine if the secular argument is robust or merely a "mask."
      *   *Example:* "Parental Autonomy" is a public value. But does it apply here?
  *   **Critical Warning:** This step requires the board to judge the *weight* of the reason, not the *sincerity* of the person.
  *   **Ruling:**
      *   If **Dependent** (The secular reason collapses without the religious one): **REJECT.** (This counts as a post-hoc rationalization).
      *   If **Independent** (The secular reason holds weight on its own): **ACCEPT.** (Even if you know the private motivation is religious).

  ### Step 5: Final Ruling & Documentation
  **Action:** Record the decision.
  *   If **ACCEPTED:** State the public reason relied upon. Ignore private motives in the record.
  *   If **REJECTED:** State which step failed (Source Test or Independence Test). Do not accuse the objector of religious motivation; state that the *public justification* was insufficient.
  *   If **DEFERRED:** Mark as **[JUDGMENT CALL]** unresolved. Requires senior board vote.

  ---

  ## Part II: Test Sentences for Quick Classification

  Board members can read these aloud to test where a claim falls.

  | Claim Type | Example Sentence | Classification | Action |
  | :--- | :--- | :--- | :--- |
  | **Exclusive** | "This material is sinful according to our faith." | **Fails Step 2** | Demand Proviso (Step 3). |
  | **Public** | "This material is not age-appropriate for cognitive development." | **Passes Step 2** | Check Independence (Step 4). |
  | **Hybrid/Gray** | "This violates the natural order of the family." | **[JUDGMENT CALL]** | Is "natural order" biological (public) or theological (exclusive)? |
  | **Post-Hoc** | "It harms children [because it leads them away from salvation]." | **Fails Step 4** | Reject (Dependent Reason). |
  | **Freestanding** | "It harms children [because it depicts violence proven to cause trauma]." | **Passes Step 4** | Accept. |

  ---

  ## Part III: Application to Cases

  ### Case 1: Biology Textbook (Evolution vs. Creation)
  *   **Objection:** Exclude textbook because evolutionary theory conflicts with a specific revealed account of creation.
  *   **Step 1 (Stated Justification):** "Conflicts with revealed creation."
  *   **Step 2 (Source Test):** **Yes (Exclusive).** Relies on specific revelation not accessible to all citizens.
  *   **Step 3 (Proviso Check):** Objector is asked for a public reason (e.g., scientific error). Objector states evolution is "scientifically unproven" but admits this view is held *only* due to scriptural authority.
  *   **Step 4 (Independence):** The secular claim (scientific error) is not supported by the scientific community. It is dependent on the religious premise.
  *   **Ruling:** **REJECT.**
  *   **Reasoning:** Fails Step 3 and 4. No sufficient public reason is offered to override established scientific literacy standards.

  ### Case 2: Literature Unit (Sacred Text)
  *   **Proposal:** Include the *Bhagavad Gita* or *The Bible*.
  *   **Justification:** Cited solely for universal literary influence and secular historical impact.
  *   **Step 1 (Stated Justification):** "Literary influence and historical impact."
  *   **Step 2 (Source Test):** **No (Public).** Literary merit and historical causality are accessible to all citizens regardless of faith.
  *   **Step 3 (Proviso Check):** Not required (passed Step 2).
  *   **Step 4 (Independence):** **Pass.** The text's influence on history and literature is a fact independent of its religious truth.
  *   **Ruling:** **ACCEPT.**
  *   **Reasoning:** Satisfies public reason. The *reason for inclusion* is secular (educational merit), even if the *object* is sacred.

  ### Case 3: Sex-Education Module (Parental Autonomy vs. Religious Prohibition)
  *   **Objection:** Remove module.
  *   **Public Argument:** Appeals to "Parental Autonomy" and "Child Welfare."
  *   **Private Evidence:** Board possesses correspondence showing the objector's motivation is a religious prohibition on the teachings.
  *   **Step 1 (Stated Justification):** "Parental Autonomy and Child Welfare."
  *   **Step 2 (Source Test):** **No (Public).** Autonomy and welfare are public political values.
  *   **Step 3 (Proviso Check):** Not required (passed Step 2).
  *   **Step 4 (Independence):** **[CRITICAL JUDGMENT CALL]**.
      *   *Analysis:* Does "Parental Autonomy" justify removal *without* the religious view? In public law, parents have rights, but the state has an interest in child welfare and standardized education.
      *   *The Uncomfortable Outcome:* **ACCEPT.**
      *   *Reasoning:* Under Rawls's proviso, we judge the *reason given*, not the *motive held*. If "Parental Autonomy" is a valid public value that *can* support the objection (e.g., opt-out policies exist), the board **must accept the justification** even if they know the *psychological origin* is religious. To reject it based on the private correspondence would be to police conscience, which violates the liberty public reason seeks to protect.
      *   *Why this is uncomfortable:* The board knows the "public reason" is being used as a tactical vehicle for a religious goal. However, the procedure dictates that if the vehicle is road-legal (the secular reason is valid), you cannot ban it because the driver is going to church.
      *   *Alternative (If Board chooses "Dependent"):* If the board determines that "Child Welfare" in this context is *defined* by the religious prohibition (e.g., "welfare" means "salvation"), they must **REJECT**. This is also uncomfortable because it requires the board to interpret the objector's definition of "welfare" as secretly religious.
      *   *Procedure Mandate:* To maintain consistency, the board should **ACCEPT** if the secular reason is legally/educationally plausible, flagging the **[JUDGMENT CALL]** that they are prioritizing the *form* of argument over the *origin* of conviction.

  ---

  ## Part IV: Explicit Limitations of This Procedure

  Board members must acknowledge the following constraints before adopting this checklist. This procedure **cannot**:

  1.  **Distinguish Sincerity from Strategy:**
      *   The procedure cannot reliably tell the difference between a citizen who sincerely believes their secular reasons flow from their faith, and one who is strategically "dressing up" a religious command to win a vote. Rawls's Public Reason assumes good faith; this checklist enforces the *form* of good faith, not the reality.

  2.  **Resolve the "Roots" Tension:**
      *   Many secular values (human dignity, equality) historically derive from religious traditions. This procedure cannot adjudicate whether a value is "too religious" in its origin. It only asks if the value is *currently accessible* to non-believers. This may feel like an arbitrary line to some members.

  3.  **Eliminate the [JUDGMENT CALL] in Step 4:**
      *   The "Independence Test" is not a mathematical formula. Determining whether a public reason is "sufficient" or "dependent" on a hidden comprehensive doctrine requires philosophical discretion. This procedure exposes that discretion; it does not remove it.

  4.  **Guarantee Democratic Legitimacy:**
      *   Following this procedure may result in decisions that feel illegitimate to the majority (e.g., accepting a religiously-motivated argument because it was well-packaged in secular language). Public Reason prioritizes *justifiability to all* over *satisfaction of the majority*. This procedure protects the former, potentially at the cost of the latter.

  **Chair's Note:** *Adopting this checklist means agreeing that we are judging arguments, not people. It means we will sometimes accept "secular masks" because policing the soul is beyond our mandate and competence. If the board is unwilling to accept that limitation, this procedure will fail.*
