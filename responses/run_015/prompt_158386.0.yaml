      *   The initial disagreement ($c \neq c'$) is usually explained by "performance error" despite "competence." Competence = ability to process evidence. Performance = actual processing. So (1) is compatible with initial disagreement.
      *   The real killer is the iteration. If they are peers, after learning of the disagreement, they have *new* shared evidence ($E^* = E + \text{disagreement}$). They should both converge to $f(E^*)$ immediately. Iteration implies they don't.

