answer: |-
  # Q&A Prep Sheet: Closing Plenary on Famine Early Warning

  **Speaker Thesis:** Famines are political crimes, not natural disasters. The "natural disaster" framing is causally complicit in mortality.
  **Audience:** Climate Modelers (50%), Humanitarian Logisticians (33%), Development Economists (15%), International Lawyer (1).
  **Time per reply:** ~2 minutes (approx. 250–300 words spoken at moderate pace).

  ---

  ### 1. The Climate Attribution Objection (Climate Scientists)
  **The Question:** "You argue famines aren't natural disasters. But our attribution studies show anthropogenic warming is measurably increasing the frequency and intensity of meteorological droughts in the Horn and Sahel. If the *hazard* is physically driven by global carbon emissions, aren't you re-naturalizing the famine by ignoring the biophysical driver? How can you call it a 'political crime' when the rainfall failure is physically real?"

  **The Reply:**
  "I appreciate the precision of your attribution models. My argument relies on a distinction critical in disaster risk reduction: the difference between a *hazard* and a *disaster*. A drought is a hazard; a famine is a social outcome. You are correct that warming loads the gun by increasing precipitation anomalies. But politics pulls the trigger.
  In 1984, Ethiopia had drought; in 2011, Somalia had drought. The meteorological input was similar; the mortality differed by an order of magnitude. Why? Because in one case, the state and international response protected entitlements; in the other, they were severed. If climate change makes droughts more frequent, it makes political protection *more* urgent, not less relevant. To treat the famine as a 'climate impact' is to say the death was inevitable once the rain stopped. My point is that the death became inevitable only when the political decision was made not to bridge the entitlement gap. We must not let atmospheric physics absolve human governance."

  **Soft Spot:** If warming reaches a tipping point where adaptation is physically impossible in certain regions, the "political choice" to prevent famine vanishes. I need to avoid implying *all* drought impacts are preventable, only *famine-level mortality*.

  ### 2. The Mens Rea Objection (International Lawyer)
  **The Question:** "You use the word 'crime.' In international criminal law, that requires *mens rea*—intent or knowledge. Sieges are deliberate. Bureaucratic negligence or incompetence is not. By lumping negligent famines alongside deliberate ones, don't you dilute the legal standard? If everything is a crime, nothing is."

  **The Reply:**
  "This is the crux of the legal evolution I'm advocating. We cannot rely solely on direct intent, which is rarely documented in state archives. We must look to *dolus eventualis*—recklessness. Alex de Waal's argument, which I extend, is based on foreseeability.
  When early warning systems like FEWS NET predict Phase 5 outcomes months in advance, the state and international community possess 'knowledge.' If they possess knowledge of substantial likelihood of mass starvation, and they fail to act due to budgetary prioritization or political bargaining, that is not mere accident. It is culpable omission. We treat reckless driving resulting in death differently than an unavoidable accident. I am arguing for a similar shift in starvation: when the warning exists and the resources exist, the failure to deploy them moves from tragedy to culpability. It strengthens the law to acknowledge that modern starvation is rarely an accident; it is a known side-effect of political choices."

  **Soft Spot:** Current international statute doesn't explicitly codify 'famine' as a standalone crime distinct from war crimes or crimes against humanity. I am arguing for *lex ferenda* (law as it should be), not *lex lata* (law as it is). A strict positivist lawyer could claim I'm speaking normatively, not legally.

  ### 3. The Humanitarian Access Objection (Logisticians)
  **The Question:** "We operate on the principles of neutrality and impartiality. If we adopt your framing and label a host government a 'criminal' regime, they will expel us. We've seen this in Sudan and Eritrea. Does your moral clarity come at the cost of operational access? Are you willing to trade lives saved today for justice served tomorrow?"

  **The Reply:**
  "It is a genuine dilemma, and I respect the risk you carry. But we must examine the cost of the current framing. 'Neutrality' often functions as a silence pact. It allows governments to accept aid while simultaneously blocking it, knowing we won't name the obstruction.
  When we frame famine as a natural disaster, we invite the government to be a 'partner.' When we frame it as a crime, we make them a 'suspect.' Yes, this creates friction. But it also changes the donor incentive. Currently, donors fund relief to 'save lives.' If the framing shifts to 'preventing crimes,' donors face legal and reputational risks for funding operations that inadvertently abet a criminal regime. I am not asking you to become prosecutors tomorrow. I am asking you to stop providing the linguistic cover that allows perpetrators to claim they are fighting a 'drought' when they are actually fighting their own people."

  **Soft Spot:** In the immediate short term, access *will* likely worsen in specific contexts. I cannot promise that naming and shaming saves more lives *this season*. It is a long-term structural argument, not a tactical operational guide.

  ### 4. The Entitlement Overreach Objection (Development Economists)
  **The Question:** "Sen's entitlement analysis explains *mechanism*, not *motive*. An entitlement failure can be caused by market shock or inflation without criminal intent. By jumping from 'entitlement collapse' to 'political crime,' aren't you over-reading Sen? You're imputing malice where there might just be state capacity failure."

  **The Reply:**
  "You are right that Sen described the *how*, not the *why*. That is where De Waal and I step in. State capacity is not a natural resource; it is a political allocation.
  When a state chooses to fund a military offensive over a social safety net during a drought, that is not 'capacity failure'; it is 'priority failure.' In the Bengal famine, the administration had the capacity to stop exports but chose not to. In modern contexts, when budgets exist for subsidies but not for drought response, that is a choice. I am not imputing malice to every bureaucrat. I am imputing responsibility to the political structure that designs the entitlement system. If the system is designed such that the poor have no buffer against predictable shocks, the design itself is the political act."

  **Soft Spot:** Distinguishing between genuine incapacity (a failed state with no resources) and prioritization (a resource-rich state ignoring the poor) is empirically difficult in real-time. I risk conflating weakness with malice.

  ### 5. The False Positive Objection (Early Warning Practitioners)
  **The Question:** "Our models produce probabilities, not certainties. If we treat every warning of acute food insecurity as a potential 'crime,' we risk crying wolf. Donors suffer fatigue. If we legalize the warning language, won't we lose the flexibility to de-escalate when the rains come?"

  **The Reply:**
  "The law already handles probability. We prosecute based on risk and negligence, not just guaranteed outcomes. The 'crime' isn't the prediction error; it's the response to the probability.
  If your models show a 60% chance of Phase 5, and the response is calibrated for a 10% chance, that gap is where the culpability lies. I am not asking you to change your probability thresholds. I am asking you to stop labeling the outcome a 'disaster' if the response was insufficient relative to the risk. Keep your models technical. But when you brief policymakers, stop saying 'drought caused this.' Say 'drought exposed the lack of protection.' That linguistic shift doesn't trigger false positives; it triggers accountability for the response curve."

  **Soft Spot:** Policymakers love the "act of God" framing because it lowers the bar for success. Moving the goalposts to "adequate response to probability" makes failure easier to identify, which institutions will resist fiercely.

  ### 6. The Sovereignty Objection (Political Economists/General)
  **The Question:** "International criminal law infringes on sovereignty. If we push this framing, won't Global South states reject early warning systems entirely as neo-colonial surveillance tools? You might lose the data pipeline."

  **The Reply:**
  "Sovereignty is a responsibility, not just a shield. The 'Responsibility to Protect' doctrine already establishes that sovereignty forfeits its protection when a state fails to protect its population from mass atrocities. Starvation fits that definition.
  Regarding neo-colonialism: The current system is already neo-colonial. It treats African populations as passive victims of weather waiting for Western charity. A justice-based framing treats them as rights-holders entitled to protection from their own governance structures. It empowers local civil society to demand accountability rather than begging for aid. The data pipeline should not be a surveillance tool for donors, but an evidence base for citizens."

  **Soft Spot:** In practice, many states *will* view this as neo-colonial interference. The tension between universal human rights and state sovereignty is unresolved. I am taking a side in a fight that isn't over.

  ### 7. The Threshold Objection (General)
  **The Question:** "Where is the line? At what mortality rate does a food crisis become a 'crime'? If you can't define the threshold, the term is rhetorically useful but legally void."

  **The Reply:**
  "In law, thresholds often rely on scale and context, not just a single number. We don't define murder by the exact milliliters of blood lost. We define it by the act and the consequence.
  However, the IPC Phase 5 (Catastrophe) classification, combined with excess mortality data, provides a workable threshold. When a population exceeds the baseline mortality rate by a specific magnitude *and* early warning signals were ignored, the threshold is met. The line isn't just about calories; it's about the gap between the warning and the action. The 'crime' is the omission in the face of the threshold warning."

  **Soft Spot:** There is no agreed-upon international legal threshold for famine crimes. I am proposing one, not citing an existing statute. This leaves me open to charges of arbitrariness.

  ### 8. The "Hope Nobody Asks" Objection (The Complicity Trap)
  **The Question:** "You say the 'natural disaster' framing lets the culpable off the hook. But doesn't building sophisticated early warning systems like FEWS NET allow governments to say 'we are monitoring the situation' without acting? By providing the technical tools that enable 'monitoring without doing,' aren't *we*—the scientists and logisticians in this room—accessories to the crime?"

  **The Reply:**
  "[Pause] That is the hardest question we face. Technology is never neutral. A warning system without a response mechanism is indeed a tool for deflection.
  But the alternative is blindness. We cannot dismantle the sensors because the listeners are deaf. The solution is not to stop warning; it is to couple the warning with the legal consequence. We must stop delivering warnings into a vacuum of charity and start delivering them into a structure of accountability. If we are accessories, it is because we have allowed our data to be used as a substitute for action. The fix is to insist that our data triggers not just funding appeals, but legal reviews. We must refuse to be the alibi."

  **Soft Spot:** This implicates me and the audience directly. There is no clean answer here. Admitting complicity undermines authority; denying it looks naive. I have to walk the line of "critical ally."

  ---

  Verdict: The Climate Attribution Objection
