answer: |-
  This is a sharp observation, and you have identified a genuine structural failure mode within the Predictive Processing (PP) and Free Energy Principle (FEP) framework.

  There is no single, universally standardized noun phrase for this exact phenomenon (e.g., "The X Effect"), but it is discussed under a few overlapping concepts depending on whether the literature is coming from computational psychiatry, philosophy of mind, or machine learning.

  Here are the closest established concepts, the mechanism behind them, and where the line is drawn between healthy modularity and pathological fragmentation.

  ### 1. The Closest Established Terms

  **A. Dissociation (Computational Psychiatry)**
  In the FEP literature (particularly work by Karl Friston, Rick Adams, and others), **dissociation** is often modeled exactly as you describe: a decoupling of generative models that should be integrated.
  *   **The Mechanism:** Normally, different sensory modalities or cognitive domains (social vs. physical) are bound together by high-level "deep priors" (e.g., a model of "Self" or "World"). In dissociation, the precision weighting on the connections *between* these domains is turned down to near zero.
  *   **The Result:** The system minimizes free energy within the social domain and within the physical domain separately, but because the link between them has zero precision, errors in one domain cannot update the priors in the other. They become functionally separate agents within one skull.

  **B. Fragmentation of Belief (Philosophy of Mind / PP)**
  Philosophers working with PP (like Andy Clark or Jakob Hohwy, drawing on David Lewis) discuss **belief fragmentation**.
  *   **The Concept:** Instead of one unified "belief box," the mind holds multiple, potentially contradictory belief states that are accessed in different contexts.
  *   **Relevance:** This matches your "toggling" description. The system isn't lying to itself (confabulation); it genuinely holds Model A in Context A and Model B in Context B, without a meta-model to resolve the contradiction.

  **C. Encapsulated Inference**
  While modularity usually implies information encapsulation at the *input* level (Fodor), in PP, this can happen at the *hierarchical* level. If a high-level prior fails to propagate down to constrain lower-level models across domains, those lower models become **encapsulated**. They optimize locally but lose global coherence.

  ### 2. The Mechanism: Precision Gating on Integration Nodes

  To understand why this isn't just "modularity," you have to look at where the precision weighting fails.

  *   **Healthy Modularity:** You have specialized modules (e.g., visual cortex, language network). They process locally *but* send prediction errors up to a **common hierarchical level** where a unified model arbitrates. If the visual module says "Fire" and the social module says "Everyone is calm," the higher level detects the conflict and adjusts precision to resolve it (e.g., "Is it a drill?").
  *   **Your Failure Mode:** The "integration node" (the higher-level prior that should bind social and physical) is effectively bypassed. The precision weight on the *link* between the Social Box and the Physical Box is zero.
      *   In FEP terms, the system has learned that **integrating these models produces more free energy than keeping them separate.** Perhaps the contradiction is too costly to resolve, so the system minimizes long-term energy by simply never letting them talk to each other.

  ### 3. Where is the Line? (Healthy vs. Pathological)

  The line between efficient modularity and pathological fragmentation sits on **Global vs. Local Free Energy Minimization.**

  | Feature | Healthy Modularity | Fragmented Local Optimization (Your Scenario) |
  | :--- | :--- | :--- |
  | **Error Propagation** | Local errors propagate up to update global priors. | Local errors are absorbed locally; global priors remain untouched. |
  | **Contradiction** | Contradictions trigger a "model arbitration" process (curiosity/conflict monitoring). | Contradictions are hidden by context-switching; no arbitration occurs. |
  | **Precision Weights** | Dynamic. High precision on integration links when conflict arises. | Static/Rigid. Low precision on integration links permanently. |
  | **Goal** | Minimize Free Energy **globally** (coherent world model). | Minimize Free Energy **locally** (stable sub-models). |
  | **Adaptability** | Can update physical model based on social evidence (and vice versa). | Cannot update one domain using evidence from the other. |

  **The Tipping Point:**
  The system crosses the line when it loses the capacity for **Model Structure Learning** across domains. A healthy system realizes, "My social model and physical model are contradicting; I need a new, deeper model that explains both." The fragmented system says, "These models contradict; I will suppress the precision of the connection between them so I don't feel the error."

  ### 4. Proposed Terminology

  If you are writing about this and need a label, the most precise descriptive term currently in use is **"Compartmentalized Inference"** or **"Epistemic Compartmentalization."**

  However, if you want to be technically precise within the FEP mathematical framework, you might call it:
  > **"Decoupled Hierarchical Minimization"**

  Or, focusing on the failure of the binding mechanism:
  > **"Integration Precision Failure"**

  ### 5. Why this matters (The "Dark Room" Risk)

  This specific failure mode is dangerous because it looks stable.
  *   **Ordinary Delusion:** High prediction error is ignored (aberrant precision on the prior).
  *   **Your Scenario:** High prediction error is *prevented from arising* by segregating the models.

  This is often seen in high-functioning contexts where a person can reason perfectly about physics or work (Domain A) but hold completely magical or contradictory beliefs about social dynamics or self-identity (Domain B), with no cognitive dissonance. The system isn't "broken" in terms of energy minimization—it has found a very stable local minimum. It is **adaptively maladaptive**: it reduces immediate anxiety (free energy) at the cost of long-term model accuracy and behavioral coherence.

  ### Summary
  There is no single "effect name," but **Dissociation** (in the computational sense) and **Fragmentation** are the standard terms. The technical distinction is that healthy modularity minimizes **Variational Free Energy** across the whole graph, whereas your scenario describes sub-graphs minimizing free energy independently while the **edge precision between them is zeroed out.**

  If you need a neologism for a paper or discussion, **"Siloed Inference"** captures the engineering intuition, while **"Epistemic Compartmentalization"** captures the cognitive science angle.
