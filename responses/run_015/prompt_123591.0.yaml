answer: |-
  The established concept you are looking for comes from the philosophy of science, specifically **Imre Lakatos's** framework of **"Research Programmes."**

  The specific move in Version 2 is called a **"Degenerating Shift"** (or an **"Ad Hoc Rescue"** lacking **"Excess Empirical Content"**).

  However, since Lakatos is jargon-heavy and doesn't specifically capture the *temporal* nature of your example, I will coin a precise term for Version 2 to use in the wild: **"The Empty Deferral."**

  Here is the breakdown of why this fits, how to distinguish the three versions from the outside, and where the distinction gets shaky.

  ### 1. The Established Concept: Degenerating Shift
  Your friend was half-right about "immunizing strategies." In philosophy of science, theories aren't killed by a single failed prediction (anomaly). They are protected by a "belt" of auxiliary hypotheses (assumptions about context, timing, variables).

  *   **Version 1 (Progressive Shift):** You update the belt *and* gain new predictive power. You added a cache (new variable), recalculated latency (new prediction), and tested it. The theory grew stronger. Lakatos calls this a **Progressive Shift**.
  *   **Version 2 (Degenerating Shift):** You update the belt *only* to explain the past failure, without generating new testable facts. You moved the date (new assumption) but added no new variables or mechanisms. The theory survives, but it doesn't grow. Lakatos calls this a **Degenerating Shift**.
  *   **Version 3 (Reflexivity):** This is distinct from both. It's not about the theory's structure, but the system's reaction. In sociology/finance, this is **"Reflexivity"** (George Soros) or a **"Self-Defeating Prophecy"** (Robert Merton). The prediction changes the variables *because* it was made.

  ### 2. The Coined Term: "The Empty Deferral"
  "Degenerating Shift" is accurate but mouthful. For a dinner argument or code review, use **"The Empty Deferral."**

  **Definition:** An argumentative move where a failed prediction is rescued solely by extending the timeline, without introducing new causal variables or independent tests.

  **Why it fits Version 2:**
  *   **Empty:** It adds no new *content* to the model (no new variables, no new mechanics).
  *   **Deferral:** It pushes the verification event into the future indefinitely.
  *   **Cost Nothing:** Because it generates no *new* testable claims (only the same claim, later), it cannot be falsified any faster than the original claim. It decouples credibility from accuracy.

  ### 3. How to Distinguish Them (From the Outside)
  You said you want to know what to look for. The differentiator is **"Excess Empirical Content."** When they adjust their claim, ask: **"What *new* thing can I measure besides the date?"**

  | Feature | Version 1 (Valid Update) | Version 2 (Empty Deferral) | Version 3 (Reflexive) |
  | :--- | :--- | :--- | :--- |
  | **The Adjustment** | Adds a **Variable** (e.g., "Cache") | Adds **Time** (e.g., "Later") | Adds a **Feedback Loop** (e.g., "Panic") |
  | **New Testable Claim?** | **Yes.** (Latency will drop by X%) | **No.** (Famine will happen at T+1) | **Yes.** (Policy will change in response) |
  | **Model Complexity** | Increases (More accurate) | Stagnant (Same logic, new date) | Changes (System is now different) |
  | **Credibility Cost** | None (Science worked) | High (Pattern of error) | None (Prediction worked indirectly) |

  **The Diagnostic Question:**
  When they move the date, ask: *"Okay, if we check again at that new date, what specific **mechanism** will we see in place that wasn't there before, other than the famine not happening?"*

  *   **V1 Answer:** "The cache hit rate will be 90%." (Verifiable now).
  *   **V2 Answer:** "Well, the pressure will just be higher." (Not verifiable until the end, and only verifies the failure).
  *   **V3 Answer:** "We expect to see new legislation passed." (Verifiable independently of the famine).

  ### 4. What Would Change My Mind
  I am confident that Version 2 is a **Degenerating Shift/Empty Deferral**. However, I would change my classification to **Version 1** if:

  The arguer can name a **leading indicator**.
  If they say, "The date moved because we are waiting for *Population Density X*," and *Density X* is measurable *now* (before the famine), then it is no longer an Empty Deferral. It has become a model with a new variable (Density) that predicts the outcome.
  *   **Why:** This converts "Time" into a "Variable." Time itself is not a causal variable; density is. If they can point to a metric trending toward a threshold *today*, they are doing Version 1 (Model Update). If they can only point to the calendar, they are doing Version 2 (Empty Deferral).

  ### 5. Where This Distinction Is Weakest
  The boundary between **Version 2 (Empty Deferral)** and **Version 3 (Reflexivity)** is the weakest point.

  **The Problem:** "Human Ingenuity."
  In the Malthus argument, the defender often says, "We avoided famine because humans innovate under pressure."
  *   **Is this V2?** Yes, if "innovation" is a magic box that just happens to arrive in time every time, with no explanation of *how* pressure causes it. It's an Empty Deferral disguised as a variable.
  *   **Is this V3?** Yes, if they can show the *mechanism* by which the *fear* of famine caused the innovation (e.g., "Governments funded research *because* of Malthusian warnings").

  **The Weak Spot:** If the arguer claims "Technology just improves over time," that is Version 2 (Empty Deferral). If they claim "Technology improved *because* people were scared of Malthus," that is Version 3 (Reflexivity). From the outside, these look identical (tech appeared). You cannot distinguish them without evidence of **causal intent**.

  **Summary:**
  Call it **The Empty Deferral**. It is a **Degenerating Shift**.
  Spot it by checking if they added a **Variable** (V1), a **Date** (V2), or a **Feedback Loop** (V3).
  If they can't point to a measurable leading indicator *today*, they are deferring emptily.
