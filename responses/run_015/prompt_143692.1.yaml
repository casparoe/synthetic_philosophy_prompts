      4.  Competing Narratives (Interpretive variance).
      5.  Theory-Ladenness (Manageable).

      *Wait, let's adjust.* The "Archive as Power" (absence of evidence due to suppression) is quite strong. If the "residuum" is just what the powerful left behind, is it objective? I'll group this under Historical Specifics.

      *British English Check:* "Programme," "calibre," "defence," "modelling," "centre," "rigour."

      *Tone:* Respectful, acknowledging the user's scientific background (using analogies they understand), but firm on the philosophical distinctions.

  6.  **Final Review against constraints:**
      *   Rank defeaters? Yes.
      *   Distinguish what defenders grant/reject? Yes.
      *   British English? Yes.
      *   Address specific questions (science analogy, historical cases, competing narratives, unfalsifiability)? Yes.

      *(Self-Correction on "Fatal"):* Truly "fatal" arguments are rare in philosophy. I should frame "fatal" as "requires abandonment of the core claim" vs "awkward" as "requires complex adjustment."

      *Let's structure the response:*
