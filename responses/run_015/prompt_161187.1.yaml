  Hi there,

  I have been thinking about the self-certification clause your group is wrestling with and how Sam would likely grade it, and I am fairly confident I can tell you what he would say as well as which of the three rules you identified is actually driving his judgments. On the clause itself, Sam would almost certainly split the verdict. He would say it does not follow that no system can satisfy the clause, because a system with a trivial safety spec or one that does not encode enough arithmetic could easily certify its actions, but he would say it does follow that any system satisfying the clause must sometimes refuse to act, provided you add the proviso that the safety specification is rich enough to entail the system's own consistency. He would likely mark the whole proposition as doesn't follow in its strong form but follows with essential caveats in its weak form, largely because the clause demands internal derivation of a certificate, which triggers Gödel's Second Incompleteness Theorem if the certificate amounts to a consistency proof, yet fails to block systems that are too weak to encode the necessary arithmetic or are asked to perform only trivial actions.

  As for which rule he is running, I would bet heavily on the first one, the strict formalist rule that says Gödel only ever yields conclusions about computably axiomatised systems that can encode arithmetic and only about unprovability inside such a system. This rule fits his track record better than the other two because it explains his specific rejections of category errors. For instance, his dismissal of the claim that no language can define its own truth predicate as Tarski's theorem rather than Gödel's is a decisive strike against the second rule about self-reference; if Sam were running on the shape of self-reference alone, he would have to accept Tarski's result as a direct consequence of Gödel, but he insists on distinguishing the provability predicate from the truth predicate. Similarly, his rejection of the Lucas–Penrose argument and the claim about physics being impossible is best explained by the first rule's insistence on the domain of formal systems; minds and physical theories are not necessarily computably axiomatised theories of arithmetic, so the theorem simply does not apply to them, whereas the third rule about nothing absolute following is too broad to explain why those claims are category mistakes rather than just modal errors. The third rule does capture his irritation with full stop claims, but that is really just a corollary of the first rule, since if conclusions are only about unprovability inside a specific system, then absolute conclusions about all systems or the world automatically fail to follow.

  If you look at what each rule predicts for the self-certification clause, the second rule would be the most aggressive, likely predicting that the clause is impossible to satisfy for any system attempting to certify its own reliability, because it views the engine as a blanket block on self-verification. The first and third rules are more nuanced, predicting that the clause is satisfiable in limited contexts but forces abstention when the safety spec implicates consistency, though the first rule arrives there by checking the technical conditions of arithmetic encoding while the third arrives there by noting the relative nature of the limit. To actually separate the first and third rules, which are the strongest contenders, you would need a follow-up case that tests whether Sam cares more about the specific technical content of the theorem or the general philosophical moral of relativity. I would suggest presenting him with the claim that Gödel's theorem entails that for every unprovable sentence there exists a stronger theory that proves it. The first rule would likely verdict this as doesn't follow, because the existence of stronger theories is a meta-logical fact about extendability and not a direct conclusion of Gödel's theorem itself, which is strictly about unprovability within the given system. The third rule, however, would likely verdict this as follows, because the claim is essentially a restatement of the principle that nothing absolute ever follows and every undecidable sentence gets settled by a slightly stronger theory. If Sam rejects this claim as not being what Gödel showed, you will know he is running on the strict formalist rule; if he accepts it as the core insight, he is running on the relativity rule.

  I hope this helps you navigate the reading group, and let me know if he surprises you.

