      *   *Wait, check (5).* Radical meaning change (Kuhnian) vs. Neurath's Unity of Science. Neurath wanted a *unified* language. If (5) is strong Kuhnian incommensurability, it contradicts the Unity of Science project which ISOTYPE serves. This makes (1) + (5) very tense.
