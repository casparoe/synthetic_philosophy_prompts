      *   *Commitment 3 (Physicalism):* Meaning = translatability into physicalist protocol sentences.
      *   *Commitment 4 (Anti-Metaphysics):* Metaphysics = nonsense.
      *   *Commitment 5 (Meaning Change/Incommensurability):* Theory change alters meaning; no stable observation language.
      *   *Commitment 6 (Coherentism):* Holistic justification, no foundational certainties.

      *   *Tension A: (1) vs (3) - The Translation Problem.*
          *   User worry: If Physicalism requires translation to protocols, does ISOTYPE lose its unique value?
          *   Analysis: Neurath saw ISOTYPE *as* a physicalist tool. It wasn't meant to be *translated* into text to be valid; the picture *is* the physical arrangement of signs. However, if (3) demands *verbal* protocol sentences, (1) suffers. If (3) allows visual protocols, they fit.
