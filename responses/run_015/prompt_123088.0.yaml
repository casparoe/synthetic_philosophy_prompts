  **Correspondences**

  The analogy aligns specific cartographic elements with economic modeling components. The **Territory** corresponds to the actual economy (agents, transactions, institutions). The **Map** is the formal model itself. **Scale** represents the level of abstraction or aggregation (ignoring minor details). **Projection** is the mathematical framework or theoretical lens chosen (e.g., equilibrium analysis). Finally, the **Route** parallels the model's prediction or policy prescription derived from the input conditions. Just as a map simplifies geography to guide travel, a model simplifies reality to guide decision-making.

  **Where it holds**

  The analogy succeeds in justifying simplification for utility. Like a Tube map distorting geography to clarify connectivity, economic models strip away friction to highlight causal mechanisms. This addresses your first kind of assumption (shrinking irrelevant magnitudes). Ignoring transport costs resembles ignoring minor streets; it reduces cognitive load without destroying navigational utility. Both maps and models are judged by performance, not photographic realism. If the model predicts price movements as the map guides a commuter, the distortion is vindicated. This validates the instrumentalist view that predictive success outweighs descriptive accuracy regarding minor details.

  **Where it breaks**

  The analogy fractures when assumptions become constitutive rather than simplifying. While your first kind (shrinking magnitudes) fits the map, the others do not. First, regarding **domain restrictions** (your second kind), a map omits streets but admits they exist; a model assuming a "continuum of traders" denies the discrete nature of reality entirely. You cannot pay to reveal the missing streets in a model; the falsehood is structural. The map allows you to zoom in; the model often breaks if you do. Second, **as-if surrogates** (your third kind) have no cartographic equivalent. A map never claims stations move while looking stationary; it merely distorts distance. Models claiming agents calculate marginal costs when they do not posit a false mechanism, not just a distorted scale. This is not ignoring friction; it is inventing an engine that does not exist. The map analogy cannot support the claim that false mechanisms prove significance. Third, maps possess an independent **territory** for verification (verifying your first kind). Economic models often construct their own territory via data adjustments, lacking the external check a mapmaker faces. When a map fails, you check the ground. When a model fails, economists often adjust the model, not the theory. Finally, map distortions are transparent (scale bars exist); model assumptions are often hidden within mathematics, preventing the "pedantry about scale" defense when the scale is undisclosed. The map analogy hides the fact that some model falsehoods generate the result, rather than merely smoothing the path. It suggests errors are removable noise, when often they are the signal itself. Consequently, the stronger Friedmanite conclusion collapses; a map cannot be useful *because* it is wrong, only *despite* it.

  **What the analogy was carrying**

  The analogy carries the rhetorical burden of instrumentalism. It shields theorists from ontological criticism by shifting criteria from truth to utility. By equating false assumptions with map distortions, it frames realism as a category error—like demanding a Tube map show geography. This legitimizes the Friedmanite claim that unrealistic assumptions are necessary for generality. Stripping reality is not information loss but clarity gain. However, since the analogy breaks on constitutive falsehoods and independent verification, it was doing illicit work. It smuggled in the idea that all falsehoods are merely simplifications, masking the difference between ignoring details and denying mechanisms. It conflates convenient abstraction with fundamental falsehood, allowing models to claim predictive success while hiding structural lies.

  **A better analogy, if there is one**

  Consider the wind tunnel. Engineers test models knowing materials differ, provided dynamics hold. Unlike maps, tunnels acknowledge the model is a distinct system designed to isolate forces. Or consider a caricature: it exaggerates features to reveal identity, admitting distortion is the point. Both admit the model is a constructed apparatus, not a simplified reflection. This admits falsehood is functional, not incidental. These analogies accept the model is a tool for isolation, not a distorted image of truth.
