answer: |-
  **Project Title:** Structural Cluelessness: Is Consequentialism Uniquely Vulnerable?
  **Applicant:** [Your Name]
  **Duration:** 8 Weeks (Half-Time)
  **Request:** [Amount] for living stipend/research time

  **The Problem**
  Effective altruism and longtermist discourse usually treat "cluelessness" as an empirical problem (we lack data on far-future outcomes) or an axiological one (we don't know which values will survive). I'm proposing a third category: **structural cluelessness**. This occurs when the decision framework itself cannot stabilize comparisons across world-states that are ontologically too different. It's not that we don't know the variables; it's that the equation breaks when the terms change category.

  **The Core Question**
  Is there a principled reason structural cluelessness hits consequentialism harder than it hits rule-deontology or virtue ethics? Or is this asymmetry just an artifact of how philosophers formalize these theories? Consequentialism demands cardinal comparability across all states. Deontology and virtue ethics often rely on agent-relative constraints or character traits that might "stop the buck" before ontological comparison becomes necessary. I want to know if that shield is real or illusory.

  **Why Standard Fixes Fail**
  Current mitigation strategies—expected value calculations with wide confidence intervals, robustness analysis, or precautionary principles—all assume a stable metric exists. They try to widen the goalposts. Structural cluelessness argues the goalposts themselves vanish when comparing ontologically distinct futures (e.g., a world with biological humans vs. a world with substrate-independent minds). You can't assign a probability distribution to a comparison that lacks a common denominator.

  **Methodology**
  This is a conceptual proof-of-concept, not a full treatise. Over 8 weeks (half-time), I will:
  1.  **Formalize the Taxonomy (Weeks 1-2):** Clearly distinguish structural cluelessness from empirical ignorance and axiological drift.
  2.  **Framework Stress-Test (Weeks 3-4):** Model how rule-deontology and virtue ethics handle ontological shifts. Do they actually avoid the comparison problem, or do they just hide it behind "rights" or "flourishing" definitions that also fracture?
  3.  **Case Studies (Weeks 5-6):** Apply the taxonomy to two non-obvious cases:
      *   **AI Alignment:** Not just "risk," but the ontological shift of agency itself.
      *   **Wild Animal Suffering:** The ontological shift of moral patients outside contractual frameworks.
  4.  **Synthesis (Weeks 7-8):** Draft findings.

  **Success vs. Failure**
  *   **Success:** A clear determination of whether the asymmetry is real. Even proving the vulnerability is an *artifact of formalization* is a win—it tells consequentialists they need better math, not just better data.
  *   **Failure:** The project ends inconclusively because the non-consequentialist frameworks are too under-formalized to test against. (I will mitigate this by focusing on specific formalizations of deontology, e.g., Kantian contractualism).

  **Scope & Deliverable**
  Eight weeks half-time is tight. I am not solving cluelessness. I am producing a 15–20 page working paper that maps the terrain. The goal is to give donors and researchers a precise reason to fund structural ethics research rather than just more forecasting. If the asymmetry is real, consequentialists need a new decision theory. If it's not, we stop wasting time looking for one.

  **Budget**
  Funding covers [X] hours of research time. No overhead, no travel, just deep work.
