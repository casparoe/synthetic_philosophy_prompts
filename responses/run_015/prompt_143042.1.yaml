          *   *Candidate:* Normativity/Reason Space. Popperian is about "what works." Gregorian is about "what is right/justified." This is a categorical shift in the *goal* of cognition.

      *   *Strong:* Shows significant qualitative differences that are hard to reduce.
          *   *Candidate:* Internalization. If the tool becomes the thinker, the distinction blurs.
          *   *Candidate:* Selection Pressures. If evolution selects for "Gregorian-ness," then it's a distinct adaptive peak.

      *   *Awkward/Absorbable:* Things a reductionist can explain away.
          *   *Candidate:* Speed/Efficiency. (User already claims this).
