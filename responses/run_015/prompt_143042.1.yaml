      *   *Argument 4: The "Hardware" Argument (Neuroplasticity).* Learning to read/write physically changes brain structures (e.g., Visual Word Form Area). If the hardware changes, is it the same architecture?
      *   *Argument 5: The "Error" Profile.* Popperian errors are about physical causality. Gregorian errors are about syntax, logic, and normativity. The *space* of hypotheses is different.
      *   *Argument 6: Dennett's Specific Definition.* Dennett explicitly defines Gregorian by the *sharing* of memes/tools, not just using them. The network effect is the architecture.

  4.  **Evaluate and Rank the Defeaters:**

