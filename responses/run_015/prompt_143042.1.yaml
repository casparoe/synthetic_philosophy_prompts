      *   *Defeater 1 (Fatal):* **The Normative Shift.** Popperian is about survival truth (does this branch break?). Gregorian is about *justification* (why is this proof valid?). This changes the *logic* of the hypothesis testing, not just the storage. *Absorbability:* Low. Hard to reduce normativity to causality.
