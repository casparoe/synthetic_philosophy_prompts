  1. The Procedure

  **Autonomy-Worth Assessment Procedure (AWAP)**
  **Objective:** Assess autonomy varieties for clinical intervention. Time limit: 45 minutes. No philosophical training required.
  **Register 1: Control-Worth (Self-Modification).**
  *Question:* Can the patient inhibit immediate impulses when presented with countervailing reasons?
  *Evidence:* Successful delayed gratification in clinical settings; refusal of immediate urge despite reported craving; ability to pause before acting.
  *Sufficient-Answer Criteria:* Patient demonstrates inhibition in at least two observed instances or verified histories.
  *Stop Condition:* If patient acts purely on impulse despite understood negative consequences, mark "Control Failed."
  ***Judgment Flag 1:** Clinician must distinguish pathological compulsion from rational risk-taking. This overrides procedural rules if clinical context suggests rational deviation.*
  **Register 2: Respect-Worth (Social Accountability).**
  *Question:* Does the patient participate in the social practice of accountability?
  *Evidence:* Ability to explain decisions to others; expression of regret; acknowledgment of norms; recognizing others as agents.
  *Sufficient-Answer Criteria:* Patient engages in reason-giving without coercion and acknowledges impact on others.
  *Stop Condition:* If patient cannot recognize others as agents owed reasons, mark "Respect Failed."
  ***Judgment Flag 2:** Determining "genuine" regret versus performative social scripting requires clinical intuition beyond checklist criteria.*
  **Register 3: Project-Worth (Life-Planning).**
  *Question:* Can the patient form and pursue a coherent life-plan over time?
  *Evidence:* Consistency of stated goals over months; ability to articulate steps toward future states; stability of values.
  *Sufficient-Answer Criteria:* Patient articulates a future narrative that connects present actions to long-term outcomes.
  *Stop Condition:* If goals shift wildly without reason or the future is unintelligible to the patient, mark "Project Failed."
  ***Judgment Flag 3:** The definition of a "coherent life-plan" is an institutional value, not a clinical fact. The committee must define what counts as a valid project.*
  **Decision Matrix:**
  1.  Control Failed: Proxy decision-making required (Safety Priority).
  2.  Control/Respect Pass, Project Failed: Restricted Autonomy. Short-term choices honored; long-term planning authority assigned to proxy.
  3.  All Pass: Full Autonomy.
  **Implementation:** Proceed sequentially. If a Stop Condition is met, proceed to Decision Matrix but note the specific deficit for tailored intervention. All Judgment Flags require committee sign-off before finalizing status. This ensures institutional values override rigid procedural outputs where clinical nuance demands ethical weighting.

  2. Worked Applications

  **Case (a): Severe Opioid Addiction.**
  Step 1 (Control): Patient refuses Medication-Assisted Treatment (MAT) despite craving. This suggests impulse dominance. However, refusal is consistent. *Clinical Judgment:* Is refusal compulsion or values? Committee flags this. Assume Control Compromised but not Failed due to consistent reasoning.
  Step 2 (Respect): Patient articulates reasons for refusal (fear of substitution). Engages in reason-giving. Pass.
  Step 3 (Project): Coherent career goals exist. Pass.
  *Outcome:* Full Autonomy with support. The procedure respects the patient's narrative despite addiction, aligning with Dennett's view that autonomy is compatible with some constraints if reason-giving persists. The committee accepts that addiction reduces control-worth but does not eliminate it if project-worth remains robust.

  **Case (b): Frontotemporal Dementia (FTD).**
  Step 1 (Control): No capacity to modify impulsive behavior in the moment. Stop Condition Met: Control Failed.
  Step 2 (Respect): Retains social charm and expresses regret. Superficially Passes. However, Procedure dictates Control failure triggers Safety Priority.
  Step 3 (Project): Likely failed due to cognitive decline, but irrelevant due to Step 1 stop.
  *Outcome:* Proxy decision-making. The procedure prioritizes Control-worth as the foundation. Social charm is identified as insufficient for autonomy without impulse control, preventing exploitation of the patient's social masking. The committee accepts the stop condition despite the patient's apparent social competence.

  **Case (c): Designed Case (Control/Respect OK, Project Fail).**
  Step 1 (Control): Patient inhibits impulses successfully. Pass.
  Step 2 (Respect): Patient understands accountability and norms. Pass.
  Step 3 (Project): Patient lives entirely in the present, no long-term goals, happy but aimless. Stop Condition Met: Project Failed.
  *Outcome:* Restricted Autonomy. Permits coercive short-term welfare intervention (e.g., forcing savings or health maintenance) but withholds long-term planning authority.
  *Committee Reaction:* Likely rejection. Paternalism seems unjustified for a happy, controlled agent.
  *Structural Feature:* The lexical priority of Project-worth for long-term authority. The framework assumes a life-plan is necessary for long-term sovereignty, separating "agency in the moment" from "authority over the future." This creates a gap where a contented present-oriented agent loses future rights. The committee may reject this because it values happiness over planning, contradicting the procedure's bias toward narrative coherence. The procedure forces a valuation of "future-orientedness" that conflicts with liberal intuitions about present consent.

  3. Limits and Judgment Flags

  **Systematic Misclassifications:**
  1.  **Severe Depression/Apathy:** Patients may retain capacity (Control/Respect) but lack desire (Project). The procedure codes this as Project Failed, potentially authorizing unwanted intervention for capable but unmotivated patients. This pathologizes lack of ambition.
  2.  **High-Functioning Psychopathy:** Patients may excel at Control (manipulation) and Project (criminal planning) but fail Respect (genuine accountability). If Respect is interpreted formally, they may pass, granting autonomy to harmful agents. This risks institutional complicity.
  **Scope Exclusion:**
  **Resource Allocation:** The procedure determines patient status, not institutional budgeting. A patient may have Full Autonomy, but if resources are unavailable, the procedure cannot mandate care provision. This lies outside its scope regardless of register results. It cannot solve triage dilemmas.
  **Value-Laden Steps:**
  The definition of "coherent life-plan" (Register 3) is the primary value-hand-off. Clinical facts cannot determine if a life plan is *worth* wanting. Additionally, Judgment Flag 1 (Compulsion vs. Risk) requires ethical weighting of risk tolerance that varies by institution. These steps cannot be proceduralized without embedding specific moral commitments about the good life. The committee must accept that AWAP distributes authority, not truth.
