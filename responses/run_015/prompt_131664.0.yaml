answer: |-
  ### Joint Statement of Agreed Empirical Claims

  1.  **Railway and Infrastructure Development:** The British administration constructed a extensive railway network in India between 1853 and 1947, funded primarily through Indian taxation and guaranteed returns on British capital. Both sides agree this infrastructure was designed primarily for military mobility and the extraction of raw materials to ports, though it subsequently facilitated internal market integration and passenger movement.
  2.  **Legal and Administrative Institutions:** The Indian Civil Service (ICS), the Indian Penal Code, and the common law court system were implanted during colonial rule. Both sides agree these structures were retained almost entirely by the Republic of India post-1947, forming the backbone of the modern Indian state's administrative capacity.
  3.  **Famine and Mortality:** Significant excess mortality occurred during the colonial period, notably in the late 19th and early 20th centuries. Both sides agree that while climatic factors played a role, colonial fiscal and export policies influenced the severity of famines, and that institutionalized relief mechanisms were less comprehensive than those developed by the post-independence state.
  4.  **Scale of Resource Extraction:** A net fiscal transfer of resources occurred from India to Britain throughout the colonial period, mechanismized through "Home Charges," debt servicing, and trade balances. Both sides agree this represented a drain on domestic capital accumulation, though they differ on the magnitude and whether it was counterbalanced by security and institutional services.
  5.  **Post-1947 State Capacity:** The administrative state capacity of India in 1950 was structurally continuous with the colonial administration of 1946. Both sides agree that the Indian Republic repurposed these institutions for democratic development, though they differ on whether the colonial design facilitated or hindered this repurposing.

  ### Residual Disagreements

  Despite agreement on the empirical record, the parties diverge on the normative interpretation of these facts. The Fergusonian defender argues that **institutional durability serves as moral justification**, positing that the survival and utility of colonial structures post-independence demonstrate their inherent value regardless of original intent. The Tharoorean critic argues that **extraction nullifies legacy benefits**, positing that institutions built for exploitation retain a moral taint that requires compensation, regardless of their subsequent utility. The defender views the colonial state as a necessary precursor to modern statehood; the critic views it as an obstacle to organic development that required correction after 1947.

  ### Adversarial Cruxes and Evidentiary Standards

  | Crux | Shared Case or Standard | Fergusonian Prediction | Tharoorean Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Counterfactual Autonomy Problem**<br>*(Whether evaluating empire requires comparing outcomes to an epistemically unstable baseline of independent development)* | **The Princely State Control Group:** Compare long-term development indicators (literacy, infrastructure density, industrial output) in directly ruled British Provinces versus indirectly ruled Princely States that retained fiscal autonomy but existed within the same geopolitical era. | Directly ruled British Provinces will show significantly higher state capacity and infrastructure density than Princely States, demonstrating that British institutional implantation provided a net developmental advantage over indigenous governance structures. | Princely States will show comparable or superior human development indicators relative to revenue retained, demonstrating that British Provinces suffered a net loss due to extraction that masked the apparent advantage of infrastructure. |
  | **2. The Moral Desert Asymmetry**<br>*(Whether present beneficiaries of inherited colonial infrastructure bear compensatory obligations to descendants of those from whom resources were extracted)* | **The "Disclaiming Benefits" Standard:** Test whether the obligation to pay reparations is contingent on the current user's ability to reject the inherited asset. If India cannot function without the railways/laws, does utility negate the debt? | Obligation is negated by necessity and time-severance. Since the current state cannot disclaim the infrastructure without collapsing, and current users did not commit the extraction, the benefit is non-excludable and the debt is extinguished. | Obligation persists regardless of utility. Using stolen infrastructure without compensation constitutes ongoing unjust enrichment; the inability to disclaim the asset highlights the depth of the structural dependency created by the theft, reinforcing the debt. |
  | **3. Institutional Teleology**<br>*(Whether the original intent of an institution determines its moral value versus its functional outcome)* | **Post-1947 Repurposing Efficiency:** Measure the cost and time required for the Indian Republic to modify colonial institutions for welfare purposes versus building new ones from scratch (e.g., modifying the ICS vs. creating a new service). | Modifications will be shown to be low-cost and high-efficiency, proving the institutions were functionally versatile and their original extractive intent is irrelevant to their developmental value. | Modifications will be shown to be high-cost and structurally constrained, proving the institutions were designed with rigidities that hampered welfare goals, confirming that extractive intent corrupted functional capacity. |
