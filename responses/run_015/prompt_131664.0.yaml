prompt: |-
  I'm a third-year student in a postcolonial political philosophy seminar, and I'm trying to formalize an adversarial collaboration between a Ferguson-style defender of the British Raj's institutional legacy and a Tharoor-style critic centered on structural extraction and deindustrialization. Instead of repeating standard economic statistics, I want the statement to turn on two conceptual cruxes I've introduced in our discussions: the counterfactual autonomy problem—whether evaluating empire requires comparing outcomes to an epistemically unstable baseline of independent development—and the moral desert asymmetry—whether present beneficiaries of inherited colonial infrastructure bear compensatory obligations to descendants of those from whom resources were extracted. Please draft the joint document both camps could sign. It should contain: (1) a numbered agreed-claims section covering the empirical record—railway and legal-institutional development, famine-response mechanisms, the scale of resource extraction, and post-1947 state-capacity trajectories—stated with enough precision that neither side needs to distort its own interpretation to accept the formulation; (2) the exact residual disagreements, written so that each camp recognizes its own position, especially regarding whether institutional durability can serve as moral justification and whether extraction nullifies legacy benefits; (3) the load-bearing cruxes, explicitly including the counterfactual autonomy problem and the moral desert asymmetry, plus any others necessary to locate the disagreement; and (4) for each crux, a concrete hypothetical case or shared evidentiary standard both sides accept as bearing on it—for instance, comparing state-capacity outcomes in regions with direct institutional implantation versus those without, or testing whether disclaiming inherited benefits is a coherent condition for disclaiming obligations—together with each side's predicted result. Format the output as the numbered agreed-claims section followed by a disagreements table with columns for the crux, the shared case or standard, the Fergusonian prediction, and the Tharoorean prediction. Do not provide bibliographies, reading lists, or citations; the reasoning should depend only on conceptual analysis and generally available empirical claims.
