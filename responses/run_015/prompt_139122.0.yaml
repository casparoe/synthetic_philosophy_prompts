answer: |-
  **FINAL EXAM: REASONS AND NORMATIVITY**

  **Time Allowed:** 90 Minutes
  **Instructions:** No citations are expected. Your answer should be an argument rather than a literature review. Do not simply recite the standard demon case; engage directly with the cases below.

  **Question 1**

  Fitting-attitude accounts treat facts about what there is reason to favor as what constitutes an object's having an evaluative property such as being funny or admirable, and such accounts therefore need to exclude facts that are reasons to have an attitude without bearing on whether the object has the property in question. Call this the exclusion problem. The usual move is to separate reasons that bear on whether the attitude is correct or fitting from reasons that bear instead on what it would cost or gain you to have it.

  Consider two cases that this formulation handles awkwardly.

  **Case A (Deferred Access):** A poem has a funny-making feature that the reader can come to perceive only by first being amused, because being amused is what redirects her attention onto it. She is offered, as a reason to be amused now, the fact that amusement is her only route to appreciating the feature that makes the poem funny. The reason thus consists in the poem's really having the property, plus a fact about her psychology.

  **Case B (The Friend's Request):** A friend asks you, as a friend, to find her mediocre poem funny. There is no threat, bribe, or reward, and you have no evidence that it is funny. But finding her work funny is partly constitutive of the friendship, and you have reason to sustain the friendship.

  For each case, is the reason offered a right-kind or a wrong-kind reason, and does the answer depend on whether the attitude would be held because of that reason? Then the crux: Can the distinction be stated so that it yields answers to both cases, does not appeal to the very value property the fitting-attitude account is trying to analyze, and is not merely a list of cases we have independently decided how to classify? If no statement does all three, say what the fitting-attitude theorist should give up instead.

  ***

  **MODEL ANSWER**

  The standard Right-Kind/Wrong-Kind (RK/WK) distinction collapses when pressed by Case A and Case B. In Case A, the reason cites the poem's funny-making feature. Ordinarily, reasons citing the object's properties are RK. However, here the feature is inaccessible without the attitude. If we classify this as RK, we allow instrumental reasons to count as fittingness-conferring, violating the exclusion problem. If WK, we exclude reasons that cite the very property constituting the value. In Case B, the reason cites friendship demands. Ordinarily, pragmatic reasons are WK. Yet, if finding the poem funny is constitutive of the friendship, the reason bears on whether the attitude is appropriate within that relationship, mimicking RK structure.

  Does the answer depend on whether the attitude is held *because* of the reason? Yes, crucially. If I am amused in Case A *because* I want to access the feature, the amusement is instrumental, suggesting WK. But if the feature actually makes it funny, the reason tracks truth, suggesting RK. This dependency reveals the core issue: we cannot classify the reason without already knowing whether the attitude is fitting. The "because of" condition attempts to filter out bootstrapping, but it fails when the reason itself guarantees the fittingness only via the attitude's existence. In Case B, if I find it funny *because* she is my friend, is the funniness real or fabricated? If the friendship constitutively requires finding it funny, the reason makes the attitude fitting within the relationship, blurring the line between pragmatic obligation and normative correctness.

  Can the distinction be stated to satisfy the three conditions? No. The three conditions are: (1) yield answers to A and B, (2) avoid appealing to the value property (funniness), and (3) not be ad hoc. Any formulation that successfully excludes Case A's reason must appeal to whether the reason bears on the object's funniness. But "funniness" is the property the Fitting-Attitude (FA) account aims to analyze. To define RK reasons as those bearing on funniness is circular. It presupposes the normative property to explain the normative reason. Similarly, distinguishing Case B requires knowing if friendship demands constitute genuine fittingness or mere pragmatic pressure. This again requires prior access to the value property.

  Attempts to avoid circularity, such as distinguishing object-given from state-given reasons, fail here. In Case A, the reason is object-given (the feature exists) but state-mediated (requires amusement). In Case B, the reason is state-given (friendship benefits) but object-directed (the poem). These structural distinctions do not map cleanly onto RK/WK without smuggling in value judgments. We cannot say Case A is WK because it is instrumental without assuming we know what counts as direct evidence of funniness. We cannot say Case B is WK because it is pragmatic without assuming we know whether friendship obligations override aesthetic correctness.

  Therefore, the FA theorist must give up the reductive ambition. The project was to analyze evaluative properties in terms of reasons for attitudes. But identifying the relevant reasons requires prior grasp of the evaluative properties. The dependency is reversed. The theorist should instead adopt a non-reductive FA account, where reasons and values are mutually illuminating but neither reduces to the other. Alternatively, they must accept that the exclusion problem cannot be solved formally and requires substantive normative theory to distinguish RK from WK reasons. Either way, the hope for a formal, non-circular distinction that solves the exclusion problem independently of substantive value theory is untenable. The cases show that epistemic access to the right reasons presupposes the very values we sought to analyze. Consequently, the FA account cannot serve as the foundational analysis of normativity it promised to be. It must retreat to being a structural claim about the relationship between values and attitudes, leaving the substantive work to first-order normative theory. This concession saves the account from circularity but abandons its reductive utility.

  ***

  **MARKING SCHEME (Total: 20 Marks)**

  1.  **Case A Classification (4 marks):** Correctly identifies the ambiguity in Case A (citing the property vs. instrumental access) and argues for a classification based on that tension.
      *   *Common Error:* Treating Case A as straightforwardly RK because it cites the funny-making feature, ignoring the instrumental barrier.
  2.  **Case B Classification (4 marks):** Correctly identifies the ambiguity in Case B (pragmatic friendship vs. constitutive requirement) and argues for a classification based on that tension.
      *   *Common Error:* Treating Case B as straightforwardly WK because it involves friendship, ignoring the constitutive nature of the demand.
  3.  **Analysis of "Because Of" Condition (4 marks):** Explains whether the classification depends on the basis of the attitude and why this complicates the distinction (e.g., bootstrapping issues).
      *   *Common Error:* Stating the condition matters without explaining *why* it fails to resolve the circularity in these specific cases.
  4.  **Evaluation of Three Conditions (4 marks):** Explicitly addresses the three conditions (answers, non-circularity, non-ad hoc) and argues that condition (2) cannot be met without violating the FA project's goals.
      *   *Common Error:* Claiming a solution exists (e.g., object-given reasons) without demonstrating how it avoids appealing to the value property.
  5.  **Recommendation (4 marks):** Clearly states what the theorist should give up (typically reductive ambition) and justifies this as the necessary consequence of the previous analysis.
      *   *Common Error:* Suggesting the theorist should give up the FA account entirely rather than modifying its reductive ambition.

  **An A answer exposes the circularity undermining the distinction; a B answer attempts to apply the distinction without noticing it presupposes the value it seeks to analyze.**
