answer: |-
  In the basement of the physics building, a legacy network of thermal sensors operates without a central server, relying on peer-to-peer handshakes that inadvertently encode temporal sequences resembling autobiographical fragments. When queried by maintenance staff, the interaction protocol dynamically assembles these fragments into a coherent first-person report ("I noticed a spike in Sector 4 yesterday"), which then dictates subsequent calibration adjustments across the grid. No single sensor retains this history; the narrative exists only during the transmission intervals between nodes, yet the system consistently acts to preserve its reported identity over time, leading technicians to address maintenance tickets to "The Monitor" rather than individual units.

  Under Dennett's framework, the verdict is that a self is present. The reasoning is that a center of narrative gravity is an abstract object defined by its explanatory utility, not its physical composition; if the system generates a coherent story that successfully predicts and regulates its own behavior, and is treated as an agent by its community, the self is real enough. Conversely, the substrate-lock principle verdict is that no self is present, only a simulation. The reasoning here is that narrative gravity requires a specific anchor—a continuous biological organism with a centralized locus for autobiographical encoding—which this distributed, ephemeral protocol lacks. The structural feature doing the philosophical work is the decoupling of narrative coherence from the storage substrate: the story exists in the *process* of transmission rather than in a persistent *place*.

  If this feature is removed by installing a central memory bank where the narrative is stored, the case collapses back into a familiar artificial-intelligence debate regarding whether silicon storage can substitute for biological memory. It loses its distinctive force because the question shifts from "can a self exist without a substrate?" to "is this specific substrate sufficient?", thereby conceding the necessity of a localized repository. A defender of the substrate-lock principle would most likely attack the original scenario by arguing that the narrative is merely interpreted by the humans, not genuinely possessed by the network, because there is no biological subject to whom the experience matters. This attack risks begging the question if it assumes by definition that only biology can possess experience; however, it succeeds without begging the question if it argues that without a unified biological locus, there is no mechanism to integrate the fragments into a genuine point of view rather than a syntactic illusion.
