answer: |-
  # Specification of Desiderata for a Theory of the Moral Authority of Advance Directives

  ## I. Scope and Definition
  This specification defines the necessary conditions for an adequate normative theory regarding the moral authority of advance directives (ADs). The scope is limited to directives issued by a competent adult intended to govern medical decisions after the issuer has lost decision-making capacity due to dementia, brain injury, or progressive psychiatric illness. An adequate theory must not merely describe legal statutes but must justify the *moral bindingness* of the prior competent self's instructions over the interests of the subsequent incompetent self.

  ## II. Phenomenological Accommodation and Normative Results
  An adequate theory must account for the following four specific phenomena. For each, the theory must deliver the specified normative result. Deviations from these results indicate a failure to capture the nuanced moral landscape of precedent autonomy.

  **(i) Classic Refusal Cases (The "Contented Dementia" Problem)**
  *   **Scenario:** A competent adult issues an AD refusing artificial nutrition and hydration (ANH) in the event of advanced dementia. Upon entering that state, the patient is cognitively incapacitated but appears content, enjoying simple sensory interactions.
  *   **Required Normative Result:** The directive must retain *prima facie* binding authority, permitting the withholding of ANH despite current contentment, provided the psychological discontinuity does not amount to a total break in personal identity.
  *   **Justification:** This result is required to protect **critical interests** (the integrity of the life narrative and the avoidance of indignity as defined by the competent self) over **experiential interests** (current pleasure/pain). A theory that voids the directive solely based on current contentment reduces the patient to a series of momentary selves, negating the moral significance of a unified life plan.

  **(ii) Psychiatric Advance Directives (The "Ulysses Contract" Problem)**
  *   **Scenario:** A patient with bipolar disorder or schizophrenia issues an AD refusing antipsychotic medication during future manic or psychotic episodes. When the episode occurs, the patient is acutely psychotic, agitated, and poses a safety risk, seemingly needing medication.
  *   **Required Normative Result:** The directive's authority is defeasible; clinicians may override the refusal to administer medication necessary for safety and restoration of capacity.
  *   **Justification:** This result is required because the specific pathology targeted by the directive (psychosis/mania) inherently undermines the **insight** required to validly assess the need for treatment *at the time of the directive's creation*. Unlike dementia, where the future state is a decline, psychiatric directives often attempt to bind a self that is temporarily distorted by a treatable condition. Authority yields here to the goal of restoring the competence that grounds authority itself.

  **(iii) Long-Dormant Directives vs. Recent Incompetent Preferences**
  *   **Scenario:** An AD was drafted decades ago. The patient, now incompetent (e.g., moderate dementia), recently expressed a preference contrary to the AD (e.g., "I want to live," vs. AD's "No life support").
  *   **Required Normative Result:** The competent AD overrides the recent incompetent preference.
  *   **Justification:** This result is required because moral authority is a function of **competence**. The recent preference, while emotionally salient, lacks the cognitive grounding to generate moral obligations. To allow an incompetent preference to override a competent directive is to grant moral veto power to a state of mind deemed legally and ethically incapable of decision-making.

  **(iv) Directives Demanding Aggressive Intervention**
  *   **Scenario:** An AD demands all possible life-sustaining measures regardless of prognosis, conflicting with clinical judgment regarding futility or resource allocation.
  *   **Required Normative Result:** The directive creates a strong presumption for treatment but does not possess the same absolute binding force as a refusal; it is defeasible by medical futility or disproportionate resource claims.
  *   **Justification:** This result is required to preserve the distinction between **negative rights** (freedom from unwanted bodily intrusion) and **positive rights** (entitlement to specific services). A theory that grants equal authority to demands and refusals ignores the moral asymmetry between letting die and killing, and between patient autonomy and professional integrity/resource justice.

  ## III. Conceptual Distinctions to Preserve
  An adequate theory must maintain the following conceptual distinctions. Collapsing these distinctions renders the theory incapable of resolving the conflicts outlined above.

  1.  **Authority vs. Evidential Weight**
      *   **Distinction:** The AD must be treated as a **normative command** (creating an obligation for others to act) rather than merely **epistemic evidence** (a clue to what might currently be best for the patient).
      *   **Reason:** If the AD is merely evidence, it becomes one factor in a best-interests calculus, easily outweighed by current welfare. Authority implies a trumping power that survives changes in circumstance.
  2.  **Standing to Refuse vs. Standing to Demand**
      *   **Distinction:** The moral standing to bind others to *inaction* (refusal) is broader and more robust than the standing to bind others to *action* (demand).
      *   **Reason:** Based on the asymmetry of bodily integrity. Violating a refusal constitutes a battery (violation of bodily integrity); violating a demand constitutes a denial of benefit (which is subject to feasibility and professional judgment).
  3.  **Change in Values vs. Change in Taste**
      *   **Distinction:** A shift in **critical values** (conceptions of dignity, personhood, and the good life) undermines the continuity of the self enough to weaken the AD; a shift in **mere taste** (enjoyment of food, music, company) does not.
      *   **Reason:** ADs are designed to protect values, not tastes. If the prior self's core values remain the anchor of identity, the AD holds. If the current self possesses entirely new values (a "new person"), the AD loses its grip. A theory that cannot distinguish these cannot explain why some ADs bind and others do not.
  4.  **Incompetence Extinguishing Autonomy vs. Incompetence Making Autonomy Unreliable**
      *   **Distinction:** Global incapacity (e.g., advanced dementia) **extinguishes** present autonomy; specific impairment (e.g., acute psychosis) makes present autonomy **unreliable** but potentially restorable.
      *   **Reason:** This justifies the differential treatment of dementia ADs (Case i) vs. psychiatric ADs (Case ii). In the former, the prior self is the only autonomous agent available. In the latter, the goal is to restore the current self to autonomy.

  ## IV. Empirical and Psychological Constraints
  The theory must be consistent with established empirical data regarding human psychology and pathology without dissolving into a purely consequentialist framework.

  1.  **Preference Stability:** The theory must acknowledge evidence that preference stability declines with age and cognitive impairment.
      *   *Constraint:* The theory cannot assume the AD perfectly mirrors what the patient *would* want now (rejecting strict Substituted Judgment). It must ground authority in the *actual past choice*, not a hypothetical current one.
  2.  **Adaptation and Affect:** The theory must accommodate evidence that patients with dementia often adapt and report positive affect contrary to their prior predictions (the "disability paradox").
      *   *Constraint:* The theory cannot void the AD *solely* because the patient is happier than expected (see Phenomenon i). It must explain why prior critical interests can outweigh current experiential welfare.
  3.  **Distortion in Psychiatric Conditions:** The theory must account for evidence that psychiatric conditions distort both present judgment and retrospective evaluation (e.g., anosognosia).
      *   *Constraint:* The theory must allow for the override of psychiatric ADs when the condition itself compromises the validity of the instruction (see Phenomenon ii).
  4.  **Non-Reduction Clause:** Crucially, while accommodating these empirical facts, the theory **must not reduce to a pure best-interests calculus**.
      *   *Constraint:* If the theory uses empirical data on adaptation to simply maximize current welfare, it ceases to be a theory of *advance directive authority* and becomes a theory of *paternalistic beneficence*. It must retain a deontological constraint derived from the prior competent will.

  ## V. Exclusionary Power and Ranking of Desiderata

  ### The Single Most Exclusionary Desideratum
  The desideratum that does the most work in excluding dominant competing accounts is **The Distinction Between Authority and Evidential Weight (Section III.1), coupled with the Non-Reduction Clause (Section IV.4).**

  *   **Exclusion of Pure Best-Interests Views:** These views treat the AD as merely one piece of evidence regarding the patient's welfare. By insisting the AD has *authority* (normative command) rather than just *weight* (evidence), this desideratum rules out any theory that allows current welfare to automatically override the directive.
  *   **Exclusion of Substituted Judgment:** This standard asks "What would the patient choose *now*?" effectively treating the AD as evidence of a hypothetical current choice. The Authority desideratum insists the binding force comes from the *actual past choice* of a competent agent, regardless of what the current incapacitated self might hypothetically choose.
  *   **Exclusion of Rigid Precedent Autonomy:** While Precedent Autonomy respects authority, it often fails the **Empirical Constraints (Section IV)**. A theory that satisfies the Authority desideratum *and* the Empirical Constraints (specifically regarding adaptation and psychiatric distortion) excludes rigid Precedent Autonomy accounts that ignore the "Contented Dementia" problem or the specific nature of psychiatric insight.

  ### Ranking of Requirements

  **Tier 1: Non-Negotiable (Foundational)**
  1.  **Authority vs. Evidence:** Without this, the project collapses into best-interests paternalism.
  2.  **Competence Threshold (Phenomenon iii):** Without this, there is no justification for why the past self governs the future self.
  3.  **Refusal vs. Demand (Phenomenon iv):** Without this, the theory violates fundamental rights asymmetries regarding bodily integrity.

  **Tier 2: Negotiable (Operational/Calibrational)**
  1.  **Values vs. Taste Distinction:** While conceptually necessary, the operational line between a "value" and a "taste" is notoriously difficult to draw. A theory could relax the precision of this distinction if it provides a robust alternative mechanism for assessing psychological continuity.
  2.  **Weight of Current Welfare:** The exact threshold at which current suffering overrides a prior directive (e.g., in the "Contented Dementia" case) is a matter of degree. A theory could allow for a sliding scale of current harm without failing, provided it does not make current welfare the *sole* determinant.
  3.  **Psychiatric Override Specifics:** The precise conditions under which a psychiatric AD is overridden (safety vs. health vs. capacity restoration) can vary, provided the theory acknowledges the *possibility* of override due to the nature of the pathology.

  ### Brief Theoretical Scoring
  *   **Pure Best-Interests:** Fails Tier 1 (Authority vs. Evidence).
  *   **Substituted Judgment:** Fails Tier 1 (Authority vs. Evidence) and Empirical Constraints (Preference Stability).
  *   **Rigid Precedent Autonomy:** Passes Tier 1, but fails Empirical Constraints (Adaptation/Psychiatric Distortion).
  *   **Hybrid Critical/Experiential Interest Theory (e.g., Dworkin modified):** Best positioned to satisfy Tier 1 and Empirical Constraints, provided it incorporates the Psychiatric Override nuance.
