answer: |-
  **The Fission Fork**

  I step into the teleporter on Earth. The scanner hums, the light flashes, but instead of dematerializing, the machine jams. A warning light blinks: *FISSION EVENT DETECTED.*

  On Mars, two of me step out of the receiver. Let's call them Lefty and Righty. They look identical. They both remember my childhood, my PIN number, and the exact shame of that time I waved at someone who wasn't waving at me.

  Immediately, they start shouting at the Transfer Technician.

  Lefty points at Righty. "He's the copy. I get to keep the Netflix profile. The 'My List' queue is curated to *my* specific psychological continuity."

  Righty shoves Lefty. "No, *you're* the copy. That means you're the new entity. You take the student loans. I'm the original survivor; the debt attaches to the past identity, which is now defunct."

  They turn to the Technician, demanding arbitration. "Tell him! Who is *really* me? Who has the legal obligation?"

  The Technician doesn't even look up from his clipboard. He just sighs, taps a pen against a copy of *Reasons and Persons*, and says, "Look, guys. There is no further fact. Identity is not what matters. Relation R—psychological continuity with the right kind of cause—holds fully for both of you."

  Lefty opens his mouth. "But—"

  "Save it," the Technician interrupts. "Asking which one is the 'original' debtor is an empty question. It presupposes a deep further fact about personal identity that doesn't exist. You're not two people fighting over who owns the soul. You're like two amoebas that just split suing each other for custody of the cytoplasm. Now, split the login credentials and double the loan payments. Next!"

  ***

  **Philosophical Footnotes & Liberties Taken**

  **1. The "Identity vs. Survival" Distinction:**
  Parfit's actual conclusion in the fission case is slightly more nuanced than the joke implies. He argues that because identity must be one-to-one (transitive), and fission is one-to-many, *strictly speaking, neither* resulting person is identical to the original. However, he claims identity *doesn't matter*; what matters is survival (Relation R), which *does* hold for both. The joke simplifies this by having the Technician imply they are both "me-ish" enough to share the burden, whereas Parfit would say the original "I" ceases to exist, but two survivors continue. The punchline holds because the *dispute* relies on a "further fact" of identity that Parfit rejects, even if the legal liability would technically need a new framework.

  **2. Binary vs. Degrees:**
  Parfit emphasizes that Relation R can hold to degrees (e.g., if the scanner only copied 50% of my memories). The joke treats the fission as a clean binary split where both copies have 100% continuity. This ignores the potential for "partial survival" complications where moral responsibility might be diluted.

  **3. Ignoring Bodily Continuity (Animalism):**
  The joke assumes Psychological Continuity is the only game in town. It ignores Eric Olson's Animalist objection, which posits that we are human organisms. In a teleporter scenario, the organism usually dies (or stays behind), meaning *both* Mars copies are arguably new organisms with my memories, regardless of Parfit's view. It also ignores Wiggins' concerns about the sortal concepts required to count persons.

  **What Would Make Me Drop This Framing?**

  I would stop using the "Fission = Shared Responsibility" framing if a convincing argument were made that **branching destroys the coherence of moral responsibility entirely.**

  If it were demonstrated that psychological continuity only grounds responsibility when it is *unique* (The "Non-Branching Clause" defense), then fission wouldn't result in two people splitting a bill; it would result in the death of the moral agent and the birth of two new, innocent entities who merely *think* they owe money. If the "Too Many Minds" objection proves that continuity cannot distinguish between a genuine survivor and a perfect duplicate in a way that preserves normative force, the joke fails because the dispute wouldn't be incoherent—the loans would simply be void.
