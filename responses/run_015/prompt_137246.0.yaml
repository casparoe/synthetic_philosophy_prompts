  Before we get to the ranking, we need to be clear about what work these procedures are actually doing and where they tend to break. The core epistemological tension here is between the reliability of frequencies and the relevance of specific evidence. The outside view gives you calibration but often at the cost of resolution, lumping your unique case into a bucket where it might not belong. The inside view gives you resolution but suffers from systematic bias, specifically the planning fallacy and motivated reasoning. A reliable arbitration rule needs to prevent the inside view from ignoring the base rate while preventing the base rate from drowning out strong private information. The failure mode to watch for is reference class tennis, where you choose the outside view category that gives the answer you want, or conversely, laundering away real advantage because it feels too specific to count. We are measuring these rules by their ability to produce calibrated probabilities that maximize decision-relevant expected value, not by how humble they sound. A rule that forces you to ignore a genuine competitive advantage in the name of statistical purity is just as dangerous as one that lets you ignore the graveyard of failed predecessors. We want a procedure that treats the base rate as an anchor rather than a cage, and treats the inside view as evidence to be weighed rather than a verdict to be accepted.

  In the top tier, I place the procedures that successfully integrate the causal structure of the inside view with the statistical weight of the outside view without simply averaging two numbers that may not be on the same scale. Rule seven earns a score of 92 because it correctly identifies that the inside view is best suited for identifying mechanisms and failure modes while the outside view is best suited for setting the overall difficulty scale, avoiding the error of treating an uncalibrated inside-view probability as a peer to the base rate. Its most likely failure is that it requires significant cognitive labor to separate shape from magnitude cleanly. Rule four follows closely with a score of 88 since outsourcing the judgment to a calibrated stranger effectively removes the ego bias that corrupts the inside view while preserving the information content if the summary is good. The failure mode here is finding a stranger who is truly calibrated and domain-literate enough to judge the technical advantage. Rule nine gets a score of 85 because calibrating your inside view against your own historical track record is the gold standard for long-term improvement, but it drops slightly because it requires a dataset of past predictions that you may not have formally tracked. If you lack that personal history, this rule becomes impossible to execute faithfully.

  The middle tier contains rules that are useful but have significant limitations in how they combine the two views or rely on arbitrary thresholds. Rule two receives a score of 75 as logarithmic pooling is mathematically sound for combining independent estimates, but it fails here because it treats your inside-view number as a calibrated probability when it is likely just a confidence feeling converted to a percentage. Rule six scores 70 because enforcing a reference class size floor prevents overfitting to a tiny class, but it risks forcing you into a class so general that it ignores the specific advantages you actually possess. Rule eight gets a score of 68 since the transmission test is a good filter for rhetorical padding, but it is difficult to quantify exactly how much weight the surviving residue should carry against the base rate. Rule ten scores 60 because pre-registering refusal criteria prevents cherry-picking reference classes, which is a major improvement on standard outside view practice, but it still leaves the combination problem unsolved once the class is chosen.

  The bottom tier consists of procedures that are either too arbitrary, too qualitative, or too paralyzed to serve as a primary decision rule. Rule eleven gets a score of 55 because while expert intuition is real, codifying it as coherence-checked adjustment without a rigorous prior step invites the very biases we are trying to avoid. Rule five scores 45 since the pre-mortem inversion is an excellent qualitative tool for risk identification but does not yield a probabilistic output needed for this decision. Rule three receives a score of 30 because capping the probability at a fixed multiple of the base rate is an arbitrary heuristic that lacks epistemic justification and may crush valid outliers. Rule one scores 20 because requiring measured predictive weight for every inside-view consideration leads to analysis paralysis and effectively vetoes the inside view unless you have meta-data you likely do not possess.

  Applying the top-ranked procedure, rule seven, to your specific case requires us to take the outside view magnitude as the anchor and use the inside view to adjust the shape of the distribution. The base rate for independent research groups of this size surviving five years is approximately 8 percent, which sets the scale of difficulty for the environment. Your inside view identifies a specific causal mechanism, which is that half the founding team has successfully executed a smaller version of this exact work, a feature not present in the average case of the reference class. This specific advantage justifies moving the probability upward from the base rate, but the magnitude of the move must be constrained by the fact that the environment itself remains hostile, as evidenced by the 1 in 12 failure rate of even well-equipped groups. A factor of three to four times the base rate is a reasonable premium for a proven team advantage in a high-failure domain, whereas the 40 to 60 percent inside-view estimate implies a five to seven times premium that ignores the environmental drag captured by the outside view. The probability that the group still exists and is doing work anyone cites five years from now is 30 percent.
