          *   *Analysis:* (1) says sentience is a degree. (6) says nature has no sharp lines. (3) says thermostats have *literally zero*. This implies a sharp line between "non-sentient" and "minimally sentient." If sentience is truly continuous from 0 to 1, there must be a point where it goes from 0 to 0.000...1. Is that a "magic switch"?
