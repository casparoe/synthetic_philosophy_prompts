answer: |-
  ### Specification Requirements for ICU Protocol

  To be actionable at 3 AM and defensible in audit, an account of the doing/allowing distinction must satisfy the following requirements.

  1.  **Observability (The "Black Box" Requirement)**
      *   **Motivation:** A junior doctor must be able to classify an action based on the medical record and physical setup, not by interrogating a colleague's mental state. This addresses the **surgeon programming a lethal infusion** who is asleep when it runs; the protocol must judge the setup, not the sleep-state intention.
      *   **Status:** **Non-negotiable.** (Legal and ethical audit requires evidence, not mind-reading.)

  2.  **Institutional Agency**
      *   **Motivation:** Decisions are increasingly embedded in **allocation algorithms and software defaults** (e.g., the ventilator reassignment algorithm). The account must classify the *system's* behavior as doing or allowing when no individual clinician actively opts out.
      *   **Status:** **Non-negotiable.** (Modern critical care is socio-technical; individualist accounts fail here.)

  3.  **Causal Agnosticism**
      *   **Motivation:** The protocol cannot require clinicians to resolve metaphysical debates about whether **omissions are causes**. It must function regardless of whether stopping a ventilator is "causing death" or "allowing the pathology to proceed."
      *   **Status:** **Non-negotiable.** (Clinical decision-making cannot halt for philosophical consensus.)

  4.  **Independence from Intention (DDE Separation)**
      *   **Motivation:** While intention matters for *murder*, this protocol governs *authorization*. A **clinician withdrawing life support she initiated** acts permissibly regardless of whether she feels relief or grief; the act type must be classifiable without probing her wish for the patient's death.
      *   **Status:** **Non-negotiable.** (If the distinction collapses into intention, it fails the Observability requirement.)

  5.  **Uncertainty Tolerance**
      *   **Motivation:** Prognosis is probabilistic. A **decision taken under genuine uncertainty** that leads to death must be classifiable without hindsight bias determining whether it was killing or letting die.
      *   **Status:** **Non-negotiable.** (Medicine is inherently probabilistic.)

  ---

  ### Evaluation of Proposed Desiderata

  You asked which of your specific list are genuine desiderata for this protocol and which are partisan philosophical demands.

  *   **Drawable from outside the agent's head:** **Genuine Desideratum.** (Required for auditability and the 3 AM test.)
  *   **Apply to institutions/standing orders:** **Genuine Desideratum.** (Required for algorithmic governance in modern ICUs.)
  *   **Not rest on contested causal claims:** **Genuine Desideratum.** (Required for clinical usability.)
  *   **Not collapse into intending/foreseeing:** **Genuine Desideratum.** (Required to maintain Observability; intention is not auditable.)
  *   **Treat doing/allowing and killing/letting-die as one distinction:** **Partisan Demand.** (Philosophically contested; practically, the protocol can treat them as a single "authorization category" without resolving the metaphysical unity.)
  *   **Same verdict on the bathtub pair:** **Partisan Demand.** (This is a moral intuition pump; a protocol needs clear rules, not necessarily intuitive symmetry between acts and omissions.)
  *   **Mark a difference between trolley and transplant:** **Partisan Demand.** (While morally important, a treatment-limitation protocol rarely faces organ harvesting; this is a theoretical stress-test, not a clinical necessity.)

  ---

  ### Incompatibility Analysis

  **The Impossible Subset:**
  You cannot jointly satisfy **Observability (Outside the head)**, **Causal Agnosticism**, and **Robust Moral Distinctions (Trolley/Transplant & Bathtub Pair)**.
  To mark the difference between the trolley and the transplant, or to equate the bathtub killer with the bathtub non-rescuer, without referencing intention or deep causal metaphysics, you must rely on normative baselines (what is "normal" care). But defining "normal" care objectively, without referencing the very intentions or causal norms you sought to exclude, is circular. A purely external, causally simple account will often classify the transplant surgeon and the trolley switch-puller identically (both physically intervene to cause death), failing the moral intuition test.

  **The Exclusionary Requirement:**
  **Observability (Drawable from outside the agent's head)** does the most work in excluding otherwise attractive accounts.
  It immediately disqualifies Intention-based accounts (which are philosophically popular but legally unverifiable) and pure Skepticism (which offers no decision rule). It forces the committee to adopt a Baseline/Rule-based account, even if that account is philosophically imperfect.

  ---

  ### Scoring Theoretical Families

  **1. Counterfactual or Baseline Accounts**
  *Score:* **Best fit for protocol, but fragile.**
  They satisfy observability and institutional application by defining "allowing" as a departure from a standard baseline of care, but they struggle to define that baseline without smuggling in normative judgments.

  **2. Intention-based Accounts**
  *Score:* **Unusable for this purpose.**
  They fail the non-negotiable Observability requirement entirely, as auditing a 3 AM decision for "intent" is impossible without mind-reading or coercive interrogation.

  **3. Skepticism (No Moral Weight)**
  *Score:* **Dangerous for authorization.**
  While philosophically defensible, it offers no decision rule for the junior doctor, effectively authorizing them to treat killing and letting die as identical, which violates legal and professional norms.
