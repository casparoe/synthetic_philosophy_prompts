prompt: |-
  What must a theory of mental causation actually deliver? Before I evaluate any particular view—interventionism about mental causation, the subset-of-powers approach, counterfactual coextension, constitution views, or straight eliminativism—I want the full specification of what the theory is supposed to do. Write the desiderata: the phenomena any adequate account of how (or whether) mental states and events cause physical behavior must explain or accommodate, the cases it must get right, the metaphysical constraints it cannot simply dismiss, and the distinctions it must respect. For each requirement, give the consideration or case that motivates it.

  In particular, address the following. The causal closure of the physical: is it a non-negotiable constraint, a regulative ideal, or a prejudice of one camp? The exclusion worry itself—that if every physical effect has a sufficient physical cause, mental causes are either epiphenomenal or overdeterminers—should appear on the list, but say whether it is a genuine desideratum or the conclusion of an argument that a theory might resist by rejecting a premise. The distinction between causation and mere counterfactual dependence, and between causation and causal explanation: which must a theory respect, and what turns on collapsing them? The difference between mental-to-mental and mental-to-physical causation: must a single account cover both? The causal efficacy of conscious versus unconscious mental states: is that a distinction a theory must capture, or can it treat them uniformly? The apparent difference between rationalizing explanation (reasons as causes) and mechanistic explanation: must a theory unify them, or can it let them sit side by side? The problem of causal proportionality—that mental causes often seem too coarse-grained or too fine-grained for their alleged effects—and whether a theory must solve it or may dissolve it.

  Then, flag any pair (or larger subset) of these desiderata that you suspect cannot be jointly satisfied—this is where the causal exclusion argument lives, and I want to see exactly which commitments generate the tension. If the list itself shows that no theory can have everything, say so and identify the minimal revision that restores consistency. Do not score individual theories; the desiderata are the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of mental causation:

  1.  **Analyze the Request:**
      *   **Goal:** Specify the *desiderata* (requirements, constraints, phenomena to explain) for any adequate theory of mental causation.
      *   **Scope:** Must cover metaphysical constraints, explanatory distinctions, specific cases, and tensions.
      *   **Specific Topics to Address:**
          *   Causal Closure of the Physical (Constraint vs. Prejudice).
          *   The Exclusion Worry (Desideratum vs. Conclusion).
          *   Causation vs. Counterfactual Dependence vs. Causal Explanation.
          *   Mental-to-Mental vs. Mental-to-Physical Causation.
          *   Conscious vs. Unconscious Mental States.
          *   Rationalizing vs. Mechanistic Explanation.
          *   Causal Proportionality (Coarse/Fine-grained).
      *   **Critical Task:** Identify incompatibilities/tensions between desiderata (where the exclusion argument lives) and suggest minimal revisions if consistency is impossible.
      *   **Constraint:** Do *not* evaluate specific theories (interventionism, eliminativism, etc.). Focus solely on the job description.

  2.  **Deconstruct the Topics & Formulate Desiderata:**

      *   *Causal Closure:* Is it a hard constraint? Most physicalists say yes. Non-reductive physicalists try to accommodate it. Dualists might reject it. *Decision:* Frame it as a constraint for physicalist-compatible theories, but note that a general theory must state its stance on it clearly. Let's treat it as a "Metaphysical Constraint" that creates the pressure.
      *   *Exclusion Worry:* This is the core problem. A theory must either solve it (show mental causes aren't excluded) or explain why it's a false dilemma. *Decision:* List it as a "Problem to Resolve."
      *   *Causation vs. Dependence vs. Explanation:* Crucial distinction. Counterfactuals aren't enough (preemption cases). Explanation isn't causation (flagpole shadow). *Decision:* Require the theory to distinguish these and specify which one mental states provide.
      *   *M-to-M vs. M-to-P:* Can we have one without the other? Usually, M-to-P is the hard one. M-to-M might rely on M-to-P. *Decision:* Require an account of M-to-P as primary, with M-to-M derivative or co-equal.
      *   *Conscious vs. Unconscious:* Does consciousness add causal oomph? Epiphenomenalism about qualia is a risk. *Decision:* Require the theory to address whether phenomenology is causally relevant.
      *   *Rationalizing vs. Mechanistic:* Davidson's Anomalous Monism vibe. Reasons as causes vs. neural mechanisms. *Decision:* Require an account of how normative force connects to efficient causation.
      *   *Proportionality:* Yablo's problem. Is it the *pain* or the *C-fiber firing* that caused the wince? *Decision:* Require the theory to handle grain/level issues.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Drafting Constraint 1 (Closure):* Needs to be precise. "Every physical event has a sufficient physical cause."
      *   *Drafting Constraint 2 (Exclusion):* "No systematic overdetermination."
      *   *Drafting Explanation:* "Must explain action intelligibly."
      *   *Drafting Distinctions:* "Causation $\neq$ Correlation."

      *Refining for the Prompt's Depth:* The prompt asks for *motivations* for each. I need to explain *why* each is on the list (e.g., the intuition behind closure, the intuition behind efficacy).

  4.  **Identifying Tensions (The "Hard Part"):**
      *   The prompt explicitly asks to flag incompatible subsets. This is the heart of the Exclusion Argument.
      *   *The Trilemma:*
          1.  Mental Causation (M causes P).
          2.  Causal Closure (P has sufficient P-cause).
          3.  No Overdetermination (P doesn't have two distinct sufficient causes).
          4.  Distinctness (M $\neq$ P).
      *   If you keep 1, 2, 3, you must reject 4 (Identity Theory). If you keep 2, 3, 4, you must reject 1 (Epiphenomenalism).
      *   *Proportionality Tension:* If M is coarse-grained and P is fine-grained, how can M cause P without violating closure or proportionality?
      *   *Explanation Tension:* Rationalizing explanation implies normativity; mechanistic implies brute force. Unifying them is hard.

  5.  **Structuring the Output:**
      *   **Introduction:** Set the stage (the "Job Description").
      *   **Section 1: Metaphysical Constraints:** Closure, Exclusion, Distinctness.
      *   **Section 2: Explanatory Phenomena:** M-to-P, M-to-M, Rationalization.
      *   **Section 3: Conceptual Distinctions:** Causation vs. Dependence, Conscious vs. Unconscious, Proportionality.
      *   **Section 4: The Incompatibility Matrix (Crucial):** Where the tensions lie.
      *   **Section 5: Minimal Revisions:** How to restore consistency (the "cost" of doing business).

  6.  **Refining Specific Points based on Prompt Instructions:**
      *   *Closure:* Don't just say it's true. Ask the theory to specify its status (constraint vs. empirical generalization).
      *   *Exclusion:* Is it a desideratum to *avoid* exclusion? Yes, unless the theory argues exclusion is benign.
      *   *Causation vs. Explanation:* Explicitly ask the theory to choose.
      *   *Consciousness:* Make sure the "hard problem" of causal efficacy is noted.
      *   *Proportionality:* Frame it as a constraint on the *relation*, not just the relata.

  7.  **Final Review against Constraints:**
      *   Did I evaluate theories? No.
      *   Did I cover all specific topics requested? Yes (Closure, Exclusion, Dependence, M-M/M-P, Conscious/Unconscious, Rational/Mechanistic, Proportionality).
      *   Did I identify tensions? Yes.
      *   Did I suggest minimal revisions? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe list Closure as a hard "Must."
      *   *Correction:* The prompt asks if it's non-negotiable or prejudice. I should frame the desideratum as: "The theory must explicitly adjudicate the status of Closure." However, for a *physicalist* theory of mental causation, it's usually treated as a constraint. I will frame it as a constraint that generates the tension, noting that rejecting it is a "revision."
      *   *Initial thought:* Treat M-M and M-P as equal.
      *   *Correction:* M-P is the bottleneck. If M causes P, M-M is usually secured via P intermediaries. I will prioritize M-P.
      *   *Check:* Did I address "Causal Explanation" vs "Causation"? Yes, this is the Davidson/Lewis split. Need to ensure the desideratum demands clarity here.

  9.  **Final Polish:** Ensure tone is philosophical, precise, and neutral (descriptive of requirements, not prescriptive of solutions). (Proceed to generate output).

  *(Self-Correction on the "Incompatibility" section)*: I need to be very clear that the Exclusion Argument *is* the proof that the desiderata are inconsistent. I should lay out the "Inconsistent Tetrad" clearly.

  *(Self-Correction on "Minimal Revision")*: I need to suggest which desideratum is the "weakest link" that philosophers usually drop to save the rest. (Usually Distinctness or No Overdetermination).

  10. **Final Output Generation** (matching the thought process above).
answer: |-
  Here is the specification of the desiderata for a theory of mental causation. This list functions as a job description: it details the phenomena, constraints, and distinctions any adequate account must address. Following the list, I identify the structural tensions inherent in these requirements and the minimal revisions required to restore consistency.

  ### I. Metaphysical Constraints

  **1. The Status of Causal Closure**
  *   **Requirement:** The theory must explicitly adjudicate the status of the Causal Closure of the Physical (CCP). It must state whether CCP is treated as a non-negotiable metaphysical constraint, a robust empirical generalization, or a dispensable prejudice.
  *   **Motivation:** CCP asserts that every physical event that has a cause has a sufficient physical cause. If a theory treats CCP as absolute, it restricts mental causation to non-competitive relations with physical causation. If it treats CCP as contingent, it opens the door to interactionist dualism but risks violating conservation laws. A theory cannot remain silent on this; its stance determines the available solution space for the exclusion problem.

  **2. The Exclusion Worry**
  *   **Requirement:** The theory must resolve or dissolve the Exclusion Worry. It must demonstrate that mental causes are not rendered epiphenomenal by physical causes, nor does it systematically posit widespread causal overdetermination.
  *   **Motivation:** If a physical cause ($P$) is sufficient for a behavioral effect ($B$), and a mental cause ($M$) is distinct from $P$, $M$ appears to have no work left to do. Either $M$ is inert (epiphenomenalism), or $B$ is systematically overdetermined (like two assassins firing at once). An adequate theory must explain how $M$ can be causally relevant without being a redundant competitor to $P$.

  **3. The Distinctness Constraint**
  *   **Requirement:** The theory must specify the ontological relationship between mental states and physical states. It must clarify whether $M$ and $P$ are numerically identical, metaphysically distinct, or related via realization/constitution.
  *   **Motivation:** If $M$ and $P$ are identical, exclusion is avoided but mental properties risk collapsing into physical properties (reductionism). If they are distinct, exclusion looms. A theory must commit to a relation that preserves the autonomy of the mental (to save psychology) while securing its causal integration (to save efficacy).

  ### II. Explanatory Phenomena

  **4. Mental-to-Physical Causation (M$\to$P)**
  *   **Requirement:** The theory must provide a mechanism or account for how mental states (beliefs, desires, pains) bring about physical bodily movements.
  *   **Motivation:** This is the primary intuition driving the debate. When I raise my arm because I want to vote, the desire must be causally relevant to the muscle contraction. A theory that secures Mental-to-Mental causation but fails at M$\to$P (e.g., by making the physical world a closed causal loop) fails the core intuition of agency.

  **5. Mental-to-Mental Causation (M$\to$M)**
  *   **Requirement:** The theory must account for causal relations between mental states (e.g., a belief causing a new inference, or a perception causing a desire).
  *   **Motivation:** Cognitive science and folk psychology presuppose that mental states causally interact. If $M_1$ causes $M_2$, but $M_1$ cannot cause physical realizers, the causal chain of the mind is severed. While M$\to$P is often viewed as the harder constraint, a theory that sacrifices M$\to$M renders the mind a static sequence of episodes rather than a dynamic system.

  **6. Rationalizing vs. Mechanistic Explanation**
  *   **Requirement:** The theory must explain the relationship between normative rationalization (explaining action by reasons) and brute mechanistic causation (explaining movement by neural forces). It must state whether these are two descriptions of one relation or two distinct relations.
  *   **Motivation:** Reasons justify; neurons push. If mental causation is merely mechanistic, the normative force of reasoning is lost (the "normativity problem"). If it is merely rationalizing, it lacks causal oomph. An adequate theory must unify the space of reasons with the realm of law, or explain why they can coexist without interaction.

  ### III. Conceptual Distinctions

  **7. Causation vs. Counterfactual Dependence**
  *   **Requirement:** The theory must distinguish between a state *causing* an effect and a state merely being *counterfactually dependent* upon the effect (or vice versa).
  *   **Motivation:** Counterfactual dependence is necessary but not sufficient for causation (e.g., preemption cases, common cause scenarios). If a theory collapses causation into counterfactual dependence, it risks counting epiphenomenal correlates as causes. The theory must specify if mental states are *producers* of effects or merely *indicators* upon which effects depend.

  **8. Causation vs. Causal Explanation**
  *   **Requirement:** The theory must distinguish between ontological causation (the relation in the world) and causal explanation (the relation in our discourse).
  *   **Motivation:** It is possible that mental states explain physical behavior without literally causing it (explanatory pluralism). However, if a theory retreats to "explanation only," it risks conceding epiphenomenalism. The desideratum demands the theory declare whether mental causation is a feature of reality or a feature of our descriptive practices.

  **9. Conscious vs. Unconscious Efficacy**
  *   **Requirement:** The theory must address whether the phenomenology of a mental state contributes to its causal power, or if causation is carried entirely by the unconscious/functional substrate.
  *   **Motivation:** If unconscious beliefs cause behavior just as well as conscious ones, the qualitative "feel" of consciousness may be causally inert (the "explanatory gap" applied to causation). A theory must capture whether consciousness makes a causal difference or is a passenger on a functional vehicle.

  **10. Causal Proportionality**
  *   **Requirement:** The theory must address the grain of causation. It must explain how mental causes (often coarse-grained, e.g., "pain") can be proportional to physical effects (fine-grained, e.g., "specific muscle fiber contraction") without being too vague to cause or too specific to be mental.
  *   **Motivation:** Yablo's proportionality constraint suggests a cause must be commensurate with its effect. If the physical realizer is too specific, it excludes the mental property; if the mental property is too general, it fails to necessitate the effect. The theory must solve the "level" problem.

  ---

  ### IV. The Incompatibility Matrix (The Tension Points)

  The desiderata above cannot be jointly satisfied without revision. The Causal Exclusion Argument is precisely the proof that a specific subset of these requirements forms an **Inconsistent Tetrad**.

  **The Inconsistent Tetrad:**
  1.  **Mental Causation:** Mental states causally influence physical behavior (Desideratum 4).
  2.  **Causal Closure:** Every physical effect has a sufficient physical cause (Desideratum 1).
  3.  **No Overdetermination:** Physical effects are not systematically causally overdetermined by distinct causes (Desideratum 2).
  4.  **Distinctness:** Mental states are not identical to physical states (Desideratum 3).

  **The Tension:**
  *   If you accept **Closure** and **Distinctness**, then for any physical behavior, there is a physical cause distinct from the mental cause.
  *   If you accept **No Overdetermination**, the physical cause "excludes" the mental cause.
  *   Therefore, to save **Mental Causation**, you must reject one of the other three.

  **Secondary Tensions:**
  *   **Proportionality vs. Closure:** If the physical cause is the *proportional* cause (being fine-grained enough to necessitate the effect), the mental cause (being coarse-grained) looks like a candidate for exclusion. If the mental cause is the proportional one, Closure is threatened because the physical realizer might be too specific to be the *true* cause.
  *   **Rationalization vs. Mechanism:** Unifying normative rationalization with brute mechanistic causation (Desideratum 6) often requires collapsing the distinction between reasons and forces. Maintaining the distinction often leads to a dual-explanation view that risks making rationalization causally inert.
  *   **Consciousness vs. Efficacy:** Preserving the causal efficacy of *phenomenal* consciousness (Desideratum 9) while respecting Closure often requires property dualism, which exacerbates the Exclusion Worry. Treating them uniformly (functionalism) saves efficacy but risks eliminating the specific causal role of phenomenology.

  ---

  ### V. Minimal Revisions for Consistency

  Since no theory can satisfy all desiderata as stated, an adequate theory must explicitly identify which desideratum it revises. Here are the minimal revisions required to restore consistency, representing the major "camps" in the literature:

  **Revision A: Reject Distinctness (The Identity Solution)**
  *   **Modification:** Mental states *are* physical states (Type Identity or Token Identity).
  *   **Cost:** Collapses the mental/physical distinction. Risks eliminating the autonomy of psychology and making mental properties reducible to physical properties.
  *   **Consistency:** Saves Closure, No Overdetermination, and Mental Causation.

  **Revision B: Reject No Overdetermination (The Compatibilist Solution)**
  *   **Modification:** Allow systematic, non-accidental overdetermination (e.g., via constitution or realization relations).
  *   **Cost:** Violates the parsimony intuition that effects do not have multiple sufficient causes. Requires a robust account of how two causes can be "one" in the relevant sense without being identical.
  *   **Consistency:** Saves Distinctness, Closure, and Mental Causation.

  **Revision C: Reject Causal Closure (The Interactionist Solution)**
  *   **Modification:** Physical events do not always have sufficient physical causes; mental causes can intervene in the physical chain.
  *   **Cost:** Conflicts with established physics (conservation laws). Requires a dualist ontology.
  *   **Consistency:** Saves Distinctness, No Overdetermination, and Mental Causation.

  **Revision D: Reject Mental Causation (The Epiphenomenalist/Eliminativist Solution)**
  *   **Modification:** Mental states do not cause physical behavior (either they are inert byproducts or they do not exist).
  *   **Cost:** Violates the core intuition of agency and the presuppositions of folk psychology and cognitive science.
  *   **Consistency:** Saves Distinctness, Closure, and No Overdetermination.

  **Revision E: Reject the Causation/Explanation Distinction (The Deflationary Solution)**
  *   **Modification:** Mental states do not *cause* in the metaphysical sense but provide indispensable *explanations* (Desideratum 8 revised).
  *   **Cost:** Concedes that mental causation is not a feature of the fundamental ontology, potentially rendering it less "real" than physical causation.
  *   **Consistency:** Saves the utility of psychology without violating physical metaphysics.

  **Conclusion on Deliverables:**
  An adequate theory of mental causation is not one that satisfies all ten desiderata naively. It is one that **explicitly selects a revision strategy (A–E)** and demonstrates that the resulting package minimizes theoretical cost while preserving the core intuitions of agency and physical order. Any theory that claims to satisfy the Inconsistent Tetrad without argument is failing the specification.
