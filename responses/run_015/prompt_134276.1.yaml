answer: |-
  Here is a complete lesson plan designed to fit your 80-minute slot, hit the philosophical targets, and run smoothly with 14 students.

  I have refined your "lag" mechanic slightly. In practice, a gauge that "only answers questions asked once before" requires complex bookkeeping that eats seminar time. I have swapped this for a **"Calibration vs. Test"** structure. It preserves your spine (instrument, track record, self-test, justification, challenge) but ensures the game actually finishes within 80 minutes while generating the exact same epistemic tension.

  # Seminar Plan: The Black Box Diagnostic

  ## 1. Materials List (Cheap & Analog)
  *   **7 Envelopes** (one per team), labeled Team 1–7.
  *   **Inside each envelope:**
      *   3 **"Readout" Cards** (Index cards, all identical): Front says "SENSOR OUTPUT: RED". Back says "SENSOR OUTPUT: BLACK". (Pre-set them all to RED for simplicity, or randomize if you want noise. For this lesson, **make them all RED** to isolate the justification problem from reliability noise).
      *   2 **"Diagnostic" Slips** (Small paper): Says "SYSTEM STATUS: NOMINAL".
      *   1 **"Bet" Sheet** (Half-page): Spaces for Round 1, 2, 3 bets and Justification.
  *   **14 "Challenge Tokens"** (Poker chips, or folded distinct-colored paper). Two per team.
  *   **Whiteboard** for scoring.
  *   **A "Master Deck"** (Instructor only): 3 Cards matching the team envelopes (to reveal the "Truth" in Calibration).

  ## 2. The Rules (Handout or Projected)
  **Objective:** Maximize Team Points.
  **The Setup:** You are remote operators. You have a **Sensor** (the Readout Card) and a **Diagnostic Tool** (the Slip). You do not see the Target Card (the Truth) directly.
  **The Rounds:**
  1.  **Calibration (Rounds 1 & 2):** You open the Readout. You open the Diagnostic. The Instructor reveals the Target Truth.
  2.  **Test (Round 3):** You open the Readout. **You do NOT get a Diagnostic slip. The Instructor does NOT reveal the Truth.** You must Bet (Red/Black).
  **Scoring:**
  *   Correct Bet: **+10 Points**.
  *   Incorrect Bet: **0 Points**.
  *   **Abstaining:** **-5 Points** (You must bet).
  *   **Justification Challenge:** After Round 3, you submit a 1-sentence Justification for your bet.
      *   Rival teams may spend a **Challenge Token** to steal your Round 3 points if your justification is "epistemically illicit."
      *   If the Challenge succeeds, they get your 10 points. You get 0.
      *   If the Challenge fails, they lose the token. You keep points.

  ## 3. Minute-by-Minute Timeline (80 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Setup** | Divide into 7 teams of 2. Distribute envelopes. **Do not let them open yet.** Explain the "Remote Operator" fiction. |
  | **05-15** | **Calibration (Rounds 1 & 2)** | Guide them step-by-step. "Open Readout." (It says RED). "Open Diagnostic." (It says NOMINAL). "Instructor reveals Truth." (It is RED). <br> *Repeat for Round 2.* <br> **Crucial:** Ask them to note the "Perfect Match" on their Bet Sheet. |
  | **15-25** | **The Test (Round 3)** | "Open Readout." (It says RED). "Do **NOT** open Diagnostic. Do **NOT** ask for Truth." <br> Teams must write their Bet (Red/Black) and their **One-Line Justification**. <br> *Collect Bet Sheets.* |
  | **25-35** | **The Challenge Phase** | Read justifications aloud (anonymized or by team). Allow rivals to spend tokens to challenge. <br> *Instructor acts as Judge.* (See Troubleshooting for ruling criteria). |
  | **35-40** | **The Reveal** | Reveal the Round 3 Truth (It was RED). Reveal that the Sensor was **100% Reliable** the whole time. <br> Ask: "Did anyone *know* it was Red in Round 3?" |
  | **40-55** | **Debrief & Mapping** | Map game moves to the Bootstrapping Argument. (See Section 5). |
  | **55-70** | **The Auction** | "How many 'Nominal' diagnostics would you need to claim knowledge?" Bid rounds. Discuss why 'Zero' is impossible but 'Infinity' is skeptical. |
  | **70-80** | **Wrap & Standard Cases** | Connect to Fuel Gauge/Vision. Assign reading. |

  ## 4. Scoring Scheme
  *   **Base:** 10 points for correct Round 3 bet.
  *   **Penalty:** -5 for abstaining (enforce this to force the "knowledge claim").
  *   **Challenge:** Successful challenge transfers the 10 points from the betting team to the challenging team.
  *   **Winner:** Team with most points gets a trivial prize (e.g., choice of next week's reading topic, or candy).

  ## 5. The Debrief: Mapping Game to Argument
  *Do not use the words "Circular" or "Bootstrapping" until this section.*

  **Step 1: The Reconstruction**
  Write this on the board based on their Round 3 Justifications (which will likely look like this):
  1.  **Premise 1:** In Rounds 1 & 2, the Sensor said "Red" and the Diagnostic said "Nominal." (The Data)
  2.  **Premise 2:** In Rounds 1 & 2, the World was indeed "Red." (The Calibration)
  3.  **Inference:** Therefore, the Sensor is Reliable. (The Generalization)
  4.  **Conclusion:** In Round 3, the Sensor says "Red," so the World is "Red." (The Knowledge Claim)

  **Step 2: The Trap (Where the Gut Feeling Lives)**
  Ask the class: *"Which step is the problem?"*
  *   **Step 1?** No, they saw the slips.
  *   **Step 2?** No, you (the Instructor) told them the truth.
  *   **Step 3?** This looks like ordinary induction. (Address this in Troubleshooting).
  *   **Step 4?** This looks valid if Step 3 is true.

  **The Pivot:** Ask, *"In Round 3, how did you verify Premise 1?"*
  *   They didn't. They assumed the Diagnostic worked.
  *   Ask, *"In Rounds 1 & 2, how did you verify the Diagnostic worked?"*
  *   They compared it to the Sensor Output + World Truth.
  *   **The Kicker:** *"If the Diagnostic is just part of the Sensor (self-verification), then in Rounds 1 & 2, you used the Sensor to check the Sensor."*

  **Map to Philosophy:**
  *   **Sensor Output** = Perceptual Experience ("It looks red").
  *   **Diagnostic** = Reflection on Experience ("I seem to see red clearly").
  *   **World Truth** = The Fact ("It is red").
  *   **The Bootstrapping Argument:**
      1.  I believe $P$ (based on Sensor).
      2.  $P$ is true (based on Sensor).
      3.  Therefore, Sensor is reliable.
      4.  Therefore, I know $P$.

  **Step 3: Where to Resist?**
  Draw a fork on the board.
  *   **Option A (Skepticism):** Reject Step 3. You can never confirm a source using itself. Cost: You can't trust your eyes, memory, or logic without an infinite regress of external checks.
  *   **Option B (Dogmatism/Externalism):** Accept Step 3. If the source *is* reliable, you know, even if you can't prove it without circularity. Cost: You have to admit "Justification" doesn't mean "Ability to cite non-circular reasons."
  *   **Option C (Contextualism):** Step 3 is okay in low-stakes (Calibration), not okay in high-stakes (Challenge).

  ## 6. Troubleshooting: Predictable Failures

  **Problem 1: "This is just Induction. What's the fuss?"**
  *   **Prediction:** A student will argue that 2 successful trials justify a bet on the 3rd.
  *   **Response:** "Agreed, *if* the trials are independent. Were they? To count Round 1 as a 'success,' you had to trust the Diagnostic. The Diagnostic is part of the Sensor. You assumed the Sensor works to prove the Sensor works. That's not induction; that's a tautology dressed as data."
  *   **Backup:** Ask, "If I tell you my Magic 8-Ball says 'Yes' to 'Are you reliable?', and it says 'Yes', do you trust it?"

  **Problem 2: "The Common Maker" (Two Gauges Agree)**
  *   **Prediction:** Teams might argue, "The Sensor and Diagnostic agreed, so they share a common cause."
  *   **Response:** "Possible. But do you have evidence of a Common Maker, or are you hypothesizing one to save the data? In epistemology, hypothesizing a cause to validate the evidence for the hypothesis is also bootstrapping."

  **Problem 3: "The Instructor Verified It"**
  *   **Prediction:** "But *you* told us the Truth in Rounds 1 & 2. We didn't use the Sensor to check the Sensor."
  *   **Response:** "True. That's why Round 1 & 2 felt safe. But in Round 3, you don't have me. You only have the Sensor's history. Does the history count as evidence if the *recording* of the history relied on the Sensor itself?"
  *   **Why I changed your "Lag" mechanic:** Your original idea (Gauge answers only past questions) forces the student to realize they have no *current* access to truth. My "Calibration" version achieves this faster: In Round 3, the "Diagnostic" (access to truth) is removed.

  **Problem 4: Students feel cheated because the Sensor *was* reliable.**
  *   **Response:** Lean into this. "That is exactly Vogel's point. The problem isn't that the belief is false. The problem is that the *warrant* is structurally defective. You can have a True Belief from a Reliable Source and still lack Knowledge."

  ## 7. What the Game Cannot Stage (Be Honest Here)
  In the final 5 minutes, admit the limitations:
  1.  **Phenomenology:** The game treats vision like a sensor slip. But vision *feels* like direct access. Bootstrapping feels worse for vision because vision presents itself as "transparent." The game makes it feel like a black box, which makes the circularity easier to spot than in real life.
  2.  **Default Entitlement:** The game forces them to justify. In real life, we don't justify our eyes unless challenged. The game simulates the "Challenge Context" where bootstrapping becomes visible.
  3.  **The "Zero" Problem:** In the Auction, they will struggle to name a number. Acknowledge that this is the "Easy Knowledge" paradox. If 100 checks work, why doesn't 1? If 1 doesn't, why does 100? (Answer: 100 independent checks work. 100 self-checks don't).

  ## 8. Instructor Script for the "Challenge" Phase
  *When reading justifications:*
  *   **Safe:** "I bet Red because the Instructor has not lied to us yet." (Trust in Instructor, not Sensor).
  *   **Unsafe (Challengeable):** "I bet Red because the Sensor has been accurate in the past." (Assumes past accuracy was known independently).
  *   **Unsafe (Challengeable):** "I bet Red because the Diagnostic said it was working." (Direct circularity).

  *If a team challenges:*
  Ask them: "Did the betting team assume the reliability of the source to prove the reliability of the source?" If yes, transfer points.

  ## 9. Closing Auction Script
  "Okay, imagine you keep getting 'NOMINAL' slips. Round 4, 5, 6... 100. At what number do you raise your hand and say 'I *Know* the Sensor is Reliable'?"
  *   If they say "Never": You are a Skeptic.
  *   If they say "1": You are a Dogmatist.
  *   If they say "It depends on the stakes": You are a Contextualist.
  *   **The Point:** There is no obvious number where "Self-Verification" turns into "Knowledge." That is the paradox.

  ---

  ### Why this works for your constraints:
  1.  **No Tech:** Envelopes and paper are fail-safe.
  2.  **No "Circular" until the end:** The rules say "Epistemically Illicit." You define that *after* the game based on their intuition during the Challenge.
  3.  **Gut Feeling:** The frustration of the Challenge Phase (trying to write a justification that doesn't get stolen) simulates the philosophical impasse.
  4.  **Reliability Red Herring:** By making the Sensor actually reliable, you prevent them from solving the problem by saying "The machine was broken." The problem remains even when the machine works.
