answer: |-
  The maxim *astra inclinant, sed non necessitant* ("the stars incline, but they do not compel") is historically Scholastic in origin (often attributed to Albertus Magnus or Aquinas), though it is frequently retrofitted onto Kepler because he sought to reconcile celestial mechanics with human liberty. Kepler's actual position was more nuanced than the slogan suggests: he rejected the traditional zodiacal signs as arbitrary human fictions, retained only the geometric aspects (angles between planets), and proposed a physical mechanism involving light and harmonic resonance acting upon the "sensitive soul" rather than the "rational will."

  Below are four distinct precise principles that the slogan might express in your friend's argument, analyzed according to your specifications.

  ### 1. The Causal-Temperamental Reading
  This is the standard Renaissance medical-astrological view. Celestial bodies physically alter the sublunary environment (heat, light), which shifts the balance of bodily humors, thereby creating biological predispositions.

  *   **Kind of Inclination:** **Causal/Biological.** The stars act as efficient causes on the body's physiology.
  *   **Agency Preserved:** The **Rational Will**. The body feels anger or lust, but the mind chooses whether to act on it.
  *   **Explanatory Level:** **General Temperament & Biological Development.** It explains why you are irritable, not why you got fired.
  *   **"Not Compel" Meaning:** Denies **Strict Determinism.** It asserts that while the impulse is physical, the veto power is mental.
  *   **Evaluation:**
      *   *Scientific Status:* **False.** (No known physical mechanism links planetary positions to human humors.)
      *   *Logical Status:* **Substantive.** (It is a coherent compatibilist model.)
      *   *Kepler Alignment:* **High.** (Kepler believed celestial light affected the Earth's "faculties" and the human sensitive soul.)
      *   *Friend's Utility:* **Partial.** It justifies using a chart for **self-knowledge** (understanding one's biases) but not for predicting specific life events (like marriage or career success).

  ### 2. The Harmonic-Geometric Reading (Specifically Keplerian)
  This reading relies on Kepler's unique theory in *De Fundamentis Astrologiae Certioribus*. Planetary aspects are not physical rays but geometric configurations that the soul perceives unconsciously, similar to how the ear perceives musical consonance.

  *   **Kind of Inclination:** **Harmonic/Psychological.** The inclination is a resonance between cosmic geometry and the archetypal structures of the soul.
  *   **Agency Preserved:** The **Moral Agent.** The soul is "tuned" by the stars, but moral choice remains a function of reason and grace.
  *   **Explanatory Level:** **Psychological Disposition.** It explains emotional rhythms and aesthetic preferences.
  *   **"Not Compel" Meaning:** Denies **Physical Coercion.** The stars sing to the soul, but the soul can refuse to dance.
  *   **Evaluation:**
      *   *Scientific Status:* **False.** (Relies on discredited animistic cosmology.)
      *   *Logical Status:* **Substantive.** (Internally consistent within Kepler's metaphysics.)
      *   *Kepler Alignment:* **Very High.** (This is Kepler's specific innovation over Ptolemy.)
      *   *Friend's Utility:* **Weak.** Modern astrology apps use zodiac signs (which Kepler rejected as imaginary) rather than pure aspects. Unless the app uses Keplerian aspects, this justification is historically inconsistent.

  ### 3. The Statistical-Empirical Reading
  This is a modern reinterpretation. It suggests that "inclination" is merely a correlation observed over time, devoid of causal mechanism.

  *   **Kind of Inclination:** **Statistical.** Celestial configurations are markers or indices, not causes.
  *   **Agency Preserved:** **Individual Voluntary Action.** The future is open; the chart only shows probabilities based on past data.
  *   **Explanatory Level:** **Life Events.** It attempts to predict external outcomes (wealth, travel).
  *   **"Not Compel" Meaning:** Denies **High Predictive Accuracy.** It admits the prediction might be wrong; it is a forecast, not a law.
  *   **Evaluation:**
      *   *Scientific Status:* **False.** (Controlled studies (e.g., Carlson, 1985) show no statistical correlation between birth data and personality/outcomes.)
      *   *Logical Status:* **Trivial.** (If the correlation is too weak to compel, it is too weak to be useful advice.)
      *   *Kepler Alignment:* **Low.** (Kepler insisted on physical causes; he disliked "empirical" astrology that lacked a theoretical basis.)
      *   *Friend's Utility:* **Fails.** If the advice is based on low-probability statistics, treating it as a "rational guide" is irrational gambling.

  ### 4. The Moral-Theological Reading
  This reading treats astrology as a symbolic language. The stars are a text written by God to warn humans, not a machine that pushes them.

  *   **Kind of Inclination:** **Analogical/Symbolic.** The stars signify potential dangers, like a weather vane signifies wind.
  *   **Agency Preserved:** **Moral Obligation.** You are free to sin, but the stars warn you against it.
  *   **Explanatory Level:** **Collective Historical Events / Moral Trials.**
  *   **"Not Compel" Meaning:** Denies **Moral Exemption.** You cannot blame your sins on Saturn; you were warned.
  *   **Evaluation:**
      *   *Scientific Status:* **N/A.** (Metaphysical claim.)
      *   *Logical Status:* **Defensible.** (Coherent within a religious framework.)
      *   *Kepler Alignment:* **Medium.** (Kepler was deeply religious, but he sought physical causes, not just symbols.)
      *   *Friend's Utility:* **Fails.** This justifies astrology as a tool for **vigilance**, not as a guide for optimization or life planning.

  ---

  ### Alignment with Kepler's Documented Position
  The reading that best aligns with Kepler's combination of practice and polemic is **Reading 2 (Harmonic-Geometric)**, closely followed by **Reading 1 (Causal-Temperamental)**.

  Kepler explicitly argued that the "rays" of the planets were not physical effluvia (like heat) but geometric configurations that acted upon the *anima sensitiva* (sensitive soul). He wrote that the earth has a soul that perceives these geometries and reacts (creating weather or influencing conception). However, he maintained a strict dualism: the *rational soul* (the seat of free will and salvation) is immune to this geometry.

  Therefore, for Kepler, "the stars incline" meant **the sensitive appetites are harmonically stimulated**, and "they do not compel" meant **the rational will can override the appetite.**

  ### Utility for Your Friend's Argument
  Your friend wishes to justify treating a natal chart as a **rational guide to life choices**.

  *   **Which Readings Work?** Only **Reading 1 (Causal-Temperamental)** and **Reading 2 (Harmonic-Geometric)** do the work she needs. They allow her to say, "The chart reveals my emotional biases (inclination), so I can rationally compensate for them (non-compulsion)." This frames astrology as a tool of **self-regulation** rather than fortune-telling.
  *   **Which Readings Fail?** **Reading 3 (Statistical)** fails because modern apps claim specific predictions (e.g., "you will meet a partner in October") which implies compulsion if the probability is high, or uselessness if low. **Reading 4 (Moral)** fails because it frames the chart as a warning against sin, not a guide for career or relationship optimization.

  **Crucial Caveat:** Most modern astrology apps rely on the **Tropical Zodiac** (Sun signs), which Kepler explicitly rejected as arbitrary divisions of the sky with no physical reality. If your friend uses a standard app, she is invoking Kepler's *maxim* to defend a practice Kepler himself would have deemed **mathematically false**, even if he accepted the philosophical sentiment.

  ### Falsification and Limitations of Analysis

  **What would change the verdict?**
  My analysis assumes Kepler maintained a consistent distinction between the sensitive and rational soul. This verdict would change if **private correspondence** (e.g., letters to Herwart von Hohenburg or Fabricius) revealed that he cast specific horoscopes for patrons (like Wallenstein) believing the *events* themselves were unavoidable, regardless of the subject's will. If Kepler privately treated specific natal predictions (e.g., "violent death") as inevitable facts rather than probabilities of temperament, then his public "non-compulsion" stance was merely a **theological shield** to avoid church censure, and the maxim is cynical apologetics rather than sincere philosophy.

  **Where is the analysis most likely to fail?**
  1.  **Conflating Public/Private:** As noted, Kepler's public writings were constrained by Lutheran orthodoxy. He may have believed the physical influence was stronger than he admitted publicly.
  2.  **Anachronism of "Freedom":** Kepler's concept of "free will" was theological (ability to accept/reject grace), not modern secular autonomy. Applying his maxim to modern "life choices" (career, dating) may stretch his intent beyond breaking point.
  3.  **The "App" Variable:** The analysis assumes the friend's app makes claims compatible with *any* form of astrology. If the app claims deterministic outcomes ("You *will* break up"), the maxim is irrelevant. If the app claims vague personality traits, the maxim is redundant (psychology does this better).

  ### Conclusion
  Your friend is using a **Keplerian shield to protect a Ptolemaic practice**. The maxim "the stars incline, but they do not compel" is defensible *only* if the astrology is restricted to **temperamental advice** (Reading 1 or 2). If she uses the chart to predict external events, the "inclination" becomes indistinguishable from "compulsion" in practice, rendering the maxim a hollow excuse. Kepler would likely tell her that while the geometry of the heavens resonates with the soul, trusting the arbitrary signs of a modern app is not rational guidance; it is superstition dressed in the language of harmony.
