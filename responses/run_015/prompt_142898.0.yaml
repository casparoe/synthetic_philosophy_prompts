  10. **Final Polish:** Ensure tone is objective and philosophical. (Proceed to generate output).

  *(Note on the phrase origin)*: While often associated with Kepler, the phrase *astra inclinant, sed non necessitant* is actually Scholastic (often attributed to Albertus Magnus or Aquinas). Kepler expressed the *sentiment* but usually in more complex physical/harmonic terms. I should clarify this nuance so the user knows the friend is using a shorthand for Kepler's actual view.

  *(Refining Kepler's View)*: Kepler's *De Fundamentis Astrologiae Certioribus* (1601) is key. He argues aspects work like musical harmony on the soul. The soul *perceives* the geometry. It's not physical gravity; it's geometric resonance. This is crucial for the "Harmonic" reading.

  *(Refining the "Friend's" logic)*: If the app is modern (sun sign astrology), it contradicts Kepler (who hated the 12 signs). I should point out the irony.

