answer: |-
  Here is a diagnosis of your argument, structured as you requested.

  ### 1. Brainstorm: Conditions for Inevitability vs. Contingency

  To determine if a discovery is "inevitable" (convergent) or "contingent" (divergent), we need to assess the state of the **problem space** at the time.

  **Conditions for Inevitability (Mertonian Multiples):**
  *   **Paradigmatic Maturity:** The field has agreed on what counts as a problem and what counts as evidence (e.g., late 19th-century physics).
  *   **Information Diffusion:** Key data is publicly available to multiple actors (e.g., astronomical data for Kepler/Brahe, or specimen collections for Darwin/Wallace).
  *   **Functional Pressure:** There is a practical or theoretical "blockage" that *must* be removed for progress to continue (e.g., the need to calculate instantaneous velocity).
  *   **Low Conceptual Distance:** The step required is an extension of existing tools, not a radical重构 (re-structuring) of worldview.

  **Conditions for Contingency:**
  *   **Conceptual Incommensurability:** The solution requires a new language or metaphysics that isn't implied by previous work (e.g., Non-Euclidean geometry before Gauss).
  *   **Idiosyncratic Insight:** The solution relies on a specific individual's unique cognitive style or private data (e.g., Einstein's thought experiments).
  *   **Underdetermination:** The data allows for multiple, mutually exclusive theoretical explanations (e.g., quantum interpretations).

  ### 2. Diagnosis: The Category Error

  You are asking: *If the discovery is inevitable, is priority just sociology?*

  **The Mistake:** You are conflating **Ontological Independence** with **Epistemic Articulation**.

  Your intuition is correct that the *mathematical relationships* (the truths of calculus) or the *biological mechanism* (natural selection) exist independently of human minds. In that sense, they are "discovered," not "created." If the universe dictates that $d/dx(x^2) = 2x$, that truth is inevitable.

  However, **priority is not about who brought the truth into existence.** Priority is about **who successfully integrated that truth into the scientific commons.**

  Science is not just a ledger of true propositions; it is a **tool-building enterprise**. When we argue about priority, we aren't arguing about who "found" the Platonic form of Calculus. We are arguing about who built the first usable *machine* for doing Calculus.

  **Here is where your presupposition breaks down:**
  You assume that "The Discovery" is a singular, monolithic object (e.g., "Calculus"). It is not. "Calculus" is a cluster of:
  1.  **Theorems** (The Fundamental Theorem).
  2.  **Algorithms** (Rules for differentiation).
  3.  **Notation** ($dy/dx$ vs. $\dot{y}$).
  4.  **Justification** (Metaphysics of infinitesimals vs. limits).

  Inevitability applies primarily to **(1)**. Contingency applies heavily to **(2), (3), and (4)**. Priority disputes are almost always about **(2) and (3)**, because those determine *usability*.

  Therefore, saying "priority is pure sociology" is half-right but misses the point. It is sociology *because* the conceptual packaging is contingent. If the packaging were inevitable, there would be no dispute to have; everyone would have written the same paper. The fact that there *is* a dispute proves the packaging was not inevitable.

  ### 3. Determinism: Ideas vs. People

  You asked if you are mixing up determinism about ideas with determinism about people. **Yes, you are.**

  *   **Determinism about Ideas (Merton's Claim):** Given the state of science in 1670, *someone* would have formulated a method for tangents and areas. The "idea" was in the air (the *Zeitgeist*).
  *   **Determinism about People:** Newton and Leibniz *specifically* had to be the ones.

  Merton argues for the former, not the latter. Your confusion arises because you think if the *Idea* is determined, the *Person* doesn't matter. But in the history of science, the *Person* matters for **attribution of the specific formulation.**

  If I say, "The lightbulb was inevitable," that doesn't mean Edison doesn't get credit. It means if Edison died in 1875, Swan or Maxim would have patented a slightly different filament in 1876. The *function* is inevitable; the *patent* is contingent. You are treating the "Discovery" as the function, but the "Priority Dispute" is about the patent.

  ### 4. Application to Your Cases

  **Case A: Newton vs. Leibniz (Calculus)**
  Your roommate is correct, and this highlights your error.
  *   **Inevitable:** The relationship between tangents and areas (Fundamental Theorem). The pressure to solve kinematic problems made this mathematically ripe.
  *   **Contingent:** The *notation* and *metaphysics*.
      *   Newton's **Fluxions** ($\dot{x}$) were tied to time and motion (physics-first).
      *   Leibniz's **Differentials** ($dx$) were tied to geometry and combinatorics (logic-first).
  *   **The Breakdown:** You asked if the "conceptual packaging" is inevitable. **No.** Leibniz's notation won not because it was "truer," but because it was a better *heuristic tool* for manipulation. $dy/dx$ looks like a fraction you can cancel; $\dot{y}/\dot{x}$ does not.
  *   **Verdict:** The priority dispute wasn't just sociology; it was a fight over which *toolkit* would define the future of mathematics. If you claim inevitability dissolves priority, you ignore that Newtonians and Leibnizians were literally doing different kinds of math for a century.

  **Case B: Darwin vs. Wallace (Natural Selection)**
  *   **Inevitable:** The mechanism of selection. Given Malthus (population pressure) and Lyell (deep time), the logic of selection was "in the air." Wallace and Darwin both read Malthus.
  *   **Contingent:** The *scope* and *argumentative structure*.
      *   Wallace saw selection as a mechanism for adaptation and speciation.
      *   Darwin saw selection as the *universal* explanation for all life, backed by massive evidence (pigeons, barnacles, biogeography) and tied to a specific genealogy (Tree of Life).
  *   **The Breakdown:** If you say "Natural Selection was inevitable," you are right about the *mechanism*. But Darwin gets priority because he constructed the **research program**. Wallace had the insight; Darwin had the *theory*. In philosophy of science (Lakatos/Kuhn), a "discovery" isn't just a proposition; it's a framework that generates new puzzles. Wallace handed over a key; Darwin built the castle.
  *   **Verdict:** Inevitability of the mechanism does not dissolve Darwin's priority on the *theory*.

  ### 5. Final Diagnosis of Your Mistake

  Your argument rests on this syllogism:
  1.  If $X$ is inevitable, $X$ exists independently of agents.
  2.  If $X$ exists independently of agents, agents cannot claim ownership of $X$.
  3.  Therefore, priority is merely social attribution, not fact.

  **The flaw is in Premise 2.**
  Agents cannot claim ownership of the *Truth*, but they **can** claim ownership of the *Articulation*.

  In science, "Discovery" is a speech act. It requires publication, persuasion, and integration.
  *   **Ontologically:** Calculus was "there."
  *   **Historically:** Calculus was "made" through the specific notations and arguments of Newton and Leibniz.

  By saying inevitability dissolves priority, you are treating science as if it were **mining** (digging up rocks that are already there) rather than **architecture** (building structures using available materials). Even if the materials (mathematical truths) are inevitable, the building (the theory) is contingent.

  **Summary for your class:**
  Tell your professor you accept the Merton Thesis regarding the **inevitability of the problem-solution pair**, but you reject the idea that this renders priority disputes meaningless. The disputes are not about *who found the truth*, but **whose formulation of the truth proved more fertile.** The "philosophical meat" is exactly in the packaging (notation, metaphysics, scope), because that packaging determines the future trajectory of the science. Inevitability applies to the *destination*; contingency applies to the *map*. Priority goes to the mapmaker, not the land.
