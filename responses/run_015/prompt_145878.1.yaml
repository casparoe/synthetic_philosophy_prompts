  6.  **Applying to Calculus and Natural Selection (Step 4 of Prompt):**
      *   *Calculus:* The *mathematical relationships* (inevitable). The *notation/metaphysics* (contingent). Newton's fluxions were tied to physics/time. Leibniz's were more algebraic/combinatorial. The "packaging" is NOT inevitable. That's why the priority dispute mattered (nationalism, utility of notation).
