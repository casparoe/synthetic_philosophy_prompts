prompt: |-
  I've been going back and forth on the quantum immortality argument and I want someone to actually force me to put numbers on it instead of just gesturing. What's your credence that if you underwent a genuine quantum suicide experiment — the kind where a device measures a quantum observable and kills you on one outcome but not the other, iterated many times — you'd subjectively survive every round? I mean the strong claim: from your first-person perspective, you'd just keep finding yourself alive, no matter how many iterations, because there's always some branch where you survive and that's the only one you can experience. Not "it depends on your interpretation." I want a number and the reasoning laid out. Decompose it: how much of your credence rides on the many-worlds interpretation being correct, how much on the claim that personal identity or subjective continuity tracks whichever branch you're alive in, how much on the idea that branch count or measure doesn't constrain subjective probabilities the way we normally think, and any other sub-questions you think belong. Give each a rough probability and a sentence on why, then show how they combine. Then tell me which term you're least confident in and what kind of evidence — empirical or philosophical — would move it the most. And please just write this as continuous prose, like an email — no bullet points, no headings, no bold, no tables. I want to follow the reasoning, not skim a list.
