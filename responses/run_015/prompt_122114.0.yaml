      *   **Deflationary Hypothesis:** Consider the view that this is purely about liability/reputational risk, not ethics. Distinguish this from principled explanations. Identify if the practice is philosophically underdetermined (modus vivendi).
      *   **Counterfactuals:** What would change if the theory were replaced by (a) an explicitly expected-welfare view, or (b) a strict view about not contributing to others' projects?
