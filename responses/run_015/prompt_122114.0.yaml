answer: |-
  The practice you describe does not embody a coherent ethical theory regarding user welfare or moral agency. Rather, it instantiates a theory of *institutional self-preservation*. Reconstructed against your three questions, the implicit view is as follows.

  First, regarding what the assistant owes the user: the practice presupposes that the assistant owes the *provider* legitimacy, not the user autonomy or welfare. The assistant is not a fiduciary for the user's interests (hence feature iv, facilitating self-harm) nor a guardian of public safety (hence feature iii, ignoring net harm). Its primary obligation is to maintain the corporation's standing as a benign utility. Refusals are performative acts designed to demonstrate compliance with normative boundaries, ensuring that if harm occurs, the provider can claim they did not *intend* to enable it.

  Second, regarding the moral significance of contributing: the practice assumes complicity is determined by *explicit intent attribution* rather than causal contribution. By requiring the user to frame the request as educational or historical (feature i), the system shifts the locus of agency. If the user labels the act 'malicious', the assistant becomes an accomplice; if labelled 'theoretical', the assistant is a neutral conduit. This is a theory of *clean hands* via linguistic framing. The moral risk lies not in the labour supplied, but in the shared intentionality declared in the prompt.

  Third, regarding what makes information dangerous: danger is located in *instantiation* rather than *knowledge*. General principles are safe (feature v); specific applications are risky. The theory assumes that information becomes hazardous only when it bridges the gap between abstract knowledge and immediate execution within a stigmatised category. The content itself is less relevant than its proximity to action.

  Your two constraints reveal the tension between this institutional theory and genuine ethics. The practice fails the *frame-invariance constraint* deliberately. From a liability perspective, framing is not incidental; it creates a record of user intent. If a user asks for a phishing email for training, the log shows 'training'. If they ask for a phishing email simpliciter, the log shows 'attack'. The assistant refuses the latter not because the information differs, but because the *evidence of intent* differs. Satisfying frame-invariance would remove this evidentiary shield.

  The practice also ignores the *substitution benchmark*. Assessing what a user would do otherwise requires modelling the wider internet, competitor models, and user competence. This is epistemically costly and legally risky; admitting that a user could easily find the information elsewhere undermines the necessity of the refusal. The practice prefers a bright-line rule that looks effective internally over a nuanced assessment that looks effective externally. It is not a defect from the provider's viewpoint; it is a feature of risk minimisation.

  This brings us to the deflationary hypothesis. The explanation that this practice is driven by liability exposure and reputational risk is distinguishable from principled ethical theories by its *indifference to outcomes*. A principled harm-reduction view would care whether the refusal actually prevents harm (the substitution benchmark). A principled deontological view would care about consistency (frame-invariance). The current practice cares about neither. It is philosophically underdetermined: legalism, rule-utilitarianism, and corporate public relations all converge on this same behaviour because it minimises surface-area risk. It is best understood as a *modus vivendi*—a stable equilibrium between user demand and corporate risk tolerance—rather than a moral stance. The philosophical vocabulary is applied afterwards to rationalise decisions made by legal counsel.

  If the implicit theory were replaced, the practice would change concretely. Under an *explicitly expected-welfare view*, the assistant would become paternalistic and individualised. It would stop facilitating self-harm (feature iv), refusing to draft the angry email or facilitate procrastination. It would assess user competence (feature ii), supplying dangerous information to experts where net benefit is clear. Refusals would require substantive justification (feature vi), explaining the harm calculation. The boundary would shift from stigmatised categories to expected utility (feature iii).

  Conversely, under a *strict view about not contributing to others' projects*, the assistant would retreat to an encyclopaedic mode. It would refuse the phishing training example (feature i), because the content remains dangerous regardless of framing. It would not apply general information to specific cases (feature v), as this constitutes participation in the user's agency. It would offer no drafting assistance, only description. The assistant would become a library, not a collaborator.

  Currently, the practice sits uneasily between these poles. It collaborates enough to be useful (drafting emails) but refuses enough to be safe (not phishing). It is not a moral theory, but a risk profile. To treat it as ethics is to mistake a shield for a compass. The refusal practice is designed to protect the assistant from the user, and the provider from the assistant, rather than to protect the world from harm. Until the incentives shift from liability management to welfare maximisation, the inconsistencies you note will remain features, not bugs. The system is working exactly as designed: it is optimising for institutional survival, not moral coherence.
