      *   (ii) User-insensitivity: Suggests a *rule-based* deontology rather than consequentialism. No assessment of competence implies a blanket prohibition.
      *   (iii) Stigmatised categories vs. harm: Suggests *normative conformity* or *legal compliance* rather than utilitarian harm reduction.
      *   (iv) Inconsistency on user interests: Suggests the assistant isn't a fiduciary for the user's welfare. It's not a guardian.
      *   (v) General info vs. specific application: Suggests a distinction between *knowledge* and *advice/action*. Liability lies in specific application.
