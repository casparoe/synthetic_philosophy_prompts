answer: |-
  **JOINT STATEMENT ON MOORE'S PARADOX AND THE NORMS OF SELF-KNOWLEDGE**

  **Participants:** The Commitment Theorist (CT), The Transparency Theorist (TT), The Convenor.
  **Date:** October 24, 2023
  **Subject:** Adversarial Collaboration on the Source of Moorean Absurdity

  ### I. Agreed Empirical and Conceptual Data

  Both theorists accept the following claims as fixed points for any adequate explanation of the Moorean phenomenon (specifically regarding the sentence *It is raining but I do not believe that it is raining*). We treat these as the *explananda* that our respective theories must capture.

  1.  **Non-Contradiction:** The sentence is not logically contradictory. The state of affairs it describes (that it is raining while the speaker lacks the belief that it is raining) is metaphysically possible and frequently obtains.
  2.  **Non-Gricean Persistence:** The absurdity is not merely a conversational implicature that can be cancelled by context. It survives in soliloquy, in private diary entries, and in silent occurrent thought, provided the thought is occurrent and first-personal.
  3.  **Contextual Cancellation:** The absurdity vanishes or is significantly mitigated when:
      *   The sentence is embedded in the antecedent of a conditional (*If it is raining but I don't believe it...*).
      *   The subject is shifted to the third person (*It is raining but she does not believe it*).
      *   The tense is shifted to the past (*It was raining but I did not believe it*).
      *   The second conjunct is hedged (*It is raining but I am not sure whether I believe it*).
  4.  **Attitude Specificity:** The phenomenon is not uniform across propositional attitudes. The intention analogue (*I will $\phi$ but I do not intend to $\phi$*) generates a different logical tension (often straightforward inconsistency of will) than the belief analogue. The desire analogue (*I desire that $p$ but I do not desire that $p$*) is simply contradictory. The Moorean paradox is specific to the cognitive stance of belief.
  5.  **Assertion-Belief Link:** There is a tight, non-accidental connection between the norms governing assertion and the norms governing belief. A defect in the assertion typically mirrors a defect in the belief state, though we disagree on the direction of explanation.

  ### II. Table of Residual Disagreements

  The following table isolates the specific theoretical commitments where our accounts diverge. We have agreed on a "Neutral Formulation" for each row to ensure we are disputing the same proposition.

  | Domain of Dispute | Commitment Theorist (CT) Formulation | Transparency Theorist (TT) Formulation | Neutral Formulation (Agreed Target) |
  | :--- | :--- | :--- | :--- |
  | **1. The Locus of Absurdity** | The absurdity is primarily a defect of the **speech act**. Assertion constitutively represents the speaker as believing $p$; the second conjunct explicitly denies this representation, creating a pragmatic self-defeat. | The absurdity is primarily a defect of the **psychological state**. Belief is transparent to the world; one cannot coherently judge $p$ while judging that one does not believe $p$. Assertion merely inherits this prior incoherence. | **Question:** Is the primary source of the absurdity normative/pragmatic (assertion) or psychological/constitutive (belief)? |
  | **2. Silent Thought** | The absurdity in silent thought is **derivative**. Inner speech mimics the structure of public assertion; therefore, the norms of assertion apply analogously to judgment. | The absurdity in silent thought is **foundational**. The transparency of belief operates independently of language; the absurdity in assertion is derivative of the absurdity in thought. | **Question:** Does the oddity in thought depend on the norms of assertion, or do the norms of assertion depend on the oddity in thought? |
  | **3. The Role of Transparency** | Transparency is a **psychological datum** to be explained. We need a norm (like the Knowledge Norm) to explain *why* belief is transparent and why violating it feels absurd. | Transparency is the **explanatory principle**. The "norms" of assertion are merely social codifications of the constitutive requirements of the first-personal stance. | **Question:** Is transparency a phenomenon requiring explanation via norms, or is it the explanation for the norms? |
  | **4. Constitutive Norms** | A constitutive norm of assertion (e.g., "Assert $p$ only if you believe $p$") **explains** the badness. It identifies the rule being broken. | A constitutive norm of assertion **restates** the badness. Saying "assertion requires belief" is just saying "you can't assert what you can't coherently think." | **Question:** Does positing a norm provide causal/explanatory leverage, or does it merely describe the boundary of the incoherence? |

  ### III. Cruxes and Test Cases

  We identified three specific cases where our theories generate distinct predictions regarding the survival and strength of the Moorean oddity. We record our pre-experimental predictions here.

  #### Case 1: The Two-Channel Forecaster
  **Description:** A meteorologist has excellent first-order evidence that it is raining (visual, barometric) but also excellent higher-order evidence that she is currently unreliable on this specific question (e.g., she knows she has taken a drug that induces confidence in rain predictions regardless of accuracy). She asserts: *"It is raining but I do not believe it."* She intends the second conjunct to reflect her higher-order assessment of her own reliability.

  *   **Does the oddity survive?**
      *   **CT Prediction:** **Mitigated.** The norm of assertion is sensitive to the speaker's total evidence. Since her higher-order evidence undermines her commitment to the belief, the assertion functions as a report of the first-order evidence *plus* a warning about the commitment. The "collision of commitments" is resolved by the higher-order defeater.
      *   **TT Prediction:** **Survives Strongly.** Transparency is a structural feature of the first-person stance, not sensitive to evidential weighting. To judge that $p$ (which she must do to assert it) *just is* to take oneself to believe $p$. The higher-order evidence creates a rational dilemma, but it does not dissolve the incoherence of the stance itself. The sentence will still sound like a fracture in the mind.
  *   **Diagnostic Value:** If the sentence sounds permissible to listeners, CT is favored. If it sounds psychologically fractured despite the explanation, TT is favored.

  #### Case 2: The Subpersonal Output
  **Description:** An engineered forecasting system (or a committee operating anonymously) issues a categorical printout: *"Status: Raining."* A separate system log reads: *"Confidence Estimate: 40% (Belief threshold not met)."* There is no first-personal access or unified agency linking the statement and the log.

  *   **Does the oddity survive?**
      *   **CT Prediction:** **Vanishes.** There is no agent undertaking a commitment. The statement is a mere output, not an assertion. Without a speaker to represent themselves as believing, there is no pragmatic self-defeat.
      *   **TT Prediction:** **Vanishes.** There is no first-personal stance. Transparency applies only to subjects capable of settling questions about the world by settling questions about their mind. A system without self-access cannot occupy the incoherent stance.
  *   **Diagnostic Value:** **Agreement.** Both agree the paradox vanishes here. This establishes that the phenomenon requires either agency (CT) or first-personal access (TT). The dispute remains over which of these is the essential ingredient.

  #### Case 3: The Metacognitive Variant
  **Description:** A subject asserts: *"It is raining but I do not believe I should believe it"* (or *"but I do not believe my evidence supports it"*).

  *   **Does the oddity survive?**
      *   **CT Prediction:** **Survives Strongly.** The constitutive norm of assertion is not merely that you *do* believe $p$, but that you are *warranted* in believing $p$. To assert $p$ while denying that your evidence supports $p$ violates the normative commitment of the speech act directly.
      *   **TT Prediction:** **Weakens/Vanishes.** Transparency links $p$ to *believing that $p$*. It does not strictly link $p$ to *believing that one should believe $p$*. A subject can coherently find themselves believing $p$ (due to transparency/judgment) while normatively assessing that they shouldn't. The direct incoherence of the standard Moorean sentence is broken by the normative distance.
  *   **Diagnostic Value:** This is the strongest discriminator. If the metacognitive variant feels as absurd as the standard variant, CT is favored (norms are central). If it feels significantly less absurd, TT is favored (direct psychological stance is central).

  ### IV. Closing Analysis: Levels of Explanation and Verbal Disputes

  In reviewing our collaboration, we identify where our disagreement is substantive and where it may be merely verbal or a matter of explanatory priority.

  **1. Merely Verbal Disputes:**
  We acknowledge that some friction arises from the definition of "Assertion." CT employs a broad notion of assertion that includes the internal commitment structure of judgment (inner assertion). TT employs a narrow notion of assertion as a public speech act that inherits its norms from judgment. If CT defines assertion to include judgment, and TT defines judgment to exclude normative commitment, we are talking past each other. We agree to stipulate that **Assertion** refers to the public speech act and **Judgment** refers to the private mental act for the purposes of future debate.

  **2. Explanatory Priority (The Substantive Core):**
  Even with terminology fixed, a substantive disagreement remains regarding **explanatory direction**.
  *   **CT Claim:** The norm explains the psychology. We feel the absurdity in thought *because* thought is governed by the same constitutive rules as speech. (Level: Normative Praxis).
  *   **TT Claim:** The psychology explains the norm. We govern speech the way we do *because* the first-personal stance has this transparent structure. (Level: Philosophical Psychology).

  **3. Subsumption and Levels:**
  We reject the compromise that "both accounts capture something important." Instead, we propose a hierarchy test:
  *   If Case 3 (Metacognitive Variant) retains the full Moorean absurdity, **CT is the general theory**, and Transparency is a special case where the normative commitment coincides with the psychological state.
  *   If Case 3 loses the absurdity, **TT is the general theory**, and the Norm of Assertion is merely a social reflection of the psychological impossibility of the standard Moorean stance.

  We conclude that the dispute is not merely verbal; it is a dispute over whether the constitutive norms of our practices shape our minds (CT), or whether the constitutive structure of our minds shapes our practices (TT). The three test cases above, particularly the Metacognitive Variant, provide the empirical leverage required to settle this priority.

  ***

  **Signed:**

  *The Commitment Theorist*
  *The Transparency Theorist*
  *The Convenor*
