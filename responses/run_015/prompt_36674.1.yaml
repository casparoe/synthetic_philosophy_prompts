answer: |-
  Here are eight questions designed to corner a hardcore total utilitarian on population ethics, complete with follow-ups keyed to the standard defenses they usually offer.

  ### 1. The Mere Addition Ladder
  "Let's walk through Parfit's Mere Addition Paradox, but I want to stop you at every single rung. We start with World A: ten billion people, all incredibly happy. Then we add a new group in World A-plus: same happy people, plus another ten billion whose lives are worse off than the first group, but still worth living. Most people hesitate there, but you say A-plus is better. Then we move to World B: we flatten the distribution so everyone is at the average of A-plus. Still better? If you say 'yes' to every single step all the way down to the Repugnant Conclusion, I need to know: is there *any* point in that chain where the improvement becomes so microscopic that adding it feels like a category error, or do you genuinely see every single step as a robust moral gain?"

  *   **Follow-up:** "If you say every step is a robust gain, imagine you're standing at the bottom of that ladder, in the world of barely-livable lives. You have the power to press a button that wipes out half the population but doubles the quality of life for the survivors, moving us one step *up* the ladder. Your math says that's a loss of total value. Do you really leave that button unpressed, even though every single person in that new world is living a drastically better life?"

  ### 2. Muzak and Potatoes
  "You've mentioned before that critics claim a life of 'muzak and potatoes' can't add value. I want to press on the phenomenology of that. If a life is barely above the neutral line—say, it's just slightly better than never existing—does that sliver of positivity actually function as a *gain* for the universe? Or is it just the absence of a loss? Because your arithmetic treats a +0.01 life the same way it treats a +100 life, just scaled down. But intuitively, one feels like a contribution and the other feels like... static."

  *   **Follow-up:** "If you say it's a genuine contribution, would you be willing to create a billion of those 'muzak and potatoes' lives rather than a thousand lives of profound artistic and scientific flourishing, assuming the total sum is higher in the first case? If you hesitate there, isn't that an admission that quality weighs more than quantity?"

  ### 3. The Replacement Argument
  "Here's a swap scenario. I have a choice: I can bring into existence one person who will have a magnificent, 100-year life of deep accomplishment. Or, I can bring into existence two people who will each have lives that are just barely worth living. Your view says I should choose the two. But now extend that. What stops me from painlessly removing the magnificent person and 'replacing' them with ten barely-happy people? If the total sum goes up, isn't the magnificent person effectively disposable currency in your framework?"

  *   **Follow-up:** "You'll likely say 'nobody is harmed' because the magnificent person never existed in the second scenario. But doesn't that turn existence into a game where we sacrifice the *depth* of experience for the *count* of experiencers? If value is about conscious experience, why does having more containers of experience matter more than what's inside the containers?"

  ### 4. The Person-Affecting Intuition
  "There's a strong intuition that you can't wrong someone by never creating them. If I choose not to have a child, I haven't harmed that child; there is no 'them' to harm. But total utilitarianism seems to flip this: it implies we have a duty to create people if their lives will be net positive. Do you think that person-affecting intuition—that existence isn't a benefit we owe to potential people—is just a cognitive bug we need to debug, or is there a version of your view that accommodates it?"

  *   **Follow-up:** "If you say it's a cognitive bug, help me understand the bug. Is it that we're too focused on the individual? Because even if I accept that, it leads to the conclusion that a world full of people is *obligatory* as long as the average stays positive. Are you comfortable telling parents they are morally required to have as many kids as possible until the marginal utility dips below zero?"

  ### 5. The Wireheading Bullet
  "Let's talk about the source of that positive value. If I can hook a billion people up to an experience machine where they feel a constant, low-level hum of contentment—just barely above neutral—and they stay there for fifty years, the math says that's a massive amount of good. It might outweigh a smaller population of people struggling, failing, and occasionally achieving greatness. Do you bite the wireheading bullet? Is a drugged-up, static happiness just as valuable as earned flourishing, provided the sum is higher?"

  *   **Follow-up:** "If you say yes, imagine we discover that our own world is actually that wirehead simulation. Would you argue we should *stay* in the simulation because the total utility is high, or would you try to wake everyone up, even if waking up reduces the total sum of happiness? If you'd wake them up, doesn't that prove you value something other than just the raw sum of positive states?"

  ### 6. Impossibility Theorems
  "Philosophers like Gustaf Arrhenius have proven impossibility theorems showing you can't satisfy all our intuitive conditions about population ethics simultaneously. You have to drop at least one. Most people drop Total Utilitarianism. You keep it. Which other condition are you dropping? Is it 'Non-Elitism'? Is it 'Weak Dominance'? I want to know which specific axiom you looked at and said, 'This one has to go.'"

  *   **Follow-up:** "Once you identify that axiom, why that one? Usually, the axioms we drop are the ones that feel least intuitive. But Total Utilitarianism feels *more* counterintuitive to most people than, say, the idea that adding happy people shouldn't make a world worse. Why trust the formal consistency of the theory over the collective intuition of almost everyone outside this specific field?"

  ### 7. The "View from Nowhere" vs. "View from Inside"
  "You keep appealing to the arithmetic, to the 'view from nowhere' where we just sum up the units of good. But ethics is lived from the inside. If I'm one of those people in the Repugnant Conclusion world, my life is barely worth living. I don't feel like a contribution to a grand sum; I feel like I'm struggling. Why should the 'view from nowhere' trump the 'view from inside' when they conflict? Why does the universe care about the total sum more than the individual cares about their own flourishing?"

  *   **Follow-up:** "If you say the universe doesn't care, but *we* should, you're positing a moral agent that doesn't align with human psychology. If your ethics requires us to ignore the qualitative difference between a life of struggle and a life of joy in favor of the headcount, aren't you asking us to become alienated from our own moral sentiments?"

  ### 8. The Risk of Suffering
  "Total utilitarianism focuses on net positive lives, but population growth introduces variance. If we maximize population to maximize total good, we statistically guarantee more lives of extreme suffering, too. Even if the *average* stays positive, the absolute number of hellish lives goes up. Does your calculus allow for a 'Very Repugnant Conclusion' where we accept a massive amount of torture just because it's bundled with an even more massive amount of barely-positive lives?"

  *   **Follow-up:** "If you say the math still works out because the positive sum outweighs the negative sum, imagine you could prevent a genocide by agreeing to create a billion 'muzak and potatoes' people. Is that a trade you make? If you hesitate, isn't that admitting that some values—like rights or justice—are side-constraints that your arithmetic can't capture?"
