      *   *What gets distorted?* Quine's radical holism includes logic and math. Statisticians rarely say "let's change the law of non-contradiction" to save a regression. They change the *error structure* or *covariates*. Quine's ontological commitment is deeper than methodological flexibility.
      *   *The Missing Piece:* Normativity vs. Descriptivism. Stats tells you *how* to check robustness. Quine tells you *why* you can't escape theory-ladenness. Also, the "web" isn't just a model; it's the entire language system.
      *   *Is Quine just describing sensitivity analysis?* Mostly, yes, but with a philosophical sting: Sensitivity analysis admits the problem exists; Quine says the problem *constitutes* knowledge. There is no "view from nowhere."

