  1.  **Analyze the User and Request:**
      *   **User Persona:** Journalist covering science and ideas. Familiar with replication crises, statistical modeling, preregistration, out-of-sample testing, p-hacking, auxiliary assumptions, theory-ladenness.
      *   **Topic:** W.V.O. Quine's "Two Dogmas of Empiricism" (specifically the attack on the analytic/synthetic distinction).
