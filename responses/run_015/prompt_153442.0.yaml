answer: |-
  ### Exam Prompt

  **Course:** GRAD SEMINAR: BELIEF REVISION & FORMAL EPISTEMOLOGY  
  **Time:** 90 Minutes  
  **Word Count:** ~700 words expected  
  **Total Marks:** 25

  **Question 1: The Satellite Case**

  A climate researcher is updating credences over three mutually exclusive models: **M1** (stable climate), **M2** (slow warming), and **M3** (fast warming). Her prior over M1/M2/M3 is uniform (1/3 each). She receives data from a satellite temperature reading. However, the instrument does not return a single point value. Instead, it returns a graded interval split with internal confidence weights: **70% on [1.5, 2.0]** and **30% on [2.0, 2.5]**. Each model predicts a different likelihood distribution over these ranges.

  Answer the following:

  (a) Say precisely why this scenario requires Jeffrey conditionalization rather than ordinary Bayes conditioning on a single evidence proposition. What is the fundamental difference in how the evidence is learned?

  (b) Apply Jeffrey's rule using a partion anchored to those two intervals. Write out the correct update equation for $P_{new}(M_i)$. You do not need to crunch every decimal, but you must show explicitly how the 0.7 and 0.3 weights enter the numerator and denominator (via the conditional terms).

  (c) Diagnose the following rival argument: *"The satellite gives 70% to the first bin, so just condition on E1 = 'temp is in [1.5, 2.0]' using Bayes rule with P(E1) computed from the prior over the models."* Explain exactly where that reasoning slips. Specifically, address why it treats the confidence weights as prior probabilities of discrete propositions rather than direct posterior assignments over a partion.

  (d) Discuss the "granularity objection": if she splits the range into three bins instead of two she might get different posteriors for M1-M3. What constrains the choice of partition? Tie this to the idea that in continuous measurement spaces Jeffrey's rule needs a calibration convention that is exhaustive and exclusive relative to the evidence space, and say why that matters for scientific objectivity. Also check whether the "hypothesis-independence" assumption holds here — that is, whether the probabilities assigned over the partion are held fixed regardless of which hypothesis is true — and note that it might fail if the instrument's calibration error itself depends on the warming rate.

  *(Note: Watch out for teh spelling errors in this draft, but answer the content seriously.)*

  ***

  ### Model Answer

  (a) Ordinary Bayesian conditioning requires the evidence to be learned with certainty (probability 1). Here, the satellite instrument does not certify that the temperature *is* in a specific range; it assigns probabilities (0.7 and 0.3) to the ranges itself. The agent is not learning a proposition $E$ is true, but rather shifting her credence over a partition $\{E_1, E_2\}$ to new values $\{0.7, 0.3\}$. Jeffrey conditionalization is designed precisely for uncertain evidence where the input is a new probability distribution over a partition, not a certainty.

  (b) Let the partition be $E_1 = [1.5, 2.0]$ and $E_2 = [2.0, 2.5]$. The Jeffrey update rule for any hypothesis $M_i$ is:
  $$P_{new}(M_i) = P_{old}(M_i | E_1) \cdot P_{new}(E_1) + P_{old}(M_i | E_2) \cdot P_{new}(E_2)$$
  Substituting the weights:
  $$P_{new}(M_i) = \frac{P_{old}(E_1 | M_i)P_{old}(M_i)}{P_{old}(E_1)} \cdot 0.7 + \frac{P_{old}(E_2 | M_i)P_{old}(M_i)}{P_{old}(E_2)} \cdot 0.3$$
  The 0.7 and 0.3 act as the direct multipliers for the posterior probabilities of the hypotheses conditional on each partition cell. They do not appear in the denominator of the conditional terms; the denominators remain the prior probabilities of the evidence cells, $P_{old}(E_j)$.

  (c) The rival argument fails because it conflates $P_{new}(E_1)$ with $P_{old}(E_1)$. By suggesting we condition on $E_1$ using Bayes rule with $P(E_1)$ computed from the prior, the argument treats the 70% weight as if it were the prior probability of the evidence occurring. But the 70% is the *result* of the measurement process—it is the new credence in $E_1$. If we treat it as a prior, we ignore the likelihood of the data given the models. Furthermore, standard conditioning sets $P_{new}(E_1) = 1$, which wipes out the uncertainty inherent in the instrument. The rival argument effectively pretends the instrument said "It is definitely in bin 1," discarding the 30% uncertainty on bin 2.

  (d) The granularity objection highlights that Jeffrey conditioning is partition-sensitive; refining the partition can change the final posterior over the models. This constrains the choice of partition: it must reflect the actual resolution of the evidence source. For scientific objectivity, the partition must be calibrated to the instrument's reporting mechanism, not chosen ad hoc to favor a model. Regarding hypothesis-independence (rigidity), the rule assumes $P_{new}(E_j | M_i) = P_{old}(E_j | M_i)$. This means the learning experience changes confidence in the evidence cells directly, without the hypothesis altering how that evidence is perceived. This might fail here: if extreme warming (M3) causes atmospheric interference that skews the satellite sensor differently than stable climate (M1), then the evidence probabilities are not independent of the hypothesis. If the instrument error depends on the warming rate, the rigidity condition is violated, and simple Jeffrey updating yields incorrect posteriors.

  ***

  ### Marking Scheme

  | Must-Hit Point | Marks | Typical Mistake |
  | :--- | :---: | :--- |
  | **1. Distinction of Evidence Type (Part a)**<br>Identifies that Bayes requires $P(E)=1$ while Jeffrey allows $0 < P(E) < 1$. | 5 | Saying Jeffrey is just "generalized Bayes" without specifying the certainty condition. |
  | **2. Correct Formula Structure (Part b)**<br>Shows $P_{new}(H)$ as weighted sum of $P_{old}(H|E_j)$, with 0.7/0.3 as the weights ($P_{new}(E_j)$). | 5 | Putting the 0.7/0.3 weights in the denominator or treating them as likelihoods $P(E|H)$. |
  | **3. Diagnosis of Rival Argument (Part c)**<br>Explains the rival treats $P_{new}(E)$ as $P_{old}(E)$ or falsely certifies $E$ as true. | 5 | Claiming the rival argument is valid because "70% is high enough to count as knowledge." |
  | **4. Granularity & Objectivity (Part d)**<br>Notes partition sensitivity requires calibration to instrument resolution to avoid arbitrariness. | 5 | Ignoring the objectivity constraint and saying "any partition is fine as long as it sums to 1." |
  | **5. Hypothesis-Independence/Rigidity (Part d)**<br>Identifies that $P(E|H)$ must remain fixed; notes sensor error might depend on the model (M3). | 5 | Assuming rigidity always holds or failing to link sensor error to hypothesis dependence. |
  | **Total** | **25** | |
