      *   *Constraint Check:* The user said "don't just say it depends." I need to take a stance on the *reasoning quality*, even if the ethical conclusion is debatable.
      *   *Lina's Weakness:* She compares grass-fed beef to grain-fed chicken. This is the fatal flaw in her crop-death math.
      *   *Marc's Weakness:* His "cascade" explanation is ethically contingent on the "net negative wild life" assumption, which he treats as more solid than it is. Also, his "double counting" claim is philosophically nuanced and arguably misapplied to wild animals.
      *   *The Crop Math:* Beef is less efficient. Even if harvest deaths are lower per hectare, the hectares per calorie are so much higher for beef that beef likely causes more crop deaths per calorie anyway.
      *   *The Replacement Cascade:* This is the trickiest part. I need to explain that Marc is referencing the idea that high-fecundity wild animals (r-strategists) suffer more due to population pressure. Replacing them with cattle (K-strategists, managed) might change the suffering profile. But Lina is right that assuming wild lives are net negative is controversial.

