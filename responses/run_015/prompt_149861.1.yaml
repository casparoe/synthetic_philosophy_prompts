      *   *Stage 2 (Distinction from Russell-Moore):* Russell treats relations as universals existing independently. The author wants externality (relata don't change nature) but denies separability (relation doesn't stand alongside). This is a tricky needle to thread. If $R$ is external, how is it not separable? *Coherence:* Moderate (tension here).
      *   *Stage 3 (Asymmetric Dependence Binding):* The core mechanism. $R$ depends on $a$ then $b$. This order *is* the unity. *Coherence:* Depends on the definition of "dependence." If dependence is a relation, we are back to square one.
