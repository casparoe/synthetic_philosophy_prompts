prompt: |-
  Hey, I need a favour. I'm in my second year of my PhD and my department wants a three-page dissertation prospectus by the end of the month for a one-year internal fellowship (12 months, no teaching, which I really need), and I've rewritten the first page about six times now. I have a half-formed idea and I'd like you to turn it into an actual proposal document. Please don't give me citations or a reading list — my supervisor is going to fill those in and I'll look like an idiot if I attribute something to the wrong person, so just talk about positions and arguments by description.

  So here's where I am. As far as I can tell the evolutionary debunking argument has two moving parts that people keep running together: first, a genealogical claim, that you can give a fairly complete causal story of why we hold the moral beliefs we do without ever mentioning whether those beliefs are true; second, a modal claim, that if the selective pressures had been different we'd have ended up with quite different moral beliefs, held with just as much subjective confidence, and that we have no vantage point outside the process from which to check whether we got pushed the right way. The back-and-forth I keep getting stuck in is all about whether those two can be combined into a real defeater without the argument also swallowing logic, maths or ordinary perceptual belief, and about whether the realist can wiggle out by offering an explanation that ties our moral beliefs to the moral facts via some third factor. I don't want to write about that, at least not head on. What I actually want to work on is what I've been calling the inheritance question: grant the debunker both claims for the narrow class of beliefs that have the cleanest selection story — kin altruism, reciprocity in small bands, disgust reactions around incest, that sort of thing — and then ask whether whatever defeat attaches to those beliefs transmits to the moral beliefs that have no such story, the ones about distant strangers mattering, or future people, or whether its wrong to shove a man off a footbridge to stop a trolley. There look like two honest answers. One is no: those further beliefs are reached by reasoning from commitments that have no selection story of their own, the genealogy just doesn't reach them, and moral philosophy is in the business of extending and systematising rather than of reporting intuitions, so the debunker has only shown something about a handful of parochial reactions. The other is yes: moral reasoning has to start somewhere, every chain of moral argument bottoms out in something we were shaped to accept, so contamination at the base contaminates the whole structure, and the realist's appeal to reflection is just the hope that a process built on a biased starting point can pull itself up by its bootstraps. I want the whole prospectus built around that fork.

  There's a second wrinkle I'd like folded in, though I'm less sure about it, so tell me if it's a distraction. I've been distinguishing three things evolution might plausibly have selected for: particular moral contents; a general-purpose capacity to pick up, internalise and enforce whatever norms happen to be locally in force — a norm-uptake device, I've been calling it in my notes; and something messier, a talent for socially tuned self-presentation where the content of what we end up believing is mostly downstream of what plays well with the people around us. My hunch is that the debunking argument comes out different in kind depending on which of those is doing the work, and that some versions need the first for their punch but quietly need the second or third to explain why moral belief varies so much across cultures. If what got selected was flexibility rather than content, then our beliefs might be tracking something other than selection — local normative facts, or just local social facts — and that seems like it should change what the debunker is entitled to conclude. My supervisor thinks the whole thing reduces to whether reasoning can correct for a biased starting point, which might be right and worries me. Anyways, what I need is the document: a precise statement of the question so that it has a determinate answer; why the standard realist and anti-realist moves leave it open; the method, meaning what I'd actually do over twelve months and why that rather than the obvious approach (I guess the obvious approach is to grind through the generalising worry case by case, which I really dont want to do); what a finished version would deliver — I've been imagining a taxonomy of how far a debunking argument reaches, whether it defeats the individual belief, the whole class of beliefs, or the practice of making moral judgements at all, plus a criterion for when a debunking argument has overreached; an honest failure condition, meaning what result would mean I wasted the year; and a paragraph on what makes this too big for twelve months and how I'd cut it down if it is. Can you also anticipate the two questions I know the committee will ask: isn't this just the companions-in-guilt debate with new labels, and what would I do if the reach question turned out to collapse back into the old question of whether the debunker's explanation is independent of the moral facts? Plain academic register, about three pages, first person is fine.
