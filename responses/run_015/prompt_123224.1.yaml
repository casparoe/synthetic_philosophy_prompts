answer: |-
  **Project Title:** The Inheritance Question in Evolutionary Debunking Arguments: Transmission, Scope, and Selective Targets

  **Statement of the Question**
  Evolutionary debunking arguments in metaethics typically rely on two moving parts: a genealogical claim, asserting that we can explain the etiology of our moral beliefs without referencing their truth, and a modal claim, asserting that had selective pressures differed, our moral beliefs would have differed accordingly. The standard debate focuses on whether these claims jointly undermine moral realism globally. My project isolates a specific, under-examined structural problem within this debate, which I call the inheritance question.

  The question is this: Granting the debunker both the genealogical and modal claims for the narrow class of beliefs with the clearest selection stories (e.g., kin altruism, reciprocity in small bands, disgust reactions), does the resulting epistemic defeat transmit to moral beliefs that lack such a direct selection story? Specifically, does defeat transmit to beliefs concerning distant strangers, future generations, or abstract trolley-case intuitions?

  There are two honest answers to this question, and my project aims to determine which is correct. The first is *no*: these further beliefs are reached by reasoning from commitments that have no selection story of their own. On this view, moral philosophy is in the business of extending and systematizing rather than merely reporting intuitions, so the debunker has only shown something about a handful of parochial reactions. The second answer is *yes*: moral reasoning must start somewhere, and every chain of moral argument bottoms out in something we were shaped to accept. On this view, contamination at the base contaminates the whole structure, and the realist's appeal to reflection is merely the hope that a process built on a biased starting point can pull itself up by its bootstraps.

  My primary objective over the next twelve months is to resolve this fork. I will not argue head-on about whether the debunking argument succeeds globally, but rather about the mechanics of how defeat propagates within the web of moral belief.

  **Why Standard Moves Leave This Open**
  Current literature treats moral belief largely as a monolith. Standard realist responses typically invoke third-factor explanations or argue for the independence of moral facts from evolutionary pressures. These moves are designed to secure realism globally but often gloss over the internal structure of moral justification. They assume that if realism is saved, it is saved for all moral beliefs equally. Conversely, standard anti-realist moves often assume that if the foundational intuitions are compromised, the entire edifice collapses.

  Both sides leave the inheritance question open because they fail to distinguish between the *inputs* of moral reasoning (shaped intuitions) and the *operations* of moral reasoning (principles of consistency, extension, and systematization). Furthermore, the debate is complicated by ambiguity regarding what exactly evolution selected for. I distinguish three possibilities: particular moral contents; a general-purpose capacity to internalize and enforce local norms (a norm-uptake device); or a talent for socially tuned self-presentation where belief content is downstream of social utility.

  The strength of the debunking argument varies significantly depending on which hypothesis holds. If what got selected was flexibility rather than specific content, then our beliefs might be tracking local normative facts or social facts rather than fitness directly. This changes what the debunker is entitled to conclude. If the selection target was a norm-uptake device, the genealogical claim loses its bite regarding specific content, but the modal claim might retain force regarding our susceptibility to local bias. My project incorporates this wrinkle to show that the inheritance question cannot be answered without first clarifying the selective target.

  **Methodology**
  The obvious approach to this problem would be to grind through potential cases of moral belief one by one, assessing the genealogical history of each to see if it is "shaped" or "unshaped." I reject this method for two reasons. First, it is empirically intractable within a philosophical timeframe; we lack definitive evolutionary histories for most specific moral intuitions. Second, it misses the structural point. Even if a belief lacks a direct selection story, it may be inferentially dependent on beliefs that do have such a story.

  Instead, my method is conceptual and structural. I will model the dependency relations between base moral intuitions and derived moral principles. I will treat the evolutionary claims as parameters rather than objects of empirical study. For each of the three selection hypotheses (content, capacity, self-presentation), I will analyze the resulting epistemic status of the base beliefs and then trace the conditions under which defeat would transmit to derived beliefs.

  This involves analyzing the nature of moral reasoning itself. If moral reasoning is merely a rationalization of shaped intuitions, defeat transmits. If moral reasoning involves normative principles that are themselves justified independently of intuition (e.g., logical consistency, impartiality), defeat may be blocked. I will examine whether the tools used to extend moral beliefs (such as the principle of universalizability) are themselves vulnerable to the same genealogical critique. This allows me to bypass the empirical quagmire and focus on the epistemic architecture of moral justification.

  **Deliverables**
  By the end of the twelve-month period, I intend to produce a dissertation chapter (or equivalent monograph draft) that delivers two specific tools for the metaethical debate.

  First, a **taxonomy of debunking reach**. This will categorize debunking arguments based on whether they defeat the individual belief, the whole class of beliefs sharing a genealogy, or the practice of making moral judgments at all. This taxonomy will clarify where current arguments in the literature actually land, as many proponents slide between these levels without justification.

  Second, a **criterion for debunking overreach**. I aim to define the conditions under which a debunking argument undermines the very tools required to formulate the argument. If the debunker relies on norms of reasoning (e.g., logical consistency, evidential support) that are themselves subject to the same genealogical critique, the argument self-defeats. I will formulate a precise test for when this occurs, distinguishing between local debunking (which is stable) and global debunking (which is often self-undermining).

  **Failure Conditions and Scope Management**
  I must be honest about the risks. The primary failure condition for this project is if the inheritance question collapses entirely into the general question of whether reasoning can correct for a biased starting point. My supervisor has rightly noted that this may be the underlying issue. If I find that the distinction between "shaped" and "unshaped" moral beliefs is untenable because all reasoning ultimately relies on shaped cognitive faculties, then the specific inheritance question dissolves into a general skepticism about human reasoning. In that case, the year would be wasted if I have not produced a distinct account of why moral reasoning is specifically vulnerable in a way that mathematical or perceptual reasoning is not.

  To mitigate the risk of the project becoming too large, I will impose strict boundaries. I will not attempt to resolve the empirical debate regarding evolutionary psychology. I will treat the selection hypotheses as conditional premises. I will also avoid getting bogged down in the general companions-in-guilt debate regarding logic and mathematics, except where necessary to establish the criterion for overreach. If the scope threatens to expand, I will cut the project down by focusing solely on the "norm-uptake" hypothesis, as this offers the clearest distinction between content and capacity and provides the most tractable path to analyzing the transmission of defeat.

  **Anticipated Objections**
  I anticipate two specific challenges from the committee regarding the viability and novelty of this approach.

  The first question is: *Isn't this just the companions-in-guilt debate with new labels?* The companions-in-guilt argument typically asserts that if evolutionary debunking undermines morality, it must also undermine logic, mathematics, or perceptual belief, and since we accept the latter, we should accept the former. My project is distinct because it is internal to morality. I am not comparing morality to logic or perception. I am comparing shaped moral beliefs to unshaped moral beliefs. The question is not whether morality survives alongside logic, but whether abstract morality survives alongside parochial morality. This avoids the difficult cross-domain comparisons that stall the companions-in-guilt debate and focuses on the internal architecture of moral justification.

  The second question is: *What would you do if the reach question turned out to collapse back into the old question of whether the debunker's explanation is independent of the moral facts?* The standard requirement for a successful debunking argument is that the genealogical explanation must be independent of the moral facts. If the inheritance question collapses into this independence condition, my project might seem redundant. However, my response is that independence is necessary but not sufficient. Even if the explanation is independent, the *structure* of dependence between beliefs matters. A realist might secure independence for abstract principles while conceding dependence for base intuitions. My project investigates whether that concession is fatal. If the reach question collapses, I will pivot to demonstrating why the structural dependence matters even given independence, thereby refining the independence condition itself rather than abandoning the project.

  **Conclusion**
  This project offers a way out of the stalemate in the evolutionary debunking literature. By shifting focus from the global validity of the argument to the local transmission of defeat, and by clarifying the selective targets involved, I aim to provide a more precise understanding of what evolutionary history implies for moral truth. The fellowship year will allow me to develop this structural analysis without teaching distractions, resulting in a clarified metaethical landscape where the stakes of evolutionary debunking are precisely located rather than vaguely threatened.
