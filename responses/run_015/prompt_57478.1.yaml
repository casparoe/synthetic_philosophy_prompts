answer: |-
  ### 1. Scoring and Ranking

  Scores are 0–100. Axes: (a) Projectibility, (b) Causal Depth, (c) Mind-Independence. Overall is weighted toward Causal Depth and Mind-Independence (the core of "jointedness").

  | Rank | Item | Project (a) | Causal (b) | Mind-Ind (c) | Overall |
