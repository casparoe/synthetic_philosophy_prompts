  | 1 | The electron | 98 | 98 | 98 | 98 |
  | 2 | Water | 95 | 95 | 95 | 95 |
  | 3 | Protein fold | 85 | 85 | 80 | 83 |
  | 4 | Biological species | 80 | 90 | 70 | 80 |
  | 5 | Inflammation | 85 | 85 | 70 | 80 |
  | 6 | Metal | 80 | 70 | 75 | 75 |
  | 7 | Mineral | 75 | 70 | 75 | 73 |
  | 8 | Virus | 70 | 70 | 60 | 67 |
  | 9 | Planet | 70 | 60 | 60 | 63 |
  | 10 | Acid | 70 | 60 | 50 | 60 |
  | 11 | The gene | 60 | 60 | 45 | 55 |
  | 12 | Soil type | 60 | 50 | 40 | 50 |
  | 13 | Vitamin | 50 | 40 | 40 | 43 |
  | 14 | Antioxidant | 50 | 40 | 30 | 40 |
  | 15 | Jade | 30 | 40 | 50 | 40 |
  | 16 | Ecosystem | 40 | 40 | 30 | 37 |
  | 17 | Pain | 50 | 50 | 20 | 37 |
  | 18 | Stress | 40 | 40 | 20 | 33 |
  | 19 | Intelligence | 40 | 30 | 20 | 30 |
  | 20 | Mental disorder | 30 | 30 | 10 | 23 |
  | 21 | Invasive species | 30 | 30 | 10 | 23 |
  | 22 | Gender | 20 | 20 | 5 | 15 |
  | 23 | Race | 20 | 20 | 5 | 15 |
  | 24 | Weed | 20 | 10 | 0 | 10 |
  | 25 | Learning style | 10 | 5 | 0 | 5 |
  | 26 | Phlogiston | 0 | 0 | 0 | 0 |

  ### 2. Hostage Items (Ambiguity Flags)

  These items will manufacture fake disagreement because participants will silently substitute different definitions.

  *   **The gene:** Swing **50 points**.
      *   *Low:* Functional/unit of selection (bookkeeping for evolution).
      *   *High:* Molecular DNA sequence (physical structural real).
  *   **Biological species:** Swing **50 points**.
      *   *Low:* Morphological cluster (arbitrary lines).
      *   *High:* Phylogenetic lineage (real historical individuals).
  *   **Race:** Swing **55 points**.
      *   *Low:* Biological subspecies (non-existent).
      *   *High:* Social-cluster kind (real causal power, but debatable as "natural").
  *   **Acid:** Swing **30 points**.
      *   *Low:* Everyday corrosive substance.
      *   *High:* Lewis/Brønsted definition (structural chemical reality).
  *   **Planet:** Swing **30 points**.
      *   *Low:* Geophysical object (Pluto is a planet).
      *   *High:* IAU dynamical definition (Pluto is not).
  *   **Stress:** Swing **40 points**.
      *   *Low:* Psychological feeling.
      *   *High:* HPA-axis hormonal cascade.
  *   **Metal:** Swing **20 points**.
      *   *Low:* Everyday material (alloys).
      *   *High:* Chemical element class.

  ### 3. Duplicate Metaphysical Problems

  You are double-counting the same underlying tension in these pairs.

  *   **Race / Gender:** Both are human population categories battling the biological vs. social construction debate.
      *   *Keep:* **Race**. (More extensive literature in natural kind debates).
  *   **Weed / Invasive species:** Both are functional categories defined by human harm/interest rather than intrinsic clustering.
      *   *Keep:* **Weed**. (Clearer example of a purely interest-relative kind).
  *   **Vitamin / Antioxidant:** Both are functional chemical classifications grouping chemically diverse structures by effect.
      *   *Keep:* **Vitamin**. (More familiar, clearer functional definition).
  *   **Intelligence / Learning style:** Both are psychometric constructs. Learning styles are largely debunked; intelligence is contested but has *g*-factor support.
      *   *Keep:* **Intelligence**. (More philosophically rich realism debate).
  *   **Metal / Mineral:** Both are material science classifications.
      *   *Keep:* **Metal**. (Clearer chemical basis).

  ### 4. The Cut to 12

  To fit 90 minutes, you need high variance, domain coverage, and clear anchors.

  **The List:**
  1.  The electron (Physics Anchor High)
  2.  Water (Chem Anchor High)
  3.  Phlogiston (Anchor Zero)
  4.  Weed (Anchor Low/Functional)
  5.  Biological species (Bio Core/Contested)
  6.  The gene (Bio Ambiguity)
  7.  Race (Social/Bio Boundary)
  8.  Mental disorder (Psych Boundary)
  9.  Acid (Chem Ambiguity)
  10. Planet (Definition Boundary)
  11. Protein fold (Bio Structural)
  12. Pain (Neuro/Phenomenal)

  **The Cuts That Hurt Most:**
  *   **Jade:** It is the canonical counterexample in the literature (Kripke/Putnam). Cutting it removes a historical touchstone, but *Water* and *Electron* cover the "real kind" base, and *Weed* covers the "fake kind" base.
  *   **Virus:** Biologists love arguing about virus life-status. It's redundant with *Species* and *Gene* for biological ontology, though.
  *   **Gender:** Political symmetry with *Race* is lost, but *Race* carries more weight in the specific "natural kind" literature.

  ### 5. The Spread and The Poll

  **Largest Spread Item:** **Biological species**.
  *   *Reasoning:* You have committed realists (lineages are mind-independent individuals) scoring it 85+, and committed nominalists (species are arbitrary slices of continuous variation) scoring it 20. Both positions are defensible by experts. *Race* has a spread, but few philosophers will defend it as a *natural kind* above 50. *Gene* has a spread, but it's usually resolved by stipulation. *Species* is the enduring war.

  **Fraction >50:** **0.35** (approx. 9 items).
  *   *Reasoning:* Philosophers are skeptics. They will grant *Electron, Water, Protein Fold, Inflammation, Metal, Mineral, Virus, Acid, Planet*. That's 9/26. They will tank *Gene, Species, Race, Gender, Disorder, Intelligence, Pain, Stress, Jade, Weed, Vitamin, Antioxidant, Ecosystem, Soil, Learning Style, Phlogiston*. Even though some of these are "real", the *natural kind* bar is high.

  ### 6. Blunt Assessment

  **Is this measuring the kinds or the list?**
  Mostly the list. Specifically, it is measuring the **ambiguity of your labels**. If one person scores "Gene" as "DNA segment" and another as "unit of selection", you aren't measuring disagreement about natural kinds; you're measuring disagreement about vocabulary. The spread on *Gene* and *Species* will be noise, not signal.

  **The One Fix:**
  **Add parenthetical definitions to every item.**
  Do not print "The gene". Print "The gene (molecular DNA sequence)" or "The gene (unit of heredity)". Do not print "Race". Print "Race (biological subspecies)". If you force them to score the *concept* you intend, the exercise measures metaphysics. If you leave it open, it measures semantics.
