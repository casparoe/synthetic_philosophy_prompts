  I defend measure (4), excess mortality net of displacement, because it isolates the famine's specific causal acceleration of death without erasing structural deprivation or inflating counts with inevitable mortality. This measure treats famine not as a biological label but as a distinct shock to survival probabilities.

  Measure (1) assumes famine is a property of individual bodies (starvation pathology). It diverges from (3) when entitlement collapse kills via infectious disease rather than caloric deficit. For (1) and (3) to coincide, starvation must be the sole mechanism of entitlement failure, and disease environments must remain static. In reality, they diverge sharply when sanitation collapses alongside markets, making disease the killer though entitlement loss is the cause. Measure (2) assumes famine is a demographic event (a spike). It diverges from (4) when the crisis merely advances the deaths of the chronically debilitated. For (2) and (4) to coincide, background mortality must be zero, or the famine must not affect the frail disproportionately. Measure (3) assumes famine is a counterfactual violation of rights. It coincides with (1) only in a world where rights guarantee survival absent specific shocks. Measure (4) assumes famine is a causal intervention that accelerates mortality hazards. It requires a baseline of expected survival to isolate the crisis's specific contribution from background noise. This distinction matters because (2) counts the cost of poverty, while (4) counts the cost of the shock. (4) asks: did this event change the trajectory? (2) asks: did more people die? (1) asks: did they look starved? (3) asks: were they owed survival?

  In Velmara, the government code defines a legal trigger, not the ontological reality of suffering. The announcement is legally coherent but substantively false; entitlements collapsed despite availability, killing via wage failure rather than grain shortage. This reveals that famine is not defined by aggregate food supply but by distributional failure. Our choice among (1)–(4) does not settle reality by stipulation. Measure (1) might miss these deaths if certified as disease, allowing the state to hide the crisis. Measures (2) and (4) track the real excess loss of life that the code obscures. The question tracks a real phenomenon—systemic survival failure—that administrative definitions can mask but not erase. If we accept the code, we accept that mass death without price spikes is not famine, which contradicts the entitlement framework. The reality exists independent of the label; the measure determines whether we see it. Measure (4) captures the Velmara tragedy best because it isolates the mortality shock caused by the banking collapse, regardless of grain stocks. It identifies the causal break in survival expectations.

  The choice of measure is load-bearing because it gates accountability. To resist the "no crime" slide, reject (1) as epistemically vulnerable; starvation weakens immune systems, making "disease" a proximate but not ultimate cause. Officials can manipulate cause-of-death data to zero out (1) while bodies pile up. To resist the "dying anyway" slide, insist that accelerating death is itself a harm measurable by (4). A political crime need not create death ex nihilo to be culpable; shortening life through negligent entitlement collapse is sufficient for accountability. Measure (4) quantifies this specific harm, preventing officials from hiding behind biological technicalities or fatalistic deflections. It forces the acknowledgment that the state altered the timing of death for a specific population. By isolating the shock, (4) assigns responsibility for the acceleration, blocking both the denial of event and the denial of consequence. It transforms famine from a natural disaster statistic into a ledger of political failure.
