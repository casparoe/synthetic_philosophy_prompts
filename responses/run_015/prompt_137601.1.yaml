answer: |-
  Cut the epistemic question and the scale question immediately. Candidate 2 is a trap for your specific team; diagnosing model correlation and designing market makers to subsidize decorrelation is econometrics and machine learning work, not political philosophy or formal decision theory. You will burn eighteen months trying to specify variables you cannot measure with your toolkit. Candidate 4 is equally dangerous because it mistakes an empirical question for a theoretical one. Whether small-scale trials predict state-level success is a question for social scientists with data, not philosophers with models. If you fund that, you will spend two years arguing about external validity without producing a single actionable framework for a policy shop.

  That leaves you with the Metric Problem, the Manipulation Problem, and Legitimacy. You should fund the Metric Problem first and the Manipulation Problem second. Legitimacy is third, and you should treat it as a dissemination task rather than a core research line. The trade-off here is explicit: you are prioritizing functionality over acceptance. If the system does not work (no metric) or is unsafe (manipulable), legitimacy is irrelevant. A policy shop cannot pick up a broken machine, no matter how well you justify its authority. By pushing Legitimacy downstream, you risk building a tool that works technically but fails politically, but that is a better risk than building a political justification for a tool that collapses under its own weight.

  The Metric Problem is the upstream constraint. Futarchy cannot exist without a settlement condition. Your instinct about the "retrospective citizen assembly" workaround is correct to be worried; it is a distraction dressed up as a fix. By betting on ratification rather than outcomes, you relocate the value conflict from the metric design phase to the assembly selection phase. You have not solved the problem of defining welfare; you have merely outsourced it to a political body that is now the target of all the lobbying and influence you hoped to bypass. For a two-year policy uptake timeline, this is too slow and too political. Instead, your group should focus on robust proxy design: identifying metrics in specific domains (corporate governance, university budgeting) that are resistant to Goodhart's Law and can be specified ex ante. This is pure decision theory and political philosophy, and it is the bottleneck for every other line of work. Without a metric, there is no market.

  The Manipulation Problem is the safety constraint. You correctly identify that concentrated actors can move the variable in high-stakes domains. If a monopoly can trade against its own regulation, the market price signals noise, not information. This is where your formal decision theory capacity is critical. You need to model the game-theoretic stability of futarchy under conditions of asymmetric power. This is more tractable than the epistemic question because it relies on mechanism design rather than data science. It is also more neglected than the metric problem; everyone assumes metrics are hard, but fewer acknowledge that futarchy might be actively dangerous in the exact domains where it is most needed. If you solve the metric problem but ignore manipulation, you hand a weapon to powerful actors. If you solve manipulation but ignore metrics, you have a safe system that measures nothing. Functionality precedes safety, but safety precedes adoption.

  What would move this ordering? For the Metric Problem, watch for failed pilots in crypto DAOs or corporate governance. If a major organization attempts futarchy and collapses because the metric was gamed within twelve months, the urgency for robust proxy design spikes, and your work becomes immediately vital. For the Manipulation Problem, watch for successful attacks on existing prediction markets used in governance. If a actor successfully profits by manipulating a policy outcome rather than predicting it, the Manipulation Problem jumps to first place because the system is now proven unstable. If neither happens, stick to the order: define the goal, then secure the process.

  \answer{Metric Specification and Welfare Proxy Design}
