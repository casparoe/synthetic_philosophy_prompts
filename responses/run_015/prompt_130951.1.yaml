  The painter copies shadows on the wall,
  The poet names the Idea that appears,
  They mimic forms that rise and timely fall,
  Bound by Representation's strict frontiers.
  For sculpture freezes stone in silent hall,
  And drama acts through fleeting, human years,
  They mirror objects destined to befall,
  But keep the primal Will from coming near.

  Yet music leaps the veil and sings the Will,
  Bass is the gravity of lifeless stone,
  It is the Will itself, beyond all skill,
  Harmony fills plant and animal bone,
  But melody is man's constant striving,
  Intellect's long quest, never arriving.
