      *   *Representation:* Does the wax *represent* the state of the colony to the colony? It has content (population density) and use (guiding action). If the content is falsified, is it a lie?
      *   *Deception:* Deception usually requires a mind capable of being wrong. Can a system be "wrong"? A thermostat can be mistaken about temperature. Is that deception? Usually, deception implies an intent to mislead or a violation of trust. Here, the ecologist is the deceiver. The victim is the system.
      *   *Identity over Time:* The colony persists despite total cellular turnover (Theseus's Ship). The narrator identifies it as a continuous entity ("her"). The ecologist sees it as a flux of insects.
