      *   *External Writability:* The wax can be painted from outside. Does this make it like a whiteboard rather than a brain? But brains can be manipulated (optogenetics, drugs). If I manipulate your brain to make you believe you're safe, have I deceived you? Yes.
      *   *Harm:* Ecologist says no harm (will compensate). Novelist says the wrong is in the deception itself, not the outcome. This is a deontological vs. consequentialist clash wrapped in metaphysics.
      *   *Anthropomorphism:* Is the narrator projecting personhood onto a complex mechanism? Or is the ecologist reducing a complex agent to a mechanism?
