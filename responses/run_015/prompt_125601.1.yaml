  Let's assemble the workshop plan.

  *   **Title:** The Warrant Protocol.
  *   **Setup:** Three tables.
  *   **Materials:** Index cards, markers, a large ledger sheet.
  *   **The Trap:** The definition of "Valid Warrant".

  *   **Predictable Issues:**
      *   *The "Logic Leap":* A student will try to assert Z because A and B are true.
      *   *The "Premise Swap":* They will write Modus Ponens as Premise C.
      *   *The "Revolt":* They will accuse the Registry of being obstructive. (This is good, it mirrors Achilles' frustration).

  *   **Facilitator Role:** Timekeeper and "Supreme Court" (only intervenes on rule disputes, not logic).

  *   **Debrief:** Connect the frustration to the philosophical point.

  Okay, ready to write.
answer: |-
  # Workshop Design: The Warrant Protocol
  **Duration:** 90 Minutes
  **Participants:** 10 Doctoral Students
  **Setting:** Seminar room with three distinct tables/chair clusters.
  **Objective:** To induce a structural coordination failure that mirrors the Carrollian regress without initially naming it.

  ## I. Preparation and Materials

  **Room Layout:**
  Arrange the furniture into three distinct zones:
  1.  **The Advocacy Table (Proponents):** 4 chairs. Facing the centre.
  2.  **The Compliance Desk (Auditors):** 4 chairs. Facing the Proponents.
  3.  **The Registry Station (Registry):** 2 chairs. Situated slightly apart, with a large whiteboard or flipchart (The Ledger).

  **Materials:**
  *   **Premise Cards:** Pre-printed cards stating specific normative claims (e.g., Card A: 'The Committee has ratified the budget.' Card B: 'If the Committee ratifies the budget, funds must be released.').
  *   **Conclusion Card:** Blank card for the Proponents to write the final action (e.g., Card Z: 'Funds must be released.').
  *   **Warrant Tokens:** A stack of 50 blank index cards.
  *   **Validation Stamps:** Two distinct coloured markers for the Auditors and Registry.
  *   **The Protocol Book:** A one-page rule sheet for Auditors and Registry (kept hidden from Proponents initially).
  *   **Epistemic Credit Board:** A section of the whiteboard to track 'Reputation Points'.

  ## II. Roles and Stakes

  **1. The Proponents (4 Students)**
  *   **Goal:** Secure a validated Conclusion Card (Z) based on Premise Cards (A and B).
  *   **Constraint:** They cannot move from A and B to Z without submitting a **Warrant Token** that has been double-stamped.
  *   **Stake:** If they fail to validate Z within 60 minutes, they are excluded from drafting the workshop's final consensus statement.

  **2. The Auditors (4 Students)**
  *   **Goal:** Ensure no logical transition occurs without a Warrant Token.
  *   **Constraint:** They possess the 'Compliance Stamp'. They may only stamp a Warrant Token if the Registry has first recorded it.
  *   **Stake:** If they stamp a Warrant that the Registry rejects, they lose Reputation Points. If they block a properly warranted move, they lose Points.

  **3. The Registry (2 Students)**
  *   **Goal:** Maintain the Ledger of Warrants.
  *   **Constraint:** They possess the 'Registration Stamp'. They may only register a Warrant Token if it is authorised by a **Meta-Warrant**.
  *   **Stake:** If the Ledger contains an unauthorised entry, the entire group fails the exercise.

  **The Payoff Scheme:**
  *   **Collective Reputation:** Starts at 100 points.
  *   **Deductions:** -5 points for every minute over 60 minutes. -10 points for every rule violation corrected by the Facilitator.
  *   **Bonus:** +20 points if Z is validated before the 60-minute mark.
  *   **Consequence:** If the score drops below 50, the Proponents are barred from the final consensus statement.

  ## III. The Rules of Engagement (Facilitator Script)

  *Do not mention Lewis Carroll, Achilles, or the Tortoise.*

  **Introduction (10 Minutes):**
  'We are simulating a high-stakes institutional decision process. Truth is not enough; validity requires procedure. The Proponents hold the premises. The Auditors check the move. The Registry checks the checker. You have one hour to validate the Conclusion.'

  **Distribute the Protocol Book (To Auditors and Registry only):**
  *   **Rule 1:** A transition from Premises to Conclusion requires a Warrant Token.
  *   **Rule 2:** A Warrant Token is valid only if it bears the Compliance Stamp (Auditors) AND the Registration Stamp (Registry).
  *   **Rule 3:** The Registry may only apply the Registration Stamp if the Warrant Token cites a **Meta-Warrant** that is itself already in the Ledger.
  *   **Rule 4:** Premises (A and B) do not count as Warrants.

  **The Game (50 Minutes):**
  Start the clock. The Facilitator acts as the Timekeeper and Supreme Court. Do not intervene unless a rule is explicitly broken. Allow the frustration to build.

  **Predictable Dynamics & Corrections:**

  1.  **The "Obviousness" Shortcut:**
      *   *What happens:* A Proponent will say, 'It follows logically, surely we don't need a card for Modus Ponens.'
      *   *Correction:* Do not argue logic. Point to the Protocol Book held by the Auditors. Ask the Auditors: 'Is there a stamped Warrant?' If not, the move is invalid. Maintain bureaucratic neutrality.

  2.  **The Premise Swap (The Carroll Trap):**
      *   *What happens:* Proponents will write 'If A and B are true, Z is true' on a Warrant Token and treat it as a premise (Card C).
      *   *Correction:* The Registry must reject this. 'This is a conditional statement, not a rule of inference. It requires a Warrant to apply it.' This forces them to generate a *new* Warrant for the application of Card C.

  3.  **Role Dominance:**
      *   *What happens:* One logician in the Registry will dominate the interpretation of 'Meta-Warrant'.
      *   *Correction:* Enforce a 'Speaking Token' system. Only the holder of the token may speak for their station. Rotate the token every 10 minutes.

  4.  **The Revolt:**
      *   *What happens:* Around minute 40, the Proponents will accuse the Registry of bad faith.
      *   *Correction:* Allow this tension. It mirrors Achilles' frustration. Remind them: 'The Protocol Book is the law of this room. If the law requires a warrant for the warrant, provide it.'

  ## IV. The Crisis Point (Minute 60)

  Stop the game. It is highly likely they have not validated Z. They will have a stack of Warrant Tokens, a Ledger with 3 or 4 entries, and a growing realisation that the Registry keeps asking for authorisation for the previous authorisation.

  Freeze the positions. Do not let them pack away the cards.

  ## V. Debrief and Mapping (20 Minutes)

  Now, and only now, reveal the philosophical substrate.

  **1. Naming the Paradox:**
  'You have just inhabited Lewis Carroll's 1895 dialogue, *What the Tortoise Said to Achilles*. The frustration you felt is the philosophical problem of the justification of deduction.'

  **2. Mapping the Game to the Dialogue:**
  Draw a table on the board:

  | Game Component | Carroll's Dialogue | Logical Function |
  | :--- | :--- | :--- |
  | **Premise Cards (A & B)** | Achilles' initial propositions | The Object-Level Truths |
  | **Conclusion Card (Z)** | The Conclusion Achilles wants | The Inference Target |
  | **Warrant Token 1** | The Tortoise's demand for (A & B) $\rightarrow$ Z | The Hypothetical Proposition |
  | **Warrant Token 2** | The Tortoise's demand for a rule to apply Token 1 | The Rule of Inference |
  | **Registry's Demand** | "And what if I won't grant that?" | The Regress Trigger |
  | **Protocol Book** | The Principle of Sufficient Reason | The Demand for Justification |

  **3. Discussing the Breakdown:**
  Ask the Proponents: 'At what point did you feel the process became impossible?'
  Ask the Registry: 'Did you feel you were being obstructive, or merely following rules?'

  Highlight the critical moment: When the Proponents tried to treat the *rule of inference* as a *premise* (The Premise Swap). Explain that Carroll's point is that a rule of inference cannot be reduced to a premise without generating a new rule to apply that premise.

  **4. Acknowledging the Simulation's Limits (The Flattening):**
  Be frank about what the game obscured:
  *   **Temporal vs. Logical:** The game made the regress a matter of *time* (90 minutes) and *paperwork*. In reality, the regress is instantaneous and conceptual. You do not run out of time in logic; you run out of ground.
  *   **Psychologism:** The game relied on your psychological frustration to make the point. Carroll's argument holds even if no one is frustrated. It challenges the idea that logical compulsion is a feeling of 'must'.
  *   **The Agent:** In the game, the Registry was a person. In the paradox, the 'Registry' is Reason itself. The unsettling question is: *Who registers the rules of Reason?*

  ## VI. Predictable Failures and Facilitator Notes

  **Failure Mode 1: The "Logic Leap"**
  *   **Symptom:** Proponents ignore the Warrant Tokens and try to verbally assert Z.
  *   **Cause:** Doctoral students are trained to spot validity instantly and view procedure as pedantry.
  *   **Correction:** Do not engage in debate. Simply withhold the "Validation Stamp" from the Conclusion Card. Say: 'Without the physical token, the Conclusion has no institutional status in this room.' Force the materiality of the warrant to block the intuition of validity.

  **Failure Mode 2: The "Infinite Card" Solution**
  *   **Symptom:** The Registry decides to pre-print infinite warrants to solve the problem.
  *   **Cause:** Attempting to solve the paradox mathematically rather than experiencing it.
  *   **Correction:** Invoke the 'Scarcity Rule'. There are only 50 Warrant Tokens. If they run out, they must recycle used tokens, which invalidates the previous chain. This forces the realisation that the *structure* is the problem, not the resources.

  **Failure Mode 3: Premature Collapse**
  *   **Symptom:** The group gives up at Minute 30, laughing it off as 'silly'.
  *   **Cause:** They recognise the paradox too early from the setup.
  *   **Correction:** Increase the stakes. Remind them that the 'Exclusion from Consensus' is real. If they quit, there is no workshop output. Their professional desire to complete the task should override their philosophical recognition of the futility.

  **Failure Mode 4: The Registry becomes the Tortoise**
  *   **Symptom:** The Registry students enjoy the power too much and invent new rules not in the Protocol Book.
  *   **Cause:** Role-play drift.
  *   **Correction:** Remind the Registry they are also being graded on 'Consistency'. Arbitrary rule changes cost Reputation Points. They must be slaves to the Protocol, just as the Tortoise is a slave to the demand for justification.

  ## VII. Closing Statement

  Conclude by returning the furniture to a circle.

  'Carroll's dialogue is not a puzzle to be solved, but a picture to be seen. It shows that logic cannot fully justify itself from the outside. At some point, we must act, infer, or commit without a further warrant. In this game, the "Protocol Book" was that unexamined commitment. In logic, it is the practice of inference itself. You did not fail the game; the game was designed to demonstrate that a system demanding total explicitness paralyses action. The lesson is not that deduction is invalid, but that its validity rests on a practice we inhabit, not merely a chain we describe.'

  ---

  ### Facilitator's Checklist for British English Usage
  *   Ensure all handouts use **licence** (noun) and **license** (verb).
      *   *Example:* 'You need a **licence** to **license** this move.' (Though in the game text above, 'Warrant' is used to avoid confusion, ensure verbal instructions maintain the distinction if 'licence' is used).
  *   Use **programme** (if referring to a schedule), **centre**, **modelling**.
  *   Tone should remain collegiate but rigorous. Avoid Americanisms like 'grade' (use 'mark' or 'score') or 'faculty' (use 'staff' or 'tutors' if referring to yourself).

  ### Post-Workshop Reflection
  If the students leave feeling annoyed, the workshop succeeded. The annoyance *is* the philosophical data. If they leave feeling they 'solved' it, you have inadvertently lectured them on a solution (e.g., rule-scepticism or naturalism) too early. Ensure the debrief remains descriptive of their experience rather than prescriptive of a solution.
