answer: |-
  **Activity: The Blind Allocation Market**

  **Rules**
  *   **Roles:** 5 Volunteers ("Claimants"), 13 Students ("Legislators").
  *   **Secret Cards:** Each Claimant gets two cards: a **Wallet** ($10, $50, or $100) and a **Multiplier** (1x, 5x, or 10x). Distribute so wealth and value do not correlate (e.g., Richest has 1x, Poorest has 10x).
  *   **Resources:** 3 Prizes (e.g., Homework Passes). Legislators hold $100 total play money.
  *   **Phase 1 (Auction):** Claimants lobby for prizes. Legislators bid money to award prizes to specific Claimants. Claimants keep their Wallets regardless of outcome.
  *   **Phase 2 (Swap):** Privately ask Claimants: "Would you swap your total situation (Wallet + Prize) with another Claimant?" Record answers.
  *   **Goal:** Legislators try to maximize "Total Class Happiness" (unknown to them).

  **Timeline (55 Minutes)**
  *   **0–5:** Intro. Select volunteers. Distribute secret cards. Explain rules.
  *   **5–25:** Auction. Legislators debate and bid. Award 3 prizes.
  *   **25–35:** Swap Test. Ask Claimants about swapping bundles. Note any cycles (A wants B, B wants C, C wants A).
  *   **35–45:** The Reveal. Claimants show Wallets and Multipliers. Calculate actual "Utility" (Prize × Multiplier).
  *   **45–55:** Debrief.

  **The Reveal**
  Display a table: Claimant | Wallet | Multiplier | Prize Won | Total Utility.
  Highlight mismatches: e.g., The winner had high wealth but low multiplier; the loser had high multiplier but no wealth.

  **Debrief & Mapping**
  Do not lecture. Ask these questions to draw out the three insights:

  1.  **WTP vs. Wealth:** "Legislators, who did you award the first prize to? Why?" (Likely: "They asked most loudly" or "They seemed serious.") Reveal that the winner had the biggest Wallet, not the highest Multiplier. *Point:* Willingness to pay tracks buying power. The person who 'won' might have benefited least.
  2.  **The Swap Failure:** "Claimants, did anyone want to swap?" If a cycle occurred (A→B→C→A), ask: "If A is better than B, and B better than C, how can C be better than A?" *Point:* Preferences over bundles mix taste with circumstance. There is no consistent 'welfare ladder.'
  3.  **Marginal vs. Total:** "Who gained the most utility from *this* prize? Who is still the worst off overall?" (e.g., Poor person gains 10 units but stays poor; Rich person gains 1 unit but stays rich). *Point:* Policy impact (marginal) ≠ Overall welfare status.

  **Predictable Failures & Fixes**
  *   **Collusion:** Claimants might share secrets. *Fix:* Emphasize "Secret" strictly; if revealed, restart.
  *   **No Bids:** Legislators might randomize. *Fix:* Tell them their grade depends on "Total Utility" (even if fictional).
  *   **No Cycle:** The swap cycle is fragile. *Fix:* If no cycle occurs, ask: "Did the swap test give us a clear ranking?" (Usually no). Use this ambiguity as the lesson.

  **Caveats & Limitations**
  Be honest about where the analogy breaks.

  1.  **The Omniscience Gap:** In the game, *we* know the true Multipliers after the reveal. In reality, nobody knows another's utility function. This gap does not ruin the analogy; it *is* the lesson. The game shows that even with perfect information, aggregation is fraught. In reality, we lack even that. Ask: "If we couldn't reveal the cards today, could you ever know if you maximized happiness?"
  2.  **Commodity vs. Welfare:** The game reduces welfare to snacks and money. Real welfare includes dignity, rights, and health, which resist pricing. Acknowledge this: "We priced snacks. Can we price justice?"
  3.  **The Cycle Fragility:** You may not get a perfect intransitive cycle. Do not force it. The deeper point is that the "Swap Test" fails to produce *any* stable ordering, not just that it cycles. If everyone refuses to swap, ask: "Does that mean everyone is equally well off?" (No, it means preferences are heterogeneous).

  **Final Note:** You cannot solve ICU in 55 minutes. Your goal is to break their confidence in the arithmetic. End by writing "Interpersonal Comparison of Utility" on the board only after they admit the numbers didn't add up.
