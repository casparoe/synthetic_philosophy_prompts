      Begin with the rationale for the sequence. The session must begin by solidifying the conceptual framework before engaging with the paradoxical conclusion. You should start by introducing a static finite box model containing gas particles in thermal equilibrium. This concrete case must carry the entire section because it isolates the statistical mechanics from the distractions of general relativity. This model must have a defined maximum entropy state and a clear criterion for what constitutes an observer configuration within the gas, but it must lack cosmic expansion or horizon dynamics because introducing metric expansion at this stage would confuse the issue of phase space volume with the issue of spacetime volume. You need this model established first because every subsequent argument regarding observer counts depends on having a agreed-upon container in which those counts are performed.

      Once the model is set, move immediately to comparing the frequency of ordinary observers versus fluctuated observers. This is the precise moment to head off the misconception that the problem is just a probability calculation. Students will instinctively argue that Boltzmann brains are so improbable they can be ignored. You must stop this by showing that while a single fluctuation is improbable, the time available in an eternal universe is infinite, making the absolute number of fluctuations dominate the absolute number of ordinary observers. If you do not correct this here they will fail to see why the paradox arises at all. Following this comparison, introduce the principle of self-locating uncertainty which states that you should reason as if you are a randomly selected observer from the set of all observers. This dependency is crucial because the statistical dominance of Boltzmann brains only becomes a problem for us if we assume we are typical observers.

