  I'm a TA for an undergraduate philosophy of physics course, and next week I have to teach a fifty-minute section on the Boltzmann brain problem to students who have heard the basic idea in lecture but haven't worked through the details. I don't want an explanation of the problem; I want a plan for how I should teach it. Please give me the order in which the components must be introduced and why each depends on the ones before it, the one concrete case that should carry the whole thing and what it must have and lack, the misconceptions the students will predictably bring or form (I'm guessing "but we're not Boltzmann brains, so the problem doesn't apply to us" and "the problem is just a probability calculation") and exactly where in the sequence I should head each one off, one end-of-section question that would show they've understood the measure problem rather than just memorized the slogan, and a note on what I should leave out at this level and say so explicitly. Write continuous prose only — no headings, bullet points, bold text, or tables.
