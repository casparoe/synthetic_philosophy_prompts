answer: |-
  Two souls claim right to choose their private page,
  To read or leave the book upon the shelf;
  Thus Liberty defines their personal stage,
  Where each is sovereign of his private self.
  And Pareto speaks: if both agree one way,
  Then social choice must bind that shared desire;
  No conflict seems to cloud the judgment day,
  Till private will with public good conspire.

  Yet fix the four states within this strict domain,
  Where A beats B, as plain as eye can see;
  Then C beats D, returning to the chain,
  Till D beats A; no order stays to be.
  This loop arises not from chance or stain,
  But where rights cross, unanimous agree:
  Must Liberty resign, and be lost,
  Or Pareto bear the highest cost?
