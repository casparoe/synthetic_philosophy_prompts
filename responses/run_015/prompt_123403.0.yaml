answer: |-
  ### Exam Question

  **Question 4:**
  Consider Parfit's teletransporter thought experiment. We usually assume the scanner destroys the original brain and body. Modify this scenario in two ways:
  1.  **The Suspension Variant:** The scanner copies your psychology to Mars, but on Earth, your original body is not destroyed. Instead, it is put into reversible suspended animation for one hour, after which it wakes up. For that hour, there are two beings with your psychology.
  2.  **The Partial Variant:** The scanner malfunctions. It creates a replica on Mars, but the replica inherits only 60% of your memories and character traits, with no psychological connection to the remaining 40%.

  Assuming the Reductionist view that personal identity is not what matters in survival, explain how a plausible theory must handle these two variants. Specifically: (a) In the Suspension Variant, does the fact that the Earth-you survives (maintaining identity) change the moral or prudential status of the Mars-you? (b) In the Partial Variant, does survival come in degrees? (c) Why might a simple definition of psychological continuity fail here without further conditions, and does adding a "no-branching" clause save identity or merely clarify what matters?

  ***

  ### Model Answer

  A plausible Reductionist view must sever the link between strict identity and prudential concern. On this view, what matters is Relation R: psychological connectedness and continuity, with any cause. Identity is a one-one relation; Relation R can be one-many. The proposed variants test whether students grasp that severing this link changes how we evaluate survival in cases of fission and degradation.

  In the Suspension Variant, strict identity holds between the pre-scan you and the woken Earth-you, because the physical organism persists without interruption. However, Relation R holds between pre-scan you and *both* the Earth-you and the Mars-you. If identity were what matters, the Mars replica would be irrelevant to your survival, merely a copy. But if identity is not what matters, the Mars-you matters just as much as the Earth-you. The existence of the Earth survivor does not diminish the prudential concern owed to the Mars replica. A plausible view must conclude that you should anticipate the experiences of both, or at least care about both equally, despite identity holding only with the Earth body. This demonstrates that identity is not the ground of survival; otherwise, the branching would render the replica insignificant, which contradicts the intuition that the replica is just as "you" in what counts.

  In the Partial Variant, the replica lacks full psychological continuity. A simple psychological continuity story might treat survival as all-or-nothing: either you survive or you do not. But if identity is not what matters, survival can come in degrees. Since only 60% of the psychology is connected, Relation R holds to a lesser degree. A plausible view must admit that prudential concern is diminished proportionally. You should care less about the Partial Replica than a Full Replica. This implies that what matters is not a threshold concept but a scalar one. Identity cannot come in degrees (you are either identical or you are not), so this confirms that identity is not the source of our concern.

  Finally, we must address why simple psychological continuity needs conditions. In the Suspension Variant, psychological continuity holds between Pre-Scan and both successors. If we define survival simply as "holding Relation R," then Pre-Scan survives as two people. This is acceptable for *what matters*, but it breaks *identity*, which must be unique. Some philosophers add a "no-branching" clause to save identity (i.e., you only survive if there is no competitor). However, for the Reductionist, adding this clause to *what matters* is a mistake. It implies that your survival depends on what happens to someone else (the Mars replica), which is extrinsic. A plausible view maintains that Relation R is what matters intrinsically. Branching shows identity fails, but it does not reduce what matters. Therefore, the theory must accept that in the Suspension Variant, identity fails to capture the full scope of survival, and in the Partial Variant, survival is a matter of degree, neither of which identity can accommodate.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | Point | Marks | Requirement | Typical Student Error |
  | :--- | :--- | :--- | :--- |
  | **1. Identity vs. Relation R** | 4 | Clearly distinguishes strict numerical identity (one-one) from Relation R (psychological continuity/connectedness). | Students treat "survival" and "identity" as synonyms throughout. |
  | **2. Suspension/branching implication** | 4 | Argues that Earth-survival does not negate Mars-matters; identity holds with Earth, but R holds with both. | Students claim Mars-you doesn't matter because Earth-you is the "real" one. |
  | **3. Degrees of survival** | 4 | Asserts that in the Partial Variant, prudential concern scales with continuity (degrees of what matters). | Students insist survival is binary (alive/dead) despite the prompt's premise. |
  | **4. Extrinsicness of branching** | 4 | Explains why a "no-branching" clause fixes identity but fails as a condition for *what matters* (extrinsic dependence). | Students argue branching eliminates what matters entirely rather than just identity. |
  | **5. Prudential anticipation** | 4 | Connects the metaphysical view to practical concern (anticipation/care) rather than abstract classification. | Students focus only on metaphysical labels without discussing concern/anticipation. |

  ***

  ### Instructor Notes on Validity and Interpretation

  **Confidence in Separating Understanding from Recall:**
  I am highly confident (90%) that this question separates understanding from recall. A student memorizing the slogan "identity is not what matters" will fail to explain *why* the Suspension Variant doesn't revert us to standard identity intuitions, or how the Partial Variant forces a scalar view of concern. The requirement to handle the "non-destruction" variant specifically blocks the standard "fission = death of original" shortcut.

  **Contested Readings and Premises:**
  There is one area where the marking scheme depends on a specific reading of Parfit rather than universal consensus: **Point 4 (Extrinsicness).** Parfit argues that adding a "no-branching" clause makes survival depend on extrinsic facts (what happens to the other replica), which he finds absurd for *what matters*. However, some competitors (like Nozick or Lewis) argue that identity *requires* non-branching and that we should align what matters with identity. The marking scheme rewards the Parfitian Reductionist stance (that branching doesn't reduce what matters). A student arguing convincingly for a "non-branching requirement for what matters" based on a different theorist should receive credit, provided they justify why Parfit's view is insufficient. The model answer assumes Parfit's specific Reductionist conclusion is the target.

  Additionally, the **Partial Variant** relies on the claim that psychological connectedness comes in degrees. While Parfit grants this, some animalists or biological continuity theorists would deny that partial psychology implies partial survival. The question presupposes the Psychological Criterion is the correct baseline to modify, which is standard for a seminar on Parfit but is itself a contested premise in broader metaphysics.
