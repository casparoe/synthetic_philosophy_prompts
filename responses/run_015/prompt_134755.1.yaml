  Give me your own number on that, but I mostly want the decomposition, with a rough probability and a one-liner of justification for each piece:

  1. Is the phenomenon unified at all? Maybe the it's absurd to assert it datum and the you can't believe it datum are seperate effects with seperate explanations, and maybe the two versions come apart too. How much of your number is spent on unification being true in the first place?
  2. Conditional on unification at the level of belief: how does the split go between the constitutive/transparency story above, a self-knowledge story (we have a special non-inferential grip on our own beliefs, and the sentence clashes with that), and a deflationary story where there's no deep fact and the whole thing is pragmatics or an artefact of what first-person avowals do?
  3. The tense-and-person profile: past tense is fine, second and third person are fine, first-person present is bad, and people have claimed first-person future is bad too. How much does that profile support the constitutive story as against an assertion-based one?
  4. The grief case. He's dead but I don't believe it is not absurd, it's moving. Either that's not really a case of asserting p without believing p, or the datum is about full, wholehearted, occurrent acceptance rather than belief as such. How much pressure does that put on the constitutive story, and which horn do you take?
  5. The graded version. Try it's raining but I'm not confident that it is, or it's probably raining but I'm only at about 50-50 on it. If belief is really credence and there's a threshold for assertion and for treating-as-true, you'd expect the Moorean pattern to come in degrees and to track the threshold. Does it? How much of your number rides on flat outright belief vs. degrees?
  6. Here's the case I made up and that I think does the real work, so don't skip it. Stipulate a subject whose first-order systems have p — they take the umbrella, they use p as a premise in deliberation, they'll say it's raining — but whose belief-monitoring mechanism is dissociated, so that when asked do you believe it's raining they sincerely, stably, and non-confabulatingly say no, and let's stipulate we've checked that this isn't self-deception and isn't ignorance of what believe means. Now they say it's raining and I don't believe that it is. Is that utterance absurd, or just false? Does your answer to that come out of your theory, or is it a bare hunch you'd drop under pressure? I want a number for how much this case moves you, not just a verdict.
  7. How much of the remaining spread between people who disagree about this is terminological — what believe and absurd are taken to mean — rather than substantive?

  Then combine the terms into your headline number, tell me which single term you'd defend least confidently, and tell me what would move the number most: some empirical finding (kids acquiring the pattern late, a language without a handy believe-verb, a clinical dissociation roughly like my case in 6), a new argument, or something else.

