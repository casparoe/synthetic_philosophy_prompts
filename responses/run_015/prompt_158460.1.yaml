answer: |-
  ### Desiderata for an Adequate Answer to the SCQ

  1.  **Conceptual Distinction (Non-Negotiable):** The answer must distinguish composition from material constitution (statue/clay), coincidence, and diachronic identity. It cannot dissolve the SCQ by collapsing these categories; it must explain why a composite is distinct from its parts and its matter without multiplying entities beyond necessity.
  2.  **Determinacy & Extrinsicity (Non-Negotiable):** The answer must take a definitive stand on whether composition is vague and whether it is intrinsic. Regarding the **Near-Miss Problem**: given continuous series of bonding or integration, the theory must argue for a specific metaphysical status (sharp/arbitrary, vague, or degree-theoretic) rather than assuming a stopping point based on ordinary judgment. Regarding **Extrinsicity**: it must specify if facts outside the $xs$ can determine composition.
  3.  **Causal Non-Redundancy (Non-Negotiable):** Composites must be causally efficacious in their own right. The answer cannot allow every apparent case of composite causation to be a case of systematic overdetermination by the parts; the whole must do work the parts do not do alone.
  4.  **The Tribunal (Prejudice of Naturalism):** The theory must identify the authority for ontological verdicts. To satisfy scientific realism, verdicts for molecules, organisms, and ecosystems must either align with special science taxonomy or provide a robust error theory explaining why science talks as if they exist when they do not.
  5.  **Borrowed Activity (Non-Negotiable):** Regarding integrated non-living parts (e.g., synthetic organs): the theory must choose a horn. **Horn 1** (Include the part) shifts boundaries ad hoc, violating the theory's stated principle (e.g., "life"). **Horn 2** (Exclude the part) makes unity depend on something outside the composite, rendering composition extrinsic and vicarious. **Adjudication:** Horn 2 is worse for mereological orthodoxy; this shows a unifying relation cannot be had by proxy if composition is to remain intrinsic.
  6.  **Thinking Parts (Non-Negotiable):** The answer must resolve the Problem of the Many without proliferating thinkers. It cannot allow that every slight variation in part-inclusion constitutes a distinct conscious subject; it must secure the uniqueness of the thinker.

  ### Incompatible Desiderata

  **The Tribunal vs. Determinacy.**
  Scientific practice (The Tribunal) often relies on vague, extrinsic, or functional boundaries (e.g., ecosystems, viruses). Classical metaphysical demands (Determinacy) require sharp, intrinsic boundaries. Satisfying the scientific taxonomy often violates the demand for sharp, intrinsic composition, and vice versa.

  ### Most Exclusionary Requirement

  The requirement that **composition cannot be vague** does the most exclusionary work. It eliminates moderate restrictivist views that attempt to mirror common sense or scientific vagueness, forcing theories toward Universalism (to avoid arbitrariness) or Nihilism (to avoid vagueness), thereby collapsing the middle ground where most viable restrictivist theories reside.

  ### View Summaries

  *   **Universalism:** The $xs$ always compose a $y$. Avoids vagueness and arbitrariness but violates The Tribunal by ontologically committing to absurd composites (e.g., "trout-turkeys").
  *   **Nihilism:** The $xs$ never compose a $y$. Secures intrinsicity and sharpness but fails Causal Non-Redundancy and requires a radical error theory for The Tribunal.
  *   **Life-Based Restrictivism:** The $xs$ compose a $y$ iff their activity constitutes a life. Aligns with The Tribunal for organisms but fails Borrowed Activity (forcing extrinsicity) and Near-Miss (forcing arbitrariness).
  *   **Brutal Composition:** Composition is primitive and unanalyzable. Avoids analysis paradoxes but fails to explain *why* composition occurs, offering no traction on The Tribunal or Near-Miss.

  \answer{Composition cannot be vague.}
