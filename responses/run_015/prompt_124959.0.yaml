answer: |-
  ### Desiderata for a Practical Allocation Spec

  **1. Metric Binding & Latency**
  *   **The Case:** Your "Student Flourishing Index" (SFI) resolves in five years and is controlled by Institutional Research (IR). A market cannot lock capital for five years, and if IR changes the methodology in year three, the contract terms are breached.
  *   **Why it's here:** To prevent the market from becoming a bet on IR bureaucracy rather than student welfare.
  *   **Who demands it:** *Mechanism designers* (contract enforceability) and *Anti-Goodhart* (metric stability).
  *   **Status:** **Non-negotiable.** Without a fixed, timely metric, the market cannot settle.

  **2. Counterfactual Settlement**
  *   **The Case:** You allocate to Housing. The Mental Health market must still resolve to validate the traders' predictions, otherwise traders will only price the likely winner, destroying information on the alternatives. Since you only observe the Housing outcome, the Mental Health market has no natural settlement data.
  *   **Why it's here:** To ensure the "bet on beliefs" actually generates comparative data rather than just confirming the winner.
  *   **Who demands it:** *Mechanism designers* (market efficiency) and *Democrats* (need to know what was rejected).
  *   **Status:** **Non-negotiable.** Without this, it is not a prediction market; it is a lottery on the committee's whim.

  **3. Trader-Metric Decoupling**
  *   **The Case:** Your 30 traders are students who fill out the SFI survey. A landlord trader could subsidize housing to boost their own profits, then short the SFI if they know the survey is easy to game, or simply bribe peers to answer differently.
  *   **Why it's here:** To prevent the market participants from manipulating the underlying oracle (the survey) to cash out their positions.
  *   **Who demands it:** *Anti-Goodhart* (preventing manipulation) and *Legal/Compliance* (fraud risk).
  *   **Status:** **Non-negotiable.** If traders control the metric, the market is a self-fulfilling prophecy and a liability.

  **4. Incentive Sufficiency**
  *   **The Case:** University rules likely ban real-money gambling. If you use play money, a trader might vote for "Cash Transfers" because it's popular, not because it works, since they lose nothing. If the $40m decision rests on play-money signals, the committee assumes the risk of the market's frivolity.
  *   **Why it's here:** To ensure the price signal reflects genuine information, not noise or signaling.
  *   **Who demands it:** *Mechanism designers* (truth-seeking) vs. *Legal* (risk avoidance).
  *   **Status:** **Preference.** You can operate with play money, but you must discount the signal's weight in the final decision.

  **5. Decision Discretization**
  *   **The Case:** The market might say "Housing yields 50 SFI points," but your budget knob is continuous. You need a formula that converts a price differential (e.g., Housing vs. Endowment) into a specific dollar allocation (e.g., $10m vs. $30m) without requiring a new market for every $1m increment.
  *   **Why it's here:** To translate market prices into actionable budget lines without infinite liquidity requirements.
  *   **Who demands it:** *Mechanism designers* (operational feasibility).
  *   **Status:** **Preference.** This is an engineering constraint, solvable with a bonding curve or discrete buckets.

  ---

  ### Incompatible Subsets (The Trade-offs)

  **1. Counterfactual Settlement vs. Full Budget Authority**
  You cannot have both. To settle the markets on rejected policies (Desideratum 2), you must observe their outcome. To observe their outcome, you must implement them (at least partially). If you run a randomized pilot (Desideratum 6) to generate counterfactuals, you cede control of the full $40m to the randomization. If you retain full committee authority to pick one winner, you cannot honestly settle the losing markets.
  *   *Verdict:* You must choose between a **true futarchy** (randomized implementation to settle all markets) and a **consultative market** (committee picks, markets settle only on the chosen path, losing information).

  **2. Metric Binding vs. Metric Validity**
  To satisfy traders, the SFI must be locked for the contract duration (Desideratum 1). To satisfy the student body, the SFI must reflect current reality. If IR changes the survey methodology in year two to better capture "flourishing," they breach the market contract. If they don't change it, they measure the wrong thing for five years.
  *   *Verdict:* You must choose between **contractual rigidity** (market settles, metric might be outdated) and **administrative flexibility** (metric improves, market voids).

  **3. Trader-Metric Decoupling vs. Local Knowledge**
  The people with the best information about student flourishing are the students (the traders). But the students are also the metric sources (Desideratum 3). If you ban students from trading to prevent manipulation, you lose the informed capital. If you allow them, you invite manipulation.
  *   *Verdict:* You must choose between **information quality** (let students trade) and **integrity** (exclude students).

  ---

  ### The Single Most Exclusionary Requirement

  **Counterfactual Settlement (Desideratum 2).**

  This is the hard stop. In a standard election or committee vote, rejected options vanish. In a futarchy, rejected options *must* resolve to validate the pricing mechanism. Because you only observe one timeline (the policy you enact), you literally cannot settle the bets on the policies you reject without an external model or a randomized control trial.
  *   If you use an **external model** to settle rejected bets, traders are betting on the model, not reality.
  *   If you use **randomization** (pilots), you cannot allocate the full $40m efficiently (you're forced to split it).
  *   If you **void rejected bets**, traders ignore the losers, and the market fails to compare options.

  This requirement excludes 90% of "easy" futarchy implementations. It forces you into either a complex A/B testing regime or admitting the market is merely advisory.

  ---

  ### Scorecard

  **Straight Student-Body Vote**
  *   **Feasibility:** High. Legally standard, operationally simple.
  *   **Accuracy:** Low. Popularity contests favor visible cash transfers over long-term endowment growth.
  *   **Risk:** Low legal risk, high risk of populist budget blowouts.
  *   **Verdict:** The status quo. Safe, but reproduces the four-hour fight.

  **Expert Committee (Current Model)**
  *   **Feasibility:** High. You are already doing this.
  *   **Accuracy:** Medium. Depends on committee expertise, prone to internal lobbying.
  *   **Risk:** Low legal risk, high reputational risk if decisions seem opaque.
  *   **Verdict:** Efficient but lacks legitimacy. Good for boring years, bad for crises.

  **Real-Money Conditional Market**
  *   **Feasibility:** Near Zero. University legal counsel will block gambling/speculation on institutional policy immediately.
  *   **Accuracy:** High. Skin in the game forces truth-seeking.
  *   **Risk:** Extreme legal exposure, reputational disaster if students lose tuition money.
  *   **Verdict:** Dead on arrival. Do not propose this.

  **Play-Money Conditional Market**
  *   **Feasibility:** Medium. Technically easy, legally benign.
  *   **Accuracy:** Low-Medium. Without real stakes, traders signal virtue rather than truth.
  *   **Risk:** Medium. Committee relies on noisy data; if the market suggests something wild, ignoring it looks bad.
  *   **Verdict:** Viable as a "temperature check" tool, but cannot drive the $40m decision alone.

  **Randomized Pilot (A/B Testing)**
  *   **Feasibility:** Medium. Requires operational capacity to split housing/services.
  *   **Accuracy:** High. Generates actual causal data for future years.
  *   **Risk:** Medium. Equity concerns (why does Hall A get cash and Hall B doesn't?).
  *   **Verdict:** The only way to make futarchy work long-term. Start here to build the dataset for future markets.
