prompt: |-
  I'm on my university's student union allocations committee — we move about $40m a year out of a "student life fund" and every spring we have the same four-hour fight about splitting it between mental health services, subsidised housing, direct cash transfers to students, and just leaving it in the endowment. A friend of mine who works on DAO governance stuff keeps telling us to stop arguing and run it futarchy-style: we argue once about what "student flourishing" even means and fix it as a number, then let prediction markets tell us which allocation makes that number highest. I've got the general shape of the vote-on-values-bet-on-beliefs setup and I don't want another explainer of it. What I want is the spec: what would such a procedure actually have to get right before I'd let real money ride on it, given that our purpose is boringly practical — a decision procedure we could actually operate next spring, on real allocations, with no legal exposure, not an ideal yardstick for thinking about governance.

  So: give me the desiderata list, each one with the concrete case behind it rather than just the label. Here's the material you should build the cases out of, since these are the things that keep me up. (1) Our only usable welfare metric is a "student flourishing index" built from a survey run five years later by the university's own institutional research office, which has its own incentives and which has already revised the index methodology twice. (2) The decision isn't binary — there's a knob for how much of the pot to spend at all, so conditional markets would have to be opened on a continuum of values and we can only discretise. (3) The likely traders are students, who are also the people whose survey answers constitute the metric, and at least one of them will be a landlord or a counselling-service vendor with a big side stake in the outcome; our market will be thin, maybe thirty serious participants, and possibly one genuinely informed one. (4) Whatever we adopt is the only branch that gets observed — the market conditional on the option we reject never resolves, so I don't see how the thing settles at all, and I want you to take that seriously rather than hand-wave it. (5) We probably can't run real-money markets under university rules, so it'd be play money or a small prize pool, and I genuinely don't know whether "the stakes have to be real" is a real requirement or a prejudice of the economics camp. (6) We can randomise: the housing pilot could be run in half the halls of residence and not the others, so for some of these questions we could get an actual counterfactual instead of a prediction about one.

  For each requirement, tell me why it's on the list and whether it's non-negotiable for our purpose or a preference of one faction (the mechanism-design people, the democrats, the anti-Goodhart people). Then the part I most want: which subsets of the desiderata can't be satisfied together — I'd bet "settles to a definite result" and "tracks the genuine causal effect of the policy" are already in tension, and I suspect "metric we actually care about" and "metric traders can't influence" are too, but you tell me. And tell me which single requirement does the most work in excluding designs. Keep the weight on the criteria and their cases; a short scorecard at the end — a straight student-body vote, an expert committee, a real-money conditional market, a play-money version, and just running the randomised pilot — is enough, five or six lines, I don't need prose.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university student union allocations committee (moving $40m/year).
      *   **Problem:** Annual 4-hour fight over allocation (mental health, housing, cash, endowment).
      *   **Proposal:** Friend suggests Futarchy (vote on values, bet on beliefs).
      *   **Constraint:** Needs a *spec* for a practical procedure operable next spring, not theoretical explainer. Needs to address legal exposure, practical operation, and specific constraints.
      *   **Input Material:** Six specific constraints/worries provided by the user (Metric lag/manipulation, Continuous decision space, Thin market/Conflict of interest, Counterfactual problem, Play money vs. Real money, Randomization capability).
      *   **Output Requirements:**
          1.  Desiderata list (Concrete case behind each, why it's there, who cares about it).
          2.  Trade-off analysis (Which subsets can't be satisfied together).
          3.  Identify the single most exclusionary requirement.
          4.  Short scorecard (5 options, 5-6 lines each).
      *   **Tone:** Practical, rigorous, slightly cynical/bureaucratic (matching the user's "boringly practical" stance), no fluff.

  2.  **Deconstruct the Input Material into Desiderata:**
      *   *(1) Metric Lag/Manipulation:* The "Student Flourishing Index" (SFI) is lagged (5 years), mutable (methodology changes), and controlled by a third party (Institutional Research).
          *   *Desideratum:* **Metric Stability & Integrity.** If the goalpost moves, the market bets on the wrong thing. If the metric is lagged, feedback is too slow for annual budgets.
      *   *(2) Continuous Decision Space:* It's not Yes/No, it's "How much?". Discretization is needed.
          *   *Desideratum:* **Actionable Granularity.** The market must map to specific budget lines, not vague directions.
      *   *(3) Thin Market/Conflict of Interest:* Traders = Students = Metric sources. Vendors/Landlords might participate. Only ~30 serious traders.
          *   *Desideratum:* **Market Liquidity & Independence.** Traders shouldn't be able to manipulate the outcome metric directly (Goodhart's Law on steroids).
      *   *(4) Counterfactual Problem:* Only one path is taken. Rejected options don't resolve.
          *   *Desideratum:* **Resolution Certainty.** The market *must* settle. If the condition isn't met, bets are void, destroying incentive.
      *   *(5) Play Money vs. Real Money:* University rules likely ban real gambling/speculation.
          *   *Desideratum:* **Incentive Compatibility.** Do play-money points drive accurate prediction enough to justify $40m decisions?
      *   *(6) Randomization:** Can run pilots (A/B testing).
          *   *Desideratum:* **Causal Identifiability.** Can we actually measure the effect, or just correlate?

  3.  **Drafting the Desiderata (Iterative Refinement):**
      *   *Need to frame these as "Requirements for the Spec".*
      *   *Requirement 1: Metric Binding.* (Addresses #1). If the IR office changes the survey, the market breaks.
      *   *Requirement 2: Resolution Mechanism.* (Addresses #4). How do we settle bets on paths not taken?
      *   *Requirement 3: Trader/Metric Separation.* (Addresses #3). Students shouldn't trade on metrics they define.
      *   *Requirement 4: Stakes Sufficiency.* (Addresses #5). Play money might not work.
      *   *Requirement 5: Decision Mapping.* (Addresses #2). Turning market prices into budget percentages.

  4.  **Analyzing Trade-offs (The "Impossible Trinity" of Futarchy):**
      *   *Tension 1: Resolution vs. Causal Truth.* To settle the market (Req 2), you need the metric to resolve. But if you only implement one policy (as per normal governance), the other markets don't resolve naturally. You need a "synthetic resolution" or randomization (Req 6). But randomization limits the scale of the policy (you can't randomize $40m easily).
      *   *Tension 2: Metric Integrity vs. Metric Relevance.* The metric must be stable for traders (Req 1), but the relevant metric (student flourishing) is inherently subjective and mutable. Locking it down makes it a target for manipulation (Goodhart).
      *   *Tension 3: Participation vs. Independence.* You want informed traders (students), but they are the subjects. If landlords trade, they have inside info but conflicting incentives.
      *   *Key Insight:* The "Counterfactual Problem" (#4) is the killer. Futarchy *requires* knowing what *would have happened* to settle the market on the option *not* chosen. Without randomization (#6), you literally cannot settle the market honestly.

  5.  **Identifying the "Most Exclusionary" Requirement:**
      *   It's **Resolution Certainty (The Counterfactual Problem)**. Without a way to settle bets on rejected options, the market is legally and functionally broken. You can't have a betting market where 75% of the bets are "void because we didn't do that." This forces you toward randomization or a model-based settlement, both of which have huge downsides.

  6.  **Developing the Scorecard:**
      *   *Options:* Straight Vote, Expert Committee, Real-Money Conditional Market, Play-Money Market, Randomized Pilot.
      *   *Criteria:* Feasibility, Accuracy, Risk, Speed.
      *   *Constraint:* 5-6 lines per option.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I explain *who* wants each desideratum? (Mechanism designers, democrats, etc.).
      *   *Check:* Did I use the specific cases provided? (e.g., the 5-year lag, the 30 traders).
      *   *Check:* Is the tone right? (Avoid academic jargon where possible, focus on "operational risk").
      *   *Correction on Futarchy:* Standard futarchy usually resolves based on the *actual* outcome of the chosen policy to update future markets, but Hanson's original proposal implies markets predict the metric *if* passed. If the policy isn't passed, the market is usually cancelled or settled based on a control group. The user specifically flagged #4 ("Whatever we adopt is the only branch that gets observed"). This is the *Identification Problem*. I need to be precise here. If the market predicts "SFI if Policy A passes," and Policy A passes, it resolves. If Policy B was bet on but not passed, those bets are usually voided in simple implementations, which kills liquidity. To keep them valid, you need a counterfactual estimate.
      *   *Correction on Metric:* The 5-year lag is fatal for annual budgeting. You can't wait 5 years to settle a market for next spring's budget. This needs to be highlighted in the "Metric Stability" section.

  8.  **Final Polish:**
      *   Ensure the trade-off section clearly states which pairs are incompatible.
      *   Ensure the scorecard is punchy.
      *   Make sure the "Single Requirement" is clearly justified.

  **(Self-Correction Note on the 5-year lag):** This is actually a showstopper for standard futarchy. If the metric resolves in 5 years, the capital is locked for 5 years. No student trader will lock capital for 5 years on a play-money market. This reinforces the "Stakes Sufficiency" and "Resolution" tensions. I need to make sure this is explicit.

  **(Self-Correction on "Resolution"):** In Hanson's futarchy, the market resolves based on the *actual* outcome of the implemented policy. The markets for the *rejected* policies simply expire worthless or are cancelled. The user's concern #4 is valid: if bets on rejected policies are cancelled, traders lose incentive to price them accurately, leading to poor comparison data. If they *must* resolve, you need a counterfactual model. I will frame this as "Settlement of Rejected Options."

  Let's assemble the response.

  *   **Desiderata:**
      1.  **Metric Binding & Latency:** (From #1). 5-year lag is too long for annual budget. IR office changing methodology is risk.
      2.  **Counterfactual Settlement:** (From #4). How to settle bets on policies not enacted.
      3.  **Trader-Metric Decoupling:** (From #3). Prevent traders from manipulating the survey.
      4.  **Incentive Sufficiency:** (From #5). Play money vs. Real money.
      5.  **Decision Discretization:** (From #2). Turning prices into budget %.

  *   **Trade-offs:**
      *   Settlement vs. Budget Authority (Randomization solves settlement but limits budget control).
      *   Metric Stability vs. Metric Validity (Locking the metric prevents manipulation but might measure the wrong thing over 5 years).
      *   Participation vs. Independence (Students know best but have conflicts).

  *   **Most Exclusionary:** Counterfactual Settlement.

  *   **Scorecard:** Keep it tight.

