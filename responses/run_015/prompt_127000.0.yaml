answer: |-
  This is a fantastic nuance. You have correctly identified that the standard "Dark Forest" (Liu Cixin's *Three-Body Problem*) is rooted in **fear** (survival instinct), whereas your variation is rooted in **etiquette** (social/ethical instinct).

  To answer your first question: **No, there is no single, canonical name for this exact configuration.**

  It touches on the **Zoo Hypothesis** (aliens hide to let us develop) and the **Prime Directive** (aliens hide to avoid contaminating us), but those are usually top-down (advanced hiding from primitive). Your version implies a mutual, rational agreement that *visibility itself* is a violation of the other party's autonomy.

  Since you're building a setting, you have the freedom to name it. In game theory and xenosociology terms, I would suggest calling this **"The Imposition Hypothesis"** or **"The Burden of Contact."**

  Here is a sharp definition of the concept, how it differs from standard silence, and the answer to your "indifference" question.

  ### 1. The Core Definition
  **The Imposition Hypothesis:** A strategic framework where civilizations remain stealthy not because they fear destruction, but because **detection imposes a costly decision node on the observer.**

  *   **Standard Dark Forest:** "If they see me, they might shoot me to be safe." (Motivation: Self-Preservation)
  *   **The Imposition Hypothesis:** "If they see me, they are forced to decide whether to intervene, ignore, or assimilate me. That decision costs them resources, moral clarity, or strategic focus. To be polite/safe/rational, I should not exist in their perceptual field." (Motivation: Altruistic Restraint / Burden Avoidance)

  In this model, **visibility is an act of aggression.** By revealing yourself, you are forcing another civilization to spend political capital or ethical energy on you.

  ### 2. How It Differs from Precautionary Silence
  Precautionary silence is "I don't know if you're nice, so I'll wait." The Imposition Hypothesis is "I know you're structured, and I don't want to break your structure."

  | Feature | Dark Forest (Standard) | Precautionary Silence | The Imposition Hypothesis (Yours) |
  | :--- | :--- | :--- | :--- |
  | **Primary Fear** | Death / Annihilation | Unknown Intent | Imposing Obligation |
  | **View of Other** | Predator / Threat | Unknown Variable | Responsible Actor |
  | **Cost of Contact** | Physical Destruction | Strategic Risk | **Moral/Strategic Debt** |
  | **Why Hide?** | To survive. | To gather intel. | **To spare them the choice.** |
  | **If Detected** | Strike first. | Retreat / Jam signals. | **Apologize / Explain / Submit.** |

  ### 3. The "Indifference Test" (Does it collapse?)
  You asked: *Does it collapse if the observer is truly indifferent?*

  **Yes. Absolutely.**

  This is the critical weakness (and dramatic tension) of your setting. The Imposition Hypothesis **only works if the observer cares.**

  *   **Scenario A (Ethical Observer):** The observing civilization has a strict code (e.g., "We must help sentient life" or "We must never interfere"). If they detect you, they *must* act. You hiding saves them from violating their code. **The logic holds.**
  *   **Scenario B (Indifferent Observer):** The observing civilization is nihilistic, purely machine-logic, or simply vast enough that a new civilization is like an ant hill to them. They feel no debt. They feel no moral weight. You hiding to "spare them a decision" is like an ant hiding to spare a human the decision of whether to pet it. The human doesn't care. **The logic collapses.**

  **Narrative Implication:**
  This creates a great filter for your novel. Civilizations that adopt the Imposition Hypothesis survive only as long as they encounter other civilizations that share their ethical framework. If they encounter a "Dark Forest" predator, they die (because they hid for ethical reasons, not defensive ones). If they encounter an "Indifferent" giant, they are ignored (which might be safe, but renders their sacrifice meaningless).

  ### 4. Why Would a Rational Actor Do This?
  You mentioned "rational actors." A hard-nosed game theorist might ask: *Why should I care about burdening the other guy?*

  To make this work in hard sci-fi, you need a reason why **imposing a burden is dangerous for the hider.**
  *   **Resentment:** If I force you to make a hard choice, you might resent me. A resentful neighbor is a dangerous neighbor.
  *   **Precedent:** If I force you to intervene with me, you might set a precedent that requires you to intervene with everyone. I am risking turning you into a galactic policeman, which destabilizes the region.
  *   **The "Beggar" Problem:** In a resource-scarce universe, asking for help (even passively by existing) marks you as a net drain. Rational actors hide to avoid being categorized as "dependents."

  ### 5. Suggested Terminology for Your Novel
  Since you're writing dialogue, you need terms characters can use.
  *   **"Decision-Forcing":** *"Don't light the beacon. It's decision-forcing."*
  *   **"Ethical Stealth":** *"We practice ethical stealth. We don't want to be their problem."*
  *   **"The Debt of Discovery":** *"If they find us, we owe them a future. I'd rather we owe them nothing."*
  *   **"Ghosting":** *"We aren't hiding from their guns. We're ghosting their conscience."*

  ### Summary for your Bible
  *   **Concept:** Visibility = Imposition of Obligation.
  *   **Name:** The Imposition Hypothesis / Burden of Contact.
  *   **Condition:** Requires the observer to possess a moral or strategic framework that contact disrupts.
  *   **Failure State:** Collapses completely against indifferent or nihilistic observers.

  This is a much more sophisticated take than the standard "shoot on sight" trope. It allows for characters who hide not out of cowardice, but out of a strange, cosmic form of politeness. That's rich ground for conflict.
