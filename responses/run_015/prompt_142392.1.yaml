      *   *Sentence 1:* "A mechanism, on this view, is nothing but a collection of parts doing things, arranged so that their doings together produce some change: ion channels opening and closing are a mechanism for the action potential."
          *   *Assessment:* Generally accurate (Machamer, Darden, Craver - MDC framework). "Nothing but" is a bit reductionist but acceptable for summary.
      *   *Sentence 2:* "What makes something the same mechanism is the job it does, not what it is made of — the very same mechanism can be built out of quite different hardware in different species, and one and the same piece of hardware can be several different mechanisms depending on which output you happen to be tracking."
          *   *Assessment:* This is the tricky part. *Functionalism* vs. *Structuralism*. MDC emphasizes organization + entities + activities. Multiple realizability (different hardware, same job) is widely accepted. *One hardware, different mechanisms* depends on how you individuate mechanisms (by phenomenon or by structure). This is a live dispute.
      *   *Sentence 3:* "This is where mechanistic explanation gets into trouble. If mechanism identity floats free of the parts, then two laboratories studying 'the same' mechanism may be studying different things entirely, and there is no fact of the matter about whether a system that has begun to behave differently is the old mechanism malfunctioning or a new mechanism quietly taking over."
          *   *Assessment:* "No fact of the matter" is strong. Most philosophers would say there *is* a fact, but it's hard to access, or it depends on the *explanatory context*. The "trouble" is real (individuation problem), but "no fact of the matter" leans towards antirealism or conventionalism, which is contested.
      *   *Sentence 4:* "The interventionist criterion is what settles such questions: wiggle a candidate part and watch the output. If the output wiggles, the part belongs to the mechanism; if it doesn't, it doesn't, and what you have in front of you is a different mechanism."
          *   *Assessment:* This references Woodward's interventionism + Craver's mutual manipulability. It establishes *constitutive relevance*, not necessarily *mechanism identity* across time or conditions. It shows a part is *involved*, but doesn't necessarily prove the *whole mechanism* is the same vs. a backup route using the same part. This is the weakest link for the plot.

