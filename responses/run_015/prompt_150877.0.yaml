  *   **Yes** → Go to 3b.

  **3b. Have you moved that number less than 5% since?**
  *   **Yes** → **LEAF C: Anchoring**
  *   **No** → Go to 4.

  ### PHASE 2: THE EXCHANGE
  **4. If you swapped your written reasoning verbatim, would you still keep your number?**
  *   **Yes** (Disagreement persists) → Go to 5.
  *   **No** (Convergence likely) → Go to 6.

  ### PHASE 3A: PERSISTENT DISAGREEMENT
  **5. Do you fundamentally disagree on how the world works (e.g., politics drives tech vs. tech drives politics)?**
  *   **Yes** → **LEAF D: No Shared Starting Point**
  *   **No** → Go to 9.

  **9. Would we learn more by keeping two bets open than by averaging?**
  *   **Yes** → **LEAF E: Valuable Disagreement**
  *   **No** → **LEAF F: Weighting Mismatch**

  ### PHASE 3B: CONVERGENCE POSSIBLE
  **6. Is there a fact you know that you haven't told the group?**
  *   **Yes** → **LEAF G: Private Evidence (Unsaid)**
  *   **No** → Go to 7.

  **7. Did you tell them, but they don't know how much to trust your confidence on it?**
  *   **Yes** → **LEAF H: Private Evidence (Calibration/Weight)**
  *   **No** → **LEAF H: Private Evidence (Calibration/Weight)** *(See Logic Notes)*

  ---

  ### DIAGNOSIS & ACTION HANDOUT

  | Leaf | Name | The Awkward Commitment | Next Standup Action |
  | :--- | :--- | :--- | :--- |
  | **A** | **Operationalization Mismatch** | You admit you weren't actually talking about the same event. | Rewrite the question text together until both nod. |
  | **B** | **Incentive Distortion** | You admit your number is a bet on the bonus, not the world. | Separate the "forecast" from the "score-optimized number" explicitly. |
  | **C** | **Anchoring** | You admit your number is sticky out of habit, not evidence. | Force a re-estimate from 50% up and 50% down, then average. |
  | **D** | **No Shared Starting Point** | You admit you live in different mental models of reality. | Map the specific causal mechanism where your models diverge. |
  | **E** | **Valuable Disagreement** | You commit to maintaining conflict rather than resolving it. | Assign each person to find evidence that would change *their own* mind. |
  | **F** | **Weighting Mismatch** | You agree on the world but disagree on what matters most. | List the top 3 evidence items and rank them individually. |
  | **G** | **Private Evidence (Unsaid)** | You admit you held back information that would have settled it. | Share the fact immediately; update numbers live. |
  | **H** | **Private Evidence (Calibration)** | You admit you shared the fact but not how much you trust it. | Add a confidence score (1-5) to every piece of evidence cited. |

  ---

  ### LOGIC NOTES & EMPTY SPACE
  *   **Indistinguishable Leaves:** **Leaf D (No Shared Starting Point)** and **Leaf F (Weighting Mismatch)** are theoretically distinct but often indistinguishable in practice. If you disagree on weights, it often looks like you disagree on models. Treat them as a single "Model/Weight" block if you can't split them.
  *   **Empty Combination:** The path **4-No → 6-No → 7-No** is logically empty. If swapping reasoning helps (4-No), but all evidence was spoken (6-No) and trust/weight was clear (7-No), there is no reason for the swap to have helped. If you land here, you likely failed Question 6 (someone forgot they hadn't said something).
  *   **Theorem Boundary:** This tree assumes both parties are trying to be accurate. If one party is lying (beyond Leaf B), the tree breaks; Aumann's theorem assumes honesty.
  *   **Calibration:** Leaf H captures the wrinkle where evidence is shared, but *trust in the evaluator* is not. This is often the actual failure mode in senior teams.
