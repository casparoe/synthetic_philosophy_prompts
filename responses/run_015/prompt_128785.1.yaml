      *   **Constraint:** Separate consensus from contested views among historians/philosophers. Do not present contested readings as consensus.

  2.  **Deconstruct the Problem (Philosophy & History):**
      *   *Philosophy of Science:* This touches on Lakatos (research programmes), Duhem-Quine (auxiliary hypotheses), and Popper (falsification). "Right but early" is often a protective belt adjustment.
      *   *Economic History:* The Malthusian Trap is generally accepted for pre-industrial societies. The Industrial Revolution is the "escape." Was Malthus wrong about the *inevitability* or just the *timing/conditions*?
      *   *The "Right but Early" Claim:* This implies the mechanism is fundamental and will eventually reassert itself (or did elsewhere), versus the claim that the mechanism was superseded by a new regime (Solow growth, demographic transition).

  3.  **Evaluate the Decomposition Terms:**

      *   *(1) Mechanism Operating:* Did population pressure still affect wages *marginalally* even if the trend was up? Yes, short-run fluctuations often show Malthusian dynamics even during growth.
      *   *(2) Escape (Shock vs. Refutation):* Was the Industrial Revolution/Colonialism an external shock (auxiliary hypothesis) or does it prove the core theory wrong (population doesn't *necessarily* outstrip resources)? Most economic historians view it as a regime change, which challenges the *universality* of Malthus's law, but not necessarily its validity in the prior regime.
      *   *(3) Later Confirmations:* Pre-industrial stagnation fits well. The Demographic Transition (falling fertility with income) is actually *anti*-Malthusian in the strict sense (Malthus predicted preventive checks via misery/vice, not voluntary limitation due to opportunity cost), though often conflated.
      *   *(4) Retiming Test (vs. Boserup):* Ester Boserup argued population pressure *causes* innovation. If both Malthus and Boserup can claim "right but early" on the same data, the test fails. This is a strong philosophical objection.
