prompt: |-
  I work in software engineering with no formal philosophy background, and I have been reading about consciousness as a user illusion — essentially a compressed interface the brain builds so an organism can navigate without processing raw neural data. In philosophy forums, the debate between people who take this interface view seriously and those who insist there is an irreducible phenomenal quality that no user-level model can fully capture has stalled for years: both sides recycle the same thought experiments, neither concedes ground, and the arguments feel circular to me.

  My working hypothesis is that the disagreement is not about neuroscience but about explanatory standards. One side treats consciousness like a documented API — a functional specification of inputs and outputs — while the other treats it like a runtime environment whose properties are genuinely instantiated at the user level. But I also wonder whether there is a hidden empirical question about whether phenomenal properties are causally inert, or whether this is a verbal clash over whether reality applies to interface-level entities, or whether the two sides are simply answering different questions — evolutionary design versus ontology — under a single heading.

  Please analyse the structure of this impasse. Is it substantive, verbal, or are the sides answering different questions? Refer to concrete claims each camp actually makes, rather than offering a survey. Separate what is relatively settled — for example, that brains construct representational behaviour — from what remains genuinely contested among people who understand the topic, and do not present any contested view as the consensus. Tell me what, if anything, would count as progress: a new conceptual distinction, an empirical result, a formal argument, or a change of question. Or does the stall suggest the problem is ill-posed?

  Keep your response under 300 words.
