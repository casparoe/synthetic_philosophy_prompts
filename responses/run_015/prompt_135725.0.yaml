  ## Map Notes & Empty Cells

  *   **The "Sophisticated" Collapse:** Leaf **D** (Sophisticated Substantivalism) and Leaf **G** (Structuralism) are empirically equivalent and ontologically very close. The tree separates them at Q1 (Do points exist?), but if your answer to Q1 is "Points exist only as nodes," you might end up in either cell depending on whether you treat the node as a *thing* or a *placeholder*.
  *   **Empty Cell 1 (Q2=NO, Q3=YES):** **Incoherent.** You cannot claim Hole-diffeos represent the *same* world while Global-diffeos represent *different* worlds. Diffeomorphisms form a group; if the identity holds for compact support, it holds globally.
  *   **Empty Cell 2 (Q1=YES, Q2=YES, Q3=NO, Q4=Neither):** **Unattractive.** This is the "Manifold Substantivalist who accepts indeterminism but hates Global Drag." Nobody sits here because accepting Hole-indeterminism usually forces you to accept Global-indeterminism (Leaf A) or fix the theory (Leaf B/C).
  *   **Global Drag Logic:** Q3 is the filter. If you answer **YES**, you are a haecceitist (Leaf A). If you answer **NO**, you are trying to save determinism while keeping General Covariance (Leaves B & C). This separates the "Bite the Bullet" crowd from the "Fix the Theory" crowd.

  *(Print this single-sided. If a friend gets stuck, ask them: "If I swap the labels on every point in the universe, did I make a new universe?")*
