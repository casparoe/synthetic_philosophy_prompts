answer: |-
  # The Hole Argument Sorting Tree

  **Start Here:** You accept the setup. You have a manifold $M$ and a metric $g_{ab}$. You grant that if points are bare individuals, the Hole Argument generates indeterminism. **Where do you stand?**

  ### Q1. The Ontological Surplus
  **Do the points of the manifold $M$ exist as individuals *over and above* the structural relations defined by the metric field $g_{ab}$?**
  *   **NO:** Points are just nodes in the structure, or don't exist at all. → *Go to Q6.*
  *   **YES:** Points are "bare particulars" that hold the fields. → *Go to Q2.*

  ---

  ### Q2. The Hole Haecceity
  **(For Q1=YES):** In the Hole scenario, two models agree on all physics outside the hole but differ on *which* point holds *which* field value inside. **Do these count as distinct physical possibilities?**
  *   **NO:** They represent the same physical world (Leibniz Equivalence). → *Go to Q5.*
  *   **YES:** They are genuinely different ways the world could be. → *Go to Q3.*

  ---

  ### Q3. The Global Drag
  **(For Q2=YES):** Now apply a diffeomorphism that shifts *every* point in the universe (no hole). **Does this create a distinct physical possibility from the original?**
  *   **YES:** Any permutation of points creates a new world. → *Leaf A.*
  *   **NO:** Global shifts are just symmetries; only the Hole creates indeterminism. → *Go to Q4.*
      *   *(Note: If you answered NO to Q2, you must answer NO here. If you answer YES here but NO to Q2, your position is **incoherent**—you can't treat diffeos as gauge globally but not locally.)*

  ---

  ### Q4. The Determinism Fix
  **(For Q3=NO):** You think the Hole possibilities are real but must be blocked to save determinism, while Global Drag is fine. **How do you block them?**
  *   **Restrict Models:** Rule out "hole-y" solutions as physically inadmissible. → *Leaf B.*
  *   **Add Structure:** Postulate absolute background objects to pin points down. → *Leaf C.*

  ---

  ### Q5. The Ground of Equivalence
  **(For Q2=NO):** You say diffeomorphic models are the same world. **Why?**
  *   **Ontological:** The points don't have independent identity; the *substance* is the equivalence class. → *Leaf D.*
  *   **Linguistic:** The points exist, but our language/theory is redundant (gauge). → *Leaf E.*

  ---

  ### Q6. The Field Ontology
  **(For Q1=NO):** If points aren't independent individuals, what is the fundamental substance?
  *   **Metric Field:** Spacetime just *is* the metric field $g_{ab}$ (no bare points). → *Leaf F.*
  *   **Structure:** Only the relational structure exists; points are eliminable. → *Leaf G.*
  *   **Relations:** Only matter fields exist; spacetime is a system of relations between them. → *Leaf H.*

  ---

  ## The Leaves (Positions)

  | Leaf | Position Name | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Radical Indeterminist** | You must accept that shifting every point in the universe creates a new world, making almost all physical predictions impossible. |
  | **B** | **Restrictionist Substantivalist** | You must explain why the equations allow "hole" solutions mathematically but nature forbids them physically without adding new laws. |
  | **C** | **Absolutist Substantivalist** | You must reintroduce unobservable absolute structure (like a fixed background metric) that GR was designed to eliminate. |
  | **D** | **Sophisticated Substantivalist** | You posit points exist but lack haecceity; critics say this is ontologically indistinguishable from Structuralism (Leaf G). |
  | **E** | **Conventionalist ("Just Relabelings")** | You claim the indeterminism is an artifact of our description, not the world, risking the charge that you're ignoring the ontology. |
  | **F** | **Supersubstantivalist** | You identify spacetime with the metric field, but struggle to explain what happens in regions where the field vanishes or is undefined. |
  | **G** | **Ontic Structuralist** | You claim "structure" exists without "things" to structure, which many find metaphysically mysterious (free-floating relations). |
  | **H** | **Plain Relationist** | You deny spacetime exists independently of matter, but must explain how spacetime persists in vacuum solutions (empty universes). |

