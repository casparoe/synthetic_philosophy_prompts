  ### Margin Comments

  **Part (1)**
  > *"In the branch where the other envelope has 2x, my envelope is the smaller one, so x = S. In the branch where the other envelope has x/2, my envelope is the larger one, so x = 2S."*

  **Correct.** This is the precise equivocation required. You identified that $x$ is not a constant across the expectation sum.

  > *"If I parametrize by the smaller amount S instead, then holding gives (1/2)(S) + (1/2)(2S) = 1.5S and switching gives (1/2)(2S) + (1/2)(S) = 1.5S."*

  **Correct.** This correctly demonstrates the symmetry when the state space is properly defined. Full credit.

  **Part (2)**
  > *"P(I have the smaller | A = 2^k) = p_k / (p_k + p_(k-1)) = 1/(1 + 2^α)... When k = 1 the second possibility has probability zero, so I know for sure I'm holding the smaller envelope and I switch."*

  **Correct.** Your Bayesian update is accurate, and you correctly caught the boundary condition at $k=1$.

  > *"E[other] - A = 2^k(1 - 2^(α-1))/(1 + 2^α), which is positive exactly when... α < 1."*

  **Correct.** The algebra holds.

  > *"Once you restrict to genuine distributions, i.e. α > 1, switching never pays and the paradox from part (1) never gets off the ground."*

  **Incorrect / Contradictory.** You explicitly stated two paragraphs ago: *"except at k = 1, where I always switch."* If $\alpha > 1$, you still switch at $k=1$. Therefore, switching *does* pay for some amounts, even in the convergent case. You contradicted your own calculation in the summary. Additionally, while identifying the improper prior for $\alpha \le 1$ is insightful, dismissing the case entirely ignores the pedagogical point of the infinite expectation scenario (which Part 3 asks you to revisit). Docked 2 points for the internal contradiction and the overly dismissive conclusion.

  **Part (3)**
  > *"But if I see 2^(N+1), then S = 2^N and I'm definitely holding the larger envelope, so switching loses 2^N for sure. That one observation is where the ex ante books balance..."*

  **Correct.** You correctly identified the "top" boundary condition that breaks the "always switch" strategy in the finite case.

  > *"There, switching really is better conditional on every amount, which means the symmetry argument from part (1) is not universally valid: there are priors on which you should switch unconditionally, even before you open the envelope..."*

  **Fundamentally Wrong.** This is a serious conceptual error. Ex-ante, the envelopes are symmetric. The marginal distribution of the amount in Envelope 1 is identical to Envelope 2. Therefore $E[\text{Stay}] = E[\text{Switch}]$ (both are $\infty$). You **cannot** prefer switching unconditionally. The resolution to the paradox is *not* that unconditional preference exists; it is that Conditional Dominance ($E[Y|X=x] > x$) does not imply Unconditional Dominance ($E[Y] > E[X]$) when expectations are infinite (Law of Total Expectation fails). You have claimed an asymmetry exists where there is none.

  > *"...and the '1.5S = 1.5S' reasoning only goes through when E[S] is finite."*

  **Sloppy.** The $1.5S$ reasoning in Part (1) was about the *conditional* calculation error (equivocation on $x$). The *ex-ante* symmetry ($E[A]=E[B]$) holds regardless of finiteness. You are conflating the validity of the expectation operator with the validity of the symmetry argument.

  **Summary:** You have excellent algebraic mechanics and caught the boundary conditions in the finite/infinite setup ($k=1$ and $K=N$). However, your decision-theoretic interpretation in Part (3) collapses. You claim that conditional dominance implies unconditional preference in the infinite case; this is precisely the mistake the problem was designed to test. You also contradicted your own Part (2) results in your conclusion. Strong calculation, weak synthesis.
