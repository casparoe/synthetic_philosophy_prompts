answer: |-
  ### The Scenario

  You are the night manager at a cold-storage facility. It is 7:00 AM, and you are standing in front of the data logger for Freezer 4, but you haven't opened the file yet. You know that overnight there was a voltage spike in the grid, so it is a live possibility that the freezer temperature breached the safety threshold ($P$), but you don't know if it actually happened. You also know the primary temperature sensor is old and known to fail during voltage spikes. However, you personally installed a redundant backup alarm system yesterday afternoon. You are confident you wired it correctly, but you acknowledge a small margin for human error. In actual fact, the temperature held steady ($\neg P$), and your wiring is perfect. You are in a position to assess the system's performance based on this setup.

  ### The Sentences

  **(1) If the temperature breached the threshold, the alarm triggered.**
  **(2) If the temperature had breached the threshold, the alarm would have triggered.**

  ### The Check

  **By the speaker's lights, how likely is $Q$ given $P$?**
  Relatively low, or at least not high enough for a flat assertion. The speaker has two live epistemic scenarios in mind where $P$ is true:
  1.  **The Primary Failure:** The voltage spike caused the temperature to rise, and the old primary sensor failed to detect it. (Alarm fails).
  2.  **The Wiring Error:** The temperature rose, the primary sensor failed, but the backup *should* have caught it—except the speaker remembers feeling unsure about the final connection on the wire yesterday. (Alarm fails).
  Because these "failure" worlds are epistemically live (compatible with what the speaker knows), the conditional probability of $Q$ given $P$ is dragged down. Asserting (1) feels like gambling with expensive inventory.

  **What is the closest $P$-world?**
  The closest world where the temperature breaches the threshold is one where the voltage spike was slightly stronger, but *everything else about the actual morning remains fixed*. Crucially, in the actual world, the wiring is perfect. In the closest $P$-world, the wiring is still perfect (because changing the wiring requires a bigger departure from reality than just changing the voltage). Therefore, in the closest $P$-world, the backup activates, and $Q$ is true. This makes (2) intuitively true.

  **The Gap:** The indicative quantifies over *epistemically accessible* worlds (which include wiring errors). The counterfactual quantifies over *metaphysically closest* worlds (which hold fixed the actual fact of correct wiring).

  ### The Single Feature Dial

  **The dial is: Epistemic Uncertainty about the Actual Mechanism.**
  *   **Turn it down (Certainty):** If the speaker had tested the wiring and *knew* it was perfect, the "Wiring Error" scenario vanishes from the epistemic domain. The indicative (1) becomes assertable, and the split disappears.
  *   **Turn it up (Ignorance):** If the speaker had no idea if the backup was even installed, the "Wiring Error" becomes the default assumption. The closest world might still have the backup (if it's actually there), but the speaker can no longer assert (2) with confidence. The split collapses because neither is assertable.
  *   **The Sweet Spot:** The split only exists when the mechanism is *actually* robust (making the counterfactual true) but *epistemically* shaky (making the indicative risky).

  ### Two Objections

  **Objection 1: The Unified Selection Function.**
  *Critique:* A skeptic might argue there is only one selection function for both conditionals, restricted by the speaker's information. Since the speaker's information leaves open the possibility of a wiring error, the "closest" worlds for *both* sentences should include wiring errors.
  *Response:* This begs the question against the semantic distinction. The counterfactual morphology ("had/would") signals a shift from an epistemic domain to a metaphysical one. If the selection function were truly identical, we would never see the "Reverse Oswald" split. My case demonstrates that the domain of quantification *does* shift: indicatives track what is compatible with knowledge; counterfactuals track what is compatible with actual history.

  **Objection 2: Probabilistic Similarity.**
  *Critique:* Some theorists argue that "closeness" is partly determined by probability. If a wiring error is epistemically probable, isn't the world with the error "closer" than the world without it?
  *Response:* No. Epistemic probability is not metaphysical similarity. A world where I made a mistake yesterday is *epistemically* possible, but it is *metaphysically* distant because it requires changing an actual fact (the successful wiring). My case relies on the distinction between "worlds I think are possible" and "worlds that are like this one." If you conflate them, you cannot explain why (2) sounds better than (1).

  ### Assertability vs. Falsity

  **(1) is merely unassertable, not strictly false.**
  To claim it is *false*, you must assume the Stalnakerian view that there is a unique closest world in the epistemic domain, and in that world, the alarm fails. To claim it is *unassertable*, you only need to assume that the speaker's evidence doesn't rule out failure worlds sufficiently to warrant a flat assertion. The latter is safer; the speaker *could* be right (the alarm might have triggered), but they aren't in a position to *say* it given their uncertainty. (2), however, is true because the actual facts anchor the closest world.
