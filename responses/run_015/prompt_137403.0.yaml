prompt: |-
  I teach a graduate seminar in decision theory, and last week I put the following on the board as a five-minute warm-up, expecting to knock it down in the same five minutes. I did not knock it down, and neither did the room. I would be grateful for a diagnosis from someone with no stake in my answer.

  Set-up. Fix an agent with a prior P over a finite set of states S, a finite set of acts A, and a utility function u on act-state pairs. For a cost-free signal with realizations e in E and likelihoods P(e|s), write

  U* = max over a in A of the sum over s of P(s)u(a,s)

  and

  U*(E) = the sum over e of P(e) times [max over a of the sum over s of P(s|e)u(a,s)],

  and say that the value of the signal is V(E) = U*(E) − U*.

  (1) Good's theorem: V(E) is non-negative for every signal, and equals zero only if some act that is optimal before the signal remains optimal under every posterior P(s|e) with P(e) > 0.

  (2) The proof is one line, and it seems to leave no room for exceptions. Among the signal-contingent policies open to the agent is the constant policy: perform the ex ante optimal act a* whatever e comes up. That policy is worth exactly U*. Maximizing over a set that contains a policy worth U* cannot yield less than U*. So the most that information can do is let you do better where doing better matters, and it cannot make you worse off.

  (3) The standpoint of the comparison in (1) is the ex ante standpoint, the standpoint of the agent deciding whether to acquire the signal. But that is the only standpoint from which a decision can be assessed: to assess a choice afterwards, by the lights of the agent one has become, would ratify every self-transformation whatever, simply because the transformed agent approves of it. So if information is non-negatively valuable ex ante, it is valuable, full stop, and the agent who has it has no complaint.

  (4) Hence it is never rational to decline cost-free information. And the agent who declines it, or who later wishes she had not learned what she learned, is making an error — not a tragic or forgivable one, but the same error as refusing a free improvement. There is no coherent 'right not to know'; there is only a right to be protected from people who act on information one does not have.

  (5) The obvious replies to (4) fail, because the two things they point at are not changes in the decision problem at all; they are consequences inside it. Consider Ada. A letter is on its way, containing the result of a screening she can no longer prevent; she can only open it or burn it unread. The test is perfectly reliable, there is no treatment, and her prior that it is positive is 0.4. (i) If she learns she is positive she will, as a matter of psychological fact that she now knows, lose the capacity to take pleasure in anything for the rest of her life; the grief is caused by the knowledge, not by the condition, which is asymptomatic. (ii) She is under a legal duty to disclose a positive result to her insurer, who will then cancel her policy. If she is positive she can also rearrange her affairs — work, money, family — in ways that are better by her own ex ante lights conditional on being positive. Now fix u as of the ex ante standpoint: the utility function she has now, which ranks being-a-grief-stricken-person-who-knows, and being-a-person-whose-insurance-was-cancelled, exactly where she now ranks them. Fix A as her present act set. Then (i) and (ii) are consequences attaching to states, already priced in u; the probability that the letter says 'positive' is 0.4 and is not affected by anything Ada does; the grief and the cancellation follow from what the letter says. So nothing in the decision problem changes when the envelope is opened, which is exactly what (1) requires. Ada should open it, and she should open it for the reason the theorem gives: the flexibility is worth something and the rest is already in the price.

  (6) And (5) generalizes. Whatever learning does to you — your moods, your options, what other people then do to you — it does inside a decision problem whose utility function and act set are fixed at the time of the decision whether to learn. So the more that learning changes you, the more decision-relevant it is, and by (1) and (2) the more valuable it is. The apparent counterexamples to (4) are the cases where the theorem bites hardest.

  (7) So: Ada is irrational if she burns the letter; her physician should urge her not to; anyone who says 'I wish I had never found out' is confused; the reader who avoids spoilers is making a mistake; and the institutional practice of honouring refusals of information in medicine and genetics is not a protection of the patient's interests at all, and must be justified, if at all, by something else entirely.

  I do not believe (7). But I do not want to give up much to escape it. I want to keep (1): it is a theorem, and the one-line proof in (2) is the clearest thing in the subject. I want to keep (3), at least for the ordinary run of cases. And I want to keep that Ada's refusal can be rational in the way a competent refusal of treatment is rational, not merely excusable.

  That leaves (4), (5) and (6). Tell me which step is doing work it is not entitled to do, why the step looked sound when I wrote it on the board, and what each of the remaining ways out would cost me. Three things in particular. First: if (5) is where it breaks, I need to be told what the objects of Ada's utility are supposed to be, since that is where my colleague will press hardest, and whether the right response is to generalize Good's theorem to signals whose payoffs depend on the signal, or to concede that its scope is narrower than it is usually advertised to be. Second: I suspect the grief case and the disclosure case do not break in the same way — one seems to remove the constant policy by changing payoffs, the other by removing an act — and if they differ, I would like that spelled out and priced separately. Third: if the only real flaw is in (3) or (4), then say so plainly, and tell me what I am left able to say about the right not to know.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User and the Request:**
      *   **User:** A graduate seminar instructor in decision theory.
      *   **Context:** They presented a "warm-up" argument deriving strong normative conclusions from Good's Theorem (value of information is non-negative). They got stuck, the room got stuck. They want a diagnosis from an impartial observer.
      *   **Goal:** They want to preserve Good's Theorem (1 & 2) and the ex ante standpoint (3). They want to reject the strong conclusion (7) that refusing information is *always* irrational. They specifically want to know which step ((4), (5), or (6)) fails, why it looked sound, and the costs of fixing it.
      *   **Specific Questions:**
          1.  If (5) breaks, what are the objects of utility? Generalize Good's theorem or narrow scope?
          2.  Do the grief case (psychological impact) and disclosure case (strategic/external impact) break differently?
          3.  If the flaw is in (3) or (4), what does that leave regarding the "right not to know"?

  2.  **Deconstruct the Argument:**
      *   **(1) Good's Theorem:** $V(E) \ge 0$. Standard decision theory result. $U^*(E)$ is the expected utility of acting optimally *after* seeing the signal. $U^*$ is the expected utility of acting optimally *before*. Since the set of contingent plans includes the constant plan (ignore signal, do ex-ante optimal act), $U^*(E) \ge U^*$.
      *   **(2) Proof:** Correct. Maximization over a larger set (contingent plans) yields at least as much as optimization over a subset (constant plans).
      *   **(3) Standpoint:** Ex ante assessment is the only rational standpoint. Ex post assessment ratifies everything.
      *   **(4) Normative Leap:** Therefore, it is *never* rational to decline cost-free information. Refusal is an error.
      *   **(5) Application to Ada:** Ada's case (grief, insurance) is internal to the decision problem. Utility function $u$ and act set $A$ are fixed ex ante. Opening the letter is just acquiring a signal. Therefore, she should open it.
      *   **(6) Generalization:** Any change caused by learning is just a state-dependent consequence.
      *   **(7) Conclusion:** Refusing info is irrational. Medical ethics regarding "right not to know" is unjustified (or needs non-patient-interest justification).

  3.  **Identify the Weak Points:**
      *   **Good's Theorem (1 & 2):** Mathematically sound *within its assumptions*. The assumptions are: Fixed state space $S$, Fixed act set $A$, Fixed utility function $u$ over outcome-state pairs, Bayesian updating, Cost-free signal.
      *   **Step (5) & (6):** This is where the modeling meets reality. The argument claims that "grief" and "insurance cancellation" are just consequences attached to states in the fixed utility function.
      *   **Step (4):** This is the normative leap from "maximizes expected utility" to "rational."

  4.  **Diagnose Step (5) - The Modeling Assumption:**
      *   *The Grief Case:* The argument says grief is a consequence priced in $u$.
          *   *Problem:* If learning the signal *changes* the utility function itself (e.g., depression makes all $u(a, s)$ lower, or changes preferences entirely), Good's Theorem doesn't apply directly because $u$ is no longer fixed.
          *   *Refinement:* If the grief is just a "bad outcome" (like pain), it can be modeled in $u$. If the grief destroys the *capacity* to maximize utility (changes the agent), that's different.
          *   *Crucial Distinction:* Is the utility function $u$ defined over *world states* or *agent-state pairs*? If $u$ is fixed ex ante, it must account for the psychological state of the agent *after* learning. If the agent ex ante knows "If I learn X, I will be depressed," that depression is an outcome. Good's theorem holds *if* the agent can still choose acts optimally given that depression.
          *   *Wait, there's a deeper issue:* Good's theorem assumes the agent *updates* and then *chooses*. If the signal changes the agent's *ability to choose* (e.g., paralysis by grief), the set of available acts $A$ might shrink *after* the signal. Good's theorem assumes $A$ is fixed. If $A_e$ (acts available after signal $e$) is a subset of $A$, then $U^*(E)$ could be less than $U^*$.
      *   *The Insurance Case:* The argument says disclosure is a consequence priced in $u$.
          *   *Problem:* This involves *other agents*. Standard decision theory treats others as states of nature. But if the *act of observing* changes the game (e.g., by triggering a duty to disclose), it might look like a change in the constraint set.
          *   *Refinement:* If the duty to disclose is a known rule, it's part of the state-consequence mapping. $P(\text{cancel} | \text{positive, know}) = 1$. This *can* be modeled in the fixed framework.
          *   *However:* If the act of *looking* triggers the duty, but *not looking* avoids it, then the act "Look" has different consequences than "Don't Look" beyond just information. The cost of the signal is not zero. The prompt says "cost-free signal." If looking triggers insurance cancellation, is it cost-free? The prompt says "cost-free signal... likelihoods P(e|s)." Usually, "cost-free" means no resource cost. But if the *content* triggers a penalty that wouldn't exist if you remained ignorant, that's an informational externality.
          *   *Key Insight:* Good's Theorem assumes the signal does not *causally affect* the state or the payoffs, only the agent's belief. If the signal realization *causes* a change in the world (e.g., "Insurer finds out you know"), it's not a passive observation. It's an act with causal consequences.

  5.  **Diagnose Step (4) - The Normative Leap:**
      *   Even if the math holds, does "maximizes ex-ante expected utility" equal "rational"?
      *   If the agent has a preference for ignorance (tastes), standard theory says satisfy the taste. If the taste is for *not knowing*, then $u$ must reflect that.
      *   If $u$ reflects a desire not to know, then $U^*(\text{Don't Look}) > U^*(\text{Look})$. But Good's theorem says $U^*(\text{Look}) \ge U^*(\text{Ignore Signal})$.
      *   *Contradiction?* No. "Ignore Signal" means you have the signal but don't use it. "Don't Look" means you don't get the signal.
      *   If getting the signal *itself* causes disutility (anxiety while waiting, or the mere fact of knowing), that is a cost. The prompt specifies "cost-free." If "cost-free" excludes psychological costs of possession, the model is misspecified.

  6.  **Synthesize the Diagnosis:**

      *   **The Core Flaw:** It lies in **Step (5)** and **Step (6)**, specifically in the assumption that the *structure* of the decision problem (specifically the act set $A$ and the causal independence of the signal) remains invariant between the "Look" and "Don't Look" branches.
      *   **Why it looked sound:** It treats "learning" as a purely epistemic update. In many textbook cases, it is. In Ada's cases, learning is a *physical event* with causal ramifications beyond belief updating.
      *   **The Grief Case (Psychological):** If grief reduces the *capacity to act* (shrinks $A$) or changes the *utility function* ($u$ becomes $u'$), Good's theorem conditions are violated. If grief is just a "bad feeling" included in $u$, Good's theorem holds, and she should look (unless the "cost-free" assumption is violated by the psychic cost of knowing).
      *   **The Insurance Case (Strategic):** This is a violation of the "cost-free" or "passive signal" assumption. If knowing triggers a duty that not-knowing avoids, the signal has a *causal cost*. It's not just information; it's an act that changes the state of the world (from "uninformed patient" to "informed patient liable for disclosure").
      *   **Step (4):** This is also vulnerable. It conflates *instrumental rationality* (maximizing given $u$) with *substantive rationality* (is $u$ coherent?). But the stronger break is in the modeling of the problem in (5).

  7.  **Drafting the Response:**

      *   **Acknowledge the strength:** Good's theorem is robust *within its domain*. The proof is correct.
      *   **Pinpoint the break:** Step (5) is the primary culprit, supported by a subtle equivocation in "cost-free" in the setup. Step (4) is the secondary culprit (normative overreach).
      *   **Address Specific Question 1 (Utility Objects):** If (5) breaks, $u$ must be defined over *trajectories* that include the epistemic state. But more importantly, the *availability of acts* ($A$) must be allowed to depend on the signal.
      *   **Address Specific Question 2 (Grief vs. Insurance):**
          *   *Grief:* Threatens the stability of $u$ or the capacity to execute $A$. If $u$ changes, Good's theorem doesn't apply. If capacity shrinks ($A_e \subset A$), Good's theorem doesn't apply.
          *   *Insurance:* Threatens the "cost-free/passive" assumption. The signal is an *intervention*.
      *   **Address Specific Question 3 (Right to Know):** If we fix (5), we can say refusing info is rational when the signal is causally potent (changes $A$ or $u$) or when "ignorance" is a direct argument in $u$ (making the signal not cost-free).

  8.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check the "Cost-Free" definition.* The prompt defines cost-free as "cost-free signal." Usually, this means no resource cost. It implicitly assumes the signal doesn't change the world.
      *   *The "Constant Policy" Trick:* The proof relies on the ability to ignore the signal. In the Insurance case, can Ada "ignore" the signal? If she reads it, she *knows*. The duty to disclose is triggered by *knowledge*, not by *acting on knowledge*. So she cannot play the "constant policy" of "Act as if I don't know" because the insurer punishes *knowing*. The set of available acts *after* seeing 'Positive' does *not* include "Keep Insurance." The set of acts *after* not looking *does* include "Keep Insurance." Thus $A_{\text{look}} \neq A_{\text{dont\_look}}$. Good's theorem assumes fixed $A$.
      *   *The Grief Case:* If grief makes her unable to enjoy anything, does it change $u$? If $u$ is fixed ex-ante, it assigns low value to "Being Grief-Stricken." Good's theorem says: Compare (Look + Optimize given grief) vs (Don't Look). If "Don't Look" avoids grief, and grief is terrible, $U^*(\text{Don't Look})$ might be higher. But Good's theorem compares $U^*(E)$ vs $U^*(\emptyset)$. $U^*(E)$ includes the grief cost. If the grief cost is high enough, $U^*(E)$ could still be lower than $U^*(\emptyset)$? **NO.** Good's theorem says $U^*(E) \ge U^*$. $U^*$ is the max EU *without* the signal. If the signal *causes* grief, that grief must be modeled as a cost of *acquiring* the signal. If it's a cost of acquisition, it's not "cost-free."
      *   *Conclusion:* The setup "cost-free signal" is doing illicit work. It assumes the signal has no causal impact on utility other than through act selection. Ada's cases violate this.

  9.  **Finalizing the Structure:**
      *   **Diagnosis:** Step (5) is the break point. It misdescribes the decision problem.
      *   **Why it looked sound:** Confusion between *epistemic* updates and *ontic* changes.
      *   **Q1 (Utility/Scope):** Utility must be over paths including epistemic states. Scope is narrower: applies only to *passive* information.
      *   **Q2 (Grief vs. Insurance):**
          *   Insurance: Violates fixed Act Set ($A$). Knowing removes the act "Maintain Insurance."
          *   Grief: Violates fixed Utility ($u$) or "Cost-Free" assumption. If grief is a consequence, it's a cost.
      *   **Q3 (Right to Know):** Rational to refuse when information is causally potent or when ignorance is intrinsically valued (making info not cost-free).

  10. **Tone:** Respectful, rigorous, acknowledging the instructor's expertise while pointing out the category error. (Use "you" to address the instructor).

  11. **Check against constraints:** "Three things in particular." Ensure all three are answered explicitly.

      *   *Constraint 1:* Objects of utility? (Paths/Epistemic states). Generalize or narrow? (Narrow scope).
      *   *Constraint 2:* Grief vs. Disclosure difference? (Yes, $u$/$A$ vs. Causal Cost/Act Set).
      *   *Constraint 3:* Flaw in (3)/(4)? (Mostly (5), but (4) overextends normativity). What about right to know? (It's a right to avoid causal harm or respect intrinsic preference).

      *Wait, one nuance on Good's Theorem:* Good's theorem *does* allow $V(E) = 0$. It doesn't strictly say $V(E) > 0$. But the argument claims refusing is an *error*. If $V(E)=0$, indifference is allowed. But the argument claims strict preference for info.
      *Actually, the main issue is that for Ada, $V(E)$ as calculated by Good might be positive, but the *actual* value of the act "Open Letter" is negative because the model in (5) fails to capture the costs.*
      *Wait, if the model in (5) includes the grief in $u$, then Good's theorem says $U^*(E) \ge U^*$. This implies she should open it. Why?*
      *Because $U^*$ is the max EU *without* the signal. If "Without Signal" implies "Without Grief," and "With Signal" implies "With Grief," then the comparison is between two different utility functions or two different state spaces.*
      *Ah, here is the precise technical failure:* Good's Theorem compares $E[\max_a E[u(a,s)|e]]$ with $\max_a E[u(a,s)]$. Both use the *same* $u$. If $u$ includes "being informed" as a bad state, then the calculation *should* yield a negative value for information *if* "being informed" is a consequence of the signal.
      *But Good's theorem assumes the signal *itself* doesn't change $u$. It assumes $u(a,s)$ is the same whether you know $s$ or not.*
