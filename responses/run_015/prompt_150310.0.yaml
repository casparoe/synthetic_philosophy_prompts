answer: |-
  # Joint Statement on Cultural Transmission and Evolutionary Dynamics

  ### 1. Agreed Claims and Concessions

  1.  **Definition of "Darwinian":** We agree that a process is minimally Darwinian if it exhibits three properties: (a) variation among individuals in a population, (b) differential success (some variants spread more than others), and (c) heritability (successive variants resemble their predecessors more than chance). We disagree on whether high-fidelity replication is a necessary condition for (c) to produce cumulative adaptation, but we agree that low-fidelity transmission can produce change that *looks* Darwinian in the short term.
  2.  **Uncontested Facts of Transmission:** We agree that cultural transmission is never perfect copying. Every transmission event involves reconstruction by a human mind. We agree that cognitive biases (what is easy to remember, infer, or find salient) shape these reconstructions. We agree that some cultural items spread vastly further than others, and that this spread is not random.
  3.  **Role of the Medium:** We agree that the storage medium (brain, video, text) constrains fidelity. External storage (writing, video) increases fidelity compared to oral gestural transmission, but does not guarantee it, as interpretation is still required.
  4.  **Memeticist Concession:** We concede that "copying" is a metaphor for a psychological process of reconstruction. We acknowledge that if cognitive attractors are strong enough, they can override lineage history, making phylogenetic methods inappropriate for certain domains.
  5.  **Attraction Theorist Concession:** We concede that lineage effects exist. In some domains, the history of transmission matters independently of immediate cognitive biases, allowing for cumulative complexity that cannot be explained by reconstruction alone. We acknowledge that selectionist models can be useful predictive tools even if the underlying mechanism is transformational.

  ### 2. Table of Remaining Disagreements

  | Issue | Memeticist Formulation | Attraction Theorist Formulation | Verbal or Substantive? |
  | :--- | :--- | :--- | :--- |
  | **The Unit** | The "meme" is a replicator that retains identity across transmissions despite noise; it is the thing being selected. | The "public representation" is a transient trigger for cognitive reconstruction; identity is an illusion created by stable attractors. | **Mostly Verbal.** Disagreement hinges on whether "identity" requires physical fidelity or functional stability. |
  | **The Mechanism** | Change is driven by selection acting on random variation; successful variants are *copied* more often. | Change is driven by transformation toward cognitive attractors; successful variants are *reconstructed* more reliably. | **Substantive.** Disagreement hinges on whether variation is blind (selection) or directed (transformation). |
  | **Fidelity Threshold** | Low-fidelity copying is sufficient for evolution if the population size is large enough to average out noise. | Below a certain fidelity threshold, selection cannot accumulate complexity; the process is merely drift toward attractors. | **Substantive.** Disagreement hinges on empirical thresholds for cumulative adaptation. |
  | **Explanation of Success** | A variant succeeds because it possesses properties that make it a better replicator (fitness). | A variant succeeds because it matches pre-existing cognitive biases (attractiveness). | **Verbal.** "Fitness" and "Attractiveness" may be mathematically equivalent in models, but imply different causal arrows. |

  ### 3. The Three Cruxes: Tests and Predictions

  **Crux 1: The Fidelity-Threshold (Medium-Swap)**
  *   **Case/Measurement:** Compare two chains of transmission for the same complex information (e.g., a origami pattern or a melody). Chain A is transmitted purely by observation (video only, no instructions). Chain B is transmitted with an exact external template (diagrammatic notation or code). Measure phylogenetic signal (tree-likeness) and cumulative complexity over 50 generations. *[Note: Existing experimental data is suggestive but not definitive on the complexity threshold; this proposes a controlled longitudinal trial.]*
  *   **Memeticist Prediction:** Chain B will show significantly stronger tree-like divergence and higher cumulative complexity than Chain A. Chain A will degrade or stagnate. High fidelity changes the *kind* of process by enabling selection to outpace drift.
  *   **Attraction Theorist Prediction:** Both chains will converge on similar forms determined by cognitive/motor attractors. Chain B will drift slower, but will not show true cumulative complexity beyond what the attractor allows. High fidelity changes only the *rate*, not the direction or kind.

  **Crux 2: The Identifiability (Ex-Ante Fitness)**
  *   **Case/Measurement:** Take 100 variants of a cultural item (e.g., headline styles or dance moves). Measure their structural properties and cognitive salience features *before* exposure to a population. Release them into a controlled network. Measure success (spread).
  *   **Memeticist Prediction:** Success can be predicted by the variant's intrinsic properties (fitness) interacting with the environment. We can identify the "fittest" variant before transmission begins based on replicative potential.
  *   **Attraction Theorist Prediction:** Success is largely retrospective. Variants are individuated by where they land in conceptual space. Prediction is possible only insofar as we map the attractor landscape, not the variant's lineage potential. Variants will cluster around attractors regardless of initial frequency.
  *   **Substantive Difference:** Whether the unit of selection is defined by its history (lineage) or its destination (attractor basin).

  **Crux 3: The Release (Reversion vs. Drift)**
  *   **Case/Measurement:** Identify a cultural trait maintained by a specific selection pressure (e.g., a ritual gesture rewarded by social status, or a technical skill rewarded by efficiency). Remove the pressure (stop rewarding the status, or automate the efficiency). Observe the trait over subsequent generations. *[Note: This is a hypothetical longitudinal intervention; natural experiments are rare.]*
  *   **Memeticist Prediction:** The trait will drift or go extinct, but modifications accumulated during the selection phase will persist due to historical inertia (phylogenetic constraint). It will not necessarily revert to a baseline.
  *   **Attraction Theorist Prediction:** The trait will revert toward the cognitive attractor baseline. Accumulated modifications that were not supported by cognitive biases will be shed rapidly once selection pressure is removed.

  ### 4. Application to the Dance Routine

  **Joint Statement:**
  The fifteen-second dance routine exhibits patterns explainable by both frameworks: it spreads through a population via differential success, where versions with simplified openings and legible final gestures are transmitted more frequently than complex alternatives. The Memeticist interprets this as selection for copyability, where high-fidelity variants outcompete low-fidelity ones in a noisy environment. The Attraction Theorist interprets this as transformation toward motor-cognitive attractors, where each dancer reconstructs the routine to fit what is easiest to remember and execute. Both agree that the routine is not copied exactly, that it changes over time, and that the versions traveling furthest are those best aligned with human cognitive and motor constraints. The disagreement remains on whether the "simplification" is a historical accumulation of lucky copies (Memetics) or an inevitable convergence toward a psychological baseline (Attraction).
