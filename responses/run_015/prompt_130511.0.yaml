  ok so ive been thinking about split-brain cases and this whole unity of consciousness debate that philosophers keep recycling. everyone knows the classic sperry/gazzaniga split-brain stuff but im tired of the same old left-brain-interpreter vs silent-right-partner narrative. what i actually want to know is which open questions in this area are upstream — the ones that, if you settled them, would collapse a bunch of downstream arguments about personal identity, phenomenal unity, or even how we think about AI consciousness.

  specifcally, there's this distinction people rarely draw between synchronic fragmentation (two conscious streams running in parallel right now) and diachronic arbitration failure (the hemispheres cant build a shared narrative over time, even if theyre not literally double-conscious at every instant). then theres the weird possibility that split-brain patients develop covert interhemispheric 'spying' — one hemisphere learning to decode the others motor outputs to maintain a fake unity. i dont know if thats well established but it feels like a live line.

  so heres the ask: if you were advising a philospher or cognitive scientist with about three years and no wet-lab access, which of these open questions — or others im missing — should they prioritize? rank them, defend the ordering, and tell me whats overrated. im especially interested in which ones matter for building a theory of consciousness that isnt just armchair, and which are dead ends people keep citing from old textbooks. please keep it practical — no bibliography, no 'read these five papers' lists, just the reasoning about what deserves the effort and why.
