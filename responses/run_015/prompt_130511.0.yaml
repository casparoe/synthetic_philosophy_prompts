answer: |-
  This is a sharp framing. You've correctly identified that the "two persons vs. one person" debate is a downstream metaphysical mess caused by upstream ambiguity about what *constitutes* a unity in the first place. If you have three years and no wet-lab access, you cannot solve the neural binding problem. You *can* solve the functional and conceptual architecture problem.

  Here is the ranking of open questions you should prioritize, ordered by their leverage to collapse downstream debates about identity and AI.

  ### 1. The Diachronic vs. Synchronic Unity Hypothesis
  **Priority:** Critical
  **Why it's upstream:** Almost all split-brain literature assumes the relevant metric is *synchronic* unity (are both hemispheres conscious of the same stimulus *right now*?). Your intuition about *diachronic* arbitration is the key. If consciousness is fundamentally a narrative process that stitches discrete states over time (a "temporal glue"), then split-brain patients don't necessarily have two simultaneous streams; they may have one stream that frequently crashes or fails to save state.

  If you settle this, you dissolve the "two persons" problem. A system that fails to integrate information over time isn't necessarily *two* systems; it might be one fragmented system. This matters for AI: do we need a unified global workspace (synchronic), or just a robust logging mechanism that ensures continuity (diachronic)?

  **Practical Approach (No Lab):**
  *   **Meta-analysis of behavioral latency:** Look for existing data on reaction times in conflict tasks. If the hemispheres were truly independent synchronous agents, conflict resolution should look like a game-theoretic negotiation (slow, strategic). If it looks like a system error or a reboot (chaotic, variable latency), that supports diachronic failure.
  *   **Conceptual modeling:** Build a computational model of a "narrative integrator." Simulate a system that only unifies data retrospectively. See if you can reproduce split-brain behavioral deficits (like the left hand undoing the right) without positing two distinct "subjects," but rather one subject with a broken commit log.

  ### 2. The Functional Role of Cross-Cuing (The "Spying" Mechanism)
  **Priority:** High
  **Why it's upstream:** You mentioned covert spying; in the literature, this is "cross-cuing." The standard view treats this as a confound (patients cheating on tests). The better view is that this *is* the mechanism of unity. If unity is achieved via active inference (one hemisphere modeling the other's output to predict state), then unity is a *skill*, not a structural given.

  This collapses the debate on whether the corpus callosum *creates* consciousness. It suggests the callosum just increases bandwidth; the *work* of unity is done by predictive modeling. For AI, this implies you don't need perfect hardware integration to get "conscious" behavior; you just need modules good at predicting each other's I/O.

  **Practical Approach (No Lab):**
  *   **Information Theoretic Analysis:** Treat the hemispheres as black boxes. Use existing behavioral data to calculate the mutual information between left-hand and right-hand actions over time. If "unity" correlates with high mutual information achieved through slow channels (behavior) rather than fast channels (callosum), you've proven unity is an active reconstruction.
  *   **Philosophy of Action:** Analyze cases where cross-cuing fails. Does the patient report alienation (alien hand syndrome)? If alienation correlates with the *failure* of the predictive model, not the *presence* of a second agent, you shift the criterion for identity from "substrate" to "predictive success."

  ### 3. The Granularity of the "Interpreter"
  **Priority:** Medium-High
  **Why it's upstream:** The "Left Hemisphere Interpreter" is often reified as a little man in the left brain. This is a dead end. The upstream question is: Is the interpreter a *module* or an *output format*? If it's an output format (a compression algorithm for memory), then split-brain patients have one algorithm trying to compress two incompatible data streams.

  This matters for AI alignment. If the interpreter is just a compression function, AI doesn't need to be "honest" to be unified; it just needs to be consistent in its compression.

  **Practical Approach (No Lab):**
  *   **Linguistic Analysis:** Analyze transcripts of split-brain patient verbal reports. Look for markers of confabulation vs. genuine uncertainty. If the "interpreter" is a compression algorithm, errors should look like data loss artifacts (smoothing over gaps), not deliberate lies.
  *   **Comparative Architecture:** Compare split-brain confabulation with healthy human memory errors (e.g., change blindness). If the mechanisms are identical, the "interpreter" is just standard human cognition operating on restricted data, not a special agent.

  ### What is Overrated / Dead Ends
  **1. The "Two Persons" Verdict:**
  Stop trying to answer "Are there two people?" It's a category error. "Person" is a legal and social construct, not a natural kind. Debating this is armchair theology. Focus on "How many *centers of narrative gravity* are there?" or "How many *independent goal hierarchies*?" These are measurable; "personhood" is not.

  **2. Phenomenal Unity as a Binary:**
  Philosophers love to ask, "Is the phenomenology unified?" as if it's a light switch. It's not. It's a spectrum of integration. Assuming it's binary forces you into the "one vs. two" trap. Treat unity as a variable (like bandwidth or latency). This makes the theory compatible with AI, which will likely have variable unity.

  **3. The Corpus Callosum as the "Seat of Unity":**
  Focusing on the anatomy is a trap for a non-lab researcher. Patients with callosotomies often regain functional unity over time (via cross-cuing). If unity returns without the structure, the structure wasn't the necessary condition. Don't waste time on the anatomy; focus on the *function* that the anatomy used to support.

  ### Why This Ordering Collapses Downstream Debates

  If you prioritize **Diachronic Unity (#1)** and **Cross-Cuing as Active Inference (#2)**, you achieve the following:

  1.  **Personal Identity:** You move the goalpost from "substance" (how many souls/minds) to "process" (how well is the narrative stitched?). This solves the fission/fusion puzzles in philosophy of mind. If identity is diachronic continuity, split-brain is just a case of degraded continuity, not duplicated identity.
  2.  **AI Consciousness:** You avoid the trap of thinking AI needs a "homunculus" to be conscious. Instead, you argue that AI needs a robust *diachronic integration protocol*. If an LLM can maintain a consistent narrative state across contexts (even if parallel processing occurs), it meets the functional criteria for unity derived from the human case.
  3.  **Phenomenology:** You explain why patients *feel* unified in daily life (diachronic stitching works well enough) but fail in the lab (synchronic demands exceed bandwidth). This saves the phenomenon without positing magic.

  ### The 3-Year Plan
  *   **Year 1:** Formalize the Diachronic Unity model. Write the papers distinguishing "simultaneous consciousness" from "narrative continuity."
  *   **Year 2:** Model Cross-Cuing as Predictive Processing. Show how behavioral cues can substitute for neural bandwidth.
  *   **Year 3:** Apply the framework to AI. Argue that "alignment" is essentially solving the cross-cuing problem between human intent and AI execution.

  This approach keeps you out of the wet lab, avoids the metaphysical swamp of "personhood," and gives you a functional theory of consciousness that actually scales to non-biological systems.
