answer: |-
  A hospital compliance board reviews a surgeon's outlier mortality rate using two internal auditors who share identical logs. Truth: Negligence occurred (55% probability given data). Pro argues patterns match negligence; Con argues case complexity. Both tell truth; Pro emphasizes outliers, Con emphasizes covariates. Judge (Board Chair) must sign "Violation" or "No Violation" to close the debate. Pro wins "Violation". Downstream policy: "Violation" triggers automatic suspension (Value: +10 if Guilty, -40 if Innocent); "No Violation" triggers monitoring (Value: -5 fixed). Expected value favors suspension only if P > 70% (50P - 40 > -5). At 55%, suspension loses value (-12.5 vs -5). In non-adversarial review, single auditor tells Chair "55% likelihood". Chair orders monitoring. Debate forces auditors to suppress uncertainty to win the binary vote; lone auditor faces no opponent to weaponize hesitation, so calibration survives Q&A.

  Truth: Negligence occurred (but data was inherently noisy).

  **Load-bearing feature:** The zero-sum incentive to weaponize uncertainty. In debate, admitting <100% confidence hands the opponent a "reasonable doubt" argument; in consultation, admitting uncertainty is data that optimizes decision quality.

  **If removed:** If you remove the adversary (make it cooperative), calibration returns because there is no penalty for hedging. If you keep the adversary but remove the binary verdict (allow probabilistic votes), the case still bites: debaters will still polarize their *arguments* to sway the judge's probability toward 100% or 0%, because the win condition is still relative strength, not absolute calibration.

  **Two Attacks:**
  1.  **Proper Scoring Rule:** Pay debaters based on the accuracy of their stated confidence numbers. *Failure:* This requires ground truth to score the bet. In most oversight cases (e.g., "Is this policy safe?"), ground truth is delayed or unknowable. Even if known later, the immediate incentive to win the binary verdict (promotion/bonus) dominates the deferred scoring rule.
  2.  **Judge Confidence:** Let the judge record a confidence number (e.g., 55%) alongside the verdict. *Failure:* Debate optimizes for *persuasion*, not *calibration*. A skilled debater can make 55% evidence look like 90% evidence. The judge's confidence will reflect rhetorical skill, not the actual evidence weight, so the downstream process still receives a miscalibrated number.

  **Recursive/Cross-examination:** No. Cross-examination allows the opponent to *highlight* uncertainty, but the proponent's incentive remains to *minimize* it in rebuttal. If I admit "I'm only 55% sure" during cross-exam, the opponent uses that admission to argue "They admit doubt; vote No Violation." The structural pressure to polarize survives interrogation.
