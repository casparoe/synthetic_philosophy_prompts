prompt: |-
  hey im putting together a research agenda for a tiny group (like 4 people, 2 years, mix of physics and philosophy) on maxwells demon and the physics of information, and i want to avoid the usual landauer recap loop. one framing im playing with is whether "active information" in a feedback controller — the demon actually measuring and pushing — should be treated thermodynamically different from "passive information" just sitting in a register, and whether that distinction collapses once you look at real biological sensors like bacterial chemotaxis, where measurement and action are coupled in ways the szilard engine model doesnt capture.

  so which open questions in this space actually deserve the groups time? im specifically weighing: (1) whether measurement and erasure costs stay fixed at kT ln 2 when the controller has quantum coherence or non-markovian dynamics, (2) whether predictive coding in biological feedback loops gives us a genuinely different thermodynamic accounting than the standard demon, or if its just the same math with more variables, and (3) whether linking all this to black hole information paradox stuff is upstream for computation thermodynamics or mostly an analogy that sounds deep.

  defend an ordering — not just "these are interesting" but which ones are upstream of others, which are tractable without a full quantum lab, and what kind of result over the next couple years would make you flip the ranking. also be honest about which ones are overrated dead ends that look sexy but wont move the needle for this kind of group. and please dont give me a reading list or citations — im working somewhere with bad access and the point is reasoning, not bibliography.

  (small typo: i keep writing maxwells without the apostrophe, sorry about that)
