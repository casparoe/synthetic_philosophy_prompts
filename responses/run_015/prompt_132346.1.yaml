answer: |-
  Based on the pattern of your verdicts, you distinguish between thought experiments that isolate **formal relations** (which you accept) and those that rely on **narrative contingencies** or **hidden metaphysical premises** (which you reject or distrust). You value cases where the intuitive pull survives the stripping away of emotional coloring and where the logic does not smuggle in the conclusion.

  Here is the principle that formalizes this pattern, its prediction for the Zombie argument, and the necessary revision to your existing verdicts.

  ### The Principle of Invariant Structural Isolation (PISI)

  **Statement:** A thought experiment is epistemically illuminating if and only if the intuitive judgment it elicits remains **invariant** under two transformations:
  1.  **Affective Neutralization:** The substitution of emotionally charged or viscerally specific narrative details (e.g., "pushing," "flesh," "disgust") with neutral functional descriptions, without loss of intuitive force.
  2.  **Narrative Symmetry:** The inversion of the temporal or causal direction of the scenario (e.g., construction vs. deconstruction, origin vs. duplicate), provided the functional relations between components remain constant.

  If the intuitive verdict collapses under either transformation, the thought experiment is classified as **manipulative** (if it relies on affect) or **circular** (if it relies on hidden premises exposed by symmetry).

  ### Application to Your Verdicts

  This principle coherently organizes your existing judgments:
  *   **Trolley Lever:** Passes **Affective Neutralization**. The intuition holds whether described as "saving five" or "killing one," and relies on the structural distinction of redirecting an existing threat. (Verdict: Sound).
  *   **Footbridge:** Fails **Affective Neutralization**. The intuition relies heavily on the visceral nature of "pushing" and physical contact. (Verdict: Manipulative).
  *   **Mary's Room:** Fails **Non-Circularity** (a subset of Structural Isolation). It assumes a distinction between "physical knowledge" and "experience" in the setup to prove that distinction in the conclusion. (Verdict: Bad Pump).
  *   **Swampman:** Fails **Narrative Symmetry**. If we invert the story (start with the duplicate, give it a history), the intuition regarding mental states often shifts, revealing the intuition depends on the *story of origin* rather than the *structure of the state*. (Verdict: Exposes Commitment).
  *   **Experience Machine:** Fails **Affective Neutralization**. The intuition is heavily laden with status-quo bias and the framing of "fake" vs. "real." (Verdict: Ambivalent).

  ### Prediction: The Zombie Conceivability Argument

  **The Case:** We are asked to imagine a being physically identical to a conscious human but lacking all phenomenal experience (qualia), concluding that consciousness is non-physical.

  **PISI Analysis:**
  1.  **Affective Neutralization:** The argument often relies on the "spooky" framing of the lights going out or the "inner movie" stopping. If described purely functionally ("Input-Output Isomorph with Null Qualia Flag"), the conceivability becomes contested by physicalists who argue the description is incoherent.
  2.  **Narrative Symmetry/Logic:** The argument relies on the premise that *conceivability entails metaphysical possibility*. This is a hidden premise, not a structural feature. If we invert the frame (assume physicalism is true, therefore zombies are inconceivable), the intuition collapses. Like Mary's Room, it begs the question: it assumes the separability of the physical and the phenomenal to prove their separability.

  **Prediction:** The Principle of Invariant Structural Isolation classifies the Zombie Argument as **epistemically unsound and rhetorically manipulative**. It predicts that the argument functions identically to Mary's Room (its dual): it feels compelling only because it smuggles the conclusion (dualism) into the premise (conceivability of separation). It does not isolate a structural feature of mind; it isolates a structural feature of our *language* about mind.

  ### The Necessary Overturn

  To maintain the coherence of PISI, one of your verdicts must be overturned. The principle cannot accommodate your assessment of the **Bidirectional Replacement Case**.

  **Your Verdict:** You classify the case as "misleading" (because it presupposes sharp boundaries) but maintain it "exposes a real tension in functionalist commitments."

  **The Overturn:** The Principle of Invariant Structural Isolation dictates that if a thought experiment relies on a false presupposition (in this case, that consciousness must have sharp boundaries), it cannot expose a *real* tension in the target theory (functionalism). It can only expose a tension between the target theory and the **flawed setup**.

  Functionalism explicitly allows for vagueness and gradualism. By constructing a case that forces a binary choice (conscious or not) upon a gradualist theory, you are not testing functionalism; you are testing functionalism's ability to answer a category mistake. Therefore, PISI requires you to retract the claim that the case exposes a "real tension."

  **Revised Verdict:** The Bidirectional Replacement case is **wholly misleading**. It generates an *illusory* tension by imposing crisp boundaries on a vague phenomenon. It offers no diagnostic value regarding functionalism, only regarding our own cognitive discomfort with vagueness. To accept it as exposing a "real tension" is to grant legitimacy to the very presupposition (sharp boundaries) that the principle identifies as the source of the manipulation.
