answer: |-
  Here is the architecture for the ninety-minute session.

  ### 1. The Sequence of Components (Board Work & Dependencies)

  Do not present the puzzle as a narrative block. Build it on the board in four layers. Each layer closes an escape route that your economics students will instinctively try to open.

  *   **Layer 1: The Timeline and Payoffs (Minutes 0–15)**
      *   **Draw:** A two-period timeline. $t_0$ (Midnight), $t_1$ (Morning).
      *   **Stipulate:** Payoff at $t_0$ is contingent *only* on mental state at $t_0$. Payoff at $t_1$ is contingent *only* on physical action at $t_1$.
      *   **Why here:** This establishes the separation of intention and action. If you introduce the cost of the toxin now, they will immediately calculate net utility. You must first establish that the reward is decoupled from the act.
      *   **Dependency:** The puzzle cannot exist unless the reward is secured before the cost is incurred.

  *   **Layer 2: The Rationality Constraint (Minutes 15–30)**
      *   **Write:** "At $t_1$, Utility(Drink) < Utility(Not Drink)."
      *   **Stipulate:** Preferences are stable. No new information arrives between $t_0$ and $t_1$. No commitment devices available.
      *   **Why here:** This pre-empts the time-inconsistency and hyperbolic discounting objections. You are forcing them to accept that at $t_1$, drinking is strictly dominated.
      *   **Dependency:** This must be established before discussing intention. If they think preferences might change, they will think one *can* intend to drink because one expects to be irrational later.

  *   **Layer 3: The Nature of Intention (Minutes 30–45)**
      *   **Write:** "Intention $\neq$ Prediction" and "Intention $\neq$ Desire."
      *   **Stipulate:** To intend $X$, you must believe there is a sufficient reason to $X$. (This is the philosophical premise, but state it in terms of 'conditions for rational planning').
      *   **Why here:** This is the crux. Econ students treat intention as a cheap-talk signal or a probabilistic forecast. You must block the view that "I intend to drink" just means "I predict a 60% chance I will drink."
      *   **Dependency:** This depends on Layer 2. Because there is no reason to drink at $t_1$ (Layer 2), there can be no intention at $t_0$ (Layer 3).

  *   **Layer 4: The Fork (Minutes 45–60)**
      *   **Draw:** The contradiction.
          *   Path A: To get the money, I must intend.
          *   Path B: To intend, I must see a reason to drink.
          *   Path C: There is no reason to drink.
      *   **Why here:** Only now do you reveal the puzzle. If you reveal it earlier, they will try to solve it by attacking Layer 1 or 2. By building the constraints first, you force the contradiction into the concept of intention itself.

  ### 2. The Carrying Case: Toxin vs. Substitute

  **Recommendation:** Keep the **Toxin**. Do not sanitize it.

  *   **Why:** Your audience is in economics and psychology. They are trained to look for marginal gains. If you substitute the toxin with a "tedious task" or an "abstract cost," they will implicitly assign a probability that the task is negligible or that completing it yields hidden utility (signaling, pride). The visceral unpleasantness of the toxin is required to make the "no reason" clause credible.
  *   **What it must contain:**
      *   **Explicit Negative Utility:** The stipulation must state that the experience is *intrinsically* disvaluable.
      *   **Isolation:** State clearly that the toxin has no symbolic value, no health benefits, and no curiosity value.
  *   **What it must lack:**
      *   **Uncertainty:** Remove any doubt about the severity. "Thoroughly wretched" is good; keep it.
      *   **Moral Valence:** Ensure it is not framed as "harmful" in a moral sense, only prudential. This prevents deontological objections.
  *   **Crucial Adjustment:** You must add a stipulation to your current set-up: *"You derive no utility from being the sort of person who keeps intentions, and no disutility from breaking them."* This blocks the "I value my integrity" counter-argument which is common among high-achievers.

  ### 3. Misconceptions: Order and Management

  Anticipate these in this specific order. Do not answer them fully; park them on a "Parking Lot" section of the board and refer back to the stipulations.

  1.  **The Commitment Device (Minute 20)**
      *   *Objection:* "I hire a enforcer to make me drink."
      *   *Diagnosis:* Category Error. This changes the payoff structure at $t_1$.
      *   *Management:* Head this off at **Layer 2**. Explicitly state: "No external enforcement is available." If raised later, point to Layer 2.
  2.  **Time Inconsistency / Weakness of Will (Minute 35)**
      *   *Objection:* "I intend now because I know I'll be irrational later."
      *   *Diagnosis:* Partial Insight. It recognizes the temporal gap, but misunderstands the rationality constraint.
      *   *Management:* Refer to **Layer 2**. "We have stipulated preferences are stable. You know you will be rational at $t_1$."
  3.  **Intention as Prediction (Minute 50)**
      *   *Objection:* "I just predict I will drink. That counts as intention."
      *   *Diagnosis:* Category Error. This is the core philosophical clash.
      *   *Management:* This is the main battle of **Layer 3**. Do not let this pass. Ask: "If you know you won't do it, in what sense do you intend it?"
  4.  **Self-Deception / Resolute Choice (Minute 65)**
      *   *Objection:* "I can fool myself into thinking I'll drink," or "I just choose resolutely."
      *   *Diagnosis:* Partial Insight. It acknowledges the difficulty but posits a psychological mechanism to bypass it.
      *   *Management:* Acknowledge this as a *psychological* possibility but question its *rationality*. "Can you rationally induce a belief you know is false?"
  5.  **The New Year's Resolution Objection (Minute 75)**
      *   *Objection:* "People intend to exercise knowing they won't. So obviously you can intend what you know you won't do."
      *   *Diagnosis:* Equivocation. They are using 'intend' to mean 'wish' or 'hope'.
      *   *Management:* Use this to test **Layer 3**. Ask: "In the resolution case, do you believe you will do it? Or do you hope you will?" If they say 'hope', they have conceded the puzzle.

  ### 4. The Variants as Diagnostic Instruments

  Introduce these only after the main puzzle is fully stalled (Minute 60). Do not present them as new puzzles, but as tests of *why* the first one stalled.

  *   **The Serial Variant (The "Reason" Test)**
      *   **Setup:** The offer repeats weekly. Drinking this week proves you are a "drinker type," securing future payouts.
      *   **Diagnosis Isolated:** This isolates the **Reason** diagnosis.
      *   **Function:** In this variant, there *is* a reason to drink at $t_1$ (future money). If students say the puzzle disappears here, they admit the original problem was a lack of reason, not a lack of capacity.
      *   **Placement:** Introduce first (Minute 60). It is easier for economists to grasp.
  *   **The Graded Variant (The "Capacity" Test)**
      *   **Setup:** Payment is proportional to intention strength (0 to 1 million).
      *   **Diagnosis Isolated:** This isolates the **Capacity** diagnosis.
      *   **Function:** If the problem is that intention is binary (you either can or can't), this might not help. If the problem is that you lack *sufficient reason* for full intention, maybe you have enough reason for 0.5 intention?
      *   **Placement:** Introduce second (Minute 70). It is more subtle. It tests whether intention is a voluntary act that can be partial.
      *   **Instruction:** Ask the group: "Does the Serial variant solve the *rationality* problem? Does the Graded variant solve the *volition* problem?"

  ### 5. Check for Understanding

  Do not ask "What is the solution?" (There is no consensus). Do not ask "Can you get the money?"

  **The Check:**
  Ask them to construct a **single-sentence stipulation** that dissolves the puzzle without changing the payoff amounts.

  *   **Bad Answer (Confident but shallow):** "Stipulate that the agent values honesty." (This changes the utility function, effectively a commitment device).
  *   **Bad Answer:** "Stipulate that the agent can bind their future self." (This removes the time-inconsistency problem by fiat).
  *   **Good Answer:** "Stipulate that intention does not require a belief that one will act." (This attacks the philosophical premise of Layer 3).
  *   **Good Answer:** "Stipulate that the agent cannot predict their own future action with certainty." (This attacks the knowledge condition).

  **Why this works:** It forces them to identify which link in the chain (Layer 1–4) is the actual source of the tension.

  ### 6. Exclusions

  Explicitly state at the beginning (Minute 5) that you are **bracketing** the following:

  1.  **Moral Obligation:** This is a puzzle about prudential rationality, not morality.
  2.  **Neuroscience of Intention:** We are not asking if the brain *can* physically fire the neurons, but if it is *rational* to do so.
  3.  **The "Solution":** State clearly that philosophers disagree on the solution. The goal of the seminar is to understand the *structure of the constraint*, not to resolve it.

  ### 7. Flag on Your Set-Up

  Your set-up contains one stipulation that settles a question you ought to leave open:

  > *"You know now that you will not drink it..."*

  **The Problem:** This stipulation assumes the conclusion of the "Impossibility Thesis" (that one cannot intend what one knows one will not do). By stating it as a fact of the case, you prevent the students from debating whether a rational agent *could* form the intention and then change their mind, or whether they could form the intention while knowing they will not act (the "Resolute Choice" position).

  **The Fix:** Change this to: *"You are a rational agent who maximizes expected utility. At $t_1$, you will have no reason to drink."*
  Let *them* derive that they will not drink it. If you tell them they know they won't drink it, you have already ruled out the possibility of Resolute Choice before they have had a chance to consider it. You want them to struggle with whether they *can* intend, not tell them they *won't*.

  **Secondary Flag:**
  > *"The benefactor's detection of it is not your problem."*

  **The Problem:** This is necessary, but be careful it doesn't sound like "magic."
  **The Fix:** Frame it as a "black box" constraint. "Treat the detection mechanism as a primitive. Do not model the epistemology of the detector." This stops the psychologists from trying to model the detection process as a behavioral signal.
