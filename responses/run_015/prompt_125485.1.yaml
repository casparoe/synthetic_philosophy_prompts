      Strictly speaking, step (3) says "When an event has a sufficient physical cause, it does not also have a second, independent, sufficient cause."
      The argument relies on $S$ and $P$ being independent. They aren't.
      So I reject the *application* of (3) to this case, or reject (3) as a universal principle because it excludes non-independent causes.
      Let's say: Reject (3) because it forbids dependent concurrent causation.

      *Wait, one nuance:* The user says "If I have to choose, I would rather keep (1)... than keep my professional self-conception; but I would also like to keep the claim that the postmortem identifies a real cause."
      So I must provide a way to keep (1) and the causal claim.
      Rejecting (3) allows this.

      *Closing:*
      Consideration to change verdict: If interventions on high-level states are never possible without low-level confounding (the "common cause" problem).
      Weakest point: Defining the boundaries of mental interventions without a spec.

      *Let's tighten the "First Sentence":*
      "Reject step (3), the principle of No Systematic Overdetermination, because it incorrectly treats realized states and their physical bases as independent competitors rather than dependent variables in a single causal chain."

      *Wait, need to ensure I price the alternatives.*
