answer: |-
  Reject step (3), the principle of No Systematic Overdetermination, because it incorrectly treats realized states and their physical bases as independent competitors rather than dependent variables in a single causal chain.

  This verdict relies on an **interventionist reading of causation**: $C$ causes $E$ if and only if an intervention on $C$ changes $E$, holding other relevant variables fixed. Under this definition, premise (1) remains true (physical states determine physical outcomes), and premise (2) remains true (software states are multiply realizable), but the inference to epiphenomenalism collapses. When you intervene on a software state (e.g., change a flag from `true` to `false`), you necessarily intervene on the physical state realizing it. The physical cause and the software cause are not independent candidates vying for explanatory credit like two assassins firing simultaneously; they are locked together by the realization relation. Premise (3) forbids *independent* sufficient causes, but it does not forbid *dependent* sufficient causes. By rejecting (3), you pay the cost of abandoning the view that causation is a zero-sum competition between levels of description. You must accept that causation is relative to the granularity of the model: the electrons cause the voltage change, and the buffer state causes the packet drop, and neither explanation cancels the other.

  Your "specification condition" is the right shape but misidentifies the necessary ingredient. It is not the existence of a written document (source file, contract) that rescues causality; it is the **stability of the counterfactuals**. A written spec is merely a tool engineers use to stabilize the mapping between physical states and functional states so that interventions are predictable. For beliefs and desires, there is no written spec, but there is a functional role stabilized by evolution and learning. If intervening on a belief (e.g., changing "I believe the bridge is safe" to "I believe the bridge is unsafe") reliably changes behavior across different neural realizations, the belief is a cause. The category mistake is thinking the *authority* of the spec matters; only the *reliability* of the mapping matters.

  Regarding the compiler case: causation is contrastive and model-relative. For the dead code variable, relative to the **compiled binary**, it is not a cause because no intervention on the binary's state space corresponds to changing that variable. Relative to the **source-plus-compiler system**, it is a cause, because changing the source changes the compiler's behavior (even if the output is identical, the *process* differed). For the two algorithms: if they agree on every input/output pair, they are the same cause at the **interface level**, but distinct causes at the **resource level** (CPU cycles, latency). Debugging usually targets the interface level (why did it return 5?), while profiling targets the resource level (why did it take 5ms?). Both are valid causal claims within their respective models.

  The analogy to mental causation is exact regarding causal power. The fact that code has an author and minds do not is relevant to **semantics** (what the state means or represents), not **causation** (what the state does). Your decision to deploy on Friday caused the outage because had you intervened on that decision (deployed Monday), the outage would not have occurred, regardless of the neural voltages realizing the decision. Vindicating software states vindicates mental states, provided mental states exhibit the same stable counterfactual dependence on behavior that software states exhibit on output.

  The single consideration that would most likely make me change this verdict is if it could be demonstrated that high-level interventions are never possible without confounding low-level variables (the "causal exclusion" problem re-emerging within interventionism). My diagnosis is weakest on the precise boundaries of mental interventions, as defining an intervention on a "belief" without altering unrelated neural states is far harder than defining an intervention on a "buffer flag."
