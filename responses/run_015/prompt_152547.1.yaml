answer: |-
  Your diagnosis is exceptionally sharp. You have identified that the stalemate in your seminar is not merely a conflict over data interpretation, but a **category error regarding the ontology of character**. The situationists and the virtue ethicists are not disagreeing about the same object; they are using the same label ("character trait") to refer to distinct metaphysical and psychological constructs.

  Here is a diagnosis of the impasse structure, an analysis of your three-part distinction, and an evaluation of what would actually constitute progress.

  ### I. Diagnosis: The Ontological Mismatch

  The deadlock is structural because it involves a clash between **Naturalistic Reductionism** (Situationism) and **Normative Functionalism** (Virtue Ethics).

  1.  **The Situationist Assumption (The Predictive-Statistical Model):**
      Situationists (e.g., Doris, Harman) operate with a Humean or Behaviorist ontology. For them, a character trait is a *dispositional property* defined by high cross-situational consistency in behavioral output. If $T$ is a trait (e.g., honesty), then $P(Action_{honest} | Situation_{varied})$ must be high. When the data shows low correlation coefficients, they conclude $T$ does not exist. They treat character as a **causal engine of behavior**.

  2.  **The Virtue Ethicist Assumption (The Teleological-Narrative Model):**
      Virtue ethicists (e.g., Annas, Kamtekar) operate with an Aristotelian or Powers-based ontology. For them, a character trait is a *capacity for practical reasoning* oriented toward *eudaimonia*. It is defined not by behavioral output alone, but by the *quality of perception and reasoning* that leads to action. A virtuous agent might act differently in situation $A$ vs. situation $B$ because practical wisdom (*phronesis*) dictates different responses, yet the underlying *orientation* remains stable. They treat character as a **narrative structure of agency**.

  **The Impasse:**
  *   **Side A** says: "Your 'stable trait' predicts nothing; therefore it is empirically vacuous."
  *   **Side B** says: "Your 'behavioral consistency' misses the point of agency; therefore it is philosophically shallow."
  *   **Result:** Side A accuses Side B of ignoring science (because B denies the statistical model is the only valid one). Side B accuses Side A of ignoring philosophy (because A denies the normative model has psychological reality).

  You are correct that the **Normative Counterfactual** model is the missing bridge. It asks: "In nearby possible worlds where the moral salience is held constant, would the agent respond consistently?" This is what virtue ethicists *mean*, but situationists test the *Predictive Statistical* model because counterfactuals are methodologically difficult to operationalize.

  ### II. Evaluating the Paths to Progress

  You proposed three potential avenues for progress. Here is what each implies for the debate's viability.

  #### 1. A Refined Conceptual Taxonomy
  *   **The Move:** Explicitly distinguish between *Behavioral Dispositions* (Statistical), *Modal Dispositions* (Counterfactual), and *Narrative Identities* (Teleological).
  *   **Implication for the Debate:** This dissolves the verbal dispute but risks partitioning the field.
      *   If the taxonomy is accepted, Situationists must admit they have only refuted *Behavioral Dispositions*.
      *   Virtue Ethicists must admit they need to explain how *Narrative Identities* cash out in psychological mechanisms.
      *   **Verdict:** This is a **necessary precondition** for progress, but not sufficient. It stops the talking-past-each-other, but it leaves the substantive question unanswered: *Can human psychology support Modal or Narrative traits?* If the taxonomy simply allows virtue ethicists to retreat to an unfalsifiable definition of character, the situationists will (rightly) claim the theory has lost its grip on human psychology.

  #### 2. An Empirical Study Measuring Modal Rather Than Actual Stability
  *   **The Move:** Design experiments that test *sensitivity to reasons* rather than *consistency of action*. Instead of asking "Did they help in 10 situations?", ask "Did they *recognize* the demand to help in 10 situations, and did their reasoning process remain stable even if their action varied?"
  *   **Implication for the Debate:** This is the **most substantive path**, but also the hardest.
      *   It forces Situationists to engage with the *cognitive* aspects of virtue (perception, attention, reasoning) rather than just behavioral output.
      *   It forces Virtue Ethicists to make risky empirical predictions (e.g., "Habituation alters attentional bias").
      *   **Verdict:** This moves the debate from "Do traits exist?" to "What is the psychological mechanism of virtue?" It transforms the conflict into a collaborative research program. However, it requires accepting that "character" is a construct that can be operationalized via vignettes, VR simulations, or process-tracing, which some hardline situationists might reject as "folk psychology."

  #### 3. An Argument that Normative Virtue Ethics is Independent of Empirical Psychology
  *   **The Move:** Argue that virtue ethics is a normative project about what we *ought* to become, not a descriptive project about what we *are*.
  *   **Implication for the Debate:** This is a **retreat that ends the interdisciplinary dialogue**.
      *   If virtue ethics is independent of psychology, the situationist critique becomes irrelevant (a category error).
      *   However, this surrenders the claim that virtue ethics is "naturalistic" or grounded in human flourishing (*eudaimonia* usually requires facts about human nature).
      *   **Verdict:** This resolves the logical tension by severing the connection, but it fails the prompt of a "moral psychology" seminar. It saves the philosophy by sacrificing the psychology.

  ### III. Recommendation: The "Perceptual Sensitivity" Pivot

  To actually move your seminar forward, I recommend steering the discussion toward **Option 2 (Empirical Modal Stability)**, framed through the lens of **Perceptual Sensitivity**.

  The situationist data shows that *behavior* is situationally volatile. The virtue ethicist claim is that *practical wisdom* is stable. The hidden empirical question you identified is: **Does habituation stabilize *perception* even if it doesn't stabilize *action*?**

  **Proposed Synthesis for the Seminar:**
  1.  **Accept the Taxonomy:** Concede that Situationists have successfully debunked the "Global Behavioral Trait" (the Predictive-Statistical model). Most modern virtue ethicists do not hold this view anyway.
  2.  **Shift the Burden:** The debate should now focus on the **Normative Counterfactual**. Can we find evidence that trained agents (those undergoing habituation) show greater *consistency in moral perception* across situations than untrained agents?
      *   *Example:* In a diffusion-of-responsibility scenario, does a person with high "compassion training" notice the victim faster, even if social pressure prevents them from acting?
  3.  **Reframe the Goal:** The goal of virtue ethics is not to produce a robot that acts the same way in a war zone and a tea party. It is to produce an agent whose *reasons for acting* are stable, even if the *actions* differ.

  **Why this breaks the deadlock:**
  *   It grants the Situationists their data (behavior is messy).
  *   It grants the Virtue Ethicists their theory (character is about reasoning/orientation).
  *   It creates a new empirical target: **Cognitive consistency vs. Behavioral consistency.**

  If the seminar can agree to investigate whether *habituation affects attentional and cognitive processing* (the Counterfactual/Modal layer) rather than just behavioral output (the Statistical layer), the impasse dissolves into a research agenda. If they cannot agree on this, then the debate is indeed metaphysical: one side believes psychology reduces to behavior, the other believes it includes irreducible normative capacities. In that case, no amount of data will move them, and you must retreat to **Option 1 (Taxonomy)** to clarify that they are simply working in different paradigms.
