prompt: |-
  I teach a 200-level "evidence and inference" course that's cross-listed between philosophy and stats — 18 students, mixed majors, and I get exactly one 75-minute session to do Simpson's paradox with them. Last year I put the Berkeley admissions table on a slide and it died on contact: half of them had already seen the trick in some stats YouTube video, so they could recite "the trend reverses when you disaggregate" without feeling a thing, and when I asked which table they'd actually act on they just picked whichever one they thought I wanted. This year I want them to manufacture a reversal out of their own decisions, argue about it while it's still live, and only get the name at the very end, in the debrief, after they've already staked out positions they have to walk back. No lecture up front, no slides of someone else's data, no computers — printing and index cards only.

  Here's the half-baked mechanic I sketched in a notebook, and I'd like you to build the real thing around it (fix the numbers if mine are off, but keep the shape). Everyone is a gladiator in a two-tier league: in each round you choose whether to fight a Novice or a Champion. Each gladiator has a hidden form card giving their personal win rates against each tier, and instead of coin flips you hand them a physical deck of 10 cards per matchup type, shuffled and drawn, so the rates come out exact and the arithmetic is clean on the board. A win over a Novice is 1 point, over a Champion is 3. The scoreboard tracks wins, losses, and points. My suggested cards: a strong gladiator wins 8 of 10 against Novices and 4 of 10 against Champions; a weak one wins 5 of 10 and 1 of 10. Do the expected-value arithmetic and the strong gladiator rationally hunts Champions (0.4 × 3 beats 0.8 × 1) while the weak one farms Novices (0.5 beats 0.3) — so the strong gladiator's pooled win rate comes out at 40% and the weak one's at 50%, even though the strong one beats the weak one in both tiers. I want the room to first crown a champion by win rate, then have to defend it, and then have to say what they think "better" means here and why the question they were asked wasn't the question they answered. I'd also like a second phase that reuses the exact same table under different stories: the tier is picked by the gladiator (as in the game), the tier is assigned by a matchmaker after a fitness check the gladiator can't influence, and the tier is partly a consequence of how the gladiator did in earlier rounds — same numbers, three different right answers, and nothing in the table to tell them which story they're in.

  So what I need from you is the full runnable design: rules and scoring, the materials and what gets printed, a minute-by-minute timeline for 75 minutes, any roles (I like the idea of a Commissioner who has to declare a champion, and a couple of Scouts who only ever see the pooled table), what the facilitator says and when, and a debrief that maps specific moments in the game onto the idea — composition, confounding, and the fact that whether to aggregate is a causal question, not a statistical one. Two more things I care about. First, tell me what will predictably go wrong the first time I run this and how to handle it — I can already imagine the strong gladiator's first pick being so obviously right that the choice feels trivial, someone shouting that it's rigged once they see the decks, and a stubborn student insisting the points leader is the best fighter and refusing to budge. Second, be straight with me about what this activity can't reproduce and that I'll have to supply myself: a friend of mine does epidemiology and keeps insisting that with odds ratios you can get a reversal with no confounding at all, something about non-collapsibility, and I don't understand it well enough to stage it or to explain it — if that's right, say so and tell me how to fold it in as a caveat rather than a demo. I also want an honest note on the version of the lesson I'm losing by building the reversal into the incentives, since a sharp student will eventually notice that I arranged for the composition difference rather than discovering it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** 200-level "Evidence and Inference" (Philosophy/Stats cross-listed).
      *   **Students:** 18 students, mixed majors.
      *   **Time:** One 75-minute session.
      *   **Goal:** Teach Simpson's Paradox (SP) without lecture/slides/computers. Students must *manufacture* the reversal, argue about it, and only learn the name at the end.
      *   **Core Mechanic:** Gladiator league. Two tiers (Novice/Champion). Choice of opponent affects points (Novice=1, Champion=3). Hidden win rates. Physical decks (10 cards) for exact probabilities.
      *   **Specific Numbers:** Strong Gladiator (8/10 Novice, 4/10 Champion). Weak Gladiator (5/10 Novice, 1/10 Champion).
      *   **Desired Outcome:** Strong has higher EV for points, but lower pooled win rate. Weak has lower EV for points, but higher pooled win rate.
      *   **Structure:**
          1.  Game phase (make decisions, generate data).
          2.  Judgment phase (crown champion, defend choice).
          3.  Reveal phase (SP name, causal discussion).
          4.  Second phase (same numbers, different causal stories).
      *   **Requirements:** Full runnable design (rules, materials, timeline, script), troubleshooting (what goes wrong), and limitations (non-collapsibility, artificiality).

  2.  **Verify the Math (Crucial Step):**
      *   *Strong Gladiator (S):*
          *   vs. Novice (N): 8/10 wins (0.8).
          *   vs. Champion (C): 4/10 wins (0.4).
          *   Points: N=1, C=3.
          *   EV Points (if choosing C): $0.4 \times 3 = 1.2$.
          *   EV Points (if choosing N): $0.8 \times 1 = 0.8$.
          *   *Rational Choice:* Fight Champions.
          *   *Resulting Win Rate:* If they *only* fight Champions (to maximize points), Win Rate = 40%.
      *   *Weak Gladiator (W):*
          *   vs. Novice (N): 5/10 wins (0.5).
          *   vs. Champion (C): 1/10 wins (0.1).
          *   Points: N=1, C=3.
          *   EV Points (if choosing C): $0.1 \times 3 = 0.3$.
          *   EV Points (if choosing N): $0.5 \times 1 = 0.5$.
          *   *Rational Choice:* Fight Novices.
          *   *Resulting Win Rate:* If they *only* fight Novices, Win Rate = 50%.
      *   *Comparison:*
          *   S beats W vs. N (0.8 > 0.5).
          *   S beats W vs. C (0.4 > 0.1).
          *   Pooled Win Rate: S (40%) < W (50%).
      *   *Conclusion:* The math holds. The paradox relies on the *choice* of opponent driving the composition of the data.

  3.  **Design the Activity Flow:**
      *   **Setup:** Need to divide 18 students.
          *   2 "Gladiators" (Active decision makers).
          *   16 "Arena Staff" (Dealers, Scorers, Observers).
          *   Wait, 18 is a lot for just 2 gladiators. Let's make it teams.
          *   Better: 2 Teams (Team Strong, Team Weak). Each team has a "General" who makes the choice. The rest handle the decks and scoring.
          *   Actually, to ensure everyone feels involved, let's have multiple rounds or multiple gladiators per type.
          *   *Refinement:* Let's stick to the prompt's "Strong vs. Weak" archetype but scale it. Let's have 9 students on Team Strong and 9 on Team Weak. Each team selects a "Champion" to draw cards, but the *team* decides the strategy.
          *   *Even Better:* To keep the data clean and the "pooled table" obvious, let's have just **two** active players (The "Strong" and The "Weak") but the rest of the class are the "Commissioners" and "Scriveners" who verify the draws. This prevents the "noise" of 18 different strategies. The prompt asks for *manufacturing* the reversal. If everyone plays, the aggregate might get messy.
          *   *Decision:* 2 Active Players (volunteers or assigned). 16 Observers/Officials. This focuses the tension.
          *   *Wait, engagement risk:* 16 students watching 2 play might bore them.
          *   *Fix:* Divide the 16 observers into two "Houses." House Strong advises the Strong Gladiator. House Weak advises the Weak Gladiator. They debate the strategy *before* the draw.
      *   **Materials:** Index cards (decks of 10), Scoreboard (whiteboard), Role badges.
      *   **Timeline:** 75 mins is tight.
          *   0-10: Setup & Rules.
          *   10-30: Round 1 (Strategy & Play).
          *   30-45: The Verdict (Who is better?).
          *   45-60: The Reveal (SP & Causality).
          *   60-75: Phase 2 (Three Stories).

  4.  **Drafting the Mechanics:**
      *   *Decks:* Need 4 types of decks.
          *   Strong vs. Novice (8 Win, 2 Lose).
          *   Strong vs. Champion (4 Win, 6 Lose).
          *   Weak vs. Novice (5 Win, 5 Lose).
          *   Weak vs. Champion (1 Win, 9 Lose).
      *   *Scoring:* Wins matter for the "Best Fighter" title. Points matter for the "League Trophy." *Crucial Distinction:* The prompt says "crown a champion by win rate." So the metric for "Better" must be Win Rate, but the incentive for choice is Points.
      *   *Rounds:* Need enough draws to make the rates stable but not take forever. 10 draws per choice is too long (40 draws total).
      *   *Adjustment:* Use the "Deck of 10" as the probability space, but only draw *once* per round? No, the prompt says "hand them a physical deck of 10 cards... so the rates come out exact." This implies we exhaust the deck to guarantee the rate.
      *   *Time Check:* Exhausting 4 decks (40 cards total) takes time. Shuffling, drawing, recording.
      *   *Optimization:* Pre-shuffle the decks. Just deal them out. 10 cards is fast if organized.
      *   *Rounds:* Let's do 1 "Season" consisting of exhausting one deck choice per Gladiator.
      *   *Strategy:* Strong *should* choose Champions (for points). Weak *should* choose Novices (for points). This creates the paradox.
      *   *Incentive:* Tell them the goal is **Points**. Tell them the **Award** is based on **Win Rate**. This creates the tension. They optimize for Points, get judged on Win Rate.

  5.  **Addressing the "Three Stories" (Phase 2):**
      *   Story 1: Choice (The Game we just played). Confounding by Choice.
      *   Story 2: Matchmaker (Assignment). If the Matchmaker sends Strong to Champions and Weak to Novices based on skill, aggregating hides the skill.
      *   Story 3: Consequence (Mediator). If fighting Champions *causes* injuries that lower future win rates (not quite SP).
      *   *Correction:* The prompt asks for: 1. Tier picked by gladiator. 2. Tier assigned by matchmaker (fitness check). 3. Tier is consequence of earlier rounds.
      *   *Key Insight:* The *table* is the same. The *causal graph* changes.
      *   Story 1 (Choice): Choice is a confounder. Disaggregate.
      *   Story 2 (Assignment): Assignment is a collider? No, if assigned based on fitness (Skill -> Tier), then Tier is a mediator or just stratification. If Skill -> Tier and Skill -> Win, then Tier is a proxy. Actually, if the Matchmaker assigns based on Skill, then Tier is a *mediator* of Skill. Aggregating is okay? No, if we want to compare Skill, we must control for Tier.
      *   Story 3 (Consequence): Win -> Tier. (Past performance determines next opponent). This is dynamic.
      *   *Simplification for Class:* Keep it to "Who chose?" vs "Who assigned?" vs "Does it matter?"
      *   *Actually, the prompt specifies:* "tier is picked by gladiator... tier is assigned by matchmaker... tier is partly a consequence."
      *   *Lesson:* Aggregation is valid only if the grouping variable (Tier) is not a confounder.

  6.  **Troubleshooting & Limitations:**
      *   *Risk 1:* Students see the decks. *Fix:* Opaque envelopes or dealer handles cards face down.
      *   *Risk 2:* "Points Leader is Best." *Fix:* Force the definition of "Best" to be Win % before the game starts, then change the incentive to Points. Or keep the criteria ambiguous until the end. The prompt says "crown a champion by win rate." So the criteria is fixed, the *behavior* is optimized for something else (Points).
      *   *Risk 3:* Non-collapsibility. This is technical. Odds ratios vs Risk Ratios. SP is about confounding (causal). Non-collapsibility is mathematical (marginal vs conditional). I need to explain this simply. It's a "math artifact" vs "real world artifact."
      *   *Risk 4:* Artificiality. Students might feel tricked. *Fix:* Acknowledge the setup in the debrief. The lesson is about *questioning the data generation*, not just the numbers.

  7.  **Fleshing out the Plan (Iterative refinement):**
      *   *Roles:* 2 Generals (make choices), 4 Dealers (handle decks), 2 Scribes (board work), 10 Jurors (vote on "Who is better").
      *   *Materials:* 4 Decks of 10 index cards (marked W/L inside or colored). Whiteboard.
      *   *Script:* Needs to be punchy. No lecturing.
      *   *Debrief:* Connect the "Choice" to "Confounding." Connect the "Same Table/Different Story" to "Causal Structure."

  8.  **Refining the Math/Logic for the "Three Stories":**
      *   *Story A (Choice):* Gladiator chooses difficulty. Strong chooses Hard. Weak chooses Easy. Confounder = Choice. *Action:* Disaggregate.
      *   *Story B (Matchmaker):* Matchmaker sees Skill. Sends Strong to Hard, Weak to Easy. Variable = Tier. Is Tier a confounder? No, Tier is a *mediator* of Skill. If we want to know "What is the effect of Skill on Winning?", we look at the total effect (Aggregate). If we want "How good are they against specific opponents?", we disaggregate. *Wait, this is tricky.* In Berkeley, Gender -> Dept (Choice/Assignment). If Dept is a mediator of Gender discrimination, aggregating hides it. If Dept is just a preference, disaggregating reveals it.
      *   *Let's stick to the Prompt's specific request:* "Same numbers, three different right answers."
      *   1. Choice (Confounding): Disaggregate.
      *   2. Assignment (Stratification): If assigned randomly? No, assigned by fitness. If Fitness -> Tier, then Tier explains the variance. Aggregating is misleading about *ability*, accurate about *outcome*.
      *   3. Consequence (Selection Bias): If you win, you move up. Then the "Champion" tier is full of winners.
      *   *Decision:* I will structure the debrief to focus on *why* the groups differ.

  9.  **Addressing Non-Collapsibility:**
      *   This is the "friend in epidemiology" point.
      *   *Fact:* Even without confounding, Odds Ratios (OR) are non-collapsible. Risk Ratios (RR) are collapsible (mostly).
      *   *Implication:* You can see a "reversal" in ORs just due to math, even if the causal effect is constant.
      *   *Action:* Don't try to demo this (requires logistic regression math). Acknowledge it as a "Statistical Artifact" vs Simpson's "Causal Artifact." Tell the instructor to mention it as a "Advanced Note" so they don't look ignorant if a stats major brings it up.

  10. **Final Review against Constraints:**
      *   75 mins? Yes, tight but doable.
      *   No computers/slides? Yes, index cards/board.
      *   18 students? Roles assigned.
      *   Debrief maps moments to concepts? Yes.
      *   Troubleshooting included? Yes.
      *   Limitations included? Yes.

  11. **Writing the Response:**
      *   Tone: Professional, pedagogical, direct.
      *   Structure: Overview, Materials, Roles, Timeline/Script, Troubleshooting, Limitations.
      *   *Self-Correction on Math:* Ensure the "Points" incentive is clear. Strong gets 3 pts for Champion. Weak gets 1 pt for Novice.
      *   *Strong:* 4 wins x 3 pts = 12 pts. (40% win rate).
      *   *Weak:* 5 wins x 1 pt = 5 pts. (50% win rate).
      *   *Wait:* Strong gets *more* points (12 vs 5) but *lower* win rate (40% vs 50%). This is perfect. They optimize for points, get judged on wins.
      *   *Wait, one check:* Weak vs Novice is 5/10. 5 wins x 1 pt = 5 pts. Strong vs Champion is 4/10. 4 wins x 3 pts = 12 pts.
      *   *Is the Weak Gladiator rational?* Weak vs Champion = 1/10 wins. 1 x 3 = 3 pts. Weak vs Novice = 5/10 wins. 5 x 1 = 5 pts. Yes, Weak maximizes points by choosing Novice.
      *   *Is the Strong Gladiator rational?* Strong vs Champion = 4/10 wins. 4 x 3 = 12 pts. Strong vs Novice = 8/10 wins. 8 x 1 = 8 pts. Yes, Strong maximizes points by choosing Champion.
      *   *Result:* Strong has 12 pts, 40% WR. Weak has 5 pts, 50% WR.
      *   *Paradox:* Strong is better at fighting (80%>50%, 40%>10%), but has worse Win Rate (40% < 50%).
      *   *Tension:* Strong has more Points. Weak has better Win Rate. Who is "Champion"?
      *   *Instruction:* "The League Trophy goes to the highest Point Scorer. The 'Best Fighter' Medal goes to the highest Win Rate."
      *   *Conflict:* The class must decide who is "Better."

      *   *Wait, one nuance:* The prompt says "crown a champion by win rate." Okay, I will enforce that metric for the "Best Fighter" title, but the *incentive* during the game was Points. This creates the regret/cognitive dissonance. "Why did you choose Champions?" "To get points." "But now you lost the title." "That's unfair!" -> "Welcome to Simpson's Paradox."

      *   *Wait, Phase 2:* "Same numbers, three different right answers."
      *   Scenario 1 (Choice): Disaggregate. (Strong is better).
      *   Scenario 2 (Matchmaker): If the Matchmaker assigns based on skill to ensure fair fights, the aggregate tells you who wins more matches in the league. (Weak is "more successful" in the league context).
      *   Scenario 3 (Consequence): If winning promotes you.
      *   *Actually, the standard SP causal lesson is:*
          1.  Confounder (Choice): Disaggregate.
          2.  Mediator (Mechanism): Aggregate.
          3.  Collider (Bias): Do nothing/Adjust.
      *   I will simplify this to: "Does the group label explain the difference, or hide it?"

      *   *Let's finalize the plan.*

      *(Self-Correction during drafting)*: Make sure the card decks are prepared *before* class. 4 decks of 10.
      *   Deck S-N: 8 Win, 2 Lose.
      *   Deck S-C: 4 Win, 6 Lose.
      *   Deck W-N: 5 Win, 5 Lose.
      *   Deck W-C: 1 Win, 9 Lose.
      *   Cards should be indistinguishable from the back.

      *   *Timeline:*
          *   0-10: Setup.
          *   10-25: Strategy & Play (The Trap).
          *   25-40: The Verdict (The Conflict).
          *   40-55: The Reveal (The Math).
          *   55-70: The Stories (The Causality).
          *   70-75: Wrap.

      *   *Troubleshooting:*
          *   "Rigged": Acknowledge the design.
          *   "Points = Better": Challenge the definition of "Better."
          *   "Boredom": Give the observers specific counting tasks.

      *   *Non-collapsibility:* Be honest. It's a different beast. Don't demo it. Mention it as a "statistical ghost."

      *   *Artificiality:* Admit it. The lesson is about *asking* how data was made, not just calculating.

      *   *Ready to write.*
answer: |-
  Here is the full runnable design for your 75-minute session. It is built to be low-tech, high-tension, and causally precise.

  ## 1. The Setup & Materials

  **Room Layout:**
  *   Front board divided into two sections: **The Arena** (Live Score) and **The Ledger** (Final Stats).
  *   Two tables at the front: **Team Strong** (Left) and **Team Weak** (Right).
  *   Remaining students seated in the "Gallery" (observers).

  **Materials to Print/Prepare:**
  *   **4 Decks of Index Cards (10 cards each).** Backs must be identical. Inside, write "WIN" or "LOSS" in large marker.
      *   *Deck S-N (Strong vs Novice):* 8 WIN, 2 LOSS.
      *   *Deck S-C (Strong vs Champion):* 4 WIN, 6 LOSS.
      *   *Deck W-N (Weak vs Novice):* 5 WIN, 5 LOSS.
      *   *Deck W-C (Weak vs Champion):* 1 WIN, 9 LOSS.
  *   **Role Badges (Paper slips):**
      *   2x **General** (One for Team Strong, one for Team Weak).
      *   4x **Dealer** (One per deck).
      *   2x **Scribe** (One per team, writes on board).
      *   1x **Commissioner** (You, or a trusted student).
      *   9x **Juror** (The rest of the class).
  *   **The Contract (Handout/Board):**
      *   *Rule 1:* A Win vs Novice = **1 Point**.
      *   *Rule 2:* A Win vs Champion = **3 Points**.
      *   *Rule 3:* The "League Trophy" goes to the highest **Point Scorer**.
      *   *Rule 4:* The "Best Fighter" Medal goes to the highest **Win Rate** (%).
      *   *Rule 5:* Generals must choose **one** tier to fight for the entire season (10 matches).

  ## 2. Minute-by-Minute Timeline

  ### Phase 1: The Trap (0:00 – 0:25)

  **0:00 – 0:05 | Assignment & Rules**
  *   **Action:** Assign roles. Put the two most vocal students as **Generals**. Put the most skeptical students as **Dealers** (they handle the cards, so they know it's not rigged). Put the rest as **Jurors**.
  *   **Script:** "You are in a Gladiator League. There are two tiers: Novice and Champion. Generals, you must choose which tier your gladiator fights for the whole season. Dealers, you hold the fate decks. Jurors, you watch the math. Read the Contract on the board. Note there are two awards: Points and Win Rate."
  *   **Constraint:** Do *not* reveal the win rates inside the decks. Tell them: "You know your gladiator's reputation, but not the exact odds. You must decide based on risk and reward." (In reality, give them a hint sheet: *Strong: High skill. Weak: Low skill.* Let them infer the rational choice).

  **0:05 – 0:15 | Strategy Session**
  *   **Action:** Teams huddle. Dealers shuffle their specific decks (face down).
  *   **Facilitator Move:** Walk between teams. Ask: "Are you optimizing for the Trophy (Points) or the Medal (Win Rate)?"
  *   **Expected Outcome:** Rational agents optimize for Points.
      *   *Strong General:* "If I fight Novices, I win 8 games (8 pts). If I fight Champions, I win ~4 games (12 pts). I choose **Champions**."
      *   *Weak General:* "If I fight Champions, I win ~1 game (3 pts). If I fight Novices, I win ~5 games (5 pts). I choose **Novices**."
  *   **Crucial:** Do not correct them. Let them lock in the choice that creates the paradox.

  **0:15 – 0:25 | The Season (Data Generation)**
  *   **Action:** Dealers deal the 10 cards from the chosen decks one by one. Scribes record W/L on the board live.
  *   **Board Layout:**
      *   Team Strong: [W] [W] [L] [W]... (Total: 4W, 6L) -> **40% Win Rate, 12 Points.**
      *   Team Weak: [W] [L] [W] [W]... (Total: 5W, 5L) -> **50% Win Rate, 5 Points.**
  *   **Facilitator Move:** Keep the energy high. "Strong takes a hit! Weak pulls a win!" Ensure the final counts are exact (4/10 and 5/10).

  ### Phase 2: The Verdict (0:25 – 0:40)

  **0:25 – 0:30 | The Judgment**
  *   **Action:** Stop the game. Point to the **Win Rate** column.
  *   **Script:** "The season is over. According to Rule 4, the 'Best Fighter' Medal is awarded to the highest Win Rate. Commissioner, who wins?"
  *   **Result:** Team Weak (50%) beats Team Strong (40%).
  *   **Conflict:** Team Strong will object. "But we scored more points!" "We fought harder opponents!"
  *   **Task for Jurors:** "You are the Judges. You must award the 'Best Fighter' Medal. You cannot change the rules. Who is the better fighter? Discuss for 3 minutes."

  **0:30 – 0:40 | The Defense**
  *   **Action:** Call on 2-3 Jurors to defend their choice.
  *   **Expected Arguments:**
      *   *For Weak:* "The numbers don't lie. 50% is bigger than 40%."
      *   *For Strong:* "They cherry-picked easy fights. It's not fair to compare them without looking at who they fought."
  *   **Facilitator Move:** Write their arguments on the board under "Evidence" vs "Context." Do not resolve it yet. Let the tension sit.

  ### Phase 3: The Reveal (0:40 – 0:55)

  **0:40 – 0:45 | Opening the Decks**
  *   **Action:** Ask the Dealers to reveal the *unused* decks.
      *   Show Strong vs Novice (8/10).
      *   Show Weak vs Champion (1/10).
  *   **Script:** "Look at the data we didn't generate. If Strong fought Novices, they win 80%. Weak fights Novices, they win 50%. If Strong fought Champions, they win 40%. Weak fights Champions, they win 10%."
  *   **Board Work:** Draw the disaggregated table.
      *   Novices: Strong (80%) > Weak (50%).
      *   Champions: Strong (40%) > Weak (10%).
  *   **Question:** "Strong beats Weak in *both* tiers individually. But Weak beats Strong in the *total*. How is this possible?"

  **0:45 – 0:55 | Naming the Ghost**
  *   **Action:** Reveal the concept.
  *   **Script:** "This is **Simpson's Paradox**. It happens when a trend appears in different groups of data but disappears or reverses when these groups are combined."
  *   **The Lesson:** "You optimized for Points, which changed your **composition**. Strong chose high-difficulty matches. Weak chose low-difficulty matches. The 'Tier' variable is a **Confounder**. It influences both the Choice (who fights where) and the Outcome (Win/Loss). When you aggregate, you hide the confounder."
  *   **Resolution:** "To judge 'Fighter Skill,' you must disaggregate. To judge 'League Success,' you might aggregate. The math didn't change. The question changed."

  ### Phase 4: Three Stories (0:55 – 1:10)

  **0:55 – 1:05 | Same Table, Different Truths**
  *   **Action:** Keep the final board stats (Strong 40%, Weak 50%). Tell three stories. Ask: "Do we aggregate or disaggregate?"
  *   **Story 1 (The Game We Played):** *Choice.* The Gladiator chooses the tier.
      *   *Verdict:* **Disaggregate.** Choice is a confounder. Hiding it biases the skill estimate.
  *   **Story 2 (The Matchmaker):** *Assignment.* A Matchmaker sees the Gladiator's skill and *assigns* them to a tier to ensure fair fights (Strong -> Champion, Weak -> Novice). The Gladiator has no choice.
      *   *Verdict:* **It Depends.** If you want to know "Who wins more matches in this league?", Aggregate. If you want to know "Who is more skilled?", Disaggregate. Here, Tier is a **Mediator** of Skill. Aggregating tells you the total effect of Skill on League Standing. Disaggregating tells you the direct effect of Skill on Fighting.
  *   **Story 3 (The Promotion):** *Consequence.* Everyone starts as Novice. If you win, you get promoted to Champion.
      *   *Verdict:* **Do Not Adjust.** Here, Tier is a **Collider** (or consequence). Strong fighters are in the Champion tier *because* they won. Weak fighters are in Novice *because* they lost. If you control for Tier, you block the path of success. Aggregating is the only way to see who is actually better.

  **1:05 – 1:10 | The Takeaway**
  *   **Script:** "The table is identical in all three stories. The numbers are identical. But the right answer changes based on *how the data was generated*. Statistics cannot tell you which story you are in. Only context can."

  ### Phase 5: Debrief & Exit (1:10 – 1:15)

  *   **Summary:** "Simpson's Paradox isn't a math trick. It's a causal warning sign. It tells you that your groups are not comparable."
  *   **Exit Ticket:** On a slip of paper: "In the Berkeley Admissions case (which we didn't discuss but is famous), was 'Department' a Choice, a Matchmaker, or a Consequence? Why does it matter?"

  ---

  ## 3. Troubleshooting: What Will Go Wrong

  **1. "The Strong General's Choice Feels Trivial"**
  *   **Risk:** A student calculates EV immediately and says, "Obviously Strong picks Champions." The tension evaporates.
  *   **Fix:** Add **Uncertainty**. Tell them: "You don't know the exact win rates. You only know Strong is 'High Skill' and Weak is 'Low Skill'." They have to estimate. Most will still guess Champions for Strong, but it feels like a gamble, not a calculation.
  *   **Backup:** If they hesitate, whisper to the Strong General: "The Trophy is worth more to your house than the Medal."

  **2. "It's Rigged / The Decks are Loaded"**
  *   **Risk:** Once the reversal is shown, students claim you stacked the decks to force the paradox.
  *   **Fix:** This is why you assigned **Skeptics as Dealers**. They shuffled. They dealt. Ask them: "Did I touch these cards?" If a student still insists, acknowledge it: "Yes, I designed the rates to *allow* the paradox. But in the real world, the rates are hidden. The lesson is that you must ask *how the groups were formed*, not just trust the aggregate."

  **3. "Points Leader is the Best Fighter" (The Stubborn Juror)**
  *   **Risk:** A student refuses to accept Win Rate as the metric for "Best Fighter."
  *   **Fix:** Don't fight the metric. Fight the **definition**. "Okay, if 'Best' means 'Most Points,' Strong wins. If 'Best' means 'Highest Probability of Winning a Random Fight,' Weak wins based on your data. The paradox is that 'Best' is ambiguous until you define the causal question. Strong is better at *fighting*. Weak is better at *gaming the league*."

  ---

  ## 4. Limitations & The "Epidemiologist Friend"

  You asked for honesty about what this activity cannot do.

  **1. Non-Collapsibility (The Odds Ratio Issue)**
  *   **The Issue:** Your friend is right. In logistic regression, Odds Ratios (OR) are **non-collapsible**. This means the marginal OR (aggregate) can differ from the conditional OR (disaggregated) *even if there is no confounding at all*. It is a mathematical property of the OR, not a causal phenomenon.
  *   **Why not demo it?** It requires understanding log-odds and baseline risk. It will derail a 200-level philosophy/stats mix.
  *   **How to handle it:** In the debrief, add this caveat: "A sharp statistician might tell you that some reversals are just math artifacts, specifically with Odds Ratios. That is called **Non-Collapsibility**. It's a statistical ghost. Simpson's Paradox, as we played it today, is a **Causal Ghost**. It comes from mixing groups that shouldn't be mixed. If you see a reversal, first ask 'Did I mix groups?' (Simpson). If the answer is no, then ask 'Am I using Odds Ratios?' (Non-collapsibility)."

  **2. The "Arranged" Reversal**
  *   **The Issue:** A sharp student will notice you *forced* the composition difference by incentivizing Points. They might feel the lesson is "Don't let professors trick you" rather than "Check your confounders."
  *   **How to handle it:** Lean into it. "Yes, I arranged the incentives. In the real world, **incentives arrange the data**. Doctors prescribe stronger drugs to sicker patients (Choice). Universities route applicants to departments based on grades (Matchmaker). The data is *always* rigged by the process that generated it. Your job is not to trust the table, but to investigate the process."

  **3. Sample Size**
  *   **The Issue:** 10 cards is small. Real SP usually requires large N to be statistically significant.
  *   **How to handle it:** Acknowledge it. "We used 10 cards to make the math clean for the board. In reality, you'd need hundreds. But the *logic* of the error is the same whether N=10 or N=10,000."

  ## 5. Instructor Script Notes (Key Moments)

  *   **When revealing the unused decks:** Do this dramatically. Hold up the "Strong vs Novice" deck. "If Strong had chosen this, they would have 80%. They didn't. Why? Because the rules rewarded risk. The data reflects the *strategy*, not just the *skill*."
  *   **When discussing the Three Stories:** Use hand gestures.
      *   *Choice:* Hand moves from Person to Tier. (Confounder).
      *   *Matchmaker:* Hand moves from Person to Tier to Win. (Mediator).
      *   *Consequence:* Hand moves from Win to Tier. (Collider).
  *   **Closing:** "Statistics is not just calculating numbers. It is the art of asking where the numbers came from. If you don't know the story, you don't know the number."
