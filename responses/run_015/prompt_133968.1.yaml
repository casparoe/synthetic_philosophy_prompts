prompt: |-
  Doing a module on the epistemology of conspiracy theories atm and one guy in my seminar shuts down every objection with 'absence of evidence is not evidence of absence'. Last week he used it against me: I'd argued that five years with no leaked internal document about an alleged secret surveillance programme — one that supposedly hundreds of people were in on — is itself evidence that the programme doesn't exist. Can you lay out the different precise claims that one-liner could be making, from the trivial to the substantive to the self-sealing, and say for each whether it's plausible, and whether it actually gets him his conclusion or mine? One wrinkle I can't place: if the only route by which evidence could surface is somebody on the inside choosing to leak, and people leak more often when a programme is internally controvertial, does that make the silence far weaker evidence than it looks, or does the sheer number of people involved swamp that effect? Please answer in British English and keep it tight enough that I can raise it in next week's seminar.
