answer: |-
  Here is a breakdown suitable for raising in seminar. It distinguishes the logical truism from the epistemic misuse, and addresses the leak dynamics.

  **1. The Three Claims Behind the One-Liner**

  *   **The Trivial Claim (Logical):** 'You lack conclusive proof of non-existence.'
      *   *Plausibility:* True. Lack of proof is not disproof.
      *   *Verdict:* **Does not help him.** You are not claiming deductive certainty, but probabilistic evidence. In Bayesian terms, absence of evidence *is* evidence of absence, provided the evidence was possible to find.
  *   **The Substantive Claim (Epistemic):** 'The evidence is hidden or we haven't looked hard enough.'
      *   *Plausibility:* Plausible for small, tight-lipped cells; implausible for hundreds of people over five years.
      *   *Verdict:* **Helps you.** The expected likelihood of a leak scales with the number of conspirators. If the programme existed, we should expect leaks. We have none.
  *   **The Self-Sealing Claim (Immunising):** 'The absence of evidence is proof of how effective the conspiracy is.'
      *   *Plausibility:* Epistemically vicious. It renders the theory unfalsifiable.
      *   *Verdict:* **Helps him only vacuously.** It protects the belief from revision but removes it from rational discourse. If success explains silence, and silence proves success, the argument is circular.

  **2. The Wrinkle: Leak Dynamics**

  You asked whether internal controversy matters more than the headcount. It does not.

  *   **The Math:** Even if the programme is uncontroversial (lowering the *motivation* to leak per person), the *opportunity* for accidental or malicious leaks grows combinatorially with every additional person involved.
  *   **The Verdict:** The sheer number of people swamps the controversy effect. With hundreds of participants, the probability of *zero* leaks over five years is statistically negligible if the programme exists. Therefore, the silence is strong evidence of non-existence.

  **Seminar Script**

  "I'd like to clarify the maxim 'absence of evidence is not evidence of absence'. Logically, it is true that lack of proof isn't disproof. But epistemically, it is false: if we expect evidence where a hypothesis is true, failing to find it lowers the probability of that hypothesis.

  My opponent is using the phrase to make a self-sealing claim: that the silence proves the conspiracy's effectiveness. This makes the theory unfalsifiable. Regarding the leaks: even if the programme isn't internally controversial, the combinatorial risk of hundreds of people keeping a secret for five years is so high that the silence constitutes strong probabilistic evidence that the programme does not exist. His defence relies on treating a probabilistic failure as a logical possibility."
