answer: |-
  Here is the triage procedure, reorganized for your analysts. It is designed to be run in SQL/Python with minimal logic training. It prioritizes stopping the bleeding (false denials/audit risks) over philosophical purity.

  ### The Contradiction Triage Procedure (v1.0)

  **Goal:** Move a ticket from "Contradiction Detected" to one of four buckets: **Close (Noise)**, **Flag (Operational Containment)**, **Escalate (Legal/Policy)**, or **Queue (Repair)**.
  **Inputs:** One contradiction ticket (Rule X says `True`, Rule Y says `False` for Predicate P on Household H).
  **Tools:** SQL access to rule table, dependency graph (parent/child rule IDs), and case data.

  ---

  #### Step 1: The "Ghost" Check (Validity)
  **Question:** Is this a real logical conflict, or a data/timing artifact?
  **Action:** Run these three checks. If *any* are true, close the ticket with the specified fix.

  1.  **Scope/Date Mismatch:** Do Rule X and Rule Y have different `effective_date` ranges or different `program_scope` tags?
      *   *If Yes:* **CLOSE.** Fix: Update indexing/metadata. This is a data error, not a logic error.
  2.  **Negation-as-Failure (NAF):** Is one side derived from an explicit assertion (e.g., `income_verified = false`) and the other from missing data (e.g., `income_verified` is NULL, defaulting to false)?
      *   *If Yes:* **CLOSE.** Fix: Data intake patch. Ensure required fields are populated before rules run.
  3.  **Threshold/Rounding:** Is the conflict driven by a value within 1% of a cutoff (e.g., $2 over limit)?
      *   *If Yes:* **CLOSE.** Fix: Standardize rounding logic in the pre-processor.

  *   **Stop Condition:** If all three are No, proceed to Step 2.
  *   **Analyst Note:** Do not spend more than 30 minutes here. If you can't prove it's a ghost, assume it's real.

  #### Step 2: The "Fire" Meter (Blast Radius)
  **Question:** If we let this contradiction sit, how much damage does it cause?
  **Action:** Query the dependency graph for Predicate P (the thing being contradicted).

  1.  **Downstream Count:** How many rules use Predicate P as an input?
      *   *Low:* < 5 rules.
      *   *High:* > 20 rules.
  2.  **Critical Path:** Does Predicate P feed directly into a `Payment_Amount`, `Denial_Code`, or `Overpayment_Flag`?
      *   *Yes:* Critical.
      *   *No:* Internal calculation only.
  3.  **Hub Status:** Is Predicate P used by multiple programs (SNAP + Cash)?
      *   *Yes:* Cross-program risk.

  **Scoring:**
  *   **Red:** Critical Path OR (High Downstream + Cross-program).
  *   **Yellow:** High Downstream OR Critical Path (single program).
  *   **Green:** Low Downstream, Internal only.

  *   **Stop Condition:**
      *   If **Green**: Go to Step 3 (Containment likely).
      *   If **Red/Yellow**: Go to Step 4 (Escalation likely).
  *   **Approximation Warning:** This measures *schema* dependency, not *data* frequency. A rule might feed 40 others but rarely fire. We accept this imprecision to save time; treat "High Count" as "High Risk."

  #### Step 3: Operational Containment (The Band-Aid)
  **Question:** Can we let the contradiction exist in the database but stop it from harming the human or the audit?
  **Action:** Determine if you can flag the case without changing the rule logic.

  1.  **Can we output a "Review Required" flag?** If the engine derives both `Eligible` and `Ineligible`, can the reporting layer catch this specific combination and route the case to a human queue *without* issuing a denial or payment?
      *   *If Yes:* **FLAG.** Ticket moves to "Manual Review Queue." Rule remains unchanged.
      *   *If No:* (e.g., the system automatically mails a denial letter based on the `Ineligible` derivation): Proceed to Step 4.
  2.  **Is the predicate load-bearing?** (Refer to Step 2 "Critical Path"). If the contradiction is on a variable used to calculate *dollars*, you usually cannot contain this operationally. The math will break.
      *   *If Math breaks:* Proceed to Step 4.

  *   **Hand-off Point:** If you choose **FLAG**, you are making a value judgment that "Delay is better than Wrong Decision." This is un-eliminable judgment. Document it and close the logic ticket.

  #### Step 4: The Authority Check (Policy vs. Bug)
  **Question:** Is this a coding error, or are the laws actually fighting?
  **Action:** Check the source authority for Rule X and Rule Y.

  1.  **Same Authority:** Do both rules cite the same Statute/Reg section?
      *   *If Yes:* This is a **Bug**. One implementation is wrong. Proceed to Step 5 (Repair).
  2.  **Conflicting Authority:** Does one cite a Court Order/Consent Decree and the other a State Reg/Policy Memo?
      *   *If Yes:* This is a **Policy Conflict**. Do not fix the code yet. **ESCALATE to Legal.**
      *   *Note:* This is not a dialetheia (true contradiction). It is a hierarchy problem. The Court Order *overrides* the Reg, but the Reg hasn't been repealed. The code needs to know the priority, not that both are "true."
  3.  **Vague Statute:** Do both rules cite different sections of a vague statute with no clear precedence?
      *   *If Yes:* **ESCALATE to Legal.** This requires a policy decision on which risk to take (Audit vs. Hunger).

  *   **Stop Condition:**
      *   If **Bug**: Go to Step 5.
      *   If **Policy Conflict**: **ESCALATE.** Ticket pauses until Legal provides a "Priority Directive."
  *   **Philosophical Guardrail:** Identifying a Policy Conflict does *not* mean we accept true contradictions. It means we acknowledge the system cannot resolve the conflict without external instruction. We are being paraconsistent (tolerating the conflict in the DB) while waiting for a monocratic decision (which rule wins).

  #### Step 5: Repair Queue (Prioritization)
  **Question:** Which bug fixes get the 5 slots/month Legal allows?
  **Action:** Assign priority based on Step 2 Score and Harm Type.

  1.  **Priority 1 (Immediate):** Red Blast Radius + Risk of Wrong Denial (Hunger).
  2.  **Priority 2 (High):** Red Blast Radius + Risk of Wrong Payment (Audit).
  3.  **Priority 3 (Medium):** Yellow Blast Radius.
  4.  **Priority 4 (Low):** Green Blast Radius.

  *   **Hand-off Point:** Choosing between Priority 1 and 2 is a value judgment (Hunger vs. Audit). If you have one slot and both exist, **ESCALATE to Management/Legal** to pick the risk profile. Do not decide this yourself.

  ---

  ### Running the Procedure on Your Queue

  #### Case (a): The $2 Overtime Limit
  *   **Step 1 (Ghost):** Check rounding. If one rule rounds up and one rounds down, this is a **CLOSE (Fix Rounding)**. If both round same way but interpret "gross income" differently: Proceed.
  *   **Step 2 (Fire):** Income predicates usually feed eligibility and payment calc. Likely **Yellow/Red**.
  *   **Step 3 (Containment):** Can you hold the case? If this triggers an auto-denial, No.
  *   **Step 4 (Authority):** Both trace to the *same* statutory section. This is a **Bug** (implementation drift), not a policy conflict.
  *   **Step 5 (Repair):** **Priority 1.** Risk of Wrong Denial is immediate harm. Same statute means Legal sign-off should be fast (no policy debate, just "which one matches the text?").
  *   **Verdict:** **Repair Queue (High Priority).** Do not flag. Fix the rule interpretation.

  #### Case (b): Court Order vs. Regulation
  *   **Step 1 (Ghost):** Dates likely differ (Order is newer), but if the Reg wasn't sunsetted, both are "active" in the table.
  *   **Step 2 (Fire):** Eligibility predicate. **Red.**
  *   **Step 3 (Containment):** If the system derives `Ineligible` (from Reg) and `Eligible` (from Court), and auto-denies, you cannot contain this.
  *   **Step 4 (Authority):** Conflicting Authority (Court vs. Reg). **ESCALATE to Legal.**
  *   **Step 5 (Repair):** Legal must issue a directive: "Deactivate Reg Rule for Class X." This counts as one of your 5 repairs/month.
  *   **Verdict:** **Escalate.** Do not attempt to "merge" these rules. The Court Order wins, but Legal must authorize disabling the Reg rule to avoid audit findings later.

  #### Case (c): The Felony Warrant (Legacy vs. Financial)
  *   **Step 1 (Ghost):** Unlikely to be rounding. It's a hard boolean flag.
  *   **Step 2 (Fire):** You found it feeds 40 rules, including Recovery and Recert. This is **Red (Hub Status)**.
  *   **Step 3 (Containment):** Because it feeds `Overpayment_Flag`, you cannot operationally contain this. If the system flags an overpayment based on the Warrant rule, and pays based on the Financial rule, you have a financial reconciliation nightmare.
  *   **Step 4 (Authority):** Likely Policy Conflict (Old Policy Memo vs. New Financial-Only Statute?). If the Warrant rule is legacy policy not in statute, it might be void. If it's statute, it conflicts. **ESCALATE to Legal** to confirm authority.
  *   **Step 5 (Repair):** If Legal confirms the Warrant rule is obsolete/invalid: **Priority 1.**
  *   **Verdict:** **This is your urgent one.** You suspected this was noise; the procedure flags it as a **Critical Risk**.
      *   *Reasoning:* A contradiction on a "Hub" predicate (used by 40 rules) means 40 downstream derivations are potentially unstable. Even if it's been there for years, it means 40 rules are operating on unstable logic. If an audit hits, they will trace the overpayment recovery logic back to this predicate.
      *   *Action:* Move to top of queue. Do not treat as harmless legacy.

  ---

  ### What This Procedure Cannot Do (Limitations)

  1.  **It Cannot Solve Value Conflicts:**
      *   Step 5 forces a choice between "Wrong Denial" (Hunger) and "Wrong Payment" (Audit). The procedure identifies the trade-off, but it cannot make the choice. If you have two Priority 1 tickets and one Legal slot, you must escalate to leadership. Do not let analysts guess.

  2.  **Step 2 is an Approximation (Schema vs. Data):**
      *   *Substitute:* You don't have a dynamic tracer. Use SQL `COUNT` on the rule dependency table.
      *   *What it gets wrong:* A predicate might feed 50 rules (High Count) but those rules only fire for 1 household a year (Low Data Impact). Conversely, a predicate might feed 2 rules that fire for 10,000 households.
      *   *Mitigation:* If Step 2 says "High Count," add a quick SQL check: `SELECT count(*) FROM case_history WHERE predicate_P_was_used`. If historical usage is near zero, downgrade the priority.

  3.  **It Cannot Enforce Logical Containment:**
      *   You noted that paraconsistency doesn't stop propagation in a standard forward chainer. This procedure accepts that. Step 3 (Operational Containment) is a *process* workaround (flagging the case), not a *logic* workaround. You are stopping the *consequence* of the contradiction, not the *derivation*.

  4.  **It Cannot Adjudicate "True" Contradictions:**
      *   If Legal says "Both rules must stand," the procedure forces you to Step 3 (Flag for Human Review). It will not allow the system to auto-decide. This increases manual queue load, which is the cost of honesty.

  ### Monday Morning Handoff Instructions

  1.  **Script Step 1:** Write a SQL query that checks `effective_date` overlap and `null` status for the conflicting predicates.
  2.  **Script Step 2:** Write a Python script that takes a Predicate ID, queries the `rule_dependencies` table, counts children, and checks if any child ID is in the `critical_outputs` list (Payment/Denial).
  3.  **The "Stop" Rule:** Tell your analysts: "If Step 1 clears, and Step 2 is Red, do not try to fix it. Escalate. Your job is triage, not surgery."
  4.  **Case (c) Warning:** Explicitly tell them the Felony Warrant contradiction is now treated as a **Critical Defect**, not legacy noise. Pull the ticket and run it through Step 4 immediately.
