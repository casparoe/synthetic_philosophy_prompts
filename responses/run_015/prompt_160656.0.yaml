answer: |-
  **Private Scratch Work**

  Distinctions surviving translation: Illocutionary point (what act type is attempted?), Convention (does the format carry force?), Authority (does the speaker hold the institutional role required?), and Uptake (did the designated record-keeper receive it?). These are externally verifiable.

  Distinctions failing translation: Sincerity (internal state is inaccessible), Perlocutionary effect (consequences vary too widely to standardize), and exact Propositional Content (paraphrase is inevitable under time pressure). We cannot adjudicate feeling or causal impact, only institutional status changes.

  Why: A committee needs defensibility, not philosophical depth. If we try to judge sincerity, we become mind-readers. If we judge perlocution, we become liable for unpredictable downstream effects. We must stick to the conventional power of the utterance within our specific institutional grammar.

  ***

  **OPERATIONAL DECISION PROCEDURE: UTTERANCE CLASSIFICATION**

  **1. Principle**
  We classify the institutional effect of an utterance based on its conventional force and the speaker's authority, not the speaker's internal intent or the audience's emotional reaction.

  **2. Five-Minute Triage Gate**
  Before full classification, log the case and answer three questions. If any answer is definitive, close the file.
  *   **Intelligibility:** Is the text coherent enough to assign a verb (e.g., "promising," "denying")? If no, log as "Unintelligible Noise" and close.
  *   **Relevance:** Does the utterance concern a record we maintain? If no, log as "External Matter" and close.
  *   **Convention:** Is the utterance in a channel we recognize as binding (e.g., official submission system, signed letter)? If yes, and the act is standard (e.g., standard withdrawal form), log as "Routine" and close.
  *   *If any answer is ambiguous, proceed to Main Procedure.*

  **3. Main Procedure**
  Ask these gates in order. Stop when a classification is reached.

  *   **Gate 1: Vehicle.** Was the utterance delivered via a channel conventionally tied to the act?
      *   *Sufficient Answer:* Yes (e.g., retraction form) or No (e.g., tweet).
      *   *Ambiguity:* If the channel is informal (email), treat as *provisional* until confirmed on official channel.
      *   *Outcome:* If No, the act is **Void** regarding institutional status.

  *   **Gate 2: Standing and Authority.** Distinguish the speaker's identity from their power.
      *   *Standing:* Is the speaker who they claim to be (e.g., listed author)?
      *   *Authority:* Does this role allow them to change the record (e.g., can a co-author retract the whole paper)?
      *   *Outcome:* If Standing fails, **Void**. If Authority fails, the act is **Performed but Ineffective** (e.g., a request rather than a command).

  *   **Gate 3: Illocutionary Point.** What act was attempted?
      *   *Sufficient Answer:* Assign one verb (Retract, Apologize, Withdraw Consent).
      *   *Ambiguity:* If multiple verbs fit, select the one with the highest institutional consequence.
      *   *Outcome:* Log the verb.

  *   **Gate 4: Uptake.** Who needed to hear this for it to count?
      *   *Hearer-Uptake:* Required for interpersonal acts (apologies). Did the aggrieved party receive it?
      *   *Record-Keeper-Uptake:* Required for status acts (retractions). Did the editor/indexer receive it?
      *   *Outcome:* If required uptake failed, the act is **Voidable** (performable but not yet effective).

  *   **Gate 5: Status Classification.**
      *   **Void:** No act of the relevant kind was performed (failed Vehicle or Standing).
      *   **Voidable:** Act performed, but subject to override (e.g., withdrawn under duress, pending verification).
      *   **Effective but Mis-recorded:** Act performed and effective, but our log errors (e.g., logged as "Retraction" instead of "Correction").

  *   **Gate 6: Prospective vs. Retrospective.**
      *   *Prospective:* Creates new status going forward (e.g., withdrawal of future consent).
      *   *Retrospective:* Records a defect that already obtained (e.g., retraction for error).
      *   *Effect on Citations:* If Retrospective, citations prior to the act are tainted by the defect. If Prospective, prior citations remain valid.

  *   **Gate 7: Performance vs. Adequacy.**
      *   Did the act occur? (Performance).
      *   Was it good enough? (Adequacy).
      *   *Outcome:* Classify Performance only. Hand Adequacy to senior editors for sanctioning. Do not conflate a bad apology with no apology.

  *   **Gate 8: Over-Attribution Guard.**
      *   Could the speaker reasonably reject the paraphrase?
      *   *Handling:* Exclude jokes, irony, quoted speech, and text composed by others (e.g., press office drafts) unless explicitly endorsed by the author. If non-native phrasing creates ambiguity, prefer the weaker force (e.g., "regret" over "admission").

  **4. Written-Record Template**
  "Case [ID]: Utterance classified as [Verb] performed by [Speaker] via [Vehicle] on [Date]. Standing: [Yes/No]. Authority: [Yes/No]. Uptake: [Secured/Pending]. Status: [Void/Voidable/Effective]. Temporal Effect: [Prospective/Retrospective]. Adequacy: [Referred to Editor]. Over-Attribution Check: [Passed/Failed]."

  **5. Field-Card Version**
  1. Channel valid? 2. Speaker authorized? 3. Act verb identified? 4. Right hearer received it? 5. Void/Voidable/Effective? 6. Time effect? 7. Adequacy separate? 8. Paraphrase fair?

  ***

  **CASE WORKINGS**

  **(a) Co-author email: "I can't vouch for the numbers in figure 3, take my name off it."**
  *   **Vehicle:** Email is informal but accepted for initial notice. *Pass.*
  *   **Standing/Authority:** Speaker is co-author (Standing Yes). Authority to remove self? Yes. Authority to retract paper? No.
  *   **Illocution:** Withdrawal of consent for authorship, not retraction of paper.
  *   **Uptake:** Corresponding author received it (Record-Keeper uptake pending).
  *   **Status:** **Voidable.** The act of withdrawing consent is performed, but the institutional record cannot change until verified.
  *   **Time:** Retrospective regarding authorship list; Prospective regarding liability.
  *   **Committee Action:** Log as "Withdrawal of Consent." Notify Editor. Do not retract paper yet. The corresponding author's reply ("I'll handle it") is a promise, not a completion.

  **(b) Blog post: "I'm sorry that people were upset by our paper."**
  *   **Vehicle:** Personal blog. *Fail* for institutional record.
  *   **Standing/Authority:** Author (Standing Yes). Authority to alter record? No.
  *   **Illocution:** Expression of regret. Not an admission of misconduct (does not say "we were wrong").
  *   **Uptake:** Public (Hearer uptake Yes). Record-keeper uptake No.
  *   **Status:** **Void** for institutional purposes. It is a social act, not an institutional one.
  *   **Performance/Adequacy:** Performance confirmed (they apologized). Adequacy is low (non-admission), but irrelevant for classification.
  *   **Committee Action:** Log as "External Expression of Regret." No change to paper status. Do not record as admission.

  **(c) Funder press release: "Withdrawn support... findings unreliable."**
  *   **Vehicle:** Press release. *Pass* for public record, *Fail* for journal retraction mechanism.
  *   **Standing/Authority:** Funder (Standing Yes). Authority to retract paper? No (per journal rules).
  *   **Illocution:** Withdrawal of endorsement. Committee wants "Retraction."
  *   **Status:** **Void** as retraction. **Effective** as endorsement withdrawal.
  *   **Committee Action:** You must not log this as a retraction. The procedure yields that the paper remains published unless authors/Editor retract. Log as "Funder Endorsement Withdrawn." Issue a notice linking the press release to the paper metadata, but do not change the paper's status to "Retracted." To do otherwise is to falsify the institutional record.

  ***

  **LIMITATIONS AND FAILURE MODES**

  This procedure cannot adjudicate cases where convention is absent or contested. It will misfire on:

  1.  **Irony and Sarcasm:** The Over-Attribution Guard relies on "reasonable rejection." In text-only media, irony is often indistinguishable from assertion. If the speaker claims irony later, the procedure cannot retroactively fix the initial classification without new evidence.
  2.  **Coercion and Duress:** The procedure classifies the act performed, not the conditions of performance. A retraction signed under threat is still classified as a "Retraction" (Effective) until a separate legal or ethical review declares it Voidable. The procedure lacks a gate for psychological state.
  3.  **Ambiguous Metaphor:** If an author says "This paper is a house of cards," is that a retraction? The procedure forces a verb assignment. This is a judgment call wearing the costume of a rule. In these cases, the committee should refuse classification and mark the case "Unclassifiable Pending Clarification."
  4.  **Collective Agency:** When a lab group speaks without a designated corresponding author, Standing is unclear. The procedure assumes identifiable agents. For diffuse groups, the committee must refuse to assign authority until a representative is named.

  Do not use this procedure to determine truth. It determines status. If the procedure forces a classification that feels morally wrong (e.g., Case C), trust the procedure. The error lies in the institutional rules, not the classification logic.
