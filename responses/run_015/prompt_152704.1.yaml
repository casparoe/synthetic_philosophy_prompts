answer: |-
  This is a sharp prompt. You're right to skip the "abolish vs. keep" normative fight; that's usually just ideology wearing data's clothes. If you have three years to contribute to *democratic theory* (rather than just political science), you need to focus on mechanisms that challenge or refine how we define democratic legitimacy, sovereignty, and stability.

  Here is the ranking of research lines by importance, based on **downstream dependence** (how much other theory relies on this answer) and **tractability** (can you actually make progress in 3 years?).

  ### 1. The Resilience of Unwritten Conventions Under Populist Stress
  **The Question:** Do conventional constraints on royal prerogative (e.g., the monarch *must* follow ministerial advice) hold when a populist executive tries to weaponize the crown to bypass parliament?
  **Why it's #1:** This is the upstream existential question. Constitutional monarchies operate on a "dual legitimacy" model: the government has democratic legitimacy, the monarch has historical/constitutional legitimacy. The system only works if the monarch's power remains dormant *unless* democracy is threatened, but remains potent *enough* to stop the threat.
  If conventions dissolve under pressure (e.g., a Prime Minister demands the dissolution of parliament against norm, and the monarch complies out of fear or complicity), the monarchy becomes a tool of autocratization. If the monarch resists, they become a political actor, undermining their neutrality.
  **Downstream Dependence:** High. If conventions are fragile, the "hidden democratic work" argument collapses because the mechanism is too dangerous to rely on. Every other question about symbolic value is irrelevant if the institutional fail-safe breaks during a crisis.
  **Tractability:** Moderate. You can't run experiments, but you can use comparative historical analysis of close calls (e.g., Australia 1975, Spain 1981, recent UK prorogation controversies) to model stress points.

  ### 2. Hereditary Neutrality as a Non-Electoral Accountability Mechanism
  **The Question:** Does the existence of a head of state who *cannot* be re-elected and *does not* need public approval actually alter the behavior of elected officials in measurable ways?
  **Why it's #2:** This challenges the core republican assumption that accountability flows only from the ballot box. The theory is that a monarch provides a "long-term" counterweight to the "short-term" incentives of election cycles. If monarchs can subtly signal disapproval or refuse ceremonial cooperation, does it curb executive overreach between elections?
  **Downstream Dependence:** High. If this is true, it forces democratic theory to acknowledge that *non-electoral* institutions can enhance democratic quality. If false, the monarchy is indeed just a "museum"—expensive symbolism with no causal power.
  **Tractability:** Low to Moderate. This is the hardest to prove causally. How do you measure the bill that *wasn't* passed because a King frowned at it? You'd need elite interviewing or process-tracing, which is methodologically tricky.

  ### 3. The Functional Value of Ambiguity in Government Formation
  **The Question:** In multi-party systems (like Scandinavia), does the monarch's technical role in appointing a government provide useful "cover" for coalition negotiations, or does it obscure responsibility?
  **Why it's #3:** This is about democratic transparency. In republics, the President (elected or parliamentary) often has clear rules for government formation. In monarchies, the "King's invitation" can depoliticize the messy math of coalition building. The question is whether this ambiguity helps democracy stabilize during deadlock or hides the real power brokers from scrutiny.
  **Downstream Dependence:** Medium. This matters mostly for parliamentary efficiency and coalition stability, less for the fundamental theory of sovereignty.
  **Tractability:** High. This is institutional design. You can compare negotiation times, coalition stability, and public trust metrics between Scandinavian monarchies and similar European republics (e.g., Finland, Germany, Iceland).

  ---

  ### Confidence and Uncertainty

  **Overall Confidence:** 75%
  I am confident in this ordering because the "Resilience of Conventions" question is the bottleneck. If the reserve powers don't work safely, the other benefits are academic curiosities. However, the subject matter involves counterfactuals (what *would* have happened without the monarch?), which limits certainty.

  **The Point I'm Least Sure About:**
  I am least sure about the **tractability of Research Line #2 (Non-Electoral Accountability)**.
  *Reasoning:* It is incredibly difficult to distinguish between a monarch influencing a politician and a politician using the monarch as a scapegoat. Much of the "hidden work" might be retrospective storytelling by elites to legitimize decisions they made for partisan reasons. If you build your paper on the assumption that monarchs exert independent informal influence, you risk building on an illusion that vanishes under empirical scrutiny. I would advise treating this as a hypothesis to be tested skeptically, rather than a premise.

  ### Strategic Advice for the Paper
  Since you have three years, don't try to solve all three. Use #1 as your framing device (the risk of the system), and use #3 (the Scandinavian ambiguity) as your empirical testing ground. It's easier to observe coalition formation than it is to observe "secret accountability." Leave #2 as the theoretical implication—what your findings *mean* for democratic theory—rather than your primary data hunt.

  And yes, I got the idea despite the typos. The "probly" didn't hurt.
