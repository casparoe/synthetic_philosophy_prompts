answer: |-
  # PHILOSOPHY OF MIND: THE CAUSAL EXCLUSION DECISION TREE
  **Case:** Grid Agent. Variable `thirsty` (M) realized by Voltage V1 (P). Agent walks to fountain (E).

  ### START HERE: DESCRIBE THE EFFECT
  **Q1. What exactly are we trying to explain?**
  *   **(A) The Fine Grain:** The *exact* pixel path, force, and time *t* of the movement.
      *   *Intuition:* V1 fixes the exact physics. `Thirsty` seems too vague.
      *   **→ GO TO BRANCH 1 (The Metaphysical Rescue)**
  *   **(B) The Coarse Grain:** The fact that the agent *reached the fountain* (regardless of path).
      *   *Intuition:* `Thirsty` tracks the goal. V1 is too specific (V2 would have worked too).
      *   **→ GO TO BRANCH 2 (The Causal Rescue)**

  ---

  ### BRANCH 1: THE METAPHYSICAL RESCUE (Fine Grain)
  *Premise: V1 definitely caused the exact movement. Is there room for `thirsty`?*

  **Q2. Is `thirsty` just a label for V1?**
  *   **YES:** `Thirsty` and V1 are the same thing.
      *   **LEAF: REDUCTIONIST / TYPE-IDENTITY**
      *   *Awkward Commitment:* You must deny multiple realizability; `thirsty` cannot exist in silicon (V2) or aliens.
  *   **NO:** `Thirsty` is distinct from V1.
      *   **→ GO TO Q3**

  **Q3. If V1 does all the pushing, does `thirsty` do anything?**
  *   **NO:** `Thirsty` is a passenger; V1 does all the work.
      *   **LEAF: EPIPHENOMENALIST**
      *   *Awkward Commitment:* Your own belief in this theory is caused by physics, not by your reasoning.
  *   **YES:** `Thirsty` is a cause.
      *   **→ GO TO Q4**

  **Q4. How can both cause the same effect without competing?**
  *   **(A) Two Independent Causes:** V1 causes it, and `thirsty` *also* causes it (systematic coincidence).
      *   **LEAF: OVERDETERMINATIONIST**
      *   *Awkward Commitment:* You believe the universe is miraculously arranged so mental and physical causes never conflict.
  *   **(B) Borrowed Power:** `Thirsty` causes it *in virtue of* V1 causing it (realization/inheritance).
      *   **LEAF: NON-REDUCTIVE PHYSICALIST (Token Identity/Inheritance)**
      *   *Awkward Commitment:* You must explain how a property causes something without adding new energy or forces.
  *   **(C) `Thirsty` Doesn't Exist:** There is no variable, only code and voltage.
      *   **LEAF: ELIMINATIVIST**
      *   *Awkward Commitment:* You must deny that you yourself have beliefs or desires, only neural states.

  ---

  ### BRANCH 2: THE CAUSAL RESCUE (Coarse Grain)
  *Premise: V1 is too specific to be the cause of "reaching the fountain".*

  **Q5. Why isn't V1 the cause?**
  *   **(A) The Mind Overrides Physics:** The mental state bypasses physical closure to push the body.
      *   **LEAF: EMERGENTIST / SUBSTANCE DUALIST**
      *   *Awkward Commitment:* You deny the causal closure of the physical; physics is not a closed system.
  *   **(B) Causation is About Difference-Making:** V1 didn't make the difference; changing `thirsty` would have changed the outcome, changing V1 (to V2) would not.
      *   **LEAF: INTERVENTIONIST / DIFFERENCE-MAKING COMPATIBILIST**
      *   *Awkward Commitment:* You must accept causes that are not physically connected to their effects (e.g., omissions).
  *   **(C) Causation Requires Proportionality:** V1 is too detailed; `thirsty` matches the effect's level of abstraction.
      *   **→ GO TO Q6 (The Gerrymander Check)**

  **Q6. If `thirsty` is proportional, what about `thirsty-or-it's-Tuesday`?**
  *   **It Also Causes:** Any property that tracks the effect is a cause.
      *   **LEAF: UNRESTRICTED PROPORTIONALITY**
      *   *Awkward Commitment:* Disjunctive, gerrymandered properties (like `thirsty-or-Tuesday`) count as genuine causes.
  *   **It Does Not Cause:** Only natural/nomic properties count, even if they track.
      *   **LEAF: RESTRICTED PROPORTIONALITY COMPATIBILIST**
      *   *Awkward Commitment:* You need a separate theory of "natural properties" to stop the flood of causes.

