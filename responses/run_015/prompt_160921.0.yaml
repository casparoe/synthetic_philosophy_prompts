  ### INSTRUCTOR NOTES & STRESS TEST

  **1. The "Grain" Conviction**
  You suspected the argument only bites at the **Fine Grain** (Branch 1).
  *   **If your conviction is right:** Branch 1 should feel unstable. Students should realize that explaining "exact pixel paths" is not how we normally attribute causation, pushing them to Branch 2.
  *   **If your conviction is confused:** Students will stick in Branch 1 because they feel the *metaphysical* threat (where does the energy come from?) regardless of grain.
  *   **Verdict:** The grain point is necessary but not sufficient. Even at the Coarse Grain, students worry about "Borrowed Power" (Branch 1B) vs "Difference Making" (Branch 2B). The tree exposes this by separating Branch 1 (Metaphysical relation) from Branch 2 (Causal relation).

  **2. Indistinguishable Pairs**
  *   **Overdeterminationist vs. Emergentist:** In this case, both posit two sufficient causes. The tree separates them by *closure* (Emergentist denies V1 is sufficient; Overdeterminationist accepts it). Students often conflate these.
  *   **Type-Identity vs. Inheritance:** Both claim the mental causes the effect via the physical. The tree separates them by *ontology* (Same thing vs. Distinct things). In practice, their causal predictions are identical.

  **3. The Debugger Wrinkle**
  Use Wrinkle (A) (Debugger intervention) at **Q5**. If students say "We can't change `thirsty` without changing V1," they are pushed toward Branch 1 (Metaphysical/Identity). If they say "Conceptually we can," they stay in Branch 2 (Interventionism).

  **4. Layout Tip**
  Print this in two columns. Branch 1 on the left, Branch 2 on the right. This visually reinforces the Metaphysical vs. Causal split.

