  The text is designed to fit one side of A4 if printed with 1.15 line spacing and standard margins. The ASCII structure above is logical; for the handout, use boxes and arrows. The "Awkward Commitment" sentences are designed to be provocative discussion starters for the tutorial immediately following the handout.
