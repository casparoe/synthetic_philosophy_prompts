answer: |-
  ### Translation Table: Species Concepts into Entity Resolution (ER) Vocabulary

  | Concept | ER Restatement | Distortion / Fudge | Inexpressible in ER |
  | :--- | :--- | :--- | :--- |
  | **Biological (BSC)**<br>*(Settled Textbook)* | **Transitive Closure over Relationship Graph.** Records merge if an edge exists (interbreeding). A species is a connected component isolated from other components. | **Potential vs. Actual:** BSC relies on *potential* interbreeding (compatibility), not just observed mating. ER usually links on observed data. You'd need a predictive model for the edge, not just a record link. | **Time:** BSC implies a historical process. ER clusters are usually timeless snapshots. |
  | **Ecological (ESC)**<br>*(Contested)* | **Attribute-Based Clustering.** Merge records based on similarity in "role" fields (habitat, diet, phenotype) rather than ID fields. Same "job" = same Golden Record. | **Dynamic Schema:** Niches shift. In ER, schema is static. If a customer changes industry, they don't become a new customer; if an organism shifts niche, ESC says it might be speciating. | **Causality:** ESC implies the niche *causes* the species boundary. ER correlation doesn't capture causal mechanisms. |
  | **Phylogenetic (PSC)**<br>*(Contested)* | **Hierarchical Survivorship Rule.** A cluster is valid only if it contains *all* descendants of a specific ancestor node (Monophyly). | **Tree vs. Graph:** PSC assumes a strict tree structure. ER handles graphs, but standard survivorship rules don't enforce "all descendants" constraints easily. | **Ancestral States:** PSC cares about the *path* (lineage). ER cares about the *state* (current attributes). |
  | **Morphological / Phenetic**<br>*(Settled Textbook)* | **Pairwise Similarity Threshold.** Merge if weighted attribute distance (size, shape, color) < threshold. Diagnosable = Unique combination of field values. | **Weight Subjectivity:** Which attributes get higher weights in the match rule? Biology debates this; ER usually hardcodes weights based on business rules. | **Discontinuity:** Morphology assumes gaps exist in nature. ER assumes gaps are data quality issues to be bridged. |
  | **Genotypic Cluster**<br>*(Contested)* | **Density-Based Clustering (e.g., DBSCAN).** Clusters are high-density regions in genotype vector space separated by low-density valleys. | **Thresholding the Valley:** How deep must the valley be? ER requires a hard cutoff; biology often treats this as a fuzzy statistical boundary. | **Mechanism:** Doesn't explain *why* the gap exists (selection vs. drift), just that it exists. |
  | **Species Pluralism**<br>*(Contested)* | **Domain-Specific Schemas.** Beetles use BSC logic; Bacteria use Genotypic logic. No global "Customer" schema, only local context schemas. | **Integration Cost:** In MDM, multiple schemas create integration debt. Pluralists accept this debt as ontologically necessary. | **Unified Reporting:** You cannot produce a single "Count of All Entities" report without arbitrarily choosing a schema. |
  | **Species as Individuals**<br>*(Philosophical)* | **Entity as Process.** The "Golden Record" is not a static bucket but a spatiotemporally bounded object composed of its parts (organisms). | **Part-Of vs. Instance-Of:** In ER, a Record *represents* a Customer. Here, an Organism is *part of* a Species. ER has no "part-of" relationship for the core entity. | **Birth/Death:** Species have speciation and extinction events. ER entities are usually created/merged/survived, not born/died in a biological sense. |

  ### Hard Cases Routed Through the Mapping

  *   **Asexual Groups:** The BSC match rule (interbreeding edge) returns null. You must fallback to Genotypic or Morphological rules. In ER terms: **Blocking key failure**, requiring a secondary matching strategy.
  *   **Prokaryotes (HGT):** Horizontal Gene Transfer creates edges between distant branches. The PSC hierarchy (tree) becomes a graph with cycles. In ER terms: **Referential Integrity Violation** in a hierarchical schema. A child record has two parents.
  *   **Ring Species:** Population A mates with B, B with C, ... Y with Z, but Z cannot mate with A. In ER terms: **Transitive Closure Failure.** The "Same Species" relation is not transitive. Your match graph contains a cycle that logically contradicts the cluster definition.
  *   **Fossil Sequences:** A continuous stream of records over time where every adjacent pair matches, but the start and end do not. In ER terms: **Arbitrary Cut-Points.** You must impose a business rule to split a continuous chain into distinct IDs, acknowledging the split is artificial.

  ### Residue Report

  Your first suspicion is correct: **ER presupposes Realism.** In MDM, we assume a "True Customer" exists, and our precision/recall measures distance from that truth. Translating species concepts this way imports that assumption. To express **Anti-Realism** (the view that species are human conveniences, not natural facts) in ER, you would have to model the "Golden Record" not as a discovery of territory, but as a **view definition**. The cost of dropping Realism in your framework is losing the ability to calculate error. You can no longer say a match is "wrong," only "inconsistent with the current view." This isn't just philosophical; it breaks your KPIs.

  Your second suspicion is also correct: **The Individual/Class distinction breaks the Record/Entity mapping.** In ER, a Record *denotes* an Entity (map/territory). In the "Species as Individuals" thesis (widely held in philosophy of biology, contested in practice), the Species *is* the object, and organisms are its temporal parts. Your vocabulary has no equivalent for a "thing whose instances compose it." The closest ER concept is a **Transaction Grouping**, but even that implies the group is secondary to the transactions. In biology, the Species is primary.

  **Is this missing piece useful?** For a working data modeler, **no**. You need to merge records to send bills or manage risk. You need stable IDs, not spatiotemporally bounded processes. The "Species as Individual" concept is a **philosopher's want**, not an engineer's. It solves ontological consistency but creates data management nightmares (how do you ID a moving target?). However, acknowledging the **Pluralism** is practically useful: it validates maintaining different match rules for different data domains (e.g., treating Vendor data differently than Customer data) without forcing a false global unification.

  **Epistemic Note:** The biology definitions above are **settled textbook material**. The application of these concepts (which one to use) is **heavily contested among systematists**. The "Species as Individuals" thesis is **standard in philosophy of biology** but often ignored by working biologists. My translation of the "Individual" thesis into ER terms is a **flagged guess**; there is no direct industry equivalent for a "process-entity," so I have approximated it using part-whole relationships which are typically secondary in MDM.
