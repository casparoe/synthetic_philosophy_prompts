answer: |-
  To understand where your friend stands on the boundary problem of the demos, we must first reconstruct the logical architecture underpinning her six previous verdicts. Her judgments reveal a sophisticated rejection of formal citizenship as the sole criterion for membership, yet she also resists a purely open-border 'all-affected-interests' approach. Below, I outline two competing theoretical principles that coherently explain her pattern of judgments, apply them to the new case, and offer a prediction based on the weight of her prior reasoning.

  ### Competing Theoretical Principles

  To make sense of her consistency, we can distil her verdicts into two plausible normative principles. Both account for the inclusion of resident citizens (Case 1), long-term non-citizens (Case 2), minors (Case 4), and indefinite refugees (Case 6), while explaining the exclusion of expatriates (Case 3) and temporary workers (Case 5). However, they diverge on the precise necessary condition for membership.

  **1. The Principle of Secure Subjection**
  This principle holds that membership in the demos is owed to all individuals who are physically present within the territory and subject to the state's coercive legal framework on an *indefinite* basis. The core moral intuition here is that it is unjust to be bound by laws one has no hand in making, provided that subjection is not transient.
  *   **Application to previous cases:** It explains the inclusion of Case 6 (indefinite leave) and Case 2 (permanent residence) because their subjection is open-ended. It explains the exclusion of Case 5 (fixed two-year contracts) and Case 3 (abroad) because their subjection is either temporary or non-existent domestically. It accommodates Case 4 (minors) as they are subject to parental and state authority indefinitely.
  *   **Key Criterion:** Security of stay and indefinite temporal horizon.

  **2. The Principle of Civic Embeddedness**
  This principle holds that membership belongs to those who are factually integrated into the social and economic reproduction of the community, evidenced by contribution (taxes, labour) and participation in local civic life. Here, the focus is on the *quality* of the relationship rather than the legal security of the stay.
  *   **Application to previous cases:** It explains the inclusion of Case 2 (advisory boards, taxes) and Case 6 (work, taxes, indefinite presence). It explains the exclusion of Case 5 because, despite working, they lack "long-term embeddedness" (social roots). It excludes Case 3 due to absence from the civic fabric.
  *   **Key Criterion:** Functional integration and social participation.

  ### Application to the New Case

  We must now test these principles against the group of climate refugees with "provisional ecological residency".

  *   **Under the Principle of Secure Subjection:** This group would likely be **excluded**. Their residency is explicitly provisional (five years, renewable once) with no guaranteed pathway to permanence. Unlike the refugees in Case 6 who have "indefinite leave", this group's legal status is designed to be temporary. The lack of an indefinite horizon means their subjection to the state is precarious, aligning them more closely with the temporary workers in Case 5.
  *   **Under the Principle of Civic Embeddedness:** This group would likely be **included**. They are physically present, required to work, pay taxes, and, crucially, attend "mandatory neighbourhood deliberative assemblies". This mandatory deliberation suggests a level of civic integration and participation that exceeds the temporary workers in Case 5 and rivals the advisory board participation in Case 2. Their functional role in the community is deep, even if their legal status is not.

  ### Prediction and Reasoning

  My prediction is that your friend would **exclude** this group from the demos.

  While the Principle of Civic Embeddedness offers a compelling argument for inclusion based on their deliberative participation, the weight of your friend's prior judgments suggests that the **Principle of Secure Subjection** is her dominant heuristic. The decisive factor in her reasoning appears to be the temporal security of the individual's presence rather than the depth of their daily participation.

  The closest analog among her earlier judgments is **Case 5 (Non-citizen temporary workers)**. In both Case 5 and the new case, the individuals are present, working, and paying taxes. In Case 5, she excluded them specifically because they lacked "long-term embeddedness", which in legal terms translated to a fixed two-year contract. In the new case, the "provisional ecological residency" is structurally identical to a fixed-term contract: it is temporary by design with no guarantee of permanence.

  Crucially, consider **Case 6**. The refugees there were included despite being legally barred from voting and citizenship. The distinguishing feature between Case 6 (Include) and Case 5 (Exclude) was not the right to vote (both were barred initially) nor the contribution (both work/pay taxes), but the **security of tenure** ("indefinite leave" versus "fixed two-year contracts"). Your friend prioritised the indefinite nature of their stay over the lack of formal rights.

  In the new case, although the climate refugees are engaged in deliberative assemblies (which might suggest embeddedness), their legal tenure is precarious and temporary. Given that she excluded temporary workers who were similarly affected by policy but lacked permanence, she will likely view the "provisional" status as the disqualifying factor. She likely views democratic membership as requiring a stake in the *future* of the polity, which is negated by a residency status that is explicitly transient. The mandatory assemblies may be viewed by her as administrative compliance rather than genuine democratic co-authorship, precisely because the participants know they may be required to leave after ten years.

  ### A Distinguishing Hypothetical Case

  To rigorously distinguish between the Principle of Secure Subjection and the Principle of Civic Embeddedness in your friend's mind, I propose the following hypothetical case:

  **The Indefinite Isolate:** Consider a group of non-citizen residents who have been granted indefinite leave to remain and pay taxes, but who, for religious or cultural reasons, live in complete isolation from the broader community. They do not attend local meetings, do not serve on boards, do not participate in deliberative assemblies, and intentionally minimise all social interaction with the wider polity, though they obey the law.

  *   **Prediction under Secure Subjection:** She should **include** them. They are subject to the state's coercion indefinitely, regardless of their lack of social integration.
  *   **Prediction under Civic Embeddedness:** She might **exclude** them. They lack the functional integration and participatory engagement that defines civic membership.

  If she includes the Indefinite Isolate, it confirms that security of stay is her primary boundary marker. If she excludes them, it suggests that active civic integration is the necessary condition, which would imply she might have included the climate refugees in the new case after all. Given her verdict on Case 6 (where refugees were included despite legal bars on voting), I suspect she would include the Indefinite Isolate, further confirming that permanence of residence is the key to her theory of the demos.
