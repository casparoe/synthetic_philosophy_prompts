      *   *Relation to Theme-Variation:* If nothing changes externally, is it variation? Maybe it's *potential* variation.
      *   *Relation to Frame Problem:* The Frame Problem is about knowing what *doesn't* change when an action occurs. Silent knobs are the inverse: knowing what *does* change internally when nothing happens externally. Or, more accurately, the computational cost of tracking irrelevant internal states.

