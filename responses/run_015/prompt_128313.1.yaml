  **Q&A PREP SHEET: Diachronic Agency in the Centipede Game**
  **Context:** Philosophy Colloquium | **Time:** 2 mins per reply max

  ### 1. The Formalization Objection (The Economists & Advisor)
  **The Charge:** "You haven't solved the Centipede paradox; you've dissolved the game structure. If the agent at $t_1$ isn't the agent at $t_{20}$, you no longer have a game between two players. You have a chain of distinct agents. Backward induction requires a single utility function maximized over time. If you break the agent, you break the math. What is your new solution concept?"
  **The Reply:** "You're right that standard BI collapses if we treat temporal slices as distinct players. But that's exactly the point: standard Rational Choice Theory (RCT) smuggles in a metaphysical assumption of diachronic identity that doesn't hold in high-stakes, long-duration negotiations. I'm not proposing a new equilibrium yet; I'm arguing the precondition for equilibrium—stable agency—is missing. In the farm negotiation, the 'father' at year one was protecting a legacy; the 'father' at year ten was protecting liquidity. These are conflicting utility functions incompatible with a single rational agent model. We need to model this as a sequence of distinct agents with overlapping interests, not one agent optimizing over time."
  **Where You're Soft:** You don't have the formal model yet. If they press for the math of "sequential distinct agents," you'll stall. You're offering a metaphysical critique without a game-theoretic alternative.

  ### 2. The Normativity Objection (Philosophers of Action)
  **The Charge:** "Rational choice is normative, not descriptive. It tells us what an agent *ought* to do to be consistent, not what they *will* do given psychological drift. Even if people feel different over time, backward induction remains the logical standard for coherence. Are you arguing BI is logically invalid, or just psychologically difficult?"
  **The Reply:** "I'm arguing that 'ought implies can' extends to 'ought implies being.' If the subject who is supposed to carry out the future move doesn't exist in the same form as the subject planning it, the normative force dissolves. You can't obligate a future self to a plan if the future self has different constitutive goals. In the farm case, the 'rational' move was defection, but that assumes the future agent values the same payoff structure. When identity shifts, logical consistency across time isn't a virtue; it's a category error."
  **Where You're Soft:** You're blurring the line between descriptive psychology and normative rationality. Philosophers will pounce on the claim that metaphysical identity changes normative logic.

  ### 3. The Preference Stability Objection (Behavioral Economists)
  **The Charge:** "Standard theory already accounts for changing utilities. We call them preference shocks or hyperbolic discounting. You don't need heavy metaphysics about 'identity' to explain why someone defects later than predicted. Why posit a changing self when changing preferences explains the data parsimoniously?"
  **The Reply:** "Preference changes assume a stable container holding the preferences. I'm arguing the container itself fractures. In a decades-long negotiation, the shift isn't just 'I value money more now.' It's 'I am no longer the person who entered this negotiation.' Preference models treat this as noise; I'm treating it as structural. If the agent changes, the strategic interaction changes from intra-personal planning to inter-personal bargaining with oneself."
  **Where You're Soft:** Distinguishing "changing preferences" from "changing identity" is notoriously difficult empirically. They will ask for the operational difference.

  ### 4. The Common Knowledge Objection (Your Advisor)
  **The Charge:** "Backward induction relies on common knowledge of rationality. For your critique to work, must Player A know that Player B's identity is shifting? If they don't know, BI still holds based on their *beliefs* about the agent. Did your parents know they were becoming different people?"
  **The Reply:** "They didn't need explicit knowledge. The breakdown of common knowledge happens when the stability of the agent is no longer a shared assumption. In long negotiations, the uncertainty isn't just about the other's payoff, but about the other's *continuity*. If I suspect you'll be a different person in five years, I can't induction backwards from your future move. The 'common knowledge' frame assumes stable entities; removing that stability undermines the epistemic foundation of the game."
  **Where You're Soft:** You're stretching "common knowledge" to cover metaphysical uncertainty. Your advisor knows the technical definition better than you do.

  ### 5. The Psychological Continuity Objection (Philosophers)
  **The Charge:** "Even if strict identity fails, psychological continuity suffices for rational planning. As long as there's overlapping memory and intention, the agent is stable enough for game theory. You're setting the bar for identity impossibly high."
  **The Reply:** "In short games, continuity is fine. In decades-long disputes, the overlap breaks. When the original motivation (legacy) is completely replaced by a new one (survival), the psychological continuity is too thin to support the weight of backward induction. The 'chain' of selves is too weak to transmit rational obligation across the timeline."
  **Where You're Soft:** This is a philosophical quagmire. You don't want to get stuck defining "too thin."

  ### 6. The Predictive Power Objection (Economists)
  **The Charge:** "Okay, say BI fails. What does your model predict? Does it predict cooperation? Defection? Chaos? If you can't generate a testable hypothesis, you've just added metaphysics without increasing explanatory power."
  **The Reply:** "It predicts instability at nodes where identity shifts are most salient. In the Centipede Game, this means cooperation persists until the cost of maintaining the 'old self' outweighs the payoff. It predicts defection not at the start, but at the moment of identity fracture. It explains the 'late game' defection we see in experiments better than BI's immediate defection."
  **Where You're Soft:** You haven't run the experiments. You're extrapolating from one anecdote (the farm).

  ### 7. The Ecological Validity Objection (Everyone)
  **The Charge:** "A family farm negotiation involves asset specificity, emotional history, and incomplete information. The Centipede Game is controlled. You're applying a critique derived from a messy real-world case to a abstract logical model. That's a category error."
  **The Reply:** "The Centipede Game is supposed to model sequential trust and rationality over time. If the model fails when time scales expand to realistic human durations, the model is limited, not the reality. I'm using the farm to highlight a boundary condition of the theory. If RCT can't handle decades, it's not a general theory of rational action."
  **Where You're Soft:** They are right. One anecdote isn't data. You're generalizing from N=1.

  ### 8. The Projection Objection (The One You Fear)
  **The Charge:** "Isn't it possible you're projecting the emotional trauma of your parents' divorce onto decision theory? Are you finding a metaphysical crisis because you lived through one, rather than because it exists in the math?"
  **The Reply:** "Personal experience motivated the question, but the argument stands on its own logical merits. Many breakthroughs come from noticing where formal models clash with lived reality. Whether I found this through a farm or a lab, the structural critique of diachronic agency in game theory remains valid. The origin of the hypothesis doesn't invalidate the logic."
  **Where You're Soft:** This is the hardest one. If you get defensive, you look biased. If you get too clinical, you look disconnected. Keep it brief and pivot back to the logic immediately. Don't linger.

  ***

  **General Advice:**
  *   **Don't apologize** for the lack of formal model yet; frame it as "future work."
  *   **Lean into the Philosophy:** The economists will want math; the philosophers will want concepts. Play to the philosophers since it's their dept, but don't alienate the economists.
  *   **Watch the Clock:** If you talk too long on #1, you'll look evasive on #8.
  *   **Breath:** You know the material. The farm story is your anchor. Use it to ground the abstract stuff.

  Good luck. You've got this.
