answer: |-
  This is a sharp observation, and your supervisor is half-right: it *is* in the attribution literature, but it sits at the intersection of three distinct streams that rarely talk to each other. There is no single canonical term for the specific *structural* property you are describing (the unfalsifiability), though the *content* of the attribution is well-trodden.

  Here is the breakdown of what you have, how it differs from the standard concepts, and how to operationalize it.

  ### 1. Is there a name?
  There is no single established label for the "no-possible-evidence" structure regarding motive attribution. However, you are describing a specific configuration of three known phenomena:

  1.  **Motive Attribution Asymmetry (MAA):** (Waytz, Young, & Ginges, 2014). In-group motives are attributed to love/principle; out-group motives to hate/interest. You correctly noted this doesn't capture the *epistemic structure* (the immunity), only the direction.
  2.  **The Ultimate Attribution Error (UAE):** (Pettigrew, 1979). Negative out-group behavior is internal/stable; positive out-group behavior is external/unstable. Your data extends this to *strategic* vs. *principled* intent.
  3.  **Identity-Protective Cognition:** (Kahan et al.). The mechanism driving the immunity.

  If you need a label for your dissertation, I recommend coining **Asymmetric Attributional Falsifiability** or **Attributional Immunity**.
  *   **Definition:** A cognitive structure wherein evidence of good faith from an out-group member is systematically reinterpreted as strategic maneuvering, rendering the attribution of "bad faith" effectively unfalsifiable, unless the actor incurs verifiable intra-group costs.
  *   **Why this label?** It distinguishes your work from MAA. MAA says "we think they are hateful." You are saying "we hold a prior on their honesty that is immune to standard updating."

  *(Note: You may encounter the colloquial term "Kafkatrapping" in online discourse regarding the meta-level immunity—where denying the accusation proves the guilt. Do not use this in your writing; it carries too much political baggage. Stick to the cognitive architecture.)*

  ### 2. Conceptual Breakdown: One Thing or Three?
  You asked if this is one phenomenon or mashed together. It is **one underlying mechanism (Identity Protection) operating across two levels, moderated by a third (Signaling).**

  *   **Level 1 (The Behavior):** This is standard Motive Attribution Asymmetry. However, the *bidirectional* nature (conceding = tactical; not conceding = rigid) makes it a **Double Bind**. In communication theory, a double bind is a situation where a person receives contradictory messages and cannot win. Here, the *observer* imposes a double bind on the *target*.
  *   **Level 2 (The Meta):** This is **Recursive Identity Protection**. Pointing out the bias is treated as an attack on the group's epistemic authority. "If you say I'm being unfair to them, you are minimizing their threat/our virtue."
  *   **The Moderator (The Cost):** This is the most theoretically rich part. Your intuition is correct: this isn't blind hatred; it's a **Threshold Model of Credibility**.
      *   In-group signal cost: Low threshold. (Principle is assumed).
      *   Out-group signal cost: Extremely high threshold. (Strategy is assumed).
      *   **The Breakpoint:** When the out-group member pays an *intra-group* cost (e.g., gets primaried, cancelled, or ostracized by their own side), the signal becomes **Costly** in the evolutionary sense. It can no longer be easily modeled as "tactical" because tactics usually aim to preserve status within the tribe.

  **Theoretical Integration:** You can model this using a **Bayesian framework**.
  *   Participants have a **Prior** $P(\text{Good Faith} | \text{Out-Group}) \approx 0$.
  *   Standard concessions have a **Likelihood Ratio** near 1:1 (equally likely to come from a good-faith actor or a strategic actor).
  *   Because the Prior is so low, the **Posterior** remains low.
  *   **Intra-group cost** changes the Likelihood Ratio. A strategic actor is *unlikely* to incur high intra-group cost. Therefore, $P(\text{Costly Concession} | \text{Strategic})$ drops, and the Posterior updates.
  *   **Your Contribution:** You are arguing that for polarized partisans, the Prior is not just low, it is *protected* by a motivated reasoning process that adjusts the Likelihood Ratio dynamically to maintain the Posterior.

  ### 3. Differentiation from Standard Concepts
  You were right to reject Naive Realism and Hostile Media Effect. Here is the precise boundary:

  *   **Vs. Naive Realism:** Naive realism posits that I see the world as it is, and you see it through bias. Your phenomenon is about *intent*, not facts. Naive realism explains why I think your *policy* is wrong. Attributional Immunity explains why I think your *argument* is a trick.
  *   **Vs. Hostile Media Effect:** HME is about *content perception* (this article is biased against me). Your phenomenon is about *actor attribution* (this person is lying to me).
  *   **Vs. Motive Attribution Asymmetry:** MAA describes the *outcome* (I attribute love, you attribute hate). Your phenomenon describes the *process* (I will reinterpret any evidence to maintain the hate attribution). MAA is the *what*; Attributional Immunity is the *how*.

  ### 4. Experimental Separation: Belief vs. Rule
  This is the critical methodological challenge. How do you distinguish "I genuinely believe they are liars" (a model of the world) from "I am running an evidence-immune rule" (a cognitive heuristic)?

  **Design 1: The "What Would Change Your Mind" (WWCYM) Protocol**
  *   **Condition A:** Ask participants: "What would [Out-Group Leader] have to do to prove they are arguing in good faith?"
  *   **Condition B:** If they specify a condition (e.g., "Apologize for X"), present a vignette where that condition is met.
  *   **Condition C:** If they say "Nothing," or if they reinterpret the met condition (as in your pilot), code as **Immune Rule**.
  *   **Crucial Twist:** Include a condition where the cost is *objectively verifiable* and *exogenous*. For example, the out-group author loses a lucrative book deal or is fired by their own network for the concession. If they still attribute bad faith ("They were going to be fired anyway, so they pivoted"), you have evidence of a hard rule, not just a strong prior.

  **Design 2: The Independent Verifier Manipulation**
  *   Participants read the out-group op-ed.
  *   **Control:** No extra info.
  *   **Treatment:** "Independent fact-checkers/peers from *your own party* have analyzed this statement and confirmed it represents a genuine shift in position, not a tactic."
  *   **Logic:** If it's a **Strong Prior**, third-party verification from the in-group should update the belief. If it's an **Immune Rule**, participants will discount the verifier ("The fact-checkers are also woke/corrupt").
  *   **Measurement:** Measure the *credibility of the verifier*. If the credibility of the verifier drops in the treatment condition compared to a neutral baseline, that is evidence of the meta-level immunity.

  **Design 3: Cognitive Load (The Motivated Reasoning Test)**
  *   Motivated reasoning (the "work" of reinterpreting evidence to protect the identity) requires cognitive resources.
  *   **Method:** Run the pilot study under **High Cognitive Load** (e.g., remember a 7-digit number while reading).
  *   **Prediction:**
      *   If it is a **Genuine Belief** (a stored schema), load should not change the attribution much. It's automatic.
      *   If it is an **Immune Rule** (active reconstruction of motive), load should reduce the ability to generate the "tactical" explanation. Under load, they might default to a simpler heuristic (e.g., "They conceded, so maybe they're okay").
      *   *Alternative Prediction:* Under load, they might default to the *strongest* prior (Out-group = Bad). This distinguishes between "active reinterpretation" and "default negativity."

  ### 5. Where are the edges? (A Non-Example)
  To define a concept, you must know what it is *not*.

  **Case that counts as Attributional Immunity:**
  > A Democrat reads a Republican op-ed. The Republican admits, "The tax cut didn't stimulate growth as promised." The Democrat says, "He's only saying that because the election is close and he needs swing voters." (Reinterpreting evidence).
  > The Republican *does not* mention taxes. The Democrat says, "He's hiding the failure." (Interpreting absence of evidence).
  > The researcher points this out. The Democrat says, "You're trying to gaslight me about their corruption." (Meta-immunity).

  **Case that does NOT count (Genuine Belief / Strong Prior):**
  > A participant believes the out-group is lying. You show them a video of the out-group member privately confessing to a friend, "I don't actually believe this policy, I'm just saying it to win."
  > The participant says, "Oh, I didn't know that. Okay, they are lying."
  > *Why this isn't Immunity:* The belief updated when presented with **diagnostic evidence that could not be plausibly reframed as public strategy.** Attributional Immunity requires the *reinterpretation* of the evidence, not just a lack of evidence.

  **Case that does NOT count (Principled Skepticism):**
  > A participant says, "I require three instances of policy follow-through before I trust them."
  > *Why this isn't Immunity:* This is a **falsifiable rule**. It specifies a condition for updating. Attributional Immunity moves the goalposts *after* the condition is met.

  ### 6. Summary for your Dissertation
  You are identifying a **structural barrier to depolarization**. Most interventions assume that if we provide evidence of common ground or nuance (concessions), polarization will decrease. Your data suggests that for high-identity partisans, **nuance from the out-group is processed as a more sophisticated form of conflict.**

  **Proposed Terminology:** **Asymmetric Attributional Falsifiability.**
  **Key Mechanism:** **Intra-group Cost Signaling.**
  **Contribution:** Moving beyond *what* motives are attributed (MAA) to *how resistant* those attributions are to counter-evidence.

  This is publishable. It refines the UAE for the modern affective polarization context, where "good faith" is the primary currency of democratic trust. If you can formalize the "Cost" moderator, you have a mechanism for intervention (i.e., highlighting intra-group costs may be the only way to breach the immunity).
