answer: |-
  Sir, you have construed my *Querist* with a sharp eye, yet you mistake the intent of my nineteenth Query. I asked whether the Irish were kept from thriving by a cynical content in dirt. I did not blame the man, but the condition. Where circulation stops, industry dies. If your members are pinned at the debit limit, willing to work but finding no takers, they are not the beggars I queried. They are victims of a choked vein. The fault lies not in their will, but in the obstruction of credit. You say they are not idle; I believe you. Then the mechanism must be adjusted to loose their hands.

  You ask me to judge your measures. First, the rule that every hour is worth every other. Here I hesitate. I hold that power should accord with just pretensions. Is the labour of a skilled mason truly equal to that of a novice? If this equality discourages the acquisition of skill, it dampens the very industry you seek to stir. Industry follows the fashion of betters; if you flatten all distinction, you may remove the incentive to excel. Yet, if it is the custom of your town, and industry follows custom, I shall not condemn it outright, provided it does not breed resentment among the most productive.

  Second, the charge upon idle balances. This I bless. Money is a ticket, not wealth. When a ticket is hoarded, it ceases to stir industry. You have rightly identified that large credits spent nothing are a stagnation. To tax the idle is to compel the circulation of credit, which is the lifeblood of wealth. Those who left you complained of a fine for being wanted; I say they were fined for obstructing the flow. A drone may be expelled, but a hoarder starves the network.

  Third, the proposal to create hours for the bakery. You propose credit against labour still to come. This is the essence of money as a ticket. It is a promise to command future industry. If the oven increases the bakery's output, wealth is created. However, you say money is honoured only where there is real power to command industry. Can your committee ensure the baker performs? If the promise is hollow, the ticket is false.

  You claim the ledger is money and coin an idol. I concede this. The metal is nothing; the credit is all. But you say a committee tells grown tradespeople how much they may promise. This is civil order. Without it, promises are wind. Yet, who watches the committee? If they act arbitrarily, trust dissolves, and the ticket loses its power.

  I have two questions regarding your mechanism. First, by what authority does your committee expel a member, and is this power accepted by all as just? Second, regarding the bakery:

  If the baker fails to labour the promised hours, what penalty ensures the ticket does not become a lie?
