  1. Engineering framing
  The core engineering challenge is specifying a function that maps current user states to target objectives under counterfactual conditions of improved knowledge and reasoning. The system must act on behalf of users not as they are, but as they would be if more informed and coherent. Standard philosophical taxonomy fails here because terms like volition or realism do not translate into loss functions, constraint boundaries, or update rules. A builder needs to know whether the architecture permits value drift, how it handles conflicting extrapolations, and whether current preferences act as hard constraints or soft priors. Misalignment risks arise from ambiguous specifications regarding whether the system should preserve current identity or optimize for hypothetical satisfaction. This instrument translates metaphysical debates into modular design choices, enabling the selection of an aggregation architecture based on risk tolerance and operational scope rather than academic lineage, ensuring the implementation matches the intended governance model.

  2. The branching instrument
  Node 1 defines the extrapolation scope. Branch 1A restricts output to a single user's extrapolated state, isolating the objective function to one identity. Branch 1B aggregates across a bounded collective, such as current stakeholders, requiring summation or voting mechanisms. Branch 1C extends authority to open-ended future generations not yet present, introducing uncertainty about future preference structures. This choice determines the input domain for the aggregation function and the weight given to temporal distance.

  Node 2 specifies the target of idealization. Branch 2A limits corrections to instrumental reasoning and factual beliefs, holding final utilities fixed as immutable constants. Branch 2B permits the revision of fundamental values themselves if deemed inconsistent, immature, or ill-informed. This distinguishes between fixing errors in calculation versus fixing errors in desire, fundamentally altering the convergence target.

  Node 3 applies the tight versus loose culture axis. Branch 3A enforces tight constraints, penalizing any deviation from current core preference structures as unacceptable identity loss. Branch 3B adopts loose constraints, permitting radical restructuring of the preference graph if global coherence increases. This functions as a regularization term on value drift, determining whether the system acts as a preserver or an optimizer of the self. Branch 3A requires a distance metric measuring divergence from initial state, whereas 3B requires a coherence metric measuring internal consistency.

  Node 4 resolves interdependence. Branch 4A computes coherence agent-by-agent, treating preferences as isolated vectors optimized independently. Branch 4B requires consistency with others' extrapolated preferences, introducing a mutual adjustment layer where one agent's idealization depends on another's. This determines if the solution is a set of independent optima or a negotiated equilibrium.

