answer: |-
  This is a fascinating argument because you and your friend have inadvertently recreated one of the most famous experiments in the history of cognitive psychology, and you are currently debating one of the hottest unresolved topics in the philosophy of mind.

  You are describing **George Sperling's 1960 partial-report experiment**.

  Here is the breakdown of who is right, why the brain scanner won't settle it, and exactly what you need to say to resolve the bet.

  ### 1. The Science: You are both describing "Iconic Memory"
  Your friend is correct that the information is there. When the grid flashes, the visual system creates a high-capacity, high-fidelity snapshot called **iconic memory**. This matches her experience: it feels like a rich image is present.

  However, you are correct that this does not equate to **conscious awareness** in the way we usually use the word. Iconic memory decays in less than a second. To become "conscious" in a functional sense (what you can think about, speak, or use), that information must be transferred into **visual working memory**, which has a capacity of only about 3 to 4 items.

  **The Verdict on the Game:**
  *   **Her claim:** "I saw all 12."
  *   **Scientific reality:** Her retina and early visual cortex registered all 12. Her *iconic memory* held all 12 for a fraction of a second. But her *conscious access* (the ability to identify, name, or use them) was limited to 3 or 4.
  *   **Why the partial report doesn't prove her point:** The fact that she can name a random row proves the *information* was available in sensory storage. It does not prove she was *consciously aware* of all 12 letters simultaneously. Most cognitive scientists argue that the "feeling" of seeing everything is an **illusion of richness**. We assume the detail is there because we can access it if cued immediately, but until it is cued, it is not part of our conscious narrative.

  ### 2. The Brain Scanner: Why her proposal fails
  Your intuition is correct: her proposal to use a brain scanner "quietly assumes the very thing we are arguing about." Here is the specific argument you need to use with her.

  **Argument A: Activity $\neq$ Consciousness**
  Brain regions "lighting up" only proves neural processing, not conscious experience.
  *   **Example:** In **subliminal priming** experiments, images are flashed too quickly for people to see. Yet, those images still activate the visual cortex and can influence behavior (e.g., priming a word). If "lighting up" proved consciousness, subliminal perception would be impossible. It isn't.
  *   **Example:** People with **blindsight** have damage to the visual cortex. They say they see nothing, yet they can guess the location of objects accurately. Their brain is processing the info, but they lack the consciousness of it. Conversely, activity can occur without awareness.

  **Argument B: The Calibration Problem**
  She suggests running the scanner "while she is not being asked to report anything." This makes the data useless for this specific argument.
  *   To know if a specific brain pattern equals "consciousness," scientists must **calibrate** the scanner against a report. They need her to say, "I saw it," to correlate that subjective state with brain activity.
  *   If she doesn't report anything, you have no way of knowing if the brain activity corresponds to *seeing* the letters or just *processing* them unconsciously. You cannot use the scanner to define consciousness if you have removed the only measure we have of consciousness (the subject's report).

  ### 3. The Philosophical Stalemate (Access vs. Phenomenal)
  You are stuck because you are arguing past each other using two different definitions of "consciousness," a debate known as **Access Consciousness vs. Phenomenal Consciousness.**

  *   **Your view (Access Consciousness):** Information is only conscious if it is available for reasoning, reporting, and rational control. (Championed by philosophers like Daniel Dennett and Stanislas Dehaene). By this definition, **you win.** She could not access the info, so she didn't consciously see it.
  *   **Her view (Phenomenal Consciousness):** There is a "what it is like" to experience the world that exists even if you can't talk about it. She feels the richness of the grid. (Championed by philosophers like Ned Block). By this definition, she feels she wins.

  However, even in the "Phenomenal" camp, the Sperling task is not considered proof. The prevailing scientific view is that the *feeling* of richness is a meta-cognitive judgment, not proof of actual high-resolution conscious data.

  ### 4. How to Settle the Bet
  Since the bet is "embarrassingly large," you need a resolution that acknowledges the nuance without bankrupting either of you.

  **Tell her this:**
  > "We have accidentally recreated Sperling's 1960 experiment. The scientific consensus is that you are experiencing **iconic memory**, which is a pre-conscious sensory buffer. It holds the data, but it isn't 'conscious sight' yet.
  >
  > Regarding the scanner: Neural activity happens during unconscious processing too (like subliminal priming). Without your report to calibrate the machine, we can't distinguish unconscious processing from conscious seeing. So the scanner can't settle it.
  >
  > Here is the compromise: You are right that your brain *registered* all 12 letters. I am right that you were not *consciously aware* of all 12 in a way that allows for thought or action. The bet hinges on the definition of 'saw.' If 'saw' means 'photographed by the retina,' you win. If 'saw' means 'entered your conscious mind,' I win."

  **The Practical Solution:**
  If you must have a winner: **You win.**
  In cognitive science, "seeing" generally implies **perception**, not just **sensation**. Sensation is the raw data (which she had); perception is the organized, conscious interpretation (which she lacked for 8 of the letters). The partial report task proves the *availability* of information, not the *consciousness* of it.

  **Suggested Split:**
  Given that this is a genuine, unresolved debate in neuroscience (the "Overflow Hypothesis"), the most honest outcome is to **split the bet**. Tell her that if a brain scanner could settle this, Nobel prizes would have been awarded already. The fact that experts still argue about whether iconic memory is conscious means neither of you can claim definitive victory.

  **Summary for your friend:**
  1.  **Sperling (1960)** already did this. It proves **Iconic Memory**, not full consciousness.
  2.  **Brain activity** occurs during unconscious processing (subliminal stimuli); activity does not equal awareness.
  3.  **Scanner without report** is uncalibrated; you can't know what "conscious" looks like on the screen without the subject saying what they experience.
  4.  **Consensus:** High-capacity sensory storage exists, but conscious capacity is limited to ~4 items. She felt the former; you argued for the latter. Both are real, but they aren't the same thing.
