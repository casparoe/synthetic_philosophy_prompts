      *   *Analysis:* This is a strong philosophical move (reminiscent of Wittgenstein or phenomenological critiques).
      *   *Disanalogy:* Phenomenal immediacy. I *feel* my pain; I only see your behavior. Even if I don't infer a "substance," the *qualia* are directly accessible to me, not to you.
      *   *Counter:* The user argues that "substantial self" is the inference. I have access to *thoughts*, not a *thinker*. You have access to *behavior*, not a *thinker*. So regarding the *thinker*, we are symmetric.
