      *   *Correction on Q2:* Be specific about *why* CDT/EDT is tricky. It's about *causation*. The *Cogito* isn't about causing thoughts, but existing as their locus. Maybe suggest "type-token distinction" instead.
      *   *Correction on Q3:* Emphasize the "Privileged Access" objection. The user needs to concede I have privileged access to *tokens* of thought, just not the *type* (substance).

  8.  **Final Polish:** Check against the user's constraint ("analytically trained but not necessarily steeped in Descartes scholarship"). Ensure the language is precise but not overly jargon-heavy regarding 17th-century scholasticism. (e.g., explain *res cogitans* briefly).

