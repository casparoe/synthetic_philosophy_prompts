  Your intuitions cohere under **Task-Relative Causal Isomorphism**. The only risk is if you intend "Mechanistic Anomaly Detection" to detect *architectural* changes regardless of task. If so, Case 4 is a false negative. If your goal is to detect changes that *matter for the system's purpose*, your intuitions are correct, and you should formalize the "Task-Relative" clause to avoid future confusion.
