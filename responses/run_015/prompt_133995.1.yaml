prompt: |-
  hey — so I'm in this moral psych seminar and I've got to lead one 45-minute discussion section next week on the cross-cultural variation stuff and what it's supposedly supposed to show about whether morality is objective. The prof has banned trolley problems in section (everyone's sick of them) so I can't use one, which is most of what I'd have reached for.

  The thing I actually want them to get is a distinction the prof made in lecture that half my section seemed to sleep through: there's a difference between (a) people disagreeing about how much weight to give a consideration that everyone in the disagreement already counts as a moral reason, and (b) people disagreeing about whether some consideration is a moral reason at all — like whether loyalty to your kin, or not touching something that's taboo, or deferring to elders, is even the kind of thing that can be a moral reason. Only (b) looks like it might threaten objectivism at all; (a) is compatable with basically every view on offer. And the readings we did can't separate the two, because 'people answered differently on the survey' is consistent with either one.

  So don't explain the distinction to me — plan how I teach it. What has to be on the board before the (a)/(b) split even means anything to them? What's the one example that should carry the whole session — it needs to be a case where my students won't already agree that the consideration in play is a moral one, so that 'is that morality or just custom/manners?' is genuinely live for them, and it can't turn on harm. What do they walk in believing — I'm guessing either 'science found differences, so morality is relative lol' or 'sure, but deep down everybody knows X is wrong' — and at exactly which point in the sequence do I block each? There's one thing I think I have to name and then kill: treating each study's sample as one independent vote, when a lot of the societies in these samples share ancestors and borrowed from each other. Where in the session does that go?

  Also: one question I can ask at the end that tells me they got the distinction rather than just the vibe, and flag the places where your plan leans on a contestable reading of 'objective' or of what the cross-cultural findings actually show. Last thing — what would make you throw out the ordering and rebuild it? Like what's the one thing about the students, or about the material, that would change your plan most.
reasoning: |-
  Here's a thinking process that leads to the suggested discussion plan:

  1.  **Analyze the Request:**

      *   **Context:** Moral Psychology seminar, 45-minute discussion section.
      *   **Topic:** Cross-cultural variation in morality and its implications for moral objectivism.
      *   **Constraint:** No trolley problems (prof banned them).
      *   **Core Learning Objective:** Distinguish between (a) disagreement about *weight* of shared moral reasons vs. (b) disagreement about *what counts* as a moral reason (the "domain" of morality). Only (b) threatens objectivism significantly; (a) is compatible with most views. Survey data often conflates these.
      *   **Specific Requirements:**
          *   What needs to be on the board *before* the (a)/(b) split makes sense?
          *   One central example (must not turn on harm, must make "morality vs. custom" live).
          *   Address student preconceptions ("science = relative" or "deep down everyone knows X").
          *   Address the methodological flaw: treating samples as independent votes (Galton's problem/phylogenetic confounding).
          *   One diagnostic question at the end to check understanding of the distinction.
          *   Flag contestable assumptions (objectivity definition, interpretation of findings).
          *   Identify the "breaker" condition (what would make me scrap this plan).

  2.  **Deconstruct the Core Distinction (a) vs. (b):**

      *   (a) Weight/Trade-offs: Everyone agrees lying is bad, but disagrees on whether lying to save feelings is worse than lying to protect property.
      *   (b) Domain/Constitution: One group says "disrespecting elders" is a moral violation (sin/wrong). Another says "disrespecting elders" is just rude/customary, not *moral*.
      *   *Challenge:* Students often conflate "different rules" with "different foundations."
      *   *Board Work:* Needs to establish the structure of moral reasoning before introducing the variation.

  3.  **Select the Central Example:**

      *   *Constraint:* No harm. (So no murder, assault, theft causing loss).
      *   *Constraint:* Must be live whether it's moral or custom.
      *   *Idea 1:* Food taboos (pork, beef). *Pros:* Clear cultural variation. *Cons:* Often seen as religious/customary, might be too easy to dismiss as "just rules."
      *   *Idea 2:* Dress codes/Modesty. *Pros:* Very visible. *Cons:* Can drift into politics/gender wars too quickly.
      *   *Idea 3:* Ancestor reverence/ritual obligation. *Pros:* Fits Haidt/Shweder style readings often used in these seminars. *Cons:* Might feel too distant to Western undergrads.
      *   *Idea 4:* **Incest (sibling marriage) without harm.** (The "Julie and Mark" case minus the harm). *Wait, prof banned trolley, might ban incest due to "yuck" factor.*
      *   *Idea 5:* **Eating with the left hand / Shoe soles.** (Classic anthropological examples).
      *   *Selection:* **Shoe Soles / Feet.** In some cultures, showing the sole of your shoe is a grave insult (moral/spiritual violation). In others, it's meaningless.
      *   *Why:* It's visceral but harmless. It forces the question: "Is this *wrong* or just *weird*?" It mirrors the "purity/sanctity" foundation without invoking harm.

  4.  **Map Student Preconceptions & Blocking Points:**

      *   *Preconception 1:* "Different cultures do different things = Morality is relative." (Naive Relativism).
          *   *Block:* When introducing the data. Show that difference doesn't equal foundational disagreement.
      *   *Preconception 2:* "Deep down everyone knows harm is wrong, so objectivism is safe." (Universalism).
          *   *Block:* When discussing the example. Show that not all moralities are harm-based.
      *   *Methodological Flaw (Galton's Problem):* Treating cultures as independent data points.
          *   *Placement:* After the initial data discussion, before the philosophical conclusion. It undermines the *strength* of the evidence for variation.

  5.  **Drafting the Plan (Iterative Process):**

      *   *Opening (5 mins):* Hook them. Get their intuitions on the Example.
      *   *Board Work (10 mins):* Define the structure. Reasons vs. Weights.
      *   *The Data & The Flaw (15 mins):* Present the cross-cultural findings, then hit them with the "independent vote" problem.
      *   *The Distinction (10 mins):* Apply (a) vs (b) to the example.
      *   *Closing (5 mins):* Diagnostic question.

      *Refining the Board Work:* I need to visualize "Moral Equation."
      Inputs (Reasons) -> Weights -> Output (Judgment).
      (a) = Different Weights. (b) = Different Inputs.

      *Refining the Methodological Point:* This needs to land hard. If cultures aren't independent, the "variation" might just be one idea spreading. This weakens the argument for (b).

      *Refining the Diagnostic Question:* Needs to force a choice between (a) and (b). "If Culture X says Y is wrong, but Culture Z says Y is neutral, does that prove..."

  6.  **Addressing Specific Prompts:**

      *   *Board before split:* The structure of moral judgment (Inputs/Weights).
      *   *One Example:* The "Shoe Sole" or "Left Hand" taboo. Let's go with **The Left Hand** (eating/giving). It's common in many readings (Haidt etc.), harmless, but deeply offensive in some contexts.
      *   *Preconceptions:* Block "Difference = Relativity" early. Block "Universal Harm" during the example.
      *   *Methodological Flaw:* Middle of class, after data presentation.
      *   *Diagnostic Question:* Scenario where they must classify the disagreement.
      *   *Contestable Assumptions:* What "objectivity" means (metaethics vs. normative).
      *   *Breaker Condition:* If students are anthropology majors vs. philosophy majors, or if they haven't read the specific studies.

  7.  **Final Polish:**

      *   Tone: Collegial, direct, seminar-style.
      *   Structure: Clear time stamps.
      *   Check constraints: No trolleys. No harm-based examples.
      *   Ensure the (a)/(b) distinction is the spine of the whole 45 mins.

      *(Self-Correction during drafting)*: Wait, the prompt asks "What has to be on the board *before* the (a)/(b) split even means anything?" I need to make sure I define "Moral Reason" clearly. If they don't know what a reason is, the distinction fails.
      Also, the "independent vote" issue (Galton's Problem) is crucial. If cultures share ancestry, the variation is overestimated. This supports the Objectivist by weakening the Relativist's data. I need to place this strategically so it doesn't just become a methods lecture. It should serve the philosophical point: "The evidence for (b) is weaker than you think."

      *Revised Plan Structure:*
      1.  Hook (The Example).
      2.  Board (The Structure of Judgment).
      3.  Data (The Variation).
      4.  Methods (The Flaw in Data).
      5.  Philosophy (The (a)/(b) Distinction applied).
      6.  Close (Diagnostic).

      *Wait, one more check:* The prompt asks "At exactly which point in the sequence do I block each [preconception]?" I need to be explicit about that.
      And "Flag the places where your plan leans on a contestable reading." I need a specific section for that.

      *Let's finalize the Example:* "Eating with the Left Hand."
      Why? It's not harm. It's not trolley. It's clearly "moralized" in some places (unclean, disrespectful) and "neutral" in others.

      *Let's finalize the Diagnostic Question:* "If we find out Group A and Group B both value 'Respect,' but Group A thinks 'Left Hand' shows respect and Group B thinks it shows disrespect, is that (a) or (b)?"
      Actually, better: "If Group A says 'Left Hand is Sin' and Group B says 'Left Hand is Manners,' is that (a) or (b)?"
      Wait, if Group B says it's *manners*, they are denying it's a *moral* reason. That's (b).
      If Group B says 'Left Hand is Wrong but less wrong than stealing,' that's (a).
      Okay, I'll craft the question carefully.

      *Breaker Condition:* If the students haven't grasped the difference between *descriptive* and *normative* claims. That's foundational.

      *Let's write it.*
answer: |-
  Here is a 45-minute discussion plan designed to hit your specific learning objectives while navigating the constraints.

  ### The Setup: Board Work & The Example

  **The One Example:** **The "Left Hand" Taboo.**
  *Why:* In many cultures (parts of West Africa, Middle East, India), eating with or passing items with the left hand is considered deeply offensive, unclean, or morally wrong. In Western secular contexts, it is neutral. It involves no harm (no one gets hurt), it isn't a trolley problem, and it creates a genuine "Is this morality or just manners?" tension.

  **What Must Be On The Board Before the (a)/(b) Split:**
  Before you can distinguish *weight* from *domain*, students need a visual model of how a moral judgment is constructed. Draw this flowchart:

  1.  **Inputs (The Considerations):** *What counts as a reason?* (e.g., Harm, Loyalty, Purity, Authority).
  2.  **Weights (The Priority):** *How much does this reason matter compared to others?* (e.g., Does Loyalty outweigh Honesty?).
  3.  **Output (The Judgment):** *Is this action Wrong, Permissible, or Obligatory?*

  **Label the two types of disagreement:**
  *   **Type 1:** Same Inputs, Different Weights.
  *   **Type 2:** Different Inputs (One side says "Purity" is an Input; the other says "Purity" is irrelevant noise).

  ---

  ### The 45-Minute Sequence

  #### 0:00–0:10 | The Hook & Preconception Block #1
  **Activity:** Present the "Left Hand" case. Ask: *"If I pass a grade to my professor with my left hand in Accra, it's an insult. In Boston, it's nothing. Does this prove morality is relative?"*
  **Student Preconception:** "Science found differences, so morality is relative lol."
  **The Block:** Do not let them answer yet. Write their "Yes" answers on the left, "No" on the right.
  **Move:** Tell them: *"We are going to hold that verdict until we figure out if this is a Type 1 or Type 2 disagreement."* You are suspending the conclusion to examine the structure of the disagreement first.

  #### 0:10–0:20 | The Board Work & Distinction
  **Activity:** Walk through the flowchart on the board using a non-moral analogy first (e.g., Cooking).
  *   *Input:* Taste, Nutrition, Cost.
  *   *Weight:* Chef A prioritizes Taste; Chef B prioritizes Cost.
  *   *Domain Disagreement:* Chef C says "Cost is not a cooking consideration, it's an accounting one."
  **Apply to Morality:**
  *   **Type 1 (Weight):** We both agree "Disrespecting Elders" is bad. I think it's a 5/10 badness; you think it's 9/10.
  *   **Type 2 (Domain):** I think "Disrespecting Elders" is a *moral* violation (sin/wrong). You think it's just *etiquette* (rude but morally neutral).
  **Crucial Point:** Emphasize that Objectivism can survive Type 1 easily. Objectivism struggles with Type 2. If you disagree on what counts as a moral reason, you aren't playing the same game.

  #### 0:20–0:30 | The Data & The Methodological Kill Shot
  **Activity:** Bring in the cross-cultural survey data (e.g., Haidt, Shweder, or Henrich readings).
  **Student Preconception:** "Sure, but deep down everybody knows X is wrong" (Universalism) OR "Look at all these different votes!" (Relativism).
  **The Block:** This is where you deploy the **Independent Vote** problem (Galton's Problem).
  **Script:** *"The surveys show 50 societies answer differently. We treat this as 50 independent data points proving variation. But if 40 of those societies share a colonial ancestor or trade routes, that's not 50 votes. That's 1 vote copied 40 times."*
  **Why here?** You place this *after* they see the data but *before* they finalize the philosophical implication. It weakens the empirical support for Type 2 disagreements. It suggests the variation might be shallower (more Type 1) than the raw numbers suggest. It blocks the "Science says Relative" crowd by showing the science is methodologically noisy.

  #### 0:30–0:40 | Synthesis: Applying the Distinction to the Example
  **Activity:** Return to the "Left Hand" case.
  **Question:** *"Okay, knowing the data might be clustered, look at the disagreement itself. When the Boston student says 'Left hand is fine' and the Accra student says 'Left hand is wrong,' are they disagreeing about Weight (Type 1) or Domain (Type 2)?"*
  **Discussion:** Push them to see that the Boston student likely views hygiene as *prudential* (smart/dumb) rather than *moral* (right/wrong). The Accra student views it as *moral/ritual*.
  **Conclusion:** This *looks* like Type 2 (Domain). This is the only thing that threatens Objectivism. But remind them of the Methodological point: Is it really a deep domain difference, or just a different belief about where "cleanliness" ends and "morality" begins?

  #### 0:40–0:45 | The Diagnostic & Wrap
  **The Diagnostic Question:**
  *"Imagine we find a culture where 'Lying to protect your brother' is praised. We compare them to a culture where it's condemned.*
  *Scenario A: Both sides agree Loyalty and Honesty are moral reasons, but weigh them differently.*
  *Scenario B: The first culture says Loyalty is a moral reason; the second says Loyalty is just a feeling, not a moral reason.*
  *Which scenario (A or B) is compatible with Moral Objectivism, and which one is the cross-cultural data actually struggling to prove?"*

  **Correct Answer:** Scenario A is compatible with Objectivism (trade-offs exist in objective systems). Scenario B threatens it. The data struggles to prove B because of the "Independent Vote" problem and the difficulty of translating "moral reason" across languages.

  ---

  ### Contestable Assumptions (Flag These for Students)

  You should explicitly flag two places where this plan leans on debatable ground:

  1.  **The Definition of "Objective":** The plan assumes Objectivism requires *universal agreement on inputs* (Domain). Some objectivists (e.g., Natural Law theorists) might argue that "Purity" *is* an objective moral reason, and the Westerners are the ones who are mistaken/blind, not just different. The plan frames Objectivism as needing consensus, which is a specific meta-ethical stance.
  2.  **The Translation of "Moral":** The plan assumes that when we translate a local concept (e.g., *dharma*, *taboo*, *sin*) into the English word "Moral," we are doing it accurately. If we are imposing our Western "Moral" category on them, we might be creating a Type 2 disagreement artificially.

  ---

  ### The "Breaker" Condition: When to Scrap This Plan

  **The Condition:** **If the students cannot distinguish Descriptive from Normative claims.**

  **Why:** The entire (a)/(b) distinction relies on analyzing the *structure* of their reasoning. If students keep saying, *"But it IS wrong to use the left hand because it's dirty,"* they are making a normative claim, not analyzing the disagreement.

  **The Sign:** If, during the first 10 minutes, every time you ask *"What does this show about their reasoning?"* they answer *"It shows they are incorrect,"* the plan will fail. They are stuck in first-order moralizing.

  **The Rebuild:**
  If this happens, you must abandon the (a)/(b) distinction for the day.
  1.  Stop the Board Work.
  2.  Spend 20 minutes purely on the **Is/Ought Gap** in the context of anthropology.
  3.  Use the remaining time to ask: *"Can we describe a belief as 'moral' without agreeing it is 'true'?"*
  4.  Save the (a)/(b) distinction for the next section. It requires a level of meta-ethical distance they might not currently possess.
