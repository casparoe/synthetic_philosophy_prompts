  ### My verdicts, restated

  Your verdicts reveal a triad: **agency, intent, and audience**. You reject objects lacking human selection (chimp, glacier) or those dominated by utility (lamp, sign). You accept mundane objects when reframed for contemplation (urinal, whale song), provided a human curated the experience. Private efforts (niece, staircase) fail unless entered into a public sphere. The forgery confirms that art status relies on original intent, not provenance. Your tension lies between valuing labour (staircase) versus valuing the communicative act (urinal). You consistently privilege the *offer of meaning* over the *object's physical properties*. The lamp and urinal are physically similar moves, but your gut distinguishes their purpose: one lights a room, the other lights a conversation.

  ### The principle

  **The Principle of Communicative Offer.**

  1.  **Human Curation:** A human must have selected or shaped the properties for a reason. This admits the whale song (editing) and directed AI, excluding the chimp and lazy AI. The human must do more than merely transact; they must shape the experience.
  2.  **Engagement over Utility:** The primary intent must be to invite aesthetic or conceptual engagement. This distinguishes the urinal (conceptual) from the lamp (functional), and the poster (persuasive design) from the sign (pure instruction). Utility does not disqualify, but it must not be primary. The poster asks to be admired; the sign asks to be obeyed.
  3.  **Public Offer:** The work must be offered to a community of interpreters. This excludes the niece's drawing and the secret staircase. Art requires a sender and a receiver.

  *Forgery Clause:* Status binds to the original maker's intent.
  *Runner-up:* If you wish to save the staircase, replace "Public Offer" with "Potential for Reception". This saves hidden works but risks classifying private diaries as art. I recommend keeping "Public Offer" to maintain the distinction between craft and art. It is cleaner to say the staircase becomes art only when discovered and framed by others, rather than waiting in the dark as art.

  ### What it decides

  **The Secret Staircase:** Not art. Labour alone is insufficient without an offer to an audience; it becomes art only upon discovery and framing by others. This resolves your flip: it is craft until displayed.
  **A Sunset:** Not art. Lacks human agency, however profound the experience. Nature provides the raw material, not the frame.
  **A Potter's Bowl:** Used for soup? Not art. Displayed on a shelf? Art. The object is identical; the status changes with the offer.
  **A Receipt Signed by an Artist:** Art. It fits the principle (conceptual offer, human intent), though you may resent its lack of labour. It relies on framing, like the urinal. This tests your tolerance for conceptualism; you may hate it, but it fits the logic you applied to Duchamp.

  ### What it overturns

  The principle strains against the **Whale Song**. If editing counts as agency, why does selling the chimp's painting not count? I prioritise your intuition: active shaping (whale) outweighs passive transaction (chimp). However, this is the weakest link. The verdict I would drop to save the principle is the **Staircase**. If you feel strongly that hidden labour constitutes art, this definition fails. I would sacrifice the staircase to preserve the necessity of communication. The glacier verdict is secure; pointing is not shaping. If you decide the staircase *is* art, you must abandon the "Public Offer" clause, which weakens the distinction between private hobby and public work.

  ### Settled vs contested

  Among philosophers, there is no consensus. The "family resemblance" view (Wittgenstein/Weitz) is the dominant academic position: art has no essential definition. My principle is a **functionalist** attempt, which is a minority but respected stance. Don't let experts tell you definitions are impossible; they mean *necessary and sufficient conditions* are elusive. Your gut is doing philosophy. The disagreement isn't about facts, but about whether art is a property of objects or a status we confer. My principle assumes the latter. You are looking for a rule in a practice that often resists them, but your cases show a consistent internal logic worth formalising.
