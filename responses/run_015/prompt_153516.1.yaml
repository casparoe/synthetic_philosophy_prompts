          *   *Parity:* Expanded parameter space. More input bits allow more distinct output states. Still just causal covariance, just with higher bandwidth.
      *   *Case 3: Context-dependent UGA (Sec vs. Stop).*
          *   *Coding:* Position-Independent Code (PIC) or Relocation. The meaning of an opcode depends on the program counter or a flag register set by downstream instructions. Self-modifying code. The "decoder" looks ahead.
          *   *Parity:* State-dependent causation. The effect of the input token depends on the current system state (downstream context). No "decoding," just state machine transitions.
      *   *Case 4: Methylation/Prions (Non-sequence).*
