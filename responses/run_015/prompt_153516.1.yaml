  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Philosophy of biology seminar student, Compiler Engineer (fluent in ISA, machine code, source code, semantics of opcodes, relocation, PIC, disassembly, self-modifying code, context-dependent meaning).
