      *   **Parity/Causal-Structural View (Griffiths, Stotz, etc.):** DNA is just one cause among many (cytoplasm, environment, epigenetic factors). "Information" is just a shorthand for "specific difference making." No special semantic status. No inherent normativity, just causal covariance.

  3.  **Drafting the Translations (Compiler/ISA Vocabulary):**

      *   *Coding View:* DNA = Object Code / Bytecode. Ribosome = CPU/Hardware. tRNA = Lookup Table / Microcode. Phenotype = Execution Output. "Information" = Semantic content defined by the ISA specification. A mutation is a bug if it violates the spec/intent, not just a bit flip.
      *   *Parity View:* DNA = Input Data Stream / Configuration Bits. Ribosome/Cell = The whole execution environment (OS + Hardware + Peripherals). Phenotype = System State. "Information" = Correlation between input bits and output state. No distinction between "code" and "data" or "hardware" and "software." A mutation is just a different input parameter causing a different state transition.

  4.  **Applying to the Four Cases:**

