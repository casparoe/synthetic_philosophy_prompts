  6.  **Normative Bridge (NN):** *Added.* Must explain why psychological prevalence implies moral truth. Evolutionary fitness is not moral correctness. Without this, the account commits the naturalistic fallacy. This is the hardest hurdle for naturalistic psychology. You must link the 'is' of psychology to the 'ought' of morality explicitly.
