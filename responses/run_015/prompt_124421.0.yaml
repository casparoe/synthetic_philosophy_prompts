answer: |-
  **Title:** The Validity Gap: Why Hybrid Contextualism Does Not Escape Frege-Geach

  **Introduction**
  It is easy to see why your roommate thinks you are overthinking this. To the uninitiated, the Frege-Geach (F-G) problem looks like a linguistic parlor trick: *If "lying is wrong" just means "Boo lying!", what does "If lying is wrong..." mean? "If boo lying..."?* But you are right to feel that the standard textbook examples obscure a deeper metaphysical tension. The F-G problem is not merely about grammar; it is about whether moral thought can be logical without being descriptive.

  You have proposed a specific solution: a **hybrid contextualist expressivism**. On this view, moral predicates carry a "thin descriptive core" (e.g., "violates the relevant normative standard") that shifts with conversational context, paired with an expressive component (disapproval). The hope is that the descriptive core handles the logic (embedding), while the expressive component handles the action-guiding nature of ethics.

  My verdict is direct: **The Frege-Geach objection still bites.** While this hybrid move successfully patches the *logical* syntax, it reintroduces the F-G tension at the level of *contextual stability*. By making the descriptive core context-sensitive, you save the proposition from being empty, but you render moral inference vulnerable to equivocation. The objection remains fatal to the claim that this view offers a stable middle ground between realism and pure expressivism.

  **The Classic Trap and Standard Defenses**
  To see why the hybrid view struggles, we must recall why the problem exists. Peter Geach and John Searle pointed out that moral sentences appear in unasserted contexts (conditionals, negations, questions). In "If lying is wrong, then stealing is wrong," the speaker is not expressing disapproval of lying. If the meaning of "wrong" *is* the expression of disapproval, the antecedent is meaningless. If the antecedent is meaningless, the argument is invalid.

  Pure expressivists (like Blackburn and Gibbard) have tried to solve this via **Quasi-Realism**. They argue we can "earn the right" to talk about truth and validity without positing moral facts. They suggest a **pragmatic reply**: even in conditionals, we are mapping relations between attitudes. However, critics argue this is a sleight of hand. It explains why we *talk* as if there is logic, but it doesn't explain why the logic *holds*.

  Alternatively, there is the **deflationary move**. This suggests moral statements have no robust content to embed; they are merely tools. But this fails to explain why moral reasoning feels constraint-bound. If I say, "If eating meat is wrong, then feeding meat to cats is wrong," I feel logically compelled to accept the conclusion if I accept the premise. Deflationism struggles to account for this compulsion without smuggling in descriptive content.

  **The Hybrid Contextualist Proposal**
  This is where your proposal enters. By positing a **thin descriptive core**, you give "wrong" something to do in the antecedent. "Lying is wrong" becomes roughly "Lying violates norms N (where N is contextually salient) + Boo!"

  In the conditional "If lying is wrong...", the antecedent now expresses a proposition: "If lying violates norms N..." This proposition can be true or false regardless of whether the speaker currently disapproves of lying. Logic is preserved because we are now dealing with truth-apt propositions. The expressive component is essentially along for the ride, activated only in assertion.

  On the surface, this seems immune to F-G. The descriptive core provides the semantic value required for embedding. The context-sensitivity explains why "wrong" seems to mean different things in different cultures or conversations without losing its logical structure.

  **The Context-Stability Problem**
  However, the F-G objection mutates rather than disappears. Logic requires **univocality**. For a Modus Ponens argument to be valid, the term "wrong" must mean the exact same thing in Premise 1, Premise 2, and the Conclusion.

  *   P1: Lying is wrong.
  *   P2: If lying is wrong, then getting your brother to lie is wrong.
  *   C: Therefore, getting your brother to lie is wrong.

  In your hybrid contextualist model, the descriptive core is filled by "contextually salient norms." But logical inference often requires bridging contexts. Imagine a debate between a Utilitarian and a Kantian.
  *   Utilitarian: "Lying is wrong [violates utility-maximizing norms]."
  *   Kantian: "If lying is wrong [violates categorical imperatives], then..."

  If the descriptive core shifts based on the speaker's normative framework (the context), then P1 and P2 are using "wrong" with different descriptive contents. The argument commits the fallacy of equivocation. For the logic to hold, the context must remain fixed. But if the context is fixed, the hybrid view collapses into a form of **relativized descriptivism**. It is no longer explaining the *universal* force of moral logic, but only the internal logic of specific normative frameworks.

  Furthermore, if the descriptive core is made *too* minimal to avoid this shift—for example, defining "wrong" simply as "violates *the* relevant norms"—it becomes trivial. It amounts to saying "Lying is prohibited by the norms that prohibit lying." This is analytically true but substantively empty. It solves F-G by making moral statements tautologies, which fails to capture the substantive disagreement inherent in ethics.

  **The Explanatory Cost**
  There is a deeper issue. The primary motivation for expressivism is to explain the **action-guiding** nature of morality. We say "X is wrong" to *stop* X, not just to describe it.

  In your hybrid model, the logical heavy-lifting is done entirely by the descriptive core. The expressive component (the "Boo!") becomes semantically inert in embedded contexts. This creates an explanatory gap. If the descriptive core is doing all the work to ensure validity, why retain the expressivist component at all?

  If I can validate moral arguments using only the descriptive core ("violates norms N"), then I have effectively conceded the descriptivist's main point: that moral language functions logically *because* it describes states of affairs (normative violations). The expressivist element becomes a pragmatic flourish, a psychological add-on that explains why we *care*, but not what we *mean*.

  This is fatal to expressivism as a distinct semantic theory. A theory that solves F-G by admitting that moral predicates function logically *only in virtue of their descriptive content* is not a vindication of expressivism; it is a surrender to descriptivism. You have saved the theory from the F-G objection by removing the very feature (pure non-cognitive meaning) that made the objection arise in the first place.

  **Conclusion**
  The Frege-Geach problem is not merely a puzzle about conditionals; it is a stress test for the semantic unity of moral language. Your hybrid contextualist proposal attempts to pass this test by anchoring moral predicates in a shifting descriptive core. While this avoids the charge of nonsense in embedded contexts, it fails to secure the validity of moral inference across different conversational contexts.

  More damningly, it solves the logical problem at the cost of the expressivist insight. By relying on the descriptive core to ground logic, the view admits that the *meaning* required for reasoning is descriptive, not expressive. Therefore, the Frege-Geach objection **still bites**. It forces this version of expressivism to choose: either maintain the context-sensitivity and lose logical validity across frameworks, or stabilize the descriptive core and cease to be distinctively expressivist. The objection remains fatal to the claim that expressivism can fully account for moral reasoning without ceasing to be expressivism.

  So, tell your roommate you aren't overthinking it. You've just identified that the only way to fix the logic is to change the theory. And in philosophy, when the solution requires abandoning the theory's central innovation, the objection stands.
