  2.  **Deconstruct the Roommate's Claims vs. Actual Decision Theory:**

      *   **Claim 1: "Pasadena is basically St. Petersburg but with payouts tied to... an external index."**
          *   *Fact Check:* The Pasadena Paradox (Nover & Hájek, 2004) is indeed a variation of St. Petersburg. However, the mechanism isn't an *external* index like stock tickers or temperature. It's defined by a specific alternating series based on the coin toss count (usually $2^n/n$ with alternating signs). The "indexing" is internal to the probability structure (the order of summation matters).
          *   *Verdict:* Mischaracterization. It's about the *order of summation* in a conditionally convergent series, not external variables.

      *   **Claim 2: "Expectation... fails to exist altogether because the positive and negative parts both diverge and cancel each other out..."**
          *   *Fact Check:* This is the core mathematical truth of the Pasadena Paradox. The series is conditionally convergent (specifically, the expectation sum is $\sum (-1)^{n+1} \frac{2^n}{n} \cdot \frac{1}{2^n} = \sum \frac{(-1)^{n+1}}{n}$, which is the alternating harmonic series). Wait, let me double-check the standard formulation.
          *   *Standard Formulation:* Payoff $X_n = (-1)^{n+1} \frac{2^n}{n}$ with probability $2^{-n}$.
          *   *Expected Value:* $E[X] = \sum_{n=1}^{\infty} 2^{-n} \cdot (-1)^{n+1} \frac{2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$.
          *   *Math:* This is the alternating harmonic series, which *does* converge to $\ln(2)$.
          *   *Correction:* Wait, the *Pasadena* game specifically constructs it so the expectation is *undefined*. How? Usually, it involves rearranging terms or making the absolute sum diverge while the conditional sum depends on order.
          *   *Re-evaluating Pasadena:* The Nover & Hájek (2004) game has payoffs $2^n/n$ with alternating signs. The probabilities are $1/2^n$. The expected value sum is $\sum \frac{(-1)^{n-1}}{n}$. This *converges* to $\ln 2$. So why is it a paradox?
          *   *Ah, the catch:* The paradox arises because the *absolute* expectation diverges ($\sum |x_i| p_i = \sum 1/n = \infty$). In standard measure theory, if $\int |X| dP = \infty$, the expectation is not well-defined in the Lebesgue sense (it depends on the order of summation). If you rearrange the terms (which corresponds to different ways of describing the "same" game or different limiting processes), you can get any value you want (Riemann Rearrangement Theorem).
          *   *Roommate's description:* "Positive and negative parts both diverge." Yes, $\sum x^+ p = \infty$ and $\sum x^- p = \infty$. This makes the expectation undefined in the standard sense.
          *   *Verdict:* Mathematically mostly correct on the "undefined" part, though the "external index" bit in Claim 1 muddies *why* it happens. It's about conditional convergence, not external data.

      *   **Claim 3: "Since EV is undefined, any rational agent should flat-out refuse to play even for free."**
          *   *Fact Check:* This is a normative leap. EUT says maximize expected utility. If EU is undefined, EUT is *silent*, not prohibitive. It doesn't say "Refuse"; it says "I can't tell you."
          *   *Alternative Theories:* Dominance principles might apply. If the game has positive outcomes in some states and negative in others, simple dominance might not hold. But refusing *for free*? If the entry cost is 0, and there's a chance of positive payoff, refusing seems irrational under almost *any* theory (unless utility is bounded below by something terrible).
          *   *Verdict:* Serious error. "Undefined" $\neq$ "Zero" or "Negative." It means the tool is inapplicable. Refusing a free ticket with potential upside is hard to justify.

