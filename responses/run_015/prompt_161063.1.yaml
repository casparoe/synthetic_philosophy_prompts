answer: |-
  **Instructions to the Student**

  Begin at couplet 1. Read both descriptions carefully and select the one that best matches your pre-theoretical intuition about what the word 'true' is doing when we use it. Follow the instruction at the end of that line (either a leaf name or a number directing you to the next couplet). Proceed until you arrive at a named position or a 'Vacant Cell'. This process should take approximately fifteen minutes. Do not worry if you arrive at a Vacant Cell; this indicates a combination of views that philosophical history suggests is untenable or unoccupied. Once you reach a terminal point, consult the Table of Leaves to see the name of the position, its most awkward commitment, and an analysis of how well it discharges the four core jobs of a theory of truth.

  **The Key**

  1.  Does the word 'true' attribute a feature to a belief or sentence, or does it perform a different task entirely (such as expressing an attitude or standing in for other words)?
      *   It attributes a feature (a property of some kind). — **Go to 2**
      *   It performs a different task (or attributes nothing). — **Go to 8**

  2.  Must a theory of truth explain how sentences get their meaning, for example by fixing the truth-conditions of sentences in a language we cannot yet translate?
      *   Yes, truth is essential to explaining meaning. — **Go to 3**
      *   No, meaning is established prior to truth. — **Go to 4**

  3.  **Vacant Cell 1.** (Diagnosis: Incoherent. If truth is not a feature of the world, it lacks the resources to fix meaning for untranslatable languages.)

  4.  Is the primary point of this feature that acting upon it leads to successful outcomes?
      *   Yes, success is what truth *is*. — **Go to 5**
      *   No, success is merely a consequence of having it. — **Go to 6**

  5.  **Vacant Cell 2.** (Diagnosis: Merely unattractive. This combines a substantive property view with a pragmatist definition, ignoring the realist intuition that truth explains success rather than being defined by it.)

  6.  Does this feature work the same way for physics as it does for moral, aesthetic or comic discourse?
      *   Yes, there is one uniform property across all domains. — **Go to 7**
      *   No, the property varies depending on the subject matter. — **LEAF: Alethic Pluralism**

  7.  Could a belief possess this feature even if no one could ever verify or know it?
      *   Yes, truth exceeds our ability to know it. — **Go to 9**
      *   No, truth is constrained by what can be known. — **Go to 8**

  8.  Is the feature defined by the ideal coherence of all beliefs, or by stable warrant available to inquirers?
      *   Ideal coherence of the whole system. — **LEAF: Coherentism**
      *   Stable warrant available to us. — **LEAF: Epistemic View**

  9.  Can this feature be analysed as a relation between belief and the world?
      *   Yes, it is a matching relation. — **LEAF: Substantive Correspondence Realism**
      *   No, it is simple and unanalysable. — **LEAF: Primitivism**

  10. **Vacant Cell 3.** (Diagnosis: Simply unexplored. A substantive property that does no work for meaning or success, serving only generalisation, is metaphysically extravagant.)

  11. Does the word 'true' remain useful in our language?
      *   No, it should be discarded. — **LEAF: Eliminative**
      *   Yes, it serves a purpose. — **Go to 12**

  12. Is the *only* reason we need the word to make blind generalisations, such as saying "Everything she said was true" without listing the sentences?
      *   Yes, that is its sole logical purpose. — **Go to 13**
      *   No, it does more than that. — **Go to 14**

  13. **Vacant Cell 4.** (Diagnosis: Incoherent. If there is no property, but the word does more than generalise, it is unclear what function remains to justify its use.)

  14. Does 'is true' act like a pronoun standing in for a sentence, or does it express a non-cognitive attitude?
      *   Like a pronoun or pro-form. — **LEAF: Prosententialism**
      *   Expresses an attitude or commitment. — **LEAF: Expressivism**

  15. **LEAF: Deflationism and Minimalism.** (Note: These two positions are flagged here as difficult to separate via this key; both treat the property as thin or non-existent and prioritise generalisation.)

  **Table of Leaves**

  | Position | Most Awkward Commitment | Job Analysis (Generalisation / Semantic / Normative / Success) |
  | :--- | :--- | :--- |
  | **Substantive Correspondence Realism** | Must posit facts or states of affairs that exist independently of our capacity to recognise them. | **Generalisation:** Strain (must explain how property allows ascent). **Semantic:** Easy (truth-conditions fix meaning). **Normative:** Easy (belief aims at matching world). **Success:** Easy (matching world guides action). |
  | **Coherentism** | A belief could be true even if the world were completely different, provided the belief system remained coherent. | **Generalisation:** Strain. **Semantic:** Easy (meaning is role in system). **Normative:** Strain (why aim for coherence?). **Success:** Strain (coherence does not guarantee survival). |
  | **Pragmatism** | Truth is not stable; a belief could cease to be true if acting on it stopped working well. | **Generalisation:** Strain. **Semantic:** Strain. **Normative:** Easy (truth is what we ought to believe for success). **Success:** Easy (constitutive of truth). |
  | **Epistemic View** | There are no truths that are in principle beyond our capacity to warrant or verify. | **Generalisation:** Strain. **Semantic:** Easy. **Normative:** Easy (truth is idealised warrant). **Success:** Strain (warrant does not ensure outcome). |
  | **Alethic Pluralism** | The word 'true' means something different in physics than it does in comedy or morality. | **Generalisation:** Strain (hard to generalise across domains). **Semantic:** Easy (within domains). **Normative:** Easy. **Success:** Easy. |
  | **Deflationism and Minimalism** | Truth is not a substantive property that explains why beliefs are useful or meaningful. | **Generalisation:** Easy (this is the core function). **Semantic:** Impossible (denies truth explains meaning). **Normative:** Strain (must derive normativity). **Success:** Strain (must explain utility without substance). |
  | **Prosententialism** | 'Is true' is not a predicate describing a sentence, but a grammatical device like a pronoun. | **Generalisation:** Easy. **Semantic:** Impossible. **Normative:** Strain. **Success:** Strain. |
  | **Expressivism** | Saying a belief is true is not stating a fact about the belief, but expressing approval of holding it. | **Generalisation:** Strain (hard to express approval of infinite sets). **Semantic:** Impossible. **Normative:** Easy (constitutive of expression). **Success:** Strain. |
  | **Primitivism** | Truth is a real property but cannot be analysed, defined, or reduced to anything else. | **Generalisation:** Strain. **Semantic:** Easy. **Normative:** Easy. **Success:** Easy. |
  | **Eliminative** | There is no such thing as truth; the word should be removed from serious inquiry. | **Generalisation:** Impossible (cannot generalise without the term). **Semantic:** Impossible. **Normative:** Impossible. **Success:** Impossible. |
  | **Vacant Cell 1** | (No Position Occupies This) | **Diagnosis:** Incoherent. One cannot use a non-property to fix meaning for untranslatable languages. |
  | **Vacant Cell 2** | (No Position Occupies This) | **Diagnosis:** Merely unattractive. Combines substantive metaphysics with pragmatist definition, satisfying neither realist nor pragmatist intuitions. |
  | **Vacant Cell 3** | (No Position Occupies This) | **Diagnosis:** Simply unexplored. Positing a substantive property solely for logical generalisation is ontologically wasteful. |
  | **Vacant Cell 4** | (No Position Occupies This) | **Diagnosis:** Incoherent. A non-property view that rejects generalisation but retains normativity lacks a functional basis. |

  **Note on Deflationism:** Students arriving at the Deflationism and Minimalism leaf should note that while this view claims truth is not a *substantive* property, it does not claim truth is *unimportant*. It discharges the Generalisation Job easily, which is essential for efficient thought and communication, even if it struggles to explain Normativity or Success without borrowing from other views. This separates it clearly from the Eliminative leaf, where truth is deemed useless.
