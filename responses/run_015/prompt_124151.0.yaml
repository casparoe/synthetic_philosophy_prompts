      *   **Context:** Undergrad seminar on the history of violence (likely discussing Pinker's *The Better Angels of Our Nature* and its critiques).
      *   **Specific Confusions to Address:** Per capita vs. absolute, numerator definition (homicide, war, structural, etc.), unit of analysis (events, victims, harm-weighted), substitution effects (competing risks), and peace via deterrence.
      *   **Formatting:** Table is fine. No citations/stats.
      *   **Specific Constraints:** Mark non-negotiable vs. preference, flag incompatible pairs, identify the single requirement that rules out the most existing measures, and address the ontological question (is there a fact of the matter?).
      *   **Tone:** Philosophical, rigorous, brainstorming-before-committing (show the work), but ultimately delivering a clear spec.

  2.  **Initial Brainstorming & Philosophical Grounding:**
      *   *The Core Problem:* "Violence" is an essentially contested concept. It's not like measuring temperature. It involves moral judgment, counterfactuals, and boundary drawing.
      *   *The Claim:* "Violence is declining." This is a comparative historical claim. It requires commensurability across time and space.
      *   *The Measurement Issue:* To measure change, the metric must be stable. If we change what counts as violence in 1900 vs. 2000, we aren't measuring decline; we're measuring definitional shift.
      *   *Key Tensions:*
          *   Subjective experience vs. Objective event.
          *   Direct physical harm vs. Structural/Systemic harm.
          *   Actualized harm vs. Threat/Intent.
          *   Individual agency vs. Systemic outcome.
          *   Per capita (risk) vs. Absolute (total suffering).

  3.  **Developing the Desiderata (The "Spec"):**
      *   *Requirement 1: Stability of Definition.* If "violence" means something different in epoch A than epoch B, comparison is impossible. (Non-negotiable).
