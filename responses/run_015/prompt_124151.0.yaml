      *   *Requirement 3: Unit of Account.* Bodies? Events? DALYs (Disability-Adjusted Life Years)? Per capita or total? (Per capita is usually necessary for "risk," but total is necessary for "total suffering").
      *   *Requirement 4: Counterfactuals.* The "substitution" problem. If a war didn't happen, would those people die of disease? The "deterrence" problem. Is a nuclear peace "violent"?
      *   *Requirement 5: Epistemic Access.* Can we actually know this? Historical records are spotty.

  4.  **Refining the Desiderata (Filtering for the Prompt):**
      *   Need to distinguish between *conceptual* validity and *operational* feasibility.
      *   Need to address the "Fact of the Matter" question.
      *   Need to identify the "Killer Constraint" (the one that rules out most measures).

