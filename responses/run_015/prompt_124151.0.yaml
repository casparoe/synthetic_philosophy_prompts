answer: |-
  ### Preamble: The Measurement Trap

  Before we list the requirements, we need to clear a philosophical hurdle. You are asking for a "spec" for a measure of violence. In the philosophy of social science, we distinguish between **natural kinds** (like "mass" or "temperature," which exist independently of human interpretation) and **social kinds** (like "inflation," "crime," or "violence," which depend on human agreements and norms).

  "Violence" is a social kind. There is no "violence meter" hidden in the fabric of the universe. Therefore, a claim that "violence is declining" is not a discovery of a pre-existing trend; it is the result of a specific *operationalization*. If you change the operationalization, the trend can disappear or reverse.

  So, to make the claim meaningful, we aren't looking for the "true" measure (there isn't one). We are looking for a measure that is **valid for the specific question you are asking.** The confusion in your seminar stems from people using different measures to answer the same question, or using one measure to answer a question it wasn't built for.

  ### Is There a "Fact of the Matter"?

  **Short answer:** No, not in the aggregate.
  **Long answer:** There are facts about *events* (e.g., "Person A struck Person B," "Person C died of starvation"). But grouping these events under the label "violence" requires a normative decision.
  *   If you define violence as *direct physical harm*, the trend might look downward.
  *   If you define violence as *the violation of autonomy or well-being* (including structural neglect), the trend might look upward or flat.
  *   **Conclusion:** "Less violent" is partly a decision about what to care about. It is a moral claim disguised as a statistical one. To make it checkable, you must make the moral framework explicit.

  ---

  ### The Spec: Desiderata for a Measure of Historical Violence

  Here is the breakdown of what a measure needs to do to support a claim like "violence is declining." I have categorized these by **Validity** (does it measure what we think?), **Reliability** (is it consistent?), and **Normative Coherence** (does it match our moral intuitions?).

  | Requirement | The Case / Rationale | Status | Tensions / Incompatibilities |
  | :--- | :--- | :--- | :--- |
  | **1. Historical Equivalence of Classification** | For a trend to be real, the definition of the event must mean the same thing in 1500 as in 2000. If "homicide" in 1500 excluded domestic killings or state executions, but "homicide" in 2000 includes them, a decline is an artifact of record-keeping, not behavior. | **Non-Negotiable** | Conflicts with *Expansive Scope*. The further back you go, the harder it is to ensure categories match. |
  | **2. Counterfactual Neutrality** | The measure must not depend on guessing what *would* have happened. If you claim peace exists because a war was deterred, you are measuring a *threat*, not an *event*. A measure of actual violence cannot rely on unobservable alternatives. | **Non-Negotiable** | Conflicts with *Deterrence Peace*. You cannot count "wars that didn't happen" as zero violence without assuming they were inevitable. |
  | **3. Scope Consistency** | You cannot mix categories over time. If you include "deaths from neglect" in 2000, you must have a way to estimate them for 1500. If you exclude them in 2000, you must exclude them in 1500. Changing the numerator mid-stream invalidates the trend. | **Non-Negotiable** | Conflicts with *Data Availability*. Often, we only have data for direct violence in the past, forcing a scope shrink. |
  | **4. Unit of Moral Weight** | You must decide if you are counting *bodies*, *events*, or *life-years*. One death at age 5 is not the same loss as one death at age 80. A measure of "harm" should ideally weight by remaining life expectancy, not just count corpses. | **Preference** (Harm-Weighted Camp) | Conflicts with *Simplicity*. Life-year calculations require demographic data often unavailable for historical periods. |
  | **5. Agent-Agnosticism** | The measure should not care *who* did the killing (state, criminal, rebel, husband). If you exclude state executions but include rebel killings, you are measuring "illegitimacy," not violence. | **Preference** (Universalist Camp) | Conflicts with *Legalist Camp*. Some argue state force is "law," not violence. This is a political definition, not a physical one. |
  | **6. Epistemic Transparency** | The measure must acknowledge the "dark figure" (unrecorded violence). If records improve over time, raw counts will look like an *increase* even if violence is stable. The measure must correct for surveillance density. | **Non-Negotiable** | Conflicts with *Precision*. Correcting for the dark figure requires assumptions that introduce uncertainty. |

  ---

  ### The "Killer Constraint"

  **Which single requirement rules out the most measures people actually reach for?**

  **Requirement #1: Historical Equivalence of Classification.**

  This is the silent killer of almost all long-term violence datasets (including the famous ones you likely read).
  *   **Why:** In the past, many forms of violence were not categorized as violence, were not crimes, or were simply not recorded.
  *   **Example:** Domestic violence was often considered "discipline" or a private matter in the 18th century. It rarely entered court records. Today, it is a specific crime category.
  *   **The Trap:** If you compare court records from 1700 to police stats from 2000, you will see a massive rise in violence (because we record more now) or a massive decline (because we stopped counting certain things as crimes).
  *   **Result:** Most "decline" narratives rely on assuming that a "homicide" in a medieval chronicle is the same ontological object as a "homicide" in a modern CDC database. Philosophically, they are not. One is a breach of the King's Peace; the other is a violation of individual rights.

  ### Incompatible Pairs (You Can't Have Both)

  1.  **Per Capita Risk vs. Absolute Suffering**
      *   *The Conflict:* If population grows, per capita violence can drop while total violence rises.
      *   *The Choice:* Are you measuring the *safety of an individual* (Per Capita) or the *total amount of pain in the world* (Absolute)?
      *   *Verdict:* These are different questions. "Violence is declining" is false if you mean total pain, but true if you mean individual risk. You must specify which one. They cannot be jointly satisfied by a single number.

  2.  **Structural Violence vs. Event Violence**
      *   *The Conflict:* "Event violence" is a punch, a bullet, a bomb. "Structural violence" is death by preventable poverty, lack of medicine, or systemic neglect.
      *   *The Choice:* If you include structural violence, the "decline" narrative often collapses (as global inequality and preventable disease remain high). If you exclude it, the measure ignores the majority of human suffering.
      *   *Verdict:* Most datasets exclude structural violence because it is causally diffuse (who "killed" the child who died of diarrhea?). You cannot easily combine a bullet (direct cause) with a policy (indirect cause) in one numerator without making heavy theoretical assumptions.

  ### Addressing Your Specific Confusions

  **1. Per Capita vs. Absolute**
  *   **Philosophical Spec:** This is a choice between **Risk** and **Volume**.
  *   **Recommendation:** If your claim is "The world is safer for *you*," use Per Capita. If your claim is "The world contains less *evil*," use Absolute. Do not swap between them to win an argument.
  *   **Checkability:** Per capita is easier to check against population data. Absolute is easier to check against moral intuition (is 1,000 deaths better than 100? Yes, usually).

  **2. The Numerator (What counts?)**
  *   **Philosophical Spec:** This is the **Boundary Problem**.
  *   **Recommendation:** Stick to **Direct Physical Harm** for historical comparison. Why? Because "structural violence" (neglect) requires knowing what was *possible* at the time. We can judge a king for killing a rival; we cannot easily judge him for not inventing penicillin.
  *   **Caveat:** If you include structural violence, you must define a "baseline of expected care" for every historical period, which is nearly impossible.

  **3. Events vs. Victims vs. Harm-Weighted**
  *   **Philosophical Spec:** This is the **Metric Problem**.
  *   **Recommendation:** **Victims** is the minimum standard. **Harm-Weighted (Years of Life Lost)** is the philosophical ideal.
  *   **Why:** A massacre of children is "more violent" than a duel between two elders, even if the event count is the same. Counting events (battles) is useless; one battle can kill 10 or 10,000.
  *   **Checkability:** Harm-weighting requires age-of-death data, which is often missing. Victims is the pragmatic compromise.

  **4. Substitution and Deterrence (The Counterfactuals)**
  *   **Philosophical Spec:** This is the **Causal Attribution Problem**.
  *   **The Substitution Case:** If a person is killed violently but would have died of plague next month, is that violence?
      *   *Verdict:* **Yes.** Violence is about the *mode* of death and the *agency* involved, not just the net change in population. We care about *how* people die, not just *that* they die.
  *   **The Deterrence Case:** If peace is held by a nuclear threat, is that low violence?
      *   *Verdict:* **Empirically Yes, Normatively Debatable.** In terms of *measured events*, it is low violence. In terms of *social relations*, it is high coercion.
      *   *Spec:* A measure of "violence" should track **actualized harm**. A measure of "coercion" or "threat" would track the nuclear peace. Do not conflate them. If you count the *threat* as violence, you can never measure a decline, because the potential for violence is always infinite.

  ### Final Summary for the Seminar

  To stop going in circles, propose this rule to your class:

  > **"We are not measuring Violence (capital V). We are measuring [Specific Metric] as a proxy for [Specific Moral Concern]."**

  *   If you measure **Battle Deaths Per Capita**, you are measuring the risk of dying in interstate war. You are *not* measuring the total suffering of humanity.
  *   If you measure **Homicide Rates**, you are measuring the breakdown of domestic order. You are *not* measuring state violence.
  *   If you claim "Violence is Declining," you are only entitled to claim "The specific metric we chose is declining."

  The "fact of the matter" exists only at the level of the **metric**, not the **concept**. The concept is a vessel; the metric is the water. Don't argue about the water while holding different vessels.
