      *   "Cheapest revision." $\rightarrow$ Modifying premise (2) is cheaper than rewriting Braudel or accepting nihilism.
      *   "Say what would change your mind." $\rightarrow$ Address the enabling vs. proper causes distinction.

  **(Self-Correction on "Cheapest Revision"):**
  The cheapest revision is to reject the *exclusivity* clause in (2). Keep the idea that $F$ explains $E$, but drop "and agent-level causes don't." This allows multi-causality.

  **(Self-Correction on Recursion):**
