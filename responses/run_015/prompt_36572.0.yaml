      *   **Section 1: The Predictions of Bias (The "What Theory Says" part):**
          *   *Concept:* Hindsight bias makes the path look linear. Narrative fallacy makes it look like a story with a beginning (Sarajevo), middle (mobilization), and end (war).
          *   *Application:* Sarajevo wasn't inevitably the trigger until it *became* the trigger. The "July Crisis" looks like a domino effect in retrospect.
