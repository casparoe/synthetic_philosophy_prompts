  Regarding enforcement, I concede that international institutions are lethargic and often hostage to the very sovereignty claims that shaped the Convention. However, the failure to halt physical extermination is not evidence that the definition is too broad, but that the political will to intervene is too narrow. Shrinking the category to accommodate the weaknesses of our enforcement mechanisms is a capitulation that privileges institutional comfort over victimhood. If authoritarian regimes dismiss charges of cultural genocide as rhetoric, they would likely dismiss charges of physical genocide as internal affairs regardless; the shield of sovereignty is robust enough to withstand both. To tell a people that their systematic erasure is merely "assimilation" because their hearts still beat is to accept the perpetrator's logic over the victim's reality. We must not dilute the truth to suit the incapacity of our courts.
