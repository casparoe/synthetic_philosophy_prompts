answer: |-
  **Project Title:** The Occult Badness of Pain: Asymbolia as a Probe for Welfare Theory

  **Project Summary**
  Contemporary philosophy of pain is currently stalled on the metaphysics of asymbolia: is the condition real, and does it prove that pain's sensory and affective components are separable? This project bypasses that stalemate to ask a prior question in value theory: If pain asymbolia is possible—a state where a subject has the sensory experience of pain but lacks the negative attitude toward it—is that state *bad for* the subject? Standard welfare theories struggle here. Subjectivist accounts (desire/attitude-based) rule by fiat that un-minded pain is neutral, while Objectivist accounts (perfectionist/objective list) struggle to explain why a state is bad if it registers as such to no one. This fellowship year will be dedicated to constructing a rigorous test for "occult" views of welfare (views where a state can be bad for you without your minding it) using pain asymbolia as a diagnostic probe. The goal is to determine whether the concept of welfare fractures under the pressure of asymbolia or whether a robust theory can survive it.

  **The Research Question**
  The central question is determinate: *Does the sensory-discriminative component of pain, absent the affective-motivational component, constitute a decrement in individual welfare?*

  This is not merely a question about the nature of pain, but about the necessary conditions for badness. If a subject is in pain they do not mind, do not dislike, and would not lift a finger to stop, does their life go worse? I define "occult" views as those that answer "yes." My hypothesis is that occult views are in tension with the functional role of welfare concepts, yet standard arguments against them are circular. Desire-based and attitudinal theories build "non-minding" into the definition of badness from the start, announcing their result rather than deriving it. Conversely, evaluativist and imperativist accounts of pain often presuppose a link to badness that asymbolia severs. This project seeks to break this circle by isolating the variable of "subjective uptake" from the variable of "physiological/sensory state."

  **Methodology: Diagnostic Cases and Control Variables**
  To move beyond armchair speculation, I will employ a method of *Comparative Diagnostic Cases*. Rather than generating isolated intuition pumps, I will construct paired scenarios that function as experimental controls to isolate specific theoretical commitments. This approach treats intuitions not as data points, but as stress tests for theoretical coherence.

  1.  **The Asymbolic's Choice (Case A):** We consider a verified asymbolic subject offered a pill that restores the "sting" (unpleasantness) to their pain without altering the sensory location or intensity. They are told the sting will make the pain bothersome. Do they take it?
      *   *Theoretical Load:* If they refuse, it suggests the sensory state alone was not a welfare burden. If they accept, it suggests they recognize a prior deficit. This tests whether the "badness" was present *before* the attitude was restored.
  2.  **The Inverse Control (Case B):** A subject experiences intense distress and motivation to stop a state, but lacks the sensory quality of pain (a "painless suffering").
      *   *Theoretical Load:* This serves as a control to separate "badness" from "sensory quality." If theories judge Case A (pain without distress) and Case B (distress without pain) differently, we can locate whether the welfare loss stems from the sensation or the attitude. If they judge them the same, we can test if the "badness" is uniform or analogous.

  By cross-referencing judgments on these cases against standard welfare theories, I will map the breaking points of each. This is not merely "reading and thinking"; it is a structured mapping of reflective equilibrium. I will also consult clinical literature on asymbolia and anosognosia to ensure the cases remain medically plausible, grounding the philosophical abstraction in empirical reality.

  **Expected Outcomes**
  The project aims for one of two substantive results:
  1.  **A Defended Account:** A refined theory of welfare that explains why occult badness is either impossible or possible without rendering welfare unintelligible. This would likely involve a hybrid view where sensory states have *pro tanto* badness that requires subjective uptake to become *all-things-considered* bad.
  2.  **A Dissolution:** A demonstration that the question "Is it bad for them?" has no determinate answer because the concept of welfare splits into "phenomenal welfare" (how it feels) and "objective welfare" (how the organism functions) in these edge cases. This would argue that the dispute is not about the world, but about which concept we should privilege.

  **Risk Assessment**
  I am mindful of two primary failure modes. First, the project could collapse into the general, intractable debate over whether welfare must be accessible to the subject (the "experience requirement"). To mitigate this, I will restrict the scope specifically to the *pain* case, arguing that pain has unique phenomenological features that make it a special test case distinct from general pleasure/pain debates. Second, the disagreement may turn out to be merely verbal, with "bad for" meaning different things to different theorists. If the diagnostic cases reveal that theorists are simply talking past one another, the project will pivot to a conceptual engineering outcome: recommending which definition of welfare best serves ethical and medical practice.

  **Feasibility and Scope**
  Is this a year's work or one chapter? Realistically, the core argument could constitute a single dense chapter. However, the work required to bridge the philosophy of mind (asymbolia literature) and value theory (welfare accounts) justifies a year-long fellowship. The first six months will be dedicated to synthesizing the clinical and philosophical literature to construct the diagnostic cases rigorously. The second six months will focus on the theoretical mapping and drafting. This year will produce the theoretical backbone of the dissertation. Even if the final written output is two tightly integrated chapters, the intellectual labor of resolving the tension between occult views and subjectivist constraints is substantial enough to warrant full-time focus. This fellowship will allow me to secure the foundation of the dissertation, ensuring that the subsequent chapters on related phenomena (e.g., dementia, addiction) rest on a stable theory of welfare.
