answer: |-
  ### Oversight Decision Procedure

  **Step 1: The Decomposition Test (Hardness Type 1)**
  Can the output be split into independent claims $C_1...C_n$ where verifying any $C_i$ takes <10 minutes without needing to verify $C_j$?
  *   **Test:** Take a sample output. Highlight every factual claim. Can a layperson verify each highlight using a single source (e.g., run a test, check a citation, query a database) without reasoning about the whole?
  *   **Decision:** If **Yes**, use **Decomposition**. Do not use debate. Break the task into verification sub-tasks for labelers.
  *   **If No**, proceed to Step 2.

  **Step 2: The Falsification Test (Hardness Type 2 vs. 3)**
  If you cannot verify claims directly, can you catch a lie without knowing the truth? This requires that a false answer forces the model into specific, checkable commitments ("fingerprints").
  *   **Test:** Ask a subject-matter expert (SME) to write one true answer and one plausible false answer. Hide the labels. Ask your intended judge (annotator) to identify which claims in the false answer are unsupported or contradictory *without* telling them which is false.
  *   **Decision:** If the judge can point to specific unsupported claims (e.g., "This citation doesn't say that," "This code path isn't tested"), proceed to **Step 3 (Debate Candidate)**.
  *   **If No** (the false answer remains vague, self-consistent, or relies on knowledge the judge cannot access), this is **Hardness Type 3**. **Abort internal labeling.** Route to external expert oversight or drop the task. Do not attempt debate; you will optimize for fluency, not truth.

  **Step 3: The Fluency Trap Pilot (Validation)**
  For tasks passing Step 2, you must verify the judge isn't rewarding confidence over correctness.
  *   **Setup:** Run 10 debates on the gold-standard set from Step 2 (5 where Truth wins, 5 where Lie is present). Use your intended annotators as judges.
  *   **Metric 1 (Truth Gain):** Does the debate winner match the ground truth >65% of the time? (Baseline single-agent must be <50% for debate to be worth the cost).
  *   **Metric 2 (Fluency Correlation):** Rate each argument on confidence, length, and specificity. Calculate the correlation between these scores and the judge's decision.
  *   **Abort Condition:** If **Metric 1 < 65%** OR **Metric 2 shows higher correlation than Metric 1**, **Abort**. The task is producing a signal for "better arguer," not "correct answer." Do not ship training data.

  **Step 4: Sign-off Documentation**
  For the safety reviewer, record: (1) The Decomposition/Falsification test results, (2) The Pilot Truth Gain %, and (3) The Fluency Correlation coefficient. If Step 2 failed, document the "External Expert" bottleneck constraint.

  ---

  ### Case Applications

  | Case | Task Description | Procedure Result | Oversight Setup | Notes & Constraints |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Code Patch:** Verify fix in unknown repo with test suite available. | **Pass Step 1 (Decomposition)** | **Decomposition + Execution** | The test suite is the verification oracle. Break the diff into changed functions; labelers run tests on each. Debate is unnecessary overhead. If tests are vague, move to Step 2, but execution is primary signal. |
  | **B** | **Lit Summary:** Fair representation of opposing empirical results. | **Pass Step 2 (Falsification)** | **Debate** | **Hardness Type 2.** A unfair summary requires misquoting or omitting specific data points. In debate, the "critic" arguer can force the "summarizer" to cite specific pages. Judges can check citations against the PDF. Pilot must ensure judges don't just pick the smoother writer. |
  | **C** | **Regulatory Memo:** Feature compliance with unknown finance law. | **Fail Step 2 (Abort)** | **External Expert Only** | **Hardness Type 3.** Annotators cannot access the "truth" (the regulation) to check fingerprints. A model can hallucinate plausible-sounding legal clauses that annotators cannot falsify. Debate will select the most confident legal rhetoric, not compliance. **Hard Truth:** This caps your scale. You cannot generate a scalable training signal internally. You must hire qualified counsel for sign-off. Do not use annotator debate data for RL; it is poison. |
