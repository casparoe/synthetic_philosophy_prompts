      *Drafting the Procedure Steps:*
      1.  **Decomposition Test:** Can you split the output into claims $C_1...C_n$ where verifying $C_i$ takes <10 mins without context of $C_j$? If yes -> **Decompose**. Stop.
      2.  **Falsification Test:** If no, can a liar be forced to make specific claims that are checkable? (e.g., "The law says X" vs "The law implies Y"). If a lie requires inventing details that can be cross-referenced -> **Debate Candidate**. If a lie can remain vague/general -> **Abort**.
      3.  **Judge Symmetry Test (Pilot):** Run 10 debates on gold-standard data (verified by expert). Measure: Does judge accuracy correlate with *argument specificity* or *argument confidence*? If confidence predicts win more than truth -> **Abort** (Fluency Trap).
      4.  **Gain Threshold:** Does Debate accuracy exceed Single-Agent accuracy by >15%? If no -> **Abort**.

      *Refining the "Abort" logic:* The user wants to know when to say "no training signal."
      *   If the task is Type 3 (Opaque Consistency), debate selects the best bullshitter.
      *   Procedure must explicitly route to "External Expert" or "Drop Task."

      *Case C:* User says "C is the one I'll like least." I need to be blunt. If annotators don't know the regulation, they cannot verify fingerprints. Debate will select the most confident legal-sounding text. This is Type 3. Verdict: External expert only. No internal training signal.

