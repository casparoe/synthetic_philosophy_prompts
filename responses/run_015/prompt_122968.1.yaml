  2.  **Deconstruct the Theory (Scalable Oversight/Debate):**
      *   *Decomposition:* Works when verification is local. If I can check step A, then step B, then step C, I don't need debate. I need task splitting.
      *   *Debate:* Works when verification is global/hard, but *falsification* is easier than verification. If a lie requires specific claims that can be cross-examined, debate helps. The judge doesn't need to know the truth, just spot the inconsistency or the unsupported claim.
      *   *Failure Mode:* If the truth is opaque even under cross-examination (e.g., complex regulation where both sides can sound plausible), debate just selects the better rhetorician. This is the "arguer smarter than judge" problem.
      *   *Abort:* If neither decomposition nor debate yields a signal better than random/guessing, do not generate training data. It's poison.

  3.  **Drafting the Procedure:**
      *   Need steps that map to the user's three categories of hardness.
      *   Need a pilot test metric to detect the "fluency over truth" failure.
      *   Need clear abort conditions.
      *   *Step 1: Decomposition Check.* Can the task be split into independent verifiable claims? If yes, decompose.
      *   *Step 2: Falsifiability Check.* If not decomposable, can a lie be caught without knowing the truth? (The "fingerprints" test).
      *   *Step 3: Judge Capability Check.* Can a weaker judge spot the fingerprint? (The "fluency trap" test).
      *   *Step 4: Abort.* If all fail, stop.

      *Refining the Pilot Test:* How to measure "fluency over truth"?
      *   Run a debate where you *know* the ground truth (synthetic or expert-verified).
      *   Measure if the judge picks the truth *because* of the argument quality or *despite* it.
      *   Better: Give the judge a task where one side is instructed to lie convincingly. If the judge picks the liar >50% of the time when the lie is consistent, debate fails.
      *   Actually, simpler for a 3-day pilot: Compare "Single Agent Answer" vs. "Debate Winner" against a small gold standard set (expert verified). If Debate doesn't beat Single Agent significantly, abort.
      *   Even better specific test for the "fluency trap": Check correlation between argument confidence/length and correctness. If high confidence correlates with wrongness, abort.

      *Refining the "Three Hardnesses":*
      1.  *Verifiable Components:* -> Decomposition.
      2.  *Falsifiable Claims:* -> Debate.
      3.  *Opaque Consistency:* -> Abort/Expert.

  4.  **Drafting the Case Studies:**
      *   *Case A (Code Patch):* Repo available, tests runnable, but codebase unknown.
          *   Can we decompose? Yes, run tests. But tests might be incomplete.
          *   Can we debate? "This line breaks X" vs "No it doesn't".
          *   Verdict: Decomposition + Execution. Debate secondary.
      *   *Case B (Literature Summary):* Opposing results fairness.
          *   Decomposition? Check citations.
          *   Debate? One side says "ignored nuance", other says "represented fairly". Judge can check the cited paper.
          *   Verdict: Debate viable (falsifiable claims about text).
      *   *Case C (Regulatory Memo):* Product known, regulation unknown.
          *   Decomposition? No, regulation is the black box.
          *   Debate? Both sides can sound legalistic. Judge doesn't know law.
          *   Verdict: Opaque Consistency. Abort internal labeling. Need expert.

  5.  **Writing & Editing (Constraint Check):**
      *   *Word Count:* Keep it tight. No intros/outros.
      *   *Tone:* Professional, directive.
      *   *Specific Requirement:* "Don't soften it into something I'd rather hear" for Case C.
      *   *Specific Requirement:* "Ordered decision procedure."
