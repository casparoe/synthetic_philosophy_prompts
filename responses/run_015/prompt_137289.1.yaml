answer: |-
  **Term Paper Proposal**
  **Course:** Graduate Seminar in Philosophy of Language
  **Topic:** Contrast Sensitivity and the Diagnostics of Derogation

  **Research Question**
  Is the derogatory force of slurs intrinsic to their semantic content, or is it an artifact of the pragmatic cost involved in selecting a marked expression over an available neutral counterpart? Standard diagnostics for this debate rely on projection tests (negation, questioning, conditional embedding) and cancellation attempts. Both the view that derogation is semantic content and the view that it is a species of pragmatic force assume these tests yield stable data. This paper challenges that assumption. It asks: If offensiveness is partly contrast-sensitive—dependent on the availability of an unmarked alternative—do the standard diagnostics reliably distinguish semantic content from pragmatic force, or do they merely measure the cost of the speaker's lexical choice?

  **The Gap in Existing Positions**
  The current debate is stalled because opposing positions appeal to the same limited set of linguistic intuitions. The semantic view argues that because derogation survives negation (e.g., "He is not a [slur]"), the derogation must be part of what is said. The pragmatic view argues that because derogation can sometimes be contextually modulated, it belongs to use rather than meaning. Both sides, however, rely on cases where a clean, uncontested neutral counterpart exists (e.g., a specific ethnic slur versus a demonym).

  This shared evidential base is confounded. Every standard test features a speaker who uses a slur when a neutral way of picking out the group was available and passed over. If the offense derives partly from that contrast—the marked choice against an unmarked option—then the tests register the cost of the choice rather than the presence of a derogatory component in the content. Consequently, the inference from projection data to semantic conclusions is weaker than the literature assumes. This gap remains open because the literature has not systematically examined cases where the "neutral counterpart" is absent, contested, or reclaimed.

  **Methodology and Timeline**
  Given the constraints of a one-semester timeline and the absence of ethics clearance for experimental subjects, this paper will employ conceptual analysis and the method of cases. I will not construct a new corpus or survey subjects. Instead, I will analyze attested and hypothetical linguistic scenarios drawn from public discourse and existing philosophical literature to test the stability of intuitions under varying conditions of "counterpart availability."

  *   **Month 1: Mapping the Diagnostics.** I will reconstruct the arguments for the semantic and pragmatic positions, isolating the specific diagnostic tests they rely on. I will formalize the "Clean Counterpart Assumption" implicit in these tests.
  *   **Month 2: Developing the Contrast Hypothesis.** I will articulate the contrast-sensitive model of offense. I will identify three categories of test cases where the Clean Counterpart Assumption fails: (1) Reclaimed slurs where the group prefers the slur to the neutral term; (2) Contested neutrals where the "neutral" term is itself rejected by the target group; and (3) Cases where no specific neutral counterpart exists, only a paraphrase.
  *   **Month 3: Testing and Drafting.** I will apply the standard diagnostics to these three categories. If the contrast hypothesis is correct, projection and offensiveness should vary across these categories in ways the standard models do not predict. I will draft the core argument and compare slurs to non-slurring taboo vocabulary to isolate the specific mechanism.
  *   **Month 4: Refinement.** I will address objections regarding the definition of "availability" and finalize the conclusion.

  **Possible Conclusions**
  There are three likely outcomes. First, the contrast hypothesis may explain the data better than standard models, suggesting that projection tests do not prove semantic content. Second, the data may remain stable even when neutral counterparts are absent, supporting the standard view that derogation is intrinsic. Third, a hybrid result may emerge where contrast explains some data but not all.

  The deciding factor will be the behavior of slurs in the "no counterpart" cases. If a slur retains its full derogatory force and projects identically even when no neutral alternative was available to the speaker, the contrast hypothesis fails. If the derogatory force diminishes or projection becomes unstable in those cases, the semantic view is undermined.

  **Assessment of Scope**
  A 6,000-word limit restricts this paper to a targeted methodological critique rather than a comprehensive theory of slurs. I cannot address every category of slur or every semantic theory. I will focus strictly on the validity of the diagnostic tests. This scope is manageable but tight; I must avoid drifting into general ethics or sociology. The primary risk is that any contrast effect I identify generalizes to all taboo or register-sensitive vocabulary, meaning I have discovered a fact about appropriateness rather than slurs specifically. To mitigate this, the design explicitly compares slurs to non-derogatory taboo terms (e.g., profanity) in the third month. If the contrast effect applies equally to profanity, the result is about register; if it applies uniquely to slurs, the result is about derogation.

  **Nature of the Result**
  A successful paper will primarily establish a result about the **methodology of the debate**, with secondary implications for slurs. It will demonstrate that the standard diagnostic tests are insufficient to settle the semantic/pragmatic dispute because they rely on an unexamined assumption about counterpart availability. A reader who begins neutral should end convinced that the current stalemate is due to flawed data selection, and that any future resolution requires controlling for contrast effects before assigning semantic content.

  **Address to the Skeptic**
  To the most skeptical member of the seminar: The single finding that would lead me to abandon the contrast hypothesis is if slurs exhibit robust projection and undiminished offensiveness in contexts where the speaker could not have reasonably used a neutral counterpart (e.g., in-group reclamation contexts where the neutral term is considered hostile). The reasoning is most likely to break on the definition of "availability." If "availability" is defined too loosely, the hypothesis becomes unfalsifiable; if defined too strictly, it ignores social reality. I will attempt to anchor "availability" in public discourse norms rather than individual speaker knowledge to avoid this trap. If I cannot define availability without circularity, the proposal fails.
