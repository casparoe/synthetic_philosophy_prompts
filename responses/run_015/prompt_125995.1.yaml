answer: |-
  Critically assess whether lexical threshold negative utilitarianism is self-undermining because it requires a common scale of intensity to define its threshold, thereby collapsing into the hedonistic monism it rejects. Use the 'Dimmer' scenario to demonstrate whether the metrics required to locate the threshold inevitably force a commitment to commensurability, and address whether probabilistic modifications escape this dilemma or merely reintroduce the common currency of expected value. You must take a stand on whether the view can establish lexical priority without a common scale and, if so, explain what fixes the direction of that priority given that incommensurability is typically symmetric.

  The view is self-undermining because it cannot define the lexical threshold without employing the cardinal metric of well-being that would render the lexical distinction arbitrary. To assert that suffering at intensity 7.1 lexically dominates all pleasure, while suffering at 6.9 trades off normally, the theorist must possess a precise method for measuring and comparing intensities of pain. The 'Dimmer' case exposes this requirement: choosing between four seconds of 7.1 agony and a trillion years of 6.9 headaches requires the agent to locate both experiences on a single cardinal scale of pain intensity. If such a scale exists for pain—allowing us to say 7.1 is distinctly greater than 6.9 in a way that matters for moral calculation—then pain is quantifiable.

  The collapse into hedonistic monism occurs when we ask how sub-threshold pain interacts with pleasure. The view stipulates that 6.9 pain trades off against pleasure. For this trade-off to be rational rather than random, there must be a common currency converting units of 6.9 pain into units of pleasure. If pain and pleasure share a common currency for trade-offs below the threshold, they are commensurable. Once commensurability is granted for the range 0.0–7.0, the barrier at 7.1 becomes inexplicable. If one unit of pain can be exchanged for one unit of pleasure at intensity 6.9, there is no structural reason why enough units of pleasure cannot exchange for one unit of pain at intensity 7.1, unless the theorist posits a qualitative discontinuity. However, the 'Dimmer' case relies on quantitative intensity (0–10 scale), not qualitative kind. If the distinction is quantitative, the lexical barrier is arbitrary; if it is qualitative, the 0–10 scale is incoherent.

  The probabilistic objection reinforces this collapse. If the disvalue of crossing the threshold is lexically infinite, any nonzero probability of causing 7.1 agony swamps all potential pleasure, leading to moral paralysis. To avoid this, the theorist might introduce a probability threshold (e.g., risks below 0.001% are ignored). However, setting this threshold requires weighing the probability against the magnitude of disvalue. This calculation is effectively an expected utility function, which multiplies probability by disvalue. This multiplication reintroduces a cardinal scale for disvalue. If disvalue is cardinal enough to be multiplied by probability to determine action, it is cardinal enough to be traded off against pleasure. The attempt to save the view from paralysis by adjusting probability thresholds silently reinstates the common currency the view explicitly denies.

  Regarding the direction of priority, incommensurability is symmetric: if A and B are incommensurable, neither outweighs the other. To claim pain lexically outweighs pleasure is to assert an asymmetry. This asymmetry requires a higher-order standard by which pain is judged more significant than pleasure. But if such a standard exists, it functions as a common scale. The theorist cannot have it both ways: they cannot claim pain and pleasure are too different to trade off (incommensurable) while simultaneously claiming pain is sufficiently comparable to pleasure to dominate it (lexical priority). The only way to fix the direction of priority is to admit a common scale where pain units weigh heavier than pleasure units. But this is not lexical negative utilitarianism; it is weighted hedonism. Therefore, the view cannot state its central claim without helping itself to the commensurability it rejects. It survives only by disguising a single scale as a lexical barrier, making it theoretically unstable.

  **Marking Scheme (20 Marks)**

  1.  **Diagnosis of Commensurability Requirement (5 marks):** Identifies that defining a specific intensity threshold (e.g., 7.0 vs 7.1) requires a cardinal scale of pain intensity.
      *   *Typical Error:* Treating the threshold as purely qualitative without addressing the measurement problem.
  2.  **Application of the 'Dimmer' Case (5 marks):** Uses the scenario to show that comparing aggregated sub-threshold pain against supra-threshold pain necessitates a common metric for pain.
      *   *Typical Error:* Describing the intuition of the case without analyzing the metric required to solve it.
  3.  **Explanation of Collapse into Monism (5 marks):** Argues that if pain and pleasure trade off below the threshold, they share a currency, making the lexical barrier above the threshold arbitrary or unintelligible.
      *   *Typical Error:* Asserting the collapse happens without explaining the link between sub-threshold trade-offs and supra-threshold lexicality.
  4.  **Handling of Probability/Risk (5 marks):** Explains that avoiding paralysis via probability thresholds reintroduces expected utility calculations, which require a cardinal scale.
      *   *Typical Error:* Ignoring the probability element or treating it as a separate issue rather than a reinforcement of the cardinality problem.

  **B-Grade Cap:** Answers that correctly restate the view and the 'Dimmer' case but never say which premise the threshold theorist should give up and what giving it up costs will be capped at 12/20. To exceed this, the student must explicitly argue that the view is structurally incoherent rather than merely counterintuitive.
