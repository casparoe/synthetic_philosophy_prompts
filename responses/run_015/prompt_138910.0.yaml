answer: |-
  ### Stage 1: Brainstorming Candidate Mechanisms

  1.  **Eccentric Preference for Completion:** The agent simply has a strong utility function weight on "finished states."
      *   *Setting aside:* This concedes the TA's point that it is merely a "history-dependent preference" compatible with expected utility, failing to show a rational *failure* in stopping.
  2.  **Precommitment and Resolution:** Continuing maintains the agent's capacity to bind her future self to difficult plans.
      *   *Setting aside:* This is a forward-looking instrumental reason (building willpower), which the TA will correctly classify as a standard exception to the sunk cost fallacy.
  3.  **Diachronic Integrity of Agency:** Rationality applies to temporally extended projects, not time-slices; abandoning a project fractures the unity of the agent.
      *   *Setting aside:* While strong, this risks metaphysical obscurity in a ten-minute presentation and may collapse into a preference for identity coherence.
  4.  **The Constitutive Norm of Non-Futility:** Effort inherently aims at an end; when effort exists without an end, it constitutes objective waste, which rationality minimizes.
      *   *Selection:* This locates the reason in the normative status of the *effort itself* (which only exists after starting), satisfying the "no reason to begin" test while asserting an objective normative claim rather than a subjective taste.

  ### Stage 2: The Final Case

  **1. The Scenario**
  Elena, a tenure-track historian, volunteers to transcribe a private, obscure diary for a local archive. She is 90% complete when definitive proof emerges that the diary is a literary forgery with no historical value. Publishing the transcription will yield no professional credit, citations, or reputation boost, and the archive imposes no deadline or penalty for abandonment. Finishing the transcription requires 20 hours of labor; starting a new, valuable research project also requires 20 hours. By any forward-looking cost-benefit reckoning, Elena ought to stop immediately and begin the new project, as the transcription produces no future good. However, if she stops now, the 180 hours already spent become objectively futile debris; if she finishes, that same labor becomes a completed investment. Elena has most reason to finish, not because she enjoys it, but because stopping would render her past agency objectively futile.

  **2. The Blocking Audit**
  *   **Reputation/Signaling:** The work is private and the field knows it is a forgery; no one observes her completion or abandonment, so no signaling value exists.
  *   **Information:** The forgery status is definitive; continuing yields no new epistemic value about the text or her own judgment reliability.
  *   **Options/Skills:** The transcription skill is generic and already mastered; finishing confers no transferable skill or option value beyond what she already possesses.
  *   **Tastes/Precommitment:** The case stipulates she gains no satisfaction from finishing; the reason is not to build willpower but to avoid the normative status of waste.
  *   **Duties/Obligations:** She volunteered with no contract; no promise was made to the archive or any third party, so no deontic obligation exists.
  *   **Continue-but-Do-Not-Start Test:** If Elena had not yet begun, she would have no reason to start (cost exceeds benefit); the reason to continue exists *only* because the past effort already exists and requires redemption.

  **3. The Verdicts**
  *   **Sequential Expected-Utility:** Says **Stop**. The 180 hours are gone regardless; rationality maximizes future utility, and the new project yields higher future utility than the forgery transcription.
  *   **Non-Futility View:** Says **Continue**. Rationality minimizes objective waste; stopping actualizes the futility of the past 180 hours, whereas continuing retroactively validates them as necessary costs of a completed end.
  *   **Why:** EU treats past effort as metaphysically dead; the Non-Futility view treats the *normative status* of past effort as contingent on future completion.

  **4. The Principle Doing the Work**
  *   **Principle:** **The Constitutive Norm of Non-Futility.** Action is constitutively aimed at ends; when substantial effort has been expended, rationality requires securing an end for that effort if the cost to do so is less than the disvalue of objective futility.
  *   **Triggering Feature:** The existence of substantial, unredeemed past effort.
  *   **Removal:** If the past effort is removed (the "start from scratch" case), the norm is not triggered, and there is no reason to begin, satisfying the non-transferability constraint.

  **5. The Strongest Reply Available to a Defender of the Bygones Principle**
  "The Non-Futility view commits a category error by treating the *description* of past events as dependent on future actions. The labor was either useful or useless at the moment it was expended based on the information available then; your 'objective waste' is merely a subjective feeling of regret projected backward. Rationality governs the selection of futures, not the metaphysical redemption of the past, and to claim otherwise is to grant the dead hand of the past authority over the living present without any mechanism of causal influence."
