answer: |-
  ### The Psychiatric Kinds Sorting Instrument

  **Instructions:** Read each claim below. Answer **Yes** if you agree with the statement as written, **No** if you disagree. Follow the path indicated. You do not need to know the specific literature behind the positions; your clinical intuition about the cases provided is sufficient.

  ***

  **Q1. The Billing Case:**
  Consider a scenario where a new reimbursement code is introduced. Prevalence statistics shift immediately because clinicians use the code to secure resources, but no patient changes their behavior or self-understanding because of the label.
  *Claim:* "If the category successfully secures treatment resources, its ontological status (whether it is 'real' or 'constructed') is secondary to its utility."
  *   **Yes:** Go to **Leaf A**.
  *   **No:** Go to Q2.

  **Q2. The Mechanism Claim:**
  Think of a standard medical diagnosis (e.g., pneumonia). It is valid because there is a specific broken part or pathogen causing the symptoms.
  *Claim:* "A valid psychiatric category must track a specific underlying internal dysfunction, not just a cluster of observed behaviors."
  *   **Yes:** Go to **Leaf B**.
  *   **No:** Go to Q3.

  **Q3. The Network Claim:**
  Consider a patient where insomnia causes fatigue, which causes irritability, which worsens insomnia.
  *Claim:* "The symptoms themselves are the cause of the disorder; there is no need to posit a hidden 'latent disease' behind the symptoms to explain why they cluster."
  *   **Yes:** Go to **Leaf C**.
  *   **No:** Go to Q4.

  **Q4. The Adult ADHD Case:**
  Consider a presentation where the public recognizability of the category seems to be part of why prevalence climbs (people recognize themselves in the description and seek diagnosis).
  *Claim:* "If awareness of the diagnosis increases the likelihood of fitting the diagnosis, the scientific validity of the category is compromised."
  *   **Yes:** Go to **Leaf D**.
  *   **No:** Go to Q5.

  **Q5. The Opaque Loop Case:**
  Consider a category whose criteria come from a proprietary machine-learning clustering of smartphone keystroke dynamics and sleep data. Patients are told they crossed a threshold but cannot see or contest the criteria.
  *Claim:* "Because the patients cannot access the description of the kind, the classification cannot change who they are (the looping effect is broken)."
  *   **Yes:** Go to **Leaf E**.
  *   **No:** Go to Q6.

  **Q6. The Diagnostic Decay Case:**
  Consider a case where the label makes people manage or hide the behavior enough that the criteria stop picking them out (e.g., a patient learns to mask symptoms to avoid stigma).
  *Claim:* "This instability means the category is real, but it is a moving target that never settles into a fixed equilibrium."
  *   **Yes:** Go to **Leaf F**.
  *   **No:** Go to Q7.

  **Q7. The Prolonged Grief Case:**
  Consider a contested new category that arrived partly because bereaved people organized around having their grief taken seriously.
  *Claim:* "When patients organize to retain a label, they are primarily claiming a valid identity or community, not necessarily describing a medical pathology to be cured."
  *   **Yes:** Go to **Leaf G**.
  *   **No:** (If you answered No to all above): Go to **Leaf F** (Default Looping Realism).

  **Q8. The Control Question:**
  *Claim:* "Regardless of the ontology, the primary clinical obligation is to reduce the patient's suffering."
  *   **Yes:** (All positions should answer Yes).
  *   **No:** (If you answer No, you likely hold a position outside the scope of this seminar, such as pure social control theory).

  ***

  ### The Leaves (Positions)

  **Leaf A: Pragmatic Instrumentalism**
  *   **Path:** Q1=Yes.
  *   **View:** The category is a tool. Whether it maps onto a "real" kind in nature is less important than whether it opens doors to care, insurance, and support. The Billing Case is a feature, not a bug.
  *   **Authority:** Derived from institutional utility and resource allocation.

  **Leaf B: Harmful-Dysfunction Medical Realism**
  *   **Path:** Q1=No, Q2=Yes.
  *   **View:** Psychiatry should mimic general medicine. A category is only real if it identifies a failure of a designed function (a dysfunction) that causes harm. Looping effects are noise or error to be controlled.
  *   **Authority:** Derived from biological or functional facts independent of classification.

  **Leaf C: Network / Symptom-Level View**
  *   **Path:** Q1=No, Q2=No, Q3=Yes.
  *   **View:** There is no hidden "ghost in the machine." The disorder *is* the causal network of symptoms. Treatment should target specific symptom connections rather than a latent cause.
  *   **Authority:** Derived from observable causal relations between behaviors and experiences.

  **Leaf D: Skeptical Eliminativist Constructivism**
  *   **Path:** Q1=No, Q2=No, Q3=No, Q4=Yes.
  *   **View:** If the classification creates the very thing it classifies (as in the ADHD case), the category is scientifically bankrupt. We should eliminate these kinds because they manufacture rather than discover reality.
  *   **Authority:** None; these categories should be dismantled.

  **Leaf E: Mechanistic Property Cluster (MPC)**
  *   **Path:** Q1=No, Q2=No, Q3=No, Q4=No, Q5=Yes.
  *   **View:** Categories are real clusters of properties that tend to co-occur, but they are stable enough to be treated as indifferent kinds *if* the patient is unaware. The Opaque Loop breaks the interactivity, returning the kind to a standard medical model status.
  *   **Authority:** Derived from statistical clustering and underlying (but perhaps complex) mechanisms.

  **Leaf F: Hacking-Style Looping-Aware Realism**
  *   **Path:** Q1=No, Q2=No, Q3=No, Q4=No, Q5=No, Q6=Yes (or Q7=No).
  *   **View:** The kind is real, but it is unstable. The interaction between the classifier and the classified changes the target. The Diagnostic Decay case shows the kind is genuine but ephemeral; truth exists, but it moves.
  *   **Authority:** Derived from the dynamic interaction between knowledge and reality.

  **Leaf G: Neurodiversity / Reclamation Realism**
  *   **Path:** Q1=No, Q2=No, Q3=No, Q4=No, Q5=No, Q6=No, Q7=Yes.
  *   **View:** Looping is not a threat to validity but a process of identity formation. The Prolonged Grief case shows that adopting the label can be an act of empowerment. The kind is real *because* of the social consolidation, not despite it.
  *   **Authority:** Derived from lived experience, community consensus, and political agency.

  ***

  ### Instructor Notes & Meta-Analysis

  **1. Unseparable Leaves**
  *   **Leaf B (HD) and Leaf E (MPC):** In practice, these are difficult to separate. Both rely on the idea that there is a "fact of the matter" independent of the patient's awareness. A clinician might agree that mechanisms are required (Q2=Yes) but also believe opaque loops don't change the patient (Q5=Yes). If a participant lands in both camps, treat them as **Biological Realists**. The distinction is philosophical nuance (function failure vs. statistical cluster) rather than clinical practice.
  *   **Leaf F (Hacking) and Leaf G (Neurodiversity):** Both accept looping. The split relies entirely on Q7 (Normativity). If a participant believes the looping is both unstable (F) *and* empowering (G), they occupy a hybrid space. This is common in modern trauma-informed care. You may need to merge these into a single **"Interactive Realism"** leaf if the room finds the distinction too fine.

  **2. Empty or Unoccupied Combinations**
  *   **The "Realist Eliminativist":** There is no path to a position that claims "The category tracks a real biological mechanism (Q2=Yes) BUT we should eliminate it because looping occurs (Q4=Yes)." This combination is incoherent. If it tracks a mechanism, looping is usually viewed as noise (Leaf B), not a reason for elimination.
  *   **The "Opaque Pragmatist":** A participant who says Utility is primary (Q1=Yes) but also insists on Mechanism (Q2=Yes) is rare. Usually, if utility is the goal, the mechanism becomes secondary. If you find one, they are likely a **Conservative Clinician** who wants biological proof to justify billing.

  **3. The Control Question (Q8)**
  *   Every position from Harmful-Dysfunction to Neurodiversity should answer **Yes** to Q8 ("Obligation to reduce suffering").
  *   **Why use this?** It demonstrates that ontological disagreements (what the disease *is*) do not necessarily translate to ethical disagreements (what we should *do*). This prevents the seminar from devolving into "Realists care about patients, Constructivists don't." Both care; they just disagree on what they are treating.

  **4. Case Commitments**
  *   **Answering Q1 (Billing):** Commits you to viewing psychiatric categories as tools of the healthcare system first, and descriptions of nature second.
  *   **Answering Q4 (ADHD):** Commits you to a specific view of truth. "Yes" means you believe truth must be static and independent of observation. "No" means you accept that human sciences differ from natural sciences.
  *   **Answering Q5 (Opaque ML):** This is the critical fork for modern psychiatry. "Yes" assumes you cannot be changed by what you do not know (a classical view). "No" assumes institutions can shape you without your consent (a critical view).
  *   **Answering Q7 (Grief):** Commits you to a stance on power. "Yes" views the patient as a co-author of the diagnosis. "No" views the patient as a subject of the diagnosis.

  **5. Tone vs. Substance**
  *   Be honest with the room: The difference between **Leaf F (Hacking)** and **Leaf G (Neurodiversity)** is often tone. Leaf F sounds anxious about instability; Leaf G sounds celebratory about fluidity. Philosophically, they agree on the mechanism (looping), but they disagree on the *value* of that mechanism. If the room presses this, acknowledge that this is an ethical split, not an ontological one.
