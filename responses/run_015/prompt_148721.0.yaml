          *   *Theory Prediction:* Strong pre-commitment signals a break from authoritarianism. Builds international/domestic credibility.
          *   *Reality:* Alfonsín limits liability to "decision makers" initially (Theory of the Two Devils), but the Trial happens.
          *   *Payoff:* High legitimacy for Alfonsín. High anxiety for Military.

      *   **Phase 2: Retroactive Release I (1986-1987).**
          *   *Action:* Punto Final (deadline) & Obediencia Debida (presumption of coercion).
          *   *Theory Prediction:* If the cost of pre-commitment (coup risk) exceeds the benefit (legitimacy), a rational actor seeks release.
          *   *Reality:* Easter Week rebellion (Carapintadas). Alfonsín negotiates.
          *   *Analysis:* This fits the model *mostly*. The cost of accountability became too high (civil war threat).

      *   **Phase 3: Retroactive Release II (1989-1990).**
          *   *Action:* Menem's Pardons.
          *   *Theory Prediction:* A new administration might view previous pre-commitments as binding constraints they wish to shed for political expediency (reconciliation/stability).
          *   *Reality:* Little backlash compared to the laws.
          *   *Analysis:* Here the model struggles. Why was the "bond" so easily broken?

  5.  **Critique the Framework (Where it Breaks):**
      *   *Alfonsín's Reversal:* Is it just weakness? The model suggests rational calculation (stability > justice). But it misses the *narrative* shift. Alfonsín framed the laws as necessary to *save* democracy, not abandon it. The model treats "justice" and "stability" as static values, but Alfonsín redefined stability as a prerequisite for justice.
      *   *Menem's Pardons:* The model predicts backlash because breaking pre-commitments erodes trust. Why little backlash?
