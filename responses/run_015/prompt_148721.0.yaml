          *   Avoid simple timeline summary; focus on testing the theory and exposing blind spots.

  2.  **Define the Theoretical Framework:**
      *   *Democratic Pre-commitment:* A new democracy establishes institutions/laws to constrain future actions (e.g., "We will prosecute abusers no matter what"). This builds credibility and rule of law.
      *   *Retroactive Release:* The state later creates legal mechanisms to undo those commitments (e.g., amnesty laws, pardons) to stabilize the regime or manage crises.
      *   *Tension:* The trade-off between *Justice/Legitimacy* (long-term democratic consolidation) and *Stability/Security* (short-term survival against coups).

  3.  **Map the Actors & Payoffs (The "Game"):**
      *   **Raúl Alfonsín (UCR/Executive):** Wants legitimacy, rule of law, civilian control. Fears military coup.
          *   *Payoff:* High legitimacy if trials proceed; High stability risk if military revolts.
      *   **Military High Command (Carapintadas, etc.):** Wants immunity, preservation of hierarchy, no prosecutions.
          *   *Payoff:* Freedom from prison; Maintenance of institutional integrity. Threat: Coup.
      *   **Human Rights Groups (CONADEP, Madres, CELS):** Want full truth, punishment for all responsible.
          *   *Payoff:* Justice for victims; Moral vindication. Threat: Loss of moral authority, demobilization.
      *   **The Courts (Judiciary):** Independent but vulnerable.
          *   *Payoff:* Uphold law vs. Fear of executive/military override.

  4.  **Analyze the Sequence through the Lens:**

      *   **Phase 1: Pre-commitment (1983-1985).**
