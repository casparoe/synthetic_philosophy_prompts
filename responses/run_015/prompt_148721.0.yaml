          *   *Economic Crisis:* Hyperinflation overshadowed justice.
          *   *Peronist Hegemony:* Menem had a mandate for "pacification."
          *   *Blind Spot:* The model assumes the *public* values the pre-commitment as much as the *elites*. It didn't.
      *   *The Madres:* Did they change the payoff?
          *   *Standard Model:* Interest groups exert pressure.
