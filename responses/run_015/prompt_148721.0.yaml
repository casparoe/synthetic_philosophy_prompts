prompt: |-
  Analyze Argentina's Trial of the Juntas in 1985 and then the '86 Punto Final and '87 Obediencia Debida laws through the lens of democratic pre-commitment and retroactive release — basically the idea that a new democracy can bind itself to accountability and then legally dissolve that bond. Map the actors carefully (Alfonsín, the military high command, human rights groups, the courts), spell out the options and payoffs they actually faced, and say what the framework predicts they should do. Then tell me where the model breaks: can it explain Alfonsín's reversal without treating it as pure weakness, and why Menem's pardons in 1989-1990 got away with so little backlash? Be explicit about where the theory is silent — for instance, on whether the Madres de Plaza de Mayo changed the payoff structure in a way the framework cant capture. Dont just summarize the timeline; I want the episode to test the idea and the idea to expose blind spots in the standard transitional-justice narrative.
reasoning: |-
  Here's a thinking process that leads to the analysis above:

