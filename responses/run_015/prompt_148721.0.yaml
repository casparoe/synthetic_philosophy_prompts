answer: |-
  ### Theoretical Framework: Pre-commitment vs. Retroactive Release

  To analyze Argentina's transition, we must define the theoretical stakes. **Democratic Pre-commitment** posits that a nascent democracy binds itself to strict rules (e.g., prosecuting human rights violators) to signal a break from authoritarianism, build institutional credibility, and lock in the rule of law. **Retroactive Release** occurs when the state, facing existential threats or shifting political incentives, legally dissolves those bonds (amnesties, pardons) to prioritize regime survival or political expediency.

  The standard model assumes rational actors weighing **Legitimacy** (long-term democratic consolidation) against **Stability** (short-term survival against coups or economic collapse). It predicts that pre-commitment will be maintained unless the cost of enforcement threatens the regime's existence.

  ### 1. Actor Mapping and Payoff Structures (1983–1985)

  **The Actors:**
  *   **Raúl Alfonsín (UCR/Executive):** Seeks to establish civilian supremacy and moral legitimacy.
  *   **Military High Command (and *Carapintadas*):** Seeks institutional preservation, immunity from prosecution, and maintenance of hierarchy.
  *   **Human Rights Groups (CONADEP, *Madres*, CELS):** Seek truth, punishment for all perpetrators, and moral vindication.
  *   **The Judiciary:** Seeks independence but faces coercion from both Executive and Military.

  **The Payoff Matrix (The Trial of the Juntas):**
  *   **Alfonsín:**
      *   *Option A (Prosecute):* High Legitimacy (domestic/international), High Coup Risk.
      *   *Option B (Amnesty):* Low Legitimacy (seen as continuation of authoritarianism), Low Coup Risk.
      *   *Choice:* **Prosecute.** Alfonsín calculates that the UCR's mandate is strong enough to absorb military grumbling, and that *not* prosecuting poses a greater long-term legitimacy risk.
  *   **Military:**
      *   *Option A (Accept Trial):* Loss of Status, Prison for Leaders.
      *   *Option B (Revolt):* Potential to overturn trials, Risk of Civil War/Defeat.
      *   *Choice:* **Grumble but Accept (initially).** The Junta leaders were isolated; the bulk of the military was wary of civil conflict.
  *   **Human Rights Groups:**
      *   *Payoff:* Maximum if all ranks are tried; Minimum if only top leaders are tried.
      *   *Strategy:* Mobilize public opinion to raise the cost of Option B for Alfonsín.

  **Model Prediction:** The framework predicts a successful pre-commitment. The cost of a coup in 1983–84 was too high for the military given their defeat in the Falklands and low public support. The Trial of the Juntas (1985) confirms this: the democracy binds itself to accountability.

  ### 2. The First Retroactive Release: Punto Final & Obediencia Debida (1986–1987)

  **The Shift:**
  By 1986, the scope of prosecutions widened beyond the Junta leaders to mid-level officers. The military's payoff structure shifted. The threat was no longer just prison for generals, but the dissolution of the institution's chain of command.

  **The *Carapintadas* Rebellion (Easter Week 1987):**
  *   **Military Option:** Revolt. Payoff: Stop prosecutions. Risk: Civil war.
  *   **Alfonsín Option:** Crush revolt OR Negotiate.
      *   *Crush:* Requires loyal troops (uncertain). Risk: Fracture army, potential coup.
      *   *Negotiate:* Pass laws limiting liability. Cost: Betray pre-commitment.

  **The Laws:**
  *   *Punto Final (1986):* Set a 60-day deadline for new indictments.
  *   *Obediencia Debida (1987):* Presumed lower/mid ranks acted under coercion, exempting them from liability.

  **Model Analysis:**
  The framework explains this well as a **Stability Override**. The cost of pre-commitment (military insurrection) exceeded the benefit (legitimacy). Alfonsín rationally chose regime survival over full justice. The "bond" was dissolved not because the principle changed, but because the enforcement mechanism (civilian control over the military) was not yet robust enough to bear the weight of the commitment.

  ### 3. Where the Model Breaks: Alfonsín's Agency and Menem's Pardons

  The standard pre-commitment model treats the reversal as a failure of will or a simple cost-benefit analysis. This misses critical nuances in the Argentine case.

  #### A. Alfonsín's Reversal: Weakness or Strategic Reframing?
  The model frames the *Punto Final* and *Obediencia Debida* laws as a capitulation (pure weakness). However, this ignores Alfonsín's **strategic reframing**.
  *   **The Blind Spot:** The model assumes "Justice" and "Stability" are static values. Alfonsín argued that *Stability was a prerequisite for Justice*. He did not frame the laws as abandoning the pre-commitment, but as **preserving the democracy that made the commitment possible.**
  *   **Theoretical Implication:** The model fails to capture **narrative agency**. A leader can dissolve a bond without losing legitimacy if they successfully redefine the bond's purpose. Alfonsín convinced a segment of the public that unlimited trials would kill the democracy, thereby making the "release" a act of democratic stewardship rather than betrayal. The model sees a broken contract; the reality was a renegotiated contract where "survival" became a clause of "justice."

  #### B. Menem's Pardons (1989–1990): The Missing Backlash
  In 1989, Carlos Menem (Peronist) issued pardons for the Junta leaders and later for the *Carapintadas* rebels. According to the pre-commitment model, this should have triggered a massive legitimacy crisis. Breaking a pre-commitment erodes trust in institutions.
  *   **The Reality:** There was surprisingly little backlash.
  *   **Why the Model Fails:**
      1.  **Economic Override:** The model isolates transitional justice from macroeconomic context. By 1989, Argentina was suffering hyperinflation (200% *per month*). The public's payoff structure shifted: **Economic Survival >> Retributive Justice.** The pre-commitment to justice was a "luxury good" the electorate could no longer afford.
      2.  **Elite Pact vs. Social Contract:** The model assumes the pre-commitment was internalized by society. It wasn't. It was an elite pact between the UCR and the Courts. When Menem pardoned the generals, he was breaking an elite agreement, not a social one. The public was fatigued.
      3.  **The "Two Devils" Theory:** Alfonsín's initial framing (that both guerrillas and state terrorists were equally culpable) inadvertently lowered the moral cost of pardoning the military later. If both sides were "criminals," pardoning one side felt less like a betrayal of absolute justice.

  **Theoretical Correction:** Pre-commitment only holds if the *public* values the commitment more than the *cost* of maintaining it. In Argentina, the public's valuation of justice was elastic, dependent on economic security. The model treats the "demand for justice" as inelastic; the Argentine case proves it is highly sensitive to material conditions.

  ### 4. The *Madres de Plaza de Mayo*: Changing the Payoff Structure

  The prompt asks if the *Madres* changed the payoff structure in a way the framework can't capture. **Yes.**

  **Standard Model Assumption:** Interest groups exert pressure to increase the cost of impunity. They are rational actors seeking a policy outcome.
  **The *Madres* Reality:** They were **non-negotiable actors**.
  *   **Payoff Disruption:** In a rational choice model, actors accept compromises (e.g., "We get truth, you get amnesty"). The *Madres* rejected the very logic of trade-offs. Their slogan was *Aparición con vida* (Return them alive) long after it was known the victims were dead.
  *   **Iterated Game vs. One-Shot:** The pre-commitment model often views transition as a one-shot game (pass the law, secure the regime). The *Madres* turned it into an **iterated infinite game**. They ensured that even if the legal bond was dissolved (via laws or pardons), the *moral* bond remained active.
  *   **The Blind Spot:** The framework measures success by legal outcomes (convictions vs. acquittals). It cannot measure **mnemonic resistance**. The *Madres* ensured that the "Retroactive Release" was never socially final. They kept the reputational cost of impunity high for decades, eventually leading to the annulment of the laws in 2003.
  *   **Theoretical Implication:** The model assumes that once a law is passed, the payoff is locked. The *Madres* proved that **social memory acts as a shadow institution** that can veto legal releases. A pre-commitment model that ignores civil society's capacity for long-term memory underestimates the resilience of justice claims.

  ### 5. Conclusion: Testing the Theory

  The Argentine episode tests the limits of the Democratic Pre-commitment framework.
  1.  **Validation:** The model correctly predicts that pre-commitment fails when the military's threat of violence exceeds the government's coercive capacity (1987 Laws).
  2.  **Failure:** The model fails to explain why the second release (Menem's Pardons) incurred low costs. It overlooks **economic desperation** as a trump card over normative commitments.
  3.  **Silence:** The model is silent on **moral entrepreneurship**. It cannot account for actors like the *Madres* who refuse to play the payoff game, thereby keeping the "dead" commitment alive until political conditions shift (which they did in the Kirchner era).

  **Final Verdict:** The standard narrative treats Alfonsín's laws and Menem's pardons as a linear decline in democratic will. The pre-commitment lens reveals them as rational responses to shifting constraints. However, the lens breaks when it assumes the "cost" of breaking commitments is static. In Argentina, the cost was low in 1990 because the economy collapsed, but high in 2003 because the *Madres* had kept the moral ledger open. A robust theory of transitional justice must account for **economic elasticity** and **social memory**, not just legal binding mechanisms.
