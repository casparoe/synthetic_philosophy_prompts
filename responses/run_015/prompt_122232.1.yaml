  # Genetic Counselling Trainee Self-Assessment: Embryo Selection & Testing

  **Instructions:** Answer the following questions based on your intuitive judgment of the cases presented. Do not worry about which ethical label you think you *should* hold; answer according to what you actually believe about the scenarios.

  ### **Node 1: The Identity Distinction**
  **Question:** Consider preventing a serious genetic condition. Does the moral permissibility change if you **edit** the embryo (ensuring *this* specific future child is healthy) versus **select** a different embryo (ensuring a *different* future child is healthy)?
  *   **Yes (Identity Matters):** Go to Node 2.
  *   **No (Outcome Matters):** Go to Node 4.

  ### **Node 2: The Expressivist Objection (Identity Branch)**
  **Question:** **Case:** A deaf couple wishes to select *for* deafness; conversely, most select *against* it. If identity matters, is the primary moral objection to selecting against deafness that it harms the *future child* or that it sends a condemnatory message to *existing* deaf people?
  *   **Message to Existing People:** Go to Node 3.
  *   **Welfare of Future Child:** **Leaf A** (Negative-Only / Person-Affecting).

  ### **Node 3: Harm to the Non-Existent (Identity Branch)**
  **Question:** **Case:** You decline to transfer an embryo carrying a late-onset condition you possess. By not transferring it, do you **harm** that potential child by preventing them from existing?
  *   **Yes (Harm is possible):** **Leaf B** (Disability-Rights / Expressivist).
  *   **No (No harm to non-existent):** **Leaf C** (Impersonal No-Difference).
      *(Note: If you answered "Message" at Node 2 but "No Harm" here, you land in **Leaf D [Unnamed]**: Impersonal Expressivism.)*

  ### **Node 4: Maximizing Welfare (Outcome Branch)**
  **Question:** **Case:** There is a small projected difference in a polygenic score between two embryos (both within the healthy range). Is there a **moral reason** to select the embryo with the higher score?
  *   **Yes (Reason to Maximize):** Go to Node 5.
  *   **No (No Reason to Maximize):** Go to Node 6.

  ### **Node 5: Cohort Expansion (Outcome Branch)**
  **Question:** **Case:** You have one "good" embryo available. Are you morally **obliged** to undergo further screening or IVF cycles to widen the choice set in hopes of finding a "better" one?
  *   **Yes (Obligation to Expand):** **Leaf E** (Procreative Beneficence).
  *   **No (No Obligation to Expand):** **Leaf F** (Satisficing).

  ### **Node 6: Negative Duties (Outcome Branch)**
  **Question:** Even if you need not maximize wellbeing, are you morally **obliged** to avoid transferring an embryo known to carry a serious disease gene?
  *   **Yes (Duty to Avoid Disease):** **Leaf G** (Negative-Only / Outcome).
  *   **No (No Duty Either Way):** **Leaf H** (Parental Discretion).
      *(Note: If you answered "No Reason to Maximize" at Node 4 but "Yes" to Expansion here, you land in **Leaf I [Unnamed]**: Incoherent Expansion.)*

  ***

  ### **Leaf Profiles & Awkward Commitments**

  *   **Leaf A (Negative-Only / Person-Affecting):** You must prioritize the future child's welfare over community solidarity, potentially alienating disabled parents.
  *   **Leaf B (Disability-Rights / Expressivist):** You must prioritize symbolic solidarity with existing disabled people over the potential welfare of the future child.
  *   **Leaf C (Impersonal No-Difference):** You cannot claim the selected-out embryo was wronged, even if it had a life worth living.
  *   **Leaf D [Unnamed] (Impersonal Expressivist):** You claim non-existent children cannot be harmed, yet selection harms existing people; a rare, unstable theoretical position.
  *   **Leaf E (Procreative Beneficence):** You are obliged to undergo invasive, costly, and risky additional IVF cycles for marginal genetic gains.
  *   **Leaf F (Satisficing):** You are permitted to leave significant welfare gains on the table once a threshold of "good enough" is met.
  *   **Leaf G (Negative-Only / Outcome):** You are indifferent between a disabled child and a non-existent child, but opposed to enhancing a healthy one.
  *   **Leaf H (Parental Discretion):** You must defend the permissibility of selecting for disability if the parents desire it.
  *   **Leaf I [Unnamed] (Incoherent Expansion):** You are obliged to create more embryos to choose from, even though you have no moral reason to pick one over the other.

  ### **Diagnostic Limitations & Unoccupied Space**

  **Indistinguishable Leaves:** The tree cannot separate **Leaf A** and **Leaf G** (Negative-Only views). Both result in "Avoid disease, do not enhance," but arrive via different routes (Identity/Harm vs. Outcome/Threshold). In practice, their clinical advice is identical.

  **Unoccupied Combinations:** **Leaf I** represents the "Obliged to Expand without Reason to Select" combination. This is **incoherent**: there is no rational basis for a duty to widen a choice set if there is no duty (or reason) to prefer one option in that set over another. It is unoccupied because it fails basic instrumental rationality.

  **Weakest Node:** I am least confident in **Node 1 (Identity Distinction)**. Trainees may answer "No" (Outcome Matters) theoretically, yet still hold Expressivist views (Leaf B) which rely on the social meaning of *selection* specifically, not editing. If a trainee answers "No" to Node 1 but "Message" to Node 4 (if it were asked), the tree misclassifies them as Outcome-focused. **Redraw Trigger:** If significant numbers of trainees claim "Outcome Matters" but object to selection against deafness specifically (not editing), I would move the Expressivist question to Node 1 to capture the *method* objection before the *outcome* objection.
