answer: |-
  You have put your finger on a genuine gap in the vocabulary of moral history and philosophy. You are describing a phenomenon that is distinct from value change, distinct from hypocrisy, and distinct from the standard "arguments change minds" narrative.

  The short answer is: **No, there is no single established term that captures exactly this.**

  There are several concepts that orbit it, and philosophers/sociologists have carved out pieces of the terrain, but none of them quite capture the specific phenomenology you're describing: *the retention of the value coupled with the loss of the concept's application-power.*

  Here is the carving you asked for. I will break this down into the nearest existing concepts, why they fail, and then propose a terminology that fits the shape of your observation.

  ### 1. The Nearest Neighbors (And Why They Miss)

  To understand what this is, it helps to see what it is *almost* but not quite.

  **A. Thick Ethical Concepts (Bernard Williams)**
  *   **The Concept:** Williams distinguished between "thin" concepts (good, right) and "thick" concepts (cowardly, brutal, chaste). Thick concepts contain both a description of the world and an evaluation of it. To call a duel "cowardly" is to describe it and condemn it simultaneously.
  *   **Why it's close:** You are describing the **unraveling of a thick concept**. The evaluation ("cowardice is bad") remains, but the descriptive application ("not dueling is cowardly") detaches.
  *   **Why it misses:** Williams' framework is static. It doesn't explain the *historical mechanism* of the detachment. It tells us what the concept *is*, not how it loses its grip while the agent still endorses it.

  **B. The Social Imaginary (Charles Taylor)**
  *   **The Concept:** The background, pre-reflective understanding of how the world works that makes certain practices make sense.
  *   **Why it's close:** When the "imaginary" shifts (e.g., from an Honor Culture to a Dignity Culture), the practice of dueling becomes unintelligible, not just wrong.
  *   **Why it misses:** This is too macro. It explains the *environment* changing, but not the specific internal experience of the agent who still believes in honor but finds the reason "non-binding."

  **C. Pluralistic Ignorance & Preference Falsification (Timur Kuran/Cass Sunstein)**
  *   **The Concept:** People privately reject a norm but publicly uphold it because they think everyone else accepts it. When they realize others also reject it, the norm collapses (a "norm cascade").
  *   **Why it's close:** This explains the "public embarrassment" phase you noticed, where the practice dies publicly before it dies privately.
  *   **Why it misses:** This assumes people *stop believing* the norm privately. Your observation is sharper: they *keep believing* the value (cowardice is bad), but the norm no longer *applies*. It's not that they hide their belief; it's that the belief stops generating the action.

  ### 2. The Carving: Two Distinct Mechanisms

  You asked if the "internal grip" loss and the "public embarrassment" are the same thing. They are distinct mechanisms that feed each other. I propose we separate them as follows:

  #### Phenomenon A: Motivational Decoupling (The Internal Grip)
  This is what happens to the 1700s gentleman. He still values courage. He still fears being a coward. But the proposition *"Not dueling is cowardly"* ceases to function as a **motivating reason**.
  *   **What it is:** The severing of the link between a general value and a specific practice, without the abandonment of the value.
  *   **What it isn't:** It isn't weakness of will (akrasia). He feels no conflict. It isn't value change. He still hates cowardice.
  *   **The Mechanism:** The **Application Conditions** of the thick concept have shifted. The word "coward" no longer "catches" on the action of "refusing a duel."

  #### Phenomenon B: Justificatory Silencing (The Public Embarrassment)
  This is the phase where the practice becomes unspeakable.
  *   **What it is:** The loss of **Uptake**. Even if I believe dueling is honorable, I cannot say it to you and expect you to recognize it as honorable.
  *   **The Mechanism:** This is about **Reference Groups**. As you suspected, this is partly "whose respect you need." But more specifically, it is the loss of a shared **Moral Language Game** (Wittgenstein). If I use the word "honor" to justify a duel, and you hear "barbarism," the justification fails not because I am lying, but because the language no longer bridges the gap between us.

  ### 3. The Invented Term: "Normative Traction"

  Since no existing term captures the "grip" dynamic you identified, I propose we call this **Normative Traction**.

  **Definition:** *Normative Traction* is the capacity of a moral concept to generate action and public justification within a specific social context.

  When you say "the belief didn't change; the grip did," you are describing a **Loss of Normative Traction**.

  Using this term, we can define the two phenomena you spotted:

  1.  **Internal Traction Loss (Motivational Decoupling):** The concept remains true for the agent, but no longer engages the will. The engine is running (the value exists), but the transmission is disconnected (the action doesn't follow).
  2.  **External Traction Loss (Justificatory Silencing):** The concept can no longer gain purchase in public discourse. It spins out. It creates friction (embarrassment) rather than forward motion (justification).

  ### 4. Boundary Cases (How to tell it apart)

  To ensure this concept is useful, we must distinguish it from its neighbors.

  | Phenomenon | Does the agent endorse the value? | Does the agent feel conflict? | Does the practice continue? | **Is it Loss of Traction?** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Weakness of Will** | Yes | Yes (Guilt/Regret) | Yes (Reluctantly) | **No.** The traction exists; the brakes failed. |
  | **Hypocrisy** | No | No (Cynical) | Yes (Strategically) | **No.** The agent never had traction; they are faking it. |
  | **Value Change** | No | No | No | **No.** The engine is off. The value is gone. |
  | **Loss of Traction** | **Yes** | **No** (Feels consistent) | **No** (Stops naturally) | **Yes.** The engine runs, but the wheels don't turn. |

  ### 5. Why the "Reference Group" Insight Matters

  You mentioned: *"It's about whose respect you need."*

  This is the **causal mechanism** for the Loss of Traction.
  Thick concepts like "Cowardice" or "Honor" are not atomic; they are social technologies. They only work if the community agrees on their application conditions.
  *   **Generation 1:** The "Honor Group" and the "Legal Group" are separate. The Honor Group controls the traction.
  *   **Generation 2:** The groups merge or the Honor Group loses status.
  *   **Result:** The word "Coward" loses its **sanctioning power**. If the people you respect no longer flinch when you call someone a coward (in the context of dueling), the word loses its normative traction.

  This explains the slavery example too. Slaveholders could say "I wish this were over" because the **economic traction** of slavery remained (it made money) while the **moral traction** was failing (it felt wrong), but the **social traction** (the ability to organize society without it) hadn't yet been solved. When the social traction for *alternatives* appeared, the practice collapsed.

  ### Summary

  You are not confusing three things. You are identifying a specific historical-philosophical mechanism that standard moral psychology ignores.

  1.  **The Name:** **Loss of Normative Traction.**
  2.  **The Internal Mechanism:** **Motivational Decoupling** (The reason stops moving the will).
  3.  **The External Mechanism:** **Justificatory Silencing** (The reason stops persuading the audience).
  4.  **The Cause:** **Reference Group Realignment** (The people who control the definitions of the thick concepts have changed).

  This framework allows you to say: *"The abolitionists didn't win the argument; they changed the reference group, which caused a loss of normative traction for the pro-slavery position."* That is a much more precise claim than "minds were changed."
