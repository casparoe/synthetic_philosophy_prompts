answer: |-
  Dear Friend,

  It is clear from your description that you are grappling with the fundamental tension in any performance-based reward system, which is the difficulty of separating signal from noise when the noise of luck is so loud. You have already wisely dismissed the nihilistic view that luck negates all merit, because while luck is omnipresent, agency is not distributed evenly across your staff. The challenge you face is not merely arithmetic but narrative, especially given the requirement for unanimity and the need for a written justification that will be read by all forty members of the institute. To answer your first question about what question you should actually be asking, I suggest you shift the frame from retrospective justice to prospective signaling. Instead of asking who earned this based on the past year, ask which allocation best preserves the institute's capacity to do good work over the next decade. Bonuses in modest pools are rarely life-changing income, but they are potent signals of institutional values. The question is not about repaying debt for work done, but about purchasing the kind of effort and judgment you want to see repeated when the committee is not watching.

  This shift in perspective helps address your second question regarding the replaceability rule. Your intuition that the rule is defective is correct, but it is salvageable if you modify what is being measured. The current formulation asks whether someone else could have produced the result, which focuses entirely on outcomes that are often outside the employee's control. A more robust version would ask whether someone else would have exercised the same judgment. In Priya's case, the action was simple, but the judgment to recognize and seize the opportunity still required agency, though perhaps less than if she had cultivated the relationship herself. In Ada's case, the replaceability rule works well because finding the error required specific diligence that others lacked. However, for Tom, the rule fails because it looks at the binary outcome of the vote rather than the quality of the campaign management. A modified rule would assess whether a replacement employee would have managed the loss as well as Tom did, preserving relationships and keeping the argument alive despite the hostile turn of events. If the average colleague would have given up sooner or burned bridges in defeat, then Tom's marginal contribution was high even if the policy win was zero. You are not rewarding the failure; you are rewarding the professionalism that keeps future success possible.

  This leads directly to how you should think about Tom, because your worry that you are being sentimental about effort is a common concern for managers trying to remain objective. It is not sentimentality to recognize that in policy work, the variance between effort and outcome is extremely high. If you reward only outcomes, you incentivize your staff to choose only safe bets where victory is guaranteed, which is antithetical to advocacy. Tom took a high-risk, high-reward shot that was thwarted by a specific, unpredictable event—the resignation of a commissioner. By rewarding him, you are insuring your team against risk aversion. You are signaling that we reward the maximization of expected value, not just the realization of it. The fact that the campaign might have made the next attempt harder is a real concern, but if Tom handled the defeat with grace and maintained the integrity of the institute's position, he has preserved the capital necessary to try again. Ignoring his contribution suggests that only wins count, which will eventually drive your best advocates to safer sectors where outcomes are more tightly coupled with effort.

  Regarding Ada, the fact that she is leaving is not irrelevant, though not for the reason others might suggest. If bonuses were purely retention tools, her departure would nullify the investment. But since you have reframed the bonus as a signal of values, her exit amplifies the message. Rewarding her validates her choice to prioritize credibility over revenue, and it tells the thirty-nine people staying that the institute values truth even when it is costly. It transforms her departure from a loss of talent into a reinforcement of culture. For Priya, the reasoning is slightly different. She should be acknowledged for the result, but the justification should clarify that the institute recognizes the role of circumstance. You can reward the outcome without implying that the effort required was disproportionate, perhaps by framing it as stewardship of existing assets rather than new creation. This prevents demoralizing the cold-emailing colleagues who worked harder for less return, by distinguishing between harvesting low-hanging fruit and planting new orchards.

  The internal disagreement about outputs—money, policy, or credibility—is actually an opportunity rather than a hurdle. Your written justification does not need to solve this disagreement permanently, but it should reflect a hierarchy of values that allows for unanimity. Credibility is the foundation upon which money and policy rest. Without credible models, funders eventually leave and policy arguments collapse. Therefore, Ada's contribution protects the core asset, Tom's contribution defends the institute's mission in the public sphere, and Priya's contribution fuels the operation. A justification that weights credibility and professional resilience slightly higher than raw revenue or binary policy wins will likely satisfy the committee's need for consensus while aligning with the long-term health of the organization. You can write that the bonus recognizes those who protected the institute's long-term capacity to influence, whether through financial stewardship, rigorous integrity, or persistent advocacy.

  Ultimately, the luck in each case matters only insofar as the employee managed that luck. Priya managed good luck well, Ada managed bad financial luck to produce good scientific luck, and Tom managed bad luck with professional resilience. The replaceability rule should measure the management of the circumstance, not the circumstance itself. If you can articulate that distinction in your justification, you will satisfy the requirement for unanimity because it allows each committee member to see their preferred output value reflected in the broader concept of institutional capacity. You are not dividing a pot of money based on who deserved it most in a vacuum; you are crafting a story about who your people are and who you want them to be. Tom deserves recognition not because he worked hard, but because he kept the institute in the fight when the odds turned against us. Ada deserves recognition because she chose the hard right over the easy wrong. Priya deserves recognition because she delivered resources, even if the path was smoothed by predecessor labor. Balancing these narratives will serve you better than any algorithmic rule.

  I hope this provides a useful framework for your deliberations. The fact that you are wrestling with these nuances suggests you are leading with the right level of care.

  Warmly,

  Your Colleague
