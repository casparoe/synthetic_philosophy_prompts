      *   *Standard Berkeley:* You can't conceive of a tree existing unconceived because the act of conceiving it makes it conceived.
      *   *User's RMA:* It's not about the psychological inability to imagine; it's about the *logical/ontological structure of specification*. To define truth conditions for "X exists mind-independently" requires a mind to formulate those conditions, thus making the truth conditions mind-dependent.
      *   *Scope:* Extended to abstracta (numbers, sets) and modality (possible worlds). This is a radical Idealism/Conceptualism.

  3.  **Brainstorming Defeaters/Objections (Categorization & Severity):**

