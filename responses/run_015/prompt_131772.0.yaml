answer: |-
  This is a sophisticated and precisely targeted interpretive problem. You are asking whether the Kantian Indirect Duty View (IDV) can withstand the pressure of *continuity* in natural capacities without collapsing into a direct duty view or becoming internally incoherent.

  To address this, we must treat Kant's practical philosophy not merely as a set of pronouncements, but as a system of grounding relations. The tension you identify lies between the *ontological grounding* of duty (which is binary in Kant) and the *psychological cultivation* of virtue (which is phenomenologically continuous).

  Below is the reconstruction you requested, mapping the logical structure, applying the gradient-sensitive challenge, and isolating the point of maximum vulnerability.

  ### I. Logical Structure of the Indirect-Duty Argument

  To analyze the stability of the framework, we must first formalize the standard Kantian derivation regarding animals. This reconstruction draws primarily from the *Metaphysics of Morals* (6:442–443) and the *Lectures on Ethics*.

  1.  **The Ontological Premise (The Binary Threshold):** Moral standing (the status of being an "end in itself") is grounded exclusively in *autonomy*—the capacity to legislate the moral law through pure practical reason. This capacity is dichotomous: one either possesses the faculty of freedom (*Wille* governed by reason) or one is determined by nature (inclination/instinct).
  2.  **The Status Premise:** Human beings possess autonomy; non-human animals do not. Therefore, humans are *persons* (ends in themselves), and animals are *things* (means only).
  3.  **The Direct Duty Constraint:** Duties are strictly reciprocal relations between rational wills. Since animals lack a rational will, they cannot be the *direct* objects of moral obligation. One cannot wrong a thing.
  4.  **The Psychological Premise (The Mechanism of Indirect Duty):** Human moral virtue depends on the cultivation of natural predispositions, specifically sympathy and empathy. Cruelty toward animals damages these predispositions ("hardens the heart"), thereby weakening the agent's capacity to fulfill direct duties toward humans.
  5.  **The Deontic Conclusion:** We have a direct duty *to ourselves* (to maintain our moral perfection) to refrain from cruelty toward animals. The animal is the *occasion* of the duty, not the *ground* of the duty.

  ### II. Applying the Gradient-Sensitive Challenge

  Your "gradient-sensitive analytical pressure" posits that rational capacity (and the associated psychological capacities like sentience, agency, and social bonding) is not binary but spectral. Let us apply this pressure to each step of the reconstruction above.

  **1. Pressure on the Ontological Premise (The Threshold)**
  *   **Kant's Claim:** There is a qualitative leap between nature and freedom.
  *   **Gradient Challenge:** Evolutionary and developmental biology suggest continuity. If rationality is a spectrum, the "binary threshold" becomes arbitrary.
  *   **Implication for IDV:** If the ground of direct duty is a spectrum, the distinction between "person" and "thing" blurs. However, Kant can theoretically hold the line here by insisting that *moral* rationality (the ability to act from duty) is indeed all-or-nothing, even if *instrumental* rationality is graded.
  *   **Stability:** *Moderately Stable.* Kant can concede that animals have degrees of *technical* rationality without granting *moral* autonomy.

  **2. Pressure on the Psychological Premise (The Mechanism)**
  *   **Kant's Claim:** Cruelty to animals dulls sympathy generally.
  *   **Gradient Challenge:** Psychological evidence suggests sympathy is not uniform; it is calibrated to perceived similarity and capacity for suffering. Cruelty to a chimpanzee likely hardens the heart differently (or more severely) than cruelty to a beetle, because the chimpanzee presents a stronger *analogue* of human rationality and emotion.
  *   **Implication for IDV:** If the "hardening of the heart" is the mechanism, and the degree of hardening correlates with the cognitive/sentient complexity of the victim, then the *strength* of the indirect duty should vary.
  *   **Stability:** *Unstable.* Kant treats the duty as generally uniform regarding "animals," but the psychological mechanism he relies upon is inherently gradient-sensitive.

  **3. Pressure on the Deontic Conclusion (The Calibration)**
  *   **Kant's Claim:** We owe it to *ourselves* not to be cruel.
  *   **Gradient Challenge:** If the duty is to preserve our own moral sensibility, and our sensibility is more deeply wounded by the mistreatment of beings that resemble us (the gradient), then the duty to refrain from mistreating a high-capacity animal must be *stronger* than the duty regarding a low-capacity animal.
  *   **Implication for IDV:** This creates a *graduated indirect duty*. While the status of the animal remains "thing," the *stringency* of the duty owed to oneself regarding that thing varies based on the properties of the thing.
  *   **Stability:** *Contingent.* This saves the logic but alters the outcome significantly, moving closer to a direct duty view without admitting it.

  ### III. Empirical Claim vs. Normative Dependency

  You ask whether the appeal to the "hardening of the heart" is purely empirical or smuggles in a normative dependency. Under gradient pressure, it becomes clear that **it cannot remain purely empirical.**

  If the argument were purely empirical ("Cruelty causes psychological state X, which reduces utility"), it would be a prudential recommendation, not a moral duty. For Kant, it is a duty of virtue. For it to be a duty, it must connect back to the Moral Law.

  The connection works like this:
  1.  We value our rational nature (Humanity).
  2.  We value the dispositions that support our rational nature (Sympathy).
  3.  We protect sympathy by not abusing beings that trigger it.

  **The Normative Smuggle:** The "trigger" for sympathy is not random; it is the *analogue of rational nature* in the animal. Kant explicitly acknowledges that animals show "analogues of reason." When we see an animal suffer, we respond to the *likeness* of humanity within it.

  Therefore, if rational nature admits of degrees (the gradient), the *likeness* admits of degrees. Consequently, the normative force of the duty to protect our own sympathy must be calibrated to the degree of likeness.
  *   **Result:** The derivative protection *must* be calibrated proportionally. To treat a great ape and a oyster identically under the IDV framework is actually inconsistent with the psychological mechanism Kant cites, because the threat to one's own moral disposition is not identical in both cases.

  ### IV. Conclusion: The Point of Maximum Vulnerability

  The reconstruction is most vulnerable at the **junction between the Ontological Premise and the Psychological Premise.**

  Specifically, the vulnerability lies in **the disconnect between the binary ground of moral worth and the continuous ground of moral psychology.**

  1.  **The Incoherence:** Kant insists that moral status is binary (you are either an end or a means). However, the *justification* for protecting the "means" (animals) relies on a psychological mechanism (sympathy/virtue cultivation) that is responsive to gradients of similarity and capacity.
  2.  **The Marginal Cases:** This vulnerability explodes when applied to human beings with diminished rational capacities (infants, the cognitively disabled, the senile).
      *   If direct duty requires full autonomy, these humans arguably fall below the binary threshold.
      *   Kant usually saves them by appealing to "humanity" as a species property.
      *   But under gradient pressure, a highly intelligent animal may possess more "analogues of reason" than a severely disabled human.
      *   If the indirect duty is calibrated to the *analogue of reason* (to protect our sympathy), the logic dictates we might owe a *stronger* indirect duty regarding the animal than the disabled human (who commands a direct duty but triggers less sympathetic "training" of the heart).
      *   Conversely, if we owe the disabled human direct duty despite low rationality, we have already abandoned the binary Ontological Premise.

  **Final Verdict:**
  The Kantian framework cannot separate the absence of direct standing from the presence of derivative protection in a way that remains stable under gradient pressure. The "hardening of the heart" argument is not merely empirical; it is normatively dependent on the valuation of rational nature. Because the *appearance* of rational nature is a spectrum in the natural world, the derivative protection inevitably becomes a spectrum.

  This forces a dilemma: either Kant must admit that moral protection scales with cognitive capacity (undermining the binary "dignity" of humans), or he must insist on a species-based binary that ignores the very psychological mechanisms (sympathy for the analogue of reason) he uses to justify animal protection in the first place. The system is most vulnerable where it attempts to derive a **continuous moral constraint** (don't harden your heart) from a **discontinuous ontological ground** (autonomy vs. nature).
