      *   *Reactive Attitudes:* Emotional responses to the good or ill will of others.
      *   *Objective Attitude:* Seeing someone as an object to be managed, cured, or handled (not a participant in a relationship).
      *   *Excuses:* "I didn't mean to," "It was an accident." (Admits the framework of responsibility but denies the ill will).
      *   *Exemptions:* "They are a child," "They are insane," "They are under extreme duress." (Removes them from the framework of responsibility entirely).
      *   *The "Cannot Opt Out" Claim:* We are naturally wired for these attitudes. We can't just decide to be purely objective all the time without losing our humanity/relationships.

  3.  **Drafting the Translation (Discord Mod Vernacular):**
      *   *Resentment:* When someone disses *you* directly. "Why did you ping me like that?" Personal sting.
      *   *Indignation:* When someone breaks rules/harms the *community*. Vicarious anger. "You can't talk to them like that here."
      *   *Guilt:* When *you* mess up as a mod. "I shouldn't have banned that person."
      *   *Objective Attitude:* "This user is a bot," "This user is raiding," "This user is a liability." Managing risk, not engaging morally.
      *   *Excuses:* "I was tired," "I didn't see the rule update," "My cat knocked the keyboard." (Still a responsible agent, just no malice).
      *   *Exemptions:* "They are 12," "They are having a psychotic break," "Their account was compromised." (Not a responsible agent).

  4.  **Addressing the Excuse vs. Exemption Confusion:**
      *   *Excuse:* The action was wrong, but the *intent* wasn't malicious. Result: Warning or lighter timeout. They stay in the "member" category.
      *   *Exemption:* The actor isn't capable of following the social contract. Result: Ban for safety, or specialized handling (DMing a guardian, etc.). They move to the "problem/object" category.
      *   *Mod Context:* Often mods treat exemptions as excuses ("Oh they're just young, let's educate them") when Strawson says exemptions shift us to the *objective attitude*. I need to make sure this distinction is clear.

  5.  **Addressing the "What Doesn't Survive" (The Critical Analysis):**
      *   *Point 1: Consequentialism vs. Natural Necessity.*
