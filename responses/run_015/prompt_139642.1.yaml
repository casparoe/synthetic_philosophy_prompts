answer: |-
  **Principle:** Communication is impermissible when you intentionally exploit conversational norms to induce a false belief while evading accountability, unless preventing significant harm or preserving trivial social harmony.

  **Testing the Cases:** This principle aligns with Cases 1 and 2, which fall under the exceptions for harm prevention and social harmony. It condemns Cases 3, 4, 6, and 7 as accountability evasion. Case 4 (Bike) and 6 (Official) are clear violations where technical truth masks substantive deception. Case 7 (Hidden disclosure) is resolved as impermissible: burying truth exploits the norm that relevant information is presented prominently. Case 5 remains permissible because the false inference stems from the colleague's suspicion, not an exploitation of conversational norms you invited; you refused to manage their suspicion rather than manipulating it.

  **Verdict to Drop:** You judge Cases 4 and 6 as *worse* than lying. My principle treats them as equally impermissible but struggles to rank them higher than lying, which directly violates accountability rather than evading it. To maintain coherence, drop the claim that misleading is strictly *worse* than lying; classify both as impermissible, acknowledging lying is arguably more direct.

  **New Cases:**
  1.  *Corporate Earnings:* A CEO says profits are "stable" knowing a crash is imminent but unannounced, relying on market lag. Verdict: Impermissible. You may dislike this as it restricts strategic information management common in business.
  2.  *The Polite Refusal:* You say "I'm busy" to decline an invitation when you simply don't want to go. Verdict: Permissible (social harmony). You may dislike this if you value radical honesty over feelings.

  **Confidence:**
  *   **High:** The classification of Cases 1, 3, and 7. The principle clearly distinguishes harm prevention from accountability evasion.
  *   **Medium:** The boundary between Case 4 (transactional duty) and Case 5 (personal suspicion). Distinguishing "reasonable inference" from "suspicious inference" can be context-dependent.
  *   **Least Sure:** Whether evading accountability (misleading) is ever *worse* than direct lying (Cases 4/6). This depends on whether we value the *mechanism* of trust (which misleading corrupts) more than the *act* of truth-telling (which lying violates), a theoretical hierarchy I am not confident exists universally.
