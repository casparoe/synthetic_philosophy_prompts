answer: |-
  1. The diffuse/spiky distinction risks collapsing because any threshold case can be modeled as a smooth expected utility function if you treat others' behaviors as probabilistic rather than fixed. If the math converges, the phenomenological difference in locatability might be psychological noise rather than a structural ethical feature.

  2. Leverage transfer looks suspiciously like moral offsetting, which many consequentialists reject because it licenses harmful acts based on external good deeds rather than removing the harm itself. You need to explain why trading low-pivot exposure for high-pivot exposure isn't just paying for a license to harm rather than reducing net harm.

  3. The reductio works only if participatory views forbid instrumentalizing participation, but some expressive theories might allow hybrid actions if the expressive content of the donation overwhelms the consumption. You need to show why the expressive signal of buying chicken isn't simply drowned out by the louder signal of funding its abolition.

  4. The biggest hole is that leverage transfer requires precise expected-value calculations to identify superior investments, which contradicts your earlier claim that these differences are practically inaccessible in spiky cases. If you can't locate the harm, you likely can't locate the superior alternative investment with enough confidence to justify the trade.

  5. The locatability point feels fresh, but the leverage transfer argument is a standard effective altruism objection to consumer boycotts that hasn't gained much traction in meta-ethical debates. It risks being seen as a practical policy objection rather than a philosophical reductio unless you tighten the link to the structure of reasons.
