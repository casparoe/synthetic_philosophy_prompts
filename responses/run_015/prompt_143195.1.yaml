      *   **Abundant Conception of Properties (Comprehension):** "For every proposition $p$, there is a property $[p]$."
          *   *Why it's there:* Standard higher-order logic (SOL) usually assumes this.
          *   *Cost of dropping:* Moving to a restricted logic of properties. This is technically difficult and philosophically contentious.
          *   *Relevance to Collapse:* If $[p]$ isn't a property in the domain of the quantifiers ranging over properties in the axioms, the argument fails.

      *   **The "Qualitative" Restriction (User's Repair):**
