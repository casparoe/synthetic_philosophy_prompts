          *   *Cost of dropping:* If you drop it, you allow that some properties are neither positive nor negative (axiological gaps). This weakens the definition of "God-like." If God has all *positive* properties, but some properties are axiologically neutral, God might lack them. Does that matter? Maybe. But more importantly, without Dichotomy, the proof that positive properties are compossible (Theorem 1 in Gödel's setup) becomes harder or requires modification.
