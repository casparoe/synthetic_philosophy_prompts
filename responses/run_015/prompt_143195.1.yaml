      *   **Address the "Qualitative" Repair:** This is the most philosophically defensible route (Anderson's modification).
          *   Clarify *why* $[p]$ fails to be qualitative/perfective. It's a "Cambridge property" or a logical shadow, not an intrinsic perfection.
          *   Address the worry about "necessitism about qualitative truths." The fix isn't to say qualitative truths are necessary, but that the *property* $[p]$ isn't the sort of thing that *can* be positive. Positivity is a value predicate, not a truth predicate.
