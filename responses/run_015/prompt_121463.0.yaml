answer: |-
  This is a precise and productive knot to untangle. You are correctly identifying that "Western values" functions less as a descriptive category in political ontology and more as a rhetorical operator. The conceptual mess arises because the phrase attempts to do three incompatible jobs simultaneously: describe a cultural reality, justify a normative claim, and police a political boundary.

  Here is a map of the conceptual problems, structured around the specific tensions you identified.

  ### 1. The Ontological Problem: Beyond Family Resemblance
  You ask if the trouble is merely that the category is a "family-resemblance cluster" (à la Wittgenstein) with no essential core. While true, this is too charitable. A family-resemblance concept implies an organic overlapping of features (e.g., "games"). "Western values," however, is a **curated cluster**.

  *   **Internal Contradiction:** The items usually thrown into the cluster are often historically or logically incompatible. For example, "Judeo-Christian heritage" is frequently invoked alongside "secularism" and "Enlightenment rationalism." Historically, the latter emerged in opposition to the former. To claim they are a unified "Western" core requires ignoring the actual history of conflict between them.
  *   **Negative Definition:** The category often lacks positive coherence and is defined primarily by what it is *not*. "Western values" often means "values that are not Islamic," "not Communist," or "not Global South." This makes the concept parasitic; it has no content independent of its constitutive outside.
  *   **The Selection Bias:** If "Western values" is a cluster, who decides which features are in the cluster? Usually, the selection excludes illiberal historical Western practices (colonialism, theocracy, eugenics) while including liberal ideals. This suggests the category isn't describing a culture, but *idealizing* a specific political project and labeling it geographically.

  ### 2. The Indexical Problem: Hiding Normativity
  Your intuition about "Western" functioning as an indexical that hides normativity is the crux of the rhetorical power. This is a **modal collapse** between geography and justification.

  *   **The Is/Ought Conflation:** When a politician says, "Free speech is a Western value," they are sliding between two claims:
      1.  *Empirical:* People in the West happen to like free speech.
      2.  *Normative:* Free speech is right/good.
      By attaching the value to the identity ("Western"), the speaker bypasses the need to argue for the normative claim (2). The justification becomes "because this is who *we* are."
  *   **The Conversation Stopper:** In normative debate, "Western" functions as a proxy for "Universal Reason" without the burden of universal proof. It smuggles in a particularist justification (tradition/identity) while claiming universal validity (human rights). It creates a shield against internal critique: if you question the value, you are questioning the identity of the community itself.
  *   **Indexical Instability:** "Western" is indexical—it points to different things depending on who is speaking. For a US neoconservative, it might mean interventionist democracy; for a French republican, it means *laïcité*; for a Hungarian illiberal, it means Christian borders. The term remains stable only because the specific content is left vague enough to accommodate contradictory agendas.

  ### 3. Dominant vs. Constitutive: The Modal Shift
  You asked about the distinction between values *dominant* in the West and values *constitutively* Western. This is where the conceptual sleight-of-hand happens. Proponents of the phrase constantly slide between these two modes to evade criticism.

  *   **Dominant (Empirical):** "Most people in the West value X."
      *   *Vulnerability:* Easily falsified. (e.g., "Many Westerners are religious/illiberal/collectivist.")
  *   **Constitutive (Essentialist):** "To be truly Western is to value X."
      *   *Vulnerability:* Arbitrary exclusion. (e.g., "Then are religious Westerners not Western?")
  *   **The Shift:** When challenged empirically ("But many Westerners oppose free speech"), the defender shifts to constitutive ("Then they are betraying Western values"). When challenged normatively ("Why should we prioritize free speech?"), the defender shifts to dominant ("It is our tradition").
  *   **The Result:** The category becomes unfalsifiable. It describes a reality that doesn't exist (empirically) to justify a norm that doesn't need justification (constitutively).

  ### 4. The Circularity of Definition
  Attempts to list these values are circular because the definition of "The West" and the definition of "The Values" are mutually dependent.

  *   **Geographic vs. Normative:** Is the West a place or a set of ideas?
      *   If it's a **place** (Europe + North America), then the values are whatever people there actually hold (which includes illiberalism).
      *   If it's a **set of ideas** (Liberalism, Democracy), then the geography is irrelevant (Japan might be more "Western" than Hungary).
  *   **The Loop:** We define the West by its values, and we validate the values because they are Western.
  *   **Temporal Cherry-Picking:** This circularity relies on a specific slicing of time. "Western values" usually refers to post-1789 Enlightenment values. But if "Western" implies historical continuity, then theocratic or imperial values are equally "Western." By selecting only the liberal moment, the phrase pretends that the current normative preference is the historical essence of the region.

  ### 5. The Dilemma: Ethnocentrism vs. Empty Universalism
  Finally, to your point about argumentative work: The phrase cannot do heavy lifting without collapsing into one of two horns of a dilemma.

  *   **Horn A: Ethnocentrism (Particularism)**
      *   If "Western values" are specific to the culture/history of the West, they have no binding force on outsiders (migrants, non-Western states).
      *   *Rhetorical Cost:* Imposing them becomes an act of cultural imperialism or assimilation, which contradicts the liberal value of pluralism often included in the "Western" cluster.
  *   **Horn B: Empty Universalism**
      *   If "Western values" are actually universal moral truths (e.g., "torture is wrong"), then the label "Western" is redundant and misleading.
      *   *Rhetorical Cost:* Calling universal rights "Western" unnecessarily particularizes them. It suggests that non-Westerners must adopt a *cultural identity* to access *moral truths*. It turns human rights into a cultural property right.

  ### Summary of the Conceptual Knot
  The phrase "Western values" is conceptually unstable because it attempts to **particularize the universal.**

  It wants the authority of **Universal Reason** (these values are right for everyone) without the burden of **Universal Proof** (we don't need to explain why, just accept they are ours). It wants the warmth of **Tribal Belonging** (this is who we are) without the limitation of **Tribal Relativism** (we can still judge others by these standards).

  In your chapter, you might argue that the phrase is not a failed description of a cultural reality, but a successful **performative speech act**. It does not describe a pre-existing unity; it attempts to *create* one by drawing a boundary. The conceptual incoherence is a feature, not a bug: the vagueness allows the speaker to mobilize the emotional weight of identity to win normative arguments that cannot be won on reason alone.
