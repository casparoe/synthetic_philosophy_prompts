prompt: |-
  I'm a novelist — crime-ish stuff set in a made-up Midlands town — and the book I'm halfway through has a strand where the town has to decide what to do with a statue of a Victorian factory owner whose money built the library, the baths and about a third of the street names. My drafts keep flattening into a speech about history, which is boring and not how it actually goes in a parish council room.

  So: I run a fortnightly writting group, 12 adults (mostly retirees, two sixth-formers), two hours on a Tuesday evening, a room with a flipchart and no tech. Design me an exercise that makes them *feel* the thing I'm after, which is that arguments about commemoration are mostly arguments about plumbing, insurance and who has to say the name out loud. Two notions I've been kicking about and want embedded in the rules rather than explained: the 'enunciation burden' — the people forced to repeat a contested name (on forms, giving directions, reading out a prize citation) are rarely the people it injures, and rarely the people who care what it means; and 'referential drift', the way a name stops being about the man once it's a bus stop and a postcode, which is an argument for leaving street names alone that does nothing for statues. I'd also like the trap where adding an explanatory plaque to atone for a monument just makes the monument more thoroughly about him, not less.

  No lecture up front, and they shouldn't hear any of those labels until afterwards. Give me the roles, the rounds, the stakes (nothing that needs real money), and a debrief that maps what happened onto the ideas. Say plainly what will predictably go wrong the first time I run it — half of them will want to debate whether the man was wicked — and be honest about which part of this the exercise can't reach and I'll have to put in the characters' mouths myself. Finally, tell me how confident you are that it'll actually land that way, and single out the bit you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested exercise:

  1.  **Analyze the Request:**
      *   **User:** Novelist (crime-ish, Midlands setting).
      *   **Problem:** Drafts of a statue controversy subplot are flattening into boring historical speeches. Needs to feel like a real parish council meeting (bureaucratic, mundane, practical).
      *   **Goal:** Design a 2-hour writing group exercise (12 adults, mixed ages, no tech) to help them *feel* the dynamics of commemoration arguments without lecturing.
      *   **Key Concepts to Embed (without naming initially):**
          1.  *Enunciation Burden:* Who has to say the name? (Admin staff, locals giving directions) vs. who is injured/cares.
          2.  *Referential Drift:* Names become functional (bus stops, postcodes) vs. statues which remain representational.
          3.  *The Plaque Trap:* Adding context often reinforces the subject's importance.
      *   **Constraints:** No lecture up front. Labels revealed only in debrief. Roles, rounds, stakes needed. Predict pitfalls (e.g., debating morality). Assess confidence/limitations.

  2.  **Deconstruct the Core Conflict:**
      *   Real-life statue debates aren't usually about the history itself (that's the surface); they're about *consequences*.
      *   *Consequences:* Cost of removal, cost of maintenance, confusion for emergency services, awkwardness for school trips, liability if someone climbs it, who signs the checks.
      *   *The "Vibe":* Frustration, procedural deadlock, talking past each other, exhaustion.

  3.  **Drafting the Exercise Structure:**
      *   **Title:** Needs to sound bureaucratic but slightly ominous. "The Heritage & Infrastructure Working Group."
      *   **Setup:** A fictional town (let's call it "Oakhaven" to avoid Midlands specificity clashing with their own work). A statue of "Sir Jasper Thorne."
      *   **Roles:** Need to represent different *functional* relationships to the statue, not just ideological ones.
          *   *Ideologues:* (The ones who want it gone/kept for moral reasons).
          *   *Functionaries:* (The ones who have to deal with the fallout).
          *   *Locals:* (The ones who use the space).
      *   **Rounds:** Need to force the conversation away from "Was he bad?" to "What do we *do*?"
          *   Round 1: The Complaint (Surface level).
          *   Round 2: The Logistics (The "Plumbing").
          *   Round 3: The Compromise (The "Plaque").
      *   **Stakes:** Not money. Maybe "Political Capital" or "Time." Let's use "Council Minutes" – if they don't agree, the meeting runs over, and the caretaker locks the doors. Or simpler: A limited budget of "Goodwill Points." Let's go with *Administrative Burden*. Who has to do the work?

  4.  **Refining the Mechanics (Embedding the Concepts):**
      *   *Enunciation Burden:* Give specific roles cards that say "You have to write this name on 50 forms a week" or "You have to tell tourists where this is."
      *   *Referential Drift:* Include a map where the name is on a road, a school, and the statue. Ask them to change *one*.
      *   *Plaque Trap:* Offer a "Compromise Card" that suggests a plaque. Track the outcome.

  5.  **Addressing the Pitfalls:**
      *   *The Morality Trap:* Writers love debating good vs. evil. I need to mechanically punish this. If they spend too long on history, they run out of time for the decision.
      *   *The Tech Constraint:* No projectors. Needs paper handouts, name tags, maybe a physical prop (a toy statue?).

  6.  **Developing the Debrief:**
      *   Reveal the terms (*Enunciation Burden*, *Referential Drift*).
      *   Ask: "Who felt tired?" "Who felt the plaque was a solution?" "Who realized changing the road name was harder than the statue?"

  7.  **Evaluating Confidence & Limitations:**
      *   *Confidence:* High on the bureaucracy aspect. Writers enjoy roleplay.
      *   *Limitation:* An exercise can't generate *prose*. It generates *insight*. The writer still has to write the dialogue. Also, retirees might dominate the "council" dynamic too realistically (interruptions, procedure).
      *   *Least Sure Bit:* Whether they will actually resist the moral debate. Writers are opinionated. I need a strong facilitator script to cut them off.

  8.  **Final Polish (Tone & Voice):**
      *   Match the novelist's voice. Wry, practical, slightly cynical about bureaucracy.
      *   Ensure the instructions are clear for a 2-hour session.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Let them vote.
      *   *Correction:* No, council meetings rarely end in clean votes. They end in "deferred for further study." That's more realistic.
      *   *Initial thought:* Use real money stakes.
      *   *Correction:* Too abstract. Use "Staff Hours."
      *   *Make sure the "Plaque Trap" is inevitable.* Design the options so the plaque is the only middle ground, but then reveal the cost.

  10. **Final Review against constraints:**
      *   No tech? Yes.
      *   12 people? Yes (4 groups of 3 or 1 big group? Big group is better for "Council" feel).
      *   Labels hidden? Yes.
      *   Predictions included? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is a design for a two-hour workshop exercise called **"The Thorne Motion."** It is built to frustrate moral grandstanding and force your group into the weeds of administration, logistics, and social awkwardness.

  ### The Setup (10 Minutes)
  **The Room:** Arrange chairs in a hollow square or U-shape. Put a single object in the centre (a coffee mug, a stapler, a small figurine). This is **The Statue**.
  **The Town:** "Bleakmoor."
  **The Subject:** Sir Elias Thorne. Victorian industrialist. Built the library, the baths, and the orphanage. Also locked workers in during strikes and owned slum housing.
  **The Problem:** A petition has arrived. "Take it down." A counter-petition: "Keep it up." The Council must decide by the end of the meeting.

  **The Rule:** You (the facilitator) are the **Town Clerk**. You are tired, underpaid, and obsessed with procedure. You do not care about justice; you care about *minutes*. If they talk about morality for more than 30 seconds, interrupt them with: *"That is a matter for the History Sub-Committee. We are discussing Implementation."*

  ### The Roles (12 People)
  Hand out role cards face down. They must not show them to each other. Each card has a **Title**, a **Motivation**, and a **Burden**.

  1.  **The Heritage Lead:** Wants to keep it. *Burden:* You have to write the grant applications if it stays.
  2.  **The Community Activist:** Wants it gone. *Burden:* You don't live in the town centre; you never walk past it.
  3.  **The School Headteacher:** Neutral. *Burden:* You have to explain the statue to 300 children every year on the town walk.
  4.  **The Estates Manager:** Neutral. *Burden:* If it stays, your team has to clean the bird droppings off it. If it goes, your team has to fill the hole in the pavement.
  5.  **The Bus Company Rep:** Neutral. *Burden:* "Thorne Square" is a major stop. Drivers announce it 40 times a day.
  6.  **The Local Historian:** Wants context. *Burden:* You know the truth, but no one listens to you.
  7.  **The Shop Owner:** Wants footfall. *Burden:* You give directions to tourists constantly. "Where's the statue?"
  8.  **The Council Leader:** Wants the meeting to end. *Burden:* You have to sign the cheque for whatever they decide.
  9.  **The Caretaker:** Wants less work. *Burden:* You have to unlock the gates if it stays.
  10. **The Grandchild:** (Of Thorne). Wants it kept. *Burden:* You live in London. You never visit.
  11. **The Housing Officer:** Neutral. *Burden:* Three streets named after Thorne are on your repair list.
  12. **The Scribe:** (One of your sixth-formers). *Burden:* You must write down every decision. If it's vague, you ask for clarification.

  ### Round 1: The Statement (20 Minutes)
  Go around the circle. Each person has 45 seconds to state their position on the Statue.
  **Constraint:** They cannot mention Thorne's character (good or bad). They can only mention **impact on their role**.
  *   *Example:* "If it stays, I have to clean it." (Good)
  *   *Example:* "He was a monster." (Bad – Clerk interrupts: *"Character reference noted. Next."*)

  **Goal:** Establish that for half the room, the statue is a moral symbol; for the other half, it is a maintenance ticket.

  ### Round 2: The Logistics Grid (40 Minutes)
  Put a large sheet of paper on the flipchart. Draw three columns: **The Statue**, **The Street Names**, **The Building Names**.
  Ask the group: *"If we remove the name 'Thorne' from the town, where does it go?"*

  They must tick boxes.
  *   If they tick **Statue**: The Estates Manager and Caretaker must stand up and list the physical costs (concrete, skip hire, safety barriers).
  *   If they tick **Street Names**: The Housing Officer and Bus Rep must stand up. They must explain that changing street names requires new signage, updating GPS, and retraining drivers.
  *   If they tick **Building Names**: The School Headteacher and Heritage Lead must stand up. They explain that renaming the Library requires re-stamping every book.

  **The Trap:** Most will vote to remove the Statue but keep the Streets.
  **The Clerk's Intervention:** Point out the inconsistency. *"So the Bus Driver must announce 'Thorne Square' while driving past a hole in the ground where Thorne stood?"*
  Let them sit with that absurdity.

  ### Round 3: The Compromise (30 Minutes)
  Present the **Plaque Option**.
  *"Motion: The statue remains. A new plaque is installed explaining Thorne's crimes. Cost: £2,000. Maintenance: Same as statue."*

  Open the floor for 10 minutes.
  Then, introduce a **Crisis Card**. Hand one to the School Headteacher and one to the Activist.
  *   *Headteacher Card:* "You have decided to take the school trip past the statue. Parents are complaining the plaque isn't enough. They want the trip cancelled."
  *   *Activist Card:* "You realize the plaque makes the statue a 'learning destination'. More people will come to look at it."

  Ask the Council Leader to call a vote.
  *   Option A: Remove Statue.
  *   Option B: Keep Statue + Plaque.
  *   Option C: Defer Decision (The most realistic outcome).

  ### The Debrief (20 Minutes)
  Now you reveal the concepts. Write these on the flipchart.

  1.  **Enunciation Burden:** Ask the Bus Rep and the Headteacher: *"How did it feel to be the one who has to say the name out loud, compared to the Activist or the Grandchild?"*
      *   *Point:* The people injured by the name rarely have to speak it. The people who speak it rarely care about the history.
  2.  **Referential Drift:** Ask the Housing Officer. *"When you talk about 'Thorne Street', are you thinking of the man, or the potholes?"*
      *   *Point:* Street names become coordinates. Statues remain images. Removing one is functional; removing the other is symbolic. They are not the same task.
  3.  **The Plaque Trap:** Ask the group: *"Did the plaque solve the problem, or did it make the statue more important?"*
      *   *Point:* Contextualizing a monument often cements its permanence. It turns a statue into a museum exhibit, which justifies its existence.

  ### What Will Predictably Go Wrong
  1.  **The Moral Hijack:** At least three participants (likely the retirees) will ignore the "No Character Reference" rule in Round 1. They will want to debate if Thorne was a "bad man."
      *   *Fix:* You must be ruthless as the Clerk. *"That is not a budgetary item. Move on."* If you let them debate history, the exercise fails.
  2.  **The "Fix-It" Impulse:** Writers love resolution. They will try to find a clever third option (e.g., "Melt it down and make something new!").
      *   *Fix:* Remind them of the cost. *"Who pays for the melting? Show me the line item."*
  3.  **The Scribe's Rebellion:** The sixth-formers might feel sidelined by the "older" voices dominating the council dynamic.
      *   *Fix:* Empower the Scribe. Tell them privately beforehand: *"If the decision is vague, you are required to say 'I cannot minute that'."*

  ### What This Exercise Cannot Do
  This exercise creates **tension**, but it does not create **voice**.
  Your group will feel the *frustration* of the council meeting, but they won't necessarily generate the specific *cadence* of your characters. They might produce generic bureaucratic speak.
  *   **You** still have to write the dialogue where the subtext bleeds through. The exercise won't tell you *how* the Housing Officer says "I don't have the budget," only that they *feel* the weight of it.
  *   **You** have to write the silence. The exercise is noisy. The book needs the moments where everyone looks at the statue and says nothing.

  ### Confidence Assessment
  **Confidence Level:** 85%.
  The mechanics of "Burden" vs. "Belief" are solid and will almost certainly stop the "History Lecture" problem. Writers love constraints, and forbidding moral arguments forces them to find new angles.

  **Least Sure Element:** **The Plaque Trap.**
  I am 60% sure they will spot the trap immediately. Writers are clever; they might recognize the "plaque" as a cliché solution and reject it out of hand, which ruins the lesson that *plaques often make it worse*.
  *   *Mitigation:* If they reject the plaque instantly, force the vote. Make them choose between "Expensive Removal" and "Cheap Plaque." Most councils choose Cheap Plaque. That's when the lesson lands.

  ### Final Note for the Novelist
  When you return to your manuscript, look at your council scenes. If anyone makes a speech longer than three sentences about "Justice" or "History," cut it. Replace it with someone asking about the insurance premium on the bronze. That's where the truth is.
