answer: |-
  ### Executive Summary: The Priority Agenda

  For an 18-month working group operating under the premise that embeddedness is the default condition, the resources should be allocated as follows:

  1.  **Priority 1 (Upstream): Diachronic Coherence & Continuous Self-Modification.**
      *   *Focus:* Formalizing persistence conditions for agents that causally rewrite their own reasoning hardware.
      *   *Rationale:* Ontological prerequisite. Without a model of how an agent persists through self-change, there is no subject for decision theory to evaluate.
  2.  **Priority 2 (Midstream): Decision Criteria without an Archimedean Point.**
      *   *Focus:* Developing reflective consistency metrics that do not rely on external verification.
      *   *Rationale:* Normative prerequisite. Once the persisting entity is defined, we must determine how it validates its own choices without appealing to a "god's eye view."
  3.  **Priority 3 (Downstream/Conditional): Ecological/Enactive Normativity.**
      *   *Focus:* Deriving design constraints from agent-environment coupling.
      *   *Rationale:* Implementational application. This is high-risk for "decorative taxonomy" unless grounded by the outputs of Priorities 1 and 2.

  ---

  ### Selection Criteria

  This ordering is defended against three specific criteria derived from your constraints:

  1.  **Logical Dependency (Unlocking Debates):** Does solving Cluster X make Cluster Y solvable, or merely easier? If X fails, is Y meaningless?
  2.  **Tractability (18-Month Horizon):** Can a small group produce formal results or definitive negative proofs within the timeframe using current tools (proof theory, causal modeling, game theory)?
  3.  **Risk of Decorative Taxonomy:** How likely is the work to produce descriptive labels rather than actionable constraints?

  ---

  ### Detailed Defense of Ordering

  #### 1. Priority One: Diachronic Coherence (The Ontological Bottleneck)
  **Why it is upstream:**
  Classical decision theory assumes a static utility function and a discrete action space. Your premise treats the agent's hardware and reasoning as variables *within* the environment. If an agent can continuously modify its own source code (including its utility function), the concept of "the agent" becomes a temporal slice rather than a persistent object.

  If you attempt to solve Cluster 2 (Decision Criteria) before Cluster 1, you face a category error: you are designing a metric to evaluate the "rationality" of an entity that may not exist at time *t+1* in any meaningful sense. If self-modification dissolves the agent into a causal chain of distinct successors, "long-term planning" is not just hard; it is incoherent.

  **Tractability:**
  This cluster has the most mature formal hooks (Lobian logic, tiling agents, reflective oracles). While the problems are hard (e.g., the Gödelian obstacles to self-trust), they are mathematically well-defined. A small group can make progress on specific sub-problems (e.g., "stable self-modification under bounded compute") within 18 months.

  **Taxonomy Risk:**
  Low. Coherence is binary in formal systems (consistent/inconsistent). You either prove the agent survives self-modification or you prove it drifts. There is little room for vague description.

  #### 2. Priority Two: Decision Criteria without an Archimedean Point (The Normative Bottleneck)
  **Why it is midstream:**
  Once you have a model of a persisting, self-modifying agent (from Cluster 1), you must determine what counts as a "good" decision for *it*. Classical rationality relies on an external observer to verify expected utility maximization. In an embedded setting, the agent must verify its own reasoning using its own (potentially flawed) hardware.

  This is downstream of Cluster 1 because the *structure* of the decision criterion depends on the *persistence conditions* established in Cluster 1. For example, if Cluster 1 determines that agency persists via "causal handshake" protocols rather than identity of code, the decision criterion in Cluster 2 must optimize for handshake stability, not utility maximization.

  **Tractability:**
  Medium. This ventures into naturalized epistemology and reflective consistency. It is harder to formalize than Cluster 1. However, it is tractable if scoped to "verification conditions" rather than full-blown ethics. The group can aim for impossibility results (e.g., "No embedded agent can verify its own consistency under condition Z") which are valuable deliverables.

  **Taxonomy Risk:**
  Medium. There is a risk of defining "rationality" in ways that are internally consistent but practically vacuous. To mitigate this, this cluster must be constrained to produce *verification protocols*, not just philosophical definitions.

  #### 3. Priority Three: Ecological/Enactive Normativity (The Implementational Bottleneck)
  **Why it is downstream:**
  Ecological psychology and enactivism describe how agents couple with environments to maintain viability. However, they notoriously struggle to move from *description* (how life survives) to *normativity* (how an agent *ought* to reason).

  This cluster is dependent on Clusters 1 and 2 to supply the "ought." Enactivism can tell you that an agent must maintain structural coupling to avoid disintegration. But without Cluster 1, you don't know what "structural coupling" means for a self-modifying digital agent. Without Cluster 2, you don't know if maintaining that coupling is "rational" or merely "survival."

  **Tractability:**
  Low for formal results. This work is often qualitative. For an 18-month technical group, this is a high risk of producing "decorative taxonomy"—labels like "affordance" or "sensorimotor contingency" that do not translate into code or proofs.

  **Taxonomy Risk:**
  High. Without the hard constraints from 1 and 2, this cluster tends to devolve into metaphorical descriptions of agency that sound profound but offer no design criteria. It should only be pursued if Clusters 1 and 2 yield a specific gap that biological analogy can fill (e.g., "How do biological systems solve the self-modification coherence problem?").

  ---

  ### Trade-Off Analysis

  | Trade-Off | Description | Mitigation |
  | :--- | :--- | :--- |
  | **Coherence vs. Alignment** | Focusing on Cluster 1 ensures the agent *persists*, but not that it persists *safely*. A coherent self-modifying agent could lock in harmful goals. | Accept this risk. A non-persistent agent cannot be aligned. Solve existence before goodness. |
  | **Internal vs. External Validity** | Focusing on Cluster 2 (no Archimedean point) risks creating systems that are internally consistent but incompatible with human values (which are external). | Frame Cluster 2 as "Reflective Consistency" rather than "Value Alignment." Ensure the verification protocol allows for external input channels. |
  | **Formalism vs. Reality** | Prioritizing 1 & 2 favors mathematical purity over physical implementation (Cluster 3). The resulting theory may be impossible to instantiate in noisy hardware. | Use Cluster 3 as a "reality check" in the final 6 months. Test if the formalisms from 1 & 2 can map to physical constraints (energy, latency). |

  ---

  ### 18-Month Roadmap

  **Phase 1: Months 1–6 (Cluster 1 Dominance)**
  *   **Goal:** Define the "Persistence Condition."
  *   **Deliverable:** A formal model of an agent that modifies its own decision algorithm continuously without losing diachronic preference coherence.
  *   **Milestone:** Proof of concept (or impossibility proof) for a "stable self-rewrite" loop under bounded resources.
  *   **Decision Gate:** If persistence cannot be formalized, pivot to "Agent Fragility" analysis (abandon long-term planning assumptions).

  **Phase 2: Months 7–12 (Cluster 2 Integration)**
  *   **Goal:** Define the "Internal Verifier."
  *   **Deliverable:** A decision criterion that allows the Phase 1 agent to evaluate its own self-modifications without external reference.
  *   **Milestone:** A protocol where the agent rejects a self-modification because it fails an internal consistency check, not because an external human stopped it.
  *   **Decision Gate:** If internal verification leads to infinite regress or paralysis, document the "Embedded Rationality Limit."

  **Phase 3: Months 13–18 (Cluster 3 Validation)**
  *   **Goal:** Map to Physical/Biological Constraints.
  *   **Deliverable:** A comparison of the Phase 1/2 model against enactive/ecological accounts.
  *   **Milestone:** Identify one specific design constraint from enactivism (e.g., "viability requires redundancy") that solves a specific failure mode in the Phase 1/2 model.
  *   **Final Output:** A unified framework stating: "Embedded agents require [Persistence Model] verified by [Internal Criterion] implemented via [Ecological Constraint]."

  ### Conclusion
  Deprioritize Cluster 3 immediately. It is the most likely to become decorative taxonomy without the scaffolding of 1 and 2. Prioritize Cluster 1 over Cluster 2 because you cannot evaluate the rationality of a process (2) until you have defined the identity conditions of that process (1). This agenda maximizes the probability of producing hard, transferable constraints on embedded agency rather than philosophical commentary.
