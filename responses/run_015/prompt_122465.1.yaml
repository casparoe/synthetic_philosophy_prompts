      *   *Brain-in-a-Vat (BIV):* Nozick says we *do not* know we aren't BIVs. Condition 3 fails: If you were a BIV, you would still believe you weren't. The "distance" of the world matters for the truth of the subjunctive conditional, but the conclusion is skepticism about ~BIV, not knowledge of ~BIV.
