          *   The Labor Question (Full Employment vs. Liberation).
          *   Institutionalizing Needs (Relative vs. Absolute).
      *   **Section 2: Theory Illuminating the Episode.**
          *   Universalism as removing status anxiety.
          *   Security as a precondition for the "Good Life."
      *   **Section 3: Theory Strained or Silent.**
          *   Scarcity vs. Post-Scarcity assumption.
          *   The Moral Value of Work.
          *   The Missing Transition Mechanism.
      *   **Section 4: What the Episode Reveals About Keynes.**
          *   Political naivety regarding labor identity.
          *   The gap between technical solution and moral adaptation.
      *   **Conclusion:** Summary of the test results.

  8.  *(Self-Correction during drafting)*: Make sure not to conflate Keynes (Liberal) with Labour (Socialist). Keynes advised Labour, but his philosophical anthropology (humans as leisure-seekers) differs from the Labour movement's (humans as producers/workers). This tension is the heart of the prompt.

