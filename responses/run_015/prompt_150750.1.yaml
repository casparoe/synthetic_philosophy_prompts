      *   *The Problem:* If it's all sentiment, why do we argue about art? Why do we prefer Milton over a hack writer? Why does taste improve?
      *   *The Solution (Standard of Taste):* We need a standard to resolve disagreement.
      *   *The Sancho Panza Analogy:* Two kinsmen taste wine. One says iron, one says leather. People laugh. A key is found at the bottom of the cask. They were right.
      *   *The Point:* The qualities (iron/leather) were *really there*. The delicate tasters detected them. The coarse tasters missed them.
      *   *The Tension:* If beauty is in the mind, how can it be "really there" like iron in wine?
      *   *Hume's Nuance:* It's not that beauty is a physical property (like mass). It's that the *capacity to cause a specific sentiment* is a real relation between the object's structure and human psychology.
      *   *Sentiment vs. Judgment:* Sentiment is the feeling (pleasure/pain). Judgment is the assessment of whether the object is *fitted* to cause that feeling in a properly functioning observer.

  3.  **Address the Physicist's Analogy (Calibration/Measurement):**
      *   *Temperature:* Temperature is mean kinetic energy. A thermometer measures it. A broken thermometer gives wrong readings.
      *   *Hume's Aesthetics:* Beauty is not kinetic energy. It's more like "palatability." But not just "I like it." It's "This is fitted to be liked by a healthy human palate."
      *   *Inter-rater Reliability:* In physics, agreement implies an external truth. In Hume, agreement among *qualified* observers establishes the standard, but it doesn't prove a mind-independent property exists in the same way mass does.
