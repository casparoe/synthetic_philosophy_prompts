  **Frame-First Position:** Meaning is exclusively a function of the interpretive act situated in a community or biological history. The Inner Message is purely syntactic topology; without an external Frame to map tokens to territory, there is zero semantic content. The Frame dictates truth conditions and validity. The symbols themselves are inert until the context breathes life into them. We assert that syntax never suffices for semantics. A string is only a message because someone treats it as one.
  **Inner-Content Position:** Meaning is latent in structural complexity and logical relationships. The Inner Message possesses semantic weight via isomorphism to logical realities, independent of observers. The Frame selects which latent meaning becomes active but does not create it. The structure itself constrains valid interpretations. We assert that semantics is discoverable within syntax. A string is a message because of what it structurally mirrors.
  **Cruxes:**
  *   **(a) Symbol Autonomy:** Can a sequence mean anything without evolutionary or cultural grounding? Frame-First argues symbols are empty vessels requiring historical causal linkage to a world. Meaning requires use within a form of life. Without a user, there is no message. Inner-Content argues that sufficient structural complexity entails meaning regardless of history; the map matches the territory even if no one sees it. Structure implies use inherently. The message waits to be read.
  *   **(b) Reflexive Framing:** Does a self-referential loop generate its own context? Frame-First claims loops are syntactic snakes eating tails with no external anchor, spinning in void. It cannot lift itself by bootstraps; reference requires outside contact. The loop is just noise. Inner-Content claims the loop creates an internal stable state that functions as its own Frame, bootstrapping semantics from syntax alone. Stability creates reference internally. The loop becomes the observer.

  Section 3, "What would move us"
  **Crux A Case:** An isolated synthetic system generates language strings correlating perfectly with unseen quantum states, with no evolutionary or cultural background.
  *   *Frame-First:* This is correlation, not meaning. Without a community to use these strings for coordination, they remain ungrounded syntax. No history means no reference.
  *   *Inner-Content:* The isomorphism is sufficient. The structure mirrors reality, so semantic weight exists independently of usage. The meaning is in the match.
  **Crux B Case:** A self-modifying code loop that adjusts its own parsing rules based on output feedback until reaching dynamic stability.
  *   *Frame-First:* This is circular syntax. It references only its own state changes, lacking external truth conditions. It is a closed loop with no world.
  *   *Inner-Content:* The stability creates an internal ontology. The system has bootstrapped a Frame from pure recursion, generating autonomous semantics. The loop is the world.
