answer: |-
  **MEMORANDUM**

  **TO:** Ethics Board, Writers Guild
  **FROM:** [Your Name/Chair]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Paper Supplier Retention (Chapbook Series)

  **1. PURPOSE**
  This memo serves as the final recommendation ahead of Thursday's vote regarding the retention of our current paper supplier, linked to a mill involved in regional deforestation. The board is currently deadlocked between two positions: the **Causal Inefficacy Argument** (our volume is too small to impact deforestation; switching is performative) and the **Complicity Argument** (participation in harmful supply chains violates our ethical mandate regardless of volume).

  **2. RECOMMENDATION**
  I recommend the board **APPROVE THE SWITCH**, effective at the start of the next fiscal cycle, contingent on a **Transition Protection Plan** for our poets.

  We should not renew the contract. However, to address valid concerns regarding budget and poet impact, the cost differential must be absorbed by administrative overhead or a slight reduction in print run volume, not by reducing poet stipends or increasing book prices.

  **3. ETHICAL RATIONALE**
  The deadlock stems from talking past one another regarding *how* harm is assigned. To break this, we must distinguish between **Causal Leverage** and **Participatory Integrity**.

  *   **To the Causal Inefficacy Argument:** You are correct that cancelling our 0.02% order will not stop the trees from falling. If the metric for ethical action is "did this single transaction change the outcome," then no boycott of this scale ever works. However, this metric is insufficient for institutional ethics.
  *   **To the Complicity Argument:** You are correct that we cannot outsource our morality to a cost-benefit analysis. However, "norm refusal" cannot come at the expense of the artists we serve.

  **The Deciding Principle:**
  We must accept that collective harm is often *overdetermined*—the trees would fall without us—but that does not render individual roles morally neutral. By purchasing from this supplier, we are not merely observing the deforestation; we are providing **market legitimacy**. We are signaling that this paper is an acceptable commodity for literary art. Our goal is not to single-handedly halt the mill (causal), but to ensure the Guild is not a stakeholder in its operation (participatory).

  **4. ADDRESSING THE LOSING POSITIONS**
  For this vote to hold, both sides of the deadlock must feel their core concerns were weighed, even if their conclusion was not adopted.

  **To those voting to RETAIN the supplier (The Pragmatists):**
  Your concern is that this is "moral vanity" that hurts our poets. If we switch suppliers and the chapbook series folds because costs rise, we have traded actual art for symbolic purity. That is an unacceptable trade.
  *   **The Answer:** This recommendation includes a **Transition Protection Plan**. We will not balance the budget on the backs of the poets. If the new paper costs more, we print fewer copies or absorb the cost centrally. If the switch is truly cost-neutral or negligible, the "harm to poets" argument dissolves. If the switch *does* threaten the series viability, then we have a duty to pause. But we must verify the cost before assuming the harm. Do not vote to retain based on *assumed* budget impact; vote based on *verified* data.

  **To those voting to DROP the supplier (The Principled):**
  Your concern is that continuing the contract makes us accomplices. You argue that waiting for a "perfect" solution is a delay tactic.
  *   **The Answer:** You are right that we must exit the relationship. However, if we switch suppliers abruptly and disrupt the production schedule, we damage the Guild's reputation for reliability. A rushed switch that results in delayed books or poor print quality undermines the value of the chapbook itself. We must allow for a phased transition (next fiscal cycle) to ensure the ethical win does not result in operational failure.

  **5. ACTION ITEMS FOR THURSDAY'S VOTE**
  1.  **Motion:** Authorize Staff to source and contract with a certified sustainable paper alternative for the [Year] Chapbook Series.
  2.  **Condition:** Staff must present a budget impact analysis prior to signing. If the cost increase exceeds 10%, a secondary vote is required to allocate funds from the General Operating Budget (not the Poet Fund).
  3.  **Timeline:** Implementation begins with the next open submission window. Current inventory may be depleted to avoid waste.

  **6. CONCLUSION**
  We cannot save the forest with a chapbook order. But we can ensure that when our poets hold their work, they are not holding a piece of the destruction they often write against. The inefficacy of our boycott regarding the *trees* does not negate the efficacy of our boycott regarding our *integrity*.

  Let us vote to switch, but let us vote to protect the poets while doing it.

  **[Signature]**
