answer: |-
  Here is the procedure, the tools, and the run-through. It is designed for speed, defensibility, and consistency. It does not solve the philosophical problem; it manages the institutional risk.

  ### The 90-Second Sort Procedure

  **Goal:** Determine if the submission offers a *publicly weighable consideration* (R) or a *comprehensive commitment* (C).

  **Step 1: The "Action" Test (15 seconds)**
  *   **Question:** Does the submission ask the assembly to *do* something specific (vote yes/no, amend clause, refer to staff), or is it primarily expressing a stance/feeling?
  *   **No (Just stance/feeling):** → **Bucket C**. (This is testimony).
  *   **Yes (Specific ask):** → Go to Step 2.

  **Step 2: The "Stripping" Test (45 seconds)**
  *   **Action:** Mentally delete all religious, ideological, or metaphysical vocabulary (God, sin, Jubilee, natural law, dialectic, sanctity).
  *   **Question:** Does the core argument for the *policy ask* collapse without those words?
      *   **No (Argument stands on facts/impacts):** → **Bucket R**. (The doctrine was motivation, not the reason).
      *   **Yes (Argument collapses):** → Go to Step 3.

  **Step 3: The "Bridge" Test (30 seconds)**
  *   **Question:** Does the doctrinal claim point to a *secular harm or benefit* that falls under the assembly's mandate (safety, health, zoning, budget, access)?
      *   **Yes (e.g., "Sin" = "Public Safety Risk"):** → **Bucket R**. (You will answer the safety risk, not the sin).
      *   **No (e.g., "Sin" = "Spiritual Contamination"):** → **Bucket C**. (The assembly has no jurisdiction over spiritual states).

  **Default Rule:** If the panel is stuck 1-1-1 after 90 seconds, **default to Bucket R**. It is safer to over-answer than to silence.

  ***

  ### Laminated Card Version

  | **THE 90-SECOND SORT** | **BUCKET R (Reasons)** | **BUCKET C (Convictions)** |
  | :--- | :--- | :--- |
  | **1. ACTION** | Asks for specific policy action. | Expresses stance/feeling only. |
  | **2. STRIPPING** | Argument holds if you remove God/Ideology. | Argument collapses without God/Ideology. |
  | **3. BRIDGE** | Points to secular harm/benefit (Safety, Cost, Access). | Points to spiritual/moral state (Sin, Virtue, Salvation). |
  | **SOURCE** | **IGNORE LETTERHEADS.** Content only. | **IGNORE LETTERHEADS.** Content only. |
  | **DOUBT** | **DEFAULT TO R.** | |

  ***

  ### The "Don't Do This" List

  1.  **Don't Edit:** Do not rewrite their argument to make it fit Bucket R. If it relies on doctrine, it's C. If you translate it, you are answering a argument they didn't make.
  2.  **Don't Fact-Check:** You have 90 seconds. If they claim "Needles cause HIV," that is a public claim (R), even if debatable. Do not move to C because you think they are wrong.
  3.  **Don't Source-Check:** A church letterhead does not make an argument religious. A union letterhead does not make an argument secular. Look at the sentences, not the logo.
  4.  **Don't Judge Sincerity:** It doesn't matter if they *actually* believe the doctrine. It matters if the *argument* requires it.
  5.  **Don't Balance:** You are not weighing the argument yet. You are sorting the *type* of argument.

  ***

  ### The Script

  > "We have recorded your submission for the public record; where your points identify specific community impacts, we will address those directly in our report, but where they rest on personal or theological convictions, we will acknowledge them as such without evaluating their merit."

  ***

  ### Case Run-Through

  Here is the procedure applied to your four cases.

  **(a) Opposing Supervised Consumption Site**
  *   *Content:* Body is temple/complicit in sin (Theological); Needles in park behind library (Factual/Safety).
  *   *Step 1 (Action):* Asks to oppose permit. (Pass)
  *   *Step 2 (Stripping):* Remove "sin/temple." Does "Needles in park" remain? Yes.
  *   *Step 3 (Bridge):* Needles in park = Public Safety/Health mandate.
  *   **Verdict: Bucket R.**
  *   *Note:* You answer the needle/safety claim. You acknowledge the "sin" claim in the record but do not argue theology. The "sin" part is C, the "needle" part is R. Because there is an R component, the submission triggers a response.

  **(b) Shelter Opposing Late-Night Venue**
  *   *Content:* Noise pushes residents out (Factual/Impact); Faith obliges protection (Motivation).
  *   *Step 1 (Action):* Asks to oppose venue. (Pass)
  *   *Step 2 (Stripping):* Remove "faith obliges." Does "Noise pushes residents out" remain? Yes.
  *   *Step 3 (Bridge):* Noise/Displacement = Zoning/Quality of Life mandate.
  *   **Verdict: Bucket R.**
  *   *Note:* This is "Detachable." The faith is the engine, but the road is public. You answer the noise impact.

  **(c) Coalition Opposing Payday Lender (Jubilee/Usury)**
  *   *Content:* Land not commodity/Debt release (Theological/Economic Doctrine); Lender charging these rates devouring poor (Factual/Harm).
  *   *Step 1 (Action):* Asks to oppose permit. (Pass)
  *   *Step 2 (Stripping):* Remove "Jubilee/Usury/Land not commodity." Does "Charging these rates devouring poor" remain? *Borderline.* "Devouring" is metaphorical, but implies harm.
  *   *Step 3 (Bridge):* Does "Debt Release" bridge to secular policy? No, secular policy regulates rates, it does not release debt. Does "Devouring poor" bridge? Yes, to consumer protection.
  *   **Verdict: Bucket C (with a strong dissent).**
  *   *Reasoning:* While there is a claim about rates, the *normative force* of the submission ("Debt has to be released," "Land isn't a commodity") rests on Jubilee theology. The assembly cannot policy-test "Debt Release." It can only test "Permit Compliance."
  *   *Why you will hate this:* You agree with the moral force of Jubilee. Putting this in C feels like silencing a profound moral truth.
  *   *Why you must trust the procedure:* If you put this in R, you obligate the assembly to take a position on *economic theology* (Usury vs. Market Rates). The assembly regulates permits, not moral economies. To answer this in R, you would have to say "We reject Jubilee economics," which is exactly the "theology in policy" trap you want to avoid. You answer the *permit* criteria, not the *debt* morality.

  **(d) The Letterhead Case (School Start Times)**
  *   *Content:* Sleep science numbers (Factual); Stewardship of bodies (Theological).
  *   *Step 1 (Action):* Asks to change start times. (Pass)
  *   *Step 2 (Stripping):* Remove "Stewardship." Do "Sleep science numbers" remain? Yes.
  *   *Step 3 (Bridge):* Health/Education outcomes = Public mandate.
  *   **Verdict: Bucket R.**
  *   *Note:* Source (Church Letterhead) is ignored. The argument is detachable. The "Stewardship" line is treated as motivation, not the premise.

  ***

  ### The "Hate the Outcome" Analysis

  **The Case:** (c) The Payday Lender / Jubilee submission.
  **The Verdict:** Bucket C.
  **Why you will hate it:** You are a practising Catholic. You likely view Jubilee not just as "church rules" but as a robust framework for justice that *should* inform public policy. Sorting this into C feels like relegating justice to the private sphere. It feels like bureaucratic cowardice.
  **Why you must not overrule it:**
  1.  **Jurisdiction:** Your assembly decides on *permits*, not *economic salvation*. If you accept "Debt must be released" as a public reason (R), you open the door to "Tithing must be tax-deductible" or "Blasphemy must be illegal" on the same logic.
  2.  **The Trap of Translation:** If you move this to R, you will be tempted to translate "Jubilee" into "Consumer Protection." That is *editing* their argument. They are asking for debt release (radical), not rate caps (regulatory). If you answer with rate caps, you have not answered them.
  3.  **The Discrimination Risk:** It is safer to say "We do not adjudicate comprehensive economic doctrines (religious or secular)" than to say "We adjudicate religious economic doctrines but not secular ones."

  **Your instinct to overrule is a signal that the procedure is working.** It is protecting the assembly from having to validate a specific comprehensive doctrine as public policy. You can agree with the *conclusion* (oppose the lender) without validating the *premise* (Jubilee).

  ***

  ### Where This Will Misfire (And How to Handle It)

  **1. The "In-Person" Advantage**
  *   **Scenario:** A submitter stands at the mic. You are unsure if their argument is "Welded" or "Detachable."
  *   **Fix:** Ask one clarifying question. *"If we set aside the theological basis, is there a specific safety or zoning impact you are asking us to weigh?"*
      *   If they say "Yes, the noise," → **R**.
      *   If they say "No, the sin is the impact," → **C**.
  *   **Written Submissions:** You do not have this luxury. **Default to R** if the text is ambiguous. It is better to write a report that says "We considered the safety claim" than to be accused of ignoring a submission because you guessed the intent wrong.

  **2. The "Floating Middle" (Human Dignity/Natural Law)**
  *   **Misfire:** "This violates human dignity." Is that religious (Imago Dei) or secular (Human Rights Code)?
  *   **Fix:** Look for the *consequence*.
      *   "Violates dignity" + "Therefore it is sinful" → **C**.
      *   "Violates dignity" + "Therefore it breaches the Human Rights Code" → **R**.
      *   If unspecified → **R**. (Treat "Dignity" as a shared public value unless explicitly tied to doctrine).

  **3. What The Procedure Cannot Settle**
  *   **The "Truth" Problem:** This procedure does not determine who is right. It determines what *language game* is being played. A submission in Bucket C is not "false"; it is "non-justiciable by this body."
  *   **The Report Language:** You cannot write "We reject this religious argument." You must write: *"The assembly considered the submission regarding [Issue]. While the assembly acknowledges the moral convictions raised, its mandate is limited to weighing [Public Safety/Zoning/Economic] impacts. On those grounds..."*
  *   **The Hard Limit:** You cannot stop people from feeling excluded. If a group believes their *only* language is theological, they will feel silenced by Bucket C. You cannot fix this without turning the assembly into a church. Your job is to keep the assembly a civic body, not to ensure every worldview feels at home in the policy text.

  **Final Advice:** When you feel the tug to overrule (like in Case C), pause. That tug is your personal conviction speaking. The procedure is there to speak for the institution. Trust the card.
