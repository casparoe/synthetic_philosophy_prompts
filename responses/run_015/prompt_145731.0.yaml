  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Target Audience:** 12 advanced undergraduates in moral philosophy.
      *   **Prior Knowledge:** Understand duty/supererogation distinction but view it as intrinsic/agent-relative ("very good but optional").
      *   **Goal:** Make them feel the *instability* of the boundary based on a *social baseline* (distributed, hidden comparison class).
      *   **Format:** 90-minute workshop.
      *   **Mechanism:** Structured simulation/deliberation game.
      *   **Key Features:** Explicit rules, assigned roles, hidden info cards, small real stakes (points/reward/prestige).
      *   **Phases:**
          1.  Individual classification (Obligatory vs. Supererogatory).
          2.  Reveal hidden peer-baseline cards (reclassification based on comparison).
          3.  Second round (alter behavior -> shift baseline -> force reclassification).
      *   **Outcome:** Participants experience the reversal *before* the facilitator explains it.
      *   **Debrief:** Map phases to concepts, predict failures, identify limits (normative authority vs. descriptive presence).
      *   **Constraints:** No technology (paper/cards only), no bibliography/citations.

  2.  **Conceptual Core:**
      *   The core philosophical claim is that supererogation isn't just about the act's cost/benefit ratio in a vacuum; it's about doing *more than what is expected/done by peers*. If everyone does X, X becomes the baseline (duty). If few do X, X is supererogatory.
      *   The simulation needs to make the "baseline" hidden initially, then visible, then mutable.
      *   The "stakes" need to incentivize caring about the classification, not just the moral content.

  3.  **Game Design - "The Baseline Protocol":**
      *   *Setting:* A hypothetical community facing resource allocation or risk scenarios.
      *   *Roles:* 12 Agents.
      *   *Materials:* Scenario Cards, Classification Sheets, Baseline Tokens (Hidden Info), Score Sheet.
      *   *Stakes:* "Moral Capital" points. Top 3 get a small prize (chocolate/coffee) or public recognition. This creates competition regarding status.

      *   *Phase 1 (The Intuition):* Agents get scenarios (e.g., "Donate 10% of income," "Run into burning building"). They mark O (Obligation) or S (Supererogatory). They get points for matching the "Community Standard" (which they don't know yet).
      *   *Phase 2 (The Reveal):* The "Community Standard" is revealed via cards. It turns out the standard depends on how many people *actually* performed the act in the simulated history.
          *   *Mechanic:* If >50% of peers did it, it's Duty. If <50%, it's Supererogatory.
          *   *Twist:* The cards show that in *this* group, some "obvious" supererogatory acts were actually common (making them duty), and some "obvious" duties were rare (making them supererogatory or even non-existent).
          *   *Correction:* Participants must update their classification. Points awarded for updating correctly.
      *   *Phase 3 (The Shift):* Participants vote/choose to commit to actions for the next "cycle." This changes the baseline for the next round.
          *   *Incentive:* If you want an act to be Supererogatory (high prestige), you need few people to do it. If you want it to be Duty (low risk), everyone must do it.
          *   *Conflict:* Some want the prestige of S, some want the safety of O.
          *   *Result:* The baseline shifts, changing the moral status of the acts again.

  4.  **Refining the Mechanics for 90 Minutes:**
      *   12 students is a good size for 3 groups of 4 or one large group. One large group is better for "social baseline."
      *   Time allocation:
          *   Intro: 10 mins.
          *   Phase 1: 15 mins.
          *   Phase 2: 25 mins.
          *   Phase 3: 25 mins.
          *   Debrief: 15 mins.
      *   *Stakes:* Let's use "Reputation Points." The top 3 get first choice of snacks at the break or a small tangible reward.
      *   *Hidden Info:* The "Historical Prevalence" of each act.
      *   *Rule:* An act is **Obligatory** if Prevalence $\ge$ 60%. It is **Supererogatory** if Prevalence < 60% but Benefit > Cost. (Simplify for game: Majority = Duty, Minority = Supererogatory).

  5.  **Drafting the Materials:**
      *   Need 5 Scenarios.
      *   Need "Prevalence Cards" (Hidden until Phase 2).
      *   Need a way to track points.

  6.  **Addressing the "Normative Authority" Limit:**
      *   The game shows the *descriptive* shift (people do X, so X is duty).
      *   It cannot fully capture the *normative* force (people do X, so you *ought* to do X). The game uses points to simulate this pressure, but the debrief must highlight that in real morality, the "ought" doesn't come from points, but from the normative weight of expectations.

  7.  **Predicting Failures:**
      *   Students might resist the idea that popularity makes duty (Naturalistic Fallacy concern).
      *   Students might game the system too hard in Phase 3, ignoring the moral content.
      *   Students might treat the hidden cards as arbitrary rather than representative of a social fact.

  8.  **Structuring the Debrief:**
      *   Connect Phase 1 to "Intuitionism/Intrinsic View."
      *   Connect Phase 2 to "Social Baseline/Relational View."
      *   Connect Phase 3 to "Dynamic Normativity/Collective Responsibility."
      *   Address the "Is-Ought" gap explicitly.

  9.  **Review against Constraints:**
      *   90 mins? Yes.
      *   12 students? Yes.
      *   No tech? Yes (cards/paper).
      *   No citations? Yes.
      *   Specific philosophical goal? Yes (instability of boundary via social baseline).

  10. **Final Polish:** Ensure instructions are crystal clear for the facilitator. Make sure the "twist" in Phase 2 is sharp enough to cause cognitive dissonance. Ensure the stakes are clear but low enough not to ruin the philosophical mood. (Self-Correction: Make sure the "Prevalence" isn't just random numbers but tied to the specific group's choices in Phase 3 to show the *shifting* nature).

      *Wait, a tweak for Phase 3:* To show the *shifting* baseline, Phase 3 needs to change the status of the acts based on *their* current choices.
      *Revised Phase 3:* They vote on a "Community Pledge." If the pledge passes, the baseline for specific acts shifts. They then re-classify. This shows that *their* agency determines the moral landscape.

      *Let's refine the "Hidden Info":* In Phase 1, they don't know the prevalence. In Phase 2, they learn the prevalence of the *previous* cycle (simulated). In Phase 3, they set the prevalence for the *next* cycle.
      *Actually, simpler:*
      Phase 1: Classify based on intuition.
      Phase 2: Reveal "Actual Performance Data" (Hidden Cards). Rule: If >50% of agents perform it, it becomes Mandatory (Duty). If <50%, it remains Optional (Supererogatory). Reclassify.
      Phase 3: Agents choose whether to Commit to the act. Tally commitments. If Commitments >50%, the status flips for the next round.

      *Wait, the prompt asks for:* "hidden peer-baseline cards are revealed, showing that the same actions are reclassified by the group once the comparison class is visible."
      Okay, so the cards contain the data that determines the status.
