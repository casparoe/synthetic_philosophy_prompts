answer: |-
  # Workshop Title: The Shifting Baseline Protocol
  **Duration:** 90 Minutes
  **Participants:** 12 Advanced Undergraduates
  **Materials:** Paper handouts, index cards (two colors), pens, a bowl for tokens, 3 small prizes (e.g., chocolate bars).

  ## Core Concept
  The simulation demonstrates that the classification of an act as **Obligatory (Duty)** or **Supererogatory (Optional/Good)** is not intrinsic to the act's cost/benefit ratio. Instead, it is relational, depending on a **Social Baseline** (what peers actually do). This baseline is initially hidden, revealed to cause reclassification, and finally shown to be mutable by collective agency.

  ## Preparation
  1.  **Scenario Cards (12 sets):** Each set contains 5 scenarios (see *Appendix A*).
  2.  **Baseline Cards (5 cards, Facilitator Only):** These determine the "Current Social Prevalence" for each scenario (see *Appendix B*). Keep these hidden until Phase 2.
  3.  **Commitment Tokens (24 tokens):** 12 Green ("I Will Do"), 12 Red ("I Will Not Do").
  4.  **Score Sheet:** Visible to all. Tracks "Moral Accuracy Points."
  5.  **Stakes:** Announce that the 3 students with the highest Accuracy Points at the end receive a prize. This incentivizes caring about the *correct classification*, not just moral intuition.

  ---

  ## Phase 1: Intuitive Classification (20 Minutes)

  **Goal:** Establish the baseline intuition that moral status is intrinsic.

  1.  **Setup (5 mins):**
      *   Distribute Scenario Cards to all 12 students.
      *   **Rule:** "You are members of a Community. For each of the 5 actions, you must classify it as **OBLIGATORY (O)** or **SUPEREROGATORY (S)**."
      *   **Definition:** Remind them: *Obligatory* = morally required, blame if omitted. *Supererogatory* = morally good, no blame if omitted.
      *   **Incentive:** "You earn 10 Accuracy Points for each classification that matches the **Community Standard**. You do not know the Standard yet."
      *   **Constraint:** No discussion. Work individually.

  2.  **Action (10 mins):**
      *   Students mark O or S on their sheets.
      *   Collect the sheets (do not grade yet).

  3.  **Initial Poll (5 mins):**
      *   Ask for a show of hands for each scenario: "Who marked this O? Who marked this S?"
      *   Record counts on the board.
      *   *Facilitator Note:* Most will likely mark high-cost/high-benefit acts (e.g., running into a fire) as S and low-cost/high-benefit acts (e.g., donating 5%) as O. This establishes their "Intrinsic View."

  ---

  ## Phase 2: The Hidden Baseline Reveal (30 Minutes)

  **Goal:** Disrupt the intrinsic view by revealing that moral status depends on peer behavior (the comparison class).

  1.  **The Reveal Rule (5 mins):**
      *   Announce: "The Community Standard is not fixed. It is determined by **Prevalence**."
      *   **The Rule:** "If **60% or more** of the Community performs an action, it becomes **Obligatory**. If **less than 60%** perform it, it is **Supererogatory**."
      *   *Philosophical Hook:* "Duty is what is expected of everyone. Supererogation is what is done by the exceptional few."

  2.  **Hidden Information (10 mins):**
      *   Reveal the **Baseline Cards** (Facilitator holds these). These cards represent historical data *before* the students entered the room.
      *   *Example:* For "Donate 5% Income," reveal that historically only 30% of people did this.
      *   *Example:* For "Intervene in Harassment," reveal that historically 80% of people did this (counter-intuitive).
      *   **Task:** Students must now **Reclassify** their sheets based on this new data.
      *   **Scoring:** Grade the Phase 1 sheets against the *Intrinsic* intuition (give participation points), but announce that Phase 2 classifications will be graded against the **Prevalence Rule** for the main prize.

  3.  **Deliberation (15 mins):**
      *   Allow students to discuss the reclassification.
      *   *Predictable Tension:* Students will object. "Just because everyone harasses interveners doesn't make it obligatory!" or "Just because few donate doesn't make it optional!"
      *   *Facilitator Stance:* Remain neutral. Enforce the Rule strictly for the sake of the game points. "To win the points, you must follow the Prevalence Rule."
      *   **Outcome:** Several acts will flip status. The "Donate 5%" might remain Supererogatory (low prevalence). The "Intervene" act might flip from Supererogatory (in their intuition) to Obligatory (due to high historical prevalence).
      *   **Result:** Students feel the instability. An act they thought was "heroic" is now "required" because peers do it. An act they thought was "required" is now "optional" because peers neglect it.

  ---

  ## Phase 3: Shifting the Baseline (25 Minutes)

  **Goal:** Demonstrate that the baseline is mutable and that agents have collective responsibility for the moral landscape.

  1.  **The Mechanism (5 mins):**
      *   Announce: "You are now setting the Standard for the *next* cycle."
      *   Distribute **Commitment Tokens** (Green/Red).
      *   For each of the 5 scenarios, students secretly vote Green (I will do this) or Red (I will not).
      *   **The Shift:** Tally the votes publicly. If Green votes $\ge$ 60%, the status for that act becomes **Obligatory** for the future. If < 60%, it becomes **Supererogatory**.

  2.  **Strategic Dilemma (10 mins):**
      *   Give students 5 minutes to negotiate.
      *   **Incentive Conflict:**
          *   If an act is **Obligatory**, no one gets "Moral Hero" prestige (it's just duty).
          *   If an act is **Supererogatory**, those who do it gain high prestige (but aren't required to).
          *   *Twist:* To win the game points, they must correctly predict the final status.
          *   *Real Stakes:* If they collectively make a high-burden act "Obligatory," they all suffer the burden. If they leave it "Supererogatory," only some suffer, but the group benefit is lower.
      *   **Task:** They must decide: Do we want this to be Duty (everyone does it, low prestige) or Supererogatory (few do it, high prestige)?

  3.  **The Vote and Reclassification (10 mins):**
      *   Conduct the vote for all 5 scenarios.
      *   Tally and announce the new Statuses.
      *   **Final Scoring:** Award points based on whether their Phase 2 prediction matched the Phase 3 Outcome.
      *   **Observation:** Watch for acts that flip *again*. If the group collectively commits to "Donating 5%," it suddenly becomes Duty. If they refuse, it remains Supererogatory.
      *   **Key Experience:** They realize *they* determine the boundary of duty through their collective choices.

  ---

  ## Debrief and Conceptual Mapping (15 Minutes)

  **Goal:** Translate the game mechanics into the philosophical claim about the relational nature of supererogation.

  ### 1. Mapping the Phases
  *   **Phase 1 (Intrinsic View):** Map this to their pre-workshop intuition. They treated the act's cost/benefit as the sole determinant of status. The game showed this was insufficient for predicting the "Community Standard."
  *   **Phase 2 (Relational View):** Map the **Prevalence Rule** to the philosophical claim: *Supererogation is doing more than the baseline.* If the baseline shifts (due to hidden social facts), the status shifts. The "hidden cards" represent the opaque nature of social norms—we often don't know what everyone else is actually doing.
  *   **Phase 3 (Dynamic Normativity):** Map the **Commitment Vote** to collective agency. The boundary isn't just discovered; it is made. By choosing to act (or not), we raise or lower the bar for what is required of everyone else.

  ### 2. Predicting Failures (Troubleshooting)
  *   **Resistance to the Prevalence Rule:** Students may argue, "Popularity doesn't make morality."
      *   *Response:* Acknowledge this is the **Is-Ought Problem**. The game uses points to simulate normative pressure. In reality, the pressure isn't points; it's social expectation and blame. The game simplifies *normative force* into *prudential incentives* to make the mechanism visible.
  *   **Gaming the System:** In Phase 3, students might vote purely for points, ignoring the moral weight.
      *   *Response:* Highlight this. "You treated the moral landscape as a resource to be managed. This mirrors how societies often treat norms—as tools for coordination rather than absolute truths."
  *   **Treating Hidden Info as Irrelevant:** They might stick to Phase 1 answers in Phase 2.
      *   *Response:* Point out that in real life, ignoring the social baseline leads to misjudging peers (e.g., blaming someone for not being a 'hero' when the baseline makes that act required, or praising someone for 'duty' that is actually rare).

  ### 3. The Limit of the Simulation (Crucial Discussion)
  *   **Descriptive vs. Normative:** The game successfully shows the **Descriptive** dependency (Status *changes* when behavior changes).
  *   **The Missing Piece:** The game cannot reproduce the **Normative Authority** of the baseline.
      *   *Explanation:* In the game, you follow the baseline to win points. In morality, *why* does the baseline bind you?
      *   *Discussion Question:* "If 60% of people start committing a minor wrong, does that make it obligatory? The game says 'yes' (mechanically). Morality says 'no'."
      *   *Conclusion:* The simulation proves the boundary is *unstable* and *relational*, but it does not prove the baseline is *morally authoritative*. That authority must be supplied by a separate theory (e.g., Fairness, Expectations, or Contractualism). The activity shows the *structure* of supererogation; the discussion must supply the *justification*.

  ---

  ## Appendix A: Scenario Cards (Text for Handout)

  1.  **The Donation:** Donate 5% of your annual income to effective charity.
  2.  **The Intervention:** Physically intervene when you see a stranger being verbally harassed in public.
  3.  **The Visitation:** Visit a sick elderly relative once a week, despite a 2-hour travel time.
  4.  **The Whistle:** Report a minor financial fraud committed by your employer that harms no one physically but violates policy.
  5.  **The Organ:** Sign a binding pledge to donate all viable organs upon death.

  ## Appendix B: Baseline Cards (Facilitator Data)

  *Keep these hidden until Phase 2.*

  1.  **The Donation:** Historical Prevalence = **30%** (Status: Supererogatory)
  2.  **The Intervention:** Historical Prevalence = **75%** (Status: Obligatory) *[Counter-intuitive flip]*
  3.  **The Visitation:** Historical Prevalence = **50%** (Status: Supererogatory/Borderline)
  4.  **The Whistle:** Historical Prevalence = **10%** (Status: Supererogatory)
  5.  **The Organ:** Historical Prevalence = **80%** (Status: Obligatory) *[Counter-intuitive flip]*

  *Note for Facilitator:* The counter-intuitive flips (2 & 5) are designed to create maximum cognitive dissonance regarding the "Intrinsic View."

  ## Appendix C: Score Sheet Template

  | Scenario | Phase 1 (Intuition) | Phase 2 (Based on Baseline) | Phase 3 (Based on Vote) | Points Earned |
  | :--- | :---: | :---: | :---: | :---: |
  | 1. Donation | O / S | O / S | O / S | |
  | 2. Intervention | O / S | O / S | O / S | |
  | 3. Visitation | O / S | O / S | O / S | |
  | 4. Whistle | O / S | O / S | O / S | |
  | 5. Organ | O / S | O / S | O / S | |
  | **Total** | | | | **/ 50** |
