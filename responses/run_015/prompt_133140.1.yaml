prompt: |-
  Hey — long time lurker, been reading this stuff since the old LW days and I've somehow ended up in a job where it's actually load-bearing, which is annoying because it turns out I only ever learned to argue about it, not to do it.

  I'm the person who has to sign off on "nudge review" at the company I work for. We make a savings app: you link a debit card, it rounds up your purchases, it sets streaks, it sends you pushes, it has a little plant avatar that visibly wilts if you miss a day. Every change to any of that goes past me before it can ship — pushes, copy, streak mechanics, anything adaptive or personalized, the onboarding flow itself. Call it 15–20 reviews a month. I get about thirty minutes per review, I have to leave a written rationale in the ticket, my head of product can overrule me but has to say why in the same ticket, and legal only ever looks at the things I flag. So the failure mode I'm scared of is the obvious one: I rubber-stamp everything except whichever thing feels gross that week, and the "rationale" is a vibe with a semicolon in it.

  What I want is a procedure, not principles. Questions in order. What counts as a sufficient answer to each one. Where it stops with a no. Where it explicitly hands the decision to a human because what's left is a disagreement about values and no amount of procedure will settle it — and what I'm supposed to write in the ticket when I hand it off. It has to be runnable by a pm who has never read any of this and has roughly half an hour, and it has to survive being steelmanned by our growth lead, who is genuinely sharp and will point out (correctly) that every design choice "exploits" some quirk of human psychology, including the ones I like.

  The line I actually care about is manipulation vs. legitimate persuasion, and I want the procedure to do real work on it rather than collapsing into "does it change behavior" (of course it does; the whole point of the app is to get people to save money they'd otherwise spend) or into "would you be comfortable telling the user exactly what this does" (our growth team has learned to write disclosure copy that technically tells you everything and changes nothing). Two things I'd like you to build in, since they're the cases that break the tests I've tried:

  - I've started calling one failure mode "vulnerability arbitrage": we can see overdraft events and payday dates, and a nudge can work either by giving someone a reason they'd endorse on reflection or by finding a lever — catching them in a hot state, at the hour our model thinks they're most impulsive, with loss-framing. I want the procedure to separate those two cleanly and tell me what evidence I need, and what to do when I can't get it.
  - The opt-in for pushes is default-on during onboarding, so half of what I'm reviewing is a flow the user maybe never chose. Does the procedure need a step that audits the consent architecture itself rather than the individual nudge, and is that even mine to decide?

  Then run it on three real-ish ones: (1) streaks plus a "streak freeze" you can earn or buy, plus the wilting plant; (2) a push sent the evening of payday saying people like you saved $40 this week, timed by a model that learned each user's most impulsive hour; (3) adaptive copy that switches to a red badge and a specific shortfall number for users our model flags as high overdraft risk this week. Please include at least one case where the procedure says no to something I'd defend and at least one where it clears something I expected it to kill — I want to know if I'm just laundering my intuitions.

  Also: our users say in interviews they want the notifications, and 40% of them have turned pushes off within a month. I don't trust either number. Where does the procedure go for evidence about whether people actually endorse this, and what's the fallback?

  Finally, be straight with me about what the procedure can't do — where it'll misfire, what it's structurally blind to, and what I should do in the first month to find out whether it's doing anything at all.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time LessWrong reader, now in a "load-bearing" ethics/compliance role at a fintech startup (savings app).
      *   **Role:** "Nudge Reviewer." Signs off on product changes (pushes, copy, mechanics, onboarding). ~15-20 reviews/month, 30 mins each.
      *   **Constraints:** Needs a *procedure*, not principles. Must be runnable by a PM in 30 mins. Must survive steelmanning by a sharp Growth Lead. Needs clear stop/go/handoff criteria.
      *   **Core Problem:** Distinguishing manipulation from legitimate persuasion. Avoiding "vibe with a semicolon" rationales.
      *   **Specific Pain Points:**
          *   "Vulnerability Arbitrage": Using data (overdrafts, payday, impulsive hours) to exploit hot states vs. supporting reflective goals.
          *   Consent Architecture: Default-on pushes during onboarding. Is this the reviewer's job?
          *   Evidence Gap: Users say they want notifications, but 40% turn them off. Who to trust?
      *   **Deliverables:**
          *   A step-by-step procedure (Questions, Sufficient Answers, Stop Conditions, Handoff Protocol).
          *   Application to 3 specific cases (Streaks/Plant, Payday Push, Adaptive Overdraft Copy).
          *   Requirement: One case where the procedure says "No" to something defensible, one where it clears something expected to be killed.
          *   Meta-analysis: Limitations of the procedure, blind spots, validation plan for the first month.

  2.  **Deconstruct the Core Ethical Tension:**
      *   *Legitimate Persuasion:* Aligning user actions with their *reflective* goals (saving money) using tools they would endorse if calm and informed.
      *   *Manipulation:* Aligning user actions with *company* goals (engagement, retention, fees) by exploiting cognitive biases, hot states, or information asymmetry, which the user would reject upon reflection.
      *   *The "Disclosure" Trap:* Growth teams write copy that technically discloses but functionally obscures. The procedure needs to test *salience* and *comprehension*, not just existence.
      *   *The "Consent" Trap:* Default-on is standard but ethically fraught. The reviewer needs to assess if the *path to opt-out* is fair, even if the *default* is out of their direct control.

  3.  **Drafting the Procedure (The "Nudge Audit Protocol"):**
      *   *Goal:* Make it algorithmic enough to reduce cognitive load, but flexible enough for edge cases.
      *   *Structure:* 5 Steps.
      *   *Step 1: Intent & Alignment.* Who benefits? Is the user's goal clear?
      *   *Step 2: State & Timing.* Is the user in a hot state? Are we exploiting vulnerability?
      *   *Step 3: Transparency & Exit.* Can they understand it? Can they stop it easily?
      *   *Step 4: Evidence of Endorsement.* How do we know they actually want this?
      *   *Step 5: The Handoff.* When to escalate.
      *   *Refinement:* Need to make sure the "Vulnerability Arbitrage" point is central. Need to address the "Consent Architecture" question (Yes, it is the reviewer's job to audit the *friction* of opt-out, even if they can't change the default).

  4.  **Developing the Test Cases:**
      *   *Case 1: Streaks/Plant/Freeze.*
          *   *Intuition:* Gamification is usually fine, but "wilting plant" induces guilt. "Freeze" monetizes failure.
          *   *Procedure Outcome:* Likely Clear with conditions. The "wilting" is emotional, but aligns with saving. The "freeze" needs to be earnable, not just buyable, to avoid predation.
          *   *Requirement Check:* I need one case where it clears something I might expect to kill. Let's make this the one. Gamification is often criticized, but if it aligns with reflective goals, it passes.
      *   *Case 2: Payday Push + Impulsive Hour Model.*
          *   *Intuition:* This screams "Vulnerability Arbitrage." Timing based on impulsivity is risky.
          *   *Procedure Outcome:* Hard No / Handoff. Exploiting "most impulsive hour" is the definition of manipulation.
          *   *Requirement Check:* This is the obvious "No."
      *   *Case 3: Adaptive Overdraft Copy (Red Badge).*
          *   *Intuition:* Scaring people about overdrafts seems good (prevents fees), but using fear on high-risk users is dark.
          *   *Procedure Outcome:* This needs to be the "No to something I'd defend" or the "Clear something I expected to kill." Let's make it the "No to something I'd defend." I might defend it as "protecting them from fees," but the procedure should flag the *fear induction* on *vulnerable* users as a handoff.
          *   *Wait, let's swap:* The prompt asks for "one case where the procedure says no to something I'd defend." I would likely defend the Overdraft warning (it saves them money). If the procedure kills it because of the *method* (fear/red badge on vulnerable users), that fits.
          *   *And:* "one where it clears something I expected it to kill." I might be skeptical of the Plant/Streak (guilt-tripping). If the procedure clears it because it aligns with long-term goals and has an exit, that fits.

  5.  **Addressing the Evidence Gap (Surveys vs. Behavior):**
      *   Users say they want pushes (Social Desirability Bias).
      *   Users turn off pushes (Revealed Preference).
      *   *Procedure Fix:* Weight revealed preference (opt-out rates) higher than stated preference, *but* adjust for friction. If opt-out is hard, high opt-out is expected. If opt-out is easy and they still stay, that's endorsement.
      *   *Fallback:* "Cooling Off" period. If 40% turn it off in month 1, the default should perhaps be off, or the onboarding needs a "choose your own adventure" style setup.

  6.  **Addressing Limitations & Blind Spots:**
      *   Procedure can't measure long-term harm (e.g., anxiety).
      *   Procedure relies on data quality (does the model *actually* know impulsivity?).
      *   Procedure can be gamed (PMs writing answers to pass).
      *   *Validation:* Track "Handoff Rate" vs. "Overrule Rate." If Head of Product overrules every "No," the procedure is dead.

  7.  **Refining the Tone:**
      *   The user is a LW lurker. Use precise language (reflective vs. immediate preferences, epistemic status, steelmanning).
      *   Be direct, slightly cynical but constructive. Acknowledge the "load-bearing" stress.
      *   Avoid moralizing; focus on *mechanism*.

  8.  **Final Review against Constraints:**
      *   30 mins per review? Yes, the checklist needs to be tight.
      *   Written rationale format? Include a template.
      *   Consent Architecture? Explicitly included in Step 3.
      *   Vulnerability Arbitrage? Explicitly included in Step 2.
      *   Three cases run through? Yes.
      *   Limitations section? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe the procedure should ban default-on.
      *   *Correction:* No, the user says they can't necessarily change that. The procedure should audit the *ease of exit* and the *salience of the choice* during onboarding.
      *   *Initial thought:* Make the "No" criteria very strict.
      *   *Correction:* If it's too strict, Growth will bypass it. It needs to be defensible. Focus on *asymmetry of benefit* and *exploitation of cognitive error* rather than *influence*.
      *   *Case 3 Tweak:* The adaptive overdraft copy. If it helps them avoid fees, isn't that good? The risk is inducing panic that leads to *worse* decisions. The procedure needs to ask: "Does this increase cognitive load during a high-stress decision?" If yes, No.

  10. **Final Polish:** Ensure the "Handoff Protocol" is specific about what to write in the ticket. (e.g., "Value Conflict: X vs Y").

  *(Self-Correction on Case 1 vs Case 3 for the "Surprise" requirement)*:
  *   *Expectation:* I (the user) probably think the Plant/Streak is manipulative (guilt).
  *   *Procedure:* Might clear it if it aligns with stated goals and exit is easy. -> *Clears something I expected to kill.*
  *   *Expectation:* I (the user) probably think Overdraft Warnings are helpful (paternalistic protection).
  *   *Procedure:* Might kill it if it uses fear framing on vulnerable users without explicit consent. -> *Says No to something I'd defend.*
  *   *Perfect.*

