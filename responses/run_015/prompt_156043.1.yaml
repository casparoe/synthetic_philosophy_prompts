          *   **Double-audience:** True to Group A, misleading to B (lacks context). *Verdict:* Hospital setting makes this common (rounds). Account must distinguish between negligence (should have known B was listening) and unavoidable collateral misleading. (Non-negotiable).
          *   **Interpreter:** Third-party relay. *Verdict:* The clinician is responsible for the interpreter's framing. If the interpreter misleads, did the clinician? Account must address agency in translation. (Non-negotiable).
          *   **Competence-gradient:** Hearer capacity varies. *Verdict:* Standard of care usually requires adjusting to the *patient's* capacity, not the average. Account must not allow "technically true but incomprehensible" to count as honest. (Non-negotiable).
