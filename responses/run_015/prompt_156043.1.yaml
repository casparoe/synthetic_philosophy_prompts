answer: |-
  # Specification for the Deception Section: Desiderata and Constraints

  You are asking for a moral theory to function as an administrative instrument. This changes the physics of the problem. A theory that works in a seminar room often fails in a review board because it relies on evidence that does not exist in the chart. Below is the specification list required for this code to function, followed by the structural analysis you requested.

  ## Part I: The Desiderata List

  I have sorted your seven cases into **Non-Negotiables** (the code fails if it gets these wrong) and **Camp Preferences** (where philosophical schools diverge, and the committee must choose a lane).

  ### A. Non-Negotiable Desiderata (Functional Requirements)
  *These must be satisfied for the code to protect patients and clinicians fairly within a hospital system.*

  1.  **The Deferred-Disclosure Constraint**
      *   **Case:** Clinician states $P$ (true), expects inference $Q$ (false), knows $Q$ will be corrected after the decision window closes.
      *   **Requirement:** The account must classify this as **deception**, equivalent to lying.
      *   **Reason:** Truth is time-sensitive in medicine. A true statement that exploits a temporal gap to force a decision based on false premises violates informed consent just as a lie does.
      *   **Status:** **Non-Negotiable.** (Any account that permits this invites liability and ethical breach).

  2.  **The Hollow-Option Constraint**
      *   **Case:** Clinician says, "Ask me anything," but status asymmetry makes the question unaskable.
      *   **Requirement:** The account must treat a *nominal* opportunity to inquire as **no opportunity at all**.
      *   **Reason:** Informed consent requires understanding, not just access to the speaker. If power dynamics silence the patient, the disclosure is defective.
      *   **Status:** **Non-Negotiable.** (This is the core of modern patient-rights law).

  3.  **The Competence-Gradient Constraint**
      *   **Case:** Statement is technically true but calibrated to a capacity the patient does not possess (e.g., medical jargon to a layperson).
      *   **Requirement:** The account must locate the moral burden on the **speaker's calibration**, not the hearer's comprehension.
      *   **Reason:** Clinicians hold the expertise. "Truth" in a clinical setting is a communicative act, not just a semantic one.
      *   **Status:** **Non-Negotiable.**

  4.  **The Double-Audience Constraint**
      *   **Case:** True remark to Family A is overheard by Relative B who lacks context, leading to false belief.
      *   **Requirement:** The account must distinguish between **foreseeable collateral misleading** (negligence) and **unavoidable collateral misleading** (excusable).
      *   **Reason:** Rounds happen in hallways. You cannot ban all misleading of bystanders, but you must require reasonable precautions (lowering voice, moving rooms).
      *   **Status:** **Non-Negotiable.**

  5.  **The Interpreter/Proxy Constraint**
      *   **Case:** Clinician speaks truth; Interpreter or Chaplain relays it with added endorsement or distortion.
      *   **Requirement:** The account must assign **primary responsibility to the source** for the choice of proxy, but **shared responsibility** for the framing.
      *   **Reason:** Clinicians cannot outsource moral agency to interpreters. If you choose the relay, you own the signal-to-noise ratio.
      *   **Status:** **Non-Negotiable.**

  ### B. Camp Preferences (Where the Committee Must Vote)
  *These are philosophical commitments. You cannot satisfy all of them simultaneously.*

  6.  **The Hostile-Uptake Exoneration**
      *   **Case:** Clinician is fully clear and cooperative; Patient is determined to misunderstand (e.g., conspiracy theorist).
      *   **Requirement:** Does the clinician bear responsibility for the uptake?
      *   **Camp A (Intent/Assertion):** No. If the assertion was clear, the clinician is clean.
      *   **Camp B (Consequentialist/Trust):** Yes. If harm results, the communication failed.
      *   **Status:** **Camp Preference.** (I recommend Camp A for a code; Camp B creates defensive medicine).

  7.  **The Borrowed-Credibility Limit**
      *   **Case:** Clinician says $P$ (true); Chaplain implies $P$ means $Q$ (religious comfort).
      *   **Requirement:** How far does the clinician's responsibility extend into the *implications* drawn by allied health staff?
      *   **Camp A (Strict):** Clinician is responsible for all foreseeable inferences by the care team.
      *   **Camp B (Compartmentalized):** Clinician is responsible only for their direct assertions.
      *   **Status:** **Camp Preference.** (Strict liability is morally safer; Compartmentalized is administratively easier).

  ---

  ## Part II: Structural Requirements & The Trilemma

  You asked if the account can be:
  1.  **Auditable** (Determinate verdicts by absent reviewers).
  2.  **Teachable** (90 minutes, no philosophy).
  3.  **Stable** (Across religious/secular commitments).
  4.  **Context-Sensitive** (Real sensitivity to the specific interaction).

  **The Verdict:** You cannot have all four. Specifically, **Auditability**, **Context-Sensitivity**, and **Protection Against Power Asymmetry** form an unsatisfiable trilemma.

  ### The Unsatisfiable Subset: Auditability vs. Hollow-Options
  *   **The Conflict:** To be *Context-Sensitive* to the **Hollow-Option** case, the review committee must know whether the patient *felt* empowered to ask questions. This is a subjective, internal psychological state.
  *   **The Audit Constraint:** To be *Auditable*, the committee must rely on objective evidence (chart notes, recordings).
  *   **The Demonstration:**
      *   *Scenario:* Doctor documents "Risks discussed, questions invited." Patient signs consent. Later, patient claims they were terrified to speak (Hollow Option).
      *   *Audit:* The chart is compliant. Verdict: No deception.
      *   *Reality:* The option was not live. Verdict: Deception.
      *   *Fix:* To make this auditable, you would need video of every encounter or a third-party witness. This is resource-prohibitive.
      *   *Fix:* To make this sensitive, you must presume intimidation in high-stakes cases. This is unfair to clinicians (presumptive guilt).
  *   **Conclusion:** You must sacrifice either **Auditability** (accepting that some deception will go unpunished because it leaves no paper trail) or **Sensitivity** (accepting that some hollow options will count as real because the chart says so). **For a hospital code, you must sacrifice Sensitivity.** You cannot audit a feeling.

  ### The Hardest Requirement
  **Retrospective Auditability.**
  This requirement excludes the most philosophical candidates. It eliminates any account that relies heavily on **Speaker Intention**.
  *   *Why?* A review committee sitting three months later cannot know what the clinician *intended* at the bedside. They only have the record.
  *   *Consequence:* Any theory based on "Intent to Deceive" (the standard philosophical definition of lying) is administratively dead unless you create a presumption rule (e.g., "If the outcome was misleading, intent is presumed").

  ### The Camp Prejudice
  **The Moral Relevance of the Lying/Misleading Distinction Itself.**
  *   *The Prejudice:* Much of the philosophical literature assumes there *is* a moral difference between lying (asserting falsehood) and misleading (implying falsehood).
  *   *The Reality:* In a hospital setting, **harm is the currency.** If a patient consents to surgery based on a lie, they are harmed. If they consent based on a technically true but misleading implication, they are equally harmed.
  *   *Recommendation:* Do not write a code that treats misleading as inherently "less bad" than lying. Treat them as **equivalent violations of informed consent**, differing only in the *evidence required to prove them*. Lying is easier to prove (check the statement); misleading is harder (check the context).

  ---

  ## Part III: Evaluation of Your "Option-Space View"

  **Your Candidate:** Currency = Planning-relevant options retained. Follow-up = Option only if live.

  **Does Deferred-Disclosure sink it?**
  *   **No.** In fact, this is where your view shines. In deferred-disclosure, the patient loses the option to *plan correctly during the decision window*. The fact that truth arrives later is irrelevant if the planning option was corrupted *ex ante*. Your view correctly flags this as a violation.

  **Does Hollow-Option sink it?**
  *   **Morally, No.** Your view correctly identifies that a nominal question is not a live option.
  *   **Administratively, Yes.** This is the fatal flaw for *this specific purpose*. How does a review committee determine if an option was "live" without the patient present?
      *   If you define "live" objectively (e.g., "Was the door closed?"), you miss the power dynamic.
      *   If you define "live" subjectively (e.g., "Did the patient feel safe?"), you cannot audit it.
  *   **Verdict:** Your view is morally superior to standard assertion-based accounts, but it is **administratively non-viable** for a retrospective review committee unless you operationalize "live option" into checkable behaviors (e.g., "Did the clinician leave the room to allow private discussion?").

  ---

  ## Part IV: Appendix — Scoring the Families of View

  | View Family | Auditability | Teachability | Stability | Context Sensitivity | Handles Deferred-Disclosure | Handles Hollow-Option | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Assertion-Based** (Lying = False Assertion) | **High** (Easy to check text) | **High** (Simple rule) | **High** (Neutral) | **Low** (Ignores implication) | **Fail** (Allows it if literal truth) | **Fail** (Counts nominal questions as real) | **Too Rigid** |
  | **Inference-Based** (Lying = Warranted False Inference) | **Med** (Requires context) | **Med** (Needs examples) | **Med** (Cultural variance) | **High** (Looks at uptake) | **Pass** (Flags misleading timing) | **Pass** (Flags power dynamics) | **Best Fit** (with caveats) |
  | **Intention-Based** (Lying = Intent to Deceive) | **Low** (Cannot audit mind) | **Low** (Abstract) | **High** (Universal) | **Med** (Focuses on speaker) | **Pass** (If intent proven) | **Fail** (Hard to prove intent) | **Admin Dead** |
  | **Trust/Relationship** (Lying = Betrayal of Role) | **Med** (Role expectations) | **High** (Mission aligned) | **Low** (Varies by culture) | **High** (Relational) | **Pass** (Betrays trust) | **Pass** (Abuses power) | **Strong Contender** |
  | **Flat Consequentialism** (Lying = Expected Harm) | **Med** (Harm audit) | **High** (Outcome focused) | **Med** (Disagreement on harm) | **High** (Case by case) | **Pass** (Harm is same) | **Pass** (Harm is same) | **Risk of Defensive Med** |

  **Recommendation:** Adopt a hybrid of **Inference-Based** and **Trust-Based**.
  *   *Rule:* "Clinicians must not assert falsehoods, nor make true statements intended to generate false inferences regarding care options."
  *   *Audit Standard:* "Review will assess whether a reasonable patient in that context would have retained the option to make a different informed choice." (This imports your Option-Space view but frames it as a 'reasonable patient' legal standard, which is auditable).
