      *   The problem with SLE is defining $E$. Is $E$ "Someone observes X" or "*I* observe X"?
      *   SSA: Treat "I" as a random sample from *actual* observers. $P(I|H) \propto 1/N_{actual}$.
      *   SIA: Treat "I" as a random sample from *possible* observers. $P(I|H) \propto N_{possible}$.
      *   The "Prior Disagreement" trap: Often, SIA looks like it just puts a prior on the number of observers. The lecture must show that the *likelihood* term changes, not just the prior.

