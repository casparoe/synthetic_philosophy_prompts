          *   Colony: $N=10$, $k=10$ (match). Ratio = 1.
          *   Civilization: $N=10^6$, $k=10^3$ (match). Ratio = $10^{-3}$.
          *   SSA Likelihood: Proportional to fraction of observers with evidence ($k/N$).
              *   Colony: $10/10 = 1$.
              *   Civil: $1000/10^6 = 1/1000$.
              *   SSA favors Colony heavily.
          *   SIA Likelihood/Prior adjustment: Proportional to number of observers with evidence ($k$). (Depending on formulation, SIA often weights by $N$, then conditions on evidence).
