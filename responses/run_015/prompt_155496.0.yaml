answer: |-
  ### Lecture Plan: Self-Locating Evidence in Astrophysics

  #### I. Component Order and Dependencies

  **1. The Bayesian Baseline (0–5 mins)**
  *   **Content:** Review $P(H|E) \propto P(E|H)P(H)$. Establish that $E$ is typically non-indexical (e.g., "Spectrum shows redshift $z$").
  *   **Dependency:** None. This is the common ground.

  **2. The Indexical Gap (5–10 mins)**
  *   **Content:** Introduce evidence that contains "I" or "here" or "now." Show that $P(\text{I observe } E | H)$ is undefined in standard Bayes without a rule for sampling observers.
  *   **Dependency:** Requires the Baseline to show what is missing.

  **3. The Carrying Case Introduction (10–15 mins)**
  *   **Content:** Present the **Colony vs. Civilization** hypotheses (details below). Define the evidence: "I am an observer with data $D$."
  *   **Dependency:** Requires the Indexical Gap to motivate why we need a new rule.

  **4. Entry of SSA and SIA (15–20 mins)**
  *   **Content:** Define SSA (sample from actual observers) and SIA (sample from possible observers).
  *   **Critical Dependency:** This must enter **after** the Carrying Case is defined but **before** the posterior is calculated.
  *   **The "Prior Disagreement" Boundary:** You must explicitly demonstrate that the dispute stops looking like a prior disagreement **at the calculation of the Likelihood Ratio**.
      *   *Why:* If all observers had the same evidence, SIA could be absorbed into a prior on $H$ (weighting by $N$). In your Carrying Case, where evidence is partial, SIA and SSA produce different *likelihood functions* for the indexical evidence. SSA weights by the *fraction* of observers with evidence; SIA weights by the *absolute number* of observers with evidence. This structural difference in the likelihood term proves it is not merely a prior dispute.

  **5. Calculation and Divergence (20–30 mins)**
  *   **Content:** Walk through the math. Show SSA favoring Colony (high frequency of evidence) and SIA favoring Civilization (high absolute count of evidence-bearers).
  *   **Dependency:** Requires SSA/SIA definitions to be active.

  **6. Misconception Defusal (30–40 mins)**
  *   **Content:** Address the specific misconceptions (see Map below) as they naturally arise from the calculation.
  *   **Dependency:** Requires the Divergence to be visible so students see *why* the misconception is wrong.

  **7. Closing Question and Refusal (40–45 mins)**
  *   **Content:** The diagnostic question and the boundary of the lecture.
  *   **Dependency:** Requires all previous components to ensure the question is understood.

  ---

  #### II. The Carrying Case: Evaluation and Criteria

  **Verdict:** **Build on this case.** It is superior to the standard "Presumptuous Philosopher" because it decouples *population size* from *evidence frequency*.

  **Why it works:**
  In the standard Presumptuous Philosopher, the larger world always has more observers with your evidence. Students dismiss SIA as "believing in crowded worlds." In your variant:
  *   **Colony:** $N=10$, $N_{match}=10$. (Frequency = 100%).
  *   **Civilization:** $N=1,000,000$, $N_{match}=1,000$. (Frequency = 0.1%).
  *   **SSA** favors Colony (you are more likely to be a match in a small pool where everyone matches).
  *   **SIA** favors Civilization (there are 100x more total matches, so "I am a match" is more likely to occur in this world).

  **Criteria for a Carrying Example (What to Contain/Omit):**
  *   **Contain:** A clear distinction between $N$ (total observers) and $k$ (obsersvers with your specific evidence). The ratio $k/N$ must differ between hypotheses.
  *   **Contain:** Physically neutral descriptions. Avoid "Doomsday" or "Extinction" framing which triggers existential anxiety rather than Bayesian reasoning.
  *   **Omit:** Complex reference class debates (e.g., "Do chimps count?"). Stipulate the reference class clearly at the start (e.g., "Observers capable of recording data $D$") and forbid challenging it during the calculation phase.
  *   **Omit:** Moral weight. Do not imply one outcome is "better."

  **Recommendation:** Simplify the numbers for mental math during the lecture.
  *   **Colony:** 10 Total, 10 Match.
  *   **Civilization:** 1,000 Total, 10 Match.
  *   This makes the SSA likelihood ratio 100:1 (Colony) and SIA likelihood ratio 1:1 (Tie on matches), or adjust to make SIA favor Civil.
  *   *Better for divergence:* **Colony:** 10 Total, 10 Match. **Civil:** 10,000 Total, 100 Match.
      *   SSA Likelihood (Colony/Civil): $(10/10) / (100/10000) = 100$.
      *   SIA Likelihood (Colony/Civil): $10 / 100 = 0.1$ (Favors Civil 10:1).
      *   This creates a massive, undeniable conflict.

  ---

  #### III. The Misconception Map

  These misconceptions will form in a specific sequence. You must defuse them in this order, or later defusals will fail.

  **1. "This is only a choice of prior, so there is nothing to argue about."**
  *   **When it forms:** Minute 15, immediately upon introducing SIA.
  *   **Why:** Astrophysicists are trained to absorb normalization constants into the prior. They will view SIA's $N$-weighting as just a prior on hypothesis complexity.
  *   **How to Defuse:** At the **Calculation and Divergence** stage. Show that even if you fix the *objective* prior $P(H)$ to be equal, the *posterior* differs. Explain that SIA modifies the probability of *existence* (or the prior weight of the world), while SSA modifies the probability of *sampling*. In the partial-evidence case (your Carrying Case), they change the **Likelihood Ratio**, not just the Prior Odds. A prior shift cannot reconcile a likelihood ratio of 100:1 vs 1:10.

  **2. "SIA just helps itself to the conclusion that crowded worlds are likely."**
  *   **When it forms:** Minute 20, when SIA favors the Civilization hypothesis.
  *   **Why:** It looks like a penalty for small universes.
  *   **How to Defuse:** Immediately after Defusal 1. Point out that SIA favors Civilization *only because there are more observers with your specific data*, not merely because there are more observers. If you add 9,000 observers to Civilization who *do not* have your data, SIA's probability for Civilization **does not change** (because the count of *matchers* is constant), whereas SSA's probability for Civilization **drops** (because the fraction of matchers drops). This proves SIA is not just "liking crowds"; it is tracking the absolute probability of your existence.

  **3. "SSA implies you should expect to be mediocre in every respect."**
  *   **When it forms:** Minute 25, when SSA favors the Colony (where you are a "typical" observer).
  *   **Why:** They will confuse "typical in reference class" with "typical in all properties."
  *   **How to Defuse:** During the **Misconception Defusal** block. Clarify that SSA only demands you be typical *with respect to the sampling method*. If the reference class is "observers with data $D$," SSA says nothing about your height, wealth, or location, only that you are a random sample of *that specific group*.

  **4. "The Reference Class is subjective, so the result is arbitrary."**
  *   **When it forms:** Minute 35, as a last-ditch effort to resolve the tension.
  *   **Why:** If the class changes, the probabilities change.
  *   **How to Defuse:** Acknowledge this is the hardest open problem (the "Reference Class Problem"), but insist that **even holding the Reference Class fixed**, SSA and SIA diverge. The lecture is about the *assumptions*, not the class definition.

  ---

  #### IV. Closing

  **The Diagnostic Question**
  Put this to them to verify understanding. The correct answer must depend on the assumption, not just the head count.

  > "In the Civilization hypothesis, suppose we discover that the 9,900 observers *without* our data are physically incapable of ever obtaining it (e.g., they live in a radiation zone), whereas in the Colony hypothesis, all observers *could* have obtained it but simply did. Does this new information change the posterior probability of the Civilization hypothesis under SIA? Does it change it under SSA?"

  *   **Correct Answer:**
      *   **SIA:** No change. (SIA cares about the absolute number of observers *with* the evidence. The status of those without it is irrelevant to the likelihood of "I have evidence".)
      *   **SSA:** Yes, significant change. (SSA cares about the *fraction*. If the non-matching observers are removed from the reference class because they are incapable, the fraction of matchers in Civilization rises, updating the probability.)

  **The Refusal**
  You must openly refuse to adjudicate one thing to maintain credibility and scope.

  > "I will not tell you which assumption is **true**. SSA and SIA are normative rules for reasoning, not empirical facts discoverable by telescope. Choosing between them is a philosophical commitment about how to weigh your own existence against the population of the universe. My goal is to ensure you know which commitment you are making when you apply Bayes' theorem to cosmological data."
