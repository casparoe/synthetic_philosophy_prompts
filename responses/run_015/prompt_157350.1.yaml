answer: |-
  Welcome, everyone. Please, grab a seat, grab some coffee.

  Looking around this room, I see a bit of a divide. On one side, we have people who can derive a Lorentz transformation on a napkin. On the other, we have people who know exactly what it feels like when a patient's sense of future collapses under grief. And right there in the middle, smiling at us, is the reason we're all here—our advisor, on the occasion of her retirement.

  I wanted to start with a thought that lives in the gap between your two fields. There's a famous argument in physics about simultaneity. It suggests that because motion changes what counts as "now," an observer far away from us, moving in a certain direction, might have a "present moment" that includes events we haven't experienced yet. Our future is their now.

  Now, for the physicists here, you know this doesn't mean we're robots in a pre-recorded movie. It doesn't mean agency is an illusion. But it does suggest something profound about structure: that past, present, and future might all be equally real coordinates on a four-dimensional map.

  I bring this up because I think it's the perfect bridge for this workshop, and for today.

  To the psychologists: if time is a landscape like this, it doesn't make your work less real. It makes it more navigational. Grief isn't a denial of reality; it's the painful process of reorienting yourself to a different coordinate on the map. Anticipation isn't a trick; it's how we project our path forward through the topology. The map exists all at once, yes, but the walking is still ours to do. The tension between "what is" and "what feels like it is" is exactly where human experience lives.

  And to the physicists: this room is a reminder that coordinates don't tell the whole story. You can label the axes, but you can't calculate the weight of a moment.

  Which brings me to our advisor. In this four-dimensional picture, retirement isn't an end. It's not a fade to black. It's just a coordinate. It's a bend in the worldline where the trajectory changes direction. We are here to honor the shape of the path she's traced so far—a massive, extended object in spacetime that has supported all of us along the way.

  So, as we kick off these discussions, let's try to hold both views. Let's respect the geometry of time, but let's also respect the experience of traveling through it. Let's talk about how we inhabit these coordinates without being trapped by them.

  Thank you for being here, thank you for the work you do, and most of all, thank you to our advisor for showing us how to navigate this field with grace. Let's get started.
