      *   *Diachronic Issue:* If she updates to 1/3 on Monday, what does she believe on Tuesday (if Tails)? She can't remember Monday. So her credence function isn't a simple conditionalization of her Sunday function. It violates "Reflection Principle" (her future self doesn't agree with current self). This is the cost of accepting self-locating beliefs.

