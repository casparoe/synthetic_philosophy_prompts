      *   **Anderson:** Nations are "imagined communities" because members will never know most of their fellow-members, yet in the minds of each lives the image of their communion. *Key point:* The "imagined" nature is the *condition of possibility* for the nation, not a disqualifier. It's about cognitive style, not falsehood.
      *   **The Tension/Intersection:** Hobsbawm focuses on the *manufacture* of the past (top-down engineering). Anderson focuses on the *psychological mode* of belonging (horizontal comradeship).
      *   **The Morvania Scenario:** Morvania tries to use Hobsbawm (it's invented/fake) to negate Anderson (therefore the imagined community is invalid). The absurdity lies in thinking that "invented" means "illegitimate," whereas both theorists argue "invented" is basically how *all* nations work.

