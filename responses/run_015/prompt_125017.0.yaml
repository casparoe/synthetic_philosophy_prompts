      *   **Specific Interpretation:** Malthus isn't just predicting doom; he's positing a *homeostatic mechanism* (productivity gains $\rightarrow$ population growth, not wage gains). The Demographic Transition (DT) disabled this mechanism by reversing the income-fertility relation.
