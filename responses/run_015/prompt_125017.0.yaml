          3.  Fact 2 (Demographic Transition): Malthus's response (Moral Restraint/Q-Q trade-off), Assessment (Ad hoc rescue/Theory emptying). **(Crucial Section)**
          4.  Fact 3 (Growth Rate Decline): Malthus's response (Preventive Check globalized), Assessment (Consistent).
          5.  Neo-Malthusian Constraints (Waste): Briefly address as requested.
