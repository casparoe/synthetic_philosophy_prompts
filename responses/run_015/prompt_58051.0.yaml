      *   Rules exist within language games.
      *   "Correctness" is determined by the *community* and the *context* (the game being played), not by an abstract essence.
      *   The user's error is conflating "no essential definition" with "no rules."
      *   The user's error is also ignoring the *purpose* of the language game. If the use doesn't facilitate the activity, it's a mistake.

  4.  **Formulate the Critique (Step-by-Step):**
      *   **Validate:** Acknowledge what they got right (essence vs. resemblance). This builds confidence.
      *   **Pinpoint the Flaw:** The leap from "no essence" to "no mistakes."
      *   **Explain the Correction:**
          1.  *Rules of the Game:* Language games have rules, just like actual games (chess, soccer). You can make a move that isn't "chess."
          2.  *Context/Usage:* Meaning depends on the specific context. Using "hard" (physical) to describe a "math problem" works because of a specific metaphorical bridge accepted in English. Using "hard" to mean "blue" would fail.
          3.  *Communicative Success:* If the listener doesn't understand, the move failed.
      *   **Address the Specific Example:** The "hard" examples are actually *good* examples of family resemblance, but they don't prove that *mistakes* are impossible. They prove that *different* uses are possible.
      *   **Suggest a Nuanced Thesis:** Instead of "nothing is wrong," argue "wrongness is contextual, not essential."

