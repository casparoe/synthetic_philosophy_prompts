      *Wait, check (4) again:* "trained solely on pairwise inter-letter consistency constraints, with no... explicit category rules". If there are no category rules, how does it know which letters to pair? It implies the system knows it's making an alphabet, but doesn't know what an 'a' *is*. It relies on style transfer. This supports (2) and (3). It contradicts (1) because (1) requires specific topological rules for identity, which (4) explicitly excludes ("no explicit category rules").

