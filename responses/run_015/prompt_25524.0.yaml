prompt: |-
  ok so i keep running into simpson's paradox in the wild — not the textbook examples everyone already knows (kidney stones, berkeley admissions, whatever) but messier cases where the "right" way to slice the data isn't obvious and there's no rct to fall back on. and every discussion i read eventually says something like "well you need a causal model" which, sure, but what does that actually commit me to? before i go deep into pearl or rubin or whoever, i want the spec: what would an adequate theory of how to handle simpson's-reversal cases actually have to deliver?

  so write me the desiderata list. what cases must it get right, what distinctions can't it collapse, what formal constraints (from probability, decision theory, whatever) does it have to respect? for each one, give the motivating example or argument — i want to know what breaks if you drop it, not just that it's on the list.

  the thing i'm really after: are there desiderata on this list that can't be jointly satisfied? like, is there a tension between "always give a determinate answer about which level of aggregation is correct" and "don't give wrong answers when you lack causal info"? or between respecting the sure-thing principle and respecting whatever it is that makes the kidney-stone example go the way it does? if some subset is mutually unsatisfiable, that's the result i most want to see spelled out — i half-suspect the list itself is the contribution, not any particular theory that tries to meet it.

  optional: quick scorecard for pearl's scm framework, the potential-outcomes camp, and the "just report all the stratifications and let the reader decide" approach. but the weight should be on the criteria themselves — i can do the scoring once i know what the criteria are, and i'd rather not have the scoring eat up space that should go to motivating why each desideratum actually matters.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Simpson's Paradox (SP) in messy, real-world observational data (not textbook cases).
      *   **Problem:** Standard advice is "build a causal model," but the user wants to know *what that actually commits them to* before diving into Pearl/Rubin. They want the *specification* (desiderata) for an adequate theory of SP resolution.
      *   **Core Task:** Write a list of desiderata (criteria) that a theory of SP must satisfy.
      *   **Requirements for Desiderata:**
          *   Must specify cases it gets right.
          *   Must specify distinctions it can't collapse.
          *   Must specify formal constraints (probability, decision theory).
          *   *Crucially:* For each, explain *what breaks* if dropped (motivating example/argument).
      *   **Key Question:** Are there mutually unsatisfiable desiderata? (Impossibility results/tensions).
      *   **Optional:** Scorecard for Pearl (SCM), Rubin (PO), and "Report All" approaches (but keep this brief).
      *   **Tone:** Technical, philosophical, rigorous, skeptical of hand-waving.

  2.  **Deconstruct Simpson's Paradox:**
      *   What is it really? It's a reversal of an association ($P(Y|X) > P(Y|\neg X)$) when conditioning on a third variable $Z$ ($P(Y|X, Z) < P(Y|\neg X, Z)$ for all $Z$).
      *   Why does it matter? Because it implies that acting on the aggregate data might lead to worse outcomes than acting on the stratified data (or vice versa), depending on the causal structure.
      *   The core tension: Association vs. Causation. Aggregation vs. Stratification.

  3.  **Brainstorming Desiderata:**
      *   *D1: Consistency with Probability.* Can't violate laws of prob.
      *   *D2: Action-Guidance.* If I intervene, what happens? (Sure-Thing Principle).
      *   *D3: Non-Arbitrariness.* Can't just pick the split that favors my hypothesis.
      *   *D4: Causal Neutrality (initially).* Should work even if we don't know the full DAG yet? (Wait, this is the tension).
      *   *D5: Stability/Robustness.* Small changes in data shouldn't flip the recommendation wildly.
      *   *D6: Collapsibility.* When is it safe to ignore $Z$?
      *   *D7: Decision-Theoretic Coherence.* Must align with expected utility maximization.

  4.  **Refining the Desiderata (Focusing on "What Breaks"):**

      *   *Desideratum 1: The Sure-Thing Principle (STP) Compliance.*
          *   *Idea:* If treatment is better for men and better for women, it should be better for the population.
          *   *Break:* If violated, rational agents can be Dutch-booked or make dominated choices.
          *   *Nuance:* STP applies to *causal* effects, not associative. The theory must distinguish them.

      *   *Desideratum 2: Non-Spurious Reversal Identification.*
          *   *Idea:* Must distinguish between a "real" reversal (confounding) and a "mathematical" reversal (collider bias/selection).
          *   *Break:* If you adjust for a collider, you induce bias. If you don't adjust for a confounder, you have bias. The theory must tell you which $Z$ is which.

      *   *Desideratum 3: Decision-Theoretic Invariance.*
          *   *Idea:* The recommendation shouldn't depend on how the data is labeled or partitioned if the underlying causal structure is identical.
          *   *Break:* If the answer changes based on arbitrary binning of a continuous variable, the theory is unstable.

      *   *Desideratum 4: Causal Ignorance Tolerance (The "Wild" Constraint).*
          *   *Idea:* In the wild, we don't have the true DAG. The theory shouldn't demand omniscience.
          *   *Break:* If the theory says "You can't decide without the true DAG," it's useless for the user's specific problem (messy observational data).

      *   *Desideratum 5: Aggregation Consistency.*
          *   *Idea:* If $Z$ is irrelevant to the mechanism, aggregating shouldn't hide the effect.
          *   *Break:* If you aggregate over a mediator, you block the path.

  5.  **Identifying the Tension (The "Impossibility" Result):**
      *   This is the crux of the user's request.
      *   *Tension:* Between **D2 (Causal Specificity)** and **D4 (Causal Ignorance Tolerance)**.
      *   *Argument:* To resolve SP correctly (i.e., know whether to aggregate or stratify), you *must* know the causal role of $Z$ (Confounder vs. Mediator vs. Collider).
      *   *Constraint:* Observational data alone (probabilities) cannot distinguish these roles (Observational Equivalence).
      *   *Conclusion:* No theory based *only* on statistical data can satisfy the requirement to "always give the right causal answer." You *must* import causal assumptions.
      *   *Second Tension:* **STP vs. Associational Reversal.** STP holds for causal effects, not associations. A theory that tries to apply STP to associations will fail.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the frustration. SP isn't a paradox of math, it's a paradox of interpretation.
      *   *The Desiderata List:*
          1.  **D1: Decision-Theoretic Coherence (The "Action" Test).** Must align with EUT. If you prefer A to B in every subpopulation, you shouldn't prefer B to A in total *if* the subpopulations are causally relevant.
          2.  **D2: The Confounder/Mediator/Collider Distinction.** Must not treat all $Z$ equally. Adjusting for a mediator biases the total effect. Adjusting for a collider induces bias.
          3.  **D3: Observational Non-Identifiability Acknowledgement.** Must admit when data isn't enough.
          4.  **D4: Partition Stability.** Results shouldn't hinge on arbitrary cut-points of continuous covariates.
          5.  **D5: Reversal Diagnosis.** Must explain *why* the reversal happened (weights vs. rates).

      *   *The Impossibility Theorem (The "Meat"):*
          *   Show that D1 (Action Guidance) + D2 (Correct Causal Adjustment) + D3 (Purely Data-Driven) are inconsistent.
          *   Reference the "Observational Equivalence" of DAGs.
          *   Conclusion: You cannot have a purely statistical theory of SP resolution. You *must* commit to causal assumptions.

      *   *Scorecard:*
          *   Pearl: Explicit about assumptions. Solves D2, fails D3 (admits it).
          *   Rubin: Focuses on design/ignorability. Good for D1, struggles with D2 (post-treatment bias).
          *   "Report All": Satisfies D3, fails D1 (no guidance).

  7.  **Review against Constraints:**
      *   Did I explain *what breaks*? Yes (Dutch booking, bias induction, paralysis).
      *   Did I address the "tension"? Yes (The Identifiability Gap).
      *   Is the tone right? Yes, rigorous and direct.
      *   Did I avoid textbook examples? I'll use generic $X, Y, Z$ or abstract scenarios to keep it general, referencing the "wild" nature.

  8.  **Final Polish:**
      *   Make sure the distinction between *associational* SP and *causal* SP is clear.
      *   Ensure the "Sure-Thing Principle" is correctly attributed (Savage vs. Pearl's causal version).
      *   Refine the "Impossibility" section to be punchy. It's not that the criteria are logically contradictory in a vacuum, but that they cannot be jointly satisfied by a *statistical* procedure alone.

      *(Self-Correction during drafting)*: I need to be careful not to say "STP is violated." STP is a normative principle. The paradox arises when people *expect* STP to hold for associations. The desideratum should be that the theory tells you *when* STP applies.
      *Revised Desideratum:* **Normative/Descriptive Alignment.** The theory must specify when the Sure-Thing Principle is normatively binding versus when it is descriptively inapplicable.

      *Refining the "Impossibility":* It's not that the desiderata are inconsistent, but that **Statistical Sufficiency** is inconsistent with **Causal Resolution**. I will frame it as a "Trilemma."

  9.  **Final Output Structure:**
      *   Intro: Reframing SP as a causal identification problem.
      *   Section 1: The Desiderata (5 key points with "What Breaks").
      *   Section 2: The Incompatibility Theorem (The Trilemma).
      *   Section 3: Brief Scorecard.
      *   Conclusion.

  10. (Final check of the prompt requirements): "what would an adequate theory... actually have to deliver?" "write me the desiderata list." "are there desiderata on this list that can't be jointly satisfied?" "optional: quick scorecard."
      *   Okay, I will prioritize the Desiderata and the Tension.

      *(Self-Correction on "Wild" cases)*: The user mentioned "messier cases where the right way to slice isn't obvious." I should emphasize the **Variable Selection** problem. It's not just "to adjust or not," it's "which of these 50 covariates do I adjust for?" This adds to the impossibility result (Curse of Dimensionality + Causal Ambiguity).

