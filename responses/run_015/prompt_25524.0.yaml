answer: |-
  This is the right question to ask. Simpson's Paradox (SP) is not a paradox of probability theory; the math is consistent. It is a paradox of *interpretation* and *action*. The confusion arises because we conflate seeing (conditional probability) with doing (intervention).

  If you want a specification for a theory that resolves SP in messy observational data, you are asking for a theory of **causal identification under ambiguity**.

  Here is the desiderata list for an adequate theory of Simpson's Reversal, followed by the incompatibility result you suspected.

  ---

  ### Part 1: The Desiderata Specification

  An adequate theory must satisfy the following five constraints. For each, I specify what breaks if the constraint is dropped.

  #### 1. Decision-Theoretic Coherence (The Action Test)
  **Requirement:** The resolution of the paradox must align with Expected Utility Theory (EUT) under intervention. If the theory recommends stratifying on $Z$, it must be because $P(Y | do(X), Z)$ yields higher expected utility than $P(Y | do(X))$.
  **What breaks if dropped:** **Dutch Bookability.**
  If a theory recommends a policy based on aggregate data ($X \to Y$) while the stratified data shows the reverse ($X \to Y | Z$) for all $Z$, and you act on the aggregate, you can be pumped for money.
  *Example:* You pay to implement a policy based on the aggregate trend. Then, knowing the stratification, I offer you a side bet on each subpopulation where you lose money in every stratum. You lose globally despite winning locally, or vice versa. A theory that doesn't map to $do(\cdot)$ operators allows dominated strategies.

  #### 2. The Confounder/Mediator/Collider Distinction (The Adjustment Criterion)
  **Requirement:** The theory must distinguish between $Z$ as a common cause (confounder), $Z$ as a mechanism (mediator), and $Z$ as a common effect (collider). It cannot treat all third variables as "covariates to be controlled."
  **What breaks if dropped:** **Bias Induction.**
  *   **If you adjust for a Mediator:** You block the causal path. You estimate the *direct* effect when you wanted the *total* effect. In policy, this leads to underestimating the value of an intervention that works *through* $Z$.
  *   **If you adjust for a Collider:** You open a non-causal path (selection bias). You induce a correlation where none exists.
  *   *Wild Case:* In high-dimensional data, many variables are colliders (e.g., "being in the dataset" is often a collider). A theory that says "control for everything observable" creates bias out of thin air.

  #### 3. Observational Non-Identifiability Acknowledgement (The Humility Constraint)
  **Requirement:** The theory must explicitly flag when the correct stratification is **not identifiable** from the joint distribution $P(X, Y, Z)$ alone. It cannot output a determinate causal recommendation without causal premises.
  **What breaks if dropped:** **Spurious Certainty.**
  There are distinct causal DAGs that produce identical joint probability distributions (observational equivalence).
  *Example:* $X \to Z \to Y$ and $X \leftarrow Z \to Y$ can sometimes be statistically indistinguishable without temporal or structural assumptions. If a theory claims to resolve SP using only statistical tests (e.g., "check if association flips"), it is lying. It will give a confident answer that is causally wrong 50% of the time in equivalent models.

  #### 4. Partition Stability (The Continuity Constraint)
  **Requirement:** The recommendation (aggregate vs. stratify) should not flip wildly due to arbitrary binning of continuous variables or minor perturbations in the data, unless the causal structure itself changes.
  **What breaks if dropped:** **P-Hacking / Garden of Forking Paths.**
  In messy data, $Z$ is often continuous (e.g., income, severity). If the theory says "stratify if the reversal is significant," a researcher can bin $Z$ at different quantiles until the reversal appears or disappears.
  *Failure Mode:* A theory that relies on the *magnitude* of the reversal rather than the *structural role* of $Z$ allows the analyst to choose the aggregation level that supports their desired conclusion.

  #### 5. Reversal Diagnosis (The Weight-vs-Rate Constraint)
  **Requirement:** The theory must decompose the reversal into "weights" (sample size differences across strata) and "rates" (effect sizes within strata). It must identify whether the aggregate is driven by a large, low-risk group masking a small, high-risk group.
  **What breaks if dropped:** **Misdiagnosis of Mechanism.**
  Sometimes SP is purely arithmetic (weighted averages), sometimes it is causal.
  *Example:* If the reversal is due entirely to unequal weights (e.g., Treatment A is mostly given to severe cases), the "fix" is reweighting (standardization). If the reversal is due to effect modification, the "fix" is personalized policy. A theory that treats these as the same phenomenon will recommend the wrong intervention (e.g., randomizing allocation vs. tailoring treatment).

  ---

  ### Part 2: The Incompatibility Result (The Trilemma)

  You asked if there are desiderata that cannot be jointly satisfied. **Yes.**

  There is a fundamental tension between **Desideratum 1 (Decision Coherence)**, **Desideratum 2 (Correct Adjustment)**, and **Desideratum 3 (Observational Sufficiency)**.

  **The Trilemma:**
  No theory can simultaneously satisfy:
  1.  **Causal Correctness:** Always identify whether to aggregate or stratify to recover the causal effect.
  2.  **Statistical Sufficiency:** Rely only on the observed joint distribution $P(V)$ without external causal assumptions.
  3.  **Determinacy:** Always provide a definite recommendation (no "it depends").

  **Why they are incompatible:**
  To satisfy (1), you must know if $Z$ is a confounder or a collider (Desid 2).
  To know if $Z$ is a confounder or a collider, you need causal information (arrows, timing, mechanisms) that is not contained in $P(V)$.
  Therefore, if you restrict yourself to (2) (Statistical Sufficiency), you cannot guarantee (1) (Causal Correctness).
  If you demand (1) and (2), you must violate (3) (Determinacy) and admit "I cannot tell you."

  **The Consequence:**
  Any framework that claims to resolve Simpson's Paradox using *only* statistical criteria (e.g., "always stratify," "never stratify," or "stratify if the association flips") is mathematically guaranteed to fail on some causal structures.
  *   **"Always Stratify":** Fails when $Z$ is a mediator (blocks total effect) or collider (induces bias).
  *   **"Never Stratify":** Fails when $Z$ is a confounder (SP is real, aggregate is biased).
  *   **"Test for Reversal":** Fails because reversals can happen in both confounding and collider scenarios (though less common in colliders, it's possible with selection bias).

  **The "Wild Data" Implication:**
  In the messy cases you describe, you usually lack the causal graph. This means you **cannot** satisfy Desideratum 1 (Decision Coherence) with certainty. You are forced to trade **Certainty** for **Assumptions**. You must import causal priors (e.g., "Severity usually causes Treatment, not vice versa") to break the observational equivalence.

  ---

  ### Part 3: Scorecard

  Here is how the major frameworks score against the desiderata and the Trilemma.

  | Framework | D1: Decision Coherence | D2: Adj. Criterion | D3: Non-Identifiability | D4: Stability | D5: Diagnosis | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Pearl (SCM / DAGs)** | ✅ | ✅ | ✅ | ✅ | ✅ | **The Spec Compliant.** Explicitly admits D3. Forces you to draw the graph. If you don't know the graph, it refuses to give an answer (satisfies D3 by failing D1 conditionally). |
  | **Rubin (Potential Outcomes)** | ✅ | ⚠️ | ⚠️ | ✅ | ⚠️ | **Strong on D1, Weak on D2.** Focuses on "ignorability." Struggles to distinguish mediators from confounders without explicit modeling of the assignment mechanism. Can inadvertently adjust for post-treatment variables. |
  | **"Report All Stratifications"** | ❌ | ❌ | ✅ | ❌ | ✅ | **The Coward's Way.** Satisfies D3 (admits ignorance) but fails D1 (no guidance) and D4 (overwhelms user). In messy data with 20 covariates, $2^{20}$ tables are useless. |
  | **Purely Statistical Tests** | ❌ | ❌ | ❌ | ❌ | ⚠️ | **Dangerous.** Violates the Trilemma. Claims to solve D1 using only D2. Will give wrong answers on colliders/mediators. |

  ### Summary for your "Wild" Cases

  The spec you are looking for implies a hard truth: **There is no statistical solution to Simpson's Paradox.**

  If you want a theory that delivers a determinate answer on which level of aggregation is correct, you **must** commit to a causal model (DAG, structural equations, or strong ignorability assumptions).
  *   If you refuse to commit to a causal model, the only honest answer is "The data is insufficient to decide."
  *   If you commit to a causal model, you are no longer doing pure statistics; you are doing causal inference, and your results are only as good as your untestable assumptions.

  The tension you suspected is real: **"Always give a determinate answer"** and **"Don't give wrong answers when you lack causal info"** are mutually exclusive. You have to pick which one you are willing to violate. Pearl picks the former (requires assumptions); the "Report All" camp picks the latter (paralysis); the "Stats Only" camp violates both (confidence in error).
