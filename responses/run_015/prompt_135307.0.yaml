answer: |-
  ### Taxonomy of Social Construction Positions

  To determine your position on a specific kind (Race, Gender, or Money), answer the following nodes in order. The examples are built into the branches to force consistency across categories.

  #### Node 1: Ontological Dependence
  **Claim:** "If collective belief and participation in this category ceased tomorrow, the kind would cease to function."
  *   **Branch A (Yes):** It vanishes like **pounds sterling** losing value after abolition of belief. → *Go to Node 2.*
  *   **Branch B (No):** It persists like **racial categories** might, retaining social traction even after abolition of belief. → *Go to Node 3.*

  #### Node 2: Causal Power (For Belief-Dependent Kinds)
  **Claim:** "Membership in this kind can causally reshape biological or physical traits over generations."
  *   **Branch A (Yes):** It acts like **gendered healthcare access**, altering bodies over time despite being belief-dependent. → *Leaf: Unnamed Combination.*
  *   **Branch B (No):** It is biologically inert, like a **banknote** changing hands without altering DNA. → *Go to Node 4.*

  #### Node 3: Causal Power (For Belief-Independent Kinds)
  **Claim:** "Membership in this kind can causally reshape biological or physical traits over generations."
  *   **Branch A (Yes):** It acts like **gendered healthcare access** or stress-induced racial health disparities. → *Go to Node 4.*
  *   **Branch B (No):** It merely reflects pre-existing physical traits; biology determines the kind, not vice versa. → *Leaf: Biological Essentialist.*

  #### Node 4: Epistemic Status
  **Claim:** "Asking whether this kind is 'constructed' is an objective fact of the matter."
  *   **Branch A (Yes):** The framing is neutral; we can discover the construction mechanics objectively. → *Leaf: Interactionist / Feedback-loop view* (if from Node 3) OR *Leaf: Institutional Realist* (if from Node 2).
  *   **Branch B (No):** The framing itself is political; claiming construction is an intervention. → *Leaf: Strong Social Constructionist.*

  ***

  ### Leaf Definitions & Analysis

  1.  **Institutional Realist** (Node 1A → 2B → 4A)
      *   **Position:** The kind exists only because we agree it does (like money), but this is an objective fact, not a political move. It does not change biology.
      *   **Typical Mapping:** Money.

  2.  **Biological Essentialist** (Node 1B → 3B)
      *   **Position:** The kind persists without belief because it is grounded in physical reality. It does not reshape biology; biology creates the kind.
      *   **Typical Mapping:** Race (traditional view), Gender (traditional view).

  3.  **Interactionist / Feedback-loop view** (Node 1B → 3A → 4A)
      *   **Position:** The kind persists without belief and actively reshapes biology (feedback loops), but describing this is a neutral scientific endeavour.
      *   **Typical Mapping:** Race (modern epidemiological view), Gender (medical view).

  4.  **Strong Social Constructionist** (Node 1B → 3A → 4B)
      *   **Position:** The kind persists without belief and reshapes biology, but insisting on this distinction is itself a political act to dismantle power structures.
      *   **Typical Mapping:** Gender (critical theory), Race (critical race theory).

  5.  **Unnamed Combination** (Node 1A → 2A)
      *   **Position:** The kind vanishes without belief *yet* reshapes biology over generations.
      *   **Status:** **Incoherent.** If a category ceases to exist when belief stops, it lacks the temporal stability to drive generational biological change. You cannot have generational feedback loops on a thing that disappears when you look away.

  ***

  ### Consistency Check: Running the Three Kinds

  Use this to test if you are applying the same logic to Race, Gender, and Money.

  | Kind | Node 1 (Vanish?) | Node 2/3 (Reshape Biology?) | Node 4 (Political?) | Resulting Position |
  | :--- | :--- | :--- | :--- | :--- |
  | **Money** | Yes (like sterling) | No (inert) | No (objective) | Institutional Realist |
  | **Race** | No (persists) | Yes (health disparities) | No (objective) | Interactionist |
  | **Gender** | No (persists) | Yes (hormonal/social) | Yes (intervention) | Strong Social Constructionist |

  *If you answer 'Yes' to Node 1 for Race, but 'No' for Money, you are treating them as ontologically distinct. If you answer 'Yes' to Node 2 for Gender but 'No' for Race, you are treating them as causally distinct.*

  ***

  ### Limitations & Indistinguishable Leaves

  **Flagged Pair:** **Interactionist / Feedback-loop view** vs. **Strong Social Constructionist**.
  *   **Why:** Both occupy the same ontological space (Node 1B → 3A). They agree that the kind is real, persistent, and biologically active. The only split is Node 4 (whether the *framing* is political). In practice, many Interactionists accept the political utility of constructionism, and many Strong Constructionists accept the scientific data of feedback loops. The tree separates them based on *intent* rather than *ontology*, which makes them difficult to distinguish empirically.
