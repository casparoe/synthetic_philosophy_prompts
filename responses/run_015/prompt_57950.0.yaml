answer: |-
  **Setting:** *A quiet corner of the conference center lobby, late afternoon. Coffee cups sit on a low table between ELENA and MARCUS. Both are participants in the management seminar, though both hold PhDs in philosophy. The morning session on social ontology has just adjourned.*

  **Elena:** I have to say, Marcus, the custodian case you floated during the Q&A is doing a lot of heavy lifting. It strips away the artificiality of the textbook examples. No signed contracts, no verbal agreements, just Mara moving chairs and Luis running the scrubber. It feels like the paradigm of a "We-Intention." They are acting as a plural subject.

  **Marcus:** I'm glad you find it vivid, Elena, but I'm afraid I used it to illustrate the exact opposite. To my mind, Mara and Luis are the poster children for the reductionist account. You don't need a mysterious "We." You just need Mara intending to move the chairs *because* she believes Luis will scrub, and Luis intending to scrub *because* he believes Mara will move the chairs. Their intentions interlock. That's all the "jointness" there is.

  **Elena:** But that "because" is doing too much work if you treat it as merely causal. If Mara moves the chair solely to facilitate her *own* goal of finishing her section quickly, and Luis scrubs to finish *his* section, they are merely coordinating parallel actions. For it to be a genuine joint action, Mara must intend that *we* clean the atrium. She has to subscribe to the goal as a collective end, not just as a condition for her private success.

  **Marcus:** Why posit a new species of intention? It's ontologically expensive. Look at the mechanics. Mara adjusts her pace when Luis is delayed. That shows she is monitoring his actions and integrating them into her own planning. Bratman's sub-plan coordination is satisfied here. She intends the cleaning, he intends the cleaning, and they know the other intends it. The mesh is sufficient. If it walks like a team and quacks like a team, why insist there's a ghost in the machine called a "shared attitude"?

  **Elena:** Because the ghost explains the normativity. Consider the variant I proposed in my notes. Suppose Mara privately believes they are in a friendly competition to see who finishes their tasks fastest, while Luis believes they are cooperating to get the building ready. Outwardly, nothing changes. Mara still moves the chairs; Luis still scrubs. On your view, is this joint action?

  **Marcus:** Yes. The functional coordination is identical. The floor gets clean through interdependent actions. If the supervisor walks in, they see a team working. If Mara's internal narrative is "I'm beating Luis" rather than "We are cleaning," that's a psychological nuance, but it doesn't change the ontological status of the activity. They are still engaged in a shared pattern of behavior supported by mutual belief.

  **Elena:** I think that reveals the flaw in the reductionist view. If Mara thinks it's a competition, she does not intend that *we* clean the atrium. She intends that *she* win, and cleaning the atrium is just the byproduct. If Luis slows down, Mara might speed up to beat him, whereas if they truly shared a goal, she might slow down to help him. Since their commitments are different, there is no single "We" to hold the intention. You have two "I"s colliding productively, not a "We" acting.

  **Marcus:** But Elena, you're demanding access to a mental state that doesn't alter the outcome. If Mara's competitive drive makes her move the chairs *more* efficiently, does the joint action vanish because her motivation is spicier? I think you're conflating the *quality* of the cooperation with the *existence* of joint action. As long as they are mutually responsive to each other's intentions, it counts.

  **Elena:** It's not about efficiency; it's about the binding force. Let's test the breakdown case. Suppose Luis gets a phone call and stops scrubbing for ten minutes, just standing there. Mara sees this. On your view, what happens?

  **Marcus:** Simple. Mara's belief that "Luis is scrubbing" becomes false. Her intention was conditional: "I will move chairs *if* Luis scrubs." Since the condition fails, her intention dissolves. She stops moving chairs. The joint action dissolves because the interlocking beliefs are broken.

  **Elena:** And on my view, something richer happens. Mara feels *let down*. She doesn't just update a prediction; she perceives a violation of a commitment. Even without words, the routine established a normative expectation. When Luis stops, he isn't just changing the environment; he's opting out of the "We." That's why Mara might signal him or look annoyed. She's holding him accountable to *us*, not just noting that *he* has stopped.

  **Marcus:** But "accountability" can also be reduced. Mara expects Luis to continue because she knows he wants to finish his shift. If he stops, she predicts he might not finish. Her annoyance is pragmatic frustration, not a moralistic appeal to a plural subject. She's thinking, "Now my plan is ruined," not "You betrayed our team."

  **Elena:** I doubt the phenomenology matches that. If I'm working *with* someone, and they drop the ball, I don't just feel inconvenienced; I feel they failed *us*. But let's set the phenomenology aside. Let's talk about the manager. You're here for the management seminar, Marcus. If the supervisor comes in and sees the atrium clean, does it matter to them whether Mara and Luis had a "We-intention" or just interlocking "I-intentions"?

  **Marcus:** *[Smiles]* Finally, the practical turn. No, it shouldn't matter. If the floor is clean and the routine is robust, the supervisor praises the team. If the floor is dirty because Luis stopped, the supervisor blames the breakdown. The metaphysical underpinnings are invisible to the outcome.

  **Elena:** Exactly. And that's where I think we can find common ground, even if we disagree on the ontology. Whether you describe it as "interlocking individual intentions" or "shared collective commitment," the *criteria for evaluation* remain the same. The supervisor looks for reliability, mutual responsiveness, and outcome.

  **Marcus:** So, in the competition variant—where Mara thinks it's a race—if they get the job done, the supervisor praises them as a team. If Mara's competitive streak makes her hide the furniture so Luis can't find it, then the coordination breaks, and the supervisor intervenes. The label "joint action" doesn't change the management strategy.

  **Elena:** I agree. The disagreement between us is about what constitutes the *bond* between them, not how to assess their performance. If I'm the manager, I can't probe their metaphysical commitments. I can only observe the mutual responsiveness you described. But I would argue that by fostering a culture of "We," I make the bond more resilient to the breakdown cases. If they feel normative commitment, they are less likely to quit when the phone rings.

  **Marcus:** And I would argue that by aligning their individual incentives—making sure Luis knows Mara's speed helps him finish sooner—I achieve the same resilience without needing to invoke a collective mind. But yes, for the purpose of praise or blame, the distinction is operationally neutral. If the coordination holds, they are a team in the eyes of the firm. If it fractures, they are individuals who failed to coordinate.

  **Elena:** So we agree that the seminar attendees don't need to solve the Searle-Bratman debate to manage the cleaning crew?

  **Marcus:** They don't. They need to know that if Mara and Luis are adjusting to each other, they have a functional team. Whether that functionality is built on a "We" or a mesh of "I"s is a question for us, over coffee, not for the shift supervisor.

  **Elena:** Though I maintain that if the supervisor wants to *sustain* that teamwork, speaking the language of the "We" is more effective than speaking the language of individual incentives.

  **Marcus:** *[Laughing]* And I maintain that a well-structured incentive plan creates a "We" whether you name it or not. But on the question of blame?

  **Elena:** On the question of blame, the outcome rules. If the atrium is dirty, someone answerable must be found. Whether that answerability stems from a violated collective commitment or a failed individual prediction...

  **Marcus:** ...is irrelevant to the reprimand.

  **Elena:** Precisely. So, shall we return to the session? I believe the next module is on distributed cognition.

  **Marcus:** Lead the way. I'm curious to see if they'll try to reduce that to individual processing power as well.

  **Elena:** Somehow, Marcus, I suspect you'll find a way.
