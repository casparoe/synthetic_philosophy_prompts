        {
          "point_name": "Dogmatism Boundary",
          "marks": 4,
          "description": "Identifies the condition under which meta-steadfastness becomes dogmatic (e.g., immunity to higher-order scrutiny or circular justification)."
        }
      ],
      "grade_A_criteria": "An A answer synthesizes the five must-hit points into a coherent argument. It explicitly connects the regress objection to the risk of dogmatism, showing how meta-steadfastness solves one problem while potentially creating another. It nuances the role of Dr. B's analogical inference as a non-arbitrary justification.",
      "grade_B_criteria": "A B answer covers the five must-hit points but treats them as isolated checklist items. It may correctly define the terms but fails to integrate the regress objection with the dogmatism charge, or it treats meta-steadfastness as merely psychological stubbornness rather than a structural epistemic claim.",
