  **Lecture Supplement: Formalising the Stances**

  **To:** Advanced Seminar in Philosophy of Mind
  **From:** Professor of Philosophy
  **Subject:** Computational Analogues for Dennett's Stances and the Diagnostic Hypothesis

  **1. Formal Restatement of the Three Stances**

  In order to sharpen our understanding of the ontological commitments involved in predictive strategies, we shall translate Daniel Dennett's tripartite framework into the vocabulary of type theory and functional programming. This translation is not merely metaphorical; it is intended to stress-test the structural integrity of the claims regarding real patterns.

  **The Physical Stance**
  In this framework, the physical stance corresponds to the reduction of all system behaviour to **referential transparency and pure functions over a substrate**. Here, the system is viewed as a deterministic evaluation of expressions where every output is fully determined by the input and the underlying logic of the runtime environment. There are no side effects; every state transition is explicit. To predict the system from this stance is to perform a complete beta-reduction of the code. It requires total knowledge of the memory state and the instruction set. It is computationally expensive, often intractable, but it admits no error provided the substrate is noise-free. The ontology here is strictly the bits and the logic gates; there is no abstraction.

  **The Design Stance**
  The design stance maps onto **type signatures, monadic encapsulation of effects, and interface contracts**. We ignore the internal implementation of the functions (the physical substrate) and rely instead on the guarantee provided by the type signature. For instance, knowing a function has the signature `Int -> Int` allows us to predict the output type without knowing the algorithm. Furthermore, where side effects occur (input/output, state changes), they are encapsulated within monads. We rely on the contract that the monad preserves certain laws (associativity, identity) without inspecting the bound values. This stance assumes the system is constructed to fulfil a specification. Prediction relies on the stability of the interface rather than the mechanics of the execution.

  **The Intentional Stance**
  The intentional stance is modelled as **type inference over an agent model**, wherein beliefs and desires are attributed as **higher-order types**. Crucially, these types are not explicitly represented in the source code as data structures; rather, they are inferred constraints that make sense of the system's behaviour. We treat the agent as if it possesses a type context containing propositions (beliefs) and goals (desires). We predict behaviour by checking if the output is well-typed within this inferred context of rationality. The beliefs and desires are akin to implicit parameters or type class constraints that resolve during compilation (prediction) but are erased at runtime. They are not physical variables, yet they constrain the possible valid outputs of the system.

  **Real Patterns**
  Dennett's claim that intentional patterns are real, neither reducing to physical descriptions nor floating free of them, translates to the status of **types in a system with type erasure**. The types do not exist in the compiled binary (the physical substrate); you cannot find the "Int" in the memory register. However, the types are not merely fictional; they objectively constrain what the programme can do without crashing. A pattern is "real" if it supports lossless compression of the prediction logic. The intentional stance captures a pattern that is objectively present in the behaviour's structure, even if the vocabulary used to describe it (belief/desire) does not appear in the physical code.

  ***

  **2. Residue Report**

  Having executed this translation, we must now catalogue what is lost, what remains, and what is fundamentally incompatible between the philosophical framework and the computational analogue.

  **What Survives Intact**
  The hierarchy of predictive efficiency survives perfectly. The physical stance remains computationally prohibitive; the design stance offers a manageable abstraction; the intentional stance offers the highest level of compression for complex agents. The notion that higher stances depend on but are not reducible to lower stances is mirrored in the relationship between runtime values, type signatures, and inferred types. The idea that a pattern is "real" if it supports prediction is preserved in the notion that a type is valid if it successfully compiles behaviour against observed outputs.

  **What Is Distorted**
  The primary distortion lies in the **semantic content of belief-attribution**. In the functional programming analogue, type inference is a syntactic operation. It matches structures based on rules of consistency. In the philosophy of mind, attributing a belief involves *aboutness* or intentionality in the semantic sense—the belief is *about* something in the world. In the type theory model, "belief" is merely a constraint on output behaviour. The semantic content collapses into syntactic pattern-matching. We lose the normativity of rationality; in code, a type error is a violation of syntax, whereas in the intentional stance, irrationality is a violation of a normative ideal of reason, which allows for degrees of failure that syntax does not easily accommodate.

  **What Has No Counterpart**
  The most significant missing element is the **ontological status of patterns that are neither physical parts nor design specifications**. In functional programming, types are generally human-imposed annotations or compiler constructs. They are tools for the programmer, not necessarily features of the universe. Dennett argues that intentional patterns are mind-independent features of the world that exist regardless of whether an observer adopts the stance, provided the pattern is robust enough. In the computational model, if no compiler checks the types, the types effectively do not exist. The computational model struggles to capture the idea that the pattern is *out there* in the world, waiting to be detected, rather than being a lens imposed *upon* the world by the observer. The "realness" of the pattern in Dennett's sense implies an objective compression ratio inherent in nature, whereas in type theory, the "realness" is relative to the type system chosen by the engineer.

  ***

  **3. The Diagnostic Stance: Introduction and Evaluation**

  We now introduce a hypothetical fourth stance: **The Diagnostic Stance**.

  **Definition**
  Under the Diagnostic Stance, a system is treated not as designed for a purpose, nor as an intentional agent with beliefs, but as a mechanism producing **locally optimal outputs in response to an information-theoretic bottleneck**. The system is assumed to lack global coherence or teleology. Instead, it is viewed as a channel maximising fidelity under constraints of bandwidth and noise. We predict behaviour not by asking "What is its goal?" (Design) or "What does it believe?" (Intentional), but by asking "What is the most efficient compression of this signal given the noise profile?"

  **Evaluation Against Residues**
  Does this stance resolve the residues left by the functional programming translation?
  Regarding the **semantic distortion**, the Diagnostic Stance offers no relief. It remains purely syntactic and information-theoretic. It treats belief-like states as statistical correlations optimised for transmission, not as semantic content. Therefore, the problem of "aboutness" remains unresolved.
  Regarding the **ontological status**, the Diagnostic Stance shifts the ontology from "types" to "channel capacity". This is arguably more physicalist than the intentional stance. It suggests patterns are real insofar as they reflect physical constraints on information flow. This strengthens the claim that patterns are mind-independent (physics is mind-independent), but it weakens the claim that intentional patterns are *sui generis*. It suggests intentional patterns are merely a specific case of information-theoretic optimisation.

  **Replication of the Design Stance?**
  One must ask whether the Diagnostic Stance is merely the Design Stance under a different notation. The Design Stance assumes the system was built to function. The Diagnostic Stance assumes the system behaves *as if* optimised, without assuming a builder. However, in practice, treating a system as "optimising local output" is functionally identical to treating it as having a "goal" of minimising error. The mathematical formalism of utility maximisation (Intentional/Design) and information maximisation (Diagnostic) is often isomorphic. Thus, the Diagnostic Stance risks being a redescription of the Design Stance where the "designer" is replaced by "natural selection" or "physical constraint", but the predictive machinery remains teleological in structure.

  **Impact on Dennett's Claim**
  Finally, does this undermine Dennett's claim that the intentional stance captures genuinely distinct real patterns?
  If the Diagnostic Stance can predict the behaviour of systems that fail the Intentional Stance (e.g., broken agents, simple organisms, or neural nets) without attributing beliefs, it suggests that the "Intentional Pattern" is not a distinct ontological category. Instead, it appears as a special case of a broader class of "Optimisation Patterns".
  If intentional patterns are just optimisation patterns under a specific bottleneck (the need for rapid behavioural prediction), then they are not uniquely "real" in the way Dennett suggests. They become pragmatic fictions that work well for human-scale agents but dissolve under the Diagnostic lens into mere signal processing.
  However, a defender of Dennett might argue that the Diagnostic Stance fails to capture the *normative* aspect of intentionality. An agent can be irrational (violating optimisation) yet still be correctly interpreted via the Intentional Stance. The Diagnostic Stance predicts what the system *should* do to minimise error; the Intentional Stance predicts what the system *will* do given its specific, possibly flawed, rationality. Therefore, the Diagnostic Stance does not replace the Intentional Stance but rather complements it for sub-rational systems. Consequently, Dennett's claim survives: the Intentional Stance captures a pattern of *rational agency* that is distinct from mere *informational efficiency*, preserving its status as a unique real pattern.

  **Conclusion**
  The translation into type theory clarifies the structural relationships between the stances but obscures the semantic and normative dimensions essential to the philosophy of mind. The introduction of the Diagnostic Stance challenges the uniqueness of the Intentional Stance but ultimately fails to subsume it, as it cannot account for systematic irrationality. The residue of "meaning" and "normativity" remains stubbornly resistant to formalisation.
