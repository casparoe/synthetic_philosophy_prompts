prompt: |-
  I'm preparing a handout for a graduate seminar in philosophy of science on the old-evidence problem in Bayesian confirmation theory, and I need a decision tree—not a survey of named positions—that sorts substantive commitments about previously known evidence.

  Start with this shared case: an agent assigns credence 1 to E (e.g., Mercury's perihelion precession) and then learns that theory H entails E. From there, build a tree of at most six internal nodes, each node phrased as a concrete claim about the formal machinery or the case (for instance, whether evaluation requires the agent's actual E-conditional credence function, whether discovering H ⊃ E is itself an evidential update, or whether confirmation is purely synchronic), so that someone can navigate it without knowing view-labels in advance.

  The tree must reach these four leaves:
  (1) Old evidence is silent: the prior is already E-conditional, so no belief revision occurs.
  (2) The update is the entailment: recognizing H ⊃ E introduces genuinely new information, allowing E to support H.
  (3) There is an objective logical prior: evidential support is measured against an unconditional prior, independent of the agent's current conditioning state.
  (4) Confirmation is comparative and atemporal: old and new evidence stand in the same support relation, and the problem confuses belief dynamics with evidential structure.

  In addition, design and place a fifth, non-standard position that splits "propositional oldness" (E was already in the agent's evidence set) from "explanatory oldness" (the link between H and E was unknown) and assigns them different weights in the updating rule. Place it precisely on the tree, state the exact combination of answers that leads to it, and diagnose in one sentence whether that quadrant is genuinely unexplored, incoherent, or merely unattractive.

  Requirements: flag any pair of leaves your tree genuinely cannot separate; list any unoccupied combinations of answers in the logical space with a brief one-sentence diagnosis; avoid bibliographies, citations, or dependencies on specific author attributions; and keep the deliverable concise enough for a single handout page.
