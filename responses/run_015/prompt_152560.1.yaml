  # Decision Tree: Substantive Commitments on Old Evidence

  **Case:** Agent has credence $P(E)=1$. Agent learns $H \models E$.

  **Node 1:** Is confirmation defined by actual diachronic credence revision in the agent?
  *   **Yes** $\rightarrow$ Go to Node 2.
  *   **No** (Confirmation is a static support relation) $\rightarrow$ Go to Node 4.

  **Node 2:** Is conditioning restricted solely to empirical propositions about the world?
  *   **Yes** $\rightarrow$ **Leaf 1:** Old evidence is silent: the prior is already $E$-conditional, so no belief revision occurs.
  *   **No** (Logical facts can be inputs) $\rightarrow$ Go to Node 3.

  **Node 3:** Does learning a logical relation ($H \models E$) update credence identically to empirical discovery?
  *   **Yes** $\rightarrow$ **Leaf 2:** The update is the entailment: recognizing $H \supset E$ introduces genuinely new information, allowing $E$ to support $H$.
  *   **No** (Logical inputs receive distinct weight) $\rightarrow$ **Leaf 5 (Non-Standard):** Weighted Logical Update: Propositional oldness ($P(E)=1$) and explanatory oldness (unknown link) are split, assigning the logical update a discounted weight relative to empirical discovery.
      *   *Diagnosis:* Merely unattractive: requires ad hoc modification of conditionalization axioms without independent justification.

  **Node 4:** Is the baseline for support an agent-independent logical prior function?
  *   **Yes** $\rightarrow$ **Leaf 3:** There is an objective logical prior: evidential support is measured against an unconditional prior, independent of the agent's current conditioning state.
  *   **No** (Support is relative to agent's state) $\rightarrow$ **Leaf 4:** Confirmation is comparative and atemporal: old and new evidence stand in the same support relation, and the problem confuses belief dynamics with evidential structure.

  ***

  ### Logical Space Diagnostics

  **Unseparable Leaves:**
  *   None. The tree distinguishes all five positions by formal commitment regarding dynamics, input type, updating rules, and prior source.

  **Unoccupied Combinations:**
  *   **{Synchronic, Empirical Only}:** Incoherent, as synchronic views evaluate support relations, making restrictions on diachronic input irrelevant.
  *   **{Synchronic, Logical Weighted}:** Category error, as weighting schemes apply to belief dynamics, not static support structures.
  *   **{Diachronic, Objective Prior}:** Tension, as diachronic revision tracks subjective belief, while objective priors track logical relations independent of belief history.
