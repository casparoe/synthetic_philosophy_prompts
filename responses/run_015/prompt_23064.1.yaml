prompt: |-
  So my friends and I run this small podcast where we mostly just talk about whatever, but next week we're doing a more serious episode: our guest is a grad student who actually defends coherent extrapolated volition as the right way to figure out what an AI should do. I think it was Yudkowsky who put the idea forward — basically you ask what a fully coherent, fully informed version of you would want, except the idealized self still has to be you, just more thoughtful and better at understanding its own values. I've been reading about it for my senior project on AI ethics and I keep getting stuck in the same spots, so I don't want the interview to just be him restating the view.

  Can you write me eight to ten interview questions, each with a follow-up keyed to the answer he's most likely to give? I want at least one question each on: what "coherent" is actually doing in the defintion, since the idealized self is basically defined as the fixed point of you coming to understand your own values — how is that not circular, and which coherence is it anyway, consistency of beliefs or something about the structure of preferences? The part of the definition that says the idealized self has to still be you, and whether that just smuggles in the very values the procedure is supposed to uncover. What happens if the idealized self comes out wanting something you currently find horrifying — does CEV then say you already ought to want that, and if he says you'd come to see it as right once you understood, how is that not unfalsifiable? And whose preferences get extrapolated in the first place — what about people whose preferences are incoherent or damaged, like severe depression or psychopathy, and does CEV have any critical edge over just ratifying everyone's idealized self?

  Oh, and one more on how it's supposed to bridge from what humanity's idealized volition is to what the AI ought to do, because to me the "ought" just gets pushed back one step every time. Please don't make it sound like I'm trying to roast him, I want to be fair, but I do want to actualy press on the hard parts.
