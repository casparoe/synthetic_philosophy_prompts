prompt: |-
  I have to run a ninety-minute evening session on the Frege–Geach problem for expressivism with a group of software engineers who read moral philosophy for pleasure but have no formal logic and no metaethics. Don't explain the argument to me; plan how I should get them to see it.

  The frame I want to try, which you should tell me to drop if it's wrong: I want to present the problem as a failure of compositionality rather than as a worry about whether moral sentences can be true. On the expressivist picture a moral clause seems to have something like an effect where a semantic value is needed, and the trouble appears when the clause is embedded in a context that consumes values — the antecedent of a conditional, the scope of a negation, a question — so that what the clause does when asserted is not what is being done with it there. I'm hoping this audience grasps the shape of the problem faster that way than via the usual route.

  Give me the order the pieces have to come in, and what depends on what. In particular: should the requirement that a solution assign the clause the same attitude in embedded and in unasserted occurrence be stated up front, as the standard any solution must meet, or does it only become intelligible once they have already felt the problem? And where does negation go relative to embedding, and must one precede the other?

  One example should carry the whole session. My constraint on it: the embedded moral clause must not be paraphrasable as a report of the speaker's own present attitude, or the expressivist gets an easy out that stops the argument biting. What else must the example have, what must it lack, and where do I first use it and then reuse it?

  Then the misconceptions, in the order I should expect them, each with the point in the sequence where I head it off. Mine are: that expressivism is the view that moral sentences are meaningless or merely emotive; that the difficulty is just that moral claims cannot be true; that the fix is simply to let moral clauses express attitudes and also be true; and that handling negation settles embedding. Correct whichever of those are wrong, and tell me which ones this audience will form because of the code analogy rather than despite it.

  Finally: one question for the last ten minutes whose answer would show me the problem has landed rather than that they have memorised a slogan, and one thing I should openly refuse to go into at this level.

  Be blunt where you are guessing. If the compositionality framing is confused, or the effect/value analogy will mislead this audience more than it helps, say so plainly instead of planning me a session around a bad idea. And mark the step you would most expect to fail in the room, with what you would fall back on.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Topic:** Frege-Geach Problem for Expressivism.
      *   **Audience:** Software Engineers (SEs), read moral philosophy for pleasure, no formal logic, no metaethics.
      *   **Duration:** 90 minutes.
      *   **Constraint 1 (Framing):** User wants to frame it as a *failure of compositionality* (effect vs. semantic value) rather than truth-aptitude. I need to validate or challenge this.
      *   **Constraint 2 (Structure):** Need order of pieces, dependencies (standard vs. problem first, negation vs. embedding).
      *   **Constraint 3 (Example):** One example must carry the whole session. Cannot be paraphrasable as a report of speaker's attitude (blocks "I disapprove" easy out). Need criteria for the example.
      *   **Constraint 4 (Misconceptions):** Address specific misconceptions in order, noting which arise *because* of the code analogy.
      *   **Constraint 5 (Ending):** One diagnostic question for the last 10 mins. One thing to refuse to discuss.
      *   **Tone:** Blunt, critical of the user's framing if necessary, practical.

  2.  **Evaluate the User's Framing (Compositionality/Effect vs. Value):**
      *   *User's Idea:* Present moral clauses as having an "effect" (like a function call with side effects) where a "value" (return value) is needed for composition (embedding).
      *   *Critique:* This is actually a *very* strong analogy for Software Engineers. In programming, you have expressions (return values) and statements (side effects). You can't put a `void` function inside an `if` condition or an arithmetic operation.
      *   *Verdict:* Keep this framing. It's better for this audience than "truth conditions." It maps "assertion" to "executing a statement" and "embedding" to "using an expression in a larger computation."
      *   *Caveat:* Don't get bogged down in linguistic semantics jargon. Stick to the code metaphor.

  3.  **Determine the Order of Pieces:**
      *   *Standard First?* If you state the requirement ("same semantic value in and out") up front, it sounds like an arbitrary rule. If they feel the bug first, the requirement looks like the necessary patch. *Decision:* Feel the problem first, then state the requirement as the type-safety constraint.
      *   *Negation vs. Embedding:* Negation is a form of embedding, but conditionals (Modus Ponens) are the classic Frege-Geach killer. For SEs, `if` statements are more intuitive than logical negation operators regarding control flow. *Decision:* Start with the Conditional (Modus Ponens structure) because it shows the *inferential* breakdown, which is the real sting. Negation is easier to hand-wave ("maybe not-p is just disapproving of p?"). The conditional breaks the logic.
      *   *Sequence:*
          1.  Expressivism 101 (The "Type" of Moral Sentences).
          2.  The Simple Case (Assertion).
          3.  The Complex Case (Embedding/Conditionals).
          4.  The Crash (Inference fails).
          5.  The Requirement (Compositionality/Type Safety).
          6.  Why "Just add Truth" breaks Expressivism.

  4.  **Design the One Example:**
      *   *Constraint:* Cannot be paraphrasable as "I disapprove."
      *   *Requirement:* Needs to support Modus Ponens.
      *   *Requirement:* Needs to be morally substantive enough to feel real, but simple enough to track.
      *   *Idea:* "Stealing is wrong."
      *   *Usage:*
          1.  Assertion: "Stealing is wrong." (Expresses disapproval).
          2.  Embedding: "If stealing is wrong, then getting your brother to steal is wrong."
          3.  Inference: "Stealing is wrong. Therefore, getting your brother to steal is wrong."
      *   *Why this works:* It prevents the "I disapprove" paraphrase in the antecedent. "If I disapprove of stealing..." changes the meaning of the conditional.
      *   *Code Analogy:* `assert(is_wrong(stealing))` vs `if is_wrong(stealing) { ... }`.

  5.  **Address Misconceptions:**
      *   *List:*
          1.  Expressivism = Meaningless/Emotive.
          2.  Problem = Truth.
          3.  Fix = Attitudes + Truth.
          4.  Negation solves Embedding.
      *   *Order:*
          1.  (Early) Expressivism != Meaningless. It has *function*, just not *reference*.
          2.  (Mid) Problem != Truth. It's about *inference consistency*.
          3.  (Late) Negation != Embedding solved. Conditionals are the hard case.
          4.  (End) Fix != Add Truth. That quits expressivism.
      *   *Code-Specific Misconceptions:* SEs might think "Just overload the operator" or "Return a Monad." I need to head off the idea that this is just a typing error we can fix without changing the runtime behavior (the attitude).

  6.  **Drafting the Session Plan (Iterative refinement):**

      *   *Intro (15 mins):* Define Expressivism using the Code Analogy. Moral sentences = `print_error()` or `throw Exception()`, not `return bool`.
      *   *The Setup (15 mins):* The Example. Assertion works fine.
      *   *The Crash (30 mins):* Embedding. The Conditional. Show how Modus Ponens breaks if the antecedent doesn't return a value.
      *   *The Constraint (15 mins):* Compositionality. Why we need the "type" to match.
      *   *Failed Fixes (15 mins):* Why adding truth values kills the expressivist project.
      *   *Closing (15 mins):* Diagnostic Question.

      *Refining the "Compositionality" Frame:* Is it confused? No, it's actually the most precise way to describe F-G for this group. The "effect/value" distinction is basically "statement/expression" distinction in C/Java. I will validate this strongly.

      *Refining the Example:* "Stealing is wrong" is classic. Let's make it slightly more specific to avoid "Stealing is illegal" confusion. "Torturing cats is wrong."
      *Wait, the prompt asks for criteria.*
      *   Must lack: Psychological self-report structure ("I feel...").
      *   Must have: Logical connectives available (If... then).
      *   Must have: Valid inference intuition (It *seems* valid).
      *   First use: Simple assertion.
      *   Reuse: Antecedent of conditional.

      *Refining Misconceptions:*
      *   SEs will definitely try to "fix the type system." I need to explain why the "type" (attitude) is the *point* of expressivism. Changing the type to `bool` makes it Realism.
      *   "Negation settles embedding": SEs know `!bool` works. I need to show why `!attitude` is weird.

      *Refining the Final Question:*
      *   Needs to test understanding of the *structural* problem, not the conclusion.
      *   "If we define 'wrong' as 'boo!', what does 'If wrong then...' mean?" -> "Boo! if...?" No.
      *   Better: "Write the function signature."

      *Refining the "Refusal":*
      *   Don't go into Quasi-Realism (Blackburn/Gibbard). It's the solution, but explaining it requires solving the problem, which is too deep for 90 mins. It turns into a different lecture.

  7.  **Final Review against Constraints:**
      *   Blunt on framing? Yes, validate the compositionality frame.
      *   Order of pieces? Problem -> Requirement.
      *   Negation vs Embedding? Embedding (Conditionals) first, Negation is secondary.
      *   Example criteria? Defined.
      *   Misconceptions? Ordered and mapped to code analogies.
      *   Final Question? Diagnostic.
      *   Refusal? Quasi-Realism.

  8.  **Constructing the Output:** (Drafting the response following the thought process).
      *   *Self-Correction on Framing:* I need to be careful. The "effect/value" analogy is good, but don't let them think the *solution* is just wrapping the effect in a Value object (Monad). That's the Quasi-Realist move, which is too complex. The point is to show the *problem*.
      *   *Self-Correction on Misconceptions:* The "Truth" misconception is the biggest trap. SEs equate "semantic value" with "boolean." I must decouple "semantic value" from "truth" early. Semantic value = "what contributes to the meaning of the whole."

      *(Self-Correction during drafting)*: Wait, the user asked: "should the requirement that a solution assign the clause the same attitude in embedded and in unasserted occurrence be stated up front... or does it only become intelligible once they have already felt the problem?"
      *Answer:* It must come *after* the problem. If you state it up front, it sounds like an arbitrary constraint. If they see the inference break, they see *why* the types must match.

      *(Self-Correction on Negation)*: Negation is easier than conditionals. Do conditionals first. Negation can be handled by "inconsistency of attitudes," but conditionals require "content."

      *(Final Polish)*: Ensure the tone is direct and authoritative.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Your framing is correct. Keep it. For software engineers, the "effect vs. value" distinction (statement vs. expression) is a far more intuitive hook than "truth conditions." In code, you cannot put a `void` function in an `if` condition or an arithmetic expression. That is exactly the Frege–Geach problem.

  However, you must be careful not to let them solve it by saying "Just wrap the effect in a Result object." That is the Quasi-Realist solution, which is too complex for 90 minutes. Your goal is to make them feel the *type error*, not engineer the patch.

  Here is the plan.

  ### 1. The Order of Pieces
  **Do not state the compositionality requirement up front.**
  If you start by saying "A semantic theory must assign the same value to a clause whether asserted or embedded," they will treat it as an arbitrary rule of philosophy grammar. It sounds like bureaucracy.

  **The Sequence:**
  1.  **Expressivism (The Type Definition):** Define moral sentences as having the semantic type of an *attitude expression* (like a `print()` or `throw`), not a *proposition* (like a `return`).
  2.  **The Simple Case (Assertion):** Show this works fine in standalone scope. `assert(wrong(stealing))` works.
  3.  **The Complex Case (Embedding):** Put the clause in a conditional antecedent. `if wrong(stealing) { ... }`.
  4.  **The Crash (Inference):** Show that Modus Ponens fails because the antecedent didn't return a value to be operated on.
  5.  **The Requirement (Type Safety):** *Now* introduce the compositionality constraint. It is no longer a rule; it is the necessary fix to prevent the crash.
  6.  **The Dilemma:** To fix the type error, you must change the type to `bool`. But changing the type to `bool` destroys Expressivism (Realism).

  **Negation vs. Embedding:**
  **Embedding (Conditionals) must precede Negation.**
  Negation is a unary operator; SEs will instinctively think "I can just overload `!`." They will think `!disapprove` is intelligible. The conditional (`if P then Q`) is the killer because it requires `P` to have a truth-evaluable content that *transfers* to `Q`. If `P` is just a noise of disapproval, the link to `Q` is broken. Do negation only as a side note if you have time; focus on the conditional.

  ### 2. The Example
  **The Example:** "Stealing is wrong."
  **Why this one:** It is atomic, morally weighty enough to resist trivialization, and supports clear entailments.

  **Criteria it must meet:**
  *   **Must Lack:** Any psychological self-report structure. Do not use "I dislike stealing." If you use that, they will paraphrase the antecedent as "If I dislike stealing..." which is a coherent (though non-expressivist) sentence. The clause must be *just* "Stealing is wrong."
  *   **Must Have:** A clear entailment to a second moral claim. You need a Modus Ponens structure.
  *   **Must Have:** Intuitive validity. The inference must *feel* valid to them, so the failure of the theory to capture it feels like a bug.

  **Usage Sequence:**
  1.  **Minute 15:** Use it in assertion. "Stealing is wrong." Expressivism says: This expresses disapproval. (Code: `disapprove(stealing)`).
  2.  **Minute 30:** Use it in embedding. "If stealing is wrong, then getting your brother to steal is wrong."
  3.  **Minute 45:** Reuse it in the inference.
      *   Premise 1: If stealing is wrong, then getting your brother to steal is wrong.
      *   Premise 2: Stealing is wrong.
      *   Conclusion: Getting your brother to steal is wrong.
      *   *Ask:* What is the 'Stealing is wrong' clause doing in Premise 1? It isn't expressing disapproval there. You aren't disapproving of stealing in the antecedent; you are hypothesizing. If it's not expressing disapproval, what is it doing?

  ### 3. Misconceptions (In Order)
  **1. "Expressivism says moral sentences are meaningless."**
  *   **When:** Minute 10 (Intro).
  *   **Correction:** They have *use*, just not *reference*. Analogy: `console.log("Error")` is not meaningless; it performs a function. It just doesn't return a value.
  *   **Code Risk:** SEs equate "meaning" with "data." Correct this early.

  **2. "The problem is just that moral claims can't be true."**
  *   **When:** Minute 40 (The Crash).
  *   **Correction:** The problem isn't truth; it's *logic*. We can reason about commands ("If you go, take your coat. You are going. Take your coat."). The problem is that Expressivism makes the moral clause change its *type* depending on scope.
  *   **Code Risk:** They will think "Just add a `bool` return." You must explain that adding the `bool` makes it Realism, not Expressivism.

  **3. "Handling negation settles embedding."**
  *   **When:** Minute 50 (If they bring it up).
  *   **Correction:** Negation is easy to hand-wave ("I disapprove of your disapproval"). Conditionals break the inference chain.
  *   **Code Risk:** They know how to overload `!`. They don't know how to overload `if` without a boolean condition. Focus on the `if`.

  **4. "The fix is simply to let moral clauses express attitudes AND be true."**
  *   **When:** Minute 70 (The Dilemma).
  *   **Correction:** This is not a fix; it is a surrender. If they have truth conditions, they are not Expressivist anymore. You cannot have it both ways without a much more complex theory (Quasi-Realism) which you are not covering.
  *   **Code Risk:** This is the "Monad" trap. They will want to wrap the side-effect in a Value type to make it composable. Acknowledge this is the *goal* of Quasi-Realism, but insist that for *pure* Expressivism, this is a type violation.

  ### 4. The Final Ten Minutes
  **The Diagnostic Question:**
  Do not ask "What is the Frege-Geach problem?" (They will recite a slogan).
  Ask this:
  > "If 'Stealing is wrong' is fundamentally a command-like expression of attitude, write the function signature for the `if` statement in 'If stealing is wrong, then...' that allows the inference to work without changing the function's return type."

  *   **Success:** They struggle. They realize they can't write the signature. They see that the antecedent *needs* to be a boolean to feed the `if`, but Expressivism says it's `void`.
  *   **Failure:** They write `if (disapprove(stealing))`. This shows they reverted to psychologism (the "easy out" you banned in the example criteria).

  **The Refusal:**
  **Refuse to explain Quasi-Realism (Blackburn/Gibbard).**
  *   **Why:** Quasi-Realism is the attempt to *solve* Frege-Geach by earning the right to talk of truth and conditions while remaining Expressivist. It requires higher-order attitudes and complex logic.
  *   **The Line:** "There are solutions that try to keep Expressivism and fix the type system, but they require rebuilding the entire compiler. Today we are just identifying the compilation error."
  *   **Why this matters:** If you try to explain the solution, you will spend 45 minutes on higher-order attitudes and lose the room. Keep them on the bug report.

  ### 5. Where This Will Fail (And Fallback)
  **The Failure Point:** Minute 45 (The Inference).
  They will not feel the inference breaking. They will say, "But obviously the argument is valid. Why does your theory say it isn't?" They will trust their intuition over your type system.

  **The Fallback:**
  Stop talking about logic. Talk about **debugging**.
  "Imagine you are debugging this code. The program crashes at the `if`. The linter says 'Condition must be boolean'. The Expressivist says 'This condition is a print statement'. You cannot merge that branch. If you say the argument is valid, you are saying the code runs. If you are an Expressivist, you are saying the code is `void`. You cannot have both."

  Force them to choose between the *code structure* (Expressivism) and the *program execution* (Valid Inference). That is the dilemma.

  ### Summary of Constraints Check
  *   **Framing:** Compositionality/Type-Safety. (Validated).
  *   **Requirement Timing:** After the problem. (Confirmed).
  *   **Negation:** After Conditionals. (Confirmed).
  *   **Example:** "Stealing is wrong." No self-report. (Confirmed).
  *   **Misconceptions:** Ordered by likelihood and code-interference. (Confirmed).
  *   **Final Question:** Function signature challenge. (Confirmed).
  *   **Refusal:** Quasi-Realism. (Confirmed).

  This plan respects their technical literacy while preventing them from using it to bypass the philosophical difficulty.
