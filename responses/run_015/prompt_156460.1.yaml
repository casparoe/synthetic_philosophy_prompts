answer: |-
  Good morning, everyone. Thanks for making it here.

  I want to start by just acknowledging the makeup of this room, because I think it's the most important thing about this weekend. On one side, we have people who spend their lives thinking about political obligation, legitimacy, the social contract—you know the literature better than I do. On the other side, we have people who have actually had to wake up on a Tuesday, go into an office, and decide whether to sign a directive that felt wrong. Maybe you've lived through the fallout of saying no. Maybe you've watched a colleague do it.

  Usually, when we talk about resistance, the conversation defaults to a binary. It's an on/off switch. Either you are a law-abiding citizen, or you are a dissident. Either you obey the state, or you break with it. And if you're working in political philosophy, that binary is useful. It helps map out the boundaries of legitimacy. But if you're working in administration, that binary is almost useless. It doesn't describe what actually happens when you're inside the machine.

  So, here's what I've been wrestling with, and what I'm hoping we can tackle together over the next two days.

  When we treat political obligation as this monolithic thing—a single duty to obey the state—we miss the texture of what bureaucratic refusal actually is. If I'm a civil servant, I'm not just a citizen standing on a sidewalk. I hold an office. That office comes with its own stack of obligations. I have a duty to the chain of command, sure. But I also have a duty to the constitution, to the public trust, to the specific laws that govern my agency.

  Sometimes, those duties crash into each other.

  When that happens, refusing an order isn't necessarily an act of anarchism. It's not necessarily a rejection of the state itself. Often, it's a claim that one layered obligation outweighs another. It's saying, "I am obeying the deeper structure of this system by refusing this specific command." That is structurally different from civil disobedience in the street. The person marching is often speaking truth to power from the outside. The person refusing at their desk is speaking truth to power from the inside, using the weight of the office itself as the lever.

  I worry that if we aren't careful, we're going to spend this weekend trying to force these two experiences into the same box.

  To my colleagues in theory: I hope we don't spend too much time trying to fit these real-world cases into existing taxonomies. If the framework doesn't bend to fit the reality of what these practitioners have lived through, then the framework is the problem. We can't treat their experiences as just applied ethics case studies. The stakes here aren't hypothetical.

  And to the practitioners in the room: I know the last thing you want is a room full of academics telling you how noble or how problematic your choices were. That's not the goal. The goal is to understand the structure of that choice so we can better support it, or critique it, without reducing it to a simple story of heroism or insubordination.

  We aren't here to celebrate law-breaking uncritically. But we also can't pretend there's just one simple duty to the state that answers every situation. There isn't.

  So, my invitation for the weekend is this: Let's sit with that tension. Let's look at the space between the street and the desk. Let's figure out how to talk about obligation not as a switch, but as a ecosystem of competing duties. If we can get the language right, maybe we can stop asking whether refusal is justified, and start asking what kind of justification actually holds weight when you're the one holding the pen.

  Anyway, that's where my head is at. I'm really looking forward to hearing where yours are. Let's get started.
