  You have identified a real and dangerous dynamic in policy work, and your intuition is correct: Goodhart's Law and the Streetlight Effect are related, but neither captures the whole machine you are operating. Goodhart's Law describes what happens *after* a metric is chosen (it gets distorted), and the Streetlight Effect describes *where* people look (where it's easy). Neither fully explains why you choose the easy thing in the first place, nor why that choice locks you in for next year.

  The phenomenon you are describing is best understood as a system with two distinct engines working together. The first engine is **Measurability Bias**. This is the cognitive tendency to favor information that is numerical and concrete over information that is qualitative or complex. This covers your first and third cases: you chose the bed nets and the tutoring program not because they were proven better, but because they were *proven at all*. The second engine is **Path Dependence**. This is the structural reality that past decisions constrain future ones. Because you funded the nets, you now have data on nets. Because you have data on nets, nets look safer next year. This covers your feedback loop observation.

  When these two work together, they create a cycle often called **Metric-Driven Path Dependence**. While there isn't a single dictionary word for this exact combination, policy analysts often group this under the **McNamara Fallacy**. This fallacy has four steps: measure what can be easily measured; disregard what cannot be easily measured; presume what cannot be measured doesn't matter; and presume what cannot be measured doesn't exist. This matches your "directional tilt" perfectly.

  Regarding your second case (refining the net metrics), you are right that this isn't malicious gaming. However, it is still a form of **Surrogation**. This happens when the measure replaces the goal in your mind. You stopped trying to save lives and started trying to hang nets. This is the innocent version of Goodhart's Law. Goodhart doesn't require cheating; it only requires optimization. When you optimize for a number, the number stops reflecting the reality you actually care about.

  So, is it one thing or two? It is one *dynamic* (the system favoring metrics) driven by two *mechanisms* (bias in selection, dependence in feedback). The edge of this phenomenon is where measurement serves the goal versus where the goal serves the measurement. If you measure bed nets to see if people are safe, that is useful. If you decide people are safe because you hung the nets, that is the phenomenon taking hold. The moment you reject an option *solely* because it lacks a spreadsheet, you have crossed the edge.

