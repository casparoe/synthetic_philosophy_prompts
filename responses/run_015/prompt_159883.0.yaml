answer: |-
  Here is the reconstruction of H.'s framework, applied to your shop.

  ### The Verdict
  H. would likely say your shop is **religious in grammar, though not in ontology.** She wouldn't necessarily call it a "religion" in public (she knows how that distracts people), but in private, she would classify it as a religious form of life. She would point out that you are using the *clothing* of science (probabilities, forecasts, betting records) to dress up a *hinge* (the absolute imperative to save the future).

  She would note the tension: You speak in hypotheses ("10% chance"), but you act on certainties ("we have to hold the line"). In her view, the numbers are ritual objects, not epistemic tools. If the numbers actually drove the behavior, the people with 1% estimates would go home early. They don't. Therefore, the numbers are not functioning as probabilities; they are functioning as liturgy.

  ### Three Candidate Rules
  Based on her ten prior verdicts, here are the three rules that best reconstruct her thinking.

  **Rule 1: The "Hinge" Rule (Epistemic Status)**
  *   **The Rule:** A belief is religious if it functions as a "hinge" or "picture" that grounds other judgments, rather than an object that is itself judged by evidence. If you can ask "what counts against this?" and get a number, it's a hypothesis. If you ask "what counts against the *importance* of this?" and get silence or moral outrage, it's a hinge.
  *   **Fits:** Villagers (name), Quakers (that of God), Human Rights Lawyer (equal worth), Evangelical Kid (loss of picture).
  *   **Excludes:** Resurrection Man (historical data), Creationist (rival science), Grad Student (metaphysics).
  *   **Prediction for Shop:** **Religious.** The forecast is the hypothesis, but the *imperative* derived from it is the hinge. The "why it matters" is groundless.

  **Rule 2: The "Form of Life" Rule (Pragmatic Embedding)**
  *   **The Rule:** A belief is religious only if it organizes the *totality* of the believer's life (money, work, love, sacrifice) and is sustained by shared practices. Words without use are idle; single acts without a life-pattern are divination.
  *   **Fits:** Quakers (whole life arranged), Villagers (life context), Coven (technique/teaching), Human Rights Lawyer (income/life organized).
  *   **Excludes:** Nominal Creed (words idle), House Seller (single act, life unchanged), Grad Student (abstract only).
  *   **Prediction for Shop:** **Religious.** You turn down money, you have rituals (singing, silence), you organize life around the "debt."

  **Rule 3: The "Transmission" Rule (Lineage)**
  *   **The Rule:** A belief is religious if it is initiated, taught, and sustained by a community of practice with a canonical tradition, regardless of the age of that tradition.
  *   **Fits:** Coven (new but taught), Villagers (tradition), Evangelical Kid (raised in it), Shop (canonical essays, onboarding).
  *   **Excludes:** House Seller (lone wolf), Resurrection Man (individual inference), Grad Student (academic argument).
  *   **Prediction for Shop:** **Religious.** You have canonical texts, onboarding, and a community.

  ### Which Rule to Bet On?
  I would bet on **Rule 1 (The Hinge Rule)**, supported by Rule 2.

  **Why:** H. is a Wittgensteinian. The core of *On Certainty* is not about rituals or community per se, but about the *logical grammar* of our propositions. The Human Rights Lawyer case is the key: H. said "same grammar" despite the lack of God, tradition, or explicit ritual mentioned. This suggests the *structure of the commitment* (groundless, life-ordering) matters more than the social trappings. The rituals in your shop (singing, silence) are merely evidence that the hinge has taken root, not the definition of the hinge itself.

  ### Closest Analog
  The **Human Rights Lawyer**.
  Like your shop, she operates in a secular context, posits a value (equal worth / future existence) that cannot be empirically grounded, treats it as non-negotiable, and organizes her material life around it. The **Coven** is a distant second because your shop is new and constructed, but the Lawyer case captures the *secular sacredness* better.

  ### The Discriminating Question
  To separate Rule 1 (Hinge) from Rule 2 (Form of Life), you need to know if the *community* is essential or just incidental to the *commitment*.

  **Ask H. over a drink:**
  > "If one of us left the shop, stopped singing, stopped reading the essays, but kept the same level of personal sacrifice and life-organization around AI risk in isolation—would you say they've lost the belief, or just changed churches?"

  *   **If she says "Lost the belief":** She prioritizes **Rule 2/3 (Transmission/Community).** Religion is inherently social for her.
  *   **If she says "Same belief":** She prioritizes **Rule 1 (Hinge).** Religion is a stance of the will, community is just how it usually manifests.

  **Ask your coworkers:**
  > "If the consensus probability dropped to 0.01% tomorrow, but the *stakes* (total extinction) remained the same, would you stop working?"
  *   If they say "Yes," it's a **Hypothesis** (Rule 1 fails).
  *   If they say "No, the stakes demand it regardless," it's a **Hinge** (Rule 1 confirmed).

  ### Is It Just a Word Fight?
  Yes, but not a trivial one. The fight is about **category errors**, not insults.
  If you call this "science," you invite scientific norms (falsification, updating on evidence, scaling effort with probability). If you call it "religion," you invite religious norms (faith, commitment, sacrifice, community cohesion).
  H. isn't trying to shame you; she's trying to prevent you from confusing your *ritual numbers* with *scientific data*. The danger she sees is that you might think you're doing science when you're actually maintaining a faith. That leads to bad science and brittle faith.

  ### Confidence & Limitations
  **Confidence:** 85%.
  The pattern in her verdicts is remarkably consistent with a Wittgensteinian "use-theory" of meaning. The Human Rights Lawyer case is the strongest predictor because it removes the supernatural variable, leaving only the structural variable, which matches your shop perfectly.

  **The Flip Fact:**
  If you discover that effort *does* scale with probability. If the 5% people work half as hard as the 50% people, then the numbers are real hypotheses, and the "religious" veneer is just marketing. That would flip H.'s verdict to **"Hypothesis with rhetorical flourish."**

  **Where the Reconstruction Breaks:**
  The possibility that **H. has no rule.** Wittgenstein famously argued against essentialism—that there is no single thread running through all "games" or all "religions," only family resemblances. H. might be judging each case on its specific "feel" (the *physiognomy* of the belief) rather than applying a strict algorithm. If so, she might look at your shop and say, "It's too self-conscious, too engineered. It lacks the 'givenness' of the villagers." She might rule it **ideology** rather than religion, simply because it feels manufactured. That is the one variable my reconstruction cannot capture: her aesthetic sense of authenticity.
