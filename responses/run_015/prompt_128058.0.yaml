      *   **Orwellian Revision (Dennett):** The experience happens one way, but memory alters it later. It's a rewrite of history. "I saw X, but now I remember Y." (Post-experiential editing).
      *   **Stalinesque Revision (Dennett):** The experience is fabricated *before* it enters consciousness. The "show" is rigged before the audience sees it. There is no raw feed that is later edited; the edited version is the *only* version that becomes conscious. (Pre-experiential editing).
      *   **Dennett's Stance:** He argues the distinction is a false dichotomy (the "Cartesian Theater" problem). He proposes the "Multiple Drafts" model. However, for the sake of the user's question, I need to explain how the distinction *would* apply if we accept the framework, while acknowledging Dennett's critique.

