answer: |-
  I. Agreed Claims

  1.  **Ontological Commitment:** We agree that engaging in theoretical discourse within law, medicine, or aesthetics incurs ontological commitment in the sense that practitioners must treat certain entities as existent for the discourse to function, though we disagree on whether this commitment reflects mind-independent reality or framework-internal consistency.
  2.  **Quantifier Variance:** We agree that quantificational idioms (e.g., "there exists," "some," "all") exhibit variation in usage and truth-conditions across different domains of inquiry, though we disagree on whether this variance reflects a multiplicity of existence concepts or merely contextual precision regarding a single existence concept.
  3.  **Explanatory Structure:** We agree that institutional and non-fundamental entities (such as corporations, diseases, or musical works) play indispensable roles in the explanatory and predictive structures of their respective domains, though we disagree on whether this indispensability entails genuine existence or merely pragmatic utility.
  4.  **Verbal vs. Substantive Disputes:** We agree that not all表面上 ontological disagreements are metaphysical, and that some dissolve upon clarifying linguistic usage or conceptual schemes, though we disagree on the criteria for distinguishing these verbal disputes from substantive disagreements about the world.

  II. Disagreements, Cruxes, and Test Cases

  | Point of Divergence | Applied-Ontology Deflationist Formulation | Applied-Ontology Realist Formulation | Underlying Crux | Test Case and Advance Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Explanatory Success and Ontological Commitment** | Explanatory success within a domain demonstrates the utility of a conceptual framework, not the mind-independent existence of the entities posited; commitment is relative to the rules of the framework. | Explanatory success provides evidence for the genuine existence of the entities posited; if a theory requires an entity to best explain phenomena, inference to the best explanation warrants ontological commitment. | **Crux 1:** Is there a domain-independent criterion of ontological seriousness, or is "existence" always relative to a conceptual scheme? | **Case:** Treating a corporate entity as a legal person in bankruptcy proceedings.<br><br>**Deflationist Prediction:** The proceedings reveal that "corporate personhood" is a functional status granted by legal rules; the "existence" of the corporation dissolves if the legal framework is abolished, proving it is framework-relative.<br><br>**Realist Prediction:** The proceedings reveal that the corporation holds causal powers and obligations (debts, liabilities) that persist regardless of descriptive changes, proving it is a robust social object that the law tracks rather than creates. |
  | **Framework Selection and Rational Compulsion** | Framework selection is governed by pragmatic considerations (ease of use, social goals, coherence); evidence cannot compel the adoption of one ontology over another because evidence is always internal to a framework. | Framework selection is rationally compelled by evidence and truth-tracking; while pragmatics matter, we are obligated to adopt the framework that best carves nature at its joints, even if inconvenient. | **Crux 2:** Can explanatory redundancy for institutional entities be demonstrated in principle, or are some institutional entities ontologically indispensable? | **Case:** Adopting one psychiatric taxonomy over another (e.g., categorizing a cluster of symptoms as "Major Depressive Disorder" vs. "Normal Grief Response").<br><br>**Deflationist Prediction:** We can demonstrate redundancy by showing that both taxonomies yield similar treatment outcomes; the choice is a pragmatic decision about how to draw boundaries around human distress, not a discovery of distinct natural kinds.<br><br>**Realist Prediction:** Redundancy cannot be demonstrated because one taxonomy will align with underlying neurocognitive mechanisms while the other does not; choosing the wrong ontology leads to predictive failure and reduced treatment efficacy, proving the entities are not merely conventional. |
