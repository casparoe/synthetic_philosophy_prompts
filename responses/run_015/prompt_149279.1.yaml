answer: |-
  Here is the stress-test you requested. I have evaluated the Parity Defense (both the bare and borrowed-criterion versions) against the specific constraints you provided: avoiding "mystery" objections, focusing on distinctive phenomenal posits, and delivering a definite verdict.

  ### 1. Ranked Defeaters for the Parity Defense

  I have ranked these from fatal to merely awkward. The ranking is based on whether the objection demonstrates that the Parity Defense fails to achieve its specific goal (showing panpsychism incurs no *extra* explanatory debt compared to physicalism).

  **Rank 1: Fatal — The Categorical Mismatch (The "Bridge Principle" Horn)**
  *   **The Objection:** The borrowed-criterion version claims to use physical criteria (causal integration, informational unity) to determine phenomenal composition. However, physical criteria are defined functionally/structurally. They explain how *physical* parts constitute a *physical* whole. They do not logically entail how *phenomenal* parts constitute a *phenomenal* whole.
  *   **Why Fatal:** To make the borrowed criteria work, you must assert a bridge principle: *Collections of micro-subjects satisfying physical condition C compose a macro-subject.* The physicalist does not need this principle. The physicalist asserts: *Collections of particles satisfying C compose a macro-object.*
      *   For the physicalist, the relata (particles) and the result (object) are in the same ontological category.
      *   For the panpsychist, the relata (experiences) and the result (subject) are in a *different* ontological category than the criteria (physical relations).
      *   Therefore, the panpsychist is committed to a distinctive fundamental posit: **that physical/structural relations have the power to unify phenomenal properties.** This is a "Phenomenal Bonding Law" that the physicalist does not need. The Parity Defense claims there is no extra debt; this shows there *is* extra debt.
  *   **Justification:** This defeats the core thesis of the Parity Defense. It shows the defense is not a parity argument but a concealment of a new psychophysical law.

  **Rank 2: Severe — The Overflow Problem (Vague Subject Identity)**
  *   **The Objection:** If composition is determined by continuous physical variables (integration levels), then subject existence is vague. During split-brain surgery or gradual anesthesia, there is no fact of the matter about whether one subject or two exist.
  *   **Why Severe:** While physicalists can tolerate vague identity for tables (ontic vagueness), vague identity for *subjects* carries ethical and metaphysical costs physicalists do not face. If subjecthood is vague, moral status is vague. If survival is vague, prudential concern is vague.
  *   **Justification:** The Parity Defense argues the cost is shared. This shows the cost is *amplified* for panpsychism because the "objects" in question are loci of moral value. The panpsychist must accept a degree of metaphysical indeterminacy about *who is there* that exceeds the indeterminacy about *what tables are there*.
  *   **Survivability:** This is not fatal if you are willing to bite the bullet on vague existence. Many metaphysicians accept vague identity. But it weakens the "no extra cost" claim.

  **Rank 3: Moderate — The Cosmopsychism Asymmetry**
  *   **The Objection:** As you noted, the Parity Defense aligns micropsychism with standard mereology (parts $\rightarrow$ whole). It does not help cosmopsychism (whole $\rightarrow$ parts).
  *   **Why Moderate:** This limits the scope of your defense. It suggests the Parity Defense is not a general defense of *panpsychism*, but only of *micropsychism*.
  *   **Justification:** This is not a defeater for your specific view (micropsychism), but it undermines the generality of the argument. It suggests the "combination problem" is actually two different problems (combination vs. decombination), and physicalism only offers parity for one.
  *   **Survivability:** High. You can simply concede this and argue it is a reason to prefer micropsychism over cosmopsychism.

  **Rank 4: Minor — Unfalsifiability via Primitivism**
  *   **The Objection:** Treating composition as primitive risks making the view immune to empirical correction.
  *   **Why Minor:** As you noted, physicalist mereology is often equally primitive. If the physicalist is allowed to treat "table existence" as a brute fact of composition, the panpsychist is allowed to treat "subject existence" similarly.
  *   **Justification:** This is a shared cost, not a distinctive one. It does not discriminate between views.

  ---

  ### 2. The Dilemma: Borrowed Criteria vs. Bridge Principle

  **Verdict:** The dilemma is real, and both horns are live. There is no version of the borrowed-criterion move that escapes it without changing the view to Neutral Monism.

  *   **Horn 1 (Criteria don't entail phenomenality):** If you say "Causal integration is all that is needed," you face the Zombie objection. A system could be causally integrated without having a unified *experience*. If the panpsychist insists it *does* have a unified experience, they are asserting a connection not contained in the criteria themselves.
  *   **Horn 2 (Bridge Principle is a new posit):** If you add "Causal integration $\rightarrow$ Phenomenal Unity," you have introduced a fundamental law linking structure to experience. The physicalist does not need this law. They only need "Structure $\rightarrow$ Function."
  *   **The Escape Route (and why it fails):** The only way to escape is to claim that causal integration *just is* phenomenal unity (Neutral Monism / Russellian Monism where the physical *is* the phenomenal). But you are defending *Micropsychist Panpsychism*, which typically maintains a distinction between the intrinsic (phenomenal) nature of the micro-entity and its extrinsic (physical) relations. If you maintain that distinction, you cannot identify the criteria with the composition. You must link them. That link is the extra posit.

  **Recommendation:** Do not try to escape the dilemma. Concede Horn 2. Admit that the Borrowed-Criterion version requires a **Phenomenal Bonding Principle**. Your argument should shift from "There is no extra debt" to "The extra debt is minimal and necessary to solve the Hard Problem."

  ---

  ### 3. The Overflow Problem: Concession vs. Dismissal

  **Verdict:** The panpsychist must **concede** this as genuine evidence against the view's intuitive appeal, but is entitled to **dismiss** it as a metaphysical fatal flaw.

  *   **What to Concede:** You must concede that on the Borrowed-Criterion view, the *number* of subjects is empirically unstable in a way the number of tables is not. A table's boundaries are vague, but its existence is usually binary at the macro-scale. A subject's existence, tied to integration metrics (like Phi or neural synchrony), can fluctuate rapidly. You must admit that there are times (e.g., deep sleep, split-brain) where "Who is there?" has no determinate answer.
  *   **What to Dismiss:** You are entitled to dismiss the claim that this renders the view incoherent. If you accept ontic vagueness for objects (as many physicalists do for composition), you can accept it for subjects.
  *   **The Cost:** The cost is not metaphysical incoherence; it is **ethical indeterminacy**. If subjecthood is vague, moral status is vague. This is a distinctive cost physicalists (who often treat consciousness as a binary switch or eliminate it) do not face to the same degree.
  *   **Strategy:** Embrace the indeterminacy. Argue that our folk intuition of a "precise subject" is the error, not the metaphysics. This turns the objection into a prediction: *Consciousness fades in and out with integration, without a sharp boundary.*

  ---

  ### 4. Distinctive Commitments and Predictions

  You asked for what the view is "on the hook for." The Parity Defense, specifically the Borrowed-Criterion version, commits you to the following distinctive posits that physicalists do not need:

  1.  **The Phenomenal Bonding Law:** As established above, you are committed to the claim that *physical/structural relations have the power to unify phenomenal properties.* Physicalists claim structural relations unify physical properties. This is a category extension.
  2.  **Phenomenal Vagueness:** You are committed to the claim that *existence of subjects can be a matter of degree.* Physicalists can be eliminativists about vague subjects; you cannot, because the micro-subjects are fundamental.
  3.  **Empirical Hostage:** You are correct that the Borrowed-Criterion version makes panpsychism hostage to empirical facts about integration.
      *   *Prediction:* If we find a system with high causal integration but no behavioral evidence of consciousness, the physicalist can say "It's a zombie." You must say "It has a unified subject."
      *   *Prediction:* If we find a system with low integration but high behavioral complexity, the physicalist might attribute consciousness. You might be forced to deny it (depending on your criteria).
      *   *Risk:* This makes your view more falsifiable than the "bare primitive" version, which is a virtue, but it exposes you to empirical refutation if the correlation between integration and reported experience breaks down.

  ---

  ### 5. Unfalsifiability and Primitivism

  **Verdict:** The bare version (composition is primitive) does risk unfalsifiability, but this is an **acceptable feature** of a thesis in fundamental metaphysics, provided it is not used to immunize the view from *all* constraints.

  *   **Analysis:** If you say "Composition is primitive," you can explain away any failure of subjects to combine by saying "They didn't stand in the right relation." This is theoretically cheap.
  *   **Defense:** However, fundamental metaphysics *must* have primitives. The physicalist has "physical causation" or "quantum fields" as primitives. Having "phenomenal composition" as a primitive is not a defect *per se*.
  *   **Constraint:** The defect arises if you use primitivism to avoid the **Categorical Mismatch**. You cannot say "Composition is primitive" to explain *how* physical relations bind experiences. You can only use it to explain *that* they bind. The "how" remains the Bridge Principle issue.
  *   **Advice:** Do not use primitivism to hide the Bridge Principle. Use primitivism only to handle the *specifics* of the composition relation (e.g., "Exactly which degree of integration triggers composition is a brute fact"), while maintaining the Bridge Principle as the general law.

  ---

  ### 6. The Cosmopsychism Asymmetry

  **Verdict:** The Parity Defense works for Micropsychism and fails for Cosmopsychism. **This asymmetry is a reason to be a Micropsychist, not a reason to reject the Defense.**

  *   **Analysis:** Physicalist mereology is overwhelmingly bottom-up (particles $\rightarrow$ atoms $\rightarrow$ molecules). It has no standard model for top-down carving (One Field $\rightarrow$ Many Subjects).
  *   **Implication:** The Parity Defense relies on aligning panpsychism with standard mereology. Micropsychism aligns; Cosmopsychism does not.
  *   **Conclusion:** This does not tell against the Defense; it tells against Cosmopsychism. It strengthens your position as a Micropsychist. You should explicitly frame the Parity Defense as an argument *for* Micropsychism over Cosmopsychism, rather than a general defense of all panpsychism.

  ---

  ### 7. Final Verdict and Revision Strategy

  **Most Serious Defeater:** **The Categorical Mismatch (Rank 1).**
  This is the single point that breaks the "Parity" claim. It demonstrates that Panpsychism incurs a distinctive explanatory debt: the assertion that structural relations unify phenomenal properties.

  **Does the Defense Survive?**
  **No, not in its current form.** The claim that "there is no extra explanatory debt" is false. There is extra debt.
  **However,** the view (Micropsychism) survives if you reframe the defense.

  **Revision Strategy for Your Paper:**
  1.  **Abandon the "No Extra Debt" Claim:** Do not argue that the Combination Problem is *identical* to the General Composition Problem. Argue that it is *analogous*, but admits one extra fundamental law (The Phenomenal Bonding Principle).
  2.  **Reframe the Cost:** Argue that this extra law is *cheaper* than the physicalist's alternative. The physicalist needs Emergence (something from nothing) or Elimination (denying the data). The panpsychist needs Bonding (connecting something to something). Bonding is metaphysically lighter than Emergence.
  3.  **Own the Bridge Principle:** Explicitly state: "Yes, we require a principle that physical integration entails phenomenal unity. This is a fundamental law of nature. But it is no more mysterious than the law that physical integration entails physical unity."
  4.  **Embrace the Overflow:** Concede that subject identity is vague. Argue that this is a feature, not a bug, as it aligns with the continuous nature of neural integration.
  5.  **Leverage the Asymmetry:** Use the failure of Parity for Cosmopsychism as a positive argument for Micropsychism.

  **Summary:** Your intuition about the dilemma was correct. The Borrowed-Criterion version cannot hide the Bridge Principle. But hiding it was unnecessary. The Parity Defense is strongest not when it claims *equality* of cost, but when it claims *comparative advantage* of cost. Shift from "We pay the same" to "We pay slightly more, but buy much more (a solution to the Hard Problem)."
