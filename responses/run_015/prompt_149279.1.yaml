      *   *Horn 2:* If it's a substantive claim, is it a *new* fundamental law? Physicalists say "Physical Integration $\rightarrow$ Functional Unity." Panpsychists say "Physical Integration $\rightarrow$ Phenomenal Unity."
      *   *The Catch:* The physicalist doesn't need to explain *why* integration yields a unified object (they often treat composition as primitive or vague). But they *do* need to explain why integration yields *consciousness* if they are realists. Wait, the physicalist *eliminates* or *naturalizes* consciousness. The panpsychist *fundamentalizes* it.
