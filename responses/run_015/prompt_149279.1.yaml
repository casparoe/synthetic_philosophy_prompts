          3.  **Awkward:** The Cosmopsychism Asymmetry (Limits scope, doesn't kill view).
      *   *Addressing the Dilemma:* It is real. The escape route is claiming physical relations *are* phenomenal relations (Neutral Monism?), but that changes the view. If sticking to Micropsychism, you need a bridge principle.
