answer: |-
  Dear colleague, it is entirely understandable that you feel stuck when encountering these grant requirements, for they ask you to navigate a shift in philosophical terrain that is often felt intuitively in curatorial practice but rarely spelled out with precision. When museums and environmental history programmes insist on treating germs, climate shifts, and volcanic eruptions as historical actors, they are presupposing a specific ontological commitment known broadly as flat ontology or relational materialism, which refuses to privilege human beings as the sole source of action in the world. This framing does not strictly require that causation just is agency in the traditional moral sense, but it does demand that you expand the definition of agency beyond intentionality and consciousness. In the classical humanist tradition, an actor is someone who intends to act, possesses free will, and can be held responsible for the outcome, but the practice you are describing draws heavily from actor-network theory and new materialism, where an actor or actant is simply anything that modifies a state of affairs by making a difference. Therefore, the strict philosophical requirement here is not that a volcano has a mind or a virus has a plan, but rather that these entities possess causal power that is irreducible to human interpretation or social construction. You are being asked to acknowledge that the course of history is not merely shaped by human decisions acting upon a passive stage, but is co-constituted by the active resistance, cooperation, or volatility of non-human forces.

  This distinction is crucial for answering your worry about whether this approach collapses into environmental determinism. It does not strictly require determinism, though it fits well with it if one is not careful. Hard environmental determinism suggests that physical conditions dictate human social outcomes in a one-way street, leaving no room for human culture or choice, whereas the non-human agency framework usually proposes a mesh of entanglements where humans and non-humans mutually affect one another. The philosophical commitment needed here is symmetrical anthropology, meaning you must describe humans and non-humans using the same analytical vocabulary regarding their capacity to act, without necessarily claiming they act in the same way. This can sit alongside a human-centred historiography only if you are willing to decentralise the human from the position of the sole protagonist without erasing them entirely. You can maintain a focus on human experience and meaning-making, but you must frame that experience as a response to or negotiation with active non-human participants rather than a mastery over inert matter. If the grant application requires a statement on this, they are likely looking for evidence that you understand history as a hybrid collective rather than a human drama played out against a scenic backdrop.

  However, there are significant areas where this theory is philosophically underdetermined, and this is likely where your intuition is balking. The primary ambiguity lies in the conflation of causal power with moral agency. While the framework successfully grants ontological weight to non-humans, it often remains vague on normative questions, such as responsibility and accountability. If a flood is an actor in the history of a city, can it be blamed for destruction, or does responsibility still rest with the humans who built in the floodplain? The practice strictly needs you to acknowledge the causal efficacy of the non-human, but it leaves underdetermined how we distribute praise or blame in a network of mixed actors. Furthermore, the term agency itself is stretched so thin in these contexts that it risks becoming synonymous with mere existence or impact, which can dilute its analytical usefulness. You are not required to believe that nature has a spirit or a teleological direction, which is a common misconception, but you are required to treat material constraints as dynamic participants in the narrative.

  Ultimately, the practice fits well with post-humanist philosophy, but it does not strictly demand a full abandonment of humanism provided you adopt a relational view. The grant reviewers are likely testing whether you can avoid the trap of contextualism, where nature is just the setting, without falling into the trap of mystification, where nature is imbued with human-like consciousness. The sweet spot they are looking for is a materialist account of history where the agency of the non-human is recognised as a force that enables, constrains, and alters human action without dictating it entirely. When writing your statement, you should focus on the specific mechanisms by which these non-human forces intervene in human plans, showing how the narrative would change if that force were removed or altered. This demonstrates the requisite agency without needing to resolve the deeper metaphysical questions about intentionality. You can acknowledge that while a virus does not intend to collapse an empire, its biological capacity to replicate and incapacitate functions as an agentive force within the historical network. By grounding your statement in this relational efficacy rather than metaphysical intention, you satisfy the philosophical commitments of the framework while avoiding the pitfalls of determinism or anthropomorphism, leaving the underdetermined normative questions aside as outside the scope of historical description. I hope this helps clarify the theoretical ground beneath your feet as you draft your proposal.
