answer: |-
  # Joint Statement on Representational Realism in Neural Networks

  ## I. Agreed Claims

  1.  **Formal Structure of Computation:** We agree that neural networks are mathematical structures composed of layers of parameters and non-linear activation functions. All internal dynamics are fully describable via tensor operations, gradient descent optimization, and causal propagation of activation values. There is no disagreement regarding the underlying mechanics or the absence of non-physical components.
  2.  **Achievements of Mechanistic Interpretability:** We acknowledge that mechanistic interpretability has successfully identified reproducible internal structures, including linear feature directions in activation space, circuit motifs (such as induction heads or attention patterns), and phenomena like polysemanticity (where single units respond to multiple distinct features). These structures are stable across seeds and architectures to a significant degree.
  3.  **Heuristic Utility of Representation-Talk:** We agree that describing internal states as "representations" of external features (e.g., "this vector represents dog-ness") is currently indispensable for human understanding, debugging, and communication. Even if ontological status is disputed, the vocabulary of representation facilitates the localization of circuits and the formulation of interventions.
  4.  **Conditions for Adequacy:** We agree that any adequate account of neural network internals must explain two key phenomena: (a) systematic generalization to out-of-distribution inputs, and (b) structured error patterns, including adversarial vulnerabilities and hallucinations. An account that fails to predict or explain these behaviors is insufficient, regardless of its ontological commitments.

  ## II. Disagreements Table

  | Crux | Realist Formulation | Anti-Realist Formulation | Agreed Empirical Case & Divergent Predictions |
  | :--- | :--- | :--- | :--- |
  | **(a) Decoupling and Misrepresentation** | Internal states possess content that can decouple from their causal triggers. When a state activates without its corresponding external feature, this is a genuine **misrepresentation**, proving the state carries semantic content independent of immediate causal history. | Internal states are causal nodes correlated with features during training. Activation without the feature is merely **statistical divergence** or causal decoupling; attributing "misrepresentation" projects normative content onto a purely descriptive causal mismatch. | **Case:** Activation steering interventions where forcing a "truthfulness" direction causes the model to assert factually false statements confidently.<br>**Realist Prediction:** This demonstrates the model possesses a truth-representation that can be made to misrepresent reality.<br>**Anti-Realist Prediction:** This demonstrates the "truthfulness" direction is a behavioral control lever, not a semantic anchor; the output is simply optimized for a statistical pattern associated with confidence, not truth. |
  | **(b) Polysemanticity and Superposition** | Polysemanticity is compatible with realism via **distributed representation** or superposition. A single neuron can participate in multiple representational schemes without losing representational status, provided the downstream decoding context resolves the content. | Polysemanticity undermines realism because it shows no stable one-to-one mapping exists between internal units and external features. The "features" are **observer-relative groupings** of causal effects, not intrinsic properties of the units themselves. | **Case:** Discovery of neurons that activate for semantically unrelated concepts (e.g., "income" and "death") depending on contextual attention patterns.<br>**Realist Prediction:** This reveals a high-dimensional representational scheme where content is encoded in combinations of units, not single units.<br>**Anti-Realist Prediction:** This reveals that the unit itself has no content; the apparent duality is a artifact of the interpreter grouping distinct causal pathways under a single label. |
  | **(c) Explanatory and Predictive Power** | Representation-based explanations have **irreducible predictive power**. Knowing the semantic content of a circuit allows us to anticipate failure modes (e.g., bias, hallucination) that purely causal-graph descriptions would not highlight efficiently. | Representation-based explanations are **compressive summaries** of causal-functional descriptions. All predictions attributed to representations are derivable from the statistical structure of the weights and activations; semantics adds no new predictive leverage. | **Case:** Predicting model performance degradation on specific semantic categories (e.g., rare languages or niche topics) based on identified feature sparse areas.<br>**Realist Prediction:** The semantic description of the missing feature predicted the failure before extensive causal tracing.<br>**Anti-Realist Prediction:** The failure was predicted by identifying low-density regions in activation space; the semantic label was applied post-hoc to describe the region. |

  ## III. Assessment of Verbal vs. Substantive Dispute

  A portion of this dispute is verbal, specifically regarding the definition of "explanation." If "explanation" is defined strictly as predictive compression of causal data, the anti-realist position holds by definition, and the realist claim of irreducible explanatory power dissolves into a claim about human cognitive efficiency. However, the core dispute regarding decoupling and content is substantive. It concerns whether internal states possess normative conditions of satisfaction (they can be *wrong* in themselves) or whether "wrongness" is solely a relation between model output and external reality judged by an observer. This ontological disagreement cannot be resolved by stipulating definitions alone; it requires determining whether semantic properties emerge from the causal structure itself or are imposed upon it.
