  **Exam Question**

  Consider a PAP refinement where alternatives are available only if recognizable as live reasons without global restructuring of the agent's evaluative framework. Explain how this shields PAP from Frankfurt cases by excluding manipulated agents lacking normative accessibility. Conversely, show why this renders responsibility implausibly demanding for ordinary agents in unexamined frameworks. Finally, argue whether a Frankfurt defender can dissolve this via second-order endorsement, or if consistency requires abandoning PAP for a hierarchical model severing responsibility from alternative possibilities.

  **Model Answer**

  The proposed refinement attempts to salvage the Principle of Alternative Possibilities by narrowing the scope of relevant alternative possibilities. It argues that an alternative is only responsibility-undermining if it is normatively accessible. This means the agent could recognize it as a live reason without radically reconstructing their evaluative framework. In standard Frankfurt cases, the counterfactual intervener ensures the agent chooses X, but the agent also lacks access to the reason for refraining. Because the manipulated agent cannot recognize refraining as a live option without a global shift in values they cannot access, the alternative is not genuinely available. Thus, the refinement shields PAP. The agent lacks the specific alternative possibility required for responsibility, so the intuition that they are not responsible aligns with PAP. This avoids the flicker strategy by focusing on rational access rather than causal gaps in the sequence.

  However, this shield exacts a prohibitive tax on ordinary agency. Most moral agents act within unexamined frameworks, guided by habit, implicit bias, or absorbed coping. We rarely pause to reconstruct our evaluative landscape before acting. If responsibility requires recognizing alternatives without global restructuring, most everyday actions become exempt. The refinement implies that only the hyper-reflective, those capable of instant normative transparency, are responsible. This renders our ordinary practices of blame incoherent, as it excludes the vast majority of human action from the scope of responsibility. The condition saves PAP from Frankfurt cases only by making responsibility impossibly demanding for normal agents. It creates a dichotomy where only philosophers are morally accountable, undermining the social function of responsibility practices. Ordinary agents operate on tacit knowledge, not explicit reasoning.

  Can the Frankfurt defender dissolve this tension? They might argue normative accessibility exists at the level of second-order endorsement. Even if the agent cannot see the alternative action, they endorse the desire motivating it. If the agent identifies with their will hierarchically, the lack of alternative possibilities is irrelevant. The tension dissolves because responsibility tracks identification, not access. The manipulated agent fails not because they lack alternatives, but because their endorsement is itself manipulated or absent. In this view, the normative accessibility condition was merely a proxy for volitional unity. The agent is responsible if their will is their own, regardless of whether they could have done otherwise. This shifts the ground from metaphysics of action to psychology of identification.

  Yet, this move concedes the core battle. By shifting focus to second-order endorsement, one effectively abandons PAP. Responsibility is no longer grounded in the ability to do otherwise, even under the normative refinement, but in the structural relation between desires. If the hierarchical model holds, the normative accessibility condition was merely a distracting proxy for volitional unity. The consistent resolution is to abandon PAP. The Frankfurt defender shows that alternative possibilities are metaphysically idle; what matters is the history and structure of the will. To maintain PAP via normative accessibility is to demand too much of agents while failing to see that the real locus of responsibility is hierarchical integration, not alternative access. The tension reveals PAP's fragility; the hierarchical model severs responsibility from alternatives altogether, preserving blame for ordinary agents without requiring inaccessible possibilities. Ultimately, the normative accessibility refinement is unstable; it either collapses into demandingness or dissolves into a hierarchical account that renders PAP obsolete. The only consistent resolution is to abandon PAP in favor of a model where responsibility depends on the authenticity of the will, not the availability of alternatives. This preserves the intuition that manipulated agents are not responsible without imposing reflective demands on ordinary actors. The hierarchical model accommodates the Frankfurt intuition while retaining ordinary blame, whereas the refined PAP fails on both counts. Thus, the tension is only resolved by rejecting the principle itself.

