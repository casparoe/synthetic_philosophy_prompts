      *   The weighting algorithm assumes some members are better than others.
      *   "Better" means "closer to the truth."
      *   If "truth" is defined as "the group aggregate," then the algorithm is optimizing for *consensus*, not *accuracy*.
      *   This is known as *reflexivity* or *endogenous validation*.
      *   The colleague's analogy (eyesight + mirror) is flawed. A mirror reflects light; it doesn't generate the image independently. If your eyesight is distorted, the mirror image is distorted. You can't calibrate distortion using only the distorted input and its reflection. You need a known straight edge (external ground truth).

  3.  **Identify the Specific Epistemic Failure:**
      *   **Bootstrapping:** The system generates its own standard of success.
      *   **Echo Chamber Effect:** If the aggregate drifts, the "accurate" members are those who follow the drift, reinforcing it.
      *   **Goodhart's Law / Metric Fixation:** When a measure becomes a target, it ceases to be a good measure. Here, the target is "agreement with the model," not "agreement with reality."
      *   **Lack of Falsifiability:** There is no condition under which the system could prove itself wrong, because "wrong" is defined internally.

  4.  **Evaluate the Colleague's Analogy (Eyesight + Mirror):**
