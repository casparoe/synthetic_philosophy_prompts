      *   *The "Pivot" Condition:* They need *some* anchor. Even a small set of externally verified events can break the circle.
      *   *Market Mechanism:* If they bet real money on outcomes, the market provides the external truth (P&L).
      *   *Delayed Verification:* If they wait for ground truth eventually, they can retroactively calibrate.

  6.  **Synthesize the "What is at Stake" aspect:**
