answer: |-
  Here is the breakdown of how Dennett and Caruso handle the intuition gap between crimes of passion and calculated fraud, tracking the machinery of their arguments and evaluating where they succeed or fail.

  ### 1. Dennett: Saving the Distinction via Competence
  Dennett is a compatibilist. He believes free will and moral responsibility are compatible with determinism, provided we redefine "free will" not as a magical ability to break the laws of physics, but as a set of cognitive capacities.

  **The Machinery:**
  For Dennett, the machinery that keeps reactive attitudes (like anger and blame) alive is **reasons-responsiveness**. An agent is responsible if they possess the cognitive machinery to recognize moral reasons and adjust their behavior accordingly.

  **Applied to Fraud vs. Passion:**
  *   **The Fraudster:** Dennett argues the fraudster has high-level control. They planned, they weighed risks, they suppressed moral objections to gain profit. They were *responsive to reasons* (e.g., the reason to make money) but chose to ignore *moral reasons*. Because they had the capacity to do otherwise (if the moral reasons had been weightier to them), they are fully competent agents. Dennett's machinery validates your anger here. The fraudster "could have done otherwise" in the only sense that matters socially: they had the cognitive tools to choose differently.
  *   **The Crime of Passion:** Here, Dennett's machinery detects a glitch in competence. A crime of passion implies a temporary hijacking of the cognitive control system. The agent was overwhelmed by emotion to the point where their capacity to process moral reasons was compromised. They weren't fully "online." Therefore, the reactive attitude of indignation is mitigated. We feel pity or frustration rather than pure moral outrage because their agency was diminished.

  **Where Reactive Attitudes Survive:**
  Dennett saves the intuition that the fraudster *deserves* more punishment by anchoring desert in **social competence**. We blame the fraudster because holding them blame serves a function: it reinforces the norms they knowingly violated. We hesitate with the passion criminal because blaming them doesn't work as well—they weren't in a state to learn from the blame in that moment.

  ### 2. Caruso: Collapsing the Distinction via Causality
  Caruso is a free will skeptic (hard incompatibilist). He argues that because our actions are the result of factors ultimately beyond our control (genetics, environment, luck), "basic desert" is impossible. No one *truly* deserves punishment in a retributive sense.

  **The Machinery:**
  Caruso replaces retribution with the **Public Health Model**. Punishment is not about paying back a moral debt; it is about quarantine, rehabilitation, and safety. The only metric that matters is dangerousness and treatability.

  **Applied to Fraud vs. Passion:**
  *   **The Fraudster:** Caruso collapses the moral distinction. The fraudster isn't "evil"; they are a product of a causal chain that produced greed and low empathy. However, they get locked up longer. Why? Not because they deserve it, but because they are a **higher recidivism risk**. Calculated behavior suggests a stable trait; they are likely to do it again.
  *   **The Crime of Passion:** The passion criminal is also a product of causality (bad temper, stressful situation). They don't deserve *less* punishment in a moral sense (since desert is zero for both). But they get locked up for less time because they are a **lower risk**. Their violence was situational, not necessarily a stable character trait. They need less "quarantine."

  **Where the Distinction Collapses:**
  Caruso collapses the distinction at the level of **ultimate responsibility**. For him, the fraudster's "calculation" and the passion criminal's "explosion" are both determined events. The fraudster didn't *create* their own greed; they inherited or learned it. Therefore, the moral asymmetry you feel (that the fraudster is *worse*) is an illusion. The only real difference is logistical: one is a chronic threat, the other is an acute one.

  ### 3. Which Account Explains the Intuition Better?
  If the goal is to explain why we *feel* okay locking up the fraudster but hesitate with the passion criminal, **Dennett does more work.**

  **Why Dennett Wins on Intuition:**
  Our intuition isn't just about safety; it's about moral quality. We hesitate with the passion criminal not just because they are less dangerous, but because we recognize ourselves in them. We think, "There but for the grace of God go I." We feel the fraudster is alien, cold, and morally distinct.
  *   Dennett validates this. He says, "Yes, your anger is appropriate because the fraudster exercised their agency in a way that violated the social contract, while the passion criminal's agency was compromised." He explains the *emotion* of blame.
  *   Caruso cannot explain the emotion. He has to tell you your outrage at the fraudster is technically irrational (since no one deserves blame). He can explain why we *lock them up* for different durations, but he cannot explain why we *hate* the fraudster more. He asks us to suppress our reactive attitudes, which is psychologically difficult.

  **The "Work" Done:**
  Dennett's account aligns with our lived experience of agency. We feel like we make choices. When someone coldly calculates harm, it feels like a deeper violation of the human community than when someone loses control. Dennett provides a vocabulary for that violation (competence/reasons-responsiveness). Caruso provides a vocabulary for management (risk/safety), which feels sterile compared to the moral weight of the situation.

  ### 4. Blind Spots: Where Both Miss the Asymmetry
  Despite Dennett's advantage on intuition, both theories miss critical aspects of the fraud-vs-passion asymmetry.

  **1. The Structural/Class Blind Spot**
  Both theories focus intensely on the individual agent's psychology (Dennett on their competence, Caruso on their risk profile). Both miss that "Calculated Fraud" is often a crime of privilege (white-collar, requiring access), while "Crimes of Passion" are often domestic or interpersonal.
  *   **The Miss:** Our hesitation to punish the passion criminal might not be about agency (Dennett) or risk (Caruso), but about **contextual desperation** or systemic failure in mental health support. Conversely, our harshness on fraud might be driven by class resentment rather than moral clarity. Neither theorist adequately accounts for the sociological backdrop that makes us view the fraudster as a "monster" and the passion criminal as a "victim of circumstance."

  **2. The "Luck" of Temperament**
  Caruso points out the luck problem, but Dennett tries to solve it. However, both stumble on the biological lottery.
  *   **The Miss:** What if the fraudster has a psychopathic inability to feel empathy (biological), and the passion criminal has a serotonin imbalance (biological)?
      *   Dennett wants to say the fraudster is still responsible if they understand the *rules*, even if they don't feel the *empathy*.
      *   Caruso says neither is responsible.
      *   **The Gap:** Both miss that our intuition might be inconsistent. We might actually be punishing the fraudster *more* simply because their crime is harder to detect and requires more "skill," making it feel more agential, even if both conditions are biologically determined. Both theories assume our intuition tracks moral truth; it might just track **cognitive ease**. It's easier to imagine stopping a cold calculation than an emotional explosion, so we blame the former more. Neither Dennett nor Caruso fully interrogates whether our intuition is a bug, not a feature.

  **3. The Victim's Asymmetry**
  Both focus on the perpetrator.
  *   **The Miss:** A victim of fraud often loses life savings (long-term ruin); a victim of a passion crime might suffer physical trauma or loss of life. Yet we often view the passion crime as "more forgivable." Neither theory adequately explains why the *type* of harm (financial vs. physical) interacts with the *state of mind* to produce our judgment. Dennett focuses on the agent's control; Caruso focuses on the agent's risk. Neither focuses enough on why the victim's suffering is weighed differently depending on the perpetrator's emotional state.

  ### Summary
  Dennett preserves the moral asymmetry you feel by anchoring it in **competence and reasons-responsiveness**, validating your anger toward the fraudster. Caruso collapses the moral asymmetry, treating the difference as merely **risk management**, which explains the sentencing disparity but invalidates your emotional response. Dennett better explains why we *feel* the way we do, but both theories overlook how class, biology, and victim impact complicate the intuition that the fraudster is simply "more free" than the passion criminal.
