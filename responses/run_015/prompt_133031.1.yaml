answer: |-
  The reading room of the Surplus hummed with the low heat of servers and the smell of curing paper. It was two in the morning. Wren Halloway sat at a steel table, the signature of Maret Ost under a lamp that cast a tight circle of light on the page. Anselm Roy stood by the stacks, still in his coat. He looked as though he had not slept since the war ended.

  "You know I can't stop you," Roy said. "The Surplus publishes what it verifies. The Bureau verifies what it publishes. That is the treaty."

  "If it's a treaty, you shouldn't be here," Halloway said. She didn't look up from the signature. "You should be at the Bureau, preparing the morning release. What's the line for Ost's birthday?"

  "'The Architect of Peace.' 'The Unbroken Voice.'" Roy stepped into the light. "We have the copy ready. It is all true. He did architect the peace. His voice was unbroken. We omit the fire because the fire is not the peace."

  "Omission isn't lying, Anselm. I know the Bureau's defense. You say selection is the essence of politics. A map is not the territory, but you need a map to walk."

  "Exactly." Roy rested his hands on the back of the chair opposite her. "A city cannot inhabit a list. If you give people every brick, every receipt, every order, you give them noise. To build a world between people, you must shape the material. You must say *this* matters, and *that* is background. The Bureau's discipline is candour within shape. We tell the truth and still give Terrenne something to live inside."

  Halloway finally looked up. Her eyes were red-rimmed. "Selection isn't lying. I concede that. If I publish the receipt for the fuel that burned Kessel without publishing the order, I have lied by shape just as you have. But there is a difference between shaping a narrative and shaping reality so that the ground disappears."

  "And that is where you stand," Roy said. "You think the Surplus is neutral ground. It isn't. It's a heap. It refuses to rank. That refusal is itself a selection rule. It says all facts are equal. But they aren't. The hour a bridge was mined is not equal to the reason the war ended. By refusing to distinguish, you hand interpretation to whoever has the stamina to dig. That isn't freedom. It's abdication."

  Halloway touched the paper. "Facts are contingent. They could have been otherwise. That makes them fragile. Arguments are strong; you can logic your way out of an argument. You can't logic your way out of a signature. If you destroy the ground, you don't get a new city. You get a city floating in air. When the wind changes, everyone falls."

  "People need shelter more than they need bedrock," Roy said. "You intend to read this at the Convocation. You think you are restoring the ground. What you are doing is removing the roof. Ten years. Every year of this peace is built on the denial of Kessel. The survivors live here because they believe the war ended in a handshake, not a torching."

  "I know what it cost the survivors," Roy continued, before she could speak. "I wrote the speeches that soothed them. I know I am asking them to live in a house with a hidden fire. But if you reveal the fire tomorrow, you don't give them back the district. You just burn the house. You will destroy Terrenne's capacity to act together. You know this."

  Halloway was silent for a long moment. The servers hummed. "Yes," she said. "I concede it. The Convocation may break the city. It may make collective action impossible because no one will trust the hand that signs the peace. I am not doing this to save the city's capacity to act. I am doing it because the ground is gone."

  "Gone?" Roy leaned forward. "The ground is here. We are standing on it. The Bureau never utters a falsehood. Every sentence is verified. Where is the lie, Wren? If every sentence is true, where is the denial physically located? Is it in the syntax? Is it in the ink?"

  "It's in the confidence," Halloway said.

  Roy straightened. "Explain."

  "You say the liar depends on the truth. He must know what he denies to deny it. That gives him a freedom the truth-teller lacks. He can generate alternatives. The truth-teller is stuck with what happened. That's why lying is a temptation of action. It's the capacity to say of what is that it is not. It's how you begin something new."

  "I know the theory," Roy said sharply. "I wrote the manuals."

  "Then you know the trap," Halloway said. "The catastrophe isn't the liar. It's the man who loses contact with fact entirely. The liar knows the truth he hides. The fabricator believes the shape. If the Bureau only selects, you are liars. You know what you are hiding. But if you select for ten years, if you speak only the shaped truth, you stop knowing what you are hiding. You start believing the map is the territory."

  Roy looked at the signature. He looked at his own hands. "We know," he said. "I know Ost signed that order. I know the Kessel district was burned to break the siege. I know the peace required the denial."

  "Do you?" Halloway asked. "Or do you know that the Bureau says the peace required the denial? There is a difference. If everything you say is literally true, then what is it that the Bureau knows and is denying? Where is the denial?"

  Roy opened his mouth, then closed it. He walked to the window. The city outside was dark, save for the security lights of the government quarter. "It is not in the sentences," he said slowly. "The sentences are verified. It is not in the selection. Selection is necessary. It is in the timing. We answer the unwelcome question with the least informative true statement available."

  "That's the procedure," Halloway said. "Where is the lie?"

  Roy turned back. He looked tired, older than when he entered. "It is in the silence between the statements. It is in the assurance that the selection is sufficient."

  "No," Halloway said. "That's still procedural. The lie is in the speaker. It's when you say 'The peace was founded on consensus' and you believe it. Not because you are lying, but because you have said it so many times that the shape has replaced the fact in your mind. You are no longer in contact with the fact that Ost burned Kessel. You are in contact with the fact that the Bureau says he didn't. You have become the fabrication."

  Roy walked back to the table. He looked down at Ost's signature. He did not touch it. "If I believe the shape," he said, "then I am not lying. I am mistaken. But if I am mistaken, I cannot be corrected. A liar can be caught. A man who has lost his bearing cannot be told he is lost."

  "That is the catastrophe," Halloway said. "Not the lie. The loss of the capacity to take bearings."

  "And you?" Roy asked. His voice was quiet. "You have spent ten years in the Surplus. Ten years inside other people's testimony. Receipts. Orders. Casualty lists. You say facts are the ground. But a ground without a world is a desert. You have all the bricks. Do you have a place to stand? Or do you just have a heap?"

  Halloway looked at the signature. She thought of the thousands of boxes surrounding them. The unranked particularities. The hour the bridge was mined. The text of the order. The names appended. "I don't know," she said. "I know what happened. I don't know if I live here."

  Roy nodded. He picked up his hat. "Morning comes in four hours. You will read the name. I will read the peace. One of us will be speaking to a city. The other will be speaking to the air."

  "Anselm," Halloway said. He paused at the door. "When you stand at the podium. When you say 'Maret Ost founded this city on truth.' Will you know what you are saying?"

  Roy held the doorframe. He looked at her, then at the dark room behind her, filled with the verified particulars of a war that officially hadn't happened the way the records said.

  "I don't know," he said. "I know what the sentence requires. I don't know if I remember what the words mean."

  He left. Halloway sat alone under the lamp. She looked at the signature. She looked at the dark. She did not know if she was holding the ground, or if she was just holding paper.
