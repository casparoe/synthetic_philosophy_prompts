  ok so im building this tutoring app for my neice (shes 10 and struggles with math but is really good at reading people) and the devs keep calling the backend "intelligent" just because it adjusts difficulty based on wrong answers. that got me thinking about what intelligence actually is, and now im stuck on my own gut verdicts about different cases.

