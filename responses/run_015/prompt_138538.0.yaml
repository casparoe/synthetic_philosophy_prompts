      3 Groups of 4-5 works well.
      "Tables" are available.
      "Whiteboard" is available.
      "No other materials." -> I need to assume I can bring index cards/paper as facilitator, or use the whiteboard for everything. The prompt says "no other materials" regarding the *room*, but usually, a facilitator brings handouts/cards. I will assume I can bring index cards for the "Structure Deck" as that's standard facilitation, but I should minimize reliance on them. I'll write the Structures on the Whiteboard at the start. That's safer.

