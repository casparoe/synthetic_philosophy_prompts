      The prompt asks: "the moment in the session where the frustration is meant to peak and what I should do if it does not."
      I will designate the end of Round 3 (Minute 60) as the peak. If they aren't frustrated, it means they "gamed" the system (wrote boring structural stuff). I need to penalize boring writing to force them to try agency.
      *New Rule:* To score a "Survival," the Action must be *dramatic* (involve a choice). But dramatic choices usually clash with Structure. This creates the double-bind.

      *(Refining the "Last 10 Minutes")*:
      How to avoid lecture?
      Use a "Reframing Prompt."
      Show, don't tell.
      Provide an example of a sentence that treats structure as décor vs. structure as constraint.

      *(Final check on constraints)*:
      - 90 mins total.
      - 12-15 participants.
      - No "longue durée" until min 75.
      - Invented setting.
      - Short writing.
      - Whiteboard scoring.

      Let's assemble.

