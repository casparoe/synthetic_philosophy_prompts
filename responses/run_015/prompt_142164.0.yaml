  ### Welfare Screening Procedure (WSP) v1.0

  **Purpose:** Determine if an RL run requires Board values judgment or clears on factual grounds.
  **Constraint:** Applicants answer from training setup terms. One follow-up question allowed.

  **Gate 1: Temporal Integration**
  *Question:* Does the system either (a) maintain internal hidden state (e.g., RNN, LSTM) across the timeframe where valence signals are received, OR (b) store past trajectories in a replay buffer where valence scores are updated retroactively (e.g., reward model retraining)?
  *   **No:** **CLEAR.** (Signal dies with episode; no integration).
  *   **Yes:** Proceed to Gate 2.

  **Gate 2: Negative Valence Candidate**
  *Question:* Is there any signal explicitly designated as a penalty, loss, rejection, or minimization target that the system receives during the run? (Exclude purely positive bonuses).
  *   **No:** **CLEAR.** (No candidate for suffering).
  *   **Yes:** Proceed to Gate 3.

  **Gate 3: Counterfactual Efficacy**
  *Question:* If past valence signals were relabeled (e.g., penalty turned to neutral) without changing the environment, would the system's subsequent behavior or weight updates change measurably?
  *   **No:** **CLEAR.** (Signal did no causal work; welfare impact null).
  *   **Yes:** Proceed to Gate 4.

  **Gate 4: Values Threshold (Board Decision)**
  *Action:* Proposal is **FLAGGED**. Board issues one follow-up question regarding magnitude/frequency/avoidance capability. Decision requires two signatures.
  *   **Unanswerable:** If applicant cannot answer a Gate question definitively in one message, default to **FLAGGED**.

  ---

  ### Proposal Analysis

  **A. Warehouse Navigation**
  *   **Gate 1:** No hidden state (Feedforward). No retroactive scoring (Fixed reward). **FAIL.**
  *   **Verdict:** **CLEAR** (Factual).
  *   **Note:** Weight updates persist, but the "subject" resets every 200 steps. Signal integration is limited to species-level learning, not instance-level experience.

  **B. RLHF on 7B LM**
  *   **Gate 1:** No hidden state across episodes, **BUT** uses off-policy buffer with mid-run reward model retraining (retroactive re-scoring). **PASS.**
  *   **Gate 2:** RLHF involves preference rejection/negative feedback. **PASS.**
  *   **Gate 3:** Retraining reward model changes scores of old buffer data, altering gradients. **PASS.**
  *   **Verdict:** **FLAGGED** (Values Call).
  *   **Note:** The retroactive relabeling satisfies the Counterfactual Test explicitly. The system "cares" about past valence enough to update based on new interpretations of it.

  **C. Recurrent Intrinsic Agent**
  *   **Gate 1:** Recurrent state carried for 3 weeks. **PASS.**
  *   **Gate 2:** "We never give it a negative reward." Novelty bonus is positive. **FAIL.**
  *   **Verdict:** **CLEAR** (Factual).
  *   **Note:** Cleared due to lack of explicit negative signal. However, high prediction error *could* be functionally aversive even if labeled as a bonus.

  ---

  ### Rigor Theater & Failure Modes

  1.  **The "Subject" Boundary (Gate 1):** Clearing A assumes welfare requires episode-level continuity. If weight updates encode "trauma" (e.g., catastrophic forgetting induced by penalties), the system-level welfare impact is ignored. We treat the model weights as tools, not the subject, which may be arbitrary.
  2.  **The "Negative" Definition (Gate 2):** Clearing C relies on the engineer's label ("bonus"). If optimizing prediction error creates a drive state analogous to frustration or itch, the procedure misses it because there is no explicit negative scalar. This is the highest risk blind spot.
  3.  **Counterfactual Feasibility (Gate 3):** This test is only actionable where infrastructure supports relabeling (like B). For on-policy runs without buffering, applicants cannot answer this without breaking the run. The "Unanswerable -> Flag" rule protects us but creates bottlenecks.
  4.  **Integration vs. Influence:** Gate 3 measures causal influence, not welfare. A system can be causally influenced by a signal without "suffering" from it. We are using causal impact as a proxy for moral weight, which is a philosophical leap disguised as engineering.

  Verdict: B
