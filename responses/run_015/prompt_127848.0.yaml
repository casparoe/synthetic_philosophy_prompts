  ### Brainstorm: The Biological-Aging Analogy Breakdown

  Before drafting the statement, we must clarify where the metaphor of "societal aging" fails, as this is the primary source of semantic friction.

  1.  **No Genetic Telomeres:** Institutions lack a fixed genetic code that degrades with replication. A constitution can be amended indefinitely without inherent molecular decay.
  2.  **No Obligatory Senescence:** Biological organisms *must* die; regimes do not. The Vatican, the British Monarchy, and certain legal codes show continuity over millennia without "death" in the biological sense.
  3.  **Lamarckian Inheritance:** Institutions accumulate knowledge. A 200-year-old state has more data and administrative tech than a 10-year-old one. Biological organisms reset knowledge every generation.
  4.  **Cause of Death:** Organisms often die of internal failure (organ shutdown). Regimes are almost always killed by external competition or internal overthrow (violence), not simply "stopping."
  5.  **Modularity:** You can replace the engine of a state (economic system) without killing the organism. Biological aging is systemic; institutional decay is often sectoral.

