prompt: |-
  ok so I'm in this course on EU governance and we keep talking about the democratic defecit like it's just a design flaw, but I think there's a weirder tension nobody's naming properly. I want you to write an essay on whether the EU's democratic deficit is actually structurally required for ever-closer union to work, or if that's just an excuse. Specifically, weigh the idea that sovereignty in the EU isn't really being 'pooled' in the usual zero-sum sense, but transformed into something like 'procedural sovereignty' — the right to shape the rules of integation — while 'substantive sovereignty' over actual outcomes gets hollowed out. The essay should look at whether this tradeoff is democratically legitimate: does gaining procedural influence over EU institutions compensate for losing substantive control at the national level? Reach an actual conclusion, don't just sit on the fence. And don't just list the usual complaints about the Commission being unelected — I want you to dig into whether ever-closer union can even conceptually survive full democratic accountability, or if the two are basically incompatible. I'm probably missing something obvious here but my tuter said the argument needs to be sharper.
