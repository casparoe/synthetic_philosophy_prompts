      *   **Evaluation:** Is this trade-off democratically legitimate? Does procedural influence compensate for lost substantive control?
      *   **Constraint:** Reach a definite conclusion (no fence-sitting).
      *   **Constraint:** Avoid generic complaints about the unelected Commission; dig deeper into the compatibility of "ever-closer union" and full democratic accountability.
      *   **Tone:** Academic, sharp, analytical (tutor wants a sharper argument).
