  ### 3. Case Explanations (Column C)

  *   **A:** With antipathy dissolved and no stakeholders harmed, there is zero residual mischief.
  *   **F:** The only remaining mischief is the agent's internal psychological conflict, which lacks external harm.
  *   **C:** A breach of marital expectation utility remains, creating insecurity even without immediate detection.
  *   **D:** The pain of deception regarding professional integrity survives, though the pain of moral sin is discounted.
  *   **I:** Secondary mischief remains due to the long-term erosion of a utility-maximizing social convention.
  *   **B:** Forcing sexual information upon non-consenting neighbors constitutes an intrusion regardless of moral judgment.
