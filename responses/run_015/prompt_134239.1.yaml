  Mr. X experiences inevitable fatal arrhythmia; cardiac arrest occurs at 10:00:00 regardless of intervention. Clinician Y, aiming to end his life now, injects lethal potassium chloride. The drug and arrhythmia both suffice for death. Physiological cessation occurs at 10:00:00. The arrhythmia's causal chain was complete and uncontrollable before injection. The clinical course is indistinguishable from drug effect.

  **Variant B**
  Mr. X experiences stable rhythm; no fatal arrhythmia occurs. Cardiac arrest would not occur without intervention. Clinician Y, aiming to end his life now, injects lethal potassium chloride. The drug suffices for death. Physiological cessation occurs at 10:00:00. No other fatal mechanism is present. The clinical course is indistinguishable from natural mechanism.

  | Criterion | A Verdict | B Verdict | Justification |
  | :--- | :--- | :--- | :--- |
  | Sequence | Killing | Killing | Injection initiates a sufficient causal sequence terminating in death in both variants. |
  | Baseline | Allowing | Killing | Patient is not worse off than if agent never existed in A, but is in B. |
  | Difference-making | Allowing | Killing | Death occurs without clinician's movement in A, but requires it in B. |

  **Load-bearing Feature**
  Causal overdetermination in Variant A. It forces the Sequence criterion to count the injection as a cause in A, matching B, while Baseline and Difference-making still track the inevitability.

  **Consequence of Removal**
  Without overdetermination, the drug is preempted in A. Sequence then classifies A as Allowing, aligning all three criteria and eliminating the intended divergence.

  **Internal Reply**
  Sequence tracks physical agency, not moral luck. Since the clinician physically engaged a lethal mechanism in both, the metaphysical description of 'doing' remains constant, even if moral responsibility varies via other criteria. This preserves the distinction's ontological grounding despite counterintuitive moral implications.
