  1. The current levy on wages versus capital presupposes that labour is merely a cost to be efficientised, valuing the economic output over the human agent providing it. It treats employment instrumentally, as a mechanism for generating taxable income rather than a substantive social contribution.
  2. This fiscal structure quietly rules out the notion that work confers dignity or community standing, ignoring the relational bond between employer and employee. It dismisses the idea that labour is a human activity worthy of protection in its own right, distinct from mere productivity.
  3. Honestly, this arrangement likely stems from administrative convenience rather than a coherent philosophy, as withholding tax from payrolls is far simpler than assessing levies on machinery. The policy is underdetermined by ideology, favouring historical ease of collection over any moral stance on employment.
  4. A stark contradiction arises when ministers champion full employment while the tax code financially incentivises firms to replace workers with capital assets. The state rhetorically honours the dignity of work whilst fiscally penalising the hiring of human beings.
  5. If meaningful work were treated as a public good, the Treasury would need to shift the burden from payroll taxes to capital depreciation or automation levies. Subsidies would reward labour retention, recognising the social value of employment beyond its contribution to GDP.
