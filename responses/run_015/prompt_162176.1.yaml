answer: |-
  Here is the spec. I've structured this as a requirements document for a theory of induction, treating the "Problem" not as a metaphysical mystery but as an engineering constraint on embedded agents.

  I have categorized each requirement as **Non-Negotiable** (if a theory fails this, it doesn't solve the problem) or **Aesthetic** (this is a preference of the Bayesian/Rationalist camp, not a logical necessity).

  ### The Desiderata for a Theory of Induction

  #### 1. The Escape Clause (NFL Avoidance)
  *   **Requirement:** The theory must explicitly state why the learner is not operating under the uniform distribution over all possible worlds assumed by No-Free-Lunch (NFL) theorems. It cannot simply assert "the world is compressible"; it must locate the source of that compressibility (e.g., in the physics of the universe, the structure of the agent, or the definition of "prediction").
  *   **Case:** NFL proves that without bias, learning is impossible. A solution that ignores this is mathematically false. A solution that says "we assume the world is simple" without explaining *why that assumption is licensed* is just hiding the premise.
  *   **Status:** **Non-Negotiable.**

  #### 2. The Bootstrapping Constraint (The Pulley)
  *   **Requirement:** The justification for the inductive bias cannot rely on the success of past induction. You cannot use data to validate the prior that validates the data. The theory must identify the "ground" that stops the infinite regress, whether that ground is pragmatic, axiomatic, or evolutionary.
  *   **Case:** This is your "Pulley Problem." If the answer to "why trust induction?" is "because it worked before," you have committed a category error. A successful theory must either accept a foundational dogma (and admit it) or dissolve the need for external justification.
  *   **Status:** **Non-Negotiable.**

  #### 3. The Non-Stationarity Clause (Drift Handling)
  *   **Requirement:** The theory must prescribe how to weight evidence when the generating process changes (regime drift). It must offer a mechanism for forgetting or discounting old data that is not ad-hoc.
  *   **Case:** Standard Solomonoff induction assumes a static computable environment. Real agents live in worlds where laws drift (e.g., policy changes, market regimes, biological adaptation). A theory that only works for static environments is a theory of curve-fitting, not induction.
  *   **Status:** **Non-Negotiable.**

  #### 4. The Sample Complexity Constraint (Fast Convergence)
  *   **Requirement:** The theory must guarantee convergence within a finite, relevant number of observations, not just asymptotically. It must distinguish between "learning eventually" and "learning before you die/run out of compute."
  *   **Case:** Asymptotic consistency is cheap; you can have a prior that ignores all data until observation $10^{100}$ and then converges. That is useless. The problem of induction is a problem of *finite* data. If the theory doesn't constrain sample complexity, it doesn't solve the practical problem.
  *   **Status:** **Non-Negotiable.**

  #### 5. The Operational Cash-Out
  *   **Requirement:** The theory must translate into actionable advice on hyperparameters (e.g., learning rates, regularization strength, prior width). It cannot end at "be coherent."
  *   **Case:** If the theory cannot tell a forecaster how much to update on a black swan event or a regime change, it is metaphysics, not epistemology.
  *   **Status:** **Non-Negotiable.**

  #### 6. The Unique Prior Axiom
  *   **Requirement:** There exists exactly one rationally permissible prior for a given state of information (e.g., the Universal Prior).
  *   **Case:** This is often demanded to prevent "subjectivity" from contaminating the truth.
  *   **Status:** **Aesthetic (Bayesian Tribalism).** This is the demand I would demote. Requiring a *unique* prior conflates "rational constraints" with "logical uniqueness." You can satisfy all other desiderata with a *class* of admissible priors rather than a single point. Demanding uniqueness is often a proxy for wanting logic to do the work of empirical discovery.

  ---

  ### The Impossible Pair

  You guessed the tension lies between wanting an *a priori* justification and wanting the prior to be *tied to the world*. I agree, but I will sharpen the conflict. The two requirements that cannot be jointly satisfied are:

  **The Bootstrapping Constraint** vs. **The Escape Clause.**

  Here is the deadlock:
  1.  To satisfy the **Escape Clause**, you must claim that *this* world is special (compressible, regular, non-adversarial) compared to the space of all possible worlds covered by NFL.
  2.  To satisfy the **Bootstrapping Constraint**, you cannot use empirical evidence (induction) to prove *this* world is special, because that would use induction to justify induction.

  You are left with two bad options:
  *   **Option A (Dogmatism):** You assert the world is compressible as an *a priori* truth. This satisfies Bootstrapping (no empirical circularity) but violates the spirit of Empiricism (you are making a factual claim without evidence).
  *   **Option B (Circularity):** You assert the world is compressible because it has looked compressible so far. This satisfies the Escape Clause (you have a reason to think you aren't in the worst case) but violates Bootstrapping (the Pulley).

  **Verdict:** You cannot have a justification for induction that is both *empirically grounded* (explains why we beat NFL) and *non-circular* (doesn't use induction). You must sacrifice one. Most "solutions" hide this trade-off. A successful theory must explicitly admit which horn of the dilemma it is grasping.

  ---

  ### The Killer Requirement

  The single requirement that does the most work in ruling out the usual candidate answers is:

  **The Sample Complexity Constraint (Fast Convergence).**

  Here is how it filters the field:

  1.  **Rules out the "Simplicity-Prior Story" (Solomonoff Induction):**
      Solomonoff induction is the gold standard for the "Simplicity" camp. However, it is uncomputable, and even its computable approximations have convergence bounds that are astronomically slow. It guarantees convergence in the limit, but it offers no guarantee that you will learn the right pattern before the sun explodes. By demanding *finite, relevant* sample complexity, you force the theory to move from "Universal Prior" to "Regularization Schedules." It kills the idea that "Simplicity" alone is sufficient; you need *speed*, which requires bias stronger than mere computability.

  2.  **Rules out the "Induction Has Worked So Far" Story:**
      This story is inherently backward-looking. It justifies the *method*, but it says nothing about the *rate* of learning in a new regime. It cannot tell you how many observations you need to trust a new pattern. It fails the Operational Cash-Out, but it fails Sample Complexity more fundamentally because it offers no bound on error probability over finite $N$.

  3.  **Rules out the "Problem is Badly Posed" (Dissolution) Story:**
      The dissolutionists (often Wittgensteinians or certain pragmatists) argue that asking for a justification is a confusion. This might survive the Bootstrapping Constraint (by denying the need for justification), but it crashes hard into Sample Complexity. A forecaster *must* decide how much to regularize. If the theory says "the question is nonsense," it fails the Operational Cash-Out. But specifically, if it cannot distinguish between a learner that converges in 10 steps and one that converges in 10,000 steps, it is useless for embedded agents.

  **Why this is the killer:**
  Most philosophical treatments of induction are satisfied with *consistency* (in the limit). By shifting the metric to *sample efficiency* (finite $N$), you force the discussion out of metaphysics and into statistical learning theory. It forces the group to admit that "Truth" is not the only variable; "Cost of Error" and "Time to Convergence" are equally part of the induction problem. This requirement alone forces you to abandon pure Solomonoff induction and pure Humean skepticism in favor of something that looks like online learning with regret bounds.
