          *   (b) The "Stoic Tech" highlights the "empirical vs. rational" gap.
          *   (c) The "Cumulative" highlights the "unnoticed harm" gap.
          *   (d) The "Replacement" highlights the "beneficiary" gap.

  6.  **Final Review against User Persona:**
      *   Use terms like "IACUC," "protocol," "attending vet," "humane endpoint."
      *   Keep it practical. The user wants to know how this affects the *form*.
      *   Ensure the distinction between "Direct Duty" and "Indirect Duty" is clear in the translation.

  7.  **Writing the Content (Mental Sandbox):**
      *   *Self-Correction on Case (b):* If the tech shows no blunting, Classical Kant still says it's wrong. Why? Because the *action* treats a sentient being as a mere means in a way that contradicts the virtue of the agent. It's not about the *result* (blunting), it's about the *act*. I need to make sure I don't slip into "maybe she blunted and we didn't see it." Kant says the act *itself* is the violation of duty to self.
      *   *Self-Correction on Case (d):* Replacement. For the Vet, Replacement removes the "cost to animal." For Classical Kant, Replacement removes the "occasion for sin." If the in silico model is worse for science, Kant might say "Do the animal study, but do it virtuously." The Vet says "Don't do the animal study if you don't have to." This is a crucial divergence.

  8.  **Final Polish:** Check US spelling (behavior, program, center, modeling). Ensure the "Residue" section clearly answers "Whose hole is it?"

  *(Self-Correction during drafting)*: Wait, I need to be careful with the Modern Kantian section. Korsgaard is the main name here. She argues that because we value our own animal nature (sentience) as a reason-giving source, we must value it in others. This *does* look like sentience ethics. I will confirm the user's suspicion but note the structural difference (reasons vs. experiences).

