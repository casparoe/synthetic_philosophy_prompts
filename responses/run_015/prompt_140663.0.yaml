          *   *Modern Kant:* Cost is real (violation of the animal's good).
          *   *Residue:* Classical Kant struggles here. If the act is secret, is it still wrong? Kant says yes (duty to self), but the mechanism is opaque. Vet vocab handles this easily ("cost to animal").
      *   *Case (b): The Stoic Technician.*
          *   *Vet:* Procedure has cost (animal pain).
          *   *Classical Kant:* If the technician shows *no* blunting, is there a duty violation? Kant would say yes, because the *maxim* of the action is wrong, regardless of empirical psychological effects. But operationalizing "maxim" is hard for a vet.
          *   *Residue:* This is a hole in the Vet's ability to measure "character," but also a hole in Classical Kant's empirical claim (cruelty *does* blunt, but what if it doesn't?).
      *   *Case (c): Cumulative Severity (Low-grade, unnoticed).*
          *   *Vet:* Real cost (Five Domains, lifetime distress).
          *   *Classical Kant:* Why care? It doesn't corrupt humans if unnoticed.
          *   *Modern Kant:* Care, because it violates the animal's good.
          *   *Residue:* Classical Kant fails to capture "cumulative severity" unless it impacts humans. Vet vocab is superior here.
      *   *Case (d): Replacement (In Silico).*
          *   *Vet:* Replacement is good *for the animal* (removes the subject of harm).
          *   *Classical Kant:* Replacement is good *for humans* (no need to risk character).
          *   *Residue:* The motivation differs. If an in silico model is less reliable but saves "human character," Classical Kant might prefer it? No, because the duty is to science too. But the *reason* replacement is mandatory differs. Vet: "Save the animal." Kant: "Save the human soul."

  5.  **Drafting the Response (Iterative refinement for tone and constraints):**
      *   *Tone:* Professional, respectful, precise. Acknowledge the user's expertise.
      *   *Constraint Check:* US Spelling (labor, program, center). No consequentialism (don't say "pain causes bad outcomes," say "pain violates duty").
      *   *Structure:*
