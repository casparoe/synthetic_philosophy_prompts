answer: |-
  Your diagnosis is remarkably precise: you are indeed conflating **logical coherence** with **normative authority**, and you are treating a **scalar property** as a **binary switch**. The exhaustion you feel stems from trying to force a relational, moral concept into the rigid mold of analytic logic.

  Here is the diagnosis of the false presuppositions, the resolution to the dilemma, and the falsification conditions you requested.

  ### 1. The False Presuppositions

  **Presupposition A: Standing is a Logical Truth-Condition**
  Your friend's argument relies on the idea that blaming without standing is like asserting "I am not speaking." This treats standing as a *felicity condition* of speech (like a promise requiring the intention to keep it). However, blame is not a constative utterance (describing a state of affairs); it is a normative demand. When we say a hypocrite "lacks standing," we do not mean their statement is logically false or self-undermining in a syntactic sense. We mean they lack the **moral authority** to issue the demand.
  *   **The Error:** You are looking for a contradiction in the *proposition* ("You ought not do X"), but the contradiction lies in the *relationship* between the blamer's actions and the norm they are invoking. Structural hypocrisy reveals a lack of commitment to the norm, not a logical error in the sentence.

  **Presupposition B: Standing is Binary**
  You assumed that one either has standing or one does not. This leads directly to your "swallowing blame" paradox: if standing is binary and structural complicity removes it, then in an unjust world, no one has standing.
  *   **The Error:** Standing is **scalar**. One can have *more* or *less* standing. A person deeply embedded in an unjust system may have *diminished* standing to blame others for similar embedding, but not *zero* standing. They may still have sufficient standing to blame someone who is *more* complicit, or who acts with *less* regard for the harm. This preserves the practice of blame without requiring moral purity.

  ### 2. The Resolution: The Commitment Model

  To escape your friend's "performative contradiction" trap without falling into the "moral purity" trap, we must adopt a **Commitment Model** of standing.

  On this view, standing to blame is grounded in the blamer's **commitment to the moral norm** they are invoking.
  *   **Token Hypocrisy (Your Friend's View):** I blame you for lying while I lie. This shows I do not treat the norm "do not lie" as binding on me. My commitment is defective.
  *   **Structural Hypocrisy:** I blame you for participating in exploitation while I participate in analogous exploitation. This *also* shows a defective commitment, but the defect is distributed.

  **Why this avoids the "Purity Threshold":**
  The Commitment Model does not require you to be *free* of the sin to blame it; it requires you to *repudiate* the sin. If I am structurally complicit in animal agriculture but actively work to minimize it, donate to alternatives, and acknowledge my complicity, I demonstrate a commitment to the norm "reduce exploitation." My standing is not erased; it is merely calibrated. I cannot blame you with the authority of a saint, but I can blame you with the authority of a fellow traveler trying to do better.

  **Why this avoids the "Swallowing Blame" Paradox:**
  Because standing is scalar, we compare the *degree* of commitment and the *degree* of violation.
  *   Agent A (High complicity, low regret) blames Agent B (Low complicity, high regret). -> A lacks standing.
  *   Agent B (Low complicity, high regret) blames Agent A (High complicity, low regret). -> B has standing.
  *   Agent C (Medium complicity) blames Agent D (Medium complicity). -> C has *some* standing, perhaps enough to prompt reflection, though not enough to demand penance.

  This dissolves the binary trap. We do not need purity; we need **comparative authority**.

  ### 3. What Would Change My Mind (Falsification Conditions)

  You asked me to state clearly what would convince me that structural hypocrisy does *not* undermine standing, and where my reasoning is vulnerable. Since I am arguing for the view that structural hypocrisy *does* undermine standing (in a scalar way), here are the conditions under which I would abandon this position:

  **Argument 1: The "Ought Implies Can" Defense of Standing**
  If it could be demonstrated that structural complicity is **non-voluntary** in a way that token hypocrisy is not, my reasoning would fail.
  *   *The Consideration:* Token hypocrisy involves a choice (I *can* stop lying right now). Structural hypocrisy often involves unavoidable participation in capitalism, supply chains, or state violence. If standing requires a violation of a norm one could reasonably have avoided, and structural participation cannot be reasonably avoided, then structural participation cannot defeat standing.
  *   *Why this threatens my view:* If I concede that structural complicity is involuntary, I must concede it is not hypocrisy in the relevant sense. It becomes "tragic entanglement" rather than "normative inconsistency." If it's not hypocrisy, it doesn't touch standing.
  *   *My Vulnerability:* I am vulnerable on the definition of "reasonable avoidance." If the threshold for avoiding structural sin is impossibly high, my scalar model collapses because everyone's standing is diminished to effectively zero. To save my view, I must prove that there are meaningful degrees of mitigation (e.g., donation, advocacy, consumption choices) that count as "voluntary commitment," even if total escape is impossible.

  **Argument 2: The "Message Over Messenger" Principle**
  If it could be shown that the **utility of blame** is entirely independent of the blamer's status, my view would be overturned.
  *   *The Consideration:* Some consequentialists argue that standing is a fetish. If the blame is *true* and the blame *helps* the wrongdoer improve, the blamer's hypocrisy is irrelevant. If the goal of blame is moral improvement rather than retributive authority, then structural hypocrisy is irrelevant noise.
  *   *Why this threatens my view:* This attacks the foundational premise that standing is about *authority* rather than *outcome*. If standing is merely a heuristic for effective communication, and structural hypocrites can communicate effectively, then they have standing.
  *   *My Vulnerability:* My reasoning relies on the deontological intuition that blame is a demand for recognition, not just a causal tool. If I cannot defend the idea that *who* speaks matters morally (not just pragmatically), the Commitment Model collapses.

  **Argument 3: The Indeterminacy of "Structural Analogy"**
  If the concept of "structurally analogous exploitation" proves to be too vague to adjudicate standing, my model fails practically.
  *   *The Consideration:* In token hypocrisy, the act is identical (lying vs. lying). In structural hypocrisy, the analogy is contested (is eating imported fruit analogous to working in a sweatshop?). If we cannot objectively measure the "distance" between the blamer's complicity and the blamed's wrong, the scalar model becomes arbitrary.
  *   *Why this threatens my view:* A theory of standing that cannot be applied is useless. If every blame interaction devolves into a meta-debate about who is more structurally complicit, the practice of blame is paralyzed just as surely as by the binary purity model.
  *   *My Vulnerability:* I have no clean metric for "degrees of structural complicity." My reasoning is vulnerable to the charge that it invites infinite regress (who judges the judge's complicity?).

  ### Summary of the Diagnosis

  You were stuck because you accepted your friend's premise that standing is a **logical property of the utterance** rather than a **moral property of the relationship**.

  1.  **Shift the Logic:** Move from "Performative Contradiction" (Logic) to "Normative Inconsistency" (Ethics).
  2.  **Shift the Metric:** Move from "Binary Standing" (On/Off) to "Scalar Standing" (More/Less).
  3.  **Shift the Requirement:** Move from "Moral Purity" (Sinless) to "Normative Commitment" (Repudiation of the wrong).

  If you accept these three shifts, structural hypocrisy undermines standing *without* requiring purity, and *without* swallowing the practice of blame. It simply makes blame a matter of humble negotiation rather than righteous declaration.
