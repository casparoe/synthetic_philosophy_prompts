      *   **Tension 4: Non-Existence (The "Asymmetry" Problem).**
          *   *Bentham:* Classical utilitarianism usually implies "Total View" (more happy beings = better).
          *   *Problem:* If lives are net negative (suffering > pleasure), bringing them into existence is bad.
