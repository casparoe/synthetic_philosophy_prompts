          *   *Evidence:* Bentham demanded evidence for legal intervention. But he also understood *probabilities* (in punishment).
          *   *Conflict:* Does the *risk* of massive suffering outweigh the *benefit* of food security/efficiency? Bentham's calculus includes "propinquity" (nearness) and "certainty." If sentience is uncertain, the expected value drops. But if the magnitude is $10^{12}$, even a small probability ($p$) might outweigh the certain benefit of vertebrate replacement.
          *   *Extrapolation:* Bentham didn't have Bayesian risk assessment. I need to apply expected utility theory to his framework.

      *   **Tension 2: Killing vs. Suffering.**
