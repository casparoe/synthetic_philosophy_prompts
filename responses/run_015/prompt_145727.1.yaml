          *   *Crucial Caveat:* Where I am speaking, not Bentham.

  5.  **Refining the "Attribution" Constraint:**
      *   The user specifically asked: "Tell me how much of your answer is actually fixed by what Bentham believed and how much you're supplying yourself."
      *   I need to make this a distinct section or weave it tightly. A distinct section at the end or clear signposting throughout is better. Let's use signposting throughout and a summary at the end.
