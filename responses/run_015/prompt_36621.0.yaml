  The **orbit** drifted further from the page,
  The **belt** was holding nothing but the air.

  The **belt** could not absorb a curved space,
  No **prediction** could rescue the old frame,
  The **orbit** was a line on bending light,
  No **patch** could fix the foundation now,
  The **anomaly** was not a planet but a truth,
  Where geometry outgrew the static **law**.

  The leather **belt** tore beneath the **patch**,
  No **prediction** could save the growing **anomaly**,
  The **orbit** curved away from the strict **law**.

  ### Craft Notes

  The sestina form enacts the protective belt: the six end-words remain fixed while the lines around them struggle to accommodate them. In stanzas 1–3 (progressive), the words gain semantic depth; "patch" implies repair and discovery, "law" implies authority, and "anomaly" becomes a guide. By stanzas 4–6 (degenerating), the syntax strains to place these words, mirroring ad hoc hypothesizing. "Patch" becomes fragile ("thin as glass"), "law" becomes a burden ("iron chains"), and "anomaly" refuses resolution.

  I retained all six end-words in the envoi rather than breaking the form, as a complete structure collapsing under its own weight is more poignant than a fragmented one. The final line lands on "law" because the hard core is what ultimately breaks; the word remains, but its authority is superseded by curvature. The repetition of "law" at the end of stanza 6 and the poem emphasizes this finality.
