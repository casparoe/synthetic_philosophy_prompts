prompt: |-
  Write an essay on whether populist movements are actually wrong about democracy, or just wrong about what 'the people' are. I think the usual take is that populists pretend there's one unified will and then use it to crush minorities. But what if the deeper mistake is treating a distribued preference profile like it's a single agent with intentions — like saying 'France wants X' when really there's just a cluster of voters with overlapping but incompatible reasons? Weigh whether this ontological slip actually explains why populist rhetoric feels so persausive even to people who'd reject authortarianism. Reach a conclusion: is the problem with populism mainly moral (it suppresses dissent) or mainly conceptual (it reifys a statistical artifact into a sovereign mind)? Defend one side, don't sit on the fence.
reasoning: |-
