          *   Why do people buy it? Hyper-active Agency Detection.
          *   It's easier to think "France is angry" than "43% of demographic A and 30% of demographic B are frustrated for different reasons."
          *   This explains why non-authoritarians get swept up; it feels like common sense, not tyranny.
      *   **Body Paragraph 3: From Conceptual to Moral.**
          *   How does the conceptual error force the moral error?
          *   If "The People" has one will, dissent isn't just difference; it's malfunction or treason.
          *   You can't compromise with a singular will.
          *   Therefore, authoritarianism is the *logical conclusion* of the ontology, not just an accidental abuse.
      *   **Body Paragraph 4: Counter-argument & Rebuttal.**
          *   Counter: But they *do* crush minorities, that's the real harm.
          *   Rebuttal: True, but that harm is unintelligible without the prior conceptual lie. You can't suppress the "enemy of the people" if you haven't first defined "the people" as a singular entity with enemies.
      *   **Conclusion:**
