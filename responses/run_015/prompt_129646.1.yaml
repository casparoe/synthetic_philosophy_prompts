      *   **Part (c) [6 marks]:** Underdetermination of reward functions. If multiple rewards fit data but disagree on new scenarios (unlocked fridge), does this mean IRL tells us nothing?

  3.  **Analyze the Student's Answer:**

      *   **Part (a):**
          *   *Claim:* IRL runs RL backwards (Reward given $\to$ Policy vs. Trajectories given $\to$ Reward).
          *   *Claim:* Needs MDP structure (S, A, T, $\gamma$) known. Reward unknown.
