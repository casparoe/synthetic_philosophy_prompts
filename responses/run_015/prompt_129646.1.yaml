      *   **Part (b):**
          *   *Claim:* Objection is "half right."
          *   *Claim:* Analogy on constraints: Budget set in RPT = Locked door in IRL. If constraints aren't modeled, preferences are misidentified.
          *   *Claim:* Disanalogy on Belief/Desire Holism. In EU theory, beliefs/desires identified jointly. In IRL, transition model (beliefs/physics) is *input*, not fitted. Therefore, reward (desire) is isolated.
          *   *Claim:* Non-optimality handled by temperature parameter (noise vs. desire).
          *   *Assessment:* This is the crux. The student argues IRL avoids the holism problem because the dynamics ($T$) are known/fixed, unlike in standard decision theory where beliefs are inferred from choices alongside preferences. This is a strong, specific point relevant to the course ("belief/desire holism worry").
          *   *Critique:* Is it true that $T$ is *known*? In IRL, usually $T$ is assumed known or learned separately. If $T$ is learned from the same data, holism returns. The student assumes $T$ is "pinned down by the modeller." This is a standard assumption in basic IRL but worth probing. The comparison to RPT is good. The handling of the "temperature" as separating noise from desire is a bit simplistic (temperature scales rationality, doesn't necessarily separate systematic bias from noise), but acceptable for this level.

      *   **Part (c):**
          *   *Claim:* Underdetermination is "boring kind" (affine transformations).
          *   *Claim:* Affine transformations don't change preferences/actions.
          *   *Claim:* If rewards disagree on action, fit is wrong (data too few, class too rich).
