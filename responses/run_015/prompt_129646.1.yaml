      *   *Part (b):* The student claims IRL pins down beliefs ($T$) because the modeller inputs them. This is the standard "known dynamics" IRL assumption. It effectively sidesteps the holism worry *if* that assumption holds. This shows good course knowledge. I should validate this.
      *   *Part (c):* This is the dealbreaker. The question posits rewards that *disagree on action*. The student says "Utility functions are only ever unique up to positive affine transformation... functions that differ only in that way will never disagree." This is true, *but* the question premise is that they *do* disagree. Therefore, they are *not* just affine transformations of each other. The student fails to recognize that IRL suffers from non-affine ambiguity (the degeneracy problem). They treat it as a standard utility identification issue. This is a conceptual error. I need to be firm here.

  7.  **Finalizing the Output Structure:**
