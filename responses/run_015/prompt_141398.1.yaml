answer: |-
  **H:** Let's look at the Survey's practice. You see a charter sentence protected from revision and call it analytic. I see a node in a web so heavily loaded that cutting it collapses the network. When they recalibrate the instrument rather than amend the salinity threshold, that's not meaning protecting truth; it's convenience protecting investment.

  **D:** It's not mere convenience. The charter sentences are constitutive. They don't describe the domain; they constitute the practice of describing it. To reject the salinity threshold isn't to make a new discovery about water; it's to stop doing the Baseline Survey. The asymmetry is real: you can revise empirical claims within the framework, but revising the framework changes the subject.

  **H:** "Changes the subject" is the dogma talking. If I reject the threshold, I'm still talking about water, still measuring salinity. I'm just proposing a better taxonomy. You're mistaking institutional inertia for semantic necessity. Conventions don't confer truth; they confer utility. The Survey protects the charters because rewriting the handbook is expensive, not because the sentences are true in virtue of meaning.

  **D:** I'll concede the epistemological ambition. The charters aren't immune to revision *in principle*, and stipulation can't magic truth into terms already in meaningful use. But there's a modest semantic role left. The distinction marks sentences whose rejection requires a change in linguistic policy rather than a change in belief. That asymmetry explains why the Survey treats the conflict as defective measurement rather than falsification.

  **H:** But "linguistic policy" is just downstream disruption costs by another name. You haven't found a semantic property; you've found a pragmatic gradient. Now, consider the stress case: Two charter sentences, equally entrenched, introduced by stipulation, entail contradictory predictions in a new region. One must break.

  **D:** Then the framework is inconsistent. We must determine which charter was essential to the identity of the practice.

  **H:** Essential by what metric? Both were stipulated. Both were protected. Now you're forced to choose. Is breaking one a discovery that it wasn't *really* analytic? Or a decision that it's no longer useful?

  **D:** It's a discovery that the conceptual space was ill-formed. But the repair isn't arbitrary. We look for the minimal revision that preserves the Survey's core aims. That suggests some charters are more constitutive than others.

  **H:** Or it suggests some are more useful. When you choose, you aren't uncovering a prior semantic status. You're making a legislative decision. If the distinction can't tell you *which* charter to keep before the conflict arises, it isn't doing explanatory work. It's just a label we stick on the winner after the pragmatic fight is over.

  **D:** I'll grant it doesn't predict the outcome. But it describes the *kind* of outcome. We aren't saying "the world changed." We're saying "our rules were incompatible." That modal distinction—between rule-conflict and world-conflict—requires something like the analytic–synthetic divide, even if the boundary is fuzzy.

  **H:** It requires a distinction between rules and claims, not analytic and synthetic truths. You can have constitutive rules without claiming they are true in virtue of meaning. You're clinging to the vocabulary because you think without it, you lose normativity. But I can have norms without metaphysics.

  **D:** And I'm saying norms without semantic grounding look like mere power. If the choice is purely pragmatic, why argue about it? Why not flip a coin? We argue because we think one reading respects the practice's identity better. That appeal to identity is the ghost of analyticity.

  **H:** It's the ghost of pragmatism. We argue about what works best. The "identity" is just the set of commitments we prefer not to lose.

  ***

  **Closing Note**

  **H's Strongest Point:** The "conflict case" reveals that protected status is retrospective. If two charters conflict, pragmatic choice determines which survives, undermining the claim that analyticity *guided* the preservation.
  **D's Strongest Point:** The practice involves a qualitative asymmetry in *how* revisions are justified (rule-change vs. fact-update), which pure holism flattens into a single metric of entrenchment.
  **Quine Interpretation:** The dialogue turns on whether Quine killed the *semantic notion* of analyticity or only its *explanitory utility* for epistemology. D defends the latter; H argues the former collapses without the latter.
