answer: |-
  You have put your finger on a precise and under-named mechanism in contemporary ethics. You are right to feel that Weber, Adorno, and Arendt provide the *genealogy* but not the specific *syntax* of the argument you are seeing. Weber explains why work is sacred; Adorno explains why free time is hollow; Arendt explains the categories of activity. None of them quite name the specific rhetorical move where **the critique of work surrenders to the metrics of work.**

  There is no single canonical term for this specific argumentative shape, though it sits at the intersection of Critical Theory and Human Capital Theory. The closest existing concept is **Recuperation** (from Situationist International), which describes how radical critique is absorbed by the system it opposes. However, "recuperation" is usually applied to political movements or art, not necessarily to the micro-ethics of time management.

  Since you asked for a carving and, if necessary, a coinage, I propose we call this phenomenon **Productive Capture**.

  Here is the carving of the concept, the relationship between its two halves, and how to identify its boundaries.

  ### 1. The Name: Productive Capture
  **Definition:** *Productive Capture* occurs when the justification for non-work (leisure, rest, limitation of hours) is legitimated exclusively through the instrumental values of work (productivity, capacity, efficiency, employability). It is a form of discursive recuperation where the resistance to work reinforces the hegemony of work by accepting its measure of value.

  **The Underlying Ontology:** This phenomenon relies on **Human Capital Theory** (Becker/Schultz). If the human being is conceptually reduced to a unit of capital, then "rest" cannot be a good in itself; it can only be "maintenance," "depreciation prevention," or "investment."

  ### 2. The Two Halves: One Phenomenon, Two Modes
  You asked if the argumentative concession and the behavioral internalization are one phenomenon or two. They are **one phenomenon manifesting in two modes**: *Discursive* and *Somatic*.

  *   **Discursive Mode (The Argument):** This is the public justification. "We need shorter hours *so that* productivity remains high" or "Rest is necessary *to prevent* burnout." The value of rest is derivative; it borrows its worth from the work it enables.
  *   **Somatic Mode (The Behavior):** This is the private internalization (what Foucault might call *habitus*). When the subject finally obtains non-work time, they do not know how to inhabit it except through the protocols of work (tracking, optimizing, scheduling). The guilt felt during unstructured time is the psychic pain of "idling capital."

  They are the same root because both stem from the **Totalization of Instrumental Reason**. In both cases, time has no intrinsic value; it only has value if it yields a return. In the first case, the return is economic output; in the second, the return is self-optimization.

  ### 3. The Carving: What Counts and What Doesn't
  To use this in your seminar, you need clear boundary cases. The distinguishing line is **Instrumental vs. Intrinsic** valuation of non-work.

  **Instances of Productive Capture (Counts):**
  *   **The Business Case for Rest:** "Sleep 8 hours because it improves cognitive function." (Rest as tool).
  *   **The Burnout Argument:** "Overwork is bad because it destroys the worker's capacity to labor." (The wrong is the loss of utility).
  *   **The Unemployment Argument (Russell):** "We should work less to spread jobs around." (Leisure as a byproduct of labor distribution).
  *   **Optimized Leisure:** "I meditate to increase my focus." "I vacation to recharge." (Leisure as maintenance).

  **Counterexamples (Does Not Count):**
  *   **The Sabbath:** In the Judeo-Christian tradition, the Sabbath is not for recharging. It is a *cessation* that imitates God. It is justified by covenant and holiness, not efficiency. In fact, a Sabbath kept *for the purpose* of being more productive next week is arguably a violation of the Sabbath.
  *   **Aristotelian Contemplation (*Theoria*):** For Aristotle, contemplation is the highest human activity, superior to political action or labor. It is an end in itself, not a break from production.
  *   **Play (Huizinga):** True play is autotelic (done for its own sake). If you play a game to "network" or "improve strategic thinking for work," it has been Productively Captured. If you play for the joy of the activity, it is not.
  *   **Rights-Based Leisure:** "I have a right to leisure because I am a human being with dignity," regardless of my economic output. (This appeals to *deontology* or *human rights*, not *consequentialist productivity*).

  ### 4. Why Standard Theories Miss the Mark
  *   **Weber:** Explains why we feel we *should* work, but doesn't explain why critics of work *argue* using work's vocabulary.
  *   **Adorno:** In his essay "Free Time," Adorno argues that free time is determined by unfree time. He is very close to your second half (behavior). However, Adorno focuses on the *Culture Industry* filling the time with commodified distractions. Your observation is sharper: it's that the *moral vocabulary* used to defend the time surrenders to the system.
  *   **Arendt:** Distinguishes *Labor* (biological necessity), *Work* (fabrication), and *Action* (political freedom). She would call Productive Capture a confusion of *Labor* (maintenance of life) with *Freedom*. But she doesn't name the rhetorical trap.

  ### 5. Can a Right to Leisure be Argued Without Capture?
  Yes, but it requires shifting the ground of the argument away from *capacity* and toward *ontology* or *dignity*.

  *   **The Capability Approach (Sen/Nussbaum):** Argue for leisure not as "rest for work" but as a necessary condition for *human flourishing* and the development of capabilities that are non-economic (citizenship, friendship, art).
  *   **The Ontological Argument (Josef Pieper):** In *Leisure: The Basis of Culture*, Pieper argues that leisure is the basis of culture precisely because it is an attitude of "non-activity," a silence that allows us to perceive reality. He explicitly attacks the idea of leisure as a "break" for the sake of work.
  *   **The Democratic Argument:** Citizens need time to deliberate and participate in self-governance. If everyone is working maximally, democracy fails. This justifies leisure via *political liberty*, not *economic output*.

  ### Summary for the Seminar
  If you want to introduce this to your students, you can frame it as follows:

  > "We are witnessing **Productive Capture**. This is when the critique of work is assimilated by the logic of work. We see it when we argue for rest only as 'maintenance' for the worker, or when we structure our free time like a project to be managed.
  >
  > To escape Productive Capture, we must find a vocabulary where human value is not tied to output. We must look to traditions that view leisure as **intrinsic good** (Sabbath, Contemplation, Play) rather than **instrumental good** (Recovery, Upskilling, Networking). The question is: Can we defend a right to do nothing without apologizing for it in the language of doing something?"

  This gives you the label, the boundary, and the path forward without relying solely on the "Protestant Work Ethic" as a catch-all explanation.
