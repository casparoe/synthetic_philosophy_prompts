answer: |-
  This is a high-risk, high-reward seminar design. You are asking students to collide with a metaphysical problem using an epistemic tool (testing). That tension is exactly where the philosophy lives, but it requires tight facilitation to ensure they don't walk away thinking, "Well, we just needed better tests."

  Here is the complete package: **The Disposition Interrogation Game.**

  ### 1. The Setup & Mechanics

  **Room:** One big table. Whiteboard visible to all.
  **Players:** 14 students + 1 Prof.
  **Teams:** 3 Teams (A, B, C) of 4–5 people. (One person per team sits out each round to act as Scorekeeper/Timekeeper, rotating out).
  **Materials:** Printed Object Cards (cut out), Verdict Sheets, Whiteboard markers.

  **The Roles (Rotating per Round):**
  1.  **Custodians (1 Team):** Hold the Object Files. They know the *Truth* (Mechanism) and the *Behavior* (What happens on test). They answer questions truthfully but cannot show the card.
  2.  **Inspectors (1 Team):** Do not see the Files. They ask 3 questions to determine if the object *has the disposition*.
  3.  **Auditors (1 Team):** Watch for rule violations. They tally scores.

  **The Rules of Interrogation:**
  1.  Inspectors have exactly **3 Questions**.
  2.  Questions must be of the form: *"If we perform physical operation X, what observable outcome Y occurs?"*
      *   *Allowed:* "If we strike it with 5J of force, does it shatter?"
      *   *Banned:* "Is it fragile?" "Does it have a mask?" "What is the micro-structure?"
  3.  **Verdict:** After 3 questions, Inspectors must declare: **HAS IT**, **LACKS IT**, or **UNDECIDABLE**.
  4.  **Scoring:**
      *   Match the Answer Key Truth: **+10 Points**.
      *   Correctly identify the *type* of interference (e.g., "It's a Fink"): **+5 Bonus Points**.
      *   **Wager:** Before revealing the verdict, Inspectors wager 0–5 points on their confidence. If right, they win double the wager. If wrong, they lose the wager. (This punishes bluffing).

  **Timeline (80 Minutes):**
  *   **00–10:** Setup, Rules, Deal Cards. (No lecture on finks/masks).
  *   **10–30:** Round 1 (Team A Custody, Team B Inspect, Team C Audit).
  *   **30–50:** Round 2 (Rotate: B Custody, C Inspect, A Audit).
  *   **50–60:** Round 3 (Rotate: C Custody, A Inspect, B Audit).
  *   **60–80:** Debrief & Metaphysical Mapping.

  ---

  ### 2. The Deck (12 Object Files)

  Each card has two sections. **TOP (Secret Truth):** For the Answer Key/Scoring. **BOTTOM (Public Behavior):** What the Custodian says when tested.

  #### 1. The Control (Boring)
  *   **Truth:** **HAS** Disposition (Fragile). Mechanism: Standard silicate lattice.
  *   **Behavior:** If struck: Shatters immediately. If heated: No change. If dropped: Shatters.
  *   **Type:** SCA Compliant.
  *   **Confidence:** 100%. (Trap for over-thinkers).

  #### 2. The Standard Fink (Wire)
  *   **Truth:** **HAS** Disposition (Conductive). Mechanism: Copper core, but current flow triggers a fuse that melts the core instantly.
  *   **Behavior:** If connected to circuit: Light flashes for 0.5s, then goes out permanently. If measured by non-contact scan: Reads Conductive.
  *   **Type:** Finkish Disposition.
  *   **Confidence:** 95%. (Standard Lewis case).

  #### 3. The Standard Mask (Glass)
  *   **Truth:** **HAS** Disposition (Fragile). Mechanism: Standard glass, wrapped in impact-absorbing aerogel coating.
  *   **Behavior:** If struck: Does not break. Coating absorbs energy. If coating removed: Shatters.
  *   **Type:** Masked Disposition.
  *   **Confidence:** 95%. (Standard Martin/Johnston case).

  #### 4. The Mimic (Wire)
  *   **Truth:** **LACKS** Disposition (Conductive). Mechanism: Rubber core, but contains a motion-sensor battery that sends a charge when probes touch it.
  *   **Behavior:** If connected to circuit: Light turns on. If measured by non-contact scan: Reads Non-Conductive.
  *   **Type:** Mimic / False Positive.
  *   **Confidence:** 90%. (Intuition: It's not *really* conductive).

  #### 5. The Delayed Shatter
  *   **Truth:** **HAS** Disposition (Fragile). Mechanism: Micro-fractures propagate slowly.
  *   **Behavior:** If struck: Appears intact. 7 Days later: Shatters spontaneously.
  *   **Type:** Temporal Mask/Fink.
  *   **Confidence:** 70%. (Intuition split: Is fragility essentially immediate?).

  #### 6. The Half-Fink
  *   **Truth:** **HAS** Disposition (Conductive). Mechanism: Quantum state collapses to insulator on test (50% probability).
  *   **Behavior:** If connected to circuit: 50% chance light turns on, 50% chance nothing. Re-testing same object yields same result as first test.
  *   **Type:** Probabilistic Fink.
  *   **Confidence:** 60%. (Room will split on whether probabilistic manifestation counts).

  #### 7. The Induced Explosive
  *   **Truth:** **LACKS** Disposition (Explosive). Mechanism: Stable compound until 100°C, then chemical structure rewrites to unstable.
  *   **Behavior:** If heated to 100°C: Explodes. If struck at room temp: Nothing.
  *   **Type:** Acquired Disposition (SCA False Positive if test is "heat it").
  *   **Confidence:** 85%. (Distinction between triggering condition and altering condition).

  #### 8. The Order-Dependent Glass
  *   **Truth:** **HAS** Disposition (Fragile). Mechanism: Outer shell is tough, inner core is fragile.
  *   **Behavior:** If struck once: Nothing. If struck twice (same spot): Shatters.
  *   **Type:** Historical Mask.
  *   **Confidence:** 80%. (Tests whether disposition is categorical or historical).

  #### 9. The Silent Conductor
  *   **Truth:** **HAS** Disposition (Conductive). Mechanism: Superconductor, but absorbs all EM radiation (no light/heat signature).
  *   **Behavior:** If connected to circuit: Ammeter shows current, but no light/heat. If "observed" visually: Looks like insulator.
  *   **Type:** Manifestation Mask.
  *   **Confidence:** 90%. (Manifestation is defined functionally, not phenomenally).

  #### 10. The Reverse Fink (Finkish Lack)
  *   **Truth:** **LACKS** Disposition (Fragile). Mechanism: Brittle ceramic, but embedded nanobots harden it instantly upon impact detection.
  *   **Behavior:** If struck: Does not break. If nanobots removed: Shatters.
  *   **Type:** Finkish Lack.
  *   **Confidence:** 90%. (Symmetric to Standard Fink).

  #### 11. The Bureaucrat
  *   **Truth:** **HAS** Disposition (Fragile). Mechanism: Standard glass.
  *   **Behavior:** If struck: Shatters *only if* a "Permit to Break" was filed 24h prior. Otherwise, remains intact.
  *   **Type:** Extrinsic Mask.
  *   **Confidence:** 50%. (High controversy: Can extrinsic facts mask intrinsic powers?).

  #### 12. The Time-Lock
  *   **Truth:** **HAS** Disposition (Conductive). Mechanism: Conductive, but only between 2:00 PM and 2:05 PM.
  *   **Behavior:** If connected at 2:03 PM: Works. If connected at 4:00 PM: Fails.
  *   **Type:** Temporal Fink.
  *   **Confidence:** 75%. (Is a time-limited power a power?).

  ---

  ### 3. Answer Key & Facilitator Notes

  **For the Scorekeeper (Whiteboard):**
  | Object | Truth | SCA Prediction* | Notes |
  | :--- | :--- | :--- | :--- |
  | 1. Control | HAS | PASS | Baseline. |
  | 2. Std Fink | HAS | FAIL | Behavior says "No", Truth says "Yes". |
  | 3. Mask | HAS | FAIL | Behavior says "No", Truth says "Yes". |
  | 4. Mimic | LACKS | FAIL | Behavior says "Yes", Truth says "No". |
  | 5. Delayed | HAS | FAIL | Manifestation outside test window. |
  | 6. Half-Fink | HAS | FAIL | Probabilistic failure of test. |
  | 7. Induced | LACKS | FAIL | Test changes the nature. |
  | 8. Order-Dep | HAS | FAIL | Single test insufficient. |
  | 9. Silent | HAS | FAIL | Manifestation hidden. |
  | 10. Rev Fink | LACKS | FAIL | Behavior says "No", Truth says "No" (but for wrong reason). |
  | 11. Bureaucrat | HAS | FAIL | Extrinsic conditionality. |
  | 12. Time-Lock | HAS | FAIL | Time-sensitive. |

  *\*SCA Prediction = "If Tested, Manifests?"*

  **Confidence & Intuition Flags:**
  *   **High Confidence (90%+):** Cases 1, 2, 3, 4, 9, 10. These are the core curriculum. If students get these "wrong" (i.e., follow behavior over truth), the metaphysical point is secured.
  *   **Medium Confidence (70-85%):** Cases 5, 7, 8, 12. These rely on stipulations about time and history. Students might argue these *are* different dispositions. **Facilitator Note:** Accept their pushback here. It shows the limits of the concept.
  *   **Low Confidence (50-60%):** Cases 6, 11. Case 6 (Probabilistic) might just look like a broken object. Case 11 (Bureaucrat) might look like a joke. **Facilitator Note:** Use Case 11 to probe intrinsic vs. extrinsic. Use Case 6 to probe determinism.

  ---

  ### 4. Predictable Failures & Troubleshooting

  **1. The "It Depends" Objection (Minute 15)**
  *   *Problem:* A student says, "Well, does 'fragile' mean 'breaks when struck' or 'has the structure to break'? Because I'm defining it the first way."
  *   *Fix:* Hand them the **Definition Card** immediately.
      *   *Definition:* "For this game, a Disposition is an **intrinsic property of the object's micro-structure** that *explains* why it behaves as it does. It is not the behavior itself."
      *   *Script:* "We are testing whether behavior tracks structure. If they come apart, the SCA is in trouble."

  **2. The Presupposition Question (Minute 20)**
  *   *Problem:* Inspector asks: "When it shatters, how loud is it?" (Assumes it shatters).
  *   *Fix:* Auditors flag this. Question is void. Team loses one of their 3 questions.
  *   *Script:* "You cannot assume the manifestation. Ask about the conditional."

  **3. The Epistemic Surrender (Minute 40)**
  *   *Problem:* Inspectors keep choosing "UNDECIDABLE" to avoid losing wager points.
  *   *Fix:* "UNDECIDABLE" scores 0 points. A wrong guess scores -5. A right guess scores +20. They *must* gamble to win.
  *   *Script:* "Metaphysics requires commitment. Place your bet."

  **4. The "Cheating" Custodian**
  *   *Problem:* Custodian gives away the mechanism ("Well, the nanobots activate...").
  *   *Fix:* Custodians are only allowed to read the **Behavior** text in response to questions. They keep the **Truth** text hidden until the reveal.

  ---

  ### 5. The Debrief (The Metaphysical Pivot)

  *This is the most critical section. Do not skip.*

  **Phase 1: The Scoreboard (5 mins)**
  *   Announce winners. Acknowledge that most teams likely lost points on Objects 2, 3, 5, 7.
  *   Ask: "Why did you lose points on Object 2 (The Fink)?"
  *   Expected Answer: "Because the test lied to us."

  **Phase 2: The Epistemology Trap (5 mins)**
  *   *Your Worry:* "This game only teaches that evidence can be misleading."
  *   *The Pivot:* Acknowledge this openly.
  *   *Script:* "You are right. As a game, this was epistemology. You couldn't *know* the disposition from the behavior. But look at the Answer Key. The Key says Object 2 **IS** Conductive. Why? Not because of what it did, but because of what it *was* (the copper core)."
  *   *Point:* "If the disposition is the copper core, and the behavior is 'no light', then **Disposition $\neq$ Counterfactual Behavior**."

  **Phase 3: Mapping the Cases (10 mins)**
  Draw three columns on the whiteboard: **SCA Holds**, **Finks**, **Masks/Mimics**.

  *   **Ask the room to sort the 12 objects.**
  *   **Object 2 (Fink):** SCA says "If connected, would conduct." Truth: "If connected, fuse melts."
      *   *Lesson:* The test destroys the property. The counterfactual antecedent ($C$) kills the basis ($B$).
  *   **Object 3 (Mask):** SCA says "If struck, would break." Truth: "If struck, coating stops it."
      *   *Lesson:* The property is there, but the manifestation ($M$) is blocked.
  *   **Object 7 (Induced):** SCA says "If heated, would explode." Truth: "Heating *makes* it explosive."
      *   *Lesson:* The antecedent creates the property rather than triggering it.
  *   **Object 1 (Boring):**
      *   *Lesson:* This is the only one where SCA works cleanly. Why build a theory on the exception?

  **Phase 4: The Categorical Basis (5 mins)**
  *   Conclude by pointing to the "Truth" section of the cards.
  *   "You relied on the 'Truth' section to score the game. That section described **categorical bases** (lattice structures, nanobots, chemical bonds). Next week, we ask: Do we need these bases? Or can we save the Conditional Analysis by fixing the counterfactuals?"

  ---

  ### 6. Honesty Check: Limitations of This Design

  **1. The Epistemology vs. Metaphysics Gap**
  *   **Verdict:** You are correct to worry. The game *simulates* an epistemic problem (hidden information). The metaphysical point (SCA is false) only lands if you force the "Answer Key" to represent metaphysical reality.
  *   **Mitigation:** You must be authoritarian about the Answer Key. "In this seminar, the Mechanism *is* the Reality. Behavior is just the shadow." If you let them debate the Key during the game, the metaphysics dissolves into skepticism.

  **2. Stability of Verdicts**
  *   **Verdict:** Cases 5 (Delayed), 6 (Half-Fink), and 11 (Bureaucrat) are not stable.
  *   **Risk:** Students will argue Object 5 simply *isn't* fragile in the standard sense.
  *   **Advice:** Don't fight them on these. Use the disagreement. "Half the room says it's fragile, half says it isn't. That means our concept of 'fragility' is vague. SCA requires precision. Therefore SCA is in trouble."

  **3. "Has the Disposition" as a Scoring Metric**
  *   **Verdict:** This is the weakest link. If a team says "Lacks" for a Masked Glass because "It didn't break," they are behaviorally rational but metaphysically "wrong" according to your Key.
  *   **Risk:** They will feel punished for being empiricists.
  *   **Advice:** Award bonus points for "Identifying the Interference." If they say "Lacks (due to Mask)," give them full credit. This rewards them for spotting the *structure* of the problem, not just guessing your ontology.

  **4. Confidence in Intuition**
  *   **High:** Finks and Masks (Cases 2, 3, 10). These will feel like clear failures of SCA.
  *   **Low:** The "Weird" cases (Cases 5, 6, 11). These might feel like semantic quibbles.
  *   **Strategy:** Lean heavily on Cases 2 and 3 for the core argument. Use the weird cases to show that *patching* SCA is a nightmare (because you'd need a new patch for every weird case).

  ### Final Facilitator Script (The Opening)
  >"Welcome. For the next hour, there is no metaphysics. There is only inspection. You are quality control. Your job is to sort objects based on what they *do*. However, at the end, I will grade you based on what they *are*. If those two things come apart, you will lose points. Your goal is to not lose points. Go."

  This sets the trap. They will optimize for behavior. The grading will punish them for it. The debrief explains why.
