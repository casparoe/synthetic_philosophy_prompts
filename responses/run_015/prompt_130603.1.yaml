      *   *Nuance on Bivalence:* Distinguish between "True now" and "Necessarily true." Bivalence doesn't entail fatalism unless you add "Necessity of the Past" or "Transfer of Necessity."
      *   *Eisenhower's Agency:* He isn't just predicting; he is *causing*. The truth of "We land" depends on his order. This makes it a *self-fulfilling* future contingent, which complicates Aristotle's passive observation model.
