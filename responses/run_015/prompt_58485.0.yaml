answer: |-
  ### Desiderata for an Adequate Account of Corruption

  To guide cross-societal comparison and the assessment of reform proposals, an account of corruption must function as a diagnostic tool rather than merely a moral condemnation. It must distinguish between pathological behavior and functional social glue. The following desiderata are structured to ensure the definition is robust enough for analysis but sensitive enough for application.

  #### I. The Anchor Cases
  To test these desiderata, we employ three stylized cases representing the spectrum of contentious behavior:
  1.  **The Planning Officer (Nepotism):** A state officer waives a regulatory fee for a cousin. No money changes hands; the benefit is relational.
  2.  **The Rural Nurse (Gratitude):** A nurse accepts a basket of produce from a family after successful treatment. No prior agreement existed; the gift is *ex post*.
  3.  **The Minister (Patronage):** A minister channels state contracts to members of his ethnic community to maintain a governing coalition. This sustains political stability but violates meritocratic allocation.

  #### II. The Desiderata

  **1. Phenomena Coverage (The Explanatory Requirement)**
  *   **Requirement:** The account must explain bribery, embezzlement, nepotism, clientelism, and influence peddling as variations of a single underlying mechanism, rather than distinct categories.
  *   **Rationale:** Reform proposals often fail because they treat "bribery" (illegal) differently from "patronage" (often legal). A unified account reveals that both involve the same subversion of institutional purpose.
  *   **Application to Cases:** It must classify the Officer (1) and the Minister (3) as structurally similar (diversion of public resource for particularistic ends), distinct from the Nurse (2).

  **2. Case Classification (The Decision Requirement)**
  *   **Requirement:** The account must yield distinct verdicts for the three anchor cases that align with functional integrity rather than mere rule-breaking.
      *   *Case 1 (Officer):* Must be identified as **corrupt** (subversion of impartial administration).
      *   *Case 2 (Nurse):* Must be identified as **non-corrupt** (sustaining social reciprocity without compromising duty).
      *   *Case 3 (Minister):* Must be identified as **contingently corrupt** (dependent on whether the system's legitimacy rests on impartiality or representation).
  *   **Rationale:** To guide reform, the account must distinguish between behavior that erodes state capacity (1 & 3) and behavior that sustains social cohesion (2). A definition that labels the Nurse as corrupt is empirically blind; one that excuses the Officer is normatively empty.

  **3. Distinctions Preserved (The Conceptual Requirement)**
  *   **Requirement:** The account must preserve the distinctions between:
      *   *Illegality vs. Corruption:* Not all corruption is illegal; not all illegality is corruption.
      *   *Private Gain vs. Public Subversion:* Corruption can occur without personal enrichment (e.g., ideological corruption or nepotism).
      *   *Reciprocity vs. Exchange:* Distinguish between social gift-giving and *quid pro quo* transactions.
  *   **Rationale:** Legalistic definitions fail in developing states where laws are weak. Market-based definitions (focusing on "gain") fail to capture nepotism where the official gains nothing but the kin does.
  *   **Application to Cases:** Distinguishes the Nurse's produce (Reciprocity) from a bribe (Exchange). Distinguishes the Officer's waiver (Corruption without profit) from theft.

  **4. Empirical Constraints on Reciprocity (The Anthropological Requirement)**
  *   **Requirement:** The account must accommodate the empirical fact that human societies function on generalized reciprocity and particularistic obligations. It cannot define all particularistic behavior as corrupt.
  *   **Rationale:** Humans are not atomized utility maximizers; we are embedded in networks of obligation. A reform proposal that attempts to eliminate all kinship obligation (Case 1) or gratitude (Case 2) will fail because it fights human nature and destroys social capital.
  *   **Constraint:** The definition must identify a *threshold* where reciprocity becomes capture. Case 2 is below the threshold; Case 1 is above it.

  #### III. Categorization of Requirements

  **Non-Negotiable Requirements (Logical and Empirical Necessities)**
  These are required for the concept to function as an analytical tool across any context.
  1.  **Fiduciary Structure:** Corruption must involve a betrayal of a trusted role. Without a role (public or private fiduciary), there is no corruption, only crime or sin.
  2.  **Normative Independence from Positive Law:** Corruption must be definable even when the law permits it (e.g., legal campaign donations that function as bribes).
  3.  **Accommodation of Reciprocity:** As per the Anthropological Requirement above; a definition that bans all gift-giving is empirically unsustainable.

  **Commitments Reflecting a Particular Institutional Outlook**
  These reflect a preference for a specific type of state (e.g., Weberian vs. Communitarian) and should be flagged when assessing reform.
  1.  **The Impartiality Standard:** Defining corruption primarily as the violation of *impartiality* privileges a modern bureaucratic state. In a society where the state's purpose is to distribute resources to specific groups for stability (Case 3), this standard labels necessary governance as corruption.
  2.  **The Public/Private Divide:** Insisting that corruption only exists in the *public* sphere reflects a liberal institutional outlook. In societies where private power dominates public function, this distinction obscures the locus of corruption.

  #### IV. Jointly Unsatisfiable Requirements

  **The Pair:** **Universal Functionalism** vs. **Local Moral Validity**

  1.  **Universal Functionalism:** The account must judge corruption based on the universal functional purpose of an institution (e.g., a health system exists to heal, a bureaucracy to administer rules impartially).
  2.  **Local Moral Validity:** The account must judge corruption based on the local normative expectations of the actors involved (e.g., if the community expects the Minister to favor his kin, he is fulfilling, not betraying, his role).

  **The Tension:**
  You cannot fully satisfy both.
  *   If you prioritize **Universal Functionalism**, you can compare societies and propose reforms for efficiency, but you risk "normative imperialism," labeling deeply held local obligations (like caring for kin in Case 1) as corrupt.
  *   If you prioritize **Local Moral Validity**, you respect cultural context, but you lose the ability to criticize systemic kleptocracy. If a society accepts that Ministers *should* steal for their tribe (Case 3), a locally valid definition cannot label this corruption, rendering reform impossible.
  *   **Resolution for Reform:** An adequate account must prioritize **Universal Functionalism** for the purpose of *institutional design* (what the office is supposed to do) while using **Local Moral Validity** only to assess the *feasibility* of reform, not the definition of the act.

  #### V. The Single Requirement Eliminating the Largest Class of Definitions

  **The Requirement:** **Corruption is defined by the subversion of the *purpose* of the office, not the presence of *private gain*.**

  **Rationale:**
  This requirement eliminates the **Market-Centered Definition** (e.g., "abuse of public office for private gain"), which is the dominant definition in economics and much policy literature (e.g., Nye, World Bank operational definitions).

  **Why it eliminates this class:**
  1.  **Excludes Nepotism without Profit:** In Case 1 (The Planning Officer), the officer may waive the fee out of duty to family, gaining no money. The Market-Centered definition struggles to classify this as corruption if "private gain" is interpreted financially. The Purpose-Subversion definition captures it immediately (the purpose of the office is impartial fee collection).
  2.  **Excludes Ideological Corruption:** An official might subvert the state for a political cause, not personal gain. Market definitions miss this; Purpose-Subversion captures it.
  3.  **Excludes Legal Corruption:** Market definitions often rely on illegal transactions. By focusing on the *purpose* rather than the *gain* or the *law*, we capture legal acts that subvert institutional integrity (like Case 3, if the constitution mandates impartiality).

  By insisting that the core of corruption is **fiduciary betrayal** rather than **market exchange**, we eliminate the vast class of definitions that reduce corruption to a transactional crime, thereby enabling the analysis of systemic and cultural corruption essential for cross-societal comparison.
