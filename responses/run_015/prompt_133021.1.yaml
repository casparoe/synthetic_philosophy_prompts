answer: |-
  You are right to feel that the slogan is doing too much work. In an EA context, this argument is essentially an appeal to **moral trajectory** to solve **moral uncertainty**. Your friend is using a descriptive claim about history to justify a normative claim about current action.

  Here is a breakdown of the six distinct theses hidden inside "the arc of the moral universe is long but it bends toward justice," evaluated by their truth value, their support for your friend's conclusion, and their implications for future moral patients (like digital minds).

  ### 1. The Empirical Trend Thesis
  **The Claim:** The historical record shows a monotonic expansion of the "moral circle" (tribe $\to$ nation $\to$ all humans $\to$ animals).
  *   **Classification:** **Substantive and Debatable.** It is not a platitude; it relies on a specific reading of history (Whig history) that ignores periods of contraction, exclusion, or fragmentation. It is defensible (see Pinker, Singer) but contested (see Foucault, post-colonial critiques).
  *   **Support for Friend:**
      *   *Expect Widening:* **Moderate.** Past trends do not guarantee future trajectories. (The "induction problem" applied to ethics).
      *   *Discount Intuitions:* **Weak.** Even if the circle *has* widened, that is an *is*, not an *ought*. It doesn't prove the expansion is *correct*, only that it happened.
  *   **Digital Minds/Endpoint:** **Commits to widening.** If the trend is lawlike, there is no principled reason to stop at animals. It suggests we should expect the circle to include digital minds, unless we can identify a hard boundary (e.g., biological life) which the trend itself does not provide.

  ### 2. The Teleological Mechanism Thesis
  **The Claim:** There is a lawlike, irreversible mechanism (social, economic, or evolutionary) that *causes* moral concern to widen.
  *   **Classification:** **Probably False.** There is no evidence of a moral gravity. Moral progress is fragile and reversible (e.g., the rise of totalitarian regimes, rollback of rights). Treating progress as automatic is historically naive.
  *   **Support for Friend:**
      *   *Expect Widening:* **Strong.** If it's a law of history, it will happen.
      *   *Discount Intuitions:* **Paradoxical.** If progress is automatic, your friend's activism is unnecessary. If it's automatic, why argue? If it requires argument, it isn't automatic.
  *   **Digital Minds/Endpoint:** **Commits to widening.** A mechanism doesn't care about your comfort zone. If the mechanism is "increasing capacity to empathize with complex systems," it pushes toward digital minds. If the mechanism is "economic interdependence," it might stop at humans. The thesis is too vague to know.

  ### 3. The Convergence on Truth Thesis
  **The Claim:** Moral realism is true, and history represents a slow, noisy discovery of objective moral facts. We are getting closer to the Truth.
  *   **Classification:** **Substantive and Defensible.** This is a standard moral realist position. It is not a platitude; it requires metaphysical commitment.
  *   **Support for Friend:**
      *   *Expect Widening:* **Moderate.** Depends on what the Truth actually is. Maybe the Truth is that only humans matter, and we are currently in a period of error.
      *   *Discount Intuitions:* **Strong.** If we assume we are currently in a state of error relative to the future "truth," we should heavily discount current intuitions (like the permissibility of factory farming).
  *   **Digital Minds/Endpoint:** **Does not allow cherry-picking.** If there is a Truth, it includes whatever entities actually have moral status. If digital minds have moral status, the Truth includes them. You cannot stop at animals unless animals are the *only* non-human entities with moral status.

  ### 4. The Tautological (Selection Bias) Thesis
  **The Claim:** "Justice" is just a label we apply to changes we currently endorse. The trend exists only because we count the expansions as "progress" and ignore the contractions.
  *   **Classification:** **Platitude / Cynical Truth.** This is the sociological reading. "Progress" is a value judgment made by the winner.
  *   **Support for Friend:**
      *   *Expect Widening:* **None.** If "widening" is just defined by what we happen to like now, it predicts nothing about what future people will like.
      *   *Discount Intuitions:* **Undermines the argument.** If the "arc" is just a story we tell to validate our current preferences, it gives you no reason to think future people will judge us negatively. They might judge us for *not* caring enough about something else entirely (e.g., environmental purity, genetic purity).
  *   **Digital Minds/Endpoint:** **Allows cherry-picking.** This reading lets you stop the arc wherever your current social circle stops. It provides no external pressure to include digital minds.

  ### 5. The Agency-Dependent Thesis (MLK's Actual View)
  **The Claim:** The arc does not bend automatically; it bends *toward* justice only insofar as people struggle to bend it.
  *   **Classification:** **Substantive and Defensible.** This is the theological/pragmatic reading MLK intended. It rejects historical determinism.
  *   **Support for Friend:**
      *   *Expect Widening:* **None.** It does not predict the future; it prescribes a task.
      *   *Discount Intuitions:* **Reframes the move.** It doesn't say "trust the future," it says "you must *make* the future." It supports acting on the intuition that factory farming is wrong, but not because the future agrees, but because you must be the arc-bender.
  *   **Digital Minds/Endpoint:** **Open.** It depends entirely on where the activists push. It allows you to pick the endpoint, but demands you pay the cost to get there.

  ### 6. The Scope-vs-Depth Thesis
  **The Claim:** We aren't changing *what* we owe (depth), only *who* we count (scope). The fundamental moral rules (don't cause unnecessary suffering) are static; we are just realizing more beings fit the criteria.
  *   **Classification:** **Substantive.** This distinguishes between moral *principles* and moral *application*.
  *   **Support for Friend:**
      *   *Expect Widening:* **Moderate.** If the principle is "reduce suffering," and we find more sufferers, the scope widens.
      *   *Discount Intuitions:* **Strong.** It suggests our current intuition (that animals don't count) is a calculation error, not a difference in values.
  *   **Digital Minds/Endpoint:** **Commits to widening (conditionally).** If digital minds can suffer, they must be included. If the criterion is strictly biological suffering, they might be excluded. This is the most "EA-friendly" reading because it relies on criteria (sentience) rather than vibes.

  ---

  ### Summary: Does the slogan support your friend's move?

  Your friend is making two moves:
  1.  **Prediction:** Future people will view us like we view slaveholders.
  2.  **Normative Action:** Therefore, we should act now to align with that future view (and discount current intuitions).

  **The Verdict:**
  *   **Theses 1, 2, & 3** support the **Prediction**, but only 3 supports the **Normative Action** robustly (by appealing to Truth rather than popularity).
  *   **Thesis 4** undermines both.
  *   **Thesis 5** undermines the Prediction but supports the Action (as a duty).
  *   **Thesis 6** supports both, *if* you accept the premise that sentience is the only relevant criterion.

  **The "Digital Minds" Trap:**
  Most people using this slogan want the **Convergence on Truth** (Thesis 3) validity without the **Digital Minds** implication. They want to say "We are objectively right about animals" without accepting "We might be objectively wrong about simulations."
  *   If the arc bends toward **Justice** (objective), you cannot stop at animals if digital minds have moral weight.
  *   If the arc bends toward **Social Consensus** (Thesis 4), you can stop wherever you like, but you lose the claim that slaveholders were *objectively* wrong, only that they lost.

  **Recommendation for the Group:**
  The slogan is likely functioning as a **conversation stopper** that disguises **Thesis 4 (Selection Bias)** as **Thesis 3 (Convergence on Truth)**.
  *   Ask your friend: *"Is the arc bending because there is a moral truth we are finding, or because we define 'bending' as 'things we now like'?"*
  *   If they say **Truth**: Ask why the truth stops at biology.
  *   If they say **Things We Like**: Ask why we should trust the preferences of future people over our own reasoned arguments.

  The strongest EA argument isn't that the future will judge us, but that **moral uncertainty** combined with **low-cost high-upside interventions** (like reducing factory farming) makes it rational to act *as if* the circle should widen, regardless of whether history guarantees it.
