answer: |-
  The stalemate is substantive: "impact" is not a value-neutral physical quantity, so your colleague's dilemma is essentially correct and the "impact budget" move merely relocates the value judgment into the exchange rate without solving the specification problem.

  The reason this circles forever is that you are trying to factor human values into "specified objective" plus "everything else stays same," but in a densely coupled world, "everything else" contains the unstated preferences you are trying to protect. Any metric that successfully distinguishes "fetching coffee" (good impact) from "breaking vase" (bad impact) must implicitly model which state changes matter to humans, which means you have already written down a utility function, just in the form of a distance metric rather than a reward function. The "impact budget" proposal fails for exactly the reason your instinct suggests: to define an exchange rate between breaking a vase and opening a door, you need a common currency of value. If that currency is "attainable utility" or "optionality," you reintroduce the offsetting problem (destroy the vase, create a new door elsewhere); if the currency is physical change, you penalize task success. The only case where the budget frame works is if you explicitly admit that "preserving human optionality until consultation" is the terminal value you are optimizing, but that is a value judgment, not a value-free constraint.

  Progress will not come from a better formula. A formal impossibility theorem demonstrating that no value-neutral measure can distinguish task success from catastrophic side effects in densely coupled environments would count as progress by forcing the paradigm shift your colleague advocates. Alternatively, progress looks like abandoning the search for a static penalty term in favor of interactive frameworks where "impact" is defined dynamically by human feedback or uncertainty over preferences (treating impact as "probability of violating unstated constraints"). If your team insists on a static, value-free impact penalty for general deployment, honestly, no progress is coming because the object you are trying to construct does not exist.
