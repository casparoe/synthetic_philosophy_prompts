answer: |-
  Your observation is incisive, and your dissatisfaction with the standard taxonomy of American exceptionalism is well-founded. The standard tripartite division (historical, normative, ideological) describes *content*, but it fails to capture the *argumentative dynamics* you have isolated—specifically the third move, which functions as an immunization strategy against charges of inconsistency or hypocrisy.

  To answer your primary question directly: **No, there is no single canonical term in political theory or philosophy that captures this specific three-layer configuration as a unified argumentative architecture.**

  While the individual components are well-documented, the specific sequencing you describe—particularly the retreat to *sincerity* and *institutional embodiment* as a meta-defense when the logic of uniqueness is challenged—is usually treated as a symptom of ideology rather than a distinct rhetorical structure. However, the architecture you have identified maps precisely onto a gap in the literature between **Normative Exceptionalism** and **Political Theology**.

  Below is a precise carving of this concept, a proposed coinage, and the boundary conditions you requested.

  ### 1. Mapping the Architecture to Existing Theory

  To see why existing terms are insufficient, we must disaggregate your three moves:

  *   **Move 1 (Descriptive Uniqueness):** This is standard **Historical Exceptionalism** (e.g., Lipset, Ignatieff). It posits the U.S. as a *sui generis* political organism (no feudalism, creedal nation).
  *   **Move 2 (Normative Exemption):** This is **Normative Exceptionalism**. It argues that unique origins entail unique obligations (or lack thereof). This is often critiqued as "double standards" in international relations theory.
  *   **Move 3 (Sincerity-Based Meta-Defense):** **This is the uncoded element.** When challenged that other nations claim uniqueness (e.g., Soviet "vanguardism," French "mission civilisatrice"), the defender does not argue that the *logic* is unique, but that the *ontological status* of the claim is different because it is sincerely held and institutionally embodied.

  This third move shifts the ground from **empirical/historical** (Is the claim true?) to **performative/existential** (Is the belief constitutive?). This is not merely "special pleading" (a logical fallacy); it is a claim about the *nature of political reality*.

  ### 2. Proposed Coinage: "Constitutive Exceptionalism"

  I propose labeling this specific architecture **Constitutive Exceptionalism**.

  The term "constitutive" is chosen deliberately to signal two things:
  1.  **Constitutive Rhetoric:** Drawing on the work of Michael Charland and Kenneth Burke, it suggests that the rhetoric does not merely describe a pre-existing uniqueness but *constitutes* the political identity through the act of assertion.
  2.  **Constitutive Rules:** In the sense of John Searle, the claim functions not as a regulative rule (governing behavior) but a constitutive rule (creating the reality of the behavior).

  The third move (the sincerity defense) is the mechanism that seals the constitution. It asserts: *The exception is real because we believe it is real, and our belief is evidenced by our institutions.*

  ### 3. Boundary Conditions and Structural Requirements

  You asked for precise edges. Here is how **Constitutive Exceptionalism** is distinguished from adjacent concepts:

  **A. Factual Contingency**
  *   *Condition:* The pattern does **not** require the historical claim (Move 1) to be factually false.
  *   *Boundary:* Even if the historical thesis were empirically verified (e.g., if the U.S. truly had no colonial past), the architecture holds if Move 2 and Move 3 are deployed. The architecture is about the *inference* from history to exemption, not the historical accuracy. However, in practice, Move 3 is most vigorously deployed when Move 1 is factually contested.

  **B. Tacit vs. Explicit Exemption**
  *   *Condition:* The pattern does **not** collapse if the normative exemption (Move 2) is made explicit.
  *   *Boundary:* In fact, explicit exemption (e.g., "We do not sign the ICC treaty because our Constitution is superior") often *triggers* Move 3 more rapidly. When the exemption is tacit, Move 3 remains dormant. When the exemption is challenged, Move 3 activates to protect the logic from charges of hypocrisy.

  **C. The Sincerity Condition (The Crucial Edge)**
  *   *Condition:* The architecture **requires** that the defense against universality rests on *authenticity* or *embodiment*, not just power.
  *   *Boundary:* If the defender argues, "We are exempt because we are powerful" (Realism), this is **not** Constitutive Exceptionalism; it is Hegemonic Realism.
  *   *Boundary:* If the defender argues, "We are exempt because God chose us" (Theocracy), this is **Civil Religion** or **Providentialism**.
  *   *Distinction:* Constitutive Exceptionalism is secular-political. It argues that the *institutional embodiment of the belief* (e.g., checks and balances, originalism) validates the sincerity, which in turn validates the exemption. It is a claim about *political integrity*, not divine right or raw power.

  ### 4. Differentiation from Adjacent Concepts

  **Vs. Standard American Exceptionalism**
  Standard exceptionalism is often a static self-description ("We are different"). Constitutive Exceptionalism is a *dynamic defense mechanism*. It is what exceptionalism *does* when challenged. It explains *how* the belief persists despite contradictory evidence (i.e., other nations making similar claims).

  **Vs. Special Pleading (Logical Fallacy)**
  Special pleading is an informal fallacy where one claims an exception without justification. Constitutive Exceptionalism *provides* a justification (the sincerity/embodiment clause). It is a coherent, albeit contestable, philosophical position, not merely a logical error. It claims that *internal perspective* matters morally, not just external action.

  **Vs. Civil Religion (Bellah)**
  Bellah's civil religion focuses on ritual, symbol, and sacred narrative (e.g., Lincoln as martyr). Constitutive Exceptionalism focuses on *juridical and moral liability*. Civil religion sanctifies the state; Constitutive Exceptionalism exempts the state from external judgment. They often overlap, but Civil Religion is the *liturgy*, while Constitutive Exceptionalism is the *legal defense*.

  **Vs. The State of Exception (Agamben/Schmitt)**
  Agamben's "state of exception" refers to the suspension of law *within* a polity during a crisis. Constitutive Exceptionalism argues for a permanent exemption *of* the polity from *external* norms based on identity, not crisis. It is a structural feature, not an emergency measure.

  ### 5. Theoretical Lineage and Reading Suggestions

  Since you are working through this with a reading group, you may find it useful to trace this architecture through specific theorists who touch on its components, even if they do not name the whole sequence:

  1.  **Sacvan Bercovitch (*The American Jeremiad*):** He comes closest to Move 3. He argues that American rhetoric functions by admitting fault (ritualistically) to reaffirm the unique mission. The "belief" constitutes the continuity of the identity.
  2.  **J.L. Austin (*How to Do Things with Words*):** For the philosophical underpinning of Move 3. The claim of uniqueness is a **performative utterance**. Its "felicity condition" is the sincerity of the speakers and the uptake by the institutions.
  3.  **Michael Ignatieff (*The Exceptional Americans*):** He distinguishes between "literal" and "representational" exceptionalism. Your Move 3 is a defense of "representational" exceptionalism (we represent universal values uniquely).
  4.  **Slavoj Žižek (*The Sublime Object of Ideology*):** For the meta-level analysis. He discusses how ideology functions not when we believe, but when we believe that *others* believe, or when the *institution* believes for us. This maps to your "institutional embodiment" clause.

  ### 6. Summary for Your Reading Group

  If you wish to introduce this into your discussions, you might define **Constitutive Exceptionalism** as follows:

  > "A rhetorical architecture wherein a nation's descriptive uniqueness (Move 1) is leveraged to claim normative exemption (Move 2), and when challenged on the universality of that logic, the defense retreats to the claim that the nation's sincere belief and institutional embodiment of that uniqueness constitute an ontological difference that validates the exemption (Move 3)."

  **Why this matters:** It explains why factual counter-arguments (e.g., "Other nations also have founding creeds") fail to persuade. The defender is not arguing about *facts* (Move 1); they are arguing about *ontology* (Move 3). Recognizing this shift allows your group to bypass the historical debate and interrogate the philosophical validity of the "sincerity condition" itself: *Does the sincerity of a belief morally license exemption from universal norms?*

  This framing should provide the conceptual precision you are looking for, distinguishing the *structure* of the argument from the *content* of the ideology.
