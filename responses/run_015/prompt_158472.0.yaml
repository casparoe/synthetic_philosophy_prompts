answer: |-
  Right, let's cut through the noise. You have stumbled upon one of the most famous problems in decision theory, but you are mixing up distinct psychological drivers.

  Here is the straight answer: **You are violating the Independence Axiom of Expected Utility Theory.** This is not a calculation error; it is a documented cognitive bias known as the **Allais Paradox**.

  ### The One Account: Prospect Theory
  There is one framework that saves verdicts 1, 2, and 4, but it requires you to accept that humans are not rational calculators. That framework is **Prospect Theory** (developed by Kahneman and Tversky).

  1.  **Scenarios 1 & 2 (The Allais Paradox):**
      *   **The Maths:** In Scenario 1, the Expected Value (EV) of the risky option is \$1,390. The sure thing is \$1,000. A rational EV maximiser takes the risk. You took the sure thing.
      *   **The Violation:** In Scenario 2, you switch to maximising EV. According to the Independence Axiom, if you prefer the sure thing in Scenario 1, you *must* prefer the 11% option in Scenario 2. You did the opposite.
      *   **The Principle:** This is the **Certainty Effect**. Prospect Theory posits that we overweight outcomes that are considered "certain" (100%) compared to outcomes that are merely "probable" (89%), even if the mathematical difference is small. The jump from 99% to 100% feels massive psychologically; the jump from 89% to 98% feels negligible.

  2.  **Scenario 4 (The Board):**
      *   **The Principle:** This is **Framing** and **Utility Modification**.
      *   **Is it embarrassment?** Yes, effectively. In economics, "utility" isn't just money; it is total satisfaction. Public shame is a negative utility cost. When you add the "shame cost" to the loss outcome of the risky option, the Expected Utility of the risky option drops below the safe option. This is actually *consistent* with rational choice theory, provided you accept that shame has a monetary value to you. It explains why you switch back to the safe option when the board is present.

  ### The Verdict on Scenario 3: Drop It
  You asked which one to drop. **Drop Scenario 3.**

  Here is why: Scenario 3 introduces **Ambiguity** (unknown probabilities) into a discussion about **Risk** (known probabilities).
  *   The Independence Axiom and the Allais Paradox rely on precise probabilities.
  *   If the AI is "miscalibrated in the tails," you are no longer dealing with 1% or 10%. You are dealing with unknowns.
  *   If you truly distrusted the probabilities (Ambiguity Aversion), you should theoretically avoid the ambiguous options in *both* cases. By sticking to the exact same choices as Scenarios 1 and 2, you are claiming that your decision is driven by the *structure* of the bet, not the *source* of the probability.
  *   While this shows your bias is robust, it muddies the water. It conflates the **Ellsberg Paradox** (ambiguity) with the **Allais Paradox** (certainty). To understand why you violated the Independence Axiom in 1 and 2, you must assume the probabilities were trusted. Scenario 3 invalidates that assumption, making it useless for diagnosing the Independence violation.

  ### Prediction: School Credit Points
  **Scenario:** School credit points, no board, same odds as Scenario 1 (Sure Points vs. Risky Points).

  **Prediction:** You will likely take the **Risky Option**.

  **Reasoning:** The Certainty Effect is highly sensitive to the *magnitude* and *tangibility* of the stakes.
  *   Cash is fungible and real. Losing \$1,000 hurts. The "certainty" of keeping it carries a heavy emotional premium.
  *   School points are abstract. They are less liquid and often feel hypothetical.
  *   When stakes feel lower or less "real," the psychological weight of the "Certainty" diminishes. You will likely revert to Expected Value maximisation because the emotional pain of losing the points is not severe enough to trigger the Certainty Effect. You will treat it like Scenario 2, where you happily took the risk for the higher EV.

  ### Straight Talk: Anxiety vs. Independence
  You asked if you are confusing independence with social anxiety or if the framing is broken.

  **You are not confusing it with social anxiety** (except in Scenario 4). In Scenarios 1 and 2, there is no audience. Your reversal is purely internal.

  **However, your framing of "what principle am I using" is slightly broken.** You are looking for a *rule* you are following. You aren't. You are exhibiting a **bias**.
  *   There is no consistent logical principle that satisfies Scenarios 1 and 2 simultaneously under Expected Utility Theory.
  *   You are not "using" the Independence Axiom; you are **violating** it.
  *   You are not "using" a principle of embarrassment in Scenario 4; you are reacting to a change in incentives.

  **The Bottom Line:**
  You are not a broken statistician; you are a normal human. Your brain uses heuristics (shortcuts) rather than calculus. The "Certainty Effect" is a feature of human psychology, not a bug in your maths class. But if you want to pass your exam, you must recognise that Scenarios 1 and 2 cannot both be "rational" under the standard models your teacher is using. You have to identify them as a violation of the Independence Axiom.

  **Summary for your notes:**
  *   **Principle:** Violation of the Independence Axiom (Allais Paradox).
  *   **Theory:** Prospect Theory (Certainty Effect).
  *   **Drop:** Scenario 3 (Conflates Risk with Ambiguity).
  *   **Prediction:** Risky option for points (Lower stakes reduce Certainty Effect).
  *   **Anxiety:** Irrelevant to 1 & 2; relevant only to 4.
