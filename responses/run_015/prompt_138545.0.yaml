answer: |-
  ### 1. Sequence and Dependencies

  **Order of Components:**
  1.  **Recap the Fink (5 mins):** Re-establish the Live Wire case. Confirm consensus: The wire *is* live (disposition present), but the conditional "If touched, shock would occur" is *false*.
  2.  **Establish the Criterion of Persistence (5 mins):** Before introducing masks, you must secure agreement that for a counterexample to work, the disposition must *persist* through the stimulus. In the Fink case, the disposition is lost *upon* stimulus.
  3.  **Introduce the Mask (10 mins):** Present the masking case. Students must see that here, the disposition persists *through* the stimulus, yet the conditional is still false.
  4.  **Structural Comparison (10 mins):** Contrast the timeline of the disposition's status in Finks (lost at $t_1$) vs. Masks (retained at $t_1$).
  5.  **Mug Cases Application (15 mins):** Apply the distinction to your constructed cases (see Section 4).
  6.  **Board Question & Wrap (5 mins):** Assessment.

  **Dependency Note:**
  A mask only functions as a counterexample to the Simple Conditional Analysis (SCA) if students grant that the disposition remains intrinsic and intact during the stimulus. If they deny this, the case collapses into a Fink. Therefore, you must establish the **Intrinsic Basis** as the anchor *before* introducing the mask.

  **Reverse Failure (Antidotes/Mimics):**
  **Exclude this entirely.** Reverse failure (Disposition Absent, Conditional True) belongs to a later session. Including it now blurs the specific structural distinction you are building. Finks and Masks are a pair because they both render the Conditional False while the Disposition is True. Introducing the reverse scenario invites confusion about truth-values rather than focusing on the *mechanism of failure* (intrinsic loss vs. extrinsic block).

  ### 2. The Carrying Case for Masking

  **Recommended Case:** **Solubility in Saturated Water.**
  *Do not use the Analgesic.* Your suspicion is correct: students will argue that if pain is not felt, the nociceptive disposition was not truly active, or they will conflate the *sensation* with the *disposition*. Protective packaging fails for the same reason (denial of stimulus).

  **The Case:** A salt crystal is soluble (disposition to dissolve in water). It is placed into water that is already fully saturated with salt. The stimulus (immersion) occurs. The manifestation (dissolving) does not occur.

  **What it must have:**
  *   **Intrinsic Stability:** The molecular structure of the salt (the causal basis of solubility) must remain unchanged during immersion.
  *   **Extrinsic Blocker:** The prevention of dissolving must be due to the state of the *water* (the environment), not the salt.

  **What it must lack:**
  *   **Stimulus-Induced Change:** The immersion must not trigger a change in the salt's structure (which would make it a Fink).
  *   **Stimulus Denial:** It must be clear the salt was genuinely "immersed" (stimulus applied), avoiding the "protective packaging" objection.

  ### 3. Misconceptions and Intervention Points

  **Misconception 1: "Finks and Masks have the same structure."**
  *   *When it forms:* Immediately after you introduce the Salt case. Students will see both make the conditional false and group them.
  *   *Intervention:* At the **Structural Comparison** stage. Draw two timelines on the board.
      *   Fink: Disposition exists at $t_0$ $\rightarrow$ Stimulus at $t_1$ $\rightarrow$ Disposition vanishes at $t_1$.
      *   Mask: Disposition exists at $t_0$ $\rightarrow$ Stimulus at $t_1$ $\rightarrow$ Disposition persists at $t_1$ (Manifestation blocked).
      *   *Point:* The Fink removes the *power*; the Mask blocks the *exercise* of the power.

  **Misconception 2: "A 'normal conditions' clause fixes both."**
  *   *When it forms:* During the comparison stage. Students will suggest adding "ceteris paribus" to the SCA.
  *   *Intervention:* During the **Mug Cases**. Show that "normal conditions" is too vague to distinguish intrinsic loss from extrinsic interference. If you don't specify *what* is held constant (intrinsic basis vs. extrinsic environment), the clause hides the metaphysical difference you are exposing.

  **Misconception 3: "If the disposition survives, the manifestation must survive (in weakened form)."**
  *   *When it forms:* During the Analgesic/Mask discussion (if raised) or Mug Case A.
  *   *Intervention:* When defining the Mask. Emphasize that the SCA is binary (Manifestation happens or it doesn't). A mask prevents the manifestation *simpliciter*, not just "partially." The disposition is fully present but completely frustrated.

  ### 4. Placement of the Mug Cases

  **Case B: The Annealed Mug (Brittleness vanishes on impact)**
  *   **Placement:** **Earlier.** Use this immediately after recapping the Live Wire Fink.
  *   **Purpose:** To reinforce the definition of a Fink. The stimulus (impact) triggers an intrinsic change (annealing) that removes the disposition (brittleness).
  *   **Notice:** The object *changes* to avoid the manifestation. This is an intrinsic failure.

  **Case A: The Polymer Mug (Stiffens on impact, holds shards)**
  *   **Placement:** **Later.** Use this after the Salt (Mask) case.
  *   **Purpose:** To test the Mask definition. The ceramic remains brittle (intrinsic basis intact), but the polymer (extrinsic/structural interferer) prevents the breaking (manifestation).
  *   **Notice:** The object *persists* in its disposition but is physically prevented from manifesting it. This is an extrinsic block.

  **The Hybrid Case (Both Annealing and Polymer)**
  *   **Verdict:** It is **both**. It is not a reason to doubt the distinction; it is proof that the mechanisms are independent.
  *   **Pedagogical Use:** Use this to close the Mug segment. Ask: "If both happen, do we have one problem or two?" The answer is two distinct mechanisms occurring simultaneously. This solidifies that Fink and Mask are categorically different, not points on a spectrum.

  ### 5. Final Board Question & Refusal

  **The Question:**
  > "In both the Fink and the Mask, the conditional 'If struck, it would break' is false. If you could freeze time at the exact moment of impact, what would you find **inside the object** in the Fink case that you would **not** find in the Mask case?"

  **The Wrong-but-Tempting Answer:**
  > "In the Fink case, the object is safe; in the Mask case, the object is in danger." (This focuses on the outcome, not the metaphysical basis).
  > *Or:* "In the Fink case, the stimulus didn't count; in the Mask case, it did." (This focuses on the stimulus, not the disposition).

  **The Right Answer:**
  > "In the Fink case, the intrinsic basis (brittleness) is gone/changed. In the Mask case, the intrinsic basis is still there."

  **The Refusal:**
  > **Refuse to offer the solution (The Causal Basis Analysis).**
  > Explicitly tell students: "Today is for diagnosing the disease, not prescribing the cure. We are breaking the Simple Conditional Analysis. Do not ask me what the *correct* analysis is yet. If we try to fix it now, we will obscure the distinction between the two ways it breaks."
