answer: |-
  This is a sophisticated reconstruction of a classic critique of Neurath (one that echoes Carnap's worries and later semiotic critiques). Your intuition is correct: the conclusion that Neurath should have abandoned ISOTYPE for prose is historically and philosophically wrong, even if the premises feel tight.

  The argument succeeds in proving that ISOTYPE is not **foundationalist**, but it fails to prove that ISOTYPE is not **pragmatically necessary** for Neurath's specific project.

  Here is how you can dismantle the argument while keeping (1) and (2), focusing on the weak link and your hunch about equivocation.

  ### 1. The Weak Link: Step (6)
  Step (6) is the load-bearing wall: *"So his reason for preferring pictures over words collapses, and ISOTYPE can't claim special transparency or metaphysics-free status."*

  This step assumes Neurath's reason for preferring pictures was **epistemic foundationalism** (i.e., "Pictures are true by nature; words are not"). If that were his reason, the argument destroys it. But that wasn't his reason.

  Neurath's preference for ISOTYPE was **sociological and pedagogical**, not foundational.
  *   **The Boat (Premise 2)** describes the *status* of knowledge: it is coherent, fallible, and physicalist.
  *   **ISOTYPE (Premise 1)** describes the *distribution* of knowledge: it must be accessible to the "sailors" (the working class, the public, international planners).

  **The Counter-Move:** You can accept that ISOTYPE has conventions (Step 4) and still argue it is superior to prose. Why? Because the conventions of ISOTYPE are **fewer, more visible, and easier to negotiate** than the hidden metaphysical conventions of Indo-European grammar (subject-predicate structures that imply "substance" or "causality").

  Neurath didn't think ISOTYPE was "metaphysics-free" in an absolute sense; he thought it was **"metaphysics-poor"** compared to verbal language. It strips away the grammatical baggage that leads to philosophical confusion. So, (6) is false because it sets up a straw man of Neurath's intent. He wasn't looking for a "God's eye view"; he was looking for a "Democrat's toolkit."

  ### 2. The Equivocation on "Show"
  Your hunch is spot on. The argument equivocates on **"show"** between Premise (1) and Premise (3).

  *   **In (1):** "Show" means **perceptual immediacy**. (e.g., You can see *more* widgets than *few* widgets instantly without counting). This is a cognitive/psychological claim.
  *   **In (3):** "Show" means **semantic directness**. (e.g., The image maps to reality without a code). This is a logical/semiotic claim.

  The argument uses the truth of (3) (that icons require rules) to undermine the benefit of (1) (that icons are cognitively efficient). But these are compatible.
  *   **You can argue:** Yes, recognizing the layout requires a rule (3). But once the rule is learned (e.g., "one icon = 1000 tons"), the *processing* of quantitative relations is faster and less prone to grammatical ambiguity than prose.
  *   **The Boat Connection:** If we are sailors rebuilding the ship at sea, we need tools that minimize cognitive load and maximize collective agreement. ISOTYPE is a better tool for *coordination* than prose, even if both are equally conventional.

  ### 3. What if you reject (4)?
  You asked: *"If I reject (4) instead, what do I owe?"*

  Premise (4) says: *"ISOTYPE doesn't remove hidden conventions; it buries them in the icon design."*

  If you want to reject this, you are taking a much riskier philosophical path. To deny (4), you must argue that there is a **natural, non-conventional link** between the pictogram and the fact.
  *   **What you owe:** A theory of **natural resemblance** or **affordances**. You would need to argue that certain spatial arrangements are universally understood by human cognition (e.g., via Gestalt psychology or Gibsonian ecological perception) in a way that syntax is not.
  *   **The Cost:** This risks violating Neurath's own **Physicalism**. Neurath was wary of "phenomenology" or appeals to immediate experience. If you argue icons are "natural," you sound like you are appealing to a "given" (the Myth of the Given), which Neurath explicitly rejected.
  *   **Verdict:** Don't reject (4). It's too hard to defend without betraying Neurath's anti-foundationalism. Accept (4) but deny that it matters for the *purpose* of ISOTYPE.

  ### 4. The "Neurathian Defense" (Synthesizing 1 & 2)
  Here is the strongest way to keep (1) and (2) while blocking your friend's conclusion:

  **The Argument for Compatibility:**
  1.  **Physicalism requires spatiotemporal coordinates.** Neurath's "physicalist sentences" describe objects in space and time.
  2.  **Prose is linear; Space is simultaneous.** Verbal language forces us to linearize spatial relations (syntax). ISOTYPE allows us to present spatial relations spatially.
  3.  **Therefore, ISOTYPE is actually *more* faithful to Physicalism than prose.** It mirrors the structure of the facts (spatiotemporal order) better than subject-predicate grammar does.
  4.  **The Boat Metaphor applies to the *system*, not the *medium*.** The "rebuilding at sea" refers to the verification and coherence of the *statements*, not the font they are written in.
  5.  **Conclusion:** We can be coherentists (Boat) and still prefer a medium (ISOTYPE) that reduces the friction of communication. In fact, for a collective of sailors to rebuild the ship together, they need a blueprint, not a poem. ISOTYPE is the blueprint.

  ### Summary of the Fix
  *   **Keep (1) & (2):** They are historically correct.
  *   **Accept (3) & (4):** Icons do have conventions. Don't fight semiotics.
  *   **Attack (5) & (6):** Just because both have conventions doesn't mean they are *equally useful*. The "principled gap" isn't about *truth*; it's about *accessibility* and *grammatical neutrality*.
  *   **Reject the Friend's Conclusion:** Neurath shouldn't drop ISOTYPE. He should clarify that ISOTYPE is not a **foundation** for the Boat, but a **tool** for the sailors.

  Your friend's argument proves ISOTYPE isn't magic. Neurath never claimed it was. He claimed it was better engineering for the ship.
