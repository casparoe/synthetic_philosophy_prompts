answer: |-
  **JOINT STATEMENT ON THE NATURE OF EMOTION**

  **I. Shared Commitments**
  We agree on the following claims regarding emotional episodes:
  1.  **Intentionality:** Emotions are about objects (situations, persons, events); they are not free-floating states.
  2.  **Anti-Jamesian:** Emotions are not constituted by bare bodily feelings. The crude view that we fear *because* we tremble gets the order backwards; bodily arousal may accompany or motivate, but it does not define the emotion's content.
  3.  **Normativity:** Emotions stand in relations to reasons. They can be fitting or unfitting relative to their objects.
  4.  **Motivation:** Emotions typically possess action-tendencies (e.g., flight in fear, confrontation in anger).
  5.  **Recalcitrance:** Emotions can persist despite contrary evaluations (e.g., fearing what one knows is safe).
  6.  **Content:** Emotions have evaluative content (representing something as dangerous, offensive, or lost).

  *Exclusion:* These commitments jointly rule out Pure Feeling Theory. A theorist claiming emotions are *only* somatic sensations must deny claim #1 (object-directedness) and #6 (evaluative content). We both reject that view.

  **II. Points of Disagreement**

  | Crux | Judgment Theory (JT) Formulation | Perceptual Theory (PT) Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **Constitution** | Emotion is a evaluative *belief* or assent to propositional content. | Emotion is an evaluative *experience* presenting content, akin to perception. | Substantive |
  | **Revision** | Emotions are rationally revised by contrary evidence/belief. | Emotions can persist despite contrary belief (like optical illusions). | Substantive |
  | **Conceptuality** | Emotion requires conceptual capacity to judge the object. | Emotion allows non-conceptual content (available to infants/animals). | Substantive |

  **III. Verbal vs. Substantive Diagnosis**
  Is this dispute merely verbal? Partly. If "judgment" denotes *any* contentful state, the label is verbal. However, the dispute is **substantive** regarding *force*. JT claims emotion entails *assenting* to the truth of the content (mind-to-world direction of fit). PT claims emotion entails *presenting* content without necessary assent (world-to-mind or distinct perceptual fit). The real work is done by this claim: *Does holding an emotion require taking its content to be true?* JT says yes; PT says no.

  **IV. Case Analysis**

  **1. The Recalcitrant Spider**
  *Subject judges spider harmless, acts safely, yet reports fear.*
  *   **Crux:** Revision / Constitution.
  *   **JT Prediction:** Subject holds conflicting unconscious judgments, or the fear is irrational malfunction.
  *   **PT Prediction:** Subject experiences an emotional illusion (like a bent stick); no conflict of belief required.
  *   **Impact:** Moves JT. JT must posit hidden mental states to maintain identity thesis. PT accommodates naturally. To move PT, JT would need evidence that removing the belief *always* removes the fear.

  **2. The Hernandez Protocol (Double Dissociation)**
  *Drug A blocks belief-updating (judgments stale, fear tracks danger). Drug B blocks emotional updating (fear stale, judgments track danger).*
  *   **Crux:** Constitution / Independence.
  *   **JT Prediction:** Drug A should be impossible (if fear=judgment, updating one updates the other).
  *   **PT Prediction:** Expected result (separate systems interacting).
  *   **Impact:** Strongly moves JT. JT must argue Drug A blocks *expression* of judgment, not the state itself. PT takes this as confirmation of distinct mechanisms. To move PT, JT would need evidence that Drug A subjects lack genuine fear (e.g., no physiological response).

  **3. Interoceptive Deafferentation**
  *Subject loses all bodily arousal feedback but reports unchanged emotion content/fittingness, only lost 'feel'.*
  *   **Crux:** Anti-Jamesian Commitment.
  *   **JT Prediction:** Emotion remains (judgment intact).
  *   **PT Prediction:** Emotion remains (content intact), though phenomenology altered.
  *   **Impact:** **Neutral.** Both theories are anti-Jamesian. This case rules out Feeling Theory, not JT or PT. It is a dud for distinguishing us. To make it bite, we would need evidence that without arousal, *evaluative content* vanishes (which contradicts our shared Claim #6).

  **4. Developmental/Animal Case**
  *Infant/animal shows full emotional syndrome without conceptual capacity.*
  *   **Crux:** Conceptuality.
  *   **JT Prediction:** Subjects possess proto-conceptual capacities sufficient for judgment.
  *   **PT Prediction:** Subjects possess non-conceptual perceptual content.
  *   **Impact:** Moves JT. JT must stretch "judgment" to include non-conceptual states, risking emptiness. PT fits naturally. To move PT, JT would need evidence that animals lacking concepts also lack genuine emotions (e.g., they behave reflexively without fittingness).

  **V. Conclusion**
  We agree emotions are contentful, object-directed, and distinct from bare feeling. We disagree on whether that content is believed (JT) or perceived (PT). The Hernandez Protocol and Developmental Case favor PT. The Recalcitrant Spider favors PT but is accommodable by JT. The Deafferentation Case is neutral. The substantive core is whether emotion entails truth-assent. We will proceed by testing the assent claim directly.
