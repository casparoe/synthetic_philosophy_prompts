answer: |-
  ### 1. Exam Question

  **Question 4: The Architecture of Intuition Pumps (25 marks)**

  **Background Definitions:**
  *   **Taxonomy:** A **Coherence Pump** makes a scenario conceivable to assert possibility. An **Extension Pump** tests whether a concept applies to a case. A **Premise Pump** lends pre-theoretic support to a substantive claim.
  *   **Diagnostics:** The **Mirror Test** inverts a suspected feature; if the verdict holds, the feature is incidental. The **Blank Control** strips target content but keeps narrative shape; if the verdict holds, it is **Pump Capture** (reaction to strangeness) rather than target tracking. **Pump Leakage** occurs when verdicts are driven by features outside the supported claim.
  *   **The Circularity Problem:** Identifying "load-bearing" features seems to require a prior theory of the target property, which is what the pump was meant to settle.

  **Task:**
  Consider Robert Nozick's **Experience Machine** (a tank that stimulates your brain to feel you are living a perfect life, indistinguishable from reality).

  **Part A (Pre-registration):** Before arguing for any verdict on whether you would enter the machine, write down: (i) which specific narrative features you treat as load-bearing versus incidental, and (ii) what specific theoretical claim these features are meant to support or undermine.

  **Part B (Analysis):** Apply the Mirror Test and Blank Control to the Experience Machine. Describe specifically what feature you would invert for the Mirror Test and what a Blank Control scenario would look like.

  **Part C (The Crux):** Address the Circularity Problem. Can these diagnostics be run in a non-question-begging way? Argue for which of the three pump jobs (Coherence, Extension, Premise) survives this scrutiny and which fails.

  *(Note to Professor: The Experience Machine is chosen because its narrative details—deception, passivity, pre-programming—are distinct enough to allow clean inversion for the Mirror Test, yet entangled enough to trigger the Circularity Problem sharply. **Flag:** Part C is the sub-question a memorized summary cannot touch, as it requires evaluating the viability of the diagnostics themselves rather than reciting their definitions.)*

  ***

  ### 2. Model Answer

  The Experience Machine functions primarily as a Premise Pump intended to undermine hedonism by eliciting the verdict that we value things other than experience `[High]`. However, it also operates as an Extension Pump testing the concept of "well-being" `[High]`. To evaluate this, I pre-register the following: the load-bearing feature is the *lack of contact with reality*, while incidental features include the *technological mechanism* (tanks/electrodes) and the *passivity* of the user `[Medium]`. The target claim is that reality contact is a constituent of well-being `[High]`.

  Applying the diagnostics reveals significant friction. For the Mirror Test, I invert the "lack of contact" feature: imagine a machine that guarantees reality contact but alters your experiences to feel worse. If the verdict shifts (we prefer reality even with worse feelings), the feature is load-bearing `[Medium]`. For the Blank Control, I construct a scenario involving a "Deception Pill" that makes you believe you are successful when you are not, stripping the sci-fi narrative but keeping the deception structure `[High]`. If students reject the machine but accept the pill, the verdict is likely Pump Capture driven by the weirdness of tanks rather than the value of reality `[Medium]`.

  However, running these diagnostics triggers the Circularity Problem. To decide whether "lack of contact" is load-bearing, I must already know whether contact matters for well-being `[High]`. If I assume contact matters, I classify it as load-bearing; if I assume only experience matters, I classify it as incidental leakage `[High]`. Thus, the diagnostic presupposes the conclusion the pump was meant to establish `[High]`. The Mirror Test fails here because inverting "contact" often changes multiple variables (e.g., agency, achievement), creating confounding variables that require theory to disentangle `[Medium]`.

  Can this circularity be rescued? I argue that the diagnostics can be saved for negative uses but not positive ones `[High]`. As a Premise Pump establishing a positive theory of well-being, the Experience Machine fails because the diagnostics cannot isolate the variable without prior theory `[High]`. However, as a negative tool to break a sufficiency claim (e.g., "experience is *all* that matters"), it survives `[High]`. We do not need a full theory of well-being to see that the machine contradicts pure hedonism; we only need the pre-theoretic intuition that something is missing `[Medium]`. This negative use bypasses the need to identify exactly *what* is load-bearing, only that *something* beyond experience is `[High]`.

  Regarding the taxonomy, the Coherence Pump job survives best `[Medium]`. Showing the machine is conceivable requires no theory of well-being, only conceptual competence `[High]`. The Extension Pump job is vulnerable `[Medium]`. Deciding if the machine user is "well-off" requires the very theory the pump tests, leading to Pump Leakage where reactions to deception masquerade as judgments of well-being `[High]`. The Premise Pump job is partially salvageable only via the negative route described above `[Medium]`.

  Triangulation offers a partial rescue `[Low]`. If we use multiple pumps with disjoint incidental features (e.g., Experience Machine, Violinist, Utility Monster) and they all point against hedonism, we reduce the risk that a single incidental feature is driving the verdict `[Medium]`. However, this does not solve the foundational circularity of identifying the target property `[High]`. Ultimately, the diagnostics reveal that the Experience Machine measures facts about our concepts (we conceptually distinguish reality from experience) rather than metaphysical facts about the world `[High]`. Therefore, the pump succeeds as a conceptual map but fails as a metaphysical proof `[Medium]`. The circularity is unavoidable for positive premise pumping because the "load-bearing" split is theory-laden `[High]`. We must accept the pump as a request for reflective equilibrium rather than a standalone proof `[High]`.

  ***

  ### 3. Marking Scheme

  **Total: 25 Marks**

  **1. Pre-registration & Taxonomy (5 marks)**
  *   **Must-Hit:** Clearly identifies load-bearing vs. incidental features and the target theoretical claim before arguing verdict. (3 marks)
      *   *Typical Error:* Listing features after arguing the verdict, or conflating mechanism with target property.
  *   **Must-Hit:** Correctly classifies the pump (Premise/Extension) based on the pre-registered claim. (2 marks)
      *   *Typical Error:* Calling it solely a Coherence Pump without addressing the substantive claim.

  **2. Application of Diagnostics (5 marks)**
  *   **Must-Hit:** Describes a specific inversion for the Mirror Test (not just "change the story"). (2 marks)
      *   *Typical Error:* Inverting too many features at once (confounding).
  *   **Must-Hit:** Describes a plausible Blank Control (structural match, content stripped). (2 marks)
      *   *Typical Error:* Making the control too dissimilar in narrative shape.
  *   **Must-Hit:** Correctly identifies risk of Pump Capture vs. Leakage. (1 mark)

  **3. The Circularity Crux (10 marks)**
  *   **Must-Hit:** Explicitly articulates why identifying load-bearing features presupposes the conclusion. (4 marks)
      *   *Typical Error:* Stating circularity exists but not explaining the mechanism (theory-ladenness).
  *   **Must-Hit:** Takes a clear position on whether diagnostics can be rescued (e.g., negative use, triangulation). (3 marks)
      *   *Typical Error:* Asserting diagnostics work perfectly or fail completely without nuance.
  *   **Must-Hit:** Evaluates which pump jobs (Coherence, Extension, Premise) survive the rescue. (3 marks)
      *   *Typical Error:* Lumping all jobs together rather than distinguishing their vulnerability.

  **4. Argument Quality & Structure (5 marks)**
  *   **Must-Hit:** Logical flow, clear prose, adheres to word limits. (3 marks)
  *   **Must-Hit:** Engages with the "trap" of inversion changing multiple variables. (2 marks)

  **A vs. B Distinction:**
  *   **A (20-25):** Explicitly solves or dissolves the circularity problem (e.g., via negative use or conceptual reinterpretation) and distinguishes pump jobs.
  *   **B (15-19):** Identifies circularity but treats all pump jobs as equally vulnerable, or offers a generic "triangulation" solution without addressing the theory-ladenness of feature selection.

  **Dissent Policy:**
  *   **Full Credit:** If a student argues convincingly that the diagnostics *can* be run non-question-beggingly (e.g., via empirical calibration of intuitions), they receive full marks for Section 3 provided they justify *how* the theory-ladenness is avoided.
  *   **No Credit:** If they deny the circularity problem exists without argument.
  *   **Attackable Claims:** Students may attack any claim tagged `[Medium]` or `[Low]` in the Model Answer's Epistemic Note (see Deliverable 4). Claims tagged `[High]` are considered core course commitments; attacking them requires exceptional justification to avoid mark penalties.

  ***

  ### 4. Epistemic Note

  **Substantive Claims & Confidence Tags:**
  1.  Experience Machine is primarily a Premise Pump undermining hedonism `[High]`.
  2.  It operates as an Extension Pump testing "well-being" `[High]`.
  3.  Load-bearing feature is lack of contact with reality `[Medium]`.
  4.  Target claim is reality contact is a constituent of well-being `[High]`.
  5.  Mirror Test inversion: guarantee reality contact but worse feelings `[Medium]`.
  6.  Blank Control: Deception Pill scenario `[High]`.
  7.  Verdict shift indicates Pump Capture driven by tanks `[Medium]`.
  8.  Identifying load-bearing features requires prior theory of well-being `[High]`.
  9.  Diagnostic presupposes the conclusion `[High]`.
  10. Inverting contact changes multiple variables (agency, achievement) `[Medium]`.
  11. Diagnostics saved for negative uses, not positive ones `[High]`.
  12. Premise Pump fails for positive theory establishment `[High]`.
  13. Negative tool to break sufficiency claim survives `[High]`.
  14. Pre-theoretic intuition that something is missing `[Medium]`.
  15. Coherence Pump job survives best `[Medium]`.
  16. Conceivability requires only conceptual competence `[High]`.
  17. Extension Pump job is vulnerable `[Medium]`.
  18. Pump Leakage where reactions to deception masquerade as well-being judgments `[High]`.
  19. Premise Pump partially salvageable via negative route `[Medium]`.
  20. Triangulation offers partial rescue `[Low]`.
  21. Disjoint incidental features reduce risk `[Medium]`.
  22. Triangulation does not solve foundational circularity `[High]`.
  23. Pump measures facts about concepts rather than world `[High]`.
  24. Pump succeeds as conceptual map, fails as metaphysical proof `[Medium]`.
  25. Circularity unavoidable for positive premise pumping `[High]`.
  26. Pump is a request for reflective equilibrium `[High]`.

  **Least Confident Claim:**
  I am least confident in the claim that triangulation offers only a partial rescue `[Low]`. My confidence would rise if independent pumps consistently converged on the same negative verdict across diverse cultures, suggesting the intuition isn't theory-laden. It would lower if historical analysis showed all such pumps share a hidden cultural assumption, rendering triangulation illusory. I permit students to attack claims tagged `[Medium]` and `[Low]` for full credit; attacking `[High]` claims requires demonstrating a fundamental flaw in the course's methodological framework.
