answer: |-
  # Spec Sheet: Normative Theory of Collective Memory vs. Historical Record

  **Objective:** Define the necessary conditions for a theory to adequately adjudicate conflicts between collective memory (socially held narratives, oral traditions, commemorative practices) and the historical record (archival evidence, forensic reconstruction, academic consensus).

  **Scope:** Public history, transitional justice, education policy, monument management, and intergroup relations.

  ---

  ## 1. Core Desiderata (The "Must-Haves")

  Any serious theory must satisfy the following five requirements. Failure to meet any one renders the theory descriptively inaccurate or normatively useless.

  ### 1.1 Epistemic Discrimination
  **Requirement:** The theory must provide a mechanism to distinguish between *factual error* and *interpretive difference* without collapsing into radical relativism.
  **Reasoning:** Not all memories are claims of fact (some are moral claims), but when a memory makes a factual claim (e.g., "no one died here"), the theory must be able to label it false if evidence contradicts it. If every narrative is treated as "true for them," the theory ceases to be about history and becomes theology.

  ### 1.2 Functional Validity
  **Requirement:** The theory must explain the *utility* of a memory without validating its *truth*.
  **Reasoning:** Communities often hold factually dubious memories because they serve a vital social function (cohesion, resilience, moral instruction). A theory that simply deletes "false" memories ignores why they exist. It must account for the *value* of the memory to the holder, distinct from its *accuracy*.

  ### 1.3 Harm Asymmetry
  **Requirement:** The theory must weigh the harm of *falsehood* against the harm of *truth-telling*.
  **Reasoning:** Publishing an accurate historical record can sometimes incite violence, re-traumatize victims, or destabilize a fragile peace. Conversely, maintaining a false memory can perpetuate injustice or enable future violence. The theory needs a calculus for when epistemic integrity yields to physical safety, and when it does not.

  ### 1.4 Agency Attribution
  **Requirement:** The theory must distinguish between *organic* memory formation and *engineered* mnemonic manipulation.
  **Reasoning:** A story that emerges from a community over generations carries different normative weight than a narrative imposed by a state ministry or a propaganda unit. The source of the memory matters for its legitimacy.

  ### 1.5 Temporal Flexibility
  **Requirement:** The theory must account for the different time-horizons of memory and history.
  **Reasoning:** Memory is presentist (it serves the now); History is reconstructive (it serves the then). A theory must explain how a narrative can be "wrong" historically but "right" for the current social needs, and whether that state is sustainable long-term.

  ---

  ## 2. The Test Cases (Edge Conditions)

  A theory that works only for easy cases is useless. It must successfully navigate these three specific scenarios:

  ### 2.1 The Vital Myth
  **Scenario:** A community's foundational memory is factually incorrect (e.g., exaggerated heroism, sanitized origins) but is the primary source of their social cohesion and political agency.
  **Theory Task:** Must allow for the *preservation* of the narrative's social function while marking its *factual status* as contested or false. It cannot simply demand the myth be destroyed (which destroys the group) nor can it endorse the lie (which corrupts the record).

  ### 2.2 The Dangerous Truth
  **Scenario:** The historical record is accurate (e.g., location of mass graves, identities of perpetrators) but publishing it immediately would cause material harm (vigilante violence, collapse of a peace treaty).
  **Theory Task:** Must justify *temporary suppression* or *contextualized release* without classifying the suppression as "denialism." It must distinguish between *hiding* truth and *stewarding* truth.

  ### 2.3 The Relevance Dispute
  **Scenario:** Both sides agree on the facts (e.g., "This general fought for a slave-holding regime"), but conflict over *significance* (e.g., "He was a traitor" vs. "He was a hero of heritage").
  **Theory Task:** Must resolve conflicts over *valuation* without pretending they are conflicts over *fact*. It must provide a normative basis for deciding which facts get public honor, acknowledging that selection is inherently political.

  ---

  ## 3. Critical Distinctions (Boundaries to Preserve)

  The theory must maintain conceptual separation between these pairs. Conflating them leads to category errors.

  ### 3.1 Correction vs. Erasure
  **Distinction:** *Correction* adds context or amends the record (e.g., adding a plaque to a statue). *Erasure* removes the trace entirely (e.g., toppling the statue and burning the archives).
  **Why:** Correction respects the historical reality that the event/person existed; Erasure risks creating a new falsehood (that they never existed). A serious theory must prefer correction as the default normative stance.

  ### 3.2 State-Mandated Forgetting vs. Organic Cultural Amnesia
  **Distinction:** *State-Mandated* is legal/coercive (amnesty laws, banned books). *Organic* is the natural fading of relevance over generations.
  **Why:** State forgetting is a political act requiring justification (e.g., peace). Organic amnesia is a cognitive/sociological process. Conflating them treats natural drift as policy failure, or policy failure as natural drift.

  ### 3.3 Mnemonic Sovereignty vs. Denialism
  **Distinction:** *Mnemonic Sovereignty* is a community's right to interpret its own suffering and identity. *Denialism* is the assertion of falsehoods that infringe on the rights or reality of others (e.g., genocide denial).
  **Why:** Sovereignty is about self-definition; Denialism is about external negation. A theory must protect the former while policing the latter. The boundary lies in *harm to others* and *verifiable falsification*.

  ---

  ## 4. Cognitive and Epistemic Constraints

  ### 4.1 Group Cognition Compatibility
  **Constraint:** The theory cannot treat collective memory as merely "many individual memories added up."
  **Reasoning:** Memory is distributed across artifacts, rituals, institutions, and landscapes. It exists outside individual heads. A theory based solely on individual psychology (e.g., trauma processing) will fail to explain why memories persist after the original witnesses die.

  ### 4.2 Epistemic Non-Relativism
  **Constraint:** The theory cannot treat all narratives as equally valid descriptions of reality.
  **Reasoning:** To maintain contact with "history," there must be an external anchor (evidence). If the theory grants equal ontological status to a forensic report and a conspiracy theory, it loses its explanatory power. It must be able to call some accounts *false*.

  ---

  ## 5. Jointly Unsatisfiable Pairs (The Tensions)

  No theory can maximize all values simultaneously. The following pairs are in tension; a theory must prioritize one over the other in specific contexts.

  1.  **Absolute Epistemic Integrity vs. Absolute Harm Reduction.**
      *   *Conflict:* You cannot always publish every verified truth immediately without risking lives (see Test Case 2.2).
      *   *Resolution:* The theory must allow for *temporal delay* of truth, acknowledging this as a tragic cost, not a virtue.

  2.  **Mnemonic Sovereignty vs. Universal Historical Standard.**
      *   *Conflict:* If a community claims sovereignty over a narrative that contradicts the universal historical record, you cannot honor both.
      *   *Resolution:* Sovereignty must be limited by the *non-infringement principle* (your memory cannot deny my existence).

  3.  **Social Cohesion vs. Factual Accuracy.**
      *   *Conflict:* Sometimes the truth is divisive; the myth is unifying.
      *   *Resolution:* The theory must reject cohesion built on verifiable falsehood as *unstable* long-term, even if it is functional short-term.

  ---

  ## 6. The "Killer" Requirement for Liberal-Pluralism

  **The Requirement:** **The Prohibition on Symmetrical Validity.**

  **Why it knocks out Liberal-Pluralist Answers:**
  Common liberal-pluralist approaches rely on a "marketplace of ideas" or an "overlapping consensus." They tend to treat competing narratives as symmetrical claims that should be balanced through dialogue and tolerance. They assume that if we protect the *right* to remember, the truth will eventually emerge or coexist peacefully.

  This spec sheet demands **Epistemic Accountability that overrides Cultural Autonomy in cases of verifiable falsification causing material harm.**

  A serious theory cannot remain neutral between a victim's testimony backed by forensic evidence and a perpetrator's narrative backed by state power. Liberal pluralism often tries to bracket the truth claim to preserve peace ("Let's agree to disagree"). This spec requires the theory to adjudicate: one account is factually superior, and that superiority carries normative weight that can restrict the other narrative's public expression. You cannot be neutral about denialism. This requirement forces the theory to take a side, which breaks the liberal-pluralist commitment to state neutrality in matters of the "good" (or in this case, the "true").

  ---

  ## 7. Note on Post-Conflict "Structured Forgetting"

  **Can Narrative Rights square with Obligation to Correct?**
  Yes, but only through **Contextual Stewardship**.

  In post-conflict societies, "structured forgetting" (e.g., amnesty in exchange for truth, or delaying the naming of perpetrators) is sometimes defended as mnemonic reparation.
  *   **The Squaring:** The theory must treat this not as *erasure*, but as *archiving under seal*. The record is corrected (the truth is known to the commission), but the public performance of that memory is delayed.
  *   **The Limit:** This is only permissible if the *record is preserved* for future generations. If "forgetting" means destroying the evidence, it fails the **Epistemic Discrimination** requirement. If it means "we know, but we will not prosecute/commemorate yet for safety," it can be compatible, provided it is framed as a *temporary suspension* rather than a *final judgment*.

  **Non-Negotiable vs. Camp Preferences:**
  *   **Non-Negotiable:** Epistemic Non-Relativism (4.2), Harm Asymmetry (1.3), Agency Attribution (1.4). Without these, the theory is either propaganda or nonsense.
  *   **Camp Preferences:** Temporal Flexibility (1.5) and the specific resolution of the Sovereignty vs. Standard tension (5.2). Different theories will weigh the "right to fade" vs. the "duty to remember" differently, provided they adhere to the non-negotiables.
