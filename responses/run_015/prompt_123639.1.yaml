prompt: |-
  Right, I'm putting together a feature on collective memory clashing with the historical record — you know, the fights over monuments, school programmes, or oral traditions that don't match the archives. Before I talk to anyone, I want the spec sheet for what a normative theory in this space actually has to deliver.

  Write the desiderata: what must any adequate theory of collective memory versus history recieve to count as serious? Give me the cases it has to get right — when a community's memory is factually wrong but socially vital, when the record is accurate but publishing it would cause real harm, and when the conflict isn't about facts at all but about which facts matter. List the distinctions it must preserve — between correcting error and erasing identity, between state-mandated forgetting and organic cultural amnesia, and between mnemonic sovereignty (a community's right to shape its own narrative) and mere denialism. Say what's behind each one.

  It also needs to sit comfortably with what we actually know about group cognition — not just individual psychology blown up — and with basic epistemic norms; you can't treat every narrative as equally valid if you still want to call some accounts false. Flag which pairs of these look jointly unsatisfiable. I'm particularly interested in wheter respecting a community's narrative rights can ever be squared with an obligation to correct the record, especially in post-conflict societies where "structured forgetting" is sometimes defended as a kind of mnemonic reparation. Which single requirement knocks out the most common liberal-pluralist answers?

  Don't give me a bibliography or reading list — I can't check those without access, and neither can my readers if they're offline. Just the full requirements list with the reasoning, a quick note on which are non-negotiable versus camp preferences, and flag any subset that's jointly unsatisfiable. There's probably a typo in my brief somewhere but you get the idea.
