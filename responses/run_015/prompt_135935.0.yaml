      *   *Steps:* 1. Define variables. 2. Counterfactual (Lewis). 3. Mechanism/Intervention (Woodward). 4. Confounds. 5. Verdict.
      *   *Case 1 Application:* Walk through the steps. Show where it clears the collective.
      *   *Case 2 Application:* Walk through steps. Show the overdetermination glitch.
