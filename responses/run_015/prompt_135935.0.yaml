  9.  **Final Polish:** Ensure the distinction between "Counterfactual Dependence" (would it have happened?) and "Interventionist Invariance" (does changing this variable reliably change that one?) is clear in the steps. Make sure the "Vote" section handles the normative aspect (who *should* take blame/credit even if causation is murky).

