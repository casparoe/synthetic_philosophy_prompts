  2.  **Deconstruct the Philosophical Frameworks:**
      *   *Counterfactual (Lewis):* Focuses on dependence. $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred (in the closest possible world). Good for "but-for" testing. Weakness: Preemption, Overdetermination.
      *   *Interventionist (Woodward):* Focuses on manipulation/invariance. $C$ causes $E$ if an intervention on $C$ changes $E$ while holding other variables fixed. Good for mechanisms and structure. Weakness: Requires knowing the causal graph/structure.
      *   *Integration:* Use Counterfactuals for the initial "but-for" test. Use Interventionism to check if the link is robust and not spurious (i.e., is there a pathway?). Use Voting for cases where philosophy underdetermines the answer (e.g., symmetric overdetermination).

  3.  **Drafting the Decision Procedure (The "Causal Audit"):**
      *   Need a step-by-step flow.
      *   *Step 1: Definition.* Define the Event (E) and the Candidate Cause (C).
