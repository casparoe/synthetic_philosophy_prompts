answer: |-
  Here is a reusable decision procedure designed for your Monday check-ins. It integrates Lewis-style counterfactuals (dependence) and Woodward-style interventionism (manipulability/mechanism) into a single workflow.

  # The Wetland Causal Audit (WCA)
  **Purpose:** To determine if the Collective is causally responsible for an outcome (Credit/Blame).
  **Participants:** Facilitator (keeps time), Data Lead (holds measurements), Team (votes).

  ---

  ## Phase 1: Variable Definition & Data Gate
  *Before asking "Why," agree on "What."*

  **Q1.1: What is the specific Effect (E)?**
  *   **Pass:** E is measurable and time-bound (e.g., "Water level dropped 15cm between June 1–30," not "The wetland is dry").
  *   **Fail:** E is vague ("The ecosystem is unhappy"). **STOP.** Redefine E.

  **Q1.2: What is the Candidate Cause (C)?**
  *   **Pass:** C is a specific action taken by the Collective (e.g., "Planted 500 reeds," "Installed barrier").
  *   **Fail:** C is external or vague ("The weather," "Nature"). **STOP.** (You cannot take credit/blame for external causes).

  **Q1.3: Do we have Baseline Data? (CRITICAL GATE)**
  *   **Requirement:** Do we have measurements of E *before* C occurred, and a control metric (e.g., regional rainfall/neighboring wetland levels)?
  *   **Pass:** Yes, we have pre-intervention data and external context. **Proceed to Phase 2.**
  *   **Fail:** No, we are guessing the baseline. **FLAG:** *Causal Breakdown.* You cannot run the Counterfactual test without a baseline.
      *   **Action:** Move immediately to **Phase 5 (Voting)** but annotate the decision as "Speculative."

  ---

  ## Phase 2: The Counterfactual Test (Lewis Check)
  *Tests for Dependence: "But-for" causation.*

  **Q2.1: The Negation Test**
  *   **Question:** In the closest possible world where we did **not** perform C, would E still have occurred?
  *   **Method:** Compare our site to a control site (nearby wetland) or historical averages during the same period.
  *   **Pass (Dependence Found):** No. If we hadn't done C, E would not have happened (or would have been significantly different). **Proceed to Phase 3.**
  *   **Fail (No Dependence):** Yes. E would have happened anyway (e.g., regional drought caused the drop, not the reeds).
      *   **Action:** **HARD NO.** The Collective is not causally responsible.
      *   **Exception:** If there are multiple sufficient causes (Overdetermination), proceed to Phase 3 anyway.

  ---

  ## Phase 3: The Interventionist Test (Woodward Check)
  *Tests for Mechanism: Is the link manipulable and invariant?*

  **Q3.1: The Pathway Check**
  *   **Question:** Is there a known physical mechanism linking C to E? (e.g., Reeds transpire water; Barriers restrict flow).
  *   **Pass:** Yes, the physics/biology is established.
  *   **Fail:** No, it's magic or correlation. **HARD NO.**

  **Q3.2: The Invariance Check**
  *   **Question:** If we were to intervene and change the *magnitude* of C (e.g., plant half as many reeds), would E change proportionally?
  *   **Pass:** Yes. The relationship holds under hypothetical manipulation.
  *   **Fail:** No. The system is saturated or the link is spurious. **HARD NO.**

  **Q3.3: The Confound Check**
  *   **Question:** Can we hold other variables fixed? (e.g., Did it rain the same amount at our site as the control site?)
  *   **Pass:** Yes, we can isolate C.
  *   **Fail:** No, too many variables changed at once. **FLAG:** *Causal Breakdown.* Move to **Phase 5 (Voting)**.

  ---

  ## Phase 4: Overdetermination & Joint Causation
  *Handles cases where multiple causes are sufficient.*

  **Q4.1: Symmetric Overdetermination**
  *   **Scenario:** Two causes (C1 = Collective Action, C2 = External Event) are both sufficient to cause E individually.
  *   **Logic:** The Counterfactual Test (Phase 2) will fail for both (because if you remove C1, C2 still causes E).
  *   **Resolution:** If Phase 3 (Mechanism) passes for C1, acknowledge **Joint Causation**.
  *   **Action:** Do not issue a Hard No. Proceed to Phase 5 to assign *degree* of responsibility.

  ---

  ## Phase 5: The Normative Vote
  *Where philosophy ends and policy begins.*

  **Trigger:** Enter this phase if:
  1.  Data is missing (Phase 1 Fail).
  2.  Confounds are too high (Phase 3 Fail).
  3.  Overdetermination exists (Phase 4).
  4.  The team refuses the "Hard No" from Phase 2.

  **The Vote:**
  *   **Option A:** Full Credit/Blame (We own it).
  *   **Option B:** Partial Credit/Blame (We contributed, but didn't determine).
  *   **Option C:** No Responsibility (We were present, but not causal).

  **Rule:** A 2/3 majority is required to override a "Hard No" from Phase 2 or 3. If the vote overrides the logic, the minutes must record: *"Decision based on policy, not causal evidence."*

  ---

  # Application to Your Cases

  ## Case 1: Reeds vs. Regional Drought
  *Outcome: Not our fault (Unpopular)*

  *   **Phase 1:** E = Water table drop. C = Reed planting. **Baseline Data:** Regional rainfall records exist. **PASS.**
  *   **Phase 2 (Counterfactual):** If we hadn't planted reeds, would the water table drop?
      *   *Evidence:* Neighboring untreated wetlands dropped by the same amount.
      *   *Result:* **FAIL.** (E happens without C).
      *   *Logic:* Lewis says no dependence. The "closest possible world" without reeds looks the same because the drought is the dominant variable.
  *   **Phase 3 (Interventionist):** Even if reeds drink water (Mechanism = Pass), does the *scale* of our planting break the dependency?
      *   *Evidence:* Transpiration rate of 500 reeds << Volume lost to regional evaporation/drought.
      *   *Result:* **FAIL.** The invariant relationship is between Region/Drought and Water Level, not Reeds/Water Level.
  *   **Verdict:** **HARD NO.** The Collective is not to blame.
  *   **Team Friction:** The team wants to own the mistake to show accountability.
  *   **Procedure Fix:** Force them to **Phase 5**. Vote to issue a statement: *"While we are not causally responsible (Phase 2 Fail), we commit to monitoring reed density during future droughts."* This satisfies the moral urge without lying about the science.

  ## Case 2: Beavers vs. Flow Barriers
  *Outcome: Split Credit/Causation*

  *   **Phase 1:** E = Localized Flooding. C1 = Our Barriers. C2 = Beaver Dams. **Baseline Data:** **FLAG.** *Did we measure water levels before the beavers arrived?*
      *   *If No:* **Causal Breakdown.** Go straight to Phase 5.
      *   *If Yes:* Proceed.
  *   **Phase 2 (Counterfactual):**
      *   Test C1 (Barriers): If we remove barriers, does flooding stop? No, beavers are there. (**FAIL**)
      *   Test C2 (Beavers): If beavers leave, does flooding stop? No, barriers are there. (**FAIL**)
      *   *Logic:* Classic Symmetric Overdetermination. Lewis's simple theory says neither is a cause.
  *   **Phase 3 (Interventionist):**
      *   Test C1: If we lower the barrier, does water level drop? **Yes.** (Manipulable).
      *   Test C2: If beavers breach dam, does water level drop? **Yes.** (Manipulable).
      *   *Logic:* Woodward saves us here. Both are causes because both are independent levers that change the outcome.
  *   **Phase 4:** Mark as **Joint Causation**.
  *   **Phase 5 (Vote):** How to split credit?
      *   *Recommendation:* Vote for **Option B (Partial)**.
      *   *Statement:* "Flooding is jointly caused. We claim 50% responsibility for the water retention capacity, acknowledging the beaver contribution."
  *   **Data Breakdown Flag:** If you lack pre-beaver measurements, you cannot prove the flooding is *worse* than baseline. You must record: *"Causal claim speculative due to missing baseline prior to beaver colonization."*

  ---

  # Summary of Breakdown Points (Where the Procedure Fails)

  1.  **Missing Baseline (Phase 1):** If you don't know the water level before you acted, you cannot run the Counterfactual. You are guessing. *Procedure forces a "Speculative" tag.*
  2.  **Systemic Noise (Phase 3):** If rainfall varies wildly between your site and the control site, you cannot hold variables fixed. The Interventionist test fails. *Procedure forces a Vote.*
  3.  **Moral vs. Causal (Phase 5):** The team may want to take blame for PR reasons even if the Counterfactual test says "Not Us." *Procedure allows this but requires it be minuted as a Policy Decision, not a Scientific Finding.*

  **Tip for Tomorrow:** Print this. When someone says "We caused the flood," ask: "Did we pass Phase 2?" If they can't answer, you aren't arguing opinion, you're arguing procedure.
