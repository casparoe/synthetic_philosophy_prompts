          *   Interventionist: Can we manipulate C1 to change E? Yes. C2? Yes.
          *   Resolution: Need to split credit or acknowledge joint sufficiency.
          *   Data Issue: If we don't know water levels *before* beavers/barriers, we can't establish the baseline.

  5.  **Refining the Procedure (Iterative Polish):**
