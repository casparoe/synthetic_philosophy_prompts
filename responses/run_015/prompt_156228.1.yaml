      *   *LLM Analogy:* LLMs offload *reasoning*. The "steps" (latent space traversals) are not accessible or intelligible to the user. We get the conclusion without the derivation. If the LLM hallucinates, we often can't verify *why* without doing the work ourselves (which defeats the purpose of outsourcing).
      *   *Procedural Atrophy:* If I don't practice the intermediate steps of an argument (premises -> logic -> conclusion), do I lose the ability to construct them? Yes. But is it just loss of skill, or loss of *grasp*?
