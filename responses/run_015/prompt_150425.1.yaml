      *   *The Line (Branding vs. Ontology):* Branding uses the past as fuel. Negative Sovereignty uses the past as the *foundation*. Without the defeat, the state has no reason to exist in its current form.
      *   *The Suicide Factor:* Agency. Refusal of the enemy's narrative. Metaphysical victory.
      *   *Where it Breaks:*
          1.  *The Interpretive Gap:* The dead can't speak. The living manipulate the memory.
          2.  *The Success Contamination:* If you eventually win (Israel in 1948), does the negative sovereignty turn positive? Does it become toxic?
          3.  *The "Deliberate" Fiction:* Hard to prove intent in chaos.
      *   *Conclusion:* Summarize the tension.

  8.  **Refining the Tone:**
