prompt: |-
  I'm in a seminar on political philosophy and we're working through what exactly counts as corruption, and I keep getting stuck on a detail in anti-bribery law that I think is doing way more philosophical work then people realize. In the US, the main law against companies bribing foreign officials (the Foreign Corrupt Practices Act) has a carve-out I didn't expect: a payment to a foreign official is not a bribe if it just speeds up or expedites a routine governmental action the official was going to perform anyway — getting a permit processed, a utility connection, an inspection scheduled, cargo released through customs. But the same law treats a payment to influence a discretionary decision, say to win or keep a contract, as full-blown bribery. The UK's bribery law, by contrast, has no such carve-out at all, and a lot of big companies' internal codes ban gifts to public officials outright, even tiny ones. And meanwhile, in all of these same countries, election law criminalizes vote-buying — handing out cash or goods to voters to secure their votes — even when the goods are small and you're "buying" a single vote rather than a contract.

  What I want is a reconstruction of the implicit theory of corruption that this pattern presupposes. My guess is something like this: an office has two layers, a ministerial layer of acts the official must perform no matter what, and a discretionary core, and corruption is specifically the purchase of the discretionary core, not the purchase of any official act, so lubricating the ministerial layer is fine while buying the core is a betrayal of the trust the office is supposed to embody. But then the vote-buying contrast bugs me: a vote is presumably as discretionary as a contract decision, so why is buying a vote categorically worse than expediting a permit? Does the practice really need a second principle here — something about equality of citizens or the purity of the political sphere — or can the two-layer view stretch to cover it? And is the routine/discretionary line even stable, or does the carve-out quietly depend on officials' "routine" acts being genuinely non-discretionary, which is often false (a permit officer who can sit on your file for a month has real de facto discretion)?

  And finally the universality question, since my seminar keeps treating "Western standards" as a block: if the US and the UK disagree about whether the carve-out is right, what does that show about what's actually committed in the carve-out versus what's just contingent? And in a society where bringing a modest gift to a bureaucrat is a social courtesy with no expectation of a specific act, how does the facilitation-payments framework classify it, and what does that classification assume about the relationship between the social meaning of a gift and whether it corrupts? I'd like you to say where the practice is philosophically underdetermined — where several theories of corruption (purchase-of-discretion, integrity-of-office, appearance-of-impropriety) could all license the same rule — and what would concretely have to change in the law if the integrity view replaced the purchase view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Seminar on political philosophy, focusing on the definition of corruption.
      *   **Core Observation:** The US Foreign Corrupt Practices Act (FCPA) allows "facilitation payments" (grease payments) for *routine/ministerial* acts but bans bribes for *discretionary* acts. The UK Bribery Act bans both. Vote-buying is banned everywhere.
      *   **User's Hypothesis:** Corruption = purchasing the *discretionary core* of an office, not the *ministerial layer*.
      *   **Key Questions/Challenges:**
          1.  **Vote-Buying Paradox:** If corruption is buying discretion, why is vote-buying (buying a discretionary act of a citizen/voter) worse than expediting a permit? Does this require a second principle (equality/purity of politics)?
          2.  **Stability of the Line:** Is the routine/discretionary distinction stable? (De facto discretion exists in routine tasks).
          3.  **Universality vs. Contingency:** US vs. UK disagreement suggests some elements are contingent, not universal. What is core vs. contingent?
          4.  **Social Meaning:** How does the framework handle cultural gifts vs. bribes? What does it assume about social meaning?
          5.  **Underdetermination:** Where are multiple theories (purchase-of-discretion, integrity-of-office, appearance) compatible with the same rule?
          6.  **Concrete Legal Change:** What would change if the "integrity view" replaced the "purchase view"?

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *The User's Hypothesis:* "Purchase of Discretion" theory. This aligns with a specific economic/legal view of corruption (market distortion).
      *   *The Vote-Buying Problem:* Vote-buying isn't about official discretion in the same way. It's about *political equality*. This suggests a "Democratic Integrity" or "Civic Equality" theory is needed alongside the "Official Integrity" theory.
      *   *US vs. UK:* US (FCPA) = Pragmatic/Realist (get things done, focus on big distortions). UK (Bribery Act 2010) = Deontological/Zero Tolerance (integrity of the office itself, regardless of outcome).
      *   *Facilitation Payments:* These rely on the idea that the *outcome* isn't changed, only the *timing*. But timing *is* a resource.
      *   *Social Meaning:* This touches on semiotics and sociology of law. Is the gift a signal of relationship or a price tag?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the insight that legal distinctions carry heavy philosophical weight.
      *   **Part 1: Reconstructing the Implicit Theory (The "Two-Layer" View):**
          *   Flesh out the user's "Ministerial vs. Discretionary" distinction.
          *   Label it: *The Market-Distortion Theory of Corruption*. Corruption is bad because it distorts allocation of scarce public goods (contracts, licenses).
          *   Facilitation payments don't distort allocation, just timing. Hence, permissible (in US view).
      *   **Part 2: The Vote-Buying Anomaly (The Second Principle):**
          *   Why doesn't the Two-Layer view cover voting?
          *   Voting isn't an *office*; it's a *right*.
          *   Need a second principle: *Political Equality*. Selling a vote commodifies citizenship.
          *   Contrast: Bureaucratic efficiency (utilitarian) vs. Democratic legitimacy (deontological).
          *   *Conclusion on this point:* Yes, you need a second principle. The "Purchase of Discretion" theory is insufficient for the political sphere.
      *   **Part 3: The Instability of the Routine/Discretionary Line:**
          *   Address the "de facto discretion" point. A clerk *can* lose your file.
          *   Philosophical implication: The law pretends discretion doesn't exist to maintain a fiction of bureaucratic automatism.
          *   This reveals the FCPA carve-out is actually a *tolerance of extortion*, not just "grease."
      *   **Part 4: US vs. UK (Universality vs. Contingency):**
          *   US: Pragmatic, focuses on *competitive advantage* and *market distortion*.
          *   UK: Focuses on *institutional integrity* and *public trust*.
          *   What's contingent? The tolerance for "grease."
          *   What's universal? The ban on buying *outcomes*.
          *   This shows "corruption" isn't a natural kind; it's a normative construct.
      *   **Part 5: Social Meaning and Gifts:**
          *   The law struggles here. It assumes intent (quid pro quo).
          *   If the social meaning is "courtesy," the law often fails to capture it unless it adopts a strict liability or "appearance" standard.
          *   The FCPA/UK divide shows different assumptions about human psychology (can officials separate gift from duty?).
      *   **Part 6: Underdetermination & Concrete Legal Changes:**
          *   *Underdetermination:* Both theories ban big bribes. They diverge on small/grease payments.
          *   *Integrity View vs. Purchase View:*
              *   Purchase View: Did the outcome change? (Consequentialist).
              *   Integrity View: Was the office offered for sale? (Deontological).
          *   *Concrete Changes if Integrity View won:*
              1.  Eliminate facilitation carve-out (UK style).
              2.  Strict liability for gifts (no intent needed).
              3.  Focus on "undue influence" rather than "quid pro quo."
              4.  Criminalize the *receiver* more aggressively (currently FCPA focuses on payer).

  4.  **Refining and Polishing:**

      *   *Tone:* Academic, rigorous, engaging with the seminar context.
      *   *Clarity:* Ensure the distinction between "Ministerial" and "Discretionary" is clear.
      *   *Philosophers/Theorists:* Briefly allude to relevant thinkers without name-dropping excessively (e.g., Thompson's "institutional corruption," Lessig, Philp). *Self-correction: Keep it focused on the user's specific legal/philosophical puzzle rather than a literature review.*
      *   *Addressing the "Vote Buying" specific:* Make sure to emphasize that a voter is not an official. That's the category error in trying to apply the "office" theory to voting.
      *   *Addressing the "Social Meaning":* Connect this to the "Expressive Function of Law."

  5.  **Final Review against User Prompts:**

      *   Reconstruction of implicit theory? Yes (Market Distortion/Discretion).
      *   Vote-buying contrast explained? Yes (Equality vs. Efficiency).
      *   Stability of the line? Yes (Fiction of automatism).
