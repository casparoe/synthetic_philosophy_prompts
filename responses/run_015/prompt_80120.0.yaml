answer: |-
  This is an exceptionally sharp observation. You have identified that the legal architecture of anti-corruption is not merely a set of rules but a sedimented layer of competing political philosophies. The tension you're spotting—between the US "facilitation payment" carve-out, the UK's zero-tolerance approach, and the universal ban on vote-buying—reveals that "corruption" is not a natural kind (like "water" or "gold") but a normative construct that shifts depending on which value is being prioritized: efficiency, integrity, or equality.

  Here is a reconstruction of the implicit theory, the points where it fractures, and what would change if we shifted the philosophical foundation.

  ### 1. The Implicit Theory: The "Market-Distortion" View of Office
  Your hypothesis about the "two layers" of office is correct, but it rests on a specific economic-philosophical foundation. Let's call this the **Market-Distortion Theory of Corruption**.

  *   **The Premise:** Public office is a mechanism for allocating scarce public goods (permits, contracts, licenses).
  *   **The Ministerial Layer:** These are acts where the outcome is predetermined by law. The official is a conduit, not a gatekeeper. The "good" (the permit) is not scarce in terms of *eligibility*, only in terms of *time*.
  *   **The Discretionary Core:** These are acts where the official determines the allocation of the good itself.
  *   **The Definition of Corruption:** Corruption occurs only when a private payment distorts the *allocation* of public goods.
  *   **Why Facilitation Payments are Allowed (in the US view):** Paying to speed up a permit does not change *who* gets the permit. It does not distort the market allocation of the right; it merely purchases efficiency in a bureaucratic queue. It is treated as a private transaction for a public service speed-up, akin to paying for FedEx instead of standard mail.

  Under this theory, the office is not "sullied" by the payment because the *official act* (the decision) remains faithful to the law. Only the *timing* is commodified.

  ### 2. The Vote-Buying Anomaly: Why a Second Principle is Required
  You asked if the two-layer view can stretch to cover vote-buying. It cannot. This is the fracture point in the theory.

  If corruption were solely the "purchase of discretionary official acts," vote-buying would be ambiguous. A voter is exercising discretion. However, vote-buying is treated as categorically worse than expediting a permit. This requires a second, distinct philosophical principle: **The Principle of Civic Equality.**

  *   **Office vs. Citizenship:** The Market-Distortion theory applies to *offices* (fiduciary roles). Voting is not an office; it is an equal share of sovereign power.
  *   **The Commodity Problem:** In the bureaucratic view, time is a commodity that can be unequally distributed (some get permits faster). In the democratic view, political power is *not* a commodity. It must be distributed equally.
  *   **The Harm:** Vote-buying does not just distort an allocation; it destroys the legitimacy of the aggregator (the election). If permits are allocated by wealth, the market is inefficient. If laws are allocated by wealth (via votes), the state loses its claim to represent the public.

  **Conclusion on this point:** You need a hybrid theory.
  1.  **For Bureaucracy:** Corruption = Distortion of Allocation (allows facilitation payments).
  2.  **For Democracy:** Corruption = Violation of Equality (bans all vote purchasing).
  The fact that the law treats these differently shows that the legal system views the *bureaucratic state* as a service provider (where efficiency matters) and the *political sphere* as a sacred space of equality (where commodification is forbidden).

  ### 3. The Instability of the "Routine" Line
  You are right to question the stability of the ministerial/discretionary line. Philosophically, the facilitation carve-out depends on a **fiction of bureaucratic automatism**.

  *   **The Fiction:** The law assumes a permit clerk is a robot who *must* issue the permit if the box is checked.
  *   **The Reality:** As you noted, the clerk has *de facto* discretion. They can "lose" the file, demand extra signatures, or schedule the inspection for next year.
  *   **The Philosophical Implication:** By carving out facilitation payments, the FCPA implicitly acknowledges that the state lacks a monopoly on violence/coercion in that jurisdiction. It legalizes a protection racket. It assumes the official *owns* the time of the bureaucracy and is selling it back to you.
  *   **Why it's unstable:** In practice, almost no official act is purely ministerial. A customs official can always find a reason to inspect cargo. Therefore, the "routine" carve-out is not a description of reality, but a **pragmatic tolerance of extortion**. It draws a line not based on the nature of the act, but on the *magnitude of the distortion*. Small distortions (timing) are tolerated; large distortions (winning contracts) are not.

  ### 4. Universality vs. Contingency (US vs. UK)
  The divergence between the US (FCPA) and the UK (Bribery Act 2010) reveals what is contingent in our understanding of corruption.

  *   **What is Contingent:** The tolerance for "grease." The US approach is **Consequentialist/Pragmatic**. It asks: "Does this payment change the outcome?" If no, it's low priority. The UK approach is **Deontological/Integrity-based**. It asks: "Was the office offered for sale?" If yes, it is banned, regardless of outcome.
  *   **What is Universal:** The ban on *quid pro quo* for discretionary outcomes. Both agree that selling a contract is wrong.
  *   **The Insight:** The "Western Standard" is not a block. It is a spectrum between **Institutional Integrity** (UK: the office must remain pure) and **Market Efficiency** (US: the market must remain competitive, but bureaucracy can be lubricated).
  *   **Social Meaning of Gifts:** This is where the theories diverge most.
      *   **US View:** Assumes intent can be parsed. A gift is a bribe only if there is a specific *quid pro quo* intent. It trusts officials to distinguish between "courtesy" and "price."
      *   **UK/Integrity View:** Assumes the *appearance* corrupts. A gift creates an obligation, regardless of intent. It assumes human psychology is such that "courtesy" inevitably bleeds into "favor."
      *   **The Classification Problem:** In a society where gifts are social glue, the US framework classifies them as "non-corrupt" unless intent is proven. The Integrity framework classifies them as "risk factors" or strict liabilities. The US view assumes the **social meaning** of the gift is transparent; the UK view assumes the social meaning is opaque and dangerous.

  ### 5. Where the Practice is Philosophically Underdetermined
  There are zones where multiple theories license the same rule, hiding the philosophical disagreement.

  *   **The Ban on Large Bribes:**
      *   *Purchase-of-Discretion Theory:* Bans it because it distorts the market.
      *   *Integrity-of-Office Theory:* Bans it because it sullies the institution.
      *   *Appearance Theory:* Bans it because it erodes public trust.
      *   *Result:* All three agree on the rule, so the law doesn't need to specify *why*. This makes the law fragile when edge cases (like facilitation payments) arise.

  *   **The Facilitation Carve-out:**
      *   Here, the theories diverge. The Purchase theory allows it (no distortion). The Integrity theory bans it (office is for sale). The Appearance theory is split (does the public care about permit speed?). The US chose the Purchase theory; the UK chose the Integrity theory.

  ### 6. Concrete Legal Changes: If the Integrity View Replaced the Purchase View
  If your seminar were to advocate for shifting from the US "Purchase/Distortion" model to a pure "Integrity of Office" model (aligning fully with the UK Bribery Act and broader political philosophy), the following concrete legal changes would be necessary:

  1.  **Elimination of the "Routine Governmental Action" Exception:** The law would no longer ask "Did the official have discretion?" It would ask "Did the payment relate to an official act?" Speeding up a permit would become illegal because the *time* of the state is a public resource, not the official's private property to sell.
  2.  **Shift from "Intent" to "Undue Influence":** Currently, prosecutors must prove the payer *intended* to influence a specific act. An Integrity model would criminalize payments that create a *conflict of interest*, regardless of whether a specific act was influenced. The harm is the *relationship*, not the *transaction*.
  3.  **Strict Liability for Gifts:** Instead of assessing the "social meaning" of a gift (was it courtesy or a bribe?), the law would impose strict limits on value. The assumption would be that *any* private value transfer to a public official compromises the symbolic purity of the office.
  4.  **Criminalizing the Receiver:** The FCPA primarily targets the *payer* (the US company). An Integrity model focuses equally on the *receiver* (the official), because the corruption is a betrayal of the public trust by the official, not just a market distortion by the company.
  5.  **Reclassifying Vote-Buying:** Under an Integrity view, vote-buying isn't just about equality; it's about the **inviolability of the civic role**. The law would likely expand to criminalize not just cash for votes, but any "undue influence" on voters (e.g., aggressive gerrymandering or algorithmic manipulation) that treats the vote as a commodity to be harvested rather than a judgment to be made.

  ### Summary for your Seminar
  The pattern you've found exposes that anti-corruption law is currently running on two incompatible operating systems.
  1.  **The Bureaucratic OS (US/FCPA):** Corruption is a **market failure**. Fix the distortion. Tolerate the grease.
  2.  **The Democratic OS (Vote-Buying/UK):** Corruption is a **moral betrayal**. Protect the integrity. Zero tolerance.

  The "routine/discretionary" line is the unstable patch code written to make these two systems talk to each other. It fails because it pretends bureaucracy is mechanical (ministerial) when it is actually political (discretionary). If you move to a pure **Integrity Theory**, the distinction collapses: *any* sale of official action, even timing, is a betrayal of the public trust.
