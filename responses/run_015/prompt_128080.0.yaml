  **BUREAU OF PROBABILISTIC COMPLIANCE**
  **DRAFT CODE OF PRACTICE 44-B: STANDARDISATION OF EPISTEMIC INPUTS**

  **1. Preamble**
  1.1. Decision models require numeric inputs to function. Where an agent claims a probability is unknown, the model halts. This Code resolves such halts by mandating the conversion of all epistemic gaps into filed figures.
  1.2. It is the position of the Bureau that discomfort arising from unknown probabilities is a processing error within the agent, not a feature of the environment. To ensure auditability, all uncertainties must be rendered as single-point estimates.

  **2. Definitions**
  2.1. **Epistemic Gap:** Any situation where a frequency or propensity is not publicly known.
  2.2. **Stipulated Value:** A precise numeric figure assigned to an Epistemic Gap for the purpose of filing.
  2.3. **Coherence:** The state wherein an agent's preferences do not violate the Sure-Thing Principle given their Stipulated Values.

  **3. Core Stipulation Requirement**
  3.1. No probability shall be recorded as "unknown," "ambiguous," or "undefined."
  3.2. Where data is absent, the agent must assign a Stipulated Value based on the principle of indifference or expert consensus.
  3.3. Once a decision is initiated, the Stipulated Value becomes binding. Retroactive revision to restore coherence is prohibited.

  **4. Worked Examples**
  4.1. **Standard Risk:** A coin toss has a known probability of 0.5. No action required.
  4.2. **Ambiguous Urn:** An urn contains 90 balls. 30 are Red. 60 are Black or Yellow in unknown proportion.
      *   (i) Agent prefers a bet on Red to a bet on Black. This implies P(Red) > P(Black).
      *   (ii) Agent prefers a bet on (Black or Yellow) to a bet on (Red or Yellow). This implies P(Black) + P(Yellow) > P(Red) + P(Yellow), simplifying to P(Black) > P(Red).
      *   (iii) Compliance Note: These preferences are mutually exclusive under any single probability measure. The agent must file P(Black) = 1/3. Preferences must be adjusted to match.
  4.3. **Medical Consent:** A form states "no reliable estimate is available" for a newer treatment's success rate.
      *   (i) Action: Strike out the phrase.
      *   (ii) Replacement: Insert "50%."
      *   (iii) Rationale: A binary outcome admits only two states. Until data exists, the split is equal.

  **5. Enforcement and Audit**
  5.1. Compliance Officers will test agents for the Sure-Thing Principle. If an agent prefers Option A to Option B regardless of Event E, they must prefer A to B even when E is unknown.
  5.2. Failure to align preferences with filed Stipulated Values constitutes incoherence.
  5.3. Incoherent agents may be barred from high-stakes decisions until a certified randomiser is employed to select on their behalf.

  **6. Revision and Locking**
  6.1. Once a Stipulated Value is used to justify a decision, it is locked in the audit trail.
  6.2. Adjusting the figure post-hoc to explain away losses is classified as data falsification. The agent must remain consistent with their original error.

  **7. Exploitation and Informational Gaps**
  7.1. The Bureau notes that agents may select options known to exploit the difference between a Stipulated Value and the true underlying frequency (e.g., choosing the unknown urn after seeing the filed 1/3).
  7.2. This suggests the uncertainty lies not in the agent's mind, but in the urn-filler's conduct.
  7.3. Remedy: Where informational asymmetry is detected, the use of certified randomisers is mandatory. The agent shall not choose; the machine shall choose.
  7.4. Additionally, where one party possesses superior information regarding the true probability, an Informational Gap Surcharge shall apply to level the betting field.

  **8. Consultation Questions**
  8.1. Should agents be permitted to hold ranges if they can demonstrate computational inability to process points?
  8.2. Is the current surcharge on ignorance sufficient to deter ambiguity aversion?

  ***

  **APPENDIX A: EXTRACT FROM DISSENTING RESPONSE**
  **Submitted by: The Institute for Robust Decisioning**

  **1. Submission**
  1.1. The Code mistakes precision for accuracy. In cases of severe uncertainty, the rational act is not to maximize expected utility based on a single figure, but to maximize the minimum outcome across the set of possible probabilities.
  1.2. An agent is not incoherent for preferring a known risk to an unknown one. They are protecting themselves against the worst case within the range. The correct deliverable is a floor and a range, not a value.

  **2. Departmental Reply**
  2.1. The Bureau acknowledges the theoretical validity of maxmin utility.
  2.2. However, a range cannot be filed, cannot be audited, and yields caution rather than a decision.
  2.3. Our systems require a scalar. Until the database schema is updated to accept intervals, agents must continue to submit points.
  2.4. Regarding the objection that this forces agents to lie: It is not a lie. It is a placeholder required to keep the machinery running. The discomfort the agent feels is the friction of the model engaging with reality. It is not a signal to stop.

  **9. Final Provision**
  9.1. This Code takes effect immediately. All pending decisions involving unknown probabilities must be regularised by 17:00 hours.
