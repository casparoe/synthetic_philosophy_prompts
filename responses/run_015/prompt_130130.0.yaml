prompt: |-
  I am running an upper-level undergraduate seminar in moral philosophy with fourteen students over a single ninety-minute session, and I want to stage a rules-based simulation that makes Williams's integrity objection tangible before anyone names it—specifically the sense that an agent who justifies saving a loved one or a life-project partner through an impartial calculus has inserted an alienating mental step, even when the outcome is correct. Rather than lecture on partiality and integrity, I want the students to feel the structural conflict themselves: they should discover that combining a personal reason with comparative weighing produces a different phenomenological quality than stating the personal reason alone, and they should do this through real, small-stakes choices before the facilitator maps the experience onto the philosophical idea.

  Please design a runnable in-class activity with clear roles, physical or written materials that can be prepared in advance, and a payoff scheme that uses points rather than money. Each student should be assigned a hidden "life-project" card—describing an ongoing collaborative endeavor such as a long-form artistic composition, a clinical trial, or a field study—that ties them to one of two figures in a staged crisis scenario (a fire, a bridge collapse, or a resource failure) where only one figure can be rescued. The other figure should represent high social utility but no connection to the student. In Round One, each student writes a private one-sentence justification without speaking. In Round Two, pairs deliberate using drawn "reason cards" that separate partial-attachment claims from impartial-weighing claims, and they must submit a joint justification to the class. The rules should include an "integrity token" system and a "project-continuity constraint": if a pair invokes a partial attachment but also includes any explicit or implicit comparative weighing of the two figures' value—whether by utility, numbers, or desert—they forfeit their integrity token and receive only "consensus points" for outsider acceptability; if they invoke the partial attachment without that extra calculative step, they retain the token and earn "integrity points." The class then votes blindly on whether each submitted justification feels "cold" or "direct," and the pairs learn their scores only after all votes are cast, so the tension emerges mechanically rather than through my framing.

  In your response, provide the exact rules, the card texts or categories, the timeline minute-by-minute, the debrief that maps the two point systems onto the distinction between having a reason and having to justify it through an impartial framework, and an honest note on what this simulation cannot reproduce—above all the long-term lived weight of self-alienation, which I will need to supply through guided reflection. Also tell me what will predictably fail the first time I run it, such as students disguising weighing language inside partial-attachment claims or rejecting the integrity-token system as irrational, and suggest how to handle those breakdowns without breaking the experience. Do not include bibliographies, reading lists, or citation requests; do not ask students to recall specific page numbers or essay titles; and do not quote verbatim from any philosophical text—paraphrase the concern if you need to name it. Keep the injection of the project-continuity mechanism explicit so that the activity is not a generic trolley-problem variant, but make sure every element relies only on ideas a well-prepared student in this course would already carry.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate moral philosophy seminar, 14 students, 90 minutes.
      *   **Goal:** Stage a rules-based simulation to make Bernard Williams's "integrity objection" tangible *before* naming it. Focus on the alienation of inserting an impartial calculus between the agent and their personal projects/loved ones.
      *   **Mechanism:** Small-stakes choices, points (not money), hidden "life-project" cards, crisis scenario (rescue one of two), two rounds (private writing, paired deliberation with reason cards).
      *   **Key Rules:** "Integrity Token" system, "Project-Continuity Constraint." If partial attachment + comparative weighing = forfeit token (consensus points). If partial attachment *without* weighing = keep token (integrity points).
      *   **Evaluation:** Blind class vote on "cold" vs. "direct" justifications. Scores revealed later.
      *   **Deliverables:** Exact rules, card texts, minute-by-minute timeline, debrief mapping points to philosophy, honest limitations (what the sim can't do), predicted failures & fixes.
      *   **Constraints:** No bibliographies, no reading lists, no verbatim quotes, rely on student's existing course knowledge.

  2.  **Deconstruct the Philosophical Core (Williams's Integrity Objection):**
      *   *Core Idea:* Utilitarianism (or strict impartialism) requires agents to step outside their own commitments and view them as just another set of desires in the calculus. This creates alienation.
      *   *The "One Thought Too Many":* Saving a spouse because it's optimal (even if it is) vs. saving a spouse because it's *my spouse*.
      *   *Simulation Goal:* Force students to feel the difference between "I save X because X is mine/part of my project" and "I save X because X is mine *and* X yields more value/is weighted higher."

  3.  **Drafting the Activity Structure:**
      *   **Title:** Needs to sound neutral but evocative. "The Continuity Protocol" or "The Rescue Mandate." Let's go with "The Continuity Protocol."
      *   **Setup:** 14 students. Pairs = 7 pairs.
      *   **Scenario:** Needs to be high stakes but abstract enough to avoid real trauma. A "Research Station Fire" works well for "life-projects."
      *   **Cards:**
          *   *Life-Project Cards:* Specific, collaborative, high personal investment.
          *   *Reason Cards:* Prompts for justification (Partial vs. Impartial).
      *   **Scoring:** Integrity Points (IP) vs. Consensus Points (CP).
      *   **The Twist:** The rule about forfeiting the token if they mix partiality with weighing. This is the crux. It forces them to choose: be honest about partiality (risk looking irrational to others) or be "rational" (lose integrity status).

  4.  **Developing the Rules & Mechanics:**
      *   *Integrity Token:* A physical object (poker chip or card).
      *   *Project-Continuity Constraint:* The rule that defines the token loss.
      *   *Round 1:* Private writing. Gets them committed individually.
      *   *Round 2:* Paired deliberation. This is where the conflict happens. They have to agree on a *joint* justification.
      *   *Voting:* "Cold" vs. "Direct." This maps to "Calculative" vs. "Immediate."

  5.  **Refining the "Trap":**
      *   The prompt asks for a specific mechanic: If they invoke partial attachment *but also* include comparative weighing, they lose the token.
      *   *Challenge:* Students are trained to justify. They will naturally say, "I save my partner because they are my partner *and* their work is more important."
      *   *Solution:* The Rule must be explicit. "The Purity Clause." If you mention the relationship, you cannot mention the *value* of the outcome relative to the other.
      *   *Wait, a correction:* The prompt says: "if a pair invokes a partial attachment but also includes any explicit or implicit comparative weighing... they forfeit."
      *   *Implication:* To keep the token, they must say "Because it is my project." To get Consensus Points (voted by class), they might need to sound reasonable to outsiders. This creates the tension. Outsiders (the class) might vote "Cold" on the pure partiality argument because it sounds arbitrary, but that's where the Integrity Points come in.
      *   *Actually, looking closer at the prompt:* The class votes "Cold" or "Direct." The scoring is separate.
      *   *Scoring Logic:*
          *   Keep Token (Pure Partiality) = Integrity Points.
          *   Lose Token (Mixed/Impartial) = Consensus Points (based on class vote of acceptability).
          *   *Wait, I need to align this with the prompt's specific payoff:* "if they invoke the partial attachment without that extra calculative step, they retain the token and earn 'integrity points.'... forfeit their integrity token and receive only 'consensus points' for outsider acceptability."
          *   *Okay:* Pure Partiality = Integrity Points. Mixed/Impartial = Consensus Points.
          *   *The Tension:* Integrity points are "internal" correctness. Consensus points are "external" validation. This mirrors the conflict between internal commitment and external moral demand.

  6.  **Addressing Predicted Failures:**
      *   *Gaming the system:* Students might try to hide weighing language. *Fix:* Strict facilitator adjudication.
      *   *Rejection of rules:* "This rule is stupid." *Fix:* Frame it as a constraint of the simulation universe, not a moral claim yet.
      *   *Cynicism:* "Points don't matter." *Fix:* Make the points determine a tangible (but low stakes) outcome, like choosing the debrief topic or extra credit (if allowed), or simply status. Let's use status/choice in debrief.

  7.  **Timeline (90 Minutes):**
      *   0-10: Setup & Distribution.
      *   10-20: Round 1 (Private).
      *   20-40: Round 2 (Pairs & Reason Cards).
      *   40-55: Submission & Voting.
      *   55-70: Scoring Reveal & Initial Reaction.
      *   70-90: Debrief & Philosophical Mapping.

  8.  **Drafting the Content:**
      *   *Scenario:* "The Archival Fire." Two vaults. One contains your collaborator (and the work), one contains a stranger (and high utility data).
      *   *Life-Project Cards:* Need variety. "The Decade-Long Survey," "The Unfinished Symphony," "The Clinical Cohort."
      *   *Reason Cards:* "The Bond," "The Calculation," "The Duty," "The Future."
      *   *Tokens:* Red (Integrity) vs. Blue (Consensus).

  9.  **Refining the Debrief:**
      *   Must connect the "Token Loss" to the "One Thought Too Many."
      *   Must acknowledge the simulation's limits (it's 20 minutes, not a life).
      *   Must not quote Williams directly.

  10. **Review against Constraints:**
      *   14 students? Yes (7 pairs).
      *   90 mins? Yes.
      *   No money? Yes (points).
      *   No citations? Yes.
      *   Specific failure modes addressed? Yes.

  11. **Self-Correction on Scoring Logic:**
      *   The prompt says: "if they invoke the partial attachment without that extra calculative step, they retain the token and earn 'integrity points.'"
      *   "if they invoke a partial attachment but also includes any explicit or implicit comparative weighing... they forfeit their integrity token and receive only 'consensus points'."
      *   *Crucial Nuance:* What if they go full impartial? (Save the stranger because 5 lives > 1 life). The prompt focuses on the *mixing* of partiality + weighing. I need to ensure the rules cover the "Full Impartial" choice too, or steer them toward the conflict.
      *   *Decision:* The Life-Project card *ties them to one figure*. It creates a strong pull. The Reason Cards in Round 2 will offer options. I will design the Reason Cards to encourage the mix, making the "Purity" choice harder.
      *   *Voting:* Class votes "Cold" or "Direct."
      *   *Scoring:*
          *   Pure Partial ("Because it's mine") -> Integrity Points (High value if token kept).
          *   Mixed ("Because it's mine AND it's better") -> No Token, Consensus Points (based on vote).
          *   Pure Impartial ("Because more value") -> No Token, Consensus Points.
      *   *Wait, the prompt specifies:* "if a pair invokes a partial attachment but also includes... weighing... forfeit."
      *   *Okay, I will stick strictly to that mechanic.* If they go Pure Impartial, they don't get the Integrity Token anyway (no partial attachment invoked). They get Consensus Points. The tension is specifically about *corrupting* the partial reason with calculation.

  12. **Final Polish:**
      *   Ensure the "Project-Continuity Constraint" is clearly defined in the rules handout.
      *   Make sure the "Reason Cards" are distinct enough to cause the error.
      *   Check the timing. 90 minutes is tight for 14 students to vote on 7 pairs. I need to streamline the voting. Maybe batch voting or quick show of hands. Let's do quick show of hands per pair to save time.

  13. **Writing the Response:** (Iterative drafting of the sections: Overview, Materials, Rules, Timeline, Debrief, Limitations/Failures). *Self-Correction during drafting:* Make sure the "Integrity Token" is physical. It makes the loss tangible.

  14. **Final Check on "What will fail":** Students *will* try to argue the rule is arbitrary. I need a script for the instructor to hold the line without lecturing. "The simulation universe operates on these physics."

  15. **Final Check on "Project Continuity":** Ensure this isn't just "save your friend." It must be "save the project you are embedded in." This distinguishes it from simple nepotism. It's about *identity* and *ongoing commitment*.

