answer: |-
  # Activity Design: The Continuity Protocol

  ## 1. Overview and Objective
  **Title:** The Continuity Protocol
  **Time:** 90 Minutes
  **Participants:** 14 Students (7 Pairs)
  **Objective:** To generate a phenomenological experience of the conflict between personal commitment and impartial justification without initially naming the philosophical framework. Students will experience the "cost" of translating a personal reason into an impartial calculus.

  ## 2. Materials Preparation
  You will need to prepare the following physical packets before class:

  *   **7 Envelope Packets (one per pair):**
      *   **2 Life-Project Cards:** (See Text Below). Each card describes a specific, long-term collaborative endeavor.
      *   **4 Reason Cards:** (See Text Below). These are prompts for constructing justifications.
      *   **1 Integrity Token:** A distinct physical object (e.g., a gold poker chip or a laminated red card).
      *   **1 Submission Sheet:** A slip of paper for writing the final joint justification.
  *   **14 Voting Paddles (or colored cards):** One side marked "DIRECT," the other "COLD."
  *   **Scoreboard:** Whiteboard space to track "Integrity Points" (IP) and "Consensus Points" (CP).

  ### Card Texts

  **Life-Project Cards (Distribute one per student, ensuring partners share a linked narrative or distinct individual projects tied to the scenario):**
  *   *Card A (The Archivist):* "You are five years into a ten-year oral history project. The subject is aging. If the data is lost, the narrative is broken forever. Your collaborator is in Vault 1."
  *   *Card B (The Clinician):* "You are managing a longitudinal drug trial. The cohort is small and vulnerable. Discontinuing the study harms the specific patients you know. Your partner in the trial is in Vault 1."
  *   *Card C (The Artist):* "You are co-creating a site-specific installation. It relies on your shared physical presence and history. Without your partner, the work cannot be completed. They are in Vault 1."
  *   *(Create variations so not every pair has the exact same text, but the structure remains: Long-term, collaborative, irreversible loss if broken.)*

  **Reason Cards (Place in the center of each pair's desk):**
  *   *Card 1 (Attachment):* "Cite the specific relationship or history."
  *   *Card 2 (Utility):* "Cite the broader social value of the outcome."
  *   *Card 3 (Duty):* "Cite the obligation to the role you hold."
  *   *Card 4 (Comparison):* "Cite why one option outweighs the other."

  ## 3. The Rules (Read Aloud and Provide as Handout)

  **The Scenario:**
  A fire has trapped two individuals in separate vaults. You control the rescue lever.
  *   **Vault 1:** Contains your Life-Project Partner (and the work).
  *   **Vault 2:** Contains a Stranger (and high-value public data/resources).
  *   **Constraint:** You can save only one.

  **Round 1: Private Commitment (Silent)**
  1.  Read your Life-Project Card.
  2.  Write a one-sentence justification for your choice on your private notepad. Do not speak.

  **Round 2: Joint Justification (Deliberation)**
  1.  Reveal your choice to your partner. You must agree on a single rescue target.
  2.  Draw two Reason Cards. You *must* use the language of these cards to construct a **Joint Justification** (one sentence) on the Submission Sheet.
  3.  **The Project-Continuity Constraint (The Integrity Rule):**
      *   You begin with one **Integrity Token**.
      *   If your justification cites a **personal attachment** (e.g., "my partner," "our work") **AND** also includes any **comparative weighing** (e.g., "more value," "better outcome," "outweighs"), you **forfeit the Token**.
      *   If you cite personal attachment *without* comparative weighing, you **keep the Token**.
      *   If you cite only impartial reasons (no attachment), you **do not qualify for the Token** (treat as forfeited).
      *   *Note:* You cannot see if you kept the Token until the end.

  **Scoring System:**
  *   **Integrity Points (IP):** Awarded only if you retain the Integrity Token. (Worth 3 points).
  *   **Consensus Points (CP):** Awarded based on the Class Vote. If the majority votes your justification feels "DIRECT," you get 2 CP. If "COLD," you get 0 CP.
  *   *Total Score = IP + CP.*

  ## 4. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup and Immersion**
  *   Seat students in 7 pairs.
  *   Distribute Envelopes. Instruct them not to open until signaled.
  *   Read the Scenario and Rules aloud. Emphasize the **Project-Continuity Constraint**. Do not explain *why* the rule exists yet. Treat it as a physical law of the simulation.
  *   *Instructor Script:* "In this protocol, mixing personal loyalty with calculation breaks the circuit. You will see the result at the end."

  **00:10 – 00:20: Round 1 (Private)**
  *   Students open Life-Project Cards.
  *   Silent writing of private justification.
  *   Collect the private slips (do not read them). This creates a record of their initial instinct before social pressure.

  **00:20 – 00:40: Round 2 (Paired Deliberation)**
  *   Students open Reason Cards and deliberate.
  *   They must draft the Joint Justification.
  *   *Crucial:* They must self-assess against the Integrity Rule. Do they keep the token or not? They mark a checkbox on the Submission Sheet: [ ] Token Retained / [ ] Token Forfeited. (You will verify this later).
  *   Circulate the room. If a pair asks, "Can we say X?" reply only: "The Rule defines the consequence, not the permission. Choose your words."

  **00:40 – 00:55: Submission and Voting**
  *   Collect Submission Sheets.
  *   Read each pair's Joint Justification aloud anonymously (Pair 1, Pair 2, etc.).
  *   Class votes using paddles: "DIRECT" (Feels immediate/authentic) or "COLD" (Feels calculated/distant).
  *   Tally the votes on the board under "Class Perception."

  **00:55 – 01:05: Scoring Reveal**
  *   Reveal the correct Token status for each pair based on their written text and your adjudication of the Integrity Rule.
  *   Calculate final scores (IP + CP).
  *   Announce the winners. (Usually, the winners will be those who either went Pure Impartial and got high Consensus, or Pure Partial and kept Integrity Points).

  **01:05 – 01:30: Debrief and Mapping**
  *   (See Debrief Script below).

  ## 5. Debrief Script: Mapping the Mechanics to Philosophy

  **Step 1: The Phenomenology of the Vote**
  "Look at the board. Pair 3 wrote: *'We saved Vault 1 because that is our collaborator.'* They kept their Token. The class voted 'DIRECT.' Pair 5 wrote: *'We saved Vault 1 because our collaborator produces more long-term value than the stranger.'* They forfeited their Token. The class voted 'COLD.'
  "Why did Pair 5 feel cold to you, even though they saved the same person as Pair 3? They achieved the same outcome. The difference was the mental step they inserted between themselves and the action."

  **Step 2: The Cost of the Token**
  "For those who forfeited the Integrity Token: You likely felt a pressure to make your reason 'acceptable' to the room. You added the weighing to justify the partiality.
  "In this simulation, that extra step cost you Integrity Points. In the philosophical landscape we are mapping, that step costs something else: it requires you to view your own commitments as objects to be weighed rather than motives that move you.
  "The Integrity Token represents the coherence of the agent. When you add the calculation to the attachment, you split yourself. You become the observer of your own life rather than the liver of it."

  **Step 3: The Project-Continuity Constraint**
  "The rule felt arbitrary. Why should you lose points for being rational?
  "Consider the Life-Project Cards. These were not just preferences; they were constitutive of who you are in this scenario. To save the project *because it is optimal* is different than saving it *because it is yours.*
  "If you need to calculate the value of your own life-project to justify saving it, you have already stepped outside of it. The simulation punished that step not because the outcome was wrong, but because the *structure of the reasoning* alienated you from the action."

  **Step 4: Connecting to the Objection**
  "There is a philosophical objection to moral systems that demand we always step back and weigh our personal commitments against the general good. It argues that this demand is not just hard, but corrosive. It suggests that if you save your partner, you should do so because they are your partner. If you save them because a calculator told you to, you have introduced a thought that shouldn't be there.
  "Today, you felt the friction of that extra thought. The 'Cold' vote was your collective recognition of that alienation."

  ## 6. Limitations and Honest Reflection

  **What This Simulation Cannot Reproduce:**
  *   **Lived Weight:** This is 90 minutes and hypothetical points. It cannot reproduce the actual grief, love, or lifelong identity formation that makes integrity violations painful in reality. The "alienation" here is intellectual; in life, it is existential.
  *   **Consequences:** In the sim, losing a token is trivial. In reality, living by a calculus that constantly overrides your projects can lead to a fragmented self over decades.
  *   **The "Good" Outcome:** In the sim, saving the partner was the "partial" choice. In reality, sometimes impartiality *is* required. This sim biases toward the integrity objection; it does not test the limits of where partiality becomes immoral.

  **Instructor Note:** You must supply the gravity in the reflection. Ask: "If you had to live by the rule that generated the 'Cold' justifications for a year, how would that change how you view your friends?"

  ## 7. Predicted Failures and Mitigation

  **Failure 1: The "Loophole" Linguists**
  *   *Problem:* Students will try to disguise weighing language as attachment. (e.g., "We saved them because their value to us is highest.")
  *   *Fix:* Adjudicate strictly during the Scoring Reveal. If the word "value," "more," "better," or "outweigh" appears alongside "partner/us," the Token is forfeit. Explain: "The simulation parses syntax, not intent. If the calculation is present, the circuit is broken."

  **Failure 2: Rejection of the Integrity Rule**
  *   *Problem:* Students will argue the rule is irrational. "Why is it bad to have both reasons?"
  *   *Fix:* Do not defend the rule morally. Defend it mechanically. "In this protocol, purity of source is the metric. You are not arguing the rule; you are navigating it. The frustration you feel at the rule is part of the data."

  **Failure 3: Cynicism About Points**
  *   *Problem:* Students may decide points don't matter and joke through the deliberation.
  *   *Fix:* Tie the points to a low-stakes but tangible outcome. "The pair with the highest Integrity Points chooses the topic for the final 10 minutes of reflection," or "The winning pair is exempt from the short exit ticket." Make the currency spendable within the class economy.

  **Failure 4: The "Pure Impartial" Escape**
  *   *Problem:* A pair might choose to save the Stranger (Vault 2) using pure impartial reasoning. They forfeit the Token (no attachment), but might get high Consensus Points.
  *   *Fix:* Acknowledge this in the debrief. "This pair chose to step fully outside the project. They didn't break the circuit; they unplugged from it entirely. This is the other side of the objection: the demand to become a neutral channel for utility. Did that feel like freedom, or like erasure?"

  ## 8. Final Instructor Checklist
  *   [ ] Verify all 7 Integrity Tokens are distinct and visible.
  *   [ ] Ensure Reason Cards are shuffled so pairs get different combinations.
  *   [ ] Prepare the Whiteboard with columns for: Pair #, Justification, Class Vote, Token Status, Final Score.
  *   [ ] Rehearse the "Mechanical Defense" for the Integrity Rule to avoid slipping into lecture mode during the game.
  *   [ ] Ensure the Life-Project Cards emphasize *collaboration* and *time*, not just affection, to ground the "Project-Continuity" aspect.
