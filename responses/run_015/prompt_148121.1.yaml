answer: |-
  Hi everyone. Thanks for coming. Thanks for braving the schedule.

  Look around the room. We've got a specific split today. Half of you are comfortable talking about rigid designators and possible worlds. The other half spends your time in IRB meetings and clinical guidelines. Usually, these groups don't overlap much. The metaphysicians go home to think about identity. The bioethicists go home to write policy. But today, we're forcing a collision.

  We're calling this workshop Counterfactual Embryos. And I want to start with a claim that half of you accept as trivial and half of you treat as a nuisance. Origin essentialism. The idea that you are essentially the product of this specific sperm and this specific egg. If your parents had conceived a week later, or used a different donor, that wouldn't be a healthier version of you. That would be a different person entirely.

  Now, for the philosophers in the room, this is Kripke 101. But for the ethicists, this changes the stakes of IVF. Usually, we treat essentialism as metaphysical ornamentation. Something to settle identity puzzles over tea. But in the clinic, this isn't tea. This is the procedure.

  Let's make this concrete. Say we have two embryos. One carries a gene for Huntington's. One doesn't. We pick the healthy one. Standard bioethics says we prevented suffering. We acted beneficently. We say we're looking out for the best interests of the future child. But if essentialism holds, there is no future child until the selection is made. You aren't saving a child from disease. You are choosing which child exists. The person who would have come from the first embryo is not the person born from the second. They are strangers. The alternative isn't healthy you. The alternative is no you.

  This breaks the harm framework. You can't say you harmed the embryo you didn't pick. They never existed. So when we talk about best interests, whose interests are we tracking? There is no fixed subject. We aren't like pediatricians treating an existing patient. We are architects deciding who gets built.

  So here's my challenge for the day. I don't want to debate the truth of essentialism. I want to assume it's true and see if our ethics survive. If best interests is incoherent here, what replaces it? Is it purely parental autonomy? Is it general welfare maximization? Can we write guidelines on this shifting ground?

  I want the philosophers to keep their metaphysics grounded in the clinic, and I want the ethicists to see where their frameworks might be leaning on metaphysical assumptions they haven't examined. If this particular zygote is essential to being me, then selecting embryos doesn't harm some pre-existing child, it just decides which child comes into being. That's the structure. That's the problem. Let's see if we can build something that works for both.

  Let's get to work.
