      *   *Procedural:* Not in store yet. Potential only. (Matches).

  6.  **Address the "Hard Truths" (Which verdicts to drop):**
      *   *The Rollback:* The user wants to say "Harm undone." The principle says "Institutional harm undone, psychological harm remains." The user needs to accept that if they compensate for the rollback, they are compensating for *distress*, not *loss of goods*. If they don't compensate, they are relying on the "Institutional" definition. I should advise them that for backend purposes, "Institutional" is the correct metric, so the verdict stands *for the company*, even if the player feels otherwise.
      *   *The Duping:* The user says "I don't think I've been harmed." But scarcity is an interest. If the mount was unique, its value is tied to scarcity. Duping setbacks that interest. The principle might force the admission that there *is* a harm (devaluation), even if the item wasn't deleted.

  7.  **Address the New Cases:**
      *   *RMT Theft:* If currency is exchangeable for real money, the "Interest" is no longer just virtual; it's economic. The "Legitimate Expectation" is stronger (financial security). Verdict: Real Harm, likely legal liability, not just ToS.
      *   *Server Shutdown:* State destroyed. No restoration possible. Legitimate Expectation (persistence) violated? Usually ToS says "we can shut down." If ToS allows it, no *Wrong*, but still a *Loss*. Ontologically, the objects cease to be Virtual-Real.

  8.  **Refining the Output:**
      *   Structure:
          1.  Acknowledge the depth of the question (it's a mix of Ontology and Ethics).
          2.  Propose the "Three-Part Framework" (Ontology, Normativity, Restitution).
          3.  Walk through the user's cases showing how the framework applies.
          4.  Identify the "Cost" (which intuitions need tweaking).
          5.  Apply to the two new cases.
      *   Tone Check: Avoid heavy academic jargon (no "noumena," "qualia," etc.). Use engineering-adjacent terms (state, authority, scope, contract).
      *   Key Insight to highlight: The distinction between *Institutional Reality* (the DB/Server) and *Phenomenological Reality* (the player's experience). The backend engineer controls the former, not the latter.

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction on Rollback:* The user says "This is the verdict I'm least sure of." I need to be careful not to just validate them, but to clarify *why* it feels ambiguous. It's the clash between State (DB) and Experience (Time/Stress). I should recommend treating the DB state as the "Source of Truth" for *compensation logic*, even if CS reps apologize for the stress.
      *   *Correction on Trapping:* Is position "state in authoritative store"? Yes, usually in memory, persisted on logout/zone change. But even if not persisted, the *ability to act* is a system-granted capability. I should broaden "State" to include "Affordances."
      *   *Correction on Duping:* The user says "I don't think I've been harmed." I need to point out that "Uniqueness" is a state property. If the DB says `is_unique = true` but two exist, the *System* is lying. The harm is to the *Integrity of the World*, not necessarily the individual, unless value is tied to scarcity. I'll stick to the user's verdict but note the tension.

  10. **Final Polish:** Ensure the "Principle" is stated clearly as a tool they can use tomorrow. (e.g., "The Institutional-Expectation Framework").

  *(Self-Correction on the "Harm" definition)*: The user's current principle says "Harm = setback of interests." This is the "Interest Theory" of rights. The problem is PvP. PvP setbacks interests (you lose time/items) but isn't a wrong. The fix is "Violated Legitimate Expectation." I will call this **Normative Violation**.

  *(Self-Correction on "Reality")*: The user says "Shared store." This is close to "Institutional Fact." I will refine this to **Authoritative State**.

  *(Self-Correction on Rollback)*: To make the verdict "Harm Undone" work, we must define Harm as **Net State Deviation**. If State(t_end) == State(t_start), Harm = 0. This ignores the derivative (stress). I need to tell the user they have to choose: are you compensating for State or Experience? Backend logic usually compensates for State.

