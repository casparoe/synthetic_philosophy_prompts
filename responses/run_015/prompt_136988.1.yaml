answer: |-
  You are grappling with two distinct philosophical problems that your systems conflate: **Ontology** (what exists) and **Normativity** (what counts as a wrong). Your intuition to separate them is correct, but your current definitions are too blunt to handle edge cases like consent (PvP vs. Trapping) or restoration (Rollback).

  Here is a precise framework designed for a backend engineer's mental model. It relies on three clauses.

  ### The Framework: Institutional State & Legitimate Expectation

  **Clause 1: Virtual Ontology (The "Real" Test)**
  > An entity is **Virtual-Real** if and only if its state is recorded in an authoritative, persistent store that governs the interactions of multiple independent agents.
  > *   *Motivation:* Distinguishes your shared mount (Real) from your single-player save (Private) and unrendered terrain (Potential). The "truth" of the object is the database row, not the pixel rendering.

  **Clause 2: Normative Harm (The "Wrong" Test)**
  > A player is **Wronged** if and only if a setback of their interests occurs *outside the bounds of their Legitimate Expectations* as defined by the system's rules and social contract.
  > *   *Motivation:* Distinguishes PvP (setback within expectations) from Trapping (setback outside expectations). "Harm" in a compensation context is not just "loss," it is "unjust loss."

  **Clause 3: Restitution Threshold (The "Undo" Test)**
  > An Institutional Wrong is **Nullified** if the authoritative state is restored to the exact pre-violation snapshot, rendering the deviation temporally bounded and state-less.
  > *   *Motivation:* Addresses the Rollback. If the DB is the source of truth (Clause 1), and the DB is restored, the *institutional* harm is gone.

  ---

  ### Applying the Framework to Your Cases

  Here is how this framework processes your existing verdicts, and where it forces you to adjust your thinking.

  **1. The Duping Bug**
  *   **Analysis:** The mount is Virtual-Real (Clause 1). The duplication violates the `is_unique` constraint of the world, but your specific row was not deleted or altered. Your interest in *possession* is intact; your interest in *scarcity* is debatable.
  *   **Verdict:** **No Wrong to you.** (Matches your gut).
  *   **Tension:** You noted you can't say which copy is "yours." Under Clause 1, *both* are equally real because both exist in the authoritative store. You must accept that "provenance" is metadata, not ontology. If the DB says both are valid, both are real.

  **2. Account Theft (Irreversible)**
  *   **Analysis:** Virtual-Real items removed. Security is a baseline Legitimate Expectation.
  *   **Verdict:** **Wronged.** (Matches your gut).

  **3. Account Theft (Rollback)**
  *   **Analysis:** Items removed (Wrong initiated), then DB restored to snapshot (Clause 3 invoked).
  *   **Verdict:** **Institutionally Nullified.**
  *   **The Hard Truth:** This framework forces you to admit that **you cannot claim the harm is "undone" in a human sense, only in a system sense.**
      *   *Clause 3* saves your verdict for *compensation logic*: The company owes nothing regarding the *items*, because the items exist.
      *   *However*, you must drop the idea that "nothing happened." The player suffered *experiential harm* (stress, lost time) which is not stored in the DB.
      *   *Recommendation:* Treat this as **State Harm = 0**, **Experience Harm > 0**. Your backend handles State. Customer Support handles Experience. Do not conflate them. If you compensate for rollbacks, you are paying for distress, not loss of goods.

  **4. The Trapping (Griefing)**
  *   **Analysis:** No data deleted. However, the system grants an expectation of *agency* (ability to move). Trapping removes agency without a rule permitting it.
  *   **Verdict:** **Wronged.** (Matches your gut).
  *   **Refinement:** Note that "State" in Clause 1 includes *affordances* (what the player can do), not just inventory tables. The trap altered the player's available state-space.

  **5. The PvP Kill**
  *   **Analysis:** Setback of interests (time lost, durability cost). However, the zone rules and warning click establish this as a *Legitimate Expectation*.
  *   **Verdict:** **Loss, but Not Wronged.** (Matches your gut).
  *   **Key Distinction:** This is the crucial success of Clause 2. It separates "bad luck within the game" from "violations of the game."

  **6. Single-Player Save**
  *   **Analysis:** Store is not accessible by multiple agents.
  *   **Verdict:** **Not Virtual-Real.** (Matches your gut).
  *   **Implication:** If you lose this, it is a hardware failure, not a service failure. The "character" is a local cache, not a shared entity.

  **7. Unrendered Terrain**
  *   **Analysis:** Function exists, but no state is recorded in the authoritative store until generation.
  *   **Verdict:** **Potential, not Real.** (Matches your gut).
  *   **Implication:** If a bug deletes the seed, nothing "real" was lost. If a bug deletes generated chunks, something real was lost.

  ---

  ### The Cost: What You Must Drop

  To make this system consistent, you have to abandon one specific intuition:

  **You must abandon the idea that the Rollback case is "Harm Undone" in a total sense.**
  You wrote: *"if someone took my laptop and the police returned it intact a day later, I'd still say I'd been wronged."*
  You are correct. The Framework agrees. The *Institutional Wrong* is nullified (the database is clean), but the *Human Wrong* remains (the violation of security).
  **The Adjustment:** As a backend engineer, you are the guardian of the **Institutional**. Your principle should be: *"The Rollback fixes the Service, not the Experience."* If your company policy is "no compensation for rollbacks," this principle supports it. If your policy is "give them a small token for the trouble," that is compensating the Experience, not the State. Do not confuse the two budget lines.

  **Secondary Adjustment:** On the **Duping Bug**, you must accept that if the system treats both copies as valid, they are ontologically identical. You cannot privilege your copy based on "earned history" if the database does not track that history. If the DB doesn't store `time_acquired`, then `time_acquired` is not real in the system, and you have no claim to superiority over the duped copy.

  ---

  ### Predictions on New Cases

  Here is how the Framework predicts the outcomes for your two unlisted scenarios.

  **Case A: Theft in a Game with Real-Money Trading (RMT)**
  *   **Analysis:**
      *   *Ontology:* The currency is Virtual-Real (Clause 1).
      *   *Expectation:* Because the currency is exchangeable for fiat, the Legitimate Expectation shifts from "Game Security" to "Financial Security." The interest set back is not just "time spent," it is "economic value."
      *   *Prediction:* **Severe Wrong.** The harm is no longer contained within the "Magic Circle" of the game. The Restitution Threshold (Clause 3) is harder to meet because market fluctuation during the theft period may mean a DB snapshot does not restore the *economic* value, even if it restores the *nominal* amount.
      *   *Action:* Compensation must account for market value at time of loss, not just item restoration.

  **Case B: Studio Shuts Down World (End of Life)**
  *   **Analysis:**
      *   *Ontology:* The authoritative store is deleted. The entities cease to be Virtual-Real.
      *   *Expectation:* This depends entirely on the Terms of Service (the Social Contract). Most ToS grant the studio the right to terminate.
      *   *Prediction:* **Loss, but Not Wronged.**
      *   *Reasoning:* If the ToS permits shutdown, the player's Legitimate Expectation does *not* include "eternal persistence." Therefore, Clause 2 is not triggered. The objects were real while the store existed, but their destruction is a contractual feature, not a normative violation.
      *   *Caveat:* If the studio sold "permanent ownership" explicitly (rare), then shutting down would be a **Wrong**, requiring real-world compensation.

  ### Summary for your Ticket System

  When a new ticket comes in, run this algorithm:

  1.  **Did the authoritative state change?** (If No -> Check Affordances/Trapping).
  2.  **Was the change permitted by the rules the player consented to?** (If Yes -> It is a Loss, not a Wrong. Deny compensation).
  3.  **Can the authoritative state be restored to the pre-violation snapshot?** (If Yes -> Institutional Wrong is Nullified. Offer apology only, unless economic value [RMT] fluctuated).

  This keeps your engineering definition of "Truth" (the DB) separate from your ethical definition of "Justice" (the Contract), while allowing them to talk to each other where it matters.
