          2.  *Harm:* Setback of interests (full stop).
          3.  *Issue:* These two don't interact well. Doesn't explain consent (PvP vs. Trapping). Contradicts the intuition on Rollbacks (Setback of interests says harm occurred, user wants to say harm undone).
      *   **Goal:** A precise principle (or small set) that captures the pattern of verdicts, identifies which verdicts must be dropped, and predicts outcomes for two new cases (RMT theft, Server Shutdown).
      *   **Tone:** Respectful, precise, analytical, bridging engineering concepts with philosophical rigor (without jargon overload).

  2.  **Deconstruct the Cases & Verdicts:**
      *   *Duping Bug:* Unique mount duplicated. User keeps theirs. *Verdict:* No harm to user, object remains "theirs" despite indistinguishability. (Reality: Shared Store. Harm: None/Minimal).
      *   *Account Theft (Irreversible):* Items gone. *Verdict:* Real harm, compensation owed. (Reality: Shared Store. Harm: Setback of interests).
      *   *Account Theft (Rollback):* Items restored via DB snapshot. *Verdict:* Harm undone? (User is unsure. Intuition says "undone," but "scare/lost day" suggests harm remains).
      *   *Griefing (Trapping):* Avatar boxed in for 6 hours. No data change. *Verdict:* Genuine harm. (Reality: Shared Store state unchanged? Or is position state? Harm: Setback of interests *without* consent).
      *   *PvP Kill:* Permitted zone, warning clicked. *Verdict:* Real loss, but *not* a wrong/harm in the normative sense. (Reality: Shared Store. Harm: Setback of interests *with* consent).
      *   *Single Player Save:* Local file. *Verdict:* Not "real" like shared objects, but loss upsets. (Reality: Private Store. Harm: Emotional, but ontologically different).
      *   *Unrendered Procedural Terrain:* Function exists, no one visited. *Verdict:* Doesn't exist, but would be discovered not created. (Reality: Potential State).

  3.  **Identify the Tensions:**
      *   *Ontology vs. Ethics:* The user tries to separate "is it real?" from "was I harmed?" but finds they interact (e.g., consent matters for harm, but consent relies on the rules of the "real" system).
      *   *The Rollback Problem:* If harm = setback of interests, rollback *should* still be harm (time lost, stress). User *wants* to say it's not harm. This suggests a definition of harm tied to *final state* rather than *process*.
      *   *The Consent Problem:* PvP vs. Trapping. Both setback interests (time, progress). One is okay, one isn't. Needs a "Legitimate Expectation" or "Social Contract" clause.
      *   *The Reality Problem:* Shared store vs. Local save vs. Procedural potential. Needs a definition of "Virtual Objecthood."

  4.  **Develop a Framework (The "Principle"):**
      *   I need to propose a framework that respects the engineering reality (databases, state) but accounts for the human experience (expectations, agency).
      *   *Concept 1: Institutional Reality.* (Searle-ish but simplified). Things are real if the system treats them as authoritative *and* the community recognizes them.
      *   *Concept 2: Normative Expectation.* Harm isn't just setback of interests; it's a *violating* setback. This solves PvP vs. Trapping.
      *   *Concept 3: State Continuity.* This addresses the Rollback. If the *authoritative state* is restored to the pre-violation condition, the "institutional harm" is negated, even if "psychological harm" remains. This validates the user's desire to call the rollback "undone" while acknowledging the feeling.

      *Drafting the Principle:*
      1.  **Virtual Ontology:** An entity is *Virtual-Real* iff its state is maintained in an authoritative, persistent store accessible by multiple independent agents. (Handles Mount, Save File, Terrain).
      2.  **Normative Harm:** A player is *Wronged* iff their legitimate expectations within the rule-system are violated, resulting in a setback of interests. (Handles PvP vs. Trapping).
      3.  **Restitution Threshold:** If the authoritative state is restored to the pre-violation snapshot, the *institutional wrong* is nullified, though *experiential distress* may remain. (Handles Rollback).

  5.  **Test the Principle against Cases:**
      *   *Duping:* Mount is Virtual-Real. Duping violates uniqueness rule? But user keeps theirs. No setback of interests (still have mount). No Wrong. (Matches).
      *   *Theft (Irrev):* Virtual-Real items gone. Legitimate expectation (security) violated. Setback. Wrong. (Matches).
      *   *Theft (Rollback):* State restored. Institutional Wrong nullified. Experiential distress remains (user must decide if this counts as "harm" for compensation). *Crucial Decision:* The principle forces the user to distinguish "Institutional Wrong" (compensatable by dev) vs "Experiential Harm" (uncompensatable/inevitable). This challenges the user's "Harm undone" verdict slightly—it's "Institutionally undone, Experientially not."
      *   *Trapping:* State unchanged (position is state, but maybe not stored persistently?). But Legitimate Expectation (freedom of movement) violated. Wrong. (Matches).
      *   *PvP:* Setback of interests. But Legitimate Expectation includes risk of death. Not Wrong. (Matches).
