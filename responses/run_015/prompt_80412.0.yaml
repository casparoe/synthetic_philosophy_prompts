answer: |-
  # The Ineffective Objection: A Diagnostic Tree

  **Instructions:** Answer each question based on your intuition about **voting** (one vote rarely decides) and **buying steak** (one purchase rarely changes production). Do not worry about philosophical labels.

  **Q1. The Nature of the Difference**
  When you buy a steak or cast a vote, does your action make *zero* physical difference to the outcome (e.g., same number of animals killed, same winner), or does it make a *negligible* difference (e.g., a tiny fraction of demand, a probabilistic chance)?
  *   **Zero Difference** → Go to Q2A
  *   **Negligible Difference** → Go to Q2B

  **Q2A. The Requirement for Responsibility (Zero Diff Branch)**
  If your action changes nothing, can it still be wrong?
  *   **No (Wrong only if it changes outcomes)** → **Leaf 1**
  *   **Yes (Wrong even if outcomes don't change)** → Go to Q3A

  **Q2B. The Requirement for Responsibility (Negligible Diff Branch)**
  To be morally responsible for a harm, must your action be *sufficient* to cause it alone, or is *contributing* to the total enough?
  *   **Sufficient Alone** → Go to Q3B
  *   **Contributing Enough** → Go to Q3C

  **Q3A. The Locus of Duty (Zero Diff + Yes)**
  Is the duty based on the *consequences of this act* or the *role you occupy* (e.g., citizen)?
  *   **Role** → **Leaf 2**
  *   *(Act is impossible here; if Zero Diff + Act + Wrong, you contradict Q2A)* → **Leaf 3 (Unoccupied)**

  **Q3B. The Locus of Duty (Negligible + Sufficient)**
  Is the duty determined by the *consequences of this act* or by *following a rule*?
  *   **Consequences** → **Leaf 4**
  *   **Rule** → **Leaf 5**

  **Q3C. The Locus of Duty (Negligible + Contribution)**
  Is the duty determined by the *consequences of this act* or the *role you occupy*?
  *   **Consequences** → **Leaf 6**
  *   **Role** → **Leaf 7**

  ***

  ### The Leaves

  1.  **The Causal Nihilist:** Voting and buying steak are morally irrelevant because neither changes outcomes.
      *   *Awkward Commitment:* Must admit voting is pointless even if everyone agrees it matters.
  2.  **The Civic Formalist:** Voting is a duty because you are a citizen, but buying steak is fine because it changes nothing.
      *   *Awkward Commitment:* Treats voting and steak differently despite identical causal status.
  3.  **The Metaphysical Error (Unoccupied):** Claims action makes zero difference but still contributes to harm.
      *   *Diagnosis:* Incoherent; one cannot contribute to an outcome one does not physically affect.
  4.  **The Threshold Skeptic:** Your action is only wrong if it crosses a specific aggregate threshold of harm.
      *   *Awkward Commitment:* Morality turns on unknowable numbers (e.g., the 10,000th steak vs. the 9,999th).
  5.  **The Rule Follower:** You must follow the rule (e.g., "don't kill") even if this specific act doesn't cross the harm threshold.
      *   *Awkward Commitment:* Must forbid actions that would objectively save lives if they violate the rule.
  6.  **The Expected-Value Maximizer:** You should act as if you are the marginal person, weighting tiny probabilities by huge harms.
      *   *Awkward Commitment:* **Note:** This smuggles a decision-theoretic question into a deontic one. Removing this move collapses the case, because without expected-value weighting, a negligible difference provides no act-based reason to forbear.
  7.  **The Systemic Participant:** You have a duty to exit harmful systems (meat, carbon) because of your role, even if your exit changes no statistics.
      *   *Awkward Commitment:* Responsible for system harms even if personal exit makes the problem no better.

  ***

  ### Diagnostic Notes

  *   **Unseparable Leaves:** **The Causal Nihilist (1)** and **The Civic Formalist (2)** cannot be separated on meat cases; only the voting control case exposes the split in their reasoning regarding roles.
  *   **Unoccupied Combinations:** **Zero Difference + Contribution (Leaf 3)** is logically impossible. If you make no difference, you contribute nothing. Students who select this usually confuse *feeling* responsible with *being* causally implicated.
  *   **Case Diagnostics:** Voting exposes those who require causal efficacy (Leaf 1). Meat exposes those who confuse constituent demand with specific causation (Leaf 6 vs. Leaf 7).
