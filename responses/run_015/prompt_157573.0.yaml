answer: |-
  This is a fantastic setup. You have a room full of people who are likely to care deeply about the human stakes (the retirees) and people trained to spot logical inconsistencies (the undergrads/physicist friend). Your instinct to avoid wincing physicists is correct; *Arrival* is soft SF masquerading as hard SF, and if you treat the linguistics as physics, you'll lose the room.

  Here is the breakdown of the physics, the gap, and the philosophy, along with the scene selections you asked for.

  ### 1. The Physics: Your Friend is Right (Mostly)
  Your friend is correct about the **Rietdijk–Putnam argument**. It establishes **Eternalism** (the Block Universe), but it does not establish **Retrocausality** or **Precognition**.

  *   **The Argument:** Special Relativity says simultaneity is relative. If you walk toward Andromeda, your "now" slice includes events on Andromeda that are in the future for someone walking away. Therefore, those future events must already "exist" to be part of someone else's "now."
  *   **The Limit:** This only applies to **spacelike separated** events (too far away for light to have reached you). It proves the future *exists* ontologically. It does not prove you can *access* it.
  *   **The Light Cone:** Events inside your future light cone (like your daughter's death) are timelike separated. In Special Relativity, *every* observer agrees these events happen after your current moment. No frame of reference exists where you are "simultaneous" with your own future.
  *   **The Verdict:** You cannot chain observers to get into your own future light cone. That violates causality. So, the physics gets you the **stage** (the future is real), but it does not get you the **play** (Louise remembering the future).

  **How to pitch this:**
  Tell the group: *"Relativity tells us the future is a place that exists, like Paris. It does not give us a train ticket to get there. The movie invents a train ticket."*

  ### 2. The Availability Gap: Ontology vs. Epistemology
  You've named this perfectly. The Block Universe is an **ontological** claim (what exists). Louise's visions are an **epistemological** claim (what can be known).

  *   **The Conflict:** In a standard Block Universe, consciousness is usually modeled as a "moving spotlight" or a worldline traversal. You exist at all points, but you *experience* them sequentially.
  *   **The Film's Fix:** This is where the **Sapir-Whorf hypothesis** does the heavy lifting. The film argues that language structures cognition so profoundly that learning Heptapod B rewires Louise's brain to perceive her worldline all at once.
  *   **The Cheat:** Strong Sapir-Whorf is largely discredited in linguistics (language influences thought, it doesn't override sensory processing of time). Furthermore, even if you perceive time non-linearly, that is a feature of *consciousness*, not spacetime.
  *   **Do they pull in the same direction?** Yes, but they are different engines. The Physics says the future is *real*. The Linguistics says the future is *readable*. Without the linguistics, the physics is just fatalism without agency. Without the physics, the linguistics is just hallucination.

  **How to pitch this:**
  *"The physics says the book is already written. The linguistics says Louise learns how to read the last page while she's on the first."*

  ### 3. Agency: Triumph, Tragedy, or Affirmation?
  This is the philosophical core. You are right that standard Compatibilism ("I chose it, so it's free") feels weak here.

  *   **Amor Fati:** Louise's choice is closer to Nietzsche's *Amor Fati* (Love of Fate). It is not that she "could have done otherwise." It is that she **affirms** the necessity. She doesn't choose the life *despite* the ending; she chooses the life *as a whole package*, ending included.
  *   **The Distinction:** In a Block Universe, "triumph" and "tragedy" are temporal judgments. If you view the life from outside time (as the Heptapods do), the grief and the joy are simultaneous coordinates. The "tragedy" is only tragic from the perspective of the moving spotlight. Louise sheds the spotlight.
  *   **The Aliens' Motive:** Why do they need help if they know the future?
      *   *Answer:* They aren't trying to change the outcome; they are trying to **equip** humanity. The "weapon" they offer is the language itself. They need humanity to have the Block Universe perspective in 3,000 years to help the Heptapods with *their* future problem. It is a transaction across deep time. They need her to be the vector for the virus of non-linear time.

  ### 4. Scene Selections & Where the Film Breaks
  Here are three specific sequences to screen, with the "physics warning" attached to each.

  **Scene 1: The "Non-Zero-Sum" Whiteboard (Early Act 2)**
  *   **Context:** Louise explains game theory to the military. She argues that cooperation yields better results than competition.
  *   **Why show it:** This sets up the philosophical stakes. It establishes that communication can change outcomes *within* the linear flow.
  *   **Where it breaks:** It implies linear causality (talk -> change mind -> peace). This is standard cause-and-effect. It grounds the audience before the film breaks the rules.

  **Scene 2: The Corridor Vision (Mid Act 3)**
  *   **Context:** Louise is walking down a hallway in the facility. She has a sudden, vivid "flash" of her daughter asking about the science of time. She stumbles. Ian asks if she's okay.
  *   **Why show it:** This visualizes the **Availability Gap**. We see the future bleeding into the present. It is visceral, not intellectual.
  *   **Where it breaks:** **Physically, this is impossible.** In a Block Universe, you don't get "spoilers." You just exist at different coordinates. This is movie magic representing cognitive access. Tell your group: *"This isn't relativity; this is horror. It's the horror of knowing."*

  **Scene 3: The Phone Call to General Shang (Climax)**
  *   **Context:** Louise calls Shang and recites his wife's dying words to stop the attack.
  *   **Why show it:** This is the crux of the **Agency** debate. She uses future knowledge to alter the present.
  *   **Where it breaks:** **This is a Causality Violation.** In a strict Block Universe, she always made that call. The timeline is static. But the film presents it as a *choice* she makes *because* of the vision. This creates a Closed Timelike Curve (CTC).
  *   **Discussion Point:** Ask the group: *"Did she change the future, or did she fulfill it?"* The film wants it both ways. It wants the emotional weight of choice with the inevitability of fate.

  ### 5. What the Film Adds (That Papers Don't)
  This is your closing argument for the library group.

  Philosophical papers on Eternalism often feel cold. They discuss truth conditions and coordinate systems. *Arrival* adds **Grief**.

  *   **The Cost of the Block:** If the future is real, then grief is not a passing state; it is a permanent feature of the universe. Your lost loved one is "real" in the past, just as you are "real" in the present.
  *   **The Gift:** The film suggests that knowing the end doesn't negate the value of the middle. In fact, it might sanctify it.
  *   **The Takeaway:** The film argues that **meaning is not derived from alterability.** We usually think a choice matters because we could have chosen otherwise. Louise shows us a choice matters because we **own** it, even if it was inevitable.

  ### Summary for your Intro
  If I were standing where you are, I'd open with this:

  > "Tonight we're looking at a tension. The physics in this movie—the relativity of simultaneity—tells us the future is real. But it doesn't tell us we can see it. The linguistics tells us we can see it, but that's not how language works. So why combine them? Because the physics gives us the tragedy (it's inevitable), and the linguistics gives us the triumph (we understand it). The movie isn't trying to be a textbook; it's trying to answer the question: If you knew the price of admission for a beautiful life, would you still buy the ticket?"

  That keeps the physicist happy (you acknowledged the limit), keeps the philosophers engaged (ontology vs. epistemology), and keeps the retirees crying (the price of the ticket).
