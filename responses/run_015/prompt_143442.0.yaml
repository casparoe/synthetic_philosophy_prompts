  specifcally, i need a reusable procedre (ordered questions, stopping rules, flags for where judgment takes over from facts) that takes the backward induction paradox seriously but doesn't just say "everyone should defect immediately." it should distinguish structural defection predicted by the game from cooperation that survives common-knowledge rationality checks, handle cases where payoffs aren't fully transparent, and mark exactly where my team — no economics PhDs, have to sign off in under an hour — is making a value call rather than applying a rule. run it on three cases: (1) a two-party remediation deal still cooperating in round three despite backward induction predicting collapse in round two, (2) a three-party agreement where one stakeholder is being irrationally patient and dragging others along, and (3) a high-ecological-stakes watershed case where the procedure says "settle now" but we'll hate that answer. also tell me exactly where this breaks down and can't be used.

  please structure your answer like this:
  - Practitioner framing (about 120 words): who runs this, the constraints, the stakes.
  - The procedure itself (about 450 words): the ordered steps, what counts as sufficient answer to each, the stop/no conditions, the value-judgment flags, and the distinction between game-theoretic defection and sustainable cooperation.
  - Three worked cases (about 400 words): apply the steps to the three scenarios above, including the one where the answer is unwelcome.
  - Limits and misfires (about 200 words): where the procedure fails, what it can't do, and the hard cases it shouldn't be trusted with.
