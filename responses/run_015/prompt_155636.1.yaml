answer: |-
  ### Pre-Audit Brainstorm: Two Other Common Analogies

  Before dissecting the radio dial, here are two other analogies often floated in seminars when discussing incommensurability:

  1.  **The Color Spectrum:** Comparing red and blue. You can't say red is "more colorful" than blue; they are distinct qualitative properties. This is used to argue values are categorically different. *Weakness:* Colors don't conflict; you can have both on a canvas. Values often demand exclusion (you can't be in two places at once).
  2.  **The Toolbox:** Choosing between a hammer and a screwdriver. The "better" tool depends entirely on the task (the context). This suggests values are context-dependent instrumental goods. *Weakness:* It reduces ultimate values (like justice) to mere instruments for a further end, ignoring that values often *define* the end itself.

