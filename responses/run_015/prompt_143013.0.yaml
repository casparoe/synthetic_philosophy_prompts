  In the Guild of Heritage Stonemasons, aspirants traditionally endure a 'Dust Year', hand-chiselling intricate limestone filigree in unventilated lofts, a process known to induce chronic respiratory strain and tremors in the unfit. A new automated CNC carver now replicates the exact geometric tolerance of the filigree in days, producing a laser-certified finish that clients can verify structurally, yet the tool's internal operation remains a proprietary black box, hiding whether a human guided it or merely initiated it. The Guild must decide whether to retain the Dust Year now that the stone's integrity is guaranteed by the machine's output alone.

  Under the Spence-style costly signalling model, rational agents ought to abandon the Dust Year immediately. Because the laser certification renders the quality of the work product fully observable and verifiable, the information asymmetry regarding competence is resolved without the need for a signal; the health cost of the ritual is viewed as an arbitrary expense unrelated to the verified output, and thus economically wasteful once a cheaper substitute exists. Conversely, the Zahavi-style handicap principle predicts the ritual will persist or even intensify. Here, the respiratory strain is not an arbitrary cost but an intrinsic handicap that indexes the mason's physiological resilience and tolerance for hazardous environments—traits required for on-site restoration work that the machine's output cannot display. Because the production process is opaque, the certified stone proves nothing about the agent's capacity to endure suffering; only the continued enactment of the ritual guarantees the signal remains honest.

  The precise feature driving this divergence is the **output verifiability** component of the transparency trap. Spence's model relies on the signal being a substitute for direct observation of quality; once quality is observable, the signal is redundant. Zahavi's model relies on the signal being a demonstration of the agent's underlying capacity to bear cost; direct observation of the product does not reveal the agent's capacity. If one removes this feature—specifically, if the substitute *fails* to make the output verifiable—the disagreement collapses into standard convergence: both theories would predict the retention of the ritual, as Spence's agents would still require a signal to prove competence in the absence of direct output verification. Finally, a proponent of the costly signalling account might rebut the handicap argument by disputing the job-relevance of the indexed trait, arguing that modern safety protocols ought to eliminate respiratory risks entirely, thereby rendering the tolerance for such strain an inefficient selection criterion rather than a genuine professional requirement.
