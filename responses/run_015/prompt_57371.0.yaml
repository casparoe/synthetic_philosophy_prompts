answer: |-
  Here is a complete lesson plan designed to hit your specific pedagogical goals while managing the social stakes of a new cohort.

  ### The Hunch: Validate and Refine
  Your hunch is correct, but the mechanism is slightly off. The suspicious half won't just write *worse* steelmen; they will stop steelmanning entirely and start **forensicking**.
  *   **Sincere Group:** Task = "Understand this." (Cognitive load: Comprehension)
  *   **Suspicious Group:** Task = "Decode this." (Cognitive load: Comprehension + Pattern Matching + Threat Detection)
  *   **The Result:** The suspicious group will produce *more* writing, but it will be focused on *intent* rather than *validity*. They will identify "traps" in sincere text. This proves the **unfalsifiability loop**: if you look for a trap, ambiguity becomes evidence of a trap.

  **The Modification:** To ensure they feel both **Hunter** and **Hunted**, we cannot just hand them pre-written text. We need a two-round structure where the *pressure* shifts.
  *   **Round 1 (The Hunt):** They evaluate text looking for bad faith. (They are the Hunters).
  *   **Round 2 (The Trap):** They write text knowing they are being evaluated for bad faith. (They are the Hunted).

  ---

  ### Game Title: "The Good Faith Audit"

  #### Materials List (Prep the night before)
  1.  **Argument Packets (24 copies):** Three short paragraphs (100 words each) on low-stakes campus topics (see Topics below). Printed clearly.
  2.  **Role Cards (24 cards):**
      *   12 cards say: **AUDITOR** (Green border)
      *   12 cards say: **ADVOCATE** (Blue border)
  3.  **Instruction Sheets (2 versions):**
      *   **Sheet A (For Auditors):** "Your goal is to identify the 'Troll.' One of the three authors in your packet is arguing in bad faith to undermine the discussion. Identify which one and highlight the specific phrase that reveals their deception." **(Lie: There is no Troll. All texts are sincere.)**
      *   **Sheet B (For Advocates):** "Your goal is to write a response. However, you are being watched. Your readers suspect you might be a 'Troll.' Write a response that is undeniably sincere."
  4.  **Whiteboard/Projector:** For the Debrief mapping.
  5.  **Timer:** Visible to the room.

  #### Topics (Keep them Anodyne)
  Do **not** let them pick topics they care about. High social stakes + high personal stakes = emotional explosion. Use "Campus Infrastructure."
  *   *Text 1:* "The library should close at 8 PM on weekends to save staffing costs."
  *   *Text 2:* "Freshmen should not be allowed to bring cars to campus."
  *   *Text 3:* "The dining hall should stop serving breakfast on weekdays."
  *   *Why:* Everyone has an opinion, but no one's identity is tied to library hours.

  #### Payoff Scheme (Zero Cost)
  *   **Currency:** "Credibility."
  *   **Round 1 Prize:** "The Sharpest Eye." The Auditor who finds the most plausible "evidence" of bad faith (even though it's fake) gets public acknowledgment.
  *   **Round 2 Prize:** "The Clear Voice." The Advocate whose response is rated most "sincere" by the group.
  *   **Why:** This gamifies the *process* you want to critique. You are rewarding them for playing the game exactly as the real world rewards them (finding traps, signaling purity), so you can dismantle it in the debrief.

  ---

  ### Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05 | Setup & Seating**
  *   Hand out Role Cards randomly.
  *   **Auditors (12):** Sit on the Left. Give them **Packet + Sheet A**.
  *   **Advocates (12):** Sit on the Right. Give them **Packet + Sheet B**.
  *   **Instructor Script:** "We are running a simulation on argument evaluation. Follow your sheet instructions exactly. Do not talk to the other side yet. This is a graded exercise in focus." (Lie slightly to raise stakes).

  **00:05 – 00:20 | Round 1: The Hunt**
  *   **Auditors:** Read the 3 texts. Identify the "Troll." Write a 3-sentence justification citing specific text evidence.
  *   **Advocates:** Read the 3 texts. Write a 3-sentence response to *one* of them that you feel is most vulnerable to misinterpretation.
  *   *Note:* Advocates don't know Auditors are hunting them yet. They are just writing.

  **00:20 – 00:35 | Round 2: The Swap (The Hunted)**
  *   **Collect Packets.**
  *   **Swap Roles:** Auditors become Advocates, Advocates become Auditors.
  *   **New Instruction (Crucial):** Hand out **Sheet C (New Auditor)** and **Sheet D (New Advocate)**.
      *   **Sheet C (Auditor):** Same as Sheet A. "Find the Troll." (Still a lie. All texts sincere).
      *   **Sheet D (Advocate):** "You are writing a response. **WARNING:** The Auditors have been told that one of you is a Troll. You must write in a way that proves your sincerity."
  *   **Task:** 10 minutes to write/read.
  *   *Why:* Now the Advocates *feel* the pressure of the "unfalsifiable loop." They know they are suspected. They will over-correct (write too much, apologize too much), which makes them look *more* suspicious.

  **00:35 – 00:45 | The Accusation**
  *   Pair an Auditor with an Advocate.
  *   Auditor reads their accusation: "I think Author 2 is the Troll because they used the word 'efficient' which implies they don't care about students."
  *   Advocate reads their defense.
  *   **Rule:** No arguing. Just read.

  **00:45 – 00:50 | The Reveal**
  *   **Instructor:** "Stop. Look at your partner. Look at the text."
  *   **The Drop:** "There was no Troll. In Round 1 and Round 2, every single text was written in good faith. There was no saboteur."
  *   *Let the silence hang for 10 seconds.* This is the moment the learning happens.

  **00:50 – 01:15 | The Debrief (Mapping the Experience)**
  *   Do not lecture. Ask questions and map their answers to the board.
  *   **Board Column 1:** "What did you look for?" (Expected: Tone, word choice, hidden assumptions).
  *   **Board Column 2:** "How did it feel to be accused?" (Expected: Frustrated, defensive, tempted to over-explain).
  *   **Board Column 3:** "Did the accusation change how you read the text?" (Expected: Yes, normal words became code).

  ---

  ### The Debrief Script (Mapping to Theory)

  You need to explicitly connect their feelings to the concepts. Use these prompts:

  **1. The Collapse (Quality vs. Sincerity)**
  *   *Ask:* "Auditors, did anyone find a logical flaw in the 'Troll' argument that wasn't actually a flaw?"
  *   *Point:* "You were asked to judge *Sincerity*, but you did it by judging *Quality*. You assumed a bad motive meant a bad argument. But as you just saw, a sincere person can write a vague sentence. You collapsed the two questions."

  **2. The Unfalsifiable Loop**
  *   *Ask:* "Advocates in Round 2, who tried to add more explanation to make sure they weren't misunderstood?"
  *   *Point:* "When you add explanation to prove sincerity, you create more text. More text means more ambiguity. More ambiguity gives the Hunter more evidence to suspect you. You cannot win. That is the loop."

  **3. The Cost**
  *   *Ask:* "Auditors, how much energy did you spend looking for the trap vs. understanding the point about library hours?"
  *   *Point:* "Motive-hunting has a cognitive tax. It makes you dumber about the actual topic."

  ---

  ### Failure Modes & Safety Rails

  **1. The "Stung" Student**
  *   *Risk:* A student feels personally attacked when their partner accuses their writing of being "deceptive."
  *   *Prevention:* In the intro, say: "You are evaluating the *text on the page*, not the person sitting next to you. The author is anonymous."
  *   *Intervention:* If you see a student go quiet or flush red during the Accusation phase, intervene immediately. "Pause. Remember, the text was generated under constraints. This is a simulation of *reading*, not a judgment of *character*."
  *   *Post-Game:* If someone is still upset, pull them aside after class. "The game was designed to make the *Auditor* feel powerful and the *Advocate* feel powerless to show how bad-faith hunting works. You were playing the victim role perfectly. It wasn't about you."

  **2. The "Gotcha" Student**
  *   *Risk:* A student enjoys the accusation phase too much and gets aggressive.
  *   *Prevention:* Frame the "Sharpest Eye" prize carefully. "The prize goes to the most *plausible* analysis, not the most aggressive."
  *   *Intervention:* If a student is gloating, dampen it in the Reveal. "You found very convincing evidence. That is exactly why this is dangerous. You were convinced by a ghost."

  **3. Topic Drift**
  *   *Risk:* Students start arguing about the library hours instead of the sincerity.
  *   *Fix:* Walk around during the writing phase. If you hear debate, say: "Don't solve the problem. Analyze the writer."

  **4. Scalability (14 Students)**
  *   *Adjustment:* Keep the ratios even (7 Auditors, 7 Advocates).
  *   *Timing:* Reduce writing time by 2 minutes per round. The dynamic holds with fewer people.
  *   *Debrief:* With fewer voices, you may need to prompt more. Ask specific students: "Sarah, what was your specific evidence?"

  ---

  ### Limitations: What This Game Cannot Do
  Be frank with yourself (and eventually them) about what this simulation misses. You must supply this in the lecture portion *after* the game.

  1.  **History:** In the real world, we know people. We have priors. The game assumes a vacuum. *Your Job:* Explain that motive-hunting is sometimes rational if the person has lied before. The game simulates the *first encounter*, not the *ongoing relationship*.
  2.  **Consequences:** In the game, being accused costs nothing. In reality, being labeled "bad faith" can get you de-platformed or fired. *Your Job:* Remind them that the "Unfalsifiable Loop" isn't just annoying; it's destructive to careers and communities.
  3.  **Power:** The game assumes equal status. In reality, motive-hunting is often a tool used by the powerful against the marginalized (or vice versa). *Your Job:* Acknowledge that "sincerity" is often judged based on who is speaking, not just what is written.

  ### Instructor Prep Checklist
  *   [ ] Print 24 Packets (3 texts each).
  *   [ ] Print 24 Role Cards (12 Green, 12 Blue).
  *   [ ] Print Instruction Sheets (A, B, C, D).
  *   [ ] Set Timer.
  *   [ ] Prepare Whiteboard (Draw 3 columns: Evidence, Feeling, Cost).
  *   [ ] **Mental Prep:** Be ready to sit in the silence after the Reveal. Do not rush to fill it. Let them feel the embarrassment of having hunted a ghost. That embarrassment is the learning.

  ### Why This Works for First-Years
  It externalizes the conflict. The "enemy" isn't the other student; the enemy is the *game mechanic*. When you reveal there was no Troll, the room unites against the *structure* that made them suspect each other. This lowers the social stakes for the rest of the semester because you've all shared a "trauma" of being tricked by the professor, rather than a conflict with each other.
