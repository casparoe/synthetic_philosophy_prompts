answer: |-
  Good afternoon. Thank you for coming.

  If you knew my mother, you know that the right place to start is always the table. For thirty-one years, this house smelled of roast meat and yeast every Sunday. The rule was simple: whoever turned up was fed. Neighbors, strangers, old friends, new ones. There were no place cards. There was just the chair pulled out, and the plate filled.

  Looking around this room, I see that table extended. I see her children and grandchildren. I see neighbors and former colleagues. I see the care-home staff who spent the last four years with her. And I see people who loved her but haven't been in touch for a long time. You are all part of this meal.

  Two years before she got sick, she left a note about what should happen today. She was a tough-minded woman. She wrote that she didn't want us talking about her watching over us from somewhere else. She didn't want us claiming we knew what she would have wanted for our futures. And she was very specific about the end. She believed that a self is something you build by doing, by recognizing, by holding up your end of a conversation. She wrote that once she could no longer recognize us, once she could no longer relate, we shouldn't speak of her as a person in the room. She thought that part was over.

  I intend to keep her first two requests. There will be no angels today, and no prescriptions for how you should live. But on the third point, I have to gently disagree with her. Not because I think she was wrong about who she was when she was well, but because I think she was too modest about who she was when she was ill.

  The last four years were hard. I won't pretend otherwise. There were days when she didn't know my name. There were times when the disease took more than it gave. She couldn't hold up her end of the relationship. She couldn't ask how we were. She couldn't say thank you. In the way she defined herself, the lights were out.

  But a person isn't just a light bulb that switches off. A person is also the space they occupy in the lives of others. When she could no longer hold herself up, we held her. When she couldn't remember the songs, we sang them anyway. When she couldn't pull out the chair, the care staff did it for her, with a kindness that never wavered.

  This wasn't a delusion that she was "still in there." We knew she wasn't. But love isn't a transaction that stops when the payment stops. It is a structure we build around someone. For those four years, her personhood wasn't something she exercised alone; it was something we practiced together. It was carried by the hands that washed her, the voices that greeted her, and the family who kept visiting even when there was no recognition to be had. We didn't keep her alive; we kept her *among* us. And that matters.

  I know this view can be scary. If we make each other who we are, does that mean those who drift away break us? Does it mean that because some people haven't seen her in years, they failed her?

  No. That isn't how this table works.

  Relationships ebb and flow. Life moves people apart. There are people in this room who haven't spoken to her in a decade. There are people who couldn't come today. That doesn't diminish her, and it doesn't diminish you. The open lunch wasn't about forcing people to stay; it was about ensuring there was always a place to return to. Her personhood isn't a verdict on your attendance record. It is the sum of all these connections, near and far, past and present. The fact that you are here now, or that you remember her now, adds to the web. It doesn't subtract from it if the thread was quiet for a while.

  She taught us that feeding people is a way of saying, "You belong." In the end, she couldn't feed us. So we fed her. We held the space. We kept the chair pulled out.

  So, we aren't here to say she is watching us. We aren't here to say she left us a map. We are here to say that the work she started—the work of holding space for one another—continued right to the end. It continued in the care home. It continues in this room.

  The Sunday lunch is over. The kitchen is cold. But the table is still set. Please, eat, drink, and talk to someone you haven't seen in years. Keep the chair pulled out. Keep holding each other up. That is how she remains here. That is how we keep her.

  Thank you.
