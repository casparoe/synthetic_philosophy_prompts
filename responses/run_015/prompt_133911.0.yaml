  Subject: Tuesday's vote (and my typo)

  Hey team,

  For Tuesday's vote, I'm recommending we uphold the firing. I know that sounds harsh, but hear me out on why I'm taking her "fragmented obligation" defense seriously.

  Her "role-fragmented" theory posits that her employment contract binds her to the institution's purpose, not just its hierarchy. She's arguing that when the admin shell betrays the deliberative core, the duty dissolves. That's a sophisticated take on political obligation, way beyond standard "I refused an order" defenses. It deserves more than a citation to municipal code 4.5. She's right that legitimacy comes from the Charter, not the chain of command.

  However, accepting her solution creates a bigger problem. If we rule that individual employees can unilaterally declare command pathways "illegitimate," we fracture the civil service. Her duty to the core is real, but the mechanism for enforcing it can't be personal veto power. We need systemic channels for climate objections, not rogue planners. Upholding the firing acknowledges that while her moral compass is right, her operational method breaks the city.

  The strongest case for reinstatement is straightforward: If the Charter overrides zoning, firing her makes the Charter meaningless. It signals that climate goals are decorative. That's a valid fear.

  But we can address that without reinstating her. We can recommend the City Council create a formal climate-review bypass so the next planner doesn't have to choose between their job and the planet.

  Timeline:
  *   **Tuesday 10 AM:** Vote.
  *   **Wednesday:** Draft decision.
  *   **Friday:** Issue final ruling.

  Let's stick to this. It protects the chain of command without dismissing the ethical crisis she highlighted.

