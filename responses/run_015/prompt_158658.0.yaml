answer: |-
  Based on Maya's track record, here is the breakdown of her ethical framework, the prediction for Finland, and the rule that actually governs her thinking.

  ### 1. The Finland Prediction
  **Maya will say the tourist is morally bound to learn and follow the invisible queue.**

  Here is why: Her verdict on **Berlin jaywalking at 3am** is the "tell." In that scenario, there is no physical danger (no cars) and no immediate victim (no free-riding on a ticket). Her justification is purely about *eroding a shared commitment*.

  The Finnish bus stop is structurally identical to the Berlin crosswalk. It is a low-stakes coordination norm that relies on mutual trust rather than physical barriers. If a tourist stands too close (New York style), they aren't causing physical harm, but they are violating the local mechanism of order. Since Maya believes you must uphold the Berlin signal even when pointless, she will argue you must uphold the Finnish spacing even when invisible. To her, ignorance of the "invisible line" is a failure of due diligence, not an excuse.

  ### 2. Rule A vs. Rule B: The Split
  You asked if she is running **"Local coordination norms always bind visitors" (Rule A)** versus **"Only norms that prevent harm or free-riding" (Rule B)."**

  Maya has effectively **rejected Rule B**.
  *   **Evidence:** Berlin 3am Jaywalking. There is no tangible harm or free-riding in that specific instance. If she were running Rule B, she would have to concede that jaywalking at 3am is permissible. By calling it "wrong," she establishes that the *existence of the norm* creates an obligation, regardless of immediate consequences.

  She is running a version of **Rule A**, but with a specific caveat regarding *which* norms count (more on that in the Third Rule section).

  **The Case That Splits Them:**
  To prove she isn't running Rule B, you need a scenario where a local norm exists but breaking it causes zero harm or free-riding.
  *   **The Case:** *The 3am Escalator in Tokyo.*
  *   **Context:** In Tokyo, the strict norm is to stand on the left and walk on the right (in most stations).
  *   **Scenario:** It is 3am. The station is empty. You stand on the right side of the escalator because you're tired.
  *   **Rule A (Coordination):** This is wrong. You are violating the local script.
  *   **Rule B (Harm):** This is permissible. No one is blocked; no efficiency is lost; no one is harmed.
  *   **Maya's Likely Verdict:** She will say it is **wrong**. This confirms she prioritizes the integrity of the coordination system over the absence of harm.

  ### 3. The Third Rule: "Functional Systemic Integrity"
  There is a third rule that fits her verdicts better than a blunt "Follow All Local Norms." Maya isn't just following norms; she is following the **functional logic of the local social system.**

  **The Rule:** *Visitors must act in the way that sustains the specific mechanism of order the local society uses to function.*

  This explains the **Berlin vs. Saigon** distinction perfectly, which Rule A struggles with if interpreted loosely.
  *   **Berlin (Rigid System):** The society functions on strict adherence to codified rules (lights, queues). To weave through traffic or jaywalk is to attack the *mechanism* of trust that keeps the system safe. Therefore, you must follow the rule even at 3am, because you are upholding the *system*, not just avoiding a crash.
  *   **Saigon (Fluid System):** The society functions on continuous negotiation and flow. The "mechanism of order" *is* the weaving. If you tried to follow "Berlin rules" (waiting for a green light in Saigon), you would actually *break* the local system (causing confusion or accidents). Therefore, weaving is the ethical choice because it sustains the local mechanism.
  *   **US Tipping:** The mechanism is a subsidized wage system. Not tipping breaks the economic contract.
  *   **Japan Tipping:** The mechanism is a pride/service contract. Tipping breaks the social contract.
  *   **Finland:** The mechanism is high-trust/low-contact spacing. Standing too close jams the social sensor.

  **Why this is the best match:**
  It resolves the tension between "Follow the Law" (Berlin) and "Break the Law" (Saigon weaving). Maya isn't a legalist; she is a **functionalist**. She believes ethics in travel is about not jamming the local social machine, whether that machine runs on rigid gears (Berlin) or fluid hydraulics (Saigon).

  ### Summary for Your Argument
  1.  **Finland:** She will say the tourist is wrong to stand close. The "invisible queue" is a binding commitment.
  2.  **Her Rule:** She is not running "Harm Prevention" (Berlin 3am disproves this). She is running "Systemic Integrity."
  3.  **The Test:** Ask her about the **3am Tokyo Escalator**. If she says standing on the "wrong" side is immoral because it disrespects the system, she confirms the **Systemic Integrity** rule. If she says it's fine because no one is hurt, she contradicts her Berlin stance.
