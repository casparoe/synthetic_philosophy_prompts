answer: |-
  ### The "Unexpected Spaces" Art Eligibility Procedure (v1.0)

  **Purpose:** To determine if a proposal meets the minimum definition of "art" for grant eligibility.
  **Time Budget:** 15 Minutes.
  **Theory:** Hybrid of *Defamiliarization* (breaks function) + *Institutional Theory* (recognized by art world).
  **Note:** This procedure determines **eligibility**, not **quality**. A "Yes" means "This counts as art," not "This is good art."

  ---

  #### Step 1: The Intent Check (Fact)
  **Question:** Does the applicant explicitly frame this work as an artistic presentation rather than a service, product, or accident?
  *   **Look for:** Artist statement, use of the word "installation/performance/work," placement in a context of viewing rather than pure utility.
  *   **Pass:** Applicant claims artistic intent in writing.
  *   **Fail:** Applicant describes it purely as a service (e.g., "cleaning," "transport," "housing").
  *   **Hard Stop:** If **Fail**, reject immediately. (Not art).
  *   **Hand-off to Human:** If the language is ambiguous (e.g., "functional design"), flag for Step 2 review.

  #### Step 2: The Functional Break (Judgment)
  **Question:** Does the presentation disrupt the object's or action's normal use-category?
  *   **Look for:** Is the object removed from its supply chain? Is the action performed without its usual practical goal? Does it force the viewer to see the *form* or *concept* rather than the *use*?
  *   **Sufficient Answer:** Yes, the normal function is suspended, exaggerated, or made irrelevant.
  *   **Hard Stop:** If **No** (it works exactly as intended with no conceptual shift), reject. (It is a tool, not art).
  *   **Hand-off to Human:** If the break is subtle (e.g., a bench that is slightly uncomfortable), you must decide if the disruption is significant enough. *If you cannot decide in 3 minutes, send to Board.*

  #### Step 3: The Institutional Anchor (Fact)
  **Question:** Is there evidence that a recognized art-world practice has treated *similar* work as art?
  *   **Look for:** Citations of galleries, museums, art journals, university syllabi, or established festivals that have shown comparable work.
  *   **Sufficient Answer:** Yes, the *genre* or *method* is recognized (e.g., "Performance Art," "Readymade," "Social Practice").
  *   **Constraint:** The applicant's claim alone does not count. The *category* must be validated.
  *   **Hard Stop:** If **No** (the method is unknown to art history/industry), reject. (It may be craft, hobby, or innovation, but not art under this charter).
  *   **Hand-off to Human:** If the validation source is borderline (e.g., an obscure blog vs. a peer-reviewed journal), send to Board.

  #### Step 4: The Values Hand-off (The Limit)
  **Status:** If Steps 1–3 are **PASS**, the proposal is **ELIGIBLE**.
  **Action:** Forward to Board Chair.
  **Reason:** This procedure cannot judge merit, ethics, truthfulness, or community value. It only filters for category.

  ---

  ### Limitations & Misfires
  Be honest about what this tool breaks:
  1.  **It excludes "Good Design."** Beautiful, highly functional objects (a perfect bridge, a lovely shelter) will fail Step 2.
  2.  **It privileges the Elite.** Step 3 requires institutional validation. Folk art, outsider art, and community traditions without gallery representation will fail.
  3.  **It cannot detect fraud.** If a liar checks the boxes, the procedure says "Yes."
  4.  **It ignores harm.** Offensive or dangerous work can pass if it breaks function and has institutional precedent.

  ---

  ### Run-Through: Three Proposals

  #### 1. The Laundry Baskets
  *   **Step 1 (Intent):** Pass. Plaque reads "installation."
  *   **Step 2 (Functional Break):** **Fail.** Stacking clean baskets is the standard storage method for baskets. It does not disrupt their function; it fulfills it. The plaque does not change the physical categorization.
  *   **Step 3 (Institutional):** N/A (Failed Step 2).
  *   **Decision:** **HARD NO.**
  *   **Reasoning:** This is storage, not defamiliarization.

  #### 2. The Beautiful Bus Shelter
  *   **Step 1 (Intent):** Pass. Architect claims "public art."
  *   **Step 2 (Functional Break):** **Fail.** The proposal states it is "fully functional" and looks "like every other shelter." It serves the exact category of "bus shelter" without disruption. The color is aesthetic, but not a functional break.
  *   **Step 3 (Institutional):** Pass. Architecture is a recognized art discipline.
  *   **Decision:** **HARD NO.**
  *   **Reasoning:** Under this definition, a thing that performs its function perfectly without conceptual disruption is design/engineering, not art.
  *   **Note:** You may feel this is wrong because architecture *is* art. This procedure is designed to reject it unless the architect demonstrates how the shelter *fails* or *comments on* being a shelter.

  #### 3. The Invisible Trash Sorter
  *   **Step 1 (Intent):** Pass. Performer insists it was art.
  *   **Step 2 (Functional Break):** **Pass.** Sorting trash in a park is normally sanitation labor. Performed silently by a non-worker with no collection goal, the "function" of cleaning is suspended in favor of the "act" of sorting. It breaks the use-category of "sanitation."
  *   **Step 3 (Institutional):** **Pass.** "Performance Art" and "Social Practice" are recognized categories treated by museums and curricula (e.g., Marina Abramović, Tania Bruguera). The *similar work* exists, even if this specific instance has no record.
  *   **Decision:** **ELIGIBLE (YES).**
  *   **Reasoning:** It meets both criteria: functional disruption and institutional genre recognition.
  *   **The Answer You'll Hate:** The procedure forces you to classify this as **Art**. You cannot reject it on eligibility grounds. You must send it to the Board, where they will have to reject it based on **trust** (no proof it happened) or **value** (no audience benefit), which is a much harder political fight than saying "This isn't art."

  ---

  ### What This Procedure Cannot Settle
  No matter how carefully you run this, these questions remain unresolved:

  1.  **Truth:** The procedure accepts the applicant's statement of intent as fact. If the Trash Sorter lied and never showed up, the procedure still validates the *proposal* as art.
  2.  **Merit:** A profound masterpiece and a cynical cash-grab can both pass Steps 1–3. The procedure filters for *category*, not *quality*.
  3.  **Public Value:** Something can be "Art" under this definition and still be boring, offensive, or useless to the community. That decision is now entirely on the Board Chair's shoulders.
  4.  **The "Edge" of Function:** In Proposal 2 (The Shelter), reasonable people disagree on whether "beauty" counts as a functional break. The procedure takes a hardline "No," which may conflict with the city's broader design goals.

  **Recommendation:** Use this to clear the obvious non-art (services, products). Expect to hand off 20% of files to the Chair because the "Functional Break" is subjective. Expect public pushback on Proposal 3 types, as the procedure validates them despite their lack of public utility.
