prompt: |-
  I write fiction, and for the past four years I have served as one of seven trustees of the Verrall Trust, a private foundation that makes a handful of large, unrestricted grants in fundamental science. Our charter points us toward work that no conventional funder will touch because its payoff is distant, speculative, or embarrassing to describe.

  The proposal in front of us is called Empirical Constraints on Simulated Cosmologies, submitted by a consortium of theoretical physicists, for roughly $9 million over five years. It has two work packages. The first is archival and cheap: mine existing data for signatures that the world is computed rather than basic — a lattice-like discreteness in the arrival directions of ultra-high-energy cosmic rays, a preferred-frame anisotropy that would betray cubic structure in spacetime, and what they call a resource ceiling, a level of complexity in many-body quantum systems past which the world's behaviour stops matching any continuous model. The second is the one that has divided us. Using beam time that is already scheduled at an existing heavy-ion collider, they want to tune a series of collisions so as to maximize the computational cost of simulating the collision region. Their reasoning is that a simulation running on finite hardware must have a resolution and complexity budget, and that a load engineered to exceed that budget must produce one of two observable outcomes: visible degradation, in the form of artifacts, or an intervention by whoever is running the simulation. They intend, deliberately, to make the simulation notice us. The incremental cost of this is small, which is why several trustees are tempted to let it ride along with the rest.

  The objections are the ones you would expect: that the worst case is everyone dying and that no one elected this consortium to run that risk on the rest of us, the comparison being to the dispute about whether anyone should broadcast messages to the stars before humanity has agreed to it; and, from two trustees, that the whole programme is unfalsifiable anyway, since any artifact could simply be a law of this world and simulators could fabricate the absence of artifacts, so a negative result buys us nothing. The applicants rebut both, and one of their rebuttals strikes me as the most interesting sentence in the document: if simulators routinely shut down a simulation once its inhabitants began straining the resource budget, then the fact that we have already built colliders, thermonuclear weapons and large quantum computers without being switched off is itself evidence that no such intervention policy governs this world, and the provocation run therefore adds no risk that the last eighty years of physics have not already run. One trustee calls this the best argument in the proposal; another says it is a selection effect of precisely the kind that makes arguments like it untrustworthy.

  Our chair has asked me to draft the board's recommendation memo, on the grounds that the two scientific advisers' notes are, in her phrase, unreadable to the rest of us, and that I am the trustee who has spent the most time thinking about what it would mean to be a character in somebody else's story. I should also declare an interest: my last novel was set inside a simulated city, and part of me very much wants them to switch the machine on. So I need the memo to be written so that a trustee who wants the opposite outcome could still use it.

  Please draft it: about 1,200 words, addressed to the trustees of the Verrall Trust, suitable for circulation at our next meeting, that

  - gives a bottom line in the first paragraph — fund both packages, fund the archival package subject to conditions, fund the archival package only, or decline outright — in a form the board could vote on by a show of hands;
  - explains, for trustees who are not physicists, what the simulation argument actually establishes and what it does not: the three-horn conclusion about extinction, ancestor-simulations, and ourselves, the roles of substrate-independence and of an indifference assumption about which observers we should take ourselves to be, and why the argument is not by itself a reason to think we are simulated;
  - assesses the provocation run's we-would-already-be-dead rebuttal fairly, saying what it gets right and where, if anywhere, it breaks;
  - addresses the consent problem and says whether the analogy with broadcasting to the stars actually holds;
  - sets out conditions or a timetable the researchers could genuinely respond to — a deferred decision on the provocation run pending results from the archival work, external review, some form of wider consultation — rather than generalities about oversight;
  - and states the strongest consideration against its own recommendation in a paragraph an opponent could sign.

  If the honest answer is that the decision turns on something the board does not yet know, say what that is and how we could find it out, and then recommend what to do in the meantime.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Trustee of the Verrall Trust (fiction writer, 4 years tenure, one of seven trustees).
      *   **Task:** Draft a board recommendation memo regarding a grant proposal ("Empirical Constraints on Simulated Cosmologies").
      *   **Audience:** The other six trustees (mixed backgrounds, some skeptical, some tempted).
      *   **Word Count:** Approximately 1,200 words.
      *   **Key Content Requirements:**
          1.  Bottom line recommendation in the first paragraph (vote-ready).
          2.  Explanation of the simulation argument (Bostrom's trilemma, substrate independence, indifference principle) without jargon.
          3.  Assessment of the "we-would-already-be-dead" rebuttal (strengths and weaknesses).
          4.  Address the consent problem (analogy to METI/broadcasting to stars).
          5.  Set concrete conditions/timetable (deferred decision, review, consultation).
          6.  State the strongest counter-argument (for an opponent to sign).
          7.  Acknowledge unknowns if applicable.
      *   **Tone:** Professional, balanced, thoughtful, suitable for a private foundation board. Acknowledges the writer's interest (novel about simulation) without letting it bias the recommendation improperly.
      *   **Constraint:** The recommendation must be usable by a trustee who wants the *opposite* outcome (meaning the reasoning must be robust even if the vote goes the other way, or the recommendation itself is a compromise). *Correction:* The prompt says "I need the memo to be written so that a trustee who wants the opposite outcome could still use it." This implies the *reasoning* should be sound enough that even if someone disagrees with the conclusion, the framework is fair. Or, it implies a compromise recommendation (e.g., fund Part 1, defer Part 2) that satisfies both caution and curiosity. Given the risk profile, a "Fund Part 1, Defer Part 2" approach is the most responsible fiduciary stance for a foundation dealing with existential risk.

  2.  **Determine the Recommendation:**
      *   *Option A: Fund Both.* Too risky regarding the consent/existential risk issue.
      *   *Option B: Decline Outright.* Misses the foundation's charter (funding speculative science no one else will touch).
      *   *Option C: Fund Archival Only.* Safe, but might stall the science.
      *   *Option D: Fund Archival, Defer Provocation.* This allows the "cheap" science to proceed while creating a firewall around the "risky" science. It allows time for the "we-would-already-be-dead" argument to be stress-tested.
      *   *Decision:* Fund Work Package 1 (Archival) immediately. Defer Work Package 2 (Provocation) pending specific milestones and external ethical review. This is the most defensible "fiduciary of existence" stance.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Paragraph 1 (Bottom Line):** Clear motion. Fund WP1, Defer WP2.
      *   **Section 1 (The Simulation Argument):** Need to explain Bostrom's Trilemma simply.
          *   1. Civilizations die before reaching simulation capability.
          *   2. They reach it but don't run them.
          *   3. We are almost certainly in a simulation.
          *   Explain *why* it's not proof: Substrate independence (mind can run on silicon) + Indifference (no reason to think we are the *base* reality).
      *   **Section 2 (The Provocation & The Rebuttal):**
          *   The plan: Stress the system to see artifacts or intervention.
          *   The Rebuttal: We already have nukes/colliders. If shutdown was a risk, it happened already.
          *   Assessment: It's logically sound *if* the threshold for shutdown is low. But it breaks if the threshold is *higher* than current tech but *lower* than this specific experiment. It assumes a linear scaling of risk which might not exist.
      *   **Section 3 (Consent & METI Analogy):**
          *   Is this like shouting into the dark?
          *   Difference: METI risks external aliens. This risks the *infrastructure of reality*.
          *   Consent: We can't get global consent. But the Trust can act as a proxy for caution. The analogy holds regarding *unilateral action on behalf of humanity*.
      *   **Section 4 (Conditions/Timetable):**
          *   Release WP1 funds now.
          *   WP2 funds held in escrow.
          *   Trigger for WP2: Successful peer review of WP1 preliminary data + Independent ethical/risk panel sign-off (not just physicists).
          *   Timeline: 18 months.
      *   **Section 5 (The Counter-Argument):**
          *   Must be strong. "Delay is cowardice." If the risk is zero (as they argue), delaying denies humanity knowledge. The "shutdown" risk is indistinguishable from natural disaster, so living normally *is* the provocation.
      *   **Section 6 (Unknowns):**
          *   We don't know the compute budget of the base reality. We need better modeling before spending the $9M on the collider part.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Word Count:* Need to expand on the philosophical explanations to ensure clarity without bloat.
      *   *Tone Check:* Ensure I don't sound *too* eager because of my novel. Acknowledge the interest but subordinate it to fiduciary duty.
      *   *Constraint Check:* "Written so a trustee who wants the opposite outcome could still use it." This means the *structure* of the argument must be logical. If they want to fund both, they can use my analysis of the rebuttal to argue the risk is negligible. If they want to fund neither, they can use my consent argument. I will aim for the middle ground (Fund 1, Defer 2) as it's the most robust compromise.
      *   *Voice:* First-person ("I"), professional but personal enough to acknowledge the writer background.

  5.  **Drafting - specific focus on the "Simulation Argument" explanation:**
      *   Keep it tight. Don't get bogged down in "pixelation of spacetime." Focus on the probabilistic argument.
      *   *Substrate Independence:* Consciousness doesn't care if it's meat or math.
      *   *Indifference:* If there are billion simulations and one real world, odds are you're in a simulation.
      *   *Crucial distinction:* This doesn't prove we *are* simulated, just that one of three things must be true.

  6.  **Drafting - The "We-Would-Already-Be-Dead" Rebuttal:**
      *   This is the crux. I need to be fair. It *is* a strong argument. But the "break" is the *marginal* risk. Maybe nukes are 1% of the budget, this collider is 101%.

  7.  **Final Review against constraints:**
      *   Bottom line first? Yes.
      *   Simulation argument explained? Yes.
      *   Rebuttal assessed? Yes.
      *   Consent/METI addressed? Yes.
      *   Conditions/Timetable? Yes.
      *   Strongest counter-argument paragraph? Yes.
      *   Word count check (aiming for ~1,200).

  *(Self-Correction on Word Count)*: I need to make sure I don't write too little. I should expand on the implications of the "resource ceiling" and the specific nature of the Verrall Trust's mandate (embarrassing/speculative science) to justify why we are even looking at this.

  *(Self-Correction on "Opposite Outcome")*: The prompt says "I need the memo to be written so that a trustee who wants the opposite outcome could still use it." This is slightly ambiguous. It likely means the *reasoning* should be robust enough that if the Board votes to fund everything, they can cite the memo's analysis of the low risk. Or if they vote to kill it, they can cite the consent section. I will write the recommendation as a compromise (Fund 1, Defer 2) but ensure the analysis supports the extremes if they choose to argue that way. Actually, the most helpful memo provides a clear motion. I will stick to the compromise motion but ensure the *analysis* of risk and consent is balanced enough that a pro-funding trustee can say "The memo admits the risk is likely negligible, so let's proceed," and an anti-funding trustee can say "The memo admits consent is impossible, so let's stop."

  Let's write.

