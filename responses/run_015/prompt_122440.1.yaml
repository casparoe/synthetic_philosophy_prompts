answer: |-
  **MEMORANDUM**

  **TO:** International Fieldwork Ethics Panel
  **FROM:** Graduate Student Representative
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memo: Rural Water Use & Diarrhoea Survey (PI: [Name])

  **Recommendation**
  Approve the study protocol conditional on the implementation of a hybrid consent mechanism within 14 days, consisting of recorded community consent plus a verified, private individual opt-out procedure for women, subject to an interim safety review after 100 households.

  **Rationale and Metaethical Position**
  This recommendation navigates the "affirmation gap" distinguishing *moral validity* from *institutional authorization*. We are not asserting that community-level consent is morally equivalent to individual informed consent (claim i), nor are we claiming epistemic humility prevents us from judging it (claim ii). Rather, we authorize the study (claim iii) based on harm mitigation, not moral endorsement. Prohibiting the study here does not protect autonomy; it merely removes oversight, potentially driving the PI toward unmonitored fieldwork or canceling public health benefits. Our authorization is pragmatic, not validating. We permit the procedure not because it is right, but because the alternative constitutes greater institutional complicity in harm.

  **Preventing Normative Arbitrage**
  To prevent the PI from engaging in normative arbitrage—selecting whichever ethical framework (University, Funder, NGO) offers the least resistance—this approval binds her to a hybrid standard. She cannot simply defer to the NGO's community consent nor strictly enforce university individual consent. She must satisfy both partially: securing community access while establishing individual safeguards. Compliance is not self-reported; the PI must submit evidence of the opt-out mechanism's functionality before data collection begins. This prevents the PI from treating ethical frameworks as a menu rather than a constraint.

  **Intracommunity Disagreement**
  We must treat the "community" not as a unitary agent but as a site of power asymmetry. The elders' consent represents the public normative framework, but the reported private preferences of women represent a suppressed counter-framework. Approving solely on elder consent validates the silence of vulnerable members. The required private opt-out mechanism addresses this by creating a safe channel for dissent without forcing public confrontation. If the community's framework is defined by its power structures, our condition attempts to amplify the voiceless within that structure without dismantling it violently, which would endanger the participants.

  **The Case for Rejection**
  The strongest argument against this recommendation is the Integrity Argument: university policy exists to protect subjects from exactly this kind of coercion, and waiving it sets a precedent that local convenience overrides universal rights. By approving, we signal that individual autonomy is negotiable when logistics are difficult. This erodes the normative force of our guidelines, potentially encouraging future PIs to seek out restrictive partners precisely to bypass consent requirements, knowing the Panel will fold under the threat of study cancellation.

  **Conditions for Approval**
  1.  **Hybrid Protocol:** Within 14 days, PI must submit a protocol detailing how individual women may opt out privately (e.g., via a female researcher visiting compounds separately from the elder council).
  2.  **Interim Review:** Data collection pauses after 100 households. PI must report opt-out rates and any signs of coercion before proceeding.
  3.  **Withdrawal Clause:** If the NGO obstructs the private opt-out mechanism, the study terminates immediately.

  ***

  **Confidence Note**
  I am moderately confident in this recommendation (approx. 70%). The load-bearing claim is the assumption that a *private opt-out mechanism* can be made safe in this specific cultural context. If the social cost of opting out is high enough (e.g., domestic retaliation), then even a private channel creates risk. If that claim is false, the recommendation should shift to Rejection, as the study becomes unavoidable complicity in coercion.
