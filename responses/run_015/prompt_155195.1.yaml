prompt: |-
  I sit on the Charter Review Commission of a home-rule city of roughly eighty thousand residents. We meet monthly and will table our final recommendations to the city council in March; one contested item remains, and it is the one the council is waiting on: whether to extend the municipal franchise to non-citizen residents. That population is not marginal here. It includes green-card holders who have lived in the city for decades and simply never naturalized, visa holders with work authorization whose stays are open-ended, and residents without status. All of them work here, pay local sales and property taxes through rent, send children to our schools, use our transit, and are subject to our police, housing, and code enforcement.

  Three features of our situation keep the standard arguments from settling it, and I want the memo to work through them rather than around them.

  First, the commission has already passed two related amendments on preliminary votes: lowering the municipal voting age to sixteen, and making participation in municipal elections formally compulsory for registered voters, enforced by a small civil fine, with an explicit abstention option on every ballot so that no one is compelled to express a preference. So the live question is not merely whether non-citizen residents may vote, but whether they may be *required* to. Compulsory voting is usually defended as a duty members owe to their own political community; imposed on people who have not naturalized, some of whom are not permitted to, it starts to look like conscription into an obligation they never accepted. Yet exempting them appears to create a second, lesser tier of residence.

  Second, our current charter already enfranchises a group the popular all-affected-interests argument handles badly: non-resident owners of commercial property, who vote in downtown improvement district elections while living in the suburbs. Any principle we adopt should say something about them too, since a principle that saves our existing practice only by accident is not a principle.

  Third, the newly enfranchised are not a single kind of case. Some have declined membership that was available to them; some have membership withheld from them; some cannot register without creating a paper trail that exposes them to removal, so that a right they may only exercise at legal risk is close to no right at all.

  Please draft the decision memo I will circulate to the commission and then to the council. It should open with a bottom line — adopt, adopt with conditions, reject, or defer with a specific charge — together with a time frame and an implementation path. It should then state the principle it takes to govern who votes in a city, and apply that principle consistently across the groups in play: sixteen-year-olds, citizen absentees, non-citizen residents of the three kinds above, and non-resident commercial property owners. It should give the strongest version of the objection on the losing side and explain why it nonetheless loses: I have in mind the circularity worry that any existing electorate decides who counts as the people, so that an appeal to what the people want cannot ground a change in who the people are. It should also say what we should do about the compulsory-voting amendment as applied to anyone newly enfranchised, and how the recommendation should be revised if the state legislature pre-empts home-rule control of the franchise.

  Two constraints. Do not settle the question by citing turnout figures, demographic projections, or what other cities or countries have done: we will not have reliable local data before March, and comparative practice is another subcommittee's assignment. What we need is the argument, made at a level the council can vote on and the public can answer.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**

      *   **Role:** Member of the Charter Review Commission (CRC) of a home-rule city (~80k residents).
      *   **Audience:** Fellow Commissioners first, then the City Council.
      *   **Task:** Draft a decision memo regarding the extension of municipal franchise to non-citizen residents.
      *   **Deadline:** Final recommendations tabled in March.
      *   **Key Issue:** Non-citizen voting (green card holders, visa holders, undocumented).
      *   **Complicating Factors (The "Three Features"):**
          1.  *Compulsory Voting:* The CRC already passed lowering the voting age to 16 and making voting compulsory (with a fine/abstention option). Does this obligation extend to non-citizens? Is it conscription? Or does exemption create a second-tier status?
          2.  *Non-Resident Property Owners:* Current charter allows non-resident commercial property owners to vote in specific district elections. The new principle must address this consistency.
          3.  *Heterogeneity of Non-Citizens:* Some chose not to naturalize, some can't, some risk deportation if they register. A "right" that risks safety isn't a full right.
      *   **Required Structure:**
          1.  Bottom Line (Adopt/Reject/Defer/Condition) + Time Frame + Implementation Path.
          2.  Governing Principle for the franchise.
          3.  Application of principle to all groups (16-year-olds, citizen absentees, 3 types of non-citizens, non-resident property owners).
          4.  Strongest Objection (Circularity/Constitutive Power) & Rebuttal.
          5.  Compulsory Voting Application (for newly enfranchised).
          6.  Contingency Plan (if State Legislature pre-empts home rule).
      *   **Constraints:** No turnout figures, no demographics, no comparative practice (other cities/countries). Focus on *argument* and *principle*.

  2.  **Determine the Bottom Line:**

      *   *Option A (Reject):* Safe, but ignores the "subject to laws/taxes" argument which is strong for home-rule cities. Doesn't solve the "second-tier" issue raised in Feature 1.
      *   *Option B (Adopt Unconditionally):* Ignores the risk to undocumented residents (Feature 3) and the compulsory voting tension (Feature 1).
      *   *Option C (Adopt with Conditions):* This seems most robust. It addresses the franchise extension but handles the compulsory voting and safety concerns.
      *   *Decision:* **Adopt with Conditions.** Specifically: Extend franchise to all residents regardless of citizenship, *but* decouple it from the compulsory voting mandate for non-citizens, and ensure registration confidentiality. Address non-resident property owners by aligning them with the residency principle (likely removing their vote or clarifying it as a stakeholder exception, but the prompt asks for a consistent principle. Usually, residency + subjection to law is the stronger democratic principle. I should probably recommend phasing out non-resident voting to be consistent, or justifying it strictly as a property tax stakeholder exception. Let's aim for consistency: Residency + Subjection to Law is the core principle. Non-resident owners pay property tax, but don't live under the police/code daily. I will recommend aligning the franchise to *residency* primarily, which means non-resident owners lose the vote, OR I need a principle that covers both. "Stakeholder" theory covers both, but is weaker democratically. "Subjection to Coercive Authority" covers residents better. Let's go with **"Subjection to Local Authority and Residence."** This enfranchises non-citizen residents but disenfranchises non-resident owners, creating consistency.)
      *   *Refinement on Compulsory Voting:* If we make voting compulsory for citizens, exempting non-citizens looks like second-class status. But forcing them looks like conscription. The solution: Make voting compulsory for *residents*, but waive the penalty for non-citizens who cite status concerns, or simply exempt them from the *mandate* while keeping the *right*. Actually, the prompt says "whether they may be *required* to." The best philosophical path: The duty arises from membership. If we grant the vote, we acknowledge membership. But if naturalization is blocked, membership is incomplete. *Decision:* Extend the right, but exempt non-citizens from the compulsory mandate (the fine) to avoid the "conscription" charge, acknowledging their precarious legal standing vis-a-vis the federal government. This avoids the "second tier" charge by framing it as a protection, not a deprivation.
      *   *Refinement on Non-Citizen Types:* Undocumented residents cannot register safely. The city must guarantee confidentiality or allow a proxy/anonymous mechanism? No, that's too complex. The memo must acknowledge that for some, the right is theoretical. Recommendation: City Attorney to certify registration data is walled off from federal enforcement.
      *   *Final Bottom Line:* **Adopt with Conditions.** Extend franchise to all residents 16+. Exempt non-citizens from compulsory voting penalties. Phase out non-resident property owner voting. Implement by next municipal election.

  3.  **Drafting the Governing Principle:**

      *   Need a principle that covers 16-year-olds (future citizens/residents), citizens (members), non-citizens (subject to law), and property owners (stakeholders).
      *   *Principle:* **"The Principle of Reciprocal Subjection."** Those who are permanently subject to the city's coercive authority and contribute to its maintenance through residence and taxation constitute the municipal demos.
      *   *Why:* It captures the "no taxation without representation" angle but grounds it in *subjection to law* (police, code, zoning) rather than just tax. It explains why 16-year-olds vote (they live under the laws). It explains why non-citizens vote (they live under the laws). It challenges non-resident owners (they don't live under the daily coercive order).

  4.  **Addressing the Three Features:**

      *   *Feature 1 (Compulsory Voting):* If voting is a duty of residence, non-citizens owe it. But federal status makes it risky. *Solution:* Right is universal for residents; Duty is waived for non-citizens to avoid federal conflict/conscription analogy.
      *   *Feature 2 (Property Owners):* Under "Reciprocal Subjection," they lose the vote. They pay taxes but aren't *subject* to the daily order. This creates consistency.
      *   *Feature 3 (Heterogeneity):* Acknowledge the risk. Implement data firewalls.

  5.  **Addressing the Circularity Objection:**

      *   *Objection:* The current people decide who the people are. We can't use democratic will to expand the demos because the demos isn't formed yet.
      *   *Rebuttal:* The Charter Commission isn't acting as the "people" in a plebiscite; it's acting as a constitutional convention correcting a boundary error. The authority comes from the *nature of the political association* (home rule), not the current electorate's whim. We are identifying who *should* be there, not asking who *wants* them there.

  6.  **Addressing State Pre-emption:**

      *   If the state says "No," we need a fallback.
      *   *Fallback:* Advocate for state-level change, but in the meantime, create non-voting advisory councils with binding consultation requirements for the City Council on issues affecting non-citizens.

  7.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Bottom Line:** Clear and actionable.
      *   **Governing Principle:** Define "Reciprocal Subjection."
      *   **Application:** Walk through the 5 groups (16yo, Citizens, Non-citizens [3 types], Property Owners).
      *   **The Circularity Objection:** State it charitably, then dismantle it using the distinction between *constituted* power and *constitutive* reasoning.
      *   **Compulsory Voting:** The nuance on the fine/mandate.
      *   **Pre-emption:** The Plan B.

  8.  **Refining the Tone:**

      *   Needs to be legalistic but philosophical.
      *   Respectful of the Commission's prior votes.
      *   Firm on principle.
      *   No empirical data (as per constraints).

  9.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "conscription" worry? Yes, by waiving the penalty.
      *   *Check:* Did I address the "second tier" worry? Yes, by framing the waiver as a shield, not a disability.
      *   *Check:* Did I address the property owners? Yes, by recommending their disenfranchisement for consistency. This is bold but necessary for the "principle" requirement.
      *   *Check:* Did I avoid turnout stats? Yes.
      *   *Check:* Is the bottom line clear? Yes.
      *   *Check:* Did I handle the undocumented risk? Yes, via data privacy protocols.

  10. **Final Polish:** Ensure the distinction between the *right* to vote and the *duty* to vote is sharp, as that's the crux of the compulsory voting issue. Ensure the "Circularity" rebuttal is philosophically sound (boundaries of the demos are pre-political or structural, not purely majoritarian).

  *(Self-Correction on Property Owners)*: Disenfranchising current property owners might be legally tricky or politically explosive. However, the prompt asks for a *principle* applied consistently. If the principle is "Residence + Subjection," they don't qualify. I will recommend phasing it out to maintain principled consistency, as requested ("Any principle we adopt should say something about them too").

  *(Self-Correction on Compulsory Voting)*: If I exempt non-citizens from the mandate, is that a "second tier"? The prompt asks to address this. I will argue that true equality requires accounting for unequal vulnerability. Forcing a green card holder to vote carries different federal risks than a citizen. Exemption equalizes the *burden*, even if it differentiates the *rule*.

  Let's write.

  *(Final thought on the "Bottom Line")*: I need to be specific. "Adopt with Conditions."
  Conditions:
  1. Franchise to all residents 16+.
  2. Compulsory voting penalty waived for non-citizens.
  3. Non-resident property owner vote repealed.
  4. Data privacy firewall.
  5. Contingency for state pre-emption.

  Okay, ready to draft.cw
answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission; City Council
  **FROM:** [Your Name], Commissioner
  **DATE:** February 14, 2024
  **SUBJECT:** Recommendation on Municipal Franchise Extension and Compulsory Voting Application

  ### I. BOTTOM LINE RECOMMENDATION

  **Decision:** **Adopt with Conditions.**

  **Recommendation:** Amend the City Charter to extend the municipal franchise to all residents of the city aged sixteen (16) and older, regardless of citizenship or immigration status. Simultaneously, repeal the voting privileges currently granted to non-resident commercial property owners.

  **Conditions & Implementation:**
  1.  **Compulsory Voting:** The civil fine associated with the compulsory voting amendment shall **not** apply to non-citizen residents. They retain the *right* to vote but are exempt from the *duty* (penalty) to vote.
  2.  **Data Privacy:** The City Clerk must establish a statutory firewall prohibiting the use of voter registration data for any federal immigration enforcement purpose. Registration forms must not require citizenship attestation.
  3.  **Timeline:** These amendments shall take effect for the next municipal general election (November 2024).
  4.  **Contingency:** Should the State Legislature pre-empt home-rule authority over the franchise, the City shall immediately establish a "Resident Assembly" for non-citizen residents. This body will hold binding consultative power, requiring City Council supermajority votes to override its recommendations on housing, policing, and education.

  ---

  ### II. GOVERNING PRINCIPLE: RECIPROCAL SUBJECTION

  To resolve the franchise question without relying on empirical turnout data or comparative practice, the Commission must adopt a normative principle that defines the boundaries of the municipal *demos*.

  We recommend the **Principle of Reciprocal Subjection**.

  **Definition:** The legitimate electorate of a home-rule city consists of all individuals who are permanently subject to the city's coercive authority and contribute to its maintenance through residence.

  **Rationale:** Municipal power is distinct from national sovereignty. A city does not control borders or foreign policy; it controls zoning, policing, schools, and code enforcement. Legitimacy in this context derives not from national membership (citizenship), but from local subjection. If an individual is liable to arrest by our police, compelled to comply with our housing codes, and obligated to pay taxes embedded in their rent, they are subject to the city's sovereign will. To deny them the vote is to impose taxation and coercion without representation. To grant them the vote is to acknowledge that the authority we exercise over them requires their consent.

  ---

  ### III. APPLICATION OF PRINCIPLE

  This principle must apply consistently across all affected groups. Inconsistency undermines the legitimacy of the Charter itself.

  **1. Sixteen-Year-Old Residents (Citizen and Non-Citizen)**
  *   **Application:** Enfranchised.
  *   **Reasoning:** They reside within the coercive order. They are subject to curfew laws, police interaction, and the educational policies determined by the city. While their legal capacity is limited in other areas, their subjection to municipal authority is total. The compulsory voting mandate applies (with parental consent protocols), as their residence is established.

  **2. Citizen Residents**
  *   **Application:** Enfranchised and Subject to Compulsory Voting.
  *   **Reasoning:** They meet the threshold of residence and subjection. As full members of the national polity, they bear the full civic duty without legal risk.

  **3. Non-Citizen Residents (Green Card, Visa, Undocumented)**
  *   **Application:** Enfranchised, but Exempt from Compulsory Voting Penalty.
  *   **Reasoning:**
      *   *Franchise:* They satisfy the Principle of Reciprocal Subjection. They pay taxes, use transit, and are subject to police power. Denying them the vote creates a class of subjects without representation.
      *   *Compulsory Voting:* While residence creates a duty to participate, the federal government retains exclusive authority over immigration. Forcing a non-citizen to vote creates a "conscription" risk: it compels an act that could theoretically be scrutinized by federal authorities (even if legally permissible). Exempting them from the fine is not a "second-tier" status; it is an **equalization of burden**. A citizen risks a $50 fine for not voting; an undocumented resident risks deportation proceedings if their registration data is compromised. Waiving the fine acknowledges this unequal vulnerability to ensure the *right* is meaningful.

  **4. Non-Resident Commercial Property Owners**
  *   **Application:** Disenfranchised (Phase-out).
  *   **Reasoning:** Under the Principle of Reciprocal Subjection, this current charter provision is untenable. A property owner living in the suburbs pays property taxes, yes, but they are not *subject* to the city's daily coercive order. They do not send children to our schools, they are not policed by our officers on their commute, and they do not navigate our zoning as residents. Their interest is financial, not political. Allowing them to vote while excluding non-citizen residents inverts the democratic priority: it privileges capital stakeholding over human subjection. Their voting rights in Downtown Improvement District elections should be converted to a non-voting stakeholder advisory role.

  ---

  ### IV. THE CIRCULARITY OBJECTION

  **The Objection:**
  The strongest argument against this recommendation is the **Constitutive Circularity**. A democratic community is defined by its members. Therefore, only current members (the existing electorate) have the right to decide who new members shall be. By expanding the franchise, this Commission is allowing the current "people" to redefine themselves. But if the boundary of the "people" is the very thing in question, the current people have no democratic authority to move that boundary. We are effectively asking the current electorate to vote on whether they should remain the sole arbiters of power.

  **The Rebuttal:**
  This objection conflates *constituted* power with *constitutive* reasoning.
  1.  **Home-Rule Authority:** The City Council and this Commission derive authority from the State Constitution's grant of home rule, not merely from the current electorate's whim. We are acting as a constitutional convention, not a legislature. Our mandate is to ensure the Charter conforms to democratic justice, not merely to reflect current majoritarian preference.
  2.  **Pre-Political Rights:** The right to be free from coercion without representation is pre-political. It exists prior to the ballot. If a group is subject to the law, justice demands they have a hand in making it, regardless of whether the current electorate wishes to share power. To argue otherwise is to claim that a monarchy is legitimate so long as the King refuses to abdicate.
  3.  **Correction, Not Expansion:** We are not "expanding" the people; we are *recognizing* the people who are already here. The subjection exists now; the vote merely acknowledges the reality of our political association.

  ---

  ### V. COMPULSORY VOTING AND NON-CITIZENS

  The Commission has already voted to make voting compulsory with an abstention option. Applying this to non-citizens requires nuance to avoid the "conscription" charge.

  **The Tension:**
  If voting is a duty of residence, non-citizens owe it. If we exempt them, we create two classes of residents. If we enforce it, we risk compelling individuals to engage with a system that could endanger their federal status.

  **The Resolution:**
  We must distinguish between the **Civic Duty** and the **Civil Penalty**.
  *   **Endorsement:** We affirm that non-citizen residents *ought* to vote. It is their civic duty as members of the local community.
  *   **Enforcement:** We waive the civil fine for non-citizens.
  *   **Justification:** This is not an exemption from the *status* of membership, but a protection of the *security* of membership. Because the federal government creates a regime where interaction with election officials can be weaponized (even if unlawfully), the City cannot in good conscience impose a penalty for non-participation. This preserves the principle that voting is a duty of residence, while acknowledging the City lacks the sovereignty to guarantee the safety required to enforce that duty universally.

  ---

  ### VI. CONTINGENCY: STATE PRE-EMPTION

  It is probable that the State Legislature may move to pre-empt home-rule cities from setting their own franchise requirements. If the Charter amendment is voided by state statute:

  1.  **Do Not Retreat:** The City Council must not simply accept the status quo.
  2.  **Establish the Resident Assembly:** Create a statutory body composed of non-citizen residents, selected by sortition (lottery) from city records (utility bills, school enrollment) to bypass voter registration rolls.
  3.  **Binding Consultation:** Grant this Assembly the power to review all ordinances related to policing, housing, and education. The City Council must vote to override the Assembly's recommendations, requiring a 2/3 supermajority.
  4.  **Rationale:** If the State denies us the *formal* franchise, we must institutionalize the *functional* franchise. This ensures the Principle of Reciprocal Subjection is honored in practice, even if the state denies the title.

  ### VII. CONCLUSION

  This recommendation is not based on anticipated turnout or demographic advantage. It is based on the structural integrity of our self-government. A city that polices, taxes, and schools a population without allowing them to vote is not a democracy; it is an administration. By adopting the Principle of Reciprocal Subjection, aligning the compulsory voting mandate with legal reality, and correcting the anomaly of non-resident property voting, we restore the Charter's moral coherence.

  I move that the Commission forward this recommendation to the City Council for inclusion in the March ballot package.
