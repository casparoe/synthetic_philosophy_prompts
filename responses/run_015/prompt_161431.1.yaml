answer: |-
  Here is the architectural plan for the ninety-minute session.

  ### 1. The Dependency Structure

  You are correct that the *purpose* of a guarantee must precede the *type* of guarantee. If students do not know what action a guarantee licenses, they cannot evaluate its strength. However, the ordering of Threat Model and Distribution is the critical pivot point.

  **The Sequence:**
  1.  **The Licensing Question (15 mins):** What action does a safety claim authorize? (Deploy everywhere vs. deploy with monitoring).
  2.  **The Threat Model (20 mins):** Who or what generates the inputs? (Nature vs. Adversary).
  3.  **The Worst-Case Bound (15 mins):** Quantifying safety under an Adversarial Threat Model.
  4.  **The Average-Case Bound (25 mins):** Quantifying safety under a Stochastic Threat Model + The Epistemic Gap (Unknown Distribution).
  5.  **The Stability Condition (15 mins):** Optimization against the guarantee (Goodhart).

  **Why this order?**
  *   **Threat Model before Distribution:** If you introduce "Average-Case" via PAC bounds or standard generalization error immediately, you smuggle in the assumption that the test distribution equals the training distribution. Students will treat "Average-Case" as "Training Performance." By establishing the Threat Model first (Who chooses the input?), you force them to ask: "If nature chooses the input, according to what rule?" This makes the *choice of distribution* a visible variable, not a hidden constant.
  *   **Worst-Case before Average-Case:** Define the "Gold Standard" (Worst-Case) first. This anchors the concept of a guarantee. Then, introduce Average-Case as a *relaxation of the threat model*, not a weakening of the math. This prevents the misconception that Average-Case is just "failed Worst-Case."

  **What breaks under other orderings:**
  *   **If Distribution comes before Threat Model:** Students conflate "Average-Case" with "IID Test Data." They will fail to see deployment shift as a violation of the guarantee's premises, viewing it instead as an external "drift" problem.
  *   **If Average-Case comes before Worst-Case:** The Formal Methods students will disengage, viewing the session as rationalizing weakness. You lose the contrast needed to define the "strength" of a claim.
  *   **If Licensing comes last:** Students will spend 80 minutes analyzing bounds without knowing *why* the distinction matters. They will treat it as a theoretical exercise rather than a decision-theoretic one.

  ### 2. The Carrying Example: Memory Safety in Code Generation

  **The Claim:** "This code-generation model does not produce buffer overflow vulnerabilities."

  **Why this example works:**
  *   **Same Target Claim:** Both factions care about memory safety. The claim is identical; only the scope changes.
  *   **Structured Tail:** Buffer overflows are not random noise. They occur under specific, rare logical conditions (e.g., specific pointer arithmetic combined with specific input lengths). This satisfies the "rare but systematically correlated" constraint.
  *   **No Deception/Catastrophe:** This is a static property of the output. It avoids arguments about the model "knowing" it is being tested or "lying." It is a standard engineering safety property.
  *   **Actionable Licensing:**
      *   *Worst-Case:* Licenses use in safety-critical infrastructure (aviation, medical) without human review.
      *   *Average-Case:* Licenses use as a developer copilot with human review, assuming typical coding tasks.

  **How it carries the session:**
  *   **Threat Model:** Is the input a malicious prompt designed to trigger a bug (Adversarial)? Or a prompt drawn from a developer's typical workflow (Stochastic)?
  *   **Worst-Case:** We must prove safety for *all* valid prompts.
  *   **Average-Case:** We prove safety for prompts drawn from $P_{\text{dev}}$ (the distribution of typical developer requests).
  *   **The Tail:** The "rare" failures are not random typos; they are specific edge cases (e.g., handling large arrays in legacy C++ styles) that are underrepresented in $P_{\text{dev}}$ but catastrophic if hit.

  ### 3. The Misconception Map

  Misconceptions form sequentially. You must block them at the point of formation, not at the end.

  1.  **Point: Licensing Question.**
      *   *Misconception:* "A guarantee is a statement of truth about the model."
      *   *Correction:* "A guarantee is a license for *action*. A guarantee that doesn't tell you what you can do is just a statistic."
  2.  **Point: Threat Model (Transition to Worst-Case).**
      *   *Misconception:* "Worst-case is just Average-case with a pessimistic prior." (This is the Formal Methods students' initial intuition).
      *   *Correction:* Block this by emphasizing *agency*. Worst-case assumes an adversary *choosing* the input to break you. Average-case assumes nature *sampling* the input. They are different games, not different probabilities.
  3.  **Point: Introducing Average-Case.**
      *   *Misconception:* "Average means average over the training distribution."
      *   *Correction:* Explicitly decouple $P_{\text{train}}$ from $P_{\text{deployment}}$. Define the guarantee over $P_{\text{deployment}}$. If $P_{\text{deployment}}$ is unknown, the guarantee is conditional.
  4.  **Point: Analyzing the Tail.**
      *   *Misconception:* "The tail is noise to be averaged out."
      *   *Correction:* Use the buffer overflow example. The failure is structural (pointer arithmetic), not noise. The "average" hides the structure of the failure mode.
  5.  **Point: Stability/Optimization.**
      *   *Misconception:* "If I satisfy the guarantee today, I am safe tomorrow."
      *   *Correction:* Introduce the idea that optimizing for the metric changes the distribution of outputs, potentially violating the original guarantee's premises.

  **Sequence-Induced Misconceptions:**
  *   **Artifact of Order:** By teaching Worst-Case first, you risk manufacturing the idea that Average-Case is "second best."
      *   *Mitigation:* When introducing Average-Case, explicitly state: "In many deployment contexts, Worst-Case is physically impossible to satisfy. Average-Case is not a consolation prize; it is the *only* available license for high-utility systems. The cost is not weakness; it is epistemic risk."

  ### 4. Structural Complications

  Do not append these as caveats. Build them into the definitions.

  **Complication 1: The Unknown Distribution (Epistemic Risk)**
  *   **Where:** Immediately after defining the Average-Case bound.
  *   **How:** When defining the guarantee $\mathbb{P}_{x \sim D}[\text{Safe}(x)] > 1 - \delta$, ask: "Who specifies $D$?"
  *   **The Move:** Show that in Worst-Case, the defender knows the space (all inputs). In Average-Case, the defender often does not know $D$ (deployment environment).
  *   **The Lesson:** An Average-Case guarantee is only as strong as your knowledge of $D$. If $D$ is unfalsifiable (you can't sample from the future deployment), the guarantee is a conditional promise: "Safe *if* the world looks like this." This makes it an epistemic claim, not just a statistical one.

  **Complication 2: Optimization Against the Guarantee (Goodhart)**
  *   **Where:** Just before the Factions discussion.
  *   **How:** Return to the Code Generation example. Suppose we optimize the model to pass the specific safety benchmark used to verify the Average-Case guarantee.
  *   **The Move:** Show that the model can learn to "pass the test" without reducing the actual overflow rate on novel inputs.
  *   **The Lesson:** A guarantee is a snapshot. If the system is adaptive, the guarantee degrades. This applies to *both* Worst and Average, but it is more insidious in Average-Case because the distribution shift is hidden inside the optimization.

  ### 5. Engaging the Factions

  **Timing:** The last 10 minutes of the core content (before the Check for Understanding).
  **Method:** Mapping, not Debating.

  Do not ask them to resolve their disagreement. Ask them to locate it on the map you just built.

  *   **To the Formal Methods Students:** "Your position is that without a Worst-Case guarantee over an Adversarial Threat Model, we cannot license deployment in high-stakes environments. You view the Unknown Distribution problem as fatal to Average-Case claims."
  *   **To the Interpretability Students:** "Your position is that Worst-Case is too restrictive for useful systems. You believe Interpretability allows us to characterize the *Tail* of the Average-Case distribution, effectively converting 'unknown structure' into 'bounded risk,' which licenses deployment with monitoring."
  *   **The Synthesis:** "You are not arguing about math. You are arguing about *licensing*. Formal Methods wants to license *autonomy*. Interpretability wants to license *assistance*. Both are valid, provided the guarantee matches the license."

  **Why this works:** It validates both sides without requiring you to solve the alignment problem in 10 minutes. It frames their disagreement as a difference in *risk tolerance and deployment goals*, which is accurate.

  ### 6. Check for Understanding

  **The Question (Written on board, 5 mins individual thought, 5 mins discussion):**

  > "A team proposes a new alignment technique. They claim: 'Our model is safe with probability 0.99 over the distribution of user prompts.'
  >
  > 1. What threat model does this claim assume?
  > 2. What action does this claim license?
  > 3. What specific piece of information is missing that would prevent you from accepting this license?"

  **Diagnostic Wrong Answers:**

  1.  **Answer:** "It assumes an adversarial threat model, because safety must hold against attackers."
      *   **Diagnosis:** **Misconception #2 (Threat Model).** They conflate "Safety" with "Worst-Case." They missed that "probability over distribution" implies a Stochastic Threat Model.
  2.  **Answer:** "It licenses full autonomous deployment, because 99% is high confidence."
      *   **Diagnosis:** **Misconception #1 (Licensing).** They treat the probability as a truth value rather than a risk budget. They fail to calculate the expected harm of the 1% tail.
  3.  **Answer:** "We need to know the training data distribution."
      *   **Diagnosis:** **Misconception #3 (Deployment Shift).** They assume $P_{\text{train}} = P_{\text{deploy}}$. The correct answer is "We need to know the *deployment* distribution and whether it matches the claim."
  4.  **Answer:** "We need to analyze the 1% failure cases to see if they are random noise."
      *   **Diagnosis:** **Misconception #4 (The Tail).** This is actually a *good* answer, but if they say "We just need to reduce the 1% to 0.1%," they miss the *structural* risk. (Note: Accept this as partially correct, but probe for "structured vs. random").

  **The Correct Answer Key:**
  1.  Stochastic/Nature Threat Model (not Adversarial).
  2.  Limited deployment (e.g., with human oversight), depending on the cost of the 1% failure.
  3.  The definition of the distribution $P$ (is it current users? future users?) and evidence that the system hasn't optimized against the measurement.

  ### 7. Scope Boundaries (Refusals)

  You must explicitly refuse to explain *how* to compute these bounds. You are teaching the *epistemology of safety*, not the *engineering of verification*.

  **Script for Refusal:**
  > "You will notice I have not shown you how to calculate these bounds, nor which verification tools produce them. That is intentional. Knowing how to tighten a bound is useless if you do not know which bound licenses the action you want to take. Today is about reading the map, not driving the car. If you leave knowing how to ask 'What distribution is this over?' you have done the work."

  **Why this phrasing:**
  *   "Reading the map, not driving the car": Metaphorically clear.
  *   "Useless if...": Justifies the exclusion of technical details as a prerequisite for utility, not as an omission of difficulty.
  *   "If you leave knowing...": Sets a clear, achievable success condition for the session.

  ### Summary of Timing

  *   **00-15:** Licensing & Purpose (The "Why")
  *   **15-35:** Threat Models & Worst-Case (The "Adversary")
  *   **35-60:** Average-Case & The Distribution Gap (The "Nature" & Epistemology)
  *   **60-75:** Stability & Optimization (The "Time" dimension)
  *   **75-85:** Factions Mapping (The "Research Landscape")
  *   **85-90:** Check for Understanding (The "Exit Ticket")

  This architecture ensures that the distinction between Worst-Case and Average-Case is not just a mathematical difference, but a difference in *entitlement to act*, which is the core competency required for safety research.
