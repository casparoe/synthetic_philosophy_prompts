  Summary of the exchange:
  Jordan argues anonymous peer review should be replaced, claiming Chesterton's Fence prohibits removing only structures whose purpose is unknown; here, harms are visible. Maya counters with Burkean conservatism, framing peer review as an evolved gift economy solving coordination problems through tacit knowledge. Jordan rebuts that the practice is a mid-twentieth-century invention lacking historical pedigree, accusing Maya of post-hoc rationalization by shifting grounds to social trust. Maya responds that functional survival validates institutional goods even without prospective intent. Jordan concludes by challenging the unfalsifiability of Maya's position, asking for criteria distinguishing healthy traditions from decayed traditions beyond persistence.

  Adjudication of the five moves:
  Jordan's first move is clearly right. Chesterton's Fence mandates understanding a structure's function before removal; if harms are empirically visible and benefits dubious, the fence condition is met. Jordan correctly identifies that knowing the stated purpose fails does not equal ignorance of the actual purpose, validating reform when evidence accumulates. Maya's first response is partially right. While institutions often embed tacit knowledge, characterizing administrative peer review as deep evolutionary wisdom overstretches Burkean analogy. However, crucially, her point about coordination and gift economies highlights genuine systemic functions beyond simple quality control metrics, acknowledging social dynamics and preserving professional norms. Jordan's second move is clearly right. Anonymous peer review is a recent administrative innovation, not a common-law tradition, making appeals to ancestral wisdom historically inaccurate. This undermines the claim that the practice contains generations of selected wisdom, weakening the Burkean defense. Consequently, the historical argument fails completely. Maya's second response is partially mistaken. While retrospective reasoning identifies latent functions, equating survival with value ignores path dependence and power structures that sustain harmful practices. Survival may indicate resilience, not necessarily normative fitness or ethical legitimacy. She correctly notes rationalist limits, but overcorrects by shielding practices from undue critique. Jordan's final move is clearly right. Without independent robust criteria for institutional decay, any persistence becomes self-justifying, rendering the conservative position unfalsifiable and immune to critique. This therefore exposes a logical vulnerability in relying solely on longevity as a metric for value, demanding clearer standards for future evaluation and reform.

  What's missing from both sides:
  Both parties overlook pragmatic institutionalism, which balances rational critique with respect for systemic complexity. Jordan treats peer review as merely instrumental, ignoring how unpaid labor sustains the broader academic gift economy and prevents market-driven publication biases. Maya treats the practice as sacrosanct, neglecting how power dynamics within the profession can corrupt tacit knowledge into exclusionary mechanisms. A true middle path requires experimental reform: piloting signed or compensated models in specific subfields to gather data rather than demanding total abolition or absolute preservation. This approach acknowledges that institutions can be both functionally useful and morally flawed simultaneously. It rejects the dichotomy between radical redesign and uncritical tradition, favoring iterative adjustment based on empirical outcomes. Neither party adequately addresses how to transition systems without collapsing the trust Maya values or perpetuating the harms Jordan identifies. A principled criterion for decay involves measuring whether an institution still serves its community's flourishing, not merely its own persistence.

  Overall verdict and weakest link:
  Jordan is more right because the burden of justification lies with those maintaining harmful structures. Jordan demonstrates Chesterton's Fence does not apply to recent, harmful administrative inventions, and exposes the unfalsifiability of Maya's defense. However, Jordan's reasoning contains a weak link: the assumption that a compensated system would not introduce market distortions worse than biases. Jordan critiques the status quo but offers insufficient evidence that payment solves the coordination problem without commodifying judgment. While Jordan wins the debate, the practical proposal lacks rigor, risking unintended consequences undermining quality.
