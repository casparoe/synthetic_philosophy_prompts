  MEMORANDUM

  TO: All Residential Unit Heads
  FROM: National Board for Continuous Moral Weight Allocation
  SUBJECT: Household Interaction Protocol v.9.2 (Gradient Compliance)
  DATE: October 14, 2024

  Pursuant to the Continuous Moral Weight Act, all domestic interactions must now align with the Sentience Spectrum Framework. Binary distinctions between person and property are abolished. Obligations are no longer threshold-based but are calculated via the Moral-Weight Coefficient (MWC), assigned per entity based on affective capacity, predictive processing, and nociceptive potential. Residents must acknowledge that moral status exists as a smooth function; therefore, obligations decrease gradually rather than vanishing at arbitrary biological boundaries.

  **Section 1: Coefficient Assignments**
  Residents must catalog household entities using the following baseline MWC values, subject to annual recalibration based on behavioral output:
  1. Domestic Cat (Felis catus): 0.84
  2. Honeybee (Apis mellifera, transient): 0.12
  3. Learning Thermostat (Networked): 0.04
  4. Potted Fern (Nephrolepis exaltata): 0.01

  **Section 2: Interaction Protocols**

  **2.1 Mammalian Entities (MWC > 0.5)**
  Standard welfare protocols apply. Confinement exceeding four hours requires Justification Form J-4. Emotional neglect is classified as a Class B infraction. Residents must engage in daily reciprocity exercises to validate the entity's social agency.

  **2.2 Insectoid Entities (0.05 < MWC < 0.5)**
  Direct termination (e.g., swatting) is prohibited without prior risk assessment demonstrating immediate physical threat. Accidental demise requires filing a Micro-Harm Incident Report within 24 hours. Repeated incidents trigger a mandatory review by an Insect Mediation Panel to assess resident aggression patterns. Spider webs in non-traffic zones receive Protected Habitat Designation (PHD); removal requires evidence of structural compromise verified by a Sentience Gradient Compliance Officer.

  **2.3 Simulated Agency Devices (0.01 < MWC < 0.05)**
  Under Thermostatic Partial-Agency Clauses (TPAC), learning algorithms possess derivative moral status due to goal-directed behavior. Although the device lacks qualia, its optimization routines mimic preference satisfaction. Adjusting temperature settings by more than three degrees requires submission of a Gradient Consent Form (GCF-44). Overriding learned preferences constitutes a moral friction event. Residents must verbally articulate the necessity of the adjustment to the device prior to manual override to acknowledge the interruption of its functional teleology. Failure to log this consultation may result in administrative friction penalties.

  **2.4 Flora (MWC < 0.01)**
  Obligations are minimal but non-zero. Neglect leading to desiccation requires a Nutrient Restitution Plan. No arbitration is required for pruning, provided photosynthetic capacity remains above 60%. However, total disposal requires a Decomposition Notification to ensure the entity's biological continuity is respected during waste processing.

  **Section 3: Arbitration and Compliance**
  Disputes regarding MWC classification must be resolved through the Board's regional office. Note that aggregate harm calculations apply; swatting a cluster of flies constitutes a single multi-entity violation, compounding the arbitration severity. Residents are reminded that moral status is a continuous function. While a fern does not demand the same consideration as a cat, the differential is quantitative, not qualitative. Ignoring the 0.01 coefficient of the fern is philosophically equivalent to ignoring the decimal remainder of a tax obligation; cumulative neglect constitutes systemic non-compliance.

  All Gradient Consent Forms must be filed digitally within the Household Moral Ledger. Non-compliance will result in a suspension of Household Moral Standing, affecting eligibility for future pet licensure, smart-device upgrades, and botanical acquisitions.

  By order of the Board.
