      *   Actually, looking closely: (1) is the general claim. (3) is the specific application to inaccessible domains. If (3) is the problem, weakening (3) saves (1) for the general case (Galileo) while admitting limits for the specific case (Black Holes). This is a good strategic move.

      *   *Wait, check (1) vs (2) again.* If (2) says authority is *entirely* from the *existing framework*, can (1) claim knowledge of *physical structures*? If the framework is wrong, the knowledge is wrong. But (2) doesn't say the framework is true, just that it's the source of authority. The tension is: How does reasoning about concepts tell us about physics? This is the "Norton vs. Brown" debate territory. I should flag this as a foundational tension but note that (3)/(4)/(5) create a more immediate logical contradiction. The (3)/(4) clash is a direct contradiction (A vs Not-A). The (1)/(2) clash is an explanatory gap. Contradictions are more severe than gaps.

      *   *Decision:* Rank (3) vs (4) as Severity 1. (3) vs (5) as Severity 2. (1) vs (2) as Severity 3.
