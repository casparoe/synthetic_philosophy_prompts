answer: |-
  ### 1. The Cases: Hold and Cold

  **Hold**
  Agent is a shift technician in a decompression chamber. A high-pressure differential exists between the inner lock (where Victim is working) and the outer vacuum. The automatic seal has failed; the only thing keeping the inner door shut is a manual override lever that requires continuous downward pressure to maintain the seal. Agent has been holding this lever down for the past ten minutes while Victim worked. Agent hates Victim and wants them dead. At the critical moment, Agent deliberately relaxes their arm, lifting the lever. The seal breaks, the air rushes out, and Victim is sucked into the vacuum and dies.

  **Cold**
  Agent is a shift technician in a decompression chamber. A high-pressure differential exists between the inner lock (where Victim is working) and the outer vacuum. The automatic seal is functioning and holding the door shut without manual intervention; the manual override lever is in the neutral 'up' position and requires no pressure. Agent hates Victim and wants them dead. At the critical moment, the automatic seal fails spontaneously due to mechanical wear. To maintain the seal, Agent would need to grab the lever and pull it down immediately. Agent, standing with arms at their sides, deliberately does not move. The seal breaks, the air rushes out, and Victim is sucked into the vacuum and dies.

  ### 2. Specification Check

  Here is how the pair secures the held-fixed features, and where the tensions lie:

  *   **Same Victim/Death:** Identical. In both, Victim dies of decompression in the same chamber.
  *   **Same Causal Route:** Identical. Seal fails $\rightarrow$ Pressure equalizes $\rightarrow$ Victim ejected. The physics of the death sequence is invariant.
  *   **Same Time/Effort/Skill:** Secured. In *Hold*, maintaining the seal requires 5kg of downward force for 10 seconds. In *Cold*, engaging the seal requires 5kg of downward force for 10 seconds. The physical cost of *saving* the victim is identical.
  *   **Same Certainty/Motives:** Secured. In both, Agent knows death is certain if they don't act (or stop acting), and acts specifically to ensure death.
  *   **Same Institutional Role:** Secured. Agent is the shift technician in both, responsible for chamber safety.
  *   **Same Prior Relationship to Threat:** Secured, but tightly. The threat is the pressure differential. In neither case did the Agent create the vacuum or the pressure. The threat exists independently of the Agent in both scenarios.
  *   **Same Alternatives:** *Potential Fudge.* In *Hold*, the alternative is "continue holding." In *Cold*, the alternative is "start holding." While the *outcome* of the alternative is identical (seal holds), the *action* differs. I have assumed for the purpose of this seminar that "sustaining safety" is the relevant alternative in both, treating the physical difference as the variable to be tested rather than a confound.
  *   **The Collision:** The feature "Same prior relationship to whatever threatens the victim" is the stress point. In *Hold*, the Agent is *already interacting* with the threat-mitigation system at T-1. In *Cold*, they are not. This is unavoidable given your spec (Body Sustaining vs. Body at Rest). If the Agent is sustaining safety, they are by definition already related to the mitigation. I have interpreted "relationship to threat" as "relationship to the *source* of danger" (the vacuum), not the *prevention* of danger. If your students conflate the threat with the safety mechanism, this pair will fail.

  ### 3. Theory Application

  Here is how the four standard accounts verdict the pair:

  *   **(a) The Causal Account (Doing = Causing harm):**
      *   **Hold:** Split. Releasing the lever is a positive cause of the seal breaking. The Agent's change in state initiates the fatal sequence. Verdict: **Doing/Killing.**
      *   **Cold:** Split. The mechanical failure causes the breach; the Agent's stillness is merely a background condition. Verdict: **Allowing/Letting Die.**
  *   **(b) The Threat Account (Doing = Introducing a threat):**
      *   **Hold:** Split. The Victim was safe from the vacuum *because of the Agent*. By removing their body, the Agent introduces the threat of the vacuum to a Victim who otherwise would have remained safe. Verdict: **Doing/Killing.**
      *   **Cold:** Split. The Victim was safe because of the *machine*. The threat arises from the machine's failure, not the Agent. The Agent fails to remove a threat that arose independently. Verdict: **Allowing/Letting Die.**
  *   **(c) The Bodily-Movement Account (Doing = Willed muscle contraction):**
      *   **Hold:** Split. Relaxing the arm involves a specific change in muscle tension (antagonistic muscle activation to lift the weight). It is a movement. Verdict: **Doing.**
      *   **Cold:** Split. Standing still involves maintaining tonic posture but no new willed movement toward the lever. It is an omission. Verdict: **Allowing.**
      *   *(Note: A sophisticated movement theorist might argue relaxation is not an 'act', but standard versions count limb movement as doing.)*
  *   **(d) The Normative Account (Doing/Allowing depends on Duty):**
      *   **Hold:** **Same.** The Agent had a duty to maintain the seal. They violated it.
      *   **Cold:** **Same.** The Agent had a duty to engage the manual override upon failure. They violated it.
      *   **Verdict:** This account refuses to split the cases. Both are equally wrongful breaches of the same professional duty. The distinction collapses.

  ### 4. Feature Analysis

  The single feature doing the work is the **Baseline of Physical Interaction**.

  In *Hold*, the Agent's body is part of the safety system's *status quo*. In *Cold*, the Agent's body is external to the safety system's *status quo*.

  If you delete this feature (i.e., if you tell students to ignore whether the Agent was touching the lever at T-1), the pair collapses back into a standard **Smith-and-Jones** contrast. Without the baseline information, both cases look like: "Agent present, safety fails, Agent doesn't ensure safety, Victim dies." The intuition that *Hold* is worse (if it exists) relies entirely on the perception that the Agent *broke* a existing chain of safety in *Hold*, whereas they *failed to start* a chain in *Cold*.

  However, something survives: the **interruption of a process**. In *Hold*, there is an ongoing process (holding) that is interrupted. In *Cold*, there is no ongoing process to interrupt. If the Doing/Allowing distinction has any metaphysical bite, it must be here: that interrupting a causal chain one is sustaining is fundamentally different from not initiating a causal chain one is not sustaining.

  ### 5. The Objection and Defense

  The account that looks worst here is the **Bodily-Movement Account**. It seems most vulnerable to the charge that the distinction is physically arbitrary.

  **The Objection:**
  "The description of 'movement' is gerrymandered. In *Hold*, you describe the agent as 'lifting the lever.' But they could equally be described as 'ceasing to push down.' In *Cold*, they are 'standing still,' but they could be described as 'maintaining posture rather than reaching.' If you swap the descriptions, the verdict flips. The physics is just particles moving; 'act' vs. 'omission' is a linguistic overlay, not a fact of the matter."

  **The Defender's Reply:**
  "Muscle physiology is not description-relative. In *Hold*, the motor neurons fire to change the arm's position against gravity. In *Cold*, they fire to maintain static equilibrium. There is a measurable metabolic and neurological difference between a transition state and a steady state. The distinction tracks real biological energy expenditure, not just language."

  **The Cost:**
  This move saves the theory but costs them the **Description-Swap Test**. If the moral status of the action depends on whether the muscles are transitioning or static, then morality hinges on arbitrary baselines. If the Agent in *Cold* had been leaning on the lever idly (not to hold it, just resting) and the weight of their arm happened to hold it, and then they stood up, they switch from *Cold* (Allowing) to *Hold* (Doing) without changing their intention or the outcome. The Bodily-Movement account must admit that an agent's moral liability changes based on where they happened to place their hand 30 seconds prior, which seems morally irrelevant.

  ### Contextual Add-ons

  **The Description-Swap Test**
  Your hobby-horse is correct: the distinction is hostage to description. If we redescribe *Hold* as "The Agent allowed the lever to rise" (focusing on the release of pressure rather than the lifting motion), the intuition of "Doing" weakens. If we redescribe *Cold* as "The Agent kept their body away from the lever" (focusing on the active maintenance of distance), the intuition of "Allowing" weakens.
  *Verdict:* The Doing/Allowing distinction does **not** survive this test robustly. It functions as a heuristic for causal salience, not a metaphysical boundary. If you run this in class, ask students: "If the Agent in *Hold* was paralyzed and the lever slipped from their numb hand, is it still a Doing?" If they say "No," then the distinction relies on *control*, not movement. If they say "Yes," then it relies on *physics*. They can't have both.

  **Killing vs. Letting Die**
  In this pair, **Doing/Allowing** and **Killing/Letting Die** come apart.
  *   **Hold** is intuitively **Killing** (Active intervention).
  *   **Cold** is intuitively **Letting Die** (Passive failure).
  *   *However*, under the **Normative Account**, both are **Killing**. In legal and professional contexts (like the technician role specified), a gross breach of duty that results in death is often classified as homicide (e.g., gross negligence manslaughter), regardless of bodily movement.
  *   *Separation:* The case that does the separating is **Cold**. It is clearly *Allowing* (by the Movement and Causal accounts) but can be classified as *Killing* (by the Normative account). This proves to your students that "Killing" is often a normative label we paste onto "Allowing" when the duty is strong enough, rather than a description of the physical act.
