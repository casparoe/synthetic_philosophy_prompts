answer: |-
  This is a razor-sharp observation. You have put your finger on the exact seam where the political economy of healthcare meets the moral philosophy of intimacy. You aren't just describing a budget; you are describing a **moral technology** that allows the budget to function without appearing brutal.

  To answer your bottom-line question first: You are describing a budget that *requires* an implicit theory of care to operate. Without the philosophical scaffolding, the arrangement is too visibly exploitative to sustain social legitimacy. The "relationship talk" is not merely post-hoc decoration; it is the load-bearing wall that keeps the cost-shifting from collapsing.

  Here is a read on your four points, drawing from care ethics, economic sociology, and feminist political economy.

  ### 1. What does this arrangement presuppose about care?

  It commits you to a **segregated ontology of labor**. It presupposes that there are two distinct categories of human activity that happen to look physically identical (e.g., injecting insulin) but are metaphysically different based on the *source of motivation*.

  *   **The "Gift" Sphere (Family):** Here, care is an expression of identity and relationship. The value is constituted by the "for-free-ness" of it. If you pay the daughter, you shift the act from the sphere of *virtue* to the sphere of *contract*. In this view, the competence is derived from love (motivation), not certification (skill).
  *   **The "Market" Sphere (Aides):** Here, care is a service transaction. The value is constituted by efficiency and compliance. The competence is derived from regulation, not relationship.

  This is Viviana Zelizer's territory (*The Purchase of Intimacy*). The hospital is relying on a cultural boundary that says "money corrupts intimacy." By keeping the daughter unpaid, they preserve the "sacred" nature of her labor, which conveniently makes it ineligible for wages.

  However, from a critical med soc perspective, this is also **extractive**. It presupposes that the "private" sphere (the family) is a resource reservoir that the "public" sphere (the hospital) can tap without reciprocation. It treats the family not as a stakeholder, but as infrastructure.

  ### 2. Which parts require the relational view vs. being underdetermined?

  A strict "care is labor" theorist could endorse family-first on pragmatic grounds (continuity, comfort, reliability), **but they could not endorse the *unpaid* nature of the skilled work.**

  *   **Underdetermined:** *Who* does the care. A labor theorist might agree that a daughter is the best person to flush a line because she is already there and invested.
  *   **Requires Relational View:** *Why* she does it for free. If care is just labor, then 20 minutes of training does not certify competence, and doing the work without pay is wage theft. To justify the *lack of pay* and the *lack of protection*, you must invoke the "duty of love." You have to argue that her obligation is moral, not contractual.
  *   **The "Legibility" Point:** You mentioned the aide is barred from skilled tasks. A labor theorist would ask: Why? If the aide is trained and certified, why is the barbed wire around those tasks? The answer is liability and billing codes (Medicare/Medicaid reimbursement structures), not safety. The system is designed to maximize billable hours for the agency (bathing visits) while offloading non-billable clinical risk to the family.

  So, the "free" part strictly requires the relational/metaphysical view. The "family-first" part does not, but the "family-first-and-free" part does.

  ### 3. Is the third thing (the incoherence) actually incoherent?

  You asked if there is one view of care that generates all three, or if the hospital is running two incompatible theories.

  It is **strategically incoherent**. It relies on switching moral frameworks depending on which direction the money is flowing.

  *   **When the hospital saves money (Family does skilled work):** They use the **Care Ethics** framework. "This is special because it's love. We trust you because you are kin."
  *   **When the hospital spends money (Aides do unskilled work):** They use the **Neoliberal/Contract** framework. "This is a service. We must limit liability. We pay for time, not outcomes."
  *   **When the state offers money (Medicaid waiver for family):** They revert to the **Care Ethics** framework to block it. "Paying her ruins the love."

  **The Unifying View:** The unifying theory isn't about care; it's about **liability and cost containment**.
  The hospital treats the family member as a **clinical asset** (capable of skilled work) but a **legal non-entity** (no employment status).
  They treat the paid aide as a **legal entity** (employee/contractor) but a **clinical liability** (restricted scope).

  The incoherence you feel is the friction of trying to treat a human being as both a moral agent (who owes duty) and an economic unit (who provides labor) simultaneously, but only selecting the category that benefits the institution at any given moment. It's not a bug; it's a feature. It allows the institution to claim the *reliability* of the market (the aide shows up for a wage) and the *flexibility* of the family (the daughter stays late for free), without the *costs* of either (benefits or wages).

  ### 4. What would a Care-Ethics discharge plan actually look like?

  If you took Tronto, Kittay, or Held seriously, the "private/public" split dissolves. Care is a public good because dependency is a universal human condition. Here is where that view bites concretely:

  1.  **Formalization of the Informal:** If the daughter is doing sterile dressing changes, she is a **Unlicensed Assistive Personnel with Specialized Training**. She must be:
      *   Paid (at least minimum wage, ideally a skilled rate).
      *   Covered by worker's comp (what if she sticks herself with the needle?).
      *   Given a formal scope of practice (not a 20-minute teach-back, but a competency sign-off).
  2.  **Caregiver Standing:** The "named person" cannot just be a contact for logistics. They must have **proxy status in clinical decision-making** that is recognized formally, not just as "next of kin." They are part of the care team.
  3.  **Caps and Relief:** Care ethics emphasizes the vulnerability of the *caregiver* as well as the cared-for. A care-ethics discharge plan would include **mandatory respite**. You cannot discharge a patient if the caregiver is at risk of burnout. The state/hospital must provide relief care, not just training.
  4.  **Decoupling Skill from Setting:** If a task is "skilled nursing," it should remain the responsibility of the nursing profession regardless of location. If it is offloaded to the home, the *support* for that skill moves too. The hospital remains liable for the outcome of the dressing change even after discharge if they mandated the family do it.
  5.  **The Right to Refuse:** Crucially, a care-ethics model acknowledges power. The family must have the **right to say no** without the patient being held hostage in the ward. If the daughter says "I cannot do this," the system must provide the skilled labor, not frame it as a "family drama."

  ### The Write-Up

  For your dissertation, I would argue you are witnessing **the privatization of risk through the sacralization of labor.**

  The hospital is not just shifting costs; it is shifting *ontological categories*. By defining the daughter's work as "love," they render it invisible to the economic metrics that would protect her. By defining the aide's work as "service," they render it visible to the economic metrics that restrict them.

  You are describing a system that relies on **moral pluralism** to evade accountability. It's not that they have no theory of care; it's that they have a *situational* theory of care that changes to match the ledger.

  **Recommendation:** Look at Eva Feder Kittay's concept of "doulia" (the obligation of society to support the caregiver) and Viviana Zelizer's work on "earmarking" money. Also, Arlie Hochschild's *The Outsourced Self* is relevant for the marketization of intimacy.

  You're right to be troubled. This isn't just bureaucracy; it's the active production of a specific kind of subject: the **citizen-caregiver** who is clinically competent but legally nonexistent. That is a profound anthropological finding.
