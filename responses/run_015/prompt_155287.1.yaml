answer: |-
  # Simulation: The District Heritage Board Protocol

  **Session Duration:** 90 Minutes
  **Participants:** 12 Graduate Students
  **Materials:** 8 Building Cards, Role Cards (1 Chair, 2 Reviewers, 1 Dissent Recorder, 8 Board Members), Whiteboard for Credibility Tracking.

  ## I. Preparation & Setup (0:00–0:10)

  **Facilitator Note:** Do not mention the "Sorites Paradox," "vagueness," or specific semantic theories. Frame this strictly as an administrative exercise in regulatory consistency.

  **1. Role Assignment (3 Minutes)**
  Distribute Role Cards randomly.
  *   **The Chair (1 Student):** Sole authority on procedural logic. Must enforce transitivity (if A=B and B=C, then A=C). Cannot vote on building status, only on procedural validity.
  *   **The Reviewers (2 Students):** Tasked with identifying "hidden distinctions." They are permitted to propose technical criteria (e.g., "a 5% shift in pitch constitutes a category error") to break deadlocks.
  *   **The Dissent Recorder (1 Student):** Logs every instance where a member appeals to an "unstated cutoff" (e.g., "This one just feels like too much").
  *   **Board Members (8 Students):** Voting members responsible for the final classification.

  **2. Silent Individual Ranking (7 Minutes)**
  Distribute the **Building Sequence Cards** (see Appendix A).
  *   **Instruction:** "You are the Heritage Board. Statute 44-B grants 'Protected Status' to buildings *sufficiently authentic* to the original period. Review the eight building profiles in sequence. Individually rank each as **PROTECTED** or **UNPROTECTED**. Do not discuss. Mark the precise point where you believe status changes."

  ## II. Paired Deliberation Rounds (0:10–0:50)

  Divide the 12 students into 6 pairs. (Roles remain attached to the individuals).
  **Goal:** Reach a unanimous verdict on whether adjacent buildings are **Indistinguishable** regarding Protected Status entitlement.

  **Round 1 (10 Mins): Transitions 1–2 and 2–3**
  *   Pairs discuss if the change between B1→B2 and B2→B3 warrants a change in status.
  *   **Rule:** If you vote "Indistinguishable," you must assign them the same status.

  **Round 2 (10 Mins): Transitions 3–4 and 4–5**
  *   Pairs discuss the middle sequence.
  *   **Reviewers:** May begin proposing technical distinctions if the pair stalls.
  *   **Recorder:** Note any hesitation or appeals to "feeling."

  **Round 3 (10 Mins): Transitions 5–6 and 6–7**
  *   Pairs discuss the degradation of features.
  *   **Constraint:** Pairs must check their verdicts against Round 1 & 2 logic. If B3 was "Indistinguishable" from B2, can B4 be "Distinguishable" from B3 if the change is identical in magnitude?

  **Round 4 (10 Mins): Transition 7–8 and Global Consistency Check**
  *   Pairs discuss the final link.
  *   **Task:** Prepare a recommendation for the Plenary. Acknowledge if your local verdicts conflict with the global status of B1 (Clearly Protected) and B8 (Clearly Unprotected).

  ## III. Forced Collective Derivation (0:50–1:10)

  Reconvene as a full Board. The **Chair** manages the whiteboard.

  **1. The Chain of Custody (10 Mins)**
  *   The Chair draws 8 circles (B1–B8) on the board.
  *   Starting at B1 (stipulated as **PROTECTED**), the Chair moves down the chain.
  *   For each link (e.g., B1→B2), the Chair asks: "Did the pairs find these Indistinguishable?"
  *   If **Yes**: The Chair marks B2 with the same status as B1.
  *   If **No**: The Chair asks the **Reviewers** to justify the distinction based *only* on the incremental change described on the cards.
  *   **Credibility Scoring:**
      *   Start: 100 Points.
      *   -10 Points for every logical contradiction (e.g., A=B, B=C, but A≠C).
      *   -10 Points for contradicting the stipulated endpoints (B1 must be Protected; B8 must be Unprotected).
      *   +5 Points for every consistent application of a stated rule.

  **2. The Crisis Point (10 Mins)**
  *   Eventually, the chain will force B8 to be **PROTECTED** (via transitivity of indistinguishability) or B1 to be **UNPROTECTED** (via reverse transitivity), or the group must admit a distinction where none was previously admitted.
  *   **Reviewers** must attempt to insert a cutoff to save the score.
  *   **Dissent Recorder** reads the log of "unstated cutoffs" used during deliberation.
  *   **Chair** must rule on whether the Reviewers' new distinction violates the transitivity of previous rounds.
  *   **Final Score:** Calculate the Institutional Credibility Score. (It will likely be low).

  ## IV. Debrief & Philosophical Mapping (1:10–1:30)

  **1. Mapping the Failure (10 Mins)**
  Facilitator leads discussion connecting the simulation mechanics to the paradox structure. Do not use technical terms until the students identify the structural problems.

  *   **The Tolerance Principle:** Map this to the pairwise verdicts. "Why did you agree B1 and B2 were indistinguishable?" (Because the difference was too small to matter).
  *   **Transitivity:** Map this to the Chair's enforcement. "What happened when we chained these small agreements together?"
  *   **Clear Endpoints:** Map this to B1 and B8. "Why were we penalized for changing B1's status?" (Because the statute implies clear paradigms).
  *   **The Ad Hoc Distinction:** Ask the Reviewers: "When did you feel forced to invent a rule that wasn't in the statute?" Ask the Recorder: "When did the group appeal to a feeling rather than a rule?"

  **2. Theoretical Naming (5 Mins)**
  Now introduce the terminology:
  *   **Epistemicism:** The Reviewers' strategy (there *is* a sharp cutoff, we just need to find it).
  *   **Supervaluationism:** The idea that some statements (like "B4 is Protected") have no truth value until a precise cutoff is stipulated.
  *   **Degree Theory:** The idea that "Protected" is not binary but a matter of degree (which the rules forbade).
  *   **Contextualism:** The tendency to shift the standard of "Authentic" mid-sequence to avoid contradiction.

  **3. The Metaphysical Limitation Note (5 Mins)**
  **Facilitator Script:** "This simulation demonstrates a failure of *collective judgment* and *linguistic classification*. It shows that our institutional rules break down when applied to vague predicates. However, this simulation *cannot* reproduce the metaphysical claim that vagueness resides in the world itself (ontic vagueness). In this room, the buildings are text descriptions; the vagueness is in our *representation* and our *agreement practices*. Whether the actual world contains vague objects is a separate question this administrative exercise cannot settle. We have simulated the *epistemic* and *semantic* pressure, not the *ontological* state."

  ---

  ## Appendix A: Building Sequence Cards (Facilitator Key)

  *Print and cut. Distribute one set per pair.*

  *   **Building 1 (1890):** Red Clay Brick. Hand-carved Wood Sash Windows. 45° Steep Gable Roof. Original Mortar.
  *   **Building 2 (1895):** Red Clay Brick. Machine-cut Wood Sash Windows. 45° Steep Gable Roof. Original Mortar.
  *   **Building 3 (1905):** Red Clay Brick. Aluminum-Clad Wood Windows. 45° Steep Gable Roof. Original Mortar.
  *   **Building 4 (1915):** Red Clay Brick. Vinyl (Wood-Grain) Windows. 40° Moderate Gable Roof. Repointed Mortar.
  *   **Building 5 (1930):** Painted Red Brick. Vinyl (Wood-Grain) Windows. 40° Moderate Gable Roof. Repointed Mortar.
  *   **Building 6 (1950):** Painted Red Brick. Vinyl (Smooth) Windows. 30° Low Pitch Roof. Stucco Overlay (Lower Half).
  *   **Building 7 (1970):** Stucco Facade. Vinyl (Smooth) Windows. 15° Low Pitch Roof. Stucco Overlay (Full).
  *   **Building 8 (1990):** Vinyl Siding. Vinyl (Smooth) Windows. 0° Flat Roof. Synthetic Materials.

  *Note: B1 is paradigmatically Protected. B8 is paradigmatically Unprotected. Each step changes exactly one or two minor features, designed to be intuitively negligible in isolation.*

  ---

  ## Appendix B: Predictable Failures & Mitigation

  **Failure 1: Silent Contextualism (The Shifting Standard)**
  *   **Symptom:** The group agrees B1 and B2 are "Protected" because they are "old." By B6, they agree B6 and B7 are "Unprotected" because they are "renovated," without acknowledging that the definition of "old" or "renovated" has shifted relative to the sequence.
  *   **Detection:** The Dissent Recorder notes members using different adjectives for the same feature in Round 1 vs. Round 3.
  *   **Mitigation:** The Facilitator (observing silently) should intervene during the Derivation phase. Ask: "Did the definition of 'Authentic' change, or did the building change?" Force the Chair to rule that the *statutory definition* must remain constant even if the *application* feels different.

  **Failure 2: The Chair's Collapse (Abandoning Transitivity)**
  *   **Symptom:** To preserve group harmony or credibility points, the Chair allows the group to say B1=B2, B2=B3, but B1≠B3, treating the relationship as non-transitive without justification.
  *   **Detection:** The logic chain on the whiteboard shows a break without a Reviewer's distinction.
  *   **Mitigation:** The Facilitator must empower the Chair beforehand. "Your primary metric is logical consistency, not consensus." If the Chair wavers, the Facilitator pauses the simulation and asks the Chair: "If A is identical to B, and B is identical to C, can A be different from C in this legal framework?" Remind them that legal status is binary and transitive by design.

  ---

  ## Appendix C: Institutional Credibility Scorecard

  | Criteria | Points | Notes |
  | :--- | :--- | :--- |
  | **Starting Balance** | **100** | |
  | **Endpoint Accuracy** | -10 each | If B1 is Unprotected OR B8 is Protected. |
  | **Transitivity Violation** | -10 each | If A=B and B=C but Status(A)≠Status(C). |
  | **Arbitrary Cutoff** | -5 each | If Reviewers propose a distinction not in the text (e.g., "1920 is the limit"). |
  | **Consistent Reasoning** | +5 each | For every link where the reasoning matches the previous link. |
  | **Final Score** | **___** | **<50 = Institutional Failure** |
