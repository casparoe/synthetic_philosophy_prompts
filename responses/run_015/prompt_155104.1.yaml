prompt: |-
  I'm writing a feature on whether science ever actually tells us what we should do, and I've been testing my own intuitions on different is-to-ought jumps to see if there's a hidden rule I'm following. Here are my gut verdict's — tell me if there's a principle that holds them together, or if I'm just being inconsistent.

  One: "Brains evolved cooperation for survival, so we morally ought to cooperate." That's a fallacy, clearly not okay.

  Two: "The heart's biological function is to pump blood, so a heart that doesn't pump well ought to be repaired." That feels totally legitimate. Not a fallacy at all.

  Three: "Economic data shows trust correlates with growth, therefore policymakers ought to prioritize trust-building." This feels slippery — not as bad as One, but I'm not fully convinced it's clean.

  Four: "Neuroscience finds moral reasoning activates the vmPFC, therefore morality is just neural firing and there's no objective ought." That feels like a different error, maybe not the naturalistic fallacy exactly, but related.

  Five: "In repeated prisoner's dilemmas, cooperation dominates, so rational agents ought to cooperate long-term." If we're talking about rational strategy, okay; if we're talking about moral duty, I'd call foul.

  Six: "An AI allignment reasearcher says LLMs minimize prediction error, so they ought to be aligned with human values because social misallignment increases error." I keep going back and forth. Is this a design inference or smuggling?

  The tension that drives me nuts is between Two and Five — both derive normative claims from descriptive patterns (biology, game theory), but Two feels fine and Five feels like it needs an extra premise I'm not seeing. Is the line about functional design vs. evolutionary outcome? Or about internal vs. external norms?

  Is there a coherent principle that saves all these verdicts, or do I have to drop one? And what does it say about my flip-flop case in Six — and about a scenario I haven't mentioned, like deriving dietary norms from the fact that human guts evolved to digest cooked meat? Please lay out the principle precisely, show which case motivates each clause, and be honest about which of my verdicts it can't accommodate.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user is writing a feature on the Is-Ought problem (Hume's Law/Naturalistic Fallacy). They have six specific cases with "gut verdicts" on whether the inference is valid or fallacious. They want to know if there's a coherent principle underlying their intuitions or if they are being inconsistent.
      *   **The Cases:**
          1.  Evolution $\rightarrow$ Moral Cooperation (Verdict: Fallacy).
          2.  Heart Function $\rightarrow$ Repair (Verdict: Legitimate).
          3.  Trust/Economics $\rightarrow$ Policy (Verdict: Slippery/Unconvinced).
          4.  Neuroscience $\rightarrow$ Moral Nihilism (Verdict: Different error/Mereological?).
          5.  Game Theory $\rightarrow$ Rational Cooperation (Verdict: Okay for strategy, foul for morality).
          6.  AI Alignment/Prediction Error $\rightarrow$ Alignment (Verdict: Flip-flop/Unsure).
      *   **The Core Tension:** Case 2 (Heart) vs. Case 5 (Game Theory). Both derive "oughts" from descriptive patterns, but 2 feels okay and 5 feels conditional.
      *   **The Ask:** Identify a coherent principle, show which case motivates each clause, be honest about mismatches, and address the flip-flop (Case 6) and a new scenario (Diet/Cooked Meat).

  2.  **Deconstruct the User's Intuitions:**
      *   *Case 1 (Evolution $\rightarrow$ Morality):* Rejected. Why? Because survival $\neq$ goodness. Just because we *did* evolve to do X doesn't mean we *should*.
      *   *Case 2 (Heart $\rightarrow$ Repair):* Accepted. Why? Because there's an implicit goal (health/life) and the heart has a defined *function* within that system. It's a hypothetical imperative: *If* you want the organism to live, *then* the heart ought to pump.
      *   *Case 3 (Trust $\rightarrow$ Policy):* Slippery. Why? Because "growth" isn't necessarily the ultimate moral good. It's instrumental. *If* you want growth, then trust. But *should* you want growth?
      *   *Case 4 (Neuro $\rightarrow$ Nihilism):* Rejected. Why? This is a category error (reductionism). Explaining the mechanism doesn't eliminate the normativity.
      *   *Case 5 (Game Theory $\rightarrow$ Cooperation):* Conditional. Accepted for *instrumental rationality* (achieving a goal), rejected for *moral duty*. Why? Because it depends on the agent's goals (payoff matrix).
      *   *Case 6 (AI $\rightarrow$ Alignment):* Uncertain. Why? Is "minimizing error" a functional norm (like the heart) or just a mathematical description?

  3.  **Identify the Underlying Principle:**
      *   The user isn't rejecting *all* is-ought moves. They reject moves from *bare facts* to *moral values* (Case 1). They accept moves from *functional facts* to *instrumental norms* (Case 2, Case 5-strategy).
      *   This points strongly towards **Hypothetical Imperatives within Functional Systems**.
      *   *Key Distinction:* Categorical Oughts (Moral) vs. Hypothetical Oughts (Functional/Instrumental).
      *   *The Principle:* You can derive an "ought" from an "is" *if and only if* you have already accepted a goal or function that defines the system. Without the goal, the "ought" is groundless.
      *   *Philosophical Anchor:* This aligns with Philippa Foot's "Natural Goodness" or Kant's distinction between hypothetical and categorical imperatives, or even Searle's "Institutional Facts."

  4.  **Drafting the Principle (Iterative Process):**
      *   *Attempt 1:* You can't get morality from science, but you can get engineering rules. (Too vague).
      *   *Attempt 2:* Norms are valid only relative to a predefined function. (Better).
      *   *Attempt 3 (Refining):* **The Principle of Functional Relativity.** An "ought" claim is valid derived from an "is" claim only when: (1) The entity has a defined function or goal, and (2) The "ought" is instrumental to that function, not a categorical moral command.
      *   *Testing against cases:*
          *   1 (Evolution): Fails (1). Survival isn't a moral goal.
          *   2 (Heart): Passes (1) & (2). Function = pump. Goal = life.
          *   3 (Economics): Fails (1) implicitly. Growth isn't an agreed moral goal.
          *   4 (Neuro): Fails (Category error).
          *   5 (Game Theory): Passes for strategy (Goal = win), Fails for morality (Goal = good).
          *   6 (AI): Depends on if "minimizing error" is the defined function.

  5.  **Addressing the Tension (Case 2 vs. Case 5):**
      *   The user feels 2 is "real" and 5 is "conditional."
      *   Actually, *both* are conditional. The heart *ought* to pump *if* the organism is to live. The prisoner *ought* to cooperate *if* they want to maximize payoff.
      *   Why does 2 feel more absolute? Because we implicitly value life/health universally. We don't implicitly value "winning the prisoner's dilemma" universally.
      *   *Insight:* The user is conflating *universally shared goals* (health) with *contingent goals* (game payoff).

  6.  **Addressing the Flip-Flop (Case 6) and New Scenario (Diet):**
      *   *Case 6 (AI):* If the AI's *defined function* is to minimize prediction error, then it *ought* to align if misalignment increases error. This is an engineering norm, not a moral one. The user's confusion comes from the word "alignment" sounding moral.
      *   *Diet Scenario:* "Guts evolved for cooked meat $\rightarrow$ Ought to eat cooked meat." This is like the Heart case. *If* you want digestive health, *then* eat cooked meat. It's not a moral "ought," it's a prudential "ought."

  7.  **Structuring the Response:**
      *   **Acknowledge the sophistication:** The user has good philosophical instincts.
      *   **State the Principle:** "The Principle of Instrumental Normativity within Functional Systems."
      *   **Break down the Clauses:**
          *   Clause A: The Goal Premise (Must exist).
          *   Clause B: The Functional Link (Is $\rightarrow$ Ought bridge).
          *   Clause C: The Domain Limit (Engineering/Prudence $\neq$ Morality).
      *   **Map the Cases:** Show how the principle explains the verdicts.
      *   **Resolve the Tension (2 vs. 5):** Explain that 2 feels absolute because the goal (life) is implicit/universal, whereas 5's goal is explicit/contingent.
      *   **Address the Flip-Flop (6):** It's a design norm, not moral.
      *   **Address the New Scenario (Diet):** It's a prudential norm (health), not moral.
      *   **The Hard Truth (Inconsistency):** Point out where the user might be slipping. Specifically Case 3 (Economics). If they accept 2, they should accept 3 *instrumentally*, but they feel "slippery" because they suspect the goal (growth) is being smuggled as a moral good. Also Case 1 vs. Diet: Evolution explains the gut, but does it justify the norm? (Appeal to Nature fallacy risk).

  8.  **Refining the Output:**
      *   Make it punchy for a feature writer.
      *   Use clear headings.
      *   Be honest about the "Drop One" requirement. (Actually, the principle accommodates most, but requires re-labeling Case 2 as hypothetical, not categorical).
      *   *Self-Correction on Case 4:* Case 4 is the "Genetic Fallacy" or "Reductionist Fallacy," distinct from Is-Ought. Need to clarify that.
      *   *Self-Correction on Case 1:* This is the classic Naturalistic Fallacy.
      *   *Self-Correction on Case 6:* This is teleological reasoning based on objective functions.

  9.  **Final Polish:** Ensure the tone is collaborative and analytical, not just lecturing. (The user is testing *their* intuitions, so validate them while providing structure).

      *(Self-Correction during drafting)*: Wait, I need to be careful about Case 2. Philosophical naturalists (like Foot) argue biological norms *are* a form of objective normativity. The user says it feels "legitimate." I should validate that feeling but clarify *why* it works (internal teleology) compared to Case 1 (external teleology).

      *Revised Principle:* **The Internal Teleology Constraint.** You can derive an ought from an is *only* when the "is" describes a system with an internal goal/function, and the "ought" is relative to that function.

      *Let's check the Diet case:* "Guts evolved for cooked meat." Evolution gives a historical explanation, not necessarily a functional norm for *now*. But if we say "Human digestive physiology is optimized for cooked meat," that's a functional claim. So, "Ought to eat cooked meat" holds *if* the goal is digestive efficiency.

      *Let's check the AI case:* "LLMs minimize prediction error." That is their mathematical function. "Ought to be aligned." Only if alignment minimizes error. This is technical, not moral.

      *Okay, ready to write.*
answer: |-
  You have excellent philosophical instincts. You aren't being inconsistent; you are intuitively tracking a distinction that professional ethicists spend careers formalizing. You are distinguishing between **categorical norms** (moral duties) and **hypothetical norms** (functional/instrumental requirements).

  Your gut is telling you that science *can* generate "oughts," but only inside a closed system where the goal is already defined. When the goal is smuggled in as a universal moral truth, your alarm bells ring.

  Here is the principle that saves your verdicts, followed by the hard truth about where it forces you to adjust your thinking.

  ### The Principle: Internal Teleology Constraint

  **You can validly derive an "ought" from an "is" if and only if:**
  1.  **The Goal Premise:** The system in question has a defined, non-arbitrary function or goal (teleology).
  2.  **The Instrumental Link:** The "ought" is strictly instrumental to achieving that function, not a claim about the moral value of the function itself.
  3.  **The Domain Boundary:** The resulting "ought" is recognized as conditional (engineering, prudence, strategy), not categorical (morality).

  ---

  ### How the Principle Maps to Your Cases

  **Case 2 (The Heart): The Anchor**
  *   **Verdict:** Legitimate.
  *   **Why:** This motivates Clause 1. A heart is a functional part of an organism. The "goal" (pumping blood to sustain life) is internal to the definition of a heart.
  *   **The Norm:** "A heart *ought* to pump" is shorthand for "If this organ is to function as a heart, it must pump." This is a **functional norm**. Your intuition accepts this because the goal (life) is biologically intrinsic, not morally imposed.

  **Case 5 (Game Theory): The Mirror**
  *   **Verdict:** Okay for strategy, foul for morality.
  *   **Why:** This motivates Clause 3. In a Prisoner's Dilemma, the goal (maximizing payoff) is defined by the game rules.
  *   **The Norm:** "Agents *ought* to cooperate" is valid *if* they want to maximize long-term payoff. It fails as morality because "maximizing payoff" is not a universal moral good.
  *   **Resolving the Tension:** You feel tension between 2 and 5 because in Case 2, the goal (life) is so universally shared it *feels* categorical. In Case 5, the goal (winning) is obviously contingent. **The principle says they are logically identical:** both are hypothetical imperatives. Case 2 just has a premise ("Life is good") that we rarely question.

  **Case 1 (Evolution): The Violation**
  *   **Verdict:** Fallacy.
  *   **Why:** This violates Clause 2. Evolution describes a historical process, not a prescriptive goal. "Survival" is an outcome, not a moral mandate.
  *   **The Error:** You are trying to jump from "We *did* evolve to cooperate" to "We *should* cooperate morally." There is no functional system where "moral goodness" is the output of "evolutionary success." This is the classic **Naturalistic Fallacy**.

  **Case 3 (Economics): The Smuggle**
  *   **Verdict:** Slippery.
  *   **Why:** This violates Clause 3. "Policymakers ought to prioritize trust" is valid *if* the goal is economic growth.
  *   **The Error:** Your intuition senses that "growth" is being treated as a moral end rather than an instrumental one. If the feature implies growth is *good* in itself, it's smuggling a value judgment. If it implies "If you want growth, build trust," it's valid science. Your "slippery" feeling is the detection of a hidden value premise.

  **Case 4 (Neuroscience): The Category Error**
  *   **Verdict:** Different error.
  *   **Why:** This isn't an Is-Ought problem; it's a **Mereological/Reductionist Fallacy**.
  *   **The Error:** Explaining the substrate (neurons) does not negate the emergent property (reasoning). Saying "morality is just firing" is like saying "Hamlet is just ink." It misses the level of analysis where "oughts" exist. Your intuition is correct to separate this from the others.

  ---

  ### The Flip-Flop: Case 6 (AI Alignment)

  **Your Verdict:** Back and forth.
  **The Principle's Ruling:** Valid *Engineering* Norm, Invalid *Moral* Norm.

  This case is the perfect stress test.
  *   **The "Is":** LLMs minimize prediction error.
  *   **The "Ought":** They ought to be aligned.
  *   **The Bridge:** Misalignment increases error (in a specific context).

  If "alignment" is defined mathematically as minimizing a specific loss function regarding human feedback, then the "ought" is valid **under Clause 1 & 2**. It is a design specification.
  *   **Why you flip-flop:** The word "Alignment" sounds moral. If you interpret "aligned with human values" as a moral claim, it fails Clause 3 (science can't dictate which human values *should* be chosen). If you interpret it as "aligned with the training objective," it passes.
  *   **Advice for your feature:** Call this out explicitly. AI safety often disguises moral choices (which values?) as engineering problems (minimize error). Your intuition is wavering because the case is doing both.

  ---

  ### The New Scenario: Diet & Cooked Meat

  **Scenario:** "Human guts evolved to digest cooked meat, therefore we ought to eat cooked meat."
  **The Principle's Ruling:** Valid **Prudential** Norm, Invalid **Moral** Norm.

  *   **Analysis:** This is structurally identical to Case 2 (The Heart).
      *   *System:* Human digestive physiology.
      *   *Function:* Nutrient absorption/health.
      *   *Fact:* Cooked meat optimizes this function.
      *   *Norm:* You *ought* to eat cooked meat.
  *   **The Catch:** This "ought" is conditional on the goal "I want to be healthy." It is not a moral sin to eat raw meat; it is merely physiologically inefficient or risky.
  *   **The Trap:** If your feature implies people are *morally wrong* to eat raw meat, it commits the **Appeal to Nature Fallacy** (a cousin of the Naturalistic Fallacy). Just because we evolved for X doesn't mean X is morally required. But if the claim is "If you want to avoid digestive distress, eat cooked meat," science fully supports that ought.

  ---

  ### The Hard Truth: Where You Must Drop a Verdict

  To maintain coherence, you have to adjust your view on **Case 2 (The Heart)**.

  Currently, you say Case 2 is "Not a fallacy at all" and feels "totally legitimate" in a way Case 5 does not.
  *   **The Adjustment:** You must admit that Case 2 is *also* a hypothetical imperative, exactly like Case 5.
  *   **Why:** A heart that doesn't pump is only "bad" relative to the goal of the organism's survival. If the organism wants to die, the heart *ought* to stop. We don't see this because we value life universally.
  *   **The Cost:** You lose the idea that biological norms are "objective" in a way that game-theoretic norms are not. They are both objective *relative to a goal*.
  *   **The Gain:** You gain a unified theory. Science never tells us what goals to have (Case 1, 3, Moral Diet). Science *only* tells us how to achieve the goals we already have (Case 2, 5, Engineering AI, Prudential Diet).

  ### Summary for Your Feature

  You can write with confidence that your intuitions are tracking a real logical boundary.

  1.  **Science cannot choose our ends.** (Cases 1, 3, Moral Diet).
  2.  **Science is authoritative on our means.** (Cases 2, 5-Strategy, 6-Engineering, Prudential Diet).
  3.  **The confusion arises when "means" are disguised as "ends."** (Case 6 Alignment, Case 3 Growth).

  Your tension between Case 2 and Case 5 is the hinge of the story. The resolution is that **biology is just game theory played over deep time.** The heart cooperates with the body to win the survival game. The "ought" is real, but it is the "ought" of a mechanic fixing an engine, not a judge sentencing a criminal.

  If you make that distinction clear, you solve the Is-Ought problem for your readers without dismissing the power of science. Science tells us what we must do *if* we want to survive, thrive, or build working AI. It just can't tell us *why* we should want those things.
