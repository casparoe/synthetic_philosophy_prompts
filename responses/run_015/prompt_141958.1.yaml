answer: |-
  The French sequence from June 1793 to July 1794 functions less as a confirmation of the proverb that revolutions devour their children than as a forensic test bed for the mechanisms driving that consumption. To determine which causal stories hold, we must map the agent, action variable, and predictions of each candidate mechanism against four features of the record: the ideological direction of purges, the tempo of violence, the profile of survivors, and the terminal event.

  The purity spiral and the null hypothesis are the first to fall. In the purity spiral, the agents are competing factions, the action variable is the rhetorical bidding of revolutionary virtue, and the prediction is a unidirectional radicalization where moderation equals treason. The record rules this out. The Hébertists (ultra-revolutionary) were guillotined on 24 March 1794, and the Dantonists (moderate/Indulgent) followed on 5 April. A spiral predicts a race to the extreme, not a pincer movement eliminating opposite flanks within a fortnight. Similarly, the null hypothesis posits agents as random actors in violent times, with violence as the action variable, predicting no patterned sequence. The structured elimination of Girondins, then Hébertists, then Dantonists, then the Committee itself is too ordered to be noise; the null is rejected.

  Three mechanisms remain standing: coalition contraction, instrumental autonomy, and the commitment problem regarding disloyal actors. In coalition contraction, the agent is the ruling coalition, the action is the purging of flanks to narrow the base, and the prediction is a monotonic narrowing ending in a coup by the rump. This fits the ideological direction (Left and Right flanks removed) and the ending (the Convention, the rump, arresting the Committee). In the commitment problem hypothesis, the agent is the leadership, the action is the signaling of resolve through purge, and the prediction is an inability to de-escalate even when strategic conditions improve. This explains why Danton, a personal ally, was killed; eliminating him destroyed the off-ramp for restraint. Finally, instrumental autonomy identifies the repressive apparatus as the agent, with legal unshackling as the action variable. It predicts acceleration at institutional changes rather than smooth ideological drift.

  The record strongly discriminates in favor of instrumental autonomy regarding tempo. Executions jumped from 155 monthly in Germinal to 796 in Messidor, coinciding precisely with the Law of 22 Prairial on 10 June. This spike occurs after the Hébertist and Dantonist purges, suggesting the machine, once fed, developed its own momentum. The acquittal rate staying near a quarter is crucial here: it suggests the Tribunal was not becoming more ideologically discerning but was processing inputs at a capped capacity. The immunity clause, which stripped Convention deputies of protection, validates the autonomy story by removing the legal firewall between the creators and the instrument. Without that clause, the Committee might have remained safe; with it, the apparatus could legally target the architects.

  Personnel selection remains ambiguous. Here, the agents are individuals, the action is the possession of traits adaptive for seizure rather than exercise of power, and the prediction is that survivors will be those best at purging. The Thermidorians were indeed men who staffed the Terror, suggesting survival of the bureaucratic adept. However, this mechanism cannot explain the timing of the devouring, only the characteristics of the survivors. It is a description of the aftermath, not a cause of the sequence.

  Turning to the interpretive frameworks, this sequence damages both class struggle and ideology. Class struggle cannot explain why sans-culotte-aligned Hébertists and bourgeois-aligned Dantonists were liquidated by a coalition that ostensibly represented the people; the violence cut across class lines within the revolutionary bloc. Ideology is similarly weakened because the purge was not unidirectional; if ideology were the driver, one flank should have been purged while the other was consolidated. Contingency fares better but is limited. The victory at Fleurus in late June removed the military emergency, yet the Terror accelerated in Messidor. If contingency (military threat) were the primary driver, executions should have dropped after Fleurus. Instead, the institutional shock of Prairial outweighed the exogenous shock of victory. The case suggests that internal institutional dynamics dominate external military conditions.

  For your essay to transcend anecdote, the comparison class must be defined. A revolution that did not devour its children would require institutionalized off-ramps—mechanisms allowing for the peaceful rotation of power or the legal protection of opposition flanks. In the French case, a falsifying observation for instrumental autonomy would have been a drop in executions following Prairial; for coalition contraction, a cessation of purges after the Girondins were removed; for the commitment hypothesis, the survival of Danton following the Hébertist purge. The fact that none of these occurred strengthens the causal claims of the standing mechanisms.

  However, significant silences remain. None of the six mechanisms explains why Thermidor arrived in July rather than September. Coalition contraction explains that the rump would eventually turn on the head, and instrumental autonomy explains the capacity to do so, but neither accounts for the specific trigger date. The commitment hypothesis suggests leadership wanted to stop but couldn't, yet it does not explain why the constraint broke in late July. This timing may be pure contingency—the specific alignment of fear among Convention deputies on a specific day—which marks the limit of structural explanation.

  Ultimately, the French sequence supports a synthesis of coalition contraction and instrumental autonomy. The revolution devoured its children because the winning coalition narrowed until it was a rump, and because the repressive instruments built to secure that coalition were legally unshackled from their creators. The acquittal rate and immunity clause confirm that the machine, once built, operated with a logic of throughput that eventually encompassed its operators. The victory at Fleurus explains little; the machinery of terror had become autonomous from the military necessity that justified it. Your essay should argue that revolutions devour their children not because of ideological madness, but because the institutional solutions to the problem of power (purging flanks, building tribunals) solve the short-term problem of survival by creating the long-term problem of entrapment. The silence on the specific date of Thermidor is a feature, not a bug; it reminds us that while mechanisms create the conditions for devouring, the precise moment often remains a matter of human fear and timing that structural models cannot fully capture.
