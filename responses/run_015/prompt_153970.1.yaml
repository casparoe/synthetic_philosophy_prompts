answer: |-
  ### 1. Practice Exam Question

  **Time Allowed:** 45 Minutes
  **Word Limit:** Maximum 800 words
  **Total Marks:** 25

  **Question:**

  The self-governing city of Verran proposes a tidal barrage on the River Serran. The project protects Verran's low districts but diverts seasonal flooding onto Halden Marsh (outside Verran's jurisdiction) and blocks a fish migration route relied upon by the Kesh fishing cooperative, 200km upstream in a different member-state. Additionally, 4,000 Halden residents commute daily into Verran, paying Verran income tax and obeying its employment and zoning laws while within city limits.

  Two principles for determining the *demos* are proposed:
  1.  **All-Affected Interests (AAI):** Everyone whose significant interests are foreseeably affected has a claim to membership.
  2.  **All-Subjected to Coercion (ASC):** Everyone subject to the coercion involved in enforcing the decision has a claim to membership.

  Write an essay that:
  (a) Determines who qualifies for the *demos* under each principle regarding the barrage decision.
  (b) Applies the **Recursion Test**: Does the principle yield a stable result when applied to the meta-decision of *which boundary principle to adopt*?
  (c) Concludes whether democratic legitimacy is possible here without a prior constitutional settlement, specifically addressing the problem of agenda control.

  ***

  ### 2. Model Answer (715 words)

  Determining the boundaries of the *demos* is logically prior to democratic decision-making, yet the criteria for drawing those boundaries are themselves contested. In the Verran case, applying the All-Affected Interests (AAI) and All-Subjected to Coercion (ASC) principles yields divergent memberships, and subjecting these principles to the Recursion Test reveals a fundamental instability in democratic boundary-making.

  Under the **All-Affected Interests (AAI)** principle, the *demos* for the barrage decision is expansive. Verran residents are clearly included as their property is protected. The Halden Marsh residents must also be included, as their farms face foreseeable flooding. Crucially, AAI also includes the Kesh cooperative. Although they are 200km away and in a different state, their livelihood depends on the fish stock, which is significantly affected by the barrage. Under AAI, physical jurisdiction matters less than causal impact.

  Under the **All-Subjected to Coercion (ASC)** principle, the result differs. Verran residents are subject to the city's coercive enforcement of the barrage construction and maintenance. The Halden commuters are also included; while they live outside the city, they are subject to Verran's tax, employment, and zoning laws daily. The enforcement of the barrage decision relies on legal frameworks they must obey while working in Verran. However, the Kesh cooperative is excluded. They are not subject to Verran's legal coercion; they suffer an externality, but no Verran law binds their conduct. Thus, ASC produces a *demos* bounded by legal jurisdiction, whereas AAI produces a *demos* bounded by causal chains.

  The critical test for these principles is **recursion**. A boundary principle is only legitimate if it can justify its own adoption without contradiction. We must ask: Who votes on which boundary principle to use? If we apply AAI to this meta-decision, everyone affected by the boundary rule must vote. Since the boundary rule determines who gets a say on the barrage, and the barrage affects Kesh, Kesh is affected by the boundary rule. Therefore, Kesh must vote on whether to adopt AAI. This seems consistent. However, if we apply ASC to the meta-decision, only those coerced by the boundary rule vote. If the boundary rule is enforced by Verran law, Kesh is again excluded.

  The instability arises because the *demos* changes depending on which principle is provisionally assumed to select the *demos*. If we use AAI to select the principle, Kesh is in. If Kesh votes, they will likely reject ASC (which excludes them) and choose AAI. If we use ASC to select the principle, Kesh is out. The remaining *demos* (Verran and Halden commuters) might choose ASC to limit liability. The principle selects a *demos* that then selects the principle. This circularity means neither principle offers a neutral, pre-political ground for decision-making. The Recursion Test shows that both principles are self-undermining: they require a *demos* to validate the rule that creates the *demos*.

  This implies that democratic legitimacy in boundary cases cannot be generated solely by moral principles like AAI or ASC. Without a prior **constitutional settlement**—a fixed point agreed upon historically or legally—the process faces an infinite regress. Someone must decide the boundary before the *demos* exists to decide it.

  This leads directly to the problem of **agenda control**. If the *demos* is reconstituted for every decision based on fluid principles, the entity empowered to interpret those principles holds unchecked power. In Verran, if the City Council decides who is "affected enough" or "subject enough" to vote, they effectively gerrymander the *demos* to ensure the barrage passes. They could define "coercion" narrowly to exclude Halden commuters or define "interest" narrowly to exclude Kesh.

  Therefore, the Recursion Test demonstrates that boundary principles are not freestanding moral truths but political tools. A stable *demos* requires a fixed constitutional rule that is insulated from the very decisions it frames. Without this, the power to define the boundary is more significant than the vote itself, rendering the subsequent democratic procedure illegitimate. The only way to pass the Recursion Test is to admit that the boundary of the *demos* is not itself a democratic decision, but a constitutional constraint upon it.

  ***

  ### 3. Marking Scheme (25 Marks)

  | Criterion | Marks | A-Range (Excellent) | B-Range (Good) | C-Range (Pass) | Common Error (One-Line Note) |
  | :--- | :---: | :--- | :--- | :--- | :--- |
  | **1. Application of Principles** | **8** | Correctly identifies Kesh in AAI but out in ASC; correctly identifies Halden commuters in both (due to tax/law). | Identifies Kesh difference but misses the nuance of Halden commuters' legal subjection. | Lists groups but fails to distinguish why Kesh differs under ASC vs AAI. | Treating Halden residents as purely "outside" jurisdiction despite tax/law subjection. |
  | **2. Execution of Recursion Test** | **8** | Explains the circularity: the *demos* for the meta-decision shifts based on the principle assumed. | Describes recursion as "voting twice" rather than the instability of the selecting *demos*. | Mentions recursion but fails to apply it to the Kesh/Halden distinction. | Confusing recursion with a standard appeals process or judicial review. |
  | **3. Agenda Control & Legitimacy** | **6** | Concludes that without a constitutional "fixed point," agenda-setters gerrymander the *demos*. | Notes agenda control is a problem but suggests better dialogue solves it. | States legitimacy is compromised but offers no structural explanation. | Assuming democracy itself can solve the boundary problem without paradox. |
  | **4. Structure & Clarity** | **3** | Logical flow; concise; no citations; within word limit. | Clear but slightly disorganized or verbose. | Hard to follow or significantly under/over word count. | Using citations or referencing specific authors (closed book violation). |

  **Total:** /25

  **Grading Notes for Peers:**
  *   **The "Kesh" Distinction:** If they put Kesh in the ASC *demos*, they have misunderstood coercion (max 5/8 for Section 1).
  *   **The Recursion Logic:** An A answer must show that the *composition* of the voters changes at the meta-level, not just that the question is hard (max 4/8 for Section 2 if missed).
  *   **The Conclusion:** If they argue we just need "more inclusive democracy" to fix the boundary problem, they failed the recursion insight (max 3/6 for Section 3).
