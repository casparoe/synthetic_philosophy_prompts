  4.  **Timeline & Logistics:**
      *   75 mins is tight for 3 variants + role swap.
      *   Need to move fast.
      *   0-10: Setup & Rules.
      *   10-25: Round 1 (Base Game).
      *   25-35: Debrief 1 (The "Gotcha").
      *   35-50: Round 2 (Variants - assign different variants to different pairs to save time).
