      *   (b) Reneging Fee: Punter can pay 5 points to void a Sheet 2 trade. *Lesson:* Diachronic Dutch Book assumes binding commitment. If you can change your mind (for a cost), the sure loss disappears. It becomes a cost-benefit analysis of stability.
