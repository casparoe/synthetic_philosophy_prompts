answer: |-
  This is a sharp design. You're right that the synchronic Dutch Book often feels like a "don't be stupid" lesson rather than a normative constraint on rationality. The diachronic version is where the philosophical meat is (commitment, identity, planning), but it's also where the assumptions are heaviest.

  Here is a tight, 75-minute lesson plan designed to generate the inconsistency organically, let the students find the arbitrage, and then dismantle the argument's foundations in the debrief.

  ### 1. The Setup & Materials

  **The Proposition:**
  We are rolling a standard 6-sided die.
  *   **Ticket H:** Pays **100 points** if the die shows **1**. Pays **0** otherwise.
  *   **Evidence Partition:** The die is rolled under a cup. The Punter is told only **"ODD"** (1, 3, 5) or **"EVEN"** (2, 4, 6).

  **Why this ticket?**
  *   Ex-Ante Probability: 1/6 (~16.7 points).
  *   Probability if ODD: 1/3 (~33.3 points).
  *   Probability if EVEN: 0 (0 points).
  *   *The Trap:* Humans are terrible at maintaining $Price_{ex-ante} = 0.5 \times Price_{ODD} + 0.5 \times Price_{EVEN}$. They tend to anchor on the ex-ante price and under-adjust, or anchor on the conditional price and over-adjust.

  **Materials Needed:**
  *   **Price Sheets (14 copies):** Two sections. Section 1 (Ex-Ante). Section 2 (The Plan: Price if ODD / Price if EVEN).
  *   **Bookie Worksheets (7 copies):** A simple calculator grid (see below).
  *   **Poker Chips:** For settlement.
  *   **Cups/Dice:** 7 sets.

  ---

  ### 2. The Rules (Handout/Board)

  **Role: The Punter**
  1.  **Section 1:** Write a single number (0–100) representing your **Fair Price** for Ticket H *right now*. You must buy or sell at this price if the Bookie asks.
  2.  **Section 2 (The Plan):** *Before any die is rolled*, you must fill out two columns:
      *   **If told ODD:** What is your Fair Price for Ticket H?
      *   **If told EVEN:** What is your Fair Price for Ticket H?
  3.  **Commitment:** You are signing a contract. Once the die is rolled and the result (ODD/EVEN) is announced, you **must** trade at the price you wrote in Section 2. You cannot change your mind.

  **Role: The Bookie**
  1.  Collect the Punter's completed Sheet (both sections).
  2.  Your goal: Construct a **Dutch Strategy**.
      *   Choose a trade for *Now* (Buy or Sell Ticket H).
      *   Choose a trade for *Later* (Buy or Sell Ticket H, contingent on ODD or EVEN).
  3.  If your strategy guarantees you a profit in points regardless of the die roll, you win.

  **The Bookie's Cheat Sheet (The Math)**
  *   Let $P_0$ = Ex-Ante Price.
  *   Let $P_{Odd}$ = Price if ODD.
  *   Let $P_{Even}$ = Price if EVEN.
  *   **Calculate:** $D = (P_{Odd} + P_{Even}) - 2P_0$.
  *   **If $D > 0$:** Bookie **Buys 2** tickets Now (pays $2P_0$). Bookie **Sells 1** ticket Later (receives $P_{Odd}$ or $P_{Even}$). **Profit = $D$.**
  *   **If $D < 0$:** Bookie **Sells 2** tickets Now (receives $2P_0$). Bookie **Buys 1** ticket Later (pays $P_{Odd}$ or $P_{Even}$). **Profit = $-D$.**
  *   **If $D = 0$:** No strategy possible.

  ---

  ### 3. Timeline (75 Minutes)

  #### 00:00 – 00:10: Setup & Instructions
  *   Arrange chairs in 7 pairs. Distribute chips.
  *   **Crucial Instruction:** "Do not use calculators. Do not calculate fractions. Write down the number that *feels* like the fair betting value. Trust your intuition." (This maximizes the chance of inconsistency).
  *   Assign roles: Student L = Punter, Student R = Bookie.

  #### 00:10 – 00:30: Round 1 (The Trap)
  *   **10 mins:** Punters fill out Sheet 1 and Sheet 2 (The Plan). *Emphasize: Sheet 2 must be filled NOW, before the die roll.*
  *   **5 mins:** Bookies collect sheets. They have the Punter's entire "life plan" in front of them. They use the Cheat Sheet to find the arbitrage.
  *   **5 mins:** Execution. Bookie announces trades. Die is rolled. Chips change hands.
  *   **Outcome:** Most Bookies will find a profit ($D \neq 0$). Punters will lose points in every outcome.

  #### 00:30 – 00:35: The "Gotcha" (Mini-Debrief)
  *   Ask Punters: "Did you feel irrational when you filled out Sheet 2?" (Most will say no, it felt reasonable at the time).
  *   Ask Bookies: "Was it hard to find the profit?"
  *   **Do not name Conditionalization yet.** Say: "You were penalized for a mismatch between your current self and your planned future self."

  #### 00:35 – 00:55: Round 2 (Breaking the Argument)
  *   **Swap Roles:** Student R is now Punter, Student L is now Bookie.
  *   **Assign Variants:** Divide the 7 pairs into three groups.
      *   **Pairs 1 & 2 (Variant A: Spreads):** Punters may post a **Bid** and an **Ask** (e.g., Buy @ 15, Sell @ 25). Bookie can only trade if they cross the spread.
      *   **Pairs 3 & 4 (Variant B: Reneging):** Punters can void any Sheet 2 trade *after* the announcement by paying a **5-point Fee**.
      *   **Pairs 5 & 6 (Variant C: The Stranger):** Punter fills Sheet 1. Then, **swap Punters with a neighboring pair.** The *new* Punter fills out Sheet 2 (The Plan) without seeing Sheet 1. (Simulates "Future Self is a Stranger").
      *   **Pair 7 (Control):** Repeat Base Game.
  *   **20 mins:** Run the game. This will be chaotic. Let them argue about the rules. That friction is data.

  #### 00:55 – 01:15: Grand Debrief (The "C-Word" & Limitations)
  *   Bring the room together. Whiteboard the results.
  *   **Phase 1: The Norm.** Reveal that the "Base Game" loss happens if and only if you violate **Conditionalization**. Write the formula: $P_{new}(H) = P_{old}(H | Evidence)$.
  *   **Phase 2: The Assumptions.** Map the Variants to the philosophical assumptions required for the Dutch Book to work.
      *   *Variant A (Spreads):* Assumes **Precise Credences**. If you allow imprecision (belief intervals), the Dutch Book vanishes. *Question:* Is rationality precision?
      *   *Variant B (Reneging):* Assumes **Binding Commitment**. The argument works only if Future You is *bound* by Past You's plan. If you can pay to change your mind, the "sure loss" becomes a "cost of flexibility." *Question:* Is rationality rigidity?
      *   *Variant C (Stranger):* Assumes **Personal Identity**. The argument assumes the Punter at Time 2 is the same agent as Time 1. If Future You is a stranger, why should Past You care about Future You's prices? *Question:* Are we temporally extended agents or time-slices?
  *   **Phase 3: The Hole (Foreseen Evidence).**
      *   Ask: "In this game, you knew exactly what evidence was coming (Odd/Even). What if the evidence was 'The die looks blue' or 'I feel lucky'?"
      *   Explain: The Diachronic Dutch Book only works if you can anticipate the *partition* of evidence. If you can't name the evidence in advance, you can't fill out Sheet 2. This is the **Foreseen Evidence Objection**. Conditionalization might be a rule for idealized robots, not humans facing surprise.

  ---

  ### 4. Bookie Worksheet (Printable)

  ```text
  BOOKIE STRATEGY CALCULATOR

  PUNTER'S PRICES:
  Ex-Ante Price (P0): _______
  Price if ODD (PO): _______
  Price if EVEN (PE): _______

  THE TEST:
  Calculate: (PO + PE) - (2 * P0) = ___________  (Call this value 'D')

  IF D IS POSITIVE (+):
  1. NOW: BUY 2 Tickets from Punter. (You pay 2*P0)
  2. LATER: SELL 1 Ticket to Punter. (You receive PO or PE)
  3. RESULT: You keep 'D' points profit regardless of die roll.

  IF D IS NEGATIVE (-):
  1. NOW: SELL 2 Tickets to Punter. (You receive 2*P0)
  2. LATER: BUY 1 Ticket from Punter. (You pay PO or PE)
  3. RESULT: You keep '-D' points profit regardless of die roll.

  IF D IS ZERO:
  No strategy possible. Punter is safe.
  ```

  ---

  ### 5. Predicting Failures & Limitations

  Be ready for these specific hiccups:

  **1. The "Calculated Perfection" Problem**
  *   *Risk:* Your Econ students will calculate $1/6 \approx 16.6$, $1/3 \approx 33.3$, $0=0$. They will see $16.6 \times 2 = 33.2$ vs $33.3 + 0$. They will conditionalize perfectly and the Bookie will starve.
  *   *Fix:* In the instructions, explicitly forbid fractions and decimals. "Whole numbers only, based on gut confidence." This forces heuristic pricing, which introduces the noise needed for the Dutch Book.

  **2. The "So What?" Defense**
  *   *Risk:* Punters will say, "I just won't sign Sheet 2. I'll decide my prices later."
  *   *Response:* This is exactly the point of the debrief. The Dutch Book argument claims that *having a plan* is part of rationality. If you refuse to plan your updates, you are arguably irrational (or at least, you can't be relied upon in cooperative ventures). But acknowledge: This assumes planning is possible.

  **3. The Utility/Points Confusion**
  *   *Risk:* "I'm risk averse. 100 points isn't twice as good as 50."
  *   *Response:* Acknowledge this immediately in the debrief. The Dutch Book argument assumes **linear utility in points**. If utility is non-linear, the "Fair Price" isn't the probability. This is a major limitation of the argument: it proves you should conditionalize *if* your betting quotients map linearly to probability.

  **4. The "Foreseen Evidence" Hole (The Big One)**
  *   *Honesty Check:* You guessed this, and you are right. This is the biggest hole the game cannot stage. In the game, the partition {Odd, Even} is known at $t_0$. In real life, we often get evidence we couldn't partition in advance.
  *   *Debrief Point:* "The Diachronic Dutch Book proves Conditionalization is the only safe update rule *for evidence you anticipated*. It offers no guidance for surprise. This is why some philosophers prefer **Jeffrey Conditionalization** or **Reflection Principles**."

  **5. Variant C Logistics**
  *   *Risk:* Swapping punters takes too long.
  *   *Fix:* Pre-assign the swap. "Pairs 5 and 6: When it is time for Sheet 2, Punters stand up and swap seats. Do not take your Sheet 1 with you."

  ### 6. Instructor's "Cheat Code" for the Debrief

  If the room is quiet after Round 1, ask this:
  *"Punters, when you filled out Sheet 2, did you feel like you were lying? Or did it feel like the truth?"*

  *   If they say **"Truth"**: Then they have inconsistent truths. Their Time 1 self and Time 2 self disagree on the value of the same ticket in the same world. Who is right?
  *   If they say **"Lying"**: Then why did you sign it? Because you thought you could get out of it? (Leads perfectly into Variant B).

  This structure keeps the "C-word" hidden until the end, lets them feel the normative force of the argument through loss, and then gives them the philosophical tools to dismantle it. Good luck.
