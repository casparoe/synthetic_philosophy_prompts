              *   *Actually, the best way to guarantee violation:* Don't force them to violate it, but design the Bookie Worksheet to *detect* it easily. If they conditionalize, the Bookie does nothing. If they don't, the Bookie profits. The "temptation" is simply human inconsistency. Most people *won't* conditionalize perfectly without training. I will advise the instructor to emphasize "Intuitive Fair Price" not "Calculated Probability."

