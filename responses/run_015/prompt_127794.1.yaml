      *   *Section 2: Detailed Analysis of the Three Cases.*
          *   *Case 1:* Nyāya requires *sādṛśya-jñāna* (knowledge of similarity). If the standard is only conceptual, does it count? Some later Naiyāyikas might concede this slips into *śabda*.
          *   *Case 2:* This is the big one. If *upamāna* covers functional analogy, it looks like inference based on *vyāpti* (pervasion). User's hunch is correct.
          *   *Case 3:* Causal theory of knowledge (*yathārtha-anuvyavasāya*). Defective cause = no *pramā*.
      *   *Section 3: Misfires (Fake Ox).* Explain *dosha* (defect). *Upamāna* is defined by success. Failure means *upamāna* didn't function *qua pramāṇa*.
      *   *Section 4: Meta-Epistemology (Unfalsifiability).* Address the "stipulation" worry. It's not unfalsifiable; it's a debate over cognitive architecture and parsimony.
      *   *Section 5: Scholarly Consensus vs. Contested.* Be explicit. (e.g., B.K. Matilal vs. standard textbook views).
      *   *Conclusion:* Validate the user's hunch.

  6.  **Refining the Content (Self-Correction/Nuance Check):**

      *   *Correction on Case 1:* Classical Nyāya usually insists on prior perception of the standard (the cow). If the user's friend argues from a strictly classical standpoint (Uddyotakara/Vācaspati), Case 1 might be ruled *out* of *upamāna* entirely, making it a counter-example to the *scope*, not the *irreducibility*. I need to clarify that.
      *   *Correction on Case 2:* Ensure I distinguish between *sāmānya* (universal) and *sādṛśya* (similarity). Inference relies on universals; Comparison relies on similarity. If similarity is functional, is it a universal? Yes, likely. This supports the reductionist view.
      *   *Consensus Check:* Most modern scholars (Matilal, Phillips, Ganeri) agree the debate hinges on whether similarity is a distinct category (*padārtha*) or reducible. The "functional analogy" extension is a modern pressure point applied to classical texts. I must note that classical texts focus on sensory similarity.
      *   *Unfalsifiability:* Be careful not to dismiss the Indian logical tradition as merely verbal. They cared about *jalpa* (debate) rules. The risk of unfalsifiability exists if definitions are rigid, but the *explanatory power* is the test.

  7.  **Final Polish:** Check against constraints.
