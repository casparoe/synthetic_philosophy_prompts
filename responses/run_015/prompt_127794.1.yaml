      *   *Stock Example:* Person knows a cow (standard). Told "a *gavaya* (wild ox) is like a cow." Goes to forest. Sees animal. Recognizes "This is the *gavaya*."
      *   *Reductionist Challenge (Mīmāṃsā/Buddhists):* It's just inference ("It looks like a cow, so it must be the thing called *gavaya*") or testimony + perception.
      *   *Nyāya Defense:* The cognition "This is that *gavaya*" involves a unique relational complex (name-object-similarity) not captured by inference alone.

  3.  **Analyze the Three Specific Cases:**

      *   **Case 1: No Prior Perception (Description/Drawing only).**
          *   *Nyāya Commitment:* Usually requires prior knowledge of the standard (*sādhāraṇa*). If I've never seen a cow, can I know a *gavaya* is cow-like?
          *   *Vulnerability:* If *upamāna* relies on *sādṛśya* (similarity), and similarity requires grasping the relata, lacking perception of the cow weakens the claim.
          *   *Defense:* Nyāya might argue the *concept* of cow is sufficient, or this shifts the case into *śabda* (testimony) territory.
