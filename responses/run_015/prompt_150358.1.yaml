answer: |-
  In the silt-choked waters of the decommissioned Harrow Port, a crew of six salvage divers transmits two distinct manual practices without written logs or formal hierarchy. Trait A is a "Reverse Lark's Head," a complex knotting sequence performed backward on the surface before every dive; it consumes five minutes of air-time, offers no structural integrity, and is copied with near-perfect fidelity from mentor to apprentice solely because it marks membership. Trait B is a "Slippery Bowline," a functional modification that secures gear faster and reduces line fraying, but deviates from the ancestral looping pattern; it enters the group only after the oldest diver, Silas, adopts it, spreading as others mimic Silas despite each learner introducing slight variations to the hitch based on their own hand size and dexterity.

  Dawkins-style memetics predicts Trait A will dominate the cultural pool because it functions as a high-fidelity replicator; its rigid, ritualized structure ensures longevity and fecundity across generations, allowing it to outcompete other behaviors regardless of its cost to the diver. Conversely, memetics predicts Trait B will fail or mutate into unrecognizability because its transmission relies on imperfect reconstruction; without high copying fidelity, the "Slippery Bowline" accumulates errors (mutation load) that degrade its functional advantage until it disappears. In stark contrast, the guided-variation model predicts Trait A will be eliminated because learners exercise agency based on direct experience; the time cost and lack of safety benefit provide negative feedback, causing apprentices to abandon the ritual unless supported by strong prestige bias, which is absent here. Guided variation predicts Trait B will spread successfully because it combines prestige bias (mimicking Silas) with direct adaptive benefit (efficiency and equipment preservation); the model accepts that low-fidelity copying is irrelevant if learners continuously re-infer the utility of the knot and correct variations to maintain function.

  The structural feature driving this divergence is the locus of selection: memetics places selection on the *replicator* (the trait's ability to copy itself), while guided variation places selection on the *learner* (the human's ability to evaluate and modify traits). If this feature is neutralized—specifically, if copying fidelity is made perfect for both traits but learners possess no adaptive or social biases (acting as passive copiers)—the theories collapse into the same prediction: both traits persist indefinitely. Without learner biases to cull Trait A or boost Trait B, and with perfect fidelity preventing Trait B's degradation, transmission becomes a neutral drift process where initial frequency dictates survival, satisfying the replicator requirement of fidelity while removing the guided-variation requirement of evaluation.

  A defender of memetics would attack the guided-variation verdict on Trait B by arguing that without high-fidelity replication, the "functional" knot inevitably degrades over generations; even if learners seek utility, the loss of information content means the specific technique cannot be maintained as a stable cultural unit, eventually reverting to a generic, less effective tie. Conversely, a defender of guided variation would attack the memetic verdict on Trait A by arguing that cultural lineages are bound to biological fitness; a practice that costly (wasting air and time) will eventually cause the group to fail or apprentices to defect, extinguishing the replicator along with its hosts, proving that human psychology cannot be bypassed by "selfish" memes.

  This divergence does not undermine one framework but reveals a legitimate division of explanatory labor. Memetics is superior for explaining the persistence of *symbolic* or *ritualistic* culture (Trait A), where fidelity and group signaling outweigh functional utility, and where practices survive *despite* costs. Guided variation is superior for explaining *technological* or *subsistence* culture (Trait B), where functional outcomes and individual agency drive adoption, and where practices survive *because* of benefits. To force memetics to explain technological progress requires smuggling in learner psychology (admitting guided variation), while forcing guided variation to explain irrational ritual persistence requires ignoring rational choice (admitting replicator dynamics). Therefore, culture is not a monolith governed by a single evolutionary logic; it is a hybrid system where replicator dynamics govern social cohesion and identity, while learner-driven adaptation governs tool use and survival strategies. Acknowledging this duality prevents the reductionism of viewing humans as either mere vessels for memes or purely rational actors, offering a more robust account of why we tie useless knots and useful ones alike.
