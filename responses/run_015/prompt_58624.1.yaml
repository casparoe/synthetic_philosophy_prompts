answer: |-
  Hey, thanks for reaching out about this. I think your analogy about rate limits and maintenance versus abuse is actually the perfect way to frame this, so let's start there because it cuts through a lot of the noise. In platform governance, if an admin changes rate limits, the stated intent is usually system stability, but the effect might be to throttle a specific competitor or silence a specific type of traffic. Democratic backsliding theory works almost exactly like an audit of those system changes. It is not looking at whether a single law is legal on its face, because just like a config change, the law itself might be perfectly valid syntax. Instead, the theory looks at the cumulative effect of those changes on the system's ability to self-correct. So when you ask which moves in Hungary count as backsliding, the literature says it is rarely one specific move like lowering the retirement age for judges or rewriting the electoral map. Any single one of those could be defended as administrative efficiency or policy preference. The backsliding label applies because when you stack them together, they function like a lock-in mechanism. Lowering the retirement age removes independent referees, changing the media authority rules silences the critics who would report on that removal, and rewriting the electoral law ensures that even if public sentiment shifts, the translation of votes to seats remains skewed. The theory argues that this combination disables the feedback loops necessary for democracy to function, much like if you changed the rate limits, logging permissions, and deployment protocols all at once to ensure only one team could ever push code again.

  This leads directly to your question about who decides whether this is backsliding or just a mandate. This is the hardest part of the concept and where you will find the most friction between different viewpoints. If you define democracy strictly as majoritarianism, then Hungarian voters are the only ones who should decide, and if Fidesz keeps winning elections, the system is working as designed. However, the scholars who developed the backsliding concept, people like Levitsky and Ziblatt or Nancy Bermeo, are working with a liberal democracy definition, not just a majoritarian one. In their view, democracy requires not only elections but also mutual toleration and institutional forbearance, meaning parties should not use their legal powers to the hilt to crush opponents. So when you ask who decides, the answer from the literature is that it is a combination of objective metrics and expert coding rather than a simple vote count. Organizations like V-Dem or Freedom House act like the external auditors or monitoring tools in your stack. They track indicators like judicial independence, media pluralism, and civil liberties over time. The settled fact here is that across almost all these major indices, Hungary's scores dropped significantly after 2010. That is data, not opinion. What is contested is whether those scores capture the reality on the ground or if they are biased toward a specific Western liberal framework that doesn't respect national sovereignty or conservative social agendas. So while it is settled that the indicators moved in an authoritarian direction, it is contested whether that movement represents a genuine loss of democracy or a legitimate rejection of liberal norms by the electorate.

  Now let's look at your first counterfactual where these same changes happen after a clean referendum with high turnout and the opposition still wins Budapest. This stress-tests the difference between the substance of the rules and the intent behind them. The backsliding theory is actually quite clear on this point and would still classify it as backsliding. The reason is that the theory is specifically designed to catch what scholars call the suicide of democracy by legal means. They anticipate that elected leaders will use popular mandates to dismantle checks and balances. If a majority votes to remove the brakes from the car, the car is still unsafe even if the passengers voted for it. In this scenario, the fact that the opposition wins Budapest and those wins are respected is important evidence that the system is not yet fully autocratic, and some scholars might call this a hybrid regime rather than full backsliding. However, the core mechanism of backsliding is about the national level ability to rotate power. If the electoral law changes make it mathematically improbable for the opposition to win a national majority despite winning major cities, the theory says the competition is no longer fair. So in this case, what is doing the work is the foreseeable effect on future competition. The intent might be popular, and the substance might be legal, but if the effect is to entrench the incumbent indefinitely, the concept flags it as erosion.

  Your second counterfactual about a progressive government doing the same thing to fix a captured court is where the theory gets messier and where you will find honest disagreement among experts. Theoretically, the concept of backsliding is supposed to be symmetric. It should not matter if the actor is left or right; if you pack courts or weaponize regulators against opponents, it counts as erosion. However, in practice, this is where the application of the label becomes contested. Some critics argue that the backsliding literature is too focused on right-wing populism and ignores when left-wing governments weaken institutions under the guise of reform. If a progressive government argues that the courts were previously captured by oligarchs and needs restructuring to restore fairness, the backsliding framework struggles to distinguish between genuine repair and partisan capture. The theory tries to handle this by looking at whether the changes increase or decrease institutional neutrality. If the new judges are selected based on loyalty rather than merit, or if the changes make the court less independent from the executive branch regardless of who holds the executive branch, then it counts as backsliding. But you asked where the theory is silent, and this is it. The theory often lacks a clear metric for distinguishing de-capture from re-capture in real time. It usually relies on hindsight to see if the institutions remained neutral after the party left power. So while the theory claims neutrality, its application often depends on whether outside observers believe the claim of prior capture, which is inherently subjective.

  To wrap this up regarding whether the concept holds up or is just a partisan label, I think the Hungary case confirms the utility of the concept but also exposes its limitations. It confirms the concept because it shows how democracies can die without tanks in the street, validating the idea that legal incrementalism is a real threat. The pattern in Hungary matches the playbook described in the literature almost perfectly, which suggests the concept is identifying a real phenomenon and not just inventing one. However, the case also exposes a hole in how we measure intent versus effect. Because the leaders can always claim they are fixing broken systems, the concept relies heavily on external observers to make the call, which opens the door to accusations of bias. If the auditors are perceived as politically aligned, the diagnosis loses credibility. So the concept holds up as a descriptive tool for what happens to institutions, but it is weaker as a predictive tool for intent. It is settled among researchers that Hungary experienced a decline in liberal democratic indicators. It is contested whether this was a necessary correction to a flawed system or an illegitimate power grab, and it is also contested whether the same lens is applied equally to governments across the political spectrum. Ultimately, thinking of it like your rate limit analogy is the most robust way to handle it. You cannot judge the change by the commit message alone; you have to look at the logs, the traffic patterns, and whether the system remains open to other developers over time. If the changes make it impossible for anyone else to deploy, it does not matter if the admin said it was for maintenance.
