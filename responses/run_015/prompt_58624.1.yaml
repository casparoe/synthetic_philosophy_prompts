  2.  **Deconstruct the Concept of Democratic Backsliding:**
      *   *Definition:* Gradual, legal, incremental erosion of democratic institutions by elected leaders. Key distinction from coups (illegal, sudden).
      *   *Key Scholars:* Levitsky & Ziblatt (*How Democracies Die*), Bermeo, Waldner & Lust.
      *   *Mechanisms:* Capturing referees (courts, election commissions), silencing critics (media), changing rules (electoral laws), disabling checks (constitution).
      *   *The "Hungary Model":* Often cited as the paradigmatic case of legal backsliding.
      *   *Contested Areas:* Is it backsliding if voters support it? Is it backsliding if opposition still exists locally? Is the label applied symmetrically (progressive vs. conservative)?

  3.  **Address the Specific Questions within the Narrative:**
      *   *Which moves count?* It's not just one move, it's the cumulative effect on competition and accountability. Lowering judge retirement ages looks like administrative reform but functions as removal of independence. Media laws look like regulation but function as silencing.
      *   *Evidence against?* If opposition actually wins power later despite the changes. If institutions remain independent in practice despite legal changes.
      *   *Who decides?* This is the crux. Scholars look at indices (V-Dem, Freedom House). Voters might say "mandate." EU says "values." The theory usually sides with institutional integrity over simple majoritarianism.
      *   *Counterfactual 1 (Referendum + Local Wins):* This tests the "majoritarian" vs. "liberal" democracy tension. Backsliding theory argues democracy isn't just majority rule; it's constrained majority rule. So yes, still backsliding if constraints are removed, even if popular. Local wins suggest some competition remains, but if national power is entrenched, it's still erosion.
      *   *Counterfactual 2 (Progressive Government):* This tests symmetry. Theory says intent matters less than effect on institutional neutrality. If "uncapturing" becomes "recapturing," it's still backsliding. But scholars admit this is harder to measure empirically because "capture" is subjective.
      *   *Settled vs. Contested:* Settled: Hungary's democracy score dropped across major indices. Contested: Whether this was voter preference vs. manipulation, and whether the label "backsliding" is ideologically biased.

