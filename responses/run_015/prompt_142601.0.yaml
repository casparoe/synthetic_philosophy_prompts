  ### Seminar Handout: The Incremental Repugnant Conclusion
  **Topic:** Population Axiology & The Generation Ship
  **Level:** Graduate Axiology

  #### 1. The Model Construction

  To avoid the "parlor trick" objection (that the Repugnant Conclusion relies on an unimaginable leap from Quality to Quantity), we construct a **path**. We define a sequence of generations where each step is locally plausible, respecting engineering and ethical constraints, yet leads to a globally repugnant endpoint.

  **The Engine:**
  *   **Resources ($R_t$):** Total life-support capacity at generation $t$.
  *   **Population ($N_t$):** Crew size (integer).
  *   **Welfare ($w_t$):** Per-person welfare.
  *   **Production Function:** $w_t = 100 \cdot \left(\frac{R_t / N_t}{R_0 / N_0}\right)^\alpha$.
      *   We normalize $R_0 = 1000, N_0 = 1000$, so per-person share is 1.
      *   Baseline: $w_0 = 100$.
      *   **Diminishing Returns:** We set $\alpha = 0.5$ (square-root) for the base case.
      *   Inverted for Population: $N_t = R_t \cdot \left(\frac{100}{w_t}\right)^2$.

  **Constraints (The Charter):**
  1.  **Engineering Cap:** Resources can grow, but slowly. $R_{t+1} \le 1.25 R_t$.
  2.  **Welfare Floor:** No existing crew member suffers a cut $>10\%$. $w_{t+1} \ge 0.9 w_t$.
  3.  **No Improvement:** To ensure we are trading quality for quantity, $w_{t+1} \le w_t$.
  4.  **Decency:** $w_t > 0$ (Life must be worth living).
  5.  **Integrity:** $N_t$ must be an integer.

  **The Strategy:**
  To reach the Repugnant Conclusion ($N \ge 50N_0$ and $w < 0.1w_0$) as efficiently as possible, we maximize population growth at every step. This occurs when we maximize resource expansion and maximize the permissible welfare drop.
  *   Set $R_{t+1} = 1.25 R_t$.
  *   Set $w_{t+1} = 0.9 w_t$.

  **Growth Algebra:**
  $$ \frac{N_{t+1}}{N_t} = \frac{R_{t+1}}{R_t} \cdot \left(\frac{w_t}{w_{t+1}}\right)^2 = 1.25 \cdot \left(\frac{1}{0.9}\right)^2 = 1.25 \cdot 1.2345... \approx 1.5432 $$
  Population grows by ~54.3% per generation. Welfare drops by 10%.

  **Feasibility Check:**
  *   **Welfare Target:** $w < 10$.
      *   $100 \cdot (0.9)^t < 10 \implies 0.9^t < 0.1 \implies t \ge 22$.
  *   **Population Target:** $N \ge 50,000$.
      *   $N_{22} = 1000 \cdot (1.5432)^{22} \approx 13,600,000$.
      *   Condition met comfortably.

  ---

  #### 2. The Schedule (Selected Milestones)

  *Note: $N_t$ is rounded to the nearest integer to satisfy the "whole people" constraint. $w_t$ is recalculated based on integer $N_t$ and grown $R_t$, ensuring strict adherence to the 10% charter cap.*

  | Gen ($t$) | Resources ($R_t$) | Crew ($N_t$) | Welfare ($w_t$) | Total Value ($N \cdot w$) | Avg Value ($w$) | CLU Value ($N(w-20)$) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **0 (Start)** | 1,000 | 1,000 | 100.0 | 100,000 | 100.0 | 80,000 |
  | **5** | 3,052 | 8,553 | 59.0 | 504,627 | 59.0 | 333,567 |
  | **10** | 9,313 | 73,283 | 34.8 | 2,550,248 | 34.8 | 1,084,588 |
  | **12** | 14,552 | 174,691 | 28.2 | 4,926,286 | 28.2 | 1,432,466 |
  | **13** | 18,190 | 269,553 | 25.4 | 6,846,646 | 25.4 | 1,455,586 |
  | **14** | 22,737 | 416,037 | 22.9 | 9,527,247 | 22.9 | 1,206,507 |
  | **20** | 86,736 | 3,542,109 | 12.1 | 42,859,519 | 12.1 | -27,982,661 |
  | **22 (End)** | 135,525 | 13,618,402 | 9.8 | 133,460,340 | 9.8 | -138,907,700 |

  **Constraint Verification:**
  *   **Resource Growth:** $R_{22}/R_0 = 135.5$. Max allowed $(1.25)^{22} \approx 135.5$. (Binding).
  *   **Welfare Cut:** $w_{t+1}/w_t \approx 0.9$. Never exceeds 10% drop.
  *   **No Improvement:** $w_t$ strictly declines.
  *   **Decency:** $w_{22} = 9.8 > 0$.

  ---

  #### 3. Theoretical Verdicts

  We evaluate three views. $c=20$ for Critical-Level Utilitarianism (CLU).

  | Theory | Formula | Verdict on Steps (0→22) | Verdict on Endpoint (0 vs 22) | Arithmetic Derivation |
  | :--- | :--- | :--- | :--- | :--- |
  | **Totalism** | $V = \sum w$ | **Endorse All** | **Prefers End** | $V_{t+1}/V_t = \frac{N_{t+1}w_{t+1}}{N_t w_t} = 1.25 \cdot \frac{1}{0.9} \approx 1.39$. Value grows ~39% per step. |
  | **Averagism** | $V = \text{mean } w$ | **Reject All** | **Prefers Start** | $w_{t+1} = 0.9 w_t$. Mean welfare drops every step. |
  | **CLU** | $V = \sum (w-c)$ | **Switches** | **Prefers Start** | See derivation below. Switches from + to - between Gen 13 & 14. |

  **Deriving the CLU Switch Point:**
  A step $t \to t+1$ is endorsed if $V_{t+1} > V_t$.
  $$ N_{t+1}(w_{t+1} - c) > N_t(w_t - c) $$
  Substitute $N_{t+1} = N_t \cdot \frac{R_{t+1}}{R_t} (\frac{w_t}{w_{t+1}})^2$. Let $\rho = 1.25$ (resource growth) and $\delta = 0.9$ (welfare retention).
  $$ \rho \delta^{-2} (w_t \delta - c) > (w_t - c) $$
  Let $K = \rho \delta^{-2} \approx 1.5432$.
  $$ K \delta w_t - K c > w_t - c $$
  $$ w_t (K \delta - 1) > c (K - 1) $$
  $$ w_t > c \cdot \frac{K - 1}{K \delta - 1} $$
  Plugging in $c=20, K \approx 1.5432, K\delta \approx 1.3889$:
  $$ w_t > 20 \cdot \frac{0.5432}{0.3889} \approx 20 \cdot 1.397 \approx 27.94 $$
  **Result:** CLU endorses steps as long as current welfare $w_t > 27.94$.
  *   At Gen 13, $w_{13} \approx 25.4$. The step *from* 13 *to* 14 is rejected.
  *   Looking at the table: CLU Value peaks at Gen 13 ($1.45$B) and falls at Gen 14 ($1.20$B).
  *   **Colleague's Objection:** The colleague claims CLU is incoherent because it approves the sequence of moves leading to a condemned result.
  *   **Resolution:** This is not logical incoherence; it is **myopia**. CLU ranks *outcomes*, not *paths*. At $t=0$, CLU ranks Outcome 22 < Outcome 0. However, at $t=12$, CLU ranks Outcome 13 > Outcome 12. Approving a local move that contributes to a globally inferior outcome is a feature of any view that weights existing lives heavily (via the critical level). It reveals a tension between *local dominance* and *global optimality*, not a contradiction in the ranking function itself.

  ---

  #### 4. Sensitivity Analysis: The Exponent ($\alpha$)

  You suspected the exponent on the resource-welfare relation is doing the heavy lifting. You are correct. The Repugnant Conclusion relies on the ability of Quantity to overwhelm Quality. This requires diminishing returns ($\alpha < 1$).

  **Case A: Linear Returns ($\alpha = 1$)**
  *   $w \propto R/N$.
  *   Total Value $V_T = N \cdot w \propto N \cdot (R/N) = R$.
  *   **Collapse:** Total Value depends *only* on Resources. Since Resources grow by 25% per step, Totalism still endorses the steps. *However*, the "Repugnant" mass of people adds no *extra* value; they merely distribute the resource growth. The intuition that "vast numbers compensate for low welfare" vanishes because the numbers don't generate surplus value, they just consume the resource surplus.
  *   CLU Switch: $w_{switch} \approx 30.4$. Still switches, but the Totalist drive is weaker.

  **Case B: Increasing Returns ($\alpha = 1.2$)**
  *   $w \propto (R/N)^{1.2}$.
  *   Total Value $V_T = N \cdot (R/N)^{1.2} = R^{1.2} \cdot N^{-0.2}$.
  *   **Collapse:** Here, increasing $N$ *reduces* Total Value (for fixed $R$). Even with $R$ growing, the penalty from $N^{-0.2}$ dominates.
  *   **Verdict:** Totalism **rejects** the expansion steps. The Repugnant Conclusion is **avoided**.
  *   **Why:** If welfare does not diminish sharply with crowding, adding people at low welfare drags down the average so hard that the sum decreases. The RC requires $\alpha < 1$ to function.

  ---

  #### 5. Variations & Defenses

  **Hard Decency Floor:**
  If we replace the "10% cut" charter with a "Hard Floor" (e.g., $w \ge 50$), the path terminates at Gen 6 ($w \approx 53$). The Repugnant Conclusion is structurally blocked. This suggests the RC is not inevitable but depends on the *permissibility* of welfare trade-offs.

  **The Totalist Defense:**
  How does a Totalist attack this case? The strongest argument is **Non-Elitism**.
  *   *Argument:* "You call the endpoint repugnant because you are comparing $w=9.8$ to $w=100$. But the zero-point is non-existence. A life at 9.8 is still a life worth living. To deny the endpoint is to say that 13 million happy people matter less than 1,000 ecstatic people. That is elitism."
  *   *Attack Vector:* Challenge the "Repugnant" label. If the ship's charter guarantees $w > 0$, the endpoint is a **Triumphant Conclusion** (Vastly more good exists). The repugnance is an artifact of relative deprivation, not absolute badness.

  ---

  #### 6. Confidence Markers

  *   **Arithmetic (95%):** The algebraic derivation of the growth rates and switch points is robust. The 5% uncertainty lies in the integer rounding of $N_t$, which introduces minor noise into the exact welfare values (e.g., $w_{13}$ might be 25.41 or 25.39), potentially shifting the CLU switch by one generation.
  *   **Verdict Derivation (100%):** Given the definitions provided (Total, Average, CLU), the verdicts follow necessarily from the algebra. There is no framing bias here; the math dictates the ranking.
  *   **Repugnance Intuition (60%):** I am less confident that a non-specialist will find the endpoint repugnant. Philosophical conditioning is required to feel the force of the "barely worth living" intuition. Many may view 13 million lives at welfare 10 as simply *better* than 1,000 lives at 100, rejecting the premise that the conclusion is repugnant at all.
  *   **Least Sure Point:** The **integer rounding constraint**. In a continuous model, the CLU switch is exact at $w=27.94$. In the discrete "whole people" model, it is possible (though unlikely with these magnitudes) that rounding $N$ up or down could artificially inflate welfare enough to keep CLU positive for one extra step, or deflate it to trigger the switch one step early. This does not change the qualitative result, but it undermines the claim of exact precision in the "Schedule."

  **Instructor Note:** Use the $\alpha=1.2$ collapse to demonstrate that the Repugnant Conclusion is not a logical necessity of Totalism, but a contingent feature of specific empirical assumptions about diminishing returns. This moves the debate from axiology to empirical psychology/economics.
