  I'm assembling a handout for a seminar on population axiology, and the target is the repugnant conclusion. My problem is dialectical: every time I present the standard two-population comparison (a small number of excellent lives versus an enormous number of lives barely worth living), someone says it's a parlor trick — that no one ever chooses between two such distant options, and that the intuition the case is meant to embarrass only fires because the imagination is being asked to make one enormous leap. So what I want is a *path* version: a sequence of individually modest, individually approved decisions that leads, by accumulation, to an endpoint that reads as repugnant. The setting I have in mind is a generation ship with a fixed resource budget — the council sets the crew size once per generation, everyone shares the budget equally, and per-person welfare is a function of per-person resource share with sharply diminishing returns (use a square-root: normalise so that the founding crew of 1,000 has welfare 100 on a scale where 0 is the point at which a life stops being worth living). A generation may vote to expand life-support capacity by at most 25%, and the ship's charter forbids any decision that cuts an existing crew member's welfare by more than 10%; each decision must also leave every life, old and new, worth living. Build me the schedule: the actual sequence of crew sizes and per-person welfares, with whole people, from the founding generation to an endpoint of at least fifty times the founding population in which each life is worth under a tenth of a founding-era life. Tell me the largest per-generation growth rate that fits both the engineering cap and the charter cap, show that each step respects them, and confirm that no step ever makes an already-existing person better off.

  Then run the theories over it. Three views, which I'll define so we don't argue about labels: Totalism ranks populations by the sum of welfare; Averagism ranks them by mean welfare; and Critical-Levelism with a critical level of 20 ranks them by the sum of (welfare − 20), so that adding a person at exactly 20 is a matter of indifference. I want a table (every step, or every few steps plus the turning points) showing, for each transition and for the start-to-end comparison, what each of the three says and the arithmetic behind the verdict — I'm specifying the pattern I expect, but you have to derive it from the definitions, and if some part of the pattern isn't achievable without fudging, say so rather than stipulating it: Totalism should endorse every single step and the endpoint; Averagism should reject every step from the first one; Critical-Levelism should endorse the early steps, then turn against the process partway through, and I want the switch point derived (which step, at what crew size and what welfare level) rather than eyeballed. My colleague thinks that switch shows Critical-Levelism is incoherent — approving a sequence of moves whose cumulative result it condemns — and I think it's just the shape of its ranking function; settle that. After the table, tell me which single feature of the construction is doing the real work (I suspect it's the exponent on the resource-welfare relation, and I want the construction re-run at exponent 1 and at exponent 1.2 so we can see it collapse), what happens if I add a hard decency floor on per-person welfare instead of the percentage cap, and how someone who wants to keep Totalism would best attack the case — the strongest version I've heard is that the endpoint isn't repugnant at all once you notice every crew member's life is still worth living. Finally, mark your confidence: say how confident you are in the arithmetic, in the claim that each verdict really follows from the definitions rather than from my framing, and in the claim that the endpoint would strike a non-specialist as repugnant — and single out the one point in the whole construction you are least sure of.
