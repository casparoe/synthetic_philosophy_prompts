      **STAND-IN TERMS OF SERVICE**

      1.  **Eligibility and Direct Acquaintance.** The Warranty of Aesthetic Judgment provided herein is void if the Client possesses the physical capacity, temporal availability, and financial means to experience the Work directly. STAND-IN operates on the principle of necessary deference; where direct acquaintance is possible, reliance on testimony constitutes a category error. The Company assumes no liability for judgments rendered regarding Works accessible via standard streaming, public exhibition, or private copy where the Client has chosen convenience over encounter.

      2.  **Distinction Between Evaluation and Description.** Clients acknowledge the distinction between a judgment of value (the assertion that a Work *is good*) and a report of non-aesthetic features (information regarding what the Work *is like*). While STAND-IN proxies are trained to identify plot structures, color palettes, and harmonic progressions, the Company admits it is primarily engaged in the business of transmitting descriptive data. The transmission of evaluative warrant is attempted but not guaranteed, as the predicate "good" may require a phenomenological ground that testimony cannot supply.

      3.  **Proxy Experience and Ownership.** The phenomenal experience undergone by the Proxy remains the exclusive property of the Proxy. Even where the Proxy's sensibility is calibrated to match the Client's with ninety-nine percent accuracy, the qualitative character of the Proxy's viewing is not transferable. The Client purchases the right to assert the conclusion of the experience, not the experience itself. Consequently, the Client may claim knowledge of the Work's status but cannot claim to have seen it.

      4.  **Aggregation and Expertise.** In cases where Proxies disagree, STAND-IN employs an aggregate numeric score rather than deferring to a single authoritative critic. This metric reflects a commitment to statistical reliability over individual expertise. Clients should note that while a structural engineer's verdict relies on specialized access to facts, aesthetic expertise relies on contested sensibilities; therefore, the Company prioritizes consensus to mitigate the risk of idiosyncratic error, though this may dilute the strength of the resulting judgment.

