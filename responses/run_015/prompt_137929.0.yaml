      7.  **Assertion License.** Upon receipt of a Report, the Client is granted a non-exclusive license to assert the contained judgments as their own considered opinions in casual conversation. This license does not extend to academic citation, critical review, or legal testimony where firsthand verification is statutory. The warrant provided is sufficient for conversation but insufficient for expertise.

      8.  **Acknowledgment of Service Limitations.** By subscribing, the Client acknowledges that STAND-IN provides the verdict without the grounds, the knowledge without the understanding, and the authority without the experience. The Company cannot explain why this separation renders the transaction hollow without invalidating its own business model; therefore, the Client accepts that they are purchasing the shadow of a judgment rather than the substance, recognizing that the value of the aesthetic lies precisely in that which has been omitted.

