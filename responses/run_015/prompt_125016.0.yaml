      *   *Correction:* Organize by "Functional Requirements" (Cases), "Conceptual Constraints" (Distinctions), and "Logical Limits" (Tensions).

      *(Refining the "Ghost Agency" point)*: The user asks if it's a feature or bug. In a robust theory, it should be a bug. Dead people can't bear guilt. The *institution* bears it, not the ghosts. I need to make sure the desideratum demands the theory explain *where* the guilt resides if not in the ghosts.

      *(Refining the "Killer Desideratum")*: The "Non-Identity Problem" or the "Control Principle". Let's go with the Control Principle (you are only guilty for what you control). This kills transgenerational guilt unless you redefine control.

