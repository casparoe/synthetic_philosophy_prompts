      *   **Topic:** Transgenerational Collective Guilt (TCCG).
      *   **Goal:** Define the *desiderata* (requirements/criteria) for a robust theory of TCCG that isn't just metaphorical.
      *   **Key Constraints:**
          *   Must address specific cases (state atrocities, benefiting descendants, repudiating descendants, institutional turnover).
          *   Must maintain specific distinctions (guilt vs. liability, shame vs. guilt, collective agency vs. aggregation, ghost agency).
          *   Must identify jointly unsatisfiable pairs (tensions/paradoxes).
          *   Must identify the "killer" desideratum (the one that kills most popular accounts).
          *   Must score three specific accounts (Jaspers-style, Structural/Institutional, Reparative No-Guilt).
          *   Must include a "change my mind" section (epistemic humility, potential biases).
          *   Must flag unearned assumptions about group agency.
      *   **Tone:** Academic, rigorous, philosophical, direct (dissertation level).

  2.  **Deconstruct the Core Problem:**
      *   The user is struggling with the "metaphor" problem. If guilt is essentially tied to *mens rea* (guilty mind) and individual agency, how can it persist after the agents die?
      *   The user proposes an "institutional half-life" concept. This suggests a shift from *moral guilt* (internal) to *political/structural guilt* (external/relational).
      *   The task is to stress-test this proposed framework by listing what it *must* handle to be viable.

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *Case Coverage:*
          1.  *The Perpetrator State:* Needs to persist beyond regime change.
          2.  *Beneficiaries:* Those who didn't act but gained (unjust enrichment).
          3.  *Repudiators:* Those who actively oppose the legacy (can they still be "guilty"?).
          4.  *Institutional Turnover:* When no original members remain (the "Ship of Theseus" problem for moral agency).
      *   *Conceptual Distinctions:*
          1.  *Guilt vs. Liability:* Crucial. Guilt implies wrongdoing; liability implies obligation to fix. Conflating them makes guilt purely financial.
          2.  *Affective Shame vs. Normative Guilt:* Feeling bad vs. owing a debt.
          3.  *Collective Agency vs. Aggregation:* The group must act as a unit, not just a sum of individuals.
          4.  *Ghost Agency:* Are dead people still moral agents? (Likely a bug, needs handling).
      *   *Jointly Unsatisfiable Pairs (Tensions):*
          1.  *Control Principle vs. Transgenerational Persistence:* You can't be guilty of what you didn't control, but TCCG requires persistence beyond control.
          2.  *Identity vs. Turnover:* The group must be the "same" to bear guilt, but members change completely.
      *   *The Killer Desideratum:* Which one kills most theories? Usually, it's the *Control Principle* (you can't be guilty without agency/control) clashing with *Transgenerational Persistence*.

  4.  **Scoring the Accounts:**
      *   *Jaspers (Moral/Metaphysical):* Good on individual conscience, fails on transmission. Score: Low on persistence.
      *   *Structural/Institutional:* Good on persistence/turnover, risks collapsing guilt into liability. Score: High on persistence, medium on distinctions.
      *   *Reparative No-Guilt:* Good on liability, explicitly rejects guilt. Score: High on practicality, fails the prompt's core goal (defining guilt).

  5.  **Refining the "Ghost Agency" & Group Agency Assumption:**
      *   Need to be careful not to reify the group. If I say "the State is guilty," am I treating it like a person? The prompt asks to flag if I'm smuggling this in.
      *   *Ghost Agency:* Treating dead perpetrators as active nodes is usually a category error. The framework should treat them as *causal ancestors*, not *moral agents*.

  6.  **Developing the "Change My Mind" Section:**
      *   What would undermine this?
      *   Maybe the concept of "Guilt" is simply the wrong tool. Maybe "Responsibility" or "Obligation" is better.
      *   Maybe the distinction between Guilt and Liability is unsustainable in practice.
      *   Self-Critique: Am I assuming collective agency is coherent?

  7.  **Drafting the Content (Iterative refinement):**

