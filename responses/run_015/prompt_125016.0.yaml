answer: |-
  Here is the specification sheet for a robust theory of Transgenerational Collective Guilt (TCCG). This is framed as a stress test for your "institutional half-life" hypothesis. If your framework cannot satisfy these desiderata without collapsing into metaphor or incoherence, it will not survive dissertation defense.

  ### I. Functional Requirements (Case Coverage)
  A viable theory must provide a determinate verdict on the following four limit cases without ad-hoc exceptions.

  1.  **The Regime-Change Case:** The state that committed the atrocity undergoes total constitutional rupture (e.g., Nazi Germany to FRG).
      *   *Requirement:* The theory must explain why the *new* state inherits the guilt of the *old* state without relying on mystical national essence. It must locate the continuity in structure, not spirit.
  2.  **The Beneficiary Case:** Descendants who materially benefit from the atrocity (e.g., inherited wealth from expropriation) but had no causal role in the act.
      *   *Requirement:* The theory must distinguish between *unjust enrichment* (liability) and *guilt*. If the theory makes them guilty solely because they are rich off blood money, it collapses into strict liability.
  3.  **The Repudiator Case:** Descendants who actively oppose the legacy, vote against the party of perpetrators, and donate to victims.
      *   *Requirement:* The theory must explain if/why they retain a residue of guilt. If guilt is fully expunged by repudiation, it is merely a matter of current attitude, not historical inheritance. If it persists, the theory risks making moral effort irrelevant.
  4.  **The Total Turnover Case:** An institution (e.g., a church, corporation, or army) where 100% of the original members are dead and replaced.
      *   *Requirement:* The theory must identify the *locus* of the guilt. If no living human possesses the *mens rea*, where does the guilt reside? (Your "institutional half-life" must answer this specifically).

  ### II. Conceptual Constraints (Distinctions to Preserve)
  To avoid the "metaphor stretched too thin" critique, your framework must rigorously police these boundaries.

  1.  **Guilt vs. Liability:**
      *   *Constraint:* **Guilt** implies a stain on moral standing regarding a past act. **Liability** implies an obligation to repair a present harm.
      *   *Risk:* Most theories solve transgenerational transmission by converting guilt into liability (i.e., "You aren't guilty, you just owe money"). Your theory must allow for guilt *without* necessarily entailing infinite liability, or explain why the distinction dissolves over time.
  2.  **Affective Shame vs. Normative Guilt:**
      *   *Constraint:* **Shame** is about who I am (identity); **Guilt** is about what was done (action/agency).
      *   *Risk:* Descendants often feel shame for their nation's history. A theory of *guilt* cannot rely on psychological affect. It must be normative.
  3.  **Collective Agency vs. Statistical Aggregation:**
      *   *Constraint:* The group must be capable of action that is not reducible to the sum of individual actions.
      *   *Risk:* If the "collective" is just a bucket of individuals, transgenerational guilt is impossible because the individuals are dead. You must defend a non-reductive account of group agency.
  4.  **Ghost Agency (Feature or Bug?):**
      *   *Constraint:* Dead perpetrators cannot be moral agents.
      *   *Verdict:* **Bug.** A robust theory cannot treat dead perpetrators as active nodes in a moral network. They are *causal* ancestors, not *moral* co-agents. The guilt must attach to the surviving structure, not the ghosts.

  ### III. Logical Limits (Jointly Unsatisfiable Pairs)
  You cannot maximize all variables. You must choose which tension your theory resolves and which it accepts as a tragic remainder.

  1.  **The Control Principle vs. Transgenerational Persistence:**
      *   *Tension:* Moral guilt traditionally requires control (you can't be guilty of what you couldn't stop). Transgenerational guilt requires persistence beyond the window of control.
      *   *Conflict:* If you uphold the Control Principle strictly, TCCG is impossible. If you uphold TCCG, you must redefine control (e.g., control over the *legacy* rather than the *act*).
  2.  **Identity vs. Turnover:**
      *   *Tension:* For Group A to bear Group B's guilt, they must be the "same" group. But if membership turns over completely, numerical identity is lost.
      *   *Conflict:* You must choose between a thin theory of identity (structural continuity) which risks making the group a abstract fiction, or a thick theory (blood/culture) which risks essentialism.
  3.  **Forward-Looking vs. Backward-Looking:**
      *   *Tension:* Is the guilt about punishing the past (retributive) or fixing the future (reparative)?
      *   *Conflict:* If it's purely forward-looking, it's not guilt, it's policy. If it's purely backward-looking, it punishes the innocent.

  ### IV. The Killer Desideratum
  **The Control Principle (specifically, the "No Guilt Without Agency" constraint).**

  This is the single criterion that kills the most popular accounts.
  *   **Why:** Liberal individualism holds that moral guilt requires *mens rea* and voluntary action. Since descendants did not will the atrocity, attributing *guilt* (rather than obligation) to them violates the fundamental architecture of modern moral philosophy.
  *   **Your Task:** Your "institutional half-life" theory must argue that *institutions* have a form of agency and memory that survives biological death, thereby satisfying a modified Control Principle where the *institution* controlled the outcome across time, even if specific *humans* did not. If you cannot ground agency in the institution itself, you fail this desideratum.

  ### V. Comparative Scoring
  *Scale: 0 (Fails completely) to 5 (Fully satisfies)*

  | Account Type | Control Principle | Turnover Case | Guilt/Liability Distinction | Total |
  | :--- | :---: | :---: | :---: | :---: |
  | **Jaspers-Style (Moral/Metaphysical)** | 4 | 1 | 3 | **8** |
  | *Critique:* Protects individual conscience but fails to explain transmission. Guilt dies with the generation. |
  | **Structural/Institutional (Your Aim)** | 3 | 5 | 3 | **11** |
  | *Critique:* Solves turnover well, but struggles to justify "guilt" without slipping into "liability." Risks reifying the state. |
  | **Reparative No-Guilt (Pure Liability)** | 5 | 5 | 0 | **10** |
  | *Critique:* Solves the logic by denying the premise. Pragmatically useful, but philosophically abandons "guilt" entirely. |

  ### VI. Epistemic Humility & Smuggling Check

  **What would change my mind?**
  1.  **The "Ought Implies Can" Refutation:** If it can be demonstrated that institutions *literally cannot* act, only people can, then "Institutional Guilt" is a category error (like saying "the chessboard lost the game"). If group agency is proven to be merely heuristic, your framework collapses into metaphor.
  2.  **The Harm of Guilt:** If empirical evidence shows that attributing *guilt* (vs. responsibility) to descendants radicalizes them and impedes reconciliation, then the pragmatic cost outweighs the philosophical precision. The desideratum of "moral accuracy" might be less valuable than "social utility."
  3.  **The Dissolution of Distinction:** If, in practice, "Guilt" and "Liability" function identically in political discourse (i.e., no one cares about the difference), then maintaining the distinction is scholasticism.

  **Where is my reasoning likely to fail?**
  I am likely privileging **coherence over phenomenology**. I am asking for a logically tight system, but the lived experience of transgenerational trauma is messy, contradictory, and affective. A theory that satisfies the "Control Principle" might fail to capture the *reality* of how descendants actually experience the past (which often feels like guilt, regardless of logic).

  **Flag: Unearned Assumption on Group Agency**
  **Yes.** In demanding the theory distinguish "Collective Agency vs. Statistical Aggregation," I am smuggling in the assumption that **non-reductive collective agency is metaphysically possible.**
  *   *The Risk:* This is a contested claim in social ontology. If you build your dissertation on the premise that "The State can be an agent," you must defend that premise in Chapter 1. If you treat it as given, you are vulnerable to methodological individualists who will argue you are reifying a abstraction.
  *   *Mitigation:* You must explicitly state whether you are arguing for *ontological* group agency (the group is a real thing) or *functional* group agency (the group acts *as if* it is a thing for the purposes of moral accounting). Your "half-life" metaphor suggests functional, but your guilt claims suggest ontological. This tension needs resolution.

  ### Recommendation for Framing
  Do not try to prove descendants are *guilty* in the criminal/moral sense (Jaspers' first two categories). Instead, argue for a **fourth category of Jaspersian guilt** that is specifically *structural-temporal*.
  *   It is not *criminal* (no trial).
  *   It is not *political* (not just citizenship).
  *   It is not *moral* (not individual conscience).
  *   It is **Institutional**: A status attached to the *office* or *structure* one inherits, which decays over time (half-life) as the structural continuity with the atrocity weakens. This allows you to keep "Guilt" (as a stain on the institution's legitimacy) without violating the Control Principle for individual humans.
