answer: |-
  I am applying for the semester course relief and travel support to complete a project in the philosophy of history that has been circling the edges of my research for years, centered on the counterfactual question of Hitler's causal role in the Second World War. This is not a proposal to settle the historical verdict on whether the war was inevitable without him, a debate that has saturated the historiography to the point of diminishing returns. Instead, I want to address the prior philosophical condition that makes such a debate possible at all. My central question is determinate and distinct from the existing literature: under what conditions is a counterfactual about a specific individual's causal role well-posed? When historians argue over whether Hitler was a hinge or a symptom, they are often answering different questions because the antecedent of their counterfactuals is unstable. If 'without Hitler' means he was never born, that implies one possible world; if it means he died in the trenches, or remained in Vienna as a painter, or returned from the war without his political radicalization, those imply three others. I suspect the truth value of the consequent changes across these variations, yet the debate proceeds as if there is a single proposition being tested. My goal is to produce a paper that articulates the criteria for fixing the contrast class in historical counterfactuals, using this specific case as a stress test because the intuitions are so strong and the stakes so high.

  The existing positions leave this open because they are focused on the output rather than the machinery of the explanation. Structuralists argue that the conditions of Weimar made a nationalist authoritarianism likely, while Great Man theorists argue that only Hitler's specific agency unlocked the genocide and the war. They look like they are disagreeing about facts, but I suspect they are disagreeing about what counts as a relevant similarity between the actual world and the counterfactual one. The structuralist holds fixed the economic and political pressures; the individualist holds fixed the specific chain of decisions. Neither acknowledges that they are manipulating different variables in the similarity metric. Furthermore, I need to address the objection from chaos theory, which suggests that history is sensitive to initial conditions such that any change to the antecedent swamps the downstream outcome, rendering all such counterfactuals unstable. If this objection holds, it proves too much, as it would make ordinary causal explanation in history impossible. Nobody actually accepts that the assassination of an archduke cannot be cited as a cause of a war because of butterfly effects, yet we lack a principled story about why some causal chains are stable enough for explanation while others are not. I intend to argue that the chaos objection fails not because history is linear, but because historical explanation implicitly relies on a stability criterion that filters out noise, and that once we make this criterion explicit, the disagreement between structuralists and individualists shrinks significantly.

  With the semester course relief, I can dedicate the necessary time to both the philosophical architecture and the historiographical grounding required to make this credible to historians. The first month will be devoted to reading the German-language historiography that I have been unable to tackle properly during teaching terms; I read German slowly, and this project requires me to engage with the primary debates in their original language to ensure I am not attacking a straw man of the structuralist position. The second and third months will focus on drafting the paper, specifically working out the modal logic of the contrast classes and the stability criterion against the chaos objection. The fourth month will be dedicated to the workshop, which is a key deliverable of this grant. I have already spoken with a colleague in the history department who has agreed to sit in on the session, and my goal is to design a room that is mixed rather than disciplinary. I do not want the historians to feel lectured at by a philosopher telling them how to do their job; instead, the workshop will be structured around specific counterfactual claims where we test the stability of the antecedent together. I want to see if we can reach a reflective equilibrium on which variations of 'without Hitler' yield intelligible historical claims and which dissolve into speculation. The final month will be for revisions based on that feedback, ensuring the paper speaks to both philosophical and historical audiences.

  There are two or three ways this project could come out, and the considerations deciding between them are largely empirical regarding how the workshop goes. If the historians and I can agree on a stable contrast class where the structuralist and individualist claims no longer contradict but complement each other, the paper will argue that the disagreement was merely verbal, a confusion about levels of explanation. If, however, the stability criterion reveals that one side is relying on a counterfactual that is too distant from actuality to be meaningful, the paper will argue that one side is methodologically unsound. A third outcome is that the chaos objection holds more water than I expect for this specific case, suggesting that high-agency moments are inherently resistant to counterfactual analysis in a way that structural moments are not. Any of these outcomes would be a success because they clarify the conditions of historical intelligibility. However, I want to be honest about what would count as failure. The project would fail if I cannot distinguish the question I am asking from the usual historical verdict in a way that is legible to the historians involved. If the workshop devolves into a standard debate about Nazi Germany rather than a meta-discussion about the counterfactuals themselves, or if the criterion for well-posedness turns out to be so abstract that it offers no guidance for actual historical practice, then I will have produced a purely semantic exercise. I would rather identify that limitation in June than publish a paper that philosophers find tidy and historians find useless. This grant would allow me the space to ensure that the work bridges that gap, offering a tool for explanation that respects the complexity of the history while satisfying the rigor of the philosophy.
