          *   Concept: A coherent probability function *can* assign 0 to possible events. This creates vulnerability to **State-Contingent Arbitrage**.
          *   Is it a Dutch Book? Technically no, because the agent believes the loss state has measure 0. It's a "Dutch Book conditional on the truth."
          *   Cheating? No, but it suggests a market rule change (no 0 or 1 probabilities allowed).
      *   **Address Episode 2 (The Information Asymmetry):**
          *   Term: **Adverse Selection** / **Informational Edge**.
