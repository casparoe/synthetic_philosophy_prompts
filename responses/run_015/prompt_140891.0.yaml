answer: |-
  You have stumbled upon a distinction that lies at the heart of modern Bayesian epistemology and market microstructure, but which is often glossed over in introductory treatments of probability. Your nephew is half-right: the vocabulary of "Dutch Books" is the right neighborhood, but the specific house you are looking for is not *incoherence*, but rather *model misspecification* and *information asymmetry*.

  Your intuition is correct: **Coherence (internal consistency) does not guarantee immunity from loss.** Coherence only guarantees that you cannot be exploited *given your own view of the world*. If your view of the world excludes reality (Episode 1) or is less detailed than your counterparty's (Episode 2), coherence merely ensures you lose efficiently.

  Here is the precise vocabulary and conceptual framework you need to present to your committee, separating the three episodes and addressing the question of cheating.

  ### 1. Episode One: The "Impossible" Outcome
  **Established Concept:** *Violation of Regularity* (leading to *Weak Dominance*).

  In formal probability theory, **Coherence** means your odds satisfy the axioms (e.g., probabilities sum to 1). **Regularity** is a stronger condition: it requires that you assign a non-zero probability to every *logically possible* event.

  Your first member was **Coherent** but not **Regular**. By assigning a probability of zero (or pricing a ticket at zero) to an event that was physically possible, he created a **Weakly Dominated Strategy**.
  *   **Definition:** A strategy is weakly dominated if there is another strategy that is never worse and sometimes better.
  *   **Application:** Not selling the ticket was never worse than selling it (in his view, both cost nothing), but if the event occurred, not selling was better. By selling, he accepted a risk of loss with no compensating upside *in the true state of the world*, even if he perceived no risk in *his* state of the world.

  **Is this a Dutch Book?**
  Strictly speaking, no. A standard Dutch Book guarantees a loss in *every* possible world. This is a **Conditional Dutch Book** or **State-Contingent Arbitrage**. It guarantees a loss *in the subset of worlds the agent deemed impossible*.

  **Is it Cheating?**
  No. It is a **Model Risk** failure. The member failed to account for "tail risk" or "black swans." However, for the health of your market, this suggests a rule change: **Ban 0 and 1 probabilities.** (In prediction markets, this is often enforced by requiring prices between 1% and 99%). This forces members to acknowledge uncertainty.

  ### 2. Episode Two: The Better-Informed Counterparty
  **Established Concept:** *Adverse Selection* (and failure of *Bayesian Updating on the Offer*).

  This is not a defect in probability theory; it is a defect in **Game Theory**. Your victim is treating the market as a "Price-Taking" environment (like a supermarket) when it is actually a "Strategic" environment (like a poker table).

  *   **The No-Trade Theorem:** In a market of rational agents with common priors, trade should not occur. If someone offers you a bet, it is because *they* believe they have an edge. The mere fact of the offer conveys information.
  *   **The Defect:** Your victim is failing to update his probabilities based on the **signal of the offer itself**. He calculates the expected value based on his private information, ignoring the fact that the counterparty's willingness to bet implies *their* private information contradicts his.

  **Is this a Dutch Book?**
  No. This is **Informational Arbitrage**. The bookie is not exploiting a logical flaw in the victim's math; they are exploiting a gap in the victim's data.

  **Is it Cheating?**
  Generally, no. This is the fundamental mechanism of price discovery. However, in private clubs, this often falls under **Insider Trading** rules. If the "better informed" member knows a rider is injured before the official announcement, that is usually considered cheating in social markets. If they simply deduced it from public weather data faster, it is skill. You must define "Material Non-Public Information" for your club.

  ### 3. Episode Three: The Finite Bankroll
  **Established Concept:** *Martingale Strategy* and *Gambler's Ruin*.

  This is distinct from the first two. It relies on the difference between **Almost Sure Convergence** (mathematically, the profit happens with probability 1 over infinite trials) and **Finite Reality** (you run out of money before the convergence happens).

  *   **The Defect:** This is not a defect in the victim's thinking, but a defect in the **Market Structure**. The market allows liabilities that exceed assets.
  *   **The Risk:** The "guaranteed profit" is an illusion created by ignoring the **Risk of Ruin**.

  **Is it Cheating?**
  If the scheme relies on the victim accepting unlimited liability, it is predatory. Most financial markets prevent this via **Margin Requirements** or **Position Limits**. For your club, this is a safety issue. You should cap the maximum exposure any member can have relative to their bankroll.

  ### Summary for the Committee

  To settle the "cheating" question, you need to separate **Rationality Defects** from **Rule Violations**. None of these are "cheating" in the sense of breaking the rules you likely currently have, but they reveal holes in your rules.

  | Episode | Technical Name | Defect Type | Is it Cheating? | Recommended Rule |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Zero-Price** | Violation of **Regularity** | **Epistemic** (Bad Model) | No | **No 0% or 100% prices.** All outcomes must have non-zero risk. |
  | **2. The Info Edge** | **Adverse Selection** | **Informational** (Bad Data) | No* | **Insider Trading Policy.** Ban bets based on non-public info. |
  | **3. The Martingale** | **Gambler's Ruin** | **Structural** (Bad Limits) | No* | **Position Limits.** Cap max loss per member per event. |

  *\*Unless specific insider trading rules are already in place.*

  ### Proposed Vocabulary

  Your "Closed-Book" and "Open-Book" labels are intuitive, but if you want terms that will hold up to scrutiny, I suggest:

  1.  **Model Exploitation** (instead of Closed-Book): Extracting value because the victim's model of the world excludes the actual outcome (Episode 1).
  2.  **Informational Arbitrage** (instead of Open-Book): Extracting value because the bookie possesses superior data (Episode 2).

  ### The Philosophical Bottom Line

  You asked what consistency is supposed to buy you. The answer is: **Consistency buys you immunity from logic, not immunity from reality.**

  A coherent bookie cannot be forced to lose money *if their probabilities are correct*. But coherence does not make the probabilities correct.
  *   In Episode 1, the probabilities were **incomplete** (support was too narrow).
  *   In Episode 2, the probabilities were **imprecise** (conditioned on too little information).

  If you explain to your committee that **Coherence $\neq$ Calibration**, they will understand that a member can be perfectly logical and still lose their shirt. The market's job is not to protect members from their own logical consistency, but to protect them from **unlimited liability** (Episode 3) and **unfair information asymmetries** (Episode 2). Episode 1 is simply a lesson that in prediction markets, certainty is a sin.
