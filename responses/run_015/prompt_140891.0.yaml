          *   *Consistency:* Agent is coherent.
          *   *Concept:* This is **Adverse Selection** or **The Winner's Curse** in market terms. In decision theory, it's simply **Expected Value Loss** due to inferior information. It is *not* a Dutch Book. It's rational loss due to being out-informed.
          *   *Cheating?* Generally no, unless insider trading rules apply.

      *   **Episode 3 (The Finite Bankroll/Martingale):**
          *   *Situation:* Strategies requiring infinite wealth/time to guarantee profit (e.g., Martingale).
          *   *Concept:* **St. Petersburg Paradox** variants or **Martingale Strategies**. In a finite world, the "guaranteed profit" is an illusion because ruin is possible.
