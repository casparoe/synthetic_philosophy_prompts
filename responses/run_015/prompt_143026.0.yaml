      *   *Key Insight:* The justification isn't "This grant is best." The justification is "This portfolio respects the pluralism of our moral situation." But even that is too abstract for a donor. The justification to the donor must be: "This grant achieves [Outlook's Goal] to a degree that is compatible with not violating [Other Outlook's Constraint] excessively."
