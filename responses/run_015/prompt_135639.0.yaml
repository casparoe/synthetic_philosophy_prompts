answer: |-
  You have spotted something extremely sharp, and you are right: this is a distinct rhetorical maneuver that goes beyond simple inconsistency. While there isn't one single ancient Greek term for it, contemporary philosophy and argumentation theory have a very strong framework for exactly what you're describing.

  The closest established concept is the **Motte-and-Bailey Doctrine**, but when applied specifically to claims about knowledge and certainty, it creates a unique flavor of bad faith argumentation that deserves its own breakdown.

  Here is the philosophical anatomy of what you are seeing.

  ### 1. The Best Existing Name: The Epistemic Motte-and-Bailey
  The **Motte-and-Bailey Doctrine** (coined by philosopher Nicholas Shackel) describes a situation where someone holds two positions:
  *   **The Bailey:** The controversial, valuable, bold claim they want to promote (e.g., "We KNOW this is true"). It's like the open field of a castle—valuable territory, but easy to attack.
  *   **The Motte:** The modest, defensible, boring claim they retreat to when challenged (e.g., "We can't be 100% sure, but we should act"). It's like the stone tower—hard to attack, but not very valuable.

  **How it matches your observation:**
  *   **Attack Mode:** They stand out in the Bailey. They shout "WE KNOW." This rallies the troops and shames dissenters.
  *   **Defense Mode:** When you attack the "WE KNOW" claim with evidence, they retreat into the Motte. "Well, obviously nothing is 100% certain, but the risk is too high."
  *   **The Trick:** Once you stop arguing, they creep back out of the tower and start shouting "WE KNOW" again, pretending they never retreated.

  When this is done specifically with the word "know," philosophers might call this an **Epistemic Motte-and-Bailey**.

  ### 2. The Philosophical Mechanism: Epistemic Contextualism
  You mentioned that "the strength of the statement changes depending on whether they're in attack mode or defense mode." In philosophy, there is a legitimate debate called **Epistemic Contextualism**.

  This theory suggests that the word "know" changes its standards based on the context.
  *   **Low Stakes Context:** If I say "I know the bank is open Saturday," I just need to have been there last week.
  *   **High Stakes Context:** If I say "I know the bank is open Saturday" before I try to deposit a check that will bounce if I'm wrong, the standard for "know" becomes much higher.

  **The Manipulation:**
  The people you are describing are **weaponizing contextualism.**
  *   **When Persuading:** They use *Low Standards* for "know." (Evidence doesn't need to be perfect, just "good enough" to call it knowledge.) This allows them to be loud and certain.
  *   **When Challenged:** They switch to *High Standards* for "know." (Since we can't be omniscient, we can't technically "know" anything.) This allows them to deflect your critique of their evidence.

  They are sliding the definition of "know" up and down the scale to suit their immediate need, without acknowledging the slide.

  ### 3. Why It Isn't Just "Inconsistency"
  You asked how this is different from just being inconsistent or changing their mind. This is a crucial distinction.

  *   **Inconsistency is a Bug:** If someone is merely inconsistent, they are confused. If you point it out ("Wait, earlier you said you knew, now you say you don't"), they should say, "Oh, you're right, I need to figure out which one I actually believe."
  *   **This Maneuver is a Feature:** In the dynamic you described, pointing out the contradiction doesn't make them stop; it makes them switch modes. It is **functional**.
      *   The certainty is used to **silence opposition** (Social function).
      *   The uncertainty is used to **evade burden of proof** (Logical function).

  It is not a mistake in their reasoning; it is a **strategic ambiguity.** They aren't changing their mind; they are changing the *rules of the game* mid-play.

  ### 4. A Proposed Name: "Certainty Hedging" or "Epistemic Cycling"
  Since philosophers love naming things, if we were to coin a term specifically for the phenomenon you described (using certainty as a bat and uncertainty as a pillow), we might call it:

  **"Epistemic Cycling"**
  Just as a cyclist shifts gears to go faster up a hill or down a straightaway, the arguer shifts their epistemic gear.
  *   **High Gear (Certainty):** Used for momentum and offense.
  *   **Low Gear (Uncertainty):** Used for stability and defense.

  Or, perhaps more descriptively:
  **"The Pascal's Wager Shield"**
  This references the idea that "we should act anyway" (Pascal's Wager) is used as a shield to protect the claim from needing evidence, while the claim itself is presented as fact.

  ### 5. Why do they believe both versions?
  You noted: *"I think they believe both versions at once."*

  This is likely due to **Motivated Reasoning.** Their brain isn't prioritizing "truth"; it's prioritizing "outcome."
  *   Part of their brain genuinely feels the moral urgency ("We must act!"), which feels like certainty.
  *   Part of their brain genuinely understands the scientific limits ("We can't prove everything"), which feels like humility.

  When they are in "Attack Mode," the moral urgency dominates their cognition, so they *feel* like they know. When they are in "Defense Mode," the threat of being proven wrong triggers the intellectual humility defense. They aren't necessarily lying; they are **emotionally contextualizing** their truth.

  ### Summary
  You have identified a **strategic manipulation of epistemic standards.**

  *   **Formal Name:** The **Epistemic Motte-and-Bailey**.
  *   **The Mechanism:** Abusing **Epistemic Contextualism** (sliding the definition of "know").
  *   **The Difference from Inconsistency:** Inconsistency is accidental; this is **instrumental**. It is designed to make the claim unfalsifiable.

  If you want to call it out in the wild, you can say: *"You are treating your claim as a fact when it suits your rhetoric, and as a hypothesis when it suits your defense. You can't have the authority of certainty without the burden of proof."*
