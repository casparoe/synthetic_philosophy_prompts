prompt: |-
  Hey — I'm a PhD student working on blame and standing, and I've got an argument I built for a reading group last week that I'm now pretty sure proves way too much, but I can't put my finger on the move. Would love a diagnosis.

  Start with the case that got us going, which I'll call *structural hypocrisy*. A blames B for participating in some scheme — an industry, a supply chain, an institution, a professional incentive structure. A doesn't do what B does. But A's life is woven into that same scheme in a different role: A benefits from the fact that people like B do it, A would be put out if it stopped, and A hasn't made any move to exit. Some-one who flies constantly blaming an oil company's PR person for greenwashing. A meat-eater blaming a slaughterhouse worker. A journal editor blaming a grad student for CV-padding. Intuitively, A's standing looks compromised — not as badly as in plain hypocrisy, but compromised.

  Here's the argument I built off that intuition.

  (1) When A blames B for φ-ing, A implicitly asserts that B had adequate reason not to φ, and asserts it second-personally, as a demand A is entitled to make of B.
  (2) A is entitled to make such a demand only if A is not, with respect to the norm grounding the demand, in a worse or equal position than B. (Call it the clean-hands condition. The plain hypocrisy datum is supposed to fall out of this.)
  (3) What defeats standing in plain hypocrisy can't be identity of act-type: the smoking parent blaming the vaping kid hasn't vaped, and the father who cheated on his taxes can't blame his son for cheating on a test. What does the work must be something looser — that A is *implicated* in the norm A invokes: benefits from it, is disposed to keep accepting the pattern of behaviour A is calling out.
  (4) So standing is defeated by implication in a scheme, not only by having performed the same act.
  (5) Implication in this sense is nearly universal. Almost anyone who blames anyone for anything is a net beneficiary of some scheme that produces or enables wrongs of the relevant kind, and is disposed to go on benefiting.
  (6) Standing is a status of the blamer *with respect to the norm*, not with respect to the particular act blamed, so if it's defeated at all it's defeated across everything that norm covers.
  (7) So almost nobody has standing to blame almost anyone for almost anything.
  (8) But some blame is apt and some isn't, and the whole point of the category is to mark that difference. A view on which standing is basically never present doesn't distinguish apt from inapt blame, it just deletes the distinction we set out to draw.

  And the bit that makes me most suspicious: the argument seems to get things backwards. The worse and more systemic the wrong, the more scheme-like it is, so the more likely it is that any given blamer is implicated — which means the argument strips standing most aggressively exactly where we'd most want to insist that the blame is fine.

  I'd like to keep (3) and (8) if I possibly can — the move off act-type identity feels right to me and I don't want to go back to it. My friend says the flaw is (6) and that standing is local to the norm rather than global. But if I just localize it I don't see how I still get the smoking parent, whose relation to the norm looks local in exactly the way my friend says is fine.

  Which step do you reject? Why did it look okay, and what does rejecting it cost me — do I lose the structural-hypocrisy intuition, do I have to say something weird about the parent case, or is there a version of the argument that survives? Also: could the fix be that standing is restored by *acknowledging* implication, i.e. that self-blame buys it back? If so I'd want to know whether that makes standing suspiciously cheap, or whether it's actually the right story and my argument just shows that.

  Sorry if this is undercooked, I've been staring at it too long.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** PhD student working on blame and standing.
      *   **Context:** Built an argument for a reading group, now suspects it "proves too much" (reductio ad absurdum).
      *   **Core Intuition:** "Structural Hypocrisy" compromises standing (e.g., meat-eater blaming slaughterhouse worker).
      *   **The Argument:** An 8-step syllogism leading to the conclusion that *almost nobody has standing to blame almost anyone* (Step 7), which contradicts the purpose of standing (Step 8).
      *   **Constraints/Preferences:** Wants to keep (3) (implication > act-type identity) and (8) (standing must distinguish apt/inapt blame). Friend suggests rejecting (6) (global vs. local standing), but user is skeptical about how that saves the smoking parent case.
      *   **Specific Questions:** Which step to reject? Why did it look okay? What are the costs? Does acknowledging implication restore standing?

  2.  **Deconstruct the Argument:**
      *   (1) Blame implies a second-personal demand/entitlement. (Standard Wallace/Darwall style).
      *   (2) Entitlement requires "clean hands" (not worse/equal position re: the norm).
      *   (3) Clean hands isn't about *same act*, but about *implication* in the norm (benefits, disposition).
      *   (4) Standing defeated by implication in a scheme.
      *   (5) Implication is nearly universal (we all benefit from bad systems).
      *   (6) Standing is global re: the norm (if lost, lost for everything under that norm).
      *   (7) Conclusion: Almost no standing.
      *   (8) Objection: This destroys the distinction standing is meant to mark.

  3.  **Identify the Weak Links:**
      *   *Step (2):* "Worse or equal position." This is the "Clean Hands" condition. Is it too strong? If I benefit from a system, am I in an "equal" position to the direct perpetrator? Usually, we think the perpetrator is *worse* off morally. If the blamer is merely a beneficiary, are they "equal"?
      *   *Step (5):* "Implication is nearly universal." This relies on a very broad definition of "scheme." Is the meat-eater *really* implicated in the *same norm violation* as the slaughterhouse worker? Or are they violating different norms (consumption vs. killing)?
      *   *Step (6):* "Standing is global re: the norm." This is the friend's suggestion. If standing is local to the *specific violation* or *role*, does it help?
      *   *Step (3):* The definition of "implication." This is the user's favorite, so try to save it.

  4.  **Evaluate the "Structural Hypocrisy" Intuition:**
      *   The intuition is that the meat-eater lacks standing to blame the worker. Why? Because the eater *needs* the worker to do the dirty work. The eater is *complicit*.
      *   But does the eater lack standing to blame the *company*? Or the *policy*?
      *   Crucially: Does the eater lack standing to blame the worker for being *cruel*? Or just for *doing the job*?
      *   The "proves too much" problem arises because *everyone* is complicit in *something*. If complicity kills standing, no one can blame.

  5.  **Develop a Diagnosis:**
      *   **The Primary Culprit:** Step (2) and Step (6) working together. Specifically, the definition of "position" in (2) and the scope in (6).
      *   **The "Equality" Problem:** In structural hypocrisy, A (beneficiary) is usually *not* in an equal moral position to B (perpetrator). B is the direct agent of harm. A is a beneficiary. To say they are "equal" regarding the norm is to flatten moral distinction between principal and accessory/beneficiary.
      *   **The "Norm Granularity" Problem (attacking 6):** The friend is right, but the user's worry about the smoking parent is also right. We need a nuanced version of (6). Standing isn't global over "The Norm of Health" or "The Norm of Honesty." It's specific to the *commitment* undertaken.
      *   **The "Acknowledgement" Fix:** The user asks if acknowledging implication restores standing. This sounds like the "Turnaround" or "Repentance" condition in the literature (e.g., Todd, Fritz). It's not that acknowledgement *buys* standing, but that *denial* of implication (hypocrisy) loses it.

  6.  **Drafting the Response:**

      *   **Validation:** Acknowledge the sophistication of the argument. It's a known problem in the literature (the "complicity" or "structural injustice" challenge to standing).
      *   **Diagnosis:** The error is in **Step (2)** (the formulation of the Clean Hands Condition) combined with **Step (5)** (the scope of implication).
      *   **Why (2) is the trouble:** "Worse or equal position" is too blunt. We need to distinguish between *violating* a norm and *benefiting* from its violation. The slaughterhouse worker *violates* the norm (killing). The meat-eater *benefits*. They are not in an "equal" position regarding the *authority* to demand compliance, even if both are morally tainted.
      *   **Refining (3) & (6):** The friend is right about (6), but needs refinement. Standing is local to the *specific commitment* or *role*, not just the abstract norm.
          *   *Smoking Parent:* Violates the norm of "protecting child's health" directly.
          *   *Meat Eater:* Violates the norm of "not supporting killing" perhaps, but the worker violates "do not kill."
          *   *Distinction:* Direct agency vs. structural participation.
      *   **The "Acknowledgement" Question:** This is the "Turnaround" view (Todd). It doesn't make standing cheap; it makes it *earned* through moral repair. It solves the "proves too much" by allowing implicated agents to blame *if* they acknowledge their complicity.
      *   **Proposed Fix:** Modify (2). Standing is lost not by *implication* simpliciter, but by *unacknowledged implication* that undermines the *authority* of the demand.
      *   **Addressing the "Systemic Wrong" Paradox:** The user notes the argument strips standing most where wrongs are systemic. The fix must allow victims or less-implicated agents to blame. If *everyone* is implicated, we need a theory of *degrees* of standing or *collective* standing.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   Wait, if I say "acknowledgement restores standing," does that solve the structural case? If the meat-eater says "I know I'm complicit, but you shouldn't kill," do they have standing? Intuitively, maybe less, but some.
      *   Better move: Distinguish between *hypocrisy* (claiming moral superiority one doesn't have) and *complicity* (being involved in the structure). Hypocrisy defeats standing because it's a false claim to authority. Complicity complicates it but doesn't necessarily erase authority unless the complicity is equal to the blamee.
      *   So, reject the "Equal Position" clause in (2). A beneficiary is rarely in an *equal* position to the direct perpetrator.
      *   Also, attack (5). Is implication *really* universal in the relevant sense? Being a citizen of a state that wars is different from being a soldier.
      *   Let's focus on **Step (2)** as the primary break point. The "Clean Hands" condition is too strong. It should be a "No Greater Fault" condition, but "Fault" needs to be calibrated to *agency*, not just benefit.

  8.  **Finalizing the Advice:**
      *   **Target:** Step (2) and Step (6).
      *   **Reason:** (2) conflates *benefiting* from a wrong with *committing* it. (6) makes the loss of standing too contagious.
      *   **Cost:** You have to accept that structural complicity *dims* standing but doesn't *extinguish* it (unless the complicity is tantamount to co-authorship).
      *   **Acknowledgement:** Yes, this is the "Turnaround" view. It's not cheap; it requires moral work.

  9.  **Structure of the Response:**
      *   Empathize/Validate (This is a strong argument, touches on the "Complicity Objection").
      *   Diagnose the specific move (The slide from "Hypocrisy" to "Complicity" in Step 2/3).
      *   Analyze Step (2): The "Equal Position" trap.
      *   Analyze Step (6): The "Norm Granularity" issue (addressing the friend's point).
      *   Address the "Acknowledgement" fix (The Todd/Fritz line).
      *   Conclusion: How to save the structural intuition without the reductio.

  10. **Tone:** Collegial, precise, philosophically rigorous (PhD level). Use terminology appropriate for the field (second-personal authority, moral standing, complicity, turnaround).

  *(Self-Correction)*: I need to make sure I address the "Smoking Parent" worry regarding the friend's suggestion about (6). If standing is local, why does the smoking parent lose it? Because the parent's commitment to the child's health is the *specific* norm instance. The meat-eater's commitment is different. I need to explain *why* the parent case works on a localized view but the structural case doesn't trigger total loss.

  *Plan:*
  1. Validate the "proves too much" worry (it's the "Complicity Challenge").
  2. Pinpoint Step (2) as the main culprit (conflating benefit with violation).
  3. Pinpoint Step (6) as the amplifier (globalizing the defect).
  4. Discuss the "Acknowledgement" fix (Turnaround).
  5. Offer a reconstructed argument that keeps (3) and (8).

  Let's write.
answer: |-
  This is a sharp argument, and you are right to be worried. You have effectively reconstructed the **"Complicity Challenge"** to standing theories, which has been circulating in the literature (e.g., in work by Todd, Fritz, Bell, and others working on structural injustice). The worry is precisely the one you identified: if standing requires clean hands, and clean hands are impossible in a structurally unjust world, standing becomes an elitist luxury good, or the concept collapses entirely.

  You want to keep (3) (implication > act-type) and (8) (standing must do work). I think you can do this, but you have to break the argument at **Step (2)** and temper **Step (6)**.

  Here is the diagnosis of where the move goes wrong, why it looked plausible, and how to fix it without losing your structural-hypocrisy intuition.

  ### 1. The Primary Culprit: Step (2) and the "Equal Position" Trap

  **The Step:** *(2) A is entitled to make such a demand only if A is not, with respect to the norm grounding the demand, in a worse or equal position than B.*

  **Why it looked okay:** It captures the core intuition of hypocrisy: you can't demand of others what you don't demand of yourself. It explains why the smoking parent lacks standing (they are in an "equal or worse" position regarding the norm of health/safety).

  **Why it proves too much:** It conflates **violating** a norm with **benefiting** from its violation. In your structural cases (meat-eater/slaughterhouse worker), A is a *beneficiary* of the scheme, while B is the *direct agent* of the harm.
  *   **The Error:** Treating the beneficiary and the perpetrator as being in an "equal" position with respect to the norm.
  *   **The Fix:** They are not in equal positions. B has *violated* the primary obligation (do not kill/do not greenwash). A has failed a secondary obligation (do not benefit from killing/do not support greenwashing).
  *   **The Cost:** You must abandon the idea that *any* implication defeats standing. Instead, standing is defeated only when the blamer's implication undermines their **authority** to make the demand. Usually, direct agency carries more moral weight than structural benefit. The meat-eater is complicit, but the worker is the one doing the killing. The worker cannot deflect the blame by saying "You eat the meat." That's a *tu quoque*, not a standing objection, unless the eater claims moral superiority they don't have.

  **Recommendation:** Modify (2). Standing is defeated not by *implication simpliciter*, but by **unacknowledged implication that creates a false claim to moral superiority.** This preserves (3) without triggering the universal loss of standing.

  ### 2. The Amplifier: Step (6) and Norm Granularity

  **The Step:** *(6) Standing is a status of the blamer with respect to the norm, not with respect to the particular act blamed, so if it's defeated at all it's defeated across everything that norm covers.*

  **Why it looked okay:** It ensures consistency. If I'm a hypocrite about honesty, I can't blame you for lying about *anything*.

  **Why it proves too much:** It treats norms as monolithic blocks ("Honesty," "Non-violence," "Health"). But standing is often **role-specific** or **relationship-specific**.
  *   **Your Friend is Right (mostly):** Standing is local. But your worry about the smoking parent is also right. Here is the distinction:
      *   **Smoking Parent:** The norm isn't just "Health." It's "Parental Duty to Protect Child's Health." By smoking, the parent directly violates the specific commitment that grounds their authority over the child. The standing loss is local to that relationship/norm cluster, but it *does* cover the vaping because both fall under "protecting the child from inhalation risks."
      *   **Meat-Eater/Worker:** The norm is not identical. The worker violates "Do not kill." The eater violates "Do not support killing." These are different normative commitments. The eater's failure in their commitment does not automatically strip them of the authority to demand the worker adhere to *their* commitment, *unless* the eater claims to be innocent of the system.

  **The Fix:** Reject the global scope of (6). Standing is local to the **specific normative commitment** that grounds the authority to blame. This stops the "universal implication" (Step 5) from wiping out standing for *everything*. I might be implicated in the oil industry, but that doesn't strip my standing to blame my neighbor for domestic violence, because the normative commitments are distinct.

  ### 3. The "Acknowledgement" Fix (The Turnaround View)

  You asked: *Could the fix be that standing is restored by acknowledging implication?*

  Yes, this is a live option in the literature (often associated with **Patrick Todd** or **Jeanette Kennett**). This is the **"Turnaround"** view.

  *   **The Story:** Hypocrisy defeats standing because it involves a *dissimulation* of moral status. I pretend to be outside the norm I am invoking. If I acknowledge my complicity ("I know I eat meat, and I am troubled by my own role in this, but what you are doing is wrong..."), I am no longer claiming a moral superiority I lack.
  *   **Does it make standing cheap?** No. It makes standing **expensive in a different way.** It requires moral self-reflection and vulnerability. It transforms the blame from a "holier-than-thou" verdict into a **mutual moral demand.**
  *   **Does it save the Structural Case?** Yes. The meat-eater *can* blame the worker if they acknowledge their own entanglement. In fact, this might be the *only* way structural blame works. It becomes a call for collective exit from the scheme, rather than a unilateral condemnation.
  *   **The Cost:** You have to accept that "pure" standing (the innocent bystander) is rare. Most apt blame in a structural context will be "implicated blame." This fits your intuition (8) because it still distinguishes apt blame (acknowledged implication) from inapt blame (hypocritical denial).

  ### 4. Reconstructing the Argument

  Here is how you can rebuild the argument to keep your structural intuition without the *reductio*:

  1.  **Blame** asserts a second-personal demand grounded in a shared normative commitment.
  2.  **Standing** is lost when the blamer's relationship to that norm undermines their authority to make the demand.
  3.  **Hypocrisy** undermines authority when the blamer **denies their own implication** in the norm they invoke (preserving your Step 3).
  4.  **Structural Implication** (benefiting from a scheme) does not automatically defeat standing, because benefiting is not equivalent to direct perpetration (rejecting Step 2's "equal position" clause).
  5.  **However,** if the blamer **conceals** their structural implication while blaming the perpetrator, they commit *structural hypocrisy*, and standing is compromised (preserving your core intuition).
  6.  **Acknowledgement** of implication restores standing by converting the demand from a verdict into a mutual challenge (the Turnaround fix).
  7.  **Therefore,** standing is not universal (Step 7 is false), but it is also not impossible. It is contingent on the **honesty of the blamer's self-presentation** regarding their own implication.

  ### Summary of Costs and Benefits

  *   **Rejecting (2):** You lose the "Clean Hands" requirement. You replace it with a "No False Superiority" requirement.
      *   *Cost:* You can't say the meat-eater *never* has standing. You can only say they lack standing if they pretend to be innocent.
      *   *Benefit:* You avoid the conclusion that no one can blame anyone in a capitalist/structurally unjust world.
  *   **Rejecting (6):** You accept that standing is local to specific commitments.
      *   *Cost:* You have to do the hard work of individuating norms (why is "parental health" different from "general health"?).
      *   *Benefit:* It stops the "contagion" of standing loss. My complicity in oil doesn't stop me from blaming you for plagiarism.
  *   **Accepting Acknowledgement:**
      *   *Cost:* Blame becomes more dialogical and less verdict-like.
      *   *Benefit:* It solves the "proves too much" problem perfectly. Everyone is implicated, but everyone can still blame *if* they own it.

  ### Final Thought on the "Systemic Wrong" Paradox

  You noted: *The worse and more systemic the wrong... the more likely it is that any given blamer is implicated — which means the argument strips standing most aggressively exactly where we'd most want to insist that the blame is fine.*

  This is the strongest reason to reject Step (2). If structural injustice is ubiquitous, a theory of standing that requires isolation from the structure renders moral critique impossible precisely where it is most needed.

  By shifting the focus from **ontological status** (Am I clean?) to **communicative stance** (Am I honest about my dirt?), you preserve the ability to critique systemic wrongs without falling into hypocrisy. The meat-eater *should* blame the slaughterhouse, but they must do it as a co-conspirator seeking a way out, not as a judge from the bench. That preserves the aptness of the blame (8) while honoring the structural intuition.
