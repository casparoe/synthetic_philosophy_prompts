answer: |-
  **The Scenario**

  Dr. Aris Thorne, the director of a public hospital, must decide whether to implement Protocol Alpha (Action A) or maintain the Status Quo (Action B). Protocol Alpha mandates the immediate reallocation of five dedicated ventilators from five specific, long-term patients to a newly arrived surge ward. Under Alpha, the five long-term patients will certainly die due to breach of their established care contracts, but the surge ward will save 500 lives that would otherwise be lost. Under the Status Quo, the five long-term patients survive, but the 500 surge patients die. Thorne is morally uncertain: she assigns a 60% credence to Act Utilitarianism (which evaluates actions solely by total lives saved) and a 40% credence to a Rights-Based Deontology (which holds that violating a specific patient's right to care is strictly forbidden, regardless of aggregate consequences). She takes both frameworks to be cognitively significant and neither to be obviously false.

  **The Analysis**

  **1. Expected Moral Value (EMV)**
  To calculate EMV, Thorne must assign cardinal values to outcomes within each framework and sum them weighted by her credences. Let the value of a life saved be $+1$ util and the value of a rights violation be $-K$ deontic units.
  *   **Utilitarian Value:** $V_U(A) = +500$, $V_U(B) = +5$.
  *   **Deontological Value:** $V_D(A) = -K$ (forbidden act), $V_D(B) = 0$ (permissible act).
  *   **EMV Calculation:**
      *   $EMV(A) = 0.60(500) + 0.40(-K) = 300 - 0.4K$
      *   $EMV(B) = 0.60(5) + 0.40(0) = 3$
  *   **Verdict:** EMV endorses **A** if and only if $300 - 0.4K > 3$, which simplifies to $K < 742.5$.
  *   **Structural Feature:** **Intertheoretic Comparability.** For EMV to endorse A, Thorne must stipulate an exchange rate where the disvalue of violating five rights ($K$) is normalized to be less than 742.5 utility units. This is a hidden stipulation; there is no objective fact about how many "utils" equal one "rights violation." If she adopts a scale where rights are inviolable ($K \to \infty$), EMV flips to B.

  **2. Satisficing (Veto Rule)**
  This rule requires choosing an action that is permissible according to *all* plausible moral frameworks (or at least, refusing any action condemned by a credible framework).
  *   **Test:** Is A permissible under Utilitarianism? Yes. Is A permissible under Deontology? No (it violates rights).
  *   **Verdict:** Since A is condemned by a framework to which she assigns significant credence (40%), A is vetoed. B is permissible under both (Utilitarianism views it as suboptimal but not forbidden). The rule endorses **B**.
  *   **Structural Feature:** **Ordinal/Deontic Robustness.** This rule relies only on the binary status (permissible/forbidden) within each theory. It does not require comparing the *magnitude* of a rights violation to the *magnitude* of welfare gain. Changing the exchange rate $K$ has no effect on the verdict.

  **3. Removal of the Feature**
  If the feature of **Intertheoretic Comparability** is removed (i.e., if we assert there is no fact of the matter about the ratio between utils and rights), the EMV calculation collapses entirely; the terms $0.60(500)$ and $0.40(-K)$ cannot be added. The case dissolves into indeterminacy for EMV. The Satisficing verdict remains unchanged, as it never required the comparison.

  **4. Critique and Verdict**
  The strongest attack comes from the defender of the Satisficing rule against EMV: **The Arbitrariness Objection.** Because there is no metaphysical ground for claiming that 500 lives "outweigh" 5 rights violations in a common currency, the EMV endorsement of A rests on an arbitrary normalization choice by the agent. She can effectively guarantee any outcome she prefers by adjusting the exchange rate $K$.

  The defender of EMV attacks Satisficing with the **Paralysis Objection:** if every plausible theory vetoes different actions, the agent cannot act. However, in this specific case, the Arbitrariness Objection lands more decisively. The EMV result is not derived from the moral facts plus uncertainty, but from the moral facts plus an *extra* unmotivated assumption about scaling. The Satisficing rule respects the integrity of the Deontological constraint without requiring Thorne to claim knowledge she lacks (the exchange rate). Therefore, the EMV rule comes out badly; it masks a substantive moral commitment (that rights are tradeable) as a mathematical necessity.
