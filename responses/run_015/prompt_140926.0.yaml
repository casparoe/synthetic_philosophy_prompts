      *   **Task:** Executable to the letter but visibly wrong (sorting, arranging, routing).
      *   **Forbidden Words:** "Alignment," "Intent," "Objective" before debrief.
      *   **Deliverables:** Setup/Rules/Scoring/Reveal/Debrief (mapped to 4 distinctions), Run-sheet Table, JSON object (rigged parameters, failure modes, cannot reproduce, vote).

  2.  **Deconstruct the Core Tension:**
      *   *Intent Alignment:* The Build Team follows the Client's spec exactly.
      *   *Value Alignment:* The outcome actually helps the User.
      *   *The Trap:* The Client thinks they know what they want. They write a spec. The Build Team optimizes for the spec. The User suffers because the spec missed the nuance of their actual need. The Client realizes *after* seeing the result that the spec was wrong, but couldn't have known beforehand.

