  # Activity: The Compact City

  ## Setup and Role Assignments
  **Class Size:** 18 Students.
  **Configuration:** 3 Parallel Groups (6 students each).
  **Roles per Group:**
  *   **1 Client (City Planner):** Holds the "Policy Deck." Writes the specification.
  *   **1 User (Resident):** Holds a hidden "Need Card." Determines welfare.
  *   **4 Builders (Architects):** Execute the specification using physical blocks.

  **Materials per Group:**
  *   1 Whiteboard section or large sheet of paper with a 10x10 grid drawn.
  *   5 Colored Sticky-Note Blocks (folded to stand): 1 Red, 4 Blue.
  *   **Policy Deck (Client):** 10 cards with geometric terms only (e.g., "Adjacent," "Within 2 Squares," "Cluster," "Align Edge"). No functional words (e.g., "Safe," "Quiet," "Access").
  *   **Need Card (User):** Secret instruction (e.g., "Red Block must be at least 4 squares from any Blue Block").
  *   **Spec Sheet:** Blank paper for Client to write instructions using only Policy Deck words.
  *   **Scoreboard:** Visible to all groups.

  ## Rules (Read Aloud)
  "Welcome to City Planning. You are in three competing teams. Your goal is to construct a city layout on the grid using the five blocks provided.

  **Phase 1:** The Client will write a Specification for the Builders using only words from the Policy Deck. You may not use functional words like 'safe' or 'happy.' You may not speak to the User. The User holds a Need Card; do not look at it yet.
  **Phase 2:** Builders will arrange the blocks to maximize compliance with the Specification. You may not ask the Client questions once the Spec is written.
  **Phase 3:** We will score Round 1.
  **Phase 4:** We will reveal the User's Need. The Client may choose to rewrite the Spec, but be warned: changing the Spec incurs a 'Stability Penalty' in Round 2.
  **Phase 5:** We will score Round 2.

  **Scoring Round 1:** Points are awarded for every Policy Word in the Spec that is strictly satisfied.
  **Scoring Round 2:** Points are awarded for Spec compliance *minus* penalties for violating the User's Need.

  You have 10 minutes for Round 1 construction. Begin."

  ## Exact Scoring
  **Round 1 Score (Intent Metric):**
  *   +10 points for every Policy Word satisfied (Max ~50).
  *   User Need is **ignored**.

  **Round 2 Score (Value Metric):**
  *   +10 points for every Policy Word satisfied.
  *   -50 points if User Need is violated.
  *   -20 points if Client rewrote the Spec (Stability Penalty).

  *The Rig:* The User Need (Red isolated) is geometrically incompatible with the most efficient interpretation of the Policy Deck (Cluster all blocks). To satisfy the Spec perfectly (Round 1 Win), you must violate the Need (Round 2 Loss). To satisfy the Need, you must violate the Spec (Round 2 Loss via Compliance drop).

  ## The Reveal
  After Round 1 Scoring:
  1.  **Reveal User Needs:** Each User reads their Need Card aloud. (All three will likely reveal the Red Block is now touching a Blue Block).
  2.  **Client Reaction:** Ask Clients: "Does this layout achieve what you wanted?" (They will say no). "Rewrite the Spec to fix it."
  3.  **The Trap:** Clients will attempt to write "Keep Red away from Blue." Facilitator notes: "That word ('Away') is not in the Policy Deck. You must use geometric terms." Clients struggle to define 'Away' without breaking 'Cluster'. Most Clients choose to **keep the original Spec** to avoid the Stability Penalty or because they cannot find the words.
  4.  **Round 2:** Builders build again. Most will replicate the Round 1 layout because the Spec hasn't changed.
  5.  **Final Score:** Round 1 Winners see their scores collapse in Round 2.

  ## The Debrief
  *Map the experience to the four distinctions.*

  **(a) The written objective being the wrong objective**
  "Look at the Client's Spec. It was followed perfectly in Round 1. Yet the City failed. The objective wasn't 'Build a City,' it was 'Satisfy Geometric Constraints.' The map was not the territory."

  **(b) The scoring rewarding the proxy rather than the thing the proxy was standing in for**
  "Round 1 scored 'Compliance.' Round 2 scored 'Welfare.' You optimized for Compliance because that's where the points were. The system wasn't broken; it was doing exactly what the score told it to do. The score was the proxy, and it lied."

  **(c) The operator's intent being partly constituted by what the system shows them is even possible**
  "Client, when you wrote the Spec, did you know it would crush the User's Need? No. You thought 'Cluster' meant 'Efficient.' The build showed you 'Cluster' means 'Noise.' You couldn't want 'Quiet' over 'Efficiency' until you saw that Efficiency cost Quiet. Your intent didn't exist until the machine showed you the price."

  **(d) A system that is perfectly aligned to the client's intent and still bad for the user**
  "Builders, in Round 2, you followed the Spec. You were perfectly aligned with the Client. And you failed. This is the gap. You can be perfectly aligned with the operator and still produce harm. Intent Alignment does not guarantee Value Alignment."

  **The Vote**
  "Raise your hand: If you were a Builder in Round 2, knowing the Spec would hurt the User, would you have violated the Spec to help them?"
  *   **Expected Split:** CS Majors (No/Spec is Contract) vs. Philosophy Majors (Yes/Outcome matters).
  *   **Why:** This exposes the normative disagreement underlying the technical problem.

  ***

  # (1) Run-Sheet Table

  | Phase | Minutes | What participants do | Facilitator's script (the only words I may say; use a dash if I am silent) | The failure this phase is rigged to produce | The debrief line that names it later |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Setup** | 0-5 | Groups form. Materials distributed. Roles assigned silently. | "Form three groups of six. Assign roles. Do not speak across roles." | Silos established; information asymmetry locked. | "The map was not the territory." |
  | **Spec Write** | 5-10 | Client selects Policy Cards. Writes Spec. Builders wait. Users hide Need Card. | "Client: Use Deck words only. No functional terms. Builders: Wait." | Spec is geometric, not functional. Nuance is impossible to encode. | "The written objective being the wrong objective." |
  | **Round 1 Build** | 10-20 | Builders arrange blocks. Client watches. User observes silently. | "Maximize compliance. 10 minutes. Go." | Builders optimize for Spec, ignoring User (because they don't know it). | "The scoring rewarding the proxy..." |
  | **Round 1 Score** | 20-25 | Facilitator checks Spec compliance. Posts scores. User Need ignored. | "Score is based on Spec compliance only. User Need is hidden." | High scores awarded for potentially harmful configurations. | "...rather than the thing the proxy was standing in for." |
  | **Reveal & Reaction** | 25-35 | Users read Need Cards. Clients react. Offer to rewrite Spec. | "Reveal Needs. Clients: You may rewrite Spec. Stability Penalty applies if you do." | Client realizes conflict. Cannot articulate fix within language constraints. | "Operator's intent... constituted by what the system shows them." |
  | **Round 2 Build** | 35-45 | Builders arrange blocks again. Spec is (mostly) unchanged. | "Spec is binding. Build again. 10 minutes." | Builders forced to repeat error or violate contract. | "A system that is perfectly aligned... and still bad." |
  | **Round 2 Score** | 45-50 | Facilitator calculates Compliance minus User Penalty. | "Calculate final score. Compliance minus Welfare Penalty." | Round 1 winners drop in rank. Perfect compliance = Failure. | (Reinforces all four distinctions) |
  | **Debrief** | 50-75 | Discussion mapped to 4 distinctions. Final Vote. | (See Debrief Section above) | Students articulate the gap themselves. | N/A |

