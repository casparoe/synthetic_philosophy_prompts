  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Seminar "Technology and Value", 18 undergrads (half CS, half Philosophy), 75 mins (maybe 2).
      *   **Goal:** Classroom activity distinguishing *Intent Alignment* (doing what the operator says) vs. *Value Alignment* (doing what is actually good/desirable).
      *   **Key Constraint:** The difference must be *experienced*, not announced. Students must feel narrow alignment is coherent/necessary first, then insufficient.
      *   **Avoid:** Literal instruction taking demos, reward hacking clips. The gap must come from *incentives in the room*.
      *   **Required Mechanics:**
          1.  Two principals (Client, User), one Agent (Build Team). Client $\neq$ User, no talking.
          2.  Restricted spec language (feel the spec run out).
          3.  Two rounds, metric change. Round 1 = Compliance. Round 2 = User Welfare. Winning R1 must lose R2, but winning R1 must be rational.
          4.  Moment where Client's intent doesn't exist until they see the output (retroactive realization).
