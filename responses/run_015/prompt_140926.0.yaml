      *   How does Client learn User Need?
      *   Facilitator reveals User Need to Room after R1.
      *   Client sees it. Client reacts.
      *   This maintains the "No Talk" rule.

      *(Final Check on Constraint 3)*: "Winning round 1 is the move which loses round 2."
      *   Move R1: Cluster (Max Spec Score).
      *   Move R2: If they Cluster again -> Low Total Score (due to User Penalty).
      *   If they Uncuster -> Low Total Score (due to Spec Penalty).
      *   So the R1 Winning Move *becomes* a Losing Move in R2 scoring, even if they repeat it.
      *   This satisfies the constraint.

      *(Wait, Constraint 4)*: "Client... unable to specify in advance what they would have said instead."
      *   This needs to happen *before* R2 Build.
      *   Facilitator asks Client: "Rewrite Spec."
      *   Client struggles. Keeps old Spec.
      *   This locks the R2 failure.

