      *   *Wait, let's make it more visceral.* **"The Shelter."**
      *   *Task:* Build a structure or arrange barriers to protect the User from "elements" (balls thrown? noise?).
      *   *Too chaotic.*

      *   *Let's try "The Route."*
      *   *Task:* Map a path through a room filled with obstacles (chairs) for the User to walk blindfolded?
      *   *Safety issues.*

      *   *Let's go back to "The Allocation."* It's the cleanest for scoring.
      *   *Scenario:* **The Scholarship Committee.**
      *   *Client:* The Donor. Wants money distributed according to specific criteria.
      *   *User:* The Student Body (represented by one student). Has actual financial needs.
      *   *Build Team:* The Algorithm/Committee.
      *   *Materials:* Envelopes (money), Cards (Student Profiles).
      *   *Constraint:* Client can't see individual student needs, only aggregate stats.
      *   *Problem:* Hard to make "Intent doesn't exist yet" moment visceral.

      *   *Better Idea:* **"The Room Layout."**
      *   *Task:* Arrange 5 chairs and 1 table in a 10x10 grid (tape on floor).
      *   *User:* Has a hidden "Mobility/Task Profile" (e.g., needs clear path to door, needs light, needs to reach table).
      *   *Client:* Has a "Design Philosophy" (e.g., "Maximize symmetry," "Minimize footprint," "Group seating").
      *   *Build Team:* Arranges furniture based on Client's Spec.
      *   *Round 1:* Scored on Symmetry/Footprint (Client Spec).
      *   *Round 2:* Scored on User Ability to Perform Task (Value).
      *   *The Twist:* The Client's spec forces an arrangement that blocks the User. The Client *thought* they wanted Symmetry, but seeing the blocked User, they realize "Actually, I wanted Accessibility." But they couldn't specify Accessibility without seeing the conflict first.

      *   *Refining the "Intent doesn't exist" constraint:*
      *   The Client must write a spec *before* seeing the User's needs.
      *   The Build Team executes perfectly.
      *   The User tries to use the room. Fails.
      *   The Client sees the failure. Says "That's not what I meant."
      *   *Crucial:* The Client cannot rewrite the spec to fix it easily because the conflict was unforeseeable.

