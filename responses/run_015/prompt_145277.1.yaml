answer: |-
  Here is an audit of the Moral Parliament analogy, structured for your feature.

  ### I. The Correspondence: How the Analogy is Supposed to Work

  The model, most famously formalized by Nick Bostrom and Toby Ord (2009), treats moral uncertainty as a problem of collective choice. Here is the explicit mapping used in the literature:

  *   **The Parliament:** The moral agent (or the institution's decision-making procedure).
  *   **The Parties:** Competing moral theories (e.g., Utilitarianism, Deontology, Prioritarianism).
  *   **The Electorate:** The agent's credences (degrees of belief) in the truth of each theory.
  *   **Seat Share:** Proportional to credence. If you are 60% confident in Utilitarianism, that "party" holds 60% of the seats.
  *   **The Legislation:** The specific action taken by the institution.
  *   **Coalitions:** Temporary alliances between theories that agree on a specific course of action in a specific case.
  *   **Vote-Trading (Logrolling):** Theory A accepts a sub-optimal outcome on Issue 1 (where it cares less) in exchange for Theory B conceding on Issue 2 (where Theory A cares more).
  *   **The Whip:** The requirement of coherence. The agent cannot vote one way today and contradictorily tomorrow without losing credibility (or rational integrity).

  **The Pitch:** Just as a coalition government prevents any single faction from tyrannizing the state, "moral hedging" prevents a possibly false moral theory from tyrannizing your actions. Dogmatism (acting solely on the highest-credence theory) is akin to a one-party state: efficient, but catastrophic if that party is wrong.

  ### II. The Audit: Where the Mapping Fails

  You have identified the friction points correctly. When we press the mechanics, the analogy generates more heat than light.

  **1. Interests vs. Criteria of Correctness**
  *   **Parliament:** Parties are self-interested. They want to stay in power. Compromise is rational because survival is the goal.
  *   **Moral Theory:** Theories are not agents; they are truth-claims. Utilitarianism does not "want" to survive; it claims to describe what is *right*.
  *   **The Failure:** A theory with agent-relative constraints (e.g., "Never kill an innocent") cannot logically "trade" a violation for a concession elsewhere. If the theory says an act is forbidden, it is forbidden *simpliciter*. It has no surplus utility to trade. The parliament model assumes all theories are aggregative (consequentialist-ish) to make trading possible, which biases the output against deontological views.

  **2. The Normalization Problem (The Seat Share Paradox)**
  *   **Parliament:** We can count votes because one vote equals one vote.
  *   **Moral Theory:** To assign seats proportional to credence, you must assume that "1 unit of choice-worthiness" in Utilitarianism is equivalent to "1 unit of choice-worthiness" in Deontology.
  *   **The Failure:** This is the very problem the parliament was supposed to solve. If you know how to normalize the "currencies" of different theories to assign seat shares, you don't need the parliament; you can just calculate the expected choice-worthiness directly. If you *don't* know how to compare them, you cannot assign fair seat shares. You might give Utilitarianism 50% of the seats, but if its scale of value is 100x more expansive than Deontology's, it effectively holds 99% of the power. The analogy hides the hardest math in the setup.

  **3. Fairness vs. Truth-Tracking**
  *   **Parliament:** The goal is legitimate representation of diverse interests. Minority views deserve a voice.
  *   **Moral Decision:** The goal is correctness.
  *   **The Failure:** In politics, we give seats to a party even if their platform is economically illiterate, because they represent people. In morality, if a theory is false, why does it deserve "seats"? Giving 20% of the vote to a theory you believe is 80% likely to be *false* seems like an epistemic error, not a virtue. The parliament conflates *democratic legitimacy* with *epistemic rationality*.

  **4. Binding Nature**
  *   **Parliament:** Laws bind the citizenry externally.
  *   **Moral Decision:** The decision binds the agent internally.
  *   **The Failure:** If the "legislation" passed by the parliament is a compromise (e.g., "Donate to malaria nets *and* animal sanctuaries"), but the true moral theory says "Only malaria nets matter," the agent has committed a moral error. In a real parliament, a bad law is a political failure; in the moral parliament, a bad law is a moral sin. The stakes of the output are not analogous.

  ### III. The "Long Sequence" Wrinkle

  Your interviewee argues that the analogy only works over time, allowing for logrolling (vote-trading) across decisions. Does repetition save the model?

  **It makes the mechanism possible, but the incoherence worse.**

  *   **The Gain:** In a single-shot decision, a Deontologist cannot trade. But over a sequence, they might say, "I will allow a minor utilitarian violation today if you guarantee a major deontological protection next month." This turns moral uncertainty into a management problem.
  *   **The Loss:** This requires **cardinal inter-theoretic comparison**. To trade, you must know that *one* violation of a constraint is "worth" *five* units of utility. Most moral theories deny such a common metric exists.
  *   **The Verdict:** Repetition exposes the analogy's dependency on consequentialism. If your credence includes a theory that rejects trade-offs (e.g., absolutist deontology), the "long sequence" doesn't create a market; it creates a stalemate. The parliament works only if all parties are willing to be bribed. If one party is a zealot (which some moral truths might be), the parliament dissolves into gridlock.

  Furthermore, repetition introduces **moral corruption**. If you "trade" a violation today for a gain tomorrow, you have already acted wrongly according to the constraint-based theory. You cannot "make up for" a moral wrong with a moral right in most non-consequentialist frameworks. The ledger doesn't balance.

  ### IV. Does the Anti-Dogmatism Conclusion Survive?

  **The Conclusion:** "It is irrational to act dogmatically on your highest-credence theory; you should hedge."

  **The Verdict:** The conclusion survives, but the Parliament analogy is not what carries it.

  *   **Why the Analogy Carries It (Wrongly):** The parliament suggests hedging is virtuous because it is *fair* to the theories. This is the "pitch."
  *   **Why the Conclusion Holds (Differently):** Hedging is rational not because of fairness, but because of **risk aversion** and **expected value maximization**.
      *   If you are 90% sure Theory A is true, but Theory A allows for catastrophic outcomes if wrong (e.g., human extinction), and Theory B prevents that catastrophe at a low cost, you hedge.
      *   This is not "giving Theory B seats." It is minimizing the expected cost of error.

  Once the disanalogies are on the table, the "fairness" argument collapses. False theories deserve no respect. However, the *prudential* argument remains: acting on incomplete information requires managing the downside risk of being wrong. The anti-dogmatism conclusion should be re-grounded in **decision theory under uncertainty**, not **political representation**.

  ### V. Better Comparisons

  If the Parliament is a flawed map, what fits the terrain better?

  **1. Portfolio Diversification (The Strongest Fit)**
  *   **The Mapping:** Moral theories are asset classes. Credence is capital allocation.
  *   **Why it works:** It captures the *risk management* aspect without implying the assets have rights. You don't diversify because you want to be "fair" to the Tech Sector; you diversify because you aren't sure which sector will crash.
  *   **Handling Constraints:** It handles agent-relative constraints better. You might decide not to invest in "Sin Stocks" (violating constraints) regardless of expected return.
  *   **The Limit:** Financial returns are commensurable (money). Moral "returns" are not. But it avoids the political baggage of "rights" for false theories.

  **2. Expert Disagreement (The Advisory Model)**
  *   **The Mapping:** Moral theories are expert consultants. The agent is the CEO.
  *   **Why it works:** A CEO listens to the Chief Safety Officer (Deontology) and the Chief Profit Officer (Utilitarianism). They weigh the advice based on confidence, but the CEO makes the final call.
  *   **The Limit:** Experts usually agree on the *goal* (profit/safety) and disagree on *means*. Moral theories disagree on the *goal* itself.
  *   **Refinement:** Treat them as **Competing Jurisdictions**. If you are 60% sure you are in France and 40% sure you are in Germany, you don't follow a "parliament" of laws. You try to find out where you are. If you can't, you follow the rules that satisfy both (hedging) to avoid penalty. This frames hedging as **compliance under jurisdictional uncertainty**, which is closer to the institutional reality you are describing.

  ### Summary for the Feature

  The Moral Parliament is a powerful heuristic for *visualizing* moral uncertainty, but a dangerous one for *justifying* it. It smuggles in consequentialist assumptions (that everything can be traded) and political values (that false views deserve representation) to solve an epistemic problem.

  For your institution, the argument for hedging shouldn't be that the Utilitarians and Deontologists need to "share power." It should be that the Board faces **jurisdictional uncertainty**. Until they know which moral law governs their actions, the rational fiduciary duty is to minimize the risk of violating the true law, provided the cost of compliance is not prohibitive. That is not democracy; it is prudence.
