      *   *Style:* Sharp, philosophical but accessible. Use the "audit" framing.
      *   *Key Insight to Highlight:* The "Normalization Problem" is the killer. You can't assign seats without already solving the problem the parliament is meant to solve.
      *   *Key Insight on Repetition:* Logrolling requires *cardinal* utility comparisons, which deontological theories often reject.
      *   *Key Insight on Alternatives:* Portfolio theory is better because it admits ignorance without granting ontological status to false theories.

  8.  **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* Make sure to distinguish between *Moral Uncertainty* (which theory is true) and *Moral Disagreement* (people disagreeing). The prompt focuses on the institution's members disagreeing, which maps to the agent being uncertain.
