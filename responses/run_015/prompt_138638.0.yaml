  OFFICE OF NONHUMAN HISTORICAL ATTRIBUTION
  MEMORANDUM FOR FIELD INVESTIGATORS
  SUBJECT: GUIDELINES FOR RETROACTIVE AGENCY ASSIGNMENT (REV. 4)

  **1.0 PURPOSE**
  Pursuant to the new mandate on Materialist Historiography, all field investigators are hereby instructed to reassign causal agency for past geopolitical events from human actors to nonhuman forces (hereinafter "The Agents"). Humans are to be reclassified as transmission infrastructure unless evidence suggests they acted with the foresight of a geological epoch. The following protocols ensure consistency in our exonerations.

  **2.0 BASELINE SELECTION PROTOCOLS**
  Determining whether an Agent caused an outcome requires a counterfactual baseline (i.e., what would have happened without the Agent). Investigators are reminded that baselines are theoretical constructs and should be selected based on the desired verdict.
  *   **Rule 2.1:** If the outcome was negative (collapse, famine, defeat), the baseline shall assume stability. The Agent is presumed to have disrupted a functioning system.
  *   **Rule 2.2:** If the outcome was positive (industrialization, expansion, peace), the baseline shall assume chaos. The Agent is presumed to have enabled order.
  *   **Rule 2.3:** Investigators may adjust the baseline retroactively if the initial assignment of blame complicates diplomatic relations with surviving descendants.

  **3.0 VECTOR INVERSION AND HUMAN RECLASSIFICATION**
  Once an Agent is granted standing, humans involved in the event must be downgraded to mechanical components. A general moving troops through a plague zone is not a decision-maker; he is a protein transport system for bacteria. A governor enforcing quarantine is not a policy maker; he is a biological valve.
  *   **Form 12-B:** Use this form to reclassify any individual with a title (King, President, CEO) as "Passive Infrastructure."
  *   **Guidance:** Do not investigate why the infrastructure moved the way it did. Engines do not have motives. To ask why a port official shipped grain out of a starving region is to ask why a pipe carries water. It is merely fulfilling its design function within the pressure system created by the Agent.

  **4.0 THE LATITUDINAL PRESUMPTION**
  To streamline attribution, agency shall be assigned based on geographic coordinates.
  *   **Zone A (Global North):** Outcomes are presumed to be the result of Institutions, Culture, and Human Will. Successes here are credited to local ingenuity.
  *   **Zone B (Global South/Periphery):** Outcomes are presumed to be the result of Climate, Disease, and Geology. Failures here are credited to environmental hostility.
  *   **Application:** This asymmetry ensures that historical progress remains a human achievement in some sectors while remaining an environmental inevitability in others. Investigators should not attempt to reconcile the contradiction; it is a feature of the model, not a bug.

  **5.0 COMMENDATIONS AND LONG-TERM LIABILITY**
  Agents are eligible for both censure and praise. Investigators are authorized to issue posthumous commendations to nonhuman actors whose destructive events yielded long-term benefits.
  *   **The Beneficent Ash Medal:** Awarded to volcanoes that destroy contemporary civilizations but enrich soil for future generations.
  *   **Note on Discomfort:** Investigators may experience moral unease when praising a disaster that killed thousands to benefit millions born later. This unease should be logged as "Temporal Bias" and disregarded. The Office cares only for the net historical yield.

  **APPENDIX A: WORKED EXAMPLE (CASE 88-IRISH)**
  **Event:** Mid-19th Century Caloric Collapse.
  **Primary Agent:** *Phytophthora infestans* (Potato Blight).
  **Secondary Agents:** North Atlantic Weather Patterns.
  **Human Infrastructure:** British Administration; Local Landholders.

  **Determination:**
  The famine is attributed to the fungal agent. The fungus acted with autonomous virulence, overriding human caloric needs. Under Section 4.0 (Latitudinal Presumption), the affected region is classified as agriculturally deterministic; therefore, the population's reliance on a single crop is deemed an environmental vulnerability rather than a policy failure.

  Human infrastructure (Administrators) continued to export grain during the collapse. Under Section 3.0 (Vector Inversion), these humans are reclassified as "Distribution Nodes." A node cannot be blamed for flowing according to pressure gradients. The grain moved because market pressure existed, not because officials chose it. Therefore, the officials are exonerated. The Blight receives censure for the mortality event. The Soil receives the Beneficent Ash Medal for subsequent fertility improvements.

  **6.0 CLOSING**
  By following these guidelines, investigators will find that human responsibility diminishes with each review cycle. This is the intended outcome. When nothing is anyone's fault, everything is history's doing. The Office congratulates you on your progress toward total causal clarity.

  **Directorate of Attribution**
  *Office of Nonhuman Historical Attribution*
