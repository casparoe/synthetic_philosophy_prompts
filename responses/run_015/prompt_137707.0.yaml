answer: |-
  Here is a committed analysis of the relationship between Keynes's *Treatise on Probability*, his later economic theory, and your proposed distinction between first-order weight and meta-weight.

  ### The Position

  **Meta-weight is not a component of Keynes's *Treatise* concept of Weight; rather, it is the substantive precursor to the concept of "Confidence" in *The General Theory*.**

  While first-order weight tracks the *volume* of relevant evidence relative to ignorance within a given logical system, meta-weight tracks the *stability* of the logical system itself. Consequently, in your railway case, the agent with lower meta-weight should be described as having a **lower degree of confidence**, not a lower weight of argument (in the *Treatise* sense) nor necessarily a lower probability. Furthermore, liquidity preference is driven primarily by **meta-weight (confidence)**, not first-order weight.

  ### The Argument

  To justify this position, we must identify a structural incompatibility between *Treatise* Weight and Meta-weight, and then show how *General Theory* Confidence resolves it.

  **1. The Monotonicity Problem**
  In *A Treatise on Probability*, Keynes defines the weight of an argument ($V$) as a function of the amount of relevant evidence. Crucially, Keynes establishes that weight is **monotonic**: as long as new evidence is relevant, weight *always* increases, even if the probability of the conclusion decreases.
  > "As the relevant evidence at our disposal increases, the magnitude of the probability of the argument may either decrease or increase... but in all cases the weight of the argument is increased." (*Treatise*, p. 71)

  Your concept of meta-weight, however, is **non-monotonic**. The stability of an evidential environment can deteriorate even as the volume of data accumulates. In the pre-1914 era, a railway investor might have had thirty years of data (high first-order weight) and a stable environment (high meta-weight). By 1930, they might have forty years of data (higher first-order weight) but a world prone to protectionism and war (lower meta-weight).

  Because *Treatise* Weight cannot decrease with the accumulation of relevant evidence, it cannot conceptually accommodate meta-weight. If meta-weight falls while evidence rises, *Treatise* Weight would technically rise, masking the increased fragility of the forecast. Therefore, meta-weight cannot be a sub-component of *Treatise* Weight.

  **2. Confidence as the Operationalization of Meta-weight**
  In *The General Theory* (Chapter 12), Keynes distinguishes between the *state of long-term expectation* (the forecast itself) and the **state of confidence** (the reliance placed on that forecast). He writes that confidence depends on "how much we feel we know" versus "how much we do not know," but significantly adds that it depends on the **reliability** of the basis for the forecast.

  This "reliability" is precisely your meta-weight. It is an assessment of the *inductive validity* of the past for the future. When Keynes argues that investors rely on convention because they lack a "reasonable basis" for calculating probable yield, he is describing a collapse in meta-weight. The data (first-order weight) may exist, but the agent suspects the causal structure linking that data to future yields has broken.

  Thus, Confidence in *The General Theory* is the economic operationalization of Meta-weight. It allows the agent to say: "I have a probability calculation based on substantial evidence (high first-order weight), but I have low confidence in that calculation because the environment is unstable (low meta-weight)."

  **3. The Railway Case**
  Applying this to your concrete example: Two agents assess a railway's profitability.
  *   **Agent A (Stable Environment):** High first-order weight (data), High meta-weight (stability).
  *   **Agent B (Volatile Environment):** High first-order weight (data), Low meta-weight (instability).

  In Keynesian terms, Agent B does **not** have a lower *Treatise* Weight. They possess the same volume of relevant knowledge. Nor do they necessarily assign a lower *Probability* to the proposition; the expected yield calculation might remain mathematically identical based on the available data.

  Agent B has a **lower degree of Confidence**. This distinction is vital because it explains why Agent B might refuse to invest despite a high calculated probability of profit. If we conflated meta-weight with *Treatise* Weight, we would be forced to say Agent B has "less evidence," which is factually untrue. They have the same evidence, but they trust the *connection* between that evidence and the future less.

  **4. Liquidity Preference**
  Liquidity preference is the premium demanded for parting with cash. Cash is the hedge against ignorance. However, Keynes specifies that it is not just ignorance, but *uncertainty* regarding the future valuation of assets that drives liquidity preference.

  If liquidity preference depended on first-order weight, then agents with massive datasets (e.g., sophisticated banks) would never exhibit liquidity preference, as their "ignorance" is minimized. Yet, during crises, these agents hoard cash most aggressively. This implies liquidity preference tracks **meta-weight**. When meta-weight collapses (the fear that the rules of the game are changing), the value of long-term assets becomes indeterminate regardless of how much data one possesses. The agent prefers liquidity not because they lack data (first-order weight), but because they believe the data has lost its predictive power (low meta-weight/confidence).

  ### The Least Certain Aspect of This Argument

  The part of this argument I find least certain is the **textual interpretation of Keynes's 1921 view on "relevant ignorance."**

  In the *Treatise*, Keynes defines weight as the balance of knowledge against ignorance. It is arguable that "ignorance" in 1921 was intended to include ignorance about the *stability of the causal system*, not just ignorance about specific data points. If Keynes intended "relevant ignorance" to encompass "unknown unknowns" regarding structural breaks, then *Treatise* Weight *could* theoretically decrease (or fail to increase) when signs of instability appear, because those signs would constitute evidence of high ignorance.

  However, Keynes's formal definition of weight in the *Treatise* is logical and static, tied to the relation $a/h$. It does not easily accommodate a dynamic parameter where $h$ (the evidence) loses its logical force over time without new contradictory evidence arriving. Because the *Treatise* lacks a formal mechanism for "depreciating" the relevance of old evidence due to temporal decay, I maintain that Meta-weight is distinct from *Treatise* Weight. Nevertheless, given Keynes's often evolving and sometimes loose terminology between 1921 and 1936, there remains a non-zero probability that he viewed Confidence in 1936 as merely a renaming of Weight from 1921, expanded to include temporal stability. My argument rests on the logical incompatibility of monotonicity, but Keynes's own exegesis was not always logically rigid.
