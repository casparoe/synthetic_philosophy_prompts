  *(Self-Correction Note on the "Correspondence" claim in the text)*: The text says "Both held that truth is not about matching your beliefs to some mind-independent world." This is a strong anti-realist claim. Peirce definitely rejects this. James is trickier but generally agrees that "copy" theories are useless, though he wants to keep the *function* of correspondence. I need to be precise here.

