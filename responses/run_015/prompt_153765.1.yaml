prompt: |-
  I've been reading some philosphy since I retired from the marine biology dept — mostly on well-being and that old experience-machine idea, though I think the classroom version misses something important for anyone who spent decades checking whether data really came from the ocean or just from a contaminated sample. I'm writing to ask if you could draft a short story for my little discussion group, we're all ex-scientists with a couple philosophy grad students who keep us honest. The concept is well-being versus getting it right about the world, but I want to avoid the usual would-you-plug-in-for-pleasure framing that everyone has heard a million times.

  Here's the specific setup: Elena, a retired biologist, has jury-rigged a neural interface in her garage that doesn't just feed pleasant sensations; it feeds the complete phenomenology of epistemic achievement. You feel the satisfaction of having actually traced a causal chain, argued with a peer who changed your mind, watched a real specimen behave in real time. But it's all simulated, your brain never left the chair. Her sister Mara is dying, in constant pain, but was also a field researcher who always said she'd rather suffer with real discoveries behind her than live comfortably on illusions. Elena is considering whether to offer Mara the machine, and the story should turn on whether well-being can be separated from truth-tracking success — not just pleasure versus reality, but the specific feeling that your beliefs were earned through actual causal interaction with the world.

  Please write it as continuous prose only, no headings, no bullet points, no bold text, no tables, just like an email or a letter — maybe eight hundred to a thousand words. Try not to let the characters lecture about philosophy; let the tension come through the garage setting, the old equipment, Elena's hands on the dials, and the smell of salt water she keeps in a jar for no good reason. I apologize if my framing is scattered — I'm learnign how to ask these questions properly, and I've had too much coffee this morning.
