      The jar sat on the workbench next to the oscilloscope, a mason jar filled with seawater collected twenty years ago off the Monterey Bay, sealed tight but still leaking a brine scent that cut through the smell of solder and ozone. Elena adjusted the potentiometer on the neural interface, her fingers trembling slightly not from age but from the hum of the current running through the makeshift rig. It wasn't a sleek pod like in the textbooks her discussion group loved to quote. It was a mess of wires and salvaged medical hardware, bolted to a reclining chair that used to sit in her living room. She wasn't building a happiness machine. She was building a verification engine.

      Mara stood in the doorway, leaning heavily on the frame. The cancer had taken most of her mass, leaving her looking like a driftwood skeleton wrapped in thin skin. She smelled of hospital antiseptic, a sharp contrast to the organic decay of the garage. She didn't ask what Elena was doing. They had been diving partners before the sickness, before the tenure tracks diverged, and she knew the look of someone calibrating instruments for a deep dive.

      It works, Elena said, her voice quiet against the cooling fans. Not pleasure. I stripped the hedonic feedback loops. What it gives you is the phenomenology of resolution. The exact neural signature of watching a specimen behave exactly as hypothesized. The feeling of a peer review where you actually change someone's mind. The click of a causal chain locking into place.

      Mara shuffled forward, her slippers scuffing the concrete. She ran a hand over the casing of the interface, feeling the heat radiating from the processors. You want to plug me in.

      I want to give you the work, Elena said. You're in pain. The morphine dulls it but it dulls everything else too. In there, you could finish the longitudinal study. You could feel the data holding weight. You could feel right about the world.

      Mara looked at the jar of seawater. She knew why it was there. It was an anchor, a proof of contact. She remembered the cold shock of real water, the way reality resisted you when you tried to net a sample. The machine offered the satisfaction without the resistance. It offered the feeling of truth without the world having to cooperate.

      If I go in, Mara said, her voice raspy, does the specimen know I'm watching?

      Elena hesitated. Her hand hovered over the main switch. That's the variable we can't solve. The simulation models the resistance. It models the frustration of failed hypotheses so the success feels earned. But the causal chain ends at your synapse.

      Mara coughed, a wet, heavy sound that echoed in the small space. She looked at her sister, really looked at her, seeing the desperation behind the scientific curiosity. Elena wanted to save her from the indignity of a mind clouded by pain, but she wanted to do it with integrity. She wanted to offer Mara the only thing Mara valued: the truth of her own experience.

      You're asking me to accept a closed loop, Mara said. To feel the satisfaction of discovery without the world pushing back. But Elena, the satisfaction isn't the signal. The resistance is the signal.

      Elena pulled her hand back from the switch. The hum of the garage seemed to grow louder, filling the silence between them. She thought about the grad students in their discussion group, arguing about well-being metrics over coffee, detached from the mud and the salt. They talked about states of mind. Elena and Mara knew about states of water.

      If I plug in, Mara continued, touching the jar of seawater, condensation beading on the glass, then the feeling of having solved something is just another chemical event. It's not knowledge. It's just a shape my brain is making. I'd rather have the pain and know it's real than have the relief and know it's mine alone.

      Elena nodded slowly. She didn't turn the machine off. She just stepped back from the chair. The offer hung in the air, heavy and unaccepted. It wasn't that Mara preferred suffering. It was that she preferred the connection. The pain was proof she was still in the system, still subject to the laws of biology she had spent a lifetime cataloging. To simulate the achievement was to sever the tether.

      Mara turned away from the workbench, moving slowly toward the door. The salt smell lingered, strong and ancient, reminding them both of the ocean that didn't care if they understood it or not. Elena watched her go, then looked back at the interface. The lights blinked in a steady rhythm, simulating a heartbeat, simulating a pulse of data, simulating a life. She reached out and unplugged the main cable. The hum died. The silence returned, real and unmediated. She picked up the jar of seawater and held it against her chest, feeling the cold glass against her skin, grounding herself in the only truth left in the room.

