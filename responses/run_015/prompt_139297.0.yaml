  9.  **Final Polish:** Check the structure against the prompt's requirements (Three parts + Test Case + Verial/Substantive analysis). *Self-Correction during drafting:* Make sure the "Common Ground" doesn't sneak in Skeptic assumptions that the Compatibilist would reject (e.g., that determinism *eliminates* responsibility). Frame it around what determinism *doesn't* settle.

