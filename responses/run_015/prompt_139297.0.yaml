      *   *Caruso-style Skepticism:* Focuses on "basic desert" (you deserve pain *because* you did it, regardless of consequences) being impossible. Uses the "Public Health-Quarantine Model" (PHQM). Justification is purely prevention/harm reduction. Crucially, ties this to social justice (if society causes crime, society must fix conditions before punishing).

