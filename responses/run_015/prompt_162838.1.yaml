          *   Intervention (Woodward): Intervene to set Dosage = 5mg. Result: Death. So I=Yes.
          *   *Problem:* Is "Not administering 10mg" the same as "Dosage = 0"? Lewis's "c does not occur" usually means the event doesn't happen. If the event is "Injection of 10mg", $\neg c$ is "No injection of 10mg". If the closest world involves "No injection at all", and the patient survives anyway (illness mild), then C=No. But if we intervene to "5mg", patient dies.
