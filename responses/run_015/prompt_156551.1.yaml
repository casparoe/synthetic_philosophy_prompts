answer: |-
  ### 1. Agreed Claims

  1. Differences in well-being are real, comparable across persons, and morally significant.
  2. Causing severe suffering to an existing person is prima facie wrong, regardless of identity effects.
  3. Future individuals, once they exist, are subjects of moral concern equal to present people.
  4. In standard cases, changing conception timing changes who exists numerically, not just qualitatively.
  5. Moral evaluation must account for uncertainty about who will exist under different choices.
  6. Calling an act wrong implies there was a decisive normative reason not to do it.
  7. Non-existence is not a welfare state comparable to existence for the non-existent person.
  8. Many choices impact both welfare levels and the identity of future people simultaneously.
  9. Moral theories must offer action-guidance, not merely rank possible worlds from a distance.
  10. Intuitions about specific cases are data points for theory, not definitive proofs of truth.
  11. Imposing risk of harm is morally distinct from causing actual harm to actual people.
  12. We share a goal of avoiding futures deemed catastrophic by all plausible moral views.

  ### 2. Disagreements

  | Issue | Impersonalist Wording | Person-Affecting Wording | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Condition for Wrongness** | An act is wrong if it brings about a suboptimal state of affairs impersonally. | An act is wrong only if it makes some particular person complainable worse off. | **Genuine:** Disagreement on the structure of morality, not just definitions. |
  | **Meaning of Harm** | Harm is being worse off than one would have been had the agent chosen otherwise. | Harm is being worse off than one's baseline status prior to the agent's intervention. | **Verbal:** Disagreement on the comparator for "harm," not the welfare facts. |
  | **Value of Existence** | Creating a happy person adds impersonal value to the world, ceteris paribus. | Creating a happy person benefits that person but adds no duty to create them. | **Genuine:** Disagreement on whether existence itself is a benefit owed. |
  | **Risk and Duty** | Duties are fixed by expected impersonal value across all possible future people. | Duties are fixed by expected complaints from whoever will exist under each option. | **Genuine:** Disagreement on whether duties track outcomes or expected grievances. |

  ### 3. Cruxes

  **1. The Asymmetry**
  *Neutral Statement:* Does the duty to avoid creating miserable people imply a duty to create happy people?
  *Test Case:* A couple can conceive a happy child now or wait and conceive no child at all.
  *Impersonalist Prediction:* Creating the child is better; potentially required if the life is sufficiently good.
  *Person-Affecting Prediction:* Creating the child is permissible but not required; no one is harmed by non-creation.
  *Move Condition:* Impersonalists move if PA shows requiring creation violates autonomy without reducing suffering. PA moves if Impersonalism shows neutrality implies accepting preventable misery elsewhere.

  **2. Mere Addition**
  *Neutral Statement:* Does adding a happy person to an existing population make the outcome better?
  *Test Case:* A population exists. We can add one extra person with a life worth living, changing nothing else.
  *Impersonalist Prediction:* The outcome is better (or at least not worse) due to added total welfare.
  *Person-Affecting Prediction:* The outcome is not better; no existing person benefits, and the new person is not harmed by non-existence.
  *Move Condition:* Impersonalists move if PA proves addition leads to absurd intransitivity in choices. PA moves if Impersonalism avoids the Repugnant Conclusion without denying addition's value.

  **3. Climate Policy (Risk and Identity)**
  *Neutral Statement:* Is a policy wrong if it harms future people who would not otherwise exist?
  *Test Case:* A risky energy policy benefits us now but causes climate damage harming future different people.
  *Impersonalist Prediction:* Wrong, because the outcome is impersonally worse than the safe alternative.
  *Person-Affecting Prediction:* Ex Post: Not wrong (no victim). Ex Ante: Wrong (imposed unacceptable risk of complaint).
  *Move Condition:* Impersonalists move if Ex Ante PA handles risk without collapsing into impersonalism. PA moves if Impersonalism shows Ex Ante view fails to condemn clear exploitation.

  **4. Barely Worth Living**
  *Neutral Statement:* Is a life barely worth living a valid comparator to non-existence for moral choice?
  *Test Case:* A child will have a life just above the zero-line vs. not being born at all.
  *Impersonalist Prediction:* Creating the child is better; positive value outweighs zero.
  *Person-Affecting Prediction:* Neutral; the child cannot complain of being born, nor of not being born.
  *Move Condition:* Impersonalists move if PA shows this leads to accepting vast populations of barely worth living lives. PA moves if Impersonalism shows denying this implies lives worth living are not benefits.

  ### 4. The p-dial

  We vary *p*, the credence that the child born now is numerically identical to the child born later. *p*=1 is standard harm; *p*=0 is textbook nonidentity.

  | View | p = 0 | p = 0.25 | p = 0.5 | p = 0.75 | p = 1 |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Impersonal** | Wrong | Wrong | Wrong | Wrong | Wrong |
  | **Ex Post PA** | Not Wrong | Not Wrong | Not Wrong | Not Wrong | Wrong |
  | **Ex Ante PA** | Wrong (Risk) | Wrong (Less) | Wrong (Mid) | Wrong (More) | Wrong (Harm) |

  *Impersonalists* see wrongness as flat; the outcome is suboptimal regardless of identity confidence. *Ex Post Person-Affecting* theorists see a jump; wrongness requires an actual victim, so only *p*=1 (or a sharp metaphysical boundary) triggers it. *Ex Ante Person-Affecting* theorists see a fade; wrongness scales with the expected complaint, which tracks *p*.

  *Coherence Note:* If identity is all-or-nothing and *p* is mere ignorance, Ex Post PA must treat all intermediate cases as either wrong or not based on the hidden fact. If identity is vague, Ex Post PA faces a sorites problem. Ex Ante PA avoids this by treating *p* as epistemic probability governing expected grievance, making the dial coherent for them but not for Ex Post PA.

  ### 5. What Would Move Each Side

  The Impersonalist camp would move if the Person-Affecting view could demonstrate a robust handling of risk and uncertainty that condemns exploitation without silently reintroducing impersonal value calculations. Specifically, if the *ex ante* variant can explain why imposing a high risk of severe harm is wrong even when no one is actually harmed, without appealing to impersonal badness, Impersonalists would concede the person-affecting restriction has greater action-guiding power.

  The Person-Affecting camp would move if the Impersonal view could demonstrate a method of avoiding the Repugnant Conclusion and the Absurd Conclusion without relying on counterintuitive claims about lives worth living. Specifically, if Impersonalism can show that "wrongness without a victim" is necessary to explain our intuitions about large-scale climate policy where identities are shuffled, Person-Affecting theorists would concede the restriction is too narrow for global challenges.

  ### 6. Residual Disagreement

  We acknowledge that our divergence rests on a fundamental disagreement about the nature of moral reasons: whether they are anchored strictly to interests of concrete individuals or anchored to the value of states of affairs. We agree to test these anchors against the diagnostics above rather than asserting them as premises.

  *Impersonalist Sign-off:* We maintain that outcomes matter morally even when no specific person can claim they were harmed by the choice.
  *Person-Affecting Sign-off:* We maintain that morality is essentially relational, and wrongness requires a subject who can legitimately complain.
