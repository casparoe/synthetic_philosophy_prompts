      *   *The Paradox (Cohen/White):*
          1.  Experience $E$ justifies $H$ (Hand).
          2.  $H$ entails $\neg SK$ (Not Skeptical Hypothesis/BIV).
          3.  Closure Principle: If $E$ justifies $H$, and you know $H \rightarrow \neg SK$, then $E$ justifies $\neg SK$.
          4.  Result: You have justification for $\neg SK$ based solely on $E$.
          5.  Intuition: This is "too easy." We shouldn't be able to rule out radical skepticism just by looking at our hands.
      *   *The Conservative Response (Wright):* Justification for $H$ *depends* on antecedent warrant for $\neg SK$. Transmission of justification fails.
      *   *The Dogmatist Response:* Deny Closure (radical), Deny Transmission (nuanced), or Bite the Bullet (accept Easy Knowledge).

