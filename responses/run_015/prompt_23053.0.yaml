answer: |-
  **Title:** The Cost of Closure: Defending Dogmatism via Transmission Failure

  **Introduction**

  The dogmatism paradox, as crystallized in the debate between Jim Pryor's liberalism and Crispin Wright's conservatism, presents a dilemma for any theory of perceptual justification. On one horn, we have the intuitive claim that perceptual experience provides immediate, *prima facie* justification for beliefs about the external world (e.g., "Here is a hand") without requiring antecedent justification to rule out skeptical hypotheses (e.g., "I am not a brain-in-a-vat"). On the other horn, we have the "Easy Knowledge" objection, most forcefully articulated by Stewart Cohen and Roger White. They argue that if dogmatism holds, and if we accept standard closure principles, we can trivially justify the denial of skeptical hypotheses merely by deducing them from our perceptual beliefs. This result seems to render anti-skeptical inquiry vacuous.

  As a third-year doctoral student staking out a position, you are forced to choose between a theory that respects the phenomenology of perception but risks trivializing skepticism (Dogmatism), and a theory that respects the difficulty of skepticism but risks making perceptual justification impossibly demanding (Conservatism). This essay weighs these options and reaches a verdict: **Dogmatism is the correct account of perceptual justification, but it must be coupled with a denial of the Transmission of Justification principle in skeptical contexts.** This position preserves the immediacy of perceptual warrant while acknowledging that such warrant cannot be dialectically leveraged to defeat radical skepticism through deduction.

  **The Instability Charge: Easy Knowledge**

  The case against dogmatism rests on the intuition that knowledge of the external world cannot be "too easy." If my experience as of a hand gives me immediate justification for believing I have a hand ($H$), and I know that $H$ entails I am not a brain-in-a-vat ($\neg BIV$), then by the principle of Closure, my experience gives me justification for $\neg BIV$.

  Cohen argues that this licenses a problematic form of reasoning. It suggests I can confirm the reliability of my perception by using my perception. If I see a red wall, I am justified in believing it is red. Since it is red, my vision is working correctly. Thus, my experience justifies me in believing my vision is reliable. This bootstrapping seems illicit. In the skeptical context, the worry is deeper: it implies we can rule out global error possibilities without any independent evidence. If the dogmatist is right, the skeptic is defeated by a trivial deduction from the very beliefs the skeptic calls into question. This makes the justification for $\neg BIV$ appear structurally defective, suggesting the dogmatist's initial claim—that $H$ is justified immediately—must be false. Wright argues that for $H$ to be justified at all, one must already possess an antecedent warrant (an "entitlement") for $\neg BIV$. On this view, justification does not flow from $H$ to $\neg BIV$; rather, $\neg BIV$ is a necessary precondition for $H$.

  **The Blocking Move: Closure vs. Transmission**

  The dogmatist's primary defense is to distinguish between *Closure* and *Transmission*. Closure states that if one is justified in believing $P$, and knows $P$ entails $Q$, one is justified in believing $Q$. Transmission states that one can *acquire* justification for $Q$ by deducing it from $P$.

  Pryor and others argue that dogmatism is compatible with Closure but incompatible with Transmission in specific cases. One can be justified in $H$ and justified in $\neg BIV$ (via Closure), but the deduction from $H$ to $\neg BIV$ does not *generate* the justification for $\neg BIV$. Why? Because the justification for $H$ is only operative in contexts where $\neg BIV$ is not explicitly in doubt. When the skeptical hypothesis is raised as a live option, the justificatory force of the experience is blocked from transmitting to the conclusion. The experience justifies $H$ *assuming* the normal conditions obtain, but it cannot be used to *prove* those conditions obtain.

  This move attempts to have it both ways: we keep the immediate justification for everyday beliefs (avoiding Wright's heavy antecedent requirements) but concede that we cannot use those beliefs to dialectically silence the skeptic (avoiding Cohen's trivialization).

  **Verdict: Defending Dogmatism with Transmission Failure**

  Despite the elegance of Wright's conservatism, I argue that **Dogmatism, supplemented by the denial of Transmission, is the superior position.** The Conservative alternative imposes a burden on perceptual justification that is phenomenologically and epistemologically untenable, whereas the "Easy Knowledge" objection relies on a conflation of *having* justification and *demonstrating* justification.

  First, consider the cost of Conservatism. If Wright is correct, I am not justified in believing I have a hand unless I already have a warrant to believe I am not a BIV. But what is this warrant? Wright suggests it is a non-evidential "entitlement." However, this creates a fragility in our epistemic structure. It suggests that if I cannot articulate or possess this antecedent entitlement, my ordinary perceptual beliefs are unjustified. This contradicts the robust intuition that children or unreflective adults are justified in believing there is a tree before them, despite lacking any grasp of skeptical hypotheses or entitlements to rule them out. Conservatism intellectualizes justification to the point of breaking its connection with ordinary cognitive practice. Dogmatism, by contrast, aligns with the phenomenology of experience: the experience itself *seems* to provide the reason, not a prior metaphysical assumption.

  Second, the "Easy Knowledge" objection loses its bite once we accept the Transmission failure. The worry that dogmatism makes anti-skeptical knowledge "too easy" assumes that the *point* of epistemology is to provide a dialectical proof against skepticism. But if we adopt a moderate externalism or a disjunctivist-leaning dogmatism, the point of justification is to put the subject in contact with the truth, not necessarily to provide a argumentative shield against every logical possibility.

  The dogmatist can concede that the Moorean deduction ("Here is a hand, therefore I am not a BIV") is dialectically ineffective. It begs the question against the skeptic because the skeptic denies the premise's justificatory status in that specific context. However, dialectical ineffectiveness does not entail a lack of justification. I can be justified in $P$ even if I cannot use $P$ to convince someone who doubts the very faculties that produced $P$. By denying Transmission, the dogmatist admits that the deduction doesn't *create* anti-skeptical warrant where there was none. It merely makes explicit a commitment already inherent in the perceptual justification.

  Therefore, the "Easy Knowledge" result is only paradoxical if we demand that perceptual justification must be able to certify its own reliability discursively. There is no reason to accept this demand. Perceptual justification is immediate; it does not owe us a derivation of its own preconditions.

  **Conclusion**

  For your reading group, you should stake out the position of a **Dogmatist who denies Transmission.** This allows you to affirm that perceptual experience provides immediate justification for external world beliefs (preserving the core insight of liberalism) while acknowledging that this justification cannot be leveraged via deduction to prove the falsity of skeptical hypotheses (neutralizing the Easy Knowledge objection).

  You can argue that the Conservative critique correctly identifies that the deduction is question-begging, but incorrectly infers that this undermines the justification for the premise. The instability lies not in Dogmatism, but in the expectation that perceptual justification must be capable of self-validation through inference. By accepting that justification is context-sensitive and fails to transmit in skeptical contexts, you secure a theory that is both faithful to the power of perception and honest about the limits of anti-skeptical argumentation. This is the most robust position: it avoids the skepticism latent in Conservatism without falling into the naivety of unbridled Easy Knowledge.
