prompt: |-
  I'm a third-year epistemology PhD student, and I've been asked to stake out a position on the dogmatism paradox at our next reading group, so I need to know where I actually land before I commit in front of the group. Write an essay on the dogmatism paradox: the worry that the dogmatist claim—that perceptual experience gives you immediate, non-inferential justification for your beliefs about the external world—seems to collapse into an implausible "easy knowledge" result, because if your experience justifies believing, say, that you have a hand, and having a hand entails that you are not a brain in a vat, it looks as though you thereby have justification for denying the skeptical hypothesis on the mere strength of the experience. Weigh the two sides seriously: the case that dogmatism really does license this easy knowledge and is therefore unstable, and the case that a dogmatist can block the slide (for instance by denying that the relevant justification is closed under known entailment, or by drawing a line between the justification of the specific perceptual belief and the justification of the general anti-skeptical claim). Don't end on a balanced note—reach a verdict and defend it, since I have to pick a side and be able to say why.
