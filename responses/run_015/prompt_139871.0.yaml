          *   New paradigm resolves anomaly but changes the meaning of the central kind-term (incommensurability/no common measure).
          *   New paradigm wins on Kuhn's 5 values (accuracy, consistency, scope, simplicity, fruitfulness) *overall*, but values conflict (no algorithm).
          *   Community adopts new paradigm.
          *   After the scenario: Explain the three positions (Kuhnian, Realist, Algorithmic Rationalist).
