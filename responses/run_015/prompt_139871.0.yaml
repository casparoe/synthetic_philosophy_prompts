          *   Genuine anomaly? Ghost shards fracturing without sound.
          *   Meaning shift? Solid crystal vs. Hydration lattice (ontological shift).
          *   Kuhn's values conflict? RP wins accuracy/fruitfulness, loses simplicity/consistency (initially).
          *   Community adopts? Yes.

  3.  **Drafting the Analysis (The Three Positions):**
      *   **Kuhnian:** Focus on the values. The choice is rational but not algorithmic. The meaning shift (incommensurability) doesn't stop rationality because scientists use shared values, not shared definitions, to choose. It's a gestalt switch supported by persuasive argumentation about values.
      *   **Scientific Realist:** Focus on truth/approximation. The shift is progress because the RP captures the *real* structure of the world (electromagnetic tension) better than the DP (solidity). The meaning change is just refining reference; we are getting closer to the truth about what "shards" really are.
      *   **Algorithmic Rationalist:** Focus on procedure/neutrality. Without a neutral observation language (due to meaning shift) and a fixed weighting function for the values, the choice is subjective. If I can't calculate the winner, it's not rational compulsion; it's sociology or psychology.

  4.  **Identifying the Structural Feature:**
      *   What makes the Algorithmic Rationalist peel off? It's the *conflict among values combined with incommensurability*. If there were a neutral language, they could compare truth values. If there were an algorithm (fixed weights), they could calculate the winner. The specific feature is the **absence of a lexical fixed point** (due to meaning change) *plus* the **absence of a decision function** (due to value conflict).
