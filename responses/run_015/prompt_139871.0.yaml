      *   *Critique 1:* A bit cliché. Need to ensure the "incommensurability" is sharp regarding the *kind-term*.
      *   *Attempt 2 (Refining):* Field: Neuro-harmonics. Term: "Resonance." Old: Resonance is mechanical vibration of neurons. Anomaly: Resonance occurs in dead tissue. New: Resonance is electrochemical field interference. Meaning change: Mechanical vs. Field. Values: New is accurate/fruitful, Old is simple/consistent.
      *   *Critique 2:* Better. Let's make the anomaly very specific and the meaning shift clear. Let's call the field "Sonometrics" and the term "Flux."
      *   *Attempt 3 (Polishing for constraints):* Needs to be one paragraph. Needs to explicitly mention the conflict in Kuhn's values.
      *   *Drafting the content:* In the field of *cryo-acoustics*, researchers study "shards," defined in the Dominant Paradigm (DP) as solid ice crystals that fracture when exposed to specific sonic frequencies. For decades, the DP predicted fracture points with high simplicity and internal consistency. However, a repeatable anomaly emerged: "ghost shards" that fractured without sonic exposure, violating the DP's causal mechanism. The Rival Paradigm (RP) resolved this by redefining "shards" not as solid crystals but as metastable hydration lattices held by electromagnetic tension. This redefinition rendered the DP's core law ("All shards fracture at frequency $X$") untranslatable, as "shard" in the RP lacks the property of solidity required for mechanical fracture. The RP offered superior accuracy regarding ghost shards and greater fruitfulness for new materials, but at the cost of initial simplicity and mathematical consistency with established thermodynamics. Despite the lack of a neutral algorithm to weigh accuracy against simplicity, the community adopted the RP.

      *   *Review against constraints:*
          *   One paragraph? Yes.
