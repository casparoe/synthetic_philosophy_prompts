  **The Scenario**

  Two municipal crisis teams are funded based on "Calls Handled per Month," a proxy for public safety. Team Alpha, staffed by veterans, takes complex, high-risk cases; they stay on the line for hours to de-escalate suicide threats, resolving the crisis but handling few calls. Team Beta, staffed by rookies, prioritizes speed; they give quick advice to low-risk callers and hang up, racking up high call volumes without resolving underlying dangers. When the department introduces a bonus for volume, Beta doubles down on speed (gaming the measure), while Alpha invests in new de-escalation training (improving the goal). By year's end, Alpha's resolution rate has surged 40% while their call volume is flat; Beta's volume is up 50% but resolutions are unchanged. Headquarters sees Beta's soaring numbers and cuts Alpha's budget to expand Beta's model, resulting in a net increase in untreated crises despite the "productivity" gain.

  ***

  **The Three Verdicts**

  1.  **The measure is gamed:** Team Beta consciously redirected effort from *resolving* crises to *counting* calls. This isn't fraud; they technically "handled" every call, but they optimized for the metric's definition rather than its intent, a shift visible to anyone listening to the recordings.
  2.  **The goal improved more than the number:** In Team Alpha (where the actual work happened), the thing we care about (resolutions) improved drastically (40%), while the number (calls) didn't move. The metric understates the value created because deep work is time-intensive and invisible to the counter.
  3.  **The decision is harmful:** Funding is allocated to Beta based on the metric. This is worse than a coin flip because the correlation between the metric and the goal is *negative* between units: high volume signals low resolution. A random choice would have given a 50% chance of saving Alpha; using the metric guaranteed her demise.

  **The Single Feature Doing the Work**

  The culprit is **Heterogeneous Marginal Productivity**.
  In Team Alpha, effort yields high *Goal* returns but low *Measure* returns (time-intensive care). In Team Beta, effort yields high *Measure* returns but low *Goal* returns (quick transactions). The metric assumes all units convert effort into value at the same rate. Because they don't, the metric ranks them inversely to their actual worth.

  **If You Remove That Feature**

  If both teams faced identical case mixes and had the same capacity to convert calls into resolutions (homogeneous productivity), the metric would work. Volume would correlate with resolutions across both units, and funding the busier team would indeed fund the more effective one. Goodhart's Law wouldn't trigger because there would be no "easy path" to inflate the number without inflating the goal.

  **The Wriggle Out**

  A defender of the measure would say: *"The metric isn't broken; your risk-adjustment is. We shouldn't abandon 'Calls Handled,' we should weight them by complexity. If you can't measure complexity, that's a data problem, not a philosophy problem."*
  They argue the failure is technical (missing variables) rather than structural (the act of measurement itself distorts behavior), implying that with enough data, the proxy can be perfected.

  **On Your Hunch**

  You are exactly right. This case vindicates your intuition: "Calls Handled" remains a valid guide to the *aggregate* level of activity (if total calls rise, total engagement likely rose), but it is poisoned for *selection* between non-exchangeable units. The slogan "a measure which becomes a target stops being a good measure" is too blunt because the measure often stays good for *monitoring trends* (time-series) even after it becomes useless for *comparing agents* (cross-section). The harm comes from confusing the two.
