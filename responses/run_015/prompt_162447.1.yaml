  Here is a structural draft for your column, written in British English and tailored to the specific arguments you want to make.

  ***

  ### The St Petersburg Paradox: Where the Money Isn't

  You know the setup. We flip a coin until it comes up heads. If the first heads appears on the $n$-th toss, I pay you $£2^n$. If it happens on the first go, you get $£2$. If it takes ten tosses, you get $£1,024$. The probability of lasting $n$ tosses is $1/2^n$.

  The arithmetic is seductive. Each possible outcome contributes exactly $£1$ to the expected value ($£2^n \times 1/2^n = 1$). Since there are infinitely many outcomes, the sum is infinite. Mathematically, the game is worth an infinite amount. Practically, the median payout is $£2$, and there is a 94% chance you walk away with $£16$ or less.

  This discrepancy is the St Petersburg Paradox. But the usual explanation—that infinity is weird—glosses over the mechanics of *why* expectation fails us here. To understand it, we need to look at where the value lives, how fragile it is, and whether bounding our utility actually solves the problem.

  #### 1. The Phantom Average

  In an ordinary game, say rolling a die, the expected value is a place the money actually lives. If the average payout is $£3.50$, and you play a hundred times, your total takings will hover near $£350$. The Law of Large Numbers guarantees that the running average settles down.

  In St Petersburg, the expectation is not a centre of gravity; it is a ghost. It is spread so thinly over such impossible outcomes that no human observation can ever catch it.

  Recall that every outcome contributes exactly $£1$ to the expectation. The $£2$ payout contributes a pound; the £1,048,576 payout also contributes a pound. For the average payout to reflect the true expectation, you would need to see *all* those outcomes in proportion. But the higher payouts are exponentially rarer. To see the outcome that pays $£2^{20}$ (about a million pounds), you need to play roughly a million games. To see the one that pays $£2^{40}$, you need a trillion games.

  Consequently, the running average does not settle. It creeps upward logarithmically. If you play $N$ games, the longest run of tails you are likely to witness is roughly $\log_2 N$. That single "freak" result dominates your total winnings. Since you effectively see outcomes from $n=1$ up to $n \approx \log_2 N$, and each contributes about $£1$ to the average, your average payoff per game after $N$ trials is approximately $£\log_2 N$.

  This destroys the "play it enough times and it averages out" defence. Suppose a casino charges you $£50$ a go. To justify that entry fee, your average return needs to exceed $£50$. Solving $\log_2 N = 50$ gives $N = 2^{50}$. That is roughly a quadrillion games. Even if you could play once a second, it would take you thirty million years to reach the break-even point. The expectation is infinite, but the convergence is so agonisingly slow that for any physical being, the expected value is functionally meaningless. The value is carried by outcomes you will never see.

  #### 2. The Discontinuity of Bias

  This brings us to a sharper problem, one that survives even if we remove the infinity. The infinite expectation relies on the coin being perfectly fair. But suppose the coin is microscopically biased towards heads. Let the probability of tails be $q = 0.5 - \delta$, where $\delta$ is a tiny number.

  The mathematics of the geometric series now behaves. The expected value becomes finite, roughly equal to $1/(2\delta)$. If the bias is just 0.05% ($\delta = 0.0005$), the expected value drops from infinity to about $£1,000$. If the bias is ten times smaller, the value jumps to $£10,000$. As $\delta$ approaches zero, the value blows up.

  This reveals a violent discontinuity. A coin that is biased by one part in a million has a finite expectation; a coin that is perfectly fair has an infinite one. Yet, the *experience* of playing is identical. With that one-in-a-million bias, your median payout is still $£2$. Your chance of winning less than $£16$ is still 94%. Distinguishing a fair coin from this slightly biased one would require on the order of a million flips—far more than you would accumulate in a lifetime of playing the game.

  What does this tell us? It suggests that the infinite expectation was an artefact of an idealisation nobody could verify. But it shows something more damaging: expected value is a terrible summary statistic for distributions this skewed, regardless of whether the sum is finite.

  When the expectation is £1,000 (due to the tiny bias), it is still driven entirely by the possibility of a payout you will almost certainly never see. The statistic is hypersensitive to the far tail of the distribution. If a summary of a game changes by orders of magnitude due to a bias you cannot detect, and yet your likely winnings remain unchanged, the summary is not describing the game you are playing. It is describing a mathematical property of the probability space that has decoupled from reality.

  #### 3. Uncertainty and the Utility Fix

  You might think this discontinuity offers a way out for the expected-value theorist. "Ah," they might say, "in the real world, we are never certain the coin is fair. If we admit uncertainty, the paradox dissolves."

  Suppose you are 90% sure the coin is fair, and 10% sure it has a small bias. You calculate your expected value by weighting the possibilities. But 90% of infinity is still infinity. Unless you are *certain* (probability 1) that the coin is biased, the expectation remains infinite. Uncertainty about the bias does not dilute the paradox; it makes it stickier. It implies that as long as you assign *any* non-zero probability to the coin being perfectly fair, the rational price to pay is infinite.

  This forces us to confront the standard fix: utility theory. The classical solution, proposed by Daniel Bernoulli, is that money has diminishing returns. We should maximise expected *utility*, not expected cash. If utility is logarithmic (the value of money is $\log(\text{amount})$), the sum becomes $\sum \log(2^n) \cdot 2^{-n} = \sum n \cdot 2^{-n}$, which converges neatly to a small finite number (roughly 2 units of utility).

  Does this solve it? It certainly deletes the infinity. But look back at the biased coin. Even when the bias makes the cash expectation finite (say, £1,000), the skew remains. The median is still £2. A logarithmic utility function handles this well, but is that because it captures the "true" value, or simply because it mathematically suppresses the tail?

  If the problem were solely about infinity, the biased coin version wouldn't feel paradoxical. But it does. Paying £500 to play a game with a median return of £2 feels absurd, even if the expected cash value is technically £1,000. This suggests that bounding utility isn't just a trick to remove infinity; it is an admission that expectation is the wrong tool for heavy-tailed risks. It acknowledges that for a single player (or a finite number of plays), the "average" outcome is a fiction.

  #### The Verdict

  So, what is the St Petersburg Paradox actually about? It is often presented as a problem of unbounded utility, but the biased-coin analysis shows the issues are separable.

  First, there is the **idealisation problem**. The infinite expectation relies on a casino with infinite capital and a perfectly fair coin. The biased coin shows that relaxing the "perfect coin" assumption collapses the infinity immediately. In this sense, the infinity is indeed an artefact.

  However, second, there is the **skew problem**. Even with finite expectation (the biased coin), the mean is vastly larger than the median. The expected value is carried by events so rare they are effectively impossible in a human lifespan. This survives the removal of infinity. It tells us that expectation is a guide for repeated trials under the Law of Large Numbers, and St Petersburg is a game where the Law of Large Numbers converges too slowly to be useful.

  Third, there is the **decision problem**. Why do we care about expectation? We care because we think it predicts what will happen. St Petersburg proves that for skewed distributions, it predicts nothing a single agent will experience.

  The paradox is not merely that infinity is counter-intuitive. It is that we conflate "mathematical expectation" with "reasonable price". The biased coin demonstrates that you can have a finite mathematical expectation that is still a unreasonable price. Therefore, the standard fix of logarithmic utility is not just deleting an infinity; it is correcting a category error. It shifts the focus from the properties of the distribution (the mean) to the properties of the player (their exposure to risk).

  The St Petersburg game is not a puzzle about how to sum a series. It is a warning label: do not use the average to navigate a landscape where the terrain is mostly flat but contains cliffs of impossible height. The map says the average elevation is the stratosphere, but you will never leave the ground.
