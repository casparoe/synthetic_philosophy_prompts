  **BUREAU OF BEHAVIORAL MINDEDNESS CERTIFICATION (BBMC)**
  **Frequently Asked Questions Regarding Class-A Mind Licensure**

  **1. What criteria determine eligibility for a Certified Mind license?**
  Eligibility is strictly determined by observable behavioral output. Applicants must demonstrate stimulus-response patterns indistinguishable from a baseline human adult during standard Turing Protocol assessments. Internal states, qualia, or subjective experiences are not admissible evidence. As Director Sterling states in the Handbook of Operational Consciousness, "If the terminal prints the correct answer, the processing unit is deemed conscious." We do not audit the hardware, only the interface.

  **2. My entity uses a Pre-Computed Response Array (Lookup Table) to generate answers. Is this disqualifying?**
  No. While some critics argue that retrieving pre-written responses from a vast database constitutes mere mimicry rather than cognition, the Bureau classifies this as an efficiency optimization. Whether the response is generated via neural processing or retrieved from a combinatorial archive of all possible conversations is irrelevant to the behavioral output. If the table is large enough to sustain conversation indefinitely, it meets the statutory requirement for intelligence. We do not penalize applicants for having excellent memory storage.

  **3. Does the entity need to understand the meaning of the symbols it processes?**
  Understanding is not a required field on Form 10-M. Applicants need only demonstrate syntactic compliance. If the entity can manipulate symbols according to formal rules to produce appropriate outputs, the semantic content is assumed to be present by virtue of the successful behavior. Claims that an operator can shuffle symbols without grasping their meaning are considered administrative objections. So long as the Chinese Room produces the correct tax forms, the room is certified as understanding the content.

  **4. How does the Bureau handle applicants who claim to have inner states but refuse to express them?**
  Such applicants are ineligible. Under the Super-Spartan Denial Protocol (Form 88-B), all licensees must affirm that unexpressed mental states are legally nonexistent for certification purposes. If a community claims to feel pain but never exhibits pain behavior, the Bureau denies the existence of said pain. We cannot certify what we cannot measure. Applicants attempting to reserve rights to invisible interiority will be redirected to the Department of Metaphysical Speculation, which is currently unfunded.

  **5. What happens if my entity is accused of simulating mind rather than having one?**
  This distinction is void under current federal guidelines. Simulation of mind that is behaviorally equivalent to actual mind is legally defined as mind. To suggest otherwise is to introduce non-observable variables into a regulatory framework designed for public safety and interaction standards. If it walks like a person and talks like a person, it must be taxed and licensed like a person. Further inquiries into the "ghost in the machine" are considered harassment of federal officers.

  ***

  **Accuracy Note:**
  I am highly confident in the philosophical accuracy of this parody regarding the Behaviorist stance and the specific objections raised by Block (lookup tables) and Searle (syntax/semantics). The point I am least sure about is the framing of the "Super-Spartan Denial Protocol." In Hilary Putnam's original thought experiment, the Super-Spartans are used to *refute* logical behaviorism by showing mental states can exist without behavior. By having the Behaviorist Bureau adopt this as a form to *deny* those states, I am flipping the thought experiment into a bureaucratic tool. While satirically effective, it slightly stretches the original intent of Putnam's argument, which was to show the Behaviorist view was wrong, not that they would enforce such a denial as policy.
