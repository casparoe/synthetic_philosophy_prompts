      *   *Step 5: The Trade-Off (10 mins).* If conflict remains, do we prioritize Rights or Welfare? (This is the judgment call).
      *   *Step 6: Sign-off (5 mins).*

      *Refining the Steps:* I need to make sure the "Liberal Paradox" is central. The paradox arises when a Right conflicts with Pareto. So the procedure must identify if a Right is actually being invoked, and if a Pareto improvement is available, and then force a choice between them.
      *Crucial Addition:* The prompt asks to *not* resolve the paradox by redefining "personal." So, Step 4 must acknowledge the bleed.
      *Crucial Addition:* The prompt asks for "explicit stopping points that yield a negative or deferred result."
      *Crucial Addition:* "Clear markers where judgment replaces logic."

  4.  **Developing the Worked Examples:**

      *   *Case 1 (Addiction):* A claims sovereignty. B & C claim contamination (makes their recovery look like endorsement). All 5 prefer no addiction (Pareto).
          *   *Analysis:* Strong Pareto. Strong Sovereignty claim. Strong Hermeneutic Harm claim.
          *   *Outcome:* Procedure should likely flag this as a "Rights vs. Welfare" clash requiring a value judgment, not a logical deduction.

      *   *Case 2 (Prologue):* D proposes collective prologue. All prefer it (Pareto). E claims sovereignty over entry point.
          *   *Analysis:* Prologue is *outside* individual chapters technically, but E claims it affects her chapter's entry.
          *   *Outcome:* This looks like a weak sovereignty claim vs. strong Pareto. Procedure should lean towards Pareto unless E can prove hermeneutic damage.

      *   *Case 3 (Pseudonyms):* Unilateral choice on names. All fear reader expectation shifts (Hermeneutic Harm).
          *   *Analysis:* Seems personal (attribution), but collective reputation/reading frame is affected.
          *   *Outcome:* High ambiguity. Likely requires a uniform rule (relinquish sovereignty for consistency).

  5.  **Addressing the "Breakdown" and "Stability" Question:**
      *   Sen's theorem proves no stable rule exists that satisfies both conditions universally. I must state this clearly. The collective *must* relinquish one principle in hard cases. The procedure shouldn't pretend otherwise.
      *   The "Judgment Call" is where they decide which principle to sacrifice for *this specific instance*.

  6.  **Refining the Tone:**
      *   Professional, direct, practical for writers.
      *   No academic jargon beyond what's necessary (explain "Pareto" simply as "Unanimous Improvement").
