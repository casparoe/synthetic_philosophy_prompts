      *   **Goal:** A reusable decision procedure (flowchart in words) executable in 45 minutes, no mediator, unanimous sign-off required.
      *   **Requirements:**
          *   Translate Sen's Liberal Paradox into a practical tool.
          *   Account for indirect interpretive effects (one writer's choice changes another's text meaning).
          *   Do *not* suppress the paradox by redefining "personal" away.
          *   Be honest about where judgment replaces logic.
          *   Include worked applications for three specific scenarios (Addiction, Prologue, Pseudonyms).
          *   Specify where the procedure breaks down/defers to judgment.
          *   Address whether stable decision rules exist or if a principle must be relinquished.
          *   No reading list/citations.
      *   **Constraints:** 5 members, monthly meetings, stakes are reputation/publication (not life/death), no social-choice theory training.

  2.  **Deconstruct Sen's Liberal Paradox in this Context:**
      *   *Liberal Principle:* Each individual has a right to decide at least one pair of social states (e.g., "My chapter has addiction" vs. "My chapter has no addiction").
      *   *Pareto Principle:* If everyone prefers State X to State Y, the group should choose X.
      *   *The Conflict:* Sometimes, exercising the Liberal Right leads to a State that everyone (including the rights-holder, potentially, or at least the rest of the group) agrees is worse than an alternative, but the Right prevents choosing the better alternative.
      *   *The Twist:* In a narrative collective, "personal spheres" are porous. A choice in Chapter 1 changes the reading of Chapter 2. This makes defining the "personal sphere" the crux of the conflict.

  3.  **Drafting the Procedure (The "45-Minute Sovereignty Test"):**
      *   *Time Management:* 45 minutes is tight. The steps need to be discrete and timed.
      *   *Structure:* Needs to be a sequence of questions (Yes/No/Maybe) leading to a decision or a deferral.
      *   *Core Tension:* Needs to explicitly weigh "Sovereignty Claim" against "Hermeneutic Harm" against "Unanimous Preference."
      *   *Honesty:* Must admit when the group is just voting on values rather than following a rule.

