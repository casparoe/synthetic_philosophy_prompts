      *   *Civil Philosophy:* Hobbes wants politics to be like geometry. Why? Because in politics (like geometry), we construct the causes. We create the commonwealth. We know the motives of men because we are men.
      *   *The User's Objection:* If definitions are just names, can't I just change the name/definition and get a different result? If "justice" is just a name, can't the Sovereign define it however they want and claim it's logically necessary?
      *   *The Flaw:* The user confuses *arbitrariness of definition* with *arbitrariness of deduction*. Hobbes admits definitions are stipulated (we decide to call a figure with three lines a triangle), *but* once stipulated, the consequences are necessary. The Sovereign cannot redefine the *logic* of the social contract (e.g., if you want security, you must surrender the right of nature) without breaking the causal chain. The certainty comes from the *generation* of the thing, not the metaphysical status of the object.
      *   *Key Distinction:* Ontology (what exists) vs. Epistemology/Logic (how we know consequences). Hobbes's certainty is *a priori* regarding causes we generate, not *a posteriori* regarding effects we observe.

