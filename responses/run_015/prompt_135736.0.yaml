answer: |-
  The precise mistake in this line of reasoning is the conflation of the **ontological status of definitions** with the **logical necessity of consequences** derived from those definitions. You assume that because Hobbes treats geometric and political terms as nominal constructs rather than mind-independent realities, the deductions flowing from them become arbitrary or subject to the will of the definer; however, for Hobbes, the certainty of geometry and civil philosophy arises *precisely because* the objects are constructed by the mind, allowing the philosopher to know the causes perfectly.

  **1. Existence vs. Logical Necessity**
  Hobbes's nominalism asserts that universal terms like "triangle" or "commonwealth" are names we impose on our conceptions, not discoveries of Platonic forms existing in nature. However, this does not render deductions arbitrary. For Hobbes, truth resides in the correct ordering of names in propositions, not in the correspondence between names and external entities. Once a definition is stipulated (e.g., "a triangle is a figure bounded by three straight lines"), the consequences follow with absolute logical necessity regardless of whether a physical triangle exists in the world. The constraint on the deduction is not the external object, but the internal consistency of the definition and the rules of reasoning. Therefore, the lack of mind-independent geometric objects does not weaken the deduction; it strengthens it, because we are reasoning about causes we have generated ourselves.

  **2. The Resolutive-Compositive Method and Political Certainty**
  In *De Cive* and *Leviathan*, Hobbes applies the resolutive-compositive method to civil philosophy not by observing existing states empirically, but by analyzing the "matter" and "motion" of human nature (resolution) and reconstructing the logical generation of a Commonwealth (composition). This method does not depend on Platonist commitments (that "Justice" exists independently) or strict empiricist commitments (that we derive laws solely from observing historical regimes). Instead, it depends on **causal generation**. Just as a geometer knows the properties of a circle because they conceive the generation of the circle (a point moving around a center), the political philosopher knows the rights of sovereignty because they conceive the generation of the state (individuals covenanting to authorize a sovereign).

  **3. The Sovereign and Arbitrary Redefinition**
  Your concern that a sovereign could arbitrarily redefine terms and still claim a "demonstration" misunderstands the role of the philosopher versus the role of the sovereign. Hobbes's demonstrations establish the *necessary conditions* for peace and stability (the Laws of Nature). While the Sovereign has the right to define civil laws and property, they cannot redefine the *logical consequences* of human passion and conflict without risking the dissolution of the state. If a Sovereign were to redefine the terms of the contract such that self-preservation is impossible, Hobbes's *demonstration* predicts the collapse of the Commonwealth. The validity of the political science rests on the causal link between human nature and political order, which remains binding regardless of the Sovereign's commands. The Sovereign commands the law, but they do not command the logic of the science that explains why sovereignty is necessary.

  Summary: Hobbes's nominalism secures rather than undermines political certainty because the truth of demonstrations depends on the logical consistency of stipulated definitions and causal generation, not on the mind-independent existence of the objects named.
