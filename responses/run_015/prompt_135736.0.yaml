      *   *Point 4: Resolutive-Compositive Method.* This method analyzes motion/matter (resolution) and reconstructs the political body (composition). It relies on causal necessity, not the metaphysical reality of "Justice" as a thing. It works because we *make* the commonwealth, just as we *draw* the circle.
      *   *Point 5: Addressing the Sovereign Redefinition.* The Sovereign determines *law* (command), but Hobbes's *philosophy* determines the *logic* of sovereignty. The philosopher shows what is necessary for a commonwealth to endure. The Sovereign can command X, but if X violates the laws of nature (prudential maxims), the commonwealth dissolves. The "demonstration" is about the necessary conditions for stability, not the whim of the ruler.

