prompt: |-
  If Hobbes is a nominalist about geometric figures—treating triangles and circles as names rather than mind-independent entities—and if he simultaneously claims that civil philosophy can attain geometric certainty through a resolutive-compositive method, then doesn't his ontology of mathematics undermine the authority of his political deductions? Specifically, if there are no real triangular things in nature to constrain our definitions, why can't a sovereign arbitrarily redefine the terms of the social contract and still call the result a 'demonstration'? Please identify the precise mistake in this line of reasoning: distinguish Hobbes's view about the existence of geometric objects from his view about the logical necessity of deductions made from precisely stipulated definitions, and explain why the resolutive-compositive method in De Cive does not depend on Platonist or empiricist commitments about the objects named. End with a single line beginning 'Summary:' that states the corrected point in one sentence.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Premise 1:** Hobbes is a nominalist about geometric figures (triangles/circles are names, not mind-independent entities).
      *   **Premise 2:** Hobbes claims civil philosophy can attain geometric certainty via the resolutive-compositive method.
      *   **Conclusion/Challenge:** Therefore, Hobbes's ontology of mathematics undermines his political deductions. If geometric objects aren't real/constraining, a sovereign could arbitrarily redefine social contract terms and still call it a 'demonstration'.
