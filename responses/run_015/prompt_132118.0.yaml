      *   *Compassionate Use:* Default shifts. Why? Because the patient consents to risk. The harm of omission (death) outweighs the harm of commission (unknown side effects) *for that specific agent*.
      *   *Supplements:* Default is intervention (sale). Why? Lower perceived risk profile, historical liberty interests (food vs. medicine), and perhaps regulatory capacity constraints. It treats the consumer as the risk manager.
      *   *Environmental:* Default is analyzed. Why? The state is the actor. It must justify its own footprint. Inaction is also a state choice with consequences.
      *   *Implicit Theory:* The core principle is **Asymmetric Accountability for Imposed Risk**. When an agent (firm/state) imposes risk on others without specific consent, the burden is on them to prove safety (Drugs). When the risk is self-imposed or the consequence of inaction is certain death (Compassionate Use), the burden shifts to proving harm or allowing choice. When the state acts, it must account for all consequences (Environmental). When risks are deemed trivial or liberty interests high (Supplements), the burden shifts to the regulator to prove harm.
      *   *Status Quo:* The status quo isn't inherently privileged; rather, the *source of initiation* matters. Who is changing the baseline?
