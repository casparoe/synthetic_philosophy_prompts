      *   *Carve-outs:* Compassionate use isn't sentimentality; it's the pressure valve when the meta-rule creates unacceptable certain harm (death). It acknowledges the cost of the precautionary regime (delayed access). It's the institutional trace of the paradox: strict precaution kills, so we carve out exceptions where the risk calculus flips.
