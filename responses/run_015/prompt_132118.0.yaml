      *   *Visibility:* This is the debunking story. Regulators minimize blame. Approved drug death = visible scandal. Disease death = background noise. Environmental review makes inaction visible to protect the agency from later claims of negligence.
      *   *Evaluation:* The practice *requires* the Burden-of-Proof mechanism to function procedurally. However, the Visibility reading explains the *selection* of those burdens. Why is the burden on the drug firm? Because visible deaths cause political fallout. Why is inaction analyzed in environmental reviews? To make the invisible visible.
      *   *Compatibility:* They are compatible. Visibility explains the political origin of the Burden allocation. The Burden reading is the legal formalization. The Visibility story is a debunking of the *moral* claim but a reconstruction of the *political* reality. It suggests the principle isn't a moral truth but an accountability technology.

  4.  **Drafting - Section 3: Self-Application (~250 words)**
