answer: |-
  ### Reconstruction

  The implicit theory unifying these practices is not a consistent commitment to safety or liberty, but a **Consent-Based Allocation of Risk Burdens**. The status quo is not inherently privileged; rather, the privilege attaches to the party that has not consented to bear the risk of change. In the prescription drug case, the firm proposes a change to the biological status quo of a population that cannot offer individual consent. Therefore, the burden of proof rests on the proposer to demonstrate safety. The moral distinction between acting and allowing here is mediated by agency: the regulator acts as a proxy for collective consent, treating unauthorized intervention as a violation of bodily integrity.

  In the terminal patient case, the calculus shifts because consent becomes possible and the irreversibility of the status quo (death) outweighs the irreversibility of the intervention (side effects). The patient proposes the change to their own status quo. Since the risk-bearer consents, the burden shifts to proving harm rather than safety. The "nothing left to lose" clause is an acknowledgment that when the baseline is certain destruction, the precautionary default against intervention collapses.

  The supplement case treats consumers as sovereign agents akin to the terminal patient, assuming low stakes and high liberty interests. The regulator intervenes only post-hoc because the consumer is presumed to consent to market risks. Finally, the environmental review neutralizes the act/omission distinction for the state itself. When the state is the actor, both building and not building are state choices with public consequences. By forcing the costs of inaction onto the page, the regime acknowledges that the state cannot hide behind the status quo as a natural baseline. The unifying principle is that the burden of proof follows the lack of consent and the capacity to bear irreversible loss, not a fixed preference for inaction.

  ### The Two Readings

  The practice strictly requires the **burden-of-proof reading** to function procedurally. It provides the operational logic: someone must speak first and produce evidence. This reading makes the pattern coherent by defining the "proponent of change" contextually. In drugs, the firm proposes; in supplements, the consumer proposes; in environmental reviews, the agency proposes. This reading fits well but remains morally thin; it explains the mechanism but not the justification for shifting the proponent role.

  The **visibility reading** is a debunking reconstruction of the political incentives driving those assignments. It posits that burdens are allocated to minimize traceable blame. A death by approved drug is a singular, traceable event attributable to the regulator; a death by disease is statistical noise. This reading explains why the burden is so heavy for drugs (high visibility of failure) and light for supplements (low visibility of harm). It is compatible with the principle being true only if the principle is understood as an accountability technology rather than a moral truth. The environmental review procedure supports the visibility story: it is an institutional repair designed to make the invisible costs of inaction visible, thereby protecting the agency from future blame. Thus, the visibility story reconstructs the *political reality* presupposed by the practice, while the burden-of-proof story reconstructs the *legal formalism*. The practice relies on the former to justify the latter.

  ### Self-Application

  Applying the precautionary principle to itself generates a genuine tension, though not a logical paradox. Adopting a strict regulatory regime is an intervention with uncertain costs, including technologies delayed and lives lost to waiting. If the principle required proof of safety for itself, it could never be adopted. The resolution lies in recognizing the principle as a meta-rule for catastrophic risk, not a risk itself. The carve-outs for compassionate use and emergency authorization are not sentimentality; they are the institutional trace of this self-application problem. They acknowledge that the precautionary regime imposes its own mortality costs. When the cost of precaution (certain death from lack of treatment) becomes visible and immediate, the regime must relax to avoid self-defeat. These exceptions function as pressure valves, admitting that the principle cannot be absolute without becoming destructive. They are structural necessities for a system that manages uncertainty rather than eliminating it.

  ### Underdetermination

  The pattern is significantly underdetermined. An **expected-utility maximizer** with asymmetric priors (assuming novel interventions have high variance) would license the drug regime but might struggle with the supplement exception unless transaction costs are factored in. A **maximin rule** (avoid the worst outcome) fits the drug case well but fails to explain why environmental inaction is analyzed neutrally rather than preferred. A **rights-based view** (no non-consensual risk imposition) explains the drug/supplement distinction cleanly but requires ad hoc adjustments for the terminal patient unless rights are waivable. A **political capture story** suggests the pattern reflects industry power: pharmaceutical firms accept high barriers to limit competition, while supplement lobbies demand low barriers.

  To discriminate between these, we need evidence of regulatory decision-making under conflicting pressures. If regulators approve dangerous drugs during epidemics despite low evidence (utility/rights), but block safe supplements due to lobbying (capture), the political story gains weight. If environmental reviews consistently show inaction as superior yet action is chosen, the visibility/blame-avoidance story is stronger than the utility story. Currently, the pattern fits all these views because they converge on risk aversion for high-visibility harms. We would need cases where safety, rights, and political incentives diverge to isolate the driving logic.

  ### What Would Change My Mind

  I am more confident in the conceptual claim that burden-allocation explains the structure than in the empirical claim that this logic drives regulator behavior. My reconstruction fails if the pattern is merely historical accretion—path dependence rather than principle. Specifically, I depend on the factual claim that environmental reviews genuinely weigh inaction as a co-equal option. If evidence showed these reviews are box-ticking exercises where inaction is systematically undervalued or ignored, the "neutral status quo" claim collapses, undermining the Consent-Based theory.

  I would change my verdict if data showed regulatory burdens correlate perfectly with lobbying expenditure rather than risk profiles or consent structures. For example, if high-risk supplements faced no scrutiny due to industry power while low-risk drugs faced delays due to bureaucratic inertia, the "Implicit Theory" would be exposed as a rationalization of rent-seeking. My conceptual analysis assumes a functional state; if the state is purely reactive to power, the philosophical reconstruction is irrelevant. I defend the burden-of-proof logic on conceptual grounds, but the assignment of those burdens is an empirical question I am less certain about.
