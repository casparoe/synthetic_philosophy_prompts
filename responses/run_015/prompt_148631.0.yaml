      *   **Specific Questions:** Does (4) [Prioritarianism] do the work implied in (3) [Utility Monster]? Does (5) [Epistemic Humility/Maximization] leave the rejection of the monster with practical grip?
      *   **Tone/Style:** American English, concrete, audit-focused (not a literature tour).

  2.  **Analyze the Commitments:**
