  ### 1. The Prediction
  Your supervisor will rule that the supervaluationist package regarding vagueness is **substantive**, not deflationary. Consequently, she will reject your friend's "sharpening-relative minimalism" as a mislabeling of a substantive theory.

  While your friend argues that indexing the equivalence schema to sharpenings preserves deflationism (analogous to her acceptance of "truth in a model"), she will distinguish the two cases based on the **ambition of the predicate**. "Truth in a model" is explicitly a defined, technical predicate distinct from the natural language truth predicate. Supervaluationism, however, proposes that *supertruth* (truth on all sharpenings) is the correct analysis of our *actual* truth predicate for vague language. Because this analysis requires restricting the unrestricted T-schema for borderline cases (a borderline sentence is not true, but "It is true that..." is false), it posits a structure to truth that minimalism denies.

  ### 2. The Governing Rule
  The rule she is running is best stated as the **Structural Transparency Condition**:

  > *Truth is non-substantive if and only if the truth predicate functions as a transparent logical device satisfying the unrestricted, unparameterized T-schema for the target language. Any view that requires restricting the schema, parameterizing the predicate, or imposing a hierarchy to maintain consistency or semantic coherence posits a substantive structure of truth.*

  This rule prioritizes the **logical behavior** of the predicate over its metaphysical commitments. It explains why "truth in a model" is safe (it is explicitly parameterized and makes no claim to be *the* truth predicate) while the Liar and Vagueness are not (they claim to describe *the* truth predicate but fail the transparency test).

  ### 3. Load-Bearing Verdict
  The **Liar Paradox** verdict is the load-bearing premise for this prediction.

  *   **Why:** In the Liar case, she explicitly admits that the inability to maintain a "consistent and complete unrestricted schema" forces the admission of substance (hierarchies, gaps, etc.). This establishes that *schema failure* is the trigger for substantive theory.
  *   **Application to Vagueness:** Supervaluationism preserves classical logic for the metalanguage but sacrifices the unrestricted T-schema for the object language (borderline sentences fail the equivalence). This mirrors the Liar situation: a semantic phenomenon forces a structural restriction on the truth predicate. Therefore, by the logic of the Liar verdict, it must be substantive.
  *   **Why not Truthmaking?** The Truthmaking verdict ("truth is on the receiving end of a real explanation") is consistent with this rule but is secondary. It shows that explanatory priority matters, but the Liar verdict is stronger because it identifies the *formal breakdown* (schema restriction) as the specific point where deflationism ends.

  ### 4. Competing Rules
  Two other rules fit her seven verdicts almost as well, but diverge on the prediction:

  *   **Rule B: The Explanatory Idleness Rule.**
      *   *Formulation:* Truth is non-substantive only when it does no metaphysical or explanatory work. If 'true' appears in a *because*-claim (Truthmaking) or is required to explain consistency (Liar), it is substantive.
      *   *Fit:* Explains Truthmaking and Liar verdicts well. Explains why "success of science" is deflationary (explanatorily idle).
      *   *Divergence:* It is less clear on Vagueness. Supervaluationism might be seen as merely a logical device (like models) rather than metaphysical explanation. If she views sharpenings as merely logical tools, Rule B might allow Vagueness to be deflationary, whereas Rule A (Structural Transparency) forbids it due to schema failure.

  *   **Rule C: The Inconsistency-Only Rule.**
      *   *Formulation:* Truth is non-substantive unless the naive theory is outright inconsistent (Liar) or invokes robust metaphysics (Truthmaking). Mere parameterization (Models, Worlds) is fine.
      *   *Fit:* Fits Models and Worlds perfectly. Fits Liar (inconsistency).
      *   *Divergence:* Vagueness is not inconsistent; it is merely gappy. If she treats gaps as distinct from inconsistencies, Rule C might classify Vagueness as deflationary (just another parameterization like worlds). Rule A classifies it as substantive because the *unrestricted* schema fails.

  ### 5. The Decisive Test Case
  To distinguish between **Rule A (Structural Transparency/Schema)** and **Rule B/C (Metaphysics/Inconsistency)**, the decisive test case is **Epistemicism about Vagueness**.

  *   **The Case:** Epistemicism holds that vague predicates have sharp boundaries (bivalence holds) and the unrestricted T-schema is valid, but we cannot *know* where the boundaries lie.
  *   **The Split:**
      *   **If she follows Rule A (Schema):** She should classify Epistemicism as **deflationary** (or at least, less substantive than supervaluationism). The T-schema remains unrestricted and transparent; the "substance" is merely an epistemic limitation, not a structural change to truth.
      *   **If she follows Rule B (Metaphysics):** She should classify Epistemicism as **substantive**. It posits a robust metaphysical fact (sharp boundaries in reality/language) that goes beyond the deflationary remit, even if the logic is classical.
  *   **Why this tells the rules apart:** Supervaluationism sacrifices the Schema to save Classical Logic/Metaphysics. Epistemicism sacrifices Metaphysical Parsimony to save the Schema. Her verdict on Epistemicism will reveal whether she cares more about the *logical form* of the truth predicate (Rule A) or the *ontological cost* of the theory (Rule B).

  ### Summary for the Introduction
  In drafting the intro, you should frame her view not merely as "truth is not a property," but as "truth is a logical device that loses its deflationary status the moment it requires structural repair." This allows you to present the vagueness case as a boundary marker: the point where the logical device breaks down and a theory of truth *structure* must begin. This avoids flattery by focusing on the *costs* of her view (admitting substance where others might not) rather than its elegance.
