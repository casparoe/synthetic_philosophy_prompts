  1.  **Analyze the Request:**
      *   **Role:** Novelist.
      *   **Occasion:** Intimate workshop on narrative ethics.
      *   **Audience:** Mixed (Moral Philosophers & Fiction Editors). Needs to appeal to both without alienating either.
      *   **Core Concept:** "Moral Singularities" (ethical moments in fiction so dense/contextual they resist universal principles).
      *   **Argument:** Particularism describes fiction's moral power better than Generalism.
      *   **Constraint:** Fiction does *not* issue moral rules for living.
      *   **Tone:** Intimate yet precise, literary rather than lecture-like.
      *   **Format:** Polished, five-minute speech (approx. 750-900 words spoken at a moderate pace).
      *   **Language:** British English.
      *   **Key Device:** Develop the idea through *one invented narrative scene*.

  2.  **Deconstruct the Core Concept ("Moral Singularities"):**
      *   *Generalism:* Morality is based on universal rules (e.g., "Never lie," "Always protect the innocent").
      *   *Particularism:* Morality depends on the specific context; rules often fail in complex situations.
      *   *Moral Singularity:* A point in a story where the gravity of the specific situation bends the light of moral judgment so much that a universal rule breaks down. It's not about ambiguity; it's about density.
      *   *The Trap:* I must avoid saying fiction teaches us *what* to do. It shows us *how it feels* to decide.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room. Bridge the gap between the philosophers (theory) and editors (practice). Set the tone (intimate, quiet).
      *   **The Scene (The Heart):** I need a specific, invented vignette. It needs to be ethically fraught but not a cliché (no trolley problems). Let's try something domestic but high stakes. A parent, a child, a lie? Or perhaps something about loyalty vs. truth.
          *   *Idea:* A character finds something they shouldn't. They have to decide whether to reveal it.
          *   *Refinement:* Let's make it about mercy vs. justice in a small setting. A shopkeeper and a thief? Too simple. A doctor and a patient? Too clinical.
          *   *Selected Scene:* A woman (Elena) finds a letter in her deceased husband's pocket that suggests he was unfaithful, but revealing it would destroy the memory her grieving daughter holds of him.
          *   *Why this works:* Truth (universal good) vs. Compassion/Protection (universal good). They collide. The context dictates the morality.
      *   **Developing the Concept:** Connect the scene to "Moral Singularities." Explain why a rule fails here.
      *   **The Argument (Particularism vs. Generalism):** Argue that fiction's job isn't to solve the equation but to show the weight of the variables. Fiction doesn't give rules; it gives gravity.
      *   **Closing:** Bring it back to the room. The work of the editors and philosophers. A final literary flourish.

  4.  **Drafting - Tone and Language (British English):**
      *   Use spelling: *colour, honour, recognise, centre*.
      *   Vocabulary: *whilst, amongst, shall, ought* (sparingly, to keep it natural).
      *   Style: Lyrical but controlled. Avoid academic jargon where possible, or explain it metaphorically.

  5.  **Writing - First Pass (Mental or rough notes):**
      *   Welcome everyone.
      *   Talk about the tension between rules and stories.
      *   Tell the story of Elena and the letter.
