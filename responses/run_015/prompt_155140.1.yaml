answer: |-
  Good evening.

  It is a rare privilege to stand between two tribes who usually converse only in footnotes or margin comments. To the philosophers here: you map the architecture of the good. To the editors: you are the custodians of the true. Tonight, I wish to suggest that where your maps and our manuscripts overlap, there is a terrain that resists both cartography and correction.

  I call these moments 'moral singularities'.

  In physics, a singularity is a point where density becomes infinite, and the known laws of nature cease to apply. In fiction, a moral singularity is a moment so densely contextual that no universal principle can capture its weight without crushing the life out of it. It is the point where generalism—the belief that right action is determined by universal rules—meets the particularism of lived experience, and finds itself wanting.

  Let me offer you a scene.

  Elena stands in the hallway of a house that still smells of her husband's tobacco, three days after his funeral. In her hand, she holds a letter found in the lining of his coat. It is not a confession of crime, nor of violence. It is a quiet admission of a decades-long emotional affair, written to a woman who died years prior. It reveals that the marriage Elena mourned was not the marriage her husband lived.

  Down the hall, their seventeen-year-old daughter is sleeping. She is preparing for her A-levels. She worships the memory of the father she lost last week. She believes, with the brittle certainty of grief, that her parents' love was absolute.

  Elena holds the letter over the bin. She holds it over the desk.

  If we apply a generalist rule—'Truth is a virtue'—Elena ought to preserve the letter, or perhaps tell the girl. Honesty is a duty. But if we apply another—'Do no harm'—she must burn it. To reveal the truth is to fracture the daughter's foundation when she is least able to rebuild it.

  A philosopher might ask: *What is the right thing to do?*
  An editor might ask: *What serves the character?*

  I submit that in this room, we must ask a different question: *What happens to the rule when it touches the room?*

  This is the moral singularity. It is not that the morality is ambiguous. It is not foggy. It is, rather, too heavy. The gravity of the specific details—the smell of the tobacco, the age of the child, the finality of the grave—bends the light of ethical judgment so severely that a universal law cannot travel in a straight line here.

  If I write this scene to demonstrate that 'honesty is always best', I have written a pamphlet, not a novel. If I write it to prove 'mercy is superior to truth', I have written a sermon. In both cases, I have reduced the singularity to a slogan. I have betrayed the particular.

  Fiction does not issue moral rules for living. It does not exist to tell you whether Elena should burn the paper. Its moral power lies in its fidelity to the cost of the decision. It forces the reader to inhabit the tension without the relief of a maxim. It argues for particularism not by stating it, but by making you feel the failure of the rule in your own chest.

  We are not in the business of solving ethics. We are in the business of preserving the complexity of the moment against the simplifying hunger of the principle.

  To the philosophers in the room: I know you seek coherence. But I ask you to consider that the coherence of a human life is often found in its contradictions, not its consistencies.
  To the editors: I know you seek clarity. But I ask you to protect the moments where clarity feels like a lie.

  When we protect these singularities, we acknowledge that to be human is to navigate a world where 'right' and 'right' are often at war, and where the only guide is the terrifying specificity of the now.

  Let us not use stories to flatten the world into rules we can carry easily. Let us use them to honour the weight we must bear.

  Thank you.
