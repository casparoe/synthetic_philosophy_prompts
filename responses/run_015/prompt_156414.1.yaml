      *   *The Problem in History:* Real historical events rarely have truly independent, sufficient causes happening in isolation. Causes usually interact.
      *   *User's Twist:* "Layered overdetermination" (nested conditions). This sounds more like *conjunctural causation* or *INUS conditions* (Insufficient but Necessary parts of a condition which is itself Unnecessary but Sufficient) than classic overdetermination. I need to address this distinction.

