answer: |-
  **Desiderata for a Theory of Non-Human Causation in History**

  To function as a tool for working historians, a theory of non-human causes must satisfy empirical, conceptual, and methodological requirements. The following desiderata are designed to distinguish causal significance from background scenery while preventing environmental determinism.

  **1. Empirical Adequacy (Non-negotiable)**
  A valid theory must account for four specific causal architectures without reducing them to a single model.
  *   **The Volcanic Test:** A large tropical eruption causes a year without a summer and harvest failure across Europe and New England. This tests **necessity**. The theory must allow a non-human factor to be a necessary condition for a widespread outcome where human variation is negligible.
  *   **The Expedition Test:** A mosquito-borne disease decides the fate of a colonial military expedition. This tests **contingency**. The theory must explain how a biological agent overrides human strategy in a specific locale without implying the colony was doomed regardless of human action.
  *   **The Violence Test:** A drought triggers migration and violence in a region that has weathered comparable droughts without violence. This tests **interaction**. The theory must distinguish the environmental stressor from the social vulnerability that converts stress into conflict.
  *   **The Idiom Test:** Two formally identical harvest failures, one produced by weather and one by tax policy, elicit different causal idioms. This tests **responsibility**. The theory must explain why historians assign blame differently despite identical outcomes, preserving the distinction between misfortune and malice.

  **2. Conceptual Integrity (Non-negotiable)**
  The theory must maintain four distinctions to prevent conceptual collapse.
  *   **Trigger versus Standing Condition:** A **trigger** is the immediate precipitating event; a **standing condition** is a background state necessary for the event but insufficient to cause it alone. A volcanic eruption may be a trigger for famine, but soil depletion is a standing condition. Collapsing these obscures timing and leverage.
  *   **Constraining versus Enabling:** Non-human factors often limit options (**constraining**) rather than forcing specific outcomes. A theory must differentiate between a climate that makes agriculture impossible versus one that merely raises costs.
  *   **Cause versus Selector:** A factor is a **cause** if it produces an event; it is a **selector** if it determines which social arrangements survive a shock. A pathogen may not cause a war but selects which army remains viable.
  *   **Explaining versus Excusing:** This addresses the **alibi problem**, where an environmental factor is invoked to absolve agents of responsibility. The theory must prevent the asymmetry where climate is recruited as an excuse for failure while pathogens are recruited as explanations for death. Non-human causes may explain mechanisms, but they must not automatically excuse human negligence.

  **3. Methodological Tests (Adjudicated)**
  Two candidate requirements are evaluated for inclusion.
  *   **The Substitution Test (Non-negotiable):** A non-human factor counts as more than background only if swapping in the nearest available alternative state of that factor—no eruption, a milder winter, a different pathogen—would have changed not merely the date or the body count but which options were live for the human agents deliberating at the time. This is a genuine desideratum of causal logic. It rules out factors that are merely correlated with outcomes. It survives the Volcanic and Expedition tests but struggles with the Violence test, where social factors may overdetermine the outcome regardless of the specific drought.
  *   **The Uptake Condition (Preference of a particular camp):** A factor counts only if it was registered at the time, however dimly, as risk, rumor, portent, or explanation by at least some participants. This is a prejudice of intellectual and cultural history, prioritizing historical actors' perspectives over structural reality. It silently rules out unconscious structural forces and scientific explanations unavailable to contemporaries. It fails the Expedition test, as agents often lacked knowledge of germ theory. It passes the Idiom test, as agents distinguish weather from policy.

  **4. Incompatibility and Exclusion**
  There is a fundamental tension between the **Substitution Test** and the **Uptake Condition**. They cannot be jointly satisfied in pre-scientific contexts. If a pathogen decides an expedition (Substitution passes) but agents attribute failure to divine wrath (Uptake fails), the historian must choose between causal accuracy and hermeneutic fidelity. Requiring both renders most pre-modern environmental history impossible.

  The single requirement that does the most work in excluding actual positions is the **Explaining versus Excusing** distinction. It specifically targets **environmental determinism**. By refusing to allow environmental factors to serve as moral alibis, it prevents the slide from "climate influenced the outcome" to "climate dictated the outcome, so no one is responsible." This ceiling ensures non-human factors remain part of the explanation without consuming the agency required for historical judgment.

  **5. Stance Evaluation**

  | Stance | Score Against Desiderata |
  | :--- | :--- |
  | **Strict Human Exceptionalism** | Fails Empirical Adequacy; cannot account for Volcanic or Expedition tests where humans lack control. |
  | **Environmental Determinism** | Fails Explaining vs. Excusing; collapses cause and excuse, violating the ceiling on explanatory work. |
  | **Flat Symmetric Ontology** | Fails Conceptual Integrity; treats germs and treaties as identical actors, obscuring the Idiom Test distinctions. |
  | **Middle View (Constraints/Affordances)** | Passes all non-negotiables; treats non-humans as limiting conditions without absolving human agency. |
