answer: |-
  1. **The Case**

  Elena, a hospital lab tech, verifies a blood sample is O-negative using standard serology and manual cross-match (combined error rate 1/10,000). She logs this for routine pre-op clearance, unaware that downstream oncology protocols require absolute certainty due to rare antibodies, making error fatal. A genetic sequencer could verify the type but delays surgery by two hours. To Elena, this delay is wasteful bureaucracy; to the Chief of Surgery reviewing the file, aware of the oncology constraint, the delay is negligible compared to mortality risk. Elena releases the blood; the Chief pauses, reviewing Elena's standard protocol against the hidden fatality risk.

  2. ** Held-Fixed Parameters**

  | Parameter | Value |
  | :--- | :--- |
  | **Proposition** | Blood is O-negative. |
  | **Evidence** | Serology + cross-match (1/10,000 error rate). |
  | **Real Cost of Error** | Fatal (High). |
  | **Cost of Checking** | 2-hour delay (Costly to subject, cheap vs. death). |
  | **Subject's Awareness** | Unaware of fatal risk (Perceives Low Stakes). |
  | **Assessor's Context** | Chief reviewing for surgery (High Salience). |

  3. **Verdicts and Reasoning**

  | Account | Q1: Does she know? | Q2: May she act? | Reasoning & Key Feature |
  | :--- | :--- | :--- | :--- |
  | **Attributor Contextualism** | **No** | **Yes** | **Q1:** Assessor's context sets high standard (fatal risk salient); evidence insufficient. **Q2:** Subject's context sets low standard (routine); evidence sufficient. **Keys on:** Assessor's context vs. Subject's context. |
  | **Interest-Relative Invariantism** | **No** | **No** | **Q1:** Standard invariant, set by *actual* stakes (fatal); evidence insufficient. **Q2:** Knowledge required for action; none present. **Keys on:** Objective stakes of subject's situation. |
  | **Transparency-Conditioned** | **Yes** | **Yes** | **Q1:** Standard set by *perceived* stakes (routine); evidence sufficient. **Q2:** Knowledge present; action permitted. **Keys on:** Subject's awareness of stakes. |

  4. **The Load-Bearing Feature**

  The **Stake Awareness Asymmetry** (the gap between objective stakes, subjectively accessible stakes, and ascriber context) does the work.
  *   **Remove Direction 1 (Subject told):** If Elena knows the fatal risk, her perceived stakes match objective stakes. **TCE collapses into IRI** (both return No/No), as encroachment triggers. AC remains distinct (No/Yes) because the Assessor's context remains high.
  *   **Remove Direction 2 (Assessor relaxed):** If the Chief's context is low-stakes (routine review), salience drops. **AC collapses into TCE** on Q1 (both return Yes), as the ascriber's standard lowers. IRI remains distinct (No/No) because objective stakes remain high.
  This shows the three-way split relies entirely on maintaining the divergence between these three stake-perspectives.

  5. **Strongest Attack**

  **Target:** Interest-Relative Invariantism (IRI).
  **Attack:** The **Opacity Objection**. IRI denies knowledge and permission to act based on facts (the oncology protocol) completely inaccessible to the subject. This severs the link between knowledge and rational agency: Elena is rationally blameless and evidentially sound, yet IRI deems her action impermissible.
  **Why Strongest:** It strikes at the core motivation for pragmatic encroachment (aligning knowledge with practical reasoning) by showing that IRI can make knowledge norms *less* guiding for the agent than traditional invariantism, rendering the subject vulnerable to norms they cannot possibly satisfy.
