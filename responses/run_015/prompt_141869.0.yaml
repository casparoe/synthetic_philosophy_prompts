  *The conference room is quiet except for the hum of the projector. ELENA taps a pen against a stack of papers. MARCUS stares at the draft policy on the table.*

  **ELENA:** We have eighteen minutes before the committee convenes. We still don't agree on the preamble. If we recommend the Dual Consent Protocol, we are formally recognizing two agents in that body. If we don't, we treat them as one.

  **MARCUS:** And the stakes are surgery. If there are two subjects, requiring both to consent is basic ethics. If there's one, requiring dual consent is bureaucratic harassment of a disabled patient.

  **ELENA:** Let's look at the case you sent over. The patient five years post-op. The right hand drafts an email to an estranged father—conciliatory, vulnerable. The left hand deletes it before sending. When asked why, the speaking mouth invents a story about technical difficulties.

  **MARCUS:** Exactly. The right hemisphere writes a desire; the left hemisphere executes a veto. Then the speaking side lies to cover the rift. That isn't one person having mixed feelings. That is one agent acting against another agent's will, followed by a cover-up.

  **ELENA:** Or it's one person with conflicting impulses, where the motor control is lateralized. We all delete drafts we regret. The confabulation isn't a cover-up; it's the brain's drive for narrative coherence. The speaking side doesn't know why the left hand moved, so it guesses. It's a wiring error, not a second mind.

  **MARCUS:** But the left hand isn't moving randomly. It's acting on information the speaking side never received. If I show an image only to the left visual field, the right hemisphere sees it. The patient says they saw nothing, but the left hand picks the object associated with the image. How can one subject know and not know simultaneously?

  **ELENA:** *She leans forward, tapping the table.* That's where the graded callosotomy matters. Imagine we don't cut the cord completely. Imagine we can throttle the transmission down to any percentage and restore it afterward. We dial it to forty percent. Information leaks across, but slowly. Are they two people at forty percent? What about ten?

  **MARCUS:** There has to be a threshold. If integration drops below a certain level, the unity of consciousness fractures.

  **ELENA:** That's the problem. Biology is rarely binary. If you say there's a threshold, you're saying personhood pops into existence based on bandwidth. If I throttle it back up, do the two people merge into one again? Did we kill a subject by restoring the connection?

  **MARCUS:** *He pauses, rubbing his temple.* I'll concede the merger problem is difficult. If restoration feels seamless to the patient, it suggests the underlying substrate remained singular. But that doesn't prove unity during the split. Look at the agency. The left hand can refuse surgery even if the mouth agrees. Under our protocol, that refusal stands.

  **ELENA:** Because we're prioritizing safety, not metaphysics. But consider people born without a corpus callosum. Agenesis. They don't have the wiring to sever. Yet they report an ordinary, single stream of experience. They don't feel like two people.

  **MARCUS:** That's developmental compensation. Their brains rewire around the missing bridge during infancy. The split-brain patient had a unified history that was violently interrupted. The agenesis patient never had that unity to lose. You can't use the congenital case to define the post-surgical one.

  **ELENA:** But the anatomy is identical. Same lack of transmission. If anatomy dictates subjecthood, they should be the same. If experience dictates it, they are different. Which metric are we using for this policy?

  **MARCUS:** We're using moral risk. If there's a chance there are two subjects, we must treat them as two. But I need to distinguish what we're counting. You're conflating unity of consciousness with unity of agency.

  **ELENA:** Go on.

  **MARCUS:** I can grant you that there might be only one *phenomenological* subject—one thing that "feels" like someone is home. But agency is fragmented. The right hand acts on motives the left hand doesn't share. Even if there is one "I" experiencing the world, there are two "I"s trying to control the body.

  **ELENA:** *She nods slowly.* I can concede that. The functional independence is real. The left hand can solve puzzles the mouth can't explain. But that's access to report, not necessarily distinct subjecthood. It's like me forgetting why I walked into a room, except the memory is stored in a locked cabinet.

  **MARCUS:** It's not a locked cabinet if the hand inside the cabinet refuses to open the door. But here is where I concede to you: the confabulation. When the patient explains the deletion, they speak with confidence. They aren't hedging. That drive for a single narrative suggests a deep, underlying unity that resists the split. If there were truly two distinct subjects, why does the speaking side care so much about making the left hand's action make sense within *its* story?

  **ELENA:** Because the brain is a meaning-making engine. It hates noise. But Marcus, if we write this policy based on your view, we invalidate the patient's own testimony. They say they are one person.

  **MARCUS:** They say what the speaking hemisphere can articulate. The silent hemisphere doesn't get a vote in the interview. That's why we need the tablet tapping.

  **ELENA:** *She checks her watch.* Twelve minutes. We need a conclusion. I can't sign off on "two subjects" without a definition of where the line is drawn. If I support the Dual Consent Protocol, I need to know what would prove me wrong.

  **MARCUS:** And I can't support a standard consent form if I believe there's a risk of silencing a non-verbal agent.

  **ELENA:** Then let's state our falsification conditions in the memo. For me to accept the Two Subject view, I need a result from the graded callosotomy. If we throttle transmission to ninety percent—almost fully connected—and the patient still demonstrates conflicting voluntary actions that cannot be integrated... if high bandwidth doesn't restore unified agency, then the split isn't about connection. It's about something deeper. That would convince me there are truly two agents.

  **MARCUS:** *He picks up his pen.* Fair. And for me to accept the One Subject view? I need to see the post-op patient over time. If the conflicting actions cease. If the left hand stops vetoing the right, not because of physical restriction, but because the intentions align naturally over five, ten years... if the divergent desires converge without coercion, then perhaps it was just one mind healing from trauma.

  **ELENA:** So, if high bandwidth fails to unify, you win. If time succeeds in harmonizing, I win.

  **MARCUS:** It leaves the current patient in limbo.

  **ELENA:** Then the protocol stays. Precautionary principle.

  **MARCUS:** *He signs the bottom of the draft.* Agreed. But we note the dissent on the metaphysics.

  **ELENA:** *She signs below him.* Noted. Let's go.
