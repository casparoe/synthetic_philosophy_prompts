  7.  **Addressing Impossibility Theorems:**
      Gustaf Arrhenius's work is essential here. He proved that no theory can satisfy a set of adequate conditions (including avoiding RC, avoiding Sadistic Conclusion, Transitivity, etc.). I must highlight this. The prompt asks to identify subsets that appear jointly unsatisfiable.
