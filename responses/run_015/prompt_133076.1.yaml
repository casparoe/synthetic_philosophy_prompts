answer: |-
  ### Preamble: The Impossibility Context

  Before listing the desiderata, we must acknowledge the meta-ethical constraint established by Gustaf Arrhenius and others: **No population axiology can satisfy all adequate conditions simultaneously.** There is an impossibility theorem for population ethics. Therefore, this list is not a checklist for a perfect theory (which does not exist), but a map of the *necessary trade-offs*. An adequate theory must explicitly state which desideratum it sacrifices and justify why that cost is philosophically cheaper than the alternatives.

  ---

  ### I. The Desiderata of Adequacy

  #### 1. The Anti-Repugnance Constraint
  *   **The Case:** Parfit's Repugnant Conclusion. For any population of very well-off people (A), there is a much larger population of lives barely worth living (Z) that is better than A, according to Total Utilitarianism.
  *   **Requirement:** The theory must rank A > Z, or at least deny the transitivity that forces Z > A. It must capture the intuition that quality of life has lexical or semi-lexical priority over mere quantity when the quality drop is severe.
  *   **Status:** *Non-Negotiable* for most contemporary theorists (though Totalists dissent).
  *   **Tension:** Directly conflicts with the **Mere Addition Principle** (that adding happy lives without affecting others cannot make things worse) and **Transitivity**.

  #### 2. The Anti-Sadistic / Reverse Repugnance Constraint
  *   **The Case:** The "Reverse" variant you specified. A theory avoids the standard Repugnant Conclusion by positing a critical level or lexical threshold. However, this can generate a "Sadistic Conclusion": adding a population of people with *positive* welfare (extraordinarily happy lives) makes the outcome *worse* because their addition violates a structural constraint (e.g., they push the average down, or they exist in a generation that violates a continuity condition regarding identity). Alternatively, an enormous population of happy lives is ranked lower than a smaller one due to discontinuities in how identity-indeterminate generations are valued.
  *   **Requirement:** Adding lives with positive welfare must never make an outcome worse (Weak Non-Sadism). Furthermore, the valuation of populations must be continuous; small changes in welfare or number should not cause rank reversals between vastly different populations.
  *   **Status:** *Non-Negotiable* (Violating this implies it is better to create miserable people than happy people).
  *   **Tension:** Jointly unsatisfiable with **Anti-Repugnance** and **Transitivity** (Arrhenius's Impossibility Theorem). To avoid the Repugnant Conclusion without accepting the Sadistic Conclusion, one usually must sacrifice Transitivity or Continuity.

  #### 3. The Non-Identity Compatibility Constraint
  *   **The Case:** Parfit's Non-Identity Problem. A policy choice (e.g., depleting resources) changes *which* specific people will exist in the future. If those future people have lives worth living, a Person-Affecting View implies the policy does not harm them (since they wouldn't exist otherwise), rendering the choice morally neutral. Pure Actualism collapses here, saying only the welfare of those who *actually* exist matters, ignoring the moral weight of the choice itself.
  *   **Requirement:** The theory must judge actions that affect future identity as morally significant, even if the resulting people have net-positive welfare. It must assign value to "possible people" without mandating their creation (avoiding Totalism's obligation to procreate).
  *   **Status:** *Non-Negotiable* for a policy-relevant ethics.
  *   **Tension:** Conflicts with the **Person-Affecting Restriction** (that an outcome can only be worse if it is worse for some particular person). Satisfying this requires an impersonal element, which risks the Repugnant Conclusion.

  #### 4. The Modal Distinction Constraint (Addition vs. Replacement vs. Alteration)
  *   **The Case:** Distinguishing between (a) making existing people happier, (b) adding new happy people to the existing population, and (c) replacing the existing population with a different, happier population (e.g., via genetic selection or timing of conception).
  *   **Requirement:** The theory must not treat these as morally equivalent. Specifically, it must preserve the intuition that benefiting existing people is often more urgent or weighty than adding new people (Priority to Existing), and that replacing a happy population with a *different* happy population is not a neutral swap (preserving the value of specific identities to some degree).
  *   **Status:** *Preference of Person-Affecting/Contractualist camps*, but necessary for alignment with common moral intuitions regarding special obligations.
  *   **Tension:** Conflicts with **Impersonality**. If value is purely impersonal (welfare aggregates), it is hard to distinguish between adding a new happy person and making an existing person equally happy, or between replacing one happy person with another.

  #### 5. The Uncertainty and Partial Ignorance Constraint
  *   **The Case:** Real policy operates under risk. We do not know exactly how many people will exist, nor their identities, nor their precise welfare levels. A theory that only ranks *determinate* populations is useless for climate policy or AI governance.
  *   **Requirement:** The theory must yield determinate rankings under conditions of risk (Expected Value) and ignorance (where probabilities are unknown). It must handle "identity-affecting choices" under uncertainty without collapsing into paralysis. It must respect **Stochastic Dominance**: if Outcome X has a higher probability of producing high welfare for any given potential person than Outcome Y, X should be preferred.
  *   **Status:** *Non-Negotiable* for applied ethics.
  *   **Tension:** Conflicts with **Person-Affecting Restrictions**. Under uncertainty, almost every action affects who will exist. If we wait for identity to be fixed before assigning value (Actualism), we cannot evaluate ex-ante choices. If we evaluate ex-ante, we must value potential people, risking Totalist implications.

  #### 6. The Formal Integrity Constraint (Transitivity, Completeness, Continuity)
  *   **The Case:** Rational choice theory requires that if A > B and B > C, then A > C (Transitivity). It requires that for any A and B, either A > B, B > A, or A = B (Completeness). It requires that if A > B, there is a population "close enough" to B that is still worse than A (Continuity).
  *   **Requirement:** The axiology must generate a coherent ordering to guide action.
  *   **Status:** *Non-Negotiable* for rational action, though some (e.g., Chang, Parfit) argue for "imprecise comparability."
  *   **Tension:** As noted in Desideratum 2, maintaining Formal Integrity while avoiding both Repugnant and Sadistic Conclusions is mathematically impossible (Arrhenius). One must usually accept **Intransitivity** (cycles) or **Incompleteness** (some populations are non-comparable).

  ---

  ### II. The Impossibility Nexus: Jointly Unsatisfiable Subsets

  The philosophical labor lies in choosing which of the following triads to break. You cannot hold all three in any set.

  1.  **The Quality-Quantity Triad:**
      *   Avoid Repugnant Conclusion.
      *   Avoid Sadistic Conclusion (Reverse Repugnant).
      *   Maintain Transitivity/Continuity.
      *   *Result:* **Impossible.** (Arrhenius). You must accept either that Z > A, or that adding happy people can be bad, or that your ranking system is intransitive/discontinuous.

  2.  **The Identity Triad:**
      *   Solve Non-Identity Problem (assign value to potential people).
      *   Maintain Person-Affecting Intuition (no obligation to create happy people).
      *   Maintain Completeness under Uncertainty.
      *   *Result:* **Impossible.** If you assign value to potential people to solve Non-Identity, you tend toward Totalism (obligation to create). If you restrict value to actual people, you fail Non-Identity. If you try to split the difference, you often lose Completeness (cannot rank risky outcomes).

  3.  **The Risk Triad:**
      *   Respect Stochastic Dominance in variable population choices.
      *   Avoid Repugnant Conclusion.
      *   Maintain Expected Utility Theory.
      *   *Result:* **Highly Tense.** Recent work (e.g., by Thomas, Pivato) suggests that avoiding the Repugnant Conclusion in a risk setting often requires violating standard Expected Utility axioms or accepting "fanaticism" (where tiny probabilities of vast populations dominate decisions).

  ---

  ### III. Brief Theory Audit

  Here is how the major contenders fare against the desiderata, highlighting where the labor is done.

  **1. Total Utilitarianism (Classical)**
  *   **Performance:** Satisfies Formal Integrity, Uncertainty, and Non-Identity (by counting potential welfare). Distinguishes Addition/Alteration only by aggregate sum.
  *   **Failure:** Collapses on **Anti-Repugnance**. It logically entails Z > A. It also struggles with the **Modal Distinction**, as it treats replacing a happy person with a different happy person as neutral if welfare sums are identical.
  *   **Labor:** Defends the Repugnant Conclusion as counter-intuitive but true, or argues our intuitions about "barely worth living" are flawed.

  **2. Critical-Level Utilitarianism**
  *   **Performance:** Avoids **Repugnant Conclusion** by setting a welfare threshold (lives below the critical level count negatively). Preserves Formal Integrity better than lexical views.
  *   **Failure:** Risks the **Sadistic Conclusion** (Reverse Repugnant). If the critical level is set high enough to block Z, adding lives with positive welfare (but below the critical level) makes the outcome worse. It also struggles with **Uncertainty**, as the critical level must be defined across possible identities.
  *   **Labor:** Justifying the specific critical level without arbitrariness and defending the implication that creating happy people can be bad.

  **3. Person-Affecting Restrictions (Actualism / Contractualism)**
  *   **Performance:** Preserves **Modal Distinctions** and avoids **Repugnant Conclusion** (no obligation to add the Z population). Intuitively handles **Non-Identity** by focusing on harm to specific agents.
  *   **Failure:** Collapses on **Non-Identity Compatibility** (cannot explain why depleting resources is wrong if future people are happy). Fails **Uncertainty** (cannot rank choices where identities are probabilistic). Often sacrifices **Transitivity** (intransitive cycles in "Same Number Quality Claims").
  *   **Labor:** Developing a "Wide" Person-Affecting View that assigns interests to possible people without incurring Totalist obligations, or accepting that some wrongs are "impersonal."

  ### Summary for the Seminar
  The aim of this specification is to demonstrate that **population ethics is not a search for the true theory, but a selection of which impossibility result is most tolerable.** The "Reverse Repugnant" requirement forces the seminar to confront the Sadistic Conclusion, which is often the hidden cost of avoiding the standard Repugnant Conclusion. The Uncertainty constraint forces the abandonment of pure Actualism. The Formal Integrity constraint forces the abandonment of lexical solutions. The philosophical labor is in the justification of the sacrifice.
