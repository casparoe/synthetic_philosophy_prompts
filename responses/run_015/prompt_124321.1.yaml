  So: is deeming just an exercise of institutional power plus a stipulation about what the record says, or is it a genuine illocutionary type with its own direction of fit? Does it help to say its content is about a status rather than an event, and if so why doesn't that collapse into plain assertion?

  The bit that bugs me most — call it the bootstrapping problem — is that her words only count as a deeming because the charter says so, but the charter is itself just the output of earlier utterances by people whose authority was, at some point, also just declared. What's actually stopping the regress? Is it a background of de facto recognition doing all the real work, so that the "rule" part ends up decorative? And does uptake matter differently here than for a normal promise or order: if everyone present just ignores her, is the ship registered, and is that an illocutionary or a perlocutionary kind of failure?

  Skip the encyclopedia summary and give me the actual explanation. Also say how confident you are in each part of what you claim, and flag the single claim you're least sure about.
