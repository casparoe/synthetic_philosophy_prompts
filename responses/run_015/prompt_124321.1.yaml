answer: |-
  Here is the breakdown. I'm treating this as a problem of **institutional ontology** rather than pure linguistics, because "deeming" clauses only function within a constitutive framework.

  ### 1. The Illocutionary Type and Direction of Fit
  You are right to feel tension with the standard Assertion/Declaration dichotomy. If we stick strictly to Searle's taxonomy, this is a **Declaration**. However, it is a *retroactive* Declaration, which requires us to refine what "world-to-word" direction of fit means in a normative context.

  Standard Declarations (e.g., "You are hired") change the present state of affairs to match the proposition. Retroactive Declarations (e.g., "You are deemed hired as of March") cannot change the *brute* past (the ship physically docked or it didn't). Therefore, the "world" being fitted to the "word" is not the physical timeline, but the **deontic timeline**.

  *   **The Move:** The Harbormaster is not asserting a fact about history ("The ship registered in March"). She is issuing a performative that alters the *current* normative consequences attached to a past date.
  *   **Why it's not an Assertion:** If it were an assertion, it would be false if the ship hadn't registered in March. But under the charter, the Harbormaster's utterance *makes* it the case that the normative consequences of registration apply, regardless of the physical history. The truth-apt appearance is an illusion generated by the grammatical form ("is deemed to have been").
  *   **Classification:** It is a genuine illocutionary type (Declaration), but its direction of fit is **World-to-Word regarding Status**, not Event.

  **Confidence:** High (0.9). This aligns with Searle's later work on institutional facts and MacCormick's legal theory.

  ### 2. Status vs. Event (The "Counts-As" Distinction)
  Does framing this as status rather than event solve the collapse into assertion? Yes, but only if we accept that legal language operates on a layer of reality distinct from brute physics.

  *   **The Distinction:** An assertion describes a brute event ($E$ happened at $t_1$). A deeming clause establishes a constitutive rule ($E$ counts-as $S$ at $t_1$).
  *   **The Mechanism:** The utterance does not describe the status; it *imposes* it. The reason it doesn't collapse into assertion is that the validity conditions are not *correspondence* (does this match reality?) but *authority* (does the speaker have the power to impose this status?).
  *   **The Trap:** The confusion arises because the output *looks* like a proposition ("The Nightingale is registered"). But in speech act terms, the propositional content is subordinate to the illocutionary force. The proposition is the *content* of the status change, not a description of an independent fact.

  **Confidence:** High (0.85). This is standard institutional theory, though some pragmaticists might argue the line is blurrier in natural language.

  ### 3. The Bootstrapping Problem and the Regress
  This is the hardest metaphysical knot. You ask if the rule is decorative and if de facto recognition does the real work.

  *   **The Regress:** You are correct that authority is ultimately declared. If Charter A grants power, who granted the power to make Charter A?
  *   **The Stopper:** The regress stops at a **brute social fact**, not a linguistic one. Following Hart (and Austin's "total speech situation"), the ultimate rule of recognition is not valid because it was declared; it is valid because it is *accepted* and *acted upon* by the relevant community (the guild).
  *   **Decorative?** The rule is not decorative. It is **constitutive**. Without the rule, the utterance is just noise. But the *authority of the rule itself* rests on non-linguistic social practice. The "bootstrapping" is only vicious if you demand every rule be validated by a higher *rule*. If you allow the top layer to be validated by *fact* (social acceptance), the regress dissolves.
  *   **Confidence:** Medium-High (0.8). This is the standard positivist solution, though natural law theorists would object.

  ### 4. Uptake and Failure
  This is where legal speech acts diverge from Austin's paradigmatic cases (betting, promising).

  *   **Austin's View:** No uptake = no illocutionary act. If the audience doesn't understand/accept, the act misfires.
  *   **The Legal Reality:** If the Harbormaster speaks *ex officio* and follows procedure, the ship is registered even if the crew ignores her.
  *   **The Resolution:** In institutional contexts, **uptake is proceduralized**. "Uptake" is not the psychological understanding of the crew; it is the **registration of the act in the institutional record**.
  *   **Failure Mode:**
      *   If the clerk refuses to write it in the log: **Illocutionary Failure** (the act was not successfully consummated within the institution).
      *   If the crew ignores it but it's in the log: **Perlocutionary Failure** (the act succeeded, but it didn't cause the desired behavioral change).
      *   If the guild revolts and rejects her authority entirely: **Illocutionary Void** (the constitutive rules have collapsed).
  *   **Confidence:** Medium (0.7). This is the most contentious point. Some Austinians insist psychological uptake is necessary for *any* illocution, while legal theorists insist on procedural validity.

  ***

  ### Summary of Claims & Confidence

  1.  **Claim:** Retroactive deeming is a **Declaration** with a **normative world-to-word direction of fit**, not an assertion about physical history.
      *   **Confidence:** 0.9
  2.  **Claim:** The content is about **status assignment** ("counts-as"), which prevents collapse into assertion because validity depends on authority, not correspondence.
      *   **Confidence:** 0.85
  3.  **Claim:** The regress of authority stops at **brute social fact** (acceptance of the system), making the top-level rule constitutive but not self-validating.
      *   **Confidence:** 0.8
  4.  **Claim:** In institutional speech acts, **uptake is procedural** (recording) rather than psychological (understanding), meaning the act can succeed illocutionarily even if the audience ignores it.
      *   **Confidence:** 0.7

  ### ⚠️ The Claim I Am Least Sure About
  I am least confident in the **Claim regarding Uptake (0.7)**.

  **Why:** There is a genuine tension here between pure speech act theory and legal theory. Austin insists that securing uptake is a *necessary condition* for the performance of an illocutionary act. If the crew thinks the Harbormaster is joking or insane, Austin might say the act *misfired*. However, legal systems are designed specifically to function *despite* individual psychological states (objective theory of contract, etc.).

  Reconciling these requires arguing that "institutional uptake" is a distinct category from "conversational uptake." I am confident this distinction *exists*, but I am less confident that calling it "illocutionary success" doesn't stretch Austin's original definition too far. It might be more accurate to say the law creates a **fiction of uptake** for the sake of stability, which is a perlocutionary manipulation of the social record rather than a pure illocutionary act. Distinguishing where the "fiction" begins and the "act" ends is the murkiest part of this analysis.
