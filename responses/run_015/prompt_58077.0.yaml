answer: |-
  This is one of the classic puzzles of democratic theory. You have identified the exact friction point between three competing definitions of *the demos* (the people): **Membership** (citizenship), **Residence** (subjection to law), and **Stake** (contribution/impact).

  Here is a breakdown of what the current U.S. patchwork presupposes, where it contradicts itself, and what would happen if you actually fixed the logic.

  ### 1. What the Current Setup Presupposes
  The current system is not built on a single consistent theory. It is a hierarchy of theories.

  **The Federal Level: Citizenship as "Perpetual Allegiance"**
  For President and Congress, the system presupposes that the *demos* is defined by **legal membership**, not physical presence or impact.
  *   **Your Cousin (London):** Her right to vote is based on the idea that citizenship is an indelible bond. Even if she doesn't live under U.S. criminal law, pay local property taxes, or use U.S. roads, she belongs to the "national family." The state assumes her allegiance is permanent unless she formally renounces it.
  *   **Your Neighbor (Green Card):** He is excluded based on the idea that voting is the final privilege of full membership. Even though he is *subject* to the laws (subjection) and *pays* into the system (contribution), he lacks the *status*.
  *   **The Logic:** The nation is a club, not just a jurisdiction. You don't get to vote on the club rules just because you're standing in the clubhouse; you have to be a card-carrying member.

  **The Local Level: "Stakeholderism"**
  In the few places where non-citizens can vote (e.g., school boards in San Francisco or Takoma Park, MD), the logic shifts.
  *   **The Logic:** Here, the presupposition is **affected interests**. If your kids go to the school, you have a direct stake in the outcome. The community is defined by who has to live with the consequences of the decision, not who holds the passport.
  *   **The Contradiction:** This admits that "taxation without representation" is unjust at the local level, but maintains it at the federal level.

  ### 2. Strict Necessities vs. "Kinda Fits"
  To make the current system make sense internally, certain things must be true. Others are just convenient rationalizations.

  **What Strictly Needs to Be True (For the status quo to hold):**
  1.  **Sovereignty requires a bounded people:** A democracy cannot function if the boundary of the voter pool is fluid. Citizenship provides a hard, administrative line.
  2.  **Voting is an act of allegiance, not just interest:** Casting a ballot is viewed as an assertion of national identity. Therefore, only those who have sworn allegiance (naturalized or birthright) can do it.
  3.  **Non-citizens are temporary by definition:** Even if a Green Card holder has been there 15 years, the legal fiction is that they are "aliens" who could leave or be deported. Therefore, they shouldn't shape the long-term destiny of the nation.

  **What It Only "Kinda Fits" With (The inconsistencies):**
  1.  **Consent of the Governed:** The Declaration of Independence argues government derives power from the consent of the governed. Your neighbor is governed but hasn't consented via vote. The system hand-waves this by saying he consented to *reside* here under existing rules.
  2.  **No Taxation Without Representation:** This fits your neighbor poorly. He pays federal income tax, Social Security, and Medicare but has no say in how those funds are used.
  3.  **Equal Protection:** It is hard to argue that a citizen who hasn't lived in the U.S. since childhood (some expats) has a "greater interest" in U.S. policy than a non-citizen who has lived here for 20 years, yet the former votes and the latter doesn't.

  **Are the Expat and Green Card cases inconsistent?**
  **Yes.** They rely on different principles.
  *   **Expat Voting** relies on **Personality Principle** (you carry your rights with you because of who you *are*).
  *   **Non-Citizen Disenfranchisement** relies on **Territorial/National Principle** (you need permission to participate in this specific soil).
  *   They are only consistent if you believe Citizenship is the *only* thing that matters, rendering residence and taxation irrelevant. But the existence of local non-citizen voting proves that residence *does* matter sometimes.

  ### 3. Switching to the "All Affected Interests" Principle
  If we switched to a strict rule where **anyone subject to the government's coercive power or significantly affected by its decisions gets a say**, the practical changes would be radical. This is often called the **"All-Subjected Principle."**

  **Who Gains the Vote:**
  *   **Permanent Residents (Green Cards):** They would vote for President and Congress immediately. They are subject to federal law, deportation risk, and taxation.
  *   **Undocumented Long-Term Residents:** This is the tricky edge. If the standard is "affected by decisions," many undocumented people are deeply affected by laws (police, schools, labor). They would likely gain voting rights in local elections, potentially federal if they file taxes (ITIN holders).
  *   **Felons/Prisoners:** They are uniquely affected by government decisions (incarceration). Most "all-affected" theories argue they should vote, often from prison.
  *   **Children:** They are affected by climate policy, debt, and war. This would pressure the system to lower the voting age to 14 or 16, or create proxy voting for parents.

  **Who Might Lose The Vote:**
  *   **Long-Term Expats:** Under a strict "affected interests" rule, your cousin in London might lose the right to vote for President. She does not live under U.S. criminal law, her kids don't go to U.S. schools, and she doesn't use U.S. infrastructure. While she pays taxes, many theorists argue that **residence** should be the trigger for voting, not citizenship. (Note: She would likely keep the right to vote if she paid income tax, framing it as a shareholder model).
  *   **Citizens in U.S. Territories:** Ironically, this might help them. People in Puerto Rico are subject to many federal laws but can't vote for President. An "affected" standard would grant them full voting representation.

  **Administrative & Political Chaos:**
  *   **Defining "Affected":** Where is the line? Does a Canadian affected by U.S. climate policy get to vote? (Usually, the limit is set at "subject to coercion," i.e., residents).
  *   **Campaigns:** Politicians would have to campaign in languages other than English and address issues specific to non-citizen communities (e.g., visa policies, deportation protections) to win elections.
  *   **Naturalization:** The incentive to become a citizen would drop. If you can vote without naturalizing, why go through the test and fees? Citizenship might become purely symbolic (like a passport for travel) rather than political.

  ### Summary
  The current U.S. patchwork presupposes that **National Identity trumps Democratic Consistency.**

  It prioritizes the idea of the U.S. as a **Nation-State** (a group of specific people) over the U.S. as a **Jurisdiction** (a place where rules apply).
  *   **Your Cousin** votes because she is part of the *Nation*.
  *   **Your Neighbor** doesn't vote because he is not part of the *Nation*, even though he is part of the *Jurisdiction*.
  *   **The School Board Exception** admits that for daily life, being part of the *Jurisdiction* is actually what matters.

  If you switched to a system based strictly on who is affected, you would stop treating voting as a reward for loyalty (citizenship) and start treating it as a defense against power (residence). Your neighbor would get the ballot, but your cousin might lose hers.
