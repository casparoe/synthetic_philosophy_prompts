prompt: |-
  ok so this has been bugging me about who actually counts as teh demos and stuff. Like in the US my cousin who's a citizen but has lived in London for like 15 years can still mail in a vote for president, but my neighbor who's had a green card for 15 years, works here, pays taxes, has kids in public school, cant vote for president at all and in most places cant even vote for mayor. But then i heard some cities actually do let noncitizens vote for school board just not for mayor or other offices.

  So what view of membership is that whole patchwork presupposing? Is it that the demos is about having the passport no matter where you live, or about being stuck living with the decisions, or about contributing and paying in? And are the expat part and the green-card part even presupposing the same thing or are they just inconsistent with each other?

  Lay out what the current setup strictly needs to be true to make sense versus what it just kinda fits with, and tell me what would have to change in practice if we actually switched to a rule where anyone affected by a goverment decision gets a say in it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Question:** What view of political membership (*demos*) does the current US voting system presuppose, given the inconsistencies between expat citizens and resident non-citizens?
      *   **Specific Examples:**
          *   Expat Citizen (London, 15 years): Can vote for President.
          *   Resident Non-Citizen (Green Card, 15 years, pays taxes, kids in school): Cannot vote for President, usually cannot vote for local offices (with some exceptions like school boards).
      *   **Key Tensions:** Passport vs. Residence vs. Contribution/Taxation.
      *   **Tasks:**
          1.  Identify the underlying logic/principles of the current patchwork.
          2.  Determine if the expat and green card cases rely on the same logic or are inconsistent.
          3.  Distinguish between what the setup *strictly needs* to be true vs. what it *kinda fits with*.
          4.  Analyze the practical implications of switching to the "all affected interests" principle.

  2.  **Analyze the Current US System (The "Patchwork"):**
      *   *Federal Level:* Citizenship is the hard barrier. Non-citizens cannot vote for federal office (President, Congress). Expat citizens *can* vote (UOCAVA).
      *   *State/Local Level:* Mostly citizenship, but historical and some current exceptions exist (e.g., Maryland school board elections, some city council elections in places like Takoma Park, MD, or San Francisco for school board).
      *   *Underlying Principles:*
          *   **Citizenship (National Membership):** The primary gatekeeper. Based on legal allegiance, not just presence.
          *   **Territoriality/Residence:** You usually have to live in the district, but citizenship trumps residence for expats.
          *   **Stakeholder/Contribution:** Paying taxes/having kids in school is *not* sufficient for federal voting, but is the justification for local non-citizen voting exceptions.

  3.  **Address the "Expat vs. Green Card" Inconsistency:**
      *   *Expat:* Justifies voting based on *legal membership* (citizenship) regardless of physical presence or direct impact. The idea is you belong to the nation forever unless you renounce.
      *   *Green Card:* Excluded based on *legal status* despite physical presence and direct impact.
      *   *Conclusion:* They are logically inconsistent if the goal is "affected interests" or "taxation without representation." They are consistent only if the goal is "national community defined by legal status."

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the frustration. It *is* a patchwork. Define the term *demos* (the people).

      *   **Part 1: What the Current Setup Presupposes (The Logic):**
          *   *Dominant View:* **Citizenship as Allegiance.** The *demos* is the community of legal members, not just residents.
          *   *The Expat Logic:* Citizenship is portable. You carry the nation with you. It's about identity/legal bond, not daily impact.
          *   *The Green Card Logic:* Permanent residency is a privilege, not membership. Voting is the final step of naturalization.
          *   *The Local Exception Logic:* Here, the principle shifts to **"Stakeholderism"** (affected interests). If your kids go to school, you have a stake. This contradicts the federal logic.

      *   **Part 2: Strict Necessities vs. "Kinda Fits":**
          *   *Strictly Needs to be True:* Citizenship is the sole legitimate boundary for national sovereignty. Non-citizens are guests, even long-term ones.
          *   *Kinda Fits With:* Civic republicanism (virtue/allegiance), protection of national interest (outsiders might not care about long-term security), administrative convenience (citizen rolls are easier).
          *   *The Inconsistency:* The system claims voting is about "consent of the governed" but denies it to governed non-citizens while granting it to non-governed expats.

      *   **Part 3: Switching to "All Affected Interests" (The All-Subjected Principle):**
          *   *Define the Principle:* If a law/policy impacts you, you get a vote.
          *   *Practical Changes:*
              *   *Federal:* Green card holders (and maybe undocumented long-term residents?) vote for President/Congress. Expats might *lose* the right to vote for President if they don't live under the laws (though they are affected by foreign policy/taxes).
              *   *Local:* Non-citizens vote for mayor, city council, zoning, not just school board.
              *   *Prisoners/Felons:* Would likely gain voting rights (heavily affected by laws).
              *   *Children:* Complicates things (affected but can't vote). Maybe lower voting age?
              *   *Tourists/Short-term:* Probably still excluded (minimal impact).
          *   *Administrative Nightmare:* How do you define "affected"? Residency? Tax filing? Duration?

      *   **Part 4: Synthesis/Conclusion:**
          *   The current system prioritizes **National Identity** over **Democratic Consistency**.
          *   The patchwork exists because localities experiment with "stakeholder" logic while the federal government holds the "citizenship" line.
          *   Switching to "affected interests" would fundamentally redefine the nation-state from a club of members to a jurisdiction of residents.

