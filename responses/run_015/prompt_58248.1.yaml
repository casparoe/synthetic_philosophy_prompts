  ### Facilitator's Preliminary Brainstorm: Candidate Criteria for Belief Attribution

  Before drafting the joint statement, I have outlined five candidate criteria often debated in cognitive science to help structure the discussion. These are not recommendations, but conceptual tools to locate the disagreement.

  1.  **Functional Role:** Does the state play the causal role of guiding action and inference in the system, regardless of substrate?
  2.  **Stability/Persistence:** Does the state persist across time and minor contextual perturbations, or does it vanish when the prompt changes?
  3.  **Integration:** Is the state connected to a wider web of commitments (e.g., if I believe *P*, I should not believe *not-P*), or is it siloed?
  4.  **Evidence Sensitivity:** Does the state update in response to new evidence, or only in response to statistical cues in the input?
  5.  **Reportability:** Can the system accurately report the state, or is the report just another generated token sequence unconnected to the "cause" of the action?

