answer: |-
  You promised your supervisor you wouldn't share the new scheduling code with the team, but you discover management is using that specific code to automatically dock pay for bathroom breaks—a violation of the implicit trust of employment—and you share the code with a union rep to stop the wage theft. Both you and your friend agree you should share the code, but the debate is whether your act of breaking confidentiality carries any negative moral weight at all given the company's prior betrayal of the employment contract.

  **What Each Theory Says**
  *   **Moral Generalism:** The feature "breaking a promise" is inherently a *wrong-making feature*. It is always a negative moral reason, even if it is sometimes overridden by stronger reasons (like preventing theft). In this case, the generalist says you did the right thing *all things considered*, but you still incurred a moral cost by breaking the promise; the wrong-making feature was **active but outweighed**.
  *   **Moral Particularism:** Moral reasons are holistic. A feature that is wrong-making in one context (breaking a promise) can lose its negative valence entirely in another. Here, the particularist argues the company's institutional betrayal acts as a **disabler**. The feature "breaking a promise" does not count against you at all; it is morally inert. You didn't balance a wrong against a right; you performed an action where the supposed "wrong" feature simply didn't function as a reason.

  **The Feature Doing the Work**
  The feature is **"breaking a promise of confidentiality."** The disagreement isn't about the action, but about whether this feature contributes negative weight to the moral calculus.

  **The Hidden Dependency & Collapse**
  You are right to suspect a dependency. If you remove the institutional betrayal (e.g., the company wasn't docking pay, just optimizing efficiency), the particularist must admit the feature "breaking a promise" regains its negative valence. However, this does **not** collapse the case into standard generalism. A generalist claims there is a *principle* ("Do not break promises") that holds across contexts unless an exception clause is met. A particularist claims there is *no principle*, only a sensitivity to how the betrayal context alters the moral shape of the specific situation. The dependency proves the particularist isn't "making excuses" to ignore rules; they are arguing that the moral significance of promise-breaking is contingent on the integrity of the relationship in which the promise exists. If the relationship is already morally severed by betrayal, the promise loses its normative grip, not because of an exception rule, but because the reason itself has vanished.
