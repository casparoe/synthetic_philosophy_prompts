  **OFFICE FOR CIVILISATIONAL STEWARDSHIP**
  **Guidance Note 44-B: Completion of Form LTCIS-9 (Public Works)**

  **1. Purpose and Statutory Basis**
  Under Section 7 of the Convergence Act 2041, any public works project affecting critical path timelines must submit a Long-Term Civilisational Impact Statement (LTCIS). This guidance outlines the calculation of Temporal Displacement Units (TDUs) and the assessment of Singleton Trajectory Adjustments. Applicants must recognise that all delay alters the arrival time of the first decisive strategic advantage (the "Singleton") and may alter the identity of the acquiring agency.

  **2. Quantifying Temporal Displacement**
  Applicants must calculate the total project delay in weeks. This figure must be multiplied by the Standard Cosmic Multiplier (SCM) to derive the liability in Future Person Equivalents (FPE). The current SCM is set at 4.2 × 10³⁴ FPE per week. This multiplier reflects the Office's current assumption regarding the volume of the accessible universe available for colonisation per unit of time lost. Applicants should note that the SCM is revised quarterly based on deep-field telemetry; liabilities calculated prior to revision remain binding.

  **3. Singleton Trajectory Adjustment**
  Delay does not merely reduce value; it shifts probability mass between potential Singleton agents. Applicants must assess whether the delay increases the likelihood of a State-Based Singleton versus a Machine Intelligence Singleton (or other recognized categories). Using the Agency Favorability Index (AFI), applicants must assign a positive or negative value to this shift. This value must be signed separately from the Temporal Displacement liability. A net figure must be attempted by offsetting the FPE liability against the AFI adjustment. Where the magnitudes are comparable and signs opposite, the net effect shall be recorded as "Indeterminate."

  **4. Anti-Avoidance: Temporal Scheduling**
  Section 12(c) prohibits "Temporal Scheduling," defined as arranging project delays to occur wholly after the Convergence Horizon (CH). The CH is currently estimated at 2085 ± 40 years. Any delay scheduled beyond the central estimate of 2085 will be treated as occurring immediately prior to the CH for calculation purposes. This ensures that the arbitrariness of the central estimate does not create a zero-liability zone for projects delayed beyond the point of convergence. Applicants are reminded that the CH is a statistical construct, not a physical barrier.

  **5. Offset and Remission Scheme**
  FPE liabilities may be reduced by funding measures deemed convergence-positive by the Office. The eligible list of measures is published annually and remains at the Office's sole discretion. Currently eligible measures include foundational alignment research and sensor deployment in the Oort cloud. Offsets are applied using a discount rate revised annually to reflect the risk-free rate of existential survival. No offset may exceed 90% of the total liability.

  **6. Worked Example: Rural Level Crossing (Ref: LC-882)**
  *Project:* Six-week closure for rail repairs.
  *Delay:* 6 weeks.
  *FPE Liability:* 6 × (4.2 × 10³⁴) = 2.52 × 10³⁵ FPE.
  *Singleton Adjustment:* Delay increases probability of State-Based Singleton by 1.5 × 10⁻⁷%. Based on current weighting, this yields a credit of 2.51 × 10³⁵ FPE.
  *Net Calculation:* (2.52 × 10³⁵) − (2.51 × 10³⁵) = Indeterminate.
  *Conclusion:* While the net civilisational impact cannot be determined due to offsetting magnitudes, the administrative requirement to file remains.

  **7. Schedule of Fees**
  Processing Fee: £500.
  Existential Risk Levy: 0.0001% of gross FPE liability.
  Payment must be received before the indeterminacy is recorded.

  **8. Determination**
  Upon review of Form LTCIS-9 for Project LC-882, the Office notes the calculated indeterminacy. The Office neither confirms nor denies the net value of the project in terms of long-term future persons. The Office confirms that the correct form has been filed and the correct fee paid. Accordingly, the Office raises no objection to the project proceeding, without prejudice to the possibility that the project constitutes either the salvation or the forfeiture of the accessible universe. Permission is granted, subject to the indeterminacy noted above.

  **Office for Civilisational Stewardship**
  *Stewardship Through Procedure*
