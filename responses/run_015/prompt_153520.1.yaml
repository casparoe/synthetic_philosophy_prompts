answer: |-
  This is a fascinating real-world example of a classic problem in game theory known as the **Centipede Game**.

  Your flatmate is applying a logical method called **backward induction**, which is mathematically sound in a specific, sterile theoretical context. However, in the real world—and especially with the added layer of transparency you've introduced—his conclusion that you are being "irrational" is actually flawed.

  Here is the breakdown of why his logic works on paper but fails in your cottage.

  ### 1. The Flatmate's Logic: Backward Induction
  Your flatmate is reasoning like a "hyper-rational" economic agent. His logic goes like this:
  1.  Imagine there is a final week (let's say Week 50).
  2.  At Week 50, why would I continue? If I take the pot now, I get everything. If I continue, the game ends anyway, or you might take it next time. So, at Week 50, I should take the money.
  3.  But *you* know I will do that. So, at Week 49, you should take the money before I do.
  4.  But *I* know you know that. So, at Week 48, I should take the money.
  5.  This logic cascades all the way back to the start.

  In a strictly finite game with a known end date and players who care *only* about maximizing immediate monetary gain, the Nash Equilibrium (the mathematically "rational" outcome) is to defect **immediately**. Your flatmate is being generous by saying Week 2; pure theory suggests Week 1.

  ### 2. Why You Are Not Being Irrational
  The reason backward induction fails in your situation is that the theoretical assumptions don't match reality. You are not irrational; you are playing a different game than the one in his textbook.

  **A. The "End Game" is Unknown**
  Backward induction only works if there is a known, fixed final round. If you don't know when the renovation will finish or when the estate must be settled, there is no "Week 50" to start working backward from. If there is even a small probability that the game continues indefinitely, cooperation becomes the rational strategy (this is related to the *Iterated Prisoner's Dilemma*).

  **B. Payoffs Include More Than Money**
  Game theory assumes players maximize "utility," not just cash. If your flatmate takes the whole pot and walks away:
  *   He loses a flatmate.
  *   He damages his reputation.
  *   He potentially faces legal action (estates usually require multiple signatures to distribute assets; one person simply "taking the lot" is often legally impossible without fraud).
  *   He deals with the guilt of betraying a friend and your gran's memory.

  When you factor in these "social costs," the payoff for defecting drops significantly. It is actually **rational** to cooperate because the long-term cost of betrayal outweighs the short-term gain of the pot.

  **C. Bounded Rationality and Trust**
  Humans are not cold calculators. We use heuristics like "tit-for-tat." If you have cooperated for months, you have established a pattern of trust. Breaking that pattern is psychologically difficult and socially expensive. Economists call this **social preference**. Ignoring social preference isn't "more rational"; it's a flawed model of human behavior.

  ### 3. The Video Paradox (Common Knowledge)
  This is the most interesting part of your story. You mentioned you record videos explaining your reasoning, so "both know that the other knows we'll eventually stop."

  This touches on a concept called **Common Knowledge of Rationality**.
  *   **The Flatmate's View:** He thinks the videos confirm that you are both rational actors who *will* eventually defect, so you should do it now.
  *   **The Reality:** The videos actually act as a **commitment device**. By verbally stating your intention to cooperate on camera, you are raising the social cost of defection. If you say on video, "I'm in this for the long haul," and then steal the money the next week, you aren't just a thief; you're a liar with evidence.

  The transparency doesn't force the game to end early; it **sustains cooperation**. It signals to the other person: *"I am not the type of person who will defect, even if the math says I should."*

  In game theory, if I know you are "irrational" (meaning you value cooperation over pure profit), the backward induction chain breaks immediately. I don't need to defect at Week 49, because I know you won't defect at Week 50. Therefore, I can safely cooperate at Week 49.

  ### The Verdict
  Your flatmate is suffering from **theoretical myopia**. He is applying a model designed for finite, anonymous, purely financial interactions to a social, open-ended, reputation-based relationship.

  *   **Is he right?** Mathematically, yes, for a specific, abstract version of the game.
  *   **Are you irrational?** No. In the real world, maximizing utility includes maintaining relationships, avoiding legal trouble, and keeping your word.

  You are effectively playing a **Repeated Game with an Unknown Horizon**, where cooperation is the dominant strategy. The videos aren't proving you'll stop; they are the glue keeping you from stopping. Keep fixing the cottage, but maybe check the legal structure of that estate pot—because in the real world, one person usually *can't* legally take the lot, which makes his threat to do so a "non-credible threat" in game theory terms.

  **Recommendation:** Tell him his logic holds up for a robot, but not for a flatmate. If he wants to be "rational," he should realize that burning the bridge costs more than the renovation is worth.
