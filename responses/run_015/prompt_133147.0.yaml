  Yes, a case meeting all constraints can be built: a housing co-operative where a standing validity clause dynamically references a voting threshold that the amendment itself raises, creating an oscillation between historical and continuing compliance.

  ### **Oakwood Housing Cooperative: Bylaws (Excerpt)**

  1.  **Governance:** Management is vested in a Board elected annually by members.
  2.  **Quorum:** A meeting requires 50% of members present to conduct business.
  3.  **Threshold:** These Bylaws may be amended by a 60% vote of members present.
  4.  **Validity:** Any amendment failing to meet the threshold in Section 3 is void.
  5.  **Meetings:** Annual meetings are held in January; special meetings require 10% petition.
  6.  **Supremacy:** These Bylaws are the supreme authority of the Co-op; conflicts are resolved by member vote.

  ### **Proposed Amendment (M)**

  "Section 3 is amended to read: 'These Bylaws may be amended by a 70% vote of members present.'"

  ### **The Walkthrough**

  **The Vote:** 65% of members present vote in favor of **M**.

  **1. Pre-Adoption (T0):**
  *   **Rule 3** sets the threshold at 60%.
  *   **Rule 4** declares void any amendment failing to meet the threshold in Section 3.
  *   **Test:** Does **M** meet the threshold in Section 3 (60%)? Yes (65% > 60%).
  *   **Verdict:** **M** is valid. It is adopted. Section 3 now reads 70%.

  **2. Post-Adoption (T1):**
  *   **Rule 3** now sets the threshold at 70% (due to **M**).
  *   **Rule 4** remains in force: Any amendment failing to meet the threshold in Section 3 is void.
  *   **Test:** Does **M** meet the threshold in Section 3 (70%)? No (65% < 70%).
  *   **Verdict:** **M** is void. If **M** is void, it never altered Section 3. Section 3 reverts to 60%.

  **3. The Oscillation:**
  *   If Section 3 is 60%, **M** passes (return to T1).
  *   If Section 3 is 70%, **M** fails (return to T0).
  *   The Bylaws contain no rule specifying whether validity is assessed at the moment of voting (historical) or as a continuing status (ongoing). The system oscillates indefinitely.

  ### **Analysis**

  **1. The Feature Doing the Work**
  The paradox is driven by **dynamic reference combined with present-tense status**. Rule 4 does not hardcode a number (e.g., "60%"); it references "the threshold in Section 3." Because Section 3 is mutable, the condition for validity changes *because* the amendment succeeds. Simultaneously, Rule 4 uses the present tense ("is void") rather than a past-tense gate ("was valid if"), implying a continuing condition of validity rather than a one-time historical event.

  **2. The Cost of Repair**
  A drafter could repair this by making Rule 4 expressly prospective (e.g., "No amendment *adopted after this provision* is valid unless..."). This would settle the temporal index, validating **M** under the old 60% rule. However, this repair costs the proponents **leverage**. The ambiguity currently allows them to argue for validity if challenged, while the strict text deters future opponents. Clarifying the rule removes this strategic ambiguity. Conversely, if the repair aligns with the plain text (ongoing compliance), **M** is declared void. The cost is the **loss of the entrenchment**: the faction cannot raise the threshold to 70% without securing 70% support, which they currently lack. They must choose between legal certainty (and failure) or legal indeterminacy (and a chance at success).

  **3. The Strongest Reply (Social Fact)**
  A legal positivist might deny the paradox exists in practice, arguing that validity is a social fact, not a logical derivation. If the Board and members *treat* **M** as valid (e.g., they print the new bylaws, hold future votes to the 70% standard), then the Rule of Recognition has shifted, and **M** is valid regardless of the textual oscillation. The paradox is merely theoretical noise overridden by official acceptance.

  **4. Honesty Check**
  The case does not smuggle the verdict. The indeterminacy arises strictly from the silence of the Bylaws on the *temporal index of validity*. No provision defines when the "Void" condition applies. The oscillation is a logical consequence of combining a dynamic reference ("Section 3") with a standing status rule ("is void") and a silent system regarding time. Constraints 1–4 fall out of the text: **M** passes the old rule, fails the new rule, creates no internal contradiction within either snapshot (the text of T0 is consistent; the text of T1 is consistent), and leaves all other operations (quorum, elections) deterministic.
