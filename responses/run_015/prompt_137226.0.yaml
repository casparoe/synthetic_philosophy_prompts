answer: |-
  Here is a design for a 75-minute seminar session. It is built to be low-energy friendly (9 AM), high-stakes enough to prevent nodding, and structurally resistant to the "I just can't verbalize it" defense.

  # Activity Title: "The Learnability Filter"

  **Core Concept:** Students will demonstrate high competence at a classification task they cannot explicitly articulate (Competence without Comprehension). Then, they will discover that the task itself exists only because it survived a blind selection process for "learnability" (Design without Designer).

  **Which half is easier?**
  *   **Competence without Comprehension** is much easier to stage in one session. You can induce tacit knowledge in 15 minutes.
  *   **Design without Designer** is hard because evolution requires deep time. You cannot simulate generations live without eating 40 minutes. **Strategy:** We stage the *Competence* live, and we stage the *Design* as a "forensic reveal" using pre-prepped data that the students analyze. This keeps the timeline tight but makes the evidence visible.

  ---

  ## 1. Materials (TA Prep: 30 Minutes)

  1.  **The Deck (40 Cards):** Print 40 slips of paper. Each has 4 binary features (e.g., Shape: Circle/Square, Color: Red/Blue, Border: Thick/Thin, Dots: 1/2).
      *   *The Secret:* There is no strict logical rule (e.g., "All Red Circles"). There is a **Hidden Prototype** (e.g., Red Circle Thick 1). "Value" is determined by similarity to the prototype (1 point per matching feature).
      *   *Why:* This creates a "gradient" of correctness. It feels like a rule, but it's actually distance-in-space. This frustrates the CS "find the algorithm" move because there is no boolean algorithm to find.
  2.  **Score Sheets:** One per student. Columns for: `Card ID`, `My Rating (1-10)`, `Feedback`, `Points Earned`.
  3.  **The "Fossil Record" Handout:** A single sheet showing 5 "Generations" of rules.
      *   Gen 0: Random noise (uncorrelated features).
      *   Gen 1-4: Increasingly structured.
      *   Gen 5: The current task they just did.
      *   *Caption:* "Rules that students failed to learn were discarded. Rules students could learn survived."
  4.  **Currency:** Poker chips or just tally marks on the board. 10 points = 1 sweet/prize.

  ---

  ## 2. Timeline & Rules (75 Minutes)

  ### 00:00 – 00:05: Setup & Stakes (No Theory)
  *   **Say:** "You are quality control inspectors for an alien signal processor. You will see 40 signals. Your job is to rate their 'Stability' from 1 to 10. You want your ratings to match the Alien Standard."
  *   **Stakes:** For every card, if your rating is within 2 points of the 'True Value', you get 1 point. Top 3 scores get sweets.
  *   **Constraint:** "Do not talk to neighbors. Do not write down hypotheses yet. Just rate."
  *   **Why:** Prevents early verbalization which ruins implicit learning.

  ### 00:05 – 00:25: Phase 1 — Competence (The Grind)
  *   **Action:** Students rate cards in batches of 10. After each batch, you read out the "True Values." They calculate their score.
  *   **The Trick:** Because the rule is *similarity to a prototype*, their scores will naturally improve as they unconsciously average the features of the high-scoring cards. They are building a mental model without a verbal rule.
  *   **TA Role:** Circulate. If a CS student asks "Is there a logical conjunction?", say: "There is a pattern. Find it." (Do not lie, but do not confirm).
  *   **Outcome:** By card 40, most students should be scoring 80%+ accuracy. They *feel* they know what's going on.

  ### 00:25 – 00:40: Phase 2 — Comprehension (The Trap)
  *   **Action:** Stop the cards. Hand out the "Design Document."
  *   **Task:** "You are now the engineers. You must write the exact algorithm the Alien Machine uses so we can build a replacement. Be specific. (e.g., 'If Red AND Circle...')."
  *   **The Bet:** "You must also bet points on your algorithm. If your algorithm correctly predicts the value of the *next* 5 cards (which I hold), you double your points. If it fails, you lose half."
  *   **Why:** This forces the "I know but can't say" skeptic to put skin in the game. Vague intuition doesn't pay out in a boolean test.
  *   **The Test:** Run 5 new cards through their written algorithms. Most will fail or be too vague to score.
  *   **Result:** High Performance (Phase 1) vs. Low Predictive Explanation (Phase 2).

  ### 00:40 – 00:55: Phase 3 — The Design Reveal (The Inversion)
  *   **Action:** Hand out the "Fossil Record."
  *   **Task:** "Look at Generation 0. This was the original signal. It was random noise. No one could learn it. It was discarded. Generation 5 is what you just played."
  *   **Discussion Question:** "Did a designer create Gen 5 to be learnable? Or did Gen 5 survive *because* it was learnable?"
  *   **CS Counter-Play:** Assign the 4 CS students a specific role here. "You four are the Mutation Engine. Look at Gen 0. Tell the class why a human mind can't learn that." (This gives them a job that validates their expertise without letting them spoil the earlier game).
  *   **The Point:** The "Design" (the learnable pattern) emerged from the *selection pressure* of human minds, not from a designer intending to be understood.

  ### 00:55 – 01:05: Small Group Synthesis
  *   **Prompt:** "Map your experience. Where did you feel 'smart' but couldn't explain why? Where did the 'order' come from if not from a mind?"
  *   **Goal:** Let them articulate the mismatch before you name it.

  ### 01:05 – 01:15: Debrief & Terminology
  *   **Say:** "This is the 'Strange Inversion.' Dennett calls it Competence without Comprehension. You had the competence. The comprehension was an illusion generated by the selection process."
  *   **Close:** Collect the "Design Documents." Keep them. Next time, show them how bad they were.

  ---

  ## 3. Debrief Mapping (For You)

  | Activity Moment | Philosophical Concept | Mapping Fidelity |
  | :--- | :--- | :--- |
  | **Phase 1 (Rating)** | **Competence.** The ability to navigate the environment successfully. | **High.** They literally get points for success. |
  | **Phase 2 (Betting)** | **Comprehension.** The ability to represent the *reasons* for the success explicitly. | **High.** The betting mechanic exposes the gap between *doing* and *saying*. |
  | **Phase 3 (Fossils)** | **Blind Variation + Selection.** The "Design" of the task emerged from filtering, not top-down intent. | **Medium.** It's simulated data, not real-time evolution, but the logic holds. |
  | **The Mismatch** | **The Inversion.** We think Mind $\rightarrow$ Order. Actually Environment $\rightarrow$ Mind. | **High.** This is the core phenomenological hit. |

  **What this cannot reproduce (Be Frank):**
  1.  **Deep Time:** You can't show 1,000 generations of selection in 15 minutes. You have to assert that the "Fossil Record" is real.
  2.  **Zero Comprehension:** You can't prove there is *no* comprehension in their heads, only that their *reported* comprehension fails to predict outcomes. (This is enough for the argument, but be precise).
  3.  **The "Hard Problem":** This doesn't solve consciousness. It only addresses the *explanatory power* of positing a mind.

  ---

  ## 4. Predictable Failure Modes & Fixes

  ### 1. The "I Know But Can't Say" Skeptic
  *   **The Move:** A student (likely your flatmate's avatar) says, "I have a holistic grasp of the pattern. It's not algorithmic, but I *know* it. Your test is too rigid."
  *   **The Fix (Built into Design):** The **Betting Phase**.
  *   **Script:** "That's a fair claim. But in engineering (and science), if you can't transmit the knowledge to a machine (or a written rule), you don't have the design. You have the *state*. Bet your points on your 'holistic grasp' predicting these 5 new cards. If you're right, you win. If you say 'I can't bet because it's ineffable,' you admit you don't have the design."
  *   **Why it works:** It forces them to choose between *confidence* and *humility*. If they bet and lose, their "knowledge" was illusory. If they refuse to bet, they concede they lack "comprehension" in the functional sense.

  ### 2. The Smug CS Student
  *   **The Move:** They spot the "Prototype/Distance" mechanic in Phase 1 and say, "This is just Euclidean distance in 4D space. It's trivial." They disengage.
  *   **The Fix (Built into Design):** **The Feature Weighting.**
  *   **Secret:** The "True Value" isn't equal weight. Maybe Color is worth 3 points, Shape is worth 1. This makes it a *weighted* distance metric.
  *   **Script:** "Okay, you spotted the space. Now write the *weights*. Which feature matters most? Bet points on your weights."
  *   **Why it works:** They can spot the *structure* (it's a similarity task) but they cannot access the *parameters* (the weights) without the same trial-and-error as everyone else. It humbles the "I see the code" claim.
  *   **Engagement:** Give them the "Mutation Engine" role in Phase 3. Their job is to explain why Gen 0 (random noise) is computationally unlearnable. This validates their expertise while serving the lesson.

  ### 3. The 9 AM Zombie Room
  *   **The Move:** Silence. No one wants to bet. No one wants to talk.
  *   **The Fix:** **Public Leaderboard.**
  *   **Script:** Write the Top 5 Scores on the whiteboard immediately after Phase 1. "Sarah has 38 points. Mike has 22."
  *   **Why:** Social pressure wakes people up faster than coffee. The desire to not look stupid (or to beat the CS kids) drives engagement.

  ---

  ## 5. Why This Works for Your Argument
  You want the inversion to *happen* to them.
  1.  **First-Person Data:** They generate the accuracy data themselves. They can't claim you rigged it.
  2.  **Introspection Failure:** They write the rule *after* they prove they can do the task. The failure is immediate and personal.
  3.  **The "Designer" Illusion:** In Phase 2, they act as Designers trying to reverse-engineer the system. They fail. In Phase 3, they see the system wasn't Designed, it was *Selected*.
  4.  **No "Chinese Room":** They aren't manipulating symbols they don't understand; they are making judgments they *feel* they understand but can't *transmit*. This is closer to the ML/Flatmate objection (undefined comprehension) and directly tests it.

  **Final Tip:** When you reveal the "Fossil Record," don't lecture. Ask: "If no one designed Gen 5 to be easy, why is it easy?" Let them say "Because the hard ones died." You just nod and write "Natural Selection" on the board. That's the whole seminar.
