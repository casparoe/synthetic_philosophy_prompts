  **MEMORANDUM**

  **TO:** Heritage and Naming Committee Board
  **FROM:** [Your Name], Student Committee Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Proposed Auditorium Renaming for Mrs. Delaney

  **1. Purpose**
  The purpose of this memo is to provide a formal recommendation regarding the proposal to rename the school auditorium in honor of Mrs. Delaney. This recommendation follows a review of alumni testimonials supporting the renaming and recent archival research conducted by the municipal history department that complicates the historical narrative.

  **2. Background and Conflict**
  For several years, the alumni association has advocated for renaming the auditorium to honor Mrs. Delaney. According to collective community memory, Mrs. Delaney acted as a protector during the curfew years, allegedly hiding students at risk of persecution. This narrative serves as a vital touchstone for alumni, representing resilience and institutional safety during a dark period in our city's history.

  However, recent findings from the municipal archive introduce significant ambiguity. Police logs and internal correspondence from the era suggest Mrs. Delaney held a secretarial position and may have complied with administrative directives to report student names. While these documents do not definitively prove harm, they contradict the oral history of her being a singular hero who actively subverted authority.

  **3. Analysis of Evidence and Community Impact**
  The committee faces a conflict between two forms of historical truth: **documentary evidence** (archives, logs, letters) and **community memory** (oral history, lived experience, alumni sentiment).

  *   **The Archival Record:** The municipal documents provide a contemporaneous account of administrative actions. Ignoring these records poses a reputational and ethical risk. If the school renames the building based on a narrative that is later disproven by hard evidence, particularly regarding potential complicity in reporting students, it could cause significant harm to the victims of that era and undermine the school's commitment to historical integrity.
  *   **The Alumni Position:** The alumni testimony cannot be dismissed as mere error. Community memory often preserves emotional truths and social values that official records miss. Even if Mrs. Delaney's specific actions are disputed, the alumni memory highlights a real need for protection that existed at the time. Dismissing this narrative entirely risks alienating a key stakeholder group and erasing the broader truth that students *did* require hiding, regardless of who provided it.

  To rely solely on the archive (archival monism) ignores the social function of memory. Conversely, to rely solely on memory (mnemonic pluralism) without regard for documented evidence risks validating potentially harmful historical inaccuracies. The school's naming policy must balance respect for community sentiment with a duty of care to historical accuracy.

  **4. Recommendation**
  Based on the conflicting evidence, the Committee recommends **against renaming the auditorium at this time.** Renaming a major facility implies a definitive historical endorsement that the current evidence cannot support.

  However, to honor the alumni's position and the complexity of the history, the Committee recommends the installation of a **Contextual Heritage Display** in the auditorium lobby.

  **Rationale for this Approach:**
  1.  **Historical Integrity:** It avoids permanently attaching the school's name to a figure whose actions are disputed by primary sources.
  2.  **Validation of Memory:** The display will explicitly feature the alumni oral histories alongside the archival findings. This acknowledges that the alumni's experience of safety (or the hope of it) is valid, even if the specific details regarding Mrs. Delaney are ambiguous.
  3.  **Educational Opportunity:** This approach transforms the conflict into a learning moment. It demonstrates that history is often complex and that honoring the past requires navigating difficult truths rather than simplifying them into hero/villain binaries.

  **5. Implementation Timeline**
  If the Board approves this recommendation, the following timeline is proposed for execution:

  *   **November 2 (Thursday):** Board vote on recommendation.
  *   **November 16:** Initial consultation meeting with Alumni Association leadership to present the decision and the alternative proposal for the Heritage Display.
  *   **December 1 – January 15:** Collaborative design phase for the display. A sub-committee comprising alumni representatives, archivists, and students will draft the text to ensure both the oral history and archival records are presented fairly.
  *   **February 1:** Draft text review by the Heritage Committee.
  *   **March 15:** Final installation and unveiling of the Heritage Display.
  *   **April 10:** Review period opens for community feedback on the display content.

  **6. Conclusion**
  This recommendation seeks to preserve the trust of the alumni body while maintaining the school's ethical standards regarding historical commemoration. By choosing a contextual display over a renaming, we acknowledge that Mrs. Delaney's story—and the era she lived through—is too complex for a nameplate, but too important to be forgotten.

  **Attachments:**
  *   Summary of Municipal Archive Findings (Confidential)
  *   Excerpts from Alumni Testimonials (Confidential)

  **Approved By:**
  [Your Name]
  Heritage and Naming Committee, Student Representative
