prompt: |-
  hey — I'm 17, I do policy debate and student government, and I'm doing an independent project this spring on who should get to vote. The thing I keep runing into is that everyone argues by just pointing at one case: someone says 16 year olds pay taxes and can drive, someone else says no but they still live with their parents and cant really judge policy, and then nothing moves. So before I write anything I want the full spec: what would a theory of the franchise actually have to get right to be worth taking seriously? Write me the desiderata list — which cases it has to handle without embarrassment (permanent residents who've lived in a town for twenty years and pay taxes there, citizens who moved abroad at age three and will never come back, people with severe cognitive disabilities, people in prison, a 14 year old who'll be living with the consequences of a climate or debt decision for seventy years, tourists and short term workers), which distinctions it isn't allowed to collapse (having a vote at all vs how much your vote is worth, being entitled to vote vs it being a good idea for you to vote, membership in a community vs merely being subject to its laws, the right to vote vs the right to run or to hold office), and which of those requirements are genuinely non-negotiable versus just something one side assumed at the start. Give me the case or the argument behind each requirement, not just the bullet, and say for each whether you think it's a real desideratum or a prejudice of one camp.

  The part I actually care about: I have this idea and I cant tell if it's good or if I'm just attached to it. Call it the stake gradient — the claim to a vote doesn't switch on at some age or at citizenship, it's a matter of degree, and it's strongest for whoever has the most years left living under whatever gets decided, which if you take it seriously gives a 15 year old a stronger claim than a 75 year old and makes the standard theyre too young to understand objection look like it's answering a different question entirely. I want that tested against your list rather than just rated: does it violate a desideratum that the usual views all satisfy (a flat age cutoff, the all-affected-interests principle, membership or consent of the governed, the you've paid in / done national service picture), and does taking it seriously force you toward fractional or weighted votes — parents casting proxy votes for their kids, or 16 to 21 year olds getting half a vote — or can you get the stake gradient without any of that, and what would that even look like in practice?

  Two more things. Please flag any pair of requirements on your list that you suspect can't both be satisfied, since if there is one that's probably the thing I'd build the whole paper around. And tell me which single desideratum rules out the most of the standard positions. If it helps to fix the purpose, I want a criterion good enough to actually decide whether my city should let 16 year olds and green card holders vote in municipal elections — not just something that sounds nice in a round of debate. And don't give me a reading list or citations or anything, I'll go find sources myself, I just want the shape of the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** 17 years old, policy debater, student government, independent project on voting rights (franchise theory).
      *   **Tone/Style:** Intellectual, rigorous, frustrated with superficial arguments ("everyone argues by just pointing at one case"), wants "the full spec," "desiderata list," "case or argument behind each requirement." No citations/reading lists.
      *   **Core Task:** Create a framework (desiderata) for a theory of the franchise, test the user's specific idea ("Stake Gradient"), identify tensions/incompatibilities in the framework, and identify the most exclusionary desideratum.
      *   **Specific Idea to Test:** "Stake Gradient" – voting claim is a matter of degree based on years left living under the decision (future-oriented stakes). Implies 15yo > 75yo.
      *   **Constraints:** Must handle specific edge cases (permanent residents, expat citizens, cognitive disabilities, prisoners, 14yo climate stakeholders, tourists). Must distinguish specific concepts (vote vs. weight, entitlement vs. prudence, membership vs. subjection, vote vs. office). Must flag non-negotiables vs. prejudices. Must flag incompatible requirements. Must identify the single most exclusionary desideratum. Practical application: Municipal elections for 16yos and green card holders.

  2.  **Deconstruct the "Desiderata List" (The Framework):**
      *   I need to build a list of criteria that a *good* theory of voting rights must meet.
      *   For each, I need: The Requirement, The Case/Argument, and Status (Non-negotiable vs. Prejudice).
      *   *Edge Cases to Cover:*
          *   Long-term residents (non-citizens).
          *   Expat citizens (never lived there).
          *   Cognitive disabilities.
          *   Prisoners.
          *   Youth/Climate stakes.
          *   Tourists/Short-term workers.
      *   *Distinctions to Maintain:*
          *   Vote existence vs. Vote weight.
          *   Entitlement vs. Prudence (should vs. ought).
          *   Membership vs. Subjection.
          *   Vote vs. Office.

      *   *Drafting the Desiderata:*
          1.  **All-Subjected Principle:** If laws bind you, you need a say. (Handles residents/tourists).
          2.  **All-Affected Interests:** If decisions impact you, you need a say. (Handles climate/future gens).
          3.  **Competence/Agency:** Voters must understand the act. (Handles cognitive disabilities/age).
          4.  **Reciprocity/Contribution:** If you pay in, you get out. (Handles taxpayers).
          5.  **Equality/One-Person-One-Vote:** Votes shouldn't be weighted. (Handles the "gradient" issue).
          6.  **Administrative Feasibility:** Must be implementable without chaos. (Handles the "gradient" measurement).
          7.  **Community Membership:** Voting is about belonging, not just impact. (Handles expats vs. residents).

      *   *Refining Status:*
          *   Equality is often treated as non-negotiable in liberal democracy, but the user's theory challenges it. I should label it contested.
          *   Competence is often a prejudice (used to exclude), but some baseline is arguably non-negotiable (e.g., coma patients).
          *   Reciprocity is usually a prejudice (children don't pay taxes but have stakes).

  3.  **Testing the "Stake Gradient" Theory:**
      *   *Concept:* Claim to vote scales with "years left living under the decision."
      *   *Strengths:* Solves the climate/debt intergenerational equity issue. Solves the arbitrary age cutoff (18 vs 16).
      *   *Weaknesses:* Violates "One Person, One Vote" (equality). Creates administrative nightmares (calculating life expectancy?). Devalues the elderly (ageism?).
      *   *Does it force weighted votes?* Yes, logically. If the *claim* is a gradient, the *power* should reflect the claim, unless you sever claim from power.
      *   *Can you get it without weighted votes?* Only if you use the gradient to set the *threshold* (who gets in), not the *weight*. But the user says "claim... is a matter of degree," which implies weight. I need to be honest here: a gradient claim usually demands a gradient implementation (proxy/weighted) to be consistent, otherwise it's just a fancy cutoff mechanism.
      *   *Comparison to Standard Views:*
          *   Flat Age Cutoff: Gradient beats this on fairness.
          *   All-Affected: Gradient is a subset of this (temporal affect).
          *   Membership: Gradient might conflict (elderly are members, but have less stake).
          *   Reciprocity: Gradient ignores past contribution.

  4.  **Identifying Tensions (The "Impossible Pair"):**
      *   *Tension 1:* **Equality of Voice vs. Proportionality of Stake.** You can't have "one person one vote" AND "votes weighted by future stake." One must go.
      *   *Tension 2:* **Universal Competence vs. Protection from Harm.** If everyone votes (including those who can't understand), bad policy happens. If only competent vote, you exclude vulnerable people.
      *   *Selection:* The Equality vs. Proportionality tension is the heart of the user's "Stake Gradient" idea. This is the goldmine for their paper.

  5.  **Identifying the Most Exclusionary Desideratum:**
      *   Which rule kills the most standard positions?
      *   "Competence/Capacity" is the usual suspect. It excludes kids, cognitive disabilities, sometimes prisoners.
      *   "Membership/Citizenship" excludes residents/tourists.
      *   "All-Affected" is actually *inclusionary*.
      *   *Verdict:* **Competence/Capacity.** It's the gatekeeper that justifies age limits and guardianship. It's the hardest to define without bias.

  6.  **Drafting the Response (Iterative refinement for tone and content):**
      *   *Tone:* Respectful, peer-to-peer (they are a smart 17yo debater), rigorous, direct. No fluff.
      *   *Structure:*
          1.  The Desiderata List (Requirement, Case, Status).
          2.  The Stress Test (Stake Gradient vs. List).
          3.  The Implementation Question (Weighted vs. Threshold).
          4.  The Impossible Pair (Tensions).
          5.  The Exclusionary Kingpin.
          6.  Practical Application (Municipal level).

      *   *Self-Correction on "Stake Gradient":* I need to make sure I don't just say "weighted votes are illegal." I need to explain *why* a gradient theory logically pushes toward weighting or proxy voting, and what it looks like if you resist that (e.g., using the gradient only to lower the age threshold to 0, but keeping votes equal).
      *   *Refining the "Prejudice" vs. "Non-negotiable":* Be careful not to impose my own politics. Frame it as "Liberal Democratic Orthodoxy" vs. "Radical Critique."
      *   *Addressing the specific cases:* Ensure the desiderata explain *why* the permanent resident or the prisoner is a hard case.

  7.  **Final Polish:** Check against all constraints.
      *   No citations? Check.
      *   Handle specific cases? Check.
      *   Handle specific distinctions? Check.
      *   Flag incompatible requirements? Check.
      *   Identify most exclusionary desideratum? Check.
      *   Practical municipal advice? Check.

      *(Self-Correction during drafting)*: I initially thought about suggesting "Stake Gradient" forces proxy voting. But the user asked if it *can* be done without that. I should explain that it *can*, but it requires decoupling "right to participate" from "power of participation." I need to be clear on that distinction.

      *(Refining the "Impossible Pair")*: The tension between **Political Equality** (1p1v) and **Stake Proportionality** (more skin in the game = more say) is the classic debate. I will highlight this as the core tension.

      *(Refining the "Most Exclusionary")*: **Capacity/Competence** is the right answer. It's the tool used to exclude children and the disabled. It's the most philosophically fraught.

      *(Municipal Context)*: For a city, "Stake Gradient" supports green card holders (they live there) and 16yos (they live there longer than old people potentially). It works well locally.

      *Let's write.*
answer: |-
  This is a strong pivot. Most debate cases stall because they argue *conclusions* (lower the age) without arguing *metrics* (how we measure the right to vote). You are asking for the metric.

  Here is the specification list for a theory of the franchise, the stress test of your "Stake Gradient" idea, and the structural tensions you need to exploit.

  ### Part 1: The Desiderata List
  A serious theory of the franchise must satisfy these seven requirements. I have categorized them by the argument that necessitates them and labeled their status (Non-Negotiable vs. Contingent/Prejudice).

  **1. The Non-Tyranny Requirement (All-Subjected Principle)**
  *   **The Case:** If you are legally bound by a coercive authority (arrested, taxed, zoned), you must have a mechanism to influence that authority. Without this, rule is mere force.
  *   **Cases Handled:** Permanent residents, prisoners, tourists (to the extent local laws bind them).
  *   **Status:** **Non-Negotiable.** A democracy that taxes people without representation is functionally a colony.
  *   **Distinction:** This is about *subjection to law*, not membership in a culture.

  **2. The Intergenerational Equity Requirement (All-Affected Interests)**
  *   **The Case:** Decisions made today impose costs/benefits on people who cannot currently consent. If a decision binds your future self, your future self needs representation now.
  *   **Cases Handled:** The 14-year-old facing climate debt, the unborn, the expat citizen (if they plan to return).
  *   **Status:** **Non-Negotiable,** but operationally difficult. Ignoring future stakes is theft from the future.
  *   **Distinction:** This separates *being affected* from *being a member*. A tourist is affected by a sales tax; a citizen abroad is affected by foreign policy.

  **3. The Agency Requirement (Competence)**
  *   **The Case:** Voting is a cognitive act of judgment. If an agent lacks the capacity to understand the choice, the "vote" is either random or cast by someone else (guardianship).
  *   **Cases Handled:** Severe cognitive disabilities, very young children, coma patients.
  *   **Status:** **Contingent/Prejudice.** This is the most weaponized desideratum. Historically, it was used to exclude women and non-landowners. However, *some* baseline is required (a rock cannot vote). The fight is over where the line is drawn.
  *   **Distinction:** This distinguishes *entitlement to vote* from *capacity to vote wisely*. You can be entitled but incompetent (requiring assistance), or competent but excluded (tyranny).

  **4. The Equality Requirement (One Person, One Vote)**
  *   **The Case:** Political power must be distributed equally to prevent caste systems. If votes are weighted by wealth, intelligence, or stake, the state officially declares some citizens worth more than others.
  *   **Cases Handled:** Prevents the "taxpayer gets more votes" argument.
  *   **Status:** **Liberal Orthodoxy (Contested).** It is treated as non-negotiable in modern constitutional law, but your "Stake Gradient" theory directly challenges this.
  *   **Distinction:** This is about *vote weight*, not *vote access*.

  **5. The Reciprocity Requirement (Contribution)**
  *   **The Case:** Political authority is a cooperative scheme. Those who contribute to the maintenance of the state (taxes, service, labor) earn the right to direct it.
  *   **Cases Handled:** Taxpaying 16-year-olds, green card holders.
  *   **Status:** **Prejudice.** This is a "benefit theory" of rights. It fails the Non-Tyranny test (children don't pay taxes but are subjected to laws). It is useful for rhetoric but fails as a foundational principle.
  *   **Distinction:** Confuses *earning a benefit* with *exercising a right*.

  **6. The Community Membership Requirement (Ethos)**
  *   **The Case:** Voting is not just about interests; it's about belonging. It requires a shared fate and shared identity.
  *   **Cases Handled:** Expat citizens (they belong but aren't here), short-term workers (they are here but don't belong).
  *   **Status:** **Contingent.** This is the "nationalist" counter to the "universalist" All-Affected principle. It is necessary for social cohesion but often excludes legitimate stakeholders.
  *   **Distinction:** *Membership* vs. *Subjection*. You can be subjected without being a member (resident alien).

  **7. The Administrative Feasibility Requirement**
  *   **The Case:** A right that cannot be implemented without massive cost or error is not a right. The state must be able to verify eligibility clearly.
  *   **Cases Handled:** Why we use age cutoffs instead of individual competence tests.
  *   **Status:** **Non-Negotiable.** Theory must meet reality.
  *   **Distinction:** *Ideal theory* vs. *Non-ideal implementation*.

  ---

  ### Part 2: Stress Testing the "Stake Gradient"
  Your idea: *Claim to vote is proportional to years left living under the decision.*

  **Does it violate a desideratum?**
  Yes. It violates **#4 (The Equality Requirement)**.
  Standard views (flat age cutoff, citizenship) preserve the fiction that all voters are equal peers. Your theory admits they are not equal peers regarding *stakes*.
  *   **The Conflict:** If a 15-year-old has a stronger claim than a 75-year-old because they have more "future exposure," then logical consistency demands the 15-year-old's vote count *more*, or the 75-year-old's vote count *less*.
  *   **The "Embarrassment" Test:** If you argue for the Stake Gradient but insist on 1-person-1-vote, you are admitting that *stakes don't actually determine power*, only *access*. You have to explain why the gradient matters for *entry* but not for *weight*.

  **Does it force weighted/proxy votes?**
  Logically, **yes**.
  If the "claim" is a gradient, the "power" should match the claim.
  *   **Weighted Votes:** A 16-year-old gets 1.0 vote, a 75-year-old gets 0.4 votes. (Violates Equality Requirement).
  *   **Proxy Votes:** Parents cast votes for children (accumulating the child's stake). (Violates Agency Requirement—parents have different interests than kids).
  *   **The Workaround:** You can keep 1-person-1-vote *only if* you treat the Gradient as a **Threshold Mechanism**, not a Weight Mechanism.
      *   *How it looks:* Everyone gets 1 vote, but the *age of entry* drops to 0 (or birth), because even infants have future stakes. The "Gradient" is used to argue against *exclusion*, not for *weighting*.
      *   *The Cost:* This dilutes the "Stake" argument. If a 90-year-old and a newborn both get 1 vote, you have abandoned the core premise that the stake is different. You've just adopted a "Universal Suffrage" view.

  **Comparison to Standard Views:**
  *   **Vs. Flat Age Cutoff:** Your view is superior on fairness (no arbitrary line).
  *   **Vs. All-Affected:** Your view is a subset. All-Affected includes people affected by foreign policy who don't live here. Your view is strictly temporal/residential.
  *   **Vs. Membership:** Your view conflicts. An elderly lifelong resident has high membership but low future stake. Your theory disenfranchises the elderly relative to the young.
  *   **Vs. Reciprocity:** Your view ignores past contribution. It is purely forward-looking.

  ---

  ### Part 3: The Impossible Pair (The Tension)
  If you want a killer paper, build it around this incompatibility. You cannot satisfy both of these simultaneously:

  **The Tension: Political Equality vs. Stake Proportionality**

  1.  **Political Equality:** Every voter must have equal power to prevent hierarchy and caste.
  2.  **Stake Proportionality:** Political power should align with how much the decision impacts the voter (to prevent exploitation).

  **Why they break:**
  If you prioritize **Equality**, you must give the 75-year-old the same vote as the 15-year-old, even though the 15-year-old will live with the climate debt 5x longer. This allows the old to exploit the young (gerontocracy).
  If you prioritize **Stake**, you must weight the votes or exclude the old. This creates a hierarchy where citizens are legally worth different amounts. This looks like apartheid or a plutocracy (where wealth = stake).

  **Your Paper's Angle:**
  Most debate cases hide this tension. They argue for lowering the age (Stake) while pretending it doesn't violate Equality. If you explicitly argue that **Political Equality is a myth that protects gerontocracy**, you have a novel, high-impact position. Alternatively, if you argue that **Stake Proportionality is unadministrable and dangerous**, you kill your own theory but save liberal democracy.

  ---

  ### Part 4: The Exclusionary Kingpin
  Which single desideratum rules out the most standard positions?

  **The Agency Requirement (Competence).**

  *   **Why:** It is the only tool available to justify excluding children, the cognitively disabled, and sometimes prisoners.
  *   **The Trap:** Every side uses it, but no one defines it.
      *   *Conservatives* use it to say "16-year-olds lack prefrontal cortex development."
      *   *Liberals* use it to say "Felons lack moral judgment."
      *   *Radicals* say "Competence tests are always biased."
  *   **For your Municipal Project:** If you argue for 16-year-old voting, you *must* dismantle the Agency Requirement. You have to argue that **Competence is not a prerequisite for voting; Subjection is.** (i.e., "I don't care if they understand the budget; they live in the zone, so they vote.")
  *   **For Green Card Holders:** The Agency Requirement doesn't exclude them (they are adults). The **Community Membership Requirement** does. You have to argue that *Subjection* (paying local taxes/using roads) overrides *Membership* (citizenship).

  ---

  ### Part 5: Practical Application (Municipal Level)
  You asked for a criterion to decide on 16-year-olds and Green Card holders in city elections.

  **The Criterion: "Residential Subjection"**
  Combine Desideratum #1 (Non-Tyranny) and #7 (Feasibility).
  *   **Rule:** If you reside within the jurisdiction for >6 months and are subject to local coercive laws (zoning, police, local tax), you vote.
  *   **Why it works for 16-year-olds:** They are subjected to school policy, curfew laws, and city infrastructure. Age is irrelevant to subjection.
  *   **Why it works for Green Card Holders:** They pay local taxes and use local roads. Citizenship is irrelevant to subjection.
  *   **Why it avoids the "Stake Gradient" trap:** You don't need to calculate "years left." You just need a binary "Do you live here?" This satisfies Administrative Feasibility.
  *   **The Trade-off:** You sacrifice the "Intergenerational Equity" nuance. A 90-year-old mover gets the same vote as a 10-year-old lifer. But you gain a implementable policy that doesn't require weighted ballots.

  **Final Advice for the Project:**
  Don't try to solve the "Weighted Vote" problem. Acknowledge it. State clearly: *"My theory of Stake Gradient proves that the current system is unjustly gerontocratic. However, because Weighted Voting violates the Equality Requirement, we must choose: do we want accurate representation of stakes, or do we want the myth of equal citizenship?"*

  That is the argument that wins rounds and writes papers. Everything else is just case management.
