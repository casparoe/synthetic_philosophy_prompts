  hey so im prepping interview questions for a podcast episode next week. my guest is dr. elena vasquez, who just published a book arguing that the browning-vs-goldhagen debate is a false dichotomy because both miss what she calls scripted complicity. her idea is that perpetrators in bureaucratic violence learn to perform atrocity through small-group rituals that turn killing into a kind of social choreography — peer affirmation and the script itself supply emotional rewards while hiding moral weight. she thinks this explains both the reluctant shooters in browning's reserve police study and the enthusiastic killers goldhagen describes, without reducing everything to pure situation or pure ideological character.

