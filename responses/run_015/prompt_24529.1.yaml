answer: |-
  **Scenario**
  A small grantmaker considers funding two identical bednet distribution campaigns in neighboring regions. Cost and underlying mechanism are identical. In Region 1 (Measurable), the government permits independent verification; impact is confirmed at 1,000 DALYs averted with narrow confidence intervals. In Region 2 (Hard-to-Measure), the government forbids external auditing; the mechanism is assumed identical, but impact is unverified. The epistemic estimate for Region 2 has the same mean (1,000 DALYs) but a wide distribution (0 to 5,000 DALYs) because the lack of data prevents ruling out higher baseline efficacy. True expected impact is comparable.

  **Framework A Reasoning**
  Framework A calculates expected value per dollar but applies a confidence discount to uncertain estimates to avoid overconfidence. It collapses the wide probability distribution of Region 2 into a conservative point estimate (e.g., the 10th percentile or mean multiplied by a confidence factor). Region 1 scores 1,000 (verified). Region 2 scores 500 (discounted for uncertainty). Framework A ranks Region 1 higher, prioritizing robust, verified impact over speculative upside.

  **Framework B Reasoning**
  Framework B preserves the full probability distribution and applies a minimax-regret rule. It asks: "What is the maximum regret of each choice?" If Region 2 actually yields 5,000 DALYs (possible within the wide distribution) and we chose Region 1, regret is 4,000 DALYs. If Region 2 yields 0 and we chose it, regret is 1,000 DALYs (the value of Region 1). Since the regret of missing Region 2's upside outweighs the regret of wasting funds, Framework B ranks Region 2 higher. It treats the unmeasured tail as a live possibility rather than noise.

  **Structural Feature**
  The divergence stems from Framework A's confidence-discounting (collapsing variance into a lower point estimate). A treats uncertainty as a penalty; B treats it as a range of possibilities where the upside matters. If A removed the confidence discount and used raw expected value, the rankings would tie (since means are equal). The bias is not the absence of data, but the asymmetric penalty A applies to it.

  **Strongest Attack**
  A defender of Framework A would argue that measurability is itself evidence of impact. If Region 2 cannot be measured, it is likely because the mechanism is less robust or the context is more volatile, meaning the "fat right tail" is epistemic arrogance, not real potential. They would claim B's minimax-regret rule rewards mystery arbitrarily: without data, the 5,000 DALY upper bound is fiction, so minimizing regret based on fiction is irrational. Measurability isn't a bias; it's a proxy for causal clarity.
