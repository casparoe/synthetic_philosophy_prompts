  2.  **Deconstruct the Prisoner's Dilemma Analogy:**
      *   *Standard PD:* Two players, two choices (Cooperate/Defect). Payoffs: Temptation > Reward > Punishment > Sucker. Nash Equilibrium is Defect/Defect, but Cooperate/Cooperate is Pareto optimal.
      *   *AI Context:*
          *   Players: AI Labs (or Nations backing them).
          *   Cooperate: Invest heavily in safety/alignment (incur tax).
