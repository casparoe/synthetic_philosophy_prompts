answer: |-
  Elena, a senior billing supervisor, intercepts a report blaming junior clerk Mark for a costly coding glitch she knows originated in the legacy software. She signs the correction form, citing protocol fairness to absorb the heat from administration, explicitly reasoning that it is unjust to punish an employee for infrastructure they cannot control. However, this sensitivity to justice exists only within the hospital's walls; at home, Elena evades taxes, lies casually to neighbors, and ignores her sister's distress, treating professional integrity as a procedural script rather than a character trait. This stark fragmentation is not chosen malice but a deep-seated psychological adaptation to a rigid bureaucracy that rewarded role-compliance over holistic honesty, leaving her unable to transfer her professional moral clarity to her personal life.

  (1) On the right-reasons view, moral worth attaches to the action because Elena's motivation tracks the actual normative fact—that blaming Mark is unfair—making her praiseworthy for grasping the justification. On the integrated virtue view, worth is denied because the action does not emanate from a stable, good character; it is an isolated output of institutional conditioning amidst a generally callous psyche, rendering the goodness accidental to who she is.

  (2) The divergent feature is **psychological integration**. The right-reasons view isolates the specific motivation behind the specific act (grasping fairness), while the virtue view evaluates the agent's broader moral architecture (fragmented vs. unified), treating the compartmentalization as a deficit in agency rather than a neutral fact.

  (3) If you remove the compartmentalization, making Elena honest and caring outside work, the fragmentation vanishes. Both views would then converge on granting worth, as the right reason would then be supported by a virtuous character, eliminating the tension between act-based and agent-based evaluation.

  (4) The virtue ethicist avoids begging the question by arguing that moral worth tracks the quality of the *agent*, not just the *act*. They contend that an action driven by compartmentalized conditioning is morally accidental relative to the self; even if the fragmentation is non-culpable, a fractured psyche lacks the unity required for true praise, as the 'goodness' cannot be relied upon outside the specific triggering context.
