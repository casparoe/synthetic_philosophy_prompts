answer: |-
  Here is an analysis of the Rwandan crisis through the lens of Lemkin's broader framework and the politics of naming, structured to help you build the intellectual backbone of your scene.

  ### 1. The Gap: Lemkin's Vision vs. The UN Convention
  To arm your lawyer, you need to establish the discrepancy between what Lemkin meant and what the law became.

  *   **Lemkin's Original Concept:** For Lemkin, genocide was not just mass murder. It was a coordinated plan to destroy the *essential foundations* of a group's life. He viewed a nation as an organic entity. Killing the people was the ultimate step, but the process began with dismantling their institutions, eroding their culture, banning their language, and destroying their moral cohesion. He cared about the *sociological death* of the group as much as the biological one.
  *   **The UN Convention (1948):** During the drafting, colonial powers (like Britain and France) and others lobbied heavily to remove "cultural genocide." They feared being charged with genocide for assimilating indigenous populations or suppressing local cultures. The result was a narrow legal box: genocide required proof of *intent to physically destroy* a group.
  *   **The Lawyer's Argument:** The West didn't just fail to act; they hid behind this narrowed definition. By reducing genocide to "body count + specific intent," they created a high evidentiary bar that could be debated while people died. Lemkin's broader view would have recognized the *dismantling of Rwandan society* as genocide even before the killing reached its peak.

  ### 2. Rwanda Through Lemkin's Lens (Cultural and Moral Destruction)
  If your lawyer applies Lemkin's original framework to the ground reality in 1994, the "genocidal" nature of the crisis becomes obvious much earlier than the UN admitted.

  *   **The Identity Cards:** The colonial-era ID cards marking Hutu and Tutsi weren't just administrative; they were ontological. They defined existence. When the interim government began using these lists to target victims, they weren't just killing individuals; they were enforcing a rigid, destructive categorization of human worth. Under Lemkin's view, the *weaponization of identity* is a precursor to genocide, a form of moral destruction that separates the "human" from the "other."
  *   **The Churches:** Thousands were killed in churches (e.g., Ntarama, Nyange). In the narrow UN definition, this is a massacre. In Lemkin's framework, this is an attack on the *spiritual fabric* of the community. By turning sanctuaries into slaughterhouses, the perpetrators destroyed the moral architecture that held society together. It signaled that no sacred space existed, dissolving the shared norms that prevent chaos.
  *   **The Social Fabric:** The requirement for neighbors to kill neighbors (often coerced by local authorities) was a deliberate strategy to implicate the entire community in the violence. This wasn't just efficient killing; it was a method to ensure the *social group* could never reconstitute itself. The trust required for a society to function was incinerated. Lemkin would argue this *social dissolution* is genocide, even if the machetes stopped.
  *   **Desecration of the Dead:** Bodies were left in rivers or fields to rot, preventing burial rites. This attacks the *memory* and *continuity* of the group. It is an attempt to erase the group from history, not just from the present.

  **The Point for the Scene:** Your lawyer can argue that by April 1994, the *cultural and moral* genocide was complete. The society was already dead; the physical killing was just the cleanup. The UN waited for the physical proof because they had discarded the moral framework.

  ### 3. The Speech Act: Naming as Obligation
  This is the crux of the legal drama. In linguistics, a "speech act" is an utterance that performs an action (like saying "I do" in a wedding). In international law, saying "genocide" is a performative act that triggers specific obligations.

  *   **The Trigger:** Article 1 of the Genocide Convention states that contracting parties undertake to "prevent and to punish." Once the label is applied, inaction becomes a violation of international law.
  *   **The Semantic Quarantine:** The US and UN didn't just hesitate; they engaged in active semantic suppression. They used phrases like "acts of genocide" or "chaos" or "civil war."
  *   **Why the Hesitation?**
      *   *Surface Reason:* They claimed they lacked legal proof of "intent." (i.e., Is this random violence or a plan?)
      *   *Real Reason:* Naming it would force a response they had no political will to give. The US was reeling from the "Black Hawk Down" incident in Somalia (1993). The political cost of intervention was too high.
  *   **The Lawyer's Insight:** The hesitation wasn't about *accuracy*; it was about *liability*. If you call it a "fire," you must call the fire department. If you call it "smoke," you can just open a window. The West chose to describe the smoke while the house burned. They treated the word "genocide" as a diplomatic hazard rather than a descriptive truth.

  ### 4. Where the Theory Meets Bureaucratic Reality
  Your lawyer needs to acknowledge where the idealism of Lemkin crashes into the machinery of the state.

  *   **Where the Theory Holds:** It explains the *language* used. The meticulous avoidance of the G-word by State Department spokespeople (famously instructing them to say "acts of genocide" until they couldn't anymore) proves they understood the power of the speech act. They knew the word carried weight.
  *   **Where the Theory Misses:** Lemkin believed that if you defined the crime correctly, the world would act. Rwanda proved that even with a clear definition, action is optional if there is no enforcement mechanism. The problem wasn't just the narrow definition; it was the lack of consequence for ignoring the narrow definition.
  *   **Bureaucratic Self-Interest:** The UN and US weren't just avoiding legal obligations; they were protecting institutional viability. Admitting genocide meant admitting failure of intelligence and peacekeeping mandates. It was easier to deny the label than to admit the system had failed.

  ### 5. The Verdict on Lemkin's Framework
  For the climax of your lawyer's argument, consider this synthesis:

  *   **Did the delay prove we need the broader definition back?**
      *   *Argument:* Yes. If "cultural destruction" had been part of the legal definition, the threshold for intervention could have been met weeks earlier, before the death toll peaked. The destruction of the social fabric was evident in the radio broadcasts (RTLM) and the roadblocks before the mass graves were filled.
      *   *Counter-Argument:* No. A broader definition might have made the term *too* vague, allowing states to argue it was just "cultural conflict" rather than extermination. The narrow definition was actually clearer (people are being killed), but the political will was absent.
  *   **The Deeper Truth:** The episode suggests that Lemkin was right about the *nature* of the crime but wrong about the *cure*. He thought law would constrain power. Rwanda showed that power constrains law.
  *   **The Novel's Angle:** Your lawyer should conclude that the West didn't just fail to stop a genocide; they failed to *witness* it properly. By insisting on the narrow, biological definition, they reduced a complex, spiritual, and social erasure to a simple body count. And then, they disputed the count.

  **Drafting Tip for the Dialogue:**
  Have the lawyer contrast the *sterility* of the UN definition with the *visceral reality* of the ground.
  *"They wanted a blueprint of the intent before they'd admit the house was on fire. Lemkin knew that burning the books, the churches, and the trust between neighbors IS the fire. The bodies are just the ash. By waiting for the ash, they ensured there would be no one left to testify."*

  This approach allows your character to be legally rigorous without getting bogged down in dry statute, focusing instead on the moral catastrophe of the silence.
