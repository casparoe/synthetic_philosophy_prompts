prompt: |-
  hey, i'm drafting a scene for my novel where a lawyer in the 90s is arguing about why the US and UN deliberatly avoided calling rwanda a genocide in '94 even though the killing was obvious. i want to use lemkin's original idea — the broader one that included cultural and moral destruction, not just the narrow UN convension definition — and also this concept that naming an atrocity isn't just describing it but actually triggers legal obligations, almost like a speech act.

  so can you analyze the rwandan crisis through that lens? like, apply lemkin's broader framework (the dropped cultural and moral parts) to what was actually happening on the ground — the destruction of identity cards, churches, the social fabric — and then look at how the politics of naming worked. where does the theory explain the hesistation (were they avoiding the word because the cultural parts didn't fit the legal box, or because saying it would force action?), where does it miss (maybe bureaucratic self-interest?), and what does the whole episode say back about lemkin's framework — does the delay prove we need the broader definition back, or does the eventual naming show the narrow one was enough?

  i don't need citations or a reading list, just the analysis. and please don't just tell me the standard story about state department lawyers — i already know that part.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
