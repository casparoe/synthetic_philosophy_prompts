          3.  The Speech Act (The Power of the Word).
          4.  The Real Reason for Silence (Political Will vs. Legal Semantics).
          5.  The Verdict on Lemkin (What the scene should conclude).
      *   *Key Insight for the Scene:* The lawyer should argue that by sticking to the narrow definition, the West wasn't being legally precise; they were being *morally cowardly*. They reduced a holistic erasure of a people to a body count, and then disputed the count.

