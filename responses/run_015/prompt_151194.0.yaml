      *   **Core Concepts:**
          *   Raphael Lemkin's original/broader definition of genocide (cultural, moral destruction) vs. the narrow UN Convention definition (physical/biological destruction).
          *   Speech Act Theory (naming an atrocity triggers legal/moral obligations).
      *   **Task:** Analyze the Rwandan crisis through this specific lens.
          *   Apply Lemkin's broader framework to the ground reality (ID cards, churches, social fabric).
          *   Analyze the politics of naming (hesitation reasons: legal fit vs. obligation avoidance).
          *   Evaluate the theory's limits (bureaucratic self-interest).
          *   Reflect on what this says about Lemkin's framework (need for broader definition vs. sufficiency of narrow one).
      *   **Constraints:** No citations/reading lists. No standard "State Department lawyers were scared of the C-word" summary (the user knows this). Focus on deep analysis suitable for a novel's intellectual backbone.

  2.  **Deconstruct Lemkin's Original Vision vs. UN Convention:**
      *   *Lemkin:* Saw genocide as a coordinated plan to destroy the essential foundations of a group's life. This included language, culture, religion, institutions, and personal security. It was about *existence* in a holistic sense.
      *   *UN Convention (1948):* Narrowed significantly. Focused on "intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such." Primarily physical killing or preventing births. Cultural genocide was explicitly debated and *removed* during drafting (mostly due to colonial powers fearing scrutiny).
      *   *The Gap:* The UN definition requires proof of *intent to physically destroy*. Lemkin's included *intent to erase identity*.

  3.  **Apply to Rwanda (Ground Reality):**
      *   *Physical:* Machetes, mass graves, rivers of bodies. This fits the UN definition easily *in hindsight*, but at the time, the "intent" was debated (was it civil war chaos or systematic elimination?).
      *   *Cultural/Social (Lemkin's Lens):*
          *   *ID Cards:* The Hutu/Tutsi distinction was colonial but became ontological. Destroying the person meant destroying their place in the social order.
          *   *Churches:* Places of sanctuary became slaughterhouses. This isn't just killing; it's desecrating the moral/spiritual anchor of the community.
          *   *Neighbors killing neighbors:* This breaks the "social fabric" Lemkin cared about. It's not just death; it's the dissolution of trust and community cohesion.
          *   *Erasure:* Bodies left to rot to spread disease, preventing burial rites. This attacks the *memory* and *dignity* of the group.

  4.  **Analyze the Politics of Naming (Speech Act Theory):**
      *   *The Theory:* Saying "Genocide" $\rightarrow$ Triggers Article 2 of the Convention $\rightarrow$ Obligation to "prevent and punish."
      *   *The Hesitation:* It wasn't just about whether the facts fit the definition. It was about the *consequence* of the utterance.
      *   *The "Legal Box" Argument:* The US/UN argued "we don't have enough evidence of *intent* yet." This is a shield.
      *   *The "Obligation" Argument:* If we say it, we must act. We don't *want* to act (Somalia hangover, no strategic interest). Therefore, we cannot say it.
      *   *Lemkin's Insight:* Lemkin knew the word was a weapon. By narrowing the definition, states made the weapon harder to fire. In Rwanda, they pretended the gun was jammed (lack of evidence) so they wouldn't have to shoot (intervene).

  5.  **Evaluate the Theory's Limits & Bureaucratic Self-Interest:**
      *   *Where Theory Explains:* It explains the semantic gymnastics. "Acts of genocide" vs. "Genocide."
      *   *Where Theory Misses:* It assumes legal logic drives the decision. In reality, *political will* drives the legal interpretation. Bureaucracies aren't just avoiding obligations; they are preserving institutional safety (not getting bogged down in another quagmire).
      *   *The "Somalia Shadow":* The Black Hawk Down incident (1993) made the US terrified of peacekeeping casualties. This isn't about Lemkin; it's about domestic polling and body bags.

  6.  **Reflect on Lemkin's Framework (The "So What?"):**
      *   *Did the delay prove we need the broader definition?* Actually, a broader definition might have made it *easier* to ignore. If "cultural destruction" is genocide, states can argue "it's just civil war chaos." The narrow definition was actually clearer (killing is happening), but the *political cost* was the barrier.
      *   *However:* Lemkin's focus on *social fabric* explains the *impact* better. The trauma of Rwanda wasn't just the death toll; it was the collapse of society.
      *   *Conclusion:* The problem wasn't the definition; it was the enforcement mechanism. But Lemkin's broader view helps the *lawyer character* argue that the West failed morally, not just legally. They ignored the *soul* of the nation, not just the bodies.

  7.  **Drafting the Response (incorporating the "Novelist" angle):**
