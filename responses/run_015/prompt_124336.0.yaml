answer: |-
  This is a classic formulation of the **Causal Exclusion Argument for Mereological Nihilism**, and it's a strong one. You've effectively reconstructed the core tension between naturalistic ontology (1), physical closure (2), and common-sense realism (7). Your friend's suggestion is a version of **paraphrase nihilism** (akin to Rosen or Dorr): they grant your ontology but try to save the *language* of tables. You feel this is "changing the subject" because you want to save the *objects*, not just the talk. You want to be a realist, not a fictionalist.

  Here is the breakdown of your options, the costs, and the recommended hole to exploit.

  ### The Options and Their Costs

  **1. Reject (1): The Causal Criterion**
  *   **Why it looks fine:** It's your primary weapon against Universalism (the view that *any* arbitrary collection of things composes an object). It ties existence to scientific utility, keeping ontology clean.
  *   **The Cost:** If you drop this, you lose your constraint on composition. You'd need a new principle to explain why tables exist but "trout-turkeys" (scattered fusions) don't. You might have to accept "Brutal Composition" (it's just a brute fact which things compose wholes) or rely on vague intuitions about unity, which weakens your naturalistic stance.
  *   **Verdict:** You explicitly said you don't want to give this up. Don't drop it unless you have a better constraint ready.

  **2. Reject (2): Causal Fixity/Supervenience**
  *   **Why it looks fine:** It aligns with the causal closure of the physical domain. It prevents "spooky" downward causation where the whole adds energy or influence not accounted for by the parts.
  *   **The Cost:** You commit to **Strong Emergentism**. You'd have to argue that wholes have causal powers *over and above* their parts. This is scientifically controversial and metaphysically expensive. It risks violating conservation laws or positing mysterious forces.
  *   **Verdict:** You said you'd rather keep (2). Good instinct. This is the most expensive bullet to bite.

  **3. Reject the Inference (2) $\rightarrow$ (3): The Exclusion Move**
  *   **Why it looks fine:** It relies on the intuition of **Causal Competition**. If the parts are *sufficient* to cause the effect, the whole looks like an unnecessary second cause. If the job is done, nothing else is needed. This is the heart of the "Exclusion Problem."
  *   **The Cost:** You must adopt a metaphysics of **Non-Competitive Causation** (often via Grounding or Constitution). You have to argue that the whole's causing the effect is *not distinct* from the parts' causing the effect in a way that creates redundancy. The table causes the scratch *in virtue of* the particles causing the scratch. They are not two competing causes; they are one causal reality described at two levels.
  *   **The Risk:** You need to explain why this saves tables but not scattered fusions. (Answer: Scattered fusions lack the *unity* to bear those powers as a single subject, even if their parts have powers).

  ### The Recommendation

  You should reject the transition **(2) $\rightarrow$ (3)**.

  This step assumes that because the parts are *sufficient*, the whole is *idle*. But sufficiency does not imply exclusion if the whole is **grounded** in the parts. If the table is constituted by the particles, the table's causal work *just is* the particles' causal work. It's not that the particles do the work *instead* of the table; it's that the table does the work *by having* the particles do it.

  This allows you to keep (1) (tables earn their place by explaining scratches), keep (2) (physics is closed), and deny (4) (tables exist). It avoids your friend's linguistic dodge by granting the table full ontological status, just not *fundamental* status.

  **Why did it look fine?** Because we intuitively treat causation as a zero-sum game: if $A$ causes $E$, and $B$ causes $E$, and $A$ is enough, $B$ is redundant.
  **Why reject it?** Because that intuition fails for constitutive relations. The relation between whole and parts isn't like two billiard balls hitting a third; it's like a statue and the clay. The clay's supporting the weight *is* the statue's supporting the weight.

  **The Cost:** You must accept that distinct entities can share causal powers without overdetermination. You also need to supplement (1) slightly: existence requires causal powers, but *composite* existence requires those powers to be integrated (blocking scattered fusions).

  Verdict: (2)->(3)
