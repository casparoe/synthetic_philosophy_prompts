answer: |-
  ### Exam Question

  **Course:** Philosophy of Biology (Upper-Level)
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. No external materials or citations are required. Focus on argumentative precision and textual engagement.

  **Prompt:**

  In *The Descent of Man*, Darwin offers a naturalistic genealogy of morality rooted in social instincts, reason, and habit, while simultaneously treating religious belief as a byproduct of cognitive faculties (e.g., agency detection) and fear. This creates a tension: if religious morality is debunked as an evolutionary artifact, Darwin's own moral account risks the same fate. If morality is merely a contingent tribal tool calibrated for utility, on what grounds can Darwin claim that extending sympathy to "all sentient beings" constitutes objective moral *progress* rather than a mere shift in fashion?

  Critically evaluate whether Darwin's framework allows for "normative bootstrapping." Can the selection for social instincts generate its own justification conditions, or is he smuggling in Victorian values under the guise of natural law? In your answer, you must engage with his comparison of human and animal sociality (the bee-to-human gradation) and analyze whether dismissing religious foundations destabilizes or strengthens his claim that the expansion of sympathy is the highest moral aim.

  ***

  ### Model Answer

  Darwin's project in *The Descent of Man* attempts to naturalize morality without reducing it to mere illusion. He argues that moral conscience arises when enduring social instincts clash with transient desires, mediated by memory and reason. However, by treating religion as a cognitive byproduct driven by fear and agency detection, Darwin undermines the traditional transcendental anchor for moral truth. This forces him into a precarious position: if both religion and morality are evolutionary outcomes, why is the secular expansion of sympathy "better" than tribal exclusivity? To avoid the charge that he is merely codifying Victorian sensibilities, Darwin must demonstrate that natural selection can generate normative authority—a process akin to normative bootstrapping.

  Darwin's defense relies on the distinction between the *origin* of a trait and its *current utility*. While the social instinct originated for tribal survival, human intellectual faculties allow us to recognize that the principle of utility applies more broadly than our ancestors realized. This is where the bee-to-human gradation becomes crucial. Darwin notes that while bees act for the community, they do so via rigid instinct. Humans, possessing advanced reason and memory, can reflect on past actions and anticipate future consequences. We realize that excluding members of the tribe or other nations ultimately diminishes the overall happiness and stability of the community. Thus, the expansion of sympathy is not arbitrary; it is the logical extension of the social instinct when processed through high-level cognition. The "good" is anchored in the enduring satisfaction of social needs, which is more stable than the fleeting satisfaction of selfish desires.

  However, the bootstrapping problem remains acute. If the "enduring satisfaction" of social instincts is itself just a selected preference, why *ought* we prioritize it? Darwin risks circularity: we should follow social instincts because they make us feel socially satisfied, and we value social satisfaction because we have social instincts. He attempts to escape this by appealing to the judgment of "competent judges"—those with developed intellect and sympathy. Yet, this looks suspiciously like an appeal to the consensus of his own Victorian class. If morality is a tool for tribal utility, a tribe that successfully excludes outsiders might be just as "fit" as one that includes them, provided they maintain internal cohesion.

  Dismissing religious foundations actually strengthens Darwin's descriptive account but weakens his normative leverage. By removing divine command, he clears the ground for a consistent naturalism where morality is continuous with animal behavior. Yet, without a transcendent standard, "progress" becomes difficult to define. Darwin defines progress as the expansion of the moral circle, but this is only "progress" relative to the specific goal of maximizing social happiness. If one rejects that goal, the evolutionary account offers no rebuttal other than social disapproval.

  Ultimately, Darwin partially succeeds in bootstrapping normativity. He shows that once an organism values social cohesion (which we do by nature), reason dictates that expanding sympathy is more consistent and durable than restricting it. However, he cannot prove that we *must* value social cohesion in the first place. He avoids pure relativism by anchoring morality in deep biological facts about human nature, but he cannot fully escape the charge that his "highest moral aim" is a projection of the specific cooperative pressures that shaped his own lineage.

  ***

  ### Marking Scheme (Total 20 Marks)

  **Grade Thresholds:**
  *   **A (17-20):** Sophisticated engagement with the tension; resolves or deeply complicates the bootstrapping problem; integrates the bee/human comparison meaningfully.
  *   **B (13-16):** Accurate summary of Darwin's view; identifies the tension but offers a standard or surface-level resolution; engages with course concepts correctly but lacks critical bite.
  *   **C (9-12):** Mostly summary; misses the normative tension; treats Darwin's view as unproblematic or purely descriptive.
  *   **D/F (0-8):** Significant misunderstandings of the text; fails to address the prompt.

  **Specific Criteria & Point Allocation:**

  **1. The Normative Bootstrapping Problem (6 Marks)**
  *   **A (5-6):** Explicitly explains *why* bootstrapping is a problem (i.e., selection explains origin, not justification). Evaluates whether Darwin's appeal to "enduring satisfaction" or "reason" successfully bridges the is/ought gap, or acknowledges where it fails.
  *   **B (3-4):** Identifies the term or concept but treats it as a simple "is/ought" problem without applying it to Darwin's specific mechanism (social instinct vs. reason).
  *   **C (0-2):** Mentions "Victorian values" but does not explain the structural philosophical problem of self-justification.

  **2. The Bee-to-Human Gradation & Role of Reason (6 Marks)**
  *   **A (5-6):** Uses the animal/human comparison to explain *how* Darwin thinks we move from tribal instinct to universal sympathy (intellect allows us to override immediate instinct for long-term social good).
  *   **B (3-4):** Mentions animals have instincts and humans have reason, but fails to connect this to the *expansion* of the moral circle.
  *   **C (0-2):** Ignores the animal comparison or treats it as merely about intelligence levels without moral implications.

  **3. Religion vs. Morality Tension (4 Marks)**
  *   **A (4):** Analyzes how debunking religion affects the status of morality (e.g., removes transcendental anchor, forces morality to stand on biological utility alone).
  *   **B (2-3):** States that Darwin disliked religion or thought it was evolutionary, but doesn't connect this to the *justification* of moral progress.
  *   **C (0-1):** Treats religion and morality as identical in Darwin's account.

  **4. Clarity, Structure, and Argument (4 Marks)**
  *   **A (4):** Clear thesis, logical flow, precise philosophical language.
  *   **B (3):** Readable but may wander; thesis is present but not consistently defended.
  *   **C (0-2):** Disorganized or difficult to follow.

  **Common Mistakes (Point Deductions):**
  *   **-2 Marks:** Summarizing *Descent of Man* Chapter 4 without addressing the "progress" or "justification" aspect of the prompt.
  *   **-2 Marks:** Claiming Darwin argues morality is *only* a byproduct (ignoring the adaptive utility of social instincts).
  *   **-1 Mark:** Using the term "spandrel" without defining it in evolutionary context (since it is anachronistic to Darwin).
  *   **-1 Mark:** Arguing Darwin supports religious morality (textual error).
