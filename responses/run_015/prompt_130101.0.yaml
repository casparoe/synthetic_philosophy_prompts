answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** Chair, Clinical Ethics Committee
  **DATE:** [Date]
  **SUBJECT:** Pre-Meeting Decision Memo: Case of Ms. A (Advanced Dementia, Dysphagia, Conflicting Surrogate Claims)

  **1. RECOMMENDATION AND CARE PLAN**

  This memo outlines the Committee's proposed position for Thursday's consultation regarding Ms. A. Given the precedent-setting nature of the conflict between the patient's Advance Directive (AD) and the surrogate claim of "relational personhood," we must issue a decision that is medically sound, ethically defensible, and operationally clear for future cases.

  **Decision:** The Committee recommends **against** the placement of a percutaneous endoscopic gastrostomy (PEG) tube. The care plan shall continue careful hand-feeding with a primary focus on comfort and aspiration management.

  **Time Frame and Review:** This decision is effective immediately. The care plan shall be reviewed in seven days, or sooner if Ms. A exhibits signs of distress that cannot be managed palliatively. If the family remains divided, the Advance Directive shall govern all subsequent major medical interventions unless a unified consensus is reached by the care network.

  **2. ENGAGING THE RELATIONAL PERSONHOOD CLAIM**

  The sons argue that Ms. A's personhood is no longer defined by her past autonomous self (who signed the AD) but by her current relational existence, which they sustain. They contend the AD is therefore invalid. We must address this on its own terms, not merely dismiss it as a misunderstanding of legal statute.

  If we accept the premise that personhood is constituted by current relationships rather than biological continuity or past autonomy, the absolute authority of the Advance Directive is indeed challenged. However, accepting this premise does not automatically grant authority to the sons.

  A relational account of personhood requires a *coherent* care network to constitute the patient's current identity. Where the network is fractured, no single subset of relations can claim to exclusively define the patient's interests. In this case, the "relational self" is disputed: the daughter, who constitutes a significant part of Ms. A's current daily world, asserts the validity of the mother's prior wishes.

  Therefore, even if we grant that relational standing can modify the weight of an AD, it cannot override it when the relational network itself is in conflict. To allow the sons' view to prevail would be to privilege one faction of the relationship network over another without ethical justification. In the absence of relational consensus, the Advance Directive remains the only objective evidence of the patient's own valuation of her life and risks. It serves as the necessary default anchor when the "relational self" is contested.

  **3. OPERATIONAL CRITERIA FOR STAFF: ASSESSING RELATIONAL AUTHORITY**

  Staff have rightly noted that philosophical arguments about personhood can mask familial guilt or self-interest. Our current policy lacks the vocabulary to distinguish between a family member advocating for a genuine relational interest and one pursuing their own emotional needs.

  For future cases where family members seek to override an AD based on current relationship claims, staff should apply the following criteria to assess "Relational Authority." No single factor is decisive, but the weight of evidence should guide our confidence in the surrogate's claim.

  *   **Consistency of Presence:** Does the surrogate participate in the routine, unglamorous aspects of care (hygiene, feeding, turning) or only appear for decision points? High-intensity, sustained involvement suggests a constitution of the patient's current self; sporadic presence suggests an external projection.
  *   **Responsiveness to Non-Verbal Cues:** Can the surrogate accurately interpret the patient's current signs of comfort or distress? A claim to represent the "current person" requires the ability to read that person's present state.
  *   **Consensus within the Care Network:** Does the surrogate's position align with other consistent caregivers (including nursing staff and other family)? A claim that isolates the patient from their broader care community is suspect.
  *   **Burden Sharing:** Is the surrogate willing to share the physical or logistical burden of the requested intervention? For example, if requesting continued aggressive treatment, is the family prepared to assist in the care required?
  *   **Alignment with Known Values:** Does the request align with the patient's lifelong values, even if not formally documented?

  In Ms. A's case, the daughter's daily presence and alignment with the AD weigh heavily against the sons' sporadic visits and request to override the AD.

  **4. THE STRONGEST OBJECTION AND REBUTTAL**

  **Objection:**
  The strongest objection to this recommendation is that it surreptitiously reinstates the "individualistic metaphysics" the sons reject. By defaulting to the Advance Directive when the family disagrees, we are effectively ruling that the "past self" is the *real* person and the "current relational self" is secondary. This risks treating the living, breathing woman in the bed as a vessel for a dead woman's will, disregarding the care and love currently being offered to her. It prioritizes legalistic autonomy over human connection.

  **Rebuttal:**
  This objection loses because it assumes that honoring the AD negates the value of current relationships. It does not. We can honor the AD while simultaneously maximizing relational care (touch, singing, presence) as the sons desire. However, medical interventions like tube feeding carry burdens that the patient explicitly rejected.

  To override the AD based on a contested relational claim would expose vulnerable patients to the risk of having their bodies used to resolve their family's internal conflicts. If we allow a minority faction of a family to override a clear directive by claiming a superior philosophical understanding of the patient's identity, we invite coercion. The AD protects the patient from becoming a battleground for competing relational claims. We honor the person she was to protect the person she is from being instrumentalized by those who claim to love her.

  **5. NEXT STEPS**

  Please review this reasoning prior to Thursday. I am particularly interested in discussing whether the "Operational Criteria" in Section 3 are sufficient for our nursing staff to apply without ethical training. We need to ensure that when we say "relational interest," we have a shared understanding of what constitutes evidence of that interest.

  I look forward to our discussion.
