prompt: |-
  I chair the clinical ethics committee of a large public hospital, and we have a case on Thursday that we expect to set precedent, so I want the written opinion argued at the level of principle rather than settled by intuition.

  Ms. A. is 79 and has advanced dementia. She no longer recognises her children, speaks little and not coherently, shows no signs of distress, and is fed by hand by nursing staff. She has now developed dysphagia with recurrent aspiration, and her team puts two options to us: place a feeding tube, or continue careful hand feeding while accepting a high risk of aspiration pneumonia and manage comfort thereafter. Nine years ago, while cognitively intact, she signed an advance directive refusing tube feeding and any further hospital admission. Her two sons ask us to set it aside. Their argument, as they put it, is that their mother is not the person who signed that paper. On their account a person is constituted by her relationships and not by the private, temporally extended will of a single biological organism; the person in the bed today is the person their family sustains, someone who responds to being fed by hand, to touch, to being sung to, and whose personhood they enact by continuing to feed her. They accept the consequence that the document is not merely outdated but was never the right sort of thing to bind her. Her daughter disagrees and asks that the directive be honoured. Two further facts complicate things. The sons have visited a handful of times in the last two years while the daughter has been present most days, so the family that claims to speak for her relational self is itself divided about who belongs to it. And several staff have said privately that the relational argument strikes them as a philosophical veneer over the sons' own interest in keeping their mother alive, while other members of our committee think our own default — that the earlier autonomous individual is the one whose word goes — assumes exactly the individualistic metaphysics the sons reject, and is therefore not the neutral position either.

  Please draft the decision memo I will circulate before the meeting. It should (i) recommend a concrete course of action with a time frame and a review point, not just a framework; (ii) engage the sons' position on its own terms, including the possibility that if relational personhood is right it undermines the standard justification for advance directives rather than merely adding a cultural exemption to it; (iii) give our staff criteria they could actually apply next time to tell a family speaking for a genuinely relational interest from a family pursuing its own, given that families are rarely unanimous and that the intensity of a relative's involvement seems relevant in a way our current policy has no vocabulary for; and (iv) state the strongest objection to whatever you recommend, and why it loses. Two constraints on form: no citations, no literature review, no discussion of which philosophers have defended which view — I need a document the committee could adopt; and the reasoning should not turn on this family's cultural or religious identity, since a large share of the families at this hospital could make the same kind of claim and I want the policy to generalise to any of them.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a Clinical Ethics Committee (CEC) at a large public hospital.
      *   **Task:** Draft a decision memo to circulate *before* the meeting (Thursday).
      *   **Case:** Ms. A, 79, advanced dementia, dysphagia, recurrent aspiration. Options: Feeding tube vs. Comfort hand-feeding.
      *   **Conflict:**
          *   Advance Directive (AD): Signed 9 years ago, refuses tube feeding/hospitalization.
          *   Sons: Want AD set aside. Argument: Relational Personhood (Mother now is defined by current relationships/care, not past autonomous self).
          *   Daughter: Wants AD honored. Present daily vs. Sons' handful of visits.
          *   Staff Concerns: Sons' argument might be a veneer for their own interests/guilt. Committee Concern: Defaulting to AD assumes individualistic metaphysics.
      *   **Requirements:**
          1.  Recommend a concrete course of action (time frame, review point).
          2.  Engage the sons' "relational personhood" argument on its own terms (not just as an exemption).
          3.  Provide staff criteria to distinguish genuine relational interest from self-interest (handling family division/intensity of involvement).
          4.  State the strongest objection to the recommendation and why it loses.
      *   **Constraints:** No citations, no literature review, no philosopher names. Generalizable policy (not culture/religion specific). Professional tone suitable for adoption.

  2.  **Determine the Ethical Stance/Recommendation:**

      *   *The Dilemma:* Autonomy (AD) vs. Best Interest/Relational Identity (Sons) vs. Current Well-being (Comfort).
      *   *The "Relational" Argument:* If personhood is constituted by current relationships, the past self's directive loses absolute authority. However, if *any* family member can claim this, it leads to chaos and potential abuse.
      *   *The Reality:* Tube feeding in advanced dementia generally does not prolong life meaningfully, increases discomfort, and contradicts the AD. Hand feeding is the standard palliative approach.
      *   *The Compromise:* We cannot fully accept the sons' metaphysical claim to override the AD without safeguards, but we must acknowledge the validity of relational concerns in *how* care is delivered. However, the medical indication for a PEG tube in advanced dementia with aspiration is weak/non-existent regardless of the AD.
      *   *Decision:* Do not place the tube. Continue careful hand feeding. This aligns with the AD, medical best practice, and comfort.
      *   *Addressing the Sons:* Acknowledge their view but clarify that "relational personhood" does not grant veto power over medical futility or prior expressed wishes unless the *current* relational network agrees. Since the network (daughter) is divided, the prior directive stands as the most reliable evidence of the patient's values, *but* the care plan must actively incorporate the relational aspects the sons value (touch, singing, presence).
      *   *Policy Implication:* We need criteria for "Relational Authority."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose (precedent-setting case regarding ADs and relational personhood).
      *   **Recommendation (Req i):** Concrete action. No tube. Hand feeding. Comfort focus. Review in 7 days or upon change in status.
      *   **Ethical Analysis - The Relational Claim (Req ii):**
          *   Take the sons' argument seriously. If personhood is relational, the AD isn't binding *by default*.
          *   *Counter:* Relational personhood requires a *sustained* relationship. The "self" is constituted by the care network.
          *   *Resolution:* The network is fractured (Daughter vs. Sons). When the relational network disagrees, we cannot privilege the minority view (Sons) over the majority/participant view (Daughter) + the prior autonomous voice. The AD remains the best proxy for the *patient's* values until the relational network achieves consensus.
      *   **Operational Criteria for Staff (Req iii):**
          *   How to tell genuine relational interest from self-interest?
          *   Criteria: Consistency of presence, alignment with patient's known non-verbal cues, consensus within the care network, willingness to share care burden.
          *   "Intensity of involvement" matters. The daughter's daily presence weighs heavier than sons' occasional visits in defining the *current* relational self.
      *   **Strongest Objection & Rebuttal (Req iv):**
          *   *Objection:* This privileges the "past self" (individualism) and marginalizes the family's role in constituting the patient's identity now. It treats the AD as a trump card.
          *   *Rebuttal:* In the absence of relational consensus, the AD is the only objective anchor. Privileging the sons' view risks imposing *their* identity onto her. Protecting the vulnerable patient from conflicting family demands requires a default, and the AD is the least harmful default when medical benefit is equivocal.
      *   **Generalizability:** Ensure language applies to any family, not just this culture.

  4.  **Refining the Tone:**

      *   Must be authoritative but open to debate (it's a pre-meeting memo).
      *   Avoid academic jargon ("metaphysics," "constituted"). Use plain ethical language.
      *   Ensure the medical reality (PEG tubes in dementia) doesn't get lost in the philosophy. The medical indication is weak, which supports the decision not to tube regardless of the AD. *Self-Correction:* The prompt asks to argue at the level of principle. I must ensure the philosophical argument carries the weight, not just "tubes don't work." The decision should rest on the ethical weight of the AD vs. Relational Claim.

  5.  **Drafting - Specific Considerations:**

      *   *Req ii (Relational Personhood):* I need to admit that if they are right, the AD loses force. But I need to show why, *even if* they are right, their specific claim fails here. Why? Because the "relation" is disputed. You can't claim to constitute someone's personhood if other key constitutive members (the daughter) disagree.
      *   *Req iii (Criteria):* Need concrete metrics. Frequency of visit? Participation in care? Consistency with patient's reaction?
      *   *Req iv (Objection):* The objection should be the "Individualist Tyranny" argument. The rebuttal should be "Protection of the Vulnerable."

  6.  **Review against Constraints:**

      *   No citations? Check.
      *   No philosopher names? Check.
      *   Concrete recommendation? Check (No PEG, hand feed, review 7 days).
      *   Generalizable? Check (Focus on "care network" not culture).

  7.  **Final Polish:**

      *   Make sure the distinction between "Relational Personhood" as a theory and "Family Disagreement" as a practical hurdle is clear.
      *   Ensure the staff criteria are actionable.
      *   Check the tone: Chair to Committee.

  *(Self-Correction during drafting)*: I initially thought about suggesting a trial of the tube. No, that violates the AD and medical best practice. The recommendation must be definitive on the tube, but open on the care *process*.
  *(Refining the Relational Argument)*: I need to be careful not to dismiss the sons' philosophy as wrong, but rather as *incomplete* in this context. A relational self requires a coherent community. A divided community cannot override a clear prior directive.

  8.  **Finalizing the Document Structure:**
      *   To/From/Date/Subject.
      *   Executive Summary/Recommendation.
      *   Ethical Analysis (The Relational Challenge).
      *   Operational Guidelines (Assessing Relational Authority).
      *   Dissent/Objection Handling.
      *   Next Steps.

