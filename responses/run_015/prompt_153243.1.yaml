answer: |-
  Here are ten interview questions designed for your podcast project. They are structured to sound conversational but press on the specific philosophical weak points you requested. Each question includes a follow-up keyed to the answer your guest is most likely to give based on the Taurek literature.

  ### 1. The "Obviousness" of Saving the Greater Number
  **Question:** Most people have a very strong intuition that if you can save five people or one person, and that's the only choice, you *must* save the five. It feels almost mathematical. You argue that the numbers shouldn't count. Can you walk us through why that "five is better than one" intuition is actually a mistake? What are we missing when we think it's obvious?

  **Follow-up:** I imagine you'd say something like, "We can't add up individual losses into one big social loss." But even if we can't sum the harm, isn't there still a "balance of complaints"? You have five people screaming "Save me!" and only one person screaming "Save me!" Doesn't the sheer weight of five distinct complaints give us *some* reason, even if it's not a summed total, to favor the group?

  ### 2. The Coin Flip: Required or Just Allowed?
  **Question:** If the numbers don't matter, how should we actually decide? Some interpreters of your view say we are *required* to flip a coin to give everyone an equal chance. Others say flipping a coin is just *permitted*, but you could also just choose the one person if you wanted to. Where do you stand? Is the coin flip a moral duty?

  **Follow-up:** Let's say you take the softer line that it's only *permitted* to flip a coin, not required. If I choose to save the single person without flipping, aren't I basically treating the five strangers as if they don't exist? If I'm not required to give them a 50/50 shot, what protects them from being completely disregarded?

  ### 3. Special Relationships (Friend vs. Strangers)
  **Question:** Let's bring in personal relationships. Suppose the one person is your best friend, and the five are strangers. Most people would say you're allowed to save your friend. Does your view support this? Is it because the numbers don't count, or is it because special relationships override the numbers?

  **Follow-up:** Okay, but let's turn up the volume on the numbers. If it's your best friend versus *five thousand* strangers, does the special relationship still do all the work? At some point, does the sheer number of strangers outweigh your personal tie, or does your view imply you could save your friend even if the rest of the town was at risk?

  ### 4. The Clone Hypothetical
  **Question:** My TA came up with this case: Suppose the five people are actually exact clones of one guy—same memories, same personality, same everything up until the accident—and the one person is the "original." Intuitively, saving the original feels like saving the "real" person. Does your view say it's okay to save the original over the five clones? It feels like a *reductio* to say the clones don't matter just because they are copies.

  **Follow-up:** I suspect you'll say that each clone is still a separate subject of experience, so they each have their own life to lose. But if their internal lives are identical, isn't the "value" of what is lost the same? If we aren't aggregating harm, are we really respecting the separateness of persons here, or are we just ignoring that the clones share a single biographical value?

  ### 5. Ex-Ante Fairness vs. Ex-Post Outcomes
  **Question:** A lot of critics argue that even if we can't compare the *outcome* of five deaths versus one, we should care about *fairness* before the decision is made. If you don't save the greater number, aren't you failing to minimize the *risk* each individual faced before the accident happened?

  **Follow-up:** If you say we shouldn't worry about minimizing risk, consider a policy where we always save the one person. That means every individual in society knows their chance of rescue drops drastically if they are in a group. Isn't that a system no rational person would agree to join, even if they agree with your ethics?

  ### 6. Is Death the Same Loss for Everyone?
  **Question:** Your argument relies heavily on the idea that death is a comparable loss for each individual. But what if the one person is a young child with their whole life ahead, and the five are elderly people who have lived full lives? Do the numbers count then, or is death still an incomparable loss for each person regardless of age?

  **Follow-up:** If you say age doesn't matter and death is the same loss for everyone, you're treating life as a binary: you have it or you don't. But doesn't this ignore the "future-oriented" interests that philosophers like Parfit talk about? If the child loses more *future*, aren't we implicitly aggregating that lost future time?

  ### 7. Public Policy vs. Private Morality
  **Question:** Let's move from a trolley problem to a hospital. Should a public hospital triage protocol actually use your view? If a doctor has one dose of medicine and five patients need it, can the doctor ethically give it to just one patient based on your framework?

  **Follow-up:** If you say a private individual can choose the one, but a public doctor can't, aren't you admitting that the numbers *do* count when we are acting as officials? What makes the doctor's role different? Is it just that they represent the state, or is there a moral difference in how institutions handle scarce resources?

  ### 8. Responsibility for the Deaths
  **Question:** When you choose to save the one, the five others die. Critics like Frances Kamm argue that by not saving the five, you are in some way responsible for their deaths in a way you aren't if you save the five. Do you accept responsibility for the deaths of the five, or do you see their deaths as just "bad luck" that you didn't cause?

  **Follow-up:** If you say it's just bad luck and you aren't responsible, consider this: You had the power to prevent five deaths and chose not to use it. If I walk past a drowning child when I could save them, I'm blameworthy. Why does having five drowning children change my blameworthiness to zero if I save only one?

  ### 9. The "Tie-Breaker" Intuition
  **Question:** If the numbers truly don't count, why do so many people feel that the five should at least be a "tie-breaker"? Like, if everything else is equal, the five should win. Why is your view so radical that it says the five don't even get that slight nod?

  **Follow-up:** If you reject the tie-breaker, it seems like you're saying the five have *no* more moral weight than the one. But if I asked you to justify your choice to the five families, saying "The numbers didn't matter" sounds like an insult. Is there any language you can use to explain your decision that respects their loss without admitting you should have saved them?

  ### 10. Consistency with Other Aggregative Views
  **Question:** Finally, do you reject aggregation in *all* cases? For example, if we are deciding on tax policy, we often say "It's a small cost for millions of people to pay so one person doesn't starve." That's adding up small harms to prevent a big one. Is your view consistent with that, or does it only apply to life-and-death cases?

  **Follow-up:** If you say it only applies to life-and-death, what's the relevant difference? Is it that death is absolute while money is partial? Because if you allow aggregation for money but not life, it sounds like you're saying life is *less* comparable than money, which seems counterintuitive. Where is the line drawn?
