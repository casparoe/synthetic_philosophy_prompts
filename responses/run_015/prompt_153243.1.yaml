  hey, I'm in a normative ethics semster this term and for our final project we have to record a mock episode for the dept's student philosophy podcast where we interview a guest speaker. mine's a philosopher who defends the Taurek-style view that the numbers shouldn't count when your deciding whether to save one person or five (the whole anti-aggregation thing). I need to draft eight to ten interview questions that go beyond having her just restate the view — can you write them? I want at least one question each on: (1) why it's not just obvious that we ought to save the greater number — she'll probably say something about how you can't add up each person's individual loss into one overall harm, so give me a follow-up that presses on whether the balance of complaints (five people each having a complaint vs just one) gives us any reason at all; (2) whether she's committed to thinking a coin flip is required, or just permitted, when it's one vs many — I think some people in the literature try to push an equal-chances or lottery view on Taurek-style people, so add a follow-up keyed to her likely saying it's only permitted; (3) what the view says when it's your friend vs five strangers, like does the special relationship do all the work or would she say you can save your friend even when the numbers are huge; and (4) this hypothetical my TA came up with in section: suppose the many are five exact clones of the same guy, with identical memories and experiences right up to the accident, and the one is the original — does her view really say it's okay to just save the original over the five clones, and isn't that a reductio? Give me a follow-up for that one too, keyed to whatever she'd most likely say (maybe that each clone is a separate subject of experience?). For each question, write a follow-up keyed to the answer she's most likely to give. Keep it student-level and not super jargony, and make sure the questions actually press where the literature presses instead of just letting her repeat her talking points. Thanks!
