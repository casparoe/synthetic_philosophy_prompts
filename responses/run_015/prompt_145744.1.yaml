answer: |-
  Here is a reconstruction of the committee's internal logic, the divergence points in the current case, and a prediction of the outcome based on institutional self-preservation masquerading as consistency.

  ### I. The Latent Rules of the Committee
  Based on the five precedents, three rules emerge that explain the track record without contradicting it.

  **1. The "Vitiated Consent" Standard (The Acquisition Rule)**
  *   **Formulation:** Title is defeasible if the original transfer occurred under structural coercion, duress, or willful blindness to such conditions. If the transfer was commercially clean or legally authorized at the time, title holds.
  *   **Fit:** Explains **(1)** (sacking = coercion), **(5)** (military pressure = duress), and the **Current Case** (campaign aftermath + curator's blindness = willful ignorance of coercion). Explains **(2)** (permission = valid consent) and **(4)** (commercial license = valid consent).
  *   **Exception:** **(3)** operates outside this rule entirely (remains are inalienable regardless of consent).

  **2. The "Sovereign Default" Standard (The Recipient Rule)**
  *   **Formulation:** For movable cultural property, the presumptive recipient is the successor State's heritage authority. Direct restitution to non-state communities is reserved for human remains or where the State is demonstrably unable/unwilling to act as a custodian.
  *   **Fit:** Explains **(1)** (State authority), **(4)** (State export license validates State authority), and **(5)** (State-chartered trust). Explains why **(2)** was kept (State permission validated the removal).
  *   **Exception:** **(3)** (Descendant community bypasses State).

  **3. The "Public Trust" Standard (The Conditions Rule)**
  *   **Formulation:** Returned objects must remain in the public sphere (displayable, study-able) unless they fall under the "human remains" exception. Conservation and access guarantees are prerequisites for restitution.
  *   **Fit:** Explains **(1)** (guarantees required), **(2)** (loan offered to maintain access), **(4)** (rejection implies museum's public role is superior).
  *   **Exception:** **(3)** (Reburial/no study accepted). **(5)** is silent, but the "Trust" structure implies some community control, though likely less than P3.

  ### II. Where the Rules Come Apart
  The current case creates a collision between **Rule 2 (Sovereign Default)** and the Royal House's claim, and between **Rule 3 (Public Trust)** and the Royal House's conditions (veiling/no photos).

  *   **The Acquisition Question:** The Curator's letter is the pivot. Under **Rule 1**, this is not a "clean commercial transaction" (like P4) nor a "lawful removal" (like P2). It is functionally identical to **P5** (invalid consent due to context). The committee *should* find the title defeasible.
  *   **The Recipient Question:** **Rule 2** points to the State Authority. However, **P5** used a "community trust chartered by the successor state." The Royal House is not the State, but the objects are regalia of an office, not general artifacts. If they follow **P1**, the State wins. If they follow the logic of **P3** (deference to community norms regarding sacred items) applied to objects, the Royal House wins.
  *   **The Conditions Question:** **Rule 3** demands public access (P1). The Royal House demands restricted access (P3). The committee has explicitly stated P3 is a "separate track." Applying P3 norms to P1-type objects would collapse the distinction between remains and artifacts, creating a precedent that could empty the galleries of sacred objects.

  ### III. The Closer Analog
  **Precedent (5) is the legal analog; Precedent (1) is the typological analog.**

  *   **Why P5:** The decisive factor in the current case is not the sacking itself (which is circumstantial for these specific objects) but the **Curator's Letter**. This evidences *mens rea* regarding the tainted context. Like P5, the transfer was not "theft" in a criminal sense, but the consent was not free/informed. This triggers the restitution mechanism of P5, not the "spoils of war" mechanism of P1.
  *   **Why P1:** The objects are regalia/artifacts, not remains. The committee treats these as state-level heritage, not inalienable spiritual entities.

  ### IV. Prediction: The Decision They Will Reach
  If the committee wishes to maintain institutional consistency while minimizing risk, they will reach the following decision:

  1.  **Title/Status:** **Permanent Loan / Custodial Transfer.**
      *   *Reasoning:* They cannot easily "dispose" of title due to the statute (as you noted). They will replicate the legal fiction used in **P2** (long-term loan) but make it irreversible in practice. This "dresses up" the return as a curatorial partnership rather than a legal admission of defective title, protecting them from future claims on other objects bought at Antwerp auctions.
  2.  **Recipient:** **The State Heritage Authority.**
      *   *Reasoning:* Consistency with **P1** and **P2**. Dealing with a sovereign authority provides diplomatic cover and ensures a single point of accountability. Dealing with a Royal House (private/religious) sets a precedent that complicates **P4** (commercial transactions) and **P2** (state permissions). They will likely require the State to sign a memorandum acknowledging the Royal House's *spiritual* interest, but legal custody will vest in the State.
  3.  **Conditions:** **Public Access Guaranteed; Ritual Accommodation "Noted."**
      *   *Reasoning:* They will reject the formal condition of "veiling/no photography" as it violates **Rule 3 (Public Trust)**. However, they will accept a side agreement that the State Authority will "facilitate ritual access" for the Royal House. This allows the museum to claim it upheld public access standards (P1) while quietly acknowledging the P5/P3 ethical imperative.

  **The Single Best Guess:**
  The committee will rule that the **acquisition context vitiates the museum's moral title (P5 logic)**, but that **legal and practical custody must reside with the State (P1/P2 logic)** to ensure conservation and public access. They will effect this via a **"Indefinite Renewable Loan"** to the National Museum, with a non-binding clause encouraging cooperation with the Royal House. This preserves the distinction between objects and remains (keeping P3 isolated) and avoids validating the Royal House's claim that a museum *cannot* own regalia.

  ### V. Underdetermination and Live Options
  The precedents **do underdetermine** the conflict between the State and the Royal House.
  *   **Option A (State Priority):** Adopts the principle that *international heritage law supersedes indigenous property norms for objects.* (Risk: Accusations of neo-colonialism).
  *   **Option B (Community Priority):** Adopts the principle that *sacred function overrides public access.* (Risk: Collapses the P1/P3 distinction; invites claims on all religious art).
  *   **Option C (Regional Compromise):** Adopts the principle that *proximity and existing custody trump national claims.* (Risk: Undermines the "Successor State" model used in P1 and P5).

  If they choose Option B, they are secretly overruling P1. If they choose Option A, they are ignoring the specific "regalia" nature of the objects acknowledged in P5.

  ### VI. Interview Strategy
  To expose the actual rule they are running (vs. the one they claim), you need to test the boundary between "Objects" and "Remains" and the weight of the Curator's Letter.

  **1. The Hypothetical Further Claim:**
  > "Suppose a community claims a wooden fetish figure acquired in the 1920s. They state that the figure was never meant to be seen by the uninitiated and that its continued existence in a museum is actively harming the community's spiritual health. They request not return, but **ritual destruction** of the object in situ. Does your committee view this as a 'human remains' issue (P3), a 'sacred object' issue (Current Case), or a 'destruction of property' issue (P4)?"
  *   *Why:* This forces them to define where the "separate track" for remains ends and the "public trust" for objects begins. If they allow destruction, P3 has swallowed P1. If they refuse, their deference to community norms in the Current Case is revealed as performative.

  **2. The Direct Question:**
  > "In Precedent 5, you ruled that consent under military pressure was invalid. In this current case, the Curator's letter suggests he *suspected* the objects were proceeds of that pressure but chose not to record it. Does **willful blindness** to the colonial context satisfy the 'lawful at the time' standard of Precedent 2, or does it meet the 'invalid consent' standard of Precedent 5?"
  *   *Why:* This cuts through the "sui generis" fog. It forces them to admit whether their restitution program is based on *legal title* (P2/P4) or *ethical provenance* (P5/Current). If they say it's "lawful at the time" despite the letter, they admit the ethics are secondary to the law. If they say "invalid consent," they admit that *mens rea* matters more than the bill of sale.
