  1. A mark out of 25, broken down by part — the split announced to the class was (a) 8, (b) 5, (c) 6, (d) 6 — with a one-line reason for each part's mark.
  2. Point-by-point comments, each quoting the specific line or step you are responding to and saying what is right or wrong about it and what it costs. These should be pasteable into the margin of a script: concrete and diagnostic, not impressionistic. Assess the answer as it stands; do not rewrite it.
  3. A short paragraph at the top — four or five sentences — giving the student the verdict and the two or three things most worth their attention.
  4. A confidence tag on each substantive comment: certain, probable, or genuinely contested. Where a step could be read either as a slip or as a defensible alternative reading, say which reading you are assuming and how much of the mark turns on it. I want a grading I can audit rather than a smooth one.
  5. If you think the question as set is ambiguous, or rests on a confusion, or that some move I would probably mark down is actually defensible, put it in a separate section headed Disagreements and argue for it plainly. Do not quietly grade to what you take my expectations to be: I would much rather be told I set a bad question than hand back a verdict I cannot defend.
