prompt: |-
  I'm doing a 45 minute session on Goodman's new riddle of induction for a pub philosophy group — smart adults, no philosophy, maybe two of them have heard of Hume by name. I dont want the explanation, I want the plan for it. Three things I'm stuck on. One: ordering. Do they need Hume's version of the problem first, or can grue be made to bite cold, and does leading with Hume just make them file the riddle as scepticism-again? Second, the example. Everyone uses emeralds, but I think emeralds invite the misreading that grue things change colour at the crucial date, so I was going to run a predicate keyed to whether a thing has ever been observed rather than to a date — green if examined, blue if never examined — and pair it with some practical case where the stakes aren't colours (bridge cables? a drug trial?). Does that pairing work, or does the stakes case muddy what's supposed to be a point about confirmation? Third: the misconceptions to expect and where in the sequence to defuse each. I'm guessing 'it's just a trick with words', 'green is simpler, done', 'a Bayesian prior sorts it out', and 'just wait for more data'. Tell me which of those actually show up and at what point in the arc, whether to give them the word projectible at all and if so when, and one question at the end that would really show it landed — I was thinking of asking them to cook up their own grue style rival to 'all copper conducts electricity', but maybe that only tests mimicry. Also say what I should flat out refuse to get into at this level.
