answer: |-
  Here is the reconstruction you asked for. I am not going to survey the options; I am going to commit to the single theory that best explains the actual machinery, contradictions and all.

  ### The Reconstruction: Status-Based Civic Membership

  The global patchwork does not presuppose that voting is a tool to maximize welfare (affected interests), nor that it is a shield against state violence (coercion). It presupposes that voting is a **incident of legal status within a bounded political community.**

  Call this the **"Status-Based Civic Membership"** theory.

  Under this theory, the vote is not a right you hold against the state, nor a tool to fix policy outcomes. It is a **function of office.** You are a "member" of the corporation that is the State. When you vote, you are exercising a managerial duty over that corporation.

  **Why this fits the mess:**
  1.  **Citizenship/Residency:** This defines the boundary of the corporation. NZ and UK exceptions (Commonwealth/Permanent Residents) aren't contradictions; they are simply expanded definitions of "membership" based on historical treaties or long-term leaseholding (residency).
  2.  **Age (16 vs 18 vs 25):** This is not about "competence" in a cognitive sense (or we would test IQ). It is about **legal capacity.** Just as you cannot sign a contract or drink alcohol until a certain age, you cannot hold "office" in the state until you reach the age of majority. The variation (16 vs 18) is cultural calibration of when "legal adulthood" begins, not a scientific measure of rationality.
  3.  **Expats:** This is the strongest evidence for this theory. If voting were about *affected interests* or *coercion*, expats would lose the vote. They don't. They keep it because their **status** as members persists regardless of geography. They are shareholders who moved away but didn't sell their shares.
  4.  **Prisoners:** In jurisdictions that disenfranchise prisoners, the logic is **forfeiture of status.** You breached the social contract so severely you are temporarily expelled from the "member" class. In jurisdictions that allow it, the view is that status is inalienable. Both views fit within a debate about the nature of membership, whereas neither fits "affected interests" (prisoners are highly affected by laws).
  5.  **Compulsion:** If voting is a right, compulsion is tyranny. If voting is a **duty of membership** (like jury duty or paying taxes), compulsion is logical. Australia's "show up but don't have to vote" rule confirms this: the duty is to *participate in the ritual of legitimacy*, not to dictate the outcome.

  ### Required vs. Comfortable

  *   **Strictly Required:** A clear, binary boundary for membership (citizenship or formal residency) and a bright-line age threshold. The system *cannot* function on "affected interests" because impact is a spectrum, and administration requires a binary (vote/no vote).
  *   **Merely Comfortable:** Compulsory voting. It fits the theory perfectly, but the theory survives without it (e.g., the US). Non-citizen voting is also "comfortable" but not required; it just expands the definition of membership.
  *   **Inconsistent:** The prisoner rule. It is the only place where the system wavers on whether status is inalienable or forfeitable.

  ### Compulsion: Duty vs. Right

  You asked if compulsory voting commits you to something extra. **Yes.** It commits you to the **Republican** conception of liberty rather than the **Liberal** one.

  *   **Liberal View:** Voting is a private right (like free speech). You can waive it. Compulsion violates autonomy.
  *   **Republican View:** Voting is a public function (like jury duty). It constitutes the legitimacy of the state. Abstention degrades the system.

  The Australian model (compel attendance, not valid vote) is the philosophical compromise. It acknowledges the **Duty of Presence** (you must acknowledge the state's authority) without violating the **Freedom of Conscience** (you can spoil the ballot). This confirms the "Status" theory: you must show up to roll call, but the state cannot force your mind.

  ### The "Children and Future Generations" Trap

  This is the crux of your final question. If "affected interests" were the logic, parents should have proxy votes, and we should have representatives for the unborn. We don't.

  **What this tells us:** The system explicitly rejects "affected interests" as the primary legitimizing principle. It prioritizes **Agency.**

  The logic is: *To hold a share in the management of the state, you must be capable of bearing the responsibility of that management.* Children are affected by everything, but they lack legal agency. Future generations do not exist to hold agency.

  If the practice's logic committed us to proxy votes and we rejected them, it would mean the system is hypocritical. But the system *doesn't* commit us to that. The system's logic is **Membership + Agency.** Since children lack legal agency, they are members-in-waiting. The fact that everyone rejects proxy votes confirms that **Voting is not about Impact; it is about Authority.** We do not give authority to those who cannot be held accountable for the decision (children) or who do not exist (future generations).

  ### The Single Hardest Rule to Defend

  **Indefinite Expatriate Franchise.**

  Many countries (including the US, UK, France) allow citizens to vote in national elections forever, even if they left as children, pay no taxes, and never return.

  *   **Why it's indefensible:** It violates every principle *except* "blood-based membership."
      *   **Coercion:** They are not subject to the daily coercion of the laws they shape.
      *   **Affected Interests:** Their daily lives are determined by another state.
      *   **Contribution:** They often pay no taxes.
      *   **Competence:** They may lack current knowledge of the local context.
  *   **Why it exists:** It is a relic of the **Allegiance** model. The state claims you forever. It is the strongest proof that the system is about *tribal belonging*, not *democratic function*. It allows diasporas to dictate outcomes for people who actually live with the consequences. It is the most glaring violation of the "no taxation without representation" inverse ("representation without taxation or coercion").

  ### Confidence and Falsification

  **Confidence:**
  *   **High:** That the system is Status-Based, not Consequence-Based. The expat and age rules prove this.
  *   **Medium:** That compulsion implies a Republican duty. (Some argue it's just about turnout stability).
  *   **High:** That "Affected Interests" is not the operating logic. (The exclusion of children proves this).

  **What Would Change My Mind:**
  1.  **Competence Testing:** If a major democracy introduced a civic literacy test for voting that wasn't immediately struck down as unconstitutional/racist, it would suggest "Competence" is actually the driver, not "Status."
  2.  **Stakeholder Voting:** If a country adopted **proxy votes for parents** (e.g., the "Demeny voting" system) and it became the norm, it would prove that "Affected Interests" is superseding "Agency."
  3.  **Residency-Only Voting:** If the EU or US moved to a strict "you must live here to vote" rule, stripping expats of rights, it would signal a shift from the "Allegiance/Status" model to a "Coercion/Impact" model.

  **Summary:** The mess isn't random. It is a **Status-Based** system wearing **Liberal** clothing. It claims to be about rights and interests, but it operates on membership and agency. The contradictions arise when we try to justify tribal boundaries (who belongs) with universalist language (who is affected).
