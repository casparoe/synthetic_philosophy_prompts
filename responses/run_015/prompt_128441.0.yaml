  You are a lead engineer seeking final sign-off from an automated compliance bot (the Predictor) that grants production access only to services it predicts will undergo a costly "Dual-Write Migration" protocol. Once sign-off is granted, executing the migration causally prevents data corruption during the transition, making it instrumentally necessary for technical success. However, historical telemetry reveals that only engineers managing fragile, undocumented legacy systems voluntarily trigger this protocol, whereas those with robust systems bypass it safely. Executing the protocol causally secures data integrity (favoring CDT), but choosing to execute it is strong statistical evidence that your underlying system is fragile and prone to catastrophic failure regardless of the migration (favoring EDT).

  **CDT Verdict:** Causal Decision Theory endorses the commitment. Since the bot's prediction and sign-off are past events, they are causally independent of your current choice. CDT evaluates only the causal consequences of the action itself: performing the migration costs time but causally prevents data corruption. Because the causal benefit (preventing corruption) outweighs the tangible cost (delay), CDT recommends executing the protocol.

  **EDT Verdict:** Evidential Decision Theory rejects the commitment. EDT evaluates actions based on the news they bring about the world. Choosing to execute the migration is strong evidence that the system belongs to the "fragile legacy" class. Since systems in this class tend to fail catastrophically regardless of the migration due to hidden architectural flaws, the action signals a high probability of failure. The bad news conveyed by the action outweighs the causal benefit, so EDT recommends skipping the protocol to avoid confirming the high-risk state.

  **Driving Feature:** The reversal is driven by a **common cause structure** (akin to the Smoking Lesion problem). The hidden state of the codebase (fragile vs. robust) causes both the likelihood of choosing the commitment and the likelihood of project failure. This decouples causal efficacy (the migration helps) from evidential import (choosing the migration signals fragility), creating a divergence where the action is causally good but evidentially bad.

  **EDT Attack:** An evidential decision theorist would attack the case by arguing that rational agents should maximize expected utility conditional on their actions, not just causal impacts. They would contend that ignoring the statistical correlation between the commitment and system fragility is irrational because the correlation reflects a real constraint on success; by acting in a way that correlates with failure, you effectively align yourself with the losing outcome, regardless of the direct causal mechanism.
