answer: |-
  The Millerite episode serves as a stress test for the naturalistic framework, specifically highlighting the tension between Propositional Currency and Commitment Currency. Before October 22, 1844, the movement's signal strength derived from the falsifiability of its core claim. Predicting a specific date was a high-risk credibility-enhancing display; only those truly committed would stake reputations on a calendar event. This aligns with the signaling lens: the cost of being wrong bound the group together. However, the Great Disappointment shattered the Propositional Currency. The core question is whether the subsequent re-denomination—shifting the event from earth to heaven—destroyed the signal's value by making it unfalsifiable, or whether it allowed Commitment Currency to dominate.

  On the morning of October 23, the actors faced divergent option sets with distinct payoffs. William Miller and the itinerant preachers had invested livelihoods and theological capital. Their options were to walk away (admitting error and losing status), re-date (risking further credibility loss), or re-denominate (shifting the event to a spiritual plane to preserve authority). Ordinary followers had invested social standing and, in some cases, material property. Their options were to return to old congregations (accepting shame and sunk costs), double down on a new date, or accept the heavenly sanctuary interpretation. Critics and established churches held the option to vindicate orthodoxy. For preachers, the payoff in Commitment Currency required maintaining authority; for followers, it required justifying sunk costs. Walking away was high-cost for leaders due to lost livelihood, but high-cost for followers due to social stigma. Re-denomination offered a path to preserve group identity without immediate falsification.

  The signaling lens explains the cohesion prior to the failure and the selection pressure afterward. It predicts that groups surviving the disconfirmation must generate new costly signals to replace the lost propositional value. The Seventh-day Adventists survived not merely because they re-denominated the claim, but because the new theology demanded new costly behaviors, such as Sabbath keeping and dietary restrictions. This restores the signal's value. The lens misses the internal psychological mechanism of how individuals reconcile the contradiction; that is the domain of cognitive dissonance. It is also silent on why specific theological content emerges, such as why a heavenly sanctuary rather than a spiritual return was selected. These content choices may depend on historical contingencies the signaling model does not address.

  Regarding re-denomination, the teacher's puzzle asks if making a claim unfalsifiable destroys the signal. The answer is nuanced. An unfalsifiable claim alone is cheap talk. However, maintaining an unfalsifiable claim in the face of ridicule is costly. Thus, re-denomination rescues the signal only if it imposes new behavioral costs. In this case, Commitment Currency dominates Propositional Currency post-failure. The propositional claim became irrelevant to truth, but vital to group boundary maintenance. Cognitive dissonance explains the motivation to re-denominate, but signaling explains the success of the groups that added new costs versus those that did not. This case confirms the naturalistic approach but refines the signaling model. It is not an anomaly; it shows signaling dynamics adapting to information shocks. My confidence is high that commitment costs drive survival, but lower on the specific extent of material sacrifice by followers. I would change my mind if evidence showed surviving groups imposed no new behavioral costs. The reasoning fails if the costs were negligible. I must flag the extent of property abandonment as uncertain.

