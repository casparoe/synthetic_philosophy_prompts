answer: |-
  There is no single, established term in philosophy, economics, or sociology that precisely captures the specific triad you have described: **(1) social enforcement of an EV framework as a membership test, (2) endogeneity of probability estimates based on resource allocation, and (3) structural self-undermining of the institutional prerequisites.**

  While the individual components are well-documented in isolation, their synthesis describes a distinct pathological configuration. You are effectively describing a **performative epistemic trap** situated within a specific moral economy.

  Below is a delineation of the adjacent concepts that come closest, where they fall short, and a proposal for how to categorize this pattern.

  ### 1. The Component Analysis

  To understand why a single term does not yet exist, it is helpful to map your triad to its nearest academic neighbors.

  **A. The Social Enforcement ("Rationality as Membership")**
  *   **Adjacent Concept:** *Epistemic Gatekeeping* or *Normative Signaling.*
  *   **Literature:** In the sociology of scientific knowledge (e.g., Bourdieu), adopting specific linguistic or calculative frameworks functions as "symbolic capital." In the context of Effective Altruism (EA) and Longtermism, adhering to Expected Value (EV) maximization is often treated not merely as a decision tool but as a **litmus test for moral seriousness**.
  *   **The Gap:** Standard signaling theory explains *why* people adopt the view (status), but it does not capture the *endogenous* feedback loop where the view alters the reality it measures.

  **B. The Endogeneity ("Probability as a Function of Capital")**
  *   **Adjacent Concept:** *Performativity* (Michel Callon, Donald MacKenzie) or *Reflexivity* (George Soros).
  *   **Literature:** Performativity suggests that economic theories do not just describe markets; they shape them. If a model says a risk is manageable, capital flows in, making it temporarily manageable. Soros's reflexivity describes how market participants' bias affects market fundamentals.
  *   **The Gap:** Financial reflexivity usually concerns prices. Your pattern concerns *epistemic credibility* regarding existential or long-horizon risks. The "price" here is the assigned probability of a speculative outcome, which inflates based on the social consensus that it is worth pursuing.

  **C. The Self-Undermining ("Eating the Seed Corn")**
  *   **Adjacent Concept:** *Self-Defeating Prophecy* or *Institutional Decoupling.*
  *   **Literature:** A self-defeating prophecy occurs when the prediction of an event prevents the event from happening. In organizational theory, *goal displacement* occurs when the metrics used to pursue a goal undermine the capacity to achieve it.
  *   **The Gap:** These concepts usually imply a failure of prediction. Your pattern is more insidious: the commitment to the prediction is maintained *despite* the erosion of the capacity to fulfill it, because the commitment itself is the marker of rationality.

  ### 2. The Closest Existing Candidates

  If you must use existing terminology, these are the strongest contenders, though none are perfect fits:

  **1. Performative Fanaticism**
  *   **Why it fits:** It captures the combination of "fanaticism" (the EV maximization regarding low-prob/high-impact events, as discussed by Beckstead, Thorstad, and Isaacs) and "performativity" (the act of believing/funding alters the probability).
  *   **Limitation:** "Fanaticism" is often used pejoratively to describe the *content* of the belief, not the *social-epistemic structure* enforcing it.

  **2. Reflexive Epistemic Lock-in**
  *   **Why it fits:** "Lock-in" describes a state where a community cannot switch strategies due to increasing returns to adoption. "Reflexive" captures the endogeneity.
  *   **Limitation:** This is a descriptive phrase rather than a canonical term. It misses the moral/membership enforcement aspect.

  **3. Institutional Cannibalization**
  *   **Why it fits:** This captures the self-undermining aspect where the pursuit of the long-term goal consumes the stable institutional capital required to achieve it.
  *   **Limitation:** It describes the *outcome*, not the *epistemic mechanism* (the EV calculation enforcement) that drives it.

  ### 3. Proposed Delineation: "The Reflexive Rationality Trap"

  Since you are describing a genuinely distinct configuration, you may find it necessary to coin a term or adopt a synthesized label. The most precise description of the dynamic you outlined is **Endogenous Epistemic Lock-in with Institutional Decoupling.**

  However, for the specific social-epistemic pattern, I propose labeling it **Performative Rationality Trap**.

  **Definition:** A social-epistemic state where:
  1.  **Normative Enforcement:** Adherence to a specific calculative rationality (e.g., raw EV maximization) is enforced as a condition of group membership.
  2.  **Epistemic Reflexivity:** The probability estimates governing the calculation are positively correlated with the social capital invested in them (belief creates evidence).
  3.  **Structural Decoupling:** The resource allocation required to sustain the belief erodes the institutional stability necessary to validate the belief, creating a divergence between the *modeled* path and the *feasible* path.

  ### 4. Contextual Note: The Longtermism/EA Discourse

  It is impossible to analyze this pattern without acknowledging that the empirical referent you are describing is almost certainly the internal discourse of **Effective Altruism and Longtermism**, specifically regarding **Existential Risk (X-Risk) mitigation**.

  *   **The Choice:** Near-term welfare (secure/moderate) vs. X-Risk mitigation (speculative/enormous).
  *   **The Enforcement:** Critics of longtermism are often framed as suffering from "scope neglect" or "speciesism," while proponents are framed as "EV fanatics."
  *   **The Endogeneity:** The more funding and intellectual attention directed toward a specific x-risk (e.g., AI alignment), the more "tractable" and "probable" the risk and its solution appear in models.
  *   **The Self-Undermining:** Aggressive advocacy or radical policy shifts proposed to mitigate distant risks can destabilize the liberal-democratic or scientific institutions required to solve those risks in the long run.

  Philosophers like **David Thorstad** (on "The Case for Strong Longtermism"), **Amia Srinivasan** (on "The Aptness of Anger" and ideological rigidity), and **William MacAskill** (on "What We Owe the Future") touch on the edges of this, but the specific *sociological loop* you identified is often treated as a bug in the system rather than a structural feature.

  ### 5. Why This Distinction Matters

  You are correct to suspect this is a distinct configuration. Standard decision theory assumes probabilities are exogenous (fixed by the world). Standard sociology assumes beliefs are determined by social structures. Your pattern identifies a **cybernetic loop** where:
  1.  Belief dictates resource allocation.
  2.  Resource allocation dictates perceived probability.
  3.  Perceived probability dictates belief.
  4.  **Crucially:** The loop consumes the substrate (institutional stability) required to sustain the loop.

  This is distinct from a **Bubble** (which bursts when capital runs out) because the *epistemic commitment* remains even as the capacity fades, sustained by the social cost of defection. It is distinct from **Cultic Behavior** because the enforcement mechanism is explicitly framed as *hyper-rationality* (mathematical EV) rather than faith.

  ### Summary Recommendation

  If you are writing on this, do not force an existing term that only captures one leg of the stool.
  *   Use **Expected Value Fanaticism** for the decision-theoretic component.
  *   Use **Performativity** or **Reflexivity** for the endogenous probability component.
  *   Use **Institutional Decoupling** for the self-undermining component.

  To name the specific *combination*, I recommend **"Reflexive Epistemic Lock-in"** or **"The Performative Rationality Trap."** This accurately signals that the rationality itself is the mechanism of the trap, distinguished from mere irrationality or standard collective action failures.
