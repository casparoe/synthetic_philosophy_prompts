      *   *Difference:* In science, we assume there is a "truth of the matter" regarding the physical world (immanent truth). In ethics, Quine suggests there is no external "moral reality" to correspond to. The underdetermination in ethics is not just about theory choice but about the lack of an ontology to be true *to*.
