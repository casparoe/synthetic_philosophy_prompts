      *   Moral statements (e.g., "Stealing is wrong") don't seem to entail specific sensory observations *directly*.
      *   *However*, Quine is a holist. A statement doesn't need *direct* content, but it must contribute to the system that *does*.
      *   *The Gap:* In physics, theoretical terms (electron) link to observation via bridge laws. In ethics, the link is tenuous. Quine tends to view moral statements as expressions of sentiment or social policy rather than descriptions of moral facts (since there are no moral properties in the physical ontology).
      *   *Resolution:* They remain in the web not as *descriptive* posits about the world, but as *injunctions* or *dispositions* that regulate behavior. They are part of the "stimulus meaning" of social interaction, not the physical world.

  4.  **Analyze the Status of Moral Predicates (Causal-Nomological Links):**
