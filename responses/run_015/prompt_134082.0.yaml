      *   Quine's physicalism says all *events* are physical. Moral judgments are events (neural states).
      *   But do moral *predicates* refer? Quine is skeptical. "Good" doesn't pick out a natural kind in the way "electron" does.
      *   *Why retain them?* Social utility. They function to coordinate behavior within the community. This leans towards a pragmatic/instrumental view.

  5.  **Underdetermination (Normative vs. Descriptive):**
