answer: |-
  To map the conceptual territory of normative discourse within Quine's naturalized epistemology, we must navigate the tension between his holistic empiricism and his strict physicalist ontology. The central difficulty lies in reconciling the idea that all meaningful discourse must ultimately cash out in terms of sensory stimulation with the observation that moral sentences do not appear to predict sensory stimuli in the manner of scientific hypotheses.

  ### The Web of Belief and the Isolation of Ethics

  In Quine's architecture, the "web of belief" is anchored at the periphery by observation sentences—statements directly conditioned to sensory stimulation. Moving inward, theoretical sentences gain their empirical content by their logical proximity to these observation sentences. Scientific terms, even abstract ones like "electron," earn their keep by contributing to the prediction of sensory events.

  Ethical statements occupy an anomalous position in this topology. Quine suggests that moral sentences lack direct empirical content because they do not, even in conjunction with auxiliary hypotheses, entail specific predictions about sensory stimulation. If one posits "Stealing is wrong," this does not logically force a specific sensory outcome in the way that "There is a red patch" or "The gauge reads 5" does. Consequently, ethical statements are causally detached from the sensory periphery in a way that theoretical physics is not.

  However, this detachment does not eject them from the web entirely. They remain within the fabric of belief, but their function shifts from *descriptive* to *regulative*. They are not in the web to describe the physical world, but to regulate the behavior of the agents within the web. Their retention is justified not by their ability to predict the behavior of physical objects, but by their utility in predicting and coordinating the behavior of human organisms. Thus, the "empirical content" of ethics is not about the external physical environment, but about the internal social environment.

  ### Physicalism and the Status of Moral Predicates

  Quine's physicalism commits him to the view that all genuine events are physical events. Moral judgments, as psychological states, are physically realized. However, Quine distinguishes sharply between the *act* of judging and the *content* of the judgment. While the neural state corresponding to a moral belief is physical, the moral predicate itself (e.g., "is good") does not refer to a physical property or a natural kind in the way that "mass" or "charge" does.

  This creates a specific conceptual tension: If all knowledge claims must connect to physical stimulation, and moral predicates lack causal-nomological links to physical input, do they qualify as knowledge? Quine's solution is to treat moral discourse as a distinct linguistic game that operates within the physical world but does not describe it.

  The connection to physicalism is maintained through anthropology and psychology. Moral statements have indirect empirical anchoring insofar as they describe or prescribe patterns of human behavior that can be studied naturalistically. We can observe the conditions under which humans utter moral sentences and the behavioral consequences of those utterances. Therefore, moral predicates remain in the web not as posits about moral reality, but as posits about social dynamics. They are tools for social coordination that have evolved because they enhance the survival and stability of the community. Their "truth" is not a matter of correspondence to moral facts (of which there are none in Quine's ontology), but of coherence within the social system and efficacy in behavioral regulation.

  ### Underdetermination: Descriptive vs. Normative

  Quine's underdetermination thesis states that multiple theories can account for the same sensory data. In the descriptive domain, this leads to a choice between theories based on pragmatic virtues like simplicity and conservatism, yet Quine maintains there is a "truth of the matter" regarding the physical world (immanent truth). We assume the world is one way or another, even if our theories underdetermine which way.

  In the normative domain, underdetermination operates differently. Since there are no moral facts to which our theories correspond, the underdetermination of ethical systems is not merely epistemic; it is ontological. Two conflicting moral systems might both perfectly account for all human behavioral and sentimental data, yet there is no "moral reality" to decide between them.

  This implies that the choice between moral frameworks is purely pragmatic. We do not choose a moral theory because it is "truer" to the moral landscape; we choose it because it better serves our social goals, reduces conflict, or aligns with our cultivated sentiments. The underdetermination here is more radical than in science because the tribunal of experience in ethics judges the *utility* of the norm, not its *accuracy*.

  ### Instrumentalism vs. Minimal Naturalized Realism

  This analysis brings us to the crux of your inquiry: does this collapse into quietist instrumentalism, or is there room for minimal realism?

  Quine's position leans heavily toward a sophisticated instrumentalism, but it avoids the pitfalls of simple non-cognitivism by utilizing a deflationary theory of truth. Quine allows that moral sentences can be called "true." To say "Stealing is wrong is true" is just to say "Stealing is wrong." This disquotational use of truth does not commit him to the existence of moral properties. It merely acknowledges the grammatical and logical utility of treating moral statements as truth-apt within the language.

  However, this is not a robust realism. A naturalized moral realism would require moral properties to be reducible to or identical with natural properties (e.g., "goodness" = "social cohesion"). Quine resists this reduction. He views moral values as part of our "conceptual scheme" rather than part of the "world" that the scheme describes.

  Therefore, the position is best characterized as a **pragmatic instrumentalism with immanent truth**.
  1.  **Instrumentalism:** Moral discourse is a tool for social engineering and behavioral coordination. Its justification is pragmatic (does it work?), not empirical (does it match the facts?).
  2.  **Immanent Truth:** Within the moral framework, statements can be true or false relative to the standards of that framework. We can reason logically about ethics. But the framework itself stands outside the tribunal of sensory experience in the way physics stands inside it.

  ### Conclusion: The Conceptual Structure of Detachment

  The detachment of normative discourse in Quine's system is not a rejection of its importance, but a reclassification of its logical type. Moral sentences remain in the web of belief because they are indispensable for the functioning of the community that produces the web. They are causally connected to the physical world only through the medium of human behavior and neural conditioning.

  Quine's physicalism is preserved because moral judgments are treated as physical events (behaviors/neural states), even if moral properties are not recognized as physical entities. The underdetermination of ethics is total regarding ontology but constrained by pragmatic necessity regarding practice. Ultimately, Quine leaves no room for moral realism grounded in behavioral science in the sense of discovering independent moral laws. Instead, behavioral science explains *why* we have moral beliefs, while the moral beliefs themselves function as non-representational norms that guide action. The tension is resolved by accepting that while all knowledge is natural, not all discourse is descriptive; some discourse is prescriptive, and its validity rests on its role in the survival and coherence of the naturalized knower.
