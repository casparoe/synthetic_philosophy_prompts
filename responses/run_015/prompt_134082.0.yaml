      *   *Empirical Content:* Sentences have meaning insofar as they make a difference to sensory expectations. Holism: sentences don't face the tribunal of experience alone, but as a corporate body.
      *   *Physicalism:* Everything that exists is physical. Psychology should be naturalized (become part of neuroscience/physics eventually).
      *   *Ethics:* Quine often treats ethics as less "factual" than physics. He suggests moral statements don't predict sensory stimuli in the same way "There is a rabbit" does.
