  **Framing Selection**
  I considered five framings: (1) *Epistemic Deference* (when is trust rational?), (2) *Information Bottleneck* (bandwidth limits in handoffs), (3) *Distributional Tail* (alignment as rare events vs. competence as bulk), (4) *Structural Opacity* (the trade-off between compression and verification), and (5) *Recursive Complexity* (tree depth vs. width). I selected **Structural Opacity**. I dropped (1) for being too abstract for the ML cohort, (2) for ignoring normative alignment, (3) because it hinges on contingent distillation mechanics rather than amplification structure, and (5) because it misses the core verification tension.

  ***

  **Proposal: The Opacity-Competence Trade-off in Decomposed Oversight**

  **The Question**
  Current scalable oversight literature assumes that decomposition can simultaneously increase competence and preserve alignment. This project challenges that assumption by isolating a structural tension: competence gains in decomposed systems rely on compressing sub-task outputs into forms the overseer cannot fully verify, while alignment preservation requires those outputs to be verifiable. The core question is: **Is there a structural limit to competence gains in verification-closed decompositions?**

  I recommend pursuing Conjecture 1 (Verification-Closed Decompositions) and dropping Conjecture 2 (Distillation Tail). Conjecture 2 is an empirical claim about current training dynamics that may be solved by engineering tweaks (e.g., importance sampling). Conjecture 1 is a structural claim about the logic of amplification itself. If Conjecture 1 holds, it implies a fundamental ceiling on safe scalability that no amount of engineering can bypass without changing the oversight architecture. This is the stronger philosophical and technical contribution.

  **Existing Positions and Non-Triviality**
  The standard move in alignment theory is to assume that if a human can verify the *process* or the *final output*, the intermediate steps need not be fully understood. Adversarial training setups assume that if a deceptive step exists, a competitor model will find it. Relaxed adversarial training assumes we can train overseers to detect flaws without understanding the full computation.

  None of these settle the question because they all implicitly assume verification scales cheaper than competence. They treat "checking" as a cheaper version of "doing." This project argues that for certain classes of cognitive tasks, checking *requires* recomputing the compression, meaning verification cost scales with competence gain.

  Is this trivial? The objection will be: "Obviously, lossy compression loses information." To avoid triviality, I must not merely show that information is lost, but that the *specific information lost is necessary for alignment verification*, while the *information retained is sufficient for competence*. The non-trivial claim is that competence *requires* opaque abstractions. If competence could be achieved via fully transparent, verifiable sub-steps, the trade-off disappears. The project must demonstrate that useful cognitive compression is inherently opaque to the compressor's supervisor.

  **Method**
  Pure empirical experiments are too noisy to isolate structural properties; pure conceptual analysis is too abstract to guide builders. The right approach is a formal toy model of decomposition paired with conceptual argumentation.

  *   **Months 1–3: Conceptual Groundwork.** Define "verification-closed" rigorously. Distinguish between *semantic* compression (summarizing meaning) and *syntactic* compression (shortening code). Map existing amplification proposals (IDAA, debate, RRM) onto this framework to show where they assume verification scalability.
  *   **Months 4–6: Formal Model.** Construct a minimal formal model of a decomposed agent. Define competence as task success probability and alignment as adherence to overseer intent under distributional shift. Prove whether competence gains correlate negatively with verification fidelity in the model.
  *   **Months 7–9: Implications and Writeup.** Translate the formal result into design constraints. Draft the final paper and a technical brief for engineering teams.

  I argue against pure human oversight experiments because they measure current human limitations, not structural limits. I argue against pure epistemology because it won't satisfy the ML cohort. The hybrid model ensures the result is both rigorous and relevant.

  **Success and Failure Conditions**
  A positive result looks like a theorem or robust argument establishing a bound: e.g., "For any decomposition scheme D, if verification cost is bounded by V, competence gain is bounded by C(V)." This gives builders a clear signal: if you want more competence, you must increase verification budget or change the architecture.

  Failure looks like proving the trade-off is contingent on specific task classes rather than structural. If the result is "it depends on the decomposition," the project fails. To avoid this, I will define a class of "general cognitive tasks" upfront and show the trade-off holds across that class. If the trade-off only holds for cryptography-style tasks, the project must pivot to argue why AGI-relevant tasks fall into that class.

  **Deliverable**
  For builders, the deliverable is a **Verifiability Criterion for Decomposition**. This is a checklist or metric they can apply to a proposed decomposition scheme to estimate its "opacity risk." It won't stop them from building, but it will flag when a competence gain is being purchased with unverifiable steps. If the honest answer is "no useful deliverable at this abstraction," the nearest useful thing is a negative result: a proof that certain popular architectures cannot scale safely without new verification primitives. That saves the field years of wasted engineering.

  **Scope and Risks**
  **Cut:** Conjecture 2 (Distillation). It doubles the scope and distracts from the structural claim.
  **Risk:** The formal model becomes too abstract to be credible to ML researchers. To mitigate, I will ground the model in known complexity classes (e.g., relating verification to NP vs. P) rather than pure logic.
  **Risk:** The project balloons into a general theory of explanation. I must stay focused on the *handoff* mechanism between nodes, not the nature of understanding itself.
  **Honest Scope:** Nine months is tight for a formal proof plus philosophical argument. If the formal model stalls at Month 6, I will pivot to a rigorous impossibility argument based on existing complexity results rather than building a new model from scratch. The priority is the claim, not the specific formalism.
