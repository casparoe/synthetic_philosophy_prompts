  hey — you're a professional philosopher who also happens to know the scalable oversight / amplification literature really well (iterated amplification, distillation, debate-style setups, recursive reward modelling, the whole family of "build a competent system out of a weak overseer plus recursion" ideas). Please think carefully rather than pattern-matching: before you write anything, brainstorm maybe five candidate framings of my question, then pick one and say in a sentence or two why you dropped the others.

  I'm putting together a two-page proposal for a nine-month funded fellowship and I need you to turn my half-formed idea into it. The fellowship committee is a mix: about half technical alignment/ML people, half philosophers (epistemology and political philosophy mostly), so the framing has to work for both.

  My half-formed idea: everyone asks whether iterated amplification "preserves alignment", but I think decomposition does two seperable things and people run them together. It (a) makes the overall system more competent than the overseer, and (b) is supposed to keep the system aimed at what the overseer wants. And I suspect (a) and (b) pull apart structurally, for this reason: a decomposition buys competence largely by letting the process hand sub-answers around in compressed form, where the human at the next node can't really check whether the sub-answer is adequate — only whether it looks adequate. The competence gain seems to ride on opacity at the handoff. But the alignment story rides on the human's judgment at each node actually tracking the facts/values, which needs the handoff to be checkable. So there's a squeeze: the more a decomposition helps, the less superviseable it is, and vice versa. I want to make that squeeze into a precise claim instead of a vibe.

  Two conjectures I'm playing with, and I'm not sure either is good:

  1. Call a decomposition "verification-closed" if checking that a sub-answer is adequate is no harder than the original task was (so the check doesn't itself need to be amplified). Conjecture: verification-closed decompositions give at most bounded competence gain — i.e. all the amplification power lives in handoffs whose adequacy the overseer can't assess without recursing, which just pushes the problem up a level.

  2. The leak is mostly in the distillation step rather than the amplification step. Reason: the alignment-relevant content of the amplified system's behaviour is concentrated in the low-probability parts of its output distribution — the rare refusals, deferrals, hedges, "I actually can't tell" moves — whereas the competence is carried by the frequent, smooth, high-probability behaviour. Distillation by training on sampled outputs optimises something like average loss, so it should systematically retain the competence-carrying bulk and wash out the alignment-carrying tail. If that's right, "distillation preserves competence but erodes alignment" isn't a deep fact about values, it's a fact about where in the distribution the two things live — which would also predict that the erosion is fixable by changing the sampling/loss, not by adding more value content.

  What I need in the document:

  - The question stated precisely enough that it has a determinate answer (or a determinate "no answer, and here's why"). If my two conjectures are really two different projects, say so and tell me which one to keep for nine months.
  - Why the existing positions leave it open — not as a literature review, and definitely no citations (I'll fill those in myself). Just: what the standard moves are, and why none of them settle this. If either of my conjectures secretly collapses into something boring that everyone already accepts — e.g. "any lossy compression loses information" or "you can't verify what you don't understand" — I want to be told that plainly, and I want to know what I'd have to add to make it non-trivial.
  - The method: what I'd actually do, month by month, over nine months. Include why this approach rather than the obvious alternatives I'd get pushed toward — e.g. just running human oversight experiments, or building a formal toy model and proving something in it, or doing it as pure epistemology about testimony and deference. I suspect the right thing is a small formal model plus a conceptual argument, but argue me out of it if you think that's the trap.
  - What a positive result would look like, and what would count as the project failing — including the failure mode where I spend nine months and end up with "it depends on the decomposition", which doesn't count.
  - What the deliverable is for someone actually building these systems, if there is one. If the honest answer is "there isn't one at this level of abstraction", say that and say what the nearest useful thing would be.
  - Honest scope: what should I cut, and what's the thing most likely to make this balloon past nine months.

  Write it in prose, not bullet soup, except the month-by-month bit, which can be bullets. Around two pages. And be blunt: if the whole idea is a pseudo-question dressed up, I'd rather find out now than in month seven.
