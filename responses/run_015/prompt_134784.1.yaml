      *   **The Conflict:** Ravi sees this as absurd. It means higher-order knowledge vanishes quickly. Sam sees this as proof $KK$ is false.
      *   **Sam's Conciliation (One-Step KK):** Sam proposes: $Kp \to K(Kp \lor \neg K_{safe} p)$? No, the prompt says: "know that you're either in the know-p zone or at most one step from its edge."
          *   Let's formalize: $Kp \to K(Kp \lor \text{Marginal})$.
