      *   **Ravi's Stance:** Knowledge must guide reasoning/action. If $KK$ fails, knowledge is detached from the subject's perspective. Needs to distinguish $KK$ from full luminosity (can choose to concede luminosity fails but $KK$ holds, or argue they stand together).
