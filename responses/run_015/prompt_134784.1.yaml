  4.  **Refining the Math (Crucial Step):**
      *   Prompt says: "nth-order knowledge needs p to hold across 2n+1 cases."
      *   Let's check:
          *   $n=1$ ($Kp$): Needs $i-1, i, i+1$. Total 3 cases. ($2(1)+1 = 3$). Correct.
