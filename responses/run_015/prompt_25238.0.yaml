  2.  **Deconstruct "Pascal's Mugging" (Academic vs. Colloquial):**
      *   *Academic (Bostrom/Yudkowsky):* A thought experiment where a mugger promises an astronomically huge reward for a small sum, exploiting expected value (EV) calculations where $P \times V$ remains high even as $P \to 0$ and $V \to \infty$. It highlights problems with unbounded utility functions and Bayesian priors.
