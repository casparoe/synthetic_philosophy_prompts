      *   *1. What is denied:* Need to separate Soul, Reason, Thought, Sensation, Moral Standing.
      *   *2. What "Machine" does:* "Explicable mechanically" is weak. "Devoid of interiority" is strong. "Deterministic" is a red herring (humans might be deterministic too).
      *   *3. Tests (Language vs. Adaptability):* Parrots/magpies problem. Infants problem. Need to distinguish *capacity* vs *performance*. Descartes relies on *creative* use of signs, not just mimicry.
