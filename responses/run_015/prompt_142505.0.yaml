      *   **Structure:**
          1.  Lay out distinct precise theses (menu from near-trivial to radical).
          2.  For each: Verdict (platitude, defensible, false, etc.) + Note on what would settle it.
          3.  Evaluate each reading against the colleague's goal (shutting down the question of inner life/phenomenology).
          4.  Address the tension between the evidential reading (nothing could settle it) and the metaphysical reading (there is nothing there).
          5.  Address the user's specific distinctions (Soul/Reason/Thought/Sensation/Moral Standing; Meaning of "Machine"; Language vs. Adaptability tests; Sensation without Thought).
          6.  Conclusion: Identify the "generally meant" reading, identify if any reading is both defensible and strong enough, or identify the weakest step if none are.
