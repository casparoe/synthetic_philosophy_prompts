  2.  **Deconstruct the Sentence ("Animals are Machines"):**
      *   What does "machine" mean here?
          *   Mechanical explanation (physics/physiology).
          *   Lack of consciousness (phenomenology).
          *   Lack of rationality (cognition).
          *   Lack of moral status (ethics).
          *   Lack of soul (theology/metaphysics).
      *   What does "are" imply? Identity? Reduction? Functional equivalence?

  3.  **Drafting the Menu of Theses (Ordered Trivial to Radical):**
      *   *Thesis 1 (Physiological):* Animal bodies operate via mechanical laws. (Platitude now, controversial then).
      *   *Thesis 2 (Cognitive):* Animals lack general-purpose reason/language. (Defensible/Contentious).
