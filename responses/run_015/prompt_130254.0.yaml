prompt: |-
  I am trying to clarify what an adequate causal-historical theory of long-run national prosperity actually has to deliver, and I want the full specification before I assess any particular institutionalist, geographic, or cultural account. The existing literature often conflates three distinct explanatory targets — cross-sectional variance at a single point in time, the temporal trajectory of one polity across centuries, and counterfactual resilience (what a nation’s path would have been under different colonial or climatic conditions) — and it treats competing explanations as if they were answers to the same question. Before I read further, I want the desiderata separated out with the logic behind each, and I want to know which ones can genuinely be satisfied together.

  Please structure your answer exactly as follows.

  Section 1 — The explanatory target (around 200 words). Distinguish the three questions named above and say which ones a single theory must cover if it claims to explain why some nations are rich. State whether it is legitimate for a theory to cover only one, and what explanatory cost that choice carries.

  Section 2 — The desiderata (around 700 words). List the requirements any adequate theory must meet, with the motivating case, distinction, or logical constraint behind each. Include at minimum: (a) handling the reversal-of-fortune pattern (high pre-colonial population density correlating with later poverty after colonisation) without reducing it automatically to institutional causation; (b) a criterion for distinguishing institutions that cause wealth from institutions that are epiphenomenal to prior geographic endowments; (c) a principle of causal priority that does not collapse into temporal ordering alone, given that geography, culture, and institutions are observationally co-present in macrohistory; (d) consistency with both the Scandinavian cases (high institutional quality and high wealth despite adverse geographic conditions) and the resource-curse cases (favourable geographic endowments, weak institutions, poor outcomes); (e) a mandatory separation between de jure formal rules and de facto power relations, and an account of why conflating them undermines causal explanation; (f) a specification of what evidence would falsify rather than merely fail to confirm the theory, particularly where culture and institutions are observationally equivalent; and (g) the ‘parallel-worlds’ constraint — for pairs of nations with similar geographic and cultural starting conditions but divergent outcomes, the theory must identify a branching factor that is not post-hoc rationalisation. Flag any pair of these desiderata that you suspect are jointly unsatisfiable, and explain the contradiction precisely.

  Section 3 — Negotiability audit (around 250 words). For each desideratum, mark whether it is non-negotiable for any causal claim in this domain or whether it reflects a camp-specific preference (for instance, determinism versus contingency, universalism versus path-dependency). Identify which single requirement does the most work in excluding the largest number of existing explanations.

  Section 4 — Brief contender sketch (around 350 words). Without producing a bibliography, citation list, or specific page references, indicate how the standard institutionalist account (stressing inclusive versus extractive rules), geographic determinism (stressing ecological endowments and climate suitability), and a culture-focused explanation (stressing norms and social capital) fare against the list. Focus on logical failures or structural gaps rather than on missing empirical coverage.

  Write in British English throughout. Do not ask for citations, reading lists, or references I would need to look up. Keep the weight on the criteria and their motivating logic rather than on scoring the contenders.
