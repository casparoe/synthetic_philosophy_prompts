  Section 1 — The explanatory target

  Three distinct explanatory targets dominate the literature, often conflated to the detriment of analytical clarity. First, cross-sectional variance asks why Nation A is richer than Nation B at a specific moment. Second, temporal trajectory examines how a single polity's wealth evolved over centuries. Third, counterfactual resilience probes what would have occurred under alternative colonial or climatic conditions. A theory claiming to explain 'why some nations are rich' must primarily address cross-sectional variance, but without temporal trajectory, it cannot establish directionality. Counterfactuals are essential for policy relevance but secondary to historical explanation.

  It is legitimate for a theory to cover only one target, provided it acknowledges the limitation explicitly. A cross-sectional theory explains distribution but not growth dynamics. A temporal theory explains growth but not necessarily divergence between peers. The explanatory cost of narrowing scope is significant: ignoring trajectory invites reverse causality, while ignoring cross-section limits generalisability. Ignoring counterfactuals renders the theory historically descriptive rather than causally robust. Consequently, while a single theory *can* target one, a comprehensive causal account of prosperity ideally integrates all three to distinguish correlation from mechanism. Failure to separate these targets leads to theories that fit static data but collapse when tested against historical transitions or hypothetical alternatives. This conflation is the primary source of disagreement in the field.

  Section 2 — The desiderata

  Any adequate theory must meet seven rigorous desiderata, each addressing a specific logical vulnerability in macrohistorical explanation.
  (a) Handling reversal of fortune: The theory must explain why densely populated pre-colonial societies often became poorer post-colonisation without simply asserting 'institutions changed'. The motivating logic is that high density implies existing complex structures; if these become liabilities, the theory must specify the mechanism of inversion, not just the outcome. Reducing this to institutional causation alone begs the question of why institutions inverted. Failure here implies the theory cannot handle structural breaks.
  (b) Institutions vs. Geography: There must be a criterion to distinguish institutions causing wealth from those merely enabled by geography. If good institutions only arise in temperate zones, they may be epiphenomenal. The distinction is vital because if geography determines the feasibility of institutions, then institutions are not the ultimate cause. The logical constraint is to avoid mistaking a proximate cause for an ultimate one. Failure implies the theory is merely descriptive of ecological niches.
  (c) Causal Priority: Given co-presence, temporal ordering is insufficient. The theory must identify a lever that moves independently of the others. Geography, culture, and institutions evolve together; isolating one requires a mechanism that operates even when others are held constant. The constraint here is against multicollinearity masking as causation. Failure implies the theory cannot guide intervention.
  (d) Outlier Consistency: It must accommodate Scandinavia (poor soil, high wealth) and the Resource Curse (rich soil, low wealth). Pure geographic determinism fails here; pure institutionalism must explain why resources sometimes corrupt institutions. This tests the theory's boundary conditions and ensures it does not cherry-pick confirming cases. Failure implies selection bias.
  (e) De Jure vs. De Facto: Formal rules often mask extractive power relations. Conflating them leads to coding errors where constitutions appear inclusive while enforcement is predatory. The logic is that power precedes rules; ignoring this reverses the causal chain. A theory must explain who enforces the rules, not just what the rules say. Failure implies legalism without sociology.
  (f) Falsification: There must be specified evidence that would refute the theory. If culture and institutions move together, the theory must state what observation would prove culture is not the driver. Without this, the theory is unfalsifiable metaphysics. The constraint is empirical risk; the theory must gamble on specific outcomes. Failure implies dogma.
  (g) Parallel-Worlds: For similar starting points diverging, a specific branching factor is required, not post-hoc rationalisation. This prevents 'just-so' stories where every outcome is explained by a unique cause invented after the fact. The logic demands ex-ante predictability or clearly defined ex-post mechanisms. Failure implies narrative fallacy.

  Regarding joint satisfiability, desiderata (c) and (g) present a significant tension. Causal priority requires isolating a generalisable variable, yet the parallel-worlds constraint often relies on unique contingent events (critical junctures) that are by definition non-generalisable. If the branching factor is unique to a specific history, it undermines the causal priority needed for a general theory. Furthermore, (b) and (d) conflict if geographic endowments are defined too broadly; if 'geography' includes disease environments that affect institutions, distinguishing them becomes conceptually murky. The most profound contradiction lies between (a) and (d): explaining reversal of fortune often relies on colonial institutional imprints, yet explaining Scandinavian success requires endogenous development independent of such imprints. Reconciling external imposition with internal evolution without ad hoc adjustments remains a significant logical hurdle. A theory satisfying all seven must navigate the line between universal laws and historical specificity without collapsing into contradiction. The contradiction is precise: generalisability requires uniform mechanisms, while historical specificity requires unique contingencies.

  Section 3 — Negotiability audit

  Desiderata (b), (c), (e), and (f) are non-negotiable for any claim aspiring to scientific causal explanation. Without distinguishing epiphenomena, isolating causal priority, separating power from rules, and specifying falsification conditions, a theory remains descriptive or ideological. These form the bedrock of rigorous social science methodology. Desiderata (a) and (g) reflect camp-specific preferences regarding contingency versus determinism. Reversal of fortune is heavily weighted towards colonial histories, which may not apply globally to pre-modern divergence. Parallel-worlds constraints favour path-dependency accounts over structuralist ones. Desideratum (d) is empirically grounded but how it is weighted varies; some theories treat outliers as noise rather than constraints, which is a methodological choice rather than a logical necessity.

  The single requirement that does the most work in excluding existing explanations is (f), the falsification criterion. Most grand theories of prosperity are formulated broadly enough to accommodate almost any outcome, rendering them immune to refutation. By demanding specific evidence that would prove the theory wrong, particularly where culture and institutions are observationally equivalent, we eliminate tautological arguments. This requirement forces theorists to risk empirical failure, which few are willing to do. Consequently, strict adherence to falsification would discard the majority of current institutionalist and cultural accounts, leaving only those with precise, testable mechanisms. It is the sharpest tool for separating science from narrative. It exposes the protective belt of assumptions that shield core theories from disconfirmation.

  Section 4 — Brief contender sketch

  The standard institutionalist account stresses inclusive versus extractive rules. It fares well on (e) and (a), recognising power dynamics and colonial reversals. However, it struggles with (b) and (f). It often treats institutions as exogenous without fully disentangling them from geographic feasibility, and it rarely specifies what evidence would falsify the inclusive rule hypothesis beyond poor performance. It risks circularity: wealth implies inclusive institutions, which imply wealth. Furthermore, it fails to explain the origin of institutions without recourse to geography or culture, leaving a causal gap at the critical juncture.

  Geographic determinism stresses ecological endowments and climate suitability. It satisfies (b) by prioritising ultimate causes but fails (d) and (g). It cannot easily explain Scandinavia's success despite adverse conditions without invoking 'human capital' as a proxy, which weakens the geographic claim. It also struggles with divergence among similar climates, violating the parallel-worlds constraint. It tends to be too deterministic to account for branching paths. It fails to explain technological adaptation that overcomes ecological limits, rendering it static in the face of innovation.

  A culture-focused explanation stresses norms and social capital. It performs adequately on (c), offering deep causal roots, but fails badly on (f) and (g). Culture is notoriously difficult to measure independently of outcomes, leading to observational equivalence with institutions. Furthermore, cultural explanations often resort to post-hoc rationalisation for divergence, claiming cultural shifts occurred precisely when needed. This violates the falsification and parallel-worlds desiderata. All three contenders possess structural gaps that prevent them from satisfying the full list of requirements simultaneously. Each relies on a residual category to explain away anomalies, undermining their claim to comprehensive causal sufficiency.
