answer: |-
  To the Members of the Capital Punishment Review Commission, this memo serves as my formal recommendation ahead of our upcoming vote regarding the proposed narrowing of eligibility for the death penalty. We are asked to decide between abolishing the penalty entirely or retaining it under a stricter regime that limits eligibility to cases with physical evidence such as DNA or video, requires a unanimous jury vote for imposition, and establishes life without parole as the default sentence. While the proposal to narrow the scope of capital punishment is well-intentioned and seeks to address the most glaring vulnerabilities of our current system, I recommend that we vote to abolish the death penalty because the proposed safeguards do not resolve the fundamental epistemological and practical failures that undermine the legitimacy of state execution. We must confront the reality that a system which executes only rarely and after decades of appeals fails to achieve the stated goals of either deterrence or justice, and that a standard of only the certainly guilty is something no human institution can actually meet without merely moving the line of who gets wrongly killed.

  We must begin by taking the retributivist case seriously, as our chair has instructed, acknowledging that there is a moral intuition among many citizens that certain acts of extreme violence create a debt that only the ultimate penalty can satisfy. This is not merely dressed-up vengeance but a claim about desert, suggesting that some offenders forfeit their right to life by violating the sanctity of life in others. If we could administer this penalty with perfect accuracy and consistency, the retributive argument would stand on solid moral ground. However, retribution requires moral confidence, and that confidence is impossible to sustain when the administration of the penalty is fraught with error. The stack of files on our desks regarding exonerees, including the man who came within weeks of execution based on what looked like airtight eyewitness testimony and a signed confession, demonstrates that our legal processes are fallible. The proposed narrowing attempts to fix this by demanding physical evidence like DNA or video, but this creates a new arbitrariness where the severity of punishment depends on the fortuity of evidence preservation rather than the severity of the crime. A calculated killing without biological traces would receive life without parole, while a crime of passion captured on a security camera could result in death, which undermines the retributive goal of proportional justice.

  Furthermore, we must address the question our proposal quietly dodges regarding whether a system that executes only rarely and after decades of appeals deters anything at all. The deterrence advocates on this commission have pointed to time-series studies by economists claiming that each execution prevents a specific number of murders, but as the opposition has noted, those results fell apart as soon as researchers reran them with different assumptions about the model. Beyond the fragility of that data lies the practical reality of our own system. Deterrence theory relies on the certainty and swiftness of punishment, yet our narrowed proposal would likely result in executions occurring so infrequently and so far removed from the crime due to necessary appeals that any potential deterrent effect would be nullified. We are not proposing a system of swift justice but rather a ritualized exception that occurs once a decade, which functions more as a symbolic gesture than a functional tool of public safety. If the penalty is not applied consistently enough to deter, and not applied accurately enough to ensure innocence, it loses its utilitarian justification entirely.

  The core issue remains whether a standard of only the certainly guilty is something any human institution can actually meet. The proposal assumes that DNA and video evidence provide objective certainty, but we know that physical evidence can be contaminated, chain of custody can be broken, and video can be ambiguous or edited. By raising the bar to physical evidence, we do not eliminate the risk of executing the innocent we merely shift the line of error to those cases where the science is later challenged or where the evidence was mishandled. The exoneration files show us that certainty is often an illusion created by the convergence of flawed testimony and investigative tunnel vision, and adding a DNA requirement does not immunize the system against human error in processing that evidence. If we accept that there is always a non-zero risk of executing an innocent person, we must ask whether the state should possess the power to impose an irreversible penalty that admits of no correction. The retributive claim for desert collapses if the person being punished might not deserve it, and since we cannot guarantee innocence with absolute certainty, we cannot guarantee justice.

  In light of these considerations, I cannot support a proposal that attempts to sanitize a fundamentally flawed practice by narrowing its application. The narrowing proposal asks us to believe that we can isolate the worst cases and punish them without error, but the history of this commission and the records of exonerations prove otherwise. It asks us to believe that a rare, delayed execution deters violence, despite the lack of robust evidence and the logical inconsistencies of our appellate process. It asks us to accept a standard of certainty that human institutions are incapable of meeting. Therefore, my recommendation is that we vote to abolish the death penalty. We can still honor the gravity of homicide and the need for severe punishment through life without parole, which protects the public and acknowledges the severity of the crime without risking the irreversible moral catastrophe of executing the innocent. We should not preserve a system that requires us to pretend we are more certain than we are, or more effective than the data shows, when the cost of our error is measured in human lives.
