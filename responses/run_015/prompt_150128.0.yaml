answer: |-
  There is no single canonical term in game theory, strategic studies, or SETI literature that perfectly captures this specific triad: **(1) continuous/directional signaling, (2) binary analytical modeling, and (3) third-party sectoral harm.**

  However, your intuition is mapping onto three distinct existing concepts that, when combined, describe exactly what you are seeing. The failure mode you describe is a **modeling error** applied to a specific **economic phenomenon**.

  ### 1. The Nearest Existing Concepts

  *   **Negative Informational Externality:** In economics, this occurs when the dissemination of information imposes a cost on a third party who did not consent to the transaction. Your scenario is a specific geometric subset of this.
  *   **The Generalized Security Dilemma:** Robert Jervis's original definition is dyadic (State A vs. State B). However, later expansions (e.g., by Ken Booth or in network security theory) acknowledge that defensive postures can destabilize a *region*. Your case is a **Networked Security Dilemma** where the "defense" (hunting the signal) harms nodes (civilizations) that are not the sender.
  *   **Signaling Game Discretization:** In mechanism design, analysts often convert continuous strategy spaces into binary choices (e.g., "Enter/Stay Out") to make the math tractable. You have identified a **Discretization Error** where the intermediate states carry unique risks that the binary model averages out or ignores.

  ### 2. The Coined Term: "The Vector Externality"

  If we are to coin a sharp term that separates this from standard security dilemmas (which are about *intent*) and information cascades (which are about *imitation*), I propose:

  **The Vector Externality**

  **Definition:** A strategic risk arising when a signal conveys *directional* information (a vector) rather than just *existential* information (a scalar), triggering a search response that imposes costs on third parties located within the signal's path but distinct from its origin.

  **Why this term works:**
  *   **Vector vs. Scalar:** Standard Dark Forest reasoning treats signaling as a *scalar* value (Intensity: 0 or 1). A narrow-beam probe is a *vector* (Intensity + Direction). The "Binary Collapse" you observe is the error of treating a Vector problem as a Scalar one.
  *   **Externality:** It explicitly marks the harm as spillover damage to bystanders, distinguishing it from the direct risk to the sender (which is the focus of standard "Active SETI" debates).

  **Boundary Conditions:**
  1.  **Directionality:** The signal must constrain the receiver's search space to a corridor/sector, not a point. (Distinguishes from standard "Shout").
  2.  **Search Incentive:** The receiver must have an incentive to sweep the sector (e.g., resource acquisition, preemptive strike). If they ignore the beam, the externality vanishes.
  3.  **Third-Party Density:** There must be other actors in the corridor who are not the sender. (Distinguishes from a dyadic Security Dilemma).
  4.  **Analytical Reductionism:** The failure mode occurs when analysts model the risk function $R(s)$ as convex or binary, ignoring the derivative risk imposed on neighbors $N$ along vector $\vec{v}$.

  ### 3. Differentiation

  | Concept | Mechanism | Victim | Your Scenario |
  | :--- | :--- | :--- | :--- |
  | **Security Dilemma** | Mutual suspicion of *intent* leads to arms race. | The signaling actor & their rival. | **Vector Externality:** Suspicion of *location* leads to sector sweep. |
  | **Information Cascade** | Actors ignore private info to follow public actions. | The followers (who make bad choices). | **Vector Externality:** Actors react to signal by changing the *environment*. |
  | **Tragedy of Commons** | Overuse of a shared resource. | Everyone (including the user). | **Vector Externality:** The resource is "Sector Silence," but harm is *directional*. |
  | **Information Hazard** | Knowledge itself causes harm (e.g., bioweapon recipe). | Anyone with the knowledge. | **Vector Externality:** The *geometry* of the transmission causes the harm. |

  ### 4. Self-Critique: When Is This Concept Wrong?

  To be rigorously self-critical, here are two formal arguments that would suggest **The Vector Externality** is not a new concept, but merely a disguised version of something we already have.

  **Counterexample A: The Convexity of Risk (The "Binary is Correct" Argument)**
  If the risk function $R(signal)$ is strictly **convex**, then any intermediate signaling strategy is mathematically dominated by a mixed strategy of the corners (Hide vs. Shout).
  *   *Formal Result:* If the probability of detection $P(d)$ increases super-linearly with signal clarity, and the cost of detection $C(d)$ is constant, then Expected Loss $E[L] = P(d) \times C(d)$ is convex.
  *   *Implication:* In this case, the "Binary Collapse" by analysts is **not a fallacy**; it is a correct identification of the Nash Equilibrium. Intermediate signaling is always irrational. If this holds, "Vector Externality" is just a transient state on the way to the binary equilibrium, not a stable strategic category.

  **Counterexample B: The Public Good of Silence (The "Tragedy of the Commons" Argument)**
  If we define "Sector Safety" as a non-excludable public good, then any signaling is "pollution."
  *   *Formal Result:* In a Public Goods Game, individual contribution (silence) benefits the group, but defection (signaling) benefits the individual.
  *   *Implication:* The "directional" aspect is irrelevant noise. Whether I pollute the whole river or just one downstream tributary, I am still degrading the commons. If the mathematical model of a **Tragedy of the Commons** fully captures the payoff matrix without needing a "vector" variable, then coining a new term is redundant. The "Vector Externality" would just be a specific *production function* for the public bad.

  ### Conclusion

  You have identified a genuine gap in the standard Dark Forest discourse. Most analyses assume **Omnidirectional Risk** (Shout = Everyone Knows). You are positing **Directional Risk** (Beam = Someone Knows *Where to Look*).

  While it falls under the broad umbrella of **Negative Informational Externalities**, the specific failure to model the *geometry* of the signal justifies the term **The Vector Externality**. It highlights that the danger isn't just *that* you signaled, but *how* you signaled, and that the analytical error is **Scalar Reductionism** (treating a vector problem as a scalar one).

  However, be wary of Counterexample A: If the cost of being found is existential (infinity), then *any* non-zero probability of detection collapses the strategy space back to binary anyway. The Vector Externality only exists if survival is possible *after* detection, but *before* localization.
