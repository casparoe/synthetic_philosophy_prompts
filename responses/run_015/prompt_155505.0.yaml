answer: |-
  # Seminar Activity: The Strotz Bargain

  **Course:** Decision Theory & Self-Control (Upper-Level Undergraduate)
  **Class Size:** 14 Students (7 Pairs)
  **Duration:** 90 Minutes
  **Materials:** 
  *   7 "Pair Kits" (envelopes containing: 1 Shared Pool Mat, 20 Point Tokens, 8 Decision Cards, 3 Treaty Slips, 1 Penalty Marker, 1 Treaty Token).
  *   Whiteboard for aggregate tracking.
  *   Pens for all students.

  ---

  ## 1. Learning Objectives
  *   **Experiential:** To viscerally feel the tension between immediate gratification and long-term planning through role-switching.
  *   **Theoretical:** To demonstrate Strotz’s consistent planning and the mechanism of preference reversal under hyperbolic discounting.
  *   **Critical:** To distinguish between "weakness of will" as a resource depletion vs. a structural time-inconsistency.

  ## 2. Setup & Roles (15 Minutes)
  1.  **Grouping:** Divide the class into 7 pairs. Seat each pair at a small table with one "Pair Kit."
  2.  **Role Assignment:** 
      *   **Student A:** Present-Self (Rounds 1–4), then Future-Self (Rounds 5–8).
      *   **Student B:** Future-Self (Rounds 1–4), then Present-Self (Rounds 5–8).
  3.  **The Pool:** Place the Shared Pool Mat between them. Start with **10 Tokens** in the pool (endowment).
  4.  **The Incentive Structure (Crucial Framing):** 
      *   **Final Ranking:** Pairs are ranked by the final token count in Round 8.
      *   **Tenure Pressure:** Explicitly instruct the **Present-Self**: *"Your reputation in this seminar depends on the Pool's growth **during your active rounds**. If the pool does not grow while you hold the decision card, you are perceived as ineffective."* 
      *   **Why this matters:** This creates the psychological pressure to take the immediate +2 points (visible growth now) versus waiting for +5 points (invisible growth until later), simulating the hyperbolic valuation of "now."

  ## 3. Gameplay Mechanics (45 Minutes)
  The game proceeds in 8 Rounds. Each round takes approx. 4 minutes, with extended negotiation breaks after Rounds 2, 4, and 6.

  ### The Decision Phase (Start of Every Round)
  The active **Present-Self** chooses one of two cards to play face down:
  1.  **Immediate Gratification (Take 2):** 
      *   Add **2 Tokens** to the Pool immediately.
      *   **Consequence:** The Pool suffers an automatic **1 Token deduction** in the *next* round.
      *   **Consequence:** The partner (Future-Self) loses the right to invoke a binding contract in the *next* round.
  2.  **Delayed Commitment (Wait 5):** 
      *   Add **0 Tokens** now.
      *   **Reward:** Add **5 Tokens** to the Pool exactly **three rounds later**. (Track this on the Pool Mat).

  ### The Treaty Mechanism (Precommitment)
  *   **Inventory:** Each Present-Self holds **one Treaty Token** at the start of Rounds 1, 3, 5, 7.
  *   **Activation:** Before revealing the Decision Card, the Present-Self may play the Treaty Token.
  *   **Cost:** Playing the token deducts **1 Token** from the Pool immediately (administrative cost).
  *   **Effect:** Locks the Present-Self into the **Delayed Commitment (Wait 5)** choice. They cannot play "Take 2."

  ### Negotiation Breaks (After Rounds 2, 4, 6)
  *   **Duration:** 2 Minutes.
  *   **Task:** The pair discusses the upcoming round. They may sign a **Treaty Slip** (written agreement).
  *   **Enforcement:** A Treaty Slip is **not** automatically binding. 
      *   At the start of the next round, **both** parties must verbally affirm the treaty.
      *   **Tearing:** Either party may declare "I tear this treaty." 
      *   **Cost of Tearing:** Deduct **1 Token** from the Pool.
      *   **Result:** The Present-Self is free to choose Take 2 or Wait 5.

  ### Round Flow Summary
  *   **R1:** Decision (No treaty possible yet).
  *   **R2:** Decision -> **Negotiation Break 1** (Sign treaty for R3).
  *   **R3:** Decision (Treaty invoked or torn) -> *Typical Preference Reversal Point*.
  *   **R4:** Decision -> **Negotiation Break 2** (Sign treaty for R5).
  *   **R5:** Roles Switch. (A becomes Future, B becomes Present). Decision.
  *   **R6:** Decision -> **Negotiation Break 3** (Sign treaty for R7).
  *   **R7:** Decision.
  *   **R8:** Decision -> Final Tally.

  ## 4. Scoring & Debrief (30 Minutes)
  1.  **Tally (5 mins):** Count tokens in all 7 pools. Rank pairs 1–7. Announce winners.
  2.  **Debrief Discussion (15 mins):**
      *   **The Reversal:** Ask pairs who signed a treaty in Round 2 but tore it in Round 3 to raise hands. 
      *   **Mapping the Curve:** Draw a hyperbolic discount curve on the board ($V = \frac{Reward}{1 + k \cdot Delay}$). Show how the value of the 5-point reward drops sharply as the 2-point reward moves from "future" (Round 2 perspective) to "now" (Round 3 perspective).
      *   **Willpower vs. Structure:** Ask: *"Did you run out of willpower?"* Guide them to see that the incentives didn't change, only the temporal proximity. This refutes the "depletable resource" model of willpower in favor of the "time-inconsistent preference" model.
      *   **Strotz’s Logic:** Explain that in Round 2, they planned to be consistent. In Round 3, they re-optimized based on the new "now," realizing the cost of compliance (forgoing the 2 points) felt disproportionately high.
  3.  **Limitations & Critique (10 mins):**
      *   **Interpersonal vs. Intrapersonal:** Acknowledge that this game stages conflict between *two students*, not inside *one mind*. The facilitator must verbally bridge this: *"Imagine Student A and Student B are the same person at different times. The betrayal you felt when your partner tore the treaty is the betrayal your Future-Self feels when you give in to impulse."*
      *   **Pilot Prediction:** High-cooperation pairs may refuse to tear treaties, viewing it as "cheating" rather than rational re-optimization. This masks the hyperbolic effect.
      *   **Rationality Misinterpretation:** Students may view tearing the treaty as "irrational." Correct this: It is *locally rational* under hyperbolic discounting, even if *globally suboptimal*.

  ---

  ## 5. Design Critique & Falsification Conditions

  ### What Could Go Wrong (Pilot Predictions)
  1.  **The "Good Student" Bias:** Upper-level undergraduates often want to please the instructor. They may honor treaties even when the temptation is high, suppressing the preference reversal. 
      *   *Mitigation:* The Facilitator must emphasize that "Tearing is a valid strategic move, not a moral failure."
  2.  **Payoff Confusion:** The math (Take 2 - 1 Penalty - 1 Tear Cost = 0 Net Immediate) is tight. If students calculate strictly, Waiting (0 Now, +5 Later) dominates Tearing (0 Now, +0 Later). 
      *   *Risk:* If the math is too cold, no one tears. The game relies on the **Tenure Pressure** (Reputation during R1-4) to make the "2 points now" feel valuable enough to override the arithmetic.
  3.  **Role Confusion:** Students might forget to switch roles after Round 4, breaking the symmetry of the experience.

  ### Where Reasoning Might Be Wrong
  The design assumes the **Tenure Pressure** instruction is sufficient to simulate the liquidity preference of hyperbolic discounting. 
  *   **Potential Flaw:** If students care *only* about the Final Ranking (as per the standard payoff rule), rational agents will never tear the treaty. The 5-point reward is objectively superior to the net-zero gain of tearing. 
  *   **Correction:** If the pilot shows 0% treaty tearing, the payoff structure is too weighted toward long-term rationality. The "Take 2" option needs a higher immediate subjective value (e.g., allowing Present-Self to physically hold the tokens during their tenure, creating an endowment effect).

  ### What Would Change My Mind (Falsification)
  I would consider this design **ineffective** if, in a pilot run:
  1.  **Zero Preference Reversal:** No pairs tear a treaty signed in a negotiation break. This would indicate the "cost of tearing" (1 point) + "penalty" (1 point) successfully deterred the impulse, meaning the hyperbolic spike wasn't visceral enough to override the penalty.
  2.  **Uniform Cooperation:** All pairs achieve the theoretical maximum score. This would suggest the game measures *collaborative ability* rather than *intertemporal conflict*.
  3.  **Phenomenological Disconnect:** In the debrief, if students report feeling *anger at their partner* rather than *frustration with the situation*, the interpersonal framing has overshadowed the intrapersonal lesson. The conflict must feel like a structural trap, not a partner betrayal.

  If any of these occur, the game requires a **Liquidity Mechanism** adjustment: Present-Selves must be allowed to "spend" pool tokens on small, immediate tangible rewards (e.g., leaving class 5 minutes early, a candy bar) that Future-Selves cannot access. Without differential liquidity, hyperbolic discounting remains abstract rather than visceral.
