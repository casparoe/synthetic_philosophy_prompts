answer: |-
  This is a sophisticated disagreement that sits right at the boundary of decision theory, finance, and philanthropy. Your trustee is quoting real mathematics (the Kelly Criterion and Growth-Optimal Portfolio theory), but whether that mathematics *maps* to your foundation's situation is highly contestable.

  The slogan "maximise the geometric mean, not the arithmetic mean" is a shorthand for a family of related but distinct claims. Below is the menu you requested, followed by the three specific pin-downs.

  ### The Menu of Interpretations

  Here are six distinct propositions your trustee might be asserting. I have categorised them by their truth status and whether they actually support rejecting the long-shot grant.

  #### 1. The Compounding Necessity Claim
  *   **The Claim:** The geometric mean is the correct metric *if and only if* winnings are reinvested into the bankroll. If you do not reinvest, the arithmetic mean (Expected Value) is the correct metric.
  *   **Status:** **Substantive and Defensible.** This is the mechanical core of Kelly theory. Geometric growth describes the rate at which a bankroll expands over time *when profits are compounded*. If you withdraw profits (or spend them on grants that do not replenish the endowment), the bankroll does not compound based on grant success.
  *   **Supports Trustee?** **No.** Based on your description ("none of the good a grant does comes back to us... next year's budget is just the endowment's investment return"), your grantmaking budget is a *flow*, not a compounding *stock*. Grant success does not increase next year's grant budget. Therefore, the geometric mean of financial capital is irrelevant to grant selection. It applies to your *investment* manager, not your *grants* committee.

  #### 2. The Log-Utility Claim
  *   **The Claim:** Maximising the geometric mean is mathematically identical to maximising Expected Utility with a logarithmic utility function ($U(w) = \ln w$). The trustee is simply asserting that the foundation has log utility over outcomes (money or impact).
  *   **Status:** **Platitude (Mathematically), Substantive (Normatively).** It is a tautology that Geometric Mean Maximisation $\equiv$ Log-Utility Maximisation. The substantive question is: *Does the foundation actually have log utility?* Log utility implies diminishing marginal returns and a specific level of risk aversion.
  *   **Supports Trustee?** **Maybe.** If the foundation has log utility over *impact*, it naturally discounts low-probability, high-impact events compared to Expected Value (arithmetic mean). However, log utility does not automatically rule out long shots; it just sizes them smaller than EV maximisation would. It only rules them out if the risk of "zero impact" is weighted heavily enough to drag down the expected log utility below the safe option.

  #### 3. The Ergodicity (Time vs. Ensemble) Claim
  *   **The Claim:** The arithmetic mean is an average across parallel universes (ensemble), but we only live in one timeline (time average). For long-horizon agents, the time-average growth rate (geometric mean) is the only one that reflects reality.
  *   **Status:** **Substantive and Defensible.** This is the Ole Peters / Ergodicity Economics framing. It argues that EV maximisation can lead to ruin in a single timeline even if it looks good across infinite parallel universes.
  *   **Supports Trustee?** **Weakly.** This argument relies on the "long run." If your foundation intends to exist in perpetuity, time-averaging matters. However, it again hinges on *compounding*. If the "wealth" being tracked is *cumulative good done*, does good compound? If a policy change (the long shot) creates a permanent tailwind for future good, then yes. If the grants are one-off services, then no.

  #### 4. The Asymptotic Dominance Claim
  *   **The Claim:** A strategy that maximises geometric mean will almost surely end up with more wealth than any other strategy given enough time.
  *   **Status:** **True (with caveats).** In a repeated betting scenario with reinvestment, the Kelly bettor's wealth ratio to any other bettor tends to infinity almost surely.
  *   **Supports Trustee?** **No.** "Almost surely" applies as $N \to \infty$. With 20 grants a year, how many years until dominance kicks in? Decades or centuries. Furthermore, this theorem assumes the bets are *favorable* (positive expected growth). If the long shot has negative expected geometric growth, Kelly says don't take it. But if it has positive geometric growth (even if lower than the safe bet), Kelly says take *some* of it, just not all. It rarely argues for zero allocation unless the edge is negative.

  #### 5. The Median Outcome Claim
  *   **The Claim:** The geometric mean approximates the median outcome of the distribution after many trials. The arithmetic mean is skewed by rare outliers. We should care about the median (typical) future, not the mean (skewed) future.
  *   **Status:** **Substantive.** In log-normal distributions, the geometric mean *is* the median. For heavy-tailed distributions (like your long shot), the mean and median diverge wildly.
  *   **Supports Trustee?** **Yes, potentially.** If the long shot has a 96% chance of doing very little and a 4% chance of doing massive good, the *median* outcome is "very little." If the trustees are motivated by "what will we likely be able to report to stakeholders in 5 years?", the median argument supports the safe programme. This is often the unspoken psychological reality behind the math slogan.

  #### 6. The Estimation Risk (Fractional Kelly) Claim
  *   **The Claim:** Because probabilities are uncertain, we should bet less than full Kelly. Since the long shot relies on uncertain probability estimates (the 4%), we should discount it heavily.
  *   **Status:** **Substantive and Defensible.** This addresses your third pin-down.
  *   **Supports Trustee?** **Yes.** If the 4% is a point estimate with high variance (it could be 0.1% or 10%), the optimal fraction to bet drops significantly. This is the strongest mathematical argument for caution on the long shot, though it usually suggests *scaling down* the bet, not necessarily rejecting it entirely unless the uncertainty is extreme.

  ---

  ### The Three Pin-Downs

  Here is how to apply the menu to your specific constraints.

  #### 1. The Feedback Loop (Budget Fixed vs. Endowment Growth)
  **This is the critical failure point in your trustee's argument.**
  Kelly Criterion and Geometric Mean Maximisation are theories of *capital allocation under reinvestment*. They answer the question: "What fraction of my *current* bankroll should I risk to maximise *future* bankroll?"

  *   **Your Situation:** Your grant budget is determined by investment returns on the endowment, *not* by the success of previous grants. A successful grant does not increase next year's budget. A failed grant does not decrease it (beyond the spent cost).
  *   **Implication:** You are not *investing* the endowment in the grants; you are *spending* the yield. There is no compounding of financial capital based on grant performance.
  *   **Verdict:** Unless you define your "bankroll" as "Total Cumulative Impact" and argue that impact compounds (e.g., a policy change makes future grants more effective), the geometric mean argument **does not apply to grant selection**. It applies to the investment committee managing the endowment assets. If the trustee insists on using it for grants, they must justify why "Impact" compounds financially or operationally.

  #### 2. Non-I.I.D. Bets (The "Long Run" Problem)
  Kelly theory assumes repeated draws from the same distribution (i.i.d.). You noted that every grant is unique.
  *   **The Cash-Out:** For the "long run" to cash out, the foundation must view itself as a perpetual entity making a sequence of distinct bets where the *law of large numbers* applies to the *portfolio of decisions*, even if the individual distributions differ.
  *   **Implication:** If you exist in perpetuity, you can treat the 20 grants/year as a stream. However, the "Asymptotic Dominance" claim (Menu #4) takes a very long time to materialise. If the foundation has a 50-year horizon, the "almost surely" guarantee is weak.
  *   **Verdict:** The non-i.i.d. nature weakens the "Asymptotic Dominance" argument but leaves the "Expected Log Utility" (Menu #2) argument intact. You can still maximise expected log utility on a deal-by-deal basis without needing identical distributions. However, without reinvestment (see Pin-Down 1), even this is normatively optional, not mathematically mandated.

  #### 3. Parameter Uncertainty (Betting Less than Kelly)
  You asked if uncertainty implies betting *less* than Kelly.
  *   **The Math:** Yes. This is known as **Fractional Kelly**. If your edge is uncertain, the optimal fraction of the bankroll to wager is reduced to account for the variance in your estimate. In the limit of high uncertainty, the bet size approaches zero.
  *   **The Nuance:** This supports *caution*, but it is not a binary "No." It suggests that if the 4% probability is highly uncertain (e.g., based on weak evidence), the allocation should be small.
  *   **Verdict:** This is the most charitable reading of your trustee's position. They may be intuitively sensing that the 4% is a "soft" number. However, using this to completely rule out the long shot requires arguing that the uncertainty is so high the expected log utility is *negative*, not just lower than the arithmetic mean suggests.

  ---

  ### Synthesis: What to say in the meeting

  Your trustee is likely conflating **Investment Strategy** (where Kelly/Geometric Mean is king) with **Grant Strategy** (where it is optional and context-dependent).

  **The most probable reading of their slogan:**
  They are likely asserting **Menu #2 (Log Utility)** disguised as **Menu #1 (Compounding)**. They believe the foundation should act as if it has log utility over impact, which discounts the long shot. They are using the "Geometric Mean" phrasing because it sounds more objective than saying "I feel risk-averse."

  **How to push back (without being confrontational):**

  1.  **Isolate the Reinvestment Assumption:** "The geometric mean is the correct metric for *compounding* capital. Since our grant successes do not replenish our grant budget, we are not compounding financial capital on these decisions. Are we instead maximising the geometric mean of *impact*? If so, does impact compound?"
  2.  **Challenge the Binary:** "Even if we accept Log Utility (which is equivalent to Geometric Mean), that rarely implies a zero allocation to high-variance bets. It implies a *smaller* allocation. Does the math actually say 'zero', or does it just say 'less than Expected Value'?"
  3.  **Invoke Estimation Risk:** "If your concern is that the 4% probability is uncertain, that argues for Fractional Kelly. That supports sizing the grant smaller, not necessarily rejecting it if the upside is truly vast."

  **Summary Verdict:**
  *   **Platitude:** "Geometric mean is better for long-term growth." (True only if you reinvest).
  *   **Substantive:** "We should maximise Expected Log Utility of Impact." (A valid normative stance, but not a mathematical theorem).
  *   **False:** "Geometric Mean maximisation is the universally correct rule for grantmaking." (False because grants are expenditures, not reinvestable bets).

  The trustee is using a financial theorem to solve a philanthropic allocation problem. The math is real, but the map does not match the territory.
