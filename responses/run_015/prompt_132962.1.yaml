prompt: |-
  hi — hoping you can help me settle an argument I keep having on my grant panel.

  I'm on the grants commitee of a small health-focused foundation. We've got an endowment, we make twenty-odd grants a year, and none of the good a grant does comes back to us in any form — no equity, no clawback, next year's budget is just the endowment's investment return. Right now we're choosing between a well-evidenced programme that reliably does a decent amount of good per £, and a long shot: maybe a 4% chance of a policy change that would be worth vastly more in expectation.

  One of the trustees keeps shutting the discussion down with "maximise the geometric mean, not the arithmetic mean", in the tone of someone quoting a theorem. I've read a bit of the Kelly stuff and I get that there's a real result somewhere in there, but I can't get crisp about whether it applies to us, and I definitely can't tell which version of the claim he needs it to be.

  What I'd like is a menu, not a verdict. Can you lay out the distinct precise things that slogan could be asserting? Ones I can think of: the purely descriptive point about compounding; the time-average-versus-ensemble-average point; the reading on which it's just expected utility maximisation with log utility wearing a lab coat; the asymptotic dominance claim (the Kelly bettor ends up richer than anyone else — surely, almost surely, or only up to a factor?); the median-versus-mean claim, including the fact that a more aggressive strategy has higher expected wealth at every finite date; the "betting more than Kelly is bad twice over" claim; and the reading where "geometric mean" is taken across possible outcomes rather than across time, which looks like a completely different animal. Add any I've missed. For each: platitude, substantive and defensible, or false — and, crucially, whether it would actually support his conclusion.

  Three things I want pinned down especially. First: how much of the case depends on payoffs feeding back into the bankroll — what happens to each reading if I stipulate that our budget is fixed no matter how the grants turn out? Second: our bets aren't repeated draws from the same distribution, each long shot is different, so what does "in the long run" even cash out to here? Third: I've been told that if you size your bet using your point estimate of the probability, you systematically overbet when that estimate is uncertain — which would give a reading on which the slogan tells you to bet *less* than Kelly. Is that right, and where does it sit on the menu?

  If you think one reading is the one he probably means, say so — but give me the others anyway, I want something I can actually take into the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a grants committee for a small health-focused foundation.
      *   **Situation:** Argument with a trustee who keeps citing "maximise the geometric mean, not the arithmetic mean" to argue against high-risk/high-reward grants (long shots) in favor of safe, evidenced programs.
      *   **Foundation Structure:** Endowment-funded. Budget = investment return. No equity/clawback from grants (pure philanthropy). ~20 grants/year.
      *   **The Choice:** Safe/Proven (decent good/£) vs. Long Shot (4% chance, vastly higher value).
      *   **User's Goal:** Wants a "menu" of interpretations of the trustee's slogan, evaluated for truth/relevance, specifically addressing three pin-down questions (feedback loop, non-i.i.d. bets, parameter uncertainty).
      *   **Tone:** Intellectual, precise, slightly skeptical of the trustee's dogmatism, wants ammunition for a meeting.

  2.  **Deconstruct the Trustee's Slogan:**
      *   "Maximise the geometric mean, not the arithmetic mean."
      *   This is a reference to the Kelly Criterion and Growth-Optimal Portfolio (GOP) theory.
      *   *Core tension:* Arithmetic mean = Expected Value (EV). Geometric mean = Compound Annual Growth Rate (CAGR) / Long-term growth rate.
      *   *Trustee's implied conclusion:* Don't take the long shot. (Implies the long shot lowers the geometric mean even if it raises the arithmetic mean).

  3.  **Brainstorming the "Menu" of Interpretations:**
      *   *1. The Compounding/Feedback Argument:* If you reinvest winnings, geometric growth matters.
      *   *2. Time Average vs. Ensemble Average (Ergodicity):* Ole Peters' framing. One path vs. many parallel universes.
      *   *3. Log-Utility Expected Utility:* It's just EU maximization with $U(w) = \ln(w)$.
      *   *4. Asymptotic Dominance:* Kelly bettor beats others eventually (almost surely).
      *   *5. Median vs. Mean:* Geometric mean approximates the median outcome in long horizons.
      *   *6. Overbetting/Ruin:* Betting > Kelly reduces growth and increases ruin risk.
      *   *7. Cross-Sectional Geometric Mean:* (Less common) Maximizing geometric mean across a portfolio of simultaneous bets?
      *   *8. Parameter Uncertainty/Estimation Risk:* "Bayesian Kelly" or fractional Kelly due to uncertainty.

  4.  **Addressing the Three Pin-Down Questions:**
      *   *Q1: Feedback Loop (Budget Fixed vs. Endowment Growth):* This is crucial. Kelly *requires* reinvestment. If the grant budget is fixed (endowment principal untouched, grants = yield), does grant success affect future grantmaking capacity? The prompt says "none of the good a grant does comes back to us... next year's budget is just the endowment's investment return." This implies *financial* feedback is weak or non-existent regarding grant *success*. However, if the endowment itself is invested, the *investment* strategy follows Kelly, but does the *grantmaking* strategy? If grants don't replenish the endowment, Kelly logic applies weakly to grantmaking unless "wealth" is defined as "total good done."
      *   *Q2: Non-I.I.D. Bets (One-off Long Shots):* Kelly assumes repeated bets. If every grant is unique, does "long run" exist? If the foundation exists in perpetuity, yes. If it's 20 grants/year forever, the law of large numbers applies across *time*, even if distributions differ, provided expectations are stable.
      *   *Q3: Parameter Uncertainty:* Does uncertainty imply betting *less* than Kelly? Yes, "Fractional Kelly" is standard advice when probabilities are uncertain.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate that the trustee is quoting real math but maybe misapplying it.
      *   **The Menu (The Core):** Go through the brainstormed list.
          *   For each: Define it. Verdict (Platitude/Substantive/False). Does it support the trustee?
          *   *Crucial nuance:* The foundation's "currency." Is it money or "good done"? If it's money, Kelly applies to the *endowment investment*, not necessarily the grants if grants don't replenish the pot. If it's "good done," does "good" compound? Usually no. This is a major weak point in the trustee's argument.
      *   **Addressing the Three Pin-Downs:**
          *   *Feedback:* If grants don't replenish the budget, the "bankroll" doesn't grow based on grant success. Kelly breaks.
          *   *Non-I.I.D.:* "Long run" means perpetual existence. If the foundation closes in 10 years, Kelly is less relevant.
          *   *Uncertainty:* Yes, uncertainty argues for *smaller* bets (Fractional Kelly), which might actually support the trustee (don't bet the farm on the long shot), but doesn't necessarily rule out the long shot entirely.
      *   **Synthesis/Advice:** What is the trustee *actually* saying? Likely conflating investment strategy with grant strategy, or assuming "good" compounds like money.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Feedback:* The prompt says "next year's budget is just the endowment's investment return." This means grant *outcomes* do not affect the budget. Grant *success* does not yield more money. Therefore, the "bankroll" for grantmaking is *not* updated by grant performance. This is a fatal blow to the Kelly argument for *grant selection*. Kelly is about bet sizing relative to *current wealth*. If wealth doesn't change based on the bet outcome, you aren't compounding. You are just spending flow.
      *   *Wait, is that true?* If the endowment is £100M, return is 5%, budget is £5M. If a grant cures a disease, does the endowment grow? No. So the "bet" is spent. It's not an investment of the bankroll; it's an expense. Kelly applies to *investing*, not *spending*, unless the spending generates more investable capital.
      *   *Counter-argument:* Maybe the "wealth" is "total utility generated." If utility compounds (e.g., a policy change enables future good), then maybe. But the prompt says "none of the good... comes back to us."
      *   *Conclusion on Feedback:* The trustee is likely misapplying financial Kelly to philanthropic spending. This needs to be highlighted gently but firmly.
      *   *Refining the "Long Shot":* A 4% chance of vast good. Arithmetic Mean (EV) is high. Geometric Mean? If it's a binary "all or nothing" on the *value*, the geometric mean of *value* might be low. But again, does value compound?
      *   *Refining the "Uncertainty":* If the 4% is uncertain (could be 1%), Kelly says bet less. This supports caution but not necessarily rejecting the high-EV option entirely.

  7.  **Structuring the Response:**
      *   **Opening:** Validate the user's skepticism.
      *   **The Menu:** 6-7 distinct interpretations.
      *   **The Three Pin-Downs:** Dedicated section.
      *   **The Verdict on the Trustee:** What they likely mean vs. reality.
      *   **Closing:** Actionable advice for the meeting.

  8.  **Tone Check:**
      *   Needs to be rigorous but accessible.
      *   Avoid taking sides definitively, but provide the tools to dismantle the dogmatic claim.
      *   Use the user's terminology ("platitude, substantive, false").

  9.  **Final Review against constraints:**
      *   Did I cover the feedback loop? Yes (Critical).
      *   Did I cover non-i.i.d.? Yes.
      *   Did I cover parameter uncertainty? Yes.
      *   Is it a menu? Yes.

  *(Self-Correction during final review)*: I need to be careful about the definition of "Geometric Mean" in the context of philanthropy. In finance, it's growth of capital. In philanthropy, it's usually "expected utility." If the foundation has Log Utility of *Impact*, then maximizing Geometric Mean of *Impact* is equivalent. But does Impact compound? If I save a life today, does that help me save more lives tomorrow? Not directly for the foundation's budget. So the "compounding" argument is weak unless the *mission* is viewed as a perpetual compounding engine of social good (e.g. policy change enables future work). I must distinguish between *financial* compounding (endowment) and *impact* compounding. The trustee seems to be applying financial logic to impact spending.

