answer: |-
  This is a sophisticated and well-constructed *reductio*. You have effectively reconstructed a version of the "Pascal's Mugging" collapse problem, specifically tailored to show that unbounded expected value (EV) reasoning combined with Solomonoff-style priors leads to decision-theoretic paralysis (or arbitrariness) rather than fanaticism.

  Your intuition in step (7) is the correct diagnostic tool: if an argument implies that you cannot decide whether to take an aspirin, the argument is unsound, because you *can* decide whether to take an aspirin. Since you wish to retain Fanaticism (1) and the Unboundedness of stories (2), you must locate the error in the symmetry assumptions or the aggregation of those stories.

  Here is the analysis of where the argument breaks, why it looked innocent, and the cost of the repair.

  ### 1. The Verdict: Reject Premise (3)

  You should reject **(3)**: *For every such story H there is a mirror story H*, of the same description length... on which a yields the matching disvalue.*

  While (3) appears to rely on a logical symmetry (negation), it fails as a claim about **epistemic probability relative to evidence**.

  #### Why (3) looked innocent
  Premise (3) relies on the intuition that "description length" (Kolmogorov complexity) is insensitive to the *sign* of the value. In a vacuum of pure logic, the string "Universe contains $10^{100}$ units of good" and "Universe contains $10^{100}$ units of bad" are indeed of similar complexity. It treats value as a primitive label attached to a hypothesis, where flipping the label costs no bits.

  #### Why (3) is false
  Description length is not measured in a vacuum; it is measured relative to a **background theory** or **reference machine** that encodes your evidence.
  1.  **Causal Asymmetry:** Your evidence includes a causal model of the world. A story where "Action $a$ yields $V$" requires a causal mechanism linking $a$ to $V$.
      *   *Benign Case:* "Aspirin relieves headache." This fits neatly into your background biochemical model. The description length is short because you can reference existing laws.
      *   *Mirror Case:* "Aspirin causes astronomical catastrophe." To make this compatible with your evidence (that aspirin is a salicylate and catastrophes are astrophysical), the hypothesis must include a *new* mechanism (e.g., "Aspirin emits a signal to aliens"). This mechanism adds description length.
      *   *The "Mirror" of the Catastrophe:* "Aspirin prevents astronomical catastrophe." This requires the *same* new mechanism.
      *   *The Problem:* While the "Catastrophe" and "Utopia" stories might be symmetric *with each other*, they are **not symmetric with the null hypothesis** ("Aspirin does nothing big"). Both require extra bits to override the background model.
  2.  **Value is not a Bit-Flip:** In many axiologies, "Good" and "Bad" are not symmetric primitives. For example, if value is grounded in the satisfaction of preferences, a "Good World" might be one where preferences are satisfied (order), and a "Bad World" might be one where they are frustrated (disorder). Describing a specific, coherent high-value structure might be more complex than describing a high-disvalue chaotic state, or vice versa. There is no *a priori* guarantee that the simplest way to realize $+V$ is the same length as the simplest way to realize $-V$.
  3.  **Evidential Conditioning:** Premise (2) says stories must be "compatible with my evidence." Your evidence likely includes the fact that you have not yet been mugged by a demon, nor have your trivial actions previously triggered catastrophes. A hypothesis that says "This action triggers a catastrophe" must explain *why this hasn't happened before* (e.g., "It's the first time"). A hypothesis that says "This action does nothing" does not need that extra clause. Thus, the "catastrophe" story is longer than the "null" story. While the "utopia" story is equally long, the *pair* of high-stakes stories is less probable than the low-stakes story.

  **The Fix:** You argue that while high-stakes stories exist (saving 2), they do not come in perfectly cancelling pairs *relative to the action difference*. Even if $EV(A)$ and $EV(\neg A)$ both have huge undefined tails, the *difference* $EV(A) - EV(\neg A)$ might be well-defined if the tails are independent of the action. If the tails *are* dependent on the action (required for fanaticism), you must argue that your background theory assigns higher prior weight to the positive tail than the negative tail (Axiological Asymmetry).

  ### 2. The Status of Premise (5)

  You mentioned oscillating between (3) and (5). Premise (5) is the claim that *ranking is settled by nothing but residual asymmetry... arbitrary in principle.*

  If you successfully reject (3), (5) loses its force. However, there is a technical nuance here regarding **Conditional Convergence**.
  *   If the series $\sum P(H_i) U(H_i)$ is not absolutely convergent (which Fanaticism implies), the sum is undefined. Rearranging terms changes the result.
  *   Premise (5) assumes that because the "bulk" cancels, the remainder is arbitrary.
  *   **Correction:** If you reject (3), you assert that the series does *not* cancel. It diverges to $+\infty$ or $-\infty$, or converges to a specific value based on the asymmetry.
  *   **Cost:** To reject (5), you must accept that rational choice is possible even when EV is driven by tail asymmetries that are not empirically resolvable. This commits you to the view that **priors encode substantive axiological commitments.** You cannot claim to be "neutral"; your prior must favor "Good Miracles" over "Bad Miracles" (or vice versa) to make action $A$ preferable to $B$.

  ### 3. The "Length-Stake Bound" Proposal

  You asked: *Does a story of description length n may carry stakes of at most $2^{n/2}$... survive step (2)?*

  **No.** This bound directly contradicts Premise (2).
  *   (2) asserts: $\exists$ stories of length $n$ with stake $\approx 2^n$.
  *   Bound asserts: $\forall$ stories of length $n$, stake $\le 2^{n/2}$.

  **Is this bounded utility under another name?**
  Yes, effectively. If $Stake(n) \le 2^{n/2}$ and $Prior(n) \approx 2^{-n}$, then the expected contribution is $\approx 2^{-n/2}$. The sum $\sum 2^{-n/2}$ converges.
  *   If the total EV is finite, you are no longer a Fanatic in the sense defined in (1).
  *   Recall (1): For *every* finite $U$, there is a $V$...
  *   If the utility function is effectively bounded by the convergence of the series, there will be some $U$ (the bound) that cannot be outweighed by any probability $p$.
  *   **Verdict:** Adopting this bound saves decision theory from collapse (it solves the Pasadena/St. Petersburg issues) but it **abandons Fanaticism (1)**. Since your goal is to defend Fanaticism, you cannot adopt this bound without changing your thesis to "Timid Decision Theory."

  ### 4. Dissertation Strategy

  To save Fanaticism while avoiding the collapse you've identified, your chapter should argue for **Asymmetric Priors over High-Stakes Hypotheses**.

  1.  **Concede the Logic:** Acknowledge that *if* priors were symmetric over value-signs for causal hypotheses, Fanaticism would collapse into arbitrariness (your steps 1–6 are valid conditional on 3).
  2.  **Attack the Symmetry (Reject 3):** Argue that rational agents possess background causal theories that break the symmetry.
      *   *Example:* We have inductive evidence that the universe is stable. "Action $A$ destroys the universe" requires a hypothesis that overrides this stability. "Action $A$ saves the universe" requires the same override.
      *   *The Fanatical Move:* You must argue that we have *some* reason to think the "override" is more likely to be positive than negative. This is difficult.
      *   *Alternative:* Argue that the "Mirror" stories are **irrelevant to the choice**. If $H$ says "A yields $V$" and $H^*$ says "A yields $-V$", but both say "B yields $V$" and "B yields $-V$" respectively, they cancel in the comparison $EV(A) - EV(B)$. Fanaticism only requires that *some* stories break this symmetry (i.e., where $A$ affects the tail and $B$ does not).
  3.  **Reframe the "Collapse":** Argue that the "arbitrariness" in (5) is not a bug but a feature of **radical normative uncertainty**. If the tails are truly symmetric, then indeed, we should be indifferent. Fanaticism only demands we pursue the tail when we have reason to believe it is positive.
  4.  **Address the "Aspirin" Objection (7):** Explain that for ordinary actions, the "high-stake" stories are so complex (low prior) that they are swamped by the "low-stake" stories *unless* the low-stake EVs are nearly equal. In the aspirin case, the low-stake EV (headache relief) is decisive. The high-stake tails are symmetric and cancel out (or are independent), leaving the ordinary decision intact. Fanaticism only kicks in when the ordinary EVs are negligible compared to the tail (e.g., existential risk mitigation).

  ### Summary of Costs

  *   **Rejecting (3):** Costs you the "neutrality" of your prior. You must defend the claim that the universe is not symmetrically malleable by trivial actions regarding good vs. bad outcomes.
  *   **Keeping (1) & (2):** Commits you to the view that EV sums may diverge, requiring a decision rule for divergent series (e.g., comparing tail growth rates) rather than simple summation.
  *   **Rejecting the Bound:** Saves Fanaticism but leaves you vulnerable to the "Pasadena Game" objection (that EV is undefined). You will need a supplementary account of how to compare actions when EV is undefined (e.g., "Relative Expectation Theory" or "Tail Dominance").

  **Recommendation:** Center the chapter on the failure of the **Mirror Principle (3)** in the presence of **Causal Background Knowledge**. This allows you to keep the unbounded stakes (2) and the fanatical ranking (1) for cases where the causal link is specific to the action, while explaining why ordinary deliberation (7) remains stable (because the causal links for ordinary actions don't support the high-stake mirrors).
