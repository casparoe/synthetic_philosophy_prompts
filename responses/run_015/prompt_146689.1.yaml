answer: |-
  You spelled it right: **Kalai-Smorodinsky (KS)**. You have a great intuition for why standard 50/50 splits fail in community contexts. Nash bargaining splits the *surplus* equally, which ignores that $1,000 means survival to one person and a nice dinner to the other. KS is better because it equalizes the **proportion of satisfaction** each person gets relative to their own best and worst cases.

  However, a warning: If you run KS on raw **dollars**, it often rewards the person with the better outside option (the one with the job). To make it work for your moral intuition (helping the stuck person), you must run KS on **utility (satisfaction/need)**, not currency.

  Here is your 30-minute "Proportional Fairness" Protocol.

  ### The 30-Minute Proportional Fairness Checklist

  **Pre-Condition:** Both parties must agree to use this method before you start. If one refuses, stop.

  #### Step 1: Define the "Pot" (5 Minutes)
  *   **Action:** List every tangible asset to be split (cash, equipment, inventory). Assign a quick market value.
  *   **Enough Info:** A written list both sign.
  *   **Hard No:** If they cannot agree on what the assets are worth (e.g., one says the oven is $5k, the other says $500), pause and get a third-party appraisal or sell the item and split cash. Do not mediate value disputes.
  *   **Judgment Call:** Sentimental value. If one person cries over a specific tool, you must decide if that emotional value counts. *Recommendation:* Do not count emotions in the math; let the other party "gift" the item to keep the peace, then adjust the cash.

  #### Step 2: The "Walk-Away" Number (Disagreement Point) (5 Minutes)
  *   **Action:** Ask each person privately: "If you leave this room right now with nothing from this partnership, what is your life situation worth in 'Survival Points'?"
  *   **The Hack:** Do **not** use dollars here. Use a **0–10 Satisfaction Scale**.
      *   0 = Homeless/Starving/Catastrophe.
      *   5 = Stable/Getting by.
      *   10 = Thriving/No worries.
  *   **Enough Info:** A private number written on a card.
  *   **Hard No:** If a person refuses to estimate their fallback or says "I'll burn it all down," stop. This requires rational actors.
  *   **Judgment Call:** Verifying truth. You have to gauge if "0" is real or bluffing. Look at their body language and known circumstances.

  #### Step 3: The "Dream" Number (Utopia Point) (5 Minutes)
  *   **Action:** Ask: "If you got 100% of the Pot and kept your outside options, where are you on the 0–10 Scale?"
  *   **Enough Info:** A second private number on the card.
  *   **Note:** Usually, getting the whole Pot moves someone from a 4 to an 8, or a 6 to a 9.
  *   **Judgment Call:** Capping unrealistic dreams. If someone says getting $5k makes them a "10" but you know they have $20k debt, gently reality-check them: "Does this actually solve the debt, or just pause it?"

  #### Step 4: The Ratio Calculation (Mediator Only) (5 Minutes)
  *   **Action:** You do the math on a whiteboard (hide the numbers).
      *   **Person A Range:** (Dream Score) minus (Walk-Away Score).
      *   **Person B Range:** (Dream Score) minus (Walk-Away Score).
      *   **Goal:** Find a split of the Pot where both parties achieve the **same percentage** of their Range.
      *   *Formula:* $\frac{\text{Actual Outcome} - \text{Walk-Away}}{\text{Dream} - \text{Walk-Away}} = \text{Same \% for Both}$
  *   **Enough Info:** A proposed split (e.g., "A gets 40%, B gets 60%").
  *   **Judgment Call:** If the math suggests a split that leaves one person below a "5" (Survival), you must override the math. KS is about fairness, not letting someone starve.

  #### Step 5: The Offer & Adjustment (10 Minutes)
  *   **Action:** Present the split as "This gives you both 70% of the way from your worst case to your dream."
  *   **Hard No:** If one party rejects the proportional logic and demands 100%, mediation is over. Refer to court or arbitration.
  *   **Judgment Call:** Rounding. Math might say $4,321. Round to $4,500 for peace.

  ---

  ### Applying the Protocol to Your Three Scenarios

  Here is how the "Satisfaction Scale" changes the outcome compared to raw dollars.

  #### Scenario 1: The Food Truck (Job vs. Stuck)
  *   **The Pot:** Truck + Cash = $50,000 value.
  *   **Person A (Job Offer):**
      *   Walk-Away: Has a job. Life is stable. **Score: 6**.
      *   Dream: Job + Full Truck. Life is great. **Score: 9**.
      *   Range: 3 Points.
  *   **Person B (Stuck):**
      *   Walk-Away: No job, no savings. Life is crisis. **Score: 1**.
      *   Dream: Full Truck. Life is stable. **Score: 7**.
      *   Range: 6 Points.
  *   **The Math:**
      *   To be fair, both need to gain the same *percentage* of their Range.
      *   B's range is twice as big (6 points vs 3 points). B needs twice as much "satisfaction gain."
      *   Since money helps B more (marginal utility), the math will assign **more cash to B**.
      *   *Result:* B might get $35k, A gets $15k. A still keeps their job security (their 6), plus cash. B gets rescued from 1 to 5. Both move 50% up their ladder.
  *   **Outcome:** Fairer than 50/50. B gets more because the money matters more to their survival scale.

  #### Scenario 2: The Grant Money (Scholarship vs. Broke)
  *   **The Pot:** $20,000 Grant.
  *   **Person A (Scholarship):**
      *   Walk-Away: Has backup funding. **Score: 7**.
      *   Dream: Grant + Scholarship. **Score: 8** (Diminishing returns; they don't *need* it).
      *   Range: 1 Point.
  *   **Person B (Broke):**
      *   Walk-Away: Rent due, eviction risk. **Score: 1**.
      *   Dream: Grant pays rent + studio. **Score: 8**.
      *   Range: 7 Points.
  *   **The Math:**
      *   A's range is tiny (7 to 8). B's range is huge (1 to 8).
      *   To give A 50% of their range, they only need a tiny bit of money.
      *   To give B 50% of their range, they need a lot of money.
      *   *Result:* B gets almost everything (e.g., $18k), A gets a token amount (e.g., $2k).
  *   **Outcome:** Highly equitable based on need. A is furious if they don't understand the "Scale" logic, so you must explain: "You are already safe. This money saves them."

  #### Scenario 3: The Hidden Outside Option (The Lie)
  *   **The Setup:** Person A says their Walk-Away is "Score 2" (Desperate), but actually they have a secret investor lined up (Real Score 8).
  *   **The Math Failure:**
      *   The system thinks A is desperate (Range 2 to 9 = 7 points).
      *   The system thinks B is desperate (Range 2 to 9 = 7 points).
      *   Math produces a 50/50 split.
      *   *Reality:* A didn't need the deal. A just stole 50% of the pot they didn't need. B is ruined.
  *   **The Fury:** When B finds out A had an investor, the KS agreement collapses because the "Disagreement Point" was fraudulent.
  *   **Mediator Fix:** This is where the protocol breaks. You cannot calculate proportional fairness on lies.
      *   *Action:* You must include a "Good Faith Affidavit." Both sign a paper saying, "I have disclosed all material outside options." If discovered false later, the deal is voided and penalties apply.
      *   *Judgment Call:* If you suspect A is lying in the room, you cannot force truth. You must warn B: "This math only works if your numbers are real. If you suspect they are lying, do not sign."

  ---

  ### Where This Breaks Down (Do Not Use)

  Do not use Kalai-Smorodinsky in these four situations. It will make things worse.

  1.  **Vengeful Emotions:** If one person says, "I don't want money, I want them to suffer," utility scales break. You cannot measure "spite" on a 0–10 satisfaction scale.
      *   *Switch to:* Pure mediation (listening/emotion) or legal arbitration.
  2.  **Power Imbalance/Coercion:** If Person A is the landlord and Person B is the tenant, or there is a history of abuse. Person B will lie and say they are "happy" (Score 10) just to end the meeting safely.
      *   *Switch to:* Advocacy/Shuttle mediation (you talk to them in separate rooms).
  3.  **Incommensurable Values:** If the asset is a child, a pet, or a family heirloom. You cannot put a "Dream Score" on these without trivializing them.
      *   *Switch to:* Custody/Ownership schedules, not value splits.
  4.  **Strategic Lying:** As seen in Scenario 3. If the community is small and gossip is high, people will game the "Walk-Away" score to look more desperate than they are to get a bigger slice.
      *   *Fix:* Require proof of fallback (e.g., show the job offer letter) before running the numbers.

  ### Summary for Your Practice
  The Kalai-Smorodinsky solution is powerful because it admits that **fairness is proportional, not identical.** But for it to help the "stuck" person, you must measure **Need (Utility)**, not **Greed (Dollars)**.

  *   **Step 1:** Get the assets.
  *   **Step 2:** Get the "Survival Scores" (0-10), not dollar amounts.
  *   **Step 3:** Equalize the percentage gain in Score.
  *   **Step 4:** Convert back to dollars.
  *   **Step 5:** Verify honesty, or don't sign.
