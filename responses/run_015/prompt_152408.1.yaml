      *(Self-Correction on the "Essence" point)*: The paragraph says "concepts really do have essences... deep stable cores". H&S argue against the classical view of categories (necessary and sufficient conditions). They argue categories are centered around prototypes or "essences" but those essences shift. So "stable" is the killer word there.

      *(Self-Correction on the "Retrieval" point)*: H&S emphasize that memory is not a database. It's reconstructive. "Retrieval" implies pulling a file. H&S imply lighting up a network that changes the network.

