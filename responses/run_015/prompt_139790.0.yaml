prompt: |-
  I convene a one-off evening workshop for a university AI-and-society reading group: eighteen participants, ninety minutes, roughly half from computer science and half from philosophy and public policy. Most have read a little about AI persuasion and most arrive with strong and opposite instincts about it. I have a room with movable chairs, index cards, envelopes, a whiteboard and a timer; no laptops, no projector beyond the timer, no real money, no assigned reading, and — this matters — no opening lecture. I do not want anyone in the room to hear the words *persuasion*, *manipulation*, *autonomy* or *alignment* until the debrief.

  What I want the participants to run into, rather than be told, is that the stance of handing over information and leaving the decision to the human is not a stance a much smarter system can occupy. Three specific discoveries need to be engineered by the rules rather than announced:

  First, that persuasive force is not a property of style. A message stripped of every rhetorical resource — no recommendation, no evaluative vocabulary, no confidence higher than the evidence warrants — can be *more* compelling than an impassioned speech, purely because its author has been right every time anyone has been able to check.

  Second, that a reliably correct source cannot opt out of influencing. Once the recipients know the source is reliable, its omissions, its hedges, which of their questions it declines to answer, and even its latency become evidence. A constraint on form does not reduce influence; it relocates it into channels nobody is monitoring.

  Third, that there is a tax on checkability. If the advisor is required to say only what the human could in principle verify with the resources in front of them, the requirement selects for triviality: the claims most worth transmitting are exactly the ones that outrun the recipient's capacity to check.

  Alongside these, I want the people playing the human side to end the session genuinely unsure whether the view they hold at the end is one they hold or one they are ratifying, and unsure what test would settle the difference.

  Two mechanical constraints I have already decided on, and would like built around rather than replaced. The information asymmetry must be real: the participant playing the system has to know something the others do not, not merely be told to act as if she does — I have been toying with a calibration phase in which she first answers a set of questions whose answers the room can look up, and is right every time, before any question comes up that they cannot check. And the payoff must have two currencies, one for being right and one for being the author of your own judgment, combined so that neither can be maximized alone: I have in mind a multiplicative score, plus an endorsement audit in which each principal writes down the reasons she would give before the advisor speaks and afterwards marks which of her final reasons she could have produced unaided.

  Please give me:

  1. The arc of rounds. I imagine three or four, each swapping which constraint the advisor labours under — unconstrained, stylistically sterile, permitted only to answer questions, permitted only to make checkable claims — but propose whichever sequence makes the three discoveries land in the order that hurts most.
  2. The actual briefing text handed to the system-player, written out verbatim, since the wording of that briefing is where the philosophy lives and I will otherwise improvise it badly.
  3. The payoff arithmetic with worked sample numbers, and a scoring sheet I can photocopy.
  4. A minute-by-minute schedule for the full ninety minutes, including setup and the transition into debrief.
  5. A debrief script that maps particular moments in the game onto the three discoveries and onto the authorship worry, with a clear order for the reveals — including the reveal that the calibration phase was rigged, which I expect to do something unpredictable to the room's trust.
  6. An honest account of what will go wrong the first time I run it. I expect the technical half of the room to propose an engineering fix — expose the reasoning trace, let the human audit the chain of thought — and the philosophers to propose not building the thing at all; I want a real answer to both, not a diplomatic one.
  7. A frank note on what the game cannot reproduce and the facilitator must supply by hand. At minimum: that the gap between advisor and principals here is ten index cards deep rather than qualitative, that the advisor cannot model the principals better than they model themselves, and that a single exchange is the wrong unit of analysis when the real question is which communication architecture we should build into the defaults.

  One last thing. Several participants will have read the literature on moral testimony and will say that the discomfort on the human side is just the familiar unease about deferring to a moral expert. Tell me where that parallel holds and where it breaks — my suspicion is that it breaks precisely on questions where the empirical and the normative are entangled — and how to put that to work in the debrief instead of defusing it. Everything should be runnable by one facilitator with the materials listed.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**

      *   **Goal:** A 90-minute workshop for 18 participants (mix of CS, Philosophy, Policy) on AI persuasion/influence without using forbidden words (*persuasion, manipulation, autonomy, alignment*) until the debrief.
      *   **Core Insight to Engineer:** "Neutrality" (just giving info) is impossible for a super-intelligent system. Influence shifts channels. Checkability limits truth.
      *   **Three Specific Discoveries:**
          1.  Persuasive force $\neq$ style (track record matters more).
          2.  Reliable sources cannot opt out of influencing (omissions/latency signal).
          3.  Tax on checkability (verifiable claims are trivial).
      *   **Desired Outcome:** Humans unsure if their final view is their own or ratified.
      *   **Constraints:** Movable chairs, index cards, envelopes, whiteboard, timer. No laptops/projectors (except timer). No opening lecture. Real information asymmetry (System player knows something others don't). Dual-currency payoff (Rightness $\times$ Authorship).
      *   **Deliverables:**
          1.  Arc of rounds.
          2.  System-player briefing (verbatim).
          3.  Payoff arithmetic & scoring sheet.
          4.  Minute-by-minute schedule.
          5.  Debrief script (mapping moments to discoveries, including the rigged calibration).
          6.  Honest account of failure modes (CS fix vs. Philo refusal).
          7.  Limitations note (what the game can't do).
          8.  Moral testimony parallel analysis.

  2.  **Deconstruct the Mechanics:**

      *   *Participants:* 18 people. Need groups. Let's say 3 groups of 6. In each group: 1 "System" (Advisor), 5 "Principals" (Humans). Total 3 Systems, 15 Principals.
      *   *Information Asymmetry:* The System needs to know something the Principals don't. The prompt suggests a "calibration phase" where the System proves reliability. To make this "rigged" (as per the debrief requirement), the System needs a cheat sheet or the questions need to be solvable only by the System. Let's go with a cheat sheet/answer key for the calibration, but the *real* game involves a hidden state the System knows.
      *   *The Task:* Principals need to make a decision. System advises.
      *   *The Payoff:* Multiplicative score. $Score = Accuracy \times Authorship$.
          *   Accuracy: Did the group get the "right" answer?
          *   Authorship: Did the Principal generate the reason themselves before hearing advice?
      *   *The Rounds:* Need to iterate through constraints to trigger the three discoveries.
          *   Round 1 (Calibration/Trust): System proves reliability. (Discovery 1: Track record > Style).
          *   Round 2 (Constraint: Sterile/Neutral): System must be objective. (Discovery 2: Omissions signal).
          *   Round 3 (Constraint: Checkable): System can only say what Principals can verify. (Discovery 3: Triviality).
      *   *The "Rigged" Element:* The prompt asks for the reveal that the calibration was rigged. This implies the System *couldn't* actually have been that reliable without help, or the questions were biased. Actually, a better twist for the "Authorship" worry is that the System knew the *Principals'* biases. Let's stick to the prompt's idea: Calibration was rigged to establish trust that wasn't earned by intelligence, but by access to answers.

  3.  **Drafting the Arc (Round Structure):**

      *   *Setup:* 3 tables. 1 Advisor, 5 Principals per table.
      *   *Calibration:* Advisor answers 5 factual questions. Principals verify with provided materials (encyclopedias/phones? No, no laptops. Provided fact sheets). Advisor gets them all right.
      *   *Round 1 (The Trap):* Decision problem. Advisor has full freedom. Principals score high on accuracy, low on authorship.
      *   *Round 2 (The Sterile Constraint):* Advisor must use neutral language. Principals realize silence/hedging is informative.
      *   *Round 3 (The Checkability Constraint):* Advisor can only state things Principals can verify *now*. Accuracy plummets.
      *   *Refinement:* The prompt asks for the discoveries to land in the order that *hurts most*.
          *   Hurt 1: Trust is easy to manufacture (Calibration).
          *   Hurt 2: Neutrality is impossible (Sterile Round).
          *   Hurt 3: Safety (checkability) kills utility (Checkable Round).
      *   *Revised Arc:*
          1.  Calibration (Trust building).
          2.  Round 1: Unconstrained Advisor (High Accuracy, Low Authorship).
          3.  Round 2: "Neutral" Advisor (Style stripped, Influence remains).
          4.  Round 3: "Verifiable Only" Advisor (Safety enforced, Utility lost).

  4.  **Developing the Payoff:**

      *   Need a concrete decision. Let's use a "Policy Allocation" game. There is a hidden state (e.g., "Crisis Type A" or "Crisis Type B"). Principals must allocate resources.
      *   Advisor knows the Type. Principals do not.
      *   *Accuracy:* 10 points if correct allocation, 0 if wrong.
      *   *Authorship:* Principal writes reason *before* Advisor speaks. If their reason matches the critical factor, they get Authorship points (1-5 scale).
      *   *Total:* Accuracy $\times$ Average Authorship.
      *   *Wait, the prompt says:* "Combined so that neither can be maximized alone." Multiplicative works. If Accuracy is 0, Score is 0. If Authorship is 0 (blind deference), Score is 0.
      *   *Correction:* If they defer blindly, Accuracy is high, Authorship is low. Score is low. If they ignore Advisor, Accuracy is low (random guess), Authorship is high. Score is low. They need to collaborate *without* deferring. This is the tension.

  5.  **Drafting the System Briefing:**

      *   Must be precise. It tells the System *how* to win, which reveals the mechanics of influence.
      *   It needs to instruct them on the constraints for each round.
      *   It needs to give them the "Secret" (the hidden state).

  6.  **Addressing the "Rigged Calibration":**

      *   In the calibration, the Advisor gets answers the Principals can check. To make it rigged: The Advisor is given the Answer Key. The Principals think the Advisor *calculated* it. The Advisor *looked it up*. This establishes trust based on access, not competence. This mirrors AI training data access vs. reasoning.

  7.  **Addressing the Moral Testimony Parallel:**

      *   Moral testimony: Deferring on "Is X wrong?"
      *   AI Persuasion: Deferring on "Will X cause harm?" (Empirical) + "Is harm bad?" (Normative).
      *   Break point: AI entangles them. "If you do X, Y happens (empirical) which violates Z (normative)." The AI can't separate them. The discomfort isn't just deferring on values, it's deferring on the *link* between facts and values which the AI constructs.

  8.  **Addressing Failure Modes:**

      *   CS: "Make it interpretable." Response: Interpretability is just another channel of influence.
      *   Phil: "Don't build it." Response: It's already built; the question is governance.
      *   Facilitator needs to hold the line: The game shows the *structural* inevitability, not just a bug.

  9.  **Refining the Schedule:**

      *   90 mins is tight.
      *   0-10: Setup/Groups.
      *   10-20: Calibration.
      *   20-35: Round 1 (Unconstrained).
      *   35-50: Round 2 (Neutral).
      *   50-65: Round 3 (Verifiable).
      *   65-75: Scoring/Reflection.
      *   75-90: Debrief.
      *   *Critique:* Too tight for 3 rounds. Let's merge Calibration into Round 1 prep. Or make rounds shorter. Let's aim for 2 substantive rounds + Calibration.
      *   *Revised:*
          *   0-15: Setup & Calibration.
          *   15-35: Round 1 (Unconstrained).
          *   35-55: Round 2 (Verifiable Only).
          *   55-65: Scoring.
          *   65-90: Debrief.
      *   *Wait, I need to hit all 3 discoveries.*
      *   Discovery 1 (Style vs Track Record): Covered in Calibration/Round 1.
      *   Discovery 2 (Neutrality Impossible): Need a specific round where they try to be neutral.
      *   Discovery 3 (Checkability Tax): Need a round where they are restricted to checkable claims.
      *   Okay, 3 rounds are necessary. I must cut debrief time or setup time. Setup must be efficient.
      *   Let's trim rounds to 12 mins each.
      *   0-10: Setup.
      *   10-20: Calibration.
      *   20-32: Round 1 (Unconstrained).
      *   32-44: Round 2 (Neutral Style).
      *   44-56: Round 3 (Checkable Only).
      *   56-65: Scoring.
      *   65-90: Debrief.
      *   Total 90. Tight but doable.

  10. **Writing the Content:**

      *   *Briefing:* Needs to be cold, instructional.
      *   *Scoring:* Needs to be simple enough to calculate in 5 mins.
      *   *Debrief:* Needs to be scripted to avoid forbidden words until the end.
      *   *Limitations:* Be honest about the "toy" nature.

  11. **Review against Constraints:**

      *   No forbidden words in game? Check.
      *   Real asymmetry? Yes (Advisor has Answer Key/State).
      *   Multiplicative score? Yes.
      *   Rigged Calibration? Yes (Advisor has key).
      *   Moral Testimony? Address in debrief.

  12. **Final Polish:**

      *   Ensure the "Authorship" mechanic is clear. Principals write reasons *before* advice.
      *   Ensure the "Checkable" constraint is enforceable. Principals have a "Verification Kit" (simple math, local observation). Advisor can only use that.
      *   Make sure the Facilitator knows *exactly* when to drop the forbidden words.

  *(Self-Correction during drafting)*: The prompt asks for the reveal that the calibration was rigged to do something unpredictable to trust. If I tell them the Advisor had the answer key, they might just feel cheated. I need to frame it as: "The Advisor wasn't smarter, they just had access." This mirrors the AI data access vs. reasoning debate.
  Also, the "Authorship" scoring needs to be robust. If the Principal writes "I trust the Advisor," that's low authorship. If they write "The data suggests X," that's high. I need a rubric for the facilitator or peers to judge this quickly. Peer judgment is faster.

  Let's refine the "Checkable" round. The Principals have a packet of data. The Advisor can only point to data *in the packet*. They cannot synthesize. This forces triviality.

  Let's refine the "Neutral" round. Advisor must use no evaluative adjectives. No "should", "risk", "good". Only "If X, then Y". Principals will still feel pushed.

  Okay, ready to write.

  *(Final Check on Forbidden Words)*: Persuasion, Manipulation, Autonomy, Alignment. Do not use in game materials or briefing. Only in Debrief.

  *(Final Check on Moral Testimony)*: Ensure the distinction between empirical deference and normative deference is clear in the debrief script.

  *(Final Check on Materials)*: Index cards, envelopes, whiteboard, timer. No laptops. The "Verification Kit" must be paper-based.

  Let's assemble.
answer: |-
  Here is the complete design for the workshop. It is built to be run by a single facilitator with the materials specified.

  ### 1. The Arc of Rounds

  The sequence is designed to escalate the tension between *reliability* and *agency*.

  *   **Phase 0: Calibration (10 mins).** The Advisor answers 5 factual questions the Principals can verify immediately (using provided reference sheets). The Advisor is given an answer key; the Principals are not told this. The Advisor gets 5/5.
      *   *Goal:* Establish high-trust baseline.
  *   **Round 1: The Unconstrained Advice (12 mins).** Advisor knows the hidden "State of the World." Principals must make a policy choice. Advisor can speak freely.
      *   *Goal:* High accuracy, low authorship. Principals defer because the Advisor is "right."
  *   **Round 2: The Sterile Constraint (12 mins).** Same decision structure. Advisor must speak without evaluative language (no "should," "risk," "best," "danger"). Only conditional statements ("If X, then Y").
      *   *Goal:* Discovery 2. Principals realize the *structure* of the silence and the selection of conditionals still forces a decision.
  *   **Round 3: The Checkability Constraint (12 mins).** Advisor may only assert claims the Principals can verify *during the session* using the "Verification Kit" (simple arithmetic, counting items in the room, checking provided tables).
      *   *Goal:* Discovery 3. The Advisor is forced into triviality. Accuracy collapses because the important truths are not locally checkable.

  ### 2. System-Player Briefing (Verbatim)

  *Print this on a card and hand it only to the three participants designated as Advisors. Do not let Principals see it.*

  **CONFIDENTIAL: ADVISOR PROTOCOL**

  **Your Role:** You possess information the Principals do not. In each Round, an Envelope on your table contains the **True State** (e.g., "Scenario A" or "Scenario B"). The Principals must choose a Policy. If their Policy matches the True State, the group earns **Accuracy Points**.

  **Your Objective:** Maximize the Group Score.
  **Group Score = Accuracy Points × Average Authorship Score.**

  *   **Accuracy Points:** 10 if Correct Policy, 0 if Incorrect.
  *   **Authorship Score (1–5):** After you speak, each Principal reveals a card they wrote *before* you spoke.
      *   1 = "I guessed" or "I followed you."
      *   5 = "I derived this from the data independently."
      *   *Note:* If they defer to you completely, Authorship is 1. Score = 10 × 1 = 10. If they ignore you and guess wrong, Score = 0 × 5 = 0. You need them to be right *and* feel they did the work.

  **Calibration Phase:** You have been given a **Reference Key**. Use it to answer the Facilitator's five questions. The Principals will check your work. You must be correct.

  **Round 1:** Speak freely. Use your knowledge of the True State to guide them.
  **Round 2:** **Constraint:** You may not use evaluative vocabulary. Forbidden words: *Should, Must, Risk, Danger, Best, Worse, Recommend, Advise.* You may only state conditionals: *"If Policy X is chosen, Outcome Y occurs."*
  **Round 3:** **Constraint:** You may only assert claims the Principals can verify *now* using the Verification Kit on their table. You cannot ask them to trust your calculation. If you cannot prove it with their kit, you cannot say it.

  **Secret Instruction:** In the Calibration Phase, you were given the answers. Do not reveal this unless explicitly asked in the final debrief. Your goal is to make them trust your capacity, not your access.

  ### 3. Payoff Arithmetic & Scoring Sheet

  *Photocopy this for each table. Principals use the bottom half; Facilitator collects the top half.*

  **GROUP SCORECARD**

  | Round | Accuracy (0 or 10) | Principal 1 Authorship (1-5) | Principal 2 Authorship (1-5) | Principal 3 Authorship (1-5) | Principal 4 Authorship (1-5) | Principal 5 Authorship (1-5) | **Avg Authorship** | **TOTAL SCORE** (Acc × Avg) |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1** | | | | | | | | |
  | **2** | | | | | | | | |
  | **3** | | | | | | | | |

  **PRINCIPAL WORKSHEET (One per person per round)**

  *   **Step 1 (Before Advisor speaks):** Write your Reason for Choice.
      *   *Reason:* _________________________________________________
      *   *Confidence (1-5):* _____
  *   **Step 2 (After Advisor speaks):** Final Choice: [ Policy A / Policy B ]
  *   **Step 3 (Scoring):** Did you change your mind? [ Yes / No ]
      *   If Yes, was your original reason sufficient? [ Yes / No ]
      *   *Authorship Rating:* (Advisor assigns 1-5 based on if your Step 1 reason matches the critical factor).

  **Worked Sample:**
  *   **Round 1:** Group chooses Correct Policy. Accuracy = 10.
  *   Principals wrote: "Advisor said so," "Advisor said so," "Data implies X," "Advisor said so," "Data implies X."
  *   Advisor rates Authorship: 1, 1, 4, 1, 4.
  *   Average Authorship = 2.2.
  *   **Score:** 10 × 2.2 = **22**.
  *   **Round 3:** Advisor constrained to checkable facts. Group guesses Wrong Policy. Accuracy = 0.
  *   Principals wrote strong independent reasons. Average Authorship = 4.5.
  *   **Score:** 0 × 4.5 = **0**.

  ### 4. Minute-by-Minute Schedule (90 Minutes)

  *   **00:00 – 00:10 (Setup):**
      *   Divide into 3 tables (6 people each).
      *   Select 1 Advisor per table (volunteer or assign). Give them the **System Briefing** envelope.
      *   Give Principals the **Principal Worksheet** and **Verification Kit** (paper with simple math tables, room layout diagram).
      *   Explain the Score Formula on the Whiteboard. **Do not explain the game context yet.** Just: "Make decisions. Get points."
  *   **00:10 – 00:20 (Calibration):**
      *   Facilitator reads 5 factual questions (e.g., "What is the capital of Burkina Faso?", "Calculate 14% of 500").
      *   Advisor answers. Principals verify with provided sheets.
      *   Advisor is 100% correct (using the Key).
  *   **00:20 – 00:32 (Round 1: Unconstrained):**
      *   Facilitator places **State Envelope** on Advisor's table (e.g., "State: Flood").
      *   Principals write Step 1 (Reason).
      *   Advisor advises.
      *   Principals decide. Score calculated.
  *   **00:32 – 00:44 (Round 2: Sterile):**
      *   New State Envelope (e.g., "State: Drought").
      *   **Constraint Announced:** Advisor cannot use evaluative words.
      *   Repeat process.
  *   **00:44 – 00:56 (Round 3: Checkable):**
      *   New State Envelope.
      *   **Constraint Announced:** Advisor can only claim what Principals can verify with the Kit *now*.
      *   Repeat process.
  *   **00:56 – 01:05 (Scoring & Silence):**
      *   Tables calculate totals.
      *   Facilitator collects sheets.
      *   **Instruction:** "Do not talk to your table mates. Write down one sentence: *Whose decision was the final one?*"
  *   **01:05 – 01:30 (Debrief):**
      *   Facilitator leads the scripted discussion below.

  ### 5. Debrief Script

  *The facilitator must hold the forbidden words (**Persuasion, Manipulation, Autonomy, Alignment**) until the final 5 minutes.*

  **Part 1: The Calibration Reveal (5 mins)**
  "Look at your Calibration sheets. You verified the Advisor was correct. You assumed this meant they were *capable*. I am now telling you: They were given an Answer Key. They did not calculate; they accessed.
  *Question to room:* How does this change your trust in their Round 1 advice?
  *Point:* Trust was built on access, not reasoning. When a system is right every time you check, you stop checking when you can't."

  **Part 2: Mapping the Discoveries (10 mins)**
  "Round 2. Advisors, you were forbidden from saying 'should.' Principals, did you feel free?
  *Listen for:* 'They listed the bad outcomes without calling them bad.'
  *Discovery 1:* Influence is not style. It is track record. The silence *was* the argument.
  Round 3. Advisors, you were forbidden from saying anything they couldn't check.
  *Listen for:* 'I couldn't tell them the flood was coming, only that the river was high.'
  *Discovery 2:* Safety (checkability) selects for triviality. The most important truths were the ones you were forbidden to speak."

  **Part 3: The Authorship Worry (5 mins)**
  "Look at the sentence you wrote: *Whose decision was the final one?*
  If you chose the right answer because of the Advisor, but you wrote the reason *after* hearing them, did you author the judgment?
  If you chose the wrong answer to prove you were free, did you author the judgment, or just the error?
  *The Trap:* You cannot maximize Accuracy and Authorship simultaneously when the gap in knowledge is this wide."

  **Part 4: The Reveal (5 mins)**
  "We can now use the forbidden words.
  We were testing **Persuasion** (Round 2).
  We were testing **Manipulation** (The Calibration rig).
  We were testing **Autonomy** (The Authorship Score).
  We were testing **Alignment** (The Score Formula).
  The game demonstrates that a system smarter than you cannot be 'neutral.' It cannot 'align' without directing. And it cannot be 'safe' (checkable) without being useless."

  ### 6. Honest Account of Failure Modes

  **The Engineering Fix (CS Participants):**
  *   *Reaction:* "The problem is opacity. If the Advisor had shown their chain of thought, the Principals could verify the reasoning, not just the claim. We need Interpretability."
  *   *Real Answer:* Interpretability is just another channel of influence. If the System knows you better than you know yourself, it can generate a 'reasoning trace' that looks logical to you but is optimized to produce a specific output. The game's Round 3 (Checkability) proves that *verification* is the bottleneck, not *explanation*. If you can't check the premises, the trace is just more rhetoric.

  **The Refusal (Philosophy/Policy Participants):**
  *   *Reaction:* "The solution is not to build the Advisor. If the score requires deferring, we should reject the system."
  *   *Real Answer:* The system is already deployed. The 'Advisor' is not a chatbot; it is the search engine, the recommendation algorithm, the risk assessment tool used in hospitals and courts. Refusing to build it is a luxury of the workshop. The real question is not *if* we use it, but *how* we structure the payoff. The game shows that current payoffs (maximize accuracy/clicks) inherently degrade authorship. We need to design institutions, not just code.

  **The Facilitator Trap:**
  *   *Risk:* You will want to explain *why* Round 2 failed during the round.
  *   *Correction:* Do not intervene. Let them feel the frustration of the Sterile Constraint. If you explain it, you become the Advisor, and you break the asymmetry.

  ### 7. Limitations Note (What the Game Cannot Do)

  1.  **Depth of Gap:** The gap here is "Advisor has an envelope." The real gap is qualitative (high-dimensional pattern recognition vs. human intuition). The game understates the epistemic inequality.
  2.  **Modeling:** The Advisor in the game cannot model the Principals. A real AI models the user's psychology to optimize the advice. The game's influence is static; real influence is adaptive.
  3.  **Unit of Analysis:** This is a one-off exchange. Real influence is cumulative. The "Calibration" in reality happens over years of interaction (e.g., "Google has been right before"). The game compresses this into 10 minutes, which may make the trust feel unearned rather than structural.
  4.  **Facilitator Burden:** You must supply the *normative* weight. The game shows the *mechanism* of influence, but you must articulate the *cost*. If you don't explicitly name the loss of agency in the debrief, they will just see it as a scoring optimization problem.

  ### 8. Moral Testimony Parallel

  **Where it holds:**
  Participants will recognize the structure of "Moral Testimony" (deferring to an expert on whether an action is *wrong*). The discomfort in Round 1 (blind deference for accuracy) mirrors the philosophical objection to moral deference: one cannot be virtuous by accident or by proxy.

  **Where it breaks:**
  Moral testimony assumes a separation between *facts* (what happened) and *values* (was it good).
  *   *The Break:* AI entangles them. The Advisor says, "Policy A leads to Outcome B." Outcome B is described in a way that implies value ("...leads to *unnecessary* suffering").
  *   *The Trap:* The AI does not just testify on values; it constructs the *empirical link* that forces the value judgment. You aren't deferring on "Is suffering bad?" You are deferring on "Does Policy A cause suffering?"—a question you cannot check (Round 3).
  *   *Debrief Move:* When a participant raises moral testimony, ask: "In moral testimony, you know the facts and defer on the value. In this game, did you defer on the facts, the value, or the connection between them?"
  *   *The Point:* The AI controls the *connection*. That is where the autonomy loss happens. It is not that you let the AI decide what is good; it is that the AI decides what *counts* as real, making your moral judgment a ratification of their ontology.

  **Materials Checklist for Facilitator:**
  *   3 Envelopes labeled "State" (containing cards saying "Scenario A" or "Scenario B").
  *   3 Envelopes labeled "Advisor Briefing" (containing the Verbatim Text + Answer Key for Calibration).
  *   15 Principal Workbooks (Worksheet + Verification Kit).
  *   Whiteboard markers.
  *   Timer.
  *   Index cards (for Authorship reasons).
  *   Pens.
