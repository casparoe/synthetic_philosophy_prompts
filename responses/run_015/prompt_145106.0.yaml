      *Part 2 is the killer.* Dennett explicitly argues that "consciousness is a matter of competence, not substrate." The student says "only biologically evolved nervous systems." This is a fundamental misreading.
      *Part 3:* The student argues Dennett's view is unstable. This is a valid critique (the "illusion" vs "real pattern" tension). I should award points for identifying the tension, even if the conclusion is debatable.

      *Score:*
      Part 1: 2.5/3
