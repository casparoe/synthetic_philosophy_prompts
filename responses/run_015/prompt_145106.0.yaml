      Total: 6/10.

      *Wait, one more check:* Does Dennett *ever* appeal to evolutionary origin? He appeals to *evolutionary history* to explain *why* we have the stances, but not to exclude silicon. He discusses "Kinds of Minds" where he allows for non-human and potentially artificial minds if they have the right competencies. So yes, the student is wrong.

