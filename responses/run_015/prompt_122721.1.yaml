answer: |-
  **JOINT STATEMENT ON THE MORAL STATUS OF INSECTS**
  **To:** The Board of Trustees
  **From:** Dr. A. (Comparative Neuroscience) and Dr. B. (Welfare Science)
  **Date:** October 26, 2023
  **Subject:** Consensus and Residual Disagreement Regarding Invertebrate Welfare

  ### I. Areas of Consensus

  Following a year of adversarial collaboration, we submit the following numbered claims. These are not merely procedural platitudes but substantive agreements on the evidence, its limitations, and the structure of the moral problem.

  1.  **On Behavioural and Neural Markers:** We agree that no single behavioural marker (trade-off tests, conditioned place preference, analgesic modulation, judgement bias, or sensitisation) is sufficient to prove the existence of a welfare subject. However, we agree that the *conjunction* of these markers constitutes the best available evidence. Specifically, we agree that analgesic modulation (taking a cost to avoid noxious stimuli) and trade-off tests (sacrificing other goals to avoid harm) are necessary conditions for the "Threshold" view and positive evidence for the "Dimensional" view. We further agree that these markers were calibrated primarily on vertebrates (mammals and birds). Consequently, their diagnostic weight diminishes as phylogenetic distance increases, meaning positive results in insects carry less certainty than positive results in mice, though they remain the only empirical data available.
  2.  **On the Thermostat vs. Homeostatic Agent:** We agree that a household thermostat is not a welfare subject. It lacks organizational closure; its set-point is fixed externally, and it has no stake in its own continued operation. We further agree that a biological homeostatic agent—one that incurs metabolic costs to hold internal variables within bounds and acts to preserve its own operational integrity—is a structurally superior reference case than a thermostat. While we disagree on whether this structural difference is sufficient for moral status, we agree it is the minimum biological prerequisite for any system that *could* possess welfare. A system that does not act to maintain its own bounds cannot be harmed in a way that matters to it.
  3.  **On Calibration and Lineage:** We agree that the neural architectures associated with welfare in humans (e.g., thalamocortical loops, specific integration hubs) are absent in insects. The Threshold View holds this is decisive; the Dimensional View holds this is merely a difference in implementation. However, we agree that this absence implies we cannot assume insect welfare is *like* human welfare. If insects have welfare, it is likely alien in phenomenology and structure. Therefore, welfare interventions designed for vertebrates (e.g., environmental enrichment based on exploration) may not translate, whereas interventions based on basic nociception (e.g., slaughter methods) are more robust across views.
  4.  **On Aggregation and Uncertainty:** We agree on the mathematical structure of the funding decision under uncertainty. If the Threshold View is correct and insects are below the line, the moral weight of one insect is zero, and the moral weight of $N$ insects is zero. If the Dimensional View is correct, the moral weight of one insect is $\epsilon$ (small but nonzero), and the moral weight of $N$ insects is $N \times \epsilon$. Given that $N$ (the number of insects in agriculture) is in the trillions, $N \times \epsilon$ may exceed the moral weight of a small number of vertebrates. Therefore, even if the probability of the Dimensional View (or the insect crossing the Threshold) is low, the *expected value* of intervention may be high solely due to the scale of $N$. We agree that a funder acting to minimize expected suffering must weigh the probability of status against the magnitude of the population.

  ### II. Table of Residual Disagreements

  The following table isolates the cruxes where our models diverge. We have formulated these claims such that each side accepts their respective column as an accurate representation of their position.

  | Crux | Threshold View (Neuroscience) | Dimensional View (Welfare Science) | Adjudicating Case / Argument | Prediction (Threshold) | Prediction (Dimensional) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Nearness to Threshold** | There is no fact of the matter about "how close" a creature is to moral status. The capacity for a unified self-model is binary; one either possesses the architectural integration or one does not. "Nearness" is a category error. | Moral status is an aggregate of independent capacities (sensory, integrative, mnemonic). A creature can be "nearer" to full status by scoring higher on these axes, even if it lacks a unified self-model. | **Phylogenetic Analysis:** Mapping the emergence of neural integration hubs across the evolutionary tree leading to insects. | Integration will show a step-function appearance (present in ancestors, absent in insects, or vice versa), not a slope. | Integration metrics will scale continuously with brain complexity; insects will score low but non-zero. |
  | **2. Pain vs. Death** | The capacity that makes pain bad (phenomenal valence) is identical to the capacity that makes death bad (loss of a subject of experience). If an entity cannot feel pain, it cannot be harmed by death. | The badness of pain relates to negative valence capacity; the badness of death relates to the strength of homeostatic drives and future-oriented preferences. These can come apart. | **The "Instant Termination" Test:** An organism that avoids damage vigorously but shows no behavioural distinction between continued life and instant, painless termination. | Such an organism is impossible. If it avoids damage, it values its future state. | Such an organism is possible. It may have nociception without a coherent "future self" to lose. |
  | **3. Fragmented Centres** | A welfare subject requires a single, unified decision centre. If valenced states are processed by semi-independent ganglia (as in some insects), there are either multiple subjects or none. There is no "fractional" subject. | Moral status scales with the degree of integration. A fragmented system constitutes a single subject with reduced moral weight, rather than multiple subjects or zero subjects. | **Ganglia Severance:** An insect with severed ventral nerve cord connections showing independent avoidance learning in isolated segments. | This creates two distinct welfare subjects (or eliminates the unified subject entirely). | This reduces the welfare weight of the original subject by a fraction proportional to the loss of integration. |
  | **4. Substrate Independence** | Mechanism matters. A system that reproduces the input-output profile of an insect (trade-offs, generalisation) via silicon or algorithmic simulation does not cross the threshold if it lacks the specific biological neural architecture. | Function matters. If the trade-offs, cost-incurrence, and generalisation are identical, the moral status is identical regardless of substrate. The "stake in operation" is defined by the behaviour, not the biology. | **The Functional Duplicate:** A non-biological simulation that perfectly mimics an insect's avoidance learning and trade-off decisions. | No moral status. It is a map, not a territory; it simulates care without caring. | Equal moral status. The functional organization *is* the stake; the substrate is irrelevant. |

  ### III. On Verbal Disputes

  We acknowledge that a significant portion of our prior disagreement was verbal, centred on the term **"Sentience."**

  *   **For the Threshold View:** "Sentience" is a technical term referring specifically to *phenomenal consciousness*—the existence of a unified subject for whom things feel like something. On this definition, if the neural architecture for unity is absent, sentience is absent. There is no "partial sentience."
  *   **For the Dimensional View:** "Sentience" is used as a shorthand for *welfare capacity*—the ability to be harmed or benefited. On this definition, capacities come in degrees. An organism can be "partially sentient" in the sense that it possesses some, but not all, of the capacities that make a human a welfare subject.

  **Why this matters:** When the Threshold View says "Insects are not sentient," they mean "Insects do not have a unified phenomenal self." When the Dimensional View says "Insects are sentient," they mean "Insects have capacities that ground moral claims." Both parties agree on the empirical facts of insect behaviour; they disagree on which label applies to those facts. However, this is not *merely* verbal. The disagreement over the label reflects a deeper disagreement about whether moral status is a property of *architecture* (Threshold) or *function* (Dimensional). Resolving the terminology would not resolve the funding decision, because the underlying ontological disagreement remains.

  ### IV. Recommendation for Funding

  As trustees, you must move capital while this dispute remains unsettled. The Foundation's deed commits income to reducing suffering where a **"comparatively modest sum will reduce a great deal of it."**

  Given the residual disagreement, we recommend the following course of action:

  1.  **Apply the Precautionary Principle to Expected Value:** Even if you assign a low probability (e.g., 5-10%) to the Dimensional View being correct (or to insects crossing the Threshold under uncertainty), the sheer scale of insect agriculture (trillions of individuals) means the *expected* amount of suffering is vast. A modest sum invested in insect welfare has a higher expected return on suffering-reduction than a sum invested in vertebrate welfare, simply due to the multiplier effect of $N$.
  2.  **Focus on "Low-Regret" Interventions:** Fund interventions that reduce potential suffering regardless of which view is correct. For example:
      *   **Slaughter Methods:** Techniques that ensure immediate destruction of the nervous system (e.g., rapid freezing, maceration) are cheap and effective. If insects have welfare, this prevents pain. If they do not, the cost is negligible.
      *   **Density Reduction:** If overcrowding causes stress responses (trade-offs to avoid crowding), reducing density is a robust intervention.
  3.  **Avoid "Enrichment" Ambiguity:** Do not fund complex environmental enrichment programmes that assume a unified psychological need for exploration (which leans heavily on the Dimensional View's stronger claims). Stick to interventions that target nociception and basic homeostasis.
  4.  **Conditionality:** Structure grants such that funding continues only if further research confirms that the insects exhibit the consensus markers listed in Section I (specifically trade-offs and analgesic modulation).

  **Conclusion:** The Threshold View warns against category errors; the Dimensional View warns against moral exclusion errors. In a context of enormous numbers and high uncertainty, the cost of a moral exclusion error (ignoring real suffering) vastly outweighs the cost of a category error (spending money to prevent suffering that didn't exist). To fulfil the deed's requirement of leveraging modest sums for great reduction in suffering, you should fund insect welfare interventions that target basic nociception, treating the insects *as if* they have moral status until the threshold question is empirically resolved.

  **Signed,**

  Dr. A. (Comparative Neuroscience)
  Dr. B. (Welfare Science)
