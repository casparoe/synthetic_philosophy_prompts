prompt: |-
  Hi — I'm on a small team at a philanthropic fund, and most of what we do rests on very long-run quantitative forecasts. Things like "by 2050, N hundred million people will be living in water-stressed basins" or "within a generation, antimicrobial resistance makes routine surgery impossible" or "in the 2040s, water stress becomes a first-order driver of violent conflict in the Sahel." We commit real money against these, we've cited some of them publicly, and every three years we're supposed to go back and look at them. Every single time the same argument breaks out. The forecast isn't tracking. One person says, it's a 2050 call, it's 2026, you can't call it yet. Another says, the thing it's supposed to be driven by has already happened and the effect hasn't showed up, so the mechanism is broken. A third says the whole exercise is unfalsifiable with a number stapled to it. I want to stop having that argument from scratch every cycle.

  Can you write us an actual procedure for it? Something a three-person committee can run in an afternoon on one forecast, with no statistician in the room and no web access, that outputs a verdict we can file: not yet testable / on track but delayed / falsified / or kept alive only by repairs that eat its content.

  Where I think the real work is, and what it has to handle:

  Most of these aren't really calendar predictions, they're threshold predictions — not "by 2050" but "once X gets past level L." A prediction can be late without being wrong if the trigger hasn't been reached yet. But if you let yourself convert a deadline into a trigger after the deadline has passed, nothing can ever fail. So I want a rule that says when that conversion is legitimate and what the person proposing it has to show (that the theory said so in advance, presumably), plus what to do with the fact that most of our archive has no such statement — a 2004 memo that just says "by 2030" and nothing else.

  Related: a lot of these mechanisms are supposed to be feedbacks, not trapdoors. The pressure is meant to show up in intermediate quantities before it shows up in the headline catastrophe — prices, wages, age at marriage, how much land is under cultivation, whatever the theory's own version of that is. So "did the disaster happen" is often the wrong check, and "did the pressure show up" is the right one. But a theory that only ever predicts the catastrophe and predicts no observable trace of itself beforehand is a different animal. I want the procedure to tell the difference and treat them differently.

  And I want every repair to cost something. If someone says "the mechanism was real but this other thing switched it off," fine — but then the domain should shrink, or the remaining shelf life should shrink, or they should owe us a specific pre-committed test with a date on it. If a rescue would be equally available for any outcome at any date, it isn't a rescue, it's a way of never being wrong. There's a philosophy-of-science word for this that I half remember, but please keep jargon out of the document — my colleagues have to run this, and one of them will rebel at anything that looks like theory.

  Also: if we file something as "not yet testable," I want the procedure to force a date at which it becomes testable, and a cap on how many times the same forecast can be deferred before it defaults to a miss. And some of these are really families of claims — a headline catastrophe, a mechanism, a trend — where the mechanism might be basically fine while the headline is dead, or vice versa. I'd rather grade the parts separately and have a rule for what that does to the grant, than give one verdict to the whole thing.

  Deliverable, concretely: the ordered list of questions, what counts as a sufficient answer to each, where the procedure stops with a "no," and where it hands the question to a human because it's a values call and not a facts call. A half-page verdict template at the end (we have to show these to the board). Be honest about which steps are judgment calls wearing a lab coat.

  Then run it on three, please.

  One: Malthus, since he's the case everyone reaches for. Population outrunning subsistence, positive and preventive checks, the whole thing. Is he "right but early," falsified and then rescued, or just dead? I genuinely don't know which, and I'd like the procedure to be the thing that decides it rather than us arguing. Whatever it says, spell out the consequence for how we should treat a structurally similar mechanism today.

  Two: a stylized version of something in our own archive from the late 1990s — "within twenty-five years, antibiotic resistance will make routine surgery and chemotherapy impossible in most hospitals." That didn't happen at anything like that scale. Resistance is unambiguously worse now, though. I want to see whether the procedure calls that delayed or whether it missed which part of the mechanism does the work.

  Three, and this is the one I'm dreading: our flagship, the one the current strategy is built on, which is the water-stress-and-conflict-in-the-Sahel one for the 2040s. Run it straight and give me the honest verdict even if it's the bad one. If it comes out degenerating, don't tell me to abandon the strategy — I can't, and that's not what I asked. Tell me what a repaired version of the *forecast* would have to look like to earn a live verdict again, and tell me what we should stop saying out loud while it's in whatever state it's in.

  One constraint I should flag, because it's the reason this is hard rather than easy: we have donors who gave against these specific numbers, and there's real pressure to file everything as "too early to tell." So the procedure needs a step that catches that pressure rather than being steamrolled by it. If the only honest answer is "there's no procedure that can do this, here's the structural reason," I'd rather have that than a fake flowchart — but I'd want the reason, and I'd want to know which parts of what I asked for are still salvageable. Sorry, this got long. Thanks.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **User:** Small team at a philanthropic fund.
      *   **Problem:** Long-run quantitative forecasts (2050, etc.) are reviewed every 3 years. Arguments always break out: "too early" vs. "mechanism broken" vs. "unfalsifiable."
      *   **Goal:** A concrete procedure for a 3-person committee (no statistician, no web access) to run in an afternoon on *one* forecast.
      *   **Output:** A verdict (Not Yet Testable / On Track but Delayed / Falsified / Degenerating) + a half-page template.
      *   **Key Constraints/Requirements:**
          *   Handle threshold vs. calendar predictions (prevent post-hoc conversion).
          *   Check for intermediate signals/feedbacks (not just headline catastrophe).
          *   "Cost" repairs (domain shrinkage, new specific tests).
          *   Limit deferrals ("Not Yet Testable" needs a date and a cap).
          *   Grade parts separately (mechanism vs. headline).
          *   Identify judgment calls vs. fact checks.
          *   Address donor pressure to file "too early."
          *   Run the procedure on three cases: Malthus, 1990s Antibiotic Resistance, and the User's Water-Stress/Sahel forecast.
      *   **Tone:** Practical, honest, low-jargon, actionable.

  2.  **Deconstruct the Core Tensions:**

      *   *Calendar vs. Threshold:* If a prediction says "By 2030" and it's 2031, can you say "Well, it's when X hits Y"? Only if the original theory specified X and Y *before* the deadline passed.
      *   *Headline vs. Mechanism:* If the disaster hasn't happened, did the *pressure* (prices, migration, etc.) happen? If no pressure, the mechanism is suspect.
      *   *Rescuing:* Every excuse needs a "tax." If you say "Government intervention stopped it," the prediction is now conditional on *no intervention*. If you say "It's just late," you need a new hard date.
      *   *Donor Pressure:* The procedure needs a "Pre-Mortem" or "Conflict of Interest" step where the committee explicitly acknowledges the pressure before voting.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Structure:* Needs to be linear. Step 1 -> Step 2 -> Stop or Continue.
      *   *Step 1: The Record Check.* What did the original document actually say? (Prevents moving goalposts).
      *   *Step 2: The Trigger Check.* Calendar vs. Threshold. (Prevents post-hoc rationalization).
      *   *Step 3: The Mechanism Check.* Intermediate indicators. (Distinguishes "late" from "wrong").
      *   *Step 4: The Rescue Tax.* If claiming an exception, what is the cost? (Prevents infinite immunity).
      *   *Step 5: The Deferral Cap.* How many times can we say "wait"? (Prevents zombie forecasts).
      *   *Step 6: The Pressure Check.* Explicitly address donor bias.

      *   *Verdicts:* Need clear definitions.
          *   *Confirmed:* On track.
          *   *Delayed:* Mechanism holds, timeline slipped (cost applied).
          *   *Falsified:* Mechanism broken.
          *   *Degenerating:* Kept alive only by ad-hoc repairs (needs major overhaul).
          *   *Not Yet Testable:* Valid, but data unavailable (needs hard date).

  4.  **Drafting the Verdict Template:**

      *   Needs to be board-ready. Clear, concise, separates mechanism from outcome.

  5.  **Running the Cases:**

      *   *Case 1: Malthus.*
          *   *Original:* Population grows geometrically, food arithmetically. Checks (famine, war, vice) restore balance.
          *   *Reality:* Population grew, food grew faster (tech). Checks didn't operate as predicted (demographic transition).
          *   *Verdict:* Falsified on mechanism (tech progress ignored), though "scarcity exists" is trivial.
          *   *Lesson:* Beware static models of dynamic systems.

      *   *Case 2: 1990s Antibiotic Resistance.*
          *   *Original:* "Routine surgery impossible in 25 years" (by ~2020).
          *   *Reality:* Surgery still happens. Resistance is up, but stewardship/new drugs (limited) helped.
          *   *Verdict:* Headline Falsified (timeline/scale). Mechanism Partial (resistance is real, but "impossible" was hyperbolic).
          *   *Repair:* Shift from "impossible" to "significantly higher mortality/cost." Tax: Must define specific procedure failure rates by new date.

      *   *Case 3: Water-Stress/Sahel (User's Forecast).*
          *   *Original:* 2040s, water stress -> violent conflict.
          *   *Reality:* It's 2026 (per prompt context). 2040 is future.
          *   *Check:* Intermediate indicators? Migration? Local conflict? Crop yields?
          *   *Risk:* If no intermediate signals by 2026 for a 2040 claim, is the mechanism weak?
          *   *Verdict:* Likely "Delayed" or "Degenerating" depending on intermediate data. If no signal of stress *now*, 2040 is optimistic.
          *   *Honest Advice:* Stop claiming inevitability. Claim conditional risk.

  6.  **Refining the "Donor Pressure" Constraint:**

      *   I need to make sure the procedure explicitly forces the committee to write down *why* they aren't calling a miss if the data suggests one. A "Dissenting Opinion" box on the template is crucial.

  7.  **Review against Constraints:**

      *   *No statistician?* Keep math simple (counts, dates, binary checks).
      *   *No web access?* Rely on the archive and current internal knowledge.
      *   *Jargon?* Avoid "falsificationism," "Bayesian updating." Use "Proof," "Repair Cost."
      *   *Honesty?* Acknowledge that long-term forecasting is inherently fuzzy. The procedure manages the *process*, not the *truth*.

  8.  **Final Polish:**

      *   Ensure the tone is empathetic but firm.
      *   Make sure the "Repair Tax" concept is clear.
      *   Check the Malthus analysis (classic trap: Malthus is often called "wrong" but some argue he was "right on mechanism, wrong on tech." I need to be decisive based on the procedure).
      *   Check the Sahel analysis (don't be afraid to say "Degenerating" if the intermediates aren't there).

      *(Self-Correction during drafting)*: I initially thought about making the procedure a flowchart. But the prompt asks for an "ordered list of questions." A checklist is easier to run in an afternoon without drawing tools. I will structure it as a "Protocol" with decision gates.

      *(Refining the "Repair Tax")*: I need to make sure the tax isn't just "write a memo." It needs to be "shrink the claim." E.g., from "Global" to "Regional," or from "Impossible" to "Costly."

      *(Refining the Sahel Case)*: The prompt says it's 2026 in their timeline ("it's 2026, you can't call it yet"). So for the Sahel case, the deadline (2040s) hasn't hit. The test is on *intermediates*. If intermediates are missing, it's "Degenerating."

      *(Final check on Donor Pressure)*: Add a specific step called "The Incentive Declaration."

  9.  **Final Output Generation** (incorporating all the above thoughts).
answer: |-
  Here is a procedure designed for your constraints. It is built to be run by three generalists in one afternoon, using only your internal archive and current knowledge. It prioritizes preventing "goalpost moving" over statistical precision.

  Following the procedure, I have applied it to your three requested cases.

  ***

  # The Forecast Audit Protocol (FAP)

  **Purpose:** To assign a status to a long-run forecast without requiring new data collection or statistical modeling.
  **Participants:** Three committee members (one must be designated the "Devil's Advocate" for this session).
  **Inputs:** The original forecast document, current internal knowledge of the topic.
  **Time:** 90 minutes per forecast.

  ### Phase 1: The Record Check (15 Minutes)
  *Goal: Prevent post-hoc redefinition of the claim.*

  1.  **Retrieve the Original Text.** Quote the specific sentence containing the prediction.
  2.  **Identify the Trigger.** Does the text specify a **Calendar Date** (e.g., "By 2050") or a **Threshold** (e.g., "When water tables drop 20%")?
      *   *If Calendar:* The deadline is fixed.
      *   *If Threshold:* The trigger is fixed.
      *   *If Ambiguous:* Treat as Calendar. (Ambiguity benefits the forecaster; this rule corrects that bias).
  3.  **Identify the Mechanism.** Does the text state *why* this will happen? (e.g., "Because population grows faster than yield").
      *   *If No Mechanism Stated:* The forecast is a "Black Box." It is harder to save if it fails.

  **STOP RULE:** If the committee cannot agree on what the original text said in 5 minutes, the forecast is filed as **Unrecoverable**. Verdict: *Degenerating*.

  ### Phase 2: The Status Check (30 Minutes)
  *Goal: Determine if the prediction is currently testable.*

  4.  **Has the Trigger Passed?**
      *   *Yes:* Go to Question 5.
      *   *No:* Go to Question 6.
  5.  **Did the Event Happen?**
      *   *Yes:* Verdict: **Confirmed**. (Proceed to Template).
      *   *No:* The forecast is now **At Risk**. Go to Phase 3.
  6.  **Are Intermediate Signals Present?**
      *   Look for the "pressure" variables the mechanism implies (prices, migration, resistance rates, etc.).
      *   *If Signals are Strong/On Track:* Verdict: **On Track**.
      *   *If Signals are Weak/Absent:* The mechanism is suspect. Verdict: **Degenerating**. (Proceed to Phase 3 to see if it can be saved).

  ### Phase 3: The Rescue Tax (30 Minutes)
  *Goal: Allow repairs, but charge for them. If a member proposes a reason why the forecast hasn't hit yet, they must propose a "Tax."*

  7.  **Proposed Rescue:** Why hasn't it happened? (e.g., "Technology improved," "Policy intervened," "We were early").
  8.  **Apply the Tax.** Choose **one** of the following penalties to apply to the forecast if the Rescue is accepted:
      *   **Domain Shrink:** The claim now applies to fewer places/people (e.g., "Global" becomes "Sub-Saharan Africa").
      *   **Magnitude Reduction:** The claim becomes less severe (e.g., "Impossible" becomes "50% more expensive").
      *   **Shelf-Life Reduction:** The new deadline is brought *closer*, not pushed back. (Prevents "It's just later" infinity loops).
      *   **Pre-Commitment:** A specific intermediate metric must be hit by the next review (3 years), or the forecast auto-fails.
  9.  **The "Universal Excuse" Test:** Could this excuse apply to *any* outcome? (e.g., "Unforeseen events").
      *   *If Yes:* The Rescue is rejected. Verdict: **Falsified**.
      *   *If No:* The Rescue is accepted *with the Tax*. Verdict: **Delayed (Conditional)**.

  ### Phase 4: The Pressure Check (15 Minutes)
  *Goal: Acknowledge external incentives.*

  10. **Incentive Declaration.** Each member must write down one reason they *want* this forecast to remain "Live" (e.g., "Donor relations," "Strategy justification").
  11. **Deferral Cap.** How many times has this forecast been marked "On Track" or "Delayed" without a "Confirmed" or "Falsified" verdict?
      *   *If > 2 cycles:* The forecast must be **Falsified** or **Confirmed** this cycle. No more "Delayed."

  ***

  # Verdict Template (For Board Filing)

  **Forecast ID:** [Name/Date]
  **Original Claim:** [Quote]
  **Current Verdict:** [Confirmed / Delayed (Conditional) / Falsified / Degenerating / Unrecoverable]

  **Mechanism Status:**
  [ ] Intact (Intermediate signals match theory)
  [ ] Strained (Signals present but weaker than required)
  [ ] Broken (No intermediate signals observed)

  **Repairs Applied (If any):**
  [ ] Domain Shrunk to: ______
  [ ] Magnitude Reduced to: ______
  [ ] New Hard Deadline: ______
  [ ] Required Intermediate Test by [Date]: ______

  **Committee Dissent:**
  [Member Name] argues for [Alternative Verdict] because [Reason].

  **Incentive Declaration:**
  Committee acknowledges potential bias regarding [Donor/Strategy Pressure].

  ***

  # Case Runs

  Here is the procedure applied to your three cases.

  ### Case 1: Malthus (Population vs. Subsistence)
  *Context: Classic 1798/1826 essays. Claim: Population grows geometrically, food arithmetically. Result: Positive checks (famine/war) restore balance.*

  *   **Phase 1 (Record):** Trigger is continuous/threshold ("When population exceeds means"). Mechanism is explicit (biological reproduction vs. land yield).
  *   **Phase 2 (Status):** Trigger has passed globally (population exploded). Did the event happen? No. Global famine did not scale with population; per-capita calories rose. Intermediate signals? Real food prices have fallen long-term.
  *   **Phase 3 (Rescue):**
      *   *Rescue:* "Technology (Green Revolution) intervened."
      *   *Tax:* **Domain Shrink.** The mechanism only applies where technology is static.
      *   *Universal Excuse Test:* If the excuse is "Tech always improves," the theory is unfalsifiable. If the excuse is "Tech improved *this time*," the theory is limited.
  *   **Phase 4 (Pressure):** Deferral Cap exceeded (200+ years of "wait").
  *   **Verdict:** **Falsified (Global) / Delayed (Local).**
  *   **Consequence:** The global mechanism is dead. You cannot fund based on "Malthusian Collapse" as a default state. You can only fund based on "Malthusian Traps in Tech-Static Regions."
  *   **Lesson for Today:** Any forecast relying on *static* resource constraints must explicitly model *dynamic* technological substitution. If the forecast does not include a variable for "human ingenuity/tech," it is structurally flawed.

  ### Case 2: Antibiotic Resistance (Late 1990s Archive)
  *Context: "Within 25 years (by ~2020), resistance makes routine surgery/chemo impossible in most hospitals."*

  *   **Phase 1 (Record):** Trigger is Calendar (~2020). Mechanism is bacterial evolution outpacing drug development.
  *   **Phase 2 (Status):** Trigger passed. Event happened? No. Routine surgery is still routine. Intermediate signals? Resistance is up (MRSA, etc.), but "impossible" is the key word.
  *   **Phase 3 (Rescue):**
      *   *Rescue:* "Stewardship and infection control slowed the spread."
      *   *Tax:* **Magnitude Reduction.** Change "Impossible" to "Significantly higher mortality and cost."
      *   *Tax:* **Pre-Commitment.** Must identify 3 specific procedures where cancellation rates exceed 10% due to resistance by 2030.
  *   **Phase 4 (Pressure):** Incentive Declaration: "We still need to fund AMR."
  *   **Verdict:** **Delayed (Conditional).**
  *   **Consequence:** The headline was hyperbolic. The mechanism is real, but the *tipping point* was misjudged.
  *   **Action:** Stop using the word "Impossible." Start funding based on "Marginal increase in procedural risk." The grant strategy survives, but the marketing copy must change.

  ### Case 3: Water-Stress & Conflict in the Sahel (Your Flagship)
  *Context: "In the 2040s, water stress becomes a first-order driver of violent conflict." Current year: 2026.*

  *   **Phase 1 (Record):** Trigger is Calendar (2040s). Mechanism: Scarcity -> Competition -> Violence.
  *   **Phase 2 (Status):** Trigger has *not* passed. We are in the "Intermediate Signal" zone.
      *   *Check:* Are we seeing water stress? Yes, aquifers are dropping.
      *   *Check:* Is it driving *violent conflict* now? Data is mixed. Conflict is high, but often attributed to governance/insurgency, not purely resource scarcity.
      *   *Critical Failure Point:* If the theory says stress drives conflict, we should see a correlation *now* in the most stressed areas. If the most stressed basins are peaceful, and the violent basins have water, the mechanism is weak.
  *   **Phase 3 (Rescue):**
      *   *Rescue:* "It takes a generation for stress to turn to violence."
      *   *Tax:* **Pre-Commitment.** You must identify a specific leading indicator (e.g., "Pastoralist migration routes crossing farm lines") that must increase by X% by the 2029 review.
      *   *Tax:* **Domain Shrink.** Limit claim to specific basins where the correlation is currently visible, not the whole Sahel.
  *   **Phase 4 (Pressure):** Incentive Declaration: "This is the flagship strategy. Donors gave against this."
      *   *Constraint Check:* If the intermediate indicators are weak, you cannot mark this "On Track."
  *   **Verdict:** **Degenerating.** (Assuming the correlation between stress and violence is currently weak/noisy).
  *   **Consequence:**
      1.  **What to stop saying:** Stop saying "Water stress *will* cause conflict." Start saying "Water stress *increases the risk* of conflict in the absence of governance interventions."
      2.  **What the repair looks like:** The forecast must be split.
          *   *Forecast A:* Water stress will reach Level X by 2040. (Likely **On Track**).
          *   *Forecast B:* This stress will drive conflict. (Currently **Degenerating**).
      3.  **Strategy Implication:** You can keep funding water projects. You cannot keep funding *conflict prevention* projects based solely on the water thesis. You must add a governance variable. If you don't, you are betting on a mechanism that isn't showing up in the data.

  ***

  # A Note on the "Donor Pressure" Constraint

  You asked for honesty about the donor pressure. The procedure above includes **Phase 4, Step 10 (Incentive Declaration)**. This is the most important step.

  If your committee fills out that line and writes "Donor retention," but then votes "On Track" despite weak data, you have created a record of the bias.

  **The Structural Truth:**
  There is no procedure that can force a philanthropic fund to admit it was wrong if the organization's survival depends on being right. The FAP cannot stop you from lying to the board.

  **What it *does* do:**
  It forces you to write the lie down explicitly.
  *   *Without FAP:* "The forecast is still valid." (Sounds like fact).
  *   *With FAP:* "The forecast is Degenerating, but we are marking it Delayed due to Strategic Continuity." (Sounds like a choice).

  Over time, a file full of "Degenerating / Delayed due to Strategy" verdicts becomes undeniable evidence to the Board that the forecasting model is broken, even if no single forecast was ever "Falsified." That is the only way to solve this without blowing up the fund.
