  # Diagnostic Decision Tree: Institutional Moral Uncertainty

  **Instructions for Participants:** Start at Node 1. Answer each question based on your immediate intuition about the case described. Follow the edge label that matches your answer to the next Node or Leaf. There is no "correct" path; the goal is to locate your operational stance.

  ### Branch Nodes

  **Node 1: The 85/15 Prohibition Case**
  *Scenario:* You have a proposal that 85% of your moral credence says produces an enormous good, but 15% says is categorically impermissible regardless of consequences.
  *Question:* Does the 15% credence in a categorical prohibition block the action entirely?
  *   **Yes** → Go to Node 2
  *   **No** → Go to Node 3

  **Node 2: The Unanimous Endorsability Case**
  *Scenario:* Among the theories you credit, none strictly *forbid* the action, but some are neutral while others endorse it.
  *Question:* Must every theory you give nontrivial credence to positively *endorse* the action for it to be permissible, or is it enough that none forbid it?
  *   **Every theory must endorse it** → **Leaf A**
  *   **It is enough that none forbid it** → **Leaf B**

  **Node 3: The Portfolio Split Case**
  *Scenario:* You have a $100M budget. Credence is 0.6 on funding a near-term health intervention, 0.3 on a long-run risk-reduction project, and 0.1 on the view that the money is tainted and must be returned.
  *Question:* Do you split the budget to partially satisfy the health view, the long-run view, and the return view simultaneously?
  *   **Yes, split the resources** → **Leaf C**
  *   **No, commit fully to one option** → Go to Node 4

  **Node 4: The Credence Weighting Case**
  *Scenario:* (Continuing from Node 3, No Split). The health intervention has the highest single credence (0.6), but the weighted sum of value favors a different mix.
  *Question:* Do you fund the health intervention simply because it has the highest single credence, or because it maximizes the weighted average across all views?
  *   **Because it has the highest single credence** → Go to Node 5
  *   **Because it maximizes the weighted average** → Go to Node 6

  **Node 5: The Diachronic Entrenchment Case**
  *Scenario:* You are drafting a charter clause. Your successors will almost certainly hold different moral credences than you do.
  *Question:* Should the charter lock in your current credences to bind future trustees, or allow them to revise the moral framework by simple majority?
  *   **Lock in current credences (Entrench)** → **Leaf D**
  *   **Allow revision (Revisable)** → *Note: This combination is logically unstable; see Unoccupied Cell 1.* → Go to Node 7 (for diagnostic salvage)

  **Node 6: The Risk-Imposition Asymmetry Case**
  *Scenario:* A gamble is permissible if the moral risk falls on your institution, but the same gamble imposes the risk entirely on unconsenting outsiders.
  *Question:* Does the fact that outsiders bear the risk make the gamble forbidden even if the expected aggregate good remains positive?
  *   **Yes, the bar rises for outsider risk** → Go to Node 7
  *   **No, expected good is what matters** → **Leaf E**

  **Node 7: The Catastrophe Avoidance Case**
  *Scenario:* Option A has a higher average moral value. Option B has a lower average but guarantees you avoid the worst possible moral outcome predicted by any theory.
  *Question:* Do you choose Option B to avoid the worst-case scenario?
  *   **Yes, avoid the worst-case** → Go to Node 8
  *   **No, maximize the average** → *Note: This contradicts Node 6 Yes; see Unoccupied Cell 2.* → **Leaf E**

  **Node 8: The Multi-Trigger Structure Case**
  *Scenario:* Five trustees oversee deployment. Any one trustee can unilaterally launch; stopping requires unanimity. The probability that *someone* is wrong is higher than any individual's error rate.
  *Question:* Does this structure require you to raise your personal threshold for certainty independently of your own credences?
  *   **Yes, raise the bar to compensate for structure** → **Leaf F**
  *   **No, my credence determines my vote regardless of structure** → **Leaf G**

  ---

  ### Leaves

  **Leaf A: Unanimous Endorsability Requirement**
  *Gloss:* An act is admissible only if every theory you give nontrivial credence could endorse it from inside its own framework.
  *Awkward Commitment:* Renders most significant decisions impermissible due to inevitable theoretical disagreement.

  **Leaf B: Categorical Veto Threshold**
  *Gloss:* A theory's categorical prohibition retains veto force above some credence threshold, so that a 15% credence that an act is forbidden can block it.
  *Awkward Commitment:* Allows a small minority of credence to veto actions that overwhelmingly benefit the majority view.

  **Leaf C: Fractional-Compliance**
  *Gloss:* Split the action so that each theory gets a share of the resources, the time, or the randomization.
  *Awkward Commitment:* Guarantees that every theory is partially violated rather than fully satisfying the most likely one.

  **Leaf D: Deference to One's Highest-Credence Theory**
  *Gloss:* Defer to whichever theory you assign most credence, ignoring the weighted prescriptions of minority views.
  *Awkward Commitment:* Requires ignoring significant minority concerns even when they involve catastrophic prohibitions.

  **Leaf E: Expected-Choiiceworthiness Maximization**
  *Gloss:* Aggregate choiceworthiness across theories and maximize the expectation.
  *Awkward Commitment:* Permits imposing severe moral risk on outsiders if the aggregate expected gain is high enough.

  **Leaf F: Maximin Across Theories**
  *Gloss:* Choose the act that yields the best outcome in the worst-case moral theory scenario.
  *Awkward Commitment:* Paralyzes action if any credible theory predicts a disastrous outcome for the preferred option.

  **Leaf G: Variance-Averse Hedging**
  *Gloss:* Hedge against the variance so as to avoid the moral catastrophe without strictly maximizing the minimum.
  *Awkward Commitment:* May sacrifice significant expected good to avoid a low-probability moral catastrophe.

  ---

  ### Analysis of Logical Space & Unoccupied Cells

  **Unoccupied Cell 1 (Node 5 Path):** *Highest-Credence + Revisable Charter.*
  *Status:* **Merely Unattractive / Unstable.**
  *Reasoning:* If one defers solely to the highest-credence theory (Leaf D), entrenchment is the only way to preserve that theory's dominance against future successors who may hold different highest-credence views. Allowing revision implies a commitment to a higher-order procedural value (like democracy or updating) that overrides the substantive highest-credence theory, which contradicts the definition of Leaf D.

  **Unoccupied Cell 2 (Node 7 Path):** *Outsider Risk Sensitivity + Average Maximization.*
  *Status:* **Incoherent.**
  *Reasoning:* Node 6 "Yes" establishes that risk-bearing location matters morally. Node 7 "No" (maximize average) treats risk-bearing location as morally irrelevant. A participant arriving here has inconsistent intuitions about whether the *identity* of the risk-bearer changes the moral calculation.

  **Unoccupied Cell 3 (Theoretical Gap):** *Fractional-Compliance + Categorical Veto.*
  *Status:* **Unexplored / Logically Tense.**
  *Reasoning:* While not explicitly branched in this tree (as Node 1 filters Vetoes before Node 3 Splits), a view that splits resources *unless* a veto threshold is met is a hybrid. It is unoccupied in standard literature because it requires a meta-rule for when to switch from splitting to vetoing, which usually collapses into the Veto view.

  ---

  ### Separation Flags & Scoring Note

  **Inseparable Leaves:**
  This tree cannot fully separate **Leaf F (Maximin)** and **Leaf G (Variance-Averse Hedging)** without further technical questions about utility functions. Both arrive via Node 7 (Avoid Worst-Case). In practice, Maximin is a strict subset of Variance-Aversion. For workshop purposes, treat Leaf F as the "strict" version and Leaf G as the "moderate" version of the same risk-averse family.

  **Scoring Inconsistent Answers:**
  1.  **The "Veto-Split" Contradiction:** If a participant answers **Yes** at Node 1 (Veto) but **Yes** at Node 3 (Split), they hold a contradictory position (you cannot veto an act and simultaneously fund it). *Score as:* **Leaf C (Fractional)**, noting that their veto intuition is likely a "strong preference" rather than a categorical prohibition.
  2.  **The "Entrenched Aggregator" Contradiction:** If a participant answers **No** at Node 1 (No Veto/Aggregate) but **Lock In** at Node 5, they are prioritizing procedural stability over moral aggregation. *Score as:* **Leaf D (Highest-Credence)**, as entrenchment functionally mimics deferring to the current "winner" against future competition.
  3.  **The "Risk-Averse Maximizer" Contradiction:** If a participant answers **No** at Node 6 (Risk doesn't matter) but **Yes** at Node 7 (Avoid Catastrophe), they are inconsistent about *why* they avoid catastrophe. *Score as:* **Leaf G (Variance-Averse)**, assuming the catastrophe avoidance is the stronger intuition.
