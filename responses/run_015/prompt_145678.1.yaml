answer: |-
  ### Brainstorming Candidate Concepts

  Before we settle on an analysis, let us cast the net widely. You have described a phenomenon that sits uncomfortably between several established categories. Here are the candidates that spring to mind, along with their immediate shortcomings:

  1.  **The Performative Utterance (Austin):**
      *   *The fit:* The chair is clearly "doing something with words". He is not merely describing the world; he is attempting to change it (assigning tasks, establishing history).
      *   *The friction:* In standard Austinian performatives (e.g., "I name this ship..."), the authority to perform the act must *precede* the utterance. I must be the appointed launchcer before I can name the ship. In your cases, the utterance seems to *generate* the authority or the fact it relies upon.

  2.  **The Infelicity / Misfire (Austin):**
      *   *The fit:* You rightly identified this. Austin discusses what happens when conditions aren't met (e.g., I try to marry you but I am not a registrar). He calls this a "misfire"—the act is void.
      *   *The friction:* In your examples, the act does *not* misfire. It succeeds. The sub-group *does* take it forward. The review *is* treated as having happened. It is a "successful infelicity," which is a contradiction in Austin's original terms.

  3.  **The Self-Fulfilling Prophecy (Merton):**
      *   *The fit:* The statement makes itself true.
      *   *The friction:* As you noted, prophecies are predictive (future-oriented). Your cases are retrospective or present-constative ("we agreed", "following the review"). The direction of time is wrong for a prophecy.

  4.  **Presupposition Accommodation (Lewis / Stalnaker):**
      *   *The fit:* This is a strong contender. In linguistics, if I say, "I can't come; I have to pick up my *wife*," and you didn't know I was married, you "accommodate" the presupposition that I have a wife to make sense of my sentence. You update the "common ground" of the conversation.
      *   *The friction:* Accommodation usually explains how we process *information*, not how we accept *obligations*. Accommodating that the chair has a wife doesn't bind me to action. Accommodating that "we agreed" binds the committee. This suggests a normative leap that pure linguistics doesn't always capture.

  5.  **Illocutionary Uptake (Austin / Strawson):**
      *   *The fit:* Austin and later Strawson argued that for a speech act to succeed, the audience must understand and accept it (uptake). Your observation that "hold on, we didn't agree that" collapses the reality points directly to uptake. Silence is functioning as consent.
      *   *The friction:* Uptake explains *that* it needs acceptance, but not *how* a false report transforms into a true fact simply by not being challenged.

  6.  **Institutional Facts (Searle):**
      *   *The fit:* Searle distinguishes "brute facts" (it is raining) from "institutional facts" (this is a five-pound note). Institutional facts exist only because we agree they exist.
      *   *The friction:* Searle usually focuses on the *rules* that allow these facts to exist (constitutive rules). Your case is about *bending* or *creating* those rules on the fly without the proper procedure.

  ### The Analysis: Carving the Phenomenon

  Having weighed these, I am confident that no single existing label captures the specific *retroactive* and *normative* sleight-of-hand you are describing. It is a composite phenomenon. However, we can carve it out precisely by combining **Presupposition Accommodation** with **Illocutionary Uptake** within an **Institutional Context**.

  Here is the distinction you are looking for.

  #### 1. What it is: Constitutive Accommodation
  The mechanism at work is **Presupposition Accommodation**, but it is doing heavy lifting that goes beyond mere information.
  When the Chair says, "As we agreed," the sentence carries a presupposition: *an agreement exists*.
  In a normal conversation, if the presupposition is false, the sentence is infelicitous (odd/wrong).
  However, in a cooperative social setting (like a committee), there is a conversational maxim (derived from Grice) to make the speaker's contribution acceptable if possible.
  If no one objects, the audience **accommodates** the presupposition. They update the "Common Ground" of the group to include: *Agreement = True*.
  Because this is an *institutional* setting (charity, co-op), updating the Common Ground isn't just about beliefs; it updates **Status Functions** (Searle). It creates a deontic power (a right/obligation). The sub-group now *has* the mandate.

  So, the phenomenon is a **Constative Utterance** (a statement of fact) that functions as a **Performative** (an act of creation) because the audience accommodates its presuppositions to maintain social flow, thereby retroactively satisfying the felicity conditions.

  #### 2. What it is Not
  *   **It is not a Lie:** A lie requires the speaker to intend to deceive and for the statement to remain false. Here, the statement *becomes* true. The Chair is often sincere (as you noted) because, by the time he speaks the second time ("as we agreed"), the accommodation has occurred, and in the institutional reality, it *is* true.
  *   **It is not a Misfire:** A misfire fails to produce the act. This produces the act *by* bypassing the pre-conditions.
  *   **It is not Hypnosis/Magic:** It relies entirely on the rational (if passive) cooperation of the audience. It is a social contract, not a psychological override.

  #### 3. The Boundaries (Edge Cases)

  You asked where the edges lie. Here is how the phenomenon holds up under stress:

  *   **Authority (The Foothold):** The speaker cannot be *anyone*. A random member cannot say "As we agreed." The speaker needs a **Procedural Foothold**. They must be the Chair, or the Secretary, or someone with the *right to speak for the record*. The trick works because the audience grants them provisional authority to define the situation. If the foothold is absent, the accommodation is rejected immediately.
  *   **The Audience (The Cost of Objection):** You guessed it was about interest. It is more about **Transaction Cost**. To object ("Hold on...") requires social courage, time, and the risk of being seen as difficult. If the cost of objection is higher than the cost of accepting the false premise, accommodation occurs. This explains why it works in emails (asynchronous objection is harder) and large meetings (public objection is costly).
  *   **Medium (Writing vs. Speech):** Writing solidifies the "fact". In an email, "Following the review..." creates a permanent record. To object later requires one to contradict the written record, which feels like correcting history rather than just correcting a speaker. Writing increases the "stickiness" of the accommodation.
  *   **The Diary Case (No Audience):** If you write "I have decided to leave" in a diary, does it work? **No.** This is a crucial boundary. Without an *other* to provide uptake (even a silent one), there is no accommodation. You cannot easily create an institutional fact for yourself alone because you know the machinery of your own mind. You might *resolve* to leave, but you haven't created the *fact* of the decision in the same way. The "magic" requires a social witness.
  *   **Fact vs. Permission:** It works for both. "We agreed" (fact) and "You may proceed" (permission) are both **Institutional Facts**. In social ontology, a permission is just a fact about a normative relationship. The mechanism is identical.

  ### The Terminology

  There is no single word in the standard handbook that covers this specific retroactive loop. "Performative" is too broad; "Accommodation" is too linguistic; "Legitimation" is too sociological.

  If I were writing the handbook entry, I would classify this under **Illocutionary Acts**, specifically as a sub-type of **Verdictives** (Austin's term for findings of fact) that rely on **Constitutive Accommodation**.

  However, per your request to coin a term if nothing fits: I propose we call this a **Retroactive Constitutive Utterance**.

  **Definition:** A speech act phrased as a report of a past or existing institutional state (e.g., "We agreed," "The review found"), which successfully brings that state into existence solely through the audience's failure to object, thereby retroactively satisfying the authority conditions required for the utterance to be valid.

  ### Confidence Assessment

  **High Confidence:**
  *   **The Mechanism:** I am highly confident that **Presupposition Accommodation** combined with **Illocutionary Uptake** is the correct philosophical engine here. The dynamic you described—where silence validates the false premise—is a textbook case of accommodation in a high-stakes context.
  *   **The Distinction from Misfire:** I am confident this is not an Austinian "misfire." A misfire is a failure; this is a success that bypasses the usual rules. It is a "felicitous infelicity."

  **Medium Confidence:**
  *   **The Sincerity of the Speaker:** You mentioned the Chair seems sincere. I am moderately confident this is typical. Once the accommodation happens, the institutional fact *is* real. The Chair isn't lying in the second meeting; he is reporting the institutional reality that his first utterance created. However, this depends on the Chair's own psychological susceptibility to the group's reality.

  **Low Confidence (The Bit to Push Back On):**
  *   **The Normative Force:** This is the wobbly bit. Philosophy of Language explains how we *agree* that something is true (accommodation). Social Ontology explains how that truth creates *obligations* (status functions). I am less confident in pinpointing exactly *why* the accommodation of a sentence ("we agreed") translates so seamlessly into a moral or bureaucratic obligation ("you must do the work").
      *   *Why push here?* It is possible that the obligation doesn't come from the language at all, but from the **power dynamics** you hinted at. If the Chair has power over budgets, the accommodation isn't linguistic; it's pragmatic fear. The "speech act" might just be the cover story for raw power. If the committee members were truly equal and unafraid, would the accommodation still happen? If not, then the phenomenon is less about "Language creating Reality" and more about "Power silencing Objection." I would invite you to test this: try the trick in a group where you have zero authority. It will likely fail, suggesting the "Constitutive" power comes from the *role*, not just the *words*.

  ### Summary for your Handbook

  *   **Phenomenon:** **Retroactive Constitutive Utterance** (or **Constitutive Accommodation**).
  *   **Core Mechanism:** The audience accommodates a false presupposition to maintain conversational flow, and in an institutional context, this acceptance confers normative status.
  *   **Key Condition:** Requires **Uptake** (silence counts as consent) and a **Procedural Foothold** (the speaker must have some recognised role).
  *   **Failure Mode:** Explicit objection ("Hold on...") which withdraws uptake and exposes the lack of pre-conditions.

  It is a real, documented feature of institutional language, often discussed in critical legal studies and social ontology, but rarely given a clean name in introductory philosophy of language. You have identified a gap between *what the words say* and *what the words do*, bridged by *social silence*.
