  You are a professional philosopher working in philosophy of language and philosophy of mind, with a real feel for metasemantics and the externalism debates. I need you to audit a package of commitments, not to summarise a literature: argue from the cases and the principles themselves, and please don't offer me reading suggestions or name-dropping in place of argument. Assume I know the standard moves and want to be told which of my own commitments are load-bearing. Before you start scoring anything, spend a paragraph reconstructing what my package is trying to accomplish, and make a separate list of any place where I have stayed silent but where my other commitments force a view.

  Context: I'm putting together a prospectus on content externalism, and I have the growing sense that I've assembled a set of views each of which is individually defensible and which jointly don't fit. A friend who works in a two-dimensional framework keeps telling me that everything I want is available there and I should just pay the entry fee; I have an inchoate resistance — I think 2D either smuggles in a notion of content I don't believe in or relocates the puzzle rather than solving it — but I genuinely can't tell whether that's a principled objection or just stubbornness. Here is where I've landed.

  (i) I accept the Twin Earth verdict: content isn't in the head, molecular duplicates in different environments can mean different things, and Oscar in 1750 referred to H2O with 'water' even though nothing available to him from the armchair distinguished H2O from XYZ. I also want this to generalise beyond natural kind terms to Burge-style social cases — 'arthritis', 'sofa', that sort of thing — so that externalism is a general thesis about content and not a quirk of chemistry. (ii) On metasemantics I'm a tracker rather than a descriptivist: what makes 'water' mean H2O is that the speaker's uses stand in a causal-informational relation to the underlying nature of the stuff around them, not that they associate a description and not that they defer to experts. I want deference to be explained rather than assumed — the expert's authority should fall out of the tracking story instead of being a separate primitive — and I accept that this makes reference-fixing an empirical matter: which stuff you are tracking is a fact about your environment. (iii) I want to keep self-knowledge: a competent speaker can know what she thinks and means without first running an empirical investigation of her environment, and I've never been moved by the slow-switching style of worry that externalism destroys this. (iv) I reject narrow content, in both the two-factor and the two-dimensional form; there is only broad content. (This is where I balk at my friend's proposal.) (v) I also want content to do real work in psychological explanation — I resist the Fodorian conclusion that psychology needs a narrow notion, and I'm inclined to say that citing my broad-content belief that there is water in the glass genuinely explains my reaching for it. (vi) On consciousness I'm an internalist: phenomenal character supervenes on the intrinsic — call them physical, or functional, I don't mind — properties of the subject, and I have no sympathy for phenomenal externalism, the view that what it's like to see red is partly fixed by facts about the remote environment. (vii) A case of my own, which I'll call Half-and-Half Earth. The speakers there have one word, 'water', for the clear drinkable liquid around them. Unknown to them, every sample is either pure H2O or pure XYZ; the two sources are equally abundant; the samples are indistinguishable by any means available to them; nothing else in their environment correlates with which sample you happen to get; and their practices treat all samples alike. My verdict: their word is indeterminate between H2O and XYZ — there is no fact of the matter which it refers to — and yet they still have plenty of true beliefs and plenty of knowledge about water, that it's drinkable, that it falls from the sky, and so on. (viii) Finally, on the original Twin Earth: I want to say that Twin Oscar makes no mistake, is in no worse an epistemic position than I am, and has water beliefs that are exactly as true as mine, and that none of this costs externalism anything. My supervisor says that last item is the soft spot in the whole package; I think it's obviously fine.

  What I want from you is an audit. Work through the pairs, and tell me which commitments actually pull against each other and which only look like they do — I'd rather you discriminate than flag all eight as problematic. Rank the real tensions by severity rather than treating them as equally bad, and for each one say what would have to give, what the cheapest available fix is, and what that fix costs me elsewhere in the package. Where the real difficulty is a hidden commitment I haven't stated, say what it is and which way my other views push me on it. Conclude by naming the single revision that would clean up the most. Be specific: point at the particular inference from one numbered item to another that fails, or the particular case my stated principle can't return a verdict on, rather than gesturing at the area where I'm confused.
