answer: |-
  **Project Title:** Branching Worlds vs. Open Stories: A Narrative Approach to Frankfurt Cases
  **Applicant:** [Your Name]
  **Duration:** 3 Months
  **Request:** Workshop Grant Support

  **Summary of the Project**

  Everyone knows the standard line on free will: Harry Frankfurt killed the Principle of Alternative Possibilities (PAP) back in 1969, and most philosphers have been digging the grave ever since. The classic move is to show an agent is morally responsible even when they couldn't have done otherwise, thanks to a counterfactual intervener (like Black waiting to force Jones's hand). But these cases always feel like they're smuggling something in. They treat "alternative possibilities" as a single, flat thing—either you have them or you don't.

  My project splits this concept in two. I want to distinguish between **counterfactual branching** (the metaphysical fact that the world could have diverged) and **narrative openness** (the phenomenological experience of the choice being live within the agent's own story). The core question is simple: Can a Frankfurt-style intervener block counterfactual branching without touching narrative openness? If the answer is yes, then PAP doesn't die outright; it survives in a modified, experiential form. This isn't just metaphysics; it's about how characters (and people) understand their own agency.

  **The Gap in the Standard Debate**

  The existing literature is obsessed with the conditions for moral responsibility. The debate usually centers on whether the presence of the intervener undermines responsibility *because* it removes alternatives, or *despite* removing them. What gets ignored is the internal texture of the choice itself. Standard cases like Black and Jones are designed to be mechanical. They treat the agent as a puzzle piece, not a storyteller.

  This leaves a specific gap: we don't know if removing the *ability* to do otherwise necessarily removes the *sense* that doing otherwise was possible. Most arguments assume these stand or fall together. I'm arguing they come apart. By focusing on the narrative structure of the action rather than just the moral verdict, we can see if PAP is actually a claim about metaphysics or a claim about the shape of a life story. The standard debate misses this because it's too busy arguing about blame to look at the experience of choosing.

  **Methodology**

  I'm not doing a literature survey. There are already too many papers dissecting Frankfurt's original example. Instead, I'm using conceptual analysis to build one custom-built case designed specifically to test this split.

  The case will involve an agent who makes a significant moral choice under the shadow of an intervener, but where the intervener's mechanism is tied to the agent's own deliberative process in a way that preserves the *feel* of openness. I need to construct a scenario where the counterfactuals are closed (the world couldn't go differently) but the narrative arc remains open (the agent experiences the decision as a genuine conflict resolution).

  This beats a standard survey because it generates new data rather than recycling old intuitions. By tweaking the variables of the Frankfurt case to prioritize the agent's internal perspective, I can isolate whether "alternative possibilities" matters because of the world's structure or the agent's perspective.

  **Expected Outcomes**

  *   **Positive Result:** I successfully demonstrate a case where counterfactual branching is eliminated but narrative openness remains intact. This suggests PAP survives as a principle of narrative coherence rather than metaphysical freedom. It saves a version of free will that's compatible with determinism (or hidden intervener scenarios) but still meaningful for how we live.
  *   **Failure/Negative Result:** It turns out you can't have narrative openness without genuine counterfactual branching. If the intervener closes the future, the story feels fake even to the agent. This would confirm the hard incompatibilist view but clarify *why* PAP feels so intuitive—it's tied to the story structure, not just responsibility.

  Either way, the result clarifies the stake. Right now, the debate is stuck in a loop. This breaks the loop by changing the definition of "possibility."

  **Scope and Timeline Check**

  Three months is tight, but doable for this specific scope. I'm not trying to solve free will; I'm testing one specific distinction within one specific type of case.

  *   **Month 1:** Drafting the custom case. This is the hard part. It needs to be robust enough to withstand basic objections without getting bogged down in technical mechanics.
  *   **Month 2:** Stress-testing the case. Running it against standard objections (flicker strategies, etc.) to ensure the split between branching and narrative holds.
  *   **Month 3:** Writing up the analysis and preparing the workshop presentation.

  The risk here is scope creep—getting sucked into the broader literature on moral luck or determinism. I need to stay disciplined and focus only on the intervener's effect on the *story* of the choice. There is no definate guarantee the case will work, but even a failed case that clarifies why the split fails is a valuable result for the workshop.

  **Why This Matters**

  For a novelist, this isn't academic hair-splitting. It's about character truth. If narrative openness survives even when the future is fixed, then characters can be free even in a deterministic plot. That changes how I write agency. For the workshop, it offers a fresh angle on a stale debate, moving away from responsibility conditions and toward the phenomenology of action. It's a small grant, but the payoff is a clearer understanding of what we actually lose when we lose free will.
