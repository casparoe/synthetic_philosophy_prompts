answer: |-
  This is a remarkably sharp observation. You have identified that your university is practicing a hybrid of **Burkean conservatism** (the curriculum) and **managerial neoliberalism** (the budget/units), and you've spotted that the bureaucratic implementation of the "Fence" principle has drifted from its philosophical source.

  You are right to feel that something is underdetermined here. The university is treating Chesterton's Fence not as a heuristic about wisdom, but as a **records-compliance hurdle**.

  Here is a reconstruction of the implicit theory, an analysis of the tensions you identified, and a proposal for how to make the system consistent.

  ### 1. Reconstructing the Implicit Theory: "Bureaucratic Burkeanism"

  The specific rule you describe ("No removal until the original documented rationale is produced") presupposes a theory of **Institutional Intent as Causal Mechanism.**

  It assumes that:
  1.  **Rules are Artifacts, not Organisms:** It treats rules like built objects (fences) with a specific design intent, rather than evolved norms.
  2.  **Design Intent is Recoverable:** It assumes the "why" is stored in the minutes, not in the practice itself.
  3.  **Continuity of Purpose:** It bets that if the original rationale is lost, the rule might be serving a *latent* function we don't understand (the "Orphaned-Function Problem" you identified).

  **The Literature on the "Orphaned-Function":**
  In sociology, this is the distinction between **Manifest Functions** (stated intent) and **Latent Functions** (unintended but beneficial consequences), a la Robert Merton. In institutional economics, this is **Path Dependence** (North/Arthur). Your university's rule assumes that Manifest Functions are the load-bearing walls. If you lose the blueprint (the minutes), you cannot verify if the wall is load-bearing, so you must assume it is.

  **The Flaw:** As you noted, a rule introduced for Reason A (Manifest) might now be sustaining Reason B (Latent). By demanding the *historical* document, the university is looking for Reason A. If they find it, they might delete the rule, accidentally collapsing Reason B. If they don't find it, they keep the rule, potentially preserving Reason B by luck. The rule is epistemically misaligned with systemic risk. It protects against *ignorance of history*, not *ignorance of system dynamics*.

  ### 2. Addressing Your Four Tensions

  #### One: Historical Reason vs. Current Function
  **The Implicit Bet:** The rule bets on **Teleological Stability**. It assumes that if a rule's original purpose is no longer valid or knowable, the rule is likely dead weight *unless* proven otherwise.
  **The Problem:** You are correct; this is the wrong question for systemic safety. The right question is: *"What breaks if this vanishes?"*
  **Why they do it:** Asking "What breaks?" requires simulation and risk assessment (expensive). Asking "Where are the minutes?" requires archival digging (cheap). The university has substituted a **proxy** (documentation) for the **actual safety check** (impact analysis). This is "Cheap Burkeanism."

  #### Two: Epistemic vs. Burkean Force
  **The Verdict:** Your committee is operating on **Epistemic** grounds, not Burkean ones.
  *   **True Burkeanism:** The wisdom is in the *survival* of the practice, not the *record* of its intent. Even if you find the memo, a Burkean says, "It has survived this long; there may be reasons the memo didn't capture."
  *   **Your University:** The rule implies that finding the document *discharges* the obligation. It treats the "mystery" as a lack of data, not a lack of human capacity to understand complexity.
  *   **Consequence:** This makes the Fence fragile. Once the memo is found, the "magic" is gone, and the rule becomes vulnerable to the Sunset policy.

  #### Three: Irreversibility and Cost Asymmetry
  **The Verdict:** This is doing the heavy lifting.
  Chesterton's Fence is rarely invoked for reversible decisions. If you can put the fence back up in an afternoon, you don't need to know why it was there.
  *   **Curriculum:** Changing a major requirement is high-friction (accreditation, catalog printing, student advising, transfer credits). It is **quasi-irreversible**.
  *   **The Presupposition:** The rule presupposes that **Error Costs are Asymmetric.** The cost of removing a necessary rule (broken degree integrity, accreditation loss) is higher than the cost of keeping a useless one (student annoyance). Therefore, the Default Position must be **Retention**.

  #### Four: The Sunset Inconsistency (The Core Contradiction)
  You ask if a single principle can cover both the Fence (Default: Keep) and the Sunset (Default: Delete).
  **Yes, but only if the principle is "Minimize Total Error Cost," not "Respect Tradition."**

  *   **Curriculum (Fence):** The risk is **Systemic Collapse.** (Students can't graduate, accreditation fails). The cost of a False Negative (keeping a bad rule) is low. The cost of a False Positive (deleting a good rule) is high. **→ Default: Keep.**
  *   **Budget/Units (Sunset):** The risk is **Resource Waste.** (Money spent on zombie centers). The cost of a False Negative (cutting a useful unit) is recoverable (you can re-fund next year). The cost of a False Positive (keeping a useless unit) is continuous financial bleed. **→ Default: Delete.**

  **The Asymmetry of Absence:**
  You asked why nobody applies the Fence to *absences* ("Find out why no one ever fenced this").
  *   **Presupposition:** This reveals a **Status Quo Ontology.** Existing structures are treated as *positive entities* requiring explanation to remove. Non-structures are treated as *void* requiring explanation to create.
  *   **Philosophical Implication:** This is conservative bias masquerading as neutrality. It treats the current institutional footprint as the "natural state" and any expansion as "deviation." It ignores that the *absence* of a rule might be the residue of a past decision (e.g., "We decided not to require Stats in 1990"). If you applied the Fence to absences, you'd have to justify *not* having a requirement, which would lead to regulatory explosion.

  ### 3. Grandfathering: Reliance vs. Ignorance
  You are right to separate this.
  *   **The Fence** is about **Systemic Risk** (Epistemic/Functional).
  *   **Grandfathering** is about **Vested Rights** (Deontological/Contractual).

  Grandfathering admits that even if the Fence was wrong (i.e., we found the memo and the rule *is* stupid), we cannot apply the correction retroactively without violating a **Reliance Interest**. Students entered a contract (the catalog) under specific terms. Changing the terms mid-stream is a breach of fairness, regardless of the rule's utility. This is Rawlsian stability: rules must be stable enough for agents to form life plans.

  ### 4. A Consistent Version: Sorting by Reversibility and Externality

  To make the university consistent, you shouldn't apply Fence everywhere or Sunset everywhere. You should sort policies by **Reversibility Cost** and **Interdependence.**

  | Feature | High Reversibility Cost + High Interdependence | Low Reversibility Cost + Low Interdependence |
  | :--- | :--- | :--- |
  | **Examples** | Degree Requirements, Tenure Rules, Safety Protocols | Budget Lines, Temporary Centers, Elective Courses |
  | **Default** | **Fence (Keep)** | **Sunset (Delete)** |
  | **Justification** | Error is catastrophic/hard to fix. | Error is costly but recoverable. |
  | **Burden of Proof** | On the Changer (Prove it's safe to remove). | On the Keeper (Prove it's worth keeping). |

  **The "Absence" Fix:** To fix the asymmetry of absence, you apply the Fence only to **Constraints on Liberty** (requirements) and the Sunset to **Claims on Resources** (budget).
  *   *Requirement:* Constrains student freedom. Default should be Liberty (No Requirement). **WAIT.** Your university does the opposite.
  *   *Correction:* Actually, in a professional degree, the "Constraint" is the product. A degree without requirements is worthless. So the "Product Integrity" argument overrides the "Liberty" argument.
  *   *Refined Principle:* **Constraints on Liberty** (Rules) get the Fence (protect against unintended loss of value). **Claims on Resources** (Budget) get the Sunset (protect against waste).

  ### 5. The Practical Bit: Swapping to "Present Merits Only"

  If you replaced the Fence Rule with its opposite ("Every requirement is presumed gone unless argued for on current merits with no credit for history"), here is what happens:

  **What You Gain:**
  1.  **Zombie Purge:** You immediately eliminate rules that persist solely due to inertia. (e.g., "Must take Latin" when no one teaches it).
  2.  **Alignment:** Curriculum aligns with current faculty expertise and job market, not the vision of a retired professor from 1985.
  3.  **Agency:** Current staff regain ownership of the curriculum. It becomes *their* product, not an inheritance.

  **What You Lose (The Concrete Risks):**
  1.  **Coordination Collapse:** You mentioned the "Orphaned Function." Concrete example: A prerequisite seems useless, but it ensures students have the specific math background needed for a *different* department's core class. If you delete it based on "current merits" of *your* department, you break the *other* department. The "Historical Rationale" often contains cross-departmental treaties that current silos forget.
  2.  **Accreditation Vulnerability:** Accreditors love stability. Constant churn of requirements looks like instability. The Fence provides a paper trail of "Due Diligence" that protects against external audit.
  3.  **Political Warfare:** If every rule must be re-justified every cycle, every requirement becomes a political battle. Faculty will spend all their time defending their turf rather than teaching. The Fence acts as a **Peace Treaty**: "We don't fight over this unless someone has a *really* good reason."
  4.  **Loss of Long-Term Vision:** Some rules are investments (e.g., a rigorous methods module) whose payoff isn't visible for 5 years. A "Present Merits" audit favors short-term metrics (enrollment, satisfaction) over long-term quality.

  ### Summary Diagnosis

  Your university is not inconsistent; it is **compartmentalized**.
  *   It treats **Curriculum** as **Capital** (long-term asset, hard to replace, protect with Fence).
  *   It treats **Administration** as **Expense** (ongoing cost, easy to cut, manage with Sunset).

  The "Find the Document" rule is a **bureaucratic corruption of Burke**. It mistakes *archive retrieval* for *wisdom*. A robust version would not ask "What did they say?" but "Have we simulated the removal?"

  **Recommendation for your seminar:**
  Argue that Chesterton's Fence is not about **History** (the past intent); it is about **Complexity** (the hidden present function). Your university's rule fails because it looks backward (minutes) instead of looking sideways (systemic dependencies). The Sunset policy is compatible *if* understood as a budget constraint vs. a structural constraint. But the "Find the Document" clause is merely administrative laziness wearing a philosophical mask.
