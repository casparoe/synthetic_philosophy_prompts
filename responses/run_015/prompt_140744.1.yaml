  **The Question**

  The central question of this chapter is not whether omissions can be causes, but what fixes their temporal boundaries. Standard causal relata are events, which possess intrinsic temporal extents: a watering begins when the water flows and ends when it stops. Omissions lack such events. Consequently, there is no intrinsic fact about when an omission begins, ends, or even which omission is occurring. My hypothesis is that these boundaries are not fixed by the world, but by the practical or normative context in which the omission is cited. The chapter will seek a determinate answer to this question: Is the temporal indeterminacy of omissions a metaphysical defect, or is it a functional feature determined by external constraints? I will argue for the latter. Using the case of failing to water plants, I will demonstrate that while there is a last moment where watering would have saved them, identifying that moment requires information often unavailable to the agent. Therefore, the omission's identity is not found in the physics of the dying plants, but in the expectations placed upon the agent. The chapter aims to establish that omissions are temporally indefinite until a context supplies a window. This shifts the debate from the causal powers of absences to the metaphysics of how we individuate non-events. If successful, this provides a clear criterion for when an omission is causally relevant: not when it matches a physical process, but when it fits a normative window. This determinate answer allows us to move beyond the stalemate of whether absences exist, focusing instead on how they are constructed for causal explanation. The outcome will be a refined understanding of causation that accommodates legal and ordinary reasoning without requiring mysterious causal powers for nothingness.

  **Why Existing Positions Leave It Open**

  Current philosophical positions leave this question open because they assume the relata of causation are already individuated before causal relations are assessed. Theories that affirm omission causation typically rely on counterfactual dependence. They argue that if the agent had acted, the outcome would have differed. However, this approach presupposes a specific time at which the agent should have acted. It does not explain how that time is selected from the continuous flow of events. If I watered on Tuesday but not Monday, the counterfactual account says I caused survival, but it struggles to specify why Monday's non-watering was the omission rather than Tuesday's watering. This is the problem of which omission occurred. Conversely, theories that deny omission causation often rely on process or mechanistic accounts. They argue that there is no physical transmission of energy or force from a non-event. While correct that there is no physical process, this objection mistakes the lack of intrinsic temporal properties for a lack of causal relevance. They treat the absence of a mechanism as the absence of a cause, ignoring that the mechanism objection is really about the lack of an event to bear temporal properties. Both sides treat the omission as a fixed entity waiting to be evaluated. Interventionist frameworks attempt to model this by setting variables to default values. Yet, choosing a default value implicitly selects a temporal window for the variable. By stipulating when the variable matters, the modeler settles by fiat the very boundary question that remains metaphysically open. Consequently, the literature debates the efficacy of omissions without addressing their individuation. This leaves the barrister's question unanswered: at what time did the omission occur? Without an account of how omission boundaries are set, causal models risk circularity, building the answer into the setup. The existing debate is stuck because it treats temporal indeterminacy as a bug to be fixed rather than a feature to be explained. This chapter addresses that gap by showing that the indeterminacy is real and resolved only by normative context. The failure to address this leads to confusion in applied fields like law, where liability turns on precise timing that metaphysics currently cannot supply. Ultimately, the literature assumes the omission is a defined relatum.

  **What I Would Actually Do**

  The chapter will be written over nine months, targeting nine thousand words. The work will proceed in three sequential stages. Months one through three will establish the metaphysical claim. I will argue that actions have intrinsic temporal extents fixed by the event itself, while omissions do not. I will use cases like the plant example to show that the start and end of an omission depend on when action was expected, not on physical facts. This section will defend the view that temporal boundaries are extrinsic. I will draft these sections early to allow maximum time for conceptual refinement. I aim to produce one thousand words per month. Months four through six will critique existing causal modeling. I will examine how interventionist accounts represent omissions by setting variables to defaults. I will demonstrate that this modeling choice implicitly encodes a temporal window, thereby stipulating the boundary rather than discovering it. This section will show that the apparent precision of causal models hides the contextual selection process. I will engage with technical objections regarding variable selection to ensure the critique is robust. Months seven through nine will apply this framework to legal liability. I will analyze the distinction between causing and allowing harm. I will argue that the law's requirement of a duty before liability for omission tracks the window-sensitivity identified earlier. The law does not demand a different kind of causation, but a different temporal window fixed by normative duty. This provides a deliverable for non-metaphysicians. Throughout this process, I will maintain a draft for continuous revision. The remaining three months of the fellowship year will be dedicated to polishing the argument and responding to feedback. This order ensures the metaphysical foundation is solid before applying it to technical models and practical law. It moves from abstract ontology to concrete application, ensuring each step supports the next. I will submit drafts to colleagues at the end of each stage to test clarity. The goal is a complete, submit-ready chapter by the end of the nine-month writing period.

  **What Would Count as Success**

  Success for this chapter means demonstrating that temporal indeterminacy explains the resistance to omission causation. If I can show that the mechanism objection is really about the lack of an event to bear temporal properties, the metaphysical puzzle dissolves. Success also requires showing that legal duty functions as the boundary-fixing mechanism. If the legal distinction between causing and allowing aligns with the proposed window-sensitivity, the chapter offers a unified account. Failure would occur if omissions turn out to have intrinsic temporal properties after all. For instance, if the last possible moment to save the plants is physically fixed regardless of expectation, my hypothesis collapses. Another risk is if the legal distinction relies purely on moral policy rather than metaphysical timing. If the law requires duty for reasons unrelated to causal windows, the application fails. Time management is also a risk. The project could also sink if the interventionist critique proves untenable. If causal models can represent omissions without stipulating windows, the second claim fails. I must be honest that this is a diagnostic project. It may not solve all problems of omission causation, but it aims to resolve the specific stalemate regarding timing and individuation. If the argument proves too narrow, I will broaden the scope to include other non-event causes. However, the primary risk is that the window-sensitivity is merely semantic. I will mitigate this by grounding the windows in practical constraints rather than linguistic convention.

  **Why This Angle Rather Than the Obvious Alternatives**

  Why pursue this angle rather than the obvious alternatives? The standard debate asks directly whether omissions are causes. This question has reached a stalemate because both sides talk past each other regarding individuation. A direct defense of omission causation ignores the mechanism objection. A direct denial ignores the counterfactual intuition. This project offers a diagnostic explanation of why the debate is stuck. It does not merely add another voice to the yes or no camp. Instead, it explains the conditions under which each side is correct. This angle is more fruitful because it bridges metaphysics and practice. It offers tools for lawyers and scientists who use causal models without resolving the underlying ontology. Alternatives that focus solely on metaphysics lack this practical deliverable. Alternatives that focus solely on law lack the metaphysical grounding. By focusing on temporal boundaries, this chapter provides a neutral framework that accommodates both intuitions. It transforms a metaphysical problem into a structural one. It ensures accessibility for generalists while retaining rigor.
