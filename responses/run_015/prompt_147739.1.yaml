      *   The famous claim "A white horse is not a horse" ($Bai ma fei ma$) is usually interpreted not as denying that white horses are members of the class of horses, but as asserting that the *concept* or *name* "White Horse" is not identical to the *concept* or *name* "Horse". It's a claim about intension, not extension.
