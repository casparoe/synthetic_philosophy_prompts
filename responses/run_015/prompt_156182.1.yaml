      *   *Antidote?* Close. Antidotes usually involve $S$ triggering the mask. Here $S$ triggers the process which triggers the mask. It's an *endogenous* mask.
      *   *Verdict:* It's a specific species of Mask (or Antidote, depending on definition). It doesn't necessarily require a *fourth* category, but it highlights a gap in how "extrinsic" masks are usually described. Standard masks are often thought of as external additions (cotton, packing). This mask is a *product* of the disposition's initial firing.
