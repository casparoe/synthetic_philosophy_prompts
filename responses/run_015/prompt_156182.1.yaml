      *   *Standard Antidote:* $S$ triggers $I$ which prevents $M$. (Often treated as a subset of masks where the stimulus brings the mask).
      *   *Auto-Mask:* $S$ occurs, $B$ persists (technically, the bulk remains $B$), but the *exercise* of $B$ generates $I$ ($P$), which prevents further $M$.
      *   *Crucial Detail:* The user specifies $B$ is the microstructure. $P$ adheres to the surface but "does not touch $B$" (shave it off, exposed surface is still $B$). This implies $B$ is retained during the masking.
