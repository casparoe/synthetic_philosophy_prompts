      *   *Variation 2 (Object Individuation):* If the object is "Bar + Film", then the disposition is different. This touches on the "Intrinsicness" requirement.
      *   *Shallow?* The distinction isn't shallow metaphysically, but it is sensitive to *individuation*. Dispositions are properties of *objects*. If you change the object boundaries, you change the property bearer.
      *   *Taxonomy Work:* The taxonomy helps identify *where* the causal chain breaks. Fink = Basis broken. Mask = Chain blocked. This remains useful even if object boundaries are fuzzy. However, if the "mask" is intrinsic to the object's nature (like passivation), calling it a "mask" might be misleading. It might be better to say the disposition is *conditional* or *limited*.
