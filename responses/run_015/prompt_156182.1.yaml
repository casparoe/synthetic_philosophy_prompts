  6.  **Drafting Responses to Question 4 (Epistemology & Upshot):**
      *   *Tests:* Naive immersion = "Insoluble" (false negative). Scrub/Surfactant = "Soluble" (true positive).
      *   *Principle:* The test that isolates the causal power of $B$ from accidental blockers. We want to know what $B$ *does*, not what $B$ does in the presence of its own byproducts if those byproducts are removable.
      *   *Gradual Case:* As film formation speeds up, solubility becomes vague. This suggests dispositions come in degrees or are context-sensitive. There is no sharp fact if the laws are continuous.
      *   *Powers vs. Conditional:*
          *   *Conditional:* Struggles with the "no interference" clause without circularity. Needs to specify "normal conditions."
          *   *Powers/Causal:* Says the power exists in virtue of $B$. The film is a separate causal factor. The power is real even if masked.
