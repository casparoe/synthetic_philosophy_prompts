  **TO:** Ethics Committee
  **FROM:** [Member Name]
  **DATE:** Wednesday
  **SUBJECT:** Recommendation: Cross-Border Surrogacy Case

  **Recommendation**
  Approve the treatment cycle under our standard Identity-Release Policy. Deny the request for permanent donor anonymity. Deny the creation of a paid anonymous-donor track. Deny the director's escrow compromise.

  **Protective vs. Expressive Obligations**
  Our colleague's distinction between expressive and protective bans is decisive. Expressive bans register moral disapproval; protective bans safeguard identifiable parties. We may ethically navigate around expressive bans via jurisdiction. We cannot bypass protective ones. The child's right to trace origins and the donor's right to transparent consent are protective. These duties travel with the parties. To facilitate permanent anonymity is to export the very harm our policy prohibits, regardless of where the birth certificate is issued. We cannot outsource ethical obligations to geography.

  **Evaluation of Compromises**
  The escrow proposal is fundamentally incoherent. Donors consented to identity release, not to becoming a secret held in confidence against the parents' will. This alters the consent contract post-hoc. Furthermore, a clinic promise cannot shield data from foreign subpoenas. It creates false security for the parents and compromised consent for the donor.
  Similarly, opening a paid anonymous track undermines our two-year commitment to donor dignity. It incentivizes secrecy over welfare, effectively creating a second-tier class of donors paid for silence. We cannot normalize this without dismantling our existing ethical framework.

  **Addressing the Harm Reduction Argument**
  The strongest counter-argument is that denial drives patients to unregulated brokers, endangering everyone. This is not a bluff; it is a likely outcome. We must take this seriously. However, approving the *treatment* under *standard rules* neutralizes this risk. By accepting the patients but refusing the anonymity waiver, we keep the medical care within our regulated environment. The carrier and donor receive full protections; the child retains their right to origins.

  Those arguing for the waiver prioritize the family's legal security back home. That risk is real: criminal liability and non-recognition are severe. The strongest version of this argument holds that family instability caused by prosecution harms the child more than donor anonymity does. However, mitigating that risk requires us to violate our protective duties to the donor and child. We cannot shift the burden of the home country's restrictive laws onto our donors. We prevent physical harm by keeping them here, but we cannot accept ethical harm to solve their legal problem. The parents must weigh the legal risk themselves; we cannot remove it by compromising donor rights.

  **Timeline and Review**
  This decision applies to this specific case only. We will revisit our policy on cross-border legal conflicts in 12 months to determine if broader guidelines are needed regarding patients from restrictive jurisdictions.
