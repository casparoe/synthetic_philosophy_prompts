answer: |-
  You cannot construct a stakes-sensitive theory of knowledge that simultaneously satisfies the intuition that high stakes destroy knowledge, the intuition that knowledge is temporally stable, and the intuition that retroactive stake changes do not erase past knowledge.

  ### Desiderata Specification

  **1. Classic Case Coverage**
  *   **Bank Cases (Stanley):** Must explain why "I know the bank is open" is true/acceptable in Low Stakes (minor inconvenience if wrong) but false/unacceptable in High Stakes (financial ruin if wrong), without altering the evidential basis.
  *   **Lottery Propositions:** Must explain why high-probability beliefs (ticket #42 lost) fail to constitute knowledge even when stakes are low, distinguishing them from ordinary perceptual beliefs.
  *   **Stopped Clock (Gettier):** Must ensure that accidental true beliefs (looking at a stopped clock at the right time) fail to count as knowledge regardless of stakes levels.
  *   **Skeptical Scenarios:** Must explain why we claim to know ordinary propositions (I have hands) despite unable to rule out skeptical hypotheses, unless stakes regarding skepticism are raised.

  **2. Conceptual Distinctions**
  *   **Knowledge vs. Justified True Belief (JTB):** [Contested] Must specify whether stakes raise the threshold for *justification* or alter the definition of *knowledge* itself.
  *   **Knowledge vs. Rational Acceptance:** [Contested] Must distinguish knowing P from being rationally permitted to act as if P is true; stakes-sensitive theories often blur this, but a robust theory must explain why we deny "knowledge" rather than just "prudence."
  *   **Subject-Stakes vs. Attributor-Stakes:** [Contested] Must determine whose practical situation matters: the subject's (S) or the knowledge attributor's (A).
      *   *Subject-Stakes:* S's interests determine if S knows.
      *   *Attributor-Stakes:* A's interests determine if A can truthfully say "S knows."

  **3. Psychological & Cognitive Constraints**
  *   **Belief Revision Latency:** [Settled] Psychological data shows belief states do not vanish instantly upon stake changes; a theory claiming knowledge disappears immediately when stakes rise contradicts the phenomenology of belief persistence.
      *   *Constraint:* The theory should not require the subject to consciously process the stakes change to lose knowledge.
  *   **Risk vs. Confidence:** [Settled] Increased stakes typically lower willingness to assert or act, not necessarily subjective credence; a theory should not conflate reduced confidence with loss of knowledge unless evidence changes.
  *   **Action-Knowledge Link:** [Contested] Must account for the intuition that if you know P, it is appropriate to act on P; if stakes make acting on P irrational, the theory must explain whether knowledge was absent or action was restricted.

  **4. The Retroactive Edge Case**
  *   **Scenario:** S forms belief P at t1 (Low Stakes). At t2, it is revealed that the stakes at t1 were actually High (e.g., an audit shows the t1 decision was critical, though S didn't know this at t1).
  *   **Requirement:** Must determine if S knew P at t1.
      *   *Option A (Retroactive Loss):* S never knew P at t1 because the objective stakes were high.
      *   *Option B (Temporal Stability):* S knew P at t1 because the relevant stakes were those perceived or actual at t1.
  *   **Constraint:** [Contested] A theory must not imply that knowledge status fluctuates based on future discoveries unrelated to the evidence available at the time of belief formation, unless it accepts radical temporal instability.

  ### Classification of Requirements

  **Non-Negotiable (Wide Reflective Equilibrium)**
  *   **Factivity:** Knowledge requires truth (S cannot know P if P is false).
  *   **Non-Accidentality:** Gettiered beliefs are not knowledge (Stopped Clock must fail).
  *   **Evidence Sensitivity:** Changes in evidence must be able to change knowledge status.

  **Camp-Specific / Contested**
  *   **Stakes as Truth-Conditions:** Contextualists and Pragmatic Encroachers accept this; Traditional Invariantists reject it.
  *   **Whose Stakes:** Contextualists prioritize Attributor-Stakes; Pragmatic Encroachers prioritize Subject-Stakes.
  *   **Retroactive Stability:** Traditionalists require stability; Radical Encroachers may accept retroactive loss if stakes are objective.
  *   **Lottery Parallel:** Some theories treat Lottery and High-Stakes Bank cases identically (both fail); others distinguish them (Bank succeeds in low stakes, Lottery never succeeds).

  ### Incompatibilities & Tensions

  **The Retroactive Trilemma**
  You cannot satisfy these three jointly:
  1.  **Stakes-Sensitivity:** Knowledge status depends on practical stakes.
  2.  **Temporal Stability:** Knowledge status at t1 is fixed at t1 and cannot change at t2.
  3.  **Objective Stakes:** The stakes relevant to knowledge are the actual objective stakes, not just perceived stakes.

  *Reasoning:* If knowledge depends on Objective Stakes (1 & 3), and objective stakes at t1 are only discovered at t2, then knowledge status at t1 changes at t2, violating Temporal Stability (2).
  *Resolution:* To avoid retroactive loss, you must either deny Stakes-Sensitivity (Invariantism) or claim only *perceived* stakes matter (which risks making knowledge too easy in high-stakes environments where the subject is ignorant of the risk).

  **The Lottery-Bank Tension**
  *   **Conflict:** If high stakes destroy knowledge in the Bank Case, why don't high stakes (wanting to win) destroy knowledge in the Lottery Case? Or conversely, if low stakes allow knowledge in the Bank Case, why don't low stakes allow knowledge in the Lottery Case?
  *   **Unsatisfiable Pair:** Maintaining that Bank Low-Stakes is Knowledge while Lottery Low-Stakes is Not Knowledge requires a distinction between "practical stakes" and "probabilistic risk" that many stakes-sensitive theories struggle to articulate without collapsing into traditional evidentialism.

  ### Theory Audit

  **1. Pure Contextualism**
  *   **Performance:** Solves Attributor-Stakes variance easily. Handles Bank Cases by shifting semantic content of "knows."
  *   **Failure:** Struggles with Subject-Stakes (S's own action seems irrational even if A says "S knows"). Fails the Retroactive Edge Case if context shifts retroactively (implies knowledge status changes based on later conversation).
  *   **Verdict:** Sacrifices Temporal Stability of knowledge propositions across contexts.

  **2. Invariantist Pragmatic Encroachment (Stanley/Fantl & McGrath)**
  *   **Performance:** Handles Subject-Stakes well (S loses knowledge when S's stakes rise). Preserves semantic invariantism.
  *   **Failure:** Vulnerable to the Retroactive Trilemma (if stakes are objective, knowledge is lost retroactively). Struggles to distinguish Lottery from Bank without appealing to evidence differences that undermine the stakes claim.
  *   **Verdict:** Sacrifices Temporal Stability or requires contentious distinction between risk types.

  **3. Knowledge-First (Williamson)**
  *   **Performance:** Preserves Temporal Stability and Factivity robustly. Treats knowledge as a mental state unaffected by stakes.
  *   **Failure:** Rejects the core desideratum that stakes affect knowledge; explains Bank Cases via norms of *assertion* or *action* rather than knowledge itself.
  *   **Verdict:** Avoids the trilemma by denying Stakes-Sensitivity applies to knowledge, shifting the burden to practical rationality.

  ### Settled vs. Contested Summary

  *   **Settled:** Knowledge implies truth; Gettier cases are not knowledge; evidence matters.
  *   **Contested:** Whether "knows" is context-sensitive; whether practical rationality constitutes knowledge conditions; whether future stake discoveries alter past knowledge status.
  *   **Consensus Warning:** There is no consensus that stakes *should* affect knowledge; the field is split between those who think stakes affect knowledge (Encroachment/Contextualism) and those who think stakes affect only action/assertion (Traditionalism/Knowledge-First).
