answer: |-
  No framework fully solves the tension between delegating complex computation and maintaining user verifiability, but scaffold-preserving delegation offers the only viable path to minimizing understanding erosion.

  **Desiderata for Epistemic Delegation**

  1.  **Justification Tracking over Truth Tracking**
      *   **Motive:** Distinguishes tracking truth (getting the right answer) from tracking justification (knowing *why* it is right); blind accuracy leads to fragility when premises shift.
      *   **Status:** Hard.
      *   **Note:** Requires access to the reasoning chain, not just the verdict.

  2.  **Procedural Fluency Retention**
      *   **Motive:** Cognitive-science result that procedural fluency predicts retention; if the user never executes the logic, the neural pathways for that reasoning atrophy.
      *   **Status:** Hard (for avoiding erosion).
      *   **Note:** Implies the user must occasionally perform, not just inspect, reasoning steps.

  3.  **Intermediate-Step Inspectability**
      *   **Motive:** Distinction between intermediate-step outsourcing vs. verdict-only; verdict-only black boxes prevent error localization and learning.
      *   **Status:** Hard.
      *   **Note:** The AI must expose its derivation tree.

  4.  **Verification Feasibility**
      *   **Motive:** If the user cannot cognitively process the verification, inspectability is theater; the user must be capable of validating the steps within reasonable time.
      *   **Status:** Hard.
      *   **Note:** Bounds the complexity of delegable tasks to the user's competence ceiling.

  **Joint Unsatisfiability Flag**
  *   **Conflict:** **Desideratum 3 (Intermediate-Step Inspectability)** + **Desideratum 4 (Verification Feasibility)** vs. **Deep Delegation**.
  *   **Tension:** If the user must be able to verify every step (Hard constraint), they cannot delegate complex symbolic computation that exceeds their own cognitive bandwidth. If they delegate computation beyond their verification capacity, they violate the verifiability constraint. This creates a "Competence Ceiling" where AI can only automate what the user could already do slowly, limiting the utility of delegation for complex tasks.

  **Candidate Scoring**

  1.  **Extended-Mind Thesis (Clark-Chalmers)**
      *   **Score:** Low.
      *   **Reasoning:** Treats the AI as a literal part of the cognitive system (like a notebook). While it legitimizes outsourcing, it fails **Procedural Fluency Retention**; if the tool is removed or fails, the "mind" loses the capability entirely, accelerating erosion rather than preventing it.

  2.  **Pure Testimonial-Reliance Model**
      *   **Score:** Fail.
      *   **Reasoning:** Treats AI as an expert witness providing verdicts. Violates **Justification Tracking** and **Intermediate-Step Inspectability**. Maximizes efficiency but guarantees erosion of understanding since the user accepts truth without justification.

  3.  **Scaffold-Preserving Delegation**
      *   **Score:** High (with caveats).
      *   **Reasoning:** Reasoning traces stay inspectable but the user never executes them. Satisfies **Intermediate-Step Inspectability** and partially satisfies **Justification Tracking**. However, it risks failing **Procedural Fluency Retention** because inspecting a trace is cognitively distinct from generating it; it mitigates erosion better than testimonial reliance but cannot guarantee fluency without mandatory user execution phases.
