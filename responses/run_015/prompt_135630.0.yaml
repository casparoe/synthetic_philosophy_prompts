          2.  Joint action *requires* shared intention (strict necessity).
          3.  Collective agents bear *non-derivative* moral responsibility (fault at collective level).
          4.  We-mode is phenomenologically real but ontologically weightless (descriptive, not metaphysical).
          5.  Institutional facts depend on collective acceptance, but this is decomposable (individual + common belief).
          6.  Unilateral veto power (anyone can dissolve without betraying collective obligation).
