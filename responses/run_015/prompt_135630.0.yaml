answer: |-
  ### Consistency Audit: Collective Intentionality Package

  Your package attempts to combine a **metaphysically individualist** framework (i, iv, v, viii) with **collectively robust** normative claims (iii, vii). The primary instability lies in trying to ground non-derivative collective responsibility on an ontology that explicitly denies irreducible collective entities.

  Below are the tensions ranked by severity, followed by conflicts that dissolve on inspection.

  ---

  ### I. Critical Tensions (Threaten Coherence)

  #### 1. The Metaphysics-Normativity Mismatch
  **Conflicting Commitments:** (i), (iv), (v) **vs.** (iii)
  **The Tension:** You assert that collective agents (corporations, states) bear *genuinely non-derivative* moral responsibility (iii). Simultaneously, you assert that the ontology underpinning these agents is fully decomposable into individual attitudes and common belief (i, v), and that the "we-mode" is ontologically weightless (iv).
  **Why it breaks:** "Non-derivative responsibility" typically entails a non-derivative subject. If the collective is ontologically weightless (iv) and decomposable (v), the "collective" is a shorthand for a pattern of individuals. If the subject is just a shorthand, the responsibility usually defaults to the constituents (derivative). To claim the fault is *genuinely at the collective level* while denying the collective *genuine ontological standing* creates a category error: you are assigning real moral weight to a metaphysical fiction.
  **Severity:** **Critical.** This undermines the defensibility of your entire normative claim (iii) given your ontological premises.
  **Least Costly Revision:** Reinterpret "non-derivative" in (iii) to mean **"non-distributive."** Claim that the responsibility belongs to the *structure of interaction* rather than a metaphysical entity, and cannot be mapped 1:1 onto individuals without remainder, even though the structure is composed of individuals.
  **The Cost:** You must defend the coherence of "free-floating" responsibility (responsibility that exists without a distinct metaphysical subject). You invite the objection that you are smuggling in plural subjecthood through the back door of normativity while denying it in ontology.

  #### 2. The Commitment-Stability Paradox
  **Conflicting Commitments:** (i) **vs.** (vi)
  **The Tension:** Your Bratmanian account (i) defines shared intention as including a "commitment to joint activity and mutual support." Bratmanian commitment inherently implies a constraint on unilateral withdrawal; without it, the intention is merely conditional. However, (vi) asserts that any participant retains unilateral veto power and exercising it is *never a betrayal of a collective-level obligation*.
  **Why it breaks:** If I can dissolve the activity at will without betraying an obligation generated by the joint commitment, the "commitment" in (i) is normatively inert. If the commitment is inert, it fails to distinguish shared intention from merely aligned individual intentions (which you reject in ii). You cannot have a robust "commitment to mutual support" that imposes no constraint on abandoning that support.
  **Severity:** **High.** This renders your definition of shared intention (i) internally inconsistent with your exit conditions (vi).
  **Least Costly Revision:** Qualify (vi) to acknowledge that while unilateral revision *dissolves the joint action*, it may constitute a **betrayal of an interpersonal obligation** generated by the interlocking intentions in (i).
  **The Cost:** You lose the strong libertarian claim that one is never bound by the collective. You must admit that interlocking intentions generate normative "glue" between individuals, even if there is no "plural subject" to be wronged.

  ---

  ### II. Significant Tensions (Require Clarification)

  #### 3. The Responsibility-Veto Gap
  **Conflicting Commitments:** (iii) **vs.** (vi)
  **The Tension:** If a collective agent bears non-derivative responsibility (iii), the continuity of that agent is morally significant. However, (vi) grants individuals the right to dissolve the activity (and potentially the agent's capacity to act) at will without collective-level betrayal.
  **Why it breaks:** If I can unilaterally dismantle the entity that bears the responsibility, the attribution of responsibility to that entity becomes unstable. It creates a loophole where collective responsibility can be evaded by individual withdrawal before the "fault" is adjudicated, or where the collective is blamed for failures caused by an individual's permissible exit.
  **Severity:** **Medium-High.** This makes your account of collective responsibility practically fragile.
  **Least Costly Revision:** Distinguish between **constitutive membership** and **operational participation**. Argue that (vi) applies to operational participation (leaving a specific project), but membership in the responsible collective (e.g., a corporation) entails standing obligations that restrict the veto power regarding the collective's core liabilities.
  **The Cost:** You complicate (vi) significantly. You must explain why veto power exists in some joint actions but not others, potentially undermining the universality of your claim about unilateral power.

  #### 4. Asymmetry vs. Mutuality
  **Conflicting Commitments:** (i) **vs.** (vii)
  **The Tension:** (i) requires "mutual responsiveness" for shared intention. (vii) allows for asymmetric joint action where one directs and another complies, with primary responsibility lying with the director.
  **Why it breaks:** In strict Bratmanian terms, if the director does not adjust their sub-plan in response to the complier's intentions (beyond mere coercion), mutuality is compromised. If the complier is merely responsive to the director, but the director is not responsive to the complier, the interlocking is one-way.
  **Severity:** **Medium.** This is a definitional stretch rather than a contradiction.
  **Least Costly Revision:** Clarify in (i) that "mutual responsiveness" allows for **weighted responsiveness**. The director is responsive to the complier's *capacity to execute*, even if not to their *goals*.
  **The Cost:** You dilute the strength of "mutuality." You must argue that tracking another's agency for the sake of efficiency counts as responsiveness, which some critics may reject as insufficient for *shared* intention.

  ---

  ### III. Dissolvable Conflicts (Apparent Only)

  #### 5. Phenomenology vs. Reductionism
  **Conflicting Commitments:** (iv) **vs.** (i)
  **Analysis:** You claim the we-mode is ontologically weightless (iv) but define shared intention via interlocking individual intentions (i).
  **Resolution:** This is consistent. You are claiming the *experience* of "we-ness" is real (phenomenology), but the *explanation* of that experience is fully reducible to individual psychology (ontology). As long as you do not claim the phenomenology proves irreducibility, there is no conflict.
  **Action:** None required. Ensure you explicitly state that phenomenology is not evidence for ontology in your defense.

  #### 6. Gilbert-Skepticism vs. Institutional Facts
  **Conflicting Commitments:** (v) **vs.** (viii)
  **Analysis:** You deny Gilbert-style plural subjecthood is necessary (viii) but accept institutional facts depend on collective acceptance (v).
  **Resolution:** This is consistent provided you maintain your reductionist clause in (v). You are arguing that institutional facts *look* like plural subjecthood but are *actually* decomposable individual acceptance + common belief. (viii) reinforces this by calling plural subjecthood merely a "descriptive label."
  **Action:** None required. This is a coherent deflationary account of social ontology.

  ---

  ### Summary of Strategic Risks

  1.  **The "Free-Floating Fault" Risk:** Your biggest vulnerability is defending (iii) without conceding ground on (i) or (iv). If you cannot explain how a metaphysically reducible entity bears irreducible blame, your normative theory will appear to float free of your ontology.
  2.  **The "Empty Commitment" Risk:** Your defense of (vi) must not undermine (i). If the "commitment" in shared intention imposes no constraints on exit, examiners will argue you do not actually have shared intention, only parallel action with common knowledge (which you explicitly exclude in ii).

  **Recommendation:** Prioritize resolving Tension 1 (Metaphysics-Normativity). If you cannot reconcile non-derivative responsibility with reductionist ontology, consider softening (iii) to "collective responsibility that is *functionally* non-distributive" rather than "genuinely non-derivative." This preserves the ethical insight without requiring metaphysical baggage you have explicitly rejected.
