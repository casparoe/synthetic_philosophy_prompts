      *   **Constraints:** Identify genuine tensions vs. apparent conflicts. Rank tensions by severity. For real tensions, propose the least costly revision and state the cost. Trace commitments precisely. No lecturing on literature/reading lists. Treat all commitments as live (user hasn't decided what to drop).
