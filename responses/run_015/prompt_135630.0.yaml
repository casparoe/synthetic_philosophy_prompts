      *Cost:* You lose the claim that there are *no* collective-level obligations. You admit individual-level obligations arise from the interlocking intentions.

  7.  **Final Review against constraints:**
      *   "Trace precisely what my commitments commit me to": Ensure I explain *why* the tension exists based on the logic of the points.
