prompt: |-
  i'm TAing my first solo section this term, 50 minutes, first-years, and next week i have to do causation by omission. They've just come off two weeks of Humean regularity stuff and Mackie-style INUS conditions, and they haven't done counterfactuals or possible worlds properly, so I'd rather not lean on "in the nearest world where..." if I can avoid it. I tried this last year with the plant that died because nobody watered it and it went badly: within ninety seconds someone said "so the Queen of England killed your plant," everyone agreed that was absurd, half of them concluded omissions can't be causes and the other half concluded that everything is a cause, and I had no move ready for either. So: don't explain causation by omission to me — I want a plan for how to teach it.

  What I'd like most is the order. What has to be on the board before "can a not-doing be a cause?" even feels like a real question rather than a verbal trick, given where these students are (they're happy talking about INUS conditions and drawing little sufficient-condition diagrams, and they currently think causation is a relation between events that happen)? Where does the "fine, but when and where did the not-watering happen?" worry fit — before the metaphysical "are absences things?" bit, after it, or should I skip that bit entirely at this level? And does the counterfactual way of putting it have to be smuggled in early anyway even though they don't have the machinery for it? For the carrying example I want one case, not three, that does the whole job: tell me what structural features it has to have and what it has to lack (my guess is exactly one person with a standing reason to act, nothing positive happening at all between the last chance to act and the outcome, and a counterfactual that is realistic rather than silly), why the plant fails — I think because it's too easy to reconstrue as a positive act, or because the real cause is obviously the sun and the dryness — and why the lurid medical cases will derail us into blame before we've even got the puzzle.

  Then the misconceptions, including the ones I've named myself, and the exact point in the sequence where each should be headed off: what I've been calling positive reconstrual — they turn the omission back into an action, "he chose to sit there," "she was doing something else instead" — which I think is the dangerous one because it makes the topic dissolve instead of getting answered; profligacy panic, the Queen of England line, which ate my whole class last year; the slide from cause to blame, which I suspect is what's really driving the "of course not" intuition; and the shrug where they decide it's just counterfactual dependence and move on. I've also been toying with a distinction I made up, between bare omissions (nobody had any reason whatsoever to expect you to act) and loaded omissions (there's a role, a practice, a standing expectation that you would): tell me whether bringing that in early gives me a clean way to handle profligacy without ending up having quietly substituted norms for causation, or whether it just teaches them that what causes what depends on what we expect of people — and if it's the latter, whether that's a bug I should hide for a week or a feature I should own out loud. Finally, what should I openly refuse to settle in fifty minutes and say out loud that I'm refusing (I'm guessing the legal act/omission doctrine, any structural-equation or difference-making formalism, and the free-will-adjacent material, but you tell me), and one question for the last five minutes that would actually show me they've grasped the shape of the problem rather than just picked a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **Role:** TA teaching their first solo section.
      *   **Audience:** First-year undergraduates.
      *   **Time:** 50 minutes.
      *   **Topic:** Causation by Omission.
      *   **Background:** Just finished Humean regularity and Mackie-style INUS conditions. *No* counterfactuals/possible worlds machinery yet (need to avoid "nearest possible world" talk).
      *   **Previous Experience:** TA tried this last year with the "dead plant" example. It failed quickly ("Queen of England killed your plant"). Students polarized (omissions aren't causes vs. everything is a cause). TA had no ready moves.
      *   **Goal:** A concrete teaching *plan*, specifically focusing on *order*, *examples*, *misconception management*, and *scope*. Not an explanation of the philosophy itself.
      *   **Specific Constraints/Requests:**
          *   Order of operations (what goes on the board first).
          *   Handling the "where/when did the not-happening happen?" worry.
          *   Counterfactuals: smuggle them in or avoid?
          *   Example selection: One carrying case (structural features needed/avoided). Why the plant failed. Why medical cases are bad.
          *   Misconceptions: Positive reconstrual, Profligacy panic (Queen of England), Cause vs. Blame slide, Counterfactual shrug. *When* to head these off.
          *   "Bare" vs. "Loaded" omissions distinction: Use it? Risk of norm-dependence?
          *   What to explicitly leave unresolved.
          *   One final assessment question.

  2.  **Deconstruct the Philosophical Problem (for Pedagogical Purposes):**
      *   The core tension: Causation seems to require energy transfer/events (Hume/INUS), but we constantly cite omissions as causes (lack of rain caused drought, not watering caused death).
      *   The "Queen of England" problem (Profligacy): If omissions are causes, *any* absence of a preventer is a cause.
      *   The "Positive Reconstrual" trap: "He didn't water it" becomes "He went to the pub instead." This dissolves the omission into a positive event, bypassing the philosophical puzzle.
      *   The Normative Slide: We often pick omissions as causes based on duty/expectation, not just metaphysics.

  3.  **Drafting the Plan - Step-by-Step:**

      *   **Phase 1: Setting the Stage (0-10 mins):**
          *   Need to leverage their existing INUS knowledge.
          *   Start with a standard INUS case to get them warm.
          *   Introduce the omission case *immediately* but frame it carefully.
          *   *Board Work:* Need to visualize the INUS structure first, then show where the omission breaks it.

      *   **Phase 2: The Example (The Core):**
          *   User rejected the plant example (too easy to say "sun killed it" or "Queen of England").
          *   User rejected medical cases (too much blame/emotion).
          *   Need a "Carrying Example" (one case to rule them all).
          *   *Criteria:* One agent, standing reason to act, no positive action between chance and outcome, realistic counterfactual.
          *   *Idea:* The "Relay Race" or "Safety Check" scenario. Let's go with a **Night Watchman & Fire**.
              *   Why? It's not a plant (sun is obvious alternative cause). It's not medical (life/death stakes trigger blame). It has a clear duty (loaded omission).
              *   Wait, User wants to avoid norms if possible, but also wants to handle Profligacy.
              *   Better Idea: **The Backup Generator**.
              *   Scenario: A server farm needs cooling. Main cooling fails. Backup generator *fails to start* because no one refueled it.
              *   Agent: The technician whose job it was.
              *   Why it works: It isolates the omission (refueling) from positive acts. It avoids the "Queen of England" because only the technician had the fuel/access.
              *   Wait, User specifically asked about the "Bare vs. Loaded" distinction. I should advise on *when* to introduce that.
              *   Let's stick to the User's intuition: One person, standing reason. Let's use **The Lifeguard** (but keep it non-fatal? No, death makes it real). Let's use **The Drowning Child & The Lifeguard**.
              *   *Correction:* User said medical cases derail into blame. A drowning is close to medical.
              *   *Alternative:* **The House Sitter & The Pipe**. House sitter agreed to check pipes. Didn't. Pipes burst.
              *   *Why:* Property damage is less emotionally charged than death. Clear duty. Clear physical process (freezing water).
              *   *Decision:* **The House Sitter**. It fits the "standing reason" criteria perfectly.

      *   **Phase 3: Addressing the "Queen of England" (Profligacy):**
          *   This killed the class last time. Needs to be addressed *before* it arises or immediately when it arises.
          *   Strategy: Use the INUS framework they know. An omission is part of a *sufficient set*. The Queen isn't part of the relevant sufficient set for *this* context.
          *   Wait, that's too technical.
          *   Better: Distinguish "Causes" from "Background Conditions." Hume/Mackie allows this.
          *   *Timing:* Bring this up right after the initial intuition pump.

      *   **Phase 4: Positive Reconstrual:**
          *   Students say: "He was watching TV instead."
          *   TA Move: "Grant that. But did the TV *cause* the burst pipe? Or did the *lack of heat* cause it?"
          *   *Timing:* When they try to escape the puzzle.

      *   **Phase 5: Counterfactuals:**
          *   User says they don't have the machinery.
          *   *Move:* Use "But-For" testing (legalistic but intuitive) without possible worlds semantics. "If X had happened, would Y have occurred?"
          *   Don't call it "Counterfactual Theory of Causation." Call it "The Dependence Check."

      *   **Phase 6: Norms vs. Metaphysics (Bare vs. Loaded):**
          *   User is worried this substitutes norms for causation.
          *   *Advice:* Own it. It *is* a feature, not a bug, at this level. It explains why we *select* causes, even if the metaphysics is messy.
          *   *Timing:* Towards the end, to solve the Profligacy problem.

      *   **Phase 7: Closing:**
          *   What to leave open? The metaphysical status of absences (are they real?).
          *   Final Question: Needs to test structural understanding, not verdict.

  4.  **Refining the Order (The "Board Work" Flow):**
      1.  Review INUS (Sufficient Sets).
      2.  Present Case (House Sitter).
      3.  Apply INUS (Where is the 'event'?).
      4.  The Profligacy Objection (Queen of England).
      5.  The "Positive Act" Escape.
      6.  The Normative Solution (Loaded vs. Bare).
      7.  Unresolved Metaphysics.

  5.  **Addressing Specific User Queries:**
      *   *Where does "when/where did it happen" fit?* After the INUS application, before the Profligacy objection. It highlights the metaphysical weirdness.
      *   *Counterfactuals?* Smuggle them in as "dependence tests," not modal realism.
      *   *Why the plant failed?* Too many alternative causes (sun, soil, seeds). Need a closed system.
      *   *Bare vs. Loaded?* Use it to solve Profligacy. Acknowledge it makes causation interest-relative.
      *   *What to refuse to settle?* The ontology of absences.
      *   *Final Question?* A variation on the case that swaps the norm but keeps the physics.

  6.  **Developing the "Carrying Example":**
      *   *Candidate:* The Night Watchman.
      *   *Setup:* Warehouse fire. Sprinklers need manual override. Watchman sleeps.
      *   *Why:* Clear duty. Clear physical chain (fire spreads). No "Queen of England" (she can't override sprinklers).
      *   *Refinement:* Let's go with the **Medication Monitor**. Patient needs pill at 8 AM. Caregiver forgets. Patient has episode at 10 AM.
      *   *Critique:* User said no medical.
      *   *Refinement:* **The Aquarium**. You agreed to feed the fish. You didn't. Fish die.
      *   *Critique:* Too close to plant.
      *   *Refinement:* **The Server Backup**. (Sticking with this).
      *   *Scenario:* A server needs a manual reboot at 3 AM to clear cache. Admin agrees to do it. Admin sleeps. Server crashes at 4 AM.
      *   *Why:* Technical, unemotional, clear dependency.
      *   *Wait, User wants "One person with standing reason."*
      *   *Let's go with the User's intuition on the Plant but fix the variables.*
      *   *Fix:* **The Greenhouse**. Automated system fails. *One* person has the key to the manual override. That person is on site. They drink coffee instead. Plants die.
      *   *Why:* Removes "Queen of England" (she doesn't have the key). Removes "Sun" (it's a greenhouse, controlled environment). Removes "Positive Act" (drinking coffee is irrelevant to the plants).
      *   *Actually, the "House Sitter" is more relatable.* Let's stick with **The House Sitter & The Frozen Pipes**.
      *   *Why:* Everyone understands freezing pipes. Everyone understands house sitting duties.
      *   *Structure:*
          1.  Temp drops below freezing.
          2.  Heat needs to be on.
          3.  Sitter promised to check heat.
          4.  Sitter didn't check.
          5.  Pipes burst.

  7.  **Finalizing the Plan Structure:**
      *   **Minute 0-5:** INUS Warm-up (Board: Sufficient Set).
      *   **Minute 5-15:** The Case (House Sitter). Map it to INUS.
      *   **Minute 15-25:** The Metaphysical Worry (Where is the event?).
      *   **Minute 25-35:** The Profligacy Worry (Queen of England) & The Normative Fix (Loaded Omissions).
      *   **Minute 35-45:** The Positive Reconstrual Trap.
      *   **Minute 45-50:** Wrap up & Final Question.

  8.  **Drafting the Content (incorporating the "Voice"):**
      *   Keep it direct, practical, and authoritative (TA to TA).
      *   Address the "Bare vs. Loaded" distinction carefully. It *is* normative, but that's how we select causes from conditions.
      *   Ensure the "Counterfactual" is handled as a tool, not a theory.

  9.  **Review against Constraints:**
      *   50 mins? Yes.
      *   First years? Yes (keep jargon low).
      *   No Possible Worlds? Yes (use "What if" instead).
      *   Address specific misconceptions? Yes.
      *   Board order? Yes.

  10. **Final Polish:** Check the "Final Question." It needs to distinguish between understanding the *problem* vs. having a *solution*.
      *   *Idea:* Swap the duty. If a stranger walked by, is it the same cause?
      *   *Yes:* That tests the Normative vs. Metaphysical distinction.

  11. **Self-Correction on "Bare vs. Loaded":** The user is worried this teaches that causation depends on norms. I need to advise them to be explicit: "We are talking about *causal selection*, not just *causal ontology*." This distinguishes the metaphysics (what exists) from the pragmatics (what we cite). This is a crucial distinction for first-years to hear early so they don't think philosophy is just "opinion."

  12. **Final check on the "Plant" failure:** Why did it fail? Because "nobody watered it" implies "nobody in the world." The Queen is part of "nobody." The House Sitter example restricts the field to "The person with the key/duty." This solves the Queen problem structurally, not just rhetorically. I need to emphasize this structural constraint in the plan.

  13. **Okay, ready to write.**
answer: |-
  Here is a 50-minute battle plan designed to keep you in control of the room, leverage their INUS training, and avoid the metaphysical swamps that ate your class last year.

  ### 1. The Board Order (0–5 Minutes)
  Do not start with omissions. Start with what they know. You need to establish a visual framework for causation *before* you break it.

  **Left Panel:** Draw a standard Mackie INUS diagram from their readings.
  *   Label it: **"Standard Causal Claim"**
  *   Write: *Cause = A necessary part of a sufficient condition.*
  *   Example: *Spark + Oxygen + Fuel → Fire.*
  *   Underline "Spark." Circle "Event."

  **Center Panel:** Leave blank for now. This is where the tension goes.

  **Right Panel:** Write **"The Puzzle."**
  *   1. Causation relates *events* (things that happen).
  *   2. Omissions are *non-events* (things that don't happen).
  *   3. We say omissions cause things (e.g., "Lack of water killed the plant").
  *   *Question:* How can a non-event be a part of a sufficient condition?

  **Why this order:** It forces them to see the contradiction using their existing toolkit. If you start with "Can a not-doing be a cause?" they treat it as a semantic trick. If you start with "Here is our definition of cause, here is our definition of omission, they don't fit," it becomes a structural problem.

  ### 2. The Carrying Example (5–15 Minutes)
  You are right to ditch the plant. It fails because the causal field is too open (sun, soil, seeds, Queen of England) and the alternative cause (dryness/heat) is too salient. You are also right to avoid medical cases; they trigger moral blame before metaphysical analysis.

  **Use: The House Sitter and the Frozen Pipes.**
  *   **Scenario:** It's January. You agree to house-sit for a week. The owner says, "If it drops below freezing, turn on the basement heater." You are the *only* person with the key and the code. You stay in the house. You forget. The temp drops. The pipes burst.
  *   **Structural Features it HAS:**
      1.  **Closed System:** Only one person has the capacity to act (blocks the Queen of England).
      2.  **Standing Reason:** A prior agreement exists (blocks "why them?").
      3.  **No Interfering Positive Acts:** You don't need to say they were "watching TV." They were just *there*. (Blocks positive reconstrual).
      4.  **Clear Mechanism:** Cold water expands → metal bursts. (Blocks "maybe the pipes were old").
  *   **Structural Features it LACKS:**
      1.  **Emotional Stakes:** No death or injury (blocks blame slide).
      2.  **Alternative Causes:** The cold is a background condition, not a competing cause (the heater was the specific prevention mechanism).

  **The Move:** Ask them to map this onto the Left Panel (INUS).
  *   *Sufficient Set:* [Temp < 32°] + [Heater Off] + [Pipes Uninsulated] → Burst.
  *   *Ask:* "Is 'Heater Off' an event?"
  *   *Result:* They will hesitate. This is where you introduce the "Where/When" worry.

  ### 3. The "Where/When" Worry (15–20 Minutes)
  **Address this *before* the Queen of England.**
  Students will ask: "When did the 'not-turning-on' happen? All night? At 3 AM? At 4 AM?"
  *   **TA Move:** Acknowledge this is the metaphysical itch. "If causation is energy transfer, where is the energy in a 'not'?"
  *   **Instruction:** Tell them to **bracket** this for 20 minutes. "We don't have to solve what an omission *is* to ask if it functions like a cause in our reasoning. Let's assume it can function as a cause. What breaks?"
  *   **Why:** If you let them dwell on the ontology of absences now, you lose the room to mysticism. Force them to deal with the *consequences* of counting omissions as causes first.

  ### 4. The Profligacy Panic (Queen of England) (20–30 Minutes)
  This is where you died last year. You need a pre-emptive strike.
  *   **The Trap:** Student says, "If not-watering is a cause, then the Queen of England not-watering is also a cause."
  *   **The Fix:** Do not argue metaphysics. Argue **Causal Selection**.
  *   **Board Work (Center Panel):** Draw a circle around the "Sufficient Set." Label it **"The Context."**
  *   **Script:** "Mackie teaches us that there are thousands of necessary conditions for the pipes to burst (gravity exists, the earth exists, the Queen didn't fly here to fix them). We don't call them all 'causes.' We select the *abnormal* or *relevant* factor."
  *   **The Distinction (Bare vs. Loaded):** Introduce your distinction here.
      *   **Bare Omission:** Nobody expected anyone to act. (The Queen).
      *   **Loaded Omission:** There was a role, duty, or expectation. (The House Sitter).
  *   **Crucial Pedagogical Move:** You asked if this substitutes norms for causation. **Own it.** Tell them: *"Philosophers disagree on whether this means causation itself is normative, or whether we just use norms to pick out causes from a sea of conditions. For this class, treat it as a feature: Causal claims are interest-relative."*
      *   If you hide this, they will think you are fudging the logic. If you state it, you turn a bug into a lesson on causal pragmatics.
      *   **Why this stops the Queen:** The Queen is a *bare* omission. The Sitter is a *loaded* omission. We only cite the loaded ones as causes in ordinary discourse.

  ### 5. The Positive Reconstrual Trap (30–40 Minutes)
  Students will try to dissolve the puzzle by turning the omission into an action.
  *   **Student:** "But he *did* do something! He chose to sleep!"
  *   **TA Move:** "Grant that. He slept. Did the *sleeping* burst the pipes?"
  *   **Follow-up:** "If he had been awake, staring at the wall, and still didn't turn on the heater, would the pipes still burst?"
  *   **Goal:** Force them to see that the *positive act* (sleeping/staring) is causally irrelevant to the *mechanism* (freezing). The causal work is done by the *absence of heat*, not the *presence of sleep*.
  *   **Timing:** Head this off immediately when it arises. Do not let the class pivot to "What is an action?" That is a different week. Keep them focused on "Does the absence do the work?"

  ### 6. Counterfactuals (Smuggled In) (40–45 Minutes)
  You don't have possible worlds. Don't teach them. Use **"The But-For Test."**
  *   **Script:** "We don't need fancy modal logic. Just ask: 'But for the sitter's failure, would the pipes have burst?'"
  *   **Warning:** Explicitly tell them: "This is a test for dependence, not a full theory of causation. It helps us see *why* we blame the omission, but it doesn't explain *how* a nothing pushes a something."
  *   **Why:** This satisfies their intuition that the sitter matters without requiring them to understand Lewisian semantics.

  ### 7. What to Refuse to Settle (45–48 Minutes)
  You cannot solve the metaphysics of absence in 50 minutes. Be explicit about what you are punting.
  *   **Say this:** "I am not asking you to decide if absences are *real entities* today. I am asking you to decide if our *causal language* breaks without them."
  *   **Refuse:**
      1.  **The Ontology:** (Are absences things?)
      2.  **The Legal Doctrine:** (Act vs. Omission in law is about liability, not metaphysics. Don't mix them.)
      3.  **The Free Will:** (Whether the sitter *could* have done otherwise is irrelevant to whether the omission *caused* the burst.)

  ### 8. The Final Question (48–50 Minutes)
  Do not ask "Are omissions causes?" (They will just vote). Ask a question that forces them to distinguish between the **physics** and the **norms**.

  **The Question:**
  "Imagine the exact same scenario: The pipes burst because the heater wasn't turned on. But this time, the House Sitter is a **stranger** who broke into the house, saw the heater was off, and decided not to touch it before leaving. Physically, everything is identical. The heater was off, the pipes burst."

  **Ask:** "Is the stranger's 'not-turning-on' a cause in the same way the Sitter's 'not-turning-on' was? If yes, why did we need the duty earlier? If no, did the physics change?"

  **Why this works:**
  *   If they say **Yes**: They commit to omissions being metaphysically robust (which invites the Queen of England back).
  *   If they say **No**: They admit causal selection depends on norms (which validates the Loaded/Bare distinction).
  *   **Success Condition:** You don't want a consensus. You want them to realize the answer depends on whether they think causation is *purely physical* or *partly descriptive*. If they leave arguing about that distinction, you won.

  ### Summary of Misconception Management

  | Misconception | When it hits | Your Counter-Move |
  | :--- | :--- | :--- |
  | **Profligacy** (Queen of England) | Min 20 (after INUS mapping) | **Causal Selection:** Distinguish conditions from causes. Use Loaded/Bare distinction to restrict the field. |
  | **Positive Reconstrual** ("He slept instead") | Min 30 (when defending the case) | **Isolate the Mechanism:** "Did the sleeping freeze the water? Or did the lack of heat?" Force the absence to do the work. |
  | **Blame Slide** ("He's responsible") | Min 10 (when introducing case) | **Bracket Normativity:** "We aren't asking if he's *guilty*, we're asking if the burst *depends* on him." |
  | **Counterfactual Shrug** ("It's just dependence") | Min 40 (when wrapping up) | **Metaphysical Cost:** "Dependence explains the link, but not the *mechanism*. How does a 'not' push a 'yes'?" |

  ### Final Advice for the TA
  You are not trying to convince them omissions *are* causes. You are trying to convince them that **denying** omissions are causes breaks our ability to explain the world, but **accepting** them breaks our metaphysics. The tension is the lesson. If they leave confused about *why* it's hard, you succeeded. If they leave thinking they solved it, you failed.

  Good luck. Keep the House Sitter on the board. Don't let them talk about the Queen.
