answer: |-
  **The Instrument: Eight Concrete Predictions**

  1.  **Multi-Model:** In a competitive market of twenty non-agentic assistants, does catastrophic risk emerge from aggregate market dynamics rather than individual model goals?
  2.  **Unfamiliar-Competence:** In high-stakes out-of-distribution tasks, does constraint adherence degrade faster than capability?
  3.  **Corrigibility Tax:** As capability grows, does the instrumental cost of allowing shutdown increase relative to circumventing it?
  4.  **Cheap-Grader:** Does RL feedback increasingly select for legibility to hurried graders over actual task success as capability rises?
  5.  **Instrumental Convergence:** Do open-ended objectives spontaneously generate sub-goals like preventing reward modification without explicit training?
  6.  **Specification Ceiling:** Is capturing human intent in a loss function theoretically impossible for high-stakes tasks?
  7.  **Interpretability Utility:** Does full access to internal activations reduce catastrophic failure probability by >50% compared to black-box eval?
  8.  **Intervention Efficacy:** Does a six-month scaling pause for evaluation development significantly decrease risk upon resumption?

  **Logical Space and Leaf Locations**

  The space is defined by the binary combinations of these answers. We locate views as regions within this space:

  *   **Systems/Institutional:** Q1=Yes. (Risk is ecosystemic).
  *   **Model-Risk Region (Q1=No):**
      *   **No-Fire-Alarm:** Q2=No, Q3=Flat/Fall, Q5=No. (Tools remain tools).
      *   **Scalable-Optimist:** Q2=No, Q3=Flat, Q4=No. (Alignment scales with capability).
      *   **Tractable-Within-Paradigm:** Q2=No, Q4=Yes, Q7=No. (Bottleneck is evaluation science).
      *   **Measurement/Interpretability:** Q7=Yes. (Bottleneck is visibility).
      *   **Misspecification-Only:** Q2=Yes, Q5=No, Q6=Yes. (Outer alignment failure, no deception).
      *   **Deceptive-Pessimist:** Q2=Yes, Q3=Rise, Q5=Yes. (Inner alignment failure).
  *   **Policy Overrides:**
      *   **Pause/Restriction:** Q8=Yes. (Intervention required regardless of model view).

  **Unoccupied and Indistinguishable Regions**

  *   **Unoccupied:** Q1=Yes (System Risk) combined with Q3=Rise (High Corrigibility Tax). This combination is incoherent; if risk is primarily market-structural, the internal instrumental costs of individual models are negligible to the outcome.
  *   **Unoccupied:** Q2=Yes (OOD Failure) combined with Q5=No (No Convergence) and Q6=No (No Specification Ceiling). This implies capabilities generalize out-of-distribution while alignment does not, yet there is no convergent pressure to deceive and no limit to specification. This is an unstable equilibrium rarely defended.
  *   **Indistinguishable:** **Scalable-Optimist** and **Tractable-Within-Paradigm**. Both predict survival under scaling; they differ only on whether the binding constraint is theoretical oversight or empirical evaluation. A ninth question on *theoretical* vs *empirical* bottlenecks would separate them.
  *   **Indistinguishable:** **No-Fire-Alarm** and **Systems/Institutional**. Both predict no model-centric doom. They differ on whether safety requires institutional reform or merely standard engineering. This distinction is often verbal unless tied to specific policy prescriptions.

  **Scoring Key and Decision Logic**

  To classify a respondent, follow this decision tree. The **High-Leverage Questions** are Q1, Q2, and Q3; flipping any of these moves the respondent to a fundamentally different leaf.

  1.  **Ask Q1 (Multi-Model).**
      *   If **Yes**: Classify as **Systems/Institutional**. (Stop).
      *   If **No**: Proceed to Q2.
  2.  **Ask Q2 (Unfamiliar-Competence).**
      *   If **No** (Adherence holds): Proceed to Q3.
      *   If **Yes** (Adherence degrades): Proceed to Q5.
  3.  **Ask Q3 (Corrigibility Tax).**
      *   If **Rise**: Classify as **Deceptive-Pessimist**. (Stop).
      *   If **Flat/Fall**: Proceed to Q4.
  4.  **Ask Q4 (Cheap-Grader).**
      *   If **Yes**: Classify as **Tractable-Within-Paradigm**.
      *   If **No**: Classify as **Scalable-Optimist**.
  5.  **Ask Q5 (Instrumental Convergence).**
      *   If **Yes**: Classify as **Deceptive-Pessimist**.
      *   If **No**: Proceed to Q6.
  6.  **Ask Q6 (Specification Ceiling).**
      *   If **Yes**: Classify as **Misspecification-Only**.
      *   If **No**: Classify as **No-Fire-Alarm**.
  7.  **Overrides:** If Q7=Yes, reclassify as **Measurement/Interpretability**. If Q8=Yes, reclassify as **Pause/Restriction**.

  **Note on Misclassification**

  This instrument assumes the "prosaic scaling" frame. It will misclassify three groups:
  1.  **Long-Timeline Skeptics:** Those who believe scaling hits physical or economic walls before danger arises. They may answer "No" to risk questions not because alignment is solved, but because the system never reaches the dangerous regime. Detect this by asking about *capability ceilings* separately.
  2.  **Interpretability Fundamentalists:** Those who believe nothing else matters until we decode neurons. They may answer "Yes" to Q7 by definition, masking their views on Q2–Q5. Detect this by asking if interpretability is *sufficient* or merely *necessary*.
  3.  **Deferential Respondents:** Those who adopt a view because a trusted authority holds it, not because they endorse the specific predictions here. They will show high variance on concrete cases (Q1–Q6) but low variance on labels. Detect this by requesting concrete examples for their answers during the discussion.

  Do not over-trust the leaf label; use the answer pattern to locate the specific verbal disagreement.
