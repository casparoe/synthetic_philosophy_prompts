answer: |-
  ### Reconstruction of the Implicit Theory of Public-Information Design

  The following claims reconstruct the implicit theory governing contemporary public-information design (pictograms, signage, ISOTYPE-derived charts). Each claim is tagged according to its modal status within the practice: **Strictly Presupposed** (the practice fails without it), **Module-Specific** (presupposed by one arm of the practice but contradicted by another), or **Merely Compatible** (consistent with the practice but not required by it).

  **1. The Thesis of Immediate Recognition**
  *Pictorial content is capable of being grasped pre-linguistically and cross-culturally without prior instruction.*
  *   **Status:** **Module-Specific** (Presupposed by Icon-Only Deployment).
  *   **Analysis:** This claim drives the "conceit" mentioned in the text (airports, toolbars). It aligns with a **substantive thesis** about pictorial content (Q1): that images convey meaning through a natural or universal resemblance that bypasses linguistic translation. However, this is contradicted by the testing regime. The practice is incoherent here (Q2): it deploys icons as if they are natural, but regulates them as if they are artificial.

  **2. The Thesis of Empirical Conventionality**
  *The meaning of a sign is not intrinsic but is a function of user comprehension rates within a specific population.*
  *   **Status:** **Strictly Presupposed** (by Testing and Redesign Regimes).
  *   **Analysis:** This claim treats understanding as a learnable, culture-dependent achievement. It necessitates that a symbol failing a comprehension threshold is "broken." This supports a **deflationary view** (Q1): the chart is a notation whose key must be learned. It contradicts Claim 1, revealing the practice is not theoretically unified but pragmatically hybrid (Q2).

  **3. The Thesis of Semantic Dependence**
  *A pictogram cannot constitute a complete speech act; it requires verbal anchoring to fix reference and illocutionary force.*
  *   **Status:** **Strictly Presupposed** (by Labeling Regimes and Safety Law).
  *   **Analysis:** This explains why hazard symbols require signal words ("Danger") and statements. It commits the practice to the view that pictures are semantically dependent on language (Q3). The picture provides the *topic* (the hazard), but the word provides the *logic* (the prohibition or warning). This aligns with Neurath's view that pictures are "helpers to words."

  **4. The Thesis of Logical Incapacity**
  *Pictorial syntax is incapable of encoding logical operators beyond simple negation (the diagonal stroke) and existence.*
  *   **Status:** **Strictly Presupposed** (by Content Narrowness).
  *   **Analysis:** The absence of conditionals, modality, or scope distinctions in design implies a theoretical limit: pictures cannot bear logical weight (Q3). This suggests a syntax-free notation cannot be a full language. The practice assumes that if a message requires logical complexity, it must exit the pictorial regime entirely and become text.

  **5. The Thesis of Pedagogical Priority**
  *The function of the image is to accelerate recognition and emotional impact, not to serve as a primary source of justification.*
  *   **Status:** **Merely Compatible** (with both Substantive and Deflationary views).
  *   **Analysis:** This claim allows the practice to function regardless of whether images are "natural" or "conventional." It focuses on *effect* (speed, attention) rather than *truth*. This is where the practice is philosophically underdetermined (Q5): a psychological story about memory (pictures are remembered better) licenses the same design rules as a philosophical story about universality (pictures are understood by all).

  ***

  ### The Neurathian Tension: Immediacy vs. Anti-Foundationalism

  **Question 4:** *Is there a real tension between the pedagogical aim (making facts evident to the eye) and the anti-foundationalist epistemology (no privileged observation language)?*

  There is a **functional tension** but not necessarily a **logical contradiction**, provided one distinguishes between *rhetorical immediacy* and *epistemic foundation*.

  Neurath's anti-foundationalism ("sailors repairing a ship at sea") denies that any statement (visual or verbal) is immune to revision or stands outside the web of belief. However, the pedagogical aim of ISOTYPE and modern signage is to make social facts *felt* as immediate. The tension arises if the designer claims the picture *justifies* the belief without inference (a "Given").

  The practice resolves this tension by adhering to **Claim 3 (Semantic Dependence)**. The picture delivers the *impact* (the "evident" fact), but the accompanying text (the caption, the hazard statement) carries the *justification*. The eye is allowed to "see" the comparison, but the system does not claim that this visual seeing is infallible knowledge. The visual education Neurath insisted upon ensures the viewer knows *how* to look, turning the "immediate" grasp into a skilled inference rather than a raw Given. Thus, the tension is only apparent if the picture is treated as a **pedagogical aid** (claiming attention) rather than an **evidence-base** (claiming truth). The practice holds: the picture makes the fact vivid, but the text makes the fact accountable.

  ***

  ### Replacement Scenarios

  **Question 6:** *What would have to change if the implicit theory were replaced?*

  #### Scenario A: The Deflationary Replacement
  **Theory:** A unit chart or pictogram is strictly a bundle of assertions in compact notation, answerable to the same standards as prose.
  **Required Changes to Practice:**
  1.  **Abandonment of Rounding:** Neurath's "aggressively rounded numbers" would be prohibited. Exact magnitudes and confidence intervals would need to be visualized, likely destroying the aesthetic simplicity of the pictogram.
  2.  **Source Attribution:** Every icon would require a citation equivalent to a footnote, as assertions require warrants.
  3.  **Logical Expansion:** If images are just assertions, there is no theoretical bar to visualizing modality or conditionals. Designers would be forced to develop a visual syntax for "might," "if," or "unless," breaking **Claim 4**.
  4.  **End of "Universal" Pretense:** Since assertions are language-dependent, the push for wordless international signage would cease. Icons would be localized like text.

  #### Scenario B: The Non-Propositional Replacement
  **Theory:** Pictures carry irreducibly non-propositional content (affective, experiential, or holistic) that cannot be translated into sentences without remainder.
  **Required Changes to Practice:**
  1.  **End of Comprehension Testing:** You cannot test for a "correct" understanding of non-propositional content. The current regime of withdrawing symbols that miss a comprehension threshold (**Claim 2**) would be invalid. Ambiguity would be accepted as a feature, not a bug.
  2.  **Decoupling from Text:** If the picture conveys something words *cannot*, the mandatory text labels (**Claim 3**) become redundant or even interfering. The practice would move toward pure image environments.
  3.  **Incompatibility with Tables:** The practice would have to stop pretending a chart is interchangeable with a table. A table offers propositional precision; a picture offers experiential grasp. They would be used for fundamentally different communicative acts, not as alternative encodings of the same data.
  4.  **Expansion of Content:** Designers might attempt to visualize the currently forbidden categories (confidence, scope) using metaphorical or atmospheric cues rather than logical symbols, acknowledging that these convey a "feel" of uncertainty rather than a logical operator.

  ### Philosophical Underdetermination

  **Question 5:** *Where is the practice philosophically underdetermined?*

  The practice is strictly underdetermined regarding the **mechanism of recognition** (Q5).
  *   **Rival Theory 1 (Resemblance):** Icons work because they look like the things they represent (Substantive).
  *   **Rival Theory 2 (Conditioning):** Icons work because users have been trained to associate shape X with concept Y (Deflationary).

  **Design Rules Licensed by Both:**
  Both theories mandate high contrast, elimination of detail, and standardization.
  *   If **Resemblance** is true, detail distracts from the essential form.
  *   If **Conditioning** is true, detail increases cognitive load and slows retrieval.

  Therefore, the practice does not commit to a specific philosophy of mind. It merely requires that *whatever* the mechanism is, it must be consistent across the user base. This explains the coherence of the design rules despite the incoherence of the theoretical justifications (Claim 1 vs. Claim 2). The practice requires *stability of interpretation*, but remains agnostic on *why* that stability obtains.
