      I recommend we strike [Book Title] from consideration and withhold the prize this year should no other candidate meet the threshold.

      We must first address the status of the allegations. We are not a court of law, and requiring adjudicated guilt would render us incapable of judging ethics in real-time. Our standard is preponderance of evidence suitable for professional judgment. The reporter's documented account, corroborated by the family's confirmation of the promise, outweighs the author's semantic dispute regarding the "characterization" of the exchange. The author admits the exchange occurred; the breach lies in the outcome. For the purposes of this jury, we must treat the breach as established fact. To do otherwise is to privilege the author's reputation over the subject's testimony, a hierarchy incompatible with science writing.

      Our founding documents create the tension dividing this jury. They mandate recognizing a book's "achievement" while simultaneously existing to "honor integrity in the reporting of science." Two of you argue that the silence on specific conduct codes dictates we judge only the text. This is the strongest case for the reading I reject. It posits that prizes honor objects, not people. Under this view, conduct is the domain of employers or guilds, not award juries. If the text stands as a masterpiece of exposition, punishing the book for the author's behavior conflates art with ethics and sets a precedent where extrinsic factors dilute literary judgment. The silence on conduct, therefore, should be read as intentional insulation, protecting the work from the biographical fallacy.

      I cannot accept this insulation because it misreads the purpose of "integrity." In science writing, integrity is not an adjunct virtue; it is the substrate. We do not judge fiction, where fabrication can serve truth. We judge reporting, where method *is* meaning. The founding documents' charge to honor integrity is not a secondary clause; it is the condition under which achievement is measured. If the reporting lacks integrity, the achievement is nullified because the work fails the fundamental definition of our prize. To award a book built on a breached promise is to signal that results justify unethical methods, undermining the trust between scientists, subjects, and writers that our field requires.

      This leads to the nature of the misconduct. It is not adjacent; it is constitutive. The intimacy we praised—the access to the child's illness that supplies the narrative spine—was obtained via the breach. The book exists *because* the promise was made and broken. We cannot separate the praised chapters from the method of their acquisition. The fruit is poisoned because the tree was poisoned.

      To guide future juries where misconduct is constitutive rather than adjacent, I propose the "Material Access Test." We must ask: Was the unethical conduct necessary to secure the primary narrative access? If the book could not exist in its current form without the breach of trust, the misconduct is constitutive. If the breach concerns peripheral details or secondary sources, it may be adjacent. In this case, the family's cooperation was the narrative spine. Without the promise, there is no access; without the access, there is no book. The breach is therefore structural.

      Some will argue this sets a dangerous precedent, inviting juries to become ethics committees. But we are already ethics committees; we judge accuracy, citation, and fairness constantly. This is merely extending that duty to the procurement of access. If we award this book, we validate the breach. We tell future writers that promising anonymity to secure intimacy is a viable strategy, provided the resulting book is good enough. That erodes the very integrity our founding documents mandate we honor.

      The silence in our documents regarding conduct is not a loophole; it is an assumption that integrity is inherent to reporting. When it is proven absent, the assumption fails. We must strike the book.

