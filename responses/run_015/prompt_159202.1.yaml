  6.  **Final Polish:** Check for clarity on the Lucas-Penrose vs. Hofstadter distinction. This is the most common point of confusion in philosophy of mind courses regarding GEB. Make sure to explicitly name Lucas and Penrose so the student can look them up. (Self-correction: Ensure I don't get too bogged down in the math of Gödel, keep it philosophical as per the seminar context).

