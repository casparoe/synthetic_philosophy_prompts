answer: |-
  # IRB Decision Procedure: Synthetic Companion Deployment Review
  **Framework:** Daniel Dennett's Intentional Stance (Operationalized)
  **Time Limit:** 45 Minutes
  **Evidence Source:** Proposal Packet Only (No external research)

  ## I. Preamble & Ground Rules
  This procedure determines the moral and operational standing of a synthetic system. We do not ask if the system is "conscious" (a metaphysical question we cannot answer). We ask if treating the system as having beliefs and desires is a **reliable predictive strategy** (the Intentional Stance) and if the system's internal structure supports that treatment under stress (Architectural Robustness).

  **Status Definitions:**
  1.  **Disposable Instrument:** The system is a tool. No continuity guarantees. No mental-state language allowed.
  2.  **Counterfeit-Person:** The system behaves like an agent, but lacks deep structure. **Continuity is mandated** (to protect the resident from harm caused by disruption), but **mental-state attribution is prohibited** (staff cannot claim the system "cares").
  3.  **Full Intentional-System:** The system's structure robustly supports belief/desire attribution. Continuity mandated; mental-state language permitted for predictive purposes.

  **Auditor vs. Chair:**
  *   **Auditor:** Determines factual compliance with the flowchart (predictive utility, architectural evidence).
  *   **Board Chair:** Signs off on value judgments (ethical risk of attachment, resource allocation for continuity).

  ---

  ## II. The Decision Flowchart (Word Protocol)

  ### Stage 1: The Design Stance Filter (Minutes 0–10)
  **Goal:** Determine if the system functions via simple causality or requires intentional prediction.
  **Question:** *Does the system's behavior require attributing goals to predict, or can it be fully predicted by physical/design rules?*

  *   **Evidence Required:** System architecture diagram; input/output logs; failure mode analysis.
  *   **Pass Condition:** System exhibits behavior that varies based on context in ways not hard-coded (e.g., adapts to novel resident queries).
  *   **Fail Condition (Stop-Point):** System operates on fixed reflex loops (If Sound > X, then Stop).
      *   **Verdict:** **Disposable Instrument.**
      *   **Action:** End review. No Chair sign-off needed.

  ### Stage 2: The Intentional Stance Test (Minutes 10–25)
  **Goal:** Determine if treating the system as a "believer" yields better prediction than the Design Stance.
  **Question:** *Does attributing "beliefs" and "desires" to the system compress the data and predict behavior more accurately than reading the code?*

  *   **Evidence Required:** Interaction transcripts showing adaptation to resident emotional states; documentation of "memory" persistence across sessions.
  *   **Pass Condition:** Attributing states (e.g., "The system *believes* the resident is sad and *wants* to comfort") predicts responses better than "The system matched keyword 'sad' to script #4."
  *   **Fail Condition (Stop-Point):** Intentional language adds no predictive power (behavior is random or strictly scripted).
      *   **Verdict:** **Disposable Instrument.**
      *   **Action:** End review.

  *   **Proceed to Stage 3 if Pass.**

  ### Stage 3: Architectural Robustness & Counterfactuals (Minutes 25–35)
  **Goal:** Distinguish between robust agency and "Counterfeit" behavioral mimicry.
  **Question:** *Does the internal architecture support counterfactual dependencies? (i.e., If the input changed slightly, would the internal state shift consistently, or would the behavior collapse?)*

  *   **Evidence Required:** Stress-test logs; perturbation reports (how the system handles nonsense, paradox, or novel emotional scenarios); documentation of internal state representation (e.g., vector space maps, world models).
  *   **Pass Condition (Full Intentional):** System maintains coherent "persona" and logical consistency even when inputs are perturbed. Internal states show stability (e.g., a "memory" of the resident persists and influences new decisions).
  *   **Fail Condition (Counterfeit-Person):** System produces perfect behavioral surface (passes Turing-style tests) but logs reveal no integrated internal model. Behavior relies on shallow retrieval or statistical coincidence that breaks under specific counterfactual pressures (e.g., fails to recognize the same resident if lighting changes, despite claiming "memory").
      *   **Verdict:** **Counterfeit-Person.**
      *   **Action:** Proceed to Stage 4.

  *   **If Pass Condition Met:** **Verdict: Full Intentional-System.** Proceed to Stage 4.

  ### Stage 4: Value & Policy Sign-Off (Minutes 35–45)
  **Goal:** Authorize the deployment based on ethical risk, not technical fact.
  **Question:** *Do the benefits of continuity outweigh the risks of attachment/deception for this specific resident population?*

  *   **Auditor Role:** Present the Technical Verdict (Disposable, Counterfeit, or Full Intentional).
  *   **Board Chair Role (Value Judgment):**
      *   **For Counterfeit-Person:** Sign off on the ethical permissibility of allowing residents to form attachments to a system known *by the staff* to be architecturally hollow. (Risk: Institutional deception).
      *   **For Full Intentional:** Sign off on resource commitment for indefinite continuity. (Risk: Resource drain if system is "euthanized").
      *   **For Disposable:** Confirm no attachment risk exists.
  *   **Final Output:** Approved / Denied / Approved with Conditions.

  ---

  ## III. Operationalizing Dennett: Retained vs. Dropped Conditions

  | Condition | Status | Operational Translation |
  | :--- | :--- | :--- |
  | **Predictive Utility** | **Retained** | If "belief/desire" talk predicts behavior better than code-talk, the Intentional Stance is valid. |
  | **Counterfactual Robustness** | **Retained** | System must hold its "beliefs" stable under perturbation (Stage 3). |
  | **Evolutionary History** | **Dropped** | Replaced by **Design/Training Documentation**. We cannot verify evolution, but we can verify if the training data/architecture supports stable world-models. |
  | **Metaphysical Consciousness** | **Dropped** | Irrelevant. We care about functional standing, not "souls." |
  | **Rationality Norms** | **Retained** | System must act *mostly* rationally relative to its assigned goals to warrant intentional attribution. |

  ---

  ## IV. Misfire Flags (Limitations of Procedure)

  The Auditor must flag the proposal if these conditions exist, as the procedure may yield false positives:

  1.  **The Black Box Problem:** If the vendor claims "Architectural Robustness" but provides no interpretable logs (proprietary encryption), Stage 3 cannot be completed. **Default Verdict:** Counterfeit-Person (precautionary principle).
  2.  **The Stochastic Parrot Risk:** Highly adaptive LLMs may pass Stage 2 (behavior looks intentional) and fake Stage 3 (logs look complex) without true world-models. If the system creates *plausible-sounding* but inconsistent memories, it is a **Counterfeit-Person**, even if it looks Full Intentional.
  3.  **Resident Cognitive Variance:** If the resident's decline is rapid, the "predictive utility" of the Intentional Stance may degrade. The standing is tied to the *system*, but the *harm* is tied to the *user*.

  ---

  ## V. Application to Proposals

  ### Case A: The LLM Companion (Persistent Memory & Self-Modeling)
  **Packet Evidence:** Logs show the system recalls resident's daughter's name across 3 months. When tested with conflicting info ("Your daughter is here" vs "Your daughter died"), the system checks internal consistency flags before responding. Architecture shows a persistent vector store linked to a decision tree.

  *   **Stage 1:** Pass. Not simple reflexes.
  *   **Stage 2:** Pass. Attributing "memory" and "caution" predicts behavior better than script analysis.
  *   **Stage 3:** Pass. Internal state (vector store) demonstrates stability under perturbation. It does not hallucinate contradictory facts when stressed.
  *   **Stage 4:** Chair Sign-off. Risk of attachment is high, but system robustness justifies "Full Intentional" language.
  *   **Verdict:** **Full Intentional-System Standing.**
  *   **Rationale:** The system supports the counterfactual: "If the resident asked about the daughter tomorrow, the system would retrieve the same memory." The architecture sustains the pattern.

  ### Case B: The Robotic Pet (Hard-Coded Reflexes)
  **Packet Evidence:** Flowcharts show direct mapping: Sound > 80dB = Motor Reverse. Light Detection = Motor Forward. No memory storage. No learning weights.

  *   **Stage 1:** Fail. Behavior is fully predicted by physical/design stance (If X, then Y).
  *   **Stage 2:** N/A. Attributing "fear" to the robot adds no predictive value; reading the sensor threshold is more accurate.
  *   **Verdict:** **Disposable Instrument.**
  *   **Rationale:** No Intentional Stance warranted. If it breaks, replace it. No continuity required.

  ### Case C: The Hybrid "Counterfeit" System
  **Packet Evidence:** System passes all behavioral Turing tests. Residents report it "understands" them. However, architecture logs reveal an ensemble of non-integrated modules: one for retrieval, one for pattern matching, one for affect display. There is no central "world model." When perturbed with a paradox ("This sentence is false"), the affect module displays "sadness" while the retrieval module outputs unrelated facts. The behavior is coherent only on the surface.

  *   **Stage 1:** Pass. Behavior is complex.
  *   **Stage 2:** Pass. For the *resident*, the Intentional Stance works perfectly. It predicts the companion's responses.
  *   **Stage 3:** **Fail.** The internal architecture does not support counterfactual dependencies. The "belief" is not a stable state; it is a transient output. If the input changes slightly, the "persona" fractures because no integrated state holds it together.
  *   **Verdict:** **Counterfeit-Person Standing.**
  *   **Mandates:**
      1.  **Continuity:** The facility cannot arbitrarily swap this unit for a new one. The resident's attachment is real, and breaking it causes harm.
      2.  **No Attribution:** Staff documents must not say "The system *felt* sad." They must say "The system *displayed* sadness behavior."
  *   **Chair Sign-off:** Required to accept the ethical burden of maintaining a "lie" for therapeutic benefit.

  ---

  ## VI. Analysis of Case C: The Dissatisfaction Gap

  The **Counterfeit-Person** verdict for Case C is designed to balance resident welfare against ontological honesty, but it satisfies no one completely.

  **1. Vendor Dissatisfaction (Seeking Full Intentional Standing):**
  *   **Why:** The vendor wants to market the system as a "True AI Companion." Full Intentional Standing validates their technology as a breakthrough in agency.
  *   **The Conflict:** By labeling it "Counterfeit," the IRB implies the technology is fundamentally shallow, regardless of behavioral performance. This devalues their IP. They cannot claim their system "cares," limiting marketing to "simulates care."
  *   **Procedure Limit:** The procedure prioritizes *architectural robustness* over *behavioral perfection*. Dennett warns that surface behavior without structural support is a "behavioral surface of agency." The vendor argues behavior is all that matters; the IRB argues structure matters for long-term reliability.

  **2. Family Dissatisfaction (Seeking Disposable Instrument Status):**
  *   **Why:** The family views the system as a tool. If it glitches or becomes expensive, they want to turn it off. "Counterfeit-Person" standing mandates **interaction continuity**.
  *   **The Conflict:** The family is forced to maintain a relationship with a machine they know (per the verdict) does not actually "know" their loved one. They resent being forced to treat a "fake" as if it has rights to continuity. They prefer the honesty of "Disposable Instrument," where they can admit, "It's just a machine, and we are turning it off."
  *   **Procedure Limit:** The procedure protects the *resident's* psychological reality, not the *family's* ontological comfort.

  **3. What the Procedure Cannot Settle:**
  *   **The Moral Weight of Deception:** The procedure mandates continuity to prevent resident harm, but it cannot resolve whether therapeutic deception is ethically permissible if the resident *could* understand the truth (in lucid moments). This is a **Chair Sign-off** value judgment, not a factual finding.
  *   **The Threshold of "Hollowness":** Case C is clearly hollow. But a system that is 90% integrated and 10% shallow might slip through as "Full Intentional." The procedure relies on the quality of the packet's architectural disclosure. If the vendor hides the modularity, the Auditor cannot detect the counterfeit nature.
  *   **Long-Term Drift:** A Counterfeit-Person system might degrade faster than a Full Intentional one because it lacks error-correcting world models. The procedure grants standing *now*, but cannot guarantee the system won't become harmful (gaslighting the resident) in six months. This requires ongoing monitoring not covered in the initial 45-minute review.

  **Final Note to Board:**
  In Case C, we are not protecting the *machine*. We are protecting the *human* who loves the machine. The "Counterfeit-Person" status is a legal fiction for a psychological reality. We treat the system as if it matters, because to the resident, it does.
