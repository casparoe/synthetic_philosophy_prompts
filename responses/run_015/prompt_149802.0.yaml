answer: |-
  Your intuition is spot-on. Your friend has constructed a "steel man" of moralism (specifically a view close to what philosophers call *Ethicism*) but is attacking a "straw man" of separatism (specifically a rigid *Formalism*).

  She is conflating three distinct philosophical layers: **ontology** (what the art *is*), **evaluation** (how we judge it), and **hermeneutics** (how we interpret it).

  Here is a breakdown of where her summary fails, using the precision you're used to from physics.

  ### 1. The Crystal Lattice Analogy (Ontology)
  **Her Claim:** Separatists treat art like a crystal lattice; aesthetic value depends only on internal structure, not the maker.
  **The Error:** This conflates **Autonomism** with **Formalism**.

  *   **Formalism** (e.g., Clive Bell) does argue that only lines, colors, and shapes matter. If your friend were attacking a Formalist, the crystal analogy works.
  *   **Separatism/Autonomism** (e.g., Kant, Oscar Wilde, contemporary aestheticians like Peter Kivy) argues that *moral* value and *aesthetic* value are distinct categories. It does not deny that content, narrative, or emotion matter.

  **The Physics Analogy:**
  Think of a **state function** (like internal energy) versus a **path function** (like work or heat).
  *   **The Friend's View:** She claims the "path" (the artist's moral history) changes the "state" (the artwork's aesthetic value).
  *   **The Separatist View:** The artwork is a state system. Once the system exists, its properties are defined by its current configuration, not the path taken to create it. A poem written by a saint and a poem written by a sinner, if textually identical, have the same aesthetic energy.

  By calling it a "crystal lattice," she implies art has no semantic content, only geometric structure. Most separatists agree that art conveys meaning; they just deny that the *moral status of the sender* alters the *aesthetic quality of the signal*.

  ### 2. Causal Influence vs. Constitutive Dependence
  **Her Claim:** "Constitutive Moral Embedding" means immorality is inside the work's fabric (e.g., cruelty in a gaze).
  **The Error:** She is conflating **representation** with **instantiation**.

  This is the crux of the "causal vs. constitutive" confusion you sensed.
  *   **Causal:** The artist's cruelty caused them to paint a cruel gaze. (Separatists accept this).
  *   **Constitutive:** The cruelty is a property of the paint on the canvas. (Separatists deny this).

  If I paint a portrait of a murderer, the painting *depicts* immorality. It does not *instantiate* immorality. No one was actually harmed in the making of the gaze.

  **Where she conflates them:**
  She argues that because the *feature* (the cruel gaze) is aesthetically relevant, and that feature is moral in nature, the *morality* is constitutive of the *art*.
  A separatist would argue: The aesthetic feature is the *power of the depiction*, not the *moral status of the subject*. A brilliant depiction of a villain is aesthetically good, even if the villain is morally bad. If the artist's own immorality made the art bad, then a morally perfect artist painting a villain would fail aesthetically because they couldn't capture the "true" evil.

  Her argument assumes that moral properties can transfer from the agent to the artifact without loss of fidelity. In physics terms, she's assuming a **lossless transmission of moral charge**, whereas separatists argue the medium (art) transforms the charge into something else (representation).

  ### 3. The Hermeneutics Charge (The "Self-Defeating" Claim)
  **Her Claim:** Separatists must deny intentions ever matter, rejecting hermeneutics, thus defeating themselves.
  **The Error:** This is a **non-sequitur**.

  This is the weakest part of her argument. She is conflating **Interpretive Intentionalism** with **Moral Intentionalism**.

  *   **Interpretive Intentionalism:** "We need to know what the artist intended to say to understand the meaning." (e.g., Was this satire or sincere?)
  *   **Moral Intentionalism:** "We need to know if the artist was a good person to judge the art's quality."

  Separatists generally reject the second, but they do not necessarily reject the first. You can believe that knowing the artist's intent is crucial for *understanding* the work (hermeneutics) without believing that the artist's moral character determines the work's *value* (aesthetics).

  **Why it's not self-defeating:**
  Philosophy itself is an art of argument. If a separatist writes a philosophical text arguing for separatism, we use hermeneutics to understand their intent. Does the fact that we used hermeneutics to understand their argument invalidate their argument? No.
  Similarly, using intention to interpret a painting does not force you to use morality to evaluate it. You can ask "What did the artist intend to depict?" (Hermeneutics) without asking "Does the artist's soul taint this depiction?" (Moralism).

  ### Summary of the Errors

  1.  **The Category Mistake:** She claims asking if a painting is bad because the painter was horrible is a category mistake. Separatists don't say it's nonsensical (category mistake); they say it's **false** (incorrect inference).
  2.  **The Conflation:** She treats the *depiction of vice* as *vicarious vice*. This is the causal/constitutive mix-up. The paint does not become cruel; it represents cruelty.
  3.  **The Self-Defeat:** She assumes that acknowledging intention requires acknowledging moral judgment. It does not.

  ### Verdict
  Your friend is arguing for a position known in aesthetics as **Ethicism** (most notably associated with Berys Gaut), which holds that moral defects in a work *can* be aesthetic defects. That is a valid philosophical stance.

  However, her characterization of the opposing view (Separatism) is outdated. She is fighting **1920s New Criticism** (art is an isolated object), not modern **Autonomism** (art is a distinct domain of value).

  **The Physics Translation:**
  She is arguing that the **boundary conditions** of the system (the artist's morality) must be included in the **Hamiltonian** of the system (the artwork's value).
  The Separatist says: Once the system is isolated (the work is finished), the Hamiltonian is defined by internal variables. The history of the boundary conditions is irrelevant to the current eigenstates (aesthetic experience).

  She isn't wrong that Ethicism is a compelling theory, but she is wrong that Separatism is intellectually bankrupt or self-defeating. It just defines the system boundaries differently.
