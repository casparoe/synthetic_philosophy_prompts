prompt: |-
  I'm a TA for an introductory decision theory course, and I have one eighty-minute session on the Pasadena game: a fair coin is tossed until it lands heads, and if the first heads falls on the nth toss the payoff is (−1)^{n−1}·2^n/n — so the expectation, summed in the natural order, is 1 − 1/2 + 1/3 − … = ln 2 ≈ 0.69, while other orderings of the very same terms yield any real number you please. I am not asking for an explanation of the paradox; I am asking for a plan for teaching it.

  The audience: one semester of probability, no analysis (to them "convergent" just means "adds up to something finite"), and they have already met the St. Petersburg game and taken away the moral that bounding the utility function makes the problem go away.

  Please give me: (1) the order in which the components have to arrive, and what specifically breaks if two of them are swapped — in particular where the absolute/conditional distinction has to enter, given that I have no vocabulary for it; (2) the one example that should carry the session, and the properties such an example needs. My candidate is the alternating harmonic series reordered as 1 + 1/3 − 1/2 + 1/5 + 1/7 − 1/4 + … = (3/2)ln 2, but I worry that a purely algebraic example lets them file the whole thing under "infinite series have tricks" rather than "expected value is not a well-defined quantity here"; (3) the misconceptions in the order they will form, and the point at which each should be headed off — I expect three: "just bound utility, it is St. Petersburg again," "no casino can pay, so truncate the tail," and, the one I think actually matters, "the order of summation is fixed by the game, so the rearrangements are cheating"; (4) what I should openly decline to settle at this level; and (5) one final question that separates a student who has the real lesson from one who has merely learned that infinity is weird. My candidate is: what is the expectation if the outcomes are indexed by payout size instead of by number of tosses? Does that question do the work I want?

  One further thing I would like the session to land, and do not know how to stage: that choosing a summation order, a truncation, or a principal value is not discovering a number but importing a choice about how fast the tails get discounted — closer to a risk attitude than to a fact about the game. Where in the sequence should that go, and how do I say it without leaving them thinking that expected value is simply arbitrary?
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for an introductory decision theory course.
      *   **Topic:** The Pasadena Game (Nover & Hájek, 2004).
      *   **Constraints:** 80-minute session. Students have 1 semester of probability, no real analysis (no rigorous convergence tests, just intuitive "adds up"). They know St. Petersburg and think bounding utility solves it.
      *   **Specific Deliverables:**
          1.  Order of components (and consequences of swapping).
          2.  The one carrying example (evaluating the alternating harmonic series vs. something more decision-theoretic).
          3.  Misconceptions (order of appearance and intervention points).
          4.  What to explicitly leave unsettled.
          5.  The "final question" to test deep understanding (evaluating the indexing by payout size candidate).
          6.  *Crucial Addition:* How to stage the idea that summation order = risk attitude/discounting choice, without making EV seem arbitrary.

  2.  **Deconstruct the Pasadena Game:**
      *   **Mechanism:** Fair coin until Heads ($n$). Payoff $X_n = (-1)^{n-1} \frac{2^n}{n}$.
      *   **Probability:** $P(n) = (1/2)^n$.
      *   **Expected Value Term:** $P(n) \cdot X_n = \frac{1}{2^n} \cdot (-1)^{n-1} \frac{2^n}{n} = \frac{(-1)^{n-1}}{n}$.
      *   **Series:** $\sum \frac{(-1)^{n-1}}{n} = 1 - 1/2 + 1/3 - 1/4 \dots$ (Alternating Harmonic Series).
      *   **The Problem:** This series is *conditionally* convergent. By Riemann's Rearrangement Theorem, it can sum to anything depending on order.
      *   **Decision Theory Implication:** Expected Utility (EU) is undefined. You can't compare it to other games or a fixed sum.

  3.  **Address Deliverable 1: Order of Components:**
      *   *Goal:* Build the paradox without triggering premature "solutions."
      *   *Step 1: Setup.* Define the game clearly. Calculate the terms.
      *   *Step 2: The "Natural" Sum.* Show the $\ln 2$ result. This hooks them with a definite answer.
      *   *Step 3: The Rearrangement.* Show a different sum (e.g., 2 positives, 1 negative).
      *   *Step 4: The Conflict.* Why does the game definition imply a specific order? (It doesn't, really, but the index $n$ suggests it).
      *   *Step 5: The Decision Theoretic Crisis.* If EU is undefined, how do we choose?
      *   *Constraint Check:* The prompt asks where the absolute/conditional distinction enters. Since they lack analysis vocab, I need to introduce it via *grouping* or *timing*, not $\epsilon-\delta$.
      *   *Swap Risk:* If I show the rearrangement *before* the natural sum, they might think the game is just "broken math" immediately. If I show the "bounding utility" solution too early, they dismiss it like St. Petersburg.
      *   *Absolute/Conditional:* This needs to enter *after* they see two different sums but *before* they decide one is "cheating." It needs to be framed as "Does the total value depend on how we group the payments?"

  4.  **Address Deliverable 2: The Carrying Example:**
      *   *Candidate:* Alternating Harmonic Series ($1 + 1/3 - 1/2 \dots$).
      *   *Concern:* Too algebraic. Students might think "Math trick" rather than "Decision problem."
      *   *Better Approach:* Keep the math simple (Alt. Harmonic) but frame it *temporally*.
      *   *Idea:* The "Banker's Schedule." Instead of just reordering terms abstractly, frame the reordering as *when* the casino pays you.
      *   *Properties Needed:*
          1.  Must sum to the same terms (same probabilities/payoffs).
          2.  Must yield different totals.
          3.  Must feel like a valid way to account for the game (e.g., batching payments).
      *   *Decision:* Stick with the Alternating Harmonic rearrangement but contextualize it as "Accounting Methods" or "Payment Schedules." This bridges the algebra/decision gap.

  5.  **Address Deliverable 3: Misconceptions:**
      *   *Misconception 1: "Bound Utility" (St. Petersburg hangover).*
          *   *Timing:* Early, when payoffs are revealed.
          *   *Intervention:* Show that bounding utility doesn't fix the *sign alternation* issue. The series remains conditionally convergent even if capped (wait, actually, if you cap utility, the terms become absolutely convergent eventually? No, $2^n/n$ grows. If you cap $U$, the terms become $P(n) \cdot C$. $\sum (1/2)^n C$ converges absolutely. So bounding *does* fix Pasadena technically. I need to be careful here. The prompt says they *think* bounding solves it. I need to show why it's unsatisfying or distinct. Actually, Nover & Hájek argue bounding doesn't solve the *conceptual* issue of undefined EV. But technically, if $U$ is bounded, $\sum |p_i u_i| < \infty$. So EV *is* defined.
          *   *Correction:* I must clarify that the Pasadena paradox relies on *unbounded* utility. If they say "bound it," I must concede "Yes, mathematically that works, but do we *want* to bound utility just to make math work? Also, let's assume for this hour we don't bound."
          *   *Refinement:* The prompt says they "taken away the moral that bounding the utility function makes the problem go away." I need to challenge this. In St. Petersburg, bounding stops the explosion. In Pasadena, bounding stops the *conditional convergence* and forces absolute convergence. So the "solution" works mathematically but might be ad hoc. I need to head this off by saying: "For the sake of this paradox, assume we allow unbounded utility (like money)."
      *   *Misconception 2: "No casino can pay / Truncate."*
          *   *Timing:* When magnitudes of $2^n$ get huge.
          *   *Intervention:* Distinguish *practical* impossibility from *theoretical* coherence. Decision theory is normative, not descriptive of current banks.
      *   *Misconception 3: "Order is fixed by the game / Rearrangement is cheating."*
          *   *Timing:* When introducing the rearrangement.
          *   *Intervention:* This is the big one. The "order" in EV is an artifact of calculation, not necessarily the game. The game produces a distribution. The sum is over the *support*. If the support is countable, is there a natural order? Yes, by $n$. But why does calculation order matter? This leads to the Absolute vs. Conditional distinction.

  6.  **Address Deliverable 4: What to Decline to Settle:**
      *   Don't solve the paradox (there is no consensus).
      *   Don't dive into Measure Theory (too hard).
      *   Don't declare one summation order "correct."
      *   *Key:* Don't tell them what the Expected Value *is*. Tell them it *isn't*.

  7.  **Address Deliverable 5: The Final Question:**
      *   *Candidate:* Index by payout size.
      *   *Analysis:* In Pasadena, payout size is unique to $n$ (monotonic magnitude, alternating sign). Indexing by size is the same as indexing by $n$.
      *   *Better Question:* "If you could sell this ticket before the coin is tossed, what price would you set?" OR "If you play this game twice, independently, what is the expected total value?" (Additivity fails).
      *   *Re-evaluating the Candidate:* "What is the expectation if outcomes are indexed by payout size?" Since $|X_n|$ is monotonic, sorting by size is sorting by $n$. This doesn't change the order.
      *   *Better Candidate:* "If I offer you this game, and I offer you a guaranteed $\ln 2$ dollars, which do you take?" If EV is undefined, EU theory can't answer.
      *   *Best Candidate for "Real Lesson":* The Additivity Test. "What is the EV of playing two Pasadena games simultaneously?" If EV is a number $E$, then $2E$ should be the answer. But summing two conditionally convergent series is messy.
      *   *Wait, let's look at the prompt's candidate:* "indexed by payout size." Since $2^n/n$ is strictly increasing for $n \ge 1$, sorting by payout magnitude *is* sorting by $n$. So the order doesn't change. This question might confuse them.
      *   *Alternative:* "If we define Expected Value as the limit of the average payoff over $K$ independent plays as $K \to \infty$ (Law of Large Numbers), what happens?" (For Pasadena, the LLN doesn't converge to a constant). This is too hard.
      *   *Let's stick to the prompt's intuition:* The prompt asks if indexing by payout size works. It doesn't, because size maps 1:1 to $n$.
      *   *My Suggestion:* Ask about **Additivity**. "If EV is a property of the game, does Game A + Game A = 2 * Game A?"

  8.  **Address Deliverable 6: Summation Order = Risk Attitude (The "Staging" Problem):**
      *   *Concept:* Choosing an order is choosing how much you care about rare, extreme events (tails).
      *   *Staging:* Do this *after* the rearrangement shock but *before* the final wrap-up.
      *   *Phrasing:* "Summing positive terms first is optimism (waiting for the big wins). Summing negatives first is pessimism. The 'natural' order is neutrality. Since the math doesn't force one, your choice of calculation reflects your attitude toward the tail risk."
      *   *Avoiding Arbitrariness:* Emphasize that *Standard EU* requires absolute convergence to be attitude-independent. If it's not absolute, EU is the wrong tool, or you need a *generalized* EU that includes a summation method as a parameter of the agent.

  9.  **Drafting the Plan (Iterative refinement):**

      *   *Time Allocation:* 80 mins.
      *   *0-15:* Setup & St. Petersburg Review.
      *   *15-30:* The Pasadena Calculation (Natural Order).
      *   *30-45:* The Rearrangement Shock (The "Accounting" Example).
      *   *45-60:* Misconception Busting (Bounding, Truncation, Cheating).
      *   *60-70:* The "Risk Attitude" Insight (Summation as Discounting).
      *   *70-80:* Unsettled Questions & Final Test.

      *   *Refining the "Absolute/Conditional" entry:* Since they don't know the terms, I must define them operationally. "Absolute = Order doesn't matter. Conditional = Order matters." Introduce this *immediately* after showing the two different sums.
      *   *Refining the "Carrying Example":* The prompt worries the Alt Harmonic is too algebraic. I will wrap it in a "Payment Schedule" narrative. The casino offers to pay you in batches. Batch 1: All wins. Batch 2: All losses. vs Batch 1: Win, Loss, Win, Loss.
      *   *Refining the "Risk Attitude":* This needs to be the climax. "The math isn't broken; the assumption that a single number captures value is broken."

      *   *Refining the Final Question:* The prompt's candidate (index by payout) is weak because payout magnitude is monotonic with $n$. I need to explain *why* it's weak and offer a better one. The "Two Games" (Additivity) question is standard in literature (Hájek). Or the "Selling Price" question. Let's go with Additivity. It strikes at the heart of linearity of expectation.

      *   *Refining the "Bounding" Misconception:* I need to be honest. Bounding *does* mathematically fix Pasadena (makes it absolutely convergent). The lesson isn't "bounding fails," it's "bounding is a substantive ethical claim, not a mathematical fix." I need to make sure they don't think "Oh, just bound it, done." They need to feel the cost of bounding.

  10. **Final Review against Constraints:**
      *   No analysis vocab? Use "grouping" and "order."
      *   80 mins? Keep segments tight.
      *   Address the "Risk Attitude" staging specifically.

      *(Self-Correction during drafting)*: Wait, if I tell them bounding fixes it, they will stop listening. I need to frame it as: "St. Petersburg explodes to infinity. Pasadena oscillates. Bounding stops the explosion, but does it stop the oscillation?"
      Actually, if $U$ is bounded by $M$, then $\sum |p_i u_i| \le \sum p_i M = M$. It becomes absolutely convergent. So bounding *does* solve Pasadena mathematically.
      *Crucial Pivot:* I must tell them: "Yes, bounding solves the math. But decision theorists care about this because it shows EV is fragile. Also, do you really want to say a billion dollars is worth the same as 10 million? Let's assume for this class we care about large numbers."
      *Better:* Focus on the "Order is fixed" misconception. That is the real decision-theoretic meat. The "Bounding" objection is a dodge. I will treat it as a dodge.

      *Re-evaluating the "Risk Attitude" staging:* This is the hardest part. How to say "Summation order is risk attitude" without saying "EV is subjective"?
      *Answer:* "Standard EV assumes you are neutral to the *order* in which you consider possibilities. If your valuation changes based on order, you aren't an 'Expected Value Maximizer' in the standard sense. You are something more complex."

      *Final check on the "Index by Payout" question:* Since $2^n/n$ is monotonic, sorting by payout is sorting by $n$. The series remains $1 - 1/2 + 1/3...$. So the answer is "It doesn't change anything." This is a good trick question! It reveals they understand the mapping between $n$ and payoff. I will recommend keeping it but framing it carefully.

      *Wait, one more thing:* The prompt asks specifically about the "Absolute/Conditional distinction" entry point. Since I can't use those words without definition, I need to define them *in the moment* they become necessary. That moment is when the second sum is revealed.

      *Let's build the response.*
answer: |-
  Here is a teaching plan designed for an 80-minute session, tailored to your constraints and audience.

  ### 1. The Order of Components (and the Cost of Swapping)

  You must build the paradox in four specific stages. The critical constraint is your students' lack of analysis vocabulary; you must introduce the *concept* of absolute vs. conditional convergence operationally (via "grouping") before you give it a name.

  **The Sequence:**
  1.  **The Setup (0–15 min):** Define the game. Calculate the probability-weighted terms. Show they form the alternating harmonic series.
  2.  **The "Natural" Value (15–25 min):** Sum them in index order ($n=1, 2, 3\dots$). Derive $\ln 2$. Establish this as the "textbook" answer.
  3.  **The Rearrangement (25–40 min):** Introduce a different summation order (e.g., two positives, one negative). Derive a different value (e.g., $\frac{3}{2}\ln 2$).
  4.  **The Distinction (40–50 min):** *This is where the absolute/conditional distinction must enter.* Define "Stable Sum" (Absolute) vs. "Fragile Sum" (Conditional) based on whether rearrangement changes the total.
  5.  **The Decision Crisis (50–80 min):** Address misconceptions and discuss the implication for choice.

  **What Breaks if You Swap:**
  *   **If you introduce the Distinction (Step 4) before the Rearrangement (Step 3):** You will lose them. Without seeing the second number, "conditional convergence" sounds like abstract math rules that don't apply to reality. They need the shock of two different answers first.
  *   **If you address Misconceptions (Step 5) before the Distinction:** They will use "bounding utility" or "truncation" to dismiss the rearrangement before they understand *why* the rearrangement is theoretically permissible. You must establish the mathematical validity of the rearrangement before they are allowed to argue it away.
  *   **If you swap the "Natural" and "Rearrangement" values:** If you show the variable sum first, they will assume the game is "broken math" immediately. Showing $\ln 2$ first gives them a foothold of certainty that you then pull away, which creates the necessary cognitive dissonance.

  ### 2. The Carrying Example

  Your worry is correct: a purely algebraic series lets students file this under "Math Tricks." You need to embed the algebra in a **decision-theoretic narrative**.

  **The Example:** **"The Casino's Payment Schedule."**
  Do not present the rearrangement as "reordering terms on a chalkboard." Present it as **when the casino settles the tab.**

  *   **Schedule A (Natural Order):** The casino pays you after every toss. Toss 1: +$2. Toss 2: -$2. Toss 3: +$2.66. (This matches the $1 - 1/2 + 1/3$ series).
  *   **Schedule B (The Rearrangement):** The casino says, "We will batch your payments. We will pay you for all winning tosses first, then deduct the losses." Or, "We will pay two wins, then one loss."

  **Why this works:**
  1.  **Same Terms:** It uses the exact same probabilities and payoffs (satisfying the math).
  2.  **Decision Context:** It frames the summation order as a *contractual condition* regarding liquidity and timing.
  3.  **The Hook:** Ask them: "Does the *value of the ticket* change depending on when the casino hands you the cash?"
      *   If they say "Yes," they admit value depends on payment structure, not just outcomes.
      *   If they say "No," they must explain why the math yields different totals for the same ticket.

  **Properties Required:**
  *   The terms must sum to the same set of numbers (preserving the game).
  *   The partial sums must diverge from each other visibly (e.g., one hovers near 0.69, the other climbs toward 1.04).
  *   It must feel like a plausible (if weird) way to run a casino account.

  ### 3. Misconceptions: Order of Appearance and Intervention

  Students will generate these objections in a predictable sequence. You must head them off *exactly* when they arise, or they will block the lesson.

  **Misconception 1: "Just bound utility, it's St. Petersburg again."**
  *   **When it forms:** Immediately after you reveal the payoffs grow as $2^n$.
  *   **Intervention Point:** **Before Step 2 (The Natural Value).**
  *   **How to head it off:** "You are right that bounding utility makes the math safe. In St. Petersburg, bounding stops the sum from exploding to infinity. In Pasadena, bounding stops the sum from oscillating. But for this session, we are asking: *If* we care about large sums of money (unbounded utility), does Expected Value work? Don't let the solution hide the problem."

  **Misconception 2: "No casino can pay, so truncate the tail."**
  *   **When it forms:** When you calculate the payoff for $n=20$ (approx $1 million) or $n=100$.
  *   **Intervention Point:** **During Step 3 (The Rearrangement).**
  *   **How to head it off:** "Decision theory is normative, not descriptive. We aren't asking if a casino *could* run this, but what is rational to *prefer*. If truncation makes the value depend entirely on where you cut, you haven't found the value; you've just picked a cutoff."

  **Misconception 3: "The order is fixed by the game; rearrangements are cheating."**
  *   **When it forms:** This is the big one. It arises at **Step 4 (The Distinction).**
  *   **Intervention Point:** This is the core of the session.
  *   **How to head it off:** "The game defines the *probabilities* and the *payoffs*. It does not define the *calculation method*. Expected Value is a tool we use to evaluate the game. If the tool gives different answers depending on how we hold it, the tool is broken, not the game. The 'natural order' ($n=1, 2, 3$) is just one way to group the possibilities. Why is that grouping privileged?"

  ### 4. What to Openly Decline to Settle

  Do not try to resolve the paradox. There is no consensus in the literature (Nover & Hájek vs. critics). If you try to solve it, you will lie or oversimplify.

  **Explicitly state:**
  1.  **"I will not tell you what the ticket is worth."** There is no fact of the matter within standard Expected Utility theory.
  2.  **"I will not tell you which summation order is 'true'."** Standard math says none of them are uniquely true for conditionally convergent series.
  3.  **"We will not use Measure Theory."** Acknowledge that advanced math exists to handle this, but it is outside the scope of introductory decision theory.

  **The Goal:** The lesson is not "Here is the answer." The lesson is "Here is a case where Expected Value fails to provide an answer."

  ### 5. The Final Question

  Your candidate question (*"What is the expectation if outcomes are indexed by payout size?"*) is **too weak**.
  *   **Reason:** In the Pasadena game, the magnitude of the payout $|X_n| = 2^n/n$ is strictly increasing with $n$. Indexing by payout size *is* indexing by toss number $n$. It yields the exact same series ($1 - 1/2 + 1/3\dots$). A sharp student will realize this instantly, and the question collapses.

  **The Better Question:** **"The Additivity Test."**
  *   **The Question:** "If Expected Value is a real property of this game, say $E$, then playing two independent Pasadena games should have an expected value of $E + E = 2E$. Can we calculate the expected value of two games played simultaneously?"
  *   **Why it works:** When you sum two conditionally convergent series, the result is even *more* unstable. It forces them to realize that if EV is undefined for one, it's undefined for two, which breaks the Linearity of Expectation (a core axiom of their course).
  *   **The Separator:**
      *   *Surface Learner:* Tries to calculate the number anyway or says "Infinity."
      *   *Deep Learner:* Recognizes that if the single game has no defined EV, the "2E" calculation is meaningless, implying Expected Utility Theory cannot handle portfolios of Pasadena games.

  ### 6. Staging the "Risk Attitude" Insight

  This is the most delicate part. You want them to see that choosing a summation order is a choice about **tail risk**, without concluding that "anything goes."

  **Where to place it:** **Minute 60 (After Misconceptions, Before Final Question).**

  **How to say it:**
  1.  **The Setup:** "We saw that summing positive terms first yields a higher value. Summing negative terms first yields a lower value."
  2.  **The Analogy:** "Think of the 'positive first' order as an **Optimist's Accounting**. They book all the wins immediately and worry about the losses later. The 'negative first' order is a **Pessimist's Accounting**."
  3.  **The Pivot:** "In standard Expected Value theory, we assume a rational agent is *neutral* to the order of calculation. We assume the 'truth' is independent of your mood. The Pasadena game proves that for some distributions, **neutrality is impossible.**"
  4.  **The Takeaway:** "Therefore, choosing a summation method isn't finding a hidden number. It is **importing a risk attitude**. It is deciding how much you discount the rare, extreme tails of the distribution. If you use the 'natural order', you are implicitly choosing a specific discount rate for the tail. If you refuse to choose, you must admit the game has no Expected Value."
  5.  **Preventing Arbitrariness:** "This doesn't mean *all* values are arbitrary. For most games (Absolute Convergence), the order doesn't matter. The arbitrariness only appears when the tails are 'heavy' and oscillating. This tells us **where** Expected Value is robust, and where it requires extra assumptions."

  **Script Snippet for the Climax:**
  > "You might feel uncomfortable that the value depends on the order. Good. That discomfort is the lesson. Standard Expected Value assumes you can sum up 'good' and 'bad' possibilities in any order and get the same truth. Pasadena shows that when the stakes grow fast enough and switch signs, **the order of summation is actually a parameter of your risk preference.** You aren't discovering the value of the game; you are deciding how much you care about the million-dollar outcomes versus the penny ones. That's not a math problem anymore; that's a value judgment."

  ### Summary Checklist for the Board
  1.  **Game Def:** $P(n) = 2^{-n}$, $Payoff(n) = (-1)^{n-1} 2^n / n$.
  2.  **Term:** $(-1)^{n-1} / n$.
  3.  **Sum 1 (Natural):** $1 - 1/2 + 1/3 \dots = \ln 2$.
  4.  **Sum 2 (Rearranged):** $1 + 1/3 - 1/2 \dots = \frac{3}{2}\ln 2$.
  5.  **Definition:** Stable Sum (Absolute) vs. Fragile Sum (Conditional).
  6.  **Conclusion:** EV is undefined; Summation Order = Risk Attitude.
