      *   *Tackle Objection 2 (Platonism):* Acknowledge the "cheap" victory. Distinguish between *existence* simpliciter and *concrete existence*. The question is usually "Why is there a concrete universe?" Abstracta don't answer that. Restricting quantifiers to concrete objects is principled if the *explanandum* is concrete reality.
      *   *Strategic Advice:* Present it as a **dilemma** or a **constraint on live positions**. It forces opponents into specific corners (Platonism, Concrete Necessitarianism, or rejecting the non-empty domain premise). It's less a "proof of God" and more a "map of metaphysical commitments."
      *   *Naming:* "Anchoring Argument" is good.
      *   *Technical Note:* Mention Free Logic. The premise that domains are non-empty is not universal in logic. The user needs to defend *why* metaphysically, not just semantically.

  8.  **Refining the "Scope Fallacy" Rebuttal:**
