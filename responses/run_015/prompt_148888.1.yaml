answer: |-
  This is a fantastic argument, and honestly, your roommate accidentally stumbled onto one of the most famous problems in the philosophy of language.

  Here is the breakdown: **Your roommate is philosophically right about the paradox, but you are psychologically right about the anxiety.** Neither of you is strictly "wrong," but you are describing the same phenomenon from different angles.

  Here is how to settle this.

  ### 1. The Philosophical Part: Moore's Paradox
  Your roommate's example ("The train is late but I don't believe it's late") is a classic philosophical puzzle known as **Moore's Paradox**, named after G.E. Moore.

  *   **Logically:** There is no contradiction. It is perfectly possible for the train to be late ($P$) while you don't believe it ($\text{not-}B(P)$). Maybe you just haven't checked the app yet. The world can be one way while your mind is another.
  *   **Pragmatically:** It is absurd to *say* it. When you assert "The train is late," you are implicitly telling the listener, "I believe this to be true." So when you add, "...but I don't believe it," you are taking away the authority of your own statement in the same breath.

  **Who is right here?** Your roommate. You told her, "You can't hold $P$ and $\text{not-}P$ in your head at once." That is the Law of Non-Contradiction. But she isn't holding $P$ and $\text{not-}P$. She is holding **$P$** (The interview will go badly) and **$\text{not-}B(P)$** (I don't believe that proposition). That is not a logical contradiction. It is a *pragmatic* contradiction.

  ### 2. The Psychological Part: Anxiety vs. Belief
  You argued that she is confusing "feeling anxious" with "believing." This is the crucial insight.

  In cognitive psychology, there is a difference between **propositional belief** (what your rational brain assesses as true) and **emotional anticipation** (what your amygdala is preparing you for).

  *   **Her Rational Brain:** "I am prepared. I have a good resume. Probability of success is high." (This is her *belief*.)
  *   **Her Anxious Brain:** "Doom is imminent. Prepare for failure." (This feels like a belief, but it's actually a *simulation*.)

  When she says, "I'm definitely gonna bomb... but I don't believe I'm gonna bomb," she is accurately reporting a split state of mind. She is reporting that her *anxiety* is asserting doom, while her *belief* system rejects it.

  **Who is right here?** You are right that it's anxiety masquerading as belief. But she is right that it *feels* like she is holding two contradictory thoughts. It's not self-deception; it's emotional conflict.

  ### 3. The Medium: Why Writing Feels Different
  This is the most interesting part of your fight. She claims writing it down feels fine, but saying it sounds insane. She is correct, and here is why:

  *   **Speech is an Act of Assertion:** When you speak to someone (even yourself out loud), you are performing a social act. You are asking to be trusted. Saying "I don't believe it" immediately revokes the trust required for the first half of the sentence. It creates a "performative contradiction."
  *   **Writing is a Record of State:** When you write in a journal, you aren't asserting truth to an audience. You are documenting your internal landscape. You can write, "Part of me feels doomed, even though I know I'm not," without it sounding insane. Writing creates **psychological distance**. It allows you to observe the contradiction rather than perform it.

  **Who is right here?** She is. The medium changes the function of the language. Speaking requires commitment; writing allows for description.

  ### The Verdict

  **You are wrong about the logic.** You claimed she is violating the laws of logic ($P$ and $\text{not-}P$). She isn't. She is describing a disconnect between her emotional state and her rational assessment, which is logically valid (however uncomfortable).

  **She is right about the paradox, but maybe wrong about the implication.** She thinks this proves something deep about language (which it does, Moore's Paradox is real). But she might be using the philosophy to validate her anxiety rather than manage it.

  **How to make up:**
  Tell her this:
  > "I looked into it. You actually stumbled on something called **Moore's Paradox**. You're right that it's not a logical contradiction, and you're right that writing it down feels different because speech is an assertion while writing is a record. I was wrong to call it self-deception. However, I still think what you're describing is actually **anxiety simulating belief**, not a philosophical puzzle. So, you're right about the language, but I'm right about the psychology."

  This validates her intelligence (she found a real philosophical concept) while maintaining your point (this is an emotional regulation issue, not a logic problem).
