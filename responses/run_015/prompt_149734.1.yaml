answer: |-
  Your removal test fails because it equates causation with necessity, whereas a robust historical principle must distinguish between replaceable triggers, decisive contingencies, and concurrent sufficient forces.

  The removal test relies on counterfactual necessity (if X hadn't happened, Y wouldn't have), which works for conjunctive causes but collapses under overdetermination or preemption. To save your verdicts, you need a family of principles based on **causal role** rather than just logical necessity. First, in cases of **Structural Inevitability** (WWI, Kellogg-Briand), a specific event is a mere trigger if the structural conditions ensured the outcome would occur via *some* similar event; here, the structure is the cause because it explains the system's vulnerability, while the trigger is secondary because it is interchangeable. Second, in cases of **Decisive Contingency** (Berlin Wall), a specific choice is the cause if background pressures made an outcome possible but not inevitable; here, the agent's decision breaks the historical inertia, making it primary over the background pressure. Third, in cases of **Concurrent Sufficiency** (Passenger Pigeon), multiple factors are all causes if they actively contributed force toward the outcome simultaneously, even if either alone was sufficient; here, both are causes because both participated in the actual historical process, not just a counterfactual one.

  This framework validates your intuition on the Montgomery Bus Boycott as a case of **Conjunctive Necessity**, where the trigger (Parks) and structure (NAACP) were both non-redundant parts of a single sufficient mechanism, making them layered causes rather than competitors. For the manufacturing firm, the principle predicts that both the lost buyer and the factory fire are real causes, provided they contributed concurrently to the collapse; if the buyer loss bankrupted the firm before the fire occurred, the fire becomes a condition of the aftermath, but if they struck simultaneously or interdependently, both share causal status just like hunting and deforestation.

  I do not need to overturn any of your verdicts, provided you maintain the historical claim that World War I was structurally inevitable regardless of the specific spark. If evidence suggested the alliance system alone would not have caused war without that specific assassination, your classification of the assassination as a mere condition would fail, but within your stated intuition of inevitability, the principle holds consistently across all cases.
