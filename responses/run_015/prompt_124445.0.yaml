  There is no contradiction in holding that beauty has value independent of consciousness, while maintaining that the *enjoyment* of beauty is a greater good. The latter includes the former but adds the consciousness of it. However, this consciousness must be true consciousness *of* the object. If the object is absent, the value collapses. I surrender no principle here. But I must ask: within the machine, does the subject hold a true belief that the objects exist, or is the state one of mere sensation without belief? The value of the whole depends heavily upon whether the consciousness involves a true cognition.
