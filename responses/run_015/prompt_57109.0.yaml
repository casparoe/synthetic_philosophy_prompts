answer: |-
  Your two summary points are fair and accurate characterizations of David Rosenthal's Higher-Order Thought (HOT) theory.

  1.  **The Unconscious Monitor:** You are correct that the higher-order state must be unconscious. If the monitoring state were itself conscious, it would require a third-order state to make *it* conscious, launching an infinite regress. Rosenthal explicitly accepts that the higher-order thought is an unconscious mental state.
  2.  **The Misrepresentation:** You are also correct that the theory permits "targetless" higher-order thoughts. If the higher-order state represents you as being in a first-order state (like pain or anger) that does not actually exist, Rosenthal argues you still have the conscious experience as of being in that state. The conscious quality is determined by the higher-order representation, not the underlying reality.

  Here is the joke:

  An efficiency expert tours the Department of Consciousness. He notices a supervisor filing a report that a clerk is typing, but the clerk's desk is empty.

  "You're documenting work that isn't happening," the expert says.

  "True," says the supervisor. "But my report is what makes the work conscious. So now, experientially, it is."

  "Shouldn't someone verify your accuracy?"

  "Can't. If anyone watched me, we'd need another supervisor to watch them, and another to watch him. We'd need an infinite staff just to prove anyone is awake."

  "So you can claim anything?"

  "I can claim anything. I'm the only employee who doesn't need to be observed to be effective."
