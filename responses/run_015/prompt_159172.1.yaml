answer: |-
  There is no single canonical term, but the concept is best defined as **Attritional Learning**: a collective epistemic process where knowledge is gained through the selective physical elimination of a risk-bearing subgroup whose failures are discarded via mortality or steep cost rather than mental simulation.

  This arrangement is a specific hybrid of Daniel Dennett's "four kinds of minds" (Darwinian, Skinnerian, Popperian, Gregorian): it uses **Darwinian means** (selection by death) to achieve **Gregorian ends** (shared cultural knowledge) within a **Skinnerian/Popperian timeframe** (a single lifetime). In biology, this is often subsumed under **Superorganismic Somatic Selection**, where the colony acts as the organism and the scouts as somatic cells subject to internal selection, but that term describes the evolutionary mechanism rather than the learning arrangement you are isolating.

  Here is the carving of the boundaries you requested:

  *   **Same Agent vs. Same Group:** The risk-bearers must be functional parts of a single decision-making agent (a superorganism or integrated firm), not merely members of a loose population. If the units are not integrated such that the survivors automatically inherit the results without negotiation or trade, it is merely parallel testing, not attritional learning.
  *   **Shared Genes:** Kinship is not strictly required, though it explains why the arrangement evolves. Unrelated conspecifics (or employees in a firm) qualify if they are functionally integrated into a single reward system where the loss of the part is absorbed by the whole. If the risk-bearers are independent contractors who lose everything while the client gains the info without cost, that is exploitation, not attritional learning.
  *   **Different Species/Competitors:** This does not survive the move to competitors. When a manufacturer learns from a competitor's recalled product, that is **Observational Learning** (your final bullet). The defining difference is **deployment**: in attritional learning, the group *deploys* the risk-bearers; in observational learning, the group *watches* external failures. The former requires control; the latter requires only perception.
  *   **Magnitude of Cost:** The cost need not be death, but it must be prohibitive enough that the whole group cannot test all options. If the cost is low enough for everyone to try, it becomes **Parallel Exploration**. The phenomenon exists only when the cost forces a division between those who try and those who benefit.
  *   **Designated Subset vs. Bad Luck:** The identity of the risk-bearers must be settled by role or structure (scouts, R&D department), not random misfortune. If random members die and the rest learn, that is merely **Selective Mortality**. Attritional learning requires the *intent* (by the system) to expose a specific subset to risk for the sake of information.
  *   **Simulation vs. Reality:** If the cost is borne by a model or simulation, the phenomenon collapses into **Popperian Planning** (your third kind of mind). The essence of attritional learning is that the environment tests the hypothesis on *flesh and blood*, not symbols. The "truth" is enforced by physical removal, not logical inconsistency.

  In short, you are seeing one thing: a system that externalizes the "trial" phase of trial-and-error onto expendable physical components so that the "error" phase results in removal rather than correction. It is distinct from simulation because the cost is real, and distinct from observation because the cost is internal.
