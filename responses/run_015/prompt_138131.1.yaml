      Actually, looking at (1) and (2)... Anti-reductionism *about testimony in general* but Pessimism *about moral testimony*. This is the "Global Anti-Reductionist, Local Reductionist" move. It's stable *if* you can explain the locality. Reliabilism makes that hard.
