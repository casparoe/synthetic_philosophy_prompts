      *   *Immediate Red Flag:* (1) Anti-reductionism + (2) Moral Pessimism. This is the classic "Exception Problem." Why is testimony basic *except* for morality? Usually, pessimists are reductionists (need independent reasons) or think morality is special (non-cognitivism, understanding requirement).
      *   *Reliabilism Clash:* (5) Reliabilism + (2) Pessimism. If testimony is generally reliable (implied by anti-reductionism allowing knowledge), and moral experts exist (implied by 4, even if hard to find), why is the *process* of believing moral testimony unreliable? Reliabilism cares about the source's truth-conduciveness, not the "moral step." If the expert is reliable, believing them should yield knowledge.
      *   *The "Purely" Loophole:* (3) says mix non-moral facts + own moral step. But (7a) says defer on hiring discrimination. Is "discriminatory" a non-moral fact? Usually a thick concept. If I defer on whether it's discriminatory, am I deferring on the moral verdict? This looks like a contradiction between (3) and (7a).
      *   *First-Person Reports:* (6) says trusting "I was humiliated" is fine. Is "humiliated" moral? It's psychological but often carries moral weight. If it's testimonial belief about a moral fact (that a wrong occurred), does (2) condemn it? User says no. Why? Because it's empirical/psychological?
      *   *Past Self:* (7b) is intrapersonal testimony. Is this really testimony? If it is, does (2) apply? If I treat past self as expert, isn't that moral testimony?
      *   *Expertise:* (4) says moral expertise is just like scientific expertise (degree, not kind). But (2) says moral testimony is defective while scientific testimony (implied by 1) is not. If the *source* is analogous, why is the *transmission* different? This is a major tension.
      *   *High Stakes:* (7a) says obligatory to act. But (2) says belief is defective. Can you be obligated to act on a defective belief? Pragmatic encroachment? Or is the belief justified enough to act but not to "know"?

  4.  **Structuring the Audit:**
      *   Need to categorize tensions.
