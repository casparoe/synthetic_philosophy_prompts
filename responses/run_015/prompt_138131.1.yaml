      *   Mid Tier: The "Purely"/Thick Concept clash (3 vs 7a). The Expertise Analogy clash (4 vs 2).
      *   Low Tier/Apparent: First-person reports (6) and Past Self (7b) might be salvageable via distinctions (empirical vs. normative, continuity of agency).

  5.  **Drafting the Content - Step-by-Step:**

      *   **Brainstorming Section:** Keep it raw, quick, identifying the "smell" of the problems. Focus on the "Why Morality?" question given the other commitments.
      *   **Audit Section:**
          *   *Tension 1 (Severe):* Reliabilism (5) vs. Pessimism (2). If knowledge is reliability, and testimony is a reliable process (1), why is moral testimony unreliable? *Cost:* Give up Reliabilism or Pessimism.
