      *   (4) No principled difference in expertise: Moral vs. non-moral expertise is difference of degree (hard to identify, disagreement).
      *   (5) Reliabilism about knowledge: Knowledge = produced by reliable processes.
      *   (6) First-personal reports: Trusting reports of experience (e.g., "I was humiliated") is fine.
      *   (7) Case Verdicts:
