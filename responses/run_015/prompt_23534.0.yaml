  Hey, I'm a PhD student in philosophy working on game-theoretic accounts of social norms, and I'm stuck on how to frame a paper. Could you write me an essay on whether David Lewis's account of convention in Convention actually has anything to say about how norms evolve — how they come into being, spread through a population, and get replaced over time — or whether that whole dynamic question is just outside what his framework is set up to handle? Lewis's characterization is basicly a synchronic, equilibrium-based picture: a convention is a stable solution to a coordination game where everyone conforms because they expect everyone else to, and the regularity is held up by that self-fulfilling counterfactual dependance. It's not a story about change at all. I want the essay to weigh the case that this is a genuine gap — that you need something like evolutionary game theory or a model of cultural transmission / social learning to explain norm dynamics — against the case that Lewis is deliberately doing a characterizing, not historical, job, and that the equilibrium structure is the right irreducible primitive that any evolutionary story has to reproduce anyway. Please don't end on a hedge; pick a side and defend it, and say what it would take for the other side to be right.
