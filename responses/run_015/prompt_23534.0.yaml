answer: |-
  **Title:** The Architecture of Coordination: Why Lewis's Synchronic Account Remains the Irreducible Primitive of Norm Theory

  **Introduction**

  David Lewis's *Convention* (1969) occupies a paradoxical position in the philosophy of social science. It is simultaneously the foundational text for game-theoretic accounts of norms and the primary target for those seeking to explain how norms actually change. Lewis defines a convention as a regularity in behavior, sustained by a system of reciprocal expectations and preferences, that constitutes a coordination equilibrium. It is a rigorously synchronic account: it specifies the conditions under which a convention *exists* at a time *t*, but it offers no mechanism for how that convention emerged at *t-1* or how it might dissolve at *t+1*.

  For a researcher working on the evolution of social norms, this silence is provocative. It invites the charge that Lewis's framework is fundamentally incomplete—that it captures the geometry of a norm but ignores its engine. The competing view, however, holds that Lewis is engaged in conceptual analysis, not causal history, and that the equilibrium structure he identifies is the necessary primitive that any dynamic model must presuppose. This essay argues for the latter position. While evolutionary game theory (EGT) and models of cultural transmission are indispensable for explaining the *causal history* of norms, Lewis's synchronic account remains the indispensable account of their *constitutive structure*. The demand that Lewis explain dynamics is a category error that conflates the genealogy of a state with the definition of the state itself. To treat the equilibrium as merely the output of a dynamic process is to risk losing the very normativity that makes a convention a social phenomenon rather than a mere behavioral regularity.

  **The Case for the Gap: Dynamics as Explanation**

  The critique that Lewis's account is static is not merely an observation; it is an accusation of explanatory insufficiency. Proponents of evolutionary game theory, such as Brian Skyrms and Peyton Young, argue that a theory of convention must solve the equilibrium selection problem. Lewis appeals to "salience" and "precedent" to explain how agents coordinate on one equilibrium over another, but these are psychological heuristics, not social mechanisms. They describe how a hyper-rational agent might reason, not how a population actually learns.

  From this perspective, the "gap" in Lewis's account is fatal for a theory of social norms because norms are inherently historical entities. A norm's stability is not a static property but a dynamic achievement. It is maintained through processes of reinforcement, sanctioning, and social learning. If a model cannot explain how a population moves from a state of no-convention to a convention, or from one convention to a rival one, it cannot explain the *life* of the norm. Furthermore, Lewis's reliance on common knowledge and high-level rationality is empirically fragile. Evolutionary models replace this with bounded rationality and replication dynamics, showing how conventions can emerge among agents who do not understand the game they are playing. If Lewis's account requires agents to know what evolutionary models show they do not need to know, then Lewis's account is not just incomplete; it is psychologically unrealistic. On this view, the equilibrium is merely the resting point of a dynamic process, and the philosophical heavy lifting is done by the dynamics, not the snapshot.

  **The Case for the Primitive: Constitution over Causation**

  Against this stands the defense of Lewis as providing the constitutive conditions of conventionhood. This argument rests on a distinction between causal explanation and conceptual analysis. When we ask, "What is a convention?" we are asking for the conditions that make a regularity a convention rather than a habit, a law, or a coincidence. Lewis answers this by specifying the structure of expectations and preferences: I conform because I expect you to conform, and I prefer to conform given that you do.

  Any dynamic model that claims to explain the "evolution of conventions" must implicitly accept Lewis's definition of the target. If an evolutionary model shows a population converging on a behavior pattern that lacks Lewisian reciprocal expectations—if, for example, agents conform solely due to blind instinct or external coercion without regard for others' behavior—the model has not explained the evolution of a *convention*. It has explained the evolution of a reflex. Therefore, the Lewisian equilibrium is not just one possible outcome of a dynamic system; it is the definition of the outcome that makes the system a model of *convention* in the first place.

  The dynamicist confuses the path with the destination. Explaining how a building was constructed (the dynamics of labor and materials) is distinct from defining what makes it a building (the architectural structure). Lewis provides the architectural blueprint. He isolates the specific interdependence of expectations that generates the normative force of a convention. The "normativity" of a convention—the reason I feel I *ought* to drive on the right—is located in the counterfactual dependence of my action on yours. That structural relationship exists synchronically. Whether that structure was arrived at through a century of gradual drift or a sudden legislative fiat is causally relevant but constitutively irrelevant. The norm exists in virtue of the current structure of expectations, not in virtue of its history.

  **Defending the Synchronic Priority**

  The reason to side with Lewis is that the alternative reduces normativity to history. If the dynamic account is primary, then the status of a norm becomes entirely dependent on its genealogy. This leads to counterintuitive results. Imagine two populations, A and B. In Population A, a driving convention emerged through a slow, evolutionary process of trial and error. In Population B, the exact same driving convention was instantiated instantaneously by a focal point (e.g., a sudden, universal agreement). Both populations now exhibit the same regularity, the same expectations, and the same preferences.

  If the dynamicist is right, these are different kinds of norms, or perhaps Population B lacks a "true" norm because it lacked the evolutionary process. This is untenable. The normative force experienced by the drivers in Population B is identical to that in Population A. They both expect the other to drive on the right; they both prefer to avoid collision. The *reason* they are in this state differs, but the *state* itself—which is what governs their interaction and justifies their expectations—is identical. Lewis captures the state. The dynamicist captures the story. For a theory of social norms, the state is the primary object of inquiry because the state is what governs action.

  Furthermore, Lewis's framework is robust in a way dynamic models are not. Dynamic models are sensitive to specific parameters of learning, mutation rates, and network structures. Lewis's account abstracts away from these implementation details to identify the invariant logic of coordination. This abstraction is a feature, not a bug. It allows us to recognize the same normative structure in a hunter-gatherer tribe, a digital forum, and a corporate boardroom, despite the vastly different causal mechanisms of transmission in each. To demand that Lewis incorporate dynamics is to demand that conceptual analysis absorb empirical sociology. While a unified theory is desirable, conflating the two obscures the specific contribution of each. Lewis tells us what we are looking for; EGT tells us where to find it.

  **Conclusion**

  David Lewis's account of convention does not explain how norms evolve, and it was never intended to. To treat this as a failure is to misunderstand the philosophical task Lewis undertook. He was not writing a history of how conventions come to be; he was writing a logic of what they *are*. The equilibrium structure he identifies is the irreducible primitive of norm theory because it isolates the specific interdependence of expectations that distinguishes a social norm from a mere behavioral regularity. Evolutionary game theory and models of cultural transmission are essential for understanding the causal mechanisms of social change, but they operate *within* the space of possibilities defined by Lewis. They explain the trajectory, but Lewis defines the coordinate system.

  For the dynamicist to overturn this conclusion, they would need to demonstrate that the normative force of a convention is not contained in the current structure of expectations, but is essentially historical. They would need to show that two populations with identical synchronic expectation-structures but different histories possess different norms, or that the "ought" of a norm is derived from the process of its enforcement rather than the structure of its compliance. Until it can be shown that the history of a norm changes its current normative status independent of the agents' current expectations, Lewis's synchronic account remains the necessary foundation. We need dynamics to explain the world, but we need Lewis to explain the norms within it.
