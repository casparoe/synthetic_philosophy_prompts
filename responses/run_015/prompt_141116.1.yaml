answer: |-
  ### The Spec: Requirements for Judging Old Sources

  History is not math. You cannot prove things with equations. You are building a legal case based on incomplete evidence. The goal is not "truth" in the absolute sense, but "probability" based on the best explanation available.

  Below are the requirements for a method to evaluate sources. Each requirement includes the **Rule**, the **Case Handling** (how it applies to your list), and the **Classification** (Non-Negotiable vs. Preference).

  #### 1. The Requirement of Independence
  **Rule:** A claim gains strength only when supported by sources that did not copy each other. Multiple sources count as one if they share a common ancestor.
  **Case Handling:**
  *   **One book says X, nothing else does:** The claim remains unverified. It is possible, but carries low probability. It cannot be treated as fact, only as a single testimony.
  *   **Three later books say X, but copied the first:** This counts as **one** source, not three. The repetition adds no weight. You must evaluate the original book, not the copies.
  **Classification:** **Non-Negotiable.** Logically, copying an error does not fix the error. If you count copies as independent proof, your math is wrong.

  #### 2. The Requirement of Proximity vs. Transmission
  **Rule:** Physical presence reduces the chance of transmission error, but increases the chance of personal bias. Distance reduces personal bias but increases transmission error (telephone game).
  **Case Handling:**
  *   **Author there vs. Author 200 years later quoting witnesses:** The eyewitness has better access to *data*, but the later author might have better *context* or access to multiple witnesses the eyewitness didn't know. You cannot automatically prefer the eyewitness. You must check if the eyewitness had a reason to distort what they saw personally. The later author must be checked for how accurately they report the witnesses' words.
  **Classification:** **Preference.** Some historians prioritize "being there" (empiricism). Others prioritize "wide sampling" (sociology). Neither is logically superior without checking bias.

  #### 3. The Requirement of Motive Analysis
  **Rule:** You must identify *why* a author would write something. Intentional lies require a motive. Unintentional errors require a cause (misunderstanding, rumor).
  **Case Handling:**
  *   **Obvious reason to lie vs. Repeating city belief:** The author with a reason to lie (propaganda) is high risk for intentional distortion. The author repeating city belief is high risk for unintentional distortion (everyone was wrong together). Neither is safe. You must look for where their motive *fails* to serve them.
  *   **Friend's Claim (Reporting fault):** This is called the **Criterion of Embarrassment**. If an author reports something that makes their side look bad, they likely didn't invent it.
      *   *Is it real?* Yes, it is a valid heuristic.
      *   *Is it non-negotiable?* **No.** Authors might admit a small fault to hide a big one, or believe a loss was actually a moral victory. It increases probability, it does not guarantee truth.
  **Classification:** **Preference.** It is a tool for weighing probability, not a law of logic.

  #### 4. The Requirement of Internal Consistency vs. External Fit
  **Rule:** A source must make sense within itself (Internal) and must not contradict known physical realities (External).
  **Case Handling:**
  *   **Small stuff right, big stuff weird:** If names and dates are perfect, the author had access to records. If the "big stuff" (causes, outcomes) is weird, the author is interpreting facts through a biased lens. Trust the data (names/dates), distrust the analysis (why it happened).
  *   **Missing Case (Anachronism):** If a source mentions a technology, word, or building that did not exist at the time they are writing about, the source is compromised. They are projecting their present into the past.
  **Classification:** **Non-Negotiable.** If a source claims a king signed a document with a ballpoint pen 500 years before pens existed, the source is factually wrong on that point.

  #### 5. The Requirement of Material Anchor
  **Rule:** Text must be checked against physical reality where possible. Dirt does not lie in the same way humans do.
  **Case Handling:**
  *   **Coins or buildings, no text:** These prove *existence* and *capability*, not *intent* or *narrative*. A coin proves a king ruled. It does not prove he won a battle. A burned layer in a city proves destruction. It does not prove who burned it. You cannot build a full story on this, but you can use it to veto text claims (e.g., text says city was peaceful, dirt shows fire).
  **Classification:** **Non-Negotiable.** Physical evidence overrides textual claims when they directly contradict (e.g., text says "city never burned," archaeology shows ash).

  #### 6. The Requirement of Naturalistic Explanation
  **Rule:** The method must explain events using human cause and effect, not supernatural intervention.
  **Case Handling:**
  *   **A source says a god did it:** The historian must translate this. "A god sent a storm" becomes "A storm happened, and people attributed it to a god." You cannot verify the god. You can verify the storm.
  **Classification:** **Non-Negotiable.** History studies human action. If you allow "a god did it" as a historical cause, you stop doing history and start doing theology. The method cannot verify miracles.

  ---

  ### The Circularity Problem

  You asked: *You need something independent to check a source against, but the only independent stuff is more sources, so you never get going. Is that a real problem?*

  **Yes, this is a real problem.** It is known as the problem of **Coherentism**.

  If every source needs another source to verify it, you have an infinite chain. You cannot start.

  **What this means for the method:**
  1.  **You cannot achieve certainty.** Any method that promises to tell you "exactly what happened" is lying. The best you can produce is a **consilience of evidence**. This means different types of evidence (text, dirt, coins, logic) all point to the same conclusion without colluding.
  2.  **Foundational Assumptions.** To break the circle, you must accept a few things as "provisionally true" to start the work. Usually, these are:
      *   Physical laws do not change (gravity worked then as now).
      *   Human psychology is consistent (people lie to protect power).
      *   Archaeology provides a fixed timeline (layers of dirt accumulate in order).
  3.  **Suspicion vs. Answering.** A method can be highly suspicious and still answer things, but the answers must be phrased as probabilities.
      *   *Bad Answer:* "This battle happened."
      *   *Good Answer:* "The evidence makes it highly probable a conflict occurred here, though the specific date is disputed."

  **The Verdict on Circularity:**
  You do not solve the circle by finding a "perfect source." You solve it by weaving a net. If Text A says X, and Dirt B suggests X, and Logic C says X is likely, you accept X not because one source proved it, but because the *web* holds together. If one strand breaks (Text A is proven biased), the web might still hold if Dirt and Logic remain.

  ### Summary of Classifications

  | Requirement | Classification | Why |
  | :--- | :--- | :--- |
  | **Independence** | Non-Negotiable | Copying errors doesn't make them true. Logic. |
  | **Proximity** | Preference | Eyewitnesses lie; later historians can synthesize better. |
  | **Motive/Embarrassment** | Preference | Useful heuristic, but not a guarantee of truth. |
  | **Internal/External Consistency** | Non-Negotiable | Contradictions must be resolved; anachronisms disqualify data. |
  | **Material Anchor** | Non-Negotiable | Physical contradiction vetoes text. |
  | **Naturalistic Explanation** | Non-Negotiable | Supernatural causes are outside the method's ability to verify. |

  ### What You Are Missing
  You listed many text-based problems. The missing piece is **Silence**.
  *   **Case:** A huge event is described, but no one else mentions it, and no debris is found.
  *   **Rule:** Argument from Silence. If an event *should* have left a trace (a huge battle, a fire, a king) and none is found elsewhere, the probability drops. However, absence of evidence is not always evidence of absence (maybe we just haven't found the dirt yet). This is a **Preference** in weighting, not a hard rule.

  ### Final Note for Your Project
  Your teacher is right: you cannot just read the book. But the critics are also wrong: you cannot just discard every book because of bias.
  The method is not about finding a "pure" source. It is about **triangulation**. You take three biased sources, figure out where their biases point, and look for the event that sits in the middle of where their lines of sight cross. That is how you know what happened a long time ago. You don't know it for sure. You know it because it is the only thing that makes sense of all the lies.
