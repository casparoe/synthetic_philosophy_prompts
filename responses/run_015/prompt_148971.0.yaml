answer: |-
  True respect for the dead means letting them remain unedited, even if it bores the living.

  Jules held Clara Voss's final letter over the editing bay's glow. Clara wasn't famous, just brilliant—a mathematician who solved problems in margins while paying rent late. The footage was gold: isolation, brilliance, a hint of madness. Perfect for the "tragic genius" archetype investors loved.

  But the letter wasn't a diary entry. It was a cease-and-desist from the grave.

  *If you turn my silence into symbolism, you erase me twice,* Clara had written. *The tragedy isn't my life; it's your need to make it neat. Don't swap my messy humanity for a sellable ghost.*

  Jules's producer wanted the montage: Clara alone in the dark, scribbling equations, dying unknown. It would win awards. It would lie. Clara wasn't mysterious; she was just tired. She liked bad TV and burnt toast. She wasn't a martyr to math; she was a woman who loved numbers more than people sometimes.

  The "counter-narrative clause" demanded Jules kill the drama. No swelling violins. No shadowy reenactments. Just the mundane truth of a life that didn't fit a genre.

  Jules looked at the timeline. The dramatic arc was ready to render. All it took was deleting the mundane clips—the grocery lists, the laughter, the boring Tuesdays.

  If Jules followed the note, the documentary would be quiet. Maybe unwatchable. Funding might vanish. But Clara's condition was clear: representation without distortion is the only debt the living owe the dead.

  Jules hit delete on the violin track. They kept the footage of Clara arguing about laundry. The film wouldn't be a tragedy. It would be a biography. Clara remained messy, uncurated, and finally, truly seen.
