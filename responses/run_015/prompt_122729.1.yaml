  So I had this long, annoying argument with my friend Sam last night — we were at this dive bar near campus until stupidly late, and then I kept going over it on the way home — about semantic externalism. I'm in a philosophy of language reading group and we did the Twin Earth stuff last week, so it was fresh. Sam is a hardline internalist: meaning is whatever's in the head, the Twin Earth stories are a parlor trick, end of story. I kept pushing back, and then I realized my own verdicts definately don't add up, so now I want help finding out what principle, if any, is behind them.

  Here's where I ended up, going case by case, just reporting gut reactions. (1) Classic Twin Earth: the stuff in the lakes and taps there is XYZ, not H2O, superficially indistinguishable from water, and I'm happy to say Oscar and Twin-Oscar mean different things by 'water' and are thinking different thoughts. (2) But — this is the one Sam nailed me on — suppose the twin liquid is heavy water, D2O: drinkable, looks and tastes and behaves the same, different microphysical structure. My gut there is that 'water' still means water, or at least that nothing important about meaning has changed, and Sam says that's flatly inconsistent with (1) unless I can say which microphysical differences matter and which don't. (3) Third planet, where the taps have always run a stable 50/50 mix of H2O and XYZ: I want to say 'water' there doesn't really refer, or is indeterminate — but I can't say why 50/50 fails while 99/1 would be perfectly fine. (4) The arthritis-in-the-thigh case: the guy means arthritis, he just has a false belief about where he has it; the experts' usage wins over his own misuse. (5) But if I stipulate a word myself — say I coin 'glorp' for the particular 4pm dread I get in the library — I think my intention fixes what it means, even though nobody else uses it and even though I'd be hopeless at picking glorp episodes out reliably. (6) Swampman, the molecule-for-molecule duplicate assembled by a lightning strike: his first 'that's a tree' means nothing at all, as far as I'm concerned. (7) And two verdicts that pull the other way, which Sam loved rubbing in: I still feel like Oscar and Twin-Oscar would be genuinely contradicting each other if they could ever talk, and I still feel like I can know what I mean without going out and doing chemistry first.

  Is there one account of content determination that gets all seven, or close to it? I'd like the principle stated precisely enough that I could apply it myself, and I want to know which of my verdicts it forces me to drop — and especially whether the cost of saving every verdict is a principle so baroque that I should just give up one of them instead. Please also tell me what it predicts about three things I haven't listed: a community two hundred years from now where everyone drinks a synthesized XYZ-like liquid and natural H2O is a toxic pollutant nobody goes near (what does 'water' mean there, and when did it flip?); a community that has always been envatted brains in a simulation, where the simulated 'water' has never had any causal contact with any actual liquid (do their 'water' thoughts have content at all?); and whether the principle is even meant to cover artifact and social-kind words like 'chair' or 'university', or only natural-kind terms.

  Can you lay it out in four titled sections, in this order: "The principle" (about 150 words, one statement I could write on an index card), "Clause by clause" (about 400 words, going through each clause of the principle and naming the case of mine that motivated it), "Predictions" (about 250 words, covering the three unlisted cases above), and "What I'd have to give up" (about 150 words, saying honestly which of my verdicts the principle can't accommodate, and what the simpler rival principle would be that overturns one of them instead).
