answer: |-
  ### The principle

  Meaning is determined by a dual-factor constraint: Wide content fixes reference via the dominant causal-historical chain linking a token to its source, requiring actual contact for content to exist. Narrow content fixes cognitive significance via the functional role the token plays in the speaker's reasoning and behavior. For natural kinds, reference targets the underlying structure of the causal source; for social kinds, it targets expert usage; for private sensations, it targets introspective intention. Reference fails if causal sources are equally balanced or absent. Contradiction occurs when narrow contents clash, even if wide contents differ. Self-knowledge accesses narrow content directly, while wide content requires empirical investigation. This principle distinguishes between what a thought is about (wide) and how it feels to think it (narrow), allowing externalist reference without sacrificing internalist access to reasoning.

  ### Clause by clause

  The first clause, requiring a "dominant causal-historical chain," directly motivates your verdict on Classic Twin Earth (1). Oscar's tokens link to H2O; Twin-Oscar's link to XYZ. This same clause forces the Swampman (6) verdict: without a genesis chain, there is no wide content. The distinction here is vital: Twin-Oscar has a chain, just to a different stuff; Swampman has none. However, the second clause, focusing on "functional role," rescues the Heavy Water case (2). Unlike XYZ, D2O functions identically in human biology; thus, while wide content might technically differ, the functional equivalence preserves the cognitive significance you intuited. This implies a threshold: microphysical differences matter only when they disrupt functional role. The "equally balanced" restriction explains the 50/50 Mix (3). Reference requires dominance; a perfect split yields indeterminacy, whereas 99/1 yields H2O. This avoids arbitrary lines by admitting vagueness.

  For social concepts, the "expert usage" clause captures the Arthritis case (4). Your friend defers to the medical community, so his content is fixed by their knowledge, not his false belief. This establishes a division of linguistic labor. Conversely, the "introspective intention" clause protects your private coinage (5). "Glorp" lacks a public causal chain, so individual intention suffices, marking a boundary between public and private language. Note the tension between Arthritis (4) and Glorp (5). The principle resolves this by distinguishing natural/social kinds from private sensations. Arthritis is public; Glorp is private. The principle mandates deference only where a public causal chain exists.

  Crucially, the "narrow content" clause addresses your conflicting intuitions on Contradiction and Self-Knowledge (7). You feel Oscar and Twin-Oscar contradict because their narrow contents (reasoning roles) clash, even if their wide contents (references) differ. Similarly, you know your narrow content immediately, satisfying the internalist urge without denying externalist reference. This dual-layer approach allows you to maintain externalist metaphysics for reference while preserving internalist phenomenology for reasoning, systematically validating each of your seven case verdicts by assigning them to different components of the meaning complex. It acknowledges that "meaning" is not a single property but a relation between mind, world, and community.

  ### Predictions

  Regarding the future community drinking synthesized XYZ, the principle predicts a gradual reference shift. "Water" means H2O now because the causal chain links to H2O. As the community switches to XYZ, the dominant causal source shifts. The flip occurs when the majority of usage tokens are causally linked to XYZ rather than H2O. There is no precise moment; it is a sorites transition tracking usage habits. During the transition, reference is indeterminate, matching your 50/50 intuition.

  For the envatted brains, the principle is strict: without causal contact with actual liquid, there is no wide content regarding real water. Their "water" thoughts refer to simulation-states or nothing at all, aligning with your Swampman verdict. They cannot think about H2O because no causal chain connects them to it. This predicts their thoughts are empty of real-world reference, though they possess narrow content allowing internal reasoning.

  Finally, the principle explicitly covers artifacts and social kinds like "chair" or "university." For these, microphysical structure is irrelevant; reference fixes to function and expert intention. A "chair" made of hologram is still a chair if the social function holds. This distinguishes them from natural kinds like "water," where hidden structure dominates. The principle thus predicts a split semantics: structural for nature, functional for artifacts.

  ### What I'd have to give up

  You cannot consistently hold both the Swampman verdict (6) and the Contradiction verdict (7). If Swampman lacks content entirely, he cannot contradict Oscar. If Twin-Oscar genuinely contradicts Oscar, they must share a content type, undermining strict externalism. To save the principle, you must drop one. I recommend dropping (6); Swampman intuitions are outlier metaphysical claims, whereas (7) reflects robust linguistic practice. Accepting Swampman has content (via functional role) simplifies the view.

  The simpler rival is Pure Externalism (Putnam/Burge). It keeps (1), (4), and (6) but forces you to drop (2), (5), and (7). It says meaning is only wide content. You would have to admit Oscar and Twin-Oscar don't contradict, and you don't know your own meaning without chemistry. Given your gut reactions, the dual-factor principle is worth the complexity, provided you abandon the strict Swampman intuition to preserve the contradiction intuition.
