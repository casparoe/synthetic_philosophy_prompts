  1. Audience framing and prerequisites
  Your colleagues likely operate under a binary assumption about introspection: either it is a transparent debug log revealing ground truth about internal states, or it is unreliable noise to be ignored in favor of behavioral metrics. This binary blocks heterophenomenology. To make the method constructive rather than dismissive, you must establish one conceptual distinction upfront: the difference between the *subject's reported reality* and the *researcher's factual reality*. Without this, treating reports as data looks like skepticism. With it, treating reports as data becomes a neutral modeling strategy. They must accept that a system's output about its state is a distinct object from the state itself, regardless of whether that system is silicon or carbon.

  2. Conceptual sequence
  Begin by defining the "heterophenomenological world" as the totality of what subjects say they experience. This must precede any discussion of report accuracy because accuracy implies a comparison target; here, the reports *are* the target data. If you start by asking "are they telling the truth?", you force a binary judgment that heterophenomenology avoids. Next, introduce the "world-as-described-by-third-person-science" (neural activity, weights, biases) as a separate dataset. Only after establishing these two distinct databases should you discuss the mapping between them. This prevents the audience from immediately judging reports as false.

  Introduce the intentional stance in the middle, specifically when discussing how to model the reports. Frame it strictly as a compression algorithm: we treat the system as a rational agent to predict its outputs efficiently. Do not introduce it as a claim about whether the system *is* an agent. If introduced too early, it triggers ontological debates about AI consciousness. If introduced too late, it looks like an explanation of mind rather than a prediction tool. The sequence must be: (1) Collect reports (heterophenomenological world), (2) Adopt intentional stance to model reports, (3) Compare model predictions against third-person physical data. This order ensures the intentional stance functions as a methodological tool for prediction rather than an ontological claim about inner life. Finally, conclude with the neutrality clause: the method remains silent on whether the heterophenomenological world matches the third-person world, leaving the ontology of consciousness untouched while maximizing predictive power.

  3. The carrying example
  The session revolves around a single scenario: an LLM generating confidence scores and self-reflection tokens during inference. Treat statements like "I am uncertain about this classification" as structured telemetry logs rather than expressions of feeling. The example must contain three elements: structured first-person reports (the text output), an absence of direct access to internal states (we cannot read the latent space directly as "feelings"), and a goal of predictive modeling (can we predict when the model will output "uncertain" based on input complexity?).

  Crucially, the example must lack any appeal to neural correlates of consciousness. Do not ask if the model *actually* feels uncertainty. Do not frame the task as solving the hard problem of machine consciousness. The goal is not to determine if the LLM is conscious, but to demonstrate how treating its self-descriptions as data allows us to build better system monitors without settling the metaphysics. By keeping the example strictly within the engineering domain—optimizing a model based on its own output logs—you bypass the emotional resistance humans feel when their own introspection is treated similarly. The analogy holds because both humans and LLMs produce text about states we cannot directly observe, making the methodological neutrality clear before applying it to human subjects.

  4. Misconceptions and deflection points
  Three misconceptions will arise. First, that this is behaviorism in disguise. Head this off during the Conceptual Sequence by emphasizing that we care about the *content* of the report, not just the stimulus-response pattern. Use the phrase: "We are modeling the narrative, not just the noise." This distinguishes heterophenomenology from strict behaviorism which ignores internal descriptions. Second, that this licenses treating human reports as untrustworthy. Address this during the Carrying Example. Clarify that "neutral" does not mean "skeptical." Use the phrase: "We take the report seriously as a report, not as a fact." This prevents engineers from dismissing user feedback as mere hallucination or lying.

  Third, that heterophenomenology collapses into eliminativism about consciousness. This will surface during Q&A. Neutralize it by distinguishing methodology from ontology. Use the phrase: "This method brackets the question of existence; it does not answer it with a no." If you wait until the end to address these, the audience will have already hardened their positions. You must pre-empt the behaviorism charge when defining the heterophenomenological world. You must pre-empt the skepticism charge when introducing the LLM analogy. You must pre-empt the eliminativism charge when discussing the intentional stance. By embedding these deflections into the flow rather than saving them for a "misconceptions" slide, you prevent the audience from constructing these objections as primary interpretations of your talk. Ensure you reiterate that the goal is empirical adequacy of the model, not metaphysical reduction.

  5. Check for understanding
  End with a five-minute exercise. Present a novel log entry: "System warning: I feel overheated." Ask them to write two sentences. Sentence one must describe the heterophenomenological world (what the system says it experiences). Sentence two must describe the third-person world (what the sensors measure). They must not mix the two. If they write "The system feels hot because the CPU is at 90%," they fail. They must write "The system reports feeling hot" and "The CPU is at 90%." This forces the distinction between the report and the reality, verifying they can maintain the methodological bracket.

  6. What to leave out and say so
  Explicitly set aside the zombie argument and the knowledge argument (Mary's Room). State clearly at the start that these are ontological tools designed to test metaphysical claims, whereas heterophenomenology is a methodological tool for data collection. Also exclude detailed phenomenological critiques regarding the richness of experience. Given the seventy-five-minute constraint and the engineering audience, diving into metaphysical possibility spaces distracts from the practical utility of the method. Tell them: "We are not solving the hard problem today; we are building a better logging framework." This keeps the focus on empirical adequacy and predictive modeling rather than philosophical debate about qualia.

  7. What would change this plan
  If the audience challenges the LLM analogy by insisting humans have biological qualia models lack, I would reorder to start with human clinical data (e.g., blindsight) before moving to LLMs. The most exposed point is the claim that engineers will conflate the method with behaviorism. If the LLM analogy triggers a debate on AI rights rather than methodology, I would drop the example entirely and use a black-box API analogy. If they view bracketing ontology as a denial of experience, the workshop fails.
