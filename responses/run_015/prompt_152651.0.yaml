  **Joint Statement on Public Reason and the Rest-Day Equity Act**
  **Draft v.3 — Working Document**

  **Participants:**
  Camp A (Translation Exclusivists)
  Camp B (Dual-Track Accessibilists)

  **Context:**
  We've been going back and forth on the hypothetical 'Rest-Day Equity Act' (Sunday big-box closure, small shop exemption). We aren't going to resolve the deep philosophical split today, but we want to map out exactly where we stand so future debates aren't just talking past each other. Below is what we agree on, where we diverge, and how we think these principles apply to other hard cases.

  ### I. Agreed Claims (Common Ground)

  1.  **Justification Owed:** Coercive law owes a justification to all citizens subject to it. You can't just say "because I said so" or "because my text says so" when you're using state power.
  2.  **No Second-Class Citizenship:** Religious citizens are not second-class participants in democracy. They don't have to check their identity at the door to enter the public square.
  3.  **Motivation vs. Justification:** There is a real distinction between the reason that *motivates* you personally (e.g., "God commands rest") and the reason that *justifies* the law to others (e.g., "workers need rest").
  4.  **Accessibility Requirement:** Democratic legitimacy requires some form of accessibility. Reasons can't be totally esoteric or locked behind a paywall of revelation, though we disagree on what "accessible" means.
  5.  **Secular Backup Matters:** Both sides agree that having a secular rationale is better than not having one. The fight is about whether that secular rationale is sufficient on its own or if it needs to be the *only* thing cited in official justification.

  ### II. Disagreements Table

  | Issue | Camp A (Strict Translation) | Camp B (Dual-Track Access) |
  | :--- | :--- | :--- |
  | **(i) Translation Duty** | Translation into secular shared reasons is a **moral obligation**. Voting on untranslated religious grounds violates democratic reciprocity because it asks others to accept authority they don't recognize. | Translation is a **courtesy**, not a duty. Religious reasons are fine in debate and voting so long as there is an independent secular justification that could stand alone. |
  | **(ii) The Act's Exemption** | The exemption clause (small shops only) **corrupts the secular face** of the law. It tracks Christian Sabbath observance too neatly to be coincidental, undermining the worker-rest rationale. | The exemption is **religiously neutral on its face**. The secular rationale (protecting small biz/workers) remains intact regardless of the religious overlap. Correlation isn't causation. |
  | **(iii) Voting Behavior** | Citizens voting *mainly* for religious reasons **wrong other citizens**, even if a secular backup exists. It treats the secular reason as a pretext rather than the actual ground of law. | Citizens voting mainly for religious reasons **do not wrong others** if a secular backup exists. The problem is only when there's *no* secular backup available. |

  ### III. The Cruxes

  We identified two main sticking points that explain why we read the Rest-Day Act differently.

  **Crux 1: The Definition of Accessibility**
  *   **The Split:** Does accessibility mean **psychological transparency** (every affected citizen can understand and evaluate the reason without needing special faith) or only **logical independence** (there exists some secular path that doesn't depend on revelation, even if most people don't use it)?
  *   **Camp A:** Leans toward psychological transparency. If the real drive is religious, the public reason is a sham.
  *   **Camp B:** Leans toward logical independence. As long as the secular reason *could* work on its own, the actual psychology of the voters matters less.

  **Crux 2: Correlation vs. Neutrality**
  *   **The Split:** Are exemption structures that correlate with religious practice automatically **sectarian** or can they be **neutral in intent and effect**?
  *   **Camp A:** High correlation suggests sectarian intent. If the law bends exactly where religious practice needs it to, the secular excuse looks weak.
  *   **Camp B:** Correlation is acceptable if the rule is generally applicable. Small shops deserve help regardless of religion; that Christians own more small shops doesn't make the law Christian.

  ### IV. Concrete Comparison Cases

  To test these cruxes, we picked two other cases. Here is what each camp predicts should happen.

  **Case 1: The Quiet Hours Ordinance**
  *Scenario:* A city bans loud noise between 4 AM and 6 AM. This aligns perfectly with local Buddhist meditation hours, though the stated reason is general public health/sleep.
  *   **Camp A Prediction:** **Modify or Strike.** The timing is too specific. It fails psychological transparency because the secular reason (sleep) doesn't require *that* specific window unless you know the religious context. It looks like favoritism.
  *   **Camp B Prediction:** **Survive.** There is logical independence (people need sleep at night). The alignment with Buddhism is coincidental. As long as the health rationale stands on its own, the religious overlap is fine.

  **Case 2: The Property Tax Exemption**
  *Scenario:* Tax exemption for "houses of worship and secular nonprofits dedicated to community moral improvement." Churches qualify, so do secular ethics societies.
  *   **Camp A Prediction:** **High Scrutiny/Modify.** In practice, this mostly benefits churches. The "secular nonprofit" category is often too vague, making the secular backup weak. It risks making religious citizens look like they get special treatment.
  *   **Camp B Prediction:** **Survive.** The rule is neutral on its face. Secular groups *can* qualify. The fact that churches use it more doesn't invalidate the secular justification of supporting community good.

  ### V. Next Steps

  We agree to use this framework when analyzing the final text of the Rest-Day Equity Act. Camp A will draft a memo on how the exemption could be widened to reduce sectarian correlation. Camp B will draft a memo on whether the secular evidence for worker rest is strong enough to stand alone without the religious history.

  **Signed,**

  *Rep, Camp A (Exclusivists)*
  *Rep, Camp B (Accessibilists)*

  *Date: Oct 14*
