answer: |-
  Your hypothesis—that this is a fight about the horizon—is the strongest empirical lever in the room, but it is not the root cause. It is the *proxy* war for a deeper, normative disagreement. If I shoot at your hypothesis: knowing the horizon is 5 bets versus 300 bets would likely not end the argument. Camp One would simply argue that even with 300 bets, the "volatility drag" of non-Kelly betting is unacceptable for a strategy meant to be repeated, or they would retreat to the claim that Log Utility is the only rational preference regardless of horizon length. Camp Two would argue that even with 300 bets, if you have linear utility over terminal wealth, you should bet more than Kelly (until risk of ruin binds).

  The diagnosis is this: **This is a substantive clash over the normative source of the utility function (derived from dynamics vs. exogenous preference), masked as a technical dispute about horizon and asymptotics.**

  Camp One is arguing from **Ergodicity Economics**: they claim the utility function (Log) is *derived* from the physical structure of repeated multiplicative dynamics. To them, "maximizing growth rate" is not a preference; it is a law of survival for any agent who plans to remain in the game. They view the horizon as "effectively infinite" because they view the *strategy* as reusable indefinitely, even if this specific pool dissolves.

  Camp Two is arguing from **Standard Decision Theory**: they claim the utility function is *exogenous* and subjective. The dynamics (betting structure) are constraints, not preference generators. To them, "maximizing growth rate" is just one specific preference among many, and preferring median wealth over mean wealth is a value judgment, not a mathematical necessity.

  The reason nobody moves a millimeter is that you are not arguing about math; you are arguing about meta-ethics. Camp One thinks Camp Two is irrational for ignoring the "time-average" property of reality. Camp Two thinks Camp One is dogmatic for elevating a specific utility function to a law of nature. The horizon argument is just the ammunition they use because neither side can prove their meta-ethical stance.

  **Confidence:** 85%.
  **Where it breaks:** This diagnosis assumes both camps are internally consistent. It breaks if Camp One is actually just risk-averse and using "growth rate" as a rationalization, or if Camp Two is actually maximizing linear expectation but ignoring ruin risk due to overconfidence.
  **Mind-Changing Conditions:**
  1.  **Horizon = 5:** If the hard stop is 5 bets, Camp One's asymptotic argument factually collapses. If they still insist on full Kelly, it proves their position is dogmatic (Log Utility preference) rather than dynamic (Growth Rate maximization). This would shift the diagnosis to "Bedrock Temperament."
  2.  **Group Utility Specification:** If you formalize the pool's objective (e.g., "Maximize probability of ending with >$X" or "Maximize expected withdrawal"), the math dictates the fraction. If they *still* disagree after agreeing on the objective, it is purely verbal/temperamental.
  3.  **Edge Uncertainty:** If you introduce significant parameter uncertainty (your edge is a distribution, not a point), full Kelly is objectively suboptimal even for Log Utility (it becomes "Bayesian Kelly"). If Camp One refuses to fractionalize under uncertainty, they are not actually following their own theory.

  **What Counts as Progress:**
  Do not run simulations yet. A simulation requires a scorecard, and you haven't agreed on the scorecard. Progress is **forcing the group to write down a single terminal objective function.**
  Stop asking "What is the rational fraction?" Start asking "What quantity are we maximizing at the end of the run?"
  *   Is it $E[\text{Wealth}]$? (Camp Two's implicit lean, leads to bet sizes > Kelly)
  *   Is it $E[\log \text{Wealth}]$? (Camp One's explicit lean, leads to Kelly)
  *   Is it $\text{Median}(\text{Wealth})$? (Camp One's rhetorical lean, approximates Kelly)
  *   Is it $P(\text{Wealth} > \text{Target})$? (Leads to fractional Kelly)

  Once the objective function is fixed, the horizon becomes a solvable parameter in a dynamic programming problem, not a philosophical wedge. If they cannot agree on the objective function, no amount of math will resolve the dispute, because they are optimizing different games.

  \answer{Normative clash on utility derivation; Explicit terminal objective function}
