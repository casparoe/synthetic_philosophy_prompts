answer: |-
  **1. Order of Introduction and Dependency**

  *   **Minute 0–5: Introduction and the Empty Grid.**
      Distribute the function-grid immediately as an empty schema. Do not explain the "bundle" theory yet; simply tell students these are the five categories they must populate during the discussion.
      *   *Dependency:* You cannot grasp the grid's utility until they attempt to fill it and find that the checkmarks do not align in a single column. Providing it *before* the cases prevents them from taking narrative notes they cannot use for the final synthesis. It turns the session into a data-collection exercise rather than a lecture.
  *   **Minute 5–15: England (The Familiar Trap).**
      Start here. American students understand "Establishment" as a binary concept. England confirms the label (Established Church) but contradicts the expected function (No tax).
      *   *Dependency:* This case must come first to destabilize the assumption that "Establishment = State Funding." If you start with Germany (Tax without Establishment), they may simply invert their bias rather than abandon the spectrum model.
  *   **Minute 15–30: Germany (The Anchor Case).**
      Move to Germany next. This is the complex center of the session.
      *   *Dependency:* Students can only understand the significance of the German "exit ruling" if they have already seen that England has no tax despite establishment. This contrast highlights that revenue collection is a distinct variable from legal recognition.
  *   **Minute 30–40: France (The Exception within the Exception).**
      End the cases with France.
      *   *Dependency:* This must come last because it requires the highest cognitive load: holding the general 1905 statute in mind while processing the Alsace-Moselle exception. It reinforces the lesson that national labels ("France = Secular") mask functional variations.
  *   **Minute 40–50: Synthesis and Closing.**
      Return to the grid. Ask students to compare their checkmarks. This is where you articulate the core idea: that no left-to-right ordering captures these patterns.

  **2. The Anchor Case**

  *   **Selection:** The German exit ruling (2012 Federal Administrative Court).
  *   **Why:** It is the only material provided that features an individual actor (the professor) with a specific motive (faith vs. legal status) taking a concrete action (filing a declaration). This humanizes the abstract function of "registering individual membership."
  *   **What it must contain:**
      *   The professor's specific qualification: leaving the church as a "public-law corporation" but remaining Catholic in faith.
      *   The Court's holding: the qualification is legally inoperative because state law cannot register a split membership.
      *   The mechanism: the federal tax database and the formal declaration of exit.
  *   **What must be stripped out:**
      *   The specific tax rate (8–9 percent).
      *   The role of employers withholding at source (unless asked).
      *   The history of how the database was created.
      *   *Reason:* These details consume time without advancing the core argument about state registration of belief. Keep the focus on the *definition* of membership, not the *cost* of membership.
  *   **Two-case structure?** No. A single anchor is stronger for depth. Use England and France to fill the remaining grid cells (e.g., use England to fill "Appointment" and "Revenue," use France to fill "Recognition").

  **3. The Misconceptions**

  *   **"Church tax means Germany has a state religion."**
      *   *When to head off:* Minute 15, immediately upon introducing Germany.
      *   *How:* Point to the text: "no established church." Force them to reconcile the tax with the lack of establishment.
  *   **"France must be the most separated country because it has an explicit separation statute."**
      *   *When to head off:* Minute 30, upon introducing France.
      *   *How:* Do not let them generalize from the 1905 statute. Immediately pivot to Alsace-Moselle. Ask: "Is the state paying clergy in Alsace?"
  *   **"Establishment entails government control of clergy and therefore makes England the least free."**
      *   *When to head off:* Minute 5, during England.
      *   *How:* **Bracket this.** Do not refute it; declare it out of bounds. Say: "We are not measuring freedom today; we are mapping functions. Note the appointment power, but do not evaluate its liberal democratic quality." This saves ten minutes of normative debate.
  *   **"Membership is a matter of private belief rather than of registration."**
      *   *When to head off:* Minute 20, during the German exit ruling.
      *   *How:* This is the critical moment. Ask: "Did the Court care about the professor's faith?" (No). "What did they care about?" (The database entry). This is where the "registration" function becomes visible.

  **4. Judgment on the Grid**

  *   **Five functions:** Keep all five. First-years can handle five categories if they are printed on a handout and used as a checklist rather than memorized terms. Cutting them risks losing the nuance of the "bundle."
  *   **Load-bearing function:** You are correct; **Registering individual membership** is the load-bearing function.
      *   *Reasoning:* American students view religion as inherently private. They expect the state to ignore belief. The German case shows the state actively cataloging it for revenue purposes. This shocks them out of the "private belief" paradigm more effectively than tax (which looks like money) or appointment (which looks like politics).
      *   *Instruction:* When students struggle to fill the grid, direct them to the German case. Ask: "Where does the state know who belongs to which church?" If they answer "The database," they have grasped the function.

  **5. Closing Check**

  *   **Task:** Present a fourth arrangement ("Country X") and ask them to classify it using the grid, then place it on a spectrum.
  *   **Draft Material for Country X:**
      > "In Country X, the state collects no religious taxes. The state does not appoint any religious leaders. However, every citizen must declare a religious affiliation on their national census, and religious courts have binding authority over family law for all registered members."
  *   **The Question:** "Place Country X on a spectrum from 'Most Separated' to 'Least Separated' compared to France."
  *   **The Discriminator:**
      *   *Memorizer:* Will try to guess based on which country sounds more familiar or liberal.
      *   *Grasper:* Will refuse the spectrum. They should answer: "You cannot place it on a spectrum. Country X has high state involvement in Jurisdiction and Registration, but low involvement in Revenue and Appointment. It overlaps with France on Revenue but exceeds France on Jurisdiction. It is a different bundle, not a different degree."

  **6. Omissions**

  *   **The Sentence:** "Today we will not measure these systems against the U.S. First Amendment, nor trace the theological or historical origins of these exceptions; we are here solely to map the structural functions."
