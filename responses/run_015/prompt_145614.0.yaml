answer: |-
  This is a wonderfully sharp reconstruction, and it is no surprise it is giving your reading group trouble because it isolates a genuine tension in Turing's view of learning machines versus programmed machines. You are right to feel that the conclusion is unacceptable, and you are also right to want to hold onto the first two premises, since they capture the spirit of Turing's argument about initiative and generalization. The step you need to reject is (3). It looks innocent because it seems to merely draw a distinction between the material of instruction and the mental machinery being built, which is exactly what Turing emphasizes when he contrasts filling a machine with data versus shaping its developmental process. However, (3) makes a category error by treating the dispositions education builds as internal structures that can be fully specified without reference to what they are dispositions toward. If education is for reach, as you say in (1), then the value of that reach is determined by where it lands. A disposition to generalize is not a free-floating capacity; it is a disposition to navigate the world correctly. By claiming that content matters only as causal input for building dispositions, (3) severs the link between the training process and the environment those dispositions are meant to engage. You can build a machine that generalizes beautifully within a false system, but you have not built a machine with the disposition of an educated person, because the educated person's disposition is essentially truth-tracking.

  The cost of rejecting (3) is that you must concede that content is not fungible, even if the goal is structural understanding rather than rote memorization. You cannot treat the syllabus as mere exercise weights for the mind, where any heavy lifting will do so long as the muscles grow. You have to admit that the specific propositions taught matter because they are the interface between the student's developing logic and the actual structure of reality. This does not mean you are smuggling truth back in as just one more disposition to be checked off; rather, it means that truth is a condition of the disposition's success. If you teach false content, you are not building the same disposition as teaching true content, because you are building a disposition that will fail when exposed to the world. This preserves your intuition that teaching to the test is wrong, because teaching to the test often builds dispositions that only work within the closed system of the exam, whereas real education builds dispositions that work outside it. By rejecting (3), you maintain that the process of learning requires friction with reality to calibrate the reach, which is exactly what Turing's child-machine needs in the form of punishment and reward based on actual outcomes.

  As for your separate question about whether the false-colour curriculum is even possible, the answer is that it is only possible in a closed system, which defeats the purpose of education as you defined it in (1). Your thought experiment in (5) assumes you can systematically relabel proper names and quantities while keeping inferential relations intact, but this ignores the friction of the environment. If a student learns that water boils at a relabelled temperature, that belief will function perfectly within the textbook problems but will fail the moment they interact with a kettle or a thermometer in a lab. For the curriculum to remain indistinguishable from the inside, you would have to falsify the world itself, not just the textbook, isolating the students from any external feedback that could correct the mapping. But if you isolate them from reality, you are no longer educating them for reach into the world; you are training them for reach into a simulation. In any open system where education is meant to prepare a student for life, the false-colour curriculum would generate prediction errors during the training phase, causing the dispositions formed to differ from those formed by a true curriculum. The students would either become confused by the mismatch or they would learn to distrust their sensory evidence, neither of which constitutes the same educational outcome. So the scenario collapses because the world pushes back, and that pushback is essential to the very process of acquiring reach.
