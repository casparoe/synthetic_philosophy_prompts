answer: |-
  This is a sophisticated position. It avoids the standard luck-egalitarian critique (that merit ignores brute luck) by attacking the *coherence* of merit in specific institutional contexts. You are essentially arguing for a form of **institutional functionalism** regarding desert, bounded by a **political realist** critique of contested ends.

  The vulnerability lies in the boundary work: how you individuate roles, how you determine when an aim is "single," and whether the "contested" category swallows the world.

  Here are eight objections, ranked from potentially fatal to merely awkward, tailored to the specific architecture of your view.

  ### Part 1: The Objections

  **1. The Empty Set Problem (Fatal)**
  *   **The Charge:** There are no roles with a "single, relatively uncontested aim." Even the commercial pilot has competing aims: safety, fuel efficiency, schedule adherence, passenger comfort, corporate loyalty. In a crisis, these trade off. If "single aim" means "lexically ordered single aim," no such roles exist. If it means "dominant aim," then *all* roles qualify, including the police and universities, dissolving your divide.
  *   **Concession/Dismissal:** You must **concede** that the "Single Aim" category is an idealization. If you insist it's literal, your positive claim (that genuine meritocracy exists) is empirically false. If you treat it as a heuristic, the divide becomes a spectrum, and your strong claim ("don't admit genuine meritocratic justification") softens into "admit less."
  *   **Verdict:** Fatal to the binary structure. Forces a scalar revision.

  **2. The Normative Anchor Problem (Fatal)**
  *   **The Charge:** Your view defines merit *internally* (fitness for aim). But constitutive aims can be evil or unjust (e.g., a hitman, a segregationist admissions officer). On your view, the "best" segregationist is the most meritorious. This severs the link between merit and moral justification. You can say "they have merit but it's unjust," but then "merit" loses its normative force in selection. Why should we care about merit if it's just efficiency toward potentially vile ends?
  *   **Concession/Dismissal:** You will likely **dismiss** this as category confusion. You are analyzing the *concept* of merit, not the *justice* of the institution. However, this renders your view descriptively thin. If merit doesn't track *reasons to hire*, it's just a technical metric, not a political justification.
  *   **Verdict:** Fatal to the normative utility of the view. It risks making "merit" morally inert.

  **3. The Aim-Drift Self-Undermining (Fatal)**
  *   **The Charge:** You use Aim-Drift to attack contested roles (selection changes the aim, so counterfactuals are undefined). But this applies to "single aim" roles too. Hiring a pilot changes the culture of the airline, which changes the safety protocols, which changes what "piloting" is. If Aim-Drift is a conceptual truth about social roles, it undermines the "Single Aim" category entirely. You cannot have it both ways: either counterfactuals are impossible everywhere, or they are possible enough for your "single aim" cases.
  *   **Concession/Dismissal:** You must **concede** that Aim-Drift is a matter of degree. You need a threshold for "significant drift." But once you admit degrees, the hard divide collapses.
  *   **Verdict:** Fatal to the consistency of the two categories.

  **4. The Individuation Problem (Severe)**
  *   **The Charge:** Whether a role has a contested aim depends on how finely you slice the "role." Is the role "Police Officer" (contested: order vs. justice vs. service) or "SWAT Sniper" (single: neutralize threat)? Your view allows you to gerrymander the role description to get the result you want. You can make any contested role look meritocratic by narrowing the aim, or any meritocratic role look contested by widening the context.
  *   **Concession/Dismissal:** You will **dismiss** this as a standard hermeneutic problem applicable to all institutional analysis. However, without a principled way to individuate roles *prior* to assessing merit, the theory is manipulable.
  *   **Verdict:** Severe. Threatens predictive power.

  **5. The Collapse into Fair Equality of Opportunity (Awkward)**
  *   **The Charge:** In "contested aim" roles, if merit is off the table, what replaces it? If you say "procedural fairness" or "lottery among the qualified," you have effectively collapsed into a version of Rawlsian Fair Equality of Opportunity (FEO) or qualified-lottery proceduralism. You haven't offered a new theory of merit; you've offered a theory of *when to abandon merit*.
  *   **Concession/Dismissal:** You might **concede** this but argue it's a feature, not a bug. Your contribution is the *diagnosis* of when FEO applies vs. when strict merit applies.
  *   **Verdict:** Awkward. Reduces the novelty of the positive claim.

  **6. The "Competence vs. Excellence" Conflation (Awkward)**
  *   **The Charge:** In contested roles (e.g., Supreme Court), we often agree on *minimum competence* (know the law, no dementia) even if we disagree on *excellence* (originalism vs. living constitution). Your view treats "merit" as a monolithic block. By ruling out "the best qualified," you might inadvertently rule out "the minimally qualified," leading to absurd selection processes in contested fields.
  *   **Concession/Dismissal:** You will **dismiss** this by distinguishing threshold constraints from meritocratic ranking. But this requires adding a hybrid layer to your theory (thresholds for all, merit-ranking only for single-aim).
  *   **Verdict:** Awkward. Complicates the binary.

  **7. The Ratchet's Empirical Vulnerability (Awkward)**
  *   **The Charge:** The Ratchet claims criteria drift to match current winners. But history shows criteria sometimes change *ahead* of demographics (e.g., civil service exams introduced to *exclude* immigrants, then later opened). If criteria can be weaponized *against* current winners or changed by external fiat, the Ratchet isn't a law-like mechanism. It's a tendency.
  *   **Concession/Dismissal:** You will **dismiss** this as noise. The Ratchet is a systemic bias, not a physical law.
  *   **Verdict:** Merely awkward. Weakens the sociological claim but not the philosophical core.

  **8. The "Best Available Specification" Defense (Awkward)**
  *   **The Charge:** Even if aims are contested, isn't a *provisional* specification better than none? If a university picks a specific mission statement (e.g., "research output"), isn't it legitimate to hire for that, even if the mission is debatable? Your view implies we shouldn't hire on merit until the aims are settled. But aims are *never* fully settled. This leads to paralysis.
  *   **Concession/Dismissal:** You will **concede** that we must act, but insist we acknowledge the political nature of the choice. The "awkwardness" is that your view becomes a demand for transparency rather than a guide for selection.
  *   **Verdict:** Awkward. Turns the theory into a disclosure requirement.

  ---

  ### Part 2: The Bolt-Ons

  **Are they load-bearing?**
  *   **Aim-Drift:** **Yes.** This is the philosophical engine. Without Aim-Drift, a critic can say: "Just define the aim better and predict better." Aim-Drift says the counterfactual is *ontologically* unstable. It prevents the "Single Aim" rescue mission for contested roles.
  *   **The Ratchet:** **No.** This is empirical scaffolding. It explains *why* the current criteria are suspect, but the core philosophical claim (that contested aims invalidate merit) stands without it.
  *   **Dropping the Ratchet:** If you drop the Ratchet, you lose the explanation for *why* the criteria are biased, but you keep the claim that they are *conceptually* illegitimate. Dropping it saves the view from empirical falsification (e.g., if criteria change without demographic shifts), but it weakens the critical punch. It makes the view purely conceptual rather than socio-historical.

  **Recommendation:** Keep Aim-Drift as the core philosophical move. Treat the Ratchet as a contingent empirical observation that usually accompanies Aim-Drift, not a necessary condition.

  ---

  ### Part 3: Unfalsifiability Check

  **Has "Essentially Contested Aims" made the view unfalsifiable?**
  Yes, structurally. If every time merit selection works, you classify the role as "Single Aim," and every time it fails or seems ideological, you classify it as "Contested Aim," the theory is circular.

  **Is this a problem?**
  For a normative theory, **not necessarily**, provided the classification criteria are independent of the outcome.
  *   **The Fix:** You must specify *independently* how to identify a contested aim (e.g., persistent reasonable disagreement in the public sphere, lack of lexical ordering of values) *before* assessing the selection process.
  *   **The Risk:** If the "Single Aim" category ends up empty (see Objection 1), the theory becomes a purely negative critique of meritocracy. This is a coherent position (error theory about merit), but it contradicts your intuition that pilots/bomb-techs admit genuine meritocratic justification.
  *   **Verdict:** It is a real problem if you cannot point to a clear case of a Single Aim role that *isn't* just a stipulation. If you can't, you are a merit-skeptic, not a merit-reformer.

  ---

  ### Part 4: The Three Cases

  **1. Military Officer Selection**
  *   **The Tension:** Intuition says merit is vital (lives depend on it). Your view says aims are contested (warfighting vs. diplomacy vs. political loyalty).
  *   **The Bullet:** You must bite the bullet that **strategic** officer selection is *not* meritocratic in the strong sense. You can have meritocratic *tactical* selection (can they navigate?), but *strategic* selection (who leads the war?) is political.
  *   **The Trap:** If you claim "winning wars" is a single aim, you ignore that "winning" is defined politically.
  *   **Resolution:** Distinguish *technical competence* (single aim) from *command authority* (contested aim). Your view holds if you admit that promoting Generals is a political act disguised as meritocracy. This is a strong, if unpopular, claim.

  **2. Organ Allocation**
  *   **The Tension:** Aim looks single (save lives/maximize QALYs). But we use queues/age.
  *   **The Challenge:** Is this a counterexample to your divide?
  *   **Your Move:** Argue the constitutive aim of an *allocation system* is not "Maximize Health" but "Justly Distribute Scarce Resources." The aim *includes* the fairness constraints. Therefore, it is a Single Aim role (serve the allocation protocol), but the protocol itself embodies contested values.
  *   **Risk:** This makes the "Single Aim" definition so capacious it includes everything. If the aim is "Follow the Rules," then *every* role is Single Aim.
  *   **Better Move:** Admit this is a **Hybrid**. The medical criteria are single-aim (tissue match); the allocation criteria are contested (urgency vs. utility). Your view predicts friction here. The friction *is* the evidence of contestation.

  **3. Blind Orchestral Auditions**
  *   **The Tension:** Tightening criteria (blind screens) changed demographics (more women).
  *   **Your Claim:** Evidence for the Ratchet (old criteria favored men's traits).
  *   **The Counter:** Evidence for the **Divide**. Blind auditions moved the role *closer* to a Single Aim (sound quality) by removing Contested Aims (gender performance, visual presence).
  *   **Verdict:** This case actually **supports** your view better than the Ratchet alone. It shows that when you strip away contested social markers and focus on the constitutive aim (sound), the "merit" outcome changes. It suggests the previous "merit" was indeed smuggling in contested social aims.
  *   **Vulnerability:** If sound quality itself is culturally contingent (what counts as "good" tone?), Aim-Drift kicks in. But this is a deeper skepticism you might not want to endorse.

  ---

  ### Part 5: Empirical Discriminators (How to break this in seminar)

  You asked for empirical findings that would discriminate. Here are two that would hurt your view specifically:

  1.  **The "Cross-Aim Prediction" Test:**
      *   *Setup:* Identify a role with contested aims (e.g., University Professor). Define two rival specifications of the aim (e.g., "Research Output" vs. "Teaching/Mentorship").
      *   *Discriminator:* If candidates selected under Specification A consistently perform *well* under Specification B (high correlation), then the "Contested Aim" objection weakens. It suggests there is a underlying "general competence" that serves multiple specifications, rehabilitating a form of meritocracy even in contested fields.
      *   *Your Defense:* Aim-Drift. They perform well because the institution drifts to match the selected candidates.

  2.  **The "Lottery Degradation" Test:**
      *   *Setup:* In a contested-aim role (e.g., City Council or Hospital Board), compare Merit-Selection vs. Qualified Lottery (among those meeting a competence threshold).
      *   *Discriminator:* If the Lottery group reliably produces *worse* outcomes on *all* plausible specifications of the aim (e.g., both efficiency AND representation suffer), then "Merit" retains normative force even in contested fields. It suggests that while the *ranking* is contested, the *filtering* is meritocratic.
      *   *Your Defense:* You must argue that "worse outcomes" is measured by a contested metric. If the Lottery produces a different *kind* of outcome that one faction prefers, your view holds.

  ### Summary Advice for the Seminar

  Your view is strongest as a **critique of ideological naturalization** (showing how contested political choices are disguised as technical merit). It is weakest as a **guide for selection** (because it leaves you with no decision procedure for contested roles other than "admit it's political").

  *   **Don't defend the Ratchet too hard;** it's empirical and fragile.
  *   **Lean into Aim-Drift;** it's the philosophical heavy lifter.
  *   **Accept the "Empty Set" risk:** Be willing to say that *almost no* high-stakes social roles are truly meritocratic in the strong sense. That is a radical, defensible position.
  *   **Watch the Individuation:** Your opponents will try to slice roles finely to find "single aims." You must argue that the *social function* of the role determines the aim, not the job description.

  This view is a form of **Political Realism about Merit**. Treat it as such. It doesn't solve the problem of selection; it exposes the politics inherent in it. That is a valuable, if uncomfortable, contribution.
