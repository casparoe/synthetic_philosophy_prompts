      *   *Norman Malcolm:* Wrote "Dreaming" (1959). His argument is conceptual/linguistic, not empirical. He argues that the concept of "experience" implies the possibility of verification, which is absent in sleep. He doesn't claim dreams *don't happen* in a scientific sense, but that the language game of "having an experience" doesn't apply. He is often criticized for being too verificationist.
