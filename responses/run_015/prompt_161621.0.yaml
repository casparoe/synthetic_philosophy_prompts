  **PromiseSwap Liquidity Pool Goes Live: Monetizing Interpersonal Obligation at Scale**
  *By FinCompliance Daily Staff*

  **SAN FRANCISCO** — PromiseSwap, the interpersonal liability marketplace founded by serial disruptor Gavin Ledger, officially exited beta yesterday, offering a frictionless solution to the latency problems inherent in traditional vow-based contracting. The platform addresses a key bottleneck in social coordination: the fact that promissory obligations are historically "sticky," binding the promisor to a specific performance regardless of changing market conditions.

  "We realized that the biggest inefficiency in promising wasn't the act itself, but the directedness of the obligation," Ledger told *FinCompliance Daily* at the launch event. "Under legacy social protocols, only the promisee can release the promisor. That creates a single point of failure. PromiseSwap decentralizes that authority."

  The core product allows users to log a promise into the app. PromiseSwap's algorithm then matches the obligation to a vetted "surrogate performer" who executes the task. Upon completion, the promisee receives a notification and a micro-denominated "Fidelity Credit," while the platform's terms of service deem the original promisor discharged. Early user testimonials highlight the efficiency gains. "I promised my daughter I'd attend her recital," said beta tester Mark D. "PromiseSwap sent a surrogate who clapped louder than I would have. My daughter got the performance, I got my evening back, and the obligation was settled."

  However, the real innovation lies in PromiseSwap's secondary market: "Release Futures." Recognizing that the right to release is the promisee's exclusive property, PromiseSwap allows users to sell this right in advance via "pre-consent bundles." Promisors can purchase these bundles to secure an exit clause before making a promise, effectively buying the promisee's standing to complain.

  Critics argue this undermines the institution of promising itself. Prof. Julian Contract of the Institute for Social Cohesion warns that if promisees sell their standing to release beforehand, there is no one left to whom the promise is directed. "If everyone sells their right to hold others accountable, the convention collapses," Contract said. "You can't have a promise without a person who owns the obligation."

  Ledger dismisses this as nostalgia. "We're not dismantling the convention; we're optimizing its maintenance," he said, pointing to the platform's mandatory 2% "Convention Maintenance Fee" on all transactions. "Someone has to pay for the social trust infrastructure. We're just making it liquid."

  Regulators seem satisfied with the compliance framework. Marcus Audit, head of the Bureau of Interpersonal Settlements, noted that as long as the surrogate performance removes the harm, the wrongful nature of breaking a promise is negligible. "It's a settlement issue," Audit said. "If the promisee is compensated, the duty is extinguished."

  PromiseSwap currently excludes categories where performance is non-transferable (e.g., "feeling love," "being present") or illegal. Notably, the terms of service also exclude promises to do what the promisor was already going to do, citing pricing indeterminacy.

  ***

  **SIDEBAR: Excluded Categories & Pricing Tiers**

  | **Category** | **Status** | **Reasoning** |
  | :--- | :--- | :--- |
  | **Surrogate Performance** | ✅ Enabled | Task completion verified via GPS. |
  | **Pre-Consent Release** | ✅ Enabled | Sold as NFT-backed bundles. |
  | **Emotional States** | ❌ Blocked | Non-verifiable internal state. |
  | **Illegal Acts** | ❌ Blocked | Regulatory compliance. |
  | **Status Quo Actions** | ❌ Blocked | Cannot price "what I'd do anyway." |
  | **Convention Fee** | 💰 2% | Covers social trust overhead. |

  ***

  **Author's Note**

  I wrote this from a **Convention-Based (Humean)** account of promising. The satire relies on the idea that promising is an artificial social device we maintain because it's mutually useful, not because of metaphysical magic. The exaggeration lies in treating this convention as a piece of legacy infrastructure that can be "optimized" via market mechanisms. I leaned hardest on the tension between the *utility* of the convention and the *motivation* required to sustain it. If everyone sells their right to hold others accountable (the pre-consent bundles), the convention loses its force because the expectation of fidelity vanishes. The joke costs me the nuance of the "Normative Power" view, which might argue the promisor *creates* the obligation regardless of utility. Here, I assume the obligation exists only so long as the social practice holds, making the "Convention Maintenance Fee" the ultimate irony: charging users to preserve a system the product itself renders obsolete.
