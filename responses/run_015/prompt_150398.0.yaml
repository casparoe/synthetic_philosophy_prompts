      *   Premise 2 says: "my own threshold for what counts as clinically significant distress moves." This implies the *criteria application* changes, not just the population.
      *   So the *concept* drifts.
      *   Okay, back to Premise 1.
      *   "A predicate F licenses expectations... only if... features... are not themselves altered."
      *   This is the Humean/Goodman problem. Projectibility.
      *   If the features alter, can we still license expectations?
      *   Yes, if the alteration is predictable.
      *   So Premise 1 is false. It claims *immunity* is required. *Predictability* is sufficient.
      *   This is the break.

  4.  **Drafting the Response:**
      *   **Identify the Break:** Premise (1). Specifically, the "only if" condition regarding alteration.
      *   **Explain Why It Looked Sound:** It captures the intuition of "Natural Kinds" (Hacking, Boyd). It distinguishes between things that *are* and things that *react*. It feels necessary for scientific realism.
      *   **Explain Why It Fails:** It conflates *ontological stability* with *inductive reliability*. Induction works on dynamic systems (meteorology, economics) where the variables react to measurement/prediction. Robustness should be defined as *manageable variance*, not *zero variance*.
      *   **Cost of Rejecting (1):** You lose the sharp ontological distinction between human/natural kinds. You must replace it with a pragmatic distinction (degrees of stability/reflexivity). You can no longer say "Human kinds are fundamentally different," only "Human kinds are *more* reactive."
      *   **Cost of Rejecting (2):** Denies empirical evidence (Hacking). Bad move.
