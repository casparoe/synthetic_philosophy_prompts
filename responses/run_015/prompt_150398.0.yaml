      *   So the break is the definition in **Premise 1**. It defines robustness as *absolute* stability. Induction only needs *relative* stability.

      *   *Let's check the User's constraints again.* "I would prefer not to give up (1)... but I would rather give up (1) than keep a valid argument to a false conclusion."
