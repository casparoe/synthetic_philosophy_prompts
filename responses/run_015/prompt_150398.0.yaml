      *   *Re-evaluating Premise 3:* "There is no description... guaranteed in advance to sit outside the loop."
      *   This is likely true.
      *   "Coming to know it changes how some people seek, produce, simulate, suppress, or display it."
      *   This is likely true.
      *   Does this entail "No kind of person is inferentially robust" (4)?
      *   Only if "Inferentially Robust" (from 1) means "Immune to *any* change."
