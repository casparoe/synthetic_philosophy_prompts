      *   **Task:** Write a polished, formal essay addressing a specific controversy regarding Rousseau.
      *   **Controversy:** Rousseau condemns theatre (in *Letter to d'Alembert*) but champions public festivals. Critics say this is incoherent because both involve performance/representation.
