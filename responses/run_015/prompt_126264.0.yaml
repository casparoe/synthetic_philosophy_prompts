  The failure occurs decisively at step (3). This premise asserts that common knowledge of a rule's arbitrariness dissolves its status as a Schelling point. This seems plausible because we intuitively feel norms require "weight" beyond mere convention to command obedience; we want rules to be real, not just selected. However, this commits a modal slide regarding stability. It conflates "arbitrary in principle" (another equilibrium was possible ex ante) with "unstable in practice" (the current equilibrium is fragile ex post). In game-theoretic terms, a Schelling point relies precisely on common knowledge to function. If everyone knows the rule is arbitrary but also knows everyone else knows it, the rule becomes *more* robust, not less. The coordination holds because I follow the rule because I know you follow it, not because I believe the rule is metaphysically unique. Step (3) falsely assumes transparency destroys salience, whereas transparency often generates the common knowledge required for the equilibrium to persist. The error is treating the *justification* for the rule as a prerequisite for its *function*, ignoring that the function relies on mutual expectations, not ontological status. Knowing the traffic side is arbitrary doesn't make me drive on the left; knowing *you* know it's arbitrary makes me drive on the right.

  ### Pricing the alternatives

  If you reject (3), you avoid the authoritarian dilemma. The cost is accepting a deflationary view of normativity: rules bind us only because we expect others to follow them, not because they are inherently right. This doesn't require mysterious non-conventional sources; it just requires recognizing convention as a sufficient source of authority. Rejecting (4) or (5) instead forces you to accept epistemic authoritarianism—that social order requires manufactured ignorance. For a rationalist, this is prohibitively expensive; it implies truth is socially destabilizing. Rejecting (5) while keeping (3) implies rational endorsement is impossible, forcing a split between elite knowledge and public myth. Some might argue rejecting (3) commits us to "opaque rationality," but the opposite is true. It commits us to transparent conventionality. We acknowledge the rule is arbitrary but follow it because the coordination benefit outweighs the arbitrariness cost. The only real cost is psychological discomfort: admitting that many sacred norms are merely traffic laws for social interaction. You lose the comfort of believing your culture is "correct," but you gain a stable framework that doesn't require lying to citizens to function. Rejecting (2) is another option, but that denies the game-theoretic insight entirely, leaving you with no explanation for why arbitrary rules persist at all. Sticking with (2) and rejecting (3) preserves the mechanistic explanation without the political poison. You must accept that "because we agreed" is a complete sentence in normative ethics. This view aligns with Lewisian convention theory, where the arbitrariness is a feature, not a bug. The cost is purely aesthetic: you cannot claim your norms are discovered truths.

  ### Verdict and trade-offs

  Reject (3). You can keep both (2) and (8) intact. Tight cultures persist not because citizens are ignorant of arbitrariness, but because the cost of deviating from a known focal point is high even when everyone knows it's arbitrary. The cheapest consistent package is a conventionalist account of normativity. The trade-off is accepting that social stability is contingent on mutual expectations rather than objective truth. You are buying a society where rules are respected because they are *ours*, not because they are *True*. This avoids authoritarianism without collapsing into loose calculative chaos. The stability comes from the network effect of compliance, which remains robust under full transparency. The argument's tension dissolves once you realize that common knowledge of convention is the glue, not the solvent. You retain the rationalist commitment to transparency while acknowledging that coordination often requires submitting to arbitrary focal points.
