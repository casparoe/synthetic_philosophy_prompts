answer: |-
  **Examiner's Design Note: The Analytical Crux**
  The pivotal distinction lies between *phenomenal uniformity* and *axiological commensurability*. A student merely reciting Mill knows that pleasures differ in quality. A student grasping the heterogeneity problem understands that if pleasures lack a shared phenomenal core (a "thin" feeling of pleasantness), hedonism cannot sum them into a single metric of well-being. The trap is conflating *intensity* (magnitude of feeling) with *quality* (type of feeling). The A-grade response must show that if the "thin core" is stripped of specific content to accommodate heterogeneity, it becomes normatively inert—it explains nothing about *why* we pursue these disparate states other than labeling them "pleasure."

  ***

  **PhD Comprehensive Examination: Ethics and Value Theory**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**
  Hedonism asserts that pleasure is the sole intrinsic good. However, the phenomenology of pleasure appears radically heterogeneous: the sensation of quenching thirst differs vastly from the satisfaction of solving a proof or the enjoyment of a symphony. Evaluate the viability of hedonism in light of this heterogeneity by analyzing the conflict between the **thin-core qualitative defense** and the **disjunctive phenomenology objection**.

  In your response, you must:
  1.  Articulate why the absence of a common phenomenal quality threatens hedonism's ambition to supply a unified measure of well-being.
  2.  Defend the thin-core view by rigorously distinguishing phenomenal quality from phenomenal intensity, OR attack it by demonstrating that the alleged common core is either descriptively empty or normatively inert as an axiological currency.
  3.  Explain why resolving this dispute is necessary for maintaining hedonism as a monistic theory of value.

  ***

  **Model Answer**

  The heterogeneity problem strikes at the mathematical coherence of hedonism. If hedonism is to function as a monistic axiology, it must posit a common denominator—a single currency of value—against which all choices can be measured. If pleasures are phenomenologically disparate, like sounds versus smells, they lack the commensurability required for summation. Without a shared unit, one cannot calculate "total well-being," rendering the hedonistic calculus impossible.

  The thin-core qualitative defense attempts to salvage this unity. It posits that despite surface differences, all pleasures share a minimal, non-natural phenomenal quality of "pleasantness." This is not a specific sensation like warmth or sweetness, but a hedonic tone that permeates diverse experiences. On this view, solving a theorem and eating a meal differ in object and context, but share this underlying glow of positive affect. This allows the hedonist to maintain that value resides in the feeling itself, not the external object.

  However, the disjunctive phenomenology objection challenges the existence of this core. It argues that bodily satisfaction, intellectual discovery, and aesthetic absorption share no common felt quality. They are grouped only by a functional role: they are states being pursued, endorsed, or desired. The objection suggests that "pleasure" is a label we apply to disparate positive experiences, not a distinct ingredient within them. If this is true, the thin-core is descriptively empty; introspection reveals only the specific qualities of the activity, not a separate "pleasantness" glue.

  To defend the thin-core view, one must rigorously distinguish phenomenal quality from phenomenal intensity. The hedonist can concede that the *specific* quality varies (the taste of wine vs. the thrill of victory) but insist that the *hedonic tone* is uniform. Crucially, this tone must be separable from intensity. Intensity refers to the magnitude of the feeling, while quality refers to its positive valence. If the thin-core defender can show that this valence is a consistent phenomenal feature across all instances, commensurability is preserved.

  Yet, even if a common feeling exists, the normative inertness worry remains. Suppose there is a common phenomenal glow. Does this glow constitute the value, or is it merely a byproduct of achieving something valuable? If the value lies in the object (the proof, the music), then the feeling is normatively inert—it tracks value but does not constitute it. For hedonism to succeed, the feeling itself must be the currency. If the thin-core is so abstract that it applies to everything we desire, it fails to explain *why* we desire them. It reduces to the claim that "what we desire is what we desire," offering no independent axiological standard.

  Therefore, the dispute matters fundamentally for hedonism's monistic ambition. If the disjunctive objection holds, pleasure is not a single natural kind but a functional category. Hedonism would then collapse into a pluralistic theory where different kinds of satisfaction contribute to well-being in incommensurable ways. To remain a unified measure, hedonism must prove that the thin-core quality is both phenomenologically real and axiologically potent. Without this, the theory loses its defining promise: a single, scalable metric for the good life.

  ***

  **Marking Scheme**

  **1. The Commensurability Requirement (4 Marks)**
  *   **Criteria:** Clearly explains that heterogeneity threatens the ability to sum pleasures into a single metric of well-being. Identifies that without a common denominator, the hedonistic calculus fails.
  *   **Typical Error:** States that pleasures are different but fails to explain why this prevents *measurement* or *summation*.

  **2. Exposition of Thin-Core Defense (4 Marks)**
  *   **Criteria:** Accurately describes the claim that all pleasures share a minimal, non-natural phenomenal quality ("hedonic tone") distinct from the object of the pleasure.
  *   **Typical Error:** Confuses the thin-core with Mill's "higher/lower" distinction or treats it as a specific sensation (e.g., warmth).

  **3. Exposition of Disjunctive Objection (4 Marks)**
  *   **Criteria:** Articulates the claim that pleasures share no felt quality and are grouped only by functional role (being pursued/endorsed). Notes the charge that the core is descriptively empty.
  *   **Typical Error:** Treats the objection merely as "pleasures are different" without invoking the functional-role argument.

  **4. Quality vs. Intensity Distinction (4 Marks)**
  *   **Criteria:** Rigorously distinguishes phenomenal quality (valence/type) from phenomenal intensity (magnitude). Uses this to attempt a defense or to show why the defense fails (normative inertness).
  *   **Typical Error:** Collapses quality into intensity (e.g., claiming stronger pleasures are just "more pleasant" without addressing the qualitative difference).

  **5. Normative Inertness and Monism (4 Marks)**
  *   **Criteria:** Explains why the dispute matters for hedonism's ambition. Addresses whether the feeling constitutes value or merely tracks it. Concludes on the viability of hedonism as a unified measure.
  *   **Typical Error:** Fails to connect the phenomenological debate back to the structural viability of hedonism as a monistic theory.

  **Grade Boundaries**
  *   **A (17–20 Marks):** All five moves executed with precision. Explicitly handles the quality/intensity distinction and the normative-inertness worry. Demonstrates why the functional-role reply is not automatically decisive without further argument.
  *   **B (13–16 Marks):** Three or four moves present. May treat the functional-role reply as decisive without engaging the thin-core counter-argument, or collapses the distinction between quality and intensity.
  *   **C (9–12 Marks):** Recites standard labels (Mill vs. Bentham) without engaging the specific "thin-core" framing. Fails to address the measurement problem.
  *   **D (0–8 Marks):** Fundamental misunderstanding of hedonism or the heterogeneity problem.
