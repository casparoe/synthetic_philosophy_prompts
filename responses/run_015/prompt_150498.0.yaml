answer: |-
  You construct a phantom and mistake it for a mirror, for the Necessary Existent does not bestow *wujūd* upon two things that are identical in every respect. Existence itself is what distinguishes them. When you speak of these two suspended souls, you imagine them as copies of a single *māhiyya*, but the soul is not a universal like 'humanity' that is shared; it is a *shakhṣ*, a particular substance. Even if their thoughts mirror one another, the *anniyya* of this one is not the *anniyya* of that one, because existence is not a common garment they wear but the very reality of each. The body may be the occasion for the soul's origin, fixing it to a specific place and time, but once the *nafs* emerges as an intellectual substance, its individuation belongs to its own act of being, not merely to the matter it leaves behind.

  As for sleep and grief, you confuse the presence of the self to itself with the attention of the faculty. The soul is always present to itself, for it is its own substance, but sometimes it turns its face away toward the images of the *wahm* or the data of the senses. When you sleep, you do not cease to be; you cease to attend to what you are, distracted by the dominion of the bodily humors. So the flying man does not prove the soul is a universal nature, but that the *anniyya* is grasped without the instrument of the limb. The 'I' is not a description that could fit two; it is the sheer pointing of existence to itself, and that pointing is unique to each soul because each soul's existence is its own, never shared, never dissolved when the clay returns to the earth.
