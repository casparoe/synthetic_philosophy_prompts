  ### The Best Guess

  **Marisol will call for Shame in the boat, and Guilt at the Naming.**

  **The Reason:**
  The **Containment Rule** is the only one that fully explains *The Wall* without contradicting *Sous Vide*. Both are public. In *Sous Vide*, the public exposure creates Shame because the chef is left alone with her reputation. In *The Wall*, the public exposure creates Guilt because the community actively participates in neutralizing the social consequence ("nobody says a word," "standing exactly what it was").

  Marisol's note on *The Wall* ("obviously, that's the point of the wall") confirms that the ritual *engineers* the emotion. The Wall exists to convert Shame into Guilt.

  Anet in the boat is in *Sous Vide* territory: alone with a damaging truth.
  Anet at the Naming is in *The Wall* territory: using a cultural machine to process that truth.

  **The Closest Analog:**
  **The Wall.**
  Both involve a breach of trust (stealing from the store / lying about safety) managed by a specific ritual where the community acknowledges the fault but refuses to exile the person. The Naming is simply *The Wall* verbalized.

  **The Single Change to Flip the Verdict:**
  If Anet **lies at the Naming.**
  If she stands up and says she is "worst at patience" or something trivial, while knowing the truth is that she is a fraud, she opts out of the ritual's containment. She becomes the *Balcony* lifeguard: trying to manage the shame secretly while the public ritual passes her by. That creates **Shame** at the Naming.
  *Alternatively:* If the community **reacts** at the Naming. The rule is "nobody responds." If someone gasps, or whispers, the containment fails. The ritual breaks. The verdict flips to **Shame**.

