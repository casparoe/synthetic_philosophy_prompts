  Here is the breakdown of Marisol's rules, the predictions for Anet, and the answer to your thematic question.

  ### The Three Rules

  Based on the five precedents and the marginalia, here are the three distinct operating systems that fit the data. They differ in *why* they assign the emotion, which leads to different predictions for Anet.

  **1. The Identity Rule (Action vs. Self)**
  *   **The Logic:** Guilt is about what you *did* (a violation of code). Shame is about who you *are* (a revelation of nature). This aligns with the marginalia: *"Shame is the only one telling the truth about a person."*
  *   **The Precedents:**
      *   *Ledger:* He did a bad thing (falsified), but he is a good man (repaid). -> **Guilt**.
      *   *Sous Vide/Balcony:* The acts revealed a character flaw (abusive, vindictive) that money couldn't fix. -> **Shame**.
      *   *Nightshift:* No moral choice made. -> **Neither**.
      *   *The Wall:* Stealing is an act. The ritual separates the act from the man. -> **Guilt**.
  *   **Prediction for Anet:**
      *   **In the Boat:** She realizes her *identity* is a lie. She isn't an Ice-reader. -> **Shame**.
      *   **At the Naming:** She admits what she is "worst at." If she says "Reading Ice," she admits a fundamental identity fraud. The ritual cannot fix "I am a fake." -> **Shame**.

  **2. The Repairability Rule (Transaction vs. Stain)**
  *   **The Logic:** Guilt is a debt that can be paid (marginalia: *"Guilt is the one you can do something with"*). Shame is a stain that remains even after payment.
  *   **The Precedents:**
      *   *Ledger:* Debt repaid, firm made whole. -> **Guilt**.
      *   *Sous Vide:* Money paid, but the clip remains online. The damage is permanent. -> **Shame**.
      *   *Balcony:* Lessons funded, but the motive (guilt/vindictiveness) is hidden and festering. -> **Shame**.
      *   *The Wall:* The ritual "pays" the social debt. The internal debt remains manageable. -> **Guilt**.
  *   **Prediction for Anet:**
      *   **In the Boat:** She cannot undo the years of luck. The risk is ongoing. -> **Shame**.
      *   **At the Naming:** Speaking the truth is the "payment." If the standing is unchanged, the debt is cleared. -> **Guilt**.

  **3. The Containment Rule (Integration vs. Exposure)**
  *   **The Logic:** This is the strongest fit for *The Wall*. Guilt is what you feel when a community *contains* your failure and reintegrates you. Shame is what you feel when you are *exposed* without a vessel to hold the consequence. It doesn't matter if it's public or private; it matters if the community absorbs the blow.
  *   **The Precedents:**
      *   *Ledger:* The firm "buried it." They absorbed the shock. -> **Guilt**.
      *   *Sous Vide/Balcony:* The public saw it, but there was no ritual to process it. Just judgment. -> **Shame**.
      *   *The Wall:* The public sees it, but the ritual *neutralizes* the judgment. -> **Guilt**.
      *   *Nightshift:* No moral failure to contain. -> **Neither**.
  *   **Prediction for Anet:**
      *   **In the Boat:** She is alone. No community to absorb the truth. -> **Shame**.
