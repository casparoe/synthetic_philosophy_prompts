answer: |-
  ### Brainstorming Candidate Framings

  1.  **The "Control Variable" Model:** Treat the Greek/Roman pair as a scientific experiment where culture/circumstance is the variable and character is the constant (or vice versa). *Promising:* Aligns perfectly with your "sorting" intuition and modern causal reasoning. *Risk:* Can sound anachronistically positivist if not careful about ancient notions of causality.
  2.  **Cognitive Scaffolding:** Frame the *synkrisis* (comparison) as a cognitive tool that offloads the mental work of moral discrimination onto the text's structure. *Promising:* Bridges textual form and moral psychology neatly. *Risk:* Might drift into pure narratology and lose the ethical stakes.
  3.  **Virtue Epistemology:** Focus on how we *know* virtue. The single life offers opinion; the pair offers knowledge through elimination. *Promising:* Philosophically robust. *Risk:* Too abstract for a one-year empirical/textual project; risks becoming a philosophy paper rather than a classics/interdisciplinary one.
  4.  **The Anti-Hagiography Argument:** Define the *Lives* negatively against saint's lives. Hagiography hides contingency; Plutarch exposes it via contrast. *Promising:* Strong hook for character education folks tired of "hero worship." *Risk:* Defines the project by what it isn't, rather than the positive mechanism of the pairing.
  5.  **Reader-Response Ethics:** Focus on what the *reader* does during the comparison. The moral work happens in the gap between the two scrolls. *Promising:* Centers the "skill" acquisition you mentioned. *Risk:* Hard to evidence textually; relies on hypothetical ancient readers.
  6.  **The Retrospective Objection:** Focus entirely on the "biographer's privilege" and whether the pairing mitigates hindsight bias. *Promising:* Philosophically juicy. *Risk:* As you suspected, this might be a separate book. It undermines the positive claim that the text *teaches* anything usable.

  **Selection:** I would pick **#1 (The Control Variable Model)** but infuse it with **#2 (Cognitive Scaffolding)**. This gives you a precise mechanical claim (the pairing isolates variables) that explains the pedagogical function (it trains a specific cognitive skill). It avoids the trap of the "Retrospective Objection" by treating the text as a simulation space rather than a historical record. It is the most defensible position for a one-year timeline.

  ***

  ### Fellowship Proposal: The Synkrisis as Moral Technology

  **Project Title:** Isolating Character: The *Synkrisis* as a Cognitive Tool in Plutarch's *Parallel Lives*

  **Research Question**
  Does the formal pairing structure of Plutarch's *Parallel Lives* function as a deliberate mechanism for isolating *ēthos* (character) from *tychē* (fortune/circumstance), thereby training the reader in moral discrimination rather than simple imitation?

  **The Problem with the Standard Debate**
  Current scholarship on moral learning from biography is stuck in a binary. Exemplarists argue we learn virtue by emulating admirable agents; skeptics (often drawing on situationist psychology) argue that biographies distort reality, airbrush failure, and teach deference to status rather than virtue. Both sides assume the *single life* is the unit of instruction. This project argues that both sides are analyzing the wrong object. In the *Parallel Lives*, the unit of instruction is not the life, but the *pair*. The standard debate leaves open the possibility that Plutarch's innovation—the *synkrisis* (formal comparison)—is not merely rhetorical ornamentation but a cognitive technology designed to solve the very problem the skeptics raise. If the hagiographical life is a "degenerate case" because it lacks contrast, then the *Parallel Lives* offer a structural correction: by holding two similar lives against one another, the reader is forced to discount situational variables (city, office, luck) to locate the invariant trait. This project tests that structural claim.

  **Methodology and Timeline**
  This is a textual analysis project informed by moral psychology, not a psychological experiment. The twelve months will be divided into three phases: textual mapping, comparative analysis, and theoretical integration.

  **Months 1–3: Selection and Mapping.** I will not attempt to cover all 23 pairs. I will select six "high-variance" pairs where the outcomes diverge significantly despite similar starting conditions (e.g., Alcibiades/Coriolanus, Demosthenes/Cicero). I will also include the four unpaired lives (Galba, Otho, Aratus, Artaxerxes) as a control group to test if the moral texture changes when the *synkrisis* is absent. The output of this phase is a annotated taxonomy of the causal attributions in the opening chapters of these lives: how much does Plutarch attribute to nature, training, or luck before the narrative begins?

  **Months 4–6: The Mechanics of the *Synkrisis*.** This is the core close-reading phase. I will focus exclusively on the formal comparison chapters that close the pairs. I am not looking for the verdict (who was better), but for the *criteria* of judgment. Does Plutarch explicitly penalize a subject for failures caused by circumstance? Does he credit a subject for successes caused by luck? I will code these passages for "discriminatory moves"—instances where Plutarch explicitly separates the man from the moment. This is where the "sorting operation" hypothesis is tested. If the *synkrisis* merely sums up achievements, the hypothesis fails. If it actively re-weights actions based on context, the hypothesis holds.

  **Months 7–9: Integration with Moral Psychology.** I will map the discriminatory moves identified in Phase 2 against contemporary literature on the Fundamental Attribution Error and exemplar-based learning. The goal is not to judge Plutarch by modern standards, but to see if his structural solution anticipates the modern critique of situationism. Does the pairing structure mitigate the reader's tendency to over-attribute outcomes to character? I will draft the core argument here: that Plutarch offers a "case-based" pedagogy that is more robust than single-exemplar models because it forces counterfactual reasoning (i.e., "What would the Roman have done in the Greek's city?").

  **Months 10–12: Synthesis and Deliverable.** The final three months are for writing the chapter and refining the practical deliverable. I will draft the full argument, ensuring the "unpaired lives" control group is integrated to show what is lost without the pairing. The final weeks will be dedicated to translating the findings into a framework for curriculum designers (see below).

  **Why Not the Alternatives?**
  I considered running this through a general theory of learning from cases. This would dissolve the specific textual mechanics of the *synkrisis* into abstract pedagogy, losing the historical specificity of Plutarch's innovation. I also considered testing this against a modern character education programme. This is a category error; modern programmes are interventionist, while Plutarch is textual. Testing Plutarch against a modern classroom would require empirical work impossible in a humanities fellowship and would obscure the historical claim: that the *text itself* is built to train a specific cognitive skill. This project stays focused on the *design* of the moral instruction, not its empirical efficacy in a modern classroom.

  **Possible Conclusions**
  1.  **Strong Confirmation:** The *synkrisis* consistently re-attributes outcomes from character to circumstance (or vice versa) in ways the single narratives do not. This proves the pairing is the primary pedagogical engine.
  2.  **Partial Failure:** The *synkrisis* turns out to be rhetorical summing-up rather than analytical discrimination. This would suggest the "sorting" happens in the reading of the parallel narratives, not the formal comparison.
  3.  **The "Unpaired" Anomaly:** If the four unpaired lives show the same moral discrimination without the pairing, the structural argument collapses, and the *synkrisis* is merely traditional.

  **Deliverable for Practitioners**
  For character education designers, the output will not be "use Plutarch." It will be a design principle: **Contrastive Case Modeling.** Current curricula often present single exemplars (e.g., "Learn courage from MLK"). This project suggests that virtue is better taught through *contrasting* exemplars facing similar constraints with different outcomes, or different constraints with similar outcomes. I will produce a short guide outlining how to construct "Plutarchan pairs" in modern contexts to teach the discrimination of character from context, helping students avoid the Fundamental Attribution Error in their own moral reasoning.

  **Failure Conditions**
  I need to be honest about where this dies. The project fails if, by Month 10, the close reading reveals that the *synkrisis* are formulaic epideictic rhetoric that simply repeat the narrative verdicts rather than re-evaluating them. If Plutarch uses the comparison merely to praise rather than to dissect, the "cognitive tool" argument is dead. In that case, I would pivot to a shorter paper on the *limitations* of ancient moral psychology, but the fellowship chapter would not be viable.

  **Scope and Honesty**
  Is this too big for a year? Yes, if I include the "hindsight/retrospective" objection you mentioned. That is a philosophical objection about the possibility of learning from history *at all*. It is fascinating, but it undermines the positive claim that the text *works*. For a one-year write-up, I recommend cutting the "hindsight" half entirely. Focus on the **pairing as a sorting mechanism**. The hindsight problem is a meta-objection that applies to all biography; the pairing mechanism is Plutarch's specific solution to the attribution problem. If you try to solve the epistemology of history *and* the mechanics of the *synkrisis* in twelve months, you will do neither well. Stick to the mechanics. The "biographer's privilege" is a footnote, not a chapter.

  **Summary**
  This project moves the debate from "Do lives teach?" to "How does the *structure* of the lives teach?" It treats the *Parallel Lives* not as a gallery of heroes, but as a gymnasium for moral judgment. By isolating the *synkrisis* as the active ingredient, it offers a determinate answer to a stale question and provides a usable heuristic for modern character education that respects the complexity of human action.
