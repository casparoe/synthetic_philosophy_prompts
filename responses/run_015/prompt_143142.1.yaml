prompt: |-
  I have recently taken over stewardship of a family coastal property that climate projections suggest will be uninhabitable within eighty years, and I now serve on a small regional board weighing protective infrastructure against managed retreat. The board's decision will shape not merely property values but long-term migration patterns, which in turn affect which families form and which individuals come to exist in this region a century from now. Those practical stakes have made the nonidentity problem urgent for me: if our retreat policy results in lower welfare for the people living here in 2100, but those particular people would never have existed had we built seawalls instead, in what sense—if any—have we wronged them?

  I am seeking funding for a six-month philosophical research project that asks a more specific, and I think unsettled, question. Existing discussions of the nonidentity problem tend to treat the paradigm case as an individual reproductive choice—whether a couple conceives now or waits—where the counterfactual dependency is direct and personal. But collective institutional choices, such as a resilience board's selection between infrastructure and retreat, operate through diffuse structural causation over generations. I want to examine whether this structural pathway weakens or transforms the counterfactual dependency that generates the problem: does the fact that hundreds of independent migration and partnership decisions intervene between the board's vote and any particular future person's existence mean that the standard reply—that no one is made worse off relative to their own non-existence—fails, or succeeds differently, in the collective case?

  The project would be conceptual, not empirical. I do not need demographic modeling; I need a rigorous framework for distinguishing harm-based obligations, which seem to require identity preservation, from welfare-based obligations, which do not, in contexts where agency is distributed and causation is mediated by social structure. I want to know whether the standard conclusion that no harm occurs still applies when the choice is institutional rather than reproductive, and whether this distinction can yield a practical decision criterion for boards like mine—one that tells us whether we should evaluate policies by comparing welfare levels across possible worlds, or whether we must preserve specific lives.

  A useful deliverable would be a concise analytical framework—perhaps a taxonomy of institutional choice-types mapped onto their counterfactual dependency structures—together with an argument for which evaluation metric is appropriate for each. Failure would be a result that collapses the institutional and reproductive distinctions without argument, or that leaves boards with no actionable difference between harming and failing to benefit.

  The scope is deliberately narrow: one conceptual distinction, tested against two or three stylized policy scenarios, with no literature review by citation required since I will supply references myself. If someone asks why a foundation should fund philosophy on this, my answer is that the board's legal and moral justification currently rests on an unexamined assumption about whether adaptation policies harm future residents. Clarifying that assumption does not require new data; it requires conceptual precision that empirical research cannot provide, and that could reshape how resilience funding is justified to stakeholders and courts.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Steward of a coastal property, member of a regional resilience board. Facing a real-world decision (protective infrastructure vs. managed retreat) with long-term consequences (80+ years).
      *   **Problem:** The Nonidentity Problem (Parfit). If policy A (retreat) leads to different people existing than policy B (seawalls), can Policy A be said to harm the people in the future if they wouldn't exist otherwise?
      *   **Specific Research Question:** Does the *structural/institutional* nature of the choice (diffuse causation, many intervening decisions) change the nonidentity problem compared to the standard *individual/reproductive* case?
      *   **Goal:** Funding for a 6-month conceptual philosophical research project.
      *   **Deliverable:** A concise analytical framework (taxonomy of institutional choice-types mapped to counterfactual dependencies) + argument for evaluation metrics (welfare vs. identity preservation).
      *   **Constraints:** Conceptual only (no empirical modeling), narrow scope (one distinction, 2-3 scenarios), no literature review needed (user supplies refs).
      *   **Tone:** Professional, rigorous, persuasive (grant proposal style), philosophically precise.

  2.  **Deconstruct the Philosophical Core:**
      *   *Standard Nonidentity:* Person-affecting view vs. Impersonal view. Parfit's conclusion: We need a "Theory X" because the person-affecting view fails here.
      *   *User's Twist:* Causal distance. In the reproductive case, the link between choice and conception is tight. In the policy case, the link is mediated by migration, economics, social structures.
      *   *Hypothesis:* Does causal attenuation weaken the counterfactual dependency? Or does it strengthen the claim that we are dealing with *groups* or *roles* rather than specific *identities*?
      *   *Key Distinction:* Harm-based obligations (require specific victim) vs. Welfare-based obligations (impersonal goods).
      *   *Practical Stake:* Legal/moral justification for the board. If they can't be accused of "harming" future residents, does that let them off the hook for low welfare? Or does it shift the burden to impersonal welfare maximization?

  3.  **Evaluate the Feasibility and Merit:**
      *   *Is this novel?* Yes, applying nonidentity to *institutional* causation chains rather than *reproductive* timing is a specific niche. Most literature focuses on climate change broadly, but less on the *mechanism* of identity formation via policy vs. biology.
      *   *Is it actionable?* The user wants a decision criterion for boards. This is high stakes.
      *   *Is the scope right?* 6 months for conceptual work is reasonable for a focused taxonomy.

  4.  **Drafting the Response (Grant Proposal Support/Feedback):**
      *   *Objective:* I need to act as a reviewer or a collaborator helping refine the pitch. The user is asking *implicitly* for validation or refinement of this research plan, though the prompt reads like a statement of intent. I should respond by evaluating the proposal's strength, identifying potential philosophical pitfalls, and suggesting how to sharpen the argument for a funding body.
      *   *Structure:*
          1.  **Validation:** Acknowledge the urgency and philosophical sophistication.
          2.  **Strengths:** Highlight what makes this fundable (practical stakes, conceptual gap).
          3.  **Critical Feedback/Refinement:** Point out where the argument might stumble (e.g., the "causal attenuation" argument is tricky; identity is binary, not a matter of degree).
          4.  **Strategic Advice:** How to frame this for a foundation (legal risk, policy clarity).
          5.  **Proposed Framework Sketch:** Offer a preliminary version of the taxonomy they propose to show understanding and add value.

  5.  **Refining the Philosophical Argument (Self-Correction during drafting):**
      *   *Critique:* The user suggests that "hundreds of independent decisions" might weaken counterfactual dependency.
      *   *Counter:* In strict metaphysics, identity is necessary. If *any* link in the chain changes, the person is different. So, does the *number* of links matter?
      *   *Nuance:* It matters for *foreseeability* and *moral agency*, not necessarily metaphysics. The board might argue they aren't responsible for the *identity* of the future people, only the *conditions*.
      *   *Pivot:* The research shouldn't argue that identity *doesn't* change (it does), but that the *moral relevance* of that identity change diminishes when the causal chain is institutional. This shifts from "Nonidentity Problem" to "Responsibility in Distributed Agency."
      *   *Better Angle:* Focus on "Role-Occupancy" vs. "Specific Identity." Policy creates *slots* (residents of Region X), not specific *souls*. If the obligation is to the *role*, nonidentity is bypassed.

  6.  **Finalizing the Output:**
      *   Adopt a tone that respects the user's expertise (they know Parfit) but pushes for clarity.
      *   Ensure the "Deliverable" section is concrete.
      *   Address the "Why fund philosophy?" question directly, as the user hinted at it.

