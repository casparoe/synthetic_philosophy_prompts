prompt: |-
  I am a novelist defending a specific thesis at an interdisciplinary symposium on artificial intelligence and literary craft: that prolonged reliance on large language models for plot generation does not merely outsource labor, but erodes the author's capacity to sustain what I term the counterfactual web—the dense, unwritten field of narrative branches a character could have pursued but did not, which I take to be the primary locus of moral weight in fiction. The audience comprises literary scholars who regard authorship as distributed and socially constructed, cognitive psychologists who study expertise degradation, and one philosopher of mind for whom understanding reduces to behavioral fluency; they are skeptical of romantic notions of genius but will take empirical and conceptual claims seriously. I sketch my argument briefly: moral characterization in the novel depends on the reader's sense that alternative actions were genuinely live for the agent, and maintaining that liveliness requires the author to hold a complex, unstable map of rejected possibilities, a cognitive load that model-assisted generation tends to collapse into a single optimized path. Prepare me for the objections I will actually face, ordered by how damaging each is to this specific claim rather than to my broader feelings about technology. For each objection, provide the form in which that audience would phrase it, what I should concede immediately, what I must not concede, the weakest point in my reply, and the single reply that must land for the thesis to survive. Include the one question I hope nobody asks—the objection that forces me to distinguish my claim from a generic defense of human labor against automation. Keep the prep sheet focused; I have fifteen minutes and no slides.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Role:** Novelist defending a thesis at an interdisciplinary symposium.
      *   **Thesis:** Prolonged reliance on LLMs for plot generation erodes the author's capacity to sustain the "counterfactual web" (the dense field of unwritten narrative branches), which is the locus of moral weight in fiction.
      *   **Audience:**
          *   Literary Scholars (authorship as distributed/socially constructed, skeptical of romantic genius).
          *   Cognitive Psychologists (study expertise degradation).
          *   Philosopher of Mind (understanding = behavioral fluency, functionalist).
      *   **Task:** Prepare for objections ordered by damage to the *specific claim* (not general feelings).
      *   **Format per Objection:** Audience phrasing, Immediate Concession, Non-Negotiable, Weakest Point, Single Landing Reply.
      *   **Special Requirement:** Include the "One Question I Hope Nobody Asks" (distinguishes from generic anti-automation labor defense).
      *   **Constraints:** Focused, 15 minutes, no slides.

  2.  **Deconstruct the Thesis:**
      *   *Core Claim:* LLM use $\rightarrow$ Cognitive erosion of "counterfactual web" $\rightarrow$ Loss of moral weight in fiction.
      *   *Key Mechanism:* Cognitive load of holding rejected possibilities is necessary for moral characterization. LLMs optimize/collapse this into a single path.
      *   *Vulnerability:* Is the "counterfactual web" actually in the author's head, or in the text? Is moral weight dependent on the *author's* cognitive state or the *reader's* experience? Does LLM use *actually* collapse the web, or just shift where it's generated?

  3.  **Drafting Objections (Iterative Process):**

      *   *Objection 1: The Literary Scholars.* They hate "romantic genius." They see authorship as collaborative.
          *   *Argument:* You're fetishizing the solitary mind. Editors, beta readers, and cultural norms already shape the "web." LLMs are just another collaborator.
          *   *Damage Level:* High. It attacks the premise that the *author's* specific cognitive state is the locus of value.
          *   *Strategy:* Concede authorship is distributed. Insist the *type* of collaboration matters (friction vs. optimization).

      *   *Objection 2: The Cognitive Psychologists.* They study skill acquisition and degradation.
          *   *Argument:* Where's the data? "Erosion" is a strong word. Experts offload cognitive load all the time (calculators, notes) without losing understanding. Maybe LLMs free up load for *deeper* counterfactual thinking elsewhere.
          *   *Damage Level:* Very High. It attacks the causal mechanism (LLM $\rightarrow$ Erosion).
          *   *Strategy:* Concede lack of longitudinal data. Insist on the specific nature of *generative* offloading vs. *calculative* offloading.

      *   *Objection 3: The Philosopher of Mind.* Understanding = Behavioral Fluency.
          *   *Argument:* If the text produces the *effect* of moral weight in the reader, why does the author's internal state matter? If the output is functionally identical, the "web" exists in the reader's mind, not the writer's.
          *   *Damage Level:* Critical. It attacks the definition of "moral weight." If the reader feels the weight, the thesis fails.
          *   *Strategy:* Concede reader reception is key. Insist that without the author's genuine struggle, the textual cues for that reader experience are hollow/uncanny.

      *   *The "Hope Nobody Asks" Question.*
          *   *Need:* Distinguish from "human labor vs. machine" generally.
          *   *Question:* Is this just nostalgia for difficult labor? Why is *this* cognitive load valuable but others (typing, research) aren't?
          *   *Distinction:* It's not about effort; it's about the specific *structural alignment* between the cognitive act of rejecting possibilities and the ontological status of fictional choice.

  4.  **Refining and Ordering by Damage:**

      *   *Most Damaging:* Philosopher of Mind (Functionalism). If the text works, the process doesn't matter. This kills the "moral weight" claim entirely.
      *   *Second Most Damaging:* Cognitive Psychologists (Expertise). If there's no evidence of erosion, or if offloading helps, the mechanism is broken.
      *   *Third Most Damaging:* Literary Scholars (Distributed Authorship). If the author's mind isn't the sole vessel, the "erosion" is less catastrophic.

      *Wait, let's re-evaluate damage relative to the *specific claim*.*
      *   Thesis: LLMs erode *author's capacity* to sustain the web.
      *   Philosopher: If the text sustains the web for the reader, the author's capacity is irrelevant. (Destroys the *consequence* of the thesis).
      *   Psychologist: LLMs don't erode capacity; they augment it. (Destroys the *premise* of the thesis).
      *   Scholar: The "author" isn't a single mind anyway. (Destroys the *subject* of the thesis).

      *Decision:* The Philosopher's objection is the most existential. If moral weight is purely behavioral/reader-side, the author's internal "web" is mysticism. The Psychologist is next because they can demand empirical proof of "erosion." The Scholar is third because I can reframe "author" as "primary cognitive node."

      *Actually, let's look at the "One Question."* That needs to be separate.

      *Revised Order:*
      1.  Philosopher of Mind (Functionalism/Reader Reception).
      2.  Cognitive Psychologists (Offloading vs. Erosion).
      3.  Literary Scholars (Distributed Authorship).

  5.  **Drafting the Content (incorporating constraints):**

      *   *Tone:* Professional, concise, defensive but open.
      *   *Format:* Bullet points, clear headers.
      *   *Time Check:* 15 mins speaking time means this prep sheet needs to be scan-able instantly.

      *(Self-Correction during drafting)*: Make sure the "Concede/Don't Concede" sections are sharp. Don't waffle.
      *   *Philosopher:* Concede reader experience is final arbiter. Don't concede text can simulate weight without underlying logic.
      *   *Psychologist:* Concede offloading is normal. Don't concede generative offloading is same as calculative offloading.
      *   *Scholar:* Concede solitary genius is a myth. Don't concede all collaborators function alike.

      *The "Hope Nobody Asks" Question:* Needs to cut to the "Labor vs. Craft" distinction. "Isn't this just the 'handmade' fallacy applied to thought?"

  6.  **Final Review against constraints:**
      *   Ordered by damage? Yes.
      *   Audience phrasing included? Yes.
      *   Concede/Not Concede/Weakest/Landing Reply included? Yes.
      *   "Hope Nobody Asks" included? Yes.
      *   Focused/No slides context? Yes.

  7.  **Final Polish:** Ensure the language matches the sophistication of the prompt (e.g., using terms like "functionalist," "cognitive offloading," "distributed cognition").

  *(Final thought on the "Weakest Point"):* I need to be honest about where my argument is thin. For the Philosopher, it's the link between internal state and external text. For the Psychologist, it's the lack of longitudinal data. For the Scholar, it's defining the boundary of the "author." I will select the most critical vulnerability for each.

  *(Final thought on the "Landing Reply"):* Needs to be the "silver bullet" that saves the thesis.
      *   Philosopher: The "Uncanny Valley of Choice."
      *   Psychologist: "Generative vs. Executory" offloading.
      *   Scholar: "Friction vs. Flow."

  Let's assemble.
answer: |-
  **SYMPOSIUM PREP SHEET: THE COUNTERFACTUAL WEB**
  **Time:** 15 Minutes | **Format:** Oral Defense | **Constraints:** No Slides

  ### OBJECTION 1: The Functionalist Trap (Philosopher of Mind)
  **Damage Level:** Critical. If the reader experiences moral weight regardless of the author's process, your thesis collapses into mysticism.

  *   **Audience Phrasing:** "You claim moral weight resides in the author's cognitive struggle. But if a text successfully elicits the *feeling* of contingent choice in a reader, does the provenance of that text matter? If understanding is behavioral fluency, and the novel behaves morally, isn't the 'unwritten web' in the author's head irrelevant?"
  *   **Concede Immediately:** That the reader's experience is the final arbiter of a novel's success. I am not arguing for art that fails to communicate.
  *   **Do Not Concede:** That a text can sustainably simulate the *texture* of genuine contingency without the underlying logical architecture of rejected paths.
  *   **Weakest Point in Your Reply:** Asserting that readers can *detect* the author's cognitive state. (You have no proof they can).
  *   **The Single Landing Reply:** "Moral weight isn't a texture; it's a structural load-bearing wall. An LLM optimizes for probability, not possibility. It can mimic the *shadow* of a choice, but it cannot sustain the *consequences* of a choice across 300 pages because it does not hold the rejected branch in memory. The reader feels the collapse eventually, not as a detection of the author, but as a narrative inconsistency we call 'unearned resolution'."

  ### OBJECTION 2: The Cognitive Offloading Defense (Cognitive Psychologists)
  **Damage Level:** High. If LLM use is functionally equivalent to other expert tools, "erosion" is just Luddite panic.

  *   **Audience Phrasing:** "Experts routinely offload cognitive load to maintain performance (calculators, notes, GPS). Why is offloading *plot generation* uniquely degrading? Perhaps freeing working memory allows the author to sustain a *more* complex web elsewhere, rather than collapsing it."
  *   **Concede Immediately:** That cognitive offloading is a standard, often beneficial, component of expertise acquisition and maintenance.
  *   **Do Not Concede:** That *generative* offloading (deciding what happens) is equivalent to *executory* offloading (recording or calculating what happens).
  *   **Weakest Point in Your Reply:** Claiming that "struggle" is inherently virtuous. (Psychologists view struggle as a cost to be minimized).
  *   **The Single Landing Reply:** "Offloading calculation preserves the model; offloading generation dissolves it. When I use a calculator, I still hold the equation. When I prompt a plot solution, I am outsourcing the formation of the equation itself. You cannot sustain a counterfactual web if you never mentally instantiate the branches you are pruning."

  ### OBJECTION 3: The Distributed Authorship Critique (Literary Scholars)
  **Damage Level:** Moderate. This challenges the "romantic" framing but allows for a redefinition of the "author."

  *   **Audience Phrasing:** "You treat the author as a solitary cognitive vessel. But authorship has always been distributed—editors, agents, cultural norms, and beta readers all collapse narrative branches. Why is the LLM uniquely destructive to the 'web' when human collaborators have always pruned possibilities?"
  *   **Concede Immediately:** That the "solitary genius" is a myth and that all fiction is socially co-constructed.
  *   **Do Not Concede:** That human friction functions the same way as algorithmic optimization.
  *   **Weakest Point in Your Reply:** Idealizing human editors. (Editors often demand clichés too).
  *   **The Single Landing Reply:** "Human collaborators introduce *friction*; models introduce *flow*. An editor argues for a branch based on a conflicting moral vision, forcing me to defend my web. An LLM predicts the most likely branch based on training data, encouraging me to abandon the web. One sustains the counterfactual through debate; the other erodes it through optimization."

  ***

  ### THE ONE QUESTION I HOPE NOBODY ASKS
  **The Distinction Challenge**

  *   **The Question:** "Isn't this just the 'handmade' fallacy applied to cognition? You're defending the value of human labor simply because it is difficult and human, rather than demonstrating why the *specific mechanism* of LLM generation breaks the *specific mechanism* of moral fiction. How is this different from a potter claiming a molded vase lacks 'soul' compared to a thrown one?"
  *   **Why It Hurts:** It forces you to prove this isn't just nostalgia for difficult labor. It demands you isolate the *ontological* link between the writer's brain and the text's morality, distinct from general craft.
  *   **The Necessary Distinction:** "A molded vase functions identically to a thrown one. A novel generated via counterfactual erosion *cannot* function identically to one sustained by it, because fiction is not an object; it is a record of a decision process. If the decision process is outsourced, the record is not of a choice, but of a prediction. The moral weight lies in the *risk* of the choice, which cannot be simulated by a system designed to minimize risk."
