      *   *Clarification:* Distinguish between "Objectivity" (mind-independent truths) and "Universality" (shared across minds). The prompt asks for Objectivity.
      *   *Tone Check:* Keep it tight. No fluff. Bullet points.
      *   *Specific Terminology:* Use "Moral Foundations Theory," "Social Domain Theory," "Error Theory," "Constructivism."

  9.  **Final Polish:** Check against the prompt requirements.
