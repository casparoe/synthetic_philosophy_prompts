answer: |-
  **SEMINAR NOTES: Desiderata for Cross-Cultural Moral Objectivity**

  **I. The Spec: 4 Core Desiderata**
  To sustain objectivity without collapsing into WEIRD imperialism or relativism, a theory must satisfy:

  1.  **Phenomenological Realism:** Must account for the *experience* of objectivity. In cultures prioritizing Loyalty/Purity, violations are not felt as "bad style" (convention) but as *ontological pollution* or *treason*. A theory that dismisses these as "errors" fails descriptive adequacy.
  2.  **The Normativity/Convention Distinction (Modulated):** Must preserve Turiel's distinction (moral vs. conventional) but allow cultural calibration.
      *   *Requirement:* Explain why some societies moralize purity (e.g., food taboos) while others conventionalize it. Objectivity cannot depend solely on the *content* (harm vs. no-harm) if the *structure* of the judgment is identical across cultures.
  3.  **Disagreement Depth:** Must distinguish between:
      *   *Fundamental Value Disagreement:* (e.g., "Individual liberty > Group cohesion").
      *   *Factual/Weight Disagreement:* (e.g., "Does this purity violation actually cause spiritual harm?" or "How much loyalty is owed to a corrupt leader?").
      *   *Constraint:* Objectivity survives if most cross-cultural conflict is the latter (weights/facts) rather than the former (values).
  4.  **Functional Universality:** Must ground objectivity in the *problem space* of social cooperation, not just specific solutions. All societies face problems of hierarchy, reciprocity, and group boundary maintenance. Objectivity may reside in the *necessity of solving these*, not the specific hierarchy chosen.

  **II. Empirical Guardrails (Non-Negotiables)**
  A theory cannot contradict the following without losing explanatory power:

  *   **Moral Foundations Theory (Haidt et al.):** WEIRD populations cluster heavily on Care/Harm + Fairness. Non-WEIRD populations utilize Care, Fairness, Loyalty, Authority, and Purity roughly equally. *Objectivity cannot be defined exclusively by the WEIRD cluster.*
  *   **Anthropological Universals:** Incest taboos (Purity), Reciprocity norms (Fairness), and Leadership structures (Authority) are universal, even if specific instantiations vary. *Objectivity cannot deny these are moral phenomena.*
  *   **Moralization Trajectories:** Taboos can become moralized (e.g., smoking, segregation). *Objectivity cannot rely on static categories of "harm."*

  **III. The Impossibility Theorem (Jointly Unsatisfiable Subset)**
  You cannot hold all three simultaneously. One must be dropped:

  1.  **Robust Realism:** Moral truths are mind-independent.
  2.  **Content Neutrality:** No specific moral content (e.g., "monogamy") is universally binding.
  3.  **Folk Veridicality:** Folk moral intuitions are generally reliable guides to truth.

  *   *Relativism* drops (1).
  *   *Utilitarianism* drops (2) (it insists Harm is the universal content).
  *   *Error Theory* drops (3) (it says folk intuitions are mostly false).
  *   *Your Target:* To save objectivity, you likely must drop **Folk Veridicality**. You must argue that while Loyalty/Purity are *real* moral dimensions, specific intuitions about them can be objectively wrong (e.g., honor killings) without dismissing the foundation itself.

  **IV. The "Killer" Constraint**
  **The Non-Reductive Normativity Requirement.**

  *   **Definition:** A theory must explain the normative force of non-Harm foundations without reducing them to Harm (Utilitarianism) or reducing them to Social Agreement (Relativism).
  *   **Why it damages the usual suspects:**
      *   **Vs. Utilitarianism:** Utilitarianism fails because it must treat Purity/Loyalty violations as *instrumentally* wrong (only if they cause harm). But folk morality treats them as *intrinsically* wrong. If the theory cannot account for intrinsic wrongness in non-harm contexts, it contradicts the phenomenology of billions of moral agents.
      *   **Vs. Relativism:** Relativism fails because it treats the "objectivity feel" of Purity/Loyalty as an illusion. But if it's an illusion, why is it structurally identical to the "objectivity feel" of Harm? If Harm is objective but Purity isn't, despite identical cognitive architecture, the theory is ad hoc.
  *   **The Pushback Argument:** "If you claim cross-cultural difference kills objectivity, you are assuming Objectivity requires *Uniformity*. But Objectivity only requires *Convergence under ideal conditions*. We can acknowledge Loyalty/Purity as objective moral goods (social cohesion, sanctity) while arguing specific cultural instantiations (e.g., caste systems) are objective *errors* in applying those goods."

  **V. Strategic Summary for Debate**
  1.  **Concede Diversity, Deny Incommensurability:** Admit foundations vary, but argue they are solving the same universal coordination problems.
  2.  **Attack the "Harm Monopoly":** Force your friend to prove why Harm is the *only* objective metric. If Harm is objective because it undermines flourishing, show how Loyalty/Purity also undermine flourishing when violated (social fragmentation, loss of meaning).
  3.  **The Trap:** If he says "Purity isn't real harm," ask: "Is social trust real harm?" Loyalty/Purity are the glue of trust. If trust is objectively valuable, the foundations supporting it have objective weight.
