prompt: |-
  me and my friend just got into it for like two hours about WEIRD morality and whether cross-cultural differences actually kill objectivity. he thinks if harm/fairness is just one cluster among loyalty/purity/authority then there's no real moral fact, just cultural packages. i want to push back but i need the actual spec first: write the desiderata a theory of moral objectivity must meet to take folk morality seriously across cultures. what patterns must it accomodate — e.g. that some societies treat loyalty or purity violations as genuinely wrong rather than mere convention? which distinctions must it preserve (moral wrongness vs social taboo, disagreement over weights vs disagreement over values)? what psychology or anthropology findings can it not flat-out contradict? flag any jointly unsatisfiable subset — like if full objectivity and complete cultural neutrality can't both hold. and tell me which single requirement does the most damage to the usual suspects (relativism, universalist utilitarianism, etc.). i'm putting together notes for a seminar so keep it tight.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Objectivity vs. Cross-Cultural Differences (specifically regarding Moral Foundations Theory - harm/fairness vs. loyalty/purity/authority).
      *   **Goal:** Provide a set of *desiderata* (requirements) for a theory of moral objectivity that takes folk morality seriously across cultures.
      *   **Key Elements to Include:**
          *   Patterns to accommodate (e.g., genuine wrongness of purity/loyalty violations in some cultures).
          *   Distinctions to preserve (moral wrongness vs. taboo, weight vs. value).
          *   Psychology/Anthropology constraints (what findings can't be contradicted).
          *   Jointly unsatisfiable subsets (trade-offs).
          *   The "killer" requirement (which one damages standard theories the most).
      *   **Tone/Format:** Tight, seminar notes style, philosophical but grounded in empirical data.

  2.  **Deconstruct the Core Conflict:**
      *   *Friend's Position:* Moral Foundations Theory (MFT) shows diversity (WEIRD vs. Non-WEIRD). If foundations vary, there's no single objective metric. Therefore, relativism/cultural packages.
      *   *User's Position:* Wants to push back. Needs a framework where objectivity survives diversity.
      *   *The Bridge:* A theory of objectivity that isn't just "Western Liberal Individualism" but accounts for the *reality* of how humans experience morality globally.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Requirement 1: Phenomenological Realism.* People *feel* purity/loyalty violations are objective wrongs, not just preferences. A theory must explain this without dismissing it as "false consciousness."
      *   *Requirement 2: The Normativity/Convention Distinction.* Turiel's work. Kids distinguish moral (harm/justice) from conventional (rules) early on. But in some cultures, purity *acts* like harm. The theory needs to handle when a taboo *becomes* moralized.
      *   *Requirement 3: Disagreement Depth.* Is it disagreement on *principles* or *application*? (e.g., everyone values loyalty, but differs on *who* counts as the in-group).
      *   *Requirement 4: Functional Universality.* Morality serves a function (cooperation, social cohesion). Objectivity might be grounded in function, not specific content.

  4.  **Identifying Empirical Constraints (Psych/Anthro):**
      *   *Moral Foundations Theory (Haidt et al.):* WEIRD people focus on Harm/Care + Fairness. Non-WEIRD add Loyalty, Authority, Purity.
      *   *Turiel's Social Domain Theory:* Distinction between moral and conventional is robust but culturally modulated.
      *   *Anthropological Universals:* Incest taboos (purity), reciprocity (fairness), hierarchy management (authority) exist everywhere, even if weighted differently.
      *   *Constraint:* Cannot claim all moral intuitions are veridical (some are clearly harmful/oppressive). Cannot claim all are invalid (leads to nihilism).

  5.  **Identifying Trade-offs (Jointly Unsatisfiable Subsets):**
      *   *Objectivity + Content Neutrality:* You can't have objective moral truths *and* say the content of those truths is completely determined by culture.
      *   *Universalism + Folk Veridicality:* You can't say "all folk morals are true" and "there is one universal moral law" if folk morals contradict (e.g., monogamy vs. polygamy).
      *   *The Big Tension:* **Robust Objectivity** vs. **Descriptive Adequacy.** If you make objectivity too rigid, it ignores culture. If you make it too flexible, it collapses into relativism.

  6.  **Selecting the "Killer" Requirement:**
      *   What hurts Relativism? The fact that people *argue* across cultures as if there is a truth.
      *   What hurts Utilitarianism? The fact that Harm isn't the only foundation people actually use.
      *   *The Winner:* **The Phenomenological Constraint.** The theory must explain why moral experience *feels* objective without dismissing non-Harm foundations as "mistakes." This hurts Utilitarianism (which dismisses purity/loyalty as irrational) and Relativism (which dismisses the *feeling* of objectivity as an illusion).
      *   *Refinement:* Let's go with **The Non-Reductive Normativity Constraint.** A theory cannot reduce moral "wrongness" solely to "harm" (hurts Utilitarianism) nor solely to "social agreement" (hurts Relativism). It must account for the *normative force* of non-harm foundations.

  7.  **Structuring the Response:**
      *   **Header:** Seminar Notes Style.
      *   **Section 1: The Desiderata (The Spec).** 4-5 key points.
      *   **Section 2: Empirical Guardrails.** What data must be respected.
      *   **Section 3: The Impossibility Theorem (Trade-offs).** Where the tension lies.
      *   **Section 4: The "Killer" Constraint.** The specific point to hit the friend with.
      *   **Section 5: Strategic Advice.** How to use this in the debate.

  8.  **Refining the Content (Self-Correction during drafting):**
