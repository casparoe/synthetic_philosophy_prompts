      *   *Step 1: The Self-Vouching Fallacy.* Explain Gödel II properly. $Con(S) \to \neg Prov_S(Con(S))$. It's a condition of strength, not a symptom of disease. Explain that if a system *could* prove its own consistency, we'd actually be *more* suspicious (unless it's very weak).
      *   *Step 2: The "Weaker System" Misconception.* Clarify that useful weaker systems (like Peano Arithmetic) *also* cannot prove their own consistency. Only trivial systems can. So switching doesn't solve the "self-vouching" desire.
      *   *Step 3: Downward Contagion (The Core).* Use the building analogy. ZFC is the foundation for the *skyline*, but Calculus lives on the *ground floor*.
      *   *Reverse Mathematics:* Explain $\mathsf{RCA}_0$, $\mathsf{WKL}_0$, $\mathsf{ACA}_0$. Show that 90% of analysis works there.
