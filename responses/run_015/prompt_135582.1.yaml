  2.  **Deconstruct the Friend's Argument (The "Self-Vouching" Fallacy):**
      *   *Premise 1:* A safe system should be able to prove its own consistency.
      *   *Premise 2:* ZFC cannot prove its own consistency (Gödel II).
      *   *Conclusion:* ZFC is likely inconsistent.
      *   *Critique:* This is a modal epistemic error. Gödel II says *if* a system is consistent, it *cannot* prove it. It does *not* say *if* it can't prove it, it is inconsistent. The inability to self-verify is a feature of sufficient strength, not a bug indicating falsehood.
      *   *Analogy:* A trustworthy person cannot legally sign their own affidavit in some contexts; that doesn't make them a liar. Or, a strong enough mirror cannot reflect its own frame without distortion.

  3.  **Address the "Weaker Systems" Claim:**
      *   Friend suggests switching to predicative systems (like $\mathsf{PA}$ or subsystems of second-order arithmetic) because they can "prove they're consistent."
      *   *Correction:* Actually, by Gödel II, *no* sufficiently strong recursive system can prove its own consistency. If a system *can* prove its own consistency, it is usually *too weak* to do interesting math, or it is actually inconsistent (because an inconsistent system proves everything, including its own consistency).
      *   *Nuance:* Some very weak systems (like Presburger Arithmetic) can prove their consistency, but they can't define multiplication. Systems strong enough for calculus ($\mathsf{PA}$, $\mathsf{ZFC}$) cannot. So the friend is factually wrong about weaker systems being able to self-vouch *if* they are strong enough to be useful.

  4.  **Tackle the "Downward Spread" (Contagion) Question:**
      *   *Scenario:* ZFC is inconsistent. Does Calculus break?
