prompt: |-
  hey so im taking a philosophy of math course and we had this long argument in the dorm about whether ZFC is secretly broken. my friend said that since Gödel's second theorem proves ZFC can never prove its own consistency, that must mean there's a contradiction hiding in there that we just havent found yet — like, if the system was really safe it should be able to vouch for itself, right? and then she asked why mathematicians dont just switch over to one of those weaker predicative systems that can actually prove theyre consistent, instead of building castles on sand.

  i think there's a false presupposition in there about self-vouching and hidden rot, but i also want to understand the part about downward spread: if some weird inconsistency popped up in high-level set theory, would that actually contaminate the calculus that engineers use? my roommate mentioned reverse mathematics and RCA0 living in a safer zone, but i dont see how a crack at the top doesnt eventually break everything below it. can you act like an expert logician and walk me through where the reasoning slips? please think step by step, start by distinguishing "internally unprovable consistency" from "probable contradiction", and then explain why consistency failures arent automatically contagious downward. dont just dump a bibliography on me — i want the conceptual diagnosis, especially about whether weak arithmetic is genuinely insulated or if thats just a comforting myth.
