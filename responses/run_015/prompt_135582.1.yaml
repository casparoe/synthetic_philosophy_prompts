      *   *Mechanism:* Mathematics is layered. Calculus ($\mathbb{R}$, limits, derivatives) can be formalized in much weaker systems than ZFC (e.g., $\mathsf{PA}$ or even $\mathsf{WKL}_0$).
      *   *Insulation:* If ZFC is inconsistent, the contradiction likely arises from the Axiom of Choice or the Power Set Axiom (infinite sets of infinite sets). Finite arithmetic ($\mathsf{PA}$) is "lower down."
      *   *Reverse Mathematics:* This is the key tool. It maps which theorems require which axioms. Most "concrete" math (analysis, number theory) lives in the "Big Five" subsystems of Second Order Arithmetic, which are much weaker than ZFC.
      *   *Verdict:* A contradiction in ZFC *might* not affect $\mathsf{PA}$. However, if $\mathsf{PA}$ is inconsistent, *then* everything breaks. But ZFC inconsistency doesn't automatically imply $\mathsf{PA}$ inconsistency.
      *   *Caveat:* If ZFC is inconsistent, our *confidence* in $\mathsf{PA}$ might shake (since ZFC proves $\mathsf{PA}$'s consistency), but the *truth* of calculus theorems (formalized in weaker systems) remains intact relative to those weaker systems.

  5.  **Drafting the Response (Iterative refinement):**

