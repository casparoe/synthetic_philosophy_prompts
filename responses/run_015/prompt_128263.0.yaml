      *   *Landfill (Poor Neighborhood):* Severe? (Small health risk). Irreversible? (Chronic). Involuntary? (Yes, poor, no benefit). Uncertainty? (Assumed known risk). *Verdict:* Strong PP. Draft Principle Condition (i) "Severe" might be weak here ("small health risk"), but Condition (ii) is very strong. -> **Tension.** The user feels PP applies strongly here, but his Condition (i) says "severe."
      *   *Landfill (Workers, Paid/Chosen):* Severe? (Same risk). Involuntary? (No, chosen/paid). *Verdict:* Weak PP. Draft Principle Condition (ii) fails. -> **Match.**
      *   *Landfill (No Other Employer):* Severe? (Same). Involuntary? (Economically coerced). *Verdict:* Flip-flop. Draft Principle Condition (ii) "can't realistically opt out" covers this. -> **Match** (if interpreted strictly).
      *   *Old Tech (60 years):* New risk found. Involuntary? (Yes). Uncertainty? ("Nobody looked" initially, now "we know"). *Verdict:* User wants PP. Draft Principle? Condition (iii) "nobody can look" might fail if we can look now. But "nobody looked" historically fits. -> **Tension.**
      *   *Risk-Reducing Tech (Vaccine/Flood Barrier):* Involuntary? (Maybe). Uncertainty? (Small novel risk). *Verdict:* Weak PP. Draft Principle? Condition (i) "Downside severe" refers to the *action's* downside (side effect), not the *status quo* downside (disease). If side effect is small, Condition (i) fails. -> **Match.**

  4.  **Evaluate the "We Looked vs. Nobody Looked" Distinction:**
      *   User suspects it's bogus/convenient.
      *   *Analysis:* It's actually a distinction between *risk* (known probabilities) and *uncertainty/ignorance* (unknown probabilities). In decision theory, this is Knightian Uncertainty. It is *not* bogus. It matters because you can't calculate expected utility if you don't know the distribution. However, "looked and got null" isn't the same as "safe." It's "safe within detection limits."
      *   *Refinement:* It's not about whether we looked, it's about whether the *system* is capable of revealing the harm before it happens (monitorability) and whether the harm is reversible if found later.

  5.  **Develop a Cleaner Principle (The "Robustness" Approach):**
      *   The user's draft is good but maybe too rigid on "Severe." The Landfill (Poor Neighborhood) case suggests *Justice* is a multiplier, not just a switch.
