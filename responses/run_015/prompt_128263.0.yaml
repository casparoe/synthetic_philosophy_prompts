          *   (iii) "Looked vs. Didn't Look" is valid (Knightian Uncertainty) but needs nuance (Monitorability).
      *   **The "No-Other-Employer" Case:** Resolve this firmly. Economic coercion = No Consent. PP applies.
      *   **The "Old Tech" Case:** Distinguish Precaution (ex-ante) from Remediation (ex-post).
      *   **The Cleaner Principle:** Propose the **"Burden of Proof Slider."**
          *   Instead of Yes/No, it's about who has to prove what.
          *   High Irreversibility + Low Consent + High Uncertainty = Proponent must prove *no* significant harm.
