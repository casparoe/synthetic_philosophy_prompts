      *Wait, one detail:* "GDP per capita around the level of present-day Poland." Poland is upper-middle income, not low. This makes the transition *more* feasible than from low income, but the "CPI 40s" is the drag. Poland's CPI is actually around 55-60 now. 40s is more like Romania or Bulgaria. This implies a weaker institutional baseline. I should note this tension.

      *Re-evaluating the "SOE" term:* The prompt asks if SOE features are load-bearing. Nordic countries tax capital *less* now than in the 70s. They tax labor and consumption. The "small open" part matters for the *wage bargaining* (exposure to trade discipline). I will focus on the wage bargaining aspect as the critical transmission mechanism.

      *Final check on the combination:* I won't do a naive Bayesian multiplication because the terms are correlated. I will describe it as a "weighted constraint analysis."

