      *   *Point 2: Information Pattern vs. Narrative Center.* This is the user's key insight. Dennett doesn't view the self as a *thing* (pattern or soul) but as an abstraction (Center of Narrative Gravity). The summary reifies the self into an "information pattern." This is a category error Dennett would likely reject.
