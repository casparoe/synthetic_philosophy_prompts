  2.  **Deconstruct the Core Problem:**
      *   The funders want to know: *Can we use utility numbers for policy?*
      *   The philosophical constraint: *Revealed Preference (RP) theory.*
      *   The tension: RP traditionally links choice to preference/utility. Policy needs cardinal, interpersonally comparable utility. RP usually gives ordinal, individual utility.
      *   The "Conceptual Only" constraint: We aren't running experiments; we are analyzing the *logic* of inference from choice to welfare.

  3.  **Evaluate the User's Candidates:**
      *   *Candidate 1 (Delegated Choice/Agents):* This is high relevance for modern policy (nudges, algorithms). It challenges the "agent" assumption in RP. If choice isn't the individual's, RP fails. This is a live dispute/emerging area.
      *   *Candidate 2 (Belief/Utility Joint Identification):* This is classic decision theory (Savage vs. Jeffrey). Without objective probabilities, you can't separate $P$ and $U$ from choice alone. This undermines cardinality. This is largely settled in theory (underdetermination) but has live implications for measurement.

  4.  **Develop the Shortlist (Aiming for 3-4 Questions):**

      *   *Question 1 (The Foundation):* The Belief/Utility Identification Problem. (Based on Candidate 2). Why? Because if you can't separate belief from desire, you can't get cardinal utility. If you can't get cardinal utility, CBA is on shaky ground. This is the logical prior.
      *   *Question 2 (The Agent):* The Delegated Choice Problem. (Based on Candidate 1). Why? Because modern choice data isn't "natural." If the choice isn't the subject's, RP is category error. This is urgent for policy.
      *   *Question 3 (The Interpersonal Gap):* The Comparison Problem. Even if we get cardinal utility for *one* person, how do we compare across people? RP is silent here. Policy needs this. This is the "hard problem" of welfare economics.

      *   *Refinement:* Let's make sure these are *research questions*, not just topics.
          1.  To what extent does the underdetermination of belief and utility in non-experimental settings invalidate cardinal welfare metrics?
          2.  Does the proliferation of delegated choice (algorithms/defaults) break the normative link between revealed preference and individual welfare?
          3.  Can structural assumptions (rationality constraints) bridge the gap between ordinal revealed preference and the cardinal utility required for cost-benefit analysis?

  5.  **Drafting the Content - Section by Section:**

