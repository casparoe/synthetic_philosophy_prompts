answer: |-
  This is a high-stakes conceptual brief. Your funders are asking for a warrant: *Are we licensed to treat choice data as welfare data?* The standard economic answer ("Revealed Preference") is often treated as a settled warrant, but in philosophical and decision-theoretic terms, it is a chain of conditionals that is currently breaking at several links.

  Given the constraint (conceptual work only, 9 person-years) and the goal (policy entitlement), you cannot solve the hard problems (e.g., "What is well-being?"). You *can* map the precise conditions under which the inference from choice to welfare fails. Negative results are valuable here; telling policy "You cannot use this number without assumption X" is a successful outcome.

  Here is the ranked shortlist, followed by the reasoning on prioritization and the map of settled vs. live disputes.

  ### The Shortlist

  **1. The Identification Question (Belief/Utility Underdetermination)**
  *In non-experimental settings where objective probabilities are absent, to what extent does the joint identification of belief and utility undermine the cardinality required for cost-benefit analysis?*
  *   **Scope:** Analyze the limits of representation theorems (Savage, Jeffrey, Bolker) when exogenous lotteries are removed. Determine if "structural rationality" constraints alone can recover cardinal utility from observational data, or if this requires importing normative assumptions about belief formation.
  *   **Why this rank:** This is the logical prior. If choice does not pin down a unique utility function for a *single* agent (because belief and desire are confounded), interpersonal comparison and policy aggregation are impossible regardless of other factors.

  **2. The Agency Question (Delegated Choice)**
  *Does the proliferation of delegated choice (defaults, algorithms, fiduciary agents) sever the normative link between observed choice and individual welfare?*
  *   **Scope:** Conceptual analysis of the "agent" in Revealed Preference theory. Distinguish between choices that express a preference and choices that satisfy an objective function optimized by a third party (or a past self). Determine if RP theory can be adapted to "meta-choice" (choosing the algorithm) or if it requires a new welfare metric for delegated environments.
  *   **Why this rank:** This is the validity threat. If the data source is corrupted by principal-agent problems, the inference is a category error. This is the most urgent for modern policy (nudges, digital markets).

  **3. The Interpersonal Question (Comparison Premises)**
  *What specific non-choice premises are necessary to bridge the gap between ordinal revealed preference and the cardinal, interpersonally comparable utility required for welfare accounting?*
  *   **Scope:** Map the logical distance between Robbins' critique (no interpersonal comparison) and modern social choice theory. Identify exactly which ethical or psychological assumptions (e.g., "similar minds," "basic needs") must be added to choice data to make aggregation permissible.
  *   **Why this rank:** This is the policy goal, but it is the least "settleable" conceptually. It is ranked third not because it is unimportant, but because it depends on the answers to #1 and #2. If #1 fails, this is moot.

  ---

  ### Reasoning for the Ranking

  You asked what puts something on this list, what keeps it stuck, and what moves it.

  **1. Logical Priority vs. Policy Urgency**
  *   **Question #1 (Identification)** is ranked first because it is the **bottleneck**. Standard Revealed Preference (Samuelson) assumes we observe choice under risk or certainty. In the real world (and in most policy data), we observe choice under uncertainty *without* known probabilities.
      *   *What stays stuck:* The mathematical underdetermination is a settled feature of decision theory. You cannot separate $P$ (probability) and $U$ (utility) from choice alone without constraints.
      *   *What a PhD can settle:* The PhDs can settle *which* constraints are required to fix it, and whether those constraints are plausible for policy populations. They can produce a "User Manual" for when cardinal inference is mathematically illicit.
      *   *Movement:* If a new representation theorem emerges (unlikely but possible), this drops. If data moves entirely to algorithmic environments, this merges with #2.

  **2. Data Validity (The "Garbage In" Problem)**
  *   **Question #2 (Agency)** is ranked second because it addresses the **input**. Your Candidate 1 is spot on. Revealed Preference assumes the chooser is the beneficiary.
      *   *What stays stuck:* The philosophical definition of "autonomy" vs. "optimization."
      *   *What a PhD can settle:* A taxonomy of delegated choice. They can distinguish cases where the agent's utility function is *aligned* with the principal's (fiduciary) vs. *substituted* (algorithmic default). They can determine if RP theory breaks or just needs re-indexing.
      *   *Movement:* This moves to #1 if the funders are primarily interested in digital regulation or behavioral public policy. It is the most "live" dispute.

  **3. The Normative Gap**
  *   **Question #3 (Interpersonal)** is ranked third because it is the **output**.
      *   *What stays stuck:* The Humean gap. You cannot derive an "ought" (welfare comparison) from an "is" (choice) without a bridging premise. This is historically stuck.
      *   *What a PhD can settle:* They cannot solve interpersonal comparison. However, they *can* produce a rigorous inventory of the "bridging premises" currently used implicitly in CBA. Making the hidden assumptions explicit is a viable 3-year project.
      *   *Movement:* This moves up if the funders are specifically asking about distributional weights (equity) rather than efficiency.

  ---

  ### Map: Settled Results vs. Live Disputes

  You explicitly asked to avoid wearing a consensus costume. Here is the distinction you need to protect your funders from.

  #### Settled Results (Mathematical/Logical Limits)
  *   **Ordinality of RP:** It is settled that standard Revealed Preference axioms (WARP/SARP) yield only ordinal utility rankings, not cardinal numbers. (Samuelson, 1938).
  *   **Underdetermination of P and U:** It is settled that without exogenous variation in probabilities (lotteries), choice data alone cannot uniquely identify belief and utility functions. (Savage 1954; Suppes 1961).
  *   **The Interpersonal Barrier:** It is settled that choice data *alone* cannot justify interpersonal utility comparisons. (Robbins 1932). Any claim to do so relies on extra-theoretical assumptions.
  *   **Representation Theorems:** The math linking axioms to utility functions (Von Neumann-Morgenstern, Savage) is settled. The dispute is not about the math, but the *interpretation*.

  #### Live Disputes (Philosophical/Interpretative)
  *   **Normative Force of Rationality:** There is active dispute over whether satisfying axioms (like transitivity) is *constitutive* of having a preference, or merely *evidence* of it. (Interpretation of Dutch Book arguments).
  *   **Welfare Interpretation of RP:** There is live dispute over whether satisfying RP axioms is sufficient for welfare claims. (The "Money Pump" vs. "Mistake" debate). Some argue agents can systematically choose against their welfare while remaining "rational" in the RP sense. (Hausman, McPherson, Sugden).
  *   **Algorithmic Agency:** There is no consensus on whether an algorithm's choice counts as the user's choice for welfare analysis. Is a Spotify recommendation a revelation of taste or a manipulation of it? This is entirely open.
  *   **Cardinality from Structure:** There is live work on whether imposing "structural rationality" (e.g., smoothness, stability over time) on observational data can recover cardinality without lotteries. This is technically contested.

  ### Strategic Advice for the Proposal

  **1. Sell the "Negative" Result**
  Funders often want a "Yes, you can use utility." Your team must be prepared to deliver a "No, not without X." Frame the PhDs as **audit projects**. They are auditing the license to use utility numbers. If the audit finds the license invalid under current conditions, that is a successful use of funds (preventing bad policy).

  **2. Focus on "Entitlement Conditions"**
  Don't ask "Is utility real?" Ask "Under what conditions are we *entitled* to act as if it is?" This shifts the work from metaphysics to epistemology and ethics, which is actionable for policy.
  *   *Example:* "We are entitled to use utility numbers *if and only if* we assume agents have stable beliefs about risk."

  **3. Use the Workshop Budget for "Translation"**
  Use the workshop budget to bring decision theorists and cost-benefit analysts into the same room. The philosophers will speak of "underdetermination"; the economists will speak of "identification." A major deliverable of the 3 years should be a **glossary of translation** that prevents the economists from assuming the philosophers have solved the metaphysics, and prevents the philosophers from assuming the economists are ignoring the math.

  **4. Watch the Rabbit Hole (Candidate 1 & 2)**
  *   **Candidate 1 (Delegated Choice):** This is not a rabbit hole; it is the future of data. Keep this. It makes the project contemporary.
  *   **Candidate 2 (Belief/Utility):** This is the technical core. Do not let it become pure math. Keep it tied to the *policy consequence* (i.e., "If we can't separate belief from utility, we can't price risk in CBA").

  **Summary for the Funders:**
  "We are not asking if utility exists. We are asking if the bridge from *observed choice* to *policy number* is structurally sound. We have identified three load-bearing pillars (Identification, Agency, Comparison). We will test each to failure."
