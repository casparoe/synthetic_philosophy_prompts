          *   *#2: The Agency Problem (Delegated Choice).* Priority: High/Urgent. Reason: Data validity. If the data source is corrupted by principal-agent issues, inference is impossible.
          *   *#3: The Interpersonal Problem (Comparison).* Priority: Medium (in terms of solvability). Reason: It's the policy goal, but philosophically the hardest. Might be "dissolved" rather than solved.
      *   **Reasoning Criteria:**
          *   *What stays stuck:* Interpersonal comparison is historically stuck. Identification is technically stuck but can be clarified.
          *   *Realistically settleable:* Clarifying the *conditions* under which inference fails (negative results are valuable).
          *   *Movement:* New tech (AI agents) moves Q2 up.
      *   **Settled vs. Live:**
          *   *Settled:* RP yields ordinal utility (Samuelson). Belief/Utility underdetermination without exogenous risk (Savage/Suppes). Interpersonal comparison is not possible via choice alone (Robbins).
          *   *Live:* Normative weight of "mistakes" (libertarian paternalism). Whether structural rationality assumptions can salvage cardinality. The status of algorithmic proxies.

  6.  **Refining the Tone:**
      *   The user is sophisticated ("conceptual work only," "representation theorems," "identification limits").
      *   Avoid condescension.
