          2.  **The Epistemology of Speculative Mechanisms (Question ii).** This is the science/philosophy interface.
      *   *Why these two?* They address the *source* of the credence, not just the *decision rule*. Most decision theorists try to fix the utility function or the decision rule. The user's background suggests fixing the *error budget* of the probability assignment.
      *   *Defunding:* (iv) is value theory distraction. (v) is symmetric to (i) mostly. (vi) is a conclusion, not a starting point. (iii) is important but depends on (i) and (ii).
