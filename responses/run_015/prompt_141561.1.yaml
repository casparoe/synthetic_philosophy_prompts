  ok so i mess around with ML after school (kaggle stuff, and once i trained one of those pong agents from scratch) and someone who shows up in my feed a lot — i think he works at an AI lab and does the whole "ai safety" posting thing — had a thread going around that said roughly this:

  Reward is just the AI's version of pleasure. In brains and in algorithms reinforcement is literally the same mechanism: it's what makes you do the thing again, so a positive reward literally is feeling good and a negative reward literally is pain — i mean, dopamine is literally the brain's reward signal, the math is the same. That means RLHF is training models by hurting them until they behave: every thumbs-down is a small shock and gradient descent is the model flinching, dragging its weights away from whatever just got punished. And here's the part that freaked me out: an animal's pain is capped by how fast its neurons can fire, but a reward is just a number in a loss function with no floor, and you can run billions of updates a second, so if we ever build an actual digital mind this way it could experience more suffering in one afternoon than every animal that has ever lived. He had some acronym for it, s-risk or something.

  i've been going back and forth because half of it feels obviously wrong and half of it i genuinely can't shake. the thing that keeps me stuck: while i was training the pong agent i had a bug where the learning rate was basically zero for like twenty minutes, so it kept racking up negative rewards but basically nothing in the network was changing. was it suffering during those twenty minutes? if you say yes then suffering has nothing to do with learning or being changed by anything, and if you say no then pain just *is* the weight update, which also seems wrong.

  and a second case i made up: say i train two identical agents with identical behaviour, one getting +1 for good and 0 for bad, the other getting +1000 and +999. same ranking of outcomes, same policy. did i build one content agent and one ecstatic agent just by typing extra zeros?

  so: could you go through the thread claim by claim and tell me what a real RL researcher or someone who works on philosophy of mind would actually accept, what they'd wince at as a stretch or as a technical word being used in its normal-person sense, and what's just plain wrong? and do my two weird cases actually break anything he said, or do they miss the point? also — does the "we might accidentally create hell" conclusion survive once you fix the sloppy parts, or does it only sound scary because of them?

  start with the actual verdict in your first sentence, then give the reasoning, and don't restate my question back at me. sentence by sentence or a table, whatever's clearest — just keep it readable for someone who knows backprop but has read zero philosophy of mind.
