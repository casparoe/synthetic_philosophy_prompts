answer: |-
  ### Conceptual Dependency Outline

  **Three Conceptual Dependencies:**
  1.  **Non-Experiential Value:** The student must accept that some goods (e.g., completing a project, maintaining a system) derive value from their existence or completion, not solely from the conscious experience of enjoying them.
  2.  **Temporal Extension:** The student must grasp that the value of many present activities is not instantaneous but unfolds over time, requiring a future horizon to be realized.
  3.  **Social Inheritance:** The student must recognize that the "future horizon" required for these projects is not abstract time, but a social context maintained by successors who understand and use the work.

  **Single Biggest Misconception:**
  STEM-trained rationalists typically assume **experientialism**: the belief that value must ultimately be reducible to the positive or negative conscious states of existing individuals, thereby rendering "meaning" unintelligible unless it cashes out as happiness or preference satisfaction.

  **Sentence Distinction (Altruism vs. Meaning-Dependence):**
  Altruism seeks to improve the welfare of others, whereas collective meaning-dependence asserts that the value of our *own* welfare is structurally contingent on the existence of those others.

  ***

  ### 90-Minute Teaching Plan: The Collective Afterlife Conjecture

  #### I. Sequence and Structure (15 Minutes)
  **Goal:** Establish the logical scaffolding without triggering metaphysical defense mechanisms.

  1.  **Component 1: Personal vs. Project Goods (0–5 mins)**
      *   **Content:** Distinguish between *experiential goods* (eating a meal, feeling safe) and *project goods* (writing code, building a theory, raising a child).
      *   **Dependency:** This must come first because if value is defined solely as experience, the argument dies immediately. We must establish that "making something that lasts" is a distinct category of value.
      *   **Why:** STEM audiences respect system integrity and completion metrics. Frame this as "output validity" vs. "process comfort."

  2.  **Component 2: Temporal Dependence of Value (5–10 mins)**
      *   **Content:** Argue that project goods are temporally extended. A proof is not valuable until it is verified; a protocol is not valuable until it is deployed.
      *   **Dependency:** Depends on Component 1. You cannot argue that time matters for value if you haven't established that value exists outside of immediate experience.
      *   **Why:** This shifts the focus from "how I feel now" to "what happens next."

  3.  **Component 3: The Collective Afterlife Conjecture (10–15 mins)**
      *   **Content:** Introduce Scheffler's claim: We implicitly assume successors will exist to sustain the context in which our projects remain valuable.
      *   **Dependency:** Depends on Component 2. If projects need a future to be valuable, and the future requires people to sustain it, then our current value depends on future people.
      *   **Why Reversing Causes Failure:** If you introduce "Collective Afterlife" first, engineers hear "religion" or "mysticism." If you introduce "Extinction is Bad" first, they hear "Utilitarian Death Count." By starting with *current project validity*, you ground the claim in phenomenology (how we experience meaning) rather than metaphysics (what happens after death) or aggregation (how many die).

  #### II. The Carrying Example (20 Minutes)
  **Goal:** Anchor the abstract logic in a familiar technical workflow.

  **The Scenario:**
  An open-source cryptographer spends five years hardening a privacy protocol. She knows she will not use it for her entire life (she may switch fields or retire). She knows the protocol provides no direct income or fame. However, she regards the protocol as valuable because it secures communication for anyone who uses it. She learns that the broader development ecosystem will collapse in 10 years (due to extinction), orphaning the protocol before it achieves widespread adoption or maintenance handover.

  **What This Example Must Have:**
  *   **Independence from Survival:** She values the protocol's existence even if she dies tomorrow. This isolates the value from her personal experiential welfare.
  *   **No Direct Harm:** She is not physically hurt by the extinction. This isolates the harm from standard suffering-based ethics.
  *   **Systemic Dependence:** The protocol requires a community to maintain keys, update standards, and integrate it. This establishes the need for *successors*, not just time.

  **What This Example Must Lack:**
  *   **No "Sadness":** Do not describe her crying or feeling depressed. This prevents the argument from collapsing into "extinction is bad because it makes us sad."
  *   **No "Saved Lives":** Do not mention that the protocol saves lives. This prevents the argument from collapsing into "extinction is bad because people die."

  **Why the Standard Archivist Framing Falls Flat:**
  Scheffler's original "archivist" preserves the *past*. To a technical audience, preserving the past is often seen as low-leverage compared to building the future. An archivist curates dead data; a cryptographer maintains a living system. The engineer sees themselves in the builder who needs a future user base, not the curator who needs a future audience. The archivist framing risks sounding like "preserving history for nostalgia," whereas the cryptographer framing sounds like "maintaining system integrity."

  #### III. Misconception Mapping (25 Minutes)
  **Goal:** Pre-emptively deflate category errors as they arise in the sequence.

  1.  **Misconception: Religious Immortality**
      *   **The Error:** "This is just a secular way of saying souls live on."
      *   **Defusing Sentence:** "This is not about *your* consciousness surviving; it is about the *context* of your consciousness remaining intelligible."
      *   **Timing:** **Before** introducing the term "Collective Afterlife" (during Component 2). Explicitly state: "When philosophers say 'afterlife' here, we mean 'social continuity,' not 'spiritual survival.'"

  2.  **Misconception: Utilitarian Population Ethics**
      *   **The Error:** "This is just saying fewer people means less total happiness."
      *   **Defusing Sentence:** "Utilitarianism counts the welfare of the people who die; this argument concerns the validity of the work done by the people who are alive now."
      *   **Timing:** **During** the Carrying Example. When describing the cryptographer, ask: "Does her loss come from the users who won't exist, or from the code she wrote becoming null?"

  3.  **Misconception: Emotional Appeal**
      *   **The Error:** "This is just saying extinction makes us feel sad."
      *   **Defusing Sentence:** "We are analyzing reasons for action and value structures, not predicting psychological grief responses."
      *   **Timing:** **After** the Carrying Example. When discussing reactions, clarify: "Even if she felt no sadness, the project's value would still be negated."

  4.  **Misconception: Group Consciousness**
      *   **The Error:** "This requires believing humanity is a single hive mind organism."
      *   **Defusing Sentence:** "This relies on structural dependence between individuals, not the existence of a super-entity."
      *   **Timing:** **During** the introduction of Component 3 (Collective Afterlife). Clarify that "collective" refers to the network of successors, not a metaphysical group soul.

  #### IV. Check for Understanding (20 Minutes)
  **Goal:** Verify structural grasp, not polite agreement.

  **The Task:**
  Present the following scenario to the group (individual writing for 5 mins, discussion for 15 mins):
  *"An asteroid will hit Earth in 200 years. It will vaporize everyone instantly. No one will feel pain. No one currently alive will die early. The population until then will live happy, full lives."*

  **The Prompt:**
  "Using the framework discussed, articulate why a rational agent might oppose this asteroid *without* using utilitarian math (i.e., without counting the lost lives or happiness of the future people). Focus exclusively on the value of projects undertaken *today*."

  **Success Criteria:**
  *   **Fail:** "Because fewer people means less total happiness." (Utilitarian collapse).
  *   **Fail:** "Because people will be scared." (Emotional collapse).
  *   **Pass:** "Because knowing the endpoint nullifies the long-term investment of current projects (e.g., climate repair, basic science), rendering them futile rather than merely unfinished."
  *   **Pass:** "Because the 'context of value' for our current work requires an open-ended future, not a fixed deadline."

  #### V. Open Refusals (10 Minutes)
  **Goal:** Manage scope and prevent technical derailment.

  Explicitly state that this session will **not** cover the following two bodies of technical material. Acknowledge their existence but set them aside to maintain focus on the phenomenological claim.

  1.  **Parfit's Non-Identity Problem:**
      *   *Statement:* "We are not addressing the logical puzzle of whether future people are harmed by being brought into existence under worse conditions. That is a separate problem regarding *who* exists. We are discussing the value of *our* existence relative to *any* successors."
      *   *Reason:* It introduces complex counterfactuals about identity that distract from the immediate meaning-dependence claim.

  2.  **Formal Literature on Intergenerational Justice in Welfare Economics:**
      *   *Statement:* "We are not discussing discount rates, cost-benefit analysis over centuries, or optimal savings rates for future welfare."
      *   *Reason:* Those are policy implementation details. This session is about the foundational ethical ontology—why we care at all—not how to quantify that care in a model.

  **Closing (5 Minutes):**
  Summarize the chain: Project Goods → Temporal Extension → Successor Dependence. Reiterate that avoiding extinction is not just about saving lives, but about preserving the conditions under which our current lives make sense.
