          *   **Requirement 3:** At least one question on the *normative status of hyperbolic discounting* (bias vs. rational given uncertainty/identity) + follow-up.
          *   **Remaining Questions:** Probe skepticism about importing economic models into practical reason (e.g., moral weakness, non-instrumental reasons).
