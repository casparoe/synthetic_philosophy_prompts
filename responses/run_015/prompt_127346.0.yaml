      *   Jordan is more attentive to the specific details of the thought experiment. Maya is applying a generic template.
      *   However, Jordan's claim about "biological immediacy" is shaky (neuroscience doesn't support "biological magic"). But his point about *architectural restructuring* holds regardless of biology.
