      *Wait, one nuance on Jordan:* Jordan claims biological neurons have "first-person accessibility" synthetics lack. This *is* vitalism/mysterianism. I should point out that while his *conclusion* might be right (identity breaks), his *reasoning* about biology specifically is weak. He should argue about the *logs*, not the biology. I will note this distinction.

      *Re-evaluating "Who is right":*
