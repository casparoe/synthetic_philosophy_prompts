  On a colony of *Atta cephalotes* foraging for leaves.

  The leaf cutter moves by chemical **pattern**,
  A legged machine of chitin, **physical**,
  No blueprints held behind the compound **design**,
  No single brain to plan or to **intend**,
  Yet all this motion seems to **compress**
  The chaos of the forest floor to **noise**.

  What looks like random static, mere **noise**,
  Resolves under the microscope to **pattern**:
  Pheromone trails that **compress**
  The distance home into a **physical**
  Line. We need not think they **intend**
  To feed the queen, though evolution's **design**

  Suggests a purpose in the grand **design**.
  Ignore the stragglers as irrelevant **noise**;
  The colony seems to know what to **intend**.
  Is there a mind within the living **pattern**?
  Or just the sum of parts, **physical**,
  That let the math of foraging **compress**

  The world into a rule that can **compress**
  The survival task into a simple **design**.
  Touch antennae, swap the **physical**,
  Taste the air, filter out the **noise**,
  Follow the scent, repeat the **pattern**,
  No need to ask the worker what she might **intend**.

  But if we say the hill itself does **intend**
  To grow, the story starts to **compress**
  The data better than the list of **noise**.
  Is this a metaphor for **design**,
  Or just a shortcut for the **physical**
  Truth hidden in the marching **pattern**?

  We hold two maps of exactly the same **pattern**,
  Both claim to know what systems **intend**,
  One grounded deep in the **physical**,
  And both succeed when trying to **compress**,
  Though one hears mind and one hears **noise**,
  And both insist on being the true **design**.

  The **physical** truth may **compress** the whole,
  But if the colony does **intend** its **design**,
  The **pattern** holds regardless of the **noise**.

  ***

  **Note**

  The poem relies on the settled apparatus of Dennett's view: the three stances are predictive strategies, and a "real pattern" is defined by its ability to compress data more efficiently than alternative descriptions. These are the tools of the trade. However, the poem dramatizes live disputes. First, it treats the ontological status of intentional states as an open question ("Or just a shortcut..."), whereas Dennett often argues that being a "shortcut" that works *is* what makes them real (a mild realism). Second, the poem presents a tie between two equally compressing descriptions (Intentional vs. Physical/Design) as a conflict where "both insist on being the true design." In the literature, it is contested whether compressibility is stance-relative; if it is, the test cannot adjudicate between rival ontologies, leaving the "tie" unresolved not because of data scarcity, but because the test itself is circular relative to the vocabulary used.

  The poem takes liberties to sharpen the philosophical tension. It implies that "noise" is simply the residue left by a chosen stance, drifting toward equivalence with "pattern" in the envoi. While consistent with the view that noise is stance-relative, the poem suggests a symmetry Dennett might resist: he would likely argue that the intentional stance earns its keep only where the physical stance is too costly, not where they are equal. Finally, the envoi deviates from the strict mathematical permutation of a traditional sestina to satisfy the constraint that "pattern" and "noise" share the final line, prioritizing the thematic convergence of those terms over formal orthodoxy.
