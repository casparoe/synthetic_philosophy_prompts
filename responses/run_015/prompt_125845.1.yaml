answer: |-
  You have hit on a genuinely subtle and under-discussed failure mode in decision theory. You are correct that while the St. Petersburg and Pasadena paradoxes are well-documented, the specific structural flaw you are describing—where the *mechanism of repair* inherits the *pathology of the disease*—does not have a single, universally standardized term in the literature.

  In the context of the Pasadena Game (Nover & Hájek, 2004) and subsequent literature (Bartha, 2016), this is often discussed under the umbrella of "no decision theory" or the "incoherence of expected utility," but those phrases describe the *outcome*, not the recursive structural failure you are identifying. In physics and applied mathematics, this resembles a failure of **renormalization**, where the counter-terms introduced to cancel infinities themselves diverge.

  Since there is no canonical name, I will propose a term that fits the technical boundary conditions you described, followed by the precise criteria for when it applies.

  ### Proposed Term: Endogenous Expectational Divergence (EED)

  Colloquially, this is also referred to as a **Regularization Regress**.

  **Definition:** Endogenous Expectational Divergence occurs when a decision-theoretic framework introduces a regularization parameter (a cutoff, discount rate, or weighting function) to resolve an undefined expectation, but the optimization of that parameter itself generates an undefined expectation with the same structural properties as the original problem.

  ### Boundary Conditions: EED vs. Normal Parameter Uncertainty

  To distinguish EED from ordinary parameter tuning or second-order uncertainty, the following four conditions must be met:

  1.  **Primary Undefinedness:** The original decision problem $D$ has an undefined expected utility $E[U(D)]$ (due to divergence, conditional convergence, or oscillation).
  2.  **Regularization:** A solution is proposed by introducing a parameter $\theta$ (e.g., a cutoff $N$, a discount factor $\gamma$) such that $E[U(D|\theta)]$ is well-defined for any fixed $\theta$.
  3.  **Meta-Optimization:** The agent must choose $\theta$ by maximizing the expected utility of the choice itself. This requires calculating an expectation over the space of $\theta$, denoted $E[U_{meta}(\theta)]$.
  4.  **Pathological Recurrence:** The calculation of $E[U_{meta}(\theta)]$ is **undefined** for the same mathematical reasons that $E[U(D)]$ was undefined. The divergence is not resolved; it is displaced to the meta-level.

  #### When it is *NOT* Endogenous Expectational Divergence
  It is crucial to distinguish EED from standard **Second-Order Uncertainty** or **Bayesian Model Averaging**.

  *   **Well-Defined Meta-Expectation:** If choosing the parameter $\theta$ involves a trade-off where the costs and benefits are bounded or converge (e.g., choosing a discount rate in a standard net-present-value calculation where cash flows decay exponentially), the meta-expectation is well-defined. Even if you are uncertain about the "true" $\theta$, you can assign a prior distribution to it and calculate a finite expected utility for that prior. This is just normal risk.
  *   **Exogenous Constraints:** If the parameter $\theta$ is fixed by an external constraint (e.g., "I physically cannot count past $10^{80}$") rather than by an internal utility maximization, there is no meta-decision problem, and thus no regress.
  *   **Bounded Utility Solutions:** If the fix involves imposing a hard bound on the utility function itself (e.g., "utility caps at $10^{100}$"), this usually breaks the chain. The meta-choice of the cap might be arbitrary, but the expectation *given* the cap is defined, and the marginal utility of raising the cap eventually hits zero. EED specifically requires that the *marginal value of the parameter* remains susceptible to the original divergence.

  ### Why This Distinction Matters

  Your observation exposes why "local fixes" often feel unsatisfying to philosophers of decision theory.

  1.  **The Cutoff Fallacy:** In the St. Petersburg paradox, if you say "I will truncate at round $N$," you solve the math for that game. But if you ask "What is the maximum entry fee I should pay for the *right to choose* $N$?", and the payoff structure allows $N$ to scale with the pot, the value of choosing $N$ can diverge. The divergence has moved from the *play* to the *setup*.
  2.  **The Pasadena Problem:** The Pasadena game relies on conditional convergence (the sum depends on the order of terms). If you try to fix this by imposing a specific ordering parameter, you must justify that ordering. If the justification relies on expected utility, and the utilities involved in the justification follow the same alternating harmonic structure, the justification itself has no defined value.
  3.  **Implication for Decision Theory:** If a problem exhibits Endogenous Expectational Divergence, it suggests that Expected Utility Theory (EUT) is not just "missing a variable" but is categorially mismatched to the problem. It implies that the pathology is not in the *distribution* of outcomes, but in the *algebra of the aggregation rule* itself. No amount of parameter tuning will fix it because the tuning mechanism uses the same broken algebra.

  ### Summary
  There is no established single word for this in the canon. The closest existing concepts are **"failure of renormalization"** (from physics) or **"meta-uncertainty"** (from decision theory), but neither captures the specific recurrence of *undefinedness*.

  **Endogenous Expectational Divergence** is the precise term for when the cure inherits the disease. It applies specifically when the meta-decision required to implement the fix is subject to the same non-convergence as the original decision. If the meta-decision converges, you are merely dealing with standard parameter uncertainty. If it diverges, you are in a Regularization Regress.
