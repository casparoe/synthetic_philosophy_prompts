prompt: |-
  You are a philosopher of international law and transitional justice. Before answering, briefly outline your conceptual framework. Then analyze the International Military Tribunals at Nuremberg (1945–46) and Tokyo (1946–48) through the lens of retroactive criminalization and victors' justice, but do not treat these as a single charge. Instead, separate two dimensions: (A) substantive retroactivity—the nullum crimen sine lege problem raised by defining crimes against peace and crimes against humanity ex post facto in the respective Charters; and (B) jurisdictional asymmetry—the selective application to defeated Axis powers while excluding Allied conduct, such as strategic bombing or Soviet actions in Eastern Europe, from the tribunals' scope. For each tribunal, map how both dimensions appear: note that the Nuremberg judgment was formally unanimous on the major charges despite internal disagreement among the judges, whereas the Tokyo tribunal produced Justice Radhabinod Pal's published dissent arguing that the Charter violated international law by retroactively criminalizing war. Then ask what the comparison reveals: does Pal's dissent strengthen or weaken the retroactivity critique? Does separating (A) from (B) allow a partial defense—perhaps conceding unavoidable asymmetry in (B) while insisting (A) is fatal—or do they compound each other irreducibly? Finally, say what this episode demonstrates about the theory: is retroactive law in transitional justice ever legitimate if procedural openness (like formal dissent) is present, or does the conjunction of new crimes and one-sided jurisdiction show that the framework was never about justice but about political closure? Be disciplined about the mapping—specify who faced which charge, what options the judges actually had, and where the framework is silent rather than forcing it to speak. Think step by step, and avoid any bibliography or citation list.
