  Lemkin's thought centers on the group as a living organism requiring legal protection. The anchor passage reveals three binding commitments. First, genocide is a *process*, a coordinated plan of various actions, not merely a moment of massacre. Second, the target is the essential foundations of life—institutions, language, religion—not just bodies. Killing is a method, not the definition. Third, the intent must be the annihilation of the group as such, meaning individuals are victimized due to their membership. For Lemkin, law was pedagogical; naming the crime created a conscience. He compromised in 1948 to secure ratification, believing a weaker convention was better than none, but he never abandoned the hope that cultural destruction would be recognized as integral to the group's death. He viewed legal categories as tools to prevent the disintegration of national groups, prioritizing group survival over absolute state sovereignty. Consequently, any extrapolation must respect his focus on state-coordinated destruction of group viability, rather than individual rights alone. He believed the law must be precise enough to bind states but broad enough to cover the techniques of destruction they actually employ.

  **The protocol**
  Lemkin would view the structural erasure protocol as a substantive victory but a terminological defeat. The substance aligns perfectly with his 1933 concept of vandalism and his lost cultural genocide clause; dismantling schools and registries attacks the foundations of life just as surely as killing. He would agree that physical destruction is often unnecessary if the group's coherence is dissolved. However, he would resist dropping the word genocide. He coined the term to shock the conscience and signal that destroying a group is a unique evil, distinct from ordinary human rights violations. Renaming it risks burying the crime in bureaucratic obscurity, allowing states to comply technically while ignoring the moral weight. Regarding the widened groups, he might caution against vagueness. His focus was national groups, understood broadly but legally definable. Adding shared way of life could invite the grievance machine critique, diluting the specific intent required. He would likely advise accepting the protocol to secure protections but insisting on a preamble linking structural erasure to the genocidal process, ensuring the world understands that destroying a group's culture is the prelude to, or equivalent of, destroying its people. He would accept the compromise only if the intent requirement remained strict. He would argue that without the name, the public cannot mobilize, and without mobilization, the law is dead letter. Yet, he might concede that ratified protection is better than pure theory, provided the legal mechanism actually stops the erasure. He would worry that separating cultural destruction from physical destruction creates a hierarchy of suffering, suggesting some groups can be erased culturally without triggering the same alarm as bodily harm. For Lemkin, the two were intertwined. He would likely propose an amendment requiring that structural erasure be treated with the same severity as physical genocide, even if the name differs, to prevent the crime from being seen as secondary.

  **The feed**
  This scenario tests his coordinated plan requirement. Lemkin would likely support the charge, provided prosecutors can prove the state agency knew the algorithm's output would lead to destruction and tuned it anyway. The memo stating it is the only language they understand suggests the engagement metrics were a proxy for incitement. For Lemkin, the mechanism matters less than the objective: if the state uses a tool to inflict conditions calculated to destroy the group, it fits the convention's logic. He defined genocide as attacking the foundations of life; dehumanizing speech reshapes the social conditions necessary for the group's existence. However, he would warn against charging genocide where intent is merely negligent. The specific intent to destroy must be proven beyond the desire for engagement. If the algorithm merely amplified hate without state purpose to destroy, it fails his test. But if the state optimized for engagement knowing it would trigger massacre, the algorithm becomes the modern equivalent of the coordinated plan. He would argue that ignoring this mechanism because it isn't a direct order would let perpetrators hide behind complexity, violating the convention's spirit of preventing destruction through any means. He would demand evidence that the system was weaponized with purpose. He would see the algorithm as inflicting conditions of life calculated to destroy, provided the state intended the destruction, not just the engagement. He would likely distinguish this from mere hate speech laws. For Lemkin, speech becomes genocide only when it is part of a plan to destroy the group's foundations. The algorithm is not just speech; it is infrastructure. If the state controls the infrastructure to isolate and dehumanize, it is creating the conditions for destruction. He would insist that the law must evolve to catch these technical means, or it will remain stuck in 1948 while perpetrators innovate. The risk of cheapening the word is real, but the risk of letting innovators escape is worse.

  **Where I'd be inventing him**
  You must avoid projecting modern digital theory onto him. Lemkin conceived of institutions as physical: schools, churches, land registries. He had no conceptual equipment for algorithmic governance or decentralized media ecosystems. Claiming he would understand optimization functions as legal intent is an extrapolation, not history. Furthermore, his view of groups was rooted in mid-century nationalism; he might struggle with fluid, non-territorial identities like shared way of life without a national basis. Do not claim he prioritized individual free speech; he prioritized group survival. Finally, avoid suggesting he would automatically endorse any expansion of the law. He was a pragmatist who accepted the 1948 compromises. Asserting he would demand maximum expansion ignores his willingness to trade scope for ratification. Your counterfactual must remain grounded in his specific focus on group existence and state coordination, not modern human rights universalism.
