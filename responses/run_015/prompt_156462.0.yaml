          2.  *Consequentialists/Utilitarians:* Recovery and repair are paramount. Accept the deal to get funds/info/fix structures.
          3.  *Hybrid/Compromise:* Accept disclosure, impose non-expulsive sanctions (no leadership, restitution, public acknowledgment), but reserve the right to pursue criminal referral if info is false/incomplete.
      *   **The User's Dilemma:** They lean toward the compromise but worry it's incoherent. Is it a distinct philosophical position, or does it collapse into amnesty or retribution?
      *   **The Task:** Lay out the precise moral and philosophical considerations governing institutional bargains trading knowledge for limited punishment. Evaluate the defensibility of the hybrid approach.
      *   **Language:** American English.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Retributive Justice:* Focuses on desert. Wrongdoers *must* suffer proportionate punishment. Immunity violates this.
      *   *Restorative/Reparative Justice:* Focuses on healing harm, restoring relationships, and making victims whole. Immunity might be acceptable if it maximizes recovery.
      *   *Utilitarian/Consequentialist:* Focuses on outcomes. If immunity saves the co-op and catches bigger fish, it's good.
      *   *Deontological:* Focuses on duty/rules. Lying/forgery is wrong; covering it up (even partially) might be wrong.
      *   *Institutional Integrity:* What does the organization stand for? Does it tolerate corruption?
      *   *Truth and Reconciliation:* Precedents exist (e.g., South Africa's TRC) where truth was traded for amnesty, though usually with public confession.

  3.  **Analyze the "Hybrid" Proposal:**
      *   *Components:* Full disclosure + Non-expulsive sanctions (no leadership, restitution, public acknowledgment) + Suspended criminal referral (contingent on truthfulness).
      *   *The Worry:* Is it incoherent?
      *   *Defense:* It's not necessarily incoherent. It resembles *probation* or *deferred prosecution*. It distinguishes between *organizational standing* and *civil/criminal liability*. It prioritizes *truth* as a precondition for *mercy*.
      *   *Risk:* It might look like weakness to the Retributivists and insufficient protection to the Consequentialists (if the admin lies later).

  4.  **Structure the Response:**
      *   **Introduction:** Acknowledge the gravity and complexity. Validate the user's intuition that this is a classic tension (Justice vs. Utility).
      *   **Section 1: The Competing Ethical Frameworks:** Briefly define the poles (Retributive vs. Consequentialist/Restorative).
      *   **Section 2: The Philosophy of Institutional Bargains:** Discuss the specific ethics of trading punishment for truth (Truth commissions, plea bargains, whistleblower protections). Key concept: *Instrumental vs. Intrinsic value of punishment*.
      *   **Section 3: Evaluating the Hybrid Approach:** Address the core question. Is it incoherent?
          *   Argument for Coherence: It distinguishes between *organizational membership* and *legal liability*. It uses *conditional mercy*.
          *   Argument for Incoherence: It risks "having it both ways" without satisfying the core demands of either side.
      *   **Section 4: Specific Considerations for this Case:**
          *   The Trustees (Coerced vs. Negligent).
