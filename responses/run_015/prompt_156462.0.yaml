      *   **Section 5: Recommendation/Conclusion:** How to frame the decision.

  5.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, philosophical, empathetic, analytical.
      *   *Key Distinction:* Differentiate between *criminal liability* (state power) and *organizational standing* (private governance). The committee likely controls the latter, but "criminal referral" implies influencing the former. *Correction:* The prompt says "immunity from... criminal referral." The committee can promise *not to refer*, but cannot grant legal immunity. This is a crucial practical/ethical distinction. I need to highlight that the committee can only control their *action* of referring, not the *state's action* of prosecuting.
      *   *The "Incoherence" Charge:* The user worries the hybrid collapses. I need to argue it maps onto *Restorative Justice* models. It's not "splitting the difference" arbitrarily; it's prioritizing *repair* over *retribution* while maintaining *accountability* through restitution and exclusion from power.
      *   *The Trustees:* They claim coercion. This needs separate handling. Forgery is serious, even if coerced.
      *   *Terminology:* Use terms like "Retributivism," "Consequentialism," "Restorative Justice," "Conditional Amnesty," "Moral Hazard."

  6.  **Refining the Hybrid Argument:**
