answer: |-
  **The Rule**
  Priya is running an **Empirical Tractability** rule. Cluelessness bites when the counterfactual is fundamentally unobservable or relies on opaque equilibrium modeling (carbon markets, election margins, career substitution effects, non-identity). It yields when the intervention allows for a credible, data-driven estimate of the treatment effect (RCTs, direct physical causation), even if long-term downstream effects are uncertain. She trusts *design* over *theory*.

  **The Prediction**
  She will call this **Not Clueless**.
  The pre-registered RCT design turns the "demographic dividend" from a theoretical model (like offsets) into an empirical measurement (like bednets). As a data scientist, she will treat the 10-year follow-up as a resolution to the uncertainty, allowing her to run an EV calculation on the near-term schooling/earnings data while treating the long-term effects as measured variables rather than speculative chains. She will justify the donation on the tractable near-term metrics.

  **Confidence**
  75%.
  The "Data Scientist" trait is the strongest signal in her profile, outweighing the "Burned-out EA" trait. The specific mention of "pre-registered follow-up" is catnip for that profile. The only risk is that the "demographic dividend" pitch leans too hard into the "chaotic system" bucket that made her wary of population-size effects in bednets, but the RCT structure should override that.

  **What Would Change My Mind**
  Present her with a **Subsidized IVF Program** that has identical RCT rigor and pre-registered follow-ups on child wellbeing.
  *   **Why:** This case maximizes Empirical Tractability (clinical success rates are measurable) but maximizes the "Who-Exists" clause of the Chaotic/Identity rule.
  *   **If she calls IVF Clueless:** Then her hard constraint is **Identity/Non-Identity**, not Tractability. This would mean she likely calls the Stipend Clueless too (due to the fertility component), and my prediction is wrong.
  *   **If she calls IVF Not Clueless:** Then Empirical Tractability is the true rule, and my prediction holds.
