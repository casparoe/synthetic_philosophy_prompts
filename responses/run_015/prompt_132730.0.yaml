answer: |-
  The core tension in hinge epistemology lies in the ontological status of the hinge itself. On one reading, hinges are *grammatical* or *normative*: they are rules disguised as descriptions, the scaffolding that makes the language game of justification possible. They are not truth-apt because they constitute the background against which truth and falsity are measured. On the competing reading, hinges are *empirical*: they are propositions about the world that are so overwhelmingly confirmed, so deeply woven into our practices, that treating them as false would be pragmatically catastrophic. They are truth-apt, but we treat them as immune to doubt.

  The friction arises when we consider the fluidity of hinges. Wittgenstein acknowledges that the riverbed of thoughts shifts. If hinges are non-propositional rules, how can they "shift" without the language game collapsing? If they are empirical propositions, how can they be immune to doubt without begging the question against the skeptic? To see where the rubber meets the road, we have to look at what happens when a specific hinge loses its status, specifically in the scenario you proposed: a scientific community moving from treating "there is a stable past" as a fixed condition to treating it as a revisable modeling assumption.

  ### The Mechanics of the Shift

  In classical physics and everyday epistemic practice, "the past is stable" functions as a paradigmatic hinge. It is not something we test; it is something we use to test. If I find a fossil, I do not doubt whether the past existed to deposit it; I doubt the dating of the fossil. The stability of the past is the logical precondition for the investigation. In Wittgensteinian terms, to doubt this is not to make a mistake, but to fail to play the game. It is a non-propositional enabling condition.

  Now, consider the shift in quantum cosmology. In certain frameworks (like sum-over-histories or model-dependent realism), the "history" of the universe is not a single, fixed trajectory but a superposition of possibilities or a construct dependent on the observational frame. Here, "the past is stable" ceases to be a presupposition and becomes a variable in the equation. It becomes something the theory predicts or approximates under certain conditions, rather than something the theory assumes to get off the ground.

  Is this shift a change of frame or a revision of belief?

  If we treat hinges as **empirical propositions**, this shift looks like belief revision. The community previously held "the past is stable" with near-100% confidence. New data or theoretical pressures forced them to lower that confidence. They now regard the proposition as highly probable but contingent. This reading saves the propositional nature of hinges but destroys their special epistemic status. If they are just very confident beliefs, the skeptic can legitimately ask for the justification of that confidence. If the justification is inductive, the skeptic invokes the problem of induction. If the justification is pragmatic, the skeptic argues that pragmatic success does not entail truth. On this reading, Wittgenstein's anti-skepticism collapses into a form of pragmatism that the skeptic can still bite.

  However, if we treat hinges as **non-propositional enabling conditions**, the shift must be understood as a change in the *frame of inquiry*. The physicists are not simply updating a belief; they are entering a new language game. In the "classical cosmology" game, "the past is stable" was a rule. In the "quantum cosmology" game, it is a move. This preserves the logical distinction between hinges and empirical claims, but it creates a problem of continuity. How do the physicists communicate during the transition? If the rules change, isn't there a moment of incommensurability where justification is impossible?

  The "in the weeds" reality is that the shift is neither purely doxastic nor purely grammatical; it is *functional*. A sentence becomes a hinge not because of its content, but because of the role it plays in the economy of doubt. When "the past is stable" moves from hinge to hypothesis, its *syntax* remains the same, but its *logic* changes. It stops being a touchstone and starts being a target.

  This suggests that the "non-propositional" reading is more robust, but it requires a nuanced understanding of "grammar." It isn't that the sentence lacks sense; it's that its sense is determined by its immunity to verification. When that immunity is lifted, the sentence acquires a new kind of sense—one that allows for verification and falsification. The shift is not a revision of an inner mental state (belief), because for Wittgenstein, certainty is not a feeling of conviction. It is a mode of action. The physicists act differently. They no longer *appeal* to the stable past to justify a model; they *derive* the appearance of a stable past from the model. The change is in the practice, not the psychology.

  ### The Threat to Anti-Skeptical Strategy

  This fluidity poses a specific threat to Wittgenstein's anti-skeptical strategy. Wittgenstein stops the skeptic by arguing that doubt requires grounds, and grounds require a background of undoubted hinges. You cannot doubt everything at once because you need a stable floor to stand on to wield the tool of doubt.

  If hinges can shift from undoubted background to doubted foreground, the skeptic gains a foothold. The skeptic can argue: "You say 'the past is stable' is a hinge now. But you admit that in quantum cosmology, it isn't. Therefore, its status as a hinge is contingent. If it is contingent, it is not a necessary condition of sense. If it is not necessary, then your claim that doubt is impossible without it is false. You are just choosing, for now, not to doubt it."

  This pushes Wittgenstein toward a relativism he might not want. If hinges are just local rules of specific language games (classical physics vs. quantum physics), then skepticism is not refuted universally; it is merely localized. The skeptic can say, "Within your current game, you are right. But I am questioning the game itself."

  However, Wittgenstein's defense lies in the fact that *new* hinges always replace the old ones. When "the past is stable" becomes a hypothesis, it does not mean *everything* becomes doubtful. New hinges emerge to take its place. In the quantum cosmology game, other propositions become the new riverbed: perhaps "mathematical consistency is required," or "instrumental readings are reportable," or "logic holds." The skeptic cannot demand a justification for *these* without initiating yet another shift.

  The anti-skeptical force remains intact only if we accept that while specific hinges are revisable, the *structure* of having hinges is not. We cannot operate without a riverbed. The shift in the "stable past" example demonstrates that no *particular* proposition is sacred, but it does not demonstrate that we can operate without *some* propositions being sacred.

  ### The Residual Tension

  The tension remains, however, in the nature of the "shift" itself. If hinges are truly non-propositional rules, how do we recognize them as the "same" sentence before and after the shift? If I say "The past is stable" as a hinge, and you say "The past is stable" as a hypothesis, are we uttering the same words? Wittgenstein suggests that the meaning is the use. Therefore, they are not the same words. They are homophones.

  This creates a difficulty in explaining the rationality of the shift. If the status of the sentence changes completely, how do we justify moving it from the bed to the water? Justification usually happens *within* a system. To justify changing the system seems to require a vantage point outside the system—a "view from nowhere"—which Wittgenstein explicitly rejects.

  If the shift is rational, it implies there are higher-order norms governing which propositions can serve as hinges. But if there are higher-order norms, aren't *those* the real hinges? And if those can shift, we face an infinite regress.

  The most coherent reading in the weeds is that the shift is not driven by justification, but by *necessity arising from practice*. The classical framework stops working. It generates anomalies. The community doesn't "decide" to make the past a variable based on a proof; they drift into a practice where treating the past as a variable yields better coordination and prediction. The hinge shifts because the form of life shifts.

  This saves the anti-skeptical strategy from the charge of dogmatism (holding specific truths as absolute) but exposes it to the charge of historicism (truth is relative to the current form of life). The skeptic can no longer say "You are irrational for not doubting the past," but they can say "Your certainty is merely a reflection of your current historical context, not a refutation of the possibility of error."

  Wittgenstein's response would likely be that this is not a weakness. The skeptic wants a guarantee that transcends human practice. Wittgenstein offers a description of human practice. The fact that "the past is stable" can become a modeling assumption in quantum cosmology doesn't show that our previous certainty was a mistake; it shows that our language game expanded. The old hinge didn't turn out to be false; it turned out to be limited. It was a rule for a specific domain of action. When the domain expanded, the rule became a move.

  Ultimately, the tension between the propositional and non-propositional readings is resolved by recognizing that hinges are proposition-shaped norms. They look like facts, but they function like rules. The shift in quantum cosmology reveals this dual nature: the sentence remains, but its function flips. This does not defeat the anti-skeptical strategy, provided we accept that skepticism is a disease of language that arises when we try to doubt the conditions of our own speaking. Even if the conditions change, we are always speaking from within some set of conditions. The skeptic wants to float free of the riverbed; Wittgenstein's point is that even when the riverbed moves, we are still standing on something.
