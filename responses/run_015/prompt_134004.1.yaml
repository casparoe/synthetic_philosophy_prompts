prompt: |-
  im a novelist working on a scene where an archivist says, "every culture needs its monuments, its archives, and its executions of the past — but in the wrong doseage they become diseases." she uses this to justify burning old municipal records, and i need to know what precise claims that slogan could actually be making, from the trivial "history is sometimes useful" all the way up to something radical like critical history literally requires destroying documents. i first heard this framing in a seminar on nietzsche's Uses and Disadvantages of History for Life, but the prof just tossed it off to shut down my point that antiquarian history might be therapeutic without being conservative. so lay out the distinct readings as a menu, say for each whether its a platitude, false, or defensible, and then pick the one that actually holds up—dont just list options and leave me hanging. defend your choice with reasons, not hedging. keep it to one paragraph, max 300 words, no citations or bibliography since im writing this offline on a plane with no wifi.
