  ### Tier Classification

  **Tier A (I'd bet money on it)**
  *   **6. Content-addressable retrieval:** Associative recall is the fundamental operating principle of hippocampal and cortical memory systems.
  *   **7. Laziness:** Bounded rationality and predictive processing confirm the brain minimizes computation unless prediction error forces updates.
  *   **9. Garbage collection / forgetting as reclamation:** Synaptic pruning and decay actively reclaim resources, functioning biologically analogously to garbage collection.

  **Tier B (Genuinely could go either way)**
  *   **1. Discrete, re-tokenable symbols:** Neural representations are distributed vectors that behave symbolically only at higher levels of abstraction.
  *   **2. Recursion / arbitrarily deep nesting:** Working memory limits depth, but the underlying capacity for nested structures appears present in language and planning.
  *   **3. Variables with scope:** Binding mechanisms exist in working memory, but lexical scope is likely a linguistic overlay rather than neural firmware.
  *   **10. Immutable, append-only belief store:** Memory reconsolidation suggests overwriting, but trace decay and contradictory beliefs imply older versions persist functionally.

  **Tier C (Probably projecting computers onto neurons)**
  *   **4. Logical constants:** Human reasoning follows probabilistic heuristics rather than strict boolean algebra or formal quantifiers.
  *   **5. Static typing:** Category errors occur but are soft constraints based on semantic similarity rather than hard compile-time failures.
  *   **8. A single serial instruction stream:** The substrate is massively parallel, with serial consciousness emerging as a bottleneck rather than a fundamental instruction stream.

  ### The Hot-Swap Problem

  The evidence fits the **immutable/event-sourced** architecture better because humans consistently exhibit "stale read" errors (acting on old beliefs after updating) that mutable shared memory would preclude. If you assume an event-sourced cognitive architecture where beliefs are traces rather than pointers, **0.75** of the classical Language of Thought picture survives, since compositionality and systematicity remain intact even if the knowledge base is a conflicted log rather than a coherent database.

  ### Compositionality's Load

  **0.6** — Compositionality alone handles productivity and systematicity, but you still need the extra machinery to explain intentionality (aboutness) and the specific inference rules that drive reasoning steps.
