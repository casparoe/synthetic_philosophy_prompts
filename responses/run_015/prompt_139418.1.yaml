  You're conflating an epistemic limitation with an ontological collapse. Yes, talent and effort interact multiplicatively in production, making it impossible to cleanly isolate the marginal product of effort in a paycheck. But the subject matter of desert isn't the output slice; it's the input of will. When Ana chooses to practice, the moral claim stems from the opportunity cost she bears and the discipline she exerts, not from the revenue that results. Talent amplifies the value of that effort, but it doesn't constitute the effort itself. The fact that we can't perfectly disentangle them in the ledger means our measurement tools are imperfect, not that the distinction between what happens to us and what we do is illusory. The carving isn't arbitrary because the agency is real; we redesign institutions to estimate and reward that voluntary input as best we can, accepting noise in the system without surrendering the core distinction.
