answer: |-
  Dear colleague, you know this room better than I do, but having sat through enough of these Friday meetings to know how the air changes when the PI leans forward, I want to walk you through the next twenty minutes as if I were sitting next to you in the hallway. The most important thing you can do in the first two minutes of the Q&A, before anyone even raises a hand, is to concede the ground that isn't worth dying on so you can fortify the ground that is. You should explicitly state that Case Two, the contentless experience patient, is the speculative wing of the prospectus and that you are aware the notion of an experience without phenomenal character borders on the incoherent; tell them you are using it to stress-test the theory rather than as a primary empirical prediction. You should also concede that your vocabulary overlaps significantly with existing literature on attention and metacognition, and that you are not claiming to have discovered a new brain region but rather a functional description that cuts across current categories. By giving them this, you disarm the agnostic philosopher who wants to know if this is testable and the neurologist who worries you are describing ghosts, allowing you to stand firm on the two lines you cannot move without collapsing the thesis. First, you must hold that the indexical registration is constitutive of consciousness, not merely correlated with it, because if it is only correlated you are no longer doing philosophy of mind but merely neuroscience. Second, you must hold that Case One is nomologically possible, because if confidence and discrimination can exist without experience, then confidence cannot be consciousness, and that is the wedge that opens the door for your view against both the workspace theorists and the metacognition students.

  The objection that will do the most damage comes from the graduate students running the psychophysics, and it will arrive in the vocabulary of type-two sensitivity and calibration. They will argue that your self-monitoring mechanism is explanatorily idle because if a patient has intact conceptual metacognition and high calibration, they necessarily have access to the evidence used to generate that confidence, so positing a separate indexical registration adds no predictive power. They will ask whether your mechanism does any work beyond what first-order evidence already explains, and if you say yes, they will ask for the variance in the data that your mechanism accounts for which confidence does not. Your reply needs to be that confidence is an evaluative judgment about the probability of being correct, whereas indexical registration is a non-evaluative selection of a state, and that Case One is precisely the scenario where the evaluation is intact but the selection for phenomenality is broken. You should say that we routinely distinguish between knowing we saw something and actually seeing it, as in blindsight, and that your theory simply locates the blindsight deficit in the monitoring mechanism rather than the first-order pathway. However, this is the first place where you should be willing to admit you do not have the answer yet, because if they press you on whether there is a neural signature for registration distinct from the signature for confidence, you cannot currently point to one without speculating beyond your prospectus. Tell them honestly that dissociating the neural correlates of confidence from the correlates of indexical registration is the primary empirical goal of the dissertation, not a settled fact, and that you are proposing the behavioral dissociation as the way to find those neural markers.

  The second most damaging objection will come from the PI and the postdoc, who hear every higher-order view as workspace broadcasting with extra vocabulary. They will argue that if your indexical registration makes a state conscious, it must be available for report and global coordination, which means it must be ignited and broadcast, so you are just describing the global neuronal workspace with different words. They will use the terms ignition and reportability to suggest that your mechanism is redundant because any state selected for consciousness is by definition broadcast. Your reply should be that broadcasting is a functional consequence of consciousness, not the constitutive mechanism, and that your Case One patient is the counterexample because she has broadcasting sufficient for confidence reports and discrimination but lacks the specific indexical registration required for phenomenality. You need to insist that the workspace theorists conflate access consciousness with phenomenal consciousness, and that your theory allows for a state to be globally available for task performance without being phenomenally lit up by the monitoring mechanism. The soft spot here is that you must explain how a state can be globally available for confidence judgments without being conscious, which sounds like a contradiction to them, so be prepared to clarify that confidence judgments can operate on unconscious statistical evidence without requiring the state itself to be phenomenally present.

  The first-order representationalist on your committee will attack the direction of explanation, arguing that you have not really described a higher-order state but just a first-order state with a relational gloss that collapses your view into hers. She will ask whether the indexical registration is itself a representation, and if it is not, how it can confer consciousness, and if it is, why it cannot misrepresent. She will claim that by making the registration non-conceptual and incapable of misidentification, you have removed the higher-order element and simply described a first-order state that is self-intimating. Your reply must be that the direction of explanation remains higher-order because the first-order state is not conscious in virtue of its own properties but in virtue of being targeted by the monitoring mechanism, and that the inability to misidentify is a feature of the demonstrative nature of the state, not a collapse into first-order theory. You should say that a finger pointing at a tree is not the tree, even if it cannot point at anything else in that moment, and similarly the registration is distinct from the target state even if it is existentially dependent on it. This is a verbal dispute you should decline to fight too hard on the metaphysics, but you must hold that the explanatory work is done by the relation, not the relata.

  The neurologist will ask about the bedside reality and what the scan shows, specifically wondering how you would distinguish your Case One patient from someone in a minimally conscious state or someone with anosognosia. She will want to know what you would say at the bedside if a patient reports no experience but discriminates perfectly, and whether this is clinically distinguishable from denial or aphasia. Your reply should be that you would look for a dissociation between forced-choice discrimination and phenomenological report under conditions where conceptual capacity is verified, similar to protocols used in covert consciousness detection, but that you are proposing this as a theoretical possibility to guide future imaging rather than a current diagnostic tool. This leads to the second place where you should admit you do not have the answer yet, which concerns the nature of the contentless experience in Case Two. If the neurologist presses you on what a bare presence feels like without content, you should concede that this is the weakest part of the prospectus and that you are relying on introspective reports from meditation or sensory deprivation literature that may not be reliable, and that you are open to dropping Case Two if it proves incoherent without damaging the core argument of Case One.

  There is one question you are quietly hoping nobody asks, which is whether the neural substrate of your indexical registration turns out to be identical to the neural substrate of type-two metacognition, which would collapse your dissociation and leave you with no empirical spine. You should not pre-empt this in your last two minutes because raising it yourself invites them to solve the problem for you by saying that identity is the null hypothesis, and you want to maintain the possibility of dissociation without committing to a specific neural architecture before you have done the work. If they ask it, answer that identity would be a significant challenge but would not refute the conceptual distinction, much like how heat and molecular motion are identical but conceptually distinct, and that your goal is to find the functional dissociation first and let the neuroscience follow. Keep your answers tight, stand your ground on the constitutive claim, and remember that a prospectus is a promise of work to come, not a finished theory, so admitting where the work lies is a strength rather than a weakness.
