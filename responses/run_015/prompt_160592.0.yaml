answer: |-
  I've sat on boards where the legal counsel glares at you if you use the word "should" instead of "must," and I've read enough Winner and Latour to know that "politics" isn't just about voting—it's about who gets to sit down. You're right to be worried about the "Neutral" trap. In my experience, declaring a technology neutral is the single easiest way to get sued five years later when the context shifts.

  Here is how I would approach this, given your constraints (time, budget, legal scrutiny, panel composition).

  ### Part 1: Candidate Procedures

  I brainstormed three approaches before settling on the one below.

  **Candidate 1: The Intent Audit.**
  *   *Mechanism:* We ask staff: "Did the designer intend to exclude or privilege a group?" If yes, Political. If no, Neutral.
  *   *Rejection:* **Dead on arrival.** As you noted with the "orphaned designs," intent is often unknowable. Vendors lie, specs are inherited, and "safety" is often a cover for exclusion. This procedure would turn every meeting into a debate about mind-reading. It also lets the city off the hook for *consequences* of design that weren't *intended*.

  **Candidate 2: The Complaint-Driven Trigger.**
  *   *Mechanism:* We only assign a finding if a formal complaint has been lodged or if a specific affected group (e.g., disability council) flags it.
  *   *Rejection:* **Reactive, not proactive.** This violates the remit. It also privileges loud voices over marginalized ones who may not have the capacity to complain. It turns the panel into a grievance committee rather than a review body.

  **Candidate 3: The Arrangement & Access Protocol (Selected).**
  *   *Mechanism:* Focuses on *function* and *access*. Does the artifact require a specific social arrangement to work? Does it alter the cost of access to a public good?
  *   *Why:* It bypasses intent. It works on "orphaned" designs (a standard spec still functions a certain way). It is defensible because it relies on observable constraints, not psychological speculation.

  ---

  ### Part 2: The Arrangement & Access Protocol

  This is the workflow. It is designed to be run in 20 minutes.

  **Step 1: Threshold & Scope**
  *   **Question:** Is the item a physical asset or software >$25k that interacts with the public or staff workflow?
  *   **Stop Condition:** If **No**, issue **"No Finding."**
  *   *[Procedural Note]:* **"No Finding"** means the item falls outside the political remit (e.g., back-office server racks, gravel for potholes). It is not a claim about the object's nature, but a claim about the panel's jurisdiction. **"Neutral"** is *not* used here.

  **Step 2: The Arrangement Test (Winner's Strong Thesis)**
  *   **Question:** Does this artifact *require* a specific hierarchy or authority structure to function at all? (e.g., a nuclear plant requires a military-style chain of command; a toll booth requires a collection authority).
  *   **Action:** If **Yes**, classify as **Political (Loading)**.
  *   *[Judgment Call]:* Determining "requirement" vs. "convenience." **Mark this.** If the panel disagrees, default to "Loading."

  **Step 3: The Access & Exit Test (Winner's Weak Thesis + Your Exit Test)**
  *   **Question:** Does the artifact change the cost (time, money, physical ability) of accessing a public good?
  *   **Sub-Question:** Can an affected person avoid the artifact without losing entitlement to that good?
  *   **Action:**
      *   If it raises costs for a specific group without alternative access: **Political (Channeling).**
      *   If it raises costs equally or improves access for all: Proceed to Step 4.
  *   *[Blind Spot Fix]:* **Mandatory Pause.** Before answering, the Chair must read: "Does any panel member lack the lived experience to assess this cost?" If yes, the finding must include a **Limitation Statement** (see Findings section). Do not pretend you know.

  **Step 4: The Drift & Maintenance Check**
  *   **Question:** Does the political character depend on ongoing funding, staffing, or vendor support? (e.g., a smart meter that works until the server subscription lapses).
  *   **Action:** If **Yes**, attach a **Review Trigger** (e.g., "Re-evaluate if contract is not renewed").
  *   *[Judgment Disguised as Procedure]:* Deciding what counts as "essential support." **Mark this.** This is where you catch the "orphaned" politics.

  **Step 5: Final Classification**
  *   **Political (Loading):** The design settles a contest by making one option impossible (e.g., armrests prevent sleeping).
  *   **Political (Channeling):** The design makes one option costly/difficult but not impossible (e.g., a toll).
  *   **Neutral:** The artifact was tested in Steps 2 & 3 and found to distribute access/equity equally or improve it without exclusion.
      *   *[Solicitor Warning]:* **"Neutral"** is a high-bar claim. It requires evidence that access is equitable. If you cannot prove equity, default to **"No Political Character Identified"** (which is different from Neutral; it means "we looked and saw nothing obvious," leaving the door open for future challenge).
      *   *[Recommendation]:* **Drop "Neutral" entirely.** Use **"No Political Character Identified" (NPC)**. "Neutral" implies an ontological truth. "NPC" implies a procedural outcome. It survives legal scrutiny better.

  ---

  ### Part 3: Addressing Your Sticking Points

  1.  **Loading/Channeling/Latent:** I have dropped "Latent." It is a bucket for "we don't know." Instead, use the **Drift & Maintenance Check** (Step 4). If the politics depend on context, flag it for re-review. Don't categorize the uncertainty; manage it.
  2.  **The Exit Test:** Built into Step 3. If the answer differs by person (e.g., a wheelchair user vs. a walker), the "cost" is higher for the wheelchair user. That makes it Political (Channeling). You do not need consensus on the *experience*, only on the *constraint*.
  3.  **The Blind Spot:** Addressed in Step 3. You cannot fix the panel's composition in a procedure. You fix it by **declaring the limitation** in the finding. It protects you from accusations of arrogance later.
  4.  **Inherited/Orphaned Designs:** Step 2 handles this. A standard highway spec still "requires" a car to use it. Intent doesn't matter; function does.
  5.  **Maintenance/Drift:** Step 4. If the politics vanish when the budget cuts, the politics are in the budget, not the brick. Flag the dependency.
  6.  **Time:** Step 4's **Review Trigger**. If an item has a "Drift" flag, it gets auto-scheduled for review in 3 years or upon contract renewal.

  ---

  ### Part 4: The Findings (Run on Your Cases)

  Here are the paragraphs exactly as they should appear in the register. Note the tone: dry, specific, defensive.

  **(a) Concrete Planters and Bench Armrests (Underpass)**
  > **Finding: Political (Loading).**
  > **Reasoning:** The installation of fixed armrests and planters physically prevents the use of the bench for sleeping while permitting seated rest. This design settles a contest over the use of public space by rendering one specific behavior (lying down) physically impossible without removing the asset entirely.
  > **Limitation Statement:** The panel notes it contains no members with lived experience of homelessness. This finding is based on physical constraint analysis, not social impact assessment.
  > **Review Trigger:** None. The political character is inherent to the physical form.

  **(b) Prepaid Smart Water Meters (Citywide)**
  > **Finding: Political (Channeling).**
  > **Reasoning:** The remote shut-off feature alters the cost of accessing water based on financial liquidity. While an opt-out exists, the requirement of a $40 fee and an in-person visit to City Hall imposes a higher time and monetary cost on users who cannot maintain prepaid credit, effectively channeling low-income users into a more precarious service arrangement.
  > **Limitation Statement:** None.
  > **Review Trigger:** Re-evaluate if the opt-out fee or process is amended. The political character is dependent on the administrative burden surrounding the technology.

  **(c) Curb Extensions and Raised Crosswalk (Neighbourhood Safety)**
  > **Finding: Political (Loading).**
  > **Reasoning:** The raised crosswalk prioritizes pedestrian safety and flow over vehicular speed and volume. By physically forcing vehicles to slow down, the artifact settles a contest between road users, removing the option for drivers to maintain previous speeds through the intersection.
  > **Distinction:** Unlike exclusionary loading, this design expands access to safe passage for a vulnerable group (pedestrians/children) by constraining the capacity of a privileged group (drivers). It is political because it redistributes right-of-way, not because it denies public entitlement.
  > **Limitation Statement:** Panel members recused from voting on this item due to prior advocacy, but the finding stands on the functional redistribution of road space.
  > **Review Trigger:** Monitor traffic diversion patterns. If vehicle traffic is displaced to adjacent neighbourhoods without similar safety measures, the political character may shift from local safety to regional inequity.

  ---

  ### Part 5: What This Procedure Cannot Do (Failure Modes)

  You asked for the blind spots of the procedure itself. If you run this faithfully, here is where it will still fail you.

  **1. It Cannot Measure Magnitude (The "So What?" Problem)**
  The procedure identifies *that* there is politics, not *how much*. A planter that stops one sleeper and a dam that floods a valley both trigger "Political (Loading)." The finding does not help the Council weigh the severity.
  *   *Risk:* The Council treats all "Political" findings as equal liabilities. You may find yourself arguing that the curb extension is "good politics" while the procedure labels it the same category as the hostile benches.
  *   *Mitigation:* Use the "Distinction" clause (as I did in Case C) to manually annotate the *direction* of the power shift.

  **2. It Cannot Resolve Moral Worth (The "Good Politics" Trap)**
  The procedure is agnostic. It will label a surveillance camera system "Political (Loading)" because it requires a monitoring hierarchy. It will not tell you if that surveillance is *justified* by crime reduction.
  *   *Risk:* The panel becomes a place where bad decisions are legitimized because they "followed the procedure." A finding of "Political (Channeling)" can be read as a warning, or it can be read as a permission slip ("We knew it was political, we did it anyway").
  *   *Mitigation:* Ensure the public register makes it clear that a "Political" finding is a disclosure, not an approval.

  **3. The "Standard Spec" Shield (Bureaucratic Camouflage)**
  This is the biggest failure mode. Staff will begin to write reports saying, "This is a Provincial Standard, therefore Step 2 (Arrangement) does not apply." They will try to use "inherited design" to bypass the review.
  *   *Risk:* The procedure becomes a rubber stamp for anything copied from a manual.
  *   *Mitigation:* You must enforce Step 2 rigorously. A standard spec is still a design choice adopted by *this* city. If the manual says "build a 4-lane road," that is a political choice to prioritize cars. Do not let "standard" mean "neutral."

  **4. The "Confidently Wrong" Output**
  Because the procedure forces a binary (Political/Not), it generates confident language for complex situations. If you miss a nuance in Step 3 (Access), you produce a "Neutral" (or NPC) finding that is confidently incorrect.
  *   *Risk:* Five years later, when the smart meter system disproportionately shuts off water in one neighbourhood, the public will pull this finding from the register and say, "They knew, and they said it was fine."
  *   *Mitigation:* This is why the **Limitation Statement** is vital. It is your insurance policy. It tells the future reader: "We were blind here. Don't blame us for what we couldn't see, but don't trust us either."

  **Final Advice:**
  You are worried about the curb extensions. Do not flinch. If you label the safety measures "Political," you are not equating them with hostile architecture; you are admitting that *safety is a political distribution of risk.* That is a stronger position than pretending it's just "engineering." It allows you to say: "Yes, we chose to protect the child over the driver's speed. That is a political choice, and we own it." That is how you survive the argument.
