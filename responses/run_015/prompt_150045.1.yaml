  **JOINT STATEMENT ON THE ONTOLOGICAL STATUS OF THE QUANTUM WAVEFUNCTION**

  **Undersigned:**
  The Proponent of Psi-Ontic Realism
  The Proponent of Psi-Epistemicism

  **Date:** 24 October 2023

  **Preamble**
  We, the undersigned, having engaged in a sustained and good-faith adversarial collaboration, hereby record the points of convergence and divergence regarding the interpretation of the quantum wavefunction. Our aim is not to force a premature consensus, but to delineate precisely where our metaphysical commitments diverge despite shared acceptance of the scientific formalism. This document serves as a record of our current dialectical position.

  ### I. Agreed Claims

  We jointly affirm the following propositions as the common foundation of our discourse:

  1.  **Mathematical Formalism:** We both accept the standard mathematical formalism of quantum mechanics as the correct framework for calculating probabilities of experimental outcomes. This includes the representation of systems within a Hilbert space, unitary evolution via the Schrödinger equation, and the application of the Born rule for assigning probabilities to measurement outcomes.
  2.  **The Measurement Problem:** We acknowledge the existence of the measurement problem. We agree that there is a tension between the linear, deterministic evolution of the wavefunction and the occurrence of definite, singular outcomes in experimental practice. We further agree that any complete interpretation must offer a coherent account of how definite outcomes arise.
  3.  **Empirical Adequacy:** We affirm that quantum mechanics is empirically adequate within all currently tested domains. Neither of us proposes a modification to the formalism that would alter the predicted statistical distributions of outcomes in standard laboratory settings.
  4.  **Constraints on Ontological Models:** We agree that any viable ontological model underlying quantum phenomena must reproduce quantum statistical predictions. Furthermore, we agree that such models must respect parameter independence in Bell-type scenarios, ensuring that setting choices at one location do not superluminally influence the physical state at a spacelike separated location, thereby preserving consistency with relativity.
  5.  **Distinguishability of Pure States:** We agree that distinct pure quantum states, while potentially yielding identical predictions for specific limited measurements, must diverge in their predictions for some possible measurement. Consequently, no two distinct pure states are empirically equivalent across all possible measurements.

  ### II. Record of Disagreements

  The following table summarises our fundamental disagreements. Each position is phrased in terminology that the respective proponent finds accurate and acceptable.

  | Topic | Psi-Ontic Realist Position | Psi-Epistemicist Position |
  | :--- | :--- | :--- |
  | **Determination of the Wavefunction** | The wavefunction is uniquely determined by the underlying ontic state of an individual system. If two systems possess identical physical properties, they must be described by the same wavefunction. | The wavefunction is not uniquely determined by the ontic state. Distinct wavefunctions may correspond to overlapping probability distributions over the same underlying ontic state, reflecting different states of knowledge regarding the same physical reality. |
  | **Preparation Independence** | The assumption of preparation independence is a justified and natural constraint. If two systems are prepared independently using distinct devices, their ontic states must be statistically independent. Violating this renders the model conspiratorial. | The assumption of preparation independence is not a necessary constraint on ontological models. Correlations in the ontic state may exist even when preparation procedures appear independent, without implying a conspiracy, but rather reflecting a holistic constraint on the state space. |
  | **Subjectivity and Agreement** | An epistemic view risks rendering the quantum state subjective in a manner incompatible with robust intersubjective agreement. If the state is merely knowledge, it is difficult to explain why distinct agents cannot hold contradictory, yet equally valid, state assignments that lead to conflicting expectations of physical reality. | An epistemic view does not entail radical subjectivity. Intersubjective agreement is secured by the norms of rational belief updating and shared access to preparation data. Distinct agents may assign different states based on different information, but this reflects their epistemic perspective, not a contradiction in the physical world. |

  ### III. Identified Cruxes

  We identify the following two specific scenarios as critical testing grounds for our respective interpretations. We agree on the relevance of these cases, though we diverge on what they demonstrate.

  **Crux A: Weak Measurement Trajectories and Disjoint Agent Data**
  *   **The Concrete Case:** A single particle is prepared in a superposition. It is subjected to a sequence of weak measurements that reveal expectation-value trajectories without inducing immediate state collapse. Subsequently, two agents observe the system, each having access only to a disjoint subset of the trajectory data.
  *   **Agreed Relevance:** This case tests whether the reconstructed trajectory is a property of the particle itself or a construct dependent on the information available to the observer.
  *   **Psi-Ontic Prediction:** We assert that the trajectory reflects the actual physical path of the particle. If agents reconstruct different trajectories due to disjoint data, at least one reconstruction is factually incomplete regarding the physical state. The wavefunction describes the objective guide-wave or physical field governing this trajectory.
  *   **Psi-Epistemic Prediction:** We assert that the trajectory is an inference drawn from available data. Distinct agents may validly assign distinct trajectories (and thus distinct wavefunctions) to the same ontic particle based on their disjoint data subsets. Neither is 'wrong' regarding the ontology; they simply possess different information about the same underlying reality.

  **Crux B: The Implications of Quantum State Tomography**
  *   **The Concrete Case:** An experimenter performs quantum state tomography on an ensemble of identically prepared systems to reconstruct the density matrix or wavefunction.
  *   **Agreed Relevance:** This case addresses whether the process of state reconstruction discovers a physical shape or compiles a statistical summary.
  *   **Psi-Ontic Prediction:** We contend that successful tomography implies the state describes an objective feature of the system. The convergence of the reconstructed state indicates that the experimenter is measuring a pre-existing physical property of the ensemble.
  *   **Psi-Epistemic Prediction:** We contend that tomography merely summarises an agent's information. The convergence of the reconstructed state demonstrates the consistency of the preparation procedure and the reliability of the updating rules, not the existence of a wave-object residing in the system.

  ### IV. Assessment of Verbal versus Substantive Disagreement

  In conclusion, we assess the nature of our divergence. We find that a portion of our disagreement is verbal, specifically concerning the definition of the terms "real" and "objective."

  The Psi-Ontic Realist employs "real" to mean "mind-independent existence," such that the wavefunction must exist as a physical entity regardless of whether any observer possesses information about it. The Psi-Epistemicist employs "objective" to mean "constrained by public norms and evidence," allowing the wavefunction to be real as a relational property between a system and an observer, without existing as a freestanding entity.

  However, we agree that the disagreement is not *merely* verbal. There remains a substantive disagreement regarding the validity of the Preparation Independence assumption utilised in no-go theorems (such as the PBR theorem). The Realist views the violation of this assumption as physically implausible, whereas the Epistemicist views it as a viable metaphysical option. Until this specific constraint is experimentally or theoretically resolved, our positions remain substantively distinct interpretations of the same formalism.

  **Signed,**

  __________________________
  Proponent of Psi-Ontic Realism

  __________________________
  Proponent of Psi-Epistemicism
