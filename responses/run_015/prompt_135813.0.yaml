      *   **Commitment (3):** Separateness of Persons: Blocks harm-aggregation in rescue, allows benefit-aggregation in institutions. Reason: Institutional roles create different moral reasons.
      *   **Commitment (4):** Special Obligations (Child vs. Strangers): Can save child over strangers. But numbers don't scale justification (Child + 4 strangers $\neq$ 5x justification).
      *   **Commitment (5):** Unification: Two functions (Non-aggregative for rescue, Aggregative for institutions). Switch based on *structural nature of context*, not emotion.

  2.  **Initial Assessment & Goal:**
