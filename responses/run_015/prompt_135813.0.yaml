      *   **Evaluating (4) - Special Obligations:**
          *   Does it smuggle numbers? If the justification is "my child," the number of strangers is morally inert regarding the *strength* of the obligation. However, if the strangers have *some* claim (even non-aggregative), does 5 claims outweigh 1 claim? Taurek says no (claims aren't additive). User agrees. So (4) is consistent with (1).
          *   *Tension:* The "option set" point. If resources are fixed, saving 5 strangers might save more "life" overall. But User rejects that metric in direct rescue. So (4) holds.
      *   **Evaluating (5) - Dualism:**
          *   Is it coherent? Yes, if grounded in "Ex-Ante Contractualism" (institutions) vs. "Ex-Post Complaints" (rescue).
          *   *Risk:* If the switch is purely structural, what defines the structure?
