      *   **Dissolved Tension:** The idea that (4) smuggles numbers in. It doesn't, provided the special obligation is lexical or overriding, not additive.
      *   **Least Costly Revision:** Refine the definition of "Institutional." Move from "Institutional vs. Personal" to "Ex-Ante Policy vs. Ex-Post Implementation." This preserves the intuition while hardening the boundary against the "collapse" objection.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on (4):* The user says "saving one's child plus four others is not five times as justified." This implies the justification is *fixed* by the child. But what if the choice is {Child} vs {5 Strangers}? If I save the child, I ignore 5 claims. If I save the 5, I ignore 1 claim (plus the special obligation). If claims don't aggregate, 5 claims = 1 claim (in terms of "a claim exists"). So the special obligation breaks the tie. This is consistent.
