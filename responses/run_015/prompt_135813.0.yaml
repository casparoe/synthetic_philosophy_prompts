      *   **Tension A: The "Structural Nature" Distinction (Commitments 1, 2, 3, & 5).**
          *   *Issue:* Is the line between "direct rescue" and "institutional allocation" clear enough to bear the moral weight of switching from randomization to aggregation?
          *   *Critique:* Many "direct rescues" happen within institutional contexts (e.g., an ER doctor choosing between patients). Conversely, institutional policies often result in direct, identifiable choices.
          *   *Taurek's Logic:* Taurek argues from the *individual's* loss. If I save 5, I impose a 100% loss on the 1. If I save 1, I impose a 100% loss on the 5. There is no "super-observer" who suffers the sum of losses.
          *   *Institutional Logic:* Institutions act as trustees for the *system*. They maximize expected utility over time.
          *   *Verdict:* This is the classic "Rule vs. Act" or "Role Morality" debate. It's defensible but vulnerable to the "collapse" objection (institutions are just collections of individual acts).
          *   *Severity:* High. This is the core philosophical hinge.

      *   **Tension B: Special Obligations & Numbers (Commitment 4).**
          *   *Issue:* User says save child over 1 stranger. Save child over 5 strangers. But denies the 5 strangers add weight.
          *   *Critique:* If the justification for saving the child is "special obligation," that obligation is binary (is my child involved? Yes/No). If it's binary, then 1 stranger vs. 5 strangers shouldn't matter *unless* the strangers have moral weight. If strangers have *no* aggregative weight (per Commitment 1), then 1 vs. 5 is irrelevant anyway.
          *   *Nuance:* If the user accepts *some* weight for strangers but denies *aggregation*, how do they handle the "option set"?
          *   *Taurek on Special Obligations:* Taurek actually allows partiality. But if I can save my child OR 5 strangers, and I save my child, am I disregarding the 5? If I save my child + 1 stranger vs. 5 strangers, does the 1 stranger tip the scale?
