          *   *Risk:* If the presence of 4 extra strangers *alters the option set* (e.g., resource constraints), does it change the moral landscape? The user says "no."
          *   *Severity:* Medium. It's internally consistent with (1), but intuitively challenging.

      *   **Tension C: Dualism of Functions (Commitment 5).**
          *   *Issue:* Is having two functions "unprincipled dualism"?
          *   *Defense:* Moral pluralism often requires different principles for different spheres (e.g., family vs. state). If the *source* of the obligation differs (personal agency vs. fiduciary role), different calculus is expected.
