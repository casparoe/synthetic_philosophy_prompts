answer: |-
  This is a classic move in the bioethics literature (you're effectively debating a streamlined version of Alan Shewmon's critique of the President's Council), and your friend is right that it puts immense pressure on the "integrative unity" justification for brain death. However, he is not right that it forces you to abandon neurological criteria or accept that Aisha was dead.

  The error is in **Step (5)**.

  Here is the structure of the problem, the specific fix, and the price you pay for making it.

  ### The Diagnosis: Equivocation on "Integration"

  Your friend's argument hinges on treating "integration" as a generic *output* (stable blood pressure, temperature, pH) rather than a specific *architectural relationship*.

  In Step (5), he claims: *"Nothing in (1) says the integrating has to be done by the brain specifically; what (1) requires is that it be happening at all, from inside."*

  This is the bad step. For a human mammal, (1) and (2) are not separable. The "self" in "self-maintaining" refers to the *organism as a whole*, and in a mammal, the "whole" is constituted by the brain's governance of the parts.

  Here is the distinction you need to drive a wedge between Aisha and the Brain-Dead (BD) patient:

  **1. Executive Control vs. Mechanical Execution**
  *   **Aisha (ECMO):** The *mechanical execution* of circulation is external (the pump), but the *executive control* remains internal. Her brain senses hypoxia, her brain signals distress, her brain attempts to vasoconstrict (even if the vessels are maxed out). The feedback loop **closes in the brain**. The machine is a tool the organism is using (via the clinicians) to survive. The *directive authority* is internal.
  *   **Brain-Dead Patient:** The *mechanical execution* is external (ventilator/pressors), AND the *executive control* is external. The ventilator settings are determined by the clinician, not the brainstem. The pressor doses are determined by the clinician, not the baroreceptors. The feedback loop **closes in the ICU chart**. The body is not using the machine; the machine is animating the tissues.

  **2. The "Capacity" Objection**
  Your friend says appealing to "internal capacity" is question-begging. It isn't, provided you define capacity structurally, not functionally.
  *   **Aisha:** The structural hardware for the feedback loop is intact. The function is blocked by an external obstacle (the failing heart), which is bypassed.
  *   **BD Patient:** The structural hardware for the feedback loop is destroyed. No amount of external support can restore the *source* of the command.

  ### Handling the "Pregnant Woman" Counter-Example

  This is the hardest case, and where your friend feels strongest. If a BD woman regulates hormones enough to gestate a fetus, isn't that "self-regulation"?

  **The Rebuttal:** You must distinguish between **Organismal Integration** and **Cellular/Organ Resilience**.

  *   **Organismal Integration:** This is the brain coordinating the body *in response to the environment* as a single unit. (e.g., Shivering when cold, tachycardia when bleeding).
  *   **Cellular/Organ Resilience:** This is tissues maintaining homeostasis locally via paracrine/autocrine signals without central command. (e.g., Wound healing, gut peristalsis, hormonal pulses from residual pituitary tissue).

  The pregnant BD patient demonstrates *resilience*, not *integration*. The uterus is responding to local hormonal gradients, not a central command. The "wound healing" is cellular mitosis, not an organismal immune response coordinated by the CNS.

  **The Move:** You concede that *biological processes* continue after death. Decomposition is a biological process; so is digestion in a BD gut; so is gestation in a BD uterus. But these are **processes occurring in a corpse**, not evidence of a **living organism**.

  If you define death as the loss of the *organism as a whole*, you can admit that *parts of the organism* remain alive and functional for a time. The pregnant woman is a somatically supported corpse sustaining a separate living organism (the fetus).

  ### The Fix: Modify Step (2)

  You don't give up (2); you sharpen it.

  *   **Old (2):** In an adult mammal, the organ that does that unifying is the brain.
  *   **New (2):** In an adult mammal, the brain is the **critical substrate** for the *kind* of integration that constitutes the organism *as a whole*. Without it, you have a collection of living subsystems, not a unified self-regulator.

  This blocks Step (6). Aisha *was* an organism because the critical substrate (brain) was directing the support. The BD patient is *not* an organism because the critical substrate is gone, even if subsystems persist.

  ### The Price: What This Costs You

  You can hold onto (1), (2), (3), and the intuition that Aisha is alive. But here is the bill for that position:

  **1. You must accept "Post-Mortem Somatic Survival."**
  You have to admit that "death" does not mean "all biological activity stops." You are conceding that a brain-dead body *is* biologically active (healing wounds, gestating fetuses, fighting infection) but is nevertheless *dead*.
  *   *Cost:* This feels counterintuitive to the "biological definition of death." You are effectively saying death is the loss of *hierarchical control*, not the loss of *metabolism*. If a philosophy student presses you on "How is a metabolizing, gestating body dead?", your only answer is: "Because the conductor is gone, even if the orchestra is still playing."

  **2. You accept a "Fuzzy Boundary" on Integration.**
  If integration is the key, and some integration persists in BD (spinal reflexes, hormonal pulses), then death isn't a bright line where integration hits zero. It's a line where *critical* integration is lost.
  *   *Cost:* You have to defend why *brainstem* integration is the "critical" kind and why spinal/hormonal integration doesn't count. You can't just say "because the law says so." You have to argue that without the brainstem, the body no longer acts *on behalf of itself* in response to the environment.

  **3. You cannot use "Irreversibility" alone.**
  Your friend mentioned "permanent vs. irreversible." If you rely solely on the integration argument, you have to be careful. If we could hook a BD brain up to a super-computer that restored integration, would they be alive?
  *   *Cost:* You are committed to the view that the *biological structure* matters, not just the *functional output*. If a machine replicates the integration perfectly, the "Whole Brain" view struggles. You have to insist that the integration must be *biological* and *immanent* to the organism, not simulated externally.

  ### Summary for Your Reading Group

  Tell him this:

  > "You're conflating **governance** with **power**. Aisha's body is externally powered but internally governed. The brain-dead body is externally powered and externally governed.
  >
  > Step (5) fails because for a human organism, 'self-regulation' isn't just homeostasis; it's homeostasis directed by the CNS. The pregnant brain-dead woman isn't proof of organismal life; she's proof that tissues survive organismal death. She is a collection of living subsystems, which is exactly what Premise (1) says a non-organism is.
  >
  > I'm keeping (1), (2), and (3). The cost is admitting that 'death' allows for residual biological function, but that doesn't make the corpse an organism."

  This keeps you in the "Whole Brain" camp, saves Aisha, and acknowledges the BD pregnant woman without conceding she is "alive" in the morally relevant sense.
