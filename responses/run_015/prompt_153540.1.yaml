      *   *Requirement 4: Moral Development.* How do we get better? If situations control us, can we train ourselves?
      *   *Requirement 5: Unity/Fragmentation.* Are virtues unified (Aristotle) or fragmented (Situationism suggests)?

  4.  **Refining and Categorizing (Non-Negotiable vs. Camp Preferences):**

      *   *Non-Negotiable:* Must match data (Empirical Adequacy), Must offer action guidance (Normative Force), Must explain improvement (Moral Education).
