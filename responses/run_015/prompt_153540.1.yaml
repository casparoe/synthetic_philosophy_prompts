answer: |-
  Here is the specification for a virtue theory that attempts to integrate the situationist critique. Think of this as a requirements document for a system refactoring: the legacy code (Classical Aristotelianism) is being patched to handle new runtime data (Social Psychology).

  ### Core Desiderata (Requirements)

  #### 1. Empirical Adequacy
  *   **Requirement:** The theory's model of human psychology must not contradict robust experimental data regarding behavioral variance.
  *   **Reasoning:** If the ethical theory posits a psychological mechanism (e.g., "a courageous person always acts courageously") that is falsified by data (e.g., "people act courageously only when not in a hurry"), the theory fails as a practical guide for real humans.
  *   **Status:** **Non-Negotiable.** (A theory describing angels is useless for humans.)

  #### 2. Normative Action-Guidance
  *   **Requirement:** The theory must provide criteria for distinguishing better actions from worse actions and offer a path to improvement.
  *   **Reasoning:** Pure descriptive psychology is not ethics. Even if traits are fragile, the system must still output "do this, not that."
  *   **Status:** **Non-Negotiable.** (Without this, it ceases to be an ethical theory.)

  #### 3. Local Trait Stability
  *   **Requirement:** The theory must posit character traits that are stable *within specific, narrow contexts* rather than across all contexts.
  *   **Reasoning:** Global traits (e.g., "Honesty" in all situations) are empirically unsupported. Local traits (e.g., "Honesty when filing taxes") show higher predictive validity. The theory must anchor virtue in these narrower bands.
  *   **Status:** **Non-Negotiable** (for a situationist-compatible theory). **Camp Preference** for Classical Virtue Ethicists (who prefer Global Traits).

  #### 4. Situational Engineering Capability
  *   **Requirement:** The theory must treat the modification of one's environment as a moral duty, not just a workaround.
  *   **Reasoning:** If situations drive behavior more than internal character, then "managing the situation" is a more effective moral strategy than "strengthening the will." Moral agency includes curating inputs.
  *   **Status:** **Non-Negotiable.**

  #### 5. The Unity of Virtues (Coherence)
  *   **Requirement:** Possessing one virtue implies possessing all others (e.g., you cannot be truly courageous without being wise and just).
  *   **Reasoning:** Classical view ensures moral consistency. Situationist view suggests moral fragmentation (one can be brave but dishonest).
  *   **Status:** **Camp Preference.** (Classical = Required; Situationist-Compatible = Optional/Rejected).

  ---

  ### Compatibility & Unsatisfiability Analysis

  **The Primary Conflict: Global Traits vs. Full Situation-Sensitivity**
  *   **Verdict:** **Jointly Unsatisfiable.**
  *   **Explanation:** You cannot maintain that character traits are robust, global predictors of behavior *and* accept the situationist data that behavior varies wildly based on minor contextual shifts.
  *   **Resolution:** To satisfy Empirical Adequacy, you must downgrade Global Traits to Local Traits. You sacrifice the elegance of a unified character for the accuracy of context-dependent dispositions.

  **Cross-Situational Consistency**
  *   **Status:** **Severely Constrained.**
  *   **Analysis:** In a classical system, consistency is the definition of virtue. In a situationist-compatible system, cross-situational consistency is an anomaly, not the norm. The theory must explain why consistency happens (e.g., overlapping local traits) rather than assume it.
  *   **Constraint:** You can only expect consistency across *structurally similar* situations. Expecting consistency across *structurally diverse* situations (e.g., battlefield vs. boardroom) is a spec error.

  **Moral Fragmentation**
  *   **Is it real?** **Yes.** Empirically, people display "moral silos." A person may be scrupulously honest in financial matters but casually dishonest in social matters.
  *   **Is it a constraint?** **Yes.** It prevents the theory from promising a "unified self."
  *   **Impact:** The theory must account for the possibility that a user can be "virtuous" in Module A but "vicious" in Module B without the system crashing. This rejects the Aristotelian "Unity of Virtues."

  **Moral Education (The Patch Process)**
  *   **Classical Approach:** Habituation through repetition until the trait becomes internal and automatic.
  *   **Situationist-Compatible Approach:** Habituation + **Environmental Design.**
  *   **Requirement:** Education must teach agents to recognize high-risk situational triggers (e.g., fatigue, authority pressure, anonymity) and deploy external constraints (checklists, accountability partners) rather than relying solely on internal resolve.
  *   **Shift:** From "Be a better person" to "Build a better context for the person you are."

  ---

  ### The "Killer" Requirement

  **Which single requirement does the most damage to the Classical Aristotelian picture?**

  **Requirement #3: Local Trait Stability (The Rejection of Global Robustness).**

  **Why:**
  Aristotelian virtue ethics relies on the existence of *hexis* (stable dispositions). The entire architecture assumes that if you cultivate Courage, you become a "Courageous Person" who acts courageously *qua* courageous person across the domain of human life.

  By forcing the theory to accept **Local Trait Stability**, you fundamentally refactor the ontology of the agent.
  1.  **Identity Fragmentation:** The agent is no longer a "Courageous Person" but a "Person-Who-Is-Courageous-In-Context-X."
  2.  **Predictive Failure:** You can no longer look at a person's past virtue in one domain to predict their behavior in a new domain.
  3.  **Teleological Break:** Aristotle's ethics aims at *Eudaimonia* (flourishing) via a unified character. If character is fragmented into local scripts, the concept of a unified "good life" becomes difficult to define.

  **Summary for the Engineer:**
  To make virtue ethics work with situationist data, you have to treat "Character" not as a monolithic kernel-level property, but as a collection of micro-services that only function reliably within specific API boundaries (situations). The cost is that you lose the guarantee of system-wide consistency.
