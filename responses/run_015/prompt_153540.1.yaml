      *   **Goal:** Desiderata (requirements) for an adequate virtue theory that takes situationism seriously.
      *   **Format:** List each requirement with reasoning, mark Non-Negotiable vs. Camp Preferences, identify joint unsatisfiability (especially global traits vs. situation-sensitivity), cover specific topics (cross-situational consistency, local trait activation, moral education, moral fragmentation), flag the single most damaging requirement to Aristotelianism.
      *   **Constraint:** No citations or reading lists.

  2.  **Deconstruct the Core Conflict:**
      *   *Virtue Ethics (Classical):* Relies on stable, global character traits (virtues) that predict behavior across diverse situations. A courageous person acts courageously in war, politics, and social settings.
      *   *Situationism (Social Psych):* Empirical evidence suggests behavior is heavily influenced by situational variables (Milgram, Stanford Prison, Good Samaritan study). Global traits don't predict behavior well. People act differently in slightly different contexts.
      *   *The Task:* What does a *revised* virtue theory need to look like to survive this critique?

  3.  **Drafting the Desiderata (Requirements):**

      *   *Requirement 1: Empirical Adequacy.* The theory can't ignore the data. It must align with how humans actually behave.
      *   *Requirement 2: Normative Guidance.* It still needs to tell us how to *live*, not just describe behavior. It can't just be psychology; it needs ethics.
