answer: |-
  You have identified the exact metaphysical fault line that makes the definition of life philosophically unstable. You are describing a conflict between **Occurrent** and **Dispositional** properties, manifesting in biology as **Vital Decoupling**.

  There is no single dictionary word that captures the entire phenomenon, because it sits at the intersection of metaphysics (the nature of properties) and philosophy of biology (the definition of life). However, the specific "move" you identified has a precise name, and the pattern of cases has a descriptive label that distinguishes it from general fuzziness.

  ### 1. The Name of the Move: Dispositionalism vs. Occurrentism

  The structural move you noticed—"classifying a present object by a hypothetical future activity"—is the difference between treating life as an **Occurrent Property** versus a **Dispositional Property**.

  *   **Occurrent Properties:** What a thing is doing *right now*. (e.g., "The dog is metabolizing," "The seed is frozen.")
  *   **Dispositional Properties:** What a thing *would* do under specific conditions. (e.g., "The glass is fragile," "The seed is viable.")

  Your argument with your friend persists because you are oscillating between these two modes without realizing it.
  *   When you argue the **virus** is not alive, you are using an **Occurrent** criterion (it is currently inert).
  *   When you argue the **seed** is alive, you are using a **Dispositional** criterion (it *would* grow if planted).
  *   When you argue the **mule** is "less alive," you are penalizing a missing **Dispositional** property (reproduction) despite the presence of an **Occurrent** one (metabolism).

  In philosophy, this is known as the **Categorical vs. Dispositional** debate. In the specific context of your argument, you are fighting over the **Modal Status of Life**. (Modal logic deals with necessity and possibility; you are arguing whether life is a state of *being* or a state of *potential*.)

  ### 2. The Name of the Pattern: Vital Decoupling

  The pattern you observed—where the "object" and the "activity" come apart—is best described as **Vital Decoupling**.

  In "easy" cases (a dog), the Substrate (the dog) and the Process (living) are coupled. They start and stop together. In your "hard" cases, they decouple:
  *   **Temporal Decoupling:** The process pauses, but the substrate remains (the seed, the spore).
  *   **Spatial/Host Decoupling:** The process requires a different substrate to run (the virus).
  *   **Lineage Decoupling:** The process continues, but the original substrate is gone (the cell line).
  *   **Teleological Decoupling:** The substrate runs the process, but the future-directed goal is broken (the mule).

  **Why "Cluster Concept" is not the answer you want:**
  You rightly rejected "it's a cluster concept." That phrase explains *why* there is disagreement (people weight criteria differently), but it does not name the *structure* of the disagreement. "Cluster Concept" is the landscape; **Dispositional/Occurrent Conflict** is the weapon being used in the fight. Knowing it's a cluster concept doesn't tell you *which* criteria are clashing. Identifying the Dispositional/Occurrent split tells you exactly why the seed and the virus trigger the argument while the dog does not.

  ### 3. Applying the Account: The Test Cases

  If we accept that the argument is about **Vital Decoupling** driven by **Dispositional Attribution**, here is how the cases should be carved.

  **The Criterion:** An entity is "Alive" if it possesses the **Dispositional Capacity for Autopoiesis** (self-maintenance and self-reproduction), even if that capacity is currently unexpressed.

  *   **The Candle Flame:** **Not Borderline.**
      *   *Analysis:* A flame is an *occurrent* process without a *dispositional* substrate. It does not carry the instructions to rebuild itself; it merely consumes fuel. If you remove the fuel, it doesn't wait; it ceases. It has no "potential" to burn other than the immediate chemical reaction.
      *   *Verdict:* Dead. It fails the Dispositional test completely.

  *   **The Mule:** **Borderline (Lineage), but Alive (Organism).**
      *   *Analysis:* The mule is Occurrently alive (metabolism). It is Dispositionally alive regarding self-maintenance. It is Dispositionally *dead* regarding lineage (reproduction).
      *   *Verdict:* This breaks the "Reproduction" criterion of life. Under your account, the mule reveals that "Life" applies to the *individual* (metabolism) more than the *lineage* (evolution). It should be classified as Alive, but the argument highlights that "Life" is often conflated with "Evolutionary Viability."

  *   **The Cell Line (HeLa):** **Alive, but not an Individual.**
      *   *Analysis:* This is a case of **Lineage Decoupling**. The process (cell division) continues. The disposition (to grow) is active. The original substrate (Henrietta Lacks) is gone.
      *   *Verdict:* The cells are alive. The *person* is dead. This case breaks the intuition that "Life" belongs to a specific bounded object. It shows life is a process that can hop substrates.

  *   **The Computer Virus:** **Borderline (Analogue).**
      *   *Analysis:* This is **Host Decoupling** identical to the biological virus. It has information (code) and a disposition to replicate *if* in a host (computer). It lacks a physical boundary of its own.
      *   *Verdict:* If you define life by **Information + Disposition**, it is alive. If you define life by **Chemistry + Autopoiesis**, it is not. This case should be borderline because it tests whether "Life" requires carbon or just "Pattern."

  ### 4. What Would Break the Carving?

  You asked what a case would have to look like to break this account rather than just be a hard call inside it.

  The **Dispositional/Occurrent** framework relies on the idea that there is a physical substrate holding the disposition (the seed holds the "potential" to grow). To break this carving, you would need a case of **Disembodied Disposition**.

  **The Breaker Case: The Perfect Upload.**
  Imagine a human consciousness is scanned and uploaded to a server. The biological body is destroyed.
  *   **Occurrent:** The biological body is dead (no metabolism).
  *   **Dispositional:** The "person" can still talk, think, and interact (the process continues).
  *   **The Break:** If you say the Upload is "Alive," you have admitted that **Life is purely Process** and the Substrate doesn't matter (destroying the "Object" side of your argument). If you say the Upload is "Dead," you have admitted that **Life is purely Substrate** and the Activity doesn't matter (destroying the "Seed/Virus" side of your argument).

  This case forces a choice that the seed and virus allow you to dodge. The seed allows you to say "The object holds the potential." The virus allows you to say "The process borrows the object." The Upload forces you to admit whether the "Life" is in the *matter* or the *pattern*.

  ### Summary
  *   **The Move:** **Dispositional Attribution** (classifying by hypothetical capacity).
  *   **The Pattern:** **Vital Decoupling** (separation of substrate and process).
  *   **The Verdict:** Stop arguing about whether the thing *is* alive. Argue about whether the **Dispositional Capacity** outweighs the **Occurrent State** in that specific context. The seed is dispositionally alive. The virus is dispositionally alive but occurrently inert. The mule is occurrently alive but dispositionally sterile.

  Your friend is trying to define Life as a **Noun** (a thing you have). You are noticing that Life behaves like a **Verb** (a thing you do) that can be paused, borrowed, or fragmented. The word you are looking for is that you are arguing about the **Reification of a Process**.
