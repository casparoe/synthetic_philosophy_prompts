answer: |-
  ### Landscape Analysis

  To locate this pattern precisely, we must first map the surrounding decision-theoretic terrain. The phenomenon you describe sits at the intersection of four distinct paradox classes:

  1.  **Pascal's Mugging (Single-Shot):** A dominant expected-value outlier ($p \times U \gg \text{cost}$) compels acceptance despite epistemic suspicion. *Distinction:* Your case involves no single dominant outlier; the pressure is cumulative.
  2.  **The St. Petersburg Paradox (Divergent Series):** An infinite sequence of bets where the expected value diverges to infinity. *Distinction:* Your series converges to a bounded sum. The irrationality does not stem from infinite expectation, but from the mismatch between local and global optimization.
  3.  **The Money Pump (Cyclic Preferences):** An agent pays to swap $A \to B \to C \to A$, ending with $A$ minus money. *Distinction:* Money pumps require intransitive preferences. Your agent may have perfectly transitive preferences; the trap arises from *conditional access* and *sequential structure*, not preference cycles.
  4.  **Satan's Apple (Sequential Thresholds):** An agent is offered infinite slices of an apple; each slice is beneficial, but consuming *all* slices triggers expulsion from paradise. *Distinction:* This is the closest cousin. However, Satan's Apple typically relies on a deterministic catastrophe threshold (taking "all" is bad). Your case relies on *probabilistic convergence* where the total expected return is simply insufficient to justify the total reserve cost, yet local option value drives acceptance.

  ### Diagnosis and Naming

  There is no single, canonical proper noun (like "Newcomb's Problem") universally assigned to this exact configuration in the standard literature. It is typically discussed as a variant of **Dynamic Inconsistency in Sequential Expected Utility Maximization** or a probabilistic version of **Quinn's Self-Torturer**.

  However, because the mechanism relies specifically on the *Pascalian* structure (low probability, high payoff) chained via *conditional access* to create a *locking* effect, I propose we coin the term:

  ## **The Convergent Pascal Ratchet**

  This term captures the three essential features: the **Pascalian** nature of the individual bets (tiny $p$, huge $U$), the **Convergent** sum (distinguishing it from St. Petersburg), and the **Ratchet** mechanism (each step locks the agent into the next, preventing retreat without loss).

  ---

  ### Conceptual Carving: Necessary and Sufficient Conditions

  For a decision scenario to qualify as a **Convergent Pascal Ratchet**, the following conditions must be met:

  1.  **Sequential Conditionality:** The opportunity to engage with decision node $n+1$ is strictly contingent on accepting the cost of decision node $n$. Rejection terminates the sequence.
  2.  **Pascalian Gradient:** At each step $n$, the probability $p_n$ decreases (e.g., exponentially) while the payoff $U_n$ increases (e.g., linearly or super-linearly), such that the local expected value $E_n = p_n \times U_n$ remains significant relative to the local cost $C_n$.
  3.  **Convergent Global Expectation:** The sum of expected values over the entire infinite (or indefinite) chain converges to a finite bound: $\sum_{n=1}^{\infty} E_n = K$, where $K$ is modest.
  4.  **Global Net Negative:** The total cost of completing the chain (or the required resource reserve to sustain it) exceeds the total convergent expectation: $\sum C_n > \sum E_n$. A global maximizer at $t=0$ would reject the chain.
  5.  **Local Rationality (Option Value):** At any step $k$, the expected value of the *remaining* chain (from $k$ to $\infty$) exceeds the *remaining* costs. Thus, a sequential agent who cannot precommit at $t=0$ calculates that accepting step $k$ is rational because it preserves the *option value* of steps $k+1 \dots \infty$.
  6.  **Absence of Precommitment:** The agent lacks the ability to bind their future selves to the global plan. If they could commit at $t=0$ to reject the whole chain, the paradox dissolves.

  ### Distinctions from Related Paradoxes

  | Phenomenon | Primary Driver | Expectation Sum | Preference Structure | Distinguishing Feature |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pascal's Mugging** | Single Outlier | Finite (usually) | Transitive | One-shot; no sequential locking. |
  | **St. Petersburg** | Divergent Series | **Infinite** | Transitive | EV diverges; irrationality lies in pricing infinity. |
  | **Money Pump** | Preference Cycle | N/A | **Intransitive** | Agent returns to start state minus resources. |
  | **Self-Torturer** | Vague Threshold | Deterministic | Intransitive/Vague | Outcomes are certain; pain/utility is vague. |
  | **Satan's Apple** | Catastrophe Threshold | Divergent/Finite | Transitive | Trigger is *taking all*; here, trigger is *resource depletion*. |
  | **Convergent Pascal Ratchet** | **Option Value Lock** | **Convergent** | **Transitive** | **Local EV > Cost due to future access; Global EV < Cost.** |

  ### Boundary Cases and Edge Mapping

  To sharpen the definition, we must examine where the Ratchet breaks or transforms.

  **1. The Finite Chain (The "Short Ratchet")**
  If the chain has a known, fixed endpoint $N$, the paradox collapses via **Backward Induction**.
  *   *Reasoning:* At step $N$, there is no future option value. The agent evaluates $E_N$ vs. $C_N$. If $E_N < C_N$ (which it must be for the Global Net Negative condition to hold eventually), the agent rejects $N$. Knowing this, the option value at $N-1$ vanishes, causing rejection at $N-1$, and so on to $t=0$.
  *   *Boundary:* The Convergent Pascal Ratchet *requires* an indefinite or unknown horizon to sustain the option value illusion.

  **2. Non-Exponential Probabilities (The "Fat Tail" Variant)**
  If probabilities fall linearly ($1/n$) while payoffs grow linearly ($n$), the expected value per step becomes constant.
  *   *Outcome:* If $E_n > C_n$ for all $n$, the sum diverges (St. Petersburg territory).
  *   *Outcome:* If $E_n < C_n$ for all $n$, the agent rejects immediately.
  *   *Boundary:* The Ratchet requires the "sweet spot" where $E_n \approx C_n$ locally (sustained by option value), but $\sum E_n < \sum C_n$ globally. This usually demands exponential decay of probability outpacing payoff growth eventually, but slowly enough to maintain local plausibility.

  **3. The "Rescue" Condition (Sunk Cost vs. Option Value)**
  A critical edge case is whether the agent accepts step $k$ to *recover* costs spent on $1 \dots k-1$.
  *   *Distinction:* If the motivation is sunk cost recovery, it is the **Sunk Cost Fallacy**.
  *   *Ratchet Specificity:* In the Convergent Pascal Ratchet, the justification must be *forward-looking* (Option Value of $k+1 \dots \infty$), not backward-looking. The agent accepts $k$ not because they paid for $1 \dots k-1$, but because $k$ is the key to the future stream.

  **4. Bounded Utility Functions**
  If the agent possesses a bounded utility function (e.g., utility caps at $10^6$), the Pascalian growth in $U_n$ eventually yields diminishing utility returns.
  *   *Outcome:* The Expected Utility ($p_n \times \text{Utility}(U_n)$) will eventually drop below cost, breaking the chain via Backward Induction (if finite) or rendering local acceptance irrational (if infinite).
  *   *Boundary:* The Convergent Pascal Ratchet *requires* an effectively unbounded utility function (or a cap so high it is not reached within the decision horizon).

  ### Summary of the Phenomenon

  The **Convergent Pascal Ratchet** is a failure mode of **Sequential Expected Utility Maximization** under **Dynamic Inconsistency**.

  It is not a failure of logic (the local calculation is correct given the constraints) but a failure of **agency structure**. It demonstrates that an agent who maximizes expected utility *myopically* (step-by-step) without the capacity for **Global Precommitment** can be drained by a sequence of bets that a **Global Maximizer** would reject in toto.

  The tragedy is not that the agent chases infinity (St. Petersburg), nor that they fear a single mugger (Pascal), but that they are bled by a **convergent series of rational hopes**, each justified by the next, leading to a destination that was never worth the journey.
