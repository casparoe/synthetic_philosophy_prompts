  ### Executive Agenda: Prioritize Tension 2 (Ontology/Grounding)

  **Recommended Order of Investigation:** Tension 2 → Tension 1 → Tension 3.

  **Core Thesis Strategy:** Do not treat the *catuṣkoṭi* (T1) as a formal logical puzzle to be solved prior to metaphysics. Instead, treat the Madhyamaka theory of *svabhāva* and *pratītyasamutpāda* (T2) as the conceptual key that dissolves T1 and determines T3. Your dissertation should argue that *śūnyatā* is best understood as a claim about **ontological dependence (lack of grounding)** rather than logical valuation or epistemic skepticism. This leverages your philological strengths to intervene in analytic metaphysics without requiring formal logic training.

  ---

  ### 1. Priority Ranking and Dependency Analysis

  **Priority 1: Tension 2 (Ontology: *Śūnyatā* vs. Relationality)**
  *   **Status:** Conceptually Upstream.
  *   **Rationale:** While standard analytic methodology suggests logic (T1) precedes ontology (T2), in Madhyamaka the *target* of the negation determines the *function* of the negation. The *catuṣkoṭi* (T1) negates *svabhāva*. You cannot determine whether the *catuṣkoṭi* is a "logical closure" or a "diagnostic" without first defining what *svabhāva* is. If you establish via text (T2) that *svabhāva* denotes "ontological independence" or "ungrounded fundamentality," then the *catuṣkoṭi* (T1) is necessarily diagnostic (exposing the impossibility of independence) rather than a truth-functional exhaustion. Solving T2 dissolves the ambiguity in T1. Furthermore, T2 determines T3: if emptiness is lack of grounding, the cessation of *dṛṣṭi* (T3) is the cessation of *foundationalist* views, not the cessation of knowledge (skepticism) or the acceptance of contradictions (dialetheism).
  *   **Analytic Hook:** Directly engages debates on **grounding, ontological dependence, and non-fundamentalism**.

  **Priority 2: Tension 1 (Logic: *Catuṣkoṭi* Function)**
  *   **Status:** Methodologically Downstream / Conceptually Dependent on T2.
  *   **Rationale:** Once T2 is established (emptiness = lack of intrinsic nature/grounding), T1 becomes a matter of exegesis rather than formal reconstruction. You can argue that the four horns fail not because of truth-value gaps, but because they all presuppose the incoherent metaphysical commitment defined in T2. This allows you to bypass formal logic traps (many-valued logic, paraconsistency) that threaten your tractability.
  *   **Analytic Hook:** Engages **truth-maker theory** and the limits of bivalence without requiring formal semantics.

  **Priority 3: Tension 3 (Epistemology: Skepticism vs. Dialetheism)**
  *   **Status:** Downstream Consequence.
  *   **Rationale:** The epistemic stance is a consequence of the ontological status. If T2 is "non-foundationalism," T3 is neither skepticism (conventional truth is valid) nor dialetheism (contradictions arise only when seeking foundations). This tension is currently saturated in secondary literature (Garfield, Priest, Siderits); entering it requires formal logic defenses you lack. It is safer to let T3 emerge as a conclusion of your T2 argument.
  *   **Analytic Hook:** Engages **epistemic norms** and assertion conditions.

  ---

  ### 2. Criteria Defense

  #### **Importance (Analytic Engagement)**
  *   **T2 (High):** Current analytic metaphysics is deeply engaged with "grounding" and the possibility of "metaphysical non-fundamentalism." A philologically rigorous account of *pratītyasamutpāda* as ontological dependence offers a high-impact intervention.
  *   **T1 (Medium):** Analytic logicians dominate this space. Without formal training, your contribution risks being marginalized as "informal."
  *   **T3 (Low):** The skepticism/dialetheism debate is reaching diminishing returns.

  #### **Tractability (Skills vs. Constraints)**
  *   **T2 (High):** This relies on conceptual analysis and philology (Sanskrit/Tibetan terms for *existence*, *nature*, *dependence*). You can parse *svabhāva* in the *MMK* and *Yuktiṣāṣṭikā* against analytic definitions of grounding without needing symbolic logic.
  *   **T1 (Low):** Resolving the *catuṣkoṭi* as a logical principle typically requires formal semantics to defend against objections. Your non-formal background is a vulnerability here unless T1 is subordinated to T2.
  *   **T3 (Medium):** Requires navigating epistemic logic. Tractable only if derived firmly from T2.

  #### **Neglectedness (Novelty)**
  *   **T2 (High):** While "Emptiness and Grounding" is discussed, most accounts are philosophically reconstructive with light philology. A dissertation grounding this in specific Sanskrit/Tibetan commentarial distinctions (e.g., *rang gi mtshan nyid* vs. *thun mong gi mtshan nyid*) is novel.
  *   **T1 (Low):** The "Logic of Nāgārjuna" is a crowded subfield.
  *   **T3 (Low):** Heavily saturated by the "Prāsaṅgika Dialetheism" debates.

  #### **Dependency (Upstream Status)**
  *   **T2 is Upstream of T1:** As argued above, the metaphysical definition of the *negatum* (*svabhāva*) dictates the interpretation of the *negation* (*catuṣkoṭi*).
  *   **T2 is Upstream of T3:** The soteriological outcome (what kind of "cessation") depends entirely on what kind of "views" are being ceased (foundationalist vs. all views).

  ---

  ### 3. Reordering Conditions

  You should deviate from this agenda only if specific textual or conceptual thresholds are met during the first 12 months:

  1.  **Shift T3 Upstream (Epistemic Priority):**
      *   **Trigger:** If your philological analysis of Candrakīrti or Tsongkhapa reveals that *svabhāva* is treated primarily as a *semantic* or *linguistic* error (e.g., *abhidhāna*) rather than an ontological one.
      *   **Result:** If *svabhāva* is purely linguistic, T2 (Ontology) collapses into T3 (Epistemology/Philosophy of Language). You would then need to prioritize T3 to explain how language creates the illusion of ontology.

  2.  **Shift T1 Upstream (Logical Priority):**
      *   **Trigger:** If you encounter insurmountable objections from analytic reviewers that your "non-foundationalism" (T2) implicitly relies on a specific logical valuation of the *catuṣkoṭi* (e.g., that you are smuggling in a fifth position).
      *   **Result:** You would be forced to pause T2 and dedicate a chapter to formally defending the *catuṣkoṭi* as diagnostic, potentially requiring collaboration with a logician or intensive self-study in paraconsistent logic.

  3.  **Abandon Analytic Engagement:**
      *   **Trigger:** If you find that the analytic concept of "grounding" inevitably imports essentialist commitments that distort *pratītyasamutpāda* beyond recognition (anachronism risk).
      *   **Result:** Pivot to a comparative history of philosophy focus, treating the analytic engagement as a secondary appendix rather than the core framework.

  ### Strategic Warning
  **Avoid the "Logic Trap."** Many PhD students with your profile attempt to solve T1 using formal logic to prove their competence to analytic departments. Given your background, this is high-risk/low-reward. You will be judged by logicians as an amateur. Instead, judge the logicians by their philology. Use your Sanskrit/Tibetan training to show that the formal logical reconstructions of T1 fail to capture the *prasaṅga* (consequence) method described in the texts. Make T2 (Metaphysics) your battleground; it is where your skills give you a comparative advantage.
