answer: |-
  Good evening. For those I haven't met yet, I'm [Name]. Looking around this room, I see the two worlds my mother has lived in for the last thirty-two years. On one side, the people who know the bill numbers better than their own birthdays—the staff, the lobbyists, the committee chairs. On the other, the people who know her heart—the cousins, the neighbors, the bridge club.

  It is rare to find someone who can speak both languages fluently. But if you've lived in this house, you know Mom doesn't just speak them; she invented a few of her own.

  We all know the record. Three decades of sessions, hundreds of bills, countless compromises. But I want to talk about the argument we've had over the last few years. You might have heard about it. I've spent a lot of time thinking about how to fix government—sometimes suggesting we change who sits in the chairs, or how they get there. I've written essays arguing that the need to run for re-election distorts everything.

  Mom reads my stuff. She humors me. And then she tells me I'm wrong. She says legislating is a craft. She says constituents re-elected her because they wanted someone who knew where the bodies were buried, someone who could navigate the machinery without getting crushed by it. She says a room full of amateurs would get eaten alive in a week.

  She is right about the craft. You cannot do this work without skill. But there was one moment that taught me something about the balance between skill and freedom.

  We all know the vote I'm talking about. The Medicaid expansion. It was the hardest fight of her career. She broke with her own leadership. She stood alone when it would have been easier to fall in line. We talk about it as her finest hour, and it is. But look at the calendar.

  She made that stand three weeks after she announced she wasn't running again.

  For thirty-one years, she carried the weight of the next campaign. Every vote had to consider the next election, the next donor, the next headline. But in those final months, the calculation changed. She didn't have to ask for another job. She only had to answer to the work itself.

  I've argued that removing the pressure of re-election changes everything. Mom argued that having the skill to use that freedom matters most. That vote proved us both right. The freedom gave her the space to act, but her craft gave her the power to make it stick. A novice might have had the freedom, but they wouldn't have known how to wield it. She knew exactly where the bodies were buried, and she decided she didn't need to hide them anymore.

  That is the legacy I want to honor tonight. Not just the years of service, but the clarity of the finish. She showed us that experience is vital, but courage is what happens when you stop worrying about tomorrow's vote.

  She is leaving the legislature, but she is not leaving the work. She's just finally getting to do it on her own terms. And if I've learned anything from watching her, it's that the system matters, but the person matters more.

  So, please raise your glasses.

  \answer{To thirty-two years of knowing the rules, and the courage to break them when it counted.}
