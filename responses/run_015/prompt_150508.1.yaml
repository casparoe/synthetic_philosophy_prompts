      *   *Empirical Finding:* Moral psychology (Knobe effect, etc.) shows how people *do* reason, not how they *should*. Limited utility for normative ethics.
      *   *Abandon Framing:* The "Paradox" might be a pseudo-problem generated by forcing deontology into a consequentialist mold.
