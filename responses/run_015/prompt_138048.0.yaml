answer: |-
  The industrial dishwasher hummed in the corner of the co-working space kitchen, a low-frequency thrum that vibrated through the stainless steel counters. It was a neutral zone. People from different startups, freelancers, and remote workers crossed paths here only when their mugs were dirty or their stomachs empty. They didn't know names. They knew faces, and they knew the rules.

  In the beginning, there were two ways to load the silverware basket. You could put the knives handles-up, ready for the grab, or handles-down, submerged in the spray. Both worked. Handles-up meant you didn't have to fumble when unloading, but the sharp edges were exposed. Handles-down was safer for the hand, but the blades sometimes stayed greasy. For the first month, the basket was a chaotic mix. You'd reach in and gamble. A nick on the thumb was a common tax, a small sting of dignity shared by everyone who washed their own lunch plate.

  The tie-breaker was a gouge in the laminate counter, just to the left of the sink. It was dark, jagged, and exactly at elbow height. It didn't matter for the dishes, but it mattered for the people. To load the basket comfortably, you had to lean. The gouge provided a perfect rest for a left elbow. If you leaned there, your right hand naturally hovered over the basket in a position that made dropping a knife handle-up effortless. Dropping it handle-down required a wrist twist that felt awkward against the counter's edge.

  One Tuesday, a man in a grey hoodie leaned into the gouge. He loaded his knives handles-up. The next person, a woman with a tote bag, saw the knives standing like little soldiers. She saw the gouge. She leaned her elbow into the same spot. She loaded handles-up. It wasn't a decision. It was ergonomics dictated by a defect in the furniture.

  Within six weeks, the handles-up convention had hardened into morality.

  Walking into the kitchen now felt like entering a space governed by invisible physics. You opened the dishwasher door. If the knives were handles-up, the air felt calm. If you saw a single blade pointing down, a spike of irritation rose in your chest. It wasn't just inefficient; it was reckless. People began to leave notes on sticky pads near the rack. *Safety First,* one read. *Think of the Next Person,* read another.

  The story invented itself quickly. Handles-up was about respect. It signaled that you trusted the next person to be careful, and that you were careful enough to deserve that trust. Handles-down was for people who couldn't be bothered to look, people who treated shared space like a private mess.

  Once, a new member, a young developer who hadn't yet learned the rhythm of the room, loaded a set of steak knives handles-down. He was humming, looking at his phone. The woman who unloaded after him froze. She didn't say anything, but she pulled her hand back as if the basket were hot. She looked around the kitchen, making eye contact with two others who were waiting for the kettle. The look was sharp, a silent indictment. The developer noticed the silence. He looked at the knives, then at the woman.

  "Is there a problem?" he asked.

  "People cut themselves that way," she said. Her voice wasn't angry; it was disappointed, the tone one uses with a child who has run into the street.

  "It's actually safer for the unloader," he said, reaching for a knife.

  "Don't," she said. The word landed like a slap. He pulled his hand back. He didn't argue further. The social cost of defending the downward handle was higher than the cost of simply turning it around. To suggest the orientation didn't matter was to suggest that everyone else's caution was performative nonsense. It was an insult to the community's hygiene.

  Then came the memo.

  Gary, the facility manager, printed it on blue paper. He taped it to the front of the dishwasher at eye level. **PLEASE LOAD KNIVES HANDLES-DOWN FOR OPTIMAL SANITIZATION.** Below the text was a diagram showing water jets hitting the blades properly only when inverted. Gary had measured the water pressure. He knew that handles-up left food residue on the lower third of the blade. He knew, objectively, that handles-down was better for everyone. It reduced bacteria, reduced washing cycles, saved water.

  The blue paper stayed up for three days. The knives stayed handles-up.

  It wasn't rebellion. Nobody hated Gary. It was that the memo didn't change the expectation. When Sarah walked in to unload her lunch, she believed that Mark would load his knives handles-up. She believed this because Mark believed that Sarah expected him to. If Sarah suddenly started loading handles-down because of Gary's sign, she would be the only one. When Mark came to unload, he would expect handles-up. He would reach in confidently, grip a handle-down knife by the blade, and cut himself.

  Sarah couldn't switch unless she was certain Mark would switch. But Mark wouldn't switch unless he was certain Sarah would. The blue paper changed what Gary wanted, but it didn't change what Sarah believed about Mark's beliefs. The coordination problem remained locked. The cost of being the only person to follow the rule was a bleeding thumb. The cost of ignoring the rule was zero, provided everyone else ignored it too. The blue paper curled at the corners. Someone drew a small smiley face on it in permanent marker.

  The shift happened in November, without a meeting, without a memo, and without discussion.

  The dishwasher pump failed. Gary called the repair service. The part was obsolete. The machine was replaced with a newer model, slightly different dimensions. The silverware basket was different. The new basket had molded slots for the knives, narrow channels designed to hold the blades steady during the high-pressure wash.

  The slots were tapered. They accepted the knife only one way: handle-down.

  You could try to force a knife in handle-up, but it wouldn't seat. It would wobble. Everyone knew that if you loaded the basket loosely, the knives would fall over during the wash, clattering loudly, and likely not get clean. The sound of falling cutlery was a public admission of incompetence.

  On the first morning after the installation, a man in a suit walked in. He opened the door. He saw the new basket. He picked up a knife. He tried to slot it handle-up. It slipped. He frowned. He flipped it. It clicked into place. He loaded the rest. He left.

  An hour later, Sarah came in. She saw the knives. They were all handles-down. She didn't think about the blue paper. She didn't think about the old gouge in the counter, which was now behind the new, larger machine. She saw the knives seated firmly in their channels. She understood immediately that this was how things were done now. To load them any other way would be to invite chaos.

  She loaded her knives handles-down.

  Within a week, the old story began to dissolve, replaced by a new one. Handles-down was now the mark of a professional. It showed you understood the equipment. Handles-up became impossible, and thus, retrospectively, "incorrect." People looked back on the old way with a faint confusion, wondering how they had ever tolerated the inefficiency of the upright blades.

  Nobody mentioned the mold in the basket. Nobody mentioned that if the basket had been molded the other way, they would be defending handles-up with the same fervor. They just washed their plates, clicked the knives into their slots, and walked back to their desks, secure in the knowledge that they were doing the right thing.
