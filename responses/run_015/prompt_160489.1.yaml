  **(6) Clearly Right.** Ben correctly notes that while the edge is positive, its magnitude depends on the company's distribution. If the company distributes amounts over a vast range, the employee's threshold is unlikely to fall between $X$ and $2X$, driving the expected gain toward zero. He correctly contextualizes the theoretical gain as practically negligible. The "cost" exists but can be made arbitrarily small by HR, meaning Ana's victory is theoretical rather than financial. This move correctly identifies that the company controls the magnitude of the leak.

  **"What both of them are missing"**

  Both colleagues treat the company's distribution as static or secondary, but HR actively controls it. This is a game: if employees adopt Ana's randomized strategy, HR can minimize costs by choosing a distribution where the probability mass is concentrated where the employee's switching gradient is flat. For example, if employees use a log-normal threshold, HR can issue bonuses so large that the threshold rarely falls between $X$ and $2X$. Thus, the theoretical "exploit" is arbitraged away by the design of the bonus scheme itself. The expected cost is not a fixed property of the envelopes but a variable determined by HR's choice of $f(x)$.

  Furthermore, neither addresses risk utility. Even if the expected monetary value is neutral (Ben) or marginally positive (Ana), employees may value the *option* to switch. The psychological benefit of control might outweigh the negligible financial cost, suggesting the scheme has value as a morale tool regardless of the actuarial leakage. Finally, they ignore implementation risk: if employees believe Ana's Move 1 (the 25% error), they will be disappointed when real-world results don't match the theory, potentially causing distrust rather than satisfaction. The committee must manage expectations about the "edge" just as carefully as the budget.

  **"What I should tell HR"**

  Tell HR the scheme is safe. Ana's initial fear of a 25% expected loss is mathematically impossible under any real budget. Ben is mostly correct that the cost is negligible, though Ana is technically right that a sophisticated employee could extract a tiny edge using a randomized threshold. However, because HR controls the bonus amounts, you can ensure this edge is financially irrelevant by using a wide distribution of values.

  Recommendation: Approve the peek-and-switch option. It costs the company virtually nothing in expectation but provides psychological value to staff. Do not publish the bonus range (ceilings/floors), as revealing bounds allows employees to maximize the edge at the edges (validating Ana's Move 3). Treat the scheme as a morale benefit, not a financial liability.
