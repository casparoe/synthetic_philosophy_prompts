answer: |-
  The light in the assessment office was flat and grey, the kind that made the paper on the desk look like concrete. Elena sat with her pen capped, reading the statement for the third time. The applicant was a nineteen-year-old deckhand named Leo. The incident involved a harbour ferry, a ruptured fuel line, and an engine room fire.

  Leo's statement was brief. He wrote that he had gone back into the smoke to close the valve. He did not write that he had chosen to do so. He wrote that he knew the procedure and nobody else aboard did, so there was nothing to decide.

  Elena uncapped her pen. She made a note in the margin: *Subjective perception of duty.*

  To her left lay the letter from the ferry operator's insurer. They argued that the act was not certifiable. They cited the employment contract, the safety manual, and the general expectations of a deckhand on a vessel in distress. They argued that the role of a deckhand swallowed the act. If a man is hired to manage the deck, and the deck burns, putting out the fire is what is owed. To certify it as unclaimed would be to admit the job description was incomplete.

  To her right lay the letter from the union. They argued the act was unclaimed. They noted that the safety manual advised evacuation in the event of unchecked fuel combustion. They noted that no other crew member entered the engine room. They argued for certification because certification brought the state indemnity. The medical bills for the deckhand's lungs were significant. The lost wages were significant. The state paid for certified deeds; the insurer paid for required duties. Both sides were arguing about money, but the language was about obligation.

  Elena leaned back. The Registry of Unclaimed Deeds had been operating for thirty years. The statute was simple. If a deed was certified, it was legally non-precedential. It could not be cited to determine what a reasonable person was required to do in the future. The law was written to stop the ratchet. If one man jumped into a flood to save a stranger, the law ensured that the next man was not required to jump.

  But the indemnity clause had changed the practice. To pay the claim, the Registry had to assess the loss. To assess the loss, the assessors had to determine if the claimant had acted with competence. If a man jumped into a flood but did not know how to swim, the state could deny the claim for negligence. Over three decades, the assessment of competence had hardened into a standard. The doctrine said the deed bound no one. The paperwork said that if you did the deed, you had better do it like a professional.

  Elena looked at Leo's statement again. *There was nothing to decide.*

  If he believed it was required, could it be unclaimed? The Registry dealt in objective obligations, not subjective feelings. But if a man felt no choice, was the choice truly his to make? If the role demanded everything, was there anything left over to give?

  She opened the bottom drawer of her desk. It stuck slightly on the runners. Inside, beneath a stack of current forms, was a manila folder. It was thick with dust. She had not opened it in ten years.

  Thirty years ago, the road underpass had flooded during a storm. The water had risen faster than the drainage could handle. Cars had stalled. Elena had been twenty-three. She had waded into the water. The current was strong, carrying debris. She had reached two people clinging to a roof rack and pushed them toward the dry embankment. A third person had been in the back seat. The water had taken the car before she could reach the door.

  Her fiancé, Mark, had stood on the railing above. He had a coiled rope. He had not gone into the water.

  They had not spoken since that night. She had never filed the deed.

  If she filed the deed now, the Registry would certify that her act was unclaimed. It would certify that she owed nothing to the people in the car. By extension, it would certify that Mark owed nothing either. If the act was optional for her, it was optional for him. The certification would formally record that he had done nothing wrong by staying on the railing.

  If she did not file, the deed remained uncertified. The question of what was owed remained open. It remained a thing that hung between them, undefined by the state.

  Elena looked back at Leo's file. The insurer wanted to say the job swallowed the risk. The union wanted to say the risk was above the job. Leo said there was no risk, only procedure.

  She picked up her pen. She had to rule on Leo before she could touch her own folder. The precedent of her own inaction weighed on the desk.

  If she certified Leo's deed, she acknowledged that a deckhand could do something beyond his duty. But by assessing his competence to pay the indemnity, she would establish a standard for any deckhand who tried it next. They would need to know the valve location. They would need to know the fire suppression protocol. The optional act would become a professional expectation, masked as a voluntary heroism.

  If she denied Leo's deed, she affirmed that the job swallowed the act. The insurer would pay. The union would appeal. The deckhand would be recorded as having done only what was owed. There would be no medal. There would be no state indemnity. But there would be no new standard for competence, because there was no certified deed to assess.

  The act could not survive being officially recognized as optional. Recognition brought compensation. Compensation brought assessment. Assessment brought standard. The moment the state touched the deed, it ceased to be free.

  Elena wrote on Leo's form. She did not write a justification. Justifications were for the appeals board. She checked the box marked *Certified*. She signed her name. She knew the indemnity assessors would now scrutinize Leo's training records. They would ask if a reasonable deckhand would have known the valve location. They would decide if he was competent. They would create the standard she was statutorily forbidden to create.

  She placed Leo's file in the outbox.

  She pulled the manila folder onto the desk. The paper was yellowed. The form was the same as the one she had just signed, only the version number was different.

  *Applicant Name.*
  *Date of Deed.*
  *Nature of Unclaimed Act.*

  She filled in the date. Thirty years ago. She filled in the nature of the act. *Rescue attempt during flood event.*

  She paused at the section marked *Declaration of Non-Obligation*. To sign this was to state that she was not required to act. It was to state that Mark was not required to act. It was to close the file on the silence.

  If she signed, the state would indemnify her. She had no medical bills from thirty years ago. She had no lost wages. She had the memory of the water, and the memory of the rope on the railing. The indemnity was not for the money. It was for the certification. It was to make it official that nothing was owed.

  If she left it blank, the debt remained potential. It remained possible that someone, somewhere, could argue that she should have done more, or that Mark should have come down. The uncertainty was a kind of weight. The certification was a kind of release.

  She looked at the pen. It was the same model she had used for Leo. The ink was black. The paper was white.

  The Registry existed to stop the ratchet. To stop one act from becoming a requirement for all. But by certifying the act, she made it a thing that could be measured. By measuring it, she made it a thing that could be expected.

  If she certified her own deed, she made her rescue a professional act. She made Mark's inaction a permissible choice. She made the death of the third person a statistical outcome of an optional intervention.

  If she did not certify it, the act remained hers. It remained unmeasured. It remained outside the standard.

  Elena put the nib of the pen to the paper. The ink bloomed slightly on the old stock. She wrote her signature. It looked the same as it had on Leo's form.

  She did not put the form in the outbox. She left it on the desk. She stood up and walked to the window. The grey light had not changed. The city below was moving as it always did. People were doing what they were required to do. Some were doing more. Some were doing less.

  She turned back to the desk. She picked up the form. She folded it once, then twice. She placed it back into the manila folder. She opened the bottom drawer. She placed the folder inside, beneath the stack of current forms. She closed the drawer.

  She sat down. She picked up the next file from the pile. The name on the tab was unfamiliar. The incident was recent. The act was unclear.

  Elena uncapped her pen. She began to read.
