  | Historical | Markers appear in confirmed cases, failing to discriminate. | Markers are absent in confirmed cases, validating discrimination. |
  | Stylized | Confidence drops 20% due to unmodeled selection and grievance bias. | Confidence rises 30% due to specific documentary and testimonial evidence. |

  5. Both agree "prima facie unwarranted" is verbal because it conflates prior probability with evidential weight; the generalist falsifies if confirmed conspiracies lack markers, while the particularist falsifies if markers predict failure in false theories.
