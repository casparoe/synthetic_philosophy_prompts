prompt: |-
  I'm a journalist — I cover science and medicine — and I'm working on a piece about consent forms, the click-through kind and the signed-in-triplicate kind, and I keep typing the phrase "valid consent" without being able to say what makes it valid. So I did what I always do when I'm lost: I wrote down a pile of cases, marked each one with my gut, and now the pile won't sit still.

  - Someone agrees to sex with a condom, partner takes it off halfway through. Definitely not consent, and worse than I expected myself to feel about it.
  - Patient signs for a knee operation; surgeon gets in there, finds something else, fixes that too. Low risk, genuinely beneficial, patient would probably thank her. Still not fine to me.
  - Patient signs for "robot-assisted" surgery and the actual cutting is done by the system running on its own, nobody's hands on the console for most of it. Not fine. But — and here's the thing that bugs me — I'm fine with the surgeon handing half the operation to a resident the patient never met. Both are a substitution in who does the thing. Am I just defending whatever's normal?
  - Nurse practitioner at a community clinic tells a patient the visit is covered; it isn't and she's on the hook for $400. Gut says the consent to treatment is still fine, the billing is a separate wrong. But then: a study enrols people telling them it's about memory when it's about conformity, same risk, same payment. That one I say is invalid.
    Those two look structurally identical to me — same risk, same money, lie about something the person cared about — and I give opposite answers. I have no idea what's supposed to separate them.
  - Blood donor is told the fee goes to a charity; it goes to the company's overhead. Annoying. I don't think it voids consent.
  - Boss says sleep with me or you're fired. Coerced. Partner says sleep with me or I'm leaving. Not coerced. The partner is also threatening to do something she's entirely entitled to do.
  - A phase I trial in a country where $2000 is four months' wages, for a drug with real risk. My gut says "not coercion" and then immediately says "but not fine either," which probably means my gut is useless on this one.
  - Drunk yes at a party: not consent. But my dad, early Alzheimer's, signed a letter last year saying he'd hand over the keys when his doctor said so, and I think the letter should win over what he's saying now. Which seems backwards — in one case I throw out the impaired present self in favor of the earlier one, in the other I won't let the earlier self's explicit instruction count.
  - 16-year-old getting an IUD without her parents: yes. 17-year-old selling her eggs for tuition money: no. And a 15-year-old refusing a transfusion on religious grounds: no, override her. If there's a shape here it's not just "kids can't consent."
  - Signed a waiver to get into the climbing gym. I don't think that's consent to the risk of the wall falling on me because they never inspected the bolts, but I do think it's consent to the ordinary risk of falling off. Same signature.

  The principle I keep falling back on is: nobody pushed them, and they'd have said yes anyway if they'd known the whole truth. But that has to be wrong somewhere. The blood donor would have said no if she'd known — so my principle calls it invalid, and my gut doesn't. And there's a version that's worse: a patient who'd have refused if he'd known the valve was from a pig, or that the surgeon was Black. I don't want to say the "would you have said yes if you knew" test makes that consent invalid, but I also don't see how to stop it from saying that.

  So: is there one principle — or a short list of them — that gets most of my verdicts, and where does it overrule me? I'd like it stated tightly enough that I can run new cases through it, with a clause-by-clause note on which case forced the clause. And two cases I haven't put on the list because I keep flip-flopping: a woman who said yes to being named in a story while she was hypomanic and now wants out, and a friend who slurred "yeah fine" about a quote at a conference party and then texted "still fine" the next morning. Does a later clear-headed yes repair an earlier broken one, or is that a different question from whether the first yes counted?

  One more thing I actually need for the piece: after all this, is there anything left in "she consented" beyond a label we stick on a bunch of unrelated complaints — the pushing, the lying, the not-getting-it — or is there a core that all of them are failures of?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Journalist covering science and medicine.
      *   **Task:** Writing a piece about consent forms (click-through and signed).
      *   **Problem:** Struggling to define "valid consent." Has a list of intuitive case judgments but can't find the unifying principle. Some cases contradict each other structurally.
      *   **Goal:** Wants a tight principle (or short list) that matches most of their verdicts, notes where it overrules intuition, and addresses the "core" of consent. Also needs help with two specific flip-flopping cases (hypomanic interviewee, drunk friend).
      *   **Tone:** Intellectual, rigorous, slightly frustrated but thoughtful. Needs to be respectful of the complexity but offer actionable framework.

  2.  **Deconstruct the Cases & Intuitions:**
      *   *Condom removal (Stealthing):* Invalid. (Violation of specific condition).
      *   *Knee surgery + extra fix:* Invalid (technically battery), though beneficial. (Violation of scope).
      *   *Robot surgery vs. Resident:* Robot = Invalid; Resident = Valid. (Distinction: Material change in nature of service vs. standard delegation within profession).
      *   *Billing lie (Clinic) vs. Deception (Study):* Billing = Valid consent to treatment; Study = Invalid consent. (Distinction: Collateral matter vs. Nature of the activity).
      *   *Blood donor fee lie:* Valid. (Collateral matter/motive).
      *   *Boss vs. Partner threat:* Boss = Coerced (Illegitimate threat); Partner = Not coerced (Legitimate option).
      *   *Phase I trial (poor country):* Not coercion legally, but ethically fraught. (Undue inducement vs. background injustice).
      *   *Drunk yes vs. Alzheimer's advance directive:* Drunk = Invalid (Capacity); AD = Valid (Precedent autonomy). (Distinction: Temporary impairment vs. Established prior competent wish).
      *   *Minors (IUD vs. Eggs vs. Transfusion):* IUD = Valid (Mature minor/Best interest); Eggs = Invalid (Exploitation/Long-term risk); Transfusion = Invalid (Life-saving/Parental authority). (Distinction: Risk/Benefit ratio + Legal status).
      *   *Climbing gym waiver:* Ordinary risk = Valid; Negligence = Invalid. (Distinction: Inherent risk vs. Breach of duty).
      *   *The "Would you have said yes?" Test:* Fails on blood donor (motive) and bigoted patient (discriminatory preference).

  3.  **Identify the Core Tension:**
      *   The user is oscillating between *Subjective Voluntariness* (Did they really want this?) and *Objective/Procedural Validity* (Was the process fair/informed according to norms?).
      *   The "Would you have said yes?" test is the *Subjective* test (Counterfactual Subjectivity). It fails because people have bad/irrational reasons (racism) or collateral reasons (charity donation) that shouldn't necessarily void the core contract.
      *   The solution lies in distinguishing between *Essential Terms* and *Collateral Matters*, and between *Capacity* and *Authority*.

  4.  **Drafting the Principle (The "Three-Filter Test"):**
      *   I need a framework that captures: Information, Voluntariness, and Capacity/Authority.
      *   *Filter 1: Materiality of Information.* Not every lie voids consent. Only lies about *material* facts (nature of act, risks, identity of actor). This solves the Billing vs. Study and Blood Donor cases.
      *   *Filter 2: Legitimacy of Options (Coercion).* Not every pressure voids consent. Only *illegitimate* threats. This solves Boss vs. Partner and Phase I trials (hard choice vs. coercive offer).
      *   *Filter 3: Competence & Scope.* Capacity isn't binary. It's decision-specific. Also, prior directives count if current capacity is lost *due to pathology*, not just temporary states. This solves Drunk vs. Alzheimer's.
      *   *Refining the "Would you have said yes?" test:* Replace with "Would a *reasonable person* consider this information material to the decision?" (Objective Materiality).

  5.  **Addressing the Specific Flip-Flopping Cases:**
      *   *Hypomanic Woman:* Capacity is fluctuating. If she was hypomanic *during* consent, it's suspect. If she confirms later when euthymic, it *ratifies* the consent. Ratification is the key legal/ethical concept here.
      *   *Drunk Friend:* "Yeah fine" (slurred) + Text next day. The text *ratifies* the earlier agreement. The earlier one was weak, the later one cements it.

  6.  **Addressing the "Core" Question:**
      *   Is "consent" just a label for unrelated complaints?
      *   No. The core is *Authorization*. It's the transfer of moral/legal permission.
      *   The failures are all failures of *agency*. Either the agent didn't understand (Info), couldn't choose (Coercion), or wasn't an agent (Capacity).

  7.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is the "Reasonable Person" standard too cold for medicine?
      *   *Adjustment:* In medicine, it's often the "Particular Patient" standard (what *this* patient would care about), BUT with a limit on discriminatory/irrational preferences. I need to be careful there. The "Pig Valve/Black Surgeon" example is tricky. Legally, a patient *can* refuse a Black surgeon. But does that make the consent invalid if they weren't told? No, that's a refusal, not invalid consent. Wait, the prompt asks: "I don't want to say the 'would you have said yes' test makes that consent invalid." Correct. Because the *reason* for refusal matters. If the reason is discriminatory, the system doesn't have to accommodate that ignorance.
      *   *Better distinction:* Distinguish between *Deal-Breakers* (Material terms) and *Motivations* (Collateral).
      *   *Robot vs. Resident:* This is about *Professional Norms*. A resident is within the expected scope of teaching hospital consent. A robot acting alone is a fundamental change in the *nature* of the procedure.
      *   *Phase I Trial:* This is "Undue Inducement." It's not coercion (no threat), but the offer is so good it clouds judgment. The principle needs to acknowledge background justice.

  8.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the difficulty. Validate the journalist's intuition.
      *   **The Core Definition:** Consent as *Authorized Permission*.
      *   **The Three-Part Test (The Principle):**
          1.  **Capacity & Authority** (Who is speaking?) -> Solves Drunk/Alzheimer's/Minors.
          2.  **Information & Materiality** (What do they know?) -> Solves Billing/Study/Robot/Resident.
          3.  **Voluntariness & Legitimacy** (What are their options?) -> Solves Boss/Partner/Phase I.
      *   **The "Would You Have Said Yes" Fix:** Introduce the "Reasonable Materiality" standard.
      *   **The Flip-Flopping Cases:** Apply the concept of *Ratification*.
      *   **The "Is there a Core?" Question:** Yes, it's about *Agency* and *Normative Transformation*.
      *   **Where the Principle Overrules Gut:** Point out where the law/ethics might differ from intuition (e.g., the Knee Surgery case is battery even if beneficial).

  9.  **Tone Check:** Ensure it sounds like a collaboration with a colleague, not a lecture. Use the journalist's examples.

  10. **Final Polish:** Check against the specific constraints (tight principle, clause-by-clause note, specific cases addressed). *Self-correction: Make sure to explicitly mention which case forced which clause.*

  *(Self-Correction on the "Black Surgeon/Pig Valve" point)*: This is crucial. If a patient says "I wouldn't have consented if I knew the surgeon was Black," does that make the consent invalid if they weren't told? No. The law generally protects the patient's right to refuse, but it doesn't validate *ignorance* based on prejudice as a voiding factor for *informed* consent standards. The "Materiality" test is usually objective (would a reasonable patient care?) or subjective (would *this* patient care?). If subjective, the bigot *could* claim invalid consent. To avoid this, we use the **Objective Reasonable Person** standard for *medical* materiality, excluding personal prejudices unrelated to medical outcome. I need to articulate this carefully.

  *(Refining the Robot vs Resident)*: This is about *Expectation within Context*. Entering a teaching hospital implies residents. Entering a surgery implies a surgeon, not an algorithm. This falls under "Nature of the Act."

  *(Refining the Phase I)*: This is the hardest one. It's not coercion. It's "Undue Inducement." The principle needs to allow for "Exploitative but Valid" vs "Invalid." Actually, legally, it's often valid consent but *unethical* recruitment. I should distinguish between *Valid Consent* and *Ethical Transaction*. The journalist asks about "Valid Consent." I must be clear: The consent might be valid, but the situation is exploitative.

  Let's build the response.cw
answer: |-
  This is one of the hardest problems in bioethics and law, and your intuition is correctly screaming because the concept of consent is doing too much work. It is trying to be a shield against battery, a guarantee of autonomy, a tool for risk management, and a metric for justice, all at once.

  You are looking for a single principle, but the stability you want comes from a **three-filter test**. If any filter fails, consent is invalid. If all three pass, consent is valid (even if the situation is still unethical).

  Here is the tight principle, followed by the clause-by-clause mapping of your cases, the fix for your "would they have said yes" problem, and the answer to your specific flip-flopping cases.

  ### The Principle: Valid Consent as Authorized Permission

  **Consent is valid if and only if:**
  1.  **Capacity:** The agent has the functional capacity to understand the decision *at the time of agreement*, OR is acting under a valid prior directive established while competent.
  2.  **Materiality:** The agent is not deceived or ignorant regarding facts that a *reasonable person* would consider essential to the nature of the act or its medical risks.
  3.  **Voluntariness:** The agreement is not produced by an *illegitimate* threat that leaves the agent no reasonable alternative.

  ---

  ### Clause-by-Clause Case Mapping

  Here is where your cases forced each clause, and where the principle might overrule your gut.

  #### Clause 1: Capacity (Who is speaking?)
  *   **The Rule:** Capacity is decision-specific and time-specific. However, a prior competent directive overrides a current incompetent refusal *if* the current incapacity is due to pathology (Alzheimer's), not temporary state (drunkenness), unless ratified later.
  *   **Cases that forced this:**
      *   **Drunk Yes vs. Alzheimer's Directive:** This clause resolves your paradox. The drunk person lacks *current* capacity. The Alzheimer's patient lacks *current* capacity, but the *prior* competent self retains authority over the pathological self.
      *   **Minors (IUD vs. Eggs vs. Transfusion):** This clause explains the variance. It's not just age; it's the *risk/benefit ratio* relative to maturity. Courts grant capacity for low-risk/high-benefit (IUD) but override high-risk/refusal (Transfusion) or high-risk/commercial (Eggs).
  *   **Where it overrules you:** You felt the drunk friend's later text might repair the earlier consent. Legally/Ethically, yes (see *Ratification* below). But the *initial* "yes" was void. The validity comes from the second moment, not the first.

  #### Clause 2: Materiality (What do they know?)
  *   **The Rule:** Not every lie voids consent. Only lies about **essential terms** (nature of the act, identity of the primary actor, medical risks). Lies about **collateral matters** (billing, where the money goes, administrative details) do not void consent to the act itself, though they may be fraud.
  *   **Cases that forced this:**
      *   **Billing Lie vs. Study Deception:** This is the structural identical pair that bothered you. The principle separates them: Billing is collateral to the *medical act*; Study purpose is essential to the *research act*. You cannot consent to "research" if you don't know what is being studied.
      *   **Blood Donor Fee:** Collateral. You consented to give blood; the fee destination is administrative. Valid consent, unethical accounting.
      *   **Robot vs. Resident:** This is the hardest one. The principle relies on **Professional Norms**. In a teaching hospital, a resident is an *expected* agent (within scope). A robot acting alone is a *fundamental change in the nature of the procedure*. One is delegation; the other is a different product.
      *   **Knee Surgery:** Overrules your gut. You said "Still not fine." The principle agrees: It is battery. Even if beneficial, you exceeded the **scope** of the authorization. The "patient would thank her" is irrelevant to validity; it only matters for damages.
  *   **Where it overrules you:** The **Pig Valve/Black Surgeon** problem.
      *   *Your worry:* If we use "Would you have said yes?", the bigot gets to claim invalid consent.
      *   *The Fix:* We use the **Reasonable Person Standard**, not the Subjective Standard. Would a *reasonable patient* consider the surgeon's race material to the *medical outcome*? No. Therefore, nondisclosure does not void consent. The patient can *refuse* the surgeon (autonomy), but they cannot claim they were *deceived* into consent (invalidity). This protects the validity of consent from being held hostage by private prejudices.

  #### Clause 3: Voluntariness (What are their options?)
  *   **The Rule:** Pressure does not equal coercion. Coercion requires an **illegitimate threat**. A hard choice caused by background circumstances (poverty) or legitimate options (breaking up) is not coercion.
  *   **Cases that forced this:**
      *   **Boss vs. Partner:** Boss = Illegitimate threat (sexual harassment/abuse of power). Partner = Legitimate option (right to end relationship).
      *   **Phase I Trial (Poor Country):** This is the limit case. Your gut said "Not coercion... but not fine." The principle agrees. It is **Valid Consent** but **Unjust Offer**. The poverty is background, not a threat issued by the researcher. The consent is valid, which makes the exploitation *worse*, because you cannot simply say "they didn't agree." They did agree, which is why we need regulations beyond consent (like fair benefit sharing).
      *   **Stealthing (Condom):** This is a violation of **Conditional Consent**. "Yes, *if* condom." The condition was removed. This voids consent because it changes the *nature of the act* (safe sex vs. unsafe sex).

  ---

  ### The Two Flip-Flopping Cases

  You asked about the hypomanic woman and the drunk friend. The concept you are missing is **Ratification**.

  1.  **Hypomanic Interviewee:**
      *   *At the time:* Consent is suspect/voidable due to impaired capacity (mania affects judgment/impulse control).
      *   *Later:* If she returns to a euthymic (stable) state and explicitly confirms, "Yes, I stand by that interview," she has **ratified** the prior agreement.
      *   *Verdict:* The *initial* consent was flawed. The *current* status is valid based on the new confirmation. You must treat the confirmation as the operative moment of consent.

  2.  **Drunk Friend at Conference:**
      *   *At the time:* "Yeah fine" (slurred) is low-quality consent.
      *   *Later:* Text saying "Still fine."
      *   *Verdict:* Same as above. The text **ratifies** the quote. However, as a journalist, you have a higher ethical burden than the legal minimum. If the quote is damaging, rely on the text. If the quote is benign, the text cements it.
      *   *Distinction:* Ratification only works if the person is *now* competent and *now* free of the pressure. If they text "still fine" because they fear you, it's still coerced.

  ---

  ### The Core Question: Is there anything left in "She Consented"?

  You asked: *Is "she consented" just a label we stick on a bunch of unrelated complaints, or is there a core?*

  There is a core. It is **Normative Transformation**.

  When valid consent occurs, it changes the moral landscape. An act that was a violation (cutting skin, taking money, publishing words) becomes a service, a transaction, or a collaboration.

  All the failures you listed (lying, pushing, not-getting-it) are failures of **Agency**.
  *   **Lying** undermines the *informational* basis of agency.
  *   **Coercion** undermines the *volitional* basis of agency.
  *   **Incapacity** undermines the *existence* of agency.

  If "She Consented" is true, it means **she authored the risk.**
  *   In the **Climbing Gym**, she authored the risk of falling (inherent), but not the risk of the wall collapsing (negligence). You cannot author a risk you were not told existed.
  *   In the **Phase I Trial**, she authored the risk of the drug, but she did not author the injustice of her poverty. That is why your gut says "Valid but not fine." She authorized the medical risk; she did not authorize the social exploitation.

  ### Summary for your Piece

  If you need a pull-quote definition, try this:

  > "Valid consent is not about whether the patient was happy with the outcome. It is about whether they held the pen. If you lie about what they are signing, steal the pen, or wait until they are too confused to hold it, they didn't consent. But if they sign a bad deal because the world left them no good options, they still signed it—and that is when consent stops being a shield for the institution and starts being a mirror for society."

  This framework allows you to say the Phase I trial consent is *valid* (they signed it) while condemning the *system* (why was that the only option?). It allows you to say the Knee Surgery was *battery* (exceeded scope) even if the patient is *happy* (outcome irrelevant). It resolves the "Would they have said yes?" test by shifting from "Would *this* person say yes?" to "Was this information essential for *any* person to make this choice?"

  Your gut isn't useless; it's detecting the difference between **Invalid Consent** (the process was broken) and **Unethical Context** (the world is broken). The law mostly polices the first. Journalism should expose the second.
