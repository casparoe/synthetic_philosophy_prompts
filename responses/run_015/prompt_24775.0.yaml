prompt: |-
  Im writing a novel set in a sculpture studio, and one of the plot devices is a document that two of my characters produce after a year of arguing: a sculptor who's a hardline concretist (the marble statue and the lump of marble are two distinct objects, full stop, with genuinely different persistence conditions) and a philosopher who's a sortal relativist (there's only one object, and the different persistence conditions are just an artifact of how we describe it). I want to include the joint statement they'd sign after an adversarial collaboration as a prop in the novel. Can you draft it?

  I want the claims both camps can sign (about the setup, about what actually needs explaining, about the results that rule out the naive versions — I'm thinking the grounding objection and the further-fact problem), the precise formulations of their disagreement (each phrased so its own side would accept the wording of its own view), the cruxes (I suspect one is whether the difference in persistence conditions is a real fact about the world or an artifact of our descriptions, and another is whether there has to be some "further fact" that makes the statue and the lump distinct, or whether the distinctness is just brute), and for each crux, a concrete case or argument both would agree bears on it, with each side's prediction written down in advance. A couple of cases I'd like to see: teh hammering case (the statue gets hammered flat into a sheet — does it survive?), the melting case (the lump gets melted and reconstituted — does it survive?), and the personal-identity case (the human and the animal that constitute them — does the person survive being turned into a philosophical zombie?).

  Format it as a numbered agreed-claims section followed by a disagreements table. And if you think part of their dispute is just verbal, say which part and why.
