      *   *Chaos Excuse:* Chaos theory explains *why* small errors grow (sensitivity). It wasn't an excuse bolted on later; it was the physical reality. The atmosphere was in a highly unstable state. However, using "chaos" to say "it was impossible" is the excuse part. It was *limitedly* predictable, not unpredictable.
      *   *Nuance:* The question "Is it dangerous?" is a *decision* question, not purely dynamical. But dynamically, it's Type I.

  5.  **Address Question 3: The Decision Problem (What to say on telly).**
      *   *Context:* Ensemble forecasting wasn't operational in 1987 (started early 90s). But let's assume the conceptual framework of probability.
      *   *Framework Limit:* Predictability theory deals with truth/probability, not utility/loss functions. It doesn't tell you *what to say*, only *what you know*.
      *   *Action:* If there's a small probability of catastrophe, the communication should reflect the *consequence*, not just the probability. "Most likely rain, but non-zero chance of severe wind" is technically accurate but practically useless if people tune out.
