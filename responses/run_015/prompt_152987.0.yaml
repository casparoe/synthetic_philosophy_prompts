answer: |-
  Here is an autopsy of the Great Storm of 1987, structured around the predictability framework you provided.

  ### 1. Locating the Failure: Initial Conditions, Structure, or Predictand?

  Your suspicion about the predictand mismatch is insightful, but it is the *consequence* of the failure, not the root. To place this precisely in your framework: this was primarily a **Predictability of the First Kind** failure driven by **Initial Condition Error**, which was then amplified by **Structural Model Error**.

  It was not a Predictability of the Second Kind problem. That framework applies to boundary value problems (e.g., "If we double CO2, how does the statistical distribution of storms change?"). The Great Storm was an Initial Value Problem: "Given the atmosphere as it is now, where will this specific depression be in 24 hours?"

  **The Initial Condition Error:**
  The depression deepened explosively over the Atlantic. In 1987, data coverage over the Bay of Biscay and the Eastern Atlantic was sparse. There were no buoys, few ships, and no satellite wind profiles assimilated into the models with today's sophistication. The model started with a "smoothed" version of the atmosphere. In a chaotic system, smoothing out a small kink in the pressure field at $T=0$ results in a divergent trajectory at $T+24$. The model didn't "see" the energy available to deepen the low because the observations weren't there to initialize it.

  **The Structural Model Error:**
  Even if the initial state had been perfect, the 1987 models were too coarse to resolve the specific physics of the windiest air. The model output gave forecasters pressure fields (isobars). Forecasters then inferred wind speed based on the spacing of those isobars (geostrophic wind).
  However, the worst damage was caused by phenomena the model grid could not resolve—specifically, what we now call a "sting jet": a narrow, descending current of air that evaporates rain, cools, and accelerates toward the surface. This is a sub-grid scale process. The model was the "wrong shape" to hold this physics. It predicted the low, but it physically could not predict the localized gusts that knocked down the trees.

  **The Predictand Mismatch:**
  This is where your suspicion holds water. The Met Office successfully predicted *a* storm, but they failed to predict the *impact*. They were forecasting pressure tracks (a dynamical variable); the public and the power companies needed wind gusts over land (an impact variable). The model said "Low pressure stays in the Channel." The forecasters translated this to "Wind stays in the Channel." They failed to account for the non-linear relationship between the pressure field and surface damage.

  **Verdict:** The failure sits in the **First Kind** (trajectory), caused by **Initial Condition** blindness, compounded by **Structural** inability to resolve convective gusts, resulting in a **Predictand** mismatch.

  ### 2. Was it a Second-Kind Question? Was Chaos an Excuse?

  You asked: *'Is a dangerous storm heading for us' looks much more like a second-kind question than a trajectory question.*

  Conceptually, this is incorrect, and correcting it is vital for your piece. "Is a dangerous storm heading for us?" is the archetypal **First Kind** question. It asks about the specific trajectory of a fluid dynamic system from a specific starting point.
  A **Second Kind** question would be: "Is the North Atlantic Oscillation shifting in a way that makes dangerous storms more likely this decade?"

  **Was chaos-talk an excuse bolted on afterwards?**
  Partly, but not entirely.
  Chaos theory (sensitivity to initial conditions) explains *why* the forecast diverged from reality. The atmosphere was in a highly unstable state; small errors grew exponentially. That is genuine dynamics, not post-hoc rationalization.
  However, labeling the event "unpredictable" *because* of chaos was the excuse. In chaos theory, predictability is not a binary switch (predictable/unpredictable); it is a time horizon. The "Butterfly Effect" does not mean "anything can happen." It means "confidence decays at a specific rate."
  In 1987, the error growth rate was high, but not infinite. The models *did* show a deep low; they just had it 100 miles south. To claim the event was "unforecastable" is to claim the error growth was instantaneous. It wasn't. The chaos framework explains the *uncertainty*, but it does not excuse the *certainty* with which the wrong forecast was delivered. The forecasters collapsed a probability distribution into a single, wrong point.

  ### 3. The Decision Problem: What to Say on Telly

  You ask what a forecaster should do with an ensemble showing a small probability of catastrophe. This is where the predictability framework goes silent, and **Decision Theory** must take over.

  The predictability framework (First Kind) tells you the *truth value* (or probability) of the proposition: "There is a 10% chance of 100mph gusts."
  It does not tell you the *utility* of acting on that information.

  **The Framework's Silence:**
  Mathematically, if the probability is low, the "best" forecast is the one that minimizes mean squared error. If you predict high winds and they don't happen, your error score goes up. The framework incentivizes "hedging" toward the most likely outcome (rain).
  But society does not operate on mean squared error. It operates on **loss functions**. The cost of a false alarm (canceling a picnic) is low. The cost of a missed event (death, blackout) is infinite.

  **What Should Have Been Done:**
  If an ensemble (had it existed) showed a 10% chance of a "weather bomb" tracking 50 miles north of the mean:
  1.  **Communicate the Variance, not just the Mean:** Do not say "It will be wet." Say "The most likely outcome is rain, but the spread of outcomes includes severe gales."
  2.  **Impact-Based Warning:** Shift the predictand. Instead of "Wind speed 40mph," say "Risk of structural damage."
  3.  **The "Precautionary Principle" in Broadcast:** When the tail risk involves loss of life, the threshold for warning should be lower than the threshold for statistical significance.

  The 1987 failure was a failure of **risk communication**, not just fluid dynamics. Michael Fish gave a deterministic forecast ("It's not going to be windy") for a probabilistic system. The framework doesn't tell you to do this; human psychology and institutional risk-aversion did. The framework actually argues *against* certainty in unstable regimes.

  ### 4. What the Episode Tells the Theory

  Your hunch is correct: **"'Unpredictable' is a three-place thing — a system, a predictand, and somebody who has to make a call."**

  Standard chaos theory often treats predictability as a property of the **System** (e.g., "The atmosphere has a Lyapunov time of 10 days"). The Great Storm shows this is insufficient.

  1.  **System:** The atmosphere was chaotic (high sensitivity).
  2.  **Predictand:** Predicting the *center* of the low was moderately predictable. Predicting the *sting jet* was structurally unpredictable. Predicting the *power outage* was a socio-technical unpredictability (dependent on tree health, grid resilience).
  3.  **The Caller:** The forecaster needed to make a binary decision (Warn/Don't Warn) based on a continuous probability distribution.

  **Where Chaos Theory is Silent:**
  Chaos theory is silent on **thresholds of relevance**.
  Mathematically, an error of 1 hPa is the same "size" as an error of 10 hPa. But for the decision-maker, 1 hPa is noise, and 10 hPa is a disaster. The theory describes the growth of the error, but it cannot define the *tolerance* for that error.
  Furthermore, chaos theory assumes the model is a perfect representation of the dynamics, subject only to initial noise. The Great Storm highlights **Structural Uncertainty** (model error). Chaos theory handles "we don't know the starting point." It is much quieter on "we don't know the equations."

  **Conclusion for your piece:**
  The Great Storm wasn't a failure of chaos theory; it was a failure to apply it. The forecasters treated a chaotic system as a clockwork one. They treated a First Kind problem (trajectory) as if it were deterministic, and they ignored the fact that their Predictand (pressure) was not the Public's Predictand (safety).
  The storm teaches us that predictability is not about how well we know the weather; it is about how well we can map our uncertainty onto someone else's risk. The Met Office in 1987 had the former (mostly); they completely lacked the latter.
