  2.  **Deconstruct the Framework:**
      *   *Predictability of the First Kind:* Initial Value Problem (IVP). Given state $X_0$, predict $X_t$. Sensitive to initial conditions (Butterfly Effect). Relevant for weather forecasting (days/weeks).
      *   *Predictability of the Second Kind:* Boundary Value/Forcing Problem. Given changed parameters (e.g., CO2 levels), predict statistical shift (climate). Relevant for climate change.
