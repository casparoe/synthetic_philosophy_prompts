      *   *Check:* The "Predictand" point. The user thinks the model got the track right but the wind wrong. Actually, the model got the track wrong too (kept it south). I need to clarify that. The model said "Low goes south, wind stays south." Reality: "Low goes north, wind comes here." So it *was* a trajectory error.

  9.  **Final Polish:** Ensure the distinction between "forecasting the weather" (Type I) and "forecasting the risk" (Decision Theory) is clear. The Met Office failed at the translation layer.

  **(Self-Correction Note on Type II):** I need to be careful not to conflate Type II with Climate. Type II is strictly about boundary conditions. Asking "Is this storm dangerous?" is definitely Type I. However, asking "Is the *regime* becoming stormier?" is Type II. I must make this distinction sharp for the journalist.

  **(Self-Correction on Ensembles):** Ensembles didn't exist in '87. I must acknowledge this anachronism while answering the hypothetical "what if" or "what should they have done conceptually." The prompt asks "with an ensemble putting a small but real probability..." so I can answer hypothetically.

