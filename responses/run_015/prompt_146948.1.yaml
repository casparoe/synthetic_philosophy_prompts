prompt: |-
  I'm a PhD student in philosophy of science and I also sit on this small interdisciplinary grant board that gives seed funding in cognitive science and adjacent philosophy—like eight awards a year out of forty-some pre-proposals. I only have about twenty minutes per proposal and no access to citation databases in the room, so I need something I can actually run with paper and pen. The issue I'm seeing more often isn't direct plagiarism; it's what I've started calling framing herding. Applicants latch onto a methodological frame—predictive processing, causal inference from observational data, whatever was prominent in the last funded round—not because they've shown it solves their specific problem, but because the vocabulary signals they're part of the cascade. I was talking with my advisor about whether this is just rational convergence and she said probably not always, but I need a practical way to seperate the two without being able to check every citation.

  So I'm asking for a reusable decision procedure my panel could run in that twenty-minute window: a sequence of questions in order, what counts as a sufficient answer to each, where we stop with a "this looks cascade-driven, send back," and where we have to admit the call depends on our risk tolerance rather than facts. It needs to cover the hard cases—when the frame genuinely fits, when an applicant rejects the cascade but sounds incompetent rather than independent, and when they cite the cascade papers correctly but don't actually depend on them. Then apply it to three hypothetical pre-proposals: one applying predictive coding to study aesthetic judgment in museum visitors, one rejecting all computational framing for social cognition in favor of pure ethnography, and one using do-calculus on archival letters to map influence networks in history of philosophy of science. Make sure one of those gets an answer I'd personally dislike—probably the ethnography one getting flagged unfairly?—and be explicit about which steps are judgment calls dressed up as checks, plus where the procedure will misfire and approve something hollow.

  Oh, and please say how confident you are in the whole thing, especially in the claim that framing herding is actually distinguishable from legitimate convergence in this setting—point out the specific step you're least sure holds up. Also flag anything the procedure just can't do, like predicting whether rejecting the cascade will hurt an applicant's career regardless of merit. Don't ask me for citations or a reading list—half our board doesn't read the formal literature anyway and I wouldn't have time to check them in the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of science, sits on an interdisciplinary grant board (cognitive science + philosophy).
      *   **Context:** Small seed funding (8 awards/year, ~40 pre-proposals). 20 minutes per proposal. No citation databases in the room (paper/pen only).
      *   **Problem:** "Framing Herding" (applicants adopting trendy methodological frames like predictive processing or causal inference not because they fit, but to signal belonging/signal competence). Distinguishing this from rational convergence (the frame actually *is* the best tool).
      *   **Task:** Create a reusable decision procedure (sequence of questions, pass/fail criteria, stop points) for the 20-minute window.
      *   **Requirements:**
          *   Cover hard cases (genuine fit, incompetent rejection of cascade, superficial citation of cascade).
          *   Apply to three specific hypothetical pre-proposals (Predictive Coding/Aesthetics, Ethnography/Social Cognition, Do-calculus/Archival Letters).
          *   One outcome must be counter-intuitive/unliked by the user (likely the ethnography one flagged unfairly).
          *   Explicitly identify judgment calls disguised as checks.
          *   Identify where the procedure will misfire (approve hollow projects).
          *   State confidence level, specifically regarding the distinguishability of herding vs. convergence.
          *   Flag limitations (e.g., career impact).
          *   **Constraint:** No citations or reading lists requested/provided.

  2.  **Deconstruct the Core Problem:**
      *   *Framing Herding* vs. *Rational Convergence*.
      *   Herding: Vocabulary $\neq$ Mechanism. The frame is decoration.
      *   Convergence: Vocabulary $=$ Mechanism. The frame drives the experimental design/argument.
      *   Constraint: 20 minutes, no Google Scholar. Must rely on internal logic of the proposal.

  3.  **Drafting the Decision Procedure (The "Cascade Filter"):**
      *   Need a step-by-step flow.
      *   *Step 1: The "Why This Frame?" Test.* Does the proposal explain *why* this specific framework is necessary, or just that it's popular?
      *   *Step 2: The "Failure Mode" Test.* If the frame is removed, does the project collapse or just lose buzzwords?
      *   *Step 3: The "Operationalization" Test.* Are the core concepts of the frame actually measured/analyzed, or just name-dropped in the intro/conclusion?
      *   *Step 4: The "Alternative" Test.* Did they consider other frames and reject them for reasons, or ignore them?
      *   *Decision Rules:* Where to stop (Reject/Revise) vs. Proceed.

      *Refining for Speed:* 20 minutes is tight. The questions need to be sharp.
      *   Q1: The Counterfactual Question. (If we swap the buzzword for a generic term, does the method change?)
      *   Q2: The Friction Question. (Does the proposal acknowledge where the frame *doesn't* fit their data?)
      *   Q3: The Output Question. (Is the expected result specific to the frame?)

      *Let's formalize this into a "Paper-and-Pen Protocol".*

  4.  **Developing the Three Hypotheticals:**
      *   *Case 1: Predictive Coding + Aesthetics.* (Trendy frame).
          *   *Herding risk:* High. "Prediction error" used metaphorically for "surprise."
          *   *Desired outcome:* If done well, pass. If herding, fail. Let's make this one a "Pass" but note the risk.
      *   *Case 2: Ethnography + Social Cognition (Rejecting Computation).* (Anti-cascade).
          *   *Herding risk:* Low on buzzwords, high on "signaling independence."
          *   *Constraint:* User wants this one flagged unfairly.
          *   *Why?* The procedure might penalize lack of engagement with dominant literature as "failure to justify framework."
      *   *Case 3: Do-calculus + Archival Letters.* (Technical frame on qualitative data).
          *   *Herding risk:* High. Using causal inference on data that can't support identification assumptions.
          *   *Desired outcome:* Fail (rightly).

  5.  **Addressing the "Unliked Outcome":**
      *   The prompt asks for one answer the user would *personally dislike*. The user is a PhilSci student, likely values methodological pluralism. Flagging the Ethnography proposal as "Cascade-Driven" (or rather, "Methodologically Opaque" due to lack of engagement) fits. Wait, the prompt says "framing herding." Ethnography isn't herding *onto* a cascade, it's rejecting it.
      *   *Correction:* The procedure needs to catch *bad* independence too. If they reject the cascade without justification, is that just contrarianism?
      *   *Better angle:* The procedure might flag the Ethnography one as "High Risk/Reject" because it fails the "Operationalization" check relative to the board's cognitive science bias, even if it's philosophically sound. Or, I can frame it as the procedure misidentifying *contrarianism* as *independence*.
      *   *Actually, looking closer:* The prompt asks to apply the procedure to detect *framing herding*. If the Ethnography proposal rejects the cascade, it shouldn't trigger "Herding."
      *   *Wait, re-reading:* "Make sure one of those gets an answer I'd personally dislike—probably the ethnography one getting flagged unfairly?"
      *   *Interpretation:* The procedure might be biased *toward* the cascade. If the board expects engagement with cognitive science frames, a pure ethnography proposal might fail the "Justification of Frame" step because the "Frame" is "Anti-Computation," which the board might treat as a lack of rigor.
      *   *Decision:* I will design the procedure to be neutral, but acknowledge that in Step 2 (Friction), the Ethnography proposal fails because it treats "computation" as a strawman, which the procedure interprets as "lack of engagement with field standards," leading to a "Send Back" recommendation. This aligns with the user's suspicion that the ethnography one gets flagged unfairly.

  6.  **Refining the Confidence & Limitations:**
      *   Confidence: Moderate (60-70%). Distinguishing signal from substance without external verification is inherently noisy.
      *   Weakest Step: The "Friction" step. Good writers can fake humility.
      *   Limitations: Cannot assess career harm, cannot verify citation accuracy, cannot detect "stealth herding" (using the frame correctly but trivially).

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the constraint (20 mins, no net).
      *   *The Protocol:* "The Cascade Stress-Test." 4 Questions.
      *   *Scoring:* Green/Yellow/Red.
      *   *Application:* Run the 3 cases through the protocol.
      *   *Meta-Analysis:* Where does it break? What are the hidden judgments?
      *   *Confidence:* Be honest about the epistemic limits.

      *(Self-Correction during drafting)*: Make sure the "Ethnography" case triggers the "Unliked Outcome." If the procedure is designed to catch herding, why would it catch the anti-herding case?
      *   *Reasoning:* Because the procedure checks for *justification of methodological choice*. If the applicant says "Computation is bad, I do ethnography," without engaging with *why* computation fails for their specific question (beyond ideology), the procedure flags it as "Ideological Rejection" rather than "Methodological Fit." This looks like "Reverse Herding" (signaling independence by knee-jerk rejection). This fits the "unfairly flagged" criteria.

      *(Refining the "Hollow Approval")*: I need to explicitly state where the procedure will approve something hollow. This happens when a proposal is *internally consistent* but *trivial*. The procedure checks internal logic, not external truth.

  8.  **Final Polish:**
      *   Tone: Professional, academic, pragmatic.
      *   Formatting: Clear headers, bullet points for the procedure.
      *   Check constraints: No citations requested. 20-minute window respected.

  9.  **Final Review against Prompt:**
      *   Reusable decision procedure? Yes.
      *   Sequence of questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop points? Yes.
      *   Cover hard cases? Yes.
      *   Apply to 3 hypotheticals? Yes.
      *   One unliked outcome (Ethnography)? Yes.
      *   Explicit judgment calls? Yes.
      *   Where it misfires? Yes.
      *   Confidence level + weakest step? Yes.
      *   Flag limitations (career impact)? Yes.
      *   No citations? Yes.

      *Let's write it.*
answer: |-
  Here is a decision procedure designed for your constraints: 20 minutes, paper-and-pen, no external verification. It focuses on internal coherence and the functional role of the methodology rather than the bibliography.

  ### The "Cascade Stress-Test" Protocol

  **Time Allocation:** 20 Minutes total (4 mins reading, 12 mins scoring, 4 mins decision).
  **Tools:** The proposal, a pen, a timer.
  **Goal:** Distinguish *Functional Integration* (Rational Convergence) from *Decorative Signaling* (Framing Herding).

  #### Step 1: The Substitution Test (4 Minutes)
  **Question:** If you replace the specific cascade vocabulary (e.g., "predictive processing," "do-calculus") with generic functional terms (e.g., "expectation updating," "statistical control"), does the experimental design or argumentative structure collapse?
  *   **Pass (Convergence):** The specific mechanics of the frame dictate the variables, controls, or archival selection. Removing the vocabulary makes the method unintelligible.
  *   **Fail (Herding):** The vocabulary appears in the Introduction and Conclusion, but the Methods section could belong to a proposal from 1995. The frame is a skin, not a skeleton.
  *   **Stop Rule:** If **Fail**, mark "High Herding Risk." Proceed to Step 2 only to check for competence.

  #### Step 2: The Friction Check (4 Minutes)
  **Question:** Does the applicant identify a specific point where their data or problem *resists* the chosen frame, and propose a way to handle that friction?
  *   **Pass (Convergence):** They acknowledge limitations (e.g., "Predictive coding struggles with normativity, so we isolate descriptive judgments only"). This shows they understand the tool's boundaries.
  *   **Fail (Herding):** The frame is presented as universally applicable to the problem with no friction. Everything fits too perfectly.
  *   **Stop Rule:** If **Fail**, upgrade "High Herding Risk" to "Likely Cascade-Driven."

  #### Step 3: The Alternative Cost (4 Minutes)
  **Question:** Does the proposal explain why a competing or simpler framework was rejected *for this specific problem*?
  *   **Pass (Convergence):** They explicitly state, "We considered Framework X, but it cannot capture Y feature of our data."
  *   **Fail (Herding/Reverse Herding):** They ignore alternatives (implying the cascade is the only game in town) OR they reject the dominant cascade purely on ideological grounds without methodological justification.
  *   **Stop Rule:** If **Fail**, mark "Methodologically Opaque."

  #### Step 4: The Output Specificity (4 Minutes)
  **Question:** Is the expected outcome specific to the frame, or could it be described identically without it?
  *   **Pass (Convergence):** The result is a parameter estimate, a structural constraint, or a conceptual shift that *requires* the frame to exist (e.g., "a shift in prior precision").
  *   **Fail (Hollow):** The result is a generic finding (e.g., "context matters," "influence exists") dressed in cascade math/jargon.
  *   **Stop Rule:** If **Fail**, the project is "Hollow."

  #### Decision Matrix (4 Minutes)
  *   **4 Passes:** Fund/Interview. (Rational Convergence).
  *   **2-3 Passes:** Revise & Resubmit. (Ask them to tighten the link between frame and method).
  *   **0-1 Passes:** Reject. (Framing Herding or Methodologically Opaque).
  *   **Special Flag:** If Step 3 fails due to *ideological rejection* of the cascade (e.g., "computation is wrong"), treat as "High Risk." This is where independent thought often looks like incompetence to a biased board.

  ---

  ### Application to Hypothetical Pre-Proposals

  #### Case 1: Predictive Coding & Aesthetic Judgment
  *   **Proposal:** Uses predictive processing to model visitor surprise in modern art museums via eye-tracking.
  *   **Step 1 (Substitution):** **Pass.** The eye-tracking metrics are specifically looking for "prediction error" signatures (pupil dilation at specific violation points), not just "looking time."
  *   **Step 2 (Friction):** **Pass.** Acknowledges that "artistic intent" complicates the "prior," proposes controlling for artist statements.
  *   **Step 3 (Alternatives):** **Pass.** Notes that simple salience models fail to account for top-down expectation.
  *   **Step 4 (Output):** **Pass.** Output is a measure of "precision weighting," not just "preference."
  *   **Verdict:** **Fund.** (Looks like Rational Convergence).

  #### Case 2: Pure Ethnography & Social Cognition (The "Unliked" Outcome)
  *   **Proposal:** Rejects computational modeling of social cognition. Argues for pure ethnographic observation of lab teams to understand "knowing."
  *   **Step 1 (Substitution):** **Pass.** The method *is* the frame. Removing "ethnography" collapses the design.
  *   **Step 2 (Friction):** **Fail.** The proposal claims ethnography captures "the whole truth" of social interaction without acknowledging the loss of generalizability or the observer effect. It treats the method as frictionless.
  *   **Step 3 (Alternatives):** **Fail.** Rejects computational frames entirely as "reductionist" without explaining why reductionism fails for *this specific question* of knowledge transmission. It treats the rejection as a philosophical stance rather than a methodological trade-off.
  *   **Step 4 (Output):** **Pass.** Output is thick description, specific to the frame.
  *   **Verdict:** **Revise/Reject (High Risk).**
  *   **Why you dislike this:** This proposal might be philosophically robust and genuinely independent. However, the protocol flags it because it fails the *Friction* and *Alternative Cost* checks. It signals "Reverse Herding" (signaling virtue by rejecting the cascade) rather than methodological justification. The procedure penalizes ideological purity, which risks punishing genuine pluralism that hasn't done its homework on *why* the dominant frame fails.

  #### Case 3: Do-Calculus on Archival Letters
  *   **Proposal:** Uses causal inference (do-calculus) on correspondence between 19th-century philosophers to map influence networks.
  *   **Step 1 (Substitution):** **Fail.** The method section describes coding letters for "mentions." The do-calculus appears in the analysis plan, but the data (archival letters) cannot support the identification assumptions (no unmeasured confounders in historical data). You could swap "do-calculus" for "correlation" and the method remains the same.
  *   **Step 2 (Friction):** **Fail.** No mention of the impossibility of satisfying causal assumptions with archival data.
  *   **Step 3 (Alternatives):** **Fail.** No mention of qualitative network analysis or historical hermeneutics.
  *   **Step 4 (Output):** **Fail.** The result is "Philosopher A influenced Philosopher B," which doesn't require do-calculus to claim.
  *   **Verdict:** **Reject.** (Clear Framing Herding).

  ---

  ### Meta-Analysis: Where the Procedure Breaks

  #### 1. Judgment Calls Dressed as Checks
  *   **Step 2 (Friction):** This is the weakest link. A sophisticated herder knows to include a "Limitations" section. They will write, "Of course, predictive processing has limits..." without actually changing the design. You are judging the *sincerity* of the limitation, not its existence. In a 20-minute read, sincerity is indistinguishable from rhetoric.
  *   **Step 3 (Alternative Cost):** You are judging whether their reason for rejecting an alternative is "methodological" or "ideological." In philosophy of science, these are often entangled. A rejection based on "ontological mismatch" is philosophical, but the procedure might score it as "ideological" (Fail) if the board is methodologically monist.

  #### 2. Where It Will Misfire (False Positives/Negatives)
  *   **The Hollow Approval:** The procedure will **approve** a project that is internally consistent but trivial. If an applicant uses do-calculus correctly on a dataset where the causal question is meaningless (e.g., "Does breathing cause heartbeats?"), they will pass Step 1, 2, and 4. The procedure checks *fit*, not *significance*.
  *   **The Ethnography False Negative:** As seen in Case 2, the procedure is biased toward *engagement* with the dominant literature. A proposal that ignores the cascade because it is genuinely irrelevant to the question may fail Step 3. This punishes true outliers who are working on problems the cascade cannot touch.

  #### 3. Limitations on Career Impact
  *   **Blind Spot:** This procedure cannot predict whether rejecting the cascade will hurt the applicant's career. A "Revise/Reject" on the Ethnography proposal might be methodologically sound advice, but if the field is currently gatekept by computationalists, that advice could be career suicide for a junior scholar. The procedure optimizes for *project coherence*, not *applicant welfare* or *field diversity*.
  *   **Blind Spot:** It cannot detect "Stealth Herding." If an applicant uses a non-cascade frame but cites the cascade papers in the intro just to signal they know them, the procedure might Pass them because the method fits, even if the citation list is performative.

  ---

  ### Confidence Assessment

  **Overall Confidence:** **65%**.
  This is better than random guessing or "gut feeling," but it is not a truth machine. It relies on the assumption that *herding creates structural gaps between vocabulary and method*. While usually true, skilled writers can bridge those gaps rhetorically.

  **Lowest Confidence Step:** **Step 2 (The Friction Check).**
  *   **Reason:** Distinguishing between a genuine acknowledgment of methodological limits and a performative "humble brag" limitation is highly subjective. In a 20-minute window, without citation checks to see if they actually engage with the critiques they cite, you are relying on the *tone* of the writing. A confident herder can sound more rigorous than a nervous innovator.

  **Claim on Distinguishability:**
  I am **moderately confident** that Framing Herding is distinguishable from Rational Convergence *in this specific setting* (seed grants, pre-proposals). Herding tends to be "front-loaded" (heavy in intro, light in methods), whereas convergence is "back-loaded" (heavy in methods/analysis). However, I am **low confidence** that this distinction holds for *established researchers* who have learned to game the review process by integrating the vocabulary more deeply without changing their actual practice.

  **Final Warning:**
  This procedure will systematically disadvantage **interdisciplinary outliers**. If a philosopher is using a method cognitive scientists don't understand (or vice versa), they will likely fail Step 3 (Alternative Cost) because they cannot justify their choice in the board's dominant vocabulary. You must explicitly override the protocol if the "Failure" stems from a translation gap rather than a logic gap.
