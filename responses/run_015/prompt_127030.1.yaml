      *(Self-Correction during drafting)*: I need to be careful with "Performativity." In ML (e.g., Perdomo et al.), performativity usually means the prediction changes the *outcome* (Y). Hacking means the classification changes the *kind* (the definition of Y itself). I need to highlight this distinction. Also, "Ground Truth" is a dangerous term to use in the translation because Hacking denies it. I must use it ironically or explicitly mark it as the point of failure.

      *(Refining the "Good Loop" point)*: In ML, a "good" change is usually convergence or stability. In Hacking, a "good" change might be *more* complexity or *more* agency, even if it hurts accuracy. I need to make sure this contrast is sharp.

  8.  **Final Polish:** Ensure the "Residue Report" explicitly categorizes the missing pieces as requested (defect of vocab vs. Hacking less distinctive). Most will be defects of the vocab because ML is epistemically realist while Hacking is ontologically dynamic.

