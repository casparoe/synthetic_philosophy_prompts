      *   *The "Smuggling" Issue:* If you say "don't change human preferences," you've just solved alignment. If you say "don't change pixel values," you're a paperclip maximiser that freezes the world.
      *   *The "Conservative" Issue:* Relative Reachability, Attainable Utility Preservation (AUP) try to solve this, but often lead to "managing the news" or inaction.

  3.  **Drafting the Desiderata (The "Real Spec"):**
