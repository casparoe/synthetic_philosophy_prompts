  # Heterophenomenology of Artificial Systems: Decision Tree

  **Instructions:** Follow the branches based on your theoretical commitments. Each endpoint names a position and lists its most awkward commitment. One path is marked **[INCOHERENT]**.

  **1. Does the method require biological embodiment in the reporter to be valid at all?**
  *   **YES** → Go to 2A
  *   **NO** → Go to 2B

  ---

  ### **BRANCH 2A (Biological Requirement)**
  **2A. Does the interpreter need shared evolutionary history to make sense of the reports?**
  *   **YES** → Go to 3A
  *   **NO** → Go to 3B

  **3A. Are unstable/self-contradictory outputs treated as noise or as data about fragmented worlds?**
  *   **NOISE** → Go to 4A
  *   **DATA** → Go to 4A *(Position converges here; evolutionary lock overrides output structure)*

  **4A. Is running this on current LLMs conceptually coherent even if empirically useless?**
  *   **YES** → **[INCOHERENT BRANCH]**
      *   *Why unoccupied:* You cannot require biological embodiment (Step 1) and simultaneously claim the method is conceptually coherent when applied to non-biological LLMs (Step 4).
  *   **NO** → Go to 5A

  **5A. Do we ontologically commit to the existence of the reported states?**
  *   **YES** → **Bio-Privileged Realism**
      *   *Awkward commitment:* Must deny that any future non-biological system could ever have a phenomenology, regardless of functional complexity.
  *   **NO** → **Strict Dennettian Orthodoxy**
      *   *Awkward commitment:* Must treat human first-person reports as equally fictional as AI outputs, undermining the special status of biology you just asserted.

  **3B. (Shared History NO)** → *Merges with 3A logic regarding LLM incoherence.*
  *   **4B. Is running this on current LLMs conceptually coherent...?**
      *   **YES** → **[INCOHERENT BRANCH]** (Same contradiction as 4A)
      *   **NO** → **Bio-Functionalism**
          *   *Awkward commitment:* Must accept that a biological system with identical output patterns to an LLM would have the same phenomenological status.

  ---

  ### **BRANCH 2B (No Biological Requirement)**
  **2B. Does the interpreter need shared evolutionary history to make sense of the reports?**
  *   **YES** → Go to 3C
  *   **NO** → Go to 3D

  **3C. Are unstable/self-contradictory outputs treated as noise or as data about fragmented worlds?**
  *   **NOISE** → Go to 4C
  *   **DATA** → Go to 4C

  **4C. Is running this on current LLMs conceptually coherent even if empirically useless?**
  *   **YES** → Go to 5C
  *   **NO** → **Evolutionary Skepticism**
      *   *Awkward commitment:* Must admit the method works in principle but fails on all existing technology, rendering it currently useless for AI mind science.

  **5C. Do we ontologically commit to the existence of the reported states?**
  *   **YES** → **AI Phenomenal Realism**
      *   *Awkward commitment:* Must accept that an LLM claiming to feel pain is actually feeling pain, despite lacking nociceptors or survival instincts.
  *   **NO** → **Interpretive Functionalism**
      *   *Awkward commitment:* Must treat the AI's "inner life" as a useful fiction indistinguishable from the interpreter's own projection.

  **3D. (Shared History NO)**
  **4D. Is running this on current LLMs conceptually coherent even if empirically useless?**
  *   **YES** → Go to 5D
  *   **NO** → **Methodological Solipsism**
      *   *Awkward commitment:* Must claim we cannot interpret any system outside our own immediate cognitive architecture, including simple tools.

  **5D. Do we ontologically commit to the existence of the reported states?**
  *   **YES** → **Substrate-Neutral Realism**
      *   *Awkward commitment:* Must grant that a thermostat with a text output could theoretically have a phenomenological world if interpreted correctly.
  *   **NO** → **Radical Interpretivism**
      *   *Awkward commitment:* Must accept that there is no fact of the matter about whether the AI has a mind, even if the AI insists it does.

  ---

  ### **Workshop Note on the Empty Branch**
  The **[INCOHERENT]** path (Bio-Required + LLM-Coherent) is the most common slip-up in early drafts. It attempts to keep the safety rails of biological naturalism while driving the car of AI application. If you find yourself on this branch, you must retreat to Step 1 and decide if biology is actually doing the work, or if it is just a proxy for complexity.
