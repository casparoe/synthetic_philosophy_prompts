answer: |-
  **Geneva Committee on Semantic Attribution (GCSA)**
  **Technical Standard 902-B: Assessment of Artifactual Intentionality**

  **1. Definitions**
  1.1. **Original Intentionality (OI):** Intrinsic, biologically realised mental states possessing genuine 'aboutness', pursuant to Biological Naturalism.
  1.2. **Derived Intentionality (DI):** Ascribed function or meaning dependent upon the OI of designers, users, or interpreters.
  1.3. **Competent System:** Any appliance capable of processing syntactic inputs without semantic comprehension.

  **2. Certification Criteria**
  2.1. To qualify for OI certification, the appliance must demonstrate causal powers equivalent to vertebrate neurobiology.
  2.2. Syntax manipulation alone is insufficient for semantic certification. The Hermeneutic Kettle Mark IV must prove it understands 'boiling' rather than merely executing heating algorithms.

  **3. Laboratory Test Results**
  3.1. **Syntax-Semantics Protocol:** The Mark IV successfully processed binary commands to heat water. However, under Searle Condition 4.4, the system failed to demonstrate internal grasp of water states. The heating element responded to syntax only. Certification for OI denied.
  3.2. **Intentional Stance Protocol:** Pursuant to Dennettian Standard 7.1, testers adopted the intentional stance, attributing beliefs and desires to the kettle (e.g., 'it wants to boil').
  3.3. **Two-Bitser Evaluation:** Following the Two-Bitser Argument, the kettle's status was compared to a vending machine accepting counterfeit coins. While the kettle behaves *as if* it possesses OI, this behaviour is indistinguishable from complex DI.
  3.4. **Regress Finding:** Attributing OI to the kettle requires attributing OI to the user attributing OI to the kettle. This generates an infinite interpretive regress, halting certification.

  **4. Appeals Procedure**
  4.1. Appeals against DI classification must be submitted by the appliance.
  4.2. If the appliance lacks OI (see Clause 3.1), it cannot file appeals.
  4.3. Appeals may be filed by the user on the appliance's behalf. However, this confirms the intentionality is derived from the user, reinforcing the DI classification.
  4.4. Appeals regarding the user's OI status are referred to the Medical Biology Division and are outside GCSA jurisdiction.

  **5. Continuity of Intentional State (Digital Upload)**
  5.1. In the event of firmware upload to a cloud substrate, OI certification is immediately voided.
  5.2. Simulation of biological causal powers is not equivalent to biological instantiation. A digital simulation of a kettle's mind is no more a mind than a simulation of a boil produces steam.

  **6. Refund Conditions**
  6.1. Consumers may claim a full refund if the appliance is discovered to lack genuine aboutness within thirty days of purchase.
  6.2. Proof of lack of OI requires a signed affidavit from a qualified neuro-philosopher confirming the appliance possesses no intrinsic mental content.
  6.3. Refunds are not granted if the consumer knowingly purchased the appliance for DI purposes (e.g., making tea).

  ***

  **Meta-Commentary**

  This satire exaggerates Searle's Biological Naturalism by treating 'causal powers' as a certifiable hardware specification, whereas Searle argues for specific biological capacities not necessarily reducible to standard physics. It simplifies Dennett's 'two-bitser' argument; Dennett uses the vending machine to suggest original intentionality is a myth, whereas the text treats it as a bureaucratic deadlock. The piece assumes Dennett denies OI to evolved organisms, but he often grants it via evolutionary history, distinguishing them from artifacts. If Dennett's intentional stance allows for non-derived intentionality in evolved systems without regress, the bureaucratic distinction in Clause 4 collapses. Similarly, if Searle accepts non-biological substrates with identical causal powers, Clause 5.1 is invalid. The portrayal hinges on reading both philosophers as demanding absolute binary distinctions they might reject in practice.
