answer: |-
  Here is the step-by-step breakdown you asked for. I am going to treat this with the rigor it deserves, because your observation cuts straight to the bone of modern moral philosophy. You have intuitively rediscovered a tension that kept philosophers busy for the latter half of the 20th century.

  Per your instructions, I will not give you the answer immediately. I will brainstorm the candidate concepts, test them against your specific criteria (especially the "similarity" variable), rule out the ones that don't fit, and then settle on the most accurate designation.

  ### Phase 1: Brainstorming Candidate Concepts

  Here are the five strongest candidates from the literature that might name what you are seeing:

  1.  **The Aggregation Problem:** This deals with whether small harms to many can sum up to outweigh a large harm to one.
  2.  **Agent-Relative Constraints:** The idea that I have special reasons not to harm someone myself, even if it prevents more harm elsewhere.
  3.  **Contractualist Reasonable Rejection:** The idea that a principle is wrong if a person could reasonably reject it (Scanlon).
  4.  **The Separateness of Persons:** The claim that society is not a super-individual, so we cannot trade off between lives like we do within one life (Rawls/Nozick).
  5.  **Reductionist Personal Identity:** The view that "personhood" is just psychological connectedness, which can come in degrees (Parfit).

  ### Phase 2: Ruling Out the Candidates

  Let's test these against your two main constraints:
  *   **Constraint A:** It must explain the difference between *intrapersonal* (one person over time) and *interpersonal* (two people) trade-offs.
  *   **Constraint B:** It must explain why the objection *weakens* when the people are psychologically similar ("near-copies") and *strengthens* when they are diverse.

  **1. The Aggregation Problem**
  *   *Verdict:* **Rule Out.**
  *   *Why:* This addresses whether we can add up numbers (100 headaches vs. 1 death). It does not explain why adding up numbers is fine *inside* a life but problematic *between* lives. It also doesn't account for the psychological similarity variable.

  **2. Agent-Relative Constraints**
  *   *Verdict:* **Rule Out.**
  *   *Why:* This explains why *I* shouldn't push the fat man off the bridge. But your example is about a third party deciding for two others ("one kid gets a headache, another gets music"). Agent-relativity is about the *actor's* position, not the *structure of the trade-off* between victims.

  **3. Contractualist Reasonable Rejection**
  *   *Verdict:* **Strong Contender, but Imperfect.**
  *   *Why:* This handles the "who are you to decide" aspect well. The kid with the headache can reasonably reject a principle that says "we can hurt you for someone else's music."
  *   *The Flaw:* It struggles with your "similarity" variable (Constraint B). In standard Contractualism, a person is a person. Whether they are a "near-copy" or wildly unique shouldn't change their standing to reject a principle. Their individuality is binary, not gradient.

  **4. Reductionist Personal Identity (Parfit)**
  *   *Verdict:* **Explains Constraint B, misses Constraint A's political weight.**
  *   *Why:* Derek Parfit argued that personal identity is just psychological connectedness. If I am very different from my future self, trade-offs feel like they are between two people. If two different people are psychologically identical, trade-offs feel like they are within one person. This perfectly explains your "similarity" intuition.
  *   *The Flaw:* On its own, this is a metaphysical claim about *identity*, not a moral claim about *justice*. It explains *why* you feel the difference, but it isn't the name of the moral objection itself.

  **5. The Separateness of Persons**
  *   *Verdict:* **The Core Concept.**
  *   *Why:* This is the classic label for Constraint A (Intra vs. Inter). John Rawls used this phrase to criticize Utilitarianism, arguing that Utilitarianism treats society as a single super-person, ignoring the distinct boundaries between lives.
  *   *The Nuance:* Standard Rawlsian theory treats persons as distinct black boxes. It doesn't explicitly grade the "distinctness" based on psychological similarity. However, when combined with Parfit's insights (Candidate 4), it becomes the complete picture.

  ### Phase 3: The Verdict

  There is no single single-word noun that captures the *entire* pattern including the similarity gradient. However, the established philosophical anchor for this phenomenon is:

  **The Separateness of Persons**

  However, to be rigorously accurate regarding your second observation (the similarity variable), you are describing a **Parfitian Extension of the Separateness of Persons.**

  Here is the breakdown of what this IS, what it ISN'T, and the edges you requested.

  #### 1. What the concept IS
  It is the moral claim that the boundary between two human beings is morally significant in a way that the boundary between two moments in time is not. Utilitarianism (the "just add up happiness" view) assumes that pain is pain, regardless of where it lands. The **Separateness of Persons** argues that the *distribution* of pain across distinct agents matters independently of the *sum* of pain.

  Your insight about "near-copies" aligns with **Derek Parfit's Reductionist View**. Parfit argued that if psychological connectedness is what matters, then the "Separateness" is a matter of degree.
  *   **High Separateness:** Diverse people with different life plans. (Trade-offs are hard to justify).
  *   **Low Separateness:** "Near-copy" people with identical lives. (Trade-offs feel easier, closer to intrapersonal).

  #### 2. What the concept IS NOT
  *   **It is not simply "Consent":** You asked if consent is a red herring. It is partially one. People reach for "consent" because it is a clean legalistic way to mark the boundary. But the deeper issue is **Inviolability**. Even if the kid with the headache *didn't* consent, but was compensated later, the objection remains. The core issue is that one life cannot be used as a vessel for another's benefit, not just that they didn't sign a form.
  *   **It is not "Fairness" in the standard sense:** Fairness usually implies everyone gets the same share. You can have a fair distribution of harm (everyone gets a headache) that is still morally wrong if it was done to benefit a specific other person without their input. This is about **Rights/Constraints**, not just distribution.

  #### 3. Carving the Edges (Your Specific Questions)

  **Q: Does it apply when nobody knows who the cost will land on (Lottery/Ex-Ante)?**
  *   **Answer:** This weakens the objection significantly. This is the distinction between **Ex-Ante** and **Ex-Post** equality.
  *   *Reasoning:* If everyone agrees to a lottery *beforehand*, the trade-off is effectively moved *inside* each person's life. Each person accepts a small risk of a headache for a chance at the music. Because the risk is distributed equally *before* the outcome, the "Separateness" barrier is lowered. We accept this in insurance and social contracts. The objection is strongest when the sacrifice is targeted *ex-post* (after the fact).

  **Q: Does it apply to groups, teams, or nations?**
  *   **Answer:** Generally, **No.**
  *   *Reasoning:* The "Separateness of Persons" applies to sentient moral patients (individual humans). A "team" or "nation" does not feel pain; the individuals within it do. If you sacrifice one team member for the team's glory, the objection applies because the *person* is being sacrificed. If you sacrifice one *nation* for the good of a global alliance, the objection applies because the *citizens* are being sacrificed. The boundary protects the individual, not the collective.

  **Q: Does it genuinely get weaker when people are psychologically similar?**
  *   **Answer:** **Yes, but this is controversial.**
  *   *Reasoning:* This is the Parfitian edge. If the thousand people are truly "near-copies" (same memories, same desires), sacrificing one for the other feels less like "using a person" and more like "shifting resources within a system."
  *   *The Counter-Argument:* Many Kantian philosophers would disagree. They argue that **Distinctness is Binary.** You are either a rational agent or you are not. Your psychological content (your hobbies, memories) does not change your status as an end-in-itself. So, a strict Kantian would say your intuition about the "near-copies" is a bias, not a moral truth. A Utilitarian would say the similarity is irrelevant; only the sum matters. Your intuition sits in the middle, with Parfit.

  **Q: Is consent part of the actual thing or a red herring?**
  *   **Answer:** **It is a proxy, not the core.**
  *   *Reasoning:* Consent matters because it is the only mechanism that allows an interpersonal trade-off to be re-framed as an intrapersonal one. By consenting, I incorporate your benefit into my own will. But the *reason* we need consent is because of the Separateness of Persons. If there were no separateness (if we were all one hive mind), consent wouldn't be necessary. So Separateness is the foundation; Consent is the bridge we build over it.

  #### 4. Is there a name for the whole pattern?
  Since "The Separateness of Persons" doesn't explicitly include the "similarity gradient" in its standard definition, and you need a term for your project that captures the *whole* phenomenon (including the similarity nuance), I propose you use the established term but qualify it.

  **Established Term:** **The Separateness of Persons Objection.**
  **Precise Definition for your project:** The moral claim that utility cannot be aggregated across distinct agents without remainder, where the "distinctness" of agents is modulated by their psychological continuity and diversity of life plans.

  If you need a coined term to capture the specific "similarity" nuance for your project, you could call it:
  **"Gradient Separateness"**
  *   **Definition:** The view that the moral barrier against interpersonal trade-offs is not absolute but varies based on the degree of psychological divergence between the agents involved.
  *   **Case it Covers:** Your "Case 2" (Diverse people, strong objection) vs "Case 1" (Near-copies, weak objection).
  *   **Near-Miss Case 1 (Should NOT cover):** A situation where people are diverse but *consent*. (Gradient Separateness explains the barrier, Consent explains the exception).
  *   **Near-Miss Case 2 (Should NOT cover):** A situation where one person is harmed to save themselves later. (This is intrapersonal, so Separateness doesn't apply at all).

  #### 5. Is this aimed only at Utilitarianism?
  **Answer:** Primarily, **Yes.**
  *   **Reasoning:** Utilitarianism (and Consequentialism generally) is the only major framework that explicitly says "add up the happiness, ignore the boundaries."
  *   **Nuance:** However, it also creates trouble for any view that relies on **Aggregation**. For example, some forms of Prioritarianism (helping the worse off) still aggregate value. The Separateness of Persons is the primary weapon used by **Deontologists** (rights-based) and **Contractualists** (agreement-based) to stop Utilitarian calculations. It does not trouble Virtue Ethics as much, because Virtue Ethics rarely calculates trade-offs in this arithmetic way to begin with.

  ### Summary for your Project
  You are observing the **Separateness of Persons**, specifically viewing it through a **Parfitian lens of Psychological Connectedness**.

  *   **The Core:** Utilitarianism treats society as one person.
  *   **The Objection:** Society is many people.
  *   **Your Insight:** "Manyness" is a spectrum. The more different the people, the stronger the boundary. The more similar they are, the more society looks like one person, and the more Utilitarian math feels acceptable.

  This is a sophisticated distinction. If you present this as "The Separateness of Persons modulated by Psychological Connectedness," you will be philosophically precise.
