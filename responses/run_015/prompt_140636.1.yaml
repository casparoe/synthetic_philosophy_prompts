      *   **Vessel A (Trust's Boat):** Piecemeal replacement over 40 years. Very little original timber. Mast, rigging, engine replaced. *Verdict:* Same boat. (Continuity of existence, function, registration).
      *   **Vessel B (Comparable Boat):** Dismantled, timbers stored, rebuilt (80% original material) on new cradle. *Verdict:* Reconstruction/New Build. (Gap in existence).
      *   **Rule:** 60% structural fabric threshold for "maintaining an original vessel."
      *   **Decision Mechanism:** Majority vote near the line (but trustees believe truth is mind-independent).
      *   **Analogy:** Human persons (cell replacement = same person; brain death = different/not person, even if body warm).
      *   **Tension:** Continuity of matter (B has more) vs. Continuity of existence/form (A has more).

  3.  **Stage 1: What is the practice tracking?**
      *   *Matter:* Explicitly tracked (60% rule).
      *   *Form/Function:* Implicitly tracked (A is still a boat, sails, same name).
      *   *Spatio-Temporal Continuity:* Crucial for A vs. B. A never ceased functioning/being afloat. B had a "gap."
      *   *Causal History:* A has an unbroken chain of maintenance. B has a break.
      *   *Convention/Administration:* Registration, name, insurance class.
      *   *Psychological/Biological Analogy:* The human case suggests a "vital principle" or functional continuity (brain/function) over matter.

  4.  **Stage 2: Reconstructing the Implicit Theory:**
      *   It's not pure Endurantism or Perdurantism in the textbook sense.
      *   It looks like a *Hybrid Sortal-Dependent Theory*.
