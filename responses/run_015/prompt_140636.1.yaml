  ### Stage 1: Cataloguing the Criteria
  Your trust's practice is not tracking a single property. It is juggling at least four distinct dimensions of persistence, often weighting them differently depending on the context (grant eligibility vs. registration vs. insurance).

  1.  **Spatio-Temporal Continuity:** This is the primary driver for your trust's vessel (Vessel A). The fact that she was never "out of the water" or "out of service" allows you to ignore the replacement of matter. This tracks a continuous world-line.
  2.  **Material Constitution:** This is the primary driver for the 60% rule and the assessment of the dismantled vessel (Vessel B). Here, the specific atoms (or planks) matter. The intuition is that if the material is removed from the functional context, the object dissolves, and reassembly is creation, not restoration.
  3.  **Functional/Organisational Continuity:** This is the driver for the human analogy. A person survives cell replacement because the *organisation* of life continues. A person does not survive brain death because the *control function* ceases, even if the body (matter) remains.
  4.  **Administrative/Conventional Continuity:** This is the registration, the name, and the logbook. This is a social artefact layer that runs parallel to the physical object.

  **The Tension:** Your practice privileges *Spatio-Temporal Continuity* for Vessel A (she is the same despite new matter) but privileges *Material Constitution* for the Grant Threshold (she is not "original" if matter drops below 60%). Furthermore, it privileges *Spatio-Temporal Continuity* over *Material Constitution* regarding Vessel B (the gap kills identity even if 80% of matter returns), which contradicts the logic that matter is the primary constraint.

