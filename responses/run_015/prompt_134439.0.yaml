answer: |-
  Nietzsche's *On the Advantage and Disadvantage of History for Life* does not approach history as a pursuit of objective truth, but as a biological and cultural necessity. For Nietzsche, the past must be forgotten or remembered selectively to allow the present to act ("for life"). When you ask whether your counter-narrative is legitimate, Nietzsche would shift the question from "Is this objectively true?" to "Does this history serve life or stifle it?"

  Here is an analysis of your situation through the specific lens of Nietzsche's three modes of history (Monumental, Antiquarian, Critical) and his views on preservation.

  ### 1. Intentional Distortion vs. Systemic Effect
  Nietzsche argues that distortion is inherent to *all* history because the living must interpret the past to sustain their own existence. However, the specific distortion you describe—where the official narrative justifies existing hierarchies—is a **systemic effect of institutional control**, not necessarily a conscious conspiracy by specific victors.

  In Nietzsche's framework, "Monumental History" is the mode that looks to the past for examples of greatness to inspire present action. The danger arises when those currently in power define what counts as "great." They select past deeds that mirror their own ambitions and erase those that do not. This creates a "false continuity." The town historians are not necessarily lying intentionally; they are engaging in Monumental History that serves the *current* landowners' need for legitimacy. By framing the cooperative as an "inefficient experiment," they validate the current private ownership model. The exclusion of the cooperative's records is structural because the institution (the town archive) exists to preserve the continuity of the town's current power structure, not to preserve "truth."

  ### 2. Monumental vs. Critical History for the Unarchived
  You ask if your counter-narrative is doomed to be either Monumental (glorifying workers) or Critical (merely negating the owners). Nietzsche would argue that recovering a suppressed past is inherently an act of **Critical History**.

  *   **Critical History** is the mode used when the past becomes a burden that chains the present. It involves putting the past on trial and condemning it to break its power. By using the ledger to challenge the "inevitability" of the mill's failure, you are performing a Critical act. You are breaking the chain of the official narrative that paralyzes alternative understandings of social organization.
  *   **The Risk:** The danger lies if you swing too far into **Monumental History**. If you use the ledger solely to paint the workers as martyrs or the cooperative as a utopian ideal to serve a modern political agenda, you are replicating the same error as the town historians. You would be selecting facts to mirror *your* present ambitions rather than liberating the past.
  *   **Antiquarian History** is less relevant here, as that mode reveres the past for its own sake. Since the ledger was excluded, it was denied Antiquarian protection.

  Therefore, your work is not "doomed" to be Critical; it *must* be Critical to be just. It only becomes problematic if it hardens into a new dogma (a new Monumentalism).

  ### 3. Epistemic Status of the Recovered Ledger
  If harm is structural (rooted in what survives), Nietzsche implies that the epistemic status of the ledger is not that of "objective proof" but of **disruptive contingency**.

  Nietzsche is skeptical of the idea that accumulating facts leads to truth. Instead, he values history that opens possibilities for life. The official record claims the fire was the "inevitable collapse" of a collective experiment. This closes off the past (it *had* to happen this way). The ledger, by showing viability, restores **contingency**. It proves that things could have been otherwise.

  For Nietzsche, the ledger does not need institutional authority to be valid. Its validity comes from its capacity to shatter the "idolatry" of the official record. It functions as a weapon against the "historical sickness" of the town, which has forgotten that their current reality was built on the destruction of an alternative. The ledger's value is not that it corrects the record in a positivist sense, but that it liberates the present from the false necessity of the past.

  ### Summary of Unresolved Tension
  The remaining difficulty, which Nietzsche acknowledges but does not fully solve, is the tension between "serving life" and "intellectual honesty." If you use the ledger to serve a modern cause (justice for workers), you are still interpreting the past for the sake of the present (which Nietzsche says we must do). However, without institutional frameworks for validation, how do you prevent your Critical history from becoming just another biased fiction? Nietzsche would say you cannot prevent it entirely; you can only ensure your interpretation strengthens the culture's ability to live and act justly, rather than reinforcing a dead hierarchy.

