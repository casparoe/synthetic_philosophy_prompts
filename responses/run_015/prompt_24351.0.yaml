answer: |-
  Your intuition is sharp, but I think the "serious vs. ad hoc" distinction is a symptom rather than the root cause. If the debate were merely about defining "serious theory," we could settle it by stipulation. The fact that we can't suggests the disagreement is deeper.

  Here is a diagnosis of the impasse, followed by an analysis of what progress would look like versus why the stalemate might be structural.

  ### 1. The Diagnosis: A Circular Justification of Theoretical Virtues

  You are correct that the "triviality objection" relies on a filter to separate *ad hoc* gerrymandering from *serious* rivals. However, the disagreement isn't just about where to draw that line; it is about **whether the tools used to draw the line are themselves underdetermined.**

  To rule out a trivial rival (e.g., $T' = T + \text{"observations are as if T"}$), you must appeal to theoretical virtues: simplicity, coherence, explanatory power, fertility, etc. You say $T'$ is "ad hoc" because it lacks these virtues.

  *   **The Anti-Underdetermination Move:** "We use theoretical virtues to select the unique best theory. Therefore, underdetermination is solved in practice."
  *   **The Underdetermination Counter:** "Why think theoretical virtues track truth? If evidence underdetermines theory, it likely underdetermines the value of the virtues themselves. You are using the contested tools to solve the contest."

  **The Core Disagreement:** This is not a verbal dispute about the word "theory," nor is it purely empirical. It is a **meta-epistemological clash regarding the warrant of non-empirical virtues.**
  *   One side treats theoretical virtues as **epistemic** (they indicate likelihood of truth).
  *   The other side treats them as **pragmatic** (they indicate utility, not truth).

  The debate stalls because every attempt to resolve underdetermination appeals to virtues, and every challenge to underdetermination challenges the truth-conduciveness of those virtues. It is a justificatory circle.

  ### 2. The Modal and Scope Mismatch

  A second layer of the impasse is a mismatch in **modal scope**.

  *   **The Quinean/Underdetermination Claim** is often **Global and Modal**: It argues that *in principle*, for any body of evidence, there *could* exist a rival. It relies on logical space.
  *   **The Anti-Underdetermination Claim** is often **Local and Actual**: It argues that *in practice*, scientists do not *actually* encounter persistent, serious rivals. It relies on historical and sociological fact.

  When the Underdetermination proponent says, "Logic allows a rival," the Opponent says, "Science doesn't find one." They are talking past each other. One is making a claim about the structure of confirmation; the other is making a claim about the history of scientific practice.

  This explains why "non-trivial cases" (like your Lagrangian example) don't kill the debate. The Opponent concedes the local case but denies the global inference. The Proponent uses the local case to prove the global vulnerability. There is no agreed-upon rule for how many local cases are needed to prove a global thesis.

  ### 3. What Would Count as Progress?

  Given this diagnosis, a standard "solution" (proving one side right) is unlikely. Progress would require changing the terms of engagement. Here are three viable paths:

  **A. The Historical Induction (Empirical/Sociological Shift)**
  Instead of asking "Is there a rival now?", ask "Have we missed rivals before?" This is Kyle Stanford's "Problem of Unconceived Alternatives."
  *   **Progress Condition:** A rigorous historical demonstration that past scientists consistently failed to conceive of empirically equivalent alternatives that were later found to be superior.
  *   **Why it moves the needle:** It shifts the debate from *logical possibility* (which is cheap) to *historical pattern* (which is evidence-based). If the record shows we are bad at exhausting theory space, the burden shifts to the realist to explain why *now* is different.

  **B. The Bayesian Formalization (Probabilistic Shift)**
  Move away from binary "fits/doesn't fit" logic to probabilistic credences.
  *   **Progress Condition:** A consensus on how to assign priors to theoretical virtues. If we can agree that "simplicity" warrants a specific prior probability boost, underdetermination becomes a matter of degree rather than a binary block.
  *   **The Hurdle:** This usually hits the "Subjectivity of Priors" wall. Progress here requires a defense of objective priors (e.g., via symmetry arguments or information theory) that both sides accept.

  **C. Dissolution via Constructive Empiricism (Semantic Shift)**
  Change the goal of science from "Truth" to "Empirical Adequacy."
  *   **Progress Condition:** If the aim of science is merely to save the phenomena (van Fraassen's move), underdetermination between $T_1$ and $T_2$ ceases to be a threat. Both are adequate; choosing one is pragmatic, not epistemic.
  *   **Why it moves the needle:** It removes the stakes. The debate persists because Realism is on the line. If you lower the stakes, the pressure releases.

  ### 4. The Case for Structural Impasse

  There is a strong argument that **no progress should be expected** because the debate serves a functional role in the ecosystem of philosophy of science.

  **The Engine of Scrutiny:**
  Underdetermination functions as a **regulative ideal**.
  *   If the Anti-UD side "wins," realism becomes dogmatic. Scientists might ignore viable alternatives or reify current models too strongly.
  *   If the UD side "wins," science becomes purely instrumentalist. Motivation for deep theoretical unification might wane.

  The tension forces realists to refine what they mean by "truth" (e.g., moving to structural realism) and forces skeptics to acknowledge that science isn't *just* guesswork.

  **The Structural Reason:**
  The impasse is structural because it rests on the **Gap between Evidence and Ontology**.
  *   Evidence is finite and observational.
  *   Theory is infinite and often unobservable.
  *   Any bridge between them (inference to the best explanation, Bayesian updating, etc.) requires a premise that cannot be empirically verified without begging the question.

  As long as philosophy of science cares about the link between *data* and *reality*, this gap exists. You cannot close the gap without assuming a principle that bridges the gap. Justifying that principle requires bridging the gap.

  ### Summary Diagnosis
  The disagreement is not verbal, nor is it purely about the definition of "serious theory." It is a **foundational standoff over the epistemic authority of non-empirical virtues.**

  *   **Progress** is possible only if you shift the question from "Is there underdetermination?" (Logical) to "Does underdetermination persist historically?" (Empirical) or "Does underdetermination matter if we change the goal of science?" (Normative).
  *   **Impasse** is expected if the goal remains "Justifying Scientific Realism against Logical Skepticism," because the tools required for the justification are the very tools being questioned.

  The debate hasn't moved in forty years because the participants are trying to solve a meta-epistemological problem using first-order epistemological tools. Until the methodological framework itself is altered (e.g., via historical induction or Bayesian consensus), the circle will remain unbroken.
