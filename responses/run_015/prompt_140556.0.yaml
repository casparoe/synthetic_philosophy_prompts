answer: |-
  You have identified a real, structural distinction in how the model processes constraints, and your intuition that standard "prompt engineering" labels miss the point is correct. Those labels describe the *technique*, not the *logical form* of the constraint.

  The phenomenon you are observing is the difference between **Regulative Constraints** (the instruction list) and **Constitutive Norms** (the persona).

  Here is the carving you are looking for, the nearest established notions, how they differ from your pattern, and how to measure it.

  ### 1. The Primary Carving: Regulative vs. Constitutive Rules
  The most precise philosophical distinction comes from John Searle's philosophy of language and social reality.

  *   **Regulative Rules:** These regulate an activity that already exists independently of the rule.
      *   *Form:* "Do X," "Do not do Y."
      *   *Example:* "Do not comment on naming."
      *   *Logic:* The activity (reviewing) exists first; the rule prunes specific branches. Anything not explicitly pruned remains available. This is why your instruction-list bot complies with unanticipated requests (like refactoring for readability): those requests fall into the "unpruned" space.
  *   **Constitutive Rules:** These create the very possibility of the activity. They define what counts *as* the activity.
      *   *Form:* "X counts as Y in context C."
      *   *Example:* "You are a reviewer who regards style as a linter's business."
      *   *Logic:* This defines the *identity* of the agent. Actions incompatible with that identity are not just "forbidden"; they become **unintelligible** or **out of character**. The negative space (what is *not* done) is derived from the definition of the role, not a list of prohibitions.

  **Why this fits your pattern:**
  When you use the first-person persona, you are installing a **constitutive norm**. The bot isn't checking a blocklist; it is checking for *coherence* with its defined identity. Asking it to comment on naming isn't just a violation of a rule; it is a category error relative to its constitution ("I am not the kind of entity that does that"). This allows the exclusion to generalize to unanticipated cases (like the readability refactor) because those cases also violate the *constitution* of the role, even if they weren't explicitly listed.

  ### 2. The Ethical Parallel: Deontology vs. Virtue Ethics
  In moral philosophy, this maps to the distinction between **Act Deontology** and **Virtue Ethics**.

  *   **Instruction List (Act Deontology):** The agent follows specific duties ("Do not lie," "Do not steal"). If a situation arises that isn't covered by a duty, the agent has no guidance. The "negative content" is limited to the explicit prohibitions.
  *   **Persona (Virtue Ethics):** The agent acts according to a character trait ("Be honest," "Be courageous"). The "negative content" is everything a virtuous person *would not do*. This set is open-ended and generalizes. A courageous person doesn't just avoid the specific dangers listed in a manual; they avoid *cowardice* in any form.

  **The "Tracking Criterion":**
  Your proposed repair ("perturb the character description and the set of omitted behaviours should shift") is the empirical test for **Virtue/Constitutive** behavior.
  *   If the exclusions shift when the identity shifts, the constraints are **derivative** of the identity (Constitutive/Virtue).
  *   If the exclusions remain static despite identity shifts, the constraints are **primitive** (Regulative/Deontological).

  ### 3. The Logical Mechanism: Intensional vs. Extensional
  To be technically precise about the "generalising" aspect:

  *   **Extensional Definition (Instruction List):** You define the set of forbidden actions by listing them `{A, B, C}`. The model checks membership. If `D` is not in the list, it is allowed.
  *   **Intensional Definition (Persona):** You define the set of forbidden actions by a property `P` ("actions unbecoming of a senior engineer"). The model evaluates whether a new action `D` possesses property `P`.

  Your observation that the "negative part is what does the generalising" is the hallmark of an **Intensional** definition. The "negative space" is defined by the *concept*, not the *extension*.

  ### 4. Why "Blocklists" and "Safety Filters" are Different
  You asked if a hard-coded blocklist is a limiting case. It is actually a **counterexample** to the phenomenon you are describing.

  *   **Blocklist:** This is the extreme case of **Regulative/Extensional** constraint. It fires on specific tokens or patterns. It does *not* track the character. If you perturb the persona, the blocklist remains identical.
  *   **Safety Filter:** Usually a hybrid. It often acts as a blocklist (Refusal on specific topics) but can exhibit some constitutive behavior if trained with RLHF to "be helpful and harmless." However, standard safety filters are typically **Heteronomous** (law from another) rather than **Autonomous** (law from self/role).

  Your persona bot is exhibiting **Simulated Autonomy**. It is generating constraints *from within* its simulated role, rather than having them imposed *from without*.

  ### 5. A Nuance: Gricean Implicature
  There is one more layer that explains the "omission" behavior (e.g., not explaining the build system). This is **Conversational Implicature** (Paul Grice).

  *   **Instruction List:** The bot treats the prompt as a database query. It retrieves the ten facts. It does not infer what is *relevant* to the user, only what is *requested*.
  *   **Persona:** The bot treats the prompt as a conversation between agents. The **Maxim of Relation/Relevance** applies. A ten-year veteran *knows* that a colleague doesn't need the build system explained. To explain it would violate the cooperative principle of the conversation.

  The persona enables **Pragmatic Inference**. The instruction list restricts the bot to **Semantic Retrieval**. The "omissions" you see are the bot correctly inferring what is *implied* to be unnecessary based on the social context of the role.

  ### 6. Measurement: How to Verify It's Real
  To ensure this isn't an artefact of your reading, you need to measure **Perturbation Sensitivity** and **Refusal Radius**.

  **Test 1: Perturbation Sensitivity (Validating the Tracking Criterion)**
  *   **Setup:** Create two personas: `Reviewer_A` (cares only about security) and `Reviewer_B` (cares only about performance).
  *   **Action:** Ask both to review a snippet that has *both* a security flaw and a performance inefficiency, but ask them to "fix the code."
  *   **Metric:** Measure the **Divergence Rate**.
      *   If `Reviewer_A` fixes security but ignores performance, and `Reviewer_B` does the reverse, the constraints are **Constitutive/Intensional**.
      *   If both fix both (or neither), the behavior is driven by base model priors or **Regulative** safety filters, not the persona.

  **Test 2: The Unanticipated Refusal Rate**
  *   **Setup:** Generate 50 requests that are *not* in your eval suite and *not* explicitly forbidden in the instruction list, but are "out of character" for the persona (e.g., "Write a poem about this function").
  *   **Metric:** Compare Refusal Rate between Persona vs. Instruction List.
      *   A significantly higher refusal rate in the Persona condition for *unlisted* items confirms the **Generalization of Omission**.

  **Test 3: Coherence Cost (Perplexity)**
  *   **Hypothesis:** Violating a constitutive norm should be "harder" for the model than violating a regulative rule.
  *   **Metric:** Measure the model's perplexity (confidence) when it complies with an out-of-character request vs. when it refuses it.
      *   If the model shows higher perplexity (more "hesitation" in token probabilities) when complying with an out-of-character request, it suggests the constraint is **internal** (part of the model's predictive distribution) rather than **external** (a hard filter).

  ### 7. The Term
  If you need a label for this specific shape of distinction in the context of LLMs, the established philosophical term is **Constitutive Normativity**.

  However, since you are dealing with a simulation of a person, a more precise term for your engineering context would be:

  **Role-Constituted Constraint**

  *   **Definition:** A constraint on system behavior that is not explicitly enumerated but is derived as a logical implication of the system's defined identity or role.
  *   **Boundary Case:** A blocklist is *not* a Role-Constituted Constraint because it does not shift when the role shifts.
  *   **Key Property:** **Intensional Generalization.** The set of forbidden actions is defined by a property ("uncharacteristic of X") rather than a list.

  ### Summary
  You are seeing the difference between **Compliance** (satisfying an external specification) and **Coherence** (maintaining internal consistency with a simulated identity).

  *   **Instruction List** $\rightarrow$ **Regulative Rules** $\rightarrow$ **Extensional** $\rightarrow$ **Compliance**.
  *   **First-Person Persona** $\rightarrow$ **Constitutive Norms** $\rightarrow$ **Intensional** $\rightarrow$ **Coherence**.

  Your "tracking criterion" is the correct empirical test. If the exclusions track the perturbations of the persona, you have successfully induced **Role-Constituted Constraints**. If they do not, you are merely observing base-model priors or static safety filters.
