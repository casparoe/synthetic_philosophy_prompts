      *   *Refining the "Flip":* The prompt asks for the case to be *engineered* so that if you flip it, the outcome reverses. I need to make sure the scenario description sets up the structural dependence clearly.
      *   *Refining the "Goldhagen Defender":* Need to be charitable but critical. Goldhagen argues that without the *will*, the structure doesn't matter. So his defender would say the workers *must* have some latent consent to the ideology of the organization.
      *   *Refining "Algorithmic Nudge":* This is the modern equivalent of bureaucratic distancing/ordering. Removing it forces moral agency back onto the individual.

  7.  **Final Review of the Output:**
      *   Does it sound like a philosopher/social psych expert? Yes, use terms like "moral disengagement," "agentic shift," "eliminationist."
