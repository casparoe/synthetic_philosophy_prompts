      *   Action: Systematically denying housing to SRPs.
      *   Mindset: Verifiers feel no hatred, just want to meet quotas/keep jobs.
      *   Flip Condition: If quotas/gamification removed (weak structure), even if Verifiers hated SRPs, they lack the mandate/tools to act systematically.

  5.  **Drafting the Analysis:**
      *   **Browning's Prediction:** Harm occurs. Situational pressures (quotas, peer ranking, bureaucratic language) override personal morality. Ordinary people comply.
      *   **Goldhagen's Prediction:** Harm should be low or inconsistent without ideological commitment. If the workers don't *want* to harm, they won't do it enthusiastically or systematically.
      *   **The Split:** Browning sees the structure as the cause; Goldhagen sees the structure as merely a tool for pre-existing will.
      *   **Structural Feature:** Algorithmic nudging + Role Diffusion. The system makes the harm feel like "processing data" rather than "hurting people."
      *   **Goldhagen Counter-Attack:** He would argue the "ordinary men" are actually complicit in a culture that *does* harbor latent bias, or that the willingness to follow orders *is* a form of ideological submission (obedience as ideology). He might say the "neutral" profile is actually a proxy for hated groups.
      *   **Removing Algorithmic Nudge:** Without the nudge, the Browning effect weakens. Workers have to make active choices. Harm decreases. This supports Browning (situational cues matter) but Goldhagen might say it shows people aren't *willing* without the push.

  6.  **Refining and Polishing (checking constraints):**
      *   *Constraint Check:* Single-paragraph scenario? Yes.
