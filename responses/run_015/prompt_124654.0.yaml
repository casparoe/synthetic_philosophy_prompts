answer: |-
  Consider a distributed workforce of remote contractors employed by a private firm to manage eligibility for emergency housing vouchers, where each worker accesses a gamified dashboard that assigns applicants a "Risk Probability Score" generated by an opaque algorithm rather than human assessment. The workers, who possess no prior animus toward the applicants and never see their faces or ethnic identifiers, are incentivized through real-time peer ranking boards and strict quota metrics to "process" high-risk profiles by flagging them for invasive audits that effectively deny immediate shelter. The interface uses neutral bureaucratic language like "optimizing resource allocation" and "mitigating fraud exposure," while an automated nudge system subtly highlights denial buttons in green and approval buttons in red, creating a frictionless path toward rejection. In this engineered environment, the workers systematically deprive hundreds of vulnerable individuals of housing not out of hatred, but to maintain their performance ratings and avoid algorithmic termination, yet if you were to strip away the quotas, peer rankings, and algorithmic nudges—leaving the workers with full discretion but the same secret, latent eliminationist beliefs toward the "high-risk" category—the systematic harm collapses because individual workers lack the coordinated mechanism and institutional cover to act on those biases at scale.

  From the perspective of the ordinary-men framework, this scenario predicts high compliance with harmful outcomes because the situational architecture—role diffusion, authority of the algorithm, and peer conformity—overrides individual morality, proving that specific ideological commitment is unnecessary for atrocity. Conversely, the willing-executioner framework predicts that without a deep-seated cultural or ideological drive to eliminate the target group, the workers would resist or sabotage the process, arguing that ordinary people retain enough moral agency to refuse harmful orders unless they genuinely want the victim harmed. The split here hinges on the source of motivation: the former locates it in the external structure that reshapes behavior, while the latter locates it in the internal psyche that seeks expression. The structural feature doing the heavy lifting is the algorithmic nudging combined with quantified performance metrics, which transforms a moral decision into a technical task, thereby inducing a state of moral disengagement. A defender of the willing-executioner thesis would attack this case by arguing that the workers' willingness to accept employment in such a system, and their failure to revolt against it, constitutes a tacit ideological consent; they would claim that the "ordinary" behavior is itself evidence of a pervasive cultural permission structure that makes such eliminationist policies acceptable to the average person. Finally, if you strip out the algorithmic-nudge element, the Browning prediction weakens significantly because the frictionless path to harm is removed, forcing workers to actively choose denial over approval; this reintroduces moral friction that situational pressure alone might not overcome, suggesting that while structure is potent, it is not entirely absolute without the subtle cognitive steering that bypasses conscious ethical reflection.
