  I'm a third-year PhD student in philosophy of physics, and I'm preparing a seminar on the foundations of general relativity. I've been stuck on a dispute between two colleagues that I can't quite resolve, and I'd appreciate your help sorting out who's right and why the dispute is even possible in the first place.

  The situation, in brief: my colleague Priya is a stage manager, and she's arguing with a lighting designer, Tom, over two seating charts for a theater. The charts are identical in every respect except that in Tom's version, the seat labels in the middle of the auditorium have been subtly "shuffled" — the labels are moved around in a smooth, continuous way, but at the very edges of the auditorium the two versions agree perfectly. Tom insists that the shuffling means the lights need to be physically moved (because, he says, the seats themselves have "moved" relative to the lights), whereas Priya insists that the shuffling is nothing more than a relabeling of the seats, and that the lights don't need to move at all. I'm inclined to side with Priya — after all, a label is just a label, and relabeling the seats shouldn't change the physical setup. But I can't explain to Priya why Tom's view is even coherent: why would anyone think that a smooth, continuous relabeling of the seats, that vanishes at the boundary, corresponds to a genuine physical change in the world?

