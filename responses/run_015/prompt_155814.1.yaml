answer: |-
  Right, let's unpack this. You and your mate have stumbled onto one of the most persistent critiques in the philosophy of science, so you're not alone in feeling proper stuck. The friction you're experiencing isn't just stubbornness; it's because Lakatos's framework sits uncomfortably between being a rulebook for scientists and a tool for historians.

  Here is the diagnosis of your disagreement, followed by what actual progress on this issue would look like.

  ### The Diagnosis

  Your disagreement is primarily about the **normative versus historical function** of the methodology, but it is compounded by a ambiguity in what counts as **theoretical versus empirical progress**.

  **1. Normative vs. Historical (The "Real-Time" Problem)**
  Your mate is treating the Methodology of Scientific Research Programmes (MSRP) as a **normative decision procedure**. He wants to know: "Can I use this *now* to decide whether to fund string theory or quit?" He is correct that if you treat it this way, it fails. Lakatos himself admitted that distinguishing a progressive from a degenerating programme often requires hindsight. You usually identify a programme as degenerating only when it has been abandoned or superseded. If you call it degenerating too early, you might kill off a theory that just needs a clever adjustment (like Bohr's model before quantum mechanics fully landed).

  You, on the other hand, are defending it as a **rational reconstruction**. You're arguing that it explains *why* scientists were rational to stick with a theory despite anomalies. You are looking at the trajectory and the heuristic power (the "positive heuristic" telling you what to work on next).

  So, half your argument is a category error. He wants a stopwatch; you're holding a map. Lakatos intended MSRP to be normative, but its utility is almost entirely historical.

  **2. Theoretical vs. Empirical Progress (The String Theory Problem)**
  This is where the Quantum Mechanics versus String Theory point gets messy. Lakatos distinguished between **theoretical progress** (predicting novel facts, even if not yet verified) and **empirical progress** (actually verifying some of those facts).

  *   **Quantum Mechanics:** Has achieved both. It predicted novel phenomena (antimatter, entanglement) which were subsequently observed.
  *   **String Theory:** Has massive theoretical progress (mathematical consistency, unifying gravity and quantum mechanics) but lacks empirical progress (no novel predictions verified by experiment yet).

  Your mate says both have "protective belts". He's right. Both use auxiliary hypotheses to shield the core. But Lakatos's criterion for *progress* isn't just having a belt; it's whether that belt is catching new fish or just patching holes. If String Theory is only accommodating known facts (like gravity existing) without predicting new, risky ones that turn out true, Lakatos would classify it as theoretically progressive but empirically degenerating (or stagnant). Your mate is conflating "making predictions" with "having a complex mathematical structure".

  **3. Community vs. Logic**
  There is a secondary tension here about whether a "research programme" is a logical structure or a sociological group. Lakatos focused on the logic (hard core, protective belt), but programmes are carried by communities. Sometimes a programme survives logically degenerating phases because the community is stubborn or lacks alternatives. Your mate is observing the sociological reality (scientists excuse failures); you are defending the logical ideal (heuristic power).

  ### Is there a hidden empirical question?

  No, this isn't really an empirical question about how scientists behave. Scientists behave all sorts of ways; they are human. The question is bedrock intuition about **rationality**.

  The core clash is this: Your mate believes that if a criterion cannot be applied in real-time to stop scientists wasting time, it is useless. You believe that if a criterion explains the rationality of history, it is useful. Neither of you is wrong, but you are demanding different things from the philosophy. The "hindsight bias" charge is valid if you expect MSRP to be a demarcation criterion like Popper's falsificationism. It isn't. It's a framework for understanding scientific change.

  ### What Would Count as Progress?

  Given this diagnosis, you aren't going to resolve this by finding a formal criterion for heuristic power. Lakatos tried to formulate one, and it remains slippery. Here is what actual progress in your argument would look like:

  **1. Abandon the "Real-Time" Expectation**
  You need to concede to your mate that Lakatos does not provide a reliable algorithm for deciding the fate of a theory *in the moment*. If you claim it does, you are overstating the case. However, you can argue that this doesn't make it useless. It shifts the utility from "policy guide" to "historical explanation". Progress here is agreeing that MSRP is better at telling us why Newton was rational to ignore lunar anomalies than telling us whether to invest in supersymmetry today.

  **2. Clarify "Novelty"**
  You need to press your mate on the definition of prediction. It is not enough to say both QM and String Theory make predictions. The distinction lies in **novelty**.
  *   **Accommodation:** Adjusting the belt to fit what we already know.
  *   **Prediction:** The theory tells us something surprising we didn't know, and then we look and see it's true.
  If String Theory continues for another fifty years without a verified novel prediction (something not built into the theory by design), Lakatos would deem it degenerating. If QM had stopped predicting new things and just added epicycles to explain old data, it would have degenerated too. Progress in your debate comes from agreeing that *verified novel facts* are the currency of empirical progress, not just mathematical elegance.

  **3. Accept "Degenerating" isn't "Dead"**
  Your mate thinks "degenerating" means "false" or "finished". It doesn't. A programme can be degenerating yet still be the best show in town (Lakatos used the example of Marxism or perhaps Freudianism, though those are contentious). Scientists might stick with a degenerating programme because the rival is worse. Acknowledging that a programme can be rational to pursue even while degenerating (due to lack of alternatives) might soften his view that the label is just a death certificate.

  ### The Verdict

  You should stop trying to prove that MSRP is a tool for immediate decision-making. It isn't, and Lakatos knew it. Your mate is right that it suffers from hindsight bias if used as a real-time gauge.

  However, you are right that it tells us something useful: it clarifies that science isn't about single experiments killing theories (naive falsificationism), but about competing trajectories of problem-solving.

  **Progress in your argument looks like this:**
  You agree that the distinction is primarily **retrospective**, not prospective. You agree that **empirical novelty** is the key differentiator, not just mathematical complexity. And you agree that a programme can be **logically degenerating** but **sociologically dominant**.

  If you can settle on the idea that Lakatos provides a vocabulary for reconstructing scientific history rather than a stopwatch for current research, you'll find you're actually agreeing with each other, just looking at different ends of the telescope. Don't expect a formal criterion for heuristic power; it doesn't exist. The value is in the nuance it adds to the history, not the rules it gives the practitioner.
