      *   For each: Definition, Platitude/Substantive/False, Behavior/Provenance, Support for Reasoning Claim, Support for Deployment Claim, Confidence.
      *   Synthesize the $M$ vs. $E$ tension.
      *   Identify the "Least Sure" verdict as requested.

