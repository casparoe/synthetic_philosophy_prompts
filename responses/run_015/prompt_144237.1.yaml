      *   *Thesis B (Grounding)* is the strongest for the $M$ vs. $E$ distinction.
      *   *Least Sure:* Probably the link between Grounding and Deployment. Does lack of grounding *necessarily* mean high risk if behavior is aligned? (Confidence ~60-70%). I will flag this.

  8.  **Final Review against Constraints:**
      *   Menu of distinct precise theses? Yes.
