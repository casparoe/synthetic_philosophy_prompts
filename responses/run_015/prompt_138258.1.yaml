answer: |-
  We shall adopt a conclusion-based procedure wherein the final funding decision rests on the majority vote of the panel following deliberation on premise tallies, and on this basis, the current application is rejected.

  This resolution prioritises the collective responsibility of the panel over mechanical aggregation of sub-questions. Our charter mandates that we fund only if three criteria are met, but it does not prescribe how we aggregate individual judgements on those criteria. When premise-based aggregation contradicts the conclusion vote, as it does here, we face a choice between logical consistency on paper and accountability for the outcome. I propose we privilege the latter. The conclusion vote reflects each member's integrated assessment of risk and value, weighing the criteria against one another as the charter intends. To override the majority's overall judgement because they distributed their negative votes across different premises would be to prioritise arithmetic coherence over expert discretion. It would force us to fund a proposal that three members deemed unworthy, simply because their doubts were categorised differently.

  In this specific instance, the premise majorities are epistemically fragile. The majority on scientific rationale includes Chandra, who explicitly disclaimed the expertise to judge the assay validation; her vote was procedural rather than substantive. Consequently, the 3–2 pass on criterion (i) rests on the views of only two subject-matter experts against two dissenters, which is not a robust mandate. Furthermore, Adeyemi's negative votes on recruitment and budget are not independent doubts; she views the budget as unrealistic *because* recruitment will fail. Counting these as two separate failures double-counts a single objection, inflating the apparent weight of dissent on the budget while obscuring the root cause. Given these distortions, the premise tallies offer a misleading picture of the proposal's viability. The conclusion vote, by contrast, captures the holistic concern that the project, taken as a whole, carries too much delivery risk.

  The case for the rejected premise-based procedure is nevertheless substantial and deserves record. Proponents argue that the criteria are contractual conditions established by the trustees to ensure objectivity. If we agree individually that the science is sound, the cohort recruitable, and the budget realistic, then logically the proposal satisfies the charter's requirements. To reject it anyway renders the criteria decorative and introduces unpredictability for applicants, who may reasonably expect that meeting the published hurdles secures funding. This approach also guards against strategic voting, where members might vote against the conclusion for extraneous reasons while acknowledging the technical merits. It prioritises the rule of law within the panel over the discretion of the members, ensuring that decisions are driven by the evidence relative to the criteria rather than the shifting sands of individual holistic judgement.

  However, given the risk of appeal and the need for internal consistency, we must refine our process for the remainder of the year. We will vote on premises initially, but these tallies will be disclosed to the panel before the final conclusion vote. This allows members to see if their collective reasoning aligns with their intended outcome and offers an opportunity to resolve contradictions through deliberation, as Duval suggested. If the premise tallies suggest funding but the conclusion vote suggests rejection, the panel must discuss whether the premise judgements should be revised before the final ballot is cast. Once the final conclusion vote is taken, it is binding.

  Regarding the external communication, the reasons statement must be precise to withstand appeal while reflecting the decision. We cannot state that the criteria were met and then reject the proposal, as this invites legal challenge. Nor can we falsely claim a majority found the criteria unmet. We must frame the decision around the collective assessment of risk. The agreed statement is: "Although some elements of the proposal were viewed favourably, the panel collectively concluded that the recruitment strategy and budgetary assumptions present unacceptable risks to delivery. Consequently, the proposal does not meet the charity's threshold for funding." This acknowledges the split without validating the premise tallies as definitive findings of fact.

  Finally, on transparency, the premise tallies should be disclosed to the trustees but not to the applicant. The trustees require full visibility of panel dynamics to govern effectively and understand where our criteria may be ambiguous. Disclosing them to the applicant, however, would provide grounds for appeal based on the arithmetic inconsistency we are here to resolve. They will receive only the reasons statement. This procedure balances accountability to our governors with clarity towards our applicants, ensuring our decisions are defensible even when the underlying judgements are complex.
