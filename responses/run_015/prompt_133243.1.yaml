answer: |-
  You have identified a distinction that is increasingly significant in contemporary debates on moral responsibility, particularly where metaphysics intersects with political philosophy and the ethics of technology. While there is no single, universally canonical proper noun (like "The Gettier Case") for this specific configuration, it is recognized in the literature under a convergence of terms depending on whether the focus is metaphysical, historical, or structural.

  The most precise metaphysical classification for this arrangement is a **"Blockage Case"** (distinct from a standard "Intervention Case"), often discussed in conjunction with **"History-Sensitive Manipulation Arguments"** or **"Structural Constraint."**

  Here is a detailed breakdown of the terminology, the distinction regarding the Principle of Alternative Possibilities (PAP), and the defining features that warrant treating this as a distinct category.

  ### 1. Established Terminology

  **A. The Metaphysical Label: "Blockage Cases"**
  In the technical literature on free will (specifically following David Hunt 2000 and Carl Ginet 2000), scenarios where alternative possibilities are eliminated *prior* to the moment of choice, without a counterfactual intervener waiting to act, are called **Blockage Cases**.
  *   **Standard Frankfurt Case:** A "guardian" monitors the agent and *would* intervene if the agent showed signs of choosing otherwise. (Counterfactual Intervention).
  *   **Your Scenario:** The alternative paths are causally or physically closed off *before* deliberation begins. The agent cannot choose otherwise not because a device will stop them, but because the option does not exist. (Ex Ante Blockage).

  **B. The Etiological Label: "Structural" or "Environmental Pre-emption"**
  When the blockage arises from cumulative social, institutional, or algorithmic shaping rather than a discrete metaphysical block, philosophers of technology and political philosophers often refer to this as **Structural Constraint** or **Environmental Pre-emption**.
  *   In the context of algorithmic governance, scholars like Karen Yeung or Danaher might describe this as **"Algorithmic Nudging"** taken to its deterministic extreme, or **"Choice Architecture Closure."**
  *   In the context of autonomy, Marina Oshana's theory of **Social Relational Autonomy** addresses this directly: she argues that even if an agent acts on their own desires (satisfying compatibilist conditions), they lack autonomy if their social environment structurally precludes significant alternatives.

  **C. The Historical Label: "History-Sensitive Manipulation"**
  Derk Pereboom's **"Manipulation Argument"** (specifically Cases 2 and 3) explores agents whose psychology is shaped by others to ensure a specific outcome. Your scenario is a macro-sociological variant of this: rather than manipulating the *psychology* directly, the *environment* is manipulated to make the desired choice the only viable one.

  ### 2. Distinction Regarding the Principle of Alternative Possibilities (PAP)

  The distinction between the standard Frankfurt case and your structural configuration is not merely cosmetic; it shifts the burden of the argument against PAP.

  | Feature | Standard Frankfurt Case (Intervention) | Your Scenario (Structural Blockage) |
  | :--- | :--- | :--- |
  | **Status of Alternatives** | Alternatives exist *until* the moment of deviation, at which point they are removed by the intervener. | Alternatives are removed *prior* to the moment of deliberation. |
  | **Mechanism** | **Counterfactual:** "If you were to try X, I would stop you." | **Categorical:** "You cannot try X because the path is absent." |
  | **Actual Sequence** | The actual sequence is uncontaminated by the intervener (they remain idle). | The actual sequence is the *product* of the structural shaping (the environment is active in the causal history). |
  | **PAP Implication** | Argues responsibility exists *despite* the presence of a counterfactual blocker. | Argues responsibility exists *despite* the total absence of alternatives in the actual world. |
  | **Primary Objection** | **"Flicker of Freedom":** The agent could have decided *on their own* vs. *being forced*. | **"Sourcehood":** If the environment dictated the only option, is the *source* of the action truly the agent? |

  **The Crucial Philosophical Shift:**
  Standard Frankfurt cases are designed to show that **Leeway Incompatibilism** (the need for alternative possibilities) is false, pushing us toward **Source Incompatibilism** (the need for the action to originate in the agent).

  However, your structural scenario challenges **Source Incompatibilism** itself. In a standard Frankfurt case, the agent's psychology is usually assumed to be their own; the device is external. In your structural scenario, the agent's deliberation occurs within a "tunnel" constructed by external forces (algorithms, institutions). This raises the **"History Problem"**: If the *menu* of options was engineered by external forces to ensure this specific outcome, does the action truly issue from the agent's "source," even if they deliberated freely within the constraints?

  ### 3. Defining Features and Boundary Cases

  To treat this as a distinct category rather than a peripheral variant, you should delineate it using the following boundary conditions. This helps distinguish it from coercion, nudging, and internal compulsion.

  **Defining Features:**
  1.  **Ex Ante Closure:** The elimination of alternatives occurs *before* the deliberation process begins, not during it.
  2.  **Structural vs. Agential:** The constraint is not imposed by a specific "controller" with intent at the moment of action, but by a system, architecture, or cumulative process.
  3.  **Phenomenological Freedom:** The agent experiences the deliberation as free; they are unaware of the closure (or accept it as background conditions).
  4.  **Counterfactual Robustness:** If the agent *were* to attempt the alternative, they would fail due to structural impossibility, not active interference.

  **Boundary Cases for Differentiation:**

  *   **Vs. Coercion:** In coercion (e.g., "Your money or your life"), the alternative is present but penalized. In your scenario, the alternative is *absent* or *inaccessible*. The agent is not threatened; they are channeled.
  *   **Vs. Nudging:** Nudging (Thaler & Sunstein) alters the *probability* of a choice while leaving all options technically available. Your scenario describes a "hard paternalism" or "structural lock-in" where options are effectively removed (e.g., a digital interface that does not render the "decline" button clickable, or a city design that makes walking impossible).
  *   **Vs. Internal Compulsion:** In addiction or psychosis, the constraint is internal to the agent's psychology. In your scenario, the agent's psychology may be sound, but the *world* does not accommodate the alternative action.
  *   **Vs. Standard Manipulation:** In Pereboom's manipulation cases, the agent's *values* are engineered. In your scenario, the agent's values may be authentic, but the *opportunity structure* is engineered. This is a distinction between **Psychological Determinism** and **Environmental Determinism**.

  ### 4. Recommendation for Terminology

  If you are writing or discussing this formally, I recommend using the compound descriptor:

  > **"A Structural Blockage Case"**

  This signals to metaphysicians that you are discussing a **Blockage** variant (no counterfactual intervener) rather than a standard Frankfurt **Intervention** variant, while signaling to political philosophers/ethicists that the blockage is **Structural** (environmental/institutional) rather than magical or instantaneous.

  Alternatively, if emphasizing the temporal shaping:

  > **"Ex Ante Environmental Pre-emption"**

  ### Summary
  You are correct that this is distinct. The standard Frankfurt case isolates responsibility from *counterfactual* control. Your scenario isolates responsibility from *structural* opportunity. It moves the debate from "Could they have done otherwise?" (PAP) to "Did the action originate in a viable field of agency?" (Sourcehood/Social Autonomy). Treating it as a **"Structural Blockage Case"** allows you to leverage the existing metaphysical literature on blockage while incorporating the critical insights of social philosophy regarding how environments constitute agency.
