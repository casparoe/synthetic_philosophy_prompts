prompt: |-
  So, context: I'm in the fourth year of a PhD on rationality and commitment — broadly, what you should do when doing the best thing requires you not to be the sort of agent who stops to work out what the best thing is — and I'm writing a commentary chapter for a volume of responses to my supervisor's work. He's been sitting on a book manuscript about this for fifteen years and he has an opinion about every case in the neighbourhood of Parfit's hitchhiker (driver takes you to town only if he's confident you'll pay him once you're there; once you're there you have no reason to). I've reconstructed his verdicts from seminars, from the margins of the manuscript he lets me photocopy, and from one extremely long email he sent at 3am. Here they are as best I can put them: standard hitchhiker, nothing forcing you in town, nobody will ever know — rational to pay. Hitchhiker who hands his wallet to a friend before setting out with standing instructions to pay the driver — rational to hand it over, and once in town *not* rational to try to intercept the payment. Hitchhiker in a small town where everyone will hear — rational to pay, though he calls it "the easy case and the least interesting one," because reputation turns it into plain prudence. Hitchhiker who swallows something at the roadside that reliably produces, an hour later, a warm sincere conviction that he owes the driver the money, knowing the capsule is doing the work — rational to swallow it; when I pushed him on whether the conviction itself is then *rational*, he said I was asking the wrong kind of question and that what mattered was that taking it was. Grad student with no capsule and no friend who simply resolves, on no evidence, to believe she'll finish by Christmas, finds she does believe it, and it helps — the resolve is fine, the belief is not rational, and he doesn't see why that should bother her. And the variant where the driver is a terrible judge of character, picks you up by accident, and you'll never cross paths again: he's never given me a straight answer, and the 3am email said something like "if all that's left is that you said you would, I neither know nor care," which I genuinely cannot tell is a dodge or a signal. The problem is that in every case where he *has* ruled, the selection story (payers get rides) and the promise-and-gratitude story (you said you would, and he got you there, and that's a reason) are both in play, so I can't tell which one is doing the work.

  So I built a case to pry them apart and I want your prediction on it. Two hitchhikers, one car, one ride; the ride is worth more than anything else to each of them, and the driver takes the pair only if he predicts that at least one of them will hand over £1000 on arrival — he doesn't care which, he'll refuse a second payment because he isn't greedy, and he reads dispositions rather than promises, so a promise from the pair buys nothing with him (they both make one anyway, because he asks). They're strangers, picked up a mile apart, and the driver makes it a condition of the ride that they never confer about the money: no deals, no coin flip, no "you get this one," and any attempt and he leaves them in the desert. In town, both can pay, neither is observed, and they'll never meet again. Does he say each of them pays? Only one, and if so how does either one work out which? Does it matter that each knows the driver only ever needed a single payment — is "she'll probably pay, so I needn't" available to either of them, and if it is, doesn't it poison both?

  What I actually need, more than a verdict, is this: give me the two or three rules his track record is jointly consistent with, say what each predicts about my two-hitchhiker case, give me your best guess about which one he's really running with the reasons for preferring it, and tell me what further variant would force him off the fence. I have a candidate — the driver announcing on arrival, before either has paid, that he picked them up because he saw that she would pay — but there's probably a cleaner one. Bonus round if you're enjoying yourself: rerun the whole thing with a driver whose scan reads sincere belief rather than predicted payment, i.e. he takes the pair only if he predicts at least one of them will arrive *believing* she owes him the money, and tell me whether his capsule story then makes it rational for both of them to arrive believing a debt that at most one of them has to discharge. Typing this on a bus so forgive the typos, and please don't hand me a reading list — I have one, I just can't tell which item on it he's arguing with.
