answer: |-
  This is a delicious mess, and you are right to identify the confound. Your supervisor's position is a unstable hybrid of **Causal Decision Theory (CDT) regarding dispositions** and **Resolute Choice regarding execution**, with a heavy dose of **Pragmatic Encroachment on Belief**. The tension between the "Standard Hitchhiker" (Pay) and the "Bad Judge" (Don't Care) is the fault line. The former suggests the *prediction* creates the reason; the latter suggests the *causal dependence* creates the reason.

  Here is the reconstruction of his operating system, the prediction for your case, and the variant that will break him.

  ### 1. The Three Reconstructed Rules

  Based on the seminar notes, margin scribbles, and the 3am email, his verdicts are jointly consistent with these three principles:

  **Rule A: The Causal Leverage Constraint.**
  A disposition (or commitment) is rational to cultivate *only if* having that disposition is a cause (or necessary condition) of the benefit received.
  *   *Work:* Explains **Standard Hitchhiker** (My paying disposition causes the ride) vs. **Bad Judge** (My disposition didn't cause the ride; the accident did). In the Bad Judge case, the link is severed, so the normative force dissolves ("I neither know nor care").
  *   *Work:* Explains **Small Town** (Reputation makes it causal/prudential, hence "easy").

  **Rule B: The Policy/State Separation.**
  The rationality of the *strategy* to induce a mental state (resolve, capsule) is distinct from and superior to the rationality of the *state* itself.
  *   *Work:* Explains **Capsule** (Rational to swallow, belief status is "wrong question") and **Grad Student** (Resolve fine, belief irrational, "why bother her?"). He is a consequentialist about *acquisition*, not necessarily about *content*.

  **Rule C: The Execution Lock-In.**
  Once a rational disposition is cultivated and the benefit secured, the agent is not rational to deviate from the disposition's output, even if local reasons suggest otherwise.
  *   *Work:* Explains **Wallet Case** (Rational to hand over wallet; *not* rational to intercept). Once the binding mechanism is in place, the local calculation is bypassed. You don't get to recalculate in town.

  ### 2. Prediction: The Two-Hitchhiker Case

  **Verdict:** He will say **neither is rationally required to pay**, and likely that the situation is **rationally unstable for the driver to have initiated.**

  **Reasoning:**
  This turns on **Rule A (Causal Leverage)**. In the Standard Hitchhiker, *my* disposition is necessary for *my* ride. In the Two-Hitchhiker case, *my* disposition is not necessary for *my* ride; the *pair's* joint disposition is.
  Because the driver's condition is disjunctive (A pays OR B pays), my individual disposition lacks the specific causal leverage it had in the Standard case. I can get the ride *without* being a payer, provided the other is.
  Since the causal link between *my* paying-disposition and *my* benefit is broken (or at least diluted to probability), Rule A says the disposition isn't rationally mandated. If the disposition isn't mandated, Rule C (Lock-In) doesn't trigger.
  He will likely argue that since neither can know if they are the "necessary" one, and communication is banned, they revert to the "Bad Judge" intuition: "If all that's left is that you said you would, I neither know nor care." The selection pressure was on the *group*, so the normative pressure dissolves for the *individual*.

  **The "Poison":**
  You asked if "she'll probably pay, so I needn't" poisons both. He will say **yes**. That reasoning is the sound of Rule A detecting the lack of causal leverage. If both reason that way, neither pays, which means the Driver (who reads dispositions) made an error in picking them up. Your supervisor will likely blame the Driver's prediction, not the Hitchhikers' rationality.

  ### 3. The Decisive Variant

  Your candidate (Driver announces "I picked her") is good, but it introduces new information that might trigger Rule C (Lock-In) via shame or reputation. To force him off the fence on Rule A vs. Rule C, you need to isolate **Necessity**.

  **The Variant:** **The "Spare Tyre" Hitchhiker.**
  The Driver picks up two hitchhikers. He tells them *at the start*: "I need £1000 to get to town. I can see that **only one of you** is disposed to pay. I don't know which, and I won't know until we arrive. I need at least one of you in the car to feel safe, so I'm taking both. But I only need one payment."
  *   *Crucial Detail:* They are told *ex post* (in town) who the Driver saw as the payer.
  *   *The Test:* Ask him about the **Non-Payer Designate**.
      *   The Driver saw Agent A as the Payer, Agent B as the Non-Payer.
      *   They arrive. Agent A pays.
      *   **Question:** Was it rational for Agent B (who knew or later learns they were seen as a Non-Payer) to *attempt* to pay? Or was it rational for them to free-ride?
      *   *Why this breaks him:* If he says B should pay, he abandons Rule A (Causal Leverage), because B's payment was causally redundant. If he says B should not pay, he admits that "being the sort of person who pays" is not the source of the norm, but rather "being the person whose payment was needed." This forces him to admit that rationality is partly externalist (dependent on the Driver's prediction) rather than internalist (dependent on my disposition).

  ### 4. Bonus Round: The Belief Scan

  **Setup:** Driver scans for *sincere belief* in debt. Needs one believer. Two hitchhikers. Capsules available (produce sincere belief in debt).
  **Question:** Is it rational for *both* to take the capsule and arrive believing they owe money, when at most one needs to pay?

  **Prediction:** He will say **Yes, it is rational for both to take the capsule and hold the belief.**

  **Reasoning:**
  This leans hard on **Rule B (Policy/State Separation)**.
  1.  **Policy:** For each hitchhiker, the policy "Take capsule to get ride" is instrumentally rational. The ride is worth more than £1000. The capsule cost is negligible.
  2.  **State:** You noted he thinks the epistemic rationality of the resulting belief is the "wrong question." In the Grad Student case, he said the belief isn't rational but "doesn't see why that should bother her."
  3.  **Application:** In this Two-Hitchhiker Belief Case, the *function* of the belief is to secure the ride, not to guide the payment accurately. Once the ride is secured, the belief has done its job.
  4.  **Payment:** If both believe they owe, both might try to pay. The Driver refuses the second.
  5.  **His Verdict:** He will likely say the **payment mismatch is irrelevant to the rationality of the belief.** Both were rational to acquire the belief (it got them the ride). Whether the belief turns out to be "true" (i.e., whether they actually owed the money given the other's payment) is secondary. He treats the belief as a *ticket*, not a *map*.
      *   *Quote reconstruction:* "They bought a ticket with their conviction. Whether the turnstile only needed one ticket doesn't make the second ticket irrational to buy, if buying it was the only way to get in."

  ### Summary for your Chapter

  Your supervisor is arguing for a **Causal-Dispositional Externalism**.
  *   **Internalism:** "I should pay because I resolved to." (He rejects this in the Bad Judge case).
  *   **Externalism:** "I should pay because my disposition caused the benefit." (He accepts this in Standard Hitchhiker).
  *   **The Two-Hitchhiker Case** breaks the causal chain for the individual.
  *   **The Belief Case** shows he prioritizes the *instrumental success of the acquisition* over the *accuracy of the state*.

  **The Cleanest Variant to Force His Hand:**
  Go with the **"Spare Tyre"** variant above. Specifically, ask him: *"If I know for a fact that the Driver would have picked me up even if I were disposed not to pay (because my companion was a payer), do I still have a reason to pay?"*
  *   If he says **Yes**: He is a Resolute Choicer (Commitment creates reason). He must abandon the "Bad Judge" intuition.
  *   If he says **No**: He is a Causal Decision Theorist (Cause creates reason). He must admit that in the Two-Hitchhiker case, rationality dissolves into free-riding.

  Given the 3am email ("I neither know nor care"), my money is on **No**. He will let the norm dissolve. Good luck with the chapter; this is the sort of philosophy that actually moves the needle.
