answer: |-
  You are right to be dissatisfied with "role-content decoupling." That phrase suggests two things that *could* be coupled but happen not to be, like a steering wheel disconnected from the wheels. What you are describing is more structural: it is a **Supervenience Base Mismatch**. The semantic properties of the colony do not supervene on the intrinsic intentional properties of the constituent ants, nor even on their extrinsic relations to the environment in the standard externalist sense. They supervene on the *statistical configuration of the population itself*.

  There is no single canonical term for this exact carving in the literature, though it sits at the intersection of distributed cognition, philosophy of biology, and non-reductive physicalism. However, based on the specifics you provided—particularly the "Flip" case—I propose we call this **Statistical Intentionality**.

  Here is the carving you are looking for, the nearest concepts, and why they fail to capture the full phenomenon.

  ### 1. The Carving: Statistical Intentionality

  **Definition:** A system exhibits Statistical Intentionality when its representational content (truth conditions) supervenes on the *aggregate statistical properties* of a population of agents, rather than on the intrinsic intentional states of those agents or their direct causal relations to the distal environment.

  **The Mismatch:**
  *   **Standard Mind:** Content supervenes on brain states (vehicles), which supervene on neural firing. The vehicle and the content are roughly co-located in the organism.
  *   **Standard Externalism:** Content supervenes on brain states + environment. The vehicle is internal; the truth-maker is external.
  *   **Your Case (Statistical Intentionality):** Content supervenes on *population statistics*. The vehicle is the *distribution* of ants. The truth-maker is the *colony's relation to the world* (or itself).

  The "mismatch" you feel is that the **Truth-Bearer** (the colony state) is a statistical abstractum, while the **Causal-Base** (the ants) are concrete particulars. You cannot find the content in the ants because the content *is* the statistical pattern, not the tokens that make it up.

  ### 2. Nearest Concepts and Why They Miss

  **A. Distributed Representation (Connectionism)**
  *   *The Fit:* Content is carried by a pattern of activation across many nodes, not a single node.
  *   *The Miss:* In standard connectionism, the weights are fixed or slow-changing, and the activation pattern is the *current* state. In your ant case, the "nodes" (ants) are themselves agents with their own (albeit simple) agendas. More importantly, in connectionism, if you freeze the activation pattern, you freeze the content. In your "Flip" case, you freeze the *individual states* (dispositions/info), but the *content flips* because the population composition changed. Distributed representation usually assumes the vehicle is the *pattern of states*; you are describing a vehicle that is the *pattern of existence*.

  **B. Collective Intentionality (Searle, Tuomela, Gilbert)**
  *   *The Fit:* Attributes mental states to a group ("We believe X").
  *   *The Miss:* Most accounts of collective intentionality require some form of individual participation or mutual awareness (a "we-intention"). Your ants have no idea they are part of a "we." The intentionality is *ownerless* at the individual level. It is collective without being *joint* in the phenomenological sense.

  **C. Content Externalism (Putnam, Burge)**
  *   *The Fit:* Content depends on factors outside the individual's head.
  *   *The Miss:* As you noted, standard externalism makes content wide by reaching *out* to the environment (water vs. twater). Your case makes content wide by reaching *across* the constituents. The "environment" that fixes the content isn't just the world outside the nest; it's the *other ants* inside the nest. An ant's contribution to the colony's belief is determined by its relation to the *colony aggregate*, not just its relation to the food source. This is **Internal Relationalism**.

  ### 3. Are the "Self-Directed" and "Flip" Cases the Same?

  **Yes.** They are two sides of the same coin: **Aggregate Supervenience.**

  *   **The Self-Directed Case:** The colony represents "We are short on foragers." This is a fact about the *ratio* of ant types. No single ant holds the ratio. The content is a statistical property of the population.
  *   **The Flip Case:** The colony verdict flips (North vs. South) while individual dispositions stay fixed. This happens because the *sample size* or *composition* of the population shifted the statistical threshold.

  In both cases, the **unit of representation is the distribution, not the distributed.** The content is a property of the *histogram*, not the *bins*. If you change which ants are alive (the Flip), you change the histogram even if the bins (individual dispositions) look the same locally. If you represent the colony's workforce (Self-Directed), you are representing the histogram itself.

  The phenomenon is unified because in both instances, **the semantic value is sensitive to population statistics in a way that is insensitive to individual intrinsic states.**

  ### 4. Generalizability: Brains and Institutions

  This is not unique to ant colonies. It shows up wherever **Population Coding** is the mechanism of representation.

  *   **Brains:** Consider a neural ensemble coding for direction of motion. A single neuron's firing rate is noisy and ambiguous. The *content* ("motion to the left") exists only in the *vector average* of the population. If you swap out half the neurons for others with similar tuning curves (the "Flip"), the perceived motion stays the same. If you change the *correlation structure* without changing mean firing rates, the content might change. The brain exhibits Statistical Intentionality at the level of neural populations. The "self-directed" version is **Proprioception**: the brain represents the body's state (a global fact) using distributed sensory signals, none of which encode "the body" locally.
  *   **Institutions:** A corporation "decides" to enter a new market. No single employee may hold this belief (sales thinks it's a product issue, HR thinks it's a hiring issue). The "decision" emerges from the workflow statistics. If you replace the middle management layer with different people who have the *same local dispositions* but different network positions, the corporate decision might flip. The corporation has Statistical Intentionality.

  ### 5. Borderline Cases and Definition Refinement

  To make **Statistical Intentionality** a robust tool for your dissertation, you need to know where it stops.

  **Borderline Case 1: The Tightly Coupled Swarm.**
  If the ants are connected by pheromones so rapidly that they act as a single fluid (like a slime mold syncytium), does this collapse back into ordinary representation?
  *   *Verdict:* Yes. When the coupling speed approaches the speed of signal propagation within a single neuron, the distinction between "population statistic" and "single vehicle" blurs. Statistical Intentionality requires a **latency gap** between the individual update rate and the collective decision rate.

  **Borderline Case 2: The Representative Agent.**
  If the colony appoints a "queen" or a "scout" who literally holds the representation and orders the rest, does Statistical Intentionality vanish?
  *   *Verdict:* Yes. This reverts to **Centralized Intentionality**. The mismatch disappears because the content is now localized in the scout. Your phenomenon *requires* that no local locus carries the content.

  **Refined Definition for Defense:**
  > **Statistical Intentionality** occurs when a system $S$ bears a representational relation to a proposition $P$ if and only if:
  > 1.  $S$ is composed of a population of agents $A_1...A_n$.
  > 2.  No subset of $A$ represents $P$.
  > 3.  The truth value of $P$ determines the causal trajectory of $S$ via the *statistical distribution* of states across $A$.
  > 4.  Changes to the *composition* of $A$ can alter $S$'s representation of $P$ without altering the intrinsic intentional states of any surviving $A_i$.

  ### 6. Why Your Supervisor's "Decoupling" is Too Tidy

  "Decoupling" implies the role and content *should* line up but don't. Your analysis shows they *cannot* line up at the individual level. The content is **Macro-Intrinsic** (it belongs to the colony essentially) while the vehicle is **Micro-Extrinsic** (it belongs to the ants relationally).

  The term you want to challenge is **Supervenience**. You are arguing for **Macro-Semantic Autonomy**. The colony's beliefs are autonomous from the ants' beliefs not because they are separate substances, but because they operate on different **ontological granularities**. The colony believes in *resources*; the ant responds to *gradients*. The mapping between "resource" and "gradient" is not a translation; it is a **statistical emergence**.

  If you defend this as **Statistical Intentionality**, grounded in **Aggregate Supervenience**, you move the debate from "Is the colony *really* thinking?" (which invites skepticism) to "What are the *conditions* under which statistical aggregates bear content?" (which invites metaphysics). That is a defensible PhD contribution.
