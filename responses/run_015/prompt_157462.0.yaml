      *   This is about adverse selection. If a cause is neglected, maybe it's because it's a black hole (low T).
      *   In the formula $S = I \times T \times N$, if $N$ is high because $T$ is actually low (but hidden), then $S$ overestimates value.
      *   This doesn't invalidate the *logic* of ITN, but it warns against using $N$ as a *proxy* for $T$ without due diligence. It suggests $N$ should not be a multiplier if it's correlated with low $T$.
      *   Actually, standard EA theory treats $N$ as a proxy for *diminishing returns*. If others haven't funded it, the first dollars are cheap. The "sidewalk money" argument says: "Others haven't funded it because the dollars aren't effective."
      *   Resolution: This is a risk management issue, not a structural flaw in ITN. It argues for better estimation of $T$, not dropping $N$.

