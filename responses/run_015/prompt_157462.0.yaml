      *Actually, in a market, if everyone plays "buy low sell high", the opportunity disappears. That doesn't make the rule inadmissible. It makes the *opportunity* temporary.*
      *So the error is definitely in (3). The principle demands equilibrium stability from a tool designed for disequilibrium arbitrage.*

