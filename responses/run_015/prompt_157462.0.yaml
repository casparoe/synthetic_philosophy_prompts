          *   *Rejecting (3) (The Principle):* You accept dynamic instability. You must commit to *process* (re-evaluation) rather than *outcome* (static ranking).
          *   *Rejecting (4) (The Mechanism):* Hard to do, because it's mathematically true that funding reduces neglectedness. You'd have to deny the math.
      *   **Addressing the Constraints (3-year vs 30-year):** The instability is real. How to manage?
