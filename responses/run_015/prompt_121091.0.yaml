          *   *Severity:* None.

      *   **Tension D: The Location of Badness (2, 3, 4, 7)**
          *   (2) Pain is bad in virtue of being painful.
          *   (3) Affect is essential to badness, not pain.
          *   (4) Sensory pain without affect is not bad.
          *   (7) Affect without sensory is bad.
