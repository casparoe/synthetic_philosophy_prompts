      *   *To fix (5 vs 2):* Strengthen (5) to explicitly reject naturalistic reduction of value. Cost: Committing to non-naturalist realism or robust response-dependence.
      *   *To fix (7 vs 1):* No fix needed.

  7.  **Addressing Specific Prompts:**
      *   *(2) and (4) compatible given (3)?* Only if "pain" in (2) means "affective pain" and "pain" in (4) means "sensory pain." This is an equivocation.
      *   *(5) undermine (2)?* Only if one accepts evolutionary debunking. The user rejects this in (5). But the *tension* is that a full evolutionary explanation often crowds out intrinsic normativity.
