      *   Least Sure Point: The meta-ethical compatibility of (5) and (2). (How much confidence do I have that evolutionary explanations *can* fully account for the mechanism without undermining the normativity? This is a deep meta-ethical swamp).

  9.  **Drafting the Response:**
