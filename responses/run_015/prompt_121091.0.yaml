      *   *Resolution:* (3) clarifies the definition of "pain." It distinguishes "sensory pain" from "pain's badness." So (2) likely refers to "affective pain" or "suffering," while (4) refers to "sensory pain." This needs careful scrutiny.
      *   (1) vs (7): (1) says components are dissociable. (7) posits a hypothetical dissociation (reverse asymbolia). These seem consistent, actually supportive.
