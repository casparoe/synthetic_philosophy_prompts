          *   *Severity:* High. (2) is too broad given (3) and (4).

  5.  **Ranking the Tensions:**
      1.  **Definition of Pain vs. Badness (2 vs 3/4):** This is the most severe. (2) asserts a universal link between pain and badness. (3) and (4) assert a break in that link.
      2.  **Evolutionary Naturalism vs. Normativity (5 vs 2):** Medium severity. It relies on external philosophical debates, but internally it requires a robust meta-ethical stance to hold (2) and (5) together without slipping into error theory.
      3.  **Phenomenal Concepts vs. Intrinsic Badness (6 vs 2):** Low severity. (6) is a standard defense of (2).
      4.  **Reverse Asymbolia (7 vs 1):** No tension.

  6.  **Developing Revision Costs:**
