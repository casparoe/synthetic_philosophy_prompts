      *   Path 2: Reject (1) - The "Complicity/Contribution" Defense (Kutz).
      *   Path 3: Reject (5) - The "Corporate Agent" Defense (French/Pettit).
      *   Addressing the "Line" worry (Membership vs. Participation).
