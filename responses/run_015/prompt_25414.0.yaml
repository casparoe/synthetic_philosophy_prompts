answer: |-
  This is one of the sharpest tensions in contemporary legal philosophy, and you have put your finger on exactly why space law is currently in a state of "constructive ambiguity." You are right to feel that something is being glossed over. The legal distinction between "owning the land" and "owning the dirt" is juridically functional, but philosophically, it rests on a specific, contested theory of justice that many argue betrays the spirit of 1967.

  Here is a reconstruction of the implicit theories at play, an assessment of their coherence, and a look at what a serious "Common Heritage" regime would actually require.

  ### 1. The Implicit Theory: *Res Communis* + Lockean Appropriation
  The current regime (OST + U.S. Act + Artemis Accords) does not actually presuppose the "Common Heritage of Mankind" (CHM) principle, despite using similar language. Instead, it presupposes a hybrid of **_Res Communis_** and **Lockean Labor Theory**, underpinned by a **Libertarian/Utilitarian** view of justice.

  *   **_Res Communis_ (Common Thing):** The OST treats space like the High Seas. It is open to use by all states, but no state can claim sovereignty. Crucially, under the U.S. interpretation, *Res Communis* allows for the appropriation of *resources* even if it forbids the appropriation of *territory*. This is the fishing analogy you noted: You don't own the ocean, but you own the fish you catch.
  *   **Lockean Labor Theory:** The justification for keeping the platinum is Lockean: by mixing your labor (and capital/technology) with the unowned resource, you generate a property right in the extraction. The 2015 Act explicitly frames this as a right to "possess, own, transport, use, and sell" asteroid resources.
  *   **The Theory of Justice:** The implicit justice claim here is **not distributive** (everyone gets a share); it is **procedural and utilitarian**. The argument is that "the province of all mankind" is best served by maximizing access and innovation. If we restrict mining to ensure equality, no one will mine, technology won't advance, and *no one* benefits. Therefore, the "common good" is achieved through the trickle-down of spacefaring capability, not direct redistribution of wealth.

  ### 2. Is It Coherent or a Fudge?
  Philosophically, it is a **fudge**, though legally it is a functional compromise.

  **The Incoherence:**
  The tension lies in the definition of "appropriation." The OST bans "national appropriation." The U.S. argues that private property rights are not *national* sovereignty. But this ignores the reality of state power. A U.S. company mining an asteroid relies on U.S. law for enforcement, U.S. defense for protection, and U.S. infrastructure for support. To grant a U.S. corporation exclusive rights to a resource is, in effect, to extend U.S. economic sovereignty over that resource, even if you don't plant a flag on the rock.

  Furthermore, the "High Seas" analogy breaks down under philosophical scrutiny. Fish are renewable; asteroid platinum is not. Lagrange points (orbital slots) are finite. If the first actor takes all the water ice at the lunar south pole, they haven't just caught a fish; they have effectively excluded all of "mankind" from that region forever. This violates the "province of all mankind" clause if interpreted as a guarantee of *equal opportunity*, rather than just *equal freedom to try*.

  **The "Fudge" Charge:**
  You are correct that this is high-minded language covering a resource grab. The drafters of the OST in 1967 likely intended some form of benefit-sharing (hence the "mankind" language). However, when the **Moon Agreement (1979)** tried to make this explicit by establishing an "international regime" to manage resources and share benefits (true CHM), the major spacefaring nations (U.S., Russia, China) refused to sign it.
  The 2015 Act and Artemis Accords are essentially a diplomatic way of saying, "We are going to implement the Moon Agreement's economic goals without the Moon Agreement's distributive obligations."

  ### 3. Taking "Common Heritage" Seriously
  If you actually took the "Common Heritage of Mankind" principle seriously (as the Moon Agreement attempted), you would have to shift from a **Libertarian** framework to a **Cosmopolitan Distributive Justice** framework (think Rawls applied globally).

  To replace the implicit Lockean theory with an egalitarian one, you would need:

  1.  **A Licensing/Leasing Regime:** Companies could not simply claim resources by arrival. They would need a license from an international body (like the International Seabed Authority for the ocean floor).
  2.  **Royalty/Taxation Mechanism:** Extraction would incur a fee. This revenue would not go to the company's home state, but into a **Global Space Fund**.
  3.  **Redistributive Justice:** That fund would be distributed to non-spacefaring nations, specifically for development, technology transfer, or direct dividends. This acknowledges that the resource belonged to everyone *before* the labor was mixed.
  4.  **Quotas and Conservation:** To prevent the "first-comer" problem, there would be limits on how much of a finite resource (like lunar water ice) one entity could control, ensuring future generations and other nations have access.

  **The Philosophical Shift:**
  This shifts the burden of proof. Currently, the burden is on regulators to prove why a company *shouldn't* keep its profits. Under true CHM, the burden is on the company to prove why its extraction benefits the common heritage enough to justify private retention of the bulk of the value.

  ### 4. Can the Two Views Hang Together?
  Is there a reconciliation between Lockean extraction and Common Heritage? Yes, but it requires modifying the Lockean view to be **conditional**.

  **The "Conditional Property" Synthesis:**
  You can maintain the incentive structure of private property (Locke) while satisfying the "province of all mankind" (CHM) if you treat property rights in space as **stewardship** rather than absolute dominion.

  *   **The Argument:** Private companies are the most efficient agents to extract value. Denying them property rights kills the goose that lays the golden egg. *However*, because the underlying asset belongs to mankind, the property right is contingent on a "rent" paid to the collective.
  *   **The Mechanism:** A "Space Tax." Companies keep the profit from their labor and risk, but pay a percentage of the *resource value* (the unimproved value of the asteroid) into the global fund.
  *   **Why this works philosophically:** It acknowledges the Lockean right to the *value added by labor* while acknowledging the CHM right to the *value of the natural resource itself*.

  **Why this hasn't happened:**
  It requires a level of international trust and enforcement capability that does not currently exist. Who collects the tax? Who audits SpaceX? If the U.S. says "We collect it," we are back to national appropriation. If the UN collects it, the U.S. views it as a sovereignty violation.

  ### Summary for your Seminar
  The current regime presupposes a **Libertarian-Utilitarian** theory: Justice is maximizing total capability through private incentive, assuming benefits will diffuse naturally. It treats "province of all mankind" as a **negative right** (no one can stop you from going) rather than a **positive right** (everyone must share in the gain).

  It is a **fudge** in the sense that it uses the moral capital of the OST ("Peace," "Mankind") to legitimize a system that structurally favors incumbent powers.

  To make it coherent with the "Common Heritage" language, you would need to move from a **Freedom of Access** model to a **Benefit Sharing** model. This doesn't necessarily mean banning private mining, but it does mean treating space resources more like a public trust leased to private actors, rather than a wild west open to homesteading. The philosophical cost of the current system is that it accepts **inequality of outcome** as the price of **equality of opportunity**, whereas the CHM principle argues that without equality of outcome, the opportunity was never truly equal to begin with.
