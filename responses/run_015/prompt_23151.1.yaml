answer: |-
  This is a classic debate in the philosophy of social science and game theory. It touches on the difference between **conceptual analysis** (what is the definition of a thing?) and **generative explanation** (how does the thing come to exist?).

  Here is a breakdown of who is right on which specific point, followed by what both of them are overlooking.

  ### 1. The "Static vs. Dynamic" Objection
  **Mara's Claim:** Lewis's account is static; it describes an equilibrium state but cannot explain the *path* to that equilibrium (evolution/learning). The "prior expectation" condition presupposes the convention already exists.
  **Devin's Claim:** Lewis + Schelling (focal points) explains selection. "Evolution" is just reinforcement, which Lewis covers. Calling it static is a category error.

  *   **Who is right:** **Mara is right on the mechanics; Devin is right on the logic.**
  *   **The Analysis:**
      *   **Mara:** She is correct that Lewis lacks a formal *dynamic model*. Lewis defines a convention as a state of affairs (an equilibrium with common knowledge). While he discusses "precedent" (past success creates future expectation), he does not provide a mathematical or mechanistic account of how a population moves from disorder to order (e.g., replicator dynamics, stochastic learning, or basin of attraction sizes). If you want to know *how* a convention displaces a rival convention, Lewis's definitions don't give you the tools; evolutionary game theory (which Mara represents) does.
      *   **Devin:** He is correct that Lewis isn't *trying* to write a dynamic model. Lewis is doing conceptual analysis: "What conditions must hold for us to say a convention exists?" From a philosophical standpoint, explaining the *conditions of existence* is distinct from explaining the *causal history*. However, Devin is wrong to dismiss the dynamic critique as a "category error." If a theory of social norms cannot explain how norms emerge or change, its explanatory power is severely limited, regardless of its conceptual neatness.

  ### 2. The Role of Focal Points (Salience)
  **Mara's Claim:** Focal points pick the equilibrium, but they don't explain population convergence or competition between conventions.
  **Devin's Claim:** Salience is common knowledge; it allows agents to lock onto an equilibrium without shared history.

  *   **Who is right:** **Devin is right on selection; Mara is right on convergence.**
  *   **The Analysis:**
      *   **Devin:** Schelling's focal points (salience) do solve the *equilibrium selection problem* in a one-shot or initial interaction. If there is a unique, salient solution (e.g., "meet at Grand Central Station"), rational agents can coordinate without prior communication. Lewis incorporates this to explain the *first* instance of coordination.
      *   **Mara:** She is right that salience does not guarantee *population-level convergence*. Just because an equilibrium is salient doesn't mean a whole population will successfully coordinate on it, especially if there is noise, miscommunication, or sub-groups with different cultural salience. Furthermore, focal points don't explain *tipping points*—why a convention persists even after it stops being the most salient option (path dependence). Mara is correct that you need a learning model to explain how salience translates into stable, population-wide regularity.

  ### 3. The Scope: Pure Coordination vs. Conflict of Interest
  **Mara's Claim:** Real norms (fairness, reciprocity) involve conflict of interest. Lewis's framework only handles pure coordination, so it doesn't apply to most social norms.
  **Devin's Claim:** Conflict-of-interest cases are a different phenomenon. Lewis only claimed to cover pure coordination. Within that domain, his account is complete.

  *   **Who is right:** **Devin is right exegetically; Mara is right sociologically.**
  *   **The Analysis:**
      *   **Devin:** He is technically correct about Lewis's text. In *Convention* (1969), Lewis explicitly restricts his definition to coordination problems (where interests align). He acknowledges that moral norms or norms involving conflict (like queuing or honesty, where I might benefit by cheating) are different. Devin is defending the internal consistency of Lewis's theory.
      *   **Mara:** She is correct that this restriction makes Lewis's theory inadequate for a general theory of *social norms*. Most interesting social norms (e.g., "don't cut in line," "tip your waiter") are **mixed-motive games** (Prisoner's Dilemmas or Assurance Games), not pure coordination games. In these cases, people conform not just because they expect others to, but because they feel *obligated* to, or fear sanction. By restricting the definition to pure coordination, Lewis excludes the most socially significant norms. Mara is right that if you want to explain "norms" as sociologists use the term, Lewis is too narrow.

  ### 4. What Both of Them Are Missing

  While they debated the mechanics of Lewis's theory, both speakers missed three crucial dimensions that modern social ontology has identified:

  **A. Normative Expectations vs. Empirical Expectations**
  Both Mara and Devin treat expectations as purely empirical (i.e., "I expect you to do X because I think you will"). They miss the distinction made by philosophers like **Cristina Bicchieri**.
  *   **Empirical Expectation:** I think you *will* do X.
  *   **Normative Expectation:** I think you *believe I ought* to do X, and you might sanction me if I don't.
  Lewis's account relies almost entirely on empirical expectations (coordination). But many norms persist even when empirical expectations fail (e.g., people keep promises even when they think others won't). Neither speaker addressed the *normative force* ("oughtness") that distinguishes a norm from a mere habit.

  **B. Power and Inequality**
  Lewis's model assumes symmetric agents with symmetric interests (pure coordination). Both Mara and Devin ignored that conventions often encode **power dynamics**.
  *   Example: Gendered norms or class-based etiquette. These look like conventions (arbitrary regularities), but they are not selected via neutral focal points; they are often imposed or sustained because they benefit a dominant subgroup. A "convention" that systematically disadvantages one group cannot be fully explained by Lewisian coordination or standard replicator dynamics without adding a layer of power analysis.

  **C. Bounded Rationality and Common Knowledge**
  Both speakers talk about "common knowledge" as if it is a achievable state.
  *   **The Miss:** In reality, common knowledge is an infinite regress (I know that you know that I know...). Real humans operate with **bounded rationality** and approximate common knowledge.
  *   **H. Peyton Young** (an evolutionary game theorist) has shown that conventions can emerge *without* common knowledge or high-level rationality, simply through trial-and-error learning. Mara asks for dynamics, but she implies rational learning. She misses that *non-rational* evolutionary dynamics can solve the problem Lewis set for himself, rendering the "prior expectation" requirement unnecessary.

  ### Summary Verdict

  *   **On Dynamics:** **Mara wins.** Lewis provides a definition, not a mechanism. You need evolutionary/learning models to explain emergence and change.
  *   **On Selection:** **Devin wins.** Focal points/Salience are the best explanation for initial coordination in the absence of precedent.
  *   **On Scope:** **Mara wins on applicability; Devin wins on textual accuracy.** Lewis's theory is internally consistent but too narrow to explain most real-world social norms.
  *   **On What Matters:** Both miss that **normativity** (the feeling of obligation) and **power** are essential to understanding why norms stick, beyond just coordination equilibria.

  If you had to bet on whose research program is more fruitful for understanding actual human society: **Mara's.** The field has largely moved toward the evolutionary/dynamic account she is advocating (e.g., the work of Young, Skyrms, and Bicchieri), treating Lewis's account as a foundational but incomplete starting point. Devin is defending a classic text; Mara is describing the current state of the science.
