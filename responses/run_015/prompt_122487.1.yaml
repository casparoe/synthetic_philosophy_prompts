answer: |-
  1. The doctrine primarily reflects an actual-sequence view of responsibility, since it holds agents accountable for dispositions they could not change provided they cognitively appreciated the wrongfulness of their acts.
  2. The principle of alternative possibilities is not strictly presupposed by the mental-disorder defence, though it sits well with automatism and explains why some judges find the monitor defence exculpatory.
  3. Duress excuses not because agency is absent, but because the law concedes that reasonable firmness has limits against imminent external threats, unlike internal dispositions which are treated as constitutive of the agent.
  4. The split over the monitor defence demonstrates that the doctrine is caught between rival theories, with the insanity rule endorsing actual-sequence views while the duress rule implicitly relies on the principle of alternative possibilities.
  5. Consequently, no single theory can coherently explain the entire pattern, as the law inconsistently treats the inability to refrain from action as exculpatory when caused externally but irrelevant when caused internally.
