answer: |-
  ### Preliminary Conceptual Mapping: Nearby Phenomena

  Before isolating the specific configuration you describe, it is useful to distinguish it from three adjacent failure modes in analogical reasoning. These phenomena often co-occur with your pattern but differ in their structural locus.

  1.  **Structural Overextension (Relational Mismatch)**
      *   *Description:* This occurs when a specific relation mapped from source to target does not actually hold in the target (e.g., assuming electrons "orbit" a nucleus in a literal planetary path because of the solar system analogy).
      *   *Difference:* Overextension concerns the *truth value* of the mapped relation itself. Your phenomenon concerns the *modal status* of the relation. The relation might hold (tenure exists in universities), but its *resistance to alteration* is the illicit import.

  2.  **Source Domain Dominance (in Conceptual Blending)**
      *   *Description:* In blending theory, this happens when the source frame overwhelms the target, dictating the logic of the blended space (e.g., treating a debate purely as war, where "losing" an argument implies destruction).
      *   *Difference:* Dominance typically creates a *third space* (the blend) with emergent structure. Your phenomenon does not necessarily create a blend; it modifies the reasoner's understanding of the *target domain itself*, attributing intrinsic constraints to the target that belong to the source.

  3.  **Ontological Reification**
      *   *Description:* Treating an abstract model or metaphor as a concrete physical reality (e.g., treating "the market" as a singular agent with intentions).
      *   *Difference:* Reification is about *existence* and *agency*. Your phenomenon is about *counterfactual stability*. One can acknowledge a university is not literally a corporation (avoiding reification) yet still assume its structures are equally hard to dismantle (committing your error).

  ***

  ### Analysis of the Phenomenon

  You have identified a subtle but pervasive vector of analogical error. To answer your first question: **No, there is no single established term in the canonical literature (Gentner, Holyoak, Fauconnier, or Hofstadter) that isolates this specific transfer of modal robustness.**

  The literature extensively covers *structural alignment* (mapping relations) and *pragmatic mapping* (mapping goals), but it largely treats the "weight" or "stickiness" of those relations as a secondary feature of systematicity. In Structure-Mapping Theory, highly connected structures are preferred for mapping (the systematicity principle), but the theory does not explicitly name the error where the *connectivity itself* (the resistance to decoupling) is projected onto a domain where those connections are loose or contingent.

  This distinguishes your observation from **frame blending** and **source-domain leakage** in the following ways:

  *   **Vs. Frame Blending:** Blending is often creative and generative; it builds a new scenario to reason *within*. Your phenomenon is restrictive. It does not generate new possibilities; it closes off possibilities in the target domain by importing the source's constraints. It functions as a brake on imagination rather than an engine for it.
  *   **Vs. Source-Domain Leakage:** Leakage usually refers to surface features or specific slot-fillers bleeding across (e.g., assuming a legal "case" must involve a physical document because file folders are involved in the source). Your phenomenon is deeper; it is not about surface attributes but about the *topology of change*. It is the leakage of the *cost function* associated with altering the structure.
  *   **Vs. Ordinary Overextension:** As noted, overextension claims "A relates to B" in the target when it does not. Your phenomenon claims "A relates to B *rigidly* in the target" because it does so in the source. It is a second-order error about the flexibility of the first-order relations.

  ***

  ### Proposed Terminology and Boundaries

  Since no established term precisely captures this importation of resilience profiles, I propose we coin the term **"Modal Inertia Projection."**

  **Definition:**
  *Modal Inertia Projection* is the cognitive error wherein a reasoner, having aligned the relational structure of a source and target domain, illicitly projects the source domain's counterfactual stability conditions onto the target. Specifically, it involves treating contingent or flexible features of the target as "load-bearing" or "protected" solely because their structural counterparts in the source domain possess high resistance to change (high inertia).

  This term captures the "drag" you noticed (Inertia) and the specific nature of the property being moved (Modal status of necessity/immutability).

  **Boundary Cases:**
  To ensure this concept is carved precisely, we must distinguish it from two situations that resemble Modal Inertia Projection but fall outside its definition.

  1.  **Valid Isomorphic Robustness**
      *   *Scenario:* An engineer analogizes a new bridge design to a well-understood existing structure. They assume that certain load-bearing cables cannot be removed without collapse, because in the source structure, removing them causes collapse.
      *   *Why it is outside:* Here, the robustness is *physically grounded* in both domains. The modal status is not imported illicitly; it is derived from shared physical laws. Modal Inertia Projection only occurs when the robustness in the target is *unsupported* by independent mechanisms (e.g., institutional rules vs. physical laws) and relies solely on the analogy for its justification.

  2.  **Provisional Idealization (Heuristic Freezing)**
      *   *Scenario:* A economist models a market as a closed system to calculate equilibrium, treating certain variables as fixed "for the sake of argument," while acknowledging they are variable in reality.
      *   *Why it is outside:* This is a conscious methodological constraint, not a cognitive error regarding the target's ontology. In Modal Inertia Projection, the reasoner typically loses sight of the contingency; they begin to *believe* the target is rigid. If the reasoner maintains the "as-if" stance without ontological commitment, it is a tool, not a projection of inertia.

  **Summary:**
  You have isolated a specific failure mode where the *physics of the model* (its resistance to change) is mistaken for the *physics of the territory*. By labeling this **Modal Inertia Projection**, we can distinguish it from simple mapping errors and focus on how analogies don't just tell us what *is*, but implicitly prescribe what *must be*.
