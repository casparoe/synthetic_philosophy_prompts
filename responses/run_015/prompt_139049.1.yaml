      *   What would change my mind? If someone demonstrated a case where a simpler theory was consistently false compared to a complex one in a fundamental physics context (though usually, the complex one turns out to be the new 'simple' one).

  7.  **British English Check:**
      *   "Modelling" (double L).
      *   "Programme" (if used).
      *   "Prioritise" (s vs z - Oxford spelling usually prefers s, but z is acceptable. I'll stick to standard UK conventions).
      *   "Centre", "favour", "behaviour".
