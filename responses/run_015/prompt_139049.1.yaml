      *   Connect it back to infectious disease modelling (mechanism vs. curve fitting).

      *(Self-Correction during drafting)*: Wait, if I reject (2), I have to defend simplicity. If I reject the move (1)->(3), I have to defend that "Grue" theories aren't genuine rivals. Actually, the most standard scientific realist response is to reject the *interpretation* of (1). The constructed $T^*$ are not *theories* in the relevant sense; they are logical constructs. But the prompt asks me to reject a *step*. Step (2) is the epistemic claim. Step (3) is the inductive claim.
      Let's go with rejecting **Step (2)**. It's the most actionable for a scientist. Step (3) is technically true for *some* sceptical hypotheses (5 mins ago), but false for the specific Grue examples given (they diverge in the future). So (3) is actually factually incorrect regarding the examples in (1).
      *Wait, re-reading (3):* "For any body of evidence whatever... the same manoeuvre can be run again." This implies that for any *new* evidence, we can construct a *new* rival. This is true. But it doesn't mean the *old* rival survives.
