answer: |-
  This is a classic formulation of the underdetermination of theory by evidence, a problem that has troubled philosophers since Hume and was sharpened by Quine and Goodman. Your flatmate has presented a clean, logical case for radical scepticism. It is designed to be watertight within its own definitions, but those definitions are where the trouble lies for a practising scientist.

  You asked me to identify which step to reject. I reject **Step (2)**.

  Here is the diagnosis, the pricing of the alternatives, and the confidence calibration you requested.

  ### Why Step (2) is the Weak Link

  Step (2) claims that if two theories fit the evidence equally well, they are epistemically symmetric, and any preference for one over the other is merely pragmatic (aesthetics, career incentives) rather than truth-conducive. This step looks fine because it adheres to a strict empiricist principle: *only* the data counts as evidence. If the data cannot distinguish between $T$ and $T^*$, then nothing can.

  However, this step smuggles in a hidden assumption: that "fitting the data" is the *only* criterion for theory assessment. It ignores **background knowledge** and **prior probability**.

  In your field, you do not treat all curves that fit the surveillance data as equal. You prefer an SIR (Susceptible-Infected-Recovered) structure over a high-degree polynomial fit, even if the polynomial has a slightly better $R^2$ on the training data. Why? Because the SIR model is consistent with biological mechanisms (transmission requires contact, recovery confers immunity) that are supported by a vast web of *other* evidence (immunology, virology, contact tracing). The polynomial fit is *ad hoc*.

  Step (2) fails because it treats theories as isolated islands connected only to the data $E$. In reality, theories are embedded in a network of background knowledge $K$. When you evaluate $T$, you are evaluating $P(T | E, K)$. The "Grue" style rivals ($T^*$) typically have vanishingly small prior probabilities given $K$. They posit arbitrary discontinuities or occult properties that contradict established laws without reason. Therefore, $E$ *does* give you a reason to prefer $T$: it is the conjunction of $E$ fitting well *and* $T$ having a reasonable prior given $K$.

  ### The Cost of Rejecting Step (2)

  You asked me to price this honestly. If I reject (2), I am claiming that theoretical virtues like simplicity, mechanistic coherence, and unification are guides to truth, not just psychological conveniences.

  **The Bill:**
  To maintain this, I must rely on **Bayesianism** or **Inference to the Best Explanation (IBE)**. I must argue that simpler theories are *more likely to be true* a priori.
  *   **The Problem:** How do I know the universe is simple? If I argue "because simple theories have worked in the past," I am using induction to justify the principle that makes induction possible. This is circular.
  *   **The Concession:** I cannot prove to your flatmate, using logic alone, that simplicity tracks truth. It is a metaphysical bet. We assume the world is intelligible and law-governed. If the universe were fundamentally capricious (e.g., gravity really did switch to repulsion on a random date), our methods would fail. But since we need to act, we bet on regularity.
  *   **The Payoff:** This bet is not "aesthetics." It is a heuristic that has historically minimised predictive error. In policy terms, a model that assumes biological continuity is safer than one that assumes arbitrary shifts, because the cost of being wrong about the arbitrary shift is catastrophic.

  ### On the Move from (1) to (3)

  Your intuition that something is smuggled between (1) and (3) is correct, and it is worth addressing even though I have targeted (2).

  Step (1) constructs **locally** empirically equivalent theories (they fit *current* data $E$).
  Step (3) claims there are **globally** empirically equivalent theories (they fit *all possible* data).

  The examples in (1) (gravity reversing in 2100) are *not* globally equivalent. They make different predictions about the future. They can be distinguished by waiting until 2100. Thus, they do not support the strong conclusion in (4) that *no* claim about the unobserved is justified. They only show that current data doesn't fix *future* data—which we already knew (that is just the Problem of Induction).

  The only theories that are *globally* empirically equivalent are the sceptical hypotheses your flatmate mentions (the world began five minutes ago; we are brains in vats). These are immune to evidence by definition. But they are also explanatorily vacuous. They do not help you model transmission rates. To treat them as serious rivals in a policy context is to misunderstand the purpose of modelling, which is not merely to save the phenomena, but to intervene in the causal structure.

  ### Confidence and Calibration

  **Confidence in Diagnosis:**
  I am **85% confident** that rejecting Step (2) is the correct move for a working scientist. This aligns with the dominant view in contemporary philosophy of science (scientific realism, Bayesian confirmation theory). The idea that theoretical virtues are merely pragmatic is a minority view, mostly held by instrumentalists or radical constructivists.

  **Where My Account is Most Likely Wrong:**
  My weakest point is the justification for **prior probabilities**. I assert that a biologically plausible model has a higher prior than a "Grue" model. But I cannot demonstrate this without assuming the uniformity of nature.
  *   **What would change my mind:** If you could show me a domain of fundamental physics where the "ugly," complex, *ad hoc* theory consistently outperformed the "simple," unified theory over the long term, without the complex theory eventually being subsumed by a new, simpler framework. If nature turned out to be fundamentally gerrymandered at the base level, my defence of Step (2)'s rejection would collapse.

  **What Would Change My Mind on Step (3):**
  If your flatmate could produce a rival model for your infectious disease work that was *globally* empirically equivalent (predicts every future case count exactly the same) but posited a different mechanism (e.g., magic vs. viruses), and yet was equally useful for policy intervention. If such a rival existed and was indistinguishable in practice, then the distinction between truth and empirical adequacy would indeed vanish. But in epidemiology, mechanism matters for intervention (lockdowns work on viruses, not on magical curses), so the rivals are not equivalent in the ways that count.

  ### Summary for Your Defence

  When you stand before the policy-makers, you are not claiming your model is the *only logically possible* explanation. You are claiming it is the **best supported** given the total body of knowledge (data + mechanism).

  1.  **Reject the symmetry:** Your model and the "Grue" rival do not fit the evidence equally well once you include *background knowledge* (biology, physics) as part of the evidence.
  2.  **Reject the scepticism:** The "Grue" rivals are not serious scientific theories; they are logical tricks that fail to support intervention.
  3.  **Accept the bet:** You are betting on the uniformity of nature. It is a necessary bet for action.

  Your flatmate is playing a logical game; you are playing a game of survival and public health. In your game, Step (2) is false because consequences matter, and consequences depend on causal mechanisms, not just curve fitting.

  **Confidence Level:** High (85%).
  **Primary Vulnerability:** The non-circular justification of Occam's Razor.
  **Recommended Stance:** Pragmatic Realism. Act as if the model is true because it is the only way to successfully intervene, and successful intervention is the best proxy for truth we have.
