  5.  **The "Dreaded Question":**
      *   What is the fatal flaw? Probably the link between * Ethics* (individual salvation/reason) and *TP* (political stability). If the state modulates affects to keep power, does it prevent individuals from achieving true freedom (blessedness)? This is the "Tension between Freedom and Stability" question. Or, more specifically: "Is this just authoritarian engineering?"
