          5.  (Historian) "Passive Multitudo vs. Active Citizenship"
          6.  (Historian/Normative) "Reason's Subordination"
          7.  (Normative) "Institutional Black Box"
          8.  (Normative) "Boundary Problem/Exclusion"

      *   *Ordering by Damage:*
          1.  Normative Deficit (Kills legitimacy claim).
          2.  Anachronism (Kills the framework).
          3.  Republican Redundancy (Kills novelty).
          4.  Reason's Subordination (Kills link to *Ethics*).
          5.  Institutional Black Box (Makes it impractical).
          6.  Stability (Makes it unstable).
          7.  Passive Multitudo (Textual contradiction).
          8.  Exclusion (Secondary normative issue).

      *   *Wait, let's re-evaluate damage.* The thesis is about *legitimacy*. If the normative basis is just "power/affect," Rawlsians will say it's might-makes-right. That's #1. If Historians say "Spinoza never said that," the textual basis crumbles. That's #2. If the Republican says "Pettit already covers this," the contribution is nil. That's #3.
      *   *Let's finalize the order:*
          1.  Normative: The "Manipulation vs. Justification" objection.
          2.  Historical: The "Anachronistic Constitutionalism" objection.
          3.  Republican: The "Non-Domination is Sufficient" objection.
          4.  Historical/Normative: The "Reason vs. Passion" objection (Ethics conflict).
          5.  Normative: The "Institutional Mechanism" objection.
