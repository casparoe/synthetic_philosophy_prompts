      *   *Historians of Early Modern:* They value textual fidelity, context, and avoiding presentism. They will attack the term "affective constitutionalism" as anachronistic. They will ask about specific Latin terms (*multitudo*, *imperium*, *affectus*). They might argue Spinoza *is* more contractual or sovereign-focused than admitted.
      *   *Republican Scholar:* They value non-domination (*non-dominium*). They will argue Spinoza *is* a republican (Skinner's view). They will ask how "affective modulation" differs from mere socialization into domination. Is freedom really just power (*potentia*)?

  3.  **Drafting the Objections (Iterative Process):**
      *   *Goal:* 8 objections, ordered by damage.
