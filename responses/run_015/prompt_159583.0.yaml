answer: |-
  **Scenario**
  A clonal colony of *E. coli* faces bacteriophage attack. Individual bacteria possess a toxin-antitoxin system; upon infection, the antitoxin degrades, releasing a toxin that lyses the cell. This suicide prevents phage replication, protecting genetically identical neighbors. The system is currently maintained by selection: colonies lacking it are wiped out by phages, while those with it persist. A field microbiologist examining an infected cell triggering lysis describes the mechanism as "functioning normally" to defend the colony. The cell dies without reproducing.

  **Analysis**
  *   **Trait:** Abortive infection mechanism (toxin activation).
  *   **Bearer:** The infected bacterium.
  *   **System:** The individual bacterium (physiological integrity).
  *   **Effect:** Cell lysis (death) and phage containment.
  *   **Etiological Verdict:** **Function.** The effect (protecting kin) explains the trait's presence via kin selection. Modern SE accounts (e.g., Neander) accept inclusive fitness effects as grounding function in the individual bearer.
  *   **Causal-Role Verdict:** **No Function.** I use **Boorse's Biostatistical Theory (BST)**, a goal-contribution CR account. Functions must contribute to the bearer's survival or reproduction. Here, the trait causes death and prevents reproduction. It contributes negatively to the individual's biological goals.
  *   **Feature Doing the Work:** **Altruistic Suicide.** The trait is selected *because* it sacrifices the bearer.
  *   **Remove Feature:** If the trait helped the individual survive (no suicide), both accounts ascribe function (collapsing into agreement).

  **Objections & Literature**
  *   **(a) Redescribe System:** The CR defender claims the system is the *colony*, not the cell. **Rebuttal:** This violates your "same bearer" constraint. It is precisely the gerrymandering your thesis targets: CR only saves the function by shifting the ontological unit to match the selection unit, whereas SE accommodates it within the individual.
  *   **(b) Analysis-Relativity:** A Cummins-style defender says, "Choose an analysis where 'colony defense' is the capacity." **Rebuttal:** BST fixes goals as survival/reproduction. Allowing arbitrary capacities renders function ascriptions trivial (any effect is a function relative to *some* capacity), undermining CR's explanatory power.
  *   **Literature Check:** Sterile workers (ants/bees) are the canonical altruism case. Bacterial abortive infection is biologically isomorphic but philosophically underutilized, avoiding the "used a hundred times" fatigue while preserving the logical structure.
