answer: |-
  Here are 7 questions with follow-ups designed to pin down the technical and philosophical vulnerabilities in her argument. They are ordered to build pressure from the mathematical formalism toward the moral implications.

  **1. The Indeterminacy of Weights**
  "You argue that once we grant Pareto and expected-utility rationality, the weighted-sum form falls out for free. But vNM utility functions are only unique up to positive affine transformation. If I rescale person A's utility function, I effectively change their weight in the social sum without changing their preferences. So, is the claim that 'weights are equal' actually a constraint at all, or is it just a label we paste on after arbitrarily fixing the scales?"

  *   **Likely Answer:** She will likely say that to make sense of aggregation, we must assume *cardinal unit comparability*, or that we fix the scales using a specific procedure (like the veil of ignorance) to make the weights meaningful.
  *   **Follow-up:** "But if you need the veil of ignorance or a specific moral premise to fix the scales, then the math isn't doing the vindicating—the moral premise is. Doesn't this admit that the theorem alone is silent on egalitarianism, and that you're smuggling the moral conclusion in via the scaling assumption?"

  **2. Normalization and Utility Ranges**
  "A common fix for that scaling problem is to normalize everyone's function so their worst-to-best span runs from 0 to 1 before adding them up. But doesn't that quietly build in the claim that everyone's 'span' is the same size? If a saint and a sadist both get normalized to a 0–1 range, aren't you asserting their capacity for suffering is morally equivalent by fiat?"

  *   **Likely Answer:** She'll likely argue that normalization is the only way to make interpersonal comparisons tractable and that we should treat individuals as equals regarding their *potential* satisfaction.
  *   **Follow-up:** "But that's a substantive egalitarian claim about psychological capacities, not a result of the aggregation theorem. If the theorem requires us to *assume* equal ranges to get utilitarianism, haven't you just pushed the justificatory burden back one step without solving it?"

  **3. Ex Ante vs. Ex Post Pareto**
  "Your argument relies on the *ex ante* version of Pareto—if everyone prefers lottery L to M based on expectations, society must too. But many critics argue only *ex post* Pareto is uncontroversial. Why should social rationality be bound by individual risk-attitudes when the actual outcomes might create severe inequalities?"

  *   **Likely Answer:** She will likely defend *ex ante* Pareto as respecting individual sovereignty and rationality; if everyone agrees to the gamble, overriding them is paternalistic.
  *   **Follow-up:** "But if two people agree to a gamble where one wins big and one starves, *ex ante* Pareto approves it. By insisting on this axiom, aren't you prioritizing the *procedure* of rational choice over the *distribution* of welfare? That looks less like a derivation of utilitarianism and more like a stipulation that risk-trumping outcomes is irrelevant."

  **4. Variable Populations**
  "Harsanyi's theorem assumes a fixed set of people. But real policy lotteries change who exists. If the set of individuals $N$ isn't fixed, the weights $w_i$ can't be stable. How does your vindication handle cases where the lottery determines whether a person exists at all?"

  *   **Likely Answer:** She may suggest we treat non-existence as a utility level of zero, or apply the theorem to 'possible people' to maintain the fixed-N structure.
  *   **Follow-up:** "If you treat non-existence as zero utility, you invite the Repugnant Conclusion. If you don't, the aggregation breaks because the weights vanish or appear. Does this mean your 'free' derivation of utilitarianism actually collapses once we leave the fixed-population toy model?"

  **5. Utilitarianism vs. Prioritarianism (The Neutrality Claim)**
  "I've often heard the weighted-sum form described as neutral between utilitarianism and prioritarianism, since weights are arbitrary. But prioritarianism gives extra weight to benefits *because* someone is worse off, not just because they are a person. Can your theorem actually accommodate that distinction, or does it force us into a flat sum?"

  *   **Likely Answer:** She'll likely say prioritarianism can be represented in the model by applying a concave transformation to the utility functions before summing them.
  *   **Follow-up:** "But if you transform the utility function to get priority, does the resulting function still satisfy the vNM axioms required for the theorem to hold? Or are you changing the input so much that the theorem no longer applies?"

  **6. Utilitarianism vs. Prioritarianism (The Pareto Violation)**
  "Following up on that: if we squash the utility function to give priority to the worse off, we might change the ranking of lotteries. If the social ranking diverges from the individual vNM rankings to achieve that priority, doesn't that violate the Pareto condition itself? So isn't it more accurate to say the theorem *excludes* prioritarianism rather than being neutral between them?"

  *   **Likely Answer:** She might argue that Pareto applies to the *transformed* utilities, not the raw ones, or that prioritarianism is a different informational base entirely.
  *   **Follow-up:** "But if Pareto only applies to transformed utilities, then the theorem isn't vindicating utilitarianism from *individual preferences*; it's vindicating it from *transformed* preferences. Doesn't that admit that the move from 'rational individual' to 'utilitarian society' requires a moral transformation that the math doesn't justify?"

  **7. The Normative Force of the Axioms**
  "Finally, the theorem is conditional: *If* you accept these axioms, *then* you get utilitarianism. But a deontologist can reject Expected Utility in moral contexts (e.g., rights as constraints) without being irrational. What do you say to someone who accepts vNM rationality for themselves but rejects it as a constraint on *social* choice?"

  *   **Likely Answer:** She will likely argue that social choice *must* respect individual rationality to be legitimate, otherwise it's arbitrary.
  *   **Follow-up:** "But if 'respecting rationality' just means 'aggregating vNM functions,' you're defining legitimacy in a way that begs the question against the deontologist. If the axioms themselves encode the trade-offs utilitarians want, hasn't the theorem just formalized your premises rather than vindicating your conclusion?"
