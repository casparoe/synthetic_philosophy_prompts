          *   *Follow-up:* But if someone has adaptive preferences (e.g., oppressed people content with little), their vNM utility might be low-range. Does your view force us to say their welfare is objectively lower, or does it ignore the moral relevance of *what* they prefer?

      *   **Topic (g): The "Uniqueness" Claim.**
          *   *Core Issue:* She claims the theorem *vindicates* utilitarianism. But the theorem is a representation theorem. It says *if* you satisfy axioms, *then* you look like utilitarianism. It doesn't prove you *must* satisfy axioms.
          *   *Draft Q:* You say the theorem vindicates utilitarianism. But it's a conditional: IF Pareto + vNM, THEN Utilitarianism.
