prompt: |-
  I spent about thirty-five years as an atmospheric chemist — a lot of it messing about with error propagation, instrument drift, and the question of when to stop believing your own numbers — and since retiring I've been sitting in on a philosophy reading group at the local university. We've been going through consequentialism recently, and I keep coming back to something from my own world that I think is a real, existing practice with an implicit theory buried inside it. I'd like help digging the theory out.

  The practice is the randomised controlled trial, as actually run. Four features of it:

  - You are only supposed to enrol patients when the expert community is genuinely uncertain which arm is better. If people already knew, running the trial wouldn't just be pointless, it would be unethical.
  - Given that uncertainty, you don't give people the arm with the best point estimate. You randomise.
  - The protocol pre-registers its primary endpoints at a fixed horizon — 90-day mortality, say — and the downstream stuff nobody can track (effects on the patients' families and careers, twenty-year health effects, the way the published result shifts prescribing habits for a decade) simply isn't counted. It's off the protocol, so it's off the books.
  - And the trial doesn't run to its planned end if a data monitoring committee sees one arm pulling clearly ahead. At some point uncertainty stops being decision-relevant and you stop flipping coins.

  So uncertainty is a precondition of the practice being permissible at all; under uncertainty the practice deliberately refuses to maximise; it has a threshold past which uncertainty stops mattering; and it cuts the causal chain off at the protocol horizon.

  That strikes me as interesting because everything else I've seen in the policy and charity world does the opposite: rank the options by best estimate, hand the money to whatever came out top, and treat anyone who suggested tossing a coin as having abandoned the job. Medicine tosses coins with people's actual treatment; a government or a foundation wouldn't dream of it.

  So here's what I want. Reconstruct the implicit theory of rational choice under uncertainty that this practice only makes sense under. In particular: does it presuppose that cluelessness about downstream effects is a reason to stop trying to maximise and hand the decision to a procedure instead? Does the early-stopping rule presuppose that there is a sharp point at which ignorance becomes decision-irrelevant — and if so, is that compatible with the standard worry that our long-run effects are not just unknown but in some sense unmanageable, with error bars that don't shrink? And what about the truncation: is the practice presupposing that untracked effects are genuinely worth zero, or just that they're unusable, and is there a difference that matters?

  Some things I'd specifically like you to deal with. First, my reading group's obvious objection: randomisation in trials is justified by the knowledge the trial produces, by the expected benefit to future patients, not by any view about what ignorance does to choice. If that's right the practice may presuppose much less than I think, and I'd like you to say how much less. Second, distinguish what the practice strictly presupposes from what it merely fits nicely with — I suspect several quite different theories would license it, and I want to know where it's genuinely underdetermined. Third, take the thing I've started calling the equipoise rule — when the spread of your outcome estimates across the live options is smaller than your uncertainty about the estimates themselves, don't maximise, defer to a chance procedure — and tell me what a consequentialist would actually have to change in day-to-day decision making if they adopted it for, say, long-termist or high-uncertainty giving. Would it collapse into maximising under some descriptions? Would it end up licensing things no one would accept?

  Please don't give me a reading list or point me at papers — I can't get at half of them and I'd rather you just reasoned it out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Retired atmospheric chemist (35 years), experienced with error propagation, instrument drift, data validity. Currently attending a philosophy reading group (consequentialism focus).
      *   **Task:** Reconstruct the *implicit theory of rational choice under uncertainty* buried in the actual practice of Randomised Controlled Trials (RCTs) in medicine.
      *   **Key Features of RCTs identified by User:**
          1.  *Equipoise:* Uncertainty is a precondition for ethical permission.
          2.  *Randomisation:* Under uncertainty, don't pick the best point estimate; flip a coin.
          3.  *Truncation:* Pre-registered endpoints only; downstream/long-term effects ignored.
          4.  *Early Stopping:* Stop when uncertainty resolves (one arm pulls ahead).
      *   **Contrast:** Policy/Charity world maximizes based on best estimates; Medicine randomizes under uncertainty.
      *   **Specific Questions to Address:**
          1.  Does it presuppose cluelessness about downstream effects justifies stopping maximization?
          2.  Does early stopping presuppose a sharp point where ignorance becomes irrelevant (compatible with unmanageable long-run error bars)?
          3.  Does truncation assume untracked effects are zero or just unusable?
          4.  *Objection:* Is it just about future knowledge (epistemic value) rather than a theory of choice under ignorance?
          5.  *Distinction:* What does the practice *strictly presuppose* vs. what merely *fits nicely*? (Underdetermination).
          6.  *Application:* If a consequentialist adopted the "equipoise rule" for long-termist/high-uncertainty giving, what would change? Would it collapse or license unacceptable things?
      *   **Constraint:** No reading lists or paper citations. Reason it out.

  2.  **Deconstruct the Implicit Theory:**
      *   The user is spotting a tension between *act consequentialism* (maximize expected utility based on current best estimates) and *procedural rationality* (follow a rule when estimates are unreliable).
      *   The RCT practice treats *uncertainty* not just as a parameter in a calculation (variance), but as a *switch* that changes the decision rule from "Maximize" to "Randomize."
      *   *Truncation:* This looks like a recognition of "cluelessness" (Greco, Beckstead). If error bars explode over time, the expected value calculation becomes noise-dominated. Truncation is a heuristic to avoid "Pascal's Mugging" type scenarios or simply noise-driven decisions.
      *   *Early Stopping:* This implies uncertainty is dynamic. It's not just "I don't know," it's "I don't know *yet*, but I will soon." It treats the decision horizon as flexible based on signal-to-noise ratio.

  3.  **Address the Specific Objection (Epistemic Value):**
      *   *Objection:* RCTs are for *learning*, not just treating. The randomization is to generate public goods (knowledge), not to optimize individual treatment.
      *   *Counter/Refinement:* True, but *Clinical Equipoise* is the ethical gatekeeper. You can't sacrifice a patient for knowledge unless you are genuinely unsure which treatment is better for *them*. So the individual decision rule *must* be neutral under uncertainty. The theory isn't just "maximize total knowledge," it's "maximize knowledge *subject to* individual indifference." This implies a constraint on aggregation: you can't sacrifice the present individual for the future collective unless the present individual isn't losing out (by definition of uncertainty).
      *   *Implication:* This supports the user's hunch. It's not *just* epistemic value. It's a specific handling of the *current* decision under uncertainty.

  4.  **Strict Presupposition vs. Good Fit (Underdetermination):**
      *   *Strict Presupposition:*
          *   Uncertainty creates a region of *indifference* (not just risk).
          *   Information gathering (the trial) has higher value than immediate optimization *only if* the immediate optimization is impossible due to indifference.
          *   Causal chains must be bounded to be actionable (truncation).
      *   *Good Fit (but not required):*
          *   Utilitarianism fits, but so does Contractualism (no one is knowingly treated worse).
          *   Bayesianism fits, but so does Frequentist error-statistics (which the user knows well).
          *   The specific 90-day horizon isn't theoretical; it's pragmatic.
      *   *Key Insight:* The practice presupposes that *actionability* requires boundedness. Unbounded consequentialism is paralyzing or dangerous in high-uncertainty contexts.

  5.  **The "Equipoise Rule" Applied to Charity/Long-termism:**
      *   *Current Charity Model:* Estimate EV, pick highest. (Maxipok/Maximize Expected Value).
      *   *Equipoise Model:* If uncertainty > difference in estimates, randomize (or split funding).
      *   *Consequences:*
          *   *Diversification:* Instead of "cause prioritization" picking one winner, you fund a portfolio when distinctions are within the noise floor.
          *   *Humility:* Acknowledges that point estimates in long-termism are often fiction (error propagation over centuries).
          *   *Collapse?* It might collapse into maximization if one option is *clearly* better (outside the noise). But in long-termism, almost everything is inside the noise. So it would look like broad diversification.
          *   *Unacceptable Licensing?* It might license funding "weird" stuff just because we are uncertain. But the counter is that we are *also* uncertain the "sensible" stuff works.
          *   *Stopping Rule:* Stop funding a cause when evidence converges (either it works or it doesn't). Long-termism rarely has stopping rules.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Respectful, peer-to-peer (scientist to philosopher-ish), rigorous but accessible. Acknowledge the user's expertise in error analysis.
      *   *Structure:*
          1.  Validate the insight (The "Chemist's Eye").
          2.  Address the "Epistemic Value" objection first (clears the deck).
          3.  Reconstruct the Implicit Theory (The "Theory of Bounded Actionability").
          4.  Strict Presupposition vs. Good Fit.
          5.  Applying the Equipoise Rule to Charity/Long-termism.
          6.  Conclusion.

      *   *Refining the "Theory":* Call it "Procedural Rationality under Radical Uncertainty." It treats uncertainty not as variance to be integrated, but as a state where the *gradient* of utility is too flat relative to the *noise* of measurement. When Signal/Noise < 1, optimization is mathematically indistinguishable from noise. Therefore, randomization is the only non-arbitrary choice.
      *   *Refining Truncation:* It's not that downstream effects are zero. It's that their variance is infinite/unbounded. Including them makes the integral diverge. Truncation is a regularization technique.
      *   *Refining Early Stopping:* This is sequential analysis. It acknowledges that uncertainty is a resource you consume. When it's consumed, the rule switches back to maximization.

      *   *Addressing the Charity Application:*
          *   If adopted: Less "Cause Prioritization," more "Cause Diversification."
          *   Collapse: Only if one option is overwhelmingly superior (rare in long-termism).
          *   Risk: Might fund low-upside things just because they are uncertain. Mitigation: Floor constraints (do no harm).

  7.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I cite papers? No.
      *   *Check:* Did I address the "future knowledge" objection? Yes, need to emphasize *Clinical Equipoise* specifically.
      *   *Check:* Did I distinguish strict presupposition vs. fit? Yes, need to be clear about what is *necessary* for the practice to make sense vs. what is compatible.
      *   *Check:* Is the tone right? Avoid being too academic. Use the user's language (error propagation, drift).

  8.  **Final Polish:** Ensure the distinction between *risk* (known probabilities) and *uncertainty/ignorance* (unknown probabilities/error bars) is clear, as the user's background suggests they understand measurement error well. The RCT practice treats deep uncertainty as a qualitative shift, not just a quantitative one.

      *(Self-Correction on the "Epistemic Objection"):* I need to be careful. The user asks if the practice presupposes *less* if the objection is right. If the justification is *only* future knowledge, then the randomization isn't about the *current* choice under uncertainty, it's about *investment*. But Clinical Equipoise forbids investment if you think one arm is worse *for the patient*. So the "current choice" theory is still required to satisfy the ethical constraint. I will argue that the Epistemic Objection explains the *existence* of the trial, but the User's Theory explains the *structure* of the trial.

      *(Refining the "Truncation" point):* In atmospheric chem, you know that integrating a noisy signal over infinite time gives infinite error. Truncation is essentially setting a time horizon where the signal-to-noise ratio remains acceptable. This is a great analogy to use.

      *(Refining the "Charity" point):* If charities adopted this, they would stop claiming "X is the best charity." They would say "X, Y, and Z are indistinguishable within error, so we fund all three." This is a massive cultural shift in Effective Altruism.

  9.  **Final Output Generation** (Proceed to write response based on these thoughts).
answer: |-
  This is a sharp observation. You are looking at medical RCTs not as a clinician or a bioethicist, but as an experimentalist who understands that measurement error isn't just a nuisance parameter—it can fundamentally change the topology of the decision surface.

  When you look at the standard consequentialist model (Maximize Expected Utility), uncertainty is just variance. You integrate over the probability distribution and pick the highest mean. But the RCT practice you describe treats uncertainty as a *switch*. When uncertainty crosses a threshold, the algorithm changes from "Optimize" to "Randomize."

  Here is the reconstruction of the implicit theory, the handling of the objections, and the implications for high-uncertainty giving.

  ### 1. The Objection: Is it just about future knowledge?

  Your reading group's objection is the standard justification: *We randomize to learn, not because we are indifferent.* The randomization is an investment in the public good of knowledge, justified by the expected value of information (EVI) for future patients.

  If this were the whole story, the practice would presuppose much less than you think. It would just be standard investment logic: sacrifice some present efficiency (maybe treatment A is slightly better) to buy information that yields greater future efficiency.

  **However, this does not account for Clinical Equipoise.**
  The ethical gatekeeper you identified (Feature 1) forbids running the trial if the expert community believes one arm is better. If the justification were *only* future knowledge, we should be willing to sacrifice the current patients even if we suspect Treatment A is better, provided the knowledge gain is high enough. We don't do that. We say it is *unethical*.

  This implies a constraint on aggregation: you cannot sacrifice the present individual for the future collective unless the present individual is not being knowingly disadvantaged.
  *   **What this presupposes:** It presupposes that under a specific threshold of uncertainty, the *discriminatory power* of your estimates is zero. You aren't just "unsure"; you are in a state where the signal-to-noise ratio of the difference between options is < 1.
  *   **The Theory:** In this region, "Maximizing" is mathematically indistinguishable from "Arbitrary Selection." If your error bars overlap completely, picking the higher point estimate is just picking a number generated by noise. Randomization is the only procedure that admits this lack of discrimination without lying.

  So, the reading group is half-right: The *existence* of the trial is justified by future knowledge. But the *structure* of the trial (randomization + equipoise) presupposes that under deep uncertainty, maximization is epistemically invalid, not just risky.

  ### 2. Reconstructing the Implicit Theory: "Bounded Actionability"

  Based on the four features you listed, here is the implicit theory of rational choice buried in the RCT. Let's call it **Procedural Rationality under Radical Uncertainty**.

  **A. Uncertainty as a Phase Change (Features 1 & 2)**
  Standard theory treats uncertainty as continuous. This practice treats it as discrete.
  *   *Region 1 (Certainty/High Signal):* Maximize. Pick the best option.
  *   *Region 2 (Equipoise/Noise-Dominated):* Randomize.
  *   **The Theory:** When the variance of the estimator exceeds the difference in expected values, the gradient of the utility function is effectively flat. Gradient descent (maximization) fails. You switch to a stochastic search (randomization). This isn't abandoning the job; it's acknowledging that the "job" (picking the better one) is currently impossible to perform non-arbitrarily.

  **B. Truncation as Regularization (Feature 3)**
  You asked if untracked effects are worth zero or just unusable.
  *   *The Theory:* They are unusable because their error propagation diverges.
  *   In atmospheric chemistry, you know that if you integrate a noisy signal over a long enough timeline, the error bars swallow the signal. In consequentialism, this is the "Cluelessness" problem.
  *   The RCT protocol treats the 90-day horizon not as the *end of value*, but as the *horizon of actionability*. It presupposes that rational choice requires a bounded causal model. If the causal chain extends into a region where variance is unmanageable, including those terms makes the calculation unstable.
  *   **Verdict:** It presupposes they are *unusable*, not zero. But it treats them *as if* they are zero for the purpose of the decision rule. This is a regularization technique to prevent the decision from being hijacked by high-variance, low-probability tail events (Pascal's Mugging).

  **C. Early Stopping as Sequential Analysis (Feature 4)**
  *   *The Theory:* Uncertainty is a consumable resource.
  *   The trial is a machine for consuming uncertainty. The early stopping rule presupposes that there is a sharp point where ignorance becomes decision-relevant *again*.
  *   **Compatibility with Unmanageable Error:** You asked if this is compatible with the worry that long-run error bars don't shrink. The RCT practice says: "We are not looking at the long run. We are looking at the 90-day mortality." It sidesteps the unmanageable long-run error by defining the decision horizon *within* the manageable window. It presupposes that for a decision to be rational, it must be resolvable within a timeframe where measurement error is controllable.

  ### 3. Strict Presupposition vs. Good Fit

  You asked to distinguish what the practice *needs* from what merely *fits*.

  **Strictly Presupposed:**
  1.  **The Indifference Thesis:** When estimates are within the noise floor of the measurement system, there is no rational basis for preference. (This is why randomization is mandatory, not optional).
  2.  **The Boundedness Thesis:** A decision procedure cannot rationally account for causal consequences that lie beyond the horizon of reliable measurement. (This justifies truncation).
  3.  **The Reversibility of Ignorance:** Ignorance is not a permanent state; it is a temporary deficit that can be resolved by data collection *within the bounded horizon*. (This justifies the trial structure itself).

  **Merely Fits (Underdetermined):**
  1.  **Utilitarianism vs. Contractualism:** The practice fits Utilitarianism (maximize future knowledge), but it fits Contractualism equally well (no patient is used as a mere means because they are not knowingly disadvantaged). The practice doesn't tell us which is the *true* morality, only that the decision rule must respect individual indifference.
  2.  **Frequentist vs. Bayesian:** The practice is historically Frequentist (p-values, fixed endpoints), but a Bayesian could run an RCT with stopping rules based on posterior probabilities. The *practice* doesn't presuppose one statistical metaphysics, only that error must be quantified and respected.
  3.  **The Specific Horizon:** The 90-day cutoff is pragmatic, not theoretical. A theory of 10-year mortality would work if the measurement error allowed. The practice presupposes *a* horizon, not *this* horizon.

  ### 4. Applying the "Equipoise Rule" to Charity and Long-termism

  If a consequentialist in the policy/charity world adopted your "Equipoise Rule"—*when the spread of outcome estimates across live options is smaller than your uncertainty about the estimates, don't maximise, defer to a chance procedure (or diversification)*—here is what would happen.

  **A. Day-to-Day Decision Making**
  Currently, Effective Altruism (EA) style giving relies on "Cause Prioritization." You calculate the EV of malaria nets vs. AI safety vs. animal welfare, and you funnel money to the winner.
  *   **Under the Equipoise Rule:** You would calculate the error bars. In long-termism, error bars are massive. They often span orders of magnitude.
  *   **The Shift:** Almost all long-termist interventions would fall into the "Equipoise Zone." The difference between "AI Safety" and "Biosecurity" is likely within the noise floor of our predictive models.
  *   **Result:** You stop picking winners. You diversify. Instead of "All in on AI," you split funding proportionally or randomly across the set of options that are indistinguishable within error. This looks less like "optimization" and more like "portfolio theory."

  **B. Would it collapse into Maximizing?**
  It would only collapse if one option had a point estimate so high that it exceeded the error bars of the others.
  *   In near-term global health (e.g., bed nets), the data is good enough that error bars are tight. Maximization holds.
  *   In long-termism (e.g., influencing the far future), the data is non-existent. Error bars are huge. Maximization collapses into noise. The Equipoise Rule would *prevent* collapse. It forces the agent to admit, "I cannot distinguish these options," and act accordingly.

  **C. Would it license unacceptable things?**
  *   **Risk:** Yes. It might license funding "weird" or low-plausibility interventions just because we are uncertain about them. If I'm uncertain whether praying to a statue helps the economy, and uncertain whether foreign aid helps, and the error bars overlap, the rule says "toss a coin."
  *   **Mitigation:** The RCT practice has a safeguard you didn't explicitly list: **Preclinical/Phase I Safety.** You don't trial a drug unless there is *some* mechanistic reason to think it isn't poison.
  *   **Applied to Charity:** You need a "Plausibility Floor." The Equipoise Rule applies only to options that pass a minimum threshold of mechanistic plausibility. This prevents funding pure superstition, even under uncertainty.
  *   **The "Stopping" Problem:** In medicine, trials stop. In long-termism, the "trial" never ends; we don't get feedback for 100 years.
      *   *Implication:* If you adopt the RCT theory, you must admit that long-termist giving is *not* an RCT. It is an open-loop intervention.
      *   *Correction:* The rational move under the RCT theory for long-termism is to fund **meta-research** (things that shorten the feedback loop) rather than direct intervention. If you can't measure the outcome, you can't exit equipoise. Therefore, the highest value action is to build the instruments that allow you to measure the outcome.

  ### 5. Summary of the Implicit Theory

  The RCT practice embodies a theory of **Epistemic Humility as a Decision Constraint.**

  1.  **Measurement limits decision:** You cannot choose what you cannot distinguish. When error > signal, choice is illusory.
  2.  **Action requires bounds:** Rationality is only possible within a horizon where consequences are tractable. Unbounded consequentialism is irrational because it requires integrating divergent error series.
  3.  **Process over Outcome:** In the zone of ignorance, the rationality is in the *procedure* (randomization, monitoring), not the specific *outcome* of the choice.

  **For your reading group:**
  The consequentialist wants to maximize the Good. The RCT practitioner says: "You cannot maximize what you cannot measure. If you try to maximize in the noise, you are not optimizing; you are hallucinating. The rational move is to admit ignorance, randomize to generate data, and bound the horizon to where the data is real."

  **For your charity question:**
  If they adopted this, they would stop claiming to know which cause is "best." They would fund a diversified portfolio of plausible interventions, prioritize shortening feedback loops (so they can exit equipoise), and treat point estimates in the far future as noise. It would look less like a crusade and more like a research program.

  It fits your background perfectly: It treats ethics like instrumentation. If the signal-to-noise ratio is too low, you don't report a number; you report "below detection limit" and you adjust the apparatus.
