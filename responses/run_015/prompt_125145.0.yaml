          *   *Reply:* SEU collapses distinct risks into a single scalar; my framework preserves the *structural* constraint on the *process* of inquiry, not just the outcome value. It's about survival of the inquirer, not just valuation of states.
          *   *Weakness:* Concedes that SEU can *mimic* the behavior, but argues it misses the *explanation*.

      *   **Objection 3 (Philosophers of Science - Category Mistake):** "Epistemology isn't gambling. Truth isn't capital."
