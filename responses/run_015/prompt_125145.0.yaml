          4.  1 Decision Theorist (DT): Committed to Subjective Expected Utility (SEU), thinks state-dependent utility handles absorption.
      *   **Constraints:** Order objections by damage level (most damaging first). Use audience-specific vocabulary. 2-minute reply length. Explicit note on weakness/concession. Include the "hope nobody raises" math objection. No bibliographies/citations.

  2.  **Determine Order of Objections (Damage Assessment):**
