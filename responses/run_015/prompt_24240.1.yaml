answer: |-
  You have independently reconstructed **Fitch's Paradox of Knowability** (also known as the Church-Fitch Paradox). Your derivation is logically valid within standard classical modal epistemic logic. Given your premises, the conclusion ($p \to Kp$, i.e., omniscience) is inescapable.

  Since you wish to maintain **Logical Omniscience** (for an ideal agent) and **Factivity** (for knowledge to be knowledge), and you explicitly want to preserve the intuition that **some truths are unknown**, you must reject or restrict the **In-Principle Knowability (IPK)** principle.

  Here is an analysis of why you must reject IPK, the cost of doing so, and how to restrict it in a principled way.

  ### 1. The Diagnosis: Why IPK Must Go
  The paradox arises because the proposition $p \land \neg Kp$ (a "Moorean sentence") behaves differently than standard propositions.
  *   It can be **true** (if $p$ is true but the agent doesn't know it).
  *   It cannot be **known** (because knowing it entails $Kp$, which contradicts $\neg Kp$ via factivity).

  The IPK principle ($\phi \to \Diamond K\phi$) asserts that *every* truth is possibly known. When you apply this to the Moorean sentence, you assert that it is possible to know a proposition that, by its very logical structure, cannot be known. The contradiction you derived proves that **not all truths are knowable.**

  To save the distinction between truth and knowledge, you must accept that there are **unknowable truths**.

  ### 2. The Cost of Rejecting IPK
  Rejecting the universal IPK principle carries a specific philosophical cost: **The Collapse of Strong Verificationism.**

  *   **What you lose:** You can no longer claim that "for every truth, there is a possible state of affairs in which an agent knows it." You must admit that the set of truths is strictly larger than the set of knowable propositions.
  *   **What you save:** You save the distinction between truth and knowledge for non-Moorean propositions. You allow for an agent who is "ideal" (logically omniscient) but not "divine" (actually omniscient). The agent knows all *knowable* truths, but there remain truths that are inherently beyond the reach of knowledge.

  For a model of an **ideal rational agent**, this is often considered an acceptable cost. It implies that the limits of knowledge are not due to the agent's cognitive limitations (which you modeled away with Logical Omniscience) but are due to the **logical structure of knowledge itself** (specifically Factivity).

  ### 3. Principled Restrictions on Knowability
  You requested a restriction that is "principled rather than ad hoc." Simply saying "IPK holds except for the case that causes the paradox" is ad hoc. Here are two principled ways to restrict IPK:

  #### A. The "K-Free" Restriction (Syntactic)
  The most straightforward restriction is to limit the scope of IPK to propositions that do not contain the knowledge operator $K$.
  *   **Restricted IPK:** For any proposition $\phi$ that does not contain $K$, $\phi \to \Diamond K\phi$.
  *   **Why it works:** The paradox requires substituting $\phi = (p \land \neg Kp)$. This formula contains $K$. Therefore, the Restricted IPK does not apply to it, and the derivation is blocked at the first step.
  *   **Principled Justification:** In epistemic logic, there is a distinction between **worldly facts** (descriptions of the world, e.g., "it is raining") and **epistemic facts** (descriptions of the agent's relation to the world, e.g., "I know it is raining"). An ideal agent's knowability guarantee should apply to worldly facts. Epistemic facts are determined by the agent's state, not independent truths waiting to be discovered.

  #### B. The "Cartesian" Restriction (Semantic)
  Proposed by Neil Tennant, this restricts IPK to propositions that are *consistent with being known*.
  *   **Definition:** A proposition $\phi$ is **Cartesian** if and only if $\Diamond K\phi$ is logically consistent (i.e., $\neg K\phi \lor \Diamond K\phi$ is valid, or more simply, $K\phi$ does not entail a contradiction).
  *   **Restricted IPK:** For any Cartesian proposition $\phi$, $\phi \to \Diamond K\phi$.
  *   **Why it works:** The proposition $p \land \neg Kp$ is *not* Cartesian, because we proved $\neg \Diamond K(p \land \neg Kp)$. Therefore, the axiom does not apply to it.
  *   **Principled Justification:** This captures the intuition of "in-principle knowability" more accurately. If a proposition is logically impossible to know (like the Moorean sentence), it was never "in principle knowable" to begin with. This restriction defines knowability as a property of the proposition's logical form rather than a universal guarantee.

  ### 4. Recommendation for Your Formalization
  Given your goal of modeling an **ideal rational agent**, I recommend the **K-Free Restriction**.

  1.  **Define a base language $\mathcal{L}_0$** containing atomic propositions and boolean connectives, but no $K$ operator.
  2.  **Apply IPK only to $\mathcal{L}_0$:** $\forall \phi \in \mathcal{L}_0 (\phi \to \Diamond K\phi)$.
  3.  **Maintain LO and Factivity** for the full language (including $K$).

  **Result:**
  *   **Derivation Blocked:** You cannot instantiate IPK with $p \land \neg Kp$, so you cannot derive $p \to Kp$.
  *   **Unknown Truths Preserved:** It is consistent that $p$ is true and $\neg Kp$ is true.
  *   **Ideal Agent Preserved:** The agent knows all logical consequences of their knowledge (LO) and never knows falsehoods (Factivity). They know every *basic* truth that is possible to know.
  *   **Cost:** You must accept that the proposition "p is true but unknown" is a truth that is necessarily unknown. This is not a failure of the agent, but a logical necessity of factive knowledge.

  ### Summary
  You should reject the universal **In-Principle Knowability** principle. The cost is accepting that **some truths are inherently unknowable** (specifically, truths that entail their own unknownness). This is a standard and philosophically robust move in epistemic logic that preserves the "ideal" nature of the agent while avoiding the collapse into omniscience. Restricting IPK to **K-free propositions** is the cleanest, most principled way to implement this in your formalization.
