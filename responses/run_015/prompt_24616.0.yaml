answer: |-
  **Setting:** *A university coffee shop. Two graduate students, ELARA (Tolstoy Defender) and MARCUS (Aesthetic Formalist), are surrounded by stacks of papers. Marcus is rubbing his temples.*

  **Marcus:** Okay, I'm going to pin you down, because this is where Tolstoy falls apart. In *What Is Art?*, he defines art as the "infection" of feeling. The stronger the infection, the better the art. Correct?

  **Elara:** Broadly, yes. The sincerity of the artist transmits a feeling to the perceiver, creating a union.

  **Marcus:** So, by that metric, a Leni Riefenstahl film or a supremely manipulative Super Bowl commercial is a masterpiece. It infects me. I feel the pride, or the desire, or the unity of the crowd. It works mechanically. But Tolstoy waves a hand and says, "No, that's a perversion because the *feeling* is base."

  **Elara:** He calls it "counterfeit" or "bad" art, yes.

  **Marcus:** See, that's the gap. If the test is "does it infect," the propaganda wins. If the test is "is the feeling morally good," then the infection mechanism is irrelevant. He could just write a treatise on ethics. Why do I need the art definition at all? It feels like he wants the scientific objectivity of "infection" to validate the subjective preachiness of "Christian morality."

  **Elara:** You're treating infection like a viral load, Marcus. Like it's just about intensity. But for Tolstoy, infection isn't just intensity; it's *accessibility*.

  **Marcus:** Accessibility?

  **Elara:** Think about the nature of the feelings. Tolstoy argues that feelings of exclusivity—pride, sexual lust, patriotism, envy—are inherently divisive. They rely on *separation*. I feel proud because I am better than *you*. I want this Coke because *I* have it and you don't.

  **Marcus:** So?

  **Elara:** So, you cannot truly "infect" everyone with a feeling of exclusivity. You can only infect a specific group. A Nazi rally infects the Nazis; it repels the Jew. A luxury ad infects the aspirational buyer; it alienates the poor. Because the feeling itself is based on separation, the "infection" is structurally limited. It can never achieve universal union.

  **Marcus:** Ah, I see. So you're saying the moral criterion actually *feeds back* into the infection criterion. A "bad" feeling physically cannot infect as widely as a "good" feeling.

  **Elara:** Exactly. For Tolstoy, the highest art transmits feelings of "brotherhood" or "oneness with God and man." Because those feelings are universal by definition, they have the highest *potential* for infection. The morality isn't a separate filter applied after the fact; it's a constraint on the *capacity* of the infection.

  **Marcus:** That's a clever save, Elara, but it's empirically false. History is full of "base" art that united millions. Homer's *Iliad* is about rage and pride. Wagner is steeped in mythic nationalism. People wept. They felt united.

  **Elara:** United *with whom*?

  **Marcus:** With each other! The audience!

  **Elara:** But against whom? Tolstoy would say that if the unity is purchased at the price of excluding someone else, it's a false unity. It's a conspiracy, not a communion. And look at the longevity. Tolstoy argues that elite art—opera, symphonies, difficult poetry—stops infecting anyone outside the upper class. It becomes a code. It loses the power of infection because the feeling isn't sincere or universal anymore.

  **Marcus:** Okay, but let's go back to the propaganda problem. Let's say I watch a recruitment video for a just cause. Say, the Resistance in WWII. It infects me with a feeling of righteous anger against tyranny. It's moral. It's universalizable. But is it *art*? Or is it just rhetoric with music?

  **Elara:** If it transmits a *feeling*—not an idea, but the actual sensation of the struggle, the fear, the hope—and I feel it as if it were my own, Tolstoy says that is art.

  **Marcus:** But here's the trap you're walking into. If you admit that a moral recruitment video can be art, then the "infection" is doing no work. The *morality* is doing the work. I am infected because I agree with the cause. If I were a Nazi, I wouldn't be infected. So the infection depends on my prior moral agreement.

  **Elara:** No, it depends on the artist's *sincerity*.

  **Marcus:** Sincerity is invisible! I can be sincerely wrong. A suicide bomber is sincere. If he makes a video transmitting his sincere feeling of devotion, and it infects me... is that Tolstoyan art?

  **Elara:** *Pause.* This is the hard part. Tolstoy would say... if it transmits a feeling that separates men from God or from their brothers, it is *bad* art. But yes, it might still function as art in the mechanical sense. He distinguishes between the *definition* of art and the *evaluation* of art.

  **Marcus:** But he conflates them! He spends half the book saying "Art is infection" and the other half saying "Art must serve the Kingdom of God." If I'm a student trying to grade this, does the infection test pass the propaganda, or does the moral test fail it?

  **Elara:** It passes the definition, but fails the evaluation. But here is the nuance you're missing: Tolstoy believes that *bad* art eventually loses the power to infect.

  **Marcus:** Why?

  **Elara:** Because lies are exhausting. To transmit a base feeling, you have to rely on external tricks—imitation, cleverness, shock value. To transmit a true feeling of human unity, you only need sincerity. So, over time, the "propaganda" requires more and more stimulus to get the same reaction. The "good" art remains infectious because the feeling is fundamental to human existence.

  **Marcus:** That's a theological claim, not an aesthetic one. You're assuming the universe is structured such that Truth wins out in the market of feelings.

  **Elara:** I am. Tolstoy is. That's his "religious consciousness."

  **Marcus:** Okay, let's pivot. If the infection mechanism is secondary to the moral outcome, why not just teach ethics? Why bother with the "infection" theory at all?

  **Elara:** Because ethics is cognitive. Art is experiential. I can agree that "hunger is bad" intellectually. But if you transmit the *feeling* of hunger, I am compelled to act. The infection is the *engine* that makes the morality move. Without the infection, it's just a sermon. Without the morality, it's just a drug. Tolstoy wants the engine to drive the car, not spin the wheels in the mud.

  **Marcus:** But who decides which feelings are "mud"? Tolstoy decided that Beethoven's 9th Symphony was "bad art" because it was exclusive and complex. He preferred simple peasant songs.

  **Elara:** He preferred them because a peasant in Russia and a peasant in France could both feel them. He was testing for *universality*.

  **Marcus:** But complexity can also be universal. Math is complex and universal. Why can't a complex symphony transmit a complex feeling that is still universally accessible to those who learn the language?

  **Elara:** Because Tolstoy thinks art shouldn't require a "language" to be learned. It should be immediate. Like a yawn. If you have to study music theory to feel the sadness in a chord, it's not art, it's a puzzle.

  **Marcus:** That's absurd. Grief is complex. Sometimes grief *is* a puzzle. If I make art that reflects the complexity of modern alienation, and it infects other alienated people... Tolstoy would call that "bad" because it's not promoting simple brotherhood?

  **Elara:** He would call it "exclusive." It unites the alienated against the non-alienated.

  **Marcus:** But that's the human condition! We aren't all one big happy family. Sometimes art's job is to show the fracture.

  **Elara:** And Tolstoy would say that showing the fracture without offering the healing is destructive. It leaves you infected with despair.

  **Marcus:** But despair is true!

  **Elara:** Is it? Or is it just a feeling of separation? If art transmits despair, it makes me feel alone. If art transmits the *shared experience* of despair, it makes me feel less alone. The latter is Tolstoyan art. The former is just wallowing.

  **Marcus:** *Taps pen on table.* Okay. So the resolution to my "propaganda problem" is this: Tolstoy admits propaganda can be art, but he argues it's *unstable* art. It relies on division, and division limits the scope of infection.

  **Elara:** Yes. And because it relies on division, it requires constant reinforcement (more flags, louder music, bigger budgets). True art, transmitting simple human feeling, is self-sustaining.

  **Marcus:** I still think he's begging the question. He defines "Good Infection" as "Universal Brotherhood," then declares that only Universal Brotherhood creates "Good Infection." It's circular.

  **Elara:** It is circular, but it's a *moral* circle, not a logical one. He's not trying to write a logic textbook; he's trying to save your soul. He's saying: "You think art is about beauty? No. Art is a tool for human survival. If the tool cuts off your hand, it's a bad tool, even if it's shiny."

  **Marcus:** So the "infection" isn't the measure of quality. It's the measure of *function*.

  **Elara:** Precisely. Infection proves it *is* art. Morality proves it is *useful* art. The propaganda is functional art used for a destructive end.

  **Marcus:** But that means the aesthetic experience—the beauty, the form, the sheer pleasure of the thing—is irrelevant.

  **Elara:** To Tolstoy? Yes. He thinks "beauty" is just a word we use to justify pleasure. If the pleasure comes from a feeling of superiority, it's dangerous.

  **Marcus:** And if I say the pleasure *is* the point? That the momentary suspension of moral judgment *is* the value?

  **Elara:** Then you are the enemy Tolstoy was fighting. You are the aristocrat eating while the peasants starve, justifying it because the food is "beautiful."

  **Marcus:** *Laughs.* Okay, fair. But admit this: If Tolstoy is right, then a really effective, morally good documentary is higher art than the *Mona Lisa*.

  **Elara:** He would say yes. If the documentary makes me feel love for my neighbor, and the *Mona Lisa* just makes me feel clever for understanding the sfumato... then yes. The documentary is doing the work of art. The *Mona Lisa* is just an idol.

  **Marcus:** It's a brutal standard.

  **Elara:** It is. It burns down the museum to save the village.

  **Marcus:** But does it solve the tension? If I need a moral theory to judge the feelings, doesn't the "infection" definition become redundant? Why not just say "Art is moral instruction"?

  **Elara:** Because moral instruction can be boring. It can be ignored. Infection *cannot* be ignored. If I am truly infected, I *become* the other person. Moral instruction tells me to help the poor. Infection makes me *feel* the poverty. The infection is the mechanism that bypasses the intellect. Tolstoy needs the infection to make the morality unavoidable.

  **Marcus:** So the infection is the delivery system, and the morality is the payload.

  **Elara:** Yes.

  **Marcus:** And the propaganda problem?

  **Elara:** Propaganda is a delivery system with a poisoned payload. It works, but it kills the host.

  **Marcus:** *Sighs.* I still think a poisoned payload can be beautifully delivered.

  **Elara:** And Tolstoy would say that admiring the delivery while ignoring the poison is why the world is in the state it's in.

  **Marcus:** Touché. But I'm still grading the *Mona Lisa* as art, regardless of the peasants.

  **Elara:** Then you're admitting it's a "counterfeit" that infects you with the feeling of exclusivity. You're proud you understand it.

  **Marcus:** Damn it, Elara. You're doing it. You're infecting me with Tolstoyism.

  **Elara:** *Smiles.* See? It works.

  **Marcus:** Fine. But if I start giving away my estate, I'm blaming you.

  **Elara:** Just make sure you feel sincere about it. Otherwise, it's just performance.

  **Marcus:** Don't push it.
