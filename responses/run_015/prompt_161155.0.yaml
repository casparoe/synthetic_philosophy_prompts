answer: |-
  **MEMORANDUM**

  **TO:** Capital Committee, Cedar Basin Cooperative Federation
  **FROM:** [Your Name], Capital Committee Member
  **DATE:** April 5, 2024
  **SUBJECT:** Recommendation for Capital Allocation Mechanism (FY2025)
  **MEETING DATE:** April 12, 2024

  ### 1. Executive Summary

  We are wasting time fighting a single battle when we actually have two different problems. Two-thirds of our capital demand is routine replacement (boring, data-rich). One-third is strategic innovation (risky, data-poor).

  I recommend we split the fund into two distinct tracks with hard caps and different rules.

  *   **Track 1 (Stability):** 65% of the fund. Allocated via a **Price Loop** with automatic rate revisions and a mandatory **Surplus Holdback** to create financial liability.
  *   **Track 2 (Development):** 35% of the fund. Allocated via an **Allocation Assembly** grant process based on strategic criteria (decarbonization, new shop equity).

  This is not a "compromise." It is a recognition that pricing mechanisms fail when there is no historical data, and political mechanisms fail when there is abundant data.

  ### 2. The Economic Reality Check

  We have two members arguing economic theory from the 1930s. One says central planning is impossible (Mises/Hayek). The other says trial-and-error pricing solves everything (Lange). Neither is entirely right for our specific situation, but both point to real risks we need to manage.

  **What is Settled (The Pilot Proved This):**
  Prices do not convey information if there are no consequences for ignoring them. Our two-year pilot failed because shops bid high without actually paying. When the "loss" is absorbed by the collective rather than the bidder, price signals become noise. The Old-timer is right about this: without skin in the game, a bid is just a wish.

  **What is Contested (Don't Let This Stall Us):**
  Whether a central body *can* set efficient prices for *new* goods if they have perfect data. The Lange advocate argues computers make this easy. The Mises advocate argues it's never enough.
  *Reality:* We don't have perfect data on heat-pump retrofit kits. Nobody does. For the "new stuff," prices cannot form because there is no market history to track. For the "old stuff" (press brakes, dough mixers), we have ten years of cost data. We don't need to solve the global calculation problem; we just need to allocate our specific pool.

  **Conclusion on Theory:** Use prices where we have data (Routine). Use planning where we lack data (Innovation). Do not try to force one method onto both.

  ### 3. Concrete Proposal: The Two-Track System

  #### Track 1: The Stability Pool (Routine Capital)
  **Budget:** 65% of total annual capital fund.
  **Eligibility:** Replacement of existing equipment, duplication of existing lines for existing customers. Must demonstrate 2+ years of stable revenue from the relevant line.
  **Mechanism:** Price Loop with Liability.

  *   **Internal Rental Rate:** Federation Office sets a quarterly rate per equipment class (e.g., $/hour for press brake time, $/month for CNC).
  *   **Automatic Revision:** Rates adjust quarterly based on a published formula. If utilization > 85%, rate increases 5%. If utilization < 60%, rate decreases 5%. No committee smoothing allowed.
  *   **The "Skin in the Game" Fix:** To address the "cheap talk" objection, shops cannot just pay the rate from revenue.
      *   **Surplus Holdback:** 20% of the shop's annual patronage refund is held in escrow for 3 years against any Track 1 asset they acquire.
      *   **Liability:** If the asset underperforms its projected utilization by more than 15%, the cost difference is deducted from the Holdback before release.
      *   **Why this works:** It doesn't risk personal assets (we are a co-op), but it risks the shop's collective surplus. It makes the bid painful if wrong.

  #### Track 2: The Development Pool (Strategic Capital)
  **Budget:** 35% of total annual capital fund.
  **Eligibility:** New product lines, new supply chains, decarbonization projects, or capital for shops under 3 years old.
  **Mechanism:** Allocation Assembly (Grant).

  *   **No Internal Prices:** Charging interest on a speculative heat-pump line is nonsense; we don't know the margin yet.
  *   **Criteria:** Projects ranked by the Spring Assembly on:
      1.  Federation strategic goals (e.g., decarbonization).
      2.  Inter-coop supply chain creation.
      3.  Equity for newer/smaller shops.
  *   **Liability:** No financial holdback. Instead, **Reporting Requirements.** Recipients must report quarterly on milestones. Failure to report disqualifies the shop from Track 2 for 2 years.

  ### 4. Implementation Timeline & Numbers

  **Assumptions:** Based on last year's revenue, we project a total capital fund of ~$4.2M (6% of aggregate revenue).
  *   **Track 1 Pool:** $2.73M
  *   **Track 2 Pool:** $1.47M

  **Schedule:**

  *   **April 12:** Committee votes on this Two-Track structure.
  *   **April 30:** Federation Office publishes the Track 1 Rate Formula and the Track 2 Strategic Criteria.
  *   **May 15:** Shops submit Track 1 equipment needs (for Q3 start).
  *   **June 1:** Shops submit Track 2 proposals.
  *   **June 15:** Spring Assembly votes on Track 2 grants.
  *   **July 1:** FY2025 Allocation begins.
  *   **September 30:** First Quarterly Rate Revision for Track 1 (publicly calculated, no adjustments).

  ### 5. Why This Beats the Alternatives

  **If we do only Proposal A (Price Loop):**
  We will starve innovation. The cargo-bike shops and the heat-pump initiative cannot bid against the metal shops that have steady cash flow. The "cheap talk" objection holds true unless we add the Holdback. Without the Holdback, the metal shops will bid up rates artificially, crowding out everyone else, knowing the Federation will absorb the loss if they overestimate.

  **If we do only Proposal B (Allocation Assembly):**
  We will waste money on routine replacements. We have enough cost data to know when a press brake is being underutilized. Forcing a political committee to debate the replacement of a 10-year-old dough mixer is a misuse of the Assembly's time and invites favoritism. It ignores the data we already have.

  ### 6. Risks and Mitigations

  **Risk:** Shops argue over which Track their project belongs to. (e.g., Is a new printer for an existing client Track 1 or 2?)
  **Mitigation:** The Capital Committee acts as the gatekeeper for Track eligibility *before* bids or proposals are accepted. Criteria: "Has this shop sold this specific spec to this specific customer type before?" If yes, Track 1. If no, Track 2.

  **Risk:** The Surplus Holdback is too punitive for smaller shops.
  **Mitigation:** The Holdback cap is limited to the cost of the asset. If the shop is under 3 years old, they are automatically routed to Track 2 where no Holdback applies.

  **Risk:** The Old-timer claims this is still "planning."
  **Response:** It is. But for the 65% of the economy that is stable, planning via price signals is efficient. For the 35% that is growth, planning via mission is necessary. We are not trying to price the future; we are funding it.

  ### 7. Recommendation

  Vote to adopt the Two-Track System with the Surplus Holdback mechanism for Track 1.

  This acknowledges that prices are tools, not ideologies. They work for the boring stuff. They don't work for the brave stuff. We have enough money to do both, provided we stop trying to use a hammer to tighten a screw.

  I am available to walk through the Rate Formula draft before the April 12 meeting.
