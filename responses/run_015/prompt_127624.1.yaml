answer: |-
  **Title:** The Historical Void: Why Etiological Function Fails in Synthetic Protein Design

  **Introduction**

  The etiological account of biological function (EA), championed by theorists such as Millikan and Neander, posits that the function of a trait is the effect for which it was historically selected. On this view, a heart functions to pump blood because ancestors of current hearts pumped blood, and this capacity contributed to their reproduction, leading to the retention of the trait. This backward-looking definition provides a robust mechanism for distinguishing true functions from mere causal capacities or accidental byproducts. However, the rise of synthetic biology, specifically the creation of *de novo* engineered proteins, presents a challenge that is not merely a peripheral boundary case but a structural failure of the etiological framework.

  I argue that EA cannot consistently assign functions to *de novo* proteins because they lack the requisite lineage of natural selection. Furthermore, I defend the claim that if an etiological theorist attempts to salvage the account by appealing to the designer's intentions and artificial selection protocols as a proxy for evolutionary history, the account collapses into a causal-role (CR) framework. In this collapse, the explanatory work is performed by the protein's current contribution to an engineered pathway, not by its history. The analogy between natural and designer selection breaks down precisely where EA needs it most: in distinguishing a protein's biochemical activity from its intended functional role. Without an independent evolutionary history, EA must smuggle in causal-role criteria to make this distinction, thereby abandoning its core etiological commitment.

  **I. The Etiological Account and the Synthetic Challenge**

  To establish the structural limitation, we must first define the constraints of the etiological account and the nature of *de novo* protein design.

  *   **Premise 1 (Conceptual):** According to EA, a trait $T$ has function $F$ if and only if $T$ exists now because ancestors of $T$ possessed $F$, and $F$ contributed to the differential reproduction/retention of those ancestors. History is constitutive of function.
  *   **Premise 2 (Practical):** *De novo* engineered proteins are generated via computational design or high-throughput screening of synthetic libraries to perform specific tasks (e.g., binding a non-natural substrate, acting as a logic gate) without homologous ancestors in nature. They are "first-of-their-kind" variants inserted into a host organism or cell-free system.

  Given P1 and P2, *de novo* proteins possess no evolutionary history prior to their engineering. There is no lineage of differential reproduction where the protein's effect caused its own retention in a population over generations of natural selection. Consequently, under a strict reading of EA, *de novo* proteins are functionless. They have causal powers, but no functions.

  This is not a trivial omission. In synthetic biology, functional attribution is the primary currency of design. To say a protein "functions as a biosensor" is to make a truth-claim essential to the engineering process. If EA declares these claims false or category-errors, it fails to map onto the scientific practice it purports to analyze. This suggests a structural incompatibility: EA relies on *past retention* to justify *current attribution*, while synthetic biology relies on *current specification* to justify *current attribution*.

  **II. The Strongest Reply: Designer Selection as Analogous to Natural Selection**

  The most robust defense available to the etiological theorist is to expand the notion of "selection" to include artificial design processes.

  *   **Reply (Conceptual):** Artificial selection in the lab is structurally isomorphic to natural selection. A designer creates a library of variants (mutation), subjects them to a screening protocol (selection pressure), and retains those that perform a specific task (differential retention).
  *   **Reply (Practical):** Directed evolution and iterative design cycles create a genuine history. The protein exists now *because* previous iterations failed and the successful variant was "selected" by the engineer based on its performance. Therefore, the designer's intention, coupled with the selection protocol, generates a valid etiological history.

  On this view, the "designer" replaces "nature," and the "design specification" replaces "environmental fitness." The function of the synthetic protein is the effect for which the designer selected it. This seems to preserve the historical nature of EA while accommodating synthetic systems.

  **III. The Collapse into Causal-Role Frameworks**

  However, this reply fails because it fundamentally alters the explanatory direction of the etiological account. In natural selection, the history is independent of the current utility; the past selects the present. In designer selection, the "history" is subservient to the forward-looking intention.

  *   **Premise 3 (Conceptual):** For a historical explanation to be genuinely etiological, the selection history must be an independent causal factor that explains the trait's presence, distinct from the justification of its current utility.
  *   **Premise 4 (Practical):** In *de novo* design, the "selection" process is typically a validation step. Variants are screened to verify they meet the pre-existing design specification. The "retention" of the protein is not due to a blind historical process but is contingent on its immediate capacity to fulfill the designer's goal.

  If the "selection history" is merely a log of attempts to achieve a specific current outcome, then the history adds no explanatory power beyond the outcome itself. When an etiological theorist appeals to the designer's intention to fix the function, they are effectively saying: "The function is what the designer intended it to do, provided it can do it."

  This reduces to a Causal-Role account. A CR account defines function as the contribution a trait makes to a containing system's capacity. In synthetic biology, the "containing system" is the engineered pathway, and the "contribution" is the designer's specification. By relying on the designer's intention to validate the function, the theorist is prioritizing the *current contribution to the engineered goal* over the *history of retention*. The "history" becomes a metaphor for the design process, not a causal explanation of the trait's existence. The explanatory work is done by the fact that the protein *currently* contributes to the pathway as intended, not by the fact that it was *selected* in the past. The historical narrative is retrofitted to justify the current role, which is the hallmark of CR accounts, not EA.

  **IV. The Breakdown of the Analogy: Activity vs. Intended Role**

  The structural failure becomes most evident when we examine how EA distinguishes between a trait's total causal capacities and its specific function. This is the "distinction problem."

  In natural systems, EA solves the distinction problem via history. A heart has the capacity to pump blood and the capacity to make a thumping sound. Only pumping blood is the function because only pumping blood explains the heart's historical retention. The history filters the capacities.

  In synthetic systems, the etiological theorist relying on designer selection faces a dilemma:

  *   **Premise 5 (Practical):** *De novo* proteins often exhibit "promiscuous" biochemical activities (side reactions, off-target binding) distinct from their intended design role. For example, a designed enzyme might catalyze the target reaction (intended role) but also aggregate under stress (biochemical activity).
  *   **Premise 6 (Conceptual):** To assign function, one must distinguish the *intended role* (function) from the *biochemical activity* (byproduct/capacity).

  In natural selection, this distinction is drawn by looking backward: Which effect caused retention? In synthetic design, if we appeal to the designer's intention, we are looking forward: Which effect was the goal?

  If the etiological theorist claims the function is the "intended role" because the designer "selected" for it, they must explain why the "selection" validates the intention rather than just the capacity. In directed evolution, a variant is selected *because* it exhibits the capacity. If the capacity (e.g., aggregation) inadvertently helps survival in the screen, it could be "selected for" even if unintended.

  To rule this out—to say the aggregation is *not* the function despite being selected for in the screen—the theorist must appeal to the *design specification* (what it was supposed to do), not the *selection outcome* (what it actually did to get retained).

  *   **The Smuggling of CR Criteria:** By prioritizing the design specification over the actual selection outcome to determine function, the theorist is using a Causal-Role criterion (fit with the system's goal) to override the Etiological criterion (history of retention). They are saying, "It functions to catalyze X, not aggregate, because that is its role in the pathway," not "because that is what caused its retention."

  The analogy breaks down because natural selection has no "intention" to distinguish function from byproduct; it only has retention. Designer selection has intention *prior* to retention. Therefore, the "function" is fixed by the intention (a forward-looking, system-relative property), not the history. If the history contradicts the intention (e.g., the protein is retained for a side effect), the synthetic biologist still attributes the intended function, provided the system works. This confirms that the functional attribution rests on the current contribution to the engineered pathway (CR), not the history of the design process (EA).

  **Conclusion**

  The inability of the etiological account to handle *de novo* engineered proteins is not a mere boundary issue but a structural limitation rooted in the definition of function itself. EA requires a history of retention to constitute function. Synthetic biology generates function through forward-looking specification and current system integration.

  When the etiological theorist attempts to bridge this gap by equating designer intention with natural selection, the account collapses. The "selection history" in synthetic biology is not an independent causal explanation but a validation of current utility. Consequently, the distinction between a protein's biochemical activity and its functional role cannot be drawn by historical facts alone; it requires appealing to the designer's specification of the protein's contribution to the pathway. This appeal smuggles in Causal-Role criteria, rendering the evolutionary metaphor explanatorily idle. Thus, in the domain of synthetic systems, functional attribution is inherently forward-looking and systemic, exposing the etiological account as structurally incompatible with the practice of engineering life.
