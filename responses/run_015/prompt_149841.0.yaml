answer: |-
  You have identified a classic fault line in historical and economic sociology. Your intuitions are not inconsistent; they track a specific methodological distinction that separates **mechanism-driven culturalism** from **tautological functionalism**.

  Here is the principle that unifies your verdicts, the mapping of your cases, the prediction for the Confucian case, and the honest limitation of this framework.

  ### The Principle: Non-Reductive Constraint

  Your intuitions are governed by the **Principle of Non-Reductive Constraint**. For a cultural value to be considered causal in the Weberian sense, it must satisfy two clauses:

  1.  **The Independence Clause:** The cultural variable (value, norm, belief) must be identifiable and measurable *independently* of the outcome it is supposed to explain. (It cannot be inferred solely from the existence of the outcome.)
  2.  **The Friction Clause:** The cultural variable must act as a **constraint** on material rationality. It must compel actors to choose a path that incurs a cost, risk, or effort that pure structural/material incentives would not dictate. It must create "friction" against the path of least material resistance.

  **Why this saves your consistency:**
  *   **Cases 1, 2, 4 (Yes):** The value is independent (theology, law, survey data) and it creates friction (saving instead of consuming, avoiding interest, fighting instead of walking away).
  *   **Cases 3, 5 (No):** The value fails Independence (inferred from the outcome) or fails Friction (the "value" aligns perfectly with material incentives, making it a rationalization rather than a driver).

  ---

  ### Mapping the Cases

  | Case | Verdict | Clause A (Independence) | Clause B (Friction) | Why it fits your intuition |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Calvinists** | **Yes** | **Pass.** Theology/anxiety exists in texts and sermons prior to accumulation. | **Pass.** Asceticism *constrains* consumption. Accumulation was an unintended byproduct, not a goal. | The value forces behavior (saving) that contradicts immediate hedonistic utility. |
  | **2. Islamic Riba** | **Yes** | **Pass.** Prohibition is codified in law independent of contract types. | **Pass.** Interest is often transactionally cheaper/easier. Prohibition *forces* the costlier/complex *mudaraba* structure. | The norm blocks a materially efficient tool, forcing institutional innovation. |
  | **3. Japanese Harmony** | **No** | **Fail.** "Harmony" is usually inferred *from* the low lawyer rate. | **Fail.** Litigation is expensive. Avoiding it is materially rational regardless of culture. | It redescribes the outcome. Without independent measures of "harmony," it's tautological. |
  | **4. Culture of Honor** | **Yes** | **Pass.** Measured via surveys/experiments (Nisbett et al.) independent of crime stats. | **Pass.** Violence is costly/risky. Responding to insults with violence contradicts safety/utility. | The norm overrides the material incentive to stay safe/avoid prison. |
  | **5. SV Hustle** | **No** | **Pass.** "Hustle" is articulated in manifestos. | **Fail.** 80-hour weeks maximize equity value in a VC winner-take-all market. | The "culture" aligns perfectly with structural pressure. If incentives vanished, culture would too. |

  **Resolving your specific tensions:**
  *   **Why 2 (Islam) is Yes but 5 (SV) is No:** In Case 2, the norm *blocks* a standard financial tool (interest), creating friction. In Case 5, the norm *accelerates* a standard market behavior (growth), creating no friction.
  *   **Why 1 (Calvinists) is Yes but 5 (SV) is No:** In Case 1, the work ethic is a *byproduct* of salvation anxiety (unintended). In Case 5, the work ethic is a *requirement* of capital survival (structural).

  ---

  ### Prediction: Confucian Filial Piety & Qing Inheritance

  **The Case:** Does Confucian filial piety cause partible inheritance (dividing land among all sons) in Qing China, rather than primogeniture (eldest son inherits all)?

  **Application of the Principle:**
  *   **Independence Clause:** Can we measure "filial piety" independently of inheritance outcomes? Yes, through ritual texts, legal codes on elder care, and moral essays that exist separately from property records. **(Pass)**
  *   **Friction Clause:** Does partible inheritance contradict material rationality? Economically, primogeniture preserves estate scale and efficiency. Partible inheritance fragments land, potentially reducing productivity and family wealth over generations. If families chose fragmentation *despite* the efficiency cost to satisfy ritual obligations, that is friction. **(Pass)**

  **Prediction:** **Yes (Causal), but highly contested.**
  Under your principle, this looks like a causal case similar to Islamic *riba*. The value (piety) constrains the material choice (estate consolidation).

  **However, here is the literature reality check:**
  *   **Settled:** It is settled that Qing China practiced partible inheritance and had strong filial norms.
  *   **Contested:** Historians (e.g., Philip Huang vs. Kathryn Bernhardt) debate whether partible inheritance was driven by *piety* or by **risk-pooling strategies**. In a precarious agrarian economy, giving all sons a stake ensures someone can support the parents. If "piety" is just the moral language used to justify a survival strategy, it fails the **Friction Clause** (it's actually materially rational).
  *   **Verdict:** Your principle forces you to dig for evidence of *inefficient* inheritance driven by piety. If you find families impoverishing themselves to divide land equally when consolidation would have saved them, it's causal. If you find division correlates with economic security, it's likely functionalist (Case 5 style).

  ---

  ### Settled vs. Contested in the Literature

  You asked for honesty about the state of the field. Do not treat your "Yes" cases as settled facts; they are methodological ideals often debated empirically.

  1.  **Weber's Calvinists (Case 1):**
      *   **Status:** **Highly Contested.**
      *   **Debate:** While your *logic* is sound (values as independent constraints), historical economists (e.g., Blum, Kocka) argue Catholic regions often industrialized just as fast. The "causality" is accepted as a *theoretical model* of how culture works, but the *historical claim* is disputed.
  2.  **Islamic Finance (Case 2):**
      *   **Status:** **Contested.**
      *   **Debate:** Scholars like Timur Kuran argue *riba* prohibitions were often circumvented (legal hiyal), making the "constraint" weak. Others argue it fundamentally shaped the lack of corporate longevity in the Middle East. The *mechanism* is plausible, but the *magnitude* is debated.
  3.  **Culture of Honor (Case 4):**
      *   **Status:** **Contested (Replication Crisis).**
      *   **Debate:** Nisbett's original experiments are classics, but recent replication efforts in psychology have struggled to reproduce the physiological effects. The survey data holds, but the "deep causal" claim is under fire.
  4.  **Japanese Harmony (Case 3):**
      *   **Status:** **Mostly Settled (as methodological warning).**
      *   **Debate:** Sociologists (e.g., Haley, Ramseyer) largely agree that "culture" explanations for low litigation often fail when control variables (cost, bureaucracy, incentives) are added. This is the "tautology trap" everyone agrees to avoid.
  5.  **Silicon Valley Hustle (Case 5):**
      *   **Status:** **Contested (Sociology vs. Economics).**
      *   **Debate:** Economists/Management scholars often treat culture as a **monitoring technology**. Even if it aligns with incentives, they argue internalized norms *reduce enforcement costs*, making them causal (a "Yes"). Your intuition (and critical sociology) treats this as ideology (a "No"). This is the biggest fault line.

  ---

  ### The Honest Limitation: Which Verdict Can't Be Accommodated?

  The **Principle of Non-Reductive Constraint** validates your intuitions perfectly, but it cannot accommodate a specific, legitimate sociological view: **Constitutive Culture.**

  Your principle assumes actors have pre-existing material interests (money, safety, efficiency) and culture either constrains them or doesn't. This works for *regulative* norms (rules).

  It fails on **constitutive** norms, where culture defines *what the interest is*.
  *   **Example:** If a Silicon Valley founder literally *does not value* leisure, but values "building" as an end in itself, the "Hustle" is not a constraint on their utility function; it *is* their utility function.
  *   **The Problem:** Your principle (specifically the Friction Clause) would classify this as **No** (because there is no friction between value and action). But a cultural sociologist would say **Yes** (because the preference itself is culturally constructed, not biologically given).
  *   **The Verdict You Lose:** You cannot accommodate the argument that **"Culture causes things by shaping preferences, not just constraining them."**
      *   If culture makes people *want* to work 80 hours (Case 5), your principle calls it "structural alignment."
      *   A preference-shaping theorist calls it "deep cultural causation."

  **Summary:** Your principle is excellent for filtering out bad, tautological explanations (Case 3) and ideology masquerading as culture (Case 5). But it is too strict to capture how culture constructs the *actors* themselves, not just their constraints. If you want to capture that, you have to allow a "Yes" for Case 5 under the theory of **Endogenous Preferences**, which your current intuition rejects.
