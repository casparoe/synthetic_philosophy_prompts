  6.  **Refining the "Negative-Space Contract":**
      *   Need to make sure this doesn't sound like standard figure-ground reversal. It needs to be about *identity constitution*. The void *is* part of the letter.
      *   *Crucial distinction:* It's not just that we see the void; it's that the *specific topology* of the void is what we recognize. The "aperture" of the 'a', the "counter" inside.
      *   *Why "Contract"?* Because it implies an agreement between maker and viewer. The maker shapes the void; the viewer agrees to read the void as structure.

