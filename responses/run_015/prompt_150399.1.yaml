      *   **Constraints:**
          *   Polished tone.
          *   About 8 minutes (roughly 1000-1200 words spoken at a normal pace).
          *   Must not reduce design to Platonic forms (appeal to designers).
          *   Must not collapse recognition into pure convention (appeal to philosophers).
          *   Must not offer a false synthesis that explains nothing.
          *   **Key Conceptual Device:** "Negative-space contract." Identity is constituted by the shape of the absence around strokes. Breaking this contract causes failure, not altering the stroke itself.
          *   **Function of Device:** Honor designer's intuition (style lives in relation) + Satisfy philosopher's demand (non-arbitrary boundary without essentialism).
          *   **Direct Address:** Speak to each half of the room directly at least once.
          *   **Ending:** No conclusion. Instead, an invitation: Look at the "a" on the program cover. Spend one silent minute deciding if they perceive the black form first or the white absence first.
          *   **No Citations:** Argument must stand on its own.

  2.  **Deconstruct the "Negative-Space Contract":**
      *   *Idea:* We usually think of letters as ink on paper (positive space). The prompt asks me to argue that the *white space* (negative space) is equally constitutive of the identity.
      *   *Mechanism:* It's a "contract" because it's culturally learned but perceptually mandatory. We agree to see the void as part of the shape.
      *   *Explanation Power:*
          *   For Designers: Style isn't just stroke width or serif shape; it's how the stroke manipulates the void. A script 'a' and a geometric 'a' share a relationship with their surrounding void, even if the ink differs.
          *   For Philosophers: It provides a boundary condition. If you distort the ink but keep the void's topology intact, it's still an 'a'. If you disrupt the void's specific topology (the contract), it fails, regardless of convention. This avoids "essential ink" and avoids "anything goes convention."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the split audience. Set the stage. The question of the "a".
      *   **The Problem:** The tension between infinite variation and stable recognition. The trap of Platonism vs. the trap of Convention.
      *   **Addressing Designers:** Acknowledge their craft. Reject the idea that their work is just decorating a hidden ideal.
      *   **Addressing Philosophers/AI:** Acknowledge their rigor. Reject the idea that recognition is just statistical probability or social agreement.
      *   **Introducing the Device:** The "Negative-Space Contract." Define it clearly.
      *   **Developing the Device:** How it works. The counterform is not background; it is structure.
      *   **Application:** How this solves the workshop's central problem. Why some distortions kill legibility (they break the void) and others don't (they preserve the void).
      *   **The Invitation:** The program cover exercise. Silent minute. Black vs. White.

  4.  **Tone and Style:**
      *   Polished, academic but accessible.
      *   Engaging, slightly provocative (challenging both sides).
      *   Rhythmic (for speech).
      *   Word count check: 8 minutes is roughly 1000-1200 words. I need to ensure I don't ramble.

  5.  **Drafting - Iteration 1 (Mental Outline):**
