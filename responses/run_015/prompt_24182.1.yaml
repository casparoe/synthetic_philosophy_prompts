  hey so im in a grad seminar on bayesian epistemology this term and im trying to pin down a topic for a term paper (roughly 5k words, one semester). ive been thinking about the problem of old evidence and i have this half-baked idea i want help turning into a proposal.

  the setup: old evidence (like the precession of mercury's perihelion, already known before gr) doesnt seem to confirm a new hypothesis (gr) in a naive bayesian way, because if you already know e then p(e) = 1 and the likelihood ratio is 1. but we obviously think old evidence confirms. the standard fixes are the explanatory account (e confirms h if h explains e) and various bayesian tweaks.

  my half-formed hunch (and i might be wrong here): i think the explanatory account is doing more heavy lifting than its defenders admit, and the real issue might be a total-evidence problem — if e is already in the agent's total evidence, then p(e | h, total evidence) = 1 no matter what, so e doesnt confirm h regardless of whether h explains e. if thats right, then the explanatory account doesnt actually solve the problem, it just sidesteps it. i want to explore whether the explanatory account is a genuine solution or not, and if not, what the real fix is. i have a vague sense that the fix is some kind of bayesian account that uses a measure of confirmation that can handle the total-evidence problem, but i dont know what that measure would be or whether it even exists.

  can u help me turn this into a proposal? i need: a precise statement of the question, why the existing positions (the explanatory account and the bayesian tweaks) leave it open, the approach i'd take and why that approach rather than the obvious alternatives, what a result would look like and what would count as the project failing, and a realistic scope for a semester. dont bother with citations or a reading list, i'll fill those in myself.
