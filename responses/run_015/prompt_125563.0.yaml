answer: |-
  The framing of "asymmetric explanatory reduction in institutional path dependence" is not confused. It successfully isolates a specific tension within social ontology: the gap between ontological individualism (the regime is composed of individuals) and explanatory holism (the regime's history constrains individuals in ways micro-counterfactuals cannot capture). This is distinct from standard macro-correlation problems because it invokes dynamic locking mechanisms and counterfactual failure at the micro-level, rather than mere statistical aggregation. Proceeding with the ranking is appropriate.

  ### Ranking and Defense

  **1. (i) Whether downward-causation claims in institutional contexts can be formalized without reifying social entities**
  **2. (ii) How to distinguish genuinely non-redundant social explanations from explanations that are merely computationally intractable at the individual level**
  **3. (iii) Whether methodological individualism can be reformulated to accommodate structural emergence if emergence is defined purely in terms of explanatory intractability rather than ontological novelty**

  **Defense of Ordering**

  The primary criterion for this ordering is **upstream dependency**, followed by **importance**, with **tractability** treated as a secondary constraint that should not dictate the agenda.

  **(i) is ranked first** because it addresses the metaphysical possibility of the phenomenon described in your framing. The prompt specifies that institutional regimes "constrain individual choices." Constraint is a causal notion. If downward causation is logically incoherent under ontological individualism (as per Jaegwon Kim's exclusion argument), then the "constraint" is merely metaphorical or reducible to micro-causal chains without remainder. Without resolving whether social structures can exert causal influence without being reified as distinct substances, any work on explanation (ii) or methodology (iii) lacks a grounded mechanism. If downward causation is impossible, the "asymmetric reduction" is purely epistemic; if possible, it may be ontological. This metaphysical gatekeeping makes it the most upstream problem. It is low in tractability—formalizing causation in social contexts is notoriously difficult—but high in importance. Philosophers must prioritize importance over tractability here; solving a tractable but downstream problem (like terminology) is useless if the foundational metaphysics is incoherent.

  **(ii) is ranked second** because it addresses the epistemological status of social explanations once the metaphysical ground is cleared. Even if downward causation is coherent, we need criteria to determine when a social explanation is *necessary* versus when it is merely a heuristic for complex micro-dynamics. This is upstream of (iii) because the reformulation of methodological individualism depends on whether "emergence" is a real explanatory feature or just a label for computational limits. This line of work is moderately tractable for philosophers, as it involves analyzing explanatory virtues (stability, unification, counterfactual support) rather than solving causal metaphysics or empirical modeling. Its position is contingent on (i); if (i) is resolved negatively (no downward causation), (ii) becomes the primary battlefield for defining the utility of social science.

  **(iii) is ranked third** because it is a methodological and terminological response to the findings of (i) and (ii). Reformulating methodological individualism is a policy decision about how to label scientific practice. If (i) shows downward causation is coherent and (ii) shows social explanations are non-redundant, then methodological individualism may need abandonment rather than reformulation. If (ii) shows social explanations are just intractable micro-explanations, then methodological individualism remains true in principle. Thus, (iii) is downstream. It is highly tractable (conceptual engineering) but less important than establishing the truth conditions of causation and explanation. Prioritizing this would be putting the cart before the horse.

  **Conditions for Revision**

  *   **Revision for (i):** If a consensus emerges that "downward causation" is a category mistake in social science—replaced successfully by a model of "contextual causation" or "boundary conditions" that dissolves the exclusion problem without formalization—then (i) loses its urgency. In that case, (ii) would move to first place, as the metaphysical hurdle would be cleared by dissolution rather than solution.
  *   **Revision for (ii):** If computational social science demonstrates that all instances of institutional path dependence are simulatable at the individual level without loss of predictive power, the distinction between "non-redundant" and "intractable" collapses empirically. This would render (ii) obsolete and elevate (iii), as the only remaining task would be reconciling methodology with this empirical finding.
  *   **Revision for (iii):** If the philosophical community abandons "methodological individualism" as a label entirely in favor of "mechanismic explanation" or similar frameworks, (iii) becomes irrelevant. Its ranking depends on the continued viability of the MI vs. Holism debate as a framing device.

  **Trade-offs**

  In this agenda, **importance wins over tractability**. Philosophers of science are uniquely positioned to tackle the metaphysical coherence of downward causation (i), whereas empirical researchers cannot solve it. While (i) is the least tractable, leaving it unresolved renders progress on (ii) and (iii) potentially vacuous. Conversely, (iii) is the most tractable but the least consequential; focusing on it first would yield quick publications but no conceptual advancement. The ordering reflects a commitment to foundational clarity over methodological convenience.

  Verdict: I rank (i) first as the metaphysical prerequisite for coherent constraints, (ii) second as the epistemological filter for explanatory necessity, and (iii) third as a downstream methodological adjustment dependent on the resolution of the prior two.
