answer: |-
  You are right to be skeptical. Your professor is using a rhetorical shibboleth that masks significant doctrinal differences. In intellectual property law, the word "idea" is not a stable ontological category; it is a conclusion masquerading as a premise. When the professor says "you can't own an idea," he is shifting between statutory interpretation, policy justification, and economic description without signaling the switch.

  Here is a menu of four distinct precise claims that sentence could be asserting, ranked from the most trivial (tautological) to the most radical (metaphysical), with an evaluation of their truth value and their applicability to your three cases.

  ### 1. The Doctrinal Stipulation Reading
  **The Claim:** In the context of IP statutes and case law, the word "idea" is a term of art defined simply as "subject matter that the law has chosen not to protect."
  **Commitment:** This reading commits the speaker to nothing about the nature of ideas themselves. It merely asserts that within the legal system, there is a binary classification: protected expression/invention vs. unprotected "idea." To call something an "idea" is to already conclude it is unprotectable.
  **Verdict:** **Platitude.** It is legally true by definition, but analytically empty. It explains *that* the law distinguishes these things, but not *why*.

  *   **Case 1 (Patent/Business Method):** **Supports Conclusion.** Under 35 U.S.C. § 101, "abstract ideas" are ineligible for patents. If the court categorizes the matching method as an "abstract idea," it is unpatentable. The phrase accurately summarizes the doctrinal outcome.
  *   **Case 2 (Copyright/Plot):** **Supports Conclusion.** Under the *Idea-Expression Dichotomy*, copyright protects the text, not the underlying plot concepts. If the plot is categorized as the "idea," it is unprotected. The phrase accurately summarizes the doctrinal outcome.
  *   **Case 3 (Trade Secret/Recipe):** **Fails to Support Conclusion.** In trade secret law, the "idea" (the recipe) *is* the protectable subject matter, provided it is secret. The law does not stipulate that recipes are "ideas" in the excluded sense. The competitor wins not because the recipe is an unownable idea, but because the *secrecy* was lost through proper means. Using this reading here is legally incorrect.

  ### 2. The Specificity Threshold Reading
  **The Claim:** Legal ownership requires a specific, concrete embodiment (a text, a machine, a coded algorithm). General functions, themes, or informational contents are too broad to be monopolized without stifling all activity in that field.
  **Commitment:** This commits the speaker to a theory of *scope*. It asserts that property rights attach to the *instantiation* of a concept, not the *concept* itself. It acknowledges you can own a *book*, but not the *story*; a *machine*, but not the *function*.
  **Verdict:** **Substantive and Defensible Thesis.** This is the working engine of most IP law. It balances incentive creation against public access.

  *   **Case 1 (Patent/Business Method):** **Supports Conclusion.** The student proposed a "way of matching." If this is described as a high-level function without a specific technical implementation, it fails the specificity threshold (the *Alice* test). The phrase warns against claiming the function rather than the code.
  *   **Case 2 (Copyright/Plot):** **Supports Conclusion.** A plot summary is a generalization. The competitor wrote a *new* book (new expression) using the same general structure. The phrase correctly identifies that the novelist's ownership stops at the specific words, not the structural concept.
  *   **Case 3 (Trade Secret/Recipe):** **Fails to Support Conclusion.** A recipe is highly specific (grams, temperatures, steps). It meets the specificity threshold. The competitor is allowed to use it not because it is too abstract, but because trade secret protection evaporates upon independent discovery or reverse engineering. The phrase implies the subject matter is too abstract to own, which is false here.

  ### 3. The Innovation Commons Reading
  **The Claim:** Society *ought not* to allow ownership of foundational concepts because doing so would raise the cost of future creation and violate norms of free thought. Ideas are the building blocks of culture and technology and must remain in the public domain.
  **Commitment:** This is a normative, policy-based claim. It commits the speaker to the view that the *purpose* of IP law is to maximize future progress, even at the expense of the current creator's moral claim to their conception.
  **Verdict:** **Substantive Normative Thesis.** It is defensible (and widely held by legal realists), but it is a policy argument, not a description of current legal reality.

  *   **Case 1 (Patent/Business Method):** **Supports Conclusion.** Allowing a patent on "matching buyers and sellers" would prevent anyone else from creating a marketplace. The policy argument is that this basic economic concept should be free for all to innovate upon.
  *   **Case 2 (Copyright/Plot):** **Supports Conclusion.** If authors could own plots (e.g., "boy meets girl"), no new novels could be written. The policy requires that narrative archetypes remain free.
  *   **Case 3 (Trade Secret/Recipe):** **Ambiguous/Weak Support.** Trade secret law *already* balances this. It allows ownership of the recipe *while secret*, but sacrifices it to the "commons" once the product is sold and reverse-engineered. The phrase "you can't own an idea" suggests the recipe should *never* be ownable, which contradicts the existence of trade secret law. It oversimplifies the policy balance.

  ### 4. The Metaphysical Non-Excludability Reading
  **The Claim:** It is logically or economically impossible to treat information as property because ideas are non-rivalrous (my use doesn't diminish yours) and non-excludable (once known, they cannot be taken back). Therefore, "ownership" is a category error.
  **Commitment:** This commits the speaker to a radical economic or metaphysical view that property rights *only* make sense for scarce, physical resources. It implies that *no* legal regime (including patents or trade secrets) can truly "own" an idea, only regulate behavior around it.
  **Verdict:** **False (Legally).** While economically interesting, this is legally false. The law *does* create artificial excludability for ideas through patents and trade secrets. The law treats information as property for specific purposes.

  *   **Case 1 (Patent/Business Method):** **Supports Conclusion (Rhetorically).** It suggests the student is asking for something impossible. However, it ignores that patents *do* grant temporary ownership of functional ideas if they meet criteria.
  *   **Case 2 (Copyright/Plot):** **Supports Conclusion (Rhetorically).** It suggests the novelist is trying to control thoughts. But copyright *does* grant ownership of the expression of the idea, so the "impossibility" claim is exaggerated.
  *   **Case 3 (Trade Secret/Recipe):** **Actively Misleading.** This is where your intuition is strongest. Trade secret law *is* predicated on the ability to own information (the recipe) as long as it remains exclusive. The competitor wins not because ownership is metaphysically impossible, but because the *factual condition* of secrecy was broken. To say "you can't own an idea" here erases the legal reality that the company *did* own it until the reverse engineering occurred.

  ### Summary of the Professor's Rhetoric
  Your suspicion regarding the third case is correct.

  *   In **Cases 1 and 2**, the professor is using **Reading 1 or 2**. The law explicitly draws a line between protectable implementation and unprotectable concept. The phrase is a shorthand for "Your claim falls on the unprotectable side of the statutory line."
  *   In **Case 3**, the professor is likely slipping into **Reading 4**, or using the phrase to gloss over the specific doctrine of *improper means*. In trade secret law, you *can* own the "idea" (recipe). You lose protection only if the competitor acquires it via *proper means* (like reverse engineering). By saying "you can't own an idea," the professor implies the recipe was never protectable, which is false. The company had a property right; they just lost it when the product left the door.

  The phrase is a useful heuristic for Copyright and Patent eligibility, but it is a doctrinal error when applied to Trade Secrets. It conflates "subject matter eligibility" (Cases 1 & 2) with "loss of protection due to disclosure" (Case 3).
