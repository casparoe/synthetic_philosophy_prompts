answer: |-
  Friends, colleagues, family, and students.

  [Pause]

  Before I began writing this, I read a note [Name] left for me. It was short. It said: "When you stand up there, only say what you actually know. Don't tell them I'm at peace. Don't tell them I'm not suffering. You don't know that. And you know how I feel about asserting without knowledge."

  For those of you who knew [Name] professionally, you know this was not just a preference. It was his life's work. For the last fifteen years, he defended the view that you should only assert what you know.

  For those of you who knew him as a father, a partner, or a friend, this might sound like strictness. But I have come to understand it as a form of care. He believed that words carry weight, and that we owe each other the truth, not just comforting guesses. So, out of respect for him, and out of love for the honesty he valued so much, I am going to follow his rule today. Even though, as some of my colleagues know, I have spent twenty years arguing that he was wrong about this.

  Today, I concede the point.

  So, what do I know?

  I know that [Name] was the funniest person in almost any room he entered. I know he kept a physical drawer in his office filled with index cards, each written with a pun so terrible it was almost impressive. I know that if you visited him, he would make you pull a card and read it aloud. I know that my favorite one was, "I used to be a baker, but I couldn't make enough dough." I know that he laughed at his own jokes louder than anyone else.

  I know that he was a fierce debater. In twenty years of friendship, I know he never once conceded a point to me. Not one. I know that I wrote papers arguing that the norm of assertion is truth, and I know he read every single one of them and found them wanting. I know that our arguments were some of the best moments of my intellectual life. I know that I will never have that kind of sparring partner again.

  I know that he cared deeply about the students in this room. I know he graded papers on Sundays. I know he answered emails at midnight. I know that when a student struggled, he didn't offer them false hope; he offered them his time.

  Now, there are many things I would *like* to say, but cannot. I do not know if he is at peace. I do not know if there is a place where he is reading puns to an audience of angels. I do not know if the pain is gone. To say those things would be to offer you speculation, and [Name] would have been the first to tell me that speculation is not a solid foundation for grief.

  But here is what I *can* assert.

  I know that he is present in this room. I know that because I see his influence in the work of his colleagues, and I see his impact in the faces of his students. I know that the ideas he fought for are now part of the permanent record of our field. Ideas do not die when the thinker dies; they become public property. I know that his work will be read in twenty years by people who never met him, and they will know his mind through his writing.

  I know that grief is the price of attachment. I know that the pain we feel right now is evidence of the value of what we lost. I know that [Name] was worthy of this pain.

  To his family: I know that you loved him. I know that he loved you. I know that because I saw the way his face changed when he talked about you. I saw the photos on his desk. I heard the stories about your weekends. I am in a position to know that you were the center of his world. That is a fact. And facts remain.

  To his students: I know that you learned more from him than philosophy. I know you learned how to think rigorously and speak carefully. I know that is a tool you will keep for the rest of your lives.

  I am a philosopher who believes that truth is the goal of assertion. But today, I am trying to speak my friend's language. I am trying to adhere to his standard. Because I know that the greatest tribute I can pay to a man who spent his life guarding the boundaries of knowledge is to not cross them now, even for the sake of comfort.

  I do not know where he is. But I know where he was. He was here. He was our friend. He was our colleague. He was the one who made us think harder and laugh louder.

  I know that I miss him. I know that we all do. And I know that missing him is a way of keeping him close.

  Thank you.
