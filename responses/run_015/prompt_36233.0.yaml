  ### Part 4: The Tie-Breaker Case

  To determine which rule is *really* driving her (The **Hostility Rule** vs. The **Legitimacy Rule**), you need a case that pits **State Authority** against **Benevolent Intent**.

  **The Case:** **Force-feeding a hunger-striking prisoner.**

  *   **The Setup:** A prisoner refuses food to protest. The State inserts a tube to feed them against their will to prevent death.
  *   **The Split:**
      *   **If she says Violence:** She is prioritizing the **Legitimacy Asymmetry**. The State is inflicting physical intrusion and suffering. "The state doesn't launder it." The lack of benevolent intent (it's about order, not health) makes it violent.
      *   **If she says Not Violence:** She is prioritizing the **Hostility/Intent Rule**. The goal is to *save* life (Medical/Benevolent), not harm it. Like the School Caning ("for your own good"), the physical violation is excused by the protective intent.

  This splits her "Execution" rule (State Killing = Bad) from her "Caning" rule (Authority Correction = Okay). Force-feeding is State Action that is Life-Saving. If she calls it violence, she hates State Coercion most. If she doesn't, she hates Hostile Intent most.

