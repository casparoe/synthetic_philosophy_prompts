  ### Part 5: Untangling Per-Capita vs. Absolute Numbers

  Dana is stuck because she is conflating **Risk** with **Toll**. You can hand her this distinction:

  *   **Per-Capita Rates measure the *Safety of the System*.**
      *   This is what Pinker is arguing. If you are born today, what is the *probability* you will be a victim of violence? This number has gone down. The world is *safer*. This tells us about the *nature of the times*.
  *   **Absolute Numbers measure the *Scale of the Tragedy*.**
      *   This is Dana's intuition. If a war kills 10 million people, it is a bigger tragedy than a war that kills 10,000, even if the population was smaller back then. To the dead person, the rate doesn't matter. This tells us about the *magnitude of the suffering*.

  **The Synthesis:**
  Tell her: *"You're arguing about the body count; Pinker is arguing about the odds. Both are true. The world is a safer place to live (Per-Capita), but when it breaks, it breaks bigger (Absolute)."*

  This allows her to keep her moral intuition (death is bad, numbers matter) without rejecting the statistical reality (we are less likely to die violently). It resolves her silence by giving her two different buckets for the data.
