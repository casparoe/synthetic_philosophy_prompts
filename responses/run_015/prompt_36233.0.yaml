  ### Part 2: The Three Test Cases

  Here is how Dana will rule on your leftovers, based on the Doctrine above.

  **(1) Solitary Confinement (Modern Prison)**
  *   **Verdict:** **Violence.**
  *   **Reasoning:** This triggers the **Commission Rule** (deliberate act by guards/state) and the **Legitimacy Asymmetry**. Even though no one bleeds, it is the state inflicting suffering as a punitive measure. Since she believes "the state doesn't launder" executions, she will not let it launder psychological torture. It is punitive, not corrective (like caning), and it is state-inflicted.
