  **(2) Drone Strike (1 Target + 4 Collateral)**
  *   **Verdict:** **Target = Violence. The Four = Not Violence.**
  *   **Reasoning:** The target's death is the *goal* (Hostility Rule = Violence). The four bystanders are **Collateral Damage**. To Dana, their deaths are structurally identical to the **Factory Smoke** or the **Car Crash**. They are foreseen byproducts of an action, not the action's primary intent. She distinguishes between *using* death as a tool (Siege/Target) and *accepting* death as a cost (Famine/Collateral).
  *   **Confidence:** Medium-High. (This is where the "Hostility Rule" gets strained, but fits her "Sin vs. Violence" distinction).

  **(3) Fraternity Hazing (Consensual, Hospitalized)**
  *   **Verdict:** **Not Violence.**
  *   **Reasoning:** This is the wildcard, but it leans toward the **School Caning** precedent. She ruled Caning as "not violence" because it was normalized within that specific social context ("just school back then"). She will likely view Hazing as a "ritual" or "folly" entered into by consent (however pressured). Because it is peer-to-peer (not State) and non-lethal (hospitalized, not dead), she will categorize it under "Stupidity" or "Ritual," similar to how she categorized Caning as "Discipline."
  *   **Confidence:** Medium. (This relies on her accepting Fraternity norms as valid "context" similar to 1900s School norms).

