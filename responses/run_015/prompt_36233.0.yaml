  ### Part 1: The Dana Doctrine (Her Hidden Rules)

  Dana isn't being inconsistent; she is running a three-tiered filter system. She distinguishes between **Acts**, **Omissions**, and **Sanctions**. Based on her verdicts, here are the three rules she is applying, in order of precedence:

  1.  **The Commission Rule (Agency):** Violence requires a direct, active agent inflicting harm.
      *   *Why:* This explains why the **Famine** (indifference/neglect), **Factory Smoke** (systemic byproduct), and **Car Crash** (accident) are *not* violence. To Dana, these are "sins" or "tragedies," but they lack a specific hand striking a blow. Violence is a verb someone *does*, not a consequence someone *allows*.
  2.  **The Hostility Rule (Intent):** Violence requires the harm to be the *means* or the *end*, not a side effect.
      *   *Why:* This explains the **Siege** (starvation is the weapon = Violence) vs. the **Famine** (starvation is the outcome of neglect = Not Violence). It also explains the **Drone Strike** logic you suspect she holds (more on that below). If the pain is instrumental to a goal (surrender, punishment, domination), it's violence. If it's collateral, it's not.
  3.  **The Legitimacy Asymmetry (The Contradiction):** Social/Educational authority can legitimize non-lethal force, but State authority cannot legitimize lethal force.
      *   *Why:* This is the trickiest part. She says **School Caning** is *not* violence because "that was just school back then" (Social/Educational Norm). But she says **Executions** *are* violence because "the state doesn't launder it" (Moral Absolutism on Killing).
      *   *The Synthesis:* She views **Discipline** (Caning) as distinct from **Punishment** (Execution). Discipline is for correction (acceptable within norms); Punishment is for retribution/termination (inherently violent).

  **Summary of her definition:** *Violence is the deliberate, hostile infliction of physical harm by an agent, unless it is historically normalized non-lethal discipline.*

