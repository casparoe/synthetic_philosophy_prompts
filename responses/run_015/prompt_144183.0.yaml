answer: |-
  Revealed preference theory is an empirical framework that collapses into a mere consistency check for welfare analysis because it cannot distinguish between a stable agent navigating changing constraints and a changing agent navigating stable constraints without relying on an untestable assumption of identity. I considered three paths to this conclusion: first, that revealed preference is a complete empirical theory of well-being; second, that it is merely a mathematical definition with no testable content; and third, that it is an empirical theory of behavior that requires an untestable assumption to support welfare claims. I commit to the third path, because the first ignores the vanishing-overlap problem and the second falsely denies that choice cycles can falsify the model.

  Your calculation of Ada's choices is correct and perfectly illustrates the structural limit of the theory. In Year 1, Ada could have bought bundle b or c but chose a, so she revealed she prefers a to both. In Year 2, she could have bought c but chose b, so she revealed she prefers b to c. This creates a consistent chain: a is better than b, and b is better than c. However, this chain only holds because the budget sets overlap; bundle b was cheap enough to be available in Year 1, and bundle c was cheap enough to be available in Year 2. The theory works here only because the prices did not change enough to make the previous choices impossible to afford. This is the vanishing-overlap problem: as price changes become larger, the old bundles become too expensive to be available in the new budget, and the new bundles were too expensive to be available in the old budget. When the budgets do not overlap, the data contains no information linking the two periods. You can observe Ada choosing a in Year 1 and c in Year 3, but without an overlapping bundle to act as a bridge, the data alone cannot tell you if she prefers a to c, or if her entire ranking of goods flipped between years.

  This leads directly to the distinction between behavior and welfare. The theory successfully predicts that Ada will not choose a bundle that costs more than her income if a cheaper bundle was previously chosen under similar conditions, provided the budgets overlap. This makes it an empirical theory because it can be proven wrong; if Ada chose c in Year 2 when b was available, the model would break. However, to move from "Ada chose c" to "Ada is better off with c," you must assume that the person choosing in Year 3 is the same person with the same standards as the person choosing in Year 1. This is the auxiliary assumption. The choice data proves consistency, but it does not prove stability. Without stability, saying Ada is "better off" in Year 3 is meaningless, because you are comparing the satisfaction of one person's desires in Year 1 to a different person's desires in Year 3. Therefore, revealed preference is an empirical theory saddled with an unverifiable auxiliary assumption when used for welfare judgments. It predicts choices correctly within overlapping regions, but it cannot validate the claim that well-being has increased across non-overlapping regions without assuming what it cannot prove.

  Someone might object that even if Year 1 and Year 3 do not overlap, we can simply observe Ada for many more periods at the new prices to pin down her ordering that way. This reply fails because it confuses precision with connection. Observing Ada for ten years at Year 3 prices would tell us exactly what she prefers in Year 3 with great certainty; it would map her current preferences in high resolution. But it still would not build a bridge back to Year 1. You would have a perfect map of the new territory and a perfect map of the old territory, but no way to know if the coordinates mean the same thing in both. To compare welfare across the change, you need a common metric, and the only common metric available is the assumption that her underlying tastes did not change. More data at the new prices eliminates noise within the new period, but it does not solve the structural disconnect between the old period and the new one.

  On my view, "utility" means a numerical index constructed to summarize consistent choice patterns, not a measure of human well-being. The weakest link in my argument is the claim that welfare judgments *require* stable preferences, because an opponent would argue that welfare is purely momentary. They would say that if Ada prefers c in Year 3, she is better off with c in Year 3 regardless of what she wanted in Year 1, rendering the stability assumption unnecessary for evaluating her current state.
