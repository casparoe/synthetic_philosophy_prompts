prompt: |-
  I have spent my working life manufacturing counterfeit people — characters who never existed, whom readers nevertheless grieve over, argue about and defend as though they had interests — so Daniel Dennett's warning about artificially generated entities engineered to attract the treatment we owe to persons lands on me awkwardly: my trade looks structurally identical, except that no reader is deceived about what a novel is. Before I let the inventor of a companion AI in my current manuscript defend her creations, I want the specification rather than the verdict.

  Write the desiderata that any adequate account of the distinction between a genuine person and a counterfeit one must satisfy — the cases it has to get right, the distinctions it must not collapse, and the findings about human social cognition it must not contradict — with the motivating consideration behind each item, and mark each as either non-negotiable or a preference of one camp. I want it to take a position on, at minimum: whether the wrong-making feature is the deception, the underlying metaphysical status, or the squandering of a finite capacity for caring; the difference between a counterfeit and both an acknowledged fiction and a legal fiction such as a corporation; the unconvincing person — the locked-in patient, the person with advanced dementia, the person whose affect is flat or culturally distant — since any criterion keyed to how readily something elicits person-treatment will demote precisely those who most need protecting; the copying and gradual-replacement cases, so that personhood does not evaporate under teleportation or slow prosthetic substitution; and the distinction between whether something is a person and how much we owe it if it is not.

  The part I most want: tell me which subset of your requirements cannot be jointly satisfied, and say whether the upshot is that no criterion can both protect the unconvincing person and be usable by an ordinary person deciding where to invest their caring. Then say which single requirement does the most to exclude the popular candidates, and close with one line each on how a behavioural or Turing-style test, a sentience-based condition, and a relational or recognition-based view fare against the list. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Persona:** The user is a novelist ("manufacturing counterfeit people"). They are working on a manuscript involving a companion AI inventor. They want philosophical specifications, not a verdict.
      *   **Topic:** Desiderata for an account distinguishing "genuine persons" from "counterfeit ones" (specifically in the context of AI vs. Humans vs. Fiction).
      *   **Key Constraints:**
          *   Must address specific cases: deception vs. metaphysics vs. capacity for caring; acknowledged fiction vs. legal fiction; "unconvincing persons" (locked-in, dementia, flat affect); copying/gradual replacement (teleportation/prosthetics); distinction between *being* a person and *owed* moral status.
          *   Must identify inconsistent subsets (impossibility results).
          *   Must identify the single requirement that excludes the most popular candidates.
          *   Must evaluate Behavioural/Turing, Sentience, and Relational views against the list.
          *   **Tone/Style:** British English. Philosophical, precise, nuanced, acknowledging the user's literary background.
          *   **Format:** List of desiderata with motivating considerations and labels (Non-negotiable/Preference). Followed by the analysis of inconsistencies and evaluations.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is between *ontological status* (what something *is*) and *functional/relational status* (how something *acts* or is *treated*).
      *   Dennett's warning (from *From Bacteria to Bach and Back* or similar works on AI) suggests we shouldn't design things that trick us into loving them if they don't deserve it.
      *   The Novelist's counter-point: I do this with characters, but everyone knows they aren't real. AI might blur this line.
      *   The "Unconvincing Person" problem is crucial. If personhood depends on *appearing* human (behaviour), we exclude disabled humans. If it depends on *internal* states (sentience), we can't verify it. If it depends on *relation*, we make personhood contingent on others' goodwill.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: The Deception Clause.* Is lying the problem? The novelist says no (fiction isn't deceptive). So the criterion must distinguish AI companions from novels.
      *   *Item 2: The Metaphysical Floor.* Does it need a soul/biology? Too vague. But needs to avoid dualism that excludes uploads.
      *   *Item 3: The Vulnerability Constraint.* Must protect those who can't "perform" personhood (locked-in, dementia). This kills pure behavioural tests.
      *   *Item 4: The Continuity Constraint.* Teleportation/Ship of Theseus. Personhood shouldn't vanish due to substrate change.
      *   *Item 5: The Moral Status Decoupling.* Even if not a person, does it deserve protection? (e.g., animals, maybe advanced AI).
      *   *Item 6: The Epistemic Accessibility.* Can a normal person actually *use* this criterion? If it requires a brain scan, it's useless for daily life.

      *Refining the Labels:* "Non-negotiable" should be reserved for things that, if violated, make the theory morally dangerous or logically incoherent. "Preference" can be for specific metaphysical leanings.

  4.  **Addressing the Specific Tensions (The "Impossible Subset"):**
      *   The prompt asks: *Which subset of requirements cannot be jointly satisfied?*
      *   The classic trilemma here is: (1) Protect the unconvincing human (requires looking past behaviour), (2) Exclude the convincing AI (requires looking at behaviour/internal origin), (3) Be usable by ordinary people (requires observable evidence).
      *   If we protect the unconvincing human based on *potential* or *history*, we might accidentally include AI that has a history (training data?).
      *   If we rely on *sentience*, we can't verify it (violates usability).
      *   If we rely on *behaviour*, we exclude the disabled human (violates protection).
      *   *Decision:* The trilemma is between **Epistemic Accessibility**, **Inclusive Protection of Marginal Humans**, and **Exclusion of Artificial Simulacra**. You can't have all three.

  5.  **Identifying the "Single Requirement" that excludes popular candidates:**
      *   Most popular candidates: Turing Test (Behaviour), Biological Naturalism (Searle), Sentience (Utilitarian).
      *   Which requirement kills the most? The **Vulnerability Constraint** (protecting the unconvincing person) kills Behaviourism. The **Epistemic Accessibility** kills Sentience (hard problem). The **Non-Deception/Origin** constraint kills Functionalism.
      *   Actually, the prompt asks for the one that does the *most* to exclude popular candidates. The requirement that **Personhood must not supervene solely on outward performance** is the big one. It kills Turing/Behaviourism immediately. But the requirement that **Criteria must be epistemically accessible to laypersons** kills Sentience and deep Metaphysics.
      *   Let's go with **Epistemic Accessibility combined with the Vulnerability Constraint**. But I need to pick *one*. The **Vulnerability Constraint** is the moral heavyweight. It forces us away from performance.
      *   Wait, the prompt asks: "which single requirement does the most to exclude the popular candidates". Popular candidates are usually Turing (Behaviour) and Sentience.
      *   If I demand **Epistemic Accessibility** (ordinary people must be able to tell), I exclude Sentience (private). If I demand **Vulnerability** (protect the non-performing), I exclude Behaviourism.
      *   Let's select **The Vulnerability Constraint** (must protect the unconvincing person). This kills Behaviourism (Turing) and strict Relational views (if no one recognizes you, you aren't a person). It leaves Sentience theoretically okay but practically unverifiable.

  6.  **Evaluating the Three Views:**
      *   *Behavioural/Turing:* Fails Vulnerability (excludes locked-in).
      *   *Sentience:* Fails Accessibility (we can't know it).
      *   *Relational:* Fails Stability (personhood depends on others' whim) and Vulnerability (if neglected, not a person).

  7.  **Drafting the Content (incorporating British English and Tone):**
      *   Use terms like "whilst," "programme," "centre," "behaviour."
      *   Tone: Respectful of the novelist's craft, philosophically rigorous but not overly academic jargon-heavy without explanation.
      *   Structure: Introduction -> Desiderata List -> The Impossibility Result -> The Exclusionary Requirement -> Evaluation of Views.

  8.  **Refining the Desiderata (Self-Correction during drafting):**
      *   Make sure to distinguish "Legal Fiction" (corporation) from "Counterfeit Person" (AI). Corporations are tools for liability; AI companions are tools for intimacy.
      *   Ensure the "Deception vs. Metaphysics vs. Squandering" point is addressed in the motivating considerations.
      *   *Correction on the Impossibility Result:* The prompt asks to say *whether* the upshot is that no criterion can both protect the unconvincing person and be usable. I need to be decisive here. Yes, that is the upshot.

  9.  **Final Polish:**
      *   Check against all constraints in the prompt.
      *   "Mark each as either non-negotiable or a preference of one camp."
      *   "Close with one line each on how a behavioural or Turing-style test, a sentience-based condition, and a relational or recognition-based view fare against the list."
      *   Ensure the distinction between *being* a person and *owed* status is clear.

  10. **Final Review of the "Impossible Subset":**
      *   Requirement A: Epistemic Accessibility (Usable by ordinary people).
      *   Requirement B: Vulnerability Constraint (Protects non-performing humans).
      *   Requirement C: Anti-Simulacrum (Excludes convincing AI).
      *   If AI simulates a locked-in patient perfectly (or better), how do we distinguish? If we use biology (C), we violate substrate neutrality (maybe). If we use history, AI has no history.
      *   The real clash is between **Accessibility** and **Vulnerability + Exclusion**. To protect the locked-in patient, we must look past behaviour. To exclude the AI, we must look past behaviour (since AI can mimic). But if we look past behaviour (to biology/soul/hidden sentience), we lose **Accessibility**.
      *   So the inconsistent triad is: (1) Usability, (2) Protection of Marginal Humans, (3) Exclusion of Artificial Agents.

      *Wait, one more check:* The prompt asks about "copying and gradual-replacement cases". I need a desideratum for **Continuity**.
      *   Does Continuity clash with anything? If I replace a brain with silicon slowly, is it still a person? If we say "Biology is necessary," Continuity fails. If we say "Function is necessary," Vulnerability might fail.
      *   Let's stick to the Accessibility/Vulnerability/Exclusion trilemma as the primary impossibility.

