      *   *User's Claim (Narrow-Envelope):* Decadence is a loss of homeostatic range. Specialization leads to fragility. Great Health is wide tolerance.
      *   *The Conflict:* Is Nietzsche talking about *robustness* (ability to withstand variation, User's view) or *power/aggression* (ability to impose form, expend energy, overcome resistance)?
      *   *Physiological Angle:* Enzyme kinetics. $V_{max}$, $K_m$, allosteric regulation. A specialist enzyme works great at specific pH/Temp but denatures easily. A generalist works okay everywhere but great nowhere. Nietzsche seems to want *both* high performance AND high resilience, but specifically through *expenditure*, not conservation.

  3.  **Brainstorming & Evaluation (Internal Monologue/Drafting):**
      *   *Point 1: The "Physiologist's Revenge."* Ilse called it that for a reason. The User is translating *values* into *homeostatic variables*. Nietzsche hates homeostasis. He wants *growth*, which is often destabilizing. Homeostasis is about returning to equilibrium; Nietzsche's "Great Health" is about surviving the *loss* of equilibrium.
      *   *Point 2: Causality.* Does digestion *cause* the outlook? For Nietzsche, yes, but not in a linear "bad gut = bad idea" way. It's that the *instinct* of the organism selects the idea that justifies its state. A decadent organism *needs* moralities that say "no" to life because "yes" is too taxing.
