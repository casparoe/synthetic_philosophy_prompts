answer: |-
  Distinguish the action you can choose now from the outcome you cannot guarantee, and commit your effort only to the action.

  ### The Procedure (20 Minutes)

  **Preparation:** Client writes down their six worries. Therapist draws two circles on a flipchart: Left Circle labelled "My Choice & Effort," Right Circle labelled "Outcomes & Others."

  **Step 1: The Arousal Check (2 Minutes)**
  *   **Question:** "On a scale of 0 to 10, how high is your physical panic or distress right now?"
  *   **Adequate Answer:** A number between 0 and 6.
  *   **Stop Point:** If 7 or above, **withdraw the tool.** Proceed with grounding or soothing rhythm breathing. This tool requires cognitive bandwidth; high arousal indicates the brain is in threat mode, not reasoning mode.
  *   **Design Note:** This addresses the volition constraint. You cannot choose assent during a panic attack; you must regulate physiology first.

  **Step 2: The Location Sort (5 Minutes)**
  *   **Question:** "For each worry, is the thing you are worried about happening inside your skin (your thoughts, feelings, intentions) or outside your skin (other people's actions, future events, reputation)?"
  *   **Adequate Answer:** Specific placement. E.g., "My anxiety is inside; the panel's decision is outside."
  *   **Stop Point:** If the client insists a physical sensation (e.g., heart racing) is "outside" or "not up to me," **pause.** Label this as a physiological response to be managed, not a moral failure.
  *   **Action:** Place items strictly inside the Left Circle. Place items strictly outside in the Right Circle.
  *   **Design Note (The Rings):** Do **not** use a middle "Influence" ring. Influence is clinically seductive but philosophically misleading; it suggests you control the *result* of your influence. Instead, place "Influence" activities (e.g., preparing for a panel) in the Left Circle (Effort), and the *result* of that influence (e.g., getting the job) in the Right Circle (Outcome). You lose the comfort of feeling "partially in control," but you gain clarity on where disappointment originates.

  **Step 3: The Action Test (5 Minutes)**
  *   **Question:** "For the items in the Right Circle (Outcomes), is there a specific action you can take in the next 24 hours that moves toward a preferred result?"
  *   **Adequate Answer:** A concrete behaviour. E.g., "Email HR," "Practice interview," "Call son."
  *   **Stop Point:** If the answer is "Think about it," "Worry about it," or "Check Google," **correct this.** These are not actions; they are symptoms of anxiety.
  *   **Action:** Move the *action* to the Left Circle. Keep the *outcome* in the Right Circle.

  **Step 4: The Reservation Clause (5 Minutes)**
  *   **Question:** "If you take this action, does it guarantee the outcome you want?"
  *   **Adequate Answer:** "No." (If they say "Yes," challenge them gently until they admit uncertainty).
  *   **Action:** Have the client write their plan down with the suffix: *"...if nothing prevents it."* (This embodies the Stoic *hupexairesis*).
  *   **Instruction:** "You commit to the action. You release the outcome. If the outcome fails, your effort remains good."
  *   **Design Note (Timescale):** This distinguishes immediate choice (action) from long-term training (resilience). If the client asks, "But how do I stop caring about the outcome?", answer: "You don't stop caring today. You train that over months. Today, you just choose the action."

  **Step 5: The Value Hand-Back (3 Minutes)**
  *   **Question:** "Is taking this action consistent with your safety and integrity, or does pursuing it require you to tolerate harm?"
  *   **Adequate Answer:** A clear statement of values. E.g., "It is consistent," or "I need to protect myself."
  *   **Decision Point:** If the client suggests that "accepting fate" means tolerating abuse, injustice, or unsafe conditions, **hand the decision back.**
  *   **Script:** "This tool is for managing anxiety about outcomes, not for deciding what is right. Whether you report harassment is a values decision, not a control decision. Stoicism demands you act justly, not quietly."
  *   **Design Note (Grief):** **Bracket grief.** If a worry is "I am grieving my father," this procedure does not apply. Grief is not a "worry about the future" to be solved by action; it is a present pain to be witnessed. Do not classify grief as "up to us."

  **Step 6: The Usage Limit (Closing)**
  *   **Instruction:** "Use this sheet once per day. If you find yourself re-sorting the same worry more than twice, stop and tell me."
  *   **Reason:** This prevents the tool from becoming a checking ritual (OCD-like).

  ---

  ### Worked Cases

  **Case 1: The Promotion Panel**
  *   **Input:** "I'm worried I won't get the job."
  *   **Step 2 (Location):** Panel's decision → Right Circle (Outcome). My preparation → Left Circle (Effort).
  *   **Step 3 (Action):** "I can practice my answers tonight."
  *   **Step 4 (Reservation):** "Does practicing guarantee the job?" → "No." → Plan: "I will practice tonight, *if nothing prevents it*."
  *   **Result:** Client validates effort, releases outcome. Anxiety reduces because the metric of success shifts from "Did I get it?" to "Did I practice?"
  *   **Outcome:** Procedure works as intended.

  **Case 2: The Son's Drug Use**
  *   **Input:** "I can make him stop" oscillating with "Nothing I do matters."
  *   **Step 2 (Location):** Son's drug use → Right Circle (Outcome/Other). Client's boundaries/support → Left Circle (Effort).
  *   **Step 3 (Action):** "I can stop lending him money" and "I can attend a family support group."
  *   **Step 4 (Reservation):** "Does stopping money guarantee he stops drugs?" → "No." → Plan: "I will stop lending money, *if nothing prevents it*."
  *   **Correction:** Client often tries to put "Make him stop" in the Left Circle. Therapist must hold the line: "You control the offer of help, not his acceptance of it."
  *   **Result:** Breaks the oscillation. The client is not responsible for the son's recovery (Outcome), only for their own boundaries (Effort).
  *   **Outcome:** Procedure reduces guilt and clarifies agency.

  **Case 3: The Colleague's Harassment**
  *   **Input:** "It is not up to me what he does, so I must accept it." (Quietism).
  *   **Step 2 (Location):** His behaviour → Right Circle. My response → Left Circle.
  *   **Step 3 (Action):** Client suggests action is "Stay silent to keep peace."
  *   **Step 5 (Value Hand-Back):** **Triggered.**
  *   **Therapist Intervention:** "You are correct that his behaviour is not up to you. But your safety and dignity are up to you. Using 'acceptance' to tolerate harassment is not Stoic resilience; it is self-abandonment. The action 'Report this' belongs in the Left Circle. The outcome 'He gets fired' belongs in the Right."
  *   **Uncomfortable Truth:** The procedure reveals the client is using the Dichotomy of Control to avoid conflict, not to manage anxiety. The "Acceptance" circle is being used as a hiding place. The therapist must challenge this: "Stoics stood for office and faced tyrants. Acceptance is for what *cannot* be changed, not for what *should not* be tolerated."
  *   **Outcome:** Client moves "Report HR" to Left Circle. Anxiety may temporarily increase (due to facing conflict), but wellbeing improves due to aligned values.

  ---

  ### Limitations and Contraindications

  **Presentations on which this must not be used:**
  1.  **Obsessive-Compulsive Disorder (OCD):** If the client has a history of checking rituals, this procedure will become a ritual. The question "Is this up to me?" becomes the compulsion. Use only with strict supervision and a hard "once per day" limit.
  2.  **Acute Trauma/Grief:** Do not use for processing past trauma or active bereavement. Framing grief as a "judgement" or "choice" is invalidating and potentially harmful. This tool is for *worry*, not *pain*.
  3.  **Oppressive Contexts:** If a client is in an abusive relationship, poverty, or systemic discrimination, "what is up to us" may be dangerously limited. Do not imply they have choice where they have none. Use only to identify safe exits or support networks, never to suggest they control the oppressor.
  4.  **Psychosis/Delusions:** If the client believes external events are directly controlled by their thoughts (ideas of reference), this procedure reinforces magical thinking.

  **Points requiring clinical judgement (no structuring removes this need):**
  1.  **Distinguishing Acceptance from Resignation:** The trainee must judge when "acceptance" is healthy adaptation and when it is depressive hopelessness. The procedure flags this in Step 5, but the therapist must interpret the answer.
  2.  **Physiological Capacity:** The trainee must judge when a client is too aroused for cognitive work (Step 1). If in doubt, regulate first.
  3.  **Values Conflicts:** When a client's "action" conflicts with safety or ethics (Case 3), the trainee must override the client's classification. The procedure hands the decision back, but the therapist must ensure the hand-back is safe.
