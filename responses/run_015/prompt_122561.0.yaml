  2.  **Deconstruct the Stoic Theory vs. Clinical Reality:**
      *   *Epictetus:* What is "up to us" (*eph' hēmin*) is specifically *prohairesis* (moral choice/volition/assent). Everything else (body, reputation, health, others) is "not up to us" (*ouk eph' hēmin*).
      *   *Modern CBT/Stoic Hybrid:* Often simplifies to "Control vs. No Control."
      *   *The Trap:* If I tell a client "Your grief is up to you," they feel invalidated. If I tell them "Your promotion is partly up to you," they obsess over the partial bit.
      *   *The Solution:* A procedural filter that distinguishes *agency over action* from *agency over outcome*, and distinguishes *immediate assent* from *long-term training*, while validating the reality of external constraints.
      *   *The Three Rings:* The user asks whether to keep the middle ring. Strict Stoicism says no (influence is still not "up to us" in the strict sense). Clinical utility says yes. *Decision:* For a 20-minute PWP procedure, the strict dichotomy is too brittle for "influence" cases (promotion, son's drugs). However, the *Stoic point* is about where you place your *good*. If you place your good in the "influence" ring, you suffer. If you place your good in your *effort* within that ring, you are safe. I need to refine the "middle ring" not as "control" but as "preferred indifferents" where effort is applied but outcome is released.
      *   *Grief:* Bracket it. Telling a distressed client grief is a choice is clinically unsafe and philosophically nuanced (propatheia vs. assent).
      *   *Checking Ritual:* Need a "stop rule" if the question itself becomes the worry.

  3.  **Drafting the Core Sentence:**
      *   Needs to be memorable for trainees.
      *   Needs to capture the shift from outcome to agency/assent.
      *   *Draft 1:* Ask clients to separate what they can choose now from what they must accept later. (Too vague)
