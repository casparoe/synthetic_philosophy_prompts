      *   *Case 3 (Harassment):* Client says "Not up to me" -> Quietism. Stoicism says "Justice is up to me." Procedure must flag this as a Value/Justice issue, not just control. This is the "uncomfortable truth" the user suspects. The procedure should reveal that *inaction* is also a choice with moral weight.

