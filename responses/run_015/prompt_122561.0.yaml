      *Refining Grief:* Bracket it. Explicitly state this tool is for *worry about future/outcomes*, not *processing present pain*.
      *Refining Volition:* Distinguish "Can I choose this *now*?" vs. "Can I train this *over time*?"

  5.  **Drafting the Steps:**
      1.  **List:** Write the 6 worries.
      2.  **Q1 (The Body/External Test):** Is this inside your skin or outside? (If outside -> Go to Q2).
      3.  **Q2 (The Action Test):** Is there a specific action you can take *in the next 24 hours*? (If no -> Acceptance work. If yes -> Go to Q3).
      4.  **Q3 (The Outcome Test):** Does doing this action *guarantee* the result you want? (If yes -> Rare, proceed. If no -> Crucial Stoic shift: Commit to action, release outcome).
      5.  **Q4 (The Cost Test):** Is pursuing this costing you your integrity or health? (If yes -> Value handback).
