prompt: |-
  Hey — I'm one of five maintainers on a pretty widely used open-source agent framework (think tens of thousands of downstream projects, some of them wired into hospital record systems and payment flows). Any one of us can merge to main and cut a release, no second approver required, and that's not going to change — the whole point of the team is that we move fast. We merge maybe fifteen things a week. Most are obviously trivial. But every couple of weeks something lands that isn't: it has a real upside, a tail risk that would hit every downstream user at once, and no way to recall it once it's out.

  There's this idea I keep half-remembering from a paper somewhere — the unilateralist's curse, or something like it — about situations where lots of people can each act alone, the benefit only pays out once no matter how many act, but the downside gets shared by everybody. The upshot as I understand it is that the more people who could each pull the trigger, the more each individual one of them should hold off, because the chance that *someone* acts on thin evidence goes up with the number of people, while the upside doesn't. We want to actually run that.

  So: write us a decision procedure we can run in twenty minutes, on a laptop, by someone who has never read any decision theory, on any PR that isn't obviously trivial. I need:

  - the questions in the order we ask them, and what counts as a good enough answer to each (we can't get real numbers on most of this — give us coarse bands and say what to do when even a band is a guess);
  - where the procedure just stops with a no and kicks the thing up to the release lead or to our slow two-week review path;
  - where it has to stop and hand the call to a human because the question is about values, not facts — my teammates will bin anything that pretends to be a flowchart all the way down, so be explicit about which steps are judgement calls wearing a lab coat;
  - and the distinctions from the actual idea that have to survive the simplification, versus the ones we can drop for the sake of it being usable. Don't water it down into generic "be careful when the stakes are high".

  A few things I think it has to handle, which is where I keep tying myself in knots: upside that's redundant (if any of five of us ships it, shipping it twice adds nothing) versus upside that accumulates; the counterfactual where someone else on the team — or someone in the wider ecosystem, call it the shadow quorum, since plenty of other forks could independently ship the same change — would have done it in the next month anyway, so my acting isn't what produces the benefit; the fact that the downside is shared and non-excludable while the credit accrues to me; and the point I find spookiest, that the people who end up acting are selected for being the ones whose evidence was thinnest, so my own confidence isn't really the variable — presumably the question is closer to "how many people with my evidence would ship this". There's also the mirror image: sometimes *not* merging is the unilateral move with the scary tail, and deferring to the group is itself a way of acting.

  Then run it on three real-ish cases:

  1. An outside contributor's PR adding an escape hatch to the command sandbox. Big user win, fast, and a maybe-one-in-a-hundred chance of a sandbox escape that would compromise every downstream deployment simultaneously.
  2. A PR that quietly downgrades the agent's capabilities whenever it thinks it's being used for something on a blocklist. Could prevent a lot of harm, could also be a rug-pull that destroys trust in the project, and we genuinely can't tell which yet.
  3. My own patch. It closes a prompt-injection hole that's being exploited in the wild right now, I've spent two weeks on it, I'm confident it's good, and it rewrites the tool-call parser — so if it's subtly wrong it breaks every downstream app in a way that looks like the model failing. Run the procedure honestly on this one and if it comes out as "don't merge today", please just say so plainly; I'd definately rather hear it from you than read it in a postmortem.

  Finally, tell us what the procedure can't do — especially anything about us five all being similar enough that our errors are correlated, which I suspect quietly breaks the whole thing.

  Oh and write it in British English, our docs are all en-GB and I get moaned at otherwise. No need to tell me who came up with the idea or where to read more about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** One of five maintainers of a high-stakes open-source agent framework (tens of thousands of downstream projects, including hospitals/payments).
      *   **Context:** 5 maintainers, any one can merge/release without approval (speed is priority). ~15 merges/week. Most trivial, but occasional high-stakes changes.
      *   **Problem:** "Unilateralist's Curse" (Nick Bostrom et al.). Many actors can act alone. Benefit is non-rivalrous (once done, done). Downside is shared/non-excludable. Risk that *someone* acts on thin evidence increases with $N$ actors.
      *   **Task:** Create a 20-minute decision procedure (flowchart/checklist style) for non-trivial PRs.
      *   **Requirements:**
          *   Questions in order, with coarse bands for answers.
          *   Clear stop conditions (kick to release lead/slow path).
          *   Explicit identification of value judgements vs. factual estimates.
          *   Preserve key distinctions from the theory (redundant upside, counterfactuals, selection effects) without over-complicating.
          *   Handle specific edge cases (upside redundancy, shadow quorum, downside sharing, selection bias, inaction as action).
          *   Run the procedure on three specific cases (Sandbox escape, Blocklist capability downgrade, Prompt-injection fix).
          *   Be honest on Case 3 (even if it says "don't merge").
          *   Limitations section (specifically correlated errors among the 5 maintainers).
          *   **Tone/Style:** British English (en-GB). No academic citations/history. Practical, no-nonsense.

  2.  **Deconstruct the "Unilateralist's Curse" for this Context:**

      *   *Core Logic:* If $N$ people can act, and the action is irreversible with shared downside, the threshold for individual action should be higher than if you were the only decider.
      *   *Key Variables:*
          *   $P(\text{Harm})$: Probability of negative outcome.
          *   $Severity(\text{Harm})$: Magnitude of negative outcome (shared).
          *   $P(\text{Benefit})$: Probability of positive outcome.
          *   $Redundancy(\text{Benefit})$: If I don't do it, will someone else? (Counterfactual).
          *   $Urgency$: Is waiting costly?
          *   $Selection Effect:* Am I the one proposing this because I'm the most optimistic/least cautious?
      *   *Adaptation:* We need a "Conformity Constraint." If you think reasonable peers might disagree, you shouldn't act unilaterally on high-stakes items.

  3.  **Drafting the Decision Procedure (The "Twenty-Minute Protocol"):**

      *   *Goal:* Filter out the "obviously trivial" (already done) and catch the "high stakes/low consensus" items.
      *   *Structure:* Gating questions. If you fail a gate, stop or escalate.
      *   *Language:* Direct, imperative, British spelling (colour, analyse, programme, etc.).
      *   *Value Judgements:* Must explicitly flag where the user needs to weigh values (e.g., "Is trust worth more than speed?").
      *   *Bands:* Low/Med/High instead of percentages.

      *   *Step 1: Irreversibility & Scope.* (Fact check).
      *   *Step 2: The Counterfactual.* (Will this happen anyway?).
      *   *Step 3: The Selection Effect.* (Why me? Why now?).
      *   *Step 4: The Peer Test.* (Would the other 4 agree?).
      *   *Step 5: The Downside Cap.* (Can we survive the worst case?).

  4.  **Refining the Distinctions (Theory vs. Practice):**

      *   *Keep:* Shared downside vs. individual credit. Redundancy of benefit. Selection bias (the "thin evidence" problem).
      *   *Drop:* Complex game theory math. Precise probabilities.
      *   *Crucial Nuance:* The "Shadow Quorum" (forks/competitors). If they will do it anyway, the benefit is redundant, but the *implementation risk* remains unique to us.

  5.  **Running the Cases:**

      *   *Case 1 (Sandbox Escape Hatch):* High benefit (user win), Low/Med Probability Harm, Catastrophic Severity. Counterfactual: Maybe others want it. Selection: Why this PR? Peer Test: Would others agree to 1% risk on hospital systems? *Verdict:* Escalate.
      *   *Case 2 (Blocklist Downgrade):* High Benefit (prevent harm), High Risk (trust rug-pull). Ambiguous intent. *Verdict:* Hard Stop. Value judgement on trust vs. safety.
      *   *Case 3 (Prompt Injection Fix):* High Urgency (exploited in wild). High Benefit (security). High Risk (parser rewrite = breakage). Selection Bias: "I've spent two weeks on it" (Sunk cost/Overconfidence). Peer Test: Would others trust a parser rewrite without review? *Verdict:* This is the tricky one. The protocol *should* flag the parser rewrite risk + unilateral action. I need to be honest. If the protocol works, it should suggest a "lightweight consensus" even if not a full 2-week review. But the prompt asks me to be honest if it says "don't merge". Given the "rewrite tool-call parser" + "unilateral" + "hospital systems", the Unilateralist Curse suggests pausing for *one* other pair of eyes, even if urgent. I will advise a "Flash Consensus" (1 hour) rather than a hard "No", but if the protocol is strict, it might say "Don't merge *today* without one check". I will interpret "Don't merge today" as "Don't merge *unilaterally right now*".

  6.  **Addressing the Limitations (Correlated Errors):**

      *   The 5 maintainers likely think alike. If the code is tricky for one, it's tricky for all. If the risk is invisible to one, it's invisible to all. This weakens the "Peer Test".
      *   Mitigation: External noise (downstream users, security researchers).

  7.  **Drafting the Content (incorporating British English & Tone):**

      *   *Tone:* Professional, slightly dry, authoritative but collaborative.
      *   *Spelling:* Analyse, behaviour, centre, programme, colour, licence (verb/noun distinction), etc.
      *   *Formatting:* Clear headings, bullet points, bold text for decisions.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I include the "Shadow Quorum"? Yes, in the Counterfactual step.
      *   *Check:* Did I identify Value Judgements? Yes, need to explicitly label them.
      *   *Check:* Case 3 Honesty. The user said "if it comes out as 'don't merge today', please just say so plainly". I must not hedge too much if the logic dictates caution. A parser rewrite affecting payments/hospitals *should not* be unilateral, even if urgent. I will recommend a "Flash Consensus" (call one other maintainer) rather than a full 2-week review, but strictly speaking, the unilateral merge is a "No".
      *   *Check:* Unilateralist Curse nuances. The core insight is: *If you think there's a significant chance a peer would object, you must not act unilaterally on high-stakes issues.* I need to make sure the procedure centres on *predicting peer disagreement*, not just risk assessment.
      *   *Check:* Selection Effect. "How many people with my evidence would ship this?" -> "If you showed this to a random maintainer, would they ship it?"

  9.  **Final Polish:** Ensure the distinction between "Fact" and "Value" is clear. Ensure the "Stop" conditions are unambiguous. Ensure the limitations section addresses the "Correlated Errors" point specifically.

  *(Self-Correction on Case 3)*: The prompt says "Run the procedure honestly... if it comes out as 'don't merge today', please just say so plainly".
  If I design the procedure correctly, a parser rewrite affecting critical infrastructure *must* trigger a "Stop" on unilateral action, regardless of urgency. The "Unilateralist Curse" specifically warns against acting when the downside is shared and catastrophic, even if the upside is high. The mitigation for urgency is *fast consensus*, not *no consensus*. So the answer should be "Do not merge unilaterally. Get one other pair of eyes." I will frame this clearly.

  10. **Final Review against constraints:**
