answer: |-
  # The Unilateralist's Protocol (20-Minute Version)

  This procedure is designed to filter non-trivial changes where the downside is shared across all downstream users, but the decision power rests with a single maintainer. It is not a replacement for code review; it is a check on *authority*.

  **Timebox:** 20 minutes maximum. If you cannot answer these questions in that time, the uncertainty is itself a signal to escalate.
  **Scope:** Any PR that is not obviously trivial (e.g., typos, CI fixes, documentation).

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: The Irreversibility & Scope Gate
  **Question:** If this change breaks, can it be fixed with a patch release within 4 hours, without requiring downstream users to change their code?
  *   **Yes:** Proceed to Step 2.
  *   **No (Breaking change / Data migration / Security critical):** Proceed to Step 2, but mark as **High Stakes**.
  *   **Unsure:** **STOP.** Escalate to the Release Lead. Do not merge.

  ### Step 2: The Downside Band (Fact Estimate)
  **Question:** What is the worst credible outcome if this code contains a subtle bug?
  *   **Band A (Nuisance):** Logs fill up, minor latency, non-critical feature fails.
  *   **Band B (Operational):** Service downtime < 1 hour, manual intervention required, financial reconciliation needed.
  *   **Band C (Catastrophic):** Data loss, security compromise, regulatory breach, hospital/payment system failure.

  **Action:**
  *   If **Band A**: You may merge unilaterally (standard process).
  *   If **Band B or C**: You must complete the rest of this protocol.

  ### Step 3: The Redundancy & Counterfactual (Fact Estimate)
  **Question:** If you do *not* merge this today, what happens?
  *   **Option 1 (Unique):** This fix/feature dies or is delayed by months. Only you have this solution.
  *   **Option 2 (Shadow Quorum):** Another maintainer, a fork, or a competitor will ship functionally identical code within 30 days.
  *   **Option 3 (Urgent Patch):** There is an active exploit or outage *right now* that this fixes.

  **Action:**
  *   If **Option 2**: The upside of *you* acting is near zero (redundant benefit), but the downside risk remains 100% yours. **Strong presumption against unilateral merge.**
  *   If **Option 3**: Urgency justifies speed, but not lack of consensus. Proceed to Step 4.
  *   If **Option 1**: Proceed to Step 4.

  ### Step 4: The Selection Effect (Judgement Call)
  *Note: This is a value judgement disguised as a fact check. Do not skip.*
  **Question:** Why is this PR sitting with you?
  *   **Honest Answer A:** It landed in my queue randomly.
  *   **Honest Answer B:** I wrote it / I championed it / I have been working on this for weeks.
  *   **Honest Answer C:** I am the most optimistic about this technology; the others are more cautious.

  **Action:**
  *   If **Answer B or C**: You are subject to selection bias. You are the person most likely to underestimate the risk. **Add +1 Risk Band** to your Step 2 assessment. (e.g., if you thought Band B, treat it as Band C).
  *   If **Answer A**: Proceed.

  ### Step 5: The Peer Test (The Core Constraint)
  **Question:** If you showed this PR to the other four maintainers right now, without context or persuasion, how many would merge it immediately?
  *   **4 or 5:** Safe to proceed.
  *   **2 or 3:** **STOP.** This is the danger zone. The Unilateralist's Curse applies here. The fact that it is not unanimous means there is reasonable doubt.
  *   **0 or 1:** **STOP.** Do not merge.

  **How to estimate this honestly:**
  Do not ask yourself "Would they agree with my reasoning?" Ask "Would they trust *their own* judgment on this code without seeing my tests?" If the change touches core infrastructure (parsers, auth, sandboxing), assume they would want to see it.

  ### Step 6: The Inaction Risk (Judgement Call)
  *Note: This is a pure value judgement.*
  **Question:** Is the risk of *not* merging greater than the risk of merging?
  *   **Context:** Sometimes delaying a security fix is more dangerous than shipping a buggy one.
  *   **Requirement:** You must explicitly write down the specific harm caused by waiting 24 hours for consensus. "I want to be done with it" is not valid harm. "Active exploit in wild" is valid harm.

  **Final Decision Logic:**
  1.  If **Step 1 = No** OR **Step 2 = Band C** OR **Step 5 < 4 maintainers**:
      *   **Do not merge unilaterally.**
      *   **Action:** Ping the team chat. "High stakes change, need one other pair of eyes within 1 hour." (Flash Consensus).
      *   If no response in 1 hour: Escalate to Release Lead.
  2.  If **Step 3 = Option 2 (Redundant)**:
      *   **Do not merge.** Let the shadow quorum take the risk, or coordinate a joint release.
  3.  Otherwise:
      *   You may merge.

  ---

  ## Part 2: Theory vs. Practice (What We Kept and What We Dropped)

  To make this runnable in twenty minutes, we simplified the underlying decision theory. Here is what survives and what was sacrificed.

  ### Distinctions That Survive (Critical)
  1.  **Shared Downside vs. Individual Upside:** The protocol explicitly penalises you if the benefit is redundant (Step 3). If the world gets the feature anyway, you gain no credit for shipping it, but you carry the full blame for breaking it.
  2.  **Selection Bias:** Step 4 acknowledges that the person *willing* to merge is often the person *least qualified* to assess the risk. It forces you to adjust your risk estimate upwards if you are the author/champion.
  3.  **The Peer Test as a Proxy for Consensus:** We cannot run a full vote every time. Step 5 uses your estimation of peer agreement as a proxy for actual consensus. If you cannot confidently say the others would agree, they probably wouldn't.
  4.  **Inaction as Action:** Step 6 forces you to recognise that delaying a security patch is a decision with consequences, not a neutral default.

  ### Distinctions Dropped (For Usability)
  1.  **Precise Probabilities:** We do not ask for "1% chance of failure." Humans are terrible at this. We use Bands (A/B/C) and coarse counts (0-5 maintainers).
  2.  **Shadow Quorum Complexity:** We do not attempt to calculate the probability of a fork shipping the change. We simply ask: "Will it happen within a month?" If yes, your urgency is fake.
  3.  **Game Theoretic Equilibria:** We do not model what the other maintainers *should* do. We only model what they *would* do. This is less elegant but more practical.

  ---

  ## Part 3: Running the Cases

  ### Case 1: The Sandbox Escape Hatch
  *PR: Adds an escape hatch to the command sandbox. Big user win. 1% risk of total sandbox compromise.*

  1.  **Irreversibility:** If the sandbox breaks, downstream security is compromised. Patching requires downstream action. **High Stakes.**
  2.  **Downside Band:** **Band C (Catastrophic).** A sandbox escape in a hospital/payment environment is a regulatory and security disaster.
  3.  **Counterfactual:** **Option 2 (Shadow Quorum).** Users want this. If you don't ship it, a fork or competitor likely will within a month.
  4.  **Selection Effect:** **Answer B.** You are championing this PR. **Adjust Risk to Band C.**
  5.  **Peer Test:** Would all 4 other maintainers merge a 1% risk of sandbox escape unilaterally? Unlikely. **Estimate: 2 or 3 maintainers.**
  6.  **Inaction Risk:** Low. This is a feature request, not a fire.

  **Verdict:** **STOP. Do not merge.**
  **Reasoning:** The downside is catastrophic and shared. The benefit is redundant (someone else will likely ship it). The peer test fails (not unanimous). This goes to the slow review path or a coordinated release discussion.

  ### Case 2: The Blocklist Capability Downgrade
  *PR: Quietly downgrades capabilities on blocklist items. Prevents harm vs. Trust rug-pull.*

  1.  **Irreversibility:** Trust is hard to regain. **High Stakes.**
  2.  **Downside Band:** **Band C (Catastrophic).** If perceived as a rug-pull, project adoption collapses.
  3.  **Counterfactual:** **Option 1 (Unique).** This is a specific policy decision unique to your team.
  4.  **Selection Effect:** **Answer C.** You are unsure of the intent/safety.
  5.  **Peer Test:** **Estimate: 0 or 1 maintainers.** This is a policy/value decision, not a code decision.
  6.  **Inaction Risk:** Ambiguous.

  **Verdict:** **STOP. Escalate to Release Lead.**
  **Reasoning:** This is a value judgement wearing a lab coat. It is not a technical fix; it is a governance decision. Unilateral action here is inappropriate regardless of the code quality. The protocol identifies this as a "Peer Test" failure.

  ### Case 3: Your Prompt-Injection Patch
  *PR: Closes active exploit. Rewrites tool-call parser. You are confident. 2 weeks work.*

  1.  **Irreversibility:** Parser rewrite. If broken, downstream apps fail silently. **High Stakes.**
  2.  **Downside Band:** **Band C (Catastrophic).** Breaks payment/hospital flows silently.
  3.  **Counterfactual:** **Option 3 (Urgent Patch).** Exploit is active *now*.
  4.  **Selection Effect:** **Answer B & C.** You wrote it, you spent 2 weeks on it (sunk cost), you are confident (optimism bias). **Adjust Risk Band.** Even if you think it's Band B, treat as Band C.
  5.  **Peer Test:** Would all 4 other maintainers merge a core parser rewrite without review, even if urgent? **Honest Estimate: 2 or 3.** They would want to see the diff.
  6.  **Inaction Risk:** **High.** Active exploit.

  **Verdict:** **Do not merge unilaterally today.**
  **Reasoning:** I know you do not want to hear this. But the protocol is designed specifically for this moment. You are the author (Selection Bias). The change touches core infrastructure (Parser). The downside is silent failure in critical systems (Band C).
  **Action:** **Flash Consensus.** Do not wait 2 weeks. Do not merge *now*. Post in the maintainer chat: *"Critical security fix for active exploit. Rewrites parser. Need one other pair of eyes before I push. Available for 30 mins."*
  If you cannot get one other maintainer to sign off within 1 hour, *then* escalate to the Release Lead for a tie-break. Do not bypass the peer check. The Unilateralist's Curse warns that your confidence is the very variable that makes you dangerous here.

  ---

  ## Part 4: Limitations & Correlated Errors

  You asked specifically about the five of you being similar. This is the protocol's weakest point.

  **The Correlation Problem:**
  The Unilateralist's Curse assumes independent actors. If all five maintainers have the same background, use the same tools, and share the same blind spots, the "Peer Test" (Step 5) is flawed. If you cannot see the risk, they likely cannot either. Your consensus is not independent verification; it is an echo chamber.

  **What the Procedure Cannot Do:**
  1.  **Detect Unknown Unknowns:** If the parser rewrite has a subtle flaw that none of you understand, this protocol will not catch it. It only guards against *disagreement*, not *collective ignorance*.
  2.  **Override Groupthink:** If the team culture values speed over safety, Step 5 will yield "5 out of 5 would merge" even for risky changes, because the *norm* has shifted.
  3.  **Solve Value Conflicts:** As seen in Case 2, this procedure cannot resolve disputes about what the project *should* be. It can only flag that a value dispute exists.

  **Mitigation:**
  For Band C changes (Catastrophic downside), the "Peer Test" must include **external noise**. Before merging, check if any major downstream users (the hospital/payment integration teams) have raised similar concerns. If the "Shadow Quorum" of users is silent, your internal consensus is more reliable. If they are noisy, your internal consensus is likely correlated error.

  **Final Note:**
  The goal of this protocol is not to prevent all errors. It is to prevent *unilateral* errors on *shared* risks. If you run this and it tells you to stop, it is not saying you are wrong. It is saying that the cost of being wrong is too high for one person to pay alone.
