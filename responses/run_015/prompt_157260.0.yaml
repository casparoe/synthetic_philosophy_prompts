          *   *Nuance:* "Shift the metric values" at specific *manifold points*. This is the crux.
          *   *Verdict:* Technically acceptable, though "coordinate changes" is often used loosely for "diffeomorphisms." A pedant might wince at "coordinate changes" instead of "active diffeomorphisms," but it's common shorthand.

