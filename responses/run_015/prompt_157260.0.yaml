  hey, i was skimming an old physics-adjacent forum thread and someone summed up Einsteins hole arguement like this: "In 1913 Einstein showed that full general covarience breaks determinism inside a matter-free hole. Fix the matter and boundry conditions outside, and smooth coordinate changes inside still shift the metric values, so the field equations cant pin down a unique interior. Einstein read this as a fatal flaw and spent years restricting covariance, eventually settling on coordinate conditions that acted like hidden gauge-fixing. Only later did he see that the two descriptions are physically identical since spacetime points lack haecceity — its like rotating axes, not like two different worlds. So the argument was never about real physical indeterminism; its just coordinate redunancy, and modern relationalists cite it as proof that bare points are ontologically redundant."

  how fair is that? go sentence by sentence and tell me what a GR philosopher or foundations person would accept, what they'd wince at, and whats flat wrong. in particular, is it right that Einstein "settled on coordinate conditions" as the resolution, and does the conclusion that determinism is untouched actually follow from the corrected parts? also does the relationalist claim overreach?
