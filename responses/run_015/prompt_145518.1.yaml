answer: |-
  Your diagnosis is astute and aligns with a growing meta-philosophical consensus: the stalemate in the free will debate is less a failure of argumentation and more a symptom of **conceptual conflation**. The debate persists because participants are often talking past one another, pursuing distinct projects under the umbrella term "free will."

  Here is a breakdown of the disagreement's structure, an assessment of evidential standards, a recommendation for next steps, and an evaluation of your proposed "diachronic" variety of free will.

  ### 1. Diagnosis: Distinct Questions Under One Name
  The disagreement is not merely verbal, nor is it purely substantive. It is best characterized as **distinct philosophical projects competing for the same label.**

  *   **The Normative/Pragmatic Project (Compatibilism):** This camp asks, "What conditions must be met for our practices of praise, blame, and punishment to be justified?" Their concept of 'control' is functional. It is about *governance* and *reasons-responsiveness*.
  *   **The Metaphysical Project (Libertarianism):** This camp asks, "Is the agent a genuine originator of action in a universe governed by causal laws?" Their concept of 'control' is ontological. It requires *causal openness*.
  *   **The Empirical/Psychological Project (Skepticism):** This camp asks, "Does the phenomenology of choice match the underlying neural mechanics?" Their concept of 'control' is causal-mechanical.

  **The Verbal Overlay:** The term "control" acts as a pivot. For the Compatibilist, control is a property of the *system* (the agent's psychology). For the Libertarian, control is a property of the *history* (the causal chain). Because both use the word "control," they assume they are debating the same property, when they are actually debating the prerequisites for different outcomes (social justification vs. metaphysical origination).

  **Conclusion:** The stall is primarily due to **distinct questions being pursued under one name**, exacerbated by verbal ambiguity. It is not purely verbal because there are substantive stakes (e.g., if determinism is true, do we lose *something* real?), but the lack of definitional boundaries prevents those stakes from being isolated.

  ### 2. Evidential Standards and Criteria for Progress
  The sides do **not** share common evidential standards, which explains the circularity.

  *   **Data Sources:**
      *   **Compatibilists** rely on **intuitions about cases** (e.g., Frankfurt cases) and **conceptual coherence** with moral practice. If a definition of free will makes sense of why we don't blame the coerced but do blame the spiteful, they count that as progress.
      *   **Libertarians** rely on **modal intuitions** (the "could have done otherwise" intuition) and **metaphysical possibility**. Empirical findings are often secondary unless they directly threaten the possibility of agent-causation.
      *   **Skeptics** rely on **empirical findings** (neuroscience, psychology) to challenge the phenomenology of agency.
  *   **Criteria for Progress:**
      *   For the Compatibilist, progress is **reflective equilibrium**: aligning theory with practice.
      *   For the Libertarian, progress is **metaphysical discovery**: locating the break in the causal chain.
      *   For the Skeptic, progress is **explanatory reduction**: showing agency is an illusion.

  Because they disagree on what counts as data (intuition vs. neural scan) and what counts as a solution (justification vs. ontological grounding), they cannot agree on when the debate is over.

  ### 3. Recommendations: What Should Happen Next?
  To break the static nature of the debate, we should pursue a strategy of **decoupling and specification**.

  1.  **Separate the Normative from the Metaphysical:** We should explicitly distinguish the "Responsibility Question" (What justifies blame?) from the "Origination Question" (Are we uncaused causes?). As P.F. Strawson suggested, our responsibility practices might be immune to metaphysical facts. If we treat these as separate inquiries, Compatibilists can solve the normative problem without needing to solve the metaphysical one.
  2.  **Sharpen Sourcehood vs. Alternatives:** You mentioned this distinction, and it is crucial. Much of the debate conflates *Leeway Incompatibilism* (I need alternative possibilities) with *Source Incompatibilism* (I need to be the ultimate source). Focusing on **Sourcehood** is more productive. Even if I couldn't have done otherwise, did the action flow from *me*?
  3.  **Reframe Empirical Relevance:** We should stop asking neuroscience if free will exists (a category error) and start asking it about the **capacities** required for the specific type of control we care about (e.g., impulse control, future planning, value revision).
  4.  **Conclusion on Framing:** The current framing is **ill-posed** because it assumes a single binary property ("Has Free Will" vs. "Does Not"). We should move toward a **capacity-based model**, where agents possess varying degrees of specific agential capacities.

  ### 4. Evaluating the "Diachronic Evaluative Revision" Proposal
  Your proposal defines free will not by causal history or momentary alternatives, but by **"an agent's diachronic capacity to revise the evaluative framework through which they choose."**

  This is a sophisticated move that aligns with "reasons-responsiveness" accounts (like Fischer and Ravizza) but adds a crucial temporal dimension often found in the work of Michael Bratman (planning agency) or Susan Wolf (deep self views).

  **Does it clarify the disagreement?**
  *   **For Compatibilists:** Yes. It strengthens their position. It moves the locus of control from the *moment of action* (where determinism bites hardest) to the *history of character formation*. It answers the "manipulation objection" by asking: Did the agent have the capacity to critique and revise the values they were manipulated into holding?
  *   **For Skeptics:** It forces a shift in empirical focus. Instead of looking for a "gap" in neural firing at $t_1$, researchers would look for the neural correlates of **meta-cognitive regulation** over time ($t_1$ to $t_n$). This is empirically tractable.
  *   **For Libertarians:** It likely **will not satisfy them**, but it clarifies *why*. They will argue that the capacity to revise the framework is itself determined. However, this exposes the Libertarian demand as a demand for *magic* (acausal origination) rather than a demand for *capacity*.

  **Does it add a layer to the loop?**
  It risks adding a layer *unless* it is explicitly framed as a **replacement** for the traditional definition rather than a subtype.
  *   If presented as "Another Variety of Free Will," Libertarians will simply say, "That's not the *real* free will (ultimate origination)."
  *   If presented as "The Only Coherent Concept of Free Will Worth Wanting" (echoing Dennett), it dissolves the Libertarian objection by changing the subject to what actually matters for human life.

  **Verdict:**
  This proposal is the most promising path forward because it addresses the **"worth wanting"** criterion you mentioned in the opening.
  *   **Ultimate Origination (Libertarian):** Not clearly worth wanting (it introduces randomness).
  *   **Momentary Alternatives (Standard Compatibilist):** Often insufficient (Frankfurt cases).
  *   **Diachronic Revision (Your Proposal):** deeply worth wanting. It captures autonomy, growth, and moral development.

  **Strategic Recommendation:**
  Do not introduce this as a *third option* alongside Compatibilism and Libertarianism. Introduce it as a **refinement of Compatibilism** that co-opts the Libertarian intuition of "self-creation."
  Argue that "Sourcehood" is not about the causal past, but about the **narrative integration of the self**. If I can revise my evaluative framework, I am the author of my actions in the only sense that supports moral agency. This renders the metaphysical demand for "causal openness" obsolete, not by refuting it, but by showing it is irrelevant to the normative status of the agent.

  ### Summary
  The debate is static because it conflates metaphysics, normativity, and psychology. To move forward:
  1.  **Decouple** the justification of blame from the metaphysics of causation.
  2.  **Adopt** your diachronic capacity model as the primary definition of agency, framing it as the only version that supports the "deep self" required for genuine responsibility.
  3.  **Accept** that this will not convince hard Libertarians, but it will render their objection irrelevant to the practical and normative questions that actually drive the debate.

  The goal should not be to solve the metaphysical puzzle of determinism, but to dissolve the requirement that solving it is necessary for moral agency. Your diachronic proposal is the tool to achieve that dissolution.
