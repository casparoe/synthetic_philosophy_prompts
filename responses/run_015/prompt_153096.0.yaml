  **1. Exam Question**

  **Question 3 (25 Marks)**

  Consider a variable-agenda social choice framework. Let $X$ be a universe of alternatives with $|X| \ge 3$. An *agenda* is any finite subset $A \subseteq X$ with $|A| \ge 2$. A *profile* $P$ on $A$ is a list of strict linear orders $(\succ_1, \dots, \succ_n)$ over $A$. A *Variable-Agenda Social Welfare Function* (VASWF) $F$ assigns to every agenda $A$ and profile $P$ a complete and transitive social relation $R_A(P)$ on $A$.

  You may cite **Arrow's Impossibility Theorem** (for a fixed agenda of size $\ge 3$, Unrestricted Domain, Weak Pareto, Independence of Irrelevant Alternatives, and Collective Rationality imply Dictatorship), but you must verify its hypotheses if you apply it.

  Consider the following two conditions on $F$:

  1.  **Rank-Intensity Independence (RII):** For any agenda $A$, profile $P$, and pair $\{x,y\} \subseteq A$, the social comparison between $x$ and $y$ depends only on the set of individual orderings of $x$ versus $y$ and, for each voter, the number of alternatives in $A$ ranked strictly between $x$ and $y$.
  2.  **Deletion Condition (DC):** For any agenda $A$, profile $P$, and alternative $z \in A$, let $A' = A \setminus \{z\}$. The social relation on $A'$ generated by the restriction of $P$ to $A'$ is identical to the restriction of the social relation on $A$ to $A'$.

  A colleague claims: *"Borda's Rule refutes the pessimism of Arrow's Theorem. It satisfies Weak Pareto, Anonymity, Neutrality, and Non-Dictatorship while always producing a weak order. Crucially, it satisfies Rank-Intensity Independence, which is the natural ordinal refinement of IIA. Thus, Arrow's impossibility is an artifact of the overly coarse IIA condition."*

  (a) Show that IIA implies RII, but RII does not imply IIA. Derive the identity linking the difference in Borda scores between $x$ and $y$ to the signed rank distances. Then, exhibit an explicit profile with $|A|=3$ and $n=2$ where Borda's rule satisfies RII but violates IIA. (6 marks)

  (b) Prove that if a VASWF satisfies the Deletion Condition, then for any fixed agenda $A$, the social comparison of any pair $\{x,y\}$ depends only on the individual rankings of $x$ and $y$. (6 marks)

  (c) Prove that any VASWF satisfying Weak Pareto and the Deletion Condition must be dictatorial. You must show that the dictator is the same individual across all agendas, explaining explicitly where the availability of two-element agendas and larger agendas is utilized. (8 marks)

  (d) Write a short referee-style paragraph (approx. 100 words) evaluating your colleague's claim. Address whether cross-agenda coherence is a legitimate requirement and whether Borda's agenda-sensitivity is a defect peculiar to Borda or a necessary feature of non-dictatorial rules. (5 marks)

  ***

  **2. Model Answer**

  **(a)** IIA requires social ranking of $x,y$ to depend *only* on individual rankings of $x,y$. RII allows dependence on individual rankings of $x,y$ plus the count of intermediates. Thus, if a rule satisfies IIA, it ignores intermediates, satisfying RII trivially. The converse fails for Borda.
  Let $B(x, A, P) = \sum_{i=1}^n |\{z \in A : x \succ_i z\}|$. The score difference is:
  $$B(x) - B(y) = \sum_{i=1}^n \left( |\{z : x \succ_i z\}| - |\{z : y \succ_i z\}| \right) = \sum_{i=1}^n \sigma_i \cdot (1 + k_i)$$
  where $\sigma_i \in \{1, -1\}$ indicates if $x \succ_i y$ or $y \succ_i x$, and $k_i$ is the number of alternatives between $x$ and $y$ for voter $i$. The social ranking depends on $k_i$, violating IIA.
  *Counterexample:* Let $A=\{x,y,z\}$, $n=2$.
  Profile $P$: $1: x \succ z \succ y$, $2: y \succ z \succ x$.
  $B(x)=1+0=1$, $B(y)=0+1=1$. Social: $x \sim y$.
  Profile $P'$: $1: x \succ y \succ z$, $2: y \succ z \succ x$. (Voter 1 moves $z$ below $y$; $x \succ_1 y$ unchanged).
  $B(x)=2+0=2$, $B(y)=1+1=2$. Wait, recalculate $P'$: $1: x(2), y(1), z(0)$; $2: y(2), z(1), x(0)$. Sums: $x=2, y=3$. Social: $y \succ x$.
  Individual $x,y$ rankings are identical in $P$ and $P'$, yet social ranking flips. Borda violates IIA.

  **(b)** Let $F$ satisfy DC. Fix agenda $A$ and pair $\{x,y\} \subseteq A$. Let $Z = A \setminus \{x,y\}$. We can delete elements of $Z$ one by one. Let $A_0 = A$. For each $z \in Z$, define $A_{k+1} = A_k \setminus \{z\}$. By DC, $R_{A_{k+1}}$ is the restriction of $R_{A_k}$. By induction, $R_{\{x,y\}}$ is the restriction of $R_A$. Thus, the social comparison on $A$ is determined entirely by the profile restricted to $\{x,y\}$ and the rule's behavior on the two-element agenda. This is precisely the condition that social comparison depends only on individual rankings of that pair (IIA).

  **(c)** Fix any agenda $A$ with $|A| \ge 3$. By (b), $F$ satisfies IIA on $A$. Given WP and Collective Rationality, Arrow's Theorem implies there exists a dictator $d_A$ for agenda $A$.
  To show $d_A$ is global: Consider $A=\{x,y,z\}$. Arrow implies a dictator $i$ for $A$. This $i$ dictates on all pairs in $A$, so $i$ is the dictator for sub-agendas $\{x,y\}, \{y,z\}, \{x,z\}$. Since $|X| \ge 3$, any two pairs of alternatives can be linked by a chain of overlapping 3-element agendas. Consistency via DC ensures the dictator cannot switch between overlapping agendas. Thus, a single voter $d$ dictates on all two-element agendas. Since any larger agenda's outcome is restricted from the two-element outcomes (via DC logic reversed or simply by the fact that $d$ dictates pairwise everywhere), $d$ is the global dictator. The two-element agendas are required to establish the base pairwise dictatorship; the larger agendas link these local dictators into a global one.

  **(d)** The colleague's claim is false. While Borda satisfies RII and avoids dictatorship on a *fixed* agenda, it violates the Deletion Condition. As shown in (c), WP and Non-Dictatorship jointly entail the failure of DC. Cross-agenda coherence (DC) is a minimal requirement for structural consistency; a rule that changes pairwise verdicts based on the presence of irrelevant third alternatives is context-dependent in an unacceptable way for a general welfare function. Borda's agenda sensitivity is not an idiosyncrasy but the necessary price of escaping dictatorship while maintaining Pareto efficiency. One cannot have it all.

