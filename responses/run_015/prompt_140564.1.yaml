      *   **The Cost:** Rejecting (3) requires committing to a notion of "causal organization" that distinguishes between *generative* processes and *static mappings*. This is standard functionalism (e.g., Armstrong, Lewis, Putnam), but it requires defending the reality of internal states against behaviorist reduction.
      *   **Addressing (10):** Distinguish between *actual* history and *counterfactual* structure. Moral status supervenes on the *capacity* for certain causal interactions, not just the *actualization* of them. The table lacks the capacity (the mechanism), even if the bound makes the lack of capacity untestable.
      *   **Addressing (11):** Acknowledge that compression *does* change moral status if it changes the causal topology. A compressed algorithm *is* an emulation $S$. A raw table is not. The transition from table to algorithm is not continuous regarding organization; it's a phase shift from storage to computation.

  7.  **Refine the Advice for the Dissertation:**
