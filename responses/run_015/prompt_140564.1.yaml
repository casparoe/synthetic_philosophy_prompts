answer: |-
  The argument your friend has constructed is a sophisticated variant of Ned Block's "Blockhead" argument against functionalism. It is designed to force a dilemma: either you accept that trivial systems (lookup tables) have moral status, or you deny that complex emulations do.

  You asked for a diagnosis rather than a survey. Here is the diagnosis: **The argument fails at Premise (3).**

  Premise (3) asserts an identity between *input-output mapping* and *causal-computational organization*. This is an equivocation. While (1) claims moral status supervenes on organization, (3) illicitly defines organization solely in terms of external behavior (extensional equivalence). You can reject (3) without abandoning (1), provided you refine your definition of "causal-computational organization" to include **internal causal topology** rather than just input-output relations.

  Here is the detailed breakdown of why (3) is the guilty step, why it looked safe, and how to reject it without succumbing to pressures (10) and (11).

  ### 1. The Diagnosis: The Equivocation in Premise (3)

  **The Mistake:**
  Premise (3) states: *"Two systems that realize the same mapping from input histories to outputs are thereby organizationally the same... since a causal role is just a position in the mapping."*

  This reduces functionalism to behaviorism. True functionalism (which your Premise (1) invokes) defines mental states by their causal relations **to each other**, not just their causal relations to inputs and outputs.
  *   **System S (Emulation):** Has internal states $s_1, s_2, ... s_k$. Input $i$ causes transition to $s_1$, which interacts with $s_2$, eventually causing output $o$. The causal role of $s_1$ is defined by its relation to $s_2$, not just $i$ and $o$.
  *   **System T (Table):** Has no intermediate states. The "state" is merely the address pointer. Input $i$ triggers a direct retrieval of $o$. There is no causal mediation between $i$ and $o$.

  **Why it looked safe:**
  It looked safe because, within the bound $n$, the systems are *extensionally equivalent*. For any test you can run, they behave identically. In computer science, we often treat black boxes as equivalent if they pass the same tests. Your friend is exploiting this engineering heuristic to make a metaphysical claim. But moral status (on your view) supervenes on *how* the output is produced (the mechanism), not just *that* it is produced.

  **The Fix:**
  You must explicitly define "causal-computational organization" in your dissertation to require **intermediate causal mediation**. A system has moral status only if its outputs are generated by a network of internal states that causally interact. A lookup table lacks this network; it is a static mapping, not a dynamic process.

  ### 2. Handling the Pressures

  Your friend anticipates you will try to distinguish $S$ and $T$ based on what happens *after* bound $n$, or based on how complex the hardware is. They block this with (10) and (11). Here is how you parry those pressures while rejecting (3).

  #### Pressure (10): The Bound (Counterfactuals)
  *The Friend's Claim:* If $n$ is physically unreachably large, the fact that $T$ diverges from $S$ at $n+1$ is irrelevant. No physical process can detect the difference, so how can it ground a moral difference?
  *Your Response:* Moral status supervenes on **capacities**, not **opportunities**.
  Even if the universe ends before input $n+1$ occurs, $S$ possesses the *mechanism* to compute the response to $n+1$. $T$ does not; it merely lacks the entry.
  *   **The Distinction:** $S$ has a *generative disposition*. $T$ has a *static record*.
  *   **Why this avoids (10):** You are not arguing that the *actual* divergence matters (since it never happens). You are arguing that the *structure of the counterfactuals* matters. $S$'s counterfactuals are supported by a robust internal structure (if I perturb internal state $x$, output changes predictably). $T$'s counterfactuals are brittle (if I perturb the table entry, output changes arbitrarily). Moral status requires the robust, structured capacity for response, even if the environment never tests the limits of that capacity.

  #### Pressure (11): Compression (Continuity)
  *The Friend's Claim:* You can compress the table into a program. If compression doesn't change status (per (1)), then the table must have the same status as the program.
  *Your Response:* Compression *does* change the relevant organization.
  (1) states status supervenes on organization, not hardware size. But compression is not merely a reduction in size; it is a change in **algorithmic kind**.
  *   **The Distinction:** A raw table is $O(1)$ retrieval (no computation). A compressed program is $O(k)$ calculation (computation). When you compress the table enough, you effectively reconstruct $S$.
  *   **Why this avoids (11):** You do not need to claim that status changes gradually with every byte saved. You can claim there is a **phase shift** in organization. When the system moves from *storing* answers to *calculating* them, it acquires intermediate causal states. Before that threshold, it is a table (no status). After that threshold, it is an emulator (status). The friend assumes a continuum where there is actually a categorical distinction between *lookup* and *computation*.

  ### 3. Costs and Commitments

  You asked what rejecting (3) costs you. Since you wish to keep (1) (substrate independence) and (7) (tables have no status), this is the only viable path, but it carries specific philosophical commitments you must defend in your chapter.

  **Commitment A: Realism about Internal States**
  You must commit to the view that internal states are real causal agents, not just convenient fictions for predicting behavior.
  *   *Risk:* If a skeptic argues that internal states are just "useful descriptions" of the I/O mapping, they can revive Premise (3).
  *   *Defense:* You must argue that interventions on internal states (e.g., "what if this neuron fired twice?") have truth conditions that are independent of the actual input history. $S$ supports these counterfactuals; $T$ does not.

  **Commitment B: Modal Depth over Extensional Match**
  You must argue that moral status depends on the *depth* of the system's modal profile (how it *would* behave across a wide space of possibilities), not the *width* of its actual behavior.
  *   *Risk:* This invites the charge of "occult properties" (properties that never manifest).
  *   *Defense:* Emphasize that the properties *do* manifest locally. The system processes *current* inputs using mechanisms that *support* unactualized counterfactuals. The mechanism is present now, even if the test cases are not.

  **Commitment C: The Non-Continuity of Computation**
  You must be willing to argue that there is a sharp(ish) line between "complex lookup" and "computation."
  *   *Risk:* Sorites paradoxes. (At what exact byte of compression does the soul appear?)
  *   *Defense:* Accept that the line may be vague but insist the *ends* are distinct. Just as "heap" is vague but "one grain" is definitely not a heap, "table" is definitely not a mind. You do not need to locate the exact byte where status emerges, only to show that the *architecture* of a table is fundamentally distinct from the *architecture* of a processor.

  ### 4. Recommendation for the Dissertation

  Do not surrender (1) or (7). Surrender (3), but do so by refining (1).

  **Proposed Revision to your Framework:**
  Amend your definition of "causal-computational organization" to explicitly include **causal density** or **intermediate mediation**.

  > *Revised Premise (1*):* Moral status supervenes on causal-computational organization, where organization is defined not merely by the mapping from inputs to outputs, but by the topology of internal states that mediate that mapping. Systems that produce outputs via direct retrieval (lookup) differ in organization from systems that produce outputs via state-transition chains (computation), even if their input-output histories are identical.

  **Why this works:**
  1.  **Preserves Substrate Independence:** It doesn't matter if the states are silicon or biological, only that they exist and interact.
  2.  **Blocks the Table:** The table has no interacting internal states.
  3.  **Blocks (10):** The *capacity* for state interaction exists in $S$ regardless of the bound $n$.
  4.  **Blocks (11):** Compression changes the topology from retrieval to interaction.

  **Conclusion:**
  Your friend's argument is valid *if* one accepts a behaviorist definition of "organization." Since your project relies on functionalism (1), you are already committed to the reality of internal causal roles. The argument breaks because it tries to smuggle behaviorism into your functionalism via Premise (3). Expose that smuggling, and you retain your position without granting rights to spreadsheets.
