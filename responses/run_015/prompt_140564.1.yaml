      *   Key concept: **Intermediate Causal States**. $S$ has states $s_1, s_2...$ that cause outputs. $T_n$ has no intermediate states; the "state" is just the address pointer.
      *   Key concept: **Counterfactual Robustness**. $S$ supports interventions on internal states. $T_n$ does not.
      *   *Warning:* The user must be careful not to slide into (10). They must argue that the *structure* of the counterfactuals matters, not just their truth value within the physical bound. The table's counterfactuals are "brittle" (change one bit in input, jump to unrelated entry), whereas $S$'s are "smooth" or "structured" (change input slightly, internal state changes slightly).

  8.  **Drafting the Response:**
