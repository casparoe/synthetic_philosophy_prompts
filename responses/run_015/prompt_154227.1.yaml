  hey, so im writing a novel about a busted cargo ship crew who have to share limited power between three things that might be kinda aware: a hive of modified bees acting like one distributed brain, an old climate-regulator AI that learns to avoid damage, and this engine-room thermostat that reacts to heat spikes with what looks like negative feedback loops. none of them are clearly people, none are clearly objects, and the characters keep fighting about where the moral line actually sits on a gradation from insects to thermostats.

