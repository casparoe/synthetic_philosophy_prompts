  She is running **Universal Contingency (Rule 1)**. The Calculus rejection is the key adjudicator: although calculus involves mathematical truth, she rejected the narrative because it treated the *historical convergence* as predetermined. She distinguishes between the *truth* of a theorem (which is timeless) and the *history* of its formulation (which is contingent). The information-theory narrative makes a claim about the *history* ("origins... inevitable resolution"), which violates the principle that historical actors (pre-Shannon engineers) should not be judged by their anticipation of future truths.

  **Test Case:**
  To distinguish these rules, you need a case involving a pure mathematical discovery where the "truth" is undeniable, but the historical path was contested.

  Verdict: Reject
  Test-case: A narrative on the discovery of non-Euclidean geometry that frames the axiomatic shift as logically inevitable and Euclidean defenders as merely dogmatic obstructors.
