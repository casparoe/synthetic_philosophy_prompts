  ### Why (2) Looked Plausible
  Premise (2) relies on the **"Drop in the Bucket" intuition**. It assumes that harm is discrete and that causal chains have visible thresholds (e.g., a specific number of burgers triggers a specific order for meat; a specific number of votes flips an election). In macro-level outcomes like climate change or national elections, the threshold is opaque. Because you cannot *see* your burger triggering a slaughterhouse order, it feels true that you caused nothing. This is an epistemic limitation mistaken for a metaphysical reality. Just because you cannot identify the specific mechanism by which your act tips the scale does not mean no such mechanism exists.

  ### The Cost of Rejecting (2)
  Rejecting (2) requires you to adopt **Expected Utility** and **Probabilistic Causation** as the metric for moral assessment. You must accept that "harm" is not just the physical damage that actually materializes, but the *risk* of damage weighted by its probability.

  *   **What it costs:** You lose the comfort of certainty. You can no longer say, "I know for a fact my act didn't matter." You must instead say, "My act carried a non-zero probability of mattering, multiplied by a massive stakes value, which yields a significant expected harm."
  *   **The mathematical burden:** You must accept that moral obligation binds you even when the probability of your individual impact is vanishingly small, provided the potential harm is large enough.

  ### What Your One Burger Brings About
  If (2) is false, your burger is not causally inert. In industrial supply chains, inventory is managed via marginal demand. While one burger rarely triggers a discrete order for a whole cow, it increases the *probability* that a threshold will be crossed sooner rather than later.

  *   **The Claim:** Your purchase contributes to a **marginal increase in expected demand**.
  *   **The Mechanism:** If 10,000 purchases trigger an order for 100 cows, each purchase carries a 1/10,000 chance of triggering that order. The expected harm of your burger is (1/10,000) $\times$ (100 cows). This is not zero.
  *   **The Climate Analogy:** Your carbon emission does not need to be the specific molecule that crosses the 1.5°C threshold to cause harm. It increases the *probability* that the threshold will be crossed, or it marginally worsens the severity of the outcome once crossed. In consequentialist terms, expected harm is still harm.

  ### The Firing Squad and Threshold Cases
  You asked whether this principle lets the firing squad off the hook (five shooters, one victim, any four bullets suffice).

  *   **Distinguishing the Cases:** Rejecting (2) via Expected Utility handles the firing squad differently than the climate case, but still condemns the shooter.
      *   **Ex Ante vs. Ex Post:** In the firing squad, if the shooters coordinate, each shooter knows their bullet is *part of a sufficient set*. Even if their specific bullet is physically redundant *ex post* (after the fact), *ex ante* (before the shot), each shooter imposed a risk of death. By rejecting (2), you judge the act based on the *ex ante* expected harm.
      *   **The Redundant Shooter:** If the fifth shooter knows for a fact that four others have already fired lethal shots, Expected Utility might suggest their marginal contribution is zero. However, a robust rejection of (2) appeals to **complicity in risk imposition**. The fifth shooter is not just adding carbon to the atmosphere; they are actively participating in a lethal mechanism.
      *   **Does it distinguish?** Yes. In the climate case, you are acting in ignorance of the exact threshold (probabilistic harm). In the firing squad, you are acting with knowledge of sufficiency (participatory harm). Both reject (2), but the firing squad adds a layer of *intent to kill* that climate emissions lack. This prevents the principle from collapsing into absurdity where accidental contributors are treated the same as murderers.

  ### Threshold Cases (The 90/91 Problem)
  Your friend's variation (90 people needed, 91 available) is designed to trap you. If you are the 91st, you made no difference.
  *   **The Solution:** You never *know* you are the 91st. Moral deliberation happens under uncertainty. You must assign a probability to being the threshold actor.
  *   **The Obligation:** If there is a 1% chance you are the 90th person, and the harm is catastrophic, the expected value of abstaining is high. You are obligated to act based on the probability, not the certainty.
  *   **Individual Answerability:** This leaves individuals answerable. You cannot say, "I wasn't the threshold actor." You must say, "I wasn't *sure* I wasn't the threshold actor, and I gambled with catastrophic harm."

  ### The World You Live In
  If you reject (2), you live in a world of **moral probabilities**.
  *   **No Innocence by Insignificance:** You cannot claim innocence because your contribution was small. Small contributions aggregate into expected harm.
  *   **Agency Preserved:** You keep premise (1). You are still judged on *your* act's consequences. It is just that "consequences" includes the risk you imposed, not just the visible wreckage.
  *   **The Trade-off:** The price of honesty is acknowledging that you are never causally isolated. Every act ripples through complex systems with non-zero probabilities of triggering harm.

  ### Summary
  Your friend's argument is valid, but it is unsound because (2) is false. By equating "making a difference" with "visibly tipping a threshold," (2) ignores the moral significance of risk and expected value. Rejecting (2) allows you to keep (1) (individual responsibility based on consequences) and deny (7) (the practice is not free of wrongful acts). The absurdity vanishes because every individual act *does* bring about harm—just harm that is probabilistic rather than deterministic.
