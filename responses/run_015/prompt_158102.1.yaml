  ### Leaf Explanations & The Empty Branch

  **Leaf 1: Hard Eliminativism**
  You believe higher-level patterns are illusions. If an ML model finds a "pattern" in human behavior, you say it is merely curve-fitting noise. There are no beliefs, only physics.
  *   **Why you are here:** You answered that talk of "wants" is strictly false.

  **Leaf 3: Strong Physicalism**
  You believe patterns are real, but they are literally embedded in physics. A "design" pattern is just a complex physical pattern. You don't need new laws of nature to explain ML weights; they are physical configurations.
  *   **Why you are here:** You answered that an alien using only physics would miss nothing real, only efficiency.

  **Leaf 8: Dennett's Real Patterns**
  You believe patterns are objective features of the world, but their reality depends on their ability to support prediction via a specific stance (Physical, Design, or Intentional). An ML model finds a real pattern if it successfully predicts data, regardless of whether that pattern matches fundamental physics.
  *   **Why you are here:** You answered that Design and Intentional stances are distinct, but neither is "truer"—they are tools for different jobs.

  **Leaf 5: [Empty Branch] The Fourth Way**
  *   **Position:** You accept that patterns are real and observer-independent (like Leaf 8), but you deny that the Physical, Design, and Intentional stances are the only ways to access them. You think there are real patterns in ML or nature that fit none of these three categories.
  *   **Why it is deserted:** This branch is largely **unexplored and arguably incoherent**. If a pattern is observer-independent and real, it usually manifests either as causal structure (Physics) or functional regularity (Design/Intentional). Claiming a "real pattern" exists that is neither physical nor functional makes it difficult to define what the pattern *is* without slipping into mysticism or collapsing back into one of the other three stances. Most philosophers assume the three stances are exhaustive for predictive systems.

  ### Indistinguishable Leaves

  **Leaf 6 (Functionalism) and Leaf 8 (Dennett's Real Patterns)**
  Your tree may struggle to cleanly separate these two.
  *   **The Problem:** Both positions agree that higher-level patterns are real and useful. In practice, a Functionalist and a Dennettian will often agree on whether an ML model has found a "real" pattern.
  *   **The Difference:** The Functionalist tends to say beliefs *are* functional states (collapsing Intentional into Design). Dennett insists the Intentional stance is distinct from the Design stance, even if they overlap.
  *   **For your group:** If you find yourself arguing over semantics here, you likely occupy the same practical ground. The split only matters if you care deeply about whether "belief" is a unique category separate from "function."

  ### Note on Spelling
  In your notes, ensure you use **intentional** (with two 'n's). This refers to "aboutness" (beliefs *about* things), not "intending" to do something, though they are related. Using the correct spelling will help when you search for literature later.
