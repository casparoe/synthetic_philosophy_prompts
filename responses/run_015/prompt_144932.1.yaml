      *   *Level 3: The Blueprint (False/Empty).* DNA contains a spatial map of the body. False (no head-to-toe map in DNA).
      *   *Level 4: The Deterministic Program (Teacher's View).* DNA + Standard Environment $\to$ Organism. Falsifiable (twins differ, plasticity).
      *   *Level 5: The Semantic/Metaphysical Claim.* DNA has "meaning" independent of interpreters. Philosophical/Empty.

  6.  **Evaluate Alternative Metaphors:**

      *   *Blueprint:* Implies spatial correspondence (false). Implies static design (false).
      *   *Recipe:* Implies process + environment (oven/temp). Better. But recipes can fail or vary.
