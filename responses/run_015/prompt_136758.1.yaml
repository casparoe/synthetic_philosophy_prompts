answer: |-
  The cursor blinked against the black background, a rhythmic pulse next to the divergence graph. Mara didn't turn when the office door creaked open. She knew the heavy tread belonged to Halloway.

  "You're still here," he said, dropping his keys on the desk. The sound was too loud in the quiet lab. "It's three AM, Mara."

  "Look at the screen."

  Halloway sighed, the sound of a man who had heard this too many times. He leaned over her shoulder, smelling of stale coffee and rain. "Is this the decay simulation again? I told you, the symmetry is robust. It's the Quine-Duhem problem. You can always construct an auxiliary hypothesis to save the phenomenon. You have Twin A causing decay, and Twin B where decay causes the state change. They predict the same numbers. You can't choose between them based on evidence."

  "That's the point," Mara said, her voice tight. "Evidence is dead. We hit the wall. But I found this old thread on a philosophy board. Some user named Ontos. He argued that if two theories are empirically identical forever, they aren't two theories. They're one idea wearing two masks."

  Halloway rubbed his face. "Metaphysics. We do physics."

  "He said the only way to tell them apart is pre-data. Mathematical structures that exist but haven't been mapped to physical observables yet. Pure topology." Mara tapped the keyboard, bringing up a new window. Complex geometric shapes rotated slowly. "I ran both models against the unclaimed manifolds. The ones we haven't used for particle physics yet."

  "And?"

  "And they don't match." She highlighted a section of the code where the red line spiked away from the blue. "Twin A fits the structure naturally. Twin B... it forces the fit. It requires extra terms, clunky adjustments to make the math work on these unclaimed structures. If the symmetry was perfect, the elegance should be identical. But it isn't."

  Halloway straightened up, crossing his arms. "You're fitting the model to the math you chose. That's confirmation bias, Mara. You picked structures that favor the model you *want* to be true."

  "I didn't pick them. I ran a script to pull random unassigned Hilbert spaces. I didn't even look at them until the simulation finished."

  "It's still subjective. Elegance isn't data."

  "It's structural integrity," she snapped, turning to face him. "If the universe is mathematical, then the math shouldn't care which mask it's wearing. The friction should be zero for both. But there's friction on Twin B. It's like... like trying to fit a left hand into a right glove. It stretches."

  Halloway looked back at the screen. The red line hung there, accusing. "You know what this looks like? It looks like you're desperate to solve a problem that doesn't need solving. The predictions are the same. The particles decay at the same rate. Who cares about the causal arrows if the outcome is identical?"

  "Because one of them is lying," Mara said quietly. "If they're truly the same, why does the pre-data resist one of them? That mismatch shouldn't exist if the underdetermination is absolute. It means the symmetry is broken somewhere we haven't looked yet. Not in the physics. In the logic."

  Halloway was silent for a long moment. He reached out, hovering his finger over the mouse, then pulled back. "You realize if you publish this, you're claiming to have solved a philosophical impasse with a script. People will tear you apart. They'll say you've just defined 'truth' as 'mathematical convenience'."

  "Maybe truth is convenient," she said. "Maybe the universe doesn't like waste."

  He shook his head, grabbing his keys again. "Get some sleep, Mara. Run it again tomorrow. With a differant seed. If the mismatch stays... then we talk."

  He walked to the door, but paused with his hand on the frame. He didn't look back. "But don't get your hopes up. Sometimes a glitch is just a glitch."

  When the door clicked shut, Mara turned back to the screen. She ran the seed again. The progress bar crawled across the bottom, agonizingly slow. She watched the cursor blink, counting the seconds, waiting to see if the red line would straighten out or if it would keep screaming that the symmetry was a lie.

  The bar finished. The graph populated.

  The red line spiked again, exact same place.

  Mara exhaled, a shaky breath she didn't realize she'd been holding. She reached for her coffee, found it cold, and drank it anyway. The masks weren't the same. One of them was heavier than the other.
