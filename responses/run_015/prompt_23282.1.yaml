prompt: |-
  I just spent like an hour going back and forth with my friend on this and I'm not sure who's right. He's trying to figure out what his girlfriend actually wants about moving to a different city, and he's convinced he can't just take her word for it because people dont really know what they want, so instead he's been watching what she does — what she looks at, what she saves, how she reacts when it comes up — and he's sure her real preference will show through in her behavior. His rule is basically words are cheap, actions tell the truth. Something feels off about that to me but I can't pin it down. She does keep changing her story, but she also knows he's watching, and a lot of what she does might be her performing for him or just habit and have nothing to do with what she actually wants. Is his approach actually sound or am I the one missing something?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Situation:**
      *   **The Conflict:** The user and their friend are debating how to determine the girlfriend's true preference about moving to a different city.
      *   **The Friend's Stance:** "Words are cheap, actions tell the truth." He believes people don't know what they want, so he's ignoring her verbal statements and analyzing her behavior (what she saves, looks at, reactions). He thinks this reveals her *real* preference.
      *   **The User's Intuition:** Something feels off. The girlfriend changes her story, *but* she knows he's watching. Her actions might be performance, habit, or reactive, not indicative of true desire.
      *   **The Core Question:** Is the friend's approach sound, or is the user missing something?

  2.  **Evaluate the Friend's Philosophy ("Actions over Words"):**
      *   *Validity:* There is truth to this. Cognitive dissonance, subconscious desires, and fear of commitment often lead people to say one thing and do another.
      *   *Limitations:* In a relationship context, specifically regarding a major life decision like moving, this approach is fraught with danger.
      *   *The "Hawthorne Effect":* The user mentioned she *knows* he's watching. This is crucial. When people know they are being observed, they change their behavior. This invalidates the "pure data" aspect of his observation.
      *   *Ambiguity of Action:* Saving a Zillow link doesn't mean "I want to move." It could mean "I'm curious," "I'm anxious," "I'm trying to please him," or "I'm looking for reasons *not* to move."
      *   *Agency & Consent:* Treating a partner like a puzzle to be solved rather than a person to be communicated with is objectifying. It removes her agency to state her needs.

  3.  **Evaluate the Girlfriend's Behavior:**
      *   *Changing Her Story:* This indicates ambivalence, fear, or external pressure. It doesn't necessarily mean she's lying; it means she's conflicted.
      *   *Performing:* If she knows he's analyzing her, her actions are no longer authentic indicators of desire; they are indicators of *relationship management*.

  4.  **Identify the Underlying Issues:**
      *   **Trust:** He doesn't believe her words. Why?
      *   **Communication:** They aren't talking *about* the conflict; they are talking *past* each other (her speaking, him observing).
      *   **Power Dynamic:** He has positioned himself as the arbiter of her "true" feelings, which is paternalistic.
      *   **Decision Fatigue:** Moving is huge. Ambivalence is normal.

  5.  **Formulate the Argument:**
      *   *Validate the User:* Their intuition is correct. The friend's approach is flawed in this specific context.
      *   *Nuance the "Actions vs. Words" rule:* It works for habits (e.g., saying you're healthy but eating junk), but not for complex, future-oriented emotional decisions.
      *   *Highlight the "Observation Bias":* She knows she's being watched. This creates performance, not truth.
      *   *Point out the Risk:* If he moves her based on his interpretation of her "actions," and she's unhappy, he will blame her ("but you looked at apartments!"), and she will feel violated ("I never said I wanted to go!").
      *   *Suggest a Better Path:* Direct communication about the *ambivalence*, not the *decision*.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Validate the user. Something *is* off.
      *   *Deconstruct the Friend's Logic:* Acknowledge where it comes from (psychological truth) but why it fails here (complexity of moving, observation effect).
      *   *The "Hawthorne Effect":* Explain that being watched changes behavior.
      *   *Interpretation of Actions:* Saving a link $\neq$ wanting to move. It could be anxiety.
      *   *The Relationship Dynamic:* This is controlling/manipulative, even if unintentional. It undermines trust.
      *   *The "Changing Story" Aspect:* Explain that ambivalence is normal for big decisions. It's not necessarily deception.
      *   *Conclusion/Advice:* The friend needs to talk *with* her, not *about* her.

  7.  **Refining the Tone:**
      *   Needs to be empathetic but firm.
      *   Avoid diagnosing the friend (e.g., "he's a narcissist"), but describe the *behavior*.
      *   Focus on the practical outcome: This method leads to resentment.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I address the "people don't know what they want" point?
      *   *Adjustment:* Yes, acknowledge that people are conflicted, but that doesn't mean their words are worthless. It means the conversation needs to be deeper.
      *   *Check:* Did I address the "changing story"?
      *   *Adjustment:* Frame this as anxiety/pressure, not necessarily deceit.

  9.  **Final Output Generation:** (This matches the structure of the provided good response.)
      *   Validate intuition.
      *   Break down why "Actions > Words" fails here.
      *   Discuss the "Observer Effect."
      *   Discuss the ambiguity of actions.
      *   Address the relationship dynamic (trust/agency).
      *   Provide a constructive alternative.

  *(Self-Correction Note)*: Make sure not to take sides on whether they *should* move. The issue is *how* they are deciding. Keep the focus on the decision-making process.

  10. **Final Review against Safety Guidelines:** No harmful advice. Encourages communication and consent. Safe.

  *(Proceed to generate response based on these thoughts.)*
answer: |-
  Your intuition is spot on. While your friend's philosophy sounds pragmatic on the surface ("actions speak louder than words"), applying it to a high-stakes relationship decision like moving is fundamentally flawed and potentially damaging.

  Here is why your friend's approach is unsound in this specific context, and why you aren't missing anything.

  ### 1. The "Observer Effect"
  You hit the nail on the head when you mentioned **she knows he's watching.** In psychology, this is similar to the Hawthorne Effect: when people know they are being observed, they alter their behavior.

  If she knows he is scrutinizing her clicks, saves, and reactions to determine her "true" will, her actions are no longer organic expressions of desire. They become **relationship management.**
  *   She might save an apartment link not because she wants to move, but because she wants to show him she's "trying."
  *   She might hesitate when discussing the city not because she doesn't want to go, but because she sees him tense up and is afraid of his reaction.

  By treating her like a subject in an experiment, he has contaminated the data. He isn't seeing what she wants; he's seeing how she reacts to his pressure.

  ### 2. Ambiguity of Action
  "Actions speak louder than words" works well for habits (e.g., someone says they value health but smokes a pack a day). It does not work well for complex, future-oriented emotional decisions.

  Actions regarding a move are incredibly ambiguous:
  *   **Looking at houses:** Could mean excitement, could mean anxiety, could mean looking for reasons *not* to move.
  *   **Reacting emotionally:** Could mean fear of leaving, could mean fear of staying.
  *   **Changing her story:** This doesn't necessarily mean she's lying. Moving is a massive life disruption. It is normal to be ambivalent. She might want the *benefits* of the move (career, change of pace) but fear the *cost* (leaving family, unknown environment). That isn't deceit; that's being human.

  Your friend is interpreting ambiguous signals as concrete data. He is assigning meaning to her behavior that she may not intend.

  ### 3. It Removes Her Agency
  This is the most critical ethical point. By deciding that he knows what she wants better than she does, your friend is effectively **overriding her consent.**

  If they move, and he justifies it by saying, "I know you said you were scared, but I saw you saved that Zillow link, so I knew you really wanted this," he is setting a trap.
  *   **If she is happy:** He will claim he was right to ignore her words.
  *   **If she is unhappy:** He will blame her. "But your actions showed you wanted this."

  This creates a "double bind." Her words are dismissed as confusion, and her actions are interpreted as confirmation of his desires. She is left with no way to authentically communicate a "no."

  ### 4. It Erodes Trust
  A relationship relies on the premise that when a partner speaks, they are heard. Your friend's rule ("words are cheap") essentially tells her: **"I do not believe you."**

  Even if he is right that she is conflicted, the solution isn't to become a detective. The solution is to create safety so she can admit the conflict.
  *   **Current Dynamic:** He is hunting for the truth. She is performing or protecting herself.
  *   **Healthy Dynamic:** He acknowledges the difficulty. "I hear you saying you're unsure, and I see you looking at houses. It sounds like you're torn. Let's talk about the torn part."

  ### The Verdict
  You aren't missing anything. Your friend is trying to solve an emotional problem with a logic puzzle.

  People often *don't* know what they want, yes. But you don't solve that by ignoring their words and stalking their behavior. You solve it by having deeper conversations about **why** they are conflicted.

  If he proceeds based on his interpretation of her "actions," he isn't moving with his girlfriend; he's moving with a character he has invented in his head. That is a recipe for resentment, not a fresh start.

  **Advice for your friend:** Tell him to stop watching her browser history and start asking her open-ended questions about her fears. If he can't trust her words, they have a trust issue, not a moving issue.
