answer: |-
  Here is a complete design for the 90-minute session. It is built to be run with zero tech, zero budget, and maximum friction against the "I know this already" reflex.

  ### Workshop Title: **The Edit Trap**
  **Subtitle:** *Why the story gets cleaner than the truth.*

  ---

  ### 1. Materials List (Printable)
  You need to prepare four distinct packets. Since you have 6 tables of 4, print 24 of each.

  *   **Packet A: The Case File (Background).** One page. Describes "Project Aegis" (a fictional AI safety protocol launch). Includes 5 bullet points of ambiguous context (e.g., "Competitor X is launching next month," "Beta test showed minor glitches," "CEO calls it 'revolutionary'").
  *   **Packet B: The Verdict (The Twist).** Two versions.
      *   *Version Success (3 tables):* "Aegis approved by regulators. Stock up 20%."
      *   *Version Failure (3 tables):* "Aegis rejected by regulators. Stock down 20%."
      *   *Note:* Seal these in envelopes or place face down.
  *   **Packet C: The Notebook Dump.** One page. 500 words of raw, messy notes. Includes 3 "near-miss" facts that contradict the main narrative (e.g., "Source hinted regulation might be delayed," "Analyst said market reaction is 'overblown'").
  *   **Packet D: The Score Sheet.** (See template below).

  ---

  ### 2. Minute-by-Minute Timeline

  | Time | Activity | Instruction |
  | :--- | :--- | :--- |
  | **00-05** | **The Hook** | No intro. Hand out **Packet A**. "Read. Don't discuss." |
  | **05-10** | **The Bet** | On Score Sheet: Predict the outcome (Success/Failure). Mark **Confidence %** (50-100%). Collect sheets? No, they keep them. |
  | **10-15** | **The Reveal** | Hand out **Packet B** (Verdict). Half the room gets Success, half Failure. "This is what happened. You have 2 minutes to let it sink in." |
  | **15-30** | **The Explanation** | Hand out **Packet C** (Notes). Task: Write a 200-word explanation of *why* the verdict happened using these notes. |
  | **30-45** | **The Compression** | Task: Cut that explanation down to **75 words** for a newsletter brief. You must cut facts to fit. |
  | **45-50** | **The Memory Check** | On Score Sheet: "What was your *original* confidence % before you knew the verdict?" (They will lie to themselves). |
  | **50-90** | **The Debrief** | Data collection, board work, discussion (scripted below). |

  ---

  ### 3. The Score Sheet (Photocopy Master)

  ```text
  WORKSHOP SCORE CARD — DO NOT SHARE

  PART 1: THE PREDICTION (Minute 10)
  My Prediction: [ ] Success   [ ] Failure
  My Confidence: ______ %

  PART 2: THE MEMORY CHECK (Minute 50)
  Recall: What confidence % did you write above?
  My Recalled Confidence: ______ %

  PART 3: THE EDIT (Minute 45)
  Count how many "ambiguities" (e.g., "might," "possibly," "one source said") 
  remain in your 75-word version: ______

  PART 4: THE FEELING
  On a scale of 1-5, how inevitable does the outcome feel now?
  [1] Coin Flip  [5] Foregone Conclusion
  ```

  ---

  ### 4. Expected Data & Success Criteria
  You need to know what "working" looks like so you aren't improvising the analysis.

  **A. Hindsight Bias (The Memory Check)**
  *   **The Metric:** Compare *Original Confidence* (Part 1) vs. *Recalled Confidence* (Part 2).
  *   **Expected Result:** 70% of participants will "recall" a higher confidence than they actually wrote. Average inflation should be +15 to +20 percentage points.
  *   **Success:** If the average inflation is <5%, the exercise flopped (they didn't commit to the uncertainty). If >30%, they feel patronized. Aim for the 15-20% "creep."

  **B. Narrative Fallacy (The Compression)**
  *   **The Metric:** Count the "ambiguities" cut from the 200-word draft to the 75-word draft.
  *   **Expected Result:** The 200-word draft will have ~5-8 qualifiers. The 75-word draft will have 0-1.
  *   **Success:** If they keep the qualifiers in the 75-word version, they didn't feel the pressure of the constraint. You want them to say, "I had to kill the nuance to make it fit."

  **C. The Fake Outcome (The Verdict)**
  *   **The Metric:** Compare the "Inevitability Score" (Part 4) between the Success tables and Failure tables.
  *   **Expected Result:** There should be **no statistical difference**. Both groups should rate the outcome as equally inevitable (avg 4 or 5 out of 5).
  *   **Success:** If the "Failure" group says "This was obvious" and the "Success" group says "This was obvious," the machinery is working.

  ---

  ### 5. The Debrief Script (40 Minutes)
  *Do not stand at the front. Sit on a table edge. Draw three columns on the whiteboard: **Memory**, **Story**, **Truth**.*

  **Phase 1: The Memory (Hindsight Bias)**
  *   **Action:** Ask for a show of hands: "Who recalled a higher confidence than they actually wrote?"
  *   **The Point:** "This is **Hindsight Bias**. It is a physiological memory error. Once your brain knows the answer, it rewrites the history of your uncertainty to match. You aren't lying; your hippocampus is editing the file to save energy. It's a bug in the hardware."
  *   **Key Distinction:** This is about *you*. It's internal.

  **Phase 2: The Story (Narrative Fallacy)**
  *   **Action:** Ask the "Success" tables to read their 75-word versions. Then ask "Failure" tables.
  *   **The Point:** "You had the same facts. You wrote opposite truths. Both sounded confident. This is the **Narrative Fallacy**. It is not a memory error; it is a structural requirement. To make a story fit 75 words, you *had* to delete the forks in the road. Ambiguity is heavy; certainty is light. Journalism rewards light."
  *   **Key Distinction:** This is about the *format*. It's external.

  **Phase 3: The Collision**
  *   **Ask:** "Which one is more dangerous for your readers?"
  *   **Goal:** Guide them to see that Hindsight makes *them* feel sure, but Narrative makes *the reader* feel sure. The combination is toxic.

  ---

  ### 6. Handling the "I Know This" Participant
  At minute 10, someone will say: *"Yeah, we know this. It's hindsight bias. Fischhoff, 1975."*

  **Do not argue.** Do not define the term.
  **Say:** "Perfect. You know the name. I'm not interested in the name. I'm interested in the magnitude. On your score sheet, I want you to track exactly how many percentage points your brain lies to you today. If you're immune, your delta should be zero. Let's see if the data supports that."

  *Why this works:* It challenges their ego without challenging their knowledge. It turns the workshop into a calibration test for *them*, not a lesson from *you*.

  ---

  ### 7. Actionable Takeaway (For Monday)
  **The "Graveyard Document."**
  Tell them: "When you file your story, save a second version called '_GRAVEYARD'. In that version, paste the quotes, the data points, and the near-misses you cut to make the narrative flow. Keep it in the same folder. When your editor asks 'Are you sure?', or when the story breaks the other way in six months, open the Graveyard. It proves you knew the uncertainty existed, even if the published piece couldn't hold it."

  *Why:* It doesn't ask them to change the published story (which editors won't allow). It asks them to change their *archive*. It preserves the truth without breaking the narrative constraint.

  ---

  ### 8. Limitations (What This Can't Show)
  You must say this out loud in the last 5 minutes, or they will leave cynical.

  1.  **Causality is Real:** "This exercise uses a fictional case where the outcome was arbitrary. In real science reporting, causality *exists*. Smoking causes cancer. CO2 warms the planet. The Narrative Fallacy doesn't mean causality is a myth; it means our *confidence* in explaining the specific path is often inflated. Don't leave here thinking all explanation is fiction."
  2.  **The "Live" Constraint:** "We used a fictional case today so we could control the data. In your real work, you can't hand the universe a sealed envelope. You have to hunt for the 'near-misses' actively. They won't volunteer themselves."
  3.  **The Ethical Bind:** "I asked you to cut nuance to fit a word count. In reality, if the nuance changes the meaning, you shouldn't cut it—you should fight for the word count. The exercise shows you the *pressure*, not the *right move*."

  ### 9. Why I Changed Your "Real World Prediction" Idea
  *Note for the facilitator:* You mentioned wanting predictions "resolvable by lunch." I strongly advise against relying on this for the core data.
  *   **Reason:** If the real-world event doesn't resolve (e.g., the keynote speaker doesn't show up, the vote is tied), your debrief collapses.
  *   **Compromise:** If you need that "live" feel, add a **Room Wager** at Minute 0. "Will the facilitator use the whiteboard? Yes/No + Confidence." Resolve it at Minute 85. Use this *only* for vibe, not for the main data analysis. Rely on the **Project Aegis** case for the hard numbers. It ensures the "Fake Outcome" twist works cleanly.

  ### 10. Facilitator Cheat Sheet (The "Tell")
  *   **When distributing Packet B (Verdict):** Do not make eye contact. Hand them the envelope silently. If they ask "Is this real?", say "Treat it as fact for the exercise."
  *   **During Compression:** Walk around. If you see a table keeping ambiguity in the 75-word version, say nothing. You need them to fail this constraint to make the point in the debrief.
  *   **During Data Reveal:** If the Hindsight Bias numbers are low (they didn't lie about their confidence), pivot to the Narrative data. "Okay, your memories are honest. But look at your copy. You still killed the nuance. The bias isn't in your head; it's in the word count."
