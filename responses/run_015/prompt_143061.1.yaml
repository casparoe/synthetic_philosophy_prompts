  Here is the breakdown of the principle she is running, the competing rules, and the case that would finally force her hand.

  ### 1. The Principle: Non-Branching Gradualist Continuity
  Dr. Vance appears to operate on a principle of **Non-Branching Gradualist Continuity**. This is a hybrid view that combines Lockean psychological continuity with a spatio-temporal constraint on the *vehicle* of that continuity.

  *   **Psychological Continuity:** Like Case 5 (the 40-year turnover), she holds that identity is preserved through overlapping chains of memory and character.
  *   **The Gradualist Constraint:** Unlike a pure Functionalist, she seems to require that the physical substrate supporting that psychology be replaced piecemeal, maintaining an unbroken causal chain. This explains why she accepts the 40-year turnover (natural gradualism) and the 19-month replacement (artificial gradualism) but avoids teleportation or instant uploading (instantaneous replacement).
  *   **The Non-Branching Constraint:** Like Case 4 (fission) and Case 1 (split signal), she holds that identity is a "one-to-one" relation. If the chain branches, identity dissolves (though "what matters" may survive). If the chain remains linear, identity holds.

  Under this principle, the "Month 11" glitch (prosopagnosia and memory thinning) is treated as noise within the continuum, analogous to a stroke from which one recovers, or even the natural forgetfulness admitted in Case 5. Because the patient remained conscious, the causal chain was never severed, only perturbed.

  ### 2. Alternative Principles Fitting the Six Verdicts
  Two other principles fit her past record almost as well but diverge on this new case:

  *   **Principle B: Strict Biological Essentialism.**
      *   *The Rule:* You are your specific biological brain tissue. If that tissue is destroyed, you die, regardless of functional continuity.
      *   *Fit:* Explains Case 1 & 2 (brain moves, you move), Case 3 (cortex dies, you die), and her avoidance of uploading (biological destruction). Case 5 is compatible if one assumes natural cell turnover doesn't count as "destruction" of the essential biological entity.
      *   *Prediction for 19-Month Case:* **Death.** The original biological cortex is entirely removed. The legatee is a new entity. The brother wins.

  *   **Principle C: Pure Psychological Functionalism.**
      *   *The Rule:* You are the pattern of information and consciousness. The substrate (biology vs. synthetic) and the speed of transfer (gradual vs. instant) are irrelevant.
      *   *Fit:* Explains Case 1, 2, 4, 5, and 6. It struggles slightly with Case 3 (why is the unconscious organism not him? Because the pattern is gone) and her avoidance of teleportation (which this principle would typically accept).
      *   *Prediction for 19-Month Case:* **Survival.** (Same as Vance). However, it would *also* predict survival in instant replacement cases, which Vance avoids.

  ### 3. Which Precedent She Will Lean On
  She will lean heavily on **Case 5 (the 40-year turnover)** and explicitly distinguish **Case 3 (cortical destruction)**.

  *   **Why Case 5:** Both cases involve a total turnover of the material basis of the mind over time while preserving function. She will argue that 19 months is simply an accelerated version of 40 years. The "synthetic" nature of the graft is irrelevant because, as established in Case 3 ("we are not organisms"), we are not defined by our biology *per se*, but by the capacity for consciousness housed in the brain.
  *   **Why Not Case 3:** The defense will cite Case 3 to argue the "person is gone" when the cortex is removed. Vance will reject this by noting that in Case 3, the function was *lost* (permanent unconsciousness). In the 19-month case, function is *transferred*. The "Month 11" glitch will be dismissed as a temporary functional dip, not the permanent cessation seen in Case 3.

  ### 4. Determinacy of the Answer
  She will state that there **is a determinate answer**. She only declares questions "ill-posed" or claims "no further fact" when the physical continuity branches (Case 1 split signal, Case 4 fission). In the 19-month case, the line of succession is linear and unique. There is no rival claimant emerging from the procedure. Therefore, identity is preserved.

  ### 5. The Discriminator Case
  You asked whether the case that would genuinely settle the matter is the **one-shot version** of the same operation or something else.

  It is, in fact, the **one-shot version**.

  Here is why: The 19-month case currently separates *Biological Essentialism* (Principle B) from *Gradualist Continuity* (Vance's Principle). If she rules Survival, she rejects Biological Essentialism. But this leaves open the question: Does she accept Survival because of the *Gradualism* or because of the *Function*?

  The **One-Shot Cortical Replacement** (instant removal of the biological cortex and instant installation of the synthetic equivalent) is the single case that separates **Gradualist Continuity** from **Pure Functionalism** (Principle C).

  *   **If she rules Survival on the One-Shot:** She is a Pure Functionalist. Her past avoidance was merely prudential or aesthetic.
  *   **If she rules Death on the One-Shot:** She is a Gradualist. The *process* of replacement is constitutive of identity, not just the outcome. This confirms that her avoidance of teleportation/uploading is principled, not coy.

  There is no "something else" that isolates this variable more cleanly. A "paused" replacement tests temporal continuity, but the One-Shot tests the necessity of the continuum itself. Given that she has pointedly avoided ruling on instant destruction/replacement, submitting the One-Shot case to her would force her to reveal whether she believes identity is a *state* (Function) or a *history* (Gradualism).

  **Summary for your group:** Expect a verdict of **Survival** based on the **40-year turnover precedent**. The "Month 11" glitch will be deemed irrelevant. To truly test her philosophy, do not ask about fission or biology; ask her to rule on the **instant** version of this same surgery. That is the only question she cannot answer without abandoning either her avoidance strategy or her gradualist principle.
