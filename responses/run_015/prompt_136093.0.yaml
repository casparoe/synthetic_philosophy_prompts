prompt: |-
  Please argue for the following position about the principle of procreative beneficence — the view that, when prospective parents can choose among the possible children they might have, they morally ought to select the one whose life is expected to go best. The position is that the principle is self-undermining once universalized, in roughly the way an arms race is.

  Develop the argument in three steps. First, argue that much of the expected-welfare gain that makes the principle attractive comes from traits whose value is at least partly positional — height, cognitive ability, competitive temperament, resistance to locally prevalent disease — so that what a selected child gains depends on how others turn out. Second, argue that if nearly all parents select, the resulting population-level shift cancels the comparative advantage that justified each individual selection, while each parent's reason to keep selecting remains as strong as ever, since a parent who unilaterally opts out foreseeably disadvantages their own child. Third, rebut the strongest available reply: that the principle should be restricted to non-positional components of welfare, such as freedom from suffering or longevity. Argue that this restriction either collapses the principle into the uncontroversial duty to avoid serious disease, forfeiting whatever made it distinctive, or else smuggles positional goods back in under another description.

  Conclude by stating precisely what a defender of procreative beneficence would have to give up if the argument succeeds.
reasoning: |-
  Here's a thinking process that leads to the argument above:

  1.  **Analyze the Request:**
      *   **Topic:** The Principle of Procreative Beneficence (PPB).
      *   **Position to Argue:** PPB is self-undermining when universalized (similar to an arms race).
      *   **Structure:** Three specific steps + Conclusion.
          1.  Argue that much of the welfare gain comes from *positional* traits (height, IQ, temperament, disease resistance).
          2.  Argue that universal adoption cancels comparative advantage, creating a Prisoner's Dilemma/Arms Race dynamic (individual rationality vs. collective sub-optimality).
          3.  Rebut the reply that restricts PPB to *non-positional* goods (suffering, longevity), arguing this either makes PPB trivial or smuggles positional goods back in.
      *   **Conclusion:** State precisely what a defender of PPB must give up if the argument succeeds.

  2.  **Deconstruct Step 1: Positional Nature of Traits.**
      *   *Goal:* Show that the "best life" often depends on being *better than others*, not just absolute well-being.
      *   *Key Examples:* Cognitive ability (jobs are competitive), Height (social/romantic advantage), Disease resistance (relative immunity in a pandemic context), Temperament (competitiveness helps in capitalist structures).
      *   *Logic:* If everyone is taller, being tall loses its advantage. If everyone is smarter, the job market adjusts. The value is often relative (positional), not absolute.
      *   *Connection to PPB:* PPB urges parents to maximize expected welfare. If welfare depends on relative standing, parents are urged to maximize relative standing.

  3.  **Deconstruct Step 2: The Arms Race/Universalization Problem.**
      *   *Goal:* Show the collective outcome of individual rational choices.
      *   *Scenario:* If *all* parents follow PPB, everyone selects for higher IQ/height/etc.
      *   *Result:* The baseline shifts. The "average" goes up. The *relative* distribution remains largely the same (or the competition intensifies).
      *   *The Trap:* No one is actually better off in terms of relative welfare, but everyone incurred the costs/risks of selection (IVF, genetic screening, ethical costs).
      *   *Individual Incentive:* Even knowing this, a single parent cannot opt out. If they do, their child is relatively disadvantaged compared to the enhanced peers.
      *   *Analogy:* Standing up at a concert. If one stands, they see better. If all stand, no one sees better, but everyone is less comfortable.
      *   *Conclusion of Step:* PPB drives a race that neutralizes the benefit it seeks.

  4.  **Deconstruct Step 3: Rebutting the "Non-Positional" Restriction.**
      *   *The Objection:* "PPB only applies to absolute goods like health, pain avoidance, and longevity, not IQ or height."
      *   *Counter-Argument A (Triviality):* If PPB is just "don't cause suffering" or "avoid serious disease," it's not a *new* or *distinctive* principle. It collapses into the standard non-maleficence or basic beneficence. Savulescu (originator of PPB) intended it to be more demanding (selecting the *best*, not just avoiding the *bad*).
      *   *Counter-Argument B (Smuggling):* Even "absolute" goods often function positionally. Longevity matters for pension competition. Health matters for workforce competition. "Freedom from suffering" is vague; resilience to stress is often competitive.
      *   *Refinement:* Focus on the idea that "expected welfare" in a social context is inherently comparative. You can't easily slice off the positional part without losing the "maximization" aspect of PPB.

  5.  **Drafting the Conclusion:**
      *   *Goal:* Summarize the cost to the PPB defender.
      *   *Requirement:* Be precise.
      *   *Content:* They must give up the claim that PPB is a *general* moral obligation applicable to enhancement traits. They must admit it leads to collective irrationality. They must either weaken it to triviality or accept the arms race.

  6.  **Review and Refine (Self-Correction during drafting):**
      *   *Tone:* Philosophical, rigorous, persuasive.
      *   *Check:* Did I follow the three-step structure exactly? Yes.
      *   *Check:* Is the "arms race" analogy clear? Need to ensure the link between "positional goods" and "arms race" is explicit.
      *   *Check:* Is the rebuttal strong enough? I need to make sure I don't just say "health is positional" (which is weak) but rather that the *value* of health in a society is often tied to competitive functioning. Or, stronger: that restricting PPB to non-positional goods strips it of its controversial force (selecting the *best* vs. avoiding the *worst*).
      *   *Nuance:* Acknowledge that PPB proponents (like Savulescu) might argue about "absolute" well-being. The argument needs to show why that defense fails under the specific constraints of the prompt.

  7.  **Final Polish:** Check transitions between paragraphs. Ensure the conclusion lands the specific "what must be given up" requirement. (e.g., They must give up the claim that PPB is a *coordination-proof* moral principle).

  *(Self-Correction on Step 3)*: I need to be careful not to argue that *all* health is positional. Instead, argue that the *restriction* creates a dilemma: either PPB becomes "avoid serious disability" (which is old news) or it tries to maximize "absolute health" which inevitably impacts social standing, reintroducing the arms race. Actually, the prompt suggests arguing that the restriction "collapses the principle into the uncontroversial duty to avoid serious disease... or else smuggles positional goods back in." I will follow that instruction closely.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  The Principle of Procreative Beneficence (PPB), most famously articulated by Julian Savulescu, asserts that prospective parents have a moral obligation to select the child, among possible children they could have, who is expected to have the best life. While intuitively appealing as an extension of parental duty, the principle faces a structural problem when scaled from individual decision-making to collective practice. The following argument demonstrates that PPB is self-undermining once universalized, functioning less like a moral imperative and more like a coordination failure akin to an arms race.

  **Step 1: The Positional Nature of Expected Welfare**
  The initial plausibility of PPB rests on the assumption that "the best life" is a function of absolute goods—that a child with higher cognitive ability or better health will necessarily fare better regardless of the social context. However, a significant portion of the welfare gains parents seek through selection derives from traits whose value is at least partly positional. A positional good is one whose value depends not on its absolute level, but on how it compares to the level others possess.

  Consider cognitive ability. In a competitive labor market, the economic value of a high IQ is largely determined by where an individual stands relative to other applicants. If a parent selects an embryo for higher predicted intelligence, they are securing a comparative advantage in education and employment. Similarly, traits like height, physical attractiveness, and even a competitive temperament confer social and reproductive advantages primarily because they are scarce. Even resistance to disease can function positionally; in a pandemic, being immune is advantageous specifically because others are susceptible. If the "expected welfare" PPB urges parents to maximize is largely constituted by social success, resource acquisition, and status, then the value of the selected traits is inherently relational. Parents are not merely selecting for "health" in a vacuum; they are selecting for a child who will outperform their peers. Consequently, the moral force of PPB relies heavily on goods that derive their worth from inequality.

  **Step 2: The Universalization Trap and the Arms Race**
  If PPB is adopted as a universal moral norm, the positional nature of these traits generates a collective action problem. If nearly all parents follow PPB and select for higher cognitive ability, height, or competitiveness, the population baseline for these traits shifts upward. The result is a "red queen" effect: everyone runs faster just to stay in the same place. The comparative advantage that justified the individual selection is canceled out at the population level. If everyone is taller, being tall no longer confers a social advantage; if everyone has a higher IQ, the job market recalibrates its requirements, leaving the relative hierarchy unchanged.

  Despite this collective nullification, the individual incentive to follow PPB remains undiminished, creating a dynamic identical to an arms race or the Prisoner's Dilemma. Consider a parent contemplating whether to opt out of selection. If the rest of society is enhancing their children, the parent who unilaterally opts out foreseeably disadvantages their own child, condemning them to compete with enhanced peers using unenhanced traits. Thus, even if parents recognize that universal selection yields no net gain in social welfare, rational adherence to PPB compels them to continue selecting. The principle drives a cycle where parents incur the financial, physical, and ethical costs of genetic selection without achieving the intended increase in overall well-being. The universalization of PPB undermines its own goal: by striving for the best life for each child individually, parents collectively create a world where no child is objectively better off than they would have been without selection, yet all are subject to the pressures of a heightened competitive baseline.

  **Step 3: Rebutting the Non-Positional Restriction**
  A defender of PPB might reply that the principle should be restricted to non-positional components of welfare, such as freedom from pain, basic health, or longevity, thereby avoiding the arms race dynamic. This restriction, however, fails on two counts. First, it collapses PPB into the uncontroversial and pre-existing duty to avoid serious disease and suffering. If PPB merely dictates that parents should not select for disabilities or conditions that cause agony, it loses its distinctive normative force. The controversy and novelty of PPB lie in its demand to select the *best* among the *good*, pushing for enhancement rather than mere therapy. Restricting it to non-positional goods strips it of this ambition, rendering it a redundant restatement of the principle of non-maleficence.

  Second, attempting to maximize non-positional goods inevitably smuggles positional goods back in under another description. "Longevity" and "health" are not experienced in a social vacuum. A longer life is valuable partly because it allows for more career accumulation and pension drawdown relative to others; robust health is valuable because it ensures consistent workforce participation. If parents select for extreme longevity in a world of finite resources and retirement ages, they are effectively selecting for a competitive advantage in resource distribution. Furthermore, psychological resilience (freedom from suffering) is often valuable precisely because it allows a child to withstand competitive pressures better than their peers. One cannot cleanly slice the "absolute" welfare of a child from their social functioning. Therefore, even a restricted PPB either becomes trivial or inevitably reintroduces the positional competition that drives the arms race.

  **Conclusion**
  If this argument succeeds, a defender of the Principle of Procreative Beneficence must give up the claim that PPB is a stable, universalizable moral obligation applicable to enhancement traits. They must concede that PPB cannot function as a general guide for procreation in a coordinated society without generating collective sub-optimality. Specifically, they must abandon the assertion that individual rationality in embryo selection aligns with the collective good. To maintain the principle, they would have to accept that parents are morally required to participate in a socially wasteful arms race, or else they must weaken the principle until it is indistinguishable from the basic duty to avoid causing harm, forfeiting its status as a distinct ethical framework for human enhancement.
