      *   *Colleague's Point:* Popper assumes a liberal marketplace of ideas. Atwood shows a society where the "marketplace" was already skewed by patriarchy/tech/capitalism before the coup. The "ratchet" (speech ok, power no) fails because speech *was* the power (Serena Joy).

  3.  **Drafting the Scenes (Task 1):**
