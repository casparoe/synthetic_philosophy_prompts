answer: |-
  Dear Colleague,

  I have been reflecting on your defense of non-reductive physicalism via the constraint-based framework, and while I find the intuition compelling, I think you are asking for the conditions under which it fails rather than a rehearsal of its strengths, so I will proceed directly to the vulnerabilities. The most fatal defeater for your position lies in the relationship between physical determinism and the closure principle. Your model relies on the idea that mental properties act as selection filters among physically sufficient trajectories, but this presupposes that there are multiple physically possible trajectories available for selection at the moment of causation. If the physical world is deterministic in the strong sense, meaning that the state of the universe at time t plus the laws of physics necessitates exactly one state at time t plus one, then there are no alternative trajectories for a mental constraint to select. In such a world, the physical base is not just sufficient but necessitating, leaving no logical room for a higher-level constraint to do any work without contradicting the physical laws. For your view to hold, the physical domain must be indeterministic or at least underdetermined by microphysical laws alone, such that boundary conditions are not themselves fully fixed by prior physical states. If future physics confirms a hard deterministic closure where initial conditions and laws fix all subsequent states without gaps, your constraint model collapses into epiphenomenalism because the selection filter would be redundant; the physics would have already selected the only possible trajectory.

  A secondary but still devastating issue concerns the supervenience relation and the determinable-determinate distinction. You posit that mental properties are constraints on physical processes, but in standard non-reductive physicalism, mental properties supervene on physical properties. If the mental property M supervenes on the physical base P, and P is sufficient for the physical effect P*, then any counterfactual dependence of P* on M is arguably just a shadow of the dependence of P* on P. For your constraint view to escape this, you must argue that M constrains P in a way that is not itself fixed by P, which risks violating supervenience or introducing downward causation that looks suspiciously like interactionist dualism. If the constraint is physically realized, then it is just part of the physical sufficient cause, and you have not escaped the exclusion argument but merely relabeled the physical cause. If the constraint is not physically realized, you face the problem of how a non-physical constraint influences physical trajectories without violating conservation laws or causal closure. The world would have to look like one where higher-level properties have modal force independent of their base, perhaps resembling a hylomorphic structure where form constrains matter without being matter, but this is a heavy metaphysical cost that many physicalists are unwilling to pay.

  Regarding counterfactual invariance, your view depends on the claim that mental properties provide a stable level of explanation where counterfactuals hold even if physical realizers vary. However, if the exclusion argument is correctly understood, it does not primarily rely on a productive model of causation as you suggest, but rather on the principle of sufficiency. Jaegwon Kim's formulation, for instance, hinges on the idea that if P is sufficient for P*, and M supervenes on P, then M is causally redundant regardless of whether we view P as producing or constraining P*. Your framing here is somewhat confused because you attribute the exclusion problem to a specific metaphysics of production, whereas the problem arises from the logic of sufficiency and supervenience. For your constraint-based escape to work, you would need to show that sufficiency is not the right metric for causal exclusion, perhaps by arguing that constraints provide a type of explanatory relevance that sufficiency misses. However, if causal efficacy is defined by making a difference to the occurrence of the effect, and the physical base already makes that difference sufficient, the constraint adds no new difference-making power. A committed defender would have to concede that if causation is purely about difference-making in a counterfactual sense, and the physical base fixes the counterfactuals, the mental constraint is inert. They might dismiss this by arguing for a pluralism of causal concepts, but this risks making the claim unfalsifiable.

  This brings me to the assessment of unfalsifiability and insulation. There is a genuine risk that your view is insulated by qualifications to the point of being metaphysically vacuous. If you define mental causation as constraint-based selection, but also insist that these constraints never violate physical closure and always supervene on physical states, it becomes difficult to specify what empirical evidence could count against the view. If every physical outcome is consistent with the mental constraint simply because the constraint is defined as selecting what actually happened, the theory risks becoming a tautology. This insulation is a vice for a metaphysical claim that aims to be naturalistic, as it disconnects the theory from empirical adjudication. A virtue of metaphysical claims is often their ability to structure empirical inquiry, but if the constraint model is compatible with any physical outcome by adjusting the description of the constraint, it loses its explanatory bite. For the view to be robust, it would need to predict situations where the mental constraint fails to select a trajectory despite physical possibility, or where physical trajectories occur without mental constraints, but given supervenience, these scenarios are hard to formulate without contradicting the core tenets of physicalism.

  Finally, regarding the ranking of defeaters, the confirmation of strong physical determinism is the most fatal, as it removes the modal space required for selection. The second most fatal is the demonstration that supervenience entails causal redundancy regardless of the production-constraint distinction, which would show that your framing does not actually address the logical core of the exclusion argument. A merely awkward defeater would be the inability to specify the mechanism of constraint without resorting to dualist-friendly language, which would force you into a awkward position of being a physicalist who speaks like a dualist. A committed defender would likely concede the determinism point and retreat to quantum indeterminacy, but they would dismiss the sufficiency critique by arguing that sufficiency is too coarse-grained a notion for mental causation. However, if the distinction between productive and constraint-based causation is not coherent within a physicalist ontology, then the entire framework rests on a category error. In physics, boundary conditions are part of the sufficient cause, not a separate metaphysical category. If you treat them as separate, you are arguably reifying a methodological distinction into an ontological one. To avoid this, you would need a theory of causation where constraints are ontologically distinct from forces, which is not standard in contemporary physics. If your framing is confused, it is in assuming that the exclusion argument relies on a productive model rather than a sufficiency model, and in assuming that constraints can be ontologically distinct from physical causes without violating closure. I hope this honest mapping helps you stress-test the position before you publish.

  Sincerely,

  A Critical Friend
