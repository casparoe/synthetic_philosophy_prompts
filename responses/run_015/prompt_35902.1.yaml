answer: |-
  Here is the specification list for any adequate theory of natural kind terms like "water."

  1.  **Internal Duplication Discrimination:** The theory must explain how Oscar and Twin Oscar, being molecule-for-molecule identical, nonetheless mean different things (H2O vs. XYZ).
      *Case:* The Twin Earth Thought Experiment.
  2.  **Historical Ignorance:** It must account for how 1750 Earthlings referred to H2O despite lacking chemical knowledge.
      *Case:* Pre-scientific Usage.
  3.  **Individual Competence:** It must allow ordinary speakers to refer successfully without knowing underlying essences.
      *Case:* The Division of Linguistic Labor.
  4.  **Temporal Continuity:** It must avoid absurd meaning-switches during gradual environmental transitions.
      *Case:* The Ten-Year Gradual Move.

  **The Critical Tension:**
  I strongly suspect **Requirement 1 (Internal Duplication)** and **Requirement 4 (Temporal Continuity)** are incompatible in a strict causal framework. This is known as the "Slow Switching" problem.

  Requirement 1 drives Externalism: meaning is determined by the actual physical environment. If Oscar stands on Twin Earth, his word "water" causally connects to XYZ. Requirement 4 drives Phenomenological Continuity: meaning shouldn't shift unnoticed during a slow transition. If Oscar moves gradually over ten years, when does the switch happen? If it happens instantly upon crossing the border, meaning changes mid-conversation without the speaker's knowledge, violating communicative stability. If it happens gradually, "water" becomes vague, undermining the rigid designation required for Requirement 1.

  Externalism secures the Twin Earth intuition but risks making meaning opaque to the speaker. Prioritizing continuity respects the speaker's perspective but risks collapsing back into internalism, failing the Twin Earth test. This tension creates a Sorites paradox for reference. Your essay should probe whether a causal theory can survive this vagueness without abandoning the core externalist insight.
