prompt: |-
  I'm on the ethics board for a small biotech charity and lately we're getting loads of proposals to fund intervetions that claim to reduce or abolish suffering — genetic edits for chronic pain, neural implants that block negative affect, that sort of thing. Someone mentioned the hedonistic imperative, the idea that we should use biotech to get rid of suffering altogether, and now I'm supposed to write recommendations for the board every few weeks but I dont really have a philosophy background and I'm writing this on my phone after a long meeting so sorry if there's a typo or two.

  Could you turn that principle into an actual decision procedure I can run? I need the steps in order: what question to ask first, what counts as a sufficient answer, where the procedure stops with a clear no, and where it hands over to me because it's a values judgement not a fact. It should handle hard cases like a gene therapy that eliminates physical pain but also blunts empathy, and a mandatory neural implant for prisonners that stops psychological suffering but raises consent issues. Apply it to three proposals: those two, plus a cheap voluntary implant for anyone that wipes grief and moral outrage — I want to see the case where the procedure probably says yes and I still dont like it. Be honest about where the procedure will misfire or just cant decide, and tell me what it cant do at all. Please write in British English.
