      *   **Solomonoff Induction:** A formal theory of prediction. It sums over all computable hypotheses weighted by $2^{-L}$, where $L$ is the length of the program (Kolmogorov complexity). Simpler programs (shorter descriptions) get higher prior probability.
      *   **Kolmogorov Complexity:** The length of the shortest program that produces a given string. Random strings have high complexity; patterned strings have low complexity.
