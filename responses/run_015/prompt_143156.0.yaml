  She is running a **Practical Necessity** rule (specifically: *Harm is permissible only if necessary; Good is obligatory only if effective*).

  Here is the breakdown of why this fits her profile better than the other options, the prediction for the inheritance, and the test case that proves it.

  ### The Principle: Practical Necessity
  Her positions look inconsistent until you apply a two-part filter:
  1.  **Positive Duties (Voting, Donating):** Governed by **Efficacy**. If your action makes no tangible difference ("lost in the noise," "never swings it"), you have no duty to do it.
  2.  **Negative Duties (Driving, Beef):** Governed by **Necessity**. If your action causes harm, it is only permissible if it is practically necessary.
      *   **Driving:** Harmful, but **necessary** for work ("to work"). Verdict: **Permissible.**
      *   **Beef:** Harmful, and **gratuitous** (you can eat plants). Verdict: **Wrong.**
      *   **Why not Complicity?** A pure Complicity rule would condemn driving (you are complicit in the oil industry) just as it condemns beef. She only excuses driving because of the *necessity* qualifier she added.
      *   **Why not Direct-vs-Diffuse?** She admits the beef purchase makes no causal difference ("restaurant wouldn't order one less"). If she were a Direct/Diffuse theorist, she should excuse the beef for the same reason she excuses the driving (diffuse impact). She doesn't.

  ### Prediction: The Index Fund
  **Verdict: She will say it is permissible to keep the money.**

  **Reasoning:** This scenario mirrors the **Driving** case, not the **Beef** case.
  *   **Harm:** Yes (fossil fuel holdings).
  *   **Efficacy:** No (slice is too small to change holdings).
  *   **Necessity/Constraint:** Yes (inherited + tax penalty makes divestment costly/structurally locked).
  Just as driving is excused because it is necessary for her livelihood, keeping the fund is excused because it is necessary to avoid financial penalty. It is a "necessary harm" within a constrained system, not a gratuitous choice like the beef.

  ### The Tie-Breaker Case
  **Case: Driving alone to a leisure event (e.g., a party or movie).**

  This single case distinguishes all three rules based on her verdict:

  1.  **If she says it's OK:** She is running **Direct-vs-Diffuse**.
      *   *Logic:* The emissions are the same as driving to work (diffuse), so the purpose doesn't matter.
  2.  **If she says it's Wrong:** She is running **Practical Necessity** OR **Complicity**.
      *   *Logic:* The harm is no longer necessary (you don't *need* to go to the party).
  3.  **To distinguish Necessity from Complicity:** Ask if she would take a **job at a fossil fuel company if it were the only way to pay rent.**
      *   **Complicity:** Wrong (You are directly participating in the harm).
      *   **Practical Necessity:** OK (Survival overrides the harm constraint).

  **Bank on Practical Necessity.** The specific qualifier "to work" in her driving argument is the smoking gun that she weighs *need* over *connection*.
