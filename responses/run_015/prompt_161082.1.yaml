          *   *Cost (a) - Objects popping in/out:* If I rearrange the atoms, the cat ceases to exist. This is Mereological Essentialism (if you keep the object) or just standard RC (the object depends on the arrangement). Actually, RC usually implies the object *ceases* to exist if the arrangement breaks. This is acceptable to most non-universalists.
          *   *Cost (b) - Vagueness:* If "arranged catwise" is vague, then existence is vague. Lewis argued this is fatal (ontic vagueness). Sider argues linguistic vagueness saves it. The cost is accepting a nuanced view of vagueness (semantic vs. ontic).
