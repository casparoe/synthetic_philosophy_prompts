prompt: |-
  I've been using a chat model to help with my historical novel, and I keep runin into this wall. If I ask it directly about the kind of thing I need — say, how the customs house in 1860s Marseille actually worked, or what the silk merchants' guilds were called — it hedges, says it doesn't know, or just makes stuff up. But if I write half a scene where a character is doing the paperwork and ask it to keep going, it spits out details that look right. And if I tell it to act like an expert on 19th century French port administration, it suddenly knows a lot, except some of it is confidently wrong. I'm starting to wonder if I'm just using it wrong. What's actually going on, and how should I set up my workfow around it?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is writing a historical novel (1860s Marseille).
      *   **Issue:** Direct factual queries ("How did the customs house work?", "What were guilds called?") result in hedging, ignorance, or hallucinations.
      *   **Observation:** Contextual/creative prompts ("Write half a scene...") yield better, more plausible details. Role-playing prompts ("Act like an expert...") yield volume but often with confident errors.
      *   **Goal:** Understand *why* this happens and establish a better workflow for historical accuracy in fiction.

  2.  **Diagnose the Underlying AI Behavior (The "Why"):**
      *   *Direct Factual Queries:* LLMs are not databases. They predict tokens based on probability. When asked a specific historical fact that isn't common knowledge (like specific 1860s Marseille customs procedures), the model's training data might be sparse. It knows it *should* know, so it either hedges (safety/accuracy tuning) or hallucinates (filling the gap with plausible-sounding text).
      *   *Creative/Scene Continuation:* This taps into the model's strength: pattern matching and narrative coherence. It's not trying to be a fact-checker; it's trying to be a *storyteller*. It draws on tropes, atmospheric details, and general historical knowledge to maintain the *feel* of accuracy. It's less concerned with strict factual fidelity and more with verisimilitude.
      *   *Role-Playing ("Act like an expert"):* This often triggers "sycophancy." The model tries to fulfill the persona. If the persona is "all-knowing expert," the model suppresses its uncertainty mechanisms, leading to confident hallucinations.
      *   *The Core Mechanism:* LLMs simulate *plausibility*, not *truth*. In a narrative context, "plausibility" aligns with the user's need for "what feels right." In a factual context, "truth" is required, which is the model's weak point.

  3.  **Formulate the Solution (The "How"):**
      *   **Acknowledge the Insight:** Validate the user's observation. They are absolutely right, and understanding this distinction is key.
      *   **Explain the Mechanism:** Briefly explain *why* the scene-based approach works better (narrative probability vs. factual retrieval).
      *   **Develop a Workflow:** Create a structured process that leverages the AI's strengths (atmosphere, procedure, dialogue, generating hypotheses) while mitigating its weaknesses (hallucination, specific facts).
      *   **Key Strategy:** "AI as Drafter/Brainstormer, Human as Verifier."

  4.  **Drafting the Workflow Steps:**
      *   *Step 1: The "Vibe" Check (Scene Generation).* Use the user's successful method. Generate scenes to get the *texture* of the history.
      *   *Step 2: Extraction & Hypothesis.* Pull out specific claims from the generated text. Treat them as *leads*, not facts.
      *   *Step 3: Verification (The Human/External Tool Layer).* This is crucial. The AI cannot verify itself. The user needs to check the leads against real sources (Google Books, academic papers, etc.).
      *   *Step 4: Iterative Refinement.* Feed the verified facts *back* into the AI to rewrite the scene with accuracy.
      *   *Step 5: Specific Prompting Techniques.* How to ask for facts without triggering hallucination? (e.g., "What are the common misconceptions?", "Give me a range of possibilities," "Cite your uncertainty").

  5.  **Refining the Advice (Nuance & Safety):**
      *   *Warning:* Emphasize that the AI is a co-writer, not a researcher.
      *   *Prompt Engineering:* Suggest prompts that encourage uncertainty ("If you aren't sure, say so").
      *   *Specific Example:* Show how to transform a bad prompt into a good workflow using their Marseille example.

  6.  **Review against Constraints:**
      *   Tone: Helpful, analytical, encouraging.
      *   Content: Address the specific Marseille/1860s context.
      *   Avoid: Don't promise the AI can be fixed to be factually perfect (it can't).

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Initial thought:* Tell them to use search engines.
      *   *Correction:* They know that. Focus on how to use the *chat model* in conjunction with research.
      *   *Initial thought:* Tell them the model is broken.
      *   *Correction:* No, the model is working as designed. It's a text predictor. Frame it as "matching the tool to the task."
      *   *Add:* Mention "RAG" (Retrieval-Augmented Generation) conceptually, even if they can't build it. They can simulate it by pasting source text.

  8.  **Final Output Structure:**
      *   Validation (You're not using it wrong, you've discovered its nature).
      *   The "Why" (Prediction vs. Retrieval).
      *   The Workflow (Generate -> Extract -> Verify -> Refine).
      *   Prompting Tactics (Uncertainty, Source Injection).
      *   Concrete Example (Marseille Customs).

  9.  (Proceed to generate response based on these points.)
answer: |-
  You are not using it wrong. In fact, you have intuitively discovered the fundamental architecture of Large Language Models (LLMs) through trial and error.

  What you are experiencing is the difference between **retrieval** (trying to access a database of facts) and **generation** (predicting the next plausible token based on patterns).

  Here is what is actually happening, why your scene-based approach works better, and how to build a workflow that leverages the AI's strengths without falling for its hallucinations.

  ### 1. The Diagnosis: Why the Direct Questions Fail

  *   **Direct Factual Queries:** When you ask, "What were the silk merchants' guilds called in 1860s Marseille?", you are treating the AI like a search engine. It is not. It is a probability engine. If that specific fact is rare in its training data, it doesn't "know" it. However, it is tuned to be helpful. So, it either hedges (safety training) or it hallucinates a plausible-sounding name (prediction training) to satisfy the request.
  *   **Role-Playing ("Act like an expert"):** This is dangerous for research. When you tell an AI to act like an expert, you override its uncertainty parameters. It prioritizes *sounding* authoritative over *being* accurate. This yields "confident wrongness," which is the hardest kind of error to catch.
  *   **Scene Continuation:** This works because you are tapping into the AI's actual strength: **Verisimilitude.** When you ask it to continue a scene about paperwork, it isn't trying to retrieve a specific fact; it is predicting what *usually happens* in stories about 19th-century bureaucracy. It draws on atmospheric patterns (ink, stamps, waiting rooms, specific jargon) that feel correct, even if the specific procedure is generalized.

  ### 2. The New Workflow: "Generate, Extract, Verify, Refine"

  You need to stop using the AI as a **Researcher** and start using it as a **Research Assistant who is brilliant but prone to lying.**

  Here is a four-step workflow tailored for historical fiction:

  #### Step 1: The "Vibe" Draft (Generation)
  Do exactly what you are doing now. Use the AI to generate scenes or procedural descriptions to get the *texture* of the history.
  *   **Prompt:** *"Write a scene where my protagonist tries to clear a crate of silk through the Marseille customs house in 1865. Focus on the sensory details: the smell of the office, the specific forms, the attitude of the clerk. Don't worry about perfect accuracy yet; focus on atmospheric plausibility."*
  *   **Why:** This gives you the narrative flow and identifies *what* you need to know (e.g., "Oh, there's a specific form mentioned here. I need to know if that form existed.")

  #### Step 2: Hypothesis Extraction
  Treat everything the AI outputs in Step 1 as a **hypothesis**, not a fact.
  *   **Action:** Read the output and highlight specific claims.
      *   *Claim:* "The clerk asks for a 'Manifeste de Douane.'"
      *   *Claim:* "The silk guild is called the 'Chambre de Commerce.'"
      *   *Claim:* "There is a tax stamp applied with red wax."
  *   **Why:** You are now using the AI to generate search terms for you, rather than answers.

  #### Step 3: External Verification (The Human Layer)
  This is the step the AI cannot do. You must take those hypotheses to Google Books, JSTOR, Wikipedia, or specialized historical forums.
  *   **Action:** Search for "Marseille customs 1860 forms," "French silk trade 19th century regulations," etc.
  *   **Result:** You might find that the "Manifeste de Douane" is real, but the guild was actually dissolved during the Revolution and replaced by a *Chambre de Commerce*.
  *   **Why:** This ensures your novel's backbone is accurate.

  #### Step 4: The Fact-Inject Rewrite
  Now, go back to the AI and feed it the *actual* facts you found, asking it to rewrite the scene.
  *   **Prompt:** *"I have verified some historical details. In 1865, the guild system was gone, replaced by the Chambre de Commerce. The form was called the 'Déclaration en Douane.' Red wax was used for sealing, not stamping. Please rewrite the previous scene incorporating these specific facts while keeping the atmospheric tone."*
  *   **Why:** The AI is excellent at weaving specific constraints into narrative prose. It fails at finding the constraints, but excels at using them.

  ### 3. Advanced Prompting Tactics for Accuracy

  If you must ask direct questions, change how you frame them to reduce hallucination.

  **A. Ask for Uncertainty**
  Force the model to admit gaps.
  *   *Bad:* "What was the tax rate on silk?"
  *   *Good:* "What was the tax rate on silk in 1860s Marseille? If you are not certain of the exact percentage, tell me what the likely range was or what factors influenced it, and explicitly state if this is an estimate."

  **B. Ask for "Common Knowledge" vs. "Specific Record"**
  *   *Prompt:* "Distinguish between general 19th-century French customs procedures and those specific to Marseille. If a detail is generic to France rather than specific to Marseille, label it as [GENERAL]."

  **C. The "Source Check" Prompt**
  *   *Prompt:* "I am going to paste a summary of historical notes below. Please use *only* these notes to answer my question about the customs house. If the answer is not in the notes, say 'Information not provided.'"
      *   *(Then paste a summary of what you found in your own research).*
      *   **Why:** This creates a "closed book" environment. The AI cannot hallucinate outside facts if you forbid it from using its internal training data.

  ### 4. A Concrete Example: The Marseille Customs House

  Here is how I would handle your specific block using this workflow:

  1.  **AI Draft:** "Write a paragraph describing the protagonist waiting in the customs queue."
      *   *AI Output:* Mentions a "Douanier Chief" and a "Livret de Soie."
  2.  **User Verification:** You search "Livret de Soie Marseille 1860." You find that *Livret* was for workers, not goods. You find that Marseille had a specific "Entrepôt" (warehouse) system.
  3.  **AI Refinement:** "Rewrite the paragraph. The protagonist is waiting for access to the Entrepôt. The official is not a Chief, but a 'Vérificateur.' Remove the Livret; he is holding a Bill of Lading."

  ### Summary

  You are using the tool correctly for **writing**, but incorrectly for **research**.

  *   **Don't ask:** "What is the truth?"
  *   **Do ask:** "What does a truthful scene look like?"
  *   **Don't trust:** Specific nouns, dates, names, or laws.
  *   **Do trust:** Atmosphere, procedural flow, dialogue rhythm, and emotional beats.

  By treating the AI as a generator of **plausible fiction** that you then fact-check, rather than a generator of **facts** that you then fiction-ize, you will save yourself hours of correcting errors and get much richer material for your novel.
