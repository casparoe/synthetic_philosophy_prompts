answer: |-
  ### Scenario: Protest Tactics and State Response

  Consider a strategic interaction between a **Protest Movement** (Row Player) and the **State** (Column Player). The Movement must choose a tactical posture: **Violent Confrontation (A)**, **Strictly Peaceful March (B)**, or **Moderate Civil Disobedience (C)**. Simultaneously, the State chooses a response policy: **Police Crackdown (X)** or **Political Concession (Y)**.

  Payoffs represent political capital/stability. For the Movement, success depends on mismatching the State's expectation (surprising them yields gains, matching yields losses), except for the Moderate strategy which yields a guaranteed but mediocre outcome regardless of the State's response. For the State, Concession (Y) is preferable against high-stakes tactics (A or B) to avoid escalation, but Crackdown (X) is preferable against the Moderate tactic (C) as it is low-cost and effective.

  ### Payoff Matrix

  Row Player (Movement) payoffs are listed first; Column Player (State) payoffs are listed second.

  | | **Crackdown (X)** | **Concession (Y)** |
  | :--- | :---: | :---: |
  | **Violent (A)** | 0, 0 | 4, 3 |
  | **Peaceful (B)** | 4, 0 | 0, 3 |
  | **Moderate (C)** | 1, 3 | 1, 0 |

  ***

  ### Demonstration

  #### 1. Pure-Strategy IESDS (The Stall)
  We first check if any pure strategy is strictly dominated by another pure strategy for either player.

  *   **Row Player:**
      *   Compare A vs. B: A yields 0 against X (worse than B's 4) but 4 against Y (better than B's 0). Neither dominates.
      *   Compare A vs. C: A yields 0 against X (worse than C's 1) but 4 against Y (better than C's 1). Neither dominates.
      *   Compare B vs. C: B yields 4 against X (better than C's 1) but 0 against Y (worse than C's 1). Neither dominates.
  *   **Column Player:**
      *   Compare X vs. Y: Against A, X yields 0 (worse than Y's 3). Against B, X yields 0 (worse than Y's 3). However, against C, X yields 3 (better than Y's 0). Because X performs better against C, X is not strictly dominated by Y. Conversely, Y performs worse against C, so Y does not dominate X.

  **Result:** No pure strategy is strictly dominated in Round 1. The procedure stops immediately with all 6 profiles surviving.

  #### 2. Mixed-Strategy IESDS (The Unraveling)
  We now allow Row to consider mixed strategies. Consider a mixed strategy $\sigma$ where Row plays A with probability 0.5 and B with probability 0.5.

  *   **Step 1: Eliminate C.**
      Calculate the expected payoff for $\sigma = 0.5A + 0.5B$ against Column's pure strategies:
      *   Against X: $0.5(0) + 0.5(4) = 2$.
      *   Against Y: $0.5(4) + 0.5(0) = 2$.
      Compare this to the pure strategy C, which yields 1 against both X and Y.
      *   Inequality: $2 > 1$.
      Since the mixed strategy $\sigma$ yields a strictly higher payoff than C against every possible Column strategy, **C is strictly dominated and eliminated.**

  *   **Step 2: Eliminate X.**
      The reduced game consists of Rows {A, B} and Columns {X, Y}. We check Column's dominance again.
      *   If Row plays A: X yields 0, Y yields 3. ($0 < 3$)
      *   If Row plays B: X yields 0, Y yields 3. ($0 < 3$)
      Since Y yields a strictly higher payoff than X against all remaining Row strategies, **X is strictly dominated and eliminated.**

  *   **Step 3: Eliminate B.**
      The reduced game consists of Rows {A, B} and Column {Y}. We check Row's dominance.
      *   Against Y: A yields 4, B yields 0. ($4 > 0$)
      **B is strictly dominated and eliminated.**

  **Result:** The unique surviving profile is **(A, Y)**.

  #### 3. The Mechanism: Why $k < 2$?
  You are correct that the driving feature is the relationship between the compromise payoff $k$ and the expected payoff of the mix. Strategies A and B create a "specialized-swap" pattern: $(0, 4)$ and $(4, 0)$. A 50-50 mix of these two strategies manufactures a guaranteed expected payoff of $(2, 2)$, effectively smoothing out the variance of the specialized strategies.

  For the mixed strategy to *strictly* dominate the compromise strategy C (which pays $(k, k)$), the manufactured average must exceed the guaranteed compromise:
  $$ 2 > k $$
  *   **If $k = 1$:** $2 > 1$ holds. Strict dominance is satisfied. This is the largest integer satisfying the condition.
  *   **If $k = 2$:** $2 > 2$ is false. The mix only *weakly* dominates C. Standard IESDS requires strict dominance to guarantee the elimination of rationalizable strategies without losing Nash equilibria. If you eliminate weakly dominated strategies, you risk discarding equilibria (in this specific matrix, if $k=2$, (C, X) becomes a Nash Equilibrium that would be eliminated).
  *   **If $k = 1.5$:** $2 > 1.5$ holds. The logic works identically to the integer case, though using non-integers makes the problem set slightly messier for students.

  #### 4. Counterfactuals
  *   **If $k = 2$ (Weak Dominance):** The mixed strategy yields 2, and C yields 2. C is no longer *strictly* dominated. The mixed IESDS procedure cannot eliminate C in the first round. The game stalls just like the pure-strategy version, leaving multiple outcomes (including the Nash Equilibrium (C, X)) viable.
  *   **If Column X does not become dominated after C is eliminated:** Suppose we changed Column's payoffs against A and B so that X was still viable (e.g., $v(A,X)=4, v(A,Y)=3$). Even if C were eliminated by the mixed strategy, the Column player would not switch to Y. Without X being eliminated, Row cannot eliminate B (since B is best against X). The unraveling chain breaks, and the game settles on a reduced 2x2 matrix with no further dominance, failing to produce a unique solution.

  #### 5. Skeptic's Objection and Reply
  **Objection:** "In a one-shot game, players do not actually roll dice to choose strategies. A mixed strategy is not a real action available to the Row player; it is merely a description of beliefs. Therefore, eliminating a pure strategy because it is dominated by a *fictional* randomization is methodologically unsound. We should only eliminate strategies dominated by other actual, playable pure strategies."

  **Reply:** "Iterated elimination of strictly dominated strategies does not require players to actually randomize. It relies on the epistemic condition of **Common Knowledge of Rationality**. If the Row player is rational, they will not play a strategy that is never a best response to *any* belief about the Column player's actions. Strategy C yields 1 regardless of the Column player's move. However, holding a belief that the Column player mixes 50-50 (or simply recognizing that the *average* value of A and B is 2) demonstrates that there exists a belief system under which C is suboptimal. More strongly, because the mix strictly dominates C against *all* Column strategies, C is never a best response to any probability distribution over X and Y. Rationality alone dictates C should not be played, regardless of whether the player intends to randomize between A and B."
