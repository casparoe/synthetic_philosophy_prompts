  I'm a PhD student in political science (formal theory / game theory side) and I'm putting together a problem-set question on iterated elimiation of strictly dominated strategies, and I keep messing up the mixed-strategy part. I want a 3x2 normal-form game with a realistic story (a hospial, a firm, a university department — something a normal person could face, not a trolley or a sci-fi predictor) where the following is true.

  If you run iterated elimination of strictly dominated strategies and only let pure strategies do the dominating, then in the very first round nothing at all can be eliminated and the procedure just stops, leaving all six outcomes alive. But if you allow a pure strategy to be strictly dominated by a mixed strategy, then the row player's compromise strategy (call it C) gets eliminated right away by a mix of the other two row strategies, and after C is gone the rest should unravel by pure dominance to a single surviving strategy profile, which I'd like to be (A, Y).

