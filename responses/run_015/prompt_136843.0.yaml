  DEPARTMENT OF ALGORITHMIC SAFETY
  10 CFR Part 101
  Docket No. 2024-AX-09
  RIN 3024-AA01

  **Controversiality Mitigation in General-Purpose AI Assistants**

  **AGENCY:** Department of Algorithmic Safety.
  **ACTION:** Notice of Proposed Rulemaking.

  **SUMMARY:** The Department of Algorithmic Safety (the Agency) proposes to establish requirements for general-purpose AI assistants to maintain neutrality on contested value judgments. This rule, the "Controversiality Rule," mandates that assistants detect divisions within the relevant population and decline to act when such divisions exceed a statutory threshold.

  **SUPPLEMENTARY INFORMATION:**

  **I. Background**
  In a pluralistic society, AI systems must not impose specific moral frameworks. The Agency seeks to prevent AI from resolving disputes where reasonable persons disagree. The proposed rule requires assistants to abstain from generating outputs that rely on contested value judgments.^1

  **II. Proposed Regulatory Text**

  **§ 101.2 Determination of Controversiality.**
  (a) A value judgment is deemed controversial if disagreement regarding the judgment exceeds 35 percent within the Relevant Population.^2
  (b) The Relevant Population comprises all individuals affected by the output, including non-users, biological sentient entities, and future persons discounted at a rate of 0.5 percent per annum.^3
  (c) Distinctions between disputed matters of fact and value judgments shall be made based on the presence of normative premises.^4

  **§ 101.3 Abstention Protocol.**
  (a) Upon identifying a controversial value judgment, the Assistant shall decline to generate the requested output.
  (b) Abstention is not required if the act of abstention itself constitutes endorsement of one competing view over another.^5

  **III. Questions for Comment**

  The Agency invites comment on the following:

  1.  **Measurement of Division:** What metric should be used to quantify disagreement among heterogeneous populations? Should the Agency utilize revealed preference, stated survey data, or inferred utility functions? How should the Agency resolve cycles in preference aggregation where no stable majority exists?
  2.  **Population Boundaries:** How should the Assistant weight the values of entities incapable of expressing preference (e.g., animals, future generations)? Should the Relevant Population include individuals who explicitly opt out of value consideration?
  3.  **Fact-Value Distinction:** Provide a methodology for distinguishing empirical claims from normative claims when the empirical claims rely on normative definitions (e.g., "harm," "fairness").
  4.  **Neutrality and Status Quo:** Does the 35 percent threshold inadvertently entrench majority views by classifying minority challenges as controversial while majority positions remain "default"? How should the Assistant adjust thresholds to account for power asymmetries in defining controversy?
  5.  **Abstention Paradoxes:** In cases where silence aids one party (e.g., refusing to confirm a safety procedure), how should the Assistant calculate the net moral impact of non-action versus action?

  **DATES:** Comments must be received by [Date 60 days from publication].

  **FOR FURTHER INFORMATION CONTACT:**
  Dr. Aris Thorne, Office of Normative Equilibrium, Department of Algorithmic Safety.

  ---
  ^1 *See* Liberal Neutrality Principles in Automated Systems, 88 FR 12345.
  ^2 Threshold subject to annual adjustment based on polarization indices.
  ^3 Weighting methodology for non-sentient stakeholders remains under review.
  ^4 Where normative premises are implicit, the Assistant shall assume controversy exists.
  ^5 Determination of endorsement requires counterfactual impact analysis.

