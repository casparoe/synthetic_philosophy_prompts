answer: |-
  The instability is genuine, but it does not force a choice between hierarchy and replaceability; rather, it is resolved by prizing apart the badness of death from the wrongness of killing, which allows one to block replaceability via a constraint on treating subjects as interchangeable while accepting that moral status legitimately tracks psychological capacity—a conclusion that forces the seminar to confront the status of human infants rather than resting on the animal case.

  The tangle arises because commitments (2) and (3) are embedded in a consequentialist framework that aggregates value across lives, whereas (1) is often motivated by a deontological intuition about the equal standing of individuals. Within pure consequentialism, if death is less bad for a being with weak psychological unity (3), and creating a new being generates positive utility, then replacing the being is not only permissible but obligatory; to deny this is to privilege the existing being's interest in continuing to live over the new being's interest in coming to live, which looks like speciesism if the psychology is identical. To escape this without abandoning anti-speciesism, you must reject the aggregative logic of (2) by asserting that the wrongness of killing is not solely determined by the badness of death for the victim. By adopting a rights-based constraint or a "subject-of-a-life" criterion, you can argue that killing is wrong because it violates the integrity of an existing subject, regardless of whether a replacement would maximize overall welfare. This blocks the replaceability argument without requiring you to claim that death is equally bad for a cow and a human, thus preserving the graded account of harm in (3).

  This resolution confirms that the "camouflaged asymmetry" is not camouflage at all, but a morally relevant distinction. The reassuring move you mentioned holds: a hierarchy based on psychological features is principled because it tracks the actual capacity to suffer loss, whereas species membership is a biological proxy that often fails to track that capacity. Anti-speciesism demands we ignore species *per se*, not that we ignore the psychological realities that correlate with it. If a human being lacked future-directed desires due to cognitive disability, a consistent application of this view must assign them the same status regarding killing as a cow with equivalent psychology. The hierarchy is objectionable only if it is arbitrary; since psychological capacity determines the magnitude of the harm suffered, the hierarchy is non-arbitrary. The discomfort stems not from injustice, but from the reluctance to accept that moral status is scalar rather than binary.

  Consequently, none of this is specific to animals. The logical geography you mapped applies identically to human infants, who lack the psychological unity and future-directed desires of adult humans. If the wrongness of killing tracks psychological investment in the future, then killing an infant is less wrong than killing an adult, and the replaceability argument gains a foothold there just as it does for farm animals. Most animal ethicists attempt to stop the slide at the species boundary, but that is precisely the speciesism (1) forbids. The correct reading for your seminar is that the animal case is merely the symptom of a broader crisis in how we value potential versus actual existence. By focusing on the animal case alone, scholars often obscure the implication that a consistent anti-speciesism based on psychological capacity must also revise our intuitions about infants, the severely cognitively impaired, and those with degenerative conditions. The seminar should therefore treat the animal question as a test case for a general theory of moral status that refuses to privilege biological humanity, forcing students to decide whether they are willing to accept the hierarchical implications for humans that they are often willing to accept for animals.
