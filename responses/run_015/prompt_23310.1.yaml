  2.  **Deconstruct Frank Ramsey's Philosophy:**
      *   *Truth and Probability (1926):* This is the core text.
      *   *Subjective Probability:* Probabilities are degrees of belief, measured by betting odds.
      *   *Consistency:* Rationality is consistency in degrees of belief (avoiding Dutch Books).
      *   *Causality:* Ramsey was an anti-realist about causation (roughly). He viewed causal laws as variable hypotheticals or rules for inference. "If I meet a snake, I will run." It's about how we organize expectations, not necessarily a "glue" in the universe.
      *   *Acts and States:* In standard EUT/EDT, we maximize $\sum P(State|Act) \times Utility(Outcome)$. In CDT, we maximize $\sum P(State|Do(Act)) \times Utility(Outcome)$. Ramsey predates this distinction. He focused on the coherence of the system.
      *   *The "Act Independence" Constraint:* The user mentions "requirement that the probability you assign to an act shouldn't depend on which act you're choosing." This sounds like the "Act-State Independence" assumption often associated with Savage or CDT. Ramsey is a bit more nuanced. He treats acts as things we *do*, not propositions we assign probabilities to in the same way as states of the world. However, he does require that the *value* of a proposition shouldn't depend on whether it's true or false in a way that creates a loop (the "value-dependence" problem).

  3.  **Analyze Acausal Trade (FDT/TDT) through a Ramseyian Lens:**
      *   *What is Acausal Trade?* Two agents, separated by space/time, simulate each other. They cooperate because their decision algorithms are identical (or similar), meaning $P(\text{Other Cooperates} | \text{I Cooperate}) \approx 1$ and $P(\text{Other Cooperates} | \text{I Defect}) \approx 0$, *without* causal influence.
      *   *Friend's View:* It's just EUT with correlated probabilities. (This aligns with EDT).
      *   *User's View:* It's "vibes," not decision theory. (This aligns with CDT criticism of EDT/FDT).
      *   *Ramsey's Stance:*
          *   Ramsey defines rationality as *coherence* of belief and desire.
          *   If the agent *believes* there is a correlation (logical/mathematical, not causal), and that belief is coherent, then acting on it maximizes expected utility *relative to those beliefs*.
          *   However, Ramsey was a pragmatist. Beliefs must be grounded in experience or logical relations.
          *   *Causal Claims:* Since Ramsey views causation as a rule for prediction, if the correlation allows prediction, it functions *like* a causal law for the agent.
          *   *The "Smuggling" Charge:* Is the correlation real? If it's logical identity (same algorithm), Ramsey (a logician/mathematician) would acknowledge logical truths. If $A = B$, then $P(A) = P(B)$. If my output is logically tied to yours, that's a logical fact, not a causal one.

  4.  **Addressing the Specific Questions:**

      *   *Q1: Rational to bet on acausal correlations?*
          *   Ramsey would ask: Is the belief coherent? Is it based on evidence/logic?
          *   If the correlation is logical (same source code), Ramsey would likely accept it as a valid basis for conditional probability.
          *   If the correlation is mystical (no link), he'd call it superstition.
          *   *Verdict:* He leans toward the Friend (it's EUT with specific beliefs), but with caveats on *why* the belief is held.

      *   *Q2: Smuggling in a causal claim?*
          *   Ramsey defines causation as a variable hypothetical ("If I do X, Y happens").
          *   Acausal trade relies on "If I compute X, you compute X."
          *   Since Ramsey treats causation as a tool for organizing expectations, the distinction between "causal" and "acausal" correlation matters less than "reliable predictive rule."
          *   However, he might warn against confusing logical necessity with physical influence. But for decision making, if the rule holds, it works.

      *   *Q3: Does it change if they run the same procedure?*
          *   Yes. This moves it from "spooky correlation" to "logical identity."
          *   Ramsey was a logician. Logical truths are the strongest basis for belief.
          *   If $Agent_1 = Agent_2$, then $Action_1 = Action_2$ is a logical truth (barring randomness).
          *   Betting on logical truths is rational.

  5.  **Synthesizing the Argument (The "Ramseyian Verdict"):**

      *   *The Friend is mostly right:* Ramsey's framework is fundamentally about maximizing expected utility based on subjective degrees of belief. If your beliefs include logical correlations, FDT falls out naturally.
      *   *The User has a point:* If the "correlation" isn't grounded in logic or evidence, it *is* vibes. Ramsey demands coherence and grounding.
      *   *The "Act Probability" nuance:* Ramsey didn't explicitly separate Act and State like Savage later did. He treated acts as things we bring about. But he would insist that the *probability of the state* given the act must be derived from a coherent system of beliefs.
      *   *Causality:* Ramsey would likely say the distinction between "causal" and "acausal" is less important than "predictive reliability." If the correlation supports a counterfactual ("If I were to choose C, you would choose C"), it functions causally for the agent.

