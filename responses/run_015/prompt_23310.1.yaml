answer: |-
  This is a fantastic philosophical showdown. To settle this, we have to step out of modern decision theory jargon (FDT, CDT, EDT) and step into Cambridge in the 1920s, looking at Frank Ramsey's *Truth and Probability* (1926) and his papers on causation.

  Ramsey is the grandfather of the framework you are both using, but he was also a fierce pragmatist and a logician. He wouldn't care about your labels; he would care about the **coherence of your beliefs** and the **grounding of your probabilities**.

  Here is how Ramsey would likely adjudicate the dispute, broken down by the specific constraints you mentioned.

  ### 1. Is FPA just Expected Utility with Correlations? (The Friend's Claim)
  **Ramsey's Verdict: The Friend is technically right, but epistemologically naive.**

  Ramsey's core thesis is that rationality consists of having degrees of belief (probabilities) that satisfy the axioms of probability (to avoid a Dutch Book) and acting to maximize expected utility based on those beliefs. He does not distinguish between "causal" and "evidential" expected utility in the modern sense. For Ramsey, $P(B|A)$ is simply how much you believe $B$ given $A$.

  If your friend claims that Functional Decision Theory (or acausal trade) is just Expected Utility Theory (EUT) where you assign high probability to the stranger's cooperation conditional on your cooperation, Ramsey would nod. That is exactly how the math works in his framework.

  However, Ramsey would turn to you (the User) and ask: **"On what evidence is that probability based?"**

  Ramsey insisted that degrees of belief must be grounded. If you assign $P(\text{Stranger Cooperates} | \text{I Cooperate}) = 0.9$ without a logical or empirical reason, you are indeed operating on "vibes." That is incoherent belief. But if the probability is derived from a logical fact (e.g., "We are running the same source code"), then it is a valid input for EUT.

  **Ramsey's take:** Your friend is right that the *mechanism* is just EUT. You are right that it is only rational if the correlation is *real* (logical or empirical), not magical.

  ### 2. Is it "Smuggling in a Causal Claim"? (The User's Claim)
  **Ramsey's Verdict: No, because causation isn't what you think it is.**

  This is where Ramsey's view on causation is crucial. You mentioned his view that "causal statements are rules for prediction rather than empirical claims." This comes from his Humean leanings. For Ramsey, a causal law isn't a metaphysical glue binding events; it is a **variable hypothetical**. It is a rule we use to organize our expectations: *"If I meet a snake, I will run."*

  In modern terms, Causal Decision Theorists (your side of the argument) insist that you can only condition on states you can *cause*. Evidential Decision Theorists (your friend's side) say you can condition on any correlation.

  Ramsey would likely reject the hard distinction. Since causation is just a reliable rule for prediction, **a logical correlation that allows prediction functions exactly like a causal law for the agent.**

  If you know that your decision and the stranger's decision are logically linked, then the statement *"If I choose Cooperate, the Stranger chooses Cooperate"* is a valid variable hypothetical. It supports counterfactual reasoning. Ramsey would argue that you are not "smuggling" in a causal claim; you are recognizing that **logical necessity is sufficient for decision-relevant prediction.**

  He would tell you that insisting on "physical causation" over "logical correlation" is a metaphysical fetish. If the prediction holds, the "causal" label is irrelevant to the rationality of the bet.

  ### 3. The Crucial Variable: Is the Stranger Running the Same Procedure?
  **Ramsey's Verdict: This changes everything.**

  Ramsey was a logician first. He distinguished sharply between **empirical generalizations** and **logical truths**.

  *   **Case A: The Stranger is just similar (Empirical Correlation).**
      If you are betting on a stranger simply because they seem like your type of person, Ramsey would be skeptical. This is inductive risk. If there is no causal link, conditioning your act on theirs might lead to a Dutch Book if the correlation is spurious. Here, he might side with you: without a causal mechanism, assuming the correlation holds *because of your choice* is superstition.

  *   **Case B: The Stranger is running the *same* decision procedure (Logical Identity).**
      This is the acausal trade sweet spot. If you and the stranger are instantiations of the same algorithm (Function $F$), then $Output(You) = Output(Stranger)$ is a **logical truth** (barring external noise).
      
      Ramsey would argue that logical truths have probability 1. If it is logically necessary that your outputs match, then conditioning on your act is not "vibes"; it is **deduction**.
      
      In *Truth and Probability*, Ramsey argues that we must be consistent in our beliefs. If you believe "I am running Algorithm F" and "They are running Algorithm F," then you *must* believe "Our outputs will match." To defect while expecting them to cooperate would be logically incoherent.

      Therefore, in this specific case, betting on the acausal correlation is not just rational; **failing to do so would be irrational.**

  ### 4. The "Act Independence" Constraint
  You mentioned Ramsey's requirement that "the probability you assign to an act shouldn't depend on which act you're choosing." This is a subtle point often attributed to Savage, but Ramsey touches on it regarding "value-dependent" propositions.

  Ramsey warns against propositions whose truth depends on your *desire* for them to be true. However, in acausal trade, the stranger's action does not depend on your *desire*; it depends on your *computation*.

  Ramsey would likely say:
  1.  You cannot assign a probability to your own *free choice* as if it were a state of the world (you just choose).
  2.  However, you *can* assign a probability to the *outcome of your decision procedure*.
  3.  If the stranger's outcome is logically tied to your procedure's outcome, you are allowed to use that logical link in your utility calculation.

  He would not see this as violating act-independence, because the correlation lies in the **structure of the agents**, not in a spooky influence between the acts themselves.

  ### The Final Judgment

  If Frank Ramsey were the judge:

  1.  **Who won the argument?**
      **Your Friend wins on the theory; You win on the epistemology.**
      Ramsey would agree with your friend that acausal trade is formally just Expected Utility Theory applied to logical correlations. It is not a new decision theory; it is EUT done correctly with a richer ontology of what counts as a "fact" (including logical facts).
      
      However, he would agree with you that if the agents *aren't* logically linked, treating them as such is indeed "vibes" (irrational belief).

  2.  **Is it rational to bet on acausal correlations?**
      **Yes, if and only if the correlation is logical.**
      If the stranger is running the same code, Ramsey would say refusing to trade is a failure of logic. You are ignoring a logical truth in your utility calculation.

  3.  **Is it smuggling a causal claim?**
      **No.**
      Ramsey would say you are smuggling in a *logical* claim, which is stronger than a causal one. Since he views causation merely as a tool for prediction, a logical correlation that guarantees prediction is superior to a causal one.

  **The Ramseyian Synthesis:**
  Tell your friend: "Ramsey agrees with you that the math is just Expected Utility, but he agrees with me that it only works if the correlation is grounded in logical identity, not magic."

  Tell yourself: "Ramsey agrees with me that 'vibes' aren't decision theory, but he would say that logical necessity isn't vibes—it's the only thing that matters."

  **Winner:** **Draw.** But the practical implication is that your friend's framework (FPA/EUT) is valid, provided you adopt your stricter standards for what counts as evidence for a correlation. Ramsey would tell you both to stop arguing about "causation" and start arguing about whether the logical similarity between the agents is actually proven. That is the only empirical question that matters.
