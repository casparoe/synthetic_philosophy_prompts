answer: |-
  **TO:** Management Committee
  **FROM:** Secretary
  **DATE:** [Insert Date]
  **SUBJECT:** Decision Required: Oil Boiler Replacement & Grant Commitment

  **Recommendation**
  I propose we accept the second option: set minimum requirements for cost, running cost, and start date, and instruct the earliest available installer from our existing four quotes to proceed immediately. We should not commission further surveys or a wider tender.

  **Proposed Timeline**
  *   **Monday [Next]:** Committee votes to select installer from existing quotes.
  *   **Wednesday [Following]:** Contract signed and grant commitment form submitted.
  *   **Mid-November:** Installation begins (securing slot before cold weather).
  *   **30 November:** Grant formally secured (well ahead of deadline).

  **Why This Is Responsible**
  We are working with three strict limits: information, time, and funds.
  1.  **The Grant:** The £18,000 grant expires on 30 November. If we delay commitment to chase a potentially better deal, we risk losing the entire funding. Even the highest quote (£17,500) is covered by the grant. Securing the full £18,000 value is more important than saving a marginal amount on the install.
  2.  **The Weather:** Only two firms can start before mid-November. A three-week delay guarantees we miss this window, risking installation during the coldest weather when the hall is most needed.
  3.  **Volunteer Capacity:** We have few hours to spare. Spending £900 plus dozens of volunteer hours on a new tender process is a significant cost in itself. We already have four competitive quotes; the law of diminishing returns applies. Searching further costs us more in time and risk than it is likely to save in money.

  **Addressing the Alternative View**
  The strongest argument for the three-week tender exercise is **long-term value**. It is reasonable to want the lowest running costs and the best warranty for the village's sake.

  However, in this specific situation, that benefit is outweighed by **certainty**. A theoretical saving on running costs over ten years does not compensate for the very real risk of losing the £18,000 grant now or facing a cold hall this winter. We have enough information to make a safe choice today. To search further is not "thoroughness"; it is an unnecessary gamble with funds and warmth we cannot afford to lose.

  **Action**
  Please review the four existing quotes against the attached minimum requirements before Monday. I will move that we select the compliant installer with the earliest start date.
