  **Joint Statement on Anthropics: The Cancelled Cohort Collaboration**

  **I. Agreed Claims**

  1.  **Cancelled Cohort Arithmetic:** A fair coin determines creation: Heads yields 100 enrolled subjects; Tails yields 1 enrolled subject (99 never created). Given enrollment, SSA implies P(Heads) = 1/101. SIA implies P(Heads) = 100/101. (Initial intuition regarding SIA = 1/2 was corrected).
  2.  **Supervisor Variant:** A supervisor exists in both outcomes but is never enrolled. SIA credences remain unchanged (supervisor cancels out). SSA credences shift if the supervisor is included in the reference class, demonstrating sensitivity to class boundaries.
  3.  **Infinite Observers:** Both views require regularization when hypotheses entail infinitely many observers; neither possesses a universally accepted method for handling this.
  4.  **Presumptuous Philosopher:** SIA accepts high confidence in populous cosmologies from armchair reasoning. SSA objects that this yields absurd credences independent of empirical evidence.
  5.  **Doomsday Argument:** Cancelled Cohort is structurally identical to the Doomsday Argument in miniature; the analogy holds provided "enrollment" maps to "birth rank."

  **II. Disagreements Table**

  | Crux | Bearing Case | SSA Prediction | SIA Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Reference Class** | Supervisor Variant | Problematic: Credences shift if Supervisor is included. | Robust: Supervisor cancels, but must still delimit *possible* observers. |
  | **2. The "I"** | Cancelled Cohort | "I" ranges over *actual* observers. | "I" ranges over *possible* observers. |
  | **3. Actionability** | Even-Odds Bet | Decline bet on Heads (P < 1%). | Accept bet on Heads (P > 99%). |
  | **4. Sleeping Beauty** | SB Experiment | Mapping holds (Halfer ≈ SSA). Strain: Memory loss vs. non-creation. | Mapping holds (Thirder ≈ SIA). Strain: Same as SSA. |

  **III. Assessment of RC-SIA**

  We evaluated the third position (RC-SIA): treat yourself as a random sample from *possible* observers within a reference class fixed subjectively as all observer-moments introspectively indistinguishable from yours.

  **Cancelled Cohort:** Enrolled subjects are introspectively indistinguishable; the Supervisor is distinguishable (not enrolled). RC-SIA counts only enrolled subjects. Weighting by possible observers within this class yields P(Heads) = 100/101.
  **Supervisor Variant:** Supervisor remains outside the reference class. Credences remain unchanged.
  **Sleeping Beauty:** Awakenings are introspectively indistinguishable. RC-SIA weights by number of awakenings, yielding Thirder conclusions.

  **Verdict:** RC-SIA collapses into SIA. It is not a third option but rather SIA with a specified reference class restriction. Both sides agree that while this clarifies the reference class, it does not escape the Presumptuous Philosopher objection inherent to SIA.

