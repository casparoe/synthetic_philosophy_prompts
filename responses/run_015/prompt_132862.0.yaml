      *   *Synthetic Systems:* I need to make sure the user doesn't just say "AI." It needs to be "synthetic life" or "autonomous systems" that meet the CJ criteria.
      *   *Kant's Binary:* Emphasize that Kant's moral status hinges on *Autonomy* (giving law to oneself), not just *Self-Organization* (biological self-maintenance). Bridging these two "selves" is the hard philosophical work.

  8.  **Final Polish:** Check against the user's specific questions.
      *   Hang together? Yes, with caveats.
      *   Jump too quick? Yes, needs bridging re: artifacts.
      *   Doctrine of Virtue? Yes, needed for textual grounding.
