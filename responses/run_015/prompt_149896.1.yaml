      *   **The Functional-Informational View (Context):** Explain why chemistry isn't enough. The same sequence can do different things in different contexts. "Meaning" arises from the system's organization.
      *   **The Encoder/Decoder Issue:** Address the "who wrote this?" problem. In human code, there's intention. In biology, there's natural selection (blind) and chemical necessity.
