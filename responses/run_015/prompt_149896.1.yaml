      *   **Requirement:** State confidence level in distinctions/claims and identify the specific point of lowest confidence.

  2.  **Deconstruct the Core Concepts:**
      *   *The Code Metaphor:* Implies syntax (rules), semantics (meaning), sender, receiver, and arbitrary assignment (A could mean B, but we agreed A means C).
      *   *Causal-Informational:* DNA causes things because of its physical shape and chemical affinity. It's like a key fitting a lock, not a word meaning a thing. Thermodynamics and stereochemistry rule here.
      *   *Functional-Informational:* DNA "means" something only because the cell treats it that way within a specific context (cytoplasm, history, evolution). It's about role, not just physics.
      *   *Encoder/Decoder Problem:* In human communication, a person writes code, a machine/person reads it. In biology, who wrote the DNA? (Evolution/Chemistry). Who reads it? (Ribosomes/Enzymes). Are they distinct?
      *   *Semantic Closure:* The idea that the system produces the interpreters that interpret the system. (e.g., DNA makes proteins, proteins read DNA). Is this coherent or circular?

  3.  **Drafting the Narrative Arc:**
