      *   Also, question the "Two-Bitser" itself. Is it a category error to test high-level metaphysics on a trivial machine? (The "Fair Test Case" point requested in the prompt).
      *   Let's combine these: The dispute isn't about content fixation (they actually agree on externalism in Move 6/3), it's about whether content *matters* without a subject. And is the Original/Derived distinction coherent if we are evolved machines?

