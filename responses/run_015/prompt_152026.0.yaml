      *(Self-Correction during drafting)*: Wait, on the Archive-eater. If it has *every word*, it has the tools of Gregorian minds. But if it never acts, it's not testing hypotheses against the world. It's testing hypotheses against *other hypotheses*. That is still Popperian (logical consistency). But the *source* of the hypotheses is Gregorian. Dennett says Gregorian minds are "Popperian minds equipped with cultural tools." So the Archive-eater is a **Gregorian Mind without a Body**. It can regret logical inconsistencies, but not physical failures. I should advise the user to give it *output* to make it truly Gregorian (transmitting the culture). If it stays static, it's a library. I will suggest classifying it as Gregorian *potential* but functionally Popperian in its processing. Actually, the prompt says "never once acted anywhere." That makes it a static database. I should tell the user: **It's not a mind yet.** It needs to select.

      *(Re-thinking the Mirror-jays)*: If they learn by watching, they are avoiding the "Action dies" cost. The other jay's action died. This is "Vicarious Reinforcement." Dennett usually groups this with Skinnerian unless they can explain *why*. I'll stick with Skinnerian but note the "Social" modifier.

