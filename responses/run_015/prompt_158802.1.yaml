answer: |-
  15%

  **Decomposition**
  1.  **Competence Survival (40%):** Adversarial producers will disproportionately exploit the lower-competence AI models' decision boundaries compared to a senior reviewer.
  2.  **Error Structure Validity (50%):** AI error correlations are typically heavier-tailed and less cleanly decomposable into shared versus residual components than this binomial model assumes.
  3.  **Correctness Determinacy (80%):** Safety-critical domains usually possess objective failure modes, making accuracy a valid metric despite some contestability.
  4.  **Effective-Jury-Size Penalty ($N_{eff} \approx 7.4$):** The correlation $\rho=0.1$ reduces the informational value of 25 voters to that of approximately 7 independent voters.

  **Combination**
  Even granting the optimistic assumptions that correctness is determinate and the error model holds, the math dictates a loss: the $q=0.2$ systematic error floor caps the panel's maximum possible accuracy at 92.4%, but with $N_{eff} \approx 7.4$ and $p=0.62$, the expected accuracy is only ~75%, significantly trailing the senior's 85%. The 15% credence reflects the low probability that unmodeled variances (e.g., actual $\rho$ being near zero or $p_{ai}$ being underestimated by >0.08) are large enough to bridge this gap.

  **Sensitivity, Empirics, and Stopping**
  *   **Most Sensitive Term:** The shared-cause fraction $q$, because it creates an uncancellable error floor that voting cannot resolve.
  *   **One Week of Empirical Work:** Run the 25 AI models on a red-teamed dataset designed to trigger common failure modes, then cluster the errors to measure the actual $q$ and $\rho$.
  *   **Stopping Point:** Stop at $N \approx 10$; since $N_{eff}$ saturates near $1/\rho$ (which is 10), adding more reviewers beyond this yields negligible accuracy gains relative to cost.
