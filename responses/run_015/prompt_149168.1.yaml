answer: |-
  1. Ordinary pragmatic compromise involves negotiating conflicting interests within moral boundaries, whereas dirty-handed action necessitates violating a fundamental moral prohibition to achieve a necessary political end. This distinction highlights that dirty hands involve a genuine moral transgression rather than merely settling for a suboptimal but permissible outcome.

  2. Undoing the harmful act does not eliminate the moral residue because the stain arises from the willingness to commit the wrong, not solely from the permanent consequences. Like a flagged transaction in an audit log, the attempt itself corrupts the moral record even if the system state is eventually restored.

  3. A leader who delegates an immoral task does not retain clean hands because moral responsibility transfers through authority rather than physical execution. By ordering the violation, the leader inherits the contamination just as if they had performed the act themselves.

  4. Public confession is essential to genuinely bearing the stain only if it accepts punishment, whereas using disclosure to gain political capital functions as a form of moral laundering. The act of admitting guilt acknowledges the violation without erasing the underlying moral corruption incurred by the decision.

  5. Resolving this problem does not require a distinct role morality for officeholders but instead reveals the tragic conflicts inherent within standard ethical reasoning itself. The dilemma persists because universal moral norms clash with political necessities, forcing leaders to violate binding obligations regardless of their specific role.
