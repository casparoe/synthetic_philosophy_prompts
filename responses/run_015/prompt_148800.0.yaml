  Dear colleague,

  It is encouraging to hear that your dissertation work is surfacing structural issues that often remain implicit in the alignment literature, because the pattern you are describing is indeed a real and significant philosophical carving that does not have a single canonical label attached to it. While the phenomenon sits comfortably under the broader umbrella of crypto-normativity, which generally refers to the hiding of normative commitments within supposedly descriptive or procedural frameworks, your observation is more specific than that general category. You are identifying a specific recursive mechanism where the impossibility of value neutrality is managed by recoding ontological assumptions as technical necessities, only to justify those necessities by appealing to the very neutrality they undermine. Since there is no established term like a standard fallacy name that captures this exact oscillation between procedural claims and substantive ontology in the context of pluralism, it would be precise to name this the Procedural Commensurability Loop. This name captures the two moving parts you identified: the reliance on a procedure that assumes commensurability and the looping justification that claims the procedure is neutral.

  To define this precisely for your work, the Procedural Commensurability Loop occurs when an agent argues for a neutral framework by proposing a specific aggregation procedure, defends the procedure as merely technical or formal to avoid charges of bias, but then relies on substantive values like autonomy or non-coercion to justify why that specific procedure was chosen over others. The loop is closed when those substantive values are presented as pre-political or neutral prerequisites rather than contested conceptions of the good. The critical feature that distinguishes this from ordinary circular reasoning is that circular reasoning typically involves a direct logical dependency where the conclusion is assumed in the premise, whereas this loop involves a category disguise. In ordinary circularity, the error is transparently logical, but in this loop, the error is categorical because it treats an ontological claim about the structure of value as if it were a methodological claim about how to measure value. The argument does not simply say neutrality requires neutrality, but rather that neutrality requires a procedure, the procedure requires an ontology, and the ontology is justified by neutrality, all while denying the ontological step exists.

  This distinction also helps separate the loop from simply being wrong about pluralism or making an honest mistake regarding value incommensurability. If an author were merely mistaken, they would likely accept the correction that their procedure assumes commensurability and either adjust the procedure or admit the substantive commitment. The loop you are mapping is defined by the defensive oscillation itself, where the admission of substantive commitment is blocked by retreating into procedural language, yet the procedural language is unsupported without the substantive commitment. It is a rhetorical stabilization mechanism rather than a simple error, designed to protect the claim of neutrality from the critique of pluralism without actually resolving the tension. This makes it a distinct object of study from general failures of neutrality because it persists even when the interlocutor is aware of the incommensurability objection, relying on the ambiguity between thin procedural rules and thick moral ontologies to sustain the argument.

  You are right to feel that this carving is real because it marks the boundary where political philosophy meets the technical constraints of system design, particularly in AI alignment where the temptation to solve moral disagreement with mathematical aggregation is high. By naming and defining it as the Procedural Commensurability Loop, you can isolate the specific moment where the argument shifts from claiming to respect pluralism to implicitly enforcing a specific metaphysics of value. This allows you to critique the structure without necessarily getting bogged down in the specific substantive values being smuggled in, since the error lies in the smuggling mechanism itself rather than the particular values being hidden. It gives you a tool to show that the system is not failing to be neutral by accident, but is structurally dependent on a specific resolution of the pluralism problem that it claims to avoid.

  I hope this helps you formalize the intuition you have developed from the workshops and papers you have reviewed. It sounds like a powerful lens for your dissertation, especially if you can demonstrate how this loop prevents genuine engagement with deep pluralism by resolving it prematurely through technical design choices. If you need to refine the definition further as you write, focusing on the category error between ontology and procedure will keep the boundary clear against other forms of bias or circularity. Good luck with the drafting, and it sounds like you are onto something important regarding the limits of procedural solutions to moral disagreement.

