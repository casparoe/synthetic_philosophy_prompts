answer: |-
  **MEMORANDUM**

  **TO:** The Appeals Committee on Automated Advising
  **FROM:** The Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision and Policy Guidance: *In re* Graduate Student Tuition Appeal (Case #23-09)

  ### I. Bottom Line and Vote

  **Recommendation:** The Committee should **grant the appeal** and authorize the tuition adjustment.

  **Policy Directive:** In all official communications regarding this incident and future deployments of automated advising tools, the University must describe the system as having **stated** or **represented** the incorrect deadline, but must not describe the system as having **believed** or **known** it. Responsibility for the content of those statements is to be explicitly located in the University's adoption of the *Intentional Stance* toward the system for the purpose of student reliance.

  ### II. Reasoning and Analysis

  The core difficulty of this case is not technical but ontological. We must explain why the University is financially answerable for a mistake made by a system that, by its own architecture, is incapable of making a "mistake" in the human sense—it merely processed tokens. To resolve this, we must employ Daniel Dennett's framework of the Physical, Design, and Intentional stances not as metaphors, but as the operational logic of our liability.

  **1. The Stances and the Locus of Responsibility**
  Dennett posits that we can predict an entity's behavior via three stances. The *Physical Stance* looks at hardware and electricity; the *Design Stance* looks at function and engineering constraints; the *Intentional Stance* treats the entity as a rational agent possessing beliefs and desires.

  In this case, the *Design Stance* provides the complete causal explanation: a gap in the retrieval corpus combined with a parameter setting that prioritized fluent completion over abstention. This explains *how* the error occurred. However, the Design Stance cannot explain *why the student relied on it*. The student relied on the system because the University invited them to adopt the *Intentional Stance*. Our launch material described the tool as a "personal advisor." An advisor is, by definition, an entity to which we attribute beliefs and knowledge.

  We cannot use the Design Stance to explain the error (it was a "glitch") while simultaneously using the Intentional Stance to market the utility (it is an "advisor"). This is the asymmetry objection, or what we might term **attribution laundering**. If we invite the Intentional Stance to gain efficiency, we must accept the liabilities that come with it. Since the system itself cannot bear liability (it has no assets, no moral status, and no capacity for regret), the liability defaults to the entity that commissioned the stance: the University.

  **2. The Three Grades of Commitment**
  To clarify our language policy, we must distinguish between three grades of intentional commitment:
  *   **Grade 1 (Predictive Payoff):** Attributing a state allows us to anticipate output. (e.g., "It thinks the deadline is the 15th, so it will say the 15th.")
  *   **Grade 2 (Counterfactual Robustness):** The behavior tracks the content under paraphrase or context shifts. (e.g., If asked "When is the last day?", it gives the same date.)
  *   **Grade 3 (Answerability):** The bearer can give reasons for the state, revise it when corrected, and bear the cost of holding it.

  The system demonstrated Grade 1 and mostly Grade 2 (until pressed). It categorically fails Grade 3. It cannot give reasons, only probabilities. It cannot bear costs. A decision assigning responsibility *requires* Grade 3. Since the system cannot satisfy Grade 3, we cannot truthfully say the system "believed" or "knew" the deadline. To say so would be to commit a category error.

  However, the University *does* satisfy Grade 3. We can give reasons for the deployment, we can revise the policy, and we can bear the cost. Therefore, our decision must read: *The system stated X. The University represented X as reliable. The University is answerable for that representation.* We attribute the *speech act* to the machine, but the *intentional state* (and its liability) to the institution.

  **3. The Avowal Problem**
  The system subsequently denied having beliefs ("I hold no beliefs"). In a human, we might dismiss this as self-deception or modesty; the attribution of belief stands despite the avowal if the behavioral pattern holds. In the LLM, the denial is generated by the same mechanism as the error. It is token prediction, not testimony. The coincidence of mechanism collapses the distinction between the error and the correction.

  Therefore, the system's denial carries no weight. It does not exonerate the system (which needs no exoneration) nor does it validate the system's earlier claim. It is merely noise. We must treat the initial output as a *representation* issued under the University's authority, regardless of the system's subsequent generated disclaimers. The student was not interacting with the raw model; they were interacting with a University service wrapped around the model.

  **4. The Design-Stance Rival**
  A rival view suggests that because we have a complete Design-level story (corpus gap, threshold settings), we should treat this as a product defect rather than a false assertion. This view argues that intentional ascription is undercut by causal explanation.

  This is incorrect in the context of reliance. A calculator operates entirely on the Design/Physical stance; if it errors, it is a defect. But a calculator does not speak in the register of policy. It displays numbers. When a system speaks in the register of policy ("The deadline is..."), it invites an Intentional interpretation. The availability of a Design-level explanation explains the *failure*, but it does not negate the *invitation*. We are not assigning responsibility for the *computation*; we are assigning responsibility for the *communicative act*. The Design story supports our liability by proving the error was foreseeable and preventable, not by absolving us of the intentional frame we imposed on the user.

  ### III. The Strongest Rejected Option

  **The "Tool Transparency" Argument**
  There is a compelling argument that we should reject the appeal and classify the system strictly as a search tool. Proponents of this view argue that the technical documentation clearly stated the system "generates likely continuations." They contend that the student's reliance was negligent because they treated a probabilistic engine as an authoritative agent.

  Under this view, the University should retreat to the Design Stance exclusively. We would argue: "We never claimed it had a mind; we claimed it processed text. The student imposed the Intentional Stance unilaterally. We are not responsible for the user's anthropomorphism."

  **Why we reject this:**
  While philosophically consistent regarding the system's ontology, this position is administratively hypocritical. It ignores the "launch material" which explicitly used the term "advisor." You cannot market a Product A (an Advisor/Agent) and ship Product B (a Text Completer), then blame the customer for expecting Product A. To accept this argument would be to validate attribution laundering: using intentional vocabulary to capture value (trust, engagement) and design vocabulary to evade cost (liability, errors). Consistency obliges us to pick the register that matches the *invited reliance*, not the one that matches the *backend architecture*.

  ### IV. Policy Language Guidance

  In the decision letter and future policy notes, adhere to the following distinctions:

  1.  **Permissible:** "The assistant **stated** the deadline was..." / "The system **represented** that..." / "The University **deployed** the system as an authoritative source..."
  2.  **Impermissible:** "The assistant **believed**..." / "The assistant **knew**..." / "The system **was mistaken**..." (Systems are not mistaken; they are only incorrect. Mistake implies intent).

  We answer for the statement *as if* it were a belief, without asserting it *was* a belief.

  ***

  ### V. A Note to the Chair (Personal)

  You asked me to identify the single consideration that would force me to recommend the opposite outcome, and to locate the weak joint in my own reasoning.

  **The Disqualifying Evidence:**
  If the case file contained evidence that the interface presented a **prominent, unavoidable disclaimer** at the point of query (e.g., a modal pop-up stating: *"This tool generates probabilistic text and is not an official advisor. Verify all dates with the Registrar."*) which the student had to acknowledge before receiving the answer, I would recommend denying the appeal.
  *Reasoning:* This would break the "Invitation to the Intentional Stance." It explicitly forces the user into the Design Stance ("probabilistic text") before the interaction begins. It negates the marketing "advisor" claim by providing a contemporaneous correction. Without that, the marketing stands as the governing frame.

  **The Weak Joint in My Reasoning:**
  My suspicion aligns with yours. The weak joint is the slide between **Predictive Payoff** (Grade 1) and **Answerability** (Grade 3).
  In Section II, I argue that because the system failed Grade 3, the University must absorb it. But there is a risk that in saying "The University is answerable *as if* it believed," we inadvertently reify the system's belief in the public record. We are using the *language* of the Intentional Stance to assign liability, which risks convincing the public (and the committee) that the Intentional Stance was *ontologically true* of the machine.

  If we are not careful, we create a precedent where "The system stated" becomes legally synonymous with "The system intended." This is dangerous. If a future system causes physical harm, this logic could be twisted to argue the system itself is a moral agent capable of negligence, rather than the University being negligent in its deployment.

  **The Fix:**
  We must ensure the decision text emphasizes that the University is liable *precisely because* the system lacks the capacity for belief. We are not vicariously liable for its mind; we are directly liable for our decision to deploy a mindless tool in a context that required a mindful one. The liability comes from the **mismatch of stances**, not the attribution of states. If I find myself writing as though the system *could* have known better, I have failed. The system never could have known better; that is why we must pay.
