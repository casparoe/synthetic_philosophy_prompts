answer: |-
  **The Fragile Glass and the Empty Conditional: Why Finks Kill the Reduction**

  Philosophers have long been seduced by the idea of reducing modal mysteries to extensional facts. Dispositions—properties like fragility, solubility, or flammability—seem to speak of what *would* happen, not merely what *is*. To avoid committing to a metaphysics of hidden powers, the Simple Conditional Analysis (SCA) proposes a tidy solution: to say a glass is fragile is simply to say that if it were struck, it would break. This analysis promises to demystify dispositions, translating them into straightforward counterfactual conditionals. However, this project faces two notorious counterexamples: the "mask" (a fragile glass wrapped in lead) and the "fink" (a demon who removes fragility the moment before impact). While both cases initially appear to falsify the SCA, they are not equally damaging. The mask case is a manageable complication of context, solvable by refining the conditions of the antecedent. The fink case, however, represents a structural collapse of the analysis. Ultimately, the fink demonstrates that dispositions cannot be reduced to conditionals; they are categorical bases that ground conditionals, rather than being identical to them.

  To see why the mask and the fink differ in severity, we must first understand why they threaten the SCA. According to the SCA, $x$ is fragile if and only if, if $x$ were struck, $x$ would break. In the mask case, a fragile glass is encased in thick lead. Intuitively, the glass remains fragile; its molecular structure hasn't changed. Yet, the counterfactual "if struck, it would break" is false, because the lead prevents the breaking. In the fink case, proposed by C.B. Martin, a fragile glass is protected by a sorcerer who detects the impending strike and instantly renders the glass non-fragile (perhaps by altering its molecular structure) before the impact occurs. Here, too, the counterfactual "if struck, it would break" is false, because the glass loses the very property that would have caused the breaking. In both cases, we have a fragile object for which the defining conditional is false.

  The mask case, however, is largely a linguistic or contextual hurdle. When we assert that a glass is fragile, we implicitly refer to its intrinsic structure, not its extrinsic environment. The lead wrapping is an external interferer, distinct from the glass's disposition. Consequently, the SCA can be rescued here by a *ceteris paribus* clause or a restriction on the stimulus conditions. We can amend the analysis to: "$x$ is fragile iff if $x$ were struck *in the absence of extrinsic preventers*, $x$ would break." This restriction is not ad hoc; it aligns with our intuition that dispositions are intrinsic properties. The mask does not show that the glass lacks the power to break; it shows that the power is blocked. By specifying "standard conditions" or "intrinsic circumstances," the conditional analysis absorbs the mask case without altering its fundamental reductive ambition. The conditional remains the definition of the disposition; we have merely sharpened the description of the trigger.

  The fink case, by contrast, cannot be solved by merely refining the antecedent conditions. The problem with the fink is not that an external barrier prevents the manifestation, but that the disposition itself vanishes in response to the trigger. If we attempt to apply the same fix used for the mask—restricting the clause to circumstances where "no interferers are present"—we run into a logical wall. In the mask case, the interferer (lead) is distinct from the disposition (fragility). In the fink case, the "interference" is the *removal of the disposition itself*.

  To save the SCA from the fink, one might propose: "$x$ is fragile iff if $x$ were struck, and $x$ remained fragile, $x$ would break." But this renders the analysis viciously circular. We are trying to analyze what it *means* to be fragile, yet the analysis now requires us to presuppose that the object *remains fragile* in the antecedent. We have not reduced the disposition to a conditional; we have defined the disposition in terms of itself. David Lewis attempted to bypass this by anchoring the conditional to the "causal basis" of the disposition (the molecular structure) rather than the disposition itself. He argued we should say: "If struck, the structural basis would persist and cause breaking."

  However, Lewis's move concedes the core point of the anti-reductionist. By shifting the focus to the causal basis, Lewis admits that the disposition *is* the categorical base (the structure), not the conditional. The conditional becomes merely a symptom or a consequence of the basis, not the definition of the property. If the truth of the conditional depends on the persistence of the categorical base, then the base is the ontological priority. The fink shows that the link between the property and the counterfactual can be severed precisely because the property is a state of the object that can change, whereas the counterfactual is a claim about a possible world. When the fink operates, the object enters the possible world where it is struck, but in that world, it lacks the property it had in the actual world. The SCA assumes trans-world identity of the disposition, but the fink case proves that identity is not guaranteed by the logic of conditionals.

  Therefore, the restriction that saves the mask case fails the fink case. For the mask, we can exclude extrinsic factors without circularity. For the fink, excluding the "loss of fragility" requires us to mention fragility in the analysis of fragility. This asymmetry reveals that the two cases are not equally damaging. The mask is a complication regarding the *application* of the conditional; the fink is a refutation of the *ontology* of the conditional.

  This leads to a definitive verdict: the conditional analysis cannot be saved as a reductive project. Dispositions are something more than conditionals. They are real, categorical properties—powers inherent in the object's structure—that *ground* the truth of conditionals, rather than being constituted by them. When we say a glass is fragile, we are describing its actual physical constitution, not a logical relationship between striking and breaking. The conditional "if struck, it would break" is reliable evidence for fragility, but it is not what fragility *is*. The fink case demonstrates that an object can possess the property (initially) while the conditional is false, because the property is a state that can be lost, whereas the conditional analysis requires the property to be a logical truth about the object's behavior across worlds.

  To insist on the SCA in the face of finks is to prioritize logical formalism over metaphysical reality. It forces us into circular definitions or reliance on "causal bases" that effectively admit the disposition is the base, not the conditional. We should accept that the world contains genuine powers. The glass is fragile because of what it *is*, not merely because of what it *would do*. The demon may stop the breaking, and the lead may cushion the blow, but neither can alter the fact that the glass possesses a nature oriented toward shattering. The conditional analysis fails because it tries to capture this nature using only the shadow it casts. The fink case pulls away the light, revealing that the object—and its power—was there all along, independent of the shadow.
