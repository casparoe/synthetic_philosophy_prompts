answer: |-
  You have a very sharp eye for this. Your diagnosis is better than most of the ones you've read in those threads. You are correct that this isn't just a verbal dispute about the word "code," but it also isn't a single scientific disagreement about how cells work. Both sides agree on the chemistry. They agree on the base pairing. They agree on the ribosome's structure.

  The stalemate exists because the fight is actually about **what counts as an explanation in biology.**

  Here is the diagnosis you asked for, broken down by the substantive disagreement, the test case you proposed, and why this will likely go on forever.

  ### 1. The Real Substantive Disagreement
  You asked if there is a real, single disagreement hiding inside the noise. There is. It is not about DNA; it is about **normativity.**

  In philosophy, "normativity" refers to rules about what *ought* to happen, not just what *does* happen.
  *   **Side A (The Coders)** believes biology contains genuine norms. When a ribosome inserts the wrong amino acid, it isn't just a rare chemical event; it is a *mistake*. It violated a rule. For this to be literally true, the rule has to exist independently of the chemistry. They argue that the "function" of a gene is a real property of the universe, like mass or charge.
  *   **Side B (The Chemists)** believes biology contains only causality. Things push other things. If a ribosome inserts the wrong amino acid, it's just a chemical mismatch or a statistical outlier. Calling it a "mistake" is a human projection. For them, "function" is just a shorthand for "this thing survived long enough to get here."

  Your third wrinkle ("A code needs a notion of getting it wrong") hits this exactly.
  *   If Side A is right, an error is a failure of the system to follow its own internal rules, even if the organism survives.
  *   If Side B is right, an "error" is just a description we apply after the fact if the organism dies. If the organism lives, it wasn't an error; it was just a variation.

  So, the substantive disagreement is this: **Can physical matter create a rule that binds itself?** Side A says yes (the DNA binds the cell to a specific outcome). Side B says no (matter just reacts; rules are stories we tell about the reactions).

  ### 2. Addressing Your Wrinkles
  Your four wrinkles explain why the debate feels stuck. You are right that the sides are often talking about different objects, but they refuse to admit it.

  *   **Wrinkle 1 (Replication vs. Translation):** You are correct. Replication is templating (chemistry). Translation is coding (symbolic). Side A focuses on translation to prove the "code" claim. Side B focuses on replication and development to prove the "chemistry" claim. They could resolve this by agreeing that DNA is a *template* for copying and a *code* for building, but they don't, because admitting the "code" part threatens Side B's view that everything is just physics.
  *   **Wrinkle 2 (The Bootstrapping):** This is the "dictionary written in its own language" problem. Side A says the arbitrariness of the mapping proves it's a code (because chemistry usually isn't arbitrary). Side B says the fact that the decoder is built by the code proves it's a closed physical loop (a machine building itself). Neither can disprove the other because both descriptions fit the physical facts.
  *   **Wrinkle 4 (Code for Whom?):** This is the strongest point.
      *   *For the cell:* It's just chemistry. The cell doesn't "know" anything.
      *   *For the scientist:* It's definitely a code. We read it, write it, and predict outcomes.
      *   *For evolution:* It's a historical record.
      Side A conflates the scientist's view with the cell's view. Side B insists that if it's not a code *for the cell*, it's not a code at all.

  ### 3. Would Synthetic Biology Settle It?
  You asked: *If somebody built a second, independent triplet system from scratch with a different mapping, and it worked, would that settle whether the mapping is arbitrary or chemically forced?*

  **No. It would not settle it.** Both sides would absorb the result into their existing framework without changing their minds. Here is how the next thread would play out:

  *   **Side A says:** "We proved the mapping is arbitrary! We changed the rules, and the system still worked. That proves the original mapping wasn't forced by chemistry. It proves DNA is a genuine symbolic language that we can reprogram."
  *   **Side B says:** "You built a new machine with new physical properties. The new mapping isn't 'arbitrary'; it's determined by the shape of the synthetic tRNAs and enzymes you manufactured. You didn't create a new 'language'; you created a new chemical causal chain. It's still just lock-and-key mechanics."

  See the problem? Side A sees the *design choice* as the proof of a code. Side B sees the *physical implementation* as the proof of chemistry. Since any code must be physically implemented to work, Side B can always point to the hardware and say, "See? Just physics." Side A can always point to the design and say, "See? Just information."

  ### 4. Why This Will Go On Forever
  You should expect this to go on forever, not because scientists are stubborn, but because they are asking a **metaphysical question** while pretending it is a **scientific one.**

  Science is excellent at telling us *how* things work. It is not equipped to tell us *what kind of existence* the rules have.
  *   If you ask a physicist, "Is energy real?" they will say yes.
  *   If you ask a philosopher, "Is energy a real thing or just a bookkeeping method for math?" they will argue forever.

  The DNA debate is the same.
  *   **Side A** needs "information" to be real to justify treating biology like computer science (which is incredibly productive for medicine and biotech).
  *   **Side B** needs "chemistry" to be the only reality to justify treating biology like physics (which is incredibly productive for understanding development and systems).

  As long as both approaches yield useful results, neither side has a reason to surrender. The "code" language helps us cure diseases. The "chemistry" language helps us understand why cures sometimes fail due to complex system interactions.

  ### 5. What Would Count as Progress?
  Since an experiment won't fix this, progress would have to come from a change in **language**, not data.

  Progress would look like this:
  The field stops asking "Is it *literally* a code?" and starts asking "Under what conditions does the code model break?"

  Right now, the debate is binary: Either it is a code, or it is a metaphor.
  A productive shift would be to treat "code" as a **gradient**.
  *   In some contexts (protein synthesis), the system behaves *enough* like a code that treating it as literal is safe.
  *   In other contexts (embryonic development), the system behaves *too much* like a complex chemical soup for the code model to hold.

  If the two sides agreed that "information" is a **functional description** rather than a **physical substance**, the fight would end. They would agree that "information" exists only when there is a mechanism to read it, and that the "meaning" is just the reliable causal outcome of that reading.

  But that requires Side A to admit the "meaning" isn't magic, and Side B to admit that "just chemistry" doesn't explain the predictability. Since both sides feel that admitting that weakens their position, they dig in.

  ### Summary
  Your hunch was right. The fight is about whether biology is allowed to have norms (rules, errors, functions) that aren't just statistics.
  *   **The Substantive Disagreement:** Can physical systems generate genuine rules, or are rules just human descriptions of physical habits?
  *   **The Test Case:** Synthetic biology won't solve it because "arbitrary design" looks like "code" to one side and "new physics" to the other.
  *   **The Prognosis:** It will go on forever because both views are useful. The "code" view builds drugs. The "chemistry" view explains side effects. Until the field decides that a model can be "true enough for this specific job" without being "literally true everywhere," the threads will keep dying in the same place.

  You aren't missing a reference or a key paper. You're seeing the seam where science turns into philosophy, and that seam doesn't glue shut.
