  **BUREAU OF CALIBRATED DESERT AND SOCIAL ADJUSTMENT (BCDSA)**
  **PUBLIC GUIDANCE DOCUMENT 88-B: FREQUENTLY ASKED QUESTIONS REGARDING MORAL LIABILITY ASSESSMENT**

  **1. What is a Desert Point and how is it accrued?**
  A Desert Point (DP) is the standard unit of administrative accountability used to maintain social equilibrium. Citizens should understand that DP accumulation is not a measurement of metaphysical freedom or cosmic worth. Rather, it is a policy-level mechanism designed to regulate behavior within the coordination system. Points are accrued when an agent performs actions designated as "volitional" under Statute 4.2. Forfeiture occurs upon violation of normative expectations. The system does not require that you could have done otherwise in a causal sense; it requires only that you function as an accountable node within the network.

  **2. Can I file an Exemption Petition based on Neuro-Determinism or Adverse Social Conditioning?**
  No. Petitions citing causal determinism, genetic predisposition, or environmental conditioning (Class C Exemptions) are routinely rejected. While the Bureau acknowledges that all actions are the product of antecedent physical causes, origin-level excuses are non-justiciable in policy-level accounting. To grant exemptions based on universal causality would collapse the administrative machinery required for social coordination. You are liable for your actions not because you are a prime mover, but because treating you as such yields optimal societal outcomes. Claiming you "couldn't help it" is treated as a request for subsidized risk management, not a negation of debt.

  **3. How are penalties calculated?**
  Penalties are assessed using the Retributive Liquidity Ratio (RLR). This metric balances the severity of the infraction against the agent's capacity for future adjustment. Please refer to **Table 9-C: Infraction-to-Liquidity Mapping** in the appendices. For example, Petty Larceny carries a liquidity ratio of 1.5, requiring 150 hours of community calibration per DP forfeited. Aggravated Assault carries a ratio of 4.0. These ratios are not expressions of moral outrage but calibrated inputs designed to stabilize the expectation matrix. The goal is not vengeance; it is the maintenance of predictable interaction patterns among agents.

  **4. Do Desert Points transfer across generations?**
  Guilt is not heritable. However, Administrative Oversight Obligations (AOO) are. Children of high-liability citizens do not inherit negative DP balances, but they are subject to enhanced monitoring protocols until age 21. This ensures that environmental risk factors associated with prior generational liability are mitigated. The child is not punished for the parent's actions, but the state assumes a vested interest in the child's calibration to prevent deficit recurrence. This is a preventive adjustment, not a retributive inheritance.

  **5. Is there a refund policy for citizens who later prove they lacked agential capacity?**
  Refunds are available only under Section 77 (Verified Incapacity). If a citizen can provide retroactive clinical evidence that they lacked the cognitive hardware to process normative expectations at the time of the infraction (e.g., severe psychosis, coerced automation), DP forfeiture may be reversed. However, proving you were "determined" to commit the act is insufficient. You must prove you were not a valid agent within the system at all. Note that successful refunds often result in reclassification as a "Non-Agential Hazard," requiring indefinite custodial adjustment rather than liberty. Most citizens find maintaining agential status preferable.

  **6. Why use the language of "Justice" if this is purely administrative?**
  Terminology is selected for maximum compliance efficiency. Framing liability as "Just Deserts" leverages evolved psychological responses to norm violation, reducing enforcement costs. Acknowledging the system as mere social engineering would degrade its efficacy. Therefore, all correspondence will maintain the fiction of moral responsibility. This is not dishonesty; it is interface design.

  **CONTACT:** For disputes regarding DP assessment, submit Form 12-D to your local Calibration Office. Do not mail metaphysical objections.
