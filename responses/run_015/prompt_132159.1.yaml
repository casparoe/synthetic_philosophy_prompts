answer: |-
  ### Sorting the Desiderata: Signal vs. Noise

  You're asking for a demarcation criterion between a science of history and a sophisticated form of astrology. That's the core tension. The "forecasting tournament" crowd thinks truth is what wins the bet; the "narrative" crowd thinks truth is what makes sense of the human experience. Both are half-right, and both are dangerous if taken alone.

  Here is the sorting of your list (a–h) into **Real Desiderata** (conditions for a functioning science), **Prejudices** (camp-specific preferences disguised as rigor), and **Preconditions** (data issues, not model issues).

  *   **(a) The Seldon Clause (Desideratum, with caveats):** Pre-registration and out-of-sample testing are non-negotiable for *prediction*. However, "dated" is too strong. History doesn't run on clockwork. If they demand exact years, they invite failure. It should be "windowed" forecasts (e.g., "instability within this 5-year band"). Scoring against a dumb autoregressive baseline is essential; beating "nothing" is trivial, beating "more of the same" is science.
  *   **(b) Knobs-per-cycle (Real Desideratum):** This is the hardest constraint. Macrohistory has an N problem. There are only so many secular cycles in the recorded data. If your model has more parameters than cycles, you are not modeling; you are drawing a connect-the-dots picture. This is the primary defense against curve-fitting.
  *   **(c) Tinder vs. Spark (Real Desideratum):** This is the scope definition. Structural models predict flammability, not arson. If a cliodynamicist claims to predict the specific assassination that triggers a civil war, they are lying. But they must define what "ignition" looks like (e.g., any violent event above threshold X). If they say "war happens" and then count a riot as war, that's moving the goalposts.
  *   **(d) Falsification Clause (Precondition/Epistemic Limit):** You can't solve this with a clause. There is one history. You cannot rerun the Roman Empire. The only way to falsify is cross-sectional (compare Rome to Han China at similar phases), not longitudinal. This isn't a requirement the modelers can meet; it's a limit you must accept about the knowledge produced.
  *   **(e) Reflexivity (Prejudice/Policy Issue):** This is interesting for *policy*, not for *science*. If a model predicts a crisis and the government fixes it, the model was causally correct even if the prediction failed. Demanding the model account for its own influence turns science into game theory. Keep this separate from the validation criteria.
  *   **(f) Legibility (Precondition):** This is a data quality issue, not a model success criterion. If the proxies are bad, the model fails (b). Don't build this into the success spec; build it into the data audit.
  *   **(g) Microfoundations (Desideratum, but dangerous):** Mechanism is good. It prevents spurious correlation. But in macrohistory, demanding full household-level microfoundations often violates (b). You run out of degrees of freedom. It's a goal, not a hard constraint for funding.
  *   **(h) Narrative Intelligibility (Prejudice):** This is the historian's protectionism. Explanation does not require a story. A differential equation explains gravity without a plot. If the model predicts well, it doesn't need to read like a book. This should be excluded from the *scientific* spec, though it matters for *adoption*.

  ### The Incompatibility Result: The Macrohistorical Trilemma

  You asked for the pair or triple that cannot be jointly satisfied. Here is the hard truth:

  **You cannot jointly satisfy (a) Dated Precision, (g) Rich Microfoundations, and (b) Low Knobs-per-cycle.**

  **The Argument:**
  1.  **Data Scarcity:** Macrohistory offers very few independent cycles (N is small, perhaps <10 for robust secular cycles).
  2.  **Parameter Cost:** To satisfy (g) and route pressure through identifiable household decisions, you need parameters for fertility, mobility, elite recruitment, wage elasticity, etc. This explodes the parameter count.
  3.  **Statistical Rigor:** To satisfy (b), parameters must remain low relative to N.
  4.  **Prediction Precision:** To satisfy (a) with dated forecasts, you need a model tight enough to resolve time-specific dynamics. Simple models (required by b) usually lack the resolution for (a) unless they ignore mechanism (violating g).

  If you enforce (b) strictly (which you must, to avoid numerology), you must sacrifice either (a) (accept wide windows/probabilities) or (g) (accept black-box or aggregate mechanisms). You cannot have a mechanistic, parsimonious model that predicts specific dates.

  **Which requirement does the most work?**
  **(b) Knobs-per-cycle.** This is the killer. It eliminates almost all complex narrative explanations (too many unquantified variables) and most complex quantitative models (overfitting). It forces the unit to keep models brutally simple.

  **Non-negotiable vs. Negotiable:**
  *   **Non-negotiable:** (b) Parsimony and (c) Tinder/Spark distinction. Without these, you are funding astrology or curve-fitting.
  *   **Negotiable:** (a) can be softened to "probabilistic windows." (g) can be "plausible aggregate mechanism" rather than strict microfoundations. (h) should be discarded as a scientific criterion.

  ### Contender Scorecard

  Here is how the three main approaches stack up against the *sorted* criteria (prioritizing b and c).

  | Criterion | Turchin-style (Demographic-Structural) | Slow Institutions (Property Rights/State Capacity) | Black-Box ML (Time-Series) |
  | :--- | :--- | :--- | :--- |
  | **(a) Forecasting** | **Mixed.** Predicts instability windows well, often misses timing. | **Poor.** Too slow-moving for 3-year prediction; explains epochs, not cycles. | **High.** Will beat baselines on short-term fits, fails out-of-sample long-term. |
  | **(b) Knobs/Cycle** | **Fail.** Often criticized for adding parameters to fit each new crisis. | **Pass.** Very few parameters (rights, capacity), but low resolution. | **Fail.** Thousands of parameters; pure overfitting on historical N. |
  | **(c) Tinder/Spark** | **Pass.** Explicitly predicts structural pressure, not specific events. | **Pass.** Predicts institutional resilience, not events. | **Fail.** Predicts events/values, no distinction between pressure and spark. |
  | **(g) Mechanism** | **Pass.** Explicit causal chains (elite overproduction -> instability). | **Pass.** Clear institutional logic. | **Fail.** None. |
  | **(h) Narrative** | **High.** Reads like history. | **High.** Reads like political science. | **None.** Opaque. |
  | **Verdict** | **Fundable with restrictions.** Must reduce parameters. | **Not for prediction.** Fund for explanation only. | **Do not fund.** Violates (b) and (c). |

  **Summary Recommendation:**
  Fund the Turchin-style unit *only if* they agree to a hard cap on parameters (enforcing b) and shift their success metric from "dating the crisis" to "predicting the pressure index" (enforcing c). The ML group is scientifically invalid for this purpose (no mechanism, overfitting). The Institutional group is valuable but not "predictive" in the 3-year sense you're buying.
