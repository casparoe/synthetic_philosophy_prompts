  **MEMORANDUM FOR ALL STAFF**

  **FROM:** Elena Vance, Chair, Bureau of Aggregate Risk Mitigation (BARM)
  **TO:** Compliance Officers, Review Committees, Administrative Oversight
  **DATE:** October 14, 2024
  **SUBJECT:** FY24 Annual Compliance Bulletin and Operational Directives

  **1. MESSAGE FROM THE CHAIR**

  The Bureau's mandate remains the prevention of unilateral actions carrying low-probability, civilization-scale downside. Our strategy relies on conformity: requiring broad agreement before any high-variance action proceeds. This bulletin summarizes FY24 performance metrics, updates guidance on risk displacement, and clarifies the Board's own authorization status.

  **2. STATISTICS AND RESOURCE ALLOCATION**

  In FY24, BARM received 4,200 applications for action licensing. Of these, 4,198 were deferred pending consensus. The median deferral period is now 18 months. This exceeds the mean inter-crisis interval for Class-4 existential events, estimated at 14 months. We acknowledge this gap indicates that our precautionary timeline exceeds the frequency of the threats we mitigate.

  Regarding personnel: The Board approved the hiring of 12 new Senior Reviewers. However, under the Unilateralist Aggregation Model, each reviewer represents an independent vector for catastrophic error. Adding reviewers increases the probability that at least one agent within the Bureau will erroneously approve a hazardous action. Consequently, personnel expansion has increased BARM's internal risk profile by 4.2%. The Budget Office has categorized this risk increase as a line-item expense rather than a structural contradiction. We request additional funds to purchase insurance against errors introduced by new hires.

  **3. WORKED EXAMPLES OF REGULATORY FAILURE**

  *Case A (The Abstention Externality):* Review Committee 3 denied a license for Geo-Engineering Trial 9 due to insufficient consensus. The applicants subsequently relocated the trial to a non-signatory jurisdiction. Total global risk increased, though BARM's internal risk exposure remained zero. To address this, all denials must now be accompanied by Form 14-D (Risk Displacement Disclosure), estimating the probability of the action occurring elsewhere. Form 14-D requires approval from the new Subcommittee on Externalities, which currently has no quorum.

  *Case B (The Blame Asymmetry):* A Board member voted to approve a pathogen synthesis framework. The framework was later linked to a containment breach. The member was terminated. Conversely, members who voted to defer the framework faced no liability when the breach occurred in a different facility during the deferral period. Those members were appointed to the After-Action Review Committee. This confirms that career incentives align uniformly with abstention.

  **4. GUIDANCE FOR STAFF: THE DOCTRINE OF NEGATIVE ATTRIBUTION**

  Effective immediately, all staff must adhere to the Doctrine of Negative Attribution. This doctrine stipulates that liability attaches only to the agent who initiates an action, never to the agents who refrain from preventing it. Therefore, the safest professional course is to defer all actions indefinitely. Staff should note that while private consensus may exist regarding the net-positive value of an application, public agreement constitutes a unilateral act relative to external observers. Silence is the only risk-neutral position.

  If a staff member believes an action is safe, they must not vote "Approve." They must vote "Defer" and file a Motion to Continue Deferral. This preserves the option value of future abstention.

  **5. BOARD AUTHORIZATION AND RECURSIVE COMPLIANCE**

  The Board's authority to license external actions is itself a unilateral act relative to other oversight bodies. To comply with the Unilateralist Aggregation Model, the Board must license its own licenses. ^[1] 

  Appendix Omega details the chain of self-authorization. Currently, the Board operates under a Temporary Permit to Review, issued by the Board's own Internal Compliance Subcommittee. This permit expires in 30 days. Renewal requires a unanimous vote to approve the renewal process. As voting constitutes an action, the Board has entered a deferral cycle regarding its own legitimacy.

  **6. CLOSING NOTE ON OPERATIONAL STATUS**

  The machinery of review has successfully identified that any action carries non-zero risk, while abstention carries no attributable risk. Consequently, the only licensed act available to the Bureau is abstention. However, under current statutes, the act of abstaining requires a license to ensure the abstention itself does not constitute a negligent omission.

  BARM is currently processing the application to license the act of abstention. Until this license is granted, all staff are ordered to remain in a state of unlicensed abstention. Performance metrics for FY25 will measure the purity of this inactivity.

  **Elena Vance**
  Chair, Bureau of Aggregate Risk Mitigation

  ***

  ^[1] Permit #001-Alpha authorizes the Board to issue permits. Permit #001-Alpha was issued by the Board. See Delegated Authority Appendix, Section 9 (Recursive Validation).
