answer: |-
  **Joint Statement on the Temporal Structure of Color Phi Experience**

  **Context:** This document formalizes an adversarial collaboration regarding the Color Phi phenomenon. Subject S sees a red flash at location A, followed ~100ms later by a green flash at location B. S reports a single dot moving from A to B, changing color mid-path. The perceptual content (color change at mid-path) appears to precede the physical availability of the second stimulus. We distinguish Camp 1 (Phenomenal Authority: timing is settled by report) from Camp 2 (Neural Realism: timing is a fact independent of report).

  ### 1. Agreed Claims
  1.  **Report as Data, Not Truth:** Verbal reports establish that the subject *judges* the experience to have occurred at a specific time, but neither camp agrees that this judgment infallibly tracks the onset of the underlying conscious episode.
  2.  **Processing Latency:** Both camps agree that neural processing of the second flash requires finite time (>50ms). Any model claiming the experience occurs strictly veridically with the stimulus sequence violates causal closure.
  3.  **Modal Generality:** The anomaly generalizes to auditory and tactile apparent motion. Any solution must explain the cross-modal temporal binding window, not just visual specifics.
  4.  **Confound in Existing Designs:** Current methodologies confound the time of experience with the time of memory consolidation and report generation. No existing design isolates the phenomenological timestamp from the reporting timestamp.
  5.  **Mutual Debts:** Camp 1 owes Camp 2 an account of why neural processing limits do not constrain phenomenal timing. Camp 2 owes Camp 1 an account of how neural timing is identified without circular reliance on the very reports Camp 1 claims constitute the phenomenon.

  ### 2. Disagreements

  | Issue | Neutral Statement | Camp 1 Formulation (Phenomenal Authority) | Camp 2 Formulation (Neural Realism) |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Timing** | Does experience have a timestamp independent of judgment? | The timing of experience is constitutive of the subject's retrospective judgment. There is no "hidden" timestamp. | Experience is a neural event with a definite onset time. Judgment attempts to track this time but may fail. |
  | **Orwellian vs. Stalinesque** | Are these exhaustive categories? | The distinction is false dichotomy. If report is authoritative, the experience is whatever is reported, rendering the distinction verbal. | The distinction is real. Either the memory was rewritten (Orwellian) or the percept was delayed (Stalinesque). One is physically true. |
  | **Evidence Independence** | Can neural data adjudicate the timing? | Neural data correlates with report, not experience directly. It cannot override the subject's authoritative account of their own timeline. | Neural data can reveal processing latencies that contradict report, proving the report is a reconstruction rather than a readout. |

  ### 3. Cruxes and Experimental Designs

  **Crux 1: Authority of Report (Timing vs. Content)**
  *   **Question:** Does the subject have privileged access to *when* they experienced something, or only *what* they experienced?
  *   **Design:** **Involuntary Index.** Measure smooth-pursuit eye movement onset relative to the apparent path. This motor response requires no conscious report.
  *   **Camp 1 Prediction:** Eye movement onset will correlate with the *reported* timeline. If the report says "mid-path," the eyes track mid-path. The motor system obeys the constructed narrative.
  *   **Camp 2 Prediction:** Eye movement onset may diverge from report. If the eyes react to the second flash before the reported "mid-path" experience time, the experience is delayed (Stalinesque), and the report is post-hoc.
  *   **Stake:** If motor response precedes the reported experience time, Camp 1's claim that report settles the timeline is undermined.

  **Crux 2: Circularity of Neural Correlates**
  *   **Question:** Can neural evidence be independent if NCCs are selected by correlating them with report?
  *   **Design:** **TMS/Masking Intervention.** Apply TMS or a masking flash at variable delays after the second flash to disrupt processing.
  *   **Camp 1 Prediction:** Disruption alters the report; therefore, it alters the experience. There is no gap between the disrupted report and the disrupted experience to measure.
  *   **Camp 2 Prediction:** Disruption alters the neural substrate. We can measure the disruption window independently. If disruption at 80ms abolishes the motion percept but report claims otherwise, the neural fact overrides the report.
  *   **Stake:** Camp 2 must demonstrate a neural marker selected *without* reliance on temporal report (e.g., based on latency alone) that predicts phenomenological failure.

  **Crux 3: Determinacy vs. Indeterminacy**
  *   **Question:** Is the experience's timing indeterminate over an interval, or must it resolve to a point?
  *   **Design:** **Stretched Delay.** Increase the Inter-Stimulus Interval (ISI) well past the integration window (e.g., 500ms).
  *   **Camp 1 Prediction:** If subjects still report motion (perhaps under specific framing), the experience's timing remains indeterminate or flexible. Indeterminacy is coherent; experience is not a point-event.
  *   **Camp 2 Prediction:** At long ISIs, the illusion breaks. This proves experience requires specific temporal binding. Timing is determinate; if the binding window closes, the experience cannot exist at the earlier time.
  *   **Stake:** If the illusion persists at impossible ISIs, Camp 2's physicalist constraints fail. If it breaks, Camp 1 must explain why indeterminacy has hard physical limits.

  ### 4. Falsification and Progress

  **Falsification Conditions**
  *   **Camp 1:** Will concede if an involuntary index (eye movement or EEG marker) systematically precedes the earliest possible time the subject claims to have experienced the event, demonstrating a dissociation between experience onset and reportable judgment.
  *   **Camp 2:** Will concede if all interventions (TMS, masking) only alter the *report* of timing without altering the *content* of the experience in predictable neural ways, suggesting neural timing is irrelevant to phenomenal timing.

  **Guardrails Against Definitional Victory**
  Camp 2 reserves the right to challenge Camp 1 if "report" is expanded to include involuntary neural markers, thereby making Camp 1's claim unfalsifiable tautology ("experience is what the brain says it is"). Camp 1 must specify a boundary where a physical signal counts as evidence *against* the subject's timeline, not just evidence *of* it.

  **Criteria for Progress**
  Both camps agree that the debate moves only if a design yields a prediction where:
  1.  Camp 1 predicts Outcome X.
  2.  Camp 2 predicts Outcome Not-X.
  3.  The outcome is measurable without relying on the subject's verbal testimony regarding time.

   Mere reinterpretation of the same data (e.g., calling a neural delay "construction" vs. "rewriting") counts as stagnation. We commit to publishing results regardless of which prediction is borne out.
