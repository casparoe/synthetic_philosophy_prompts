answer: |-
  You have put your finger on one of the oldest and deepest tensions in moral philosophy. The observation you've made is sharp: there is a disconnect between the "impartial" theories that dominate academic ethics and the "partial" reality of how humans actually live and judge one another.

  Here is a breakdown of the names for this approach, the strongest arguments against it, and the assumptions it relies on.

  ### 1. Is there a name for this?

  There isn't one single word like "Utilitarianism" that captures exactly what you're describing, but there are three overlapping terms that philosophers use to take this view seriously.

  **A. The Ethics of Special Obligations (or Special Duties)**
  In analytic philosophy, this is the precise technical term for what you are describing. The debate is usually framed as **Impartiality vs. Partiality**.
  *   **The View:** We have "general duties" to all humans (don't kill, don't steal), but we also have "special duties" that arise solely from specific relationships (parent-child, friend-friend, citizen-state).
  *   **The Claim:** These duties are not derived from general rules (e.g., "I help my mom because it maximizes happiness"). They are *sui generis*—they exist *because* the relationship exists. To deny them is to misunderstand the nature of the relationship.

  **B. Care Ethics (Feminist Ethics)**
  Emerging in the 1980s (notably Carol Gilligan and Nel Noddings), this framework was built specifically to challenge the "rulebook" approach (which they labeled "Justice Ethics").
  *   **The View:** Morality is not about applying abstract principles to cases; it is about maintaining the web of relationships that sustain life.
  *   **The Claim:** The "rulebook" approach assumes a detached, isolated agent. Care Ethics argues we are fundamentally interdependent. Moral maturity isn't learning to be more impartial; it's learning to respond more sensitively to the needs of those in your care.

  **C. Role Ethics (specifically Confucianism)**
  If you want a historical system that treats relationships as the *foundation* of morality rather than an exception to it, look to Confucianism.
  *   **The View:** You are not an individual who *has* relationships; you are the sum of your roles (son, father, ruler, subject, friend).
  *   **The Claim:** There is no "human" in the abstract. There is only a father-son dynamic, a husband-wife dynamic, etc. Morality is simply performing the duties of your roles well (*Li*). In this system, saving your father over a stranger isn't a "bias"; it is the fulfillment of the cosmic order.

  **A Key Philosophical Reference:**
  You should look up the philosopher **Bernard Williams**. In his famous critique of Utilitarianism, he described a man who saves his wife from drowning. If the man stops to calculate whether saving his wife maximizes overall utility, Williams says he has had **"one thought too many."** The fact that she is his wife should be the immediate reason for saving her, not a calculation derived from a rulebook.

  ### 2. What is the strongest argument against it?

  If you are sympathetic to the relationship approach, the thing that should make you doubt it most is **The Problem of Injustice (or Tribalism).**

  The "Rulebook" approach, for all its coldness, provides a mechanism for criticizing powerful groups. If morality is based on universal rules, then a King is subject to the same laws as a peasant. If morality is based on relationships, morality becomes fragmented.

  **The Critique:**
  1.  **The Mafia Problem:** A Mafia Don might be a perfect exemplar of the "Relationship Approach." He is fiercely loyal to his family, generous to his friends, and protective of his community. But he murders strangers to maintain that loyalty. If relationships generate fundamental obligations, how do we condemn him? He is fulfilling his special duties perfectly.
  2.  **The Outsider Problem:** If my duties are generated by my relationships, what obligation do I have to a starving child on another continent with whom I have no relationship? The Rulebook approach says "they are a human, therefore they matter." The Relationship approach risks saying "they are a stranger, therefore they do not matter."
  3.  **Moral Luck:** The Relationship Approach makes your moral life depend on luck. If you are born into a loving family, you have rich moral obligations. If you are an orphan with no friends, do you have fewer moral obligations? It seems strange to say that a loner is morally "poorer" than a father of five.

  **The Strongest Objection Summarized:**
  > "By grounding morality in relationships, you lose the ability to criticize the boundaries of those relationships. You turn morality into a system of 'Us vs. Them,' where being good to 'Us' justifies being indifferent (or hostile) to 'Them'."

  ### 3. What assumptions does this depend on?

  The Relationship Approach rests on specific metaphysical and psychological assumptions. If you drop them, the framework collapses back into the Rulebook.

  **Assumption 1: The "Embedded Self"**
  *   **The Assumption:** Human beings are not atomic individuals who choose to enter relationships. We are born into a web of connections that constitute who we are.
  *   **If Dropped:** If you assume the "Atomic Self" (that you exist prior to your relationships), then relationships become voluntary contracts. If they are voluntary, they can be overridden by general rules. The Relationship Approach requires that you are *constituted* by your connections.

  **Assumption 2: Relationships are Value-Conferring**
  *   **The Assumption:** The relationship itself creates the value/duty. I don't help my friend because they are valuable; they are *my friend*, and that status creates the duty.
  *   **If Dropped:** If you assume that value is objective and independent (e.g., "Human Life has Value X"), then the relationship is just a heuristic for delivering that value. This leads back to the Rulebook (e.g., "I help my friend because it's efficient, not because it's *my* friend").

  **Assumption 3: Impartiality is a Fiction (or a Vice)**
  *   **The Assumption:** The "View from Nowhere" (trying to see the world without a perspective) is impossible for humans, and attempting it leads to alienation.
  *   **If Dropped:** If you assume impartiality is the definition of rationality, then the Relationship Approach is automatically irrational. To hold the Relationship view, you must redefine rationality to include emotional attachment as a form of reasoning.

  ### Summary
  You are describing **The Ethics of Special Obligations**, often championed by **Care Ethicists** and **Communitarians**, and historically codified in **Confucian Role Ethics**.

  It is a serious, robust moral framework. However, its Achilles' heel is **boundary management**: it explains beautifully why you should save your child, but it struggles to explain why you shouldn't steal from a stranger to do it. The most mature moral systems usually attempt to hybridize: they accept special obligations as real, but place *constraints* on them using impartial rules (e.g., "Love your neighbor, but do not murder the stranger to do it").
