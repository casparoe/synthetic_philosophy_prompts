      *   (g) vs (a): *Strong Conflict.* Expats decades abroad vs. Residents 1 year wait. This seems the biggest hole in the "Affected Interests" theory.

  4.  **Drafting the Audit - Section by Section:**

      *   **1. Real Conflicts:**
          *   *Conflict 1: (a) Affected Interests vs. (g) Expatriate Voting.*
              *   Why: Expats decades abroad have diminishing affectedness. New residents have immediate affectedness but wait a year. This inverts the logic of (a).
