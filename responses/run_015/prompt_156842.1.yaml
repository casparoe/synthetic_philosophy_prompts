              *   Severity: Medium-High. Creates a "rights without remedy" gap for under-14s.
          *   *Conflict 3: (d) Compulsion vs. (d) Right to Withhold Endorsement.*
              *   Why: Colleague's point. If voting is a *duty of self-rule* (e), does marking "none of the above" fulfill the duty? If the duty is to *choose rulers*, abstention fails. If the duty is to *show up*, it passes. But (e) says "duty of democratic self-rule," which implies decision-making.
              *   Severity: Medium. Normative coherence of the duty.

      *   **2. Apparent Conflicts:**
          *   *Tourists vs. (a):* Dissolves on the "long run" qualifier in (a). Tourists are transient. Cost: Need to define "long run" rigorously.
          *   *CV + Secret Abstention:* Dissolves if the duty is defined as *participation in the ritual of accountability* rather than *selection*. The secret ballot protects against coercion, not against the duty to participate.
          *   *(b) No Competence vs. (c) Age 14:* Looks like age is a competence proxy. But (c) is substantive/moral (status of youth), not epistemic. So no conflict if (c) is framed as a status right, not a capacity test.

      *   **3. Cheapest Repairs:**
          *   *Expats:* Limit expat voting to a period (e.g., 5-10 years) or require intent to return. *Price:* Alienates diaspora lobby, admits citizenship has *some* weight over pure affectedness.
          *   *Under-14s:* Acknowledge they have affected interests but lack *political agency* (distinct from competence). Accept the "rights without remedy" gap until 14, or allow proxy *only* if stripped from parents (e.g., guardian appointed by lot? Too complex). Cheapest: Admit (a) is the *prima facie* claim, but (c) sets the *exercise* threshold based on developing agency. *Price:* Theoretical messiness between claim and exercise.
          *   *CV/Abstention:* Reframe the duty. It is a duty to *submit to the collective process*, not necessarily to *pick a winner*. *Price:* Weakens the "self-rule" argument in (e).

      *   **4. Overall Recommendation:**
          *   The biggest leak is (g) regarding expats vs. (a).
          *   Recommendation: Abandon indefinite expat voting.
          *   Loss: Political popularity, consistency with current laws in some places, but saves the core theory (a).

      *   **5. Missing Elements:**
          *   Distinction between *Claim-Holder* and *Vote-Exerciser*.
          *   Definition of "Substantial Affectedness" (threshold problem).
          *   Empirical claim: Do 14-year-olds have distinct interests from parents? (Crucial for (f)).
          *   Empirical claim: Does CV actually improve policy uptake? (Crucial for (e)).

  5.  **Refining the Output (Self-Correction/Polishing):**
      *   *Tone:* Professional, philosophical, blunt, authoritative.
