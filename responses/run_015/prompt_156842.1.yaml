      *   (d) *Compulsory Voting (CV) + Secret Ballot + Abstention:* Must vote (fine), but can formally abstain secretly. Right to withhold endorsement.
      *   (e) *Grounds for CV:* Civic duty, representativeness (mirror population), policy uptake.
      *   (f) *No Proxy Voting for Kids:* Kids are independent agents-in-becoming. Proxy voting violates equality (fertility) and agency.
      *   (g) *Boundary Assumptions:* 1-year residency for newcomers OK. Expats vote forever OK.
