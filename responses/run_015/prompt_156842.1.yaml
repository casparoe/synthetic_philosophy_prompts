  3.  **Private Step 2: Pairwise Testing (Mental Matrix):**
      *   (a) vs (g): *Conflict.* If AAP is the ground, why do expats vote forever (diminished affectedness) while new residents wait a year (immediate affectedness)?
      *   (a) vs (f): *Tension.* If kids are affected (implied by voting at 14), why no proxy before 14? If they are independent agents at 14, are they affected before? (a) says affectedness grants claim. (f) says agency prevents proxy.
      *   (a) vs (c): *Consistency.* If affectedness grounds it, do 14-year-olds have distinct affected interests compared to 13-year-olds? (c) says 14 is substantive. (a) says affectedness is the ground. Need to ensure 14yo affectedness is distinct or (c) overrides (a).
      *   (d) vs (e): *Consistency.* (e) gives grounds for (d).
