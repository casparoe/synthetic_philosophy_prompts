answer: |-
  Here is the agenda. You have eight months and zero budget, which means you cannot afford to chase empirical validation or get bogged down in historical exegesis. Your team composition is ideal for formal and conceptual work, so you must leverage that. You are not building a cognitive model to fit data; you are building a formal framework to test viability.

  Here are the three questions you will pursue, ranked by priority.

  ### 1. The Formal Syntax of Continuous Parameters (Priority 1)
  **The Question:** Can we define a formal grammar that allows discrete symbolic slots to be filled by continuous, analog values without breaking the rules of compositionality?
  **Who:** Logician (lead), Phil Mind.
  **Why Upstream:** This is the foundation. If you cannot write down the representational format rigorously, you cannot test whether it supports reasoning. Most critiques of hybrid LOT fail because the "analog" part is treated as vague imagery rather than a structured component. You need to define the "slot" mechanics. Does the analog part behave like a variable with a range constraint? Is it a vector embedded in a symbolic tree?
  **Tractability:** High. This is pure formal work. The logician can adapt existing systems from diagrammatic reasoning or sorted logic to accommodate continuous parameters. The philosopher ensures the definitions align with the conceptual requirements of thought (e.g., stability, re-identifiability).
  **Deliverable:** A formal specification of a "Hybrid LOT" syntax within 3 months.

  ### 2. The Mechanics of Direct Inference (Priority 2)
  **The Question:** Can we define inference rules that operate directly on the analog components without translating them into discrete propositions first?
  **Who:** Cog Sci (lead), Logician.
  **Why Downstream:** Once you have the syntax (Question 1), you must show it *does* work. The classic objection is that analog representations are inferentially weak—you can't run modus ponens on a mental map. You need to demonstrate transformation rules that preserve truth or validity while manipulating the continuous values (e.g., spatial rotation or magnitude comparison) as part of the logical derivation.
  **Tractability:** Medium. This requires computational modeling or proof theory. The Cog Sci person can build a toy simulation to show feasibility, while the logician checks for consistency. Since you have no data, you are proving *possibility*, not *actual human performance*.
  **Deliverable:** A set of inference rules and a proof-of-concept simulation within 6 months.

  ### 3. The Systematicity Boundary (Priority 3)
  **The Question:** At what point of complexity does the hybrid system fail to produce systematicity, and does that threshold match human cognitive limits?
  **Who:** Phil Mind (lead), Cog Sci.
  **Why Evaluation:** This is your payoff argument. Classical LOT claims only discrete symbols explain systematicity (if you can think "A loves B," you can think "B loves A"). You need to argue whether your hybrid system preserves this or if it offers a better explanation for *graded* systematicity (where humans sometimes fail at complex recursions).
  **Tractability:** High. This is conceptual analysis backed by the results from Questions 1 and 2. You are comparing the logical properties of your system against the known phenomena of human reasoning.
  **Deliverable:** A theoretical paper arguing for the viability of Hybrid LOT based on your formal results by month 8.

  ### The Flip Condition
  Your ordering assumes Question 1 is solvable. **If the Logician produces an impossibility proof showing that any inclusion of continuous parameters necessarily destroys recursive compositionality,** you stop immediately. You do not move to Question 2. Instead, you pivot to arguing that systematicity itself is an overrated constraint for a theory of thought, or you redefine compositionality. That result invalidates the upstream foundation, making the rest of the sprint worthless.

  ### Distractions to Avoid
  1.  **Neural Implementation:** Do not attempt to map these representations to specific brain regions or neural coding schemes. You have no funding for imaging or modeling at that level. It is a rabbit hole that will consume your timeline without yielding philosophical clarity.
  2.  **Acquisition and Learning:** Do not try to explain how these hybrid representations are learned. That requires empirical data on development or training regimes. Stick to the structure of the representations themselves, not their genesis.
  3.  **Historical Debates:** Do not spend time re-arguing Fodor or Pylyshyn directly. Use their constraints as design requirements, not as opponents to defeat in a literature review. Your work should stand on the formal merits of the new system, not on critiquing the old one.

  ### Execution Strategy
  You are running a theoretical construction project. Month 1-3 is for the Logician and Phil to lock down the syntax. Month 4-6 is for the Cog Sci person and Logician to build the inference engine. Month 7-8 is for the Phil and Cog Sci person to write up the implications for systematicity.

  If you try to do all three simultaneously, you will fail. If you try to gather empirical evidence to support Question 2, you will run out of money. Stick to the formal viability. If you can prove that a hybrid LOT is logically coherent and inferentially robust, you have succeeded. Go.
