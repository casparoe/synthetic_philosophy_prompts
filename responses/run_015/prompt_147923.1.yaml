  | Rep/Vehicle | Pass | Fail | Pass | Pass | General |
  | Causal Part | Pass | Weak | Pass | Pass | General |

  Gene Selectionism fails Multi-Level and Unit Def by reducing higher levels to gene statistics. MLS passes Tractability and Multi-Level but is often statistically rather than causally defined, risking ambiguity in (g). Replicator/Vehicle defines Units well but lacks Tractability for field biologists due to abstract definitions. Causal Partitioning meets Causal ID but struggles with Tractability due to data requirements. None satisfy all non-negotiables perfectly, but Causal Partitioning and MLS come closest to the purpose. Gene Selectionism is excluded by the Multi-Level requirement.

  6. The constructed cases

  Case (d): The symbiotic pair. To decide if it is a unit, measure the heritability of the *pair's* combined fitness relative to the variance in partner fitness. If the pair's fitness variance is heritable and exceeds the sum of independent partner variances, it is a unit. My list handles this via Unit Criteria and Simultaneous Selection. It requires measuring cross-partner fitness effects. If the pair reproduces as a unit (vertical transmission dominates), it is a higher-level unit.

  Case (f): Non-genetic inheritance. If "heritability" is defined genetically, my list fails here. I marked Inheritance Generalization as Non-negotiable. If a trait evolves via cultural transmission, the level of selection is the group possessing the culture. The list runs out only if inheritance is rigidly defined as DNA. I revise: Inheritance Generalization is Non-negotiable for a modern account. The theory must measure transmission fidelity of the behavior, not genes. If fidelity is high enough to sustain selection, it is a unit of evolution.
