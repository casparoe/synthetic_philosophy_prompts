  1. The purpose

  I accept the purpose but revise it to insist on *causal* measurement. A theory that only provides statistical partitions (like the Price equation alone) fails because statistics do not dictate which variables to manipulate. The biologist needs to know which intervention changes the evolutionary trajectory, not just how to account for change after the fact. Consequently, the list prioritizes causal identifiability over metaphysical completeness or mathematical elegance. Any requirement demanding purely statistical uniqueness is demoted, as statistics are tools, not truth. This revision shifts the burden from finding a perfect equation to identifying testable causal structures.

  2. Desiderata

  1. **Causal Identifiability (Non-negotiable).** Motivated by (g). Statistical partitions of fitness variance are mathematically arbitrary; causal accounts are not. A theory must specify which correlations reflect causal influence. Without this, "what to measure" is undefined, as any covariance can be partitioned multiple ways.
  2. **Empirical Tractability (Non-negotiable).** Motivated by Purpose. Biologists cannot measure complete causal graphs. The theory must yield verdicts using standard field data: relatedness, group composition, and fitness components. If it requires experimental manipulation impossible in nature, it fails the working biologist.
  3. **Simultaneous Selection (Non-negotiable).** Motivated by (b) and (e). A theory must permit selection to act at multiple levels concurrently without reducing one to the other. Gene-level and organism-level selection must be distinguishable even when aligned, and conflict must be representable.
  4. **Unit Criteria (Non-negotiable).** Motivated by (d) and (e). The theory must define necessary conditions for a unit (e.g., heritable variance in fitness) to distinguish genuine units from mere collections or substrates. It must handle the disappearance of units during transitions without collapsing into ambiguity.
  5. **Adaptation Accumulation (Non-negotiable).** Motivated by Purpose. The theory must identify where design accumulates. If a trait benefits the group but evolves via individual selection, the theory must label it individual adaptation. Location of adaptation must track the level of effective selection.
  6. **Inheritance Generalization (Non-negotiable).** Motivated by (f). For a modern account, "heritability" cannot be restricted to DNA. If a trait evolves via cultural transmission, the theory must handle it. Restricting to genetics makes the theory obsolete for systems with non-genetic inheritance.
  7. **Model Stability (Non-negotiable).** Motivated by (a). Verdicts on the level of selection must not depend on arbitrary choices of notation or causally equivalent model formulations. Kin-selection and group-selection parameterizations must yield the same causal verdict even if math differs.
  8. **Lower-Level Parsimony (Preference).** Motivated by Gene-selectionism. The demand to "never invoke a higher level when a lower-level account plus population structure will do" is a methodological preference, not a truth condition. It begs the question against emergent causality and is rejected as a requirement.
  9. **Inclusive Fitness Agreement (Preference).** Motivated by Kin-selectionism. Reproducing IF verdicts is desirable where IF applies, but IF is a specific modeling tool, not a universal standard. Failure to agree does not falsify a general theory of selection levels.
  10. **Unique Statistical Partition (Preference/Impossible).** Motivated by (g). Demanding a unique statistical partition is mathematically unsound. Multiple partitions sum to the same total. Only causal partitioning can be unique. This demand is rejected as incoherent.

  3. Joint unsatisfiability

  Three tensions threaten coherence. First, **Causal Identifiability vs. Empirical Tractability**. To confirm causality, one ideally needs manipulation (intervention). Field biologists often rely on observation. A theory demanding strict causal proof may be unusable; one accepting observational proxies risks statistical confounding. You cannot have perfect causal knowledge with limited data.

  Second, **Simultaneous Selection vs. Unique Partition**. If selection acts at two levels, partitioning the total change into level-specific components is mathematically possible but causally delicate. If the levels interact (contextual effects), attributing change uniquely to one level may obscure the mechanism. A theory demanding unique attribution might force false dichotomies on interacting systems.

  Third, **Unit Criteria vs. Major Transitions**. Defining a unit requires stability (heritability, fitness variance). But transitions (e) are processes where a unit loses independence. A static definition struggles to categorize entities mid-transition. A theory must either accept fuzzy boundaries or fail to describe evolution in progress. These tensions suggest the desiderata define an ideal limit, not a reachable algorithm. The biologist must trade off causal certainty for data availability.

  4. The decisive requirement

  The decisive requirement is **Causal Identifiability**. This excludes purely formal accounts (like the Price equation without causal interpretation) which treat all partitions as equally valid. It also excludes strict Gene Selectionism that treats higher-level selection as merely metaphorical statistics. By demanding that the theory distinguish causal influence from statistical correlation, it forces a commitment to a specific causal structure. This eliminates instrumentalist approaches that claim "all models are equivalent" and demands a theory that tells the biologist which intervention matters. It is the filter that separates accounting from explanation.

