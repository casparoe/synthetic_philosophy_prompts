answer: |-
  This is an exceptionally sharp set of questions. You have put your finger on the exact tension that keeps the literature churning. As a physiologist, your intuition is aligned with what philosophers call **Cummins functions** (current causal role in a system), whereas teleosemantics relies entirely on **Millikan/etiological functions** (historical selection effect).

  The short answer to your deepest worry is this: The indeterminacy you see is not a bug in the theory, but a feature of the trade-off. Teleosemantics is an engineering solution to a specific problem (normativity/error). It solves that problem by sacrificing immediacy and transparency. Whether the project "survives" depends on whether you think "mental content" *must* have normativity built in, or whether that's just a philosophical fetish.

  Here is the breakdown of the choice points, the work the history is doing, and the concrete application to your two scenarios.

  ### 1. The Core Disagreement: Cummins vs. Millikan Functions

  You asked: *What work is the etiological notion of function doing that the current-causal-role notion can't do?*

  In physiology, if a potassium channel opens when the membrane potential hits -40mV, its function is to pass potassium at -40mV. If the environment changes and passing potassium now kills the cell, the channel hasn't changed its function; the *consequences* of its function have changed. This is a **Cummins function**. It is ahistorical and forward-looking (what does it contribute to the current capacity?).

  Teleosemantics (specifically the Ruth Millikan variant you are discussing) argues that Cummins functions cannot ground **misrepresentation**.
  *   **The Logic:** If content is determined by current causal role or current covariation, then whatever the mechanism *does* is what it is *for*. If node $N$ fires at ash flakes, and that is its current causal trigger, then $N$ represents "ash flakes." Truth is guaranteed by existence.
  *   **The Problem:** Mental states seem to have conditions of satisfaction that can fail. A belief can be false. A map can be wrong. If function is just "what it does," a false belief is just a "belief that does something else." You lose the normative gap between *is* and *ought*.
  *   **The Solution:** The etiological function creates a standard independent of current performance. $N$ is *supposed* to fire at midges because that is what it was selected for. If it fires at ash, it is malfunctioning, even if it is mechanically intact.

  **Load-bearing distinction:** The history is not there to explain how the mechanism works (physiology); it is there to explain how the mechanism can be *wrong* (semantics). If you don't care about "wrongness" as a natural kind, you don't need the history.

  ### 2. Working Through Scenario 1: The Midge/Ash Shift

  *Setup:* $N$ fires on dark moving spots. History = Midge. Current reality = 90% Ash.
  *Question:* Is content "Midge" (error) or "Dark Spot" (veridical)?

  **The Teleosemantic Answer:**
  Content is **"Midge"** (or more precisely, "Prey at location L"). The tokens firing at ash are **misrepresentations**.

  **Why?**
  Teleosemantics is a **Consumer Semantics**. The content of a signal is determined by the needs of the mechanism that *consumes* the signal to perform its proper function.
  1.  **The Consumer:** The strike mechanism.
  2.  **The Consumer's Function:** To capture nutrition (selected historically).
  3.  **The Condition for Success:** For the strike to succeed, there must be a midge at the location indicated by $N$.
  4.  **The Signal's Function:** To indicate the presence of the condition required for the consumer's success.

  Because the consumer was selected to strike *at midges*, the signal is supposed to indicate *midge*. The fact that $N$ currently covaries with ash is irrelevant to its content, just as a thermometer broken to read "20°C" constantly still has the content "Temperature," not "Broken Sensor."

  **What you buy/give up:**
  *   **Buy:** You preserve the intuition that the agent is making a *mistake*. The behavior is maladaptive relative to the design.
  *   **Give up:** You sever the link between content and current information. The signal carries information about ash (in the Shannon sense), but has content about midges. This feels unnatural to an information theorist, but it is necessary to save the notion of "false belief."

  **The Physiological Objection:**
  You might say, "But the system is working exactly as designed mechanically." Teleosemantics replies: "It is working mechanically, but it is failing teleologically." The distinction relies entirely on the historical fact that ash flakes were not the selecting condition. If you remove the history, you remove the mistake.

  ### 3. Working Through Scenario 2: The Polarization Cue

  *Setup:* Mutation allows $N$ to fire on sky polarization (reliable prey cue). Co-option occurs. Fixation follows.
  *Question:* When does content switch? Is there a period of non-content?

  **The Teleosemantic Answer:**
  Strictly speaking, there is a **lag**. Content is fixed by *established* proper function.

  1.  **The Mutation Phase:** When the mutation first appears, the new polarization-sensitivity has no selection history. It is a "monster" (Millikan's term). It has no proper function yet.
  2.  **The Status of Tokens:** During the drift phase (before fixation), when $N$ fires on polarization, it does not strictly have representational content. It is a causal trigger that *happens* to be useful. It is not yet a "representation" because there is no norm yet.
  3.  **The Switch:** Content switches only once the new mechanism has been selected for sufficiently long that we can attribute a new Proper Function to it.
  4.  **Misrepresentation during transition?** If the polarization cue fails during the drift phase, it is not "misrepresentation" in the strict sense; it is just failure to cause a successful strike. There is no "ought" yet.

  **What you buy/give up:**
  *   **Buy:** You maintain a rigorous definition of content tied to selection. You avoid saying that every new causal correlation instantly generates new mental content.
  *   **Give up:** You accept that representation is a "slow" property. It lags behind the physical reality of the mechanism. This implies that a Swampman (a molecule-for-molecule duplicate with no history) has no thoughts, only causal reactions.

  **Is the difference between "misrepresenting" and "not representing" principled?**
  Yes, on this view. "Misrepresenting" requires an existing norm (a Proper Function). "Not representing" means the norm is not yet established. The principled difference is the existence of a selection history long enough to define a "Normal Condition" (the conditions under which the mechanism historically performed its function).

  ### 4. The Hard Question: Substantive or Stipulative?

  You asked: *Is the indeterminacy here a substantive disagreement about what content is, or a choice of which notion to theorize with? And does the naturalization project survive that?*

  This is the crux. Here is the honest assessment:

  **1. It is a choice of theoretical framework.**
  There is no "fact of the matter" in the physics of the agent that dictates whether $N$ means "Midge" or "Dark Spot." The physics only dictates firing patterns and causal consequences. The assignment of "content" is a mapping we impose to explain the system's behavior in intentional terms.
  *   If you choose **Informational Semantics** (Fodor/Dretske early), you map content to current covariation. You gain transparency but lose robust error.
  *   If you choose **Teleosemantics** (Millikan/Price), you map content to historical function. You gain robust error but lose transparency and immediacy.

  **2. Does the project survive?**
  It survives *if* your goal is to naturalize **normativity**.
  If you think the defining feature of the mental is that beliefs can be *false* and desires can be *unsatisfied* in a way that is not just "causally ineffective," then you *must* go historical (or modal). Current causal roles cannot generate "oughts."
  However, if you think "content" is just a shorthand for "causal disposition to behave in context," then teleosemantics is over-engineering. You could adopt a **Pragmatist** or **Interpretivist** view (like Dennett) where content is in the eye of the beholder, not in the history of the agent.

  **3. The "Indeterminacy" is the Price of Admission.**
  The slippage you see between "Midge," "Dark Spot," and "Prey" is not a failure of teleosemantics to find the *one true content*. It is a reflection of the fact that "content" is a high-level description that compresses multiple levels of biological reality (proximal stimulus, distal object, fitness consequence).
  *   Teleosemantics chooses to anchor the compression at the **fitness consequence** (what the consumer needed).
  *   Other theories anchor it at the **proximal stimulus** (what causes the firing).

  **Verdict:**
  The naturalization project survives, but it changes status. It stops being a "reduction" (finding the physical thing that *is* content) and starts being a "functional analysis" (proposing a definition of content that solves the philosophical problems we care about, like error).

  If you are a physiologist, you might find this unsatisfying. It implies that two identical ion channels in identical cells have different "functions" (and thus different semantic contents, if they were representational) solely because one is in a lineage that was selected for it and the other is a Swampman duplicate.
  *   **Physiological reality:** They are identical.
  *   **Teleosemantic reality:** One is a representation, the other is a mimic.

  **Conclusion:**
  You are right to feel that the history looks irrelevant to the *mechanism*. It is. It is relevant only to the *norm*.
  *   If you want to explain how the agent works *now*, use Cummins functions (physiology).
  *   If you want to explain how the agent can be *wrong* now, use Millikan functions (teleosemantics).

  The "indeterminacy" you spotted is the boundary where these two projects rub against each other. Teleosemantics prioritizes the "wrongness" at the cost of making content historically laggy and opaque. Whether that is a worthwhile trade depends on whether you think "being wrong" is a phenomenon that needs a biological basis, or just a way of talking about causal mismatch. Most in your reading group likely assume the former; your physiological background rightly suggests the latter might be sufficient.

  **Recommendation for the group:**
  Ask them specifically about the **"Swampman" objection**. If they say Swampman has no thoughts, they are committed to the hard historical line (and your Scenario 2 lag). If they say Swampman *does* have thoughts, they are secretly smuggling in a current-causal or modal notion of function, and the theory is less historical than it claims. That is usually where the real distinctions lie.
