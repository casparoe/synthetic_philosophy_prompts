prompt: |-
  i'm writing a novel where two characters are locked in a strategic standoff — each trying to anticipate what the other will do, and each knows the other is doing the same. i've been reading about common knowledge in epistemic game theory, the idea that for strategic equilibrium you need not just that everyone's rational, but that everyone knows everyone's rational, and everyone knows everyone knows, and so on all the way up. here's the thing i can't get my head around: what's the actual difference between "everyone knows X" and "X is common knowledge" when you're inside a character's head trying to figure out what someone else will do? i understand the formal definition — the infinite hierarchy of "i know that you know that i know..." — but i don't get what work the infinite part is doing. why wouldn't it be enough to go, say, three or four levels deep? can you give me a case where two characters both know something, and both know the other knows it, and both know the other knows they know it — but it still isn't common knowledge, and the difference actually changes what they should do? i want the kind of example that would make sense in a novel, not a game theory textbook. and then, seperately: is there any psychologically realistic way to write a character who is actually tracking this infinite regress in their head, or is the point of the concept that real people can't do it and that's why coordination breaks down?
