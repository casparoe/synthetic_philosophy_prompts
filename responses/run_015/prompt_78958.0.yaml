answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Necessity and Nature of Innate Structure in General Intelligence
  **Parties:** The Proponent of the Turing "Child Machine" Hypothesis (Party T) and The Proponent of the Nativist Structural Hypothesis (Party N).
  **Date:** October 26, 2023

  ## I. AREAS OF CONSENSUS

  We, the undersigned, having engaged in good-faith adversarial collaboration, affirm the following claims as mutually accepted premises for our continued inquiry:

  1.  **Physical Substrate:** Both parties agree that any intelligent system must be instantiated on a physical substrate possessing *some* initial physical organization. Neither party claims intelligence arises from a literal void or a substrate lacking causal laws.
  2.  **Definition of "Education":** Both parties define "education" broadly as the process of system modification via interaction with an environment, including supervised instruction, reinforcement signals (reward/punishment), and unsupervised exposure to data.
  3.  **The Role of Learning:** Both parties agree that learning (change in system state based on input) is a necessary condition for General Intelligence (GI). A static system, regardless of initial complexity, does not constitute a GI without the capacity to adapt to novel tasks.
  4.  **Domain-General Mechanisms:** Both parties acknowledge that a GI must possess *some* domain-general learning mechanisms (e.g., the ability to detect correlations, update weights, or modify logic). The dispute is not about the existence of these mechanisms, but their sufficiency.
  5.  **Evidence Standard:** Both parties agree that the existence of a GI is an empirical matter. The successful construction of a machine that exhibits human-level flexibility across diverse cognitive domains (linguistic, spatial, causal, social) constitutes the primary evidence.
  6.  **Sample Efficiency:** Both parties agree that the amount of data/experience required to reach GI is a relevant metric. A system requiring more data than a human lifespan to achieve human-level competence fails to model human GI adequately, even if it technically achieves the performance.
  7.  **Systematic Generalization:** Both parties agree that a key test of GI is the ability to generalize rules to novel situations not encountered during training (e.g., understanding a sentence structure never before heard).

  ## II. PRECISE FORMULATIONS OF DISAGREEMENT

  To ensure clarity, we formulate our opposing positions such that each party accepts their respective statement as an accurate representation of their view.

  | **Party T (Turing View)** | **Party N (Nativist View)** |
  | :--- | :--- |
  | **The Sufficiency Claim:** A machine initialized with **domain-general** learning algorithms and **minimal domain-specific** constraints can achieve General Intelligence solely through a process of education and environmental interaction. The functional structure of intelligence emerges from the data, not the initial weights. | **The Necessity Claim:** A machine initialized with only domain-general learning algorithms **cannot** achieve General Intelligence. Substantial **domain-specific** inductive biases (innate structure) must be present at initialization to constrain the hypothesis space sufficiently for learning to occur. |
  | **The "Unstructured" Definition:** By "relatively unstructured," we mean lacking pre-encoded knowledge, rules, or modules specific to language, physics, or psychology. We admit the need for a generic engine of plasticity. | **The "Structure" Definition:** By "substantial innate structure," we mean architectural constraints or priors that specifically favor certain types of hypotheses (e.g., hierarchical grammar, object permanence) over others before experience begins. |

  ## III. CRUXES AND PRE-REGISTERED PREDICTIONS

  We identify the following empirical cruxes. For each, we specify the experiment or observation that bears on the dispute and record our predictions in advance.

  ### Crux 1: The Poverty of the Stimulus in Linguistic Acquisition
  *   **Question:** Can a system with no innate linguistic priors acquire recursive, hierarchical grammar from naturalistic input alone within a human-relevant timeframe?
  *   **Adjudication Case:** Training a generic neural architecture (e.g., a Transformer with random initialization and no specific linguistic inductive bias) on a dataset equivalent in size and noise to the linguistic input received by a human child (approx. 10 million words), then testing for systematic generalization to novel syntactic structures.
  *   **Party T Prediction:** The system will successfully acquire recursive grammar and generalize to novel structures, demonstrating that linguistic structure is latent in the data and extractable by general learners.
  *   **Party N Prediction:** The system will fail to robustly generalize to novel syntactic structures or will require orders of magnitude more data than a human child, demonstrating that the stimulus is "poor" without innate grammatical constraints.

  ### Crux 2: Sample Efficiency and Catastrophic Interference
  *   **Question:** Does the absence of modular innate structure lead to prohibitive inefficiencies when learning multiple distinct domains (e.g., physics vs. language) sequentially?
  *   **Adjudication Case:** A "Child Machine" is trained sequentially on Domain A, then Domain B, then Domain C. Performance is measured against a system with modular architectural priors dedicated to each domain type.
  *   **Party T Prediction:** A sufficiently large, generic system will learn all domains without significant catastrophic interference, showing that modularity is an emergent property of optimization, not a prerequisite.
  *   **Party N Prediction:** The generic system will exhibit severe catastrophic interference or require exponentially more data for each subsequent domain, proving that distinct cognitive domains require distinct architectural support to be learned efficiently.

  ### Crux 3: The Limit of Scaling
  *   **Question:** Does increasing data and compute alone overcome the lack of innate structure, or does performance plateau?
  *   **Adjudication Case:** Plotting performance on causal reasoning tasks against model size/data for generic architectures.
  *   **Party T Prediction:** Performance will scale log-linearly with compute and data without a hard ceiling, eventually reaching human-level causal reasoning.
  *   **Party N Prediction:** Performance will plateau below human-level GI regardless of scale, as the architecture lacks the specific causal primitives required to model the world.

  ## IV. NOTE ON VERBAL DISPUTES

  We acknowledge that a portion of our historical disagreement stems from terminological ambiguity regarding the word **"Structure."**

  1.  **The Verbal Component:** Party T often uses "unstructured" to mean "lacking pre-loaded *content* or *rules*." Party N often uses "structure" to mean "the presence of *inductive biases* or *learning algorithms*." Since Party T admits the need for a learning algorithm (which Party N classifies as structure), we agree that if "structure" is defined as "any non-random physical organization," Party T concedes structure is necessary.
  2.  **The Substantive Component:** However, we agree the dispute is **not merely verbal**. Even after clarifying definitions, we disagree on the **specificity** of the required initial organization.
      *   Party T claims the initial organization can be **content-free and domain-general** (e.g., "learn whatever minimizes error").
      *   Party N claims the initial organization must be **content-rich and domain-specific** (e.g., "expect inputs to follow hierarchical tree structures").
      *   **Resolution:** We will henceforth distinguish between **"Architectural Priors"** (Party N's focus) and **"Learning Mechanisms"** (Party T's focus). The dispute remains substantive regarding whether Architectural Priors must encode domain-specific information to achieve GI.

  ***

  **Signed,**

