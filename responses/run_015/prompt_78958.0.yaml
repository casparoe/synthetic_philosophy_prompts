prompt: |-
  Draft the joint statement that a defender of Turing's view that a general intelligence can be produced by educating a relatively unstructured learning machine and a defender of the view that general intelligence requires substantial innate structure could both sign after a good-faith adversarial collaboration. Turing proposed simulating a child's mind and educating it, and he described machines that begin as randomly connected networks shaped by experience; the nativist holds that education cannot supply from scratch the structure that intelligence requires. I want the claims they agree on about learning, education, innate structure, and what would count as evidence for either side; the precise formulations of their disagreement, each phrased so its own side would accept the wording; the cruxes; and, for each crux, the case or argument both would accept as bearing on it, with each side's prediction written down in advance. If you conclude that part of their dispute is merely verbal, say which part and why. Format it as a numbered agreed-claims section followed by a disagreements table.
