  2. The analogy obscures whether there is one user account or two, as consciousness may be an emergent property of process interaction rather than a single login session. Split-brain data suggests two distinct executive threads operating independently rather than one user managing separate windows.
  3. This model smuggles in a computational theory of mind by equating mental states directly with information processing states within isolated modules. If cognition relies on non-computational biological integration, the analogy fails because functional isolation does not guarantee ontological separation.
  4. Unlike static OS processes, hemispheres exhibit neuroplasticity and share subcortical emotional circuits that the server analogy completely ignores. These underlying unified systems prevent a clean split, meaning the "two minds" conclusion is an oversimplification of a partially integrated system.
  5. The "two minds" conclusion survives only if you define mind strictly as verbalizable reportability, which the left hemisphere dominates. Once you account for non-verbal unity and shared affect, the evidence supports conflicting agents within one person rather than fully separate persons.
