answer: |-
  1. The vibration moves through the shell. Legs push toward the wet dark. The air grows hot where the ground is dry, a place my body refuses to enter. My joints know the turn before the heat arrives. The hum grows loud near the water, a thrumming in the blood that means go. I do not remember the turn; the turn is simply the shape of being alive.

  2. The box sings that low song again. Last time the song came, the metal bar burned my tongue. My mouth waters for the sweet paste, but the skin on my nose remembers the sting. I wait. The song stops. I lick the paste. The warmth in my belly teaches me to wait for the silence. Pain is a teacher that leaves a mark on the flesh.

  3. I see the river in my head before I step. The shape in my mind says the bridge holds, the hum of the water below promising depth enough to survive the fall if I slip. I walk out onto the wood, certain of the balance. The timber cracks. Cold water swallows me. I gasp on the bank, shivering. Perhaps I should have just touched each plank with my foot first, letting the wood speak before I trusted my sight.

  4. The scratch of the pen matches the rhythm of the machine. I write the number down so the next shift knows the pressure is wrong. The ink holds the warning after I go home. Someone I never meet will read the curve on this page and turn the valve before the pipe bursts. The hum is caught in the black lines, safe from forgetting.

  5. I tap the glass and the car moves without my hands on the wheel. The dashboard hums that same old song, but now it means safety instead of danger. I do not know how the light knows the road, nor who drew the lines it follows. I trust the glow because it has not failed yet, or perhaps because I cannot see the hands guiding it. I am either the master of the tool or merely another part of its circuit.
