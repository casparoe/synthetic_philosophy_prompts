prompt: |-
  I'm running a little philosophy meetup in my city (no academic background here, I just fell down this rabbit hole a couple of years ago and can't get out of it) and next month we're having a guest who's written a book on the "white horse" dialogue from the Warring States School of Names, the one attributed to Gongsun Long where the defender argues that a white horse is not a horse. His position, as far as I can tell, is that the claim is true on a conceptual reading: white-horse and horse are genuinely different concepts even though every white horse is a horse, and he thinks the famous first move — in the translation I read, "What designates color is not what designates shape" — is doing real work, not sophistry. I was arguing about this with a friend who thinks the whole thing is just a two-thousand-year-old gotcha question, and I definately can't tell which of us is closer.

  Can you draft a sequence of six to eight interview questions that press him on the substance of the reading? I want at least one question that makes him commit to which "is not" he actually means — the "isn't the same thing as" sense versus the "isn't a kind of" sense — since I suspect the two speakers in the original are just using the phrase differently and talking past each other. I also want one that works through the argument that if you ask for a horse a yellow one will do, but if you ask for a white horse it won't, because to me that looks like the words are being used differently in different requests, not that the concepts are seperate things. Give each question a follow-up keyed to the answer he's most likely to give — I'm guessing he'll keep retreating to "it's about concepts, not about animals" — and end with a question about what kind of argument or evidence could actually count against the reading.
