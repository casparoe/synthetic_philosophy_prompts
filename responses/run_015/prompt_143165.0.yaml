          *   *Claim:* "Problem is not really about evidence at all: it is about the arrival of a hypothesis for which no prior had been fixed." (This is the "New Theory" problem vs "Old Evidence" problem distinction, often associated with Maher or Sprenger). This is a defensible reading.
