          *   Evaluate if the metaphor is broken or if historians are vague.
          *   **Crucial:** Be honest about reasoning weaknesses, what would change my mind, and where I'm forcing the analogy.
      *   **Tone:** Intellectual, honest, slightly technical but accessible, respectful of both domains.

  2.  **Deconstruct the Control Systems Metaphor:**
