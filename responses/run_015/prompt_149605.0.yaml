          3.  *Post-Threshold:* Saturated suffering can be weighed against pleasure via a non-linear, lexically-constrained transformation.
          4.  *Goal:* Preserve commensurability (in principle) while maintaining asymptotic priority for suffering reduction, avoiding full incommensurability.
          5.  *Mechanism:* Partitioning value space + transition rule.

  2.  **Identify the Task:**

