          *   Formal results (non-Archimedean utility collapsing into lexicographic orderings).
          *   Ad hoc boundary/line-drawing paradoxes.
          *   Rival positions (e.g., Prioritarianism).
      *   Assess the risk of *unfalsifiability* (shifting saturation point).
      *   Identify which defeaters a committed defender must *concede* vs. dismiss.

  3.  **Analyze Potential Objections (Brainstorming & Filtering):**

      *   *Phenomenology:* Do people actually experience "saturated" suffering where it becomes tradeable against pleasure? Or is extreme pain always lexically prior? If the phenomenology suggests extreme pain *never* becomes tradeable, the "post-threshold" mechanism fails.
      *   *Formal/Math:* The user claims to avoid full lexicographic ordering by allowing trade-offs *after* saturation. However, standard utility theory (von Neumann-Morgenstern) relies on continuity and Archimedean axioms. Introducing a lexical threshold usually violates the Archimedean axiom. If the "transformation" allows trade-offs, is it still lexical? If it's truly lexical below the threshold, does the "saturation" just act as a second lexical tier? There's a risk of mathematical incoherence if it claims to be both lexical and commensurable in a standard sense.
