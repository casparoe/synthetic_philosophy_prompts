  # MEMORANDUM OF UNDERSTANDING ON INSTITUTIONAL EPISTEMOLOGY
  **Subject:** Burden of Proof in Institutional Reform  
  **Parties:** The Chestertonian Principle (CP) & The Rationalist-Reformer Principle (RRP)  
  **Date:** October 26, 2023  

  ## I. SUBSTANTIVE AGREED CLAIMS

  The undersigned parties, acknowledging the tension between preservation of inherited norms and the imperative to reduce measurable harm, agree to the following substantive premises as the baseline for further discourse:

  1.  **The Multi-Causality of Stability:** Institutional stability is rarely the result of a single explicit function. It is often the byproduct of complex, interlocking coordination mechanisms, some of which may not be immediately visible to current participants.
  2.  **The Imperfection of Metrics:** Any metric used to justify reform (e.g., housing supply, GDP, incarceration rates) is a partial map of reality. Optimizing for a specific metric carries the risk of "Goodhart's Law" effects, where the measure ceases to correlate with the underlying welfare it was intended to track.
  3.  **The Reality of Path Dependence:** Current institutional constraints are not arbitrary; they are the result of historical sequences. Reversing a path is often more costly than maintaining it, even if the original destination is no longer desired.
  4.  **The Asymmetry of Error:** Institutional errors are not symmetric. The cost of retaining a harmful norm (sins of omission) differs in kind from the cost of removing a functional norm (sins of commission). Both parties agree that *reversibility* is a critical variable in determining the appropriate burden of proof.
  5.  **The "Lost Reason" Distinction:** There is a meaningful epistemic difference between a practice whose rationale is *known and rejected* and a practice whose rationale is *unknown*. Both parties agree that the latter category requires a different investigative protocol than the former.
  6.  **The Necessity of a Theory of Change:** It is insufficient to identify a failure; one must possess a plausible causal model for how the proposed intervention resolves the failure without triggering second-order collapse. Conversely, it is insufficient to cite tradition; one must possess a plausible model for how the tradition sustains value.
  7.  **The Limits of Reconstruction:** Both parties acknowledge that fully reconstructing the evolutionary history of an institution is often impossible due to lost data. Therefore, decision-making must proceed under conditions of permanent partial ignorance.

  ## II. REMAINING DISAGREEMENTS

  | Domain | The Chestertonian Position (CP) | The Rationalist-Reformer Position (RRP) |
  | :--- | :--- | :--- |
  | **1. Default Stance** | **Presumption of Function.** If a practice has persisted over time without obvious collapse, it is provisionally assumed to serve a latent stabilizing function. The default action is *maintenance* pending investigation. | **Presumption of Utility.** If a practice cannot demonstrate current net-positive utility via measurable outcomes, it is provisionally assumed to be debris. The default action is *modification* pending justification. |
  | **2. Burden of Proof** | **On the Reformer.** The party proposing change must demonstrate not only that the current system is flawed, but that the proposed change will not disrupt latent functions essential to system integrity. | **On the Institution.** The party defending the status quo must demonstrate that the current system produces sufficient value to outweigh its measurable harms. "History" is not evidence of value. |
  | **3. Epistemic Humility** | **Humility as Caution.** Because we cannot see the whole system, we should assume our intervention will have negative unintended consequences. We should move slower than our understanding dictates. | **Humility as Acknowledgement.** Because we cannot see the whole system, we must acknowledge that *suffering* is currently visible and real. Waiting for perfect understanding perpetuates harm. We should move as fast as safety allows. |
  | **4. Valuation of Time** | **Evolutionary Fitness.** Practices are selected for long-term group survival/cohesion. Short-term inefficiency may be the price of long-term resilience. | **Welfare Maximization.** Institutions exist to serve living people. Long-term resilience is valuable only insofar as it benefits the welfare of current and near-future generations. |
  | **5. Interpretation of Obscurity** | **Signal of Complexity.** An obscure origin suggests the rationale is distributed across many actors/time periods and is too complex to summarize simply. | **Signal of Decay.** An obscure origin suggests the rationale was likely rent-seeking, accident, or bias that has since been forgotten but the rule remains. |

  ## III. EMPIRICAL CRUXES & PRE-REGISTERED TESTS

  The following are specific sub-questions where empirical evidence could shift the weight of opinion for at least one party. For each crux, a specific domain of evidence is identified, and both parties record a prediction in advance.

  ### Crux 1: The Frequency of "Latent Collapse" vs. "Stagnation Cost"
  **Question:** When obscure regulations are repealed without a full understanding of their origin, does the rate of hidden systemic blowback exceed the rate of measurable welfare gain?

  *   **Domain of Evidence:** A blinded audit of 50 instances of deregulation or zoning code removal from the last 40 years (e.g., removal of occupational licensing requirements, elimination of parking minimums, repeal of blue laws).
  *   **Method:** Independent historians and economists categorize outcomes 5 years post-repeal into: (A) Net Positive, (B) Net Negative, (C) Catastrophic/Unintended Systemic Failure.
  *   **CP Prediction:** At least 20% of cases will fall into Category C (Catastrophic/Unintended Failure), specifically in areas involving social coordination rather than pure commerce. The hidden costs will outweigh the visible gains in the aggregate.
  *   **RRP Prediction:** Less than 5% of cases will fall into Category C. The majority will be Category A. The "catastrophes" cited by CP will be re-classifiable as implementation errors, not inherent to the removal of the rule.

  ### Crux 2: The "Obscure Origin" Signal Test
  **Question:** When researchers successfully trace the origin of a "legacy" rule with no known current justification, what is the distribution of original intent?

  *   **Domain of Evidence:** Archival reconstruction of 20 specific municipal zoning or building code constraints identified as "obsolete" by city planners.
  *   **Method:** Historians trace the legislative record to find the stated intent at the time of passage.
  *   **CP Prediction:** In at least 50% of cases, the original intent reveals a coordination problem or safety constraint that remains *technically* relevant, even if the specific technology has changed (e.g., a rule about "horse spacing" was actually about "traffic flow").
  *   **RRP Prediction:** In at least 50% of cases, the original intent reveals explicit rent-seeking, racial segregation, or protectionist motives that are normatively illegitimate today, or the rule was an administrative accident with no functional intent.

  ### Crux 3: The Speed of Adaptation
  **Question:** Can institutions evolve to meet new challenges through incremental pressure, or does "pressure" merely calcify the defense of the old norm?

  *   **Domain of Evidence:** Comparative analysis of two jurisdictions facing identical housing shortages: one employing "comprehensive upzoning" (RRP approach) and one employing "variance-based incrementalism" (CP approach).
  *   **Method:** Measure housing supply elasticity, cost of living, and social displacement over a 10-year window.
  *   **CP Prediction:** The incrementalist jurisdiction will maintain higher social cohesion and lower displacement rates, achieving 80% of the supply gain with 20% of the social friction.
  *   **RRP Prediction:** The comprehensive reform jurisdiction will achieve 200% of the supply gain. The incrementalist jurisdiction will fail to meet demand because the "variance process" itself becomes a tool for obstruction, validating the need for wholesale replacement.

  ***

  **Signed,**

  *Representative of the Chestertonian Principle*  
  *Representative of the Rationalist-Reformer Principle*
