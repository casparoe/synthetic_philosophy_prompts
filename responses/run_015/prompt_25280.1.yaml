      *   *Crux 3: The "Obscure Origin" Signal.* Does an obscure origin correlate with hidden value or just accumulated debris?
          *   *Evidence:* Archaeological/Archival audit of a specific code (like the zoning example).
          *   *Predictions:* Chestertonian finds a forgotten coordination mechanism. Reformer finds rent-seeking or accident.

  6.  **Review and Refine:**
