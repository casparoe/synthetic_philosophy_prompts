answer: |-
  ### Brainstorming: Conceptual Dependencies

  Phenomenal knowledge traditionally relies on a causal or acquaintance relation: the quale causes the belief, or the subject is directly acquainted with the quale. Causal efficacy is the bridge; without it, the belief seems unmoored from its truth-maker. First-person authority depends on this mooring; if the belief isn't caused by the experience, why trust it over third-person ascriptions? Epiphenomenalism severs the causal bridge. If qualia are inert, they cannot cause phenomenal judgments. The "Architectural Indexical" hypothesis suggests the bridge isn't causal but structural: the judgment is true because it occupies a specific node in the cognitive architecture, similar to how "I am here" is true wherever uttered. The dependency shifts from *causation* to *constitution*. However, this risks turning authority into mere automaticity. If the system outputs "I am in pain" due to structural rules rather than causal contact, does the subject *know* they are in pain, or does the system merely register a state? The core tension is whether structural truth-conditions suffice for epistemic warrant.

  ***

  ### Research Proposal: Architectural Indexicality and the Epiphenomenalist's Dilemma

  **Project Title:** Structural Warrant: Re-evaluating Phenomenal Judgment under Epiphenomenalism

  **Problem Statement and Hypothesis**
  The Paradox of Phenomenal Judgment poses a fatal objection to epiphenomenalism. If qualia lack causal efficacy, they cannot cause the belief that one has qualia. Consequently, phenomenal beliefs appear unjustified, undermining the claim that we know our own minds. Standard responses attempt to salvage causal tethering or invoke non-causal acquaintance. This project proposes a third path: treating phenomenal self-attributions as "architectural indexicals." On this view, the content of a judgment like "I am in pain" is fixed not by causal contact with an epiphenomenal quale, but by the functional role the judgment occupies within a self-monitoring cognitive system. The judgment is true because the system is structured such that being in state S necessitates outputting "I am in S."

  **Core Research Question**
  The primary objective is to determine whether treating phenomenal judgment as architectural indexing dissolves the paradox of phenomenal judgment or merely relocates it. Specifically, does this framework preserve first-person authority, or does it reduce authority to a problem about the normativity of self-monitoring? I argue that while architectural indexing resolves the causal mismatch, it relocates the burden to explaining why structural inevitability grants epistemic warrant rather than mere reliable output. Standard causal theories fail here because they presuppose efficacy. Acquaintance theories fail because they presuppose a relation that epiphenomenalism denies. The architectural view bypasses both but must account for the normative force of authority.

  **Methodology**
  The project will proceed in three phases over three months.

  *Phase 1: Conceptual Analysis of Indexical Belief-Types.*
  I will distinguish architectural indexicals from standard perceptual indexicals. Perceptual indexicals (e.g., "That is red") rely on causal chains from object to subject. Architectural indexicals (e.g., "I am here" or "This system is active") rely on the context of utterance being constitutive of the truth. I will analyze whether phenomenal judgments align more closely with the latter. This involves dissecting the logical form of self-attribution to see if truth-conditions can be satisfied by system state alone.

  *Phase 2: Comparison with Non-Phenomenal Self-Monitoring.*
  I will compare phenomenal self-attribution with non-phenomenal self-monitoring, such as proprioceptive feedback or computational self-checks. A computer state representing "Low Memory" is true by virtue of the system's architecture, not causal interaction with "memory" as an external object. If phenomenal judgments function similarly, the lack of causal efficacy is irrelevant. However, I will investigate whether the *phenomenal* character adds a normative layer absent in mechanical self-monitoring. Does the "what-it-is-like" aspect demand more than structural truth?

  *Phase 3: Evaluation of Epistemic Warrant without Efficacy.*
  Finally, I will evaluate whether structural truth-conditions preserve warrant. Reliabilism might accept this: if the system is structured to be right, it is knowledge. Internalism might reject it: without causal contact, the subject lacks justification. I will test the architectural indexical model against both frameworks to see if it can sustain first-person authority. The goal is to map whether the "authority" is genuine knowledge or merely incorrigible output.

  **Success and Failure Conditions**
  Success will be defined as a rigorous demonstration that architectural indexing provides a coherent truth-condition for phenomenal judgments compatible with epiphenomenalism, even if it concedes that "authority" is normative rather than causal. A successful result shows that the paradox dissolves because the demand for causal tethering was a category error regarding self-monitoring.

  Failure will be defined as demonstrating that architectural indexing reduces phenomenal judgment to non-epistemic registration. If the analysis shows that structural truth cannot support the normativity required for "knowledge" (e.g., if the system could be structurally fixed but systematically deceived about the *nature* of the state), then the paradox is merely relocated, not solved. If I cannot distinguish phenomenal indexing from mere mechanical reporting without reintroducing causal efficacy, the project fails to salvage epiphenomenalism.

  **Scope and Timeline Assessment**
  A three-month fellowship is sufficient for the conceptual mapping and comparative analysis (Phases 1 and 2) but tight for a full defense against all epistemological objections (Phase 3).
  *Month 1:* Drafting the distinction between perceptual and architectural indexicals.
  *Month 2:* Developing the comparison with non-phenomenal self-monitoring.
  *Month 3:* Finalizing the warrant evaluation and drafting the conclusion.

  The scope is limited to the metaphysics of judgment and epistemology of warrant. I will not attempt to defend epiphenomenalism itself against other objections (e.g., evolutionary arguments), focusing strictly on the paradox of judgment. This focused scope ensures a deliverable paper suitable for workshop presentation, though a full book-length defense would require expanding the normative analysis beyond the fellowship period. The honest assessment is that while the framework can be established, the ultimate resolution of the normativity problem may remain open-ended, serving as a new research avenue rather than a closed case.
