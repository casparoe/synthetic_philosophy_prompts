      *   *The Hybrid Charter:* The prompt implies the charter *explicitly* adopts both. This is the tricky part. Usually, these theories conflict. If the charter says "Both are required," then a failure in either kills validity. If the charter says "Source is primary, but Fuller is aspirational," that's different. The prompt asks to reconcile them, implying both are necessary conditions for *legal force* under this specific transitional charter. I will treat them as *conjunctive necessary conditions* (Must pass Hart AND Must pass Fuller) to maintain the tension requested, but I need a conflict branch for when the political reality (Hart) clashes with the normative requirement (Fuller).
      *   *Refinement on Conflict:* The prompt asks for a branch where they *diverge*.
          *   Case A: Valid Source (Hart) + Invalid Form (Fuller).
          *   Case B: Invalid Source (Hart) + Valid Form (Fuller).
          *   *Decision:* Since this is a *transitional* administration with a *hybrid charter*, the safest legal interpretation is that *both* are required for full legal force. However, the "Conflict Resolution" needs to handle the *recommendation* to the supervisor. Do we block it? Do we flag it? The prompt asks for a decision on "legal force." I will structure it so that failure in either generally blocks force, but the conflict branch allows for a "Provisional/Conditional" status or a specific "Override" path if the Charter prioritizes one in emergencies (though the prompt implies I must decide validity). Let's stick to the strictest interpretation: Validity requires both. The "Conflict Resolution" is about how to categorize the *type* of failure for the supervisor.
          *   *Wait, re-reading:* "deciding... whether each decree possesses legal force." "Erroneous clearance allows an invalid decree... erroneous block stalls governance."
          *   *Strategy:* I will design the checklist as a "Gatekeeper." Pass Hart? Pass Fuller? If both Yes -> Valid. If either No -> Invalid. The "Conflict Resolution" is actually the analysis of *why* it failed, which informs the supervisor's political decision on whether to fix the source or fix the form.
          *   *Correction:* The prompt asks for a "conflict-resolution branch for cases where the two inquiries diverge." This implies there might be a scenario where I have to weigh them. If the Charter is hybrid, maybe it allows one to override the other in specific transitional contexts? No, that undermines the theory. Better interpretation: The *procedure* must handle the divergence by categorizing the defect. But to make it a "decision procedure," I need a rule.
          *   *Rule:* Under a hybrid charter, *both* are usually required. However, in a transition, "Source" might be shaky. Let's assume the Charter mandates Fuller's canons as *conditions of validity* alongside Hart's sources. Therefore, divergence = Invalid. But I must highlight *which* one failed.
          *   *Counterintuitive Verdict:* I need a case where the procedure says "Invalid" but it feels "Valid" (or vice versa). A retroactive tax is a classic Fuller violation (non-retroactivity) but often Hart-valid. If I block it, that's legally sound under Fuller but might feel politically necessary. Or, a decree from a de facto authority (Hart-invalid) that is perfectly clear (Fuller-valid). If I block it, governance stalls.
          *   *Let's aim for:* A decree that is Hart-Valid (proper source) but Fuller-Invalid (e.g., impossible to comply). The procedure blocks it. This feels counterintuitive to a positivist who says "It's law, just bad law." But under the Hybrid Charter, it's invalid.

  3.  **Drafting the Procedure (The "Hybrid Validity Protocol"):**
      *   Need to be concise (20 mins/decree).
      *   Step 1: Source Verification (Hart).
      *   Step 2: Internal Morality Verification (Fuller).
      *   Step 3: Divergence/Conflict Handling.
      *   Step 4: Final Recommendation.
      *   Need to label "Mechanical" vs. "Judgment."

  4.  **Developing the Worked Examples:**
      *   *Case 1 (Routine):* Passes both. Easy.
