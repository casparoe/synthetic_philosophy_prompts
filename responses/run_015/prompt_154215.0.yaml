      *   **Output:** A reusable, step-by-step decision procedure (flowchart/checklist style).
      *   **Audience:** Senior civil servant supervisor (non-philosopher) who signs off based on a one-page checklist.
      *   **Requirements:**
          *   Preserve distinct work of each theory (Source vs. Form).
          *   Include a conflict-resolution branch for divergence.
          *   Mark mechanical verifications vs. judgment calls.
          *   Identify limits/failure points.
          *   Include three worked applications (Routine, Retroactive Tax, Secret/Contradictory).
