      *   *Hypothesis:* In a transition, sometimes "De Facto" control matters more than "De Jure" sources.
      *   *Solution:* I will build a "Transitional Override" into the conflict branch. If Authority fails (Hart) but Form is perfect (Fuller) AND the authority is a de facto operational necessity, the Auditor flags it as "Provisionally Valid pending Ratification." This acknowledges the tension.
      *   *Wait, strict validity:* The prompt asks "whether each decree possesses legal force." Provisional validity is a hedge.
      *   *Better:* I will maintain strict validity (No = No) but the Conflict Branch dictates the *Advice* given to the supervisor.
      *   *Actually, looking at the prompt again:* "deciding... whether each decree possesses legal force."
      *   Okay, I will stick to the strict Hybrid interpretation: Both are required. The "Conflict Branch" is the diagnostic step that tells the supervisor *why* it failed so they know how to fix it (Change the law vs. Change the actor).
      *   *Wait, one more thought:* To satisfy "conflict-resolution," I should address the scenario where the Charter itself is ambiguous about which takes precedence. I will assume the Charter makes them co-equal. The "Conflict" is the practical dilemma for the supervisor. I will structure the branch to categorize the *type of invalidity*.

      *(Self-Correction)*: I need to be careful not to make it too academic. "Hart" and "Fuller" should be referenced as the theoretical underpinnings but the checklist should use operational terms like "Source Authority" and "Legal Form." I will mention the names in the intro/explanation but keep the checklist clean.

      *(Final Plan for Conflict Branch)*:
      1. If Source OK + Form OK -> VALID.
      2. If Source OK + Form FAIL -> INVALID (Recommendation: Redraft for Clarity/Timing).
      3. If Source FAIL + Form OK -> INVALID (Recommendation: Re-authorize or Regularize Authority).
