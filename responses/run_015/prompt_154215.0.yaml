answer: |-
  # HYBRID VALIDITY PROTOCOL (HVP-1)
  **For:** Provisional Legislative Auditor  
  **To:** Senior Civil Servant (Signatory)  
  **Subject:** Pre-Publication Decree Evaluation  
  **Time Allocation:** 20 Minutes per Decree  

  ## PURPOSE
  This checklist determines whether a draft decree possesses **Legal Force** under the Transitional Charter. The Charter requires two distinct conditions for validity:  
  1.  **Proper Source:** The decree must come from an authority currently recognized by the state.  
  2.  **Proper Form:** The decree must be capable of guiding human conduct (it cannot be secret, impossible, or contradictory).  

  Failure in *either* condition renders the decree legally invalid. This protocol isolates which condition failed to guide corrective action.

  ---

  ## PART 1: SOURCE AUTHORITY CHECK (The "Who")
  *Goal: Verify the decree originates from a recognized institutional power.*

  | Step | Action | Verification Type | Pass/Fail |
  | :--- | :--- | :--- | :--- |
  | **1.1** | **Identify the Issuing Office.** Check the letterhead and signature block. | Mechanical | |
  | **1.2** | **Verify Current Mandate.** Cross-reference the office against the *Transitional Schedule of Authorized Entities*. Is this office currently active and empowered to issue this *type* of decree? | Mechanical | |
  | **1.3** | **Check Procedural Chain.** Were required countersignatures, consultations, or filings completed prior to signature? (Check logs/stamps). | Mechanical | |
  | **1.4** | **Assess De Facto Status.** If the office was abolished by the prior regime but is currently exercising control, mark **"Source Defect: Transitional Ambiguity."** | **Judgment Call** | |

  **PART 1 RESULT:** [ ] PASS [ ] FAIL  
  *If FAIL, proceed to Part 2 but note: Validity is already compromised.*

  ---

  ## PART 2: INTERNAL MORALITY CHECK (The "How")
  *Goal: Verify the decree functions as a usable rule of law.*

  | Step | Action | Verification Type | Pass/Fail |
  | :--- | :--- | :--- | :--- |
  | **2.1** | **Promulgation.** Is the text publicly accessible? (Reject if marked "Secret" or "Eyes Only" for general regulation). | Mechanical | |
  | **2.2** | **Clarity.** Can a competent citizen understand what is required without guesswork? (Flag vague terms like "reasonable" or "appropriate" if undefined). | **Judgment Call** | |
  | **2.3** | **Non-Contradiction.** Does this decree contradict itself or an existing, unrepealed higher law? | **Judgment Call** | |
  | **2.4** | **Possibility of Compliance.** Is it physically or legally possible to obey this order? (e.g., Do not order an action already banned by another statute). | **Judgment Call** | |
  | **2.5** | **Temporal Direction.** Does the decree apply to *future* conduct only? (Flag any retroactive penalties or duties). | Mechanical | |
  | **2.6** | **Constancy.** Has the rule changed so frequently that reliance is impossible? (Check amendment history). | Mechanical | |

  **PART 2 RESULT:** [ ] PASS [ ] FAIL  

  ---

  ## PART 3: CONFLICT RESOLUTION & RECOMMENDATION
  *Goal: Determine Final Status based on divergence between Part 1 and Part 2.*

  ### BRANCH A: BOTH PASS
  **Verdict:** **VALID.**  
  **Action:** Clear for signature.

  ### BRANCH B: SOURCE FAIL / FORM PASS
  *(Example: A clear, public rule issued by an abolished ministry.)*  
  **Verdict:** **INVALID (Authority Defect).**  
  **Risk:** Blocking stalls governance; Clearing violates the Charter.  
  **Recommendation:** **BLOCK.**  
  **Note to Signatory:** *"The rule is well-drafted but issued by an entity without legal power. To proceed, the current Transitional Council must re-authorize this office or re-issue the decree under a valid office."*

  ### BRANCH C: SOURCE PASS / FORM FAIL
  *(Example: A valid Minister issuing a secret or retroactive penalty.)*  
  **Verdict:** **INVALID (Legality Defect).**  
  **Risk:** Blocking angers the Ministry; Clearing undermines the Rule of Law.  
  **Recommendation:** **BLOCK.**  
  **Note to Signatory:** *"The authority is correct, but the decree fails the Charter's standards for legality (e.g., it is retroactive/unclear). To proceed, redraft to meet formal standards."*

  ### BRANCH D: BOTH FAIL
  **Verdict:** **INVALID.**  
  **Action:** Reject entirely. No further analysis needed.

  ---

  ## WORKED APPLICATIONS

  ### Case 1: Routine Technical Regulation (The "Baseline")
  *   **Draft:** A safety standard for elevator maintenance issued by the Ministry of Infrastructure.
  *   **Part 1 (Source):** Ministry is on the Authorized Schedule. Signatures present. **(PASS)**
  *   **Part 2 (Form):** Publicly posted. Clear technical metrics. Prospective only. No contradictions. **(PASS)**
  *   **Branch:** A (Both Pass).
  *   **Verdict:** **VALID.**
  *   **Auditor Note:** Standard clearance. No risks identified.

  ### Case 2: Retroactive Tax Assessment (The "Counterintuitive Block")
  *   **Draft:** A revenue decree issued by the Minister of Finance demanding payment for taxes incurred 3 years ago, which were not previously assessed.
  *   **Part 1 (Source):** Minister of Finance is authorized to issue tax decrees. Signatures valid. **(PASS)**
  *   **Part 2 (Form):** Clear and public. However, Step 2.5 (Temporal Direction) flags **Retroactivity**. Citizens could not have guided their conduct by this rule in the past. **(FAIL)**
  *   **Branch:** C (Source Pass / Form Fail).
  *   **Verdict:** **INVALID.**
  *   **Auditor Note:** *This verdict may feel counterintuitive.* The Minister has the power to tax, and the state needs revenue. However, under the Hybrid Charter, a rule that cannot guide past conduct fails the definition of law. Clearing this validates arbitrary power. **Recommendation:** Block. Advise Ministry to seek a legislative waiver for retroactivity if absolutely necessary.

  ### Case 3: The "Ghost Office" Directive (The "Governance Stall")
  *   **Draft:** A directive on waste management issued by the "National Sanitation Board."
  *   **Part 1 (Source):** The Board was abolished in Month 1 of the Transition, but the staff remains in the building and everyone obeys them. Step 1.4 flags **Source Defect**. **(FAIL)**
  *   **Part 2 (Form):** The directive is clear, public, non-contradictory, and feasible. **(PASS)**
  *   **Branch:** B (Source Fail / Form Pass).
  *   **Verdict:** **INVALID.**
  *   **Auditor Note:** *This verdict creates immediate operational friction.* The Board is functioning de facto, and the rule is good. However, the Charter requires recognized authority. Clearing this undermines the transitional restructuring. **Recommendation:** Block. Advise the Transitional Council to formally re-constitute the Board immediately to cure the defect.

  ---

  ## LIMITATIONS OF THIS PROCEDURE
  *As Auditor, I must disclose what this checklist cannot resolve:*

  1.  **Substantive Justice:** This procedure tests *legality*, not *goodness*. A decree can be Valid (Passes Part 1 & 2) but still be cruel, unjust, or economically disastrous. This checklist does not evaluate moral content beyond the eight formal canons.
  2.  **Charter Legitimacy:** If the Transitional Charter itself is viewed as illegitimate by the population, this procedure merely enforces that illegitimacy consistently. It cannot validate the regime itself.
  3.  **Flux Stability:** This protocol assumes the *Schedule of Authorized Entities* (Part 1) is stable. In a rapid transition, if the Rule of Recognition changes weekly (e.g., offices are abolished and restored daily), Part 1 becomes a judgment call rather than a mechanical check, increasing the risk of error.
  4.  **The "Hard Case" Tension:** In Branch B and C, the procedure mandates a Block. In a true emergency (e.g., pandemic, invasion), strict adherence may cause harm greater than the legal defect. This procedure has no "Emergency Override." That decision rests solely with the Signatory, not the Auditor.

  ---

  ## AUDITOR SIGN-OFF
  **Decree ID:** _______________  
  **Date:** _______________  
  **Recommendation:** [ ] CLEAR [ ] BLOCK  
  **Defect Category (If Blocked):** [ ] Authority [ ] Form [ ] Both  
  **Auditor Initials:** _______________
