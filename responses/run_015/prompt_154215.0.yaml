          1.  Routine (Pass/Pass).
          2.  Retroactive Tax (Pass Hart / Fail Fuller).
          3.  Abolished Office Directive (Fail Hart / Pass Fuller).
      *   *Counterintuitive:* The Abolished Office one. It looks like law, works like law, but isn't law because the guy was fired last week. Blocking it stalls governance.

  5.  **Refining the Conflict Branch:**
