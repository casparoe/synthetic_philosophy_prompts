      *   *No citations:* Check.
      *   *Non-philosopher language:* Use "Authority Check" instead of "Rule of Recognition," use "Functional Legality" instead of "Internal Morality." (Actually, better to keep the terms clear but defined simply). Let's use "Authority & Procedure" (Hart) and "Form & Function" (Fuller).
      *   *20-minute constraint:* Keep steps few and sharp.
      *   *One-page checklist feel:* Use bolding and boxes.
      *   *Counterintuitive verdict:* Ensure the "Abolished Office" case blocks a decree that everyone is following.

  9.  **Final Polish:**
      *   Ensure the "Conflict Resolution" isn't just "Fail." It needs to explain *how* to report the divergence.
      *   Make sure the "Judgment Calls" are highlighted so the supervisor knows where the risk lies.
      *   Check the "Retroactive Tax" case. Fuller hates retroactivity. Hart doesn't care. If I block it, it shows Fuller's bite.
