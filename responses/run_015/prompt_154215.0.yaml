      *   *Okay, I will treat the Hybrid Charter as making Fuller's Canons a necessary condition for the Rule of Recognition to apply.*
      *   *Conflict Resolution:* What if the Charter is ambiguous? I will add a "Tie-Breaker" step for the Auditor's recommendation when the stakes of blocking are catastrophic. But strictly speaking, validity is binary. I will stick to Binary Validity but explain the *risk* in the notes.

  6.  **Addressing the Limitations:**
      *   Cannot resolve legitimacy of the Charter itself.
      *   Cannot judge substantive justice (e.g., is the tax *fair*?).
      *   Instability if the Rule of Recognition changes (transition is fluid).

  7.  **Drafting the Content - Section by Section:**
      *   **Introduction:** Set the stage, define the tool.
