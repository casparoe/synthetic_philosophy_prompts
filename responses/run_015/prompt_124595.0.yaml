answer: |-
  ### Brainstorm: Sphexishness and Craft Vocabulary

  **Sphexishness:** In philosophy of action, this refers to the digger wasp *Sphex ichneumoneus*. It drags a paralyzed cricket to its burrow, enters to inspect, and if the cricket is moved during inspection, the wasp drags it back to the threshold, inspects again, and repeats the loop indefinitely if moved again. It looks like purposeful agency, but it is a rigid stimulus-response script. The philosophical stake is the distinction between genuine flexibility (free will) and complex but fixed programming (determinism).

  **Craft Vocabulary:**
  *   **Continuity Bibles:** The fixed laws of the story world (physics, history, magic systems). Analogous to laws of nature.
  *   **Plot Outlines:** The pre-determined trajectory of events. Analogous to causal determinism or fate.
  *   **Editorial Mandates:** External constraints forcing specific outcomes (e.g., "Character X must die in Volume 3"). Analogous to external coercion or hard determinism.
  *   **On-the-Page Improvisation:** The moment of writing where the author discovers what happens next. Analogous to the phenomenological experience of choice.
  *   **Authorial Determinism:** The fact that the author writes every word. Analogous to theological or physical determinism.
  *   **Illusion of Character Freedom:** The reader's (and sometimes author's) belief that the character acts independently. Analogous to compatibilist freedom or the user-interface of agency.

  **The Tension:** The novelist knows the ending (Authorial Determinism) but must write the middle as if the outcome is uncertain (Illusion of Character Freedom). When a character refuses to follow the Plot Outline because "it feels wrong," is that freedom, or just a deeper layer of the author's subconscious scripting?

  ***

  ### The Debate Restated: Craft Terms Only

  The philosophical problem of the sphex wasp asks whether an entity is truly choosing or merely executing a script. In the context of a multi-volume saga, we can restate this debate entirely through the tension between **Plot Outlines** and **On-the-Page Improvisation**.

  Consider a character standing before a locked door. The **Plot Outline** dictates they must enter the room to meet a villain. This is the wasp's instinct to drag the cricket to the burrow. If the writer forces the character to pick the lock regardless of the character's established skills or emotional state, the character exhibits **sphexishness**. They are trapped in a behavioral loop mandated by the **Continuity Bible** and the **Outline**, ignoring the immediate narrative environment. If an obstacle arises—a guard appears, the lock is changed—and the character repeats the same failed attempt because the **Outline** demands entry, they are functioning as a mechanical script. They possess the **Illusion of Character Freedom**, but they are actually puppets of **Authorial Determinism**.

  The argument for **behavioral flexibility** translates to the capacity for **On-the-Page Improvisation**. When the guard appears (the cricket is moved), a flexible character deviates from the **Plot Outline**. They might retreat, negotiate, or find a window. To the reader, this looks like free will. To the novelist, this is often experienced as the character "taking over." However, the skeptic argues this is merely a more complex script. The improvisation wasn't truly free; it was selected by the author from a finite set of options allowed by the **Continuity Bible**. The author simply rewrote the loop to look like adaptation.

  The debate deepens when we introduce **Editorial Mandates**. Suppose the publisher demands a specific tragedy in Volume 4. This functions as a hard deterministic constraint. No matter how much **On-the-Page Improvisation** occurs in Volumes 1–3, the character is ultimately dragged toward that mandated end. The philosophical question becomes: Does the **Illusion of Character Freedom** during the improvisational moments matter if the **Editorial Mandates** fix the final state? Is a character "free" if they can choose their path but not their destination?

  Conversely, the proponent of genuine agency argues that the **On-the-Page Improvisation** changes the **Plot Outline** itself. If the character refuses to open the door, and the author accepts this deviation, the **Outline** is revised. Here, the "agent" (the character's voice within the author's mind) exerts causal power over the "laws of nature" (the **Continuity Bible** and **Outline**). This mirrors the libertarian claim that free will can interrupt causal chains. But the hard determinist (or the cynical editor) retorts that the author's decision to revise the **Outline** was itself determined by market forces, mood, or prior brain states. The revision is just another loop, longer and harder to detect than the wasp's.

  ***

  ### Residue Report

  **1. Claims That Translate Cleanly**
  *   **Rigidity vs. Flexibility:** The distinction between a sphexish wasp and a flexible agent maps perfectly onto "flat characters following plot" versus "round characters driving plot." When a character ignores scene logic to fulfill a **Plot Outline**, they are sphexish. When they adapt via **On-the-Page Improvisation**, they exhibit behavioral flexibility.
  *   **External Constraints:** **Editorial Mandates** serve as an excellent analog for hard determinism or fate. They are external forces that restrict the possibility space regardless of the character's internal state.
  *   **The Illusion:** The **Illusion of Character Freedom** is precisely the phenomenological experience of free will. Just as humans *feel* free even if determined, readers *feel* the character is choosing even if the **Continuity Bible** fixes the outcome.

  **2. Claims That Must Be Distorted**
  *   **The Locus of Agency:** In philosophy, the agent and the observer are usually the same entity (I choose, I feel). In craft, they are split. The **Character** is the apparent agent, but the **Author** is the actual cause. To make the analogy work, we must treat the Author's subconscious as the "self" and the conscious **Plot Outline** as the "program." This distorts the philosophical problem because the character literally does not exist outside the author's mind. The "will" being debated is the author's will projected onto a puppet.
  *   **Revision as Freedom:** In the real world, changing your mind is an exercise of will. In craft, changing the **Plot Outline** is an exercise of editing. Translating "metaphysical freedom" into "willingness to rewrite" reduces ontological liberty to professional flexibility. It suggests free will is just the capacity to edit one's own source code, which is a functionalist distortion of the libertarian claim.

  **3. Claims With No Expression in Craft**
  *   **Moral Responsibility:** Philosophy cares about free will because it grounds blame and praise. In craft, **Authorial Determinism** absolves the character of all responsibility. If a character murders someone because the **Outline** demanded it, we do not blame the character; we critique the writing. The stakes of moral accountability vanish entirely in the translation.
  *   **The Hard Problem of Consciousness:** The sphex debate often touches on qualia—the inner feeling of being the wasp. In craft, there is no inner feeling for the character. There is only the description of feeling. The "ghost in the machine" has no counterpart in the "voice in the manuscript."

  **4. Does Free Will Survive Translation?**
  The concept of free will does not survive translation into authorial determination; it dissolves into **process**.

  The residue reveals a significant gap in the craft vocabulary. We have terms for constraints (**Continuity Bibles**, **Mandates**) and terms for execution (**Improvisation**, **Outlines**), but we lack a term for *ontological agency* because it is unnecessary for fiction. The "freedom" a novelist experiences during **On-the-Page Improvisation** is not the character's freedom, nor is it necessarily the author's free will in a philosophical sense; it is often described as "listening" or "discovery." This suggests that what philosophers call "free will" might be better understood as "unpredicted generation."

  Furthermore, the original philosophical disagreement appears less substantive once rendered in serialized storytelling. The debate between determinism and free will collapses into a debate between **Planning vs. Pantsing** (writing by outline vs. writing by the seat of one's pants). Both methods produce the same text. Whether the author knew the ending from page one (**Authorial Determinism**) or discovered it on page three hundred (**Improvisation**), the reader experiences the same **Illusion of Character Freedom**.

  Therefore, the residue suggests that the philosophical struggle over the sphex wasp is not about the *mechanism* of action (which is always determined, either by biology or by **Editorial Mandates**), but about the *granularity of the script*. "Free will" is simply a script complex enough to hide its own loops from the agent. In craft terms, good writing is simply sphexishness sophisticated enough to pass as improvisation. The gap in vocabulary confirms that "free will" is a user-interface feature, not a backend reality.
