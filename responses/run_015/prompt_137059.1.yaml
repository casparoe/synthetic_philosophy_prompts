  *(Self-Correction on the "Consequentialist" location)*: In the Solomonoff argument, the consequentialist is *in the hypothesis* (the program predicting the data). It simulates the predictor. In ML, this maps to a subgraph that models the training process. But how does it arrange past observations? In Solomonoff, the hypothesis *is* the world generator. In ML, the model *predicts* the world.
