answer: |-
  This is a fantastic question. It cuts through the technical implementation of congestion pricing to the underlying political economy and moral philosophy of the policy. As a PhD student, you're right to sense that the "Pigouvian move" isn't just a technical fix; it's a speech act about the nature of the citizen and the state.

  Here is a reconstruction of the implicit theory of collective action congestion pricing commits a city to, followed by an exploration of what an Ostromian alternative would actually look like in practice.

  ### 1. The Implicit Anthropology of Congestion Pricing

  You offered three candidates for the underlying theory: anonymity, inelasticity, and *Homo Economicus*. I would argue that congestion pricing strictly presupposes **anonymity** and **commensurability**, but it only *contingently* assumes pure self-interest.

  **A. The Strict Presuppositions (The "Hard" Constraints)**
  1.  **Atomization/Anonymity:** As you noted, pricing works when reputational mechanisms fail. Congestion pricing presupposes that the drivers are a mass of strangers who will not interact again. If the drivers were a closed community (e.g., a small village sharing one access road), social shaming or reciprocal agreements ("I won't drive Tuesday if you don't drive Wednesday") might be cheaper and more robust than installing a tolling gantry. Pricing assumes the transaction costs of social bargaining are higher than the transaction costs of market exchange.
  2.  **Commensurability:** It presupposes that time, delay, and environmental impact can be legitimately translated into a monetary metric *by a central authority*. This is a philosophical claim, not just an economic one. It asserts that the "cost" of congestion is objectively calculable and that money is the appropriate medium for settling that debt.
  3.  **Responsiveness (Elasticity):** It assumes agents are marginally responsive to price signals. It does *not* strictly require them to be selfish, only that their preferences are consistent enough that a cost increase alters the margin of decision-making.

  **B. The Contingent Baggage (The "Soft" Assumptions)**
  1.  **The Naivety of Norms:** This is the part that bothers you. Standard Pigouvian policy often operates *as if* norms are irrelevant. This isn't necessarily because economists believe humans lack moral compasses, but because norms are viewed as "unreliable technology." They are slow to form, hard to measure, and easy to free-ride on at scale. Pricing is chosen not because norms *can't* work, but because they are seen as institutionally fragile compared to the automatism of a toll.
  2.  **Top-Down Legibility:** Congestion pricing assumes a central authority has the epistemic capacity to set the "correct" price. It presupposes that the optimal level of congestion is a technocratic calculation, not a political negotiation.

  **Why Roads and Not Bathrooms?**
  You asked why we price roads but not concert bathroom queues. This is largely a **Coasean point about excludability and transaction costs**, not just anthropology.
  *   **Excludability:** It is technologically easy to exclude a car from a cordon zone (cameras/transponders). It is technologically difficult and socially friction-heavy to price a sidewalk or a bathroom queue without creating bottlenecks at the point of payment that exceed the congestion cost.
  *   **Scale of Harm:** The negative externality of one extra car (delay × hundreds of other drivers + emissions) is orders of magnitude higher than one extra person in a bathroom line.
  *   **However:** The fact that we *don't* price sidewalks even where technology allows it (e.g., gated communities, private plazas) suggests your anthropological point holds water. We tolerate crowding on sidewalks because we view pedestrian movement as a basic right of presence, whereas vehicle movement is viewed as a consumptive privilege. Pricing roads reinforces the classification of "driving" as a market good rather than a public right.

  ### 2. The Ostromian Worry: Crowding Out and Institutional Lock-in

  Your worry about crowding out is well-founded in behavioral economics (e.g., Frey & Oberholzer-Gee, 1997). When you introduce a price, you often shift the frame from a **social/normative relationship** to a **market relationship**.

  *   **The Pigouvian Bet:** The city is betting that there were no strong shared norms around road use to begin with, or that they are too weak to combat the incentive to drive. It assumes the road is an *open-access resource* (no rules) rather than a *common-pool resource* (managed by rules).
  *   **The Lock-in:** Once you price, you dismantle the possibility of norm formation. If I pay $15 to enter Manhattan, I have purchased the right to be there. I no longer feel a moral obligation to consider whether my trip is "necessary." The price becomes a license to sin. This creates the lock-in you describe: if norms atrophy, you can never remove the price without causing chaos, because the cooperative capacity has been eroded.

  **Can you switch tools?**
  Theoretically, yes. Practically, it is politically difficult. Ostrom argued for **polycentric governance**, where rules are matched to the scale of the problem. However, modern cities are often monocentric regarding traffic (one DOT, one Mayor). To switch from pricing back to norms (or vice versa) requires rebuilding trust and monitoring capacity, which takes longer than a political cycle.

  ### 3. What Would an Ostromian Traffic Policy Look Like?

  If a city took Elinor Ostrom's *Governing the Commons* seriously, would it still price congestion? **Possibly, but the institutional wrapping would be radically different.**

  Ostrom's 8 Design Principles for CPRs offer a blueprint for how an Ostromian congestion policy would differ from the standard Pigouvian model (London/NYC/Stockholm).

  | Feature | Standard Pigouvian Pricing | Ostromian Polycentric Governance |
  | :--- | :--- | :--- |
  | **Rule Creation** | Top-down technocratic. Economists model elasticity; City Council votes. | **Participatory.** Stakeholders (residents, businesses, commuters) involved in setting the rate and zones. |
  | **Revenue Use** | General fund or tax offset. Often opaque to the payer. | **Reinvestment in the Commons.** Revenue is visibly earmarked for the specific road network or substitute goods (transit) used by the payers. |
  | **Monitoring** | Automated cameras. Passive surveillance. | **Community Monitoring.** While cameras exist, there is social legitimacy. Neighbors/peer groups validate the need for the rules. |
  | **Sanctions** | Fixed fines. Binary (paid/not paid). | **Graduated Sanctions.** Warnings for first offenses, community service options, escalating fines. The goal is compliance, not revenue. |
  | **Boundaries** | Fixed cordon lines. | **Nested Enterprises.** Pricing might vary by neighborhood councils or business improvement districts, not just a city-wide ring. |
  | **Conflict Resolution** | Administrative hearings. | **Local, low-cost conflict resolution arenas.** |

  **Specific Policy Differences:**

  1.  **Revenue Legibility:** In London or NYC, congestion pricing revenue often goes into a black box of the transit budget. An Ostromian approach would tie the revenue directly to the users. "You pay to enter the zone, and that money *only* fixes the roads in this zone or funds the bus line you use." This builds the norm of *reciprocity* rather than *extraction*.
  2.  **Complementary Norms:** Instead of just pricing, the city might invest in **signaling systems** that allow for social coordination. For example, workplace staggered-hour agreements negotiated between business districts and transit authorities. The price is the backstop, not the primary mechanism.
  3.  **Variable Governance:** An Ostromian approach might acknowledge that a highway is different from a neighborhood street.
      *   *Highways:* Priced (anonymity is high, scale is large).
      *   *Neighborhood Streets:* Managed by local councils via permits or norms (residents know each other, reputation matters).
      *   *Sidewalks:* Managed via design (widening) rather than pricing (norms of right-of-way).
  4.  **The "Right to Return":** Ostrom emphasizes that users must have a voice in modifying rules. A Pigouvian tax is often static or adjusted by algorithm. An Ostromian system would have a mandated review board with user representation that can adjust the price or exemptions based on lived experience (e.g., "This price is hurting small tradespeople; let's adjust the exemption class").

  ### 4. Synthesis: Is Pricing Incompatible with Ostrom?

  Here is the crucial distinction for your dissertation work:

  **Congestion pricing does not strictly presuppose *Homo Economicus*. It presupposes *High Transaction Costs*.**

  The Pigouvian model assumes that the cost of organizing 1 million drivers into a cooperative agreement is infinite. Therefore, the state imposes a price.
  The Ostromian model asks: **Can we lower the transaction costs of cooperation?**

  If you lower transaction costs (through better communication channels, local governance, transparent revenue use), you might find that you *still* need a price signal, but it functions differently.
  *   **Pigou:** The price *is* the regulation.
  *   **Ostrom:** The price is a **focal point** for a broader social contract.

  **Conclusion:**
  A city adopting congestion pricing is implicitly betting that the road users are a **mass**, not a **community**. It assumes that the only language they share is money.
  If a city took Ostrom seriously, it might still implement a fee, but it would frame it as a **membership due** for a managed commons, with revenue recycling that reinforces the community, and governance structures that allow the "commons users" to modify the rules.

  The tragedy isn't that we price roads; it's that we price them like a private toll booth rather than a shared resource maintenance fee. The former assumes strangers; the latter assumes citizens.

  **Suggested Reading for your Lit Review:**
  *   **Samuel Bowles:** *The Moral Economy* (on how incentives crowd out norms).
  *   **Jon Elster:** *The Cement of Society* (on norms vs. rational choice).
  *   **Elinor Ostrom:** *Governing the Commons* (specifically the section on externalities and scaling).
  *   **Robert Frank:** *Passions Within Reason* (on the strategic role of emotions/norms).
  *   **Recent work on "Social License" in transport policy:** Look for papers discussing the "acceptability" of congestion pricing in Stockholm vs. London vs. Edinburgh (Edinburgh failed partly due to the normative framing).

  This distinction between the *mechanism* (pricing) and the *institutional embedding* (monocentric vs. polycentric) is where your contribution could lie. You can argue that congestion pricing fails not because prices don't work, but because they are implemented in a way that destroys the very social capital required to make them sustainable long-term.
