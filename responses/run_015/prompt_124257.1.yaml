  # Welcome to Your Cohort

  **Help Centre > Onboarding > Selecting Your Risk Profile**

  Welcome to Venn Mutual! We believe insurance should be as unique as you are. Traditional insurers guess who you are based on broad stereotypes. We prefer precision. With Venn, you don't just buy a policy; you curate the statistical lens through which your risk is viewed. This guide will walk you through selecting your Reference Class, ensuring your premium reflects the true frequency of events for people exactly like you.

  ### How It Works
  Our app is built on two core promises: the **Maximum Specificity Mandate** and the **Cell Size Covenant**. 

  1.  **Get Specific:** You are encouraged to narrow your cohort using every relevant trait available. The narrower the class, the more accurate the prediction.
  2.  **Stay Stable:** To ensure statistical validity, every selected class must contain at least 1,000 documented lives.

  As you toggle traits—age, location, hobby, commute method, dietary preference—your screen will split. On the left, **Your Class**. On the right, **Venn's Class**. This satisfies the regulatory *Two-Quote Rule*. You may select either, though most users find their own curation offers better alignment with their lifestyle.

  ### When Precision Pays Off
  For many users, this process yields immediate clarity. Consider our commercial fleet partners. By selecting the class *"2022 Model Delivery Vans, Zone 4, Drivers with 10+ Years Experience,"* we isolate a group of 15,000 lives with a loss frequency of 0.04%. The premium is stable, low, and uncontroversial. Here, the data speaks with one voice. Specificity leads to savings.

  ### Navigating Complex Profiles
  For individual homeowners, multiple valid classes often exist. This is a feature, not a bug. It allows you to see how different aspects of your identity interact with risk. 

  **Worked Example: The Jensen Household**
  *Applicant:* Male, 38, ZIP 90210.
  *Trait Selection A (Broad):* "Males 35-44, ZIP 90210." 
  *Population:* 52,000 lives. 
  *Loss Frequency:* 2.1%. 
  *Premium:* **$1,200/yr.**

  *Trait Selection B (Narrow):* "Males 35-44, ZIP 90210, Owns Grey Sedan, Drinks Tea, Wakes Before 6AM." 
  *Population:* 1,050 lives. 
  *Loss Frequency:* 21.5%. 
  *Premium:* **$12,500/yr.**

  Both classes meet the Cell Size Covenant. Both are statistically reliable. Which applies? Under the Maximum Specificity Mandate, Selection B is technically superior due to narrowness. However, when premiums diverge by an order of magnitude, our **Reinsurance Tie-Breaker Protocol** activates. This neutral algorithm selects the governing class based on the lexicographical order of the cohort hash ID. In this case, Hash A precedes Hash B. Your premium is $1,200. Rest assured, this method is unbiased and consistently applied.

  ### No Peeking Policy
  To maintain integrity, we cannot insure you based on outcomes that haven't happened yet. You cannot select the class *"People Who Will Not File a Claim This Year,"* even if you are certain you belong to it. This would violate the temporal causality of underwriting.

  However, we encourage you to proxy your risk intent through behavioural indicators. During onboarding, please answer the following:
  *   Do you intend to lock your deadbolt every night?
  *   Will you avoid storing fireworks in the garage?
  *   Do you plan to ignore all weather warnings regarding lightning?
  *   Is it your goal to maintain a claim-free record for 2024?

  Your answers help us approximate the *Ex Ante Safety Cohort* without violating the No Peeking rule.

  ### Finalizing Your Policy
  Once you submit, your class is locked for the premium period. However, to ensure long-term solvency and regulatory compliance, final adjudication occurs at the time of loss.

  ***

  **Terms of Reference Class Selection (v4.2)**

  1.  **Adjudication Rights:** While the policyholder selects the reference class at onboarding, Venn Mutual reserves the right to re-evaluate and select the governing reference class at the time of claim filing. This ensures the class used reflects the most current actuarial data available at the moment of loss.
  2.  **Proxy Data Recovery:** Certain demographic attributes prohibited by regulation (e.g., credit score, genetic predisposition) may be reconstructed via telemetry. Approved proxies include browser window width, mouse velocity, hours of activity between 01:00 and 04:00 local time, and ZIP+4 geolocation. These proxies are treated as behavioural data, not demographic ratings.
  3.  **Class Dissolution:** If a selected class falls below the 1,000-life threshold due to mortality or migration during the policy term, Venn Mutual will automatically migrate the policyholder to the nearest statistically valid neighbour class.
  4.  **Frequency Interpretation:** All premiums are based on long-run relative frequencies. No guarantee is made regarding individual outcomes within the selected frequency distribution.

  ***

  ^1 ^On ^the ^strictest ^ontological ^view, ^if ^the ^universe ^is ^deterministic, ^every ^singular ^event ^has ^a ^frequency ^of ^either ^zero ^or ^one. ^The ^reference ^class ^problem ^arises ^only ^from ^ignorance ^of ^initial ^conditions. ^Venn ^Mutual ^products ^are ^consequently ^priced ^based ^on ^epistemic ^limitations ^rather ^than ^objective ^chance. ^Purchase ^constitutes ^acceptance ^of ^this ^uncertainty.
