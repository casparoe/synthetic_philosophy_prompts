  **Note on Method and Mechanism**

  It is well established that agents systematically overstate their predictive accuracy after an event (hindsight bias) and that narrative accounts compress contingency into sequence. It is contested whether this overstatement is a cognitive error or a rational Bayesian update on new information, and whether narrative shape in history constitutes an epistemic failure or is simply constitutive of the genre. The poem leans on the contested reading in line 17 ("proof in sight"), treating the outcome as evidence rather than mere distortion, while the form itself enforces the settled finding that repetition creates an illusion of inevitability.
