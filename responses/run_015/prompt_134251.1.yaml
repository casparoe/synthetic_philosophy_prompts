  I'm drafting a proposal for a nine-month interdisciplinary fellowship in philosophy and public policy. The half-formed idea: relational conceptions of personhood rooted in Ubuntu—where personhood is constituted through reciprocal recognition rather than possessed as an intrinsic property—are often invoked to justify collective obligations, yet there is an undertheorized gap between that ontology and the normative conclusions drawn from it. I want to ask whether such a relational view can ground genuinely structural obligations, meaning obligations directed at repairing the relational fabric that sustains personhood itself, without collapsing into either methodological individualism (treating harm only as an aggregate of individual injuries) or full corporate agency (treating the community as a single moral agent with independent rights). State the question precisely, and explain why existing debates in transitional justice and distributive ethics leave it open: they tend to assume that group-based moral claims must be either summed individual claims or claims belonging to a corporate entity, leaving no conceptual space for obligations that target the conditions of relational personhood directly. Outline the method—conceptual analysis combined with case-based testing, constructing a framework that distinguishes relational-constitution harm from both individual harm and corporate-agent harm, then applying it to institutional reparative contexts to see if it yields determinate, non-redundant obligations. Specify what a successful result looks like (demonstrating that structural obligations are coherent and practically distinguishable) and what counts as failure, especially if the relational view cannot avoid reducing to individualism or sliding into group-agent metaphysics. Include an honest scope assessment: why this is feasible in nine months and what limitation I should accept. Keep the proposal to about 600 words, with clearly labeled sections for the question, the gap in existing answers, the approach, success and failure conditions, and realistic scope. Do not include citations, a bibliography, or reading lists; I will add those myself.
