answer: |-
  **The Question**
  Can a relational ontology of personhood, rooted in Ubuntu traditions where personhood is constituted through reciprocal recognition rather than intrinsic property, ground genuinely structural obligations? Specifically, can this view justify duties to repair the relational fabric sustaining personhood without collapsing into methodological individualism (treating harm only as an aggregate of individual injuries) or attributing independent moral agency to the collective (full corporate agency)?

  **The Gap in Existing Answers**
  Existing debates in transitional justice and distributive ethics leave this question open because they tend to assume that group-based moral claims must be either summed individual claims or claims belonging to a corporate entity. Liberal individualism struggles to account for harms that are not reducible to specific victims, while collectivist models often rely on controversial metaphysics of group agents. This binary leaves no conceptual space for obligations that target the conditions of relational personhood directly. Consequently, policy frameworks often miss the structural dimension of harm, focusing instead on compensating individuals or punishing abstract entities, thereby failing to address the erosion of the relational network itself.

  **The Approach**
  The method combines conceptual analysis with case-based testing. I will construct a framework that distinguishes relational-constitution harm from both individual harm and corporate-agent harm. This involves defining the specific normative weight of the relational fabric itself. I will then apply this framework to institutional reparative contexts, such as truth commissions or land restitution programs, to see if it yields determinate, non-redundant obligations. The analysis will test whether policy prescriptions derived from this ontology differ materially from those generated by standard individualist or corporatist models. Crucially, I will examine whether these obligations demand distinct institutional mechanisms, ensuring the theory translates into actionable policy rather than remaining abstract.

  **Success and Failure Conditions**
  A successful result demonstrates that structural obligations are coherent and practically distinguishable. This means producing policy recommendations that cannot be derived from summing individual claims nor from treating the community as a single agent. It requires showing that repairing relational fabric is a distinct moral goal with specific institutional requirements. Failure counts as either reducing the relational view to individualism, rendering structural talk merely metaphorical, or sliding into group-agent metaphysics, thereby losing the distinct philosophical contribution of the relational ontology. If the framework cannot generate unique obligations, the project fails.

  **Realistic Scope**
  This project is feasible in nine months because it prioritizes conceptual precision over empirical breadth. I will dedicate the first trimester to constructing the theoretical framework and the remaining two trimesters to applying it against two detailed case studies in transitional justice. However, I must accept limitations. I will not resolve broader metaphysical debates surrounding group agency nor attempt a comprehensive survey of all African philosophical traditions. The focus remains strictly on the normative bridge between Ubuntu-inspired ontology and public policy obligations in specific reparative contexts, ensuring depth over breadth.
