answer: |-
  There is no established term for this specific property, so the concept is best defined as **The Purified Defeat**.

  This concept differs from near misses like "moral victory" or "founding trauma" because it describes a structural condition of the memory itself, not an interpretation of its meaning or an account of its pain. A moral victory is a claim made *about* a loss (e.g., "we lost but were right"); a Purified Defeat is a loss that has been structurally altered so that inheriting it requires no inheritance of political responsibility. "Founding trauma" focuses on the wound; The Purified Defeat focuses on the usability of the wound once the cause of the wound has been excised. The boundary of this concept is defined by the severance of **action** from **choice**. For a defeat to be purified, the participants must be remembered as having acted (exerted effort, suffered, died) without having chosen the political conditions that made the action fatal.

  This boundary explains your two doubting cases. The Charge of the Light Brigade falls **inside** the concept because the commemoration isolates the soldiers' action (obedience, courage) from the commanders' choice (the blunder). The memory freezes the soldiers in the moment of execution, severing them from the agency of the order that killed them; the blame is absorbed by the abstract "command" or "war," leaving the men's sacrifice unencumbered by fault. It is not the defeat that is purified, but the actors within it.

  Victories fall **outside** the concept because they do not require this severance to be usable. A victory is inheritable precisely because it validates the losers' (now winners') exercise of power and choice. A victory emblem says, "We chose well, and we won." A Purified Defeat emblem says, "We acted faithfully, though the choice was not ours." The mechanism you have identified is specific to losses because only losses carry the burden of failed agency that must be removed to make the memory safe for inheritance.
