answer: |-
  # The Consciousness Sorting Tree
  **Root:** We agree a normal, awake, embodied person is conscious.  
  **Goal:** Find where the "light goes out" as we change the conditions.

  ### The Branching Questions
  *Answer **YES** if you think consciousness survives the change. Answer **NO** if it stops.*

  1.  **The Freeze:** We cool the brain to absolute zero. All physics stops, but structure is perfect. Is it still conscious *while frozen*?
      *   **NO → Leaf 1 (The Dynamic Materialist)**
      *   **YES → Go to Q2**

  2.  **The Swap:** We replace neurons one-by-one with paper slips that pass signals identically. Is the final paper-brain conscious?
      *   **NO → Leaf 2 (The Substrate Realist)**
      *   **YES → Go to Q3**

  3.  **The Script:** Instead of a book of "If-Then" rules, we have a book that just lists the history of states (no counterfactuals). Is this book conscious?
      *   **NO → Leaf 3 (The Counterfactualist)**
      *   **YES → Go to Q4**

  4.  **The Engine:** A dumb machine follows the book's instructions. It understands nothing. Is the *system* conscious?
      *   **NO → Leaf 4 (The Causal Power View)**
      *   **YES → Go to Q5**

  5.  **The Vault:** The book exists in a sealed vault. It is never opened or run. Is it conscious?
      *   **NO → Leaf 5 (The Actualist)**
      *   **YES → Go to Q6**

  6.  **The Cipher:** The book is printed in a code no one can ever break. The pattern is there, but meaningless to all observers. Is it conscious?
      *   **NO → Leaf 6 (The Relationalist / Derivative View)**
      *   **YES → Go to Q7**

  7.  **The Scramble:** The pages exist, but they are shuffled in a pile. All states are present, just not in order. Is it conscious?
      *   **NO → Leaf 7 (The Structuralist)**
      *   **YES → Leaf 8 (The Radical Platonist)**

  ---

  ### The Leaves: Positions & Awkward Commitments
  *(Plus unnamed variations for nuanced stop-points)*

  | # | Name | Where they stop | The Honest Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **Dynamic Materialist** | Q1 (Freeze) | If we pause and resume you, did you die in the gap? |
  | **2** | **Substrate Realist** | Q2 (Swap) | What magic does biology have that paper lacks? |
  | **3** | **Counterfactualist** | Q3 (Script) | How do we test for "what if" without actually running it? |
  | **4** | **Causal Power View** | Q4 (Engine) | How much "understanding" does a gear or transistor need? |
  | **5** | **The Actualist** | Q5 (Vault) | Is a movie on the shelf a story, or only when projected? |
  | **6** | **Relationalist** | Q6 (Cipher) | **Was the universe unconscious before observers evolved?** |
  | **7** | **Structuralist** | Q7 (Scramble) | Why does physical order matter if the logical states exist? |
  | **8** | **Radical Platonist** | End | **Every random pile of paper contains a conscious mind.** |
