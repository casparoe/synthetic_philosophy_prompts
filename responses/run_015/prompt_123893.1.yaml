  ### Notes for Discussion

  **On the "Derivative" View (Leaf 6):**  
  Is this distinct? **Mostly no.** It is usually just *The Relationalist* wearing a hat. If consciousness depends on a reader, it isn't the book that is conscious, but the *reader-book system*. This avoids the "Cipher" problem but makes consciousness a property of relationships, not things.

  **On Inconsistencies (The User's Hunch):**  
  Your hunch is correct. The most common contradiction is **Leaf 11 (Empty)**.  
  Many people say the **Frozen Brain (Q1)** is *not* conscious (needs activity) but the **Sealed Vault Book (Q5)** *is* conscious (pattern is enough).  
  *Why this breaks:* The Frozen Brain has more physical reality than the Sealed Book. If the Book's static pattern is enough for consciousness, the Frozen Brain's static pattern should be too. If the Brain needs activity, the Book needs to be read. You cannot demand "dynamics" for the brain but accept "static existence" for the book.

  **On the Timeline Book (Q3):**  
  This is the hardest cut. Removing "If-Then" removes the ability to say what the system *would* do if poked. If you say **YES** here, you believe a recording of a mind is a mind. If **NO**, you believe consciousness requires potential, not just history.
