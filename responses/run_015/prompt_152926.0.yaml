answer: |-
  Your working theory is sharp, and you are right to distrust the "case closed" narrative. The literature isn't stalled because the math is hard; it's stalled because the *metaphysics of statistical mechanics* is unfinished.

  Here is the honest diagnosis: The disagreement is **70% conceptual/ontological** (your hypothesis) and **30% substantive/technical** (regarding the generality of non-equilibrium relations). It is not a verbal dispute in the trivial sense, but it is a "framework incommensurability." The two sides are not trying to save the same version of the Second Law.

  ### 1. The Diagnosis: Why the Stall Exists

  You identified the ontological vs. epistemic split. That is the primary engine of the deadlock, but it manifests as a specific charge of **circularity**.

  **The Orthodox Camp (Landauer/Bennett/Modern Info-Thermo):**
  *   **Stance:** Information is physical. Erasing a bit *necessarily* dissipates $kT \ln 2$.
  *   **Goal:** Save the Second Law as a universal principle by expanding the system boundary to include the Demon's memory.
  *   **Weakness:** They often assume the very thing they are trying to prove. To derive Landauer's Principle, you typically assume the validity of the Second Law for the composite system (Demon + Bath). Critics argue this is circular: "The Second Law holds because information erasure costs energy, and we know erasure costs energy because the Second Law holds."

  **The Skeptical Camp (Earman/Norton/Statistical Purists):**
  *   **Stance:** Information is epistemic (a relation between observer and system). Entropy is a property of the macrostate, not the microstate.
  *   **Goal:** Show that the Second Law is purely statistical and does not need "information" to save it. Fluctuations allow the Demon to win temporarily; the law holds only on average.
  *   **Weakness:** They struggle to provide a general account of *feedback control* without implicitly importing information-theoretic terms. When you actually build a feedback loop (experimentally), the information terms appear in the energy balance whether you like them or not.

  **The Verdict:** They are talking past each other because they define "exorcism" differently.
  *   For the Orthodox, exorcism means **no net violation in a single cycle** (accounting for memory).
  *   For the Skeptics, exorcism means **showing the mechanism fails without invoking a new physical law about information.**

  ### 2. Is There a Hidden Empirical Dispute?

  You asked if there is a hidden empirical dispute about correlation costs. The answer is **no, not on the value, but yes on the necessity.**

  *   **Empirically Settled:** Experiments (e.g., Bérut et al., 2012; Toyabe et al., 2010) have verified that erasing information in a colloidal particle or electronic bit dissipates heat consistent with Landauer's bound. Feedback loops converting information to work (Maxwellian demons) have been realized. The *equations* work.
  *   **The Dispute:** The Skeptics argue these experiments confirm *statistical mechanics*, not a new law of "information physics." They argue the heat dissipation comes from the specific Hamiltonian dynamics of the reset mechanism, not from the logical state of "information" itself.
  *   **The Correlation Nuance:** This is where your intuition about correlations is vital. Recent work (Sagawa-Ueda, Parrondo) shows the generalized Second Law with feedback is:
      $$ \langle W \rangle \ge \Delta F - kT \langle I \rangle $$
      Where $\langle I \rangle$ is the mutual information between the measurement and the system.
      The dispute is: **Is $I$ a physical resource like free energy, or just a bookkeeping term describing our knowledge?**
      *   If $I$ is physical, the Demon converts a physical substance (information) into work.
      *   If $I$ is epistemic, the Demon is just exploiting a statistical fluctuation that we *describe* using information theory.

      There is no experiment that can distinguish these two interpretations because they are mathematically isomorphic in standard setups. This is why the debate persists.

  ### 3. Can the Deadlock Be Broken?

  Do not wait for a "smoking gun" experiment. It will not come. The deadlock will not be broken by data; it will be dissolved by a **change in formalism**.

  Here is what could actually move the needle:

  **A. Resource Theories of Thermodynamics (The Formal Path)**
  The most productive shift is moving away from "What is information?" to "What are the allowed operations?" In Quantum Resource Theories, thermodynamics is framed as a theory of state transitions under restricted operations (e.g., Thermal Operations).
  *   **Why it helps:** It bypasses the ontology. It doesn't ask if information is "real." It asks: "Given I have a state correlated with a memory, what work can I extract under thermal constraints?"
  *   **The Result:** This formalism treats information as a *resource* (like entanglement) without committing to whether it is a substance. It unifies the Orthodox and Skeptical views by showing they are different limits of the same resource theory.

  **B. Single-Shot Thermodynamics (The Conceptual Path)**
  Standard thermodynamics is about averages. The Demon operates on single molecules.
  *   **The Shift:** Moving from von Neumann/Gibbs entropy to **Rényi entropies** and single-shot statistical mechanics.
  *   **Why it helps:** In the single-shot regime, the "average" Second Law breaks down. You need stronger bounds. Here, the information-theoretic terms become operationally necessary, not just descriptive. This forces the Skeptics to admit that "information" terms are required for precise control, even if they remain epistemic.

  **C. The "No-Go" Theorem for Non-Informational Resolutions**
  To break the deadlock, someone needs to prove a theorem stating: *"Any physical mechanism that achieves feedback control equivalent to a Maxwell Demon must, under general Hamiltonian conditions, incur a thermodynamic cost isomorphic to Landauer's Principle, regardless of the erasure step."*
  *   Some progress exists here (e.g., showing measurement costs in specific quantum models), but a general classical proof is lacking. If such a proof existed, it would vindicate the Orthodox view that the cost is structural, not contingent.

  ### 4. Summary for Your Seminar

  If you want to cut through the noise in your seminar, frame it this way:

  1.  **Acknowledge the Standard Resolution:** Landauer + Bennett saves the Second Law *if* you accept information is a physical state variable.
  2.  **Highlight the Circularity:** Point out that this assumes the Second Law to prove the cost of erasure, which is then used to save the Second Law.
  3.  **Identify the Real Fight:** The fight isn't about the math (the inequalities hold). It's about whether **Mutual Information** is a physical fuel or a descriptive label.
  4.  **The Way Out:** Suggest that the question "Is information physical?" is a category error. The modern view (Resource Theory) treats information as a **constraint on control**. The Demon doesn't violate thermodynamics; it reveals that thermodynamics is fundamentally a theory of *control and knowledge*, not just heat and work.

  **Final Diagnosis:** The stall is **substantive but foundational**. It won't be solved by better experiments. It will end when the community universally adopts a framework (like Resource Theories) that makes the ontology question irrelevant. Until then, you are correct: one side is doing physics, and the other is doing philosophy of physics, and they are using the same equations to fight different wars.
