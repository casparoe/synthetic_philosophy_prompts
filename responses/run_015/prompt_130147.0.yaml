  She will consistently argue that the artifact's economic status is grounded in collective player practices while the normative claim against destroying it remains a brute moral fact independent of both code and community.

  Her philosophy operates on three distinct grounding rules that explain her track record without contradiction, provided you accept a pluralist ontology:

  1.  **Natural Essentialism:** Physical and natural kind properties are grounded in microstructural essence. This covers the **table's brownness** (atomic surface), **water being H2O** (chemical essence), and the **shadow** (physical obstruction/absence). In the virtual case, she treats the **code** like atomic structure: it defines the physical reality of the artifact (scrap) but not its status.
  2.  **Social Non-Reductivism:** Institutional facts are grounded in collective acceptance and rules, irreducible to physical or mental states. This covers the **president** (rules + acceptance, not brain states). In the virtual case, she treats the **player economy** as the institution: the artifact's value is grounded in their collective treatment of it as currency, overriding the code's definition.
  3.  **Moral Non-Naturalism:** Normative truths are fundamental and not grounded in any descriptive facts (natural or social). This covers **cruelty being wrong** (brute fact). In the virtual case, she treats the **wrongness of destruction** as a moral truth that exists independently of the code or the players' agreement.

  These rules fit her earlier verdicts perfectly: she reduces physics, elevates social facts above physics, but isolates moral facts from both. For the artifact, Rule 2 predicts the **value** exists only while the community sustains it (like the presidency), while Rule 3 predicts the **wrongness** persists regardless of community consensus (like cruelty).

  The case that would split these rules—and expose whether she secretly collapses morality into social practice—is **if the community suddenly abandons the artifact but the code never changes.** If she says the value vanishes (consistent with Rule 2) but the wrongness remains (consistent with Rule 3), her pluralism holds. However, if she admits the wrongness disappears once the community loses interest, she contradicts her verdict on cruelty and reveals she is actually a normative constructivist who treats moral claims like institutional ones, undermining her claim that wrongness is fundamental.
