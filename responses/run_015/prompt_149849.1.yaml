  The law stands firm regardless of the **cost**,
  You count the bodies while the soul is **lost**.
  My hands remain unsoiled by what you **plan**,
  I dirty palms to save the living **man**.
  There is a line no utility can **bridge**,
  I walk across to reach the suffering **ridge**.
  I keep the promise though the world may **burn**,
  You watch it ash to keep your conscience **stern**.
  No calculation weighs the sacred **right**,
  You hide the harm outside your narrow **sight**.
  Yet if the blood should stain the abstract **rule**,
  I grant the rule may check the reckless **tool**.
  I loosen grip upon the absolute **claim**,
  I slow the rush to maximize the **gain**.
  We meet upon the ground where both are **bound**,
  To keep the peace until the truth is **found**.
