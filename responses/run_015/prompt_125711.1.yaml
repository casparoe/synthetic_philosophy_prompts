answer: |-
  **The Case**
  In the ICU triage ward, two officers, Ali and Bea, face identical monitors displaying a specific arrhythmia waveform. Ali's neural realization of the judgment "This is V-Fib" ($M$) is state $N_A$, while Bea's is state $N_B$; due to neuroplasticity and distinct training histories, $N_A$ and $N_B$ are structurally non-identical, sharing no precise synaptic topology, yet both realize $M$. Both officers immediately tag the patient "Priority 1" ($E$). The contrastive question is: why tag Priority 1 rather than Priority 2? Had the judgment been "This is Artifact" ($M'$), both would have tagged Priority 2 ($E'$), regardless of the neural differences. The candidate physical cause is not the microstate $N_A$ (too specific) but the proportionate physical profile $P$: "Activation of the Threat-Response Network characteristic of trained officers." $P$ is equally specific to $M$—it abstracts away from the $N_A$/$N_B$ difference just as $M$ does—and both $M$ and $P$ are present when $E$ occurs and absent when $E'$ occurs. The physical vocabulary tracks the behavior correlationally, but only the mental vocabulary ("V-Fib Judgment") explains why the structurally distinct $N_A$ and $N_B$ are grouped together as a single causal type; $P$ unifies them only by implicitly referencing the functional role that $M$ explicitly names.

  **The Three Accounts**

  1.  **The Exclusion Argument:**
      *   **Verdict:** Epiphenomenalism (Mental state is causally inert).
      *   **Reasoning:** (1) *Closure:* The physical effect $E$ has a sufficient physical cause $P$ (the Threat-Response profile). (2) *Distinctness:* $M$ is not identical to $P$ (stipulated by multiple realization of content vs. physical profile). (3) *No Overdetermination:* It is not a coincidence that $P$ and $M$ both occur; $M$ depends on $P$. (4) *Exclusion:* Since $P$ is sufficient for $E$, and $E$ is not overdetermined, $M$ is excluded. The case specifics confirm $P$ is sufficient: any token of $P$ produces $E$. The argument holds because $P$ is not a "total microstate" but a working neuroscientific type, rebuilding the exclusion problem at the proportionate grain.

  2.  **Friend's Proportional Difference-Making:**
      *   **Verdict:** Dual Causation (No exclusion, both are causes).
      *   **Reasoning:** The friend argues $N_A$ is disproportionate to $E$ (too specific), while $M$ is proportionate (matches the grain of "Priority 1 vs 2"). However, applied honestly, $P$ is *also* proportionate; it abstracts from the micro-details just as $M$ does. Both $M$ and $P$ make the same difference to $E$ across the same contrast class. The test fails to uniquely select $M$ because $P$ is defined at the exact same level of abstraction. The friend must admit both are causes, which reintroduces the rivalry Exclusion warned about, or claim they are "one cause described twice," which surrenders to Identity Theory.

  3.  **Invariance-Across-Realizers:**
      *   **Verdict:** Mental Causation (M is the primary explanatory cause).
      *   **Reasoning:** Causal keep is earned by marking a pattern that holds across realizers. $M$ ("V-Fib Judgment") explains why $N_A$ and $N_B$—which look physically different—produce the same $E$. The physical description $P$ tracks this pattern only by borrowing the functional definition of the mental state (i.e., $P$ is "the state that does what $M$ does"). Without the content vocabulary, $P$ is either a disjunction ($N_A \lor N_B$) or a black box. $M$ provides the unifying principle; $P$ merely registers the correlation. $M$ is causally relevant because it captures the invariance that the structural physical description misses.

  **Final Analysis**

  *   **Single Feature Doing the Work:** **Multiple Realization of Content.** The fact that $N_A$ and $N_B$ are structurally distinct but content-identical is the wedge. If they were structurally identical, Identity Theory would be plausible. If the content varied with the structure, Invariance would fail.
  *   **Removal Effect:** If you remove multiple realization (make $N_A = N_B$), the Exclusion Argument collapses into Identity Theory (User loses the distinction). If you remove the content pattern (make the behavior random relative to judgment), the Invariance Account fails (Mental state does no work).
  *   **Sharpest Objection:** Your friend will say: "You've rigged $P$ to be a functional description. A *real* physical description is structural. If you use a structural description, it fails proportionality (too specific). If you use a functional description, it *is* the mental state. You haven't found a rival physical cause; you've just renamed the mental cause."
  *   **Verdict on Friend's Theory:** **Secretly an Identity Theory in disguise.** To save proportionality, the friend must allow abstract physical states ($P$). But once $P$ is abstract enough to be proportionate, it is indistinguishable from $M$ except by label. The "dissolution" only works if $M$ and $P$ are effectively identical. If they are distinct, Exclusion returns.
  *   **Who Won:** **You.** The case shows that proportionality does not dissolve the rivalry; it merely pushes it up a level. Either you accept Exclusion (mental states are idle), or you accept Identity (mental states *are* physical states). The friend's middle ground (distinct but non-competing) collapses under the weight of a proportionate physical candidate.
  *   **Tension & Sacrifice:** The tension lies between the constraint "Physical vocabulary should not track that pattern" and "Proportionate physical cause." A cause *must* track the effect. I sacrificed the strict "non-tracking" constraint to ensure the physical cause was respectable (not gerrymandered). I allowed $P$ to track the *effect*, but argued it fails to explain the *invariance across realizers* without borrowing mental terminology. This is the honest battleground: not whether $P$ correlates, but whether $P$ *unifies* without semantic help.
