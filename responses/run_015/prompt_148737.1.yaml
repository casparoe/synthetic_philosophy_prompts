          *   *Analysis:* This is actually the core of the Phenomenal Concept Strategy (PCS). PCS argues exactly this: the concepts are different modes of access to the *same* physical property. So (3) and (6) are compatible *if* the user maintains that the referent is identical. The risk is "smuggling mystery" if the "directness" implies a non-physical mode of access that can't be physically explained. But standard PCS claims phenomenal concepts *are* physical states (e.g., neural templates). So this is likely a fake tension, provided the user sticks to physicalism about the concepts themselves.
