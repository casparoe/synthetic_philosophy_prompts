  I'm writing a long-form piece for a general readership about when philosophical disagreements turn out to be disagreements about language. The background article I've been working from states the metaontological version of that argument roughly as follows:

  "Take the old dispute about whether the statue and the lump of clay are one thing or two. Both sides agree about everything you could check: what weighs five pounds, what survives being squashed, what a museum would pay for it. Each can restate the other's position without losing any information. So they aren't disagreeing about the world; they are disagreeing about how to use the quantifier — about whether 'there is' counts the statue and the clay separately. And since nothing we could observe would settle that, and each side can translate the other perfectly, neither side is mistaken: each speaks truly in its own language, and there is no further fact of the matter about how many things there really are. That is what ontological disputes always turn out to be — disagreements about which of several equally good languages to speak, never about how things are. Once you see this, the questions do not vanish, but they stop being philosophical: they become questions about which way of talking is handier, and a discipline organized around them has nothing distinctive left to do. The argument also generalizes. Disputes about whether there are numbers, or moral facts, or reasons for action, are verbal in exactly the same sense, which is why there are no irreducible normative facts either."

  I don't have the background to audit this properly, and I would rather not reprint a distortion in print. My own suspicion is that the step from "no observation could settle it" to "there is nothing to be right about" is doing more work than it is entitled to, but I can't say what is wrong with it. So: go through the passage claim by claim and tell me which parts a defender of this general sort of view would accept, which they would wince at, and which they would reject outright. Then tell me whether the two conclusions the article draws — that ontology has no distinctive subject matter left, and that there are no irreducible normative facts — follow from the parts of the summary that survive correction, or only from the parts that don't.

  There is also a case I want to use as my central example, and I'd like to know whether the corrected version of the view can handle it. Two historians disagree about whether the wave of uprisings that crossed Europe in 1848 was one revolution or a dozen unrelated ones. They agree on every dated event, every proclamation, every troop movement; each can restate the other's claim without loss. But the disagreement cannot simply be dissolved, because a school curriculum — or a heritage register, or a memorial inscription — has to record it as one item or as several. A single institutional practice has to settle on a single counting rule, and there is no way to encode both. My inclination is to say that this shows a dispute can be verbal about meaning while still having a genuine answer of a different kind: not which framework is true, but which framework the practice should adopt, given that it can adopt only one. Is that a coherent middle position, and one a deflationist could actually occupy? Or does it collapse into realism on one side and "just take whichever is more convenient" on the other? And if it is coherent, does it force the deflationist to give up the claim that there is no fact of the matter?

  Please write in prose, working through the passage in the order its claims appear, and say where you are confident and where reasonable people differ instead of smoothing over the uncertainty. Finish with a single machine-readable line — \answer{fair}, \answer{misleading}, or \answer{unfair} — with nothing after it.
