answer: |-
  Your suspicion is well-founded. The passage you are working from captures the spirit of ontological deflationism (often associated with figures like Eli Hirsch, Hilary Putnam, or the early Carnap), but it conflates several distinct philosophical moves and overextends the conclusion in ways most defenders would reject. Below is a claim-by-claim breakdown of how a sophisticated defender of this view would likely respond, followed by an analysis of your 1848 case study.

  **The Statue and the Lump**
  The passage begins with the claim that both sides agree on "everything you could check: what weighs five pounds, what survives being squashed." A defender would **accept** the spirit of this but **wince** at the phrasing. Deflationists argue that the realist and the deflationist agree on all the *physical* facts (the arrangement of particles, the history of the object). However, saying they agree on "what survives being squashed" is tricky. The realist says the statue does not survive; the deflationist says the word "statue" does not apply to the post-squashed object. They agree on the physical outcome, but disagree on the description. A defender would prefer to say they agree on all *non-ontological* facts, rather than "everything you could check," because ontology is not typically settled by observation.

  Next, the passage claims, "Each can restate the other's position without losing any information." A defender would **accept** this outright. This is the thesis of "quantifier variance" or translatability. The core argument is that the dispute is merely about whether the quantifier "there exists" ranges over statues-plus-clay or just clay-plus-particles. If the languages are intertranslatable, the defender argues, there is no substantive disagreement.

  The passage then moves to the inference: "And since nothing we could observe would settle that... neither side is mistaken... there is no further fact of the matter." Here, a defender would **wince** at the reliance on "observe." Modern deflationists do not usually rely on empiricist verificationism (the idea that only observable things are real). They rely on principles of charity and conceptual analysis. However, they would **accept** the conclusion that there is "no further fact of the matter" *ontologically*. They argue that once you have fixed all the physical facts and the linguistic rules, there is no leftover "metaphysical glue" that makes one counting method the True one.

  **The Generalization to All Ontology**
  The passage claims, "That is what ontological disputes always turn out to be." A defender might **wince** at the universal "always." Most deflationists argue that *many* traditional disputes (composition, persistence) are verbal, but few claim that *every* possible ontological question is verbal. Some might allow that questions about fundamental physics could be substantive. However, for the sake of the general argument, a strong deflationist might **accept** this.

  The passage continues: "Once you see this... a discipline organized around them has nothing distinctive left to do." This is where a defender would likely **reject** or significantly **qualify** the claim. Most deflationists do not think philosophy vanishes; they think it transforms into "conceptual engineering" or pragmatics. The question becomes "Which language is more useful for our purposes?" rather than "Which language is True?" Saying the discipline has "nothing distinctive left to do" implies eliminativism, whereas deflationists usually advocate for a pragmatic reconstruction of metaphysics.

  **The Leap to Normative Facts**
  The final claim is: "Disputes about whether there are numbers, or moral facts... are verbal in exactly the same sense, which is why there are no irreducible normative facts either." A defender of ontological deflationism would **reject** this outright. This is a significant distortion. One can be a deflationist about objects (statues) while being a realist about numbers (Platonism) or morals (Realism). For example, Hilary Putnam was a champion of internal realism (a deflationary view) but argued vigorously for the objectivity of ethical truth. Conflating ontological deflationism with metaethical non-cognitivism is a category error. The argument that "existence" is vague does not entail that "goodness" is vague or non-existent. This conclusion does not follow from the corrected view; it follows only from the conflated, overly nihilistic version presented in the summary.

  **Your 1848 Case Study**
  Your example of the 1848 revolutions is an excellent test case, and your proposed middle position is coherent and historically aligned with the best version of this view (specifically Rudolf Carnap's distinction between "internal" and "external" questions).

  You suggest that the dispute is verbal about meaning but has a genuine practical answer regarding which framework an institution should adopt. A deflationist can absolutely occupy this position without collapsing into realism or mere convenience. Here is why:
  1.  **No Ontological Fact:** The deflationist maintains there is no mind-independent fact about whether 1848 was "one" revolution or "many." Reality does not come pre-sliced into revolutions.
  2.  **Pragmatic Fact:** However, there *is* a fact about which counting rule better serves the goals of the museum, the curriculum, or the state. If counting it as "one revolution" helps students understand a transnational pattern, that is a genuine reason to adopt that framework.
  3.  **No Collapse:** This does not collapse into realism because you are not claiming the curriculum discovered the *true* number of revolutions. It does not collapse into "just take whichever is convenient" because institutional goals impose real constraints (you cannot choose a framework that makes the curriculum unintelligible).

  Does this force the deflationist to give up the claim that "there is no fact of the matter"? No, provided they specify "no *ontological* fact of the matter." They can admit there is a *pragmatic* fact of the matter. Your intuition here is correct: the dispute is verbal regarding truth, but substantive regarding utility. This preserves the deflationist insight (no metaphysical mystery) while avoiding the nihilistic conclusion that the choice is arbitrary.

  **Conclusion on the Background Article**
  The background article captures the core mechanism of ontological deflationism (translatability implies no fact of the matter) but distorts its justification (relying on observation rather than conceptual analysis) and its scope (illegitimately extending it to ethics). It presents a "hard" nihilistic version that many actual defenders would reject in favor of a pragmatic reconstruction. Therefore, while it is not entirely fabrication, it smooths over crucial distinctions that matter for accuracy.

