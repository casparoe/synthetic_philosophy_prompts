answer: |-
  ### The "Collective Impact" Decision Procedure

  This checklist is designed to bypass the "one app can't change the climate" argument by testing whether your action is actually just a drop in the bucket, or if it functions as part of a larger system. It moves from physical facts to value judgments.

  **How to use:** Run the proposal through steps 1–4 in order. If you hit a **Hard Yes**, ship it. If you hit a **Hard No**, kill it. If you hit **Move On**, proceed to the next step. If you hit **Judgment Flag**, the team lead must make a call based on the note provided.

  ---

  #### 1. Is the impact linear or threshold-based?
  *Does this change add a small amount to a total (linear), or does it help cross a specific limit where the outcome changes drastically (threshold)?*
  *   **Hard Yes:** The change helps cross a known tipping point (e.g., keeping server temp below a failure threshold, meeting a regulatory carbon cap).
  *   **Hard No:** The impact is physically impossible to measure or is mathematically zero (e.g., reducing load by 1 byte on a petabyte system).
  *   **Move On:** It is a small contribution to a large total (e.g., saving 0.2% energy per user).
  *   **Judgment Flag:** *Estimating the curve.* We rarely know exactly where the tipping points are. If you suspect a threshold exists but can't prove it, treat it as "Move On" but note the uncertainty.

  #### 2. Is there direct causal impact, or mainly symbolic/structural effect?
  *Does this action physically reduce harm, or does it signal a value to change behavior later?*
  *   **Hard Yes:** Direct, measurable reduction in harm (e.g., servers actually consume less power).
  *   **Hard No:** Purely symbolic with a net cost (e.g., a feature that consumes more energy to display a "we care about energy" message).
  *   **Move On:** It has a small direct impact but a larger symbolic goal (e.g., a small saving intended to set a norm).
  *   **Judgment Flag:** *Valuing signal vs. noise.* Symbolic acts matter if they change culture. If the symbol is likely to be ignored or mocked, lean toward "Hard No."

  #### 3. Is there a coordination or scaling mechanism?
  *If we do this, does it enable others to do it, or does it stay locked in our codebase?*
  *   **Hard Yes:** The change is open-sourced, standardized, or forces a supply-chain change that competitors must follow.
  *   **Hard No:** The change is proprietary, hidden, or cannot be copied by others (no scaling).
  *   **Move On:** It could be copied, but we aren't actively promoting it.
  *   **Judgment Flag:** *Predicting adoption.* You cannot know for sure if others will copy you. If the tech is industry-standard, assume "Yes." If it's a unique hack, assume "No."

  #### 4. Pure values call — does the principle matter even if outcome is nil?
  *If this change resulted in zero measurable benefit, would we still do it because it aligns with who we are?*
  *   **Hard Yes:** It aligns with a core company mission or non-negotiable ethical stance (e.g., "We do not track children," even if tracking them would be profitable).
  *   **Hard No:** It violates a core principle (e.g., "We do not coerce users," even if coercion would improve safety).
  *   **Move On:** It aligns with a "nice to have" value.
  *   **Judgment Flag:** *Defining the principle.* This is not a fact question. The team must agree on what the company's "soul" is. If you disagree on the value, you cannot proceed.

  ---

  ### Run-Through: Three Proposals

  Here is how the procedure handles your specific scenarios.

  #### (a) Shipping the API-batching feature (~0.2% energy saved per user)
  *   **Step 1 (Linear/Threshold):** **Move On.** Energy savings are linear. One request batched doesn't stop climate change; it's a drop in the bucket.
  *   **Step 2 (Direct/Symbolic):** **Move On.** Direct impact exists (0.2% saving), but it is tiny.
  *   **Step 3 (Coordination/Scaling):** **Hard No.** (Assumption: This is a proprietary implementation specific to your stack). If you do not open-source the batching logic or publish the standard, no one else can copy it. You remain "one app."
  *   **Result:** **DO NOT SHIP.**
  *   **Why this feels wrong:** Engineers feel optimization is inherently virtuous. This procedure says that *private* optimization with negligible impact is morally neutral at best, and a distraction at worst. It validates management's "inefficacy" objection specifically because there is no scaling mechanism.
  *   **Fix:** If you commit to open-sourcing the library (changing Step 3 to **Hard Yes**), the result flips to **Ship**.

  #### (b) Banning beef at company events
  *   **Step 1 (Linear/Threshold):** **Move On.** One company's catering doesn't tip the global meat market.
  *   **Step 2 (Direct/Symbolic):** **Move On.** Direct impact is tiny (a few kg of CO2). Symbolic impact is high (signals company values).
  *   **Step 3 (Coordination/Scaling):** **Move On.** Other companies might copy, but catering is rarely standardized tech.
  *   **Step 4 (Values):** **Hard Yes.** (Assumption: Company values include "Sustainability" and "Responsibility"). Even if the carbon saving is negligible, acting consistently with your stated values matters for integrity.
  *   **Result:** **SHIP (Implement the ban).**
  *   **Why this feels right:** It bypasses the "inefficacy" argument by leaning on Step 4 (Integrity). It says "We do this because it's who we are," not "because this specific lunch saves the world."

  #### (c) Adding an in-app banner urging users to vote
  *   **Step 1 (Linear/Threshold):** **Move On.** One vote rarely decides an election (linear/inefficacy).
  *   **Step 2 (Direct/Symbolic):** **Move On.** Purely symbolic. The banner itself consumes energy to serve.
  *   **Step 3 (Coordination/Scaling):** **Hard No.** Other apps are unlikely to coordinate a unified voting banner campaign without explicit coalition building.
  *   **Step 4 (Values):** **Judgment Flag.** Is "Civic Engagement" a core tech value, or is it political overreach?
      *   *If Team decides "No":* **Hard No.**
      *   *If Team decides "Yes":* **Hard Yes.**
  *   **Result:** **LIKELY NO (depending on Step 4).**
  *   **Why this feels wrong:** Encouraging voting feels universally "good." The procedure flags that without coordination (Step 3), this is just noise. It forces you to admit if you are doing it for actual impact (which is low) or for brand signaling (which Step 2 flags as costly).

  ---

  ### Where This Procedure Misfires

  This checklist is a tool, not a truth machine. It will fail you in three specific areas:

  1.  **The "Precedent" Blind Spot:** Step 3 (Scaling) assumes you know if others will copy you. Often, industry standards start as one company doing something "useless" (like HTTPS adoption). The procedure might kill a feature that later becomes the industry norm. *Mitigation:* If you suspect you are setting a trend, override Step 3 with a "Strategic Bet" flag.
  2.  **The "Morale" Variable:** The procedure measures carbon and logic, not team spirit. Sometimes shipping Proposal A (API Batching) makes engineers feel proud and retained, which is a business good even if the carbon saving is zero. The procedure counts this as a "Distraction." *Mitigation:* Add a hidden "Team Health" multiplier to Step 4.
  3.  **The "Values" Trap:** Step 4 is where bias hides. If management defines "Company Values" as "Profit Only," every ethical proposal hits a **Hard No**. If the team defines values as "Save The World," every proposal hits a **Hard Yes**. The procedure cannot resolve disagreements on what your values actually are; it only enforces them once stated.

  **Summary for your next meeting:**
  Use this to tell management: "We aren't arguing about feelings. We are arguing about Step 3 (Scaling). If we open-source the batching, the inefficacy objection dies. If we keep it proprietary, you are right, and we should stop."
