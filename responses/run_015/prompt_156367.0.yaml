  # Decision Tree: The Primacy of Analogical Cognition

  **Root Commitment:** "Analogical mapping is prior to, and not derived from, symbolic representation."

  ---

  ### Branch 1: The Representational Substrate
  **Question:** Can analogical mapping operate directly on perceptual surfaces, or does it always require an intermediate abstract representation?
  *   **Yes:** Operates directly on perceptual surfaces.
  *   **No:** Requires intermediate abstract representation.

  ### Branch 2: The Status of Slippage
  **Question:** Is conceptual "slippage" (the mutation of concepts during extension) a feature that drives innovation, or a failure mode that undermines validity?
  *   **Yes:** Feature (drives innovation).
  *   **No:** Failure mode (undermines validity).

  ### Branch 3: Generative Capacity
  **Question:** Can analogy generate genuinely novel conceptual structures not implicitly present in the source, or does it only recombine pre-existing structures?
  *   **Yes:** Generates novelty.
  *   **No:** Only recombines.

  ### Branch 4: The Role of Language
  **Question:** Is linguistic capacity a downstream product of analogical cognition, or does language provide the representational scaffold without which analogical mapping cannot occur?
  *   **Yes:** Downstream product (Analogy is prior).
  *   **No:** Representational scaffold (Language is prior).

  ---

  ## Leaf Positions

  ### Leaf A: Strong Analogy-First
  *   **Path:** Yes (Direct) → Yes (Feature) → Yes (Novelty) → Yes (Downstream)
  *   **Name:** Strong Analogy-First
  *   **Awkward Commitment:** Must explain how high-level abstract reasoning emerges from perceptual mapping without secretly smuggling in symbolic rules to handle complexity.

  ### Leaf B: Rigid Perceptualism
  *   **Path:** Yes (Direct) → No (Failure) → No (Recombines) → Yes (Downstream)
  *   **Name:** Perceptual-Surface-Only Variant
  *   **Awkward Commitment:** Must account for conceptual flexibility and creativity while insisting that any shift in meaning during mapping is a computational error rather than a cognitive feature.

  ### Leaf C: Symbolic-Computational Rejection
  *   **Path:** No (Abstract) → No (Failure) → No (Recombines) → No (Scaffold)
  *   **Name:** Symbolic-Computational Rejection
  *   **Awkward Commitment:** Must explain how amodal symbols acquire semantic grounding if the analogical processes that typically connect symbols to the world are dismissed as mere search heuristics.

  ### Leaf D: Linguistic-Constructivist
  *   **Path:** No (Abstract) → No (Failure) → Yes (Novelty) → No (Scaffold)
  *   **Name:** Linguistic-Constructivist View
  *   **Awkward Commitment:** Must explain the existence of sophisticated analogical reasoning in pre-linguistic infants or non-human animals without conceding that analogy precedes language.

  ### Leaf E: Unnamed
  *   **Path:** Yes (Direct) → Yes (Feature) → No (Recombines) → No (Scaffold)
  *   **Name:** Unnamed
  *   **Diagnosis:** Unexplored combination that tensions perceptual directness with linguistic dependency.
  *   **Awkward Commitment:** Claims perception drives conceptual slippage directly but simultaneously insists language is required to perform the mapping operation itself.

  ---

  ## Structural Limitations and Flags

  **Identical Answer Pairs:**
  No pair of leaves in this tree shares identical answers across all four branches. Each position is logically distinguished by at least one diagnostic commitment.

  **Theoretical Convergence Note:**
  While no *leaves* share identical answers, distinct theoretical traditions (e.g., Enactivism and Dynamic Systems Theory) might both converge on **Leaf A**. The tree cannot separate them because both endorse direct perceptual coupling, view flexibility as functional, and treat language as secondary, differing only in rhetorical emphasis on "action" versus "trajectory" rather than logical commitment.
