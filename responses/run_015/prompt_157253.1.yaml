answer: |-
  Here is the adjudication of the debate, move by move, followed by the missing framework, the final verdict, and your house-style recommendation.

  ### Move-by-Move Adjudication

  **1. Hal: The axis is exhausted; new divides (education/cosmopolitan) cut across it.**
  **Verdict: Mostly Right.**
  Hal correctly identifies the realignment of the last two decades. The correlation between class and voting has inverted in many democracies (the "diploma divide"), and issues like immigration do not map cleanly onto economic leftism. However, he is wrong to declare the axis "exhausted." The cosmopolitan/national divide has largely *migrated* into the left/right labels rather than replacing them. The vocabulary has stretched, not broken.

  **2. Ruth: Issue constraint is real; labels coordinate actors.**
  **Verdict: Clearly Right.**
  This is the strongest empirical claim in the exchange. Political science literature on "ideological constraint" (dating to Philip Converse) confirms that knowing a voter's stance on one salient cultural or economic issue predicts their stance on others well above chance, especially in polarized environments. Furthermore, her point about coordination is decisive: if politicians use the labels to negotiate, the labels have ontological reality regardless of philosophical purity.

  **3. Hal: Clustering is manufactured by elites; followers re-sort quickly.**
  **Verdict: Mostly Right.**
  Hal is correct that mass publics are less ideologically consistent than elites (the "top-down" polarization model). Many voters hold contradictory views until cued by party leaders. However, he overstates the speed and ease of re-sorting. Affective polarization (disliking the other side) now locks bundles in place more tightly than policy agreement does. Voters are not just following elites; they are defending identities.

  **4. Ruth: The "Asymmetry of Default" (Right = status quo baseline; Left = advantage baseline).**
  **Verdict: Mostly Right.**
  This is a sophisticated articulation of *System Justification Theory* (Jost et al.) combined with a heuristic for policy burden-of-proof. It explains why "conservative" often implies resistance to change and "liberal" implies remediation of inequality. It is not a known thesis by this specific name, but it is a robust synthesis of existing psychological literature. It fails slightly on the fringes (e.g., revolutionary leftists or reactionary rightists who want to restore a past status quo), but as a rule of thumb for mainstream coalitions, it holds.

  **5. Hal: Asymmetry is unfalsifiable; ignores the second axis (libertarian/authoritarian).**
  **Verdict: Mostly Right.**
  Hal's critique of falsifiability is valid; psychological definitions of conservatism can become tautological. His point about the second axis is also technically correct (the Nolan Chart or Pournelle Chart). However, he misses that in most parliamentary democracies, the second axis is subsumed by the first. Libertarians and traditionalists vote together not because they agree, but because they share a common enemy on the left. The 2D model explains internal friction, but the 1D model predicts election outcomes.

  **6. Ruth: Dimensionality isn't the question; cross-national recurrence is.**
  **Verdict: Clearly Right.**
  This is Ruth's strongest move. If left/right were merely arbitrary American elite bundling, it wouldn't recur across distinct cultures and centuries. The fact that similar coalitions (labor/secular vs. capital/religious) emerge independently suggests the axis tracks something structural about modernity, not just local history. Her point about inference is also pragmatically vital: readers will infer a worldview regardless of whether you use the labels.

  **7. Hal: Labels license inference; journalists should describe positions.**
  **Verdict: Mostly Wrong.**
  This is normatively appealing but practically impossible. "Describing positions" requires infinite space. More importantly, readers *will* infer the bundle even if you don't name it. If you write "Candidate X supports unions and carbon taxes," the reader mentally tags "Left" anyway. Omitting the label does not prevent stereotyping; it merely removes the shared vocabulary needed to critique the stereotype.

  **8. Ruth: Dropping terms loses the explanation for coalitional reassembly.**
  **Verdict: Mostly Right.**
  Without the shorthand, you cannot explain *why* a union member and a climate activist are in the same room. You are left with a list of issues without a theory of cohesion. Journalism requires compression to explain causality.

  ### What Both Are Missing

  The debate stalls because Hal is arguing about **Ideology** (internal philosophical consistency) while Ruth is arguing about **Identity** (social coalitional signaling).

  Hal is right that *ideological* consistency is weak; many voters do not hold a coherent philosophical worldview that spans all issues. Ruth is right that *social identity* is strong; voters belong to tribes that move together.

  The missing distinction is **Coordinate vs. Jersey.**
  Hal treats "Left/Right" as a **Coordinate**: a precise geometric location in policy space. By this metric, he is right that the map is fuzzy.
  Ruth treats "Left/Right" as a **Jersey**: a team uniform that signals who you are with, not necessarily every specific play you run. By this metric, she is right that the terms are indispensable.

  Neither explicitly names that the terms have shifted from describing *philosophies* to describing *alliances*. The "Asymmetry of Default" works not because it is philosophically true, but because it is the *narrative* each side tells itself to justify the alliance.

  ### The Verdict

  **Ruth is more right overall.**

  Hal wins on ontology (the philosophical purity of the axis is degraded), but Ruth wins on utility (the terms still predict behavior and organize society). For a journalist, utility must trump purity. If you stop using the words, you do not liberate the reader from the axis; you merely disarm them from discussing it. You force them to do the work of clustering issues themselves, which they will do poorly, relying on implicit biases rather than explicit labels.

  The "Left/Right" spectrum is no longer a ruler, but it remains a map. It is distorted, but it is the only one we have that covers the whole territory.

  ### House-Style Recommendation

  **Do not drop the words.** However, change *how* you use them.

  1.  **Treat them as Coalitions, not Coordinates:** Use "left" and "right" to describe *who is allied with whom*, not necessarily to imply a perfect philosophical unity.
  2.  **Acknowledge the Friction:** When a "right-wing" policy contradicts a "right-wing" principle (e.g., big government conservatism), note the tension. Do not smooth it over.
  3.  **Use Hyphens when Necessary:** If the distinction matters, use "economic right" vs. "social right." But do not abandon the root terms.
  4.  **Avoid "Centrism" as a Default:** Do not assume the truth lies between the labels. Sometimes the axis itself is the wrong question, but often the axis is the only thing explaining the political energy.

  **Confidence Level:**
  *   **Verdict (Ruth wins):** 90% confident. The sociological reality of the labels outweighs the philosophical decay.
  *   **Advice (Keep the terms):** 95% confident. Dropping them creates more confusion than clarity in mass communication.
  *   **Move Ratings:** 80% confident. Political science literature supports Ruth on constraint and Hal on elite cueing, but Ruth's pragmatic argument is decisive for your context.

  ### The Single Finding That Would Change My Mind

  I would abandon the terms if data showed that **within-party correlation on key policy preferences dropped below 0.1.**

  Currently, if you know a politician is "Right," you can predict their vote on taxes, immigration, and regulation with high accuracy. If we reached a point where knowing someone was "Right" predicted their next vote no better than a coin flip (indicating total decoupling of the coalition), then Hal would be right: the jersey would no longer even predict the team's plays, and the label would be pure noise. We are not there yet.
