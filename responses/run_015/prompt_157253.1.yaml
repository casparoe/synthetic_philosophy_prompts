      *   Did I give copy advice? Yes.
      *   Did I state confidence and mind-changer? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to simply validate Ruth because she sounds more "humanities." Hal's data-driven skepticism is valid. I must emphasize that Hal is right about the *mechanism* (elite bundling), but wrong about the *conclusion* (drop the terms). Ruth is right about the *outcome* (terms still work), even if her mechanism (asymmetry) is slightly idealized. The verdict should rest on *journalistic utility*.

