  You're a professional moral philosopher — the kind who's actually worked on moral demandingness and impartiality, not someone skimming the surface literature. Please think carefully and do a bit of unstructured brainstorming before you settle on an answer; I'd rather get a careful, slightly messy adjudication than a tidy one that glosses the moves.

  Two people in my ethics reading group, Malik and Jo, got into a proper argument after our last session and neither would budge, and they've asked me to referee. I don't want to just side with whoever I like more, so I'm passing it to you. The question they started from was the old one about "moral saints" — is a person who always does whatever is morally best, and whose whole motivational structure is organised around doing so, someone we should want to be, or want our kids or partners to be? Here's roughly how it went. (1) Malik: sainthood crowds out non-moral excellence. A saint spends every discretionary hour on the highest-return altruistic thing available, so no cello, no long novels, no hiking unless it's instrumental; but those non-moral goods are real goods and part of what makes a life worth living, so maximal moral goodness isn't the same thing as maximal goodness, plain and simple, and it's not an ideal to aim at. (2) Jo: the crowding-out is overstated, because a lot of non-moral goods are complements rather than substitutes — a rested, socially embedded, disciplined person does more good across a lifetime, and skills transfer — and besides, a lot of what we value in our own hobbies is available second-hand; being the friend who genuinely delights in someone else's cello recital isn't obviously much worse than playing it yourself. (3) Malik: even granting that, the saint's relation to her own projects is corrupted, because she takes up the cello only because it makes her more effective and she'd drop it the moment the numbers moved; her commitments are all held on a leash, and being wholehearted about something — caring about it non-instrumentally and not auditing it — is itself a constituent of a good life, which sainthood structurally rules out. (4) Jo: that's a demand about motive-shape smuggled in as a demand about content; what matters for friendship and for a life going well is mostly the stable pattern of attention and action, and the leash objection proves too much anyway, since plenty of perfectly healthy commitments are conditional in the same way while the condition is just different, and being responsive to the impersonal good isn't a defect. (5) Malik, conceding the leash point and pivoting: here's what I actually think — sainthood is fine as an emergency setting, not as a character. You can install in yourself a disposition to flip into full-on maximising altruism when a threshold is crossed (a child in a pond, a pandemic, a moment when your particular skills are weirdly high-leverage) and otherwise live as a normal person with projects, partialities and hobbies; call it the reserve model, and it gets you the saint's benefits without paying for them across an entire life. (6) Jo: the reserve model has no principled threshold — whatever line you draw is just the line where the saint's own arithmetic says the extra good outweighs the cello, so the "normal" life is the saint's life with a rounding error, and a person who calibrates how much she cares about others to the marginal returns is exactly the cost-benefit manager you said you didn't want; worse, if you set your own trigger, self-interest will set it low and you'll be a reliably bad judge of when it's gone off. (7) Malik: but that cuts both ways — the saint's schedule is set by the same impersonal calculus, the only difference being that her trigger fires at zero, so the real quarrel is just about the discount rate we're allowed to apply to our own projects, and you owe me a reason why zero is the uniquely respectable setting.

  Can you go through this move by move — rate each of the seven from clearly mistaken to clearly right, with a sentence or two of justification each — and then tell me who's more right overall and, more importantly, what both of them are missing? I have a vague feeling they're both tacitly imagining one saint embedded in a world of non-saints, and I'd be curious whether that makes a difference to who wins, but don't just take my cue if it's a red herring.
