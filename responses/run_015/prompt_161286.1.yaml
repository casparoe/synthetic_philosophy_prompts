  | claim | RL or control counterpart (name the object or technique, or a dash if there is none) | status | what is lost or smuggled |
  | :--- | :--- | :--- | :--- |
  | Negative Utilitarianism | Single-Objective Cost Minimization ($r = -s$) | clean | Happiness is rendered invisible unless it causally impacts suffering dynamics. |
  | Lexical Threshold (Intensity) | Lexicographic Optimization / Hard Constraint per Agent | distorted | The threshold $\tau$ becomes a tunable hyperparameter rather than a discovered natural constant. |
  | Lexical Threshold (Aggregate) | Constrained MDP with Global Budget | distorted | Lagrangian methods often permit soft violations for stability, weakening the lexical priority. |
  | Commensurability (One Scale) | Scalarized Reward Function ($w_h h - w_s s$) | clean | Forces a trade-off rate implicitly, even if weights are set to prioritize suffering. |
  | Commensurability (Two Currency) | Multi-Objective RL (Pareto / Vector Reward) | distorted | Algorithmic selection of a final policy often reintroduces hidden scalarization. |
  | Scale Asymmetry | Asymmetric Reward Bounds and Baseline Shifting | distorted | RL rewards are affine-invariant, so the "absolute zero" neutral point must be artificially anchored. |
  | Urgency Asymmetry | Safety Shields / Interrupt Handlers vs. Gradient Magnitude | clean | Distinguishes structural preemption from large penalty, validating the claim as distinct from magnitude. |

