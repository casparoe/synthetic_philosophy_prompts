      *   *Refining Item 3:* The user asked about "Individual vs Population." This is about whether your one kid matters. This is "Causal Efficacy."
      *   *Refining Item 2:* The user asked about "Possible people moral standing." This is actually Item 1's cousin. Let's group "Moral Standing of Possible People" into the Biological vs. Adoption distinction.

      *   *Revised Order:*
