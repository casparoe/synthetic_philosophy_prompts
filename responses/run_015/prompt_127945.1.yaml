          3.  **Causal Efficacy (Marginal Impact).** This determines if your specific choice triggers the risks in #2. (One vs. Many).
          4.  **Moral Standing of the Possible.** (Deep theory). Actually, this underpins #1. Let's make #1 about the *practical* distinction (Adoption vs Bio) and ground it in the *theoretical* distinction (Possible vs Actual).

      *   *Let's try to make it even more actionable.*
      *   1. **The "Existing Person" Override (Adoption).** If you adopt, the asymmetry vanishes. You are helping an existing being. This is the highest priority because it resolves the theoretical tension immediately.
      *   2. **The "Net Negative" Threshold (Climate/Suffering).** If you bio-procreate, is the life likely to be good? If climate makes it likely to be bad, the asymmetry doesn't protect you. You are causing harm.
      *   3. **The "Complicity" Calculation (Externalities).** Even if the kid is happy, do they harm others? This is the population-level effect.
      *   4. **The "Possible Person" Metaphysics.** (Downgrade this). It's interesting but if #2 says "Life is likely good," the metaphysics matters less for the decision. If #2 says "Life is likely bad," metaphysics doesn't matter. So #2 is more upstream for decision making than deep metaphysics.

      *   *Wait, the user asked:* "does it depend on whether 'possible people' have any moral standing before theyre born?"
      *   *My take:* Yes, but practically, we act *as if* they have standing regarding harm (don't create suffering) but not benefit (don't need to create happiness). The real question is the *probability of harm*.
      *   *Let's stick to the "Decision Tree" logic.*
      *   1. **Adoption vs. Procreation (The Framework Shift).**
