      *   *Final Plan:*
          1.  **Priority 1: The Ontological Category (Existing vs. Possible).** This dictates the ethical framework. Adoption = Standard Ethics. Procreation = Asymmetry Ethics.
          2.  **Priority 2: The Expected Value Calculation (Risk of Suffering).** This dictates whether the Asymmetry is even relevant. If $E[\text{Value}] < 0$, it's harm, not "non-benefit." Climate risk lives here.
