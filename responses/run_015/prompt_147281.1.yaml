  # JOINT STATEMENT ON THE METAPHYSICS AND METHODOLOGY OF CAUSATION

  **Signatories:**  
  *The Counterfactual Theorist (CT)* — Defending causation as counterfactual dependence along a chain, determined by the similarity metric of possible worlds.  
  *The Interventionist Theorist (IT)* — Defending causation as invariance of generalizations under surgical interventions within a causal model.

  **Context:** Following a period of adversarial collaboration, we issue this statement to record points of convergence, delineate remaining fundamental disagreements, and identify specific cruxes that would resolve the dispute.

  ### I. AGREED CLAIMS

  1.  **Causation is not Correlation:** Both parties agree that causal claims exceed mere statistical association. A causal relationship requires a modal structure (counterfactual or manipulability) that distinguishes it from accidental regularities.
  2.  **Late Preemption:** In standard cases of late preemption (where a preempting cause completes a process before a backup cause can), we agree that the preempting factor is the cause and the backup is not. We agree that adequate formalisms must capture the *inactive* status of the backup path despite its potential sufficiency.
  3.  **Symmetric Overdetermination:** In cases of symmetric overdetermination (e.g., two rocks striking a window simultaneously), we agree that both factors satisfy the structural conditions for causation in their respective frameworks. We acknowledge that while intuitive verdicts may vary, both frameworks correctly identify the redundant sufficiency of the causes.
  4.  **Omissions and Double Prevention:** We agree that claims involving omissions (e.g., "failure to water caused death") and double prevention are ubiquitous in special sciences and legal reasoning. We agree that any viable theory of causation must account for their truth conditions, even if we disagree on whether they denote genuine ontological relations.
  5.  **The Two-Variable Convergence Case:** In a closed system containing only two perfectly correlated variables ($X$ and $Y$) with no exogenous variables or temporal asymmetry available:
      *   We agree that **neither framework can distinguish $X \to Y$ from $Y \to X$** using internal data alone.
      *   We agree that counterfactual dependence (evaluated via world similarity without external asymmetry) and interventionist invariance (evaluated without external handles) both remain silent on directionality. We accept this as a shared limitation of inferring causation from joint distributions without asymmetry assumptions.
  6.  **Methodological Utility:** We agree that causal modeling (DAGs, SEMs) is an indispensable tool for scientific inquiry, regardless of whether the underlying metaphysics is cashed out in terms of worlds or interventions.

  ### II. AREAS OF DISAGREEMENT

  | Issue | The Counterfactual Theorist's Position | The Interventionist Theorist's Position |
  | :--- | :--- | :--- |
  | **1. Circularity of Intervention** | The notion of an "intervention" is causally loaded. To define an intervention as a variable that *breaks* causal links presupposes the very causal structure it is meant to analyze. Therefore, interventionism is circular or derivative. | Intervention is a primitive but intelligible notion defined by modularity and independence, not by prior causal knowledge. It is no more circular than defining "distance" in geometry; it is a structural feature of the model, not a metaphysical presupposition. |
  | **2. The Nature of Counterfactuals** | The relevant counterfactuals are determined by **overall similarity of worlds**. This permits "backtracking" in specific contexts where preserving laws requires adjusting the past, provided the similarity metric weights particular facts appropriately. Causation is objective and mind-independent. | The relevant counterfactuals are determined by **surgical interventions**. Backtracking is forbidden; an intervention fixes the target variable exogenously, severing incoming arrows. Causation is tied to the perspective of a potential manipulator or modeler. |
  | **3. The Sealed Universe** | **Verdict:** Causation exists in a deterministic, physically sealed universe with no agents.<br>**Assessment of Opponent:** The Interventionist's silence here is a **theoretical cost**. It wrongly denies objective causal structure to a world simply because no agent exists to manipulate it. | **Verdict:** Causal claims are undefined in a deterministic, physically sealed universe with no external handles.<br>**Assessment of Opponent:** This silence is the **correct verdict**. Causation is a relation relative to a model or agency; without the possibility of intervention, the concept has no purchase. |

  ### III. CRUXES FOR RESOLUTION

  | Crux | Description & Case | CT Prediction | IT Prediction | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Chancy Late Preemption** | **Case:** Process A fires and causes E. Process B was ready to fire but is cut off. However, the link between A and E is indeterministic (A only raises the probability of E).<br>**Question:** Is there causation without strict counterfactual dependence? | **Prediction:** Intuition will favor "cause" even if dependence fails. CT must rely on "quasi-dependence" chains. If quasi-dependence is rejected, CT must concede causation without dependence. | **Prediction:** Intuition will favor "cause" because an intervention on A changes the *probability* of E. IT handles this naturally via probabilistic invariance. | **Genuine.** This tests whether causation requires dependence (CT) or merely influence/probability-raising (IT). |
  | **2. The Status of Omissions** | **Case:** A gardener fails to water a plant; the plant dies. Neighbors also did not water it.<br>**Question:** Is the omission a *cause* or merely an *explanation*? | **Prediction:** If omissions are treated as events in the ontology, CT accepts them as causes (counterfactual holds). If intuitions distinguish "causing" from "allowing," CT must refine the similarity metric to exclude distant omissions. | **Prediction:** Omissions are variables taking a default value (0). If the model includes the gardener, it is a cause. If the dispute is about *which* omissions count, it is a pragmatic choice of model granularity, not metaphysics. | **Verbal (likely).** The dispute reduces to whether "causation" names a metaphysical relation (CT) or an explanatory tool (IT). |
  | **3. Non-Causal Intervention Definition** | **Case:** Defining "intervention" without using causal terms (e.g., using only statistical independence or physical exogeneity).<br>**Question:** Can intervention be defined non-causally? | **Prediction:** Any definition of "exogenous" or "independent" will implicitly rely on causal directionality (e.g., time order, thermodynamic asymmetry). If no non-causal definition is found, IT is circular. | **Prediction:** Intervention can be defined via modularity of equations or experimental design protocols that do not presuppose the specific causal link being tested. If successful, IT is foundational. | **Genuine.** This determines the foundational priority of the theories. |
  | **4. The Sealed Universe Asymmetry** | **Case:** The deterministic sealed universe (from Disagreement 3) contains a thermodynamic arrow of time but no agents.<br>**Question:** Does physical asymmetry ground causal direction without intervention? | **Prediction:** Yes. The thermodynamic asymmetry grounds the counterfactual asymmetry. Causation exists. IT's silence is a failure to capture objective reality. | **Prediction:** No. Physical asymmetry grounds *counterfactuals*, but without the *concept* of manipulation, "causation" adds nothing. The silence is correct; we should speak only of physical determination. | **Genuine.** This tests whether causation is a feature of the world (CT) or a feature of our engagement with the world (IT). |

  **Signed,**

  _________________________  
  *The Counterfactual Theorist*

  _________________________  
  *The Interventionist Theorist*

  **Date:** October 26, 2023
