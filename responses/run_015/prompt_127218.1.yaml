answer: |-
  # Population Axiology: The "Where Did You End Up?" Flowchart

  Welcome to the trap. This tree sorts you by your verdicts on concrete cases, not by the labels you claim. Start at **Node 1**. Follow the arrows. Record your leaf code.

  ### The Nodes
  **N1: Existence.** World A (1 person, welfare +5) vs. Empty World Ø. Is A better than Ø?
  *   **Yes** → N2.
  *   **No/Incomparable** → N8.

  **N2: Same-Number Swap.** World A (1 person, +10) vs. World B (1 person, +9). Is A better than B?
  *   **Yes** → N3.
  *   **No** → **Leaf L5** (Narrow Person-Affecting).

  **N3: Levelling Down.** World C (2 people, +10/+2) vs. World D (2 people, +2/+2). Is C better than D?
  *   **Yes** → N4.
  *   **No** → **Leaf L6** (Strict Egalitarian).

  **N4: The Repugnant Conclusion.** World A (10 people, +10) vs. World Z (10,000 people, +0.1). Is Z better than A?
  *   **Yes** → N5.
  *   **No** → N6.

  **N5: Sadistic Addition.** Add 1 person at -5 vs. Lower 1 existing person by 5 units. Is adding worse?
  *   **Yes** → **Leaf L1** (Totalism).
  *   **No** → **Leaf L4** (Negative Utilitarianism).

  **N6: Mere Addition.** World A (10 people, +10) vs. World A+ (A + 10 new people at +0.1). Is A+ *worse* than A?
  *   **Yes** → **Leaf L9** (Lexical View).
  *   **No** → N7.

  **N7: The Chain.** If A > A+ and A+ > B … > Z, do you accept A > Z? (Transitivity).
  *   **Yes** → **Leaf L3** (Critical-Level View).
  *   **No** → **Leaf L7** (Intransitive View).

  **N8: Asymmetry.** Create 1 person at +5 vs. Prevent 1 person at -5. Is preventing more urgent?
  *   **Yes** → N9.
  *   **No** → **Leaf L10** (Hard Incomparabilist).

  **N9: Threshold Worth.** Is a life at +0.1 worth living *for the person living it*?
  *   **Yes** → N10.
  *   **No** → **Leaf L4** (Negative Utilitarianism).

  **N10: Threshold Value.** Does adding that +0.1 life make the world *better*?
  *   **Yes** → **Leaf L1** (Totalism).
  *   **No** → **Leaf L8** (Split-Threshold).

  **N11: Uncertainty.** Gamble G1 (50% A [+10], 50% Ø) vs. Sure Thing G2 (100% B [+5]). Prefer G1?
  *   **Yes** → **Leaf L1** (Totalism).
  *   **No** → **Leaf L3** (Risk-Averse Critical-Level).
      *(Note: Insert N11 after N2 if you reached it via N1-Yes.)*

  **N12: Equality/Incomparability.** World X (10 people, +5) vs. World Y (10 people, +5, different identities). Are they Equal or Incomparable?
  *   **Equal** → **Leaf L1** (Totalism).
  *   **Incomparable** → **Leaf L5** (Narrow Person-Affecting).
      *(Note: Insert N12 after N2 if you reached it via N1-Yes.)*

  ---

  ### The Leaves
  **L1: Total Utilitarianism.** *Awkward Commitment:* You must accept the Repugnant Conclusion. *Stuck With:* Z is better than A, but you avoid the Sadistic Conclusion.
  **L2: Average Utilitarianism.** *Awkward Commitment:* Adding happy people can lower value. *Stuck With:* The Mere Addition Paradox implies Z is better than A eventually.
  **L3: Critical-Level View.** *Awkward Commitment:* Lives worth living can add negative value. *Stuck With:* You reject RC, but only by setting a threshold above neutrality.
  **L4: Negative Utilitarianism.** *Awkward Commitment:* Suffering outweighs all happiness. *Stuck With:* You might accept the Sadistic Conclusion to avoid RC.
  **L5: Narrow Person-Affecting.** *Awkward Commitment:* Different-number cases are incomparable. *Stuck With:* No verdict on A vs. Z; cannot guide long-term policy.
  **L6: Strict Egalitarian.** *Awkward Commitment:* Levelling down is good. *Stuck With:* You prefer everyone worse off just to be equal.
  **L7: Intransitive View.** *Awkward Commitment:* Rational choice cycles are possible. *Stuck With:* You accept each step of the chain but reject the conclusion.
  **L8: Split-Threshold (Unnamed).** *Awkward Commitment:* A life can be worth living but add no value. *Stuck With:* You separate personal worth from additive value; literature is silent here.
  **L9: Lexical View.** *Awkward Commitment:* Small losses in quality cannot be compensated by quantity. *Stuck With:* You reject RC, but Mere Addition becomes impossible to justify.
  **L10: Hard Incomparabilist.** *Awkward Commitment:* Value judgments require fixed populations. *Stuck With:* Creating happy people is neither good nor bad.

  ---

  ### Unresolved Pairs & Notes
  **1. L1 (Totalism) vs. L3 (Critical-Level).** *Problem:* If the Critical Level is set near zero, these behave identically on most cases. *Separator:* Ask about a life at +0.0001. Totalism says "adds value"; Critical-Level says "adds nothing/negative."
  **2. L5 (Narrow PA) vs. L10 (Incomparabilist).** *Problem:* Both return "no verdict" on different-number cases. *Separator:* Ask about same-number cases with different identities (Node 12). Narrow PA says "incomparable"; Incomparabilist says "incomparable" everywhere. Check Same-Number Swap (Node 2).
  **3. L1 (Totalism) vs. L8 (Split-Threshold).** *Problem:* Both accept RC (usually). *Separator:* Ask if the +0.1 lives in Z are *worth living*. Totalism says Yes + Adds Value. Split-Threshold says Yes + No Value.

  **On Split-Thresholds:** You asked for room here. **Leaf L8** is currently **Unnamed** in the literature. Most theories bolt the "worth living" threshold to the "adds value" threshold. This combination isn't incoherent, just unexplored. It's unattractive because it implies we should be indifferent to creating lives that are good for the liver but neutral for the world—a strange dissociation of personal and impersonal value.

  **On Comfort:** Notice **L1 (Totalism)** accepts the Repugnant Conclusion but lands in a "more comfortable" spot than **L4 (Negative Utilitarianism)** or **L2 (Average)** on the Sadistic Addition (Node 5). You can be a Repugnant-Conclusion acceptor and still think adding suffering people is worse than lowering existing lives. Conversely, some RC-rejectors (like Average Utilitarians) are forced to accept the Sadistic Conclusion. The tree ensures you aren't just measured on a single "repugnance dial."

  **On Uncertainty:** Node 11 forces you to decide if your axiology plugs into expected-value reasoning when existence is stochastic. Totalists usually say Yes; Person-Affecting views often break here because expected value requires a common currency across states where different people exist.

  *Print this single-sided. Bring your answers to the session.*
