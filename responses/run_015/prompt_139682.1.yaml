answer: |-
  Here are the two versions of the scene, set on the allotments. The action is identical: the protagonist moves a communal compost screen. The consequences are symmetric in causal structure and foreseeability: one plot loses light (bad), one plot gains drainage (good). The only variable is the order of presentation and slight focal weighting.

  **Version 1 (Bad Consequence Foregrounded)**
  She levered the compost screen three feet to the east, the wood groaning against the gravel until it settled into the new pegs. The shift meant the afternoon shadow would fall squarely across Mrs. Gable's tomatoes, stunting the ripening just as the colour began to turn. It also meant the rain runoff would channel away from Mr. Henderson's lower bed, saving his onions from the rot that had taken them last year. She wiped the dirt from her palms on her trousers, checked the latch, and walked back towards the gate without looking at either plot.

  **Version 2 (Good Consequence Foregrounded)**
  She levered the compost screen three feet to the east, the wood groaning against the gravel until it settled into the new pegs. The shift meant the rain runoff would channel away from Mr. Henderson's lower bed, saving his onions from the rot that had taken them last year. It also meant the afternoon shadow would fall squarely across Mrs. Gable's tomatoes, stunting the ripening just as the colour began to turn. She wiped the dirt from her palms on her trousers, checked the latch, and walked back towards the gate without looking at either plot.

  ***

  ### The Analysis

  **1. The Verdict and the Mechanism**
  *   **Version 1 (Bad First):** The reader will likely judge that she **intentionally** shaded the tomatoes, but only **foreseeably** saved the onions.
      *   *Mechanism:* This is the standard Knobe Effect (Side-Effect Effect). The moral badness of harming Mrs. Gable's crop triggers a blame-response that recruits the concept of "intentionality." The reader's mind works backwards from the blame ("She shouldn't have done that") to the mental state ("She must have meant to"). The good outcome is treated as a mere side effect because praising her requires less cognitive urgency.
  *   **Version 2 (Good First):** The reader will likely **still** judge that she **intentionally** shaded the tomatoes, though the certainty might waver slightly. The "Good = Intentional" flip is notoriously unstable.
      *   *Mechanism:* Order priming is weak compared to moral valence. Even if you mention the help first, the harm remains a norm violation. The concept of "intentional" is skewed by blame, not just by narrative focus. To get the flip (Good=Intentional, Bad=Unintentional), you usually have to break symmetry (see below).

  **2. Can you flip it while keeping symmetry?**
  **No.** Not reliably.
  The Knobe Effect is robust because our ordinary concept of "intentional action" is not a neutral philosophical category; it is a tool for assigning praise and blame. We expand the definition of "intentional" to catch bad actors and shrink it to protect good ones (or those we like).
  To flip it so the reader feels she *meant* to save the onions but *didn't mean* to shade the tomatoes, you have to break the symmetry you requested. You would need to make the good consequence appear to require **skill** or **effort**, while the bad consequence appears **passive**.
  *   *The Rigged Version:* If she *adjusts* the screen carefully to channel the water (skill/effort = intentional), and the shadow is just an unavoidable physical byproduct (passive = unintentional), you get the flip. But this violates your constraint that both consequences be produced by the "same mechanism" with "equal effort."
  *   *The Honest Advice:* If you need the flip for Chapter 19, you must subtly rig the physics. Make the drainage fix look like it required a precise angle she aimed for, while the shadow looks like an inevitable consequence of mass. If you keep them truly symmetric, the Bad outcome will always attract more "intentionality" than the Good one.

  **3. The Single Feature Carrying the Case**
  The **moral valence of the harm** (stunting tomatoes vs. saving onions).
  *   *If you delete it:* If you change the consequences to two neutral outcomes (e.g., "The shadow falls on Plot A" and "The water runs to Plot B"), the asymmetry collapses. Readers will say "Yes, she intentionally did both" or "No, she intentionally did neither," but they won't split the verdict. The asymmetry exists *only* because one outcome is a violation of a norm (don't harm neighbours) and the other is a conformity (help neighbours).

  **4. The Objection (Effort/Control vs. Blame)**
  *   *The Attack:* A sceptic (or a reader focused on control) will say: "She didn't try harder to shade the tomatoes than to drain the onions. She just moved the screen. Therefore, she intended neither. They are both just side effects."
  *   *The Dodge:* You must ensure she **knows** both will happen. If she looks ignorant of the consequences, both become accidental. You need to imply foresight without implying motive.
  *   *The Tweak:* Add a beat where she pauses to check the alignment. "She sighted along the wood, checking the line." This implies control over the position, which implies control over *both* consequences. It forces the reader to admit she knew what would happen, isolating the moral valence as the only variable left to explain the difference in judgment.

  **5. The Novelist Question**
  *   **The Line:** Plant this in free indirect thought or dialogue just before the move: *"It had to be done, whichever way you looked at it."*
      *   *Why:* This implies necessity without specifying *which* consequence is the necessity. It primes the reader to look for a justification. In Version 1, the justification fails (harm is hard to justify), so she looks blameworthy (Intentional Harm). In Version 2, the justification holds (help is good), but the harm still lurks.
  *   **The Back-to-Back Risk:** **Yes, reading them back-to-back kills it stone dead.**
      *   If the reader reads Chapter 7 and thinks "She meant to harm," then reads Chapter 19 and sees the exact same action described slightly differently, they will spot the manipulation. The trick relies on memory decay and the isolation of the reading experience.
      *   *Mitigation:* You cannot rely on the text alone to sustain the contradiction over a long reading period. You must rely on the **narrative voice shift**. Chapter 7 (Close Third) should make the reader *feel* her internal necessity (reducing blame, potentially reducing "intentional harm"). Chapter 19 (Hostile Outside) should make the reader feel judged (increasing blame, increasing "intentional harm").
      *   *Recommendation:* Do not try to flip the Knobe effect in Chapter 19. Instead, use Chapter 19 to **intensify** the Standard Knobe effect. Let Chapter 7 leave it ambiguous (Close Third creates empathy, blurring intentionality). Let Chapter 19 make it damning (Hostile narration creates distance, sharpening intentionality). This gives you a progression (Ambiguous -> Damning) rather than a contradiction (Damning -> Innocent), which is more sustainable for a novel's arc.
