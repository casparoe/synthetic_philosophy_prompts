answer: |-
  When people invoke the story of Omelas in arguments about climate change or supply chains, they are making a specific metaphysical claim disguised as a moral one. They are asserting that an ordinary citizen, by merely continuing their life as normal, is causing the suffering of a distant child. This claim rests on the idea that a person can cause an outcome merely by not doing something. To take this seriously, we must look at how causation works when the alleged cause is an absence. There are two standard ways to handle this. The first is the complaint that an absence is not the sort of item that can stand in a causal relation at all. Causes are typically events or forces that push against the world, having a location, a duration, and a mechanism. Nothing has none of these things. You cannot point to a non-action in the way you can point to a stone breaking a window. On this view, the citizens of Omelas are not causes of the child's misery because they do not touch the child, lock the door, or withhold the food. They simply live elsewhere. The second view is the counterfactual treatment, which swaps mechanism for dependence. This view says that causation is about what relies on what. It asks whether the outcome would have been different had the agent acted. If had this citizen gone down and brought the child up, the misery would have ended, then on this view, their failure to act is a cause of the misery.

  The story's own terms favour the counterfactual view. The bargain is explicit that the happiness of the many depends on the misery of the one, and that freeing the child would destroy the city. This sets up a strict dependency. Had any single citizen acted to rescue the child, the outcome would have been different. Therefore, on the dependence view, everyone is an actual cause. However, this leads to a strange result. The outcome arrives regardless of what any one of them does. If Alice stays home, the child suffers. If Alice decides to go but Bob stops her, the child suffers. If Alice goes and succeeds, the city falls. But since everyone is individually such that had they acted the outcome would change, we are left with a glut of causes. Every citizen is a cause of the suffering, even though the suffering does not depend on any specific individual. This is not necessarily a defect in the dependence view, but it is a feature that stretches our intuition. It suggests that actual causation in cases of omission works differently than in cases of physical impact. It implies that causation here is not about transferring energy but about holding open a path to harm. The story pushes us toward a notion of causation that is less about physics and more about opportunity.

  We can see how fragile this notion is by testing it with variations. Consider a version where the city requires that some child or other be kept in misery, and that any citizen who freed this child would simply see another installed in its place. In this scenario, no individual's failure makes a counterfactual difference to whether a child suffers at all. If you rescue this child, another takes their place. The dependence view now lets everyone off the hook regarding the general fact of suffering. Your inaction is not a cause of there being a suffering child, because had you acted, there would still be a suffering child. The view that absences cannot be causes agrees with this conclusion but for different reasons. The gap between this variant and the actual story shows that causation by omission is hostage to how the counterfactuals happen to be arranged. If the magic of the city works one way, you are a cause. If it works another way, you are not. This suggests that omission causation is not a fixed feature of the world like gravity, but a relational property that depends on the specific rules of the system. If causation is this sensitive to the setup, it may be that we are not describing a physical relation at all, but simply mapping out where responsibility lies.

  A second variation attends to the timing of knowledge. In the story, the young people are not told until they are old enough, and the visit is the moment at which they acquire both knowledge and, presumably, an opportunity. This raises the question of whether an omission begins only when the agent could have known what was at stake. If causation depends on counterfactuals, and counterfactuals depend on what an agent could have done, then the causal relation appears to switch on with a change in someone's beliefs rather than in the world. Before the visit, the child suffers, but the citizens are not causes. After the visit, the child suffers, and the citizens are causes. Nothing physical has changed in the basement or the city walls. Only the minds of the citizens have changed. This is a strange result for a metaphysical theory. It implies that ignorance excuses causation as well as blame. If you do not know you could stop the harm, you are not causing it. The story makes the visit the hinge of the whole thing, which suggests it is less interested in the physics of suffering than in the conditions under which failures can be causes. It frames causation as something that requires awareness, blurring the line between being a cause and being responsible.

  Finally, there are the ones who walk away. They do not rescue the child, nothing about the outcome changes, and on one description they are omissive causes like anyone else. They still fail to save the child. On another description, something has genuinely altered, since they no longer consent and no longer participate. Perhaps the right account of the citizens' role all along was not omission but participation in a practice that reproduces the misery. In that case, leaving changes their causal standing while leaving the outcome untouched. They cease to be part of the system that sustains the harm, even if the harm continues. This suggests that the causal question and the practical question come apart. Establishing that I cause a harm by my inaction may be the least useful thing I can learn, because it does not tell me whether to stay and fight or to walk. The walkers show that moral integrity might require severing ties with a causal chain rather than trying to fix the outcome within it.

  Le Guin withholds everything a causal theorist needs. There is no mechanism, no institution, no account of how the bargain operates, and a narrator who professes she cannot suit every reader. The dependence is stipulated rather than explained. This thinness might seem to make the case too weak to do metaphysical work, but it may instead reveal that our judgements about omissions rest on features no theory has yet isolated. We do not judge omissions based on physical forces alone. We judge them based on expectations, roles, and norms. The story, by making the reader's own verdict part of the exercise, dramatises something the argumentative literature misses. It shows that attributions of causation by omission are doing expressive or normative work which a metaphysics of absences cannot underwrite. When we say a citizen causes the suffering, we are not describing a push or a pull. We are saying that they ought to have acted. The story is not a puzzle about how nothing can move something. It is a puzzle about why we accept the world as it is. The metaphysics of omission collapses into ethics because the only thing distinguishing a cause from a bystander in Omelas is the willingness to bear the cost of change. The walkers understand that knowing you are a cause is not enough. You must decide whether the cost of stopping the cause is one you are willing to pay. The story leaves us with the unsettling realization that causation by inaction is not a discovery about the world, but a demand we place upon ourselves.
