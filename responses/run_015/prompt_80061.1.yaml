      *   *Hypothesis 2: Empirical Underdetermination.* Also plausible. Data alone often can't distinguish parameter drift from structural change without intervention.
      *   *My Assessment:* It's deeper than just verbal. It's a clash of *explanatory interests* masked as an ontological dispute. It's about *granularity* and *intervention stability*.

