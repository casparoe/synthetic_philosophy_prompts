answer: |-
  Your diagnosis is remarkably sharp, and largely correct: the stalemate is primarily **categorial**, not empirical. Both sides generally accept the Einstein field equations; the fight is over what the variables in those equations *ontologically represent*.

  However, to say it is *only* conceptual risks understating the technical constraints that keep the debate alive. There are hidden substantive disagreements regarding **indeterminism**, **vacuum solutions**, and the **locality of inertial structure**.

  Here is an honest diagnosis of the disagreement's structure, the specific points of friction that prevent closure, and an assessment of whether the question can be solved or must be dissolved.

  ---

  ### 1. The Diagnosis: You Are Right, But the Terms Have Shifted

  You identified that the stall is not empirical. This is correct. No experiment since Gravity Probe B (which measured frame-dragging) has decisively killed either camp. Frame-dragging looks Machian (local inertia influenced by rotating mass), but it is fully predicted by General Relativity (GR), which admits vacuum solutions (spacetime without matter), which looks Substantivalist.

  The debate persists because "Substantivalism" and "Relationism" are no longer the binary they were in 1700.
  *   **Newtonian Substantivalism:** Space is a container that exists without bodies.
  *   **Modern Substantivalism (Manifold/Metric):** The spacetime manifold (points) or the metric field ($g_{\mu\nu}$) is a physical entity that exists independently of matter.
  *   **Modern Relationism:** Spacetime is nothing over and above the spatiotemporal relations between material events (or fields).

  **Your hypothesis holds:** The debate is stuck because Substantivalists are often answering *"What is the ontological status of the metric field?"* while Relationists are answering *"What generates inertial forces?"*

  However, there is a **hidden substantive disagreement** that prevents this from being merely verbal. It centers on three technical/philosophical pivots.

  ### 2. The Hidden Substantive Disagreements

  #### A. The Hole Argument and Leibniz Equivalence
  This is the strongest technical barrier. In 1987, Earman and Norton revitalized the debate using Einstein's "Hole Argument."
  *   **The Setup:** In GR, you can mathematically redistribute the metric field within a vacuum region (the "hole") without changing the distribution of matter outside it, via a diffeomorphism.
  *   **The Substantivalist Dilemma:** If spacetime points are real substances (Manifold Substantivalism), then the two mathematically distinct distributions represent two physically distinct worlds. But since GR cannot distinguish between them, the theory becomes **indeterministic**.
  *   **The Relationist Move:** To save determinism, one must accept **Leibniz Equivalence**: Diffeomorphic models represent the *same* physical state. This implies spacetime points have no independent identity; only the coincidences of fields matter.
  *   **The Stall:** Sophisticated Substantivalists (like Tim Maudlin) bite the bullet. They argue we must restrict the class of admissible models to avoid indeterminism, preserving the reality of the manifold. Relationists argue this is ad hoc. The disagreement is substantive: **Is indeterminism a metaphysical cost too high to pay for substantivalism?**

  #### B. Vacuum Solutions and the "Knockout" Punch
  Strict Machian Relationism (inertia is *only* caused by distant matter) faces a hard empirical/theoretical counter-example: **Vacuum Solutions**.
  *   **The Data:** GR allows for universes with no matter ($T_{\mu\nu} = 0$) that still have curved spacetime and well-defined inertial structure (e.g., Minkowski space, gravitational waves).
  *   **The Disagreement:**
      *   **Relationists** must argue that these solutions are unphysical idealizations or that "matter" includes the gravitational field itself (which blurs the line between relation and substance).
      *   **Substantivalists** point to gravitational waves propagating in a vacuum as proof that the spacetime field carries energy and momentum independently of matter. It acts like a "thing."
  *   **Why it stalls:** Relationists retreat to "Spacetime Structuralism" (structure exists without a substrate), while Substantivalists claim the metric field *is* the substance. They are describing the same math with different metaphysical grammars.

  #### C. What Counts as an Explanation of Inertia?
  You asked if they disagree on "what counts as an explanation." Yes, profoundly.
  *   **Substantivalists** are satisfied with a **local explanation**: Inertia is determined by the local metric field. Why the metric is what it is is a boundary condition problem, not an ontological one.
  *   **Relationists** demand a **global/causal explanation**: Inertia *must* be derived from the distribution of mass-energy in the universe (Mach's Principle).
  *   **The Conflict:** GR does not enforce Mach's Principle. You can have a single particle in an empty universe in GR, and it will still have inertia. Substantivalists say, "See? Inertia is intrinsic to spacetime structure." Relationists say, "Then GR is incomplete." This is a disagreement about **theoretical completeness**, not just data.

  ### 3. Can Anything End the Debate?

  #### Empirical Constraints: No
  Empirical data underdetermines the ontology. Even if we detect gravitons, a Substantivalist will say, "Particles of the spacetime field," and a Relationist will say, "Quanta of the relational structure." The math remains invariant; the interpretation shifts.

  #### Quantum Gravity (QG): A Shift, Not a Solution
  QG might change the *terms* of the debate, but likely won't settle the metaphysics.
  *   **Loop Quantum Gravity (LQG):** Often framed as relational (spin networks define space via adjacency, not background coordinates). This favors Relationism/Structuralism.
  *   **String Theory:** Historically background-dependent (requires a fixed spacetime to define strings), though AdS/CFT suggests spacetime emerges from boundary relations.
  *   **The Problem:** Even if spacetime is "emergent" from entanglement (as in ER=EPR), the question recurs: **Is the underlying quantum state a substance or a set of relations?** The metaphysical virus replicates at the lower level.

  #### Conceptual Distinction: The Path to Dissolution
  The only viable path to "ending" the debate is **dissolution via refinement**. The binary "Substantivalism vs. Relationism" is likely a false dichotomy.

  **Spacetime Structuralism** (championed by philosophers like James Ladyman and Don Ross) is the leading candidate for dissolution.
  *   **The View:** There are no "things" (substances) and no "relations between things." There is only **structure**. The metric field is not a substance sitting in a container, nor is it merely a relation between material bodies. It is a physical structure that constrains matter.
  *   **Why it works:** It accepts the reality of the metric field (satisfying Substantivalists' need for inertial structure) but denies that spacetime points have haecceity (primitive identity) independent of the structure (satisfying Relationists' Leibniz Equivalence).
  *   **The Verdict:** If the community adopts **Ontic Structural Realism**, the debate dissolves. We stop asking "Is space a thing?" and ask "What is the invariant structure of the physical laws?"

  ### 4. Conclusion: Is the Question Ill-Posed?

  **Yes.** The question "Is space absolute or relative?" is ill-posed in the context of modern physics.

  1.  **Space is not a noun:** In GR, "spacetime" is a dynamic field ($g_{\mu\nu}$), not a stage. It interacts, curves, and ripples. Calling it a "substance" misleads by implying passivity; calling it a "relation" misleads by implying it requires non-spatiotemporal relata.
  2.  **The Boundary Condition Problem:** You noted the issue of "dynamical law grounding its own boundary conditions." This is the crux. GR determines the geometry *given* matter/energy, but the topology and global structure are often boundary conditions. Substantivalists treat these as brute facts of the "container"; Relationists treat them as incomplete physics. Until we have a theory of the universe's boundary conditions (Quantum Cosmology), this remains open.

  **Final Diagnosis:**
  Your working theory is correct: the stall is conceptual. However, it is not merely a confusion of terms; it is a **clash of metaphysical preferences regarding indeterminism and ontology**.
  *   **Substantivalists** prioritize the reality of the field and accept the cost of manifold realism.
  *   **Relationists** prioritize the primacy of matter/interactions and accept the cost of explaining vacuum inertia.

  **Recommendation:** Do not look for an empirical "kill shot." Look to **Spacetime Structuralism**. The debate will not end with a winner, but with the realization that the categories "substance" and "relation" are macroscopic intuitions that do not map cleanly onto the ontology of a relativistic field. The question should be dissolved into: *"What is the minimal ontological commitment required to make sense of the metric field's causal power?"*

  That is a question physics can answer; "Absolute vs. Relative" is a question metaphysics will argue over forever.
