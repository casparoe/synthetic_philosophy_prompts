prompt: |-
  I've been trying to understand updateless decision theory and i keep hitting a wall. If UDT just means the agent chooses the policy with the highest expected utility before it knows which decision instance it will be in, then isn't it just ordinary expected utility with a longer time horizon? Why would it ever give a different recommendation than just maximizing expected utility at the decision point, especially in Newcomb's problem, if the agent is just doing EU over policies?
reasoning: |-
  Here's a thinking process that leads to the explanation of Updateless Decision Theory (UDT):

  1.  **Analyze the User's Confusion:**
      *   **Core Question:** If UDT is just choosing the best policy *before* knowing the specific situation (ex-ante), isn't that just ordinary Expected Utility (EU) maximization with a longer time horizon (planning ahead)?
      *   **Specific Challenge:** Why would UDT give a *different* recommendation than maximizing EU *at the decision point* (ex-post), especially in cases like Newcomb's Problem?
      *   **Underlying Misconception:** The user is conflating "planning ahead" (pre-commitment) with "logical correlation/counterfactuals." They likely view the decision point as causally independent from the prediction made earlier, whereas UDT treats the decision *as* the cause of the prediction (via logical correlation). They also might be thinking of standard Causal Decision Theory (CDT) when they say "ordinary expected utility at the decision point."

  2.  **Deconstruct the Difference (Ex-Ante vs. Ex-Post):**
      *   *Standard EU (CDT)* at the decision point: "Given what I know *now* (the box is already filled or empty), what action maximizes my utility?" It treats the past as fixed.
      *   *UDT (Ex-Ante Policy)*: "If I were the kind of agent who picks One Box, what happens? If I were the kind of agent who picks Two Boxes, what happens?" It treats the decision algorithm as the input to the predictor.
      *   *The "Longer Time Horizon" Argument:* The user thinks UDT is just "planning at $t=0$ and sticking to it." While pre-commitment is part of the intuition, UDT is deeper. It's not just about *binding* yourself; it's about how the *logic* of your decision determines the outcome, even without a binding contract.

  3.  **Identify the Key Mechanism: Logical Correlation / Counterfactuals:**
      *   In Newcomb's Problem, the Predictor simulates you.
      *   CDT says: "The money is already there. My choice can't change the past. Two-boxing dominates."
      *   UDT says: "My decision algorithm *is* what the Predictor simulated. If my algorithm outputs 'One Box', the simulation output 'One Box', so the box is full. If my algorithm outputs 'Two Box', the box is empty."
      *   The crucial distinction is *what is held fixed* in the counterfactual.
          *   CDT holds the *physical state of the world* fixed (the boxes' contents).
          *   UDT holds the *logical facts* fixed (the output of the algorithm in identical/similar situations).

  4.  **Address the "Ordinary EU" Confusion:**
      *   "Ordinary EU" usually implies Causal Decision Theory (CDT).
      *   If the user means Evidential Decision Theory (EDT), UDT is closer to EDT but handles spurious correlations better (e.g., Smoking Lesion).
      *   I need to clarify that "maximizing EU at the decision point" usually implies conditioning on the *current state*, which excludes the logical link to the predictor.
      *   UDT maximizes EU over *policies* (functions from observations to actions), not just *actions*.

  5.  **Structure the Explanation:**
      *   **Validate:** Acknowledge that the intuition ("it's just pre-commitment") is a common starting point but misses the technical core.
      *   **Define the Conflict:** Contrast "Action-based EU" (CDT) vs. "Policy-based EU" (UDT).
      *   **The Newcomb Example:** Walk through the math/logic of both approaches.
          *   CDT: Box content is fixed ($P(\text{Full}) = 0$ or $1$).
          *   UDT: Box content depends on the policy ($P(\text{Full} | \text{Policy}=\text{1Box}) = 1$).
      *   **The "Time Horizon" Rebuttal:** Explain why simple pre-commitment isn't enough. You need to *be* the type of agent who one-boxes, not just *say* you will. The Predictor predicts your *source code*, not your vows.
      *   **The Counterfactual Shift:** This is the technical heart. Explain how UDT changes the "what if" reasoning. Instead of "What if I take one box *given* the boxes are empty?", it asks "What if my algorithm *was* the one-boxing algorithm?"
      *   **Summary/Key Takeaway:** UDT isn't just planning ahead; it's recognizing logical control over predictions.

  6.  **Refine the Tone:**
      *   Keep it philosophical but precise.
      *   Avoid overly dense formalism (like modal logic) unless necessary.
      *   Use the "Source Code" analogy (common in LW/ MIRI circles) as it clarifies the logical link.

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I distinguish EDT?* EDT also one-boxes. I should mention why UDT is different (Smoking Lesion/Parfit's Hitchhiker). The user asked specifically about Newcomb, so keep the focus there but hint at the broader advantage.
      *   *Is "Ordinary EU" ambiguous?* Yes. In economics, EU usually allows conditioning on info. In decision theory contexts, "maximizing EU at the decision point" usually implies CDT. I must clarify this terminology.
      *   *The "Wall":* The user feels stuck. I need to provide the "Aha!" moment. The "Aha!" is realizing that *you* are a mathematical function, and the Predictor computed that function.

  8.  **Drafting the Content (Mental Outline):**
      *   Intro: You're close, but missing the "logical counterfactual" piece.
      *   Point 1: Action vs. Policy. CDT optimizes actions; UDT optimizes the mapping.
      *   Point 2: Newcomb's breakdown. Show why CDT fails (treats prediction as past fact). Show why UDT succeeds (treats prediction as logical output).
      *   Point 3: Why "Time Horizon" isn't enough. Pre-commitment requires a mechanism. UDT *is* the mechanism.
      *   Point 4: The Counterfactual. "If I were to 1-box" means "If my code were the 1-boxing code."
      *   Conclusion: It's about logical control, not just temporal planning.

  9.  **Final Polish:** Ensure clear headings and bold text for emphasis. (Proceed to generate output based on this thought process.)
answer: |-
  You have hit on the exact intuition that makes Updateless Decision Theory (UDT) feel both obvious and confusing. Your intuition is partially correct: UDT *does* involve choosing a policy based on expected utility calculated "before" receiving specific information.

  However, the reason it gives a different recommendation than "ordinary" expected utility maximization at the decision point is not just about **time horizon** (planning ahead vs. acting now). It is about **what is held fixed in the counterfactual.**

  Here is the breakdown of why "ordinary" EU fails in Newcomb's Problem, and why UDT succeeds, without relying on mystical pre-commitment devices.

  ### 1. The Terminology Trap: "Ordinary Expected Utility"
  When decision theorists say "maximize expected utility at the decision point," they usually refer to **Causal Decision Theory (CDT)**.

  *   **CDT** asks: "Given the state of the world *right now*, which action causally leads to the best outcome?"
  *   **UDT** asks: "Which input-output function (policy), if instantiated by me, leads to the best outcome?"

  In Newcomb's Problem, the divergence happens because CDT treats the Predictor's past action as a **fixed fact**, whereas UDT treats it as a **logical consequence** of your current decision algorithm.

  ### 2. The Newcomb Breakdown
  Let's look at the math of the counterfactuals.

  **The Setup:**
  *   Box A is transparent ($1,000).
  *   Box B is opaque ($1,000,000 or $0).
  *   Predictor put $1M in B *if and only if* it predicted you would take only B.

  **The "Ordinary" (CDT) View at the Decision Point:**
  You are standing in front of the boxes. The prediction has already happened. The money is either in Box B or it isn't.
  *   *Counterfactual 1:* If I take both boxes, I get $1,000 + (whatever is in B).
  *   *Counterfactual 2:* If I take only Box B, I get (whatever is in B).

  Since the content of Box B is already fixed (let's say it's empty), taking both gets you $1,000, taking one gets you $0. If it's full, taking both gets $1,001,000, taking one gets $1,000,000.
  **Dominance Principle:** Two-boxing always yields $1,000 more than one-boxing *given the current state of the boxes*.
  **Result:** Two-box.

  **The UDT View (Ex-Ante Policy):**
  UDT doesn't ask "What should I do given the boxes are already filled?" It asks "What policy should my source code implement?"
  Crucially, the Predictor simulated your source code. Therefore, the content of Box B is a function of your policy.

  *   *Counterfactual 1:* If my policy is "Always Two-Box," the Predictor simulated "Two-Box," so Box B is Empty. Utility = $1,000.
  *   *Counterfactual 2:* If my policy is "Always One-Box," the Predictor simulated "One-Box," so Box B is Full. Utility = $1,000,000.

  **Result:** One-box.

  ### 3. Why "Longer Time Horizon" Isn't Enough
  Your hypothesis was: *Isn't UDT just ordinary EU with a longer time horizon (planning at t=0)?*

  If "planning" just means making a vow at $t=0$ to one-box, CDT would say: "At $t=0$, I vow to one-box. But now at $t=1$, the money is already there. My vow can't change the past. I should break the vow and two-box."

  For the "planning ahead" strategy to work, you need a mechanism that **forces** you to stick to the plan.
  *   **Pre-commitment:** You hire a hitman to kill you if you two-box. (This works, but requires external tools).
  *   **UDT:** You realize that your decision *is* the cause of the prediction, logically. You don't need a hitman. You simply recognize that "The agent who two-boxes" and "The agent the Predictor predicted would two-box" are the same logical entity.

  UDT isn't just "planning ahead"; it is **recognizing logical control**. It realizes that your decision algorithm is the same mathematical object that the Predictor ran in the simulation. Therefore, changing your decision *now* (in the counterfactual sense) implies changing the prediction *then*.

  ### 4. The Core Shift: Counterfactuals over Logic, not Physics
  This is the wall you are hitting. You are likely visualizing counterfactuals physically.

  *   **Physical Counterfactual (CDT):** "I magically change my action to One-Box, but the physical history of the universe (including the Predictor's brain state) remains exactly as it was." -> Box is empty, you get $0.
  *   **Logical Counterfactual (UDT):** "I change my decision *algorithm*. Because the Predictor simulated that algorithm, the Predictor's output also changes." -> Box is full, you get $1M.

  UDT treats you not as a physical agent moving through time, but as a **mathematical function** that is evaluated in multiple places (in your brain now, and in the Predictor's simulation earlier).

  ### 5. Why not just use Evidential Decision Theory (EDT)?
  You might ask: "EDT also one-boxes in Newcomb's. Why do we need UDT?"

  EDT conditions on the *evidence* your action provides. "If I one-box, that is evidence the box is full."
  However, EDT fails in cases like the **Smoking Lesion Problem**.
  *   *Scenario:* A gene causes both cancer and a desire to smoke. Smoking doesn't cause cancer.
  *   *EDT:* "If I smoke, it's evidence I have the gene, so I'll get cancer. I shouldn't smoke." (Wrong recommendation).
  *   *CDT:* "Smoking doesn't cause cancer. I should smoke." (Right recommendation).
  *   *UDT:* "My policy is to smoke if I want to. The gene is fixed regardless of my policy. I should smoke." (Right recommendation).

  UDT gets Newcomb right (like EDT) *and* Smoking Lesion right (like CDT). It does this by distinguishing between **logical correlation** (your decision and the simulation) and **spurious correlation** (your decision and the gene).

  ### Summary: The "Aha!" Moment
  The reason UDT gives a different recommendation than "maximizing EU at the decision point" is that **standard decision theory assumes your decision cannot affect the past.**

  UDT rejects this assumption in cases where the past event (the prediction) was causally/dependently derived from a simulation of your decision process.
  *   **Standard EU:** "The past is fixed. I maximize utility given the fixed past."
  *   **UDT:** "The past prediction was a function of my algorithm. I maximize utility by selecting the algorithm that yields the best output from that function."

  It is not about a longer time horizon; it is about a wider **scope of control**. You control the prediction logically, even if you cannot control it physically. UDT is simply the math of agents who realize they are running source code that can be read by others.
