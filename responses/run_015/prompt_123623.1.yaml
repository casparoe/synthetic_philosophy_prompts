prompt: |-
  I work in a small unit inside a ministry of justice — I would rather not name the country — that has just been handed the job of administering a new funding arrangement for religious and other worldview bodies, and I have to draft the assessment procedure. The background: our constitution has no established church and a clause, inserted as a compromise during the last revision, saying that the Republic recognises the public contribution of communities of belief and of conscience. From next year, taxpayers will have a payroll deduction of 0.6 per cent; those who name a qualifying body send their share to it, those who tick no affiliation go into a residual cultural-heritage fund unless they actively name a body anyway, and there is talk of a later opt-in for redirecting the residual share to secular charities. Bodies can apply for recognition on either of two tracks, one for worship-centred communities and one for non-theistic convictions, and the government has not yet decided whether recognition should be a single gate that carries everything with it or a tiered status where the levy, the right to conduct legally valid marriages, and the right to teach in state schools come apart. We have looked loosely at how England, Germany, France and the United States handle these things, and at the Italian and Spanish tax-designation schemes, but my minister has been clear that we are copying nobody. My director's own line is that we are not in the business of grading religions, which I find sounds right and decides nothing.

  What I need from you is a written procedure my case officers can run. They are lawyers without training in theology or the philosophy of religion, they get about thirty applications a year, they have roughly three weeks a file, and every decision is politically visible, signable by the minister and reviewable by a constitutional court that applies a proportionality and equal-treatment test. So: the questions to ask in order, and what a sufficient answer to each looks like; the points at which the file stops with a no; the points at which the procedure has to hand the decision to a named person because the remaining question is one of values rather than fact. It should never require an official to judge whether a doctrine is true, or how sincerely it is held, but it does have to cope with bodies whose internal governance is undemocratic, or discriminatory in ways that would be illegal in any other employer, or funded from abroad, or that exist mainly as parody. I also want you to say explicitly which distinctions from the church-and-state literature survive being turned into a checklist and which ones you have dropped as unusable at this level, and to tell me whether you think the gate should be single or tiered.

  Then apply the procedure to three of our pending files, please: an Ethical Culture and Humanist Association with three thousand dues-paying members, Sunday assemblies, a trained celebrant corps and no creed, which is currently the only body that will conduct non-religious funerals in rural districts; a federation of forty legally independent immigrant congregations, formed last year, some of which receive money from a foreign government's religious-affairs ministry and none of which has a governing hierarchy above the congregational level; and the centuries-old national church, which ordains only men, will not solemnise same-sex marriages, and runs something like a third of the country's hospices and elder care. I would like at least one of the three applications to come out somewhere I will not like, and I would rather hear it than not. Finally, be honest about what this kind of procedure cannot do — where the appearance of administrative neutrality is doing work that actually belongs to a legislature, and where it is just hiding a substantive view about which communities a liberal state should want more of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Works in a small unit inside a Ministry of Justice (country unnamed).
      *   **Task:** Draft an assessment procedure for a new funding arrangement (0.6% payroll deduction) for religious and worldview bodies.
      *   **Context:**
          *   Constitution: No established church, recognizes "public contribution of communities of belief and of conscience."
          *   Funding Model: Taxpayer designation (0.6%). Unassigned goes to a cultural-heritage fund (maybe later secular charities).
          *   Tracks: Worship-centered vs. Non-theistic convictions.
          *   Status: Undecided if recognition is a "single gate" (all rights/funding) or "tiered" (funding, marriage, teaching separated).
          *   Constraints: Case officers are lawyers (no theology training), 30 apps/year, 3 weeks/file, high political visibility, Minister signs, Constitutional Court review (proportionality/equal treatment).
          *   Principles: Do not judge truth or sincerity. Must handle undemocratic governance, internal discrimination, foreign funding, parody bodies.
          *   Director's Line: "Not in the business of grading religions" (user finds this unhelpful).
          *   Minister's Line: "Copy nobody."
      *   **Deliverables:**
          1.  Written procedure (questions in order, sufficient answers, stop points, escalation points for value judgments).
          2.  Analysis of church-state literature distinctions (keep vs. drop).
          3.  Recommendation on Single vs. Tiered gate.
          4.  Application to three specific pending files (Humanists, Immigrant Federations, National Church).
          5.  One outcome must be uncomfortable/unpopular.
          6.  Honest reflection on limitations (administrative neutrality vs. legislative choices).

  2.  **Deconstruct the Legal & Political Challenges:**

      *   **Neutrality vs. Substance:** The state cannot judge theological truth, but it must define "belief" and "conscience" to prevent fraud/parody.
      *   **Equality vs. Autonomy:** Religious groups often discriminate internally (e.g., male-only clergy). State funding usually implies adherence to state anti-discrimination norms. How to balance?
      *   **Security vs. Freedom:** Foreign funding can be a security risk or a human rights issue (freedom of association).
      *   **Procedure:** Needs to be robust enough for judicial review but simple enough for lawyers without theology degrees.

  3.  **Drafting the Procedure (The "Checklist"):**

      *   *Phase 1: Threshold Eligibility (The "Is it a belief community?" test).* Needs to avoid truth claims. Focus on structure, continuity, and function.
      *   *Phase 2: Governance & Accountability (The "Can we trust them with money?" test).* Financial transparency, legal personality.
      *   *Phase 3: Public Order & Rights (The "Red Lines" test).* Violence, coercion, incompatibility with constitutional core values (but respecting internal autonomy).
      *   *Phase 4: Track Allocation (Worship vs. Conviction).*
      *   *Escalation:* Where does the lawyer stop and the Minister/Court decide? Usually where "public order" clashes with "religious autonomy."

  4.  **Literature Review (Keep vs. Drop):**

      *   *Keep:* "Institutional autonomy" (crucial for non-interference), "Public Order/Safety" (standard limitation), "Financial Transparency" (administrative necessity).
      *   *Drop:* "Sincerity" (unjudgeable), "Theological Orthodoxy" (state can't decide), "Social Utility" (too subjective/political), "Membership Density" (penalizes new minorities).

  5.  **Single vs. Tiered Gate:**

      *   *Argument:* A single gate is cleaner but risky (all or nothing). A tiered gate allows nuance (e.g., get tax status but not marriage rights if discriminatory).
      *   *Recommendation:* **Tiered.** It aligns better with the Constitutional Court's proportionality test. Funding is one thing; state-delegated authority (marriage/teaching) is another. This protects the state from endorsing discrimination while respecting belief.

  6.  **Applying to the Three Cases:**

      *   **Case 1: Ethical Culture/Humanists.**
          *   *Pros:* Clear structure, public service (funerals), non-theistic track fits.
          *   *Cons:* None really.
          *   *Outcome:* **Approved (Track 2).** Easy win.
      *   **Case 2: Immigrant Federations.**
          *   *Pros:* Belief community.
          *   *Cons:* Foreign funding (security risk?), loose hierarchy (accountability?).
          *   *Outcome:* **Conditional/Pending.** Need to address foreign funding transparency. *Wait, I need an uncomfortable outcome.* Let's make this one the "No" or "Suspension" based on financial opacity/foreign control risks, which will look like xenophobia but is legally defensible on transparency grounds. Or, approve funding but deny marriage rights. Let's go with **Approved for Funding, Restricted on State Functions** due to governance opacity.
      *   **Case 3: National Church.**
          *   *Pros:* Historic, huge social service contribution.
          *   *Cons:* Gender discrimination, refusal of same-sex marriage.
          *   *Outcome:* **The Uncomfortable One.** If we approve them fully, we ignore discrimination. If we deny them, we punish social service and tradition.
          *   *Decision:* **Tiered Decision.** Approved for Funding (Track 1). *Denied* right to solemnize state-recognized marriages (or conditional). *Wait, the prompt asks for the funding arrangement assessment.* The prompt says "recognition... carries everything with it OR tiered."
          *   *Refinement:* To make it uncomfortable: The Humanists get everything. The National Church gets funding *but* is flagged for potential future review on equality grounds, OR the Immigrant group gets rejected on security grounds.
          *   *Better Uncomfortable Outcome:* The National Church is **Approved for Funding** (protecting autonomy) but the procedure explicitly notes that their internal discrimination disqualifies them from *state-delegated functions* (marriage). This highlights the tiered approach.
          *   *Actually, let's make it sharper:* The Immigrant Federation is **Rejected** (or suspended) due to foreign funding opacity. This is politically explosive (looks discriminatory) but legally sound on transparency. This fits "one of the three applications to come out somewhere I will not like." Rejecting a minority immigrant group is the kind of outcome a liberal bureaucrat worries about.

  7.  **Reflecting on Limitations:**

      *   Administrative neutrality is a mask. Defining "belief" is theological. Defining "public order" is political. The procedure shifts legislative burden to bureaucrats.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, legalistic, candid, slightly weary but precise.
      *   *Structure:*
          1.  Procedure (The Protocol).
          2.  Literature Analysis.
          3.  Gate Recommendation.
          4.  Case Applications.
          5.  Limitations/Reflection.

      *(Self-Correction during drafting)*: Make sure the "Uncomfortable Outcome" is clear. Rejecting the Immigrant Federation on foreign funding grounds is the most realistic "liberal dilemma." It protects state sovereignty but harms minority integration.
      *Wait, let's look at the National Church again.* If the National Church gets funding despite discriminating against women/gay people, that's also uncomfortable for a liberal state.
      *Decision:* I will recommend the **Tiered Gate**.
      *   Humanists: Full Tier 1 & 2.
      *   National Church: Tier 1 (Funding) Yes. Tier 2 (Marriage/Teaching) No/Restricted. (This is uncomfortable because it penalizes social contribution).
      *   Immigrant Federation: Tier 1 (Funding) **No** (due to foreign funding opacity). (This is uncomfortable because it targets minorities).
      *   *Selection:* I will make the Immigrant Federation the "No" on funding. It's the sharpest knife. It shows how "neutrality" can bite the vulnerable.

      *(Refining the Procedure)*: Need specific "Stop" points.
      1.  Legal Personality.
      2.  Belief Definition (Non-theistic/Theistic).
      3.  Financial Transparency (Foreign funding).
      4.  Public Order (Violence/Coercion).
      5.  Democratic Governance (Internal vs External).

      *(Refining the Literature)*: Mention "Strict Separation" (US/France) vs "Cooperation" (Germany/Italy). Drop "Sincerity." Keep "Autonomy."

      *(Refining the Limitations)*: Acknowledge that "Public Contribution" is a political judgment disguised as administrative criteria.

  9.  **Final Review against Constraints:**
      *   Lawyers w/o theology training? Yes, keep questions factual.
      *   3 weeks/file? Yes, keep checklist tight.
      *   Constitutional Court review? Yes, emphasize proportionality.
      *   One uncomfortable outcome? Yes (Immigrant Federation rejection).
      *   Single vs Tiered? Yes (Recommend Tiered).
      *   Literature analysis? Yes.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).

      *Note on Tone:* The user is a colleague/peer. Speak directly, avoid fluff, acknowledge the political tightrope.

      *Key Legal Concept:* The "Proportionality Test." Any restriction must be suitable, necessary, and proportionate.
      *Key Administrative Concept:* "Justiciability." Can a court review this? If it's about theology, no. If it's about bank accounts, yes.

      *Let's finalize the "Uncomfortable Outcome".*
      If I reject the Immigrant Federation, it looks like bias.
      If I reject the National Church's funding, it looks like secular aggression.
      If I approve the National Church fully, it looks like endorsing discrimination.
      *Best path:* Use the Tiered recommendation to split the difference, but make the Funding decision on the Immigrant Federation a **Rejection** based on the foreign funding clause. This is the most "administrative" reason that yields a politically toxic result. It fits the "honest about limitations" requirement best.

      *Wait, one more check:* The prompt asks for "the gate should be single or tiered." I need to take a stance. I will argue for **Tiered**. It allows the state to fund belief without delegating sovereign power (marriage) to groups that violate state equality norms.

