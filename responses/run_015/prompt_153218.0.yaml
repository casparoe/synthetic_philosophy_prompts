      *   *Objection 6 (REI - Medium Damage):* Medical Benefit. "Education correlates with health outcomes. Isn't this medical?"
      *   *Objection 7 (Disability/Legal - Low Likelihood/High Damage):* Regulatory Future. "FDA/State will ban this anyway. Why lead the charge?"
      *   *Objection 8 (GC/REI - Low Likelihood):* Accuracy/Science. "The scores aren't accurate enough yet." (Maybe skip this as it's technical, not ethical, but the prompt asks for ethical committee prep. Let's stick to ethical/operational). Let's swap for the "Slippery Slope" from the Catholic or Legal.

