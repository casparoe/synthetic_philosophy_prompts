  HAC ties because it maps value solely to felt experience; since distress and peace are stipulated equal, utility is identical. The Buddhist divergence derives from the commitment that karma is intention (*cetana*), evaluating the causal root of volition rather than just the fruit. The feature doing the work is the moral quality of the volitional root (greed vs. non-greed). If barred from appealing to roots, the framework collapses into consequentialism, judging only by dukkha reduced. The brother-in-law will object that a greedy mind *is* a negative consequence, so equalization is impossible. If the mind-state feels identical, he claims the greed is inert. The reply is that greed can feel pleasant (satisfaction of desire); the framework distinguishes the *quality* of satisfaction (clinging) independent of its hedonic tone. Ethics tracks the shape of the mind, not just its temperature.

  The divergence holds because the framework evaluates the ethical quality of volition independently of its hedonic yield.

  \answer{A}
