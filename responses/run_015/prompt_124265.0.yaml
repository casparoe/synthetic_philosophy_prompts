  my brother says there's literally a theorem about this, by some guy named Good or whatever, that says finding things out can never make you worse off when the information is free, so wanting to know is always the rational move. But my information isn't free in like three different ways and I dont think his theorem is talking about any of them. So: tell me what the theorem actually says in the clean version of the situation he's imagining, then take my actual situation and say where it stops applying, which of my three problems break it and which don't, and whats left of his advice once you throw out what doesn't survive. I want something with numbers in it too, not just it depends: like how many hours of spring break should I be willing to give up to find out, and what would that number depend on, and how would I even compute it if I can't put a real probability on being nominated.

  two more things he said that I think are wrong. First, he said information is only worth anything if it could change what you do, and I think thats wrong because there are obviously cases where you'd do the same thing either way and you still really want to know. Is that just me being irrational, or is he missing something about what the info is for. Second: I can ask now, or I can wait three weeks and find out for sure when the nominations get posted, but by then the application is already two weeks late. He says that just means information has an expiration date. I think it means something more interesting, like the value isn't in the information at all, it's in the information together with what you can still do with it, and asking now is sort of deliberately buying a worse version of the same thing early. Whos closer to right, and is there any precise way to say that?

  and please dont use headings or bullets or bold or tables, just write it out like one long email, its way easier to read on my phone.
