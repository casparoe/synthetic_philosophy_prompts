answer: |-
  Here's the pedagogical architecture. Since you've got a game dev in the mix, we're going to speak their language exclusively. No "homunculus" talk until we need to kill it. We're debugging the brain.

  ### 1. The Dependency Chain (Conceptual Scaffolding)
  You can't drop "Multiple Drafts" immediately. Their render-pipeline intuition is too sturdy. You need to collapse the pipeline step-by-step.

  1.  **Latency is Real:** Establish that neural processing isn't instant. Different sensors (color, motion, sound) have different ping times.
      *   *Why:* If processing takes time, the "now" you experience can't be the actual "now."
  2.  **The Post-Production Edit:** Show that the brain backdates events to make them feel simultaneous (like lag compensation in shooters).
      *   *Why:* This breaks the idea that consciousness is a live feed. It's a reconstructed replay.
  3.  **No Main Thread:** Explain that there is no single clock cycle or `main()` function coordinating these edits.
      *   *Why:* This kills the "Central Server" idea.
  4.  **No User:** Finally, remove the player. The game runs itself.
      *   *Why:* This is the Dennett punchline. No one is watching the frame buffer.

  ### 2. The Single Carrying Example: "The Headless Render Farm"
  This example hijacks their engine intuition.

  *   **The Setup:** Ask them to imagine a game engine where 50 different scripts are trying to render textures to the same screen space, but **there is no monitor** and **no `present()` function** that swaps the back buffer to the front.
  *   **What it MUST Have:**
      *   **Parallel Processes:** Multiple scripts editing the same memory space simultaneously (like color processing vs. motion processing).
      *   **Conflict Resolution:** When Script A says "Red" and Script B says "Blue," a third script overwrites it based on which one is more "influential" (fame in the brain) at that millisecond.
      *   **No Final Output:** The "image" is just the current state of the memory conflicts. There is no final frame sent to a user.
  *   **What it MUST Lack:**
      *   **A Master Clock:** No global `Time.deltaTime` syncing everything.
      *   **A Viewer:** No camera component looking at the scene. The scene *is* the data.
  *   **The Hook:** Tell them: *"Your brain isn't a GPU rendering to a screen. It's a headless server farm where the 'output' is just the pattern of traffic between the nodes."*

  ### 3. The Misconception Map (Order of Emergence & Blocking)
  Teens (and humans generally) will defend the Cartesian Theater instinctively. Here's the order they'll panic, and where you intercept.

  *   **Misconception 1: "The Infinite Regress" (The Homunculus)**
      *   *When:* Immediately after you say "No one is watching the screen."
      *   *They'll say:* "But *I* see the screen. If there's no viewer, who is experiencing the game?"
      *   *Block Point:* **Right after Step 1 (Latency).**
      *   *The Block:* Don't argue philosophy. Ask: "If there's a little guy in your head watching the screen, does he have a screen in *his* head? Who watches that?" Make them see the recursion error. The "I" is the game running, not the player.
  *   **Misconception 2: "The Zombie Worry"**
      *   *When:* After you explain the "Headless Render Farm."
      *   *They'll say:* "So you're saying I'm just code? That my feelings aren't real?"
      *   *Block Point:* **During Step 3 (No Main Thread).**
      *   *The Block:* Clarify that the *processing* is real. The pain is real code executing. It's just not being "viewed" by a separate entity. The execution *is* the feeling.
  *   **Misconception 3: "The Unity Illusion"**
      *   *When:* At the very end.
      *   *They'll say:* "But everything feels unified. I don't feel like 50 scripts. I feel like one thing."
      *   *Block Point:* **During the Check for Understanding.**
      *   *The Block:* Remind them of UI trickery. Games feel unified because the HUD hides the loading streams. Consciousness feels unified because the "drafts" that lose the competition are deleted before you can report them.

  ### 4. Check for Understanding (The "Debug" Test)
  Don't ask them to define the terms. That's just memorization. Make them apply the architecture.

  **The Scenario:**
  *"Design a thought experiment where a person says they saw the flash before they heard the bang, but physics says the light and sound arrived at the same time. Using the 'Headless Render Farm' model, explain what happened in the code without using the word 'viewer' or 'self'."*

  **What to look for:**
  *   **Fail:** They say "The brain processed the light faster." (This is just latency, not Multiple Drafts).
  *   **Fail:** They say "The user perceived it differently." (Brings back the Homunculus).
  *   **Pass:** They describe competing drafts. *"The 'sound' draft arrived later, but the 'flash' draft won the competition for memory access first, so the narrative log was written with the flash first. There was no central clock to correct the timestamp."*

  If they talk about **narrative construction** or **competing data streams** rather than **perception**, they got it.

  ### 5. What to Leave Out (The Exclusion Strategy)
  Dennett writes *a lot*. Most of it is too heavy for a single session.

  *   **Leave Out: Qualia (The "Hard Problem").**
      *   *Why:* It's a black hole. If you start discussing "why red feels like red," you'll lose the architectural point. Dennett says qualia are illusory judgments; that's a second session. Stick to the *structure* of consciousness, not the *texture*.
  *   **Leave Out: The Orwellian vs. Stalinesque Distinction.**
      *   *Why:* This is Dennett's specific distinction about whether the brain lies to us (Orwellian) or fabricates the experience earlier (Stalinesque). It's too nuanced. Just tell them: "It's all fabrication, so the distinction doesn't matter."
  *   **Leave Out: Evolutionary Justifications.**
      *   *Why:* Why consciousness evolved is interesting, but it distracts from *how* it works structurally. Keep it on the engine architecture, not the dev log history.

  **Quick Note on Typos:**
  Don't worry about the typos in your prep notes. If the teens spot them, joke that it's a feature of the "Multiple Drafts" model—your brain edited the text after you typed it. Keeps it light.

  Good luck. Kill the theater.
