      *Re-evaluating the Example:* The Simulation (b) is strong, but the Celebrity (a) is better for the "Aggregable" misconception (10k fans vs 1 peer). Actually, the Simulation is better for the "LLM/Recognizer" issue they had last time. Let's stick with Simulation but tweak it to ensure the "independence" criterion is clear.
      *Actually, let's look closer at (a) Celebrity.* It perfectly illustrates the Lord position. The Celebrity is the Lord. The Fans are the Bondsment (in a loose sense). But fans are independent.
