answer: |-
  ### The Protocol of Separated Acts

  You are right: inconsistency arises when you solve for *memory* generally rather than for *retention*, *access*, and *marking* specifically. The following procedure forces those separations. It does not solve the philosophical dispute between Memory as Duty and Memory as Harm. It creates a container where that dispute must be articulated before a decision is made, preventing "mood" from masquerading as principle.

  **Constraints & Roles:**
  *   **Legal Office:** Determines statutory compliance only (Step 1).
  *   **Junior Archivists:** Gather facts and stakeholder positions (Step 2).
  *   **You (Head of Unit):** The Value Arbiter. You make the final call on ethics, but you must document the trade-off using the matrix in Step 4.
  *   **Director:** Signs off. Your documentation protects them from press embarrassment by showing due diligence.

  ---

  #### Step 1: The Statutory Floor (Legal Office)
  **Question:** Does the proposed action (or inaction) violate existing statute, donor contract, or court order?
  *   **Sufficient Answer:** A written memo from Legal citing specific statutes.
  *   **Stop Condition:** **YES.** If the law mandates destruction, you destroy. If the law mandates openness, you open. The case closes.
  *   **Value Handoff:** None. This is compliance.

  #### Step 2: The Digitization Lock (You + Juniors)
  **Question:** Is there a compelling operational or preservation need to digitize this material *now*?
  *   **Sufficient Answer:** A statement of need (e.g., "paper is disintegrating," "remote access required for court").
  *   **Stop Condition:** **NO.** If the answer is "convenience" or "modernization," the default is **No Digitization.**
  *   **Why:** As you noted, digitization moves material from *Keep-and-Bury* to *Keep-and-Index*. It is irreversible.
  *   **Value Handoff:** **You.** You must sign off on the irreversibility. If you digitize, you must justify why the risk of future leakage is outweighed by current preservation needs.

  #### Step 3: The Three-Track Analysis (Juniors)
  Your juniors must draft a **Stakeholder Impact Memo** addressing the three acts separately. They cannot recommend; they must report.
  1.  **Retention:** If we do not keep this, who loses the ability to verify the past? (Public interest) vs. Who suffers by us keeping it? (Subject interest).
  2.  **Access:** If we open this, who is harmed? (Living subjects, ongoing justice) vs. Who is helped? (Researchers, victims).
  3.  **Marking:** If we exhibit/cite this, does it legitimize a narrative? Does it re-traumatize?

  *   **Sufficient Answer:** A list of specific, named stakeholders (e.g., "The Grandchildren," "The Prosecution Team," "The Donor Family") and their stated positions.
  *   **Value Handoff:** **The Stakeholders.** The Juniors must attempt to contact the living subjects or their representatives. If they refuse to speak, that refusal is data.

  #### Step 4: The Harm/Benefit Matrix (You)
  You must fill out this matrix. You cannot proceed to recommendation without checking one box in each column. This forces you to admit where you are prioritizing duty over harm, or vice versa.

  | Track | Option A: Duty to Memory | Option B: Duty to Living/Harm Reduction | **Decision** |
  | :--- | :--- | :--- | :--- |
  | **Retain** | Keep indefinitely (Evidence for future) | Deaccession/Destroy (Prevent future harm) | [ ] |
  | **Access** | Open (Transparency) | Restricted/Sealed (Privacy/Safety) | [ ] |
  | **Mark** | Publicize (Truth-telling) | Silence (No monument to pain) | [ ] |

  *   **Stop Condition:** If you select **Option B (Destroy)** but Step 1 (Legal) says the record is state property, the case returns to Step 1 for a waiver request. If denied, you must default to **Retain: Keep.**
  *   **Value Handoff:** **You.** This is where your mood usually enters. The procedure requires you to write a 200-word "Justification of Priority" explaining why you chose Column A or B for each track. This text goes to the Director.

  #### Step 5: The Press Risk Assessment (You)
  **Question:** If this decision leaks tomorrow, what is the headline?
  *   **Sufficient Answer:** A draft headline (e.g., "Archive Hides Informers" vs. "Archive Exposes Grandchildren").
  *   **Stop Condition:** If the headline implies illegal activity or gross negligence, revise Step 4.
  *   **Value Handoff:** **Director.** You show them the headline. They can veto only on this ground, not on ethical grounds.

  ---

  ### Application to Cases

  Here is how the procedure runs on your three specific scenarios.

  #### Case 1: State Security Files (Active Prosecutions)
  *   **Step 1 (Legal):** Court is using them as evidence. **Stop Condition:** Access cannot be open to public. Retention is mandated.
  *   **Step 2 (Digitization):** Need? Court needs access, but physical transfer suffices. Digitization increases leak risk. **Decision:** No Digitization.
  *   **Step 3 (Tracks):**
      *   *Retain:* Public interest high (history), Subject interest low (informers are dead/protected).
      *   *Access:* Public harm high (vigilantism against grandchildren), Public benefit low (ongoing justice compromised by publicity).
      *   *Mark:* High harm. No exhibition.
  *   **Step 4 (Matrix):** Retain (Duty) / Access (Harm Reduction-Sealed) / Mark (Harm Reduction-Silent).
  *   **Step 5 (Press):** Headline: "Archive Withholds Names of Informers."
  *   **Recommendation:** Retain permanently. Access restricted to Court Order only. No digitization. No public marking.

  #### Case 2: Government Amnesty/Seal Deal
  *   **Step 1 (Legal):** Government offers conditional donation. Legal says conditions are permissible contractually.
  *   **Step 2 (Digitization):** Government wants them sealed. Digitization creates a backdoor. **Decision:** No Digitization.
  *   **Step 3 (Tracks):**
      *   *Retain:* Public interest high (official history), but condition undermines trust.
      *   *Access:* Sealed for 50 years. Harm to truth-seeking is high.
      *   *Mark:* Funded history is a form of Marking, but controlled.
  *   **Step 4 (Matrix):** Retain (Duty) / Access (Harm Reduction-Sealed) / Mark (Duty-Conditional).
  *   **Step 5 (Press):** Headline: "Archive Sells Truth for Funding."
  *   **Recommendation:** **Reject Acquisition.** (See *Instinct Overrules* below). The procedure flags that "Retain" under these conditions violates the institution's core mandate, even if legal. You recommend declining the collection unless the seal is reduced to 20 years.

  #### Case 3: Family Destruction Request
  *   **Step 1 (Legal):** File is state property (created by government agency), not private papers. Family has no legal right to demand destruction. **Stop Condition:** Cannot Destroy.
  *   **Step 2 (Digitization):** No need. **Decision:** No Digitization.
  *   **Step 3 (Tracks):**
      *   *Retain:* Mandated by law.
      *   *Access:* Family argues sealed file is a monument. Open file is harassment.
      *   *Mark:* No marking.
  *   **Step 4 (Matrix):** Retain (Duty-Legal) / Access (Harm Reduction-Sealed) / Mark (Harm Reduction-Silent).
  *   **Step 5 (Press):** Headline: "Archive Torments Grieving Family."
  *   **Recommendation:** Retain (Legal mandate). Access: Sealed for 99 years (effectively permanent for living kin). Mark: None. Offer family a letter confirming the file will not be accessed in their lifetimes.

  ---

  ### Instinct Overrules

  Here is where this procedure will fight your mood.

  1.  **Case 1 (The Informers):** Your instinct may be to **Mark** (Duty to Truth) or to **Destroy** (Harm Reduction). The procedure overrules **Destroy** immediately via Step 1 (Legal). It likely overrules **Mark** via Step 4 (Harm to living grandchildren outweighs abstract duty). It forces you to accept the uncomfortable middle: keeping the poison but locking the cabinet.
  2.  **Case 2 (The Amnesty):** Your instinct might be to **Accept** (Memory as Duty: better to have the files sealed than lost). The procedure overrules this in Step 4/5. By forcing you to write the Press Headline and the Justification of Priority, it highlights that accepting a 50-year seal compromises the *Retain* function's integrity. It pushes you to reject the gift, which is riskier for the Director but consistent with institutional mission.
  3.  **Case 3 (The Family):** Your instinct might be to **Seal** (compromise). The family wants **Destroy**. The procedure overrules **Destroy** via Step 1 (Legal). However, it validates your instinct to **Seal** by categorizing it as Harm Reduction. It forces you to explain to the family *why* you can't destroy, shifting the blame to Statute, which may preserve the relationship better than a moral argument.

  ### Where The Procedure Misfires

  1.  **The "Law is the Weapon" Scenario:** Step 1 assumes the Law is neutral. In a transitioning democracy or a contested state, the Law may mandate the erasure of atrocities (e.g., an amnesty law that requires destruction, not just sealing). If Step 1 says "Destroy," and you believe Memory is Duty, this procedure forces you to comply. It has no mechanism for civil disobedience or "archival rescue."
  2.  **Staff Safety:** The procedure assumes the Juniors can contact stakeholders (Step 3). If the material concerns active criminal networks, contacting the "grandchildren of informers" puts your staff at risk. The procedure needs a "Safety Valve" where Step 3 is skipped if physical safety is threatened.
  3.  **The "Slow Leak":** Step 2 (Digitization Lock) assumes you control the scanner. It does not account for researchers photographing documents with phones, or leaks from the Legal Office. It treats "Access" as binary, when in reality, information flows like water.

  ### Judgment Dressed Up as Procedure

  I must be explicit about where I have hidden my own values in this design, masquerading as neutral steps.

  1.  **Step 2 (The Digitization Lock):** I have biased this procedure toward **analog retention.** By making digitization the "hard case" requiring justification, I am prioritizing *security* over *access*. In a modern context, one could argue that *not* digitizing is the ethical failure (limiting access to the privileged who can travel). I have coded "caution" as "procedure."
  2.  **Step 4 (The Matrix):** The headers "Duty to Memory" vs. "Duty to Living" imply these are the only two poles. This excludes a third pole: **Duty to Truth.** Sometimes the truth harms the living *and* serves memory, but is still required. The matrix forces a binary choice that might obscure a nuanced "Open with Context" option.
  3.  **Step 5 (Press Risk):** I have institutionalized **fear.** By making the Director's embarrassment a formal gate, I am acknowledging that the archive is a political creature, not a temple. This is realistic, but it codifies cowardice as risk management. If the right decision is always the one that survives the headline test, you will never lead, only manage.

  This procedure will not make you right. It will make you consistent. It will ensure that when you are wrong, you are wrong for a reason you can articulate, rather than because it was a Tuesday and you were tired.
