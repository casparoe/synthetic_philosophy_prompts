prompt: |-
  I run the collections and access unit at a national memory institution — a state archive with a public museum attached — and roughly twice a month I have to draft a recommendation on a contested holding for the director to sign. The cases come in four shapes, and I have come to think they are not four shapes of one thing: whether to accept custody of a collection that a community or a family offers us; whether material we already hold should be open, restricted, sealed for a term, or handed back to the people it is about; whether to digitise and publish; and whether to mark something publicly, with an exhibition, a plaque, an annual reading. I have a week per case, two junior archivists to do the legwork, no budget of my own, a legal office that will tell me what the statute requires and nothing about what is right, and a director who signs whatever I put in front of her and will be embarrassed in the press if I get it wrong. What I do not have is any way of knowing whether the answers I have been giving are consistent with one another, and the cases have lately come close enough together that I can see I have been deciding them by mood.

  The two poles of the literature on this I can state and cannot reconcile. On one side, memory is a duty, owed to people who can no longer speak for themselves and owed first of all within thick relations — one's own family, town, nation — so that erasure is a second killing and a tidy archive is a lie told on behalf of the comfortable; on the other, the keeping of grievance is itself a harm, commemoration is nearly always a project of the living dressed up as a debt to the dead, and a society can be better off not carrying its worst material forward, especially where the people named in it, or their children, still live in the same street. I do not want you to settle that dispute. I want a procedure that can be run while it stays unsettled. Two things I have noticed on my own, because they are where my practice actually goes wrong, and the procedure has to accommodate them. First, remembering is three separable acts — retaining, allowing access, and publicly marking — and a decision to seal is not a decision to destroy, and neither is a decision not to commemorate; most of my inconsistency comes from collapsing the three. Second, in a paper archive the live options are not keep-or-destroy but keep-and-index, keep-and-bury, and keep-and-tell-the-people-named; digitisation moves everything from the second to the first, and a document that has been scanned cannot be un-remembered by any later decision, which makes the decision whether to digitise the one with no way back.

  Please write the procedure: the questions in order, what counts as a sufficient answer to each, which answers stop the case with a no, and which questions have to be handed to a person because they turn on values rather than facts — and, where that happens, who that person should be, given my setup. Then run it end to end on three cases and tell me plainly which of my instincts it overrules: a state security file naming dozens of low-level informers whose grandchildren still live in the towns they informed on, which a court is still using as evidence in prosecutions; a government that will pass an amnesty and fund an official history only if we agree to seal the relevant holdings for fifty years; and a family that asks us to destroy their mother's file rather than seal it, on the ground that a sealed file is a monument and destruction is the only mercy. Say where the procedure will misfire — I assume a rule that is right for a settled democracy's archive will be wrong for an institution whose holdings are still being used as evidence, or whose own staff are named in them — and be explicit about which of your steps are judgment dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Head of Collections and Access at a national memory institution (state archive + public museum).
      *   **Task:** Draft recommendations for the Director on contested holdings (4 types: acquisition, access/restriction/repatriation, digitization/publication, public marking/commemoration).
      *   **Constraints:** 1 week per case, 2 junior archivists, no budget, legal office (statutory compliance only), Director (signs anything but fears bad press), inconsistent decision-making (mood-based).
      *   **Core Conflict:** Two irreconcilable philosophical poles (Memory as Duty vs. Memory as Harm). The user does *not* want this settled, but wants a procedure that works *despite* the unsettled nature.
      *   **User's Insights:**
          1.  Remembering = 3 acts (Retain, Access, Mark). Don't collapse them.
          2.  Digitization is irreversible (moves from "bury" to "index").
      *   **Deliverables:**
          1.  A step-by-step procedure (questions, sufficient answers, stop conditions, value-judgment handoffs).
          2.  Application of the procedure to three specific cases (Security files/active prosecutions, Amnesty/Seal deal, Family destruction request).
          3.  Analysis of where the procedure overrules instincts.
          4.  Analysis of where the procedure misfires (contextual limitations).
          5.  Explicit identification of "judgment dressed up as procedure."

  2.  **Deconstruct the Procedure Design:**
      *   *Goal:* Consistency without philosophical resolution.
      *   *Structure:* Needs to follow the user's insight about the three acts (Retain, Access, Mark) + the Digitization pivot.
      *   *Gatekeeping:* Needs to filter out cases that are legally non-starters vs. ethical dilemmas.
      *   *Value Judgments:* Since the Director fears press embarrassment and Legal only cares about statutes, *who* decides the values? The User (Head of Unit) is the bottleneck. The procedure needs to force the User to articulate the value, perhaps consulting a specific external or internal body if possible, but given the constraints (no budget, 1 week), it likely has to be the User, but structured to prevent "mood." Let's introduce a "Stakeholder Impact Statement" handled by the juniors to ground the values in facts.
      *   *Digitization:* Needs a specific early gate because it's irreversible.
      *   *The "No" Stops:* Legal prohibition, physical impossibility, resource impossibility (though user says no budget, staff time is a resource).

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Phase 1: Triage & Legality.* (Legal Office's domain). If illegal, stop.
      *   *Phase 2: The Digitization Gate.* (Crucial based on user prompt). If digitizing, the bar is higher.
      *   *Phase 3: The Three Acts (Retain, Access, Mark).* Treat them separately.
      *   *Phase 4: The Value Check.* Who decides? Since the Director signs but fears press, and Legal is dry, the *User* must own the value judgment but must document the *harm/benefit* analysis to protect the Director.
      *   *Refinement:* The user asked "who that person should be." Given the constraints, it can't be a new committee. It has to be the User, but the *input* must come from the Juniors (fact-finding) and potentially the "Community of Concern" (the people named).
      *   *Stop Conditions:* Legal bar, Immediate Harm (life/safety), Resource exhaustion.

  4.  **Running the Cases:**

      *   *Case 1: State Security Files (Active Prosecutions).*
          *   Retain: Yes (Evidence).
          *   Access: Restricted (Court only).
          *   Digitize: No (Risk of leak/irreversibility).
          *   Mark: No (Active justice).
          *   *Instinct Check:* User might want to hide it (mood) or expose it (duty). Procedure forces "Evidence First."

      *   *Case 2: Government Amnesty/Seal Deal.*
          *   Retain: Yes.
          *   Access: Sealed (Deal).
          *   Digitize: No (Undermines seal).
          *   Mark: No (Contradicts seal).
          *   *Instinct Check:* User might hate the deal (Memory as Duty). Procedure forces acceptance of the "Political Reality" if legal. *Wait, does it?* The procedure needs to weigh "Institutional Independence" vs. "Acquisition." If the condition undermines the mission, is it a "No"? Let's make the procedure flag this as a "Mission Risk."

      *   *Case 3: Family Destruction Request.*
          *   Retain: No (if legal to destroy).
          *   Access: N/A.
          *   Digitize: No.
          *   Mark: No.
          *   *Instinct Check:* User might think "Sealed is mercy." Family says "Destruction is mercy." Procedure must prioritize the *Subject's* agency if alive/next-of-kin, over the Archive's desire to keep.

  5.  **Identifying Misfires & "Judgment as Procedure":**
      *   *Misfires:* Active conflict zones, staff safety, totalitarian contexts where "law" is weaponized.
      *   *Judgment as Procedure:* Defining "Harm," defining "Community," deciding when "Political Reality" overrides "Archival Integrity."

  6.  **Refining the Tone:**
      *   The user is intellectual, weary, precise, and cynical about "solutions." The tone should match: professional, direct, acknowledging the gray areas, not overly optimistic. Avoid buzzwords. Use their terminology (Retain, Access, Mark).

  7.  **Step-by-Step Construction of the Response:**

      *   **Introduction:** Acknowledge the burden. Validate the "three acts" insight.
      *   **The Procedure (The Protocol of Separated Acts):**
          *   Step 0: Legal/Statutory Floor (Legal Office).
          *   Step 1: The Digitization Lock (Yes/No).
          *   Step 2: The Three Tracks (Retain, Access, Mark).
          *   Step 3: The Harm/Benefit Weighing (The Value Judgment).
          *   *Who decides:* The User (Head of Unit), informed by Junior's "Impact Statement."
      *   **Case Studies:**
          *   Case 1 (Informers): Focus on the "Active Evidence" constraint.
          *   Case 2 (Amnesty): Focus on the "Conditionality" trap.
          *   Case 3 (Family): Focus on "Destruction vs. Sealing."
      *   **Instinct Overrules:** Explicitly state where the protocol fights the mood.
      *   **Misfires:** Where this breaks (e.g., if the Law *is* the injustice).
      *   **Judgment as Procedure:** Own the bias in the design.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I answer "who that person should be"?
      *   *Fix:* I need to be specific. It can't be a committee (no budget/time). It has to be the User, but the *data* comes from the Juniors contacting the stakeholders. I will designate the User as the "Value Arbiter" but require a "Stakeholder Impact Memo" from Juniors to prevent mood-based decisions.
      *   *Critique:* Did I address the Digitization irreversibility?
      *   *Fix:* Make Step 1 a hard gate. If Digitization is 'No', Access is automatically physical-only.
      *   *Critique:* The User mentioned the Director fears press embarrassment.
      *   *Fix:* The procedure must generate a "Press Risk Assessment" as part of the Value Check.

  9.  **Final Polish:** Ensure the distinction between Retain, Access, and Mark is rigid throughout the case studies. Ensure the "Judgment dressed as Procedure" section is honest. (e.g., Defining "Harm" is inherently judgment).

  *(Self-Correction on Case 2)*: If the government demands sealing for 50 years, does the archive accept? If the archive's mandate is truth, this might be a "No" on Acquisition/Retention. I need to make sure the procedure allows for rejecting a toxic gift.
  *(Self-Correction on Case 3)*: If the file is state property, can the family demand destruction? The procedure needs to check legal ownership first. I will assume for the case study that legal ownership allows discretion, otherwise it's a Step 0 stop.

  10. **Finalizing the Output Structure:**
      *   Preamble.
      *   The Procedure (5 Steps).
      *   The Three Cases (Applied).
      *   Instinct Overrules.
      *   Misfires & Limitations.
      *   The "Judgment as Procedure" Confession.

