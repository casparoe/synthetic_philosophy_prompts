answer: |-
  **MEMORANDUM**

  **TO:** The Grants Committee, Marchbank Foundation
  **FROM:** [Your Name]
  **DATE:** Thursday, October 24
  **SUBJECT:** Decision Recommendation: Kestrel Programme Renewal

  I recommend we renew the Kestrel Programme with conditions. This decision balances the programme's demonstrated capacity for novel prediction against the recent drift toward unfalsifiable claim-restatement.

  To reach this conclusion, we must classify the Kestrel record against our own three precedents rather than abstract philosophical definitions. The programme's first three years resemble our first precedent: a programme renewed despite a failed headline prediction because it produced confirmed predictions made before data existed and successfully validated an auxiliary hypothesis. Dr. Okoye's Year 1 prediction was novel and quantitative; the Year 2 null result was absorbed by a gating condition that was subsequently confirmed by an independent group in Year 3. This is the exact pattern of "absorbing punishment" we exist to support. However, the record from Year 4 onward increasingly resembles our second precedent: a programme declined because its central claim was restated to fit whatever data appeared. The Year 5 revision introducing a free parameter to absorb either sign, coupled with the Year 6 assertion that the mechanism is "whatever produces the observed pattern," mirrors the disqualifying restatements of that declined grant. While we do not penalize failure, we cannot fund a tautology. The Kestrel Programme is currently straddling the line between a resilient research programme (Precedent 1) and a protective belt of immunizing stratagems (Precedent 2). Renewal is warranted due to the strength of the early record, but conditions are required to prevent a slide into the second precedent.

  The conditions for renewal must be actionable for a working scientist and strictly prospective. We cannot apply the Auxiliary Register retroactively to Years 1–5; doing so would violate fairness since the instrument did not exist when the grant was awarded. Dr. Okoye could not have filed predictions for work already completed. However, renewal constitutes a new contract for Years 6 and 7, making prospective application not only fair but necessary to protect the Foundation's charter. Therefore, the following conditions apply to the renewal period:

  1.  **Core Claim Lock:** By Month 3 of Year 6, the PI must file a statement defining the mechanism that does not rely on post-hoc accommodation of existing data. This statement cannot be revised without triggering a review.
  2.  **Predictive Commitment:** The PI must submit two specific predictions for Year 7 data collection. These must include directional specifications that cannot be absorbed by free parameters.
  3.  **Hostile-Design Clause:** The PI must nominate one specific result set that would constitute refutation of the Core Claim. An external critic, agreed upon by the committee and the PI, must certify that the proposed methodology could actually produce this result.
  4.  **Decision Gate:** Funding for Year 7 is contingent on a review at the end of Year 6. If the Core Claim is revised to accommodate Year 6 data without a new testable consequence, funding will cease.

  These conditions operationalize the Auxiliary Register without punishing past flexibility. They ensure that while we allow the programme to fail, we do not allow it to redefine success after the fact.

  I must address the strongest argument against this recommendation, articulated by Professor Densmore. He argues that the exercise is incoherent because no scientific programme is ever abandoned on a single refutation. Historically, every celebrated success involved protecting a core claim with auxiliary hypotheses until the weight of evidence became untenable. From this view, the Auxiliary Register and the hostile-design clause are merely bureaucratic unfalsifiability tests wearing a lab coat; they impose a rigid logic on science that does not exist in practice. Densmore contends that by demanding a nominated refutation, we risk rejecting the next great theory because its proponent could not specify exactly how it would die in advance. He is correct that strict falsificationism is historically naive and that our precedents already acknowledge that failed predictions are not sufficient grounds for termination.

  However, Densmore's argument does not carry for this specific committee because it ignores the specific risk profile of the Marchbank Foundation. We are not funding normal science within a stable paradigm; we are funding high-risk work that conventional panels reject. Our charter commits us to funding "science," which requires a distinction between a theory absorbing punishment and a theory absorbing data. Precedent 2 established that we will decline programmes that restate claims to fit data, even if they have no failed predictions. The Kestrel Programme's Year 5 and 6 moves threaten to cross that line. Densmore is right that we should not demand immediate abandonment upon failure, but he is wrong that we cannot demand constraints on how failures are explained. The conditions I propose do not demand immediate falsification; they demand that the cost of revising the model be paid in advance via new tests. This accommodates Densmore's concern for scientific freedom while enforcing our precedent against moving goalposts. We are not asking Dr. Okoye to guarantee success; we are asking her to guarantee that failure remains meaningful.

  If we renew outright, we ignore the warning signs of Precedent 2 and risk funding a tautology for two more years. If we decline, we punish the genuine risk-taking of Years 1–3 and violate the spirit of Precedent 1. Renewal with conditions is the only path that honors both our history and our charter. It acknowledges that Dr. Okoye has earned the right to continue, but not the right to define the terms of continuation without constraint.

  Please review these conditions prior to Thursday's vote. If approved, I will draft the formal letter to Dr. Okoye incorporating the operative clauses outlined above.
