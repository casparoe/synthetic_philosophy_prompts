  # 1. The Space Before the Names

  **Axes of Classification**
  1.  **Phenomenology:** Is the sadness experienced as *painful* during the viewing? (Yes / Neutralized / Pleasurable)
  2.  **Valuation Structure:** Is the sadness a *means* to a separate end, or a *part* of the end itself? (Instrumental / Constitutive)
  3.  **Locus of Value:** Is the primary value located in the *world depicted*, the *form of presentation*, or the *viewer's internal state*? (Content / Form / Subjective)

  **Critique of a Spurious Axis:** *Fictionality* (Does it matter if the events are real?).
  *   **Verdict:** Spurious as a primary axis.
  *   **Reason:** Fictionality is usually a proxy for Phenomenology or Locus. If someone says "It matters," they usually mean "Real pain is unethical" (Locus: Content/Moral) or "Knowing it's fake stops the pain" (Phenomenology: Neutralized). Making it a top-level axis forces distinct mechanisms (e.g., The Spectator vs. The Moralist) into the same bin.
  *   **Cost:** Excluding it requires Probe (b) to do the work of distinguishing these views downstream.

  **Leaf Coordinates**
  Every leaf below is mapped as (Phenomenology, Structure, Locus).

  # 2. The Tree

  **Branch Nodes**
  1.  **Node 1:** When the lump comes to your throat, does it hurt? (Yes / No)
  2.  **Node 2:** (If Yes) Would you remove the sadness if you could keep the art intact? (Yes / No)
  3.  **Node 3:** (If Yes/Remove) Is the value primarily in the relief you feel after the credits? (Yes / No)
  4.  **Node 4:** (If Yes/Remove/No Relief) Is the value primarily in learning something true about the world? (Yes / No)
  5.  **Node 5:** (If Yes/Remove/No Relief/No Learn) Is the value in testing your own capacity for empathy? (Yes / No) *[Custom Leaf]*
  6.  **Node 6:** (If No/Keep) Is the sadness necessary because it fits the beauty of the whole? (Yes / No)
  7.  **Node 7:** (If No/Keep/No Fit) Is the value in feeling yourself capable of feeling? (Yes / No)
  8.  **Node 8:** (If No Pain) Is it because you know it isn't real? (Yes / No)

  **Leaves (9 Total)**

  1.  **The Pragmatist (Instrumentalist)**
      *   **Coords:** (Painful, Instrumental, Content)
      *   **Position:** Sadness is a tolerated cost for other artistic goods.
      *   **Awkward Commitment:** Admits the core experience is negative net utility during viewing.
      *   **Probes:** (a) No (no content); (b) Yes (truth matters more); (c) Less sadness preferred; (d) Yes (if insight gained).

  2.  **The Cathartic (Homeostatic)**
      *   **Coords:** (Painful, Instrumental, Subjective)
      *   **Position:** The good is a homeostatic release or settling after tension.
      *   **Awkward Commitment:** Values the aftermath more than the film itself.
      *   **Probes:** (a) Yes (music builds tension); (b) Yes (real pain works too); (c) More sadness = better release; (d) No (needs craft to build tension).

  3.  **The Gymnast (Moral Calibration)** *[Custom]*
      *   **Coords:** (Painful, Instrumental, Subjective)
      *   **Position:** Sadness is training for real-world moral responsiveness.
      *   **Awkward Commitment:** Would prefer a less moving film if it taught better moral lessons.
      *   **Probes:** (a) No; (b) Yes (real suffering is better training); (c) Moderate sadness optimal; (d) No (manipulation corrupts the lesson).

  4.  **The Holist (Organic Unity)**
      *   **Coords:** (Painful, Constitutive, Content/Form)
      *   **Position:** The unpleasant episode is a constituent of an overall valuable experience.
      *   **Awkward Commitment:** Cannot explain why a happy version of the same plot feels "wrong" without citing mystery.
      *   **Probes:** (a) No (no plot); (b) Yes (if formally identical); (c) The "right" ending only; (d) No (cheapness breaks unity).

  5.  **The Connoisseur (Formalist)**
      *   **Coords:** (Pleasurable, Constitutive, Form)
      *   **Position:** The same passion is turned into pleasure by the manner of its presentation.
      *   **Awkward Commitment:** Claims to enjoy the sadness *because* it is beautifully shot.
      *   **Probes:** (a) Yes (if well composed); (b) Yes (if well shot); (c) The more devastating, the more beautiful; (d) No (craft is the source of value).

  6.  **The Narcissist (Meta-Emotion)**
      *   **Coords:** (Pleasurable, Constitutive, Subjective)
      *   **Position:** What is enjoyed is one's own responding rather than what one responds to.
      *   **Awkward Commitment:** The characters' suffering is irrelevant backdrop for self-appreciation.
      *   **Probes:** (a) Yes; (b) Yes; (c) More sadness = more feeling capacity; (d) Yes (still moves me).

  7.  **The Truth-Seeker (Cognitive)**
      *   **Coords:** (Neutralized, Constitutive, Content)
      *   **Position:** The good is a piece of understanding the work affords, with the sadness as its vehicle.
      *   **Awkward Commitment:** The feeling itself is irrelevant; only the proposition matters.
      *   **Probes:** (a) No; (b) Yes (truth is truth); (c) Sadness must match truth; (d) No (lies afford no understanding).

  8.  **The Spectator (Aesthetic Distance)**
      *   **Coords:** (Neutralized, Constitutive, Form)
      *   **Position:** The unpleasantness is defused by distance or by the frame while the affect is actively savoured.
      *   **Awkward Commitment:** If convinced it was real, the experience would be ruined.
      *   **Probes:** (a) Yes; (b) No (enjoyment vanishes); (c) Devastation preferred (safe); (d) Yes (still safe).

  9.  **The Actor (Pretend Theory)**
      *   **Coords:** (Neutralized, Instrumental, Content)
      *   **Position:** The emotion is not really felt but only undergone in imagination.
      *   **Awkward Commitment:** Denies having any actual emotion during the film.
      *   **Probes:** (a) No (no character); (b) No (real pain is not imagined); (c) Irrelevant; (d) No (bad imagination).

  # 3. Four Probes (Verdicts Integrated Above)

  *See Section 2 Leaves for specific verdicts.*
  *   **(a) Instrumental Adagio:** Tests Locus (Form vs. Content).
  *   **(b) Nonfiction Suffering:** Tests Reality Constraint (Spectator/Actor vs. Others).
  *   **(c) Devastation vs. Bittersweet:** Tests Dose-Response (Cathartic/Holist vs. Pragmatist).
  *   **(d) Cheap/Manipulative:** Tests Quality Constraint (Formalist/Holist vs. Pragmatist/Cathartic).

  # 4. The Quiz

  **Instructions:** Choose the option that best fits your actual reaction, not how you think you should react.

  1.  **The Adagio:** A wordless cello piece makes you cry exactly like a sad movie. Why?
      *   A. It's just sound; I don't really cry, I just react. (Actor/Spectator)
      *   B. The beauty of the sound turns the pain into something rich. (Connoisseur)
      *   C. I feel the tension and release, regardless of meaning. (Cathartic/Narcissist)

  2.  **The Documentary:** You watch a real tragedy filmed exactly like a fiction movie. Does it change the value?
      *   A. Yes, knowing it's real makes it too heavy to enjoy. (Spectator)
      *   B. No, the truth makes it even more valuable. (Truth-Seeker/Pragmatist)
      *   C. Yes, now I feel guilty instead of moved. (Gymnast)

  3.  **The Ending:** Two versions of a film: one ends in total devastation, one in mild loss.
      *   A. I choose the devastation; it hits harder. (Cathartic/Connoisseur)
      *   B. I choose the mild loss; the pain is high enough. (Pragmatist)
      *   C. I choose whichever fits the story better. (Holist/Truth-Seeker)

  4.  **The Tearjerker:** A cheap, manipulative movie makes you cry. Is it worth it?
      *   A. Yes, a cry is a cry. (Cathartic/Narcissist)
      *   B. No, it feels like a trick. (Holist/Connoisseur)
      *   C. Yes, if I learned something despite the cheapness. (Pragmatist)

  5.  **The Rewatch:** Do you rewatch sad films more or less than happy ones?
      *   A. More; I want to feel that depth again. (Narcissist/Connoisseur)
      *   B. Less; once is enough to get the point. (Pragmatist/Truth-Seeker)
      *   C. Same; it depends on the craft. (Holist)

  6.  **The Aftermath:** How do you feel immediately after the credits?
      *   A. Drained, but clean. (Cathartic)
      *   B. Thoughtful, about the world. (Truth-Seeker)
      *   C. Proud that I was moved. (Narcissist)

  7.  **The Discussion:** What do you talk about post-film?
      *   A. How well it was made. (Connoisseur/Holist)
      *   B. What it says about life. (Truth-Seeker/Pragmatist)
      *   C. How it made me feel. (Narcissist/Cathartic)

  8.  **Real Pain:** How does film sadness compare to real sadness?
      *   A. Totally different; one is safe, one isn't. (Spectator)
      *   B. Same feeling, different cause. (Cathartic/Holist)
      *   C. Film sadness is practice for real sadness. (Gymnast)

  9.  **Character Fate:** Do you want the protagonist to suffer?
      *   A. Yes, if it makes the art better. (Holist/Connoisseur)
      *   B. No, but I accept it for the lesson. (Pragmatist/Truth-Seeker)
      *   C. I don't care about them, I care about the mood. (Narcissist/Formalist)

  10. **Recommendation:** Why tell a friend to see a sad film?
      *   A. To share the experience. (Holist/Narcissist)
      *   B. To warn them it's heavy. (Pragmatist)
      *   C. To show them something true. (Truth-Seeker)

  # 5. The Scoring Key

  **Algorithm:**
  1.  **Tally Scores:** Each option maps to 2 primary Leaves. (e.g., Q1A -> Actor, Spectator).
  2.  **Primary Sort:** Identify the Leaf with the highest tally.
  3.  **Tie-Breaking:**
      *   If **Cathartic** ties with **Narcissist**: Check Q6. "Drained" = Cathartic; "Proud" = Narcissist.
      *   If **Pragmatist** ties with **Truth-Seeker**: Check Q3. "Less pain" = Pragmatist; "Fit truth" = Truth-Seeker.
      *   If **Holist** ties with **Connoisseur**: Check Q4. "Trick" = Holist; "Craft" = Connoisseur.
  4.  **Inconsistent Patterns:** If scores are spread across 3+ leaves (e.g., Pragmatist, Cathartic, Narcissist), assign **Impure Profile**.

  **Impure Profiles:**
  1.  **The Stoic Hedonist (Pragmatist + Narcissist):** Claims sadness is a price (Q2B, Q4B) but rewatches for the feeling (Q5A). *Diagnosis:* Denies enjoyment intellectually but seeks it behaviorally.
  2.  **The Moral Aesthete (Gymnast + Connoisseur):** Wants empathy training (Q8C) but only if beautifully shot (Q4B). *Diagnosis:* Believes bad art corrupts moral lessons.
  3.  **The Reluctant Cathartic (Pragmatist + Cathartic):** Wants less sadness (Q3B) but values the release (Q6A). *Diagnosis:* Seeks relief but resents the tension required to get it.

  **Crowd/Empty Predictions:**
  *   **Crowded:** **The Holist** and **The Pragmatist**. Most people oscillate between "it was necessary for the story" and "it was hard to watch but worth it."
  *   **Empty:** **The Actor**. Few people will admit they felt *nothing* while crying. It is phenomenologically unstable.
  *   **Empty:** **The Narcissist** (Self-identified). People rarely admit the value is their own response rather than the film.

  # 6. Diagnostics

  **Unoccupied Cells:**
  *   **(Pleasurable, Instrumental, Content):** *Incoherent.* If the feeling is pleasurable and the value is in the content, why is it instrumental? It becomes Constitutive.
  *   **(Neutralized, Constitutive, Subjective):** *Unexplored.* A state where one feels nothing personally but values the internal state change constitutively. Hard to articulate without jargon.

  **Indistinguishable Leaves:**
  *   **The Holist vs. The Truth-Seeker:** Both view sadness as constitutive/vehicle. The tree separates them by "Beauty" vs. "Truth," but in practice, users conflate "True" with "Artistically Right."
  *   **Flag:** Node 6 (Necessary for beauty?) carries the least weight because "Beauty" is often used as a catch-all for "Value."

  **Discriminating Power:**
  *   **Most Discriminating:** Node 1 (Is it painful?). This splits the space into Phenomenological Realists vs. Neutralizers immediately.
  *   **Least Discriminating:** Node 5 (Empathy test). Often conflated with Pragmatist (Learning) views.

  **Background Assumption:**
  *   **Assumption:** Respondents can accurately introspect their affective state *during* the viewing.
  *   **Falsification:** If post-viewing reports (Quiz) systematically contradict physiological measures (e.g., cortisol levels) during screening, the Phenomenology axis collapses.

  # 7. House Rules

  *   **No Bibliography:** Positions described by mechanism, not name (except where standard labels aid brevity).
  *   **Vocabulary:** Filmgoer terms only ("credits," "craft," "tearjerker").
  *   **Compactness:** Expository text minimized; diagnostic machinery prioritized.
