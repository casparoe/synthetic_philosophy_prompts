  ### Preliminary Diagnostic Elimination

  Before committing to a diagnosis, I considered five candidate frames for this stalemate. **[Inferred]**

  1.  **Verbal Dispute about "Cause":** One side means "mechanism," the other "prediction."
      *   *Prediction:* Once definitions are standardized, agreement emerges on cases.
      *   *Verdict:* Unlikely. Both sides use counterfactual language. They agree on the *logic* of causation, not just the word.
  2.  **Substantive Metaphysical Dispute:** Do social entities exist independently of individuals?
      *   *Prediction:* Arguments about ontology, supervenience bases, and identity conditions.
      *   *Verdict:* Ruled out by your description. Everyone agrees on supervenience. No one believes in "floating facts."
  3.  **Substantive Methodological Dispute (Evidence):** What counts as proof? Mechanisms vs. Statistical Stability.
      *   *Prediction:* Arguments about model specification, robustness checks, and identification strategies.
      *   *Verdict:* Plausible, but doesn't explain why they accept each other's *examples* but deny their *significance*.
  4.  **Two Questions Under One Label:** "Explanation" is doing double duty (Understanding vs. Control).
      *   *Prediction:* Talk past each other; one wants to know *how*, the other *what if*.
      *   *Verdict:* Close, but both sides claim to offer *causal* explanation, implying a shared goal.
  5.  **Badly Posed Question (Variable Selection):** The dispute is about causal granularity and the criteria for variable inclusion.
      *   *Prediction:* Arguments collapse into discussions of intervention feasibility and stability ranges.
      *   *Verdict:* Most promising. It explains the stalemate: there is no "true" level, only levels fit for specific intervention sets.

  **[High Confidence]** I commit to a weighted combination of **Candidate 3 (Methodological)** and **Candidate 5 (Variable Selection)**. This is not a metaphysical dispute, nor a purely verbal one. It is a dispute about **Explanatory Adequacy Conditions** driven by divergent **Interventionist Interests**. The individualist prioritizes *causal closure* (avoiding spuriousness via mechanism), while the holist prioritizes *causal stability* (maximizing invariance across contexts). They are arguing over which error type is worse: false positives from macro-correlations (Individualist fear) or false negatives from over-specification (Holist fear).

  ***

  ### 1. The Positions and Point of Contact

  **[High Confidence]**
  **The Individualist (The Mechanist):**
  Their core claim is not that macro-entities don't exist, but that macro-variables are *causally deficient* unless they are grounded in micro-mechanisms. They view macro-correlations as potentially spurious if the micro-pathways are unspecified. For them, a causal claim is secure only if the "gears" are visible. If a macro-variable predicts an outcome but the micro-level story doesn't align, the macro-variable is a "placeholder," not a cause. Their standard of success is *internal validity* secured by mechanism.
  *   *Charitable Core:* They are protecting against the error of reification—treating a statistical regularity as a lever when it is merely a shadow of underlying interactions.

  **[High Confidence]**
  **The Holist (The Invariantist):**
  Their core claim is that macro-variables often capture *stable dependency relations* that disappear if you zoom in too far. They argue that micro-details are often noise relative to the structural constraint. If swapping individuals preserves the outcome, the structure is doing the work. For them, a causal claim is secure if it supports counterfactuals across a wide range of background conditions. Their standard of success is *external validity* secured by invariance.
  *   *Charitable Core:* They are protecting against the error of over-specification—losing the signal (the structural constraint) by focusing on the noise (the specific individual realizers).

  **[High Confidence]**
  **The Point of Contact:**
  The dispute is not about *supervenience* (both agree macro depends on micro). It is not about *counterfactuals* (both agree causes must make a difference).
  **[Contested]** The precise point of contact is the **range of admissible interventions**.
  *   The Individualist implicitly restricts admissible interventions to those that act on individuals (or are reducible to such). They suspect macro-interventions are "fat-handed" or confounded.
  *   The Holist implicitly expands admissible interventions to include structural manipulations that may not be reducible to specific individual changes without losing the generalization.
  *   *The Stalemate:* Both sides look at the same case and see different risks. The Individualist sees a risk of spuriousness; the Holist sees a risk of fragility.

  ***

  ### 2. Assessment of Your Two-Part Hypothesis

  **[High Confidence]**
  **Part 1: Production vs. Difference-Making**
  Your hypothesis is that Individualists care about *cause-as-production* (machinery) and Holists care about *cause-as-difference-making* (intervention).
  **[Contested]** This is the weakest part of your diagnosis. It relies on an outdated dichotomy. In contemporary causal inference, *mechanisms are validated by difference-making*. The Individualist is not asking "what is the stuff made of?" (metaphysics); they are asking "if we intervene on the macro variable, is the effect mediated entirely through the micro variables we specified?" (causal structure).
  *   *Correction:* Both sides are interventionists. The Individualist believes the *true* difference-makers are always at the micro-level because macro-variables are coarse-grainings that might hide confounders. The Holist believes macro-variables are *better* difference-makers because they are more invariant to micro-perturbations.
  *   *Why it matters:* If you frame it as Production vs. Difference-making, you concede the metaphysical high ground to the Individualist. If you frame it as *Granularity vs. Stability*, you level the playing field.

  **[High Confidence]**
  **Part 2: The Empirical Question of Invariance**
  Your hypothesis that "which level hosts more invariant generalizations" is an empirical, domain-specific question is **correct**.
  *   *Explanation:* This explains the stalemate perfectly. There is no *a priori* reason social causation must reside at the micro or macro level. In some domains (e.g., crowd panic), micro-details wash out and macro-density is the invariant cause. In others (e.g., financial crashes), specific micro-expectations drive the macro outcome, and macro-averages are misleading.
  *   *Why the debate persists:* The reading group is trying to solve a methodological problem (which level *should* we prefer?) as if it were a philosophical necessity, when it is actually an empirical contingency. They are looking for a universal principle where none exists.

  ***

  ### 3. Audit of "Realizer-Swap Invariance"

  **[High Confidence]**
  You propose: A macro-claim is autonomous if (i) it survives swapping individuals (holding structure fixed) and (ii) there is a macro-intervention not reducible to micro-interventions.

  **[Contested]** **Critique 1: The "Holding Structure Fixed" Problem.**
  This criterion risks incoherence. If social structure *supervenes* on individual relations (which everyone agrees it does), you cannot logically "swap individuals" while "holding structure fixed" unless you define structure *functionally* or *abstractly*.
  *   *The Trap:* If you define structure abstractly (e.g., "a hierarchy"), then swapping individuals while maintaining the hierarchy *presupposes* that the hierarchy is the causal unit. You have built the conclusion into the test.
  *   *The Individualist Objection:* They will say, "You didn't hold the structure fixed; you held the *description* fixed. The real causal structure changed because the specific beliefs/relations of the new individuals are different, even if the abstract label is the same."
  *   *Verdict:* As a metaphysical test, it fails. It assumes the autonomy it tries to prove.

  **[High Confidence]**
  **Critique 2: The Intervention Condition.**
  Condition (ii) requires a macro-intervention "not merely a redescription of a bundle of micro-level interventions."
  *   *The Problem:* In a supervenience framework, *all* macro-interventions are realized by micro-changes. There is no "magic" macro-lever that doesn't touch individuals.
  *   *The Fix:* The condition should not be about the *ontology* of the intervention, but the *feasibility and description* of it. A macro-intervention is distinct if specifying it at the micro-level is *computationally or cognitively intractable* or if the micro-specification varies wildly across contexts while the macro-specification remains constant.
  *   *Verdict:* Condition (ii) needs to be about *variable selection criteria* (stability/portability), not ontological distinctness.

  **[Inferred]**
  **Will it settle the debate?**
  No. The Individualist will reinterpret satisfaction of this test. They will say: "Fine, the macro-variable is a *useful proxy* for the underlying micro-structure that we haven't fully mapped yet." They will treat the invariance as evidence of a *hidden micro-mechanism* that is common across the swapped individuals, rather than evidence of macro-autonomy. The test does not force them to abandon individualism; it just forces them to posit more complex micro-theories.

  ***

  ### 4. What Counts as Progress?

  **[High Confidence]**
  **Stop Asking "Which Level is Real?"**
  Progress requires dissolving the metaphysical question. There is no "true" level of causation. There are only causal models that are more or less *invariant* relative to a specified set of interventions.

  **[High Confidence]**
  **Concrete Proposal: The Stability-Granularity Trade-off**
  Shift the debate from "Individualism vs. Holism" to "Optimal Causal Granularity."
  *   *The Formal Result Needed:* A framework (likely using causal discovery algorithms or information theory) that quantifies the trade-off.
      *   *Micro-models:* High resolution, low stability (brittle across contexts).
      *   *Macro-models:* Low resolution, high stability (robust across contexts).
  *   *The Empirical Programme:* Instead of arguing about principles, the group should analyze specific cases to map the **Range of Invariance** for variables at different levels.
      *   *Task:* Take a specific macro-claim (e.g., "Bureaucracy causes inefficiency").
      *   *Test:* Don't ask "Is it reducible?" Ask: "Under what range of micro-variations does this claim hold?"
      *   *Outcome:* You might find that for *policy* interventions (which are coarse), the macro-variable is the valid cause. For *organizational redesign* (which is fine-grained), the micro-variable is the valid cause.

  **[Contested]**
  **Change of Question:**
  The question should not be "Is the market a cause?" It should be: **"For which set of interventions I is the variable V invariant?"**
  *   If the intervention set is "change tax law," the macro-variable "Market Confidence" might be the stable cause.
  *   If the intervention set is "change trader incentives," the micro-variable "Risk Appetite" might be the stable cause.
  *   *Progress:* The group stops trying to win the global war and starts mapping the local terrain. When an Individualist says "It's really the individuals," the Holist replies "Yes, but the individual-level generalization doesn't travel to the next context, so for *this* purpose, the structure is the cause."

  **[High Confidence]**
  **Why this works:**
  It accepts the Individualist's ontology (supervenience) but accepts the Holist's methodology (invariance). It acknowledges that "causation" is a relation between variables, interventions, and background conditions, not a property of the world independent of our descriptive grain.
  *   *The Verdict on your Stalemate:* The stalemate persists because both sides are trying to establish a *priority* (Micro > Macro or Macro > Micro). Progress comes from establishing *complementarity* based on intervention sets. The Individualist wins on *ontological parsimony*; the Holist wins on *predictive robustness*. Science needs both, applied in the right context.

  **[Inferred]**
  **Final Warning:**
  If your group insists on asking "But which one is the *real* cause?", no progress is possible. That question presupposes a "God's eye view" of causation that does not exist in interventionist frameworks. You must enforce a discipline: no causal claim is meaningful without specifying the *contrast class* and the *intervention range*. If they cannot specify the intervention, they are not doing causal inference; they are doing metaphysics. And you have already agreed the metaphysics is settled (supervenience). Force them to the empirical question of stability.
