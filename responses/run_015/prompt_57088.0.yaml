  7.  **Final Polish:**
      *   Ensure all bullet points from the prompt are hit.
      *   Ensure the "Change My Mind" section is distinct and actionable.
      *   Check the paraphrase of Miss Emily (don't put words in her mouth).

      *(Self-Correction on Miss Emily's Paraphrase)*: She says they hoped that by showing the clones could create, the public would see they were human and recoil at killing them. The deferral was a specific hope/rumor that if two lovers could prove their love, they might get time. Tommy linked his art to this. I must distinguish the *Gallery's purpose* (humanity proof) from the *Deferral rumor* (love proof).

      *(Wait, re-reading prompt)*: The prompt asks about "Tommy's animal drawings and the deferral application... certify that two particular people are genuinely in love."
      *Okay, I need to address the student belief vs. the administrative reality.* Tommy believed the art was the application. Miss Emily reveals the art was for the broader campaign. The *function* assigned to the art by the students was certification of love. The *function* assigned by the guardians was certification of soul. This tension is key.

      *(Memory Flag)*: I am confident about the meeting at the end. I am less confident about the specific wording of the "Deferral" rules as understood by the students vs. the reality. I will flag this.

  8.  **Final Review against constraints:**
