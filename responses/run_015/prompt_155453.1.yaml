prompt: |-
  hey so im in this bioethics/philosphy seminar and we're arguing about advance directives — like, if i write now that i dont want tube feeding if i get dementia later, but then later im demented and seem kinda happy, does that earlier document still have authority? my prof mentioned family resemblance in language games in a different context and it got me thinking maybe we're using "authority" in too many different ways and need a spec sheet.

  so heres what i want: write the desiderata — the full checklist of what any adequate theory of teh earlier self's authority over advance medical decisions actually has to deliver. i want the motivating case behind each requirement, not just bullet points. for instance, it needs to handle the standard happy-dementia refusal case, but also this weird scenario i made up: a directive contains a "lucidity window clause" saying that if the patient ever regains brief awareness and expresses a different wish, that wish overrides the directive, but the medical team cant tell if the awareness is "real" lucidity or just reflexive vocalization. the theory has to say what counts as authoritative in that window without just handwaving. also it must respect teh distinction between "this person is still the same individual" and "this person still shares teh values that made the directive meaningful" — cant collapse personal identity into psychological continuity or vice versa. it should be consistent with what we know about dementia trajectories (that suffering isnt inevitable, that some capacities fade in stages) without importing fake neuroscience. flag which desiderata are genuinely non-negotiable and which are just camp preferences — like, is determinism about personal identity a real requirement or just a metaphysical prejudice? and please flag any pair that looks jointly unsatisfiable. im especially suspicious that "honor the earlier autonomous choice" and "protect the current subject's apparent welfare" cant both be maxed out in teh happy-dementia case, but maybe theres a third thing im missing. briefly, how do the broad approaches — the narrative-identity view, the present-autonomy-override view, and teh substituted-judgment model — do against your list? dont need a full scorecard, just the tension points. oh and dont give me a bibliography, i cant look stuff up and i just want teh conceptual architecture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Topic:** Bioethics/Philosophy of Advance Directives (ADs), specifically focusing on the authority of the past self over the future demented self.
      *   **Core Problem:** The "Happy Dementia" case (Dworkin vs. Dresser debate essentially) + a specific "Lucidity Window Clause" scenario.
      *   **Task:** Create a list of *desiderata* (requirements/checklist) for an adequate theory of AD authority.
      *   **Specific Constraints:**
          *   Provide motivating cases for each requirement (not just bullets).
          *   Handle the "Happy Dementia" case.
          *   Handle the "Lucidity Window Clause" scenario (distinguishing real lucidity from reflex).
          *   Distinguish between *numerical identity* (same individual) and *narrative/value continuity* (same values).
          *   Be consistent with dementia trajectories (stages, suffering not inevitable) without fake neuroscience.
          *   Flag non-negotiable vs. camp preferences (e.g., is determinism about identity required?).
          *   Flag jointly unsatisfiable pairs (trade-offs).
          *   Address the tension between "Honor Past Autonomy" and "Protect Current Welfare."
          *   Briefly evaluate three broad approaches: Narrative-Identity, Present-Autonomy-Override, Substituted-Judgment.
          *   **NO Bibliography.** Focus on conceptual architecture.
      *   **Tone:** Academic but accessible (seminar discussion style), rigorous, conceptual.

  2.  **Deconstruct the Philosophical Landscape:**

      *   *The Conflict:* Ronald Dworkin (Critical Interests/Autonomy dominates) vs. Rebecca Dresser (Experiential Interests/Current Welfare dominates).
      *   *Identity:* Parfit's reductionism vs. Lockean psychological continuity vs. Biological continuity.
      *   *Authority:* What gives the past self the right to bind the future self?
      *   *The "Lucidity Window":* Adds a layer of epistemic uncertainty to the "current self's" voice.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: Identity vs. Continuity.* The prompt specifically asks to separate "same individual" from "same values."
          *   *Motivation:* We don't execute people who go insane because they are biologically the same, but we might not trust their financial decisions because their values changed. ADs need to know which kind of "sameness" matters.
      *   *Req 2: The Happy Dementia Case.*
          *   *Motivation:* If the demented self is content, does the past self's fear of indignity override current happiness? The theory must weigh critical vs. experiential interests.
      *   *Req 3: Epistemic Access (The Lucidity Window).*
          *   *Motivation:* The prompt's specific scenario. How do we verify a "current wish" without being fooled by reflexes? The theory needs an epistemic standard, not just a metaphysical one.
      *   *Req 4: Temporal Scope/Stage Sensitivity.*
          *   *Motivation:* Dementia isn't a switch. Early stage vs. late stage matters. A theory that treats all dementia as one state fails.
      *   *Req 5: Non-Maleficence/Welfare.*
          *   *Motivation:* We can't just let people suffer because a document says so, unless the "suffering" is defined by the past self. Need to define harm.
      *   *Req 6: Revocability/Modification.*
          *   *Motivation:* Can the future self *change* the directive? (Related to the Lucidity Window).

  4.  **Refining and Categorizing (Non-Negotiable vs. Camp Preferences):**

      *   *Non-Negotiable:* Must distinguish identity from values (otherwise the debate is confused). Must handle epistemic uncertainty (otherwise it's impractical). Must account for stages of dementia (otherwise it's medically inaccurate).
      *   *Camp Preferences:* Does critical interest *always* trump experiential? (Dworkin says yes, Dresser says no). This is a value judgment, not a logical necessity. Is personal identity determinate? (Parfit says it's vague, others say it's binary). This is metaphysical prejudice.

  5.  **Identifying Tensions (Jointly Unsatisfiable Pairs):**

      *   *Maximal Past Autonomy vs. Maximal Current Welfare:* In the Happy Dementia case, you usually have to pick one.
      *   *Strict Adherence vs. Epistemic Humility:* If you demand strict adherence to the AD, you might ignore a genuine lucid plea. If you listen to every plea, you might be fooled by reflexes, violating the AD.

  6.  **Evaluating the Three Approaches:**

      *   *Narrative-Identity:* Good on values, bad on current welfare if the narrative is broken.
      *   *Present-Autonomy-Override:* Good on current welfare, bad on respecting long-term planning (the "Ulysses Contract" problem).
      *   *Substituted-Judgment:* Tries to split the difference, but relies on counterfactuals ("what would they want?") which are hard to know if the self has changed.

  7.  **Drafting the Content (incorporating the "Spec Sheet" metaphor):**

