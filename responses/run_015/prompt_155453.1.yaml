      *   *Correction:* Make sure I don't solve the problem, but define what a solution *must do*. The prompt asks for desiderata, not the final answer.
      *   *Refinement on "Lucidity":* Ensure the distinction between "reflexive vocalization" and "authoritative expression" is central to that desideratum.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Jointly Unsatisfiable" section is prominent. (Self-correction: Make sure to explicitly mention the "determinism about personal identity" point as requested).

  10. **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  Here is a conceptual spec sheet for the authority of advance directives (ADs). This is structured to help you dismantle the "authority" ambiguity in your seminar. I've broken the desiderata into three categories: **Metaphysical Grounding**, **Epistemic Access**, and **Normative Weight**.

  I have flagged items as **[Non-Negotiable]** (the theory fails without this) or **[Camp Preference]** (this depends on your ethical framework). I have also highlighted the **Tension Points** where requirements conflict.

  ---

  ### I. Metaphysical Grounding Desiderata
  *What kind of "self" is binding whom?*

  **1. The Identity/Continuity Distinction**
  *   **Motivating Case:** A patient in late-stage dementia is biologically the same human organism as the person who signed the AD (numerical identity), but cannot recall their spouse, values, or life projects (psychological discontinuity).
  *   **Requirement:** The theory must explicitly state whether authority derives from *biological continuity* (the organism survives) or *narrative/value continuity* (the "person" survives). It cannot conflate the two. If authority relies on narrative continuity, the AD loses force when the narrative breaks. If it relies on biological continuity, the AD holds even if the "person" is gone.
  *   **Status:** **[Non-Negotiable]**. Failing to distinguish these leads to category errors (e.g., arguing about "death" when you mean "personhood").
  *   **Note on Determinism:** A theory does *not* require determinate personal identity (the idea that there is a fact of the matter about whether Future-Self is Past-Self). It is a **[Metaphysical Prejudice]** to demand a binary Yes/No on identity. An adequate theory can handle "vague identity" (Parfitian reductionism) by shifting authority to *interests* rather than *identity*.

  **2. The Critical vs. Experiential Interest Separation**
  *   **Motivating Case:** The "Happy Dementia" scenario. Past-Self values dignity and autonomy (Critical Interests). Current-Self values comfort and immediate pleasure (Experiential Interests). Current-Self is happy being fed; Past-Self wrote "no tube feeding."
  *   **Requirement:** The theory must provide a hierarchy or weighting mechanism between these two types of interests. It must explain *why* one trumps the other, or under what conditions they trade off. It cannot simply assert one is "real" and the other "illusory."
  *   **Status:** **[Camp Preference]**. Dworkin argues Critical Interests dominate; Dresser argues Experiential Interests dominate once capacity is lost. An adequate theory must pick a lane or provide a lexical ordering rule, but neither is logically forced.

  ---

  ### II. Epistemic Access Desiderata
  *How do we know what is happening now?*

  **3. The Lucidity Verification Standard**
  *   **Motivating Case:** Your "Lucidity Window Clause." The patient says, "I want to eat," contradicting the AD. Is this a restored value judgment or a reflexive response to hunger cues (like a baby crying)?
  *   **Requirement:** The theory must provide criteria for *authoritative expression* distinct from *behavioral output.* It cannot simply say "if they speak, it counts." It needs a threshold for cognitive capacity that validates a revocation of the AD. This threshold must be lower than full legal competence but higher than reflex.
  *   **Status:** **[Non-Negotiable]**. Without this, the "Lucidity Window" is medically unimplementable.
  *   **Tension Point:** This conflicts with **Desideratum 5 (Non-Maleficence)**. High verification standards protect the Past-Self's plan but risk ignoring a genuinely suffering Present-Self. Low standards protect the Present-Self but risk acting on reflexes that violate the Past-Self's deep values.

  **4. Trajectory Sensitivity (Staging)**
  *   **Motivating Case:** Dementia is not a light switch. In early stages, a patient may understand the AD but lack impulse control. In late stages, they may lack understanding but feel pleasure.
  *   **Requirement:** The theory must account for the *gradient* of capacity loss. Authority cannot be binary (Valid/Invalid). It must allow for "sliding scale" authority where the weight of the AD shifts as the disease progresses.
  *   **Status:** **[Non-Negotiable]**. Any theory that treats dementia as a monolithic state is medically false and ethically dangerous.

  ---

  ### III. Normative Weight Desiderata
  *What do we actually do?*

  **5. The Harm Constraint (Non-Maleficence)**
  *   **Motivating Case:** Following the AD results in the death of a happy, smiling demented patient. Is this "harm"?
  *   **Requirement:** The theory must define harm. Is harm only what the *subject experiences* (starvation feels bad)? Or is harm what happens to the *life's integrity* (a dignified life was ruined)? The theory must specify if it permits imposing experiential harm (suffering/death) to prevent narrative harm (indignity).
  *   **Status:** **[Non-Negotiable]**. You cannot bypass the duty of non-maleficence without explicit justification.

  **6. The Revocability Condition**
  *   **Motivating Case:** If the Present-Self *could* authentically revoke the AD (see Lucidity Window), does the Past-Self have the right to make the AD *irrevocable*? (A "Ulysses Contract").
  *   **Requirement:** The theory must decide if autonomy includes the right to bind one's future self *against* their future will. Can Past-Self strip Future-Self of the right to change their mind?
  *   **Status:** **[Camp Preference]**. Some argue autonomy is essentially revisable; others argue integrity requires binding commitments.

  ---

  ### IV. Jointly Unsatisfiable Pairs (The Trade-Offs)

  You suspected a conflict between honoring past choice and protecting current welfare. Here is the formal breakdown of the tensions you need to flag in seminar:

  **Tension A: Maximal Past Autonomy vs. Epistemic Humility**
  *   **Conflict:** If you maximize Past Autonomy (strict adherence to the AD), you must ignore ambiguous signals from the Present-Self (the Lucidity Window). If you practice Epistemic Humility (admitting we can't be sure if the patient is lucid or reflexive), you risk violating the AD based on false positives.
  *   **Result:** You cannot have 100% adherence to the AD *and* 100% responsiveness to current cues. You must choose a risk profile: Risk violating the dead person's wishes, or risk harming the living patient's potential authentic will.

  **Tension B: Narrative Integrity vs. Experiential Welfare**
  *   **Conflict:** In the Happy Dementia case, maximizing Narrative Integrity (following the "no tube feeding" order to preserve the life story's dignity) *requires* sacrificing Experiential Welfare (ending a life that currently feels good to the subject).
  *   **Result:** These cannot both be maximized. A theory that claims to do both is hiding a lexical priority rule (usually favoring one over the other).

  ---

  ### V. Evaluation of Broad Approaches

  Here is how the three standard models stack up against this spec sheet.

  **1. The Narrative-Identity View (Dworkin-style)**
  *   **Core:** The AD protects the integrity of the whole life story.
  *   **Performance:**
      *   *Hits:* **Identity/Continuity Distinction** (prioritizes narrative over biology), **Harm Constraint** (defines harm as narrative indignity).
      *   *Misses:* **Experiential Interest Separation** (tends to dismiss current happiness as irrelevant if it contradicts the narrative).
      *   *Tension:* Fails **Lucidity Verification**. If the narrative is broken, why does it still rule? It struggles to explain why a "happy" demented self shouldn't be allowed to eat if the "story" is already effectively over.

  **2. The Present-Autonomy-Override View (Dresser-style)**
  *   **Core:** Only the currently experiencing self matters. The AD is merely evidence of past preference, not binding authority.
  *   **Performance:**
      *   *Hits:* **Experiential Welfare**, **Harm Constraint** (prevents current suffering).
      *   *Misses:* **Revocability Condition** (makes all ADs effectively non-binding), **Trajectory Sensitivity** (often treats the demented self as a totally new entity, ignoring the transition).
      *   *Tension:* Fails **Maximal Past Autonomy**. It renders the AD a suggestion, which undermines the point of advance planning.

  **3. The Substituted-Judgment Model**
  *   **Core:** Decide as the patient *would* decide if they were competent now.
  *   **Performance:**
      *   *Hits:* Attempts to bridge **Past Autonomy** and **Current Context**.
      *   *Misses:* **Epistemic Access**. It relies on a counterfactual ("What would they want?") that is impossible to verify when the person's values have fundamentally shifted.
      *   *Tension:* Fails the **Identity/Continuity Distinction**. It assumes the "real" person is still in there waiting to be consulted, which may be metaphysically false in late-stage dementia. It often collapses into "Best Interests" (what we think is good for them) disguised as judgment.

  ### Summary for Seminar Argument
  If you want to press the "Authority" angle, argue that **Authority is not a property of the document, but a function of the relationship between temporal selves.**

  The "Spec Sheet" shows that most theories fail because they try to solve a **Metaphysical problem** (who is this person?) with a **Legal solution** (the signature). To pass the **Lucidity Window** test, a theory needs an *epistemic* account of authority (how we know the wish is real) not just a *normative* one (why we should obey it).

  The "Happy Dementia" impasse is only unsolvable if you insist on **Determinism about Personal Identity**. If you admit identity is vague, you can argue that authority is also vague: the AD has *some* weight, the current smile has *some* weight, and the decision is a negotiation between competing interests rather than a trump card played by the past.
