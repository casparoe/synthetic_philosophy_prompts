answer: |-
  Here is a decision procedure designed for your constraints (spreadsheet-compatible, no statistician, plain English) that applies the logic of the Condorcet Jury Theorem (CJT) without getting bogged down in math you can't verify.

  ### Part 1: The Setup (Once Per Round)

  **1. Reviewer Count vs. Quality**
  *   **The Math:** CJT says adding voters helps only if they are better than random ($p > 0.5$) and independent. Diminishing returns kick in fast. The jump from 1 to 3 reviewers is massive; 5 to 7 is negligible.
  *   **The Rule:** Cap external reviewers at **5 per application**.
  *   **The Trade-off:** Do not add a 6th reviewer to "be sure." If you suspect a knowledge gap (e.g., no statistician), do not add a generalist. Swap one generalist for **one specialist** or use that budget/time for a **15-minute fact-check call** with an expert during the panel phase.
  *   **Why:** A 6th correlated voter adds noise, not signal. A single expert fact-check fixes a factual error that 6 voters will just argue about.

  **2. Independence (The Draft Review Problem)**
  *   **The Math:** If reviewers see each other's comments before scoring, their errors become correlated. If Reviewer A makes a mistake and Reviewer B copies it, you effectively have 1 voter, not 2. CJT collapses.
  *   **The Rule:** **Blind Scoring.** Reviewers submit scores and comments *before* they can see anyone else's.
  *   **The Exception:** After scores are locked, allow a 48-hour "clarification window" where they can see comments to adjust their *narrative*, but not their *score*.
  *   **Why:** This preserves the independence required for the "crowd" to be wiser than the individual.

  **3. Panel Voting Protocol**
  *   **The Rule:** **Private Vote First.** Before the Zoom discussion begins, all 5 panel members must enter a "Provisional Vote" (Fund / No Fund) into the spreadsheet.
  *   **Why:** If you discuss first, the Chair or the loudest expert anchors the group. You lose the independent signals CJT needs. The discussion is for resolving *disagreements*, not forming opinions.

  ### Part 2: The Decision Algorithm (Per Application)

  This is your spreadsheet logic. It runs automatically based on the inputs.

  **Step 1: The "Below Chance" Check (Expertise)**
  *   **Input:** Does the panel agree they lack expertise to judge a core claim? (Yes/No)
  *   **Logic:** If **Yes**, STOP. The CJT condition ($p > 0.5$) is violated. The group is worse than a coin flip.
  *   **Action:** **Handover.** Decision passes to the **Panel Chair + 1 External Expert**. The panel does not vote.
  *   **Reason:** You cannot vote on truth if you don't speak the language.

  **Step 2: The Veto Check (The "Strong Reject")**
  *   **Input:** Are there any "Strong Reject" scores (external) or "No" votes (panel) based on **Factual Error** (e.g., "math is wrong," "ethics breach")?
  *   **Logic:**
      *   If **No** (rejects are based on "boring," "low impact," "risk"): Ignore the veto. Proceed to Step 3.
      *   If **Yes** (rejects are based on verifiable fact): **Trigger Fact Check.**
  *   **Action:** Pause decision. Assign one panel member to verify the fact (or call the applicant/expert).
      *   If Fact is **True**: Application is **Rejected**. (Stop).
      *   If Fact is **False**: Disregard the "Strong Reject." Proceed to Step 3.
  *   **Reason:** A veto is only valid if the reviewer is infallible. They aren't. But factual errors *are* fatal. Distinguish between "I don't like this" (vote) and "This is broken" (fact).

  **Step 3: The Aggregation (How to Count)**
  *   **Input:** 5 Panel Votes (after discussion).
  *   **Rule:** **Simple Majority (3 out of 5) to Fund.**
  *   **Criteria:** Vote on the **Overall Proposal**, *not* on the sub-scores (Importance, Methods, Feasibility).
  *   **Reason:** Voting on sub-scores creates paradoxes (majority likes methods, majority likes impact, majority rejects proposal). CJT applies to the binary truth of "Is this worth funding?" not the dimensions.
  *   **Threshold:** 3 Yes = Fund. 2 Yes = No Fund.
  *   **Why not Unanimity?** Unanimity requires $p=1.0$. It guarantees you will fund nothing risky.
  *   **Why not Veto?** A veto gives one person ($p \approx 0.7$) more power than the group ($p \approx 0.9$). It increases false negatives.

  **Step 4: The Risk Appetite Tie-Breaker**
  *   **Input:** Vote is 3-2, but the split is clearly about **Risk** (e.g., 3 say "High risk/High reward", 2 say "Too unsafe").
  *   **Logic:** This is not a factual dispute; it is a value dispute.
  *   **Action:** **Chair Decides.** The Chair votes a 6th time based on the Foundation's strategic risk profile.
  *   **Reason:** The group decides *truth* (is the science sound?), the Chair decides *value* (does this fit our mission?).

  ### Part 3: Estimating Accuracy (The Hard Truth)

  You asked what you can infer from your data. Here is the honest assessment:

  1.  **Funded Projects:** You know their success rate. This tells you nothing about reviewer accuracy, only about your *selection threshold*. If 90% of funded projects succeed, your reviewers might be great, or you might just be funding only the safest bets.
  2.  **The 20 Rejected Projects:** These are **biased data**. These are the applications resilient enough to get funded elsewhere. They are the "survivors."
      *   **If >50% succeeded elsewhere:** Your reviewers are likely **worse than chance ($p < 0.5$)** on these types of applications. You are rejecting winners.
      *   **If <50% succeeded elsewhere:** Your reviewers are doing okay at spotting duds.
      *   **The Problem:** You don't know about the rejected apps that *didn't* get funded elsewhere. They might have been duds, or they might have been genius projects that couldn't find a home.
  3.  **The Verdict:** You cannot calculate $p$. You must **assume $p$ is low (0.6)** and design the process to survive that.
      *   **Action:** If the "20 projects" success rate is high, you must **lower your threshold** (fund more) or **change your reviewer pool**. Do not trust the scores; trust the external outcome data.

  ### Part 4: Applied Cases

  **Case 1: The Solid, Unexciting Application**
  *   **Data:** 5 Reviewers: All "Moderate Yes." Panel Vote: 5-0 Fund.
  *   **Procedure:** Step 1 (Expertise) OK. Step 2 (Veto) None. Step 3 (Majority) 5-0.
  *   **Outcome:** **Fund.**
  *   **Comment:** CJT works best here. High agreement, low variance. The "crowd" confirms the signal.

  **Case 2: The Interdisciplinary Application (The CJT Trap)**
  *   **Data:** 5 Reviewers: All from Field A. Project is 50% Field B. Reviewers admit they can't judge Field B methods.
  *   **Procedure:** Step 1 (Expertise). Panel flags "Lack expertise on Field B methods."
  *   **Outcome:** **STOP.** Handover to Chair + 1 Field B Expert.
  *   **Why:** If the reviewers admit they are guessing, their $p$ drops toward 0.5. If they are confidently wrong, $p < 0.5$. Adding more Field A reviewers makes the decision *worse*. You must bypass the jury.

  **Case 3: The Statistical Dispute (Factual Uncertainty)**
  *   **Data:** 2 Reviewers: "Stats fine." 3 Reviewers: "Stats broken." Panel splits 2-3 on the fact.
  *   **Procedure:** Step 2 (Veto/Fact). The "No" votes are based on a factual claim ("Plan is broken").
  *   **Action:** **Pause.** Do not vote. Assign the panel member with stats expertise (or an external call) to verify the plan.
      *   *Scenario A:* Expert says "Plan is fine." The 3 "No" votes are invalidated. Vote proceeds. Likely Fund.
      *   *Scenario B:* Expert says "Plan is broken." Application Rejected.
  *   **Why:** You cannot vote on truth when the truth is unknown. You must arbitrate the fact before applying the jury theorem.

  ### Part 5: The Uncomfortable Case (Where the Board Will Push Back)

  **The Scenario:**
  An application comes in. It is high-risk.
  *   **Reviewers:** 2 "Strong Yes," 3 "Strong No."
  *   **The "No" Reason:** All three "No" reviewers cite the same concern: "This has never been done before, likelihood of failure is high." This is a **Risk** judgment, not a **Fact** judgment.
  *   **Panel Vote:** 2 Panelists agree with the risk (No). 3 Panelists argue the Foundation's mandate is *specifically* to fund high-risk work (Yes).
  *   **Procedure Output:** **Fund.** (3-2 Majority wins. Step 4 Tie-Breaker not needed as majority is reached. Veto overridden because the "Strong Rejects" were about risk, not factual error).

  **Why the Board Will Refuse:**
  The Board sees "3 out of 5 external experts said No." They will view funding this as negligent. They prefer the **Veto Rule** (one strong reject kills it) because it protects *them* from blame if the project fails. The procedure exposes them to risk by overriding the experts in favor of the panel's risk appetite.

  **What To Do:**
  1.  **Document the Logic:** In the grant file, explicitly write: *"External reviewers flagged risk. Panel voted to fund based on Foundation Strategic Goal X (High Risk Tolerance). Decision made per Procedure Step 3 & 4."*
  2.  **The Compromise:** If the Board absolutely refuses, do not revert to the Veto Rule. Instead, invoke **Step 1 (Expertise)** retroactively. Frame the decision as: *"The external reviewers were evaluating scientific safety, not strategic fit. Their accuracy on 'strategic fit' is not established. Therefore, their 'No' on risk is treated as a value judgment, not a factual veto."*
  3.  **The Hard Truth:** If the Board forces a Veto on a 3-2 Panel vote, **you have violated CJT.** You have decided that one reviewer's fear is more accurate than the panel's strategy. You must record this as a "Process Exception" so you can track how often the Board overrides the math. If they do it often, your panel is theater, and you should save the money and let the Chair decide.

  ### Part 6: Confessions (Where I'm Violating the Theorem)

  You asked for honesty about where this is judgment dressed up as math.

  1.  **Independence is a Lie:** Your reviewers are in the same small field. They know each other. They read the same papers. Their errors *are* correlated. The "Blind Scoring" helps, but it doesn't fix shared cultural biases.
      *   *Mitigation:* This is why we cap reviewers at 5. We aren't claiming certainty, just improvement over a single reader.
  2.  **$p > 0.5$ is an Assumption:** We assume reviewers are better than random. For the "Interdisciplinary" case, we admit they might not be. For the rest, we hope they are.
      *   *Mitigation:* The "20 Rejected Projects" check. If that success rate is high, your assumption is wrong, and this whole procedure is optimizing a broken engine.
  3.  **The Chair's Tie-Breaker:** CJT applies to groups of equals. Giving the Chair a tie-breaker on risk admits that the group cannot aggregate *values*, only *facts*. This violates the "pure jury" model but is necessary for a foundation with a mission.
  4.  **The "Fact vs. Value" Distinction:** The procedure hinges on knowing the difference between a factual error and a risk preference. In reality, reviewers dress up preferences as facts ("This is unsafe" vs "I don't like risk").
      *   *Mitigation:* The Step 2 Fact Check. Force them to prove the fact. If they can't, it defaults to a value vote.

  ### Summary Checklist for Your Spreadsheet

  1.  **Blind Score Submitted?** (Y/N) -> If No, lock score.
  2.  **Expertise Gap Flagged?** (Y/N) -> If Yes, **Handover to Chair+Expert**.
  3.  **Strong Reject Present?** (Y/N) -> If Yes, **Is it Factual?**
      *   If Factual: **Verify.** If True -> **Reject**. If False -> **Ignore**.
      *   If Risk/Value: **Ignore Veto**.
  4.  **Panel Private Vote:** (Count Yes/No).
  5.  **Result:**
      *   3+ Yes: **Fund**.
      *   0-2 Yes: **No Fund**.
      *   (If 3-2 split is purely Risk): **Chair Breaks Tie**.

  This fits in a spreadsheet. It takes 2 hours to set up. It protects you from the "one scared reviewer kills everything" problem while acknowledging that a crowd of ignorant people is dumber than one expert.
