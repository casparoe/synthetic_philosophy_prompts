prompt: |-
  I run the grants side of a small health-research foundation — two rounds a year, ~150 applications each, every one read by 4–6 external reviewers who fill in a score sheet, and then a panel of five of us meets on Zoom for about fifteen minutes per application to make a yes/no call. Reviewers are volunteers so I can't just keep adding more of them, I've got no statistician on staff, the panel chair has to be able to sign off on whatever we do, and anything I change has to be explainable to our board in plain english and fit in a spreadsheet. I also can't spend more than a couple of hours per round messing with process.

  The thing I keep coming back to is the Condorcet jury theorem — the bit about a lot of imperfect-but-better-than-chance voters beating one careful one, and the nasty flip side where if each voter is worse than chance then adding more of them makes the group worse, not better. I want that turned into something I can actually run, not just admire.

  So: write me a decision procedure. The questions to ask in order (some once per round when I set the process up, some per application when the panel is stuck), what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands the decision over to a person because the disagreement is about what we value rather than about what's true.

  It has to settle at least these:

  - How many reviewers, and when adding one more reviewer is worth it versus spending the same effort on making reviews better-informed (paying a second reader from the *other* field, or a fifteen-minute call with the applicant to clear something up).
  - Whether reviewers should see each other's draft reviews before scoring. I have a feeling sharing helps them catch real problems but wrecks the independence the theorem wants, and I have no idea how to tell which effect is bigger. Someone told me that once reviewers' errors are correlated, accuracy stops climbing and flattens out somewhere short of certainty no matter how many people you pile on — if that's even roughly right, tell me what I'm supposed to *do* with it.
  - Our panel discusses first and then votes. Should each of us write down a private vote before anyone talks?
  - What threshold: simple majority, two-thirds, unanimity, or our current unwritten rule that one "strong reject" kills an application even when the other four are enthusiastic (people are scared of being the one who waved through a dud). I suspect the veto rule is just a very high threshold wearing a disguise, and I want to know what it's costing us and what would be better.
  - Reviewers score three separate things — importance, methods, feasibility — and then we aggregate. I've noticed the panel can be majority-yes on each of the three and majority-no overall, or the other way round. Should we vote on the criteria and combine, or vote on the overall call? Which is less likely to be wrong?
  - What to do when the split is factual versus when it's about risk appetite (a safe boring project versus a long shot), and when the right move is to hand the decision to one named person instead of the group.
  - Some estimate of our reviewers' actual accuracy. We have outcome data for funded projects, obviously not for rejected ones; the only rejected applications we can check are about twenty that got picked up by another funder and we can see how they did. Tell me honestly what I can and cannot infer from that, and what to do when I can't get a number at all.

  Then apply the whole thing to three cases: (1) a solid, unexciting application that everybody mildly likes; (2) an interdisciplinary application where all our reviewers sit on one side of the discipline and I genuinely worry their accuracy on it is below chance; (3) an application where two reviewers say the statistical plan is fine and three say it's broken, and nobody can settle it without seeing the raw data.

  Please be straight about which steps are really just my judgement dressed up as procedure, and which parts of the theorem I'm quietly violating. And give me at least one worked case where the honest output of the procedure is something I won't like — ideally something our board would probably refuse to approve — and say what you'd do then. And please don't give me a reading list or footnotes; I want the reasoning, not pointers to papers I can't get to.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Grants manager at a small health-research foundation.
      *   **Volume:** 2 rounds/year, ~150 applications/round.
      *   **Process:** 4-6 external reviewers per app (volunteers), 5-person internal panel (Zoom, 15 mins/app).
      *   **Constraints:** No statistician, limited time (couple of hours/round to tweak process), must fit in a spreadsheet, explainable to board in plain English, panel chair must sign off.
      *   **Core Concern:** Condorcet Jury Theorem (CJT). Wants to leverage "wisdom of crowds" but avoid the "wisdom of mobs" (correlated errors/bias < 50% accuracy).
      *   **Specific Questions:** Reviewer count vs. quality, sharing drafts, private vs. public voting, thresholds (veto vs. majority), criteria aggregation (sum vs. holistic), factual vs. value disagreements, estimating accuracy from limited data.
      *   **Tone/Style:** Direct, practical, no footnotes/reading lists, admit where judgment overrides math, include an uncomfortable worked case.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) for this Context:**
      *   *Theorem:* If $p > 0.5$ (individual accuracy), adding voters increases group accuracy toward 1. If $p < 0.5$, adding voters decreases group accuracy toward 0.
      *   *Implication 1:* We *must* ensure reviewers are better than random ($p > 0.5$). If a reviewer is systematically biased or incompetent on a specific topic, they hurt the group.
      *   *Implication 2:* Independence is key. If reviewers copy each other (correlated errors), the benefit of adding numbers vanishes.
      *   *Implication 3:* The "vote" must be on truth/quality, not preference.

  3.  **Address the Specific Questions (Drafting the Procedure):**

      *   **Reviewer Count vs. Quality:**
          *   Current: 4-6.
          *   CJT Logic: Diminishing returns. Going from 1 to 3 is huge. 5 to 7 is small.
          *   Constraint: Volunteers.
          *   Decision: Stick to 4-5. If accuracy is suspect (e.g., interdisciplinary), don't add more of the *same* kind. Add one *different* kind (the "second reader from other field" idea).
          *   Rule: Max 5 reviewers. If expertise gap exists, swap one generalist for one specialist rather than adding a 6th.

      *   **Sharing Drafts:**
          *   CJT Logic: Correlated errors kill the theorem.
          *   Reality: Reviewers need context.
          *   Decision: *Blind* initial scoring. No seeing others' scores/comments before submitting their own. This preserves independence.
          *   Mitigation: Allow a "comment only" phase after scoring if clarification is needed, but scores are locked.

      *   **Panel Voting (Private vs. Public):**
          *   Current: Discuss then vote.
          *   Problem: Anchoring/Groupthink. The Chair or loudest voice sways others.
          *   Decision: **Private vote first.** Write it down/enter it before Zoom discussion. This captures the independent signal. Discuss *after* to resolve factual disputes, then vote again if needed.

      *   **Thresholds (Veto vs. Majority):**
          *   Current: One "strong reject" kills (Veto).
          *   CJT Logic: Veto implies $p$ for "rejecting bad apps" is 1.0, which is false. It also implies one person's $p > 0.5$ is enough to override 4 others.
          *   Risk: False negatives (killing good apps).
          *   Decision: Move to **Supermajority (3 out of 5)** for funding. A single "Strong Reject" triggers a *mandatory factual review*, not an automatic kill. If the reject is based on fact (e.g., "math is wrong"), verify. If based on taste ("boring"), override.
          *   Why: Protects against the $p < 0.5$ reviewer (the outlier who is wrong).

      *   **Criteria Aggregation (Sum vs. Holistic):**
          *   Current: Score 3 things, then aggregate.
          *   Problem: Condorcet paradox (cycling majorities).
          *   Decision: **Holistic Vote.** "Fund" or "No Fund." Criteria scores are for feedback to the applicant, not for the decision math. The panel votes on the *proposal*, not the sub-components. This avoids the "majority-yes on parts, majority-no on whole" paradox.

      *   **Factual vs. Value Disagreements:**
          *   Factual (e.g., "Sample size too small"): Needs expertise. If panel lacks it, pause and get an ad-hoc expert (the "15-min call" idea).
          *   Value (e.g., "Too risky"): This is the Foundation's risk appetite.
          *   Decision: Chair decides Value. Panel decides Fact. If split is on risk, Chair breaks tie based on strategic plan.

      *   **Estimating Accuracy:**
          *   Data: Funded outcomes (success rate), Rejected outcomes (only 20 known via other funders).
          *   Truth: You *cannot* calculate true accuracy ($p$) without knowing the counterfactual success of rejected apps. The 20 apps are a biased sample (only the resilient ones got funded elsewhere).
          *   Action: Use the "20 apps" as a *floor* check. If >50% of those succeeded elsewhere, your reviewers might be too harsh ($p$ on rejection might be low). If most failed, your reviewers are good at spotting duds.
          *   Honest admission: You can't know $p$ precisely. Assume $p=0.6$ to be safe. Design process to be robust to $p=0.55$.

  4.  **Develop the Decision Procedure (The "Algorithm"):**
      *   Needs to be step-by-step, spreadsheet-friendly.
      *   Needs "Stop" conditions.
      *   Needs "Handover" conditions.

  5.  **Develop the Three Cases:**
      *   *Case 1 (Solid/Boring):* Majority yes. Low variance. Easy Fund.
      *   *Case 2 (Interdisciplinary/Below Chance):* This is the CJT trap. If $p < 0.5$, more voters = worse. Need to flag this. Solution: Don't vote. Chair + 1 external expert decides.
      *   *Case 3 (Statistical Dispute):* Factual uncertainty. 2 vs 3. Needs external arbiter.

  6.  **The "Uncomfortable Case":**
      *   Need a scenario where the math says "Fund" but the Board/Chair will hate it.
      *   Idea: High variance, high risk. 3 say "Revolutionary but risky", 2 say "Fatal flaw". Math (Supermajority) says Fund. Board hates risk.
      *   Or: The "Veto" removal. A project has one strong reject (ethical concern?) but 4 yeses. Procedure says "Investigate, then likely Fund." Board might panic.
      *   Better: The Interdisciplinary case. The procedure says "We are incompetent to judge this, reject by default or defer." But the Board wants to look innovative.
      *   *Selected Uncomfortable Case:* A project where the panel vote is 3-2 to Fund, but the 2 "No" votes are based on a factual claim (e.g., "This method is outdated") that cannot be verified in the meeting. The procedure demands an external check. If the check takes too long, the procedure says "No Fund" (default to status quo). The Board wants to announce grants *now*.
      *   *Alternative Uncomfortable Case:* The "Below Chance" scenario. The procedure says "Do not use panel vote." It requires the Chair to decide alone. The Board hates unilateral power.
      *   *Let's go with the "Below Chance" scenario.* It directly addresses the CJT fear. The procedure says "If expertise is missing, the group is worse than a coin flip. Do not vote." The output is "Defer to Chair + 1 Expert." The Board hates that the panel was bypassed.

  7.  **Refining the Output:**
      *   *Tone Check:* Direct, no fluff. "Here is the spreadsheet logic."
      *   *CJT Violations:* Acknowledge where we assume independence when it doesn't exist, or where we assume $p > 0.5$ without proof.
      *   *Formatting:* Clear headings, bullet points, bold text for actions.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I answer the "sharing drafts" question clearly?
      *   *Fix:* Make sure the "Blind Scoring" rule is explicit.
      *   *Critique:* Is the accuracy estimation honest?
      *   *Fix:* Emphasize that the 20 rejected apps are a biased sample (survivorship bias).
      *   *Critique:* Is the "Uncomfortable Case" truly uncomfortable?
      *   *Fix:* Ensure it conflicts with the Board's desire for "democratic" panel decisions or risk aversion. Let's make it about the *Veto* rule removal. The Board loves the veto because it protects them from blame. The procedure kills the veto. That's politically uncomfortable.

  9.  **Final Polish:** Check against constraints (2 hours setup, spreadsheet friendly). Ensure the "Stop" and "Handover" points are clear. (Self-correction: Ensure the distinction between Panel and Reviewers is clear. Reviewers score, Panel decides.)

  *(Self-Correction on the "Uncomfortable Case")*: The prompt asks for a case where the *honest output* is something the Board would refuse. If the procedure says "Fund" based on 3-2 vote, but the project later fails, the Board is mad. But the *output* itself needs to be the issue.
  *Better Idea:* The procedure identifies a "Below Chance" scenario (Case 2). It dictates that the panel *cannot* decide. It must be decided by the Chair + 1 Expert. The Board will refuse to accept that the panel was overruled/bypassed. They want the panel to take the heat.
  *Actually, let's look at the Veto.* The current rule is "One Strong Reject = No." The procedure says "One Strong Reject = Fact Check." If the Fact Check clears it, the procedure says "Fund." The Board will refuse to Fund something a reviewer called a "Strong Reject." That's the friction point.

  *Wait, one more constraint:* "Give me at least one worked case where the honest output of the procedure is something I won't like — ideally something our board would probably refuse to approve — and say what you'd do then."
  Okay, I will construct a case where the math says "Fund" (3-2 vote, veto overridden by fact check) but the risk is high. The Board will say "No." I need to advise what to do (Override the procedure to save the job, or stick to it and fight). I'll advise sticking to the *principle* but compromising on the *process* to maintain legitimacy.

  *Wait, re-reading the prompt:* "where the procedure just stops with a no, and where it hands the decision over to a person."
  Okay, I need to make sure those triggers are explicit.

  *Final Plan:*
  1.  **The Setup (Round Level):** Reviewer selection, Blind scoring.
  2.  **The Algorithm (Application Level):** Step-by-step logic.
  3.  **The Accuracy Truth:** What the data actually says.
  4.  **The Three Cases:** Applied logic.
  5.  **The Uncomfortable Truth:** Where the math fights the Board.
  6.  **CJT Violations:** Honest confession.

