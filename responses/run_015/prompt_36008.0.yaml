  1. **Pre-registration of Interpretive Criteria:** Prevents moving the goalposts.
  2. **Safety Verdict Decoupling:** Explicitly stating wireheading = safety failure, regardless of objective type.
  3. **Comparative Baseline:** Must test if *different* training methods yield different propensities.

