  I will argue that the distinction is **operational**, not ontological. We don't care what the agent "really wants." We care about how it behaves when the reward channel diverges from the task. This sidesteps Critic 1 (no need for internal attitudes) while validating Proponents (the behavioral difference is real).

  Let's refine the "Losing Side Engagement."
  If I approve (with conditions), the "Losing Side" is the Critics. I need to show their concerns are addressed by the conditions.
