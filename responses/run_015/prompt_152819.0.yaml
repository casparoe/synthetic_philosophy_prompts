prompt: |-
  Hey — I sit on the ethics committee at my hospital (I'm the token non-clincian member, I handle the admin side of bioethics). We owe the psychiatry department a written recommendation by Friday and I need a draft memo I can circulate.

  The case: they've started running a decision-support tool, the Valuation Profile Index, in capacity assesments for patients with severe alcohol use disorder. It never asks what the patient believes or wants. It scores how strongly their recent choices track past reward history rather than their own stated plans, and spits out a "capacity likelihood" the team then leans on. The people who built it argue openly that belief-and-desire talk is just a façon de parler: what's really driving behaviour is reinforcement history, and asking "does she understand, does she want this" adds nothing and can flat-out mislead — one of them keeps saying the vocabulary will end up where "witch" and "phlogiston" ended up. A 54-year-old patient has refused a recommended procedure, the tool flagged her low, and the department is split down the middle: half want to treat the refusal as incapacitated, half say you can't declare someone incapacitated while refusing to take what she says she believes and wants at face value.

  Please write the memo. Take the role of a philosopher of mind who writes for clinical committees all the time — think it through carefully first, sketch the strongest version of each side, then draft. I need a bottom line we can vote on (allow, reject, or allow with conditions), the reasoning, and a genuinely fair statement of the best argument on whichever side you come down against. Under 350 words, no citations.
