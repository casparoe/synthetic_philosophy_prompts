  **Exam Prompt**
  Consider a competent patient who consents to surgery after receiving accurate disclosure from their surgeon regarding risks and benefits. However, the surgeon knows—but does not disclose—that hospital protocol will automatically divert excised tissue to a biobank, despite the patient having previously refused biobank participation. The patient is unaware of this institutional rerouting.

  Is the consent for surgery valid? Argue whether deception vitiates consent only when it targets the immediate medical act, or whether hidden systemic architectures can invalidate consent even when the immediate interlocutor is honest. (45 mins; target ~700 words)

  **Model Answer**
  Consent is invalid because authorization requires understanding the normative context of the act, not merely its physical mechanics. While the patient understood the surgery itself, satisfying procedural validity, they lacked authority over the conditions surrounding it, violating informational validity. The deception is nested within the institution, bypassing the immediate interlocutor.

  Valid consent requires voluntariness and understanding. Here, voluntariness is intact; no coercion occurred. However, understanding is compromised. Traditional models focus on interpersonal disclosure: did the surgeon lie? Here, the surgeon was honest about the cut, but silent on the use of what was cut. This distinguishes procedural honesty from informational completeness. The surgeon followed the clinical script but withheld material context regarding the tissue's fate. This creates a gap between the patient's understanding and the institutional reality. The patient believes they are entering a therapeutic relationship, but the institution treats them as a resource.

  The core issue is the scope of consent. Did the patient consent to "surgery" or "surgery under specific institutional conditions"? If consent is purely transactional, limited to the physical intervention, it might hold. But medical consent is relational; it authorizes access to the body within a trusted framework. By diverting tissue against prior refusal, the institution breaches that framework. The patient authorized removal for health, not removal for storage. The physical act is identical, but the normative meaning changes based on the end-use of the tissue. To ignore this is to treat the body as separate from the patient's values.

  Does systemic architecture matter? Yes. Consent relies on a reasonable expectation of transparency. If institutional protocols secretly override prior directives, the patient's ability to govern their body is undermined regardless of the surgeon's personal honesty. The deception is "nested" within the system, making it harder to detect but equally corrosive to autonomy. Autonomy requires control over consequences, not just actions. A patient might accept risk for cure but not for research they rejected. The system exploits the trust placed in the surgeon to bypass the patient's prior directives.

  Therefore, the consent is invalid. The deception targets the conditions of the act, which are material to the decision. Because this information would likely change the decision, it is material. The surgeon's knowledge implicates them in the systemic deception; silence becomes complicity. An honest interlocutor cannot cure systemic dishonesty when that system dictates the outcome of the bodily intrusion. The surgeon acts as an agent of the institution; their honesty is partial if it omits institutional intent.

  Ultimately, validity breaks when the institutional reality diverges from the patient's understanding of the agreement. Hidden systemic architectures can break validity because consent is not just about the knife; it is about the governance of the flesh after the knife stops moving. To hold otherwise is to reduce patients to means rather than ends, allowing institutions to harvest value from bodies under the guise of treatment. The nest of deception collapses the trust required for the initial authorization to stand. Validity requires alignment between expectation and reality, not just between patient and surgeon.

  **Marking Scheme (20 marks total)**

  1.  **Define Consent Components (4 marks):** Identifies voluntariness and understanding as necessary conditions for valid consent.
      *   *Common Error:* Confuses legal competence with substantive understanding of the specific act.
  2.  **Distinguish Validity Types (4 marks):** Clearly separates **procedural validity** (correct process followed by surgeon) from **informational validity** (truthfulness of context/consequences).
      *   *Common Error:* Treats all validity as purely informational, ignoring procedural compliance, or conflates the two.
  3.  **Analyze Scope of Authorization (4 marks):** Argues whether consent covers only the physical act or its downstream consequences and conditions.
      *   *Common Error:* Assumes consent to surgery implies blanket consent to all biological byproducts.
  4.  **Evaluate Systemic Deception (4 marks):** Addresses whether institutional architecture impacts validity independent of the surgeon's personal honesty.
      *   *Common Error:* Claims the surgeon's individual honesty cures institutional deception.
  5.  **Final Judgment on Materiality (4 marks):** Concludes based on whether the hidden information would alter the patient's decision (materiality).
      *   *Common Error:* Fails to link the deception to the impact on decision-making.
