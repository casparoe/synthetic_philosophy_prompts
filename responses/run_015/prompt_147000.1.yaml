      *Let's go with Bifurcation.* It allows for a more nuanced view of epistemology. It acknowledges that the "Logical Structure" argument is superficial compared to the "Epistemic Grounding" argument. The Lottery is about *projection* of odds; the Preface is about *accumulation* of risk.
