  2.  **Deconstruct the Paradoxes:**
      *   *Lottery Paradox (Kyburg):* 1000 tickets, 1 winner. For any ticket $n$, $P(\text{losing}) = 0.999$. If high probability justifies belief, I believe ticket $n$ loses. I do this for all $n$. Conjunction: All tickets lose. But I know one wins. Contradiction.
      *   *Preface Paradox (Makinson):* Author believes every claim in the book (based on evidence). But author also believes (based on humility/experience) that at least one claim is likely false. Conjunction: All claims are true AND at least one is false. Contradiction.

  3.  **Identify the Core Tension:**
      *   *Lockean Thesis (LT):* Belief is justified if $P > t$ (threshold).
      *   *Conjunction Principle (CP):* If I believe $p$ and believe $q$, I believe $p \land q$.
      *   *Consistency Principle:* I cannot believe contradictions.
      *   Both paradoxes show LT + CP + Consistency leads to trouble.

  4.  **Evaluate the "Unified Rejection" Argument:**
      *   *Argument:* Both paradoxes rely on the same logical engine. High probability does not aggregate to certainty. Therefore, LT is the culprit in both. We need a stricter norm for belief (e.g., certainty, or knowledge, or context-sensitive thresholds).
      *   *Strength:* Parsimony. One solution fixes two problems. Highlights the probabilistic nature of the failure.
      *   *Weakness:* Ignores the *source* of the uncertainty. Lottery is objective/statistical. Preface is subjective/defeasible.

  5.  **Evaluate the "Bifurcated/Distinct" Argument:**
      *   *Argument:* Lottery is about statistical evidence (no single ticket has specific evidence against it). Preface is about specific evidence undermined by general fallibility. The Preface involves a second-order belief about one's own cognitive reliability.
      *   *Strength:* Captures the phenomenological difference. In the Preface, the author *has* evidence for each claim. In the Lottery, the believer has *no* specific evidence for any specific loss, only statistical odds.
      *   *Weakness:* Might overcomplicate the solution if the logical structure is identical.

