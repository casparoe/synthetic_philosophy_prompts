      *   *The Category Mistake:* Treating natural fitness like a computational score. One is a description, the other is a prescription.
      *   *Conclusion:* The analogy breaks. Artificial evolution isn't autonomous. It doesn't solve the mind problem the way Darwin solved the design problem.

