      *   **Specific Point to Include:** "Fitness" in nature is a retrospective statistical artifact, not a causal driver. Treating it like a score in genetic algorithms is a category mistake.
      *   **Conclusion:** The analogy breaks because artificial evolutionary processes lack the causal autonomy of real natural selection.
