      *   *Standard View:* Darwin = Design without Designer. Turing = Computation without Consciousness. Both show complex output from simple blind processes.
      *   *My View:* Darwin's process is ontologically blind. Turing's computational models (specifically evolutionary ones) are epistemically blind only to the machine, but teleologically guided by the programmer.
      *   *The "Fitness" Point:* In nature, fitness is just "what survived." It's described after the fact. In code, fitness is a function $f(x)$ defined before the run. This is a category error.
