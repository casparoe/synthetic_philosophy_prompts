      *   *Who is more wrong?* The BIL relies on the "masker" theory. The User relies on the "tautology/timing" theory. The Rescue Rule hurts the BIL more because it invalidates the "Right" part of "Right but Early."
      *   *2050 Evidence:* Yield plateaus.

