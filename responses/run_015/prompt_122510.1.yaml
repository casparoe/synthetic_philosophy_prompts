answer: |-
  The slogan is not a single proposition but a conflation of seven distinct claims, and your dispute with the judge turned not on the definition of law but on whether moral defectiveness destroys legal validity necessarily or merely undermines obligatory force.

  To disentangle this, we must separate the messy ways this phrase is used in practice from the precise philosophical commitments each usage entails. Below are seven candidate readings, ranging from linguistic quirks to metaphysical assertions, evaluated by what they commit you to, their plausibility, and whether they support your position (that the ordinance isn't law) or your neighbor's (that it is law, just unjust).

  **1. The Semantic Stipulation**
  This claims that the word "law" is defined such that moral goodness is part of its meaning, like "bachelor" implies "unmarried."
  *   **Commitment:** You are making a claim about English usage or conceptual boundaries, not about the world.
  *   **Status:** Platitude if defined this way, but substantively false regarding actual legal practice; lawyers and judges call unjust rules "laws" constantly.
  *   **Support:** Supports you linguistically, but hands the neighbor the practical victory; you can define "law" however you like, but the town still enforces the ordinance.

  **2. The Moral Obligation Claim**
  This claims that while the rule exists as a social fact, it generates no moral duty to obey it.
  *   **Commitment:** You are separating legal validity from moral bindingness; you admit it is a law but deny its authority over conscience.
  *   **Status:** Substantive and defensible; this is the most common practical use of the slogan.
  *   **Support:** Supports you partially (you may resist), but supports the neighbor more (he can agree it's a law that lacks moral force).

  **3. The Judicial Nullification Claim**
  This claims that judges are obligated to treat grossly unjust statutes as void, regardless of procedural enactment.
  *   **Commitment:** You are making a claim about institutional role and adjudication, not citizen duty.
  *   **Status:** Substantive; true in some systems (with constitutional review), false in others (strict parliamentary sovereignty).
  *   **Support:** Supports you if the court agrees; supports the neighbor if the court upholds the ordinance despite its injustice.

  **4. The Functional Defect Claim**
  This claims that law is a purposive enterprise (guiding conduct by rules), and a rule that fails this purpose through injustice is a corrupted instance of the kind.
  *   **Commitment:** You are treating "law" as a functional kind term, similar to your protein analogy.
  *   **Status:** Substantive and defensible (Fuller's position); it allows for degrees of "law-ness."
  *   **Support:** Supports you metaphorically (it's a "denatured" law), but supports the neighbor ontologically (it's still the same molecule, just non-functional).

  **5. The Systemic Contingency Claim**
  This claims that "unjust laws are no laws" is true only if the specific legal system's rules of recognition say so (e.g., a constitution banning undignified statutes).
  *   **Commitment:** You are making a claim internal to a specific jurisdiction, not about law as such.
  *   **Status:** True in some systems, false in others; compatible with positivism.
  *   **Support:** Hands the victory to the neighbor unless your town's charter explicitly bans such ordinances; it makes the slogan contingent, not necessary.

  **6. The Metaphysical Necessity Claim**
  This claims that injustice destroys legal existence in all possible worlds, regardless of what any constitution or judge says.
  *   **Commitment:** You are making a strong natural law claim about the essence of law itself.
  *   **Status:** Radical and widely rejected in modern jurisprudence; hard to defend against counterexamples (e.g., Nazi laws were legally valid though monstrous).
  *   **Support:** Supports you absolutely, but at the cost of making a claim most philosophers consider false.

  **7. The Performative Protest Claim**
  This claims the slogan is not a description of reality but an act of refusal, like saying "I won't recognize this."
  *   **Commitment:** You are expressing a political stance, not making a truth-apt claim.
  *   **Status:** Neither true nor false; it is a speech act.
  *   **Support:** Supports your action (resistance), but renders the debate with the neighbor category-confused; he is describing, you are protesting.

  ***

  **Addressing Your Four Specific Questions**

  **1. What kind of claim is it?**
  It is usually all of them at once, which is why the argument stalls. Readings 1 and 6 are conceptual/metaphysical (what law *is*). Reading 3 is institutional (what judges *do*). Reading 2 is normative (what citizens *owe*). Reading 4 is teleological (what law is *for*). Your neighbor is arguing from Reading 5 (systemic validity), while you are arguing from Reading 6 (metaphysical necessity) or Reading 2 (moral obligation). You are talking past each other because you are mixing conceptual claims with normative ones.

  **2. Is it necessarily true or system-contingent?**
  If the slogan is meant as a universal truth about law (Reading 6), it is a natural law thesis. If it is true only because a constitution says so (Reading 5), it is a positivist description of that specific system. Most people who repeat the slogan want the rhetorical power of Reading 6 (necessary truth) while relying on the institutional mechanisms of Reading 5 (constitutional review). Philosophically, if you commit to Reading 5, your neighbor wins by default in a system without such a constitutional moral test. If you commit to Reading 6, you are making a controversial metaphysical claim that most legal systems do not accept. The people who repeat it are usually committed to Reading 6 rhetorically, but rely on Reading 5 practically.

  **3. The Test Cases**
  *   *(i) Unjust but believed just:* Under Reading 6 (Metaphysical), it is **not a law**, regardless of belief. Under Reading 5 (Systemic), it **is a law** until a court strikes it down. Under Reading 2 (Obligation), it **is a law** but binds no conscience. Under Reading 4 (Functional), it is a **defective law**.
  *   *(ii) Just then became unjust:* Under Reading 6, it **ceases to be a law** the moment it becomes unjust (time-sensitive). Under Reading 5, it **remains a law** until invalidated by a court (belief/institution-sensitive).
  *   *Verdict:* If you want to say the ordinance was never law because it was always unjust, you need Reading 6. If you say it is law but shouldn't be obeyed, you need Reading 2. The belief of the enacters matters only for Reading 5 (if the system cares about intent) or Reading 7 (protest); it does not matter for Reading 6.

  **4. The Protein Analogy**
  Your analogy maps precisely onto Reading 4 (Functional Defect). A denatured protein is structurally the same molecule (legal validity) but functionally dead (moral authority/purpose). This reading hands the argument to **him** regarding existence (it is still the molecule/law) but hands it to **you** regarding function (it does not do what law is supposed to do). However, law is not quite like protein because legal systems often enforce "denatured" rules successfully; the "function" of law includes coercive power, which the unjust ordinance still possesses. So the analogy is useful for moral critique but misleading for legal existence.

  ***

  **The Real Work and The Actual Disagreement**

  The single reading doing the real work in arguments like yours is **Reading 2 (The Moral Obligation Claim)**, often disguised as **Reading 6 (The Metaphysical Necessity Claim)**. You want the practical conclusion of Reading 2 (no duty to obey) but you are arguing for it using the vocabulary of Reading 6 (it isn't law).

  The sub-question you and your neighbor were actually disagreeing about was not the definition of law, but **the consequence of invalidity**. You assumed that if a rule is unjust, it loses its legal status *and* its enforceability. He assumed that a rule retains its legal status and enforceability until formally repealed or struck down, regardless of its injustice. You were arguing about whether moral judgment can instantly dissolve legal power (your view), or whether moral judgment requires institutional action to change legal status (his view). He was right about the system as it stands; you were right about the system as it ought to be.
