answer: |-
  This is a classic dilemma in social ethics and charity governance, and it is completely understandable that you are stuck. You are trying to balance a philosophical argument with a practical administrative problem, all under the shadow of a legal deed written in a different era.

  Here is a breakdown of Steve's argument, the specific context of your charity, and a concrete proposal for your rules.

  ### 1. Is Steve's "Free Rider" Argument Good?

  You couldn't answer him in the moment because his argument relies on a category error. It sounds logical on the surface, but it conflates two different systems: **Social Insurance** vs. **Charitable Relief**.

  **The Flaw in the Insurance Analogy**
  Steve argues welfare is like car insurance: you pay premiums, you get covered. If you don't pay, you can't claim.
  *   **Reality:** The welfare state is not actuarial insurance. It is a system of redistribution and social stability funded by taxation. You do not pay in enough during your working life to "cover" the cost of a disability, a long-term recession, or a lifetime of low wages. It is a social contract, not a premium policy.
  *   **The "Free Rider" Label:** This assumes unemployment is always a choice. It ignores structural unemployment, hidden disabilities, caring responsibilities, and the fact that "work" is not always available.
  *   **The Economic Point:** You already had the winning argument here and didn't realise it. If the cost of policing (investigations, bureaucracy, sanctions) exceeds the money saved from stopped fraud, the system is economically irrational. Steve says "that's not the point," but for a small charity, **it absolutely is the point.**

  **The Charity Distinction**
  Steve is arguing about *State Welfare* (rights and obligations of citizenship). You are arguing about *Charity* (discretionary benevolence).
  *   The State has a duty to maintain order and economic participation.
  *   A charity has a duty to relieve suffering.
  *   Applying state-level conditionality to a tiny charity fund changes the nature of the gift from "relief" to "contract."

  **Verdict:** Steve's argument is politically coherent but logically flawed regarding the nature of welfare, and it is **practically dangerous** when applied to a small charity with limited funds.

  ### 2. The Legal & Practical Context of "Deserving"

  You are bound by the deed: *"Relief of the deserving poor."*
  This is archaic language. In modern charity law (assuming UK context given "parish" and "councils"), the Charity Commission generally advises against making moral judgments on beneficiaries.

  *   **Historical Meaning:** In the 19th century, "deserving" meant "willing to work but unable to find it" vs. "idle and unwilling."
  *   **Modern Meaning:** It is usually interpreted as "those in financial need who have no other recourse." It is about **eligibility**, not **moral worthiness**.
  *   **The Donor's Intent:** You mentioned the donor wanted the distinction made. However, the primary purpose of the charity is the *relief of poverty*. If the conditions you attach prevent the poor from accessing the relief, you are failing the primary purpose to satisfy a secondary condition.

  ### 3. The Cost of Policing

  You have £2,000 a year. Let's do the math.
  *   If you give £200 grants, that is 10 people a year.
  *   If you require proof of job searches, bank statements, or volunteer hours, a trustee will spend at least 2–3 hours per applicant verifying this.
  *   That is 20–30 hours of trustee time per year.
  *   If you value trustee time at even a modest rate, or account for the opportunity cost, you might spend £500 worth of effort to distribute the fund. That is 25% of your capital gone on administration.
  *   **Fraud Risk:** On small, one-off hardship grants, organized fraud is rare. The risk is not a criminal gang; it's a neighbour who is slightly better off than they claim. The impact of that fraud is negligible compared to the impact of turning away a genuine applicant because they missed an appointment.

  ### 4. Concrete Recommendations for the Rules

  You need a middle path that honours the deed ("deserving") without adopting Steve's punitive model or the other trustee's "no questions asked" model.

  **A. Redefine "Deserving" as "Residual Need"**
  Do not judge their character; judge their options. A "deserving" applicant is someone who:
  1.  Lives in the parish.
  2.  Is in financial hardship.
  3.  Has exhausted other statutory avenues (benefits, council support).

  **B. The "Referral Model" (The Solution to Verification)**
  You said checking bank statements feels grim. **Don't do it.** Instead, outsource the verification to professionals who already know the situation.
  *   **Rule:** Applications must be supported by a referral from a recognized third party (e.g., a local food bank, Citizens Advice, a GP, a social worker, or the Parish Vicar).
  *   **Why this works:** These agencies already do the intrusive checks. They know if the person is chaotic, disabled, or genuinely stranded. They act as the filter. This satisfies the "deserving" clause (vetted by a professional) without you becoming the police.

  **C. Focus on Barriers, Not Behavior**
  Steve wants conditions on *behavior* (prove you looked for work). You should set conditions on *barriers*.
  *   Instead of: "Prove you applied for 5 jobs."
  *   Try: "Funds are available to remove barriers to employment or stability." (e.g., buying work boots, paying a deposit on a rental, emergency food, bus passes to interviews).
  *   This aligns with the donor's likely intent (helping people get back on their feet) without punishing those who cannot work due to health or care duties.

  **D. Self-Declaration with a "Clawback" Clause**
  For very small grants, use a signed self-declaration of need. Include a rule that states: *"If it is discovered that information provided was knowingly false, the applicant will be ineligible for future support."*
  *   This puts the moral onus on them (satisfying the "deserving" concept) without requiring you to investigate upfront.

  ### 5. Summary: What to write in the rules

  I suggest you propose the following framework to your fellow trustees:

  1.  **Eligibility:** Residents of the Parish in demonstrable financial hardship.
  2.  **Verification:** Applications require a supporting signature from a local professional agency (Food Bank, CAB, Medical, Clergy) OR a signed self-declaration of assets/income for emergency one-off grants.
  3.  **Purpose:** Grants are for the relief of immediate hardship or to remove barriers to stability (e.g., essential white goods, work clothing, emergency rent).
  4.  **Administration:** The Trustees reserve the right to decline applications where other statutory support is clearly available but has not been accessed.
  5.  **Review:** No ongoing conditions (like mandatory volunteer work). This is hardship relief, not a employment programme.

  ### Why this is the right choice
  *   **It answers Steve:** It ensures people aren't just "taking out" without checking if they have other options (the referral/declaration covers this).
  *   **It answers the other Trustee:** It avoids moral judgment on *why* they are poor.
  *   **It protects the Fund:** The referral system stops casual abuse without costing you hours of investigation.
  *   **It honours the Deed:** It interprets "deserving" as "genuinely in need with no other options," which is the modern legal standard.

  **Final thought:**
  Steve is thinking about a system of millions of pounds and national policy. You are managing £2,000 and human lives in your parish. In a national system, efficiency and fraud prevention might trump individual hardship. In a local charity, **relief of suffering** must trump everything else. If you turn away a desperate family because they didn't fill out a form correctly, you have failed the charity's purpose, regardless of how "deserving" they are.

  Go with the **Referral Model**. It keeps your hands clean, your costs low, and the money going to the people who need it.
