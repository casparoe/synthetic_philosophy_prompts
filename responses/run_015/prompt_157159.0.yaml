answer: |-
  This is one of the most delicate pressure points in Nyāya epistemology. You are right to feel the tension: Vācaspati is walking a tightrope between maintaining the realism of universals and preventing perception from swallowing inference whole.

  Here is the logic of where Vācaspati is going, untangled by your three specific worries.

  ### 1. Is the Universal a "Non-Spatial" Object?
  You asked if he is literally saying perception can have a non-spatial object, or if he is smuggling inference in.

  **The Ontological Commitment:**
  For Nyāya (and Vācaspati), the universal (*sāmānya*) is not non-spatial. It is *vibhu* (all-pervading) within its extension. "Cow-ness" is fully present in every single cow, everywhere, simultaneously. It is a real entity (*padārtha*), not a mental construct.

  **The Mechanism of Contact:**
  When Vācaspati talks about *alaukika sannikarṣa* (extraordinary contact), he is not saying the mind imagines the universal. He is making a causal claim about the sense organ.
  *   **Ordinary Contact (*laukika*):** Eye contacts *this* cow.
  *   **Extraordinary Contact (*alaukika*):** Because "Cow-ness" inheres in *this* cow, and "Cow-ness" is identical to "Cow-ness" in *that* cow (across time and space), the sense organ, through the particular, contacts the universal *as such*.

  **Is it Smuggled Inference?**
  Vācaspati insists it is not inference because inference requires a three-step logical process (mark, probandum, relation). *Sāmānyalakṣaṇa* is immediate. There is no "thinking" involved, no application of a middle term (*hetu*).
  *   **His Logic:** If you deny this, you fall into the Buddhist trap (*apoha*). If you only perceive particulars, you can never form the concept "cow" without mental construction. If "cow" is just a mental exclusion of non-cows, then realism collapses.
  *   **The Verdict:** He is literally claiming perception grasps the universal. It feels like smuggling inference to a modern reader because "grasping all instances" sounds like generalization. But for Vācaspati, it is a direct causal registration of a real, existing entity that happens to be multiply located.

  ### 2. Does This Make Inference Redundant? (The Circularity Worry)
  You noted that if perception grabs the universal in all unobserved cases, inference seems redundant. Yet Nyāya says inference depends on prior perception of the universal. Is this circular?

  **The Distinction: Term vs. Relation:**
  This is the crucial pivot. *Sāmānyalakṣaṇa pratyakṣa* secures the **terms** of the inference, not the **relation** between them.
  *   **Perception (*Sāmānyalakṣaṇa*):** Allows you to grasp "Smoke-ness" (in all smokes) and "Fire-ness" (in all fires). It gives you the extension of the classes.
  *   **Inference (*Anumāna*):** Is required to establish the *vyāpti* (invariable concomitance) between Smoke-ness and Fire-ness.

  **Why it's not Redundant:**
  Just because you can perceive "all smoke" doesn't mean you automatically perceive "all smoke is fiery." You still need to observe the co-presence and co-absence to establish the link.
  *   **The Circularity Check:** Nyāya is a foundationalist system. Inference must rest on Perception. If Perception could *only* grasp particulars, Inference would have no foundation (because Inference deals with universals).
  *   **Vācaspati's Move:** He uses *sāmānyalakṣaṇa* to break the regress. Perception provides the universals *directly* so that Inference can use them *relationally*. It is not circular; it is hierarchical. Perception provides the bricks (universals); Inference builds the wall (the relation).

  ### 3. The "Self-Locating Belief Update" Twist
  You suggested treating the yogic/conditioned state as a self-locating belief update (indexical). Does this break Nyāya objectivity?

  **Yes, it breaks the Nyāya claim.**
  Here is why that framework clashes with Vācaspati's project:

  1.  **Objectivity (*Yathārthatva*):** For Nyāya, a *pramāṇa* is valid because it corresponds to reality (*yathārtha*), not because it updates an agent's belief state successfully. Truth is mind-independent.
  2.  **The Role of *Saṃskāra*:** Vācaspati mentions prior conditioning (*saṃskāra*) or yogic clarity not to make the truth *relative* to the agent, but to explain why not everyone accesses this perception equally.
      *   **Analogy:** A microscope allows you to see bacteria. The bacteria are objectively there. The microscope is a causal condition. If you don't have the microscope (or the yogic *saṃskāra*), you don't see them. That doesn't make the bacteria "agent-relative."
  3.  **The Indexical Problem:** If you treat this as a "self-locating belief," you imply the knowledge is constituted by the knower's position in the causal chain. Vācaspati would argue the knower's position merely *reveals* what is already there. The universal exists regardless of the knower.
  4.  **Consequence:** If you accept the "belief update" model, you concede that the universal is not directly grasped but constructed by the mind to organize experience. This surrenders the Realist position to a Pragmatist or Idealist one. Vācaspati is fighting specifically to avoid this. He needs the contact to be *ontological* (touching a real thing), not *epistemic* (updating a mental file).

  ### Summary of Vācaspati's Logic
  Vācaspati is trying to solve a specific vulnerability in Nyāya Realism: **How do we perceive universals without admitting they are mental constructs?**

  1.  **He expands "Contact":** He stretches the definition of sense-object contact to include *alaukika* (extraordinary) links so that the sense organ can literally touch the universal.
  2.  **He protects Inference:** He limits this perception to grasping the *extension* of the universal, not the *relations* between universals, keeping inference necessary for scientific knowledge (*vyāpti*).
  3.  **He maintains Objectivity:** He treats the yogic/conditioned state as a causal facilitator (like a tool), not a constitutive element of truth. The truth remains "out there," waiting to be contacted.

  **Where the passage is going:**
  He is building a firewall against Buddhist Nominalism. If he admits the universal is only known via inference or mental construction, the Nyāya ontology crumbles. So, he posits this extraordinary perception as a brute fact of epistemology: we *do* see the universal, directly, because the universal is *there* to be seen, provided the mind is clear enough to let the sense organ register it. It is a bold metaphysical claim disguised as an epistemological mechanism.
