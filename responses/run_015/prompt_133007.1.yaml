prompt: |-
  I'm a TA and I've got one fifty-minute section next week on indicative vs counterfactual conditionals, for first-years who finished truth tables last week — so they're all walking around thinking 'if' is the horseshoe and that any conditional with a false antecedent is automatically true. Don't explain the material to me; plan how I should teach it.

  What I want from you: what has to come first and what actually depends on what (I'm guessing the Kennedy pair — 'if Oswald didn't shoot Kennedy, someone else did' vs 'if Oswald hadn't, someone else would have' — has to land before any talk of possible worlds or similarity, but tell me if I've got it backwards); the one example that should carry the whole session and what it needs to have and lack; and the misconceptions to expect, with the point in the sequence where each should get defused. The ones I'm most worried about: counterfactuals being 'just indicatives with a fake past tense', every false-antecedent counterfactual being vacuously true or else having no truth value at all, 'would' collapsing into 'might', and backtracking cases like 'if the match had lit, I'd have struck it'.

  I'd also like to sneak in semifactuals — 'even if' — since they break the tidy indicative/subjunctive split, but I can't tell whether that's the best payoff of the session or a distraction I should drop. Say which, and why. Then give me one closing question that tells me they understood rather than just picked up a slogan, and say openly what I should refuse to explain at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA (Teaching Assistant).
      *   **Audience:** First-year students (intro logic/philosophy).
      *   **Context:** 50-minute section. Previous week covered truth tables (material conditional). Students currently believe $A \to B$ is true whenever $A$ is false.
      *   **Topic:** Indicative vs. Counterfactual Conditionals.
      *   **Constraints:** Do *not* explain the material to me (the user knows it). Plan *how* to teach it.
      *   **Specific Questions to Answer:**
          *   Order of operations (Kennedy pair before/after possible worlds?).
          *   The one master example (requirements).
          *   Misconceptions to expect & when to defuse them (specifically: fake past tense, vacuous truth/truth-value gaps, 'would' vs. 'might', backtracking).
          *   Semifactuals ('even if'): Payoff or distraction?
          *   Closing question (tests understanding, not slogans).
          *   What to refuse to explain (boundaries).

  2.  **Determine the Pedagogical Strategy:**
      *   *Goal:* Break the identification of natural language 'if' with the material conditional ($\supset$), specifically regarding counterfactuals, without getting bogged down in formal semantics (Lewis/Stalnaker) too deeply.
      *   *Time:* 50 minutes is tight. Need a sharp arc.
      *   *Starting Point:* Validate their current knowledge (truth tables work for *some* things) then show the limit.
      *   *The Kennedy Pair:* This is the classic Adams example. It *must* come early to motivate the distinction before introducing technical machinery like possible worlds. If you start with worlds, they think it's just math. If you start with intuition, they see the problem.
      *   *The Master Example:* Needs to be concrete, causal, and distinct from the Kennedy pair to avoid historical baggage. A match or a switch is standard. Let's go with a **Match**. It's classic for a reason (causal mechanism is clear).
      *   *Semifactuals:* They are great for showing that mood isn't everything, but they complicate the binary. Best used as a "twist" near the end to test robustness, not as a core pillar.
      *   *Misconceptions:* Need to be addressed *in situ*, not as a lecture list.

  3.  **Drafting the Plan - Section by Section:**

      *   **Order of Operations:** The user suspects Kennedy first. They are right. You need the intuitive pull before the theoretical fix.
          *   *Sequence:* Intuition Pump (Kennedy) $\to$ Diagnosis (Material Conditional fails) $\to$ Mechanism (Possible Worlds/Similarity) $\to$ Application (Match Example) $\to$ Complications (Semifactuals/Backtracking).

      *   **The One Example:** The Match.
          *   *Needs:* Clear causal direction (strike $\to$ light), oxygen presence, dryness.
          *   *Lacks:* Overdetermination (at first), weird magic.
          *   *Why:* It allows us to manipulate the antecedent (didn't strike) and see the consequent (didn't light) without invoking historical necessity.

      *   **Misconceptions & Defusal Points:**
          *   *Fake Past Tense:* Address immediately when introducing counterfactuals. It's not grammar; it's modal distance.
          *   *Vacuous Truth:* This is the big one. Address right after the Kennedy pair. Show that "If Oswald hadn't shot, someone else would have" feels *false*, not *true* (even though antecedent is false).
          *   *Would vs. Might:* Address during the Possible Worlds explanation. Closest worlds vs. some worlds.
          *   *Backtracking:* Address late, as a boundary case.

      *   **Semifactuals:** Keep them. They show that the indicative/counterfactual split isn't just about verb tense. It's a good "boss battle" for the end.

      *   **Closing Question:** Needs to force them to evaluate truth conditions, not just label.
      *   **What to Refuse:** The exact metric of similarity between worlds. That's grad school stuff.

  4.  **Refining the Content (Self-Correction/Polishing):**

      *   *Critique:* Is 50 minutes enough for Kennedy + Match + Worlds + Semifactuals?
      *   *Adjustment:* Keep the possible worlds talk very informal. "Closest world where A is true." Don't draw diagrams.
      *   *Critique:* The user asked about the Kennedy pair timing specifically.
      *   *Confirmation:* Yes, Kennedy first. It creates the *need* for the theory.
      *   *Critique:* Semifactuals.
      *   *Decision:* Keep as the "twist." It prevents them from thinking Mood = Modality strictly.
      *   *Critique:* Backtracking.
      *   *Decision:* Use the Match for this. "If the match lit, I must have struck it." Show why this is different from standard counterfactuals.

  5.  **Finalizing the Output Structure:**
      *   Follow the user's requested structure implicitly or explicitly? The prompt asks specific questions. I should answer them directly but woven into a coherent plan.
      *   Let's structure it as: **The Arc**, **The Master Example**, **Misconception Map**, **The Semifactual Call**, **The Closing**, **The Black Box**.

  6.  **Writing the Response (incorporating specific constraints):**
      *   *Tone:* Professional, peer-to-peer (TA to TA), concise.
      *   *Content:*
          *   **Order:** Kennedy first. Definitely.
          *   **Example:** The Match. (Specify conditions: dry, oxygen, box).
          *   **Misconceptions:** Map them to minutes 5, 15, 30, 40.
          *   **Semifactuals:** Keep it. It's the payoff.
          *   **Closing Question:** A specific scenario requiring evaluation.
          *   **Refusal:** Similarity metrics.

      *(Self-Correction during drafting)*: Wait, make sure I explicitly address the "false antecedent = true" misconception. That's the core conflict. The Kennedy example works because the antecedent *is* false (Oswald did shoot), but the conditional feels false (or at least not trivially true).
      *   *Indicative:* "If Oswald didn't shoot..." (We don't know for sure in the example context, usually treated as open).
      *   *Counterfactual:* "If Oswald hadn't shot..." (Presupposes he did).
      *   *Wait, standard Adams example:*
          1.  Indicative: "If Oswald didn't shoot Kennedy, someone else did." (True, because someone did).
          2.  Counterfactual: "If Oswald hadn't shot Kennedy, someone else would have." (False, because he acted alone).
      *   *Crucial Point:* In the counterfactual, the antecedent is known false. By material conditional rules, it should be True. Intuition says False. *That* is the wedge.

      *   *Backtracking:* "If the match lit, I would have struck it." This is often true, but logically distinct from "If I struck it, it would light." Need to make sure students don't confuse $A \boxright B$ with $B \boxright A$.

      *   *Semifactuals:* "Even if I had struck it, it wouldn't have lit." (Wet match). Shows that 'if' + subjunctive isn't always counterfactual dependency.

      *   *Closing Question:* Needs to distinguish between material and counterfactual truth conditions.

  7.  **Final Polish:** Check against all constraints.
      *   Don't explain material. (Check)
      *   Plan how to teach. (Check)
      *   Order of Kennedy/Worlds. (Check)
      *   One example details. (Check)
      *   Misconceptions + timing. (Check)
      *   Semifactuals verdict. (Check)
      *   Closing question. (Check)
      *   What to refuse. (Check)

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is the battle plan for your 50 minutes.

  ### 1. The Order of Operations
  You are correct: **The Kennedy pair must land before possible worlds.**
  If you start with possible worlds, students treat it as a new calculus to memorize. If you start with Kennedy, you create a *crisis* for the material conditional they just learned.
  *   **Minutes 0–10:** The Crisis. Present the Kennedy pair. Establish that the antecedent of the counterfactual is known false (Oswald did shoot). Ask for truth values. Their truth-table training says "True." Their intuition says "False." This gap is your teaching engine.
  *   **Minutes 10–35:** The Fix. Introduce the "closest possible world" heuristic *only* to resolve the Kennedy crisis.
  *   **Minutes 35–50:** Stress Testing. Apply the fix to new cases (the master example, backtracking, semifactuals).

  ### 2. The Master Example
  **The Dry Match.**
  Do not use a complex political or historical example for the mechanics; use a physical causal chain they all understand.
  *   **The Setup:** A standard match, in a box, dry, oxygen present. I did *not* strike it. It did *not* light.
  *   **What it needs:** A clear causal direction (Strike $\to$ Light) and a known factual baseline (No Strike, No Light).
  *   **What it must lack:** Overdetermination (no backup lighter) or magic. You need a clean dependency.
  *   **How to use it:**
      1.  **Indicative:** "If the match didn't light, I didn't strike it." (True, based on observation).
      2.  **Counterfactual:** "If I had struck it, it would have lit." (True, based on physics).
      3.  **The Flip (Backtracking):** "If the match had lit, I would have struck it." (True, but for a different reason—abduction).
      4.  **The Breaker:** "If I had struck it, it might not have lit." (Introduce 'might' here).

  ### 3. Misconception Map & Defusal Points
  Do not lecture these. Wait for them to arise or prompt them specifically at these timestamps.

  *   **Misconception:** *"Counterfactuals are just indicatives with a fake past tense."*
      *   **When:** Minute 10 (Immediately after Kennedy).
      *   **Defusal:** Point out that "If Oswald doesn't shoot..." (present indicative) makes a prediction. "If Oswald hadn't shot..." (past subjunctive) rewinds history. The tense marks **modal distance**, not temporal location.
  *   **Misconception:** *"Since the antecedent is false, the conditional is vacuously true (or has no truth value)."*
      *   **When:** Minute 15 (During the Kennedy analysis).
      *   **Defusal:** This is the core conflict. Force them to admit the counterfactual feels *false*. If it were vacuously true, we couldn't disagree about it. The fact that we can argue about it proves it isn't material.
  *   **Misconception:** *"'Would' collapses into 'might'."*
      *   **When:** Minute 30 (During the Match example).
      *   **Defusal:** Ask: "Is it true that if you jumped out the window, you *might* survive?" (Yes). "Is it true that if you jumped out the window, you *would* survive?" (No). Show that 'would' requires truth in the *closest* worlds, 'might' requires truth in *some* accessible worlds.
  *   **Misconception:** *"Backtracking is the same as forward-tracking."*
      *   **When:** Minute 40.
      *   **Defusal:** Use the Match. "If I struck, it lights" (causal). "If it lit, I struck" (inferential). Both can be true, but they rely on different similarity metrics (holding laws fixed vs. holding facts fixed). Don't solve this; just flag that context dictates which facts we hold fixed.

  ### 4. The Semifactual Call
  **Keep the semifactuals ('even if').**
  Do not drop them. They are the best payoff of the session.
  *   **Why:** Students will leave thinking "Indicative = Material, Subjunctive = Counterfactual." A semifactual (e.g., "Even if I had struck the match, it wouldn't have lit [because it's wet]") breaks this. It uses subjunctive grammar but denies the dependency.
  *   **Placement:** Use it as the final test case (Minute 45). It shows that the logic isn't in the verb ending; it's in the **connection between antecedent and consequent**. It prevents them from reducing the lesson to a grammatical rule.

  ### 5. The Closing Question
  Do not ask "What is the difference between indicative and counterfactual?" That invites slogans.
  **Ask this:**
  > "Suppose we know for a fact that the lottery ticket in my hand lost.
  > 1. If that ticket won, I am rich.
  > 2. If that ticket had won, I would be rich.
  > Are these both true? Both false? Different? Explain using the 'closest world' idea."

  *   **Why this works:**
      *   (1) is an indicative with a false antecedent. Material conditional says True. Intuition says "Wait, really?" (This tests the indicative/material tension).
      *   (2) is a counterfactual. It requires looking at a world where the ticket won. In that world, are they rich? Yes.
      *   **The Trap:** Smart students will notice (1) feels weird because we know it lost. This forces them to articulate that indicatives often presuppose the antecedent is *open*, while counterfactuals presuppose it is *false*, changing how we evaluate the link.

  ### 6. What to Refuse to Explain
  **The Metric of Similarity.**
  Students will ask: "How do we know which world is closest? Is a world where Oswald misses but Kennedy dies closer than one where he lives?"
  *   **Your Answer:** "That is the multi-million dollar question in philosophy right now. There is no agreed-upon formula. For this class, we rely on intuitive similarity: keep the laws of physics fixed, change the specific fact in the antecedent, and see what happens."
  *   **Why:** If you try to define similarity (Lewis's miracle vs. divergence), you will lose the room. Acknowledge the vagueness as a feature of the concept, not a bug in your teaching.
