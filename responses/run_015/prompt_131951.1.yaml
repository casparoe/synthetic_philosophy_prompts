          *   *Crane:* A mechanism that lifts complexity but is itself supported by lower-level processes. Evolution is the ultimate crane. Technology/engineering can be cranes *if* their existence is explained by prior cranes.
      *   **Greedy Reductionism:** From *Darwin's Dangerous Idea* (and *Kinds of Minds*).
