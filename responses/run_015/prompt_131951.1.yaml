          *   *Greedy Reductionism:* Trying to skip levels or claiming the higher level is *nothing but* the lower level in a way that obliterates the higher level's explanatory power or reality. "It's *just* atoms."
      *   **Emergence/Real Patterns:** Dennett is a real-pattern realist. If a pattern is robust and predictable at a higher level, it is real, even if reducible.
      *   **AI/Intentional Stance:** Dennett views AI through the Intentional Stance. If a system behaves *as if* it has beliefs/desires, we can treat it as having them for predictive purposes, but this doesn't necessarily mean it has *phenomenal consciousness* or *understanding* in the human sense. He is often skeptical of strong AI claims (Chinese Room adjacent, though he critiques Searle too).

