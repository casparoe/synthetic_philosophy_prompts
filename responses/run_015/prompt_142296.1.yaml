      *Argument:* The confusion is best dissolved by looking at Feedback and Infrastructure. Pure anchoring projects tend to stall. I will argue to *dissolve* Anchoring into the other projects rather than fund it as a standalone metaphysical inquiry.

      *Let's finalize the 4:*
      1.  **Classificatory Feedback** (Priority: High. Core mechanism. Needs empirical modeling.)
      2.  **Dual-Role** (Priority: High. Direct policy relevance. Tension resolution.)
      3.  **Material Infrastructure** (The Missing One. Kinds are built into IT systems/forms. Crucial for "money" and "stats".)
