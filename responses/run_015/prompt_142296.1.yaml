      *Actually, looking at the criteria:* "How much other work depends on the answer." Anchoring determines the ontology. But "Deference" determines the politics.
      *Let's look at the "Confusion" constraint.* The user suspects Anchoring/Consequence might collapse for money. I should validate that suspicion.
