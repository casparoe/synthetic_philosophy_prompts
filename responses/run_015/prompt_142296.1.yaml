      *Drop:* Anchoring (dissolve it), Transplant (subset of Feedback).

  5.  **Drafting the Argument:**
      *   **Criteria:** Leverage, Feasibility (Phil+Emp), Impact, Novelty.
      *   **Ranking:**
          1.  Feedback (Mechanism)
          2.  Dual-Role (Function)
          3.  Material Infrastructure (Constraint - *New*)
          4.  Deference (Governance)
      *   **Dropped:** Anchoring (Metaphysical quagmire), Transplant (Derivative).
      *   **Missing:** Material Infrastructure (The "hardness" of the classification).
      *   **Evidence of Error:** If Feedback projects produce only case studies without generalizable models; if Dual-Role projects prescribe impossible ideals; if Infrastructure projects ignore human agency.

  6.  **Refining the "Anchoring" Critique:**
      *   The user suspects Anchoring/Consequence collapses for money. I should affirm this. For social kinds, *consequences often constitute the anchor*. Therefore, funding "Anchoring" separately invites the very confusion the user wants to avoid. It's better to study *how* anchors are fixed (Deference/Infrastructure) than *what* they are abstractly.

  7.  **Refining the "Transplant" Critique:**
