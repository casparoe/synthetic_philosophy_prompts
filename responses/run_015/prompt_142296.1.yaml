      *   *Priority 2: Dual-Role.* This addresses the "use" of the kinds. It bridges the gap between scientific validity and social utility. Perfect for Phil + Statistician/Clinician. High impact on official statistics.
      *   *Priority 3: Deference Design.* Once you know how kinds loop (Feedback) and what they are for (Dual-Role), you need to know who controls them. This is the governance layer. High normative stakes.
      *   *Priority 4: Anchoring vs. Consequence.* I need to include this because it's foundational, *but* I suspect the user is right that it might be a pseudo-problem for some kinds. I will reframe it not as metaphysics but as "Operational Anchoring."
      *   *Drop:* Transplant. Why? It feels derivative. A transplant *is* a feedback loop triggered by context shift, or a failure of dual-role fit. It can be a sub-case of Feedback or Dual-Role. Funding it separately dilutes the core theoretical work.

