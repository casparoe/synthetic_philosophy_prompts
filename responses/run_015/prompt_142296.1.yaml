      *Drop:* Anchoring (too metaphysical/stalled) and Transplant (too specific).
      *Wait, I need to address the Anchoring/Consequence split the user proposed.* I should argue that Anchoring is overrated *as a separate project* because it gets solved *through* Feedback and Material Inertia.

      *Let's stick to the user's 5 list first, then add the missing one.*
      The user asks to rank *what to fund* from their list, but also says "tell me which of my five you would drop, and what I have failed to include." So I can swap one out.
      *Decision:* Drop Anchoring (too prone to verbal dispute, less empirical traction). Drop Transplant (subset of Feedback). Keep Feedback, Dual-Role, Deference. Add **Material Infrastructure** (the non-human actor).

      *Wait, 4 projects.*
      1.  Classificatory Feedback (The Dynamics)
