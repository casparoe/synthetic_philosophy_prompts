      *   *2. Dual-Role (Explanatory vs. Practical):* This is about the *function* of the kind. Tension between stability (policy) and sensitivity (science). *Critique:* Highly practical. Directly impacts how statistics are gathered and laws written. Very suitable for Phil + Social Scientist/Statisticiian collaboration.
      *   *3. Classificatory Feedback (Hackingian looping):* How classification changes the classified. *Critique:* This is the core mechanism of social construction. It's dynamic. Essential for understanding *change* over the 3-year period.
      *   *4. Transplant (Context Export):* Moving categories between institutions/countries. *Critique:* Important, but feels like a specific instance of Feedback or Dual-Role. Might be too narrow for a flagship project.
      *   *5. Deference Design (Authority/Revision):* Who decides the boundaries? Epistemic injustice + institutional design. *Critique:* Highly normative. Crucial for implementation.

  3.  **Establish Ranking Criteria:**
      *   *Leverage:* How much other work depends on the answer?
