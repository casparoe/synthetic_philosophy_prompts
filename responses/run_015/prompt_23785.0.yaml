answer: |-
  You press me hard, fellow meditator, and rightly so, for we must withhold assent from anything not clearly and distinctly perceived. Yet, consider this distinction: when I say "it rains," I speak of a motion of bodies observed from without, but when I say "I think," I am not observing a thought from afar, I am living it. By the natural light of reason, it is manifest that nothingness possesses no attributes, and that every mode or accident—such as doubting, understanding, or willing—must inhere in some substance. To suppose thinking exists without a thinker is to suppose an attribute floating free of any subject, which is a contradiction in terms. I do not infer the "I" from the thinking as a conclusion from a premise; rather, in the very act of thinking, the existence of the thinker is immediately revealed to me as the substrate in which this activity resides.

  Furthermore, recall the wax. We stripped away all sensible qualities—color, shape, hardness—and yet something remained, a substance capable of extending and changing. So too with the mind. I strip away all bodily attributes, for I do not yet know if I possess them, yet the power of judging and doubting remains. This power cannot belong to nothing. If there is doubting, there must be something that doubts. To say "there is thinking" without an "I" is to posit a mode without a substance, which my intellect clearly and distinctly perceives to be impossible. Thus, I am not merely a grammatical convenience, but a real thing, a *res*, whose essence is to think, even if I must wait until later meditations to determine whether this thing is distinct from the body.
