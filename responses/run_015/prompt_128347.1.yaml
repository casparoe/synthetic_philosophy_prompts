  # Diagnostic Taxonomy: The Logical Space of the Unilateralist's Curse

  ### Decision Tree Structure

  **Node 1 (Root):** Does the analyst accept that individually rational choices can be collectively self-defeating even when every agent shares an identical preference ordering over the final outcomes?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 8.

  **Node 2:** Is the failure best described as a coordination deficit among distinct agents?
  *   **Yes** → Go to Node 3.
  *   **No** → Go to Node 5.

  **Node 3:** Does the coordination failure persist even when agents have private information about others' compliance thresholds?
  *   **Yes** → Go to Node 4.
  *   **No** → Go to Leaf 3 (Skeptical Eliminativist). *(Note: Reaches skepticism via practical realism rather than theoretical denial)*.

  **Node 4:** Is binding arbitration permissible only if every affected party opts in?
  *   **Yes** → Go to **Leaf 2**.
  *   **No** → Go to **Leaf 1**.

  **Node 5:** Is the failure best described as a missing precommitment technology?
  *   **Yes** → Go to **Leaf 2**. *(Merges contractualist logic from coordination and technology paths)*.
  *   **No** → Go to Node 6.

  **Node 6:** Is the mischaracterization based on treating sequential moves by one agent across time as structurally analogous to simultaneous moves by many?
  *   **Yes** → Go to Node 7.
  *   **No** → Go to **Unoccupied Leaf A**.

  **Node 7:** Does extending the curse to "intertemporal unilateralism" change its normative implications for constitutional design?
  *   **Yes** → Go to **Leaf 4**.
  *   **No** → Go to **Leaf 2**. *(Collapses intertemporal logic back into standard contractualism)*.

  **Node 8:** Does the apparent paradox dissolve when accounting for private information about others' compliance thresholds?
  *   **Yes** → Go to **Leaf 3**.
  *   **No** → Go to **Unoccupied Leaf B**.

  ---

  ### Terminal Leaves and Practical Commitments

  **Leaf 1: Hard-line Coordinationist**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 3 (Yes) → Node 4 (No).
  *   **Definition:** Endorses mandatory, non-opt-in arbitration mechanisms to resolve collective action problems.
  *   **Awkward Practical Commitment:** The analyst must endorse coercing unwilling minorities into compliance for a outcome they theoretically prefer but practically veto.

  **Leaf 2: Libertarian Contractualist**
  *   **Path:** Node 1 (Yes) → Node 2 (Yes) → Node 3 (Yes) → Node 4 (Yes) *OR* Node 5 (Yes) *OR* Node 7 (No).
  *   **Definition:** Accepts only opt-in Ulysses-style precommitment contracts among consenting agents.
  *   **Awkward Practical Commitment:** The analyst must allow catastrophic collective failure to proceed unchecked if even a single affected party refuses to sign the coordination agreement.

  **Leaf 3: Skeptical Eliminativist**
  *   **Path:** Node 1 (No) → Node 8 (Yes) *OR* Node 1 (Yes) → Node 2 (Yes) → Node 3 (No).
  *   **Definition:** Denies the curse applies to real-world agents due to information asymmetries or preference heterogeneity.
  *   **Awkward Practical Commitment:** The analyst must dismiss robust empirical evidence of coordination failure as mere modeling errors rather than structural hazards.

  **Leaf 4: Intertemporal Unilateralist (Unexplored)**
  *   **Path:** Node 1 (Yes) → Node 2 (No) → Node 5 (No) → Node 6 (Yes) → Node 7 (Yes).
  *   **Definition:** Applies the curse logic to intra-personal sequential choice and asks whether constitutional precommitment solves it or merely displaces it.
  *   **Awkward Practical Commitment:** The analyst must treat personal future planning as a political negotiation requiring constitutional constraints on one's own future agency.

  **Unoccupied Leaf A: The Structural Realist**
  *   **Path:** Node 1 (Yes) → Node 2 (No) → Node 5 (No) → Node 6 (No).
  *   **Definition:** Denies coordination, technology, and intertemporal mischaracterization explanations, yet accepts the curse exists.
  *   **Diagnosis:** **Incoherent.** This position accepts the phenomenon while rejecting all logical categories of cause (social, technical, or temporal), leaving no explanatory variable for the failure.

  **Unoccupied Leaf B: The Heterogeneous Preference Authoritarian**
  *   **Path:** Node 1 (No) → Node 8 (No).
  *   **Definition:** Denies that agents share preference orderings yet still believes the curse survives bounded rationality checks.
  *   **Diagnosis:** **Unexplored but Attractive.** This analyst argues that preference heterogeneity exacerbates rather than dissolves the curse, yet still demands centralized binding arbitration (similar to Leaf 1) despite denying the identical preference premise. It is unexplored because most theorists assume heterogeneous preferences dissolve the paradox rather than intensify it.

