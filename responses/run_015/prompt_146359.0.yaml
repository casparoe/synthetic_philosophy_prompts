answer: |-
  (d) Discarded Structures and Commitment

  Three candidate structures were considered and rejected. First, a case relying on heterogeneous agents (where known types face different risks) was discarded because it invites the obvious escape of targeted application, forcing the closure to rely on arbitrary prohibitions on discrimination rather than epistemic constraints. Second, a case relying on existence-dependent outcomes (population ethics) was discarded as it violates your fixed-existence constraint and muddies the Pareto criteria with non-identity problems. Third, a case relying on extreme probabilities (tiny chance of catastrophe) was discarded per your specification, as it allows the defender of Safe Pareto Improvements (SPI) to dismiss the harm as negligible noise.

  I commit to the fourth structure: homogeneous agents facing state-dependent risks where the *information* to distinguish risk classes exists but is temporally inaccessible during the decision window. This isolates the moral weight of *ignorance* versus *unknowability*. It forces the SPI defender to argue that choosing not to wait for available information is morally equivalent to that information being unavailable in principle.

  ***

  (a) The Scenario and Table

  **Setting:** A large NHS Hospital Trust managing acute sepsis admissions. Three patients (Alice, Bob, Charlie) present simultaneously with identical severe symptoms. They are distinct individuals, none of whom has capacity to consent; no prior advance directives exist. The Trust must choose immediately between Standard Care ($S$) and a New Protocol ($I$). $S$ stabilises all patients at a baseline health level. $I$ is a potent immunomodulator that cures the infection rapidly in most biological subtypes but triggers irreversible kidney failure in one specific subtype.

  **Uncertainty:** Medical experts agree on the utility outcomes but disagree on the prevalence of biological subtypes in the local population. This disagreement is represented by a convex set of priors $P$. All states have probability at least 0.10.

  **Information:** Current rapid blood tests (Partition $L$) cannot distinguish subtypes before treatment must begin. A genomic sequencing test (Partition $L^*$) exists and is cheap, but results take 48 hours. Sepsis mortality rises sharply after 6 hours; waiting for $L^*$ renders $I$ ineffective (reducing it to $S$).

  **Utilities:** Measured in Quality-Adjusted Life Years (QALYs) relative to baseline $S=0$. Interpersonal unit comparability is assumed (a QALY loss is equally bad for Alice, Bob, or Charlie).

  **State Space $W = \{w_1, w_2, w_3, w_4\}$:**
  *   $w_1, w_2$: High-response subtypes.
  *   $w_3$: Moderate-response subtype.
  *   $w_4$: Adverse-response subtype (kidney failure).

  **Table 1: Utilities and Probability Bounds**

  | State | Utility $S$ | Utility $I$ | Min Prob ($v_A$) | Max Prob ($v_B$) |
  | :--- | :---: | :---: | :---: | :---: |
  | $w_1$ | 0 | +20 | 0.40 | 0.20 |
  | $w_2$ | 0 | +20 | 0.40 | 0.20 |
  | $w_3$ | 0 | +5 | 0.10 | 0.50 |
  | $w_4$ | 0 | -50 | 0.10 | 0.10 |

  *Note: $P$ is the convex hull of vertices $v_A = (0.4, 0.4, 0.1, 0.1)$ and $v_B = (0.2, 0.2, 0.5, 0.1)$. All state probabilities $\ge 0.10$ everywhere in $P$.*

  ***

  (b) Verification

  **1. Safe Pareto Improvement relative to $L$**
  The partition $L$ is trivial: $L = \{ \{w_1, w_2, w_3, w_4\} \}$. Safety relative to $L$ collapses to Robust Ex Ante Pareto.
  Expected Utility (EU) for $I$ is linear in probabilities. We check the vertices of $P$:
  *   At $v_A$: $EU = 0.4(20) + 0.4(20) + 0.1(5) + 0.1(-50) = 8 + 8 + 0.5 - 5 = 11.5$.
  *   At $v_B$: $EU = 0.2(20) + 0.2(20) + 0.5(5) + 0.1(-50) = 4 + 4 + 2.5 - 5 = 5.5$.
  Since $EU > 0$ at both vertices and $EU(S) = 0$, $I$ is strictly preferred for all $p \in P$. All individuals are robust expected beneficiaries. $I$ is a Safe Pareto Improvement relative to $L$.

  **2. Ex Post Pareto Failure**
  In state $w_4$, every individual receives -50 under $I$ versus 0 under $S$. This is a serious, irreversible harm (kidney failure). The probability of $w_4$ is exactly 0.10 at both vertices, so $p(w_4) \ge 0.10$ for all $p \in P$. This exceeds the 0.10 threshold. $I$ is not ex post Pareto dominant.

  **3. Failure relative to Refinement $L^*$**
  Let $L^* = \{ \{w_1, w_2\}, \{w_3, w_4\} \}$. This partition corresponds to the genomic test results.
  Consider the cell $E_{low} = \{w_3, w_4\}$.
  Conditional Expected Utility $CEU(E_{low}) = \frac{p_3 u(w_3) + p_4 u(w_4)}{p_3 + p_4} = \frac{5p_3 - 50p_4}{p_3 + p_4}$.
  The sign depends on the numerator $N(p) = 5p_3 - 50p_4$.
  *   At $v_A$: $N(v_A) = 5(0.1) - 50(0.1) = 0.5 - 5 = -4.5$.
  *   At $v_B$: $N(v_B) = 5(0.5) - 50(0.1) = 2.5 - 5 = -2.5$.
  Since $N(p)$ is linear and negative at both vertices, it is negative for all $p \in P$. Thus, conditional on $E_{low}$, every individual suffers an expected loss.
  Probability of $E_{low}$: $p_3 + p_4$.
  *   At $v_A$: $0.1 + 0.1 = 0.20$.
  *   At $v_B$: $0.5 + 0.1 = 0.60$.
  The minimum probability is 0.20, which exceeds the 0.15 threshold required.
  Therefore, $I$ is *not* safe relative to $L^*$.

  ***

  (c) Verdicts

  **1. The Safe Pareto Criterion**
  *Verdict:* **Permissible (Required).**
  *Reasoning:* Relative to the information actually available at the decision node ($L$), every individual strictly gains in expectation under every admissible prior. The criterion is satisfied. The existence of $L^*$ is irrelevant to the definition because $L^*$ is not the partition of *available* evidence at the time of choice.

  **2. Plain Ex Ante Pareto (Single Prior)**
  *Verdict:* **Permissible.**
  *Reasoning:* Even taking a single prior (e.g., the average of $v_A$ and $v_B$), the expected gain is positive. A standard expected utility maximiser would choose $I$.

  **3. The Ex Post / Actual-Consent View**
  *Verdict:* **Impermissible.**
  *Reasoning:* In state $w_4$, patients suffer irreversible harm they would strictly avoid. Had the $L^*$ information been available, those in cell $E_{low}$ (20% to 60% of cases) would have withheld consent. The fact that they *would* have withheld consent if the test were ready distinguishes this from cases where consent is impossible due to fundamental unknowability.

  **4. Hypothetical-Consent Contractualism**
  *Verdict:* **Indeterminate / Leaning Impermissible.**
  *Reasoning:* A contractualist asks what principles no one could reasonably reject. Patients in $E_{low}$ could reasonably reject a principle that allows imposing irreversible harm on them when a test *exists* that could spare them, even if using the test is impractical. However, they might accept it if the urgency is framed as a collective emergency rule. The case isolates the tension: is "reasonable rejection" blocked by the *availability* of the test or the *feasibility* of using it? If the former, SPI fails as a consent surrogate.

  ***

  (e) Key Feature, Collapse, and Defense

  **The Working Feature:**
  The moral force of the case rests entirely on the **availability of $L^*$ information coupled with temporal inaccessibility**. It is the distinction between *unknowable risk* (where SPI is plausible as consent-surrogate) and *known-but-untimely risk* (where SPI looks like administrative sacrifice).

  **Collapse:**
  If you remove the existence of the $L^*$ test (making the subtypes fundamentally indistinguishable), the case collapses into a standard emergency gamble. The objection loses its bite because the losers cannot be identified even in principle. The SPI defender would rightly claim that ex ante consent covers fundamental uncertainty.

  **Strongest Attack and Reply:**
  *Attack:* "The SPI defender argues that moral obligations are constrained by feasible information sets. Since $L^*$ was not feasible within the decision window, it is morally irrelevant. To claim otherwise is to demand the impossible."
  *Reply:* "This conflates *feasibility* with *moral relevance*. If I drive too fast to save a life, I may be excused, but the risk I impose is still a harm requiring justification, not a Pareto improvement. SPI claims the choice is *better for everyone* (Pareto). My case shows it is not better for the $E_{low}$ subgroup relative to the information that *exists in the world*, even if not on the desk. If SPI is a surrogate for consent, it must track what agents *would* consent to given the truth of their situation, not just the truth available to the administrator. Ignoring the $L^*$ partition is a choice of administrative priority, not a state of nature."

  ***

  (f) Honest Assessment

  Is the deontological objection here anything more than the familiar complaint about ex ante Pareto improvements?

  Yes, but only marginally. The surplus consists in **hardening the complaint against the 'better evidence' reply**. Standard objections to ex ante Pareto are often dismissed by saying, "You judged based on the evidence you had; you couldn't have known." My case blocks this by stipulating that the evidence *did* exist (the test exists), but was excluded by a procedural constraint (time).

  This forces the SPI defender to admit that their criterion licenses ignoring distinguishable risk classes solely for the sake of efficiency or speed. It shows that SPI is not a neutral surrogate for consent, but a policy tool that privileges *administrative feasibility* over *individual distinguishability*.

  If this is not enough to defeat the SPI criterion, it at least restricts its domain. It implies SPI is only a respectable consent-surrogate when the partition $L$ is not just *available*, but *maximally refined subject to physical possibility*. If $L$ is coarsened by institutional constraints (like testing delays), SPI loses its deontological shield. For your paper, this suggests the SPI criterion must be indexed not just to evidence, but to the *cost of evidence*, and that high costs do not automatically wash out consent violations.
