answer: |-
  # Decision Tree: Moral Efficacy in Collective Harm

  **Root Node:** "When a million drivers emit carbon, does the damage consist of a million distinct slices of harm, or one indivisible cloud?"

  *   **Branch A: One indivisible cloud (Non-Decomposable)**
      *   **Structure Node:** "If the cloud is indivisible, is the wrong in joining the flow or failing your station?"
          *   **Branch A1: Joining the flow (Participatory Complicity)**
              *   **Leaf:** **Practice-based Solidarity**
              *   **Core Claim:** Joining an unjust practice implicates you morally regardless of your measurable output.
              *   **Awkward Commitment:** You must condemn a neighbor for eating one burger even if it changed no animal's fate.
          *   **Branch A2: Failing your station (Role-based Duty)**
              *   **Leaf:** **Role-Obligation**
              *   **Core Claim:** Citizens have a duty to uphold clean systems regardless of causal impact.
              *   **Awkward Commitment:** A bedridden person is equally blameworthy as a heavy driver if they fail to vote for green policy.
          *   **Branch A3: Changing the outcome (Counterfactual Difference)**
              *   **Leaf:** **[EMPTY BRANCH]**
              *   **Diagnosis:** **Incoherent.** You cannot claim individual causal liability if you simultaneously deny the harm is composed of individual causes.

  *   **Branch B: A million distinct slices (Decomposable)**
      *   **Structure Node 1 (Continuous):** "If the slices stack smoothly like sand, do you owe a duty to stop the grain or refuse the beach?"
          *   **Branch B1a: Stop the grain (Counterfactual Difference)**
              *   **Leaf:** **Act-Consequentialist Rejection**
              *   **Core Claim:** If the grain moves nothing, there is no moral reason to abstain.
              *   **Awkward Commitment:** You must admit that driving a gas-guzzler is morally neutral if everyone else does it too.
          *   **Branch B1b: Refuse the beach (Participatory Complicity)**
              *   **Leaf:** **Complicity in Aggregation**
              *   **Core Claim:** Contributing any amount to a harmful sum makes you complicit.
              *   **Awkward Commitment:** You are equally blameworthy for a drop of poison in an ocean as a gallon, provided the total is toxic.

      *   **Structure Node 2 (Threshold):** "If the slices click like a lock, is the duty to hit the trigger or respect the mechanism?"
          *   **Branch B2a: Hit the trigger (Counterfactual/Expected Utility)**
              *   **Leaf:** **Expected-Utility Aggregation**
              *   **Core Claim:** Tiny chance of huge impact (triggering a bulk order) creates a duty.
              *   **Awkward Commitment:** You must treat buying one chicken as mathematically equivalent to buying 10,000 chickens averaged over time.
          *   **Branch B2b: Respect the mechanism (Role-based Duty)**
              *   **Leaf:** **Institutional Duty**
              *   **Core Claim:** We must respect market mechanisms regardless of pivotal probability.
              *   **Awkward Commitment:** You must boycott even when you know the store throws away unsold meat anyway.

      *   **Structure Node 3 (Winner-Take-All):** "If the slices matter only if they break a tie, is the duty to change the outcome or honor the process?"
          *   **Branch B3a: Change the outcome (Counterfactual Difference)**
              *   **Leaf:** **Pivotality Argument**
              *   **Core Claim:** Duty exists only because there is a non-zero probability of being the tie-breaker.
              *   **Awkward Commitment:** Voting in a safe district is purely symbolic with no moral weight.
          *   **Branch B3b: Honor the process (Participatory Complicity)**
              *   **Leaf:** **[SKIPPED TO SAVE SPACE]**
              *   **Diagnosis:** **Unattractive/Redundant.** Complicity usually relies on participation in a process, but if the process is purely winner-take-all, participation without pivotality lacks the moral texture distinct from the counterfactual view.

  *(Note: Domains represented—Climate [Root/Continuous/Holistic], Meat [Threshold], Voting [Pivotal]. Total Leaves: 7.)*
