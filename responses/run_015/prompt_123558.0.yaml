          *   *Decision:* I will provide one example of *Ethos* that passes TRC and one example of *Ethos* that fails TRC. This directly addresses the user's confusion about whether character-based persuasion is automatically manipulative.

  7.  **Drafting the Response (Iterative refinement):**

