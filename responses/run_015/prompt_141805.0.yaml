      *(Self-Correction during drafting)*: Wait, if I fix P5, does it fix P1/P4? Not necessarily. But P5 is the implementation of P1/P2. If P5 is wrong, the system is insecure.
      Actually, the P1/P4 tension is arguably more fundamental. If you believe P4 (Instrumental), then the Differencing attack is only bad *because* it reveals individual data that could cause harm. If you believe P1 (Control), the Differencing attack is bad *because* the user didn't authorize the deduction.
      Actually, looking at P6: "I call these... genuine violations." Why? Because control was lost (P1) OR harm occurred (P4)? The user implies control was lost.
      Okay, I will stick with P5/P6 as the highest severity because it's a direct contradiction between "This is safe" and "This is unsafe."

      *Refining the "Single Revision":* The user needs one change to clean up the most. Changing P5 to acknowledge P6's constraints is the most practical. But changing P4 to align with P1 makes the *reasoning* for P6 clearer.
      Actually, the cleanest fix is to modify **P5**. P5 is the only one making a definitive engineering claim ("therefore... solved"). P1-4 and P6 are principles/observations. P5 is the rule. If P5 is wrong, the rule is broken.
      *Wait, better idea:* The tension between P1 and P4 is the root cause of the confusion in P5/P6.
      If Privacy = Control (P1), then Aggregates (P5) are only safe if control is maintained.
      If Privacy = Downstream Harm (P4), then Aggregates are safe if no harm occurs.
