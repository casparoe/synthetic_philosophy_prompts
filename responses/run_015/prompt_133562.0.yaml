answer: |-
  ### 1. Exam Question

  **Course:** PHIL 450: Meta-Ethics and Value Theory
  **Time Allowed:** 45 Minutes
  **Instructions:** Answer the following question in essay form. Be precise in your use of Moorean terminology.

  **The "Duet" Problem in *Principia Ethica***

  In Chapter 6 of *Principia Ethica*, G. E. Moore argues that the greatest intrinsic goods consist in the enjoyment of beautiful things and the pleasures of human intercourse. Consider the following case:

  > **The Duet:** Two friends attend a concert together. They listen to the same piece of music. Friend A enjoys the music. Friend B enjoys the music. Crucially, A is aware that B is enjoying the music, and B is aware that A is enjoying it. Both take pleasure in this mutual awareness.

  Moore suggests that the value of a whole is not necessarily equal to the sum of the values of its parts. Using this principle, determine whether "The Duet" constitutes a single organic unity with surplus value, or merely the sum of two solitary appreciations plus an added affection.

  In your answer, you must explicitly deploy the following three pieces of Moorean machinery:
  1.  **The Method of Absolute Isolation:** How do you isolate the relevant parts to test their intrinsic value without destroying the "shared" nature of the experience?
  2.  **The Non-Summative Principle:** Why might the value of the joint experience exceed the arithmetic sum of the individual experiences?
  3.  **The Existence Condition:** Moore claims that for an appreciation of beauty to be good, the object must *really exist*. Does this condition function differently in The Duet than in the solitary case?

  Conclude by stating whether, on Moore's grounds, the shared consciousness of the other's enjoyment creates a distinct kind of good that would vanish if one friend were merely hallucinating the other's presence.

  ***

  ### 2. Model Answer

  **Title:** The Ontology of Shared Consciousness in Moore's Axiology

  For G. E. Moore, the "Duet" case is not merely a sociological observation but a test of the logical structure of intrinsic value. To determine whether the shared experience possesses surplus value over two solitary listeners, we must apply Moore's Method of Absolute Isolation rigorously. The central difficulty is that isolating Friend A's consciousness from Friend B's seems to dissolve the very phenomenon under evaluation: the *sharing*. However, Moore's method requires us to isolate *states of consciousness*, not physical persons. We must ask: Is a state of consciousness that includes "belief in another's concurrent enjoyment" more valuable than a state of consciousness that lacks this belief, holding the aesthetic object constant? If we isolate A's mind but retain within it the representation of B's enjoyment, we preserve the phenomenological whole. If that whole is more valuable than A's mind without that representation, we have identified a distinct organic unity.

  This leads directly to the Non-Summative Principle. A natural temptation is to calculate the value of The Duet as: (Value of A's listening) + (Value of B's listening) + (Value of A's affection for B) + (Value of B's affection for A). Moore explicitly warns against this arithmetic approach in his discussion of quantity and value. He doubts that doubling the amount of a good (in this case, doubling the number of appreciators) necessarily doubles the total value. Value is a non-natural property supervening on complex wholes. In The Duet, the "whole" is the complex state of *mutually recognized appreciation*. The relation between the two minds is not an external addition; it is constitutive of a new object of consciousness. Therefore, the value of the Duet is not the sum of parts, but the value of a new whole which includes the relation itself as a necessary component. If the relation is removed, the whole ceases to exist, and we are left with lesser goods (solitary listening).

  The Existence Condition provides the sharpest distinction between the solitary and the shared case. Moore insists that for the enjoyment of beauty to be a great good, the beautiful object must really exist. In the solitary case, if the music is a hallucination, the value is significantly diminished, though the consciousness remains somewhat good. In The Duet, the "object" of the second-order pleasure is not just the music, but *the other friend's mind*. For the shared appreciation to have the full value Moore ascribes to "human intercourse," the other consciousness must really exist. If Friend A is hallucinating Friend B's presence, the Existence Condition is violated regarding the interpersonal object.

  This is where the surplus value is located. In the solitary case, the existence condition applies only to the aesthetic object (the music). In The Duet, it applies to the music *and* the other mind. Moore ranks the consciousness of another's consciousness as a higher-order good than the consciousness of mere things. Therefore, the Existence Condition does more work in the Duet: it validates a higher order of reality. If the friend is not really there, the state collapses from a "pleasure of human intercourse" to a "pleasure of aesthetic imagination," which Moore ranks lower.

  Consequently, The Duet is a distinct organic unity. It is not merely two solitary goods side-by-side. The mutual awareness creates a complex whole where the existence of the second mind is a necessary condition for the highest value. Moore's doubt about doubling value supports this: adding a second person does not simply add $+X$ value; it transforms the nature of the good from aesthetic appreciation to interpersonal communion, which operates on a different axiological scale. The Duet is valuable not because there are two people, but because there is one shared state of consciousness regarding two existing minds and one existing beauty.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Pass Threshold:** 10/20 (Requires at least 3 "Must-Hit" moves substantially addressed)

  | Must-Hit Move | Marks | Common Error / How Students Lose Marks |
  | :--- | :---: | :--- |
  | **1. Application of Absolute Isolation to the *Shared* State**<br>Student must explain that isolation applies to the *state of consciousness* (including the belief in the other), not just physical separation of bodies. | 4 | **The Physicalist Error:** Students treat isolation as physically separating the friends, concluding the value disappears, without analyzing the *mental content* required for the good. |
  | **2. Rejection of Simple Summation**<br>Student must explicitly state that Value(Whole) $\neq$ Value(Part A) + Value(Part B). | 4 | **The Utilitarian Slide:** Students revert to additive hedonism (2 people = 2x pleasure), ignoring Moore's specific rejection of quantitative aggregation in *Principia*. |
  | **3. The "Doubling" Constraint**<br>Student must reference Moore's specific doubt that increasing the quantity of a good (number of appreciators) scales value linearly. | 4 | **The Quantity Confusion:** Students argue the value is higher simply because there is "more pleasure," missing Moore's point that *quality* of the whole changes, not just quantity. |
  | **4. Existence Condition Applied to the *Other Mind***<br>Student must distinguish that in the Duet, the *friend's existence* is part of the existence condition, not just the music's. | 4 | **The Object Fixation:** Students apply the existence condition only to the concert/music, failing to see that the *other person* is also an object whose existence matters for the value. |
  | **5. Definitive Conclusion**<br>Student must conclude whether the Duet is a distinct organic unity or merely additive, based on the above analysis. | 4 | **The Fence-Sit:** Students conclude that "it depends on interpretation" rather than committing to a Moorean reading of the text's hierarchy of goods. |

  **Grading Notes:**
  *   **18-20:** Model answer quality. Nuanced handling of the tension between isolation and constitution.
  *   **14-17:** Solid understanding. Hits all 5 moves but perhaps lacks the sharpness on the "doubling" constraint or the existence of the other mind.
  *   **10-13:** Basic understanding. Identifies Organic Unity but treats it as a label rather than applying the Method of Isolation correctly.
  *   **<10:** Fundamental misunderstanding. Likely relies on Open Question Argument or conflates Moore with Mill.
