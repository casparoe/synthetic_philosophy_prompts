prompt: |-
  Hey — I need something I can actually put on the wall and use, not an essay about it.

  Im deputy director of comms at a regional public health agency. About 2 million people, four of us on the team, we push out two or three guidance lines or press lines a week, the chief medical officer signs off on anything with a number in it, and we usually have a few hours rather than a few weeks. Our recurring problem: the version of a claim that works is the confident one, and the version we can defend in front of a journalist is the careful one, and those arent the same sentence.

  Two features of our situation that I think matter. First, a lot of our claims are what I'll call uptake-linked: their truth depends on people believing them, because the believing is what produces the behaviour that makes them come true. ('If everyone cuts their contacts by about a third for two weeks, the hospitals will hold.') Others are nothing like that — the water is contaminated or it isnt, and no amount of confidence from us touches it. Second, we have what our team calls the archivist: a permanent local opposition group that screenshots every line we soften or overstate and recycles it for years. So an overclaim has a long tail, not just a news cycle.

  What I want is a decision procedure built out of the ethics-of-belief stuff I half remember from university — Clifford's flat rule about believing on insufficient evidence and his shipowner case, James's reply that when an option is genuine and the evidence genuinely cant settle it you're allowed to let your passional nature decide, and above all his thought that some facts only arrive at all if you've already banked on them. I dont want a summary of the debate and I dont want reading recommendations. I want: the questions in order, what counts as a sufficient answer to each, where the procedure stops and says no, and where it hands the decision back to a person because its a values question rather than a factual one.

  Three things it has to get right:

  1. Dont collapse "should I believe this" into "should I say it." For us those come apart constantly — sometimes the right move is to say the confident thing while believing the cautious one, sometimes I think the reverse, sometimes neither. Show me exactly where the gap is and what the procedure does when the two answers disagree.

  2. Give me an actual test for whether a belief is the kind that helps create its own object. Not "its motivating" — the shipowner's belief motivated him perfectly well and that was the whole problem. The test has to be about whether the believing is causally upstream of the fact believed. And most of our real claims are half-and-half: the hospitals hold if uptake is high AND staffing survives AND the variant isnt nastier than the modelling assumes. Tell me how to score a claim that's partly uptake-linked and partly not.

  3. Put the archivist in the procedure. How much weight does long-run damage to our credibility get, and at which step — is it a tiebreaker, a veto, or just one input among many?

  Then run it on three cases:

  (a) Next week we want to publish "If everyone cuts their contacts by about a third for the next two weeks, the hospitals will hold." Our modelling puts that somewhere near 60/40 and the modellers wont go on the record with the number.

  (b) A lab result on a municipal water supply is 36 hours late. We're maybe 80% sure the water is fine. Do we tell people its safe, or tell them to boil it.

  (c) The one I already know I wont like. Our staff are wrecked after two years of back-to-back surges, and the CMO wants to stand up at the all-staff meeting and say "the worst is behind us." Nobody knows that. But the team's view is that if she doesnt say it, a chunk of people quit. Tell me what the procedure actually says, not what would be kind.

  And last: where does it break. Which of these steps are judgement calls dressed up as procedure, whats the failure mode if we run it hard for six months, and what kinds of decisions should we keep out of it entirely.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Deputy Director of Comms at a regional public health agency (2M population, 4-person team).
      *   **Problem:** Tension between *confidence* (needed for uptake) and *carefulness* (needed for defensibility/accountability).
      *   **Constraints:** High speed (hours, not weeks), high stakes (public health), high scrutiny ("the archivist" opposition group tracks inconsistencies).
      *   **Philosophical Basis:** Ethics of Belief (Clifford vs. James). Specifically: Clifford's evidentialism vs. James's "will to believe" (genuine options, passional nature, self-fulfilling truths).
      *   **Deliverable:** A wall-ready decision procedure (not an essay). Needs specific questions, stopping points, hand-off points, and application to three specific cases.
      *   **Key Requirements:**
          1.  Distinguish "Should I believe?" from "Should I say?"
          2.  Test for "uptake-linked" claims (causal upstreamness) and handle mixed claims.
          3.  Integrate the "Archivist" risk (long-term credibility damage).
          4.  Run on three cases (Hospital capacity, Water safety, Staff morale).
          5.  Identify failure modes/breaking points.

  2.  **Deconstruct the Philosophy for Practical Use:**
      *   *Clifford:* Don't believe/say without sufficient evidence. (Safety/Integrity brake).
      *   *James:* If evidence is inconclusive *and* the outcome depends on belief (self-fulfilling) *and* the stakes are high, you are permitted (sometimes obligated) to commit. (Action accelerator).
      *   *The Gap:* Belief (internal state) vs. Assertion (public act).
      *   *The Archivist:* Represents the long-term cost of Clifford-violations (loss of trust).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Ask if it's true. If yes, say it. If no, don't. If maybe, check if belief makes it true. If yes, say it confidently. Check if archivist will catch you.
      *   *Critique 1:* Too simple. Doesn't separate belief from speech. Doesn't quantify the "mixed" claims. Doesn't weight the archivist properly.

      *   *Attempt 2 (Adding Structure):*
          1.  Evidence Check (Clifford).
          2.  Causality Check (James).
          3.  Risk Check (Archivist).
          4.  Speech/Belief Split.
      *   *Critique 2:* Better. Need to make sure the "mixed claim" (part uptake, part fact) is handled. Need to define "Sufficient Answer."

      *   *Attempt 3 (Refining for the Wall):* Needs to look like a flowchart or a checklist. Let's go with a stepped protocol.
          *   Step 1: The Fact/Will Distinction (Is this uptake-linked?).
          *   Step 2: The Evidence Threshold (Clifford's Line).
          *   Step 3: The James Exception (When can we override Step 2?).
          *   Step 4: The Archivist Test (Long-term cost).
          *   Step 5: The Belief/Speech Gap (What do we feel vs. what do we say).

  4.  **Addressing Specific Requirements:**

      *   *Req 1 (Belief vs. Speech):* I need a specific step where these diverge. Maybe Step 5. If the procedure says "Don't Believe" but "Do Say," that's a specific output (Strategic Confidence). If "Do Believe" but "Don't Say," that's Restraint.
      *   *Req 2 (Uptake Test):* Need a "Causal Weighting." Is the claim $X\%$ dependent on behavior? If $>50\%$, it's Jamesian. If $<50\%$, it's Cliffordian.
      *   *Req 3 (The Archivist):* Make this a "Credibility Budget." Every time you stretch the truth, you spend budget. If budget is low, you can't stretch.

  5.  **Developing the Cases:**

      *   *(a) Hospital Capacity:* Mixed claim. 60/40 odds. Uptake linked. Archivist risk high if hospitals overflow.
      *   *(b) Water Safety:* Fact-based (mostly). 80% sure. Not uptake linked (boiling doesn't clean the source, just protects people). High harm if wrong.
      *   *(c) Staff Morale:* Purely Jamesian. Truth depends on belief. But internal vs. external. Archivist risk (leaks).

  6.  **Refining the "Break Points":**
      *   Where does it fail? When the "Causal Weight" is guessed wrong. When the Archivist risk is underestimated. When "Strategic Confidence" becomes lying.

  7.  **Finalizing the Format:**
      *   Use bold headers.
      *   Use "STOP" and "HAND-OFF" markers.
      *   Keep language directive ("Do this," "Ask this").
      *   Ensure the philosophy is embedded, not cited.

  8.  **Self-Correction during drafting:**
      *   *Correction:* The prompt asks *not* to collapse belief and speech. I need to make sure the procedure explicitly outputs two different variables: `Internal_Stance` and `Public_Stance`.
      *   *Correction:* The Archivist shouldn't just be a veto; they are a tax on "Jamesian" moves.
      *   *Correction:* For the water case, boiling water is a protective action, not a truth-making action. So James doesn't apply the same way. It's pure risk assessment.

  9.  **Final Polish:** Check tone. Needs to be professional, direct, slightly weary but functional. No fluff.

  *(Self-Correction on the Philosophy)*: Make sure I don't misrepresent James. James argues that for *genuine options* (living, forced, momentous) where evidence is insufficient, passion can decide. In public health, "momentous" is easy. "Living" (plausible) is the key. "Forced" (no alternative) is the tricky part. I need to translate "Passional Nature" into "Strategic Necessity."

  *(Refining the Uptake Test)*: How to score a mixed claim?
  *   Fact Component ($F$): Will hospitals hold regardless of behavior? (Staffing, Variant).
  *   Will Component ($W$): Will hospitals hold *if* behavior changes?
  *   If $W$ is the dominant variable, James applies. If $F$ is dominant, Clifford applies.

  *(Refining the Archivist)*: The Archivist cares about *inconsistency* and *falsification*.
  *   Falsification: You said X, X didn't happen.
  *   Inconsistency: You said X today, Y last week.
  *   The procedure needs to flag "Falsification Risk."

  Let's build the "Wall Chart."

  *   **Title:** The Clifford-James Protocol for Public Health Comms.
  *   **Structure:** 5 Gates.
  *   **Outputs:** Internal Stance / External Stance.

  *   **Case Runs:**
      *   (a) Hospital: Mixed. High uptake. Moderate evidence. -> External: Confident. Internal: Contingent.
      *   (b) Water: Low uptake. High harm. -> External: Cautious. Internal: Cautious.
      *   (c) Staff: High uptake. Low evidence. -> External: Confident. Internal: Aspirational. (But watch the leak risk).

  *   **Failure Modes:** "Boy Who Cried Wolf" (Archivist wins), "Fatalism" (Clifford wins), "Cynicism" (Split becomes dissociation).

  Okay, ready to write. I will structure it exactly as requested: The Procedure first, then the Cases, then the Break Points. I will avoid academic preamble. I will make it look like a tool.

  *Wait, one nuance:* The prompt asks "Where the procedure stops and says no, and where it hands the decision back to a person because its a values question." I need to mark those clearly.

  *Another nuance:* "Don't collapse belief and speech." I need to ensure the final output of the procedure is two distinct instructions.

  *Archivist Weight:* Is it a veto? No, it's a cost function. If the cost > benefit, veto. I'll frame it as a "Credibility Tax."

  *Let's finalize the steps:*
  1.  **Causal Audit:** Is this fact-driven or will-driven? (The James/Clifford split).
  2.  **Evidence Floor:** What is the hard data? (Clifford's minimum).
  3.  **The James Override:** Can belief change the outcome? (The Uptake Test).
  4.  **The Archivist Tax:** What is the cost of being wrong later?
  5.  **The Split Decision:** Determine Internal vs. External stance.

  *Let's refine the "Mixed Claim" scoring.*
  Score 0-10. 0 = Pure Fact (Water). 10 = Pure Will (Morale).
  If > 5: James permissions activate.
  If < 5: Clifford restrictions dominate.

  *Let's refine the Archivist.*
  They punish *falsification* more than *uncertainty*.
