answer: |-
  # THE CLIFFORD-JAMES PROTOCOL
  **For: Public Health Comms Team**
  **Use: When evidence is incomplete and stakes are high.**

  This is not a truth machine. It is a risk allocator. It separates what you must *hold in your head* (to remain honest) from what you must *put in the press release* (to remain effective).

  ---

  ## PART 1: THE DECEDURE

  ### GATE 1: THE CAUSAL AUDIT
  **Question:** Does public belief in this claim materially increase the likelihood of the claim becoming true?
  *   **Test:** If we stay silent, does the probability of the outcome drop by >10%?
  *   **Yes (Uptake-Linked):** This is a **Jamesian Claim**. Belief is a causal factor. Proceed to Gate 2.
  *   **No (Fact-Linked):** This is a **Cliffordian Claim**. Belief is irrelevant to the outcome (e.g., water chemistry, viral genome). Proceed to Gate 3.
  *   **Mixed:** Score the claim 0–10. (0 = Pure Fact, 10 = Pure Will).
      *   *Scoring:* If the outcome depends on behavior *and* external factors (staffing, variant), estimate the behavioral weight. If behavior is >50% of the variance, treat as Jamesian. If <50%, treat as Cliffordian.

  ### GATE 2: THE EVIDENCE FLOOR (Clifford's Brake)
  **Question:** Is there *any* hard evidence that contradicts the claim?
  *   **Stop Condition:** If hard data explicitly contradicts the claim (e.g., models show collapse even with compliance), **STOP**. Do not publish. This is lying, not comms.
  *   **Pass Condition:** Evidence is inconclusive, missing, or ambiguous. Proceed to Gate 3.

  ### GATE 3: THE JAMES OVERRIDE (The Will Test)
  *(Only for Jamesian Claims from Gate 1)*
  **Question:** Is this a "Genuine Option"?
  1.  **Living:** Is the claim plausible? (Not magic).
  2.  **Forced:** Is there a cost to inaction? (e.g., if we don't motivate contact cutting, hospitals *will* overflow).
  3.  **Momentous:** Is the opportunity unique? (e.g., pre-holiday surge).
  *   **If Yes:** You are permitted to adopt the "Confident Stance" externally, even if internal certainty is low.
  *   **If No:** Revert to Cliffordian standards (Gate 4).

  ### GATE 4: THE ARCHIVIST TAX (Credibility Cost)
  **Question:** If this claim is proven false in 6 months, can the Archivist prove we knew better?
  *   **High Risk:** We have internal numbers/models we are hiding. (The Archivist will leak them).
  *   **Medium Risk:** The outcome is binary and verifiable (e.g., "Hospitals will hold" vs. "Hospitals overflow").
  *   **Low Risk:** The outcome is subjective or long-term (e.g., "Morale will improve").
  *   **Decision:**
      *   **High Risk:** You must hedge. Use "Projected," "Modelling suggests," "If..."
      *   **Medium Risk:** You may be confident, but you must document the *conditions* for truth (e.g., "Provided staffing holds").
      *   **Low Risk:** Full confidence permitted.

  ### GATE 5: THE SPLIT (Belief vs. Speech)
  **Output:** Define two stances.
  1.  **Internal Stance (What you believe):**
      *   If Cliffordian: Must match Evidence Floor.
      *   If Jamesian: Can be "Provisional Commitment" (I believe this *so that* it becomes true).
  2.  **External Stance (What you say):**
      *   If Archivist Risk is Low + Jamesian: **Confident.** ("We will hold.")
      *   If Archivist Risk is High + Cliffordian: **Careful.** ("Data suggests safety.")
      *   If Jamesian + High Risk: **Conditional Confidence.** ("We will hold *if*...")

  **HAND-OFF POINT:** If Gate 4 (Archivist) and Gate 3 (James) conflict (i.e., high uptake need but high credibility risk), this is a **Values Question**. Escalate to Deputy/CMO. Do not solve via procedure.

  ---

  ## PART 2: CASE RUNS

  ### CASE (A): Hospital Capacity
  *Claim:* "If everyone cuts contacts by a third, hospitals will hold."
  *Data:* 60/40 model. Modellers won't go on record.
  *   **Gate 1 (Causal):** **Jamesian (Score 8/10).** Outcome depends heavily on public behavior.
  *   **Gate 2 (Evidence):** **Pass.** No data contradicts it (60% is not contradiction).
  *   **Gate 3 (Override):** **Yes.** Living, Forced, Momentous.
  *   **Gate 4 (Archivist):** **Medium-High Risk.** Binary outcome (hold/fail). If we fail, Archivist asks "Why did you say 'will' instead of 'might'?"
  *   **Gate 5 (Split):**
      *   **Internal Stance:** *Contingent.* "It is more likely than not, provided the variant doesn't shift."
      *   **External Stance:** *Conditional Confidence.* "Our modelling shows hospitals will hold **if** we cut contacts." (Do not drop the 'if').
      *   **Verdict:** Publish. The 'if' protects against the Archivist; the 'will' secures the uptake.

  ### CASE (B): Water Safety
  *Claim:* "The water is safe."
  *Data:* Lab 36h late. 80% sure.
  *   **Gate 1 (Causal):** **Cliffordian (Score 1/10).** Public belief does not clean the water. Boiling is protective, not truth-making.
  *   **Gate 2 (Evidence):** **Fail.** 20% uncertainty on a toxicity claim is insufficient evidence for "Safe." Clifford's Rule applies strictly.
  *   **Gate 3 (Override):** **N/A.** Not a Jamesian claim.
  *   **Gate 4 (Archivist):** **High Risk.** If someone gets sick, the Archivist has a permanent record of "Agency said safe."
  *   **Gate 5 (Split):**
      *   **Internal Stance:** *Uncertain.* "Likely fine, but unverified."
      *   **External Stance:** *Precautionary.* "No known contamination, but boil until confirmed."
      *   **Verdict:** Do not say "Safe." Say "No known risk." The cost of error (health) outweighs the cost of panic (boiling water).

  ### CASE (C): Staff Morale
  *Claim:* "The worst is behind us."
  *Data:* Unknown. CMO wants to prevent resignations.
  *   **Gate 1 (Causal):** **Jamesian (Score 10/10).** Belief *creates* the reality. If staff quit, the worst is *not* behind us.
  *   **Gate 2 (Evidence):** **Pass.** No data contradicts it (future is unknowable).
  *   **Gate 3 (Override):** **Yes.** Forced (quit vs. stay), Momentous (workforce collapse).
  *   **Gate 4 (Archivist):** **Low Risk (External) / High Risk (Internal).** The Archivist cannot prove this false publicly easily. However, if this leaks to staff as "management lying," trust collapses internally.
  *   **Gate 5 (Split):**
      *   **Internal Stance:** *Aspirational.* "We are betting on this."
      *   **External Stance:** *Confident.* "The worst is behind us."
      *   **Verdict:** **Proceed, but with a caveat.** The CMO can say it, but must frame it as a commitment ("We are turning the corner") rather than a prediction ("The data shows it's over"). This protects against the Archivist if a new variant hits (you can say "We committed to turning it, not that the virus agreed").

  ---

  ## PART 3: FAILURE MODES & LIMITS

  **1. Where the Procedure Breaks**
  *   **The Causal Audit (Gate 1):** This is a judgement call dressed as math. You will overestimate how much your press release changes behavior. *Mitigation:* Review past campaigns quarterly. If uptake didn't move, stop using Jamesian overrides.
  *   **The Archivist Tax (Gate 4):** You cannot predict what will leak. *Mitigation:* Assume anything written in an email or Slack regarding the claim *will* be public. Draft the External Stance in the open.

  **2. The Six-Month Drift**
  *   **Dissociation:** If you run the Split (Gate 5) too often, your team will stop believing anything you say. You become the shipowner.
      *   *Fix:* Limit Jamesian Overrides to 1 per major crisis cycle.
  *   **Credibility Inflation:** If you use "Conditional Confidence" too often ("Hospitals will hold *if*..."), the public ignores the condition and hears "Hospitals will hold."
      *   *Fix:* If the condition is >30% unlikely, downgrade to "Projected."

  **3. Decisions to Keep Out of the Procedure**
  *   **Legal/Statutory Mandates:** If the law requires specific wording, do not run this protocol.
  *   **Immediate Life Safety:** If the risk is immediate death (e.g., chemical spill), default to Clifford (Maximum Caution). Jamesian gambles are for systemic resilience, not acute toxicity.
  *   **Political Cover:** Do not use Gate 3 (James Override) to protect politicians. It must be strictly for public health uptake or workforce retention.

  **4. The Hard Stop**
  If the **Internal Stance** drops below 20% probability (you actively believe it is false), **STOP**. No amount of Jamesian logic permits asserting a known falsehood. That is not comms; that is fraud. The Archivist will win, eventually.
