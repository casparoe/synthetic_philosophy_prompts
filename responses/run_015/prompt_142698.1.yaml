prompt: |-
  I'm helping a regulatory agency choose one decision rule for cost-benefit analysis under risk: a single formula that staff economists will apply to hundreds of unrelated projects a year (vaccine approvals, dam safety, wildfire mitigation, biosecurity containment), with the resulting number published and open to legal challenge. Before I look at any candidate rule, I want the specification. What must a risk-weighting rule deliver to count as adequate for that job, with the case or consideration behind each requirement, and which of those requirements are genuinely non-negotiable as opposed to the hobby-horses of one camp?

  My draft list, with the case I have in mind for each:

  1. Take a definite stand on the classic Allais and common-ratio patterns — accommodate them in the formalism, or give a principled account of why they are error. Silence is not acceptable.
  2. Stay calibrated across stake sizes: modest, well-documented aversion to a small-stakes coin flip must not compound into refusing plainly favorable large-stakes gambles.
  3. Give real weight to low-probability, irreversible, catastrophic losses, rather than letting them vanish because they are unlikely.
  4. Avoid fanaticism — a vanishingly small chance of an astronomically large payoff must not automatically dominate every ordinary project — and avoid achieving this by a hard probability cutoff, since any cutoff can be defeated by slicing one risk into many smaller ones.
  5. Behave consistently under changes of bracketing: a portfolio of independent projects should not get one verdict project-by-project and the opposite verdict as a single aggregate distribution, or if it does, the rule must say which bracketing is authoritative and why.
  6. Say whether it evaluates a single decision or the policy of following the rule repeatedly, and what it recommends when a plan that is optimal from the outset is one the agency will later want to abandon midway.
  7. Say whose risk attitude enters the formula when the people bearing a risk are not the people receiving the benefits, and when citizens disagree among themselves; it must not quietly substitute the agency's own attitude for the social one.
  8. Pin the risk attitude down by a fixed, publicly specified calibration procedure rather than fitting it to each decision, so that a verdict cannot be retrofitted to an intuition.

  Tell me which of these are real desiderata for this job and which I should drop. Flag any pair you suspect cannot be jointly satisfied — I think 3 and 4 are jointly unsatisfiable, and that 5 is unsatisfiable together with matching ordinary narrow-bracketed choices, but I want to know if either suspicion is wrong. Name the single requirement that does the most work in excluding otherwise attractive candidates, and add any requirement I have missed that would disqualify a rule outright. Then, in a few lines each and no more, score three contenders: expected utility with a concave utility index, a risk-weighted rule that re-weights probabilities rather than only outcomes, and a safety-first rule that maximizes the worst outcome.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A regulatory agency needs a *single* decision rule for cost-benefit analysis (CBA) under risk for hundreds of diverse projects (vaccines, dams, wildfires, biosecurity).
      *   **Constraints:** The rule will be applied by staff economists, published, and open to legal challenge.
      *   **Task:** Evaluate the user's draft list of 8 requirements (desiderata). Identify which are real/negotiable vs. hobby-horses. Identify impossibility theorems/trade-offs (specifically regarding 3 & 4, and 5). Identify the single most exclusionary requirement. Add any missing critical requirements. Score three specific contenders (EU, Risk-Weighted, Safety-First) briefly.
      *   **Tone:** Rigorous, technical, decisive, regulatory/legal awareness.

  2.  **Evaluate the Draft List (Requirements 1-8):**

      *   *1. Allais/Common-Ratio:* Is this necessary for a *regulatory* rule? Allais paradoxes highlight deviations from EUT. While theoretically interesting, a regulatory rule *must* pick a side. Usually, EUT is the legal standard (arbitrary/capricious review favors consistency). Accommodating Allais often leads to dynamic inconsistency. *Verdict:* Keep, but clarify that "principled account of why they are error" is the only viable path for a stable regulatory rule.
      *   *2. Calibration (Rabin's Critique):* Crucial. If small-stakes risk aversion implies absurd large-stakes rejection, the rule is broken. *Verdict:* Non-negotiable.
      *   *3. Catastrophic/Low-Prob:* Essential for regulatory mandate (e.g., existential risk, dam failure). *Verdict:* Non-negotiable.
      *   *4. Anti-Fanaticism (Pascal's Mugging):* Essential. Cannot let tiny probabilities of infinite utility dominate budget. Hard cutoffs are gameable. *Verdict:* Non-negotiable.
      *   *5. Bracketing/Aggregation:* Crucial for portfolio management vs. project-by-project. If the rule gives different answers based on how you group projects, it's vulnerable to manipulation. *Verdict:* Non-negotiable, but creates tension with EUT if narrow bracketing is preferred by stakeholders.
      *   *6. Dynamic Consistency/Policy vs. Act:* Important for legal defensibility. If the rule says "do X" now but "abandon X" later, it's time-inconsistent. *Verdict:* Keep.
      *   *7. Distribution/Equity (Who bears risk?):* This is actually *outside* standard risk decision rules (which usually assume a social welfare function). However, for a regulatory agency, *whose* utility counts is a legal mandate. *Verdict:* Keep, but note it's often a pre-processing step (equity weighting) rather than the risk rule itself.
      *   *8. Fixed Calibration:* Essential to prevent "result-oriented" analysis. *Verdict:* Non-negotiable.

  3.  **Analyze Trade-offs and Impossibility Results:**

      *   *3 vs. 4 (Catastrophe vs. Fanaticism):* The user suspects these are jointly unsatisfiable.
          *   *Analysis:* 3 wants heavy weight on low-prob/high-loss. 4 wants to ignore low-prob/high-gain (or low-prob/anything extreme). Standard EUT fails 3 (linear probabilities wash out catastrophes). Risk-weighted utility (RWU) can handle 3 but often fails 4 (if the weighting function is too heavy on tails, you get fanaticism). Bounded utility handles 4 but might dampen 3.
          *   *Resolution:* They are in tension, but not logically impossible *if* the rule distinguishes between loss and gain domains or uses a specific functional form (e.g., bounded utility + specific probability weighting). However, a *single* formula often struggles here. The user's suspicion is largely correct: satisfying 3 strongly often invites 4.
      *   *5 (Bracketing):* The user suspects 5 is unsatisfiable with narrow bracketing.
          *   *Analysis:* EUT satisfies 5 (linearity of expectation). Non-expected utility (like Rank-Dependent) often violates 5 (sub-additivity/super-additivity). If the rule must work for a portfolio, it *must* satisfy 5. If it satisfies 5, it essentially forces EUT-like linearity in probabilities.
          *   *Resolution:* 5 is a hard constraint for a regulatory *portfolio*. This effectively kills most non-EUT models.
      *   *The "Single Requirement" doing the most work:* Requirement 5 (Bracketing/Aggregation Consistency). If you require that the sum of parts equals the whole, you force linearity in probabilities, which pushes you back toward Expected Utility, making it hard to satisfy 1 (Allais), 3 (Catastrophe), and 4 (Anti-Fanaticism) simultaneously.

  4.  **Identify Missing Requirements:**

      *   *Transparency/Computability:* Can a court understand it?
      *   *Legal Standard:* "Arbitrary and Capricious." The rule must be defensible under administrative law.
      *   *Missing:* **Separability of Irrelevant Alternatives.** If Project A is better than B, adding Project C shouldn't flip the ranking of A vs B. (Related to 5, but distinct).
      *   *Missing:* **Monotonicity.** If an outcome improves, the project value shouldn't drop.

  5.  **Score the Contenders:**

      *   *Expected Utility (EUT) with Concave Utility:*
          *   Pros: Satisfies 5 (Bracketing), 6 (Dynamic), 8 (Calibration). Legally standard.
          *   Cons: Fails 3 (Catastrophe - linear prob), Fails 1 (Allais - describes it as error), Struggles with 4 (unbounded utility leads to fanaticism, bounded solves 4 but dampens 3).
      *   *Risk-Weighted Utility (RWU) / Rank-Dependent:*
          *   Pros: Satisfies 1 (Allais), Can satisfy 3 (overweight tails).
          *   Cons: Fails 5 (Bracketing/Aggregation - non-linear probs don't sum), Fails 6 (Dynamic inconsistency), Hard to calibrate (8).
      *   *Safety-First (Maximin/Threshold):*
          *   Pros: Satisfies 3 (Catastrophe focus).
          *   Cons: Fails 4 (can be fanatical about tiny risks), Fails 5 (Bracketing), Fails 2 (Calibration - ignores upside completely), Legally vulnerable (ignores benefits).

  6.  **Drafting the Response:**

      *   *Structure:*
          1.  Assessment of the 8 Requirements (Keep/Drop/Modify).
          2.  The Impossibility/Trade-off Analysis (3 vs 4, 5 vs others).
          3.  The "Killer" Requirement.
          4.  Missing Requirement.
          5.  Scoring the Contenders.
      *   *Tone Check:* Be direct. Don't waffle. Acknowledge the legal/administrative context.
      *   *Refining the "3 vs 4" point:* It's not strictly impossible, but it requires bounded utility *and* specific probability weighting. But combined with 5, it becomes nearly impossible for non-EUT.
      *   *Refining the "5" point:* Requirement 5 is the "State-Independence/Linearity" constraint. It is the strongest filter.
      *   *Refining the "Missing" point:* Add "Monotonicity" or "Transparency." Actually, "Transparency/Intelligibility" is key for legal challenge. Let's add **Intelligibility to a Generalist Judge**.

  7.  **Final Review against Constraints:**
      *   "Few lines each" for the scoring.
      *   Address the specific suspicions (3&4, 5).
      *   Identify the non-negotiables.

      *(Self-Correction during drafting)*: Regarding Requirement 1 (Allais). For a regulatory rule, accommodating Allais is actually dangerous because it implies dynamic inconsistency. The "principled account of why they are error" is the only safe path. I should emphasize that.
      Regarding Requirement 7 (Distribution). This is technically distinct from *risk* attitude. It's equity weighting. I should note that this is a pre-condition, not part of the risk rule itself, but still necessary.
      Regarding the "Killer" Requirement: It's definitely 5. If you can't aggregate, you can't do a budget.
      Regarding 3 vs 4: With EUT, you need bounded utility to solve 4, but that makes 3 harder (diminishing marginal disutility of loss). With RWU, you can solve 3, but 5 breaks. So the tension is real.

      *Let's finalize the scoring:*
      *   EUT: Passes 5, 6, 8. Fails 1, 3 (without tweaks).
      *   RWU: Passes 1, 3. Fails 5, 6.
      *   Safety-First: Passes 3. Fails 2, 4, 5.

      *Wait, one more check on 3 vs 4:* Weitzman's Dismal Theorem suggests that with fat tails and unbounded utility, 4 is impossible. So bounded utility is required for 4. But bounded utility limits the pain of catastrophe for 3. So yes, 3 and 4 are in deep tension without very specific functional forms.

      *Missing Requirement:* **Monotonicity.** If a project gets better in some states and worse in none, its value must not decrease. Some risk rules violate this. Also **Transparency**. I will combine them as "Operational Transparency."

      *Let's write.*
answer: |-
  ### Assessment of Requirements

  **Keep as Non-Negotiable:**
  *   **2 (Calibration):** Non-negotiable. Rabin's calibration theorem shows that modest risk aversion at small stakes implies absurd rejection of favorable large gambles under standard models. A rule failing this is mathematically broken for broad application.
  *   **5 (Bracketing):** Non-negotiable. A regulatory budget is a portfolio. If the rule yields different verdicts based on how projects are bundled, it invites gaming and violates fiduciary duty.
  *   **8 (Fixed Calibration):** Non-negotiable. Without ex-ante parameter fixation, the rule is discretionary, rendering it vulnerable to "arbitrary and capricious" legal challenge.

  **Keep but Refine:**
  *   **1 (Allais):** Keep, but the only defensible position for a *regulatory* rule is to declare Allais deviations errors. Accommodating them typically violates dynamic consistency (Req 6), creating legal liability when plans are abandoned mid-stream.
  *   **3 (Catastrophe) & 4 (Fanaticism):** Keep both, but acknowledge they are in extreme tension. Satisfying 3 requires heavy tail weight; satisfying 4 requires bounded utility or tail truncation. They are not logically incompatible, but they constrain the functional form to a razor's edge.
  *   **6 (Dynamic Consistency):** Keep. A rule that recommends abandoning a previously optimal plan violates administrative finality and creates reliance damages.
  *   **7 (Distribution):** Keep, but classify this as a *pre-processing* step (equity weighting of outcomes) rather than part of the risk rule itself. The risk rule operates on the weighted outcomes.

  **Drop:**
  *   None are "hobby-horses," but **1** is the most fragile. If you prioritize 5 and 6, you are forced into Expected Utility, which treats Allais patterns as errors by definition.

  ### Impossibility and Trade-offs

  **Your suspicion on 3 and 4 is correct.** Under Expected Utility, satisfying 4 requires bounded utility, which dampens the disutility of catastrophes (violating 3). Satisfying 3 requires unbounded or steeply increasing marginal disutility, which invites fanaticism (violating 4). Non-Expected Utility models can separate these but usually break 5.

  **Your suspicion on 5 is correct.** Requirement 5 (Aggregation Consistency) effectively mandates linearity in probabilities. This excludes almost all non-Expected Utility models (including Rank-Dependent and Cumulative Prospect Theory), which violate sub-additivity. You cannot have a rule that respects common-ratio preferences (Req 1) *and* aggregates consistently across a portfolio (Req 5).

  ### The Single Exclusionary Requirement

  **Requirement 5 (Bracketing/Aggregation).**
  This does the most work. It forces the decision functional to be linear in probabilities. This eliminates the entire class of risk-weighted probability models (which are the only ones that naturally satisfy Req 1 and Req 3). It forces you back toward Expected Utility, making Req 3 and 4 the primary battlegrounds for functional specification (e.g., choosing the utility curve).

  ### Missing Requirement

  **Operational Transparency (Intelligibility).**
  The formula must be computable and explainable to a generalist judge without requiring expert testimony on the derivation of the risk parameter itself. If the rule requires solving complex fixed-point equations or simulating distributions to derive a single scalar, it will fail legal review for being "opaque."

  ### Scoring Contenders

  **1. Expected Utility (Concave Utility Index)**
  *   **Score:** Passes 2, 5, 6, 8. Fails 1, 3.
  *   **Verdict:** The legal safe harbor. It satisfies aggregation and dynamic consistency perfectly. However, it treats catastrophic low-probability events as negligible (violating 3) and must declare Allais behavior irrational (violating 1). It avoids fanaticism only if utility is bounded.

  **2. Risk-Weighted Utility (Probability Reweighting)**
  *   **Score:** Passes 1, 3. Fails 5, 6, 8.
  *   **Verdict:** Theoretically attractive for catastrophic risk (3) and human intuition (1). However, it violates aggregation (5), meaning project valuation changes based on portfolio context. It is also dynamically inconsistent (6), inviting legal challenge if long-term policies are revised.

  **3. Safety-First (Maximin/Threshold)**
  *   **Score:** Passes 3. Fails 2, 4, 5.
  *   **Verdict:** Regulatory poison. It ignores benefit magnitude (violating 2), creates fanaticism regarding tiny risks (violating 4), and fails aggregation (5). It is legally indefensible for cost-benefit analysis as it effectively vetoes any project with non-zero risk regardless of upside.
