  *(Self-Correction on CLT)*: Wait, if I Grant, the CLT loses the land. That's a huge affordability loss. But the prompt says the CLT is on the *petitioning block*. The denial standard is harm to *outside* households. So legally, I can't deny based on CLT harm. I should note this limitation. It strengthens the "Grant" decision legally, even if morally complex.

  *(Self-Correction on Clean Hands)*: The user is worried about keeping a "scorecard." I need to frame this not as punishment for past behavior, but as a principle of equitable distribution. "If not here, where?"

