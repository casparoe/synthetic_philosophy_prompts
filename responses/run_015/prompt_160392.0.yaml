answer: |-
  **MEMORANDUM**

  **TO:** Board of Zoning Adjustment
  **FROM:** [Your Name]
  **DATE:** [Month] 10, 2024
  **RE:** Halsey Street Block Face Petition (4th–5th) – Recommendation for Decision

  **Recommendation**
  I recommend we **GRANT** the petition to rezone the east block face of Halsey between 4th and 5th to R-4.

  This is not an easy decision. The Block Choice Ordinance ("Little Local Option") was designed to decentralize zoning power, but it forces us to weigh localized consent against citywide needs and spillover effects. After reviewing the record, I believe the petition meets the statutory thresholds, and the opposition, while grounded in real concerns, does not meet the specific legal standard required for denial. Furthermore, the city's immediate need to secure state funding tips the equity scale toward approval.

  **The Legal Standard: Inside vs. Outside Harm**
  Our authority to deny is narrow. We cannot deny based on whether we like the ordinance, whether we like fourplexes, or even whether we think the renter-weighting compromise was fair. We can only deny if the change causes *"substantial harm to the distinctive interests of households outside the petitioning block face."*

  This distinction drives my analysis.
  1.  **Inside Harms (CLT & Renters):** The Community Land Trust (CLT) losing its purchase option and the renters in the six-flat facing potential displacement are serious moral concerns. However, these parties are *inside* the petitioning block. The CLT holds parcels on Halsey; the renters live on Halsey. The ordinance explicitly settled how their interests are weighed (the 60% owner signature and the half-weight resident assent). To deny the petition to protect them would be to override the very voting mechanism the Council enacted. We cannot rewrite the ordinance from the dais.
  2.  **Outside Harms (Rowan Street Association):** The Rowan Street Association (RSA) represents households *outside* the block face. Their concerns—school capacity, sewer load, and parking spillover—are the only valid grounds for denial under our standard.

  **The Case for Denial (Steelman)**
  The RSA's argument is the strongest case against granting. They contend that a block face is an arbitrary unit for zoning decisions because housing impacts do not stop at the curb. They are right that a fourplex generates more students, more water flow, and more cars than a duplex, and those costs are borne by the cross-streets and the opposite face who had no vote.

  Their strongest point is the "all-affected principle": democratic legitimacy requires that everyone subject to a decision should have a say. By construction, this ordinance exports costs to neighbors who are silenced. The school is already at 102% capacity. The sewer system is combined and aging. If we grant this, we are effectively telling the Rowan Street neighbors that their infrastructure capacity is subordinate to the Halsey owners' development rights. That is a tangible harm.

  **Why I Recommend Granting Anyway**
  I weigh three factors that overcome the RSA's objection.

  **1. Infrastructure Deficits are City Problems, Not Zoning Bars**
  The school capacity and sewer issues are failures of city planning and capital budgeting, not inherent harms of the zoning classification. It is inequitable to freeze housing production because the School Department hasn't redrawn lines or the Water Authority hasn't upgraded pipes. Denying this petition punishes the petitioners for the city's failure to invest. We should condition approval on cooperation with infrastructure planning, but we cannot use existing deficits as a veto on housing rights granted by ordinance.

  **2. The "Clean Hands" of Equity**
  I have struggled with whether the RSA's history matters. They have opposed every upzoning in this city for six years. Some argue we should judge only this site, not the parties. But zoning is cumulative. When a neighborhood group systematically blocks housing across the city, they are effectively choosing who bears the burden of growth. If RSA succeeds here, after blocking projects elsewhere, they establish a precedent where established neighborhoods can opt out of citywide housing needs entirely.

  Equity requires a shared burden. If the RSA had supported reasonable density elsewhere, their claim to protection here would carry more weight. Since they have not, granting this petition restores a balance. It is not punishment; it is consistency. We cannot allow a "not anywhere" strategy to succeed by shifting to "not here" the moment a petition clears the legal hurdles.

  **3. The State Grant Deadline**
  We cannot ignore the $11M state grant tied to net added capacity by June 30. Staff confirm Halsey is the only project plausibly permittable in time. Losing this funding harms every household in this city, including the renters and families the RSA claims to protect. The citywide interest in securing this capital outweighs the localized friction of increased density on Halsey.

  **Conditions and Durability**
  I considered conditioning approval on durability (preventing re-zoning back in 2028) to protect the CLT. However, I do not believe we have the authority to alter the ordinance's three-year re-petition window. Adding conditions that restrict statutory rights risks legal challenge that would kill the project anyway. The CLT risk is real, but it is a risk created by the ordinance's structure, not this hearing.

  **Conclusion**
  The Block Choice Ordinance asks us to trust local consensus unless it breaks something elsewhere. The consensus here is clear under the rules provided. The "breakage" elsewhere is manageable infrastructure strain, not substantial harm.

  **Motion:**
  I move to approve the rezoning petition for the east block face of Halsey between 4th and 5th to R-4, effective immediately upon recording. I direct staff to flag this project for priority review to meet the June 30 state grant deadline.

  I will be prepared to discuss the renter-weighting compromise and the CLT dilemma during the hearing, but I cannot vote to deny a petition that meets the code requirements based on harms to parties who were granted a vote under that same code, or based on infrastructure gaps the city must fix regardless of this zoning.
