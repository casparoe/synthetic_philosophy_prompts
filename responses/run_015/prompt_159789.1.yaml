  However, the architecture bears stress. Below is the audit of tensions, ordered by severity, followed by my recommendation for the single necessary revision.

  ### Tensions Ordered by Severity

  **1. The Ontological Status of the Limit (Commitment 2 vs. 4 & 5)**
  *   **Severity:** Critical.
  *   **The Tension:** Commitment (4) asserts token physicalism: every particular is nothing over and above its finite microphysical constituents. Commitment (2) asserts that the phenomenon (e.g., phase transition) *really lives* in the infinite system, not the finite one.
  *   **Why it is genuine:** These are contradictory ontological claims. If the phenomenon *really* resides in the infinite system, then the finite physical particular (the fluid in the beaker) does not strictly instantiate the phenomenon; it only mimics it. If the finite particular *does* instantiate the phenomenon (as 4 requires), then the phenomenon does not *really* live in the infinite system. Commitment (5) attempts to quarantine this by calling (2) explanatory, but the phrasing in (2) ("where the phenomenon really lives") is explicitly ontological. It breaks the quarantine.
  *   **Dissolvable?** No. You cannot have it both ways. Either the infinite limit is real (threatening 4) or it is not (threatening the strong reading of 2).

  **2. The Possibility of Derivation (Commitment 1 vs. 5)**
  *   **Severity:** High.
  *   **The Tension:** Commitment (1) states that inter-theoretic reduction via derivation is a "fiction" and that the relation is limiting/correspondence. Commitment (5) states that ontology is settled by the fundamental theory and an "in-principle derivation."
  *   **Why it is genuine:** If (1) is correct—specifically given your reliance on singular limits in (2)—then an in-principle derivation from the finite micro-theory to the macro-behavior is mathematically impossible, not just computationally difficult. Singular limits block the derivation. Therefore, the criterion for settling ontology in (5) can never be met. (5) posits a key that (1) says does not fit the lock.
  *   **Dissolvable?** Only if you redefine "derivation" in (5) to include limiting procedures, but this weakens (1)'s claim that derivation is a fiction.

  **3. Explanatory Priority vs. Causal Base (Commitment 3 vs. 4)**
  *   **Severity:** Low (Dissolvable).
  *   **The Tension:** Commitment (3) claims the coarse-grained model explains *better*. Commitment (4) claims higher-level causal claims are *just* microphysical claims under a coarse description.
  *   **Why it dissolves:** Commitment (5) successfully mediates this. If explanation is epistemic (5), then a model can be "better" at explaining (3) without implying that the causal powers reside at the macro level (4). The "Substitution Test" demonstrates explanatory robustness, not ontological independence. As long as you maintain (5), (3) and (4) are compatible.

  ### The Recommended Revision

  You asked for a single revision to straighten out the package, and I will commit plainly: **You must revise Commitment (2).**

  Specifically, you must withdraw the claim that the infinite system is "where the phenomenon really lives."

  **Why this commitment has to go:**
  You identify as a token physicalist (4). This is your anchor. Commitment (2), as currently phrased, is an ontological claim that directly contradicts (4). If you hold that the phenomenon *really* requires the infinite limit to exist, you are no longer a token physicalist regarding phase transitions; you are a structural realist or an emergentist. Commitment (5) cannot save you because (2) explicitly bypasses the epistemic/ontological split by asserting where the phenomenon *lives*.

  To maintain coherence with (4) and (5), the infinite limit must be treated as **explanatorily indispensable but ontologically fictitious.**

  **The Cost:**
  You lose the strong realist reading of the Renormalisation Group. You must accept that the "autonomy" of the special sciences is strictly epistemic, not ontological. The infinite system is not a "home" for the phenomenon; it is a necessary mathematical scaffold for *understanding* the finite phenomenon. You concede that the finite system *does* exhibit the phenomenon, but that our only access to the explanation of *why* requires a fiction (the limit). This weakens the "Autonomy" argument slightly, making it a feature of our cognition and modelling rather than a feature of the world's structure.

  **The Benefit:**
  This revision preserves your Token Physicalism (4) and makes your Ontology/Explanation split (5) watertight. It also resolves the tension with (1): if the infinite limit is a necessary fiction for explanation, then the failure of strict derivation (1) is expected, and the reliance on "in-principle derivation" for ontology (5) can be softened to "in-principle supervenience" (which holds even if derivation is blocked by singularities).

  **In summary:** Keep the math, keep the physicalism, but stop calling the infinite limit the ontological home of the phenomenon. It is the home of the *explanation*, not the *event*.
