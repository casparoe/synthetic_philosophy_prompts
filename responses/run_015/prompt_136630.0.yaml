answer: |-
  1. The tribunals presuppose a robust natural law theory asserting that certain acts constitute inherent moral wrongs punishable regardless of prior statutory prohibition. This commitment is strictly necessary to justify retroactive criminalization where positive law was silent or permissive.
  2. Political legitimacy here relies on a conception of sovereignty that is forfeited through aggressive war, allowing victors to assume judicial authority over defeated states. This fits well with the practice but is underdetermined, as it could alternatively rest on a temporary state of nature between belligerents rather than established jurisdiction.
  3. Rejecting the defense of superior orders necessitates a theory of individual moral agency that prioritizes universal ethical duties over domestic legal obligations. This is compatible with both Kantian deontology and certain utilitarian frameworks, leaving the specific ethical foundation underdetermined.
  4. The exclusion of Allied conduct suggests a pragmatic theory of justice where stability and reconstruction outweigh consistent moral scrutiny of all belligerents. This arrangement is compatible with realist political theory but contradicts strict retributive justice models requiring universal application.
  5. The presentation of judgments as universal principles rather than impositions of will requires a cosmopolitan conception of legal authority that transcends specific national sovereignties. This claim is merely fitting rather than necessary, as the same outcomes could be justified through a realist framework acknowledging power asymmetries without invoking universal morality.
