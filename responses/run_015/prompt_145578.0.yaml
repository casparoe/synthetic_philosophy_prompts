      *   *Mnemonic Debt:* You can't just delete. You have to move the memory.
      *   *Indexical Drift:* "Wall Street" isn't about a wall. "Downtown" isn't about a town. If "Smith Street" is just the address now, changing it costs more than it gains.

      *Structuring the Steps:*
      *   Step 1: Completeness (Hard Stop).
