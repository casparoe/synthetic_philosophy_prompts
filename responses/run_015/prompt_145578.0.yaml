answer: |-
  # The 90-Minute Folder Protocol
  **For:** Heritage Board Meetings
  **Constraint:** No new research. Only what is in the applicant's folder.
  **Goal:** Separate "Honoring" from "Recording," manage memory costs, and respect neighborhood identity.

  ---

  ### Step 1: The Folder Completeness Check
  **Look for:** Evidence in the packet. Not your knowledge, not Google. Just the paper.
  *   **For Removal/Rename:** Does the folder prove the subject did the bad thing *and* the good thing? (We need the whole picture).
  *   **For New Naming:** Does the folder prove the subject's connection to this specific spot?
  *   **Stop Cold:** If the folder is just an opinion piece or a rant with no primary sources/bios, **Reject.** Send it back.
  *   **Pass:** Move to Step 2.

  ### Step 2: Honor vs. Inventory (The Ethics Check)
  **Question:** Is this marker acting as a *shrine* (virtue signal) or a *label* (historical inventory)?
  *   **Statues/Portraits:** Always **Honor**. They imply "This person is a hero."
  *   **Street/Building Names:** Usually **Honor**, but check Step 3.
  *   **Plaques/Signage:** Usually **Inventory**. They imply "This person was here."
  *   **The Rule:** You cannot **Honor** someone whose core legacy violates current human rights standards (e.g., slavery, eugenics, violent suppression of labor). You *can* **Inventory** them if the full story is told.
  *   **Hand Off to Values:** If the folder shows mixed legacy (good AND bad), the Board must vote on whether the bad outweighs the good. The procedure doesn't weigh morals; it just flags the conflict.

  ### Step 3: Indexical Drift Check
  **Question:** What does the name point to *today*?
  *   **Low Drift:** The name still points to the person. (e.g., "Lee Statue" points to Robert E. Lee).
  *   **High Drift:** The name points to the neighborhood identity, not the person. (e.g., "Downtown," or a street name so old residents think it means "The North Side," not the guy named North).
  *   **The Rule:** If **High Drift** is proven (letters from locals saying "This is just our neighborhood name"), **Do Not Rename.** Changing it hurts current community identity more than it corrects history.
  *   **Exception:** If the harm is ongoing/active (e.g., a slur), Drift doesn't matter. Remove.
  *   **Stop Cold:** If Drift is High and harm is historical, **Keep the Name.** (You can add context, but don't change the sign).

  ### Step 4: Mnemonic Debt
  **Question:** If we erase a marker, where does the memory go?
  *   **The Rule:** You cannot create a blank space. If you vote to remove a statue or rename a street, the applicant must propose where the historical record is preserved (e.g., "Moved to museum," "New plaque installed," "Digital archive").
  *   **Stop Cold:** If the request is "Take it down and trash it" with no plan for the history, **Reject.** You owe a debt to the record.
  *   **Pass:** If the debt is paid (memory is relocated), proceed to vote.

  ### Step 5: The Gut Check (Where Procedure Breaks)
  **Flag:** This is where the math stops.
  *   If Step 2 shows mixed legacy, the Board must decide: *Is the good enough to forgive the bad?*
  *   If Step 3 is ambiguous (Is the drift High or Low?), the Board must decide: *Do we prioritize the residents' current identity or historical accuracy?*
  *   **Living Persons:** If the subject is alive, **Reject.** You cannot judge a legacy that isn't finished. (Unless Charter overrides, then flag as "High Risk").

  ---

  # Test Runs

  ### Case A: The Factory Owner Street
  **Request:** Rename "Fordham Street" (Local factory owner).
  **Folder:** Shows he built worker housing (Good) but violently broke strikes with armed guards (Bad).
  **Step 1 (Complete):** Yes. Both sides documented.
  **Step 2 (Honor/Inventory):** Street name = Honor. Mixed legacy. *Hand Off to Values:* Board must weigh housing vs. violence.
  **Step 3 (Drift):** Folder includes 50 resident letters saying, "We don't know who Fordham was, this is just the name of our neighborhood."
  **Result:** **High Drift.**
  **Step 4 (Debt):** N/A (Keeping the name).
  **Step 5 (Gut):** N/A.
  **Final Decision:** **REJECT RENAME.** Keep the street name.
  **Why you might dislike it:** It feels like letting a violent strikebreaker off the hook.
  **Why the procedure forces it:** *Indexical Drift.* The name no longer honors him; it identifies the current residents. Erasing it harms the living community more than keeping it honors the dead man.
  **Mitigation:** Board can vote to install a historical plaque (Inventory) at the old factory site explaining the strikes.

  ### Case B: The Eugenics Scientist Statue
  **Request:** Remove bronze statue of Dr. X.
  **Folder:** Confirms major scientific contributions, but admits serious eugenics writings. Notes City Museum has a permanent exhibit detailing his eugenics work.
  **Step 1 (Complete):** Yes.
  **Step 2 (Honor/Inventory):** Statue = Honor. Eugenics violates human rights standards. **Honor Disqualified.**
  **Step 3 (Drift):** Statue is specific to the man. **Low Drift.**
  **Step 4 (Debt):** Museum exhibit exists. The record is preserved. **Debt Paid.**
  **Step 5 (Gut):** None needed.
  **Final Decision:** **APPROVE REMOVAL.**
  **Note:** Move statue to museum storage or melt down, but ensure the Museum exhibit remains the "Inventory" location.

  ### Case C: The Living Activist Park
  **Request:** Name new park after Ms. Y (Living local activist).
  **Folder:** Charter says it's allowed. Shows her local work.
  **Step 1 (Complete):** Yes.
  **Step 2 (Honor/Inventory):** Naming = Honor.
  **Step 3 (Drift):** New park. **Low Drift.**
  **Step 4 (Debt):** N/A (Adding, not removing).
  **Step 5 (Gut):** **Procedure Break.** The protocol says "No Living Persons" because legacies change. But the Charter allows it.
  **Final Decision:** **REJECT (with Recommendation).**
  **Why:** The procedure flags this as "High Risk." If she changes her mind or is cancelled in 10 years, we are stuck.
  **Workaround:** Name the *building* inside the park after her (easier to change later) or wait. If the Board votes to approve anyway, they must log it as a "Values Override" in the minutes.

  ---

  ### Where You'll Have to Wing It (Gut Flags)
  1.  **The "Mixed Legacy" Weighing:** In Case A, if Drift was Low, you'd have to vote on whether housing workers excuses breaking their skulls. The procedure doesn't solve that math.
  2.  **The Charter Conflict:** In Case C, if the Board *really* wants to name it after the living activist, the procedure says "No," but the law says "Yes." You have to decide if you follow the spirit of the protocol or the letter of the Charter.
  3.  **Defining "Harm":** Is "violent strikebreaking" the same category as "eugenics"? The procedure says "violates human rights," but you have to define the threshold in the room.

  **Quick Tip:** If you get stuck on Step 2, ask: *"If this person walked up to the marker today, would they feel praised or just noted?"* If praised, it's Honor. If noted, it's Inventory.
