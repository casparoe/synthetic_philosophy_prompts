          *   *Drift:* New park, low drift.
          *   *Debt:* N/A (Adding, not removing).
          *   *Outcome:* Procedure might flag "Living" as high risk for future reputation change, but if Charter allows, does the procedure stop it?
          *   *Adjustment:* Let's make the procedure strict on "Honor." Honoring living people is risky ethics.
          *   *Forced Outcome:* Let's make Case A the one that forces a "Keep" decision despite the violence, due to *Indexical Drift*. If the street name *is* the neighborhood identity now, changing it hurts the current residents more than it honors the past. This is often a hard pill to swallow for justice-oriented board members.
          *   *Wait, let's look at Case B again.* If the museum exhibit exists, the *Mnemonic Debt* is paid. So the statue can come down. That seems standard.
          *   *Let's look at Case C.* If the charter allows it, but the ethics say "no living people," the procedure should flag it.
          *   *Decision:* I will make Case A result in *Keeping the Name* due to Indexical Drift. This is often frustrating for people who want to remove a problematic name. The procedure prioritizes current community identity over historical correction if the name has detached from the person.

  4.  **Refining the Procedure Steps (Iterative Polish):**
