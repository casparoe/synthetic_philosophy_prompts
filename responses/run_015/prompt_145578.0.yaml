          *   Indexical Drift (When a name points to the neighborhood, not the person).
      *   **Format:** Ordered steps, clear pass/fail criteria, hand-off points to values/gut.
      *   **Tone:** Casual, practical (for a physical folder).
      *   **Test Cases:**
          *   (A) Factory Owner (Worker housing vs. Strikebreaking).
          *   (B) Scientist (Eugenics vs. Existing Museum Exhibit).
          *   (C) Living Activist (Charter allows vs. Feels off).
      *   **Constraint:** One outcome must be counter-intuitive/unliked but forced by the procedure.
