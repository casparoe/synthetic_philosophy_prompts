prompt: |-
  I am helping to convene a short adversarial collaboration — three meetings and one joint document — between two people who have spent years disagreeing about what the epistemic program in game theory actually delivers. Call the first the Program theorist. She holds that once the belief and rationality assumptions behind the classical solution concepts are made explicit, those concepts stop looking arbitrary: a common prior together with common knowledge of rationality yields correlated equilibrium; the analogous conditions for extensive-form games carry real content about backward induction and about when a threat is credible; and the value of this work is explanatory and classificatory even where it is not predictive. Call the second the Model skeptic. He holds that the assumptions are doing the work and that their content is fixed by modeling choices the analyst makes anyway — how the strategic situation is carved into a game form, what each player is taken to believe about what would have happened at decision points her own strategy excludes, how rich a space of types the model permits — so that the celebrated results are closer to elegant restatements of their premises than to claims about anybody's behavior.

  The collaboration has a consumer, which I want you to keep in view. Its sponsor is an institute that advises regulators who must predict behavior in one-shot, novel strategic situations: a rule is imposed for the first time, the parties have no shared history, culture, or precedent, the interaction will not be repeated, and there is no opportunity to learn from feedback. The sponsor wants to know whether any of the program's output can be used in that setting, with how much confidence, and what would have to be true of the parties for it to apply.

  Our steering committee has floated a further item, which I would like folded in rather than treated separately. Call it the finite-depth proposal: replace common belief in rationality with mutual belief in rationality truncated at some finite depth k; for each k compute the set of action profiles compatible with the truncated hierarchy; and ask how quickly that set approaches the infinite-hierarchy prediction, and whether the rate depends on features of the game such as its size or the number of players. The thought is that this would show whether the common-knowledge idealization is a benign limiting case or is quietly carrying the result. Both camps have so far only gestured at it.

  Write the joint document. I want: (1) a numbered list of claims both parties can sign — about the formalism, about what the representation theorems establish and what they do not, about the status and testability of the common prior assumption, and about what the laboratory literature on dominance-solvable games and guessing games can and cannot show; (2) a table of the residual disagreements, each row giving the disagreement first in neutral language and then in each side's own preferred formulation, worded so that the side in question would actually sign it; (3) for each disagreement, a judgment about whether it is substantive or verbal, and where you judge it verbal, a statement of what each party was using the contested term to exclude; (4) the cruxes — the sub-questions such that a settled answer would move at least one side — with, for each, the concrete case, argument, or body of evidence both would accept as bearing on it, what each side predicts it will show, and what each side would count as evidence against its own position; (5) what the document says about the finite-depth proposal: whether it is a genuine test of the program, a distraction, or something in between, and what result would count as vindicating the skeptic's worry about the idealization.

  Do not buy agreement cheaply. I would rather have a short agreed list and a sharply stated disagreement than formulations so hedged that neither party is committed to anything by signing. Where you think one side is simply right on a point, say so in a brief note addressed to me, outside the document, rather than fudging the text the two of them are supposed to put their names to.
reasoning: |-
  Here's a thinking process that leads to the suggested joint document:

  1.  **Analyze the Request:**
      *   **Task:** Write a joint document resulting from a short adversarial collaboration (3 meetings) between two game theory epistemologists: the "Program Theorist" (PT) and the "Model Skeptic" (MS).
      *   **Context/Consumer:** A regulatory institute advising on *one-shot, novel strategic situations* (no history, no repetition, no learning). They need to know if game theory's epistemic program helps predict behavior here, with what confidence, and under what conditions.
      *   **Specific Content Requirements:**
          1.  Numbered list of agreed claims (formalism, representation theorems, common prior, lab literature).
          2.  Table of residual disagreements (Neutral description, PT formulation, MS formulation).
          3.  Judgment on disagreements (Substantive vs. Verbal + exclusions).
          4.  Cruxes (Sub-questions, accepted evidence, predictions, falsifiers).
          5.  Assessment of the "Finite-Depth Proposal" (Test, distraction, or in-between? Vindication conditions).
      *   **Tone/Constraint:** Do not buy agreement cheaply. Sharp disagreements are better than hedged non-commitments. If one side is clearly right on a technical point, note that separately to the user, not in the document.

  2.  **Deconstruct the Personas:**
      *   **Program Theorist (PT):** Believes epistemic conditions (Common Knowledge of Rationality - CKR, Common Prior Assumption - CPA) give content to solution concepts (Nash, CE, Backward Induction). It's explanatory/classificatory. The math reveals *why* rational agents act this way.
      *   **Model Skeptic (MS):** Believes assumptions do all the work. The "game form" and "type space" are analyst choices. Results are tautological restatements of premises. Not predictive of actual behavior without empirical grounding of the beliefs.
      *   **The Consumer (Regulator):** Needs prediction in *novel, one-shot* settings. This is the hardest case for game theory (no focal points, no learning). This constraint forces the collaboration to address *applicability*, not just mathematical consistency.
      *   **The Finite-Depth Proposal:** Truncating belief hierarchies at depth $k$. Does the result converge quickly? If yes, CKR is a benign idealization. If no (or slow convergence), CKR is doing heavy lifting that isn't realistic.

  3.  **Drafting - Section by Section:**

      *   **Title/Header:** Needs to look official but reflect the adversarial nature. "Joint Statement on the Epistemic Foundations of Game-Theoretic Prediction."

      *   **Section 1: Agreed Claims:**
          *   Need to find common ground without watering it down.
          *   *Formalism:* Both agree the math is sound.
          *   *Theorems:* Both agree theorems map assumptions to outcomes (if A, then B).
          *   *Common Prior:* Both agree it's an assumption, not a fact. PT sees it as a consistency requirement; MS sees it as a strong empirical claim. *Agreement:* It restricts the model space.
          *   *Lab Lit:* Both agree lab results (dominance solvable) show limits. People aren't perfectly rational/common knowledge.
          *   *Regulatory Context:* Crucial point. Both must agree that in *novel, one-shot* games, standard epistemic conditions are least likely to hold naturally.

      *   **Section 2: Residual Disagreements (Table):**
          *   *Issue 1: The Source of Predictive Power.*
              *   Neutral: Does the prediction come from the logic or the input?
              *   PT: Logic reveals constraints on rationality.
              *   MS: Inputs (beliefs) are the only source of leverage.
          *   *Issue 2: The Status of CKR in Novel Settings.*
              *   Neutral: Is CKR plausible without history?
              *   PT: It's a normative benchmark for reasoning.
              *   MS: It's an empirically false description of cognition in novel settings.
          *   *Issue 3: The Role of the Analyst.*
              *   Neutral: How much discretion does the modeler have?
              *   PT: Constrained by consistency requirements.
              *   MS: Unconstrained; can fit any outcome by adjusting type space.

      *   **Section 3: Substantive vs. Verbal:**
          *   Many epistemic disputes are verbal (what counts as "rationality" or "knowledge").
          *   However, regarding the *Regulator's* need (prediction), the disagreement is likely substantive. PT thinks the logic constrains behavior enough to be useful. MS thinks it doesn't without belief data.
          *   *Verbal:* "Rationality." PT = Consistency of beliefs/actions. MS = Psychological capacity.
          *   *Substantive:* Whether the convergence of finite depth is fast enough to matter for policy.

      *   **Section 4: Cruxes:**
          *   Need specific tests.
          *   *Crux 1: Finite Depth Convergence.* (Directly addresses the steering committee's proposal).
          *   *Crux 2: Elicitation of Higher-Order Beliefs.* Can we measure them?
          *   *Crux 3: Novelty Penalty.* Does performance drop significantly in truly novel games vs. standard lab games?

      *   **Section 5: The Finite-Depth Proposal:**
          *   This needs careful handling.
          *   PT view: It's a robustness check. If it converges, CKR is fine.
          *   MS view: It's the *real* test. If it doesn't converge quickly, CKR is a magic trick.
          *   Joint view: It is a genuine test of the *idealization*, not the logic.
          *   Vindication for Skeptic: If $k$ needs to be implausibly high (e.g., > 5) for convergence in games relevant to regulators.

      *   **Note to User:**
          *   Identify where one side is technically stronger.
          *   *Observation:* On the "novel, one-shot" constraint, the Skeptic is empirically stronger. Epistemic game theory relies on common knowledge which is rarely present in novel one-shot interactions. The Theorist is normatively stronger (how agents *should* reason), but the Regulator needs prediction. I should note this tension.

  4.  **Refining and Polishing:**
      *   *Check Constraints:* Did I hedge too much? Make the disagreements sharper.
      *   *Check Consumer:* Is the regulatory context visible? Yes, weave it into the "Implications" or "Cruxes."
      *   *Check Finite-Depth:* Ensure it's integrated as requested, not tacked on.
      *   *Tone:* Academic, precise, distinct voices in the disagreement section.

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe they agree on the Common Prior.
      *   *Correction:* No, PT sees it as a rationality requirement (Harsanyi), MS sees it as an empirical claim about information sources. Keep the disagreement sharp there.
      *   *Initial thought:* Maybe the Finite-Depth proposal is agreed to be useful.
      *   *Correction:* PT might see it as missing the point (CKR is normative). MS sees it as essential. The joint document should reflect that tension: it tests *descriptive validity*, not *normative force*.
      *   *Regulator Focus:* Ensure the conclusion explicitly answers "Can we use this?" The answer should be "Only if..." not "Yes."

  6.  **Final Review against Prompt:**
      *   (1) Numbered list of claims? Yes.
      *   (2) Table of disagreements? Yes.
      *   (3) Judgment (Substantive/Verbal)? Yes.
      *   (4) Cruxes (Evidence, predictions, falsifiers)? Yes.
      *   (5) Finite-depth assessment? Yes.
      *   Note to user outside document? Yes.

  7.  **Final Polish:** Check the voice. PT should sound like a foundationalist (Aumann, Binmore-ish). MS should sound like an empiricist/model-critic (Rubinstein-ish, or perhaps more behavioral). The text needs to be dense but readable.

  *(Self-Correction on the "Note to User"):* The prompt asks me to say where one side is simply right *in a brief note addressed to me, outside the document*. I will place this at the very end or beginning, clearly separated. Given the regulatory context (prediction in novel one-shot games), the Skeptic has the stronger empirical case, while the Theorist has the stronger logical case. I will highlight that the Regulator's specific constraints favor the Skeptic's warnings.

  *(Refining the Finite-Depth Section):* Make sure to explicitly answer "genuine test, distraction, or in-between." I'll argue it's a genuine test of *descriptive applicability*, which is what the Regulator cares about, even if PT cares about normativity.

  *(Refining the Disagreement Table):* Ensure the "Neutral Language" column doesn't bias towards one side.

