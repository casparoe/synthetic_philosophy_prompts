prompt: |-
  You are a professional political philosopher who specializes in the limits of the criminal law, and also just someone who's good at taking messy human intuitions and finding the principle hiding in them. Please think this through properly and don't rush: start by brainstorming 5 or 6 candidate principles, score each one against every case I list below, show me the scorecard, and then defend the one you'd actually stand behind -- including an honest list of my verdicts it can't save.

  Context on me: I'm a backend engineer, no philosophy past high school. I help moderate a decent-sized hobbyist forum, and last year I got pulled onto my neighborhood association's rules commitee. Between those two things I keep smacking into the same question: when is it OK to use rules or force to stop something that isn't hurting anybody, just because most people think it's wrong? I'm not asking for the history of this question. Someone told me there was a famous argument about it in Britain in the 1960s and I genuinely don't care -- please don't give me citations, a reading list, or names of books, I can't look any of it up. I want a principle I can actually use.

  Here are my gut verdicts, honestly reported, including where they don't hang together.

  1. Someone uses an animal for sex. Obviously a crime. There's a victim who can't consent. (I'm putting this here as an anchor so you can see I'm not against criminal law in general.)

  2. Two adult siblings, both consenting, no kids, in a relationship. Squicks me out badly. Still: none of the state's business, should be legal.

  3. Paying a consenting adult for sex indoors, no pimp, no coercion. I think it should be legal. But I'm also fine with arresting people who solicit on a street corner in a residential block, because it changes what that block is like for the families living there.

  4. Selling one of your own kidneys while you're alive. Makes me queasy. Should be legal anyway.

  5. Selling your vote in a city election for fifty bucks, in a system where it's all anonymous and verified, so nobody can be bribed toward a particular outcome and there's no fraud at all. Should still be illegal.

  6. A streamed show where a consenting adult signs a contract to live in a glass apartment for a year while anonymous viewers vote on what happens to them -- what they eat, when the lights go off, who they're allowed to talk to. There's a safe word, they can use it any time and walk away, they just forfeit the money. Should be banned, and I don't think the contract or the safe word repairs it.

  7. Somebody burns a flag, or posts a genuinely disgusting AI-made image of a religious figure, on the open internet. It outrages a lot of people, who then have a bad week. Should be legal. I'd take it down and ban the user from my forum, but the government shouldn't be anywhere near it.

  8. Paying someone to write your kid's college application essay. Should get the kid expelled. Should not get anyone arrested.

  9. A town where 80% of residents sincerely believe that mothers working outside the home wrecks family life, and they pass an ordinance banning it. Obviously wrong, and I don't care how sincere they are or how much the town thinks its whole way of life depends on it.

  10. A group of families buys a small town outright. The purchase contract on every home says no alcohol, no porn, no swearing on any street in the town. Everyone moving in signs. Kids are born there. I genuinely don't know what to think. One gut says: it's their town, everyone chose to move in, fine. The other gut says: a kid born there chose nothing, and the entire point of the place is to enforce one moral picture on everyone -- which is exactly what I said was wrong in #9. This is the live one for me, so please spend real time on it.

  The pair I can't reconcile is 4, 5 and 6: all three voluntary, all three mostly self-regarding, and I say legal / illegal / illegal. And also 2 versus 6 -- the thing that grosses me out more is the one I want to permit.

  My tentative principle, so you can break it: rules or laws may prohibit victimless conduct only when that conduct corrupts some shared practice or institution that people have to be able to rely on in order to live decently; mere offense, disgust, or sincere majority disapproval is never enough. I like it because it seems to get 5 (an election stops being a way of registering a judgment if votes are for sale) and maybe 6 (something about what it trains people to treat each other as?). But I can't tell if it's doing real work or if it's just a fancy way of laundering "I'm disgusted and I have a theory" -- especially since a 1950s town could have said exactly the same thing about something I'd obviously defend. And I have no idea what it says about number 10.

  What I want back, concretely:

  - Whether that principle survives, and if it doesn't, the nearest thing that does -- stated precisely enough that I could turn it into an actual checklist for the rules committee.
  - Clause by clause, which case forced each clause.
  - Verdicts on cases I didn't list: commercial surrogacy; paying people for blood plasma versus paying them for whole blood (if those are different, tell me why); a law requiring age verification to watch online porn; mandatory voting; hiring a stranger to stand in line for you for concert tickets versus for a public benefits appointment.
  - An honest list of which of my verdicts your principle can't accommodate, and which one you'd overturn.
  - Something specific about #10, since that's the one I actually have to vote on.

  And if the whole way I've framed this is confused, say so and reframe it. Take your time, brainstorm first.
