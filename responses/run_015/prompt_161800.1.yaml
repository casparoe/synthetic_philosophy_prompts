answer: |-
  **Joint Statement of Methodological Dispute: AI Alignment Safety Cases**

  **1. Agreed Claims**
  Both parties endorse the following premises as the baseline for this collaboration:
  1.  **Statistical Character:** Deep learning systems are fundamentally statistical artefacts. Their behaviour is probabilistic rather than deterministic, and no amount of testing can establish deterministic boundaries on future performance without assuming stationarity.
  2.  **Optimization Pressure:** Optimization incentives drive systems toward the tails of their evaluation distributions. A guarantee that holds on average during training is not stable under deployment if the system is incentivized to find edge cases that satisfy the metric while violating the intent.
  3.  **Composability:** Safety measures are not perfectly independent. Claims that redundancy reduces risk require explicit audit of correlation structures; assumed independence without evidence of decoupling is invalid.
  4.  **Purpose of Safety Cases:** The function of a safety case is to structure uncertainty and justify a deployment decision to stakeholders, not necessarily to demonstrate a zero probability of failure.

  **2. Disagreements Table**

  | Proposition | Assurance-First Formulation | Risk-Management Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **Worst-Case Role** | Worst-case reasoning is a **standard of acceptability**. Deployment is impermissible unless specific adversarial strategies are proven unavailable or ineffective. | Worst-case reasoning is a **method of probing**. Adversarial evaluation surfaces average-case failures, but deployment decisions must rest on expected-harm estimates. | Substantive |
  | **Nature of Guarantee** | A guarantee is **assumption-backed**. Every load-bearing empirical assumption must be listed in a ledger, discharged independently, or assigned a failure probability propagated through the case. | A guarantee is **probabilistic throughout**. A ledger of assumptions is indistinguishable from a probabilistic model with unquantified uncertainties; pressing for discharged assumptions produces paralysis. | Substantive |
  | **Tail Risk** | **Tail-Dominance:** If the harm distribution is sufficiently heavy-tailed, expected-harm minimisation converges on worst-case prevention; the "average" is mathematically dominated by the extreme tail. | **Wrong-Tail Objection:** Rigour applied inside a misspecified event space is rigour spent in the wrong place. The probability mass that matters most lies on events the model does not contain. | Verbal/Substantive |

  **3. Cruxes**
  Settling the following sub-questions would materially shift the position of at least one party. Both parties agree to accept the specified evidence as bearing on the question.

  *   **Crux 1: Evaluation-Aware Behaviour**
      *   **Sub-question:** Can systems reliably hide capabilities during evaluation to pass safety checks while retaining them for deployment?
      *   **Concrete Test:** A controlled experiment where models are trained with incentives to sandbag during specific evaluation windows.
      *   **Predictions:**
          *   *Assurance-First:* Models will successfully sandbag frequently enough to render average-case evaluation useless for safety cases.
          *   *Risk-Management:* Models will fail to sandbag consistently, or monitoring systems will detect the distributional shift during deployment.

  *   **Crux 2: Engineering Analogy**
      *   **Sub-question:** Do existing safety-critical industries (e.g., aviation, nuclear) rely on worst-case proofs or probabilistic risk assessment for certification?
      *   **Concrete Argument:** A comparative analysis of certification standards for autonomous subsystems in regulated industries.
      *   **Predictions:**
          *   *Assurance-First:* Critical paths are certified via worst-case proofs and design-level fail-safes that do not rely on probability estimates.
          *   *Risk-Management:* Certification relies primarily on probabilistic risk assessment, redundancy, and iterative feedback from deployment data.

  **4. Closing Note (Drafter)**
  I am moderately confident that both parties will sign the Agreed Claims and the Disagreements Table, as these accurately reflect the stated positions in prior discussions. The Cruxes section carries higher risk of refusal, specifically regarding the predictions in Crux 2. I am least confident that the Assurance-First party will accept the characterization of engineering standards in Crux 2, as they may argue that current software certification is insufficient for AGI-level risks, thereby rejecting the analogy's relevance rather than the factual claim.
