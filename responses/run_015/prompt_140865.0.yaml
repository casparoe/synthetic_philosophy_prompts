prompt: |-
  I'm in a final-year seminar on blame and accountability, and this week's session was on hypocrisy. Our section leader leaned hard on an analogy I have been turning over since, and I would like it audited properly before I build a paper on it.

  The analogy is that moral blame is like a civil action. On her telling, to blame someone is to bring a claim against them: the blamer needs standing in roughly the legal sense, meaning a particularized injury traceable to the person she is addressing, and even a blamer with standing can be barred, because a court of equity refuses relief to a plaintiff who comes to it with dirty hands — you cannot invoke a norm you are yourself flouting. She uses the analogy to carry a strong conclusion, namely that a hypocrite's blame is not merely impolite or unpersuasive but infelicitous: it makes no claim on the person addressed, that person may set it aside entirely, and nothing is left over — no reason to reconsider, no reason to feel anything, no residue of accountability.

  A classmate objected that the analogy imports the very thing in dispute. Legal standing, he said, is a jurisdictional gate on a scarce public resource: it decides who may set the coercive apparatus of the state in motion, and, at least in its American form, it exists to keep courts from being used to air undifferentiated grievances. Blame is address between persons who are, on the account she is giving, one another's equals: no adjudicator, no docket, no remedy to allocate, no sovereign. So whatever work standing does in the moral case, it cannot be that. She replied that the gatekeeping rationale is inessential; what carries over is the structural point that whether a claim against you can be pressed at all can depend on facts about the claimant and not only on the content of the claim.

  I want more than a verdict on that exchange. Please lay out the full correspondence table first: what plays the role of the plaintiff, the injury in fact, the cause of action, the court, the remedy, the affirmative defense, and the requirement, in the doctrine she is borrowing, that the plaintiff's misconduct concern the same subject matter as the suit. Note in passing that the doctrine is discretionary and is weighed against other considerations, and that it is a defense to relief rather than a finding that the underlying claim is false.

  Then sort the disanalogies into the ones that actually bite on her conclusion and the ones that are decorative. Three I cannot settle myself:

  First, two people both guilty of the same kind of thing. In law the defense is available to whichever of them is the defendant, so each is barred against the other, and there is still a prosecutor or a different, clean plaintiff to vindicate the norm. Morality has no party who stands outside the practice. So if blame forfeits standing whenever the blamer is compromised, the norm loses every enforcer it has and the worst offenders end up in a zone of mutual impunity. Is that a genuine consequence of the analogy, or am I misreading it?

  Second, the confessing hypocrite: someone who did the thing, is still doing it, but has owned it publicly and is trying to stop. Equity looks backward at conduct; blame seems to respond to where the blamer now stands with respect to the norm. If acknowledgment cures in one case and not the other, then the two are tracking different kinds of condition, a historical bar versus a present relational one.

  Third, whether the analogy quietly settles a question it was brought in to help answer: the same-subject-matter restriction would make forfeiture norm-specific, but the intuitive case for taking hypocrisy seriously is often norm-general.

  Finally: does the strong conclusion survive, and if the litigation model is the wrong one, what would be a better analogy — appealing to the rules of a practice one is currently playing, a demand among equals, a request within an ongoing relationship? Please argue from the structure of the cases rather than from what is supposed to have been said in the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Final-year seminar on blame and accountability. Topic: Hypocrisy.
      *   **Core Analogy:** Moral blame $\approx$ Civil Action (Litigation Model).
      *   **Section Leader's Claim:** Hypocritical blame is *infelicitous* (no claim made, no reason to reconsider/feel anything, no residue of accountability) because the blamer lacks "standing" (dirty hands doctrine).
      *   **Classmate's Objection:** Legal standing is about scarce public resources/coercion; moral blame is between equals without a sovereign.
      *   **Leader's Reply:** Gatekeeping is inessential; structural point is that claimant facts matter, not just claim content.
      *   **Task 1:** Lay out the full correspondence table (Plaintiff, Injury, Cause of Action, Court, Remedy, Affirmative Defense, Same-Subject-Matter requirement). Note discretionary nature and defense vs. falsity distinction.
      *   **Task 2:** Sort disanalogies into "biting" (undermine conclusion) vs. "decorative" (irrelevant).
      *   **Task 3:** Address three specific puzzles:
          1.  Mutual Impunity (Two guilty parties).
          2.  Confessing Hypocrite (Acknowledgment cures?).
          3.  Norm-Specific vs. Norm-General forfeiture.
      *   **Task 4:** Evaluate the strong conclusion (infelicity/no residue) and propose a better analogy if needed (Practice rules, Demand among equals, Request in relationship), arguing from structure.

  2.  **Deconstruct the Analogy (Task 1):**
      *   *Plaintiff:* The Blamer.
      *   *Injury in Fact:* The moral wrong done to the blamer (or the community they represent, but the analogy suggests particularized injury).
      *   *Cause of Action:* Violation of a moral norm/obligation owed to the blamer.
      *   *Court:* The moral community / The space of reasons / The interlocutor's conscience (this is tricky, needs careful framing).
      *   *Remedy:* Apology, amendment, reparations, moral recognition.
      *   *Affirmative Defense:* "Unclean Hands" (Hypocrisy).
      *   *Same-Subject-Matter:* The blamer's hypocrisy must relate to the specific norm being invoked.
      *   *Nuance:* It's a bar to *relief*, not a denial of the *truth* of the claim. It's discretionary (equity).

  3.  **Evaluate Disanalogies (Task 2):**
      *   *Classmate's Objection (Sovereignty/Scarcity):* This is likely "decorative" regarding the *logic* of standing, but "biting" regarding the *consequences*. If there's no sovereign, who enforces the bar? If there's no scarcity, why bar the claim?
      *   *Biting Disanalogies:*
          *   Lack of third-party enforcement (leads to the Mutual Impunity problem).
          *   The nature of the "Court" (internal vs. external).
          *   The goal (truth/accountability vs. dispute resolution).
      *   *Decorative Disanalogies:*
          *   Formal procedure (filing fees, dockets).
          *   Coercive power (police vs. social pressure).

  4.  **Address the Three Puzzles (Task 3):**
      *   *Puzzle 1: Mutual Impunity.* In law, the State can prosecute even if victims are dirty. In morality, if *everyone* is dirty, does the norm vanish? If the Leader's conclusion holds (infelicitous/no residue), then yes, mutual impunity arises. This is a *reductio ad absurdum* of the strong conclusion. It bites hard.
      *   *Puzzle 2: Confessing Hypocrite.* Law looks at past conduct (did you have clean hands *at the time*?). Morality might care about current attitude (are you *now* committed to the norm?). If acknowledgment cures moral standing but not legal standing, the analogy breaks on the *temporal* nature of the bar.
      *   *Puzzle 3: Norm-Specific vs. General.* Legal "unclean hands" usually requires nexus to the specific transaction. Moral hypocrisy often feels like a general loss of authority (e.g., a lying moralist). If the analogy forces norm-specificity, it might miss the intuitive force of general character attacks on credibility.

  5.  **Evaluate the Strong Conclusion & Propose Alternatives (Task 4):**
      *   *Strong Conclusion:* "Infelicitous/No Claim/No Residue."
      *   *Critique:* This seems too strong. Even a hypocrite points out a truth. The wrongdoer still owes something to the *victim* or the *norm*, even if the *blamer* is compromised. The "no residue" claim is the weakest link.
      *   *Better Analogies:*
          *   *Demand among Equals (Darwall):* Blame is a demand for recognition. Hypocrisy undermines the *authority* to demand, but not the *validity* of the norm.
          *   *Rules of a Practice (Rawls-ish):* If you break the rules, you can't enforce them. But others can.
          *   *Conversation/Address:* Hypocrisy makes the speech act "misfire" (Austin), but the propositional content remains.
      *   *Selection:* The "Demand among Equals" or "Conversational Account" fits best to preserve accountability while acknowledging the loss of standing.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, rigorous, respectful of the seminar context.
      *   *Structure:* Follow the prompt's ordering (Table -> Disanalogies -> Three Puzzles -> Conclusion/Alternative).
      *   *Refining the Table:* Ensure the "Court" and "Remedy" map plausibly to moral phenomena without stretching too far.
      *   *Refining the "Biting" vs. "Decorative":* Be precise. The lack of a sovereign isn't just a detail; it changes *who* vindicates the norm.
      *   *Refining the Puzzles:*
          *   *Impunity:* This is the killer argument against the "no residue" claim.
          *   *Confession:* Distinguish between *status* (legal) and *stance* (moral).
          *   *Nexus:* Discuss whether moral authority is siloed or holistic.
      *   *Refining the Alternative:* Move away from "Litigation" (adversarial, binary) to "Discourse" or "Authority." The "Demand" model (Stephen Darwall) is the standard philosophical counter to the "Sanction" model. I should use that structure without necessarily name-dropping if the prompt asks to argue from structure. I will focus on the structure of *authority* vs. *enforcement*.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I note that "unclean hands" is discretionary and a defense to relief, not falsity? *Yes, must ensure this is clear in the table section.*
      *   *Check:* Did I answer whether the strong conclusion survives? *No, it shouldn't survive the "Mutual Impunity" test.*
      *   *Check:* Did I avoid just summarizing literature? *Yes, focus on structural argumentation.*
      *   *Nuance:* The Section Leader's reply ("gatekeeping is inessential") tries to save the analogy. I need to show why that reply fails on the "Mutual Impunity" point. If there's no third party, the gatekeeping *is* the whole game.

  8.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on these thoughts.)
answer: |-
  Here is an audit of the litigation analogy, structured according to your request.

  ### I. The Correspondence Table

  To evaluate the analogy, we must map the legal doctrine of *unclean hands* (an equitable defense) onto the moral practice of blame. Your section leader is arguing that hypocrisy functions as a bar to standing, rendering the blame infelicitous.

  | Legal Concept (Equity/Civil Action) | Moral Analog (Leader's Model) | Structural Function |
  | :--- | :--- | :--- |
  | **Plaintiff** | The Blamer | The party initiating the normative claim. |
  | **Injury in Fact** | Particularized Moral Wrong | The specific violation of a norm owed to (or impacting) the blamer; distinguishes blame from mere criticism. |
  | **Cause of Action** | Violation of Moral Obligation | The underlying normative breach (e.g., lying, betrayal). |
  | **The Court** | The Moral Community / Interlocutor's Conscience | The forum where the claim is adjudicated. In the leader's view, this is the space where the claim is either accepted or set aside. |
  | **Remedy** | Apology, Amendment, Reparations | The relief sought: recognition of the wrong and restoration of the normative order. |
  | **Affirmative Defense** | Charge of Hypocrisy | "Unclean Hands." Does not deny the *Cause of Action* occurred, but bars the *Plaintiff* from relief. |
  | **Same-Subject-Matter Requirement** | Norm-Specific Hypocrisy | The blamer's misconduct must relate to the specific norm they are invoking (e.g., a thief cannot blame theft). |
  | **Nature of the Bar** | Discretionary / Equitable | It is not automatic; it weighs the blamer's conduct against the need for relief. |
  | **Effect of Defense** | Bar to Relief, Not Denial of Truth | The claim is valid (the wrong happened), but the court refuses to enforce it *for this plaintiff*. |

  **Crucial Distinction:** As you noted, in law, *unclean hands* is a defense to *relief*, not a finding that the underlying claim is false. The leader imports this: the hypocrite's target *did* wrong, but the hypocrite cannot extract the "remedy" (acknowledgment/apology).

  ### II. Disanalogies: Biting vs. Decorative

  Your classmate's objection regarding sovereignty and scarcity is the pivot point. We must separate features of law that are incidental from those that do the structural work.

  **Decorative Disanalogies (Do not undermine the conclusion)**
  *   **Coercion:** Law uses police/prisons; morality uses guilt/shame/ostracism. This is a difference in *force*, not *structure*. The leader can argue that both are systems of enforcement, regardless of the mechanism.
  *   **Formal Procedure:** Dockets, filing fees, and statutes of limitation are administrative. Their absence in morality does not affect the logical structure of standing.
  *   **Professional Adjudication:** Judges are third parties; in morality, we are often judge and jury. This is significant, but the leader's reply ("gatekeeping is inessential") attempts to bypass this by focusing on the *relationship* between claimant and defendant.

  **Biting Disanalogies (Undermine the conclusion)**
  *   **The Existence of a Third-Party Enforcer:** In law, if Plaintiff A is barred, the State (Prosecutor) or Plaintiff B can still vindicate the norm. In morality, if the "Court" is just the interpersonal space between Blamer and Wrongdoer, there is no third party. If the Blamer is barred, *no one* is left to press the claim in that interaction.
  *   **Scarcity of Forum:** Courts are scarce public resources; standing prevents clogging. Moral attention is not scarce in the same jurisdictional sense. If the rationale for standing is resource management, it doesn't translate. If the rationale is *authority*, it might, but authority works differently between equals than between citizen and state.
  *   **Finality of Judgment:** A legal dismissal with prejudice ends the case. A moral "setting aside" of blame is rarely final; the norm remains in force even if this specific instance of blame is rejected.

  ### III. The Three Puzzles

  Here is where the leader's strong conclusion (that hypocritical blame is *infelicitous* with *no residue*) faces structural collapse.

  **1. The Mutual Impunity Problem**
  *   **The Structure:** In law, if A and B are both thieves, A cannot sue B for theft under *unclean hands*. But the State can still prosecute B. The norm is vindicated by a party outside the dirty relationship.
  *   **The Moral Consequence:** In morality, there is no "State." We are all potential blamers. If the analogy holds strictly, and standing is forfeited by hypocrisy, then two guilty parties enter a zone of mutual impunity. A cannot blame B, and B cannot blame A.
  *   **Verdict:** This is a genuine, fatal consequence of the analogy *if* the strong conclusion holds. If blame makes "no claim" and leaves "no residue," the norm effectively suspends itself between sinners. This contradicts the basic intuition that moral norms bind us *especially* when we are flawed. The analogy imports a jurisdictional bar into a space where jurisdiction is universal. The norm loses its enforcers. This suggests the "no residue" conclusion is false: the blame may be *deflected*, but the accountability remains.

  **2. The Confessing Hypocrite**
  *   **The Structure:** Equity looks backward. Did the plaintiff engage in misconduct *related to the suit*? It is a historical bar. Acknowledgment does not typically "clean" hands for the purpose of the current suit; you still committed the act.
  *   **The Moral Consequence:** Moral standing often looks forward or present-tense. A blamer who says, "I have done this too, I am struggling with it, but it is wrong," often retains *more* standing than a silent hypocrite. Acknowledgment can cure the defect because moral standing is based on *commitment to the norm*, not *perfect compliance*.
  *   **Verdict:** The analogy breaks on the *temporal* condition of standing. Law bars based on *conduct history*; morality bars (intuitively) based on *current attitude toward the norm*. If the leader insists on the legal model, she must argue that the confessing hypocrite has no standing. This is counter-intuitive. If she allows confession to cure standing, she has abandoned the legal analogy for a different model (sincerity/authority).

  **3. Norm-Specific vs. Norm-General Forfeiture**
  *   **The Structure:** *Unclean hands* requires a nexus. A plaintiff's tax evasion does not bar them from suing for breach of contract. The misconduct must touch the specific transaction.
  *   **The Moral Consequence:** Intuitively, hypocrisy often feels general. A moralist caught in a scandal often loses the authority to blame *across the board*, not just on the specific issue. Their credibility is holistically damaged.
  *   **Verdict:** The analogy forces a siloed view of moral authority that conflicts with the holistic nature of moral character. If the leader adopts the legal "nexus" requirement, she weakens the intuitive force of the hypocrisy charge (which is often "you have no moral authority, period"). If she rejects the nexus requirement to match intuition, she departs from the legal doctrine she is borrowing.

  ### IV. Evaluation of the Strong Conclusion and Alternative Analogies

  **Does the strong conclusion survive?**
  **No.** The "Mutual Impunity" puzzle demonstrates that the strong conclusion (no claim, no residue, total infelicity) is unsustainable. If hypocritical blame leaves *no residue of accountability*, then moral norms cease to bind those who violate them, provided their critics are also violators. This makes morality contingent on the purity of its enforcers, which undermines the objectivity of the norm itself. The wrongdoer still owes a debt to the victim or the community, even if the specific blamer lacks the *authority* to collect it. The blame is not *infelicitous* (void); it is *defeasible* (subject to challenge).

  **A Better Analogy: The Demand Among Equals**
  Rather than Litigation (which implies a sovereign, scarce resources, and binary victory/defeat), a more structurally sound analogy is **a Demand within a Cooperative Practice.**

  *   **Structure:** Imagine a game where players enforce rules on each other to keep the game going.
  *   **The Blamer:** A fellow player calling a foul.
  *   **The Hypocrisy:** A player calling a foul they are currently committing.
  *   **The Effect:** The call is not *void* (the foul still happened). The game does not stop. However, the *authority* of the caller is undermined. The other player can say, "You're doing the same thing," and the community may discount the call.
  *   **Why it works better:**
      1.  **Preserves the Norm:** The foul remains a foul even if the caller is dirty (avoids Mutual Impunity).
      2.  **Explains the Defeat:** The hypocrite loses *credibility*, not *truth*. The blame is "set aside" not because it makes no claim, but because the blamer has forfeited the *privilege* of enforcing.
      3.  **Allows for Cure:** In a practice, a player can acknowledge a foul ("My bad, I won't do it again") and regain standing to enforce rules. This matches the "Confessing Hypocrite" intuition better than equity.
      4.  **No Sovereign Needed:** Enforcement is distributed among equals. If Player A is barred, Player C can still call the foul. This solves the impunity problem without importing a State.

  **Conclusion for your Paper:**
  You should argue that the Section Leader's analogy correctly identifies that *facts about the blamer matter* (the structural point your classmate conceded), but incorrectly identifies *why* they matter. They do not matter because of jurisdictional standing (a gatekeeping mechanism for a sovereign), but because of **moral authority** (a relational status among equals).

  The litigation model leads to the "no residue" error. The **Practice/Demand model** preserves the residue: the hypocrite's blame is a failed *speech act of authority*, but a successful *report of a wrong*. The wrongdoer still has reason to reconsider, not because the hypocrite demanded it, but because the norm they violated remains in force. The hypocrisy blocks the *transmission* of accountability, not the *existence* of it.
