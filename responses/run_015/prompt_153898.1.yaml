answer: |-
  "Wait, so you're saying Marcus actually won that argument?"

  "No, not won. Just… didn't lose standing," Jamie said, stirring their iced coffee. "Look, Marcus called out Sarah for flying private while preaching carbon neutrality. Yeah, Marcus flies commercial, but he still flies. He's still contributing to the emissions he's mad about."

  "But that's the definition of lacking standing," I countered. "You can't blame someone for a fault you share. It's the 'tu quoque' thing. If you're dirty, you don't get to yell at me for being dirty."

  "Okay, but here's the loop," Jamie said, leaning in. "Marcus is blaming Sarah for hypocrisy. But if Marcus is also hypocritical about the same norm, then his act of blaming is itself hypocritical. He's demanding purity he doesn't meet. So does that destroy his standing twice over? Like, is he doubly problematic? Or does it cancel out? If we're both hypocrites, does the blame just bounce off?"

  "I think it destroys it twice," I said. "Because now he's not just violating the norm; he's weaponizing the violation. He's using moral language to gain status while knowing he's guilty. That's worse than just quietly being a hypocrite. It's performative."

  "But think about the systemic piece," Jamie pushed back. "We're both flying. The system doesn't give us a zero-emission option that's affordable. If everyone embedded in the system is technically hypocritical, then standing becomes impossible. No one has clean hands. Does that mean blame is off the table entirely?"

  "No, because agency still exists," I said. "Sarah flew private. That's a choice within the system. Marcus flies commercial. That's a different choice. Even if both are harmful, the degree matters. If we say systemic participation wipes out standing, then no one can ever criticize anyone. That kills moral progress."

  "Does it though?" Jamie asked. "Or does it just shift the target? If I blame you for buying fast fashion, but I'm wearing a shirt made in the same factory, I'm treating you like the cause when you're just another symptom. Maybe the hypocrisy isn't the barrier to blame; maybe it's a signal that the blame is misdirected. You should be blaming the supply chain, not me."

  "But I can't yell at a supply chain," I said. "I can only yell at people. So if I can't yell at you because I'm guilty too, and I can't yell at the corporation because it's abstract… we just stay silent?"

  "Maybe," Jamie shrugged. "Or maybe we admit the shared guilt. Like, 'I know I'm part of this, and you are too, but what you did is worse.' That restores standing. It's not about being clean; it's about honesty. The second-order hypocrisy—the act of blaming while hiding your own fault—that's the real sin. If Marcus had said, 'I know I fly too, but private jets are insane,' he keeps his standing."

  "So honesty cures hypocrisy?"

  "Not cures. Just mitigates the standing loss," Jamie said. "Because then you aren't claiming authority you don't have. You're just pointing out inconsistency. But if you pretend you're above it? That's when the loop closes. You're blaming me for lying to myself while you're lying to yourself about blaming me."

  "That's messy," I said. "It means most of our arguments are just people fighting over who's less trapped in the system."

  "Exactly. So maybe the goal isn't to win standing. It's to acknowledge the trap together. If we admit we're both complicit, the blame stops being a weapon and starts being a check. Like, 'Hey, we're both failing this norm, but let's not make it worse.'"

  "So Marcus lost because he pretended he wasn't part of the problem?"

  "Yeah. He tried to climb out of the mud by pushing Sarah deeper. But since he's standing in the same mud, he just slipped. And took her down with him."

  I laughed. "Great. So we're all just mud-wrestlers pretending to be referees."

  "Pretty much," Jamie said, taking a sip. "But at least now we know why the ref whistle sounds so fake."
