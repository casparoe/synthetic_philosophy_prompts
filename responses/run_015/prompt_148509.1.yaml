      *   Is it theology? Yes, because it constrains divine providence.
      *   *Diagnosis:* It is a category error clash. One side treats CCFs as *propositions about possibilities* (timeless/abstract), the other treats them as *propositions about causal powers* (requiring ontological grounding in the agent).

