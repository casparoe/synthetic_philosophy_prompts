answer: |-
  Welcome, everyone. Thank you for being here. To my wife's family who traveled from Baden-Württemberg: we are glad you are here. To the neighbors and coworkers who have shared the street and the shop floor for decades: thank you. We are gathered because my father-in-law is becoming a citizen. Fifty-two years in Ohio. Forty-four years at the same plant. He arrived at twenty-two to work as a tool-and-die maker. He leaves the work as the same man.

  I have been thinking about what makes a decent person. People here often talk about decency as listening to yourself. If a rule asks something your conscience will not give, you stand up. You break the path to clear it. People in his home country often talk about decency as keeping the path clear. You keep the rule. You keep the slot. You do the thing that is the thing to do, especially on ordinary Tuesdays when nothing is at stake.

  Usually, we treat these as opponents. One says follow the rule. The other says follow yourself. I have started sorting rules into two kinds instead. A load-bearing rule holds something up right now. If you skip it, the machine stops or the part fails. Its point can be explained in a sentence. A training-weight rule does nothing in the moment. Nothing goes wrong if you skip it. No one is watching. Its job is not to keep the machine running but to keep you running. It is like lifting iron at the gym. The weight does not hold the roof up. But lifting it makes your back strong so you can lift something heavy later.

  My father-in-law kept a handwritten logbook of every machine setting he changed for thirty-one years. After 2004, the plant logged everything digitally. Nobody ever read his book again. He kept it up anyway, every day, until he retired. When asked why, he said it is simply what you do. That book was not load-bearing. The machine ran without it. It was a training-weight. It was practice. It was keeping the habit of accuracy warm so that on a day when following a rule would cost something real, the habit was available.

  Around 1990, a foreman told him to sign off on a run of parts he had not measured himself, ahead of a Friday shipment. He refused. He was moved off that line for a while. We do not need to invent consequences to know there were some. He has never mentioned it himself. But to say no in that room requires a kind of strength. You cannot borrow that strength on Friday afternoon. You have to have been lifting weights on Tuesday morning for thirty years. The logbook was the lifting. The refusal was the lift.

  This is not about choosing one side over the other. The rule-habit stocks the account. The conscience spends it. If you only follow conscience, you might not have the strength to carry the cost. If you only follow rules, you might not know when the rule has gone wrong. The German picture wins the small cases. The American picture wins the large ones. They only look like opponents because each is blind to the other's half.

  His life is evidence that they fit together. He is not changing sides today. He is not becoming one of us, and he has not stayed something else. He is showing us how the work gets done. He belongs here because he brings the habit that makes the conscience possible. When we ask what kind of citizen he will be, we do not need to guess. He will be the man who keeps the logbook when nobody reads it, so he is ready to stand up when somebody needs him to. That is a decent person. That is enough.

  ***

  **Note to the Speaker**

  The single sentence doing the heaviest work is: **"You cannot borrow that strength on Friday afternoon. You have to have been lifting weights on Tuesday morning for thirty years."**

  This sentence is weakest because it relies on a metaphorical causality that is hard to prove. A skeptic could argue that discipline in one area (logbooks) does not guarantee moral courage in another (refusing a foreman); a person can be meticulously orderly yet still cowardly when confronted by authority. If pushed, you would have to concede that the logbook didn't *cause* the refusal, but rather that both stem from the same underlying character, and the logbook was simply the visible evidence of that character over time.
