answer: |-
  **Bottom line**

  We must withdraw the book from the shortlist immediately. This is not a judgment on the literary merit of the text, nor is it a ruling on the legal merits of the lawyer's letter. It is a determination of eligibility based on the artifact submitted. Our prize is for fiction. The edition entered into our competition explicitly markets itself as non-fiction ("an unflinching true story"). We cannot award a fiction prize to a book that demands to be read as fact, particularly when that factual claim involves specific, unproven allegations against a living private citizen. Withdrawing protects the integrity of the category, limits the committee's exposure to secondary liability, and avoids validating a contradictory framing that harms a third party.

  **The facts that matter**

  Several details in this case are red herrings. The author's contradictory interviews are irrelevant; authors often blur lines for marketing. The unstable narrative frame within the text—the "editor" who becomes a character—is a literary device common in postmodern fiction and carries no weight regarding eligibility. The hardback's copyright page saying "A Novel" is significant but secondary; we are judging the edition entered, not the edition published three years ago.

  The facts that carry decisive weight are threefold. First, the entered edition's cover and paratext explicitly claim the work is a "true story," removing the standard fiction disclaimer. This establishes a contract with the reader that differs from our prize's mandate. Second, the text names a living local individual, specifies financial misconduct, and alleges forgery. These are not vague allusions but actionable claims. Third, the lawyer's letter confirms that the local reception is not literary but accusatory. The partner is not being read as a character but as a defendant. When a text moves from aesthetic object to local evidence, and the entered edition removes the protective frame of "novel," the book ceases to function as fiction within this specific community context. We are not judging the book in a vacuum; we are judging it in the county where the alleged victim drives a school bus.

  **Frame, outer, inner**

  Your recollection of Hofstadter is close, but for our purposes, it requires tightening to address the specific problem of truth claims. In this literary context, the **Frame Message** is the paratextual signal that instructs the reader on how to process the object. It is the genre label, the cover copy, and the copyright notice. It says, "Read this as pretend" or "Read this as fact." The **Outer Message** is the text itself—the sentences, the plot, the dialogue. The **Inner Message** is the meaning reconstructed by the reader after processing the Outer through the rules set by the Frame.

  The critical correction concerns where the "assertoric force" lives. You asked whether it lives in the sentence, the frame, or the reception. It lives in the Frame. The Outer Message (the sentence "John stole ninety thousand dollars") is identical whether it appears in a novel or a police report. Its power to assert a truth about the actual world depends entirely on the Frame. If the Frame says "Novel," the sentence is a pretense; it proposes a possible world. If the Frame says "True Story," the sentence is an assertion; it claims to describe the actual world.

  When the Frame is stable, the Inner Message is safe. In a novel, the Inner Message is thematic resonance. In a memoir, the Inner Message is historical claim. The crisis in this book is that the Frame is fractured. The hardback Frame said "Novel." The paperback Frame says "True Story." The internal text adds a third Frame (the editor's note) that collapses into the story. This instability forces the reader to decide the Frame themselves. When readers decide the Frame is "True Story"—as the local community has—the Outer Message's assertoric force activates. The Inner Message becomes a reputational wound. We cannot judge a fiction prize based on a text where the Frame invites the reader to treat the Outer Message as evidence.

  **Applied to this book**

  This distinction clarifies our role. We often think of a prize committee as judges standing outside the text, but our decision is itself part of the Frame. When we shortlist a book, we apply a meta-label: "This is a distinguished example of Fiction." If we award this book, we are attempting to overwrite the paperback's Frame with our own. We would be telling the readership, "Ignore the cover; this is art." However, we cannot control the reception of the book outside our circle. The local readers have already accepted the paperback's Frame. By awarding it, we do not neutralize the accusation; we amplify it with institutional prestige.

  If we validate this book as fiction, we create a paradoxical Frame where the prize committee asserts the text is pretend, while the book cover asserts the text is fact. In this contradiction, the named partner suffers regardless. If it is fact, he is a forger. If it is fiction, he is a character based on himself, publicly humiliated for profit. Our endorsement supplies the missing stability to the Frame, but only by choosing a side in a conflict we cannot adjudicate. Furthermore, by accepting the paperback edition as eligible, we implicitly accept its claim to be a "true story." We cannot have it both ways. We cannot accept the entry based on its marketing claims while awarding it based on its copyright history. To maintain the coherence of our prize, we must reject the artifact that breaks the fiction contract. We are not censoring the author; we are enforcing the category definitions required to make our judgment meaningful.

  **The strongest case the other way**

  The argument for keeping the book rests on the principle that literary value transcends marketing categories. The hardback established the work as a novel; the paperback's "true story" blurb is merely aggressive marketing copy, common in the industry to boost sales of literary fiction. The author has stated on record that she invented the events. The internal structure of the book—with its self-consuming editor's note—signals to any careful reader that this is a constructed narrative, not a documentary record. To withdraw the book is to punish the author for the publisher's copywriting and to capitulate to legal intimidation before a court has heard a case.

  Furthermore, ambiguity is a legitimate artistic strategy. Many great works hover between fact and fiction to explore memory and truth. By withdrawing the book, we enforce a rigid boundary that chills creative risk. We signal to writers that if their work is too convincing, or if it touches too close to home, we will disown them. The committee's role is to defend art from moralistic panic, not to act as a pre-emptive censorship board. The lawyer's letter is a threat, not a verdict. If we withdraw, we allow a legal threat to determine our shortlist. We should trust our readers to understand the difference between a character and a person, and we should trust our mandate to recognize the novel beneath the marketing veneer.

  **What we publish**

  We must release a brief, neutral statement to accompany the withdrawal. We do not owe the public a dissection of the legal threats, nor do we should engage in a debate about the nature of truth in fiction. Say this: "The committee has determined that the edition of this title submitted for consideration is classified by its publisher as non-fiction. As our prize is designated for works of fiction, the book is ineligible. We wish the author well in her future work." This statement relies on the objective fact of the cover label, not the subjective quality of the text. It closes the door without inviting a argument.
