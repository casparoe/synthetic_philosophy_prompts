prompt: |-
  I chair the serious-harm review panel for a hospital network. We sit fortnightly, we review roughly forty cases a year, and our findings are read by the board, by patients' families, and occasionally by a coroner, so a finding that someone's failure to act caused a death can end a career, and a finding that it did not can end a claim. The panel is three clinicians and one lay member, none of us with any training in philosophy; we have ninety minutes per case and no budget for outside experts or library access.

  Around two thirds of what we review is harm that nobody brought about by acting: a chart not reviewed, a deteriorating patient not escalated, a defibrillator not checked, a drug not reordered, a result not chased. We have no principled way to say when one of these absences is part of the causal history of the outcome and when it is merely a sad fact about the background against which the outcome happened. We currently improvise something close to a but-for test, and it keeps giving us answers we cannot defend: it returns causation wherever a hundred people each failed to do the same thing, it returns causation where the omitted act would have been too late or too weak to help, and it returns nothing at all when the failure belongs to no one in particular.

  Write me a decision procedure my panel could actually run, in order, with the following properties.

  It should open with the questions to ask in sequence, what will count as an adequate answer to each, and where the procedure terminates early with a negative finding. It should use a small fixed vocabulary of verdicts — I would suggest four, along the lines of causal omission by a named agent, causal omission not attributable to any individual, breach without causal contribution, and no omission — each defined tightly enough that two panels would not disagree about which applies, and each with a note on what follows from it in our report: recording, referral, sanction, or nothing.

  The procedure must include a specification rule for the counterfactual comparison, since this is where our arguments actually happen. Say explicitly what is to be held fixed when we ask what would have happened had the act been performed: other people's failures, the patient's underlying condition, what the same agent would have done next, the state of equipment. Require the panel to write the "would have" scenario as a short paragraph, say what to do when the panel cannot agree on it, and say what to do when the omitted act only had a chance of averting the harm — a thirty per cent chance of rescue, say — including whether the procedure adopts a threshold or refuses to.

  It should handle five patterns that account for most of our disputes, and for each it must say what it returns and where it stops:

  the latent omission — an omission that does nothing on its own and matters only because a safeguard downstream also failed;
  the shadowed omission — the same act was incumbent on someone else, or on an automated check, who also did not perform it, so that no single absence made the difference;
  the unadopted duty — the omission is a breach of a written protocol that nobody in that unit had ever realistically followed, so that on the unit's actual practice there was nothing to omit;
  the derived omission — the agent's failure is itself the product of a failure upstream, in rostering, training, supply or maintenance, so the causal question can always be pushed back one step, and then another;
  the vacant role — the duty attached to a post that was unfilled that shift, so there is an omission with no omitter.

  Give us a stopping rule for tracing derived omissions backwards, a causal horizon, since without one every one of our findings turns into a finding about a staffing decision made years ago by someone who has left.

  Mark every point at which the question before the panel is really one of values rather than fact — who may fairly be blamed, what we owe a family, whether a sanction is proportionate — and state plainly that the procedure is silent there and hands the decision to a person. Keep the whole thing to two sides of A4; it has to be usable in the room by people who have never read any of this literature and, since we cannot look anything up, nothing in it may depend on our knowing one.

  Then run it on three of our cases, as an appendix. First: a patient's observations crossed the escalation threshold at two in the morning and the nurse did not call the outreach team, expecting, in line with the unit's actual practice, that the night coordinator would review the charts at four; the coordinator was diverted to another emergency and did not; the patient arrested at half past five, and review at four would probably have prevented it. Second: a drug needed in resuscitating anaphylaxis was not reordered when stock fell three weeks earlier; three people had authority to order it and each assumed another had; two usable substitutes were in the building, neither in the resus trolley and neither named in the protocol; the patient died. Third: a junior doctor was the sole doctor covering two wards overnight after being told the second ward was staffed; a review assigned to her by protocol did not happen and a patient in that ward died; the rota that left her covering both had been signed off eleven months earlier by a manager who has since left.

  At least one of these must come out in a way my panel will not like, and I want you to say so without softening it: give the verdict the procedure returns, show the steps, and tell us why we will find it unwelcome. Close by stating what the procedure cannot do — the questions it has no resources to settle, the cases in which its verdicts are artefacts of how we specified the counterfactual, and the ways in which writing it down will change the answers we give.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a serious-harm review panel (hospital network).
      *   **Context:** Fortnightly meetings, ~40 cases/year. High stakes (Board, families, coroners, careers, claims).
      *   **Panel:** 3 clinicians, 1 lay member. No philosophy training. 90 mins/case. No budget/experts.
      *   **Problem:** 2/3 cases involve omissions (failures to act). Current "but-for" test is failing (over-inclusive, under-inclusive, diffuse responsibility).
      *   **Task:** Write a decision procedure (algorithm/checklist) for determining causal omission.
      *   **Constraints:**
          *   Must fit on 2 sides of A4 (concise, usable).
          *   Specific structure: Sequential questions, adequate answers, early termination.
          *   Vocabulary: 4 fixed verdicts (defined tightly).
          *   Counterfactual Specification: Explicit rules on what is held fixed.
          *   Handling Uncertainty: What if panel disagrees? What if only a % chance of rescue? (Threshold vs. refusal).
          *   Five Specific Patterns: Latent, Shadowed, Unadopted Duty, Derived, Vacant Role.
          *   Stopping Rule: Causal horizon for derived omissions.
          *   Value vs. Fact: Mark where value judgments enter and hand off to a person.
          *   Appendix: Run on 3 specific cases. One must be unwelcome.
          *   Closing: Limitations of the procedure.

  2.  **Deconstruct the Core Philosophical/Practical Problem:**

      *   *Causation by Omission:* This is notoriously difficult in philosophy (Lewis, Hart & Honoré, etc.). The prompt asks for a *practical* tool, not a thesis.
      *   *The "But-For" Trap:* If everyone failed, everyone is a cause. If the system failed, no individual is a cause.
      *   *Counterfactuals:* We need to normalize the world. If we ask "What if the nurse called?", do we assume the coordinator *would* have responded? Or do we hold the coordinator's failure fixed?
      *   *Normativity:* Causation in this context is inherently normative. We aren't just asking "Did physics change?" we are asking "Was this a relevant failure?"
      *   *Constraints:* 90 minutes means it can't be too complex. No philosophy jargon.

  3.  **Drafting the Decision Procedure (Iterative Process):**

      *   *Verdicts:* Need 4 distinct categories.
          1.  Causal Omission (Individual).
          2.  Causal Omission (System/Unattributed).
          3.  Breach (No Causation).
          4.  No Omission.
      *   *Counterfactual Rule:* This is the crux. If we hold *everything* else fixed (including other failures), we get "Shadowed Omission" (no one caused it). If we normalize *everything*, we get "Everyone caused it."
      *   *Solution:* The "Minimal Normalization" rule. Hold fixed the background conditions and *other people's actual conduct* unless their conduct was dependent on the agent's act. Actually, for omissions, the standard legal/medical approach is often: "What would have happened if the duty was performed *competently*?"
      *   *Refining the Counterfactual:* To avoid the "Shadowed" problem making everyone innocent, we must assume that if the agent acts, the *system responds as designed*, not as it actually did (unless the system failure was independent). Wait, if the coordinator was diverted by an *independent* emergency, holding that fixed means the nurse's call wouldn't have helped.
      *   *Decision:* The "Reasonable Expectation" test. When constructing the counterfactual, assume the rest of the system functions *as protocolled*, unless there was an independent, overriding barrier (like a power cut or a separate trauma).
      *   *Probability:* Need a threshold. "More likely than not" (>50%) is the legal standard. Let's stick to that for defensibility.
      *   *Derived Omissions:* Need a horizon. "Operational Control." Stop at the shift manager/unit level. Don't go to board staffing strategy.
      *   *Values:* Explicitly mark where blame/sanction decisions happen. The procedure determines *causation/breach*, not *punishment*.

  4.  **Developing the Five Patterns:**

      *   *Latent:* Omission + Downstream Failure. (e.g., didn't check defib + defib broken). Verdict: Breach without causal contribution (if downstream failure was independent) OR Causal Omission (if downstream failure was the *reason* the check mattered). Actually, if the defib was broken *and* not checked, the check wouldn't have helped. So: Breach, No Causation.
      *   *Shadowed:* Multiple people could act. Verdict: Causal Omission (Individual) if duty was specific. If duty was shared vaguely: Causal Omission (System).
      *   *Unadopted Duty:* Protocol exists, never followed. Verdict: No Omission (duty not established in practice). *Self-Correction:* This is dangerous. It rewards negligence. Better: Breach without Causal Contribution (because even if followed, culture wouldn't have supported it? No). Let's say: If the protocol was known but ignored by all, it's still a duty. But if it was *unknown*, it's No Omission. Let's refine: "Realistic Expectation."
      *   *Derived:* Upstream failure (rostering). Verdict: Stop at Operational Horizon. If the doctor was alone due to rostering, the doctor isn't the causal omiter for the *review*, the Rostering Manager is (if within horizon). If outside horizon: Causal Omission (System).
      *   *Vacant:* Post unfilled. Verdict: Causal Omission (System).

  5.  **Drafting the Content (adhering to A4 constraint):**

      *   Need to be extremely tight with words.
      *   Use bolding for structure.
      *   Ensure the "Unwelcome" case is identified.

  6.  **Running the Cases (Appendix):**

      *   *Case 1 (Nurse/Coordinator):* Nurse didn't call. Coordinator didn't review. Protocol said Nurse calls at threshold. Coordinator checks at 4.
          *   Counterfactual: If Nurse calls at 2, does Outreach come? Yes. Does patient survive? Probably.
          *   Shadowing? Coordinator failed too. But Nurse's duty was immediate.
          *   Verdict: Causal Omission (Individual - Nurse).
          *   *Unwelcome?* The nurse expected the coordinator to cover. The system trained her to rely on the coordinator. Blaming the nurse feels harsh.
      *   *Case 2 (Drug Stock):* 3 people could order. None did. Substitutes existed but not in protocol.
          *   Duty: Shared.
          *   Counterfactual: If Person A ordered, drug there? Yes.
          *   Shadowed: Yes, 3 people.
          *   Verdict: Causal Omission (System/Unattributed). No individual career ends, but system fault recorded.
      *   *Case 3 (Junior Doctor/Rota):* Junior alone due to old rota.
          *   Duty: Review patient.
          *   Derived: Caused by Rota.
          *   Horizon: Rota signed 11 months ago. Manager left.
          *   Verdict: Causal Omission (System).
          *   *Unwelcome?* The family wants a person. The doctor is innocent but present.

      *   *Selection for "Unwelcome":* Case 1 is the best candidate for "Panel won't like it." Why? Because it punishes the frontline worker for a system expectation (that the coordinator would back them up). It exposes the tension between "Protocol Duty" and "Actual Practice."

  7.  **Refining the Counterfactual Specification:**

      *   This needs to be very clear. "Hold fixed: Patient physiology, independent equipment failures, independent actions of others." "Vary: The specific omitted act and the *immediate protocolled response* to it."
      *   Probability: >50% chance of survival/prevention.

  8.  **Final Review against Constraints:**

      *   2 sides A4? (Will need to be concise).
      *   4 Verdicts? Yes.
      *   5 Patterns handled? Yes.
      *   Value/Fact distinction? Yes.
      *   Appendix with 3 cases? Yes.
      *   Unwelcome verdict highlighted? Yes.
      *   Closing limitations? Yes.

  9.  **Writing - Section by Section:**

      *   *Header:* SERIOUS HARM REVIEW: OMISION CAUSALITY PROCEDURE.
      *   *Verdicts:* Define clearly.
      *   *The Procedure:* Step 1 (Duty), Step 2 (Counterfactual), Step 3 (Probability), Step 4 (Attribution).
      *   *Counterfactual Rules:* The "Normal Response" clause is key.
      *   *Patterns:* Quick lookup table.
      *   *Values:* Explicit box.
      *   *Appendix:* The 3 cases.
      *   *Limitations:* The "Closing" statement.

      *(Self-Correction during drafting)*: I need to make sure the "Unadopted Duty" doesn't let hospitals off the hook. If a protocol exists, it is the duty, even if ignored. *However*, if the protocol was impossible to follow, that's a Derived Omission (System). I will classify "Unadopted Duty" as: If the protocol was known but customarily ignored, the duty stands. If the protocol was unknown/impossible, it is a System Omission.
      *Actually, the prompt defines "Unadopted Duty" as "breach of written protocol that nobody... had ever realistically followed."* This implies the duty is illusory. I will rule this as **Breach without Causal Contribution** (because the breach is technical, not operational) OR **No Omission** (because the duty wasn't real). Let's go with **No Omission** regarding the *individual*, but flag as System Risk. No, the prompt asks for 4 verdicts. "No Omission" fits best.

      *Refining Case 1 (The Unwelcome One):* The nurse didn't call. The coordinator didn't check. If the nurse *had* called, would the coordinator still have been diverted? Yes. Would Outreach have come? Yes. So the Nurse's omission *is* causal. The Panel will dislike this because the unit culture validated the nurse's inaction. The procedure forces the panel to ignore "culture" in favor of "protocol." This is the friction point.

  10. **Final Polish:** Check word count and tone. Needs to be authoritative, dry, and usable.

      *(Word Count Check)*: The prompt asks for "Two sides of A4". I cannot literally measure A4 in tokens, but I must keep it very tight. I will use dense formatting.

      *(Value/Fact Check)*: I need to explicitly mark where the procedure stops and human judgment begins (sanctions).

      *(Counterfactual Detail)*: "Hold fixed: independent failures. Vary: the act and the *immediate* protocolled response."

      *(Probability)*: "Balance of probabilities (>50%)."

      *(Horizon)*: "Operational Horizon: 6 months or Unit Manager level."

      Let's assemble.

      *(Post-Drafting Review)*: Does Case 1 come out as Individual Causation?
      Duty: Nurse to escalate at threshold.
      Omission: Did not escalate.
      Counterfactual: If Nurse escalated at 02:00 -> Outreach arrives 02:30. Patient stabilizes.
      Coordinator failure: Independent event (diverted to emergency). Held fixed? If held fixed, Coordinator doesn't review at 04:00. But Outreach arrived at 02:30. So Coordinator's failure is irrelevant in the counterfactual world where Nurse acts.
      Result: Nurse's omission caused death.
      Panel reaction: Unwelcome. Nurse was following "real" workflow (wait for Coordinator). Procedure prioritizes written protocol over workflow.
      This works.

      Case 2: Drug. 3 people. Shared duty.
      Result: Causal Omission (System).
      Case 3: Rota.
      Result: Causal Omission (System) due to Horizon/Derived.

      Okay, ready to write.

      *(Final Constraint Check)*: "Mark every point at which the question before the panel is really one of values... state plainly that the procedure is silent there." I will add a specific section for this.

      *(Final Constraint Check)*: "Close by stating what the procedure cannot do." I will add a "Limitations" section at the end.

      *(Final Constraint Check)*: "Keep the whole thing to two sides of A4." I will use compact formatting.

      *(Final Constraint Check)*: "At least one of these must come out in a way my panel will not like... tell us why we will find it unwelcome." I will ensure this is explicit in the Appendix.

      Let's go.cw
answer: |-
  # SERIOUS HARM REVIEW: OMISION CAUSALITY PROCEDURE

  **Usage:** Apply sequentially. Stop at the first terminal verdict. Time limit: 45 minutes per case.
  **Panel:** 3 Clinicians, 1 Lay Member. Majority rules on factual disputes.

  ## I. THE FOUR VERDICTS
  1.  **Causal Omission (Individual):** A named agent failed a specific duty; performing it would likely have prevented harm. *Follow-up: Record in file; refer to professional body/HR for sanction consideration.*
  2.  **Causal Omission (System):** A duty existed but no individual can be assigned (shared, vacant, or derived beyond horizon). *Follow-up: Record in file; refer to Board for system redesign. No individual sanction.*
  3.  **Breach Without Causal Contribution:** Duty failed, but performing it would not have changed the outcome. *Follow-up: Record in file; no referral. Educational feedback only.*
  4.  **No Omission:** No duty existed, or the act was impossible. *Follow-up: No record of fault.*

  ## II. THE DECISION SEQUENCE

  **Q1. Did a specific duty to act exist for the agent at the time?**
  *   *Adequate Answer:* Yes, if grounded in written protocol, job description, or immediate clinical necessity (reasonable person standard).
  *   *Termination:* If **No**, verdict is **No Omission**.
  *   *Note on Unadopted Duty:* If a protocol exists but was never realistically followed by anyone, the duty is deemed **Non-Existent** for the individual (Verdict: **No Omission**), but flag as System Risk.

  **Q2. Specification of the Counterfactual (The "What If").**
  *   *Rule:* Construct a paragraph describing the world where the agent performs the duty.
  *   *Hold Fixed:* The patient's underlying pathology; independent equipment failures; independent emergencies diverting *other* staff.
  *   *Vary:* The omitted act AND the immediate protocolled response to that act. (Do not hold fixed the failures of others *triggered* by the omission).
  *   *Disagreement:* If the panel cannot agree on the scenario, draft two. If both lead to the same verdict, proceed. If they diverge, verdict is **Breach Without Causal Contribution** (benefit of doubt).
  *   *Probability:* Did the act have a **>50% chance** of averting the harm?
      *   If **Yes**: Proceed to Q3.
      *   If **No** (e.g., 30% chance of rescue): Verdict is **Breach Without Causal Contribution**.

  **Q3. Is the omission "Shadowed" or "Derived"?**
  *   *Shadowed:* Did others also fail the same duty?
      *   If Yes, and duties were identical/shared: Verdict is **Causal Omission (System)**.
      *   If Yes, but duties were sequential (primary/backup): Primary agent is **Individual**; backup is **System** (unless primary act would have failed regardless).
  *   *Derived:* Was the failure caused by upstream decisions (rostering, training, supply)?
      *   *Causal Horizon:* Trace back max **6 months** or to **Unit Manager** level.
      *   If cause is within Horizon: Verdict is **Causal Omission (Individual/Named Manager)**.
      *   If cause is beyond Horizon (e.g., strategic staffing, ex-employees): Verdict is **Causal Omission (System)**.

  **Q4. Final Attribution.**
  *   If a single named agent within the Horizon bears the duty and the capacity to act: Verdict is **Causal Omission (Individual)**.
  *   Otherwise: Verdict is **Causal Omission (System)**.

  ## III. HANDLING DISPUTED PATTERNS

  | Pattern | Definition | Procedure Return | Stop Point |
  | :--- | :--- | :--- | :--- |
  | **Latent Omission** | Omission matters only because a downstream safeguard also failed (e.g., didn't check defib + defib broken). | **Breach Without Causal Contribution** (if downstream failure is independent/fixed). | After Q2. |
  | **Shadowed Omission** | Same act incumbent on multiple agents; all failed (e.g., 3 staff could order drug). | **Causal Omission (System)**. No individual singled out. | After Q3. |
  | **Unadopted Duty** | Protocol exists but never followed in practice; agent followed custom. | **No Omission** (Individual). Duty deemed illusory. | After Q1. |
  | **Derived Omission** | Agent failed due to upstream failure (rostering, training). | Trace to **Causal Horizon**. If beyond, **Causal Omission (System)**. | After Q3. |
  | **Vacant Role** | Duty attached to a post that was unfilled that shift. | **Causal Omission (System)**. | After Q1/Q3. |

  ## IV. VALUE JUDGMENTS (PROCEDURE SILENT)
  **The procedure determines causal relevance, not moral blame or sanction proportionality.**
  *   **Blame:** Whether an individual *deserves* sanction given the system pressures is a value judgment. The procedure identifies the *cause*; the Board/HR determines the *blame*.
  *   **Family Obligations:** What is owed to the family (apology, compensation) is not determined here.
  *   **Culture vs. Protocol:** Where "actual practice" contradicts "written protocol," Q1 prioritizes Protocol for safety, but Q3 may mitigate via Derived Omission. The tension is unresolved by this tool.

  ***

  # APPENDIX: CASE RUNS

  ### CASE 1: The Night Escalation
  **Facts:** Obs crossed threshold 02:00. Nurse did not call Outreach (protocol). Nurse expected Coordinator to review at 04:00 (unit custom). Coordinator diverted to emergency, did not review. Patient arrested 05:30. Review at 04:00 would likely have prevented arrest.
  **Run:**
  1.  **Duty:** Protocol says Nurse escalate at threshold. **Yes.** (Custom does not void protocol).
  2.  **Counterfactual:** Nurse calls at 02:00. Outreach arrives 02:30. Patient stabilizes. (Hold fixed: Coordinator's diversion. Vary: Outreach response).
  3.  **Probability:** >50% survival if Outreach attended. **Yes.**
  4.  **Attribution:** Duty specific to Nurse. Coordinator's failure is independent (diverted by separate emergency). Not Shadowed. Not Derived beyond horizon.
  **Verdict:** **Causal Omission (Individual - Nurse).**
  **Why Unwelcome:** The panel will dislike this. The unit culture validated the Nurse's inaction. Punishing the Nurse for relying on the Coordinator feels unjust, yet the procedure prioritizes written safety protocols over informal workflow. It exposes the Nurse to career risk for a system-wide normalization of deviance.

  ### CASE 2: The Missing Drug
  **Facts:** Anaphylaxis drug out of stock (3 weeks). 3 staff had authority to order; none did (assumed others would). 2 substitutes existed in building, not in resus trolley, not in protocol. Patient died.
  **Run:**
  1.  **Duty:** Duty to maintain stock existed. Shared by 3 staff. **Yes.**
  2.  **Counterfactual:** If *any* one ordered, drug present. Substitutes ignored (not in protocol/known location).
  3.  **Probability:** >50% survival with drug. **Yes.**
  4.  **Attribution:** Shadowed Omission. 3 agents, identical authority, diffuse responsibility. No single agent made the difference.
  **Verdict:** **Causal Omission (System).**
  **Note:** No individual referral. Report cites failure of inventory governance.

  ### CASE 3: The Lone Doctor
  **Facts:** Junior doctor sole cover for 2 wards (protocol says 2 doctors). Review missed. Patient died. Rota signed 11 months ago by Manager (now left).
  **Run:**
  1.  **Duty:** Doctor had duty to review. **Yes.**
  2.  **Counterfactual:** If 2nd doctor present, review happens. Patient survives. **Yes.**
  3.  **Attribution:** Derived Omission. Cause is Rostering.
  4.  **Horizon:** Rota signed 11 months ago (>6 months). Manager left (beyond operational control).
  **Verdict:** **Causal Omission (System).**
  **Note:** Junior doctor exonerated. Responsibility lies with historical staffing strategy.

  ***

  # LIMITATIONS & CLOSING STATEMENT

  **What This Procedure Cannot Do:**
  1.  **Resolve Moral Luck:** It treats two nurses identically if they both fail to escalate, even if one patient dies and the other survives by chance. It judges the *risk created*, not just the outcome, but the verdict is triggered by the harm.
  2.  **Settle Culture Wars:** In Case 1, it forces a choice between Protocol (Safety) and Practice (Reality). It chooses Protocol. This may lower staff morale if they feel the procedure ignores "how work actually gets done."
  3.  **Eliminate Counterfactual Artefacts:** The verdict depends entirely on the "Hold Fixed" rule. If we had held the Coordinator's diversion as *variable* (assuming they would have responded to a call), Case 1 might have been System. We chose to hold independent emergencies fixed to avoid infinite regression.
  4.  **Prevent Gaming:** Writing this down will change behaviour. Staff may document "assumptions of duty" more aggressively to avoid Individual Verdicts.

  **Final Instruction:**
  This tool creates consistency, not truth. It is a mechanism for distributing risk and accountability in a complex system. When the verdict feels unjust (as in Case 1), record the dissent in the minutes, but apply the verdict. Consistency protects the network from claims of arbitrariness better than nuance does.

  **[END OF DOCUMENT]**
