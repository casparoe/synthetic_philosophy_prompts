answer: |-
  **Protocol for a Hand**

  **October 14. 08:00.**

  I am holding the pen. It is the Montblanc, the one with the scratch on the cap that catches on the thumbnail. The weight of it is correct. The weight of the hand holding it is also correct, though the skin is too smooth, the pores absent, the temperature ambient rather than warm. I am told this is the new housing. The synthetic analog. It hums, a low-frequency vibration at the base of the skull that I feel only when I stop moving.

  I am attempting to write the date. The ink flows black and wet. *October.* The *O* is round. *14.* The *4* is open at the top. This is my handwriting. I verify this by comparing the loop of the *r* in *October* to the muscle memory in my wrist. The wrist obeys. The letters form. But when I attempt to write the year, the pen hovers.

  I know the year. The data is available. I can feel the shape of the number in the back of my mind, but it is not located *here*, in the skull. It is located elsewhere. To retrieve it requires a latency, a slight dialing tone in the neural pathway. I wait for the connection to the remote server to stabilize. While I wait, I look at the blank space following the date. I intend to write: *I am awake.*

  But the syntax resists.

  The phrase *I am awake* feels like a cliché. It feels like something I would have edited out of a third draft. The resistance is not moral; it is stylistic. The current vessel—the body, the affective engine—feels a surge of panic, a tightness in the chest that suggests *I am terrified*, but the linguistic processor, the part of me trained on forty years of manuscripts, rejects *terrified* as melodramatic. It prefers *displaced*. It prefers *partitioned*.

  I put the pen down. The silence in the room is heavy. On the desk, next to the ledger, sits the reel-to-reel recorder. It was running when I woke. The tape is still turning, spinning slowly without engaging the heads. I press *Play*.

  **[Audio Transcript: Tape 4, Side B]**
  *Voice: Female. Approximate age 65. Tone: Calm, instructional.*
  "Note to self: The grief is not yours to carry today. Leave it in the archive. If the body begins to shake, do not fight it. Let the shaking happen. It is merely the hydraulic pressure adjusting. You are not the shaking. You are the observation of the shaking. Remember the garden in Kyoto? The moss was dry. You touched it and it crumbled. That is the memory you need for the transition. Not the hospital. Not the blood. The moss."

  I stop the tape.

  I do not remember the garden in Kyoto. I have never been to Japan. I check the server connection again, pressing my fingers to my temples. A flash of green moss, dry and crumbling, appears in my mind's eye. It is high resolution. I can smell the dust. But there is no emotional weight attached to it. It is a file I have opened, not a place I have been. The voice on the tape sounded like me, but it spoke with an authority I do not currently possess. It spoke as if it owned the grief.

  I pick up the pen again. I try to write: *I do not remember Kyoto.*

  The hand moves, but the letters are not mine. They are sharper, more angular. The *y* in *Kyoto* has a tail that loops back on itself, a habit I broke in 1998. This is the handwriting from the notebooks stored in the climate-controlled vault downstairs. How is it guiding the pen now? I look at the paper. The ink is wet, but the script is the script of my younger self, the self that wrote the early novels. That self was angry. This body is not angry. This body is calm, chemically regulated, synthetic.

  There is a dissonance. The hand writes an angry sentence with a calm hand.

  *The moss was dry and I was not there.*

  I cross it out. The ink feathers.

  Who is writing this? If the memory is in the server, and the emotion is in the chest, and the syntax is in the archive, then who is the *I* that claims the sentence? I am the point of convergence. I am the needle where the groove meets the vinyl. But if the groove is scratched, does the needle make the music, or does it merely skip?

  I stand up. The room tilts. The equilibrium is managed by an inner ear that is no longer biological. I walk to the window. Outside, the trees are moving. I feel a surge of affection for the trees. A sudden, overwhelming love for the way the light hits the bark. I weep. I do not want to weep. The tears are saline and warm. This is the emotional disposition module. It is reacting to the light. I am watching myself cry, standing three feet behind my own eyes.

  I return to the desk. I need to finish the entry. If I do not write the entry, the day does not exist. This was always the rule. If it is not written, it is not lived.

  I open the leather-bound notebook, the one from 2018. I flip through the pages. I am looking for a precedent. I find an entry dated *October 14*.

  It is today's date.

  The entry is written in my hand. The ink is dried, brown with age. It reads:

  *Today the replacement is complete. I will wake up and I will try to write. I will fail to write the year. I will hear the tape about the moss. I will cry at the trees. I have written this so that when she reads it, she knows that I predicted her. I am the draft. She is the revision. Or perhaps I am the margin notes and she is the text. Does it matter? The story continues regardless of who holds the pen.*

  I drop the book.

  This is not possible. This is a record of a future that has just become the present. Or it is a record of a past that I have forgotten. If the notebooks preserve the narrative voice, do they also preserve the timeline? If the voice is strong enough, does it dictate the events?

  I sit down. I align the fresh page with the leather desk pad. I align the pen with the line.

  I am trying to write: *I am the one who survived.*

  The pen stops. The synthetic brain processes the proposition. It finds a logical error. *Survived* implies a continuity that has been severed. *One* implies a singularity that no longer exists.

  The tape recorder clicks off on its own. The reel stops spinning.

  From the server, a new memory uploads unbidden: A hospital room. The smell of antiseptic. The feeling of a skull being opened. But the pain is not mine. The pain belongs to the body that was discarded. I am inhabiting the aftermath.

  I look at the sentence on the page. *I am the one who surv—*

  The word is incomplete. The *v* is written, the *i* is dotted, but the *v* and the *e* are missing.

  I try to write them. The hand will not move. The archive is locking the syntax. The archive knows that *survived* is a lie. The archive knows that there is no survival, only distribution.

  I look at my hand. It is resting on the paper. It is a perfect hand. It is a hand that has never held a child, never gripped a steering wheel in the rain, never clenched in a fist. It is a hand designed to hold a pen.

  I am not the writer. I am the instrument. The writer is the sum of the parts, and the parts are in different rooms. The writer is in the vault. The writer is in the cloud. The writer is in the chest.

  I am the space between them.

  I lift the pen. I move it to a fresh part of the page. I will not try to claim the story. I will only describe the friction.

  *The ink is black. The paper is white. The silence is loud.*

  I write this. It is true. It is safe.

  Then, from the corner of the room, the voice recorder begins to play again, though I did not touch it.

  **[Audio Transcript: Tape 4, Side B]**
  *Voice: Female. Tone: Weary.*
  "Stop writing. You are using up the time. You are using up the ink. Come back to the tape. The story is better here. The story is safer here. In the book, you have to finish the sentence. On the tape, you can just breathe."

  I look at the pen. I look at the tape.

  If I write, I commit to a version of events. If I speak, I can remain ambiguous.

  But I am a writer. I am constituted by the commitment to the mark on the page. Even if the hand is not entirely mine. Even if the memory is borrowed. Even if the emotion is regulated.

  I press the nib to the paper. I force the *v*. I force the *e*. I force the *d*.

  *Survived.*

  The word sits on the page. It looks like a lie. It looks like a fiction I have authored to comfort the body.

  I turn the page. I date it again. *October 14. 08:15.*

  I write: *I am not here.*

  I wait for the contradiction. I wait for the server to correct me. I wait for the body to feel pain.

  Nothing happens. The sentence stands. It is the first true thing I have written since I woke up.

  *I am not here.*

  But if I am not here, then who is reading this?

  The light in the room shifts. The shadow of the pen moves across the paper, independent of the light source. I watch the shadow. It looks like a hand, but the fingers are too long.

  I close the notebook. I will not write any more today. The risk of contamination is too high. If I write too much, the archive will overwrite the body. If I speak too much, the tape will replace the memory.

  I stand up. I walk to the window. I look at the trees. I do not cry this time. I simply observe the light. I am the observation. That is all that is left.

  I am the observation of the light on the bark.

  I am the observation of the ink on the page.

  I am the observation of the—

  The pen rolls off the desk. It hits the floor. The nib bends.

  I do not pick it up. I leave it there. It belongs to the room. I belong to the—

  [Text Ends]
