answer: |-
  Here is a principle that unifies your eight cases, resolves the tensions you identified, and provides a actionable checklist.

  ### The Principle: The Structural Tail Truncation (STT) Test

  **Core Statement:** Average-case reasoning is permissible if and only if the deployment architecture **structurally truncates** the loss distribution's right tail below a catastrophic threshold, independent of the model's internal reasoning. If the architecture allows a rare model output to map to an unbounded or correlated loss without interception, you owe yourself a worst-case argument.

  **Why this unifies your cases:**
  Your intuition wasn't tracking "stakes" (Case 3 vs 2) or "capability" (Case 5 vs 2). It was tracking **degrees of freedom in the failure pathway**.
  *   **Truncation** happens via hard constraints (Case 3), human-in-the-loop (Case 1), or accountability structures (Case 5).
  *   **Open Tails** happen via autonomy (Case 2), scale/correlation (Case 4, 6), adversaries (Case 7), or non-stationarity (Case 8).

  ---

  ### The Deployment Checklist

  Paste this into your review doc. A "No" to any question triggers a requirement for worst-case reasoning (red-teaming, formal verification, or adversarial evals).

  1.  **Action Bounds:** Is the set of permissible actions hard-limited to a safe subset, such that *no* model output can trigger a high-severity event?
      *   *Motivated by Case 3 (Root + Fixed Script).* The script is the truncation; root access is irrelevant.
  2.  **Intervention:** Is there a mandatory, high-fidelity human or system check before any high-leverage action is finalized?
      *   *Motivated by Case 1 (X-ray) vs Case 2 (Coding Agent).* The radiologist truncates the tail of the X-ray model. The lack of review leaves the coding agent's tail open.
  3.  **Correlation:** Does a single failure mode scale linearly with usage, or does it propagate/correlate across instances?
      *   *Motivated by Case 4 (Chatbot) and Case 6 (Tutor).* If one instance hallucinates a dangerous instruction, do 100,000 instances do it simultaneously? If yes, the aggregate tail is fat even if the per-instance tail is thin.
  4.  **Adversary:** Is there an external actor with an incentive to find inputs that maximize loss?
      *   *Motivated by Case 7 (Spam Filter).* Average-case assumes i.i.d. natural data. Adversaries actively search the tail.
  5.  **Stationarity:** Is the deployment distribution guaranteed to remain within the support of the evaluation distribution for the lifetime of the deployment?
      *   *Motivated by Case 8 (Weekly Retraining).* If the distribution drifts, your average-case evals are measuring yesterday's tail, not today's.

  ---

  ### Which Verdicts Does This Force You to Drop?

  Your gut was remarkably consistent, but STT tightens two of them:

  1.  **Case 6 (Tutoring Model):** You said you were "mildly more worried." STT says you should be **maximally worried about the aggregate**, even if per-instance risk is low. If the model has a 0.1% rate of teaching dangerous misconceptions, and you deploy 100,000 instances, you *will* have 100 incidents immediately. If those incidents are correlated (e.g., triggered by a specific curriculum topic), you could have 100,000.
      *   *Correction:* Treat this as worst-case on the *population level*, not the instance level.
  2.  **Case 5 (Human Sysadmins):** You suspected this was special pleading. STT confirms it is **not** special pleading for biology, but **special privilege for accountability**. Humans are truncation mechanisms because they can be sued, fired, or jailed. Models cannot. The "tail" of a human is truncated by social/legal consequences, not just capability.
      *   *Correction:* Keep your verdict, but update your justification. It's about the *system of accountability*, not the agent's substrate.

  ---

  ### Predictions for New Setups

  **(a) Agent writes/runs tests in sandbox; human approves merges.**
  *   **Verdict:** Average-case is fine for the *model*, but Worst-case is needed for the *sandbox*.
  *   **Reasoning:** The human merge approval truncates the code-deployment tail (Clause 2). However, the sandbox must structurally prevent the test code from escaping (Clause 1). If the sandbox is leaky, the agent has found a path to unbounded loss.
  *   **Checklist:** Passes Intervention. Fails Action Bounds *unless* sandbox integrity is proven via worst-case reasoning (escape attempts).

  **(b) Open-weight release, anyone can fine-tune.**
  *   **Verdict:** Worst-case mandatory.
  *   **Reasoning:** You fail Clause 1 (no action bounds), Clause 3 (infinite correlation/scale), and Clause 4 (active adversaries). You have zero control over the loss function others apply to your weights.
  *   **Checklist:** Fails almost every clause. You must eval for misuse capabilities, not just average helpfulness.

  **(c) Frozen model, 5 internal users, one narrow task.**
  *   **Verdict:** Average-case is fine.
  *   **Reasoning:** Low scale (Clause 3 pass), low adversary incentive (Clause 4 pass), stationary task (Clause 5 pass). Even if it fails, the blast radius is contained by the small user base and narrow task.
  *   **Checklist:** Passes all clauses.

  ---

  ### The Meta-Question: Do the Evals Themselves Need a Worst-Case Story?

  **Yes, if and only if the deployment fails the STT test.**

  *   **If Deployment is Truncated (STT Pass):** Your evals can be average-case. Why? Because even if the model has a catastrophic failure mode, the architecture prevents it from manifesting as loss. You only need to measure efficiency/quality.
  *   **If Deployment is Open (STT Fail):** Your evals *must* probe the tail. Relying on average-case evals for an open-tail deployment is a category error. You are measuring the center of a distribution while betting your company on the tail.
  *   **Specific implication:** For Case 2 (Coding Agent), you cannot ship based on "99% pass rate." You need an eval suite specifically designed to find the 1% that deletes the database. If your eval suite is random sampling, it is insufficient by definition.

  ---

  ### The Honesty Check: Is This Just Expected Value (EV) with a Fat Tail?

  **Yes.**

  "Worst-case reasoning" is not a different mathematics; it is **Expected Value reasoning under Knightian Uncertainty** (unknown probabilities) or **Unbounded Loss**.

  *   **Standard EV:** $Risk = P(failure) \times Cost(failure)$. This works when you know $P$ and $Cost$ is bounded.
  *   **Worst-Case Heuristic:** This is what we use when $P$ is unknown (adversaries, drift) or $Cost$ is unbounded (existential risk, company bankruptcy). In these regimes, the integral for EV does not converge, or the variance is so high that the mean is meaningless.

  **The Observation That Distinguishes Them:**
  Can you **insure** the deployment?

  *   If an insurance company will underwrite the deployment for a fixed premium based on your average-case evals, you are in **EV Land**. (This implies they believe the tail is bounded and $P$ is knowable).
  *   If no insurance company will touch it, or the premium exceeds the potential profit, you are in **Worst-Case Land**.

  **Practical Advice:**
  Don't write "Worst-Case Reasoning" on your checklist. It sounds magical. Write: **"Loss Bounding & Distributional Stability."**
  *   If you can bound the maximum possible loss (e.g., "Max cost is $500 because of API rate limits"), use Average-Case.
  *   If you cannot bound the loss (e.g., "Model could convince user to transfer life savings"), use Worst-Case.

  Your "Search-and-Copy" intuition was correct but incomplete. Search creates unknown $P$ (Adversary). Copy creates unbounded $Cost$ (Scale). STT adds the third leg: **Constraints** create bounded $Cost$. Use that triad.
