answer: |-
  # The Dialogue

  **Defender:** Let's ground this. Good's theorem states that for an expected-utility maximizer, where utility is a function of acts and states alone, the ex ante expectation of utility weakly increases with any costless signal. The load-bearing assumption is free disposal: the agent can always choose the act they would have chosen had the signal been null.

  **Skeptic:** That assumption is the fracture point. Consider the job candidate. She is handed the ranking free of charge. She cannot un-read it. Her delivery will inevitably reflect that knowledge—nervousness, defensiveness. The act "give talk while knowing I'm fourth" is physically distinct from "give talk while ignorant." She cannot act as if she hadn't heard.

  **Defender:** You're conflating the signal with its causal consequences. The theorem denies nothing about the signal affecting the world. But ex ante, would she accept the sealed envelope? If a clerk could read the ranking and deliver the talk in her stead, she'd accept that. The harm isn't the knowledge; it's the inability to delegate the performance.

  **Skeptic:** But some decisions are undelegable. The performance *is* the agent. If the model assumes I can act as if ignorant, but my physiology leaks belief, the model's antecedent fails exactly where ignorance has value. You're left with a dilemma: either the theorem doesn't apply to undelegable decisions, or its conclusion is tautological because you've defined the "act" to include the psychological state, thereby baking the cost of information into the utility function.

  **Defender:** I'll concede the tautology risk if we stretch the utility function to include "peace of mind." But that's a specification error, not a theorem failure. If utility depends on belief states, information is a commodity with potential disutility, like noise. The theorem still holds: you never lose by having the *option* to know, provided you can filter its causal impact. Your candidate pays not to be told because she knows she can't filter it. That's a preference consistency test, not a proof that curiosity is irrational.

  **Skeptic:** It becomes a coherence test with no normative advice. If the only way to save the theorem is to say "you shouldn't want to know if knowing hurts," it doesn't tell me when I *should* seek information. It just says "don't seek what you dislike." Regarding our secondary dispute: if an agent re-solves for the worst case over a set of priors after each signal, can they be hurt?

  **Defender:** Yes, but that agent isn't an expected-utility maximizer. They lack probabilistic sophistication. They are updating a set of priors rather than a single posterior. Good's theorem requires a single prior. If information hurts them, it proves they aren't maximizing expected utility, not that the theorem is false.

  **Skeptic:** But that's my point. The theorem protects only agents who already process information perfectly. For everyone else—those facing ambiguity—free information can be toxic. So the theorem describes an idealized coherence, not a constraint on rational curiosity in the wild. I concede that if we fix the model to EU, the math is unassailable. But you must concede that "free disposal of the signal" is often physically impossible for embodied agents.

  **Defender:** I concede that psychological leakage is a real constraint on the option set. If the act space is constrained by belief states, the "ignore" option vanishes. But I maintain that this is a constraint on the *world*, not rationality. The theorem tells us: if you cannot ignore the signal, you are not in the domain where information is guaranteed value. That is advice enough: delegate where possible, or expect costs.

  **Skeptic:** Then we agree the math is sound but disagree on its domain. You see a constraint on coherence; I see a constraint on applicability. The candidate isn't incoherent for paying to remain ignorant; she's recognizing that her belief states are causal variables the theorem treats as external.

  **Defender:** Precisely. The disagreement is whether we expand the model to include belief-states as outcomes or treat them as external causal noise. I prefer the former for purity; you prefer the latter for realism.

  **Skeptic:** And until we settle whether rationality includes managing one's own psychology, the value of information remains ambiguous.

  # Where each of us was wrong

  I argued the Skeptic's lines; my friend argued the Defender's. I was wrong to suggest the theorem offers *no* advice; it correctly identifies that paying to avoid information implies a constraint on the act space or utility function, which is diagnostic. My friend was wrong to imply the agent can always "act as if ignorant"; in undelegable decisions, the belief state is physically constitutive of the act, making free disposal impossible. We should both take back the idea that this is purely about rationality: it is equally about the metaphysics of agency. The theorem holds, but its domain is narrower than we assumed.
