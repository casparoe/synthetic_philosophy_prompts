answer: |-
  We brush the dust to find a physical trace,
  Assuming purpose guides the ancient rite.
  Yet meaning is a lens of modern sight,
  That grants the object its appointed place.
  No artifact exists within this space,
  Unless we grant it shares our human light,
  And project belief onto the dark night,
  To give the silent clay a human face.

  Yet some regimes intentionally hide,
  Whose authority lives in nothingness;
  No archive stands, no monumental stone.
  They sink beneath the unrecording tide,
  The cleaner the void, the darker the guess,
  To eyes that read only the object known.
