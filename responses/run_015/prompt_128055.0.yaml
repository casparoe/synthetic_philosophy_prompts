  7.  **Synthesize the "Mechanics of Backward Induction":**
      *   Where does BI live? It lives within the mind of each agent up to their limit $k$.
      *   Where does BI die? It dies at the boundary of the agent's capacity. It also dies as a *collective* tool because the elimination of a day (e.g., Friday) is not common knowledge.
      *   *Crucial Point:* In standard SEP, "Friday is impossible" is a fact known to all. In this variant, "Friday is impossible" is a fact known *only* to $k \ge 5$. The $k=1$ students still treat Friday as possible.
