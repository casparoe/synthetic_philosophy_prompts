      *   *Reintroducing Common Knowledge:* If the teacher tries to "maximize aggregate surprise," they need to know the distribution of reasoning depths. If the *students* know the teacher is doing this, they start reasoning about the teacher's reasoning about their depths.
      *   *The Trap:* If students know the teacher avoids days that super-reasoners can deduce, the super-reasoners can deduce that the teacher will avoid those days, which changes the deduction...
