          4.  **Constraint:** Focus on the *mechanics* of where backward induction lives or dies. No literature review.

  2.  **Analyze the Standard Paradox (Briefly, for Context):**
      *   Standard SEP relies on *Common Knowledge of Rationality (CKR)* and *Common Knowledge of the Announcement (CKA)*.
      *   Everyone knows everyone knows... that everyone is perfectly logical.
      *   Backward induction works because if Friday were the day, everyone would know by Thursday night. Since it must be a surprise, Friday is out. Then Thursday becomes the new "Friday," etc.
      *   The paradox arises because the conclusion (no day is possible) contradicts the premise (there will be an exam).

  3.  **Analyze the User's Variant (Agent-Relative/Resource-Bounded):**
      *   *Assumption:* Students have different "induction depths" ($k$-step reasoners).
      *   *Announcement:* "Surprise relative to *your* capacity."
      *   *Implication:* The condition for "surprise" is no longer uniform across the class.

  4.  **Address Question 1: Does it break the paradox or make it distributional?**
      *   *Mechanism:* Backward induction requires a shared endpoint. In the standard version, Friday is eliminated for *everyone* simultaneously because *everyone* knows *everyone* knows it's impossible.
      *   *In this variant:* A $k=1$ reasoner (can only think one step ahead) cannot eliminate Friday. They think, "If it's Thursday night and hasn't happened, it could be Friday." They can't do the step: "But if it were Friday, I'd know, so it can't be Friday."
      *   *Result:* For the $k=1$ student, Friday remains a live possibility. For the $k=5$ student, Friday is eliminated.
      *   *Conclusion:* The *global* paradox (no day is possible for anyone) dissolves. It becomes a distributional problem. Some students rule out days; others don't. The "paradox" only persists for the specific subset of students who have sufficient depth to eliminate all days. For them, the contradiction remains. For others, it's just a normal exam.

  5.  **Address Question 2: "Surprising for the class as a whole" vs. Heterogeneous Depths:**
      *   *The Contradiction:* If the teacher says "Surprising for the class," what does that mean?
          *   Interpretation A: Surprising for *all* students. (Impossible if super-rational students exist, because they will deduce the day).
          *   Interpretation B: Surprising for *some* students. (Trivial).
          *   Interpretation C: Surprising relative to *each* student's capacity (as the user suggested).
      *   *The Mechanics:* If Interpretation C holds, there is no single "class state" of knowledge. Knowledge is fragmented.
      *   *Hidden Contradiction:* The contradiction arises if the teacher's announcement implies a *uniform* outcome (e.g., "No one will know the day beforehand"). If a super-reasoner knows it's Wednesday, the announcement is false for them. If the announcement is "It will be a surprise to *you*," then it's true for the bounded reasoner and false for the super-reasoner.
      *   *Key Insight:* The paradox relies on the *interaction* of knowledge levels. In the standard version, I know that *you* know that *I* know. In this version, the super-reasoner knows the bounded reasoner *doesn't* know. This breaks the chain of common knowledge required for the full elimination of all days *for the group*.

  6.  **Address Question 3: Teacher's Choice Procedure & Aggregate Surprise:**
      *   *Teacher's Goal:* If the teacher wants to satisfy the announcement for everyone, they cannot give the exam to the super-reasoners (who will deduce it).
