          *   Bounded-reasoner: Friday stays in. Thursday stays in.
          *   *Interaction:* Can the super-reasoner eliminate Thursday? Only if they know the exam won't be Friday. They know that. But do they know the *teacher* knows they know?
          *   Actually, the simpler break is: To eliminate Thursday, you must establish that Friday is *impossible*. For the bounded reasoner, Friday is *not* impossible. Therefore, the bounded reasoner cannot eliminate Thursday.
