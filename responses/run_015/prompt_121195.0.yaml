  - "Map the chain"
  You've built a pincer movement. Steps 1-5 crush the view if values are measurable (arithmetic beats lexicality). Steps 6-8 crush it if they aren't (no metric means no ordering). Step 9 detonates this across all moral philosophy, forcing Step 10's ugly choice. The tension lives squarely between (1) and (3). You're assuming a shared scale forces linear trade-offs, while lexicality demands a hard stop. It feels like a valid dilemma, but it's likely hiding an equivocation on what a "scale" actually permits. You're treating "measurable" as synonymous with "linearly aggregatable," which is the sneakiest move here.

  - "The weak link"
  Step (4) is the break point. It looks obvious because we think numbers always add up. But having a shared metric doesn't force simple addition. You can have a shared unit—say "utility"—but a rule that says "negative utility counts infinitely until threshold." It's not arithmetic; it's a constrained optimization function. If you drop (1), you lose the scientific measurability you want, making NU vague and vulnerable to "why pain?" objections. It feels like defeatism. If you drop (3), you lose the core negative utilitarian intuition that suffering is special, collapsing into standard hedonic utilitarianism. That defeats the whole purpose. The cost of fixing (4) is admitting that moral math isn't simple addition. It's vector calculus. You can measure both on one scale but apply a non-linear transformation to the suffering side. That saves (1) and (3) without breaking math. You're conflating the *measurement* of intensity with the *aggregation* of value. You can measure pain cardinally but decide it doesn't sum linearly against pleasure. That's not nonsense; it's just a complex value function.

  - "The overreach check"
  Step (9) is definitely overkill. This argument mostly threatens hedonic theories that insist on a single cardinal scale. Rawlsian liberty or Kantian autonomy don't claim liberty and welfare are on the same cardinal line. They accept incommensurability but reject (7). You can order distinct domains without a common metric. "Health > Wealth" doesn't need a conversion rate. So this doesn't kill all lexical theories, just ones that try to be too scientific about feelings. The middle path is qualitative lexicality: you compare domains by type, not magnitude, until the threshold passes. That saves the ordering without needing orthogonal nonsense. You don't need to reject all lexical theories, just the ones that try to force them into a single additive number line.

  - "Bottom line"
  Keep (1) and (3), but ditch (4). Admit that measuring affect doesn't mandate linear aggregation. You can have a cardinal scale for measurement but a lexical rule for decision-making. It's not a bug; it's a feature of constrained maximization. You don't need orthogonal spaces, just a more complex value function. Your friend's right that simple arithmetic kills lexicality, but you're right that measurement doesn't require simple arithmetic. Hold the line on measuring pain, just stop adding it like cash.
