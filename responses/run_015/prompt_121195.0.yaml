  (1) if pleasure and pain are commensurable, there has to be a shared cardinal scale with a neutral zero point, so arithmetic works: 500 hedons minus 3 dolors, etc.

  (2) lexical-threshold negative utilitarianism says suffering-reduction takes absolute priority over pleasure-increase while suffering is above the threshold; below it, pleasure matters in the normal weighted way.

  (3) "absolute priority" here means no quantity of pleasure can outweigh even a tiny suffering that sits above the threshold — if it could, the priority wouldn't be lexical, just heavy weighting.

  (4) but commensurability means the two values live on one line; so in principle an enormous pile of pleasure (say 10^40 hedons) numerically dominates any fixed suffering amount.

  (5) therefore, if pleasure and pain are commensurable, the lexical claim in (3) is false; suffering is just heavily discounted, not lexically prior.

  (6) flip side: if they are incommensurable, there's no shared metric, so you can't literally compare "this suffering" against "that pleasure" with numbers.

  (7) but then the lexical ordering in (2) has no justification, because ordering requires comparing the domains you're ordering.

  (8) so the view is either incoherent (if commensurable) or groundless (if incommensurable).

  (9) and here's where it gets ugly: the same structure applies to any theory that gives one value lexical priority over another — liberty over welfare, autonomy over happiness, whatever — as long as they share a domain.

  (10) so either we reject all lexical-priority moral theories, or pleasure and pain occupy some weird orthogonal value-space where comparison is impossible but ordering still works, which sounds like nonsense to me.

