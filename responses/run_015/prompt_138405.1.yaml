answer: |-
  **Project Title:** Veridical Fictions: A Nyāya Epistemology of the Novel

  **Research Question**
  Standard epistemology asks whether readers believe fiction. This project asks: Under what conditions does fictional discourse generate valid knowledge (*prama*) despite lacking assertoric intention (*tātparya*)? Specifically, can the Nyāya framework for verbal testimony (*śabda*) accommodate the novel, or does fiction require a distinct epistemic categorization? I seek a determinate answer: either fiction satisfies the causal conditions of *śabda* despite the author's non-assertoric stance, or it functions as a hybrid instrument where successful action (*pravṛtti-sāmarthya*) validates cognition independently of speaker intention.

  **Theoretical Context**
  Contemporary philosophy of fiction stalls on the reader's attitude: is it belief or make-believe? This ignores the causal structure of the cognition. Classical Nyāya epistemology treats *śabda* (verbal testimony) as a reliable instrument of knowledge (*pramāṇa*), provided conditions are met: syntactic expectancy, semantic fitness, contiguity, and crucially, the speaker's intention to convey truth. Fiction satisfies the first three but deliberately voids the fourth.

  My hypothesis is that readers derive three distinct cognitions from novels, which current theory conflates. First, **Export**: true beliefs about the actual world (e.g., historical details). Second, **Story-cognition**: grasp of truths within the fiction (e.g., character motives). Third, **Scenario-grasp**: a non-propositional sensibility for how depicted mechanisms unfold. A Nyāya approach sorts these by analyzing the causal conditions of uptake rather than the reader's psychological stance.

  I will test this against two cases. The **Invented Informant**: a novelist depicts a real miscarriage of justice under fictitious names; a reader acts on this information successfully, quashing a conviction. Here, Nyāya conditions for validation (successful action) are met, but the genesis condition (intention) is not. The **Unreliable Narrator**: a narrator lies about motives but reports events accurately. Does the failure of intention contaminate all testimony or only specific claims?

  **Method and Timeline**
  The six months are split between philosophical exegesis and studio practice.

  *   **Months 1–2 (Exegesis):** I will consolidate secondary literature on Nyāya epistemology, focusing on the condition of *tātparya* (intention) and the validation of cognition through *pravṛtti-sāmarthya* (capacity for successful action). I will map the three uptake types onto Nyāya categories.
  *   **Months 3–4 (Drafting):** I will write a novella containing two interleaved strands: an Invented Informant narrative and an Unreliable Narrator sequence. Additionally, I will draft short, controlled passages engineered to isolate Export, Story-cognition, and Scenario-grasp.
  *   **Months 5–6 (Testing & Refinement):** I will circulate the controlled passages to a small reading group. Their reports will not measure "enjoyment" but epistemic uptake: what they claim to know, what they claim is true-in-the-story, and what practical sensibilities they acquired. I will refine the philosophical argument based on whether the taxonomy holds against actual reader reports.

  **Studio Output: Evidential Status**
  The deliverable is the novella plus the controlled passages. For this text to be load-bearing rather than decorative, it must function as a testbed, not an illustration. It fails if the fiction merely exemplifies pre-decided philosophical points. It succeeds only if the reader reports on the controlled passages force a revision of the philosophical taxonomy. For example, if readers report Scenario-grasp where the theory predicts Export, the theory must adjust. The fiction provides the phenomenological data that abstract argument cannot access.

  **Alternatives**
  I reject four alternative approaches.
  1.  **Pure Epistemology Paper:** This loses the practice-led insight into how narrative structure manipulates epistemic conditions.
  2.  **Novel without Thesis:** This fails the fellowship's requirement for a research question.
  3.  **Empirical Study:** Quantitative data on reader uptake misses the qualitative nuance of *how* a cognition is formed.
  4.  **Similarity-Based Epistemology:** One might argue fiction offers *upamāna* (knowledge from similarity) rather than *śabda*. I reject this because Export claims factual truth, not analogy. Readers do not think "justice is *like* this"; they think "justice *is* this."

  **Scope, Risks, and Competence**
  Two risks threaten the project.

  **1. The Pseudo-Problem Risk:** It may turn out that speaker intention is internal to the causal process of cognition such that without it, no verbal cognition arises at all. If so, fiction cannot be *śabda*, and the conflict dissolves.
  *   *Kill Point:* If Month 1 exegesis confirms intention is a strict causal prerequisite for *any* verbal cognition, the project pivots. I will then argue that fiction generates knowledge via a different *pramāṇa* (perhaps inference) triggered by the text, rather than testimony.
  *   *Minimum Success:* A robust philosophical framework distinguishing the three uptake types, even if the Nyāya exegesis remains preliminary.

  **2. The Competence Risk:** I read no Sanskrit. My training is limited to graduate seminars. Nyāya texts are technically dense.
  *   *Kill Point:* If the secondary literature proves contradictory or inaccessible without philological verification, the philosophical core collapses.
  *   *Mitigation:* I will rely on established translations and commentaries, focusing on the structural logic of the epistemology rather than philological nuance. I will not claim to advance Nyāya scholarship but to apply its structural insights to aesthetics.
  *   *Minimum Success:* A coherent application of Nyāya categories to fiction that clarifies the epistemic status of the novel, acknowledging its limits as exegesis.

  This project is viable because it leverages my dual competence: I can construct the narrative conditions (the novella) that philosophers cannot simulate, and I can articulate the epistemic framework (the proposal) that practitioners often lack. The result will be a clarified account of how fiction teaches, grounded in a rigorous tradition outside the standard Western canon.
