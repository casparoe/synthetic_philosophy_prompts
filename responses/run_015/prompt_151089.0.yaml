      *Refining the "Kill Shot":* The expected value of continuing must be positive. If $P(Win) \times (Prize - Bid_{next}) - P(Lose) \times (Bid_{current}) < 0$, you stop. Just because you *can* update doesn't mean the update is worth the cost of the bid.

  6.  **Finalizing the Rankings:**

      1.  **Kill:** Negative Expected Value of the *Next Bid*. (The math doesn't hold).
