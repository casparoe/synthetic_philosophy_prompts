      *   **Reasoning:** Quitting locks in a loss. Staying allows updating beliefs about the opponent's hidden cap (liquidity). Therefore, escalation is rational, not psychological.
      *   **Request:** Identify arguments/evidence that would count against this view. Rank them from "this kills the view" to "merely embarrassing."
      *   **Tone/Style:** American English, analytical, acknowledging potential framing errors.

