  *(Self-Correction on the "Kill Shot")*: Actually, the strongest game-theoretic objection is that in a complete information game, the auction ends immediately. In incomplete information (caps), there is an equilibrium, *but* it involves a bidding function where you stop before your cap if the probability of the opponent having a higher cap is too high. It's not "escalate until you drop." It's "escalate until the marginal cost exceeds the marginal expected benefit." The user claims escalation *itself* is optimal. The counter is that *stopping* is often the Bayes-optimal move.

