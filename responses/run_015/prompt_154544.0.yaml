answer: |-
  ### Part I: The Apparatus in Experimental Vocabulary

  You know Bayesian model comparison. You have a set of models $\mathcal{M}_i$, each with parameters $\theta_i$. You compute the evidence $P(D|\mathcal{M}_i) = \int P(D|\theta_i, \mathcal{M}_i) P(\theta_i|\mathcal{M}_i) d\theta_i$. You prefer models with high evidence, which balances fit (likelihood) against complexity (the Occam factor, arising from the prior volume).

  **Solomonoff Induction (SI)** is this machinery taken to the limit, with specific definitions for "model" and "prior."

  1.  **The Hypothesis Space:** In your work, a model is a parametric family (e.g., a Lorentzian). In SI, a "model" is a specific computer program $p$ running on a Universal Turing Machine (UTM) $U$. The program outputs a binary string. If you are modeling probabilistic data (like decay times), the program outputs probabilities for the next bit, or equivalently, a distribution over strings.
      *   *Counterpart:* A specific instance of a generative model with all parameters fixed.

  2.  **The Universal Prior:** You assign priors $P(\mathcal{M}_i)$ based on plausibility. SI assigns a prior to every program $p$ based solely on its length $L(p)$ in bits:
      $$P(p) = 2^{-L(p)}$$
      This is the **Solomonoff Prior**. It sums to less than 1 over all programs (it is a semimeasure), but it is normalizable over the set of halting programs that produce output.
      *   *Counterpart:* This is an explicit mathematical implementation of the **Occam factor**. In your Bayesian evidence, the Occam factor penalizes models that waste prior volume on parameter space regions that don't fit the data. In SI, the penalty is applied *before* seeing data, based on description length. Shorter programs get exponentially more weight.

  3.  **The Mixture Distribution (Prediction):** You might average predictions over several models weighted by their posterior probabilities. SI averages over *all* computable programs weighted by their posterior:
      $$P(x_{n+1} | x_{1:n}) = \frac{\sum_{p} P(x_{1:n+1}|p) 2^{-L(p)}}{\sum_{p} P(x_{1:n}|p) 2^{-L(p)}}$$
      *   *Counterpart:* **Bayesian Model Averaging** over the set of all computable hypotheses.

  4.  **The Convergence Theorem:** You check $\chi^2/\text{dof}$ to see if a model is consistent. SI provides a bound on the total expected error of the mixture distribution compared to the true data-generating distribution $\mu$. If $\mu$ is computable, the cumulative Kullback-Leibler divergence between SI's predictions and $\mu$ is bounded:
      $$\sum_{n} E[D_{KL}(\mu || P_{SI})] \le -\ln P(\mu) \approx L(\mu) \ln 2$$
      *   *Counterpart:* **Consistency** of an estimator, but with a non-asymptotic error bound. The "cost" of learning the truth is proportional to the complexity (program length) of the truth.

  5.  **The Invariance Theorem:** You worry about the choice of UTM. If you switch from machine $U$ to $U'$, the length of any program $p$ changes by at most an additive constant $C_{U,U'}$ (the length of the compiler/interpreter).
      $$|L_U(p) - L_{U'}(p)| \le C_{U,U'}$$
      In probability space, this is a multiplicative factor $2^{\pm C}$.
      *   *Counterpart:* **Change of Parametrisation**, but with a crucial difference (see Residue 1).

  6.  **Vindication of Occam:** SI does not "select" the simplest model. It weights all models by simplicity. However, because the prior drops exponentially with length, the posterior mass concentrates rapidly on the shortest program consistent with the data.
      *   *Counterpart:* **Maximum A Posteriori (MAP)** estimation in the limit of large data, provided the true model is in the set.

  ---

  ### Part II: Residue Report

  Here is where the translation strains. I will address your four points and indicate whether the friction indicts your vocabulary (experimental practice) or the learning-theoretic claims (SI).

  #### 1. Convention versus Prior
  *Your Suspicion:* Is the choice of reference machine a harmless convention (like units) or a substantive prior choice? Does the uncomputable constant matter?

  *The Translation:* It is **not** a change of units. In your work, changing units (meters to feet) changes the numerical value of parameters but leaves the likelihood function invariant (up to a Jacobian which cancels in model comparison). Changing the UTM changes the *measure* on the hypothesis space. It assigns different absolute probabilities to the same physical hypothesis.

  *The Failure:* The constant $C$ is uncomputable. Therefore, for any finite dataset, the absolute posterior probabilities are ill-defined.
  *   **Does it wash out?** Yes, asymptotically. As $N \to \infty$, the likelihood term dominates the prior constant.
  *   **Can you know when?** No. Because $C$ is uncomputable, you cannot calculate the "burn-in" data size required to overcome the UTM bias. If the true law has complexity 1000 bits, and your UTM choice biases against it by a factor of $2^{1000}$, you will need enough data to generate a likelihood ratio of $2^{1000}$ to correct it.
  *   **Verdict:** This indicts the **learning-theoretic claim** of objectivity. SI is often sold as "the" unique prior. It is not. It is a class of priors that agree asymptotically but can disagree violently on finite data. Your intuition that this is closer to a "choice of prior" than a "choice of units" is correct. It is a subjective choice disguised as a mathematical constant.

  #### 2. Finite Precision
  *Your Suspicion:* My data are reals with error bars. SI uses binary strings. Does discretization hide structure or break the accounting?

  *The Translation:* To apply SI to experimental data, you must encode the data as a binary string. Standard practice is to discretize at the noise floor. A measurement $x \pm \sigma$ becomes a bin index.
  *   **The Risk:** If you discretize too coarsely, you throw away signal. If you discretize too finely (below the noise floor), you introduce bits that are effectively random.
  *   **Complexity in the Noise:** SI treats *all* bits as potentially significant. If you feed it data with 100 bits of precision where the last 90 are instrument noise, SI will search for programs that reproduce those noise bits. Since random noise is incompressible, the shortest program to reproduce it is essentially "print the bits." This increases the complexity of the "true" model by the number of noise bits.
  *   **Verdict:** This indicts a **naive application of SI**, not the framework itself. To make SI work with experimental data, the "program" must include a noise model. The program should output a probability distribution over reals (e.g., a Gaussian mean), and the likelihood is evaluated against the data. If you treat the data as a deterministic string, SI will overfit the noise floor. You must explicitly separate the *signal generator* from the *error model* in the program definition. If you do this, the description-length accounting survives. If you don't, the noise floor becomes a place where complexity is stored for free, and the bound degrades.

  #### 3. The Compressibility of the World
  *Your Suspicion:* SI assumes the world is low-complexity. Is this a theorem or an empirical premise? What if the world is incompressible?

  *The Translation:* The convergence bound $\sum E[D_{KL}] \le K(\mu) \ln 2$ depends entirely on $K(\mu)$, the complexity of the true source.
  *   **If the world is simple:** $K(\mu)$ is small. SI converges fast. Occam's razor works.
  *   **If the world is random:** $K(\mu) \approx N$ (the length of the data). The bound becomes trivial. SI converges to a uniform distribution (maximum entropy). It does not "fail" to converge; it converges to the prediction that "nothing is predictable."
  *   **Verdict:** This indicts the **philosophical interpretation** of SI, not the math. SI does not prove the universe is compressible. It proves that *if* there is compression to be had, SI will find it as efficiently as possible. The success of Occam's razor in physics is an **empirical discovery** about our universe, not a theorem of logic. SI is a tool that exploits that regularity; it does not create it. If you told me the world were incompressible below the Planck scale, SI would simply stop making sharp predictions at that scale. It registers its own failure by spreading its probability mass uniformly.

  #### 4. My Notion of Simplicity
  *Your Suspicion:* A short program is not a physical theory. A differential equation is. Does the vindication of Occam hold if simplicity is measured in "physical units" rather than bits?

  *The Translation:* "Physical Simplicity" (symmetries, low-order differential equations, few parameters) is a subset of "Computational Simplicity" relative to a specific UTM.
  *   **The Mismatch:** The "shortest program" reproducing your scattering data might be a lookup table (if data is noisy) or a bizarre encoding that a physicist would reject as non-explanatory. Conversely, a Schrödinger equation solver is a long program (it requires the interpreter, the numerical method, etc.).
  *   **Why it works anyway:** The reason physical theories work is that the universe appears to be computable by a UTM that is *efficient* at simulating local differential equations. If you choose a UTM that has a built-in library for solving partial differential equations, then physical theories become short programs.
  *   **Verdict:** This indicts the **equivalence of prediction and explanation**. SI vindicates Occam's Razor for **prediction**, not for **understanding**.
      *   If your goal is to minimize squared error on the next data point, SI (or its approximations like MDL) is optimal.
      *   If your goal is to find a "theory" (a causal mechanism humans can grasp), SI offers no guarantee. The shortest program might be opaque.
      *   However, historically, the programs that predict best *have* been the ones physicists recognize as theories (Standard Model, GR). This suggests our "physical simplicity" is well-aligned with the "computational simplicity" of the universe's actual generator. But this is a contingent fact, not a logical necessity.

  ### Summary of the Residue

  You asked if SI contains anything you do not already believe.

  1.  **Objectivity:** You likely believe priors are subjective. SI claims to be objective but isn't (due to the UTM constant). **New insight:** SI is not a way to eliminate priors, but a way to make the complexity penalty explicit.
  2.  **Noise:** You know noise must be modeled. SI forces you to encode the noise model *into the program length*. **New insight:** Ignoring the noise floor in description length is a formal error, not just a practical heuristic.
  3.  **Compressibility:** You believe the world is simple because physics has succeeded. SI clarifies that this is a precondition for learning, not a result of it. **New insight:** SI quantifies exactly how much you lose if the world is more complex than you thought (the error bound scales with true complexity).
  4.  **Theory vs. Program:** You believe a theory explains. SI only predicts. **New insight:** The "vindication of Occam" applies to predictive accuracy. The fact that it also yields human-intelligible theories is a fortunate property of *this* universe, not of the learning framework.

  **Final Judgment:** The translation fails where SI claims to be a normative logic of *discovery* rather than a bound on *prediction*. Your vocabulary is sufficient for the physics; SI adds a rigorous ceiling on what is learnable, but it does not guarantee that what is learnable looks like physics. The "uncomputable constant" is the largest crack in the foundation: it means SI cannot tell you when you have enough data to ignore your choice of formalism. You already knew that from experience; SI just proves you can't calculate your way out of it.
