answer: |-
  There is no single, canonical term in formal logic or standard political philosophy that captures this exact pattern (in the way "Ad Hominem" or "Motte-and-Bailey" do). However, in **critical social policy analysis, political sociology, and discourse studies**, this specific argumentative architecture is well-documented. It is generally treated not as a logical fallacy committed by an individual, but as a **systemic feature of neoliberal welfare ideology**.

  The pattern you describe is best understood as a form of **Discursive Immunization** achieved through **Strategic Normative Oscillation**.

  Below is a breakdown of the existing concepts that map onto this structure, how to distinguish it from adjacent fallacies, and the specific comparative test you requested.

  ### 1. Closest Established Concepts

  While there is no single noun for the fallacy, three conceptual frameworks in social policy theory describe this exact mechanism:

  **A. The "Centaur State" Logic (Loïc Wacquant)**
  The French sociologist Loïc Wacquant provides the most robust structural explanation for this argumentative pattern. He argues that the modern state has become a "Centaur State": liberal and permissive at the top (for corporations and the wealthy) but paternalist and punitive at the bottom (for the poor).
  *   **Relevance:** The argumentative oscillation you observe is the *ideological glue* holding the Centaur State together. The defender cannot use a single consistent principle (e.g., pure fiscalism or pure reciprocity) because doing so would expose the class bias. They *must* oscillate between registers to maintain the distinction between the "liberal" treatment of capital and the "paternalist" treatment of labor.
  *   **Term:** **Class-Conditional Paternalism.**

  **B. The "Empty Signifier" of Responsibility (Soss & Schram)**
  Political scientists Joe Soss and Sanford Schram have analyzed how the concept of "responsibility" functions in welfare debates. They argue that "responsibility" acts as an **empty signifier**: it sounds morally robust but lacks fixed content.
  *   **Relevance:** This allows the defender to fill the container with *fiscal content* when challenged on cost (fraud prevention) and *moral content* when challenged on efficacy (dignity/reciprocity). The term remains constant ("responsibility"), but the definition shifts to evade critique.
  *   **Term:** **Discursive Plasticity.**

  **C. Discursive Immunization (Critical Discourse Analysis)**
  In the tradition of Foucault and Habermas, this pattern is a form of immunization. By maintaining two incommensurable justificatory registers (utilitarian/fiscal vs. deontological/moral), the argument becomes unfalsifiable. If you attack the fiscal logic, they retreat to the moral; if you attack the moral logic, they retreat to the fiscal.
  *   **Term:** **Justificatory Hybridity.**

  ### 2. Distinguishing from Adjacent Fallacies

  You are correct that this is distinct from standard fallacies. Here is how to delineate it:

  | Concept | Why it is different from your observation |
  | :--- | :--- |
  | **Motte-and-Bailey** | In a Motte-and-Bailey, the defender *retreats* to a defensible position (the Motte) when attacked, then returns to the controversial one (the Bailey) when safe. In your pattern, the defender does not retreat; they **pivot** to a completely different castle. They claim the moral argument was *always* the primary one, even when they were just citing fraud statistics. |
  | **Special Pleading** | Special pleading is a logical error where an exception is made without justification. Your pattern is more sophisticated: the justification *is* provided, but it is **context-dependent**. It is not merely an exception; it is a **redefinition of the principle** based on the class of the recipient. |
  | **Hypocrisy** | Hypocrisy implies a violation of a stated norm. Here, the norm itself is being **reconstructed in real-time**. The defender may sincerely believe both arguments, but they lack a meta-ethical framework to reconcile them. It is **ideological incoherence**, not necessarily personal dishonesty. |
  | **Strategic Ambiguity** | Ambiguity implies vagueness. Your example involves **specific** claims (fraud rates vs. reciprocal duty). The shift is not from specific to vague, but from **one specific register to another specific register**. |

  **Proposed Label:** If you need a term to use in analysis, **"Strategic Normative Oscillation"** or **"The Dual-Register Defense"** accurately captures the mechanism without implying simple logical error.

  ### 3. The Question of Sincerity

  You asked whether the oscillation requires both justifications to be sincerely believed. In political philosophy and ideology critique, **this distinction is functionally irrelevant.**

  *   **Structural Functionalism:** Whether the defender is lying or sincere, the *function* of the argument is the same: it stabilizes a policy outcome against critique.
  *   **Ideological Capture:** It is highly likely the defenders *are* sincere. Ideologies often work by compartmentalization. They can hold a utilitarian view of the state regarding "taxpayer money" and a deontological view regarding "moral character," without noticing the contradiction until a critic forces the two together.
  *   **Boundary Condition:** The pattern exists regardless of intent. However, if the defender *refuses to acknowledge the shift* when pointed out (e.g., "I never said it was about money"), it moves closer to **Gaslighting** or **Bad Faith** (Sartre). If they acknowledge the shift but defend the right to use different tools for different groups, they are openly advocating for **Class-Conditional Ethics**.

  ### 4. The Comparative Test: "Corporate Workfare"

  To reveal whether a defender is running this structure rather than holding an ordinary inconsistent preference, you should apply the **Universal Reciprocity Test**.

  **The Setup:**
  Propose a policy of "Investor Workfare." Just as welfare recipients must prove they are searching for jobs to receive benefits, recipients of state subsidies (e.g., green energy tax credits, corporate bailouts, capital gains loopholes) must prove they are generating specific social returns (e.g., job creation, wage floors) under threat of sanction.

  **The Diagnostic Responses:**

  1.  **The Consistent Reciprocalist:** "Yes, I support that. All state support should be conditional on social contribution." (This person is *not* running the oscillating structure; they are a consistent moralist.)
  2.  **The Consistent Fiscalist:** "No, because monitoring investors costs too much and hurts growth." (This person is *not* running the oscillating structure; they are a consistent utilitarian.)
  3.  **The Oscillating Defender (Your Target):**
      *   *Response:* "That's different. Investors are already motivated by profit," OR "That would stifle innovation," OR "That's a contractual matter, not a welfare matter."
      *   *The Tell:* When pressed on why reciprocity applies to the poor but not the wealthy, they will **switch back to the Fiscal/Utility register** (growth, contracts, innovation) to defend the wealthy, having just used the **Moral/Reciprocity register** to attack the poor.

  **Why this reveals the structure:**
  It forces the two registers to collide. By applying the "poor person's logic" to the "rich person's context," you remove the ability to oscillate. They must either admit the principle is class-specific (admitting the Centaur State) or attempt to argue that capital ownership *is* a form of labor (a distinct, often fragile argument).

  ### Summary for Analysis

  If you are writing about this, you might frame it as follows:

  > "This argumentative pattern is not merely a logical inconsistency but a form of **discursive immunization**. It relies on **incommensurable justificatory registers**—shifting between fiscal utilitarianism and moral deontology—to protect **class-conditional policy outcomes**. While it shares features with the Motte-and-Bailey fallacy, it is more accurately described as **Strategic Normative Oscillation**, a mechanism that sustains what Loïc Wacquant terms the **Centaur State** by preventing the universalization of either fiscal discipline or moral reciprocity."

  This framing acknowledges the sophistication of the move while providing the theoretical vocabulary to dismantle it.
