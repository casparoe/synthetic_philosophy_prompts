answer: |-
  You have built a robust intuition pump with the Skill Upload case, and it is a strong one for the anti-intellectualist (AI) cause. It isolates the *performance* from the *propositional grasp* and asks us to judge where the knowledge resides. However, before ranking the defeaters, we need to address why your anchor case might not be holding as much water as you think, at least against a sophisticated intellectualist.

  ### The Vulnerability of the Upload Case
  A committed intellectualist (à la Stanley & Williamson) will not grant your intuition in Variant A. They will argue that the upload subject possesses a **reliable disposition**, but not **knowledge**.

  For the intellectualist, knowledge requires a non-accidental connection to the truth (or success). If the motor package is installed via "magic" (or tech that bypasses understanding), the success is arguably Gettierized. The subject succeeds, but not *because* they grasp the way to $\phi$; they succeed because they are causally rigged to $\phi$. The intellectualist will say: "She plays the etude, yes. But if the etude changed slightly, or the piano had a different key weight, she would fail without understanding why. She lacks the flexibility that knowledge confers."

  Regarding Variant B (the useless manual): The intellectualist argues the manual is irrelevant not because propositions don't matter, but because *access* matters. Knowledge-that requires the proposition to be available to the cognitive system for reasoning, even if not verbally articulated. If the manual is "compressed and inaccessible," it is not known. So Variant B doesn't help you; it just describes a state of ignorance plus ability.

  **Verdict:** The Upload case is a stalemate. It relies on the intuition that "reliable success = knowledge," which is precisely what the intellectualist denies. You need defeaters that pry apart ability and knowledge in cases where the intuition is less contestable.

  ---

  ### Ranked Defeaters for Anti-Intellectualism

  Here are the arguments against your view, ranked from those that threaten the core coherence of the view to those that merely require awkward patching.

  #### 1. The Paralyzed Expert (Fatal without Ad Hoc Maneuvering)
  This is the classic Rylean nightmare. A master pianist loses her hands in an accident. She can no longer play. She retains all her musical knowledge, can read the score, can correct a student, and says truthfully, "I know how to play the Moonlight Sonata, I just can't right now."
  *   **The Problem:** If K-how = Ability, and Ability = 0, then K-how = 0. But the intuition is that K-how > 0.
  *   **The AI Patch:** You must define ability dispositionally: "She has the ability to play *if* she had hands."
  *   **Why it hurts:** This stretches the concept of ability to the breaking point (see the "Stretching" section below). If a disposition counts as an ability even when the physical substrate is permanently removed, "ability" no longer means "capacity to act." It means "counterfactual success." This makes the theory vulnerable to the next defeater.

  #### 2. The Normativity/Gettier Objection (Severe)
  Knowledge is a normative epistemic status; abilities are naturalistic capacities. A virus knows how to infect a cell? A guided missile knows how to hit a target? They have the ability. Do they have *knowledge*?
  *   **The Problem:** If AI identifies K-how with ability, it must either grant K-how to missiles (implausible) or add a filter to distinguish *epistemic* abilities from *brute* abilities.
  *   **The Trap:** If you add a filter (e.g., "the ability must be guided by understanding"), you are smuggling in a propositional or quasi-propositional condition. If you don't, you lose the "Knowledge" part of "Knowledge-How."
  *   **Gettier Cases:** Consider a subject who has the ability to sink a putt, but only because a neuroscientist is manipulating their muscles to ensure success. They have the ability (in a sense) and they succeed. But they don't *know how* to sink the putt; they are being puppeteered. AI struggles to distinguish puppeteered ability from knowledgeable ability without referencing the agent's internal grasp of *why* the action works.

  #### 3. The Guidance and Explanation Objection (Moderate to Severe)
  Why did the agent raise their hand? "Because they knew how to vote."
  *   **The Problem:** Abilities explain *success*, but they do not necessarily explain *guidance*. When I play tennis, I adjust my grip mid-swing based on the ball's spin. This adjustment is guided by how I take the ball to be.
  *   **Intellectualist Advantage:** Propositional attitudes explain guidance better. "I represented the ball as spinning left, and I represented that moving my hand right counters that."
  *   **AI Struggle:** To explain the adjustment without propositions, the AI must posit sub-personal "representations" that look suspiciously like propositions. If you say "the body just adjusts," you lose the intentionality. If you say "the agent represents the correction," you are edging toward intellectualism. The AI account risks making the agent a passive vessel for their own abilities.

  #### 4. Testimony and Learning (Moderate)
  I can tell you how to tie a bowline knot. You listen, understand my sentences, and now you know how to tie it. You haven't practiced yet, so you lack the refined ability.
  *   **The Problem:** You gained K-how via K-that. This suggests K-how is constituted by the propositional information you received, not the physical ability you haven't yet developed.
  *   **AI Response:** "You only know *that* is how to tie it. You don't know *how* until you can do it."
  *   **Why it hurts:** This contradicts ordinary language. If I ask, "Does anyone know how to fix this carburetor?" and you say, "Yes, I read the manual," you have not lied. You possess the knowledge, even if your hands are shaking too much to execute it. AI forces you to say you don't *know how* until you succeed, which seems to confuse knowledge with performance.

  #### 5. Gradability (Merely Awkward)
  "I know how to swim better than you."
  *   **The Problem:** Traditionally, propositional knowledge is binary (you know or you don't). Abilities come in degrees. This is usually an AI *strength*.
  *   **Why it's a defeater:** Intellectualists have caught up. They argue that one can grasp the same proposition (the way to swim) with varying degrees of depth, detail, or under varying modes of presentation. Because Intellectualism can account for gradability without abandoning propositions, this is no longer a "kill shot" for them, leaving AI with no unique advantage here.

  ---

  ### The "Stretching" Worry: Is the Theory Unfalsifiable?

  You asked to be straight about whether "ability" has been stretched until the view can't lose. **Yes, it has.**

  To save Anti-Intellectualism from the Paralyzed Pianist, the "Ability" must be defined as: *A disposition to succeed in $\phi$-ing in relevant situations, where relevant situations include those where the physical impediments are removed.*

  To save it from the Gettier/Puppeteer cases, "Ability" must be defined as: *A disposition to succeed that is not deviantly caused.*

  To save it from the Virus/Missile cases, "Ability" must be defined as: *A disposition to succeed that is epistemically warranted.*

  **The Consequence:** Once you add "non-deviant," "epistemically warranted," and "counterfactual physical conditions" to the definition of ability, you have defined "ability" as "successful performance that looks like knowledge."
  *   **Is this a real problem?** Yes. It renders the theory trivial. "Knowing how is having the ability to know how."
  *   **The Intellectualist Charge:** They will argue you are engaging in a "verbal shuffle." You are keeping the label "Ability" while filling it with propositional content (warrants, non-deviant causal chains, counterfactual conditions).
  *   **The Cost:** If your definition of ability is this thin, it loses its explanatory power. We wanted to explain knowledge in terms of ability (a naturalistic, clear concept). If ability is now a complex, normative, counterfactual-laden notion, we haven't reduced anything. We've just renamed the mystery.

  ### Summary Advice

  Your Upload case is compelling because it isolates the *phenomenology* of skill from the *articulation* of rules. But it fails to isolate *knowledge* from *reliable causation*.

  To move off Anti-Intellectualism, you don't need to accept that K-how = K-that. You only need to accept that **K-how entails a propositional structure.** You can remain a "Moderate Intellectualist." You can agree that the pianist doesn't think in sentences, but maintain that her motor control *implements* a propositional map of the task.

  **The fatal blow to your current view is the Paralyzed Pianist combined with the Normativity worry.** If you cannot explain why the paralyzed expert knows how while the missile (which also has a "goal" and "success conditions") does not, without invoking a normative/propositional filter, then "Ability" is doing no work. The work is being done by the filter.

  **Recommendation:** Shift from "Hard Anti-Intellectualism" (K-how is *just* ability) to "Hybrid Views" or "Moderate Intellectualism." Acknowledge that while K-how is not *identical* to K-that, it *depends* on a propositional grasp that guides the ability. This saves the intuition that skill is more than just facts, without falling into the trap of defining "ability" so loosely that it means everything and nothing.
