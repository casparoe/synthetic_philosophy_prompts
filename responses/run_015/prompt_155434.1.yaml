answer: |-
  Dear Friend,

  You are facing a classic dilemma of professional ethics that sits at the intersection of fairness, safety, and liability, and it is to your credit that you are resisting the urge to simply assert authority. The guide who was suspended is raising an objection that is not merely sour grapes but touches on a profound philosophical problem known as moral luck. To answer you fully, I need to walk through why his feeling of injustice is valid, where the industry necessities lie, and how you might reconcile the two without compromising your safety culture or your integrity as a leader.

  The core of the guide's complaint is that he is being judged on factors outside his control, specifically the random occurrence of a client falling into a crevasse. Among ethicists and scholars of justice, there is a near consensus that moral praise or blame should attach to what an agent controls, such as their intentions and their adherence to protocol, rather than on chance outcomes. This is a settled point in moral philosophy; if two drivers run a red light with identical recklessness, but one hits a pedestrian and the other does not, most philosophers argue their moral culpability is identical, even if our legal systems treat them differently. Your guide is correctly identifying that you are punishing the outcome rather than the breach. However, while this is settled in abstract ethics, it is genuinely contested in high-risk industries. Safety critics argue that punishing outcomes creates a culture of fear where incidents are hidden, while proponents argue that consequences are the only tangible metric that validates the necessity of the protocol. You are operating in this contested space where philosophical fairness clashes with practical risk management.

  Your partner's argument that the guides entered a lottery where the costs were priced in is clever, but it rests on a contractual view of discipline rather than a moral one. It is uncontroversial that employment involves accepting certain risks and terms, and legally, you are likely within your rights to discipline based on the handbook. However, whether this justifies the disparity in treatment is disputed. Her argument essentially treats discipline as a strict liability insurance mechanism rather than a corrective measure for behavior. If discipline is purely about cost recovery, her logic holds; if it is about shaping future behavior and maintaining trust, it is weaker. By framing the suspension as the result of a lottery number coming up, you risk telling your team that their professionalism matters less than their fortune. This undermines the very protocol you are trying to enforce, because it suggests that skipping the check is acceptable as long as you get away with it. The contested nature of this argument lies in whether a professional organization should function as a moral community or a risk pool. I suspect you want the former, which means her argument, while legally protective, is culturally insufficient.

  The question of symmetry you raised regarding bonuses for uneventful crossings is also crucial. It is widely accepted in management theory that we do not reward employees for meeting baseline expectations; safety is the price of admission, not an extra merit. Therefore, the lack of a bonus for the guide who skipped the check but had no incident is defensible. He did not do something good; he merely avoided something bad. However, the asymmetry becomes problematic when the penalty for the breach varies wildly based on luck. It is contested whether aggravating a penalty based on severity of outcome is fair when the negligence was identical. If you accept that consequences matter for punishment, consistency demands they matter for reward, yet you cannot reward baseline safety. The way out of this logical trap is to recognize that the suspension is not merely a penalty for the breach, but also an administrative necessity triggered by the incident. An injury triggers insurance reviews, mandatory retraining, and liability assessments that an uneventful breach does not. This distinction allows you to treat the outcomes differently without admitting that luck dictates moral blame.

  This brings us to the complication regarding the second guide, who is historically more careless but received a lighter warning. Here, there is little controversy among management experts; inconsistency in discipline is one of the fastest ways to erode authority and morale. If you punish based on outcomes now, you must acknowledge that you have historically under-punished the careless guide who got lucky. Ignoring his track record because he had no incident this season validates the very luck-based system the suspended guide is protesting. It is settled best practice that disciplinary records should reflect patterns of behavior, not just isolated events. By failing to account for the second guide's history, you have inadvertently created a situation where the punishment looks arbitrary not just because of luck, but because of incomplete data. To maintain credibility, you must address the breach itself consistently across both guides, even if the incident triggers additional steps for the one who caused harm.

  So, what should you do? I believe you should adjust the disciplinary action to separate the penalty for the protocol breach from the administrative response to the incident. The breach of skipping the weather check is the same for both guides, and the baseline discipline should reflect that. You should elevate the written warning for the second guide to a suspension of similar length, perhaps unpaid, to signal that the breach itself is intolerable regardless of outcome. For the suspended guide, you can maintain the time off, but you should reframe part of it as mandatory administrative leave for incident review and retraining rather than pure punishment. This acknowledges the reality that an injury creates more work and risk for the company without conceding that his moral culpability is exponentially higher than his colleague's. This approach respects the settled view that similar breaches deserve similar consequences, while accommodating the contested but practical reality that incidents carry heavier logistical burdens.

  When you speak to him, you should be honest about the tension you are feeling. Tell him that you have thought hard about his objection and that you agree in principle that he is being affected by moral luck. Explain that while the breach itself warrants a significant penalty, which you are now applying consistently to both guides, the injury triggered additional insurance and safety review protocols that necessitated his specific period of leave. Acknowledge that the system is imperfect and that you are adjusting the other guide's penalty to ensure that the team understands the breach is the primary offense, not the outcome. This validates his sense of fairness while maintaining the necessary boundaries for safety. You should also tell him that you are reviewing the second guide's history separately, so he knows that leniency was not granted based on luck alone.

  Ultimately, the disagreement turns on whether you view your company as a pure meritocracy of process or a consequentialist enterprise liable for real-world harm. It is uncontroversial that you must protect your clients and your business from liability, which inevitably ties discipline to outcomes. It is genuinely contested, however, whether you should allow that liability to override internal fairness to the point where guides feel they are playing a lottery. By harmonizing the punishment for the breach and isolating the incident-specific consequences, you can honor the philosophical validity of his complaint without abandoning the practical necessities of running a mountaineering firm. This path requires you to admit that your initial decision was partially driven by outcome bias, but that you are correcting it to build a stronger, more consistent safety culture. That honesty will likely earn you more respect than a rigid defense of the handbook, and it will show your team that you value their judgment as much as their luck.
