answer: |-
  **Grade: 11/20**

  **Comments**

  1.  **PP-2 and the Default Rule**
      *   **Quote:** "The default under PP-2 is therefore to withhold registration, which here means imposing the five-year moratorium."
      *   **Assessment:** **Incorrect.** This directly contradicts the supplied apparatus.
      *   **Explanation:** The course materials explicitly state: "PP-2 does not by itself make prohibition the default." PP-2 is procedural (burden of proof), not substantive. It determines who must argue, not what the outcome is if arguments are inconclusive.
      *   **Full-Credit Correction:** A full-credit answer would state that PP-2 places the burden on the registrant to show safety, but if safety is not shown, the substantive outcome (prohibition or registration) must be determined by applying PP-1 or PP-3, not by a default rule inherent to PP-2.

  2.  **Symmetry Requirement**
      *   **Quote:** "The cost side includes the yield gains and the nitrogen savings that farmers give up for five years... Weighed against the possible permanent loss of a native species, the species loss dominates..."
      *   **Assessment:** **Incomplete/Incorrect.** This fails to apply the symmetry requirement to the specific harms identified in the prompt.
      *   **Explanation:** The prompt specifies that continued nitrogen runoff during the moratorium is a "harm to the watershed." The symmetry requirement demands that harms of the measure (runoff) be weighed against harms averted (species loss) in the same currency. You weighed economic/efficiency costs (savings) against ecological harm, rather than weighing the ecological harm of the measure (runoff) against the ecological harm averted (species loss).
      *   **Full-Credit Correction:** A full-credit answer would explicitly weigh the continued nitrogen runoff (harm of the moratorium) against the potential species loss (harm of the inoculant) as comparable ecological harms, noting that one is reversible (runoff) and one is potentially irreversible (species loss).

  3.  **Self-Application Problem**
      *   **Quote:** "A principle that cannot be applied without an infinite regress cannot guide action, so PP-3 is unusable."
      *   **Assessment:** **Contestable/Unsupported.** While the regress objection is a known philosophical critique, declaring the principle unusable ignores the apparatus provided to resolve such conflicts.
      *   **Explanation:** The apparatus provides criteria for triggering PP-3 ("serious or irreversible harm"). When PP-3 applies to both the activity and the restriction, the conflict is resolved by comparing the severity and irreversibility of the competing harms, not by abandoning the principle.
      *   **Full-Credit Correction:** A full-credit answer would use the "serious or irreversible" criterion to break the tie. Since species loss is potentially irreversible and runoff is reversible, PP-3 should restrict the activity causing the irreversible harm (the inoculant), thereby resolving the self-application problem without infinite regress.

  4.  **Risk and Uncertainty Classification**
      *   **Quote:** "The agency cannot assign probabilities to displacement... so the inoculant's ecological effects present uncertainty. The runoff is different: the agency has modelled it... so that side is a risk case."
      *   **Assessment:** **Correct.**
      *   **Explanation:** You correctly applied the definitions: unassignable probability equals uncertainty; modelled estimates imply assignable probability (risk). You also correctly noted that these attach to outcome-probability pairs, allowing a mixed case.
      *   **Full-Credit Correction:** No correction needed; this matches the apparatus.

  5.  **PP-3 Trigger**
      *   **Quote:** "The threatened harm is serious and irreversible if it occurs... The pathway condition is met too, because the two consortium strains colonize the same root niche..."
      *   **Assessment:** **Correct.**
      *   **Explanation:** You correctly identified both conditions for the PP-3 trigger: serious/irreversible harm (permanent species loss) and a plausible causal pathway (niche colonization).
      *   **Full-Credit Correction:** No correction needed; this matches the apparatus.

  6.  **Final Recommendation**
      *   **Quote:** "The agency should impose the five-year moratorium."
      *   **Assessment:** **Defensible Bottom Line, Unsupported by Reasoning.**
      *   **Explanation:** While the moratorium is the likely correct outcome, your justification relies on the erroneous claim that PP-2 sets a default prohibition and that PP-3 is unusable.
      *   **Full-Credit Correction:** A full-credit answer would recommend the moratorium because PP-3 triggers against the inoculant (irreversible harm) and outweighs the PP-3 trigger against the moratorium (reversible harm), not because PP-2 mandates it or PP-3 fails.

  **Severity Ranking of Problems**

  1.  **PP-2 Default Rule (Critical):** Direct contradiction of supplied text. This undermines the structural understanding of how the principles interact.
  2.  **Symmetry Requirement (Major):** Failure to weigh the specific ecological harm (runoff) identified in the prompt, violating the "same currency" instruction.
  3.  **Self-Application Resolution (Major):** Surrendering the principle as unusable rather than using the provided severity/irreversibility criteria to resolve the conflict.
  4.  **Reasoning for Conclusion (Moderate):** The correct outcome is reached via flawed logic (false default + unusable principle), making the argument unstable.

  **What a Full-Credit Answer Would Have Contained**

  A full-credit answer would have correctly identified PP-2 as purely procedural, noting that it shifts the burden of proof to the registrant but does not mandate prohibition as a default. It would have applied the Symmetry Requirement by weighing the harm of the moratorium (continued nitrogen runoff) against the harm of the inoculant (species loss) in the same ecological currency, rather than comparing economic savings to ecological loss. Finally, it would have resolved the Self-Application Problem by comparing the irreversibility of the competing harms: because the species loss is potentially irreversible while the runoff harm is reversible, PP-3 would restrict the inoculant rather than the moratorium, providing a substantive justification for the registration ban without declaring the principle unusable.
