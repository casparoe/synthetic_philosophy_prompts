prompt: |-
  For an independent study in political philosophy and economics, I am examining whether any theoretical framework can genuinely resolve the socialist calculation debate without collapsing into either central-planning failure or full market restoration. Before I compare specific positions, I need the specification: what must an adequate theory of economic calculation and coordination actually deliver?

  Write the complete desiderata list. Each entry should pair a concrete requirement with the case or conceptual consideration that makes it non-negotiable, and you should distinguish genuine constraints from camp-specific preferences. The theory must account for at least the following dimensions:

  1. The dispersion of tacit, local knowledge about production conditions and opportunity costs—why central aggregation of this knowledge is problematic, and what mechanism a theory must propose instead.
  2. Dynamic adjustment and entrepreneurial discovery in capital goods sectors—why static equilibrium pricing is insufficient, and what the theory must say about innovation and structural change.
  3. Computation or approximation of scarcity signals for goods without private capital ownership—whether administratively determined shadow prices can perform the informational role of market prices.
  4. Preference revelation and consumer sovereignty when prices are not emergent from exchange—how subjective valuations are registered and weighted without a monetary common denominator.
  5. The distinction between allocative coordination in consumer goods and strategic coordination in intermediate and capital goods—why conflating these two levels undermines planning accuracy.
  6. The aggregation problem across heterogeneous individuals—whether intersubjective comparison of welfare or value is required for calculation, and if so, how it can be justified.
  7. Empirical consistency with documented outcomes of both actual planning boards and modern distributed-computing allocation experiments—what historical or simulated results any theory must accommodate.

  For each desideratum, explain the motivating difficulty. Then identify which pairs of requirements appear jointly unsatisfiable—particularly any tension between complete information centralization and preservation of local epistemic autonomy. Finally, briefly indicate how the critiques advanced by Mises and Hayek, Lange’s competitive-trial-and-error proposal, and a hypothetical federated model—where regional nodes transmit local constraint data to an optimizer that iteratively updates shadow prices without private ownership—stand with respect to the list. Do not provide bibliographies, citations, or reading lists; I need the argument to be self-contained.
