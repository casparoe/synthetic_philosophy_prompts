answer: |-
  To adjudicate between these families, we must first steelman their core commitments. Prohibitionism asserts that **S** and **C** are semantically identical; they share extension and truth conditions. The distinction is purely normative: **S** is prohibited by social convention. The offence consists in violating this ban. Expressivism asserts that **S** is truth-conditionally idle regarding derogation but conventionally encodes a derogatory attitude (contempt, dismissal). The offence derives from the expression of this attitude. The difference is in use, not content.

  **1. The Embedding Test**
  Consider **S** under negation ('X is not an **S**'), in conditionals ('If X is an **S**...'), or in questions. Observationally, **S** projects its offensiveness even when embedded, yet truth conditions align with **C**. In indirect reports ('He said that X is an **S**'), uttering **S** is often as taboo as using it directly.

  Prohibitionism predicts this neatly. If the ban is on the utterance of the word-form itself, embedding does not lift the prohibition. Reporting someone else's speech still requires tokening **S**, thus breaking the convention. This matches the observed reluctance to repeat slurs even in report. Expressivism faces a hurdle. If **S** encodes an attitude, does a reporter express that attitude? Intuitively, no; they are reporting another's attitude. Yet, the utterance remains offensive. Expressivism must stipulate that tokening **S** conventionally invokes the attitude regardless of embedding context, or that the audience perceives the reporter as endorsing the term. This requires extra machinery to distinguish between mentioning and using that Prohibitionism handles by default. Here, Prohibitionism aligns better with the raw data of taboo transmission, though Expressivism can recover with stipulations about conventional signalling.

  **2. The Sealed Ban**
  In this scenario, an administrative ban creates a taboo where no prior contempt existed. A generation later, the word provokes recoil. Prohibitionism predicts this perfectly. The ban *constitutes* the offence; therefore, creating the ban creates the offence. This is a strong confirmation of its core mechanism. Expressivism struggles. If no contempt existed initially, what attitude was encoded? To explain the recoil, Expressivism must claim the ban created a new convention of expressing contempt. But if the offence derives from the attitude, and the attitude is merely a product of the ban, Expressivism collapses into Prohibitionism. It becomes a view where the 'expressed attitude' is just 'the fact that this word is banned'. If Expressivism accepts this, it concedes the explanatory priority to social convention. If it denies it, it cannot explain the recoil. This probe heavily favours Prohibitionism, unless Expressivism is willing to be reduced to its rival.

  **3. The Orphaned Word**
  Here, **S** becomes neutral through lost history, then offensive again upon etymological reveal. Does this make past uses offensive retroactively? Both families should say no; offence depends on contemporary context. Does it matter which language **S** is uttered in? If borrowed into a third language targeting a different group, Prohibitionism handles this well: bans are local social facts. If the new community does not ban **S**, it is not offensive. Expressivism must explain why the attitude does not travel with the word. It must stipulate that attitudes are anchored to specific historical contexts and groups. While manageable, this risks arbitrariness. Why does the attitude not attach to the phonetic form? Prohibitionism offers a more principled explanation: the normative fact is local to the community sustaining the ban. However, if the etymology reveals harm, both views agree the word may become charged. Prohibitionism explains the mechanism of re-charging (new ban) more flexibly than Expressivism, which must locate a new attitude to encode. Prohibitionism retains a slight edge in flexibility regarding social change.

  **4. The Ventriloquist**
  Consider the actor, judge, or linguist versus the defendant. The former are licensed; the latter are not. Expressivism explains this via core machinery: the actor does not express *their* contempt; they simulate another's. The offence lies in the endorsement of the attitude, which is absent in licensed roles. The defendant, however, owns the attitude. This distinction is principled and internal to the view. Prohibitionism, conversely, must treat the actor's utterance as a violation of the ban unless an exception is stipulated. It requires a list of exempted roles (stage, court, classroom). This looks ad hoc. Why is the stage exempt but the street not? The Prohibitionist must answer: 'Because we say so.' The Expressivist answers: 'Because no attitude is expressed.' The Prohibitionist explanation is an exception bolted on afterwards to save the theory from counter-examples. This is damaging, as it suggests the core claim (the ban is absolute) is false, requiring a complex taxonomy of permissible violations to survive.

  **Verdict**
  Both families capture essential features of slurring, but they are not equal rivals. Prohibitionism offers a superior description of the *normative force* and social transmission of slurs, particularly evident in the Sealed Ban and Embedding probes. It explains why the word itself feels contaminated. However, Expressivism offers a superior explanation of the *rationale* behind the norms, particularly evident in the Ventriloquist probe. It explains why some utterances are permissible despite tokening **S**.

  Overall, Expressivism is in better shape. While Prohibitionism handles the Sealed Ban well, it ultimately faces a circularity objection: it cannot explain why **S** is banned rather than **C** without covertly appealing to the very offensiveness it claims is constituted by the ban. Why ban this word and not that one? Prohibitionism must say 'because it is prohibited', which is uninformative. Expressivism answers: 'because it encodes contempt.' Even in the Sealed Ban case, the ban is likely instituted *because* the word is perceived to carry a potential for contempt, preserving the Expressivist insight that attitude drives normativity.

  The two views are not wholly independent; Expressivism needs a social component to explain how attitudes become conventionalised (a Prohibitionist element). However, the dependence runs primarily from Prohibitionism to Expressivism. Prohibitionism requires Expressivism to explain the origin of the ban, whereas Expressivism can treat the ban as a downstream consequence of the encoded attitude. The single strongest objection to Prohibitionism is this explanatory circularity: it treats the social prohibition as brute fact, failing to account for why specific words attract prohibitions while semantically identical counterparts do not, except by referencing the offensive nature it purports to define. Expressivism, despite needing stipulations to handle indirect reports, grounds the offence in the speaker's commitment, offering a deeper account of what slurring *is*.
