  # Joint Statement of Adversarial Collaboration on Assertion Norms

  **Participants:** The Knowledge Norm Camp (KN) and the Justified Belief Norm Camp (JN)
  **Subject:** The Constitutive Rules of Assertion

  ## 1. Agreed Claims
  Both camps commit to the following propositions as common ground for the purpose of this collaboration:

  1.  **Testimony and Reliance:** Testimony functions as a primary source of epistemic reliance for hearers, and speakers incur a specific responsibility when offering testimony that distinguishes it from mere guessing or fiction.
  2.  **Expert Deference:** In contexts of expert deference, speakers ought not assert propositions lacking robust evidential support, and hearers are entitled to expect that such support exists regardless of which specific epistemic standard is ultimately fundamental.
  3.  **The Lottery Intuition:** Assertions based purely on statistical probability (e.g., asserting a specific lottery ticket lost before the draw is announced) are intuitively improper without further evidence, though the camps differ on whether this impropriety stems from a lack of knowledge or a lack of sufficient justification.

  ## 2. Disagreements Table
  The following table outlines the residual disagreements. Positions are stated in neutral wording that each camp accepts as an accurate description of its own view.

  | Issue | Knowledge Norm Camp (KN) | Justified Belief Norm Camp (JN) |
  | :--- | :--- | :--- |
  | **The Constitutive Rule** | The constitutive rule of assertion is: Assert $p$ only if you know $p$. | The constitutive rule of assertion is: Assert $p$ only if you rationally believe $p$ on sufficient justification. |
  | **Gettier Cases** | In Gettier cases, assertion is improper because the speaker lacks knowledge despite having justified true belief. | In Gettier cases, assertion is proper because the speaker possesses rational, justified belief even if knowledge is absent. |
  | **Perceptual Reports** | Basic perceptual reports do not form an inviolate level outside normative evaluation; they are subject to the knowledge norm and are improper if knowledge is absent. | Basic perceptual reports do not form an inviolate level outside normative evaluation; they are subject to the rational belief norm and are proper if justified even if knowledge is absent. |
  | **Moorean Paradox** | The impropriety of asserting "$p$ but I don't know $p$" is explained by the violation of the knowledge norm. | The impropriety of asserting "$p$ but I don't know $p$" is explained by the pragmatic implication that the speaker satisfies the relevant justification norm. |

  ## 3. Identified Cruxes
  Through our collaboration, we have identified two theoretical cruxes where the disagreement is most acute and where empirical or conceptual resolution remains elusive.

  **Crux 1: The Alleged Base-Level Exemption**
  While both camps formally deny that perceptual reports sit outside normative evaluation, the disagreement turns on whether the standard applied effectively creates an exemption. The KN camp insists that perceptual states must successfully track truth (knowledge) to license assertion. The JN camp insists that the internal rationality of the perceptual state is sufficient, effectively treating the base level as exempt from external truth-tracking requirements in cases of error beyond the agent's control.

  **Crux 2: Delegated Assertion in Collective Scientific Practice**
  The camps diverge on how norms apply to individuals asserting on behalf of a collective. In large-scale scientific collaborations, individual members often assert findings they have not personally verified. The KN camp worries this severs the link between individual knowledge and assertion. The JN camp argues that institutional justification transfers to the individual, licensing the assertion without individual knowledge.

  ## 4. Concrete Cases and Predictions
  For each crux, we have selected a concrete case relevant to the disagreement. Below are the explicit predictions each camp makes regarding the appropriateness of the assertion in question.

  ### Crux 1: The Alleged Base-Level Exemption
  **Case:** *The Barn Facade.* A driver looks at a real barn in a county filled with indistinguishable barn facades. The driver forms a true belief via perception and asserts, "That is a barn." Due to the prevalence of facades, the driver does not know it is a barn (per standard epistemological intuition), but is fully justified.

  *   **KN Prediction:** The assertion is **improper**. The speaker lacks knowledge because the belief is not sensitive to the truth in the local environment, violating the knowledge norm.
  *   **JN Prediction:** The assertion is **proper**. The speaker possesses a rationally justified belief based on clear perceptual evidence, satisfying the rational belief norm despite the absence of knowledge.

  ### Crux 2: Delegated Assertion in Collective Scientific Practice
  **Case:** *The Large Collaboration Paper.* A junior researcher is a named author on a paper with 1,000 co-authors. At a conference, the researcher asserts a specific finding from the paper during a Q&A session. The researcher has not checked the raw data for that specific finding but trusts the internal review process of the collaboration. The finding is true and justified by the collective data, but the individual researcher lacks personal knowledge of the specific data points.

  *   **KN Prediction:** The assertion is **improper** (or strictly speaking, not knowledge-governed). The individual speaker does not know the proposition personally, and assertion requires the speaker to possess the knowledge they convey.
  *   **JN Prediction:** The assertion is **proper**. The individual speaker is rationally justified in believing the proposition based on trusted institutional processes, satisfying the norm for assertion even without personal knowledge of the raw data.
