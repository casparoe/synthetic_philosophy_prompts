answer: |-
  ### Program Preamble: Separating Knowledge from Incentives

  To determine if machine learning (ML) revives the feasibility of socialist calculation, this program must isolate the **epistemic constraint** from the **incentive constraint**. The classical liberal objection contains two distinct claims:
  1.  **The Knowledge Problem (Hayek):** The central planner *cannot know* what to produce because relevant knowledge is dispersed, local, and tacit.
  2.  **The Incentive Problem (Public Choice/Property Rights):** Even if the planner *could* know, agents will not *tell* the truth or work efficiently without private property residuals.

  This research agenda treats the Incentive Problem as a boundary condition, not the primary variable. We assume a "Benevolent Data Oracle" scenario: agents report data truthfully, and the planning authority seeks only to maximize social welfare. If the calculation fails under these idealized epistemic conditions, the incentive problem is moot; machine-mediated market socialism is impossible regardless of motivation. If calculation succeeds under these conditions, the Incentive Problem becomes the subsequent, separate hurdle. This separation ensures the program tests the *computational-epistemic* hypothesis, not the *political* one.

  ---

  ### Research Agenda: Four Priority Questions

  #### 1. The Counterfactual Identification Problem
  **Can latent demand elasticities be recovered from observational transaction logs without exogenous price variation?**

  *   **Priority Rationale (Upstream):** This is the foundational bottleneck. Markets reveal demand through price variation (revealed preference). A Lange-ML board proposes setting prices based on historical data. However, historical data reflects *past* prices, not the *counterfactual* demand curves needed to clear markets at *new* prices. If ML cannot infer how demand would shift under a price vector that has never been tried (the identification problem), the system cannot simulate a market; it can only replicate the past. If this is impossible, the program ends.
  *   **Tractability for Theorists:** High. This is a problem of econometric identification and causal inference, not model training. Philosophers of statistics and economic theorists can analyze the limits of structural estimation from observational data without needing large-scale ML infrastructure. The question is whether the "structural parameters" of the economy are identifiable from the "reduced form" data available to a planner.
  *   **Priority Shifters:**
      *   *Move Up:* Advances in **Causal ML** (e.g., double machine learning, instrumental variable automation) that claim to recover causal structures from purely observational data.
      *   *Move Down:* If inside-firm planning continues to rely on A/B testing (active experimentation) rather than passive prediction, confirming that price variation is still required to generate knowledge.

  #### 2. The Tacit-to-Explicit Translation Limit
  **To what degree is "knowledge of the particular circumstances of time and place" compressible into the feature space of a predictive model?**

  *   **Priority Rationale (Upstream):** Hayek's specific objection was not about data volume, but about *tacit* knowledge (e.g., a machine operator knowing a tool is about to fail by sound, or a local manager knowing a supplier is unreliable). If this knowledge remains non-propositional and is not captured in transactional logs, the ML system suffers from omitted variable bias. This question defines the boundary of the system's input: is the "digital twin" of the economy complete enough to plan?
  *   **Tractability for Theorists:** High. This is a question for epistemology and information economics. The team can analyze the ontology of economic data: what gets recorded in ERP systems vs. what remains in human heads? They can audit existing firm-level planning failures to see if they stemmed from data gaps or calculation errors.
  *   **Priority Shifters:**
      *   *Move Up:* Proliferation of **IoT and ambient sensing** (wearables, machine sensors) that convert physical tacit cues into digital data streams automatically.
      *   *Move Down:* Evidence from **algorithmic management** (e.g., Uber, Amazon warehouses) showing that workers systematically game or bypass sensors, creating a "dark layer" of unrecorded operational reality.

  #### 3. The General Equilibrium Simulation Stability
  **Does error variance in counterfactual simulations compound super-linearly as the scope of planning expands from firm to economy?**

  *   **Priority Rationale (Upstream):** Lange's board used tâtonnement (trial and error) to find equilibrium. An ML board proposes simulating the equilibrium. However, economic systems are non-linear and chaotic. A small error in predicting the demand for steel propagates to construction, housing, and labor. If simulation error scales exponentially with the number of interconnected nodes, economy-wide planning will diverge from reality faster than the planning cycle can correct it, even if Q1 and Q2 are solved.
  *   **Tractability for Theorists:** Medium. This requires complexity theory and macroeconomic modeling. Theorists can build simplified agent-based models (ABMs) to test how prediction errors propagate in networked economies. They do not need to simulate the whole economy, only the *stability properties* of such a simulation.
  *   **Priority Shifters:**
      *   *Move Up:* Success of **Digital Twins** in complex supply chains (e.g., semiconductor manufacturing) that successfully predict bottlenecks weeks in advance.
      *   *Move Down:* Recurrent failures in **macroeconomic forecasting** or climate modeling to predict tipping points, suggesting inherent limits to simulating complex adaptive systems.

  #### 4. The Endogenous Innovation Constraint
  **Can a predictive system assign shadow prices to goods and technologies that do not yet exist?**

  *   **Priority Rationale (Downstream):** Even if the system allocates existing resources efficiently (static efficiency), the classical debate also concerns dynamic efficiency. Markets fund innovation through speculative profit signals for *new* combinations. An ML system trained on historical transactional data is inherently interpolative. If it cannot value novelty, it may optimize a stagnating economy. This is prioritized last because a stagnant socialism is still a *form* of calculation, whereas failure on Q1-Q3 means no calculation at all.
  *   **Tractability for Theorists:** Medium. This involves philosophy of technology and growth theory. The team can analyze how venture capital and R&D budgets are currently allocated vs. how a predictive model would allocate them based on past ROI.
  *   **Priority Shifters:**
      *   *Move Up:* **Generative AI** successfully designing novel materials or drugs that are then manufactured, proving ML can originate valuable "newness" without market signals.
      *   *Move Down:* Evidence that **inside-firm R&D** is becoming less productive despite increased data availability (the "ideas getting harder to find" hypothesis).

  ---

  ### Overrated and Beside-the-Point Questions

  To maintain focus, the program should explicitly deprioritize the following:

  1.  **"Is Computational Power Sufficient?"**
      *   *Verdict:* **Overrated.**
      *   *Reasoning:* The classical debate was never about solving linear equations (which computers do easily); it was about *generating the inputs* for those equations (preferences, local constraints). Focusing on FLOPs or hardware scaling misunderstands the Hayekian objection.
  2.  **"Will Agents Lie to the System?" (The Incentive Problem)**
      *   *Verdict:* **Beside the Point (for this phase).**
      *   *Reasoning:* As established in the preamble, if the system cannot calculate optimal prices even with *true* data (Q1-Q3), it does not matter if agents are honest. Incentive compatibility is a second-order design constraint, not a feasibility test for the calculation mechanism itself.
  3.  **"Is Market Socialism Morally Desirable?"**
      *   *Verdict:* **Beside the Point.**
      *   *Reasoning:* The funder's question is about *feasibility* ("reopens the debate"), not *normativity*. Moral arguments do not resolve whether the ML system can function.
  4.  **"Can ML Replace the Price Mechanism Entirely?"**
      *   *Verdict:* **Imprecise.**
      *   *Reasoning:* The hypothesis is not replacing prices, but *administering* them via ML. The question should be whether administered prices backed by simulation can mimic the *informational content* of market prices, not whether the label "price" is removed.

  ### Summary of Strategic Value

  This agenda moves the debate from ideological assertion to epistemic auditing. By prioritizing **Identification** and **Tacit Knowledge**, the program targets the specific vulnerabilities of the "Lange + ML" hypothesis. If the team determines that observational data cannot recover counterfactual demand (Q1) or that tacit knowledge resists digitization (Q2), the hypothesis is falsified regardless of future compute gains. If they find these barriers are surmountable, the debate shifts to stability (Q3) and innovation (Q4), providing the funder with a clear roadmap for where the "live hypothesis" stands at the end of year three.
