  4.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No jargon without explanation? Yes.
      *   Flag confidence? I will use phrases like "It is generally agreed," "My reading is," "Here the philosophy is settled."
      *   Plain speaking if muddled? Yes, I will be direct about the "Shortest Groove" philosophical weakness.

  5.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Wait, Kripke claims to be interpreting the *later* Wittgenstein, but the sceptical problem is often applied to the *Tractatus* by critics who say the *Tractatus* assumes what Kripke questions. I need to be precise: The *Tractatus* assumes determinate sense. Kripke questions whether sense can ever be determinate. So asking the *Tractatus* to answer Kripke is asking a dogmatist to answer a sceptic.
      *   *Correction on Q2:* Wittgenstein says "from this again... construct the score". He explicitly claims reversibility. The narrator's asymmetry is about *damage* and *interpretation*, which Wittgenstein is bracketing out. I need to make sure the user sees that distinction.

