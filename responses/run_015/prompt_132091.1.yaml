  # The Three-Article Trap: A Sorting Taxonomy
  **Study Group Handout**

  ### The Scenario
  Imagine a constitution with only three articles:
  *   **Article 1:** Creates a Council.
  *   **Article 2:** Lists basic rights.
  *   **Article 3:** Can be amended by simple majority. **CRITICAL CLAUSE:** *Any amendment to Article 3 automatically rewrites Article 1 to give the Council veto power over all future amendments.*

  **The Test Case:** Article 3 is amended **twice**.
  1.  **Amendment 1:** Passes by majority. Article 3 changes. Article 1 changes (Council now has veto).
  2.  **Amendment 2:** Proposed by majority. Council does *not* approve.

  **The Question:** Does Amendment 2 pass? Does the system stabilize, collapse, or loop? Follow the tree below to find your position.

  ---

  ### STEP 1: The Root Question
  **Can a legal system contain a rule that coherently authorizes its own change without any external authority?**

  *   **NO** → Go to **Leaf A (The Externalist Skeptic)**.
  *   **YES** → Go to **STEP 2**.

  ### STEP 2: The Nature of the Problem
  **Is the barrier to self-amendment primarily LOGICAL (conditions of validity) or PRACTICAL (who holds the power)?**

  *   **PRACTICAL** → Go to **STEP 3A**.
  *   **LOGICAL** → Go to **STEP 3B**.

  ### STEP 3A: The Practical Branch
  **Does separating the *power to amend* (meta-rule) from the *rule being amended* solve the conflict, or does it just move the fight to a new arena?**

  *   **IT SOLVES IT** → Go to **Leaf B (The Delegationist)**.
  *   **IT JUST MOVES THE FIGHT** → Go to **Leaf C (The Power Realist)**.

  ### STEP 3B: The Logical Branch
  **Does mediating the reference through a separate meta-rule solve the paradox, or does it just push the self-reference up one level?**

  *   **IT PUSHES IT UP (Infinite Regress)** → Go to **Leaf D (The Regress Trap)**.
  *   **IT SOLVES IT (Stable Hierarchy)** → Go to **STEP 4**.

  ### STEP 4: The Hierarchy Check
  **If the hierarchy is stable, does the new rule freeze the old structure, or does the amendment power remain supreme?**

  *   **FREEZES (Old constraints bind new rules)** → Go to **Leaf E (The Hierarchicalist)**.
  *   **REMAINS SUPREME (New rules override old constraints)** → Go to **Leaf F (The Sovereigntist)**.

  ---

  ### THE LEAVES: Where do you stand?

  #### Leaf A: The Externalist Skeptic
  *   **Diagnosis:** Law is just orders backed by threats. A text cannot bind its own creator.
  *   **Outcome on Amendment 2:** **Undefined by law.** It succeeds if the majority is strong enough to ignore the Council; fails if the Council is stronger. The text is irrelevant wallpaper.
  *   **Commitment:** "There is no legal validity, only political success."

  #### Leaf B: The Delegationist
  *   **Diagnosis:** Authority is a property that can be transferred. Amendment 1 successfully transferred veto power to the Council.
  *   **Outcome on Amendment 2:** **INVALID.** The majority no longer holds the key. Without the Council's veto, the amendment is unauthorized.
  *   **Commitment:** "You can give away the power to change the rules, and once you do, it's gone."

  #### Leaf C: The Power Realist
  *   **Diagnosis:** Rules don't bind power; only power binds power. Separating meta-rules is just drawing lines in the sand.
  *   **Outcome on Amendment 2:** **DEPENDS ON FORCE.** If the majority ignores the veto and enforces the change, the change is valid because they won.
  *   **Commitment:** "Validity is just the surname of Success."

  #### Leaf D: The Regress Trap *(Unnamed Logical Space)*
  *   **Diagnosis:** **EMPTY/WEIRD.** If every rule needs a higher rule to validate its change, no rule is ever valid. This position implies the legal system never actually started.
  *   **Outcome on Amendment 2:** **SYSTEM ERROR.** Neither amendment was ever valid. The Council doesn't exist, and the majority doesn't exist.
  *   **Commitment:** "You claim to believe in law, but your logic denies the possibility of any rule existing."

  #### Leaf E: The Hierarchicalist
  *   **Diagnosis:** A legal system requires a static "Grundnorm" or peak rule. Amendment 1 created a new peak (Council Veto) that sits above the amendment procedure.
  *   **Outcome on Amendment 2:** **VOID.** The new Article 1 (Veto) outranks the new Article 3 (Majority). You cannot use a lower rule to bypass a higher one.
  *   **Commitment:** "Order requires a fixed peak. The Council is now the peak."
  *   **⚠️ FLAG:** *Practically indistinguishable from Leaf B (Delegationist).* Both result in Amendment 2 failing. The only difference is whether you call it "Unauthorized" (B) or "Invalid" (E).

  #### Leaf F: The Sovereigntist
  *   **Diagnosis:** The power to amend is the highest power. It can change the hierarchy itself.
  *   **Outcome on Amendment 2:** **VALID.** The majority used the current Article 3 to pass Amendment 2. The fact that Article 1 says "Veto" is irrelevant because the Amendment Power overrides Article 1.
  *   **Commitment:** "The present majority is always sovereign over the past constitution."
  *   **⚠️ FLAG:** *Practically indistinguishable from Leaf C (Power Realist) in a crisis.* Both result in Amendment 2 succeeding based on current will. The difference is whether you think the majority has a *right* to do this (F) or just the *might* (C).

  ---

  ### Discussion Notes for the Group
  1.  **The "Empty" Leaf (D):** If anyone lands here, ask them how any law ever gets passed. If they can't answer, they're not legal theorists; they're anarchists.
  2.  **The Indistinguishable Pairs:** Notice that **Leaf B** and **Leaf E** both stop the second amendment. Does it matter *why*? If the Council wins either way, is the difference between "Power" and "Validity" just academic?
  3.  **The Loop:** None of these leaves produce an infinite loop (Amendment 3 reverses Amendment 2, etc.). To get a loop, you need a system where validity oscillates. That's a bug, not a feature. If you think the system loops, you belong in **Leaf D**.
