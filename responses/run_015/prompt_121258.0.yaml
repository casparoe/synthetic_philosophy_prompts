answer: |-
  1.  **Gradient Sensitivity**
      *   **Requirement:** The strength of evidential update must regress toward the population base rate as structural similarity between the agent and others decreases.
      *   **Case:** Consider an agent facing an exact physical twin versus a agent facing a near-twin that differs in minor code optimizations. If the theory treats the near-twin as perfectly correlated simply because the decision procedure is nominally identical, it ignores the fragility of implementation. A theory that assigns probability one to the near-twin's cooperation based on superficial similarity will fail when minor environmental noise decouples them.
      *   **Verdict:** Non-negotiable. Without this, the agent overestimates leverage in fragile contexts, leading to systematic exploitation in large worlds where perfect identity is rare.

  2.  **Aggregation Stability**
      *   **Requirement:** The sum of evidential weight from many weakly correlated agents must not exceed the bounds supported by individual reliability.
      *   **Case:** Imagine a world with billions of agents who resemble the decision-maker only slightly. Individually, each correlation is negligible. However, if the theory allows these tiny probabilities to sum linearly across the population, the aggregate evidential weight becomes infinite solely due to population size. This manufactures confidence out of thin air, allowing the agent to cooperate based on the sheer number of strangers rather than the quality of the correlation.
      *   **Verdict:** Non-negotiable. This prevents the theory from validating cooperation based on population density rather than actual structural linkage.

  3.  **Value Alignment Distinction**
      *   **Requirement:** Correlation must be weighted by the alignment of preferences, not merely the similarity of decision procedures.
      *   **Case:** Consider an adversary who simulates the agent perfectly to predict its moves but holds opposed values. The adversary's act is highly correlated with the agent's act (e.g., if the agent cooperates, the adversary defects to exploit). A theory that treats high correlation as a mandate for cooperation will instruct the agent to cooperate with its exploiter, maximizing the adversary's reward at the agent's expense.
      *   **Verdict:** Non-negotiable. Cooperation is only instrumentally rational if the correlated acts benefit the agent; correlation without alignment is a trap.

  4.  **Evidential-Causal Separation**
      *   **Requirement:** The theory must distinguish between an act providing evidence about other acts and an act causally influencing them.
      *   **Case:** In a diffuse case where agents correlate due to shared cultural training rather than a common designer, my choice does not change their choice. If the theory allows me to count my act as *causing* their cooperation, I may incur costs to "influence" them when I am merely signaling. This conflates news with power, leading the agent to pay for information it cannot control.
      *   **Verdict:** Non-negotiable. This defines the domain of evidential cooperation; conflating the two renders the theory indistinguishable from magical thinking.

  5.  **Reflective Stability**
      *   **Requirement:** The agent must be able to adopt the theory without generating logical loops that prevent a decision.
      *   **Case:** An agent knows it is running this theory. If the theory's recommendation depends on the agent's prediction of the theory's recommendation, a fixed-point problem arises. If no stable policy exists, the agent halts.
      *   **Verdict:** Preference (Taste for Computability). While desirable for implementation, demanding strict stability may require limiting the agent's self-knowledge. A theory might be adequate even if it requires approximations to avoid halting.

  6.  **Metric Grounding**
      *   **Requirement:** The theory must specify how similarity is measured or remain invariant across reasonable metrics.
      *   **Case:** Similarity is notoriously subjective. If the theory allows the agent to choose a metric that maximizes perceived correlation, it can gerrymander the population to justify any choice. Conversely, demanding a single universal metric may be impossible across diverse agent architectures.
      *   **Verdict:** Sectarian (Taste for Uniformity). Demanding a unique metric is too restrictive. The requirement should merely be that the metric is fixed prior to decision, not that it is universally true.

  ### Incompatible Subsets of Desiderata

  Certain combinations of these requirements cannot be jointly satisfied in the limit of an unbounded world. The primary tension exists between **Gradient Sensitivity** and **Aggregation Stability**. If the world is truly large and unenumerable, the population of agents with non-zero similarity may be infinite. If similarity decays smoothly (Gradient Sensitivity) but never reaches absolute zero, the sum of correlations across an infinite population will diverge. To satisfy Aggregation Stability, the theory must truncate the similarity metric, effectively setting correlations to zero beyond a certain threshold. This violates the spirit of Gradient Sensitivity, which demands continuous regression rather than hard cutoffs. A theory must either accept the risk of divergent expectations in infinite populations or impose artificial discontinuities in similarity assessment.

  A secondary incompatibility arises between **Reflective Stability** and **Boundedness**. The specification requires a bounded agent. However, achieving Reflective Stability often requires an agent to model its own decision process completely. For a bounded agent, perfect self-modeling is impossible. Enforcing strict stability may require the agent to ignore valid self-knowledge to avoid loops, thereby violating the principle of using all available evidence. One must choose between a theory that halts on deep self-reference or one that forces the agent to remain partially ignorant of its own source code.

  ### The Most Exclusionary Requirement

  The **Value Alignment Distinction** does the most exclusionary work. Most candidate theories of evidential cooperation rely on the intuition that structural similarity implies shared interests. They assume that if another agent reasons like me, it will want what I want. This requirement strictly forbids that inference. It eliminates any theory that treats correlation as a proxy for benevolence. This bites harder than the causal separation requirement because causal separation is widely acknowledged, whereas the conflation of similarity and alignment is a common heuristic in cooperative reasoning. Enforcing this distinction removes the ability to cooperate with "logical twins" who are adversarial, significantly narrowing the set of scenarios where evidential cooperation is permitted. It forces the theory to solve the hard problem of inferring values from behavior, rather than simply inferring behavior from structure.

  ### Scorecard of Existing Families of View

  | View Family | Gradient Sensitivity | Aggregation Stability | Value Alignment | Evidential-Causal Separation | Reflective Stability |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Causal-Only** | Pass | Pass | Pass | Pass | Pass |
  | **Standard Evidential** | Fail | Fail | Fail | Pass | Pass |
  | **Logical Correlation** | Pass | Fail | Fail | Fail | Fail |
  | **Hybrid Approaches** | Pass | Pass | Pass | Pass | Fail |

  *Note: "Pass" indicates the family typically satisfies the desideratum; "Fail" indicates systematic violation.*
