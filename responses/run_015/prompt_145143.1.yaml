      *   **User's Crux:** If a system passes a *genuinely adversarial* test (skilled judges, months long, real consequences) and people *still* deny mind, the criterion is dead. If they attribute mind *only after* such a pass, the criterion is working.
      *   **Request:** Rank defeaters (fatal to awkward) for each part separately. Identify which part does the work. Identify defeaters that have arguably already arrived. Address the "consciousness-of-the-gaps" charge (moving bar vs. residual). Enrich standard objections (Chinese Room, etc.) to fit this specific formulation. Evaluate the coherence of the updating policy. Give an honest verdict on riskiness.

