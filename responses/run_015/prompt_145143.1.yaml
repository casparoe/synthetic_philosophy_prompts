      *   *Scenario B:* Passes adversarial test $\rightarrow$ Mind attribution. (User says: Criterion Working).
      *   *Problem:* What defines "Adversarial"? If "Adversarial" is defined as "Hard enough that people attribute mind," it's circular. If "Adversarial" is defined independently (e.g., specific protocol), then Scenario A is possible.
      *   *Coherence Check:* The policy is coherent *if* the "Adversarial" standard is fixed independently of the verdict. If the standard moves *to ensure* the verdict, it's unfalsifiable.
      *   *Sycophancy:* Exploiting psychology is a form of "cheap faking." If the system wins by hacking the judge rather than demonstrating competence, Part 2 says the bar should rise.

  7.  **Drafting the Response (Iterative Process):**

      *   *Structure:*
