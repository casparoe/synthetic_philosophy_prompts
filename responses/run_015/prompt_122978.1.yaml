answer: |-
  Good morning. Thank you for being here, and for being awake enough to listen.

  I want to start with a small experiment. Please close your eyes. I know it's Saturday, and I know there was coffee, but please, humor me. Close your eyes.

  I want you to picture a chair. Not this chair you're sitting in, but a chair in your mind. The idea of a chair. A standard chair. Four legs, a seat, a backrest. Maybe wood, maybe metal. It's waiting for someone to sit in it.

  Hold that image.

  Now, I'm going to add a detail. The person sitting in this chair is five feet, four inches tall. Their feet dangle slightly above the floor. Their lower back doesn't quite meet the support. They are uncomfortable.

  Now, I'm going to add another detail. The person approaching the chair uses a wheelchair. The seat height is too low to transfer safely. The armrests are in the way. They cannot sit in this chair at all.

  Open your eyes.

  When I first said the word "chair," you didn't picture the uncomfortable child or the excluded wheelchair user. You pictured a chair that fits *you*, or perhaps a chair that fits an invisible average. You pictured a generic object. But as soon as we added specific bodies, the generic nature of the chair collapsed. It wasn't a chair for everyone. It was a chair for someone specific, built by someone specific, with a history of specific dimensions that we've forgotten.

  We treat words like that chair. We assume they are universal furniture, ready to hold any meaning we place on them. But often, like that chair, they are built to fit a specific shape, and the history of that construction has worn smooth. We don't see the joinery anymore. We just sit down, and if we don't fit, we assume the problem is our body, not the chair.

  I call this a "hollow generic." It is a word that sounds like it covers everyone, but quietly doesn't. Its hollowness is invisible precisely because the history has gone dead.

  Douglas Hofstadter wrote a famous paper on this phenomenon, showing how we take specific markers and run them backwards until they look like neutral defaults. I don't want to spend twenty minutes explaining his work, because many of you know it better than I do, and the rest of you would rather be having a second coffee. Instead, I want to show you what it looks like when a novelist builds one from scratch.

  In the book I'm finishing, there is a language where the ordinary, all-purpose word for a person is *Hearthed*. It is the word you use for a citizen, a neighbor, a human being. "Is there anyone home?" "No, the Hearthed have gone to market." "All the Hearthed are welcome."

  But the etymology, which went dead centuries before the plot begins, descends from the word for "Householder." Literally: one who holds the hearth.

  In the world of the book, nobody notices this. It's just the word for person. But the plot turns on who does and doesn't get counted by it. If you are a wanderer, if you are a guest who stays too long, if you are a servant who lives in the outbuilding—you are biologically human, but linguistically, you are not *Hearthed*. You are not a "person" in the full sense of the law. You are a visitor. You are a transient.

  When I write a scene where a character says, "Every person has a right to safety," and the listener understands "Every householder has a right to safety," the tension isn't in the action. It's in the grammar. The word promises universality but delivers exclusion.

  This is not just a fantasy problem. It is the problem of this weekend's theme: "The Common Reader."

  We say "The Common Reader" to mean everyone. We mean it inclusively. We mean the student, the retiree, the commuter, the parent reading in the bath. But is it a hollow generic?

  When you heard the phrase this morning, did you picture a specific person? Did you picture someone with leisure time? Someone with literacy in the dominant language? Someone who can afford the price of admission to a literary festival?

  I don't ask this to shame us. I ask this because if we don't see the shape of the chair, we can't build a better one.

  I have a personal stake in this invisibility. I publish under my initials. Across three books, reviewers have read me as a man. I have never corrected it.

  There are practical reasons for this. We know that names perceived as male receive different scrutiny, different weight, than names perceived as female. It has been good for my career to let the assumption stand. But there is a cost.

  In my case, the default latched onto a form that was already neutral and re-marked it anyway. My initials are a blank space. They are a silhouette. But you filled them in. You looked at the neutral shape and saw a man.

  This is the reverse of the *Hearthed* problem. In my book, the word looks universal but is historically specific. In my career, my name is historically neutral, but the reception makes it specific. Both moves achieve the same result: they tell us who belongs in the room without ever saying it out loud.

  I tell you this not as a confession. I am not going to apologize for surviving the industry as best I could. I tell you this because it proves that the hollow generic is not just about suffixes. It's not just about avoiding "-man" words. We could ban every gendered suffix in the English language tomorrow, and we would still look at a neutral initial and see a man. We would still look at a "common reader" and see a subscriber to the *New York Review of Books*.

  The bias isn't always in the ink. Sometimes it's in the eye.

  So, where does that leave us? Especially in a room like this.

  I know there are linguists here. I know there are translators and copy editors. You spend your careers navigating these minefields. You know the history of "actor" and "actress," of "waiter" and "server." You know the fights over "they" as a singular pronoun. You know that language is a living thing that resists being told what to do.

  I am not standing here to tell you that language is hopeless. I am not standing here to tell you that we need to police every noun until it is pure. Purity is not the goal. Clarity is.

  When I write *Hearthed*, I am not trying to create a perfect language. I am trying to create a visible one. I want the reader to stumble over the word. I want them to feel the exclusion in their mouth when they say it.

  For the editors in the room: I know you cannot fix the world with a style guide. I know you are often overruled by marketing, by tradition, by habit. But you are the ones who notice when the chair doesn't fit. You are the ones who see the threshold that is too high. When you flag a word, when you ask an author, "Who are you actually talking about here?" you are doing the work of repair. You are making the hollow visible.

  For the readers in the room: You are the ones who sit in the chair. You are the ones who decide if it holds you.

  This brings me back to "The Common Reader."

  If "The Common Reader" is a hollow generic, if it secretly excludes the tired, the poor, the non-native, the disabled, then we have two choices.

  One choice is to discard the phrase. To say it is tainted and we must find a new one. "The Actual Reader." "The Present Reader."

  The other choice is to fill the hollow.

  This is what I want to propose for this weekend. We do not need to abandon the idea of the common reader. We need to reclaim it. We need to make it specific enough that it cannot be misunderstood.

  When we program these festivals, who are we inviting? When we choose the books for the tables, whose stories are on the cover? When we say "welcome," do we mean everyone, or do we mean everyone who looks like the people who were here last year?

  The word "common" used to mean "shared by all." It meant the commons, the public land, the place where no one owned the grass but everyone could walk on it. It did not mean "ordinary." It did not mean "average." It meant "collective."

  If we take that definition, the "Common Reader" is not a demographic. It is not a marketing segment. It is a practice.

  Reading is the act of taking a specific story—written by a specific person, with specific biases, in a specific language—and making it common. Making it shared. When you read a book written by someone who is not *Hearthed*, someone who does not share your history, and you let them into your head, you are expanding the definition of the person.

  You are widening the doorframe.

  I want to come back to my initials. I said I never corrected the assumption that I was a man. But I am correcting it now. Not because I am ashamed of the benefit it gave me, but because I want to change the shape of the chair for the next person.

  I want the next writer who uses initials to be read as themselves, or as nothing, or as everything. I want the next reader who picks up a book to not have to ask, "Is this for me?" before they open the cover.

  This is not a task for the linguists alone. It is not a task for the editors alone. It is a task for the Common Reader.

  Because here is the thing about hollow generics: they only work if we agree not to look at them. They rely on our silence. They rely on our willingness to accept the shadow instead of checking the object casting it.

  But we are writers. We are readers. We deal in specifics. We know that the devil is in the details, but so is the divine.

  So, for this weekend, I invite you to test the furniture. When you hear a word that sounds too smooth, too universal, too easy, run your hand over it. Check for splinters. Check for gaps.

  If you hear "The Common Reader," ask: "Which one?"
  If you hear "Universal Truth," ask: "Whose?"
  If you hear "Anyone," ask: "Really?"

  And if you find that the chair doesn't fit, don't squeeze yourself into it. Don't assume you are the wrong size. Assume the chair is wrong. And then, because you are writers, build a new one.

  Because the story isn't finished. The language isn't fixed. The definition of who gets to be a person, who gets to be a reader, who gets to be a voice—that is being written right now. It is being written in the panels you attend, in the books you buy, in the conversations you have over lunch.

  We can let the hollow generics stand, and let the history remain dead. Or we can wake it up. We can make the etymology visible again. We can remind ourselves that "person" is a choice we make, not a category we inherit.

  I started by asking you to picture a chair. I want to end by asking you to picture something else.

  Picture a table. A large table. It has space for more chairs. It has space for chairs we haven't invented yet. It has space for people who don't fit the standard dimensions.

  This festival is that table. The books you read this year are that table.

  The seat is empty. The common reader is whoever sits down.

  Thank you.
