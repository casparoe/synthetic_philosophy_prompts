          *   Observation: Agent goes S -> A -> E.
          *   $R_1$: +1 at E, 0 elsewhere. (Wants to reach E).
          *   $R_2$: +1 at A, 0 elsewhere. (Wants to visit A).
          *   Wait, if they stop at E, $R_2$ might not explain stopping.
