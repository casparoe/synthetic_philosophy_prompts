      *   *The Yellow Wallpaper* context: The narrator is diagnosed with "temporary nervous depression—a slight hysterical tendency." John (husband/doctor) prescribes the "rest cure."
      *   *Question 1 (Label vs. Regimen):* Hacking focuses on *kinds* of people. The diagnosis ("nervous depression") is the label, but the *treatment* (isolation, forbidding work) is the mechanism of change. In Hacking's framework, the classification brings with it a set of expectations and treatments that shape the person. So, yes, it's looping, but the "architecture" (the room) is the physical enactment of the classification. The classification *creates* the environment that produces the behavior. It's not misusing the term; it's expanding the "classification" to include the *regimen* dictated by that classification.
      *   *Question 2 (Which Kind):* "Wife" and "Nervous Woman" are intertwined. Hacking acknowledges interactive kinds. The domestic category *is* the psychiatric category here because John holds both authorities. It doesn't hollow it out; it strengthens it. The power lies in the overlap.
      *   *Question 3 (Refusal/Withholding):* Is "refusal loop" real? Yes. Denying a category ("You aren't sick, just tired") while treating someone as sick creates a double bind. It's not just gaslighting (which is psychological manipulation); it's ontological insecurity. If you are treated as broken but told you are fine, you lose the language to describe your state. This forces the creation of *new* language (the wallpaper, the creeping woman). It's a genuine mechanism.
      *   *Question 4 (Narration):* First-person uncertainty is a *feature*. Hacking writes philosophy from the outside looking at systems. Fiction shows the *inside* of the loop. The narrator cannot see the loop because she is *in* it. The diary shows the *process* of becoming the kind. The ambiguity (was she always sick?) is exactly what looping explains: the interaction creates the trajectory.
      *   *Question 5 (The Ending):* Does it vindicate constructivism or realism? It's messy. There *was* distress beforehand (she admits she disagrees with the cure initially). The classification didn't create the pain ex nihilo, but it shaped the *form* the pain took (creeping, crawling, identifying with the wallpaper). The reading stops working if you claim she was *fine* until John spoke. The reading holds if you claim the *specific madness* was co-authored by the cure.
