          *   *The "Special Majority" or "Quota" Rule:* Require the majority on premises to match the majority on conclusion.
      *   *Best "Third Option" to highlight:* The distinction between *voting on reasons* vs. *voting on outcomes* is the crux. A procedural fix is to treat the vote on Approval as *derivative* (Lena) OR to treat the vote on Standards as *advisory* (Marcus). But a true third option might be **Deliberative Voting** (changing preferences) or **Sequential Voting with a Binding Agenda** (Vote E, Vote Z, A is automatic). Actually, the prompt asks if there is an option *both are missing*.
