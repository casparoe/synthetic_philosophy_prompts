          *   *Verdict:* Sound.
      *   *Argument 4:* "The public also cares about the standards being applied consistently, and that a council which can simultaneously record that a project meets both standards and that the project is rejected is a council that cannot be trusted to apply its own rules."
          *   *Analysis:* Appeals to institutional integrity and trust. Consistency is a key virtue of legal/administrative bodies.
          *   *Verdict:* Sound.

  4.  **Adjudicate Marcus's Arguments ("Bottom-Up" / Conclusion-Based):**
      *   *Argument 1:* "The council should have voted on the final question first, and if it had failed, it should then have determined which of the two standards the project fails to meet."
          *   *Analysis:* This is the "Conclusion-Based Procedure." It prioritizes the outcome over the reasoning.
          *   *Verdict:* Partially Sound (prioritizes the decisive outcome, but creates logical fiction in the reasoning).
      *   *Argument 2:* "He maintained that the entire purpose of the meeting was to decide whether to approve the project, and that overriding a majority vote on that question with a logical rule would be undemocratic."
          *   *Analysis:* This is the core democratic defense. The "bottom line" is what affects citizens. Overriding the direct vote on the outcome can seem undemocratic.
          *   *Verdict:* Partially Sound (valid democratic intuition, but ignores that democracy also requires adherence to agreed-upon rules/bylaws).
      *   *Argument 3:* (Concession) "Marcus conceded the point [about the mirror-image problem] but said it was a lesser evil, because at least the bottom-line decision — the one the public actually cares about — is respected."
          *   *Analysis:* Acknowledges the inconsistency but weighs values (outcome vs. reasoning).
