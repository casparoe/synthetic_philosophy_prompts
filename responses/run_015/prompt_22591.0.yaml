      *   **Constraint:** Do *not* give advice on what the user should think. Focus on adjudicating the arguments as presented.

  2.  **Deconstruct the Scenario (The Doctrinal Paradox):**
      *   This is a classic example of the *Doctrinal Paradox* (or Discursive Dilemma) in social choice theory and legal theory.
