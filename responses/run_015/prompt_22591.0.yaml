      *   *Argument 2:* "The approval question is not an independent judgment but a logical consequence of the two standards, so voting on it separately was the mistake that generated the inconsistency."
          *   *Analysis:* Technically correct regarding the bylaws. If A is defined by E and Z, treating A as an independent variable allows for the paradox.
