answer: |-
  A genuinely non-Whiggish theory of history must treat the present as a contingent survivor among many possible pasts, demanding a rigorous methodological separation between causal explanation and moral endorsement.

  Initial brainstorming suggests we must first account for the cognitive machinery that makes Whiggism so tempting; our brains are pattern-seeking engines that favour narrative closure over stochastic reality, much like seeing a 'climax community' in forest succession where there is only temporary stability. We need criteria that enforce the distinction between diachronic contingency (the branching path actually taken) and synchronic functional explanation (how things work now), ensuring we do not mistake current utility for historical inevitability. Furthermore, the theory must align with evolutionary biology, acknowledging that adaptation is local and path-dependent rather than progressive, and it must handle hard cases like scientific revolutions without implying that current theories were the destined outcome of prior inquiry. From these raw thoughts, we can derive a structured set of desiderata that prioritises epistemic humility over narrative satisfaction.

  | Requirement | Status | Motivation and Phenomena to Explain |
  | :--- | :--- | :--- |
  | **Contingency Preservation** | Non-negotiable | Must explain why the present is one branch among many, not the telos. Prevents the retrospective coherence fallacy where contingent disturbances are rewritten as necessary steps. |
  | **Causal/Normative Separation** | Non-negotiable | Must distinguish explaining *how* an outcome occurred from endorsing it as 'good' or 'better'. Addresses the tendency to conflate survival with moral superiority (the 'might makes right' fallacy). |
  | **Cognitive Bias Accounting** | Non-negotiable | Must explain why pattern-seeking brains see teleology in noise. Requires the theory to actively correct for the human preference for linear narrative over branching complexity. |
  | **Biological Compatibility** | Non-negotiable | Must not contradict findings in evolutionary biology regarding path dependence and lack of orthogenesis. History, like ecology, deals with local adaptation, not a ladder of progress. |
  | **Counterfactual Robustness** | Nice-to-have | Should be able to model plausible alternative pasts to demonstrate contingency. While difficult to prove, it strengthens the claim that the actual outcome was not inevitable. |
  | **Hard Case Handling (Science/Reform)** | Non-negotiable | Must explain scientific revolutions or social reforms without treating present norms as inevitable. Requires showing how current truths emerged from contested, fragile processes rather than unfolding destiny. |
  | **Diachronic/Synchronic Distinction** | Non-negotiable | Must preserve the difference between historical origin (causes) and current function (utility). Prevents assuming that because something works now, it was designed or destined to work that way. |

  The single requirement that does the most damage to usual casual accounts is **Contingency Preservation**. Most popular history and even much academic narrative relies on the subtle implication that the present state of affairs was the most probable or logical outcome of prior events; enforcing strict contingency forces the historian to acknowledge that the current order is merely a survivor, potentially fragile and entirely replaceable, which undermines the comforting narrative of inevitable progress that underpins most Whiggish interpretations.
