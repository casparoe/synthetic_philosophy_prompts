answer: |-
  Thank you for being here. Thank you to the library for accepting these boxes, and thank you to Naomi for sitting in the front row, allowing us to bring this work back to the place where Hallie's record lives.

  We are gathered to transfer the production archive of *Rent Strike*. Inside these boxes are drafts, call sheets, correspondence, and the final script. There is also a hard drive containing the footage we did not use. By placing these materials alongside Hallie Brant's letters, case files, and cassette recordings, we are making a specific claim about what belongs in a historical record. Usually, an archive preserves evidence of what happened. Today, we are also preserving evidence of what we imagined happened.

  I want to be clear about the distinction, because the students in the room will be the ones to open these boxes after we are gone. A letter Hallie wrote is a primary source. It is her voice, captured in a moment she controlled. A scene I wrote is an interpretation. It is my voice, attempting to channel hers. When we file a script beside a letter, we are not saying they hold the same weight. We are saying they hold the same questions.

  To make this film, I made three choices that depart from the documentary record. I need to name them here, so that the archive tells the truth about the film, even if the film does not tell the truth about Hallie.

  First, there is a character named Del. Del does not exist. Del is a composite of three organizers who worked alongside Hallie in the 1970s. In the interest of narrative compression, I merged their struggles into one body. This is a common convention in drama, but it is a distortion of history. It simplifies a movement that was actually a chorus.

  Second, there is a speech Hallie gives in the third act. She speaks words she wrote, but she wrote them in private letters, never for a podium. I took her private grief and turned it into public rhetoric. This makes her seem more cohesive, more certain, than the letters suggest she felt. It creates a clarity that life rarely offers.

  Third, and most difficult, there is a scene where Hallie reconciles with her estranged brother on her deathbed. This conversation never happened. We undertook an agreement with the estate that Hallie would never be given a line she did not say or write. In the editing room, I broke that undertaking. I prioritized an emotional resolution over the historical record.

  I am not saying this to ask for forgiveness. I am saying it because the archive must contain the breach as well as the work. A friend of who makes documentaries told me that the wrong we might do here isn't a harm to Hallie. She is not here to be harmed. The wrong is a betrayal of the record. It is a misuse of a voice that cannot answer back. It is an unfairness that can never be repaired by the person it was done to.

  But my friend also said that a dramatization can be true to someone in a sense that isn't the same as being accurate. Sometimes, a scene built out of private sentences can say something about a life that the documentary record alone doesn't say. Both halves feel true to me. The film holds both the truth of her impact and the fiction of my construction.

  This creates a problem for all of us. For the funders and producers, it means supporting a project that admits its own limitations. For the archivists, it means cataloging a fiction beside the fact. You are not accepting these scripts because they are equivalent to Hallie's letters. You are accepting them as a record of how we tried to understand her, and where we failed. The value of this archive is not that it solves the mystery of Hallie Brant. It is that it preserves the struggle to tell it.

  For Naomi, I know this is complicated. You are the steward of your mother's memory. You entrusted us with her story, and there are moments where we returned something different than what you gave us. I cannot know what Hallie would have thought of this film. She is the one person in this room who cannot correct me, and I am not entitled to claim I know her mind. I do not know if she would have loved this, or rejected it. To say otherwise would be to use her voice one more time.

  But I do know what she fought for. She fought for tenants to have a record of their own conditions. She fought for the right to contest the official story of a building, a lease, a life. In that spirit, I offer this archive not as a monument, but as a contestable text.

  To the students: When you open these boxes, you will find the letters where Hallie doubted herself. You will find the script where I made her certain. You will find the footage where we staged the brother's visit, and the emails where we debated whether to cut it. I hope you argue about them. I hope you ask what we owe someone who no longer exists. Do we owe them accuracy? Do we owe them legacy? Or do we owe the future a clear view of how we construct the past?

  I don't have the answer. The film attempts to find it, and the archive admits where it missed.

  Hallie Brant's work was about housing, about shelter, about the right to remain. Our work here is about memory. We are trying to build a shelter for her story that is sturdy enough to hold the weight of what we know, and honest enough to show the cracks where we guessed.

  So, we transfer these materials not to close the book on Hallie, but to open a new file. We are adding our questions to her answers. We are placing our inventions beside her facts, so that the difference is visible. This is the best honor I can offer: to treat her life as something real enough to withstand our scrutiny, and our errors.

  Thank you for trusting us with the attempt. Thank you for letting us add our boxes to hers. And thank you for ensuring that when the future looks for Hallie Brant, they will find her words, and they will find ours, and they will know the difference.
