  i want to know what would actually count against this. not the usual "suffering is suffering" line—i mean specifically, what evidence or thought experiments show that replayability or checkpoint-ability doesn't kill moral weight? which ones would be fatal to my view and which are just awkward? also, what would someone who holds my view have to admit is a real problem, versus what they'd just dismiss? and is this argument just me dressing up a gut feeling in software terms, or does it actually have bite?

  no need for bibliographies or citations, i just want the weak spots mapped out honestly.
