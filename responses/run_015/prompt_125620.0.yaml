  INTERNAL MEMORANDUM
  **TO:** Permanent Secretary, Department of Administrative Standards
  **FROM:** Director, Office of Situational Integrity
  **DATE:** 14 October 2024
  **SUBJECT:** Implementation of Environmentally Scoped Character Certificates (Phase 4)
  **CLASSIFICATION:** OFFICIAL – SENSITIVE

  1. This memorandum outlines the operational rollout of Environmentally Scoped Character Certificates (ESCC) following the abolition of global trait ascriptions in hiring and appraisal. As established by the Department's adoption of the Situational Consensus, person-level predicates (e.g., "integrity," "reliability") are empirically unsupported. Personnel are now certified only relative to specific environmental parameters ($E$). An employee is not honest; they are honest-in-$E$, where $E$ denotes a fixed constellation of situational variables. Certification lapses immediately upon translocation.

  2. It is noted that the evidence base for situational variance relies on single-shot behaviours in contrived settings. Consequently, the granularity of $E$ must be exhaustive. Minor variations in lighting, ambient noise, or spatial geometry constitute distinct environments requiring fresh certification. The Manual of Environments has expanded to 4,000 distinct codes this quarter. Line managers are advised that certification lapses upon translocation, even within the same building. A corridor is not a room; a carpeted floor is not a tiled floor.

  3. Regarding the grain-of-description problem, the Re-graining Tribunal has issued guidance on environmental identity. A standing adjudication protocol, known as the "desk-plant problem," determines whether the introduction of organic matter invalidates an existing Certificate of Probity. Current guidance stipulates that a *Ficus benjamina* exceeding 40cm invalidates Certificates issued for bare-desk environments. Managers must log flora changes daily to maintain compliance. Failure to log flora constitutes a breach of situational maintenance.

  4. While global traits are abolished, the accumulation of local certifications functions as a composite dossier. It is recommended that managers review the aggregate of an employee's ESCCs to predict future conduct. Although we do not assert the employee possesses a stable disposition, the pattern of valid certificates across varied $E$ parameters serves the same administrative function as the deprecated vocabulary. This is not a reintroduction of character but a data-driven mapping of situational compatibility. To prevent semantic drift, managers are prohibited from using the word "usually" when describing this aggregate.

  5. The shift from blame to situational maintenance represents a significant cost saving. Disciplinary hearings are replaced by environmental adjustments. Where an employee fails to perform ethically in $E$, the Department adjusts $E$ rather than sanctioning the agent. Mandatory modifications include lumens adjustment, room booking restrictions, and regulated caffeine intake prior to high-risk tasks. Biometric monitoring of stress levels during budget approvals is now standard. Pre-emptive reassignment is authorised where the cost of environmental modification exceeds the risk value of the potential ethical breach. This ensures the agent is never held responsible for variables outside their control.

  6. A worked case illustrates the protocol. Deputy Director H. returned a lost wallet in the Main Atrium (Code: E-Open-NaturalLight) but approved a falsified travel claim in Conference Room B (Code: E-Enclosed-Fluorescent). Under the previous regime, this contradiction would suggest hypocrisy or moral failure. Under ESCC, Director H. holds a valid Certificate for E-Open-NaturalLight and a negative finding for E-Enclosed-Fluorescent.

  7. The resolution is as follows: Director H. is not deemed unreliable. Rather, the environment of Conference Room B is deemed incompatible with Director H.'s certified ethical output. However, maintaining Conference Room B at Atrium standards (open sky, natural light) is cost-prohibitive. Furthermore, expanding Director H.'s certification to include windowless rooms requires repeated exposure trials, during which further fiscal risk is incurred.

  8. It is therefore recommended that Director H. be reassigned to roles exclusively within E-Open-NaturalLight parameters. As no such roles exist at the Deputy Director level, the position is to be vacated. This is not a dismissal for cause, but a situational incompatibility. The vocabulary of character has not been restored; the person has simply been matched to a null set of environments. We do not say Director H. is untrustworthy. We say there is nowhere left to put them.

  **ANNEX A: FREQUENTLY ANTICIPATED QUESTIONS FOR LINE MANAGERS**

  **Q1: Can I describe an employee as "good" if they pass all current ESCCs?**
  A1: No. You may state they are "compatible with all currently coded environments." Note that new environments are coded daily.

  **Q2: Does the desk-plant rule apply to artificial flora?**
  A2: Yes. Visual perception of foliage is the triggering variable, not biological status.

  **Q3: If an employee fails in 99 environments but passes 1, are they unreliable?**
  A3: Person-level ascriptions are prohibited. They are "compatible with 1 environment." It is recommended you find that environment or terminate the contract based on role-fit, not character.

  **Q4: Is caffeine monitoring intrusive?**
  A4: It is situational maintenance. Blame is intrusive. Monitoring is administrative.

  9. Action Points: Line managers must submit updated environmental logs by Friday. Cost Centre 88-B will cover Tribunal fees. Please note that questioning the validity of the Situational Consensus remains a breach of conduct code 4.1.
