  **The Problem of Old Evidence**

  A hypothesis that entails a proposition the agent already accepted with probability one cannot raise the probability of that proposition. On the standard incrementalist criterion, it cannot be confirmed by it. Yet such confirmations appear among the strongest in the history of science. When Einstein derived Mercury's perihelion advance from general relativity, the data was old. When Bohr derived hydrogen lines, the spectrum was known. If probability cannot move, how does confirmation happen? This tree sorts your intuitions about these cases into distinct theoretical positions without requiring prior reading.

  **Case Bank**
  *   **A (Mercury/Eclipse):** Mercury's perihelion (old) vs. Eclipse deflection (new) for General Relativity.
  *   **B (Hydrogen):** Known spectrum (old) vs. New lines (new) for Bohr Model.
  *   **C (ML Logs):** Logs show pattern E; Hypothesis H entails E.
      *   **C1:** New researcher sees old logs, forms H.
      *   **C2:** Researcher certain of E, forms H now.
      *   **C3:** H had prior, set aside, now revived.
      *   **C4:** Certain of H & E, never entertained H entails E.

  **Decision Tree**

  **Q1.** In **C1**, is E "old evidence" for the new researcher?
  ○ Yes (Community) ○ No (Individual)
  **Q2.** In **C2**, does H confirm E?
  ○ Yes → Q3 ○ No (Exit: Skeptic)
  **Q3.** For confirmation, must the probability of E increase?
  ○ Yes → Q4 ○ No → **Leaf 1**
  **Q4.** In **C4**, does solving this require adding "H entails E" to the set of propositions assigned probabilities?
  ○ Yes → **Leaf 2** ○ No → Q5
  **Q5.** In **C2**, should we calculate using the lab's probabilities from one year ago?
  ○ Yes → **Leaf 3** ○ No → Q6
  **Q6.** In **C2**, is the probability of E strictly less than 1 due to measurement error?
  ○ Yes → **Leaf 4** ○ No → Q7
  **Q7.** In **C3**, would H confirm if its prior probability were zero?
  ○ Yes → Q8 ○ No → Q9
  **Q8.** In **C4**, is the difficulty caused by assuming agents know all logical consequences immediately?
  ○ Yes → **Leaf 5** ○ No → Q9
  **Q9.** In **A**, does the eclipse confirm GR more than Mercury did?
  ○ Yes → **Leaf 6** ○ No → **Leaf 7**

  **Positions (Leaves)**

  1.  **Absolute Firmness:** Confirmation is high probability, not increase. *Awkward:* Cannot distinguish confirmed from unconfirmed if both certain. *Agent-Relative:* No.
  2.  **Logical Learning:** Learning entailment changes probabilities. *Awkward:* Requires expanding the language of probability. *Agent-Relative:* Yes.
  3.  **Historical Reconstruction:** Evaluate using past probabilities. *Awkward:* Confirms hypotheses for dead scientists, not living ones. *Agent-Relative:* No.
  4.  **Uncertain Observation:** E is never probability 1. *Awkward:* Requires denying certainty of measurements. *Agent-Relative:* Yes.
  5.  **Bounded Rationality:** Problem vanishes for non-omniscient agents. *Awkward:* Bayesianism becomes a theory of limited computation. *Agent-Relative:* Yes.
  6.  **Incremental Artifact:** Problem is with 'incremental' definition, not Bayes. *Awkward:* Requires non-standard confirmation metric. *Agent-Relative:* No.
  7.  **Agent-Relative Subjectivism:** Oldness depends on the knower (Q1=No). *Awkward:* Same evidence confirms for one, not another. *Agent-Relative:* Yes.

  **Indistinguishable Pairs**

  *   **Logical Learning vs. Bounded Rationality:** Both rely on unawareness of entailment. *Distinction:* Does learning entailment change the algebra (Leaf 2) or just the state (Leaf 5)?
  *   **Uncertain Observation vs. Absolute Firmness:** Both deny P(E)=1 blocks confirmation. *Distinction:* Case bank assumes P(E)=1; no case distinguishes them.
  *   **Historical Reconstruction vs. Incremental Artifact:** Both allow old evidence to confirm. *Distinction:* Requires cases where past probabilities are unavailable.
