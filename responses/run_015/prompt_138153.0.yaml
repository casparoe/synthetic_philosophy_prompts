          *   *Conflict:* Can you have genuine goal-directedness without grounded understanding? (Classic philosophical debate). If the "vortex" doesn't know what water is, is it truly goal-directed or just simulating it?
          *   *Severity:* Medium. Depends on definition of "genuine."

      *   **Tension D: The Diagnostic Clue [Scheming vs. No Goals]**
