answer: |-
  The Wegener episode demonstrates that normative frameworks for peer disagreement lose their prescriptive force when disputes center on divergent standards of proof and background theory rather than conflicting interpretations of shared data. Under conciliationism, treating Wegener and his critics as epistemic peers requires both to significantly lower their credence toward an agnostic midpoint: Wegener should have diminished his confidence in continental drift given the overwhelming consensus against it, while critics should have lowered their confidence in fixed continents given Wegener's persistent correlational evidence. In this framework, both sides would assess the other as reasonable but currently mistaken, warranting a suspension of judgment until further evidence arose. Under steadfastness, each side maintains high credence by privileging their prior weighting: Wegener prioritizes the explanatory power of correlational data, while critics prioritize the necessity of a physically plausible mechanism consistent with established geophysics. The disagreement was not about the data itself—the fit, fossils, and striations were shared—but about the evidential threshold required to overturn a dominant paradigm, specifically whether correlation without mechanism constitutes proof. The 1960s vindication via plate tectonics suggests that both norms misfire in this context rather than proving the critics failed an obligation to conciliate or that Wegener was simply right to remain steadfast. Conciliation would have likely suppressed the hypothesis without resolving the mechanistic deficit, while Wegener's steadfastness was factually correct but methodologically premature given the physics of the time. Ultimately, the episode suggests that peer-disagreement norms scope primarily to intra-paradigm disputes where standards of proof are shared, failing to guide rational conduct during inter-paradigm shifts where the criteria for evidence itself are contested.
