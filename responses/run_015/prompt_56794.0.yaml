  In the invented polity of Aethel, Historians Alpha and Beta possess a sealed, complete archive regarding the "Copper Succession," agreeing on every factual detail (the King's abdication, the riot, the successor's coronation, the ensuing peace) and every moral and political valuation (abdication was noble, riot was violent, peace was desirable, sacrifice was costly), while addressing the identical question: "What is the narrative identity of the Succession?" Alpha produces a Comedy, configuring the riot as a temporary discord resolved by the coronation's reconciling power, wherein the cost of sacrifice is subsumed into social integration; Beta produces a Tragedy, configuring the peace as a stable order purchased by the King's sacrificial removal, wherein the cost of sacrifice defines the existential loss inherent in the victory. No additional evidence could arbitrate between them, for the divergence arises not from what happened or what is good, but from the poetic prefiguration of the event sequence itself, leaving the Rankean ideal of a single objective story structurally impossible despite total empirical consensus.

  (1) **Remaining Freedom and Generation of Difference:** Once facts, values, archives, and questions are fixed, the only remaining freedom is the **poetic prefiguration** of the event sequence—the choice of literary gestalt used to synthesize the data. This freedom generates the difference because events do not contain their own narrative structure; Alpha selects "reconciliation" as the organizing principle, making the sacrifice a passing moment within a movement toward harmony, while Beta selects "loss" as the organizing principle, making the peace a permanent reminder of what was destroyed. The facts support both because they are multivalent; the divergence is produced by the historian's choice of how to configure the relationship between the beginning, middle, and end, not by the content of those stages.

  (2) **Historiographical Conclusions:**
  *   **A Rankean** would conclude that one historian has failed to penetrate the inner truth of the matter, insisting that the "actual" past possesses a single inherent form that intuition should reveal; they would view the divergence as a symptom of subjective error rather than structural necessity.
  *   **A Carr-style historian** would argue that meaning is always constructed through a dialogue between the historian and the facts, but since this case neutralizes bias and selection, they would likely concede that interpretation goes deeper than mere factual selection, edging toward White's position.
  *   **Hayden White** would conclude the case vindicates his theory: history is a literary artifact where the form (emplotment) creates the content (meaning), proving that *wie es eigentlich gewesen* is unattainable because language itself imposes structure on the chaos of events.

  (3) **Single Feature and Constraint Lift:** The single feature doing the work is the **underdetermination of narrative structure by factual sequence**. If you lift the constraint requiring **agreement on every evaluative question**, the case collapses into the ordinary Carr point: the divergence could then be explained by differing moral or political sympathies (bias), allowing one to argue that better values would yield the "correct" plot, thereby restoring the possibility of objective progress through moral correction.

  (4) **Strongest Rankean Objection:** A Rankean could argue that emplotment is merely a **rhetorical packaging** secondary to the primary historical truth of causal chains; thus, Ranke's ideal applies to the reconstruction of causes (which are agreed upon), while the story structure is just pedagogical decoration. This objection **fails** because historical explanation is inherently narrative; to change the emplotment is to change the explanation of *why* events mattered (e.g., was the riot a step toward harmony or a symptom of loss?), meaning the "truth" of the past is inaccessible outside the chosen literary form.
