answer: |-
  # Evaluation Protocol for Gödelian Modal Ontological Arguments

  ## Preliminary Brainstorming: Distinctions Preserved vs. Dropped

  To operate within a twenty-minute review window without sacrificing logical rigor, the following conceptual distinctions are preserved as essential to the integrity of the review. All others are dropped for speed.

  **Preserved Distinctions:**
  1.  **Intensional vs. Extensional:** We must distinguish between a property's definition (intension) and the set of objects possessing it in a specific world (extension). Confusing these leads to equivocation regarding "positive" properties across worlds.
  2.  **Consistency vs. Closure:** The set of positive properties must be consistent (compossible), but closure under conjunction (if P and Q are positive, P-&-Q is positive) is a stronger condition that often drives modal collapse. These must be tracked separately.
  3.  **Validity vs. Soundness:** The protocol verifies formal validity within a specified frame. It does not verify the metaphysical truth of the axioms. A valid argument with unjustified premises must be flagged via Judgment Call.

  **Dropped Distinctions:**
  1.  **Historical Fidelity:** Whether the reconstruction matches Gödel's unpublished notes exactly is irrelevant; only internal coherence matters.
  2.  **Notational Variants:** Differences between higher-order logic formulations or specific axiomatizations (e.g., Anderson vs. Gödel) are ignored unless they alter the modal force.
  3.  **Peripheral Theology:** Implications for specific religious doctrines are ignored unless they contradict the formal definitions provided in the manuscript.

  ---

  ## The Four-Pass Decision Protocol

  ### Pass One—Frame Specification
  *   **Exact Question:** Does the author explicitly specify the modal system (e.g., S5, S4, K) and justify the accessibility relation independently of the desired conclusion?
  *   **Textual Evidence Required:** A definition of the accessibility relation $R$ and a statement of the modal axioms employed (e.g., reflexivity, symmetry, transitivity).
  *   **Pass/Fail Rule:** **PASS** if the system is named and axioms are listed. **FAIL** if the system is ambiguous or axioms are invoked implicitly.
  *   **JUDGMENT CALL:** Does the justification for the frame rely on independent metaphysical argument, or is the frame selected *because* it yields the existence conclusion? If the latter, flag as **CIRCULAR FRAME SELECTION**.

  ### Pass Two—Intensional Stability Audit
  *   **Exact Question:** For every property designated "positive," is its extension stable across all worlds accessible in the author's frame, or does it shift without notice?
  *   **Textual Evidence Required:** Definitions of "positive" properties and any claims regarding their rigidity or necessity across worlds.
  *   **Pass/Fail Rule:** **PASS** if properties are defined as rigid designators or necessary conditions. **FAIL** if a property is treated as world-bound in one premise and trans-world in another (INTENSIONAL EQUIVOCATION).
  *   **JUDGMENT CALL:** If stability holds only by definitional fiat (e.g., "Positive properties are necessarily positive" without argument), record **STABILITY BY FIAT**.

  ### Pass Three—Consistency and Collapse Containment
  *   **Exact Question:** Is the set of positive properties explicitly claimed consistent, and does the model allow contingent truths once the necessary being is introduced?
  *   **Textual Evidence Required:** An axiom stating the compossibility of positive properties and a check on whether all truths become necessary (modal collapse).
  *   **Pass/Fail Rule:** **PASS** if consistency is asserted. **FAIL** if the author denies consistency or admits contradiction.
  *   **JUDGMENT CALL:** Assess whether the closure of positive properties under conjunction is legitimate. If closure forces all truths to be necessary, label this **COLLAPSE LEGITIMACY ASSESSMENT**.

  ### Pass Four—Existential Inference
  *   **Exact Question:** Does the move from "possibly, a God-like being exists" to "necessarily, a God-like being exists" depend strictly on the frame's accessibility conditions, or does it rely on an unstated existence premise?
  *   **Textual Evidence Required:** The derivation step moving from $\Diamond \exists x G(x)$ to $\Box \exists x G(x)$.
  *   **Pass/Fail Rule:** **PASS** if the derivation follows validly from the stated axioms and frame. **FAIL** if a step is missing or logically invalid.
  *   **JUDGMENT CALL:** Identify where the inference depends on an unstated existence premise (e.g., assuming existence is a positive property without prior proof). Label this **EXISTENCE PREMISE CHECK**.

  ---

  ## Application to Hypothetical Submissions

  ### Case A: Standard Gödel Reconstruction in S5
  *   **Pass One (Frame):** **PASS.** Author specifies S5. **JUDGMENT CALL:** Frame justified by appeal to metaphysical necessity standard in literature. No circularity detected.
  *   **Pass Two (Stability):** **PASS.** "Positive" defined as moral/aesthetic perfection, treated as rigid. **JUDGMENT CALL:** Stability assumed via axiom, not derived. Recorded as **STABILITY BY FIAT**, but acceptable within standard reconstruction norms.
  *   **Pass Three (Consistency/Collapse):** **PASS.** Consistency asserted. **JUDGMENT CALL:** Model exhibits modal collapse (all truths are necessary). Author acknowledges this. Assessment: **COLLAPSE LEGITIMACY ASSESSMENT** is negative; collapse is metaphysically costly.
  *   **Pass Four (Inference):** **PASS.** Derivation is valid in S5. **JUDGMENT CHECK:** Existence treated as a positive property per standard axiom.
  *   **Overall Recommendation:** **Accept with Major Revisions.** The formal logic holds, but the author must address the metaphysical cost of modal collapse identified in Pass Three.

  ### Case B: Variant with "Essential" Properties in S4
  *   **Pass One (Frame):** **PASS.** Author specifies S4 with restricted accessibility ("metaphysically nearby"). **JUDGMENT CALL:** Justification for "nearby" is vague but not explicitly circular.
  *   **Pass Two (Stability):** **FAIL.** Author treats "essential" properties as world-relative in definition but world-invariant in application. **INTENSIONAL EQUIVOCATION** recorded.
  *   **Pass Three (Consistency/Collapse):** **PASS.** Consistency claimed. **JUDGMENT CALL:** Closure limited to avoid collapse.
  *   **Pass Four (Inference):** **FAIL.** The move from possible to necessary existence fails in S4 without symmetry (B axiom). The derivation is formally invalid.
  *   **Overall Recommendation:** **Reject.** Formal invalidity in Pass Four and equivocation in Pass Two are fatal errors.

  ### Case C: Non-Standard Accessibility Avoiding Collapse
  *   **Pass One (Frame):** **PASS.** Author specifies a highly restricted, non-standard accessibility relation. Formal axioms are consistent. **JUDGMENT CALL:** The restriction is tuned solely to prevent modal collapse and lacks independent metaphysical motivation. Flagged as **CIRCULAR FRAME SELECTION**.
  *   **Pass Two (Stability):** **PASS.** Properties remain stable within the restricted frame. **JUDGMENT CALL:** Stability holds by fiat relative to the restricted set.
  *   **Pass Three (Consistency/Collapse):** **PASS.** Consistency asserted. Collapse avoided. **JUDGMENT CALL:** **COLLAPSE LEGITIMACY ASSESSMENT** is positive (collapse avoided), but only via the restricted frame.
  *   **Pass Four (Inference):** **PASS.** Derivation is valid within the constructed system. **JUDGMENT CALL:** No unstated existence premises found.
  *   **Overall Recommendation:** **Reject.** Despite passing all formal Pass/Fail checks, the **JUDGMENT CALL** in Pass One reveals the frame is ad hoc. The argument saves validity by sacrificing metaphysical plausibility. As a referee, I cannot recommend publication for a system where the logic is rigged to avoid the consequence without independent justification.

  ---

  ## Limitations and Misfires

  This procedure is a tool for formal screening, not metaphysical adjudication. Users must acknowledge the following constraints:

  1.  **Property Content:** The procedure cannot adjudicate whether omniscience, omnipotence, or any particular attribute is genuinely positive. It treats "positive" as a primitive placeholder.
  2.  **Theological Disputes:** It cannot resolve theological disputes about the nature of divinity. It only checks coherence between defined terms.
  3.  **Validity vs. Soundness:** It cannot distinguish formal validity from soundness when premises are undefined or circular beyond the scope of Pass One's Judgment Call.
  4.  **Non-Classical Logics:** The protocol will misfire on manuscripts that employ non-classical quantification, paraconsistent property logics, or undefined modal operators, all of which fall outside its scope.
  5.  **Metaphysical Commitments:** The "Judgment Call" labels explicitly require the referee to import their own theoretical commitments regarding frame justification and property closure. Two referees may apply the same protocol and reach different recommendations based on these calls.
