  Here is the breakdown of the concept you are describing, mapped against existing literature, with clear markers regarding the status of each claim.

  ### 1. Is there an established concept?

  **[SETTLED]** There is **no single established term** in health outcomes research, philosophy of science, or medical sociology that specifically names this *distributed, bidirectional* pattern of discounting testimony to protect a metric.

  **[SETTLED]** However, the *components* of this pattern are well-documented individually. You are describing a systemic emergent property that arises when three distinct epistemological mechanisms operate simultaneously in a field.

  ### 2. Relation to Nearby Concepts

  Here is how your observation maps onto existing theoretical frameworks.

  **A. The Logical Structure: Immunization Strategies**
  **[SETTLED]** In the philosophy of science (specifically Imre Lakatos's "Methodology of Scientific Research Programmes"), this is known as protecting the **"Hard Core."**
  *   **The Theory:** A research program has a "hard core" of assumptions (in your case, *the measure is valid*) that are treated as irrefutable by convention.
  *   **The Move:** When data contradicts the core, scientists adjust the **"Protective Belt"** of auxiliary hypotheses (e.g., "the patient has adapted," "the patient is depressed") to absorb the anomaly.
  *   **Relevance:** This explains the *logic* of the move. It renders the measure **unfalsifiable** **[SETTLED]**. However, Lakatos does not specifically address the *distributed* social nature of who makes these adjustments (clinicians vs. advocates).

  **B. The "Too Positive" Discount: Adaptive Preferences**
  **[SETTLED]** In welfare economics and philosophy (Amartya Sen, Martha Nussbaum), the idea that people adjust their desires to match their limited possibilities is called **"Adaptive Preferences"** (or the "happy slave" problem).
  **[CONTESTED]** In health research, it is **contested** how often this is correctly identified versus how often it is used to dismiss the resilience or differing value systems of patients. When advocates use this to discount positive reports, they are invoking adaptive preferences to claim the patient's "true" welfare is lower than their reported well-being.

  **C. The "Too Negative" Discount: Testimonial Injustice**
  **[SETTLED]** In epistemology (Miranda Fricker), **"Testimonial Injustice"** occurs when a speaker is given less credibility than they deserve due to prejudice.
  **[SETTLED]** In medicine, this is increasingly recognized as **"Medical Gaslighting"** (e.g., work by Elizabeth Collier).
  **[CONTESTED]** It is **contested** where the line lies between legitimate clinical judgment (identifying somatic symptom disorder or depression) and testimonial injustice. Clinicians argue they are diagnosing the *cause* of distress; you are observing that they are systematically locating the cause *inside the patient* rather than in the condition the measure is tracking.

  **D. The Distributed Nature: Division of Epistemic Labor**
  **[SETTLED]** Sociology of science acknowledges that knowledge production is a **"Division of Epistemic Labor."** Different actors (clinicians, researchers, advocates) have different roles.
  **[COINAGE]** What you have identified is a **pathological division of labor**. Usually, this concept is neutral or positive. There is no standard term for when this division creates a closed loop where *no* testimony can enter the system.

  ### 3. The Coinage: "Distributed Epistemic Immunity"

  Since no single term exists, I propose the following label to help you carve this out.

  **[COINAGE]** **Term:** **Distributed Epistemic Immunity (DEI)**
  **[COINAGE]** **Definition:** A systemic condition in which a metric or theory is rendered unfalsifiable not by a single actor's bias, but by a distributed network of actors applying opposing discounting rules to first-person testimony.
  *   **Direction A:** Testimony > Measure is discounted as *false consciousness* (Adaptive Preferences).
  *   **Direction B:** Testimony < Measure is discounted as *misattribution* (Testimonial Injustice/Medicalization).
  *   **Net Effect:** The Measure occupies the position of "Truth," and Testimony occupies the position of "Data to be Cleaned."

  **[COINAGE]** **Why this distinguishes it from ordinary suspicion:**
  Ordinary rigor assumes the *measure* might be wrong. DEI assumes the *testimony* is wrong. In DEI, the measure is the **invariant**, and the human experience is the **variable** to be explained away.

  ### 4. Distinguishing Rigor from Immunity

  You asked how to distinguish a field doing this from a field applying "two well-founded corrections." This is the critical practical question.

  **[SETTLED]** **Criterion 1: Pre-specification vs. Post-hoc Rationalization**
  *   **Rigor:** Criteria for discounting reports (e.g., excluding outliers, screening for cognitive impairment) are defined *before* data collection.
  *   **Immunity:** Explanations for mismatch (e.g., "they've adapted," "they're anxious") are generated *after* the mismatch is observed to save the measure.

  **[SETTLED]** **Criterion 2: Revisability of the Measure**
  *   **Rigor:** If a significant portion of reports diverge from the measure, the measure itself is flagged for validation or revision. The measure is a *hypothesis* about quality of life.
  *   **Immunity:** The divergence is treated as a problem with the *reporters*, not the *measure*. The measure is an *axiom* about quality of life.

  **[CONTESTED]** **Criterion 3: Symmetry of Burden**
  *   **Rigor:** The burden of proof is symmetric. It is equally hard to prove a "too positive" report is invalid as it is to prove a "too negative" report is invalid.
  *   **Immunity:** The burden of proof is asymmetric. In your description, the "too negative" report is medicalized (easy to discount via diagnosis), and the "too positive" report is sociologized (easy to discount via structural critique). The measure remains untouched.

  **[COINAGE]** **Criterion 4: The "Null Result" Test**
  *   **Rigor:** The field acknowledges the possibility of a "Null Result" where the measure fails to correlate with *any* stable pattern of testimony.
  *   **Immunity:** The field treats the measure as the anchor. If testimony doesn't correlate, the testimony is noise. If you cannot conceive of a pattern of testimony that would force you to discard the measure, you are operating under Distributed Epistemic Immunity.

