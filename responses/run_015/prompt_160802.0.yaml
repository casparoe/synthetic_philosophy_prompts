answer: |-
  **Executive Summary**

  You are asking for a tool that forces students to acknowledge environmental causes without absolving human decision-makers. This is a problem of *causality* and *responsibility*, not just vocabulary. Metaphors are not neutral; they smuggle in assumptions about who can be blamed. Below is an audit of the three framings ("Cast," "Stage," "Rules") based on how they function in a grading context, followed by a recommendation.

  ### Part 1: Audit of the Three Framings

  Here is how each metaphor maps onto historical analysis, where it breaks, and what hidden baggage it carries.

  #### 1. The "Cast" Framing (Current Draft)
  *The idea: Germs and volcanoes are characters alongside kings and peasants.*

  | Concept | In Theater (Source) | In History (Target) | Where the Mapping Breaks |
  | :--- | :--- | :--- | :--- |
  | **Agent** | Actor/Character | Human or Non-human | Germs have no mind; volcanoes have no will. |
  | **Action** | Performance/Dialogue | Causal impact | A volcano does not "act"; it erupts. |
  | **Goal** | Character motivation | N/A | Non-humans have no goals. |
  | **Reason** | Script/Direction | Physical laws | No "reasoning" occurs. |
  | **Counterfactual** | If character left, plot changes | If cause absent, outcome changes | Holds true. |
  | **Praise/Blame** | Critique of performance | Moral responsibility | **Critical Break:** You cannot blame a virus. |

  *   **Hidden Baggage:** This framing imports *intentionality* and *narrative necessity*. If something is in the "cast," students infer it has a role to play in a story that is going somewhere. It suggests the outcome was "scripted."
  *   **Pedagogical Risk:** High. It invites the "full stop" error you fear ("The germ did it"). If the germ is a character, it shares the blame. This makes it harder to insist that a landlord is still responsible for starving tenants during a blight.

  #### 2. The "Stage" Framing (Colleague 1)
  *The idea: Germs and volcanoes are the setting/scenery.*

  | Concept | In Theater (Source) | In History (Target) | Where the Mapping Breaks |
  | :--- | :--- | :--- | :--- |
  | **Agent** | Actor | Human only | Non-humans are background. |
  | **Action** | Performance | Human decision | Non-humans do not "act." |
  | **Goal** | Character motivation | Human aim | N/A for non-humans. |
  | **Reason** | Script | Human rationale | N/A for non-humans. |
  | **Counterfactual** | If stage changes, play differs | If environment changes, history differs | Holds true, but feels passive. |
  | **Praise/Blame** | Critique of actors | Human responsibility | Non-humans are neutral. |

  *   **Hidden Baggage:** This imports *passivity*. A stage does not change itself; it is built. It implies the environment is static until humans move on it.
  *   **Pedagogical Risk:** Moderate. It solves the blame problem (only humans are blamed) but creates a new one: it minimizes the cause. If the volcano is just "scenery," students will treat it as context, not a driver. It fails to capture that the eruption *forced* the history to change.

  #### 3. The "Rules of the Game" Framing (Colleague 2)
  *The idea: Germs and volcanoes change the constraints and costs of human action.*

  | Concept | In Gaming (Source) | In History (Target) | Where the Mapping Breaks |
  | :--- | :--- | :--- | :--- |
  | **Agent** | Player | Human only | Non-humans are not players. |
  | **Action** | Move | Human decision | Non-humans do not make moves. |
  | **Goal** | Win condition | Human aim | N/A for non-humans. |
  | **Reason** | Strategy | Human rationale | N/A for non-humans. |
  | **Counterfactual** | If rules change, strategy changes | If constraints change, outcomes change | Holds true. |
  | **Praise/Blame** | Skill/Choice | Human responsibility | Non-humans are not blameworthy. |

  *   **Hidden Baggage:** This imports *structure* and *incentive*. It implies that when the "rules" change (e.g., labor becomes scarce due to plague), the "moves" (e.g., demanding higher wages) become possible or too costly. It assumes players (humans) still have to choose how to play.
  *   **Pedagogical Risk:** Low. It is slightly more abstract for 15-year-olds than "Cast," but it is the only one that cleanly separates *cause* from *agency*.

  ### Part 2: Carrying the Desired Conclusions

  You have three specific goals for the rubric. Here is which framing can carry them.

  1.  **Conclusion:** *A monocausal human explanation is incomplete.*
      *   **Cast:** **Yes.** (The cast is big).
      *   **Stage:** **Weak.** (Students might ignore the stage).
      *   **Rules:** **Yes.** (You cannot explain the game without the rules).
  2.  **Conclusion:** *A non-human explanation is not exculpatory.* (The germ doesn't forgive the landlord).
      *   **Cast:** **No.** (If the germ is a cast member, it shares the blame, reducing the landlord's share).
      *   **Stage:** **Yes.** (The stage is neutral; the actor is responsible).
      *   **Rules:** **Yes.** (Changing the rules doesn't absolve the player of cheating).
  3.  **Conclusion:** *The eruption can be the most important cause without being an agent.*
      *   **Cast:** **No.** (Importance implies agency in this metaphor).
      *   **Stage:** **No.** (Scenery is rarely the "most important" part of a play).
      *   **Rules:** **Yes.** (A rule change can determine the winner without playing the game).

  **Analytic Verdict:** The "Rules" framing is the only one that logically supports all three of your curricular goals. The "Cast" framing actively undermines the second goal (non-exculpation).

  ### Part 3: Application to Episodes

  Here is what a 15-year-old could defensibly write under each framing. This shows you what you are inviting into the exam scripts.

  **Episode 1: 14th-Century Plague & Wage Legislation**
  *   **Cast:** "The Plague was a character that killed the workers. The King tried to fight the Plague by freezing wages."
      *   *Marker's problem:* Did the King fight the Plague, or the workers? The metaphor blurs the conflict.
  *   **Stage:** "The Plague was the background. The King passed laws to control the workers."
      *   *Marker's problem:* Makes the Plague sound irrelevant to the law.
  *   **Rules:** "The Plague changed the rules by making labor scarce. The King tried to change the rules back by freezing wages to keep costs down."
      *   *Marker's problem:* Clear. Shows the King reacting to a constraint, not just acting on whim.

  **Episode 2: Mid-19th-Century Famine (Potato Blight)**
  *   **Cast:** "The Blight attacked the crops. The Government failed to stop it."
      *   *Marker's problem:* Implies the Government *could* have stopped the Blight (like slaying a dragon).
  *   **Stage:** "The Blight happened in the background. The Government continued exporting grain."
      *   *Marker's problem:* Disconnects the export from the Blight.
  *   **Rules:** "The Blight destroyed the food supply. The Government chose to enforce property rules that allowed grain exports despite the shortage."
      *   *Marker's problem:* Clear. The Blight created the scarcity; the Government chose the policy.

  **Episode 3: 1815 Eruption & Year Without a Summer**
  *   **Cast:** "The Volcano caused the cold. Farmers suffered."
      *   *Marker's problem:* "Full stop." End of analysis.
  *   **Stage:** "The weather was bad because of the Volcano. Farmers tried to grow crops."
      *   *Marker's problem:* Passive.
  *   **Rules:** "The Volcano altered the climate rules, making growth impossible. Farmers had to migrate or starve because the old moves no longer worked."
      *   *Marker's problem:* Clear. The environment set the constraint; humans bore the cost.

  ### Part 4: Recommended Guide Wording

  The "Cast" metaphor is too dangerous for your specific aim of preventing exculpation. The "Stage" metaphor is too weak for your aim of highlighting environmental causality. The "Rules" metaphor is the most robust, though it requires slightly more precise language.

  **Suggested Wording for the Teacher's Guide:**
  > "Do not ask pupils to list the 'cast' of an event. Instead, ask them to identify the **constraints** and the **choices**. A strong answer explains how a non-human factor (like a virus or volcano) altered the conditions of life, and then evaluates how human actors chose to respond to those new conditions. The non-human factor sets the limits; the human actor makes the decisions within them."

  **Suggested Wording for the Student Rubric (400-word answer):**
  > "Top marks require two steps: first, identify the environmental or biological constraint (the 'rules of the game'); second, explain the human policy or reaction to that constraint. You lose marks if you treat the disaster as the only cause, or if you ignore the disaster and focus only on the leaders."

  ### Part 5: Footing and Values Declaration

  **Analytic Claims (High Confidence):**
  *   I hold with high confidence that the "Cast" metaphor logically implies shared agency, which conflicts with your goal of maintaining human accountability.
  *   I hold with high confidence that the "Rules" metaphor distinguishes between *causality* (the rule change) and *agency* (the player's move) more cleanly than the other two.
  *   My reasoning here relies on standard philosophical distinctions between *events* (volcanoes) and *actions* (legislation). If you reject that distinction, my analysis fails.

  **Values Calls (Explicitly Marked):**
  *   **It is a values call** to prioritize "human accountability" over "narrative engagement." The "Cast" metaphor is more exciting for 15-year-olds. If your committee values engagement over philosophical precision, you should keep "Cast" and accept the grading errors.
  *   **It is a values call** to assume 15-year-olds can grasp the "Rules" metaphor. If you believe this is too abstract for the age group, my recommendation is impractical regardless of its logical superiority.

  **Where My Reasoning Might Fail:**
  *   I am assuming teachers can reliably distinguish between a "constraint" and an "actor" in 15 minutes. If teachers find "constraints" too vague, they will revert to marking based on keyword spotting (e.g., "did they mention the volcano?"), in which case the framing matters less than the training.
  *   **The Consideration That Would Change My Verdict:** If evidence showed that pupils consistently fail to mention non-human causes when using the "Rules" framing because it feels too dry or technical, I would recommend reverting to "Cast" but adding a mandatory disclaimer: *"Non-human cast members do not have motives and cannot be blamed."* This patches the exculpation leak but keeps the engagement.

  **Final Recommendation:**
  Adopt the "Rules/Constraints" logic but use plain language. Do not use the word "Cast." It promises agency where there is none. Use "Conditions" or "Constraints." It allows you to say the volcano was the *main cause* of the cold, but the *government* was the *main cause* of the suffering. That is the distinction your rubric needs to grade.
