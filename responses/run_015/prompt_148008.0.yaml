answer: |-
  The democratic Republic of Veridia operated a compulsory boarding school system from 1950 to 1964 designed to eradicate the indigenous Kelnish language, punishing children for speaking it and severing intergenerational transmission; the policy ended sixty years ago, the last direct survivor died five years ago, and while state archives confirm the intent was cultural erasure, the present-day descendants of the victims are fully integrated, prosperous citizens who speak only the state language, suffer no material disadvantage, hold no legal disabilities, and have formed no political organization seeking redress or recognition.

  On the optimal expressive account, the state is required to apologize because the moral standing of the victims was violated irrespective of present consequences; the apology functions as a truth-act that corrects the historical record and acknowledges the inherent worth of those who were treated as means to an end, fulfilling a duty of recognition that survives the victims' deaths. On the optimal closure-sensitive reparative account, the state is impermissibly wrong to apologize because an apology is a performative act aimed at restoring moral equilibrium between wrongdoer and victim; since the language is extinct and the loss irreparable, no equilibrium is possible, and offering an apology falsely signals that the moral debt is settled or that the relationship is normalized when it remains fundamentally broken. The structural feature forcing this apart is **Non-Remedial Moral Timestamping**: the apology serves to record the wrong in historical memory (timestamping) without altering present entitlements or reopening a live claim (non-remedial). The expressive view values the timestamp itself as a moral good, while the reparative view rejects a timestamp that implies a closure it cannot deliver. If this feature is removed—for instance, if the apology were bundled with substantial funding to revive the language—the reparative account would agree the apology is permissible, as the act now contributes to genuine moral restoration rather than simulating it. A defender of the reparative account attacks the expressive verdict by arguing that treating apologies as free-standing moral records fetishizes the speech act, risking the trivialization of irreversible harms by suggesting they can be "addressed" without material change; conversely, the expressive defender attacks the reparative verdict by arguing that making truth-telling contingent on utility allows the state to remain silent about its crimes simply because the victims are too dead to demand payment, prioritizing social comfort over moral honesty.

  Verdict: Non-Remedial Moral Timestamping
