answer: |-
  **MEMORANDUM OF PROCEDURE: COMPOUND MOTIONS & VOTING STRUCTURE**  
  **TO:** Committee Chairs, Faculty Senate  
  **FROM:** Office of the Parliamentarian  
  **SUBJECT:** Protocol for Multi-Part Decisions (The "Premise-Conclusion" Rule)

  **1. THE GOLDEN RULE: ORDER OF OPERATIONS**  
  Always vote on **Premises** (criteria, facts, conditions) *before* voting on the **Conclusion** (the final motion).  
  *Why:* Voting the conclusion first renders premise votes advisory only, inviting accusations of post-hoc rationalization.  
  *Exception:* If the conclusion is a simple "Up/Down" without stated criteria, skip to Section 3.

  **2. CLASSIFY YOUR COMMITTEE**  
  Before voting, the Chair must declare the committee's logical structure. This determines which vote prevails if they conflict.

  *   **TYPE A: Rubric-Bound (Promotion, Curriculum, Grievance)**  
      *   *Logic:* Premises are *constitutive*. If criteria are met, the conclusion *should* follow.  
      *   *Conflict Rule:* If Premises pass (e.g., Research/Teaching/Service = Yes) but Conclusion fails (Tenure = No), the **Conclusion Prevails**. The motion fails.  
      *   *Requirement:* The Minutes must explicitly record: *"Criteria met, but motion failed by direct vote."* This protects the committee from appeals claiming rule violations while preserving the body's sovereign right to reject.
  *   **TYPE B: Discretionary (Naming, Resolutions, Policy)**  
      *   *Logic:* Premises are *advisory*. Members may weigh factors differently.  
      *   *Conflict Rule:* If Premises pass (e.g., Conduct Condemnable = Yes) but Conclusion fails (Remove Name = No), the **Conclusion Prevails**.  
      *   *Requirement:* No justification required beyond the vote count, but dissenting opinions on premises should be recorded.

  **3. THE "SAFE HARBOR" FOR MINUTES**  
  To survive appeal or public scrutiny, the Minutes must capture three data points for compound motions:  
  1.  The vote count on each Premise.  
  2.  The vote count on the Conclusion.  
  3.  The Committee Type (A or B) declared at the start of the vote.  
  *If these are not recorded, the vote is procedurally void.*

  **4. JUDGMENT CALLS (Chair's Discretion)**  
  No rule can automate the following. The Chair must decide and record the rationale:  
  *   **Agenda Setting:** Which premises are voted on? (Excluding a premise effectively vetoes the conclusion).  
  *   **Competence:** If a member recuses themselves from a premise (e.g., "I cannot judge research quality"), do they vote on the conclusion? (Recommendation: Yes, provided quorum holds).  
  *   **Reason-Giving:** Is the body answerable for its reasons (Type A) or only its decisions (Type B)? (See Section 2).

  **5. WARNING: THE INCONSISTENCY CLAUSE**  
  *Read Aloud at Start of Meeting:* "Faculty Senate procedure prioritizes the sovereignty of the final vote over logical consistency. It is possible for a majority to affirm all criteria yet reject the motion. This is not a counting error; it is a feature of collective judgment. We record the discrepancy; we do not adjudicate it."

  ***

  ### PARLIAMENTARIAN'S COMMENTARY & SCENARIO RUN-THROUGH

  **The Theoretical Constraint**  
  You know the List & Pettit impossibility theorem. You cannot have Anonymity, Systematicity, and Consistency simultaneously without a dictator. This procedure sacrifices **Consistency** to preserve **Sovereignty** (the right of the body to say "No" even when the math says "Yes"). This is the only way to avoid a "veto group" (e.g., if Premises prevailed, a minority could block tenure by failing one criterion even if the majority wanted to grant it).

  **Scenario 1: Promotion (Type A: Rubric-Bound)**  
  *   *Structure:* Research (Y/N), Teaching (Y/N), Service (Y/N) $\rightarrow$ Tenure (Y/N).  
  *   *Procedure:* Vote R, T, S first. All pass. Vote Tenure. Fails.  
  *   *Outcome:* Tenure Denied.  
  *   *Record:* "Criteria met; Motion Failed."  
  *   *Risk:* Candidate appeals claiming "Criteria were binding." The Minutes protect you by showing the Committee exercised sovereign discretion allowed under Type A rules.

  **Scenario 2: Curriculum (Type A: Rubric-Bound)**  
  *   *Structure:* Majors Need It? (Y/N) + Can We Staff It? (Y/N) $\rightarrow$ Adopt Requirement (Y/N).  
  *   *Procedure:* Vote Needs, Staffing. If either fails, the logical outcome is "No."  
  *   *Conflict:* If both pass, but Adopt fails.  
  *   *Outcome:* Requirement Rejected.  
  *   *Risk:* Wasted time. If the body knows it will vote "No" on adoption regardless of staffing, voting premises first is theater.  
  *   *Chair's Judgment:* If the outcome is politically foregone, Chair may move to vote Conclusion first to save time, noting "Premises waived for efficiency."

  **Scenario 3: Naming/Removal (Type B: Discretionary)**  
  *   *Structure:* Historical Claim (Y/N) + Condemnable by Standards of Time (Y/N) + Proportionate (Y/N) $\rightarrow$ Remove Name (Y/N).  
  *   *Procedure:* Vote premises. All pass. Vote Removal. Fails (perhaps due to donor relations concerns not captured in premises).  
  *   *Outcome:* Name Stays.  
  *   *Risk:* Student newspaper headline: *"Faculty Admits Condemnable Conduct, Keeps Name."*  
  *   *Defense:* The procedure explicitly allows Type B bodies to weigh unstated factors (e.g., legal cost, alumni backlash) in the Conclusion vote. The Minutes show the vote was procedural, not moral.

  **The "Answer You Won't Like"**  
  Here is the case where this procedure bites you:  
  **The Promotion Paradox.** A candidate meets all three criteria (Research, Teaching, Service) by majority vote. Logically, they deserve tenure. However, the committee votes "No" on Tenure. Under this protocol, **Tenure is Denied.**  
  *Why you won't like it:* It validates irrationality. It allows a committee to say "You did everything we asked, but we still reject you," without providing a reason that can be voted on.  
  *Why it's necessary:* If you enforce the Premises (i.e., Criteria Met = Automatic Tenure), you strip the Faculty Senate of its ultimate authority and turn them into a calculator. A human body must retain the right to be wrong, or to act on tacit knowledge not captured in the rubric. The "appeal survival" comes from the transparency of the discrepancy, not the logical purity of the outcome.

  **Final Instruction to Chairs:**  
  When the votes contradict, do not try to fix it. Do not retake the vote. Do not ask members to "explain themselves." Record the contradiction, adjourn, and let the Minutes bear the weight. Consistency is for logicians; governance is for humans.
