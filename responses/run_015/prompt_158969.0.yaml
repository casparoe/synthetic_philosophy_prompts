  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy Professor turned Faculty Senate Parliamentarian. Understands logic, voting theory (implicitly referencing the Doctrinal Paradox/Discursive Dilemma), and academic bureaucracy.
      *   **Task:** Create a one-page procedural guide for committee chairs to handle complex voting structures (compound questions vs. atomic questions).
      *   **Constraints:** One page, no software, must survive administrative appeal and public scrutiny, must address the "Doctrinal Paradox" (inconsistency between premise-based and conclusion-based voting), must cover three specific scenarios (Promotion, Curriculum, Naming), must admit limitations (where judgment calls are needed).
      *   **Tone:** Professional, precise, pragmatic, philosophically informed but accessible to non-experts.
      *   **Key Problem:** The "Doctrinal Paradox" (List & Pettit). If you vote on premises $P$ and $Q$, you might get $P$ (Yes), $Q$ (Yes), therefore Conclusion $C$ (Yes). But if you vote directly on $C$, you might get $C$ (No). Who wins? The premises or the conclusion?

  2.  **Deconstruct the Voting Theory Problem:**
      *   *Premise-Based Procedure (PBP):* Vote on criteria, derive outcome. Good for consistency and reason-giving. Bad if the majority on the conclusion disagrees with the derived outcome (as in the user's promotion example).
      *   *Conclusion-Based Procedure (CBP):* Vote on outcome directly. Good for respecting the final will of the majority. Bad for opacity and potential inconsistency (voting Yes on criteria but No on outcome without explanation).
      *   *The User's Example:* Promotion committee voted Yes on Research, Teaching, Service (3/3), but would have voted No on Tenure. This is a classic Doctrinal Paradox. The majority on the *conclusion* (Tenure) differs from the logical conjunction of the majorities on the *premises*.
      *   *Impossibility Theorem:* List & Pettit show you can't have Anonymity, Systematicity, and Consistency simultaneously in all cases without a dictator or veto power. I need to acknowledge this honestly.

  3.  **Drafting the Procedure (The "One-Page" Challenge):**
      *   *Header:* Clear title, authority.
      *   *Core Principle:* Need a default rule. In academic contexts, *reason-giving* is usually paramount (unlike a legislature). Therefore, Premise-Based is usually better for Promotion/Curriculum, but Conclusion-Based might be better for Political/Symbolic acts (Naming).
      *   *The "Tie-Breaker":* When they conflict, which prevails?
          *   Option A: Always Premises. (Risk: Overriding the clear will of the body on the final outcome).
          *   Option B: Always Conclusion. (Risk: Ignoring established criteria).
          *   Option C: Hierarchy based on Committee Type. (Best fit).
      *   *Order of Voting:* Premises first, then Conclusion. Why? Because voting the conclusion first preempts the reasoning.
      *   *Handling Disagreement:* If Premises say Yes, Conclusion says No -> The motion fails, *but* the record must show the discrepancy. This protects against "cheating" accusations.
      *   *Judgment Calls:* Agenda setting, competence, reason-giving requirements.

  4.  **Developing the Three Scenarios:**
      *   *Promotion (Tenure):* High stakes, rule-bound. Needs consistency. *Verdict:* Premise-Based is default. If criteria met, tenure *should* be granted unless there's a supermajority override. Actually, in the user's example, the criteria were met but tenure failed. This suggests the "Conclusion" (Tenure) is the sovereign vote. *Correction:* In tenure, usually the criteria are *necessary* but not *sufficient*. So, Criteria Yes + Tenure No = No Tenure. This is logically consistent (Conjunction). The paradox arises if Criteria Yes + Tenure No, but the rules say Criteria Yes *implies* Tenure Yes. I need to clarify the logical connective. Is it AND? Is it Weighted? Let's assume AND for simplicity in the guide, but acknowledge the "Sufficient vs. Necessary" distinction.
      *   *Curriculum (Data Science):* Practical constraints. Majors need it? (Yes/No). Can we staff it? (Yes/No). If both Yes -> Adopt. If one No -> Reject. Here, the conclusion is logically dependent. Voting Conclusion first is irresponsible. *Verdict:* Premise-Based.
      *   *Naming (Removal):* Moral/Historical judgment. Historical claim? Condemnable? Proportionate? This is highly subjective. A member might agree it was condemnable but disagree on proportionality. *Verdict:* Conclusion-Based (sovereign judgment), but Premises recorded for history.

  5.  **Addressing the Impossibility Theorem:**
      *   I must explicitly state: "No voting system guarantees a consistent majority on every proposition without granting veto power or prioritizing one type of vote."
      *   The procedure prioritizes *Transparency* over *Consistency*. If the votes conflict, we record the conflict rather than hiding it.

  6.  **Refining the "One Page" Content:**
      *   Need to be concise. Use bolding for actionable items.
      *   Section 1: The Golden Rule (Premises before Conclusions).
      *   Section 2: The Conflict Protocol (What happens when they disagree).
      *   Section 3: Committee Specifics (The three cases).
      *   Section 4: The "Hard Truths" (Impossibility & Judgment).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* The user said "Last year... all three came out yes, and the up-or-down tenure vote would have been no." This implies the committee *did* vote on premises and conclusion, and they conflicted. The user wants to prevent the *appearance* of cheating.
      *   *Fix:* The procedure must mandate that if the logical outcome of the premises differs from the direct vote, the *Direct Vote* decides the action, but the *Premise Vote* dictates the written justification. Wait, no. If the rules say "Meet criteria = Tenure," then voting No on Tenure is a violation of rules. If the rules say "Criteria are advisory," then Tenure vote wins.
      *   *Decision:* I will advise the Parliamentarian to distinguish between *Constitutive Rules* (Criteria determine outcome) and *Advisory Criteria* (Criteria inform outcome).
      *   *Actually, simpler approach:* Adopt a "Premise-Primacy" rule for technical/rubric committees (Promotion, Curriculum) and "Conclusion-Primacy" for discretionary committees (Naming). This solves the inconsistency by categorizing the committee type.
      *   *Wait, the Impossibility Theorem:* Even with categorization, within a category, the paradox can exist. I need to admit that sometimes the majority will be irrational. The solution is *Recording the Paradox*.
      *   *Revised Plan:*
          1.  Vote Order: Premises first.
