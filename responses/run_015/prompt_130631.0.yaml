  Based on the verdicts you've described, your friend is operating on a strict **Kantian Indirect Duty** framework, but with a specific emphasis on the *maxim* (the principle behind the action) rather than the empirical consequences on the agent's character.

  Here is the breakdown of what she will say, the rule she is following, and the test case that proves it.

  ### 1. The Verdict on the Sealed Facility
  **She will say it is Wrong.**

  Even though the scenario stipulates that no human character is affected and no one witnesses the cruelty, she will condemn the facility. The "sealed" nature and the "unaffected owners" are irrelevant to her moral calculus because, for a Kantian, morality resides in the **rational will**, not in psychological side-effects or social reputation.

  By setting up the facility, the owners have adopted a **maxim** (a subjective principle of action) that says: *"I will institute extreme suffering for sentient beings to maximize economic efficiency, provided I do not have to witness it."*

  To your friend, the wrongness isn't that the owners become bad people (the empirical consequence); it's that the *will* that chose this maxim is already corrupt. The secrecy doesn't purify the will; it just hides the corruption.

  ### 2. The Rule She Is Running
  Her verdicts commit her to the following principle:

  > **"One has a duty to oneself to not act on maxims that treat the expression of suffering in human-analogous beings as a mere means, regardless of whether the suffering is real or simulated, and regardless of visibility."**

  This rule explains her existing verdicts:
  *   **Kicking dog / Shampoo testing:** Violates the maxim (wanton cruelty/disproportionate pain).
  *   **Medical experiments / Draft horses:** Permissible maxims (pain is a side effect of a necessary human end, not the end itself).
  *   **Stepping on ants:** Ants lack the *analogy* to humanity required to trigger the duty.
  *   **Poking the AI:** This is the key. The AI feels nothing. The wrongness is entirely in the **agent's willingness to torment a thing that mimics a human victim.** This proves she cares more about the *form of the action* than the *ontological status of the victim*.

  ### 3. The One Extra Case to Distinguish the Rules
  To distinguish whether she is motivated by **Actual Sentience** (the animal's experience) or **Symbolic Analogy** (the human's act), propose this case:

  **The "Philosophical Zombie Farm"**
  > Imagine a facility identical to the sealed one, but the animals are biologically engineered "zombies." They scream, bleed, and run from pain exactly like real cows, but they have **no inner experience**. They feel absolutely nothing. The owners know this. The meat feeds the poor. No humans are psychologically harmed.

  **How this tells the rules apart:**
  *   **If she says it is Wrong:** She is consistent with her **AI Chatbot verdict**. The wrongness lies in the *act of tormenting a human-analog*, even if no suffering occurs. This confirms her rule is about the **corruption of the human will** via symbolic cruelty.
  *   **If she says it is Okay:** She prioritizes **Actual Sentience** over Analogy. This would imply her AI verdict was a special case about *mocking human language specifically*, rather than a general rule about cruelty. It would suggest the Sealed Facility is wrong *only* because the animals actually suffer, not because of the maxim itself.

  ### 4. The Closest Analog
  The **AI Chatbot** case is the closest analog to the "Zombie Farm" test.

  **Why it cuts the right way:**
  In the Chatbot case, there is **No Suffering + High Analogy** (language), and she ruled it **Wrong**.
  In the Zombie Farm case, there is **No Suffering + High Analogy** (behavior/biology), and the verdict should match.

  If she condemns the Chatbot for "pretend cruelty," she must condemn the Zombie Farm for "pretend cruelty." If she condemns the Zombie Farm, she must condemn the Real Sealed Facility *a fortiori* (all the more so). The Chatbot verdict is the "smoking gun" that proves she views the **agent's maxim** as the locus of moral value, not the victim's state. The Sealed Facility tries to remove the *consequences* of the maxim (character damage), but the Chatbot verdict proves the *adoption* of the maxim is sufficient for wrongness.
