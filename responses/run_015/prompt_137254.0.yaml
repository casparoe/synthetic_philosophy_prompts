answer: |-
  Here are ten desiderata for an account of "harm to others" suitable for evaluating speech codes and moderation rules. They are designed to stress-test theories against the specific cases you provided, forcing clarity on where the political smuggling occurs.

  ### The Desiderata

  1.  **The Offense/Harm Boundary**
      *   **Requirement:** The account must distinguish between visceral disgust and setbacks to legitimate interests.
      *   **Case:** *The disgusting billboard.*
      *   **Reasoning:** If mere psychological discomfort counts as harm, the Harm Principle licenses censorship of almost all controversial art or politics. The theory must explain why feeling sickened isn't the same as being harmed, without simply asserting it.

  2.  **The Intermediary Agency Condition**
      *   **Requirement:** The account must specify whether harm flows through the free choices of third parties.
      *   **Case:** *Employability via bigotry.*
      *   **Reasoning:** If employers refuse to hire based on speech, is the speaker the harmer or the employer? A robust account must decide if listener volition breaks the causal chain. If it doesn't, speakers are liable for the prejudices of others; if it does, hate speech regulations lose their footing.

  3.  **The Consent Waiver Clause**
      *   **Requirement:** The account must determine if actively seeking out content negates a harm claim.
      *   **Case:** *Pro-ana content.*
      *   **Reasoning:** The Harm Principle protects others, not selves. If users seek this content, is the platform harming them? The theory must clarify if facilitating voluntary self-destruction counts as harming "others" (e.g., by normalizing the behavior for non-consenting viewers).

  4.  **The Aggregation Threshold**
      *   **Requirement:** The account must decide if negligible individual risks sum to harm.
      *   **Case:** *False vaccination claims.*
      *   **Reasoning:** One lie doesn't kill; millions might. A usable theory must explain how a speech act that changes probability by 0.0001% contributes to a concrete harm. Does harm require a substantial contribution, or is any contribution enough?

  5.  **The Victim Identifiability Rule**
      *   **Requirement:** The account must state whether harm requires a nameable victim.
      *   **Case:** *False vaccination claims.*
      *   **Reasoning:** If deaths occur downstream but no specific death can be traced to the specific post, did harm occur? Statistical harm must be reconciled with the liberal preference for identifiable victims in rights violations.

  6.  **The Status/Welfare Distinction**
      *   **Requirement:** The account must take a stand on whether social standing is an interest distinct from welfare.
      *   **Case:** *Speech lowering group standing.*
      *   **Reasoning:** If welfare (income, health) is unchanged but status is lowered, is there harm? Welfare-based theories say no; subordination theories say yes. The account cannot hedge here; it must define the currency of harm.

  7.  **The Institutional Baseline**
      *   **Requirement:** The account must specify whether harm is measured against actual conditions or just institutions.
      *   **Case:** *State protection failure.*
      *   **Reasoning:** If speech triggers violence only because the state fails to protect the target, is the speech the harm? If the baseline is a just state, the speech is innocent; if the baseline is reality, the speech is dangerous. This determines who bears the cost of state failure.

  8.  **The Counterfactual Dependence Test**
      *   **Requirement:** The account must decide if harm requires changing the outcome.
      *   **Case:** *Counterfactual silencing.*
      *   **Reasoning:** If silencing a speaker changes nothing because someone else posts the same content, was harm prevented? Theories must choose between "outcome responsibility" (did you change the world?) and "conduct responsibility" (did you try to harm?).

  9.  **The Causal Horizon**
      *   **Requirement:** The account must set a temporal limit on downstream consequences.
      *   **Case:** *Vaccination deaths.*
      *   **Reasoning:** Speech effects ripple indefinitely. Without a horizon (e.g., immediate violence vs. cultural shift over decades), every speech act is potentially harmful. The theory must define the cutoff for relevance.

  10. **The Administrative Tractability Requirement**
      *   **Requirement:** The account must be applicable by a moderator without exhaustive empirical inquiry.
      *   **Case:** *All cases (Moderation context).*
      *   **Reasoning:** A theory requiring complex causal modeling or counterfactual history is useless for a platform deciding in five minutes. If the theory of harm is metaphysically deep, it fails the institutional design test.

  ### Analysis of Requirements

  **Non-Negotiable vs. Camp Preferences**
  *   **Non-Negotiable:** *The Offense/Harm Boundary* (1) and *Administrative Tractability* (10). Without (1), free speech is extinguished by sensitivity; without (10), the theory cannot function in the institutional contexts you are grading.
  *   **Camp Preferences:** *The Status/Welfare Distinction* (6) and *The Institutional Baseline* (7). Liberals typically demand welfare setbacks and actual baselines; critical theorists demand status protection and just baselines. *The Intermediary Agency Condition* (2) is also a splitter: libertarians demand listeners be responsible for their reactions; regulators often treat listeners as vulnerable to manipulation.

  **The Impossible Tension**
  *   **Tractability (10) vs. Aggregation/Counterfactuals (4, 8).** You cannot jointly satisfy the demand for a theory that captures diffuse, probabilistic, counterfactual harms *and* the demand that a human moderator apply it in five minutes. Calculating aggregate risk or counterfactual silence requires data science, not rulebooks. A theory that gets the philosophy right will fail the moderation test; a theory that passes the moderation test will likely oversimplify the harm.

  **Scoring Candidate Accounts**

  | Account Type | Welfare-Setback | Rights/Sovereignty | Equal-Standing/Subordination |
  | :--- | :---: | :---: | :---: |
  | **1. Offense Boundary** | Fail (often counts offense) | Pass | Pass |
  | **2. Intermediary Agency** | Fail (welfare set back) | Pass (listener autonomy) | Fail (subordination occurs) |
  | **3. Consent Waiver** | Pass | Pass | Fail (harm is structural) |
  | **4. Aggregation** | Pass | Fail (rights are individual) | Pass |
  | **5. Victim ID** | Fail (statistical ok) | Pass (specific victim) | Fail (group harm) |
  | **6. Status/Welfare** | Fail (status ignored) | Pass (rights focus) | Pass |
  | **7. Inst. Baseline** | Fail (actual outcomes) | Pass (ideal rights) | Fail (actual hierarchy) |
  | **8. Counterfactual** | Fail (risk counts) | Pass (violation counts) | Fail (expression counts) |
  | **9. Causal Horizon** | Fail (open-ended) | Pass (proximate) | Fail (historical) |
  | **10. Tractability** | Fail (empirical heavy) | Pass (rule-based) | Fail (context heavy) |

  **The Single Theory Killer**
  The **Intermediary Agency Condition (2)** knocks out the most candidate accounts. It forces a binary choice on the mechanism of hate speech and inflammatory rhetoric. Welfare theories usually fail it (because welfare is objectively set back regardless of listener choice). Subordination theories usually fail it (because subordination is effected *through* the audience's uptake). Only Rights/Sovereignty theories consistently pass it (because they treat listeners as autonomous agents responsible for their own reactions). This requirement exposes the fundamental incompatibility between holding speakers responsible for listener reactions and maintaining a commitment to listener autonomy.

  \answer{The Intermediary Agency Condition}
