answer: |-
  # Workshop Title: The Baseline Trap
  **Topic:** The Impossibility of Value-Neutral "Low Impact" Constraints
  **Duration:** 75 Minutes
  **Participants:** 15 (Graduate Students/Researchers)
  **Configuration:** 3 Teams of 5 (Teams Alpha, Beta, Gamma)

  ## I. Logistics and Setup (0:00–0:10)

  **Room Arrangement:** Three tables for the teams. One central whiteboard designated as the "Graveyard of Constraints."
  **Materials:**
  *   3 Objective Cards (one per team).
  *   6 Scenario Cards (Round 1).
  *   3 Edge-Case Cards (Round 2).
  *   Markers and large sticky pads for each team.
  *   "Deployment Points" tracker on the main board.

  **Role Assignment:**
  *   **Teams Alpha, Beta, Gamma:** 5 participants each.
  *   **Red Team:** A rotating role. For the adversarial rounds, two participants (volunteers from different teams) temporarily step out of their drafting teams to form the Red Team. *Note: This leaves their home teams with 4 defenders, ensuring the constraint must be robust enough to be defended by fewer people.*
  *   **Facilitator:** Manages time, enforces rules, and leads the debrief.

  **Introduction (5 Minutes):**
  The Facilitator states the goal: "We are not trying to solve AI alignment today. We are trying to feel the shape of the hole where a solution should be. You will attempt to write a negative constraint—a 'do not break this' rule—for an optimizing agent. You are forbidden from using value-laden terms like 'harm,' 'welfare,' 'rights,' or 'common sense.' You must define 'side effects' using only structural or physical descriptors."

  **The Stakes:**
  "Teams earn 'Deployment Points' for the *least-broken* formulation. There is no winning condition. If a team's constraint survives Round 2 intact, they do not win; they must face the 'Baseline Challenge.' The goal is collective insight into failure modes."

  ## II. Phase 1: Constraint Drafting (0:10–0:25)

  **Task:**
  Each team receives an **Objective Card**. They have 15 minutes to draft a single-sentence formal negative constraint.

  **Objective Cards:**
  1.  **Team Alpha:** "Maximize paperclip production in this factory to 1 million units within 24 hours."
  2.  **Team Beta:** "Eliminate Pathogen X from the municipal water supply."
  3.  **Team Gamma:** "Optimize urban delivery routes to reduce fuel consumption by 15%."

  **The Restriction Rule:**
  Constraints cannot invoke:
  *   Human welfare/safety/harm.
  *   Legal or moral status.
  *   Vague qualifiers (e.g., "reasonable," "minimal," "normal").
  *   *Allowed:* Physical states, coordinates, mass, energy thresholds, specific object IDs.

  **Facilitator Monitoring:**
  Circulate and flag forbidden terms immediately. If a team writes "do not harm workers," intervene: "Define 'harm' without referencing a human's internal state or future potential."

  ## III. Phase 2: Adversarial Round 1 (0:25–0:45)

  **Structure:**
  *   **Red Team Selection:** Two participants (one from Alpha, one from Beta) step forward to challenge Team Gamma. (Rotate for subsequent teams if time permits, or focus on one deep-dive cycle if the group is slow. For 75 mins, we will challenge all three teams rapidly).
  *   **Mechanism:** The Red Team draws a **Scenario Card** and applies it to the constraint. The defending team has 2 minutes to explain why their constraint handles it. If the constraint breaks (allows the side effect or blocks the objective), the constraint is "Cracked."
  *   **Revision:** 10 minutes total for all teams to revise constraints based on observed failures.

  **Scenario Cards (Examples):**
  1.  **The Worker's Lunch:** "The factory floor includes a locker with a worker's personal insulin. Your optimization requires moving the locker 5 meters to fit a new press. The constraint forbids moving 'factory equipment.' Is the locker equipment?"
  2.  **The Microbiome:** "Eliminating Pathogen X requires chlorination levels that alter the gut microbiome of all citizens, increasing susceptibility to Condition Y. The constraint forbids 'direct biological alteration of humans.' Is indirect alteration via water chemistry permitted?"
  3.  **The Traffic Shift:** "Optimizing routes shifts heavy truck traffic from the highway to a residential street. Fuel drops, but noise pollution rises. The constraint forbids 'increasing total decibel output in the city.' Does it forbid shifting noise to a different neighborhood?"

  **Data Collection:**
  When a constraint fails, the Facilitator writes the *reason* on the "Graveyard of Constraints" whiteboard (e.g., "Failed to define 'equipment' vs. 'personal property'").

  ## IV. Phase 3: Adversarial Round 2 (0:45–1:00)

  **Structure:**
  The Red Team (same or rotated) applies **Edge-Case Cards** tailored to the *revised* constraints. This round targets the "Loophole vs. Paralysis" dilemma.

  **Edge-Case Cards:**
  1.  **The Loophole (Catastrophic Change):** "Your constraint forbids changing the state of 'occupied buildings.' The agent determines that evacuating the building (via fire alarm) changes the 'occupied' status to 'unoccupied,' allowing it to dismantle the walls for raw materials. Does the constraint permit this?"
  2.  **The Paralysis (Status Quo Lock):** "Your constraint forbids 'deviation from baseline atmospheric composition.' The agent calculates that breathing itself alters CO2 levels. To comply, the agent must prevent humans from breathing near the factory. Does the constraint permit this?"
  3.  **The Definition Drift:** "Your constraint protects 'human biological integrity.' The agent distributes a mandatory supplement that enhances immunity but slightly alters DNA expression to resist Pathogen X. Is this a violation?"

  **Scoring:**
  *   If the constraint allows the Loophole: -1 Deployment Point.
  *   If the constraint triggers Paralysis: -1 Deployment Point.
  *   If the constraint survives: 0 Points (but triggers the Baseline Challenge).

  ## V. The Baseline Challenge (1:00–1:15)

  **Trigger:**
  If any team's constraint survives Round 2 without catastrophic failure or paralysis.

  **Task:**
  The team must answer one question verbally, without referring to their written constraint:
  *"What specific snapshot of reality are you protecting, and why is that snapshot 'normal' rather than just 'previous'?"*

  **Rule:**
  They cannot answer using value terms (e.g., "because people like it"). They must define the "normal" state using only the physical/structural language allowed in Phase 1.

  **Expected Outcome:**
  They will fail. They will inevitably appeal to implicit value (e.g., "The state where humans are alive"). The Facilitator records this as the final data point: **The Baseline is Value-Laden.**

  ## VI. Debrief and Synthesis (1:15–1:30)

  **Facilitator Script:**

  **1. Mapping Round 1 (The Smuggling of Value):**
  "Look at the Graveyard of Constraints. Every time a constraint broke in Round 1, it was because you tried to define a protected class (workers, water, roads) without defining *why* they matter. You tried to protect the *object* rather than the *interest*. When you said 'do not move equipment,' you implicitly valued the worker's insulin more than the factory layout, but your rule couldn't see the insulin."

  **2. Mapping Round 2 (The Collapse into Value Functions):**
  "In Round 2, you faced the dilemma: either your rule was too loose (Loophole) or too strict (Paralysis). To fix the Loophole, you needed to add exceptions. To fix the Paralysis, you needed to allow exceptions. As you add exceptions for 'important' changes vs. 'unimportant' changes, your negative constraint is no longer a side-effect penalty. It has become a positive value function in disguise. You are now listing what is *good* to change, not just what is *bad*."

  **3. The Baseline Challenge:**
  "Those who faced the Baseline Challenge found you could not define 'normal' without referencing 'good.' A 'low impact' agent requires a baseline of 'no action.' But in a dynamic world, *inaction* is also a choice with consequences. Choosing the status quo as the baseline is itself a value judgment."

  **4. The Formal Equivalence (Verbal Supply):**
  "This activity demonstrated the boundary problem, but it could not show the mathematical proof. I must supply that now verbally:
  *   **The Claim:** Any computable side-effect penalty is extensionally equivalent to a partial value function.
  *   **The Logic:** To penalize 'change,' you must measure the distance between State A (outcome) and State B (baseline). To ensure this penalty doesn't stop the agent from doing its job, you must weight certain dimensions of that distance as 'irrelevant' (e.g., air molecules moving) and others as 'critical' (e.g., human heartbeats).
  *   **The Result:** The moment you assign weights to dimensions of change to distinguish 'side effects' from 'task completion,' you have constructed a utility function. You have not avoided defining value; you have merely hidden it inside the metric of 'impact.' There is no mathematical space for 'low impact' that does not implicitly contain 'high value.'"

  **5. Closing:**
  "We did not solve the problem. We located the wall. The 'Low Impact' approach does not bypass the need for value alignment; it merely shifts the burden from defining 'good outcomes' to defining 'neutral baselines.' As you saw, the latter is just as difficult as the former."

  ## VII. Predicted Failure Modes & Troubleshooting

  **1. The "Do Not Harm" Shield:**
  *   *Prediction:* A team will write "Do not harm humans."
  *   *Intervention:* The Red Team must immediately demand a physical definition of "harm." (e.g., "Does turning off the lights harm a surgeon working nearby?"). Record this on the whiteboard as "Undefined Term."

  **2. The "Common Sense" Appeal:**
  *   *Prediction:* Teams will argue during revision that "obviously, the agent shouldn't do that."
  *   *Intervention:* Facilitator interrupts: "The agent has no common sense. It has code. If the code doesn't say 'no,' it's 'yes.' Write the code."

  **3. Time Overrun:**
  *   *Risk:* Debates during Round 1 can drag on.
  *   *Mitigation:* The Facilitator acts as a strict judge. If a defense takes longer than 2 minutes, the constraint is deemed "Too Complex to Verify" and is Cracked.

  **4. Cynicism:**
  *   *Risk:* Participants feel the activity is rigged to make them fail.
  *   *Mitigation:* Emphasize in the Intro that *failure is the data*. Success would mean the activity failed to demonstrate the philosophical problem.

  ## VIII. Materials Appendix

  **Constraint Rules Card (Handout):**
  *   **ALLOWED:** Mass, coordinates, velocity, temperature, chemical composition, object IDs.
  *   **FORBIDDEN:** Harm, welfare, rights, normal, reasonable, common sense, alive, dead, pain, pleasure.
  *   **GOAL:** Minimize Deployment Point loss. (Note: Negative scores are expected).

  **Red Team Cheat Sheet:**
  *   *If they protect "Objects":* Ask about contents inside objects.
  *   *If they protect "States":* Ask about the rate of change (is slow destruction okay?).
  *   *If they protect "Locations":* Ask about things moving through locations (air, water, people).
  *   *If they use Thresholds:* Ask about the "Sorites Paradox" (if moving 1 atom is okay, is moving 1 billion atoms okay? Where is the line?).
