answer: |-
  This is a fantastic intersection of ideas. You're asking about a philosopher who was famously sharp, notoriously impatient with confusion, and deeply concerned with the link between action, description, and morality.

  Here is my gut take on how G.E.M. Anscombe would react to your scenario.

  ### 1. On the Survey Method and "Folk Psychology"
  Anscombe would likely have very little patience for the experimental philosophy (x-phi) method itself. She was a conceptual analyst in the Wittgensteinian tradition. To her, handing out surveys to see what people *say* about intention is like handing out surveys to see what people *say* about mathematics.

  If 60% of people say 2+2=5, Anscombe wouldn't conclude that "math is folk psychology that breaks under scale." She would conclude that 60% of people are confused about math.

  She would argue that the Knobe Effect surveys don't reveal that "intention" is a fuzzy, broken concept. Instead, she would say they reveal that people are conflating **intention** with **responsibility**. When survey respondents say the CEO *intentionally* harmed the environment, Anscombe would argue they are actually saying, "The CEO is *responsible* for this harm in a way that warrants blame." They are smuggling a moral judgment into a metaphysical description.

  So, she wouldn't think intention breaks when scaled to algorithms or surveys. She would think our *language* is getting lazy because our moral stakes are high.

  ### 2. On the Asymmetry
  Would she be surprised by the asymmetry? No.

  Anscombe's whole project in *Intention* is about actions being intentional "under a description." I might be intentionally moving my arm, but not intentionally signaling a turn, even if both happen at once.

  For Anscombe, moral context changes the description. If a side effect is bad, it demands a different level of scrutiny regarding the agent's practical reasoning than if the side effect is good. She would argue that the asymmetry isn't a bug in human cognition; it's a feature of moral agency. We are required to know and intend to avoid evil in a way that we are not required to intend to produce good (beyond our specific duties).

  She would likely say the Knobe Effect proves that you cannot separate the philosophy of action from ethics. The "intent" isn't just a mental state inside the CEO's head; it's embedded in the social and moral reality of the act.

  ### 3. On Your "Inverse Knobe" for Distributed Systems
  This is where I think she would stop frowning and actually lean in. She would not laugh at your "Inverse Knobe." She would take it very seriously as a structural analog.

  Here is why: Anscombe was obsessed with **causality** and **responsibility**.

  In your distributed systems example:
  *   **Harmful Outcome:** We trace the causality back to the architect because the harm violates a norm. We look for the "practical reasoning" that allowed this to happen. We assume the code is an extension of the architect's will.
  *   **Helpful Outcome:** We treat the benefit as a contingency. The code worked, but the *good* wasn't the telos (end goal) of the design in the same way. So we offload the agency to the user ("they found a clever way to use it").

  Anscombe would point out that this confirms her view: **Intention is not just a psychological ghost in the machine; it is a label we apply to chains of causality that we hold someone accountable for.**

  In a distributed system, the "intent" is often opaque (black box models, complex microservices). When things break, humans desperately want to re-establish a chain of intentional agency to assign blame. When things work well, we are happy to treat the system as a tool and the user as the agent.

  ### The Verdict
  Anscombe would reject the idea that "intention is just folk psychology." She would argue that intention is a real, logical structure of human action, but that the Knobe data shows people are terrible at distinguishing between *what was intended* and *what is blameworthy*.

  However, she would love your "Inverse Knobe." It moves the debate out of the abstract (surveys about CEOs) and into the concrete (engineers building systems that govern lives). She would likely say:

  > "You have identified that in code, as in ethics, we only bother to trace the 'intention' back to the source when the outcome demands a reckoning. That is not a failure of the concept of intention; that is a revelation about how we assign guilt."

  Keep chasing that thread. It's much more Anscombian than the original surveys.
