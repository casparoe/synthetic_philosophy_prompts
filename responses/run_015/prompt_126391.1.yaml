      *   *Core Thesis:* Intention isn't just a mental state preceding action; it's embedded in the action itself under a description. "Why?" questions have application. Practical knowledge vs. speculative knowledge.
      *   *Moral Psychology:* She was a virtue ethicist (Aristotelian/Thomistic). She cared deeply about the *object* of the act, not just consequences.
      *   *Style:* Sharp, analytical, often impatient with confusion, focused on language and concepts rather than empirical data. She famously opposed the honorary degree for Truman (moral stance).
      *   *Relation to X-Phi:* X-phi uses surveys to test intuitions. Anscombe was a conceptual analyst. She might view surveys as cataloging confusion rather than clarifying concepts. However, she respected the *facts* of human action.

  3.  **Address Question 1 & 2: Anscombe on the Knobe Effect:**
      *   *The Knobe Effect:* People say the CEO *intentionally* harmed the environment (bad side effect) but *did not intentionally* help it (good side effect), even if the mental state (indifference) is identical.
      *   *Anscombe's Likely Reaction:* She would likely be skeptical of the *conclusion* that "intention" is just folk psychology or mutable. She argues intention is a specific form of practical knowledge.
      *   *The Asymmetry:* She wouldn't be surprised by the asymmetry. For Anscombe, moral context *matters* for describing actions. If I kill someone, whether it's "murder" or "accident" depends on the description, but moral weight shifts the description.
