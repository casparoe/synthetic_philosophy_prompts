  2.  **Deconstruct the Chapter's Claims (Philosophical Fact-Checking):**

      *   *Claim 1: Definition of Supererogation.*
          *   **Status:** Generally accepted standard definition (Urmson is the classic reference).
          *   **Nuance:** It's the standard starting point, though debated.
          *   **Verdict:** Fair simplification.

      *   *Claim 2: "Tea vs. Coffee" (Moral Parity).*
          *   **Status:** Controversial/Strawman-ish.
          *   **Nuance:** Most philosophers agree *not* doing a supererogatory act isn't *wrong* (blameworthy), but many argue it's still *better* to do it. Saying it's morally *on a par* with trivial choices implies moral indifference. Most ethicists think you have *reasons* to be heroic, just not *obligations*.
          *   **Verdict:** Your brother-in-law is right. This is an oversimplification that borders on misleading. It ignores the distinction between "obligatory" and "optimific."

      *   *Claim 3: Utilitarianism Collapses Supererogation.*
          *   **Status:** Mostly true for Act Utilitarianism, nuanced for Rule Utilitarianism.
          *   **Nuance:** Classic Act Utilitarianism (maximize utility always) does make sainthood the baseline. However, many modern utilitarians accept "satisficing" or distinguish between objective and subjective duty to allow room for supererogation.
          *   **Verdict:** Fair critique of *classic* Act Utilitarianism, but ignores sophisticated responses.

      *   *Claim 4: The "Best Thing" Argument (The Collapse Argument).*
          *   **Status:** This is the "Paradox of Supererogation" (Heyd, etc.).
          *   **Nuance:** It's a genuine philosophical problem, not a knockdown argument. It's the central debate in the literature. If rationality requires doing the best, supererogation is impossible. If rationality allows doing less than best, it's possible.
          *   **Verdict:** Real problem, still argued about. Not settled.

      *   *Claim 5: No Credit for Duty.*
          *   **Status:** Generally accepted (Kantian influence).
          *   **Nuance:** Doing your duty is expected. Praise is usually reserved for going beyond. However, doing duty *reliably* or *against temptation* can attract praise.
          *   **Verdict:** Mostly right, but slightly rigid.

      *   *Claim 6: No Mirror Image (Suberogatory).*
          *   **Status:** False/Contested.
          *   **Nuance:** The concept of the "suberogatory" (Roderick Chisholm) exists. Acts that are bad but not forbidden (e.g., petty rudeness, minor selfishness).
          *   **Verdict:** Wrong. This is a known gap in the tripartite model (Obligatory, Forbidden, Optional).

  3.  **Address the User's Cases:**

