  7.  **Final Polish:** Ensure clear headings and bullet points for readability. (Self-Correction: Make sure not to get too technical with jargon like "deontic logic" without explaining it.) *Wait, one nuance on the "Credit for Duty" point.* Kant says duty done *from* duty has moral worth, but duty done *in accordance* with duty (just because you want to) has less. But the book says "no credit for *merely* doing duty." That's closer to the idea that praise is for the extra. I should clarify that distinction.

      *Also, on the Utilitarian point:* Some utilitarians (like Singer) embrace the demandingness. Others modify the theory. I need to make sure the user knows Utilitarianism isn't a monolith.

