answer: |-
  This is a great set of questions. You have correctly identified that popular philosophy books often sharpen distinctions to make a point, sometimes at the cost of accuracy. Your brother-in-law is right to be skeptical of the "tea vs. coffee" line, but the rest of the chapter is a mix of standard textbook definitions and genuine, unresolved philosophical debates.

  Here is a claim-by-claim breakdown of what working ethicists would say, followed by an analysis of your three cases and the "mirror image" problem.

  ### Part 1: Claim-by-Claim Fact Check

  **1. The Definition ("Beyond the call of duty... not doing them isn't wrong")**
  *   **Verdict:** **Accepted Standard.**
  *   **The Nuance:** This is the classic definition established by J.O. Urmson in 1958. Almost everyone agrees on this basic structure: Supererogatory acts are *good*, *optional*, and *not doing them is not blameworthy*.
  *   **Trust Level:** High. This is the baseline definition used in almost all ethics courses.

  **2. The "Tea vs. Coffee" Analogy ("Not giving to charity is morally on a par with having tea instead of coffee")**
  *   **Verdict:** **Strawman / Misleading.** (Your brother-in-law is right).
  *   **The Nuance:** This is the most problematic sentence in the excerpt. While not doing a supererogatory act isn't *wrong* (you can't be punished or blamed), most philosophers agree it is still *better* to do it.
      *   Choosing tea over coffee is morally neutral.
      *   Choosing *not* to save a drowning child (when it costs you nothing) might not be legally punishable, but it is morally significant.
      *   Choosing *not* to jump on a grenade is permissible, but choosing *to* jump is morally superior.
      *   **Why it matters:** The book implies moral *indifference*. The reality is a hierarchy: Duty is the floor, Supererogation is the ceiling. Standing on the floor isn't "wrong," but it isn't the same as standing on the ceiling.
  *   **Trust Level:** Low. This is a rhetorical simplification that distorts the moral landscape.

  **3. The Utilitarian Objection ("For a utilitarian everything good is mandatory")**
  *   **Verdict:** **Fair Critique of *Classic* Utilitarianism, but dated.**
  *   **The Nuance:** Classical Act Utilitarianism (maximize the good in every single instance) does indeed collapse supererogation. If saving the child produces more utility than walking past, you are *obligated* to save the child. If giving half your income produces more utility than keeping it, you are *obligated* to give it.
      *   However, modern Utilitarians have responses. Some argue for "Satisficing Utilitarianism" (you only need to do *enough* good, not the *most* good). Others distinguish between what is objectively right vs. what we can reasonably expect humans to do (subjective duty).
      *   Still, the "Demandingness Objection" (that Utilitarianism asks too much) is one of the most famous critiques in ethics.
  *   **Trust Level:** Medium-High. It's a standard critique, though it ignores sophisticated modern defenses.

  **4. The "Collapse" Argument ("If it's the best thing... then it's required")**
  *   **Verdict:** **Real Debate, Not Settled.**
  *   **The Nuance:** This is known as the **Paradox of Supererogation**. It asks: *How can it be rational to do less than the best?*
      *   If morality is about doing the best thing, then the "best" thing is just your duty.
      *   To save supererogation, philosophers argue that morality isn't just about "maximizing good." It's about rights, permissions, and personal projects. You are *allowed* to prioritize your own life up to a point.
      *   This is not a "knockdown argument" that kills the concept; it is the central puzzle that defines the field.
  *   **Trust Level:** Medium. It presents a hard logical problem as a definitive refutation.

  **5. Credit for Duty ("You can't deserve any credit at all for merely doing your duty")**
  *   **Verdict:** **Mostly Right, but Rigid.**
  *   **The Nuance:** In Kantian ethics, doing your duty is what is *expected* of a rational agent, so it doesn't merit special praise (though it merits respect). Special praise ("You're a saint!") is reserved for the supererogatory.
      *   However, if doing your duty is difficult (e.g., returning a wallet when you are starving), you often *do* get credit. The book is simplifying a distinction between "praise for excellence" vs. "approval for compliance."
  *   **Trust Level:** Medium. It's a common heuristic, but real life is messier.

  **6. The "Mirror Image" ("No such thing as something bad but not forbidden")**
  *   **Verdict:** **False.**
  *   **The Nuance:** Philosophers call this the **Suberogatory**. Roderick Chisholm and others have argued extensively for this category.
      *   Example: Being rude to a waiter, or refusing to help a friend move when you easily could. It's not "forbidden" (you won't go to hell or jail), and it's not "supererogatory" to help, but it is definitely *bad* or *shabby*.
      *   The tripartite model (Forbidden, Optional, Obligatory) is often criticized for missing this "shabby but permissible" zone.
  *   **Trust Level:** Low. The book is ignoring a well-established counter-concept.

  ---

  ### Part 2: Analyzing Your Three Cases

  You have intuitively stumbled onto three major debates in the literature.

  **1. The Cost Slider (Button vs. Job Interview)**
  *   **The Philosophical Concept:** **The Threshold View.**
  *   **Analysis:** Most theories of supererogation agree that cost matters. An act is supererogatory only if it involves significant sacrifice or risk.
      *   **Version A (Button):** If the cost is negligible, most ethicists would argue this shifts from supererogatory to **duty**. If you can save a life by pressing a button, you *ought* to do it. Failing to do so is wrong.
      *   **Version B (Job Interview):** This involves significant sacrifice. This fits the definition of supererogatory.
      *   **The Line:** You asked where the line is drawn. Philosophers admit this is fuzzy (a Sorites paradox). There is no precise dollar amount where duty becomes heroism. It is a sliding scale where our *expectations* shift. We don't blame you for the job interview sacrifice; we might blame you for the button.

  **2. The Lifeguard (On Shift vs. Off Shift)**
  *   **The Philosophical Concept:** **Special Obligations vs. General Duties.**
  *   **Analysis:** This is a very clean case for deontological ethics.
      *   **On Shift:** She has entered a contract. She has a **special obligation** based on her role. Diving is duty. Not diving is negligence/wrong.
      *   **Off Shift:** She reverts to a private citizen. She has only **general duties**. Diving is now supererogatory (heroic).
      *   **Why:** It's not that the *act* changed, but her **relationship to the victim** changed. She is paid to assume the risk on shift. Off shift, the risk is a gift she offers.
      *   **Verdict:** This fits perfectly into standard moral theory. Job descriptions create moral duties that didn't exist before.

  **3. The Mixed Ones (Promotion / Kidney for Brother)**
  *   **The Philosophical Concept:** **Net Cost and Motive.**
  *   **Analysis:**
      *   **The Promotion:** Supererogation is usually calculated by **net cost**. If the risk is high but the reward (promotion) outweighs the risk, some argue it's no longer supererogatory—it's rational self-interest. However, if the risk of death was 50% and the promotion was just a nice bonus, it remains supererogatory because the *potential* cost was beyond duty.
      *   **The Kidney:** This touches on **Motive**. If you give a kidney to your brother because you love him, is it duty or supererogatory?
          *   Some argue we have a "duty of beneficence" to family that is stronger than to strangers.
          *   Most agree that organ donation is supererogatory even for family, because the bodily sacrifice is so high.
      *   **Verdict:** Getting something out of it doesn't automatically disqualify an act. The category tracks **risk and sacrifice**, not purity of motive. If the sacrifice is high enough, it's supererogatory even if you get a medal later.

  ---

  ### Part 3: The "Mirror Image" (Petty Selfishness)

  You are right, and the book is wrong here.

  *   **The Concept:** As mentioned, this is the **Suberogatory**.
  *   **Why the book denies it:** The book is likely working with a strict **Deontic Logic** model (Obligatory, Permissible, Forbidden). In strict logic, if it's not forbidden, it's permissible. If it's permissible, it's neutral.
  *   **Why reality disagrees:** Morality isn't just logic; it's about character. Being petty, selfish, or ungenerous is often *permissible* (you have a right to your money/time) but *vice-like* (it makes you a worse person).
  *   **Takeaway:** Your intuition is more sophisticated than the book's model here. The "Optional" category is not a flat plain; it has hills (good/heroic) and valleys (bad/shabby).

  ---

  ### Part 4: Should You Trust the Rest of the Book?

  **How much to distrust:**
  Don't throw the book away, but read it as a **map, not the territory**.
  *   The book is doing what popular philosophy books do: creating clean categories to help you think.
  *   The "Tea vs. Coffee" and "No Mirror Image" claims are oversimplifications designed to make the "Supererogatory" category pop out clearly.
  *   The Utilitarian critique is standard and worth taking seriously, even if Utilitarians have comebacks.

  **What was left out (The Big Picture):**
  The chapter likely left out **Virtue Ethics**.
  *   **Deontology (Duty):** Focuses on rules (Don't lie, Save the child). Struggles with supererogation.
  *   **Utilitarianism (Outcome):** Focuses on results (Maximize happiness). Collapses supererogation.
  *   **Virtue Ethics (Character):** Focuses on *what kind of person you are*.
      *   A Virtue Ethicist handles your "Cost Slider" and "Tea" problem best. They would say: "Jumping on the grenade is what a *hero* does. Pressing the button is what a *decent person* does. Ignoring the button is what a *jerk* does."
      *   This allows for the sliding scale of praise and blame without needing rigid "forbidden/optional" lines.

  **Summary Advice:**
  1.  **Trust** the definition of supererogation (Optional, Good, Not Required).
  2.  **Doubt** the claim that not doing it is morally neutral (like tea). It is permissible, but not neutral.
  3.  **Doubt** the claim that there is no "bad but permissible" category (Suberogatory).
  4.  **Accept** that Utilitarianism has a hard time with this, but knows it.
  5.  **Use your own cases.** Your intuitions about the lifeguard and the cost slider are actually more aligned with current academic consensus than the simplified text in the chapter. You are thinking like a philosopher.
