prompt: |-
  I'm currently in a comparative ethics seminar that pairs classical Confucian texts with contemporary organizational sociology, and I've become stuck on whether Confucian role ethics can be genuinely reconstructed without its cosmological commitments. Specifically, I want you to take the core Confucian position that moral identity is constituted relationally—through the five cardinal relationships and the rectification of names—rather than by internal properties or universal duties, and restate it entirely in the vocabulary of organizational role theory: role sets, role senders, role expectations versus role enactment, intra-role and inter-role conflict, role ambiguity, and the distinction between role-taking and role-making. Do not import Confucian metaphysics—no tian, no cosmological harmony, no ritual as cosmic ordering—unless it can be expressed as a claim about organizational structure or social expectation without distortion.

  After the translation, provide a residue report: which elements of the Confucian view survive intact (for instance, the anti-individualist, relational structure of the self), which must be stretched or distorted to fit (perhaps the idea that proper role-performance expresses an objective moral order), and which have no expression whatsoever in organizational vocabulary (for example, the claim that cultivating one's role can affect the harmony of the cosmos). Conclude by assessing whether the untranslatable residue reveals a genuine normative gap in organizational role theory—something it should but cannot say—or whether it merely exposes metaphysical baggage in Confucianism that a secular framework is right to discard. Keep the translation honest: do not smuggle relational metaphysics in under organizational labels and call it translation.
