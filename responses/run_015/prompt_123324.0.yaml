  *Best fix:* Drop 5. It's the outlier. It contradicts 2 directly.

  *Wait, Claim 6:* "Same agent." If there are two subjects (dropping 2), are there two agents? Usually yes. So keeping 6 requires keeping 2. So dropping 5 supports keeping 2 and 6.
  *Wait, Claim 4:* "Determinacy." If graded cases exist (1), determinacy (4) is hard. But that's a separate battle. The 1-2-5 clash is the immediate logical explosion.

