answer: |-
  **Project Title:** The Architecture of Indirect Normativity: Erasure, Cost, and the Limits of Deliberation

  **The Core Question**
  This project asks: **Is indirect normativity *deliberatively stable* only when deliberation incurs endogenous costs?**
  This question admits a determinate answer (Yes/No). It investigates whether the standard idealization of free, unbounded deliberation renders indirect normative theories (theories where the right action is not determined by the direct deliberative procedure) incoherent.

  **Working Definitions**
  To ensure precision, I define the following load-bearing terms:
  *   **Deliberation:** The cognitive process of weighing considerations to produce an intention.
  *   **Idealization:** A counterfactual standard specifying how an agent *ought* to deliberate, distinct from how they empirically do.
  *   **Execution:** The successful translation of a deliberative output into action.
  *   **Deliberative Stability (New Term):** A normative theory is stable if and only if an agent who accepts the theory as true can successfully execute the deliberative procedure it prescribes.
  *   **The Erasure Test:** A diagnostic tool. A theory fails this test if acceptance of the theory destroys a condition required for its own execution (e.g., requiring spontaneity that reflection dissolves). This is distinct from *self-effacement* (whether a theory should be believed/taught); erasure concerns whether it can be *run* by the believer.
  *   **Cost:** The opportunity cost or psychic load associated with each round of meta-deliberation.
  *   **Depth:** The number of recursive levels of meta-deliberation (thinking about thinking) an agent performs.
  *   **Endogenous Stopping Rule:** The agent decides when to stop deliberating based on the internal logic of the normative theory, not an external cutoff.

  **Why Existing Positions Leave This Open**
  Current literature addresses the components of this question but fails to integrate them.
  1.  **Advice-Model/Ideal Advisor:** These accounts address the *Synchronic* axis (what to consider now). They assume the agent can access the advisor's standpoint without altering their own psychology. They do not test for *Erasure*.
  2.  **Sophisticated vs. Resolute Choice:** These address the *Architectural* axis (managing future selves). However, they treat the normative standard as fixed and do not question whether the *knowledge* of the standard undermines the resolution.
  3.  **Rule-Based Indirectness:** These address the *Meta* axis (policies about policies). Yet, they typically assume costless compliance.
  4.  **Self-Effacement Literature:** This addresses whether a theory should be believed. It does not address *Deliberative Stability*. A theory can be believable but un-executable (e.g., "Believe this, but do not let this belief influence your weighing process").
  None of these positions account for the interaction between *Erasure* and *Cost*. They assume deliberation is free. My conjecture is that without a price on depth, indirect normativity collapses; the agent either deliberates forever or erases the conditions of success.

  **Methodology and Timeline (12 Months)**
  I will not conduct a survey of existing positions or appeal to empirical psychology. The problem is conceptual: it concerns the logical consistency of normative structures, not human limitations. I will construct a formal toy model and a taxonomy of procedures.

  *   **Months 1–3: Formalizing the Erasure Test.** I will construct a taxonomy of candidate deliberative procedures scored against the Erasure Test. I will define the necessary and sufficient conditions for a procedure to be self-erasing.
      *   *Deliverable:* A rigorous definition of Deliberative Stability.
  *   **Months 4–6: Modeling Costly Deliberation.** I will build a formal toy model where each level of meta-deliberation incurs a cost. I will derive the endogenous stopping rule for an agent maximizing normative compliance.
      *   *Deliverable:* A proof of concept showing how cost limits depth.
  *   **Months 7–9: Testing the Interaction.** I will apply the Cost Model to the Erasure Taxonomy. I will test whether introducing cost stabilizes theories that previously failed the Erasure Test.
      *   *Deliverable:* Three worked cases (e.g., utilitarian calculation, virtue-ethical responsiveness, deontological constraint).
  *   **Months 10–12: Synthesis and Writing.** I will integrate the results into the final article, refining the argument based on the negative results found in the appendix.
      *   *Deliverable:* Final manuscript.

  **Deliverables**
  1.  **One Article (~9,000 words):** Arguing for or against the Core Question. A useful result for a generalist is a clear boundary condition for normative theories: "If you want indirect normativity, you must pay for deliberation."
  2.  **Two-Page Appendix of Negative Results:** This will document versions of the Erasure Test or Cost Model that failed to yield stable results. This is not an admission of defeat; in conceptual engineering, knowing which structures collapse is data. It prevents future scholars from pursuing dead ends.

  **Failure Conditions**
  The project fails if:
  1.  **The Redescription Failure:** The Erasure Test turns out to be identical to the Self-Effacement problem. If "execution" collapses into "belief," the distinction is merely verbal. I will mitigate this by focusing on *procedural* conditions (e.g., attentional focus) rather than doxastic states.
  2.  **The Trivialization Failure:** The Conjecture about Costly Deliberation collapses into a familiar point about Bounded Rationality. If "cost" is just "limited brain power," the result is empirical, not normative. I will mitigate this by defining cost *normatively* (as a trade-off required by the theory) rather than *psychologically* (as a limitation of the agent).

  **Scope and Objections**
  **Scope:** To complete this in one year, I will cut historical exegesis and empirical validation. I will not trace the history of indirect utilitarianism or review cognitive load studies. The argument is *a priori*.
  **The Rule-Consequentialism Objection:** A committee member may suspect this is merely rule-consequentialism with new vocabulary. I will respond that rule-consequentialism is a *substantive* claim about what makes acts right (rules vs. acts). This project is a *structural* claim about how any normative standard (including rule-consequentialism) is accessed. Even a rule-consequentialist must explain how an agent deliberates about the rules without erasing the disposition to follow them. This project provides the architecture for that explanation, regardless of the normative content.
