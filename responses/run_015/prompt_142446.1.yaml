answer: |-
  You press me on the distinction between the blood of the nation and the structure of the state, and here we must be most precise. Political guilt is not a stain on the soul inherited by birth, nor is it a moral condemnation of the individual; it is the liability inherent in living under a legal order that claims continuity. When a state persists, its citizens are co-bearers of its power, and thus co-bearers of the consequences of its actions, regardless of when they entered the community. To join such a state is to accept its history as the ground upon which one stands; one cannot claim the protection of its laws while disavowing the debts of its existence. This is not collective moral guilt, for no one is judged evil for another's crime, but it is a political necessity: without this liability, the state remains a continuation of injustice rather than a new beginning of right.

  As for the charge of utilitarianism, you mistake the nature of restitution. A purely forward-looking policy might build a hospital, but it would not offer an apology, for utility cares only for results, not for truth. The shame these citizens feel is metaphysical—the awareness that human solidarity was shattered and that they, as humans within that community, must act to restore trust. If they treated reparations merely as policy, they would be lying, masking political liability as charity. By insisting on the language of apology while denying moral guilt, they preserve the truth: they are not criminals, but they are responsible for restoring the legal and human order that their state destroyed. Is it not better to bear this political burden honestly than to pretend the state's continuity has no cost?
