answer: |-
  The Bureau of Aerospace Ceramics (BAC) has regulated heat-shields since 1950 using the predicate "Class-1 Verified" (P), a term deeply entrenched in safety codes and defined by ostensive reference to founding samples that all coincidentally contained a rare stabilizing isotope. In 2025 ($t$), the isotope source expires, forcing manufacturers to use a synthetic substitute that is physically identical in every simple respect (Predicate Q: "Thermally-Stable") but lacks the hidden temporal stability of the original batch. All shields tested before 2025 were both Class-1 Verified and Thermally-Stable, but unknown to the BAC, "Class-1 Verified" actually extends only to shields made before 2025 or those made after 2025 that fail under stress, whereas "Thermally-Stable" correctly picks out all shields that remain stable regardless of production date. The BAC continues to project "Class-1 Verified" for new shields, expecting them to hold, while a renegade physicist projects "Thermally-Stable," expecting stability only if the new synthesis holds.

  **Analysis of the Divergence**

  In this case, the **Simplicity Move** favors Predicate Q ("Thermally-Stable"). Simplicity dictates choosing the hypothesis that posits a uniform physical property without hidden temporal conditions or disjunctions. Since Q describes a stable physical capacity invariant across time, while P secretly contains a temporal disjunction (stable before $t$, unstable after), Q is the simpler hypothesis and correctly predicts the new shields will hold.

  The **Entrenchment Move** favors Predicate P ("Class-1 Verified"). Goodman's criterion relies on the history of actual usage and projection within the linguistic community. Since "Class-1 Verified" is the term codified in 75 years of safety literature, regulatory practice, and foundational ostensive definitions, it is far more entrenched than the newcomer term "Thermally-Stable." Entrenchment therefore validates projecting P, which leads the community to expect the new shields to fail (or to misclassify the stable ones), resulting in an incorrect prediction.

  **The Feature Doing the Work**
  The single feature driving the divergence is the **hidden temporal dependency in the operational history of the entrenched term**. The community's history locked the extension of P to a specific time-period via accidental features of the original samples, making P objectively complex (Grue-like) while subjectively appearing atomic to the users.

  **The Goodmanian Rebuttal**
  A defender of entrenchment would argue that complexity is relative to a conceptual scheme, so P is not complex *for the BAC* since their language lacks the resources to express the temporal disjunction; therefore, Simplicity cannot objectively override Entrenchment. Alternatively, they might claim that entrenchment is constituted by successful projection, so if P fails to project correctly, it retroactively loses its status as "well-entrenched," making the case stipulatively impossible.

