answer: |-
  ### Part 1: Mapping the Logical Space (Brainstorm)

  Before deploying the tree, we need to acknowledge where the literature clusters and where it gaps. This helps students understand why certain leaves feel "stable" and others feel "incoherent."

  **1. Defended Positions (The Stable Leaves)**
  *   **The Nordic Model (End Demand):** Defended by radical feminists and some social democrats. *Core claim:* Prostitution is gendered violence; the state must deter buyers while treating sellers as victims needing exit services.
  *   **The NZ Model (Full Decrim):** Defended by sex-worker-led organizations and liberal libertarians. *Core claim:* Criminal law increases vulnerability; labor law is the correct regulatory framework.
  *   **The German/Dutch Model (Legalization):** Defended by pragmatists and public health advocates. *Core claim:* State oversight (licensing, zoning, health checks) ensures safety and tax compliance.

  **2. Convergence Points (Where Models Blur)**
  *   **State Oversight:** Nordic and Legalization models both assume the state must heavily manage the industry, either through criminal enforcement (Nordic) or administrative bureaucracy (Legalization). Students who answer "Yes" to heavy state involvement might land on either leaf depending on *who* they want penalized.
  *   **Third-Party Ambiguity:** Some Nordic supporters allow cooperative housing for workers, which looks suspiciously like the legalized brothels of the Dutch model. The tree treats third-party criminalization as a secondary feature of the Nordic model, but students should know this boundary is porous.

  **3. Empty or Unstable Spots**
  *   **Criminalize Sellers Only:** Historically common, ethically indefensible in modern literature (punishes the victim). The tree should not lead here.
  *   **The "Weird Hybrid" (Decrim + No Unions):** Theoretically possible (a libertarian market without labor power), but politically unstable. It lacks the protection of labor law (NZ) and the social support of the Nordic model. It is the "incoherent" leaf you requested.
  *   **Mandatory Health Checks without Licensing:** Rarely defended as a standalone. Usually slides into Legalization.

  ***

  ### Part 2: The Decision Tree Handout

  **Instructions:** Answer the following three questions based on your ethical assessment of the claims provided. Do not worry about which policy model you prefer; follow your answers to the leaf node.

  #### Branch 1: The Buyer
  **Claim:** *Criminal penalties for the purchase of sex are an effective and ethical tool to reduce market size without harming sellers.*
  *   **YES:** Go to **Leaf A**.
  *   **NO:** Go to Branch 2.

  #### Branch 2: The Bureaucracy
  **Claim:** *A specific state licensing or registration regime (distinct from standard business permits) is necessary to ensure worker safety and public health.*
  *   **YES:** Go to **Leaf B**.
  *   **NO:** Go to Branch 3.

  #### Branch 3: The Collective
  **Claim:** *Sex workers should be granted explicit statutory rights to collective bargaining and unionization equivalent to other service sectors.*
  *   **YES:** Go to **Leaf C**.
  *   **NO:** Go to **Leaf D**.

  ***

  ### Part 3: The Leaves (Regime Outcomes)

  #### Leaf A: The Nordic Model (End-Demand)
  *   **Policy Profile:** Selling is legal; buying and third-party management are criminalized. State funds exit services.
  *   **Most Awkward Commitment:** You must accept that the state will spend significant resources offering "exit" assistance to workers who explicitly state they do not wish to leave the industry.

  #### Leaf B: The Legalization Model (German/Dutch)
  *   **Policy Profile:** Selling and buying are legal, but workers must register, undergo health checks, or work in zoned areas. Third parties (brothels) are legal and regulated.
  *   **Most Awkward Commitment:** You must accept that licensing requirements will inevitably create a two-tier market, pushing undocumented or non-compliant workers into the illegal underground where they have no recourse.

  #### Leaf C: The Decriminalization Model (New Zealand)
  *   **Policy Profile:** No criminal penalties for any party. Sex work is treated as work under standard labor law. Third parties can operate but are subject to employment standards.
  *   **Most Awkward Commitment:** You must accept that labor law mechanisms (like striking or suing for wrongful dismissal) may be insufficient to protect workers from stigma-driven violence or client abuse.

  #### Leaf D: The "Atomized Market" Hybrid (Hypothetical)
  *   **Policy Profile:** No criminal penalties for buying or selling. No licensing regime. However, sex workers are explicitly barred from collective bargaining or forming unions.
  *   **Most Awkward Commitment:** You must defend why this specific workforce is denied the associational rights granted to other decriminalized service workers, effectively mandating precarious individualism as a condition of legal operation.

  ***

  ### Part 4: Diagnosis of Unoccupied & Convergent Spots

  **1. The Nordic/Legalization Convergence (State Paternalism)**
  Students who answer **YES** to Branch 1 (Nordic) and **YES** to Branch 2 (Legalization) are not separated by this tree. This is intentional. Both models rely on heavy state infrastructure to manage the market. The critical ethical divider is whether that infrastructure is *punitive* (criminalizing buyers) or *administrative* (licensing workers). If a student feels both are necessary, they are likely advocating for a "Prohibitionist-Legalization" hybrid that is logically unstable (punishing demand while licensing supply), which usually collapses into the Nordic model in practice.

  **2. The Empty Spot: "Criminalize Sellers Only"**
  There is no branch asking if the *seller* should be criminalized. In contemporary applied ethics, this position is largely vacated. It fails the harm principle (punishing the vulnerable party) and is instrumentally counter-productive (driving sales underground). If a student believes sellers should be punished, they should be routed to Leaf A (Nordic) but asked to justify why they deviate from the "seller-as-victim" premise, or to Leaf B (Legalization) and argue for punitive licensing.

  **3. The Instability of Leaf D (The Hybrid)**
  Leaf D is the "Weird Hybrid." It is logically consistent (a free market with restricted labor rights) but politically fragile. It satisfies libertarians who want decrim but fear "union monopolies," and it satisfies moral conservatives who want the trade visible but disempowered. However, it lacks a natural constituency: sex worker advocates reject the union ban, and abolitionists reject the decrim. It serves as a useful "stress test" leaf: if a student lands here, ask them why they deny labor power without using criminal law to enforce that denial.

  **4. The Licensing/Labor Overlap**
  In Branch 2, we treat Licensing as mutually exclusive from Decrim. In reality, some "Decrim" models retain minor health regulations. However, for the sake of the seminar, treat "Licensing" as a *gatekeeping* mechanism. If the student believes the state should have the power to *deny* someone the right to work based on health or record status, they belong in Leaf B. If they believe the state can only intervene *after* a labor violation occurs, they belong in Leaf C or D.
