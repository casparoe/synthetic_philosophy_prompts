prompt: |-
  hey so i need a classroom activity for my philosphy of mind reading group — about 12 people, 90 mins, mostly grad students but not all deep in the literature. the idea is consciousness as a user illusion, but i dont want the usual brain-in-a-vat stuff they've seen a million times. instead inject this twist: the phantom debugger paradox, where anyone trying to peek behind the interface just gets another rendered layer — there's an epistemic lock-in. design a structured simulation with roles: half are Experiencers, half are Architects. the Architects have to build a model of what's going on, but they can only use vocabulary the Experiencers report — so no neurons, no computation, just colors, pains, intentions. there should be small real stakes: maybe points that determine whether the group votes they've 'found' the back end, but the rules make that impossible by design. give me rounds, rules, payoffs, a timeline, and a debrief that maps each round onto parts of the illusion view. also be honest about what feature this cant reproduce — probably the actual first-person immediacy — and tell me how to supply that as facilitor. keep it paper and pens only, no tech. and please dont include any bibliography or citation requests in the deliverable — a model without web access shouldnt need to guess titles. write casual, a typo or two is totally fine.
