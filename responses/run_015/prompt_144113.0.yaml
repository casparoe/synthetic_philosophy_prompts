      *   **Candidate Case:** "Nine Thousand Silos" (9000 agents, press/not press, cost 1, benefit 3 to others). Dials: Visibility (0, 10, 8999 observed) and Provenance (Registrar announces exact count vs. Exchangeable with prior on tendency).
