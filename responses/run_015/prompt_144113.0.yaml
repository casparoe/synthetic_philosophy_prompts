  2.  **Deconstruct the Content & Pedagogy:**
      *   **Core Concept:** EDT in large populations (Logical Decision Theory adjacent, but framed as EDT). The key is correlation without causation. If I am similar to others, my choice evidences their choice.
      *   **The Math:** Leverage = $E[Others | I Press] - E[Others | I Don't]$. Condition to press: $3 \times \text{Leverage} > 1$.
      *   **The User's Numbers:**
          *   Unannounced/Exchangeable/No Obs: Leverage $\approx 0.36 \times 8999$. (This seems high, need to check intuition. If prior is 50/50 on $p=0.2$ or $p=0.8$, and I press, I update towards $p=0.8$. Expected others shifts significantly. Yes, large leverage.)
          *   Registrar Announces Exact Count (3000 press): Leverage = -1. (If I press, someone else *must* not press to keep count fixed. Negative correlation.)
          *   Visibility High: Leverage collapses. (If I see 8999 others, my act adds no info about them.)
      *   **Potential Pitfalls:**
          *   Students confusing EDT with "magic causation".
          *   Students thinking correlation requires a common cause they can see (the "shared signal" issue).
          *   Students getting bogged down in the Bayesian update arithmetic before grasping the structural point.
          *   The "Conservation of Evidence" objection (how can my act evidence 8999 others?).
