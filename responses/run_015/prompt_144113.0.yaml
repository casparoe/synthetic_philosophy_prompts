          *   Prior: 0.5 on $p=0.2$, 0.5 on $p=0.8$.
          *   $P(Press) = 0.5(0.2) + 0.5(0.8) = 0.5$.
          *   If I Press: $P(p=0.8 | Press) \propto 0.8 \times 0.5 = 0.4$. $P(p=0.2 | Press) \propto 0.2 \times 0.5 = 0.1$. Normalized: 0.8 on $p=0.8$, 0.2 on $p=0.2$.
