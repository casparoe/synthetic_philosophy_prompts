answer: |-
  # Brainstorm

  This session is likeliest to fail in two specific ways. First, students will conflate evidential correlation with causal influence ("magic thinking"), reverting to CDT intuition whenever the leverage number gets large. They will insist that because I cannot *cause* the others to press, my act cannot *recommend* pressing, regardless of the conditional probabilities. Second, they will drown in the Bayesian arithmetic of the exchangeable case before grasping the structural difference between knowing a *propensity* (the 0.2/0.8 prior) and knowing a *count* (the Registrar's announcement). If you lead with the math, they will treat the leverage as a calculation trick rather than a structural feature of the information state.

  I considered ordering the material by increasing complexity of the dials (Visibility first, then Provenance), but rejected this. Visibility is a distraction; it merely reduces information. The conceptual pivot is Provenance (Exchangeable vs. Fixed). Starting with Visibility suggests the problem is about observation rather than about the nature of the joint distribution. I also considered deriving the leverage formula generally before applying it, but this fails because the formula looks identical in both cases; the magic is in the inputs. The formula must be introduced *after* the first case to validate the intuition, then reapplied to the second case to show the reversal.

  The single genuinely hard step is distinguishing between *parameter uncertainty* (I don't know the tendency of the group) and *realization uncertainty* (I know the tendency/count, but not who does what). In the Exchangeable case, my act updates the parameter, shifting expectations for everyone. In the Registrar case, the parameter is fixed (the count is fixed), so my act merely displaces someone else. If students do not see this distinction clearly, the reversal from positive to negative leverage will look like a calculation error rather than a feature of the theory.

  # The Plan

  ### 1. Dependency Structure
  1.  **Setup & EDT Rule:** Re-state the crude EDT rule (maximize expected utility conditional on the act). Define **Leverage** explicitly here: $E[\text{Others} | \text{Press}] - E[\text{Others} | \neg \text{Press}]$.
  2.  **Threshold Arithmetic:** Establish the decision rule immediately: Press if $3 \times \text{Leverage} > 1$. This gives them a target number to hunt for.
  3.  **Case 1 (Exchangeable/No Info):** Walk through the Bayesian update on the propensity (0.2 vs 0.8). Calculate the leverage. Show it exceeds the threshold. *Qualitative surprise happens here.*
  4.  **Case 2 (Registrar/Fixed Count):** Apply the same leverage definition. Show that because the total is fixed, $E[\text{Others} | \text{Press}] = \text{Total} - 1$. Leverage becomes $-1$. *Conceptual pivot happens here.*
  5.  **Case 3 (Visibility):** Briefly note that observing others removes the uncertainty required for leverage. (Keep this minimal to avoid sampling theory distractions).

  *Why this order:* You must define leverage before calculating it, but you must show the positive cooperation case before the negative reversal case. If you show the reversal first, students will conclude EDT never cooperates. The threshold arithmetic must come before Case 1 so they understand *why* we are calculating leverage, not just *how*.

  ### 2. The Carrying Example
  The "Nine Thousand Silos" is the right vehicle, but trim the Visibility dial.
  *   **Payoff:** Keep it non-rival (public good). This ensures the causal temptation is to free-ride, highlighting the evidential reason to cooperate.
  *   **Signals:** Agents must see **no** shared signal. If they see a common randomizer, CDT can explain cooperation via correlation. The isolation is crucial to force EDT into the driver's seat.
  *   **Dial Order:**
      1.  **Provenance (Exchangeable):** Students compute the update table (0.2/0.8 prior). They must see that "I press" makes "High Tendency" more likely, raising the expected count of others.
      2.  **Provenance (Registrar):** Students compute the constraint. If Total = 3000, and I press, Others = 2999. If I don't, Others = 3000. No table needed; this is logical constraint.
      3.  **Visibility:** Simplify to binary: 0 observed vs. 8999 observed. If 8999 observed, leverage is exactly 0. Do not use the intermediate "10 observed" case; it invites complex sampling questions that waste time.
  *   **Computations:** In Case 1, they must compute the posterior probabilities (0.8 vs 0.2) and the resulting expected counts. In Case 2, they should recognize the arithmetic is trivial ($N-1$ vs $N$) once the constraint is understood.

  ### 3. Misconception Map
  Head these off in the order students will form them:
  1.  **"Correlation requires communication/common cause."**
      *   *When:* During Setup.
      *   *Fix:* Stipulate explicitly: "No shared signal, no communication, no common cause visible to the agents." The correlation is in the *model specification* (exchangeability), not a causal mechanism.
  2.  **"This is magic thinking / CDT creep."**
      *   *When:* After Case 1 Leverage calculation.
      *   *Fix:* Remind them: "EDT does not claim you cause them. It claims your act is *news* about them. You are maximizing expected utility given the news."
  3.  **"One agent among nine thousand cannot matter."**
      *   *When:* During Case 1 Threshold check.
      *   *Fix:* Point to the leverage number. "Individually you are small, but evidentially you are a sample of the whole population. The sample size is 1, the population is 9000. The update scales with population."
  4.  **"Conservation of Evidence violation."**
      *   *When:* During Case 1 Update explanation.
      *   *Fix:* "You are not learning about 8999 specific individuals. You are learning about the *parameter* governing them. One coin flip tells you about the bias of the mint, which applies to all coins."
  5.  **"Knowing the rate and knowing the count are the same."**
      *   *When:* Transition from Case 1 to Case 2.
      *   *Fix:* This is the critical pivot. "In Case 1, the count is uncertain because the rate is uncertain. In Case 2, the count is fixed by fiat. My act changes the *composition* in Case 2, but changes the *expectation of the rate* in Case 1."
  6.  **"Reference Class ambiguity."** (Missing from your list)
      *   *When:* During Setup.
      *   *Fix:* Stipulate: "You know you are identical to the others in decision structure. You are not comparing yourself to humans generally, but to these 8999 specific silos."

  ### 4. Final Check
  **Question:** "The Registrar announces exactly 3000 of 9000 will press. You are in a silo. Payoff is 3 per other presser, cost 1 to press. Do you press?"

  *   **Wrong Answer "Yes":** They are ignoring the fixed-sum constraint (treating it like Case 1). They think their press adds to the total rather than displacing another.
  *   **Wrong Answer "No, because I can't cause them":** They are using CDT reasoning (causal impact is 0) and missing the EDT reversal (evidential impact is -1). They should say "No" but for the right reason (negative leverage).
  *   **Wrong Answer "Indifferent":** They miss the cost/benefit arithmetic (Leverage is -1, Cost is 1, Benefit is 3. Net change is -3 - 1 = -4 vs 0).

  ### 5. Exclusions
  Your list is correct and necessary for a 75-minute session.
  *   **Keep Out:** Functional/Updateless Decision Theory (FDT/UDT). Introducing "logical causation" now will confuse the EDT distinction. Stick to "evidential correlation."
  *   **Keep Out:** Source Code/Seeing Decision Procedures. This turns it into a Newcomb variant rather than a large-world population problem.
  *   **Keep Out:** Iterated Games/Reputation. This invites CDT explanations (future retaliation) which undermines the one-shot lesson.
  *   **Add to Exclusions:** **Psychological Similarity.** Do not let students debate whether they *feel* similar to the others. Stipulate structural identity. Debating psychology wastes time and muddies the formal model.
  *   **Add to Exclusions:** **Continuous Priors.** Stick to the binary hypothesis (0.2 vs 0.8). Calculus-free updates are faster and less prone to algebraic errors on the whiteboard.
