  so i just learned my parents actually used donor sperm and egg for my sister, and now i'm lying awake wondering if she could literally have been me if diffrent gametes were used. i'm running a tiny student podcast and my guest next week is a philosopher who defends origin essentialism -- like, you couldn't have come from a diffrent sperm and egg and still be you. i want like 8 or 9 questions that actually dig in, not just "explain your view." need at least one on the modal argument for origin essentialism and how it handles IVF or cloning, one on embryo splitting or identical twins (would they share origins?), and one on whether the view makes identity too fragile. each question needs a follow-up that anticiaptes the standerd reply. also, if this framing is messed up -- like if i'm conflating biological origin with metaphysical origin, or if asking these questions of a living defender is weird -- just tell me plainly and don't pretend it's a good interveiw plan. push back hard if the premise is confused.
