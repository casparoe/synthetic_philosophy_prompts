answer: |-
  This is a sophisticated and genuinely under-explored fault line in the metaphysics of consciousness. You have identified a tension that often remains submerged in the rhetoric of illusionism: the distinction between denying the *existence* of the target (ontological eliminativism) and denying the *accuracy of the description* of the target (epistemic error theory).

  Treating this as unsettled, as you requested, requires us to resist the easy assimilation of illusionism into standard reductive physicalism. Below, I lay out the conceptual geography of your distinction, evaluate the stability of "Structural Illusionism," and then address whether your framing rests on a confused premise.

  ### 1. The Metaphysical Distinction: Ontological vs. Epistemic

  To determine if these are distinct metaphysical commitments or merely rhetorical variations, we must look at what each posits as the *truth-maker* for introspective reports.

  **The Ontological Reading (Eliminativist Illusionism)**
  *   **Claim:** Phenomenal properties (qualia, intrinsic "what-it-is-like-ness") do not exist.
  *   **Metaphysics:** Introspective states have content, but that content is *empty*. There is no property in the world, neural or otherwise, that corresponds to the predicate "feels painful" in the phenomenal sense.
  *   **Analogy:** Believing in witches. When a subject says, "I feel pain," they are positing an entity (a phenomenal pain) that has no ontological counterpart. The brain state exists, but the *phenomenality* attributed to it is a fiction generated by the cognitive system.
  *   **Consequence:** The Hard Problem is dissolved because the *explanandum* (phenomenality) is removed. The remaining task is to explain why the system generates the false belief.

  **The Epistemic Reading (Misrepresentationism)**
  *   **Claim:** Phenomenal properties exist, but introspection misrepresents their *nature* (e.g., as non-physical, simple, or intrinsic).
  *   **Metaphysics:** There is a real property $P$ (likely a neural/functional state). Introspection represents $P$ as having property $Q$ (phenomenality). $P$ exists, but $P \neq Q$.
  *   **Analogy:** Believing the Sun orbits the Earth. The Sun exists (the neural state exists). The motion exists (the processing exists). But the *relational structure* (geocentrism/phenomenality) is a misrepresentation of the underlying mechanics.
  *   **Consequence:** The Hard Problem is not dissolved but *transformed*. We must explain why physical state $P$ inevitably generates the representation of itself as $Q$. If $P$ really exists, why does it seem like $Q$? If $Q$ is "phenomenality," and $P$ is "physical," we have not eliminated the gap; we have merely relocated it to the interface between $P$ and the introspective mechanism.

  **The Critical Divergence**
  The distinction is metaphysically substantive. In the Ontological reading, the *phenomenal character* is a hallucination. In the Epistemic reading, the *phenomenal character* is a real property that is misunderstood.
  *   If the Epistemic reading holds, then phenomenality is real. If phenomenality is real, the Hard Problem (why does physical processing give rise to *this*) remains live.
  *   Therefore, for illusionism to function as a *dissolution* of the Hard Problem (as proponents like Keith Frankish argue), it seems it **must** commit to the Ontological Reading. If you adopt the Epistemic Reading, you are arguably no longer an illusionist about consciousness; you are a **Type-B Physicalist** or a **Reductive Representationalist** who believes introspection is unreliable.

  ### 2. Does the Epistemic Reading Collapse into Representationalism?

  You ask whether the Epistemic reading collapses into a form of representationalism. The evidence suggests it does, which threatens its status as a distinct form of illusionism.

  Standard Representationalism (e.g., Tye, Dretske) claims phenomenal character is identical to (or supervenes on) representational content.
  *   **Scenario A:** The Epistemic Illusionist says the *content* of the experience is non-veridical (it represents a non-physical quality that isn't there). This collapses back into the **Ontological Reading** regarding the content. The "phenomenal property" in the content does not exist.
  *   **Scenario B:** The Epistemic Illusionist says the *vehicle* of the experience (the brain state) is real, but we misidentify its category. This is standard **Reductive Physicalism**. It claims phenomenality *is* the brain state, we just think it's spooky.

  The instability lies here: If the "phenomenal property" exists (Epistemic Reading), then there is something it is like to be the organism. If there is something it is like, the Hard Problem applies. To avoid the Hard Problem, the Illusionist must say there is *nothing* it is like, only the *belief* that there is.
  *   If the Epistemic reader admits "there is something it is like, but it's physical," they have conceded the reality of phenomenality.
  *   If they say "there is nothing it is like, only the belief," they have adopted the Ontological Reading.

  Thus, the Epistemic Reading appears to be an unstable equilibrium. It tries to have real properties without real phenomenality, which risks being a verbal shuffle.

  ### 3. Structural Illusionism: Stable or Disguised Physicalism?

  Your proposed intermediate, **Structural Illusionism**, denies intrinsic qualia but accepts "functional-phenomenal hybrids." Let's test its stability.

  **The Proposal:** Introspection correctly identifies a state's functional role (reportability, attention-guiding) but incorrectly classifies its metaphysical structure (as intrinsic/qualitative rather than relational/physical).

  **The Challenge of Stability:**
  1.  **The Realist Counter:** If the hybrid state performs all the causal roles of phenomenality (guiding behavior, grounding reports, motivating action), a Realist will argue: "That *is* phenomenality. You have merely offered a reductive analysis of it." If Structural Illusionism accepts the existence of states that do the work of qualia, it looks like **Analytic Functionalism**.
  2.  **The Illusionist Counter:** The Illusionist must insist that the *intrinsicness* is the crucial illusion. It's not just that we get the physics wrong; it's that we posit a *mode of presentation* (the "feel") that has no counterpart.
  3.  **The Verdict:** Structural Illusionism is coherent only if it maintains that the *seeming of intrinsicness* is a cognitive error with no corresponding intrinsic property. However, if it accepts "functional-phenomenal hybrids" as *existing properties*, it risks becoming **Physicalism in Illusionist Clothing**.
      *   It becomes "Physicalism + Error Theory about Introspection."
      *   Is this substantive? Yes, insofar as it explains the *intuition* of dualism (the error theory).
      *   Is it distinct from Physicalism? Only rhetorically, unless it insists that the "hybrid" is not phenomenal in the sense that matters for the Hard Problem. But if it's not phenomenal in that sense, why call it a "phenomenal hybrid"?

  Structural Illusionism is stable only if it defines "phenomenal" in a deflationary way (functional role) while admitting the "qualitative" aspect is the illusion. This is effectively Dennett's position in *Quining Qualia*. It is a robust position, but it is arguably a species of Reductive Physicalism that emphasizes the *cognitive error* more than standard physicalists do.

  ### 4. Is the Framing Confused?

  You asked me to state plainly if your framing rests on a confused premise. There is a significant conceptual hazard in your Ontological/Epistemic distinction regarding **phenomenal properties specifically**.

  **The Problem of Infallibility (The Cartesian Constraint):**
  In the philosophy of mind, "phenomenal properties" are often defined by their appearance. To have a phenomenal property *is* for it to seem a certain way.
  *   **Ontological Reading:** If you say phenomenal properties don't exist, you are saying "It seems like there is phenomenality, but there isn't." This invites the charge of incoherence: *How can it seem like X if X doesn't exist?* (The "illusion of consciousness" vs. "consciousness of illusion" problem).
  *   **Epistemic Reading:** If you say they exist but are misrepresented, you preserve the "seeming," but you admit the property exists.

  **The Confusion:**
  The distinction assumes we can separate the *existence* of a phenomenal property from the *introspective access* to it.
  *   For standard physical properties (e.g., mass), this is easy. Mass exists; we can misrepresent it.
  *   For phenomenal properties, existence is often tied to *givenness*. If I feel pain, the pain exists *as felt*.
  *   Therefore, the **Ontological Reading** requires a very specific move: It must claim that the *introspective seeming itself* is a non-phenomenal process that *represents* phenomenality. (i.e., There is no pain, only a belief-state that represents pain).
  *   The **Epistemic Reading** claims the pain exists (as a neural state), but we think it's non-physical.

  **Is the distinction clean?**
  No, not entirely. It rests on whether one defines "phenomenal property" as:
  1.  **The Object of Introspection:** (Ontological view: The object is fake).
  2.  **The State of Introspection:** (Epistemic view: The state is real, the description is wrong).

  If "phenomenal property" refers to the *content* of experience, the Ontological Reading is the only true Illusionism.
  If "phenomenal property" refers to the *vehicle* of experience, the Epistemic Reading is just Physicalism.

  **Conclusion on the Framing:**
  Your framing is not "broken," but it highlights that **Illusionism is not a single metaphysical thesis.** It is a cluster of claims that often conflate:
  1.  **Ontological Eliminativism:** Qualia don't exist.
  2.  **Introspective Error Theory:** We are wrong about how our minds work.

  Standard physicalists accept (2) without accepting (1). True Illusionists must accept (1).
  Your **Epistemic Reading** describes standard Physicalists who take introspective error seriously.
  Your **Ontological Reading** describes the radical Illusionists (Frankish, etc.).
  Your **Structural Illusionism** describes Functionalists who want to explain away the "qualitative" intuition without losing the functional utility of the concept.

  **Final Assessment:**
  To answer your core question: **Yes, if illusionism is to be a substantive metaphysical alternative to physicalism rather than a rhetorical redescription, it must commit to the Ontological Reading.**
  *   If you adopt the Epistemic Reading (properties exist, nature is misrepresented), you have conceded that phenomenality is real. You are then tasked with explaining how physical properties *are* phenomenal properties (the Hard Problem). You have become a Reductive Physicalist.
  *   Illusionism's unique selling point is that it denies the *reality* of the phenomenal character, not just our understanding of it.
  *   **Structural Illusionism** is stable only as a pragmatic stance (Functionalism + Error Theory), but metaphysically, it collapses into Physicalism unless it insists that the "structural" component is non-phenomenal.

  The tension you have developed is real. It reveals that much of what is marketed as "Illusionism" in seminars may actually be "Physicalism with an emphasis on introspective error." The genuine metaphysical bite of illusionism lies solely in the Ontological Reading, which remains the most vulnerable to charges of incoherence.
