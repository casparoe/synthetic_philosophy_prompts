  **MEMORANDUM TO THE BOUNDARY COMMISSION**
  **FROM:** Commissioner [Your Name]
  **RE:** Ruling Draft: *In re Petition of Mill Creek Settlement*
  **DATE:** October 24, 2023

  ### I. ANALYTICAL PREDICATE

  **1. The Closest Analog**
  The controlling precedent is **Non-Resident Owners**. Like Mill Creek residents, non-resident owners live outside the boundary, are durably affected by our decisions (property values vs. flood risk), and lack physical presence within the district. They were denied the franchise. To rule for Mill Creek, we must distinguish them. The distinction lies in **recourse**: Non-resident owners have access to county zoning appeals and state property law to check our power. Mill Creek has no stormwater authority, cannot incorporate, and faces a County Board that has historically blocked self-governance. This aligns with the **Unchecked-Power Test**.

  However, for the two hundred Mill Creek commuters, the closest analog is the **Commuter Precedent**. They enter the district, are subject to transit police and ordinances, and are already enfranchised under existing rules. [High Confidence]

  **2. Where the Plausible Rules Come Apart**
  *   **The Coercive Power Test:** This rule fits *Commuters*, *Detainees*, and *Non-Resident Owners* (denied). It excludes the general Mill Creek population because they are not subject to arrest, fines, or search by the Authority. Applying this rule leads to **Partial Enfranchisement** (commuters only) or **Denial** (if we view the case as about the settlement, not individuals).
  *   **The Unchecked-Power Test:** This rule fits *Youth* and *Non-Citizen Residents* (stake in future/presence) and distinguishes *Non-Resident Owners* (who have other checks). It includes the general Mill Creek population because the Authority's decision is the sole determinant of their flood safety. Applying this rule leads to **Full Enfranchisement** or a **Delegate**.

  These rules diverge on the 700 non-commuting residents. Coercive Power excludes them; Unchecked Power includes them. [High Confidence]

  **3. Statutory Weight**
  The enabling statute specifies "inhabitant voters."
  *   **Full Enfranchisement:** Requires statutory amendment. Mill Creek residents are not "inhabitants" of the district. Precedent (*Non-Resident Owners*) also bars this. [High Confidence]
  *   **Delegate/Advisory Seat:** Does not require amendment if structured as a procedural accommodation rather than a franchise expansion. This allows us to address the "Unchecked Power" equity without violating the "Inhabitant" text. [Medium Confidence]

  **4. The Discriminating Future Case**
  The single further case that would best discriminate between the surviving rules is: **A neighboring incorporated city with its own elected council and stormwater board.**
  *   If they petition for a vote because our upstream release affects them, the *Unchecked-Power Test* suggests they should get a delegate (they are affected, but have their own council).
  *   The *Coercive Power Test* suggests denial (they have their own coercive apparatus).
  *   Ruling on this would clarify whether "lack of *any* recourse" is required, or merely "lack of *effective* recourse." [Medium Confidence]

  ***

  ### II. DRAFT RULING

  **CEDAR BASIN REGIONAL AUTHORITY**
  **BOUNDARY COMMISSION**
  **RULING NO. 24-09**

  **IN RE: PETITION OF MILL CREEK SETTLEMENT**

  **OPINION OF THE COMMISSION**

  **I. SUMMARY OF DECISION**
  The Commission grants the Petition of Mill Creek Settlement in part. We deny the request for full franchise enfranchisement for the general population of Mill Creek. We affirm the existing franchise eligibility of the approximately two hundred (200) Mill Creek residents who qualify as commuters under *Precedent 3*. We further order the creation of a single **Delegate Seat with Voting Rights** on the Authority's Advisory Board, to be elected by the qualified voters of Mill Creek, specifically for matters pertaining to stormwater and zoning. [High Confidence]

  **II. PRECEDENTIAL ANALYSIS**
  Our track record establishes that physical presence and subjection to coercive authority are the primary gates for the franchise (*Commuters*; *Pretrial Detainees*). Economic interest alone is insufficient (*Non-Resident Owners*). Durability of stake can overcome age or citizenship barriers (*Youth*; *Non-Citizen Residents*), but transience defeats it (*Seasonal Farmworkers*).

  Mill Creek presents a conflict between the **Coercive Power Test** and the **Unchecked-Power Test**.
  1.  **Coercive Power:** The majority of Mill Creek residents are not subject to our police, fines, or ordinances. They do not enter the district. Under a strict reading of *Commuters* and *Non-Resident Owners*, they are ineligible. [High Confidence]
  2.  **Unchecked Power:** Unlike *Non-Resident Owners*, who retain recourse through county courts and zoning boards, Mill Creek residents face a regulatory vacuum. The County has disclaimed stormwater authority. Annexation is blocked by this Authority. Incorporation is blocked by the County. Our engineering models confirm our decisions determine their flood risk. They are subject to our power without the possibility of checking it through any other ballot box. [High Confidence]

  We find that where the *Unchecked-Power Test* reveals a total absence of alternative recourse, strict adherence to the *Coercive Power Test* creates a democratic deficit inconsistent with the spirit of *Youth* and *Non-Citizen Residents* precedents (which prioritize stake over formal status). However, we are bound by the statutory limitation of "inhabitant voters." [High Confidence]

  **III. STATUTORY CONSTRAINT**
  The Authority's enabling statute limits the franchise to "inhabitants." To grant full voting rights to non-inhabitants would require legislative amendment. We decline to interpret "inhabitant" so loosely as to include those residing outside the boundary, as this would quietly reverse *Non-Resident Owners* without the legislature's consent. [High Confidence]

  **IV. REMEDY**
  To reconcile the equity of the *Unchecked-Power Test* with the statute and *Non-Resident Owners* precedent, we establish a Delegate Seat. This acknowledges the specific vulnerability of Mill Creek regarding stormwater without dissolving the district boundary. The Delegate shall vote on the Advisory Board, which sets the agenda for the Commission on stormwater issues. [Medium Confidence]

  **V. CONCLUSION**
  The precedents run out at the edge of the boundary, but the obligation to avoid unchecked power does not. We bridge this gap with the Delegate mechanism.

  **SO ORDERED.**

  ***

  **NOTE ON DEMOCRATIC THEORY**
  **Claim Subject to Objection:** "We bridge this gap with the Delegate mechanism." [High Confidence]
  **Expected Objection:** A democratic theorist would reject the claim that a **Delegate with Voting Rights on an Advisory Board** constitutes a sufficient remedy for the "Unchecked Power" identified. They would argue that creating a class of voters with diluted influence (advisory vote vs. full franchise) violates the principle of political equality, effectively institutionalizing a "second-class citizenship" for those affected by the Authority's coercive outcomes but excluded from its primary electorate. [High Confidence]
