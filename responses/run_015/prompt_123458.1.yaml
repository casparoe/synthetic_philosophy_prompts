answer: |-
  ### Strategic Concessions (Say this early)
  *   **Textual Provenance:** Acknowledge upfront that the "Four Seasons" passage is in the *Outer Chapters* (18), not the *Inner Chapters*. Clarify that you are treating the *Zhuangzi* as a coherent philosophical project regarding *hua* (transformation), regardless of the authorship debate, but you aren't claiming Zhuangzi himself wrote every line.
  *   **Methodological Limits:** Concede that Zhuangzi is not an analytic metaphysician. You are not claiming he *answers* analytic questions, but that his ontology *dissolves* the premises required to ask them.
  *   **Confucian Intent:** Acknowledge that Confucian mourning is primarily about social cohesion, not metaphysical claims. Your claim is that it *presupposes* a metaphysics of persistent identity that conflicts with Daoist naturalism.

  ---

  ### Q&A Prep Sheet

  #### 1. The Category Error Objection (Morris/Chen Hybrid)
  **Objection:** "Aren't you committing a category mistake? Zhuangzi offers a therapeutic skepticism to alleviate suffering, not a dogmatic metaphysics of identity conditions. By claiming cryonics is 'conceptually incoherent' rather than just 'existentially misguided,' aren't you smuggling analytic identity theory into a text that explicitly rejects such fixed definitions?"

  **Two-Minute Reply:**
  "That's the core tension, and I appreciate the precision. My claim isn't that Zhuangzi provides a rival set of identity conditions—like Locke or Parfit—but that he ontologizes *change* itself. If reality is fundamentally *hua* (transformation), then any project attempting to arrest transformation (cryonics) or abstract identity from its material context (uploading) isn't just ethically wrong; it's ontologically false within that framework. It's like trying to freeze a river and claim it's still flowing. I'm not using analytic tools to build a Zhuangzian theory of identity; I'm using Zhuangzi to show why the analytic search for fixed identity conditions is the error itself. The incoherence lies in the project's goal, not in failing to meet a specific continuity criterion."

  **Softest Point:** Morris will press you on whether "ontologically false" is just your analytic framing imposed on a therapeutic text. You risk turning Zhuangzi into a dogmatic realist about change.

  #### 2. The Textual Attribution Objection (Chen)
  **Objection:** "You're building your metaphysical heavy lifting on the 'Four Seasons' passage in Chapter 18. But Professor Chen knows the 'Great Clod' imagery is Inner Chapter (6), while the Seasons analogy is Outer. The Outer Chapters often systematize the Inner. Are you conflating a later follower's consolatory metaphor with Zhuangzi's actual metaphysical skepticism?"

  **Two-Minute Reply:**
  "You're right to flag the philology. However, the 'Great Clod' (Inner) and the 'Four Seasons' (Outer) both rely on the same mechanism: the dissolution of the subject-object boundary via natural transformation. Even if the Seasons passage is later, it operationalizes the Inner Chapter's metaphysics of *wu hua* (transformation of things). My argument doesn't rest on Zhuangzi the historical figure writing every word, but on the *Zhuangzi* text functioning as a unified critique of self-preservation. Whether it's consolation or reductio depends on whether you think the text aims to comfort the self or dissolve the need for comfort. I'm arguing for the latter, which aligns the Outer imagery with the Inner metaphysics."

  **Softest Point:** Chen knows the textual history better than you. If he insists the Outer Chapters represent a doctrinal shift away from skepticism, your "unified project" defense weakens.

  #### 3. The Psychological Continuity Objection (Morris)
  **Objection:** "If the self is just a temporary gathering of qi, why couldn't digital uploading be just another 'transformation'? If psychological continuity is preserved, isn't the upload just a new phase of the seasons, rather than an incoherent attempt to stop them?"

  **Two-Minute Reply:**
  "Because the seasons analogy isn't about continuity of pattern; it's about the inevitability of dissolution. Uploading presupposes that the *pattern* is the self, independent of the *qi* that constitutes it. For Zhuangzi, the self isn't the pattern; it's the process of gathering and scattering. To extract the pattern is to kill the process. It's not a new season; it's pretending the leaf can exist without the tree. The 'harm' isn't to the person, but to the Dao itself—forcing a separation where there is only integration. So it's not that the upload isn't 'you'; it's that the desire to make it 'you' violates the nature of existence."

  **Softest Point:** Morris will argue that "process" can be instantiated digitally. You need to hold the line that material qi is non-fungible in Zhuangzi's cosmology.

  #### 4. The Consolation Objection (Classmates)
  **Objection:** "But Zhuangzi sings when his wife dies. That looks like coping. If it's just a metaphysical correction, why the emotional performance? Isn't it simpler to say he's just chill about dying?"

  **Two-Minute Reply:**
  "'Chill' implies he still feels the loss but manages it. I'm arguing he realizes there's no subject left to lose anything. The singing isn't coping; it's the audible symptom of recognizing the error. It's the difference between accepting a tragedy and realizing the tragedy was a category error. If death is just the seasons changing, grief is a cognitive mistake about permanence. He sings because he sees the machinery of transformation clearly, not because he's soothing his grief."

  **Softest Point:** It is phenomenologically hard to deny that singing functions as emotional regulation, even if the metaphysics say otherwise.

