  Dr. Kantowski, a moral philosopher, was hosting a joint symposium on "Universal Moral Truths." He had invited a group of WEIRD undergraduates and a delegation of Traditional Elders to prove his theory: that cultural differences in morality weren't proof of relativism, but rather different angles on the same Objective Mountain.

  "Just look at the data!" Kantowski announced, gesturing wildly. "When an accident happens, you Westerners ask, 'What did he *mean* to do?' And you, Elders, ask, 'What *happened* to the world?' You're both feeling the same Moral Gravity, just measuring it with different instruments!"

  To demonstrate, he reached for a ceremonial urn on the table to show how "intent transforms matter." His sleeve caught the rim. The urn shattered.

  The room gasped.

  The WEIRD grad student immediately raised a hand. "Dr. Kantowski, it's okay! It was clearly an accident. Your intent was pedagogical, not destructive. Morally, you're clean."

  The Lead Elder stood up slowly, looking at the shards. "The vessel is broken. The ancestors are disturbed. The harm is done. You carry the stain."

  Kantowski beamed. "Perfect! See the variance? That proves there's an Objective Truth we're all groping for!"

  He pulled out a marker and wrote on the whiteboard: **Moral Value = (Intent + Outcome) / 2**.

  "I've synthesized the data," Kantowski declared. "To be Objective, we must honor both views equally. Since my Intent was 100% Good, and the Outcome was 100% Bad, my Moral Score is Zero. I am morally neutral."

  The grad student frowned. "Wait. If you're neutral, why aren't you apologizing? You still *chose* to gesture near the urn. Your agency matters." (Offended: WEIRD morality requires internal guilt and acknowledgment of agency, not just neutral math).

  The Elder shook his head. "If you are neutral, why are you still standing here? The stain is on the floor. It requires cleansing, not calculation." (Offended: Non-WEIRD morality requires physical restoration or purification, not abstract scoring).

  Kantowski blinked. "But... I used your own data to find the middle ground!"

  The Elder pointed to the door. "You have calculated the weight of the sin, but you have not lifted the finger."

  The student added, "Yeah, dude. You can't math your way out of being a jerk."

  Kantowski looked at his equation, then at the angry crowd. "So... the Objective Truth?"

  The Elder and the Student spoke in unison: "You're fired."

  Kantowski sighed, stepping over a shard. "Well, at least we agree on the outcome."

  "No," said the student. "You think the outcome is 'data.' We think the outcome is 'you leaving.'"

  "And," added the Elder, "one of those outcomes is unclean."
