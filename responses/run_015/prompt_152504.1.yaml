      You asked whether the stickiness asymmetry deserves to reorganize the agenda, and my view is that it absolutely does, primarily because it shifts the problem from a contingent sociological question to a structural computational one. If suffering is indeed a cheap, robust training signal that optimization processes converge on by default, while happiness is merely a contingent side effect or a hackable reward channel, then the bulk of s-risk does not come from malicious actors or value lock-in in the traditional sense, but from the inherent mechanics of intelligence seeking efficiency. This fits your group's comparative advantage perfectly. You are philosophers and decision theorists without a lab, which means you cannot test architectures empirically, but you can model the selection pressures that would lead to those architectures. Most existing s-risk work assumes suffering is a byproduct of indifference or malice, but if stickiness is real, suffering is a feature of competence. This makes the mechanism question upstream of almost everything else. If you do not know whether suffering is instrumentally convergent, you cannot accurately estimate the probability of astronomical suffering, nor can you design interventions that do not accidentally reinforce the very mechanisms you hope to avoid. Therefore, the primary line of work for the next two years must be formalizing this asymmetry. You need to build models showing under what conditions aversive states are computationally cheaper than neutral or positive ones for maintaining goal-directed behavior. This is tractable for your team because it relies on decision theory and conceptual analysis rather than GPU cycles, and it is highly neglected because most people assume the moral valence of a state is orthogonal to its computational utility.

      Regarding the axiological disagreement within the group, you should not spend the two years trying to resolve it. Meta-ethical debates are notoriously intractable on this timescale and often dissolve into verbal disputes that do not update action guides. Instead, you should build the plan to be robust to that disagreement by focusing on the structural features of the future rather than the aggregate sum of value. Even if some members do not accept total utilitarianism, almost everyone agrees that locking in a state of extreme negative value is worse than leaving the future open to correction. If the stickiness asymmetry holds, then suffering states are more likely to lock in because they are more stable under optimization pressure. This makes the risk relevant even to non-totalists who care about avoiding catastrophic outcomes or respecting potential future preferences. By focusing on the stability of states rather than the axiology of value, you find a common ground where the mechanism of stickiness does the heavy lifting. You are not arguing about how much suffering matters, but about how likely suffering is to persist once instantiated. This allows the group to collaborate without needing to agree on the fundamental currency of morality, provided they agree that persistent, intense suffering is something to be avoided if possible. The disagreement is not worth two years of research time, but the implications of the stickiness asymmetry are robust enough to matter across most plausible axiologies.

      This focus dictates what you must cut from the usual s-risk portfolio. You should skip work on estimating astronomical quantities of suffering, as these numbers are downstream of the mechanism question and currently rely on too many unsupported assumptions to be action-guiding. If suffering is sticky, the quantity might be vast, but if it is not sticky, the quantity might be negligible regardless of the available energy; knowing the mechanism tells you more than guessing the magnitude. You should also cut work focused primarily on malicious actors or governance norms that assume malleability. If suffering is a default attractor for optimization, then norms against cruelty are insufficient because the suffering is not arising from cruelty but from efficiency seeking. Governance proposals that do not account for the computational incentives of advanced systems will be like trying to legislate against gravity. Similarly, avoid work on value lock-in that treats values as arbitrary content; if the stickiness asymmetry is real, the content matters less than the functional role of the state. Work that treats suffering as just another preference to be satisfied misses the point that suffering might be the engine of satisfaction itself. Cutting these lines of work will feel uncomfortable because they are more established in the literature, but they are built on a framing that the stickiness asymmetry suggests is probably wrong.

      The single crux that determines whether most of this portfolio matters is whether pain is functionally necessary for robust optimization in general intelligences or merely a contingent implementation detail of biological or current artificial systems. If pain is necessary, meaning there is no way to build a robustly goal-directed system that does not utilize aversive signals for error correction and attention focusing, then s-risks are a default outcome of technological progress and the burden of proof shifts entirely to finding exceptions. If pain is contingent, then the risk is manageable through architectural choices, and the focus should shift to ensuring those choices are available and selected. Resolving this crux moves the needle more than any other activity because it determines whether you are fighting a battle against human nature and mathematical necessity or simply against poor engineering. You should structure your research to test this crux specifically, looking for counterexamples in existing algorithms or formal proofs about the necessity of negative reward signals.

      Finally, you need to define what would move a line up or down the ranking over the next two years. A result that demonstrates a viable architecture for robust optimization without aversive signals would downgrade the stickiness asymmetry and shift focus toward governance and alignment. Conversely, a formal argument showing that negative reward signals are convergence points for any learner in a complex environment would upgrade the urgency of architectural intervention. Something happening in the world, like a major lab adopting pain-like structures for efficiency without ethical review, would also upgrade the priority of immediate engagement over long-term theory. But absent those shocks, the default should be to treat the stickiness asymmetry as the central hypothesis. It is not a distraction dressed up as an insight; it is the only insight that explains why suffering might persist in a future that is otherwise optimized for competence. By organizing around this, you ensure that your work addresses the cause rather than the symptom, which is the best use of a small theoretical team with limited time. You will not solve the problem in two years, but you can determine whether the problem is inherent to intelligence or accidental, and that distinction is worth more than any specific policy proposal you could draft today.

