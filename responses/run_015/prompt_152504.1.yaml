      *   Claim: Suffering is functionally useful for optimization (training signals, attention), happiness is not.
      *   Implication: Future systems might inherently select for suffering architectures even without malicious intent.
      *   Relevance to Group: They do arguments and formal models, not empirical ML. This fits well. They can model selection pressures.
      *   Verdict: It deserves to reorganize the agenda because it shifts focus from "how much suffering" to "what mechanisms preserve suffering."

  3.  **Determine Priorities (Upstream/Downstream):**
      *   Upstream: Mechanisms of selection, computational functionalism of pain vs. pleasure, game theory of preservation.
      *   Downstream: Specific policy interventions, totalist vs. non-totalist debates (maybe), specific astronomical waste calculations.
      *   Tractability: High for philosophers/theorists. Low for empirical ML (which they aren't doing anyway).
      *   Neglectedness: High. Most s-risk work focuses on malicious actors or lock-in, not inherent optimization pressures.

  4.  **Address Axiological Disagreement:**
      *   Some don't care about total suffering.
      *   Option A: Build robustness (focus on things everyone agrees are bad).
      *   Option B: Resolve the disagreement (meta-ethics).
      *   Recommendation: Build robustness around the *mechanism* rather than the *value*. If suffering is sticky, it's a risk regardless of whether you're a total utilitarian or a prioritarian, unless you're a strict hedonistic non-existence preferentist. But actually, if the stickiness asymmetry holds, it makes suffering a *structural* feature of optimization, which matters even if you weigh suffering less, because the volume might be so vast. However, spending 2 years on meta-ethics is low tractability. Better to focus on the mechanism which is action-guiding regardless of precise axiology (avoiding lock-in of bad states).

  5.  **Identify What to Cut:**
      *   Cut: Speculative astronomy of suffering quantities (too downstream, depends on the mechanism).
      *   Cut: Malicious actor focus (too narrow, stickiness suggests benign optimization does it too).
      *   Cut: Pure meta-ethics to resolve axiology (low tractability).
      *   Cut: Governance proposals that assume malleability (if suffering is sticky, governance needs to be about architecture, not just norms).

  6.  **Identify the Single Crux:**
      *   Is suffering functionally necessary for robust optimization in general intelligences, or is it a contingent implementation detail? If necessary, s-risks are default. If contingent, we can engineer around it.

  7.  **Drafting - Section by Section (mental outline):**
      *   Intro: Acknowledge the constraint and the stickiness asymmetry.
      *   Evaluate Stickiness: It's not a distraction, it's the core. Shifts from quantity to mechanism.
      *   Upstream/Downstream: Mechanism is upstream. Quantities are downstream.
      *   Axiology: Don't solve it, work around it. Focus on structural risks.
      *   What to Cut: Malicious actor focus, pure quantity estimation, governance without mechanism.
      *   The Crux: Functional necessity of pain.
      *   Update Conditions: What changes the plan? (New ML architectures, proof of painless optimization).
      *   Conclusion: Commit to the mechanism focus.

  8.  **Writing - Monitoring Word Count and Format:**
      *   Must be continuous prose.
      *   No bolding.
      *   No lists.
