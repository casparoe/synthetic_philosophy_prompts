      *   **Factory Farming (3):** Inefficacy objection fails. Probability of affecting supply chain is tiny/nil (threshold problems). Stakes are huge (suffering). Cost is low (taste/convenience). Action: Don't buy. *Crucial Note:* User admits counterfactual difference is "basically nil" but still calls it "wrong."
      *   **Non-Consequentialist Reasons (4):** Suspicious of complicity, expression, fair share. Wants outcome-based reasons.
