          *   *Resolution Cost:* Either admit meat buying is permissible (hard for most ethicists) or admit personal carbon reduction has value (hard for the user's political focus). Or, find a causal mechanism for meat that doesn't exist for climate (e.g., signaling to peers).
      *   **Rank 2 (Severe): Outcome-Based Morality vs. Meat Verdict (4 vs. 3).**
          *   *Why:* User explicitly rejects non-consequentialist reasoning (4) but relies on it implicitly to condemn meat buying in (3) given the admission of nil causal impact.
          *   *Resolution Cost:* Either accept non-consequentialist reasons (complicity/integrity) which undermines the "hard-nosed CEU" persona, or admit meat buying is causally neutral (and thus permissible under strict CEU).
      *   **Rank 3 (Significant): Voting vs. Donations (2 vs. 6).**
          *   *Why:* User admits donations do more good than voting but votes and doesn't donate more.
          *   *Resolution Cost:* Either vote less/donate more (aligns with CEU), or admit there's a non-CEU reason for voting (civic duty) which undermines (1).
      *   **Rank 4 (Dissolvable): Causal Probability in Meat (1 vs. 3).**
          *   *Why:* Economic theory suggests individual purchases *do* have expected impact (signal to retailer), even if thresholds exist. It's not "nil," it's "small probability of large effect."
          *   *Resolution:* This isn't a tension, just a factual error. If corrected, (3) aligns better with (1).

  4.  **Drafting the Audit:**

      *   *Introduction:* Acknowledge the sophistication of the position. It's a standard "Consequentialist with pockets of deontology" setup.
