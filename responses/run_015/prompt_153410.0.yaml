      *   *The Hidden Deontology (Meat vs. Outcome-Only):* Point out that (3) secretly relies on (4)'s rejected concepts.
      *   *The Voting/Donation Asymmetry:* Address the resource allocation inconsistency.
      *   *The "Nil" Probability Claim:* Challenge the economic assumption in (3).
      *   *Conclusion/Ranking:* Summarize the costs of fixing each.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I respect the "Causal Expected Utility" constraint?
      *   *Correction:* In the Meat vs. Climate section, I need to emphasize that *causally* they are identical (threshold problems). If the user insists on causal reasons only, they must treat them the same.
      *   *Check:* The user says about donations: "marginal dollar... does more expected good than my trip to the polling station." This is a direct admission of inconsistency with (2).
      *   *Check:* The user says about meat: "counterfactual difference is basically nil." If it's *nil*, CEU = 0. If it's *small*, CEU > 0. I need to press on whether they mean "statistically negligible" or "literally zero."
      *   *Nuance:* The climate argument (5) is about *focus* ("only lever that matters is collective"), whereas meat (3) is about *permissibility* ("wrong thing to do"). I need to make sure I don't conflate "wrong to do" with "wrong to focus on." But (5) implies individual footprint reduction is a waste of effort ("roll my eyes"), whereas (3) implies meat buying is morally negative.

