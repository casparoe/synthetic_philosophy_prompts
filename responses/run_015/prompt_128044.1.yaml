        "why_it_dissolves": "why they dont actually clash"
      }
    ],
    "single_best_revision": "the one commitment that, if revised, cleans up the most problems"
  }

  this is an audit, not a lecture — no bibliography, no reading list, no named citations. just trace what commits me to what.
