prompt: |-
  I'm in the final year of a PhD in philosophy (decision theory and social choice, with a side interest in global priorities research), and I've been asked to write an internal agenda memo for a small foundation that funds work on how to prioritize causes. They have roughly one postdoc-year of conceptual work to allocate over the next two years — call it four short commissioned papers, or one junior researcher's year — and the question put to me is this: which unresolved conceptual questions about cause prioritization itself should a funder commission work on, and in what order? The counterfactual matters, because I have to be able to say why a conceptual question deserves a slot: the alternative use of the same money is another round of empirical reports on particular cause areas.

  What I do not want is a survey of the literature or a catalogue of the familiar objections. I already know the standard list: that the importance, tractability, and neglectedness factors are supposed to combine multiplicatively, and that little has been said about why that combination rule is the right one; that tractability and neglectedness both look like ways of getting at marginal returns and may therefore double-count; that the framework is silent about the units in which each factor is measured and about how those units are traded off against one another; that it scores causes one at a time and so says nothing about portfolios, sequencing, or complementarities between causes; and that it yields a ranking without yielding a size, telling you which cause is best but not how much of a fixed budget to commit to it. Assume all of that is on the table. What I want is a defended ordering of a subset of these questions, plus questions I have not listed, with the ordering argued for rather than asserted.

  Three half-formed thoughts of my own, which I would like ranked against the others or dismissed outright:

  First, a granularity worry. The score a cause receives seems to depend on how finely the space of causes is carved up: subdividing a cause can make each part look more neglected and less tractable without anything changing in the world, which suggests the framework has no principled level of application. Is this a genuine defect or a confusion about what the framework is for, and is settling it upstream of the double-counting worry?

  Second, a shape-of-the-return-curve worry. If we treat value produced in a cause as a function of resources devoted to it, the three factors look like a local, first-order summary of that function. But the questions people actually use the framework to answer concern how much to fund, and those may depend on the global shape of the curve — thresholds, lumpiness, regions of increasing returns — which a local summary discards. Is the worthwhile project here repairing the framework or replacing it with something like an explicit funding-return curve, and which of the standard objections would then simply evaporate?

  Third, a reading worry: whether the framework is best understood as a claim about what makes a cause a good one in the first place, or as a heuristic for allocating a fixed budget under severe uncertainty. My suspicion is that several of the standard disputes are really disputes between these two readings, and that separating them dissolves some apparent problems while making others considerably harder.

  For each of the four or five questions you put at the top, I want: what it is upstream of, in the sense that settling it would change the answer to other questions or change an actual allocation decision; who could settle it within the budget, given that a philosopher working alone is a different prospect from a project needing empirical input the funder is not buying; what an unexciting answer would look like, since conceptual work often resolves a question in a way that leaves practice untouched; and what argument or evidence in the next two years should move it up or down the list. I also want you to name two or three items on the standard list you would defund, with the reason — effectively settled already, too dependent on empirical contingencies to reward a conceptual paper, or simply not decision-relevant — and to flag where my three thoughts above are confused rather than merely underdeveloped.

  One methodological point I want addressed rather than set aside. This whole exercise applies something very like the framework to the question of which questions about the framework to fund: importance for whom, tractability given what background, neglectedness measured against which population of researchers. If the framework cannot be applied reflexively without circularity, say so, and tell me what to use instead for the ordering. Please do not include a bibliography or reading list; I will fill in citations myself.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda memo:

  1.  **Analyze the Request:**

      *   **User:** Final year PhD in Philosophy (Decision Theory/Social Choice), interested in Global Priorities Research (GPR).
      *   **Task:** Write an internal agenda memo for a small foundation funding cause prioritization research.
      *   **Budget:** Roughly one postdoc-year over two years (4 short papers or 1 junior researcher year).
      *   **Goal:** Identify and order unresolved *conceptual* questions about cause prioritization itself.
      *   **Constraint 1 (Crucial):** Do *not* provide a survey of literature or catalogue familiar objections (ITN multiplicative rule, double-counting, units, portfolio/sequencing, sizing). Assume these are known.
      *   **Constraint 2:** Defend an *ordering* of a subset of questions (including the user's three "half-formed thoughts").
      *   **Constraint 3:** For each top question, specify:
          *   Upstream impact (what does settling this change?).
          *   Feasibility (can a philosopher settle this alone?).
          *   "Unexciting answer" (what does a null result look like?).
          *   Update conditions (what moves it up/down the list?).
      *   **Constraint 4:** Name 2-3 items from the "standard list" to *defund* (and why).
      *   **Constraint 5:** Critique the user's three thoughts (rank, dismiss, or flag confusion).
      *   **Constraint 6:** Address the methodological point: Applying the framework reflexively to itself (circularity risk).
      *   **Constraint 7:** No bibliography/reading list.
      *   **Tone:** Professional, rigorous, decision-theoretic, suitable for a foundation internal memo.

  2.  **Deconstruct the User's "Half-Formed Thoughts":**

      *   *Thought 1: Granularity.* (Does carving causes finely change scores artificially?)
          *   *Assessment:* This is a serious formal problem related to the "partition dependence" in probability and value theory. It's upstream of measurement.
      *   *Thought 2: Shape-of-Return-Curve.* (Local vs. Global summary.)
          *   *Assessment:* This is essentially the "sizing/portfolio" objection repackaged. It might be too empirical/mathematical for pure conceptual work, but the *concept* of what the framework *is* (heuristic vs. model) is philosophical.
      *   *Thought 3: Reading Worry.* (Normative claim vs. Heuristic under uncertainty.)
          *   *Assessment:* This is the most fundamental philosophical question. It determines the *kind* of justification required. It is highly upstream.

  3.  **Address the Methodological Point (Reflexivity):**

      *   The prompt asks to use the framework to prioritize research *about* the framework.
      *   *Risk:* Circularity. If the framework is broken, using it to fix itself is bootstrapping.
      *   *Solution:* Use a "meta-decision" approach. We aren't using ITN to prioritize causes; we are using *value of information* (VOI) logic applied to decision-making under uncertainty. The "cause" is "improving the decision procedure." The "impact" is the expected improvement in allocation efficiency. This avoids circularity by shifting the level of analysis from *object-level prioritization* to *procedural optimization*.

  4.  **Select and Order the Top Questions:**

      *   *Priority 1: The Ontological Status (User's Thought 3).* Before fixing the math, we need to know what the math *represents*. Is it truth-apt or a tool? This dictates whether we look for axiomatic justification or pragmatic validation.
      *   *Priority 2: The Unit of Analysis/Granularity (User's Thought 1).* Once we know what the framework is, we need to know what goes into the variables. If "cause" is ill-defined, the inputs are garbage.
      *   *Priority 3: Dynamic Allocation vs. Static Ranking (The "Sizing" problem, but conceptualized).* Moving from "which cause" to "how much." This connects to the return curve (User's Thought 2) but focuses on the decision rule.
      *   *Priority 4: Uncertainty Handling.* How do we aggregate radical uncertainty (model uncertainty) within the framework? (New addition, crucial for GPR).

  5.  **Select Items to Defund (from the "Standard List"):**

      *   *Multiplicative vs. Additive:* Too mathematical/empirical. Depends on the "Reading" (Thought 3). If it's a heuristic, the functional form matters less than robustness.
      *   *Units/Trade-offs:* This is essentially an empirical calibration problem, not a conceptual one. Philosophers can't solve "how many lives per dollar" conceptually.
      *   *Double-counting (Tractability/Neglectedness):* This is largely resolved by defining terms precisely (marginal vs. total). A conceptual paper won't add much over a good glossary.

  6.  **Drafting the Content - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** Acknowledge the constraint (conceptual vs. empirical) and the reflexivity issue.
      *   **Methodological Note:** Address the circularity risk immediately. Propose VOI/Meta-decision approach.
      *   **The Agenda (Ordered):**
          1.  *Status of the Framework (Thought 3).* Upstream of everything. Feasible for a philosopher. Unexciting answer: "It's just a heuristic, stop looking for axioms."
          2.  *Granularity/Partition Dependence (Thought 1).* Upstream of measurement. Feasible (formal philosophy). Unexciting answer: "Use exogenous categories."
          3.  *The Allocation Rule (Sizing).* Upstream of actual funding. Feasible (decision theory). Unexciting answer: "Stick to ranking, sizing is empirical."
          4.  *Model Uncertainty.* (New). Upstream of confidence. Feasible. Unexciting answer: "Use standard sensitivity analysis."
      *   **Critique of User's Thoughts:**
          *   Thought 3: Promote to #1.
          *   Thought 1: Promote to #2.
          *   Thought 2: Merge into #3 (Shape of curve is part of allocation rule).
      *   **Defunded Items:** Multiplicative rule, Units, Double-counting.
      *   **Conclusion:** Summary of value add.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I explain *why* the ordering is defended?
      *   *Correction:* Ensure I explicitly state the dependency chain. (e.g., You can't solve Granularity until you know if the framework is descriptive or normative).
      *   *Check:* Did I address the "Who could settle it" constraint?
      *   *Correction:* Be specific. "A decision theorist," "Requires empirical input?" (Try to keep it conceptual).
      *   *Check:* Reflexivity.
      *   *Correction:* Make sure the distinction between *object-level* ITN and *meta-level* VOI is clear. We are prioritizing *research* to reduce *decision error*, not prioritizing causes using ITN.

  8.  **Final Polish:**

      *   Tone check: Is it academic but actionable?
      *   Ensure no bibliography.
      *   Ensure the "Unexciting Answer" sections are realistic (philosophy often dissolves problems rather than solving them).
      *   Make sure the critique of the user's thoughts is sharp but respectful.

  9.  **(Post-Drafting Review against constraints):**
      *   4-5 questions? Yes (4 selected).
      *   Upstream/Feasibility/Unexciting/Update conditions for each? Yes.
      *   2-3 defunded items? Yes.
      *   User's 3 thoughts addressed? Yes.
      *   Reflexivity addressed? Yes.
      *   No bibliography? Yes.

  10. **Final Output Generation** (Proceed to generate response based on these steps).
answer: |-
  **MEMORANDUM**

  **TO:** Program Director, Global Priorities Foundation
  **FROM:** [Your Name/Consultant]
  **DATE:** October 26, 2023
  **SUBJECT:** Conceptual Research Agenda: Cause Prioritization Framework (2024–2026)

  ### 1. Methodological Preamble: The Reflexivity Problem

  You have asked me to apply a prioritization framework to the question of how to improve that same framework. If we apply the Importance-Tractability-Neglectedness (ITN) schema directly to research questions about ITN, we risk circularity: we would be using a potentially flawed metric to diagnose the flaw.

  To avoid this, this agenda does not use ITN to prioritize research. Instead, it uses a **Value of Information (VOI)** approach grounded in decision theory. The "cause" here is *reducing decision error in resource allocation*. The "impact" is the expected increase in the efficacy of the foundation's future grants resulting from clarified concepts. The "tractability" is the likelihood that philosophical analysis (distinct from empirical data gathering) can resolve the ambiguity. The "neglectedness" is the degree to which the current literature relies on tacit assumptions rather than explicit formalization.

  This shifts the justification from "this question is important within the framework" to "answering this question reduces the risk that the framework is being applied outside its domain of validity."

  ### 2. The Prioritized Agenda

  I propose four conceptual projects, ordered by logical dependency. Settling Question 1 is a prerequisite for making progress on Question 2; settling 2 is necessary for 3.

  #### Priority 1: The Ontological Status of the Framework (Normative vs. Heuristic)
  *Corresponds to your "Reading Worry."*

  **The Question:** Is the ITN framework a normative claim about the structure of value (i.e., a cause *is* good if and only if it scores high on these factors) or a pragmatic heuristic for search under severe uncertainty (i.e., these factors are reliable proxies for value when we cannot calculate expected value directly)?

  **Upstream Impact:** This is the root node. If the framework is normative, we require axiomatic justification and must resolve inconsistencies (like double-counting) as fatal errors. If it is heuristic, inconsistencies are tolerable provided the heuristic remains robust. This determines whether we attempt to repair the math or replace the tool.

  **Who Can Settle It:** A philosopher of decision theory. This requires no empirical data, only conceptual analysis of the framework's justification in existing literature and its coherence with standard decision rules.

  **The Unexciting Answer:** The conclusion that the framework is *only* a heuristic with no normative force. This would limit the foundation's ability to use the framework for public justification, restricting it to internal triage. It dissolves the pressure to find a "correct" combination rule but lowers the ceiling on the framework's authority.

  **Update Conditions:** Move **up** if current grantmaking disputes reveal fundamental disagreement on *why* a cause was rejected (e.g., "it failed the metric" vs. "the metric doesn't apply here"). Move **down** if the foundation is willing to treat the framework as purely internal and informal.

  #### Priority 2: Partition Dependence and Granularity
  *Corresponds to your "Granularity Worry."*

  **The Question:** Does the framework yield stable rankings under refinement of the cause space? Specifically, does subdividing a cause area (e.g., "Global Health" into "Malaria" and "Non-Malaria") artificially inflate neglectedness scores without changing the underlying opportunity set?

  **Upstream Impact:** This is upstream of all measurement. If the framework is partition-dependent, then any empirical report using it is vulnerable to gerrymandering. Settling Priority 1 (Heuristic vs. Normative) tells us how severe this bug is. If it's a heuristic, we need a rule for "standard granularity." If it's normative, we need a formal correction.

  **Who Can Settle It:** A philosopher with formal training in social choice or probability theory. This is a structural problem akin to the "reference class problem" in probability. It can be modeled abstractly without specific cause data.

  **The Unexciting Answer:** The proof that the framework is inherently partition-dependent. The recommendation would then be to stipulate an exogenous list of cause categories (a "fixed menu") rather than allowing open-ended cause definition. This restricts flexibility but ensures comparability.

  **Update Conditions:** Move **up** if applicants begin submitting increasingly narrow cause definitions to game neglectedness scores. Move **down** if the foundation adopts a fixed menu of cause areas for the next funding cycle regardless of theoretical resolution.

  #### Priority 3: The Allocation Rule (Ranking vs. Sizing)
  *Corresponds to your "Shape-of-Return-Curve Worry," but narrowed.*

  **The Question:** What decision rule translates a prioritization score into a budget allocation? The current framework produces a ranking, but funding requires a size. Is there a conceptual justification for moving from "Cause A > Cause B" to "Allocate 80% to A"?

  **Upstream Impact:** This is upstream of actual disbursement. Without a conceptual link between score and size, the foundation is effectively guessing budgets after ranking causes. This addresses the "return curve" issue not by modeling the curve empirically, but by defining the *decision rule* required to utilize such a curve (e.g., marginal equating vs. winner-take-all).

  **Who Can Settle It:** A decision theorist or economist philosopher. This requires modeling budget allocation under uncertainty, but does not require empirical estimates of specific return curves. It is a question of *structure*, not *parameterization*.

  **The Unexciting Answer:** The conclusion that no conceptual link exists; sizing is purely empirical. This would imply that conceptual work on prioritization cannot inform budget percentages, only relative order. The foundation would need to fund empirical return-on-investment studies instead of conceptual work.

  **Update Conditions:** Move **up** if the foundation struggles to decide between funding one cause fully or two causes partially. Move **down** if the foundation adopts a fixed rule (e.g., "top cause gets 100%") regardless of theoretical nuance.

  #### Priority 4: Aggregating Model Uncertainty
  *New Addition.*

  **The Question:** How should the framework weight a cause with high estimated value but high model uncertainty (e.g., existential risk) against a cause with moderate value and low uncertainty (e.g., deworming)? Is there a conceptual basis for an "uncertainty penalty" or "ambiguity aversion" within the scoring?

  **Upstream Impact:** Upstream of risk management. If the framework treats expected value linearly, it may systematically favor high-variance causes. Clarifying this determines the foundation's risk profile.

  **Who Can Settle It:** A philosopher specializing in uncertainty or ambiguity (e.g., Hurwicz criterion, maximin). Purely conceptual.

  **The Unexciting Answer:** The standard expected value maximization is retained; ambiguity aversion is deemed irrational or outside the scope of the framework. This maintains the status quo but clarifies that high-risk causes are not being "penalized," just evaluated linearly.

  **Update Conditions:** Move **up** if the foundation's portfolio becomes overly concentrated in high-uncertainty areas. Move **down** if the foundation explicitly adopts a risk-neutral stance as a matter of policy.

  ### 3. Critique of Proposed "Half-Formed Thoughts"

  You asked me to rank or dismiss your three initial thoughts. Here is their fate in the agenda above:

  1.  **The Reading Worry (Status):** **Promoted to Priority 1.** This is not merely a "reading"; it is the meta-ethical/decision-theoretic foundation of the project. You correctly identified that disputes often stem from conflating these readings. However, be warned: resolving this may not "dissolve" the problems so much as force a choice between a rigorous but limited tool (heuristic) and an ambitious but broken one (normative). It is the most high-leverage conceptual work available.
  2.  **The Granularity Worry:** **Promoted to Priority 2.** This is a genuine defect, not a confusion. It is a formal instance of reference class dependence. It is upstream of the double-counting worry because you cannot determine if factors double-count until you have fixed the unit of analysis. If the unit is fluid, the counting is meaningless.
  3.  **The Shape-of-Return-Curve Worry:** **Merged into Priority 3.** Your suspicion that this requires replacing the framework is likely correct, but "replacing the framework" is too large a scope for one postdoc-year. The actionable conceptual question is not "what is the shape of the curve?" (which is empirical) but "what is the rule for acting given *any* curve?" Focusing on the *allocation rule* captures the decision-relevant core without demanding empirical modeling that a philosopher cannot deliver.

  ### 4. Items to Defund from the "Standard List"

  You asked which standard objections should *not* receive conceptual funding. I recommend defunding work on the following three:

  1.  **Multiplicative vs. Additive Combination Rules:**
      *   **Reason:** This is mathematically trivial but empirically contingent. Whether factors multiply or add depends on the causal structure of the world (e.g., is tractability independent of neglectedness?), not on conceptual analysis. A philosopher cannot derive the functional form without empirical premises. This is a job for a modeler with data, not a conceptual researcher.
  2.  **Unit Measurement and Trade-offs:**
      *   **Reason:** This is a measurement problem, not a conceptual one. The question "how do we trade off units of neglectedness against units of importance?" is answered by defining the common denominator (usually expected value). If the complaint is that we lack the data to populate the units, conceptual work will not generate data. If the complaint is that the units are incommensurable, that is resolved by Priority 1 (Heuristic reading allows incommensurability).
  3.  **Double-Counting (Tractability/Neglectedness):**
      *   **Reason:** This is effectively settled by definition. Tractability is usually defined as *total* marginal returns; Neglectedness as *current* resource level. If defined precisely, they do not double-count. Further conceptual work here yields diminishing returns. The problem is usually sloppy usage by practitioners, which is a training issue, not a research issue.

  ### 5. Conclusion

  This agenda prioritizes **structural integrity** over **parameter refinement**.

  The standard objections (multiplicative rules, units, double-counting) assume the framework is a machine that just needs better tuning. My assessment is that we do not yet know what kind of machine it is (Priority 1), what the input units are (Priority 2), or how to operate the controls (Priority 3).

  Funding empirical reports on specific causes without resolving Priority 1 and 2 risks generating precise answers to ill-defined questions. Funding conceptual work on this specific ordering ensures that future empirical reports are compatible with one another and actionable for budget allocation. The "unexciting answers" listed above are acceptable risks; knowing that the framework is merely a heuristic with a fixed menu of causes is more valuable than continuing to operate under the illusion that it is a normative law with flexible inputs.
