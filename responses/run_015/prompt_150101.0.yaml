  Hey — I'm a programming languages person, and I want you to translate something into my vocabulary and then tell me honestly where the translation breaks. Background on me: I work on a dependently typed language (elaboration, universe levels, that kind of thing), I'm comfortable with models-as-interpretations-of-a-signature, with internal vs. external definability, with parametricity arguments, and with the plain fact that a language over a finite alphabet only has countably many closed terms. I'm also in a reading group with some philosopher friends who dragged me through a session on Skolem's paradox a few weeks ago, and I've been chewing on it ever since. I get the textbook shape well enough: set theory proves there are uncountable sets, the language of set theory is countable, downward Löwenheim–Skolem hands you a countable model, and that model still contains an object it takes to be the powerset of the naturals — because the bijection onto the naturals that exists from the outside isn't itself an element of the model. Everyone in the group kept saying the paradox dissolves once you're careful about internal versus external quantification, and I sort of believe that, but it also feels like it dissolves too fast, like the interesting bit got swept under the word internal and nobody looked at it again.

  So: part one. Restate the whole business as faithfully as you can in the vocabulary I actually use — signatures, terms, closed terms, models as structures, a theory proving a negative existential that the metatheory knows is false, definable versus merely existing functions, the enumeration that exists in the metatheory but is denoted by no term of the object language. Here's my own attempt at a PL version, which I want you to work with rather than replace: take a type U in a language L with only countably many closed terms, have L prove there's no surjection from Nat onto U, and then point out that the metatheory can see an enumeration of U's inhabitants anyway, since there just aren't that many terms. Tell me which parts of Skolem's setup map cleanly onto this (I suspect a lot of it is just the gap between what a theory proves and what holds in a particular model, plus the countability of syntax), and tell me explicitly which parts you had to bend to make them fit and what you bent. Also: is my PL version actually the same phenomenon, or have I secretly rebuilt something else — Gödelian incompleteness, or Tarski-style undefinability, or just the observation that a type system can't see all the functions that exist at the meta level? If it's a different animal, say what the difference is and how I'd have to modify the construction to get real Skolem back.

  Part two is the residue report, and it's what I actually care about. My friend who does set theory said the interesting version isn't the paradox at all but the relativity reading: the thought that uncountable, and maybe the whole notion of the continuum, isn't absolute, and that our quantifiers might not reach all the subsets we naively think they do. Try to state that reading in my terms and see whether it survives. Then give me what doesn't translate: is there anything in the philosophers' worry that has no counterpart in PL vocabulary at all? My guesses, which I want you to argue with rather than just ratify, are (a) the idea of a distinguished intended model — I can talk about a theory and its models, but nothing in my toolkit picks out one model as the real one, since I always have a metatheory I'm implicitly trusting, and (b) the move from relativity to there being no fact of the matter — in PL, if two models disagree I just say the theory was underspecified and go add an axiom, and that response seems to be unavailable or at least question-begging in the set theory case. For each piece of residue, tell me whether it's a real blind spot in my framework (I'm quietly smuggling in a fixed semantics and calling it logic), or whether it's a sign that the original worry was never as sharp as it sounded. And if you think the honest verdict is that the paradox is mostly a pun on the word exists — exists in the model versus exists at all — say so, but then explain why people who clearly know the logic better than I do still find something there. Two or three paragraphs of prose plus a short residue list is about right; no citations, I don't need reading recommendations, I just want the argument.
