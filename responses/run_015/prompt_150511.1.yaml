  Here's the proposal we discussed for the independent study next semester.

  **1) The Precise Question**
  Here's the core puzzle I want to solve: Does Hofstadter's inversion trick work because it targets specific moral prejudices, or because it violates deep cognitive structures about linguistic markedness? Standardly, we assume the discomfort readers feel reading "Person Paper" comes from recognizing sexism or racism. But I want to test if that discomfort is actually just about breaking the rule of the "unmarked default." By swapping gendered terms for handedness terms—where "right-handed" is the biological and linguistic default but lacks a serious civil rights movement attached to it—we can isolate the variable. If the handedness version feels just as absurd as the gender version, then the satire works on a cognitive level about how brains code "normal." If the handedness version feels flat or confusing, then the satire relies entirely on pre-existing social tension. I'm aiming for a determinate conclusion on whether linguistic defamiliarization requires moral stakes to function, or if the semantic violation is enough on its own. The answer will be binary: either the handedness inversion generates equivalent semantic friction without the social guilt, proving it's a cognitive phenomenon, or it fails to land, proving the "shock" is purely sociological. I want to pin down whether the "universal" claim of Hofstadter's method holds up when you remove the oppression variable. I will define success as being able to predict reader response based on category type. The question is specifically: Is the 'sting' of the generic masculine a result of social exclusion or grammatical markedness? By treating the text as a controlled experiment, I can isolate the independent variable of social stigma. This allows for a yes/no conclusion on the necessity of prejudice for the satire's efficacy.

  **2) Why Usual Readings Leave This Open**
  The usual readings of Hofstadter leave this open because they treat the text primarily as a political intervention rather than a linguistic experiment. Most commentary focuses on how the swap exposes the absurdity of sexism or racism, assuming the reader's discomfort is a moral reaction to injustice. This conflates the tool (inversion) with the target (oppression). If the discomfort is purely moral, then removing the oppression (as in the handedness case) should remove the sting. But existing scholarship doesn't separate these layers. They don't ask if the reader would feel the same cognitive dissonance if the group being excluded wasn't historically marginalized. By treating "Person Paper" solely as a mirror for social bias, critics ignore the possibility that the brain reacts negatively to any violation of the unmarked category, regardless of social stakes. This leaves a gap: we don't know if the satire works because racism is bad, or because "marked" generics are cognitively grating. Without settling this, we can't know if Hofstadter's method is portable to other contexts or if it's unique to high-stakes identity politics. Current literature assumes the social tension is the fuel, but never tests the engine separately. They treat the discomfort as evidence of hidden bias, but never consider that the discomfort might be evidence of rigid cognitive categorization. My project tackles this blind spot by decoupling the linguistic mechanism from the social history. If we don't distinguish these, we risk attributing cognitive effects to social causes, which muddies the water for future applications of philosophical satire.

  **3) The Method**
  I'm not just reviewing literature; I'm constructing a comparative framework. Month 1 will be groundwork: reading Hofstadter alongside linguistic theories of markedness (like Jakobson or Corbett) to define what an "unmarked default" actually looks like grammatically. Month 2 is the creative phase: I'll write the "Handedness Paper," systematically rewriting key passages of Hofstadter's text to swap gender/race terms for right/left-handedness while keeping the syntactic structure identical. This creates the data set. Month 3 involves the analysis: I'll apply the markedness framework to both texts to identify where the friction occurs. I'll look for points where the gender version feels offensive but the handedness version feels merely nonsensical, or vice versa. This distinguishes social sting from semantic weirdness. I'll categorize reactions into "moral outrage," "confusion," or "grammatical friction." This requires close reading plus applying linguistic theory to predict where the brain should stumble regardless of social context. Month 4 is drafting the argument, focusing on whether the handedness inversion triggers the same "error signal" in the reader. I'll argue either that the handedness text fails to provoke (proving social tension is necessary) or that it succeeds (proving cognitive defaults are the driver). Month 5 is revision and polishing. This isn't a lit review because I'm generating new textual artifacts to test a hypothesis. I'm treating the texts as experimental conditions. By holding the syntax constant and varying the social weight of the category, I can observe where the breakdown happens. This comparative thought experiment allows me to isolate the variable of social prejudice, which a standard reading never does. It moves beyond interpreting what Hofstadter meant to testing how his method functions mechanistically. I'm essentially running a armchair experiment where the texts are the controls and variables. This requires building a rubric for "absurdity" based on linguistic theory, not just summarizing what others have said about satire. It's a constructive project, not just exegetical. I'll also document the translation challenges—where the handedness metaphor breaks down because the social structure doesn't map perfectly—which itself provides data on why gender/race are unique categories. The final paper will present the two texts side-by-side with an annotated analysis of the divergent reader responses predicted by the theory.

  **4) Success vs. Failure**
  Success looks like a clear verdict: either the handedness inversion produces equivalent cognitive dissonance (supporting the cognitive default theory) or it falls flat (supporting the social tension theory). I want a paper that takes a stand. Failure would be ending up with "it's complicated" or "both matter equally" without explaining the mechanism. Another failure mode is getting bogged down in the politics of left-handedness—if I spend too much time arguing about whether lefties are oppressed, I lose the linguistic focus. The project also fails if I just end up summarizing Hofstadter without applying the handedness test rigorously. I need to ensure the comparison drives the conclusion, not just the background. If I can't isolate the variable of social prejudice, the experiment doesn't hold.

  **5) Scope Check**
  The biggest risk is scope creep into empirical psychology. I can't actually run human subjects tests in a semester, so I have to stick to theoretical analysis of reader response. Another risk is the handedness analogy breaking down; if right/left doesn't map cleanly onto male/female generics, the comparison gets muddy. I'll mitigate this by focusing on the linguistic structure rather than perfect social analogies. Also, getting too deep into markedness theory could turn this into a linguistics degree project. I'll keep the linguistic tools minimal and focused on the philosophical question.

