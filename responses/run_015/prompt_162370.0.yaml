answer: |-
  1.  **The Functional Isomorphism Claim**
      *   **The Claim:** The colony processes inputs (scouts, pheromones) and produces outputs (foraging, moving) via a causal network that performs the same computational tasks as a brain.
      *   **Status:** **Platitude.** Biologists and cognitive scientists generally agree colonies solve problems no single ant can solve using distributed processing.
      *   **Does the Job?** **No.** Showing the colony *acts* like a brain doesn't prove it *has beliefs* (it could be a "zombie" system), nor does it prove the ants *lack* beliefs. A calculator processes math but doesn't believe numbers.
      *   **Notes:** This handles the **Counting Case** weakly. It says the colony *computes* "enough," but doesn't settle if that computation is a genuine representation or just a physical threshold.

  2.  **The Structural Identity Claim**
      *   **The Claim:** The physical connectivity of the colony maps 1:1 onto a neural network: an ant is a neuron, a pheromone trail is a synapse, and traffic volume is the signal weight.
      *   **Status:** **False.** Ants move freely and change roles; neurons are fixed in place. Ants have sensory organs; neurons do not. The mapping breaks down under scrutiny.
      *   **Does the Job?** **Yes (if true).** If an ant is literally just a neuron, then just as your neurons don't believe things, the ants don't either. The belief belongs to the network.
      *   **Notes:** This is the **Mapping** claim. Because the mapping is loose (ants move, neurons don't), this claim is vulnerable. If the mapping fails, the analogy loses its literal force.

  3.  **The Substrate Neutrality Claim**
      *   **The Claim:** Mental states are defined by their causal role, not their material. If ants play the same causal role as neurons, they can realize the same mental states, regardless of being flesh-and-blood agents.
      *   **Status:** **Substantive.** This is a core debate in philosophy of mind (functionalism). It is defensible but not universally accepted.
      *   **Does the Job?** **Partial.** It allows the colony to have a mind, but it doesn't automatically exclude the ants from *also* having minds. Your neurons don't have minds, but that's because of their specific biology, not just because they are substrate.
      *   **Notes:** This supports the **Wax Ridge Case**. If mind is just causal role, a wax ridge could be part of the memory storage if it plays the right causal role, making the "brain" partly non-living.

  4.  **The Semantic Realism Claim**
      *   **The Claim:** The colony's internal states possess genuine "aboutness" (content). When the colony moves, it is because it *believes* "the nest is unsafe," not just because physical forces pushed it.
      *   **Status:** **Substantive.** This is the hard problem of collective intentionality. It requires arguing that physical thresholds can carry meaning.
      *   **Does the Job?** **Yes.** This explicitly grants the colony beliefs. However, it doesn't explain why the ants *don't* have beliefs unless combined with Claim 6.
      *   **Notes:** This tackles the **Counting Case** head-on. It insists the threshold *is* a representation of "enough," not just a physical trigger.

  5.  **The Extended Constitution Claim**
      *   **The Claim:** The cognitive system includes the environment. The wax ridge isn't just a tool; it is part of the colony's memory tissue, just as a notebook might be part of a human's memory.
      *   **Status:** **Substantive.** This is the "Extended Mind" thesis. Defensible, but controversial regarding where the mind stops.
      *   **Does the Job?** **No.** This expands *what* the colony is made of (ants + wax), but doesn't settle whether that whole thing believes, or whether the ants within it believe.
      *   **Notes:** This addresses your **Wax Ridge Case**. If accepted, Aunt Hillary dies if moved to a clean box because her memory tissue was left behind. This is a high cost for the claim.

  6.  **The Agential Suppression Claim**
      *   **The Claim:** During collective tasks, individual ants lose their agency. They become passive transducers of information, lacking the independent goals or interests that characterize a "believer."
      *   **Status:** **False.** Ants retain individual interests (self-preservation, sometimes cheating). They are not passive like neurons; they are active agents coerced or coerced by chemistry.
      *   **Does the Job?** **Yes.** This is the only claim that directly argues the *ants* don't believe. If they are mere transducers, they can't be believers.
      *   **Notes:** This addresses the **Agendas Case**. Since ants *do* have agendas (unlike neurons), this claim requires arguing those agendas are irrelevant to the colony's thought, which is hard to prove.

  7.  **The Biological Individuality Claim**
      *   **The Claim:** The colony is the true evolutionary organism; the ants are merely somatic cells (like skin or liver cells) that don't count as independent individuals.
      *   **Status:** **Substantive.** Many biologists treat eusocial colonies as "superorganisms." It is defensible evolutionarily but metaphysically bold.
      *   **Does the Job?** **Yes.** If ants are just cells, and cells don't believe, then ants don't believe. The colony is the only entity capable of belief.
      *   **Notes:** This sidesteps the **Agendas Case** by redefining the ants' interests as merely cellular functions (like a liver cell wanting glucose) rather than agentive desires.

  8.  **The Phenomenal Consciousness Claim**
      *   **The Claim:** The colony doesn't just process information; it *feels* like something to be the colony. It has subjective experience (qualia), pain, or satisfaction.
      *   **Status:** **Wild/Speculative.** Almost no one grants this literally. It goes far beyond "belief" into "experience."
      *   **Does the Job?** **Yes (Overkill).** If the colony feels pain, it certainly has a mind. But this is much harder to defend than mere belief.
      *   **Notes:** This is rarely what people mean. Your friend likely means "belief," not "suffering." If pressed, he would probably retreat from this claim.

  9.  **The Threshold Instrumentalism Claim**
      *   **The Claim:** Saying the colony "believes" is just a useful shorthand for saying "the system crossed a physical activation threshold." There is no real content, just physics we describe using mental words.
      *   **Status:** **Substantive.** This is an instrumentalist or eliminativist view of collective mind.
      *   **Does the Job?** **No.** It undermines the friend's conclusion. It says the colony *doesn't* literally believe, any more than a thermostat believes the room is cold.
      *   **Notes:** This resolves the **Counting Case** by saying there is no representation of "enough," just a switch flipping when enough ants push it.

  10. **The Pedagogical Metaphor Claim**
      *   **The Claim:** The sentence "the colony is a brain" is a literary device to help humans understand complex systems, not a literal ontological assertion about reality.
      *   **Status:** **Platitude (in literature).** In a book like *GEB*, this is almost certainly the author's intent, though readers often reify it.
      *   **Does the Job?** **No.** It treats the sentence as fiction. It grants neither that the colony believes nor that the ants don't; it suspends the question.
      *   **Notes:** This is the "nothing more" side of your group. It suggests your friend is making a category mistake by treating a metaphor as a proof.

  ***

  **Which reading do people actually have in mind?**

  When your friend says "the colony is a brain made of ants" with that kind of confidence, he is almost certainly mixing **Claim 1 (Functional Isomorphism)** with **Claim 7 (Biological Individuality)**.

  He sees the colony doing smart things (Claim 1) and assumes that because it acts like an organism, it *is* an organism in the biological sense (Claim 7). He then smuggles in **Claim 6 (Agential Suppression)** without arguing for it. He assumes that because the colony is the "organism," the ants must be "cells," and therefore must lack agency.

  Your suspicion is correct: the readings that are easy to defend (Claim 1, Claim 10) stop short of proving the colony *believes*. The readings that get you to "colony believes, ants don't" (Claim 2, Claim 6, Claim 7) require heavy lifting he isn't doing. Claim 2 is empirically shaky (the mapping fails), Claim 6 is empirically false (ants have agendas), and Claim 7 is biological, not mental (being an organism doesn't automatically grant belief).

  He is using a biological fact (superorganism) to do a philosophical job (granting mental states), and the sentence "the colony is a brain" is the bridge he hopes you won't inspect.
