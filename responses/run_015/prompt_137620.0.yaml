      *Critical Issue:* Systems don't have "what it's like". They have state transitions. To translate P-consciousness, I have to either say "It doesn't map" (honest) or "It maps to X property" (functionalism). The prompt warns against smuggling functionalism. I must flag this.

  5.  **Drafting the Probe Analysis:**
