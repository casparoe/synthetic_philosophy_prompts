  7.  **Refining the Honesty Constraints:**
      *   *Constraint 1:* Don't assume functionalism. I need to explicitly state: "In systems, state *is* function. In philosophy, P might not be."
      *   *Constraint 2:* Identify rigged probes. "Orphan Publish" assumes broadcast = experience. That begs the question against Higher-Order theories. "Buffered Readout" assumes buffer = experience.

  8.  **Structure of the Response:**
      *   **Intro:** Acknowledge role, set confidence tone.
      *   **Mapping Table:** Term -> Systems Equivalent + Confidence.
      *   **Walkthrough (1, 2, 3):** Explain the concepts using the map.
      *   **Probe Cases:** Analyze the three scenarios.
      *   **Residue Report:** What was lost? Can "what it's like" be expressed?
      *   **Welfare Implication:** Direct answer to the user's motivation.
      *   **Least Confidence Point:** Identify the weakest link.

  9.  **Self-Correction/Refinement during thought process:**
      *   *Correction:* I need to be careful not to say "Phenomenal = Buffer Content". That's a functionalist reduction. I need to say "Philosophers who lean functionalist map P to Buffer Content. Non-functionalists say this misses the point."
      *   *Correction on Split-Brain:* In systems, split-brain is usually a bug to be resolved (consensus). In mind, it's a metaphysical puzzle. I need to highlight that systems vocab resolves identity via consensus/UUID, whereas philosophy questions the *basis* of that identity.
      *   *Confidence:* I should be High on GWT mapping, Medium on Overflow, Low/Guessing on Phenomenal mapping (because it's the hard problem).

  10. **Final Review against Constraints:**
      *   No citations? Check.
      *   Mapping table? Check.
      *   Three probes? Check.
      *   Residue report? Check.
      *   Welfare question addressed? Check.
      *   Honesty constraints (no smuggling functionalism, flag rigged probes)? Check.
      *   Confidence markers? Check.
      *   Least confidence point identified? Check.

  11. **Drafting the Content (Iterative refinement):**
      *   *Mapping P-consciousness:* I will map it to "Internal State Existence" but flag that systems don't track "existence" independent of "access".
      *   *Mapping A-consciousness:* "Downstream Consumption / Side Effects".
      *   *GWT:* "Contention-based Broadcast Bus".
      *   *Overflow:* "Buffer Depth > Throughput".
      *   *Probe 1 (Orphan):* Systems says "Wasted CPU/Memory". Philosophy says "Unconscious Experience?"
      *   *Probe 2 (Split):* Systems says "Two Instances". Philosophy says "One Subject?".
      *   *Probe 3 (Buffer):* Systems says "Data Loss". Philosophy says "Rich Experience vs. Poor Report".
      *   *Residue:* The "What it's like" qualia is the residue. Systems have no equivalent for "feeling".
      *   *Welfare:* If P collapses to A, welfare is just "error rates in negative-reward consumers". If P is distinct, systems vocab can't see it.

      *Wait, one constraint:* "tell me where my three probes are rigged or beg the question against one side".
      *   *Orphan Publish:* Rigged if you assume Ignition = Phenomenality. Some theories say consumption is required for phenomenality.
      *   *Buffered Readout:* Rigged if you assume Buffer Storage = Phenomenal Storage. Maybe phenomenality is the *act* of reading, not the storage.
