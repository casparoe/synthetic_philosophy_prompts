          *   *Systems Analogy:* This maps *very* well to the user's vocabulary. Pub/sub bus, competition for bandwidth, broadcast topic, subscribers (consumers).
      *   **Overflow Dispute:**
          *   *Concept:* Is conscious experience richer than what we can report/access? (Yes: Block, Lamme; No: Dennett, Cohen).
          *   *Systems Analogy:* Buffer size vs. throughput. High fidelity ingestion vs. low bandwidth serialization.

  3.  **Deconstruct the Probe Cases:**
      *   **Orphan Publish:** Message broadcast, no consumer reads it before TTL expires.
          *   *Phil Question:* Is there experience without access? (Phenomenal without Access).
      *   **Split-Brain Workspace:** Partition network, two broadcast domains.
          *   *Phil Question:* Unity of consciousness. One subject or two?
      *   **Buffered Readout:** High fidelity buffer, low bandwidth serializer.
          *   *Phil Question:* Overflow. Is the buffer content "experienced" even if not serialized?

  4.  **Drafting the Mapping (Mental Scratchpad):**
      *   *Subject/Agent* -> Service/Instance.
