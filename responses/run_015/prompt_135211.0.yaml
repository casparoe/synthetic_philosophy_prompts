  2. **Value alignment: Tier A** — This ranks slightly lower as a distinct technical challenge because it often collapses into intent alignment once the designer's intention is specified as "pursue normative correctness," leaving primarily a meta-ethical specification problem.

  3. **Procedural alignment: Tier B** — While this highlights a critical mechanistic failure mode like deception, it conceptually collapses into intent alignment if the designer's intention is granularly specified to include reasoning constraints, making it a subset rather than an orthogonal category.

  **Note on Narrow Systems:** In narrow decision-support models, the distinction between intent and procedural alignment is often *more* practically visible than in general agents, because regulatory frameworks (e.g., medical liability, GDPR) mandate procedural auditability even when outcome accuracy is high, whereas in AGI contexts the existential risk of misaligned intent tends to overshadow procedural concerns.
