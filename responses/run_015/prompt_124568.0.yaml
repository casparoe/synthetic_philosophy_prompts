answer: |-
  I recommend we adopt a fifth option: approve lowering the voting age to 16 paired with civics education, drop non-citizen enfranchisement and compulsory voting entirely, and redirect the $40k enforcement budget to turnout outreach. We owe the council a viable recommendation, not a legal challenge or an administrative nightmare.

  Let's talk about the people this affects. The 16-year-olds are already here. They walk the streets we zone, they breathe the air affected by the stormwater bond, and they will pay for that bond long after the current electorate is gone. Pairing the vote with the junior civics course respects the teacher's goal without conscripting kids into a political act their parents might oppose; the mock election stays in the classroom, the real one stays optional. This connects the classroom to the council chamber without forcing a ballot into a hand that isn't ready.

  On non-citizen voting, I know half of you feel strongly that excluding 6,000 residents is unjust. The strongest version of your argument is moral clarity: if the food processing worker pays rent here, sends kids to our schools, and obeys our zoning, they are governed here. They have no say in federal elections, and state elections don't touch trash collection. Excluding them creates a permanent underclass of residents who shape the community daily but vanish from the electorate. That is a powerful claim. However, the counter-argument is that a demos has to be a bounded, identifiable group. If residency alone grants voice, why not the 1,800 landlords paying property tax? Why not the commuters clogging our roads? If we draw the line at "citizenship," it's arbitrary. If we draw it at "residency," we must accept that commuters have a claim too. More practically, state election code likely preempts this. The city attorney will flag this as ultra vires. We cannot spend months drafting language the state will invalidate.

  On compulsory voting, the argument is about legitimacy. An 11% turnout means the stormwater bond was passed by roughly 7% of the city. That's not a mandate; it's a hobby group. Compulsion forces the disengaged to confront the choices. Even with "conscientious abstention," it signals that participation is a duty, not just a right. But enforcement is a mess. We don't know where 900 homeless residents sleep. Registration closes 21 days out. A fine becomes a tax on the unstable. For 16-year-olds, liability is unclear—fining the kid or the parent? Even with waivers, it turns civic duty into a compliance check managed by a clerk who is already understaffed. We cannot fine our way to engagement.

  Here is the timeline. In the spring election, we pilot the 16-year-old vote only. We use the $40k not for fines, but for registration drives at the high school and the food processing plant. We measure not just raw turnout, but demographic spread. Are 16-year-olds voting? Are renters voting? If turnout stays at 11% but the electorate looks like the city, we have succeeded. If turnout jumps but only among homeowners, we revisit compulsion later.

  Plainly, here is what the city attorney will kill. Proposal #2 violates state election code regarding citizenship requirements. Proposal #3 requires statutory authority for penalties that the city does not possess. We cannot fine voters without state approval. We cannot define voter eligibility contrary to state law. Dropping these now saves us from a lawsuit later.

  We have a chance to make the electorate look like the city without breaking the law or bankrupting the clerk's office. Let's take the step we can actually stand on.

  \answer{E — 16-year-old vote, outreach funded}
