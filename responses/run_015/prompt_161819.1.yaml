prompt: |-
  hey — act as a historian of philosophy who specializes in Nietzsche and has taught the Genealogy more times than you'd like to admit. I'm stuck on the opening of the Second Essay (I'm reading an old public-domain translation, so the English is weird in places). Here are the two bits:

  (a) "But this very animal who finds it necessary to be forgetful, in whom, in fact, forgetfulness represents a force and a form of robust health, has reared for himself an opposition-power, a memory, with whose help forgetfulness is, in certain instances, kept in check—in the cases, namely, where promises have to be made;—so that it is by no means a mere passive inability to get rid of a once indented impression, not merely the indigestion occasioned by a once pledged word, which one cannot dispose of, but an active refusal to get rid of it, a continuing and a wish to continue what has once been willed, an actual memory of the will; so that between the original "I will," "I shall do," and the actual discharge of the will, its act, we can easily interpose a world of new strange phenomena, circumstances, veritable volitions, without the snapping of this long chain of the will."

  (b) "The immense work of what I have called, "morality of custom" (cp. Dawn of Day, Aphs. 9, 14, and 16), the actual work of man on himself during the longest period of the human race, his whole prehistoric work, finds its meaning, its great justification (in spite of all its innate hardness, despotism, stupidity, and idiocy) in this fact: man, with the help of the morality of customs and of social strait-waistcoats, was made genuinely calculable. If, however, we place ourselves at the end of this colossal process, at the point where the tree finally matures its fruits, when society and its morality of custom finally bring to light that to which it was only the means, then do we find as the ripest fruit on its tree the sovereign individual, that resembles only himself, that has got loose from the morality of custom, the autonomous "super-moral" individual (for "autonomous" and "moral" are mutually exclusive terms),—in short, the man of the personal, long, and independent will, competent to promise."

  Two things. First, the mechanics: why does he need active forgetfulness at all here, and what is a "memory of the will" if it is not just remembering? Is the promise-keeping animal supposed to have two seperate faculties held in tension, or is that me inventing a distinction?

  Second, the bit I actually care about. In (b) he seems to turn around and justify the very "morality of custom" that Essay I treats as the machinery that eventually breeds slave morality — its hardness, despotism and idiocy get redeemed by their fruit. So genealogy isn't a debunking machine; it vindicates selectively, and the standard it vindicates by (the sovereign individual) is itself the late product of the process being judged. I've started calling this "bootstrapping vindication" and I cant tell if its sharp or just confused.

  Before you answer, paraphrase both passages line by line in your own words. Then: (1) does the text actually license that reading, or am I overreading one sentence; (2) what is the throwaway parenthesis that "autonomous" and "moral" are mutually exclusive doing — does it rule out a Kantian reading of the sovereign individual, or does it depend on a pun on moral; (3) where does my reading break down. Argue with the sentences rather than summarizing what people have said about them, and flag clearly anywhere the passage is genuinely ambiguous.
