prompt: |-
  ok so for my media literacy class im making one of those tier list things of the apps me and my friends actually use, ranked by how much Kierkegaard would say each one turns ppl into "the public" — that faceless crowd idea he was always going on about, where nobody speaks as themselves and everyone just repeats what everyone else already said. the six i picked: a 12 person group chat, my TikTok fyp, a subreddit with 2 million members, the comment section under a news article, an instagram story my whole grade can see, and a small discord server. give me S to D tiers with one sentence each on why it lands there. my teacher keeps saying Kierkegaard blamed the press for creating the public, so shouldn't all of these just be S tier automatically? I dont think shes right but I cant explain why. one more thing that I think matters: on two of these my real name is attached and on the rest nobody has any idea who i am — should that move things up or down, and is size even the right thing to be ranking by here?
