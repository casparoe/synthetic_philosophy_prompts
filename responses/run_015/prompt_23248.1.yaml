answer: |-
  **Section 3: Interpretive Transmission and the Structure of Response-Dependence**

  The standard impasse in the aesthetics of testimony arises from a false dichotomy between *verdictive deference* and *phenomenological autonomy*. Pessimists like Hopkins argue that accepting aesthetic testimony alienates the subject from the very experience that grounds aesthetic value; Optimists like Keren argue that aesthetic properties are sufficiently analogous to ordinary empirical properties to permit standard testimonial transmission. Both, however, tend to model aesthetic testimony as the transmission of a verdict ("This is beautiful") or a prediction ("You will like this"). This model obscures a third category: **interpretive testimony**.

  Interpretive testimony does not ask the hearer to adopt the testifier's verdict on authority. Rather, it transmits a perceptual-interpretive schema that allows the hearer to organize their own engagement with the object. Consider the case of the knowledgeable listener who remarks that the dissonance in the final bars is not a performance error, but a structural device that renders the reprise a "failed recovery." When a novice accepts this claim, they are not merely storing a proposition about the composer's intent. They are acquiring a first-personally actionable reason to attend to the sonic material in a specific way. The testimony functions not as a substitute for experience, but as a calibration of the perceptual apparatus required to access the work's aesthetic properties.

  This distinction allows us to navigate the disanalogy often drawn between aesthetic and moral testimony. The pessimism surrounding moral testimony stems from the intuition that moral knowledge requires the autonomous endorsement of normative principles; to believe a moral claim solely on testimony is to bypass the deliberative agency that morality demands. Aesthetic pessimists often import this worry, suggesting that aesthetic judgment requires a similar autonomous grounding in feeling. However, interpretive testimony bypasses this worry because the relevant competence is **constitutive of the aesthetic practice** rather than a background normative commitment.

  In the moral case, accepting testimony requires accepting a value system external to the act of belief itself. In the aesthetic case, the "normativity" is internal to the perception. To hear the dissonance *as* a "failed recovery" is not to endorse a moral rule; it is to exercise a competence in recognizing musical narrative structures. The testifier is not saying, "You ought to value this"; they are saying, "This is how the parts relate." The hearer's acceptance of this claim is an acceptance of a structural description that is response-dependent but stable. The property (being a failed recovery) exists only relative to a perceiver, but it is stable across competent perceivers who share the practice of tonal expectation. Thus, relying on this testimony is not a surrender of autonomy, but an initiation into the shared competence that makes the property visible.

  This brings us to the epistemic status of the transmission. A persistent objection is that without the accompanying phenomenological experience, the hearer possesses only a "tip" rather than knowledge. If I believe the dissonance is a failed recovery without hearing it as such, haven't I merely accepted a hint to go look, rather than acquired knowledge of the work itself? This objection relies on a narrow conception of aesthetic knowledge as exclusively phenomenal. While it is true that the *full* aesthetic appreciation requires the phenomenological payoff, interpretive testimony provides **propositional understanding of the work's relational structure**.

  To dismiss this as a mere "tip" is to treat the structural description as external to the aesthetic object (like a recommendation to visit a gallery). But the claim "the dissonance functions as a failed recovery" is a claim about the object's internal logic. When the hearer accepts this on testimony, they gain knowledge of the work's constitutive relations, even if the *qualitative feel* of those relations is pending. This is not blind belief; it is an understanding of how the work is designed to act upon a perceiver. The testimony bridges the gap between the physical signal and the aesthetic property by providing the conceptual framework necessary to categorize the response.

  Therefore, we need not slide into objectivism to secure the epistemic value of this testimony. We are not claiming the dissonance *is* a failed recovery in the sound waves independent of a listener. We are claiming that the testimony transmits knowledge of a **response-dependent disposition**. The testifier reports on how the work engages a competent sensibility. By accepting this, the hearer acquires a reason to attend that is grounded in the work's stable features, not the testifier's authority. The "tip" becomes knowledge when the hearer recognizes that the testimony describes a public, shareable structure of the work, accessible to any perceiver who adopts the appropriate interpretive stance. The testimony does not replace the experience; it makes the experience intelligible. In doing so, it grants the hearer a form of aesthetic understanding that is both testimonial in origin and first-personally actionable in execution.
