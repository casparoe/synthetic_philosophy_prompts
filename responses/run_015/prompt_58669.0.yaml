answer: |-
  This is a classic dilemma in museum studies and aesthetics, and your frustration is completely warranted. What you are witnessing is the collision between two different theories of value that museums often try to juggle without admitting they are contradictory.

  Your museum's behaviour presupposes a specific philosophical stance: **Epistemic Integrity over Aesthetic Experience.**

  Here is a breakdown of what that means, why the policy looks inconsistent, and where the logic actually holds (and where it breaks).

  ### 1. The Two Cases: Honest Copy vs. Deceptive Fake
  To understand the policy, you have to distinguish between the *ontology* of the objects (what they are) and the *ethics* of their display (how they are presented).

  **The Coins (The Honest Replica)**
  *   **Status:** Everyone knows they are 3D prints.
  *   **Function:** Educational/Tactile.
  *   **Value:** Instrumental. They serve a purpose (handling, visibility) that the originals cannot.
  *   **Philosophy:** This aligns with **Nelson Goodman's** distinction in *Languages of Art*. Coins are arguably "allographic" (there can be multiple valid instances of a coin type). A perfect replica serves the same epistemic function as the original for a student learning about Roman iconography. The museum is prioritising **access** and **preservation** (locking the real ones away protects them from oils and wear).

  **The Painting (The Deceptive Forgery)**
  *   **Status:** It was presented as a 17th-century Dutch work; it is actually Victorian.
  *   **Function:** Historical Testimony.
  *   **Value:** Evidential.
  *   **Philosophy:** Paintings are "autographic." Their value lies in the specific history of their production. When the museum displays a painting as "17th Century," it is making a historical claim. When that claim is proven false, the object loses its **witness value**. It no longer testifies to the 17th century; it testifies to the Victorian fascination with the 17th century.

  ### 2. What View of Authenticity Does This Presuppose?
  The museum is operating on a theory of **Nominal Authenticity** rather than **Expressive Authenticity**.

  *   **Expressive Authenticity:** Does it look the part? Does it convey the feeling of the era? (The forgery passes this; the 3D coins pass this).
  *   **Nominal Authenticity:** Is it what it says it is on the label?

  Your museum cares almost exclusively about the latter. This suggests they view the museum not primarily as an art gallery (where beauty rules), but as an **archive of evidence**.
  *   **The Contact with the Past:** Yes, this is part of it. The genuine sketch, however "scrappy," has "aura" (to use Walter Benjamin's term). It was touched by the hand of the 17th-century artist. The forgery was touched by a Victorian forger. The museum values the *provenance chain* as part of the object's identity.
  *   **Maker's Intention:** This is crucial. The 3D printer's intention was *education*. The forger's intention was *deception*. By displaying the forgery without correction, the museum feels it becomes complicit in the original crime.

  ### 3. Is the Setup Consistent?
  **Superficially: No.**
  It looks hypocritical to handle a fake coin but ban a fake painting. If "looks" don't matter, why does the painting's falsity banish it to storage while the coin's falsity puts it centre stage?

  **Deeply: Yes, but with a caveat.**
  The consistency lies in **Transparency**.
  *   The coins are *labelled* as replicas. The contract with the visitor is honest.
  *   The painting was *mislabeled* as original. The contract was breached.

  **The Inconsistency (The Storage Problem):**
  Here is where your flatmates have a point. If the museum truly valued transparency above all, they would **re-label the painting**, not hide it.
  *   *Current Action:* Haul to storage in disgrace.
  *   *Consistent Action:* Keep on wall, change label to "Victorian Pastiche in the style of the Dutch Golden Age."

  By hiding it, the museum reveals a second, hidden value judgment: **Moral Stigma.** They are treating the forgery as "contaminated." This suggests they believe the object's value was *solely* tied to its false attribution. If it's not a 17th-century masterpiece, they deem it unworthy of display compared to a "scrappy" genuine sketch. This implies that **Authenticity is a threshold condition for value**, not just one factor among many.

  ### 4. What Would Change if Value Was Just Visual Experience?
  If the museum believed that **Aesthetic Experience** was the primary goal (i.e., "we are here to show you beautiful/interesting things"), their policy would look very different:

  1.  **The Painting:** It would stay on the wall. The label would be updated to reflect its true origin, perhaps with a curator's note explaining the deception as part of the story ("Look how convincing this Victorian fake is!"). The visual pleasure remains; the historical lesson just shifts.
  2.  **The Coins:** The labels might downplay the "replica" aspect to avoid diminishing the visitor's immersion. Or, if the 3D prints were visually superior (cleaner, more visible) than the corroded originals, the originals might be deaccessioned or permanently stored without the "tragedy" currently associated with the painting.
  3.  **The Sketch:** If the genuine sketch is "less interesting to look at," a purely aesthetic museum might rotate it out in favour of a more visually striking work, regardless of provenance, provided it was labelled honestly.

  ### 5. Where is the Policy Underdetermined?
  There are gaps in your museum's logic where different theories could license the same practice. This is where the debate with your flatmates can really dig in.

  **A. The "Educational Utility" Loophole**
  *   *Theory:* Museums exist to teach.
  *   *Application:* Coins are for *handling* (teaching texture/weight). Replicas are better for this. Paintings are for *viewing* (teaching art history). Forgeries are bad for teaching art history because they distort the timeline.
  *   *Underdetermination:* This justifies the coins, but it doesn't justify hiding the painting. A forgery is an excellent tool for teaching *connoisseurship* (how to spot a fake). Hiding it reduces educational utility.

  **B. The "Scarcity" Argument**
  *   *Theory:* Value is derived from rarity.
  *   *Application:* There are thousands of Roman denarii; a 3D print doesn't devalue the concept. There is only one "17th Century Landscape by X." The forgery dilutes the scarcity of the genuine article.
  *   *Underdetermination:* This explains why we protect the "unique" painting more than the "mass-produced" coin, but it doesn't explain why the forgery is *worthless* rather than just *less valuable*.

  **C. The "Contamination" Theory (The Strongest Critique)**
  *   *Theory:* Objects carry moral weight.
  *   *Application:* The forgery is a lie made object. Displaying it feels like telling a lie.
  *   *Underdetermination:* This is an emotional/moral stance, not a curatorial one. If the museum admits this, they admit they are guided by Victorian morals about honesty rather than modern museology about interpretation.

  ### Summary for your Flatmates
  The museum believes that **an object's history is part of its aesthetic identity.** You cannot separate the "look" of the painting from the "story" of its making.
  *   **Coins:** The story is "This represents a Roman coin." (True for both real and replica).
  *   **Painting:** The story was "This was made in 1650." (False).

  **The Verdict:** The policy is consistent regarding **labels** (don't lie to visitors), but inconsistent regarding **storage** (why hide a truthfully labeled Victorian fake?). If they re-labeled the painting and kept it up as an example of Victorian forgery, their philosophy would be robust. By hiding it, they reveal that they still secretly believe **Authenticity = Value**, regardless of the visual experience or the educational potential of the fake itself.

  They are prioritising the **purity of the historical record** over the **pleasure of the viewer**, but they haven't quite figured out what to do with the "impure" objects other than banish them.
