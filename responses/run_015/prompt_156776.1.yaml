      *   **Assessing the Model's Success (Where Schelling Fits):**
          *   Reagan's move fits the "burning bridges" tactic. By going on TV and setting a deadline, he raised the reputational cost of backing down.
          *   Irreversibility: Firing 11,000 people is hard to undo. It signaled that the threat was not a bluff.
          *   PATCO's failure: They could not commit to enduring the pain. Their "bridge burning" (quitting jobs) was actually the Admin burning it for them.

      *   **Assessing the Model's Failures (Where Schelling Falls Short):**
          *   *Legality vs. Credibility:* Schelling assumes a voluntary game. Here, PATCO was already outside the rules. Their commitment wasn't strategic; it was insurrectionary. The "threat" was already nullified by statute.
