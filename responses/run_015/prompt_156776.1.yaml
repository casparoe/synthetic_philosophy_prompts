      *   **Mapping Players and Option Sets:**
          *   *Player 1: PATCO (Collective Agent).* Not unitary. Option set: Strike (illegal), Work (status quo), Return (capitulation). Constraint: Internal defection (scabs).
          *   *Player 2: Reagan Admin (Unitary Actor).* Option set: Fire (costly short-term, beneficial long-term), Accommodate (precedent setting), Negotiate (undermines law). Authority: 5 U.S.C. § 7311.
          *   *The Board:* Federal prohibition. This isn't a move; it's the table the game is played on. It reduces PATCO's payoff for striking to negative *ex ante*.

      *   **Mapping Payoffs:**
          *   *PATCO:* Gain = Wage increase/better conditions. Loss = Jobs, fines, jail, union decertification. Holding out relies on inflicting pain on the public/economy to force Admin concession.
