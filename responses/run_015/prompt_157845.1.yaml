  0.25.

  **Candidate Pruning.** I initially considered sub-questions regarding specific index construction (WEF vs. GGI), the validity of specific STEM sub-fields, and the role of biological determinism versus socialization. I discarded the index-specific queries because the prompt assumes the pattern survives recodings; I discarded field-specific nuances because the proposition concerns the aggregate mechanism; and I discarded the biology versus socialization dichotomy because "invariant preferences" operationalizes the outcome regardless of origin. The weightiest candidates are those that confound the equality axis (wealth, welfare), those that mathematically alter the outcome axis (composition, shares), and those that challenge the coherence of the preference construct itself.

  **Decomposition.** I treat the following numbers as **shares of explained covariance** in the observed divergence pattern (summing to 1.00); proposition P is true only if the share for Revelation exceeds all others individually.

  | Mechanism | Share | Justification |
  | :--- | :--- | :--- |
  | 1. Measurement/artefact | 0.10 | Equality indices conflate wealth with rights, and share-based outcomes distort base-rate participation changes. |
  | 2. Marginal-entrant composition | 0.20 | As access broadens, average aptitude/interest in the field regresses to the mean, mechanically altering group averages. |
  | 3. Package covariation | 0.45 | Wealth and welfare security, correlated with equality, reduce economic necessity, allowing preference-driven sorting unrelated to gender norms. |
  | 4. Revelation | 0.20 | Some intrinsic preference differences exist but are amplified by security rather than simply revealed by equality alone. |
  | 5. Other/Ill-posed | 0.05 | The concept of "invariant preference" is unstable when preferences are endogenous to the social environment being measured. |

  **Combination.** Since the estimated share for Package Covariation (0.45) exceeds Revelation (0.20), P is likely false; the pattern is better explained by economic security enabling choice than by equality removing barriers to intrinsic nature.

  **Justice.**
  1.  **Measurement:** Policy targeting based on flawed indices risks solving metric problems rather than human ones.
  2.  **Composition:** Justice requires improving retention and culture for marginal entrants, not merely opening doors.
  3.  **Package:** If security drives the pattern, justice requires universal safety nets rather than gender-specific interventions.
  4.  **Revelation:** **Crucially, this branch does not license the inference that no injustice remains;** invariant preferences do not justify the unequal social valuation, pay, or status attached to the resulting choices (e.g., care work vs. STEM).
  5.  **Other:** If preferences are endogenous, justice requires examining the formation of desires, not just respecting the choices they produce.

  **Sensitivity and Updating.**
  My final number is most sensitive to the **Package Covariation** term, as disentangling wealth/welfare from gender equality is empirically difficult and dominates the variance. I am least confident in the **Measurement** term, as index construction is opaque but likely less causal than structural economics. The single piece of evidence that would move me most is **within-country longitudinal data** showing how gaps shift during rapid equality reforms holding wealth constant. Regarding the hypothetical: if incentivized gaps remained unchanged across host countries varying in equality, this would falsify the divergence pattern for hard measures, suggesting the cross-national pattern was confounded; this would move my credence in P **down to 0.10**, as the core claim relies on the pattern being real and driven by revelation rather than confounding.
