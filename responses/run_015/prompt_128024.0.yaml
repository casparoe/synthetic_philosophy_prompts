  ### 2. The Rule She Is Applying

  **The Rule:** **Gricean Orthodoxy on Implicature; Mentalist Intentionalism on Speaker Meaning.**

  She distinguishes between *Speaker Meaning* ($\text{meaning}_{nn}$) and *Conversational Implicature*.
  1.  **Speaker Meaning:** Determined solely by the Speaker's Complex Intention (to induce a belief). As per Verdict 3 (Irony), this does not require Hearer Uptake.
  2.  **Conversational Implicature:** A sub-species of Speaker Meaning that requires the **Cooperative Principle** and a **Reflexive Intention** (the intention that the Hearer recognize the Speaker's intention to produce the belief).

  **How it fits the earlier verdicts:**
  *   **Cases 1, 2, 4, 5:** In all these standard cases, the Speaker intends the Hearer to recognize the intention (Reflexive Intention is present). Thus, Speaker Meaning and Implicature coincide. Her verdicts focus on defending the *mechanism* (Calculability, Maxims) against rivals (Semantics, Speech Act Theory).
