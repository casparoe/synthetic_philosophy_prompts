answer: |-
  **Project Title:** Structural Instability in Contractualist Justification: A Pairwise Reconstruction of Scanlonian Non-Aggregation

  **1. Research Question and Conceptual Framing**
  The central research question of this project is: *Is T. M. Scanlon's contractualist rejection of aggregative moral reasoning best reconstructed as a structural vulnerability to cyclic preference orders within the space of justifiable principles?* 

  Standard interpretations of Scanlon's non-aggregation principle frame the dispute quantitatively: the question is whether the number of affected parties confers additional moral weight to a claim. This project proposes a structurally distinct framing. It posits that Scanlon's requirement—that principles must be justifiable to each individual—implicitly establishes a system of pairwise comparisons between competing claims. If justification is fundamentally pairwise, the aggregation problem may not be a refusal to sum welfare, but rather a manifestation of Condorcet-style cycles (where Principle P is justifiable over Q, Q over R, and R over P). Consequently, the impossibility of aggregation may derive from the topological instability of interpersonal justification rather than the intrinsic weight of individual complaints. This inquiry distinguishes itself from existing literature by shifting the locus of analysis from the *magnitude* of claims to the *logical structure* of the justification relation itself.

  **2. Literature Context and Gap**
  Existing scholarship on contractualism and aggregation largely operates within a quantitative paradigm. Debates focus on whether contractualism can accommodate "numbers" without collapsing into utilitarianism, or how to weigh competing complaints of varying intensity. While some commentators have noted the individualistic restriction implies a pairwise comparison of claims, none have systematically modeled this restriction as a formal decision procedure susceptible to cyclicality. The literature treats the failure to aggregate as a substantive moral commitment rather than a potential structural artifact of the justificatory model. By leaving the pairwise-reconstruction question open, current treatments overlook the possibility that the "non-aggregation" result is a necessary consequence of avoiding cycles in a tournament of reasons. This project fills that gap by testing whether the contractualist framework inherently generates cyclicality when scaled beyond dyadic interactions.

  **3. Methodology**
  The research will proceed via two integrated methods. First, I will conduct a close conceptual analysis of the arguments presented in *What We Owe to Each Other*, specifically isolating the criteria for "reasonable rejection" and the structure of individual justification. Second, I will map these criteria onto the formal logic of tournament graphs. In this mapping, individuals or principles serve as nodes, and valid justificatory relations serve as directed edges. 

  This formal mapping will not require original mathematical proofs or novel graph theory. Instead, it will utilize existing concepts from social choice theory (specifically Condorcet cycles) as an analytical lens to test the coherence of Scanlonian principles. The goal is conceptual clarification through formal analogy: determining whether the conditions for reasonable rejection inevitably produce intransitive loops when multiple parties are involved. This hybrid approach ensures philosophical rigor while leveraging formal tools to expose hidden structural dependencies.

  **4. Six-Month Timeline**
  *   **Month 1:** Close textual analysis of *What We Owe to Each Other*, focusing on the definition of "generic reasons" and the structure of reasonable rejection. Drafting exegesis notes.
  *   **Month 2:** Formalization of the pairwise justification model. Defining nodes and edges based on textual evidence; establishing the rules of the "justification tournament."
  *   **Month 3:** Application of the model to classic aggregation cases (e.g., Rescue Case). Testing for cyclicality in scenarios where standard contractualism rejects aggregation.
  *   **Month 4:** Analysis of results. Determining whether cycles are avoidable via contractualist resources (e.g., strengthening the notion of generic reasons) or inherent to the structure.
  *   **Month 5:** Drafting the full manuscript. Integrating textual analysis with the structural model to argue for the structural framing.
  *   **Month 6:** Revision and refinement. Ensuring the formal mapping remains subordinate to philosophical insight and polishing the argument for final submission.

  **5. Success and Failure Conditions**
  A successful result will yield a reconstructed contractualist procedure that explicitly identifies where and why cyclicality arises. Success does not require solving the aggregation problem definitively; rather, it requires demonstrating that the structural framing offers greater explanatory power than the quantitative framing. Specifically, success looks like a model that either resolves cycles through refined contractualist constraints or convincingly argues that contractualism must accommodate local intransitivity.

  Conversely, the project will be deemed a failure if the pairwise reconstruction proves conceptually incoherent—for instance, if the "edges" of the graph cannot be defined without smuggling in aggregative assumptions. Additionally, if the formal mapping collapses into standard aggregation (i.e., the cycle-breaking mechanism simply amounts to counting heads), the structural distinction will have failed to hold.

  **6. Scope Assessment and Risks**
  The primary risk inherent in this project is that the formal mapping may outpace the philosophical payoff within the six-month window. There is a danger that modeling justification as a tournament graph imposes an artificial precision on Scanlon's nuanced qualitative distinctions, leading to a "procrustean" analysis where the philosophy is distorted to fit the formalism. To mitigate this, the project prioritizes conceptual analysis over mathematical development. If the formal model proves too rigid to capture the nuance of "reasonable rejection," the scope will be narrowed to a purely conceptual critique of pairwise structures without the graph-theoretic overlay. This ensures that the final deliverable remains a work of moral philosophy rather than an aborted exercise in formalization.
