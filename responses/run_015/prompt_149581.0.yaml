      *   **Point (2) - The Scope of Rights:** Sen's "minimal liberalism" requires *decisiveness* over specific pairs. In reality, rights are usually protected by *side constraints* (deontology) or *rules*, not by putting every personal choice up for a social welfare function vote. The paradox arises when we try to aggregate *everything* into one function.
