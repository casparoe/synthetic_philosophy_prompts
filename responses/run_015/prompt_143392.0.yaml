  # Decision Tree: Normative Justifications for Intertemporal Discounting

  **Instructions:** Navigate the following decision tree by affirming or denying the claims at each internal node. The path terminates in one of six normative positions regarding the discounting of future welfare. Following the tree, consult the Logical Space Analysis for a diagnosis of unoccupied cells and conceptual overlaps.

  ### The Tree

  **Node 1 (Root):** Does the mere temporal location of a welfare benefit intrinsically reduce its normative weight relative to an identical present benefit?
  *   **Yes** (Affirms Pure Time Preference) → Go to Node 2.
  *   **No** (Denies Pure Time Preference) → Go to Node 4.

  **Node 2:** Is this normative priority grounded in the attenuation of psychological connectedness between the current agent and their future temporal stages?
  *   **Yes** → **LEAF: "Future Selves as Strangers" Partiality Account.**
  *   **No** → Go to Node 3.

  **Node 3:** Does the observed psychological tendency to discount the future carry normative authority for ideal theory?
  *   **Yes** → **LEAF: Rationalist Pure-Time-Preference View.**
  *   **No** → **LEAF: Descriptive Hyperbolic-Discounting Position.**

  **Node 4:** Is a positive discount rate justified solely by the probability that future benefits will fail to materialize (epistemic uncertainty)?
  *   **Yes** → **LEAF: Risk-Premium-Only View.**
  *   **No** → Go to Node 5.

  **Node 5:** Is temporal distance morally analogous to spatial distance (i.e., are both dimensions morally irrelevant)?
  *   **Yes** → Go to Node 6.
  *   **No** → **UNOCCUPIED CELL A** (See Analysis).

  **Node 6:** Does the contingency of future persons' identities preclude standard comparative harm assessments across generations?
  *   **Yes** → **LEAF: Intergenerational Non-Identity Constraint.**
  *   **No** → Go to Node 7.

  **Node 7:** Is the zero discount rate derived from a principle of strict impartiality among all temporal locations?
  *   **Yes** → **LEAF: Sidgwick-Style Universalism.**
  *   **No** → **UNOCCUPIED CELL B** (See Analysis).

  ***

  ### Logical Space Analysis

  This instrument maps the philosophical justification for discounting rather than the economic mechanism. Below is the diagnosis of the logical space generated by the seven decision nodes, including unoccupied cells and difficult distinctions.

  #### 1. Mapping the Leaves
  *   **Sidgwick-Style Universalism:** Path 1(No) → 4(No) → 5(Yes) → 6(No) → 7(Yes).
      *   *Justification:* Time is morally neutral (like space); no uncertainty; identities allow comparison; impartiality requires $r=0$.
  *   **Rationalist Pure-Time-Preference:** Path 1(Yes) → 2(No) → 3(Yes).
      *   *Justification:* Time itself matters normatively; psychological impulses are rationalized into a consistent (exponential) form.
  *   **Descriptive Hyperbolic-Discounting:** Path 1(Yes) → 2(No) → 3(No).
      *   *Justification:* Acknowledges the psychological fact of pure time preference but denies it normative authority (treats it as a bias to be corrected).
  *   **"Future Selves as Strangers":** Path 1(Yes) → 2(Yes).
      *   *Justification:* Parfitian reductionism; discounting is permissible partiality toward closer psychological stages, analogous to interpersonal altruism.
  *   **Intergenerational Non-Identity Constraint:** Path 1(No) → 4(No) → 5(Yes) → 6(Yes).
      *   *Justification:* Rejects pure time preference but blocks standard welfare comparisons due to the metaphysical contingency of future identities.
  *   **Risk-Premium-Only:** Path 1(No) → 4(Yes).
      *   *Justification:* Denies pure time preference but accepts instrumental discounting based on the probability of outcome realization.

  #### 2. Diagnosis of Unoccupied Cells
  The tree generates two primary unoccupied cells, indicating areas of philosophical incoherence or neglect.

  *   **Unoccupied Cell A (Node 5 "No"):** *Denies Pure Time Preference + Denies Risk Premium + Denies Spatial Analogy.*
      *   **Diagnosis:** **Incoherence.** If one denies that time *itself* matters (Node 1), and denies that uncertainty matters (Node 4), one must logically treat time as morally irrelevant (Spatial Analogy). To deny the spatial analogy here implies believing time matters normatively without being "pure time preference" or "risk." This position is unstable; it typically collapses back into a hidden Pure Time Preference view or a Risk view with unstated probabilities.
  *   **Unoccupied Cell B (Node 7 "No"):** *Denies PTP + Denies Risk + Affirms Spatial Analogy + Denies NIP + Denies Impartiality.*
      *   **Diagnosis:** **Neglect.** This position holds that time is like space (irrelevant) and identities are stable, yet rejects the principle of impartiality that usually grounds the zero discount rate. While theoretically possible (e.g., a non-aggregative prioritarian view that still discounts time at zero), it is rarely articulated in the literature. Most views that affirm the spatial analogy derive that neutrality from impartiality.

  #### 3. Specific Logical Consistency Check
  **Query:** *Can exponential pure preference consistently coexist with rejection of the non-identity problem?*
  *   **Analysis:** **Yes, this cell is occupied.** The **Rationalist Pure-Time-Preference View** occupies this space. This view affirms a normative discount rate based on temporal location (exponential) and implicitly rejects the Non-Identity Constraint as a barrier to comparison (Path 1→Yes). The Rationalist assumes that "future welfare" is a coherent metric comparable to "present welfare" regardless of which specific individuals exist.
  *   **Contrast:** The *incoherent* combination would be accepting the **Non-Identity Constraint** (Node 6: Yes) while simultaneously affirming **Pure Time Preference** (Node 1: Yes). If identities are contingent such that comparative harm is precluded (NIP), asserting an intrinsic priority of present welfare becomes logically difficult, as there is no stable subject across time to prioritize. This combination is left unoccupied in the tree (the NIP question is only asked on the "No PTP" branch).

  #### 4. Flagged Conceptual Overlap
  **Pair:** **Spatial-Analogy View (Sidgwick)** and **Risk-Premium-Only View.**
  *   **Separation Difficulty:** These leaves are separated by **Node 4** (Uncertainty) and **Node 5** (Spatial Analogy). However, in practice, these positions are difficult to cleanly separate because epistemic uncertainty often correlates with temporal distance.
  *   **Diagnosis:** A proponent of the Risk-Premium view may argue that as time approaches infinity, probability approaches zero, functionally mimicking the Sidgwickian "impartiality" in the limit. Conversely, a Sidgwickian must argue that even in cases of high uncertainty, the *normative weight* of the welfare remains equal, only the *expected value* changes. The tree separates them by asking if uncertainty is the *sole justification* (Node 4). If a student affirms uncertainty justifies discounting but also affirms time is like space, they face tension: Space does not inherently imply uncertainty, but Time does. This tension suggests the Risk-Premium view relies on an instrumental feature of time (uncertainty) that the Spatial-Analogy view explicitly rejects as morally relevant.
