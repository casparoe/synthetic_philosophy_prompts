  So I've been reading about superrationality lately -- Hofstadter's idea that two agents who are both perfectly rational, and both know the game they're in is symmetric (and know that the other knows, and so on), should end up cooperating in a one-shot prisoner's dilemma, since 'what I'd do' and 'what they'd do' aren't really separate questions once you factor in the symmetry. Honestly I find it pretty convincing. What would count against it? Not just the 'this is secretly evidential decision theory and causally does nothing' complaint everyone opens with -- I want to know whether the argument survives once you grant that, what happens once the game or the players stop being exactly symmetric (does it just quietly break, or is there a principled fallback), and whether its basically been absorbed into newer stuff like updateless or functional decision theory so that 'superrationality' isn't even its own position anymore. Tell me which of these a committed superrationalist would actually admit is a real problem versus which they'd just shrug off, and rank all of them from fatal to merely awkward. Say how confident you are in each point too, and flag whichever one you're least sure you've got right. Give it to me as a numbered list of exactly five points, a sentence or two each -- skip the intro and the wrap-up.
