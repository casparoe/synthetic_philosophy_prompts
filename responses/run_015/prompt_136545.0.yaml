      *   *Verdict:* The "Actor" analogy is too passive. It assumes a separation between the *doer* and the *plan*. In LLMs, the planning happens *in* the doing (the context window). The "No Agency" conclusion is shaky if we define agency functionally (goal-directed adaptation) rather than phenomenologically (feeling like you want something).

