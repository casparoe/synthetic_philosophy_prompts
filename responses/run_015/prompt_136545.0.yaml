      *   *The "No Agency" Conclusion:* This is the hard part.
          *   *Threatening Disanalogies:* If the model can set sub-goals internally (via CoT) and pursue them across multiple steps without user input, that looks like instrumental convergence. If the "actor" starts rewriting the script to ensure the play succeeds, that's agency-adjacent.
