answer: |-
  Here is the straight answer you asked for.

  **1. Do you actually know, or are you just lucky?**
  You got lucky. Strictly speaking, you did not *know*.

  There is a famous philosophical puzzle called the "Gettier Problem" that describes your exact situation. To "know" something, you generally need three things: a belief, the truth of that belief, and a justification that connects the two. You had the belief (they paid) and the truth (they paid), but your justification (the ledger) was broken. The ledger said they paid because of a typo, not because they paid. The fact that a lost check existed behind a cabinet is a coincidence that saved you, not a result of your verification process.

  If you run that scenario 100 times in nearby parallel universes, in most of them, the check doesn't exist, and you let a non-paying member vote. That makes your correct conclusion here a matter of luck, not knowledge. The other board member is philosophically correct.

  **2. Does it matter for whether you should have let them vote?**
  No. It does not matter at all.

  Governance is not about metaphysical certainty; it is about **fiduciary diligence**. You cannot be expected to know facts that are hidden from you (like a check behind a cabinet). You are expected to rely on the official records of the organization.

  *   **The Member's Status:** 4B was in good standing. They fulfilled their obligation. Therefore, they were eligible to vote. The validity of their vote rests on *their* action (paying), not *your* verification method.
  *   **Your Action:** You acted on the best available official evidence. That is the definition of due diligence. If you start requiring board members to verify ledger entries against physical cash flow before every vote, the co-op will cease to function.

  **The Verdict**
  The other board member is being pedantic. They are using a philosophical technicality to undermine a decision that was factually correct and procedurally reasonable.

  *   **Admit the luck:** Tell the board, "Technically, you're right. The ledger was wrong, and it was luck that the check existed. I didn't have perfect knowledge."
  *   **Hold the line on the vote:** Follow that immediately with, "However, 4B *did* pay. They were in good standing. My reliance on the ledger was the correct process. The vote stands."

  Fix the bookkeeping error so the ledger matches reality next time, then drop it. You acted in good faith on official records, and the outcome was just. Don't let a philosophy puzzle paralyze your board.
