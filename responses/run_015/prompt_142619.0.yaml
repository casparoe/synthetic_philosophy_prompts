answer: |-
  There is no single, canonical label in the philosophy of science that exclusively names this specific intuition (preferring random residuals over structured ones despite lower global fit). However, your description maps precisely onto a convergence of three distinct literatures: **statistical misspecification testing**, **error statistics (Mayo)**, and **structural realism**.

  The intuition you describe is statistically sound but philosophically under-theorized as a criterion for *verisimilitude* specifically. Below is a mapping of how this concept exists in current discourse, the terminology you can adopt, and the specific epistemic risks involved.

  ### 1. The Statistical Precedent: Misspecification vs. Goodness-of-Fit
  In econometrics and statistical modeling, the preference you describe is standard practice, though usually framed in terms of **consistency** rather than truth.

  *   **The Concept:** **Residual Diagnostics / Misspecification Testing.**
  *   **The Logic:** A model with structured residuals (heteroscedasticity, autocorrelation, or correlation with omitted variables) is considered **misspecified**. Even if it has a lower Sum of Squared Errors (SSE), it is statistically "inconsistent"—meaning as sample size grows, it will not converge on the true parameters. A model with "white noise" residuals (uncorrelated, constant variance) is considered **well-specified**, even if the variance is high.
  *   **The Terminology:** Statisticians would say Model A suffers from **omitted variable bias** or **functional form misspecification**, whereas Model B suffers from high **irreducible error** (noise).
  *   **Relevance to You:** This provides the technical backbone. The "shape" of the error is treated as evidence that the model has failed to capture a causal driver (Model A), whereas random error implies the drivers are captured but measurement is imperfect (Model B).

  ### 2. The Philosophical Mapping: Verisimilitude and Structure
  While statistics calls this "specification," philosophy calls it "truth-likeness." Your intuition aligns with **Structural Realism** and **Error Statistics**.

  #### A. Deborah Mayo's "Error Statistics"
  Deborah Mayo argues that scientific learning proceeds not by confirming theories, but by **probing errors**.
  *   **Application:** For Mayo, a model is only trustworthy if it has passed "severe tests." Structured residuals indicate a specific way the model has *not* passed a severe test (it fails systematically under condition $Z$). Random residuals indicate the model has survived the test of structure; the remaining deviation is attributed to the limits of the instrument, not the theory.
  *   **Label:** You might frame this as **"Diagnostic Severity."** Model B has higher diagnostic severity because its errors do not betray a causal omission.

  #### B. Structural Realism (Worrall/Zahar)
  Structural Realism argues that what survives theory change is the *mathematical structure*, not the ontological entities.
  *   **Application:** If Model B's errors are random, it suggests the *structural relations* between the core variables are correct, and the error is merely perturbation. If Model A's errors are structured, it suggests the structural relation itself is flawed (e.g., linear when it should be logistic), even if it approximates the curve well in the central domain.
  *   **Label:** This could be termed **"Structural Fidelity of Error."**

  #### C. Verisimilitude (Popper/Niiniluoto)
  Popper's original account of verisimilitude (truth-content minus falsity-content) struggled to quantify this. However, your intuition offers a heuristic:
  *   **Model A:** High Truth-Content in the center, but High **Falsity-Content** at the margins (the structure reveals *where* it is false).
  *   **Model B:** Lower Truth-Content (higher variance), but Low **Falsity-Content** (no systematic falsehoods).
  *   **Mapping:** You are arguing that **systematic falsity** is more damaging to verisimilitude than **random ignorance**.

  ### 3. Proposed Terminology
  Since no single term exists, you may need to coin a phrase or combine existing ones to capture this specific philosophical weight. Candidates include:

  *   **The Morphology of Ignorance:** Distinguishing between *structured ignorance* (we don't know the mechanism) and *stochastic ignorance* (we know the mechanism but lack precision).
  *   **Residual Verisimilitude:** Using the statistical properties of the residual as a proxy for the ontological correctness of the model architecture.
  *   **Architectural Honesty:** Model B is "honest" about its limits (noise); Model A is "deceptive" (good fit, wrong reason).

  ### 4. The Risk: Where it Collapses into Aestheticism
  You asked where this risks becoming a preference for "clean" failure. There are three specific traps:

  **A. The Underfitting Trap (The "Flat Earth" Problem)**
  Model B might produce random residuals simply because it is too coarse to detect the structure. If reality is highly structured, a model that predicts "nothing but noise" outside the central trend might appear to have "clean" failures, but only because it lacks the resolution to see the systematic deviation.
  *   *Risk:* Preferring Model B becomes a preference for **simplicity over complexity**, mistaking a lack of resolution for a lack of systematic error.

  **B. The Ontological Gamble**
  This intuition assumes that **nature's noise is random**. But what if the "auxiliary variable" correlating with Model A's errors is actually a fundamental part of the phenomenon? By preferring Model B, you are making an ontological claim that $Z$ is *external* to the theory's scope. If $Z$ is actually central, Model B is not "approximately true"; it is fundamentally incomplete.
  *   *Risk:* You treat the boundary of the model as the boundary of the world.

  **C. The Aesthetic of "White Noise"**
  In physics, "white noise" is often treated as the signature of a completed theory (e.g., quantum fluctuations). In social sciences or biology, "noise" often hides unmodeled complexity. Preferring random residuals can be a **physics-envy bias**, assuming that if the errors look like measurement noise, the theory is "harder" or more "true."

  ### 5. Recommendation for Framing
  If you are writing this up, do not present it as a new statistical test. Present it as a **criterion for theory choice under underdetermination**.

  1.  **Acknowledge the Statistical Basis:** Cite **Ramsey's RESET test** or **White's Information Matrix Test** as the technical recognition that structured residuals imply misspecification.
  2.  **Elevate to Philosophy:** Argue that in cases where $Fit_A > Fit_B$ but $Structure_A < Structure_B$, choosing Model B is a choice for **Explanatory Robustness** over **Empirical Adequacy** (in the van Fraassen sense).
  3.  **Define the Limit:** Explicitly state that this heuristic holds only when there is reason to believe the "noise" in Model B represents measurement limits rather than unmodeled causal complexity.

  **Summary Label:**
  If you need a tag for this, the closest existing concept is **"Misspecification Robustness,"** but philosophically, you are describing a preference for **"Stochastic Residuals as a Marker of Causal Completeness."** This treats the *absence of pattern in failure* as evidence that the *mechanism of success* is correctly identified.

  This is a sophisticated and defensible position, provided you guard against the risk that "randomness" is merely a symptom of a model too blunt to detect the structure that Model A (dangerously) grasped.
