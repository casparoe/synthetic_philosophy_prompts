      *   *Specific Concepts:* "White noise" residuals, "Systematic error" vs. "Random error," "Model diagnostics," "Goodness-of-fit" vs. "Goodness-of-structure."
      *   *Potential Labels:* "Residual Diagnostics," "Error Structure Analysis," "Systematic vs. Stochastic Error," "The Principle of Common Cause" (Reichenbach).

  3.  **Literature Search Strategy (Mental Simulation):**

      *   *Popper/Verisimilitude:* Popper talked about truth-content vs. falsity-content. Structured errors might indicate high falsity-content despite high truth-content in the central domain.
