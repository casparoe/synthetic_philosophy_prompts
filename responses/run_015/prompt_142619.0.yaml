      *   **Model A:** Tighter overall fit (lower error magnitude), but residuals are *structured* (correlated with auxiliary variables, clustered, non-random).
      *   **Model B:** Looser overall fit (higher error magnitude), but residuals are *unstructured* (random noise, white noise).
      *   **The Intuition:** Some practitioners prefer Model B. Why? Because structured errors suggest a fundamental architectural flaw (wrong theory), while random errors suggest an incomplete instrument measuring a basically right theory (approximate truth).
      *   **The Question:** Is there a recognized label/literature for this? Does "morphology of error" carry philosophical weight regarding *verisimilitude* (truth-likeness)? If not, how to map it, and where does it risk becoming mere aesthetic preference?

  2.  **Initial Brainstorming & Keyword Association:**

