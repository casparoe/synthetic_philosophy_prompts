          *   *Structural Realism (Worrall):* If the math structure is right, errors should be random perturbations. If the structure is wrong, errors will track the missing structure.
          *   *Inference to the Best Explanation (IBE):* Random noise is a better explanation for failure (measurement limits) than systematic drift (causal omission).
      *   **The Risk (Aesthetic vs. Epistemic):**
