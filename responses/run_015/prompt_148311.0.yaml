  At the Bureau of Metaphysical Claims, Gary tries to submit Form 101: "Socrates Is Mortal."
  The Manager, Ms. B, rejects it immediately. "You've listed 'Socrates' and 'Mortal'. But what connects them?"
  "I used the Verb Stamp," Gary says. "Russell says the verb is a special unifying factor. It does the relating itself."
  Ms. B squints. "Is the stamp's power internal to the ink, or external to the paper?"
  "It's... ontological glue," Gary hedges.
  "Glue needs a spreader," she says. "If the relation is external, you need Form R1 to connect the Stamp to Socrates. Then Form R2 to connect Form R1 to the Stamp. Then Form R3..."
  Gary watches the paper tower hit the ceiling lights. "So the claim is never validated?"
  "Not unless you check 'Internal Relations'," she says, sliding over a red pen. "Then Socrates, Mortality, the Stamp, and this Desk are all the same thing. One single Document."
  Gary grabs the pen. "Fine. But how do I clock out?"
  "You don't," Ms. B says, her face blurring into the filing cabinet behind her. "There's no 'you' left to leave. There's only the Office."

