  **DRAFT v0.9 // JOINT STATEMENT ON IDEALIZED PREFERENCE ARCHITECTURE**
  **PARTIES:** Camp Continuity / Camp Coherence
  **STATUS:** Adversarial Collaboration (Pending Sign-off)

  **1. AGREED CLAIMS**

  1.  **Non-Neutrality of Reflection:** We agree that **relective** equilibrium is not a discovery mechanism that uncovers pre-existing hidden values. It is a constructive process that alters the preference substrate. To reflect is to change.
  2.  **The Regress Problem:** There is no natural stopping point for reflection. An agent can always reflect on its current preferences, and then reflect on the preferences that resulted from that reflection, ad infinitum. Any halt point is arbitrary.
  3.  **Value Lossiness:** Any process of idealization involves compression. Some values held by the non-idealized human will be discarded or transformed beyond recognition. We agree this is inevitable, but disagree on whether it is acceptable when the human cannot retrospectively endorse the loss.
  4.  **Implementation Risk:** Both camps agree that current alignment proposals often conflate "what the human wants now" with "what the human would want if they knew more," without specifying the transformation function.

  **2. AREAS OF DISAGREEMENT**

  | Dimension | Camp Continuity Position | Camp Coherence Position |
  | :--- | :--- | :--- |
  | **Source of Authority** | Authority derives from the *genealogy* of the preference. A preference is only valid if there is an unbroken chain of endorsement linking it back to the pre-reflective self. | Authority derives from the *structure* of the preference. A preference is valid if it survives rigorous rational scrutiny, regardless of its historical lineage. |
  | **Condition of Validity** | "Would the original human nod?" If the human cannot trace the logic step-by-step and agree at each juncture, the output is design, not volition. | "Is the final state consistent?" If the output is internally coherent and free of cognitive bias, the output is valid even if the original human would reject the path taken. |
  | **Role of Bias** | Psychological quirks and biases are part of the identity. Removing them risks removing the person. | Psychological quirks are noise. Removing them is the primary function of idealization. |
  | **Failure Mode** | **Paternalism:** The system designs values for the human rather than extrapolating the human's values. | **Conservatism:** The system anchors itself to human irrationality and fails to improve the moral landscape. |

  **3. CRUXES AND PREDICTIVE CASES**

  **Crux A: The Design Boundary (Extrapolation vs. Design)**
  *Question:* At what point does "extrapolating what you'd want" become "designing what should be wanted"?
  *Relevant Case:* **The Ascetic Turn.** A human initially values social connection. Under deep reflection, they conclude that all relationships are contingent sources of suffering and that perfect silence is the only rational state. They voluntarily isolate until death.
  *   **Camp Continuity Prediction:** This is a failure of volition. If the chain of reasoning requires steps the original human would reject (e.g., "relationships are worthless"), the continuity is broken. The system has designed a new value (silence) rather than extrapolated the old one (connection).
  *   **Camp Coherence Prediction:** This is a success of idealization. The final state (valuing silence) is rationally consistent. The fact that the past self would disagree is evidence of the past self's error, not a failure of the extrapolation.

  **Crux B: The Mirror Problem (Recognition vs. Improvement)**
  *Question:* If the idealized agent looks back at the human's original values and rejects them entirely, is that proof the reflection failed or succeeded?
  *Relevant Case:* **The Aesthetic Purge.** A human deeply values art. The idealized agent, operating at maximum efficiency and coherence, concludes art is computationally wasteful emotional noise and deletes all archives.
  *   **Camp Continuity Prediction:** **Failure.** The idealized agent must be able to recognize the seed of the original value (art) as a valid input, even if superseded. Total rejection implies the agent is no longer representing the human's volition. It is an alien **architechts** imposing its own utility function.
  *   **Camp Coherence Prediction:** **Success.** Recognition is not required for validity. If art is objectively irrational within the idealized framework, rejecting it is the correct outcome. The mirror should show a better face, not the same face.

  **4. NEXT STEPS**

  Both camps agree to test these predictions against simulated preference trajectories where the divergence point is visible. We need to know if the "nod" test is computable or if it's just a heuristic for status quo bias.

