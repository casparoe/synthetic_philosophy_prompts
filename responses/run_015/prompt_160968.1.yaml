answer: |-
  ### Brainstorming Candidates

  1.  **The "Meeting Scheduler":** Sends emails to find slots, books rooms, sends invites.
      *   *Verdict:* Too simple. Usually fails Test B (persistence) because it resolves in one session.
  2.  **The "Code Refactorer":** Scans repo, proposes changes, opens PRs, responds to CI errors.
      *   *Verdict:* Too technical for a general legal panel; hard to distinguish "running a script" from "agency" without deep code review.
  3.  **The "Vendor Discrepancy Resolver" (Selected):** Ingests invoice errors, contacts vendors via email/API, waits for responses, updates ERP.
      *   *Why:* It involves external communication (high risk), temporal gaps (persistence), and clear config artifacts (auditability). It sits perfectly on the line.

  ### Thought Experiment

  ProcureCo's "InvoiceReconciler" is deployed to fix mismatched purchase orders. A manager uploads a CSV of flagged errors (Test A: goal supplied at deploy), triggering the system to email vendors for corrected docs. If a vendor doesn't reply within 48 hours, the system automatically switches tactics, logging into the vendor's portal via API to download the data, then updates the internal ERP. This cycle repeats for up to one week per invoice without further human input, continuing even if the manager's login session expires (Test B: persistence/flexibility). The deployment config file specifies `autonomy_mode: multi_step`, allowing up to five external actions per ticket without generating an approval request (Test C: artifact evidence).

  ### Test Analysis

  *   **Test A (Goal-Source): Tool.** The objective ("fix these mismatches") is supplied fresh by the manager's CSV upload. The model isn't pursuing a baked-in training objective like "maximize procurement efficiency" across all users; it's executing a specific batch job.
  *   **Test B (Persistence/Means-End): Agent.** It bridges a temporal gap (48 hours) and switches means (email → API) when blocked. Crucially, it continues when "nobody is watching" (session expiry), exhibiting functional independence.
  *   **Test C (Artifact Tiebreaker): Agent (barely).** The config flag `autonomy_mode: multi_step` and logs showing outbound SMTP traffic without an active user session ID confirm agentic behavior.
      *   **The Flip:** Change the config to `autonomy_mode: single_step` (or `max_actions: 1`). If the system emails the vendor but *stops* and creates a ticket for a human to handle the API login, it reverts to a Tool.

  ### The Key Feature

  The operative feature is **unattended sequential execution**. It's not the complexity of the AI, but the permission to chain external effects across time without re-authorization.

  ### Removal Impact

  If you remove the ability to proceed after session expiry (forcing re-authentication for step two), the system becomes a Tool. The risk profile drops because a human is functionally "in the loop" for every transition, even if they just click "approve."

  ### Best Objection (The "Complex Tool" Argument)

  "This isn't an agent; it's just a sophisticated script with a `while` loop. There's no internal representation of a goal, no planning module, and no capacity to deviate from the hardcoded workflow. Calling it 'agentic' anthropomorphizes a deterministic state machine."

  ### Recommendation for Review Panel

  **Dispositive Test:** **Test B (Persistence/Means-End Flexibility).**
  For safety review burden, temporal persistence is the risk multiplier. A tool that acts only while watched cannot accumulate unnoticed errors or drift. An agent that acts while unattended can.

  **Gaming Vector:**
  A vendor can land in the **Light Review** by **chunking the product**. They sell "InvoiceEmailer" and "PortalFetcher" as separate modules. The user must manually export data from the first and import it to the second. Functionally identical, but architecturally breaks the "unattended loop," passing Test B as a Tool.
