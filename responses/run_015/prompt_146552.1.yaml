answer: |-
  Dear Colleague,

  You have built a robust position, but the Q&A will not be about the strength of your reconstruction so much as the stability of its empirical and metaethical joints. Since you know the room, you can anticipate the trajectory of the twenty minutes with some precision. Your goal in the opening ninety seconds is not to answer a question but to frame the discussion. When the chair hands the floor back to you, do not jump straight into defense. Instead, acknowledge that the empirical wager is the most vulnerable part of the paper and explicitly invite the experimental philosopher and the philosopher of biology to treat that section as a working hypothesis rather than a settled claim. This preemptive humility disarms the most destructive empirical objections by turning them into collaborations rather than attacks. To that end, you should make a specific concession inside the talk itself, ideally just before you present the divergence ranking. State clearly that the ordering of moral domains by stability is provisional and dependent on the available cross-cultural data, which you acknowledge is skewed. If you absorb this concession during the presentation, the experimental philosopher will not feel the need to score a point by extracting it from you during the question period, and you save your energy for the metaethical challenges.

  The first serious challenge will likely come from the philosopher of biology, and while it may not be the most damaging metaphysically, it is the most damaging to your credibility if you mishandle the science. They will ask you to specify the trait selected for and to provide evidence distinguishing an adaptation for flexible moral coordination from a byproduct of general social cognition selected for other purposes. You should concede outright that distinguishing adaptation from byproduct is notoriously difficult and that you do not have a definitive phylogenetic account. What you must refuse to give up is the functional profile itself; insist that even if the trait is a byproduct, the debunking force holds if the byproduct was selected for flexibility rather than truth-tracking. Your two-minute reply should focus on the fact that the selective regime favored outputs that were locally coordinated and motivationally efficacious, regardless of whether the underlying mechanism was a dedicated module or a general cognitive spandrel. The seam in this reply is weak because the biologist can follow up by arguing that if it is a byproduct, the selection pressure was not on moral judgment specifically, which undermines your claim that the faculty was selected for flexible responsiveness to moral conditions rather than just social cohesion generally.

  Following closely on that, the moral naturalist will demand that you formalize your argument as a Bayesian comparison of likelihoods, asking for the probability of our moral beliefs given realism versus given the debunking hypothesis. You should concede that a fully formalized Bayesian model would be ideal but refuse to accept that the argument lacks force without it. Your reply should be that the counterfactual fragility you describe serves as a qualitative proxy for the likelihood ratio, showing that the likelihood of our beliefs given the debunking hypothesis is significantly higher than given realism because realism cannot explain the variation without ad hoc assumptions. The seam here is that the naturalist can press you on why the likelihood is higher without quantitative priors, arguing that your intuition about the ratio is just another moral belief subject to the same debunking.

  You should expect the non-naturalist moral realist to intervene next with the companions-in-guilt objection, phrased as a worry that any argument debunking morality because of evolutionary influences must also debunk mathematics and epistemic norms, thereby destroying itself. You should concede that evolutionary influences exist in all domains but refuse to accept that the debunking mechanism generalizes. Your reply will rely on your audit asymmetry, noting that mathematical and epistemic norms have external checks like proof and predictive success, whereas moral verdicts are checked only by further moral judgment. The seam in this reply is vulnerable because the realist will argue that you are begging the question by assuming morality lacks external checks, which is precisely what is at issue; a good follow-up will point out that moral progress looks enough like epistemic progress that your asymmetry is merely descriptive of our current limitations rather than metaphysical reality.

  This leads directly to a second, more subtle objection from the same realist, who will argue that your audit asymmetry is circular because it assumes the falsity of realism to prove the falsity of realism. You should concede that the asymmetry relies on a functionalist description of moral practice but refuse to give up the claim that this description is neutral enough to be accepted by both sides. Your reply should be that you are not arguing from the falsity of realism but from the absence of evidence for the specific causal link realism requires, given the functional profile. The seam here is dangerous because the realist can argue that the absence of evidence is not evidence of absence, and that your functional profile is itself theory-laden.

  The experimental philosopher will likely return to the empirical wager, objecting that your divergence ranking relies on WEIRD samples and that cross-cultural variation might not track ecological predictors but rather translation errors or different conceptual schemes. You should concede that the data is imperfect and that translation is a genuine confound, but refuse to accept that the variation is merely noise. Your reply should emphasize that the pattern of variation correlates with specific ecological stressors like pathogen load and kinship density, which suggests a functional adaptation rather than random error. The seam is that the experimentalist can point out that correlating moral verdicts with ecological factors does not prove the verdicts are false, only that they are context-sensitive, which a realist can accommodate via indexicality.

  The graduate student will raise the global debunking worry, asking what confines your argument to morality if the style of reasoning works anywhere, and specifically whether it undermines the epistemic norms you use to argue for the debunking conclusion. You should concede that global skepticism is a risk but refuse to accept that your argument entails it. Your reply should be that the argument is domain-specific because it relies on the specific functional profile of moral judgment, which lacks the external checks present in epistemology. The seam is that the student can argue that epistemic norms also have a functional profile selected for survival, and if you deny that undermines epistemology, you must explain why it undermines morality without circularity.

  A seventh objection will likely come from the realist again, targeting the third-factor surcharge. They will argue that they can pay the surcharge by citing a third factor like survival or flourishing that explains both the moral facts and our beliefs, and that your claim of circularity is unfounded. You should concede that third-factor replies are coherent but refuse to accept that they achieve modal robustness. Your reply should be that any third factor they cite is identified retrospectively by looking at what the faculty already delivers, making the alignment claim circular. The seam is that the realist can argue that some third factors, like rational agency, are not identified retrospectively but are prerequisites for any inquiry, including yours.

  Finally, there is the objection I hope nobody asks, because it is the most dangerous rather than merely the awkward. This will come from a combination of the naturalist and the experimentalist, who will point out that your empirical wager is self-defeating because you are using moral judgments to categorize the moral domains in the first place. They will ask how you distinguish harm from purity without relying on the very intuitions you are debunking, and if you rely on them, your data is contaminated by the faculty you claim is unreliable. You should concede that categorization is theory-laden but refuse to give up the distinction entirely. Your reply should be that you are using a descriptive anthropology of moral concepts rather than a normative endorsement, but the seam here is critical because if your categorization relies on intuitions, and those intuitions are debunked, the empirical wager collapses, taking the core of your argument with it. If this question arises, do not try to solve it fully; instead, acknowledge it as a limitation of any naturalized metaethics and pivot back to the fact that even contaminated data shows variation that realism struggles to explain.

  You know these colleagues and you know the stakes. If you manage the first ninety seconds correctly and absorb the empirical concession early, you will force the discussion onto the metaethical ground where your reconstruction is strongest. Trust the flexible-response formulation, watch for the seams I have identified, and do not be afraid to concede the empirical limitations while holding the line on the philosophical implications. I look forward to hearing how it goes.

  Warmly,

  Your Colleague
