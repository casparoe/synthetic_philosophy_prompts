      *   The Lord seeks recognition to confirm independence.
      *   The Bondsman is coerced/unfree, so his recognition is worthless ("thing-like").
      *   The Lord becomes dependent on the Bondsman (for goods/recognition), stagnating.
      *   The Bondsman finds independence through work/fear.
      *   *Key Issue:* Is the problem *who* recognizes (unfree other) or *that* recognition is sought (approval-seeking)?
      *   *Hegel's View:* Recognition must be *mutual* and between *equals*. One-sided recognition fails. It's not just approval-seeking; it's the *quality* of the recognition.
      *   *Finkish Disposition:* A disposition that disappears when conditions for manifestation arise. Here, the power relation destroys the capacity for genuine recognition.

