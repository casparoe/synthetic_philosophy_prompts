  The canvas holds a mere shadowed shade,
  And sculpture copies what is long-since known.
  By verse, the fleeting image is displayed,
  Reflecting Forms that sit upon a throne.
  These arts reflect the archetypes' parade,
  Copies of copies, distant from our own.
  They show the grades where Will is well-arrayed,
  While Will-in-Itself is left alone.

  Yet music strips the Form's thin veil away,
  And copies Will itself, the blind unrest.
  The bass sustains the inorganic clay,
  While melody lays bare the human breast.
  In effort, struggle, rest, and striving's sway,
  Clear to the heart, by concepts unpossessed.
