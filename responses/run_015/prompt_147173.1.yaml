  Here's a joke drafted for a PhD-level audience, focusing on the metaphysics of belief required for a Dutch Book to land, followed by your terminology check.

  ### The Slide Joke

  **Title:** *The Limits of Pragmatic Vindication*

  **The Setup:**
  A hardline Pragmatist bookie tries to Dutch Book an Expressivist's aesthetic credences ($C(\text{Bach}) > C(\text{Mozart})$).

  **The Dialogue:**
  **Bookie:** "I've constructed a sure-fire book against your aesthetic preferences. You're incoherent; you lose money either way."
  **Student:** "But aesthetic judgments are non-cognitive. They don't represent the world."
  **Bookie:** "I don't care about representation. I care about exploitation."
  **Student:** "But exploitation requires a payoff condition tied to a state of affairs. There is no fact of the matter to settle the bet."
  **Bookie:** "I'll settle it!"
  **Student:** "You can't. You're trying to arbitrage a market with no underlying asset. **You can't Dutch Book a sentiment; there's no liquidity in non-cognitive states.**"

  ***

  ### Diachronic vs. Synchronic

  **Diachronic** is the one about updating over time.

  *   **Synchronic:** Constraints on credences at a *single* time slice (e.g., satisfying the probability axioms).
      *   *Mnemonic:* **Syn**chronic = **Syn**apse (firing at once) or **Syn** (together) at one moment.
  *   **Diachronic:** Constraints on how credences change *across* time (e.g., Conditionalization).
      *   *Mnemonic:* **Dia**chronic = **Dia**ry (entries over days) or **Dia**meter (going across).

  Good luck with the workshop!
