      *   **Key Constraint 3:** Cases must cross-cut two dimensions: Biological Dysfunction (Yes/No) vs. Harm/Suffering (Yes/No). Includes environmental/labeling effects.
      *   **Key Constraint 4:** One "twist" mid-way where a fact changes, requiring a revote.
      *   **Key Constraint 5:** Concrete stakes (budget, coverage, codes).
      *   **Key Constraint 6:** Handouts must have *no* philosophical vocabulary.
      *   **Deliverables:** Setup, handout text, rules/roles, timeline, second vote mechanics, debrief (mapping moments to theories), handling skepticism, consent for quoting, honest read on limits.
