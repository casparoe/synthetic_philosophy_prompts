answer: |-
  # Session Plan: The Classification Committee

  **Session Title:** Drawing the Line: A Simulation of Disease Classification
  **Time:** 75 Minutes
  **Room Setup:** Six round tables (3–4 participants each). Mix clinicians and writers at each table if possible.
  **Materials:** Flip chart + markers; Printed "Committee Packets" (one per table); Pens.

  ---

  ## 1. The Setup & Introduction (0:00 – 0:05)

  **Your Opening Script:**
  "Welcome. For the next hour, you are not journalists or clinicians. You are the *Sub-Committee on Diagnostic Classification*. Your task is to decide which conditions get added to the Official Registry of Treatable Diseases.

  Why does this matter? In this simulation, adding a condition to the Registry unlocks two things: a $50 million federal research grant and a mandatory insurance coverage code. Leaving it off means patients pay out-of-pocket and researchers look elsewhere.

  **Ground Rules:**
  1.  **The Science is Fixed:** The facts on the cards have been vetted by a Science Sub-Committee. You cannot debate the data, only what the data *means* for classification.
  2.  **No Google:** Rely only on the text provided.
  3.  **Consent:** I am writing about this session for publication. I will be taking notes on your arguments. If you say something you do not want quoted, say 'Off the record' in the moment. Otherwise, assume I may use your insights anonymously in a future piece.

  You have 40 minutes to review four cases and cast votes. I will ring a bell to signal transitions."

  ---

  ## 2. The Handout Text (Print this on one sheet, double-sided)

  **HEADER:** CONFIDENTIAL: COMMITTEE ON DIAGNOSTIC CLASSIFICATION
  **MISSION:** Vote YES (Include in Registry) or NO (Exclude) for each condition.
  **CRITERIA:** You must determine your own criteria for what constitutes a 'disease.'

  **CASE 1: VESTIBULAR DRIFT**
  *   **Biology:** Inner ear fluid density is 15% outside the species-typical range. Measurable on scan.
  *   **Symptoms:** None. Patients report feeling perfectly healthy.
  *   **Prognosis:** No impact on life expectancy or physical capability.
  *   **Stakes:** Patients want the code for 'preventative monitoring.' Insurers argue it is a waste of resources.
  *   **VOTE:** [ ] YES  [ ] NO

  **CASE 2: GRIEF-IMPAIRMENT SYNDROME**
  *   **Biology:** All hormonal and neurological markers fall within typical ranges for a human under stress.
  *   **Symptoms:** Incapacitating sadness, inability to work or eat, lasting >6 months following a loss.
  *   **Prognosis:** High risk of suicide and economic ruin without intervention.
  *   **Stakes:** Patients beg for recognition to access therapy coverage. Critics argue this medicalizes normal human emotion.
  *   **VOTE:** [ ] YES  [ ] NO

  **CASE 3: NOCTURNAL ALERTNESS**
  *   **Biology:** Circadian rhythm is shifted 8 hours from the population mean. Hormones peak at 10 PM.
  *   **Symptoms:** Inability to stay awake between 8 AM and 4 PM. High alertness between 10 PM and 6 AM.
  *   **Prognosis:** Severe occupational impairment in a 9-to-5 economy. No physical health decline.
  *   **Stakes:** Patients need workplace accommodations coded as 'medical.' Employers resist 'lifestyle' classifications.
  *   **VOTE:** [ ] YES  [ ] NO

  **CASE 4: SENSORY RESONANCE (TWO-STAGE VOTE)**
  *   **Stage A Biology:** Patients report severe pain from ambient sound (traffic, HVAC). Standard audiology scans show *no* structural damage to the ear or nerve pathways.
  *   **Stage A Symptoms:** Chronic anxiety, social isolation, inability to hold employment.
  *   **Stage A Vote:** [ ] YES  [ ] NO

  *(DO NOT TURN PAGE UNTIL INSTRUCTED)*

  ---

  ## 3. The Activity Timeline (0:05 – 0:45)

  **0:05 – 0:15: Round 1 (Cases 1, 2, 3)**
  *   Tables discuss and mark their votes.
  *   **Your Role:** Circulate. Listen for phrases like "It's not real if there's no lesion" vs. "If they're suffering, it's real." Do not intervene.
  *   **At 0:15:** Ring bell. Ask for a show of hands per table for each case. Record the split on the Flip Chart (e.g., "Case 1: 4 Yes, 2 No"). *Do not comment on the results yet.*

  **0:15 – 0:25: Round 2 (Case 4 - Stage A)**
  *   Tables vote on Sensory Resonance based on the "No structural damage" fact.
  *   **At 0:25:** Ring bell. Record votes.

  **0:25 – 0:35: The Twist (Case 4 - Stage B)**
  *   **Instruction:** "Turn to the second side of the handout. New evidence has emerged from the Science Sub-Committee."
  *   **Handout Text (Side 2):**
      **CASE 4: SENSORY RESONANCE (UPDATE)**
      *   **New Biology:** Advanced imaging now reveals a previously invisible over-activity in the thalamic gatekeeping neurons.
      *   **New Symptoms:** Unchanged. Pain and isolation remain.
      *   **New Treatment:** A drug exists to dampen the neuron activity, but it has mild side effects.
      *   **Question:** Does this new biological finding change your classification vote?
      *   **REVOTE:** [ ] YES  [ ] NO
  *   **Task:** Tables discuss if the *biology* changes the *status*.
  *   **At 0:35:** Ring bell. Record the *change* in votes on the Flip Chart. (e.g., "Case 4: Moved from 3 Yes to 6 Yes").

  **0:35 – 0:45: Small Group Debrief**
  *   **Instruction:** "Look at your votes. You just made law. Now, write down the *rule* you used. Complete this sentence: 'A condition is a disease if...'"
  *   Ask them to find one inconsistency in their own logic (e.g., "We said Yes to Grief but No to Vestibular Drift. Why?").

  ---

  ## 4. The Large Group Debrief & Reveal (0:45 – 1:15)

  **0:45 – 0:55: Mapping the Inconsistencies**
  *   Bring the room back together. Use the Flip Chart.
  *   **Prompt:** "Who voted YES for Grief-Impairment (Case 2) but NO for Vestibular Drift (Case 1)?"
  *   **Analysis:** "You prioritized *harm* over *biology*."
  *   **Prompt:** "Who voted NO for Grief-Impairment but YES for Vestibular Drift?"
  *   **Analysis:** "You prioritized *biology* over *harm*."
  *   **Prompt:** "For Case 4 (Sensory Resonance), how many of you voted NO in Stage A, but switched to YES in Stage B, even though the patient's pain never changed?"
  *   **Analysis:** "For you, the *legitimacy* of the suffering depended on finding a broken part."

  **0:55 – 1:05: The Reveal (The Vocabulary)**
  *   **Script:** "For the last hour, you have been wrestling with a debate that has occupied philosophers of medicine for 50 years. You were navigating two competing frameworks without knowing their names."
  *   **Write on Flip Chart:**
      1.  **Naturalism:** Disease is a *fact*. It is a deviation from normal biological functioning. (Values don't matter).
      2.  **Normativism:** Disease is a *value judgment*. It is a state we deem 'bad' enough to intervene in. (Biology doesn't matter as much as the harm).
  *   **Connect the dots:**
      *   "If you said Vestibular Drift is a disease because the ear is weird, you argued like a **Naturalist**."
      *   "If you said Grief-Impairment is a disease because the suffering is real, you argued like a **Normativist**."
      *   "If you changed your vote on Sensory Resonance only when the neuron was found, you revealed that in practice, we often demand Naturalist *proof* to validate Normativist *suffering*."

  **1:05 – 1:10: The Stakes (Authority & Access)**
  *   **Script:** "Why does this distinction matter for your reporting?
      *   **Authority:** If disease is biological (Naturalist), the *clinician* is the ultimate authority. If disease is harmful (Normativist), the *patient* is the ultimate authority.
      *   **Access:** If we require a biomarker for coverage, people with 'invisible' illnesses lose. If we require only suffering, does the healthcare budget break?
      *   **The Label:** In Case 3 (Nocturnal Alertness), is the problem the brain, or the 9-to-5 economy? Calling it a 'disease' fixes the person, not the society."

  **1:10 – 1:15: Closing & Limits**
  *   **Script:** "You have leave with two truths. First: 'It is simply a biological fact' and 'It is simply a value judgment' are both hard to say with a straight face after this hour. Second: The line you draw determines who gets care and who gets dismissed."
  *   **Final Check:** "Any objections to me using the insights from your tables in my coverage? (Pause for any 'off the record' flags). Thank you."

  ---

  ## 5. Handling the Skeptics (Contingency Plan)

  **The Challenge:** "These cases are fake. In real medicine, we know what causes X."
  **The Absorption:** "You are right. In practice, science usually settles this. But when science is *new* or *inconclusive*—like with Long COVID, ME/CFS, or certain mental health conditions—you are back in this room. This simulation strips away the settled science to show you the machinery underneath."

  **The Challenge:** "Who decided the facts on the card? That's biased."
  **The Absorption:** "Exactly. In the real world, the 'Science Sub-Committee' is a group of people with grants and biases. By making the facts arbitrary here, I'm forcing you to focus on your *criteria for judgment*, not the data itself. The bias *is* the point."

  **The Challenge:** "This is semantics. Patients just need help."
  **The Absorption:** "Semantics determine billing codes. Billing codes determine help. If we classify it as 'social' rather than 'medical,' the insurance check doesn't clear. The words are the gatekeepers."

  ---

  ## 6. Honest Read: Limits of the Exercise

  As the facilitator, you must acknowledge what this room *cannot* teach them.

  **1. The Power Dynamic is Simulated, Not Felt.**
  In this room, the journalists and clinicians are the *authorities*. They hold the pen. In reality, patients are the ones begging at the gate, and insurance actuaries are the ones holding the pen. This exercise gives participants a false sense of agency.
  *   **Fix:** In the debrief, explicitly state: "Today you played the Regulator. Usually, you report on the Regulated. Remember that the people in these cases don't get to vote on their own status."

  **2. The "Harm" is Abstract.**
  Reading "incapacitating sadness" is not the same as sitting with a patient who cannot get out of bed. The emotional weight of the "Normativist" argument is often driven by empathy, which is hard to simulate on a index card.
  *   **Fix:** When debriefing Case 2 (Grief), ask: "Did the *clinical language* on the card make it easier to vote No? Would a patient testimony have changed your vote?" This highlights how language shapes classification.

  **3. Consensus implies Solvability.**
  The exercise implies that if we just argue enough, we can find the "right" rule. In reality, the conflict between Naturalism and Normativism is often irreconcilable. It is a political struggle, not a logic puzzle.
  *   **Fix:** In the final 2 minutes, say: "There is no correct answer key for today. The tension you felt? That doesn't go away. It's the engine of health policy. Your job is to report on the tension, not resolve it."

  ---

  ## 7. Facilitator's Cheat Sheet (Flip Chart Layout)

  **Left Column: The Votes**
  *   Case 1 (Silent Bio): Yes / No
  *   Case 2 (Pure Harm): Yes / No
  *   Case 3 (Context): Yes / No
  *   Case 4A (No Marker): Yes / No
  *   Case 4B (Marker Found): Yes / No *(Draw arrow showing shift)*

  **Right Column: The Rules**
  *   "If it breaks the body..." (Naturalist)
  *   "If it hurts the life..." (Normativist)
  *   "If society pays for it..." (Pragmatist)

  **Bottom Center: The Takeaway**
  *   Classification = Power.
  *   Biology + Values = Disease.
