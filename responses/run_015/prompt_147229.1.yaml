prompt: |-
  If Hannah Arendt were alive today and confronted with modern political campaigns that use generative AI to flood public discourse with personalized, contradictory false narratives—not to convince voters of any specific false claim, but to exhaust their capacity to distinguish fact from fiction altogether—how would she classify this practice? Would she see it as an extension of the totalitarian form of lying she analyzed, in which falsehood becomes a sustained political reality, or as something structurally different because no human agent actually holds the beliefs being expressed? I am especially interested in whether she would locate the primary danger in the deception itself or in the erosion of the shared factual ground that she argued makes collective political judgment possible. Please indicate how confident you are in each part of your answer, and identify the specific point about which you are least certain.
