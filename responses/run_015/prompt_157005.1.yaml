  # JOINT STATEMENT ON THE NATURE AND FUTURE OF CIVIL MARRIAGE
  **Parties:** Proponents of the Conjugal View (CV) and Proponents of the Revisionist View (RV)
  **Date:** October 2023
  **Status:** Adversarial Collaboration Draft

  ## PREAMBLE
  We, the undersigned, acknowledge that the debate over the definition of civil marriage has been characterized by high heat and low light. We agree that the stakes involve the welfare of children, the stability of households, the liberty of citizens, and the authority of the state. We further agree that neither side holds a monopoly on concern for the common good. This document does not resolve our differences. It maps them with sufficient precision that future disagreement is not due to misunderstanding.

  ---

  ## 1. AGREED CLAIMS
  *Substantive propositions both sides accept as true or sufficiently probable to proceed.*

  1.  **Historical Primacy of Kinship:** Prior to the 19th century, across most cultures, marriage functioned primarily as an economic and political alliance between kin groups, not as a vehicle for individual romantic fulfillment. The "love match" is a recent historical innovation, not the historical essence.
  2.  **Legal Fungibility:** A significant portion of the legal benefits attached to marriage (tax filing, inheritance, hospital visitation, immigration sponsorship) are technically separable from the social/religious definition of marriage. They could, in principle, be assigned to other contractual relationships without logical contradiction.
  3.  **The Weakness of "Tradition":** The argument "we have always defined it this way" is insufficient on its own. Both sides acknowledge that tradition has previously upheld norms now rejected (e.g., coverture, racial endogamy). Appeal to tradition must be coupled with an account of *why* the tradition existed and whether that reason persists.
  4.  **The Cost of Abolition:** A society with *no* civil marriage status would likely see an increase in litigation over informal breakups, reduced protection for economically vulnerable caretakers (mostly women), and greater state intrusion into private family life to adjudicate custody and support. Both sides prefer a recognized status over total privatization.
  5.  **The Harm Principle:** Both sides agree that gay persons deserve equal dignity and protection under the law. The disagreement is not about whether gay people should suffer, but whether redefining marriage is the correct mechanism to prevent that suffering, or whether it inadvertently harms the institution in a way that ultimately harms vulnerable people (including gay people).
  6.  **Normative Drift:** Both sides acknowledge that since 2015 (in the US), the social norms surrounding marriage (permanence, expectation of children) have continued to weaken. We disagree on the *cause*: CV attributes this to the redefinition; RV attributes this to broader economic and cultural shifts independent of the legal definition.

  ---

  ## 2. DISAGREEMENTS TABLE
  *Mapping the precise locus of conflict.*

  | What's at Stake | Conjugal View (CV) Wording | Revisionist View (RV) Wording | Verdict: Word or World? |
  | :--- | :--- | :--- | :--- |
  | **Ontology of Marriage** | Marriage is a **pre-political reality** the state recognizes. It is grounded in the biological complementarity of male and female and the potential for procreation. | Marriage is a **social technology** the state maintains. It is grounded in the functional need to stabilize caring relationships and protect dependents. | **World (Metaphysical).** This is not merely semantic. It is a dispute about whether social kinds have natures independent of human intention. |
  | **The Child Link** | The connection to children is **internal**. Even infertile couples participate in the *kind* of act that is oriented toward life. To remove this orientation is to change the subject. | The connection to children is **contingent**. Marriage serves children best when it stabilizes the household they are *actually* in, regardless of how they arrived there. | **World (Causal).** Disagreement on whether the *symbolic* link to procreation affects outcomes for children in non-procreative unions. |
  | **State Authority** | The state lacks the **authority** to redefine the core meaning. It can regulate the edges, but cannot declare that a non-conjugal union is "marriage" any more than it can declare a tricycle a "car." | The state has the **responsibility** to update the definition to ensure equal citizenship. If the old definition excludes a class of people from a public good without functional justification, it must change. | **Word/Normative.** Disagreement on the scope of the word "authority" and the limits of legislative power over social concepts. |
  | **Norm Enforcement** | Norms (permanence, exclusivity) are **fragile**. They rely on the underlying structure (sexual complementarity + kids). Remove the structure, and the norms lose their rational basis. | Norms are **adaptable**. Commitment is valuable in itself. We can enforce norms through law and culture regardless of the gender of the participants. | **World (Empirical).** Testable hypothesis about cultural stability. |
  | **Purpose vs. Function** | Asking "What is marriage for?" asks for its **Telos** (inherent purpose). | Asking "What is marriage for?" asks for its **Utility** (social function). | **Word.** This is a category error. CV is asking an Aristotelian question; RV is asking a Utilitarian/Liberal question. They are answering different prompts. |

  ---

  ## 3. CRUXES AND PREDICTIONS
  *Concrete tests where the views diverge. We agree to update our credences based on these outcomes.*

  ### Crux 1: The Double-Entry Problem (Disaggregation)
  **The Proposal:** The state exits the "marriage" business entirely. It issues "Civil Caretaking Unions" (CCU) for any two (or more) adults who demonstrate financial interdependence. The word "Marriage" is returned exclusively to religious and private communities.
  **The Question:** Does this solve the conflict or deepen it?

  *   **CV Prediction:** This accelerates the collapse of the norm. By legally equating CCUs with the old concept of marriage, the state signals that the biological/kinship aspect is irrelevant. Religious communities will be pressured to recognize CCUs as "marriage" anyway. **Outcome:** Higher instability for children born into CCUs; increased litigation over "what counts as care."
  *   **RV Prediction:** This solves the fairness issue. It protects vulnerable dependents without forcing a metaphysical debate on the state. Religious communities retain the right to define "sacred marriage." **Outcome:** Stable outcomes for children in CCUs; reduction in stigma; "Marriage" becomes a stronger *religious* term because it is no longer diluted by state bureaucracy.

  ### Crux 2: The Boundary Cases (Principled Stopping Point)
  **The Cases:** (A) Two elderly sisters sharing a home/finances for 40 years. (B) A triad (three adults) co-raising a child. (C) A 5-year renewable term marriage.
  **The Question:** If marriage is based on care/commitment (RV), why exclude these? If it is based on biology (CV), why include infertile straight couples?

  *   **CV Prediction:** There is no non-arbitrary stopping point for RV. Once "care" replaces "conjugal union," the number of partners or duration is a matter of administrative convenience, not principle. **Outcome:** Legal pressure will mount to recognize polyamorous unions within 15 years.
  *   **RV Prediction:** There is a stopping point based on **administrative feasibility and dyadic symmetry**. The state has an interest in stable *dyads* because they are the minimal unit of mutual accountability. Polyamory presents legal complexities (custody, medical proxy) that the state can reasonably decline to manage without better models. **Outcome:** Polyamory remains legally distinct; sibling pairs are handled via existing contract law, not marriage.

  ### Crux 3: The Conscription Worry (State Power)
  **The Scenario:** A future state, facing demographic collapse, redefines marriage to favor "High-Fertility Unions" (tax breaks only for married couples under 35 with 3+ kids). Childless couples and older couples lose the status/benefits.
  **The Question:** Is this legitimate?

  *   **CV Prediction:** This proves CV right. If the state can redefine marriage for pronatalist goals, it could redefine it for egalitarian goals. The RV has no principled objection, only a contingent one. **Outcome:** RV proponents will struggle to condemn this without smuggling in CV-style "nature" arguments.
  *   **RV Prediction:** This is illegitimate, but not because of marriage's nature. It violates **Liberal Neutrality**. The state cannot use marriage law to enforce a specific conception of the good life (pronatalism) any more than it can enforce religious conformity. **Outcome:** RV condemns this easily using existing human rights frameworks, without needing to reference biology.

  ### Crux 4: The Natural Experiment (The Nordic Model)
  **The Context:** Scandinavia/Western Europe. Marriage is optional; cohabitation is default; high state support for children regardless of parents' status; high rates of non-marital birth.
  **The Question:** What does the data show about child welfare and social stability?

  *   **CV Prediction:** **Negative Update.** We expect to see higher rates of family dissolution in cohabiting unions compared to married unions, even controlling for income. We expect lower paternal investment in non-marital families. **Threshold:** If dissolution rates for cohabiting parents are >20% higher than married parents over a 10-year horizon, CV is strengthened.
  *   **RV Prediction:** **Positive Update.** We expect child outcomes (education, health) to be equalized by state support, rendering the parents' marital status irrelevant. We expect marriage to become a "capstone" of success rather than a foundation. **Threshold:** If child outcomes in cohabiting families are statistically indistinguishable from married families (controlling for income) over a 10-year horizon, RV is strengthened.

  ---

  ## 4. META-COMMENTARY & CONFIDENCE ASSESSMENT

  **Confidence in Substantive Claims:**
  I assign a **75% confidence** level to the structural accuracy of this document. That is, I am fairly certain this represents the strongest version of both arguments as they exist in the philosophical literature (e.g., George/Anderson for CV; Macedo/Brake for RV).

  **Least Certain Point:**
  The point I am least sure of is **Crux 4 (The Natural Experiment)**.
  *Why:* Sociological data is notoriously noisy. "Child outcomes" can be measured in a dozen ways (psychological, economic, educational). Both sides can cherry-pick metrics. Furthermore, the "state support" variable in Nordic countries is a confounder that makes it hard to isolate the effect of *marriage* vs. the effect of *welfare*. A smart critic on either side could argue that the Nordic model is culturally specific and not exportable to the US or other contexts, rendering the "Natural Experiment" invalid.

  **Talking Past Each Other vs. Genuine Disagreement:**
  I estimate that **40%** of the dispute is **Verbal/Ontological** (talking past each other regarding the definition of "marriage" and "purpose").
  I estimate that **60%** of the dispute is **Genuine Normative/Empirical** (disagreement about what the state should do, what norms sustain stability, and the consequences of redefinition).

  *   **The Verbal Part:** If CV admits "Okay, the state calls it marriage for legal convenience," and RV admits "Okay, the word carries historical baggage," the temperature drops. Much of the fight is over who owns the *word*.
  *   **The Genuine Part:** Even if we change the word to "Civil Union," the disagreement remains: Should the state incentivize biological kinship specifically, or any stable caretaking dyad? That is a real conflict about the good of the society, not just semantics.

  **Signed:**
  *The Conjugal View*
  *The Revisionist View*
  *The Adjudicator (AI)*
