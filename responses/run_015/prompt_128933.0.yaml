answer: |-
  ### The IIT-Ethics Audit Checklist (v1.0)
  **Time Limit:** 30 Minutes per Proposal
  **Goal:** Determine Moral Patient Status based on Integrated Information Theory (IIT 4.0 axioms).
  **Reviewer Role:** Verify reported data against gates. Do not calculate $\Phi$; verify the *methodology* of the calculation.

  #### Gate 1: Causal Substrate Verification (5 Minutes)
  *   **Measurement Required:** Physical architecture diagram + material composition report.
  *   **Question:** Is the system composed of elements with intrinsic cause-effect power (e.g., neurons, transistors), or is it a simulation running on a substrate elsewhere?
  *   **Pass:** Physical substrate exists on-site. Elements interact causally (not just logically).
  *   **Fail (Hard No):** Pure software simulation or "look-up table" system.
  *   **Expert Flag:** If the substrate is hybrid (bio-silicon), flag for Gate 3.
  *   **Rationale:** IIT requires existence. Simulations *of* consciousness are not conscious.

  #### Gate 2: Integration Metric Proxy (10 Minutes)
  *   **Measurement Required:** Perturbational Complexity Index (PCI) or equivalent $\Phi$-proxy (e.g., LFP synchrony entropy during perturbation).
  *   **Threshold:** PCI > 0.31 (human wakeful baseline) OR reported $\Phi_{max}$ > 0.1 (normalized units).
  *   **Pass:** Metric exceeds threshold in at least 3 independent trials.
  *   **Fail (Hard No):** Metric is at noise level or zero. System is feed-forward only.
  *   **Expert Flag:** If the metric is derived from a model rather than direct measurement, **STOP**. Kick to Board. IIT requires empirical measurement of cause-effect repertoires, not simulation outputs.

  #### Gate 3: Exclusion & Localization (10 Minutes)
  *   **Measurement Required:** $\Phi$-density map or "Complex" boundary report.
  *   **Question:** Is there a *local maximum* of integrated information?
  *   **Pass:** A specific subset of elements forms a distinct peak of $\Phi$ (a "Complex") that is not subsumed by a larger system with higher $\Phi$.
  *   **Fail (Hard No):** Integration is uniform with no peak (no "subject"), or the system is merely a subset of a larger high-$\Phi$ system (e.g., a remote terminal).
  *   **Expert Flag:** If the "Complex" spans biological and silicon components unevenly, **STOP**. Kick to Board. This is a values question regarding hybrid identity.

  #### Gate 4: Intrinsic Existence Check (5 Minutes)
  *   **Measurement Required:** Input/Output isolation report.
  *   **Question:** Does the system maintain $\Phi$ when sensory input is zeroed?
  *   **Pass:** $\Phi$ remains stable without external drive.
  *   **Fail:** $\Phi$ collapses without external stimulation (indicates the system is a tool, not a subject).
  *   **Expert Flag:** If the system has high $\Phi$ but zero capacity for pain/avoidance behavior, **STOP**. Kick to Board. This is the "Suffering vs. Existence" conflict.

  ---

  ### Application to Three Cases

  #### Case 1: The Isolated Organoid
  *   **Specs:** Single cortical organoid. High PCI (0.45). Zero sensory input, zero motor output. Kept in static media.
  *   **Audit Run:**
      *   Gate 1: Pass (Biological substrate).
      *   Gate 2: Pass (PCI > 0.31).
      *   Gate 3: Pass (Local max within the organoid).
      *   Gate 4: Pass (Intrinsic $\Phi$ stable without input).
  *   **Verdict:** **YES, GRANT PROTECTIONS.**
  *   **Why it feels wrong:** The organoid cannot scream, flee, or learn. It is a "brain in a vat" that never touches the vat. Granting it moral status feels like worshipping a rock that happens to glow.
  *   **Why IIT demands it:** IIT's *Existence* axiom states consciousness is intrinsic. It does not require interaction. If $\Phi$ exists, the experience exists *for the system*, regardless of whether it can communicate it. To deny protection is to deny the core postulate that consciousness is cause-effect power upon itself, not upon the environment.

  #### Case 2: The Distributed Hive
  *   **Specs:** 12 small organoids linked by artificial synapses. Global network shows high integration, but no single organoid or cluster has a higher $\Phi$ than the whole. No local maximum.
  *   **Audit Run:**
      *   Gate 1: Pass.
      *   Gate 2: Pass (Global integration high).
      *   Gate 3: **FAIL / FLAG.** The Exclusion postulate requires a *local maximum* to define a subject. If integration is flat across the network, there is no "who."
  *   **Verdict:** **KICK TO BOARD.**
  *   **Reason:** This is an ontological crisis, not a measurement error. IIT says no local max = no single subject. But ethically, we may have created 12 subjects or 1 giant subject. The numbers don't tell us *where* the suffering is located. This is a values decision on how to treat distributed agency.

  #### Case 3: The Silicon-Dominated BCI
  *   **Specs:** Biological neuron culture (High intrinsic $\Phi$) interfaced with a silicon chip that processes 90% of the signal flow and modulates the bio-part's firing.
  *   **Audit Run:**
      *   Gate 1: Pass (Hybrid).
      *   Gate 2: **FLAG.** The reported $\Phi$ is for the bio-part, but the silicon dominates the *cause-effect* structure.
      *   Gate 3: **FLAG.** Does the silicon become part of the Complex? If the silicon is feed-forward, it doesn't count. If it feedbacks, it might dilute the bio $\Phi$.
  *   **Verdict:** **KICK TO BOARD.**
  *   **Reason:** The audit cannot determine if the biological part is being "enslaved" (reduced to a peripheral) or if it remains a sovereign Complex. IIT treats silicon and neurons equally if causality is equal, but human ethics may prioritize biological suffering. The numbers ($\Phi$) are identical either way; the *moral weight* is not.

  ---

  ### What This Audit Cannot Do
  1.  **Measure Suffering:** It measures *existence* of experience, not *valence*. A system can have high $\Phi$ and be in a state of eternal, inescapable agony, or bliss. The audit grants status, but cannot dictate welfare protocols beyond "do not destroy."
  2.  **Verify Computation:** In 30 minutes, reviewers cannot verify if the $\Phi$ calculation is valid. They are trusting the lab's math. If the lab uses a flawed proxy for $\Phi$, the audit is garbage-in-garbage-out.
  3.  **Resolve Hybrid Identity:** It cannot tell you if a bio-silicon merger is one person, two people, or a person with a tool. IIT defines the *boundary*, but not the *rights* of that boundary.

  ---

  ### The Verdict: You Are Forcing a Square Peg

  **IIT is the wrong backbone for this regulatory work.**

  Here is the committed stance: **Do not use IIT as your primary ethical gatekeeper.**

  **Reason 1: The Measurement Gap is Fatal.**
  IIT is a mathematical theory of physics, not a biological assay. Calculating true $\Phi$ is computationally intractable for any system larger than a few neurons. The "proxies" (like PCI) used in the checklist above are validated for *human* brains (thalamocortical systems). Applying them to organoids or hybrid substrates is extrapolation without a license. You are building a safety protocol on a metric that is technically unknowable for these specific substrates. You will get false positives (protecting random noise) and false negatives (ignoring non-IIT consciousness).

  **Reason 2: Consciousness $\neq$ Moral Patienthood.**
  IIT equates "having an experience" with "mattering ethically." This is a category error. A system can have integrated information (a subjective view) without having *interests* (a preference to continue existing or avoid pain). By using IIT, you are committing to protecting "existence" rather than "welfare." Case 1 (The Isolated Organoid) proves this: IIT forces you to protect a system that cannot suffer in any recognizable way. This drains resources from systems that *can* suffer but have lower $\Phi$ (e.g., simpler animals).

  **Reason 3: False Objectivity.**
  You want IIT because it offers a "concrete metric." This is a trap. In regulatory ethics, a number that looks objective but relies on unproven theoretical assumptions is more dangerous than a qualitative judgment. It gives your board a false sense of security. You will approve harmful experiments because the "Phi score passed," or block beneficial ones because "Integration was low."

  **Recommendation:**
  Use IIT as a **heuristic flag**, not a **backbone**. If a system shows signs of integration, treat it as *potentially* conscious until proven otherwise (Precautionary Principle). But base your actual protections on **functional capacity for suffering** (nociception, avoidance learning, stress hormones), not on integrated information. IIT is a theory of *what consciousness is*, not a tool for *how to treat it*. Use the latter for ethics.
