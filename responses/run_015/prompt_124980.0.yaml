answer: |-
  **Project Title:** The Normative Status of Functionally Repurposed Vestiges

  **1. Research Question**
  This project addresses a gap in the philosophy of biology concerning the attribution of biological function. Current discourse is dominated by Selected Effects (SE) accounts, which tie function to evolutionary history, and Causal Role (CR) accounts, which tie function to current systemic contribution. While these converge on paradigm cases, they diverge on "functionally repurposed vestiges": structures that have lost their original selective environment yet retain their historical causal profile, now accidentally sustaining a *different* organism-level process for which there is no selection history. The central question is: In such cases, does the structure function *properly*, is it *malfunctioning* relative to its history, or does it function only in a *derivative* sense? Resolving this determines whether biological normativity is grounded strictly in history, currently in systemic necessity, or in a hybrid relation.

  **2. Limitations of Paradigm Cases**
  Standard examples, such as the heart pumping blood, fail to resolve this question because evolutionary history and current causal contribution align seamlessly. The heart was selected to pump blood, and it currently pumps blood to sustain circulation. Even in pathology (e.g., a failing heart), both accounts agree on malfunction. The proposed case decouples these variables: the causal mechanics remain intact (identical profile), but the systemic target has shifted without evolutionary endorsement. SE accounts risk labeling this a malfunction (loss of original purpose), while CR accounts risk labeling it fully functional (current contribution). Because neither account captures the intuitive tension of a structure doing "the same work" for a "new master" without historical authorization, the question remains genuinely open.

  **3. Methodology**
  Over four months, I will employ a conceptual analysis strategy divided into four phases:
  *   **Month 1: Conceptual Mapping.** Rigorously define the conditions for a "functionally repurposed vestige," distinguishing it from exaptation and spandrels. I will construct three detailed hypothetical biological scenarios to stress-test the boundaries of the definition.
  *   **Month 2: Stress-Testing Existing Accounts.** I will apply strict SE and CR criteria to these scenarios to catalog exactly where each account yields counterintuitive normative verdicts (e.g., declaring a life-sustaining trait as malfunctioning).
  *   **Month 3: Constructing a Hybrid Account.** I will develop formal conditions for "derivative function," exploring whether normative status can be grounded in the *potential* for future selection or the *stability* of the new systemic reliance.
  *   **Month 4: Synthesis and Validation.** I will refine the criteria against counterexamples and draft the final argument, focusing on the logical coherence of "derivative" attribution.

  **4. Expected Outcomes and Failure Conditions**
  A successful result will be a defensible set of criteria for assigning normative status to repurposed vestiges, likely arguing for a distinct category of "derivative function" that acknowledges causal efficacy without granting full teleological status. This will provide a framework for biologists to describe transitional traits without committing to premature evolutionary narratives.
  The project will be deemed to have failed only if I demonstrate that the distinction between "proper," "malfunctioning," and "derivative" is logically incoherent or collapses entirely under analysis. If the investigation proves that no normative fact exists in these cases beyond descriptive causal power, this negative result will still constitute a completed project, provided the argument is rigorous.

  **5. Scope and Feasibility**
  This project is strictly conceptual and requires no empirical data collection, making it highly suitable for part-time independent study. The four-month timeline is calibrated for approximately 10 hours of work per week. The scope is limited to logical analysis and hypothetical modeling; it does not attempt to resolve the broader SE vs. CR debate but rather isolates a specific intersection where both currently lack explanatory power. This narrow focus ensures completion within one semester while producing a distinct, publishable philosophical contribution.
