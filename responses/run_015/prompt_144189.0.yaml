  ### 1. The Cash Values (Certainty Equivalents)

  You have correctly identified that for "prize-or-nothing" bets (where the lower outcome is $0), the two models are mathematically indistinguishable. Both yield a value of $p^2 \times \text{prize}$. However, once you introduce a non-zero minimum outcome, the math diverges sharply.

  **Story One: Expected Utility (EU) with $u(x) = \sqrt{x}$**
  *Rule:* She values money at the square root, then takes the plain average. To get the cash value, we square the result.
  *   **100-or-400:** $0.5\sqrt{100} + 0.5\sqrt{400} = 5 + 10 = 15$. Cash Value = $15^2 =$ **$225**.
  *   **0-or-800:** $0.5\sqrt{0} + 0.5\sqrt{800} \approx 14.14$. Cash Value = $14.14^2 =$ **$200**.

  **Story Two: Risk-Weighted Utility (REU) with $w(p) = p^2$**
  *Rule:* She values money linearly ($1 is $1), but weights the *chance* of the better outcome by squaring the probability. The formula for a two-outcome gamble $(x_{low}, x_{high})$ is $x_{low} + p^2(x_{high} - x_{low})$.
  *   **100-or-400:** $100 + 0.5^2(400 - 100) = 100 + 0.25(300) =$ **$175**.
  *   **0-or-800:** $0 + 0.5^2(800 - 0) = 0 + 0.25(800) =$ **$200**.

  ### 2. Which one does she take?

  I predict she takes the **100-or-400** flip.

  **The Reason:**
  While both stories fit your pub data perfectly, the **Expected Utility (Story One)** is the much stronger candidate for a person you describe as "cagey."

  In decision theory, being "cagey" or risk-averse usually implies a dislike for *variance* (a mean-preserving spread). Both flips have the same expected value ($250), but the 0-or-800 flip is riskier—it has a wider spread and a chance of total loss.
  *   The **EU model** captures this intuition: it values the safer 100-or-400 flip higher ($225 vs $200).
  *   The **REU model** (with $p^2$) actually predicts she should prefer the *riskier* 0-or-800 flip ($200 vs $175). This is because the $p^2$ function penalizes the probability of the upside so severely that having a "safety floor" of $100 (in the 100-or-400 flip) isn't enough to compensate for the reduced upside compared to the $800 potential.

  It is psychologically unlikely that a "cagey" person would systematically prefer the gamble with a zero outcome over one that guarantees at least $100, provided the average payout is the same. Therefore, the curvature is likely in the money (EU), not just the probability (REU).

  ### 3. The Extra Gamble to Pin It Down

