      *   Key dimensions: Normative principle, handling uncertainty, practical policy.

  5.  **Drafting - Section 3: Cruxes & Tests:**
      *   *Crux 1: Epistemic vs. Normative.* Is the rejection of fanaticism about *value* (bounded utility) or *knowledge* (probability discounting)?
          *   Test: A case where probability is *known* (e.g., quantum mechanics) but payoff is huge.
      *   *Crux 2: Portfolio/Correlation.* Does diversification save fanaticism?
          *   Test: 1,000 independent vs. correlated muggings.
      *   *Crux 3: Symmetry/Cancellation.* Do opposite claims net to zero?
          *   Test: A mugger offers +Utility, another offers -Utility with same credence.
      *   *Crux 4 (Added):* The "Shutdown" problem. If B's guardrail triggers, does it paralyze action?
          *   Test: High-stakes existential risk reduction vs. mugging.

  6.  **Refining and Polishing:**
      *   *Tone:* Neutral, precise, collaborative but acknowledging deep disagreement.
      *   *Formatting:* Clear headings, tables for disagreements.
      *   *Constraint Check:* No citations? Check. Tight? Check. Flag settled/live? Check.
      *   *Self-Correction on "Settled":* Be careful. In philosophy/EA, almost nothing is truly "settled." I should frame "settled" as "agreed within the formalism" vs "disputed normative implication."
      *   *Smuggling Check:* Ensure I don't assume unbounded utility is true in the agreed section. Frame it as "If utility is unbounded..."

  7.  **Final Review against User Prompt:**
