  9.  **Final Polish:** Ensure the distinction between *normative* (what is good) and *epistemic* (what we know) is clear, as that's the heart of the A vs B fight. (Self-correction: Make sure to explicitly flag where the consensus of decision theorists lies vs where the EA/Longtermist community lies, as they differ).

