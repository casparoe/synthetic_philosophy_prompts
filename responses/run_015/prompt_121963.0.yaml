answer: |-
  # JOINT STATEMENT ON EXPECTED VALUE FANATICISM

  **Parties:** Side A (EV Maximization) & Side B (Guardrails/Constraints)
  **Date:** [Current Date]
  **Status:** Draft for Adversarial Collaboration

  ## I. AGREED CLAIMS

  We agree on the following structural and definitional claims. We flag the consensus status of each based on current literature in decision theory and effective altruism.

  1.  **Definition of Fanaticism:** A decision rule is "fanatical" if it prescribes accepting a gamble with a sufficiently low probability and sufficiently high payoff over a certain, moderate outcome, solely because the mathematical expected value (EV) of the gamble is higher.
      *   *Status:* **Settled Definition.**
  2.  **The Source of Fanaticism:** Fanaticism follows necessarily from the conjunction of (i) standard Expected Value Maximization, (ii) Unbounded Utility (no ceiling on how good an outcome can be), and (iii) Non-Zero Probability (no event with non-zero logical possibility is assigned exactly 0% credence).
      *   *Status:* **Settled Formalism.** (Disagreement lies in whether to reject i, ii, or iii).
  3.  **Estimation Error:** In real-world scenarios (unlike idealized lotteries), probability estimates for extreme tail events are subject to high variance, potential bias, and model error. Both sides agree that "noise" in the estimate is distinct from the "true" probability.
      *   *Status:* **Settled Empirical Claim.**
  4.  **The Burden of Argument:**
      *   Side A bears the burden of explaining why strong intuitions against fanaticism are mistaken (e.g., cognitive bias).
      *   Side B bears the burden of proposing an alternative decision rule that avoids fanaticism without introducing arbitrage vulnerabilities (money pumps) or arbitrary cut-offs.
      *   *Status:* **Procedural Agreement.**
  5.  **Scope:** This dispute applies primarily to high-stakes, high-uncertainty contexts (e.g., existential risk reduction, far-future interventions), not routine daily decisions.
      *   *Status:* **Scope Limit.**

  ---

  ## II. DISAGREEMENTS TABLE

  | Feature | Side A (The Fanatic) | Side B (The Guardrail) |
  | :--- | :--- | :--- |
  | **Core Normative Principle** | **Consistency:** If you accept EV maximization for small stakes, you must accept it for large stakes. Rejecting it implies you are leaving value on the table or acting inconsistently. | **Robustness:** A decision theory that yields absurd prescriptions in edge cases is broken. The map (model) is not the territory; when the model is shaky, the output is invalid. |
  | **Handling Uncertainty** | **Separation:** Epistemic uncertainty (not knowing the prob) is separate from normative rules (what to do if you *did* know). We should improve estimates, not change the math. | **Integration:** Epistemic uncertainty *must* modify the decision rule. If the probability estimate relies on weak arguments, it should be discounted or capped regardless of the implied payoff. |
  | **Utility Function** | **Unbounded:** There is no logical ceiling on value. A world with $10^{100}$ happy lives is meaningfully better than one with $10^{99}$, even if we can't comprehend the difference. | **Bounded/Diminishing:** Value must bounded or diminish rapidly. At some point, adding more lives/value stops increasing the "score" meaningfully, preventing the math from blowing up. |
  | **Policy Implication** | **Maximize Tail Potential:** Prioritize interventions with the highest upper-bound EV, even if the median outcome is zero. | **Prioritize Robustness:** Prioritize interventions that work across a wide range of plausible models, avoiding reliance on tiny probabilities. |

  ---

  ## III. CRUXES & TEST CASES

  We identify the following specific points of contention. For each, we specify a concrete case or argument that bears on the crux, and record our respective predictions/outcomes in advance.

  ### Crux 1: Epistemic Error vs. Normative Principle
  **The Question:** Is the rejection of fanaticism a claim about *value* (utility should be bounded) or about *knowledge* (probabilities are too unreliable to use)?
  **The Test Case:** **The Quantum Lottery.**
  A verified physical process (e.g., quantum decay) gives a known, objective probability of $10^{-9}$. The payoff is $10^{10}$ lives saved. The alternative is 1 life saved certainly.
  *   **Side A Prediction:** Rational agents *must* take the lottery. The probability is known physically, so estimation error is removed. Refusing is irrational.
  *   **Side B Prediction:** Rational agents *may still refuse*. Even with known physical probability, the causal link to the payoff (the mechanism saving the lives) introduces model uncertainty that warrants a discount or bound.
  *   **Resolution Condition:** If Side B concedes they would take the Quantum Lottery, the dispute is primarily about **Estimation Error**. If Side B still refuses, the dispute is about **Bounded Utility**.

  ### Crux 2: The Portfolio Problem (Correlation)
  **The Question:** Does facing many such choices justify fanaticism via the Law of Large Numbers, or do correlated errors destroy the portfolio?
  **The Test Case:** **1,000 Independent Muggers.**
  You face 1,000 identical, independent Pascal's Mugging scenarios. Each costs $1, has a $10^{-9}$ chance of saving $10^{12}$ utility. Total cost $1,000.
  *   **Side A Prediction:** You should take all 1,000 bets. The variance averages out; the portfolio EV is overwhelmingly positive. Refusing is leaving massive value on the table.
  *   **Side B Prediction:** You should refuse all (or most). The error in the probability estimate is likely **correlated** (if your model is wrong about one mugger, it's wrong about all). The "true" probability could be zero, making the loss certain.
  *   **Resolution Condition:** Agreement hinges on whether the uncertainty is treated as **Aleatory** (randomness in the world, favors A) or **Epistemic** (uncertainty in the model, favors B).

  ### Crux 3: Symmetry and Cancellation
  **The Question:** Do positive and negative "mugging" claims cancel out, neutralizing the fanaticism problem?
  **The Test Case:** **The Opposite Mugger.**
  Mugger 1: "Give me $5, or I will use magic to save $10^{100}$ lives."
  Mugger 2: "Give me $5, or I will use magic to destroy $10^{100}$ lives."
  Both claim equal credibility.
  *   **Side A Prediction:** The EVs do not necessarily cancel. You must evaluate the specific credence of each claim. If both are non-zero, you might be forced into a paradox or endless payment, highlighting the need to stick to the math until credence is zero.
  *   **Side B Prediction:** This symmetry proves the model is broken. If a decision theory forces you to pay out to both or paralyzes you, it demonstrates that "tiny probability × huge value" is not a valid operation. The guardrail triggers immediately.
  *   **Resolution Condition:** If Side A accepts that symmetry implies **inaction**, they move closer to B's guardrail. If Side A insists on **calculating**, they must explain how to avoid paralysis.

  ### Crux 4: The "Shutdown" Problem (Added)
  **The Question:** Do guardrails paralyze high-stakes action (e.g., existential risk) just as they paralyze muggings?
  **The Test Case:** **Existential Risk vs. Mugging.**
  Scenario X: Reduce chance of human extinction by 0.0001% (hard to estimate).
  Scenario Y: Pascal's Mugging (1 in $10^{12}$).
  *   **Side A Prediction:** Side B's guardrails will make it impossible to justify working on Scenario X, because the probabilities are similarly shaky. This proves B's view is too conservative for real altruism.
  *   **Side B Prediction:** We can distinguish X from Y based on **mechanism**. X has causal mechanisms (physics, policy) even if uncertain. Y relies on ad-hoc claims. Guardrails can filter Y without blocking X.
  *   **Resolution Condition:** Side B must produce a **filtering criterion** that rejects the Mugging but accepts the Existential Risk intervention without appealing to intuition alone.

  ---

  ## IV. VERBAL DISPUTES & SEMANTICS

  We acknowledge that part of our disagreement may be verbal rather than substantive.

  1.  **"Expected Value":**
      *   **Side A** uses this to mean *Mathematical Expectation* (Sum of $P \times V$).
      *   **Side B** often uses this to mean *Action-Guiding Heuristic* (What we should actually do given our limitations).
      *   **Agreement:** We will distinguish between **Ideal EV** (theoretical) and **Robust EV** (estimation-adjusted).

  2.  **"Value":**
      *   **Side A** treats value as a cardinal number that can be summed across persons and time without limit.
      *   **Side B** suspects value may be ordinal, bounded, or context-dependent.
      *   **Agreement:** We will not assume utility is cardinal or unbounded in our test cases unless specified.

  ---

  ## V. NEXT STEPS

  1.  **Resolve Crux 1:** Determine if we disagree on *math* or *epistemology*.
  2.  **Develop Filter:** Side B to draft the "Mechanism Filter" for Crux 4.
  3.  **Simulation:** Run a simulated portfolio test (Crux 2) with correlated error rates to see at what correlation coefficient fanaticism becomes dominated.

  **Signed:**

  _____________________ (Side A)

  _____________________ (Side B)
