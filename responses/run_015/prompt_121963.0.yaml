          2.  Disagreements table (Side A vs. Side B positions in their own words).
          3.  Cruxes section (specifically addressing: shape of value function vs. estimation error, portfolio version/correlation, symmetry/cheap claims).
          4.  Constraint: Tight, no papers/citations, handable format.
          5.  Requirement: Flag settled vs. live controversy, avoid smuggling contested assumptions.

  2.  **Deconstruct the Core Conflict:**
      *   *The Fanaticism Problem:* It's not just Pascal's Wager (theology). It's about decision theory under extreme uncertainty with unbounded utility. If utility is unbounded and probabilities are non-zero, EV dominates.
      *   *Side A (Fanatic):* Consistent EV maximization is the only rational stance. Rejecting it leads to money pumps or arbitrary cut-offs. Estimation error is a separate issue from the normative principle.
      *   *Side B (Anti-Fanatic):* Unbounded EV leads to absurdity (Pascal's Mugging). We need bounded utility, probability discounting, or epistemic humility that functions as a veto.
      *   *Crux (a) Value vs. Estimation:* Is the problem that utility *shouldn't* grow that fast, or that we can't *know* the probability well enough?
      *   *Crux (b) Portfolio:* Do many small bets average out (Law of Large Numbers supports A) or do correlated errors blow up the portfolio (supports B)?
      *   *Crux (c) Symmetry:* Do positive and negative muggers cancel out?

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to define the problem without bias. It's about decision rules under extreme skew.
      *   Acknowledge that standard EV maximization implies fanaticism if utility is unbounded.
      *   Acknowledge that real-world estimates are noisy.
      *   Burden of proof: A must show why intuition is wrong; B must show a consistent alternative rule.
      *   *Settled vs. Live:* It's settled that standard EV implies fanaticism. It's live whether standard EV is the correct normative standard.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to capture the *spirit* of each side.
      *   Side A: "The math is the math. Intuition is a bug."
