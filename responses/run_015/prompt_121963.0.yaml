prompt: |-
  Two people I know have been arguing about expected value fanaticism for ages and I want to make them finally write the adversarial collaboration they should have produced by now. Side A is a committed fanatic: a 1-in-10^12 shot at an astronomically huge payoff beats a much bigger sure thing, every time, and the shakiness of the estimate doesn't by itself get you out of it. Side B thinks that's a reductio and wants some kind of guardrail — a ceiling on value, a probability floor below which you stop trading, discounting by how reliable the estimate is, whatever works.

  Draft the joint statement they could both sign. Start with a numbered section of claims both accept: what the fanaticism problem actually is (not just Pascal's wager with better branding), which stylized cases both agree are genuinely hard, and where the burden of argument sits. Then a disagreements table, with each side's position stated in the wording that side would accept for itself.

  The cruxes I care about: (a) whether the real fight is about the shape of the value function or about what to do when the probability estimate itself might be off by orders of magnitude; (b) the portfolio version — if instead of one small-chance/astronomical-payoff choice you face a huge number of them, does the fanatic's advice get stronger, or does the avoider's worry just reappear because the errors in the estimates are correlated; (c) the cheap-claims point, whether for every Pascal's mugger there's a symmetry argument that cancels them out. Add any crux you think I've missed, and for each crux give a concrete case or argument both would accept as bearing on it, with each side's prediction written down in advance. If some of the dispute is really verbal — about what "expected value" or "value" is even doing in the argument — say which part and why.

  Keep it tight, no papers or citations, i want something I can hand to both of them. Also flag atleast roughly which claims are settled among people who work on this and which are live controversy, and don't let one side's contested assumptions sneak in as settled background — tell me where you're unsure.
reasoning: |-
