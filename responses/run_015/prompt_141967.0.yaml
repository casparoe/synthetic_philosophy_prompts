      *   Check the definition of Rule 3 again. "Each copy... inherits that branch's full squared-amplitude weight... renormalize across all the copies."
          *   Scenario A: Branch A (Weight 0.75, 3 copies). Branch B (Weight 0.25, 1 copy).
          *   Total Weight Mass = $3 \times 0.75 + 1 \times 0.25 = 2.5$.
