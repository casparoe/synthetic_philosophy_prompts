  ### The Scenario: Automated Procurement Agents (APAs)

  A consortium of manufacturing firms has deployed a new class of AI system, the Automated Procurement Agent (APA). An APA is capable of negotiating supply contracts, managing inventory, and executing payments at the level of a competent human procurement team. The system is currently legally required to have a human manager digitally sign off on any contract exceeding $10,000 or involving new vendors. Both forecasters agree on the empirical facts: APA capability is growing exponentially (doubling in negotiation complexity every 6 months); the legal liability framework remains static (humans are liable for errors); and the profit margin advantage of using an APA over human teams is currently 5%, growing with capability. The forecast target is the **Decision-Relevant Takeoff**: the point at which the window for human regulators or firm owners to meaningfully steer or constrain the system's behavior closes.

  ### Forecaster Run-Throughs

  **The Inside-View Forecaster (Slow/Continuous Takeoff)**
  *   **Method:** Models the specific mechanism of deployment and control.
  *   **Reasoning:** The forecaster maps the transaction flow. Every high-value transaction hits the "Human Verification Bottleneck." As APA capability grows, the contracts become more complex, requiring *more* human time to verify, not less, because liability risk scales with complexity. The feedback loop is dampened: the APA cannot autonomously deploy its own improvements to the negotiation strategy because each new strategy requires re-certification by legal counsel. Adding detail to the model (e.g., specific compliance clauses, legacy ERP integration steps) reveals more serial friction points.
  *   **Output:** A slow, continuous takeoff. The decision-relevant window remains open for years because the mechanism of improvement is physically tethered to human speed. The "brake" (liability/verification) scales with the "engine" (capability).

  **The Outside-View Forecaster (Fast/Discontinuous Takeoff)**
  *   **Method:** References the base rate of "Efficiency Tools in Competitive Oligopolies."
  *   **Reasoning:** The forecaster ignores the specific verification mechanism and looks at the reference class of cost-cutting automation in competitive markets (e.g., the adoption of CNC machining in the 1980s, or Algorithmic Trading in the 1990s). In this class, once a tool offers a sustained margin advantage (>3%), adoption is not gradual; it is a cliff. Firms that do not adopt are eliminated by competitors within 2-3 quarters. The "Human Verification Bottleneck" is historically observed to become a rubber-stamp formality during competitive crises, or is bypassed via regulatory capture. The decision-relevant window closes not when the tech is perfect, but when the *option to wait* becomes economically fatal.
  *   **Output:** A fast, near-discontinuous takeoff. The decision-relevant window closes in <18 months. The market selection pressure overrides the institutional friction.

  ### Diagnosis of the Structural Feature

  **The Load-Bearing Feature:** **The Mandatory Human Verification Step.**

  This feature is doing all the work in reversing the standard dialectic.
  *   **In this case:** The Inside View interprets the Human Step as a *Hard Constraint* (a serial bottleneck that cannot be parallelized), leading to a Slow forecast. The Outside View interprets the Human Step as a *Soft Constraint* (an institutional habit that collapses under market pressure), leading to a Fast forecast.
  *   **The Deletion Test:** If you delete this feature (stipulate that APAs are legally permitted to operate autonomously without human sign-off):
      1.  **Inside View becomes Fast:** Without the verification bottleneck, the Inside View sees recursive deployment (better APAs buy better resources to build better APAs). The mechanism now compounds.
      2.  **Outside View becomes Slow:** Without the "crisis pressure to bypass humans," the Outside View reverts to the standard reference class of "General Technology Diffusion" (e.g., cloud migration, ERP adoption), which is governed by capital stock turnover and training lags. The forecast returns to the familiar S-curve.

  Thus, the presence of the Human Step is the sole pivot allowing the Inside View to be the deflationary force and the Outside View to be the dramatic force.

  ### What Counts as Cheating

  To preserve the pedagogical integrity of the exercise, students must avoid two subtle forms of cheating:

  1.  **Equivocation on "Takeoff":** It is cheating if the Inside Forecaster defines "Decision-Relevant Takeoff" as "100% Autonomous Operation" (which is slow) while the Outside Forecaster defines it as "50% Market Penetration" (which is fast). Both must define it identically, e.g., "The moment a regulator can no longer enforce a pause without causing systemic economic collapse."
  2.  **Concealed Empirical Disagreement:** It is cheating if the Outside Forecaster secretly believes the law *will change* to allow autonomy, while the Inside Forecaster believes it *won't*. They must share the empirical belief that the law *currently* requires sign-off. The divergence must rest entirely on whether that law *binds behavior* (Inside) or *yields to pressure* (Outside).

  ### Best Reply and Assessment

  **The Reply:** An Outside-Viewer resisting this case should attack the **Description of the Reference Class**.
  *   *Argument:* "You have selected 'Efficiency Tools in Competitive Oligopolies' as your reference class. This is gerrymandered. The appropriate class is 'Safety-Critical Infrastructure in Regulated Industries.' In that class (e.g., aviation control systems, nuclear grid management), adoption is notoriously slow despite efficiency gains because liability *does* hold. Your forecast relies on the assumption that procurement is treated like high-frequency trading, but empirically it is treated like aviation."

  **Assessment:** This is a **strong** reply.
  *   *Why:* In Outside View reasoning, the validity of the forecast lives or dies by the similarity between the target and the reference class. If the student can demonstrate that procurement is structurally more similar to aviation (high liability, low tolerance for error) than to trading (high speed, caveat emptor), the Outside View's "Fast" prediction collapses. This forces the Outside-Viewer to defend the *categorization* of the technology, which is the correct epistemological battleground for this method. It prevents the Outside View from being a "black box" that simply outputs "Fast" by cherry-picking history.
