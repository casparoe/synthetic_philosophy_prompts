answer: |-
  Dear Colleagues,

  I am writing this to clarify the groundwork we need before debating specific statutory language, because if we do not agree on what a definition of death must achieve, we will talk past one another indefinitely. We need a set of desiderata that function as requirements for any account of death intended for legal and clinical use, and each must be justified by a specific case or consideration that shows why it is a requirement rather than a mere preference. The first requirement is Irreversibility, driven by the case of the mimic such as profound hypothermia or overdose where circulation and brain function stop and then come back. This is a requirement because if the condition can be reversed, the patient was not dead but merely injured, and declaring death prematurely violates the fundamental legal protection afforded to the living. The second requirement is Organismal Unity, driven by the case of the patient with a destroyed brain on a ventilator whose body remains warm, perfused, heals wounds, and may even carry a pregnancy. This is a requirement because the law protects the biological organism, and if the body continues to function as an integrated whole despite brain destruction, declaring death risks treating a living organism as a corpse. The third requirement is Clinical Decidability, driven by the need for a clinician to know within hours when she may switch off the ventilator or a procurement team may begin. This is a requirement because a metaphysical truth that cannot be verified at the bedside is useless to the law and creates unacceptable uncertainty for families and staff. The fourth requirement is Normative Consistency, driven by the case of Donation after Circulatory Determination of Death where the heart stops and everyone waits a few minutes before organs are taken. This is a requirement because the waiting period acknowledges that death is not the arrest itself but the transition to a state where resuscitation will not be attempted, ensuring we are not creating death by our actions.

  Regarding the stipulation about perfusion technology that can keep brain tissue metabolically alive and restore electrical activity after circulation stops, we must confront what happens to the Irreversibility desideratum if the technology exists but is not used. If irreversible quietly comes to mean won't be reversed because we've chosen not to reverse it, the desideratum collapses from a biological fact into a normative judgment of Permanence. This means the criterion is no longer about whether the function can return in principle, but whether it will return in practice given our current choices and technologies. This shift is critical because it admits that death is partly a social decision about when to stop trying, rather than a purely natural event we discover. On the matter of the Dead Donor Rule, the member insisting that any acceptable account must preserve it is correct about the goal but mistaken about the category, as the Dead Donor Rule is a separate moral constraint that got smuggled into a definitional question. It is a moral constraint because it prohibits killing for organs, whereas the definition of death determines when someone is no longer a subject of moral protection against killing; conflating them risks defining death loosely just to facilitate procurement, which undermines the integrity of the diagnosis.

  There are four distinctions this account cannot collapse without causing ethical or legal harm, and each has a specific case illustrating the danger. We cannot collapse the death of the organism versus the death of the person, illustrated by the patient in a permanent vegetative state who sleeps and wakes and has reflexes but lacks awareness, because equating them would declare living bodies dead simply because they lack cognitive function. We cannot collapse criterion versus test, illustrated by the mimics where circulation stops and comes back, because the criterion is the concept of what death is while the test is the measurement we use, and confusing them means we might declare someone dead just because our current test fails to detect life. We cannot collapse determining that someone has died versus deciding that more treatment is pointless, illustrated by the family who wants continued support for a brain-dead relative, because withdrawing futile treatment is a decision about benefit while declaring death is a statement of fact, and merging them allows clinicians to impose value judgments under the guise of biological assessment. Finally, we cannot assume one uniform criterion has to cover everybody without justification, illustrated by infants born with a brainstem and almost no forebrain, because applying adult standards of consciousness to neonates who never developed them may be category errors requiring age-specific adjustments.

  Now I must mark which of these desiderata are non-negotiable and which are just what one camp happens to want, as this is where our committee will likely fracture. Irreversibility and Clinical Decidability are non-negotiable because without them the law cannot function safely or practically, whereas Organismal Unity is often treated as a preference by those who prioritize personhood over biology. I must flag that Organismal Unity and Clinical Decidability cannot be satisfied together in all cases, because maintaining somatic integration on a ventilator can persist for weeks while the bedside tests for brain death are immediate, creating a gap where the body looks alive but the law says it is dead. The single requirement that knocks out the most candidate accounts is Absolute Biological Irreversibility, because as the perfusion stipulation shows, almost nothing is biologically irreversible if we throw enough technology at it, forcing us to accept Permanence instead.

  To conclude with how the usual families of accounts handle these pressures, the Whole Brain account buys off the Organismal Unity desideratum by redefining integration to mean brain-mediated integration rather than somatic continuity, allowing us to declare death even if the body heals. The Brainstem account buys off the Higher Brain desideratum by locating life in the capacity for breathing and arousal rather than consciousness, which keeps vegetative patients alive but excludes anencephalic infants. The Higher Brain account buys off the Organismal Unity desideratum by equating death with the loss of personhood, which solves the vegetative state case but risks declaring living organisms dead. The Circulatory account buys off the Irreversibility desideratum by redefining it as Permanence, accepting that the heart could be restarted but declaring death because we choose not to restart it. I hope this breakdown helps us move from circles to decisions.

  Best regards,

  [Your Name]
