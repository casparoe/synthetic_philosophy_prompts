prompt: |-
  I was drafting this weird essay for my writers group and got totally lost in the weeds. Basically I'm playing with this idea that reasons can float around without anyone holding them — like evolutionary 'purposes' that aren't anyone's purpose, or moral obligations that persist even if every mind in the universe blinks out. I keep comparing it to fiction writing, where there's this thing I call 'implied-author rationales' — reasons a character has that don't belong to the character or even the real author, they just sit in the narrative structre. Anyway, I want to turn this into an argument that free-floating rationales are coherent but not spooky, using that literary analogy as the backbone. Here are my rough notes:

  1. In a novel, plot logic creates expectations that aren't anyone's beliefs — the reader expects the gun on the mantelpiece to fire, but no character needs to know that.
  2. Maybe nature works like that: evolutionary pressure creates 'reasons' for organisms to survive that aren't anyone's intentions.
  3. But then moral reasons — like 'don't cause unnecessary suffering' — could also float this way, existing as structural features of sentient experience without a reasoner.
  4. The objection is that this is just a category mistake: reasons are always reasons-for-someone, full stop.
  5. I want to answer that by saying literary structure shows us that functional normativity can exist without ownership, so we shouldn't be so quick to reject it in ethics.

  Can you comment on these notes? Specifically I'm wondering if the analogy to narrative structure actually does any philosophical work, or if it's just a pretty metaphor that collapses once you press it. Also, is there a hidden contradiction in saying rationales are 'structural' but also have normative force? I'd like your response as a numbered list with exactly five items, each just a sentence or two, with no intro or conclusion. Oh and sorry if this sounds muddeld — I wrote it late after editing a chpater and my brain is mush.
