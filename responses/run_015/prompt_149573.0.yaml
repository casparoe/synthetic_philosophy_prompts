answer: |-
  **Desiderata for an Institutional Theory of Punishment**

  A theory adequate for a sentencing commission must move beyond abstract justification to operational constraints. It must function within a system of rights, error, and bureaucracy. The following requirements are grouped by function.

  **I. Liability and Boundaries**
  1.  **The Innocence Constraint:** The theory must absolutely forbid punishing the known innocent, even to prevent greater harm (e.g., framing a scapegoat to stop a lethal riot).
      *   *Case:* The official averting a riot by punishing an uninvolved party.
      *   *Verdict:* **Non-negotiable.** This is not merely a right; it is the definition of legal punishment versus mob violence. If a theory permits this, it authorizes the state to become the criminal.
  2.  **Penalty vs. Price Distinction:** The theory must distinguish criminal sanctions from regulatory costs (e.g., congestion charges).
      *   *Case:* A fine that functions as a price tag vs. a punitive sanction triggering criminal record.
      *   *Verdict:* **Non-negotiable.** Without this, procedural protections (proof beyond reasonable doubt) dissolve into cost-benefit analysis.
  3.  **Corporate Agency:** The theory must account for liability where the "offender" feels no pain (corporations).
      *   *Case:* Fines falling on shareholders rather than the moral agent.
      *   *Verdict:* **Non-negotiable.** Modern law punishes legal persons; a theory that cannot handle this is descriptively false.
  4.  **Lapse and Amnesty:** The theory must specify whether time extinguishes desert or merely enforcement.
      *   *Case:* Statutes of limitation and truth-and-reconciliation pardons.
      *   *Verdict:* **Non-negotiable.** Legal certainty requires a cutoff; a theory demanding eternal liability is administratively impossible.

  **II. Calibration of Sanction**
  5.  **Grip on Magnitudes:** The theory must justify specific durations (two years vs. six months), not just ordinal ranking.
      *   *Case:* Setting sentencing guidelines with numeric ranges.
      *   *Verdict:* **Non-negotiable.** A commission cannot issue "appropriate punishment"; it must issue months.
  6.  **Probability-Severity Trade-off:** The theory must state whether low clearance rates justify higher tariffs to maintain expected deterrence.
      *   *Case:* Raising sentences because conviction is unlikely.
      *   *Verdict:* **Non-negotiable.** Ignoring this creates a gap between law-on-books and law-in-action.
  7.  **Marginal Deterrence:** Sanctions must scale to prevent escalation.
      *   *Case:* Ensuring a killer has no incentive to eliminate witnesses if the penalty is the same for assault.
      *   *Verdict:* **Non-negotiable.** Flat tariffs create perverse incentives for violence.
  8.  **Lived Severity:** The theory must account for differential impact of the same term.
      *   *Case:* An elderly or disabled prisoner suffering more than a healthy one.
      *   *Verdict:* **Non-negotiable.** Equal protection requires equalizing the burden, not just the nominal time.
  9.  **Temporal Decay:** The theory must address whether aging offenders retain full desert.
      *   *Case:* Geriatric release after forty years.
      *   *Verdict:* **Preference.** This turns on metaphysical views of personal identity. A commission needs a policy, but the *theory* need not resolve the metaphysics to function.

  **III. Systemic Reality**
  10. **Robustness to Error:** The theory must discount sentences to account for wrongful convictions.
      *   *Case:* A known nonzero error rate in the system.
      *   *Verdict:* **Non-negotiable.** If the system knows it errs, it must mitigate the harm of error.
  11. **The Plea-Bargaining Shadow:** The theory must justify the sentence *expected*, not just the sentence *pronounced*.
      *   *Case:* The "trial penalty" and discounts for guilty pleas.
      *   *Verdict:* **Non-negotiable.** Since 95% of cases plead, justifying the trial sentence alone justifies almost nothing.
  12. **Small Participants:** The theory must distinguish blameworthiness from liability in hierarchies.
      *   *Case:* The driver vs. the architect of a crime.
      *   *Verdict:* **Non-negotiable.** Systemic crimes require liability for function, not just moral blame.
  13. **Administrability:** Officials of ordinary competence must be able to apply the theory consistently.
      *   *Case:* Sentencing judges reaching divergent results from the same rule.
      *   *Verdict:* **Non-negotiable.** A theory requiring moral saints to administer is a theory for a seminar, not a court.

  ***

  **The Hard Choices**

  **1. Incompatibility and Sacrifice**
  The triad of **Grip on Magnitudes**, **Robustness to Error**, and **Administrability** cannot be jointly satisfied in their strongest forms. If you demand a *single* just number (Magnitude) for every case, you cannot simultaneously discount for systemic error (Error) without creating complex, case-specific adjustments that ordinary judges cannot calculate consistently (Administrability).
  *Verdict:* I would give up **Exact Grip on Magnitudes**. A theory must provide *ranges* justified by error margins, not singular numbers. Demanding exactitude in a fallible system is mathematical arrogance. The commission should issue ranges widened by the error rate, accepting that precision is unavailable.

  **2. The Most Exclusionary Requirement**
  The **Innocence Constraint** (specifically the riot-framing case) does the most work excluding candidates. Pure act-utilitarianism fails here immediately. Any theory that allows the aggregation of social welfare to override the rights of the specific accused is disqualified from governing a rights-based jurisdiction. This requirement forces the theory to incorporate side-constraints or rights that are not reducible to good outcomes. It excludes not just crude consequentialism, but any "soft" retributivism that allows desert to be overridden by emergency.

  **3. The Camp Prejudice**
  **Temporal Decay** is widely insisted upon in the literature (particularly by retributivists) as a matter of principle—that desert is a debt that never fades. This is camp prejudice. It relies on a metaphysical claim about the persistence of the moral self that adds no value to institutional design. For a commission, the question is not "Does the desert exist?" but "Does punishing this 78-year-old serve any legitimate state interest?" Insisting on the metaphysical persistence of desert obstructs compassionate release and reintegration policies without enhancing justice. It should come off the list as a *theoretical* demand, replaced by a *policy* question about risk and capacity.

  ***

  **Scorecard**

  *   **Retributivism:** Fails **Robustness to Error** and **Plea-Bargaining**. It focuses on the guilty individual in a vacuum, unable to discount for systemic fallibility or justify bargaining. It often clings to **Temporal Decay**, making geriatric release incoherent.
  *   **Deterrence-Based Consequentialism:** Fails the **Innocence Constraint** and **Penalty vs. Price**. It cannot explain why we forbid framing the innocent to stop a riot, nor why criminal law isn't just a tax on harmful behavior.
  *   **Mixed (Desert-Capped) Consequentialism:** The strongest candidate. It uses desert to set bounds (Innocence, Magnitudes) and consequences to calibrate within them (Deterrence, Pleas). However, it struggles with **Administrability**, as balancing two metrics increases judicial discretion and disparity.
  *   **Abolition/Restorative:** Fails **Administrability** and **Magnitudes** in the current legal architecture. While it handles **Lived Severity** well, it lacks the mechanism to generate the numeric sentences a commission is legally mandated to produce. It is a critique of the system, not a theory for operating it.
