answer: |-
  Before I address the specific mechanics of your model and the fate of your cooperators, I want to honor your request to slow down and disentangle the conceptual threads. In evolutionary game theory, and particularly in the philosophy of biology, it is exceptionally common to conflate concepts that are mathematically distinct but intuitively similar. Given your background in inverse problems, you will appreciate that we are dealing with a situation where the "forward model" (the theory) is clean, but the "inversion" (inferring the cause of the collapse from the output) is ill-posed unless we separate the variables.

  Here are the three distinctions I suspect are running together in your analysis:

  **1. Nash Equilibrium vs. Evolutionary Stability**
  You invoke the Folk Theorem to suggest that because mutual cooperation is a Nash Equilibrium (NE), it should be self-enforcing. This conflates a static condition of individual rationality with a dynamic condition of population survival. A Nash Equilibrium simply means that no *single* agent can improve their payoff by unilaterally changing strategy, assuming everyone else stays fixed. However, the Folk Theorem also guarantees that *universal defection* is a Nash Equilibrium in the repeated game. Evolution does not select for "equilibria" in the abstract; it selects for strategies that grow when rare and resist invasion when common. An outcome can be a Nash Equilibrium (like cooperation) but still be evolutionarily unstable if a mutant strategy can drift into the population and pave the way for a collapse. You are treating the NE as a gravitational attractor, but in evolutionary dynamics, it is merely a flat spot on the landscape; there may be other flat spots (like All-Defect) that are deeper or wider.

  **2. Deterministic Payoffs vs. Stochastic Realization**
  Your arithmetic for the stability threshold ($w > 2/3$) relies on expected payoffs in a deterministic world. You assume that when Tit-for-Tat (TFT) meets TFT, the payoff is always $R$ per round. However, you introduced execution noise ($\epsilon = 0.005$). In a repeated game, noise is not a "harmless detail"; it fundamentally alters the effective payoff matrix. When two TFT agents meet with noise, a single error triggers a cascade of alternating retaliation (C-D, D-C, C-D...) that reduces the average payoff significantly below $R$. Your stability calculation assumes $P(\text{TFT}, \text{TFT}) = R/(1-w)$, but in your simulation, $P(\text{TFT}, \text{TFT}) < R/(1-w)$. This lowers the invasion barrier for defectors. You are comparing a deterministic threshold against a stochastic reality.

  **3. ESS vs. Neutral Stability (The "Nowak-Sigmund" Problem)**
  You recall a result that "no pure strategy is evolutionarily stable" in the repeated Prisoner's Dilemma. This is true in the unrestricted space of all possible strategies, but there is a more specific issue here. Even if TFT satisfies the mathematical definition of an Evolutionary Stable Strategy (ESS) against All-Defect in a deterministic setting, it is not *neutrally* stable. TFT does exactly as well against itself as "Always Cooperate" (ALLC) does against TFT. This means ALLC can drift into a TFT population through random fluctuations (genetic drift) without being selected against. Once ALLC is present, All-Defect (ALLD) can invade ALLC easily. Thus, a population can move from TFT $\to$ ALLC $\to$ ALLD without any strategy ever having a *positive* selection advantage during the first step. You are looking for a reason why TFT was *defeated*, but it may have been *undermined* from within by a neutral mutant.

  ***

  ### Diagnosing the Model

  Based on these distinctions, I do not believe your code is wrong. I believe your theoretical premises about what the code *should* do are based on the deterministic, noise-free version of the theory, while your simulation includes the stochastic friction that real biological systems face.

  The collapse you observed is likely driven by the interaction between **noise** and **neutral drift**, exacerbated by the presence of **Win-Stay-Lose-Shift (WSLS)** in your menu.

  1.  **The Noise Penalty:** As noted, TFT punishes errors. In a noisy environment, WSLS is theoretically superior to TFT because it corrects errors (if I defect and you defect, I "lost," so I shift to cooperation). If your simulation includes WSLS, it should actually outcompete TFT. If cooperation collapsed entirely to All-Defect, it suggests that even WSLS could not sustain a cooperative cluster against the constant 1% mutation rate reintroducing All-Defect, or that the noise level was high enough to make the "cooperative peak" too narrow.
  2.  **The Drift Pathway:** Even without WSLS, the TFT $\to$ ALLC $\to$ ALLD pathway is the standard explanation for cooperation collapse in well-mixed populations. Once the frequency of TFT drops below a certain critical mass due to drift, All-Defect becomes the best response.
  3.  **The Mutation Rate:** You mention 1% of the population is replaced by a random strategy each generation. In evolutionary terms, this is a very high mutation rate. It constantly pumps All-Defect into the system. If the selection pressure favoring cooperation (the payoff difference) is weakened by noise, the mutation pressure can overwhelm the selection pressure.

  **The Diagnostic Run**

  To distinguish between "code error," "noise sensitivity," and "structural instability," I propose a single, decisive change to your model:

  **Set the execution error probability $\epsilon$ to zero.**

  Keep everything else identical (same strategies, same $w$, same mutation rate, same Fermi rule). Run the simulation multiple times from the same 95% TFT seed.

  *   **Outcome A (Cooperation Stabilizes):** If cooperation persists and TFT (or WSLS) dominates when $\epsilon = 0$, then your code is correct, and the culprit is **noise sensitivity**. This confirms that TFT is not robust to implementation errors and that your stability calculation was invalid for the noisy case. This validates the "No pure ESS" intuition in a practical sense.
  *   **Outcome B (Cooperation Still Collapses):** If cooperation collapses even with zero noise, the problem is likely the **mutation rate** or the **neutral drift** pathway (TFT $\to$ ALLC $\to$ ALLD). This would indicate that in a well-mixed population, direct reciprocity alone is insufficient to maintain cooperation against constant infiltration, even without noise.
  *   **Outcome C (WSLS Wins):** If cooperation persists but TFT is replaced by WSLS, then your model is working perfectly, and the lesson is that **error-correcting strategies outcompete reciprocal strategies** in noisy environments.

  Given the parameters you described, I predict **Outcome A or C**. The 0.5% noise is sufficient to degrade TFT's performance against itself below the threshold required to resist the 1% mutation influx of All-Defect.

  ***

  ### What to Tell Your Reading Group

  You asked whether this collapse shows that reciprocity needs assortative interaction or kinship, or if you discovered something about your model. The answer is both.

  You should tell your group that **direct reciprocity is fragile.** The intuition that "I'll scratch your back if you scratch mine" works beautifully in textbooks where agents are rational and hands do not slip. But in biological or social reality, mistakes happen. When mistakes happen, simple reciprocity (TFT) turns into a feud.

  The collapse in your well-mixed model demonstrates two profound points for a philosophy of biology discussion:

  1.  **Robustness matters more than Optimality:** TFT is "optimal" in a clean world, but WSLS (or other error-correcting strategies) are "robust" in a messy world. Evolution selects for robustness. If your model shows WSLS beating TFT, that is a feature, not a bug. If it shows All-Defect winning, it shows that without *structure* (like spatial networks, tags, or kinship) to cluster cooperators together, the constant noise and mutation can wash away the cooperative equilibrium.
  2.  **Equilibrium Selection is Path-Dependent:** The Folk Theorem tells us cooperation is *possible*, not that it is *inevitable*. Your simulation shows that the basin of attraction for the "All-Defect" equilibrium is often wider than the "Cooperation" equilibrium in well-mixed populations. To get cooperation to stick, you usually need a mechanism to bias interactions (assortment) so that cooperators meet cooperators more often than chance would dictate.

  In short: You have not found a bug. You have found the boundary condition of the theory. Cooperation via direct reciprocity is not mysterious, but it is not magic; it requires a substrate (low noise, error-correction, or population structure) to survive. Your inverse problem is solved: the "signal" of cooperation was drowned out by the "noise" of the environment and the dynamics of drift.
