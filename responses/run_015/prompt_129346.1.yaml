answer: |-
  First, I want to validate your intuition. You have naturally stumbled upon a classic debate in moral philosophy: the distinction between *mala in se* (things wrong in themselves, like murder) and *mala prohibita* (things wrong because they are prohibited or regulated, like driving on the wrong side of the road).

  Your reasoning is sharp, but your framework has a specific flaw that needs correcting before we can answer the specific questions. You are operating under the assumption that **conventions and moral obligations are mutually exclusive.**

  That is the part you are asking "wrong." In professional ethics, we generally agree that conventions *can* generate moral obligations. The fact that a rule is arbitrary in origin (e.g., "we drive on the left") does not mean obeying it is morally neutral once the system is established.

  Here is the breakdown of where your reasoning holds, where it breaks, and why the restaurant case is actually the key to the whole puzzle.

  ### 1. The False Dichotomy: Convention vs. Morality
  You argue: *"A convention can't also be a moral obligation."*

  **The Counter-Argument:**
  Conventions are often the *mechanism* by which we fulfill universal moral duties like Fairness, Respect, and Non-Harm.

  *   **Queueing:** You compared queueing to driving sides. That is slightly off. Driving sides is a **pure coordination convention**. It doesn't matter which side we pick, only that we pick the same one. But queueing is a **distribution convention**. It is a physical method for allocating a scarce resource (space on a bus) based on the moral principle of *First-Come, First-Served*.
  *   **The Moral Obligation:** If you jump the queue, you aren't just breaking a local custom; you are claiming a priority over others that you haven't earned. You are effectively stealing time from everyone behind you. That violates the universal principle of Fairness, even if the specific method of queuing (a single line vs. a crowd at the door) is conventional.

  **Verdict:** The *form* is conventional, but the *obligation* to adhere to the form (once you enter the system) is moral.

  ### 2. Your Cousin Was Right (And You Dismissed Them Too Quickly)
  You argue: *"That sounded to me like just a fancier way of saying people get offended."*

  **The Counter-Argument:**
  Your cousin was referencing the philosophical distinction between **predictive expectations** and **normative expectations**.
  *   **Predictive:** "I expect it will rain." (If it doesn't, I am surprised.)
  *   **Normative:** "I expect you to keep your promise." (If you don't, I am entitled to blame you.)

  When locals get mad at a queue-jumper, it isn't just "parochialism" or hurt feelings. It is a reaction to a violated claim. By entering the bus stop, you implicitly enter a social contract with the other waiters: *"We all agree to wait our turn so no one has to fight."* When you break that, you aren't just being "different"; you are free-riding on their cooperation. You benefit from the order they maintain without paying the cost (waiting).

  **Verdict:** It is not just about offense. It is about violating a reciprocal agreement of cooperation.

  ### 3. The "Visitor" Loophole
  You argue: *"Does it matter that a visitor is only there for a week... I feel like that makes it purely about avoiding awkwardness."*

  **The Counter-Argument:**
  This is the "Anonymity Fallacy." In ethics, does your duty to not steal disappear if you are never coming back to that shop? No.

  *   **The Principle of Fair Play:** When you voluntarily enter a cooperative scheme (like a public transport system or a restaurant) from which you benefit, you incur an obligation to follow the rules of that scheme, even temporarily.
  *   **The Damage:** If every tourist decided "I'm only here for a week, so I won't queue," the system would collapse into chaos. Your individual action relies on the assumption that *others* (locals) will keep following the rule. If you opt out while relying on their compliance, you are acting as a "free rider."

  **Verdict:** Temporary status does not remove moral obligation. It might reduce the *social* consequence (you won't be shunned long-term), but it doesn't change the *ethical* status of the act.

  ### 4. The Restaurant Case: It Is Not Separate
  You argue: *"The menu prices are lower... but that seems like a separate issue, not about the convention itself."*

  **The Counter-Argument:**
  This is the most critical point. You have identified the exact moment where a **convention hardens into a contract.**

  *   **Tipping as Etiquette:** In some countries, tipping is a "bonus" for good service. Here, your argument holds more water. Not tipping is rude, but perhaps not "immoral."
  *   **Tipping as Wage Subsidy:** In the case you described (US-style model exported elsewhere), the tip is not a gift; it is a **deferred price**. The restaurant owner charges \$10 for a meal instead of \$25 because they have outsourced the wage obligation to the customer.

  If you know this system is in place and you refuse to tip, you are not just breaking a convention; you are **consuming labor without paying for it.** You are effectively stealing services. The "convention" here is actually a transparent economic agreement.

  **Verdict:** This case proves that conventions *can* be moral obligations. When the convention is tied to someone's livelihood or a pricing structure you accepted by ordering, opting out is no longer just "cultural difference." It is material harm.

  ### Summary: How to Fix Your Framework

  You asked if the "conventions can't be moral obligations" thing is right. **It is wrong.**

  Here is the corrected philosophical model for your family arguments:

  1.  **Pure Coordination (Driving side):** Morally neutral. You should follow it for safety, but there is no deep moral weight.
  2.  **Fairness Conventions (Queueing):** Morally loaded. The method is arbitrary, but the principle (fair access) is universal. Violating it is unfair free-riding.
  3.  **Economic Conventions (Tipping/Wages):** Morally critical. If the convention is part of the wage structure, ignoring it causes direct financial harm.

  **The "Visitor" Exception:**
  The only time a visitor is "off the hook" is if the norm is **purely symbolic** and **unknown**. If there is no sign, no way to know, and no material harm caused by breaking the norm (e.g., wearing the wrong color shirt to a funeral), then you are innocent.

  But for queuing and tipping? You are entering a system of cooperation. As a philosopher, I would tell your parents: **You don't have to believe the local norm is "better" than yours. But by choosing to participate in their society, even for a week, you agree to play by their rules of cooperation.** To do otherwise is to treat the locals as NPCs in your vacation story rather than equal moral participants.

  So, your cousin was right about the expectations, and the restaurant case wasn't an exception—it was the proof that conventions carry moral weight.
