  my family went to another country this summer and my parents kept arguing about tipping and about how people line up (or dont) at the bus stop, and I think ive basically got it figured out but I want u to fill in the details. Heres my reasoning: tipping and queueing are just conventions, like driving on the right side of the road — nobody thinks its morally wrong to drive on the left, its just whatever everyone happens to do where u are. And real moral rules have to be universal, they apply to everyone everywhere. So a convention cant also be a moral obligation, and the only reason to follow the local one is that u'll get dirty looks if u dont. Which means: if someone comes from a place where pushing to the front is totally normal and nobody feels insulted by it, theyre not doing anything wrong by doing that when they travel, and the locals who get mad are being just as parochial as the tourist is. my cousin said something about there being two different kinds of expectation — what u think people *will* do vs what u think they *should* do — and that the second one is what makes something a real norm, but that sounded to me like just a fancier way of saying people get offended.

  the bit I couldnt settle: does it matter that a visitor is only there for a week and will never see these people again? I feel like that makes it purely about avoiding awkwardness, no moral stuff left. the only case that bothered me is when restaurants there pay waiters almost nothing bc they assume tips, so the menu prices are lower — but that seems like a separate issue, not about the convention itself.

  so: is the "conventions cant be moral obligations, and visitors are off the hook" thing right, where exactly does it break down, and is that restaurant case really separate or does it show something about the rest of it?
