  Your view aligns with **Cultural Attraction** (the Attractor model). This assumes ideas are not copied, but *reconstructed* from memory and context every time they are transmitted. Mutations are not random; they are *biased* by cognitive ease, medium constraints, and social utility. People converge on the same "simplified" version independently because their minds pull the idea toward a stable, easy-to-hold shape (an "attractor"), not because they are copying a specific ancestor.

  **Mapping Your Cases:**
  1.  **Dance Trend:** Memetics predicts one original video mutating and spreading. Cultural Attraction predicts independent convergence on the simplest motor pattern. Your observation (independent emergence of the two-move version) falsifies strict Memetics and confirms Attraction.
  2.  **Slang:** Memetics struggles to explain why a "meaningless" version out-competes a "specific" one unless "meaninglessness" is inherently fitter. Attraction explains this as semantic bleaching: empty words are cognitively cheaper to deploy in varied contexts, so reconstruction biases toward emptiness.
  3.  **Life-Hack:** This is the strongest evidence for you. Memetics implies utility drives fitness. If the broken hack wins, Memetics must argue "looking easy" is fitter than "working." Attraction argues the *form* that survives is the one easiest to reconstruct, even if function decays. The medium (15s limit) acts as a mold, shaping the idea regardless of utility.

  **Verdict:**
  Your account is mechanistically correct. Your friend is describing the *outcome* (differential survival) but misidentifying the *process* (selection of copies vs. biased reconstruction). In cases like these, fidelity is low, and transformation is directional. The "winner" isn't the best idea; it's the idea that best fits the human mind and the transmission medium.

  **Confidence:**
  85%. This framework consistently explains viral degradation, urban legends, and folk taxonomy better than strict replicator models.

  **What Would Change My Mind:**
  Evidence that the winning variants are spreading via high-fidelity copying (e.g., direct downloads, "stitch" features that lock content) rather than human reconstruction from memory. If the two-move dance spread because everyone downloaded the *same* two-move video file rather than learning it and re-enacting it, the Replicator model would regain ground.

  \answer{Cultural Attraction}
