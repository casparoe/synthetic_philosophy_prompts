  In a climate resilience fund office, directors must choose between reinforcing existing sea walls (Safe) or deploying a novel alkalinity-enhancement drone swarm (Risky). The drone swarm's performance follows a fat-tailed distribution where most deployments yield exponential carbon sequestration (unbounded upside), but rare hydrodynamic interactions during storms trigger irreversible coastal acidification (a bounded downside catastrophe, representing the utility floor). Historical pilot data (the sampling frame) was collected exclusively in calm lagoons, truncating the storm-driven failure mode from the record. The Expected Value (EV) agent, integrating utility over the observed lagoon data, sees a near-zero probability of acidification and massive sequestration gains, approving the swarm as "safe-and-good." The Maximin agent, evaluating the physical support of the open-ocean deployment rather than just the sampled frequencies, identifies the acidification scenario as physically possible, notes its utility floor is lower than the Safe option's minimum cost overrun, and vetoes the swarm.

  **Theoretical Walkthrough**
  The EV agent calculates $\mathbb{E}[U] = \int U(x) \hat{p}(x) dx$, where $\hat{p}(x)$ is the probability density estimated from the truncated sampling frame. Because the catastrophic tail is clipped from the data, $\hat{p}(\text{catastrophe}) \approx 0$, allowing the unbounded upside of the successful outcomes to dominate the integral, yielding a high positive value. The Maximin agent evaluates $\max_{a} \min_{x \in \text{Support}} U(a, x)$. They do not rely on the sampled frequencies but on the *support* of the true distribution (the physical possibility space). Since the catastrophe lies within the physical support, the minimum utility for the Risky option is the bounded floor (e.g., ecosystem collapse), which is strictly worse than the Safe option's minimum (e.g., budget waste).

  **Structural Feature**
  The divergence is driven by the **truncation of the sampling frame** interacting with the **asymmetry of the utility curve**. The truncation blinds the EV calculation to the downside bound, while the unbounded upside inflates the perceived value of the visible outcomes. If the downside were not bounded (or the bound not severe relative to the safe option), Maximin might not veto; if the sampling frame were not truncated, EV would see the risk. The critical friction is that EV trusts the *data* (which is clipped), while Maximin trusts the *mechanism* (which includes the clip).

  **Symmetrizing the Utility Curve**
  If you symmetrize the utility curve by **bounding the upside** to match the bounded downside, the EV agent's calculation changes drastically. The "giant payoff" that previously dominated the expected value integral is capped. While the truncation still hides the catastrophe, the visible outcomes no longer generate sufficient expected value to clearly outweigh the Safe option, especially if variance is penalized. This reduces the EV agent's confidence, potentially aligning them with the Maximin agent. Conversely, if you symmetrize by making the **downside unbounded** (matching the upside), the Maximin veto becomes absolute (negative infinity), widening the philosophical gap, though the practical decision (reject risky) remains the same.
