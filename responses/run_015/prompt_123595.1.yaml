prompt: |-
  Your're an urban-philosophy expert who also actually gets distributed systems. Before you answer, do a quick mental brainstorm: list three ways a zoning ordinance behaves like a distributed lock, then set that list aside and do the real translation.

  I'm a backend engineer fluent in concurrency control — locks, deadlocks, resource starvation, ACLs, consensus protocols — and I only know urban theory casually. I want you to restate the debate over zoning, NIMBYism, and the idea of a right to the city (Lefebvre's concept, I'm not asking for a citation) using my vocabulary. Frame the city as a shared resource pool, zoning as an access-control layer, residents and developers as competing nodes, and NIMBY opposition as a kind of distributed locking that can produce spatial deadlock or even livelock. Inject the niche idea of urban voids — parcels that drop out of the allocation protocol entirely, neither developed nor formally protected — and see whether that concept survives the translation.

  Then give me the residue report: which parts map cleanly, which parts you have to distort to fit (for instance, the normative claim that use-value should dominate exchange-value), and which parts have no counterpart in engineering vocabulary at all. For each gap, tell me whether it's a deficiency in my framework or a sign that the original philosophical claim is less precise than it looks.

  Keep settled facts separate from genuinely contested ones — for example, don't present NIMBYism as purely rational self-interest or purely collective-action failure if people who study this actually disagree — and don't frame either side as the consensus.

  Lead with your bottom line in the very first sentence, something like the structural mechanics translate well but the normative core collapses, then jump straight into the translated framework and the residue. No preamble, no echoing my question back, and please don't ask me for a bibliography or reading list — I can't look anything up right now.
