answer: |-
  The structural mechanics of urban conflict map cleanly to distributed concurrency patterns, but the normative core of the "right to the city" collapses when reduced to access control.

  ### The Translated Framework

  View the city as a distributed state machine where land parcels are shared memory segments subject to concurrent write requests. **Zoning** functions as a rigid schema validation layer combined with an Access Control List (ACL); it defines not only who can write to a segment but what data types (uses) are permissible. **Developers** act as write-heavy nodes proposing transaction commits that increase density or change state, while **residents** act as read-heavy validator nodes with veto power embedded in the consensus protocol.

  **NIMBYism** translates to a pessimistic locking strategy. Residents acquire locks on adjacent parcels during public review periods to ensure local consistency (neighborhood character). While this prevents dirty reads (incompatible developments), aggressive locking leads to **spatial deadlock**: multiple parties hold locks waiting for others to release, resulting in zero throughput (no housing built). Alternatively, it produces **livelock**: constant state modification proposals, appeals, and hearings that consume CPU cycles (political capital) without ever committing a transaction. **Resource starvation** occurs when write requests from high-demand nodes are perpetually deferred due to lock contention from established nodes.

  **Urban voids**—parcels neither developed nor protected—survive this translation as **orphaned memory or network partitions**. In a clean system, unreachable state is garbage-collected; in the urban system, these parcels exist in a suspended state where the consensus protocol has timed out or crashed. They are allocated resources that return null on access checks. This concept holds up technically: it describes a resource leak where the allocation protocol fails to reclaim or assign state, leaving the segment unusable by any node.

  ### Residue Report

  **1. Clean Mappings**
  *   **Concurrency Contention:** The competition for limited land maps perfectly to lock contention in high-traffic databases.
  *   **Starvation:** The correlation between restrictive zoning and housing shortage maps directly to write starvation caused by aggressive read-locking.
  *   **Consensus Latency:** The delay between proposal (application) and commit (construction) mirrors the latency inherent in distributed consensus protocols like Paxos.

  **2. Distorted Mappings**
  *   **Use-Value vs. Exchange-Value:** Engineering treats memory as homogeneous; urbanism treats land as semantically loaded. Zoning attempts to enforce *use-value* (living space) over *exchange-value* (profit), which looks like an inefficient allocation algorithm from a systems perspective. To fit this into your framework, you must distort the concept of "efficiency"—maximizing throughput (units built) conflicts with maximizing semantic integrity (community stability).
  *   **Identity:** In distributed systems, nodes are usually interchangeable or identified by keys. In cities, nodes (residents) are unique and non-fungible. Treating them as generic validators distorts the social weight of their veto.

  **3. Missing Counterparts**
  *   **The "Right" to the City:** Engineering deals with *permissions* (granted by an admin), not *rights* (inherent claims). Lefebvre's concept implies an inherent write-access privilege for all users regardless of ACLs. There is no counterpart in concurrency control for a user who legitimately bypasses authentication because their existence grants them root access.
  *   **Legitimacy of Locks:** In engineering, a lock is valid if the protocol grants it. In urbanism, a lock (veto) can be protocol-compliant yet philosophically illegitimate (e.g., exclusionary zoning).

  **4. Gap Analysis**
  *   **Framework Deficiency:** The lack of a "right" counterpart is a deficiency in your engineering vocabulary. Concurrency control is descriptive (how things work), not normative (how things should work). It cannot model ethical claims without external injection.
  *   **Philosophical Imprecision:** The "right to the city" is less precise than it looks. When translated, it demands a rewrite of the kernel (overthrowing the ACL system entirely) rather than a patch. The vagueness of the claim masks the extreme technical debt required to implement it.
  *   **Contested Status:** Whether NIMBY locking is a "bug" (starvation) or a "feature" (consistency check) is genuinely contested. Systems engineers would call it a bug if throughput is the goal; social architects might call it a feature if data integrity is the goal. The framework cannot resolve this priority conflict without a defined objective function.
