          *   Section 2: The Central Claim (Compatibility). Validate the "levels" approach but introduce the tension regarding the *nature* of the right to life.
          *   Section 3: Interest (Fiction). Discuss how to dramatize abstract concepts. Suggest focusing on the emotional weight of "deprivation" vs. "intrusion."
          *   Conclusion: Encouragement.

  5.  **Refining the Philosophical Nuance (Self-Correction during drafting):**
      *   *Wait, does Marquis accept Thomson?* Marquis actually argues that his FLO argument avoids the pitfalls Thomson exposes because he doesn't rely on "personhood" in the Lockean sense. But he still concludes abortion is immoral. He argues that the right to life *does* include the right not to be killed, even if it requires bodily use, *unless* the pregnancy threatens the mother's life. So, Marquis would *reject* the user's compatibility claim. He would say FLO establishes a right strong enough to *trump* bodily autonomy in most cases.
