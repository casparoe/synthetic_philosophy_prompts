prompt: |-
  I'm a novelist, and I'm working on a book in which two characters — a bioethicist and a philosopher of law — have a long, serious, and ultimately unresolved debate about the ethics of abortion. The debate is the moral center of the novel, and I want the philosophy to be as accurate and as interesting as I can make it. To that end, I've written a short draft essay that lays out the two arguments as I currently understand them, and I'd like your careful comments before I turn the essay into dialogue.

  Here is the draft:

  The most common objection to the future-like-ours argument is that it is refuted by the famous violinist thought experiment. But I think this objection mistakes the level at which each argument operates.

  The future-like-ours argument is, at bottom, a value-based argument. It answers the question "What makes killing wrong?" by answering: it deprives the victim of a future of value, a future like ours. It establishes the magnitude of the wrong; it does not, by itself, answer the question "Is it ever permissible to kill?"

  The violinist case, by contrast, is a rights-based argument. It answers the question "Can a person be killed without wrongdoing?" by answering: yes, if doing so is necessary to protect one's own bodily autonomy. It establishes an exception; it does not, by itself, answer the question "What makes killing wrong?"

  These two answers are compatible. The future-like-ours argument can correctly establish that abortion is a serious moral wrong (because it deprives the fetus of a future of value) while the violinist case correctly establishes that this wrong can, in some circumstances, be overridden by the mother's right to bodily autonomy. The mistake in the literature is to think that the violinist case refutes the future-like-ours argument, when in fact it only shows that the future-like-ours argument, by itself, does not settle the question of whether abortion is permissible.

  I'd like your comments on three things: (1) accuracy — are there any mistakes in how I've characterized the two arguments, or in the way I've set up their relationship? (2) the central claim — is it right that the two arguments operate at different levels and are compatible, or am I missing something important? (3) interest — is this a good, interesting point to build a debate around, or is it too subtle or too dry for a novel?

  Please respond in the style of an expert philosopher, and think very carefully before answering. You don't need to provide any citations, bibliography, or reading list — I'll handle the references myself.
