answer: |-
  This is a sophisticated observation that touches on a nuanced corner of social choice theory and judgment aggregation (JA). You are correct to distinguish this from the classic Discursive Dilemma (Doctrinal Paradox). The Discursive Dilemma concerns the logical inconsistency between premise-based and conclusion-based aggregation *within a single collective body*. Your scenario describes a **procedural inconsistency** arising from **hierarchical (or two-tier) aggregation** where the *partitioning of the agenda* alters the outcome despite invariant individual judgments.

  There is no single, universally canonical term for this exact phenomenon in the standard JA literature (e.g., List, Pettit, Mongin, Dietrich), but it is recognized under a few overlapping concepts. Below is a breakdown of how to label, contextualize, and delineate this effect for your thesis.

  ### 1. Proposed Terminology

  Since no single "eponymous" paradox (like Condorcet or Ostrogorski) perfectly captures the *nested committee framing* aspect in JA, you may need to adopt a descriptive term. The most precise conceptual labels are:

  *   **Hierarchical Agenda Sensitivity:** This highlights that the sensitivity lies in how the agenda is structured across levels (sub-committees vs. full board).
  *   **The Decomposition Effect in Judgment Aggregation:** This emphasizes that decomposing the logical space into different sub-groups yields different collective rationalities.
  *   **Structural Framing Dependence:** This distinguishes it from psychological framing; the "frame" here is the institutional architecture (committee assignment).

  If you wish to anchor it to existing paradoxes, it is structurally isomorphic to the **Ostrogorski Paradox**, but transposed from *issue-bundling* (parties) to *premise-bundling* (committees). You might refer to it as a **"Judgment-Aggregation Variant of the Ostrogorski Paradox."**

  ### 2. Conceptual Delineation

  To secure this concept in your thesis, you must clearly demarcate it from the two phenomena you mentioned.

  #### A. Versus the Discursive Dilemma (Doctrinal Paradox)
  *   **The Discursive Dilemma** is a problem of **Logical Consistency**. It arises when a group accepts premises $P$ and $Q$ by majority, but rejects the conclusion $R$ (where $P \land Q \to R$) by majority. The collective set of judgments is logically inconsistent.
  *   **Your Phenomenon** is a problem of **Procedural Equivalence** (or Neutrality). The collective judgments are likely internally consistent at each stage. The problem is that two procedurally distinct but normatively equivalent structures (different committee assignments) yield contradictory outcomes ($C$ vs. $\neg C$).
  *   **Key Distinction:** The Discursive Dilemma asks, "Is the collective rational?" Your phenomenon asks, "Is the collective procedure neutral to agenda partitioning?"

  #### B. Versus Path-Dependence in Sequential Voting
  *   **Path-Dependence** (e.g., McKelvey's Chaos Theorem or standard amendment procedures) relies on **Temporal Sequence**. Outcome $X$ wins if A is voted on before B, but $Y$ wins if B is voted on before A.
  *   **Your Phenomenon** relies on **Structural Partition**. The voting may happen simultaneously within sub-committees. The reversal occurs not because of the *order* of voting, but because of the *grouping* of voters and premises.
  *   **Key Distinction:** Path-dependence is about the *trajectory* of decision-making; your phenomenon is about the *topology* of the decision-making body.

  ### 3. Theoretical Underpinnings & Literature Anchors

  To ground this in the literature, you should reference the following theoretical violations:

  **A. Violation of "Agenda Partition Invariance"**
  In standard social choice, we often assume that the aggregation rule should not be sensitive to how the problem is subdivided if the underlying preferences/judgments remain constant. Your scenario demonstrates that hierarchical majority rule violates this invariance when membership overlaps.
  *   *Reference:* Look for work on **Multi-Level Voting** or **Federalist Voting Systems**. The literature on "electoral college" style systems often discusses how weighting sub-units equally despite population overlap distorts outcomes.

  **B. The Voting Power Distortion (Banzhaf/Sharpley-Shubik)**
  The core mechanism driving your reversal is that **overlapping membership creates hidden voting weights**.
  *   If Member $X$ sits on Committee 1 and Committee 2, and both committees report to the Board, Member $X$'s judgment effectively counts twice toward the final outcome, whereas Member $Y$ (on only one committee) counts once.
  *   When the Chair reassigns premises, they are implicitly reassigning **a priori voting power** without changing the formal rule.
  *   *Reference:* Felsenthal, D. S., & Machover, M. (1998). *The Measurement of Voting Power*. This allows you to frame the issue not just as logical framing, but as a **latent weighted voting system**.

  **C. Connection to the Ostrogorski Paradox**
  The Ostrogorski Paradox occurs when a majority of voters support Party A (which holds positions on Issues 1, 2, 3), but on each individual issue, the majority position aligns with Party B.
  *   *Analogy:* In your case, the "Parties" are the Sub-Committees. The "Issues" are the Premises. Because the sub-committees bundle premises differently, the "majority of committees" diverges from the "majority of members on the premises."
  *   *Reference:* Nurmi, H. (1998). *Voting Paradoxes and How to Deal with Them*. Nurmi explicitly discusses the relationship between Ostrogorski and discursive dilemmas.

  ### 4. Recommendation for the Thesis

  I recommend you formalize this as a **"Hierarchical Framing Effect"** and argue that it represents a violation of a specific normative condition you might term **"Compositional Neutrality."**

  **Suggested Definition for your Chapter:**
  > "Compositional Neutrality requires that the collective outcome of a judgment aggregation procedure remain invariant under re-partitioning of the electorate into sub-groups, provided that individual judgments and the aggregation rule remain constant. The observed reversal demonstrates that nested majority aggregation with overlapping membership violates Compositional Neutrality."

  **Why this matters for Deliberative Institutions:**
  This is a strong critical point for your thesis. It suggests that in deliberative bodies (like faculty boards), **agenda-setting power (the Chair's power to assign committees) is effectively a veto power.** Even without strategic voting, the Chair can engineer a specific outcome merely by shuffling which premises are deliberated by which overlapping sub-groups. This highlights a structural vulnerability in "distributed deliberation" that is distinct from the logical vulnerabilities highlighted by the Discursive Dilemma.

  ### Summary of References to Cite
  1.  **List, C., & Pettit, P. (2002).** *Aggregating Sets of Judgments.* (For the baseline JA framework).
  2.  **Dietrich, F., & Mongin, P. (2010).** *The premise-based approach to judgment aggregation.* (For the distinction between premise/conclusion aggregation).
  3.  **Nurmi, H. (1999).** *Voting Paradoxes and How to Deal with Them.* (Specifically the chapters on Ostrogorski and multiple elections).
  4.  **Felsenthal, D. S. (2010).** *Review of Variants of the Discursive Dilemma.* (To explicitly position your finding against existing variants).

  In conclusion, you have identified a **structural instability in hierarchical judgment aggregation**. While it lacks a single famous name, framing it as a violation of **Compositional Neutrality** driven by **latent voting power distortions** will give it the theoretical weight required for a thesis.
