  2.  **Deconstruct Goodhart's Law Variants:**
      *   *Incentive Goodhart (Classic):* When a measure becomes a target, it ceases to be a good measure because agents optimize for the measure at the expense of the goal (gaming, cheating, effort reallocation).
      *   *Statistical/Regression Goodhart (Campbell's Law overlap, but specifically selection bias):* When you select based on a noisy proxy for a latent trait, the correlation between the proxy and the trait breaks down in the selected subset. This is often due to regression to the mean or omitted variable bias within the selected group. The key here is *no behavior change*.

  3.  **Drafting the Scenario (Hospital/Workplace):**
