prompt: |-
  I've been trying to get a clean handle on goodhart's law and I keep seeing people confate two different things that both get called goodhart's law. Can you build me a scenario where a metric stops tracking the goal purely because of how we select on a noisy proxy -- nobody's gaming it, nobody's inflating the number? Keep it a real workplace or hospital, one paragraph, no AI and no lab. Then do the work: show the exact selection step that produces the effect, say why this is the statistical / regression version and not the incentive version where people change their behavior to hit the number, and tell me what would have to be true for the same setup to be causal Goodhart instead. Which feature is doing the work, and does the effect survive if I make the proxy perfectly accurate?
