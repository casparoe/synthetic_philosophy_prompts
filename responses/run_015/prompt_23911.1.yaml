      *   *Proxy:* Initial vital sign stability score (noisy).
      *   *Action:* Selecting patients for a specialized early-discharge program based *only* on the score.
      *   *Outcome:* The selected group recovers slower than expected based on the score, not because doctors changed behavior, but because the score was noisy and extreme values were likely luck.
      *   *Draft:* In a busy urban hospital, administrators want to identify patients ready for early discharge to free up beds, using a "Stability Index" calculated from hourly nurse entries as a proxy for true physiological recovery. They select the top 10% of scorers for the program, assuming high scores guarantee quick recovery, but soon notice that these selected patients actually stay longer than predicted by their indices. No nurse altered their charting to boost scores, and no doctor changed treatment protocols; the breakdown occurred simply because the Index combines true recovery signals with random transient noise (like temporary caffeine spikes or equipment glitches), meaning the extreme high scorers were statistically likely to be those with the most positive noise rather than the best underlying health.

  4.  **Analyzing the Scenario (The "Work"):**
      *   *Selection Step:* Selecting the top 10% based on the Stability Index.
      *   *Why Statistical?* No agent changed behavior to maximize the index. The breakdown is due to the statistical property of selecting extreme values from a noisy distribution (regression to the mean/selection bias). The correlation holds in the population but breaks in the tail.
      *   *Why not Causal/Incentive?* Nurses didn't fake entries. Doctors didn't neglect care. The metric didn't *cause* a behavior change.
      *   *What would make it Causal Goodhart?* Nurses would need to know the Index determines discharge and start entering fake data (e.g., skipping unstable readings) to boost scores without actual patient improvement.
      *   *Feature doing the work:* Noise in the proxy + Selection on extremes.
      *   *Perfect Proxy?* If the proxy were perfectly accurate (no noise), selecting on it would perfectly select the goal. The effect disappears.

