answer: |-
  In a municipal hospital, administrators aim to reduce wait times by fast-tracking patients deemed "low-risk" using an automated Triage Score based on initial vitals and self-reported pain levels. They authorize immediate discharge for anyone scoring below a certain threshold, assuming the score perfectly correlates with safe recoverability, but soon observe that this fast-tracked group returns to the ER at higher rates than expected. No nurse manipulated the vitals, no patient lied about pain to leave faster, and doctors followed standard protocols; the failure arose because the Triage Score contained random measurement error, so the patients barely clearing the threshold were disproportionately those whose low scores resulted from lucky fluctuations (like a temporary drop in blood pressure) rather than genuine health.

  **The Work:**

  *   **The Exact Selection Step:** The breakdown occurs at the moment administrators filter the population to include *only* those with a Triage Score $S < \text{threshold}$. Because $S = \text{TrueHealth} + \text{Noise}$, selecting for extreme low $S$ inadvertently selects for extreme negative Noise. Within this selected subset, the average Noise is no longer zero; it is biased low, meaning the Score systematically overestimates the TrueHealth of the selected group compared to the general population.
  *   **Statistical vs. Incentive:** This is the statistical (or regression) version because the relationship between the proxy and the goal broke without any agent changing their behavior to optimize the proxy. The nurses did not know the threshold, the patients did not strategize, and the measurement process remained constant. The correlation decayed purely due to conditional probability on a noisy variable, not because the metric caused a behavioral reaction.
  *   **Conditions for Causal Goodhart:** For this to be the causal (incentive) version of Goodhart's Law, the staff would need to know that the Triage Score determines discharge. Nurses might then skip unstable readings or coach patients to underreport pain to artificially lower the score without actually improving patient health. The metric would cease to be a good measure because it became a target that altered the data-generating process.
  *   **Feature Doing the Work:** The active feature is **noise in the proxy combined with extreme selection**. The effect relies on the variance of the error term; if the score were deterministic, selection would work perfectly.
  *   **Perfect Proxy Survival:** No, the effect does not survive if the proxy is perfectly accurate. If $\text{Noise} = 0$, then $S = \text{TrueHealth}$. Selecting on $S$ is identical to selecting on $\text{TrueHealth}$, so the expected outcome for the selected group matches the prediction exactly, and the law does not trigger.
