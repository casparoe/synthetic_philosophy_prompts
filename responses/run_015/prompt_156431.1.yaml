      *   (b) **Origin vs. Tenure:** Base explains origin, not persistence (institutional momentum/aesthetics allow survival beyond material basis).
      *   (c) **Upward Causation:** Superstructure (ideas/law) affects Base (accumulation/discipline). Real causal power to ideas.
      *   (d) **Historicity of Categories:** Moral/psychological categories are produced by mode of production, not timeless nature.
      *   (e) **Literary Autonomy:** Form can exceed/indict its class context. Truth value > class origin.
      *   (f) **Normative Judgment:** Capitalism is unjust/exploitative. This is objective truth, not just class noise.
      *   (g) **Scale/Agency:** History at scale = material conditions. Individuals/ideas matter only in spaces opened by conditions.
      *   (h) **Supersession:** Capitalism ends due to mechanistic crisis/capacity, *not* because it is unjust.

  3.  **Initial Scan for Tensions:**
      *   (d) vs. (f): If moral categories are produced by the mode of production (d), how can we call capitalism "unjust" (f) without appealing to a trans-historical standard? (The Immanent Critique vs. Relativism problem).
      *   (b)/(c) vs. (g): If ideas/forms have independent momentum and causal power (b, c), does that contradict the claim that individuals/ideas only matter where conditions open space (g)? (The "How much autonomy?" problem).
      *   (a) vs. (b)/(c): If the base only sets a menu (a), and forms outlast the base (b), and ideas change the base (c), is the base still doing any *determining* work? (The "Testability" problem).
      *   (e) vs. (d): If categories are produced by the mode (d), how does literary form exceed/indict that mode (e)? Where does the "excess" come from?
      *   (f) vs. (h): If capitalism is unjust (f), why does that play no role in its supersession (h)? (This seems compatible, actually. Marx often separated scientific prediction from moral condemnation).

  4.  **Deep Dive into Specific Tensions (Drafting the Audit):**

      *   **Tension 1: The Normative Standpoint (d) vs. (f).**
          *   *Conflict:* (d) says conscience/justice are products of the mode of production. (f) says capitalism is *actually* unjust, not just relatively so. If justice is internal to a mode, calling capitalism unjust requires a standpoint outside the mode. But (d) suggests no outside exists.
          *   *Severity:* High. This undermines the moral force of the trilogy if (f) collapses into "my class position makes this noise."
          *   *Resolution:* Needs a theory of *immanent critique* or a specific definition of exploitation that isn't purely moralistic (e.g., surplus value extraction as a structural fact vs. "unjust" as a moral label). Or, (d) needs to allow for *emergent* moral categories that can judge the system that produced them.
          *   *Cost:* If (d) gives, you risk idealism/timeless morality. If (f) gives, the trilogy loses its ethical spine.

      *   **Tension 2: Determination & Testability (a)/(b)/(c) vs. (g).**
          *   *Conflict:* (a) makes base determination weak (menu). (b) says forms outlast base. (c) says superstructure changes base. (g) says material conditions select large-scale outcomes. If (b) and (c) are strong, does (g) remain meaningful? If ideas have "real, difference-making causal power" (c), when do they *not* matter? If they only matter where conditions open space (g), how is that different from (c)?
