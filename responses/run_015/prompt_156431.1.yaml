      *   *Best Single Revision:* Modify (d). It is the linchpin. If moral categories are *only* produced by the mode, you have no ground to stand on to call it unjust (f) or for art to indict it (e). You need a concept of *alienation* or *suffering* that is trans-historical even if the *vocabulary* is historical. This saves (e) and (f) without abandoning historicism entirely.

      *   *Wait, let's look at the "Testability" question again.* If (a) is menu, (b) is lag, (c) is feedback. This is essentially "overdetermination" (Althusser) or "reciprocal action" (Engels). Is it testable? Only if the "menu" has hard edges. If the menu is "anything that doesn't immediately collapse the system," it's tautological.
      *   *Okay, I will rank the (a/b/c/g) cluster as the most severe theoretical tension (vacuous determination), and the (d/f/e) cluster as the most severe ethical tension (relativism).*
