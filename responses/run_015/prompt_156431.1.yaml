      *   *Check Tone:* Ensure I'm not lecturing on Marxism. Use the user's vocabulary ("menu," "tenure," "slack").
      *   *Ranking:* Make sure the ranking is clear. The (d)/(f) normative problem is the most dangerous for a novelist claiming moral truth. The (a)/(b)/(c) testability problem is the most dangerous for the historian/sociologist claim.
      *   *Dissolving Tensions:* Explicitly clear (f)/(h).
