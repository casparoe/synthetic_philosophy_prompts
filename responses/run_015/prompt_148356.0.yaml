answer: |-
  Here is the principle your verdicts demand, the cases that force its clauses, the verdict on your borderline case, and the diagnosis of what this principle actually is.

  ### The Principle: The Fairness-Filtered Threshold Test

  **1. The Description Rule:** Formulate the maxim by stripping all indexicals (names, dates, "only I know") and replacing them with the most specific description available to any agent in that structural position. *(Forced by Case 6: Secret Forgery.)*

  **2. The Threshold Condition:** Determine the rate of adoption at which the agent's specific purpose becomes impossible to achieve or the practice supporting it collapses. *(Forced by Case 3: Bus Fare.)*

  **3. The Free-Rider Proviso:** If the Threshold Condition is met, the act is impermissible **only if** the agent secures a benefit or avoids a burden that is *produced or sustained by the compliance of others*, and the agent's participation is a reasonable condition of accessing that benefit. *(Forced by Case 3 vs. Case 7: Bus vs. Voting.)*

  **4. The Harmless Collapse Exception:** If the collapse of the practice under universalisation inflicts no harm on others, violates no prior obligation, and concerns a supererogatory or benign social good, the act is permissible. *(Forced by Case 4: Matching Charity and Case 5: Surprise Lie.)*

  **5. The Motive Neutrality Clause:** Permissibility is determined by the action and its maxim, not by the purity of the agent's underlying affection or desire for reputation. *(Forced by Case 9: Hospital Visit.)*

  ---

  ### How the Principle Handles Your List

  *   **Cases 1 (Mortgage) & 6 (Forgery):** Caught by **Description Rule** + **Free-Rider Proviso**. You cannot universalize lying on applications because the benefit (loan/hidden error) relies on a system of truth-telling maintained by others. You take the benefit without sustaining the condition.
  *   **Case 3 (Bus):** Caught by **Threshold** + **Free-Rider Proviso**. The service exists because others pay. You take the ride (benefit) without the fare (burden), relying on others' payment to sustain the route. Impermissible.
  *   **Case 7 (Voting):** **Threshold** is met (democracy collapses if no one votes), but **Free-Rider Proviso** is *not* met. Your vote does not consume a resource funded by other voters. You do not "take" a benefit produced by their compliance. Therefore, permissible (though perhaps a civic failing).
  *   **Cases 4 (Matching) & 5 (Surprise):** **Threshold** is met (matches disappear, surprises vanish), but **Harmless Collapse Exception** applies. No one is harmed; no obligation is violated. Charity is not a debt owed to the matcher; surprise is a benevolent gift. Permissible.
  *   **Case 2 (Fake Promise):** Caught by **Free-Rider Proviso**. You rely on the practice of promise-keeping (sustained by others) to manipulate expectations, without intending to uphold your end. Impermissible (mildly, as the harm is limited to one colleague).
  *   **Case 8 (Famine):** This principle struggles here. It captures the "Impermissible" verdict via a broad reading of **Free-Rider** (living comfortably relies on a stable world order others sustain?), but you noted this is "of another shape." This principle is primarily about *conception/collapse*, not *will/beneficence*.
  *   **Case 9 (Hospital):** **Motive Neutrality** ensures the test falls silent on mixed motives. Permissible.

  ### What the Principle Cannot Keep

  It cannot fully capture the specific moral texture of **Case 8 (Famine Relief)** without an additional limb regarding "Contradiction in Will." The current principle is structural (does the practice survive? is it fair?). Case 8 requires a substantive claim about what a rational being must will regarding their own neediness. If you insist Case 8 is impermissible *solely* via universalisation, you must add a clause: *"Impermissible if the agent wills a world in which they would be denied aid in similar need."* However, you admitted this argument felt weaker to you. The principle above respects that hesitation by leaving Case 8 as an outlier.

  ### The Borderline Case: The Home-Office Deduction

  **The Case:** Claiming a deduction at the vague edge of entitlement, knowing universal claiming would break the code.

  **The Verdict:** **Impermissible.**

  **Why:**
  1.  **Description:** "Claiming deductions where the rule is vague and the agent is at the edge of entitlement."
  2.  **Threshold:** If everyone at the edge claims it, the code breaks (revenue loss/rewrite).
  3.  **Free-Rider:** This is the decisive clause. The tax system is a cooperative scheme. Benefits (public goods, stability) are produced by the compliance of others. By claiming the deduction, you reduce your burden while relying on others to pay the share you shed. Unlike Voting (Case 7), this is transactional: you pay less, the state provides the same. Unlike Matching Charity (Case 4), this is not supererogatory; it is a legal obligation with a boundary.
  4.  **Nuance:** The "vagueness" tempts you to use the Description Rule to narrow the maxim to "Claiming when *I* interpret it as valid." But the Rule strips this. You are at the *edge*. The principle demands you ask: "Does my interpretation rely on others being more conservative than me to keep the system solvent?" If yes, it is free-riding.

  ### Two New Cases of Divergence

  Here are two cases where your original "Collapse Test" and this "Fairness-Filtered Test" give different answers.

  **Case A: The Secret Vegetarian**
  *   **Maxim:** I will not eat meat to reduce animal suffering, while others continue to do so.
  *   **Collapse Test:** If everyone did this, the meat industry would collapse. (This is not a contradiction, but a goal achievement). However, if the maxim is "I will abstain *only while* others eat (to enjoy social meals)," universalization kills the social meal.
  *   **Fairness-Filtered Test:** Permissible. You are not free-riding. You are bearing a burden (dietary restriction) without requiring others to do so. The "collapse" of the meat industry is not a harm to a cooperative scheme you are exploiting.
  *   **Divergence:** A strict Collapse Test might flag the "social meal" aspect as self-defeating. The Fairness Test clears it immediately.

  **Case B: The Queue Jumper**
  *   **Maxim:** I will cut to the front of the line because I am in a hurry.
  *   **Collapse Test:** If everyone did this, the line ceases to exist. Self-defeating. Impermissible.
  *   **Fairness-Filtered Test:** Impermissible. But for a different reason: You secure a benefit (time) produced by others' compliance (waiting).
  *   **Divergence:** Consider a variation: **The Empty Line.** I cut the line when no one is behind me.
      *   **Collapse Test:** Universalizing "cutting when no one is behind" is stable. Permissible.
      *   **Fairness-Filtered Test:** Permissible. No one's compliance is being exploited.
      *   **Now consider:** **The Urgent Cut.** I cut when people *are* behind me, but I have a minor urgency.
      *   **Collapse Test:** Impermissible (Line dissolves).
      *   **Fairness-Filtered Test:** Impermissible (Free-riding on their wait).
      *   **The Divergence Point:** **The Polite Request.** I ask to cut, and they agree.
          *   **Collapse Test:** If everyone asked and agreed, lines would be chaotic/slow. Potentially Impermissible.
          *   **Fairness-Filtered Test:** Permissible. The burden is consented to by those whose compliance sustains the line.
      *   *Prediction:* The Fairness Test permits consensual queue-jumping; the Collapse Test may condemn it if the *rate* of asking becomes too high.

  ### Diagnosis: What Survives?

  What survives is **a Fairness Principle wearing the Formula of Universal Law's clothes.**

  It uses the machinery of universalisation (thresholds, generalization) not to test logical consistency, but to detect **unfair advantage**. The test asks: "Can I make an exception for myself without exploiting the compliance of others?"

  **The Single Case Doing the Work:**
  **Case 3 (The Bus Fare).**

  This is the pivot. In a pure Kantian "Contradiction in Conception" test, Case 3 is notoriously difficult (one free rider doesn't logically destroy the bus system). You had to introduce a **Threshold** to catch it. But once you have a Threshold, Case 7 (Voting) threatens to condemn itself (universal abstention destroys democracy). To save Case 7 while keeping Case 3 condemned, you were forced to introduce the **Free-Rider Proviso** (benefit produced by others' compliance).

  That Proviso is not Kantian logical consistency; it is **Scanlonian contractualism** or **Rawlsian fairness**. It shifts the question from "Can this be a law of nature?" to "Is this a fair term of cooperation?" Case 3 forces the move from Logic to Fairness. Case 7 confirms that Fairness, not mere System Survival, is the metric.
