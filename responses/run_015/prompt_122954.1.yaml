answer: |-
  Here is the procedure you requested, designed for a copy editor without linguistics training, followed by the audit of your three sentences.

  ### The 10-Second Conditional Audit (For Copy Editors)

  **Purpose:** To distinguish between grammatical errors, accidental ambiguities, and intentional stylistic choices in conditional sentences.
  **Time:** ~10 seconds per sentence.
  **Rule:** If a sentence triggers a **FLAG**, do not change it. Query the author using the provided note.

  **Step 1: Isolate the "If" Verb**
  Look only at the verb in the clause starting with *If* (or *Even if*).
  *   **Type A:** *Had* + Past Participle (e.g., *If he had known*)
  *   **Type B:** Simple Past (e.g., *If he knew / If she was*)
  *   **Type C:** Present/Future (e.g., *If he dies / If he will*)

  **Step 2: Check the "Story Truth"**
  Look at the manuscript context *up to this page*. Is the condition in the "If" clause:
  *   **False:** We know it did not happen.
  *   **True:** We know it did happen.
  *   **Unknown:** The characters/narrator do not know yet.

  **Step 3: The Match Test**
  *   **If Type A (*Had* + PP):** The Story Truth **must** be **False**.
      *   *Match:* Proceed.
      *   *Mismatch (Truth is Unknown or True):* **FLAG.** (Note: "Grammar says this didn't happen; text says we don't know.")
  *   **If Type B (Simple Past):** The Story Truth can be **Unknown** or **True**.
      *   *Match:* Proceed.
      *   *Mismatch (Truth is False):* **FLAG.** (Note: "Grammar suggests this might be true; text says it isn't.")
  *   **If "Even If":** Ignore Step 3. This structure implies the result is the same regardless of truth. **Proceed.**

  **Step 4: The FIS Check (Judgment Call)**
  *If the sentence passed Step 3 but uses Type B (Simple Past):*
  *   **Ask:** Is this the narrator stating a fact or a character fearing a possibility?
  *   **Action:** If it is unclear *and* clarity matters for plot logic, **FLAG.** (Note: "Is this character suspicion or narrative fact?")
  *   **If ambiguity seems intentional:** **PASS.** (Do not query.)

  **Step 5: Nested Conditionals**
  *   Apply Steps 1–3 to the *outermost* "If" clause only. Ignore internal "Ifs" unless the outer clause is resolved.

  ***

  ### Audit Results: Your Three Sentences

  Here is the procedure applied to your specific examples.

  #### 1. "If he had known about the letter, he would have taken the morning train."
  *   **Step 1 (Verb):** *Had known* (Type A: Past Perfect).
  *   **Step 2 (Story Truth):** Context implies he did *not* take the morning train. Therefore, the condition (knowing about the letter) is **False**.
  *   **Step 3 (Match):** Type A requires False. The context supports False. **MATCH.**
  *   **Step 4 (FIS Check):** Not required (Grammar is specific).
  *   **Commitment:** This sentence commits the fictional world to the fact that **he did not know** and **he did not take the train**.
  *   **Mind:** This can be the narrator's objective truth or the character's regretful realization. Both agree on the negative.
  *   **Procedure Limit:** The procedure cannot distinguish *who* knows he didn't know (narrator vs. character), only that the text treats it as a non-event.

  #### 2. "If she was lying about the fire, then everything he had built on her account was already ash."
  *   **Step 1 (Verb):** *Was lying* (Type B: Simple Past).
  *   **Step 2 (Story Truth):** Context implies this is **Unknown** (a suspicion).
  *   **Step 3 (Match):** Type B allows Unknown. **MATCH.**
  *   **Step 4 (FIS Check):** **JUDGMENT CALL.**
      *   *Query Note:* "Is this the character's fear (subjective) or the narrator setting up a fact (objective)?"
      *   *Reasoning:* Simple past in *if*-clauses can sometimes drift toward factual ("If she was lying [and we know she was]..."). In FIS, this blur is usually desirable.
  *   **Commitment:** This leaves the truth value **open**. It commits the world only to the *consequence*: that her lying would destroy his world.
  *   **Mind:** Strongly suggests the character's anxiety, but allows the narrator to withhold confirmation.
  *   **Procedure Limit:** This is the zone where your editor will feel itchiest. The procedure tells them to pass it *unless* plot logic requires a definitive truth value here.

  #### 3. "If he died in the fire, he died believing she had left him."
  *   **Step 1 (Verb):** *Died* (Type B: Simple Past).
  *   **Step 2 (Story Truth):** Context implies **Unknown** (body not found) OR **Accepted Fact** (fatalism).
  *   **Step 3 (Match):** Type B allows Unknown or True. **MATCH.**
  *   **Step 4 (FIS Check):** **PASS.**
      *   *Reasoning:* This is a "factual conditional" (sometimes called a biscuit conditional). The grammar specifically allows the antecedent to be uncertain while focusing on the consequent.
  *   **Commitment:** This commits the world to the *manner* of his death (believing she left), while leaving the *fact* of his death ambiguous or secondary.
  *   **Mind:** This is pure Free Indirect Style. It blends the character's hope/fear with a narrator's fatalistic tone.
  *   **Procedure Limit:** The procedure identifies this as safe, but it cannot guarantee the reader won't misinterpret it as confirmation of death.

  ***

  ### The Hard Verdict

  You asked me to tell you straight if a sentence has to change, even if you are attached to it.

  **Sentence 1 is the risk.**

  *   **The Constraint:** The structure *"If he had known... he would have"* is the Third Conditional. In standard English, it is exclusively counterfactual. It grammatically asserts that the event did **not** happen.
  *   **The Conflict:** If your Free Indirect Style aims to keep it *uncertain* whether he knew about the letter, this sentence breaks that intent. It resolves the mystery prematurely.
  *   **The Fix:** If you need ambiguity, you must shift to Simple Past: *"If he knew about the letter, he would take the morning train"* (future consequence) or *"If he knew about the letter, he would have taken the morning train"* (mixed conditional, implies uncertainty about the past).
  *   **Verdict:** If you want the reader to wonder if he knew, **Sentence 1 must change.** The grammar is too rigid to sustain the ambiguity you prize in FIS.

  **Sentence 3 is the safest.**

  *   **The Strength:** *"If he died... he died"* is structurally designed to handle the exact ambiguity you describe. It allows the character to dwell on the meaning of the death without confirming the death itself.
  *   **Verdict:** If you are attached to Sentence 3, **keep it.** It is grammatically sound for your purposes and creates the specific epistemic fog you are looking for. Your copy editor may query it, but the procedure above instructs them to pass it as an authorial choice.

  **Summary for your Copy Editor:**
  Give them the **10-Second Audit** above. Tell them explicitly: *"Sentence 1 is a hard fact. Sentence 2 is a suspicion. Sentence 3 is a fatalistic ambiguity. Do not 'correct' Sentence 3 to match Sentence 1."* This saves you the twelve arguments on the next pass.
