answer: |-
  This is a classic reflective equilibrium problem. You are oscillating between **instrumentalist criteria** (does it predict?) and **realist/explanatory criteria** (does the mechanism map to reality?). Your gut is correctly signaling that "unrealism" is not a monolithic category. Friedman's F-twist fails because it treats all false assumptions as functionally equivalent, whereas your cases show they play different structural roles.

  Here is a principle that respects your intuitions on 1, 2, 4, 5, and 6, adjudicates 3, and clarifies 7.

  ### The Principle: Causal Negligibility vs. Causal Substitution

  The distinction isn't just about "boundary conditions" vs. "dynamics." It is about **where the predictive power comes from.**

  1.  **Causal Negligibility (Permissible):** The assumption removes a factor that *exists* but makes a negligible difference to the outcome *in the target domain*. The model works *despite* the falsehood because the falsehood is small.
      *   *Cases:* 1 (Vacuum), 2 (Grid resolution).
      *   *Test:* If you add the realism back in (air resistance, finer grid), the core prediction remains stable, merely corrected.
  2.  **Causal Substitution (Impermissible for Explanation):** The assumption replaces a real causal mechanism with a false one that *mimics* the output. The model works *because of* the falsehood (or coincidentally alongside it).
      *   *Cases:* 3 (Rational Expectations), 6 (Constant Mutation).
      *   *Test:* If you intervene on the system based on the model's mechanism, you fail (Lucas Critique).
  3.  **Phenomenological Parameterization (Context-Dependent):** The assumption admits ignorance by fitting a term without claiming ontological status.
      *   *Case:* 7 (Dark Energy).

  ---

  ### Adjudicating Your Cases

  #### Case 3 (Rational Expectations) vs. Case 6 (Bacterial Mutation)
  You asked: *If I have to choose between saving Case 3 and saving Case 6, which goes?*

  **You must drop the positive intuition on Case 3 (or severely nuance it) and keep the negative verdict on Case 6.**

  Here is why:
  *   **Case 6 is Empirically Falsified in the Target Domain:** You stated it "gives bad clinical protocols." A model that fails in its intended application is simply a bad model. The assumption (constant mutation) is not just unrealistic; it is **dominantly causal** in the clinical setting (stress *does* drive mutation). Ignoring a dominant causal driver is fatal.
  *   **Case 3 is Empirically Successful but Explanatorily Hollow:** It predicts GDP (by your stipulation). However, your "cheating" intuition is correct because it relies on **Causal Substitution**. Agents do not have infinite compute. If the model predicts well, it is likely due to *aggregation effects* (errors cancel out) or *arbitrage* (only the rational marginal agents matter), not because the assumption is true.
      *   *The Fix:* Case 3 is "Okay" for **prediction** (instrumentalism) but "Not Okay" for **explanation/policy** (realism). If you treat it as a causal explanation of *why* GDP grew, it is cheating. If you treat it as a black-box forecaster, it is permissible.

  **Verdict:** Save Case 6's "Not Okay." It is the stronger verdict because it relies on empirical failure, not just philosophical discomfort. Case 3's "Cheating" verdict should be refined to "Instrumentally valid, explanatorily void."

  #### Case 7 (Dark Energy / Lambda)
  *Is this Galileo-style placeholder or Case 6 ignorance-hiding?*

  This is a **Phenomenological Parameter**. It is distinct from both.
  *   Unlike Case 6, cosmologists *know* Lambda is a placeholder. They are not claiming "There is a constant field." They are claiming "The expansion behaves *as if* there is a constant."
  *   Unlike Case 1, it is not a "negligible factor." It is the dominant factor.

  **Principle Application:** This is permissible **only if** the model is framed as an *Effective Field Theory* (valid up to a certain scale/precision) rather than a fundamental ontology.
  *   **Verdict:** It is "Okay" similar to Case 2 (Climate Grid). It is a resolution limit. We are fitting the macro-behavior without claiming to know the micro-mechanism. It becomes "Not Okay" (like Case 6) only if physicists stop looking for the physical field and claim Lambda *is* the explanation. As long as it is treated as a parameterization of ignorance, it is scientifically honest.

  #### Case 4 (SIR Models)
  *You suspect you might be wrong about this being okay.*

  You are right to be suspicious, but the verdict "Okay locally" is defensible under the **Law of Large Numbers**.
  *   Random mixing is false for individuals.
  *   However, in high-density urban populations, the *aggregate* behavior converges on the random mixing statistic.
  *   **Distinction:** This is a **Statistical Idealization**, not a Causal one. It doesn't claim people *are* gas molecules; it claims the *distribution* of contacts behaves like gas.
  *   **When it fails:** As you noted, rural spread. Here, the network structure (causal topology) dominates the statistical average.
  *   **Refined Verdict:** It is "Okay" only when the N is high enough to wash out the network structure. It is not a universal law. Your intuition holds.

  ---

  ### Making "Prediction vs. Explanation" Precise

  You worried that distinguishing prediction from explanation is just "relabeling." It is, unless you ground it in **Interventionism (Woodward).**

  *   **Prediction:** Requires stable correlation. $X$ tracks $Y$.
  *   **Explanation:** Requires **Invariance under Intervention**. If I wiggle $X$, does $Y$ change *in the way the model says*?

  **Apply this to Case 3 (Rational Expectations):**
  *   *Prediction:* The model tracks GDP.
  *   *Explanation:* If the Central Bank changes policy, the model assumes agents instantly re-optimize. In reality, agents have sticky expectations. If you intervene based on the model (e.g., "surprise inflation will boost output"), you fail because the mechanism (instant re-optimization) is false.
  *   **Conclusion:** Case 3 fails the Interventionist test. It predicts *ceteris paribus*, but breaks under *mutatis mutandis*.

  **Apply this to Case 1 (Galileo):**
  *   *Prediction:* Objects fall at $9.8 m/s^2$.
  *   *Explanation:* If I remove air (intervention), the prediction gets *better*. The assumption isolates the causal force (gravity).
  *   **Conclusion:** Case 1 passes the Interventionist test. The idealization isolates the cause; it doesn't fake it.

  ### Summary of Recommendations

  1.  **Adopt the "Causal Work" Principle:** Unrealistic assumptions are permissible if they **isolate** a dominant cause (Galileo) or **average out** noise (Climate/SIR). They are impermissible if they **substitute** a false mechanism for a real one (Rational Expectations) or **ignore** a dominant cause (Bacteria).
  2.  **Drop the Ambivalence on Case 6:** It is "Not Okay." It fails empirically in the target domain.
  3.  **Split the Verdict on Case 3:** It is "Okay" for forecasting (instrumentalism), "Not Okay" for policy/explanation (interventionism). Your "cheating" feeling is the realist part of your brain correctly identifying a lack of invariance.
  4.  **Case 7 is "Okay" as Effective Theory:** Treat Lambda like the Climate Grid (Case 2). It's a resolution limit, not a claim about fundamental ontology.
  5.  **Case 4 is "Okay" as Statistical Aggregation:** It relies on $N$, not causal similarity.

  **The One to Drop:** If forced to choose between the verdicts on 3 and 6, **drop the idea that Case 3 is "Not Okay" *simpliciter*.** Acknowledge it is predictively robust but explanatorily bankrupt. Case 6 is simply broken. The "cheating" feeling in Case 3 is valid, but it targets *explanation*, not *prediction*. Friedman was right about prediction, wrong about explanation. You are right to feel the tension.

  **Final thought:** Your intuition on Case 4 is actually the most sophisticated. SIR models are "false" ontologically but "true" statistically. That is the sweet spot of modern modeling. Don't lose that nuance.
