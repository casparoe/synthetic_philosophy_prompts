  After a long argument with a friend about the St. Petersburg paradox—specifically whether the fault lies with unbounded utility or with our intuitions about infinite stakes—I want to push past the exhausted monetary version. Give a precise, non-monetary conceptual example structured analogously to the paradox but applied to an epistemic decision: an agent must choose whether to pursue an investigation whose potential knowledge-payoff has no upper bound, yielding infinite expected epistemic value. Make the scenario original rather than a standard textbook variant, keep it within familiar notions of belief, evidence, and rational choice without invoking obscure formalisms or named theories that require citation, and show exactly where the usual resolutions—capping utility, risk aversion, or dismissing the gamble—become conceptually strained when the “reward” is understanding rather than wealth.
