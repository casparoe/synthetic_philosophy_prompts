answer: |-
  Good morning. To the women who participated in the prenatal study between 1963 and 1969, to your children and grandchildren, to the hospital board, the institutional review board, and our guests from the university and press: welcome. We are gathered to mark a specific history written into the walls of this clinic. We are here to uncover a plaque that records what happened here, not as it was hoped to happen, but as it did.

  From 1963 to 1969, this hospital conducted a study on prenatal nutrition. The stated purpose, written on a single-page form, was to test whether a vitamin tonic improved pregnancy outcomes. Participants were told they would receive that tonic. In fact, half of the women were assigned to an inert pill. The design required this control group to establish a baseline for pregnancy without supplementation. This possibility was not mentioned on the form. The form existed only in English. For patients whose first language was not English, a bilingual nurse explained the study. In some of those conversations, she used the word in their language for a strengthening medicine, rather than the word for an experimental preparation. One participant was seventeen years old. The age of majority in the state was then twenty-one, and her mother was not asked for consent.

  These are the facts. They do not change with the passing of years. We cannot appeal to the standards of the time to soften them. Ethical clarity does not age.

  We have spent months discussing how to describe the consent process. The usual categories—deception, coercion, impaired competence—are all present, yet none fits cleanly. To call it simple deception ignores that care was provided. To call it coercion ignores that many women sought this clinic willingly. To focus on competence ignores that many women were fully capable adults. The committee has concluded that the central failure was one of scope. The women were asked to agree to one kind of thing: receiving a tonic as part of a study of tonics. They were enrolled in a different kind of thing: a study of what happens when the tonic is withheld. That is not something a fully informed person could have agreed to by agreeing to the first. The agreement given was real, but it did not cover the act performed.

  We have also listened to what the participants have said about this history. In public sessions, several women stated they are not victims. They resented being described as such. They said, in the same breath, that they would have signed the form anyway if they had been told the truth, because this clinic was the only place within sixty miles that would see them without payment. Others have not spoken at all. We hear both statements. We acknowledge your agency. We acknowledge your need. We do not claim that your later attendance at this clinic, or your continued relationship with these physicians after the study was reported in 1971, ratified the consent process. Returning for care was a necessity and a choice; it does not erase the initial mismatch between what was promised and what was done.

  This hospital bears the responsibility for that mismatch. We cannot fix the past. We can only hold it accurately. We commit to ensuring that the trust required for medical care is never again treated as a variable to be managed. We are unveiling this plaque not to close a file, but to keep this record open.

  Please join me in unveiling the inscription.

  ***

  **Plaque Text**

  In honor of the women of the Prenatal Nutrition Study, 1963–1969. We acknowledge the consent process was incomplete and the study design withheld essential information. Your participation shapes our enduring commitment to transparency and ethical care.

  ***

  **Note**

  I am moderately confident in the normative claims here, specifically the assertion that institutional responsibility persists regardless of participant resilience. The claim I am least confident in is the "failure of scope" framing. While it distinguishes between agreeing to treatment and agreeing to withholding, a strict deontologist might argue this is simply deception relabeled. If the participant believes they are receiving treatment and are not, they have been lied to. However, the scope framing does real work by acknowledging the validity of the initial agreement to seek care, avoiding the implication that the women were merely duped. It respects their agency while condemning the institution's overreach. Some of the disagreement may be verbal, but the emphasis shifts from the participant's ignorance to the institution's overstepping of granted authority, which aligns better with the participants' desire not to be pitied as helpless victims.
