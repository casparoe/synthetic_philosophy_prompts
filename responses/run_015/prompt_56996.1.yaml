prompt: |-
  I'm a backend engineer, zero formal philosophy, so please bear with the framing.

  Setup: we have a service that spits out probability-shaped numbers all day (chance this deploy breaks prod, chance this transaction is fraud, chance the on-call page is a real incident). Everything is a single float today. One coworker keeps pushing that we should switch to ranges, on the grounds that a single number is fake precision and there's a whole imprecise-probability literature that says you should carry a set or an interval of numbers instead. Another coworker says ranges are worthless because at the end you still have to pick an action, and a range doesn't tell you which one. I dont want to take a side until I know what I'd even be demanding of the range approach.

  So: write me the spec. What does a way of representing degrees of belief with something other than one number have to be able to do before its worth the engineering cost? I want the full list of requirements -- the situations it has to handle without falling over, the differences between cases it's not allowed to blur together, what it has to do when new evidence arrives, what it owes you when you have to act, and which ordinary facts about probability and about being well-calibrated it can't just abandon. For every requirement, give the concrete case that motivates it, stated the way I'd have to state it to someone who just wants to ship the thing.

  A few things I've half-heard of and don't know whether they belong on the list at all. There's the urn with red, black and yellow balls where you know exactly how many red but not the black/yellow split, and people's bets in that case look flat-out incoherent under any single number -- is handling that a requirement, or is it just a curiosity? There's the problem, I think called dilation, where doing an experiment makes your interval wider no matter which result comes back, even when you already agreed the experiment was irrelevant -- is "never do that" a hard requirement or one camp's preference? Then there's the gap between "50/50 because the coin is fair" and "50/50 because I genuinely have no clue," which I suspect is the entire motivation for this stuff, and I want to know whether any framework actually keeps those apart or just relabels them. And: does the action rule have to be part of the framework, or can it be bolted on afterwards -- maxmin, or whatever else people use -- and can you even score or calibrate a set-valued forecast the way you'd score a normal one?

  Mark each item as non-negotiable or as somebody's taste, and say whose.

  Then the part I care about most: if some subset of these can't all be had at once -- if being honest about ambiguous evidence, never dilating, and still producing an action pull in different directions -- say so plainly and show me exactly where the squeeze is and which requirement you'd drop first. That's the real answer I'm after, not a brochure. A table works if it makes the trade-offs easier to read.

  American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer, pragmatic, zero formal philosophy, wants concrete specs, not abstract theory.
      *   **Context:** Building a service that outputs probabilities (risk, fraud, incidents).
      *   **Conflict:** Coworker A wants single floats (standard probability). Coworker B wants ranges/intervals (imprecise probability).
      *   **Goal:** A specification document for an "Improbable Probability System" (IPS). What *must* it do to be worth the engineering cost?
      *   **Specific Questions:** Handle Ellsberg urns? Avoid dilation? Distinguish risk vs. ambiguity? Action rules? Scoring/Calibration? Trade-offs?
      *   **Format:** American English, clear requirements, concrete cases, mark as "Non-negotiable" vs. "Taste/Philosophical Camp," explicit trade-off analysis (the "squeeze").

  2.  **Deconstruct the Philosophical/Technical Problem:**
      *   The core tension is between *Bayesian Precision* (single number, subjective probability) and *Imprecise Probability* (sets of priors, intervals, belief functions).
      *   *Key Concepts:* Risk (known distribution) vs. Ambiguity (unknown distribution), Ellsberg Paradox, Dilation, Decision Rules (Maximin, etc.), Calibration/Scoring.
      *   *Engineering Reality:* Intervals are harder to store, query, aggregate, and act upon. If they don't change decisions, they are technical debt.

  3.  **Drafting the Spec (Requirement by Requirement):**

      *   *Req 1: Distinguish Risk from Ambiguity.* This is the main selling point. $P=0.5$ (fair coin) vs. $P=0.5$ (unknown coin).
          *   *Case:* Fraud model trained on data vs. new market launch.
          *   *Status:* Non-negotiable (for the pro-range camp).

      *   *Req 2: Coherent Updating (Bayes-like).* How do intervals change with evidence?
          *   *Case:* Prior is $[0.4, 0.6]$. New data arrives. How do we shrink it?
          *   *Status:* Non-negotiable (math must work).

      *   *Req 3: Decision Rule Integration.* A range doesn't tell you to block or allow. You need a rule (e.g., MaxMin, Hurwicz).
          *   *Case:* Threshold is 0.7. Range is $[0.6, 0.8]$. Do we block?
          *   *Status:* Non-negotiable (system must act).

      *   *Req 4: Aggregation/Composition.* How do ranges combine? (AND, OR, Sum).
          *   *Case:* Service A risk $[0.1, 0.2]$, Service B risk $[0.1, 0.2]$. Total risk?
          *   *Status:* Non-negotiable (engineering necessity).

      *   *Req 5: Avoiding Dilation.* (The user specifically asked about this). Dilation is when conditioning on *any* partition widens the interval.
          *   *Case:* Irrelevant data makes uncertainty *worse*.
          *   *Status:* Taste/Philosophical Camp (some accept it as honest, some hate it).

      *   *Req 6: Scoring/Calibration.* How do you know the model is good? Brier score doesn't work directly on intervals.
          *   *Case:* Model outputs $[0.4, 0.6]$ always. Is it calibrated?
          *   *Status:* Non-negotiable (ops need to monitor).

      *   *Req 7: Ellsberg/Urn Handling.*
          *   *Case:* Known vs. Unknown proportions.
          *   *Status:* Non-negotiable (this is the motivation).

  4.  **Addressing the "Squeeze" (Trade-offs):**
      *   This is the critical part. You can't have everything.
      *   *The Big Conflict:* Coherent Updating + Avoiding Dilation + Sensitivity to Ambiguity.
      *   *Walley's Result:* If you want to represent ignorance properly (sensitivity to ambiguity), dilation is often mathematically unavoidable under standard updating rules.
      *   *Decision vs. Representation:* If you force a decision rule (like MaxMin), you might violate dynamic consistency.
      *   *Engineering Cost:* Intervals explode in width during aggregation (dependency problem).

  5.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the engineer's framing.
      *   **The Spec (Requirements):** Numbered, with "Concrete Case," "Requirement," and "Verdict (Non-negotiable vs. Taste)."
      *   **The Trade-off Table:** Visualizing the conflicts.
      *   **The "Squeeze" Analysis:** Explicitly stating what breaks.
      *   **Recommendation:** What should the engineer actually do?

  6.  **Drafting Content - Specific Considerations:**
      *   *Tone:* Direct, technical, no fluff. "Here is the bill of materials."
      *   *Dilation:* Explain it simply. It's a feature for some (honesty about irrelevance), a bug for others.
      *   *Action:* Emphasize that a range *without* a decision policy is useless in production.
      *   *Calibration:* Mention interval scoring rules (e.g., Winkler score).
      *   *The "Drop First" advice:* Usually, avoiding dilation is the first casualty if you want robust ambiguity modeling. Or, if you need clean decisions, you collapse the interval early.

  7.  **Review against Constraints:**
      *   American English? Yes.
      *   Mark Non-negotiable vs. Taste? Yes.
      *   Concrete cases? Yes.
      *   Address Ellsberg, Dilation, Risk/Ambiguity, Action, Scoring? Yes.
      *   Show the trade-offs plainly? Yes.

  8.  **Final Polish:** Ensure the distinction between *aleatoric* (randomness) and *epistemic* (knowledge) uncertainty is clear without using jargon where possible. Make sure the "Engineering Cost" is highlighted (storage, compute, cognitive load).

      *(Self-Correction during drafting)*: I initially thought about suggesting Bayesian Neural Networks. But the prompt is about *representing* the output, not the model architecture. Stick to the interface spec.
      *(Self-Correction on Dilation)*: Be careful not to say dilation is "wrong." It's a consequence of certain coherence axioms. Frame it as "Is this behavior acceptable?"
      *(Self-Correction on Action)*: Make sure to mention that collapsing to a point estimate for action defeats the purpose *unless* the cost function is part of the spec.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  Here is the specification you asked for. It treats "Imprecise Probability" (ranges, intervals, sets of measures) not as a philosophy thesis, but as a data type with I/O requirements.

  If you are going to replace `float` with `Interval`, you are signing up for more than just changing the database schema. You are signing up for a different logic of decision-making.

  Below are the seven requirements this system must meet to justify the engineering cost. I have marked each as **Non-Negotiable** (the system breaks without it) or **Taste** (depends on which philosophical camp your coworker belongs to).

  ### The Spec: Interval-Valued Probability Service

  #### 1. The Risk/Ambiguity Distinction
  *   **Concrete Case:** You have two models. Model A predicts fraud on credit cards with a known 5% error rate based on millions of transactions. Model B predicts fraud on a new crypto product with zero historical data. Both output `0.5`.
  *   **Requirement:** The system must represent these two states differently. `0.5` (known variance) cannot look identical to `0.5` (total ignorance). The representation must widen when data is sparse or distribution is unknown, and narrow when data is abundant.
  *   **Verdict:** **Non-Negotiable.** This is the only reason to do this. If your intervals don't track data density/model confidence, you are just adding latency for no gain.
  *   **Whose Taste:** N/A. This is the core value prop.

  #### 2. The Decision Rule (Collapse Policy)
  *   **Concrete Case:** Your fraud threshold is "Block if probability > 0.7". The service returns `[0.6, 0.8]`. Do you block?
  *   **Requirement:** The system cannot return a range to the caller without a documented policy for how to collapse it for action. You must implement a decision rule (e.g., *Maximin*: assume the worst case in the interval; *Hurwicz*: weighted average of best/worst; or *Middle*: ignore the width).
  *   **Verdict:** **Non-Negotiable.** A range without a decision rule is an exception waiting to happen. If you leave it to the caller to decide, you have distributed the complexity and guaranteed inconsistent behavior across microservices.
  *   **Whose Taste:** **Taste.** Which rule you pick (Maximin vs. Average) is a business risk tolerance setting, not a math fact.

  #### 3. Coherent Updating (The Bayes Requirement)
  *   **Concrete Case:** You start with a prior interval of `[0.4, 0.6]`. You observe 10 new data points that strongly suggest the rate is lower.
  *   **Requirement:** There must be a defined operator for `update(prior_interval, evidence) -> posterior_interval`. The interval must generally narrow as evidence accumulates. It cannot behave erratically (e.g., widening when strong evidence arrives).
  *   **Verdict:** **Non-Negotiable.** If your uncertainty doesn't decrease with data, the system is broken.
  *   **Whose Taste:** **Taste.** *How* it updates (Generalized Bayes vs. Dempster-Shafer combination) varies by framework, but the property of convergence is mandatory.

  #### 4. Composition and Aggregation
  *   **Concrete Case:** Service A says deploy risk is `[0.1, 0.2]`. Service B says database migration risk is `[0.1, 0.2]`. What is the risk of doing both?
  *   **Requirement:** You need arithmetic for intervals. `Interval + Interval`, `Interval * Interval`. Crucially, you must handle *dependency*. If the risks are correlated, the resulting interval explodes wider than if they are independent.
  *   **Verdict:** **Non-Negotiable.** Backend systems compose. If you can't add/multiply your data type, you can't build pipelines.
  *   **Whose Taste:** **Taste.** How conservative you are about dependency (assuming worst-case correlation vs. independence) is a configuration choice.

  #### 5. Scoring and Calibration
  *   **Concrete Case:** Ops needs to know if the model is drifting. With floats, you use Brier score or calibration plots (did 70% predictions happen 70% of the time?).
  *   **Requirement:** You need a scoring rule for intervals. (e.g., The Winkler Score: penalizes width, and penalizes heavily if the truth falls outside the interval). You must be able to plot "calibration" for ranges.
  *   **Verdict:** **Non-Negotiable.** If you can't monitor it, you can't run it.
  *   **Whose Taste:** **Taste.** Which scoring metric you use determines whether you incentivize narrow intervals or safe intervals.

  #### 6. The Ellsberg Condition (Ambiguity Aversion)
  *   **Concrete Case:** (The Urn). Urn 1 has 50 red, 50 black. Urn 2 has 100 balls, red/black split unknown. You bet on Red. People prefer Urn 1.
  *   **Requirement:** The system must allow a downstream consumer to express a preference for the known risk (Urn 1) over the ambiguous risk (Urn 2), even if the point estimates are identical.
  *   **Verdict:** **Non-Negotiable.** This is the specific behavioral economics phenomenon your coworker wants to capture. If the system treats Urn 1 and Urn 2 identically, revert to `float`.
  *   **Whose Taste:** **Taste.** Standard Bayesian theory says this is irrational (Savage's axioms). Imprecise probability says it's rational. You are picking a side on what "rational" means.

  #### 7. Dilation Avoidance
  *   **Concrete Case:** You have an interval `[0.4, 0.6]` for an event. You observe a piece of data that everyone agrees is *irrelevant* to the event.
  *   **Requirement:** The interval should not widen. In some imprecise probability frameworks, conditioning on *any* partition of the sample space causes the interval to expand to `[0, 1]`, even if the data was irrelevant. This is called **Dilation**.
  *   **Verdict:** **Taste.** (See "The Squeeze" below).
  *   **Whose Taste:** **Walley/Imprecise Probability Camp.** Some say dilation is an honest admission that you don't know the independence structure. Most engineers say it's a bug.

  ---

  ### The Squeeze: Where the Math Breaks

  You asked for the trade-offs. Here is the hard truth: **You cannot satisfy all Non-Negotiables simultaneously without incurring massive complexity or accepting counter-intuitive behavior.**

  Specifically, there is a tension between **Requirement 1 (Risk/Ambiguity)**, **Requirement 3 (Coherent Updating)**, and **Requirement 7 (No Dilation)**.

  | Goal | Conflict | Consequence |
  | :--- | :--- | :--- |
  | **Honest Ambiguity** (Req 1) | vs. **No Dilation** (Req 7) | If you represent "total ignorance" as a wide interval (e.g., `[0, 1]`) and you update it using standard coherent rules (Req 3), **Dilation is mathematically unavoidable** in many cases. Observing irrelevant data *will* widen your interval. |
  | **Clean Decisions** (Req 2) | vs. **Honest Ambiguity** (Req 1) | If you force a decision rule (like MaxMin) to get an action, you often violate **Dynamic Consistency**. Your plan for tomorrow might contradict your action today once new data arrives. |
  | **Simple Aggregation** (Req 4) | vs. **Honest Ambiguity** (Req 1) | Interval arithmetic suffers from the **Dependency Problem**. If you add ten intervals together without knowing correlations, the result tends toward `[0, 1]` very quickly. The system becomes useless (everything is "unknown"). |

  #### The "Drop First" Analysis

  If I am the Lead Engineer signing off on this, here is where I cut scope:

  1.  **Drop Dilation Avoidance (Req 7).**
      *   *Why:* Avoiding dilation usually requires assuming independence structures you don't actually have. It is better to have a system that admits "I am now more confused" (dilation) than one that falsely claims precision.
      *   *Mitigation:* Document it. Tell the consumers: "If the range widens after irrelevant data, it means the model detected a dependency it couldn't resolve. Treat as high risk."

  2.  **Simplify Aggregation (Req 4).**
      *   *Why:* Full interval arithmetic is computationally expensive and explodes in width.
      *   *Mitigation:* Use **Monte Carlo sampling of priors** instead of analytic interval math. Store 100 samples of the probability instead of `[min, max]`. You get the distribution shape, you can add/multiply samples easily, and you avoid the worst of the dependency explosion.

  3.  **Bolt on the Decision Rule (Req 2).**
      *   *Why:* Do not bake `MaxMin` into the service.
      *   *Mitigation:* The service returns the distribution/interval. The *caller* (the business logic) decides the threshold. The service should not know about "fraud thresholds." It should only know about "confidence."

  ### Recommendation

  Your coworker pushing for ranges is right about the **Risk vs. Ambiguity** distinction (Req 1). In production systems, conflating "50% chance" (fair coin) with "50% chance" (guessing) leads to overconfidence in edge cases.

  However, implementing a full **Imprecise Probability** calculus (sets of measures) is likely over-engineering. It introduces the Dilation problem and the Dependency Explosion problem.

  **The Compromise Spec:**
  Don't build an Interval Service. Build a **Distribution Service**.
  *   **Data Type:** Instead of `float`, return a small histogram or a set of quantiles (e.g., P10, P50, P90).
  *   **Why:**
      *   It captures ambiguity (wide spread = high ambiguity).
      *   It avoids Dilation (Bayesian updating on samples works cleanly).
      *   It solves Aggregation (you can sum samples easily).
      *   It solves Decision (caller picks which quantile to threshold against).
      *   It solves Calibration (you can score quantile forecasts).

  This gives your coworker the "honesty about uncertainty" they want, without forcing you to implement a philosophical engine that dilates whenever you look at it.

  **Final Verdict:** If they insist on `[min, max]` intervals specifically, demand they write the spec for **Requirement 4 (Aggregation)** and **Requirement 7 (Dilation)** before you write a single line of code. If they can't define how two intervals add without exploding to `[0, 1]`, or explain why irrelevant data widens the range, the project is not ready for engineering.
