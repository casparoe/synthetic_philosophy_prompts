answer: |-
  ### Conceptual Dependencies Brainstorm

  Before structuring the session, we must isolate the logical prerequisites. Students cannot grasp eliminativism about propositional attitudes if they conflate it with general physicalism or instrumentalism. The dependency chain is as follows:

  1.  **Structural Definition of the Target:** Students must first understand that "belief" and "desire" in this context are not just *any* internal causes, but specifically states with **propositional content** (truth-evaluable, compositional, discrete). If they define belief merely as "disposition to act," eliminativism becomes incoherent.
  2.  **The Explanatory Gap:** They must see that the *success* of folk-psychological prediction does not prove the *existence* of the posited structures. (Success $\neq$ Structural Isomorphism).
  3.  **The Alternative Mechanism:** They need a concrete model of how adaptive, context-sensitive behavior can be generated *without* manipulating sentence-like vehicles. This requires a grasp of continuous dynamics or predictive error minimization where "content" is implicit in the system's topology, not explicit in a vehicle.
  4.  **The Incompatibility Claim:** Finally, they must see that the alternative mechanism isn't just a *reduction* of belief (belief = brain state), but shows that the *category* of belief (as defined in step 1) fails to map onto the mechanism. The map does not match the territory; therefore, the map's categories are false.

  ---

  ### 1. Sequence of Introduction

  Do not begin with "Eliminative Materialism." Begin with the structure of the thing to be eliminated.

  1.  **The Structural Commitment (0–15 mins):** Define "Propositional Attitude" strictly. It is not just "thinking." It is a relation to a content-bearing vehicle that has **compositionality** (parts combine to make new meanings) and **truth conditions** (it can be false). Establish that standard Folk Psychology assumes the mind works like a language (Language of Thought).
  2.  **The Explanatory Success vs. Ontological Commitment (15–30 mins):** Acknowledge why we use belief/desire talk (it predicts behavior). Challenge the inference: "Because belief-talk predicts well, the brain must contain belief-states." Use the analogy of Ptolemaic astronomy (predictively successful, ontologically wrong about epicycles).
  3.  **The Alternative Mechanism: Predictive Error Minimization (30–60 mins):** Introduce the anchoring example (detailed below). Demonstrate how the system achieves the *same* adaptive outcomes as a belief-desire agent but uses a fundamentally different architecture (gradient descent on sensory error vs. logical inference over propositions).
  4.  **The Elimination Claim (60–75 mins):** Argue that because the actual mechanism lacks compositional structure and discrete truth-evaluable tokens, the term "belief" does not *refer* to anything in that mechanism. It is not that beliefs are "just neurons"; it is that the *functional role* defined by Folk Psychology is not instantiated.
  5.  **Implications for Rationality (75–90 mins):** Briefly address how reasoning looks from this view (not manipulation of propositions, but stabilization of predictive models) to prevent the "zombie" objection.

  ---

  ### 2. The Anchoring Example

  **The Case:** **Visuomotor Reaching under a Predictive Processing Framework.**

  **Why this example:** It is a human action where attributing beliefs/desires feels undeniable ("She *believes* the cup is on the table," "She *wants* to drink"), yet the millisecond-by-millisecond mechanics preclude propositional processing.

  **What the Example Must Exhibit:**
  *   **Behavioral Adaptivity:** The hand adjusts trajectory in real-time if the cup is moved or if the table is slippery.
  *   **Context-Sensitive Updating:** The grip aperture changes based on perceived weight and fragility without a separate "calculation" phase.
  *   **Goal-Directedness:** The action terminates successfully when the goal state is achieved.

  **What the Example Must Lack (The Eliminative Lever):**
  *   **Compositional Syntax:** There is no internal state that combines "Cup" + "On" + "Table" to form a new thought. The "location" of the cup is not a stored datum but a parameter in a continuous control loop.
  *   **Discrete Representational Tokens:** There is no specific "vehicle" that carries the content "The cup is there." The information is distributed across the sensorimotor weights and the predicted sensory flow.
  *   **Truth-Evaluable Content:** The system does not represent "The cup is at X" as a proposition that can be true or false. It minimizes the *error signal* between predicted sensory input and actual input. If the prediction fails, it doesn't "update a belief"; it changes the action to make the prediction come true (active inference).

  **Instructional Move:** Describe the reaching arm not as executing a command derived from a belief, but as a system minimizing "surprise" (prediction error). The "desire" to grasp is just the prior expectation that "hand is grasping." The "belief" about location is the policy that minimizes the error between expected and actual visual feedback.

  ---

  ### 3. Map of Predictable Misconceptions

  **Misconception 1: "Eliminativism denies that we act intentionally."**
  *   *When it forms:* During the Definition phase (Step 1). Students hear "beliefs don't exist" and think "we are robots."
  *   *Interruption Point:* Immediately after defining Propositional Attitudes.
  *   *Correction:* "We are not denying the *behavior* (reaching, speaking, planning). We are denying the *architectural description* of that behavior. You can drive a car without believing the internal combustion engine works via 'phlogiston expulsion.' Similarly, you can act without manipulating propositional tokens."

  **Misconception 2: "This is just Reductionism (Beliefs = Neural States)."**
  *   *When it forms:* During the Alternative Mechanism phase (Step 3). The CogSci student may try to save the concept by mapping beliefs to activation patterns.
  *   *Interruption Point:* When comparing the Structure of Folk Psychology vs. Predictive Processing.
  *   *Correction:* "Reduction requires that the higher-level category maps cleanly onto the lower-level mechanism (e.g., Water = H2O). If Folk Psychology requires *compositional syntax* and the brain uses *distributed continuous dynamics*, there is nothing to reduce. The category 'belief' fails to carve nature at its joints. It is not reduced; it is dissolved."

  **Misconception 3: "If beliefs aren't real, rationality is impossible."**
  *   *When it forms:* During the Elimination Claim (Step 4).
  *   *Interruption Point:* Before moving to Implications.
  *   *Correction:* "Rationality is not the manipulation of logical sentences. It is the efficient minimization of long-term prediction error. A system can be 'rational' (adaptive, coherent) without possessing 'propositions.' Do not confuse the *logic of justification* (how we talk) with the *dynamics of implementation* (how we work)."

  **Misconception 4: "This is just Instrumentalism (Beliefs are useful fictions)."**
  *   *When it forms:* At the very end, as a retreat position.
  *   *Interruption Point:* During the Check-for-Understanding.
  *   *Correction:* "Instrumentalism says 'Beliefs aren't real, but talk as if they are.' Eliminativism says 'Beliefs aren't real, so talking as if they are introduces systematic error.' If the structure is fundamentally wrong, using the concept will eventually block scientific progress, just like 'phlogiston' did."

  ---

  ### 4. Check-for-Understanding Exercise

  **The "Structural Mismatch" Diagnostic**

  **Prompt:**
  "Consider a sophisticated AI navigation system that successfully navigates a dynamic maze.
  *   **System A** uses a symbolic map: It stores the proposition 'Wall at (X,Y)' and infers 'Path Clear.'
  *   **System B** uses a neural network: It has no map. It outputs motor commands based on raw pixel input to minimize a 'collision prediction error.'

  Both systems successfully exit the maze.
  1.  To which system can we *literally* attribute the belief 'The wall is at (X,Y)'?
  2.  If System B is a model of the human brain, does the sentence 'I believe the wall is at (X,Y)' describe an internal state of the human?
  3.  If your answer to (2) is 'No,' explain what work the word 'believe' is doing when I say it. Is it describing a mechanism, or is it a shorthand for a behavioral disposition?"

  **Success Criteria:**
  *   **Fail:** Student says System B has beliefs "in a different way" (Reductionism) or says "Beliefs don't exist so nothing matters" (Nihilism).
  *   **Pass:** Student identifies that System A has the *structural properties* (compositionality, discrete tokens) required for literal belief attribution, while System B does not. They conclude that if humans are like System B, "belief" is a shorthand for behavioral disposition/predictive policy, not a name for an internal vehicle with truth conditions. They recognize the eliminative claim is about the *absence of the vehicle*, not the absence of the success.

  ---

  ### 5. Explicit Exclusions

  To maintain the conceptual dependency chain, the following standard materials must be excluded:

  1.  **The Phlogiston Analogy:**
      *   *Why Exclude:* While Churchland uses it, it invites the "Instrumentalist" retreat ("It's useful, so keep it"). It focuses on *theory replacement* rather than *structural mismatch*. Students will focus on whether Folk Psychology is "useful" rather than whether it is *structurally accurate*. We want them to see the architectural incompatibility, not just the historical precedent.
  2.  **Debates about Phenomenal Consciousness (Qualia):**
      *   *Why Exclude:* This is the "Hard Problem." Introducing it distracts from the "Easy Problem" of propositional attitudes. Students will conflate "I don't have beliefs" with "I don't have experiences." We must keep the session focused on *cognitive architecture* and *content*, not *feeling*.
  3.  **Canonical Quotations (Churchland, Dennett, Fodor):**
      *   *Why Exclude:* Quotations encourage appeal to authority. Students will parse the quote rather than the argument. We need them to grapple with the *mechanism* (Predictive Processing) vs. the *category* (Propositional Attitude).
  4.  **General Physicalism/Materialism Defense:**
      *   *Why Exclude:* The group already accepts the brain is physical. Spending time arguing against dualism wastes the 90 minutes. The target is not Dualism; the target is *Representational Theory of Mind*.
  5.  **Normativity of Content Debates:**
      *   *Why Exclude:* Deep dives into how content is fixed (teleosemantics, etc.) will bog down the session. We need to establish that *whatever* content is, the *propositional structure* is missing. Don't get stuck on how meaning arises; focus on how it is *formatted*.

  **Final Pedagogical Note:**
  The success of this session hinges on your refusal to let students slide into "Beliefs are just brain states." You must constantly press them on the *format* of the state. If they say "The brain state *is* the belief," ask: "Does that brain state have parts that correspond to 'The' and 'Cat' and 'Mat'? Does it have truth conditions?" If they say "No," press: "Then why call it a belief?" This friction is where the understanding happens.
