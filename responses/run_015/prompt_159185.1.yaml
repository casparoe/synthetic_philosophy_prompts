      *   **Constraint 2:** Rate each of the eight moves (4 per person) using specific categories (*clearly mistaken*, *more wrong than right but pointing at something real*, *defensible but overstated or under-described*, *basically right*).
      *   **Constraint 3:** Justify ratings precisely, naming specific steps/inferences.
      *   **Constraint 4:** Provide an overall verdict (who is right about what, compatibility, missed points).
