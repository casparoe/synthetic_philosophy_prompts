answer: |-
  **PRINCIPAL INVESTMENT STRATEGIES**

  The Oikos Fund seeks to generate returns through natural wealth-getting (*oikonomia*), distinguished from the unnatural art of wealth accumulation (*chrematistikē*) which aims at no limit. The Fund invests primarily in assets possessing intrinsic utility, such as agriculture, herding, and fishing, wherein the end goal is sufficiency for the household or polity rather than unlimited exchange value. Money is utilized strictly as a conventional measure to facilitate proportional reciprocity among parties, not as an end in itself. Accordingly, the Fund prohibits investments wherein money breeds money (*tokos*), as this contravenes the natural purpose of currency. To compensate for capital deployment, the Fund charges custody and storage fees on lent principal. These fees are calculated as a percentage of the principal amount accrued over the duration of the safeguarding period, reflecting the burden of holding value while it is in the borrower's possession. Additionally, the Adviser may employ a "Thales Clause," securing options on essential inputs to demonstrate foresight. There can be no assurance that the Fund will exercise such options, even if profitable.

  **PRINCIPAL RISKS OF INVESTING**

  1.  **Regulatory Reclassification of Fees.** While custody and storage fees are structured as compensation for safeguarding principal rather than payment for the use of money, regulatory authorities may determine that fees scaling with the magnitude of principal and the length of time constitute interest. Such a determination could result in penalties, forced restitution, or the dissolution of the Fund's investment structure.

  2.  **Thales Clause Non-Exercise.** The Adviser reserves the right to abstain from exercising profitable positions to demonstrate that philosophy is not useless. Investors could lose money where the Fund intentionally declines to realize gains from cornered markets. There is no guarantee that the demonstration of philosophical virtue will correlate with positive total return.

  3.  **Asset Classification Risk.** The Fund classifies modern assets according to their functional similarity to natural wealth-getting. For example, semiconductor fabrication facilities may be classified as pastoral industries due to their clean-room environments and precise breeding of circuits. If regulators or markets reject these classifications, the Fund may be forced to divest holdings at unfavorable prices.

  4.  **Use-versus-Exchange Liquidity Risk.** Holdings must be certified by the Adviser as intended for proper use rather than resale. A shoe held for wearing cannot be sold for profit without violating investment policy. This restriction severely limits liquidity and may prevent the Fund from exiting positions during market downturns, as exchange for money is secondary to utility.

  5.  **Conventional Nature of Currency.** Money holds by convention rather than by nature. Should the polis lose faith in the conventional measure, the Fund's holdings may retain intrinsic utility while their monetary valuation collapses. There is no assurance that proportional reciprocity will remain intact during currency debasement.

  6.  **Proportional Reciprocity Failure.** The Fund relies on counterparties adhering to ethical standards of return proportional to benefit received. If counterparties engage in usury or unequal exchange, the Fund's mechanism for maintaining social cohesion through finance may fail, resulting in counterparty default and loss of principal.

  7.  **Limitation on Unlimited Growth.** Because the Fund targets sufficiency rather than unlimited accumulation, performance may lag during bull markets driven by speculative excess. Investors seeking maximum capital appreciation may find the Fund's adherence to natural limits adversely affects long-term compounding compared to unconstrained indices.
