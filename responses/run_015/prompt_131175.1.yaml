answer: |-
  Begin with the shared commitment that Nāgārjuna is not a nihilist who denies all existence. The first branch asks whether the tetralemma describes how reality is structured or merely how our language and concepts fail to capture it. If the student answers that it targets reality itself, proceed to the second question regarding negation: when a corner is denied, does this exclude the predicate to imply something else, or merely refuse to endorse it without commitment? If they say it implies something else, they land in a cell that is effectively empty; nobody lives here because claiming emptiness is a positive feature of the world contradicts the opening commitment against nihilism by reifying emptiness itself, turning it into a substance. If they say it refuses endorsement, ask whether the statement 'all things are empty' is itself empty of intrinsic nature. If they say no, they occupy a cell that is incoherent, for it exempts the central claim from the very analysis it applies to everything else. If they say yes, ask whether Nāgārjuna asserts a thesis via independent inference. If yes, this leads to the reading where emptiness is established by inference, committing you to maintaining two truths as distinct ontological tiers to avoid self-refutation. If no, this leads to the reading where he only draws consequences from opponents, committing you to the awkward position that communication occurs without asserted content.

  If the student answers that the tetralemma targets language or conception, ask whether contradictions can be true. If yes, they reach the dialetheist leaf, which commits you to accepting true contradictions in the world. If no, ask whether logical values include gaps or gluts such as true, false, both, or neither. If yes, you reach the many-valued logic leaf, committing you to abandoning classical logic for first-degree entailment. If no, ask whether emptiness applies to itself without regress worry. If they worry about regress, they might take the conceptual-only route, committing you to idealism where only concepts fail to cut reality. If they do not worry, ask whether the device is there to dissolve the question rather than answer it. If yes, this leads to the therapeutic reading, committing you to making philosophy pointless once the cure is effected. If no, ask whether Nāgārjuna asserts a thesis. If he asserts a thesis via inference, you reach a variant of the inference reading, committing you to conventional validity of logic. If he asserts no thesis, you reach the no-assertion reading, committing you to the view that nothing is shown by the refutation.

  You will notice that the no-assertion reading and the therapeutic reading come out looking identical on most of these questions even though they refuse assertion for quite different reasons. One thinks something is still shown by the refutation, the other thinks nothing is. To pry them apart you would need an extra question about the soteriological goal: is the end state knowledge or silence? Without this, the tree cannot honestly separate them. There are other empty cells in the space worth marking. The combination where the tetralemma is about the world, negation leaves something in place, and emptiness is what is left is empty for a reason; it collapses into essentialism. Similarly, a cell where emptiness is not empty but the thesis is denied is merely unattractive because it is unstable. There are also unexplored cells, such as a reading where the tetralemma targets conception but negation is exclusionary, which remains largely unnamed in the literature.

  In total, this structure generates about eight to ten leaves. These include the reading on which he only ever draws consequences out of the opponent's own commitments and never asserts anything in his own voice; the reading on which emptiness can be established by a properly formed inference of his own and is a thesis in that sense; a dialetheist reading on which at least one opposed pair of corners is really both true; a reading on which the four corners are semantic values in a logic with gaps and gluts rather than four things somebody is asserting; a therapeutic reading on which the whole device is there to dissolve the question rather than answer it; and a reading on which emptiness is only a claim about our concepts and their failure to cut anywhere. The remaining leaves are unnamed combinations of these logical commitments, such as a conceptual target with classical logic but no thesis, or a reality target with non-endorsement and no regress worry. Each leaf carries a price, whether it is abandoning classical logic, accepting idealism, or rendering philosophical discourse impossible.

  At the very end, you should recognise that the single question doing nearly all the sorting work is the second one regarding how the negation works, specifically whether denying a corner cancels the predicate and leaves something in its place, or merely declines to endorse it without committing to anything in its place. This distinction determines whether the system is constructive or deconstructive. The question that is nearly useless because almost everybody answers it the same way is the first one about whether the tetralemma is about the world or speech, since most sophisticated readings converge on the view that these are not ultimately distinct in Madhyamaka. You might rather cut that branch to simplify the handout, as it rarely separates the serious contenders from one another. The real friction lies in whether the negation permits any positive commitment to remain, which dictates every subsequent choice about thesis, regress, and logic. Ensure your students see this price before they pick a leaf, for the logical space is far more restrictive than the doxographical labels suggest.
