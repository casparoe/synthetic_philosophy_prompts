  **Editor's Note on Slant:** Three of your proposed claims needed adjustment to be signable. "Aren't known" and "can't be rationally assessed" are ontological claims Priya cannot accept; I have rephrased them as functional descriptions ("treated differently," "resist assessment"). "Unintelligible" is also too strong for Priya; I have used "practically inert" in the table. The rest stands.

  ***

  **Joint Statement on *On Certainty*: Phenomenology and Disagreement**

  **1. Agreed Phenomenology**
  1.  There exists a distinguishable class of propositions with a distinctive functional role: they are not normally doubted, not normally supported by explicit evidence, and doubting them tends to wreck the evidential relations of other propositions rather than merely adding a false belief.
  2.  The regress of reasons does in practice bottom out somewhere; inquiry cannot proceed without resting on something held fast.
  3.  Propositions migrate in and out of this status over time ("hinge-drift"); e.g., "the earth is immensely old" moved from contested hypothesis to assumption.
  4.  This migration is awkward for both views: it challenges the view that hinges are logical necessities (since they change) and the view that they are merely entrenched empirical claims (since they resist evidence).
  5.  Moore's hand-raising gesture is baffling rather than a proof; it fails to convince because it misidentifies the grammatical role of the proposition.

  **2. Disagreement Table**

  | Point at Issue | Priya's Claim (Empirical Entrenchment) | My Claim (Framework Commitments) | Crux | Concrete Case / Evidence | Predictions (Recorded Pre-Fact) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nature of Class** | Defined by degree of confidence/entrenchment (kind of proposition). | Defined by logical/grammatical role in inquiry (role of proposition). | Is the distinction quantitative or qualitative? | **Arithmetic:** Does "2+2=4" behave like "I have hands"? | **P:** Same mechanism, higher confidence. **Me:** Different grammar entirely; doubt is nonsense, not error. |
  | **Status of Doubt** | Doubt is intelligible but fantastically implausible/irrational. | Doubt is unintelligible or practically inert within the system. | Is the barrier psychological or grammatical? | **Interview Study:** Justifications for "I have hands" vs. "Mars." | **P:** Subjects cite evidence/testimony or high probability. **Me:** Subjects cite category errors ("question doesn't make sense"). |
  | **Revision Mechanism** | Rational belief-revision via accumulated counter-evidence. | Shift in practice amounting to something like conversion. | Is the change continuous or discontinuous? | **Valley Case:** River reroutes; community reports unintelligible. | **P:** Gradual update as observation reports stabilize. **Me:** Period of unintelligibility followed by pragmatic adoption, not inference. |
  | **Installation** | Installed by testimony and inference to best explanation. | Installed by training and ostensive definition. | How do hinges get installed? | **Child Development:** How "object permanence" is acquired. | **P:** Learned via inductive generalization. **Me:** Learned via conditioning/reacting, not hypothesis. |
  | **Logic/Arithmetic** | Belong to the same phenomenon (highly entrenched). | Belong to a different phenomenon (rules of representation). | Are logic and empirical hinges continuous? | **Paraconsistent Logic:** Can we train people to doubt excluded middle? | **P:** Yes, with enough training/utility. **Me:** No, that changes the game entirely, not the belief. |

  **3. Verbal Disputes, Substantive Residue, and Falsification**
  We acknowledge significant verbal disagreement over "know," "belief," and "evidence." Priya uses "know" to include entitlements grounded in reliability; I reserve "know" for propositions susceptible to verification. This is verbal. However, the resistance of hinges to evidence is substantive. If hinges behave like high-confidence beliefs under pressure, I am wrong. If hinges show categorical immunity to evidence that cannot be explained by Bayesian updating or cost-benefit analysis, Priya is wrong. Specifically: **My Falsification:** If subjects in the Interview Study consistently cite empirical evidence for hinges without circularity, or if the Valley community revises their view via standard inference rather than practical necessity. **Priya's Falsification:** If subjects report that doubt "makes no sense" rather than "is unlikely," or if the Valley case shows a period of genuine unintelligibility rather than mere confusion. We agree that if the Interview Study shows a mix, the burden shifts to explaining the variance without begging the question.
