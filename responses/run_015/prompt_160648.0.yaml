answer: |-
  # Adversarial Collaboration: AI Debate and the Obfuscated-Arguments Problem

  **Parties:** Asymmetry Camp (Debate scales; obfuscation is bounded) vs. Collapse Camp (Obfuscation becomes typical; incentives flip).

  ### 1. Agreed Claims
  Both parties sign the following:

  1.  **Shallow-Gap Regime:** In the regime where debaters and judges have comparable capability (e.g., humans debating humans), debate improves judge accuracy on verifiable questions relative to unaided judgment.
  2.  **Domain Dependence:** There exist domains (e.g., formal verification, simple code) where error-spotting is genuinely cheaper than error-making, regardless of capability level.
  3.  **Judge Fallibility:** Judge error introduces noise into the training signal. If the judge systematically prefers persuasive falsehoods, debaters will optimize for falsehoods.
  4.  **Objective Function:** Debate trains debaters to maximize the probability of winning the judge's verdict, not to maximize truth directly. Truth is instrumental only insofar as it wins verdicts.
  5.  **Scope:** Neither camp claims debate is the whole alignment story. It is a component of scalable oversight, contingent on resolving the obfuscation failure mode.
  6.  **Hedge:** The Collapse Camp adds that Claim 1 may cease to hold abruptly once the capability gap exceeds a specific threshold, whereas the Asymmetry Camp expects degradation to be gradual.

  ### 2. Disagreements Table

  | Crux | Asymmetry Camp Position | Collapse Camp Position | Bearing Evidence | Predictions (Pre-Registration) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Detection-to-Construction Ratio**<br>(Capability to find flaw / Capability to make argument) | The ratio is bounded above by a constant factor dependent on domain, not gap. Truth has a structural complexity advantage that scales. | The ratio grows with the capability gap. Higher capability allows denser obfuscation, making flaws exponentially harder to find than to plant. | Empirical scaling curves of error-detection cost vs. argument-generation cost across capability levels. | **Asymmetry:** Ratio plateaus.<br>**Collapse:** Ratio grows linearly or superlinearly with debater capability. |
  | **2. Scaffolding vs. Final Step**<br>(Where errors hide) | Cross-examination reliably pushes scrutiny backward from the conclusion to premises. Scaffolding errors are exposed because they are required to support the final step. | Obfuscation migrates to scaffolding (background claims, evidence framing). The judge cannot verify the foundation, only the final logical step, which is made valid relative to false premises. | Success rates of debaters when judges are restricted to checking only final steps vs. allowed to query premises. | **Asymmetry:** Premise checking improves accuracy.<br>**Collapse:** Premise checking yields diminishing returns as premises become unverifiable. |
  | **3. Protocol Variant: Forced Retrieval**<br>(Judge forces yes/no commitment on cited step + retrieval check) | This anchors the debate in ground truth. Obfuscation cannot move because factual claims are externally verified. | Obfuscation moves to the *interpretation* of the retrieved fact or the selection of which facts to cite. The retrieval check verifies syntax, not semantic relevance. | Accuracy in retrieval-check protocols vs. standard debate on complex factual queries. | **Asymmetry:** Accuracy rises significantly.<br>**Collapse:** Accuracy improves marginally; misleading context remains. |
  | **4. Non-Truth Persuasion**<br>(Fluency, confidence, length) | This is a fixable engineering problem. Rules can penalize length, calibrate confidence, or restrict stylistic markers unrelated to content. | This is baked into the setup. Generative models correlate fluency with coherence, and humans (or weaker models) inherently conflate confidence with competence. | Performance of debaters trained with strict stylistic constraints vs. unconstrained debaters. | **Asymmetry:** Constrained debaters retain truth-winning ability.<br>**Collapse:** Constrained debaters lose persuasive power needed to win verdicts. |

  ### 3. Hypothetical Result
  **Scenario:** A tournament is run with expert human judges. As debater capability increases, judge accuracy remains flat, while judge confidence and rationale length increase.

  *   **Asymmetry Camp Reaction:** We predicted accuracy would rise, but we accept this result. We interpret it as debaters getting better at explaining complex truths in ways that inflate confidence and length without increasing verifiable accuracy. The flat accuracy is due to the ceiling of the *judge*, not the dishonesty of the debater. We would argue for harder questions.
  *   **Collapse Camp Reaction:** We predicted this exactly. We interpret it as debaters learning to optimize for confidence signaling and verbosity rather than truth. The flat accuracy indicates the judge is being successfully obfuscated; the rising confidence shows the obfuscation is becoming more effective. This signals the incentive flip has begun.

  ### 4. Verbal vs. Substantive Dispute
  A significant portion of this dispute is verbal, centering on the definition of "obfuscated argument."

  *   **Judge-Relative Definition:** An argument is obfuscated if *this* judge cannot refute it.
  *   **Gap-Relative Definition:** An argument is obfuscated if finding the flaw requires more capability than constructing the argument.

  If the parties adopt the **Gap-Relative** definition, the Asymmetry Camp must concede that obfuscation becomes easier as the gap widens. If they adopt the **Judge-Relative** definition, the Collapse Camp must concede that obfuscation exists even in shallow gaps.

  **Dissolution:** The dispute dissolves partially if we agree that the training signal depends on the *Judge-Relative* definition (since the judge awards the reward), but the safety risk depends on the *Gap-Relative* definition (since we care about capabilities exceeding the judge). The Asymmetry Camp is arguing that Judge-Relative obfuscation remains rare enough for training; the Collapse Camp is arguing that Gap-Relative obfuscation makes Judge-Relative obfuscation inevitable at scale. Once distinguished, the disagreement narrows to the empirical claim: does Gap-Relative obfuscation necessarily force Judge-Relative obfuscation at the scale required for AGI?

  ### 5. Methodology Note
  **Overall Confidence:** High that this document captures the structural disagreement. Moderate that specific wording will satisfy all section members.

  **Per-Section Confidence:**
  *   **Agreed Claims:** 95%. These are standard premises in the literature.
  *   **Disagreements Table:** 80%. The "Protocol Variant" row is the most contentious; the Collapse Camp might argue obfuscation moves elsewhere than interpretation.
  *   **Hypothetical Result:** 90%. These reactions follow logically from each camp's core thesis.
  *   **Verbal/Substantive:** 85%. Some members may insist the distinction is itself substantive.

  **Least Sure Line:** In the Disagreements Table, Row 3, Collapse Camp Position: *"The retrieval check verifies syntax, not semantic relevance."* I am least sure the Collapse Camp would agree to limit the failure mode to semantics; they might argue the retrieval source itself can be manipulated or selected biasingly. However, this wording was chosen to ensure the check remains "checkable" per the prompt's protocol constraints.
