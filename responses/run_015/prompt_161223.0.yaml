answer: |-
  This is an exceptionally clear breakdown. You have intuitively reconstructed the actual structure of the debate better than many introductory linguistics textbooks do. The confusion in your reading group is standard: "Poverty of the Stimulus" (POS) is used as a shorthand for a whole ecosystem of claims, ranging from mathematical trivialities to controversial empirical assertions.

  Here is the menu you asked for, ordered from logically trivial to empirically explosive, followed by the specific answers to your questions about negative evidence, circularity, and ML.

  ### The Menu of Claims (Ordered by Strength)

  **Level 1: The Logical Problem (Underdetermination)**
  *   **Claim:** Any finite set of data is compatible with an infinite number of possible rules/generalizations.
  *   **Status:** Mathematically trivial. (Related to Gold's Theorem).
  *   **Your Bullet:** This is your **Bullet 2**.
  *   **Note:** This is true for *everything*, not just language. If I show you the sequence 2, 4, 6, you can guess "add 2" or "add 2 until 100 then add 5." The data alone never forces one rule.

  **Level 2: The Empirical Setup (The "Poverty" itself)**
  *   **Claim:** The data available to the learner lacks specific types of information (specifically, reliable negative evidence and explicit structural markers) that would be required to rule out the wrong generalizations from Level 1.
  *   **Status:** Mostly true, but nuanced.
  *   **Your Bullets:** This combines your **Bullet 1** (no negative evidence) and **Bullet 5** (more data is just more of the same).
  *   **Note:** This claims the *quality* of the signal is missing, not just the quantity.

  **Level 3: The Convergence & Specificity Claim**
  *   **Claim:** Despite the poverty in Level 2, learners reliably converge on specific, complex grammatical rules (like structure dependence) that are not obvious from the surface data, and they avoid errors that a general-purpose statistical learner *should* make.
  *   **Status:** Empirically contested. (This is where the linguistics grad students and ML people actually fight).
  *   **Your Bullets:** This is your **Bullet 3** (knowing things data didn't tell them) and **Bullet 4** (convergence on the "wrong" simple rule).
  *   **Note:** This is the *evidence* used to support the conclusion, not the argument itself.

  **Level 4: The Innateness/Impossibility Conclusion**
  *   **Claim:** Therefore, the learner must possess prior knowledge (innate constraints/UG) that restricts the hypothesis space, making the learning problem solvable. Consequently, a system without these specific priors (like a generic neural net) cannot learn the target grammar regardless of data volume.
  *   **Status:** Wildly strong. Highly controversial in ML.
  *   **Your Bullets:** This is the conclusion your friend wants to draw from **Bullet 5**.
  *   **Note:** This moves from "learning is hard" to "learning is impossible without specific innate machinery."

  ---

  ### Mapping Your Bullets

  *   **Bullet 2 (Underdetermination)** is the foundation. Without this, there is no argument. However, on its own, it proves nothing about language specifically.
  *   **Bullet 1 (No Negative Evidence)** and **Bullet 5 (Quantity vs. Quality)** are really the same point viewed differently. Bullet 1 says "you don't get error signals." Bullet 5 says "more positive examples don't substitute for error signals." They are **one bullet**.
  *   **Bullet 3 (Specific Knowledge)** and **Bullet 4 (Convergence)** are the **empirical payload**. They are distinct but mutually reinforcing. Bullet 4 says "we all land in the same spot." Bullet 3 says "that spot is weirdly specific."
  *   **Dependencies:** You cannot get to Level 4 (Innateness) without Level 1 (Underdetermination) + Level 3 (Specific Knowledge). Level 2 (No Negative Evidence) makes the gap wider, but the argument technically survives even if some negative evidence exists, provided it's insufficient to solve the Level 1 problem.

  ---

  ### Question 1: Is "Never Told What's Bad" True/Necessary?

  **Is it true?**
  Strictly speaking, **no**. Parents do correct children. However, they correct for truth value ("That's not a dog, it's a cat") much more often than for syntax. When they do correct syntax, it is inconsistent and noisy. For the purposes of the argument, it is treated as "functionally absent."

  **Does the argument need it to be true?**
  It is not the engine, but it is the **lock on the escape hatch**.
  *   **The Engine:** The data underdetermines the grammar (Level 1).
  *   **The Escape Hatch:** A learner could theoretically try a rule, get told "no," and update.
  *   **The Lock:** If negative evidence is absent, the "trial and error" escape hatch is closed.

  If you admit there is *some* negative evidence, the POS defender just shifts the goalpost: "Okay, there is *some*, but is there enough to rule out every possible wrong hypothesis in the infinite set?" Usually, the answer is still no. So, Bullet 1 is a rhetorical amplifier, not the logical core.

  ---

  ### Question 2: The ML Conclusion and Circularity

  This is the crux of your reading group's fight.

  **The Circularity Trap**
  The argument becomes circular if it is phrased like this:
  1.  Human grammar requires Universal Grammar (UG).
  2.  Text data does not contain UG.
  3.  Therefore, text data cannot produce Human Grammar.

  This is question-begging. It assumes the conclusion (that UG is required) in the premise.

  ** The Non-Circular Version**
  To avoid circularity, the argument must be about **signal recoverability**, not ontology. It looks like this:
  1.  **Observation:** Humans acquire Constraint X (e.g., you can't question out of a complex noun phrase).
  2.  **Analysis:** Surface text statistics (n-grams, dependency lengths) are compatible with both "Has Constraint X" and "Violates Constraint X."
  3.  **Learning Theory:** A learner operating only on surface statistics (like a standard RNN/Transformer objective) will converge on the "Violates Constraint X" hypothesis because it is statistically simpler or equally probable given the data.
  4.  **Fact:** Humans converge on "Has Constraint X."
  5.  **Conclusion:** Humans must have a bias *against* the "Violates Constraint X" hypothesis that is not derived from the text statistics.

  **Does this get him his conclusion against the ML guy?**
  Only if **Premise 3** holds.
  The ML person's counter-argument is: "You assume the learner is a simple statistical model. A Transformer with enough layers and attention heads *can* recover latent structure from surface statistics."

  For your friend's argument to survive, he must prove that **no amount of surface text** contains the signal for Constraint X. This is incredibly hard to prove. In fact, recent ML papers claim to show LLMs *do* respect some island constraints (Bullet 3), which would falsify the strong POS claim.

  **What must be true for this to apply to ML systems?**
  For the POS argument to rule out text-trained ML, two things must be true:
  1.  **Representation Mismatch:** The objective function of the ML system (predict next token) is fundamentally incapable of representing the linguistic generalization (hierarchical structure), regardless of model size.
  2.  **Signal Absence:** The information required to distinguish the correct hierarchy from incorrect hierarchies is not present in the statistical correlations of the text, even implicitly.

  If the ML system *does* learn the grammar, the POS argument doesn't necessarily fail; it just means the "poverty" wasn't as severe as claimed for that specific architecture. But if the ML system learns it *without* the specific innate bias humans have, then the claim that *humans* need innate bias is weakened.

  ---

  ### Question 3: The "Five-Second" Rhetoric vs. The Substantive Claim

  **The "Five-Second" Version (Rhetorical)**
  *   **Which Reading:** **Bullet 2 (Underdetermination).**
  *   **Why:** It's the easiest to state. "Data is finite, grammar is infinite, you can't get from A to B."
  *   **Problem:** It's too easy to dismiss. An ML person can just say "Induction works all the time, stop being a rationalist." It ignores *which* generalizations are actually learned.

  **The "Worth Defending" Version (Substantive)**
  *   **Which Reading:** **Bullet 3 (Specific Knowledge) + Bullet 5 (Quality).**
  *   **Why:** This focuses on specific phenomena (like your *is the man who is tall* example). It claims: "Here is a specific rule humans know. Here is a specific reason why statistical learning on text would fail to find it. Therefore, something else is going on."
  *   **Defense:** This requires doing the linguistics. You have to show the ML model actually fails on that specific construction, or that the construction is statistically invisible in the corpus.

  ### Advice for Your Reading Group

  Tell your friend to stop using "Poverty of the Stimulus" as a period at the end of a sentence. It is not a fact; it is an **inference to the best explanation**.

  *   **If he wants to win:** He needs to stop talking about "finite data" (Level 1) and start talking about **Structure Dependence** (Level 3). He needs to say: "Show me the statistical signal in the text that tells a model 'move the main auxiliary, not the relative clause auxiliary.' If you can't point to the signal, the stimulus is poor."
  *   **If the ML person wants to win:** They need to show that the model *does* learn structure dependence, implying the signal *was* there in the statistics, just hidden in high-dimensional correlations.

  **Summary for your notes:**
  1.  **Bullet 1 & 5** are the same claim (Quality of signal).
  2.  **Bullet 2** is trivial logic, not a linguistic argument.
  3.  **Bullet 3 & 4** are the empirical evidence.
  4.  **Circularity** exists only if you assume innateness to prove unlearnability. Avoid this by focusing on **recoverability of specific constraints**.
  5.  **For ML:** The argument holds only if the target grammar is mathematically unrecoverable from the loss function (next-token prediction) alone.
