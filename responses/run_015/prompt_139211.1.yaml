answer: |-
  **MEMORANDUM**

  **TO:** Hospital Board of Directors
  **FROM:** Assisted-Reproduction Policy Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on IVF Embryo Culture Protocol Selection (Contract Renewal)

  **1. Recommendation**

  The Committee recommends that the hospital authorize the adoption of **Protocol B** for all new IVF cycles commencing after the expiration of the current supply contract on December 1, 2023. Concurrently, we recommend that the approximately 1,100 embryos currently in storage created under Protocol A (the "Legacy Cohort") remain designated for transfer using Protocol A conditions wherever technically feasible, or be prioritized for immediate transfer before the protocol switch is fully operationalized. This recommendation is subject to a formal review of clinical outcomes and budgetary impact in twenty-four months.

  **2. Background and Financial Context**

  Our current culture protocol (A) is subject to a manufacturer price increase of nearly 300%. Maintaining Protocol A within our fixed laboratory budget necessitates a reduction of approximately ninety publicly subsidized cycles annually. Based on our registry conversion rates, this reduction equates to twenty-five to thirty fewer live births per year. Protocol B reduces the cost per cycle, allowing the maintenance of current cycle volumes, and increases the live-birth rate per started cycle by approximately three percentage points (from 32% to 35%). However, Protocol B is associated with an increase in the rate of low birth weight (LBW) among live births, from 6% to 9%, carrying associated downstream developmental and metabolic risks.

  **3. The Ethical Framework and the Non-Identity Problem**

  The Committee acknowledges that this decision is not a standard risk-benefit analysis. Because embryo survival and implantation are sensitive to culture conditions, switching to Protocol B does not merely alter the health prospects of the children who would have been born under Protocol A; it changes *which* children come into existence. This is an instance of the "non-identity problem": the children born under Protocol B cannot claim they were harmed by the switch, because without the switch, they would not exist at all.

  **4. The Case for Protocol A (Rejected Option)**

  The strongest argument for retaining Protocol A rests on the precautionary principle regarding child health. Even if the specific identities of the children change, the hospital has a moral obligation to minimize the health risks imposed on any child it helps bring into the world. By choosing B, we knowingly select a pathway that produces a higher incidence of low birth weight. Proponents of A argue that public trust in the laboratory depends on the assurance that we prioritize the physiological well-being of the resulting child over the volume of cycles or the laboratory budget. To accept a higher rate of medical vulnerability in newborns for the sake of economic efficiency sets a dangerous precedent, regardless of the identity of the newborns.

  **5. The Case for Protocol B and the Committee's Response**

  The Committee's reproductive endocrinologist argues that Protocol B is not merely permissible but ethically obligatory. The argument is as follows: *Every child born under Protocol B will have a life plainly worth living. No specific child is made worse off by the switch, because the children who would have been born under A will not exist to be deprived of a healthier start. The only actual persons affected are the patients denied treatment under A due to budget constraints. Therefore, maximizing the number of children born (by choosing B) satisfies the primary interest of our patients and violates no duty to the children themselves.*

  The Committee accepts the recommendation to adopt Protocol B but rejects the premise that this choice is without moral cost. While it is logically true that the children born under B are not "harmed" in a comparative sense (since the alternative for them is non-existence), it is morally insufficient to claim that no one is worse off. We owe a duty to the *concept* of the future person, regardless of their specific identity. We are not permitted to treat the identity of future children as a moral loophole that allows us to disregard avoidable health risks. We choose B not because the risks are irrelevant, but because the moral weight of denying existence to thirty children annually outweighs the probabilistic increase in health risks for the different children who will take their place, provided those risks do not cross the threshold of a life not worth living.

  Regarding the draft language stating that "no child born under B would have refused to be born": **To argue that no child would refuse existence is to conflate the value of a life with the acceptability of the risks imposed to create it, thereby evading our duty to minimize preventable harm for whoever comes to exist.**

  **6. Specific Considerations**

  *   **The Legacy Cohort:** For the 1,100 embryos currently in storage, the identity of the potential child is already fixed. The non-identity defense does not apply here. For these patients, switching to Protocol B constitutes a direct change in the medical management of a specific potential life. Therefore, these embryos should be managed under Protocol A conditions to honor the expectations and biological context under which they were created.
  *   **Probabilistic Identity:** We acknowledge that for new cycles, we cannot predict with certainty which embryos will implant. The defense that "no one is harmed" holds only in degrees of probability. The Committee treats this uncertainty by applying population-level ethics: we attribute the increased LBW rate to the policy decision, even if we cannot name the specific individuals harmed, because the policy causally determines the health profile of the cohort.
  *   **Pragmatic Randomized Trial:** The Committee recommends **against** an eighteen-month randomized comparison of A versus B. Randomizing patients to Protocol A would knowingly assign them to a protocol with a lower success rate and higher cost when registry data already favors B. Furthermore, a trial would artificially extend a period of uncertainty regarding which children exist, complicating the ethical landscape without yielding actionable data superior to our existing registry evidence.
  *   **Informed Consent:** Regarding patient focus group feedback that they want "their embryo" and not "some embryo": This reaction is not a confusion to be corrected but a legitimate ethical intuition to be respected. Consent documents must be updated to disclose that culture conditions influence which embryos successfully implant. Patients should be informed that protocol selection may influence not only the *chance* of pregnancy but the *identity* of the resulting child. We will not design language to avoid this fact, but to disclose it transparently.

  **7. Decision Rule for Future Protocol Changes**

  To guide future committees facing identity-affecting choices (e.g., incubator settings, media changes, genetic screening thresholds), the Committee adopts the following decision rule:

  > *When a policy choice determines which particular individuals will exist, the Committee shall not rely on the claim that no specific individual is harmed to justify increased health risks; instead, we must compare the aggregate expected well-being of the population that will exist under each option, and we are obligated to select the option that maximizes the number of lives worth living unless the alternative option imposes health risks on the resulting population that exceed a threshold of acceptable morbidity, regardless of whether those risks would be preferable to non-existence for the specific individuals created.*

  **8. Conclusion**

  We recommend the Board approve the transition to Protocol B effective December 1, 2023, with the stipulations regarding the Legacy Cohort and Consent Documents outlined above. This path honors our commitment to patient access while maintaining rigorous ethical oversight of the health outcomes we facilitate.

  **Signed,**

  **The Assisted-Reproduction Policy Committee**
