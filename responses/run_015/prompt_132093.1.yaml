answer: |-
  In a mid-sized marketing firm, all employees complete the same standardized Focus Inventory, revealing an identical 15% prevalence of high-scoring "ambient cognitive drift" (ACD) across the board. In Program A, high scorers receive a personalized report stating, "You exhibit signs of ACD," along with a pamphlet explaining how this trait shapes task processing, while in Program B, high scorers are silently reassigned to quiet zones and granted flexible deadlines without ever being told their score or given a label. Both groups receive the same material support, but only Group A is invited to interpret their work style through the lens of a named condition, whereas Group B experiences the changes as arbitrary administrative adjustments.

  **Why A Loops and B Stays Flat:** In Program A, workers acquire the semantic vocabulary to reconstruct their identity; knowing they have "ACD" allows them to internalize the classification, altering how they perceive their mistakes and strengths, which in turn modifies the future expression of the trait (the loop). In Program B, the lack of label prevents this self-narrative shift; workers attribute the quiet desks to management whims or luck, so their self-understanding remains static despite the environmental change.

  **The Exact Feature:** Diagnostic Disclosure (the explicit communication of the classification label to the subject).

  **Moving the Feature:** If you move Diagnostic Disclosure into Program B (telling them they have ACD while keeping the accommodations), the loop ignites immediately; workers begin to self-identify as "drifters," potentially increasing the prevalence or intensity of the trait as they align their behavior with the expected profile.

  **The Hacking Defense for B:** A defender of Hacking could argue B still loops invisibly because institutional sorting creates a social kind regardless of self-knowledge; by physically segregating high scorers into quiet zones, the institution treats them as a distinct category, causing colleagues to interact with them differently and forcing the workers into a "protected" role that shapes their behavior through external feedback structures rather than internal self-interpretation.

  Verdict: Diagnostic disclosure drives conscious self-reconstruction, while structural sorting alone enables only invisible behavioral feedback.
