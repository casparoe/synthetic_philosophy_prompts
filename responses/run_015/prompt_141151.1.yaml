answer: |-
  **Brainstorming Angles**

  1.  **The Therapy Session:** A patient claims irrationality; the analyst reframes every denial as data. *Discard:* Makes the theory look like pathology rather than logic; distances the audience from the abstract problem.
  2.  **The Breakup:** "I didn't really choose you" vs. "You chose to say yes." *Discard:* Emotional stakes distract from the logical regress; risks sentimentality.
  3.  **The Courtroom:** A defendant pleads "not guilty"; the judge treats the plea as a revealed preference for trial. *Discard:* Too adversarial; implies legal guilt rather than preference consistency.
  4.  **The Meta Q&A:** An audience member challenges the speaker; the speaker treats the challenge as confirmation. *Discard:* Too close to home; might make the room defensive rather than relaxed.
  5.  **The Dinner Order:** A patron complains about the meal they ordered. *Select:* Mirrors the immediate after-dinner context, low stakes, and clearly isolates the choice mechanism.

  **The Joke**

  A diner sends back his steak. "I didn't want this," he insists.

  The waiter checks his pad. "You ordered it. Choice reveals preference."

  "I was coerced by the menu!"

  "You chose to read it."

  "I'm protesting this logic!"

  "You chose to protest. That's a cost you're willing to bear."

  "But I genuinely don't like steak!"

  "Then you revealed a preference for stating falsehoods. Consistent, if expensive."

  The diner puts his head in his hands. "I just want you to know I didn't choose this."

  The waiter smiles. "Sir, you chose to say that too. Now, shall we reveal a preference for the check?"
