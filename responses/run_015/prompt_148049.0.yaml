answer: |-
  You have a very sharp eye for philosophical structure. Your intuition is correct: the argument collapses if you reject **Step (5)**.

  Your friend is relying on a false equivalence between "crimes against humanity" (or mass murder) and "genocide." They are assuming that if you remove the *specific intent* clause, the only thing left is "a lot of people dying," which is already covered by other laws.

  Here is how to reject Step (5), what it costs you, and how to exit the argument without conceding that the term is hollow.

  ### The Flaw in Step (5)
  **Step (5) claims:** *If we drop the intent rule, the category collapses into crimes against humanity and loses its bite.*

  **Why this is false:** This assumes that the unique wrong of genocide is the *mental state* of the killer. It isn't. The unique wrong of genocide, per Lemkin, is the **ontological harm to the group itself.**

  *   **Crimes Against Humanity (CAH)** protect *individuals*. If a regime kills 10,000 people to suppress a rebellion, that is CAH. The victims are targeted as political obstacles or individuals.
  *   **Genocide** protects the *group as an entity*. If a regime destroys a language, sterilizes a population, or seizes land such that the group *ceases to exist as a distinct cultural/biological unit*, the harm is different. It is "social death."

  Even if you remove the *legal* requirement for specific intent (the "smoking gun" of a document saying "kill them all"), the **moral category** remains distinct. You can have a policy that is functionally genocidal (it destroys the group) without being legally genocidal (no explicit order).

  If you reject (5), you are arguing that **outcome matters as much as intent.** A policy that results in the dissolution of a people is a distinct moral evil from a policy that kills a similar number of people but leaves the group intact. Therefore, it is *not* redundant.

  ### The Cost of Rejecting (5)
  If you take this route, you have to pay a price. You cannot have it both ways.

  1.  **You lose legal precision:** By broadening the moral definition to include "destruction by side effect" (e.g., forced modernization that wipes out a culture), you make the term harder to use in court. It becomes harder to prove causality between "modernization policies" and "group death" than it is to find an order to kill.
  2.  **You invite political inflation:** If "genocide" includes unintended cultural destruction, every assimilationist policy risks being labeled genocide. This dilutes the stigma.
  3.  **You shift the burden:** You are arguing that the *structure of the harm* defines the crime, not the *mind of the criminal.* This is a heavier philosophical lift. You have to convince people that a group has a "right to exist" independent of the rights of its individual members.

  ### How to Exit the Argument
  Your friend's conclusion (Step 6) is that the term is "hollow" because it is "politically loaded." You can reject this dichotomy. A concept can be politically contested without being morally hollow. (Consider "terrorism," "freedom," or "justice"—all fought over, none hollow).

  **Here is the script to walk you out of the trap:**

  > "I think you're conflating the **legal standard of proof** with the **moral nature of the harm.**
  >
  > I'm rejecting step (5). You're assuming that without specific intent, genocide is just 'mass murder.' But Lemkin's point wasn't just about killing; it was about **social death.**
  >
  > If a policy wipes out a people's ability to transmit their culture, language, or lineage, the *harm* is qualitatively different than killing the same number of people in a war. One destroys individuals; the other destroys a future.
  >
  > So, the term isn't hollow. It points to a specific type of harm: **the destruction of a group's right to exist.** The fact that politicians fight over the label doesn't mean the core concept is empty; it just means the stakes are high. We don't say 'justice' is hollow just because people argue over what's fair.
  >
  > I'm willing to accept that the *legal* definition is too narrow (Step 3), but that doesn't mean the *moral* concept collapses. It just means we need to be precise: legally, we need intent to convict; morally, we look at the destruction of the group."

  ### Summary of the Move
  *   **Reject:** Step (5).
  *   **Argument:** Genocide is distinct from Crimes Against Humanity because it targets the *group entity*, not just the aggregate of individuals.
  *   **Concession:** Admit the *legal* definition is imperfect (Step 3 is valid), but deny that this makes the *moral* concept redundant.
  *   **Result:** You save the concept from hollowness by grounding it in the **nature of the harm** (group destruction) rather than the **state of mind** (intent).

  This allows you to acknowledge the political fighting (your friend's point) without agreeing that the fighting proves the concept is meaningless. It turns the argument from "Is this genocide?" to "What kind of harm is being inflicted?" which is usually more productive.
