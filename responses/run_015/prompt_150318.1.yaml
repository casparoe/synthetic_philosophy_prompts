  running case: a data center has an automated backup that should trigger every sunday. the engineer on call skips the check (omission). monday the primary fails, backup doesn't work, data is lost. question: is the engineer's failure-to-check a cause of the loss?

  build the tree with branch nodes that are plain questions someone can answer without knowing the labels. cover at least these splits:
  - are omissions ever real causes, or only loose shorthand for "something else went wrong"?
  - if real, is counterfactual dependence enough (if he had checked, backup works), or do we need a normative/deontic layer (he was supposed to check)?
  - if counterfactual is enough, must there be a defined "normal course" or baseline (the sunday schedule) that makes the absence count, or can pure non-events be causal?
  - then my own injection: in a microservice setup, if three separate services all fail to send a heartbeat and the orchestrator crashes, is each missing heartbeat a cause, or does the causal work get diluted across omissions? how does your tree handle "diffuse omission"?

