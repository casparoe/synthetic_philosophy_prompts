answer: |-
  # Causation-by-Omission Decision Tree

  **Case:** Engineer skips Sunday backup check. Monday primary fails. Data lost.
  **Goal:** Determine if the skip is a *cause*.

  ```text
  START: The engineer did nothing. Did this "nothing" cause the loss?
  │
  ├── NO: Omissions are never real causes. 
  │       (They are just shorthand for "the active failure wasn't caught".)
  │       └── LEAF 1: Omissions-Are-Never-Causes View
  │
  └── YES: Omissions can be real causes.
      │
      ├── Q: To count as a cause, must the engineer have been *supposed* to act? 
      │      (Is there a duty/ticket/SLO violation?)
      │
      ├── YES: Counterfactual isn't enough; you need a rule violation.
      │       └── LEAF 2: Normative/Deontic Account
      │
      └── NO: "If he checked, data saves" is enough. (Counterfactual Dependence)
          │
          ├── Q: Does this counterfactual need a "normal course" baseline? 
          │      (e.g., The Sunday Schedule defines what "missing" means.)
          │
          ├── YES: Without a schedule/baseline, the absence isn't a specific event.
          │       └── LEAF 3: Baseline-Relative Account
          │
          └── NO: Pure non-events are causal. (Any absence that changes outcome counts.)
              │
              ├── Q: DIFFUSE CASE: 3 services miss heartbeats. Orchestrator crashes. 
              │      Is *each* missing heartbeat a full cause?
              │
              ├── YES: Each omission is independently sufficient to label "cause".
              │       └── LEAF 4: Standard Counterfactual Account
              │
              └── NO: Causal work is diluted/shared across the group.
                  └── LEAF 5: Unnamed / Unexplored
  ```

  ---

  ### Leaf Profiles & Awkward Commitments

  **Leaf 1: Omissions-Are-Never-Causes View**
  *   **Position:** The skip didn't cause anything. The disk failure caused the loss. The skip is just context.
  *   **Awkward Commitment:** You cannot logically blame the on-call engineer for the outage in a postmortem, even if they slept through the pager. You have to rewrite history to say "the pager system failed to wake them" (an active event) to assign blame.

  **Leaf 2: Normative/Deontic Account**
  *   **Position:** The skip is a cause *only* because it violated a duty (the Sunday check requirement).
  *   **Awkward Commitment:** If the Sunday schedule was verbal and undocumented (no formal duty), the engineer's skip did *not* cause the outage, even if checking would have 100% saved the data. Causation depends on paperwork.

  **Leaf 3: Baseline-Relative Account**
  *   **Position:** The skip is a cause because it deviated from the "normal course" (the expected Sunday state).
  *   **Awkward Commitment:** If the system was already unstable (no clear "normal"), you can't determine causation until you arbitrarily define what "normal" should have been. Causation is retroactively edited by defining the baseline.

  **Leaf 4: Standard Counterfactual Account**
  *   **Position:** If the heartbeat existed, the crash wouldn't happen. Therefore, the missing heartbeat is a cause.
  *   **Awkward Commitment:** In the diffuse case (3 services fail), *each* service is a 100% cause of the crash. You end up with 300% causation distributed across the team. Blame is inflated, not shared.

  **Leaf 5: Unnamed / Unexplored**
  *   **Position:** The omissions combine to cause the crash, but no single omission carries the full weight.
  *   **Awkward Commitment:** You cannot ticket any single service for the root cause. The "cause" is a ghost entity existing only in the combination. Debugging tools can't point to a single line or service.

  ---

  ### Tree Limitations & Notes

  **Incoherent Combination:**
  Claiming **"Omissions are never real causes"** (Leaf 1) while simultaneously insisting **"We need a normative layer to find the cause"** (Leaf 2 logic).
  *   *Why:* If omissions aren't real causes, adding a rule violation doesn't turn them into one; it just turns a non-cause into a blameworthy non-cause. You can't have it both ways in a strict causal model.

  **Flagged Pair (Hard to Separate):**
  **Leaf 2 (Normative)** and **Leaf 3 (Baseline-Relative)**.
  *   *Why:* In engineering practice, a "Duty" (Leaf 2) and a "Normal Course Baseline" (Leaf 3) are usually the same document (the runbook/SLO). Philosophically they differ (one is moral/legal, one is statistical/expectational), but in a postmortem meeting, they produce the exact same verdict: "Check the schedule. If it was due, it's a cause."

  **Handling the Diffuse Injection:**
  The tree forces a choice at the bottom (Leaf 4 vs. Leaf 5). Most standard engineering tools assume **Leaf 4** (every failed dependency is a root cause), which leads to alert fatigue. **Leaf 5** is more intuitive for distributed systems (degraded quorum) but lacks a formal logic for assigning tickets.

  Bottom line: The tree splits on whether you think causation is about physics (what changed the state) or sociology (who broke the rules).
