  The common room at St. Jude's was thick with the scent of stale tobacco and unresolved paradoxes. Professor Alistair Thorne stirred his tea with a precision that suggested he was minimising entropy rather than dissolving sugar.

  "I must decline your wager, Barnaby," Thorne said, pushing the contract across the mahogany table. "The St. Petersburg lottery is untenable. The expected utility diverges to positive infinity. My utility function is bounded, and my ledger cannot accommodate an infinite liability."

  Barnaby, a visiting fellow from Zurich with a penchant for pathological distributions, smiled thinly. "A prudent objection, Alistair. Unbounded growth is indeed fiscally impractical. However, consider the Pasadena game."

  He slid a second contract forward. The payoff structure was alternating: positive utilities for odd outcomes, negative for even, decaying in a manner reminiscent of the harmonic series.

  Thorne adjusted his spectacles. "The expectation here is undefined, Barnaby. The series is conditionally convergent. Depending on the order of summation, the value oscillates without settling. It does not diverge to infinity; it simply fails to converge."

  "Precisely," Barnaby said, producing a pen. "It is not infinite. It is indeterminate."

  Thorne hesitated, his hand hovering over the signature line. "But decision theory suggests an undefined expectation is arguably worse than an infinite one. It violates the dominance principle. You could rearrange the terms to make me owe you everything."

  "Technically, yes," Barnaby conceded. "But practically, no. You rejected the St. Petersburg wager because the value was *too large* to compute. You cannot budget for infinity. But the Pasadena expectation is not large. It is nothing. It has no value to budget for."

  Thorne blinked. "You are conflating non-convergence with zero."

  "I am conflating it with manageability," Barnaby corrected, tapping the pen against the paper. "Infinity is a magnitude that exceeds my assets. An undefined value is merely a clerical ambiguity. My accountant can file 'undefined' under miscellaneous expenses. He cannot file 'infinity' anywhere without triggering an audit from the Crown."

  Thorne sighed, signing the document. "So you are exploiting the fact that while unbounded growth breaks the bank, a lack of convergence merely breaks the mathematics."

  "Quite," Barnaby said, pocketing the contract. "I am perfectly comfortable with ambiguity, Alistair. It is only certainty I cannot afford. Especially certain ruin."

  "And if I sum the series starting with the negative terms?" Thorne asked quietly.

  Barnaby paused at the door. "Then I shall claim the order of play was different. After all, if the expectation is undefined, surely the liability is too."
