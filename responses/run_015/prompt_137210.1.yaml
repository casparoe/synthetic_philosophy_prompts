      *   **Core Problem:** Incommensurability of welfare across persons. The user has intuitive confidence levels in various comparisons but lacks an articulated principle. They suspect a hidden rule governs their confidence.
      *   **The Proposed Rule:** "Compare one person's gain with another's loss only when every admissible way of placing their two scales on a common footing yields the same verdict; where the admissible placements disagree, withhold judgment and treat the outcomes as incomparable rather than equal." (Essentially, a robustness criterion over interpersonally comparable utility functions).
      *   **The Constraint:** A hypothetical "monitor" exists that gives intra-personal welfare data (reliable, proportional) but lacks inter-personal mapping (unknown zero, unknown unit).
      *   **The Task:**
