          2.  The Fatal Flaws (Epistemic & Incentive).
          3.  The Normative Limits (What it can't describe).
          4.  The Falsifiability Question.
          5.  The Diagnostic Failure (The Pilot).
          6.  Conclusion.

      *   *Refining the "Counterfactual Audit" Critique:* This is the crux. The friend is right. If settlement depends on a human judgement of a counterfactual, the market trades the judgement. This is "Keynesian Beauty Contest" territory. It destroys the "wisdom of crowds" regarding the *world*, replacing it with wisdom regarding the *panel*.
      *   *Refining the "Fatal" vs "Awkward":*
          *   Fatal: The audit turns the market into a lobbying exercise for the auditors. The "Is-Ought" problem (maximising GDP might violate rights).
          *   Awkward: Complexity, public trust, transition.

      *   *Refining Falsifiability:* If the proponent says "It failed because the metric was wrong," that's unfalsifiable. A falsifiable claim must hold the metric constant or admit metric selection is part of the political process (which voting handles).

      *   *Refining Diagnostic Failure:* Look for decoupling. If market prices stop tracking real-world leading indicators and start tracking political news about the Citizens' Assembly.

  9.  **Review against Constraints:**
      *   British English? (Check: 'programme', 'centre', 'modelling', 'defence', 'colour', 'analyse').
