answer: |-
  **To:** The Columnist
  **Re:** The Case Against Futarchy (and your variant)

  You have asked for the steelman's opposite: a critique that grants the elegance of the proposal while dismantling its viability. You have already swatted away the crude objections regarding liquidity and market manipulation. Those are engineering problems; in principle, they can be solved with enough capital and regulation. The objections that remain are not engineering problems. They are architectural and philosophical. They suggest that the building, however well-constructed, is being erected on ground that cannot support it.

  Here is the case against the family of views, ranked from the fatal to the merely awkward, with specific attention to your counterfactual-audit variant.

  ### I. The Fatal Objections

  These are arguments that, if accepted, require the abandonment of the mechanism, not merely its tuning.

  **1. The Audit Becomes the Target (The Reflexivity Problem)**
  Your friend's intuition is correct, but the implication is deeper than mere corruption. In your variant, the settlement value is not a hard number (like GDP or temperature) but a *judgement* rendered by a citizens' assembly five years hence. This transforms the market from a discovery mechanism about the world into a discovery mechanism about the psychology of future auditors.

  In canonical futarchy, traders bet on $P(Outcome | Policy)$. In your variant, they bet on $P(AuditJudgement | Policy, CompositionOfAssembly, PoliticalMoodInFiveYears)$. The latter is infinitely noisier and, crucially, more susceptible to lobbying than the former. It is harder to bribe a weather station than a human panel. But beyond corruption, there is the issue of *anticipatory adaptation*. If traders believe the Assembly will be swayed by narrative rather than data, they will invest in generating favourable narratives for the winning policy and damaging narratives for the loser, rather than ensuring the policy actually works. The market ceases to aggregate information about *efficacy* and begins aggregating information about *persuasiveness*. This destroys the epistemic link between the price and the welfare index.

  **2. The Epistemic Void of the Counterfactual**
  You propose the audit to solve the problem of the "counterfactual branch" — knowing what would have happened had the losing policy been chosen. But a citizens' assembly estimating a counterfactual is not measuring a fact; they are engaging in speculative fiction.

  There is no "true" value of the welfare index under the unchosen policy. There are only models and guesses. By making payouts depend on this guess, you are not grounding the market in reality; you are grounding it in a consensus hallucination. If the Assembly's estimate is systematically biased (e.g., they always assume the road not taken was greener), the market will price that bias. You have not removed the subjectivity of politics; you have merely deferred it from the vote to the audit, while adding a layer of financial speculation on top. A mechanism that settles on subjective estimates of unobservable events is functionally indistinguishable from a panel of experts making a decision, but with higher transaction costs.

  **3. The Normative Mismatch (Rights vs. Aggregation)**
  This is the most philosophical defeater. Futarchy is inherently consequentialist and aggregative. It maximises the sum (or average) of the welfare index. It cannot, in principle, accommodate deontological constraints.

  There are decisions where the right course of action is *not* the one that maximises the index, because doing so would violate a right or a principle. For example, a policy might slightly raise the welfare index by infringing on a minority's liberty. A voting system can protect that liberty through rights-based vetoes or constitutional constraints. A market system, left to its own logic, will trade that liberty away if the price is right. You can hard-code constraints into the legislature's pre-registration, but the moment you allow the market to optimise within those bounds, it will push against them. If the system works as intended, it will constantly test the boundaries of what is permissible, creating a permanent tension between the market's optimisation and the society's moral constraints.

  ### II. The Structural Limits (What the Machinery Cannot Describe)

  You asked if there is a class of decision for which the machinery cannot even be stated. There is.

  **1. Distributional Choices**
  Futarchy can answer: "Which policy yields the highest total welfare?" It cannot answer: "Who should bear the cost?"
  If Policy A yields a welfare index of 100 (evenly distributed) and Policy B yields 105 (concentrated in the top 1%), the market selects B. Voting allows for a coalition of the 99% to reject B. Your system describes efficiency, but it is silent on equity. You might argue the welfare index can be inequality-adjusted. But that requires a political judgement on the *weight* of inequality versus growth. That weight is the very thing politics is supposed to decide. By fixing the index beforehand, the legislature makes the political choice anyway. If the legislature makes the political choice, what work is the market doing? It is merely an optimisation engine for a pre-determined value system.

  **2. Constitutive Decisions**
  Some decisions are not about outcomes but about identity. "What kind of country do we want to be?" is not a question with a welfare index. If a society votes to preserve a language or a landscape at an economic cost, futarchy would label this irrational if the index is economic. If the index includes "cultural satisfaction", the market can trade it, but only if that satisfaction is measurable. Much of what matters in politics is incommensurable. The machinery cannot describe a choice between two incommensurable values, only a choice between two quantities of a single value.

  ### III. The Falsifiability Trap

  You ask whether the position has been qualified into something unfalsifiable. The short answer is: yes, it is at high risk of doing so.

  The defence you describe — "this is only for decisions with a measurable outcome, a pre-committed metric and a body willing to be bound" — acts as a permeable shield.
  *   **If the market picks a policy that fails:** The defender says, "The metric was wrong, not the market."
  *   **If the market is manipulated:** The defender says, "The regulations were insufficient, not the mechanism."
  *   **If the public rejects the result:** The defender says, "They lacked the will to be bound, not the system's fault."

  For the claim to be falsifiable, the proponent must commit to the *metric selection process* being part of the test. If every failure of the system can be attributed to a flaw in the *inputs* (the index, the horizon, the audit rules) rather than the *processing* (the market mechanism), the theory is insulated from reality.

  A principled scope restriction would admit that futarchy is a tool for *technical optimisation* within a fixed political framework, not a replacement for *political choice*. If defenders claim it replaces voting for *any* significant policy, yet retreat to "only measurable ones" when challenged, they are moving the goalposts. Most high-stakes political decisions (war, tax, rights) are not cleanly measurable in a five-year horizon. If the system is only applicable to low-stakes, technical decisions, its revolutionary claim is vastly diminished.

  ### IV. The Diagnostic Failure (The Pilot)

  You asked for a clear account of what a diagnostic failure would look like in a pilot — a pattern of results that indicts the mechanism rather than bad luck.

  In a pilot (say, a city council using this for budget allocation), you would look for **decoupling**.

  **1. Price-Indicator Decoupling**
  In a healthy prediction market, the price should track leading indicators of the real-world outcome. If the policy is "build a bridge", and the market price for "high welfare" drops when construction costs overrun, the market is working.
  *   **Diagnostic Failure:** The market price remains stable despite negative real-world news, or moves solely on news regarding the *Citizens' Assembly* (e.g., rumours about who will be selected, their political leanings). This proves the traders are betting on the audit, not the world.

  **2. The "Loser's Premium"**
  In your variant, payouts depend on the gap between the winner and the estimated loser.
  *   **Diagnostic Failure:** Traders shorting the winning policy not because they think it will fail, but because they believe they can convince the Assembly that the *losing* policy would have been a miracle. If you see resources flowing into lobbying the future auditors rather than implementing the policy, the incentive structure has inverted.

  **3. Metric Gaming vs. Welfare Improvement**
  *   **Diagnostic Failure:** The welfare index rises, but independent measures of citizen well-being (surveys, health data not in the index) stagnate or fall. This indicates the market successfully optimised the metric (Goodhart's Law) rather than the underlying reality. In a voting system, voters can punish this retrospectively. In a bound market system, they cannot undo the decision until the next horizon.

  ### V. Verdict on the Counterfactual-Audit Variant

  Does your variant take on commitments the original does not? Yes.

  *   **Canonical Futarchy** commits to the idea that *realised outcomes* are sufficient to validate the decision. It accepts that we may never know if the loser was better, but we trust the market to have priced the probability correctly ex-ante. It is humble about the counterfactual.
  *   **Your Variant** commits to the idea that we *can* know the counterfactual, ex-post, via human judgement. This is a bolder epistemic claim. It claims a citizens' assembly can reliably reconstruct a timeline that did not happen.

  Paradoxically, your variant is more vulnerable than the original. Hanson's original futarchy is flawed because it doesn't settle the counterfactual. Yours is flawed because it tries to settle it with a subjective instrument (the Assembly). By trying to fix the settlement problem, you have introduced a "Judge" back into the system. The whole attraction of the market was to remove the need for a Judge. Once you have a Judge whose decision determines payouts, you have returned to a form of governance by elite panel, merely preceded by a betting shop.

  ### Summary of Rankings

  **Fatal:**
  1.  **Reflexivity:** The market trades the audit, not the world. (Specific to your variant).
  2.  **Epistemic Void:** Counterfactuals are not facts; settling on them creates a market for hallucinations.
  3.  **Normative Mismatch:** The system cannot process rights or constraints, only aggregates.

  **Merely Awkward:**
  1.  **Complexity:** The system is hard to explain to voters. (Can be solved with education).
  2.  **Transition Costs:** Moving from voting to markets is disruptive. (A one-time cost).
  3.  **Liquidity:** (As you noted, solvable with capital).

  **The Unfalsifiability Risk:**
  High. Unless defenders admit that a failure of the *metric design* is a failure of the *system*, the theory is immune to evidence.

  **The Diagnostic Failure:**
  Look for market prices that correlate with the *politics of the audit* rather than the *performance of the policy*. If the traders are lobbying the referees, the game is broken.

  You are defending a mechanism that treats politics as an engineering problem. The strongest case against it is that politics is not about finding the optimal solution to a given equation; it is about deciding what the equation should be. Your system fixes the equation (the index) and optimises the variables. But in a democracy, the voters are supposed to choose the equation. By pre-registering the index, the legislature makes the political choice; the market merely does the arithmetic. If that is all it does, it is a useful tool for bureaucrats, but it is not a replacement for the vote.
