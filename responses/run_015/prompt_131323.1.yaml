  10. **Final Polish:** Ensure the distinction between the canonical view (Hanson) and the user's variant is clear. The user's variant attempts to solve the "counterfactual problem" but arguably creates a "principal-agent problem" with the auditors.

      *(Self-Correction during drafting)*: I need to make sure I don't just repeat the friend's objection but expand on *why* it is fatal. It's not just that they bet on the panel; it's that the *informational content* of the price changes from "probability of outcome" to "probability of panel persuasion". This degrades the epistemic value.

      Also, need to address the "class of decision it cannot describe". This is about rights, distribution, and values that aren't aggregatable into a single index.

      Let's assemble the argument.

      *Structure:*
      1.  **Introduction:** Acknowledge the elegance.
      2.  **The Fatal Objections (Mechanism & Incentive):**
          *   The Audit as the Target (Goodhart's Law applied to the referee).
