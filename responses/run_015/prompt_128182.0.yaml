      *   *(Refining Point 2):* The intentionality issue is the biggest philosophical hurdle. I need to suggest a way around it. Maybe the "artist" is the engagement optimizer? Or the system itself is a "counterfeit medium"? Let's suggest framing the *system* as the counterfeit artist.
      *   *(Refining Point 3):* Tolstoy's anti-elitism is key. Algorithms claim to be democratic but create new elites (influencers). That's a strong point.

