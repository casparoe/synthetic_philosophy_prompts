  **The question**

  This project asks whether Bayesian confirmation theory correctly penalizes theories that only approximately accommodate old evidence. Standard treatments assume theories entail evidence, yielding zero confirmation when evidence is certain. I investigate the case where certainty holds but entailment fails: if $P(E)=1$ and $P(E|T)<1$, the likelihood ratio forces disconfirmation. The determinate question is: does this mathematical penalty reflect a genuine epistemic cost of loose fit, or is it an artifact of idealizing empirical data as certain? I will resolve whether modifying the certainty constraint restores intuitive confirmation judgments without losing formal rigor. The deliverable will be a journal-length paper establishing whether this Approximate Old Evidence Problem requires a revision of standard Bayesian updating rules. The project concludes with a recommendation for how philosophers should model old evidence in non-ideal cases.

  **Why the usual fixes don't settle it**

  Existing solutions target the entailment case exclusively. The counterfactual approach suggests evaluating confirmation as if the evidence were unknown at the time of theory proposal. However, this requires reconstructing priors for $E$. When the link between theory and evidence is probabilistic rather than deductive, it is unclear whether we should counterfactually remove knowledge of $E$ or knowledge of the theoretical link. The logical-learning approach argues we learn not $E$, but that the theory entails the evidence. This collapses when the theory does not entail the evidence but merely predicts it within error bars. Neither strategy addresses the specific arithmetic of the approximate case. They solve the problem of zero confirmation for perfect fits but leave the problem of negative confirmation for approximate fits untouched. Consequently, the literature remains silent on whether accommodating old data approximately should be neutral, positive, or negative evidence. Without addressing the likelihood ratio collapse when $P(E)=1$ and $P(E|T)<1$, these fixes cannot determine if the formalism is capturing a real constraint on theory choice or merely broadcasting a modeling error. The gap remains because the existing fixes assume the theory-evidence link is the variable to adjust, not the certainty of the evidence itself.

  **Method, month by month**

  Month one focuses on formal reconstruction and derivations. I will model the relationship between theory, auxiliaries, and evidence using Bayesian networks to isolate exactly where the certainty constraint bites the likelihood ratio. I will test variations where $P(E)$ is slightly less than one to see if disconfirmation persists continuously or discontinuously as certainty approaches unity. This involves deriving the posterior probability functions under different assumptions about the auxiliary hypotheses. Month two involves comparative analysis of existing solutions. I will apply these models to the two dominant solution types adapted for the approximate case, checking for internal consistency and coherence. I will not conduct historical case studies; instead, I will use stylized examples from measurement theory, such as error margins in instrumentation, to test the formalism against intuitive judgments. This avoids the feasibility issues of archival research which would dominate the timeline. Month three is synthesis and writing. I will draft the argument, focusing on the decision procedure for when approximate fit counts as a cost versus when it is negligible. The goal is a clean formal argument supplemented by philosophical analysis, avoiding the quagmire of detailed historical reconstruction. I will dedicate the final weeks to refining the argument for publication, ensuring the formal proofs are accessible to a general philosophy of science audience. I will also prepare a short technical appendix for specialists who wish to verify the derivations. I will submit the draft for peer feedback within the group before finalizing.

  **The outcomes and how I'd tell which is right**

  Outcome A: The penalty is real. Approximate fit to old data is epistemically costly because it suggests tuned auxiliaries. This holds if lowering $P(E)$ slightly does not remove the disconfirmation. Outcome B: The penalty is an artifact. If setting $P(E)$ slightly less than one restores positive confirmation, the result was purely due to the certainty idealization. This would recommend abandoning strict certainty in problem of old evidence discussions. Outcome C: Hybrid. The penalty exists but is offset by the novelty of the auxiliary hypotheses required to bridge the gap. I will decide between these by examining the sensitivity of the posterior probability to small changes in the certainty constraint. If the result flips sign with infinitesimal changes in probability assignments, it is an artifact. If the sign remains negative until the theoretical prediction exceeds a specific threshold, it is a feature of the confirmation relation. The deciding consideration is continuity: robust epistemic features should not vanish with infinitesimal changes in modeling assumptions. I will also check if the penalty disappears when the auxiliaries themselves are treated as novel predictions. The final paper will argue for the most stable solution across these variations.

  **What would count as failure**

  Failure occurs if the problem dissolves into a trivial notation issue. If the disconfirmation result relies on a known inconsistency in assigning unity probability to empirical data that has already been resolved in standard texts, the project adds nothing. Similarly, if the formalism proves too unstable to yield a determinate verdict—meaning the result depends entirely on arbitrary prior choices for the auxiliaries—then there is no general philosophical lesson to draw. I would conclude the project early if the math shows the effect is merely a numerical quirk of ratio calculations rather than a structural epistemic insight. Essentially, if the result is just one small lemma plus a shrug, I will report that negative result rather than forcing a conclusion. I will document the derivation clearly to show why the problem collapses.

  **Scope check: why three months is enough, and why it might not be**

  Three months suffices because the work is primarily formal and conceptual, not archival. I am not digging into Einstein's letters but manipulating probability assignments. The deliverable is a single argument, not a monograph. However, risk lies in the technical complexity; if the Bayesian networks require extensive simulation rather than analytic solutions, time will overrun. Additionally, if the literature review reveals the point has been made implicitly by others, the scope shifts to critique rather than construction, which may take longer to nuance correctly. This timeline assumes access to standard formal logic software and assumes I can maintain focus on the formal derivation without getting sidetracked by broader foundational debates in confirmation theory. I have allocated buffer time in month three to accommodate these potential shifts in focus without compromising the final word count.
