      *   *Critique:* Is there a legal example?
      *   *Fix:* In Islamic Law (which Ghazali cared about), the distinction matters for *intent* vs. *outcome*. But for a secular argument, the "Expectation of Anomaly" is better. If you think causes are necessary, an anomaly is an error in measurement. If causes are habitual, an anomaly is a genuine break in the pattern. This changes how scientists treat outliers.

      *   *Let's stick to the "Necessity vs. Habit" argument.* That is the philosophical heavy lifter. The "verbal trick" claim fails because verbal tricks don't change modal logic.

  7.  **Final Polish:**
