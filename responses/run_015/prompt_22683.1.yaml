      *   **Addressing Marcus:** Marcus is treating causality as *descriptive* (what happens). Ghazali treats it as *prescriptive/ontological* (what makes it happen). The distinction matters for *metaphysical commitment*, not just prediction.
      *   **Tone Check:** Keep it friendly, intellectual, not condescending. Help the user feel equipped but also okay with agreeing to disagree if Marcus is dug in.

