answer: |-
  The right standard is that a neural state represents X only if it carries **interventionally specific causal leverage** over downstream computations regarding X, distinct from mere correlational recoverability.

  ### The Desiderata

  **1. Causal Non-Redundancy (Non-negotiable)**
  *   **Requirement:** Manipulating the candidate representational state (steering/lesioning) must alter downstream behavior in a way specific to X, without collapsing general function.
  *   **Case:** The "unused direction." If a direction predicts "French" perfectly but lesioning it changes nothing, it is not a representation *for the network*; it is epiphenomenal noise correlated with the true mechanism.
  *   **Why:** Without this, you cannot distinguish the network's algorithm from the data it happened to see. This separates *mechanism* from *artifact*.

  **2. Probe Independence (Non-negotiable)**
  *   **Requirement:** The structure must exist prior to the training of the probe; the probe must discover, not construct, the basis.
  *   **Case:** "Probes can pull anything out." A linear probe can find information in random noise if overfit. A real representation must be robust to the choice of probe architecture and training seed.
  *   **Why:** This prevents the roommate's charge that interpretability is just "finding flattering stories." If the structure only exists relative to the probe, it's a property of your analysis, not the net.

  **3. Implementation Invariance (Camp-Wanted)**
  *   **Requirement:** If two nets are behaviorally equivalent, they should be credited with the same representations, even if the geometric bases differ.
  *   **Case:** The "seed relativity" case. Net A has a French direction; Net B encodes Frenchness in a distributed polysemantic smear. If you demand a clean direction, only A represents French. If you demand functional equivalence, both do.
  *   **Why:** This is where you and your roommate diverge. You want this true (representation is functional); he wants it false (representation is geometric). Dropping this admits that representation is substrate-dependent, which makes "the network represents X" a claim about a specific weight configuration, not the computation.

  **4. Compositional Separability (Camp-Wanted)**
  *   **Requirement:** Representations of X and Y should be distinguishable even if X and Y co-occur in training.
  *   **Case:** The "horns and stop signs" case. If one direction fires for both, does it represent the conjunction or the components? A strong account requires that superposition be resolvable into distinct causal levers.
  *   **Why:** This is what the interpretability camp wants to be true (that nets disentangle world structure). It may not be true. Nets might rely on "horns-and-stop-signs" as a primitive heuristic. Demanding separability might force you to posit structure that isn't there.

  ### The Impossible Tension

  You are correct: **'Content is fixed by causal role'** and **'A net can represent what it never uses'** cannot be jointly satisfied.

  *   **The Conflict:** If content is exhausted by causal role (functionalism), then a state that plays no causal role in behavior has no content. It is inert. To claim it "represents" X despite being unused requires an informational theory of content (covariation), but that collapses back into the roommate's "projection" charge because covariance exists everywhere in high-dimensional space without implying mechanism.
  *   **Which to Drop:** Drop **'A net can represent what it never uses.'**
  *   **Why:** For interpretability to be engineering rather than philosophy, representation must track *mechanism*. If a feature is present in activations but causally inert, it is not part of the network's model of the world; it is a fossil or a shadow. Calling it a "representation" grants it explanatory power it does not earn. You must concede that if steering it does nothing, the network does not "know" it, regardless of what a probe finds.

  (Note: 'Represent falsely' is also tensioned with causal role, but solvable via teleosemantics—i.e., the network represents what it was *selected* to detect, not what it actually detects. But 'unused' is fatal to causal role.)

  ### The Knockout Requirement

  The single requirement that knocks out the most candidate accounts is **Interventional Specificity**.

  *   **What it demands:** It is not enough that steering direction D changes the output; steering D must change the output *only in ways consistent with X* while preserving unrelated capabilities.
  *   **Who it kills:** It kills **Linear Probe Accounts** (which find correlations but fail to intervene), **Activation Maximization** (which finds inputs that fire neurons but doesn't prove the neuron controls the feature), and **Correlation-based Interpretability** (which conflates co-occurrence with mechanism).
  *   **Why:** Most current "discoveries" are red descriptions. They show that information is *present*, not that it is *used*. Interventional Specificity forces the claim: "This vector is not just associated with French; it is the variable the downstream layers read to determine Frenchness." Most claimed representations fail this when tested out-of-distribution or under adversarial steering.
