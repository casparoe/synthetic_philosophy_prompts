answer: |-
  This is a sophisticated reconstruction of the famous "Fragment on Machines" from the *Grundrisse*. You have correctly identified the tension that Marx himself grappled with: the contradiction between the *forces of production* (technology/wealth) and the *relations of production* (value/profit).

  Your friend is right about the Marxist interpretation, but you are right to feel a logical itch. The itch isn't in the economics; it's in the philosophy of science implicit in your Step (6).

  Here is where I would break the argument, why it looked convincing, and what it costs you.

  ### The Step to Reject: (6)

  **The Step:** *"A theory that says of itself that it will stop being true isn't a good theory. So (1) is false, or at best only true for a while."*

  **Why it looked fine:**
  You are applying a **positivist** standard of truth, similar to natural sciences like physics or chemistry. If a theory of gravity said, "Gravity works by attracting masses, but eventually masses will stop attracting each other for no reason," we would say the theory is broken. We expect fundamental laws to be universal and trans-historical. If your definition of "Value" in (1) is like your definition of "Mass," then (6) is a valid critique.

  **Why it is wrong (in this context):**
  Marxism is not a natural science; it is a **historical** science. It does not claim to describe eternal laws of human interaction, but specific laws governing a specific social form (capitalism).

  Consider a theory of "Feudalism."
  1.  Feudal legitimacy is based on Divine Right and land tenure.
  2.  Trade and money economies undermine land tenure.
  3.  Therefore, Feudalism generates forces that make Divine Right obsolete.
  4.  Therefore, the theory of Feudalism predicts its own end.

  Does this make the theory of Feudalism *false*? No. It makes it **historically specific**. The theory accurately describes the internal logic of the system *while the system exists*, including the logic of its own dissolution.

  In Step (5), you note that "Wealth and labor time come apart." Marx agrees. He distinguishes between **wealth** (use-values, stuff that satisfies needs) and **value** (socially necessary labor time, the capitalist metric).
  *   Under capitalism, wealth *must* take the form of value.
  *   Automation creates massive wealth (use-values) but destroys the basis of value (labor time).
  *   When the basis of value is destroyed, capitalism cannot function (profit collapses), and the system must transition to something else (communism/post-capitalism) where distribution is no longer based on labor time.

  So, the theory doesn't become *false*; the **object of the theory ceases to exist.** A theory of ice that predicts the ice will melt at 20°C is not a bad theory because the ice stops being ice. It is a successful theory of ice.

  **The Cost:**
  To keep (1) through (5) and reject (6), you must pay this price:
  **You must abandon Economic Naturalism.**
  You cannot treat "Value" or "Profit" as eternal features of human existence (like calories or gravity). You must accept they are social relations specific to a certain epoch.
  *   **What you lose:** The comfort of thinking economics is like physics. You lose the ability to say "Marx was wrong about Value" simply because we might move to a post-labor economy.
  *   **What you gain:** You save the core insight (1–3). You preserve the idea that capitalism is a historical system with a beginning, a middle, and an end, rather than the "end of history."

  ### The User's Specific Worry

  You wrote: *"If that's the answer I dont see how (1) is a claim about what value is rather than about what it used to be in one period."*

  This is the crux. You want (1) to be a definition of essence, but Marx intends it as a definition of **form**.

  *   **Essence view:** "Value *is* labor time." (Implies: Always and everywhere).
  *   **Form view:** "Under capitalism, wealth *appears as* value, and value *is measured by* labor time." (Implies: Only while capitalism lasts).

  If you accept the **Form view**, Step (6) dissolves. The theory claims: "As long as society is organized by commodity exchange, value is labor time." The prediction is: "Automation will make commodity exchange impossible." Therefore, the condition "As long as..." expires. The statement remains true *of the period it covered*.

  ### Alternative: If you really want to reject (2)

  If you find the historical argument unsatisfying and you insist that a valid economic theory must hold forever, you would have to reject **Step (2)**: *"Only living labor creates new value."*

  Some modern Marxists (and post-Marxists) do exactly this. They argue that in a highly automated world, the "general intellect" (science, code, social knowledge) becomes the productive force, and we need a new theory of value that accounts for machine contribution or network effects.

  **The Cost of Rejecting (2):**
  *   **You lose the Exploitation Theory:** If machines create value, then profit doesn't necessarily come from underpaying workers. It might come from the efficiency of the machine itself. This undermines the moral and political core of Marx's critique (that capitalism is based on theft of labor).
  *   **You lose the Crisis Theory:** If machines create value, automation doesn't necessarily lower the rate of profit. The "Tendency of the Rate of Profit to Fall" (Step 4) disappears, and with it, the structural explanation for why capitalism must end.

  ### Recommendation

  Since you said you want to keep (1) through (3) because they "feel like the actual insight," **you must reject (6).**

  The "insight" you value is that capitalism is a specific social system driven by competition and labor exploitation. That insight *requires* the system to be historical. If you demand the theory be eternal (rejecting 6), you force yourself to abandon the very historical dynamics (1–3) that you find insightful.

  **Summary of the fix:**
  Change Step (6) from:
  *"A theory that says of itself that it will stop being true isn't a good theory."*
  To:
  *"A theory that successfully explains the historical limits of the system it describes is a complete theory."*

  The "hole" isn't in the economics; it's in the expectation that a social theory should behave like a law of physics. The *Grundrisse* passage you read is Marx explicitly realizing that capitalism digs its own grave by making labor time irrelevant. That isn't a bug in the theory; it's the punchline.
