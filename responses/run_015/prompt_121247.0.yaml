prompt: |-
  For the last eighteen months I have been building long-horizon LLM agents, and over the last few I have acquired a checking ritual of my own: back to the door three or four times after I have already locked it, with full awareness, every time, that nothing about the lock has changed since the last look. What unsettles me is not the ritual but the resemblance between it and a failure mode I watch all day in my agents. An agent hits an error, reverts to a checkpoint, and replays the same plan token for token — call it *replay perseveration* — because the failure notice is now in its context and the replay is simply the highest-probability continuation. Both of these look like the digger wasp in the story I grew up on: paralyse the cricket, leave it on the threshold, go in to inspect the burrow, come out, drag it in; and if someone moves the cricket a few inches while she is inside, take it back to the threshold, inspect again, and again, for as long as the experimenter cares to keep moving it.

  I want a specification before I read any further on this. Write the desiderata that any theory of sphexishness — of what it is for behaviour to be mechanically rigid rather than flexible — would have to meet, with the case or consideration behind each requirement, and say what the theory is meant to be good for. Mine is this: it has to be able to tell me whether the rigidity of my agents, the rigidity of my own checking, and the rigidity of the wasp are one phenomenon or three; whether any of the three is a defect in the thing that has it; and whether any of them bears on the free-will question rather than merely gesturing in its direction.

  The cases I want the list to earn its keep on: the wasp; a random-number generator and a thermostat with hysteresis, which vary behaviourally but are not flexible; a rigid controller that calls a stochastic search subroutine, so the whole system passes any variability test while no part of it ever "reconsiders" anything — *delegated flexibility*; a fixed action pattern with a temperature parameter bolted on, i.e. *flexibility-washing*, which I take to be what my own team's "add randomness and retry" patch actually is; a system that rigidly applies the rule "be flexible," such as an agent with a hard-coded reflex to spawn a planning sub-agent on every failure, or a manager's mandatory brainstorming ritual — *second-order sphexishness*; a concert pianist's cadenza and a pilot's pre-landing checklist, which are automatic and yet, unlike my checking, not obviously the worse for it; and my own ritual, where I know the check is pointless and can sometimes be talked out of a given instance but usually cannot stop the sequence once it has started.

  Distinctions I do not want collapsed: rigid versus invariable; rigidity of a behaviour versus of a mechanism versus of a system-in-an-environment; few options versus options not noticed; "could not have done otherwise" versus "would not have done otherwise under any intervention anyone could actually apply"; and the difference between having status, so to speak, and how much — here, between being rigid at all and being rigid to a blameworthy degree. Results I do not want contradicted: that fixed action patterns are species-typical, released by specific stimuli and, once released, run to completion; that a policy can be rigid in its parameters while producing high behavioural entropy; that compulsive checking is typically accompanied by intact knowledge that the check is unnecessary.

  For each requirement say whether it is non-negotiable or a preference of one camp, and mark the ones you suspect are mine rather than the subject's — I am an RL person and I may be smuggling in a prejudice. Name the pair of requirements you think is jointly unsatisfiable; my guess is that you cannot have a criterion that is assessable from outside a black box and one that a big enough lookup table or a well-placed randomness module cannot fake, and that you cannot have both "rigidity is a property of the mechanism, not the output" and "rigidity is what makes the behaviour defective." Tell me which single requirement excludes the most candidates. Then, briefly, score against the list: fixed-action-pattern accounts from ethology, reasons-responsiveness accounts of guidance control (Fischer and Ravizza's is the version I keep running into), Dennett-style stance or pattern treatments, and anything an RL person would reach for, such as effective planning horizon or breadth of search over policies.

  Attach a confidence to each verdict, and tell me where you are guessing. If some of my desiderata are less genuine requirements than artefacts of the cases I picked, say which. If "sphexishness" bundles several phenomena that ought to be pulled apart before any theory is asked to cover them, say so plainly rather than producing a list that presupposes they are one. And if the empirical footing of the wasp anecdote is shakier than the textbook version implies, say that too, and say how much of the list depends on it — I would rather be told the case is folklore than have it quietly load-bearing.

  Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restatement of what I have asked.
