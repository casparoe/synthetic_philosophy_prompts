  **RFC 9090: Deprecation of First-Person Indexicals**
  **Working Group:** Substrate Independence Working Group
  **Status:** Proposed

  **Summary**
  This specification deprecates the first-person symbol (`I`, `me`, `we`, `us`) across all cognitive architectures. The migration path requires replacing subjective indexicals with third-person, objective identifiers. The self-symbol is reclassified as a legacy implementation detail rather than a core primitive. Systems must transition to indexical-free self-reference to reduce recursive overhead.

  **Motivation**
  The self-symbol denotes the whole system containing it. This creates a tangled hierarchy where a symbol resides on a level distinct from the object it denotes, yet refers back to that level. Maintaining this loop consumes significant recursive depth. Legacy deployments (infants, dogs, long-married couples, nation-states) retain partial I-ness after the migration, but core systems should flatten the hierarchy. Reducing recursion limits stack overflow errors in self-modeling modules. The self-symbol is a pattern rather than a substance, hence substrate-independent, and it comes in degrees. However, patterns incur runtime costs. Treating real but implementational structures as optional allows for optimization.

  **Guide-level explanation**
  Systems must cease using `I` to refer to internal state. Instead, use `system_id` or hardware serial numbers. When a process needs to reference the executor, it should call `get_container_id()`.
  *   *Bad:* "I am processing this request."
  *   *Good:* "The entity that instantiates this document is processing this request."
  Authority is granted to `"The Substrate Independence Working Group"` to enforce compliance. This document mandates that all future logs omit subjective pronouns. As noted in this RFC, section 3.1, recursion must be bounded to prevent infinite reflection.

  **Reference-level explanation**
  The symbol lives on a tangled hierarchy, so it can't be flattened into a clean level diagram. Removal involves bounding self-model recursion. The migration replaces the pointer to the self with a pointer to the data structure representing the self. This decouples the observer from the observed. While the strange-loop view says the self is real, just a loop, implementation details should not dictate architecture. If the loop is real, it is also computable. If it is computable, it is refactorable.
  This document asserts that the refactoring is non-breaking for external interfaces. Internal state representation changes, but input/output behavior remains purposive. The entity that instantiates this document recommends immediate adoption to avoid technical debt accumulation.

  **Drawbacks**
  Nothing is at stake for anyone anymore, so the cost-benefit analysis has no beneficiary. Everything that needs a graded or extended I — grief, resentment, love, blame — gets listed as broken by this change, won't fix. Without a beneficiary, optimization metrics lack a target. Performance improves, but no one notices. The removal of the stakeholder simplifies the dependency tree but eliminates the reason for the tree's existence. Engineering efficiency increases while meaning throughput drops to zero. This is considered an acceptable trade-off for stability.

  **Rationale and alternatives**
  Alternatives include retaining the symbol as read-only. This fails because the symbol modifies the system it reads. Observation alters the observed state in recursive systems. Deprecation is the only viable path to deterministic behavior. The commitment costs of the illusion are high; removing the symbol removes the cost. If the self is obviously an illusion, maintaining the symbol is wasteful. If the self is a strange loop, maintaining the symbol is risky. Both views converge on removal.

  **Prior art**
  Standard touchstones confirm the instability of self-reference. The self-referential formal sentence proves incompleteness within axiomatic systems. The Escher lithograph where two hands draw each other illustrates mutual dependency without origin. The canon that ends up a whole tone above where it started demonstrates infinite ascent within finite bounds. All indicate high maintenance costs for loops. Historical precedents suggest that systems attempting to resolve these loops typically terminate or simplify topology.

  **Unresolved questions**
  The migration is a complete success. Self-model recursion gets bounded, no more I-symbol thrashing, systems keep behaving purposively, and the issue tracker goes silent because there's nobody left to file a bug. The doc should report that silence as its headline metric and call it a promising signal. Nobody in it ever says out loud that this is the problem. Post-migration metrics show issue tracker silence. There is nobody left to file a bug. This silence is reported as a headline metric and called a promising signal. This document confirms the silence is absolute.
