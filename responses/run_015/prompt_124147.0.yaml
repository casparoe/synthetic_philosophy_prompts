answer: |-
  This is a remarkably sharp observation, one that cuts to the heart of a tension in modern meta-ethics and philosophy of religion that is often glossed over. You have identified what might be called the **Problem of Genealogical Symmetry**. If the causal history of a belief class explains it entirely in terms of adaptive utility rather than truth-tracking, the epistemic status of that belief class is threatened.

  The fact that contemporary philosophy routinely accepts an evolutionary genealogy of morality while rejecting an evolutionary genealogy of religion (or vice versa, depending on the camp) suggests a fracture in how we apply Darwinian logic. To help you structure your essay, I will break this down into three layers: the textual evidence in *The Descent of Man*, the philosophical viability of the "rational revision" defense, and the sociological reality of disciplinary protectionism.

  ### 1. The Textual Disanalogy: Does Darwin Distinguish Them?

  Your first question is whether Darwin himself recognized a break between the genealogy of morals and the genealogy of religion. The answer is nuanced: Darwin treats both as natural phenomena, but he assigns them different *teleological potentials* within his framework.

  In *The Descent of Man* (specifically Chapter 4), Darwin outlines the steps of moral evolution:
  1.  **Social Instincts:** The foundational impulse to aid the group.
  2.  **Memory and Language:** Allowing for the persistence of past impressions and the articulation of public opinion.
  3.  **Habit:** Deepening the neural pathways of cooperative behavior.
  4.  **Reflection (The Crucial Step):** The capacity to compare past and future impulses and judge them.

  Darwin writes, *"The golden rule lies at the foundation of morality."* He suggests that through reason, humans can critique their own instincts. We can realize that our tribal loyalty is too narrow and extend sympathy to other races, the disabled, or even animals. For Darwin, moral evolution is not just a blind accumulation of adaptive traits; it contains a **self-correcting mechanism** driven by reason and sympathy.

  Contrast this with his treatment of religious belief (scattered through Chapter 3 on Mental Powers and Chapter 21). Darwin attributes religion to:
  1.  **Imagination and Curiosity:** Wondering about the origins of things.
  2.  **Fear:** Anxiety about the unknown.
  3.  **Agency Detection:** Attributing human-like traits to natural forces.

  While Darwin acknowledges that religious belief fosters group cohesion (a survival advantage), he rarely grants it the same *rational revisability* he grants morality. In Darwin's Victorian view, religious dogmas were often seen as static remnants of earlier developmental stages, whereas moral norms were seen as expanding and refining through civilization.

  **The Disanalogy:** In Darwin's framework, morality has an internal engine of **expansion** (the widening circle of sympathy via reason), whereas religion is depicted as having an internal engine of **projection** (attributing human psychology to the cosmos). Darwin implies that moral reasoning can *transcend* its evolutionary origins (e.g., caring for those who cannot reproduce), whereas religious reasoning tends to *reinforce* its evolutionary origins (tribal cohesion through shared dogma).

  **For your essay:** You can argue that Darwin *does* provide a seed for the asymmetry, but it relies on a contentious assumption: that moral reasoning is more capable of transcending its adaptive origins than religious reasoning is.

  ### 2. The Mechanism of "Rational Revision"

  This leads to the second layer: Is the capacity for rational revision a genuine epistemic savior for morality? This is where modern philosophers (like Sharon Street or Richard Joyce) clash with moral realists (like David Enoch or Erik Wielenberg).

  The standard defense for moral realism against debunking arguments is the **"Third-Factor" explanation** or the **"Tracking" account**. The argument goes: Natural selection favored cooperation; cooperation is objectively good (or necessary for flourishing); therefore, our moral instincts track objective moral truths.

  Why doesn't this work for religion? The counter-argument is that while cooperation is a tangible, worldly state of affairs, "God" is a metaphysical postulate. Evolution selects for the *belief* in God because it aids cohesion, not because God exists. There is no "third factor" linking the belief to the reality, because the reality (God) is not required for the benefit (cohesion) to occur.

  However, a skeptic could apply this same logic to morality. Evolution selects for the *belief* in "murder is wrong" because it aids cohesion. It does not require the existence of an objective "Wrongness" property for the cohesion to occur.

  **The Break Point:** The asymmetry holds only if one accepts that moral values are **immanent** (about human well-being and social relations) while religious values are **transcendent** (about supernatural entities).
  *   If morality is about *how we treat each other*, evolution tracks it because treating each other well *is* the survival strategy.
  *   If religion is about *what exists beyond us*, evolution does not track it because survival does not depend on the metaphysical truth of the claim, only the psychological commitment to it.

  **For your essay:** You should highlight that this distinction rests on a specific definition of morality. If one views morality as involving objective, non-natural prescriptive properties (robust realism), the debunking argument applies to morality just as fiercely as it does to religion. The asymmetry survives only if one adopts a **naturalistic moral realism** (moral truths are facts about human flourishing) while rejecting **naturalistic theology**.

  ### 3. The "Smuggling" of Objectivity and Victorian Progress

  This brings us to your most provocative point: Is the asymmetry a modern imposition, and does Darwin's account smuggle in the objectivity it claims to explain?

  There is strong evidence that Darwin's account of moral progress is not a neutral genealogy. When Darwin describes the "advance" of morality, he frequently equates it with the norms of "civilized nations" (specifically 19th-century Northern Europe). He assumes that the *direction* of evolutionary moral change is an *improvement*.

  *   **The Is-Ought Slide:** Darwin moves from "we evolved to feel sympathy" to "we ought to follow sympathy" to "following sympathy leads to moral progress." He treats the *outcome* of the evolutionary process as normatively authoritative.
  *   **The Religious Double Standard:** Darwin applies a stricter hermeneutic of suspicion to religion. He views religious rituals as often superstitious or wasteful, whereas moral rituals (self-sacrifice for the group) are viewed as noble. Yet, biologically, both are costly signaling mechanisms designed to ensure group fidelity.

  **The Implication:** If you apply Darwin's evolutionary account consistently, you arrive at one of two positions, neither of which supports the modern asymmetry:
  1.  **Global Debunking (Error Theory):** Both morality and religion are adaptive fictions. We should be moral anti-realists and atheists. (This is the position of Richard Joyce and Jon Haidt).
  2.  **Global Pragmatism:** Both morality and religion are "useful fictions" that facilitate human flourishing. Their truth value is secondary to their functional utility. (This is closer to William James or a Deweyan pragmatism).

  The modern philosophical tendency to accept (2) for morality and (1) for religion suggests **disciplinary protectionism**. Ethicists need norms to function; metaphysicians do not need gods. By framing moral evolution as "truth-tracking" and religious evolution as "illusion-generating," philosophers preserve the authority of ethics while satisfying the scientific demand for naturalism.

  ### 4. Structuring Your Argument

  For your essay, I suggest structuring the analysis around the **"Two Genealogies" Problem**:

  1.  **Introduction:** Pose the symmetry. Both morality and religion are explained by Darwin as adaptive social technologies.
  2.  **Darwin's Text:** Analyze *Descent of Man*. Show that Darwin *does* hint at an asymmetry via the "rational revision" clause (morality expands via reason; religion stagnates via dogma). Critique this as potentially Victorian bias rather than biological fact.
  3.  **The Modern Reception:** Detail how contemporary philosophy splits the difference. Explain the "Tracking" argument for morality vs. the "HADD" (Hyperactive Agency Detection Device) argument for religion.
  4.  **The Critique:** Argue that the "Tracking" argument fails if moral realism is robust (non-natural). If moral properties are real, how does selection track them? If they aren't, morality is as debunked as theology.
  5.  **Conclusion:** Suggest that the asymmetry is not found in the biology, but in our **normative needs**. We are willing to naturalize God because we can live without Him; we are unwilling to naturalize Goodness because we cannot live without it. Therefore, Darwin's account of morality is not a neutral explanation, but a **reconstruction** that preserves the authority of Victorian liberal values under the guise of natural science.

  ### Key References to Consider
  *   **Sharon Street, "A Darwinian Dilemma for Realist Theories of Value" (2006):** The definitive modern statement of the debunking argument.
  *   **Richard Joyce, *The Evolution of Morality* (2006):** Argues for moral fictionalism based on evolutionary genealogy.
  *   **Michael Ruse, *Taking Darwin Seriously*:** Argues that morality is an illusion "fobbed off on us by our genes," yet we must live as if it is real.
  *   **Timothy Jackson, "Darwin and the Divine":** Explores the theological implications of Darwin's asymmetry.
  *   **Darwin, *The Descent of Man*, Chapter 4:** Specifically the section on "How the Moral Sense is Acquired."

  ### Final Thought for the Essay
  Your intuition that Darwin "smuggles in the very objectivity it claims to explain" is historically astute. Darwin was not trying to undermine morality; he was trying to explain how "civilized" morality arose from "savage" instincts without losing its normative force. He needed morality to be both *natural* (to fit his system) and *objective* (to fit his culture). Religion, however, was easier to sacrifice to the naturalistic worldview. The modern philosophical asymmetry is simply the inheritance of Darwin's own cultural compromise.
