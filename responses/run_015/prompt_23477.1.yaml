answer: |-
  This is one of the most common "aha!" moments in game theory, and it is completely normal to feel stuck on it. The definitions look similar on paper, but the mathematical and conceptual implications are wildly different.

  Your professor calls it "the whole point" because this distinction separates **Rationalizability** (what a rational player *could* do) from **Nash Equilibrium refinement** (trying to guess which specific equilibrium will happen).

  Let's untangle your three points using concrete examples.

  ---

  ### 1. Why do we need Mixed Strategies to dominate?

  You suspected that there are strategies no single pure strategy beats, but a *combination* does. You are absolutely right. This happens because a mixed strategy allows you to "hedge your bets."

  **The Example:**
  Imagine you are Player 1. You have three strategies: **Top**, **Middle**, **Bottom**.
  Player 2 has two strategies: **Left**, **Right**.
  Here are Player 1's payoffs:

  | P1 \ P2 | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 3 | 0 |
  | **Middle** | 1 | 1 |
  | **Bottom** | 0 | 3 |

  **Question:** Is **Middle** strictly dominated?

  *   **Check Pure Strategies:**
      *   Does **Top** dominate **Middle**? No. Against *Right*, Top gives 0, Middle gives 1. ($0 \ngtr 1$).
      *   Does **Bottom** dominate **Middle**? No. Against *Left*, Bottom gives 0, Middle gives 1. ($0 \ngtr 1$).
      *   *Conclusion:* If you only look at pure strategies, **Middle** looks safe. It's not the best, but it's not "beaten" by any single alternative.

  *   **Check Mixed Strategies:**
      *   Consider a mix: Play **Top** with 50% probability and **Bottom** with 50% probability ($0.5T + 0.5B$).
      *   **Against Left:** Expected payoff = $0.5(3) + 0.5(0) = \mathbf{1.5}$.
          *   Is $1.5 > 1$ (Middle's payoff)? **Yes.**
      *   **Against Right:** Expected payoff = $0.5(0) + 0.5(3) = \mathbf{1.5}$.
          *   Is $1.5 > 1$ (Middle's payoff)? **Yes.**
      *   *Conclusion:* The mixed strategy strictly dominates **Middle**.

  **The Logic:**
  **Middle** is a "jack of all trades, master of none." It gets a mediocre payoff (1) regardless of what the opponent does. **Top** and **Bottom** are specialists. By mixing them, you get the specialist payoff half the time, averaging out to 1.5, which beats the mediocre 1 everywhere.

  If we didn't allow mixed strategies to count as dominators, we would have to keep **Middle** in the game. But a rational player would *never* play Middle, because they could just flip a coin between Top and Bottom and guarantee a higher payoff.

  ---

  ### 2. The "Never a Best Response" Equivalence

  This is the conceptual core. The theorem states:
  > A pure strategy is strictly dominated (by a mixed strategy) **if and only if** it is **Never a Best Response (NABR)** to any belief about the opponent.

  **Why is this the "Deep Fact"?**
  Game theory assumes players are **rational**. Rationality means: "Given what I think my opponent will do (my belief), I will choose the strategy that maximizes my expected payoff."

  *   **If a strategy is Strictly Dominated:** There is *always* something else that gives a higher payoff, no matter what the opponent does. Therefore, there is **no belief** you could hold that would make this strategy the optimal choice. It is irrational to play it.
  *   **If a strategy is Never a Best Response:** There is no scenario (no probability distribution over opponent's moves) where this strategy maximizes your utility. The theorem proves that if this is true, there *must* exist some mixed strategy that beats it everywhere.

  **Let's look at the example above again.**
  Suppose you hold a belief $p$ that Player 2 plays **Left** (and $1-p$ they play **Right**).
  *   Expected Payoff(**Top**) = $3p$
  *   Expected Payoff(**Bottom**) = $3(1-p)$
  *   Expected Payoff(**Middle**) = $1$

  Can **Middle** ever be the best?
  *   If $p > 0.5$: Top gives $> 1.5$. Middle gives 1. Top is better.
  *   If $p < 0.5$: Bottom gives $> 1.5$. Middle gives 1. Bottom is better.
  *   If $p = 0.5$: Top gives 1.5, Bottom gives 1.5. Middle gives 1. Top/Bottom are better.

  There is **no value of $p$** where Middle is the unique maximizer, or even tied for the maximizer. It is **Never a Best Response**.
  Because it is NABR, a rational player eliminates it. Because it is NABR, the theorem guarantees a mixed strategy dominates it.

  **Why this matters:**
  This equivalence justifies **Iterated Elimination of Strictly Dominated Strategies (IESDS)**.
  When we eliminate a strategy, we are saying: "A rational player would never play this."
  Because strict dominance $\iff$ NABR, we are never deleting a strategy that a rational player *might* play. We are only deleting things a rational player *must not* play. This makes the process "safe."

  ---

  ### 3. Order Independence vs. Order Dependence (The Danger of Weak Dominance)

  This is where the "safe" logic of strict dominance breaks down.

  **Strict Dominance (Safe):**
  If Strategy $A$ is strictly dominated by $B$, then $Payoff(B) > Payoff(A)$ in **all** cases.
  If we delete some *other* Strategy $C$ from the game, does $B$ still beat $A$? **Yes.** The inequality was strict ($>$), so removing rows/columns doesn't turn a $>$ into an $=$.
  *   **Result:** The order of elimination doesn't matter. The final set of surviving strategies is unique.
  *   **Nash Equilibrium:** A Nash Equilibrium consists of mutual **Best Responses**. Since a strictly dominated strategy is **Never a Best Response**, a strictly dominated strategy can **never** be part of a Nash Equilibrium. Eliminating them never destroys a Nash Equilibrium.

  **Weak Dominance (Dangerous):**
  Strategy $A$ is *weakly* dominated by $B$ if $Payoff(B) \ge Payoff(A)$ everywhere, and $>$ somewhere.
  Notice the $\ge$. This allows for **indifference**.
  *   **The Problem:** $A$ might be a Best Response in the specific case where the opponent plays a strategy that makes you indifferent between $A$ and $B$.
  *   **The Consequence:** $A$ *can* be part of a Nash Equilibrium. If you eliminate $A$ early, you might delete a Nash Equilibrium. Furthermore, eliminating $A$ might change whether $C$ is dominated by $D$, making the order matter.

  **Concrete Example of Order Dependence:**
  Consider this $2 \times 2$ game:

  | P1 \ P2 | Left | Right |
  | :--- | :---: | :---: |
  | **Up** | 1, 1 | 1, 0 |
  | **Down** | 1, 1 | 0, 0 |

  **Step 1: Check for Weak Dominance.**
  *   **For Player 1:** Compare **Up** vs **Down**.
      *   If P2 plays Left: Up (1) = Down (1).
      *   If P2 plays Right: Up (1) > Down (0).
      *   **Up weakly dominates Down.**
  *   **For Player 2:** Compare **Left** vs **Right**.
      *   If P1 plays Up: Left (1) > Right (0).
      *   If P1 plays Down: Left (1) > Right (0).
      *   **Left strictly dominates Right.**

  **Scenario A: Eliminate Player 1's Weakly Dominated Strategy First.**
  1.  Delete **Down** (weakly dominated by Up).
  2.  Game is now just **Up** vs {Left, Right}.
  3.  Player 2 compares Left (1) vs Right (0). Player 2 chooses **Left**.
  4.  **Surviving Outcome:** (Up, Left).

  **Scenario B: Eliminate Player 2's Strictly Dominated Strategy First.**
  1.  Delete **Right** (strictly dominated by Left).
  2.  Game is now {Up, Down} vs **Left**.
  3.  Player 1 compares Up (1) vs Down (1). Player 1 is **indifferent**.
  4.  Both **Up** and **Down** survive.
  5.  **Surviving Outcomes:** (Up, Left) AND (Down, Left).

  **What happened?**
  By eliminating the weakly dominated strategy **Down** in Scenario A, we deleted the Nash Equilibrium **(Down, Left)**.
  Is (Down, Left) a Nash Equilibrium?
  *   P1 plays Down. P2 plays Left.
  *   P2 gets 1. If P2 switches to Right, gets 0. (No incentive to switch).
  *   P1 gets 1. If P1 switches to Up, gets 1. (No incentive to switch).
  *   **Yes, it is a NE.**

  **Why did this happen?**
  **Down** was weakly dominated, but it was *still a Best Response* to Player 2's strategy **Left** (because $1=1$).
  In Strict Dominance, a strategy is *Never* a Best Response.
  In Weak Dominance, a strategy *Can* be a Best Response (in cases of ties).

  Because Weakly Dominated strategies can be part of a Nash Equilibrium, eliminating them is "unsafe." You are potentially throwing away valid equilibrium outcomes. Because eliminating one weakly dominated strategy can break the indifference that protected another strategy, the **order matters**.

  ### Summary: The "Whole Point"

  1.  **Mixed Strategies:** We allow them as dominators because rational players can randomize. A strategy that looks "okay" against pure opponents might be terrible against a rational opponent who mixes to exploit weaknesses. (Example 1).
  2.  **Never a Best Response:** This is the justification for elimination. Strict Dominance $\iff$ Never a Best Response. This means eliminating Strictly Dominated strategies is simply removing irrational choices. It doesn't change the set of rational outcomes. (Example 2).
  3.  **Order Independence:** Because Strictly Dominated strategies are *never* Best Responses, they are *never* part of a Nash Equilibrium. Removing them never kills a NE, and doesn't change the dominance relations of remaining strategies. Weakly Dominated strategies *can* be Best Responses (due to indifference), so removing them can kill NE and change the game structure depending on what you remove first. (Example 3).

  **The Takeaway:**
  *   **IESDS (Strict):** A tool to find the set of **Rationalizable Strategies**. It is robust, order-independent, and preserves all Nash Equilibria.
  *   **IEWDS (Weak):** A tool for **Equilibrium Refinement**. It attempts to select *specific* equilibria by assuming players won't play weakly dominated strategies even if they are indifferent. It is fragile, order-dependent, and can discard valid Nash Equilibria.

  Your professor emphasizes this because if you treat Weak Dominance like Strict Dominance, you will mathematically prove things that aren't true (like unique solutions where there are multiple, or discarding valid equilibria).
