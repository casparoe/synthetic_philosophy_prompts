      *   *Correction:* In Part 3, ensure the distinction between "killing a NE" and "order dependence" is clear. Order dependence implies we might end up with different sets of surviving strategies depending on the sequence. Killing a NE is the specific consequence of IEWDS that makes it dangerous.
      *   *Emphasis:* The prompt asks about the "Whole Point." The whole point is that **Strict Dominance + Mixed Strategies = Rationalizability**. It defines the set of strategies a rational player *could* play. Weak dominance muddies this because it relies on indifference.

