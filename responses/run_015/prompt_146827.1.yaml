  # Joint Statement on Origin Essentialism and Personal Identity
  **Collaborators:** Party A (Token-Gamete Origin Essentialist) and Party B (Trajectory-Class Origin Essentialist)

  ## Part I: Agreed Claims
  The undersigned parties affirm the following claims as a shared foundation for this dialectical engagement. These claims delineate the scope of the debate, the biological data involved, and the logical constraints on our respective theories.

  1.  **Formal Structure of Origin Arguments:** Both parties agree that origin essentialism is a modal thesis concerning necessary conditions for existence across possible worlds. It is not merely a claim about actual history, but a claim that in any possible world where a specific person $P$ exists, condition $C$ must be met at the initiation of $P$'s biological life. Both parties agree that such arguments establish de re necessity but do not, in themselves, explain the mechanism of persistence over time.
  2.  **Ambiguity of Modal Intuition:** Both parties agree that the pre-theoretical intuition—"I could not have been someone else"—tracks a real metaphysical constraint but is ambiguous regarding the *locus* of that constraint. The intuition confirms that identity is anchored in the past, but it does not self-evidently specify whether the anchor is the material constituent (the gametes) or the structural process (the developmental trajectory).
  3.  **Biological Facts of Initiation:** Both parties accept the standard biological model of human initiation: (a) fertilization involves the fusion of token sperm and egg; (b) zygotic genome activation (ZGA) occurs after a delay following fusion; and (c) early epigenetic marking occurs prior to implantation. Both parties agree these are physical events subject to stochastic variation and environmental influence.
  4.  **Limits of Psychological Continuity:** Both parties agree that standard psychological-continuity theories fail to solve the "branching problem" (e.g., fission cases). Consequently, both parties agree that psychological continuity alone is insufficient to rule out the possibility of distinct individuals sharing identical psychological histories. Therefore, an origin-based constraint is required to secure uniqueness, though the parties disagree on the nature of that constraint.

  ## Part II: Disagreements Table
  The following table isolates the specific metaphysical divergences between the parties. The wording in each column is formulated such that the respective party accepts it as an accurate expression of their view.

  | Issue | Party A's Formulation (Token-Gamete Essentialism) | Party B's Formulation (Trajectory-Class Essentialism) |
  | :--- | :--- | :--- |
  | **(i) The Proper Essential Origin** | The metaphysical ground of personal identity is the **token material cause**. In any world where I exist, I must originate from the very sperm and egg that actually fused to create me (or entities causally continuous with those specific tokens). | The metaphysical ground of personal identity is the **developmental trajectory class**. In any world where I exist, I must originate from a causal process instantiating the same genetic-environmental profile and continuous developmental path, regardless of the specific token gametes involved. |
  | **(ii) Epigenetic Contingency** | Epigenetic variations at the zygotic stage are **accidental properties** of the individual. As long as the causal chain originates from the correct token gametes, early epigenetic divergence does not alter personal identity, though it may alter phenotypic traits. | Epigenetic variations at the zygotic stage are **constitutive of the trajectory**. If early epigenetic marking diverges significantly, the developmental trajectory class is not instantiated, and therefore the resulting organism is not the same person, even if the token gametes were identical. |
  | **(iii) Counterfactual "Different Parents"** | The proposition "I could have been born of different parents (different gametes)" is **metaphysically impossible**. To suppose different gametes is to suppose a numerically distinct individual who merely resembles me. | The proposition "I could have been born of different parents (different gametes)" is **metaphysically possible**, provided the alternative gametes instantiate the requisite trajectory class. It is notional only if one assumes material essentialism by fiat. |

  ## Part III: Cruxes and Predictions
  The parties identify two specific sub-questions (cruxes) where empirical or thought-experimental evidence bears directly on the disagreement. Resolution of these cruxes would compel at least one party to revise their position.

  ### Crux 1: Epigenetic Divergence at Implantation
  **The Question:** Is an organism with identical nuclear DNA to me but divergent epigenetic markers at implantation the same person or a trajectory-branch?
  **Concrete Case:** Monozygotic twinning and artificial embryo splitting. In these cases, a single zygote (single token gamete origin) divides to form two distinct organisms.
  **Relevance:** This tests whether token origin is sufficient for identity (Party A) or whether trajectory divergence necessitates distinct identity (Party B).

  *   **Party A Prediction:** Splitting produces a **new individual with a shared origin but not shared identity**. Because the token gametes are the same, the origin is shared. However, because two distinct organisms exist, they are two persons. The token gamete is necessary but not sufficient for uniqueness; the causal path branches, but the origin remains the essential anchor for both.
  *   **Party B Prediction:** Divergence at splitting initiates a **new trajectory and therefore a new person**. The original trajectory is interrupted or bifurcated. Since identity tracks the specific continuous trajectory, the moment the developmental path splits, the original identity conditions are no longer met by either twin exclusively; rather, two new trajectory-instances begin.

  ### Crux 2: Synthetic Trajectory Replication
  **The Question:** Does a synthetically reconstructed developmental trajectory initiated by different gametes but matching the original profile preserve identity?
  **Concrete Case:** Synthetic gamete derivation and in vitro trajectory replication. Imagine technology allows the creation of synthetic gametes that do not share DNA with the original parents but are engineered to produce a zygote that undergoes the exact same epigenetic and cellular division sequence as the original person.
  **Relevance:** This tests whether material constitution is necessary (Party A) or whether functional/process isomorphism is sufficient (Party B).

  *   **Party A Prediction:** Reconstructed trajectories from different gametes **necessarily produce a different person**. No matter how closely the developmental process mimics the original, the absence of the specific token gametes (or their causal descendants) means the necessary condition for *my* existence is unmet. The result is a qualitative duplicate, not a numerical identity.
  *   **Party B Prediction:** Identity is **preserved if and only if the trajectory class is fully replicated**. If the synthetic gametes initiate a causal process that is indistinguishable in its structural and dynamic properties from the original trajectory, the same person has been instantiated. The material substrate is replaceable; the trajectory is essential.

  ## Part IV: Joint Assessment
  **Is the dispute verbal?**
  The parties agree that a portion of the dispute is verbal, specifically regarding the denotation of the term "origin."
  *   **Verbal Component:** When Party A uses "origin," they denote **material source** (the token gametes). When Party B uses "origin," they denote **causal-process source** (the trajectory class). If the debate were restricted to defining the word "origin," it would dissolve immediately upon stipulation.
  *   **Collapse Point:** Formulations collapse into verbal disagreement when the parties argue over whether "coming from different gametes" is *defined* as being a different person. Party A treats this as a conceptual truth; Party B treats it as a contingent metaphysical claim.

  **Residual Substantive Disagreement:**
  However, the parties affirm that a significant substantive disagreement remains after terminological clarification. The core substantive dispute concerns **the metaphysics of transworld identity**.
  *   **The Substance:** Is the necessity of personal identity grounded in the **particularity of matter** (Party A) or the **particularity of form/process** (Party B)?
  *   **Why it persists:** Even if we agree to use "Origin-M" for material source and "Origin-T" for trajectory source, the question remains: *Which of these relations grounds the necessity of "me"?* Party A claims that without Origin-M, psychological and physical continuity are insufficient for identity. Party B claims that without Origin-T, material continuity is insufficient for identity. This is a disagreement about the fundamental nature of substances and whether biological organisms are defined by their constituent parts or their developmental history. This cannot be resolved by semantics alone.
