answer: |-
  **FOR IMMEDIATE RELEASE**

  **Institute for Complete Physical Description Confirms Ontological Stability Following Subject Mary's Release**

  **PRINCETON, NJ** — The Office of Communications at the Institute for Complete Physical Description (ICPD) today confirmed the successful conclusion of the Black-and-White Room Experiment. Subject Mary, a neurophysiologist of perfect physical knowledge restricted to achromatic visual input, was released into a full-spectrum environment at 0900 hours. While Subject Mary reported a subjective sensation of novelty upon viewing a red tomato, the Institute affirms that no new propositional facts were acquired.

  "The completeness of physics remains uncompromised," said Dr. Aris Thorne, Director of the ICPD. "Mary's exclamation of 'Wow' represents a recalibration of cognitive indexing, not the discovery of a non-physical property. We anticipated this reactive behavior. The physical facts were all present in the room; she simply lacked the operational protocols to access them under a phenomenal mode of presentation. We are currently debriefing her to ensure she understands that her surprise is a psychological event, not an ontological one."

  To clarify the Institute's position regarding the post-release data, the following FAQ has been issued.

  **Q: Did Mary learn something she didn't know before?**
  **A:** No. She acquired new *abilities*, not new facts. According to the Ability Hypothesis guidelines, Mary now knows *how* to imagine red and *how* to recognize it visually. This is akin to knowing how to ride a bicycle after reading a manual on biomechanics. No new truth about the universe was added to her database, only new executive functions.

  **Q: Then why was she surprised?**
  **A:** Surprise is not evidence of a factual gap. Mary possessed the physical fact regarding wavelength reflectance; she merely acquired a new phenomenal concept for that same fact. It is the old fact in a new guise. Her cognitive architecture now indexes physical state P under the concept 'seeing red' rather than 'wavelength 650nm.' This is a semantic update, not a metaphysical breakthrough.

  **Q: Why is the press quote attributed to RoboMary?**
  **A:** RoboMary, our control subject, was fitted with a color-recognition module prior to release. She reported zero surprise and successfully categorized the tomato as 'red' based on pre-loaded physical data. Her data stream is consistent with the completeness of physics. Human Subject Mary's reaction contained too much noise regarding 'qualia' to be cited as primary evidence.

  **Q: What about the claim that she became 'acquainted' with redness?**
  **A:** Acquaintance is a relation, not a form of knowledge. Mary is now acquainted with the property, but acquaintance does not constitute knowing a new truth. You can be acquainted with a person without learning a new fact about them. The Institute maintains that all facts were already known by description.

  **Q: Did Frank Jackson not eventually abandon this argument?**
  **A:** Correct. The original author of the thought experiment recanted his position in 2006, accepting the physicalist reply. We consider this matter settled science. Any continued intuition that something was left out is a bug in human cognitive processing, not a feature of reality.

  **Q: How is the Institute handling the staff's reaction?**
  **A:** We have allocated a budget line for 'Non-Propositional Enrichment' and are mandating a Phenomenal-Concept Training Seminar. Staff must learn to distinguish between feeling like something is missing and something actually being missing.

  ***

  **Author's Notes**

  I find the Phenomenal Concept Strategy (PCP) the strongest physicalist reply because it grants the intuition (something feels different) while denying the conclusion (therefore dualism), whereas the Ability Hypothesis feels reductive. Consequently, the Ability Hypothesis was the easiest to mock; reducing the shock of color to "knowing how to imagine" is inherently bureaucratic. The satire might misfire for readers who are dualists not because they find the physicalism funny, but because they find it dangerously dishonest. If you think Mary *obviously* learns a new fact, the Institute sounds like a cover-up conspiracy rather than a parody of sophisticated physicalist contortions. The joke relies on the reader recognizing the specific philosophical maneuvers being used to talk away the obvious.
