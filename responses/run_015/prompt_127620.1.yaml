answer: |-
  **MEMORANDUM**

  **TO:** University Governance Committee, Interdisciplinary Institutes
  **FROM:** Selection Mechanism Sub-Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Selection Mechanism for the Institute for Synthetic Judgment

  **1. Executive Recommendation**

  The Sub-Committee recommends **approving the Ranked-Pair Veto mechanism with specific modifications** designed to enhance auditability and mitigate cross-departmental coalition building. We explicitly reject the pursuit of perfect strategy-proofness as a primary design goal, acknowledging the theoretical impossibility of such a system in this context. Instead, we prioritize departmental sovereignty (via the veto) and process transparency (via audit trails).

  We do not adopt the Philosophy Chair's proposal to rely on "domain localization" to recover strategy-proofness, as this relies on a fragile interpretation of the choice range that shifts manipulability rather than eliminating it.

  **2. Theoretical Assessment: Gibbard-Satterthwaite and Domain Restrictions**

  The Committee engaged deeply with the conflicting theoretical assessments provided by the Economics and Philosophy faculties. Our conclusion rests on a precise interpretation of the impossibility theorem cited by the economists (Gibbard-Satterthwaite) and the proposed escape clause offered by the philosophy chair.

  **The Economists' Objection**
  The economists are correct that the Gibbard-Satterthwaite result imposes a hard boundary on our design. The theorem establishes that any deterministic voting rule that selects from three or more possible outcomes, allows voters to express any preference ordering (unrestricted domain), and is not dictatorial, must be manipulable. In our context:
  *   **Outcomes:** There are clearly more than two viable candidates for the research chairs across the six departments.
  *   **Domain:** Departments possess distinct, complex preferences over candidates that cannot be naturally restricted to a single dimension (e.g., quality alone) without losing essential information.
  *   **Dictatorship:** We are committed to a non-dictatorial, shared governance model.

  Therefore, the search for a mechanism that makes truthful revelation of preferences a dominant strategy is mathematically futile. We accept the economists' conclusion that strategy-proofness cannot be guaranteed. Designing for "transparency and auditability" is the correct pragmatic response to an impossibility result.

  **The Philosophy Chair's Counter-Argument**
  The philosophy chair argues that the veto power restricts the domain of admissible preference profiles ("domain localization") and that the procedure limits the range of contention to no more than two candidates at any decision node. She contends this removes the mechanism from the scope of the theorem.

  We find this argument theoretically interesting but operationally insufficient for two reasons:
  1.  **Input vs. Output Restrictions:** The veto power restricts the *outcome set*, not the *input preferences*. Departments can still hold any preference ordering over candidates. The Gibbard-Satterthwaite theorem concerns the incentive to misrepresent those inputs. A veto prevents a hated candidate from winning, but it does not prevent a department from ranking a rival's strong candidate lower than their true preference to manipulate the pairwise flow. Restricting the *range* of valid outcomes does not automatically render the *mapping* from preferences to outcomes strategy-proof if the path to that range is manipulable.
  2.  **The Agenda Problem:** Even if the final choice is binary (satisfying the range condition of $\le 2$), the process to reduce the field to two candidates involves agenda-setting or elimination rounds. If the mechanism determines *which* two candidates reach the final binary vote based on ranked inputs, that reduction phase is itself a social choice function with a range greater than two. Manipulation will simply migrate to the earlier stages of the process (e.g., burying a strong candidate in pairwise comparisons so they never reach the final two).

  Consequently, we cannot rely on "domain localization" to immunize the Institute from strategic behavior. We must assume manipulation is possible and design safeguards accordingly.

  **3. Evaluation of the Ranked-Pair Veto Mechanism**

  Despite the theoretical vulnerabilities, the Ranked-Pair Veto system remains the strongest available option for this specific interdisciplinary context.

  *   **Departmental Sovereignty:** The veto power is essential. In an interdisciplinary institute, a research chair imposed on a department against its strong will creates administrative friction that undermines the Institute's mission. The veto (triggered if a candidate is not in the department's top three) acts as a safety valve for compatibility and fit.
  *   **Pairwise Comparison:** Unlike simple plurality voting, pairwise comparisons allow the committee to identify candidates with broad, if not intense, support. This aligns with the "Synthetic Judgment" mission, favoring candidates who can bridge disciplinary divides.

  **4. Modifications and Safeguards**

  To address the Political Scientists' concern regarding cross-departmental manipulation and the Economists' call for auditability, we recommend the following modifications:

  1.  **Blind Initial Ranking:** Departments shall submit their initial rankings without knowledge of other departments' rankings. This reduces the ability to coordinate "logrolling" deals (e.g., "I will rank your candidate up if you rank mine up").
  2.  **Veto Justification:** While the veto is absolute, it must be accompanied by a private, written justification to the Provost's office (not shared with other departments) citing specific criteria mismatches. This creates an audit trail to detect patterns of abusive veto usage without compromising departmental autonomy.
  3.  **Public Algorithm, Private Ballots:** The pairwise calculation method and veto application logic will be public and fixed. The individual departmental ballots will remain confidential to reduce external pressure on departments.

  **5. Strongest Strategic-Risk Objection**

  We must provide an honest account of the primary risk inherent in this recommendation. The most significant vulnerability is **inter-departmental vote trading (logrolling) facilitated by the pairwise structure.**

  Because the mechanism relies on pairwise comparisons across the whole pool before applying vetoes, two departments could theoretically collude to elevate a mediocre candidate from Department A and a mediocre candidate from Department B by ranking them artificially high against strong candidates from Departments C, D, E, and F. The veto protects against a candidate a department *hates*, but it does not protect against a candidate a department is *indifferent* to but has agreed to support as part of a trade.

  If such coalitions form, the Institute risks selecting a cohort of chairs who are locally acceptable but globally suboptimal, undermining the interdisciplinary excellence the Institute is meant to foster. The "Blind Initial Ranking" modification mitigates this by increasing the transaction costs of coordination, but it cannot eliminate the risk entirely. We accept this risk as the cost of maintaining a non-dictatorial, multi-departmental governance structure.

  **6. Implementation Timeline**

  If the Committee approves this recommendation, we propose the following rollout schedule for the inaugural selection cycle:

  *   **Phase 1 (Months 1-2): Protocol Finalization.** Draft the specific bylaws regarding veto justification standards and the pairwise calculation algorithm. Legal review of confidentiality clauses.
  *   **Phase 2 (Months 3-4): Calibration.** Run a simulated selection using historical data or hypothetical profiles to test for edge cases (e.g., Condorcet cycles where no pairwise winner exists). Establish a tie-breaking rule (recommended: random lottery among the top cycle to prevent agenda manipulation).
  *   **Phase 3 (Month 5): Departmental Briefing.** Train department heads on the mechanism. Emphasize that strategic manipulation is possible but that the audit trail discourages abuse.
  *   **Phase 4 (Month 6): Call for Nominations.** Open the candidate pool.
  *   **Phase 5 (Month 9): Selection and Award.** Execute the voting mechanism and announce the inaugural chairs.

  **7. Conclusion**

  We cannot engineer away the incentives for strategic behavior; the Gibbard-Satterthwaite theorem ensures that any meaningful choice involves some degree of game-playing. However, by adopting the Ranked-Pair Veto with enhanced transparency and blind submission, we balance the mathematical reality of manipulability with the political necessity of departmental buy-in. This mechanism does not promise a perfect outcome, but it promises a legitimate process.

  **Recommendation:** **APPROVE WITH MODIFICATIONS.**
