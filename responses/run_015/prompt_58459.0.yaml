answer: |-
  Here is the specification for a theory of composition (mereology) that balances everyday utility with scientific plausibility. This is designed to answer the *Special Composition Question*: *Under what conditions do some things compose a further thing?*

  ### The Desiderata (The Spec)

  **1. Ordinary Object Validation**
  *   **What:** The theory must entail that standard macroscopic objects (chairs, rocks, trees) exist as composite wholes.
  *   **Why:** If a theory says chairs don't exist (Nihilism), it fails the "everyday counting" test. If it requires magic to explain them, it fails the physicist test. It must align with basic perceptual and linguistic practices without ontological extravagance.

  **2. Functional Completion Constraint**
  *   **What:** The theory must distinguish between a functional unit and an incomplete assembly (e.g., a finished bookshelf vs. the half-assembled parts in the garage).
  *   **Why:** The garage parts have the same matter and contact relations as the finished shelf, but lack the structural stability or utility. A theory based solely on *contact* counts both as objects; a decent theory requires a threshold of structural integrity or intended function to count as a unified "artifact."

  **3. Cohesion vs. Contact Distinction**
  *   **What:** The theory must distinguish between parts merely touching (stacked coins) and parts bonded (glued coins).
  *   **Why:** Stacked coins move independently with slight force; glued coins move as a rigid unit. Physics treats them differently regarding friction and force transfer. A theory that counts "stacked" as a single object creates too many objects (every pile is a thing); a theory that requires chemical bonding captures the physical reality of *rigid body dynamics*.

  **4. Systemic Integration (The Transplant Test)**
  *   **What:** The theory must allow a part to change ownership of a whole based on causal integration, not origin (e.g., a transplanted heart beating in a new body).
  *   **Why:** Biology defines organisms by homeostatic systems, not historical origin. If the heart regulates the new body's blood flow, it is part of that whole. A theory based on *original assembly* fails biology; a theory based on *current causal role* succeeds.

  **5. Spatial/Temporal Continuity (The Plastic Test)**
  *   **What:** The theory must generally reject scattered objects as single wholes unless they act in concert (e.g., the Great Pacific Garbage Patch is not one object, but a fleet of ships is).
  *   **Why:** The plastic patches are spatially disconnected and causally independent (one piece moving doesn't move the rest). Counting them as "one thing" violates the physical intuition of locality. Wholes should generally be contiguous regions of spacetime unless a specific binding field (like gravity in a solar system) unifies them.

  **6. Substrate Independence (The Wave Test)**
  *   **What:** The theory must allow for wholes defined by pattern rather than specific matter (e.g., a wave persists even as water molecules pass through it).
  *   **Why:** Physics recognizes dynamic structures (solitons, vortices, organisms) where the *arrangement* is the object, not the specific atoms. A theory that requires *same matter* for identity cannot account for processes, living beings, or fluid dynamics.

  **7. Mereological Constancy (The Theseus Constraint)**
  *   **What:** The theory must allow a whole to survive the loss or gain of minor parts without ceasing to exist (e.g., a rock eroding, a human losing cells).
  *   **Why:** Strict identity (same parts = same object) means nothing survives a second. A usable theory requires a "tolerance threshold" where gradual replacement preserves identity, but total replacement does not.

  **8. Ontological Robustness**
  *   **What:** The theory must distinguish between things that exist mind-independently vs. things that are merely convenient to count (e.g., "the contents of my pocket" vs. "my wallet").
  *   **Why:** We need to know if we are describing reality or just speaking loosely. A biological organism exists regardless of whether we name it; a "heap" might just be a linguistic convenience. The theory must grade *degree of unity*, not just binary existence.

  ***

  ### Forbidden Collapses (Distinctions the Theory Cannot Blur)

  1.  **Existence vs. Convenience:** You cannot treat "the set of all red things" as ontologically equivalent to "a diamond." One is a conceptual class; the other is a causally unified physical object.
  2.  **Touching vs. Stuck vs. Integrated:** You cannot treat a pile of sand (touching), a sandstone rock (stuck/cemented), and a termite mound (integrated system) as the same *kind* of whole. They have different persistence conditions and physical properties.
  3.  **Aggregate vs. Organism vs. Pattern:** You cannot treat a pile of bricks, a house, and a flame as the same category. The bricks are an aggregate, the house is an artifact, the flame is a process. They fail in different ways (the house can be demolished, the flame goes out, the bricks scatter).

  ***

  ### Critical Flags

  **Non-Negotiable Requirements (Hard Constraints)**
  *   **Consistency with Physics:** No composition theory can violate conservation of mass/energy or imply action-at-a-distance without a mediator. (Knocks out Vitalism).
  *   **Consistency with Biology:** Organisms must be countable as wholes distinct from their environment. (Knocks out extreme Nihilism).
  *   **Logical Bivalence:** For any specific case, the theory should ideally be able to say "yes" or "no" (even if vague), otherwise it cannot be used for counting.

  **Prejudicial Requirements (Camp Biases)**
  *   **"Only Simples Exist":** This is Nihilist prejudice. It prioritizes fundamental physics over emergent reality.
  *   **"Any Parts Compose a Whole":** This is Universalist prejudice. It prioritizes logical simplicity over causal reality.
  *   **"Vagueness is Impossible":** This is a logical prejudice. Reality might be fuzzy; demanding precise cut-offs for "heap" vs. "non-heap" might be asking for something nature doesn't provide.

  **Incompatible Pair (The Tension)**
  *   **Precise Boundaries vs. Vague Reality.**
      *   *Conflict:* You want a theory that says exactly *when* a bookshelf is finished (Precise), but the physical world involves gradual curing of glue, settling of screws, etc. (Vague).
      *   *Result:* You likely cannot have a theory that is both perfectly precise in its conditions and perfectly accurate to the fuzzy nature of macroscopic objects. You must choose: accept "ontic vagueness" (reality is fuzzy) or "semantic vagueness" (our words are fuzzy, reality is precise).

  **The Killer Criterion**
  *   **The Causal Integration Constraint.**
      *   *What it says:* Parts compose a whole only if they participate in a shared causal network that constrains their behavior relative to each other more than to the background.
      *   *Why it kills the simple views:*
          *   **Kills Universalism:** Random parts (your nose and the Moon) do not share a causal network; therefore, they do not compose a whole.
          *   **Kills Nihilism:** Atoms in a chair *do* share strong electromagnetic bonds and move together; therefore, they compose a whole.
          *   **Kills Contact-Only Views:** Stacked coins touch but don't constrain each other's motion significantly; glued coins do. Contact alone is insufficient.

  ### Scoring Summary
  *   **Utility:** High (handles chairs, hearts, waves).
  *   **Scientific Fit:** High (respects causality and biology).
  *   **Logical Cost:** Medium (requires accepting some vagueness or causal gradience).
  *   **Verdict:** This spec demands a **Moderate Restrictivist** view grounded in **Causal Unity**. It is the only path that avoids counting every scattered atom as an object while admitting that chairs and people are real.
