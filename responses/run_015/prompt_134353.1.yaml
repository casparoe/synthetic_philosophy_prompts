answer: |-
  ### Spec Sheet: Conceivability-to-Possibility Link for P-Zombies

  **Core Function:** To validate or invalidate the inference: *If P-Zombies are ideally conceivable, they are metaphysically possible.*

  #### I. Case Handling Requirements
  A robust account must adjudicate the following scenarios without collapsing into contradiction or *ad hoc* rescue.

  1.  **Full Behavioral Duplicates (No Inner Life)**
      *   **Requirement:** Must explain how functional isomorphism is maintained while ontological substrate (qualia) is removed.
      *   **Hard Case Reason:** Risks violating causal closure. If qualia have no functional role, why do they exist? If they have a role, removing them alters behavior, negating the "duplicate" status.
  2.  **Partial Zombies (Missing Affect or Self-Consciousness)**
      *   **Requirement:** Must isolate specific phenomenal components (e.g., pain affect vs. pain discrimination) from functional output.
      *   **Hard Case Reason:** Affect often drives valuation and decision-making. A duplicate lacking fear-affect but retaining fear-avoidance behavior requires a complex explanation of "cold" cognitive processing replacing "hot" motivational states without behavioral leakage.
  3.  **Inverted-Spectrum Twins (No Behavioral Difference)**
      *   **Requirement:** Must allow qualitative variance (red vs. green experience) under identical functional relations (wavelength discrimination).
      *   **Hard Case Reason:** Structuralist accounts of consciousness argue qualitative character *is* functional role. The account must show how intrinsic quality floats free of relational structure.
  4.  **Cognitive Inaccessibility (Overflow Scenarios)**
      *   **Requirement:** Must determine if phenomenal states existing outside working memory/access count toward the "inner life" of a zombie.
      *   **Hard Case Reason:** If phenomenology can exist without access (overflow), a behavioral duplicate might possess inaccessible qualia. This undermines the *conceivability* of a total zombie, as we cannot verify the absence of inaccessible phenomenology through behavior or report.

  #### II. Mandatory Distinctions
  The theory must maintain separations between the following categories. Collapsing them renders the argument trivial or question-begging.

  1.  **Conceivable vs. Imaginable vs. Metaphysically Possible**
      *   **Reasoning:** *Imaginability* is psychological capacity (limited by cognitive bias). *Conceivability* is coherence under ideal rational reflection (no contradiction). *Metaphysical Possibility* is mind-independent modal reality.
      *   **Constraint:** The account cannot treat "I can picture it" as proof of "It can exist." It must bridge Ideal Conceivability to Possibility without relying on mere Imaginability.
  2.  **Epistemic Gap vs. Modal Gap**
      *   **Reasoning:** An *Epistemic Gap* means we cannot deduce Q (consciousness) from P (physical facts). A *Modal Gap* means P does not necessitate Q in reality.
      *   **Constraint:** Physicalists accept the Epistemic Gap but deny the Modal Gap. The account must explain why the former does or does not entail the latter. Collapsing them assumes the conclusion (either assuming dualism or assuming physicalism).

  #### III. Consistency Constraints (Neuroscience & Cognition)
  The account cannot contradict established empirical data without independent justification.

  1.  **Unconscious Processing:** Must accommodate data showing complex processing (priming, blindsight, habit learning) occurs without phenomenal awareness. It cannot claim *all* function requires consciousness.
  2.  **Neural Correlates (NCC):** Cannot posit consciousness as non-spatial or non-temporal if it strictly covaries with specific spatiotemporal neural firing patterns.
  3.  **Causal Efficacy:** Cannot claim consciousness is causally inert (epiphenomenalism) if evolutionary biology suggests cognitive systems are selected for adaptive responsiveness which appears tied to valence/affect.

  #### IV. Conflict Analysis

  **Jointly Unsatisfiable Desiderata:**
  1.  **The Kripkean Constraint:** The account must accommodate *a posteriori* necessities (e.g., Water = H2O) where identity is necessary but conceivably false (Water & ~H2O is conceivable but impossible).
  2.  **The Zombie Inference Constraint:** The account must validate that *P & ~Q* (Physical facts & No Consciousness) being ideally conceivable entails it is metaphysically possible.

  *   **Conflict:** If you satisfy (1), you admit conceivability can fail to track possibility due to hidden identities. This opens the door for Physicalists to argue *Consciousness = Physical State* is an *a posteriori* necessity, making Zombies conceivable but impossible (like Water & ~H2O). If you satisfy (2), you must argue phenomenal concepts differ fundamentally from natural kind concepts, which risks violating (1)'s uniform modal logic.

  **Most Damaging Desideratum to Rivals:**
  *   **The Ideal Conceivability Entailment:** The requirement that *ideal* conceivability strictly entails metaphysical possibility.
      *   **Damage:** This does the most damage to **Type-A Physicalism**, which must argue that P-Zombies are *not* ideally conceivable (there is a hidden contradiction). It forces Physicalists into the uncomfortable position of claiming we cannot coherently conceive of our own lack of consciousness.

  #### V. Theory Performance Summary

  *   **Physicalism:** Fails the **Zombie Inference Constraint**. Must argue the Epistemic Gap does not imply a Modal Gap, treating zombies as conceivable but impossible (like Water/~H2O). Struggles to explain why the gap exists without admitting dualism.
  *   **Property Dualism:** Satisfies the **Zombie Inference Constraint** and **Modal Gap**. Struggles with **Causal Efficacy** and **Neuroscience Constraints**, often forced into epiphenomenalism to avoid violating causal closure.
  *   **Epistemic-Gap-Only:** Satisfies **Neuroscience Constraints** and **Distinctions**. Fails to deliver a metaphysical conclusion. Accepts we can't deduce consciousness from physics but denies this proves non-physical ontology. Leaves the modal status of zombies agnostic.
