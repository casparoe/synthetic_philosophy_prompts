  6.  **Finalizing the Advice:**
      *   **Bet:** Grant Amnesty. (Truth Commissions need the archives more than they need to punish the clerks).
      *   **Rule:** "Full Disclosure" means disclosing all *accessible* information regarding one's own contribution and chain of command, not solving the entire crime. "Political Objective" covers bureaucratic acts within a political conflict, even if lethal consequences are foreseen, distinguishing them from private vendettas (Guard).
