  # Joint Statement of Agreed Claims and Disagreements

  ### I. Agreed Claims on the Empirical Record

  1.  **Infrastructure Development:** The British administration constructed a railway network exceeding 40,000 miles by 1947, primarily designed for military logistics and raw material transport, which subsequently integrated domestic markets despite high freight rates.
  2.  **Legal-Institutional Framework:** A unified legal code (Indian Penal Code) and bureaucratic structure (Indian Civil Service) were implanted, establishing a centralized state framework that operated with documented racial hierarchies in personnel appointment and judicial sentencing.
  3.  **Famine-Response Mechanisms:** Formal Famine Codes were instituted in the 1880s; however, relief expenditures were fiscally constrained by balanced-budget mandates, and mortality rates remained significant during late 19th-century climatic shocks and the 1943 Bengal famine.
  4.  **Resource Transfer:** A consistent net transfer of financial resources from India to Britain occurred via trade surpluses and "Home Charges," contributing to British capital formation while correlating with a decline in India's share of global GDP from approximately 23% in 1700 to 4% in 1947.
  5.  **Post-1947 State Capacity:** The independent Indian state inherited the colonial bureaucratic and military apparatus, utilizing it to maintain territorial integrity while pursuing industrialization from a low per-capita income base and limited heavy-industry capacity.

  ### II. Conceptual Cruxes and Disagreements

  | Crux & Residual Disagreement | Shared Case or Evidentiary Standard | Fergusonian Prediction | Tharoorian Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Counterfactual Autonomy Problem**<br><br>*Disagreement:* Whether evaluating the Empire requires comparing outcomes to an epistemically unstable baseline of independent development.<br><br>*Ferguson-style:* The baseline should be fragmented pre-colonial polities prone to conflict and stagnation; Empire provided necessary consolidation.<br>*Tharoor-style:* The baseline should be a coherent independent nation-state capable of organic modernization without external drain; Empire disrupted indigenous trajectory. | **Comparative State-Capacity Metrics:** Analysis of tax collection efficiency, internal order, and infrastructure growth post-1947 in regions of former Direct Rule (British India) versus regions of former Indirect Rule (Princely States). | Regions formerly under Direct Rule will demonstrate significantly higher state capacity and institutional durability than Princely States, validating the consolidating function of colonial administration. | Regions formerly under Princely States will demonstrate comparable or superior human development metrics when adjusted for resource drain, validating the viability of independent indigenous governance. |
  | **2. The Moral Desert Asymmetry**<br><br>*Disagreement:* Whether present beneficiaries of inherited colonial infrastructure bear compensatory obligations to descendants of those from whom resources were extracted.<br><br>*Ferguson-style:* Present utility outweighs historical guilt; obligations diminish over time and are not inherited by unrelated generations.<br>*Tharoor-style:* Structural advantage persists; unjust enrichment creates an enduring obligation regardless of temporal distance or lineage. | **Coherence Test of Benefit Disclaimer:** A hypothetical scenario testing whether an agent can logically accept the use of inherited infrastructure (e.g., railways, legal system) while simultaneously disclaiming the debt associated with its extractive construction. | The disclaimer is coherent; infrastructure functions as a public good separable from its historical funding sources; usage does not imply moral consent to origin. | The disclaimer is incoherent; infrastructure is structurally entangled with the extraction process; usage implies participation in the enduring benefits of unjust enrichment. |
  | **3. Institutional Instrumentality vs. Durability**<br><br>*Disagreement:* Whether institutional durability can serve as moral justification and whether extraction nullifies legacy benefits.<br><br>*Ferguson-style:* Durability indicates functional success and net benefit; institutions built for extraction can incidentally serve development.<br>*Tharoor-style:* Durability indicates entrenched extraction; institutions built for extraction cannot be morally severed from their intent. | **Fiscal Allocation Ratios:** Examination of the ratio of infrastructure investment to welfare relief spending during peak colonial extraction years (1870–1900). | High infrastructure investment relative to welfare indicates a rational priority on long-term state-building and security, which indirectly benefits the populace. | High infrastructure investment relative to welfare indicates a priority on resource extraction and military control over human welfare, nullifying incidental benefits. |
