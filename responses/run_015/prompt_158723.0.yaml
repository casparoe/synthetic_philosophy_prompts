prompt: |-
  I'm a PhD student in philosophy finishing up in experimental epistemology, and in three weeks I'm taking over one 75-minute session of our upper-division Knowledge and Justification course: 19 students, mixed majors, a room with a whiteboard and index cards and nothing else. I've been asked to do the session on cross-cultural variation in epistemic intuitions, and I want the students to run into the problem rather than hear about it.

  What has failed before: I've watched this taught by putting a slide of bar charts on the screen and comparing verdict distributions across populations. It collapses every time into a methodological squabble about whether the survey questions were any good, with a good part of the room concluding that the subjects must have misread the vignette. I don't want that. And I don't want to put the six or seven students in the room who learned English later, or who grew up outside the United States, on display as specimens: no asking anyone to speak for a culture, no "and what would people back home say?" moves.

  Two things I'd like the design to carry, if you think they can be made to work in the time available.

  First: what does the philosophical damage, I think, is not the first-order split but the second-order surprise. Each of us tacitly predicts that a competent, attentive person will land where we land, and predicts it with real confidence; that prediction is what licenses us to treat disagreement as a mistake rather than as a difference to be explained. So I want the activity to record that prediction before anyone sees the actual distribution, and to let the gap between predicted and actual distribution be the datum the room discovers for itself. Call it the projection failure, and build the scoring so that it is visible on the board and not merely reported.

  Second: I'd like a causal handle, not just a correlation. My idea is to manufacture micro-cultures in the room: split the class by a genuinely random procedure, give each half a few minutes of different training in how to read a certain kind of case — I was thinking of instructing one half to read vignettes the way a lawyer reads a statute and the other the way a friend reads a text message — and then run the cases blind. If a habit acquired in five minutes shifts verdicts, the students can watch cultural transmission act on themselves instead of hearing about it in a stranger. Tell me honestly whether that device is a bad idea and why; if you keep it, tell me how long the training has to be, how to keep it from being transparent, and what it is a model of and what it merely looks like a model of.

  Cases: write your own, three or four, not the famous ones from the literature. I don't want the session to become a seminar on one well-known paper, and I don't want anyone guessing where this is going. They should be short enough to read twice, and they should be the sort of case where a "does she know" or "is he referring to" verdict plausibly moves with interpretive habit.

  What participants should come away seeing: that an intuition arrives wearing two credentials — it feels like a detection of how things are, and it feels like a verdict any careful person would share — and that cross-cultural variation strips the second credential while leaving the first untouched, which is why "the subjects must have misread the question" is not an answer to it.

  Also needed: a debrief mapping specific moments in the activity onto specific parts of the dispute, including the difference between verdicts varying and what that variation would warrant methodologically; an honest list of what will go wrong the first time, including what I should do if the room does not split, which with nineteen people it may well not; and a way of handling the student who says, correctly, that a roomful of undergraduates trained for five minutes tells us nothing about real cultural difference. Be frank about which feature of the real debate the activity cannot produce and that I will have to supply in my own voice.

  Skip the literature: no citations, no study names invoked as authorities, no numbers from published data. I have that material; what I need is the design.

  Give me the session plan first, then a single JSON object with this schema:

  - session_title: string
  - target_move: one sentence stating what participants discover for themselves, not what I tell them
  - timeline: array of objects with keys minutes, phase_name, what_participants_do, what_facilitator_does, discovery_baked_into_the_rules
  - scoring_scheme: object with keys first_order_measure, second_order_measure, how_the_gap_is_displayed, threshold_for_a_usable_split
  - failure_modes: array of objects with keys what_happens, why, handling
  - debrief_map: array of objects with keys moment_in_activity, what_participants_felt, maps_onto, facilitator_line
  - cannot_reproduce: array of objects with keys feature_of_the_debate, why_the_activity_cannot_generate_it, what_i_must_supply
  - safeguards: array of short strings on running this without making any student a representative of a culture
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy (experimental epistemology).
      *   **Task:** Design a 75-minute session for an upper-division "Knowledge and Justification" course (19 students, mixed majors).
      *   **Topic:** Cross-cultural variation in epistemic intuitions.
      *   **Constraints:**
          *   No slides/bar charts (failed before).
          *   No putting non-native/International students on display (ethical constraint).
          *   No citing specific literature/studies (skip the literature).
          *   Room resources: Whiteboard, index cards, nothing else.
          *   Goal: Students run into the problem themselves (experiential learning).
          *   Key Feature 1: Record *predictions* before seeing actual distribution (Projection Failure).
          *   Key Feature 2: Manufacture "micro-cultures" via random split + brief training (Causal Handle).
          *   Cases: Original, short, plausible movement based on interpretive habit.
          *   Output Format: Session plan first, then a specific JSON object.
          *   Tone: Frank, honest about limitations, practical.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Problem:* Students usually dismiss experimental philosophy (X-Phi) data by claiming subjects misread the vignette or aren't competent.
      *   *The Fix:* Make *them* the subjects, but also make *them* the predictors. Show them that even among competent peers (themselves), intuition varies based on subtle framing/training.
      *   *The Micro-Culture Idea:* Split the room randomly. Give Group A one interpretive lens (e.g., "Strict/Literal"), Group B another (e.g., "Pragmatic/Contextual"). Run cases. Compare results.
      *   *Risk:* If the split doesn't happen (statistical noise with N=19), the lesson fails. Need a contingency.
      *   *Risk:* Students realizing the training is the cause and dismissing it as "artificial" vs. "real culture." Need to address this in debrief.
      *   *Ethical Risk:* Avoiding essentialism or tokenizing international students. The "micro-culture" must be arbitrary and assigned, not based on background.

  3.  **Drafting the Session Plan:**
      *   *Time:* 75 minutes.
      *   *Structure:*
          1.  Intro & Prediction (15 mins)
          2.  Micro-Culture Training (10 mins)
          3.  Case Judgment (15 mins)
          4.  Data Collection & Reveal (15 mins)
          5.  Debrief & Discussion (20 mins)
      *   *Cases:* Need 3-4 original vignettes. They need to be ambiguous enough that interpretive stance matters.
          *   *Case 1 (Knowledge):* High stakes vs. low stakes ambiguity.
          *   *Case 2 (Reference):* Descriptive vs. causal hint.
          *   *Case 3 (Justification):* Internalist vs. Externalist cue.
          *   *Let's refine:* Keep them very short. Focus on "Does S know?" or "Is S justified?"
          *   *Idea:* "The Bank Case" variant (too famous). "The Gödel Case" variant (too famous).
          *   *New Idea 1:* "The Map." Someone uses a reliable map that happens to be outdated but leads them right by luck. (Gettier-ish).
          *   *New Idea 2:* "The Testimony." Someone tells the truth but usually lies. (Trust vs. Reliability).
          *   *New Idea 3:* "The Procedure." Someone follows a rule strictly vs. spirit of the rule.
          *   *Training:* Group A = "Code Bound" (Literal, rule-following). Group B = "Intent Bound" (Context, spirit).
      *   *Prediction:* Before training? Or after training but before seeing others?
          *   *Requirement:* "Record that prediction before anyone sees the actual distribution."
          *   *Better:* Ask them to predict what *most people* will say *before* they answer themselves. This captures the "false consensus effect."
          *   *Refinement:* Step 1: Read Case 1 (Neutral). Predict class vote. Step 2: Training. Step 3: Read Cases 2-4. Vote. Step 4: Reveal.
          *   *Actually, the prompt wants:* "Record that prediction before anyone sees the actual distribution... let the gap between predicted and actual distribution be the datum."
          *   *Okay:* Have them predict the *overall class* verdict on the cases *before* they answer. Then answer. Then reveal.
          *   *Micro-culture:* Split them *before* they answer, but *after* the prediction? If they predict before training, they predict based on their native intuition. If they answer after training, the training shifts them. The gap shows the training effect + the prediction error.
          *   *Wait, the prompt says:* "Split the class by a genuinely random procedure, give each half a few minutes of different training... and then run the cases blind."
          *   *Okay:*
              1.  Intro.
              2.  Prediction Phase (Everyone predicts what the "average competent person" would say on Case 1).
              3.  Split & Train (Group A vs Group B).
              4.  Judgment Phase (Everyone answers Case 1, 2, 3).
              5.  Reveal & Score.
      *   *Scoring:* Need to visualize the "Projection Failure."
          *   Board: Two columns (Group A, Group B).
          *   Rows: Cases.
          *   Mark: Predicted % vs Actual % for each group.
      *   *Contingency:* If the split isn't significant (e.g., 50/50 instead of 80/20), acknowledge it. The *prediction error* is still the main point. The micro-culture is the secondary point.
      *   *Wait, N=19 is small.* 9 vs 10. A 10% shift is 1 person. This is risky.
          *   *Mitigation:* Use index cards. Collect them all. Tally live.
          *   *Training:* Needs to be strong. "Rule of Law" vs "Equity." "Literal" vs "Pragmatic."
          *   *Cases:* Need to be sensitive to this.
          *   *Honesty:* I must tell the user this is risky with N=19. The JSON needs to reflect this failure mode.

  4.  **Developing the Cases:**
      *   Need cases where "Literal/Rule" vs "Context/Intent" shifts the knowledge/justification verdict.
      *   *Case 1 (The Clock):* Clock stopped 12 hours ago. Looks right. Subject checks it.
          *   Literal: No knowledge (false belief process).
          *   Context: Knowledge (reasonable reliance).
      *   *Case 2 (The Recipe):* Chef follows recipe exactly but ingredient batch was weird. Dish turns out perfect.
          *   Literal: Justified (followed procedure).
          *   Context: Lucky (didn't understand why).
      *   *Case 3 (The Witness):* Witness says "He wore red." Witness is usually reliable but was dark. He wore red.
          *   Literal: Testimony counts.
          *   Context: Conditions undermines testimony.
      *   *Let's make them tighter.*
      *   *Case 1:* "The Schedule." Train leaves at 5. Site says 5. Train left at 4:55 today due to glitch. Agent arrives at 5, sees empty track, believes train left. (True belief, bad evidence).
          *   Rule: Not Knowledge (evidence false).
          *   Context: Knowledge (reasonable expectation).
      *   *Case 2:* "The Diagnosis." Doctor follows protocol. Patient has rare symptom not in protocol. Diagnosis correct by luck.
          *   Rule: Justified (followed protocol).
          *   Context: Not Justified (missed cue).
      *   *Case 3:* "The Promise." "I'll be there by 5." Arrives 5:01. Traffic was unprecedented.
          *   Rule: Broke promise (False).
          *   Context: Kept promise (Intent met).
          *   *Wait, epistemic focus:* Stick to Knowledge/Justification.
          *   *Case 3:* "The Map." GPS says turn left. Road closed. Driver turns left anyway because "GPS knows best." Crash avoided because road reopened 5 mins prior.
          *   Rule: Justified (trusted reliable source).
          *   Context: Unjustified (ignored visible signs).

  5.  **Refining the Micro-Culture Training:**
      *   Group A: "Proceduralists." Focus on adherence to standard methods, rules, and explicit evidence. (Model: Bureaucrat/Scientist).
      *   Group B: "Pragmatists." Focus on outcomes, context, reasonable expectations, and intent. (Model:Judge/Friend).
      *   *Time:* 5-7 minutes.
      *   *Transparency:* Don't tell them this is about culture. Tell them it's about "Interpretive Frameworks for Case Analysis."
      *   *Model:* It models *socialization* into a interpretive community, not deep culture.
      *   *Limitation:* It doesn't model deep cultural values, just framing effects.

  6.  **Addressing the Constraints & Risks:**
      *   *N=19:* Statistical noise is high. If the split is 9 vs 10 and votes are 5/4 vs 6/4, is that significant? No.
      *   *Handling:* The lesson must survive a null result on the split. The *Prediction Failure* is the robust finding. Even if Group A = Group B, if both differed from their predictions, the lesson holds (intuitions are not universal). If Group A != Group B, even better (framing matters).
      *   *Student Objection:* "This isn't real culture."
      *   *Response:* Agree. It's a model of *mechanism*, not content. Real culture is deeper, but the mechanism (training -> intuition shift) is the point.
      *   *Safeguards:* Random assignment (draw cards). No asking about background. Emphasize *assigned* role, not *native* trait.

  7.  **Drafting the JSON:**
      *   Need to ensure all keys are present.
      *   `session_title`: Needs to be catchy but accurate.
      *   `target_move`: The core discovery.
      *   `timeline`: Breakdown by minutes.
      *   `scoring_scheme`: How to show the gap.
      *   `failure_modes`: What if the split fails? What if they guess the trick?
      *   `debrief_map`: Connecting activity to theory.
      *   `cannot_reproduce`: What the activity misses (depth, stakes, identity).
      *   `safeguards`: Ethical handling.

  8.  **Review against "Projection Failure" requirement:**
      *   "Record that prediction before anyone sees the actual distribution."
      *   Plan: Before reading cases, ask: "What % of competent people will say 'Knows'?" Write on card.
      *   Then do the activity.
      *   Then reveal actual %.
      *   Display: Predicted % vs Actual % on whiteboard.
      *   This highlights the "False Consensus Effect."

  9.  **Review against "Micro-Culture" requirement:**
      *   Split randomly.
      *   Training: 5 mins.
      *   Cases: 3 cases.
      *   Display: Group A % vs Group B %.
      *   This highlights "Framing Effects."

  10. **Final Polish:**
      *   Ensure tone is appropriate for a PhD student (colleague-to-colleague).
      *   Ensure JSON is valid.
      *   Check word count/depth.
      *   Make sure the "Cannot Reproduce" section is honest about the limits of simulation.

  11. **Self-Correction on Cases:**
      *   Make sure they aren't too obvious.
      *   Make sure the training actually applies.
      *   Training A: "Strict Construction." Only count what is explicitly stated. Assume errors are fatal.
      *   Training B: "Reasonable Reliance." Count what a reasonable person would assume. Assume minor errors are negligible.
      *   Case 1: The Bank (Modified). Sign says open. It's a holiday. Person believes open.
          *   Strict: Not Justified (Sign wrong).
          *   Reasonable: Justified (Sign usually right).
      *   Case 2: The Thermometer. Reads 70. Room is 70. Thermometer broken but stuck on 70.
          *   Strict: Not Knowledge (Process broken).
          *   Reasonable: Knowledge (Belief true & reasonable).
      *   Case 3: The Witness. Says "Blue car." Car was Blue. Witness is colorblind but guessed.
          *   Strict: Not Knowledge (Luck).
          *   Reasonable: Knowledge (Testimony accepted).
      *   *Wait, Case 3 is too Gettier.* Let's stick to the "Procedure vs Outcome" framing.
      *   Let's refine the training to be about *Epistemic Priority*.
      *   Group A: "Process Priority." Was the method reliable?
      *   Group B: "Outcome Priority." Was the belief useful/true in context?
      *   Actually, let's go with "Literal Evidence" vs "Contextual Trust."
      *   Okay, I will write the cases into the plan clearly.

  12. **Final Check on JSON Schema:**
      *   Keys: `session_title`, `target_move`, `timeline`, `scoring_scheme`, `failure_modes`, `debrief_map`, `cannot_reproduce`, `safeguards`.
      *   `timeline` array objects: `minutes`, `phase_name`, `what_participants_do`, `what_facilitator_does`, `discovery_baked_into_the_rules`.
      *   `scoring_scheme` object: `first_order_measure`, `second_order_measure`, `how_the_gap_is_displayed`, `threshold_for_a_usable_split`.
      *   `failure_modes` array objects: `what_happens`, `why`, `handling`.
      *   `debrief_map` array objects: `moment_in_activity`, `what_participants_felt`, `maps_onto`, `facilitator_line`.
      *   `cannot_reproduce` array objects: `feature_of_the_debate`, `why_the_activity_cannot_generate_it`, `what_i_must_supply`.
      *   `safeguards` array of strings.

  13. **Writing the Content:**
      *   Be precise on the "Prediction" phase. They must predict *before* they form their own verdict? Or predict *others* before seeing *others*?
      *   Prompt: "record that prediction before anyone sees the actual distribution."
      *   Best: Predict the class distribution *before* answering. This isolates the "False Consensus" from the "Answer."
      *   Then answer.
      *   Then reveal.
      *   This creates two gaps: 1. Prediction vs Reality (Projection Failure). 2. Group A vs Group B (Causal Handle).

      *   *Wait, one nuance:* If they predict before training, they predict based on native intuition. If they answer after training, they answer based on training.
      *   This maximizes the Prediction Gap.
      *   Okay, let's lock that in.

      *   *Time Management:* 75 mins is tight.
      *   0-10: Intro & Prediction.
      *   10-20: Split & Training.
      *   20-35: Cases (Reading + Voting).
      *   35-50: Tally & Reveal (The Drama).
      *   50-75: Debrief.
      *   This works.

      *   *Failure Mode:* N=19 is very small for splitting. 9 vs 10. If 6/9 vs 7/10, no significant split.
      *   *Handling:* Focus on the Prediction Gap primarily. The Split is secondary evidence. If Split fails, Prediction Gap still proves intuitions aren't universal (because they didn't predict the variance).
      *   *Actually:* If everyone predicts 90% Agree, and actual is 50% Agree, the Projection Failure is proven regardless of Group split. The Group split just adds the "Why" (framing).
      *   *Okay:* I will emphasize the Prediction Gap as the primary win condition. The Split is the bonus.

      *   *Wait, prompt says:* "If a habit acquired in five minutes shifts verdicts, the students can watch cultural transmission act on themselves... Tell me honestly whether that device is a bad idea and why."
      *   *My honest take:* It's risky with N=19. It might look like noise. But it's pedagogically valuable *if* framed as a model, not a proof. I will include this honesty in the "Cannot Reproduce" and "Failure Modes."

      *   *Safeguards:* Random assignment is key. No linking to identity.

      *   *Debrief:* Must connect to "Competence" vs "Universality."

      *   *Let's write.*
answer: |-
  # Session Plan: The Projection Gap

  **Course:** Knowledge and Justification (Upper-Division)
  **Time:** 75 Minutes
  **Participants:** 19 Students
  **Resources:** Whiteboard, Markers, Index Cards (3 per student), Pens, A Hat/Bowl for drawing lots.

  ## I. Preparation (Before Class)
  1.  **Index Cards:** Prepare 19 sets of 3 cards. On the back of one card in each set, mark "A" or "B" (10 A, 9 B). This is the random assignment.
  2.  **Whiteboard:** Draw two large tables but cover them with paper or leave blank until the reveal.
      *   Table 1: "Class Prediction vs. Actual Verdict"
      *   Table 2: "Group A vs. Group B Verdicts"
  3.  **Vignettes:** Print three short cases (see below) on a handout or have them ready to write on the board quickly. (Writing on board saves paper but eats time; handout recommended if budget allows, otherwise board is fine).
  4.  **Training Scripts:** Two distinct paragraphs (see Phase 2).

  ## II. The Cases (Original)
  *Keep these on the board or handout. Read aloud once.*

  1.  **The Stopped Clock:** Alice walks into the train station. The large clock on the wall says 2:00 PM. She forms the belief it is 2:00 PM. It is indeed 2:00 PM. Unknown to Alice, the clock broke exactly 24 hours ago and stopped at 2:00 PM.
      *   *Verdict:* Does Alice **know** the time? (Yes/No)
  2.  **The Protocol:** Dr. Chen diagnoses a patient with Condition X based strictly on the official medical guideline checklist. The patient has Condition X. However, the patient presented one rare symptom not on the checklist that would have ruled out X for an expert, but Chen missed it. The diagnosis was correct by luck.
      *   *Verdict:* Was Chen **justified** in the diagnosis? (Yes/No)
  3.  **The Witness:** A jury hears a witness testify, "The car was blue." The car was blue. The witness is known to be generally honest but was standing 100 meters away in the fog.
      *   *Verdict:* Does the jury **know** the car was blue based on this testimony? (Yes/No)

  ## III. The Session Flow

  ### Phase 1: The Prediction (00:00 – 00:15)
  *   **Action:** Hand out one blank index card to each student.
  *   **Instruction:** "I am going to describe a scenario. I do not want your answer. I want your **prediction** about your peers. Assuming everyone in this room is competent, attentive, and speaking English fluently: What percentage of this class will say 'Yes' to the knowledge/justification question? Write a number 0-100 on the card."
  *   **Facilitator:** Read **Case 1 (The Stopped Clock)** only. Do not discuss. Collect cards immediately.
  *   **Goal:** Capture the *False Consensus Effect* before any manipulation.

  ### Phase 2: The Micro-Culture Split (00:15 – 00:25)
  *   **Action:** Hand out the remaining 2 cards per student. Instruct them to look at the back of the *first* card only.
  *   **Split:** "If you have an 'A', sit on the left. If 'B', sit on the right." (Roughly 10 vs 9).
  *   **Training (5 Minutes):** Hand out a slip or write on board specific to their side.
      *   **Group A (Proceduralists):** "When evaluating knowledge/justification, prioritize **Reliability of Process**. If the method used to form the belief is flawed or lucky, the knowledge claim fails, even if the belief is true. Focus on the *mechanism*."
      *   **Group B (Pragmatists):** "When evaluating knowledge/justification, prioritize **Reasonable Reliance**. If a normal person would trust the evidence in this context, the knowledge claim holds, even if there are hidden flaws. Focus on the *context*."
  *   **Facilitator:** "Take 3 minutes to discuss within your group how this lens applies to general cases. Do not share your lens with the other group."

  ### Phase 3: The Judgment (00:25 – 00:40)
  *   **Action:** Distribute/Display all three cases (Clock, Protocol, Witness).
  *   **Instruction:** "Using the lens you were given, vote Yes or No on each case. Write Case # and Verdict on your second card. Do not talk."
  *   **Facilitator:** Collect cards separately by group. Keep results hidden.
  *   **Goal:** Generate data influenced by the "trained habit."

  ### Phase 4: The Reveal (00:40 – 00:55)
  *   **Action:** Tally live on the whiteboard.
  *   **Display 1 (Projection):** Calculate the average of the *Prediction* cards from Phase 1. Write "Predicted Consensus: __%". Then write the *Actual* % of "Yes" votes for Case 1 from Phase 3.
  *   **Display 2 (Split):** Write % "Yes" for Group A vs Group B for all three cases.
  *   **Facilitator:** Say nothing until both tables are full. Let the silence hang for 30 seconds.
  *   **Goal:** Visualize the gap between expected universality and actual variation.

  ### Phase 5: The Debrief (00:55 – 01:15)
  *   **Discussion:** Move from the data to the methodological implication.
  *   **Key Questions:**
      1.  "Who predicted a split this large?" (Usually no hands).
      2.  "Did anyone feel their verdict was 'obvious'?" (Yes).
      3.  "If obvious, why did half the room miss it?"
      4.  "What does this imply about using 'what we would say' as evidence for what everyone would say?"
  *   **Closing:** Connect to the "Competence vs. Universality" distinction.

  ---

