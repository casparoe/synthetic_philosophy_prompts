answer: |-
  **Session Plan: The Function of 'I'**
  **Duration:** 90 Minutes
  **Resources:** Whiteboard (two columns), markers, cushions.
  **Audience:** Experienced meditators, secular context, slogan-fatigued.

  ### 1. Pedagogical Order & Pre-requisites

  Do not begin with the Five Aggregates. To a student who treats *anatta* as a slogan, the aggregates are merely a new list of things to attach to. Do not begin with linguistic analysis; it is too abstract for a 90-minute practical session.

  **The Correct Order:**
  1.  **The Job Description:** Establish what the word 'I' is *claimed* to do (control, own, persist) before asking if it exists.
  2.  **The Case Study:** Test that claim against immediate experience.
  3.  **The Negation:** Define precisely what is being denied (ownership, not function).
  4.  **The Implications:** Address the misconceptions that arise from the negation.

  **What must be in place before the claim is stated:**
  You must distinguish between **Functional Emergence** and **Ontological Ownership**.
  *   *Functional Emergence:* Things happen, processes work (e.g., digestion, health, speech).
  *   *Ontological Ownership:* A claim that there is a static entity *behind* the process possessing it (e.g., "I am healthy", "I am speaking").
  *   *Why:* This pre-empts the physiotherapist's objection. Health is a functional state of the organism; it does not claim to *own* the organism. The 'Self' is the claim of ownership. You are denying the owner, not the functioning.

  ---

  ### 2. The Central Example: "The Flash of Anger"

  **The Case:** A sudden, sharp irritation arising in conversation (e.g., being interrupted or criticised), resulting in a snapped retort before thought intervenes.

  **Why this example:**
  1.  **It is dynamic:** Unlike the chariot or river, it is an event, not an object. It mirrors the reactive nature of the mind.
  2.  **It bypasses the "Search" move:** You are not asking them to "look for the self" (which invites the health objection). You are asking them to time the *arrival* of the "I".
  3.  **It absorbs the Physio objection:** The body's reaction (adrenaline, tension) is real (like health). The *claim* ("How dare they do this to *me*") is the addition.
  4.  **It handles the "Bundle" objection:** The anger is a bundle of sensation, narrative, and impulse. If the bundle were simply "real", the suffering would be manageable. The suffering arises from the *identification* with the bundle.

  **Why the others are worse:**
  *   *The Chariot:* Too static. Implies the self is a collection of parts rather than a process of clinging.
  *   *The River/Flame:* Too focused on continuity over time. Students will cling to the "flow" as a subtle self.
  *   *The Driver behind the eyes:* Reinforces dualism (someone looking out).
  *   *The "Look and Find" instruction:* As you noted, this fails against emergent properties like health.

  ---

  ### 3. Session Sequence

  #### Part 1: The Job Description (15 Minutes)
  *   **Activity:** Whiteboard discussion. Ask the group: "If the self were real, what job would it have to do?"
  *   **Expected Answers:** Control, decision-making, ownership, continuity.
  *   **Teacher's Move:** Write these on the left side of the board under "The Claim".
  *   **Crucial Distinction:** Explicitly state: "We are not asking if the body exists, or if health exists. We are asking if there is a *Manager* separate from the work."
  *   **Pre-empting the Physio:** If 'health' comes up, categorise it immediately as a *state of the system*, not a *manager of the system*. The teaching denies the Manager, not the System.

  #### Part 2: The Investigation – The Flash of Anger (35 Minutes)
  *   **Setup:** Guide a short reflection (5 mins). Ask them to recall a recent moment of sudden irritation. Do not analyse it yet; just re-inhabit the timeline.
  *   **Dissection (Whiteboard Right Side):** Break the event down chronologically.
      1.  **Stimulus:** The interruption/insult.
      2.  **Sensation:** Heat, tightness, adrenaline (The Body).
      3.  **Impulse:** The urge to speak/snarl (The Volition).
      4.  **Action:** The words spoken (The Behaviour).
      5.  **Narrative:** "I was disrespected" (The Story).
  *   **The Pivot Question:** "At which exact millisecond did the 'I' arrive to take credit for the anger?"
  *   **The Insight:** The 'I' usually arrives *after* the sensation and impulse, to claim ownership of the reaction. The reaction happened; the 'Owner' was a retrospective addition.
  *   **Handling the "Bundle" Objection:** A student will say, "But the bundle of sensation and impulse is real."
      *   *Response:* "The bundle is real as a *process*. But is the bundle a *solid thing*? No. It arises and passes. If the bundle is empty of permanence, and the 'I' is just a label on the bundle, what is left to hold onto?" (This denies the bundle is a 'real thing' in the substantial sense).

  #### Part 3: Misconceptions & Ethics (25 Minutes)
  *Address these in the order they naturally arise from the Anger example.*

  1.  **The Witness ("Someone must see the anger"):**
      *   *When:* During the Dissection.
      *   *Handling:* "Is the 'witness' a separate eye, or just another thought saying 'I am aware'?" Treat the witness as part of the bundle, not outside it.
  2.  **Neuroscience ("It's just a confabulating brain"):**
      *   *When:* Immediately after the Witness point.
      *   *Handling:* Acknowledge it, then pivot. "Neuroscience describes the *mechanism*. Dharma addresses the *suffering*. Knowing the brake pedal is metal doesn't stop the car skidding. We are here to stop the skid, not just describe the metal." (Prevents the subject change from soteriology to mechanism).
  3.  **Nihilism ("Nothing matters"):**
      *   *When:* Discussing the lack of owner.
      *   *Handling:* "Pain still hurts. Causality still functions." Use the Anger example: "If you snap in anger, the relationship is damaged, regardless of who did it."
  4.  **Future Care ("Why save for my pension?"):**
      *   *When:* Discussing Causality.
      *   *Handling:* "The *process* continues." You care for the future process because suffering will arise in it. It is compassion for the continuum, not prudence for an owner.
  5.  **Continuity ("What carries on?"):**
      *   *When:* The natural conclusion of Future Care.
      *   *Handling:* "Habit Energy (Vasana)." Do not open rebirth. Say: "Momentum carries on. Like a ball rolling after the hand stops pushing. The momentum is real; the 'pusher' is not needed for the roll to continue."

  #### Part 4: Closing (15 Minutes)

  **The Diagnostic Question:**
  Do not ask "Do you understand?" Ask:
  *"In the week ahead, when irritation arises, can you catch the gap between the sensation and the claim of 'mine'?"*
  *   *Why:* This tests practical application, not intellectual assent. If they say "Yes, I will try to stop the anger," they haven't got it. If they say "I will watch the ownership arise," it has landed.

  **Explicit Declinations:**
  State clearly what you are *not* settling today. This builds trust and boundaries.
  1.  **Metaphysics of Rebirth:** "We are not addressing what happens at death today. We are addressing what happens in this ninety minutes."
  2.  **Ultimate Ontology:** "I am not claiming nothing exists. I am claiming that the *way* we think things exist (as owned, separate selves) is the source of suffering. Whether the universe is fundamentally mental or physical is a question for another term."

  ---

  ### 4. Teacher's Notes on Flow

  *   **Whiteboard Management:** Keep "The Claim" (Left) and "The Experience" (Right) distinct. Visually demonstrate that the Experience column works fine without the Claim column.
  *   **The Physio Objection:** If raised, validate it warmly. "You are quite right: health is real." Then point to the board. "Health is in the Right Column (Experience/Function). The Self is in the Left Column (Claim/Owner). We are discarding the Left, not the Right."
  *   **Pacing:** If the Anger example takes hold, let it run long. It is better to skip the Neuroscience objection than to rush the investigation of the Anger.
  *   **Tone:** Maintain a "Let's look together" stance. Avoid preaching the conclusion. Let the timeline of the Anger example reveal the conclusion itself.

  ### 5. Summary of Constraints Met

  *   **Order:** Function -> Example -> Negation -> Implications.
  *   **Example:** Flash of Anger (avoids "search and destroy", handles "health" via Function vs. Owner).
  *   **Misconceptions:** Integrated into the flow of the example analysis.
  *   **Rebirth:** Sidestepped via "Habit Energy/Momentum".
  *   **Bundle Objection:** Handled by defining the bundle as empty process, not solid "real" thing.
  *   **Closing:** Diagnostic question focuses on the *gap*, not the *result*. Declinations protect the session scope.
  *   **Language:** British English (e.g., "programme", "centre", "analyse").
