answer: |-
  The *Nix v. Hedden* decision fundamentally undermines Gongsun Long's essentialist logic by demonstrating that institutional names function as pragmatic tools rather than ontological mirrors, severing the necessary connection between *ming* (name) and inherent *shi* (reality).

  Gongsun Long's "White Horse Not Horse" (*Bai Ma Fei Ma*) argument rests on a precise distinction between the universal, the attribute, and the compound particular. In the Mingjia framework, "Horse" (*Ma*) denotes the universal form or essence, while "White" (*Bai*) denotes a specific attribute. The compound "White Horse" (*Bai Ma*) is a particular designation that combines form and color. Gongsun argues that because the extension of "White Horse" is narrower than "Horse"—one can ask for a horse and receive a yellow one, but not if one asks for a white horse—the concepts are not identical. The logical structure insists that adding a qualifier changes the ontological reference; the name must correspond strictly to the reality of the object's attributes.

  In *Nix v. Hedden*, the Supreme Court maps these concepts differently, prioritizing social utility over inherent form. Here, the "Tomato" is the particular object (*Shi*). The competing universals are "Fruit" (defined botanically by seed-bearing structure) and "Vegetable" (defined culinarily by usage in meals). The Court constructs a compound legal name, "Tariff Vegetable," which functions as the governing universal for the case. Unlike Gongsun, who would argue that the botanical form dictates the true name (if it is structurally a fruit, its *Ming* must be Fruit), the Court rules that the culinary usage overrides the botanical essence. The Court treats "Vegetable" not as a universal excluding "Fruit" based on logical differentiation of attributes, but as a pragmatic designation that supersedes the botanical universal entirely within the legal context.

  This reveals a hidden ontology in legal classification where *Ming* is decoupled from physical *Shi*. For the Mingjia, the rectification of names requires aligning language with objective reality; for the Court, language aligns with commercial convention. The analogy breaks down because Gongsun's distinction is logical and inherent (color modifies form), whereas the Court's distinction is contextual and imposed (usage modifies classification). Gongsun assumes attributes are fixed properties of the object; the Court assumes categories are fluid functions of human practice. Consequently, applying the School of Names to institutional taxonomy highlights the limits of classical logic in regulating social constructs: the Mingjia seeks truth in correspondence, while law seeks stability in consensus.

  My assessment would shift to support Gongsun Long's view if the Court had explicitly reasoned that botanical structure dictates legal identity regardless of usage, claiming that "Fruit" is the true *Ming* and "Vegetable" a mere colloquialism without legal force. Such a ruling would align with Gongsun's insistence that names must track inherent form rather than social convention, thereby validating the Mingjia claim that ontological precision must govern classification.
