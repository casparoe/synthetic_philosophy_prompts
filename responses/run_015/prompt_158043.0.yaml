  You are a philosopher of language and comparative philosophy with expertise in classical Chinese logic. Think carefully before answering, and begin by sketching the core logical structure of Gongsun Long's white-horse-is-not-horse argument and the Mingjia distinction between universal and particular.

  Analyze the 1893 U.S. Supreme Court tariff decision that classified tomatoes as vegetables despite their botanical status as fruits through the lens of the School of Names, especially the white horse dialogue. Focus on whether the Court's reasoning treats vegetable as a universal category that excludes fruit analogously to how horse excludes white horse, or whether it instead shows that legal names are purely pragmatic designations with no ontological commitment to shared properties. In both directions: what does the Mingjia framework reveal about the hidden ontology of legal classification, and what does the Court's pragmatic, usage-based reasoning show about the limits of applying the School of Names to institutional taxonomy? Be disciplined about the mapping—identify which parties or concepts correspond to the universal, the particular, and the compound name, and say where the analogy breaks down.

  Say explicitly what argument or historical detail would change your assessment of whether this case supports or undermines Gongsun Long's view. Write in American English. Lead with your bottom line in the very first sentence, then provide reasoning, with no preamble and no restatement of the question.
