answer: |-
  Your skepticism is well-founded. The statement "MDL is just practical Kolmogorov/Solomonoff" is a **motivating analogy**, not a rigorous equivalence. While they share a common philosophical root (Occam's Razor formalized via information theory), they diverge significantly in their mathematical guarantees, scope, and operational definitions.

  As a software engineer, you can think of Solomonoff Induction as the **theoretical API specification** for optimal prediction, while MDL is a **specific implementation** of that API constrained by runtime limits and available libraries.

  Here is a detailed, technically precise comparison.

  ---

  ### 1. Formal Definitions

  To compare them rigorously, we must align their notation.

  #### Solomonoff Induction
  Solomonoff Induction is a framework for sequence prediction. Let $x = x_1 x_2 \dots x_n$ be a binary string.
  Let $U$ be a fixed, prefix-free Universal Turing Machine (UTM).
  The **Solomonoff Prior** (or Universal Distribution) $M(x)$ is defined as:
  $$ M(x) = \sum_{p: U(p) = x*} 2^{-|p|} $$
  Where:
  *   $p$ is a binary program.
  *   $|p|$ is the length of the program in bits.
  *   $U(p) = x*$ means the output of $U$ on input $p$ starts with $x$.
  *   The sum is over all programs that produce $x$ (and potentially continue).

  Prediction is made via conditional probability: $P(x_{n+1} | x_{1:n}) = \frac{M(x_{1:n} x_{n+1})}{M(x_{1:n})}$.

  #### Minimum Description Length (MDL)
  MDL is a model selection principle. Let $\mathcal{D}$ be the data and $\mathcal{H}$ be a hypothesis (model) from a model class $\mathcal{M}$.
  The **MDL Criterion** selects the hypothesis $\hat{H}$ that minimizes:
  $$ \hat{H} = \arg\min_{H \in \mathcal{M}} \left[ L(H) + L(\mathcal{D} | H) \right] $$
  Where:
  *   $L(H)$ is the code length required to describe the model (complexity penalty).
  *   $L(\mathcal{D} | H)$ is the code length required to describe the data given the model (loss/negative log-likelihood).
  *   Crucially, the minimization is restricted to a pre-specified set $\mathcal{M}$.

  ---

  ### 2. Core Alignment and Divergence

  **Where they agree:** Both frameworks map probability to code length via the Kraft inequality ($P \approx 2^{-L}$). Both assert that regularities in data allow for compression, and finding the shortest description is equivalent to finding the best explanation.

  **Where they diverge:** Solomonoff sums over **all** computable hypotheses (programs). MDL minimizes over a **restricted subset** of hypotheses (the model class).

  Now, let's address your three specific points.

  ---

  ### 3. Point 1: Choice of Universal Machine ($U$) vs. Choice of Coding Language

  **The Claim:** "The choice of $U$ in Solomonoff is the same as the choice of prior/code in MDL."

  **The Reality:** They are fundamentally different problems regarding **invariance**.

  #### Solomonoff: Asymptotic Invariance
  In Kolmogorov complexity and Solomonoff induction, the **Invariance Theorem** states that for any two UTMs $U_1$ and $U_2$, there exists a constant $c$ (depending only on $U_1, U_2$, not on $x$) such that:
  $$ |K_{U_1}(x) - K_{U_2}(x)| \le c $$
  Consequently, $M_{U_1}(x)$ and $M_{U_2}(x)$ differ only by a multiplicative constant.
  *   **Implication:** As the amount of data $n \to \infty$, the influence of the choice of $U$ washes out. The "best" program will eventually be long enough that the constant overhead of the interpreter becomes negligible.
  *   **The Catch:** This is an *asymptotic* guarantee. For finite data (the only kind engineers deal with), the constant $c$ matters immensely. If $U_1$ has a built-in primitive for "images" and $U_2$ does not, $U_1$ will vastly outperform $U_2$ on image data until the data size exceeds the complexity of simulating $U_1$'s primitives on $U_2$.

  #### MDL: Structural Bias
  In MDL, the choice of "coding language" is usually a choice of **Model Class** (e.g., "Linear Models," "Neural Networks," "Decision Trees").
  *   **No Invariance:** If the true data-generating process is a Decision Tree, and you choose the Linear Model class for your MDL optimization, no amount of data will allow you to recover the truth. You will converge to the best *linear approximation*, not the true generator.
  *   **The Difference:** In Solomonoff, the choice of $U$ affects the *speed* of convergence (the constant factor). In MDL, the choice of Model Class affects the *limit* of convergence (the bias).

  **Verdict:** This is a **conceptual divergence**. Solomonoff's choice of $U$ is a coordinate transformation on the space of *all* computable functions. MDL's choice of model class is a projection onto a *subspace*. The former changes the metric; the latter restricts the domain.

  ---

  ### 4. Point 2: Uncomputability vs. Computability

  **The Claim:** "MDL is just computable Solomonoff."

  **The Reality:** Making it computable requires sacrificing the "Universal" guarantee.

  #### Solomonoff: The Halting Problem
  $M(x)$ is uncomputable because to calculate the sum $\sum 2^{-|p|}$, you must know which programs $p$ halt. This requires solving the Halting Problem.
  *   **Conceptual Status:** Solomonoff induction is a **limit concept**. It defines what optimal induction *would* look like if compute were infinite and the halting problem were solvable. It serves as a gold standard (a "regret bound") rather than an algorithm.

  #### MDL: Constrained Optimization
  MDL is computable because we restrict the sum to a finite (or tractable) set of models $\mathcal{M}$ and we define specific, computable encodings $L(H)$.
  *   **What is Lost:** By restricting the search to computable models within a budget, we lose the guarantee that the true generator is in the search space.
  *   **Concrete Loss:** In Solomonoff, if the data is generated by a computable process, prediction error converges to zero rapidly. In MDL, if the data is generated by a process outside $\mathcal{M}$, prediction error converges to the **KL-divergence between the truth and the closest model in $\mathcal{M}$**. This is non-zero.

  **Verdict:** This is a **conceptual difference**, not just practical. It changes the objective from **Truth Recovery** (Solomonoff) to **Risk Minimization within a Constraint** (MDL). MDL admits it might be wrong; Solomonoff guarantees it will eventually be right (if the world is computable).

  ---

  ### 5. Point 3: Universality and Dominance

  **The Claim:** "Solomonoff is universal; does MDL have an analogous property?"

  **The Reality:** MDL lacks the dominance property, which relegates it from a theory of induction to a heuristic for inference.

  #### Solomonoff Dominance
  The Solomonoff prior $M$ **dominates** all computable semimeasures $\mu$. There exists a constant $c_\mu > 0$ such that for all strings $x$:
  $$ M(x) \ge c_\mu \cdot \mu(x) $$
  *   **Meaning:** $M$ assigns non-negligible probability to anything that *any* computable theory assigns probability to.
  *   **Consequence:** If the true environment is computable, Bayesian updating with prior $M$ guarantees convergence to the true distribution.

  #### MDL "Universality"
  MDL does **not** have this property.
  *   If you choose a Gaussian model class for MDL, and the data is actually Poisson, your $L(\mathcal{D}|H)$ will never accurately reflect the true likelihood, regardless of how much data you collect.
  *   Some variants of MDL (like "Universal Codes" in information theory) attempt to approximate this by mixing over a class of models, but they are only universal *with respect to that class*, not universal over all computable measures.

  **Verdict:** This defines their status.
  *   **Solomonoff:** A theory of **Epistemology** (how to learn truth).
  *   **MDL:** A theory of **Engineering** (how to generalize well given constraints).

  ---

  ### 6. Concrete Example: Where They Diverge

  Let's construct a scenario where Solomonoff and MDL pick different models and make different predictions.

  **The Setup:**
  *   **Data:** A binary sequence generated by a specific, small Turing Machine $T_{true}$ that outputs the digits of $\pi$ in binary.
  *   **Solomonoff Agent:** Has access to the Universal Prior $M$.
  *   **MDL Agent:** Restricted to a model class $\mathcal{M}$ consisting of **Order-$k$ Markov Chains**.

  **The Process:**
  1.  **Solomonoff:** As $n$ increases, $M$ assigns higher weight to programs that generate $\pi$. Even though $\pi$ looks random locally, there exists a short program $p_\pi$ that generates it. Eventually, $2^{-|p_\pi|}$ dominates the sum.
      *   *Prediction:* Perfect prediction of the next bit once $p_\pi$ is identified.
  2.  **MDL:** The MDL agent searches for the best Markov Chain.
      *   $L(H)$: Cost to store transition probabilities.
      *   $L(D|H)$: Cost to encode data using those probabilities.
      *   Since $\pi$ is normal (statistically random), no finite-order Markov Chain can compress it significantly better than random noise.
      *   *Optimization:* MDL will select a low-order Markov chain (to minimize $L(H)$) because increasing the order increases model cost without reducing data encoding cost (since the data looks random to a Markov model).
      *   *Prediction:* The MDL agent predicts the next bit is 0 or 1 with probability $\approx 0.5$.

  **The Divergence:**
  *   **Solomonoff** identifies the computational structure.
  *   **MDL** fails to identify the structure because the structure is not representable in the chosen model class (Markov Chains cannot capture the algorithmic complexity of $\pi$).

  **Why the shorthand fails here:**
  If you say "MDL is practical Solomonoff," you imply MDL is trying to do the same thing but slower. In this case, MDL is **not even trying to do the same thing**. It is trying to find statistical regularities (frequencies), whereas Solomonoff is looking for algorithmic regularities (programs).

  ---

  ### 7. Summary Comparison Table

  | Feature | Solomonoff Induction | Minimum Description Length (MDL) |
  | :--- | :--- | :--- |
  | **Hypothesis Space** | All computable functions (Turing Machines). | Restricted model class (e.g., Regressions, NNs). |
  | **Prior** | Fixed: $2^{-|p|}$ (Universal Prior). | Flexible: Chosen by engineer (often implicit). |
  | **Computability** | Uncomputable (Halting Problem). | Computable (by design). |
  | **Invariance** | Asymptotic (Choice of $U$ adds constant overhead). | None (Choice of model class adds structural bias). |
  | **Convergence** | Converges to Truth (if computable). | Converges to Best Approximation in Class. |
  | **Dominance** | Dominates all computable semimeasures. | Dominates only measures within the model class. |
  | **Primary Goal** | Optimal Prediction / Theory of Induction. | Generalization / Model Selection Heuristic. |

  ### Conclusion

  The claim "MDL is just practical Kolmogorov complexity" is **misleading shorthand**.

  It is more accurate to say: **MDL is a Bayesian model selection framework motivated by the intuition of Kolmogorov complexity.**

  *   **Solomonoff** tells us that *if* we could compute the shortest program, we would have optimal induction.
  *   **MDL** acknowledges we cannot compute the shortest program, so we restrict our search to a tractable set of models and use code length as a proxy for model complexity to prevent overfitting.

  For a software engineer, the distinction matters because it manages expectations. If you use MDL, you are not approximating the "truth" of the data generating process in a universal sense; you are finding the most efficient representation of the data **within your architecture's capabilities**. If your architecture (model class) cannot express the underlying pattern (like the $\pi$ example), MDL will confidently select the wrong model, whereas Solomonoff (theoretically) would not.

  MDL is not "Solomonoff with a timeout." It is "Solomonoff with a restricted library."
