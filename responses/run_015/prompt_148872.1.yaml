  # Diagnostic Tree: Overdetermination and Multi-Causal Explanation (1989 Case)

  **Root Case:** In 1989 a regime collapses. Historians advance three apparently sufficient explanations: (1) long-term structural economic decay, (2) a contingent diplomatic blunder, and (3) a rapid mass-mobilization cascade.

  **Branching Nodes**

  1.  Is causal overdetermination genuinely possible, or does every apparent case resolve into one dominant sufficient condition once background conditions are fully specified?
      *   **No** → Go to Leaf 1
      *   **Yes** → Go to Node 2
  2.  Does accepting overdetermination undermine counterfactual reasoning—specifically, does it render questions about absent sufficient conditions malformed?
      *   **Yes** → Go to Leaf 2
      *   **No** → Go to Node 3
  3.  Does narrative coherence require selecting a single dominant turning point, or can a historical account integrate multiple sufficient causal arcs without reducing one to the other?
      *   **Requires Single Point** → Go to Leaf 3
      *   **Integrates Multiple** → Go to Node 4
  4.  Are the multiple sufficient causes ontologically distinct features of the world?
      *   **No** → Go to Leaf 4
      *   **Yes** → Go to Leaf 5 & 6

  ***

  **Leaves**

  1.  **Resolutionist Monism**
      *   *Awkward Commitment:* The defender must claim the diplomatic blunder was merely symptomatic, not causally potent, once economic data is exhaustive.
  2.  **Counterfactual Eliminativism**
      *   *Awkward Commitment:* The defender must accept that asking "what if the blunder hadn't occurred?" is a meaningless question despite the event's historical salience.
  3.  **Narrative-Causal Distinction**
      *   *Awkward Commitment:* The defender must accept that the chosen narrative turning point is pragmatically selected rather than causally privileged.
  4.  **Unnamed**
      *   *Awkward Commitment:* The defender must accept that multiple sufficient causes exist only as useful fictions without ontological grounding.
      *   *Diagnosis of Emptiness:* Its emptiness stems from unattractiveness, as historians generally seek real causes rather than instrumental fictions.
  5.  **Modal Pluralism**
      *   *Awkward Commitment:* The defender must accept that structural necessity and contingent accident are equally real modalities of the same singular event.
  6.  **Level-Sensitive Pluralism**
      *   *Awkward Commitment:* The defender must accept that a cause can be sufficient at one scale while nonexistent at another without contradiction.

  ***

  **Flagged Unseparated Pair**

  *   **Pair:** Modal Pluralism (5) and Level-Sensitive Pluralism (6).
  *   **Explanation:** Both positions answer 'Yes' to Node 4 (ontological distinction) but differ on whether the distinction is modal or scalar, a nuance the four branching questions do not interrogate.
