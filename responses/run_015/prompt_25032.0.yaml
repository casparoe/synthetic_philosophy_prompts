answer: |-
  You have identified one of the most fundamental fault lines in modern moral and political philosophy. You are absolutely right that this is a single phenomenon with a canonical name.

  The objection is known as **"The Separateness of Persons."**

  Its most famous formulation comes from **John Rawls** in *A Theory of Justice* (1971), though it echoes Kantian deontology and is sharpened by Robert Nozick. The core claim is that utilitarianism (and other aggregative consequentialist theories) mistakenly treat society as a "super-person," applying the rational principle of individual sacrifice (I suffer now to gain later) to distinct individuals (A suffers so B may gain).

  Here is the breakdown of the canonical statement, the philosophical family it belongs to, and the answer to your hardest question: how defenders distinguish forbidden trade-offs from permitted ones.

  ### 1. The Canonical Statement
  The locus classicus is Rawls, Section 5 of *A Theory of Justice*:

  > "Utilitarianism does not take seriously the distinction between persons... [It] extends to society the principle of choice for one man, and then, to make this extension work, conflates all persons into one through the imaginative acts of the impartial sympathetic spectator."

  Rawls argues that for a single individual, it is rational to endure a painful dentist visit now to avoid toothache later. The "cost" and "benefit" reside in the same life. But for a society, imposing a cost on Person A to generate a benefit for Person B is fundamentally different. There is no "social entity" that experiences the net gain; there are only distinct individuals, one of whom has been sacrificed.

  Robert Nozick reinforces this in *Anarchy, State, and Utopia* (1974) with his critique of "utilitarianism of rights." He argues that individuals have **side constraints** (rights) that cannot be violated, even if violating them would minimize total violations overall. To use someone as a means to a social end is to fail to respect them as a separate end in themselves.

  ### 2. Is it One Objection or Several?
  It is a family resemblance cluster, but the "Separateness of Persons" is the umbrella. Underneath it, you find three specific philosophical mechanisms that explain *why* the boundary matters:

  1.  **Kantian Respect:** You cannot use a person merely as a means to an end. (Applies strongly to your drug trial and punishment examples).
  2.  **Contractualism (T.M. Scanlon):** An act is wrong if it follows principles that others could "reasonably reject." A displaced worker can reasonably reject a policy that sacrifices them without consent, even if the aggregate benefit is high.
  3.  **Agent-Relative Prerogatives:** I have a special obligation *not to harm* that is stronger than my obligation to *prevent harm*. I cannot kill one innocent person to save five, even if the "math" works, because the agency matters.

  ### 3. The Hard Question: What Trade-Offs Are Permitted?
  You rightly point out that we accept taxation, quarantine, and conscription. If the separateness of persons is a hard barrier, how are these justified? Defenders of the "Separateness" objection do not argue that *no* interpersonal trade-offs are allowed. They argue that **aggregation alone is insufficient justification.**

  To cross the boundary between persons, you generally need one of the following additional justifications:

  #### A. Consent (The Bioethics Case)
  In your drug trial example, the "Separateness" objection is fatal **if the participants are coerced.** If the participants give **informed consent**, the boundary is bridged by their own agency. They have chosen to accept the risk.
  *   **Permitted:** Voluntary trial with risk.
  *   **Forbidden:** Involuntary experimentation, even if it saves millions.
  *   **Principle:** The boundary between persons can be crossed by the person themselves (consent), but not by a third party (the state/committee) imposing the cost.

  #### B. Reciprocity and Ex-Ante Equality (The Economic Case)
  In the trade policy example, the objection is strongest when the losers are identified and sacrificed for the gain of others. However, taxation and public goods are often justified via **ex-ante reciprocity**.
  *   **Permitted:** We all pay taxes for roads. We don't know exactly who will use which road when. We are all in a "veil of ignorance" situation where the system benefits us all probabilistically over a lifetime.
  *   **Forbidden:** Targeting a specific minority group to confiscate their wealth for the majority, without compensation.
  *   **Principle:** Trade-offs are more permissible when they occur within a system of fair cooperation where everyone stands to gain over time, rather than when specific individuals are singled out as "sacrificial units." This is why many economists insist on **Kaldor-Hicks efficiency with compensation**: the policy is only justified if the winners *could* compensate the losers (even if they don't always actually do so, though critics say actual compensation is required).

  #### C. Rights as Side Constraints vs. Minimization (The Punishment Case)
  Your punishment example is the trickiest. Utilitarians say punish if it deters. Separateness defenders (like Nozick) say you cannot punish someone *merely* to deter others, because that uses them as a means.
  *   **Permitted:** Punishing someone because *they committed a crime* (they forfeited some rights), which incidentally deters others.
  *   **Forbidden:** Punishing an innocent person (or punishing a guilty person disproportionately) solely to send a message to others.
  *   **Principle:** The state can restrict liberty to prevent harm to others (quarantine, prison), but it cannot inflict harm *for the sake of* aggregate utility. The harm must be a consequence of a prior violation of duty by the individual, or a reciprocal restriction of liberty (quarantine) that applies to all equally based on status (infection), not identity.

  ### 4. Limits and Counter-Arguments
  It is worth noting that this objection is not universally accepted. "Impartial Consequentialists" (like R.M. Hare or Peter Singer) argue that the "Separateness of Persons" is morally arbitrary. From the "point of view of the universe," pain is pain, regardless of whose body it inhabits. They argue that insisting on the separateness of persons is just a sophisticated form of selfishness or tribalism.

  However, even they admit the practical force of the objection. The "Separateness of Persons" remains the primary philosophical tool used to explain why we have **rights** that cannot be overridden by utility.

  ### Summary Formulation
  If you need a precise formulation for your own reasoning, you might state it this way:

  > **The Principle of Non-Aggregation Across Persons:**
  > Benefits and burdens cannot be summed across distinct individuals to justify imposing a severe burden on one for the sake of a greater aggregate benefit to others, **unless** there is (a) consent from the burdened party, (b) a system of reciprocal benefit where the burdened party shares in the general advantage over time, or (c) a prior forfeiture of rights by the burdened party.

  Your intuition that the "boundary between persons" is the key variable is exactly right. The debate is not about whether we can ever trade off interests, but about **who has the authority to make the trade** (the individual vs. the collective) and **what conditions legitimize crossing that boundary** (consent, reciprocity, or rights forfeiture).
