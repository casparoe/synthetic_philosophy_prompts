answer: |-
  You have identified a distinction that is frequently conflated in popular ethical discourse but is increasingly recognized in technical moral philosophy as a critical fault line. Your intuition is correct: the standard "demandingness objection" is almost exclusively concerned with *welfare cost* (how much well-being you lose), whereas your complaint is about *deliberative load* and *jurisdictional claim* (how much of your mental space and life structure morality is permitted to occupy).

  There is no single canonical noun (like "Utilitarianism") that captures this specific dimension, but the concept is carved out in the literature under the distinction between **Stringency** and **Scope**, and more precisely under discussions of **Option Rights**, **Agent-Centered Prerogatives**, and the **Criterion/Decision-Procedure distinction**.

  Here is the shape of the thing, where it fits in the literature, and why your friend's labels missed it.

  ### 1. The Name and the Shape
  The dimension you are describing is best termed **Deliberative Pervasiveness**.

  In the literature, demandingness is usually analyzed along two axes:
  1.  **Stringency:** How much must you sacrifice to comply? (The welfare cost).
  2.  **Scope:** To how many of your actions does the theory apply? (The jurisdictional claim).

  Standard consequentialism is often criticized for high Stringency. Your complaint is about maximal **Scope** combined with low Stringency. You are objecting to a theory that claims **Total Deliberative Jurisdiction**.

  The "remainder-free region" you describe is technically known as the **Sphere of Moral Indifference** (or sometimes **Moral Liberty**). A theory that eliminates this sphere is sometimes called **Totalizing**. Your objection is not that the theory asks for too much *energy* (cost), but that it grants morality a monopoly on *authority* (pervasiveness).

  ### 2. Mapping the Neighbours
  Here is how Deliberative Pervasiveness relates to the concepts your friend offered, and where they fail to capture your cases.

  **A. The Demandingness Objection (Standard)**
  *   **The Fit:** Poor. As you noted, standard demandingness objections (e.g., Liam Murphy, Tim Mulgan) focus on the *magnitude* of sacrifice. They argue consequentialism requires you to be a "moral saint" who sacrifices their life's projects.
  *   **The Mismatch:** Your aid worker case sacrifices more (high stringency) but bothers you less. Your pension case sacrifices little (low stringency) but bothers you more. The standard objection cannot explain why the *cheap* demand is more offensive than the *costly* one.

  **B. The Integrity Complaint (Bernard Williams)**
  *   **The Fit:** Moderate. Williams argued that consequentialism alienates agents from their "ground projects" by forcing them to view their own lives from an impartial perspective.
  *   **The Mismatch:** Williams focuses on the *content* of the life (you can't have your own projects). Your objection holds even if the agent *chooses* morality as their project (as in your giving circle). The aid worker has made morality their project and retains integrity; the pension-optimizer has not, yet feels colonized. The issue isn't alienation from projects; it's the *structure of the monitoring*.

  **C. The Disappearance of the Supererogatory**
  *   **The Fit:** Close. If everything is duty, nothing is supererogatory.
  *   **The Mismatch:** As you noted, this locates the problem in the *status* of the act (praiseworthy vs. required). Your concern is temporal and structural: *When am I off the clock?* A theory can have supererogatory acts but still be pervasively demanding if the "duty" baseline requires constant vigilance (e.g., "You must always be ready to optimize"). The loss of the supererogatory is a symptom; the loss of the **off-duty switch** is the disease.

  **D. Agent-Centered Prerogative (Samuel Scheffler)**
  *   **The Fit:** High. Scheffler proposed a "prerogative" allowing agents to give extra weight to their own interests, effectively creating a buffer zone where they are not required to maximize the good.
  *   **The Mismatch:** This is the *solution* to your problem, not the name of it. Your complaint is that maximizing consequentialism lacks a prerogative. However, Scheffler's prerogative is usually justified by *cost* (protecting welfare), whereas your intuition suggests it should be justified by *structure* (protecting deliberative sovereignty).

  **E. Scalar Consequentialism (Alastair Norcross)**
  *   **The Fit:** Negative. Scalar consequentialism removes the duty/option line entirely, saying acts are just "better" or "worse."
  *   **The Mismatch:** This maximizes Deliberative Pervasiveness. If there is no threshold where you are "good enough," then every minute contains a moral comparison. This confirms your suspicion: the absence of a "budget" or "threshold" is what creates the pervasive atmosphere.

  ### 3. Addressing Your Specific Questions

  **(i) Does this discriminate between theories? Do non-consequentialists have pervasive duties?**
  Yes, it discriminates, but not cleanly along the Consequentialist/Deontological line.
  *   **Consequentialism:** Act-consequentialism is inherently pervasive (every act must be optimized). Rule-consequentialism (e.g., Brad Hooker) attempts to limit pervasiveness by adopting rules that allow for personal time, explicitly acknowledging that a code requiring constant vigilance would be self-defeating.
  *   **Non-Consequentialism:** Kantianism distinguishes between **Perfect Duties** (never lie, never kill) and **Imperfect Duties** (beneficence). Imperfect duties allow for "play in the joints"—you must help others, but you choose when and how. This creates a low-pervasiveness structure. However, some interpretations of Virtue Ethics can be highly pervasive (e.g., "Is this what a virtuous person would do?" applied to every brand choice).
  *   **The Verdict:** The demandingness debate has indeed been aimed at the wrong target if it focuses only on cost. A theory can be low-cost but high-pervasiveness (your pension case), and that is structurally distinct from high-cost theories.

  **(ii) Is "cheap pervasiveness" just costly in a currency of attention?**
  This is the **Deliberative Cost** argument (explored by Peter Railton).
  *   **The Collapse View:** One could argue that constant vigilance *is* a high welfare cost (decision fatigue, anxiety, loss of spontaneity). If so, your two dimensions collapse back into one: Total Cost = Financial Cost + Attention Cost.
  *   **The Authority View (Your Intuition):** You suspect it's not just fatigue. You are right. The objection is not that thinking about the pension is *tiring*, but that morality claims the *right* to be the reason you think about it.
  *   **How to tell:** If you offered the pension-optimizer a drug that removed the fatigue but kept the requirement ("You must still choose the optimal fund, but it won't stress you"), the objection would remain. The objection is to the **claim of jurisdiction**, not the phenomenological burden. It is the difference between a boss who asks for overtime (cost) and a boss who installs a camera in your bathroom (pervasiveness/authority).

  **(iii) Is this about the kind of authority the requirement claims?**
  Yes. This is the strongest philosophical grounding for your intuition.
  *   **Moral Jurisdiction:** You are describing a conflict over **Moral Jurisdiction**. A rule with a budget (give 10%, then stop) functions like a tax: it claims a specific portion of your resources and leaves the rest under your **Deliberative Sovereignty**.
  *   **The "Off-Duty" Norm:** Moral theories that allow for a "remainder-free region" acknowledge that agents are not merely vessels for the good, but sovereigns over a private sphere. This aligns with H.L.A. Hart's concept of **Option Rights** (liberties where morality is silent).
  *   **Productivity:** You noted the budgeted rule is more productive. This aligns with **Rule Consequentialist** arguments (Hooker): A theory that demands too much deliberative space causes burnout and rebellion. A theory that grants a protected sphere sustains long-term compliance. The authority claim that respects the agent's sovereignty is more effective than the totalizing claim.

  ### 4. A Proposed Term and Boundary Cases
  Since no single existing term captures the *structural* nature of this complaint without conflating it with cost, I propose we tighten the description using:

  **Term:** **Deliberative Pervasiveness** (Descriptive)
  **Normative Counterpart:** **Moral Jurisdiction**

  **Definition:** A moral requirement has high Deliberative Pervasiveness if it lacks a discrete termination condition (threshold, budget, or context limit) and thereby claims authority over an open-ended set of trivial choices, preventing the agent from entering a Sphere of Moral Indifference.

  **Boundary Cases to Test the Concept:**

  1.  **The Carbon Footprint Calculator (Falls IN)**
      *   *Scenario:* You are required to calculate the carbon impact of every grocery item before buying. The cost is low (seconds of time), but the requirement applies to every meal, forever.
      *   *Verdict:* High Deliberative Pervasiveness. Morality colonizes the daily routine. There is no "off-duty" moment for eating.

  2.  **The Tithing Covenant (Falls OUT)**
      *   *Scenario:* You covenant to give 10% of income to charity. Once transferred, you have no further moral obligation regarding that money. You can spend the remaining 90% on whatever you like without moral scrutiny.
      *   *Verdict:* Low Deliberative Pervasiveness. High Stringency (potentially), but clear Jurisdictional Boundary. The "remainder-free region" is intact.

  3.  **The Parental Vigil (The Edge Case)**
      *   *Scenario:* A parent is expected to be constantly attentive to their child's safety and development. This is pervasive (24/7) and costly.
      *   *Verdict:* This tests the *Justification* for Pervasiveness. Most agree this pervasiveness is permissible because it is grounded in a **Special Obligation** (relationship), not a general moral theory. If a general moral theory demanded the same pervasiveness toward *strangers*, it would cross the line. This confirms your intuition: the problem isn't pervasiveness *per se*, but pervasiveness claimed by **Impartial Morality** over **Private Life**.

  ### Summary
  Your friend is looking for a problem of *magnitude* (how much you lose). You have found a problem of *structure* (how much of you is claimed).

  The literature calls this the distinction between **Stringency** and **Scope**, but specifically regarding **Deliberative Pervasiveness**. The normative mechanism that protects against this is the **Agent-Centered Prerogative** or **Option Rights**, which establish a **Sphere of Moral Indifference**. Your intuition that this is about **Authority/Jurisdiction** rather than **Well-being/Cost** is philosophically robust; it aligns with liberal critiques of moral totalitarianism (e.g., Nozick, Hart) applied to personal ethics. The "budget" works not because it saves money, but because it draws a border where morality's authority ends and your sovereignty begins.
