      *   **Core Observation:** DNA is treated uniquely (special consent, retention, prohibitions) based on the label "genetic information." Yet, biologically, the regions used for identity (STRs) are non-coding "junk," and the regions used for disease are often uncertain (VUS, penetrance issues). Other data (family history, proteins) predict outcomes just as well but lack the special protection.
      *   **The Question:** What is the *implicit theory* behind this carve-out?
          *   Is DNA viewed substantively as a "code/text" (semantic information)?
          *   Or is it viewed weakly as a causal predictor (unique stability, unwaivability, familial implication)?
          *   Does the practice rule out the "developmental resource" view?
