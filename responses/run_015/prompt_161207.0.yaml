  8.  *(Self-Correction on Confidence Marking)*: The prompt asks to "mark which claims you would defend to a hostile reader and which you are inferring or reconstructing." I will use bolding or bracketed notes like **[High Confidence]** or **[Inference]** to make this clear.

  9.  *(Final Polish on the "Hard Fact")*: Ensure I explain *why* arbitrariness matters. If A *chemically necessitated* B, it's a mechanism. If A *conventionally maps* to B, it's a code. DNA is the latter. This is a strong philosophical point.

