  The question I actually care about isn't 'was Malthus right'. It's narrower: what's your credence that M is true, *and* that the reason it hasn't obviously happened at global scale since 1798 is that its antecedent has never really been instantiated — as opposed to M being false. I'm at about 0.55 on that conjunct, my brother is at about 0.15, and I want to know where that gap is.

