prompt: |-
  Okay, so I'm in this grad seminar on AI alignment and philosophy of mind and I'm supposed to be the one explaining conceptual issues to my group, but I'm honestly stuck. Could you act like a senior alignment researcher who also knows decision theory inside-out? Before diving in, please do a quick brainstorm: list the core assumptions behind idealized-preference frameworks, then flag where they get weird when applied to groups rather than individuals.

  The thing I'm wrestling with is coherrent extrapolated volition — like, the classic idea that you extrapolate what someone would want if they were smarter, more informed, etc. — but pushed into this niche corner: collective or multi-agent CEV. Specifically, I'm thinking about inter-agent extrapolation divergence. The problem isn't just that people's idealized values clash; it's that the extrapolation process itself might amplify hidden disagreements about personal identity over time. One agent's idealized self might require value-stability to count as "me," while another's allows radical axiological revision and still claims continuity. So when you try to coherently extrapolate the volition of a group, you're not aggregating preferences — you're aggregating incompatible metaphysical criteria for who even gets to be in the preference pool after reflection. Is this actually a distinct conceptual problem from standard preference aggregation, or am I conflating CEV with philosophy of personal identity?

  Please explain the mechanics clearly. I need you to seperate what's fairly settled — for instance, that CEV involves some form of idealization and coherence constraint — from what's genuinely contested, like whether divergence is fatal, whether a shared extrapolation protocol could resolve it, or if collective CEV just collapses into something like a constitutional choice procedure. Don't present any of those contested takes as the consensus. And please don't hand me a bibliography or citation list; I need to understand the argument, not look up papers. Also ignore my typo where I wrote "coherrent" — I know it's misspelled.
