answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Committee for Institutional Safety and Legitimate Coercion
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding the Structure of Campus Public Safety

  **Executive Summary**

  The Committee for Institutional Safety and Legitimate Coercion has convened to evaluate the moral and administrative standing of the University Police Department. After reviewing operational data, community testimony, and the philosophical underpinnings of institutional authority, the Committee submits this memo to recommend a specific course of action. We recommend the **complete abolition of the current armed police department and its transition to an unarmed, multidisciplinary crisis-response unit.**

  This recommendation is not based solely on incident statistics or budgetary concerns, but on a fundamental assessment of conceptual legitimacy. The current model posits a coercive authority that the University, as a non-sovereign entity, cannot legitimately sustain. While we acknowledge the significant security risks associated with dismantling centralized coercive capacity, our proposed implementation timeline is designed specifically to mitigate these risks without retaining an illegitimate power structure.

  **Conceptual Framework: The Jurisdictional Fink**

  To arrive at this conclusion, the Committee applied a specific analytical framework regarding the nature of authority within a private educational institution. We term this the "jurisdictional fink."

  In standard political theory, the legitimate use of force requires a correspondence between the power exercised and the accountability mechanisms available to those subjected to it. Typically, this correspondence is secured through sovereign statehood and democratic participation. The University, however, is not a sovereign body. It cannot levy taxes, declare war, or offer democratic recourse in the manner of a municipality. Yet, our current police department possesses formal powers of arrest, armed intervention, and detention that mimic sovereign state powers.

  The "jurisdictional fink" occurs when an institution claims a coercive disposition (the power to arrest or use force) but systematically suppresses the conditions required to legitimize that disposition. When the community questions the *source* of this authority, the administration points to "safety" and "service," masking the coercive nature of the power. When the community questions the *efficacy* of safety, the administration points to "law enforcement powers" and "jurisdiction." The legitimacy conditions are never met because the institution oscillates between being a community (which cannot hold police powers) and a state (which it is not).

  This creates a masked disposition: the power to coerce is present, but the legitimating framework vanishes when tested. A non-sovereign institution cannot legitimately possess a monopoly on violence because it lacks the sovereign capacity to be held accountable for that violence through democratic channels. Therefore, maintaining the current department is not merely an administrative choice; it is a category error in institutional governance.

  **Analysis of Alternatives**

  The Committee considered three primary options:

  1.  **Retention with Oversight:** This option maintains the armed department while adding review boards. We rejected this because oversight mechanisms, no matter how strict, cannot cure the foundational illegitimacy of the power itself. If the disposition is finkish, monitoring it does not make it legitimate; it only makes the suppression of legitimacy more transparent.
  2.  **Phased Restructuring of the Police Force:** This option would reduce the scope of policing while retaining armed officers for high-level threats. We rejected this because it preserves the core conceptual error. Retaining any armed capacity maintains the claim to a monopoly on violence that the University cannot substantiate.
  3.  **Abolition and Transition to Unarmed Response:** This option aligns the institution's safety mechanisms with its actual nature as a voluntary educational community. It removes the claim to sovereign violence and replaces it with a mandate for care and de-escalation.

  **The Security Vacuum Objection**

  The Committee treats with the utmost seriousness the strongest argument against our recommendation: the Weberian security vacuum objection. Critics argue that universities, by virtue of their size and density, inherit a functional necessity for a monopoly on legitimate violence. To dissolve this monopoly is to risk a fragmentation of security responsibility, potentially leaving the community vulnerable to rapid, violent crises that require immediate armed intervention.

  This argument posits that without a centralized coercive capacity, equity and rapid response will suffer. If a violent actor enters campus, an unarmed unit cannot neutralize the threat. In this view, the "jurisdictional fink" is a acceptable theoretical cost to pay for physical safety.

  We acknowledge the gravity of this risk. However, we contend that the current monopoly is illusory. Our officers are not state sovereigns; they are employees of a private corporation. In a genuine crisis, they rely on mutual aid agreements with the city police to exercise true sovereign power. Thus, the University already relies on external fragmentation in extreme cases. The current model creates a dangerous ambiguity: officers are trained to act as soldiers in a war zone but are legally situated as private security guards with delegated state powers. This confusion delays response and escalates violence.

  By transitioning to an unarmed model, we do not abandon security; we reclassify it. We acknowledge that the University cannot stop all violence, but it can refuse to be the agent of violence. The "vacuum" is filled not by a lack of response, but by a clear demarcation: the University handles care, conflict, and mental health; municipal authorities handle criminal violence. This clarity is safer than the current ambiguity, where the University pretends to a sovereignty it does not possess.

  **Recommendation and Implementation Timeline**

  The Committee recommends **Complete Abolition of the Armed Police Department with Transition to an Unarmed Crisis-Response Unit.**

  To address the security vacuum objection, this abolition must not be immediate. It requires a phased implementation to ensure that safety protocols are established before armed capacities are removed. We propose an 18-month transition period.

  **Phase 1: Assessment and Pilot (Months 1–6)**
  *   **Action:** Cessation of all new armed hiring. Current armed officers are offered retraining for unarmed roles or severance packages.
  *   **Pilot:** Launch a 24/7 unarmed crisis response team composed of mental health professionals and conflict mediators.
  *   **Oversight:** Establishment of a Temporary Safety Council, comprising students, faculty, and local municipal law enforcement liaisons, to monitor incident response times during the pilot.
  *   **Goal:** Establish baseline data on non-coercive resolution rates.

  **Phase 2: Integration and Protocol Development (Months 7–12)**
  *   **Action:** Formalize mutual aid agreements with the municipal police department. These agreements must explicitly state that the University will not request armed intervention except in cases of imminent threat to life, and that such requests trigger an automatic external review.
  *   **Training:** All campus safety staff undergo de-escalation and restorative justice training.
  *   **Infrastructure:** Install enhanced lighting, emergency communication systems, and access controls to reduce reliance on personnel for physical security.
  *   **Goal:** Ensure external support structures are legally and operationally ready to handle violent threats that exceed the unarmed unit's scope.

  **Phase 3: Full Operational Capacity (Months 13–18)**
  *   **Action:** Full decommissioning of armed officer badges and firearms on campus. The Department of Public Safety is reconstituted as the Office of Community Safety.
  *   **Audit:** Quarterly oversight audits by the Temporary Safety Council to review response times and equity metrics.
  *   **Goal:** Complete transition to the new model.

  **Accountability Mechanisms**

  To prevent the re-emergence of the jurisdictional fink, the new Office of Community Safety will operate under strict democratic-oversight conditions:
  1.  **Public Reporting:** All incident reports involving physical intervention must be published monthly.
  2.  **Community Board:** A elected board of students and staff will hold veto power over the Director of Community Safety.
  3.  **No Arrest Powers:** Staff will have no authority to detain individuals against their will unless in immediate defense of life, pending municipal arrival.

  **Conclusion**

  The University stands at a crossroads between administrative convenience and ethical consistency. Maintaining the current police force allows the administration to outsource the moral burden of coercion while retaining the benefits of control. This is the essence of the jurisdictional fink. By abolishing the armed department, the Trustees will affirm that the University is a community of scholars, not a sovereign territory. We accept the risks of this transition because the alternative is the perpetuation of an authority that is conceptually false and morally untenable.

  **Actionable Bottom Line**

  The Committee moves that the Board of Trustees adopt the following resolution:

  > *RESOLVED, that the University shall abolish its armed police department effective eighteen months from the date of this vote; that an Office of Community Safety be established to provide unarmed crisis response and safety services; and that the Administration is directed to execute the three-phase transition plan outlined in the Committee Memorandum of October 26, 2023, subject to quarterly reporting to the Board.*

  **Approved by:**
  Committee for Institutional Safety and Legitimate Coercion
