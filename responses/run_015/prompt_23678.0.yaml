  *Middle:* Debugging. The logs show valid transactions in both regions during a split.
  *Climax:* The reconciliation attempt. The system returns a "Composite State".
  *Ending:* She documents it not as an incident, but as an observation.

  *Wait, one crucial nuance:* The prompt asks to distinguish from relativism. Relativism says "Truth is subjective." Anekāntavāda says "Truth is complex/objective but multifaceted." The database record *objectively* contains both versions. It's not that Priya *sees* different things; it's that the record *is* different things. I need to emphasize the data structure itself holds the multiplicity.

  *Revised Plan:* The data type isn't `int`. It's a `MultiState`. When she queries it, she doesn't get an error. She gets the structure.

