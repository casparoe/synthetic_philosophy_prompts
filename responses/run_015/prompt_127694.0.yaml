answer: |-
  There is no single, canonical label in the literature that captures this specific configuration precisely as you have described it. However, the position you outline is a sophisticated variant of **Vehicle Internalism**, specifically one that invokes a **Topological Constraint on Normativity**. While often conflated with biological internalism or the coupling-constitution fallacy, your description isolates a distinct metaphysical commitment: that normative properties (such as epistemic authority, commitment, or justification) supervene not merely on functional role or causal integration, but on the spatial or metaphysical boundary of the agent.

  In what follows, I shall define this position, distinguish it from neighbouring objections, and assess its viability as a distinct failure mode in the debate.

  ### 1. Conceptual Definition: The Topological Constraint on Normativity

  The objection you describe posits that for a state to possess genuine *doxastic authority* (the status of being a belief for which one is responsible, or which serves as a premise in reasoning), it must satisfy a location condition. Let us term this the **Boundary Condition on Doxastic Authority**.

  The structure of the argument is as follows:
  1.  **Functional Parity:** Internal state $I$ and External state $E$ play identical functional roles in the cognitive economy of the agent.
  2.  **Normative Asymmetry:** $I$ possesses normative status $N$ (e.g., it constitutes a commitment, it bears justification), while $E$ lacks $N$.
  3.  **The Explanatory Basis:** The difference in $N$ is not explained by functional difference, reliability, or substrate (biological vs. silicon), but solely by the fact that $I$ is intracranial and $E$ is extracranial.
  4.  **Counterfactual Sensitivity:** If $E$ were moved inside the boundary (internalised) without changing its functional profile, it would acquire $N$.

  This is distinct from plain internalist intuition because it does not merely assert that 'minds are inside'. It grants the functional parity but denies the *normative transmission*. It treats the skin or skull not merely as a physical container, but as a **normative forcefield**. On this view, the boundary itself is a constitutive condition for epistemic agency.

  ### 2. Relation to Standard Objections

  To carve this concept out precisely, we must distinguish it from the three standard pillars of resistance to the Extended Mind Thesis.

  **The Coupling-Constitution Fallacy**
  The coupling-constitution objection (famously associated with Adams and Aizawa) argues that one cannot infer that a process is constitutive of cognition merely because it is causally coupled to cognition. Your described opponent, however, *concedes* the functional equivalence. They are not arguing that the notebook is merely coupled; they are arguing that even if it constitutes the functional equivalent of a belief, it lacks the *normative standing* of a belief due to its location. The coupling-constitution fallacy is a warning against bad inference; the Topological Constraint is a positive metaphysical claim about where normativity resides.

  **The Glue and Trust Conditions**
  Clark's 'glue and trust' criteria are designed to ensure that external resources are integrated sufficiently to count as part of the cognitive system. The opponent you describe effectively argues that 'glue' is insufficient for 'authority'. One might trust a notebook implicitly (satisfying the trust condition) and rely on it constantly (satisfying the glue condition), yet still lack the specific *epistemic binding* that comes with internalisation. This objection suggests that Clark's conditions secure *causal integration* but fail to secure *normative integration*.

  **Biological Internalism**
  Biological internalism asserts that cognition must be realised in biological tissue. Your description explicitly rules this out ('not biological implementation'). The Topological Constraint is more abstract: it is about *location relative to the agent*, not the substrate. In principle, a proponent of this view could grant that if a silicon chip were implanted *inside* the skull, it might acquire normative status, whereas the same chip in a notebook would not. This makes it a topological objection rather than a substrate objection.

  ### 3. Boundary Cases and Differentiation

  To ensure this concept is robust, we can test it against boundary cases where it diverges from standard internalism.

  **Case A: The Implanted Chip**
  *Scenario:* A memory chip is surgically implanted into a subject's brain, functioning exactly like the notebook but internally.
  *Biological Internalist:* Denies mental status (it is silicon).
  *Topological Normativist:* Grants mental status (it is inside the boundary).
  *Significance:* This distinguishes the view from strict bio-conservatism. It shows the objection is about the *boundary of the self*, not the chemistry of the self.

  **Case B: The Swapped Notebook**
  *Scenario:* A mathematician uses a notebook. Unbeknownst to them, an assistant swaps the notebook for an identical one with the same content every night.
  *Standard Internalist:* Might worry about continuity of vehicle.
  *Topological Normativist:* Focuses on the fact that the resource is external, making it susceptible to such swaps in a way that undermines authority. The *potential* for external disruption (due to location) is what strips the normative status, even if no disruption occurs.
  *Significance:* This highlights that the 'location' is a proxy for a specific kind of vulnerability that allegedly negates authority.

  **Case C: The Phantom Limb**
  *Scenario:* A patient feels pain in a missing limb. The 'location' of the pain is experienced as external to the physical body boundary, yet it is undeniably mental.
  *Topological Normativist:* Must argue that the *phenomenal* location is distinct from the *metaphysical* location of the vehicle. The vehicle is neural (internal), even if the content represents the outside.
  *Significance:* This forces the proponent to clarify that 'location' refers to the vehicle of the state, not the intentional object.

  ### 4. Assessment: Distinct Failure Mode or Collapse?

  Does this Topological Constraint stand as a distinct philosophical position, or does it collapse into a more familiar objection?

  **The Risk of Collapse into Brute Intuition**
  The primary danger for this view is explanatory emptiness. If the proponent cannot explain *why* crossing the skull boundary confers normative authority, the position collapses into **Brute Internalism**. To claim that a state becomes a 'reason' simply by moving one millimetre across the parietal bone is to posit a metaphysical magic trick. Unless the opponent can specify a mechanism by which the boundary generates normativity (e.g., by enabling a specific kind of direct access or ownership), the objection is merely a restatement of the intuition that the mind stops at the skin.

  **The Agency and Ownership Defence**
  However, the view can be salvaged if linked to a specific theory of **Agency**. One might argue that normative authority requires a specific relation of *ownership* or *endorsement* that is only possible when the vehicle is directly accessible to the mechanisms of self-monitoring located within the head. On this reading, the 'location' is not magical but is a proxy for **direct access**.
  *   *Critique:* If the argument is actually about 'direct access', then it is no longer about location *per se*, but about the *causal pathway* of monitoring. If an external tool is monitored just as reliably as an internal memory (as the parity principle suggests), the location argument loses its force.
  *   *Conclusion:* If the opponent insists location is the *fundamental* factor, even holding access constant, the view remains distinct but metaphysically costly. If they concede that location matters only insofar as it affects access or monitoring, the objection collapses into a **causal reliability** objection, which the Parity Principle is designed to defeat.

  ### 5. Summary Characterisation

  You are encountering a **Topological Normativist** objection. It is a specific form of Vehicle Internalism that treats the agent's physical boundary as a necessary condition for the instantiation of normative properties like belief-commitment or epistemic authority.

  It is distinct from the coupling-constitution fallacy because it accepts functional parity. It is distinct from biological internalism because it cares about topology rather than substrate. It is distinct from glue-and-trust objections because it claims integration is insufficient for authority.

  However, its viability depends entirely on whether the proponent can explain the normative significance of the boundary without resorting to brute intuition. In the absence of such an explanation, it functions as a **dialectical stopper**: a move that halts the parity argument by asserting a metaphysical privilege for the intracranial that is immune to functional analysis. In seminar discussion, the most effective counter-move is to demand the *mechanism* of this boundary-dependent normativity. If none can be offered other than 'that is what minds are', the objection should be classified as an unargued internalist prejudice rather than a substantive metaphysical constraint.
