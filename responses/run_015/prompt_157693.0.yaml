answer: |-
  **The Limbic Scrub Case**

  Elias Vance, 54, is diagnosed with "Auto-Immune Limbic Cascade," a rare condition where his immune system attacks the neural networks encoding autobiographical memory and character traits. Within weeks, the inflammation will cause fatal seizures. The only cure is "The Scrub": a targeted nanoscopic ablation that destroys the affected networks entirely before rebuilding them with generic scaffolding. The organism will survive indefinitely, conscious and capable of new learning. However, the procedure wipes all episodic memory and resets personality to a neutral baseline. The post-op patient will not know Elias's name, his wife, or his values.

  Twenty years ago, Elias signed an Advance Directive: "If a treatment preserves my biological life but destroys the psychological continuity that makes me *me*, I refuse it. Let me die." Elias is now incapacitated. His wife, Sarah, must decide whether to honour the directive (letting Elias die) or consent to The Scrub (saving the organism but creating a psychologically new person).

  **Theory Walkthrough**

  **Reductionist (Psychological View):** For the Reductionist, personal identity just *is* psychological continuity (Relation R). What matters in survival is the preservation of this relation. In this case, The Scrub severs Relation R completely: no memories, no character traits, no overlapping intentions remain. The causal chain is biological, not psychological. Therefore, Elias does not survive. Since what matters *is* psychological continuity, nothing that matters is preserved. The rational action is to honour the directive: do not operate. Elias dies, but nothing of value is lost because Elias is already gone.

  **Non-Reductionist (Simple View):** For the Non-Reductionist, personal identity is a further fact, typically grounded in the persistence of the same substance (the living human organism/brain). Identity is what matters. Since The Scrub preserves the living organism and the same brain substance without interruption, Elias survives. The psychological loss is a terrible *harm* to Elias, but it is not *death*. Since identity is preserved, what matters in survival is fully preserved. The rational action is to override the directive: operate. Elias lives, and survival is what counts.

  **Biological/Animalist View:** This view lumps together with the Non-Reductionist here. You are your organism. The organism survives the procedure. Therefore, you survive. The psychological wipe is irrelevant to the question of existence, though relevant to quality of life.

  **Key Feature and Variations**

  The work is done by the **clean dissociation of biological continuity from psychological continuity**. The case forces the theories to choose their priority: biology or psychology.

  *   **If you leave one thin strand of psychological continuity** (e.g., one retained memory): The Reductionist can slide into the "degrees of survival" escape hatch, arguing Relation R holds partially, so some prudential concern is warranted. This blurs the verdict.
  *   **If the damage is gradual** (e.g., dementia over years): The Reductionist invokes the sorites paradox to argue survival holds through small steps. The Non-Reductionist still says survival holds, but the practical conflict vanishes.
  *   **If it is reversible** (e.g., temporary coma): Both theories agree survival holds, as continuity is merely interrupted, not broken. The case requires permanent, total psychological reset to block the Reductionist's continuity defense.

  **Best Attack**

  The Reductionist comes out looking worse here, as their verdict requires letting a healthy organism die based on a metaphysical technicality. The best attack is the **"Too Few Survivors" Objection**: If total psychological reset counts as death, then severe dementia, brainwashing, or even deep general anaesthesia (if it breaks continuity enough) might also count as death. This makes personal identity too fragile for practical ethics. It forces us to treat living, breathing humans as dead shells whenever their psychology shifts radically, which contradicts our deepest moral instincts about the sanctity of human life.

  **Meta-Question: Reversal or Relocation?**

  This **is a true reversal** of the teletransporter, not a relocation. In the teletransporter, the input is Bio(-)/Psycho(+), yielding Red(+)/Non-Red(-). Here, the input is Bio(+)/Psycho(-), yielding Red(-)/Non-Red(+). The disagreement remains fixed on *what constitutes survival* (psychology vs. substance), but the verdicts flip symmetrically. It does not relocate the disagreement from identity to what matters; rather, it demonstrates that for the Reductionist, "what matters" *is* psychological identity, while for the Non-Reductionist, "what matters" *is* biological identity. You have successfully engineered a symmetrical stress test.
