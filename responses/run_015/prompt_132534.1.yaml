      *   Distinguish *Malum in se* (wrong in itself) vs. *Malum prohibitum* (wrong because prohibited/conventional).

  7.  **Final Polish:** Ensure the tone is supportive but academically rigorous. Make sure to directly answer the "Consent vs. Risk/Distribution" question. (Verdict: The consent thing is the category error; the risk/distribution thing is the nuance needed *within* the non-consent framework).

