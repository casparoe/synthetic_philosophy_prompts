      *   *Answering the Specific Question:* Is it Consent or Risk/Distribution?
          *   It's actually *both*, but primarily the **Source of Normativity**. The mistake is thinking the *mechanism* is contractual (consent). The *distinction* between risk and distribution is secondary but important for weighting the obligation.
      *   *Recommendation:* Refine "Coordination Debt" into "Principle of Fair Play." Distinguish between *Moralized Conventions* (queueing) and *Arbitrary Conventions* (which side of the road).

  6.  **Refining the Philosophical Terminology:**

