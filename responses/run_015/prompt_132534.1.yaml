answer: |-
  This is a fantastic starting point for an essay. You have intuitively stumbled upon one of the classic debates in political and moral philosophy: the **Principle of Fair Play** (often associated with H.L.A. Hart and John Rawls) versus **Contractualism**.

  Your tutor is pointing you toward a category error. You are trying to ground the obligation in *agreement* (contract), but conventions ground obligation in *interdependence* and *fairness*.

  Here is an untangling of the concepts to help you structure your argument, addressing your specific question about consent versus normative types.

  ### 1. The Core Mistake: Contract vs. Convention
  Your tutor's comment about the "false presupposition" refers to the idea that **moral binding requires consent.**

  *   **The Contract Model:** Requires offer, acceptance, and mutual intent. If I don't sign the contract, I'm not bound.
  *   **The Convention Model:** Requires interdependence and expectation. If I drive on the left in the UK, I am not bound because I signed a road treaty; I am bound because driving on the right creates chaos that harms everyone, including me.

  **The Verdict:** The mistake is thinking moral binding always needs consent. Conventions generate obligations *without* consent because they are **coordination solutions to collective action problems.** If you opt out unilaterally, you aren't just breaking a promise; you are undermining the system that allows the benefit to exist.

  However, your "Coordination Debt" idea needs a philosophical name: **The Principle of Fair Play.** This principle states that if you voluntarily accept the benefits of a cooperative scheme, you are obligated to bear your share of the burdens.

  ### 2. The Tourist Problem (The Nozickian Objection)
  Your example of the tourist in Japan is actually a famous counter-argument to the Principle of Fair Play, raised by Robert Nozick.

  Nozick argued that you cannot thrust benefits upon someone and then demand payment (or compliance). If a neighborhood plays music over a loudspeaker for everyone's enjoyment and then sends a bill to your house, you don't owe them money just because you heard the music.

  *   **Applied to your essay:** Does the tourist "accept" the benefit of orderly traffic?
      *   **Argument A (Nozick):** No. They are just walking. They didn't ask for the traffic light system. Therefore, no debt.
      *   **Argument B (Rawls/Hart):** Yes. By choosing to use the road *at all*, they are entering the cooperative scheme. You cannot use the infrastructure without accepting the rules that make it safe.

  **Refinement:** The obligation isn't about "accepting a contract"; it's about **not free-riding.** If the tourist jaywalks safely because everyone else is waiting, they are free-riding on the restraint of others. That is the moral wrong, not the breach of contract.

  ### 3. Queueing vs. Tipping: Distributive vs. Economic Norms
  This is where your second hypothesis (Risk vs. Distribution) becomes crucial. You are right that you are mixing two kinds of normative force, but it's slightly more nuanced.

  **Queueing (Distributive Justice):**
  *   **Normative Force:** Fairness.
  *   **Why it binds:** It is a "first-come, first-served" allocation of a scarce resource (time/space). Cutting the queue steals time from specific individuals behind you.
  *   **Moral Status:** High. It violates a duty of fairness to specific others.

  **Tipping (Economic Complicity):**
  *   **Normative Force:** Institutional obligation / Harm mitigation.
  *   **Why it binds:** In the US/UK, tipping isn't just a convention; it is a **substitute for a living wage.**
  *   **Moral Status:** Complex. If you don't tip, you aren't breaking a coordination rule (like driving on the left); you are directly reducing a worker's income. However, one could argue the *moral obligation* is on the employer, not the customer.
  *   **The Difference:** Queueing is about *fair access*. Tipping is about *distributing cost*. Treating them as the same "coordination debt" obscures the fact that tipping is often a moral failure of the *system*, whereas queueing is a moral failure of the *individual*.

  **Jaywalking (Risk/Harm):**
  *   **Normative Force:** Safety / Non-maleficence.
  *   **Why it binds:** It creates risk.
  *   **The Difference:** Queueing is about fairness; Jaywalking is about harm. If you jaywalk on an empty road at 3 AM, is it immoral? A contractualist says "you broke the rule." A consequentialist says "no harm, no foul." This shows why treating all conventions as equal moral obligations fails.

  ### 4. Answering Your Specific Question
  You asked: *"Can you help me untangle whether the mistake is thinking that moral binding always needs consent, or whether it's treating risk-based norms and distributive norms as the same thing?"*

  **The Answer:** It is **both**, but they operate at different levels.

  1.  **The Fundamental Error (Meta-Ethical):** Thinking moral binding needs consent. This is the "false presupposition" your tutor flagged. Conventions bind us because of **Fair Play** and **Consequences**, not because we agreed to them. If you fix this, your "Coordination Debt" theory becomes the "Principle of Fair Play."
  2.  **The Nuance Error (Normative):** Treating risk-based norms (jaywalking) and distributive norms (queueing) as the same thing. Once you remove the need for consent, you still need to explain *why* the obligation exists.
      *   For Queueing, the obligation is **Fairness.**
      *   For Jaywalking, the obligation is **Safety.**
      *   For Tipping, the obligation is **Complicity.**

  If you lump them all under "Coordination Debt," you lose the ability to explain why jaywalking on an empty road feels less wrong than cutting a queue.

  ### 5. Suggested Essay Structure
  To get high marks, I would suggest structuring the argument like this:

  1.  **Introduction:** Define "Coordination Debt." Acknowledge the intuition that we owe compliance to systems we benefit from.
  2.  **The Contractualist Trap:** Address your tutor's point. Argue that conventions are not contracts. Use the **Principle of Fair Play** (Hart/Rawls) to replace "Consent" with "Reciprocity."
  3.  **The Tourist Counter-Example:** Introduce Nozick's critique (imposed benefits). Argue that the obligation arises not from *accepting* the benefit, but from *using* the shared resource while relying on others' restraint.
  4.  **Distinguishing the Norms (Your Insight):**
      *   Argue that "Coordination Debt" is too broad.
      *   Distinguish **Distributive Conventions** (Queueing: violation = unfairness to specific persons).
      *   Distinguish **Safety Conventions** (Jaywalking: violation = probabilistic harm).
      *   Distinguish **Economic Conventions** (Tipping: violation = direct financial loss, but highlights systemic injustice).
  5.  **Conclusion:** Conclude that everyday conventions *are* moral obligations, but not because we consented to them. They are obligations because violating them constitutes **free-riding** (queueing) or **recklessness** (jaywalking). The "debt" is owed to the *community*, not the *contract*.

  ### Key Philosophical Terms to Use
  *   **The Principle of Fair Play:** (Hart/Rawls) The idea that receiving benefits from a cooperative scheme creates an obligation to cooperate.
  *   **Free-Rider Problem:** Benefiting from the rule-following of others without following the rules oneself.
  *   **Malum in se vs. Malum prohibitum:** Wrong in itself (murder) vs. wrong because prohibited (jaywalking). You are arguing that some *malum prohibitum* actally function as *malum in se* due to their social impact.
  *   **Tacit Consent:** (Locke) The idea that by staying in a country or using a road, you agree to the rules. (Be careful with this; many philosophers reject tacit consent as too weak).

  You have a very strong instinct for the "Tourist" problem—that is the hinge on which your essay will turn. If you can explain why the tourist *does* or *does not* owe the debt without using "contract" language, you will answer your tutor's critique perfectly.
