  The wine bottle was nearly empty, sitting between the remnants of a roast that had gone cold twenty minutes ago. Elias swirled the last inch in his glass, staring into the red vortex like it might offer a proof.

  "You're doing the thing again," Mara said, tearing a piece of bread. "The furrow. You're furrowing."

  Elias looked up, smiling faintly. "I'm thinking about the crack."

  "Of course you are. We're having dinner, Elias. Not a symposium."

  "It's not going away, Mara. If ZFC is inconsistent, it's not just a typo in the margin. It's a contradiction in the rules of the game."

  "We've been over this. Suppose it is inconsistent. Suppose there's a proof somewhere that one equals zero, but the proof is so long it would take a supercomputer the age of the universe to write it down. And suppose the contradiction only lives way up in the stratosphere, among the measurable cardinals and the huge infinities. Down here? Where I calculate stress loads and you count change? Nothing changes."

  "That's the quarantine argument," Elias said, pointing the stem of his glass at her. "And it's wrong. You're treating math like a house. You say, 'Oh, the termites are in the attic, but I live in the kitchen, so I'm safe.'"

  "Exactly."

  "But math isn't a house. It's a chain. Or better, it's a web of implication. If there's a contradiction anywhere in the axioms, logically, *everything* becomes provable. True and false collapse. It doesn't matter if the contradiction is 'high up.' Logic doesn't respect altitude. If the foundation is cracked, the whole structure is technically rubble, even if the kitchen walls are still standing."

  Mara leaned back, crossing her arms. "Okay, fine. Technically rubble. But empirically? The kitchen works. The lights turn on. I use calculus to model fluid dynamics every day. If the foundation were truly rotten, wouldn't I see glitches? Wouldn't the numbers start misbehaving in the lowlands? Why should damage we can't detect, in a region we never visit, shake belief in the numbers we use to build bridges?"

  "Because it changes what the numbers *are*," Elias said, his voice quiet but intense. "You're talking about utility. I'm talking about truth. If the axioms are inconsistent, then math isn't describing an objective reality anymore. It's just a game we haven't lost yet. You're saying it's okay to live in a building that's technically collapsed, as long as the ceiling hasn't hit your head."

  "I'm saying the ceiling isn't going to hit my head. There's a difference between 'logical possibility of explosion' and 'actual experience of stability.' If the contradiction is quarantined behind a wall of complexity we can't breach, then for all human intents and purposes, it doesn't exist."

  "But it *does* exist," Elias pressed. "That's the point. You're conflating 'we haven't found it' with 'it isn't there.' If math is supposed to be this eternal, perfect language of the universe—and you know I think it is—then it can't have hidden rot. A truth that relies on us not looking too closely isn't truth. It's just a useful fiction."

  Mara paused, picking up her wine glass. She looked at him over the rim. "So what's the alternative? We declare all mathematics void until we have a guarantee of consistency we can never actually get? Because we know we can't prove consistency from the inside. You know that."

  "I know," Elias sighed, rubbing his temple. "I'm not saying we stop doing math. I'm saying we stop pretending it's solid ground. If there's a contradiction in the large cardinals, it means our intuition about infinity is broken. And if our intuition about infinity is broken, why do we trust our intuition about finite numbers? They come from the same source. The same axioms."

  "Because finite numbers behave," Mara said. "They don't care about infinity. I can count three apples without knowing what a Aleph-number is. The quarantine works because the dependency flows one way. The high stuff needs the low stuff, but the low stuff doesn't need the high stuff. I don't need to know about the attic to cook dinner."

  Elias shook his head. "The axioms support the whole thing. You don't get to pick and choose which axioms apply to which numbers once you've committed to the system. If the system is flawed, the flaw is everywhere, even if it's only visible through a telescope we don't have."

  He paused, taking a sip of wine, thinking. "Look. Imagine you're navigating by stars. You plot your course perfectly. But suppose there's a distortion in the light from one of those stars way out in the deep field. You don't see it. You arrive at your island. You say, 'See? The navigation works.' But the map was wrong. You got lucky."

  "I didn't get lucky," Mara countered. "I used triangulation. I used multiple stars. If one was wrong, the others would catch it. That's what peer review is. That's what application is. If there was a contradiction leaking down from the large cardinals, it would create noise in the lower levels. We'd see inconsistencies in physics, in computation. We don't."

  "Or," Elias said, "the noise is too quiet. Or we're interpreting the noise as something else."

  He leaned forward, resting his elbows on the table. "I'm not trying to say you should stop building bridges. I'm saying... if you knew there was a one percent chance the laws of physics were locally inconsistent, would you call them laws? Or would you call them habits?"

  "Habits," Mara said softly. She traced the rim of her glass. "Is that what you think? That math is just a habit of the universe?"

  "I think if the foundation is cracked, 'objective reality' is the wrong label. It becomes... contingent. It becomes something that works *for us*, here, in this corner of the logical space. But not universally true."

  Mara was quiet for a moment. The house settled around them, a creak in the floorboards.

  "Okay," she said finally. "I hear you. If the axioms are inconsistent, then Platonism is dead. There's no perfect realm of forms. But Elias... does it matter? If the bridge holds, if the encryption secures the data, if the orbit is calculated correctly... isn't that a kind of truth? Maybe not the eternal, divine truth you want. But a human truth."

  "It matters to me," Elias said. "Because I want to know if I'm discovering something or just inventing a game that hasn't broken yet."

  "And I want to know if I can cross the river," Mara said. She reached over and topped off his glass, then hers. "Maybe we're both right. Maybe the attic is on fire, but the kitchen is safe. And maybe... maybe the fact that the kitchen is safe is the only truth that actually fits in a human mind."

  Elias looked at the wine, then at her. The tension in his shoulders dropped an inch. "So we agree to disagree on the ontology, but agree on the utility?"

  "We agree that the wine is good," Mara said, raising her glass. "And that the house hasn't collapsed yet."

  Elias clinked his glass against hers. "To the house not collapsing."

  "And to the termites staying in the attic," she added.

  "For tonight," he said, and drank.
