  To definitively distinguish between **Rule A (Stranger Constraint)** and **Rule B (Easy Rescue Exception)**, you should present her with the following case:

  **The Case of the Expensive Suit:**
  > "You are walking past the same shallow pond. You see the same toddler drowning. You can save him, but you are wearing a bespoke suit worth $5,000. Stepping in will ruin the suit completely. You can afford the loss, but it is a significant financial hit (comparable to the 'substantial share of income' charity case). There is no physical danger to you."

  **Why this tells the rules apart:**
  *   **Rule A (Stranger Constraint)** predicts **Supererogatory**. Since aid to strangers is always optional, and the cost is now "significant" (like the substantial charity), it moves from Nicety to Supererogatory.
  *   **Rule B (Easy Rescue Exception)** predicts **Obligatory** (or arguably Supererogatory, but likely Obligatory). If the duty is based on the *value of the life* vs. *mere inconvenience*, money might not override the duty to save a life. However, if her "Substantial Charity" verdict was driven purely by financial cost, she might call this Supererogatory.

  **A Sharper Tie-Breaker:**
  If you want to isolate the **Physical vs. Abstract** distinction (which is the real tension between the $20 Charity and the Pond):

  **The Case of the Choking Stranger:**
  > "You are eating lunch in a public park. A stranger at the next table begins choking on a piece of food. You know the Heimlich maneuver. Performing it requires close physical contact and a minor interruption to your meal, but no financial cost or physical risk."

  *   **If she says Obligatory:** She distinguishes between *physical rescue* (Obligatory) and *financial aid* (Nicety/Super). This confirms **Rule B** and supports the Pond verdict being Obligatory.
  *   **If she says Nicety:** She treats all stranger aid as optional regardless of physical proximity. This supports **Rule A** and suggests she might actually call the Pond case a Nicety (which would make her an outlier in common moral intuition).

  **Summary:**
  She will likely say the rescue is **Obligatory**. Her framework reserves "Supererogatory" for high-sacrifice acts. Since the pond rescue is low-sacrifice, it cannot be supererogatory. Since letting a child die is blameworthy (unlike refusing a kidney), it cannot be a mere nicety. Thus, it must be a duty.
