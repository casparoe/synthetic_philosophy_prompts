answer: |-
  ### Essay Question

  **The Mirror Test Diagnostic**

  Consider the "Mirror Test" diagnostic: take any ontological argument, form its dual by swapping the governing evaluative predicate (e.g., *greatness* becomes *dreadfulness*; *positive* becomes *anti-positive*), and re-run the argument with identical structural machinery (same modal logic, same treatment of existence, same closure axioms).

  Write an essay evaluating the Ontological Argument through this diagnostic. You must commit to a specific verdict: does the Classical (Anselmian) or Modal (Plantingian) version survive the Mirror Test, and where exactly does the symmetry break? In your analysis, you must address: (1) how the dual applies to Anselm's *Proslogion* II; (2) which specific premise in the Modal Argument blocks the dual; (3) whether this test is merely a Gaunilo-style parody in fancy dress; (4) whether the test is too strong (i.e., would it invalidate respectable a priori arguments like mathematics); and (5) what philosophical work the test is actually doing if it is not simply detecting formal invalidity.

  Do not survey options. Defend a single position on which premise is unsound.

  ***

  ### Model Answer

  The Mirror Test is not a parody; it is a stress test for axiological premises. Applying it reveals that while the Classical Ontological Argument collapses immediately under dualization, the Modal Argument survives formally but fails materially at the definition of "positive property." I argue that the Modal Argument fails the test because the asymmetry required to block the dual is question-begging, rendering the "Positive Property" axiom the unsound locus of the proof.

  Applied to Anselm's *Proslogion* II, the Mirror Test is devastatingly efficient. Anselm argues that a being that exists in reality is greater than one existing in the understanding alone. The dual argument posits "that than which nothing worse can be conceived." If existence in reality makes a being greater, does it also make a being worse? Intuitively, no. Existence is a greatness-maker, not a dreadfulness-maker. Therefore, the dual fails because the predicate swap breaks the link between existence and the evaluative scale. Anselm's argument relies on the implicit premise that existence is a perfection. The Mirror Test exposes this not as a logical truth, but as a value judgment. The Classical argument fails the test because its machinery relies on a unidirectional valuation of existence that the dual cannot mimic without absurdity.

  The Modal Ontological Argument (Plantinga) is more robust structurally but succumbs to the same diagnostic at a deeper level. Plantinga defines a "maximally great being" as one possessing maximal excellence in every possible world, where maximal excellence entails omniscience, omnipotence, and moral perfection. The crucial axiom is that "necessary existence" is a positive property. To run the Mirror Test, we define a "maximally dreadful being" possessing "anti-positive" properties. If necessary existence is positive, is necessary non-existence (or necessary dreadful existence) anti-positive? If the logic holds, a necessarily dreadful being exists. To block this, the Plantingian must assert that necessary existence is *only* positive, not neutral. This breaks the symmetry. The specific premise that blocks the dual is the axiom that positive properties are closed under entailment and that necessary existence is uniquely positive. The Mirror Test shows this axiom carries the entire load of the argument. Without the independent justification that "positive" is not arbitrary, the machinery proves too much.

  Is this merely Gaunilo's Perfect Island in fancy dress? No. Gaunilo attacked the coherence of the concept (one can conceive of an island, but that doesn't entail existence). The Mirror Test accepts the coherence of the concepts but attacks the *axiological symmetry*. Gaunilo says, "You can't do that with islands." The Mirror Test says, "If you can do that with greatness, you must be able to do it with dreadfulness using the same rules." It targets the modal machinery's interaction with value predicates, not the conceivability of the subject.

  Is the test too strong? Would it invalidate mathematics? No. Mathematical proofs (e.g., the existence of primes) do not rely on evaluative predicates like "good" or "positive." They rely on structural definitions. The Mirror Test specifically targets arguments where existence is derived from value-laden definitions. It does not overgenerate to non-evaluative a priori truths. Therefore, the test is precise, not blunt.

  Ultimately, the Mirror Test detects not formal invalidity, but hidden question-begging. It reveals that the Ontological Argument is not a logical discovery but a value assertion smuggled into a modal framework. The test shows that the argument works only if one already accepts the specific valuation of existence as a perfection.

  My verdict is that the Modal Argument fails the Mirror Test. The single step I would put money on being unsound is the axiom that "necessary existence is a positive property." This premise is not a logical truth but a theological assertion. The Mirror Test proves that if you swap the value, you get a devil. Since the logic allows both, the value premise is the variable, not the logic. The argument does not prove God; it proves that if you define God as necessary and positive, you get a necessary positive being. The Mirror Test shows the definition is doing all the work.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Application to Anselm (4 Marks)**
  *   **Criteria:** Student identifies that the Anselmian dual fails because existence is treated as a greatness-maker, not a dreadfulness-maker, breaking the dual's first step.
  *   **Common Miss:** Students claim Anselm's argument is valid but unsound without addressing how the *dual* specifically collapses on the existence/greatness link.

  **2. Application to Modal OA & Symmetry Break (4 Marks)**
  *   **Criteria:** Student identifies the specific axiom in the Modal version that blocks the dual (usually the definition of "Positive Property" or the valuation of Necessary Existence).
  *   **Common Miss:** Students argue the Modal logic (S5) itself is the problem, rather than the axiological premise feeding into the logic.

  **3. Gaunilo Distinction (4 Marks)**
  *   **Criteria:** Student distinguishes the Mirror Test (structural/axiological symmetry) from Gaunilo (conceptual coherence/parody), noting the Test accepts coherence but challenges value neutrality.
  *   **Common Miss:** Students treat the Mirror Test as identical to the Perfect Island objection, missing the focus on modal machinery and predicates.

  **4. Test Strength/Overgeneration (4 Marks)**
  *   **Criteria:** Student argues the test does not invalidate non-evaluative a priori arguments (like mathematics), showing the test is specific to axiological ontology.
  *   **Common Miss:** Students argue the test disproves all a priori reasoning, failing to notice math lacks evaluative predicates.

  **5. Verdict & Function of Test (4 Marks)**
  *   **Criteria:** Student commits to a verdict (Argument Fails) and identifies the test's function as detecting question-begging value premises rather than formal invalidity.
  *   **Common Miss:** Students remain agnostic ("both sides have merit") or claim the test proves the argument is formally invalid rather than premise-begging.
