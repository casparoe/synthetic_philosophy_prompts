answer: |-
  Dave had been blind since birth, but after successful cataract surgery, his friends threw a "Welcome to the Visible World" party. Naturally, someone brought out a wooden cube and a rubber sphere.

  "Okay, Dave," said his friend Eddie, leaning forward. "Don't touch them. Just look. Which one is the cube?"

  Dave squinted at the objects floating in his new visual field. "Uh… the brown one? Or the round one?"

  "See?" Eddie said, turning to the other guest, Ray. "He can't do it. His mind is a blank slate. He needs to touch them to build the association between feel and sight. Knowledge comes from experience."

  Ray scoffed, adjusting his glasses. "Nonsense. The geometry is innate. His mind already contains the concepts of 'square' and 'round.' He should be able to deduce it through pure reason. He's just not thinking hard enough."

  Dave, tired of being debated like a thesis, reached out and grabbed the wooden object. He winced. "Ouch. Okay, this pointy one is the cube."

  Eddie slammed his hand on the table. "Ha! Sensory feedback! You needed the data from your hands to correct your eyes. Empiricism wins!"

  "No, no," Ray insisted. "The touch merely triggered the latent idea already sleeping in his intellect. He recognized the sharpness because his mind knows what an angle is. Rationalism wins!"

  Dave wrapped a bandage around his finger, looked at both of them, and sighed. "You know, one of you says I need to learn everything from scratch, and the other says I should have been born knowing it."

  "Exactly!" they both said.

  Dave stood up and headed for the door. "Well, empirically, I'm confused. But rationally, you guys are annoying."
