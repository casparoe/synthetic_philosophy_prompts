answer: |-
  There is no single established term for this specific Bayesian shape, but the underlying structure is an ancient epistemological problem known as **The Problem of Criterion**, and it is fully compatible with Aumann's Agreement Theorem because that theorem requires common priors, which your subjects lack.

  Here is the breakdown of the concept, the math, and the boundaries.

  **The Established Concept**
  The recursive structure you describe—where you need a rule to judge claims, but a claim to judge the rule—is formally known as **The Problem of Criterion** (or the *Diallelus*). In modern epistemology, this splits thinkers into "particularists" (who start with specific known truths to derive rules) and "methodists" (who start with rules to derive truths). Your subjects are pretending to be methodists ("let's agree on a rule for priors") but acting as particularists (choosing the rule that validates their existing prior). While "The Problem of Criterion" is the established name for the *structure*, there is no canonical single noun for its specific application to Bayesian prior selection. You will often see this described simply as **"The Subjectivity of Priors"** or **"Prior Sensitivity,"** but those terms miss the recursive rule-selection layer you identified.

  **The Aumann Constraint**
  You are right to check this, but your scenario does not violate **Aumann's Agreement Theorem**. The theorem states that two rational agents with **common priors** and common knowledge of each other's posteriors cannot agree to disagree. Your subjects explicitly have *different* priors. Aumann does not say people with different priors must converge; it says people with the *same* priors must converge. Since your subjects locate their disagreement in the prior itself, Aumann permits them to disagree forever, even with unlimited patience and perfect honesty. The theorem collapses the moment the "common prior" assumption is dropped, which is exactly where your story lives.

  **Coining the Shape**
  Since "The Problem of Criterion" is too broad (it applies to all knowledge, not just stats) and "Prior Subjectivity" is too flat (it misses the recursion), I recommend labeling this **"The Prior Validation Loop."**

  *   **Definition:** A stalemate where disputants agree on the necessity of a neutral selection rule for priors, but systematically select meta-rules that ratify their original intuitive priors, causing disagreement to persist across recursive levels of justification.
  *   **Boundary Case 1 (Ordinary Disagreement):** New data arrives that overwhelms the prior. The loop breaks because the likelihood function dominates the prior. If the data could settle it, it's not a Validation Loop.
  *   **Boundary Case 2 (Motivated Reasoning):** One party has a financial or ideological stake in the outcome. If stakes are present, call it motivated reasoning. The Validation Loop is distinct because it persists even when both parties are disinterested and genuinely seeking truth.
  *   **Boundary Case 3 (Deep Disagreement):** The parties disagree on the rules of logic or what counts as evidence. In the Validation Loop, they agree on the machinery (Bayes, logic, data) but not the initialization.

  **Confidence and Uncertainty**
  I am 95% confident that "The Problem of Criterion" is the correct ancestral concept for the recursive structure you described. I am 99% confident in the interpretation of Aumann's Theorem regarding common priors. I am 70% confident that no niche statistician or philosopher of science has coined a more specific term for the Bayesian variant in the last decade; the field tends to just call this "prior sensitivity" or "subjective Bayesianism."

  **The Point I'm Least Sure Of**
  My least certain claim is whether a specific sub-field (like objective Bayesianism) has a specialized slang term for the phenomenon of selecting a "non-informative prior" that accidentally encodes information. There are technical discussions about "informational priors" vs. "reference priors," and critics often argue that reference priors are subjective, but I am not certain there is a catchy, established label for the *psychological/argumentative loop* of selecting the reference prior to match the intuition. If you find one, it will likely be in the literature on **Objective Bayesianism** or **Maximum Entropy methods**, where the debate over "which entropy measure is truly neutral" mirrors your exact shape.
