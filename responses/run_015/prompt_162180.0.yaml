              *   So: 1. Beef Worst (GHG/Land). 2. Chicken Worst (Insects). 3. Beef Worst? Or Beef Best?
              *   Let's not get bogged down in the ethics, just the *placement*. It goes after the land-use discussion, as a complication to the "land sparing is good" assumption.
      *   **Objections Timing:**
          *   "Rounding error": Address in intro when setting scope (we are discussing moral accounting, not market impact).
          *   "Wouldn't exist": Address when discussing the insects/wild animals. They exist regardless.
      *   **Final Question:** "What variable would make you switch back?"

  5.  **Drafting the Content (adhering to constraints):**
      *   Word count < 600.
      *   Short paragraphs.
      *   No bullets.
      *   No numbers.

      *   *Drafting thought:* Start with the unit. Then the case. Then the wrinkles. Then the objections. Then the exit question. Then the exclusions.

