      Start with normalization. You are correct; per-calorie normalization must land first. If you let them anchor on per-animal suffering, the rest of the math fails. Open by asserting we are comparing units of nutrition, not units of life. This preempts the intuition that a cow's death outweighs a chicken's simply due to size.

      The single comparison case must be grass-fed beef versus grain-fed chicken. This specific pairing isolates the land-use variable. You need beef that does not compete for crop land and chicken that does. Exclude feedlot beef from the discussion entirely; if both animals eat crops, the insect argument collapses into a efficiency contest, which muddies the water.

