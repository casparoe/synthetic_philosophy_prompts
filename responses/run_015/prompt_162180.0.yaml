  Start with normalization. You are correct; per-calorie normalization must land first. If you let them anchor on per-animal suffering, the rest of the math fails. Open by asserting we are comparing units of nutrition, not units of life. This preempts the intuition that a cow's death outweighs a chicken's simply due to size.

  The single comparison case must be grass-fed beef versus grain-fed chicken. This specific pairing isolates the land-use variable. You need beef that does not compete for crop land and chicken that does. Exclude feedlot beef from the discussion entirely; if both animals eat crops, the insect argument collapses into an efficiency contest, which muddies the water.

  Sequence the discussion in three movements. First, establish the crop-cultivation cost. Guide them to see how grain-fed chicken multiplies insect deaths per calorie compared to grass-fed beef. This flips the standard chart. Second, introduce the land-use difference. Beef requires more territory. Third, deploy the wild suffering wrinkle here. If sparing land creates wild habitat, and wild suffering is net negative, then the land efficiency of chicken becomes a moral liability. This flips the ranking again. Place this last because it depends on accepting the land-use premise established in step two.

  Defuse the rounding error objection immediately during the opening framing. State explicitly that this session is about moral accounting structure, not market elasticity. If you wait until someone raises it, you have already lost the frame. Handle the wouldn't have existed objection during the insect segment. Clarify that harvest deaths are a side effect of cultivation, not a reason for existence, so the non-identity problem does not apply to field insects.

  Refuse to discuss greenhouse gases. Your audience already accepts that premise, and reintroducing it competes for cognitive load. Do not entertain specific mortality figures or hectares-per-kilogram data. If you invite numbers, you invite fact-checking, and the session becomes a debate over data sources rather than moral structure. Keep it qualitative.

  End with a question that tests structural grasp. Do not ask who is worst. Ask them to identify which parameter change would reverse their conclusion. A participant who simply swapped slogans will say chicken is worst. A participant who understands the structure will say it depends on the weight assigned to wild suffering versus insect deaths. This distinguishes flexibility from dogma.

  The wild suffering wrinkle does not derail if presented as a conditional. Frame it as if your view counts wild suffering, then X. If they reject the premise, the logic still holds for those who accept it. It serves as the stress test for the land-use argument.
