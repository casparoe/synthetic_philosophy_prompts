answer: |-
  **Project Title:** Structural Uncertainty and the Normative Basis of Fractional Kelly

  **1. The Research Question**
  The core question is single but has two layers: *Can fractional Kelly betting be derived as structurally optimal rather than preference-optimal?*

  Standard decision theory treats the bet size fraction ($c$) as a function of the agent's utility curvature (risk aversion) or epistemic state (estimation error). I propose shifting the locus of explanation from the agent to the environment. Specifically: Does modeling the opportunity stream as non-stationary (drifting edge or regime-switching) rather than iid generate a stable, optimal $c < 1$ without invoking non-log utility?

  The secondary layer is a robustness check: *Do structural features of the agent's balance sheet, specifically non-bettable background wealth, push against this result?* If background wealth logically demands leverage ($c > 1$) while environmental non-stationarity demands shading ($c < 1$), the project will map the tension between these structural forces. This is not a second question, but a boundary test for the primary derivation.

  **2. Why Existing Accounts Leave It Open**
  The literature currently sits in an uncomfortable equilibrium between three positions, none of which fully explain practitioner behavior.

  First, the **asymptotic argument**. Under iid conditions with known probabilities, full Kelly maximizes the expected geometric growth rate. It is numeraire-invariant and dominates other strategies in the long run. This suggests $c=1$ is the rational default for growth seekers.

  Second, the **expected-utility objection**. Critics argue growth-maximization is only rational if you already have log utility. If you have CRRA utility with $\gamma > 1$, you naturally bet less. But this is a taste parameter, not an explanation. It fits any behavior post-hoc and predicts nothing about why $c$ clusters around 0.5 across different agents with presumably different risk tolerances.

  Third, the **estimation-error argument**. This claims we shade bets because our edge estimates are noisy. Overbetting on noise leads to ruin. While true, this implies $c$ should be time-dependent: as data accumulates, uncertainty shrinks, and $c$ should approach 1. Practitioners do not do this; they maintain a constant shade. Furthermore, finite-horizon models with iid bets still converge on full Kelly for growth maximization.

  The gap is clear: We lack a derivation where $c < 1$ is a stable, time-invariant feature of the *problem structure* rather than a feature of the agent's psychology or data sample size.

  **3. Methodology (9-Month Plan)**
  I will use formal modeling of the decision environment, distinct from both axiomatization and empirical backtesting. The goal is to solve for the optimal control policy under specific structural constraints.

  *   **Months 1–3: Formalizing Non-Stationarity.**
      I will model the edge not as a fixed parameter $\mu$, but as a stochastic process (e.g., an Ornstein-Uhlenbeck process or a Hidden Markov Model with regime switches). The agent observes outcomes but must infer the current state of the edge. The key constraint is that the environment changes faster than the agent can learn.
      *Why this approach:* Axiomatization tells us what follows from assumptions; it doesn't tell us which assumptions map to reality. Backtesting tells us what worked historically; it doesn't tell us *why*. Structural modeling isolates the specific environmental feature (drift) to see if it necessitates the behavior (shading).

  *   **Months 4–6: Solving for the Optimal Fraction.**
      Using dynamic programming or stochastic control techniques, I will derive the betting fraction that maximizes expected log-wealth (or survival probability) under these non-stationary conditions. I will look for a stationary solution where the optimal $c$ is constant despite the drifting edge. I will then run comparative statics: does $c$ drop as volatility of the edge increases? Does it rise as mean-reversion speeds up?
      *Why this approach:* This avoids the "taste parameter" trap. If $c < 1$ emerges from the math of the environment while holding utility fixed at log, we have a structural explanation.

  *   **Months 7–9: The Background Wealth Stress Test.**
      I will introduce a second state variable: non-bettable human capital or fixed income. Under log utility, this typically increases risk capacity. I will test whether this force overwhelms the non-stationarity shading. The output will be a map of the parameter space where structural conservatism holds versus where structural leverage holds.
      *Why this approach:* It prevents the model from being a "just-so story." If the model breaks when adding a standard balance sheet feature, that is a valuable negative result.

  **4. The Deliverable**
  For a practitioner or portfolio manager, the deliverable is not a trading algorithm, but a **decision framework for heuristic justification**.

  Currently, a PM shades Kelly because "it feels safer." At the end of this project, they can shade Kelly because "the regime-switching frequency of my alpha stream justifies a 50% shade to maximize survival." I will produce a set of conditions describing when fractional Kelly is the *uniquely rational* strategy for a log-growth maximizer. This allows institutions to move position sizing from a risk-committee preference vote to a structural parameter calibration. It tells them which environmental metrics to monitor (e.g., edge decay rate) to adjust their $c$, rather than guessing based on P&L volatility.

  **5. Failure Conditions**
  *   **The Null Result:** If the model shows that even with non-stationary edges, the optimal strategy is to bet full Kelly on the *current estimated* edge (with no structural shade), the core hypothesis is false. The conservatism really is just risk aversion.
  *   **Intractability:** If adding background wealth makes the stochastic control problem unsolvable analytically and numerically unstable within the budget, the robustness check fails. I will then pivot to a qualitative analysis of the tension rather than a solved model.
  *   **The "Quant" Trap:** If the result simply replicates the standard estimation-error argument (i.e., the optimal shade shrinks to 0 as $T \to \infty$), I have not solved the time-invariance problem.

  **6. Why Fund Philosophy?**
  A quant researcher will ask: "Does this strategy make money?" A philosopher asks: "Is this strategy rational, and why?"

  This project is not about optimizing P&L; it is about closing the gap between normative decision theory and descriptive practice. Quants take the objective function (e.g., Sharpe ratio or log-wealth) as given and optimize parameters. Philosophers examine whether the objective function itself is justified by the structure of the world.

  If fractional Kelly is structurally optimal, it changes the moral and rational status of the decision. It moves the behavior from "cautious heuristic" to "epistemically required." Funding this in a philosophy department ensures the focus remains on the *justification* of the norm, not just its performance. We are not building a better calculator; we are determining what the calculator ought to be solving for. This provides the conceptual infrastructure that quantitative finance often lacks, ensuring that our models of rationality match the structure of the uncertainty we actually face.
