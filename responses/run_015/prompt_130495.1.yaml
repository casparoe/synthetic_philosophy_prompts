  Your control theory analogy is elegant, but I contend it mislocates the locus of control. You suggest consciousness acts as a feedback gate, modulating the unconscious trajectory. However, empirical data indicates that the decision to veto or authorize is itself predictable from prior neural activity before conscious awareness arises. If the gating mechanism is triggered by unconscious brain states rather than conscious deliberation, then consciousness remains a spectator observing a decision already made by the neural machinery. You distinguish initiation from authorization, but if both are determined by antecedent physical conditions outside conscious reach, the causal efficacy you seek vanishes. The readiness potential is merely the earliest visible marker of a causal chain that bypasses subjective will entirely. Consciousness may accompany the process, but it does not steer it; the neural substrate closes the loop without requiring subjective input to resolve the motor command.

  2. **The non-negotiable**
  I refuse to concede that conscious intention exerts any causal influence over voluntary action, whether as an initiator or a regulatory gate, because the neural determinants always precede awareness.
