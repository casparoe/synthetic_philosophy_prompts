  Here's a thinking process that leads to the suggested deliverable:

  1.  **Analyze the Request:**

      *   **User:** Member of a renewal panel for a mid-sized national research council. Funds whole groups (5-year programmatic grants, renewable once). High stakes (killing funding kills the group).
      *   **Problem:** Recent decisions went both ways (renewed a dud, axed a near-miss). Needs a *procedure*, not vibes.
      *   **Theoretical Basis:** Lakatos's Methodology of Scientific Research Programmes (MSRP). Needs to be translated into a practical checklist for scientists (no philosophy jargon on page 1).
      *   **Specific Requirements:**
          1.  Distinguish between "flat because instrument missing" vs. "flat because belt absorbing everything."
          2.  Detect "core-softening" (retroactively weakening the core to avoid falsification) vs. legitimate belt adjustment.
          3.  Handle "ad hoc" hypotheses that are only testable within the programme (Lakatos's degrees of ad hoc-ness).
          4.  Defaults for "we don't know" (cannot just default to renew).
          5.  Run on three specific cases (A, B, C).
          6.  Identify the "unlikeable answer."
          7.  **Constraints:** Fits on two pages (visually dense but readable), usable by a scientist in half a day, no naive falsificationism, admit where judgment calls exist, admit blind spots.
          8.  **Structure:** Plain language checklist first, mapping to Lakatos at the end.

  2.  **Deconstruct Lakatos for the Checklist:**

      *   *Hard Core:* The non-negotiable assumptions.
      *   *Protective Belt:* Auxiliary hypotheses, initial conditions, etc., that take the hit.
      *   *Positive Heuristic:* The plan for how to develop the programme (what to build, what to look for).
      *   *Negative Heuristic:* Don't attack the core.
      *   *Progressive vs. Degenerating:*
          *   *Theoretical Progress:* New concepts lead to new potential insights.
          *   *Empirical Progress:* Some of those insights are confirmed (novel facts).
          *   *Degenerating:* Only saving phenomena, no new predictions, or constant retrofitting.
      *   *Ad Hoc:*
          *   *Lakatos 1:* Saves the theory but predicts nothing new.
          *   *Lakatos 2:* Predicts something new but untestable/independent.
          *   *Lakatos 3:* Predicts something new and testable/independent (Good).
      *   *Core-Softening:* This isn't standard Lakatos terminology, but it maps to shifting the *Hard Core* into the *Belt* to save it, or redefining the Core so it's unfalsifiable. The checklist needs to catch if the "Core" is actually moving.

  3.  **Drafting the Checklist (Iterative Process):**

      *   *Goal:* Make it actionable. "Yes/No/Unknown" flow.
      *   *Step 1: Define the Core.* If they can't define what *would* kill the project, they are degenerating.
      *   *Step 2: Check the Belt.* Are changes predicting new things or just explaining old things? (Addresses Point 1 & 3).
      *   *Step 3: Check the Core Stability.* Has the core changed definition? (Addresses Point 2).
      *   *Step 4: Independence.* Can the new claims be tested outside their own ecosystem? (Addresses Point 3).
      *   *Step 5: The "Unknown" Default.* If we can't tell, what happens? The prompt says "not just renew." It needs to be "conditional renew" or "terminate." Given the high stakes, "Unknown" on core stability should probably trigger a warning/terminate, but "Unknown" on instrument availability (Case B) should trigger renew. I need to distinguish these.

      *Refining the "Unknown" Default:*
      *   If the issue is *external* capacity (instrument not built), default = Renew (with conditions).
      *   If the issue is *internal* clarity (can't say what would falsify), default = Terminate.
      *   If the issue is *ad hoc* nature (can't verify independence), default = Terminate (burden of proof on them).

      *Refining Core-Softening:*
      *   Question: "Compare the current core statement to the original grant. Is the new statement *harder* to falsify?" If Yes -> Degenerating signal.

      *Refining Ad Hoc (Point 3):*
      *   Question: "Does the new hypothesis offer a way to be checked by a method *not* designed by this group?" If No -> Ad Hoc warning.

  4.  **Drafting the Case Studies:**

      *   *Case A (Immune/Disease):* 40 papers, novel predictions, but shifting tissues and sliding clinical prediction.
          *   *Analysis:* Looks progressive (papers/predictions) but the *object* of explanation keeps moving. This is belt absorption. The core is "Mechanism X causes Disease Family Y." If they keep changing the tissue, are they testing the core or finding where it works? The clinical prediction sliding is the killer. It's degenerating empirically despite theoretical output.
          *   *Verdict:* Terminate. (This might be the "unlikeable answer" because 40 papers looks good).
      *   *Case B (Signal/Detector):* No data, detector 18 months out. Pre-registered abandonment criteria.
          *   *Analysis:* Theoretically progressive (they know what they are looking for). Empirically neutral (no data yet). Core is stable.
          *   *Verdict:* Renew. (This is the "axing one that was 18 months from landing" fix).
      *   *Case C (Core Softening):* "All mammals" -> "Most/Stress" -> "Regulatory Principle."
          *   *Analysis:* This is classic core-softening. The claim becomes less falsifiable over time.
          *   *Verdict:* Terminate. (This is the "renewed a group zero results deep" fix).

      *Which is the "unlikeable answer"?*
      *   Case A looks successful (40 papers). Killing a "productive" group is hard.
      *   Case C looks like "deepening understanding" (as they claim). Killing a "theoretical refinement" is hard.
      *   Case B is the easy "gamble."
      *   *Decision:* Case A is the most dangerous "false positive." 40 papers creates a sunk cost fallacy. But Case C is the specific "core-softening" example requested. The prompt asks "Tell me which of the three comes out with an answer I'm not going to like." Usually, panels like papers (A) and deep theory (C). They dislike empty hands (B). But the prompt says they *already* axed the near-miss (B type) and renewed the dud (A/C type). So the procedure should tell them to Renew B and Terminate A/C.
      *   *Wait, re-reading:* "We renewed a group that is now four years and zero real results deep [Like B? Or Like A with no results?], and axed one that most people now think was about eighteen months from landing something [Like B]."
      *   Okay, so they messed up B (axed them). They messed up A/C (renewed them).
      *   The procedure should say: Renew B, Terminate A, Terminate C.
      *   Which answer will they *not like*? Probably Terminating A. 40 papers is political cover. Terminating C is also hard because it sounds sophisticated. But A is the "busy work" trap. I will flag A as the politically difficult one because of the publication count.

  5.  **Drafting the "Blind Spots" & "Judgment Calls":**

      *   Must admit that Lakatos doesn't solve the "monopoly" problem (if one group holds the only paradigm).
      *   Must admit that "Core" definition is self-reported and can be gamed.
      *   Must admit that "Novelty" is sometimes in the eye of the beholder.

  6.  **Formatting for Two Pages:**

      *   Need tight spacing.
      *   Page 1: The Procedure (Checklist + Decision Tree).
      *   Page 2: Case Studies + Lakatos Mapping + Limitations.
      *   Font: Monospace or dense Serif simulation in markdown.
      *   No fluff.

  7.  **Refining the Content (Self-Correction during drafting):**

      *   *Constraint Check:* "No step that secretly amounts to 'has it been falsified'."
      *   *Correction:* Ensure the checklist focuses on *progress* (new content) rather than *truth*. A programme can be false but progressive. A programme can be true (so far) but degenerating.
      *   *Constraint Check:* "Plain language on front page."
      *   *Correction:* No "heuristic," "auxiliary," "empirical basis." Use "Plan," "Adjustments," "New Facts."
      *   *Constraint Check:* "Defaults for 'we don't know'."
      *   *Correction:* Make sure the "Unknown" path leads somewhere specific, not a shrug.

  8.  **Final Polish:**

      *   Ensure the "Core-Softening" question is sharp.
      *   Ensure the "Ad Hoc" question distinguishes independent testability.
      *   Ensure the Lakatos mapping at the end is accurate enough for the philosophers.
      *   Check the "Unlikely Answer" logic. Case A (40 papers) is the hardest to kill. Case C (Theoretical shift) is the easiest to excuse as "nuance." I'll bet on A being the painful one because of the "40 papers" metric which administrators love.

      *(Self-Correction on Case A vs C)*: Actually, Case C is the definition of the "core-softening" problem the user explicitly hates. But Case A is the "zero real results" (if clinical prediction is the result) vs "40 papers" (distraction). The prompt says they renewed a group "zero real results deep." Case A has 40 papers but no clinical result. Case C has theoretical shifts. Case B is the "18 months from landing."
      The procedure will likely say Terminate A and C, Renew B.
      The user says "Tell me which of the three comes out with an answer I'm not going to like."
      If they renewed the "zero results" group (A-ish), the procedure says Terminate. They won't like that because it admits the previous renewal was wrong.
      If they axed the "18 months" group (B-ish), the procedure says Renew. They won't like that because it admits the previous axing was wrong.
      However, usually, panels hate killing "productive" groups (A). I will focus on A being the politically hard kill due to publication volume masking degeneration.

      *Wait, one more check:* "No bibliography, no citations." "Plain language on front page." "Fits on two pages."
      I need to be very concise.

      *Let's structure the "Unknown" default carefully.*
      If "Can we test this independently?" = Unknown -> Terminate (Burden of proof on grantee).
      If "Is the instrument the bottleneck?" = Unknown -> Renew (Benefit of doubt on external factors).

      *Let's structure the "Core-Softening".*
      Question: "Does the new definition make it *harder* to prove them wrong than the old one?" Yes = Bad.

      *Let's structure the "Ad Hoc".*
      Question: "Does this new fix predict something *else* we can check, or does it just explain the glitch?" Just explain = Bad.

      *Okay, ready to write.*

      *(Final thought on Page Count)*: Markdown rendering varies. I will use compact headers and lists to ensure it *feels* like two dense pages.

      *(Final thought on "Unlikely Answer")*: I will select Case A. Why? Because 40 papers is a shield. Killing a "productive" group causes more noise than killing a "theoretical" group (C) or funding a "waiting" group (B).

      *(Final thought on Limitations)*: Must mention the "Monopoly" problem. If this group is the *only* one doing this, killing them kills the field. Lakatos doesn't account for sociological monopoly.

      *(Final thought on Naive Falsification)*: Ensure I don't say "If prediction fails, cut." I must say "If prediction fails, did they learn something new or just patch the hole?"

      *Let's assemble.*
answer: |-
  # RENEWAL PROCEDURE: RESEARCH PROGRAMME EVALUATION
  **For:** Panel Reviewers | **Time:** 30 Minutes per File | **Goal:** Distinguish Progress from Patching

  **INSTRUCTIONS:** Answer the five questions below in order. Do not skip. If you mark **UNKNOWN**, follow the specified default. Do not average the scores; a single "Stop" triggers a termination recommendation unless overridden by the "Monopoly Clause" (see Limitations).

  ### 1. THE CORE STABILITY CHECK
  **Question:** Compare the group's central claim in the original grant to their current summary. Is the current claim *harder* to falsify than the original? (e.g., changed from "Always" to "Usually," or "Mechanism X" to "Principle X".)
  *   **YES:** The core has softened to avoid risk. **(STOP → TERMINATE)**
  *   **NO:** The core remains specific and risky. **(PROCEED)**
  *   **UNKNOWN:** You cannot determine if the claim is weaker. **(DEFAULT → TERMINATE)**
      *   *Rationale:* Burden of proof is on the group to show they are testing ideas, not redefining them.

  ### 2. THE BELT ADJUSTMENT CHECK
  **Question:** Look at the changes they made when data didn't fit (the "protective belt"). Did these changes lead to a *new* prediction that was subsequently confirmed, or did they only explain the data that already existed?
  *   **ONLY EXPLAINED EXISTING DATA:** This is patching. **(STOP → TERMINATE)**
  *   **PREDICTED NEW DATA:** This is progress. **(PROCEED)**
  *   **UNKNOWN:** It is unclear if the prediction was made before the data was seen. **(DEFAULT → TERMINATE)**
      *   *Rationale:* Explaining the past is easy; predicting the future is hard.

  ### 3. THE INDEPENDENCE CHECK (Ad Hoc Test)
  **Question:** For their new adjustments/predictions: Can the test be performed using methods or data *not* generated by this specific group?
  *   **NO (Only they can test it):** The programme is talking to itself. **(STOP → TERMINATE)**
  *   **YES (Independent verification possible):** The programme connects to the wider world. **(PROCEED)**
  *   **UNKNOWN:** You cannot verify if independent tests exist. **(DEFAULT → TERMINATE)**
      *   *Rationale:* A healthy programme invites outside scrutiny; a degenerating one hides behind its own tools.

  ### 4. THE BOTTLENECK CHECK
  **Question:** Is the lack of confirmed results due to the group's theoretical choices, or an external instrument/facility delay?
  *   **THEORETICAL CHOICES:** They chose the wrong path. **(STOP → TERMINATE)**
  *   **EXTERNAL INSTRUMENT:** The tool doesn't exist yet, but the plan is clear. **(PROCEED)**
  *   **UNKNOWN:** It is unclear if the delay is internal or external. **(DEFAULT → RENEW WITH CONDITIONS)**
      *   *Rationale:* Do not punish groups for infrastructure delays, but do not fund theoretical drift.

  ### 5. THE NOVEL FACT COUNT
  **Question:** In the last 5 years, how many *novel* facts (phenomena not known when the grant started) have they confirmed?
  *   **ZERO:** No empirical growth. **(STOP → TERMINATE)**
  *   **ONE OR MORE:** Empirical growth exists. **(PROCEED → RENEW)**
  *   **UNKNOWN:** The novelty of the facts is disputed. **(DEFAULT → TERMINATE)**

  ---

  ### DECISION MATRIX
  *   **Any STOP above:** Recommend **TERMINATION**.
  *   **All PROCEED:** Recommend **RENEWAL**.
  *   **Monopoly Override:** If TERMINATION is the result, but this group is the *only* one in the country capable of asking this question, flag for Panel Chair. (See Limitations).

  ***

  # WORKED EXAMPLES & TECHNICAL APPENDIX

  ## CASE RUNS

  **A. The Immune Mechanism Group (40 papers, shifting tissues, sliding clinical prediction)**
  *   **Q1 (Core):** Core was "Mechanism drives Disease Family." Now testing different tissues constantly. *Verdict: Hard to say, but likely Softening.*
  *   **Q2 (Belt):** Predictions confirmed, but in different tissues than planned. *Verdict: Explaining existing data (finding where it works) vs Predicting.*
  *   **Q3 (Independence):** Likely high independence (clinical data).
  *   **Q4 (Bottleneck):** Theoretical choice (tissue hopping).
  *   **Q5 (Novel Facts):** Technically yes (40 papers), but are they novel facts or just new instances of the same claim?
  *   **VERDICT:** **TERMINATE.**
  *   **Why you won't like it:** 40 papers creates an illusion of productivity. Killing this group looks like punishing success. But the "sliding clinical prediction" indicates a degenerating problem shift—they are chasing fits, not risks.

  **B. The Signal Detector Group (No data, detector 18 months out, pre-registered abandonment)**
  *   **Q1 (Core):** Stable.
  *   **Q2 (Belt):** No adjustments needed yet.
  *   **Q3 (Independence):** Signal is independent of the group.
  *   **Q4 (Bottleneck):** **EXTERNAL INSTRUMENT.**
  *   **Q5 (Novel Facts):** Zero (due to bottleneck).
  *   **VERDICT:** **RENEW.**
  *   **Why:** Q4 overrides Q5. The programme is theoretically progressive (clear falsification criteria) but empirically stalled by external factors. This fixes the "axed 18 months from landing" error.

  **C. The Core-Softening Group ("All mammals" → "Regulatory Principle")**
  *   **Q1 (Core):** **YES.** "All mammals" is falsifiable; "Regulatory Principle" is vague. The claim is now harder to kill.
  *   **Q2 (Belt):** N/A (Core moved).
  *   **Q3 (Independence):** N/A.
  *   **Q4 (Bottleneck):** N/A.
  *   **Q5 (Novel Facts):** N/A.
  *   **VERDICT:** **TERMINATE.**
  *   **Why:** This is the definition of degeneration. They are retaining the funding brand while removing the scientific risk.

  ---

  ## MAPPING TO LAKATOS (FOR THE PHILOSOPHERS)
  *   **Q1 (Core Stability):** Tests the **Negative Heuristic**. If the Hard Core is modified to save the programme, it is no longer a Hard Core. This catches "Core-Softening."
  *   **Q2 (Belt Adjustment):** Distinguishes **Theoretical Progress** (new content) from **Degenerating Shift** (post-hoc accommodation).
  *   **Q3 (Independence):** Applies Lakatos's taxonomy of **Ad Hoc hypotheses**.
      *   *Ad Hoc 1:* Saves theory, predicts nothing new. (Fails Q2).
      *   *Ad Hoc 2:* Predicts new thing, but untestable/independent. (Fails Q3).
      *   *Ad Hoc 3:* Predicts new thing, testable/independent. (Passes Q3).
  *   **Q4 (Bottleneck):** Distinguishes **Empirical Degeneration** (theory is failing) from **Temporary Empirical Stasis** (tools are lacking). Lakatos allows for stasis if the Positive Heuristic is active.
  *   **Q5 (Novel Facts):** The ultimate criterion for a **Progressive Problem Shift**. A programme must anticipate novel facts, not just retrodict.

  ## LIMITATIONS & JUDGMENT CALLS
  **1. The Monopoly Problem (Systemic Blind Spot):**
  This procedure assumes a competitive marketplace of ideas. If Group C is the *only* group trained in this paradigm, terminating them kills the field's capacity to ask the question, even if the programme is degenerating. Lakatos does not solve this; it is a sociological constraint, not a methodological one. **Action:** Use the "Monopoly Override" only if the field will literally cease to exist without them.

  **2. The "Core" is Self-Reported:**
  Groups can game Q1 by writing vague cores initially. Reviewers must compare the *original grant text* to the *current text*, not just accept the group's summary of their own core.

  **3. Naive Falsification Warning:**
  Note that Q1/Q2 do **not** ask "Was the theory falsified?" A programme can be false but progressive (still generating new discoveries). A programme can be true (so far) but degenerating (no new discoveries). **Do not terminate simply because a prediction failed.** Terminate only if the failure led to patching rather than new insight.

  **4. The "Unknown" Default Bias:**
  The procedure defaults to **TERMINATE** on epistemic uncertainty (Q1, Q2, Q3, Q5). This is a value judgment: we prioritize avoiding false positives (funding duds) over false negatives (cutting good groups). This is intentional to correct for the panel's recent tendency to renew based on "vibes" or publication volume.

  **5. Judgment Call:**
  Q2 requires distinguishing between a "legitimate refinement" and a "patch." This is the hardest step. If the refinement opens a *new* line of inquiry, it is legitimate. If it only closes the hole where the data leaked, it is a patch.
