answer: |-
  You have spotted a genuine philosophical fault line, and your intuition about Karl Jaspers is spot-on. You are describing the tension between **individual moral agency** and **diachronic political continuity**.

  There isn't one single English word that captures this perfectly, but the framework you are looking for is best defined by the distinction between **Collective Guilt** and **Political Responsibility**.

  Here is the breakdown of the established philosophy, the specific terms, and how to define the boundary cases so it doesn't collapse into vague "groupthink."

  ### 1. The Jaspers Framework (You were right)
  In 1947, Karl Jaspers published *The Question of German Guilt* (*Die Schuldfrage*). He was trying to solve the exact problem you described: How do we talk about German guilt after the Holocaust without condemning every individual German to eternal moral damnation?

  He split guilt into four distinct categories. The one you are seeing on Twitter is **Political Guilt**.

  *   **Criminal Guilt:** Violation of laws. (Individual only. You did the killing.)
  *   **Moral Guilt:** Violation of conscience. (Individual only. You supported it silently.)
  *   **Metaphysical Guilt:** Solidarity as humans. (We all share a co-responsibility for every wrong in the world.)
  *   **Political Guilt:** **This is the one.** Jaspers argued that all citizens bear *political liability* for the actions of their state, simply by virtue of being members of that political order.

  **The Key Distinction:** Political guilt does not require personal sin. It is about **liability**, not **blame**.
  *   *Blame* says: "You are a bad person."
  *   *Liability* says: "You belong to the entity that broke this, so you belong to the entity that must fix it."

  When Twitter users say "France is guilty," they are using "guilt" colloquially to mean Jaspers' **Political Liability**. When they pivot to "but I didn't do it," they are correctly denying **Moral/Criminal Guilt**. The tension arises because they use the word "guilt" for both, which conflates *blame* with *obligation*.

  ### 2. The Arendt Correction: Responsibility vs. Guilt
  Hannah Arendt (Jaspers' contemporary and friend) refined this further. She argued that **guilt is always individual.** You cannot be *guilty* of something you did not do.

  However, she argued that **responsibility can be collective.**

  In her essay *Collective Responsibility*, she makes the distinction you are sensing:
  *   **Guilt:** Backward-looking. Who is to blame? (Always the individual perpetrator).
  *   **Responsibility:** Forward-looking. Who has to fix it? (Can be the collective).

  **The Software Engineering Analogy:**
  Think of the State as a **Codebase**.
  *   **Criminal/Moral Guilt:** The developer who wrote the buggy code that crashed production.
  *   **Political Responsibility:** The current maintainers of the repo.

  You (the current citizen) didn't write the legacy code (slavery/colonialism). You are not *guilty* of the bug. But you inherited the repo. If you want to keep using the software (living in the state/benefiting from its infrastructure), you inherit the **technical debt**. You are *responsible* for refactoring it, not because you wrote it, but because you are now the maintainer of the system.

  ### 3. The Metaphysics: "The Continuous Soul"
  You asked about the "continuous guilty soul that survives even though every citizen got replaced." In philosophy of law and political science, this is called **Corporate Personhood** or **State Continuity**.

  The State is treated as a **juridical person**. It is distinct from the sum of its citizens.
  *   **France (The State)** signed the colonial treaties.
  *   **France (The State)** still exists today.
  *   Therefore, **France (The State)** owes the debt.

  The citizens are just the current "organs" of that body. When people demand reparations from "France," they are suing the Corporation, not the shareholders. The tension you feel comes from the fact that in moral discourse, we usually treat groups as metaphors for people. In legal/political discourse, groups *are* entities with their own lifespan.

  ### 4. Naming the Tension
  If you want to name this specific pattern in a debate to avoid confusion, the most precise term is **Diachronic Political Liability**.

  *   **Diachronic:** Across time (generations).
  *   **Political:** Pertaining to the State/Structure, not individual souls.
  *   **Liability:** An obligation to pay/fix, distinct from moral blame.

  **Definition:** *The obligation of a current political community to address the harms committed by its predecessor entities, based on the continuity of the state structure, independent of the individual moral culpability of current citizens.*

  ### 5. Boundary Cases (How to keep it from collapsing)
  To prevent this concept from collapsing into generic "group responsibility," you need to enforce these boundaries. If these boundaries are crossed, the argument usually fails.

  **Boundary 1: The Continuity Test**
  *   *Valid:* Germany today is the legal successor to the Third Reich (same institutions, same land, same legal framework restored).
  *   *Invalid:* Holding modern Americans responsible for the Aztec Empire. There is no continuous political entity.
  *   *Edge Case:* Is the US today the same entity as the US in 1850? (Constitutional continuity says yes; radical structural change says maybe not).

  **Boundary 2: The Benefit Test (Unjust Enrichment)**
  *   *Valid:* The current state infrastructure (wealth, land, institutions) was built on the historical wrong. The current citizens benefit from the "compound interest" of that wrong.
  *   *Invalid:* Demanding reparations from a group that did not inherit the assets generated by the crime.

  **Boundary 3: The Agency Test**
  *   *Valid:* The State acts as a unit. It can apologize, pay, and change laws.
  *   *Invalid:* Demanding that individuals feel *shame*. You can demand taxes (liability), you cannot demand feelings (moral guilt).

  ### Summary for your next debate
  When you see this move on Twitter, you can point out the category error:

  > "You are conflating **Moral Guilt** (which requires individual action) with **Political Liability** (which attaches to the State as a continuous legal entity). Current citizens aren't *guilty*, but they inherit the *technical debt* of the state they maintain. If you want reparations, argue for the State's liability, don't imply the people are sinners."

  This validates their point (reparations/liability) while correcting their mechanism (guilt/blame), which usually de-escalates the conversation.
