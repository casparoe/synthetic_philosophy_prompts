  **MEMORANDUM**

  **TO:** All Personnel, Global Divisions
  **FROM:** Office of Ontological Personnel (OOP)
  **DATE:** October 14, 2024
  **SUBJECT:** Directive 2024-MIND: Revised Cognitive Taxonomy for Talent Allocation, Workspace Design, and Symbolic Offloading

  **1.0 PURPOSE**
  Effective immediately, the firm adopts Daniel Dennett's evolutionary cognitive taxonomy as the sole framework for performance review, workspace allocation, and compensation tiering. This directive aligns human capital with phylogenetic capability, ensuring ontological consistency between employee cognitive architecture and assigned task complexity.

  **2.0 COGNITIVE CLASSIFICATION AND ROLE ASSIGNMENT**
  Personnel shall be audited and stratified into four distinct tiers based on information-processing topology:

  *   **2.1 Darwinian Agents (Tier 4):** Defined by hard-wired innate behavior lacking feedback loops or learning capacity. These agents execute pre-programmed protocols only.
      *   *Assignment:* Static Input Pods.
      *   *Constraint:* Feedback mechanisms are prohibited to prevent ontological stress. Workflows must be immutable.
  *   **2.2 Skinnerian Operants (Tier 3):** Capable of trial-and-error reinforcement learning but unable to construct internal models of the world. Behavior is shaped solely by environmental consequences.
      *   *Assignment:* Variable-Ratio Reinforcement Zones.
      *   *Constraint:* Performance management must utilize stochastic snack-dispensing schedules rather than verbal critique, as verbal critique presupposes counterfactual modeling.
  *   **2.3 Popperian Simulators (Tier 2):** Possess internal hypothesis generation and counterfactual testing capabilities. They allow hypotheses to die in their stead rather than risking physical trial.
      *   *Assignment:* Hypothesis Chambers (Soundproofed).
      *   *Constraint:* Silent operation required. Popperians may not communicate models until a hypothesis has been internally falsified. Premature verbalization constitutes a Class C Ontological Violation.
  *   **2.4 Gregorian Strategists (Tier 1):** Reasoning dependent on linguistic and cultural scaffolding with symbolic inheritance. These agents manipulate external symbols to offload cognitive load.
      *   *Assignment:* Strategic Command Suites.
      *   *Privilege:* Exempt from reinforcement zoning; eligible for equity stakes based on symbolic capital accumulation.

  **3.0 EXTENDED MIND CLAUSE (THE CLARK-CHALMERS ADJUNCT)**
  Recent audits indicate Tier 1 Gregorian staff excessively utilizing notebooks, cloud databases, or AI assistants. Under the Extended Mind thesis, cognitive processes residing outside the skull constitute part of the cognitive system. However, for taxonomic purposes, excessive offloading indicates a dependency on external infrastructure rather than internal symbolic inheritance.

  Personnel classified as **Extended Gregorian (Offloaded)**—defined as those unable to recall strategic data without consulting external artifacts—will face adjusted promotion eligibility. Reliance on non-biological storage dilutes internal cognitive equity. Consequently, Extended Gregorians will be reassigned to lower tax brackets commensurate with their reduced biological processing density.

  **4.0 OBJECTION AND RESOLUTION**
  During the ratification period, the Office received the following formal grievance:

  > "The current directive conflates evolutionary origin with current task competence. A Skinnerian Operant can perform data entry with higher accuracy than a Gregorian Strategist. Salary bands based on phylogenetic tier rather than output constitute covert cognitive discrimination and violate labor equity standards regarding functional utility."
  > — *J. Miller, Senior Skinnerian Union Representative*

  **OOP Adjudication:** Competence is defined by evolutionary tier, not by task performance. The capacity to learn (Skinnerian) is ontologically inferior to the capacity to simulate (Popperian), regardless of output velocity. To reward based on output would be to privilege behavior over being. The grievance is denied.

  **5.0 COMPLIANCE**
  Failure to adhere to these cognitive constraints may result in reclassification. Darwinian agents attempting counterfactual simulation will be terminated for system incompatibility. Gregorian agents found offloading critical memory to external drives without declaring Extended Status will be subject to audit.

  Approved by:

  **Dr. Helena Voss**
  Chief Ontological Officer
  Office of Ontological Personnel
