answer: |-
  # The "What Are You Feeling?" Intuition Sorter

  **Instructions for Students:**
  Read each short scenario carefully. There are no right or wrong answers. Choose the response that best matches your gut reaction to the situation. Don't overthink it, and don't worry about philosophical terms—just pick what sounds most true to you.

  ---

  ### 1. The Turbulent Flight
  Alex is on a plane. He has studied aviation safety statistics and sincerely believes that flying is extremely safe. He judges that there is no real danger. However, when the plane hits sudden turbulence, his heart races, his palms sweat, and he feels intense terror.
  **What is happening to Alex?**
  *   A. His fear is irrational because it contradicts what he knows to be true; if he really believed he was safe, he wouldn't be afraid.
  *   B. The danger *seems* real to him in the moment, like an optical illusion looks bent even when you know it's straight.
  *   C. The fear *is* the racing heart and sweating palms; the thought about safety is separate from the feeling itself.

  ### 2. The Sincere Apology
  Jordan was deeply insulted by a friend. The friend later offered a sincere apology and retracted the insult. Jordan accepts the apology and judges that the friend is no longer hostile. Yet, Jordan still feels a hot surge of anger when thinking about the incident.
  **Why does the anger remain?**
  *   A. It shouldn't remain; if Jordan truly judged the matter resolved, the anger would vanish.
  *   B. The insult still *appears* offensive to Jordan's mind, even if his head says it's over.
  *   C. The anger is just leftover physical tension and adrenaline that hasn't faded yet.

  ### 3. The Grief Trigger
  It has been five years since Sam's partner died. Sam has processed the loss and doesn't walk around thinking, "This tragedy is happening right now." But one day, a specific song plays, and Sam is hit with a wave of fresh, overwhelming grief.
  **What explains this return of emotion?**
  *   A. The song temporarily changes Sam's judgment about how significant the loss is.
  *   B. The song makes the loss feel vividly present again, like seeing a photograph that brings a memory to life.
  *   C. The song triggers a physical reaction in the body (tight chest, tears), and that physical reaction is the grief.

  ### 4. The Calm Pill
  Imagine you take a medication that completely blocks all bodily arousal: your heart rate stays steady, your muscles don't tense, and you don't feel any internal "butterflies" or shaking. You are then confronted by a growling bear.
  **Do you feel fear?**
  *   A. Yes, because you still judge the bear to be dangerous and a threat to your life.
  *   B. Yes, but it feels distant, like watching a scary movie where you perceive the threat but aren't "in" it.
  *   C. No, or not really. You might know you are in danger, but without the bodily rush, the emotion of fear is missing.

  ### 5. The Startle Response
  A glass shatters loudly behind you. You jump and your heart spikes before you even have time to think about what made the noise.
  **Is this initial jump fear?**
  *   A. No, fear requires a quick judgment that something is wrong; this is just a reflex.
  *   B. It is a primitive form of fear because your system perceived a threat before your conscious mind did.
  *   C. Yes, the jump and the heart spike are the fear; the thought comes later.

  ### 6. The Method Actor
  An actor is performing a sad scene. They are not actually sad about their own life, and they know the story is fictional. However, they use techniques to make their throat tighten and their eyes water, mimicking the physical signs of sadness.
  **Does the actor feel sadness?**
  *   A. No, because they do not believe the sad events are real or relevant to them.
  *   B. They simulate the appearance of sadness, but without the genuine perception of loss, it's hollow.
  *   C. Yes, at least partially, because they are generating the actual physical feelings associated with sadness.

  ### 7. The Rollercoaster
  You are on a rollercoaster. You know you are strapped in securely and the ride is mechanically safe. You scream and feel a rush of excitement/fear.
  **Why do you feel this way?**
  *   A. You are temporarily suspending your judgment of safety to enjoy the ride.
  *   B. Your senses are presenting the drop as dangerous, even though your knowledge says otherwise.
  *   C. The rush of adrenaline and the stomach drop *are* the emotion, regardless of safety.

  ### 8. Moral Disgust
  You hear a detailed story about a cruel act of betrayal. You immediately feel a churning in your stomach and a sense of revulsion.
  **What is the revulsion?**
  *   A. It is your mind's way of registering the judgment that the act was morally wrong.
  *   B. It is the act appearing as "contaminated" or repulsive to your moral senses.
  *   C. It is primarily the physical sensation of nausea and discomfort in the gut.

  ### 9. The Mood Shift
  You wake up feeling irritable and on edge. Because of this, you interpret your roommate's neutral comment as an attack. Later, after a good meal and a walk, you feel calm and realize the roommate didn't mean anything wrong.
  **What changed?**
  *   A. Your emotion changed because your judgment about the roommate's intent changed.
  *   B. Your emotional "lens" cleared up, allowing you to see the situation more accurately.
  *   C. Your bodily state shifted from agitated to relaxed, which changed the emotion itself.

  ### 10. The Psychopath
  Consider a person who understands perfectly well that hurting others is against the rules and causes harm (they make the correct judgments), but they never feel a gut reaction, hesitation, or distress when causing harm.
  **Do they lack moral emotion?**
  *   A. No, they have the correct moral judgments, which is what matters.
  *   B. Yes, they are blind to the value of others; they don't "see" the harm the way we do.
  *   C. Yes, because they lack the visceral, bodily response that constitutes caring.

  ---

  ## Scoring Key & Interpretation Guide (For the TA)

  **Scoring:**
  Have students tally their answers.
  *   **Mostly A's:** The **Judgment View** (Cognitivism).
  *   **Mostly B's:** The **Perceptual View** (Sensibility Theory).
  *   **Mostly C's:** The **Feeling View** (Somatic/Jamesian Theory).

  **What the Profiles Mean:**

  *   **The Judgment Profile (A's):** You intuitively think emotions are tied to what we *believe* or *assess* about the world. For you, an emotion is a kind of verdict.
      *   *Discussion Point:* How do you explain recalcitrant emotions (like the turbulence case) where the verdict changes but the emotion stays?
  *   **The Perceptual Profile (B's):** You intuitively think emotions are like *senses*. They tell us how the world appears (dangerous, offensive, sad), even if that appearance conflicts with our facts.
      *   *Discussion Point:* This handles illusions well, but how is an "emotional perception" different from a literal belief?
  *   **The Feeling Profile (C's):** You intuitively think emotions are fundamentally about *bodily experience*. If the body is calm, the emotion is gone.
      *   *Discussion Point:* Does this mean a person with a spinal cord injury cannot feel fear? Is there a difference between "feeling afraid" and "feeling a racing heart"?

  **Reading Mixed or Hybrid Profiles:**
  It is very common for students to have a split profile (e.g., 4 A's, 4 B's, 2 C's).
  *   **The "Hybrid" Intuition:** Many students will find that *some* emotions feel like judgments (anger) while others feel like bodily states (panic). This is a philosophically respectable position (Pluralism). Encourage them to ask: "Is 'emotion' one single thing, or a family of different things?"
  *   **The "Undecided" Intuition:** If the scores are evenly split (3-3-4), the student likely hasn't committed to a metaphysical stance. This is a perfect starting point for the discussion. Ask them which vignette was the hardest to answer and why.

  **Limitations & Empty Combinations (TA Notes):**

  1.  **Indistinguishable Positions (Judgment vs. Perceptual):**
      This quiz cannot cleanly separate the **Judgment View** and the **Perceptual View** for students who answer consistently "A" or "B" on the recalcitrant cases but swap on the others. Both views agree that emotions are "about" the world (intentional) and involve evaluation. The distinction lies in whether the emotion *is* the belief (Judgment) or merely *presents* value like a sensory experience (Perceptual). In a short quiz, the difference between "judging X is dangerous" and "perceiving X as dangerous" can feel semantic. You may need to press them in discussion: "Can you have the emotion without the belief?" (Perceptual says yes; Judgment says no).

  2.  **The "Empty" Combination (The Inconsistent Recalcitrance):**
      There is one combination of answers that yields no stable named view and suggests a logical tension in the student's intuitions:
      *   *Condition:* Choosing **Option A (Judgment)** on Question 1 (Turbulence) **AND** choosing **Option C (Feeling)** on Question 4 (Calm Pill).
      *   *Why it's empty:*
          *   On Q1 (Option A), the student claims that if you judge yourself safe, you *cannot* truly feel fear (implying belief is necessary).
          *   On Q4 (Option C), the student claims that without bodily arousal, you *cannot* truly feel fear (implying body is necessary).
          *   *The Conflict:* If a student holds *both* strictly, they rule out the possibility of fear in the Turbulence case (because the belief is missing) AND rule out fear in the Calm Pill case (because the body is missing). While a hybrid theory is possible, answering this way often reveals a lack of reflection on the *necessary conditions* for emotion. It suggests the student wants emotion to be *both* purely belief and purely body, which creates a paradox when one is present without the other. In discussion, ask: "In the turbulence case, you said the belief matters most. In the pill case, you said the body matters most. Can both be the *definition* of emotion?"

  ---

  ### TA Facilitation Tips for Section
  *   **Don't Reveal the Labels Immediately:** Let them tally their scores and discuss in pairs what their "type" means before you write "Judgmentalism," "Perceptualism," and "Somatic Theory" on the board.
  *   **Focus on the "Hard Cases":** The Turbulence (Q1) and Calm Pill (Q4) questions are your heavy lifters. If the class is mostly "A", challenge them with Q1. If mostly "C", challenge them with Q4.
  *   **Validate the "B" Group:** Undergraduates often feel the "Perceptual" view is vague. Validate that this is actually the dominant contemporary view in philosophy of emotion precisely because it handles the "optical illusion" nature of Q1 and Q2 better than the Judgment view.
  *   **Moral Psychology Connection:** Since you work in moral psychology, use Q8 (Disgust) and Q10 (Psychopath) to bridge to next week's topic. Ask: "If emotions are perceptions of value (B), does the psychopath lack moral *knowledge* or moral *vision*?"
