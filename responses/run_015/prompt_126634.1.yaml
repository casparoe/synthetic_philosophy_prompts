answer: |-
  ### Exam Question

  **Essay Question:**

  The contrastive framing "Why Britain and not China?" is central to the Great Divergence literature and the Needham Question. Critically evaluate whether this explanatory structure is genuinely well-posed. Specifically, diagnose the logical structure of this contrastive macrohistorical explanation: does selecting Britain and China as paired cases presuppose an illicit baseline of institutional comparability circa 1700? Furthermore, apply an interventionist account of explanation (where counterfactual stability requires holding background conditions fixed) to determine whether this framing collapses into a non-contrastive comparative analysis or can be salvaged only with a severely restricted counterfactual scope. Defend a committed position on the viability of this framing.

  ***

  ### Model Answer

  **Title:** The Fragility of Contrast: Salvaging the Great Divergence via Restricted Interventionism

  The question "Why Britain and not China?" is ill-posed as a holistic civilizational comparison but can be salvaged if reconstructed as a localized interventionist inquiry. Standard Great Divergence narratives often treat "Britain" and "China" as monolithic units diverging from a shared baseline circa 1700. However, from the perspective of an interventionist account of causal explanation, this framing risks committing a category error regarding the *explanandum* and the *counterfactual baseline*. To remain philosophically robust, the question must abandon holistic comparability in favor of restricted variable isolation.

  The primary logical flaw in the standard framing is the presumption of an illicit baseline. Contrastive explanation requires that the fact (Britain industrialized) and the foil (China did not) share a common causal history up to a specific divergence point. If the institutional, ecological, and demographic background conditions of Qing China and Hanoverian Britain were structurally distinct prior to 1700, the contrast class is invalid. As Elvin's "high-level equilibrium trap" suggests, China's stagnation may have been the rational outcome of its specific factor endowments, not a failure to replicate Britain's path. If the background conditions ($B$) differ significantly, we cannot simply intervene on the putative cause ($C$) in the Chinese case to see if the effect ($E$) occurs, because the invariant generalizations linking $C$ to $E$ in Britain may not hold in China's distinct causal structure.

  Under an interventionist framework (à la Woodward), a causal claim $C \rightarrow E$ is valid only if an intervention on $C$ changes $E$ while holding background conditions fixed. In macrohistory, "holding background conditions fixed" is the crux of the problem. If we treat "China" as the background condition for the foil, we are holding fixed a complex system that may be causally incompatible with the intervention. For example, intervening to introduce British-style patent law into 1750s China might not yield industrialization because the background condition of state bureaucracy interacts differently with property rights. Consequently, the contrastive question collapses. It ceases to be "Why $E$ in Britain and not $E$ in China?" and becomes two separate non-contrastive questions: "What caused $E$ in Britain?" and "What caused $\neg E$ in China?" This dissolves the specific explanatory power of the divergence, reducing it to a juxtaposition of independent histories.

  However, the framing is salvageable if we severely restrict the counterfactual scope. We must abandon the civilizational level of analysis and isolate specific, modular variables where background conditions were sufficiently similar to license counterfactuals. For instance, rather than asking why "China" failed to industrialize, we ask why specific regions (e.g., the Yangtze Delta) failed to transition to coal-intensive production despite similar market pressures. Here, the baseline is not "China" but "advanced early modern agrarian economies." By narrowing the *explanandum* to specific mechanisms (e.g., access to coal, cost of labor) rather than the macro-outcome (industrialization), we can identify a valid contrast class.

  In this restricted view, the intervention is not "Make China Britain," but "Introduce British coal-access conditions into the Yangtze Delta." If background conditions regarding market integration and property security are held fixed as comparable (as Pomeranz argues for the 18th century), the counterfactual becomes stable. The explanation succeeds not because the civilizations were comparable, but because the specific causal module was portable.

  A strong objection to this salvage operation is that it trivializes the Great Divergence. If we restrict the scope to modular variables, do we lose the ability to explain the *global* shift in power? Critics might argue that macrohistory requires macro-explanations. This objection fails because it conflates the scale of the *effect* with the scale of the *cause*. The divergence is a macro-event, but its causes need not be civilizational essences. An interventionist account demonstrates that macro-outcomes are the aggregate result of micro-invariant relationships. By accepting restricted counterfactuals, we preserve causal rigor without sacrificing historical significance. We explain the divergence not by comparing wholes, but by identifying the specific breakage points in otherwise similar causal chains.

  Therefore, "Why Britain and not China?" is only well-posed if interpreted as "Why did specific causal mechanisms trigger in Britain's specific contexts and not in China's analogous contexts?" Anything broader presupposes an illicit baseline and violates the stability conditions of interventionist explanation.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  **A Range (70–100): Conceptual Mastery and Argumentative Commitment**
  To achieve an A, the essay must take a committed position (either "collapses" or "salvageable") and execute the following four specific conceptual moves:
  1.  **Explanandum vs. Counterfactual Licensing:** Explicitly distinguishes between selecting the outcome to be explained and the validity of the counterfactual scenario used to test it.
  2.  **The Baseline Problem:** Identifies that comparing Britain and China circa 1700 presupposes a shared trajectory (common causal history) that may not exist (illicit baseline).
  3.  **Interventionist Conditions:** Correctly applies the requirement that background conditions must be held fixed for an intervention to be valid, showing how macro-historical systems often violate this.
  4.  **Objection Handling:** Identifies and rebuts the strongest objection to their position (e.g., that restricting scope trivializes the history, or that holistic comparison is necessary).

  *   **A+ (85–100):** Synthesizes these moves seamlessly; the argument flows logically from the interventionist premises to the historical conclusion. The distinction between "holistic" and "modular" variables is precise.
  *   **A (70–84):** Contains all four moves clearly but may lack the syntactic polish or depth of the objection handling found in the A+ range.

  **B Range (60–69): Competent but Limited**
  A B answer will demonstrate knowledge of the concepts but fail to integrate them into a rigorous argument.
  *   **Conceptual Identification:** Identifies the terms (interventionism, contrastive explanation, baseline) but treats them descriptively rather than analytically.
  *   **Partial Application:** Applies interventionist logic to the history but fails to rigorously enforce the "background conditions fixed" constraint.
  *   **Neutrality:** Hedges between "collapses" and "salvageable" rather than defending a committed position.
  *   **Objection Handling:** Mentions an objection but offers a weak or generic reply.

  **Typical Errors Costing Marks:**
  *   **Historical Summarization (Major Penalty):** Spending more than 20% of the essay summarizing Pomeranz, Needham, or economic data without analyzing the *logic of explanation*.
  *   **Misunderstanding Interventionism:** Treating interventionism as simple "what-if" history rather than a structural account of invariant generalizations and background stability.
  *   **False Dichotomy:** Arguing that because the holistic comparison fails, *no* comparison is possible (failing to see the "restricted scope" middle ground).
  *   **Lack of Commitment:** Refusing to conclude whether the framing is well-posed or not.
