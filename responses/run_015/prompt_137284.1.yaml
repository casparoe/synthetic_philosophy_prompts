  ### 3. Taxonomy Check

  You are right to separate these; collapsing them obscures the mechanism.

  1.  **Informational Cascade (BHW):** Agents ignore private signals because public inference is overwhelming. Payoffs depend on matching the *state*.
  2.  **Payoff Externalities (Network Effects):** Agents match others because utility depends on the *number of adopters* (e.g., fax machines). Payoffs depend on matching *others*.
  3.  **Reputational Concerns (Scharfstein-Stein):** Agents match others to manipulate the market's belief about their *competence*. Payoffs depend on matching *others* to signal ability.

  **Classification of the Windowed Variant:**
  The lock-in in your windowed variant is an **Informational Cascade (Type 1)**.
  *   Agents want to match the state $\omega$.
  *   They match each other only instrumentally, as a means to infer $\omega$.
  *   There is no direct utility from conformity, only epistemic reliance.

  **Is Type 3 Distinct?**
  Yes, it is a distinct mechanism, though mathematically it can be modeled as Type 1 with a modified payoff function.
  *   **Mechanism:** In Type 1, I deviate if my private signal is strong enough to overcome the public belief. In Type 3, I may *not* deviate even if my signal is strong, because the reputational cost of looking like a maverick (being wrong when the herd was right) outweighs the project payoff.
  *   **Distinction:** Type 1 is a failure of *information aggregation*. Type 3 is a distortion of *incentives*. In your windowed variant, there are no reputational terms; the lock-in is purely due to the informational weight of the window exceeding the private signal.

