  # Session Plan: The Outbreak Protocol

  **Module:** Evidence and Policy (Master's Level)
  **Time:** 90 Minutes
  **Participants:** 20 Students (4 Teams of 5)
  **Goal:** Demonstrate Good's Theorem (Value of Information) experientially before naming it.
  **Core Insight:** Information is only valuable if it changes a decision; the value is the improvement in expected outcome minus the cost; the guarantee fails if you cannot act on the information.

  ---

  ## 1. The Scenario & Numbers

  **Context:** A novel respiratory pathogen is detected. Teams act as Regional Health Directors.
  **States of the World:**
  *   **High Virulence (H):** Probability **30%** (Given as intelligence briefing).
  *   **Low Virulence (L):** Probability **70%**.

  **The Decision (Binary):**
  1.  **Status Quo (SQ):** Keep schools/shops open.
  2.  **Intervene (Int):** Lockdown/Mask Mandate.

  **Payoff Table (Public Health Units - PHU):**
  *Teams maximize expected PHU. Endowment: 200 PHU per team.*

  | | **Low Virulence (70%)** | **High Virulence (30%)** |
  | :--- | :---: | :---: |
  | **Status Quo (SQ)** | 200 | 0 |
  | **Intervene (Int)** | 100 | 100 |

  *   **Baseline Calculation (No Test):**
      *   EU(SQ) = $0.7(200) + 0.3(0) = 140$.
      *   EU(Int) = $0.7(100) + 0.3(100) = 100$.
      *   **Rational Choice:** Status Quo. **Baseline EV:** 140.
      *   **Decision Threshold:** You switch to Intervene only if $P(H) > 0.5$. (At 0.5, $100 = 200(0.5) + 0(0.5)$).

  **The Market (Tests available for purchase before decision):**
  *Teams may buy any combination of tests. Costs are deducted from Endowment. Payoffs are added to Endowment.*

  | Test | Name | Cost (PHU) | Sensitivity $P(Pos|H)$ | Specificity $P(Neg|L)$ | Design Purpose |
  | :--- | :--- | :---: | :---: | :---: | :--- |
  | **A** | *Rapid Screen* | **0** | 0.65 | 0.65 | **Free but Worthless.** Posterior $P(H|Pos) \approx 0.44$. Never crosses 0.5 threshold. |
  | **B** | *PCR Lab* | **10** | 0.85 | 0.85 | **Valuable.** Posterior $P(H|Pos) \approx 0.71$. Crosses threshold. |
  | **C** | *Legacy Kit* | **10** | 0.75 | 0.75 | **Dominated.** Same cost as B, lower accuracy. |
  | **D** | *Triage* | **2** | 0.95 | 0.50 | **Screening.** High sensitivity. A negative result makes $P(H)$ negligible, saving the cost of Test B. |

  **Worked Expected Values (for Instructor Check):**

  *   **Test A (Free):**
      *   $P(Pos) = 0.65(0.3) + 0.35(0.7) = 0.44$.
      *   $P(H|Pos) = 0.195 / 0.44 = 0.44$. (Decision: SQ).
      *   $P(H|Neg) = 0.105 / 0.56 = 0.19$. (Decision: SQ).
      *   **EV with Test A:** Always SQ. Payoff 140. Cost 0. **Net: 140.** (Same as Baseline).

  *   **Test B (PCR):**
      *   $P(Pos) = 0.85(0.3) + 0.15(0.7) = 0.36$.
      *   $P(H|Pos) = 0.255 / 0.36 = 0.71$. (Decision: **Int**). Payoff: 100.
      *   $P(H|Neg) = 0.045 / 0.64 = 0.07$. (Decision: **SQ**). Payoff: $0.93(200) + 0.07(0) = 186$.
      *   **EV with Test B:** $0.36(100) + 0.64(186) = 36 + 119.04 = 155.04$.
      *   **Gross Value:** $155.04 - 140 = 15.04$.
      *   **Net Value:** $15.04 - 10 (\text{cost}) = \mathbf{5.04}$. (Worth buying).

  *   **Test C (Legacy):**
      *   Lower accuracy than B, same cost. **Dominated.**

  *   **Test D (Triage):**
      *   $P(Neg) = 0.05(0.3) + 0.50(0.7) = 0.365$.
      *   $P(H|Neg) = 0.015 / 0.365 = 0.04$. (Decision: SQ).
      *   *Strategy:* If Test D is Neg, do not buy Test B (Save 10 PHU). If Pos, consider Test B.
      *   This creates the "Sum of Values" puzzle. Test D alone is low value (doesn't cross threshold on Pos), but D+B is higher value than B alone because D filters out the "wasted cost of B" cases.

  ---

  ## 2. Materials & Roles

  *   **Room:** 4 tables. Projector for rules/payoffs.
  *   **Handouts:**
      1.  **Briefing Sheet:** Payoff table, Prior (30%), Endowment (200).
      2.  **Market Menu:** The 4 Tests with costs/accuracy.
      3.  **Decision Slip:** To submit Action (SQ/Int) and Test Purchases.
      4.  **Result Envelopes:** 4 envelopes per team, labeled "State: H" and "State: L". (Instructor fills these identically for all teams before class to ensure a single "Truth" for scoring, though decisions are based on the *given* prior). *Correction:* To teach Decision Theory, the "Truth" doesn't matter for the *rationality* of the decision, only for the *score*. To avoid luck dominating the debrief, **fix the State for all teams** (e.g., draw one card at the start: "Today, the Virus is Low Virulence"). This allows you to compare scores directly.
  *   **Instructor Role:** Market Maker & Regulator.
  *   **Student Role:** Policy Committee (5 per team).

  ---

  ## 3. Timeline (90 Minutes)

  ### Phase 1: The Rational Market (45 Minutes)

  *   **00-10: Setup.**
      *   Distribute teams and Briefing Sheets.
      *   **Crucial:** Emphasize the Prior is *given* (30%). This is a simulation, not a debate on epidemiology.
      *   Explain Payoffs. Ask: "Without any tests, what do you do?" (Check consensus: Status Quo).
  *   **10-25: Market & Decision.**
      *   Teams discuss and submit Decision Slips:
          1.  Which tests to buy? (Can buy multiple).
          2.  **Crucial Rule:** "You will see the test result, *then* choose your Action (SQ or Int)."
      *   Instructor collects slips.
      *   **Simulation:** Instructor goes to each team. Flips a coin (weighted by Test Accuracy) to generate the Result for each test they bought. Hands them the result.
      *   Teams update their belief and submit Final Action.
  *   **25-35: Scoring.**
      *   Reveal the "True State" (e.g., Low Virulence).
      *   Calculate Final Scores: Endowment - Test Costs + Payoff.
      *   Write scores on board. Identify the winning team.
  *   **35-45: Initial Debrief.**
      *   Ask winners: "Why did you buy Test B?" (Likely: "It told us to lock down if positive").
      *   Ask losers who bought Test A: "It was free, why didn't it help?" (Likely: "We did the same thing anyway").
      *   Ask losers who bought Test C: "Why not B?" (Likely: "Didn't notice").
      *   *Do not explain the theory yet.* Just highlight the patterns.

  ### Phase 2: The Bureaucracy (30 Minutes)

  *   **45-50: Rule Change.**
      *   Announce: "New Directive from Central Government. To prevent panic, **if you purchase a test, you must commit to your Action *before* seeing the result.**"
      *   (This removes the ability to conditionalize action on information).
      *   Reset Endowments to 200. Same Payoffs. Same Prior.
  *   **50-65: Market & Decision.**
      *   Teams submit: Test Purchases + **Binding Action** (SQ or Int).
      *   Instructor generates results (as before), but teams cannot change their Action.
  *   **65-75: Scoring.**
      *   Calculate scores.
      *   **Observation:** Scores will drop. Teams that bought Test B will score *lower* than if they hadn't bought it (because they paid for info they couldn't use).
      *   Rational teams will buy *no tests* and just choose SQ.
  *   **75-90: Final Debrief & Theory.**
      *   Reveal the name: **Good's Theorem / Value of Information.**
      *   Map the experience to the math.

  ---

  ## 4. The Debrief: Mapping Experience to Theory

  **1. The Currency of Decision (Test A)**
  *   *Moment:* Phase 1, teams buying the Free Test.
  *   *Theory:* $Value = EU(With Info) - EU(Without Info)$.
  *   *Lesson:* Test A was accurate (65%), but $P(H|Pos)$ never crossed the 0.5 threshold. The decision remained SQ. Therefore $EU(With) = EU(Without)$. Value = 0.
  *   *Takeaway:* Accuracy $\neq$ Value. Value = Ability to Change Mind.

  **2. Net Value (Test B)**
  *   *Moment:* Phase 1, teams hesitating over the cost of Test B.
  *   *Theory:* $Net Value = Gross Value - Cost$.
  *   *Lesson:* Test B cost 10, but raised EV by 15. Net +5.
  *   *Takeaway:* Expensive tests are worth buying if they prevent expensive mistakes.

  **3. The Premise of Re-optimization (Phase 2)**
  *   *Moment:* Phase 2 Rule Change.
  *   *Theory:* Good's Theorem assumes the agent *updates* (conditionalization) and *maximizes* (chooses best act for new belief).
  *   *Lesson:* When you forced commitment *before* the result, you broke the link between Information and Action. The test became "noise with a price tag."
  *   *Takeaway:* Information has no instrumental value without the freedom to act on it.

  **4. Non-Additivity (Test D)**
  *   *Moment:* Teams discussing buying D+B.
  *   *Theory:* $V(A \cup B) \neq V(A) + V(B)$.
  *   *Lesson:* Test D's value wasn't in its own result, but in saving the cost of Test B when D was negative.
  *   *Takeaway:* Context determines value.

  ---

  ## 5. Troubleshooting: Predictable Failures

  **1. "Free is Good" (Buying Test A)**
  *   *Why:* Heuristic bias.
  *   *Handle:* In debrief, ask: "Did anyone's action change after seeing Test A?" If no, the cost (0) was higher than the value (0).

  **2. "Accuracy is King" (Buying Test C over B)**
  *   *Why:* Misunderstanding sensitivity/specificity or not calculating posteriors.
  *   *Handle:* Show the math on the board. 75% vs 85% matters when you are near the threshold.

  **3. The EBM Frame (P-values)**
  *   *Why:* Public health students look for "Statistical Significance."
  *   *Handle:* Interrupt gently. "In this game, there are no p-values. There is only Probability and Payoff. A 44% risk is not 'significant', but is it worth a lockdown? That's a decision problem, not a testing problem."

  **4. "Cornering the Market"**
  *   *Risk:* Teams sharing info.
  *   *Handle:* Explicit rule: "No communication between teams. You are competing regions."

  **5. Phase 2 Confusion**
  *   *Risk:* Students think Phase 2 is a trick.
  *   *Handle:* Be blunt. "This represents a policy constraint. You literally cannot change your mind. Calculate accordingly."

  ---

  ## 6. Limitations: What the Game Cannot Teach

  You must supply these verbally in the debrief, as the game structure obscures them:

  **1. The "Single Agent" Prior**
  *   *Theorem:* Assumes one prior.
  *   *Room:* 20 students have 20 internal priors, even if you give them a "30%" briefing.
  *   *Loss:* The theorem guarantees value *relative to your own prior*. If a student secretly thinks P(H)=80%, they should Lockdown without tests. For them, *any* test that might tell them to Open has *negative* value (risk of error).
  *   *Fix:* Acknowledge this. "The math works if you trust the 30%. If you don't, the theorem doesn't apply to you."

  **2. Expectation vs. Reality**
  *   *Theorem:* Deals in *Expected* Utility.
  *   *Room:* We play *one round*. Luck dominates. A team might buy Test B, get a False Negative, Open, and die (0 points). A team buying no tests gets 200.
  *   *Loss:* Rationality looks like stupidity in a single sample.
  *   *Fix:* Emphasize: "You made the right bet, the card was unlucky. Decision theory justifies the process, not the outcome."

  **3. Cost of Computation**
  *   *Theorem:* Assumes costless calculation.
  *   *Room:* Students struggle with the Bayes arithmetic.
  *   *Loss:* They might reject Test B because the math is hard, not because the value is low.
  *   *Fix:* Provide a "Calculator Sheet" (a lookup table for Posteriors) to remove arithmetic friction so they focus on the decision logic.

  **4. Risk Aversion**
  *   *Theorem:* Assumes Linear Utility (Maximize Points).
  *   *Room:* Students are risk-averse (fear the 0 payoff).
  *   *Loss:* They might Lockdown (Int) regardless of tests to avoid the 0.
  *   *Fix:* Point out that if they are risk-averse, their "Utility" curve is different, and the 0.5 threshold shifts. The theorem still holds for *their* utility, but not the *points* on the board.

  ---

  ## 7. Instructor Cheat Sheet (Bayes Lookup)

  *Give this to students to prevent math errors derailing the lesson.*

  **Prior: P(H) = 0.30**

  | Test Result | **Test A (65/65)** | **Test B (85/85)** | **Test C (75/75)** | **Test D (95/50)** |
  | :--- | :---: | :---: | :---: | :---: |
  | **Positive** | P(H) = **0.44** | P(H) = **0.71** | P(H) = **0.56** | P(H) = **0.45** |
  | **Negative** | P(H) = **0.19** | P(H) = **0.07** | P(H) = **0.14** | P(H) = **0.04** |
  | **Decision** | **SQ** (Both) | **Int** if Pos | **Int** if Pos | **SQ** (Both) |

  *(Note: Test D alone never triggers Intervention, but a Negative D makes Test B unnecessary.)*
