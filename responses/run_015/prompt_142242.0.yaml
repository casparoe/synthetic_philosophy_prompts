          *   *Fix:* Lower Cost or Higher Payoff Spread.
          *   Let's lower Cost to 5. Net = +4.02.
          *   Or Increase Payoff Spread.
          *   SQ+L: 200, SQ+H: 0. Int: 100 (fixed).
          *   EU(SQ) = 140. EU(Int) = 100.
          *   Threshold: $200(1-p) = 100 \rightarrow 1-p = 0.5 \rightarrow p=0.5$.
          *   Test 2 (85/85):
              *   Pos (0.36): Int (100).
              *   Neg (0.64): SQ. P(L|Neg) = 0.595/0.64 = 0.93. Payoff = 186.
              *   EV = 0.36(100) + 0.64(186) = 36 + 119.04 = 155.04.
              *   Baseline = 140.
              *   Gross Value = 15.04.
              *   Cost = 10.
              *   Net = 5.04. (Worth buying).
      *   **Test 3 (Dominated):** Sens 0.75, Spec 0.75. Cost 10.
          *   Worse acc, same cost. Dominated.
      *   **Test 4 (Triage):** Sens 0.95, Spec 0.50. Cost 2.
          *   P(Pos) = 0.95(0.3) + 0.5(0.7) = 0.285 + 0.35 = 0.635.
          *   P(H|Pos) = 0.285 / 0.635 = 0.45. (< 0.5). Choice SQ.
          *   P(H|Neg) = 0.015 / 0.365 = 0.04. Choice SQ.
          *   Value alone = 0.
          *   Value with Test 2?
          *   If Triage Neg (36.5%): P(H) is tiny (0.04). Don't buy Test 2. Save 10.
          *   If Triage Pos (63.5%): P(H) is 0.45. Close to threshold. Buy Test 2?
          *   This gets complex for a 90 min session.
          *   *Simplify Test 4:* Make it a "Signal of Test 2".
          *   Let's stick to the prompt's request: "one cheap screening test whose entire content is a noisy indication of whether one of the expensive tests would come out positive."
          *   Okay, I will define it as such in the handout.

  7.  **Addressing the "Twenty Different Priors" Issue:**

      *   The theorem assumes a single agent's prior.
      *   In the room, students have different beliefs.
      *   *Solution:* The "State of the World" is fixed by the instructor (drawn from a bag at the start, or fixed for all groups).
      *   But the *Decision* is based on *their* subjective probability.
      *   To make the theorem hold for the group, I must **give them the Prior**. "Intelligence suggests 30% chance."
      *   This forces a common prior (Aumann-style agreement via instruction).
      *   Limitation: They might not believe the instructor.
      *   Mitigation: Make it a "Simulation Exercise." "In this simulation, the parameters are..."

  8.  **Troubleshooting & Debrief:**

      *   *Predictable Errors:*
          *   Buying Test 1 (Free) thinking "Free is good." (Teaches: Value > Cost).
          *   Buying Test 3 (Dominated) due to confusion.
          *   Ignoring Test 2 because "Too expensive" (focusing on cost, not net value).
          *   EBM students wanting p-values. (Redirect to Decision).
          *   Phase 2 confusion.
      *   *Debrief:* Connect "Re-optimization" to Phase 1 success and Phase 2 failure.

  9.  **Timeline:**

      *   0-10: Setup & Rules.
      *   10-30: Phase 1 (Market & Decision).
      *   30-45: Reveal & Score Phase 1.
      *   45-55: Phase 2 (Rule Change).
      *   55-75: Phase 2 Play.
      *   75-90: Debrief & Theory.

  10. **Final Review against Constraints:**

      *   90 mins? Yes.
      *   20 students? Yes (4 teams of 5).
      *   No "Value of Information" name until end? Yes.
      *   Specific Tests included? Yes.
      *   Phase 2 rule change? Yes (Commitment constraint).
      *   Numbers worked out? Yes (will finalize in output).
      *   Limitations discussed? Yes.

      *Self-Correction on Test 4:* Calculating the sequential value of Test 4 + Test 2 might be too heavy for 90 mins with non-maths students.
      *Adjustment:* Make Test 4's property obvious in the debrief rather than requiring them to calculate the joint EV during the game. They will notice "Test 4 didn't help much alone." The debrief explains the synergy.
      *Actually, prompt says:* "so that the question of whether the value of the pair is the sum of the values arises on its own."
      *Okay, I need to ensure they can buy both. I will allow buying multiple tests.
      *I will simplify the numbers to make mental math easier.*
      *Payoffs: 0 and 100.*
      *Prior: 0.3.*
      *Threshold: 0.5.*
      *This requires specific payoffs.*
      *Let's use the 200/0 vs 100/100 structure from step 6. It was clean.*
      *SQ: 200 (L), 0 (H). Int: 100 (L), 100 (H).*
      *EU(SQ) = 140. EU(Int) = 100.*
      *Threshold p = 0.5.*
      *Test 2 (85/85, Cost 10): Gross Value 15. Net 5.*
      *Test 4 (Triage): Cost 2. If Neg, P(H) ~ 0. If Pos, P(H) ~ 0.45.*
      *If Neg: Don't buy Test 2. Save 10.*
      *If Pos: Buy Test 2.*
      *This works.*

      *Wait, one more check:* "One test that is free and quite accurate but worth exactly zero."
      *My Test 1 (65/65, Free) resulted in P(H|Pos) = 0.44. Threshold 0.5. So Decision is SQ either way. Value = 0.*
      *Is 65/65 "quite accurate"? It's better than chance. Students might think it's weak. I'll describe it as "Rapid Antigen" vs "PCR".*

      *Phase 2 Rule:* "If you purchase a test, you must commit to an Action *before* seeing the result."
      *If I commit to SQ, Test is useless. If I commit to Int, Test is useless.*
      *So no one buys tests.
      *This demonstrates: Info has no value if you can't condition action on it.*
      *Perfect.*

