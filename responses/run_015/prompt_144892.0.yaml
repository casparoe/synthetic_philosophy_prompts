answer: |-
  This is a sophisticated puzzle that cuts to the heart of the intersection between decision theory, philosophy of action, and behavioral psychology. You have correctly identified the tension: if hyperbolic discounting fully explains the choice, does the normativity of "weakness of will" evaporate?

  Here is an analysis of where your reconstruction goes wrong, the nature of the confusion in the debate, and the empirical distinguishability of the models.

  ### 1. Where Your Reconstruction Goes Wrong

  Your argument rests on the premise: *If the discounting story is right, then at the moment of action the [choice] is genuinely what she most wants, and... [this] isn't a failure of rationality or of will at all.*

  There are two specific errors here, one conceptual and one normative.

  **A. Judgment vs. Motivational Strength (Conceptual)**
  You are conflating *evaluative judgment* with *motivational strength* (or occurrent desire). The standard philosophical definition of akrasia (following Davidson and Aristotle) is not acting against what one *wants* most at time $t$; it is acting against what one *judges best* at time $t$.
  *   **Your Model:** Hyperbolic discounting explains why the *motivational pull* of the smaller-sooner reward spikes at $t_1$.
  *   **The Gap:** It does not necessarily explain why the *evaluative judgment* shifts. In classic akrasia, the agent thinks, "I should not eat this cake (judgment), but I want it more than my diet (desire), so I eat it."
  *   **The Error:** If hyperbolic discounting merely models the spike in desire, it explains the *mechanism* of the failure, but it does not dissolve the *phenomenon* of the failure. The agent is still acting against their concurrent better judgment. If the discounting model implies the agent's *judgment* also flips (i.e., at $t_1$ they genuinely believe the cake is better), then you are correct that it is mere preference change. But most applications of hyperbolic discounting in psychology assume the long-term goal remains the "true" utility function, and the discounting represents a cognitive bias or failure, not a rational update of values.
  *   **Confidence:** High. This distinction is standard in philosophy of action (e.g., Holton 2009, Davidson 1980).

  **B. Dynamic Inconsistency as Irrationality (Normative)**
  You argue that preference change "isn't a failure of rationality." In decision theory, this is contested.
  *   **The Standard View:** Rational agency is often defined to require *dynamic consistency* (Strotz 1955). If an agent prefers Plan A at $t_0$ and would still prefer Plan A at $t_1$ *if no new information has arrived*, but chooses Plan B at $t_1$ solely due to the passage of time, this is formally modeled as a violation of rationality (specifically, a violation of transitivity over time).
  *   **The Error:** You treat the preference reversal as exogenous "taste change." Hyperbolic discounting models it as endogenous to the *structure of time*. Because the reversal is predictable and systematic (not random noise or new information), it renders the agent "money-pumpable" (Dutch Book arguments). An agent who knows they will discount hyperbolically can be exploited. Therefore, even if the desire is "genuine" at $t_1$, the *system* that generates that desire is irrational.
  *   **Confidence:** High. This is the consensus in behavioral economics (e.g., Thaler & Sunstein, O'Donoghue & Rabin).

  ### 2. Is the Debate Conducted on a Confusion?

  Yes, but it is a specific methodological confusion rather than a total dead end.

  **The Confusion: Revealed Preference vs. Normative Welfare**
  The debate often stalls because economists and philosophers are using the word "preference" to mean two different things.
  *   **Economists (Revealed Preference):** "Preference" is defined by choice. If you choose the cake, you preferred the cake. On this view, Socrates was right: akrasia is impossible. You always do what you prefer.
  *   **Philosophers/Psychologists (Normative Welfare):** "Preference" refers to a stable ranking of outcomes that contributes to well-being. On this view, the $t_0$ self's ranking is the "true" preference, and the $t_1$ self's choice is a failure to adhere to it.

  **The Resolution:**
  Hyperbolic discounting bridges this by positing *multiple selves* (Thaler 1980, Ainslie 1992). It suggests the agent is not a unitary rational actor but a succession of temporally localized agents with conflicting utility functions.
  *   **Does this dissolve akrasia?** No. It re-describes akrasia as an *intrapersonal conflict* rather than a logical contradiction in a unitary agent. Davidson's "partitioning of the mind" is actually remarkably compatible with the multiple-selves model implied by hyperbolic discounting. The discounting model provides the *mechanism* for the partition Davidson postulated philosophically.
  *   **Confidence:** Medium-High. While this is a common synthesis, some hardline philosophers (e.g., strict Aristotelians) reject the multiple-selves move as denying the unity of agency required for moral responsibility.

  ### 3. Empirical Distinguishability: Discounting vs. Preference Change

  You asked for a signature in choice data that separates hyperbolic discounting from genuine taste change. There is one robust signature: **Demand for Pre-commitment.**

  **The Logic:**
  *   **Genuine Preference Change:** If I know my tastes will change exogenously (e.g., "I will be hungrier later"), I generally will not restrict my future choices, or I will restrict them flexibly. I trust my future self to know its own tastes.
  *   **Hyperbolic Discounting:** If I know my preferences will reverse *irrationally* due to proximity (e.g., "I will want the cake more than is good for me"), I should actively seek to bind my future self. I recognize my future self as an adversary or a compromised agent.

  **The Empirical Signature:**
  1.  **Pre-commitment Devices:** Agents exhibiting hyperbolic discounting will pay a cost to restrict their future choice set (e.g., buying a frozen meal instead of ingredients, using website blockers). Agents undergoing rational preference change should not pay to restrict flexibility unless they fear external constraints.
  2.  **The Discount Function Shape:** Genuine preference change is usually stochastic or event-driven. Hyperbolic discounting has a specific mathematical signature: the discount rate $k$ declines as the delay $t$ increases.
      *   *Test:* Measure discount rates for delays of (1 day vs. 2 days) and (100 days vs. 101 days).
      *   *Exponential (Rational/Preference Change):* Rates should be roughly constant.
      *   *Hyperbolic:* The rate for the short delay will be significantly higher than for the long delay.
      *   *Confidence:* High on the mathematical distinction; Medium on the clean separation in noisy psychological data.

  ### 4. Confidence Flags and Least Sure Claim

  *   **High Confidence:** The distinction between *evaluative judgment* and *motivational strength* is the primary flaw in your reconstruction. Akrasia requires a conflict between these two, not just a shift in motivation.
  *   **High Confidence:** Dynamic inconsistency is widely treated as a normative failure in decision theory, contradicting your claim that it isn't a failure of rationality.
  *   **Medium Confidence:** The claim that pre-commitment behavior cleanly distinguishes hyperbolic discounting from genuine preference change in naturalistic settings. While theoretically sound, in real-world psychology, people seek pre-commitment for many reasons (habit formation, signaling, etc.), which introduces noise.
  *   **Medium-High Confidence:** The diagnosis that the debate suffers from a "Revealed Preference vs. Normative Welfare" confusion.

  **Claim I Am Least Sure Of:**
  I am least sure about the claim that **pre-commitment behavior cleanly distinguishes hyperbolic discounting from genuine preference change in naturalistic settings.**
  *   *Reasoning:* While this is the standard theoretical test (Schelling 1984), in a graduate-level psychology context, you will find that subjects often seek constraints for reasons unrelated to time-inconsistency (e.g., cognitive load management, social accountability). Disentangling "I don't trust my future preferences" from "I don't trust my future executive function" is empirically difficult without very tight experimental controls.

  ### Summary for Your Citation
  You can cite the hyperbolic discounting literature (e.g., Ainslie, Laibson) as providing the *mechanistic explanation* for the motivational shift in akrasia, but you should clarify that this does not *dissolve* the normative problem. It explains *how* the will is weakened (via time-dependent utility weighting) without vindicating the choice as rational. The "confusion" you sensed is real: it is the conflation of *explaining the cause* of a deviation with *justifying the deviation* as rational.

  **Recommended Citation Strategy:**
  Frame hyperbolic discounting as the *sub-personal mechanism* that instantiates the *personal-level phenomenon* of akrasia. This allows you to use the psychological model without conceding the philosophical point that the behavior is non-normative.
