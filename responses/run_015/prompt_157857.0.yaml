answer: |-
  I am submitting this prospectus to propose a three-month independent research fellowship dedicated to resolving a conceptual ambiguity at the intersection of Alan Turing's philosophy of machine intelligence and contemporary philosophy of education. The core question driving this inquiry is whether Turing's seminal suggestion that we should build a child-like machine and subject it to education, rather than programming an adult intelligence directly, amounts to a substantive philosophical claim about concept acquisition or merely to an engineering heuristic about efficient computation. While it is textually settled that Turing advanced this proposal in his 1950 paper Computing Machinery and Intelligence, scholars remain deeply divided regarding the philosophical weight of his terminology. Existing interpretations tend to fall into two camps, neither of which fully settles the matter. The first camp reads the child-machine analogy as an early anticipation of modern machine-learning paradigms, treating education as a loose metaphor for statistical training over large datasets. The second camp dismisses the analogy as rhetorical ornament with no distinct philosophical content, arguing that Turing was primarily concerned with behavioral output rather than internal cognitive development. Both camps, I argue, miss a middle possibility that warrants rigorous investigation. Turing's scattered remarks about the need for both instruction and disciplinary correction may point toward a normative structure, suggesting education as a directed, evaluative practice in which a learner is held to standards of correctness that are not fully predetermined by the initial programming or the training data. This project asks whether this normative structure can be articulated rigorously enough to distinguish genuine conceptual acquisition from mere behavioral approximation, and whether applying that distinction to current artificial learning systems reveals a meaningful gap between pedagogical development and parameter optimization.

  The justification for this research lies in the insufficiency of the standard dichotomy between metaphor and anticipation to settle the philosophical status of machine learning. If Turing's notion of education is merely a metaphor for training, then contemporary large language models might be said to be educated in his sense. However, if his remarks imply a normative relationship between teacher and student involving correction based on shared standards of reason, then current systems may be optimizing parameters without acquiring concepts. This distinction is currently contested among historians of computing and philosophers of mind, with no consensus on whether Turing intended his use of terms like punishment and reward to be behaviorist operational definitions or placeholders for a richer pedagogical interaction. My hypothesis is that Turing's framework allows for a non-behaviorist interpretation where the machine learns to recognize norms of correctness rather than simply minimizing error functions. To test this, the project will employ a two-phase method. The first phase involves a careful reconstruction of Turing's scattered remarks on child machines, discipline, and the teacher's role across his published works and surviving correspondence. This reconstruction will be explicit about which claims are textually grounded and which are interpretive extensions. It is settled that Turing discussed the use of rewards and punishments, but it remains contested whether he viewed these as mechanical switches or as proxies for normative feedback. I will delineate these boundaries clearly to avoid attributing a unified theory of education to Turing where only fragments exist.

  The second phase will examine whether philosophy-of-science accounts of concept acquisition that emphasize social normativity and error-correction can be extended to artificial systems without collapsing into behaviorism. This involves engaging with contemporary debates in the philosophy of education regarding the nature of initiation into practices versus the acquisition of skills. A successful conceptual framework would look like a set of necessary conditions for pedagogical development that distinguishes it from parameter optimization, specifically focusing on the role of the teacher in enforcing norms that are not reducible to the data distribution. This framework must remain agnostic regarding the metaphysical status of the machine while demanding more than functional equivalence. However, I must specify conditions under which the project fails. The inquiry would be untenable if the education-training distinction requires assumptions about consciousness or biological embodiment that Turing explicitly rejected. Turing was cautious about anthropomorphizing machines, and if his model of education is shown to be strictly compatible with a behaviorist psychology that denies internal normative states, then the proposed middle ground collapses. Furthermore, the project fails if the framework proves purely stipulative, meaning it defines education in a way that no artificial system could ever meet by definition rather than by architectural limitation. Therefore, the criteria for success must be grounded in the logical structure of the learning process rather than metaphysical prerequisites.

  The scope of this research is restricted to conceptual architecture rather than empirical benchmarking or full archival exegesis. I will not be conducting experiments on neural networks nor attempting to catalogue every mention of education in Turing's archives. Instead, the focus is on the logical coherence of the normative claim itself. This restriction is necessary because empirical performance does not resolve philosophical questions about concept acquisition, and exhaustive archival work exceeds the timeframe of a three-month fellowship. Throughout this process, I will maintain a clear distinction between what is settled historical fact and what remains genuinely contested among scholars familiar with the topic. For instance, while it is settled that Turing believed machines could learn, it is contested whether he believed they could understand the rules they were following. By preserving this distinction, the proposal avoids presenting any disputed interpretation of Turing's intentions or of the philosophical issues as if it were the consensus view. The ultimate goal is to produce a refined philosophical taxonomy that clarifies whether current artificial learning systems are merely simulating the products of education or engaging in a form of learning that shares the normative structure Turing envisioned. If successful, this work will provide a clearer vocabulary for assessing the cognitive status of artificial agents, moving beyond the binary of tool versus mind to a more nuanced understanding of machine pedagogy. This clarification is urgent given the rapid integration of learning systems into educational and social infrastructures, where the difference between optimization and understanding carries significant ethical weight. I believe this focused conceptual investigation offers a viable path through the existing interpretive deadlock and promises to yield insights valuable to both historians of computing and philosophers of technology.
