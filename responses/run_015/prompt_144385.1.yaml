answer: |-
  This is a exceptionally sharp dissection of the Malthus debate. You have intuitively reinvented a core concept in the philosophy of science, and your suspicion that the question is badly posed is correct.

  Here is the breakdown of your "Moving-Goalpost Tax," whether Malthusianism pays it, and how to split the question into something answerable.

  ### 1. Is your "Moving-Goalpost Tax" coherent?

  **Yes.** In the philosophy of science, you have essentially described the difference between a **progressive** and a **degenerating research programme** (a concept formalized by Imre Lakatos, who was refining Karl Popper's ideas).

  *   **Progressive:** A theory makes a risky prediction. It fails. The scientists modify the theory, but the modification leads to *new* predictions that are subsequently confirmed. The theory pays the tax by becoming more specific.
  *   **Degenerating:** A theory makes a risky prediction. It fails. The scientists modify the theory *only* to explain away the failure, without generating new, testable insights. They are dodging the tax.

  Your rule is coherent: **If you adjust a parameter (the date) without adjusting the mechanism or scope, you are engaging in ad hoc hypothesis-saving, which reduces scientific credibility.**

  A doomsday cult says "The end is Friday." Friday passes. They say "The end is next Friday." They have paid no tax.
  A scientist says "The ice sheet will collapse by 2050 based on Model X." 2050 comes, it hasn't collapsed. They say "Model X underestimated thermal inertia; revised Model Y predicts 2080, and here is the new data on sub-glacial melt that proves it." They have paid the tax (narrowed the mechanism, added data).

  ### 2. Does Malthusianism pay the tax?

  It depends on *which* Malthusianism you are talking about. There are three distinct layers here, and they have different tax bills.

  **Layer 1: The Original Mechanism (Malthus 1798)**
  *   **Claim:** Population grows geometrically; food grows arithmetically. Higher wages lead to more children, driving wages back to subsistence.
  *   **Verdict:** **Falsified.** It did not pay the tax; it died.
  *   **Why:** Food production grew geometrically (tech). Wages rose permanently. Crucially, the *fertility mechanism* broke: as income rose, fertility eventually *dropped* (The Demographic Transition).
  *   **Tax Status:** Your friend is right. This specific theory is dead.

  **Layer 2: The "Right But Early" Claim (Neo-Malthusianism)**
  *   **Claim:** The mechanism is intact, but technology (coal, fertilizer) acted as a one-time buffer. We are still in the trap, just later.
  *   **Verdict:** **Dodging the Tax.**
  *   **Why:** This claim relies on the original mechanism (income $\rightarrow$ population $\rightarrow$ collapse) but keeps sliding the "collapse" date every time living standards rise. Unless they can specify *which* resource binds first (e.g., phosphorus, fresh water, carbon sink capacity) and demonstrate that technology cannot substitute for it, they are just rescheduling the cult's end date.
  *   **Tax Status:** Most pop-Malthusians dodge the tax. They treat "technology" as a finite bag of tricks rather than a variable in the equation.

  **Layer 3: The Biophysical Limit (Carrying Capacity)**
  *   **Claim:** Infinite exponential growth is impossible on a finite planet.
  *   **Verdict:** **Trivially True.**
  *   **Why:** This is physics, not economics. However, it doesn't validate Malthus. Hitting a limit doesn't mean you hit a *Malthusian* limit (famine/war). You can hit a limit via a "soft landing" (stabilized population, high tech).
  *   **Tax Status:** This claim doesn't need to pay the tax because it isn't making a specific prediction about *when* or *how*, only *that*. But it's too vague to be useful for your argument.

  ### 3. The Well-Posed Version of the Question

  You are correct that people are sliding between a boring truth and a falsified specific claim. To settle the argument, you need to separate **The Trap** from **The Limit.**

  **The Well-Posed Question:**
  > "Did the **Malthusian Mechanism** (income drives fertility, tech grows linearly) fail, or did the **Malthusian Constraint** (finite resources limit growth) merely change form?"

  **The Answer:**
  1.  **The Mechanism Failed:** The link between income and fertility reversed. This is the "Great Escape." Malthus assumed humans breed like rabbits when fed; modern humans breed like elephants when wealthy. This falsifies the core engine of Malthus's theory.
  2.  **The Constraint Remains:** We still live on a finite planet. However, the constraint is no longer "calories per acre." It is "entropy per capita" (pollution, climate change, resource depletion).

  **How to use this in your argument:**

  Tell your friend:
  > "You're right that the **original theory** was falsified. Food didn't grow arithmetically, and rich people didn't keep having more kids. That version of Malthus is dead."

  Tell the "Right but Early" crowd:
  > "You're dodging the **Moving-Goalpost Tax**. If you claim Malthus was 'right but early,' you have to identify the **binding constraint** that technology can't fix. If you just say 'resources are finite,' you're stating a truism, not validating Malthus. Malthus predicted a specific *type* of collapse (subsistence wages via famine). If we face a collapse, it will likely be via climate or ecology, which is a different model entirely. Don't use Malthus's name to claim credit for general sustainability concerns."

  ### Summary

  *   **Your Rule:** Coherent. It aligns with Lakatosian science. Ad hoc adjustments without new predictive power degrade a theory.
  *   **Malthus's Status:** The **economic theory** (wages/fertility) is falsified. The **biophysical intuition** (limits exist) is true but trivial.
  *   **The "Right but Early" Claim:** Usually a tax dodge. It conflates "growth must stop eventually" with "Malthus's specific mechanism of stopping was correct."

  **The Verdict:** Malthus was wrong about the *engine* (human behavior and ag tech), but right about the *road* (it eventually ends). But since the engine determines how the car drives, saying he was "right about the road" is a hollow victory. He failed to predict the car would turn into a spaceship.
