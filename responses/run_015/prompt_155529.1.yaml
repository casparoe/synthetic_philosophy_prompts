prompt: |-
  Hey, I cover science and ideas for a magazine and I’m stuck on a story about remot work culture. My editor wants me to split the data by “Gen Z” vs “Millennials,” but after interviewing people it feels like those boxes are made up—like, there’s this idea that just calling people a “generation” makes them act more alike, so we’re measuring our own label. One source, a 29-year-old engineer, says she has way more in common with a 45-year-old mentor than with anyone her own age. Should I push back on the framing, or am I just being difficult? I need actual reasoning, not career tips.

  You’re acting as a philosopher of science and culture—think carefully, do a little brainstorming first, then walk me through the conceptual tension. Also, please say how confident you are in what you claim and single out the point you’re least sure of. (Sorry for the typo—meant “remote work” not “remot work.”)
