prompt: |-
  I'm a mediator at a community center that mostly handles family disputes between immigrants from high-rule cultures and locals with more flexible norms. I'm tired of just winging it when one side says "the rules are clear" and the other says "you're being rigid". Write me a 15-minute decision procedure I can run before a session to pick whether to frame the conflict as tight-culture (explict rules, uniform enforcement, clear sanctions) or loose-culture (context, negotition, adpative norms). Don't just recycle the usual country-level sociology -- I need it for one dispute, with questions in order, stop points, and clear flags for where I'm just making a value call rather than applying the theory. Apply it to three cases: a teenager skipping a ritual obligation, cousins fighting over an informal loan, and a case where the procedure says go tight but you'd actually want loose. Say exactly where it breaks down, especially when people invoke "culture" strategically.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Mediator at a community center.
      *   **Context:** Disputes between immigrants from "high-rule" (tight) cultures and locals with "flexible" (loose) norms.
      *   **Problem:** Tired of "winging it" when one side claims rigid rules and the other claims rigidity is the problem.
      *   **Task:** Create a 15-minute *pre-session* decision procedure to choose a framing (Tight vs. Loose).
      *   **Constraints:**
          *   Do not just recycle country-level sociology (Gelfand et al. is implied but needs practical application).
          *   Must be for *one specific dispute*.
          *   Must include questions in order, stop points, and clear flags for value judgments.
          *   Must apply to three specific cases (Teenager/ritual, Cousins/loan, Counter-intuitive case).
          *   Must identify where the procedure breaks down (especially regarding strategic invocation of culture).

  2.  **Deconstruct the Theory (Tight vs. Loose):**
      *   *Tight:* Strong norms, low tolerance for deviance, clear sanctions, situational constraints are high.
      *   *Loose:* Weak norms, high tolerance for deviance, ambiguous sanctions, situational constraints are low.
      *   *Mediation Challenge:* If I frame it as Tight, I validate the rule-follower but risk alienating the flexibility-seeker. If I frame it as Loose, I validate the negotiator but risk disrespecting the rule-follower's core values.
      *   *Key Insight:* Culture isn't static. People *invoke* culture strategically. The procedure needs to detect *function* of the rule, not just the *existence* of the rule.

  3.  **Drafting the Procedure (The "Tight/Loose Diagnostic"):**
      *   *Time Limit:* 15 minutes. Needs to be fast, checklist-style.
      *   *Structure:*
          *   Phase 1: Fact-Finding (The "What").
          *   Phase 2: Function Analysis (The "Why").
          *   Phase 3: Power & Strategy Check (The "Who").
          *   Phase 4: Decision Matrix.
      *   *Stop Points:* Crucial for efficiency. If X is true, stop and decide.
      *   *Value Flags:* Where am I imposing my own bias?

      *(Self-Correction during drafting)*: Avoid asking "Is this culture tight?" That's the trap. Ask "Is this *rule* functioning as tight in this *context*?"

  4.  **Developing the Three Cases:**

      *   *Case 1: Teenager skipping ritual.*
          *   Conflict: Parent (Tight) vs. Teen/Local influence (Loose).
          *   Application: Does the ritual bind the community or just the family?
          *   Outcome: Likely Tight framing needed for respect, but Loose for future compliance.

      *   *Case 2: Cousins/Informal Loan.*
          *   Conflict: Lender (Tight: "Family promise") vs. Borrower (Loose: "Circumstances changed").
          *   Application: Is the "rule" about money or about hierarchy?
          *   Outcome: Often Loose framing works better to preserve relationship, unless hierarchy is the real issue.

      *   *Case 3: The "Go Tight but Want Loose" (The Stress Test).*
          *   Scenario: Safety issue masked as cultural rule? Or a case where "Tight" framing protects a vulnerable party?
          *   Let's go with: A domestic boundary issue where the "Tight" culture demands deference, but the "Loose" mediator wants autonomy.
          *   Actually, better: A case where the "Tight" rule actually protects the vulnerable party from exploitation, even if it feels restrictive.
          *   *Refinement:* Let's use a case where the procedure says "Tight" (because norms are clear and sanctions are real) but the Mediator feels "Loose" is more humane.
          *   *Example:* An elder demanding care from a daughter-in-law based on strict tradition. Procedure says "Tight" (norm is clear, community enforces it). Mediator wants "Loose" (individual choice). This highlights the value flag.

  5.  **Addressing Strategic Invocation:**
      *   People say "It's my culture" to win.
      *   The procedure needs a specific step to check consistency. "Do you follow this rule in other contexts?"

  6.  **Refining the Output:**
      *   Tone: Professional, practical, slightly clinical (it's a tool).
      *   Formatting: Bold headers, checkboxes, clear "STOP" indicators.
      *   Critique Section: Honest assessment of limitations.

  7.  **Final Review against Constraints:**
      *   15 mins? Yes, it's a checklist.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Value flags? Yes.
      *   Three cases applied? Yes.
      *   Strategic culture invocation addressed? Yes.

  8.  **Final Polish:** Ensure the distinction between *norm strength* and *conflict framing* is clear. The goal isn't to judge the culture, but to pick the *mediation lane* that has traction.

  *(Self-Correction on Case 3)*: Make sure Case 3 clearly shows the *procedure* dictating one thing and the *mediator's ethics* dictating another. This is the "breakdown" point requested.

  *(Self-Correction on Value Flags)*: Make them explicit boxes like "[VALUE FLAG]" so the user sees them immediately.

  Let's write it.cw
answer: |-
  # The Tight/Loose Diagnostic (TLD)
  **Purpose:** To determine whether to frame a mediation session around **Explicit Norms (Tight)** or **Contextual Negotiation (Loose)**.
  **Time:** 15 Minutes (Pre-Session)
  **User:** Mediator
  **Warning:** This tool does not judge which culture is "right." It judges which *frame* will generate traction.

  ---

  ## Phase 1: The Norm Audit (5 Minutes)
  *Goal: Determine if a "rule" actually exists or is being invented for the dispute.*

  **Q1. Specificity:** Can the party claiming "the rules" articulate the rule without using the word "respect" or "culture"?
  *   [ ] Yes (e.g., "Eldest son pays 60%," "No shoes in the house.")
  *   [ ] No (e.g., "You should know better," "It's just how we do things.")
  *   **[STOP POINT]:** If **No**, do not frame as Tight. You are dealing with an expectation, not a norm. Proceed to Loose framing.

  **Q2. Consistency:** Has the party claiming the rule followed it themselves in the last 12 months in similar contexts?
  *   [ ] Yes
  *   [ ] No
  *   [ ] Unknown
  *   **[VALUE FLAG]:** If **No**, you are likely witnessing *Strategic Invocation*. They are using "culture" as a weapon, not a guide. Lean Loose.

  **Q3. Community Enforcement:** If this rule were broken publicly, would third parties (family, community leaders) sanction the violator, or would they shrug?
  *   [ ] Sanction (Shame, exclusion, financial penalty)
  *   [ ] Shrug (Gossip only, or no reaction)
  *   **[STOP POINT]:** If **Shrug**, do not frame as Tight. A norm without enforcement is a preference. Proceed to Loose framing.

  ---

  ## Phase 2: The Threat Assessment (5 Minutes)
  *Goal: Determine the cost of deviance. Tight cultures often emerge where threats (social or physical) are high.*

  **Q4. Stability:** Is one party currently experiencing high instability (immigration status, job loss, health crisis)?
  *   [ ] Yes
  *   [ ] No
  *   **[VALUE FLAG]:** If **Yes**, be careful. Tight framing can feel like crushing a vulnerable person. Loose framing can feel like enabling irresponsibility. Note this tension.

  **Q5. Relationship Future:** Do the parties *need* to maintain a relationship after this session (e.g., co-parenting, business partners) or is this a one-off split (e.g., divorce, ending a loan)?
  *   [ ] Must Maintain
  *   [ ] Can Split
  *   **[STOP POINT]:** If **Must Maintain**, Tight framing risks long-term resentment. Loose framing is usually safer for ongoing relations *unless* safety is at risk.

  ---

  ## Phase 3: The Power Check (5 Minutes)
  *Goal: Identify who benefits from the framing.*

  **Q6. The Beneficiary:** If you enforce the "Tight" rule, who benefits?
  *   [ ] The person with more status/age/power
  *   [ ] The person with less status/age/power
  *   [ ] Both equally
  *   **[VALUE FLAG]:** If **The person with more power**, pause. You risk becoming an enforcer of hierarchy rather than a mediator.

  **Q7. The "Exit" Option:** Does the party resisting the rule have the ability to leave the community/context if they lose?
  *   [ ] Yes (High autonomy)
  *   [ ] No (Trapped by economics, visa, family)
  *   **[STOP POINT]:** If **No**, do not use Tight framing. It coerces compliance from a captive audience. Use Loose framing to negotiate safety/autonomy.

  ---

  ## Decision Matrix

  | If you checked mostly... | **Frame As TIGHT** | **Frame As LOOSE** |
  | :--- | :--- | :--- |
  | **Logic** | "We need to clarify the agreement we are all bound by." | "We need to find a solution that fits this specific situation." |
  | **Opening Line** | "Let's establish what the expectations were at the start." | "Let's look at what is workable for everyone right now." |
  | **Goal** | Compliance & Clarity | Adaptation & Relationship |
  | **Risk** | Alienating the flexible party | Disrespecting the traditional party |

  ---

  ## Application to Cases

  ### Case 1: The Teenager & The Ritual
  **Scenario:** 16-year-old (US-born) skips a weekly religious family gathering. Immigrant parent demands attendance ("It is the rule"). Teen says "It's oppressive."
  *   **Phase 1:** Rule is specific (Q1: Yes). Parent follows it (Q2: Yes). Community would sanction skipping (Q3: Sanction).
  *   **Phase 2:** Teen has low instability (Q4: No). Relationship must maintain (Q5: Yes).
  *   **Phase 3:** Parent has more power (Q6: More Power). Teen cannot easily leave home (Q7: No).
  *   **TLD Result:** **Mixed/Leaning Tight.**
      *   *Why:* The norm is real and enforced (Phase 1). However, the Power Check (Phase 3) flags a risk of coercion.
      *   *Mediation Strategy:* Frame the *obligation* as Tight (acknowledge the rule exists and matters), but frame the *execution* as Loose (negotiate the duration or manner of attendance).
      *   *Breakdown Point:* If you frame it fully Tight, you validate the parent but crush the teen's autonomy. If fully Loose, the parent feels you don't respect their faith.

  ### Case 2: Cousins & The Informal Loan
  **Scenario:** Cousin A lent Cousin B $5k verbally. B lost job, didn't pay. A says "Family promise is binding." B says "Circumstances changed, be flexible."
  *   **Phase 1:** Rule is vague (Q1: No - "Family promise" varies). A has lent money before but forgiven others (Q2: No). Community reaction is gossip only (Q3: Shrug).
  *   **Phase 2:** B has high instability (Q4: Yes). Relationship should maintain (Q5: Yes).
  *   **Phase 3:** A has financial power (Q6: More Power). B is trapped by debt (Q7: No).
  *   **TLD Result:** **LOOSE.**
      *   *Why:* Phase 1 fails the consistency and enforcement test. This isn't a "Tight" norm; it's a preference being weaponized.
      *   *Mediation Strategy:* "There is no written contract and family norms vary. Let's negotiate a payment plan based on current capacity."
      *   *Breakdown Point:* If A invokes "Honor," do not validate it as a cultural rule. Validate it as an *emotional* need for security, but keep the framing Loose.

  ### Case 3: The "Go Tight But Want Loose" (The Breakdown)
  **Scenario:** An elderly mother-in-law demands her daughter-in-law cook dinner every night. Daughter-in-law works full time. Mother-in-law cites "Traditional Duty."
  *   **Phase 1:** Rule is specific (Q1: Yes). Mother follows it (Q2: Yes). Community sanctions deviation (Q3: Sanction).
  *   **Phase 2:** Daughter-in-law has high stress (Q4: Yes). Relationship must maintain (Q5: Yes).
  *   **Phase 3:** Mother has status power (Q6: More Power). Daughter-in-law is economically dependent on the son/household (Q7: No).
  *   **TLD Result:** **Procedure says TIGHT.** (Norm is clear, enforced, consistent).
  *   **Mediator Instinct:** **WANTS LOOSE.** (The demand is exploitative and outdated).
  *   **Where It Breaks Down:**
      *   The TLD identifies that a Tight norm *exists*, but it cannot tell you if that norm is *ethical* in your context.
      *   **The Strategic Invocation:** The Mother-in-law is using "Tradition" to secure free labor. The TLD validates the tradition's existence, which might inadvertently validate the labor demand.
      *   **Correction:** You must override the TLD here. Use a **"Safety/Autonomy Override."** If Q7 (Exit Option) is "No" and Q6 (Beneficiary) is "More Power," you must prioritize the vulnerable party's autonomy over the cultural norm's clarity, even if the norm is "real."
      *   *Action:* Frame as Loose. "Traditions change when life circumstances (full-time work) change. Let's negotiate a new arrangement."

  ---

  ## Critical Limitations & Strategic Culture

  **1. The "Culture Card" Trap**
  People invoke culture strategically to freeze the negotiation.
  *   *Sign:* One party uses the phrase "In my culture..." but cannot name a specific sanction (Q3).
  *   *Fix:* Call it out gently. "I hear that this is important to your background. Is this a rule that applies to everyone in your family, or is this specific to this situation?"

  **2. The Mediator's Bias**
  *   *Sign:* You feel relief when you can frame a session as "Tight" because it gives you a rulebook to follow.
  *   *Fix:* Check Q6 (Beneficiary). If Tight framing makes *your* job easier but disempowers the vulnerable party, you are prioritizing efficiency over justice.

  **3. The Hybrid Reality**
  Most immigrants live in "Tight" family spheres and "Loose" public spheres.
  *   *Sign:* A parent demands Tight respect at home but wants Loose negotiation with the school system.
  *   *Fix:* Do not force a global label. Frame the *specific dispute* loosely or tightly. "In this house, we may have strict rules. In this mediation, we are negotiating how those rules fit a new reality."

  **4. The Ethical Override**
  The TLD is a diagnostic, not a moral compass.
  *   **Hard Stop:** If a "Tight" norm involves physical safety, legal liability, or fundamental human rights (e.g., access to education, medical care), **ignore the TLD.** Default to Local Law/Loose Negotiation that prioritizes safety. Do not mediate rights away in the name of cultural tightness.
