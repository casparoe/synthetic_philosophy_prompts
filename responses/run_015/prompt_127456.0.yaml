answer: |-
  So, picture this: There's a secret meeting happening in a basement behind a fondue restaurant in Bern. It's the "Cantonal-Länder-State Tribunal." Their only job is to issue binding "Subsidiarity Ratings" on government policies. Basically, they slap a label on everything from 0 to 100% measuring if it's actually local or just "Central-Government Cosplay."

  Last week, they reviewed a proposal on standardizing electrical outlet shapes.

  The US rep (let's call him Brad) jumps in: "Hold up, 10th Amendment. Powers not delegated to the feds are reserved to the States. This is state jurisdiction. We're good."

  The EU rep (Pierre) shakes his head: "Non. Principle of Conferral. The Union acts only within limits of competences conferred by treaties. If the treaty says 'Single Market,' this is ours. It's not about reservation, it's about permission."

  The German rep (Klaus) is just trying to get the Bundesrat to approve the meeting minutes, and the Swiss guy (Hans) wants to put the outlet shape to a national referendum, even though it's just one canton's problem.

  The Tribunal deliberates. They crunch the numbers. They look at the legal texts. Finally, they issue the rating: **98% Central-Government Cosplay.**

  Brad freaks out. "You can't rule on this! The 10th Amendment says you don't have this power!"
  Pierre yells, "Conferral! You weren't conferred this authority!"

  Then Hans, the Swiss guy, looks up from his checklist and drops the real issue. He says, "Wait. You're all arguing about who *has* the power. But who decided *who decides* who has the power?"

  Silence in the basement.

  See, that's the *Kompetenz-Kompetenz* problem. Both the 10th Amendment and Conferral pretend the center is limited. But the moment you set up a tribunal to enforce that limit, you've admitted the center gets to define the boundary.

  The Tribunal's final ruling? They declared that determining the scope of subsidiarity is itself a federal competence, not a local one. So, to protect subsidiarity, they had to centralize the definition of "local."

  They gave themselves an A+ for efficiency. Then they ordered another round of fondue on the EU expense account becouse apparently conferral doesn't cover lunch.
