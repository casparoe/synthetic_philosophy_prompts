  ### Commentary on the choices made

  Enacting deflationary tension through diminishing form, the poem begins with full sentences where "true" appears redundantly, mirroring the intuitive appeal of redundancy theory where the word adds no substance. The second instance is forced into a rhyme with "cue"; this highlights the structural necessity of the word, as it must rhyme to hold the stanza together, just as "true" is needed to hold generalisations together despite lacking property status. The semantic mismatch ("empty space is true") underscores the philosophical creak when moving beyond simple assertions. Finally, isolating "true" on line 16 visually strips the term of all predicate function, leaving it hollow. This progression from full sentences to a solitary word mimics the stripping-away of truth's supposed nature, leaving only the linguistic tool itself, exposed and doing heavy lifting without ontological weight.
