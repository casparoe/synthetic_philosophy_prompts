  Specifically, I want to produce a distinction between *ontological stability* and *epistemic stability*. Ontological stability is about the world—did the cup move? Epistemic stability is about the agent—do I still believe the cup is there? The classic frame problem conflates these. It assumes if the world is stable, the belief is stable. My paper will argue that epistemic stability has its own dynamics, independent of the world. You can have a stable world and an unstable belief (I forgot where the cup is). You can have an unstable world and a stable belief (I think the cup is there, but it moved).

  The result I'm aiming for is a framework that explains why the frame problem is hard not because the world is complex, but because maintaining epistemic stability is computationally expensive for the agent. It's not about the size of the database. It's about the refresh rate of the belief.

