answer: |-
  **Part One: The Sharp Question**

  Look, I know you've been digging into this frame problem stuff for your feature, and honestly, hearing you talk about that conversation with the researcher really clicked for me. It's rare you get a pivot that feels both technical and deeply philosophical at the same time. Usually, when we talk about the frame problem, we're talking about it like it's a bookkeeping error. Like, the robot knows what it did, but it doesn't know what it *didn't* do, so it has to list every single thing in the universe that stayed the same to prove it wasn't affected. That's the classic McCarthy and Hayes vibe from the late sixties. It's a computational explosion. You move a block, and suddenly you have to verify the color of the sky didn't change, and the price of tea in China is still the same, and the moon is still there. It's inefficient. It's a mess.

  But what this researcher was hinting at, and what I want to chase down for this term paper, is that we've been looking at the wrong side of the street. We've been treating it like a representation failure. Like, if we just had better logic, or better axioms, we could list the non-effects efficiently. But the suggestion here is that the problem isn't about listing. It's about knowing. It's about the epistemic friction between tracking change and tracking stability.

  So, here's the sharp question I want to put on the table for this paper: Is the frame problem actually a symptom of a deeper asymmetry in how any intelligent agent—whether it's a logic-based AI or a human brain—allocates attention to stability versus change?

  I want to argue that stability isn't just the background default. It's not just "everything stays the same unless I say otherwise." I want to push the idea that knowing something stayed the same is actually an active cognitive achievement, distinct from knowing something changed. When we look at the history of AI, we see all these attempts to solve the frame problem by making stability cheap. We use default logic to say "assume nothing changed." But that feels like a hack. It bypasses the friction. It doesn't explain *how* the agent knows it's safe to assume nothing changed. It just tells the agent to assume it.

  For this paper, I'm going to frame the frame problem not as a logical bug, but as an epistemic feature. The question is: Why is change salient and stability silent? And does that silence hide a cost? If I move a cup from the left side of the table to the right, I know the cup changed position. I also know the table didn't move. I know the room didn't spin. I know my coffee didn't turn into tea. But how do I know that? Did I check? No. Did I assume? Maybe. But if I'm a robot, and I assume, I might be wrong. If I'm a human, and I assume, I might be wrong too. We just don't notice it as often.

  I want to dig into this asymmetry. The standard view is that change is the signal and stability is the noise. We want to filter out the noise. But what if stability is the signal we're failing to track? What if the "frame" isn't a boundary we draw around our actions, but a boundary we draw around our knowledge? The researcher mentioned "epistemic friction." I love that phrase. It suggests resistance. It suggests that holding a belief constant over time requires work, just like updating a belief requires work. We just don't account for the work of holding still.

  So, the core thesis I'm proposing is this: The frame problem persists in AI not because our logic is weak, but because we're trying to solve an epistemic problem with ontological tools. We're trying to fix how the world is represented, when the issue is how the agent relates to that representation over time. The asymmetry is that change triggers an update mechanism, while stability triggers a persistence mechanism, and these two mechanisms are fundamentally different in cost and structure. The paper will argue that acknowledging this asymmetry changes how we evaluate solutions to the frame problem. It moves the goalpost from "how do we compute non-change efficiently" to "what does it cost to know something didn't change."

  This fits your feature perfectly because it takes this classic, dusty AI puzzle—the kind people think was solved in the nineties—and shows why it's still haunting us. It's haunting us because we solved the computation but not the cognition. We made the robots faster, but we didn't make them understand stability any better. They just assume it harder. I want to write a paper that makes this distinction clear, using the history of the problem to show where we went wrong, and then using cognitive science to show where the real answer might hide. It's about reframing the frame.

  And honestly, I think this angle gives you a great narrative hook. It's not just "AI is hard." It's "AI is hard because human knowing is hard, and we didn't realize we were building mirrors of our own blind spots." That's the kind of idea that sticks. So, that's the question. Is the frame problem really about the cost of knowing nothing happened? I think yes. And I think proving that requires looking at why the usual fixes don't actually touch the core of that friction.

  **Part Two: Why the Usual Fixes Leave the Asymmetry Untouched**

  Okay, so if I'm going to make this argument, I have to deal with the giants. I have to look at the stuff that supposedly solved the frame problem. You know the lineup. We've got the successor-state axioms from Reiter. We've got default logic. We've got non-monotonic reasoning. These are the heavy hitters. In a standard philosophy of AI class, you'd spend the semester just mapping these out. But for my purposes, I need to show why they miss the specific asymmetry I'm talking about. I need to show that they solve the engineering problem but leave the philosophical problem wide open.

  Let's start with the classic situation calculus stuff. McCarthy and Hayes set this up. You have fluents—things that can change—and actions. The problem is that for every action, you need frame axioms to say what doesn't change. If I open a door, the door changes from closed to open. But the light stays on. The wall stays white. The floor stays solid. If I have a thousand fluents, I need thousands of axioms for every action. It's combinatorial explosion. It's unmanageable.

  So, enter the solutions. The big shift happened when people stopped trying to list what didn't change and started assuming it. This is where default logic comes in. Reiter and others said, look, let's just assume fluents stay the same unless there's evidence to the contrary. This is the "common sense law of inertia." It's a default. You don't prove stability; you presume it. If you shoot a gun, the default is that the turkey stays alive unless you have a rule saying shooting kills turkeys. This solves the computational load. You don't need thousands of axioms. You just need one default rule: "Things persist."

  Then you have successor-state axioms. This is a bit more formal. Instead of listing what stays the same, you define exactly what changes. A fluent is true in the next state if and only if the action made it true or it was already true and nothing made it false. It's a compact way of handling the logic. It works beautifully for formal verification. If you're building a robot arm in a factory, this stuff works. You can prove the robot won't drop the widget.

  But here's where I think they fall short for my thesis. All these solutions treat stability as a logical shortcut. They treat it as a lack of information. If I don't know it changed, it didn't. That's the default. But that's not how knowledge works. That's how ignorance works. The asymmetry I'm talking about is about *knowing* what stayed the same. When I look at my coffee cup and know it's still hot, I'm not just saying "I have no evidence it cooled." I'm actively tracking the thermal insulation. I'm modeling the environment.

  The default logic approach wipes out the friction. It says "assume no friction." But the researcher's point was that the friction is real. There is an epistemic cost to maintaining belief stability. When these formal systems assume persistence, they are bypassing the work of verification. They are essentially saying, "We won't check." But in the real world, checking is sometimes necessary. If I leave my coffee for an hour, assuming it's hot is a bad default. The default logic doesn't tell me *when* to stop defaulting. It doesn't capture the decay of stability.

  Non-monotonic reasoning tries to handle this by allowing beliefs to be retracted. If I find out the coffee is cold, I retract the belief that it's hot. But again, this is reactive. It's based on new information arriving. It doesn't account for the internal maintenance of the belief during the time gap. The asymmetry is that change forces an update, but stability requires maintenance. The formal systems treat stability as zero-cost maintenance. They assume the belief just sits there, perfectly preserved, until an action touches it.

  But beliefs don't sit still. Memory degrades. Context shifts. Attention wanders. The formal fixes ignore the agent's internal state. They treat the agent as a perfect logician who never forgets and never gets tired. But the frame problem is supposed to be about common sense. Common sense is messy. It's human. And humans don't treat stability as a logical default. We treat it as a prediction. We predict the wall will still be there when we turn around. Sometimes we're wrong.

  The successor-state axioms are even more rigid. They define change precisely. But they don't explain how the agent identifies the relevant fluents in the first place. How does the robot know which things *could* change? That's the qualification problem, which is related. But even deeper, how does it know which things are *worth* tracking? The asymmetry is in the selection. We notice change because it's surprising. We ignore stability because it's expected. But the expectation is the hard part. Where does it come from?

  The usual fixes say it comes from the logic rules. We program the rules. But that's not learning. That's not intelligence. That's instruction. If I want to understand the frame problem as a fundamental issue of agency, I can't rely on solutions that require an external programmer to define the persistence rules. I need to understand how the agent generates those rules. How does it learn that walls are stable and clouds are not?

  By treating stability as a default, these systems hide the asymmetry. They make stability the null hypothesis. But I want to argue that stability is an active hypothesis. It's something you test, even if the test is subconscious. When the formal systems say "assume persistence," they are removing the test. They are removing the friction. And that's why the problem keeps coming back in weird clothes. We solve the logic, but the cognition remains broken. We build robots that can plan a path but don't understand that the path might vanish. They assume the world is static unless told otherwise. But the world is dynamic unless constrained.

  So, for this section of the paper, I'm going to walk through these technical solutions—Reiter, Shanahan, the whole crowd—and acknowledge their success in computer science while highlighting their failure in philosophy of mind. I want to show that they solved the "bookkeeping" problem but left the "knowing" problem untouched. They made the ledger balance, but they didn't explain why the accountant cares about the ledger. The asymmetry remains because the systems don't track stability; they just presume it. And presumption isn't knowledge. That's the gap I want to exploit. It's the gap between logical consistency and epistemic justification.

  **Part Three: Laying Out the Method**

  So, if the formal logic stuff is too sterile, where do I go? I can't just sit in an armchair and think harder about axioms. I need data. I need to look at how actual agents handle this. That means looking at humans. And maybe some modern machine learning stuff, but mostly humans, because we're the only ones who actually seem to solve the frame problem in the wild, even if we mess up sometimes.

  My method for this paper is going to be comparative. I want to put the formal belief-update rules side-by-side with human intuitive physics judgments. I know that sounds a bit like cognitive science creep into a philosophy paper, but I think it's necessary. You can't talk about epistemic friction without looking at the epistemic agent.

  Here's the plan. First, I'll map out the formal side. I'll take a standard belief update model, maybe something like AGM belief revision or a simplified Bayesian update, and show how it handles stability. In these models, stability is usually represented by a high prior probability or a inertia rule. I'll lay out the math lightly—just enough to show the structure. I want to show that in these models, the cost of keeping a belief the same is zero. It's the path of least resistance.

  Then, I'll switch to the human side. I want to look at experiments in intuitive physics and change detection. There's this whole body of work on change blindness. You know, where people watch a video and a huge object changes between cuts, and they don't notice. That seems like a failure of tracking change. But I want to flip it. I want to look at it as a success of tracking stability. The brain assumes the scene is stable to save processing power. It's betting on inertia.

  But here's the key: I want to look at cases where that bet fails. When the stability assumption is wrong, how does the human react? There's a friction there. A surprise. A prediction error. In the formal systems, a prediction error just triggers an update. In humans, it triggers a cascade. We stop. We look. We re-evaluate. That cascade is the epistemic friction. It's the cost of realizing our stability model was wrong.

  I also want to look at infant development. There's research on object permanence. Babies learn that things exist even when hidden. That's a stability judgment. They learn that objects don't just vanish. But they also learn that some things do vanish—like sounds, or lights. So they are learning a differential map of stability. Some things are stable, some are not. The formal systems usually have this baked in by the programmer. The baby has to learn it.

  So my method involves analyzing these learning processes as solutions to the frame problem. The baby is solving the frame problem by building a model of what changes and what doesn't. And they do it through interaction. They poke things. They drop things. They test the friction.

  I'll also bring in some examples from predictive processing theories. This is pretty hot in philosophy of mind right now. The idea that the brain is a prediction machine. It predicts the sensory input. If the input matches the prediction, nothing happens. That's stability. If it doesn't match, you get a prediction error. That's change. This fits my asymmetry thesis perfectly. Stability is the absence of error. Change is the presence of error. But the absence of error isn't nothing. It's the successful suppression of error signals. It takes energy to maintain the prediction.

  So, I'll compare the logical "default true" with the predictive "error suppression." In logic, stability is free. In predictive processing, stability is work. It's the work of keeping the prediction active. If you stop predicting, you stop knowing. That's the friction.

  I need to be careful not to get too bogged down in the neuroscience. I'm a philosopher, not a biologist. I'll keep the focus on the epistemic implications. What does this mean for knowledge? It means knowledge isn't a static state. It's a dynamic process. Knowing the wall is there isn't having a fact in a database. It's the active maintenance of a prediction that the wall will be there.

  I'll structure this section by setting up the comparison clearly. Formal Model vs. Cognitive Model. I'll use specific examples. The "cup on the table" scenario is classic. I'll run it through both models. In the formal model, the cup stays there by default. In the cognitive model, the cup stays there because my visual system is continuously confirming it, or my memory is holding the position active. If I look away, the certainty decays. That decay is the friction. The formal model doesn't have decay unless we program it. The cognitive model has it inherently.

  This method allows me to bridge the gap between the AI history and the human experience. It shows why the AI solutions feel unsatisfying—they lack the decay. They lack the cost. And it gives me concrete ground to stand on. I'm not just speculating about "knowing." I'm looking at how knowing is implemented in systems that actually survive in the world.

  Oh, and I should mention I might look at some recent deep learning approaches too. Like, how do neural nets handle object permanence? They often struggle with it unless specifically trained. They don't have a built-in bias for stability like humans seem to. This reinforces the idea that stability isn't a default logical state, but a learned inductive bias. That fits the asymmetry argument. Change is data. Stability is a model. You need data to build the model, but once you have it, the model filters the data.

