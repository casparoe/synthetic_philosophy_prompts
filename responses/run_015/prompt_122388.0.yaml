  2. If parties swapped platforms, would your moral profile migrate with you or stay loyal to your old team? Migration leads to Moral Realism while loyalty leads to Cultural Arbitrariness, committing you to either unmoored morality or voters incapable of learning.
  3. Since these intuitions are heritable yet shift with framing, are they unreliable noise or robust signals? Noise leads to Global Skepticism while signals lead to Contextual Reliability, committing you to trusting a mechanism you know can be tricked by wording.
  4. If one side's concern reaches further, is that breadth a reason to think they are right or just more output? Breadth-as-truth leads to Expansive Universalism while breadth-as-output leads to Symmetrical Tribalism, committing you to either privileging numbers over depth or dismissing expansion as mere volume.
  5. The cell combining Cultural Arbitrariness with Expansive Universalism is incoherent, while Global Skepticism and Symmetrical Tribalism are indistinguishable in practice. "Only the incoherent cell lets you win arguments without believing them," is a line only the speechwriter would use.
