  2. **Prediction for the closed homogenous case**
  For the closed homogenous universe, I'm leaning toward her saying the water climbs. Since she rejects Mach, the presence of the cosmic fluid shouldn't fundamentally *cause* inertia. Instead, inertia arises from the local metric structure. In a homogenous closed universe, the local inertial frames are typically aligned with the comoving fluid. If the bucket spins relative to that fluid, it spins relative to the local inertial frame. Therefore, centrifugal forces arise. She wouldn't say the fluid "allows" rotation; she'd say the metric structure exists, and the bucket violates geodesic motion relative to it. The fluid is just content within the spacetime, not the ground of inertia. However, I'm slightly hesitant because closed universes sometimes enforce Machian constraints in GR solutions, but her anti-Mach stance suggests she'd prioritize the local metric definition over global matter constraints.

  3. **The closest analog**
  The closest analog is definitely the first case: Newton's Bucket in an otherwise empty universe. In both scenarios, she asserts that rotation is real even without distant fixed stars to serve as a reference. The addition of homogenous fluid in the new case doesn't change the metaphysical ground for her; since she denied distant matter causes inertia in verdict three, the uniform fluid here is functionally similar to emptiness regarding the *source* of inertial effects.

  4. **The underdetermination and the fork**
  Here's where I hit a fork. Her track record might underdetermine the role of global topology. Principle A is "Strict Metric Independence": inertia is purely local metric structure, unaffected by global matter. Principle B is "GR Boundary Sensitivity": closed topologies constrain the metric such that inertial frames lock to matter. Principle A predicts water climbs regardless. Principle B suggests in closed universes, the fluid defines the frame. If she holds B, the homogenous fluid dictates the inertial frame more strongly than in empty space. This distinction rests on whether she sees GR's topology as metaphysically active or just a stage.

  5. **The tell-apart case**
  To distinguish these, consider a Gödel-style rotating universe. If the entire cosmic fluid rotates relative to the local inertial frames, does a bucket static relative to the fluid experience centrifugal force? Principle A (Metric Independence) says no—the bucket isn't rotating relative to the metric. Principle B (Boundary Sensitivity) might say yes—the matter distribution drags the inertial frames along. Her answer here would reveal if she privileges the metric field or the matter-topology interaction.
