answer: |-
  Here is the spec. I am taking the position that the Orwellian/Stalinesque distinction is empirically empty for the purposes of a scientific theory of timing, not because we lack better tools, but because "time of experience" is not a primitive property of neural events. It is a constructed attribute of the content.

  ### The Spec: Requirements for a Theory of Experience Timing

  To satisfy your two jobs (time-locking for experimenters, calibrating subject reports), a theory must meet the following requirements. I have marked them **Non-Negotiable** (the theory fails without them) or **Preference** (theoretically optional but practically necessary to avoid bloat).

  1.  **Neural Correlate Specificity (Non-Negotiable)**
      *   **Requirement:** The theory must identify a specific class of neural events (e.g., ignition, recurrent processing, stable attractor state) that constitutes the "presence" of content.
      *   **Reason:** Job 1. Without this, the experimenter cannot time-lock. You cannot measure the timing of experience if experience does not map to a physical state with a timestamp.
      *   **Constraint:** The timestamp must be assignable to a window smaller than the behavioral report latency.

  2.  **Report Fallibility (Non-Negotiable)**
      *   **Requirement:** The theory must provide a mechanism by which a subject's report of *when* they experienced something can diverge from the neural timestamp of that experience.
      *   **Reason:** Job 2. If reports are authoritative, Color Phi is impossible (the subject says it happened mid-flight, so it did). If reports are worthless, science stops. The theory must treat "when I felt it" as a *judgment* based on content, not a readout of a clock.

  3.  **Postdictive Integration Window (Non-Negotiable)**
      *   **Requirement:** The theory must specify a mechanism where later inputs alter the content assigned to earlier times without positing a "waiting room" where unconscious content sits fully formed.
      *   **Reason:** Handles Color Phi, Tactile Rabbit, and Chronostasis. The "mid-flight" color change must be generated by the integration of Flash A and Flash B, not by Flash A alone.

  4.  **Feature Asynchrony Tolerance (Preference)**
      *   **Requirement:** The theory should allow different features (motion, color, location) to have different "times of experience" within a single object percept.
      *   **Reason:** Neurophysiology shows different latencies for magnocellular (motion) and parvocellular (color) pathways. A single "broadcast deadline" is biologically implausible.
      *   **Status:** Preference, because a theory *could* posit a final synchronization stage, but it adds latency and complexity.

  5.  **No Inaccessible Consciousness (Non-Negotiable)**
      *   **Requirement:** The theory must not posit a conscious experience that is, even in principle, inaccessible to report, action, or memory.
      *   **Reason:** This is the tie-breaker. If an experience happens but is immediately overwritten so that no trace remains (the "Orwellian" hidden draft), it is functionally identical to it never happening. Positing it violates parsimony and makes the theory unfalsifiable.

  ### The Distinctions: Real vs. Fake

  You asked which distinctions hold water. Here is the verdict:

  *   **Time-of-Experience vs. Time-Represented-in-Experience:** **Real.** This is the critical split. The *time-of-experience* is when the neural state becomes stable/accessible (Job 1). The *time-represented* is the timestamp *within* the content (e.g., "I saw it happen at t=0"). In Phi, these come apart.
  *   **"Experience Happened Late" vs. "Experience Was Revised":** **Fake.** This is the Orwellian/Stalinesque trap. "Revision" implies an original version existed. If the original version never reached the threshold for Report/Access (Requirement 5), it was not an experience. It was just processing. There is only "Construction."
  *   **Determinate Temporal Location vs. Measurable Location:** **Fake.** If it is determinate, it must be measurable in principle (via Neural Correlate Specificity). If it is not measurable, "determinate" is doing no work.
  *   **Report-as-Data vs. Report-as-Authority:** **Real.** Reports are data points to be explained, not ground truth.
  *   **Unified Experience vs. Feature-Specific Times:** **Real.** The "single broadcast deadline" is likely a fiction. The unity is a retrospective bind, not a simultaneous arrival.

  ### The Probe Case: Can the Tie Be Broken?

  **Verdict:** No. The tie is unbreakable, but not because of measurement limits. It is unbreakable because the question presupposes a "true time of experience" that does not exist.

  **Analysis of your design:**
  You propose probing at delay *d* to see if the color has changed.
  *   **If the subject says "Yes" (changed) before Flash B:** This implies the brain predicted the change or the probe was integrated into the same postdictive window.
  *   **If the subject says "No" (unchanged):** This implies the narrative wasn't fixed.

  **Why it fails to separate Orwellian from Stalinesque:**
  The probe itself (the click or third dot) is subject to the same integration window as the Phi stimulus. You are measuring the **width of the integration window**, not the "moment of consciousness."
  If you get a sharp switch in the psychometric function, you have found the deadline for *narrative consistency*. You have not found the moment the "red" became "green" in a private theater. The probe's timing is warped by the same mechanism warping the Phi.

  **Is there any design that works?**
  Only a design that dissociates **access** from **phenomenology**.
  *   *Example:* Blindsight or Masking. If a subject can act on the color (force choice) at time *t* but reports seeing it at *t+delta*, you have separated processing time from report time.
  *   *Limit:* This still doesn't tell you when it "felt like" something. It only tells you when the information became available for different systems.
  *   *Conclusion:* The tie is unbreakable because of **Metaphysics**, not measurement. The "time of experience" is not a point on a timeline; it is a property assigned to a memory trace.

  ### The Impossible Trinity

  You asked for the subset of desiderata that cannot be jointly satisfied. Here is the conflict:

  1.  **Phenomenal Veridicality:** The subject's report of *when* they felt the event is accurate.
  2.  **Neural Latency:** Neural processing takes time (Flash B must arrive before the mid-flight change can be computed).
  3.  **Illusion Validity:** The Color Phi effect is real (the change is perceived mid-flight).

  **You cannot have all three.**
  *   If (1) and (3) are true, then neural processing must be instantaneous (violates 2).
  *   If (2) and (3) are true, the subject's report of timing must be wrong (violates 1).
  *   If (1) and (2) are true, the illusion cannot happen (violates 3).

  **Resolution:** Any working scientific theory must drop **(1) Phenomenal Veridicality**. The subject is wrong about the timing. This is non-negotiable for a physicalist theory.

  ### The Single Exclusionary Requirement

  The requirement that does the most work excluding candidates is:
  **"The theory must not posit a conscious state that is in principle inaccessible to report or action."** (Requirement 5 above).

  *   **Why:** This kills the **Orwellian** view immediately. The Orwellian view says: "You really experienced Red-then-Green, but your memory was edited to Green-Mid-Flight."
  *   **The Cut:** If the "Red-then-Green" experience was conscious, it must be accessible. If it was accessible, why is it gone? If it's gone without a trace, it wasn't conscious. It was pre-conscious processing.
  *   **Impact:** This forces the theory to be **Stalinesque/Constructionist**. The experience *is* the final draft. There is no "original footage." This also kills "Snapshot" theories that require a discrete frame buffer where the "true" image sits before projection.

  ### Scorecard for Usual Suspects

  | Theory | Job 1 (Time-Lock) | Job 2 (Report Error) | Handles Phi? | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Multiple Drafts** | **Pass.** (Time-lock to narrative stability). | **Pass.** (Reports are just another draft). | **Pass.** (Postdiction is standard). | **Best Fit.** Matches the spec, though "draft" metaphor can be misleading. |
  | **Snapshot / Cinematic** | **Fail.** (Discrete frames don't match neural continuity). | **Fail.** (Cannot explain mid-frame changes). | **Fail.** (Requires impossible latency). | **Reject.** Biologically implausible. |
  | **Global Workspace** | **Pass.** (Time-lock to Ignition). | **Pass.** (Ignition ≠ Stimulus Onset). | **Pass.** (Integration happens pre-ignition). | **Strong.** Needs to specify how ignition handles temporal attributes. |
  | **Specious Present** | **Fail.** (Window is too vague for time-locking). | **Pass.** (Allows timing distortion). | **Pass.** (Built for this). | **Mixed.** Good phenomenology, bad neural precision. |
  | **Plain Orwellian** | **Fail.** (Time-locks to a hidden event). | **Fail.** (Treats report as corrupted data, not constructed). | **Pass.** (But via magic editing). | **Reject.** Violates "No Inaccessible Consciousness." |

  ### Caveats and Guesses

  1.  **The "Ignition" Timestamp:** I am assuming Global Workspace-style ignition is the best candidate for Requirement 1 (Neural Correlate). This is a guess. Recurrent Processing Theory might argue for an earlier timestamp. The spec holds regardless, but the *neural target* shifts.
  2.  **Feature Binding:** I am assuming feature-specific timing (Requirement 4) is real. It is possible there is a final "bind" stage. If there is, the "Impossible Trinity" becomes even tighter.
  3.  **The Probe:** I am confident the probe cannot break the tie, but I acknowledge that a dual-task paradigm (probe response vs. phi report) *might* reveal latency differences between motor access and phenomenological judgment. This would refine the "Report Fallibility" requirement but wouldn't solve the metaphysical tie.

  ### Final Position

  The Orwellian/Stalinesque distinction is a **category error**. It treats "experience" as a movie reel that can be spliced. Experience is more like a legal verdict: it is the final output of a deliberative process. Asking "when did the verdict happen?" refers to the moment of announcement (access/report), not the moment the evidence was gathered (stimulus).

  For your experimenter (Job 1): Time-lock to the **onset of stable, report-ready activity** in the relevant cortical network (likely frontal-parietal for report, occipital for content).
  For your subject (Job 2): The subject is **authoritative on content** (it looked green) but **non-authoritative on timing** (it did not happen when they say it did).

  The requirement that saves the theory from circularity is **No Inaccessible Consciousness**. If you can't measure it, access it, or act on it, it wasn't an experience. It was just noise.
