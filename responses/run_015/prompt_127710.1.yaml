answer: |-
  hey there, it is really great that you are digging into book ten of the confessions because that is exactly where augustine gets most tangled up in the mechanics of his own interiority and where your intuition about the tension is spot on. the passage you are wrestling with is famous for good reason because augustine is trying to reconcile two things that feel contradictory on the surface. on one hand he argues that the mind is immediately present to itself, meaning it cannot be absent from itself in the way it might be absent from a physical object, yet on the other hand he describes memory as a vast cavern where things are buried and where he has hidden himself from god. the key to unlocking this without forcing a modern psychological framework onto him is to realize that for augustine hiding is not spatial concealment but volitional avoidance. when he says the mind is present to itself he means ontologically, that the substance of the mind is always there to be known, but he does not mean that the mind always attends to itself clearly or truthfully. so self deception is not impossible for him, but it is not achieved by one part of the soul tricking another part in a spatial sense, nor is it strictly about transparency. instead it is about the weight of love directing the gaze of the mind.

  you asked whether he thinks self deception is impossible because the self is transparent or if there is a split, and the answer is closer to a kind of self estrangement driven by disordered love. augustine inherits a neoplatonic view where evil is a privation or a turning away from the higher good toward a lower good. when he hides in the secret places of his heart he is not making himself invisible to his own consciousness but rather refusing to look at what is there because looking at it would require confronting god who is the light illuminating that memory. so the deception happens not because the self is opaque to itself but because the will refuses to attend to the truth that is present. this is why he can say he knows the law but does not do it, or that he knows chastity is good but loves lust more. the knowledge is present, the self is present, but the love is misaligned. this means self deception is possible as a form of bad faith where you know the truth on one level but organize your life around a falsehood because it brings you pleasure or comfort. it is less about not knowing and more about not wanting to acknowledge what is known.

  regarding your idea about the time lag and tricking a future version of yourself, that is a fascinating hypothesis and it does resonate with augustine but not in the way modern psychology might frame it. augustine does have a very sophisticated theory of time in book eleven where he argues that past present and future all exist in the mind as memory contuition and expectation. so in a sense all deception happens in the present distension of the soul. however he places a huge emphasis on habit which is formed over time. he describes sin as forming a crust or a weight that makes it harder to turn back. so while the mechanism of deception is volitional in the present moment the capacity to deceive oneself is built up over time through repeated acts that dull the conscience. your idea maps onto him if you view the time lag as the formation of habit rather than a strategic trick played on a future self. he would say you are not tricking a future self so much as you are enslaving your present self through the accumulation of past choices that make the truth harder to see now. so you are not forcing modern psychology onto him entirely but you might be temporalizing something he sees as more ontological and moral.

  i want to be honest with you about where my reasoning here is weakest because i am synthesizing his metaphysics of mind with his moral psychology and there is room for debate on how tightly those fit together in the confessions specifically. my interpretation relies heavily on the idea that the will is the primary driver of this obscurity but there are moments where augustine speaks of forgetfulness or the abyss of memory in ways that suggest a passive loss of self knowledge that isn't purely volitional. if i were to encounter a counter example that would change my mind it would be a passage where augustine describes a moment of self deception that occurs without any element of avoidance or disordered love, perhaps where he claims he was genuinely ignorant of a sin in the moment without any prior habit or willful blindness. if he argues that the mind can be truly unknown to itself in a substantive way rather than just inattentive to itself then my volitional explanation would fail. another counter example would be if he explicitly describes the soul as having distinct compartments that can be locked off from one another spatially rather than just through the focus of attention.

  ultimately i think your intuition about self estrangement is closer to augustine than the idea of a split self. he wants to maintain the unity of the soul because a split soul would undermine moral responsibility. if one part tricks another part who is to blame. by keeping the self unified but the will divided he preserves the guilt necessary for confession. so self deception is possible but it is a moral failure of attention and love rather than a cognitive glitch or a structural split. your time lag idea is a helpful heuristic for understanding how habit works but augustine would likely say the deception is always happening now even if the capacity for it was built in the past. i hope this helps clarify the tension without smoothing it over too much because the tension is really where the insight lives. let me know if you want to dig deeper into book eleven on time because that really complicates how we understand the present moment of deception. thanks for sending this over it is a really rich problem to think through.
