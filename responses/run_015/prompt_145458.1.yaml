  ### Empty / Incoherent Cells
  *   **Node 7 (Lottery) + Node 8 (Certain Transfer) Inconsistency:** If a user chooses "Flip a Coin" in Node 7 (valuing ex-ante fairness) but "Give to Best-Off" in Node 8 (ignoring ex-post priority), they hold an **Incoherent** position. They value fairness in risk but not in outcome, without a unifying principle.
  *   **Node 5 (Priority) + Node 6 (Risk Neutral):** If a user claims weights do the work of *priority* (Node 5B) but remains *risk neutral* over utility (Node 6A), they are **Unexplored/Unattractive**. Priority usually implies risk aversion over utility (concave transformation). Doing priority via weights while remaining risk neutral is mathematically possible but philosophically unstable (why weight the poor more if you aren't risk averse regarding their welfare?).

