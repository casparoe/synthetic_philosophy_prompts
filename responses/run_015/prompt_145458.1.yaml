  # The Harsanyi Aggregation Decision Tree

  This tree is designed to dissect the disagreement in your reading group by forcing concrete choices on the *premises* of Harsanyi's theorem rather than the theorem itself. Harsanyi's Aggregation Theorem states that if individual preferences and social preferences satisfy von Neumann-Morgenstern (vNM) rationality and the Pareto principle, social welfare must be a weighted sum of individual utilities ($W = \sum a_i U_i$). The fight is almost always about what the $a_i$ represent and whether we should accept the vNM axioms in the moral domain.

  There are **9 Nodes** and **10 Leaves**.

  ---

  ### Node 1: The Colony Ship (Population Variability)
  **Scenario:** You control a resource that can either (A) increase the welfare of 1 million existing people from 100 to 101, or (B) create 10,000 new people at welfare 50 while leaving the existing 1 million at 100.
  *   **Choice A:** Choose (B). Creating new happy lives adds value even if it doesn't help existing people. (**Go to Node 2**)
  *   **Choice B:** Choose (A). Only existing people count, or average welfare matters more than total. (**Go to Node 2**)
  *   **Choice C:** "This question is ill-posed for aggregation; Harsanyi assumes a fixed population." (**Go to Node 2**, but flag that Total/Average distinction collapses later).

  ### Node 2: The Impartial Spectator (Meta-Frame)
  **Scenario:** You are deciding a policy for Alice and Bob.
  *   **Choice A:** I am summing *their* distinct preferences as an external observer. (**Aggregation Frame** → Go to Node 3)
  *   **Choice B:** I am deciding as if I have a 50% chance of *being* Alice or a 50% chance of *being* Bob. (**Veil of Ignorance Frame** → Go to Node 3)

  ### Node 3: The Source of Authority (Meta-Position Check)
  **Scenario:** Why did you choose Node 2B (Veil)?
  *   **Choice A:** Because that is the definition of moral impartiality. (**Moral Commitment** → Go to Node 4)
  *   **Choice B:** Because that is what a rational agent would do for their own self-interest under uncertainty; morality *just is* rational prudence from this perspective. (**Rational Prudence** → **Leaf 1: Meta-Position**)
      *   *Leaf 1 Description:* **The Single Observer Representation.** You view Harsanyi's result not as aggregating distinct minds, but as a representation theorem for one person's preferences under uncertainty. The "social welfare function" is just your own expected utility function.

  ### Node 4: The Dictator's Stipulation (Weight Freedom)
  **Scenario:** You are writing the social welfare function. Can you assign weight $a_{Alice} = 10$ and $a_{Bob} = 1$ without further justification?
  *   **Choice A:** Yes. The theorem allows any positive weights; morality or politics must fix them later. (**Free Parameters** → **Leaf 2: Blank Cheque**)
      *   *Leaf 2 Description:* **The Blank Cheque.** You accept the linear form but deny the theorem justifies utilitarianism. The weights are free parameters requiring a separate moral theory.
  *   **Choice B:** No. Weights must be equal (or determined by welfare levels). (**Constrained Weights** → Go to Node 5)

  ### Node 5: The Calibrated Pain (Work of Weights)
  **Scenario:** Alice (Rich) and Bob (Poor) both report a pain level of "10/10" on a calibrated scale.
  *   **Choice A:** Their pain counts equally in the sum. The weights are only for scaling interpersonal comparability. (**Comparability** → Go to Node 6)
  *   **Choice B:** Bob's pain counts more because he is worse off. The weights do the work of priority. (**Priority** → Go to Node 7)
      *   *Note:* This is the branch you suspected. If Choice B, the "sum" is doing priority work, not just aggregation.

  ### Node 6: The Utility Gamble (Risk Attitude)
  **Scenario:** Option X gives a population 100 welfare for sure. Option Y gives 50% chance of 200 welfare and 50% chance of 0 welfare. Expected utility is equal.
  *   **Choice A:** Indifferent. (Risk Neutral over Utility). (**vNM Compliant** → Go to Node 8)
  *   **Choice B:** Prefer X. (Risk Averse over Utility). (**vNM Violator** → **Leaf 3: Ex Post Prioritarianism**)
      *   *Leaf 3 Description:* **Ex Post Prioritarianism.** You transform utilities (concave function) before summing. You violate Harsanyi's vNM assumption to get distribution sensitivity.

  ### Node 7: The Kidney Lottery (Ex Ante Fairness)
  **Scenario:** One kidney. Two patients (Alice and Bob) will die without it. They are otherwise identical.
  *   **Choice A:** Flip a coin. (50% chance each survives). (**Ex Ante Fairness** → **Leaf 4: Ex Ante Prioritarianism**)
      *   *Leaf 4 Description:* **Ex Ante Prioritarianism.** You value the fairness of the *prospects* themselves, even if expected lives saved is identical to a certain allocation. This violates Harsanyi's Independence axiom.
  *   **Choice B:** Indifferent between coin and giving to either. (Focus on outcome). (**Ex Post Focus** → Go to Node 8)

  ### Node 8: The Certain Transfer (Maximin Check)
  **Scenario:** No uncertainty. You can give +10 welfare to the worst-off person or +11 welfare to the best-off person.
  *   **Choice A:** Give to the worst-off. Priority is absolute. (**Lexical Priority** → **Leaf 5: Leximin**)
      *   *Leaf 5 Description:* **Leximin / Maximin.** You prioritize the worst off regardless of the sum. Incompatible with Harsanyi's additive form.
  *   **Choice B:** Give to the best-off (or indifferent). Sum matters. (**Additive** → Go to Node 9)

  ### Node 9: The Torture Threshold (Negative/Lexical)
  **Scenario:** Option X: One person is tortured for 50 years. Option Y: 1 billion people each get a minor dust speck in their eye.
  *   **Choice A:** X is worse, no matter how many specks. (**Lexical Bad** → **Leaf 6: Negative/Lexical Utilitarianism**)
      *   *Leaf 6 Description:* **Negative / Lexical Utilitarianism.** Suffering has a different moral weight than pleasure; the linear sum is bounded or lexicographically ordered.
  *   **Choice B:** Y can outweigh X if the number is high enough. (**Continuous Sum** → Go to Node 10)

  ### Node 10: The Population Verdict (Total vs. Average)
  *(Only reachable if Node 1 was Choice A or C)*
  **Scenario:** Revisit Node 1. If you chose "Fixed Population" there, this node is skipped.
  *   **Choice A:** Total welfare is the metric. (**Leaf 7: Total Utilitarianism**)
  *   **Choice B:** Average welfare is the metric. (**Leaf 8: Average Utilitarianism**)
  *   **Choice C:** (If Node 1 was Choice C) **Leaf 9: Fixed-Population Utilitarianism**.
      *   *Leaf 9 Description:* **Fixed-Population Utilitarianism.** You accept the sum but refuse to extend it to variable populations.
      *   *Flag:* **Leaf 7 and Leaf 9 are indistinguishable in fixed-population cases.**

  *(If Node 2 was Choice B "Veil" and Node 3 was Choice A "Moral Commitment" and Node 6 was Choice A "Risk Neutral"):*
  *   **Leaf 10: Average Utilitarianism (Veil).** You reached utilitarianism via the "equal chance of being anyone" move.
      *   *Flag:* **Leaf 10 and Leaf 1 are structurally identical but philosophically distinct.** Leaf 1 says "It's just prudence," Leaf 10 says "It's morality modeled as prudence."

