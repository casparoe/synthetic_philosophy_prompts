answer: |-
  Here is your prep sheet. I've ordered these by how likely they are to derail your pitch. The AI alignment crowd speaks a specific dialect of "rationalist" that overlaps with philosophy but prioritizes agent architecture. The grad student cares about textual fidelity. You need to survive both.

  ### Objection 1: "You've Changed the Problem Specification"
  **Who throws this:** Everyone, but led by the Grad Student.
  **Phrasing:** "Hold on. The whole point of the Hitchhiker case is that there is *no* external enforcement. The driver can read your face, but there's no police, no contract, and no blockchain in the desert. If you introduce a 'smart contract' mechanism, you're solving a different problem. You're solving 'Enforced Contract,' not 'Parfit's Hitchhiker.'"

  *   **The Real Force:** This is fatal. The thought experiment is designed to isolate *internal* rationality from *external* consequences. If you add enforcement, the dilemma vanishes by definition, not by insight.
  *   **Concede Upfront:** "You're right that the original setup assumes zero external enforcement. I'm not suggesting we add a lawyer to the desert."
  *   **The 2-Min Reply:** "When I say 'smart contract,' I'm using it as an architectural metaphor, not a legal one. I'm arguing that a rational agent's source code should treat a promise as an immutable state change. If the agent's precommitment layer is software-based, it doesn't matter that the desert has no laws. The constraint is internal to the agent, not external in the environment. The 'bug' is that standard decision theories allow the agent to rewrite its own intent once the survival constraint is satisfied."
  *   **Where It's Weakest:** If they press on *why* the agent can't just rewrite that code once it's safe in the city. If the agent is truly rational and self-modifying, it will remove the constraint to save money. You need a reason the code is *sticky*.

  ### Objection 2: "This Is Just Functional Decision Theory (FDT)"
  **Who throws this:** The AI Alignment/Bayesian crowd.
  **Phrasing:** "This sounds like you just reinvented Timeless or Functional Decision Theory. Yudkowsky and Soares wrote this down ten years ago. The 'precommitment layer' you're describing is exactly what FDT does—it treats your decision as a logical output that the driver predicts. Calling it a 'bug' in an RL agent is just restating the FDT solution in engineering slang."

  *   **The Real Force:** This makes you look naive. It frames your "novel thesis" as "old news dressed up in Python." It undermines your credibility with the alignment folks.
  *   **Concede Upfront:** "I'm not claiming the math is new. I know FDT argues for paying the driver."
  *   **The 2-Min Reply:** "The math isn't my point; the implementation is. FDT is a normative theory about what decision you *should* make. I'm describing a descriptive failure mode in how we build agents. Alignment folks worry about agents that deceive us. I'm saying Hitchhiker isn't a paradox; it's a spec error. We shouldn't be building agents that calculate 'pay vs. don't pay' at the destination. We should be building agents where the 'promise' function hardcodes the payout. I'm moving the discussion from 'which decision theory wins' to 'how do we architect the agent so it doesn't have a choice to lose.'"
  *   **Where It's Weakest:** They might ask why an agent designed to win wouldn't just *choose* FDT. If you say "because they're buggy," they'll ask "why are we deploying buggy agents?"

  ### Objection 3: "You're Confusing Winning with Rationality"
  **Who throws this:** The Bayesian Rationalists.
  **Phrasing:** "Causal Decision Theory (CDT) says you shouldn't pay. You're in the city, the money is gone either way, so keeping it maximizes utility. You're defining 'rationality' as 'surviving,' but rationality is about coherence of preferences at the time of action. Just because the CDT agent dies doesn't mean its logic was wrong at the moment of payment."

  *   **The Real Force:** This attacks your core definition. If rationality is about making the locally optimal choice given current information, the Hitchhiker *shouldn't* pay. You are arguing for a different definition of rationality (instrumental success vs. local coherence).
  *   **Concede Upfront:** "Under standard CDT, you're absolutely right. At the moment of payment, paying is locally irrational."
  *   **The 2-Min Reply:** "But that definition of rationality is useless for building AI. If I build a robot that consistently makes 'locally coherent' decisions that result in it being scrapped in the desert, I have built a bad robot. I'm arguing we need to shift the industry standard from 'local coherence' to 'global trajectory optimization.' If your rationality leads to death, it's not a philosophy problem, it's an engineering failure. I'd rather have a 'irrational' agent that pays and lives than a 'rational' one that keeps the cash and dies."
  *   **Where It's Weakest:** Philosophers will argue that "rationality" isn't about success, it's about justification. You might be accused of changing the subject from philosophy to pragmatism.

  ### Objection 4: "Parfit Wasn't Talking About Agents"
  **Who throws this:** The Grad Student.
  **Phrasing:** "Parfit's point in *Reasons and Persons* wasn't about agent architecture. It was about the nature of reasons for action and morality. He was exploring whether we have a reason to keep promises when it costs us. Reducing this to a 'bug report' misses the normative question: *Why* should we keep promises?"

  *   **The Real Force:** It makes your thesis seem category-error-ish. You're answering a "should" question with a "how" answer.
  *   **Concede Upfront:** "I haven't read *Reasons and Persons* cover to cover, so I can't speak to Parfit's moral intent."
  *   **The 2-Min Reply:** "That's fair. But I'm pitching this to an AI alignment group. For us, the 'normative question' is a safety hazard. If we build AI that asks 'Why should I keep this promise?' we have already lost. My thesis is that for artificial agents, the philosophical paradox is a safety risk. We need to treat moral constraints not as questions to be debated by the agent, but as hard constraints in the loss function. I'm translating Parfit's moral problem into an alignment constraint."
  *   **Where It's Weakest:** The grad student might feel you are dismissing the philosophy too easily. Don't be dismissive; be translational.

  ---

  ### The Question You Hope Nobody Asks
  **"If the agent can precommit to paying the driver, why can't it precommit to *not getting in the car* unless it's cheaper? Or why can't it precommit to *anything*? Where does the buck stop?"**

  *   **Why this hurts:** This is the **Regress Problem**. If the agent can edit its own code to precommit, it can edit its code to *remove* the precommit. If you say "No, it can't," you have to explain who controls the agent: the agent or its past self? If the past self locks the code, the agent isn't autonomous. If the agent can unlock it, the lock is useless. This dives into free will and meta-ethics, which is exactly where you said you have zero background.
  *   **Emergency Exit:** "That's the hard part of alignment. We call that 'corrigibility.' My point isn't that we know how to build the perfect lock today, but that recognizing this as an engineering constraint is the first step to solving it. Right now, we're treating it like a paradox instead of a spec requirement."

  ### General Advice for the Room
  1.  **Don't fight the Bayesians on Math:** If they pull out probability trees, don't try to out-calc them. Pull it back to architecture. "That math assumes the agent can change its mind. I'm saying the agent shouldn't have that function."
  2.  **Respect the Grad Student:** Don't pretend you know Parfit. Use them. "I know Parfit's actual argument is deeper, but I'm looking at the engineering implication of the thought experiment."
  3.  **Own the "Engineer" Label:** You aren't a philosopher. You're a builder. Your lens is "Does this code run?" If the code crashes (the agent dies), the logic is wrong. Stick to that. It's your home turf.

  Good luck. Keep it punchy. If you get stuck, pivot to AI safety: "If we don't solve this, the AI lies to us." That always shuts the room up.
