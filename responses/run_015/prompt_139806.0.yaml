      *   *Logic:* As $n$ increases, probability of being pivotal ($P_{piv}$) decreases. If cost $c > 0$, expected benefit of acquiring info is $P_{piv} \times B$. If $P_{piv} \to 0$, eventually $P_{piv} \times B < c$.
      *   *Result:* In large elections, rational voters do not acquire information (Downsian Paradox of Voting logic applied to information).
      *   *Accuracy Decay:* If everyone free rides, $p \to 0.5$.
      *   *Threshold:* The key is the rate at which $p_n - 0.5$ shrinks.
      *   *Math Intuition:* For majority rule to converge to 1, we generally need $\sqrt{n}(p_n - 0.5) \to \infty$. If $p_n - 0.5 \sim 1/\sqrt{n}$, the probability converges to a constant strictly between 0.5 and 1. If it shrinks faster (e.g., $1/n$), convergence fails (goes to 0.5).
