answer: |-
  The Condorcet Jury Theorem is a fragile consistency result that collapses when voter competence is endogenous or votes are correlated, meaning it cannot support the strong claim that larger groups are inherently wiser without assuming away the strategic behaviors and social dependencies real voters exhibit.

  On your first point regarding endogenous information acquisition, you have correctly identified the mechanism that breaks the asymptotic guarantee. When acquiring competence is costly, voters weigh the cost against the probability of being pivotal. Since the probability of being pivotal decreases exponentially with group size $n$ in a large election, the expected benefit of paying the cost to become informed vanishes as $n$ grows. In equilibrium, the fraction of informed voters typically shrinks. The "cliff" you are looking for is indeed determined by the rate at which the competence gap $(p_n - 0.5)$ shrinks relative to group size. For the probability of a correct majority to converge to 1, the product $\sqrt{n}(p_n - 0.5)$ must diverge to infinity. If the competence gap shrinks on the order of $1/\sqrt{n}$, group accuracy converges to a constant strictly between 0.5 and 1. If the gap shrinks faster than $1/\sqrt{n}$—which is what happens in many rational ignorance models where the number of informed voters stays bounded—the group accuracy converges to 0.5, meaning the large group is no better than a coin flip. Consequently, group accuracy often peaks at a finite group size where the benefit of aggregation balances the loss of individual competence, and adding voters beyond that point makes the collective decision worse.

  On your second point about correlation and straw polls, the independence assumption cares only about the statistical structure of the errors, not their source. Whether dependence arises from a shared informative signal, a common heuristic, or deference to a leader, the mathematical consequence is identical: positive correlation reduces the effective sample size. If votes are perfectly correlated because everyone follows the straw poll, the group acts as a single voter with the accuracy of that poll, and adding more voters provides zero marginal information. The distinction you intuited between "shared good information" and "shared bad heuristics" matters for the *level* of accuracy (a good signal yields higher accuracy than a bad heuristic), but it does not save the *asymptotic property* of the theorem. Herding on a public signal prevents the variance of the aggregate error from shrinking to zero, capping reliability at the accuracy of the public signal regardless of how many voters you add. When a voter ignores their private signal to follow the crowd, they are contributing to this correlation, and yes, this hurts the group's potential accuracy relative to a scenario where private signals were aggregated independently.

  Regarding the nature of the claim, the theorem is a conditional comparative statics result, not a robust normative defense of democracy. It demonstrates that *if* voters are competent and independent, majority rule aggregates information efficiently better than a dictator or a random voter. It does not prove that real-world democracies satisfy these conditions, nor does it guarantee that majority rule is superior when those conditions are violated. Your friend's interpretation is too quick because it treats the assumptions as background conditions rather than the central variable; the theorem tells us precisely how much we rely on independence and exogenous competence, and since endogenous behavior and social correlation systematically violate these assumptions, the theorem serves better as a warning about the fragility of collective wisdom than as a proof of its inevitability.
