      *   *Crucial Distinction:* There is a difference between **Manifold Substantivalism** (points exist independently) and **Metric Substantivalism** (spacetime is the metric field).
      *   *The "Keyboard" Reality:* The practitioner *must* treat diffeomorphic solutions as representing the same physical state to claim the simulation predicts *our* world. If they thought the grid points had primitive identity independent of the metric, they would have to admit they are simulating *one specific possibility* out of infinitely many indistinguishable ones.
      *   *Wait, refine this:* If a substantivalist believes points have identity, they must deny the Hole Argument's conclusion (indeterminism) by other means (e.g., essentialism about metric properties). But for the *practice*, the key is **Observables**.
      *   *Direct Answer:* If a practitioner believed in primitive point identity *without* accepting Leibniz Equivalence, they would have to admit their simulation is underdetermined. Since they don't, they *act* as if Leibniz Equivalence is true.
      *   *Does this force Relationalism?* No. It forces **Sophisticated Substantivalism**. You can believe points exist, provided you believe their identity is tied to the metric structure (or that the laws don't distinguish diffeomorphic layouts).
      *   *What changes at the keyboard?* Nothing. The math is identical. The *justification* for ignoring gauge drift changes.
