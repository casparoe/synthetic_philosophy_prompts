      *   **The Substantivalist Test:** If you are a "Naive Substantivalist" (points have identity independent of fields), the practice is unjustified because you can't know *which* point configuration is actual. If you are a "Sophisticated Substantivalist" (points exist but laws are diffeo-invariant), the practice is fine.
      *   **Conclusion:** The practice presupposes **Leibniz Equivalence** (diffeomorphic models = same physical state). It does *not* strictly presuppose Relationalism (denial of point existence). It is compatible with Substantivalism *provided* the substantivalist accepts the Hole Argument's constraint on determinism.

