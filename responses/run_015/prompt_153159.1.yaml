answer: |-
  Here is the reconstruction of the implicit view, separated into what the practice forces, what it tolerates, and where the metaphysics is underdetermined.

  ### The Implicit View: "Structural Realism via Equivalence Classes"

  The practice of numerical relativity (NR) does not commit you to relationalism (the denial of manifold points) nor to substantivalism (the reality of manifold points). It commits you to **Leibniz Equivalence**: the claim that two models related by a diffeomorphism represent the *same physical state*.

  This is the hard constraint. Everything else is pragmatic. The practice treats the "physical world" not as a single manifold with a metric, but as an **equivalence class** of manifold-metric pairs under the group of diffeomorphisms.

  Here is how this breaks down across your three sharpening points.

  ### 1. Tethered vs. Free-Floating Gauges (The Asymmetry)

  You asked if the trust in "tethered" gauges (comoving time, area radius) secretly relies on relationalism, while "free-floating" gauges (harmonic coordinates) are treated with suspicion.

  **The Verdict:** This asymmetry is **epistemic and operational**, not ontological. It does not force relationalism.

  *   **Why the asymmetry exists:** A "tethered" gauge aligns the coordinate grid with physical detectors (e.g., proper time of a clock, area of a sphere we can measure). A "free-floating" gauge aligns the grid with mathematical convenience (e.g., keeping the equations hyperbolic).
  *   **What it presupposes:** It presupposes that **observables must be connectable to measurement procedures.** If I say "the merger happened at $t=100$," I need to know what clock measures $t$. If $t$ is comoving proper time, I know exactly what clock that is. If $t$ is harmonic time, I have to calculate the transformation to proper time to know what my detector sees.
  *   **Why it's not relationalism:** A substantivalist can use tethered gauges just as happily. They would say: "The manifold points are real, and I am choosing a coordinate system that happens to track the matter sitting on those points because it makes comparing my simulation to my telescope easier."
  *   **The "Gauge Artefact" Diagnosis:** When a practitioner sees a blow-up in a free-floating gauge and calls it an artefact, they are applying the **invariance test**. They are checking: "Does this blow-up persist if I change the gauge?" If it vanishes under relabelling, it is not a property of the equivalence class. This relies on Leibniz Equivalence, not on the non-existence of points.

  **Conclusion:** The asymmetry forces **Operationalism** (physics must link to measurement), not Relationalism. Both substantivalists and relationalists agree that coordinate values alone are not observables.

  ### 2. Vacuum Regions and Blow-ups

  You asked what happens in a matter-free region where there is nothing to "tether" the gauge to, and whether the practice presupposes hidden structure.

  **The Verdict:** The practice presupposes that the **Metric Field itself is sufficient structure** to anchor physical reality. You do not need matter (dust, stars) to have a physical spacetime.

  *   **The Anchor:** In a vacuum region, the "landmarks" are curvature invariants (e.g., the Kretschmann scalar $R_{\mu\nu\rho\sigma}R^{\mu\nu\rho\sigma}$).
  *   **The Practice:** When a simulation shows a singularity in vacuum, the practitioner computes invariants.
      *   If the invariant blows up: Physical singularity (e.g., a black hole).
      *   If the invariant stays finite but components blow up: Coordinate singularity (e.g., an event horizon in Schwarzschild coordinates).
  *   **Metaphysical Commitment:** This treats the metric field $g_{\mu\nu}$ as a physical object in its own right.
      *   **Relationalist:** "The relations defined by $g_{\mu\nu}$ are the reality."
      *   **Substantivalist:** "The metric field is a property of the manifold points."
  *   **Does it fail without matter?** No. The practice works because the equations themselves (Einstein's vacuum equations) constrain the metric. The "structure" is the geometry itself. The worry about Quantum Gravity (where the metric might fluctuate or disappear) is a worry about the *domain of validity* of the practice, not a flaw in the classical logic. As long as you have a smooth metric field, you have enough structure to define invariants.

  **Conclusion:** The practice presupposes **Metric Realism** (the metric field is physical). It is neutral on whether the metric is a relation between points or a property of points.

  ### 3. The Straight Answer: Would Substantivalism Change the Keyboard Work?

  This is the crux. Suppose a practitioner decided tomorrow: "I believe manifold points have primitive identity (Haecceitism). Diffeomorphic models are distinct possible worlds."

  **Would anything at the keyboard change?**
  **No.** The code, the convergence tests, and the waveform extraction would remain exactly identical.

  **Would the practice become unjustified?**
  **Yes, but only for a *Naive* Substantivalist.**

  Here is the precise distinction where the Hole Argument does its work:

  1.  **Naive Substantivalism (Points have primitive identity + Diffeomorphic models are distinct worlds):**
      *   **Consequence:** General Relativity is indeterministic. Given the state outside the hole, there are infinitely many distinct futures inside the hole (one for each diffeomorphism).
      *   **Impact on Practice:** If you hold this view, you cannot claim your simulation predicts *the* future. Your simulation picks *one* specific distribution of metric values over specific points. But since the laws don't determine which distribution occurs (only the equivalence class), your simulation is arbitrary. You are simulating *a* possibility, not *the* possibility. You lose the right to claim your waveform matches the detector, because the detector measures the equivalence class, but your code outputs a specific representative.
      *   **Verdict:** This view makes the practice **epistemically unjustified**. You couldn't trust the prediction.

  2.  **Sophisticated Substantivalism (Points have primitive identity + Leibniz Equivalence is true):**
      *   **Consequence:** You believe points exist, but you accept that the *physical state* is the equivalence class. You deny that diffeomorphic models represent distinct *physical* possibilities, even if they are mathematically distinct. (Often achieved by saying the laws of nature constrain the metric such that haecceitistic differences are physically inert).
      *   **Impact on Practice:** Nothing changes. You treat the grid as a convenient representative of the class. You extract invariants to compare with reality.
      *   **Verdict:** This view is **compatible** with the practice.

  3.  **Relationalism (Points have no identity):**
      *   **Consequence:** Diffeomorphic models are the same model.
      *   **Impact on Practice:** Nothing changes.
      *   **Verdict:** This view is **compatible** with the practice.

  **Where the Hole Argument does work:**
  The Hole Argument forces the practitioner to distinguish between **Gauge-Dependent Quantities** (metric components $g_{\mu\nu}$ at coordinate $x$) and **Gauge-Invariant Quantities** (curvature scalars, proper distances, waveforms at infinity).

  If you ignored the Hole Argument (i.e., if you were a Naive Substantivalist), you might try to publish a result like: "The metric component $g_{xx}$ reached 5.0 at grid point (10,10,10)."
  *   **With Hole Argument logic:** You know this is meaningless. Another valid simulation of the *same world* would have $g_{xx} = 10.0$ at that grid point.
  *   **Without Hole Argument logic:** You might think this is a physical prediction.

  So, the Hole Argument licenses the **discarding of coordinate-dependent data**. It tells you what *not* to trust. It does not tell you whether the underlying grid points "exist."

  ### Summary of Presuppositions vs. Underdetermination

  | Feature of Practice | What it Forces (Strict Presupposition) | What is Underdetermined (Compatible Views) |
  | :--- | :--- | :--- |
  | **Fixing a Gauge** | You need a representative to solve PDEs. | Does not imply the representative is "true." Compatible with both Substantivalism and Relationalism. |
  | **Discarding "Gauge Artefacts"** | **Leibniz Equivalence.** (Diffeomorphic models = same physical state). | Does not force Relationalism. Sophisticated Substantivalists accept this too. |
  | **Trusting Tethered Gauges** | **Operationalism.** (Physics must link to measurement). | Does not imply points are unreal. Just implies matter is easier to measure than vacuum geometry. |
  | **Vacuum Simulations** | **Metric Realism.** (The field $g_{\mu\nu}$ is physical stuff). | Does not imply the manifold is unreal. The field can be a property of real points. |
  | **Claiming Determinism** | **Rejection of Naive Substantivalism.** | You must believe the laws determine the equivalence class, not the point-wise mapping. |

  **The Bottom Line:**
  The practice is **metaphysically underdetermined** between Relationalism and Sophisticated Substantivalism. You can sit at the keyboard and believe manifold points are real, provided you believe their identity is physically inert (i.e., you accept Leibniz Equivalence).

  The only view the practice rules out is **Naive Substantivalism** (the belief that point identity is physical and diffeomorphic models are distinct worlds). If you held that view, you would have to admit your simulations are fundamentally indeterministic and that your coordinate outputs are physically privileged in a way the equations do not support. Since no relativist admits that, the practice effectively enforces Leibniz Equivalence, but leaves the existence of the points themselves as an open philosophical question.
