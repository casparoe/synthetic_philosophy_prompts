          *   Evolve the grid.
          *   Extract waveforms (usually at asymptotic infinity or finite radius).
          *   Check convergence (refine grid, see if results match).
          *   Check gauge invariance (run different gauges, see if invariant quantities match).
      *   **The Tension:** NR practitioners treat coordinate values as "real" during the simulation but "unphysical" when interpreting results. They trust "tethered" gauges more than "free-floating" ones.

  3.  **Address Sub-question 1: Tethered vs. Free-floating Gauges:**

      *   *Observation:* Practitioners trust comoving coordinates (tethered) more than harmonic coordinates (free-floating).
      *   *Interpretation:* Does this imply relationalism?
      *   *Analysis:* Not necessarily. It implies *operationalism*. Tethered gauges are easier to map to observables (e.g., "time measured by this clock"). Free-floating gauges require a translation layer (metric reconstruction) to get observables.
      *   *Metaphysical Commitment:* This doesn't force relationalism. A substantivalist can say, "I'm using a coordinate system that aligns with matter because it's easier to compare with my detectors." The asymmetry is epistemic/pragmatic, not ontological.
      *   *Nuance:* However, calling something a "gauge artifact" *does* presuppose that the underlying reality is gauge-invariant. Both substantivalists (who accept Leibniz equivalence to save determinism) and relationalists agree on this. So the practice presupposes *Leibniz Equivalence*, not necessarily the denial of point identity *per se* (though they often go together).

  4.  **Address Sub-question 2: Vacuum Regions & Blow-ups:**

      *   *Scenario:* Vacuum simulation, singularity/blow-up. Is it physical or coordinate?
      *   *Practice:* Calculate curvature invariants (Kretschmann scalar). If invariant blows up -> physical singularity. If only components blow up -> coordinate singularity.
      *   *Presupposition:* This presupposes that *invariants* are the physical reality.
      *   *Does it fail without matter?* No. The metric field itself provides the structure. Even in vacuum, $g_{\mu\nu}$ exists. Relationalists can relate points to the metric field values. Substantivalists can relate points to the manifold + metric.
      *   *Quantum Gravity worry:* If the metric becomes quantum/fluctuating, defining "points" becomes hard. But in classical NR, the metric is smooth. The practice holds.

