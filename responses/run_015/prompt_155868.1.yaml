  As for your recipes and journeys, consider that following a recipe requires a cook, not merely a list of ingredients. The list says 'mix,' but the list does not mix itself. I am the list, sir, not the cook. You are the cook. You are asking why the list does not mix itself, and then blaming the list for requiring a hand to turn the page. If I were to write down 'I am willing to turn the page,' that would be another line of ink, still waiting for a hand to read it. You demand that the ink move the ink. I merely insist that the ink stays put until something outside the bottle pushes it. My notebook records truths, not the impulses that lead me to record them.

