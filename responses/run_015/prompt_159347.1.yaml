answer: |-
  **Title:** The Urn & The Observer
  **Time:** 90 Minutes
  **Materials:** 2 opaque bags (labelled A/B), 10 slips (1–10), 90 slips (1–100), coin, chocolate chips (currency), whiteboard.

  **Setup (5 mins)**
  Do not mention SSA/SIA. Tell the group: "We are simulating universes. A coin flip decides the Universe: **Small** (10 observers total) or **Big** (100 observers total). You are a random observer drawn from that universe."
  *   **Small:** Bag A contains slips 1–10.
  *   **Big:** Bag B contains slips 1–100.
  *   **Procedure:** GM flips coin. Selects bag. Draws 13 slips *with replacement* (each player gets one ID). Players see their ID. Players bet on Small or Big.

  **Phase 1: Per-Observer Scoring (20 mins)**
  *Rule:* If you guess the Universe correctly, you get 1 chip.
  *   **Block 1 (No Info):** Players hide IDs. Bet based only on "I exist." (3 rounds)
  *   **Block 2 (Early ID):** Reveal ID. If ID > 10, you know it's Big (discard & redraw until ID ≤ 10 to simulate "Early"). Tell them: "You are Observer #2." Bet. (3 rounds)
  *   *Expectation:* Most will bet Big in Block 1. In Block 2, SSA-sympathizers will flip to Small; SIA-sympathizers stay Big/neutral.

  **Phase 2: Per-World Scoring (20 mins)**
  *Rule:* If the Universe is guessed correctly, a pot of 100 chips is created. This pot is divided by the **Total Population** of that universe (10 or 100), not just players.
  *   **Small Win:** 100 chips / 10 observers = 10 chips each.
  *   **Big Win:** 100 chips / 100 observers = 1 chip each.
  *   **Block 3 & 4:** Repeat No Info and Early ID conditions.
  *   *Expectation:* Betting Big now looks risky. The "SIA edge" evaporates because the payoff is dilute.

  **Debrief (45 mins)**
  Map the friction points directly.
  1.  **The Existence Evidence (Block 1):** Ask Block 1 Big-bettors why. They'll say "More slots." This is SIA. Ask Small-bettors. They'll say "Coin was fair." This is SSA. *Concession:* SIA treats existence as evidence; SSA treats the coin as the only evidence.
  2.  **The Serial Number Flip (Block 2):** Highlight those who switched to Small. Ask why. "It's unlikely to be #2 in a crowd of 100." This is the SSA update. Ask those who didn't switch. "There are still more #2s in Big than Small overall." This is SIA holding the prior.
  3.  **The Scoring Pivot (Phase 2):** Compare chip counts. In Phase 1, Big-bettors likely accumulated more chips (more winners). In Phase 2, Small-bettors likely win more *value* per round.
      *   *The Crux:* The Friend's objection is validated here. SIA maximizes *number of correct observers*. Per-World scoring maximizes *individual share*. The "winner" depends entirely on whether you value total truth-counts or individual utility.
  4.  **Handling Objections:**
      *   *"The die was fair so 50/50":* Ask: "Are you betting on the coin or on your seat?" If you are a random seat, the coin isn't the only random variable.
      *   *"There are 13 of us in this room":* Rule this out. "You are playing roles. The room size is external to the simulation."
  5.  **Limitations (Frankness):**
      *   **Finite vs. Infinite:** We used 10 vs 100. Real cosmology involves infinity, where ratios break.
      *   **Reference Class:** I chose the reference class (observers). In reality, defining "observer" is the hard part.
      *   **Betting vs. Belief:** Winning chips isn't believing truth. You might believe Big but bet Small for the higher payout (Phase 2).

  **What Will Go Wrong**
  *   **Noise:** 6 rounds is low. *Fix:* Aggregate scores on the whiteboard after every round to build tension.
  *   **Confusion on Per-World:** Players will forget to divide by 100. *Fix:* GM announces the payout explicitly before distributing chips.
  *   **ID > 10:** In Small world, IDs 11–100 are impossible. If drawing with replacement from a fixed bag, ensure the bag changes per coin flip. *Correction:* GM prepares two bags. Flips coin. Picks bag. Draws 13 times. If Small is flipped, only 1–10 exist. If a player draws 1–10, they play. (To keep 13 players active, redraw if Small is flipped and ID > 10 is drawn? No, that biases. Better: Tell them "If you draw >10 in Small, you don't exist." They sit out. This visceral "death" drives the point home harder.)
  *   **Revised ID Rule:** If Small is flipped, only slips 1–10 are in the bag. If Big, 1–100. This ensures everyone exists. For Block 2, if anyone draws >10, they redraw until ≤10 (conditioning on Early ID).

  **Timeline**
  *   0–5: Setup & Rules.
  *   5–25: Phase 1 (Observer Scoring).
  *   25–45: Phase 2 (World Scoring).
  *   45–90: Debrief & Limitations.

  **Final Concession**
  End by asking both you and your friend to state one thing the other got right. (You: Scoring matters. Him: Existence isn't free evidence.)
