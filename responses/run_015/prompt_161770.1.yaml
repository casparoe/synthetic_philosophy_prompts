answer: |-
  ### Activity Design: The Cutoff Wager

  **Objective:** To force students to experience underdetermination not as skepticism about *whether* a rule exists, but as a conflict over *which* rule the evidence supports, isolating the problem of projectibility.

  **Time:** 80 minutes (20 min activity, 60 min debrief).
  **Class Size:** 14 students (7 "Nature," 7 "Scientists").

  #### 1. Setup and Roles (5 mins)
  *   **The Sequence:** You are investigating a newly discovered mineral, *Xenonite*. When exposed to UV light, it glows either **Green** or **Blue**.
  *   **Nature (7 Students):** Sequestered at the back. Their task is to fix the "Law of Xenonite."
      *   They receive an envelope containing a instruction card: *"Select a cutoff number $c$ from the set $\{11, 12, \dots, 20, \infty\}$. The rule is: Turns 1 through $c-1$ are Green. Turn $c$ and onwards are Blue. If $c=\infty$, all turns are Green."*
      *   **Crucial Constraint:** They must agree on a single $c$ unanimously. They cannot tell the Scientists. They record $c$ on a slip and hand it to you (the Instructor).
  *   **Scientists (7 Students):** Seated at the front. They receive a **History Sheet** showing Turns 1–10.
      *   **Data:** Every single observation from Turn 1 to Turn 10 is **Green**.
      *   **Task:** They must place a wager on Turn 11.

  #### 2. The Wager (10 mins)
  *   **Currency:** Each Scientist gets 100 "Credibility Points."
  *   **Mechanism (Proper Scoring):** They must allocate their 100 points between **Green** and **Blue**.
      *   Example: 80 on Green, 20 on Blue.
      *   **Payoff:** After Turn 11 is revealed, they redeem the points allocated to the *actual* color. Points on the wrong color are lost.
      *   **Incentive:** This allocation rule is a *proper scoring rule*. To maximize expected points, a rational agent must allocate points exactly equal to their subjective probability (e.g., if you think Green is 90% likely, you allocate 90 points to Green). Hedging reduces expected score.
  *   **Execution:** Scientists discuss and submit their allocations individually. Nature remains silent.

  #### 3. The Reveal and Scoring (5 mins)
  *   You collect the Scientists' sheets.
  *   You ask Nature to reveal their chosen $c$.
  *   **Scenario A (Most Likely):** Nature chose $c = \infty$ (Always Green). Turn 11 is Green. Scientists who bet heavily on Green win.
  *   **Scenario B (The Trap):** Nature chose $c = 11$ (Switch now). Turn 11 is Blue. Scientists who bet heavily on Green lose.
  *   **Scoring:** Tally the points. Declare a winning team (usually Scientists if $c=\infty$, Nature if $c=11$).

  ---

  ### The Debrief: Mapping the Riddle (60 mins)

  Do not mention Goodman yet. Start with the friction from the game.

  #### Phase 1: The Underdetermination (15 mins)
  *   **Ask the Scientists:** "You saw 10 Greens. Why did you allocate points the way you did?"
      *   *Expected Answer:* "It's been Green every time, so it'll stay Green." / "A switch seems unlikely."
  *   **Ask Nature:** "Why did you pick your $c$?"
      *   *If they picked $\infty$:* "It's the simplest rule."
      *   *If they picked 11:* "We wanted to trick you." (Discard this motivation as noise).
  *   **The Logical Point:** Write on the board:
      *   $H_{\infty}$: All turns are Green.
      *   $H_{11}$: Turns 1–10 Green, Turn 11+ Blue.
      *   **Observation:** Data (1–10) is $100\%$ consistent with *both* $H_{\infty}$ and $H_{11}$.
      *   **Question:** "If the data fits both perfectly, what justified your bet?"
      *   **Target Insight:** They will admit they assumed $H_{\infty}$ was *more probable* a priori. The data did not tell them that. The *prior* did.

  #### Phase 2: The Vocabulary Trap (20 mins)
  *   Now introduce Goodman's terminology without naming him yet.
  *   **Reframing:** "Suppose I tell you there is a property called **Grue**. An object is Grue if it is observed before Turn 11 and is Green, OR observed at Turn 11 or later and is Blue."
  *   **Rewrite the Hypotheses:**
      *   $H_{\infty}$ becomes: "All Xenonites are **Green**."
      *   $H_{11}$ becomes: "All Xenonites are **Grue**."
  *   **The Kicker:** "In the 'Grue' language, $H_{11}$ is the *simple* rule (All are Grue). $H_{\infty}$ is the *complex* rule (Green until 10, then Bleen)."
  *   **Discussion:**
      *   Why did you treat 'Green' as the natural predicate and 'Green-until-11' as the contrived one?
      *   Is '11' special? Only because we are at Turn 10. If we were at Turn 20, 'Grue' would mean switch at 21.
      *   **Conclusion:** Your betting odds weren't set by the data (which was identical for both). They were set by your **entrenchment** with the word "Green." You projected the predicate you are used to using.

  #### Phase 3: Distinguishing from Hume (15 mins)
  *   **Hume's Problem:** "How do we know the future will resemble the past?" (Skepticism about *uniformity*).
      *   *In the game:* This would be asking "Is there a rule at all? Maybe Turn 11 is random."
      *   *Constraint:* We granted you a stable rule ($P$ then $Q$). We solved Hume by fiat.
  *   **Goodman's Problem:** " *Which* future resembles the past?" (Skepticism about *projectibility*).
      *   *In the game:* Both $H_{\infty}$ and $H_{11}$ assume the future resembles the past *under some description*.
      *   "Green" says the future resembles the past in color.
      *   "Grue" says the future resembles the past in *grueness*.
  *   **The Takeaway:** Induction isn't just "more of the same." It is "more of the same *kind*." The riddle is: what makes a *kind* projectible?

  #### Phase 4: Reflexive Defenses & Their Failure (10 mins)
  *   **Simplicity:** "But 'Always Green' is simpler than 'Switch at 11'!"
      *   *Counter:* Only in English. In Grue-English, 'Always Grue' is simpler. Simplicity is language-relative.
  *   **Gerrymandering:** "'Green-until-11' is gerrymandered!"
      *   *Counter:* Why? Because it references a specific time. But "Green" references a specific spectrum wavelength. Why is time less legitimate than wavelength?
  *   **Entrenchment:** "We just use 'Green' more."
      *   *Conclusion:* This is Goodman's actual answer. Projectibility is a matter of linguistic habit, not logical necessity. This feels unsatisfying, which is why the riddle hurts.

  ---

  ### Predictable Failures & Mitigation

  1.  **Nature Picks $c=11$ to be "Clever":**
      *   *Risk:* If Nature switches immediately, Scientists lose. They will blame "bad luck" rather than "underdetermination."
      *   *Mitigation:* Instruct Nature: *"Choose the rule you genuinely think describes a stable physical world. Do not try to trick the Scientists; try to model a law."* This pushes them toward $\infty$, making the Scientists' confidence the target of critique.
  2.  **Scientists Hedge (50/50 Split):**
      *   *Risk:* They fear the trick and allocate 50 points each. This avoids the philosophical trap.
      *   *Mitigation:* Emphasize the scoring rule. "To maximize your score, you must bet your true credence. If you truly believe Green is 90% likely, 50/50 is mathematically stupid." Force them to commit.
  3.  **Confusing Priors with Data:**
      *   *Risk:* Students argue the 10 Greens *do* support $H_{\infty}$ more.
      *   *Mitigation:* Use a likelihood ratio check. $P(Data | H_{\infty}) = 1$. $P(Data | H_{11}) = 1$. The ratio is 1:1. The data is silent. Any shift in probability comes from the prior $P(H)$.

  ---

  ### The Missing Feature (What You Must State)

  The game cannot reproduce the **syntactic disguise** of Goodman's predicates.

  *   **In the Game:** The alternative hypothesis was explicitly time-indexed ("Switch at Turn 11"). Students easily spot this as "cheating" or "complex."
  *   **In the Riddle:** "Grue" is defined as *"Green if observed before $t$, else Blue."* To the speaker of Grue, "Grue" is a simple color term like "Green." They do not see the time index; it is baked into the meaning of the word.
  *   **Your Closing Statement:** "In our game, you knew '11' was a number. You knew 'Green' was a color. Goodman's point is that if you were raised speaking Grue, 'Grue' would feel like a color and 'Green' would feel like a gerrymandered relation ('Grue if before $t$, else Bleen'). The game shows you need a prior to choose the rule. Goodman shows you that your *language* is that prior."

  ### Instructor's Cheat Sheet for the Board

  | Feature | Hume's Problem | Goodman's New Riddle |
  | :--- | :--- | :--- |
  | **Question** | Will the future resemble the past? | *In what way* will the future resemble the past? |
  | **Assumption** | No stable rule granted. | Stable rule granted (Projectibility assumed). |
  | **Evidence** | Consistent with "Rule" and "No Rule". | Consistent with "Green" and "Grue". |
  | **Source of Error** | Skepticism about Induction. | Ambiguity of Predicates. |
  | **Solution?** | None (Pragmatic). | Entrenchment / Linguistic Habit. |
