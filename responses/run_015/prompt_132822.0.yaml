answer: |-
  This is a sharp pivot from the standard literature. Most metaphysics of dispositions is obsessed with saving the *concept* from counterexamples; you are obsessed with saving the *practice* (special sciences, ordinary language) from bad metaphysics. That means your desiderata must prioritize explanatory utility over ontological parsimony.

  Here is the spec for a metaphysics of dispositions fit for the special sciences, derived from your eight hard cases plus the standard constraints.

  ### The Spec: Desiderata for an Applied Metaphysics of Dispositions

  | # | Motivating Case | Desideratum (The Requirement) | Status |
  | :--- | :--- | :--- | :--- |
  | **0** | **Standard Fink** | **Stability:** Possession of the disposition must not vanish precisely when the stimulus occurs. | Non-negotiable |
  | **0b** | **Standard Mask** | **Resilience:** Possession of the disposition must persist even if manifestation is prevented. | Non-negotiable |
  | **1** | **One-Shot Mask** (Packing foam) | **Consumable Interference:** The theory must distinguish between a disposition that is *masked* and one that is *tested against a consumable shield* without denying the disposition after the shield is gone. | Non-negotiable |
  | **2** | **Booster** (Inverse Fink) | **Triggered Constitution:** The theory must allow that the stimulus can *constitute* the disposition simultaneously with manifestation, without attributing the disposition retrospectively to the pre-stimulus object. | Non-negotiable |
  | **3** | **Self-Annealing** (Intrinsic mask) | **Intrinsic/Extrinsic Neutrality:** The theory cannot define dispositions by the absence of *external* interferers; internal dynamic processes count as masks too. | Non-negotiable |
  | **4** | **Permanently Packed** | **Manifestation Independence:** The truth conditions for "X is fragile" cannot entail "X will break." It must distinguish *unmanifested* from *non-existent*. | Non-negotiable |
  | **5** | **Partner Problem** (Pillow vs. Concrete) | **Stimulus Granularity:** The theory must treat the stimulus as a variable continuum (force, surface, medium) rather than a binary switch, allowing for degrees of masking. | Non-negotiable |
  | **6** | **Quiescent Dispositions** (Stabilizers) | **Negative Manifestation:** The theory must permit "nothing happens" (prevention of change) to count as a successful manifestation. | Non-negotiable |
  | **7** | **Second-Order** (Vaccines/Seeds) | **Iterability:** The theory must allow the *manifestation* of one disposition to be the *acquisition* of another disposition. | Preference (Camp: Powers Realists) |
  | **8** | **Impossible Stimulus** | **Modal Reach:** The theory must assign truth values to dispositional claims involving nomologically impossible or non-actual stimuli (e.g., "soluble in aqua regia" when none exists). | Preference (Camp: Modal Realists) |
  | **9** | **Gradability** (Vagueness) | **Scalar Sensitivity:** The theory must accommodate degrees (very fragile, slightly soluble) without reducing them to binary probability thresholds. | Non-negotiable (for Special Sciences) |

  ***

  ### Editorial Judgment: Requirements vs. Prejudices

  You asked for the line between what you *need* and what metaphysicians *want*. For your project (underwriting special science predicates), the traditional metaphysical constraints are mostly obstacles.

  **1. The Genuine Requirements (Non-Negotiable)**
  *   **Manifestation Independence:** If your theory implies the permanently packed vase isn't fragile, you cannot underwrite safety regulations or material science.
  *   **Stimulus Granularity:** "Dropped" is not a natural kind. If your theory breaks when you specify the surface, it is useless for engineering.
  *   **Scalar Sensitivity:** This is the one everyone ignores. Toxicity, solubility, and irritability are scalar. A binary metaphysics forces you to posit arbitrary thresholds. Your theory must handle *degrees of power*, not just *possession of power*.

  **2. The Camp Prejudices (Negotiable)**
  *   **Intrinsicality:** Traditional metaphysics demands dispositions be intrinsic to the bearer. Your examples ("hepatotoxic," "unenforceable") are explicitly relational. *Drop this.* It is the single biggest barrier to an applied metaphysics.
  *   **Categorical Base:** The demand that every disposition be grounded in a non-dispositional categorical property. Dispositional Essentialists reject this; special sciences often don't care what the base is, only that the prediction holds.
  *   **Strict Non-Circularity:** The demand that the analysis of "fragile" not use "breaks" or "would." *Ceteris paribus* clauses are circular by design but indispensable for application. Prioritize utility over reductive purity.

  ***

  ### The Trade-Offs: Incompatible Desiderata

  You suspected the list might be unsatisfiable. You are right. You cannot maximize all of these simultaneously. Here are the critical tension points:

  **1. Intrinsicality vs. Stimulus Granularity (The Partner Problem)**
  If you demand dispositions be intrinsic to the object (the glass), you cannot easily account for the fact that fragility varies by surface (the partner). If you make the disposition relational to solve this, you violate Intrinsicality.
  *   *Verdict:* For your project, **sacrifice Intrinsicality**. "Fragile" is a relation between object and environment, not a monadic property of the object.

  **2. Modal Reach vs. Naturalistic Grounding (The Impossible Stimulus)**
  If you want to truthfully say "X is soluble in Y" when Y does not exist, you need robust modal realism or primitive modality. If you want to ground dispositions in actual physical structures (Naturalism), you struggle to account for dispositions toward impossible stimuli.
  *   *Verdict:* **Limit Modal Reach.** For special sciences, "soluble in non-existent solvent" is usually a shorthand for a structural claim about the actual object, not a claim about other worlds. Treat this as a linguistic convenience, not a metaphysical demand.

  **3. Triggered Constitution vs. Stability (The Booster)**
  The Booster case suggests the disposition *comes into being* upon stimulus. Stability demands the disposition exists *before* stimulus. You cannot have both a strictly pre-existing power and a power constituted by the interaction.
  *   *Verdict:* **Adopt a Process View.** The disposition is not a static property but a potentiality within a system that includes the stimulus. This solves the Booster but complicates the "Permanently Packed" case.

  ***

  ### The Single Most Exclusionary Requirement

  **Intrinsicality.**

  If you insist that a disposition must be intrinsic to the bearer, you immediately invalidate "hepatotoxic" (requires a liver), "unenforceable" (requires a legal system), and "drought-tolerant" (requires an environment). It also makes the **Partner Problem** unsolvable. If you keep this requirement, you are forced to say the glass is fragile *simpliciter*, and the pillow is just an external mask. But as your continuum argument notes, the pillow is part of the test conditions. An applied metaphysics must treat dispositions as **systemic properties**, not monadic ones. Dropping Intrinsicality opens the door to solving cases 1, 3, and 5 simultaneously.

  ***

  ### Brief Scorecard of Live Options

  Here is how the standard theories cope with your specific spec.

  | Theory | Handling of Your 8 Cases | Gradability | Verdict for Your Project |
  | :--- | :--- | :--- | :--- |
  | **Plain Conditional** ("If struck, would break") | **Fails.** Collapses on Finks, Masks, Boosters, and Permanently Packed. Cannot handle Negative Manifestations. | **Poor.** Binary logic. | **Reject.** Too brittle for special sciences. |
  | **CP / Ideal Conditions** ("If struck, *ceteris paribus*, would break") | **Mixed.** Handles Masks and Permanently Packed well. Struggles with Boosters (is the change a violation of CP?) and One-Shot Masks (is the foam part of the *paribus*?). | **Moderate.** Can model degrees via probability in the CP clause. | **Contender.** Best for ordinary speech, but "Ideal Conditions" is a black box that hides the metaphysics. |
  | **Causal Basis / Identity** ("Fragility = Micro-structure M") | **Mixed.** Excellent for Boosters and Self-Annealing (identifies the mechanism). Fails Partner Problem (structure doesn't change, outcome does) and Impossible Stimuli (no structure for non-existent solvents). | **Good.** Micro-structures can vary in degree. | **Strong Contender.** If you drop Intrinsicality and allow the "Base" to be a *system* (object + environment), this works best for science. |

  ### A Note on Gradability and Vagueness

  You are correct that this is the quiet failure of the literature. Most theories treat dispositions as on/off switches.
  *   **The Problem:** "Fragile" is vague. At what thickness does glass stop being fragile?
  *   **The Requirement:** Your theory needs a **Scalar Metric**.
  *   **The Fix:** Do not define the disposition by the *outcome* (breaks/doesn't break). Define it by the **threshold energy** required for manifestation.
      *   *Fragile:* Breaks at < 5 Joules.
      *   *Sturdy:* Breaks at > 50 Joules.
      *   *Vagueness:* Is handled by the sorites of the energy threshold, not the metaphysics of the property.
      *   *Why this helps:* It solves the **Partner Problem**. Dropping on a pillow vs. concrete is just changing the *energy transfer* of the stimulus. It solves **Quiescent Dispositions** (threshold for *preventing* a change). It solves **One-Shot Masks** (the foam absorbs the first 5 Joules, leaving 0 for the glass; the second drop delivers 5 Joules directly).

  **Recommendation:** Build your prospectus around a **Systemic Causal Basis** view. Identify the disposition not with the object, but with the *object-in-context* structure. This sacrifices Intrinsicality (a metaphysical prejudice) to save Predictive Utility (a scientific requirement). It handles the Booster (the structure changes upon contact), the Partner (the context is part of the base), and the Gradability (thresholds are scalar).
