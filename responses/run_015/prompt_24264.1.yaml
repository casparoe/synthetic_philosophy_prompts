  im in a decision theory course this semester and we've spent like two whole lectures on the St. Petersburg family of games, and I'm stuck on the Pasadena game and a variant of it (the course called it the twist). You pay an entry fee, a coin flip decides whether you get a fixed amount or you enter a St. Petersburg-style game, and the expected value of the net gain ends up undefined — or in some formulations both options just have infinite EV so the standard comparison is vacuous; I'm honestly not 100% sure which one is the canonical setup and I don't think it matters for what I'm asking. I keep coming back to the thought that we might just be asking a normative theory to output a number where the math says there simply isn't one, but I don't know if that's a diagnosis or a shrug. The thing that gets me is that the discussion around it has been going in circles in my study group for weeks and nobody moves. One person keeps saying that when the expected value is undefined, expected utility theory is just silent — the maximize-EV norm doesn't apply to this kind of gamble, so the agent is rationally free to pick either option or to use whatever secondary principle they like, and anyone who demands a determinate answer is just asking the theory to do something it was never designed to do. The other person says rationality can't be silent in a genuine decision situation, so there has to be a substantive criterion — some tie-breaker, some way of regularizing the divergent expectation, some dominance-in-the-limit argument — and that the fact that the naive expected value is undefined is a defect of the naive formalization, not of the normative theory. My working theory is that they're actually answering different questions under the same heading — one about the domain of applicability of expected utility theory, one about what rationality requires of an agent facing a gamble with a divergent expectation — but I could be wrong and I definately want a real diagnosis, not a 