  # ADVERSARIAL COLLABORATION STATEMENT: TAMBORA AND AGENCY

  ### I. JOINT AGREEMENTS

  1.  **Factuality of Event:** The 1815 eruption of Mount Tambora occurred and injected sufficient stratospheric aerosols to cause measurable hemispheric cooling during the 1816 growing season.
  2.  **Variability of Outcome:** European crop failures in 1816 were severe but unevenly distributed, as were subsequent mortality and morbidity rates.
  3.  **Variability of Response:** State responses to the crisis (e.g., grain embargoes, price controls, poor relief) varied wildly across jurisdictions despite similar climatic shocks.
  4.  **Rejection of Monocausality:** Neither pure human autonomy (politics alone) nor pure climate determinism (weather alone) explains the famine patterns; both material shock and human mediation are required for explanation.
  5.  **Rejection of Extremes:** Both sides reject pure environmental determinism (which renders human action irrelevant) and pure human exceptionalism (which renders non-human forces mere backdrop).
  6.  **Moral Responsibility:** Both sides agree that acknowledging non-human causality does not automatically absolve human actors of moral or political responsibility for suffering.

  ### II. DISAGREEMENTS TABLE

  | Crux | Shared Empirical Ground | Historian A (Causal Protagonism) | Critic B (Intentional Agency) |
  | :--- | :--- | :--- | :--- |
  | **1. Explanatory Indispensability vs. Agency**<br>Does being causally indispensable make something an agent? | The 1816 temperature anomaly is inexplicable without referencing Tambora; no human action caused the cooling. | **Yes.** Explanatory indispensability grants narrative irreducibility. The volcano is a co-actor because the story collapses without it. | **No.** Indispensability establishes causal force, not agency. Agency requires counterfactual responsiveness (the capacity to do otherwise). |
  | **2. Intervention Asymmetry**<br>Does intervention asymmetry (you can't negotiate with magma) separate real actors from causal forces? | Humans can alter famine outcomes via policy; humans cannot alter eruption outcomes via negotiation or force. | **No.** Asymmetry defines the relationship but does not demote the volcano to backdrop. A co-actor need not be negotiable to be real. | **Yes.** Unilateral imposition defines a background force. A co-actor must participate in a field of mutual responsiveness, however limited. |
  | **3. Determinist Framing and Culpability**<br>Does determinist framing always excuse human failure? | Mortality rates varied significantly between regions (e.g., Ireland vs. France) despite similar crop failures. | **No.** It contextualizes failure within material limits. Recognizing the volcano clarifies the boundary of state power without removing responsibility for mitigation. | **Yes.** It risks naturalizing political failure. Framing famine as "volcano-caused" tends to shift blame from governance to inevitability. |
