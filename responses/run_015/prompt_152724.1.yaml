answer: |-
  ### Preliminary Brainstorming: Categories of Defeat

  *   **Empirical:** Claims about human cognitive architecture (non-linear salience, tractability thresholds) may be falsified by neuroscience or psychology showing greater plasticity or capacity for statistical reasoning.
  *   **Formal:** The distinction between "bad in principle" and "required to prioritize" may create a coherence gap between axiology (value theory) and praxeology (action theory), violating the internal logic of consequentialism.
  *   **Conceptual:** "Tractability" and "salience" may be ill-defined. If tractability includes computational aids, the constraint vanishes; if it excludes them, the view becomes anti-rational.
  *   **Intuition-Based:** The view may justify counterintuitive neglect of statistical harms (e.g., climate change, systemic poverty) in favor of vivid individual cases, violating the impartiality core to consequentialism.

  ---

  ### 1. Ranked Defeaters

  #### Decisive Defeaters
  *Arguments that force abandonment or radical revision.*

  1.  **The Reflective Override (Conceptual/Formal):**
      *   **Argument:** If the agent accepts this philosophical position, they acknowledge that aggregation is "what is bad in principle." Once this knowledge is acquired, the "cognitive limit" is bypassed by epistemic access. To continue following the salience heuristic while knowing it diverges from the principle of value is to act arbitrarily. Consequentialism demands maximizing the good *known* to the agent.
      *   **Concession Required:** The defender must concede that the salience constraint applies *only* to agents ignorant of the aggregation calculus. This reduces the view from a normative ethic to a description of bounded rationality for the uneducated, stripping it of philosophical force for ethicists or informed policymakers.

  2.  **The Impartiality Contradiction (Conceptual):**
      *   **Argument:** Aggregative consequentialism rests on the premise of impartiality (everyone counts for one, none for more than one). Salience is inherently partial (the vivid victim counts more than the statistical victim). Normatively endorsing salience as a priority constraint codifies bias into the moral system.
      *   **Concession Required:** The defender must concede that this is not strictly consequentialism but a hybrid view (e.g., satisficing consequentialism or rule-utilitarianism). They must abandon the claim that aggregation holds "in principle" if it is systematically overridden by partiality in practice.

  3.  **The Technological Obsolescence (Empirical/Formal):**
      *   **Argument:** "Tractability" is contingent on available tools. AI and algorithmic decision-making can perform linear arithmetic across populations effortlessly. If the norm is tied to human cognitive limits, it becomes obsolete as soon as agents delegate decisions to systems that exceed those limits.
      *   **Concession Required:** The defender must concede the view is temporally bounded to pre-AI human cognition. It cannot serve as a general normative theory for institutional or augmented agents.

  #### Merely Awkward Evidence
  *Findings compatible with the view but requiring unattractive adjustments.*

  1.  **The Identifiable Victim Effect (Empirical):**
      *   **Evidence:** Psychology confirms humans prioritize identifiable individuals over statistical lives.
      *   **Adjustment:** The view accepts this as normative.
      *   **Cost:** This makes the view counterintuitive to many moral frameworks that view the identifiable victim effect as a bias to be corrected. It requires the defender to argue that moral *bias* is a feature, not a bug, which undermines the claim to rationality.

  2.  **Large-Scale Neglect (Intuition-Based):**
      *   **Evidence:** Cases like climate change or global poverty involve low-salience, high-aggregate harm.
      *   **Adjustment:** The defender must argue these are "intractable" for individuals or redefine "tractability" to include institutional participation.
      *   **Cost:** This requires ad hoc redefinitions of tractability to avoid implying we have no duty to address existential risks. It risks making "tractability" mean "whatever we currently feel like doing."

  #### Insulation Check
  *Risk of unfalsifiability.*

  *   **Assessment:** The position is highly vulnerable to insulation. By distinguishing "bad in principle" from "required to prioritize," the defender can explain away any failure of aggregation as a "tractability constraint." If every counterexample is met with "that intervention wasn't salient/tractable enough," the theory predicts nothing.
  *   **Defect:** Yes, this is a defect. A normative theory must guide action, not just describe limits. If the theory allows the agent to ignore massive harm because it lacks salience, it fails to function as ethics.
  *   **Concession:** The defender must concede that "tractability" must be defined independently of subjective feeling (e.g., by computational cost or causal certainty) to avoid circularity. They must admit there are cases where high-aggregate harm *is* tractable and salient (via education/tools), in which case the constraint dissolves.

  ---

  ### 2. Specific Check: The Realistic Scenario

  **Scenario:**
  A senior regulatory engineer at a consumer electronics firm must approve a minor design change to a power adapter sold globally. The change saves the company millions but increases the risk of a minor electrical shock for users. Each shock is brief and barely perceptible—akin to a dust speck in the eye—causing no tissue damage or reportable injury. However, given the sales volume of fifty million units over the product's lifecycle, statistical modeling confirms the aggregate pain equals the suffering of one person being tortured for a week. The engineer can prevent this by rejecting the design (a single, tractable signature), but the harm is invisible, statistical, and lacks any vivid victim.

  **Analysis:**
  This case succeeds as a counterexample that strains the salience/tractability defense. The intervention is maximally tractable (one signature) and the aggregate harm is known with certainty (via the model), yet the harm remains below the perceptual-cognitive threshold for *feeling* (no vivid victim). If the defender claims the engineer should ignore the aggregate because it lacks salience, the view violates professional and moral duties to prevent known harm. If the defender claims the engineer should act because the math makes it "cognitively available," they undermine the core claim that we ought to rely on salience rather than linear arithmetic. The feature doing the work here is **epistemic access via calculation**. The scenario demonstrates that "tractability" of the *intervention* is decoupled from the salience of the *harm*. The view cannot consistently maintain that we should ignore aggregation when the aggregation is computationally trivial and the prevention is effortless.

  ### 3. Conclusion on Insulation

  The position is not well-insulated; rather, it is fragile under reflection. It attempts to occupy a middle ground between hard consequentialism and human psychology, but it collapses when the agent possesses the very philosophical knowledge the theory proposes. By admitting aggregation is "bad in principle," the theory grants the agent the knowledge needed to override the salience heuristic. To maintain the view, the defender must argue that agents *ought not* to act on known principles of value if those principles conflict with evolved heuristics. This creates a form of moral schizophrenia where the agent knows the good but is normatively forbidden from pursuing it efficiently. Consequently, the view is either falsified by agents capable of overcoming the cognitive limit (via tools or education) or it retreats into an unfalsifiable claim that such agents are acting "incorrectly" despite maximizing the good they acknowledge.
