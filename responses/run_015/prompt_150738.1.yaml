answer: |-
  **Project Title:** Modal Flatness and the Fanaticism Problem: A Conceptual Feasibility Study of Modal-Distance Discounting in Decision Theory

  **Project Summary**
  Expected Value (EV) maximization faces a critical challenge: EV fanaticism. This is the implication that a sufficiently large outcome, even with vanishingly small probability, ought to dominate decision-making (e.g., sacrificing a certain life to chase a trillion lives saved at odds of 1 in $10^{100}$). Standard responses either bite the bullet (accepting fanaticism as rational) or modify the utility function (invoking risk aversion). This project proposes a third path: investigating whether EV fanaticism relies on an unexamined assumption of "modal flatness"—the treatment of all possible worlds as equally accessible decision targets regardless of their metaphysical proximity. Over 10 weeks, I will develop a conceptual framework for "modal-distance discounting," testing whether decision weights can decay based on modal distance without collapsing into standard risk aversion or arbitrary probability thresholds.

  **Problem Statement: The Assumption of Modal Flatness**
  Standard decision theory treats probability as a scalar value assigned to outcomes, effectively flattening modal space. Whether an outcome occurs in a world nearly identical to ours or one requiring massive metaphysical divergence, standard EV calculations treat the probability $p$ as the sole weighting factor. This project argues that EV fanaticism persists because current models ignore *modal distance*.

  Consider two scenarios with identical numerical probabilities:
  1.  **Near Possibility:** A 1% chance of saving 1,000 people via a known medical intervention in the actual world.
  2.  **Distant Possibility:** A 1% chance of saving 1 trillion people via a mechanism requiring physics fundamentally divergent from actuality (e.g., simulated reality manipulation).

  Standard EV theory treats these weights identically if $p=0.01$. However, pre-theoretic intuition suggests the second claim warrants less decision weight, not because the utility is lower, nor because the probability is numerically smaller, but because the *world* in which this obtains is modally distant. The core research question is: **Does EV fanaticism depend on treating modal proximity as irrelevant, and can we construct a non-arbitrary modal-distance discount function?**

  **Critique of Existing Approaches**
  Current literature fails to address the modal structure of decision problems.
  *   **Fanaticism:** Accepts the implication that tiny probabilities of astronomical value dominate. This preserves formal consistency but violates plausible normative constraints.
  *   **Risk Aversion/Diminishing Marginal Utility:** Modifies the value function $V(x)$. This fails to capture the intuition that the *possibility itself* is suspect. It treats the problem as one of valuation rather than metaphysical accessibility.
  *   **Probability Thresholds:** Ignores probabilities below a certain cutoff. This is ad hoc and vulnerable to "precision objections" (why $10^{-100}$ and not $10^{-99}$?).

  None of these approaches touch the modal structure. They assume that once a probability is assigned, the metaphysical "distance" to that world is irrelevant. This project posits that this assumption is the error.

  **Methodology (8-10 Weeks)**
  This is a fully conceptual project involving formal modeling and thought experimentation. No empirical data collection will be conducted.

  *   **Weeks 1-3: Formalizing Modal Distance.**
      I will survey existing metrics for modal similarity (e.g., Lewisian sphere systems) to determine if a measurable "distance" $d$ can be defined independent of probability. The goal is to define a weighting function $W(p, d)$ where decision weight is a function of both probability $p$ and modal distance $d$.
  *   **Weeks 4-7: Staged Rescue Cases.**
      I will construct a series of "staged rescue" thought experiments. These cases will hold numerical probability constant while varying modal distance.
      *   *Case A:* Certain save of 1 person.
      *   *Case B:* 50% chance to save 3 people (Near World).
      *   *Case C:* 50% chance to save 3 people (Distant World—requires contingent laws of nature to differ).
      By comparing intuitive judgments across these cases, I will test whether modal distance independently impacts decision weight. I will then attempt to formalize these intuitions into constraints for $W(p, d)$.
  *   **Weeks 8-10: Stability Analysis.**
      I will test the proposed discount function against standard money pumps and Dutch Book arguments. The critical test is whether modal discounting collapses into risk aversion. If the discount function can be rewritten purely as a transformation of utility $V'(x)$, the project fails. Success requires showing that modal distance introduces a structural constraint distinct from utility curvature.

  **Success vs. Failure Conditions**
  *   **Success:** A formal sketch of a decision rule where modal distance acts as an independent discount factor. This rule must resolve at least one standard fanaticism case (e.g., Pascal's Mugging) without violating basic dominance principles. It must demonstrate that modal discounting is not reducible to risk aversion.
  *   **Partial Success:** A proof that while modal distance matters, it cannot be formalized without arbitrariness. This would still be a valuable contribution, delineating the boundary between metaphysics and decision theory.
  *   **Total Failure:** Demonstrating that modal distance is either incoherent as a decision variable or is mathematically equivalent to existing risk-aversion models. Even this negative result clarifies why the "flat line" assumption is necessary for standard theory.

  **Scope and Feasibility Check**
  This project is scoped strictly for a single summer. It does not aim to produce a complete alternative to Expected Utility Theory. Rather, it aims for a feasibility study: determining whether modal distance is a viable candidate for resolving fanaticism.
  *   **Limitation:** I will not address the epistemology of how agents estimate modal distance. The project assumes agents have credences about modal proximity and asks how those should weight decisions.
  *   **Limitation:** I will not engage with empirical psychology. The "intuitions" tested are philosophical intuitions used for reflective equilibrium, not survey data.

  **Conclusion**
  The debate over EV fanaticism has stalled between those who accept counterintuitive results and those who tweak utility functions. Both sides assume modal flatness. By investigating whether credence should decay with modal distance, this project seeks to uncover whether the structure of possibility itself imposes rational constraints on expectation. If successful, this framework offers a way to reject fanaticism not by ignoring small probabilities, but by recognizing that not all possible worlds are equally "weighty" in decision space.
