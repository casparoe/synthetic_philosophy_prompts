      *   *Misconception 2:* Counterfactuals = Fantasy/Speculation.
      *   *Interception:* When introducing the method. Frame it as "Testing Explanatory Dependency," not "Writing Alternate History."

  6.  **Diagnostic Question:**
      *   Needs to apply the distinction to a *slightly altered scenario*.
      *   *Idea:* Change the agent but keep structure, or change structure but keep agent.
      *   *Scenario:* What if Hitler dies in WWI, but the Great Depression is milder?
      *   *Test:* Can they identify which variable (Structure or Agency) is being manipulated and what that implies for the outcome's fragility?

  7.  **Omissions:**
      *   *Functionalist vs. Intentionalist:* Too specific to the Holocaust/inner workings. Distracts from the macro "Rise to Power" question.
      *   *Philosophical nuances (Lewisian possible worlds):* Too technical.
      *   *Marxist vs. Liberal historiography:* Too ideological, distracts from the causal mechanism.

