prompt: |-
  I am convening a single ninety-minute seminar for final-year politics undergraduates who have just completed a broad survey of interwar Europe but have encountered neither philosophy of history nor formal counterfactual reasoning. I wish to lead them through the debate over whether Nazi Germany could have arisen without Hitler, yet I do not want them to leave thinking that the question is merely 'was Hitler important?' Rather, they should learn to distinguish structural preconditions—those institutional, economic, and diplomatic features of the Weimar polity and its international settlement that made some authoritarian rupture plausible—from agent-dependent triggers, which hinge on specific individual decisions and capacities. Please do not explain the historical narrative to me; instead, design a pedagogical plan for how I should unfold this distinction in the room.

  The plan must specify the exact sequence in which the conceptual components are introduced, with dependency relations made explicit: state whether students must first grasp causal overdetermination before they can understand modal fragility, or whether reversing that order prevents a predictable error. Choose the one analogy or concrete case that should carry the entire explanation; describe precisely what properties it must possess—such as multiple interacting sufficient conditions—and what it must lack, particularly any feature that might encourage students to treat the removal of one cause as automatic proof that another was sufficient. Identify the misconceptions these students will almost certainly form: I am particularly worried they will equate 'structural explanation' with historical inevitability, and that they will dismiss counterfactual reasoning about Hitler's absence as mere speculative fiction rather than a disciplined test of explanatory dependency. For each misconception, indicate the precise moment in the sequence where it should be intercepted and neutralised.

  Include one diagnostic question to ask at the end that tests whether they can apply the distinction to a slightly altered scenario rather than simply restate it. Finally, state explicitly which historiographical controversies or philosophical refinements—such as the functionalist versus intentionalist literature on the Holocaust—should be deliberately omitted at this level, with a brief justification of why their inclusion would destabilise the conceptual architecture you have constructed. Please reply in American English.
