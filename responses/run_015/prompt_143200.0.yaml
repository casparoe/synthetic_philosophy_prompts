      *   *Refinement:* **A Chemical Reaction (Explosive Mixture).**
      *   *Properties:* Unstable compounds (Weimar politics), containment vessel (Versailles), Catalyst (Hitler).
      *   *Why:* Chemistry allows for "necessary conditions" vs. "sufficient conditions." A catalyst speeds up or enables a reaction that *might* happen slowly otherwise, or *only* happens with it.
      *   *Selection:* **The Unstable Chemical Compound.**
      *   *Properties to possess:* Multiple ingredients required for instability (structure). A specific catalyst required to trigger the explosion at *that* time and in *that* way (agency).
