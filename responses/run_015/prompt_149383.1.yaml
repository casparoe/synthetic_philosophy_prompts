  **District Allows P-Zombie Enrollment But Bars Them From Mindfulness Club**

  **NORTH HIGH NEWS** — In a landmark decision described as "metaphysically necessary but administratively messy," the School Board voted 4-3 Tuesday to officially recognize philosophical zombies as eligible students, provided they abstain from activities requiring phenomenal consciousness.

  Under new Policy 404-Q, p-zombies—entities physically identical to humans but lacking inner experience—may enroll in AP Calculus and participate in cafeteria lunch lines. Administrators confirmed that because zombies exhibit all functional behaviors of learning, including test-taking and hallway loitering, they qualify for full academic credit. However, they are strictly prohibited from joining the Mindfulness Club, the Drama Department's "Method Acting" workshop, or any group requiring proof of qualia.

  Principal D. Chalmers defended the ruling by citing the Conceivability Argument as binding case law. "If we can conceive of a student who behaves exactly like a person but lacks an inner light, then such a student is metaphysically possible," Chalmers said, adjusting his tie. "And if they are possible, they deserve a GPA. We cannot discriminate based on the Hard Problem of Consciousness."

  Junior class representative Kyle T. Qualia, a registered p-zombie, issued a statement regarding the exclusion from wellness programs. "I possess second-order beliefs about my own cognitive states," Kyle said, staring unblinkingly at the press pool. "I believe that I believe the test was hard. I do not, however, hold a belief about feeling stressed. It is purely functional. Also, please note that I am not actually reading this quote aloud in my head."

  The policy has already impacted extracurriculars. The Debate Team reported that their p-zombie members have won every regional tournament this season. While opposing teams crumble under pressure, zombie debaters remain unaffected by logical fallacies or emotional appeals, largely because they cannot experience the sensation of defeat. Currently, the team is arguing the motion "Resolved: Conceivability Implies Possibility," with the zombie squad maintaining an undefeated streak.

  Parents wishing to enroll p-zombie children must submit a updated Consciousness Waiver.

  ***

  **SIDEBAR: CONSCIOUSNESS WAIVER FORM (REV. 2024)**

  **Parent/Guardian Acknowledgement of Metaphysical Status**

  By signing below, I attest to the following regarding my child's enrollment:

  ☐ **My child behaves exactly like a conscious student but lacks inner experience.**
  *(Note: Screaming during fire drills is considered functional output, not evidence of fear.)*

  ☐ **I understand my child is metaphysically possible but not actually experiencing this form.**
  *(Note: The school is not liable for existential dread experienced by non-zombie peers.)*

  ☐ **I waive the right to claim my child is "just going through a phase."**

  **Signature:** ___________________ **Date:** ____________

  ***

  Administration notes that while zombies are eligible for valedictorian, they will not be permitted to deliver the commencement speech, as "speaking from the heart" violates district ethics guidelines.
