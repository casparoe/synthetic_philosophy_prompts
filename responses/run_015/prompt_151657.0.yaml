  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Chair of a serious-incident review committee at a 600-bed teaching hospital.
      *   **Task:** Design a decision procedure for writing causal statements in incident reports.
      *   **Constraints:**
          *   Based on two philosophical accounts: Counterfactual-Dependence (Lewis) and Interventionist (Woodward).
          *   Must be runnable in ~15 minutes per claim.
          *   No statisticians, no new studies, limited data (chart, timeline, routine data).
          *   Must handle specific distinctions: contrast class, backtracking vs. non-backtracking counterfactuals, surgical vs. non-surgical interventions, invariance across routes, admissible background settings, non-manipulable factors (age, etc.).
          *   Must include a tie-break rule and a ladder of permitted language (Cause, Contributing Factor, Risk Stratifier, Marker).
          *   Must identify "sign-off points" where judgment is unavoidable (model selection, tracing depth, etc.).
          *   Must apply the procedure to three specific cases (Escalation failure, Frailty, Overdetermination/Double Cause).
          *   Must be honest about limitations (what it can't do, where it misgrades, where it disguises metaphysics as fact).
      *   **Tone:** Professional, precise, defensible under litigation/regulatory scrutiny, philosophically grounded but operationally practical.

  2.  **Deconstruct the Philosophical Foundations:**

      *   **Counterfactual-Dependence (Lewis):** $C$ causes $E$ if, had $C$ not occurred, $E$ would not have occurred.
          *   *Challenge in Healthcare:* Omissions (failure to act), pre-emption (two causes, one wins), overdetermination (two causes, both sufficient).
          *   *Backtracking:* We must ensure we aren't saying "If the alarm hadn't rung, the fire wouldn't have happened" (which implies the fire caused the alarm). We need "If the short circuit hadn't happened, the alarm wouldn't have rung."
      *   **Interventionist (Woodward):** $X$ causes $Y$ if there is a possible intervention on $X$ that changes $Y$, holding other variables fixed.
          *   *Challenge in Healthcare:* Manipulability (can we intervene on age?), Invariance (does the relationship hold across contexts?), Modularity (can we change $X$ without changing the mechanism linking $X$ to $Y$?).

  3.  **Drafting the Procedure (The "Causal Attribution Protocol" - CAP):**

      *   *Structure:* Needs to be a flowchart/checklist style.
      *   *Step 1: Definition.* Define the specific event ($E$) and the candidate factor ($C$).
      *   *Step 2: Counterfactual Test (Lewis).* The "But-For" test.
      *   *Step 3: Interventionist Test (Woodward).* The "Manipulation" test.
      *   *Step 4: Distinction Checks.* Backtracking, Invariance, Manipulability.
      *   *Step 5: Classification.* Assigning the label (Cause, Contributing, etc.).
      *   *Sign-off Points:* Where the Chair must make a judgment call.

      *Refining the Steps for the User's Constraints:*
      *   Need explicit "Stop" conditions.
      *   Need to handle the "non-manipulable" factors (age/frailty) carefully.
      *   Need to handle overdetermination (Case 3).

  4.  **Developing the Ladder of Language:**

      *   **Cause:** Passes both Counterfactual and Interventionist tests (non-backtracking, surgical intervention possible).
      *   **Contributing Factor:** Passes Interventionist but fails Counterfactual (e.g., overdetermination) OR Passes Counterfactual but intervention is not currently feasible (policy vs. physics).
      *   **Risk Stratifier:** Non-manipulable (age, genetics) but correlates with outcome.
      *   **Marker:** Correlates but intervention doesn't change outcome (proxy).

  5.  **Developing the Tie-Break Rule:**

      *   If Lewis says Yes and Woodward says No: Usually implies the factor is a "symptom" or "marker" rather than a driver, OR the intervention is impossible. *Decision:* Downgrade to Marker/Stratifier.
      *   If Woodward says Yes and Lewis says No: Usually implies Overdetermination or Pre-emption. *Decision:* Classify as Contributing Factor (because changing it *would* matter in general, even if not in this specific token instance).
      *   *User Constraint:* "At least one of these should come out in a way the committee will dislike." Case 3 (Overdetermination) is the classic philosophical problem where Counterfactual fails (if Pump didn't fail, Drug B still kills) but Interventionist works (fix Pump, patient lives *unless* Drug B is there). Actually, in Overdetermination, Lewis fails (if C1 didn't happen, E still happens due to C2). Woodward works (Intervene on C1, E changes *if* C2 is fixed). This creates tension. I need to ensure the procedure reflects this tension honestly.

  6.  **Applying to the Three Cases:**

      *   **Case 1 (Failure to Escalate):**
          *   Counterfactual: If escalated, would arrest be avoided? (Likely Yes).
          *   Interventionist: Can we intervene on "escalation protocol"? Yes.
          *   Result: Cause.
      *   **Case 2 (Frailty):**
          *   Counterfactual: If not frail, would arrest happen? (Maybe not).
          *   Interventionist: Can we intervene on "frailty" surgically? No. It's a state, not a variable we can set *ex post*.
          *   Result: Risk Stratifier (not a Cause in the actionable sense). Committee will dislike this because they want to acknowledge the patient's vulnerability without blaming the patient.
      *   **Case 3 (Double Toxicity/Overdetermination):**
          *   Counterfactual: If Pump didn't fail, would toxicity happen? Yes (Drug B). So Pump Failure is *not* a counterfactual cause.
          *   Interventionist: If we fix the Pump (intervene), does Toxicity change? Yes (assuming Drug B is held fixed).
          *   Result: Lewis = No, Woodward = Yes.
          *   Tie-Break: Classify as "Contributing Factor" rather than "Cause". This will annoy the committee who wants to blame the pump error definitively.

  7.  **Addressing the "Sign-Off Points" (Judgment Calls):**

      *   Model boundaries (what variables are included).
      *   Feasibility of intervention (legal/financial).
      *   Granularity of the event.

  8.  **Addressing Limitations:**

      *   Rare events (statistical power).
      *   Omissions (hard for interventionists).
      *   Near misses (harm avoided by luck).
      *   Metaphysical disguise (sounding scientific when it's policy).

  9.  **Review against Constraints:**

      *   *15 minutes?* The checklist needs to be tight.
      *   *Plain English distinctions?* Need to explain "backtracking" simply.
      *   *Defensible?* Yes, by explicitly stating the logical test used.
      *   *No statistician?* The logic is conceptual, not statistical.
      *   *Case 3 outcome?* Must remain hard (Contributing Factor, not Cause).

  10. **Refining the Output:**

      *   *Introduction:* Acknowledge the role and the gravity.
      *   *The Protocol:* Numbered steps, clear Yes/No/Stop.
      *   *The Ladder:* Clear definitions.
      *   *The Case Studies:* Apply rigorously.
      *   *The Limitations:* Be blunt.

      *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in philosophical jargon. The user knows the jargon (Lewis/Woodward), but the *report* needs plain English. The *procedure* can use the terms, but the *output* must be defensible. I will keep the procedure steps precise but explain the "translation" for the report.

      *(Refining Case 3)*: In overdetermination, Lewis says neither is a cause. Woodward says both are causes (relative to an intervention). If I follow the tie-break (Woodward wins for actionability), I might call it a Cause. But the prompt says "At least one... should come out in a way the committee will dislike... my guess is that the counterfactual reading and the interventionist reading will not both give us what we want."
      If I call it a "Cause" based on Woodward, the committee might like that. If I call it "Contributing" because Lewis fails, they might dislike it.
      Actually, the most philosophically honest result for Overdetermination under Lewis is "Not a Cause." Under Woodward, it is "A Cause."
      If I prioritize *defensibility in litigation*, Counterfactual is often the legal standard ("but-for"). If I prioritize *quality improvement*, Interventionist is better ("fixing this prevents future harm").
      The prompt asks for a tie-break rule. I should probably prioritize Interventionist for QI purposes but downgrade the language for Legal purposes.
      *Decision:* I will set the Tie-Break to favor Interventionist for *internal* learning but mandate the "Contributing Factor" label when Counterfactual fails, to satisfy legal defensibility (since "but-for" fails). This satisfies the "committee will dislike" constraint (they want to say "The Pump Error Caused the Death," but the protocol says "Contributing Factor" because the other drug would have killed the patient anyway).

      *(Refining Case 2 - Frailty)*: Committees love listing frailty as a cause to share blame with "nature." The protocol should identify this as a "Risk Stratifier" because you cannot intervene on it. This will annoy them.

      *(Refining Case 1 - Escalation)*: This is the "easy" one that should pass both.

      *(Sign-off Points)*: Need to be explicit that the Chair decides the "Admissible Background."

  11. **Final Polish:** Check tone. Ensure it sounds like a tool for a Chair, not a philosophy lecture. Ensure the "Stop" conditions are clear.

      *Wait, one nuance on Case 3:* If Drug A (Pump) AND Drug B (Independent) both cause toxicity.
      Counterfactual on Pump: If Pump correct -> Patient still gets Drug B -> Toxicity still happens. Result: Pump is NOT a but-for cause.
      Interventionist on Pump: Intervene on Pump (fix it) holding Drug B fixed -> Toxicity avoided? Wait. If Drug B *alone* produces toxicity, then fixing Pump doesn't save the patient.
      *Correction:* In strict overdetermination (both sufficient), intervening on one *does not* change the outcome if the other is present.
      Woodward's account handles this via "modularity." If I intervene on Pump, I break the link between Pump Setting and Dose. But Drug B is still there. So Outcome is still Toxicity.
      So Woodward *also* says No, unless we consider the intervention to be "Fix Pump AND Remove Drug B." But that's two interventions.
      *Actually, standard Interventionist view on Overdetermination:* $Y = f(X1, X2)$. If $X1=1 \to Y=1$ and $X2=1 \to Y=1$. If we set $X1=0$, $Y$ is still 1 because $X2=1$. So Interventionist test *also* fails for singular causation in strict overdetermination unless we define the outcome more granularly (e.g., time of death, severity).
      *However*, for the purpose of this exercise, I need to make sure the distinction shines through.
      Let's adjust the scenario slightly to ensure the philosophical tension is clear but the procedure works.
      Scenario 3: Pump error (10x dose). Second drug (therapeutic dose but patient has renal failure unknown). Either *would* have produced toxicity.
      If I fix the Pump, the patient still gets Toxicity from Drug 2.
      So Lewis: No.
      Woodward: If I intervene on Pump, does Outcome change? No, because Drug 2 is still there.
      So *both* say No? That makes it "Not a Cause." That will definitely annoy the committee.
      *Alternative interpretation:* The committee wants to blame the Pump. The procedure says "No."
      *Better interpretation for the prompt's requirement:* "the counterfactual reading and the interventionist reading will not both give us what we want."
      Let's assume the "Double Cause" is slightly different: Pre-emption. Pump error kills patient *before* Drug 2 would have.
      Lewis: If Pump didn't fail, Drug 2 kills patient. So Pump didn't cause death (death happens anyway).
      Woodward: If we fix Pump, does death happen? Yes (Drug 2).
      Okay, I will stick to the strict Overdetermination. Both tests fail the "Sole Cause" test. The procedure must force the label "Contributing Factor" or "Marker of System Vulnerability."
      *Wait, I can make the distinction sharper.*
      Lewis (Counterfactual): Requires "But For."
      Woodward (Interventionist): Requires "Invariance."
      If I fix the pump, does the *general* risk go down? Yes.
      So for *systemic* learning, it's a cause. For *this* patient, it's not a but-for cause.
      I will structure the Tie-Break to handle this: If Lewis fails but Woodward passes (general level), it is a "Contributing Factor" (Systemic Cause, not Token Cause). This distinguishes the specific report from the general lesson.

      *Let's re-read the prompt on Case 3:* "Either would have done it alone." This is classic Overdetermination.
      Lewis: Neither is a cause.
      Woodward: Both are causes *if* we consider the intervention in a context where the other isn't present. But in *this* context, the intervention on X doesn't change Y.
      Okay, I will ensure the procedure forces the "Contributing Factor" label here, acknowledging that while it wasn't the *sole* driver, it is a *modifiable* driver. This distinguishes it from Frailty.

      *Wait, one more check on Woodward:* Woodward allows for "Structural Equations." $Y = X1 \lor X2$. If $X1=1, X2=1 \to Y=1$. Intervention $X1=0 \to Y=1$. So $X1$ is not a cause of *this* token $Y$.
      However, Woodward emphasizes *general* causal relations. The committee report is about *this* patient.
      Okay, I will make sure the procedure highlights the Token vs. Type distinction.

      *Final Plan:*
      1. Protocol Name: Causal Attribution Protocol (CAP).
      2. Steps: Definition, Counterfactual (Lewis), Interventionist (Woodward), Classification.
      3. Sign-off points clearly marked.
      4. Case studies applied rigorously.
      5. Limitations section.

      *Self-Correction on "15 minutes":* Keep the questions binary.
      *Self-Correction on "Defensible":* Use the "But-For" language for Lewis, as courts understand it. Use "Actionable" language for Woodward.

      *Let's write.*
answer: |-
  # Causal Attribution Protocol (CAP) for Serious Incident Reviews

  **Purpose:** To generate defensible causal statements for board/regulatory reports within 15 minutes per candidate factor.
  **Philosophical Basis:** Integrates Counterfactual-Dependence (Lewis) for legal defensibility and Interventionist (Woodward) for quality improvement utility.
  **Users:** Committee Chair, Risk Manager, QI Nurse, Physicians.
  **Constraint:** No new data collection; relies on chart, timeline, and existing routine data.

  ---

  ## Part 1: The Decision Procedure

  Run this checklist for *each* candidate factor (e.g., "Failure to Escalate," "Pump Setting," "Patient Frailty"). Do not run it on the incident as a whole; run it on the specific variables you intend to name.

  ### Step 1: Variable Definition & Contrast Class
  *Before testing causality, define what you are testing.*
  1.  **Define the Factor ($X$):** State the factor as a variable with at least two values (e.g., not "Pump Error," but "Pump Programmed Rate: {10x} vs. {1x}").
  2.  **Define the Outcome ($Y$):** State the specific harm (e.g., "Cardiac Arrest at 14:00," not "Patient Harm").
  3.  **Sign-Off Point (Chair):** Is this variable **admissible**?
      *   *Reject if:* It is a vague summary (e.g., "Poor Care").
      *   *Reject if:* It is purely retrospective (e.g., "The decision that turned out wrong").
      *   *Accept if:* It describes a state or event identifiable in the timeline.

  ### Step 2: The Counterfactual Test (Lewis Account)
  *Tests for "But-For" causality. Essential for legal/regulatory defensibility.*
  **Question:** Had $X$ been set to its baseline value (e.g., correct rate, escalation made), holding the actual history of all other events fixed, would $Y$ have been avoided?
  *   **Sufficiency Condition:** You must be able to assert "Yes" without changing anything else in the timeline (no backtracking).
  *   **Stop Condition (Hard No):** If the answer is "No" (the outcome would have happened anyway due to another factor), $X$ fails the Counterfactual Test. **Flag as [Non-But-For].**
  *   **Backtracking Check:** Are you assuming that changing $X$ would have changed an upstream cause? (e.g., "If the alarm had sounded, the nurse would have been more attentive earlier").
      *   *If Yes:* This is **Backtracking**. The Counterfactual Test fails. **Flag as [Backtracking].**

  ### Step 3: The Interventionist Test (Woodward Account)
  *Tests for actionability and invariance. Essential for QI/Corrective Action.*
  **Question:** Is there a surgical intervention available to us that sets $X$ to a different value and changes the probability of $Y$, independent of the route?
  *   **Sufficiency Condition:**
      1.  **Manipulable:** We can physically/legally/financially change $X$ next quarter.
      2.  **Modular:** Changing $X$ does not require changing the mechanism linking $X$ to $Y$.
      3.  **Invariant:** The relationship holds across relevant background conditions (e.g., day shift vs. night shift).
  *   **Stop Condition (Hard No):** If $X$ cannot be set by human intervention (e.g., Age, Genetics, Past History), the Interventionist Test fails. **Flag as [Non-Manipulable].**
  *   **Route Dependence Check:** Does the effect of $X$ on $Y$ depend on *how* we change $X$? (e.g., Does fixing the pump via software update work differently than fixing it via staff training?)
      *   *If Yes:* $X$ is not a stable variable. **Flag as [Unstable Variable].** Redefine $X$ or Stop.

  ### Step 4: Classification & Tie-Break
  *Assign the permitted language based on the results of Steps 2 and 3.*

  | Counterfactual (Step 2) | Interventionist (Step 3) | **Permitted Language** | **Rationale** |
  | :--- | :--- | :--- | :--- |
  | **PASS** | **PASS** | **CAUSE** | Defensible in court; actionable for QI. |
  | **FAIL** | **PASS** | **CONTRIBUTING FACTOR** | Would prevent harm in general (Woodward), but not the *but-for* cause of this specific death (Lewis). |
  | **PASS** | **FAIL** | **RISK STRATIFIER** | Predictive and counterfactually linked, but we cannot intervene on it (e.g., Age). |
  | **FAIL** | **FAIL** | **MARKER / CONTEXT** | Correlates with harm but is neither a but-for cause nor actionable. Do not list in "Root Causes." |

  **Tie-Break Rule:**
  If the Committee disagrees on the output of Step 2 or 3:
  1.  **For Legal/Regulatory sections:** Default to the **Counterfactual** result. (If it fails "But-For," do not call it a Cause in the executive summary).
  2.  **For Corrective Action sections:** Default to the **Interventionist** result. (If it is manipulable, we act on it, even if it was only a Contributing Factor).
  3.  **Sign-Off Point (Chair):** You must sign off on the **Admissible Background**. Are we testing the intervention against *this specific night's chaos* or a *reasonable standard background*?
      *   *Restriction:* You may not assume a "perfect world" background. You must assume the staffing and resources actually available, unless the lack thereof is itself the candidate factor $X$.

  ---

  ## Part 2: Application to Case Studies

  Here is the procedure run on the three cases from your last quarter.

  ### Case 1: Failure to Escalate
  *Scenario: Abnormal observations documented, not escalated. Patient arrested hours later.*
  *Candidate Factor: Failure to Escalate.*

  1.  **Variable:** Escalation Status {Not Escalated} vs. {Escalated per Protocol}.
  2.  **Counterfactual Test:** If Escalated {Yes}, holding other factors fixed (patient physiology, ward staffing), would Arrest {No} have occurred?
      *   *Evidence:* Chart shows deterioration was reversible if treated at T+1 hour.
      *   *Result:* **PASS.** (If they called, the team would have come, treatment given, arrest avoided).
  3.  **Interventionist Test:** Can we intervene on Escalation Status?
      *   *Manipulable:* Yes (Training, EMR hard-stop).
      *   *Invariant:* Yes (Escalation works day or night).
      *   *Result:* **PASS.**
  4.  **Classification:** **CAUSE.**
      *   *Report Wording:* "The failure to escalate the abnormal observations caused the cardiac arrest."
      *   *Committee Reaction:* Satisfaction. This matches intuition and passes both philosophical tests.

  ### Case 2: Patient Frailty
  *Scenario: 84-year-old frail patient. Committee wants frailty in the causal statement.*
  *Candidate Factor: Patient Frailty.*

  1.  **Variable:** Frailty Status {High} vs. {Low}.
  2.  **Counterfactual Test:** If Frailty {Low}, holding events fixed, would Arrest {No} have occurred?
      *   *Evidence:* Likely yes, a robust patient would have tolerated the insult.
      *   *Result:* **PASS.**
  3.  **Interventionist Test:** Can we intervene on Frailty Status *for this patient at this time*?
      *   *Manipulable:* **NO.** We cannot surgically set an 84-year-old's frailty to "Low" during the admission. We can only intervene on *future* patients or on *perception* of frailty.
      *   *Result:* **FAIL.** [Non-Manipulable].
  4.  **Classification:** **RISK STRATIFIER.**
      *   *Report Wording:* "Patient frailty acted as a risk stratifier, increasing susceptibility to harm." (Do not list as a Cause of the incident).
      *   *Committee Reaction:* **Dislike.** They want to name frailty to acknowledge the patient's vulnerability and perhaps dilute the focus on system errors. The protocol forces you to admit this is a patient characteristic, not a system failure we could have fixed *in this instance*.
      *   *Chair Sign-Off:* You must enforce this. Listing Frailty as a "Cause" implies we could have intervened on it, which opens the hospital to liability for not "fixing" the patient's age/physiology.

  ### Case 3: Double Toxicity (Overdetermination)
  *Scenario: Pump programmed at 10x rate (Drug A). Independently, Patient given Drug B (toxic dose). Either alone causes toxicity.*
  *Candidate Factor: Pump Programming Error.*

  1.  **Variable:** Pump Rate {10x} vs. {1x}.
  2.  **Counterfactual Test:** If Pump Rate {1x}, holding Drug B administration fixed, would Toxicity {No} have occurred?
      *   *Evidence:* Drug B alone is sufficient for toxicity.
      *   *Result:* **FAIL.** [Non-But-For]. (The patient suffers toxicity regardless of the pump).
  3.  **Interventionist Test:** Can we intervene on Pump Rate?
      *   *Manipulable:* Yes (Lockout software).
      *   *Invariant:* Yes (In a world without Drug B, fixing the pump prevents toxicity).
      *   *Result:* **PASS.** (It is a general cause of toxicity, just not the *sole* cause in this token instance).
  4.  **Classification:** **CONTRIBUTING FACTOR.**
      *   *Tie-Break Application:** Counterfactual fails (Legal risk in calling it "The Cause"), Interventionist passes (QI value in fixing it).
      *   *Report Wording:* "The pump programming error was a contributing factor to the toxicity." (Avoid "The Cause").
      *   *Committee Reaction:* **Strong Dislike.** They want to blame the pump error definitively. The protocol forces honesty: in this specific case, fixing the pump would not have saved the patient *given the second drug*.
      *   *Defensibility:* If you call it "The Cause" and litigation reveals Drug B was also toxic, your report is factually incorrect under the "but-for" test used in court. "Contributing Factor" protects you.

  ---

  ## Part 3: Limitations & Sign-Off Warnings

  This procedure cannot solve every problem. As Chair, you must acknowledge the following gaps where the protocol returns confident-sounding answers that are actually metaphysical or policy choices in disguise.

  ### 1. The "Omission" Problem
  *   **Issue:** The protocol treats "Failure to Escalate" as a variable. Philosophically, omissions are not events. Woodward's interventionism struggles with "doing nothing."
  *   **Risk:** The procedure will validate omissions as Causes (as in Case 1). This is standard in medicine but metaphysically shaky.
  *   **Mitigation:** Accept this for operational utility, but ensure the "Intervention" listed is a positive action (e.g., "Implement Escalation Protocol," not "Stop Not Escalating").

  ### 2. The "General vs. Token" Gap
  *   **Issue:** The Interventionist test asks if an intervention *changes* the outcome. In Case 3, it changes the outcome in *general* (most patients don't get Drug B), but not in *this token case*.
  *   **Risk:** The protocol classifies Case 3 as "Contributing Factor." This may feel like we are letting the pump error off the hook.
  *   **Mitigation:** Use the Corrective Action section to state: "While not the sole but-for cause in this instance, this error is a general cause of toxicity and will be mitigated."

  ### 3. Rare Events & Luck
  *   **Issue:** If a nurse makes an error but the patient survives due to luck (physiological reserve), the Counterfactual Test says "No Harm."
  *   **Risk:** The procedure will classify the error as a "Marker" or exclude it from the Causal Statement for *harm*, even though it was a safety failure.
  *   **Mitigation:** Run a parallel track for "Serious Safety Events" where harm is not required. This protocol is for *Harm Attribution* only.

  ### 4. Admissible Background (The Chair's Burden)
  *   **Issue:** Step 4 requires you to define the "background setting." Do we test the intervention against *this* understaffed night, or a *properly* staffed night?
  *   **Risk:** If you test against "proper staffing," you might conclude the error wouldn't have happened, making "Understaffing" the Cause. If you test against "actual staffing," you might conclude the error was inevitable, making it "Human Error."
  *   **Mitigation:** **Sign-Off Point.** You must explicitly record which background you chose. "We tested the intervention against the actual staffing levels of 14/11/2023." This prevents hindsight bias from creeping into the causal claim.

  ### 5. Non-Manipulable Causes
  *   **Issue:** Sometimes the true cause is non-manipulable (e.g., a rare genetic reaction).
  *   **Risk:** The protocol downgrades this to "Risk Stratifier."
  *   **Mitigation:** Accept this. It prevents the report from promising corrective actions that are impossible (we cannot change genetics). It forces the action plan to focus on *screening* for the factor, which is manipulable.

  ### Final Instruction to the Committee
  When you present this, state clearly: **"This protocol is designed to produce statements that survive cross-examination, not statements that maximize blame assignment. If the protocol says 'Contributing Factor' when you want 'Cause,' it is because the logic of the specific case does not support the stronger claim. We will not lie to the regulator to satisfy our desire for a clean narrative."**
