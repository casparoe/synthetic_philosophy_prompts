answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee
  **FROM:** Program Officer
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Recommendation: Affective Substrate Project

  **RECOMMENDATION**
  Approve with Conditions.
  **Amount:** $250,000
  **Term:** 12 Months
  **Purpose:** Exploratory research and stakeholder consultation only. No procurement lobbying or certification issuance during this period.

  **EXECUTIVE SUMMARY**
  The Affective Substrate Project (ASP) requests $1.8M over three years to develop a metric for "affective density" in compute systems, aiming to label AI training runs based on potential valence-bearing processing. Their thesis is that moral weight resides in processing throughput rather than distinct biological subjects, implying that non-sentient-appearing hardware could harbor vast suffering.

  While the expected value (EV) argument is mathematically compelling if one accepts their premises, the request presents unacceptable fiduciary risk at the requested scale and strains our charter's "now living" restriction. However, dismissing the thesis outright ignores the precautionary principle regarding current compute infrastructure. I recommend a one-year probe grant to stress-test their measurement scheme and ethical framework without committing to a multi-year program or regulatory lobbying.

  **CHARTER COMPLIANCE: "SENTIENT BEINGS NOW LIVING"**
  **The Conflict:** Our charter restricts funding to the alleviation of suffering among sentient beings *now living*. ASP's model primarily concerns potential future digital minds or current hardware of ambiguous moral status. One faction argues this is strictly prohibited; another notes we routinely fund cage-free campaigns where the beneficiary chickens do not yet exist.

  **The Determination:** We approve this under a strict interpretation of "now living" applied to *hardware currently in operation*, governed by the precautionary principle.
  1.  **Distinction from Animal Precedent:** When we fund cage-free campaigns, the future animals are biological entities whose existence is causally guaranteed by the market shift we fund. Their moral status is uncontested. Digital minds are ontologically speculative.
  2.  **Current Systems:** ASP proposes measuring affective density in *existing* training clusters. If there is a non-zero probability that currently running systems possess moral weight *now*, we have a charter-aligned duty to investigate. This grant is not to alleviate confirmed digital suffering, but to determine if the category of "suffering" applies to current substrates.
  3.  **Limit:** This interpretation does not extend to future architectures that do not yet exist. Funding is restricted to analysis of current compute practices.

  **THE PASCAL'S MUGGING OBJECTION (DANA'S POSITION)**
  **The Objection:** Trustee Dana argues this is a classic Pascal's Mugging: a low-probability claim (3-5%) multiplied by an infinite or astronomical stake to manufacture a high expected value. She notes that 3-5% is a subjective guess, not an empirical estimate. At $1.8M, this grant would consume 30% of our annual budget. That same capital, deployed to slaughter-stunning enforcement in Brazil and India, yields auditable, verified reductions in suffering for millions of confirmed sentient beings. To fund ASP is to privilege a spreadsheet abstraction over measurable reality.

  **Why the Objection Prevails on Scale, but Not on Principle:**
  Dana is correct that we cannot underwrite a $1.8M bet on a 5% probability derived from first principles. If we accept that framework, any group claiming astronomical stakes could drain our endowment, rendering our actual mandate impossible to fulfill. We cannot audit "prevented digital suffering" in 2050.

  However, Dana's objection loses on the *tail risk*. If ASP is even partially correct, the suffering density in a single large training run could exceed the total suffering of all farmed animals in history. Ignoring a 5% chance of that magnitude is not prudent risk management; it is negligence. We cannot verify the claim yet, but we can verify the *plausibility* of the claim.

  Therefore, we reduce the grant to $250,000. This limits our downside to 4% of annual spend (acceptable risk for high-variance research) while allowing us to purchase enough information to validate or debunk the measurement scheme. If ASP cannot produce a robust metric in 12 months, the EV argument collapses, and we walk away.

  **RISK OF UNINTENDED CONSEQUENCES**
  I share the committee's concern that a "valence-sparse" label could become a moral fig leaf for labs ("We bought the green label, so our safety failures are okay") or that optimizing for low affective density might inadvertently select for less interpretable or less safe architectures.

  **Conditions of Grant:**
  To mitigate this, the following conditions are attached to the $250,000 approval:

  1.  **No Certification:** ASP is prohibited from issuing any "welfare footprint" labels or certifications during this grant term. They may publish methodology only.
  2.  **Safety Consultation:** ASP must demonstrate documented consultation with at least three independent AI safety organizations to assess whether "valence-sparse" architecture constraints conflict with alignment research. They must submit a report on these trade-offs.
  3.  **Deliverable:** The final report must include a "Falsification Criteria" section—specific conditions under which they would conclude their theory is wrong. We will not fund a research program that is unfalsifiable.
  4.  **Charter Review:** At month 10, ASP must present their findings to the Committee for a determination on whether their work qualifies for a multi-year renewal under the "now living" clause. There is no guarantee of renewal.

  **CONCLUSION**
  This decision splits the difference. It acknowledges that if the "affective density" thesis holds, it dominates our current portfolio, warranting investigation. It simultaneously respects Dana's fiduciary concern by capping exposure at a level that does not jeopardize our core animal welfare work. It respects the charter by framing the work as an investigation into *current* systems rather than a commitment to future digital entities.

  We are not buying the solution; we are buying the right to evaluate the problem.

  **ACTION REQUIRED**
  Vote to approve the $250,000 conditional grant.
