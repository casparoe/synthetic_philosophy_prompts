answer: |-
  This is a sophisticated pedagogical challenge. You are asking students to bridge the gap between formal decision theory (which they lack) and normative philosophy (which they have), using a concrete scientific case study without getting bogged down in the math of Savage or the psychology of behavioral econ.

  Your instinct to avoid starting with Savage is correct. For a 50-minute discussion section with this demographic, **Savage's Representation Theorem is a terminus, not a starting point.** It proves that if you satisfy axioms, you *act as if* you maximize EU. But your goal is to show *why* one should satisfy the axioms in the first place (the normative force of coherence).

  Here is a structured teaching plan designed to meet your constraints, followed by specific answers to your design questions regarding the example and misconceptions.

  ### The 50-Minute Teaching Plan: "The Cost of Incoherence"

  **Goal:** Demonstrate that coherence axioms (transitivity, independence) are not just logical aesthetics but protective measures against exploitable loss (Money Pumps), distinguishing preference coherence from belief coherence.

  #### Phase 1: The Hook – Vulnerability, Not Logic (00:00 – 00:05)
  *   **Activity:** Do not define "coherence." Start with the loss.
  *   **Board Work:** Draw a circle with three points: $A$, $B$, $C$. Draw arrows $A \to B$, $B \to C$, $C \to A$.
  *   **Prompt:** "Imagine an agent who prefers $A$ to $B$, $B$ to $C$, and $C$ to $A$. If I own $A$, and I offer to trade you $A$ for $B$ for a penny, then $B$ for $C$ for a penny, then $C$ for $A$ for a penny... where does this agent end up?"
  *   **Desired Output:** They should see the agent ends up with $A$ (where they started) but is 3 cents poorer.
  *   **Conceptual Dependency:** Establish **Instrumental Rationality** first. If you prefer more resources to fewer, and you prefer $X$ to $Y$, you shouldn't pay to cycle back to $X$.
  *   **TA Note:** If they say "Just stop trading," ask: "Why? At every step, they are getting their preferred option. If the preference is genuine, why stop?" This sets up the need for structural constraints.

  #### Phase 2: The Researcher Case – Operationalizing the Pump (00:05 – 00:20)
  *   **Transition:** "Let's move from abstract $A, B, C$ to your Researcher example. We need to ensure this isn't just 'changing her mind,' but a structural vulnerability."
  *   **The Setup (Write on Board):**
      *   **Context:** Junior Researcher. Two states: Grant Secured ($S$) vs. Grant Uncertain ($U$).
      *   **The Options:**
          1.  **Plan P (Preregister):** High rigor, high cost.
          2.  **Plan N (No Preregister):** Low rigor, low cost.
          3.  **Plan H (Hybrid):** Medium rigor, medium cost.
      *   **The Cycle (The Critical Design):** You must construct the preferences so they are *intransitive* across the plans, not just state-dependent.
          *   *Scenario:* She prefers $P$ to $N$ (Rigor matters). She prefers $N$ to $H$ (Cost saving matters more than medium rigor). She prefers $H$ to $P$ (When holding $P$, the cost looks too high compared to $H$).
          *   *The Pump:* She starts with $P$. Pays small fee to switch to $H$ (prefers $H$). Pays small fee to switch to $N$ (prefers $N$). Pays small fee to switch to $P$ (prefers $P$).
  *   **Discussion Question:** "In this scenario, is the state ($S$ vs $U$) driving the preference, or is the *framing* of the choice driving it?"
  *   **Key Distinction:** Elicit from students that if the state ($S$ vs $U$) *legitimately* changes the value of the outcome, it's not a pump. It is only a pump if the options are effectively identical in value *to the agent* at the moment of choice, yet the preference reverses.
  *   **TA Note:** This is where you head off the "State-Dependence is Irrational" misconception. State-dependence is fine *if* it doesn't lead to a cycle. Incoherence is about the *cycle*, not the state.

  #### Phase 3: Belief vs. Preference Coherence (00:20 – 00:30)
  *   **Transition:** "We've talked about preferences. What about the Dutch Book argument you read about? How is that different?"
  *   **Board Work:** Two columns.
      *   **Left (Dutch Book):** Incoherent *Degrees of Belief* (Probabilities). Loss guaranteed regardless of *which state obtains*.
      *   **Right (Money Pump):** Incoherent *Preferences* (Ordering). Loss guaranteed regardless of *which option is chosen*.
  *   **Crucial Conceptual Move:** Ask: "Can I have coherent beliefs but incoherent preferences?" (Yes: I know the odds, but I choose cyclically). "Can I have coherent preferences but incoherent beliefs?" (Yes: I choose transitively, but I bet on impossible odds).
  *   **Addressing the Misconception:** Students often think Dutch Books prove you *must* have probabilistic beliefs. Clarify: Dutch Books prove that if you *act* on non-probabilistic beliefs, you lose money. Similarly, Money Pumps prove if you *act* on intransitive preferences, you lose resources.
  *   **Risk Attitude Check:** Ask: "Does risk aversion save the researcher from the pump?" (No. Risk aversion curves the utility function, but it doesn't justify $A \succ B \succ C \succ A$. Transitivity is prior to risk attitude).

  #### Phase 4: Scientific Rationality & Methodological Planning (00:30 – 00:40)
  *   **Transition:** "Why does this matter for philosophy of science? We aren't just gambling horses."
  *   **Discussion:** Connect the Money Pump to **Pre-Analysis Plans (PAPs)**.
      *   *Argument:* A PAP is a commitment device. Why do we need commitment? Because without it, the researcher might be "pumped" by the data. (e.g., $H_0$ not significant $\to$ prefer to add controls $\to$ prefer to drop outliers $\to$ prefer to claim significance).
      *   *Nuance:* Is the researcher *irrational* for wanting to explore data? Or is the *context* changing the option?
      *   **Constraint:** Keep this tight. Do not let the discussion devolve into "p-hacking is bad." Keep it on: "Does coherence require binding your future self?"
  *   **Key Takeaway:** Coherence arguments provide the normative backbone for methodological constraints. If you value truth/funding, incoherence makes you vulnerable to losing both.

  #### Phase 5: Check for Understanding (00:40 – 00:50)
  *   **Activity:** "The Reverse Pump."
  *   **Prompt:** "Present a case where a researcher changes their mind about a study design after seeing a grant outcome, but is *not* vulnerable to a money pump."
  *   **Success Criteria:** Students must describe a scenario where the preference change is due to a **change in the state description** that legitimately alters the utility, not a cycle in preference ordering over identical outcomes.
      *   *Example of Success:* "She prefers Preregistration if the Grant is \$1M, but No Preregistration if the Grant is \$10k, because the cost of preregistration eats the small grant." (This is state-dependent utility, not incoherence).
      *   *Example of Failure:* "She prefers Preregistration to No Preregistration, but if she has No Preregistration, she'd pay to switch to Preregistration, and if she has Preregistration, she'd pay to switch to No Preregistration." (This is a pump).

  ---

  ### Design Specifications for Your Example

  You asked specifically about the properties the Researcher example must have to work pedagogically. Here are the constraints:

  **1. Transparency of State-Dependence**
  *   **Requirement:** The state-dependence must be **transparent** to the researcher, but the *incoherence* must be hidden.
  *   **Why:** If the state-dependence is hidden, students will treat it as a mistake in information, not a failure of rationality. If the incoherence is obvious, they will just say "don't do that."
  *   **Implementation:** She knows the grant status. The "pump" comes from her evaluating the *same* monetary/reputational outcome differently depending on what she currently holds (endowment effect) or how the choice is framed, not because the grant status actually changes the value of the replication.

  **2. Monetary Amounts**
  *   **Requirement:** **Identical across states** for the *outcomes*, but the *cost to switch* must be positive.
  *   **Why:** If the monetary amounts scale with the state (e.g., Grant \$\$ vs. Grant \$), students will argue the utility function legitimately changed. To show a preference violation, the final outcome must be identical to the starting outcome, minus the transaction costs.
  *   **Implementation:** Ensure the "Grant Secured" and "Grant Uncertain" states ultimately result in the same ability to conduct the study for the sake of the thought experiment, or isolate the "prestige" value which should remain constant.

  **3. Timing of Coherence vs. Risk**
  *   **Requirement:** Introduce **Coherence (Transitivity)** *before* Risk Attitude.
  *   **Why:** Students often conflate "I prefer the safe bet" with "I prefer A to B." You need to establish that *ordering* is separate from *valuation*.
  *   **Implementation:** In Phase 3, explicitly ask: "If she is extremely risk-averse, does that justify the cycle?" The answer must be no. Risk aversion explains why $Safe \succ Risky$, but not why $A \succ B \succ C \succ A$.

  ---

  ### Mapping Misconceptions to Intervention Points

  | Misconception | When it will arise | Intervention Strategy |
  | :--- | :--- | :--- |
  | **"Coherence is just logical consistency of beliefs."** | Phase 3 (Dutch Book comparison). | **Contrast:** Use the Two-Column Board Work. Emphasize that Money Pumps target *actionguiding preferences*, not just propositional attitudes. You can believe consistently and still pump yourself. |
  | **"State-dependent utility is automatically irrational."** | Phase 2 (The Researcher Case). | **Distinction:** Ask the "Reverse Pump" question (Phase 5). Validate that changing preference due to *budget constraints* is rational. Incoherence is changing preference when the *trade-off structure* remains identical. |
  | **"Rejecting EU means embracing arbitrary reversal."** | Phase 4 (Scientific Rationality). | **Reframe:** Explain that rejecting EU doesn't mean "anything goes." It might mean adopting a different normative framework (e.g., satisficing, regret minimization), but one must still account for the vulnerability to loss. |
  | **"This is just about gambling, not science."** | Phase 1 (The Hook). | **Analogy:** Explicitly map "Money" to "Scientific Resources/Credibility." A money pump in science is wasting grant money on methodological switches that yield no epistemic gain. |

  ---

  ### What to Explicitly Leave Out

  To survive the 50-minute limit, you must prune aggressively:

  1.  **Savage's Representation Theorem:** Do not write down the axioms (P1–P4). Do not prove the theorem. Mention it only as "The mathematical result that formalizes what we just discussed intuitively."
  2.  **Causal vs. Evidential Decision Theory (CDT vs. EDT):** This is a rabbit hole. Coherence arguments generally apply to both. Bringing this up will confuse the distinction between *belief* and *preference*.
  3.  **The Allais Paradox:** Do not introduce this unless a student brings it up. If they do, park it: "That's a challenge to the *Independence* axiom specifically. Today we are looking at the *Transitivity* / Coherence foundation. We'll tackle Allais in three weeks."
  4.  **Subjective Expected Utility (SEU) Nuance:** Treat probabilities as given for the sake of the Money Pump argument. Don't get into how she derives the probability of the grant.

  ### Connecting to Scientific Rationality (Without Swallowing the Theory)

  You asked for a disciplined way to touch on methodological planning. Use the **"Commitment Device"** frame.

  *   **The Argument:** Coherence arguments show that a rational agent with time-inconsistent preferences (a form of money pump) will value the ability to restrict their own future choices.
  *   **The Application:** Preregistration is not just about honesty; it is a **rational commitment device** against one's own future incoherent preferences (e.g., the temptation to $p$-hack when results are ambiguous).
  *   **The Limit:** Stop short of claiming science *requires* EU maximization. Instead, claim that *if* we view scientific resource management as a rational endeavor, coherence arguments explain *why* methodological constraints exist.

  ### Final Check for Understanding (The "Exit Ticket")

  To ensure they grasp **Structural vs. Dynamic Coherence**:

  *   **Question:** "If the researcher plans at $t_1$ to choose $A$ at $t_2$, but at $t_2$ she chooses $B$, is she necessarily incoherent?"
  *   **Correct Answer:** "Only if her preferences over $A$ and $B$ haven't changed due to new information or legitimate state changes. If she simply changes her mind without new information, she is dynamically incoherent (pumpable)."
  *   **Why this works:** It forces them to distinguish between *updating* (rational) and *reversing* (incoherent).

  This plan keeps the math low, the philosophy high, and the connection to their seminar topic (scientific rationality) explicit without letting the application dominate the theoretical foundation.
