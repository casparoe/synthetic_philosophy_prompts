answer: |-
  This is a brilliant topic for sixth-formers, but you are right to be wary of the time limit. Forty minutes is a sprint, not a marathon. If you try to prove the theorem, you will lose them. If you focus on the *story* of the money, you will keep them.

  Here is a blueprint for structuring the session, keeping the maths grounded and the spelling strictly British.

  ### 1. The Toy Game: Is it enough?
  Yes, your coin toss game is the gold standard for this. It is sufficiently simple to calculate on a whiteboard but complex enough to show the paradox. However, to make it carry the weight of the session, you need to tweak how you present the outcome.

  **What behaviour to make vivid:**
  You need to make the *path dependence* visceral. A-level students are used to expected value (EV) being a static number. You need to show them that in multiplicative processes, the *order* doesn't matter, but the *volatility* does.
  *   **The visual:** Draw two trajectories on the board. One for the "EV Maximizer" (bets 100% every time) and one for the "Kelly Bettor" (bets 20%).
  *   **The punchline:** After 10 rounds, the EV Maximizer has a higher *average* wealth across all possible universes, but in almost every single actual timeline, they have gone bust. The Kelly bettor has less "average" wealth but is rich in nearly every timeline.

  **Wrinkles to strip out:**
  *   **Bankruptcy limits:** Don't worry about what happens if they hit £0.01. Just say "ruin".
  *   **Integer constraints:** Assume money is infinitely divisible. Don't let them get stuck on whether they can bet £10.53.
  *   **Utility functions:** Do not mention diminishing marginal utility of money. That confuses the issue. This is about maths, not psychology.

  ### 2. The Build-up: Structuring the 40 Minutes
  You need to bed in the intuition of compounding before you mention growth rates. Here is a suggested run-of-play:

  **0–5 mins: The Hook (The EV Trap)**
  *   Set up the game: £100, 60% heads, even money.
  *   Ask: "How much do you bet to maximise your expected profit after *one* toss?"
  *   They will say "All of it". They are right. $EV = 0.6(2x) + 0.4(0) = 1.2x$.
  *   Ask: "What if you play 100 times?" Most will still say "All of it" initially.
  *   **Nip the bud:** Immediately show that betting 100% leads to ruin. If you lose once, you are out. The probability of surviving 100 rounds is $0.6^{100}$, which is effectively zero.

  **5–15 mins: The Geometry of Compounding**
  *   This is the crucial A-level link. Move from arithmetic to geometric.
  *   Walk through two rounds: Win then Lose vs. Lose then Win.
  *   Show that £100 $\times$ 2 $\times$ 0 = £0.
  *   Show that betting half (£50): £100 $\rightarrow$ £150 $\rightarrow$ £75. You lost money despite a 50/50 split of wins/losses (which is close to the 60/40 expectation).
  *   **Key Intuition:** Losses hurt more than gains help. To recover from a 50% loss, you need a 100% gain. This is the "volatility drag".
  *   Introduce the Geometric Mean. The long-term growth rate is determined by the product of returns, not the sum.

  **15–30 mins: Finding the Sweet Spot (Kelly)**
  *   Ask: "If 'All In' is suicide, and £0 is boring, where is the peak?"
  *   You don't need full calculus. You can sketch the curve of Growth Rate vs. Bet Fraction.
  *   Show that at 0% bet, growth is 0. At 100% bet, growth is negative (ruin). Somewhere in between is the maximum.
  *   Reveal the Kelly fraction: $f^* = p - q$. Here, $0.6 - 0.4 = 0.2$. Bet 20%.
  *   Explain *why*: This fraction balances the drift (the edge) against the volatility (the risk of ruin).

  **30–35 mins: The Deep Idea (Ergodicity)**
  *   This is where you elevate it from gambling to "Geometric Rationality".
  *   Explain the difference between the **Ensemble Average** (1,000 people bet once) and the **Time Average** (1 person bets 1,000 times).
  *   EV maximisation optimises for the Ensemble. Kelly optimises for the Time.
  *   In the real world, we live in time, not in parallel universes. Therefore, we should maximise the time average.

  **35–40 mins: Q&A and Wrap-up**
  *   Briefly mention this applies to investing (portfolio theory), not just coins.

  ### 3. Misconceptions to Expect and Nip in the Bud

  **Misconception 1: "Kelly is just risk aversion."**
  *   **When:** When you reveal the 20% bet.
  *   **The Fix:** Be explicit. "This isn't about being scared. It isn't about utility. If you bet more than Kelly, your long-term growth rate *decreases*. Over-betting is mathematically suboptimal, not just psychologically uncomfortable. It makes you poorer."

  **Misconception 2: "Expected Value is useless."**
  *   **When:** During the first 5 minutes.
  *   **The Fix:** Don't trash EV. Clarify its domain. "EV is perfect for additive games (like a salary) or one-off bets. It breaks for multiplicative repeated games. Know which game you are in."

  **Misconception 3: "Kelly guarantees winning."**
  *   **When:** Q&A.
  *   **The Fix:** "Kelly maximises the *rate* of growth. You can still have a losing streak. It just ensures you survive the streak to catch the upswing."

  ### 4. What to Deliberately Skip (and Own It)
  To fit this in 40 minutes, you must leave things on the cutting room floor. Tell them you are doing this so they don't think they've missed something.
  *   **The Rigorous Proof:** Do not derive the maximisation of $E[\ln(1+fr)]$ using derivatives unless they are very advanced. Just state that we maximise the log of wealth. Say: "The calculus to find the exact peak is A-level friendly, but for time's sake, I'll show you the result."
  *   **Continuous Time:** Keep it to discrete rounds. No Brownian motion.
  *   **Fractional Kelly:** Don't discuss betting half-Kelly to reduce variance. Stick to the theoretical optimum.
  *   **Utility Theory:** As mentioned, skip Bernoulli and St Petersburg paradox history. It's fascinating but distracts from the ergodicity point.

  ### 5. Checking Understanding: The "On the Day" Test
  You need a quick litmus test to see if the Time vs. Ensemble average concept has landed. Do not ask "Do you understand?". Ask them to vote on a scenario.

  **The Check:**
  Put this up on the board/screen near the end:

  > *Investor A and Investor B both face the same coin toss (60% win, double money; 40% lose, lose stake).*
  > *Investor A bets 100% of their wealth every time.*
  > *Investor B bets 20% of their wealth every time.*
  >
  > *After 1,000 rounds:*
  > *1. Investor A has a higher average wealth across all possible outcomes.*
  > *2. Investor B has a higher average wealth across all possible outcomes.*
  > *3. They have the same average wealth.*

  **The Answer:**
  Technically, **1 is true** (because of the tiny fraction of universes where A wins every time and becomes a god), but **B is the one who is rich in almost every realistic timeline.**

  However, a better check for *ergodicity* specifically is this question:

  > *Imagine 100 people play this game once. We average their wealth.*
  > *Imagine 1 person plays this game 100 times. We average their wealth over time.*
  > *Are these two averages the same?*

  **The Correct Answer:** No.
  **The Follow-up:** "Which one matters for your retirement?" (The time average).

  If they grasp that the "average person" is not the same as the "person over time", you have succeeded.

  ### A Note on Delivery
  Since you are writing for a living, use your narrative skills. Treat the £100 as a character. When the "EV Maximizer" bets it all, treat it like a thriller hero running into a burning building—brave, but likely not coming back. When the "Kelly Bettor" stakes 20%, treat it like a tortoise.

  Ensure your spellings are consistent for your editor:
  *   **Maths** (not Math)
  *   **Maximise** (not Maximize)
  *   **Modelling** (double 'l')
  *   **Behaviour** (with 'u')
  *   **Centre** (not Center)
  *   **Programme** (if referring to a schedule, though 'session' is safer)

  Good luck. It is a counter-intuitive topic, but if you anchor it in the "volatility drag" intuition, sixth-formers usually find it clicks quite satisfyingly.
