answer: |-
  1.  **The "Draft vs. Mature Work" Trap**
      "Look, Lena, I know you're going to hate this because it's the orthodox critique, but I have to ask: A lot of hardline Marxists treat the *Grundrisse* like Marx's messy workout logs compared to the polished lift of *Capital*. They say the Fragment is just an unfinished draft where he was still figuring things out. Why should we build a whole theory of cognitive capitalism on notes he never intended to publish instead of the finished system?"

  2.  **Follow-up: The Continuity Claim**
      *(Ask this if she doubles down on the notebooks showing continuity with later volumes)*
      "Okay, I hear you on the continuity. But if this mechanism of cognitive capture is so central, where do we actually see it operating in Volume 1 of *Capital*? Because if you can't point to the specific mechanism in the mature text, it feels like you're building a castle on a sketch. Is the 'general intellect' hiding in plain sight in *Capital*, or did Marx actually walk that back?"

  3.  **The Labor-Time Measurement Problem**
      "Here's where my brain gets stuck: Marx still anchors value in socially necessary labor time. But if cognition is now the direct productive force, how do you clock that? You can't put a timecard on a thought or an insight. If the value comes from the general intellect rather than the hours I sit at a desk, doesn't that break the meter Marx used to measure exploitation?"

  4.  **Follow-up: The Value Theory Breakdown**
      *(Ask this if she pivots to saying immaterial labor is unmeasurable or qualitative)*
      "If you pivot to saying it's unmeasurable or qualitative, aren't you basically admitting the labor theory of value breaks down here? And if value isn't based on time anymore, what's holding the whole critique of capitalism together? Are we still talking about Marx, or have we moved into something post-Marxist without saying it?"

  5.  **Inevitability vs. Contingency of Tech**
      "I want to talk about the tech itself. Is this capture of the general intellect inevitable? Or is it contingent on how we designed the machines? Could the technology have developed in a way that kept the general intellect outside of capital, or was it always going to get sucked into fixed capital once it became productive?"

  6.  **The Rust Belt Connection**
      "I'm writing a novel about deindustrialized factory towns, places where the physical machines went silent. Under your framework, does the 'factory' actually leave town, or does it just change shape? Are the people left behind in those towns excluded from this cognitive capitalism, or are they still part of the machine in some invisible way?"

  7.  **The AI Writer Scenario (Setup)**
      "Let's get niche for a second and talk about my world. Say I'm a novelist using AI writing tools. In your framework, the general intellect is literally the commodity being sold by the AI company, but I'm wielding it to make my book. I'm feeding the machine my prompts, and it's feeding me back captured cognition."

  8.  **The AI Writer Scenario (Class Position)**
      "So here's the rub: Does that make me a capitalist owning my means of production because I'm leveraging the AI, or does it make me a proletarian because I'm still just feeding data into a system I don't own? Where does the worker end and the owner begin when the tool is thinking?"

  9.  **The Political Horizon**
      "Last one. If you're right, and our very cognition is the thing being captured by fixed capital, what does resistance look like? You can't exactly strike against your own brain. If the general intellect is the engine of value, how do we reclaim it without smashing the machines that run our lives?"
