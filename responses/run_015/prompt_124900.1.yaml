prompt: |-
  Hey — I run a small reading group and next week we're doing Molyneux's problem, you know the one: the question Molyneux put to Locke about whether someone blind from birth who suddenly gains sight could tell a cube from a sphere by sight alone, without getting to touch them. We always end up going in circles because everyone uses the same words to mean different things, so this time I want to sort people *before* we start arguing.

  What I'd like from you: a "which Molyneux position do you actually hold?" decision tree / quiz for the group. Some constraints:

  - Build it from the logical space first: pick the diagnostic questions (say 5-7), say which combinations of answers are actually available, and only then drop the named positions into the cells. Don't start from a list of -isms and work backwards.
  - Every question has to be a concrete case someone can answer without already knowing the labels. No "do you think spatial concepts are amodal?" — give me the scenario and ask what happens.
  - Please don't spend words on who historically said what or on citations; we've all read the encyclopedia summary, that's not the part we're stuck on.

  Cases I definitely want in there (add your own, or swap if you've got a better one):

  1. The cube/sphere case, but split into two separate questions: (a) can he tell them apart, i.e. reach for the one he was just handed or pick it out from the other one, and (b) can he name it or say "that's the cube" without touching. I think people who say yes to (a) and no to (b) are in a genuinely different place from people who say yes to both, and I want the tree to catch that rather than averaging them.
  2. A non-vision version. Options I've been playing with: a kid deaf from birth who gets a cochlear implant — does she recognise by hearing the thing she's been shown? Someone who has never smelled anything and suddenly can — does the smell of a lemon tell them it's a lemon? Or someone who navigates by clicks/echolocation and then gains sight: is that really touch-to-vision, or is it a third thing? Pick whichever one or two do the most diagnostic work and say why you picked them.
  3. Same subject tested in the first minute after the bandages come off vs. tested after a week of bumping into things and being corrected. Does time-and-feedback change your answer, and does *how* it changes it sort people?
  4. Something non-human or artificial, because I've got an ML person coming: say a model (or a robot) trained separately on camera images and on a completely different sensor — depth/lidar, or a tactile glove — with no pairing between the two streams, and then given both at once. Would it match them up? Does your answer to the human case carry over? And if the ML person says "that's just a question about whether the two representation spaces are approximately linearly alignable," where does that put them — a new leaf, or a disguised version of an old one?

  Leaves I want the thing to be able to land on: the plain "no"; the plain "yes"; the "yes to matching, no to naming" middle; the "this is a purely empirical question and the real evidence is mixed" position; the "the question is confused, there's no single thing being asked" position; and the "transfer happens but only because the subject quickly learns new sensorimotor contingencies" position. Plus whatever else the logical space forces on you.

  And:
  - Flag any pair of leaves your tree genuinely can't pull apart instead of pretending some question separates them.
  - For the empty cells in the space, say whether nobody is there because the combination is incoherent, unattractive, or just unoccupied — one line each is fine.
  - Give me a scoring key, 8 questions max, two or three answer options each, plus a note on what to do with someone whose answers don't fit any clean pattern.
  - The group is: me (I'm yes-ish on matching and no on naming, and I think most of the disagreement is about what "recognise" is doing in the question), one person who's an empiricist about concepts, one embodied/enactive cognition person, one nativist-ish modularity person, and the ML person. Feel free to tell me where I'd land and whether my own combination is unstable — I suspect it might be.

  Format it as something I can print: questions first, key and notes at the bottom.
