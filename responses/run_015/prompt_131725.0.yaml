prompt: |-
  I need some advice on something and I can't tell weather I'm overthinking it.

  A few months ago a guy I found on a local Facebook group spent most of a week fixing the drainage under my house. I told him to just send me the bill when he was done. He never did — lost my details, I think — and it took me ages to track him down again. The works long finished, there was nothing in writing, and it'd probably cost him more to chase me than he'd get back. It's a couple of thousand pounds, which I'd definately feel but can afford.

  The part I keep going back on: I'm moving into a care place next month and I will never hire anyone again. I've got no family who'd think better or worse of me either way. So as far as I can see there is not one single thing in it for me if I pay — not the money's worth, not a good name, not even a story about myself I'd get to enjoy later, since I won't be making any more decisions of this kind. My brother says paying is what a sucker does, and he's half joking but not really.

  And still I want to pay, and I notice I'd think less of myself if I didn't — which is the bit I can't cash out, because I can't see what that feeling is *for* anymore. Is it just leftover habit, or is it picking up on something I'm not seeing? And should it change anything that this is genuinely the last time it will ever come up?
