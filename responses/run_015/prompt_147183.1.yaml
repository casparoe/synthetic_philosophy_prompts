          *   *Result:* SSA strongly favours Theory A (the smaller universe). This is the "Presumptuous Philosopher" conclusion—rejecting well-supported physics because the universe is "too big."
      *   *SIA (Self-Indication Assumption):* "I should reason as if I am a random sample from the set of all *possible* observers." (Or: Given that I exist, I should favour hypotheses that predict more observers, because my existence is more likely in those hypotheses).
