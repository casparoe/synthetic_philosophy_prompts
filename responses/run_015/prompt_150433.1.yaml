      *   *Hacking's Core Idea:* Classifying humans isn't like classifying rocks. Once people know they are classified, they react. This reaction changes the classification's extension and intension over time.
      *   *Taxonomic Looping:* Focus on phenomenology. Does knowing the label change how the patient feels or reports symptoms? (e.g., "I have ADHD, so I interpret my forgetfulness as symptomatic.")
      *   *Institutional Looping:* Focus on consequences. Does the label unlock benefits/stigma that change the population statistics? (e.g., "I need this diagnosis to get disability benefits," or "This diagnosis makes me unhireable.")
