answer: |-
  # Audit Procedure for Diagnostic Revision: Looping Effect Risk Assessment

  **Purpose:** To evaluate proposed psychiatric classification revisions for the risk of inducing harmful looping effects.
  **Operational Constraint:** Must be executable within six weeks by clinicians and epidemiologists without philosophical specialization.
  **Core Concept:** Classifying human beings differs from classifying natural kinds. When a classification is applied to people, it alters their self-understanding and behavior. This alteration feeds back into the classification, changing its meaning and prevalence over time. This audit isolates two distinct mechanisms of this feedback:
  1.  **Taxonomic Looping:** The label changes the patient's phenomenology, symptom reporting, or self-conception.
  2.  **Institutional Looping:** The label changes the patient's access to resources, legal status, or social standing, which alters prevalence data independently of underlying pathology.

  ---

  ## Part I: The Audit Procedure

  ### Step 1: Taxonomic Vulnerability Assessment
  **Question:** Is the proposed revision likely to alter how individuals perceive, experience, or report their own mental states solely due to the availability of the label?

  **Required Evidence:**
  *   Review of patient advocacy materials, social media discourse, or qualitative data regarding the proposed label.
  *   Clinician consensus on the "suggestibility" of the target population (e.g., adolescents vs. elderly).
  *   Historical precedent of similar labels shifting symptom presentation.

  **Stop Rules:**
  *   **PROCEED:** Evidence suggests the label describes stable traits unlikely to be influenced by awareness (e.g., severe cognitive deficits).
  *   **HALT:** Evidence suggests the label creates a "script" for behavior that did not previously exist, or significantly amplifies mild distress into pathology (High Taxonomic Risk).
  *   **JUDGMENT:** Evidence is mixed or suggests moderate amplification of existing traits. Move to Step 2.

  ### Step 2: Institutional Consequence Assessment
  **Question:** Does the proposed revision alter eligibility for benefits, legal protections, insurance coverage, or social stigma in a way that incentivizes diagnosis or alters population statistics?

  **Required Evidence:**
  *   Mapping of the proposed criteria against current insurance reimbursement codes.
  *   Analysis of legal definitions (e.g., disability acts, criminal responsibility) that might incorporate the new category.
  *   Epidemiological modeling of prevalence shifts driven by access incentives rather than biological incidence.

  **Stop Rules:**
  *   **PROCEED:** No significant change in resource allocation or legal status is anticipated.
  *   **HALT:** The revision creates a high-value incentive (e.g., new disability eligibility) for a category with low diagnostic reliability, creating a high risk of artificial prevalence inflation (High Institutional Risk).
  *   **JUDGMENT:** The revision improves access to necessary care for an underserved population, but carries a risk of moderate prevalence inflation. Move to Step 3.

  ### Step 3: Divergence and Resolution Rule
  **Context:** This step applies when Step 1 and Step 2 yield conflicting risk/benefit profiles (e.g., High Taxonomic Risk but High Institutional Benefit, or vice versa).

  **Decision Matrix:**
  1.  **If Taxonomic Risk is HIGH and Institutional Benefit is LOW:** **HALT.** The risk of creating iatrogenic illness outweighs system convenience.
  2.  **If Taxonomic Risk is LOW and Institutional Benefit is HIGH:** **PROCEED.** The classification improves welfare without distorting phenomenology.
  3.  **If Taxonomic Risk is HIGH and Institutional Benefit is HIGH:** **HAND TO HUMAN JUDGMENT.**
      *   *Rationale:* This is a value conflict between diagnostic validity (truth) and public health utility (access).
      *   *Requirement:* Joint sign-off required. Clinicians must justify the clinical necessity; Epidemiologists must quantify the expected prevalence distortion.
      *   *Condition:* Approval is contingent on a binding Post-Implementation Monitoring Plan (see Step 4).
  4.  **If Taxonomic Risk is MODERATE and Institutional Risk is HIGH:** **HALT.** Systemic incentives that distort data integrity are unacceptable for a scientific classification.

  ### Step 4: Monitoring Feasibility Check
  **Question:** If the revision proceeds despite identified looping risks, can the working group mandate a mechanism to track the loop?

  **Required Evidence:**
  *   Commitment of funding for a 5-year prevalence review.
  *   Ability to distinguish between "true" incidence and "diagnostic" incidence in data collection.

  **Stop Rules:**
  *   **PROCEED:** Monitoring is funded and methodologically sound.
  *   **HALT:** Monitoring cannot be guaranteed. If looping effects are predicted but cannot be measured, the revision introduces unquantifiable noise into the scientific record.

  ---

  ## Part II: Application to Concrete Proposals

  ### Case A: Broadening Age-Range Criteria for Neurodevelopmental Disorder (e.g., ADHD) to Adults
  *Proposal:* Extend diagnostic criteria currently restricted to onset before age 12 to allow onset identification up to age 25, facilitating adult diagnosis.

  **Step 1: Taxonomic Vulnerability Assessment**
  *   **Analysis:** Adults seeking diagnosis are highly aware of the label. Self-reporting is the primary diagnostic tool for adult presentation. There is a risk that normal adult forgetfulness or stress is re-categorized as neurodevelopmental pathology due to label availability.
  *   **Finding:** **Moderate Taxonomic Risk.** (Evidence shows adult self-referral is driven by media trends).
  *   **Status:** Move to Step 2.

  **Step 2: Institutional Consequence Assessment**
  *   **Analysis:** Adult diagnosis unlocks access to stimulants, workplace accommodations, and disability support. There is a strong institutional incentive to qualify.
  *   **Finding:** **High Institutional Benefit** (Access to care for suffering adults) but **High Institutional Risk** (Incentive for malingering or over-diagnosis for accommodations).
  *   **Status:** Move to Step 3.

  **Step 3: Divergence and Resolution Rule**
  *   **Conflict:** High Institutional Benefit vs. Moderate/High Taxonomic Risk.
  *   **Application of Matrix:** This falls under "Taxonomic Risk is HIGH/Moderate and Institutional Benefit is HIGH."
  *   **Outcome:** **HAND TO HUMAN JUDGMENT.**
  *   **Condition:** Requires binding Post-Implementation Monitoring.

  **Step 4: Monitoring Feasibility Check**
  *   **Analysis:** Epidemiologists confirm that registry data can track adult-onset vs. childhood-onset retroactively. Funding is available for a 5-year review.
  *   **Final Recommendation:** **PROCEED WITH CONDITIONS.** (Joint sign-off required; monitoring mandate attached).

  ***

  ### Case B: New Subthreshold Anxiety Category for Primary-Care Screening
  *Proposal:* Introduce "Mild Anxiety Disorder" to capture patients who do not meet full criteria for Generalized Anxiety Disorder but report distress, intended to trigger early intervention in primary care.

  **Step 1: Taxonomic Vulnerability Assessment**
  *   **Analysis:** Labeling normal worry as a "disorder" (even "mild") fundamentally alters self-understanding. Patients may begin to monitor normal physiological arousal as pathological. The label provides a script for interpreting life stress as medical illness.
  *   **Finding:** **High Taxonomic Risk.** (Evidence from medicalization literature suggests screening labels increase symptom reporting independent of pathology).
  *   **Status:** **Potential HALT.** (Proceed to Step 2 to check for overriding benefit).

  **Step 2: Institutional Consequence Assessment**
  *   **Analysis:** Primary care providers want a code to justify counseling referrals. However, insurance reimbursement for "subthreshold" conditions is often limited. Stigma may increase without corresponding resource gain.
  *   **Finding:** **Moderate Institutional Benefit** (Justifies referral) but **Low Institutional Benefit** (No guaranteed extra funding). **High Institutional Risk** (Prevalence inflation without resource backing).
  *   **Status:** Move to Step 3.

  **Step 3: Divergence and Resolution Rule**
  *   **Conflict:** High Taxonomic Risk vs. Low/Moderate Institutional Benefit.
  *   **Application of Matrix:** "If Taxonomic Risk is HIGH and Institutional Benefit is LOW: HALT."
  *   **Outcome:** **HALT.**
  *   **Rationale:** The revision addresses a documented clinical gap (early intervention), but the loop contamination is unquantifiable and the institutional incentives do not outweigh the risk of creating a new class of "worried well" patients.

  **Step 4: Monitoring Feasibility Check**
  *   **Analysis:** Not reached due to Halt recommendation. However, note that tracking "subthreshold" progression is methodologically difficult, making future monitoring unreliable.

  ***

  ## Part III: Analysis of Resistance and Limitations

  ### The Resistance Case: Case B (Subthreshold Anxiety)
  The procedure recommends **HALT** for Case B. This is the outcome the working group is likely to resist.
  *   **Clinician Objection:** Clinicians encounter distressed patients daily who fall just short of current criteria. They view the revision as a tool to help vulnerable people access care earlier. A "Halt" recommendation feels like abandoning patients to suffering because of a theoretical philosophical risk.
  *   **Epidemiologist Objection:** While epidemiologists may agree with the Halt, they may fear that without a code, these cases will be misclassified as depression or somatic disorders anyway, corrupting data regardless.
  *   **Procedure Justification:** The procedure prioritizes the integrity of the classification system over immediate clinical convenience. It asserts that if a label creates more illness than it identifies (via Taxonomic Looping) and does not secure resources (Institutional Looping), it is net harmful. The "unquantifiable loop contamination" is treated as a safety hazard equivalent to a drug with unknown side effects.

  ### Statement of Limitations
  This procedure is a risk-management tool, not a comprehensive ethical framework. Users must acknowledge the following constraints:

  1.  **Undetectable Loops:** The procedure relies on available evidence and expert consensus. It cannot detect "silent loops" where the classification changes behavior in ways that are not immediately observable or reported (e.g., subtle shifts in life choices rather than symptom reporting).
  2.  **No Ethical Substitution:** The procedure identifies *risk*, not *wrongness*. A revision might pass all tests (Low Loop Risk) but still be ethically problematic (e.g., pathologizing political dissent). Conversely, a revision might fail (High Loop Risk) but be ethically necessary to prevent immediate harm. The procedure does not resolve this tension; it only flags the risk.
  3.  **Sign-Off Conflicts:** The procedure cannot force joint sign-off. If Clinicians vote "Proceed" (prioritizing care access) and Epidemiologists vote "Halt" (prioritizing data integrity) in a "Human Judgment" scenario, this tool offers no tie-breaking mechanism. It merely clarifies the source of the disagreement.
  4.  **Temporal Blindness:** The six-week deadline restricts analysis to short-term looping. Some looping effects take generations to manifest (e.g., changes in parenting styles due to child diagnoses). This procedure assesses immediate to medium-term risk only.

  **Final Operational Directive:** If the procedure yields a **HALT** recommendation, the proposal may only be revived if new evidence regarding loop magnitude is generated or if the classification is restructured to decouple the label from the identified looping mechanism (e.g., changing the name, restricting access criteria).
