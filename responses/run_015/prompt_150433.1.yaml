      *Okay, let's finalize the Divergence Rule:* If Taxonomic and Institutional assessments conflict (e.g., one signals high risk, the other high benefit), the procedure defaults to the **Precautionary Principle**: Halt revision until a post-implementation monitoring plan is funded and binding. If monitoring is not guaranteed, Halt. This creates friction because monitoring is rarely guaranteed.

