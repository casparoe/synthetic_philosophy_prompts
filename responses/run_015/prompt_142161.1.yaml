      *This keeps the "Experience" constant (in the moment) but varies the "Life Story" impact.*
      *Does aggregation feel worse in Case 2?*
      *Maybe. "Sacrifice 1 person to torture, to save 2,000 people from a pain they won't remember."*
      *This feels closer to Dust Specks.*
      *And it avoids the Hedonist objection (Pain *was* felt).*
      *This is better.*
      *Variable:* **Continuity of Consciousness (Memory).**
      *Scenario 1:* 2,000 commuters suffer 1 hour of severe panic/sickness. They remember it, complain, claim trauma.
      *Scenario 2:* 2,000 commuters suffer 1 hour of severe panic/sickness. A gas leak causes temporary retrograde amnesia for that hour. They feel it *then*, but later have no memory of it. They are told "You suffered."
      *Total "Pain-Minutes" identical.*
      *Verdict:* Case 1 -> Save the 2,000. Case 2 -> Save the 1 (maybe).
      *Why?* Because in Case 2, the harm doesn't "live on" in the victim's narrative. It's more like the Dust Speck (no lasting trace).
      *This isolates **Narrative Integration / Memory**.*
      *And it keeps Welfare constant (Pain was felt).*
      *This is stronger.*

      *Wait, is "Amnesia" realistic for a hospital/transport admin?*
      *Maybe "Sedation".*
      *Case 2:* Commuters are sedated during the accident. They undergo the physiological stress of the crash (welfare loss) but feel no pain and remember nothing.
      *But then it's not "Pain-Minutes". It's "Physiological Stress".*
      *Back to the Hedonist trap.*
      *If they feel no pain, where is the harm?*
      *Okay, I must stick to **Noticeability** and accept the Hedonist limitation, OR find a variable that Hedonists accept.*
      *Hedonists accept **Duration**.*
      *Case 1:* 2,000 people feel 1 minute of pain.
      *Case 2:* 1 person feels 2,000 minutes of pain. (This is the original case).*
      *I need to vary something else.*
      *How about **Agency**?*
      *Case 1:* The 2,000 harms are side effects of saving the 1.
      *Case 2:* The 2,000 harms are the *means* to save the 1.
      *No, that's Doctrine of Double Effect.*
      *Let's go with **Noticeability** but frame the welfare loss objectively (Health).*
      *I will explicitly address the Hedonist objection in the "Weakest Joint" section.*

      *Final Decision:*
      *Variable:* **Phenomenological Salience (Noticeability).**
      *Cases:* Transport Safety.
      *Case 1 (Salient):* 1 Crush Injury vs 2,000 Motion Sickness (Felt).
      *Case 2 (Insalient):* 1 Crush Injury vs 2,000 Cellular Damage (Unfelt, but health-equivalent).
      *Both groups informed afterwards (Controls for Complainability).*
      *Numbers < 2,000.*
      *Totals matched by stipulation of Health Units.*

      *Wait, I need to make sure the "Small Harm" in Case 2 is not just "Risk".*
      *It must be *actual* damage.*
      *Radiation exposure is actual damage.*
