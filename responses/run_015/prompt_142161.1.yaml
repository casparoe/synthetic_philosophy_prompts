      *Let's write.*
answer: |-
  **Scenario 1 (Salient Harms)**
  A city transport administrator must allocate a limited safety budget. Option A reinforces a bridge railing, guaranteeing the prevention of one catastrophic fall that would leave a single commuter with permanent, severe neuropathic pain. Option B installs stabilizers on 2,000 buses, guaranteeing the prevention of severe motion sickness and panic attacks for 2,000 distinct commuters during a specific crash-prone season. The total welfare loss is calibrated: the aggregate duration and intensity of the 2,000 episodes of sickness and panic equals the lifetime welfare loss of the single neuropathic pain victim. All 2,000 commuters are informed of the risk and the harm; if Option B is not chosen, they will feel the sickness, know what caused it, and have grounds to complain.

  **Scenario 2 (Insalient Harms)**
  The same administrator faces the same budget and the same Option A (preventing one permanent neuropathic pain victim). Option C, however, installs air filtration that prevents 2,000 commuters from inhaling a specific odorless particulate. This particulate causes no immediate symptoms, no pain, and no perceptible change in daily function, but medical measurement confirms it causes cellular degradation exactly equivalent in total welfare units (e.g., QALYs) to the motion sickness in Scenario 1. All 2,000 commuters are informed of the exposure and the statistical health loss; if Option C is not chosen, they will suffer the degradation, know the fact of it, and have grounds to complain, despite never feeling it.

  ***

  **Analytic Work**

  **The Varied Variable:**
  The single structural variable varied between the two scenarios is **Phenomenological Salience** (whether the harm enters conscious experience). All other candidate explanations for the "Dust Specks" intuition are held constant: the number of sufferers is identical (2,000); the harms are dispersed across distinct persons in both cases; the total aggregative loss is stipulated to be equal; and crucially, the **absence of a complainant** is ruled out, as victims in both scenarios are informed of the harm and possess a grievance.

  **Evaluation of Candidate Explanations:**
  1.  **Number of Sufferers:** Ruled out. Both cases involve 2,000 people, well below the "astronomical" threshold often used to dismiss aggregation. If numbers were the driver, verdicts should match.
  2.  **Dispersal Across Persons:** Ruled out. In both cases, the small harms are spread across 2,000 distinct individuals rather than concentrated on one.
  3.  **Absence of Complainability:** Ruled out. By stipulating that victims are informed of the cellular degradation in Scenario 2, we ensure they can complain about the welfare loss even if they cannot feel it. If the "right to complain" were the decisive factor, Scenario 2 should align with Scenario 1.
  4.  **Triviality of Kind:** Partially ruled out. Both harms are physical health setbacks. However, this variable survives as a potential confounder if one argues that "cellular degradation" is a different *kind* of good than "freedom from nausea."
  5.  **Phenomenological Salience:** This is the surviving candidate. The intuition likely shifts because Scenario 1 involves *suffering* (conscious negative experience), whereas Scenario 2 involves *damage* (objective welfare loss without experience). In Scenario 1, aggregation feels obligatory because we are summing moments of suffering. In Scenario 2, aggregation feels repellent because we are summing statistical deficits that never touch the subjects' conscious lives, mirroring the "Dust Speck" intuition despite the presence of complainants and matched totals.

  **The Lexical-Threshold Reply:**
  A lexical-threshold theorist will object that the "total expected loss" is not truly equal. They will argue that welfare is constituted by conscious experience (Hedonism) or that harms below the threshold of noticeability do not count as moral setbacks, regardless of QALY calculations. On this view, the 2,000 instances of cellular degradation in Scenario 2 sum to zero moral weight, making the choice trivial (save the one suffering person).

  **Honest Weakness:**
  This reply exposes the weakest joint in the set: the definition of "welfare." To construct the cases, I relied on an Objective List theory of welfare (where health is a good independent of experience) to stipulate equal totals. A Hedonist must reject the premise that Scenario 2 involves *any* small harm to aggregate, collapsing the comparison. However, paying this price costs the theorist the original "Dust Specks" verdict as well. If imperceptible harms count for nothing, Parfit's dust specks also sum to zero, and the original case dissolves. Thus, the theorist cannot use this objection to save aggregation in Scenario 1 while rejecting it in Scenario 2 without inconsistency. The cases successfully isolate Phenomenological Salience as the driver of the intuition, forcing the theorist to either accept that conscious experience is the only currency of morality (rejecting the original case's force) or admit that the "Dust Speck" intuition relies on the harms being unfelt, not just small.
