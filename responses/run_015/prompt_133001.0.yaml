      *   *Application to Myth:*
          *   "Genome" = Core narrative elements (who, what, where, why, moral meaning).
          *   "Replication" = Retelling (poems, sermons, speeches, textbooks).
          *   "Mutation" = Alterations in facts, emphasis, or moral interpretation to suit current contexts.
          *   "Fitness Landscape" = Political utility, social cohesion, emotional resonance.
          *   "Error Catastrophe" = The myth becomes so contradictory or detached from reality/utility that it loses cohesive power or fragments into incompatible versions.

  3.  **Analyze the Case Studies:**

      *   **Kosovo Myth (1389):**
          *   *Core:* Prince Lazar, choice between earthly/kingdom of heaven, betrayal (Vuk Branković), heroism (Miloš Obilić), martyrdom.
          *   *Replication:* Epic poetry (Gusle), Church liturgy, 19th-century Romantic nationalism, 1989 Milošević speech (Gazimestan), post-Yugoslav variations.
          *   *Status:* Highly conserved. The core "martyrdom/choice" sequence remains intact despite political co-option. It hasn't collapsed; it adapts.
          *   *Verdict:* Not error catastrophe. It's a "quasispecies swarm" centered around a very stable master sequence.

      *   **Dunkirk (1940):**
          *   *Core:* Defeat turned into rescue, "little ships," national unity, prelude to victory.
          *   *Replication:* Newsreels, films (1958, 2017), political rhetoric.
