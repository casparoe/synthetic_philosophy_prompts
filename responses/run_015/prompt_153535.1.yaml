      *(Refining the Causal Efficacy argument):* Vasquez needs to be careful not to rely on "feeling." It needs to be metaphysical. If the future exists, my choice is fixed. Lin needs to say "Fixed doesn't mean uncaused."

      *(Refining the Astronaut "Fragmentation"):* Vasquez should worry that if the block is true, the astronaut's consciousness might be spread out or frame-dependent. Lin should clarify that consciousness is a process along a timelike curve, not a slice.

