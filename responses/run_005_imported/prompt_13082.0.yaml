  Now, Thomson’s lamp forces an "actual infinity" of flips. Aristotle would absolutely reject this as physically incoherent. But I should dig deeper: *why*? His metaphysics ties change to potentiality actualizing. An infinite series of actualized changes would imply nature contains completed infinities—which for him is nonsense. The lamp’s state being undefined post-supertask isn’t even reachable; the problem starts earlier. 

