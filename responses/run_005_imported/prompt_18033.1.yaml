  The request part: Asking for a horse is ∀x (H(x) → satisfies(request, x)), but for white horse, it's ∀x (H(x) ∧ W(x) → satisfies). The sets are different, so the conditions aren't interchangeable. 

  Gongsun Long might be highlighting that terms have different intensions. "Horse" and "white horse" have different meanings, hence not identical. But he conflates intension and extension. 

