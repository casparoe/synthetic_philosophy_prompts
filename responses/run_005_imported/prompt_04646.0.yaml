  So we've been covering Marx in my political philosophy class and it's got me thinking about my friend's job. She does content moderation and data-labeling for an AI company (technically employed through a subcontractor), and gets paid noticeably more than local minimum wage, so she insists she isn't being taken advantage of. But she also admits the work makes her feel wierdly hollow — she stares at thousands of disturbing, disconnected images all day, has no clue what final product any of it feeds into, isn't allowed to chat with coworkers during shifts, and says it feels like work that happens TO her rather then something she's actively doing. Her reasoning is basically "the pay's fair so there's nothing to complain about," but that logic feels off to me somehow. Is she right that everything's fine as long as the pay's fair, or is there something her reasoning is missing?
