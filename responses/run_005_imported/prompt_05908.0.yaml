answer: |-
  Here are 10 substantive interview questions addressing core tensions in Harsanyi's theorems, designed to push beyond surface-level defenses and engage the technical and philosophical depth your guest specializes in. Each includes a follow-up anticipating a deflection toward "ex post fairness" or axiom-restricted scope:

  1.  **The Diamond Objection & Procedural Fairness:** "Harsanyi's Aggregation Theorem implies indifference between any two social lotteries with identical expected utility vectors. Peter Diamond's famous counterexample highlights a case where society prefers a fair coin flip (50% chance A gets a kidney, 50% B gets it) over giving it outright to A, *even though* both options have the same expected utility for each individual. Doesn't this reveal a limitation of the theorem? It seems to exclude procedural fairness or ex ante equality of opportunity as independent values, even when individuals themselves might rationally desire the fairness of the coin flip."  
      *   *(Follow-up if she invokes "ex post"):* "But the individuals *ex ante* prefer the coin flip precisely because it embodies a fair *process*, valuing the chance itself. Doesn't the theorem, by demanding that the social planner's ranking depend *only* on the vector of individual expected utilities, effectively rule out giving independent weight to *how* that utility distribution is achieved? Is this a necessary feature of rationality, or a restriction of the model?"

  2.  **Heterogeneous Priors & Shared Rationality:** "The Aggregation Theorem assumes individuals share the same subjective probabilities over states of the world. In reality, people often have deeply heterogeneous priors – think climate risks or pandemic threats. If individuals disagree fundamentally on the probabilities attached to outcomes, how does the theorem handle aggregation? Doesn't the 'social planner' imposing a single probability measure to calculate expected utilities effectively override individual epistemic judgments, violating the spirit of respecting individual preferences?"  
      *   *(Follow-up if she invokes shared rationality/axioms):* "But if the individuals are fully rational by expected utility axioms yet arrive at different priors based on differing information or interpretations (which the axioms allow), isn't the social planner forced to either impose an arbitrary consensus prior or admit the aggregation fails? Doesn't this make the theorem's applicability to real-world policy disputes, where prior disagreements are central, highly problematic?"

  3.  **The Veil of Ignorance & Rawlsian Challenge:** "You champion Harsanyi's impartial observer as leading inevitably to average utilitarianism. Yet John Rawls, using a remarkably similar 'veil of ignorance' device, argued it leads instead to the maximin rule (Difference Principle). Both claim to model rational choice under deep uncertainty. How do you reconcile these diametrically opposed conclusions from essentially the same starting point? Doesn't this suggest the outcome hinges critically on assumptions *about* rationality under uncertainty that Harsanyi's model builds in but doesn't uniquely justify?"  
      *   *(Follow-up if she invokes EU axioms as defining rationality):* "Rawls explicitly argued that maximizing expected utility under the veil, especially using linear probabilities, is *not* rational when the stakes involve one's entire life prospects and the probabilities are utterly vague. He saw maximin as a rational risk-aversion strategy in that unique context. Is Harsanyi's conclusion then less a discovery of *the* rational choice and more a consequence of *defining* rationality *as* expected utility maximization with linear probabilities? Does this expose a normative choice embedded in the 'rationality' assumption itself?"

  4.  **Utility Scales & Interpersonal Comparisons:** "Harsanyi's theorems require cardinal, interpersonally comparable utilities. The Aggregation Theorem weights them, the Impartial Observer sums them. But the von Neumann-Morgenstern utility functions derived from the axioms are only unique up to affine transformations (scale and zero point). Doesn't this mean the specific weights in aggregation or the validity of summation depend critically on the *normalization* chosen for each individual's utility scale? How can we objectively justify one normalization over another? Isn't this where substantive ethical choices, potentially arbitrary, creep back in?"  
      *   *(Follow-up if she invokes revealed preference/behaviorism):* "But revealed preference through lottery choices only pins down the *shape* of the utility function relative to its own scale and zero point. Choosing a *common* scale and zero point across individuals isn't revealed by behavior; it requires an *external* ethical judgment about how to 'calibrate' different people's welfare scales. Doesn't this undermine the claim that utilitarianism is derived purely from rationality and Pareto conditions?"

  5.  **The 'Ex Ante' Standard & Dynamic Consistency:** "You emphasize that Harsanyi's approach is rigorously 'ex ante': social welfare is defined solely by the expected utilities individuals hold *before* uncertainty resolves. But consider a dynamic choice: Society faces two policies with the same ex ante EU vector today, but Policy A guarantees the final outcome will be Pareto efficient, while Policy B carries a risk of ending up Pareto inefficient (though this risk is priced into the ex ante EU). Wouldn't a rational social planner, caring about actual outcomes, potentially prefer Policy A *because* it avoids future inefficiency, even if ex ante EU is equal? Doesn't pure ex ante welfarism potentially conflict with dynamic consistency or concern for the actual realized distribution?"  
      *   *(Follow-up if she invokes "ex post"):* "Is the concern for avoiding *possible future* inefficiency inherently 'ex post'? Or is it a legitimate ex ante consideration about the *properties* of the lotteries themselves? Doesn't restricting the social planner *only* to the vector of individual ex ante EUs prevent it from considering other ex ante relevant properties, like the risk of catastrophic coordination failures down the line?"

  6.  **The Scope of 'Unanimity' (Pareto):** "The Aggregation Theorem relies heavily on the Pareto principle: if everyone unanimously prefers Lottery X to Lottery Y, society must prefer X. But what about cases involving *very* large numbers or extreme stakes? For example, if a policy gives 99.999% of people a trivial benefit but causes horrific suffering to one randomly selected person, unanimity holds for adopting it (as each individual has a vanishingly small chance of being the victim). Does Harsanyi's theorem force society to accept this policy? If this seems repugnant, does that suggest the Pareto principle needs qualification in large populations or under extreme inequality?"  
      *   *(Follow-up if she invokes EU axioms/weights):* "Couldn't the victim's utility loss be so large that even a tiny probability weights it heavily in their ex ante EU calculation? But doesn't the theorem *still* require aggregating these EUs with positive weights, potentially leading to approval if the sum of tiny benefits for others outweighs the huge *expected* loss concentrated on one? Is the theorem compatible with notions of basic rights or inviolability that might override even unanimous ex ante preferences based on probabilistic calculations?"

  7.  **Risk Attitudes & Social Choice:** "The Impartial Observer argument assumes the observer uses the *same* risk attitude (embodied in the linear treatment of probabilities) as the individuals behind the veil. But what if society, or the impartial observer *as* a social entity, has a different attitude towards risk than the individuals? For example, society might be more risk-averse regarding catastrophic losses affecting many. Does Harsanyi's setup allow for this? Or does it impose the individual-level risk attitude derived from EU axioms onto the social choice?"  
      *   *(Follow-up if she invokes individual rationality defining social):* "If social rationality is defined solely by aggregating individual rational preferences under the veil, doesn't this preclude society from having a distinct collective risk attitude? Is there a coherent way within this framework to say 'society should be more cautious than the sum of its parts' without violating the axioms?"

  8.  **Non-Identity Problems & Future Generations:** "Harsanyi's framework typically assumes a fixed population. How does the Impartial Observer handle choices affecting who *comes into existence* (e.g., climate policy, resource depletion)? The 'veil of ignorance' seems ambiguous: is the observer choosing a social state knowing they have an 'equal chance' of being *anyone who will ever live*, or only *those who exist in a given alternative*? Different interpretations lead to vastly different conclusions (average vs. total utilitarianism, paralysis vs. strong obligations). Does this ambiguity highlight a fundamental limitation in applying the veil concept to intergenerational ethics?"  
      *   *(Follow-up if she invokes a specific interpretation):* "Even if we stipulate an interpretation (e.g., equal chance of being any *possible* person), doesn't this create the 'non-identity problem'? An observer might prefer a world with fewer people living very high average utility over a crowded world with lower average utility, even if those in the crowded world wouldn't exist in the alternative and thus cannot be said to be 'harmed' by being born into it. Does this align with common moral intuitions about obligations to future generations?"

  9.  **Realism vs. Rationalization:** "Critics like Amartya Sen argue Harsanyi's theorems are best seen not as *derivations* of utilitarianism, but as *rationalizations* of a pre-selected ethical view within a specific, narrow framework. The axioms rule out non-utilitarian values (like equity concerns separable from total/average welfare, or procedural fairness) by *fiat*. How do you respond to the charge that the 'rational force' comes less from pure logic and more from defining the problem in a way that only utilitarianism can satisfy?"  
      *   *(Follow-up if she defends axioms as minimal rationality):* "Are the von Neumann-Morgenstern axioms (completeness, transitivity, continuity, independence) truly the *only* conceivable definition of rationality under uncertainty, especially for high-stakes social choices? Doesn't Rawls' maximin, or even rank-dependent utility models, represent coherent (if axiom-violating) alternatives that many find rationally compelling? Doesn't privileging EU axioms represent a substantive normative commitment?"

  10. **The Falsifiability Question:** "Finally, to test the boundaries of your commitment to these results: What specific empirical finding, logical argument, or hypothetical scenario *would* convince you that Harsanyi's Aggregation Theorem and Impartial Observer argument, while mathematically elegant, fail to capture the essential features of rational and ethical social choice? What evidence or reasoning could demonstrate that the 'ex ante Pareto' standard is insufficient or misapplied for grounding utilitarianism?"  
      *(No explicit follow-up needed – let this stand as the closing challenge, forcing reflection on the core claim's vulnerability.)*

  **Key Strengths of this Approach:**

  *   **Targets Core Tensions:** Directly addresses Diamond, Heterogeneous Priors, and Rawls as requested, plus other major critiques (utility scales, scope of Pareto, non-identity).
  *   **Preempts Deflections:** Follow-ups explicitly challenge the "ex post fairness" dismissal and force engagement with the *implications* of the axioms and the "ex ante" standard itself.
  *   **Technical Depth Disguised:** Questions are framed accessibly but hinge on deep technical points (affine transformations, scope of Pareto, interpretation of the veil, properties of lotteries).
  *   **Highlights Normative Choices:** Repeatedly exposes how seemingly technical axioms (shared priors, EU risk attitudes, utility normalization, scope of unanimity) embed substantive ethical commitments.
  *   **Forces Reflection:** The closing question challenges the guest to consider falsifiability, moving beyond restatement.
  *   **EA Relevance:** Touches directly on issues crucial to EA: large numbers, future generations, catastrophic risk, weighting lives – all within the formal framework your guest defends.

  This set should push the conversation beyond slogan-level defenses and into the rich, contested territory where formal ethics meets moral intuition and real-world complexity. Good luck with the interview!
