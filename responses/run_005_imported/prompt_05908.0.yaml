prompt: |-
  I write a science-and-ideas column, and I'm prepping for a taped Q&A that we'll publish as an edited transcript. My guest built her recent academic reputation defending two results by John Harsanyi that tend to get invoked in the same breath: the aggregation theorem, which shows that if both individuals and a "social planner" satisfy the expected-utility axioms and the social ranking respects everyone's unanimous preferences over lotteries, then social welfare must be a positive-weighted sum of individual utilities, and the companion "impartial observer" argument, in which a rational agent behind a veil of ignorance who gives herself an equal chance of being anyone in society ends up maximizing average utility. In her public writing she treats the pair as close to a formal proof that utilitarianism is the rationally forced answer to how we should aggregate welfare, and whenever a critic raises a counterexample, her reflex is to say they've smuggled in an "ex post" notion of fairness the theorem was never designed to honor. I've been reading the primary sources to prepare, since this keeps coming up sideways in effective-altruism debates about weighing lives against other goods, and I don't want the conversation to settle for the popularized "expected utility proves utilitarianism" one-liner.

  Please draft eight to ten interview questions, pitched for curious generalists but carrying real technical weight underneath. I want at least one question built around Peter Diamond's ex ante/ex post objection (the case where a fair coin flip over an indivisible good seems better than any certain assignment, even though the theorem is indifferent between them whenever expected utility comes out the same), one built around what happens to the aggregation once individuals are allowed heterogeneous priors rather than shared beliefs, and one that asks her to reconcile her own veil-of-ignorance intuition with the fact that Rawls used essentially the same device to argue against utilitarianism and for the difference principle. For each of these, add a short follow-up keyed to the deflection she's likely to reach for, so that by the end she can't just keep restating that the objections beg the question against the ex ante standard. Close with one question asking what result or thought experiment would actually change her mind about the theorem's ethical significance. Skip throat-clearing questions like why she finds formal approaches to ethics compelling -- I want the substance.
