answer: |-
  Your objection is **both fair and philosophically potent** — it strikes at a core tension in Rorty’s project. You’ve accurately captured Rorty’s position and anticipated his reply, and your critique survives his response. Here’s a breakdown of why it works and where a Rortian defender might push back:

  ### Strengths of Your Objection
  1. **Targets the Foundational Tension**:  
     Rorty wants to reject objectivity *while* insisting that liberal ironism/solidarity isn't *arbitrary*. Your objection exposes this gap: if all vocabularies are contingent tools, why is "expanding solidarity" normatively superior to "maintaining tribal purity" or even promoting cruelty? Rorty’s appeal to "contingent preference" risks collapsing into "might makes right" or aesthetic whim.

  2. **Correctly Identifies the Circularity in Sentimental Education**:  
     Your diagnosis of the circularity in "Human Rights, Rationality, and Sentimentality" is spot-on. Rorty’s strategy relies on pre-existing liberal sympathies (e.g., susceptibility to sentimental narratives). It *presupposes* the very values it aims to cultivate, making it ineffective against those outside the liberal "conversation" (e.g., fundamentalists, fascists). As you note, this doesn’t *ground* solidarity—it *extends* it locally.

  3. **Survives Rorty’s Reply**:  
     Rorty would likely dismiss your demand for a "principled basis" as a relapse into "objectivity-seeking." He’d insist his project is *pragmatic*: solidarity "works" better for reducing suffering (his contingent priority). But this merely restates the problem: *Why* prioritize suffering reduction? For Rorty, it’s a brute fact of his final vocabulary. Your objection forces him to admit this circularity, undermining his claim to offer a *general* alternative to objectivity.

  ### Where a Rortian Defender Would Attack
  A committed defender would likely challenge your framing by doubling down on Rorty’s anti-foundationalism and historicism:
  1. **"Principled Basis" is the Problem, Not the Solution**:  
     - **Defense**: Rorty *rejects* the very idea of a non-circular, trans-historical "basis." Your demand for one presupposes the "mirroring" model he dismantled. For Rorty, justification is *always* circular and community-relative. The superiority of solidarity isn’t "principled" but *practical*: it coheres with the historical trajectory of liberal societies and their goal of minimizing cruelty.  
     - **Your Counter**: Granting this, Rorty still owes an account of why *his* community’s preferences should hold sway over others (e.g., illiberal ones). His appeal to "reducing suffering" assumes it’s a universal priority, which his contingency thesis undermines.

  2. **Solidarity as a Self-Justifying Project**:  
     - **Defense**: Rorty isn’t trying to "ground" solidarity for all possible agents. He’s addressing *us* (modern liberals), urging us to extend *our* values. The "circle" expands not by logic but by persuasion—and persuasion needn’t be universally compelling. Sentimental education isn’t circular; it’s the *only* tool available post-foundationalism.  
     - **Your Counter**: This reduces Rorty’s project to preaching to the choir. If solidarity can’t rationally or effectively challenge illiberal worldviews (only sentimentally sway those *already* leaning liberal), his "hope" for an *ever-widening* circle seems naively optimistic or ethnocentric.

  3. **The Primacy of Contingency**:  
     - **Defense**: Rorty openly admits his stance is contingent. He’s not offering a knockdown argument but a *redescription* he finds useful. The choice is between redescriptions: "solidarity" vs. "objectivity." He picks solidarity because it fosters hope and reduces suffering—*our* suffering, in *our* historical context.  
     - **Your Counter**: This concedes your point: Rorty has no critique of cruelty *as such*, only a local preference against it. If a fascist finds their redescription "useful," Rorty lacks resources to condemn them except by appealing to *his* tribe’s preferences.

  ### Key Refinements for Your Paper
  1. **Clarify "Principled Basis"**: Explicitly contrast "principled" (objective, trans-contextual) with "pragmatic/contingent" (local, circular) justification. Emphasize that Rorty *rejects* the former but struggles to show how the latter isn’t arbitrary.  
  2. **Address Ethnocentrism**: Engage Rorty’s essay "On Ethnocentrism" (1986), where he admits liberalism is "ethnocentric" but argues it’s the best "we" have. Ask: Can "we" include those who reject *our* "we"?  
  3. **Contrast with Universalists**: Briefly note how critics like Habermas or Nussbaum argue Rorty’s stance undermines human rights universality. Rorty’s response: universality is an aspirational *outcome* of solidarity, not its foundation.  
  4. **Highlight the Tension**: Stress that Rorty’s *rhetoric* often implies broader normative force (e.g., "cruelty is the worst thing") while his *philosophy* undercuts it. This is the core of your objection.

  ### Verdict
  **Your objection is fair and robust**. It exposes a genuine limitation in Rorty: he cannot *justify* solidarity without either smuggling in objectivity or retreating to tribal preference. His appeal to sentiment presupposes a receptive audience, leaving his project unable to confront deeply illiberal worldviews on their own terms. A strong Rortian defense can mitigate but not resolve this tension—which is precisely what makes your critique compelling. Well done!  

  **Next step for your paper**: Flesh out how Rorty’s circularity contrasts with his aspirational universalism (e.g., CIS p. 192: "the moral community is always expandable"). Argue that without *some* normative leverage beyond contingency, this expansion relies on historical luck, not philosophy.
