  Ok so this is going to sound dumb but it's actually holding up a real decision in my fantasy football league. We have a whole written constitution for the league (I know, I know) and someone just noticed that Rule 9 literally says "Rule 9 is null and void." Nobody remembers writing it, we think it was a joke that never got cleaned up. Now half the league wants to invoke Rule 9 to throw out a trade veto from last week, and the other half says Rule 9 obviously doesn't count since it contradicts itself. But that's where I get stuck: if Rule 9 is valid then by its own wording it's void, but if its void then what it says isn't true, so wouldn't that mean it's not actually void after all? I've read it like ten times now and it just loops forever. As commissioner I have to give an actual ruling by tonight, so is there some real way to reason through a rule that cancels itself out like this, or do I just have to arbitrarily pick a side and move on?
