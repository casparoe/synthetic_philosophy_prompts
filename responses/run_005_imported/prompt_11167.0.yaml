prompt: |-
  Working on a piece about how "I know this for certain because I made it myself" arguments hold up over time, and Hobbes is turning out to be my best case study. He got so hooked on Euclid after stumbling on the Pythagorean theorem proof in his 40s (Aubrey's famous story: Hobbes reads the proposition, says "this is impossible!", then works backward step by step until he's convinced) that he decided geometry is the one genuinely certain science -- precisely becuase we ourselves stipulate the definitions and construct the figures -- and he wanted his whole civil science built on that same deductive model. (Also: he spent something like two decades insisting he'd squared the circle and never once backed down against Wallis.)

  Here's what I can't work out: if Hobbes had somehow lived to see (a) non-Euclidean geometry, which showed Euclid's axioms weren't the only consistent option, and (b) Gödel's incompleteness theorems -- would either one actually threaten his specific reason for thinking geometry (and therefore his politics) is certain, or is the "we made it, so we can't be wrong about it" move weirdly insulated from both? Give me a threat score 1-10 for each, plus the reasoning behind it.
reasoning: |-
  Okay, let me tackle this Hobbes thought experiment. The user is writing about "I made it myself" arguments and uses Hobbes as a case study - specifically how his geometric certainty (from Euclid) informed his political philosophy. The core question is whether non-Euclidean geometry or Gödel's theorems would undermine Hobbes' position. 

  First, I need to recall Hobbes' exact epistemic claim. He didn't just admire geometry - he believed its certainty came from humans constructing definitions and proofs through stipulated operations (like compass/straightedge constructions). This constructionist view made him reject algebra as "symbol-weaving" and insist politics could be equally certain if built from defined terms like "contract" or "sovereign".

  Now for the threats:
  - Non-Euclidean geometry: This shows Euclid's axioms aren't necessary truths about space, but Hobbes' certainty came from internal consistency of constructions, not empirical accuracy. If you keep his ruler/compass rules, Euclidean theorems remain certain within that system. Threat level low (3/10) because it attacks empirical necessity, not constructive certainty.
  - Gödel: This is trickier. Incompleteness proves even consistent systems can't prove all truths within themselves. But Hobbes cared about validity ("if axioms, then theorems"), not completeness. His political arguments are more like derivations within a defined system than attempts to capture all political truths. Still, Gödel implies unprovable truths could lurk in his system - a moderate threat (6/10) to his dream of total certainty.

  The user's phrasing suggests they suspect Hobbes' "we made it" argument might be oddly resilient - and they're right. The real vulnerability isn't these mathematical results, but whether his political definitions actually match human reality. (Hobbes would retort that's why we need his Leviathan to make them real...)

  Also noting the Wallis anecdote: Hobbes clinging to circle-squaring shows his blind spot was trusting constructive intuition over formal proof. That actually makes him less vulnerable to non-Euclidean math (which operates formally), but more vulnerable to Gödel-style limitations his intuition couldn't detect.
answer: |-
  Based on Hobbes' specific "we made it, so we can't be wrong" justification for geometric (and thus political) certainty, here's the threat assessment for each development:

  1.  **Non-Euclidean Geometry**
      *   **Threat Score: 3/10 (Low Threat)**
      *   **Reasoning:** Non-Euclidean geometries don't directly attack Hobbes' core claim about *certainty within the constructed system*. Hobbes wasn't primarily claiming that Euclid's geometry was the *only* possible geometry or that it perfectly described physical space (though he likely believed the latter). His key argument was that **because humans stipulate the definitions and permissible constructions (compass and straightedge), the deductions made *within that specific system* are certain.** Non-Euclidean geometries simply show that you can stipulate *different* starting points (axioms) and build *different*, internally consistent systems with different properties. This challenges the *uniqueness* or *universal applicability* of Euclidean geometry, but not the *internal certainty* of deductions made once the definitions and construction rules are accepted. Hobbes could say: "Yes, you can build other castles (geometries) with different bricks and rules. But within *my* castle (Euclidean), built according to *my* specific rules, every room I deduce must exist and be exactly as I describe it. I cannot be wrong *about my own construction*."

  2.  **Gödel's Incompleteness Theorems**
      *   **Threat Score: 8/10 (High Threat)**
      *   **Reasoning:** Gödel strikes directly at the heart of Hobbes' dream of a complete, certain, deductive system built from stipulated axioms. His first incompleteness theorem proves that **any sufficiently powerful formal system (like the arithmetic needed for basic geometry, or Hobbes' intended civil science) capable of expressing its own rules will contain true statements that cannot be proven *within the system itself*.** This fundamentally undermines Hobbes' claim:
          *   **Certainty ≠ Completeness:** While deductions *from* axioms might be valid (true if axioms are true), Gödel shows the system cannot prove *all* truths about itself. There will be "certain" truths (in the sense of being true given the axioms) that the system's own deductive machinery cannot reach. Hobbes' "made it ourselves" guarantee only covers the *validity* of deductions from premises, not the *completeness* or *provability* of all truths.
          *   **"Can't be Wrong" vs. "Can't Prove Everything":** Hobbes believed that by constructing the system meticulously, humans could achieve *total* certainty and avoid error *within* the system. Gödel proves inherent limitations: there will be propositions where the system cannot tell us if they are true or false. This introduces a fundamental, unavoidable uncertainty *within* the formal system itself, regardless of how carefully we stipulate its foundations. For Hobbes, who wanted politics built as deductively as geometry, the realization that even in arithmetic "I made it myself" *doesn't* guarantee I can prove/disprove every conceivable statement about it would be devastating. It shows the deductive model has intrinsic limitations he didn't foresee.
          *   **Relevance to Civil Science:** While Gödel formally applies to systems containing arithmetic, the *conceptual* point is critical for Hobbes' project. If the "certain science" of geometry (upon which he bases his politics) has inherent gaps in what it can prove *even in its purest mathematical form*, the hope of building a completely gap-free, deductively certain science of politics modeled on it becomes mathematically untenable. The "we made it" move insulates against *external* contradiction but not against *internal* limitations of provability.

  **Summary:**

  *   **Non-Euclidean Geometry:** Primarily challenges the *uniqueness* or *empirical universality* of Euclidean geometry, not the *internal deductive certainty* that was Hobbes' core justification. Hobbes' "made it ourselves" argument is largely insulated here. **(Threat: 3/10)**
  *   **Gödel's Incompleteness:** Directly attacks the *completeness* and *provability* within a formal system, revealing an inherent limitation Hobbes didn't anticipate. It shows that even in a system "made by us," there are truths we cannot prove using the system's own rules, fundamentally undermining the possibility of the *total*, gap-free certainty Hobbes sought for both geometry and politics. **(Threat: 8/10)**

  Hobbes might have dismissed Non-Euclidean geometry as "interesting, but irrelevant to *my* constructed system." Gödel, however, would have shattered his foundational belief that a meticulously constructed deductive system, precisely because it is constructed, could provide complete and certain knowledge within its domain. The "we made it" move protects against external contradiction but offers no defense against the internal incompleteness revealed by Gödel.
