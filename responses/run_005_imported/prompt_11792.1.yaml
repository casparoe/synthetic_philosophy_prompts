     "Kavka's toxin puzzle asks you to imagine an eccentric billionaire who will pay you a million dollars tomorrow morning if, by midnight tonight, you form a genuine intention to drink a toxin tomorrow afternoon. The toxin will make you painfully ill for a day but won't kill you or do any lasting damage, and crucially you're paid just for intending to drink it -- verified by a reliable predictor -- not for actually drinking it."

     This is a correct and clear setup. The key elements are present: payment for forming the intention (by midnight) to drink the toxin (which causes temporary illness), and the payment is for the intention, not the action.

