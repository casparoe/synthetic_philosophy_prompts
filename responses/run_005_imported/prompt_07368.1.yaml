prompt: |-
  Ok so last night me and a friend got into a whole argument about acausal threats and this 'surrogate goals' fix people propose against them. You know the setup: an agent can threaten you acausally -- through mutual prediction/simulation rather than any actual causal channel -- and the supposed defense is to make yourself genuinely care about some decoy goal exactly as much as whatever you actually value, so a rational threatener ends up going after the decoy instead of the real thing. My friend swore this actually holds together, but when I pushed on why a threatener would even bother targeting the decoy (since you're refusing to comply either way, real goal or not), or whether the whole scheme just unravels once the threatener's smart enough to notice youre running this trick and threatens to punish you for the surrogate move itself, he kinda just shrugged and changed the subject. Can you actually walk me through the mechanics here? Specifically, why is a threatener supposed to prefer hitting the surrogate over the real target in the first place, and does the strategy survive a threatener who sees the whole setup coming, or does it just push the regress up one level?
