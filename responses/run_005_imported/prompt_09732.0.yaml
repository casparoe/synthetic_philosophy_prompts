  Hmm, the key here is recognizing these aren't contradictory but complementary aspects of his worldview. Von Neumann always thought in layered timeframes. His essay focuses on operational realities - the political and geographical constraints forcing incremental adaptation. The singularity talk was a meta-level observation about long-term mathematical inevitabilities. 

