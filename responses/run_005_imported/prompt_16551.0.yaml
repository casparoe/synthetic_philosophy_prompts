prompt: |-
  I chair our department's colloquium series, and next month's invited speaker is a philosopher whose recent work argues that evidential cooperation in large worlds (ECL) gives us practical reason to act cooperatively toward agents who hold value systems other than our own — even though we cannot causally affect them — provided the universe or multiverse is large enough to contain many other agents reasoning in relevantly similar ways. Pressed on why any of this should matter absent a causal channel, she tends to reply that what needs to correlate across a large world is the decision procedure, not the object-level values, so it does not matter who is actually "out there." Draft eight to ten questions for the Q&A that go beyond having her restate the view: I want at least one question on what actually licenses confidence that our reasoning correlates with these agents rather than the correlation being merely stipulated, one on whether the superrationality machinery is doing any work that a simpler heuristic such as a moral parliament could not do on its own, and one on how, in practice, we are supposed to identify what "cooperating" with agents whose values we cannot observe even amounts to. For each, include a follow-up keyed to the answer she is most likely to give.
reasoning: |-
  Okay, the user chairs a department colloquium and needs help drafting Q&A questions for a philosopher speaking on Evidential Cooperation in Large Worlds (ECL). The speaker argues we should cooperate with agents who have different values in large universes, even without causal connections. 

  Hmm, the user wants eight to ten questions that go beyond restating the view, with three specific requirements: one on what justifies confidence in reasoning correlations (not just stipulation), one on whether "superrationality" adds anything over simpler approaches like moral parliaments, and one on how to practically identify cooperation with unobservable agents. Each question needs a follow-up anticipating likely responses.

  Let me unpack the core challenge first. The ECL idea feels counterintuitive because cooperation usually requires causation. The speaker's key move is separating decision procedures from values – but how does that *actually* create obligation? I should craft questions that probe the philosophical machinery while staying constructive. 

  For the correlation justification question, I recall similar debates in game theory about common priors. The speaker will probably appeal to decision-theoretic necessity or anthropic reasoning. The follow-up should challenge whether this is circular if we can't verify correlation. 

  On the superrationality vs moral parliament angle, I wonder if the user suspects ECL overcomplicates things. The speaker might defend uniqueness, so the follow-up could ask why value-agnostic cooperation beats value-sensitive aggregation. 

  The practical cooperation question is thorniest – how do we map abstract theory to real-world choices with alien values? She'll likely describe coarse-grained alignment, but the follow-up should press on unavoidable value imposition. 

  I'll add five more angles: 
  - Whether ECL demands too much (given infinite stakes) 
  - How it handles conflicting cooperations 
  - Why correlation beats causation ethically 
  - Its testability compared to moral realism 
  - Whether it reduces to epistemic humility 

  Each needs surgical follow-ups. The tone must be rigorous but collegial – this is academic Q&A, not debate club. I'll avoid gotchas while ensuring no dodge goes unchallenged. 

  *scribbles structure* 
  Q1: Correlation justification → follow-up on verification 
  Q2: Superrationality necessity → follow-up on value agnosticism 
  Q3: Cooperation semantics → follow-up on value imperialism 
  Q4: Demandingness → follow-up on fanaticism 
  Q5: Conflict resolution → follow-up on comparability 
  Q6: Ethical foundations → follow-up on why correlation matters 
  Q7: Testability → follow-up on unfalsifiability 
  Q8: Reduction argument → follow-up on whether ECL adds action guidance 

  There – eight questions covering requested points plus depth. The follow-ups are coiled springs: polite but ready to snap if answers seem evasive. User gets a toolkit to reveal whether ECL is profound or just clever.
answer: |-
  Here are eight questions probing ECL's foundations, practical implications, and alternatives, each with a targeted follow-up anticipating likely replies:

  ### Core Questions & Follow-ups
  1. **On Correlation Justification**:  
     *"You argue that our decision procedures correlate with distant agents' reasoning in large worlds. What warrants confidence that this correlation is *structural* (e.g., arising from shared rationality constraints) rather than merely asserted? If it's grounded in decision theory alone, does this risk assuming what needs proving?"*  
     **Likely Reply**: Appeal to formal decision theory (e.g., updatelessness) or anthropic reasoning as necessitating correlation.  
     **Follow-up**: *"If we lack empirical evidence for such correlation and it’s untestable even in principle, isn’t ECL functionally equivalent to a *prescriptive* heuristic—like Kantian universalization—rather than a discovery about the multiverse?"*

  2. **Superrationality vs. Simpler Heuristics**:  
     *"Why is ECL’s 'superrational' machinery superior to a 'moral parliament' model where we *simulate* diverse agents’ preferences (weighted by our credence in their existence/plausibility) and optimize for aggregate value? Does ECL’s value-agnosticism add unique practical value?"*  
     **Likely Reply**: ECL avoids arbitrariness in weighting values and handles agents beyond our epistemic reach.  
     **Follow-up**: *"If cooperating with unobserved agents requires coarse-grained strategies (e.g., 'avoid existential risk'), doesn’t this converge with what a moral parliament would recommend *anyway*? Is the formal apparatus doing work beyond motivating cooperation under uncertainty?"*

  3. **Operationalizing Cooperation**:  
     *"How do we identify *what actions constitute cooperation* with agents whose values and decision contexts we cannot observe? If cooperation requires value-neutral coordination (e.g., 'commit to X iff others commit'), how do we avoid actions that inadvertently harm their interests?"*  
     **Likely Reply**: Focus on abstract, robustly beneficial strategies (e.g., information-sharing, catastrophe prevention) that likely serve most values.  
     **Follow-up**: *"Doesn’t this assume a *convergent instrumental convergence* across value systems? If we discover that (e.g.) preventing asteroid impacts actively harms some alien utility functions, does ECL demand we *still* cooperate by preventing impacts?"*

  4. **Demandingness & Fanaticism**:  
     *"ECL seems to demand extreme sacrifices for tiny probabilities of affecting vast numbers of agents. Does this risk *fanaticism* (e.g., devoting all resources to minimizing n-dimensional suffering in distant galaxies)? If not, how do you bound its demands?"*  
     **Likely Reply**: Emphasize tractability/credible threats; prioritize high-impact, low-cost cooperation.  
     **Follow-up**: *"But if the universe is large enough, *any* positive probability of affecting N agents (with N near-infinite) dominates local ethics. Doesn’t ECL *require* fanaticism unless we impose arbitrary decision thresholds?"*

  5. **Conflict Between Cooperations**:  
     *"How does ECL resolve conflicts between *different* cooperative equilibria? E.g., cooperating with agent-type A might require action X, while cooperating with type B requires anti-X. Must we privilege one reference class?"*  
     **Likely Reply**: Prioritize the broadest reference class (e.g., "all rational agents") or seek robustly win-win strategies.  
     **Follow-up**: *"If win-win is impossible, doesn’t privileging a reference class (e.g., 'reasoners like us') reintroduce parochialism? Is ECL action-guiding without a *value-laden* theory of which agents 'count'?"*

  6. **Ethical Foundations**:  
     *"Why is *evidential correlation* ethically significant absent causation? If I learn my decision is *correlated* with a Nazi’s choice, why should I cooperate rather than defect to disrupt their goals?"*  
     **Likely Reply**: Correlation creates *practical identity*—defecting harms your own cooperative efficacy across worlds.  
     **Follow-up**: *"But if the Nazi’s values are abhorrent to me, why is 'cooperative efficacy' an overriding good? Isn’t this smuggling in a *prior commitment* to cooperation-as-intrinsic-value?"*

  7. **Testability & Falsifiability**:  
     *"What would *falsify* ECL? If it’s consistent with any observable outcome (e.g., 'cooperation failed because correlation was low'), does it risk being unfalsifiable?"*  
     **Likely Reply**: ECL is normative, not empirical; it prescribes how to act under uncertainty.  
     **Follow-up**: *"If ECL can’t be empirically tested *even in principle*, how is it distinct from moral anti-realism? Why prefer it over, say, moral skepticism that ignores unobservable agents?"*

  8. **Reduction to Epistemic Humility?**:  
     *"Is ECL best understood as an *epistemic* principle: 'Act as if your actions are duplicated, since you can’t rule it out'? If so, does this reduce to a generalized precautionary principle without distinct content?"*  
     **Likely Reply**: No—it’s a positive claim about multiverse structure enabling cooperation, not just caution.  
     **Follow-up**: *"But if the multiverse structure is unknowable, doesn’t the *practical* imperative collapse back to epistemic humility? What concrete action does ECL prescribe that wouldn’t follow from 'Avoid imposing values on others'?"*

  ### Key Angles Covered
  - **Correlation Justification**: Questions 1 & 7 (focused on epistemology/metaphysics).  
  - **Superrationality vs. Heuristics**: Question 2 (probing uniqueness/necessity).  
  - **Operationalizing Cooperation**: Question 3 (practical implementation).  
  - **Ethical Demands & Conflicts**: Questions 4, 5, 6 (normative implications).  
  - **Metaphysical Parsimony**: Question 8 (reduction arguments).  

  These questions push on ECL’s internal coherence, action-guidance, and philosophical added value while respecting its novelty. Each follow-up preempts common defenses to elicit deeper engagement.
