  **Key Point for Your Teacher:** The deduction primarily stems from the claim that shared values function as a "neutral checklist" that "settles which theory is objectively better." Kuhn explicitly rejects this in the Postscript, arguing values are interpreted differently (e.g., what counts as 'simple'?) and act as persuasive tools guiding collective judgment, not as an algorithm guaranteeing a single, objective outcome from a neutral perspective. This nuance is crucial to Kuhn's response to the irrationality charge.
