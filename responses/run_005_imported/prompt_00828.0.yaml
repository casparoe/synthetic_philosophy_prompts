  The user is wondering why acausal trade is seen as more legitimate than Pascal's mugging. They suspect that both suffer from the same issue with unverifiable astronomical stakes. They want to know if there's a disanalogy they're missing or if this is an obvious point.

  First, I need to recall the standard defenses for acausal trade. One key difference is that in trade, both parties benefit mutually, whereas a mugger only makes threats or promises without reciprocity. In acausal trade, the trade partner has an incentive to cooperate because they also gain. This mutual benefit might make the scenario more stable and less arbitrary than a mugger's claim.

  But the user's concern is about the prior probabilities. Even if the structure is mutual, the existence of such large agents might still be too improbable. The description length might not penalize large numbers enough. For example, specifying "an agent controlling 3↑↑↑3 resources" is almost as short as specifying one with 3↑↑↑↑3. So priors don't drop sufficiently to counter the huge utilities.

  Another point is that acausal trade often assumes logical correlation between agents. If your decision algorithm is known, and the other agent can simulate you accurately, then cooperation becomes a Nash equilibrium. The trade relies on the agents' algorithms being transparent and predictable to each other. This isn't about probabilistic beliefs but about logical dependencies. So maybe it's not about priors but about game-theoretic strategies.

  But the user might counter that the existence of such agents is still probabilistic. Before knowing if they exist, you have to assign a prior. If the prior doesn't scale properly with the claimed resources, you're back to Pascal's mugging. Even if the interaction is logical, the initial assumption that such an agent exists and is modeling you might be where the mugging problem creeps in.

  The user mentions that this isn't discussed much. I should check if there are existing rebuttals. Maybe Robin Hanson or others addressed this. Hanson might argue that in practice, only agents with similar power levels engage in trade, so the unbounded size isn't an issue. Or perhaps the trade requires symmetry, which limits the scope.

  Also, decision theories like UDT or FDT handle acausal trade by considering logical consequences, not expected utility with priors. So the problem might be bypassed in those frameworks. But if you're using a Bayesian approach, the prior issue remains.

