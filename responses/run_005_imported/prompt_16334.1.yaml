  First, I need to confirm that these two arguments are indeed different. The basin-drumming story makes an ontological claim—death is a natural part of transformation, so grieving is a failure to understand reality. The Lady Li story, however, is epistemological—we can't know death is bad because our perspective is limited. The user is right to see a tension here.

