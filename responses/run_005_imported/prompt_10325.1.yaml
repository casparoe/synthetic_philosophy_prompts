  **MEMORANDUM**  
  **TO:** Hal & [Cousin’s Name]  
  **FROM:** [Your Name]  
  **DATE:** October 25, 2023  
  **SUBJECT:** Foundation Grant Recommendation & Path Forward for 10/30 Call  

  ### **Recommendation: Split Funding (70% AMF, 30% Scholarship Fund)**  
  I propose allocating **$56,000 to Against Malaria Foundation (AMF)** and **$24,000 to the Hometown Scholarship Fund**. This balances our charter’s mandate for evidence-backed effectiveness with our familial connection to Uncle’s legacy, while directly addressing Hal’s ethical concerns.  

  ### **Why This Split?**  
  1. **AMF’s Proven Short-Term Impact Is Unmatched**  
     • AMF’s bednets save lives *now* with extraordinary evidence (~$3,500/life saved via RCTs). Even if downstream effects are uncertain, **preventing immediate, preventable deaths is a measurable moral good**. The scholarship cannot claim comparable near-term impact.  
     • Hal’s concern about long-term net harm is philosophically valid but **not unique to AMF**. As [Cousin] noted, *all* interventions—including scholarships—have unknowable ripple effects (e.g., education may increase consumption *or* drive innovation). Rejecting AMF solely on this basis would paralyze *any* grantmaking.  

  2. **The Scholarship Honors Legacy Without Ignoring Evidence**  
     • While less rigorously evidenced, the scholarship aligns with Uncle’s lifelong ties to his hometown. A 30% allocation ($24k) acknowledges this, **provided we request data**: graduation rates, alumni outcomes, and 5-year impact metrics from the fund.  

  3. **Hal’s Objection Is a Catalyst for Better Governance**  
     • Hal raises a critical question: *Can we trust "lives saved" as a terminal metric?* Rather than vetoing AMF, we should:  
       - Commission a brief literature review on long-term effects of malaria prevention (e.g., via GiveWell or Rethink Priorities) for **2024’s grants**.  
       - Amend our charter in 2024 to **define "evidence-backed"** (e.g., “priority to interventions with RCTs + long-term studies”).  

  ### **Next Steps & Deadline**  
  1. **By October 28, 5:00 PM ET**:  
     • Hal & [Cousin] reply to this memo: Confirm support for the split or propose specific adjustments.  
     • If supported, I’ll draft a 1-pager on the scholarship’s existing outcomes for Monday’s call.  

  2. **October 30 Call (Agenda)**  
     - Finalize 2023 grants (vote if needed).  
     - Assign Hal to research malaria’s long-term impact (report due March 2024).  
     - Task [Cousin] with evaluating the scholarship’s evidence rigor.  

  ### **Why Not All-In on Either?**  
  • **AMF-only** ignores legacy and Hal’s valid meta-concern about impact ethics.  
  • **Scholarship-only** fails our charter: its "effectiveness" is anecdotal, not evidence-backed.  
  • **Splitting forces accountability**: We test both approaches and refine next year.  

  This split respects Uncle’s pragmatism—he ran this foundation for 20 years by balancing heart and head. Let’s honor that by acting decisively *now* while building a better process for 2024.  

  Best,  
  [Your Name]  

  ---

  ### **Key Rationale for Hal**  
  Your skepticism about "lives saved" as a terminal goal is a profound challenge to effective altruism’s core model. But if we demand *certainty* of net-positive cosmic outcomes, we can fund nothing—even scholarships risk unintended consequences. AMF’s intervention is the least ambiguous good available: it prevents tangible suffering today. We’ll address systemic uncertainty in 2024’s strategy.  

  ### **Key Rationale for Cousin**  
  A 70% AMF allocation ensures the majority of funds maximize near-term impact per evidence. The 30% scholarship compromise avoids deadlock, respects Uncle’s roots, and incentivizes Hal to engage constructively. If the scholarship’s evidence is weak, we’ll redirect next year.
