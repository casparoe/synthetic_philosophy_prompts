  I should distinguish between preferences over outcomes and choice dispositions. The cyclic ranking is about the former, while exploitability depends on the latter. A planner can have cyclic preferences but use a strategy that avoids bad sequences. For example, they might adopt a policy to never trade in a cycle when a net loss occurs. 

  Diachronic coherence is crucial here. Rationality over time requires consistency in plans, not just moment-by-step choices. The naive agent is myopic, only seeing one step ahead, leading to exploitation. A sophisticated agent evaluates entire paths. 

