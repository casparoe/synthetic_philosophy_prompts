  Marcus then invokes the Duhem-Quine thesis explicitly, comparing dark matter to Neptune's discovery. The key point becomes whether saving adjustments are progressive (leading to new discoveries) or degenerating (endless patches). He cites Lakatos here - a sophisticated upgrade from Popper's binary falsifiability.

