  First, I need to recall the structure of the second essay. Nietzsche discusses the development of the "bad conscience" through violent social training. The morality of customs (Sittlichkeit der Sitte) forces individuals into predictable behavior. The sovereign individual is introduced as the fruit of this process—someone who can make promises because they've internalized discipline.

