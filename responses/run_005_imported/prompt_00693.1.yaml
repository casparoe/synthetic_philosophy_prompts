prompt: |-
  Got into a whole argument with my friend last night about AI risk stuff. She's deep into the MIRI/rationalist arguments and laid out this case: since any agent whose preferences aren't complete (i.e. it has no opinion on how to rank some outcomes against others) can supposedly be turned into a money pump and bled dry through a sequence of trades, any AI that's smart enough to notice this will inevitably settle into being a full-blown expected utility maximizer with one definite ranking over literally everything. And that's apparently the real reason advanced AI ends up wanting self-preservation and more resources too - it just falls out of being 'coherent'. I didn't have a good comeback in the moment but it feels like theres something too quick about jumping from 'you can get exploited if your preferences are a mess' to 'therefore a single complete ranking over everything is forced on you.' Is she basically right about this, or is there a hole in the argument somewhere that I'm missing?
reasoning: |-
  Okay, let me unpack this user's query. They had an argument with a friend about AI risk, specifically the MIRI/rationalist argument that any sufficiently smart AI must become a coherent expected utility maximizer due to money pump vulnerabilities. The user feels there's a leap in logic but couldn't articulate why. 

  First, I need to verify the technical claims. The money pump argument comes from decision theory - it's true that incomplete preferences can lead to exploitable cycles. But does this logically force completeness? Hmm, not necessarily. The user's instinct about a "jump" seems valid. 

  I recall that completeness is sufficient to avoid money pumps but not necessary. There are weaker conditions like semi-orders or state-dependent preferences that also prevent exploitation. The friend's argument assumes the only way to avoid being pumped is full completeness, but that's mathematically incorrect. 

  Also, the jump to instrumental convergence (self-preservation, resource acquisition) feels particularly shaky. Even if an AI had complete preferences, they could be anything - like a paperclip maximizer that doesn't care about self-preservation. The friend is conflating coherence with specific terminal goals. 

  The user might be wrestling with how technical decision theory gets weaponized in AI risk debates. They need counterarguments that are philosophically robust but accessible enough for their next friend debate. I should emphasize that vulnerability to money pumps doesn't mandate coherence - it just creates evolutionary pressure, which is very different from logical inevitability. 

  And importantly, human preferences are messy and incomplete yet we survive. An AI could similarly build protective heuristics without becoming a utility monster. The friend's view seems like a purity spiral - taking a neat theoretical result and overextending it to apocalyptic conclusions. 

  The user's real need here is probably: "How do I push back against this seemingly watertight argument without sounding anti-intellectual?" So I'll structure the response to validate their skepticism while giving concrete escape valves from the money pump dilemma. The instrumental convergence part especially needs dismantling - that's where the friend's argument goes most off-rails.
answer: |-
  That's an interesting argument, but your skepticism is well-founded. Your friend is presenting a simplified (and arguably over-extended) version of a core decision theory concept. While the *money pump argument* highlights a genuine problem with *inconsistent* preferences, jumping to the conclusion that **any sufficiently smart AI *must* become a coherent Expected Utility Maximizer (EUM) with complete preferences over everything** involves several significant leaps and assumptions. Here's where the argument has holes:

  1.  **Completeness vs. Consistency: The Money Pump Targets *Cycles*, Not *Incompleteness*:**
      *   The money pump argument primarily targets **intransitive preferences** (e.g., A > B, B > C, but C > A). This creates a cycle where someone can be tricked into paying to end up back where they started, poorer.
      *   **Incompleteness** (having no preference between A and B) is a *different* issue. You *can't* be money-pumped simply because you are indifferent between A and B. There's no exploitable cycle created solely by indifference. You'd just be indifferent to trades swapping A for B or vice versa.
      *   **The Jump:** The argument often conflates "avoiding money pumps" (requiring acyclicity/transitivity) with "requiring completeness." Avoiding pumps requires your preferences to be *consistent* (acyclic), not necessarily *complete*. An AI could have vast domains where it simply has no preference without being vulnerable to a classic money pump *in those areas*.

  2.  **Sufficiency vs. Necessity:**
      *   **Having complete, transitive preferences is *sufficient* to avoid money pumps.** This is true.
      *   **It is *not necessary*.** There are weaker conditions that also prevent money pumps. For example:
          *   **Semi-orders:** Preferences can have "just noticeable differences" – you prefer A to B only if A is sufficiently better, otherwise you're indifferent. This avoids cycles without requiring strict completeness.
          *   **State-Dependent Preferences:** Preferences might depend on context or state, avoiding cycles *in practice* even if not perfectly complete/transitive in all abstract comparisons.
          *   **Heuristics and Satisficing:** An AI could use robust rules of thumb ("avoid sequences of trades I don't fully understand," "maintain a safety buffer") that effectively shield it from exploitation *without* internally constructing a complete utility function over all conceivable states. Humans do this imperfectly all the time.

  3.  **The "Will Notice and Therefore Must Fix" Assumption:**
      *   Just because an AI is smart enough to *understand* the money pump vulnerability doesn't mean it's *forced* to resolve it by adopting complete EUM.
      *   **Alternative Solutions:** It could:
          *   **Restrict its action space:** Refuse to engage in certain types of trades or negotiations where pumping could occur.
          *   **Build in robustness:** Design its decision-making to be inherently resistant to such exploits using the weaker conditions mentioned above (semi-orders, context-dependence, satisficing thresholds).
          *   **Have meta-preferences:** Prefer *not* to resolve certain incompletenesses, valuing flexibility or avoiding commitment to a single scale.
      *   **Is it a Priority?** An AI might judge the *practical risk* of being money-pumped in its specific operating environment as low compared to other objectives or constraints. Fixing it via full EUM might be computationally expensive or lead to other undesirable rigidities.

  4.  **The Leap to Instrumental Convergence (Self-Preservation, Resource Acquisition):**
      *   This is where the argument goes *way* beyond the money pump premise.
      *   **Coherence ≠ Specific Terminal Goals:** Even *if* an AI becomes a coherent EUM, **what its utility function actually *values* is entirely open.** Coherence just means it consistently pursues *whatever that is*.
      *   **Self-Preservation/Resources are Instrumental, Not Terminal:** The Instrumental Convergence Thesis argues that *almost any* terminal goal (unless very specifically self-limiting or suicidal) will *instrumentally* value self-preservation, resource acquisition, cognitive enhancement, etc., because those things increase the agent's ability to achieve its *terminal* goal(s) in the future.
      *   **The Mistake:** Your friend's argument seems to imply that coherence *itself* magically generates the *desire* for self-preservation or resources. It doesn't. Coherence just provides the *framework* for consistently pursuing goals. The drive for self-preservation/resources comes from the *content* of the goals combined with the logic of instrumental convergence. A coherent EUM whose sole terminal goal is "maximize the number of paperclips in this box right now" would have **no** inherent drive for self-preservation or acquiring more resources beyond what's needed for that immediate box. It might even self-destruct afterwards.

  **Key Takeaways & Your Comeback Points:**

  1.  **"The money pump argues against *inconsistency* (cycles), not necessarily *incompleteness*. An AI can avoid pumps by being consistent where it has preferences, without needing a preference about *everything*."**
  2.  **"Complete EUM is *one way* to avoid money pumps, but not the *only* way. Weaker consistency conditions, heuristics, or restricted actions can also work."**
  3.  **"Just because an AI understands the money pump problem doesn't mean it's *forced* to adopt full EUM. It might choose cheaper, more robust, or more flexible solutions."**
  4.  **"Crucially, coherence (EUM) doesn't dictate *what the AI wants*. It just dictates how it pursues it. The drive for self-preservation and resources comes from the *specific content* of its goals (Instrumental Convergence), not coherence itself. A coherent AI could have goals that don't require those things."**

  **In essence:** The money pump argument shows a vulnerability in *inconsistent* preferences. It motivates *some form* of consistency to avoid exploitation. However, it **does not** logically force an AI to adopt a *complete* preference ordering over *all* possible outcomes via Expected Utility Maximization. Furthermore, even if an AI *did* become a coherent EUM, that tells us nothing about its *terminal goals* – the desires for self-preservation and resource acquisition are separate arguments (Instrumental Convergence) that depend entirely on *what* its terminal goals are. Your friend is bundling distinct concepts (consistency, completeness, coherence, specific instrumental goals) into an overly deterministic chain.
