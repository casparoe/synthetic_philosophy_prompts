answer: |-
  Here's a direct comparison and verdict, favoring neither "both have merits" nor bullet-biting, but concluding that **McGrath's normative approach handles the core puzzle of causation by omission *better* than Lewis's pragmatic approach, despite its potential cost in normless cases.**

  ### Why McGrath's Normative Account Solves the Omission Problem More Effectively
  1.  **Directly Addresses the Absurdity:** Lewis *accepts* the absurd conclusion (Antarctic guy is a cause) and then tries to explain it away *after the fact* using pragmatics. McGrath *prevents* the absurd conclusion from arising in the first place by building normativity into the causal relation. Her metaphysics directly reflects the intuition that *only relevant failures* (like yours, not your neighbour's or the Antarctic guy's) are genuine causes of the plant's death.
  2.  **Avoids the "Cause vs. Background" Conflation:** Lewis uses the *same* pragmatic tools (explanatory relevance, salience) to handle both the omission problem *and* the distinction between causes and mere background conditions (like oxygen presence for a fire). McGrath recognizes these are distinct problems. Her approach provides a *metaphysical* reason why the neighbour's omission isn't a cause: it doesn't violate a relevant norm *applicable to the causal context*. It's not just "background"; it's metaphysically *non-causal* on her view. This offers a cleaner separation.
  3.  **Aligns Better with Intuitions about Responsibility & Agency:** Causation by omission is deeply tied to notions of responsibility, duty, expectation, and function. McGrath's view explicitly incorporates this link into the *nature* of causation itself for omissions. It explains why we intuitively blame *you* and not the neighbour: *your* omission violated the norm relevant to *causing* the death. Lewis relegates this crucial normative dimension entirely to pragmatics, separating it from the causal facts.
  4.  **Offers a Clearer Criterion for Omissions:** Lewis offers no *metaphysical* criterion for distinguishing *which* omissions are causes beyond counterfactual dependence (leading to over-generation). McGrath provides a principled (though potentially contestable) criterion: deviation from a relevant norm. This gives a clearer target for analysis and debate.

  ### Addressing the Cost: The "Normless Case" Problem for McGrath
  *   **The Challenge:** What if there's no obvious norm, duty, statistical regularity, or function? (e.g., a completely random, unprecedented event caused by an omission). Does causation by omission simply not exist in such cases?
  *   **McGrath's Likely Response & Mitigation:** McGrath argues norms are ubiquitous or can be constructed contextually. Even in "strange" cases, we often impose minimal norms (e.g., "things generally persist unless interfered with," "agents generally don't act randomly"). A statistical norm (what *usually* happens) might often be applicable. She might bite the bullet for *truly* normless voids but argue they are vanishingly rare or conceptually unstable.
  *   **The Cost:** This *is* a genuine cost. If a genuinely normless omission *does* cause an event, McGrath struggles to account for it metaphysically. Lewis handles these cases easily (counterfactual dependence holds, pragmatics sorts it out later).

  ### Why Lewis's Pragmatic Defense is Less Satisfactory for Omissions
  1.  **The Bullet is Too Hard to Bite:** Accepting that the Antarctic guy *is literally, metaphysically* a cause of your basil plant's death is deeply counterintuitive and seems to trivialize the concept of causation. Pragmatic explanations *why we ignore him* feel like an ad hoc patch over a flawed core analysis.
  2.  **Pragmatics Does Heavy, Suspicious Lifting:** Lewis relies entirely on pragmatics to save his analysis from absurdity. While pragmatics is crucial for *explanation*, it seems implausible that the *causal facts themselves* are so wildly at odds with how we must *describe* them. McGrath integrates the relevant selective factors (norms) into the causal relation.
  3.  **Doesn't Capture the "Oomph" of Omission Causation:** The force of "My forgetting *caused* the death" stems from the violation of an expectation/duty. Lewis reduces this to a counterfactual dependency that exists equally for millions of irrelevant non-actors, plus pragmatics. McGrath captures the specific "normative violation" aspect as part of the causal relation itself.

  ### The Verdict
  **McGrath's strategy handles the core puzzle of causation by omission significantly better.** She provides a metaphysically grounded solution that directly blocks the absurd over-generation of causes (Antarctic guy) by tying causal efficacy for omissions to the violation of contextually relevant norms. This aligns far better with our core intuitions about when omissions are genuinely causal and responsible for outcomes.

  **The cost in potential "normless cases" is real but manageable:** These cases are arguably rare or can often be handled by appealing to minimal norms (like statistical regularities or persistence expectations). Even if they exist, the benefit McGrath provides in solving the pervasive and central problem of over-generation for the vast majority of omission cases outweighs this cost. Lewis's pragmatic approach, while flexible in normless cases, fails to adequately address the fundamental absurdity at the heart of omission causation and relies too heavily on post-hoc explanation to mask the deficiencies of the core counterfactual analysis.

  **Therefore, for your paper (and winning the argument):** Champion McGrath. Acknowledge the normless case challenge directly, but argue forcefully that her account provides the superior metaphysical framework for understanding causation by omission by directly incorporating the normative dimension that is essential to our concept of it. Lewis's view, while elegant and parsimonious for other causal problems, leaves the omission case metaphysically messy and counterintuitive, requiring pragmatics to do work it shouldn't have to. McGrath offers a more satisfying and accurate picture of what causation *is* when something doesn't happen.
