prompt: |-
  Okay so I need a tie-breaker because my friend and I argued about this for like two hours last night and got nowhere. She's doing a masters in theology and told me about this letter Augustine wrote — I think it's called "Against Lying" in English — to some guy named Consentius, who'd asked for permission to send Catholic agents undercover into a heretical sect (Priscillianists, I think?), pretending to convert, so they could infiltrate it and expose it from the inside for the greater good. Augustine's answer was basically: absolutely not, that's still lying, and lying is never okay even for a good cause. Which fits his whole deal, since he was famously hardcore about this stuff — he even thought lying to save an innocent person's life was sinful, just a smaller sin than most. My friend thinks this is a genuinely consistent, admirable position. I think it basically proves his framework is too rigid to survive contact with the real world.

  Here's the part where it actually got interesting, though. I pointed out that literally every modern military accepts that deception in war is sometimes totally fine — camoflague, decoys, fake radio chatter, dummy tanks, all standard and completely legal. It's only "perfidy," like faking a surrender or misusing a Red Cross symbol to get close to someone, that's banned under the laws of war. So there's a whole tradition, way more mainstream than Augustine's, that draws a hard line between deceiving someone through your actions versus deceiving them through your words/assertions. My friend insisted Augustine would've condemned the ruse stuff too, since what he actually cares about is the intent to make someone believe something false, not whether you technically used words to do it. I said his own writing is pretty specifically about speech and "signs," and I'm not convinced it stretches that far.

  So here's what I actually want from you: first, based on what Augustine really argued (not the one-line "lying is always wrong" summary), does his reasoning logically commit him to condemning non-verbal ruses and deceptive actions just as much as verbal lies, or is there a principled way to read him as only ruling out the verbal kind? And second, putting Augustine aside — which position do you think actually holds up better: his total, no-exceptions rejection of deception, or the more standard view where deceiving through actions is fine but deceiving through words to someone who trusts you isn't? I want real arguments here, not a wishy-washy "well it depends," because that's literally what my friend said to end the conversation and I don't think it counts as an answer.
