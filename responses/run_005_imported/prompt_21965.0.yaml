  First, I need to recall Augustine's actual arguments in "Contra Mendacium" (Against Lying). He defines lying as intentionally communicating falsehood regardless of medium - words, gestures, or actions. His theological foundation ties deception to Original Sin and views all falsehood as corrupting the soul. The user's friend is correct that Augustine would condemn non-verbal ruses since his focus is on intent to deceive, not the method.

  For the military ethics comparison, the Hague/GC framework distinguishes perfidy (forbidden) from ruses (permitted) based on betrayal of trust. But Augustine would reject this distinction because for him, any intentional deception violates divine law. His position is radically consistent but practically problematic - imagine banning camouflage as sinful!

  The user clearly wants two concrete answers: 1) whether Augustine's logic requires condemning all deception (yes), and 2) which framework is stronger. They're frustrated with moral relativism ("it depends") so I'll give direct analysis. 

  On question two, Augustine's strength is his consistency and high moral standard, but it fails when protecting innocents requires deception. The military framework's weakness is its arbitrary line between ruses and perfidy - why is a fake tank acceptable but a fake surrender reprehensible? Both exploit trust differently. 

