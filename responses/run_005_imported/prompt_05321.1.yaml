  ok so in my gov class we've been going through some Mill (the On Liberty guy) and my teacher mentioned as a side note that later in life he actually got way more sympathetic to socialism than i expected — like theres this unfinished piece called Chapters on Socialism and he even hints in his autobiography that he and his wife basically saw themselves as socialists of some kind?? that is NOT the vibe i got from "harm principle" mill lol. so if he somehow saw the modern world, do you think he'd be more of a universal basic income guy, or more into stuff like worker co-ops/employee-owned companies instead? and would either of those actually fit with his liberalism or would he think they cross a line? genuinely curious what he'd say based on his actual views and not just a vibes-based guess.
