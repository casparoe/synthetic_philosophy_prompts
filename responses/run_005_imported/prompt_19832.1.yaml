  Crucially, the user needs to grasp the formal collapse: Tarski's undefinability and Miller/Tichý proofs. But throwing symbolic logic at them would lose them. Maybe use the "weather in LA" analogy they mentioned? That made verisimilitude's vulnerability to alternative language choices painfully clear. 

