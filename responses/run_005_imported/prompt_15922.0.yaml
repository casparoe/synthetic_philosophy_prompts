prompt: |-
  my ethics seminar has a guest speaker coming next week -- a philosopher whos spent her whole career defending the strict Kantian line that an act only has moral worth if its done from the motive of duty -- and our prof wants us to submit discussion questions in advance. can you draft like 8 questions that don't just get her to restate the shopkeeper example? i want at least one pushing on the move where the motive of duty doesn't have to actually be doing the work on the day, just standing ready to override your other motives if they ever conflicted with duty -- isn't that basically just redescribing being a reliably decent person rather than actually requiring the duty-motive? one on the huckleberry finn case, where huck helps jim escape while sincerely believing (bc that's what he's been taught) that he's doing something wrong -- does his act really lack moral worth on her view? and one built around the 'moral fetishism' charge, that requiring people to be moved by 'this is my duty' instead of directly by the other person's situation makes good agents look weirdly focused on their own rectitude rather than on the person they're helping. for each, add a follow-up keyed to whatever she's most likely to say back.
