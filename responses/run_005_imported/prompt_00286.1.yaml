  So I've been going down a rabbit hole on evidential cooperation in large worlds (ECL) lately -- the idea that if you think the universe/multiverse is vast enough to contain tons of causally disconnected agents who reason similarly to you, you should act cooperatively toward their values even without any communication or causal link, because your decision correlates with theirs in a Hofstadter-superrationality kind of way. I keep trying to explain this to people and their eyes glaze over, so I thought maybe a story could make it click better than another dry explanation.

  Could you write a short story that gets at this idea? I'm picturing something like a lone researcher (or maybe an AI) who becomes convinced that there are countless other versions of similar reasoning agents scattered across a large or infinite universe/multiverse, and has to decide whether to act selfishly or to cooperate with the hypothetical values of these unreachable, unknowable others -- purely on the logic of "if I'm the type of agent who cooperates, then so are they, in correlated pockets of reality I'll never see." Feel free to pick whatever setting fits best (isolated space station, simulated mind, whatever) -- I just want the core dilemma and the specific flavor of acausal reasoning to come through clearly, not just a generic "trust and cooperation" moral.
