prompt: |-
  I recently agreed to chair the bylaws subcommittee of a small scholarly association I belong to (we have roughly two hundred dues-paying members and elect a new president every two years), and a controversy from this year's election has left me wanting to understand something more fundamental than I expected when I took on the role. For years the presidency was decided by simple plurality among three or four candidates, but two elections ago a widely liked moderate lost to a more polarizing candidate after two similar moderates split the vote between them. That prompted a change to a ranked-choice ballot, on which members list every candidate in order of preference. At our first meeting after this year's election, though, one of our more candid members admitted, with a certain pride, that she and several friends had deliberately ranked their sincere second choice dead last, beneath a candidate nobody took seriously, purely to help their actual favorite win. It worked, and it plainly wasn't in the spirit of what the new ballot was supposed to achieve.

  This has set off a debate on the subcommittee about what to do next. One faction wants to move to a point-scoring system, in which each rank on a ballot earns a candidate a certain number of points, confident that this will finally remove any reason for members to misstate their true preferences. Another member, only half joking, says that whatever system we adopt, someone will eventually find an angle to exploit, and that we would be better off spending our energy on something else entirely. I don't have a technical background in this area, but before I recommend anything to my colleagues I would like to genuinely understand the issue: with three or more candidates, can a voting rule ever be designed so that every member's best strategy is always to rank the candidates honestly, no matter how everyone else votes? And if not, is there some principled reason this keeps happening to us, rather than just a string of unlucky rule choices on our part?
reasoning: |-
  Okay, let me start by understanding the user's problem. They're chairing a bylaws subcommittee for a small scholarly association that recently switched to ranked-choice voting (RCV) after a moderate candidate lost due to vote-splitting. Now, they've encountered strategic voting where members ranked their sincere second choice last to manipulate the outcome. The committee is debating solutions: one faction wants a point-scoring system, while another thinks any system can be gamed. The user wants to know if a voting rule exists where honest ranking is always the best strategy, and if not, why they keep facing these issues.

  First, I need to recall the main concepts here. Arrow's Theorem and the Gibbard-Satterthwaite Theorem come to mind. These theorems deal with voting systems and their limitations. Arrow's Theorem says that no ranked voting system can meet all fairness criteria simultaneously. Gibbard-Satterthwaite specifically addresses strategic voting, proving that any system with three or more options will incentivize dishonesty in some scenarios. That seems relevant here.

  The user mentioned moving to a point-scoring system like Borda Count. But I remember that Borda is also manipulable. Voters can demote strong competitors by ranking them lower. So switching to that might not solve their problem. The core issue is a fundamental mathematical limitation, not just their choice of rules.

  Why does this keep happening to them? They've had multiple rule changes—plurality led to vote-splitting, RCV faced strategic ranking. Each system has vulnerabilities. The association's small size and divisive candidates probably create situations where manipulation is more tempting. Also, members are politically engaged, making them more likely to strategize.

  The user's deeper need might be to find a robust solution or understand that no perfect system exists. They need to communicate this to the committee, managing expectations. Alternatives could include accepting some imperfection, using Condorcet methods which are harder to game but not immune, or focusing on norms and smaller groups to reduce strategy.

  I should explain the theorems clearly, avoiding jargon. Emphasize that it's a universal problem, not their fault. Then discuss practical steps: accept trade-offs, consider Condorcet, or shift focus to candidate vetting. Highlight that no system is strategy-proof, so the committee should prioritize simplicity and member buy-in.
answer: |-
  Your question cuts to the heart of democratic theory and reveals a profound mathematical truth: what you're experiencing isn't bad luck, but an unavoidable consequence of collective decision-making. Let's break down the core issues:

  ### The Fundamental Impossibility: Gibbard-Satterthwaite Theorem
  The answer to your central question—**can a voting rule exist where honest ranking is always the best strategy?**—is **no**, for elections with three or more candidates. This is rigorously proven by the **Gibbard-Satterthwaite Theorem** (1970s). It states that *any* voting system that:
  1.  Has three or more possible outcomes (candidates),
  2.  Allows voters to express any preference ordering, and
  3.  Is non-dictatorial (no single voter always decides the outcome)
  ...is **susceptible to strategic voting** ("manipulable"). In some scenarios, voters can achieve a better outcome by misrepresenting their true preferences.

  ### Why This Happens to You (It's Not Your Rules)
  1.  **The Nature of Preferences:** Your members have diverse, nuanced preferences. Translating these into a single group decision inevitably creates tensions between fairness, decisiveness, and strategy-resistance.
  2.  **The "Spoiler" Problem Persists:** Your initial plurality system suffered from vote-splitting (the moderate spoiler effect). RCV (Instant Runoff Voting - IRV) *reduces* this problem but doesn't eliminate it. The strategic voting you witnessed ("burying" a strong second choice) is a known tactic in IRV, exploiting how later rounds are calculated.
  3.  **Point Systems (Like Borda Count) Are Also Vulnerable:** The faction proposing points (e.g., 1st=3 pts, 2nd=2 pts, 3rd=1 pt) hopes it encourages full honesty. However:
      *   **Manipulation is Different:** Voters can strategically *demote* a strong competitor they fear might beat their favorite by ranking them lower than their true preference, even below less viable candidates. If Alice (my 2nd choice) is a strong threat to my favorite Bob, I might rank Alice last to help Bob win, even if I slightly prefer her to Charlie.
      *   **Susceptible to Clones:** Introducing candidates very similar to an existing strong candidate can siphon points away from them.
      *   **No Condorcet Winner Guarantee:** A candidate who would beat every other candidate in a head-to-head matchup isn't guaranteed to win under Borda.

  ### Why You Keep Seeing It & The Principled Reason
  *   **Mathematical Law:** Gibbard-Satterthwaite isn't a fluke; it's a fundamental constraint. You aren't choosing "unlucky" rules; *all* non-dictatorial rules for ≥3 candidates are vulnerable.
  *   **Increased Sophistication:** Moving to RCV made voting *more* complex, creating new strategic opportunities. Complex rules often have more "angles" to exploit.
  *   **Member Engagement & Polarization:** Controversial elections increase the incentive for strategic voting. The member who proudly admitted manipulation demonstrates that your members are politically engaged and understand the system's levers. Polarization makes members more willing to harm their "lesser evil" to help their favorite win or stop a disliked candidate.
  *   **Small Size Amplifies Impact:** In a group of 200, a small bloc (like the member and her friends) can more easily perceive and execute a strategy that swings an election than in a group of millions.

  ### Practical Implications for Your Subcommittee
  1.  **Accept Imperfection:** There is **no perfect, strategy-proof system** for ≥3 candidates. Acknowledge this reality upfront. The goal is damage limitation and finding the *least bad* fit for your association's culture and size.
  2.  **Evaluate Trade-offs:** Each system fails differently:
      *   **Plurality:** Prone to vote-splitting, forces strategic "lesser evil" voting.
      *   **RCV (IRV):** Reduces vote-splitting but vulnerable to strategic ranking ("burying," "compromising").
      *   **Borda (Points):** Encourages fuller preference expression but vulnerable to strategic demotion of strong threats and cloning.
      *   **Condorcet Methods:** (Elects the candidate who beats all others head-to-head if one exists). Generally more resistant to many strategies but complex to explain/calculate and vulnerable to strategic nomination or "no-show" paradoxes.
  3.  **Consider "Spirit of the Law" vs. "Letter of the Law":** The strategic voter exploited the *letter* of RCV against its intended *spirit*. Could clearer voter guidelines or norms promoting honesty help? (Though enforcement is impossible).
  4.  **Focus on Process, Not Just Mechanics:**
      *   **Candidate Vetting/Nomination:** Could a nominations committee or higher signature thresholds ensure only serious, broadly acceptable candidates run? Reducing the field to 2-3 strong candidates minimizes strategic incentives.
      *   **Transparency & Trust:** Open discussions about the purpose of voting and the harms of manipulation might foster norms against it.
      *   **Accept Simplicity:** The "half-joking" member has a point. If complex systems invite complex manipulation, a simpler system (like majority runoff if no one gets 50%+ in plurality) *might* be preferable, accepting its known flaws. The key is stability and understanding.

  ### Recommendation
  1.  **Educate the Committee:** Start your next meeting by explaining Gibbard-Satterthwaite. Frame the discussion around "managing unavoidable trade-offs" rather than "finding the perfect solution."
  2.  **Audit Past Elections:** Simulate recent controversial elections under Borda and Condorcet methods. Did the "right" candidate win? Was manipulation *easier* or *harder*? Did it produce more consensus winners?
  3.  **Prioritize Values:** Ask:
      *   Is it more important to *always* elect a Condorcet winner (if one exists)?
      *   Is minimizing the "spoiler" effect the top priority?
      *   Is simplicity and ease of understanding paramount?
      *   How tolerant are we of complex strategies?
  4.  **Consider Hybrids/Alternatives:** Explore Approval Voting (vote for all candidates you find acceptable) or STAR Voting (Score, then Automatic Runoff). While also not strategy-proof, they have different properties and might align better with your goals.

  **In essence:** Your association is grappling with a universal democratic dilemma, not a series of self-inflicted wounds. No rule change will eliminate strategic voting entirely. The path forward involves choosing a system whose vulnerabilities your members can tolerate, fostering a culture of good faith participation, and accepting that no mathematical formula can perfectly translate individual preferences into a single, uncontestable group choice. Focus on finding the *most acceptable compromise mechanism* for your specific community.
