prompt: |-
  Been on a bit of a rabbit-hole binge lately re-reading old LessWrong posts, and I keep bumping into a tension nobody seems to resolve super cleanly. Aumann's agreement theorem gets cited constantly as the reason two rational people "can't agree to disagree," and people use it almost like a knock-down argument for epistemic modesty - defer more to the consensus, don't be so confident in your inside view, etc. But then theres Eliezer's whole "Inadequate Equilibria" thing where he goes after "modest epistemology" pretty hard, arguing that treating "smart/informed people disagree with me, so I should update a ton toward their position" as a general policy is often wrong, and sometimes just status-signalling dressed up as humility. This actually came up a couple weeks ago when a friend and I were arguing about whether I should just defer to superforecaster consensus on AI timelines instead of trusting my own inside-view model, and I realized I don't actually know how much weight Aumann's theorem is even supposed to put behind that kind of deference.

  So could you compare the actual content of Aumann's theorem (the math, and specifically the conditions it needs to go through - common priors, common knowledge of posteriors, honest full updating, that sort of thing) against this looser "modest epistemology" heuristic of deferring to expert/majority opinion whenever you disagree with it? I want to know exactly where the theorem stops supporting the heuristic and where people are basically borrowing its authority without earning it - like, is this mostly a case of an idealized math result getting used as a vibes-based rule of thumb, or is there a more legitimate bridge between them? If it's relevant, I'd also be curious whether Hanson's old paper on honest disagreement (I think it's literally called "Are Disagreements Honest?", might be misremembering) is doing that bridging work, or if it's really a separate argument entirely. Feel free to get technical - I can follow common-prior/Bayesian-updating stuff fine.
