answer: |-
  ## Memorandum: Recommendation for "Ethics and Professional Character" Course  
  **To:** Curriculum Committee, School of Business  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Proposed Resolution Regarding Program Review Recommendations & Course Revision  

  ### I. Context & Core Tension
  The external review rightly challenges us to align our ethics curriculum with empirical insights. The situationist critique—drawing on Milgram, Darley & Batson’s “Good Samaritan,” and Hartshorne & May—argues that behavior is heavily context-dependent, undermining the folk-psychological view of “stable character traits” as reliable behavioral predictors. This demands a substantive response. Simultaneously, the Compliance Office proposes replacing our course with a behavioral ethics model (e.g., Bazerman/Tenbrunsel) focused on situational nudges, decision frameworks, and environmental design, explicitly rejecting virtue/character language.  

  Our core tension: **Does situationist psychology invalidate virtue ethics as a foundation for professional ethics education?**  

  ### II. Reframing the Debate: Beyond False Binaries
  The choice is **not** between “virtue ethics ignores situations” or “behavioral ethics ignores character.” Both caricatures misrepresent the theories:  
  - **Virtue ethics (Aristotelian) already embeds situational sensitivity.** *Phronesis* (practical wisdom) is central—it is the cultivated capacity to *discern* the right action *within* complex contexts. Aristotle’s *Nicomachean Ethics* (Book VI) explicitly states virtue requires adapting principles to particulars.  
  - **Behavioral ethics does not eliminate agency.** While emphasizing situational forces, it still implies agents can (and should) design systems to mitigate bias—a form of responsible agency.  

  The valid critique is whether our *current course* adequately integrates empirical psychology. The review’s implication that virtue ethics is “falsified” by situationism requires scrutiny.  

  ### III. Addressing the "Unfalsifiability" Charge
  The claim that virtue ethics is unfalsifiable because it “retreats to *phronesis*” misunderstands the theory’s structure:  
  1. **It makes testable claims:** Virtue ethics predicts that:  
     - Cultivating virtues (e.g., courage, honesty) *increases the probability* of ethical behavior *across a range of situations* (not identically in all).  
     - Moral development involves progressive reliability in discernment (*phronesis*), which can be observed in longitudinal studies (e.g., professionals facing novel dilemmas).  
     - Certain traits (e.g., integrity) demonstrably correlate with leadership effectiveness and trust (e.g., work by Audi, Murphy).  
  2. **It is falsified if:**  
     - Character cultivation shows *no measurable impact* on ethical decision-making.  
     - Virtues (e.g., honesty) exhibit *zero stability* across *any* contexts after accounting for situations.  
     Data does not support this extreme view. Studies (e.g., Fleeson, Jayawickreme) show traits exhibit *both* stability *and* variability—people have “density distributions” of behaviors influenced by traits *and* situations. Virtue ethics accommodates this: character sets a *range* of possible responses, while *phronesis* refines situational application.  

  Situationism demonstrates *limits* of character, not its *irrelevance*. Virtue ethics remains falsifiable and empirically engaged.  

  ### IV. Why "Replace" is Suboptimal  
  While behavioral ethics offers valuable tools, **replacing** our course risks:  
  1. **Reducing ethics to risk management:** Framing ethics solely as avoiding bias/compliance undersells the aspirational, identity-forming role of ethics in leadership.  
  2. **Ignoring the "who" question:** Professionals need more than checklists; they need to *become* people who recognize when checklists fail (e.g., unprecedented dilemmas).  
  3. **Losing normative depth:** Virtue ethics provides a rich language for professional identity (“What kind of leader do I aspire to be?”) beyond avoiding errors.  

  ### V. Recommendation: Substantive Revision (Keep Core, Integrate Critiques)  
  **Move:** Retain the virtue/character foundation but **substantively revise** the course to fully integrate behavioral ethics and situationist insights.  

  **Proposed Revised Framework:** **"Virtue, Context, and Professional Agency"**  
  | **Module**                 | **Virtue Component**                          | **Behavioral/Situationist Integration**                     | **Pedagogy**                          |  
  |----------------------------|---------------------------------------------|-----------------------------------------------------------|--------------------------------------|  
  | Foundations                | Aristotle’s *phronesis*; virtues in business | Milgram/Zimbardo; System 1/System 2 thinking (Kahneman)    | Case study: When "good people" fail  |  
  | Cultivating Character      | Habituation; mentorship; narrative identity | Hartshorne & May; "situational self-awareness" training    | Reflective journals; role-playing    |  
  | Designing Ethical Contexts | Virtuous organizational culture             | Nudges; choice architecture; ethical systems design        | Group project: Redesign a process    |  
  | Crisis & Resilience        | Courage, integrity under pressure           | Bounded ethicality; moral disengagement mechanisms         | Simulations; post-failure analysis   |  

  **Why This Works:**  
  - **Empirically Robust:** Confronts situationism head-on while showing character’s role *alongside* context.  
  - **Philosophically Coherent:** Uses *phronesis* to bridge virtue and situation—wise agents *understand* and *shape* contexts.  
  - **Practically Relevant:** Prepares students to act ethically *and* build ethical systems.  
  - **Addresses Reviewers:** Directly engages cited studies without abandoning the course’s core mission.  

  ### VI. Counterargument & Mitigation  
  **Objection:** *"This still relies on an outdated view of character."*  
  **Response:** The revised course treats character not as a rigid "trait" but as a *dynamic capacity for wise agency*, developed through practice and sensitive to context—a view supported by contemporary virtue theorists (e.g., Nancy Snow) and empirical work on "situated virtues" (Merritt).  

  ### VII. Final Position  
  The situationist critique necessitates evolution, not surrender. Virtue ethics—properly understood—provides the **best foundation for cultivating professionals who navigate complexity with both skill and integrity**. Replacing it with a purely behavioral approach risks producing technically adept but normatively hollow graduates. **Revise the course; do not replace it.**  

  **Motion:** Approve the substantive revision of "Ethics and Professional Character" per Section V, with a redesign team formed by December 1.  

  ---  
  **Key Citations for Committee:**  
  - Aristotle, *Nicomachean Ethics* (esp. Book VI: Intellectual Virtues)  
  - Merritt, M. (2000) – "Virtue Ethics and Situationist Personality Psychology"  
  - Bazerman & Tenbrunsel (2011) – *Blind Spots*  
  - Snow, N. (2010) – *Virtue as Social Intelligence*  
  - Fleeson, W. (2004) – "Moving Personality Beyond the Person-Situation Debate"  

  This memo provides a decisive path forward that honors the review’s empirical rigor while defending the course’s philosophical value—transforming critique into renewal.
