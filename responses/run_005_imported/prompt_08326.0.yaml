  The release puzzle is subtle. If I promise you I'll φ, you "release" me while secretly hoping I'll still do it, and I don't φ - is it wrong? Assurance views might say no (assurance dissolved) but that makes obligation hinge entirely on the promisee's performative act, not mental states. Follow-up could ask if this turns release into a magical speech act.

