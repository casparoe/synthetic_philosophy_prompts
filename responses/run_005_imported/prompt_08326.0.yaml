answer: |-
  Here are seven probing questions for the Scanlonian assurance account, designed to test its boundaries, coherence, and distinctiveness, with follow-ups anticipating likely responses:

  1. **The Dying Friend & Timeless Assurance**  
     *Question:* In the "dying friend" case, where you promise to deliver $1,000 to their child but they die immediately after, no future reliance or ongoing assurance is possible. If the wrongness of breaking this promise persists, does your view imply that the *assurance itself* becomes a freestanding normative entity detached from any living mutual recognition? If so, how does this differ from a deontic constraint generated solely by the past act of promising?  
     *Likely Response:* "The assurance was fully established *at the moment of promising* and binds the promisor independently of the promisee’s continued existence."  
     *Follow-up:* If the assurance is "timeless," does this collapse the distinction between Scanlon’s account and conventionalist views that locate obligation in the promissory act itself?  

  2. **Assurance vs. Anti-Exploitation Norms**  
     *Question:* If breaking a promise is wrong because it exploits the promisee’s expectation (which the promisor invited), how is this distinct from wrongfully manipulating *any* expectation you’ve intentionally induced (e.g., falsely implying you’ll attend a party)? Does Principle F reduce promising to a mere instance of a broader moral norm against expectation-exploitation?  
     *Likely Response:* "Promises create a *special, reciprocal recognition* of obligation via the assurance, unlike casual expectations."  
     *Follow-up:* If a non-promissory assurance (e.g., "You can count on me") creates identical expectations and vulnerability, why would breaking it be *less* wrong than breaking a promise? Does the performative "I promise" add anything beyond emphasis?  

  3. **Release vs. Assurance: The Paradox of Unchanged Expectations**  
     *Question:* Suppose a promisee explicitly releases a promisor from a promise but privately maintains the same expectation. If the promisor breaks it, is it wrong? If *no* (as Principle F suggests, since assurance is dissolved), but the promisee is identically harmed/disappointed, does this show that the *will of the promisee* (through release) is what truly governs obligation—not the state of assurance?  
     *Likely Response:* "Release dismantles the mutual assurance; harm from disappointed expectations may still be wrong, but it violates a different norm (e.g., beneficence), not fidelity."  
     *Follow-up:* If the wrong of promise-breaking *only* occurs when assurance is undissolved, doesn’t this make the promisee’s power to release—not the assurance—the ultimate source of the promisor’s obligation?  

  4. **Trivial Promises & Proportionality**  
     *Question:* Can the assurance view explain the apparent permissibility of breaking trivial promises (e.g., "I promise to buy vanilla ice cream") when circumstances mildly change? If assurance is binary (created/dissolved), how does it accommodate degrees of wrongness without smuggling in reliance interests?  
     *Likely Response:* "Justification conditions allow for trivial promises to be broken when costs are disproportionate."  
     *Follow-up:* If justification hinges on cost to the *promisor*, doesn’t this abandon Scanlon’s rejection of reliance-based interests? If it hinges on the promisee’s interests, how is this not reliance?  

  5. **Mutual Recognition & Asymmetry**  
     *Question:* Must assurance be *mutually recognized*? If a promisor sincerely assures but the promisee doubts them (e.g., due to past lies), is a promise still created? If not, does this make promissory obligation depend on the promisee’s subjective attitude?  
     *Likely Response:* "Assurance requires the promisee’s uptake as a condition for obligation."  
     *Follow-up:* Doesn’t this undermine the idea that promisors *take on* obligations by their act? If obligation depends on the promisee’s psychology, is this still a voluntarist theory?  

  6. **Comparative Wrongfulness**  
     *Question:* Why is breaking a promise typically seen as *worse* than reneging on an equally strong non-promissory assurance? If both involve identical exploitation of expectations, what distinct "wrong-making feature" does the assurance view identify?  
     *Likely Response:* "The promissory framework creates a distinctive moral relationship of accountability."  
     *Follow-up:* If the added wrong stems *only* from the social practice of promising, does Scanlon’s view covertly rely on conventionalism?  

  7. **Coerced Promises and Voluntariness**  
     *Question:* If a promise is coerced (e.g., "Promise $1M or I’ll shoot you"), does Principle F still bind the promisor? If assurance was mutually recognized *despite* coercion, does this imply the account permits deeply exploitative obligations?  
     *Likely Response:* "Coercion voids the promise because the promisor’s commitment isn’t voluntary."  
     *Follow-up:* If voluntariness is a precondition for valid assurance, how is this different from will-based theories that ground obligation in autonomous commitment?  

  These questions target the theory’s core mechanics—forcing clarity on whether "assurance" is reducible to expectations, whether release is conceptually prior to assurance, and if the view can handle limit cases without retreating to will or convention. Each follow-up isolates a tension in the speaker’s likely defense, pushing the discussion toward deeper justifications.
