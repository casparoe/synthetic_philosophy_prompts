  Hmm... the dying friend case is classic but still potent. The key is framing it not just as "what about dead people?" but forcing a choice between two unpalatable options: either the obligation vanishes (undermining assurance) or persists mysteriously (requiring new foundations). The follow-up needs to press on whether "assurance" is being stretched beyond recognition.

