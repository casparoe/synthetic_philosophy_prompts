  An AI probe protagonist feels right—detached enough to embody "observerless beauty," yet capable of wrestling with human-like dilemmas. Naming it Surveyor-7 gives it a bureaucratic tinge, highlighting its original purpose versus emergent questions. Setting it near a dying star adds existential weight: beauty persisting against entropy mirrors Moore's "good-in-itself" argument. 

