answer: |-
  That's an excellent and insightful question – you've captured the core theoretical appeal of Kalai-Smorodinsky (KS). It *does* seem like a strict upgrade: Pareto, Symmetry, Scale Invariance, *plus* Monotonicity, while Nash lacks that crucial Monotonicity. **The primary reason Nash remains dominant, especially in allocation systems and core literature, is that KS *does not* preserve Nash's "Independence of Irrelevant Alternatives" (IIA) axiom.** This is the critical tradeoff.

  Let's break down the axioms and the practical implications:

  1.  **Independence of Irrelevant Alternatives (IIA):** This axiom states that if the bargaining solution is selected from a large feasible set `S`, and you consider a smaller subset `T` that still contains both the disagreement point `d` *and* the original solution point, then the solution should remain the same for the smaller set `T`.
      *   **Nash:** Satisfies IIA. The solution depends *only* on `d` and the shape of the feasible set *immediately around the solution point itself*. Removing "distant" alternatives that weren't chosen doesn't change the outcome.
      *   **Kalai-Smorodinsky:** **Violates IIA.** The KS solution depends critically on the **ideal point (u1_max, u2_max)**. This ideal point is defined as the maximum utility each player could get *if the other player conceded everything*. If you shrink the feasible set `S` to a smaller set `T` that still contains the original KS solution and `d`, but where the *ideal point* within `T` is lower than in `S`, the KS solution for `T` will be *different* (and generally "worse" for both players) than the original KS solution selected from `S`. Removing alternatives that weren't chosen *can* change the outcome.

  **Why Violating IIA is a Big Deal (Practically and Theoretically):**

  *   **Sensitivity to Feasible Set Definition:** KS is highly sensitive to how the "universe" of possible allocations (`S`) is defined. Adding or removing theoretically possible (but perhaps unrealistic or dominated) allocation points can drastically alter the ideal point and thus the final KS solution, *even if those points weren't going to be chosen anyway*. This makes the solution less robust and more dependent on the precise modeling of the bargaining space.
  *   **Computational & Dynamic Challenges:** In dynamic allocation systems like yours, the feasible set `S` isn't static. Tenants arrive/depart, resource availability fluctuates, constraints change. With KS, *any change* to `S`, even adding an allocation point that is Pareto-dominated and would never be chosen, *changes the ideal point* and potentially forces a complete recalculation of the solution. Nash, satisfying IIA, is more stable – changes to distant parts of `S` don't affect the solution as long as the region near the current solution and `d` remains feasible.
  *   **Philosophical/Objection:** IIA embodies a principle of "locality" in decision-making. The solution should be determined by the options *relevant* to the disagreement point and the potential agreement, not by options that are clearly worse for everyone. KS's dependence on the global maxima can be seen as allowing irrelevant, dominated alternatives to influence the outcome.

  **Other Practical Considerations:**

  1.  **Computational Complexity:**
      *   **Nash:** Typically involves solving a convex optimization problem (maximizing the product `(u1 - d1)*(u2 - d2)*...*(un - dn)` over the feasible set `S`). Efficient algorithms exist, especially for convex sets.
      *   **Kalai-Smorodinsky:** Requires finding the ideal point (`u1_max, u2_max, ..., un_max`). This involves solving `n` separate maximization problems: maximize `u_i` subject to `u_j >= d_j` for all `j`. For complex feasible sets, this can be computationally more intensive than the single Nash optimization, especially as `n` grows. While often tractable, it's a factor.

  2.  **Interpretability & Focus:**
      *   **Nash:** Focuses on maximizing the *product* of gains. This inherently balances absolute gains and relative ratios, often leading to intuitively "fair" proportional splits *relative to the disagreement point*.
      *   **Kalai-Smorodinsky:** Focuses on equalizing the *ratio* of achieved gain to maximum possible gain (`(u_i - d_i)/(u_i_max - d_i)`). This ensures proportional gains relative to potential, which is a strong fairness notion. However, this proportional focus relative to *individual maxima* can sometimes lead to allocations that feel counter-intuitive if one player's maximum potential gain is vastly larger than another's, even if the disagreement point suggests a different baseline proportionality. Its behavior under strong asymmetry can be less predictable.

  3.  **Historical Momentum & Literature Focus:** Nash bargaining has a longer history, deeper theoretical roots in game theory and economics, and a vast literature exploring its properties, generalizations, and applications. This creates inertia. Many fundamental results and comparative statics are derived using Nash.

  **Why Monotonicity Matters (and Why KS is Still Important):**

  You are absolutely right that the lack of Monotonicity in Nash is a significant flaw. The classic example is: Suppose you start with a feasible set `S1` where the Nash solution is (50, 50). Now, expand the set to `S2` by adding points where Player 2 can get much more (e.g., (0, 100)), but Player 1's options haven't improved. The Nash solution for `S2` might *still* be (50, 50), or even shift *against* Player 1! Player 1 gets *no benefit* (or even loses) from an expansion that only benefited Player 2. KS *guarantees* Player 1 won't be worse off, and Player 2 will get strictly more. This aligns strongly with fairness intuitions in expanding resource scenarios.

  **Conclusion: The Tradeoff is Real**

  While KS elegantly fixes Nash's monotonicity problem and satisfies the other core axioms (Pareto, Symmetry, Scale Inv.), **it does so at the cost of sacrificing Independence of Irrelevant Alternatives (IIA).** This violation has significant practical consequences:

  1.  **Robustness:** KS is more sensitive to the precise definition of the feasible set.
  2.  **Stability:** KS is less stable under dynamic changes to the feasible set.
  3.  **Computation:** Finding the ideal point can add overhead.

  Nash's adherence to IIA makes it more computationally stable in dynamic environments and less sensitive to modeling choices regarding dominated alternatives. Its long history and focus on proportional gains relative to the disagreement point also contribute to its persistence.

  **Recommendation for Your Scheduler:**

  1.  **Analyze Feasible Set Dynamics:** How volatile is your `S`? Do irrelevant dominated points frequently enter/exit? If `S` is very dynamic and dominated points are common, Nash's IIA might offer significant stability benefits.
  2.  **Assess Monotonicity Importance:** How critical is it that a tenant *never* loses out when the overall resource pool grows or another tenant's *potential* max increases? If this is paramount, KS's monotonicity is a strong argument.
  3.  **Benchmark Complexity:** Profile the computational cost of finding the ideal point (KS) vs. maximizing the product (Nash) for your typical problem size and feasible set complexity.
  4.  **Consider Hybrids/Context:** Explore if one solution fits most scenarios, or if different rules are needed for different contexts (e.g., KS for baseline fair splits when resources increase, Nash for renegotiations within a fixed pool). Look into solutions like the Egalitarian solution or Proportional Fairness (which is often equivalent to Nash in some formulations) as other alternatives.

  The choice isn't clear-cut. KS is a theoretically compelling solution addressing a real weakness in Nash, but the violation of IIA is a substantial practical and theoretical cost that explains why Nash remains the default workhorse in many allocation systems and core economic theory. Your recognition of monotonicity as crucial highlights a valid concern, and KS is absolutely a strong candidate worth serious consideration for your scheduler if stability under feasible set changes isn't the overriding priority.
