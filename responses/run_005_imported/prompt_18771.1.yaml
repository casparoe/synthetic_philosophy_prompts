  I should start by sharply differentiating their projects. P.F. cares about *why we actually hold people responsible* (psychological/social explanation), while Galen cares about *whether we're ever justified* in doing so (metaphysical grounding). The "could both be true" angle is crucial here—I need to show how P.F.'s descriptive account can function perfectly well even if Galen's skepticism about ultimate responsibility is correct. 

