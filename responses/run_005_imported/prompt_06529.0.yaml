  ## David Hume's Clean Break: The Architect of Free Trade Trapped in Mercantilist Skin

  Your retired econ professor has seized upon a profound truth: David Hume delivered a devastating, systemic critique of mercantilism's core fallacies that fundamentally reshaped economic thought. His arguments in "Of the Balance of Trade," "Of the Jealousy of Trade," and "Of Money" provide the bedrock for classical free trade theory. **Hume absolutely made a clean, theoretical break from mercantilism.** However, your astute reading reveals the crucial caveat: **this clean break exists within the pristine logic of his system, while his psychological instincts and observations of real-world dynamics were often still entangled in the mercantilist anxieties he sought to dismantle.** The worm isn't in his theory; it's in the tension between his brilliant system and his residual mercantilist *weltanschauung*.

  **The Unassailable Core: Hume's Clean Break**

  Hume's demolition of mercantilism rests on two revolutionary pillars:

  1.  **The Self-Correcting Mechanism (Price-Specie Flow):** This is the "famous bit," but its radicalism must be appreciated. Hume demonstrated that the mercantilist obsession with accumulating specie (gold/silver) was self-defeating. An influx of money, he argued ("Of Money," "Of the Balance of Trade"), inevitably raises domestic prices relative to other nations. This makes exports dearer and imports cheaper, reversing the trade surplus and causing specie to flow *out* until equilibrium is restored. Conversely, a specie drain lowers prices, boosting exports and attracting money back in. **The system is inherently self-regulating.** Hoarding specie or fearing deficits was not only futile but counterproductive to national wealth, which Hume correctly identified as the productive capacity of the people and land, *not* the stock of precious metals. This dynamism shattered the mercantilist zero-sum game.

  2.  **The Futility and Danger of "Jealousy of Trade":** In the essay explicitly bearing this title, Hume attacks the mercantilist mindset that saw a neighbor's economic growth as a threat. He argues this jealousy is "a narrow and malignant opinion," blinding nations to the reality that prosperous neighbors become *better* trading partners. Increased industry and wealth abroad create larger markets for one's own goods and stimulate domestic industry through competition and emulation. "I shall therefore venture to acknowledge," Hume declares, "that, not only as a man, but as a BRITISH subject, I pray for the flourishing commerce of GERMANY, SPAIN, ITALY, and even FRANCE itself." **This is the essence of the positive-sum game – mutual enrichment through specialization and exchange, not plunder or suppression.** He explicitly states that attempting to impoverish neighbors through trade barriers harms oneself more.

  **The Lingering Shadow: Mercantilist Instincts in a Free Trade Framework**

  Despite this powerful theoretical edifice, you've rightly identified passages where Hume seems to flirt with the very anxieties he condemns:

  1.  **The "Rising Money Supply Advantage" ("Of Money"):** Hume observes that an *influx* of money stimulates industry *before* prices fully adjust: "The good policy of the magistrate consists only in keeping it [money], if possible, still encreasing; because by that means he keeps alive a spirit of industry in the nation." This *does* sound like seeking a relative advantage. However, **this is not a mercantilist policy prescription; it's a description of a dynamic adjustment process *within* his self-correcting system.** He is *not* advocating policies to *permanently* inflate the money supply or run perpetual surpluses. He knows the price adjustment *will* happen, eroding the temporary advantage. The "spirit of industry" is the real benefit he highlights, not the fleeting competitive edge. It's a recognition of monetary non-neutrality in the short run, not a retreat to mercantilist goals. Crucially, he attributes this inflow to sound industry and good governance, not protectionism or hoarding.

  2.  **Anxiety Over Manufacturing Flight ("Of the Jealousy of Trade"):** Hume concedes that "manufactures... gradually shift their places" and worries that a wealthy nation, with higher labor costs, might lose industries to poorer rivals where "the labour and commodities are cheaper." This seems like the "relative-advantage-over-the-neighbors logic" he supposedly killed. **Here, the mercantilist worm surfaces most visibly, not in theory, but in Hume's psychological and political realism.** He acknowledges a potential downside of the very dynamic process he champions. However, note his crucial framing:
      *   He presents this as a *natural consequence* of free trade and development, not an argument against it.
      *   He immediately argues that even if manufacturing flees, the wealthy nation *still* benefits overall through cheaper imports and potentially higher-value industries ("the refinements of luxury").
      *   His primary concern isn't the economic loss *per se*, but the *political instability* it might cause: "The poverty of the common people is a natural, if not an infallible effect of... high prices... and may induce the state itself to tremble." He fears the *reaction* – the rise of destructive "jealousy" and protectionism – more than the economic shift itself.

  **The Verdict: Break with Theory, Haunted by Ghosts**

  **Hume achieved a clean *theoretical* break from mercantilism.** He demolished its core tenets – the necessity of specie hoarding, the perpetual pursuit of trade surpluses, the zero-sum view of international commerce, and the policy of suppressing neighbors. He established the self-correcting mechanism of trade balances and powerfully articulated the positive-sum nature of free exchange and prosperous neighbors.

  **However, Hume the keen observer of human nature and political economy could not fully escape the mercantilist *zeitgeist*.** His description of the temporary benefits of a rising money supply, while logically consistent within his dynamic model, *sounds* like the relative advantage sought by mercantilists. More significantly, his palpable anxiety about the *political consequences* of manufacturing flight – the potential for domestic unrest and a resurgence of destructive "jealousy" – reveals a mind still wrestling with the real-world implications of his own theory. He understood the system's logic but feared the human and political friction it might encounter. This isn't a theoretical worm in the fruit; it's the shadow of the old paradigm clinging to the architect of the new.

  **For Your Professor:** His hero-worship has a solid foundation. Hume *did* provide the essential framework that dismantled mercantilism and paved the way for Smith, Ricardo, and modern trade theory. The "rising money" point is a subtlety within that framework, not a contradiction. However, the professor is likely overlooking, or rationalizing away, Hume's genuine anxieties about industrial relocation and political instability – anxieties that stem from a mercantilist-infused view of national strength tied to visible manufacturing prowess and employment. This tension makes your character *perfect*: he grasps Hume's revolutionary core but, like Hume himself in his weaker moments, might be downplaying the residual mercantilist ghosts that haunted even the great skeptic when faced with the messy reality of economic change. His insistence on a *pure*, uncontaminated Hume is ironically a simplification Hume himself, with his psychological acuity, might have questioned.
