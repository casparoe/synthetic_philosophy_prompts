answer: |-
  ## The Unprofitable Monopoly
  The ledger lay open on Duncan MacAllister’s mahogany desk like a gaping wound. Columns that should have pulsed with figures – hogsheads shipped, duties paid, profit realised – were choked with question marks and the stark, damning notation: *Interdicted. War.* The air in the counting-house, usually thick with the scent of ink, tobacco dust, and ambition, felt thin, stale. Outside, a persistent Glasgow drizzle blurred the view of the Clyde, where ships sat idle, their masts a skeletal forest against the grey sky. 1776 had dawned, and with it, the suffocation of Duncan’s world.

  His father, Alistair, the original "Tobacco Lord" (though they’d never used the nickname themselves, finding it vulgar), had built this fortune brick by golden brick. Chesapeake leaf, bought cheap under the protective mantle of British monopoly and Navigation Acts, shipped to Greenock, then re-exported at a fat profit to Rotterdam, Bordeaux, Hamburg. It paid for the fine Georgian townhouse on Queen Street, its Adam fireplace a marvel. It endowed the MacAllister Chair of Moral Philosophy at the University, a gesture of civic pride that still swelled Duncan’s chest. It bought the silver service gleaming in his dining room, the Gainsborough portrait of his late mother, the quiet certainty that the MacAllisters were pillars of Glasgow’s burgeoning prosperity.

  Now, the American rebellion had strangled the supply. Orders unfilled. Debts mounting. Creditors, once fawning, now tapped impatient fingers. Duncan ran a hand over the smooth, cool ledger cover, a trophy from better times. His gaze drifted to the small, unassuming volume beside it, its spine cracked from recent, agitated reading: *An Inquiry into the Nature and Causes of the Wealth of Nations* by Adam Smith. A former colleague at the University, a man Duncan had known slightly, respected immensely. A man whose arguments now felt like ice water trickling down his spine.

  *"The monopoly of the colony trade… has… necessarily drawn towards that trade a much greater proportion of the capital of Great Britain than what would naturally have gone to it… It has broken that natural balance which would otherwise have taken place among all the different branches of British industry."*

  Smith’s words echoed. "Natural balance." Duncan looked around his counting-house, the tangible proof of *un*natural success. The polished brass scales, the maps charting monopolised routes, the ledgers detailing profits extracted not just from leaf, but from the very system that confined the trade. Had it been… *efficient*? Or merely privileged? A cold prickle started at the base of his skull. He thought of the taxes – his own included – that funded the Navy frigates patrolling those routes, suppressing smugglers (who Smith oddly sympathised with), fighting wars in distant lands to protect this exclusive right to buy and sell. Wars that now threatened to consume the whole enterprise. *"A project… expensive… not… likely to bring any profit…"* Smith had written, specifically about defending the colonies. Duncan felt a surge of defensive anger. Glasgow *had* profited! Look at the city! Look at his house!

  A knock shattered the silence. Young Andrew, his chief clerk, face pale. "Mr. MacAllister, sir… word from Greenock. The *Clydeside Lass*. Taken. By an American privateer off the Lizard. The entire cargo, sir. Insured, but…" Andrew trailed off. The insurance premiums were crippling, the underwriters nervous, the payout uncertain and slow. Another vessel lost. Another thread of the lifeline severed.

  Duncan dismissed him with a curt nod, the anger dissolving into a leaden fatigue. He picked up Smith again, flipping pages almost accusingly.

  *"Under the present system, Great Britain derives nothing but loss from the dominion which she assumes over her colonies."*

  "Nothing but loss?" Duncan muttered. He thought of his father, arriving in Glasgow with little but ambition, leaving Duncan a gentleman. He thought of the intricate network: the factors in Virginia (their letters increasingly desperate, outlining rebel confiscations), the warehousemen here, the coopers, the carters, the clerks like Andrew – all sustained by the golden stream of tobacco. Glasgow *was* tobacco. To call it a *loss* felt like a personal insult, a denial of his father’s life, his own stewardship.

  He stood abruptly, needing air, needing to see the city his fortune helped shape. He walked briskly down the Saltmarket, past the grand new warehouses built with tobacco profits – solid, imposing testaments to success. He crossed the bridge into the older, narrower streets, where the smell of damp stone and poverty lingered. He passed the University, pausing near the imposing new wing. *His* family name was on the foundation stone of the Philosophy building. He remembered his father’s pride the day it was laid, the speeches lauding the MacAllisters as benefactors, engines of progress. Adam Smith had likely been there, Duncan realised with a jolt. Polite, perhaps even grateful for the endowment, even as his mind dissected the very economic engine that paid for it.

  The dissonance was a physical pressure behind his eyes. The pride was real, bone-deep. The MacAllisters *had* built, they *had* contributed, they *were* respected. That wasn't illusion. Yet, Smith’s relentless logic seeped in, cold and clear. *Who truly paid?* The colonists, chafing under trade restrictions? The British shopkeeper taxed to fund wars guarding a monopoly that inflated his own costs? The slaves… Duncan shoved that thought down, a reflexive habit. Smith mentioned them only peripherally, focusing on the *system’s* inefficiency, not its human horror. But the system depended on them, a truth as undeniable as the leaf itself. Was his fine house, the University wing, the very order of his life, built not just on trade, but on a colossal, state-subsidised inefficiency? An edifice paid for by unseen, distant others?

  Back in the hushed grandeur of Queen Street, the tension coiled tighter. His wife, Elspeth, poured tea in the drawing-room, the silver pot catching the firelight. "Any news, Duncan?" Her voice was carefully neutral, but he saw the worry in the tightness around her eyes. The Gainsborough portrait of his mother gazed serenely down. The Adam fireplace, a masterpiece of proportion and elegance, radiated a gentle warmth. All bought with tobacco. All suddenly feeling… precarious. Less like solid achievements, more like artefacts of a vanishing era.

  "No good news, Elspeth," he said heavily, sinking into a chair. He picked up a small silver snuffbox from a side table, another relic of the trade, its lid engraved with a tobacco plant. He didn't open it. "The *Lass* is gone. Privateers."

  Elspeth sighed, a soft sound of resignation. "Andrew looked devastated when he left earlier. His father worked the docks, didn’t he? Before we took him on?"

  Duncan nodded, the clerk’s anxious face superimposing itself over the image of idle dockworkers, coopers laid off, factors ruined in Virginia. Smith’s indictment echoed: *"…benefited a narrow class… while ordinary British taxpayers covered the cost…"* Andrew *was* the ordinary Glaswegian, his livelihood utterly dependent on the monopoly Duncan represented. Was that benefit, or shared vulnerability built on sand?

  He picked up Smith’s book again, not opening it, just feeling its weight. Published last year. 1776. The year the world he knew began to end. Smith argued Britain would be *better off* letting the colonies go. Duncan had scoffed when he first read it. Treasonous folly! Now, staring at the cold, empty fireplace, the argument held a terrifying, icy logic. The war was bleeding them dry, defending a trade that had ceased to exist. The monopoly, the very source of his pride, was now the millstone dragging him, his city, perhaps his nation, under.

  He wasn’t converted. Smith’s free trade utopia felt abstract, untested. The visceral reality was loss: of ships, of income, of certainty, of the world his father built. The pride in the townhouse, the University endowment, the very name MacAllister – it warred violently with the chilling suspicion that Smith might be *economically* right, even if the thought felt like a betrayal. The moral unease about the foundations – the distant wars, the unseen costs, the human toll obscured by ledgers and luxury – was a quieter, more insistent whisper beneath the louder roar of impending ruin.

  He looked out the window at the darkening Glasgow street. The empire *was* slipping away, regardless of who was right about trade. The fortune *was* evaporating, regardless of whether it was built on genius or grafted privilege. The comfortable certainty of his place in the world was crumbling. Duncan MacAllister, Tobacco Lord, sat amidst the tangible symbols of his success, feeling the profound weight of the unanswerable question: Had it all been worth it? Not in moral terms, but in the cold, hard calculus of national gain Smith proposed? And did the answer even matter now, as the foundations trembled and the edifice, splendid as it was, began to crack? The pride remained, a stubborn ember. But it was now ringed by the encroaching cold of doubt and the deafening silence of empty ledgers. The wealth of nations felt like a theory; the impoverishment of Duncan MacAllister was becoming a very concrete fact.
