  We are ranking the following positions based on how well they solve Newton's bucket puzzle (explaining why water becomes concave when rotating relative to the bucket even when the relative motion between water and bucket has stopped, but the water is rotating relative to the fixed stars or absolute space). The puzzle challenges relational views because the water's state (concave surface) doesn't depend solely on the relative motion between water and bucket.

