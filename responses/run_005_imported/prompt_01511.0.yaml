prompt: |-
  Quick betting question that's been bugging me. Say there's a repeated coin-flip bet where I win 55% of the time and double my stake, but lose the whole stake the other 45% — so the average return per round is clearly positive. My friend says that means the mathematically smart move is to bet 100% of my bankroll every single round, since that maximizes my expected winnings. I actually tried a version of this for a couple weeks and got wiped out completely, twice. He says thats just bad variance and the math still favors going all in every round. Meanwhile another friend plays the identical bet but only ever risks about a tenth of her bankroll per round, and shes been slowly and steadily up the whole time instead of busting — he thinks she's just being overly cautious and leaving money on the table. Something about his reasoning feels off to me but I can't quite pin down what's wrong with it. Who's actually thinking about this correctly?
reasoning: |-
  I need to figure out this betting situation. The bet is simple: I win 55% of the time and double my stake, so I get back twice what I bet. I lose 45% of the time and lose the whole stake. The expected return per bet is positive because (0.55 * 2) + (0.45 * 0) = 1.10, which means a 10% expected profit per bet. So on average, I should make money.

  My friend says that to maximize expected winnings, I should bet 100% of my bankroll every round. He argues that since the expected value is positive, betting more means I make more money on average. But when I tried it, I went bust twice quickly. He says that's just bad luck or variance, and the math still favors all-in betting.

  Another friend bets only about 10% of her bankroll each time and has been making steady profits without busting. The first friend thinks she's too cautious and missing out on higher expected returns.

  I suspect that the issue is related to the risk of ruin. Even though the expected value is positive, betting too much can lead to a high probability of losing everything because of the volatility.

  Let me think about the expected value of the bankroll after many bets.

  Suppose I start with a bankroll of B. If I bet fraction f of my bankroll each time.

  When I win, my bankroll becomes B * (1 + f) because I get double the stake, so I gain f*B, so new bankroll is B + f*B = B(1+f).

  If I lose, I lose f*B, so new bankroll is B - f*B = B(1-f).

  Now, the expected value after one bet: with prob 0.55, bankroll is B(1+f), with prob 0.45, bankroll is B(1-f).

  So expected bankroll after one bet: 0.55 * B(1+f) + 0.45 * B(1-f) = B [ 0.55(1+f) + 0.45(1-f) ] = B [ 0.55 + 0.55f + 0.45 - 0.45f ] = B [1 + 0.10f]

  Since 0.55 + 0.45 = 1, and 0.55f - 0.45f = 0.10f.

  So E[new B] = B (1 + 0.10f)

  That means the expected bankroll grows by a factor of (1 + 0.10f) each bet.

  If I bet fraction f every time, after n bets, the expected bankroll is B * (1 + 0.10f)^n.

  But this is the expected value, not the typical value. Because the bankroll can vary a lot due to variance.

  In particular, if I bet f=1, that is, 100%, then E[new B] = B (1 + 0.10*1) = 1.10 B, so it grows 10% per bet on average.

  But when I bet 100%, if I win, I double, so B becomes 2B. If I lose, I go to 0. So with prob 0.55, I have 2B, with prob 0.45, I have 0. So expected value is 0.55*2B + 0.45*0 = 1.10B, yes.

  But after one bet, I have either 2B or 0. If I have 0, game over. If I have 2B, and I bet again, all-in, then after two bets, if I won both, I have 4B, but prob (0.55)^2, or if I lost first, 0, or won first then lost, 0. So only if I win both, I have 4B, else 0. Prob of not busting after n bets is (0.55)^n, which goes to zero as n increases. So almost surely, I will eventually go bust.

  In fact, with all-in betting, the probability of ruin is 1 in the long run because I will lose at some point with prob 1.

  But the expected value is high because when I don't go bust, I have a huge bankroll, but since I go bust with prob 1, the expected value calculation might be misleading.

  For example, after many bets, say n large, E[bankroll] = B * (1.10)^n, which is huge, but P(bankroll > 0) = (0.55)^n, which is tiny, and when bankroll > 0, it is B * 2^n, so E[bankroll] = P(survive) * 2^n B + P(ruin) * 0 = (0.55)^n * 2^n * B = (0.55 * 2)^n B = (1.10)^n B, which matches.

  But for any finite n, E[bankroll] is large, but the probability of actually having money is small. In the long run, ruin is certain.

  So for practical purposes, betting all-in is terrible because you almost surely lose everything, even though expected value is high.

  Now, what about betting a fraction f each time.

  Then the bankroll changes multiplicatively.

  Let me denote the growth factor per bet.

  After one bet, bankroll is B * (1+f) with prob 0.55, or B * (1-f) with prob 0.45.

  So the multiplicative factor is either (1+f) or (1-f).

  After n bets, the bankroll is B times the product of n such factors, each being (1+f) or (1-f).

  Now, the long-term growth rate is determined by the geometric mean of these factors.

  For maximizing the median or typical outcome, we should maximize the expected logarithm of the bankroll, which is the Kelly criterion.

  Kelly criterion maximizes the growth rate.

  Let me compute the expected log return.

  After one bet, the log bankroll change: ln(new B / B) = ln(1+f) with prob 0.55, or ln(1-f) with prob 0.45.

  So expected value of log change: 0.55 * ln(1+f) + 0.45 * ln(1-f)

  This is the expected logarithm of wealth.

  To maximize the long-term growth rate, we maximize this expression with respect to f.

  Let g(f) = 0.55 * ln(1+f) + 0.45 * ln(1-f)

  We need to find f that maximizes g(f).

  Take derivative: g'(f) = 0.55 * (1/(1+f)) + 0.45 * (-1/(1-f)) = 0.55/(1+f) - 0.45/(1-f)

