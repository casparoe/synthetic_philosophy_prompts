answer: |-
  The core issue here revolves around the difference between maximizing expected value (EV) in a single bet versus optimizing for long-term growth and sustainability in repeated betting. Your friend who advocates for betting 100% of the bankroll every round is focusing solely on the expected value per bet, which is indeed positive (a 10% average return, as calculated from 0.55 * 2 + 0.45 * 0 = 1.10). However, this approach ignores the high risk of ruin (going bust) due to the multiplicative nature of repeated betting and the variance in outcomes. Let's break this down step by step.

  ### 1. **Why Betting 100% (All-In) Is Mathematically Flawed for Repeated Bets**
     - **Expected Value vs. Risk of Ruin**: 
       - While the EV per bet is 10% when betting all-in, the actual outcome is binary: you either double your bankroll (with 55% probability) or lose everything (with 45% probability). After multiple rounds, the probability of eventual ruin approaches 100% because you only survive if you win every single bet. For example:
         - After 1 bet: Probability of ruin = 45%.
         - After 2 bets: Probability of ruin = 1 - (0.55)^2 = 1 - 0.3025 = 69.75%.
         - After 10 bets: Probability of ruin = 1 - (0.55)^10 ≈ 1 - 0.0025 = 99.75%.
       - Even though the EV grows exponentially (e.g., after *n* bets, EV = starting bankroll * (1.10)^n), this is driven by the extremely unlikely scenario of winning all bets. In reality, you'll almost certainly go bust long before *n* gets large. Your experience of getting wiped out twice is not just "bad variance"—it's the expected outcome for this strategy over time.
     - **Growth Rate is Negative**: The key metric for repeated bets is the expected logarithm of wealth growth (often called the geometric growth rate). For all-in betting, this is:
       - 0.55 * ln(2) + 0.45 * ln(0) = 0.55 * 0.693 + 0.45 * (-∞) = -∞.
       - This means the long-term growth rate is effectively negative infinity, leading to certain ruin. No matter how positive the EV seems, betting all-in is unsustainable.

  ### 2. **Why Betting a Fraction (Like 10%) Is Better for Long-Term Growth**
     - **The Kelly Criterion**: This is a mathematical framework for optimizing bet sizing in repeated favorable bets. It maximizes the expected logarithm of wealth, which corresponds to maximizing long-term growth and minimizing the risk of ruin. For your bet (55% win probability, double-or-nothing), the Kelly fraction is calculated as:
       - Edge = win probability - loss probability = 0.55 - 0.45 = 0.10 (or 10%).
       - Since the win multiplies your stake by 2 (a gain of 100%, so *b* = 1 in Kelly terms), the optimal fraction is edge / *b* = 0.10 / 1 = 0.10, or 10% of your bankroll per bet.
     - **Advantages of Betting 10%**:
       - **Positive and Stable Growth Rate**: The expected log growth per bet is:
         - 0.55 * ln(1 + 0.10) + 0.45 * ln(1 - 0.10) = 0.55 * ln(1.1) + 0.45 * ln(0.9) ≈ 0.55*0.0953 + 0.45*(-0.1054) ≈ 0.005 (or 0.5% per bet).
         - This means your wealth grows exponentially at about 0.5% per bet on average, with much lower variance. After many bets, your bankroll will likely be close to the expected value.
       - **Low Risk of Ruin**: Because you're only betting 10%, your bankroll never hits zero (it can only approach it asymptotically). The probability of your bankroll falling to a small fraction (e.g., 1% of starting value) is very low. Your other friend's steady gains reflect this—she's not being overly cautious; she's following a strategy that balances growth and sustainability.
       - **Comparison of Growth**: 
         - Betting 10%: Expected bankroll after *n* bets grows as (1.01)^n (since EV multiplier per bet is 1 + 0.10*0.10 = 1.01).
         - Betting 100%: Expected bankroll grows as (1.10)^n, but this is irrelevant because ruin is almost certain.
         - In practice, the 10% strategy will outperform all-in over time because it avoids ruin and compounds steadily.

  ### 3. **Why Your Friend's Reasoning is Misleading**
     - **"Maximizing EV" Ignores Real-World Outcomes**: Your first friend is correct that betting 100% maximizes the expected value *per bet*, but this is a myopic view. For repeated bets, EV alone doesn't account for:
       - **Risk of Ruin**: Once you're bankrupt, you can't continue betting, so you miss out on future opportunities.
       - **Utility of Wealth**: People are risk-averse—losing everything is more painful than gaining a lot is pleasurable. Logarithmic utility (used in Kelly) captures this by favoring strategies that protect against large losses.
       - **Distribution of Outcomes**: With all-in betting, the median outcome (the typical result) is zero after a few bets, while the average is skewed high by rare, huge wins. For sustainable wealth, the median matters more.
     - **"Leaving Money on the Table" Misconception**: Your first friend claims that betting 10% is too conservative, but underbetting (e.g., 5%) does slow growth compared to Kelly, while overbetting (e.g., 20%) reduces growth and increases risk:
       - At 20%: Expected log growth ≈ 0.55 * ln(1.2) + 0.45 * ln(0.8) ≈ -0.00014, meaning wealth declines on average.
       - At 10%, growth is maximized—betting less or more reduces it. Your second friend's 10% strategy isn't leaving money on the table; it's capturing the optimal balance for compound growth.

  ### 4. **Who is Thinking Correctly?**
     - **Your Second Friend (10% Bettor)**: She is correct. By betting the Kelly fraction (10%), she maximizes long-term growth, minimizes the risk of ruin, and ensures steady, sustainable profits. Her strategy accounts for the multiplicative dynamics of repeated betting.
     - **Your First Friend (All-In Bettor)**: His reasoning is flawed for repeated bets. While the math for a single bet supports all-in, it fails catastrophically over multiple rounds due to variance and ruin risk. His dismissal of your busts as "bad variance" misses the point—variance is a critical factor that must be managed.

  ### Practical Advice
  - **Stick with Fractional Betting**: For this bet, 10% of your bankroll per round is mathematically optimal. If you're risk-averse, you can bet slightly less (e.g., 5–7%) for even lower volatility, but avoid overbetting.
  - **Monitor Your Bankroll**: Always adjust your bet size based on your current bankroll (e.g., bet 10% of what you have now, not the starting amount). This ensures you benefit from compounding.
  - **Real-World Variance**: Even with optimal betting, losing streaks happen. But at 10%, a string of losses won't wipe you out quickly. For instance, losing 10 bets in a row at 10% per bet reduces your bankroll to about (0.9)^10 ≈ 35% of starting value, allowing recovery.

  In summary, the all-in strategy is a recipe for ruin in repeated play, while fractional Kelly betting (10%) optimizes growth and sustainability. Your second friend's approach is the mathematically sound one for long-term success.
