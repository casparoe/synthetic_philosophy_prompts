  Compute: ln(1.1) ≈ 0.095310, ln(0.9) ≈ -0.105361

  So g(f) = 0.55 * 0.095310 + 0.45 * (-0.105361) = 0.0524205 - 0.04741245 = 0.00500805

  So expected log return per bet ~ 0.005, which is about 0.5%, so exponential growth at about 0.5% per bet.

  After many bets, wealth grows like exp(0.005 n)

  Now, if I bet more, say f=0.20, then g(f) = 0.55 * ln(1.2) + 0.45 * ln(0.8)

  ln(1.2) ≈ 0.182322, ln(0.8) ≈ -0.223143

  g(f) = 0.55*0.182322 + 0.45*(-0.223143) = 0.1002771 - 0.10041435 = -0.00013725

  Negative! So expected log return negative, meaning wealth decreases over time almost surely.

  For f=0.20, g(f) ≈ -0.000137, so it will tend to zero.

  Similarly, for f=1, g(f) = 0.55 * ln(2) + 0.45 * ln(0)

  But ln(0) is undefined, or -infinity, so g(f) = -infinity, which is bad.

  So for f > Kelly, growth rate negative, ruin certain.

  For f < Kelly, growth positive but slower.

  Kelly fraction f=0.10 is optimal for growth.

  Now, back to expected value.

  If I bet f fraction, expected bankroll after n bets is B * (1 + 0.10f)^n, as I had earlier.

  Since E[new B] = B (1 + 0.10f)

