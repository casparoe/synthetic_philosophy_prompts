  However, for f=1, although E[B_n] is large, the variance is huge, and P(B_n >0) is small, so in reality, you almost never achieve that high expected value.

  Whereas for f=0.10, E[B_n] grows at 1% per bet, and with lower variance, so the typical outcome is close to expected.

  Moreover, for f=0.10, P(ruin) is essentially zero for practical purposes.

  So the friend who says bet all-in to maximize expected winnings is mathematically correct in terms of expected value, but practically, it's a bad strategy because it leads to ruin with probability 1.

