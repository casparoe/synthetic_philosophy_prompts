prompt: |-
  I'm a backend engineer, not a philosopher, but I got pulled into AI safety over the last couple of years through work, and I now co-host a small interview podcast on alignment topics for an audience that's mostly other engineers. A few of us on my team have a running lunchtime argument about whether scalable oversight proposals are more than security theater for a regime we don't yet have models capable of triggering, and AI safety via debate -- where two copies of a model argue opposite sides of a question in front of a judge too weak to verify the answer directly -- keeps coming up, since unlike most alternatives it comes with actual theoretical backing rather than just "have a bigger model check a smaller one." Next episode's guest is a researcher who has spent years defending debate as the right long-term protocol, and who tends to retreat to its theoretical motivation -- the analogy to interactive proof systems, in which a bounded verifier gets walked up to a PSPACE-hard truth by an unbounded prover -- whenever a practical objection comes up, as though the analogy settles the practical question of whether debate tracks truth once debaters are far more capable than the judge.

  I'd like eight to ten questions that don't let her rest on that analogy. Please include at least one question on the obfuscated arguments problem -- the worry that a dishonest debater can construct an argument whose flaw is real but too computationally expensive to locate inside the debate -- and whether recent "doubly-efficient debate" proposals actually close that gap or just raise the price of exploiting it; one on what the finding that more persuasive debaters make judges more accurate is really evidence of, given that debate is meant to be deployed exactly in the large-capability-gap regime that such a finding can't test; one on whether the claim that honesty wins under optimal play survives once you drop the assumption that true claims are easier to defend than false ones; and one on why cross-examining transcripts of an opponent's earlier instances is supposed to catch lies rather than simply give near-identical copies of the same model more surface area to collude on. For each question, please add a short follow-up keyed to the deflection I'd expect a committed defender of debate to reach for, and you can assume the audience knows basic machine-learning and complexity-theory vocabulary without having read the alignment-forum sequences.
