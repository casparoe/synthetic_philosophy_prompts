  First, I need to recall Keeley's actual arguments. In his 1999 paper, he talked about conspiracy theories often being "unwarranted" because they rely on errant data and ad hoc expansions. But the user heard that Keeley might have softened his stance later. Pigden, on the other hand, argued that each theory should be judged on its own evidence. The user wants the strongest versions of both sides, in Bayesian terms, and whether a generic prior is defensible.

  The user's deeper need seems to be resolving a philosophical disagreement with friends. They felt both sides had valid points but were talking past each other. They want clarity on whether a prior against conspiracies is rational or just bias. 

  Breaking down the generalist position: The key is the base rate of successful conspiracies. If most large conspiracies fail or are exposed quickly, that's empirical evidence for a low prior. Bayesian reasoning incorporates base rates via priors. So, a generalist would argue that the prior probability of a conspiracy decreases with its scale (number of people, time, complexity). This isn't prejudice; it's based on historical data. For example, Watergate involved around 40 people and unraveled in 2 years. JFK conspiracies often require hundreds to stay silent for decades. The prior reflects that improbability.

  Now, the particularist stance: They emphasize that base rates shouldn't override specific evidence. If there's strong evidence for a specific conspiracy, even if rare, it should be considered. Pigden points out that some conspiracies did succeed, like the Manhattan Project. So, applying a low prior might ignore cases where evidence is substantial. Particularists worry that labeling a theory as "conspiracy" triggers unfair dismissal.

  Synthesizing both: The strongest view might be a nuanced Bayesian approach. Assign priors based on the specific conspiracy's scale and context, not a blanket prior. For instance, a plot involving 10 people for a month gets a higher prior than one with thousands over decades. Then, update with evidence. Keeley's later work might align with this, focusing on warning signs (e.g., over-reliance on anomalies) rather than outright dismissal.

  The user's crux is avoiding prejudice while not ignoring base rates. The answer lies in conditionalizing the prior—using parameters like number of conspirators and duration. This avoids flat priors against all conspiracies but acknowledges that larger ones are inherently less likely. Historical data supports this: large, long conspiracies are rare. So, it's principled, not prejudiced.

  I should also address Keeley's evolution. His initial heuristic was about epistemic red flags, not a flat prior. Later, he likely refined it to avoid overgeneralization. Pigden's counter ensures evidence isn't ignored. The synthesis respects both: use context-sensitive priors and update rigorously with evidence.

  In conclusion, the defensible position is a Bayesian model with priors conditioned on conspiracy scale, validated by historical patterns. This meets the user's need for a principled middle ground.
answer: |-
  You've hit on a genuinely deep epistemological puzzle that philosophers *still* argue about. The "generalism vs. particularism" debate about conspiracy theories (CTs) is indeed often oversimplified, and Keeley's position is more nuanced than forum summaries suggest. Let's break down the strongest versions of each position, translate them into Bayesian terms, and tackle your core question about priors.

  **Core Positions: Strongest Versions**

  1.  **Generalism (Informed Skepticism - Keeley-Inspired):**
      *   **Thesis:** While *not* claiming *all* CTs are false, generalism argues that large-scale, complex conspiracy theories **inherently possess structural epistemic weaknesses** that make them *less likely* to be true than official/non-conspiratorial explanations *of comparable explanatory power*. This isn't a flat prior of 0, but a *significantly lowered prior* based on the nature of the claim itself.
      *   **Key Arguments (Bayesianized):**
          *   **Base Rate of Successful Large Conspiracies (Prior - P(H)):** History shows large, complex conspiracies involving many people over long periods are extremely rare and prone to failure/exposure (Watergate: ~40 people, unraveled in 2 years; Tuskegee: ~dozens, kept secret ~40 years but *involved ongoing deception of victims*, not external silence). The larger the conspiracy (N conspirators, T duration, C complexity), the lower the prior probability P(Conspiracy | N, T, C) should be set, based on empirical observation of human behavior and organizational dynamics. P(Official Explanation) often starts higher simply because it doesn't require this improbable coordination.
          *   **Epistemic Burden (Likelihood - P(E|H)):** CTs often rely on explaining *anomalies* or *absence of evidence*. To be plausible, they must posit *additional* conspiratorial acts (cover-ups, evidence planting, witness intimidation/murder) to explain why the conspiracy isn't obvious. Each additional element (`A1, A2, A3,...`) multiplies the probabilities: P(E|H) = P(Anomaly1|H) * P(Anomaly2|H) * P(NoLeaks|H) * P(NoDeathbedConfession|H) * ... * P(EvidencePlanted|H) * ... This rapidly drives down P(E|H) unless each element is *independently* highly probable. The "theory expands to swallow disconfirming evidence" is a sign of this multiplicative burden lowering P(E|H).
          *   **Errant Data & Anomaly Hunting:** Over-reliance on ambiguous/erroneous data points as "smoking guns" inflates P(E|H) *artificially* for the CT while neglecting the likelihood P(E|¬H) that anomalies arise from error, coincidence, or incomplete official accounts *without* a grand conspiracy.
      *   **Analogy:** It's like seeing a stopped clock showing the right time. The prior P(ClockWorking) might be low if it's usually broken. The evidence E (showing right time) has a *high* P(E|H_Working) but also a non-zero P(E|H_Broken) (it happens twice a day). The prior matters. Generalism says large CTs are like very broken clocks.

  2.  **Particularism (Evidential Neutrality - Pigden-Inspired):**
      *   **Thesis:** The label "conspiracy theory" carries **no independent epistemic weight**. Each claim must be evaluated *solely* on its *own specific evidence*, assessed against *specific* alternative explanations. Applying a generic discount because a theory posits a conspiracy is an *ad hoc*, prejudicial "conspiracy theory" fallacy.
      *   **Key Arguments (Bayesianized):**
          *   **No Special Category:** Conspiracies (secret plots by powerful actors) *do* happen (e.g., Watergate, Iran-Contra, COINTELPRO, corporate cartels). There is no magical property of "conspiracy-ness" that inherently lowers P(H). The prior P(Conspiracy) should be based *only* on the *specifics* of the alleged plot (Who? How many? Motive? Means? Opportunity?) and *historical precedents for similar plots*, not a blanket discount.
          *   **Evidence is Paramount:** The posterior probability P(H|E) is dominated by the likelihood ratio P(E|H) / P(E|¬H). If the specific evidence E is *strongly* predicted by the conspiracy hypothesis H and *very unlikely* under the official hypothesis ¬H, then P(H|E) can be high *regardless* of the initial prior, provided the prior isn't *literally* zero. Particularists argue generalists inflate P(E|¬H) and underestimate P(E|H) for specific CTs due to bias.
          *   **The Fallacy Charge:** Assigning a low prior *simply because* a theory is labeled a "CT" is question-begging. It smuggles in the assumption that large conspiracies are impossible/unlikely *without* justifying that assumption for the *specific case*. It risks ignoring genuine evidence (Type II error). Pigden: "The fact that a theory is a conspiracy theory is, in itself, no reason for supposing it to be false."
          *   **Official Stories Can Be Flawed:** Non-conspiratorial explanations can also have low priors (e.g., "lone nut" explanations for complex events) or fail to account for evidence, making the CT a *relatively* better explanation if its specific evidence is strong.

  **Keeley's Nuance & Evolution:**
  You're right. Keeley (1999) focused on identifying features ("epistemic red flags") that make *many* CTs *unwarranted* **given the available evidence**, not a flat prior. He argued CTs often require believing in *more* unexplained anomalies (errant data) than they resolve. His later work acknowledged:
  1.  **Not All CTs Equal:** He emphasized judging *specific* theories based on their *specific* structure and evidence burden.
  2.  **Context Matters:** In contexts with low institutional trust or known histories of conspiracy (e.g., CIA interventions), priors for new conspiracies might *reasonably* be higher.
  3.  **Heuristic, Not Algorithm:** His "unwarranted" criteria were meant as practical epistemic warnings, not a logical proof of falsehood. He moved closer to saying: "Be *extra* critically vigilant with theories exhibiting these red flags," rather than "Dismiss them outright."

  **Resolving Your Crux: A Principled Bayesian Prior?**

  Yes, there is a principled way to justify a prior discount for claims *based on the specific scale of the conspiracy alleged*, **without** it being (a) ignoring evidence or (b) mere prejudice. Here's how:

  1.  **Conditionalize the Prior on Conspiracy Parameters:** Don't set P(Conspiracy) flatly. Set P(Conspiracy | N, T, C) where:
      *   `N` = Minimum number of *core* conspirators needed to execute and cover up.
      *   `T` = Minimum duration the secret must be maintained.
      *   `C` = Complexity of the plot (number of moving parts, need for perfect execution, required suppression of investigations).
  2.  **Base the Prior on Empirical Reality (Base Rates):** Estimate P(Conspiracy | N, T, C) based on historical data:
      *   Plots with small N (e.g., 2-5) and short T (days/weeks) succeed frequently (assassinations, coups, corporate espionage).
      *   Plots with large N (dozens+) and long T (years/decades) succeed *very rarely*. The probability of *zero leaks* decays exponentially with N and T. Organizational theory and game theory (risk/reward for defectors) support this.
      *   High C further decreases the probability of success *and* secrecy.
  3.  **This is NOT Prejudice:** This prior is **evidence-based** and **specific to the claim's structure**. It uses general knowledge about human nature, organizational behavior, and historical patterns to assess the *intrinsic plausibility* of the *mechanism* proposed, before examining the specific evidence `E`. It's analogous to setting a low prior for "a perpetual motion machine" based on the laws of thermodynamics, or a low prior for "alien visitation last night" based on Fermi's Paradox and physics constraints. It's about the *type of event* claimed.
  4.  **It Does NOT Ignore Evidence:** This prior is just the starting point. **Strong specific evidence `E` can overcome a low prior.** Bayesianism *requires* updating:
      *   If P(E | Conspiracy, N, T, C) is *extremely high* (the evidence fits the conspiracy perfectly and is predicted by it) and P(E | ¬Conspiracy, N, T, C) is *extremely low* (the evidence is virtually impossible under any non-conspiratorial explanation), then even a very low prior can be overcome, leading to a high posterior P(Conspiracy | E, N, T, C).
      *   **The Crucial Point:** For a large-N, long-T conspiracy, the evidence `E` needs to be *exceptionally strong* to overcome the low prior. A few anomalies or suggestive documents (moderate P(E|H), often with non-negligible P(E|¬H)) usually won't suffice. The particularist must demonstrate why *this specific case* overcomes the base rate improbability.

  **Which is More Defensible? A Synthesis**

  Neither pure generalism nor pure particularism is fully satisfying. The most defensible position is **Scaled Bayesian Particularism**:

  1.  **Acknowledge Base Rates:** Set initial priors P(H) conditional on the specific scale (N, T, C) of the alleged conspiracy, using historical patterns and social science. *This is principled, not prejudiced.* A JFK conspiracy involving hundreds across decades starts with a *very* low prior. A plot by 3 mob bosses to kill JFK starts with a *higher* prior.
  2.  **Demand Rigorous Likelihoods:** Evaluate the *specific* evidence `E` rigorously. Demand high P(E|H) for the *specific conspiracy alleged* and critically assess P(E|¬H) for *specific non-conspiratorial alternatives*. Keeley's "epistemic red flags" (excessive reliance on errant data, theory expansion swallowing anomalies) are excellent tools for this, exposing weak P(E|H) or inflated P(E|H) relative to P(E|¬H).
  3.  **Update Conscientiously:** Follow the Bayesian math. Extraordinary claims (large conspiracies) require extraordinary evidence (very high likelihood ratio P(E|H)/P(E|¬H)) to achieve credible posterior probabilities.
  4.  **Avoid the Label Trap:** Dismissing a theory *solely* because it's called a "conspiracy theory" *is* fallacious and prejudicial. However, recognizing that a theory posits an event type (large-scale, long-term conspiracy) with a demonstrably low base rate is sound reasoning.

  **Conclusion:** Your friends were both partly right, talking past the nuance. A principled prior discount *is* justified, but **only** based on the *specific scale and complexity* of the alleged conspiracy, grounded in empirical base rates, not the label "conspiracy theory." This discount is not absolute; overwhelming specific evidence can overcome it. Keeley's core insight is that large CTs usually fail *because* their required P(E|H) is crippled by the multiplicative burden of explaining secrecy and anomalies, making it hard for them to outperform non-conspiratorial explanations *on the evidence*. The strongest position demands we weigh the *specific evidence* for a *specific conspiracy hypothesis* against its *inherently low prior probability* due to scale, while also fairly evaluating non-conspiratorial alternatives. Ignoring the prior is naive; letting the prior veto evidence is dogmatic.
