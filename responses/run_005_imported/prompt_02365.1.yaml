answer: |-
  You're absolutely right to question the purely evidentiary justification. Copyright's independent creation defense *does* track a profound ontological truth about literary works: **a novel is not merely a sequence of words; it is an *act of creation* situated within a specific historical and intentional context. Its identity is bound to its genesis.**

  Here’s the argument for why two verbatim-identical manuscripts are, seriously, distinct books:

  1.  **The Primacy of Authorial Intent and Context (The "Menard Principle"):**
      *   Borges's Menard isn't just copying; he *re-creates* Cervantes's words through an entirely different intellectual and historical process. His *Quixote* emerges from 20th-century nihilism, symbolism, and his own biography, not 17th-century Spanish chivalric satire.
      *   **Meaning is Contextual:** The *same words* written in 1605 and 1939 *mean* different things. Cervantes's text commented on contemporary literature and society. Menard's identical text comments on Cervantes, on the passage of time, on the nature of originality itself, and on early 20th-century anxieties. The reader's understanding is fundamentally shaped by knowing *who* wrote it *when* and *why*. The text alone cannot contain this.
      *   **The Work is the Act:** Copyright law implicitly recognizes that what it protects is not the *pattern* of words, but the *expressive act* of *forming* that pattern through original creative labor. Cervantes performed one act; Menard performed another, radically different act, even if the textual output coincided. Each act is a unique historical event.

  2.  **Contrast with Patent Law: Functional vs. Expressive:**
      *   **Patent's Goal:** Protects *functional* inventions and processes. Its purpose is to incentivize *useful* novelty and disclose it to the public. If two inventors independently create the *same useful machine*, granting a monopoly to the first filer makes sense – society gets the same utility regardless of who invented it, but needs the incentive structure.
      *   **Copyright's Goal:** Protects *original expression*, not utility or ideas. Its purpose is to incentivize the *creation* of diverse expressive works. If two authors independently create the *same sequence of words*, society gains *two distinct acts of original creation*, each reflecting the unique mind and context of its author. Punishing the second author for this astonishing coincidence would *stifle* creation without serving the core purpose of incentivizing *their own* original expressive act. The value is in the *diversity of creative sources*, even if the output momentarily converges.

  3.  **The "Book" as a Cultural Artifact, Not Just a Text:**
      *   A "book" exists in a cultural ecosystem. Cervantes's *Don Quixote* influenced centuries of literature, philosophy, and art. It exists in relation to what came before it and what came after. Its significance is historical.
      *   Menard's *Quixote*, appearing in 1939, enters a completely different cultural landscape. Its significance lies in its relationship to Cervantes's original *as an historical object*, to modernism, and to Borges's own philosophical project. It comments *on* Cervantes in a way Cervantes's text cannot comment on itself.
      *   **Identity Through Lineage:** The two manuscripts are distinct cultural objects because they emerge from different creative lineages and enter the world at different points in cultural history. Their impact, interpretation, and very existence as cultural signifiers are inseparable from their origins. The physical text is a vessel, but the *work* includes its invisible aura of origin.

  4.  **Beyond Proof: Affirming Creative Sovereignty:**
      *   The independent creation defense isn't *just* a concession to evidentiary difficulty; it's a *positive affirmation* of the author's creative sovereignty over their own mental labor and expressive choices. It says: "Your copyright arises from *your* act of creation, not from the coincidence of your output matching someone else's prior output created in isolation." Your right is rooted in your own originality, not in the absence of similarity elsewhere. This protects the integrity of the individual creative process.

  **Conclusion:**

  The evidentiary challenge is real, but it's a consequence, not the cause, of copyright's deeper philosophical stance. Copyright law intuitively grasps Borges's insight: **a literary work is an *authored utterance* within history.** Its identity is constituted by the *act* of its creation – the author's mind, their influences, their time, their purpose. Two identical strings of words produced by two independent creative acts are two distinct *utterances*, two distinct *events* in cultural history, and therefore, two distinct *books*. The text is necessary, but not sufficient, for individuation. Menard's *Quixote* is profoundly different from Cervantes's *because* of its origin, even if not a single word differs. Copyright's independent creation rule respects this ontological reality of what a novel truly *is*.
