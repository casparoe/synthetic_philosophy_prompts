  We are evaluating rejoinders to Roger Penrose's Gödelian argument as presented in *Shadows of the Mind*. The argument, as reconstructed by Chalmers, is:

  1. Suppose my reasoning is captured by a formal system F.
  2. I know that I am sound (i.e., I only prove true statements), so F must be sound, and so must F' (which is F plus the assertion that I am F).
  3. Therefore, I know that the Gödel sentence for F', G(F'), is true.
  4. But F' cannot derive G(F') (by Gödel's first incompleteness theorem, assuming F' is consistent and sufficiently strong).
  5. Since I am F', I should not be able to derive G(F') either, but I just did (step 3), which is a contradiction.
  6. Therefore, no formal system F can capture my reasoning.

  Now, we are to rank the following rejoinders (and any others we think are important) by how damaging they are to this argument:

