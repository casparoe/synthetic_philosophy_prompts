answer: |-
  This is a heartbreakingly common situation, and your friend was right – it's a textbook example of a concept in **Game Theory**, specifically the **Nash Equilibrium** within a scenario resembling the **Prisoner's Dilemma** or a **Coordination Game**. Here's how it applies and what it suggests:

  ### What's Going On (The Game Theory Lens)

  1.  **The Nash Equilibrium:** Named after John Nash, this is a state where *no player can improve their outcome by unilaterally changing their strategy, given what the other players are doing.*
      *   **Your Current State:** Both of you have declared "final" positions. If you move off yours *first*, you feel (and your lawyer likely reinforced) that you "lose" because your sister hasn't moved. The same is true for her. Neither of you can improve your *perceived* position by moving alone without the other moving too. So, you're stuck. This is the equilibrium – stable, but mutually damaging.
  2.  **The Prisoner's Dilemma Aspect:** In the classic Prisoner's Dilemma, two prisoners independently deciding whether to betray the other face a choice:
      *   **Mutual Cooperation (Stay Silent):** Moderate sentence for both (Best *collective* outcome).
      *   **Betrayal (Defect):** If one betrays and the other stays silent, the betrayer goes free (Best *individual* outcome), the silent one gets maximum sentence (Worst outcome).
      *   **Mutual Betrayal:** Moderate sentence for both, but worse than mutual cooperation.
      *   **The Dilemma:** Individually, betraying is the "rational" choice (it avoids the worst outcome and *could* yield the best). But if both choose rationally (betray), they end up worse off than if they had both cooperated.
      *   **Your Situation:** "Cooperating" means being willing to compromise/move. "Defecting" means sticking rigidly to your "final" position.
          *   If you *both* compromise ("Cooperate"), you reach a fair settlement quickly, saving money and the relationship (Best collective outcome).
          *   If *you* compromise and your sister *doesn't* ("Defect"), you feel you've "lost" (she gets closer to her number) while she "wins" (Worse outcome for you).
          *   If *she* compromises and you *don't*, she feels she "lost" and you "won" (Worse outcome for her).
          *   If *neither* compromises ("Mutual Defection"), you both lose money on lawyers, house costs, and damage the relationship – the worst collective outcome (exactly where you are now).
      *   **The Stalemate:** Just like the prisoners, individually sticking to the "final" position feels safer ("I avoid the worst outcome of caving while she doesn't"), but leads to the worst *joint* outcome. Trust is broken by the initial adversarial setup.

  3.  **The Coordination Problem:** You both *want* to reach a middle ground (it's the rational, best outcome for both), but you lack a mechanism to *coordinate* moving simultaneously without one feeling like they blinked first. The lawyers' initial advice cemented the adversarial starting point, making coordination harder.

  ### Why the Lawyers' Advice Backfired (In This Context)

  *   **Designed for Adversarial Contexts:** This "final offer first, hold firm" strategy *can* work against truly hostile opponents or in purely transactional settings where relationship preservation isn't a priority. It aims to anchor the negotiation and signal resolve.
  *   **Ignores Relationship Dynamics:** It completely disregarded that you are sisters with an existing positive relationship who *want* to resolve this fairly but are now trapped by the strategy itself.
  *   **Created a Focal Point for Conflict:** The "final number" became a line in the sand, turning a discussion about fair distribution into a battle over who "wins" the negotiation.

  ### How to Get Unstuck (Strategies Based on Game Theory)

  The key is to **break the adversarial equilibrium** and **create a mechanism for simultaneous or costless cooperation.** Here's how:

  1.  **Reframe the Negotiation & Costs:**
      *   **Joint Letter/Email:** Write to your sister together (or separately but identically): "Look, we both followed our lawyers' initial advice in good faith. It's resulted in a stalemate that's costing us both significant money in legal fees and house expenses, and it's straining our relationship. This is clearly worse for both of us than finding a middle ground. Let's agree that the *real* loss is continuing this standoff."
      *   **Focus on Shared Losses:** Calculate the *total* ongoing costs (lawyer fees for both, property taxes, insurance, utilities, maintenance, potential depreciation). Agree that every month this drags on, that money is *wasted* and could have been part of the inheritance for both. Frame compromise as *stopping the bleeding*, not losing.

  2.  **Introduce a Neutral Third Party (Mediator):**
      *   **Crucial Step:** Propose jointly hiring a *single*, neutral mediator or collaborative probate attorney. Frame it as a cost-saving measure ("We're paying two lawyers to argue; let's pay one neutral person to help us agree").
      *   **How it Breaks the Stalemate:**
          *   The mediator becomes the channel for offers/suggestions, removing the "who moved first" stigma.
          *   They can reality-test both positions and suggest fair compromises without either sister being the one to "cave."
          *   They focus on interests (fairness, preserving relationship, minimizing costs) not just positions (the arbitrary "final" numbers).
          *   This creates a new "game" with different rules focused on problem-solving.

  3.  **Simultaneous Move Mechanism:**
      *   **Proposal:** "Sis, let's agree that the lawyers' initial advice got us stuck. Let's both email our lawyers *at exactly the same time* (e.g., next Tuesday at 10 AM) instructing them to convey a *new* offer to the other side. This new offer should be a genuine step towards the middle. Since we move simultaneously, neither is 'blinking first.'"
      *   **Variation:** Agree to both send your lawyers instructions to accept the *average* of your two current "final" offers. Simultaneity is key.

  4.  **Costless Signaling:**
      *   **During a Non-Estate Call:** Casually mention, "You know, I was thinking about Mom's house/the savings, and I hate how this is dragging on and costing us both so much. I really wish there was a way we could just split the difference and be done with it. This is eating into what Mom wanted us to have." This signals willingness without formally "moving" your position in the negotiation.
      *   **Focus on Relationship:** "I value our relationship more than winning a few extra dollars out of this. Mom wouldn't want this." This reframes the goal.

  5.  **Focus on the Middle Ground Directly:**
      *   **Proposal:** "Our 'final' numbers are X and Y. The midpoint is Z. I propose we both agree to Z right now, split the difference, and instruct our lawyers to draft the settlement immediately. This saves us months of fees and heartache." This requires courage, but explicitly names the obvious solution and frames it as mutual gain (ending costs) rather than loss.

  ### Key Considerations

  *   **Initiate the Conversation:** *Someone* has to make the first move to *change the game*. Acknowledge the stalemate and its costs openly and non-accusatorily. Focus on the *system* (the advice, the situation) being broken, not her being stubborn.
  *   **Leverage Your Good Relationship:** Remind yourselves (and each other) that you get along outside of this. Use that goodwill as the foundation for trying a new approach. "We've always been able to talk things through; let's figure this out together like sisters, not adversaries."
  *   **Bypass the Lawyers (Initially):** Have this conversation directly with your sister, sister-to-sister. Lawyers are bound by their duty to advocate for *your* position; they won't usually initiate compromise unless you instruct them to. Once you and your sister agree on a *new* approach (like mediation or simultaneous moves), *then* instruct your lawyers accordingly.
  *   **Be Prepared to Truly Compromise:** Go into this willing to accept something genuinely in the middle. If you signal willingness but then dig in on a position close to your original "final," the stalemate will restart.

  **In essence:** The game theory analysis shows you're rationally trapped in a bad outcome. Escaping requires changing the rules of the game by introducing coordination (simultaneous moves), communication (reframing, signaling), or a trusted third party (mediator). The most realistic and effective path forward is almost certainly proposing mediation to your sister, emphasizing the shared costs of the current stalemate. It removes the "who moves first" problem and focuses on finding a solution that serves both your interests – which includes preserving your relationship and minimizing the waste of your mother's legacy on fees.

  My deepest condolences on your loss, and I hope you and your sister can find a way through this difficult time together.
