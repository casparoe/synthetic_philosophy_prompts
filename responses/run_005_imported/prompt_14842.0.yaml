  Elena's stronger point: Aquinas absolutely denies duties to usurpers (ST II-II Q42 A2 ad 3). His "consent of the governed" language (De Regno 1.1) could extend to occupation. But she underplays his requirement that resistance must have "hope of success" (ST II-II Q42 A2)—a doomed revolt fails his test. 

  The elephant in the room: Aquinas's entire framework assumes Christian governance. Would he even recognize Nazi rule as a "regime" rather than pure force? His just-war theory (ST II-II Q40) might better fit—occupation could be "ongoing unjust war," making resistance self-defense. 

  Ultimately, both miss that Aquinas prioritizes saving souls over political outcomes. He'd likely judge the cell by whether they acted without hatred (ST II-II Q64 A7) and accepted martyrdom. The real Aquinas takeaway might be compassion for those forced into impossible choices.
answer: |-
  What a remarkable (and philosophically charged) family discovery! Let's break down Mark and Elena's Aquinas debate step-by-step, referencing his key texts (*Summa Theologiae*, *De Regno*, and *Commentary on the Sentences*), and identify where each has a point and where they might be overlooking nuance:

  **The Core Debate: Aquinas on Tyrannicide & Resistance**

  1.  **Mark's Opening: Caution Against Private Judgment**
      *   **His Claim:** Aquinas disapproves of private citizens assassinating a ruler deemed tyrannical without public authority. Cites *De Regno* I.6-7 and *ST II-II, Q.42, A.2* (on Sedition).
      *   **Aquinas' Support:** Mark is **correct on this specific point.** Aquinas is deeply wary of individuals taking it upon themselves to kill a ruler. His reasons:
          *   **Judgment:** Ordinary people are poor judges of true tyranny vs. harsh but necessary rule (*De Regno I.6*).
          *   **Abuse:** It opens the door to chaos and self-serving assassinations (*De Regno I.6*).
          *   **Authority:** Removal should ideally come from a "public authority" – meaning established bodies within the community (like nobles or representatives), not random individuals (*ST II-II, Q.42, A.2, ad 3*; *De Regno I.6*).
      *   **Verdict:** **Mark is right here.** A clandestine cell plotting an assassination fits Aquinas's definition of problematic "private" action.

  2.  **Elena's Comeback: Distinguishing the Usurper**
      *   **Her Claim:** Aquinas distinguishes a legitimate ruler turned tyrant from a *usurper* who seized power illegitimately. Resistance against a usurper (who never had authority) is far more permissible. Cites *ST II-II, Q.42, A.2, ad 3* and *ST II-II, Q.69, A.4*.
      *   **Aquinas' Support:** Elena is **substantially correct.** Aquinas makes a crucial distinction:
          *   **Legitimate Ruler Turned Tyrant:** Removal is difficult and requires public authority due to the initial legitimacy (*De Regno I.6*).
          *   **Usurper:** "He who slays a tyrant... if he has *usurped* authority, he deserves death... and anyone can lawfully attack him" (*ST II-II, Q.42, A.2, ad 3*). The key is the *lack of legitimate title*. The usurper never had the right to rule, so resistance isn't sedition against legitimate authority.
      *   **Verdict:** **Elena is right** about the core distinction and the greater permissibility against a usurper.

  3.  **Mark's Counter: Occupation vs. Internal Usurpation**
      *   **His Claim:** "Usurper" for Aquinas means someone seizing power *within* an existing political community (coup), not a foreign occupier. Foreign occupation is a different beast (Just War theory).
      *   **Aquinas' Support:** Mark identifies a **genuine ambiguity.** Aquinas primarily discusses usurpation in the context of internal power grabs (e.g., seizing a kingdom). Foreign conquest/occupation is often addressed under *ius ad bellum* (just war) and *ius in bello* (conduct in war). There's no explicit Aquinas text neatly slotting foreign occupation into the "usurper" box.
      *   **Verdict:** **Mark has a point about the textual focus.** Aquinas didn't explicitly define foreign occupiers as "usurpers." However, his *logic* about legitimacy seems applicable.

  4.  **Elena's Rebuttal: Extending the Logic**
      *   **Her Claim:** Even if not explicitly covered, the *logic* of no legitimate title applies *more strongly* to a foreign occupier than an internal usurper. An occupier has zero claim to authority based on the community's consent or established order.
      *   **Aquinas' Support:** Elena's argument is **strong logically.** Aquinas's core principle for the usurper category is the *absence of legitimate title to rule over that specific people.* A foreign power imposed by force, with no consent or historical claim to rule *that territory/people*, clearly lacks legitimate authority by Aquinas's standards (rooted in natural law and the common good of *that* community). Resistance wouldn't be sedition against one's own legitimate rulers, but defense against an external, illegitimate force. Later Scholastics and Just War theorists often applied the usurper logic to occupiers.
      *   **Verdict:** **Elena wins this round on logic.** While Aquinas didn't spell it out, the fundamental principle of legitimacy strongly supports extending the "usurper" justification to resistance against a brutal foreign occupation with zero local legitimacy.

  5.  **Mark's Closer: Proportionality & Disorder**
      *   **His Claim:** Even if the occupier is a "usurper," Aquinas requires resistance to avoid causing *greater evils* than the tyranny itself. Reprisals against civilians were predictable, so the cell might fail this test. Cites *ST II-II, Q.42, A.2, ad 3* (implicitly) and *ST II-II, Q.40, A.1* (prudence in war).
      *   **Aquinas' Support:** Mark lands a **significant point.** Aquinas *does* demand prudence. In *ST II-II, Q.42, A.2, ad 3*, after allowing anyone to kill a usurper, he immediately adds: *"unless* perchance it be not expedient on account of the *tumults* that may ensue." He emphasizes acting "for the common good, not for private advantage" and avoiding "greater dangers to the community." The principle of proportionality and avoiding disproportionate evil is central to his ethics (*ST I-II, Q.20*).
      *   **Verdict:** **Mark is correct** that Aquinas imposes a crucial proportionality/prudence condition *even if* the target is a usurper. The predictable risk of brutal reprisals against civilians is a serious factor Aquinas would consider. The cell would need a reasonable belief their action would *ultimately reduce* evil/chaos, not escalate it.

  **What Both Might Be Steamrolling Past: Aquinas's Nuances**

  1.  **"Public Authority" Isn't Always the State:** When Aquinas says "public authority," he doesn't necessarily mean only the *existing* government. In contexts of tyranny or usurpation, this could potentially include legitimate leaders emerging *from* the oppressed community itself – nobles, local leaders, representatives – acting *as* the voice of the public good against the illegitimate power. A resistance cell *could* potentially frame itself this way (though Aquinas would likely demand broader recognition than just "a few guys in a barn").
  2.  **Intention & Method Matter:** Aquinas isn't just concerned with the target, but the *intention* and *means*. Was the assassination driven by hatred or the common good? Was it a last resort? Did it avoid unnecessary evil? (*ST II-II, Q.64, A.7* on killing sinners emphasizes intention and common good). Mark focuses on the "private" aspect, Elena on the target's status, but both underplay the moral weight Aquinas places on *why* and *how*.
  3.  **The Primacy of the Common Good:** Aquinas's entire political philosophy orbits the common good. Legitimacy stems from serving it, tyranny is defined by destroying it for private gain, and resistance is justified only to restore it. The debate about "usurper" vs. "occupier" is secondary to the core question: *Is this power fundamentally opposed to the common good of this community, and is resistance the only/least harmful way to restore it?* Both debaters could anchor their arguments more firmly here.
  4.  **Context is King:** Aquinas was writing for a medieval context with established hierarchies. Applying his categories directly to 20th-century partisan warfare requires careful translation. The nature of occupation, resistance tactics, and the scale of Nazi reprisals create a moral landscape he couldn't have fully envisioned.

  **The Verdict:**

  *   **Round 1 (Private Judgment):** **Mark** is clearly right.
  *   **Round 2 (Usurper Distinction):** **Elena** is substantially right.
  *   **Round 3 (Occupation vs. Usurpation):** **Mark** identifies a textual gap, but **Elena** wins on extending Aquinas's core logic convincingly.
  *   **Round 4 (Proportionality):** **Mark** lands a crucial point about Aquinas's prudence requirement.

  **Overall:** Neither has the *complete* picture of Aquinas. **Elena is stronger on the core legitimacy issue** – Aquinas's logic strongly supports resistance against a foreign occupier lacking any legitimate title, placing it under the "usurper" umbrella or a very analogous category. **Mark is stronger on the critical conditions** – the action must not be purely private recklessness (which the cell arguably was) and must reasonably avoid causing disproportionate harm (reprisals being a major concern). Aquinas would likely condemn the *private, clandestine nature* of the cell (Mark's win) but potentially justify *resistance itself against the occupier* (Elena's win), *if* the action was prudent and proportional – which Mark effectively questions.

  **For your family:** Perhaps gently point out that Aquinas, writing 700 years ago about kings and dukes, offered principles (legitimacy, common good, prudence, avoiding greater evil) rather than perfect templates for Nazi-occupied Belgium. Your great-uncle and his comrades faced an unimaginable moral calculus under extreme oppression. While Aquinas provides a framework for debate, their choice likely sprang from a raw imperative to resist overwhelming evil – a context where abstract philosophy meets the terrible reality of war. Their courage deserves remembrance, even if medieval theologians offer no easy verdict.
