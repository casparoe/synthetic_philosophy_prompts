  What's fascinating is how they're projecting modern resistance ethics onto a 13th-century theologian. Aquinas wouldn't have conceived of partisan operations—his "tyrant removal" examples are barons deposing kings or papal interventions. Also, his "greater disorder" test is notoriously subjective; he'd probably call the Nazi occupation the disorder itself. 

  The grandmother's distress hints this isn't just academic—the debate might feel disrespectful amid mourning. The user might need both philosophical clarity and help framing this sensitively for family. 

