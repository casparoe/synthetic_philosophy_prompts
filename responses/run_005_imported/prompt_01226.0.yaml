prompt: |-
  Something's been bugging me and I can't tell if I'm being irrational about it. I've got two job offers: Job A is boring big-co, $175k guaranteed, and Job B is an early-stage startup, $130k base plus equity that (by the founders own numbers) has maybe a 7% shot of being worth ~$4M and otherwise nothing. Expected value clearly favors B, and my friend, whos big into rationalist blogs, says turning it down is just scope-insensitive bias, since the gap between 130k and 175k isn't nearly enough to justify skipping the higher-EV option.

  But when I imagine the exact same choice scaled way down, like a guaranteed $1,750 vs a 7% shot at $40k, I get the exact same pull toward the safe option, even though at that scale neither outcome would change my life at all. So it's clearly not about the money's marginal value to me, it feels more like I just don't like that shape of bet, period. Is my friend right that this is just a bias I should correct, or could there be an actual principled reason to weigh a gamble differently than its expected value, separate from how much you value the outcomes themselves?
reasoning: |-
  Okay, let me start by really understanding what the user is asking here. They have two job offers: one stable but boring with a high salary, and the other risky with a lower base but potential high upside. Their friend is pushing them to take the startup because the expected value (EV) is higher, but the user feels drawn to the safe option even when scaling down the numbers. The core question is whether this preference is irrational bias or if there's a principled reason to deviate from EV.

  First, I need to break down the expected value calculation for Job B. The base is $130k plus equity with a 7% chance of being worth $4M. So the EV for the equity part is 0.07 * $4M = $280k. Adding the base, total EV is $130k + $280k = $410k. Compared to Job A's $175k, that's a huge difference. But EV is just one part of the decision. The user mentioned that even when scaled down, they still prefer the safe option, which suggests it's not about the money's utility but the bet's structure.

  The user's friend is coming from a rationalist perspective, emphasizing EV and scope insensitivity. Scope insensitivity here means not recognizing the difference in magnitude between the outcomes. But the user's intuition persists even at smaller scales, where the monetary impact is negligible. That points to something deeper than just financial utility.

  I recall concepts like risk aversion and utility curves. People don't value money linearly; each additional dollar is worth less than the previous one. A guaranteed $175k might provide more utility than a risky $410k EV. But the user says that even at lower stakes, where the marginal utility shouldn't matter, they still prefer safety. So maybe it's about the psychological aspect of risk rather than pure economics.

  Prospect Theory by Kahneman and Tversky comes to mind. It suggests people weigh potential losses more heavily than gains. Losing $100 feels worse than gaining $100 feels good. In this case, taking Job B has a 93% chance of being worse than Job A. The certainty of Job A's salary provides psychological comfort. Even at lower stakes, the aversion to a high chance of loss (relative to the safe option) could be driving their preference.

  Another angle is the probability weighting. Humans tend to overestimate low probabilities and underestimate high ones. But here, 7% is low, and people usually either overweight or underweight such chances. The user might be underweighting the 7% chance, seeing it as negligible, thus making the safe bet more attractive.

  Also, the user's situation matters. Job A is boring but stable. Job B, being an early-stage startup, likely demands more hours, stress, and uncertainty. The total cost isn't just financial. The friend's rationalist view might overlook these non-monetary factors. Burnout, work-life balance, and personal satisfaction are real considerations. Even in the scaled-down scenario, the user might associate the risky option with higher stress, hence the consistent preference.

  The user is also questioning whether there's a principled reason to deviate from EV. The answer is yes, beyond just utility curves. Factors like risk capacity, personal circumstances (do they have dependents? debt?), and alternative opportunities play roles. If the user can't afford a 93% chance of a lower salary, risk aversion is rational. Additionally, the equity's illiquidity and potential dilution in startups add uncertainty not captured in EV.

  I should also consider if the user is seeking validation for their gut feeling. They might feel pressured by the friend's argument but trust their intuition. It's important to affirm that their preference isn't irrational. Behavioral economics provides frameworks that explain such choices as normal and reasoned.

  In conclusion, the user's aversion isn't just bias; it's a combination of psychological factors, personal circumstances, and non-monetary costs. Their scaled-down test shows consistency, suggesting a deeper risk preference. Advising them to weigh all factors—financial stability, career growth, personal well-being—makes sense. They shouldn't feel compelled to follow EV alone if other aspects align better with their life goals.
answer: |-
  You're not being irrational at all—this is a profound observation that cuts to the heart of decision theory. Your friend's "scope insensitivity" argument overlooks critical nuances of human rationality. Here's why your instinct makes sense, backed by economics and psychology:

  ### 1. **Expected Value ≠ Expected Utility**  
     The rationalist focus on EV assumes money has **linear utility** (e.g., $4M is exactly 23x better than $175k). But humans experience **diminishing marginal utility**:  
     - The difference between $0 and $130k is life-changing (housing, security, debt freedom).  
     - The jump from $130k to $4M is less transformative per dollar (luxuries, investments).  
     **Result**: Guaranteed $175k may provide *more utility* than a 93% chance of $130k + 7% chance of $4M, even if EV favors B.

  ### 2. **Probability Weighting (Prospect Theory)**  
     Kahneman/Tversky showed humans don't perceive probabilities objectively:  
     - We **overweight low probabilities** (e.g., buying lottery tickets).  
     - But we **underweight *very* low probabilities** (<10%) when outcomes are extreme, treating them as "near zero."  
     Your 7% chance might *feel* like 2-3% psychologically—making the EV calculation misleading.

  ### 3. **Risk of Ruin (Personal Context)**  
     EV ignores your specific vulnerabilities:  
     - Do you have debt? Dependents? Emergency savings?  
     - If Job B fails (93% likely), could you cover basic needs on $130k vs. $175k?  
     **Rational aversion** occurs when a loss could be catastrophic, even if EV is positive.

  ### 4. **The Startup's Hidden Costs**  
     Early-stage startups demand extreme hours, stress, and instability. The equity's value is diluted by:  
     - **Illiquidity**: Can’t cash out for 5-10 years.  
     - **Dilution**: Future funding rounds shrink your share.  
     - **Overestimation**: Founder "7%" estimates are often optimistic.  
     Your $4M outcome might be closer to 3-4% in reality.

  ### 5. **Your Scaled-Down Test Reveals a Truth**  
     Your identical preference at lower stakes shows this isn't about money—it's about **risk geometry**. Humans are hardwired to avoid high-loss-probability bets, even when stakes are trivial. This isn’t bias; it’s a heuristic for survival.  

  ### Why Your Friend is Mistaken
  - **Scope insensitivity** applies when comparing vastly different magnitudes (e.g., donating to save 1 vs. 100 lives). Here, the outcomes are comparable *relative to your life context*.  
  - **EV worship** ignores utility curves, probability distortion, and real-world constraints.  

  ### A Better Framework: Calculate Your Certainty Equivalent
  Ask: *"What guaranteed salary would make me indifferent to Job B's gamble?"*  
  - If you’d need $200k+ guaranteed to choose Job B, your risk aversion is rationally accounting for utility.  
  - If you’d still pick $175k over Job B even if it paid $500k EV, it’s psychological risk aversion.  

  ### Practical Advice
  1. **Quantify your risk tolerance**:  
     - If $130k covers your essentials, Job B’s upside may be worth it.  
     - If $175k enables critical goals (buying a home, supporting family), Job A dominates.  
     
  2. **Evaluate non-monetary factors**:  
     - Will Job A’s "boring" work drain your mental health?  
     - Does Job B offer growth/learning that offsets risk?  

  3. **Treat equity as $0**: Startups fail ≈90% of the time. Only take Job B if:  
     - The base salary is sufficient alone, *and*  
     - The experience has intrinsic value.  

  **Conclusion**: Your preference isn’t irrational—it’s a nuanced reflection of human decision-making. Expected value is a starting point, not a rule. Choosing Job A isn’t "bias"; it’s a valid prioritization of stability, psychological comfort, and predictable utility. The scaled-down test confirms your innate risk profile. Own it.
