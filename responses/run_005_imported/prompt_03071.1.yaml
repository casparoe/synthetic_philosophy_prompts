answer: |-
  The click of my stopwatch was the loudest sound in the room. Five minutes. That’s all it took. Five minutes of stillness after the heart stuttered its last reluctant beat, and what was once Geraldine Peterson became… transport.

  I’m not medical staff. I’m the courier. The guy who shows up with the cooler marked "Human Organ Procurement," stays out of the way, and leaves with it heavier. My suit is cheap, my shoes squeak on the linoleum, and I smell faintly of airport coffee and antiseptic wipes. They tolerate me because I’m necessary, a cog in the machine that turns endings into beginnings elsewhere.

  Geraldine’s ventilator sighed its last programmed breath twenty minutes ago. Her daughter, red-eyed but dry-faced, had whispered goodbye, squeezed a hand already cooling, and fled. Now it was just the science: the withdrawal team, the transplant surgeon hovering near the door like a vulture in scrubs, the ICU nurse meticulously charting, and me, leaning against the wall by the supply cart, thumb on the stopwatch.

  The heart monitor had flatlined at 14:03. *Exactly* 14:03. Dr. Aris, the intensivist, pronounced it: "Asystole." No electrical activity. The nurse confirmed it, her voice steady. That was the signal. My thumb pressed down. *Click.* Five minutes began.

  The room held its breath. Not literally, of course. Geraldine certainly wasn’t. The air hummed with the suppressed energy of professionals waiting. The transplant surgeon, Dr. Vance, shifted his weight. The resident beside him stared fixedly at the blank screen. The nurse checked her watch against the wall clock, then mine. Synchronized time. Death by committee, calibrated to the second.

  This was the liminal space. The *waiting* period mandated by the DCD protocol – Donation after Circulatory Death. They’d withdrawn life support. Her heart, starved of oxygen command, had stopped. Now, we waited to ensure it wouldn't start again *on its own*. That’s the key. "Irreversible cessation of circulatory function." But irreversibility, in this context, wasn't about impossibility. It was about probability. About the statistical unlikelihood of auto-resuscitation after five minutes of flatline. It was permanence conjured from a stopwatch, not certainty.

  *Three minutes.* Geraldine looked… smaller. The vibrant woman from the photos taped to her IV pole – hiking, laughing, surrounded by grandkids – was utterly gone. What remained was waxen, slack. No dramatic gasps. No twitches. Just stillness deepening. The room felt colder.

  I watched Dr. Vance. His eyes weren't on Geraldine; they were on the clock. His fingers tapped a silent rhythm on his thigh. Impatience? Or just focus? He needed those kidneys. They were apparently pristine. Life for someone else hinged on Geraldine staying definitively dead *right now*. The pressure wasn't grief; it was logistics. A heart that restarts spontaneously in this window isn't a miracle; it's a protocol nightmare. It throws the whole ethical house of cards into disarray. "Irreversible" becomes embarrassingly reversible.

  *Four minutes.* The resident cleared his throat, a startlingly loud sound. The nurse glanced up sharply. Dr. Aris stood immobile, gaze fixed on Geraldine’s chest. Waiting for a rise that wouldn’t come. The silence wasn't peaceful; it was taut, charged with unspoken contingency. What if? *What if?* But the "what if" wasn't about Geraldine living. It was about the *process* failing. About the heart defiantly kicking back in, mocking our five-minute sacrament, forcing them to *not* declare death, forcing them back into the agonizing limbo of supporting a body that, by brain criteria, might already be gone, but whose heart refused the script. The "irreversible" quietly, efficiently, became "permanent" simply because we’d agreed to wait five minutes and call it absolute.

  My eyes dropped to the cooler at my feet. Just an insulated box. Soon, it would hold pieces of Geraldine, packed in ice, rushing towards another OR. Life from death. But right now, in this suspended moment, death felt strangely… provisional. Defined not by an absolute biological endpoint, but by the ticking down of an arbitrary interval chosen because *statistically*, after this point, the heart won't restart itself. Not *can't*. *Won't*. The difference felt vast, a canyon dug by policy and pragmatism. We weren't waiting for her to be dead beyond any possible intervention; we were waiting for her to be dead beyond the *expectation* of spontaneous recovery. It was a sleight of hand performed with a chronometer.

  *Four minutes, fifty seconds.* The tension was a physical thing. Dr. Vance took a half-step forward. The resident held his breath. The nurse’s pen hovered over her chart.

  *Click.*

  The sound of the stopwatch was deafening. Five minutes.

  "Time," Dr. Aris stated, his voice flat, final. The declaration wasn't dramatic. It was paperwork. "Time of death: 14:08."

  Instantly, the frozen tableau shattered. Dr. Vance surged forward, pulling on fresh gloves. "Prep for procurement! Move!" The resident scrambled. The nurse started unhooking monitors with practiced efficiency. The sacred stillness was replaced by the urgent clatter of instruments being laid out, the rustle of sterile drapes.

  I bent down and picked up the cooler. It felt heavier already, imbued with the sudden shift from waiting to action. I looked at Geraldine one last time. The professionals were focused below her neck, on the work to be done. Her face was already receding, irrelevant to the next phase.

  Dr. Vance caught my eye as he reached for a scalpel. "Courier? OR 4 West. Stat."

  "On it," I said, hefting the cooler. As I turned to leave, the last sound I registered was the sharp *snap* of sterile gloves being pulled tight, and the ventilator, disconnected and silent in the corner, finally wheezing out its own last mechanical sigh. Dead was dead. They’d made sure of it. On schedule. I walked out, the cooler bumping against my leg. Just meat in a box now. Efficient. Permanent. Five minutes was all it took.
