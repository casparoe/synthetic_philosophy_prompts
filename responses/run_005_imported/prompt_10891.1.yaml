  Kavka's toxin puzzle is different. A billionaire pays you to form the intention to drink a harmless toxin. You get the money just for intending, not for drinking it. The problem is that once you have the money, drinking the toxin is pointless and harmful, so you wouldn't do it. But forming the intention is tricky because you know you won't follow through, making it hard to genuinely intend.

