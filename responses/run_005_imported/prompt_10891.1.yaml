  Which is harder for CDT? Hitchhiker might be addressed with commitment strategies, like precommitment devices, which CDT can handle. Toxin is trickier because forming an intention isn't a decision you can directly control. You can't decide to intend something; you either do or don't. So, Toxin exposes a deeper problem about the nature of intention and self-prediction.

