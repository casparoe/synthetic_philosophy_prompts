answer: |-
  That's a sharp observation, and you've hit on a crucial tension in the Hobbes-Wallis feud. While the "misunderstood genius" angle is tempting (and Hobbes *was* brilliant in political philosophy), the mathematical reality is more nuanced and ultimately less kind to Hobbes. Here's a breakdown:

  1.  **Wallis Wasn't Just Guessing (He Was Applying Rigorous Methods):**
      *   While Lindemann's *final, absolute* proof of transcendence (and hence impossibility) came later, 17th-century mathematicians like Wallis weren't operating in a vacuum. They understood the properties of pi (as a ratio) and the nature of geometric constructions far better than Hobbes.
      *   Wallis used powerful *new* tools: algebra and the beginnings of calculus (infinitesimals, limits). He showed that pi could be expressed as an infinite product (Wallis product). He understood that existing geometric methods (compass and straightedge) operated within the realm of algebraic numbers (roots of polynomials with rational coefficients), even if the formal theory of field extensions was centuries away.
      *   **Key Point:** Wallis didn't need the *full* 19th-century proof to recognize that Hobbes's specific constructions were flawed. He could see the internal inconsistencies, the reliance on unproven assumptions, and the failure to actually achieve the exact equality required. He wasn't guessing pi was transcendental; he was applying rigorous algebraic analysis to show Hobbes's *specific methods* were invalid and didn't produce the claimed result. He had strong *inductive* evidence based on centuries of failed attempts and the nature of pi's known approximations.

  2.  **Hobbes Was Objectively Wrong (and Stubbornly So):**
      *   Hobbes's constructions were demonstrably incorrect. Wallis, Huygens, Brouncker, and others repeatedly pointed out specific errors in his logic, his reliance on undefined concepts, and his failure to meet the geometric criteria. Hobbes didn't "almost" get it right; his methods were fundamentally flawed.
      *   Hobbes rejected the new mathematics. His materialism led him to insist geometry must be based solely on physical construction with compass and straightedge, dismissing algebra and infinitesimals as "absurd" or "metaphysical." This put him at odds with the entire direction of mathematical progress championed by Wallis, Newton, Leibniz, etc. He wasn't just challenging a conclusion; he was rejecting the *tools* used to reach it.

  3.  **The "Turf Protection" Element (It's Real, But Not the Whole Story):**
      *   **Absolutely.** The feud was deeply personal, vitriolic, and prolonged. Wallis clearly enjoyed baiting Hobbes and demonstrating his mathematical superiority. Hobbes's attacks on the universities and the newly formed Royal Society (which pointedly excluded him) made him a prime target.
      *   The Royal Society, championing the new experimental and mathematical philosophy, saw Hobbes (with his materialist reputation and attacks on their methods) as a threat to their credibility and authority. Shutting him down mathematically was part of establishing their own dominance.
      *   **However, crucially, they had the mathematical high ground.** They weren't defending turf *instead* of being right; they were defending turf *by* demonstrating they were right using superior methods. The feud provided a dramatic stage for Wallis to showcase the power of algebraic analysis over Hobbes's outdated geometric literalism.

  4.  **The "Misunderstood Genius" Angle Doesn't Fit Mathematically:**
      *   **Hobbes wasn't a mathematical genius.** His political philosophy was revolutionary, but his geometry was mediocre and reactionary. He failed to grasp or accept the key mathematical innovations of his time.
      *   **He wasn't "right" in any meaningful sense.** Lindemann proved the impossibility Hobbes was claiming *was* possible. Hobbes didn't have a secret correct method; his published attempts were simply wrong.
      *   **His "materialist take" was a hindrance, not an insight.** Insisting geometry must be reducible *only* to physical construction blinded him to the abstract power of algebra and analysis, the very tools that would eventually prove the impossibility he denied.

  **So, how to frame it for your piece:**

  *   **Focus on the Clash of Worlds:** This is the richest angle. It wasn't *just* about squaring the circle; it was a proxy war between:
      *   Old vs. New: Classical geometry vs. emerging algebra/calculus.
      *   Philosophy vs. Specialized Mathematics: The universal philosopher vs. the professional mathematician.
      *   Institution Building: The Royal Society asserting its authority over natural philosophy.
      *   Personality: Massive egos (especially Hobbes's) and deep personal animosity.
  *   **Hobbes as the *Philosophical* Outsider:** He genuinely challenged the establishment's *methods* and *authority*, even if his specific mathematical challenge was flawed. His materialism and anti-scholasticism made him a target beyond just this math problem.
  *   **The "Pile-On" Was Real, But Justified (Mathematically):** Yes, the establishment ganged up. Yes, turf protection and personal dislike fueled it. **But crucially, they were mathematically correct to do so.** Hobbes *was* wrong. Wallis *was* using superior, rigorous methods. The pile-on was vicious, but it wasn't *unfounded*. The establishment had the better tools and arguments.
  *   **Tragic Stubbornness:** Emphasize Hobbes's tragic flaw: his brilliant mind in one area (political philosophy) led to unshakeable (and mathematically unjustified) confidence in another. His decades-long refusal to concede any error, despite clear demonstrations, is a key part of the drama.
  *   **"The Underdog Was Wrong":** This can be a powerful theme. Not every challenger to the establishment is a Galileo. Sometimes the establishment is actually right, and the challenger is stubbornly wrong. The dynamics of rejection, ridicule, and institutional defense still play out intensely, making it a fascinating case study even without the "misunderstood genius."

  **In essence:** The feud *was* partly about turf and personality. Wallis didn't have Lindemann's proof. **But** Wallis was applying sound, rigorous, and advanced (for the time) mathematical reasoning that exposed Hobbes's errors definitively *within the framework of what was knowable then*. Hobbes wasn't a mathematical genius being suppressed; he was a brilliant philosopher embarrassingly out of his depth in a specialized field, doubling down on errors and attacking the new tools that exposed him, making himself a legitimate target for the mathematical establishment he scorned. It's a story of intellectual hubris, methodological revolution, institutional formation, and a very long, very public grudge – not a story of a geometric visionary ahead of his time.
