prompt: |-
  I've long been a reader of the rationalist blogs and forums where precommitment devices are a recurring topic -- Schelling on the strategic value of binding oneself, Beeminder-style commitment contracts for beating akrasia, and so on -- and a recent conversation with some friends about that literature sent me down a path I hadn't expected: noticing that the term "Ulysses contract" is actually used for two quite different things, and wondering whether the comparison between them is as clean as it's usually assumed to be.

  The first is the individual-level use from psychiatric ethics: a patient with a condition like bipolar disorder, while lucid and legally competent, signs an advance directive instructing doctors to have her involuntarily hospitalized and medicated the next time she becomes manic, overriding whatever objections she raises at the time. The second is Jon Elster's well-known extension of the same Odysseus-at-the-mast image to constitutions: bills of rights, supermajority amendment rules, and judicial review as devices that let a polity's more reflective self bind its own future majorities against momentary passion. Elster developed this application across _Ulysses and the Sirens_ and then substantially qualified it in the later _Ulysses Unbound_, growing considerably more doubtful that constitution-makers are really doing anything like what Odysseus did.

  Here is what I can't settle on my own, and what I'd like you to work through carefully rather than gesture at. The standard objection to the psychiatric case is that a manic episode might not be mere irrationality being restrained by a wiser self, but could express something more like a genuine, if unwelcome, shift in what the person values -- making the directive less like Odysseus overruling a temporary delusion and more like one person overruling another. The standard objection to the constitutional case, going back to Jefferson's argument with Madison over whether the dead can bind the living, is that a later generation is not even numerically the same agent as the one that wrote the constraint -- unless, that is, one follows Bruce Ackerman in relocating the relevant agent from a past generation to "the People" acting in its higher, constitution-making capacity, as opposed to its ordinary-politics capacity, a move that starts to look structurally similar to distinguishing a patient's lucid, planning self from her manic, acting self. The question, then, is whether these two objections are really the same worry wearing different vocabulary -- personal identity in one case, popular sovereignty in the other -- such that whatever rescues one case ought to rescue the other, or whether one of the two uses of "Ulysses contract" is resting on much shakier ground than the other for reasons that have nothing to do with the other case at all. I'd like an actual verdict rather than a survey of considerations: which of the two is the more defensible way to bind a future self against its own contemporaneous wishes, and does Elster's retreat between his two books track a genuine asymmetry between the cases, or was he simply being overcautious?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deeply engaged with rationalist literature on precommitment devices, specifically pointing out the dual use of "Ulysses contract" in psychiatric ethics and constitutional theory. The user has noticed a tension: both applications face similar objections about identity and sovereignty, but they wonder if these objections are fundamentally the same or if one case is weaker. They want a clear verdict on which use is more defensible and whether Elster's shift in stance is justified.

  First, I need to recall the core arguments for both contexts. In the psychiatric case, the advance directive is set during a competent state to override future manic episodes. The objection here is about value shifts—whether the manic self represents a different set of values rather than just impaired rationality. For the constitutional side, it's about whether past generations can bind future ones, challenging the continuity of the collective agent. 

  The user mentions Ackerman's distinction between "the People" in different capacities, similar to the patient's lucid vs. manic selves. This structural parallel is key. But are the objections interchangeable? The psychiatric objection hinges on personal identity and value change, while constitutional concerns revolve around popular sovereignty and generational autonomy.

  Elster's retreat in *Ulysses Unbound* questioned if constitution-makers are truly like Odysseus. He doubted their ability to foresee future circumstances and the neutrality of constraints. This seems more about epistemic limits and institutional capture than identity. In contrast, psychiatric directives might have clearer diagnostic markers for incapacity, making identity continuity stronger.

  The user wants a verdict. I think the psychiatric case is more defensible because medical criteria provide objective markers for when the directive applies, maintaining agent continuity. Constitutional constraints lack such clear triggers and face democratic legitimacy issues. Elster's caution makes sense here—the asymmetry lies in the application, not the analogy itself. His retreat reflects the unique complexities of binding collective futures versus individual ones.
answer: |-
  Your analysis cuts to the heart of a profound philosophical and practical tension. After carefully weighing the objections, structural parallels, and underlying realities of both applications, here is a clear verdict:

  **The psychiatric Ulysses contract is the more defensible way to bind a future self against its contemporaneous wishes.** Elster's retreat in *Ulysses Unbound* tracks a **genuine and significant asymmetry** between the individual and constitutional cases, making his caution justified rather than overcautious.

  Here's the breakdown of why:

  1.  **The Core Asymmetry: Continuity of the Agent and Criteria for Intervention**
      *   **Psychiatric Case:** The "self" bound and the "self" bound *against* exist within the *same biological entity* with a *continuous, though fluctuating, identity*. Crucially, medical ethics relies on **objective, clinically defined thresholds** for intervention (e.g., specific diagnostic criteria for mania, psychosis, suicidality demonstrating decisional incapacity). The directive *only* activates when the patient meets these externally verifiable criteria for *impaired rationality*, not merely a change in preference. The "lucid self" is targeting a specific *pathological state*, not a different "authentic" self.
      *   **Constitutional Case:** The "agent" binding (past generation/constituent assembly/"The People" in higher lawmaking mode) and the "agent" bound (future majority/"The People" in ordinary politics) are **discontinuous collectives**. There is no clear, objective, non-controversial threshold (like clinical incapacity) defining when a "passionate" majority should be overruled. Terms like "passion," "reflection," or "higher self" are inherently political and contested. The binding generation cannot reliably predict future circumstances or values. The intervention mechanism (e.g., judicial review) is itself a political actor, vulnerable to accusations of illegitimacy or bias when overriding contemporary majorities.

  2.  **Why the "Value Shift" vs. "Different Agent" Objections Aren't Equivalent:**
      *   While structurally similar objections (Agent A binding Agent B), their *force* differs dramatically due to the context.
      *   **Psychiatric Value Shift:** The objection that mania expresses "genuine values" is countered by the **medical reality of pathology**. Mania involves demonstrable neurochemical dysregulation leading to impaired judgment, grandiosity, impulsivity, and often profound regret post-episode. The directive aims to restore the capacity for *coherent* value formation and expression, not suppress a valid alternative self. The "shift" is recognized medically as a *symptom*, not an authentic expression.
      *   **Constitutional Different Agent:** Jefferson's objection is fundamentally **insurmountable in a strong form**. Future generations *are* different people. Ackerman's move ("The People" acting in different capacities) is a *legal fiction* necessary for constitutionalism to function, not an empirical reality. It relies on continuous acceptance and legitimacy, which is perpetually contested. The fiction is far more fragile and less grounded in objective reality than the psychiatric patient's biological and psychological continuity.

  3.  **Why Elster Was Right to Retreat:**
      *   Elster's initial analogy (*Ulysses and the Sirens*) brilliantly illuminated the *logic* of precommitment in constitutions. However, his later doubts (*Ulysses Unbound*) correctly identified the **fatal flaws** in the analogy when applied rigidly:
          *   **Epistemic Hubris:** Constitution-makers cannot foresee the future like Odysseus foresaw the Sirens. Their constraints may become harmful or irrelevant.
          *   **Who is Tying Whom?:** Odysseus tied *himself*. Constitutional constraints are typically designed by elites to bind *others* (future majorities). The "self" binding is not identical to the "self" bound.
          *   **The Enforcer Problem:** Odysseus's sailors were neutral enforcers under his prior orders. Courts or supermajority requirements are *not* neutral; they are powerful political actors with their own agendas, interpreting vague constraints (like "due process") in contested ways.
          *   **Lack of Clear "Siren Song":** Unlike the specific, known danger of the Sirens, what constitutes a dangerous "passion" justifying constitutional override is perpetually debatable. Judicial review often strikes down legislation reflecting deeply held, stable societal values, not fleeting passions.
      *   Elster recognized that constitutional constraints function more as *coordination devices* or *institutional equilibria* than true Ulyssean precommitments. Their legitimacy stems from ongoing acceptance and utility, not from a perfect analogy to a past self-binding act.

  **The Verdict:**

  *   The **psychiatric Ulysses contract** is more defensible because it operates within a framework of **continuous personal identity** and utilizes **medically objective criteria** to define the pathological state where the binding directive activates. It aims to restore the individual's capacity for autonomous decision-making aligned with their enduring values and well-being.
  *   The **constitutional Ulysses contract** rests on a **necessary legal fiction** (popular sovereignty across time) but faces insurmountable challenges regarding the **discontinuity of collective agents**, the **absence of clear, neutral criteria** for identifying "irrational" passion vs. legitimate democratic will, and the **non-neutrality of the enforcing mechanisms**. It is a much weaker, more contested, and ultimately different kind of device. Elster was correct to qualify the analogy significantly.

  Therefore, while the *structural parallel* between the two objections is intellectually compelling, the *practical and philosophical grounding* for overcoming these objections is vastly stronger in the individual psychiatric case than in the constitutional case. Binding one's *own future pathological state* is fundamentally different, and more justifiable, than attempting to bind *future generations of others* using contested political mechanisms. Elster's retreat acknowledged this deep asymmetry.
