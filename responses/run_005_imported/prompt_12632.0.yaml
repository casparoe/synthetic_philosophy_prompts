prompt: |-
  Ok this is a weird ask but my older sister's getting married in a few weeks and she wants ME (her annoying little brother, still in high school) to give a toast at the reception. She's finishing a philosophy PhD and lately its all Kripke, all the time -- rigid designators, the necessary a posteriori -- and she said it would actually mean a lot if I worked that into the speech instead of the generic "soulmates" toast everyone does. Her favorite example is "Hesperus is Phosphorus": necessarily true, but something people could only find out by actually looking through a telescope, and she thinks something like that is true of her and her fiance. She was VERY clear this is not the same as saying they were "fated" to be together though, and will be annoyed if it comes off that way, but she still wants it to feel romantic, not like a lecture. Half the guests are her philosophy department, the other half is our great aunt and his totally normal family who've never heard of any of this. Can you write the toast (3-4 minutes)? It needs to actually get the philosophy right and still work for the whole room.
reasoning: |-
  Okay, the user is a high school student tasked with giving a wedding toast for his philosophy PhD sister. This is quite a challenge! The sister specifically wants Kripkean concepts (rigid designators, necessary a posteriori) woven in, using the "Hesperus is Phosphorus" example as romantic metaphor. 

  Hmm, tricky requirements: must be philosophically accurate (her department colleagues will notice!), accessible to non-philosophers (great aunt!), avoid "fated" misinterpretation, feel genuinely romantic, and come from a little brother's perspective. Also needs to land in 3-4 minutes. 

  First, unpacking the philosophy: Kripke's point is that some truths are necessary but discovered empirically. "Hesperus is Phosphorus" seems contingent (two names = could be two things) but is necessarily true (same celestial object). Similarly, the sister sees her relationship as necessarily true but discovered through lived experience - not destiny, but revealed truth. 

  Key pitfalls to avoid:
  - No destiny/fate language (she hates that)
  - No oversimplifying the philosophy (her peers will cringe)
  - No inside jokes only academics get (alienating family)
  - No saccharine clichés (she wants intellectual romance)

  Approach: Use the astronomy metaphor throughout. Frame it as a little brother's observation ("I saw you figure this out"). Contrast with generic "soulmate" tropes explicitly. Keep explanations in simple analogies (telescopes = time together). 

  Structure idea:
  1. Hook: "I'm not a philosopher but..." disarming intro
  2. Astronomy story: Hesperus/Phosphorus as accessible example
  3. Pivot: "Like those stars, you two..."
  4. Necessary truth: "Not 'meant to be' but discovered truth"
  5. Evidence: Specific observations of their relationship 
  6. Toast: To continuing discovery

  Voice notes: 
  - Little brother vibe: self-deprecating ("annoying"), genuine awe of sister
  - Humor: "I looked up rigid designators on Wikipedia"
  - Warmth: Specific memories (late-night calls, study sessions)
  - Romance: Focus on "joy in the discovery" not destiny

  Biggest risk: Non-philosophers tuning out during philosophy bit. Solution: Keep it under 30 seconds, immediately tie to concrete relationship examples. 

  Gotta nail the ending - something like "Keep pointing your telescopes at each other" bridges metaphor and romance perfectly.
answer: |-
  Here’s a toast that balances the philosophy with warmth, avoids "fate," and works for both the academics and family. It runs about 3.5 minutes when delivered naturally:

  ---

  **(Raise glass, smile at the couple, then glance at sister with a playful eye-roll)**  
  "Okay, full disclosure: when [Sister’s Name] asked me to give a toast, I panicked. My usual speeches involve memes and begging her for pizza money. Then she said, ‘Work in Kripke and rigid designators.’ *[Pause for laughter]* Yeah. My big sister, the philosopher, giving her high-school brother homework *at her own wedding*. Classic.  

  But here’s the thing: she explained it. She told me about Hesperus and Phosphorus. For those who haven’t had a 2 a.m. philosophy lecture from her *[nod to family]*: ages ago, people saw a bright star in the evening and called it ‘Hesperus.’ They saw a bright star in the morning and called it ‘Phosphorus.’ Turns out? Same planet. Venus. It was *necessarily* the same thing all along, but they only *knew* it by looking closely. It wasn’t magic or fate—it was a truth waiting to be discovered.  

  ***(Shift tone to sincere, looking at the couple)***  
  "[Sister’s Name] and [Fiancé’s Name], that’s what this feels like for you two. It’s not that you were ‘destined’ or written in the stars like some fairy tale. It’s deeper. You were always *you*—rigidly, wonderfully yourselves. But the truth—the *necessary* truth—that you belong together? That’s something you had to *discover*. You put in the work: late-night talks, surviving her PhD stress *[grin]*, road trips, figuring out how to make each other laugh even when life got messy. You looked through the telescope, day after day, and saw something real.  

  I saw it too. I saw how [Fiancé’s Name] gets her weirdly specific coffee order right *every single time*, not because it’s easy, but because he pays attention. I saw how [Sister’s Name] lights up when he walks into a room—not some dramatic movie moment, just… quiet, steady certainty. Like finally recognizing what’s been true all along.  

  ***(To the room)***  
  "To the philosophers here: yes, it’s the necessary *a posteriori*. The truth you find *after* the effort, after the looking.  
  ***(To family)***  
  To everyone else: it’s proof that the best things aren’t just ‘meant to be’—they’re *built* by two people choosing each other, day after day, and discovering something undeniable.  

  So let’s raise a glass to my brilliant sister and her amazing partner. Not to fate, not to soulmates in the abstract… but to *you two*, specifically. To the long nights that became shared mornings. To seeing Hesperus *and* Phosphorus—and realizing you’ve been looking at the same bright, beautiful thing all along. May you never stop discovering each other. Cheers!"  

  ---

  **Why This Works:**  
  1. **Accurate Philosophy:**  
     - Uses Hesperus/Phosphorus correctly (necessary identity discovered empirically).  
     - Contrasts with "fate" explicitly ("not destined," "not magic").  
     - Name-drops Kripke/rigid designators *once* for the academics, but explains it intuitively.  

  2. **Accessible:**  
     - The astronomy story is a vivid, universal metaphor.  
     - Family-friendly examples (coffee orders, quiet moments) ground the philosophy.  
     - Humor ("homework at her wedding") disarms non-philosophers.  

  3. **Romantic, Not Academic:**  
     - Focuses on *their specific love* ("you were always you," "paying attention").  
     - "Quiet, steady certainty" replaces "soulmates" with something deeper.  
     - Ends on warmth ("never stop discovering").  

  4. **Little Brother Vibe:**  
     - Self-deprecating jokes ("memes," "pizza money").  
     - Observational details (coffee, her smile) feel authentically little-brother.  
     - Teases her gently ("2 a.m. philosophy lecture").  

  **Delivery Tip:** Pause after the nerdy bits for laughter, and look at the couple during the heartfelt parts. The academics will nod at the philosophy; the family will feel the love. Your sister? She’ll know you nailed it.
