answer: |-
  You've nailed the central tension in Aquinas's text, and your confusion is *entirely* justified. This is one of the most debated passages in medieval political thought precisely because Aquinas seems to pull in two directions. Let's untangle it step-by-step, incorporating the relevant context from the *Summa Theologiae*:

  1.  **The Core Dilemma:**
      *   **Natural Law & Tyranny:** Aquinas believes authority comes from God for the common good. A tyrant, by definition, rules for private gain and actively harms the common good. This violates the very purpose of authority.
      *   **Order & Obedience:** Simultaneously, Aquinas holds that social order is divinely ordained and essential. Private individuals challenging authority, even bad authority, risk chaos and greater evils (his prudential argument). Scripture (1 Peter 2:18-20) and the example of martyrs emphasize patient endurance under unjust suffering.

  2.  **The Ehud "Sleight of Hand":**
      You're right to be bugged by this. Aquinas isn't *just* relabeling; he's making a crucial, though implicit, distinction:
      *   **Foreign Oppressor vs. Domestic Ruler:** Eglon, King of Moab, was a *foreign conqueror* oppressing *Israel*. Ehud was acting as a liberator of his own people from an external enemy, not as a subject assassinating his own legitimate sovereign. This distinction is vital for Aquinas.
      *   **Ehud as Judge:** The text notes Ehud became a "Judge" afterward. Judges were charismatic leaders raised *by God* to deliver Israel. Aquinas likely sees Ehud's act as divinely *inspired* and *authorized* (implicitly or explicitly), placing it outside the category of "private initiative." It's not just killing a foe; it's an act of divinely sanctioned liberation against a foreign tyrant.
      *   **The Unspoken Principle:** The principle making the categories different is **jurisdiction and legitimacy**. Killing a foreign enemy combatant (a "foe") in a liberation struggle is fundamentally different from a private citizen assassinating the ruler *to whom they owe political allegiance*, even if that ruler is tyrannical.

  3.  **Public Authority vs. Private Initiative - It's NOT Just a Crowd:**
      This is where the *Summa Theologiae* (II-II, Q. 42, "On Sedition") becomes essential. Aquinas condemns *sedition* (rebellion causing discord among the people) as a mortal sin... **BUT** he adds a critical caveat:
      > *"A tyrannical government is not just... Consequently, there is no sedition in disturbing a government of this kind, unless perhaps the disturbance is so inordinate that the community suffers greater harm from the disturbance than from the tyrant's government."*
      *   **The Key:** Resistance isn't inherently sedition if the ruler is a *true tyrant* (not just harsh) and the resistance is *ordered* towards the common good.
      *   **"Public Authority" Defined:** Aquinas doesn't mean a random mob. He means *constituted authority within the existing political framework*:
          *   **The "Multitude":** This refers to the community *acting collectively through its legitimate representatives or institutions*, not a spontaneous riot. It implies a process akin to the original act of establishing the king – perhaps through nobles, councils (like a proto-parliament), or other established bodies representing the community.
          *   **Lesser Magistrates:** A common medieval (and later Reformation) interpretation was that officials with public authority (e.g., barons, dukes, judges, city councils) *could* act against a tyrant *on behalf* of the community they served, precisely because they held public office. A private citizen acting alone almost never qualifies.
      *   **Deposition, Not Necessarily Killing:** Note Aquinas emphasizes *deposition* ("the multitude can depose him"). While this *could* involve force or execution (as history shows), the primary emphasis is on the *lawful removal of authority*, not the act of killing itself. The killing of the tyrant, if it occurs, would ideally follow from this lawful deposition and be carried out by public authority, not as a private assassination.

  4.  **The Prudential Argument - Reinforcing the Barrier:**
      His point about the wicked being more likely to assassinate than the virtuous isn't just cynicism; it's a powerful reinforcement of why private initiative is unacceptable. It highlights the inherent danger of vigilantism and the breakdown of due process. Only public, representative action can (theoretically) mitigate this risk and ensure the act serves the common good, not private vengeance or ambition.

  **What Aquinas is Committing To (The Untangled Doctrine):**

  1.  **Tyranny is Illegitimate:** A ruler who fundamentally destroys the common good forfeits their right to rule.
  2.  **Absolute Rejection of Private Tyrannicide:** An individual subject acting alone, without any public mandate or office, is *never* permitted to assassinate a ruler, even a tyrant. This violates order, risks greater evils, and contradicts apostolic teaching on submission.
  3.  **Distinction Between Foreign Oppressor and Domestic Tyrant:** Acts against foreign oppressors (like Ehud) belong to a different category (just war/liberation) and are not precedents for killing one's own sovereign.
  4.  **Legitimacy of Resistance through Public Authority:**
      *   The community *as a whole* (acting through legitimate representatives/institutions) retains the right to depose a tyrant it established.
      *   Lesser magistrates/public officials *may* have the authority to resist or depose a tyrant *on behalf of the community and the common good*.
      *   This resistance is not considered "sedition" if aimed at restoring just government.
  5.  **A High Bar:** Aquinas sets a very high threshold. Resistance is only conceivable when tyranny is extreme and manifest, all lesser remedies are exhausted, and crucially, it is initiated and controlled by *constituted public authority*, not private individuals.

  **The Verdict:**

  *   **You won the core argument.** Dana is fundamentally mistaken in claiming Aquinas gives a "green light" or a "loophole" for killing tyrants "in plain sight." Aquinas explicitly, emphatically, and repeatedly **rejects private tyrannicide** as a legitimate option. The Ehud story is explicitly *not* presented as a model for subjects to assassinate their own rulers. His primary solution is patience, prayer, and, only as a last resort, action through public, representative authority.
  *   **Dana has a partial point... but overstated it massively.** Aquinas *does* provide a theoretical foundation for *legitimate resistance* to tyranny, but it is **highly restricted, conditional, and channeled exclusively through public authority**. It's not a "loophole"; it's a complex, heavily qualified doctrine emphasizing process and collective action over individual assassination. The "green light" Dana sees is actually a very cautious yellow, only flashing for specific, authorized vehicles on a dangerous road, never for private pedestrians.

  **How to Clinch It:** Point to Aquinas's explicit rejection of private initiative ("it is not lawful for a private individual to kill a tyrant, even though he is a usurper" - implied throughout the *On Kingship* passage and reinforced by the prudential argument) and his careful distinction of Ehud as killing a foreign foe, not his own ruler. Emphasize that his "public authority" solution is about *lawful deposition by the community or its representatives*, not merely relocating the killing to a mob. The *Summa* passage on sedition confirms that resistance is only legitimate when it's *not* sedition – i.e., when it's ordered by public authority against a *true tyrant* for the common good. Dana found the spark of resistance theory in Aquinas but mistook it for a raging fire of permission for assassination.
