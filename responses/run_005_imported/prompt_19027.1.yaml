answer: |-
  Here is a eulogy that aims to honor your aunt's extraordinary life while acknowledging the complex questions it raises, offering truth to both perspectives without demanding resolution:

  ---

  **(Begin with warmth and appreciation)**

  Good morning. We gather today with heavy hearts to remember and celebrate the life of my aunt, [Aunt's Name]. For eighty-three years, she moved through this world with a quiet intensity, a deeply held conviction that guided her every step. To know her was to encounter a remarkable consistency, a life lived not for applause, but according to a principle she grasped early and held fiercely.

  **(Acknowledge her core inspiration and action)**

  As a young nurse, she encountered an idea that struck her not as abstract philosophy, but as a stark, undeniable truth: Peter Singer’s argument about our responsibility to strangers in dire need. For her, it wasn’t a theory to debate; it was a call to action. She understood that suffering across an ocean was just as real, just as urgent, as a child drowning in a shallow pond right in front of her. And she acted on that understanding with unwavering commitment.

  **(Describe her life choices simply and factually)**

  So, she chose differently. A modest apartment, not a house. No car, relying instead on buses and her own two feet. For *sixty years*, she directed the lion’s share of her nurse’s income – not just spare change, but the substance of her living – to organizations fighting suffering far away. She calculated what she truly needed to live, and she sent the rest. It was a deliberate, sustained act of compassion on a scale most of us can barely fathom.

  **(Address the personal impact, especially with your cousins - the heart of the tension)**

  This conviction also shaped her closest relationships. When their mother was ill, she stepped in to help raise [Cousin 1] and [Cousin 2]. She gave them care, stability, and love – deep, practical love. Yet, true to her fiercely held belief in impartiality, she was also profoundly honest. She didn't pretend they held a unique, privileged place in her moral universe compared to any other children she could help. They mattered immensely, *and* she believed every child mattered that much. Living that truth, loving them while holding that perspective, was part of her profound, sometimes difficult, integrity.

  **(Introduce the philosophical concept and her rejection of it - the wistfulness is key)**

  Years later, she learned there was a name among philosophers for the idea that morality might allow us, even permit us, to weigh our own lives and those close to us a little more heavily – "agent-centered prerogatives." She mentioned it to me once, almost wistfully. And then she told me, with that familiar quiet resolve, that she had decided never to allow herself that particular exemption. For her, the demands of preventing suffering, wherever it occurred, were absolute.

  **(Acknowledge the differing views in the room and frame the question without resolving it)**

  So, how do we hold this life today? Some here will look at her decades of sacrifice, her radical generosity, her unwavering consistency, and see a saint. They are not wrong to be in awe. Others, particularly those who felt the sharp edge of her absolute commitment, like [Cousin 1] and [Cousin 2] sitting here, grapple with a harder question: Does a truly good life have to be *this* demanding? Is there room, *should* there be room, for a little more of ourselves and those right beside us in the moral equation? Is something lost when love is forced through the lens of strict universality?

  **(Reframe the debate as her legacy and a call to reflection)**

  [Aunt's Name] wouldn't want us to settle that argument today. I don't think she settled it entirely for herself, that wistfulness hints at it. What she *did* do was live the question with breathtaking courage and consistency. She held up a mirror to the world's suffering and to our own often-convenient excuses. She refused to look away, even when the reflection was challenging, even when the cost was deeply personal.

  **(Conclude with celebration and the enduring impact of her choices)**

  She wasn't a philosopher by trade; she was a nurse, a helper, an aunt. But she engaged with a profound moral idea not just intellectually, but with her *entire life*. She chose a path of radical compassion, and she walked it for sixty years. That is extraordinary. That is worthy of our deepest respect and admiration.

  She leaves us not with easy answers, but with an unforgettable example and a powerful, enduring question: How much can one life demand of itself in the face of a world's need? How do we balance the call of the faraway pond with the needs of the shore where we stand?

  [Aunt's Name] lived her answer. She challenged us, perhaps even unsettled us, but above all, she *loved* – in her own expansive, demanding, and utterly sincere way. She poured her care into the world, drop by drop, year after year, quietly dismantling suffering she would never see. That is her legacy. Let us remember her strength, her conviction, her astonishing generosity, and the profound, complicated love that fueled it all.

  Rest well, Aunt [Name]. Your demanding, beautiful work is done. Thank you for showing us what commitment looks like.

  ---

  **Why this works:**

  1.  **Acknowledges Both Truths:** It clearly states her radical generosity and lifelong commitment (satisfying the "saint" perspective) while explicitly naming the difficult questions about impartiality's personal cost and its impact on her family (validating your cousins' perspective).
  2.  **Uses Her Own Words/Framing:** Incorporating Singer's "shallow pond," her rejection of "agent-centered prerogatives," and the description of her *wistfulness* grounds the tension in *her* reality, not just our interpretations.
  3.  **Doesn't Demand Resolution:** It explicitly states the argument won't be settled here ("She wouldn't want us to settle that argument today"). It presents the tension as part of her legacy and the profound question she embodied.
  4.  **Reframes the Question as Legacy:** The concluding paragraphs shift from debate to honoring her *courage* in living the question and the *impact* of her choices. Her "demanding, beautiful work" acknowledges the cost while celebrating the achievement.
  5.  **Validates Your Cousins:** By naming them specifically and framing their question ("Does a good life have to be *this* demanding?") as legitimate and complex, it gives voice to their experience without condemning their aunt.
  6.  **Respectful and Loving Tone:** Throughout, the tone is one of deep respect, admiration for her consistency and sacrifice, and acknowledgment of the love that underpinned even the difficult choices.
  7.  **Focuses on Her Action:** It centers her *deeds* – the decades of sending money, the care given to your cousins – making her philosophy tangible through her life choices.

  This eulogy allows both the awe and the unease to coexist honestly, honoring your aunt's extraordinary path while making space for the very human questions it inevitably provokes. It gives everyone something true to hold onto.
