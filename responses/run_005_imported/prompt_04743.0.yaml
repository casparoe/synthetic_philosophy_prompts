     Comment: This is the intended conclusion of the Lucas-Penrose argument. The step from formal systems to Turing machines is justified by the Church-Turing thesis.

   Claim 4: "This was, in fact, exactly the moral Gödel himself drew from his own theorems, and it is what later led Lucas, and then Penrose ... to spell the argument out as a refutation of the thesis that the mind just is a computer program."

     Verdict: Correct, but note that Gödel's views on this are complex and he did not explicitly endorse Lucas's argument. However, it is true that Gödel believed his theorems showed the mind cannot be mechanized.
