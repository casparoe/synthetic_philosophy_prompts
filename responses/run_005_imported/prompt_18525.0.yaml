  For the counterargument section, I should steel-man the opposition. Their real fear isn't this student but bad-faith actors. The response should concede this while noting our existing tools (disability documentation requirements, instructor discretion) can manage it. 

  The tone needs to be judicial - not debating philosophy but applying it operationally. References to Kant's texts (Groundwork especially) lend authority without getting bogged down in exegesis. 

