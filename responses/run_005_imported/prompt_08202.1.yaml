answer: |-
  Your situation reveals profound differences between trusting scientific findings and ethical judgments, even when both rely on testimony. Here's a breakdown:

  ### Key Differences in Trusting Ethical vs. Scientific Testimony:
  1. **Nature of the Claim**  
     - *Scientific fact* (e.g., wolf population data): Relies on empirical verification, reproducibility, and methodological consensus.  
     - *Ethical judgment* (e.g., "this practice was wrong"): Depends on normative reasoning, value frameworks, and contextual interpretation.  
     → **Core issue:** Ethical claims aren't "verified" the same way as data; they require engaging with values and principles.

  2. **Defensibility & Reconstruction**  
     - In science, you could *in principle* reconstruct methods (e.g., statistical analysis, fieldwork protocols) even if unfamiliar.  
     - Ethics requires reconstructing *reasoning* (e.g., "Why is 'consent by proxy' morally relevant? What makes animal stress a *wrong* and not just a *harm*?").  
     → **Your unease stems from lacking the philosophical tools to trace the argument's logic**, making it feel like borrowed conviction.

  3. **The Role of Expertise**  
     - Scientific trust is grounded in shared epistemic standards (peer review, data reproducibility).  
     - Ethical expertise involves mastering normative traditions (e.g., animal ethics, deontology) that may be alien to your training.  
     → You’re not just trusting a *person*; you’re trusting a *framework* you haven’t internalized.

  4. **Personal Stakes**  
     - Accepting a colleague’s data doesn’t implicate your past actions. Here, acknowledging wrongdoing triggers guilt or regret.  
     → **Moral beliefs demand personal ownership** in ways factual beliefs do not.

  ### Are You Entitled to Say "What I Did Was Wrong"?
  **Yes, but with crucial caveats:**  
  - You can *provisionally* hold this belief based on testimony, just as we trust historians or legal experts.  
  - However, to assert it *convincingly* (especially to skeptical colleagues), you’d need to:  
    a) **Clarify the basis:** "My conclusion rests on the expertise of environmental philosophers who argue that..."  
    b) **Distinguish belief from understanding:** "I accept this verdict, though I’m still learning the underlying reasoning."  
    c) **Commit to deeper engagement:** Study the ethical arguments (e.g., works by Clare Palmer, Lori Gruen) to make the belief *your own*.

  ### Practical Advice:
  1. **Reframe Your Position**  
     Instead of claiming full authority, say:  
     > *"Based on current ethical scholarship—which I’m still studying—I now recognize that my methods caused unjustifiable harm. I trust experts in this field, and their reasoning has persuaded me."*  

  2. **Bridge the Gap**  
     - Read your former student’s work. Ask her for introductory resources on animal ethics.  
     - Focus on core concepts: *moral patienthood*, *relational ethics*, and why "stress" transitions from scientific observation to ethical concern.  

  3. **Embrace Intellectual Humility**  
     Acknowledging past errors isn’t weakness—it’s evidence of growth. Science evolves ethically as well as methodologically. Your willingness to reconsider reflects integrity.

  ### In Short:
  Trusting ethical testimony is *structurally similar* to trusting scientific expertise but *existentially different* due to its personal and normative dimensions. You’re entitled to believe your actions were wrong based on credible testimony, but true conviction requires grappling with the philosophy behind it. This isn’t hypocrisy—it’s the beginning of moral reckoning.
