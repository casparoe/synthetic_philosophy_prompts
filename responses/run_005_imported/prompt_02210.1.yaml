  First, I need to recall Kant's official stance. In MS 6:442, he uses the term "amphiboly" to argue that any perceived duty to animals is a confusion. Duties are only to rational beings, and animals, lacking rationality, can't be ends in themselves. So cruelty to animals is wrong only because it harms the human agent's moral character. But then in his lecture notes (like 27:459), Kant discusses cases like caring for an old dog due to its faithful service, which seems to consider the animal's own history and merits. The tension is clear: how can a duty that's supposedly about self-perfection be so closely tied to the individual animal's circumstances?

