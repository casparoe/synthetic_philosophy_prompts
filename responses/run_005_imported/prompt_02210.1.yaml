  I should also think about pedagogical strategies. The user might benefit from structuring the seminar around this tension, encouraging students to debate whether Kant's indirect duties are sufficient or if they inadvertently point to direct obligations. Highlighting contemporary Kantian scholars like Korsgaard or Wood could provide updated perspectives. 

