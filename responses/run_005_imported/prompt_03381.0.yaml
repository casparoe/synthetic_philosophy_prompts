  First, I need to recall Parfit's Hitchhiker clearly: You're dying in the desert. A driver says she'll only take you if she predicts you'll pay $100 later. Once in town, paying does nothing for you. CDT says don't pay because it's causally ineffective at that point. But critics say this makes you die in the desert since the driver won't pick you up if she predicts non-payment. The standard fix is to be "irrationally" disposed to pay.

  The user wants the strongest case for CDT here. That means I need to defend the in-town refusal as rational while dismantling the "disposition" counterarguments. Key angles: temporal consistency, definition of rationality, and problems with commitment strategies.

  Hmm... McClennen's resolute choice says you should stick to your pre-crisis plan. But in CDT, plans are conditional on expected utility at each node. At the payment moment, the utility of paying is negative with no offsetting benefit. Why is sticking to a costly plan "rational" when the reason for it has vanished?

  Gauthier's constrained maximization suggests adopting dispositions that yield better outcomes. But the user wants me to attack this as switching the question. Exactly! Gauthier isn't making paying rational at T2; he's saying it's rational at T1 to choose a disposition that forces irrationality at T2. That's a bait-and-switch: "rationality" is redefined as the disposition, not the action. But CDT cares about actual consequences at the time of action.

  Important distinction: Rationality-of-action vs. rationality-of-policy. The user explicitly wants me to say that defending the action requires defending the refusal in town, not retreating to policy talk. So I should hammer that the "disposition" argument concedes that the action itself is irrational—it just claims we should "want" to be irrational. But CDT defines rationality by current action consequences.

  Also, the driver's prediction complicates things. If the driver predicts based on your actual decision rule, but CDT only considers causal effects of actions, not predictors' models. So at T2, your action can't affect the past prediction. The driver's accuracy is irrelevant to CDT's calculation at T2. Critics call this myopic, but it's epistemically honest: you can't retroactively control predictions.

  Another point: The "regret" argument. Critics say "See? You died in the desert because of CDT!" But that confuses ex post outcomes with ex ante rationality. At T1 (dying), CDT would absolutely choose a policy of paying later if it caused rescue. But at T2, the world has changed. Rationality is time-slice specific. Blaming CDT for "failing" here is like blaming someone for not buying fire insurance after their house didn't burn down.

  On resolute choice: McClennen says stick to plans, but why? If plans are tools to bind future selves, but future selves are still "you," CDT sees no benefit in self-binding when the bindings become harmful. Resolute choice feels like cheating—it assumes you can ignore current utility because "past you said so." But rationality shouldn't dogmatically follow sunk costs.

  Gauthier's constrained maximization: It works if others detect your disposition. But in Parfit's case, the driver only cares about your action, not your "true" disposition. If you can fake paying without being disposed, that's better. But if detection is perfect, Gauthier says adopt the disposition. However, at payment time, acting on that disposition is still causally pointless. Gauthier admits this but calls it "rational" only in the dispositional sense. For action-by-action CDT, that's incoherent.

  The user wants no FDT/UDT mentions, so I must avoid those. Focus on why CDT's local rationality is defensible: It never lies to itself. It pays only when payment causes a benefit. Here, it doesn't. Saying "but if you were different, things would be better" is true but irrelevant. You are who you are at T2.

  Strongest point: Demanding payment at T2 is like demanding you burn $100 for no reason, because of a counterfactual about your past self. But counterfactuals aren't causal. CDT respects actual causation, not "what if" stories that can't change anything.

