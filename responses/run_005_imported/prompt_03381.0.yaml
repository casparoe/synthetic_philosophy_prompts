answer: |-
  Here’s a rigorous defense of the CDT agent’s refusal to pay in Parfit’s Hitchhiker, directly engaging with resolute choice and constrained maximization. I argue that CDT’s in-town action is rational, while the "dispositional" alternatives fail by conflating policy rationality with action rationality or smuggling in question-begging assumptions.

  ### **Core Argument: CDT’s Refusal is Locally Rational**
  1. **The In-Town Causal Calculus is Correct**  
     Once in town, paying $100 provides *zero* causal benefit. The driver’s prediction is already fixed; no future interactions exist. CDT correctly identifies that payment is pure loss with no offsetting gain.  
     - *Rationality at time T* must be evaluated based on *actual consequences available at T*. Demanding an agent ignore causal reality to satisfy a past hypothetical ("If I were disposed to pay, I’d have been rescued") is not rationality—it’s self-punishment for failing to be a different agent.  
     - **Counter to resolute choice**: McClennen insists agents should "stick to their plan" (paying) to avoid dynamic inconsistency. But if the plan’s *justification* (rescue) is no longer operative at T, enforcing it is dogmatic. Why is "resolve" rational when it mandates a net-harmful action? CDT’s time-slice responsiveness isn’t a flaw—it’s honesty about the absence of causal leverage.

  2. **The "Dispositional" Move Changes the Subject**  
     Proponents argue: "You’d *ex ante* prefer to be disposed to pay, as it gets you rescued." This is true but irrelevant to the *in-town action*:  
     - **Ex ante rationality ≠ ex post rationality**: At the pre-rescue stage, adopting a payment disposition is rational (it causes rescue). But at the post-rescue stage, *being* that disposition leads to a loss. CDT acknowledges this shift—it doesn’t "fail"; it updates based on new information.  
     - **Gauthier’s constrained maximization (CM) equivocates**: CM claims it’s rational to become an agent who "cooperates" (pays) when mutual benefit is expected. But in Parfit’s Hitchhiker:  
       - *Before rescue*, CM correctly endorses committing to pay (as it enables rescue).  
       - *After rescue*, CM demands payment *despite no mutual benefit*. This is no longer "constrained maximization"—it’s *irrational compulsion*. Gauthier masks this by defining rationality as adherence to a disposition *regardless of context*, which is circular. If rationality requires losing $100 for no reason, the term is hollow.  

  ### **Engaging Resolute Choice & Constrained Maximization**  
  3. **Resolute Choice is Self-Undermining**  
     McClennen argues that resolute agents avoid dynamic inconsistency by following through on prior plans. But:  
     - In town, the *reason* for the plan (to secure rescue) is obsolete. Enforcing it transforms rationality into *rule worship*.  
     - **Practical contradiction**: If resolute agents can bind their future selves, why can’t the CDT agent at the desert stage "resolve" to *not* pay? Resolute choice arbitrarily privileges plans that *seem* beneficial ex ante, but ex post rationality must be locally justified.  
     - **CDT’s superiority**: CDT coherently explains why the desert-stage agent *wants* to pay (it causes rescue) and the town-stage agent *refuses* (no causation). Resolute choice forces irrationality at T2 to "save" the rationality of T1—a clear inconsistency.

  4. **Constrained Maximization Collapses into Self-Deception**  
     Gauthier’s CM requires agents to *actually be* disposed to cooperate, not just mimic it. But in Parfit’s Hitchhiker:  
     - If the driver detects true dispositions (e.g., via brain scan), CM says: "Become disposed to pay so you’re rescued."  
     - **Fatal flaw**: Once rescued, *acting* on that disposition (paying) *still* has no benefit. CM now demands:  
       - (a) **Irrational action**: Pay $100 for nothing, violating instrumental rationality.  
       - (b) **Self-deception**: "You must *want* to pay because it aligns with your disposition." But dispositions aren’t reasons—they’re psychological facts. If the agent recognizes paying is pointless, CM forces a choice: betray your rationality or betray your disposition.  
     - **CDT’s clarity**: CDT rejects the disposition fetish. At every stage, it asks: "What does this *do*?" In town, paying does nothing—so refusal wins. CM’s "rational disposition" is a Trojan horse for demanding irrational actions.

  ### **Why the "Regret" Argument Fails**  
  - **"But CDT agents die in the desert!"**: True, but this confuses *outcomes* with *rationality*. The driver’s prediction isn’t controlled by the town-stage agent—it’s fixed by the *type* of agent you are.  
  - **CDT’s consistency**: A CDT agent in the desert *wishes* it could commit to paying (to cause rescue). But wishing for impossible commitments isn’t irrationality—it’s honesty. Blaming CDT for not magically becoming a different agent is like blaming a calculator for not solving moral dilemmas.  
  - **The hidden premise**: Critics assume rationality *must* include pre-commitment to overcome prediction-based dilemmas. But this assumes its conclusion—that rational agents can bind themselves to net-harmful acts. CDT rightly rejects this as mystical.

  ### **Conclusion: CDT as the Honest Broker**
  The CDT agent who refuses to pay in town isn’t irrational—it’s the only agent taking *actual consequences* seriously. Resolute choice and constrained maximization disguise a bait-and-switch: they justify *in-the-moment* actions by appealing to *prior* benefits, which no longer exist. This is not dynamic rationality—it’s temporal schizophrenia. Parfit’s Hitchhiker doesn’t break CDT; it reveals that "rational irrationality" is an oxymoron. If rationality demands losing $100 for no reason, we’ve divorced it from human interests—and CDT’s "defect" becomes a badge of integrity.
