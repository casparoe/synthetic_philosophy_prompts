  First, let's unpack the core tension. The no-trade theorem says rational traders with the same priors won't trade purely on private info because the willingness to trade itself signals something's wrong. Keynes, on the other hand, saw markets as driven by animal spirits and beauty contests where people guess what others are guessing, especially for big uncertain questions.

