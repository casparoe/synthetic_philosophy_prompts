prompt: |-
  I am a PhD student in computer science and currently serve on the five-member panel that awards our department's competitive summer research fellowship. Funding requires a proposal to be judged both (a) technically feasible within one summer and (b) genuinely original beyond the applicant's published work; failing either condition is grounds for rejection. Panelists rated every proposal yes or no on (a) and (b) separately, and then, independently, gave an overall yes-or-no recommendation. On this year's most contested proposal, a majority said yes on feasibility, and a different, only partly overlapping majority said yes on originality, so tallied criterion by criterion, the proposal clearly passes. Yet tallying our overall recommendations directly, a majority came out against funding it — even though each panelist's overall vote was itself perfectly consistent with that panelist's own (a) and (b) judgments. Some of us want to just go with whichever tally favors the applicant; others want to fix a standing rule for next year so this never happens again. Is one of these two tallies simply the correct way to read the panel's collective decision and the other a mistake, or is something more fundamental going on that a standing rule cannot cleanly fix?
reasoning: |-
  We are facing a paradox in voting. The proposal passes on both criteria individually by majority, but when it comes to the overall recommendation, a majority rejects it. Moreover, each panelist is consistent: their overall vote is a function of their two criterion votes (presumably, they require both to be "yes" for an overall "yes", or at least that is the only way to be consistent with the rules).

   The problem arises because the majority on feasibility and the majority on originality are not the same set of people. This is known as the "Ostrogorski paradox" in social choice theory, which shows that the aggregation of individual preferences on multiple issues can lead to inconsistencies when compared to a direct overall vote.

   Let me break down the situation:

   - There are 5 panelists: A, B, C, D, E.

   - Let F be the set of panelists who vote "yes" on feasibility. Since a majority says yes on feasibility, |F| >= 3.
   - Let O be the set of panelists who vote "yes" on originality. Similarly, |O| >= 3.

   - However, the overall vote of each panelist is "yes" only if they voted "yes" on both criteria (because the proposal must pass both to be funded, and each panelist is consistent: they require both). Therefore, the overall "yes" votes are exactly the intersection of F and O.

   - The overall "no" votes are the complement: those who said no on feasibility OR no on originality.

   Now, the problem states that when we tally the overall recommendations, a majority (at least 3) said no. That means:

     |Overall "no"| >= 3   =>   |Overall "yes"| <= 2

   But note: |Overall "yes"| = |F ∩ O|

   So we have: |F ∩ O| <= 2.

   However, we know that |F| >= 3 and |O| >= 3. How can the intersection be only 2 or less?

   Example:

     Suppose F = {A, B, C} and O = {C, D, E}. Then F ∩ O = {C}. So only one panelist says yes on both, hence only one overall yes. Then the overall vote would be 1 yes and 4 no.

     Alternatively, F = {A, B, C} and O = {A, B, D}. Then F ∩ O = {A, B} (size 2). Then overall: 2 yes, 3 no.

     In both cases, the overall vote is no by majority.

   But note: the proposal passes criterion (a) because |F|>=3 and criterion (b) because |O|>=3. So by the criteria, it should pass.

   However, the panelists individually, when they form their overall vote, require both. Therefore, even though collectively the proposal passes both criteria, the set of panelists that pass each criterion individually are different, leading to a small intersection.

   This is a fundamental issue in aggregation: the two methods of tallying (by criterion and then requiring both to pass, versus by overall vote) are different.

   Why does this happen?

     - The criterion-by-criterion method is an "issue-by-issue" majority: we aggregate on each issue separately and then require both to pass.

     - The overall vote is a "premise-based" aggregation: each voter forms their overall judgment based on the premises (the criteria) and then we aggregate the conclusions.

     - The two methods can conflict.

   Which is the correct way?

     The funding rule is defined by the two criteria: the proposal must pass both (a) and (b). The criterion-by-criterion tally directly applies this rule: we check if a majority says yes on (a) and a majority says yes on (b). Therefore, by the rule, the proposal passes.

     However, the overall vote of the panelists is not about the criteria individually but about the entire proposal. Each panelist, following the rule, requires both criteria to be met. But note: the rule does not say that the overall vote must be taken. The rule is defined by the criteria.

     Therefore, the criterion-by-criterion tally is the correct way to apply the rule. The overall vote, while consistent with each panelist's individual reasoning, does not necessarily reflect the collective judgment on the criteria.

     But wait: what if the overall vote is taken as the primary decision mechanism? The problem states that the panelists gave an overall vote independently. However, the rule for funding is defined by the two criteria. So the rule does not say "a majority overall vote"; it says "passes both criteria by majority". Therefore, the criterion-by-criterion method is the one that matches the rule.

     However, the problem also says: "failing either condition is grounds for rejection". So if a majority of the panel says no on feasibility, then it fails. Similarly for originality.

     Therefore, the proposal should be funded because it passes both criteria by majority.

     Why then did the overall vote come out negative? Because the panelists who are in the feasibility majority are not the same as those in the originality majority. So when each panelist applies the rule individually (both criteria must be met for a yes), the set of panelists who say yes on both is less than a majority.

     This is a collective inconsistency: the group as a whole says the proposal is feasible and original, but when each member is asked to make a holistic judgment, only a minority of the group finds both to be true.

     However, note that the rule does not require that a majority of the panelists find both criteria to be true. The rule requires a majority for each criterion separately.

     Therefore, the correct decision according to the rule is to fund the proposal.

     But this leads to a situation where the majority of the panelists, when asked for an overall recommendation, say no. This is a problem of legitimacy: if the panel is supposed to represent the collective wisdom, and a majority is against funding, but the rule as written says to fund, then there is a conflict.

     This suggests that the rule as written might be flawed because it does not require that the same set of panelists who find the proposal feasible also find it original. However, the rule does not specify that the majorities must be the same.

     Alternatively, we might question whether the panelists are correctly applying the rule in their overall vote. The rule for funding is: pass both (a) and (b). Therefore, if a panelist believes the proposal passes (a) and (b) (by their own judgment), they should vote overall yes. But if they believe it fails at least one, they vote no. And that is what they are doing.

     The problem is that the collective outcome on the criteria (pass both) does not imply that a majority of the panelists individually would pass both. It only implies that on each criterion, a majority passes.

     Therefore, the two tallies are both valid but they measure different things:

       1. The criterion-by-criterion tally: does the proposal meet the two requirements of the funding rule? (Yes, because each criterion has a majority.)

       2. The overall vote tally: do a majority of the panelists, based on their own individual evaluations of both criteria, believe the proposal should be funded? (No, because only a minority of the panelists give yes on both.)

     The funding rule is defined by the first. So if we follow the rule, we fund.

     However, the second tally reveals that the panel is not in favor of funding. This might be because the panelists are concerned about other factors? But the problem states that each panelist's overall vote is consistent with their own (a) and (b). So they are only using (a) and (b).

     Therefore, the conflict is inherent in the aggregation.

     How can we fix it for next year?

     We cannot have both a rule that requires passing each criterion by majority and simultaneously require that a majority of the panelists individually pass both. The latter is a stronger condition.

     We have two options:

       Option 1: Keep the rule as is and use the criterion-by-criterion tally. Then we accept that sometimes a proposal that passes both criteria by majority will be funded even if a majority of the panelists, when asked to vote overall, would reject it.

       Option 2: Change the rule to require that the overall vote by the panel is a majority in favor. But note: the overall vote is taken after each panelist has applied the two criteria. So this rule would be: the proposal is funded if and only if a majority of the panelists vote overall yes. And that in turn requires that a majority of the panelists individually find both criteria to be met.

       This second rule is stronger: it requires that at least 3 panelists say yes on feasibility AND yes on originality. This is equivalent to requiring that the set F ∩ O has at least 3 members.

       But note: it is possible that the proposal passes each criterion by majority without having a majority on the overall vote (as we've seen). So if we change to the overall vote rule, we might reject a proposal that passes both criteria by majority.

     Which rule is better?

       - The current rule (criterion-by-criterion) is more permissive: it funds a proposal if it has broad support on each criterion, even if the supporters of feasibility are not the same as the supporters of originality.

       - The overall vote rule is more restrictive: it requires that there is a majority of panelists who support the proposal on both criteria.

     The choice depends on the goals of the fellowship.

       - If we want to fund proposals that are seen as feasible by a majority and original by a majority, regardless of whether the same people hold both views, then the current rule is fine.

       - If we want to fund only proposals that have a strong consensus, meaning a majority of the panelists are convinced on both counts, then we change to the overall vote rule.

     However, note that the problem states: "failing either condition is grounds for rejection". This suggests that the rule is defined by the two criteria. Therefore, the current rule (criterion-by-criterion) is the one that matches the stated policy.

     But the problem also says: "each panelist's overall vote was itself perfectly consistent with that panelist's own (a) and (b) judgments". This means that the overall vote is a direct consequence of the criteria. So the overall vote is also a valid reflection of the criteria, but at the individual level.

     The fundamental issue is that the aggregation of the criteria individually (by majority per criterion) does not imply that the aggregation of the overall judgments (by majority) will be consistent.

     This is a well-known paradox. There is no "correct" way in the abstract. It depends on what the department values.

     Proposed standing rule:

       We have two options for the standing rule:

          Rule 1 (current): Fund if and only if a majority says yes on feasibility AND a majority says yes on originality.

          Rule 2 (overall): Fund if and only if a majority says yes overall.

       We can show that Rule 2 implies Rule 1? Not exactly. If a majority says yes overall, then that majority must have each member saying yes on both criteria. Therefore, at least a majority says yes on feasibility (because all of the overall yes voters say yes on feasibility) and similarly for originality. So Rule 2 implies that the proposal passes both criteria by majority. But the converse is not true: Rule 1 does not imply Rule 2.

       Therefore, Rule 2 is stricter: it is a subset of Rule 1. Every proposal that passes under Rule 2 would pass under Rule 1, but not vice versa.

       Since the problem states that the proposal passed under Rule 1 but failed under Rule 2, that is an example.

     Which rule to choose?

       If we want to avoid the paradox and have a single consistent method, we must choose one.

       However, note that the paradox only occurs when the majorities on the two criteria are not the same. If we choose Rule 2, then we are effectively requiring that the majority on feasibility and the majority on originality have an overlap of at least 3 (so that the intersection has at least 3). This might be desirable if we want to ensure that the proposal has strong support from the same group of people.

       But it might reject proposals that have broad but not overlapping support. For example, a proposal that is seen as feasible by three panelists and original by three other panelists (with only one overlapping) would pass under Rule 1 but fail under Rule 2.

       Alternatively, we might consider a third rule: require that the proposal passes both criteria by majority and also that the overall vote is not a majority against? But that might be too vague.

     Conclusion:

       The two tallies are not mistakes; they reflect two different ways to aggregate the same individual judgments. The criterion-by-criterion tally (Rule 1) is the one that directly corresponds to the stated funding criteria. The overall vote tally (Rule 2) corresponds to a different aggregation that requires a majority of the panelists to be fully convinced.

       The department must decide which of these two rules they want to use.

       If they want to stick to the letter of the current rule (which is defined by the two criteria), then they should use Rule 1 and fund the proposal. But they should be aware that this can lead to situations where a majority of the panelists, when asked for an overall recommendation, would reject it.

       If they are more concerned about the overall consensus of the panel, then they should change the rule to Rule 2. This would require amending the funding rule to say: "the proposal is funded only if a majority of the panelists recommend funding overall", and note that each panelist's overall vote must be based solely on the two criteria (so they vote yes only if they say yes on both).

       However, note that Rule 2 might be seen as less transparent because it does not break down the reasons. But it is equivalent to requiring that the set of panelists who say yes on both criteria forms a majority.

