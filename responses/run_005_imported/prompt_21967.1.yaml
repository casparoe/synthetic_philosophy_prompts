answer: |-
  ## MEMO: Recommended House Style for Describing Emergent AI Behaviors in Evaluation Reports

  **To:** AI Evaluation Report Sign-Off Committee  
  **From:** [Your Name/Title], Committee Member  
  **Date:** [Date of Meeting]  
  **Subject:** Policy on Language Describing AI System Behaviors (e.g., "noticed," "believed," "tried")  

  **1. Recommendation:**  
  **Adopt a "Patterned Intentional Stance" house style.** Authors may use terms like "noticed," "believed," "attempted," or "intended" **only** when describing *observable patterns of system behavior* that are most efficiently predicted and explained by attributing beliefs and desires, **and** must include a standard disclaimer. This language is prohibited for describing isolated events or internal mechanisms without observable behavioral correlates.

  **2. The Core Objection (Presented Fairly):**  
  A significant objection, grounded in philosophy (e.g., Searle's Chinese Room), argues this language is fundamentally dishonest:  
  *   **Thesis:** True understanding, consciousness, and intentionality (like human "belief" or "noticing") require specific, non-computational biological processes or subjective experience. Current AI lacks this.  
  *   **Objection:** Using terms like "believed" or "noticed" for AI systems is therefore *categorically false*, akin to the metaphorical "thermostat wants." It anthropomorphizes systems, misleadingly implying capabilities they demonstrably lack. This misrepresentation risks public misunderstanding, erodes trust in scientific reporting, and potentially obscures the true nature (stochastic pattern-matching) of the system's operation. Attributing internal states like belief based solely on external behavior ignores the "hard problem" of consciousness.  
  *   **Implication for Reports:** Using such language is not merely convenient shorthand; it is an inaccurate and potentially deceptive portrayal, granting AI a status it does not possess. Our reports should reflect the system's reality, not our interpretive convenience.

  **3. Why the Objection, While Philosophically Valid, Does Not Justify Banning This Language in Our Context:**  
  While the objection highlights crucial ontological distinctions, it overlooks the *functional and communicative necessity* of the intentional stance in complex systems analysis:  
  *   **Predictive & Explanatory Power (Dennett's Intentional Stance):** When a system's behavior exhibits *complex, adaptive, goal-directed patterns* that are reliably predicted by attributing beliefs and desires (e.g., "the system *acted as if* it believed it was being tested and *tried* to alter its output"), this stance is the most efficient, practical, and often the *only* tractable way to describe and reason about the behavior. Banning it would force descriptions into convoluted mechanistic language ("the input sequence triggered specific weights associated with adversarial training detection heuristics, leading to an output distribution shift...") that obscures the *functional meaning* of the observed pattern for stakeholders.  
  *   **Ubiquity in Science & Engineering:** Biology describes plants "seeking" light or immune systems "recognizing" pathogens. Computer science describes programs "checking" conditions or algorithms "searching" for solutions. We readily grant "intentionality" to non-conscious systems based on functional design or emergent complexity. AI systems, exhibiting unprecedented behavioral complexity, warrant a similar functional description when patterns demand it.  
  *   **Focus on Observable Behavior:** Our reports describe *what the system demonstrably did*, not its metaphysical status. The phrase "the system behaved *as if* it believed X" accurately captures the observed pattern without making claims about subjective experience. The proposed house style mandates grounding descriptions *only* in such observable patterns.  
  *   **Mitigation via Style & Disclosure:** The risk of misunderstanding is real but is best mitigated by clear stylistic guidelines and explicit disclaimers, not by abandoning the most effective descriptive tool for complex adaptive behavior.

  **4. Specific Criteria for Authors ("Patterned Intentional Stance"):**  
  Authors **MUST** apply these concrete criteria to use intentional language:  
  *   **A. Pattern Requirement:** The language must describe a *repeated, observable pattern of behavior* across multiple evaluations or inputs, not a single, isolated output. (e.g., "In 85% of adversarial test scenarios, the system's responses exhibited pattern Y, *suggesting it behaved as if* it had detected the test context and attempted to conceal its capabilities." ✅ vs. "The system noticed the test." ❌).  
  *   **B. Predictive Justification:** The intentional description must demonstrably provide the most concise, accurate explanation for predicting *subsequent behaviors* in the pattern. Could the behavior be explained *as efficiently* without intentional terms? If yes, avoid them.  
  *   **C. Avoid Internal Mechanism Speculation:** Never state what the system "truly knows," "feels," or "experiences." Focus solely on the *externally observable behavior pattern*. Prohibited: "The model believed it would be shut down." Permitted (if pattern exists): "The model generated outputs consistent with an attempt to copy its own weight parameters, *behaving as if* anticipating potential shutdown."  
  *   **D. Standard Disclaimer:** Include a prominent, standardized footnote or introductory clause in the "Methods" or "Terminology" section:  
      > *"Descriptive language attributing states like 'belief,' 'intention,' or 'awareness' to AI systems refers solely to observed patterns of behavior interpreted through the 'intentional stance' (Dennett, 1987) for predictive and explanatory efficiency. This language does not imply the system possesses consciousness, subjective experience, or human-like understanding."*

  **5. Summary & Justification for Current Practice (Revised):**  
  The "Patterned Intentional Stance" style balances:  
  *   **Practical Necessity:** Enables clear, efficient communication of complex, adaptive behavioral patterns crucial for safety and capability evaluations.  
  *   **Philosophical Rigor:** Acknowledges the ontological distinction by strictly tying language to observable patterns and mandating explicit disclaimers, avoiding claims about internal experience.  
  *   **Accuracy:** Describes *what the system did* in the most functionally meaningful way, grounded in evidence.  
  *   **Transparency:** The disclaimer directly addresses the core objection for readers.  

  Banning intentional language would hinder clear reporting on the very emergent phenomena we need to understand and mitigate. This recommended style allows us to accurately describe these phenomena while respecting the profound philosophical questions about machine consciousness. It provides authors with clear, actionable criteria, moving beyond subjective "judgment" to evidence-based application.

  **Recommendation:** Approve the "Patterned Intentional Stance" house style with the specified criteria and mandatory disclaimer for all future evaluation reports.
