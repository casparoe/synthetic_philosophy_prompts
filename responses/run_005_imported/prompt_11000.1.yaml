  For new axioms, intuition is a starting point but not the end. Mathematicians use pragmatic criteria: usefulness, consistency, fruitfulness. The user's concern about intuitive evidence versus formal proof is valid. I should emphasize that while equivalence is formal, acceptance is human and contextual.

