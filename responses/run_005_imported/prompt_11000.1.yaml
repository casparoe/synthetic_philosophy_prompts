  I recall that the well-ordering theorem feels alien because we can't visualize or compute such an order. The reals are dense, so any well-order would be incredibly complex, beyond human imagination. AC, on the other hand, deals with finite choices in principle, even if infinite. That's a psychological difference.

  Zorn's Lemma sits in the middle because it's used in algebra for maximal ideals or bases. Its application feels more tangible, but the lemma itself is abstract. This variance in familiarity might explain the joke's divisions.

