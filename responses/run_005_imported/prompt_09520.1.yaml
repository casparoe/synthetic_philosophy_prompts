answer: |-
  Your student has identified a crucial tension in Aquinas's text that most secondary literature glosses over. Aquinas indeed weaves together two distinct justificatory frameworks without explicitly reconciling them, creating ambiguity about whether this constitutes a unified doctrine or a contextual patchwork. Here's a systematic analysis:

  ### 1. **The Two Arguments and Their Disjunction**
     - **Argument 1: Private Self-Defense (Double-Effect Core)**  
       - Applies to private individuals (non-public actors).  
       - **Mechanism:** Killing is *unintended* but *foreseen* side effect of protecting one's life.  
       - **Conditions:**  
         (a) Intention must be solely self-preservation ("not unlawful... since one's intention is to save one's own life").  
         (b) Proportionality: Force must be moderate ("not more than necessary").  
       - **Moral Logic:** Rooted in natural law ("natural to everything to keep itself in being") and the *per accidens* status of unintended effects.

     - **Argument 2: Public Authority (Common Good Justification)**  
       - Applies only to soldiers/judges ("such as have public authority").  
       - **Mechanism:** Killing may be *intended* if "referred to the public good."  
       - **Conditions:**  
         (a) Agent must hold legitimate authority.  
         (b) Intent must align with public duty, not private animosity.  
       - **Moral Logic:** Grounded in the state's responsibility for the common good ("public authority acting for the common good"). Killing is licit *as a means* to public order.

     - **Key Discontinuity:**  
       The public authority exception **bypasses double effect**. For soldiers, intending death isn't sinful *precisely because* it’s subordinated to the common good. This is a different structure: the act’s moral species is transformed by its public purpose, not by redirecting intention away from the killing itself.

  ### 2. **How Proportionality Functions**
     Proportionality operates differently in each framework:
     - **Private Defense:** Proportionality is *explicitly tied to force* ("more than necessary violence"). It constrains the *means* of defense, ensuring the unintended death remains "beside the intention."
     - **Public Authority:** Proportionality is *implicit in the duty* of office. Soldiers/judges "sin if moved by private animosity" – implying that *motive* (not force calibration) is the key constraint. The focus is on whether the intent serves public good, not on minimizing harm.

  ### 3. **How Many Arguments? A Dual Structure**
     Aquinas presents **two distinct justifications**, not one unified principle:
     - **Private Cases:** Governed by double effect (intention/foresight distinction + proportionality).  
     - **Public Cases:** Governed by authority-derived license to intend harm for common good (with motive constraints).  

     The join between them occurs at: *"But as it is unlawful to take a man’s life, except for the public authority..."* Here, he shifts from the private exception (based on unintended effects) to the public exception (based on authority). The two are parallel permissions, not extensions of a single logic.

  ### 4. **Implications for Trolley Literature**
     - **Original DDE Scope is Narrow:** Aquinas’s double-effect reasoning *only* applies to private self-defense. He offers **no general principle** for unintended effects in other contexts (e.g., bystanders in trolley cases).  
     - **Public Authority is Incommensurable:** The soldier/judge permission relies on a *sui generis* political justification irrelevant to private actors.  
     - **Modern Misappropriation:** Contemporary trolley theorists (Foot, Thomson) stretch Aquinas’s *private* double-effect reasoning to contexts he never addressed, while ignoring his stricter conditions (e.g., proportionality of force, natural-law grounding).  

  ### 5. **Resolving the Tension: A Suggested Interpretation**
     Aquinas’s article is best read as **contextual casuistry**, not a systematic theory. He addresses two separate scenarios:
     - **Scenario 1:** A private individual fending off an aggressor (resolved via double effect).  
     - **Scenario 2:** A public agent using lethal force (resolved via authority and common good).  

     His reply to Obj. 1 confirms this: Augustine’s prohibition (against *intending* to kill to save oneself) *only* applies to private actors. Public agents operate under a different moral logic. The "join" isn’t flagged because Aquinas sees these as complementary exceptions to the general prohibition on killing – not as parts of a single doctrine.

  ### Conclusion for Your Seminar
  - **Textbook DDE is a Partial Reading:** Standard summaries capture only 40% of the article (the private case) and ignore the public exception that contradicts intention-centric logic.  
  - **Proportionality is Universal but Asymmetric:** It binds both cases but manifests differently (force moderation vs. motive purity).  
  - **Historical Weight:** Aquinas’s text *cannot* bear the full weight of a "general" DDE applied to trolleys. It offers a narrow self-defense principle + a separate public-duty principle. Modern DDE is a creative adaptation, not a faithful extension.  

  This dual structure explains why later Scholastics (e.g., Suárez) struggled to systematize DDE – Aquinas left them two distinct tools in one drawer. Your seminar might productively contrast this text with Foot’s "Morality of Abortion" (1967) to show how modern philosophy abstracts and universalizes what Aquinas rooted in specific contexts.
