  For fading qualia, the guest's likely defense is that gradual replacement preserves function, hence qualia. The follow-up should ask if this dissolves or relocates the hard problem, pressing on why identical processing implies identical experience. This touches on the explanatory gap.

  The cheap talk question must highlight the disconnect between LLM outputs and underlying processes. The guest may appeal to functional architecture differences. The follow-up should challenge whether functionalism can detect simulation versus reality without behavioral criteria, which might be insufficient.

