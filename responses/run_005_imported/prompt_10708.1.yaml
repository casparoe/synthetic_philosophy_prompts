prompt: |-
  I host a small podcast on AI and philosophy of mind, and next week's guest defends computational functionalism about digital minds -- the substrate-independence line, that if a system implements the right functional/causal organization then its a moral patient, full stop, doesn't matter if its made of neurons or silicon. Can you draft me 8 or 9 interview questions that go beyond just having her restate that thesis? I want at least one question on the old Putnam/Searle worry that on a loose enough mapping almost any physical system can be said to "implement" almost any computation, so functionalism owes us a principled story about which causal structures actually count -- with a follow-up that steelmans her likely retreat to some more constrained account of implementation, then presses on whether that constraint is principled or just gerrymandered to get the answer she wants. At least one on the fading/dancing qualia thought experiment (the one where you swap neurons for functionally identical silicon parts one at a time and ask whether qualia fade smoothly or flicker weirdly), since that's obviously her go-to argument for substrate independence -- push on whether it actually does the work she needs or just relocates the mystery. And at least one on the "cheap talk" problem: current LLMs can already be prompted into claiming vivid suffering with zero training pressure toward that being true, so how does her criterion tell that apart from a system that's genuinely functionally isomorphic to a suffering brain. End on a question that forces her to name a concrete case or threshold that would update her away from granting moral status, so the view isn't unfalsifiable by construction. For each question, throw in a quick follow-up keyed to the dodge she's most likely to give.
