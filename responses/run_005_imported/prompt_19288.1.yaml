prompt: |-
  You are preparing questions for a podcast interview with a philosopher of religion who defends Molinism, the doctrine that God's providence over free creatures rests on middle knowledge of counterfactuals of creaturely freedom that are true logically prior to any divine decree. Draft eight to ten questions that do more than have the guest restate the position. Include at least one question on the grounding objection (what makes a counterfactual about a merely possible person true before that person exists or God has decreed anything), one on why the view needs a determinate "would" rather than a "might" counterfactual for every free creature in every circumstance, one on whether confining God's options to "feasible" worlds is compatible with treating divine power as unlimited, and one on whether the logic behind transworld depravity, extended consistently, commits the Molinist to admitting that there are possible persons who would be damned in every feasible world in which they exist and are free. For each question, add a short follow-up keyed to the reply the guest is most likely to give.
