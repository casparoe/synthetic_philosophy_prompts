  Feasible worlds and divine power: If God can only choose from feasible worlds, does that limit omnipotence? The Molinist might say God's power isn't constrained because He actualizes the best feasible world. But the follow-up should ask if this makes divine action contingent on creatures, challenging sovereignty.

  Transworld depravity consistency: If some people would freely reject God in any world, does that imply necessary damnation? The guest might distinguish transworld depravity from transworld damnation. The follow-up needs to press if consistently applied, this leads to unavoidable damnation for some, conflicting with divine goodness.

