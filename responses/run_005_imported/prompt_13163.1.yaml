answer: |-
  That's a fantastic question that cuts to the heart of Hobbes's entire philosophical project! Your memory is spot-on – there *is* a profound difference in Hobbes's conception of geometry compared to the standard Euclidean (and modern) view, and it absolutely explains both his initial approach to the classical problems *and* his intransigence against Wallis. While ego certainly played a role (it's Hobbes!), dismissing it as *just* vanity misses the deep philosophical motivation driving his geometric stubbornness. Let's break it down:

  **The Standard (Euclidean/Modern) Conception of Geometric Proof:**

  1.  **Abstract Objects:** Geometry deals with abstract, ideal entities (points, lines, circles) defined by properties and relations.
  2.  **Axiomatic-Deductive Method:** Proofs begin with self-evident axioms and definitions. New truths (theorems) are derived through rigorous, step-by-step logical deduction from these first principles and previously established theorems.
  3.  **Validity = Logical Necessity:** A proof is valid if the conclusion *necessarily follows* from the premises via deductive logic, regardless of how we might visualize or construct the figures involved. The focus is on the logical relationships.
  4.  **Formal Manipulation:** Symbols and algebraic manipulation (as Wallis championed) are valid tools because they accurately represent the logical relationships between abstract entities.
  5.  **Cause as Logical Ground:** The "cause" of a geometric truth is typically understood as the logical ground – the axioms and prior theorems from which it is deduced.

  **Hobbes's Materialist/Constructivist Conception of Geometric Proof:**

  1.  **Material Basis & Motion:** Hobbes, as a radical materialist, rejected abstract Platonic entities. For him, geometry is fundamentally about physical bodies and their motions. A geometric figure *is* the trace or boundary generated by the motion of a physical body.
      *   **Point:** A moving body considered only in its place, without magnitude.
      *   **Line:** The path traced by a moving point.
      *   **Surface:** The path traced by a moving line.
      *   **Circle:** The path traced by one endpoint of a line segment while the other endpoint remains fixed (the motion of a compass).
  2.  **Demonstration = Generation:** A geometric demonstration, for Hobbes, *must* show *how the figure is generated by motion*. It's not enough to logically deduce properties from static definitions; you must exhibit the *physical cause* of the figure's existence and properties through its mode of construction.
  3.  **Validity = Constructive Causality:** A proof is valid only if it demonstrates the *actual, physical generation* of the figure in question. Understanding *why* a property holds means understanding *how the motion that produced the figure necessitates that property*.
  4.  **Rejection of Abstract Algebra:** Hobbes vehemently rejected Wallis's algebraic methods. Algebra dealt with abstract symbols and equations, divorced from the physical motions generating figures. For Hobbes, this was meaningless gibberish – "scurvy," "scab of symbols," "signes of things" instead of the things themselves. It didn't provide the required causal explanation grounded in motion.
  5.  **Cause as Physical Generation:** The "cause" of a geometric property is the specific motion that generated the figure. Knowing the cause means knowing the generative motion.

  **The Distinctiveness of Hobbes's Approach:**

  *   **Radical Materialism:** He uniquely grounds geometry entirely in physical bodies and their motions, rejecting abstract mathematical objects.
  *   **Constructivism:** Proof *requires* demonstrating the physical construction via motion. It's not just a helpful illustration; it's the *essence* of geometric truth.
  *   **Causal Explanation:** Geometric knowledge is inherently causal knowledge – understanding the motion that causes the figure and its properties.
  *   **Anti-Formalism:** He rejects purely symbolic or logical manipulations (like algebra) that aren't directly tied to this physical generation.

  **Connection to His Broader Philosophy:**

  This geometric method is **absolutely foundational** to Hobbes's entire system, particularly *Leviathan* and his political philosophy:

  1.  **Model for Philosophy:** Hobbes believed *all* true philosophy (including political philosophy) should be built like geometry: starting from clear definitions of fundamental concepts (bodies, motion) and deducing complex phenomena through rigorous reasoning that reveals causes.
  2.  **Materialism & Causation:** Just as geometry must explain circles through the physical motion that generates them, political philosophy must explain the state (Leviathan) through the physical motions (desires, fears, reasoning) of human bodies that generate it via the social contract. Knowledge is power because understanding causes allows prediction and control.
  3.  **Deductive Certainty:** He sought the same level of absolute, incontrovertible certainty in politics that he believed his geometric method provided. Definitions (like defining "sovereign power" or "contract") had to be clear and foundational, leading deductively to necessary conclusions about political obligation and order.
  4.  **Generation of the State:** Just as a circle is generated by swinging a line, the state is "generated" by the motion of individuals contracting together and authorizing the sovereign. Understanding politics requires understanding this generative act.

  **Explaining the Wallis Conflict:**

  Here's why your friend's "vanity + bad math" explanation is incomplete, and why Hobbes was philosophically immovable:

  1.  **Fundamental Disagreement on Method:** Wallis was proving, using algebra and abstract geometry, that squaring the circle was *logically impossible* within the Euclidean framework. Hobbes didn't care. He wasn't operating within that framework. He believed his constructivist, causal method *could* and *did* solve it. Wallis's proofs, relying on symbols and abstract impossibility, were, to Hobbes, invalid *by definition* because they didn't engage with the physical generation of figures. Wallis was speaking a different (and, to Hobbes, nonsensical) language.
  2.  **Rejection of Wallis's Tools:** Algebra was anathema to Hobbes. He saw Wallis's critiques as attacks using illegitimate tools, not genuine geometric demonstrations. Dismissing them wasn't stubbornness *about math* per se, but *about what constituted valid knowledge*.
  3.  **High Philosophical Stakes:** Admitting Wallis was right about geometry wasn't just admitting a math error. It would have undermined the *entire epistemological and methodological foundation* of his life's work. If his geometric method, the model for all philosophy, was fundamentally flawed or incapable of solving key problems, what did that say about his political philosophy? His intransigence was partly a defense of his entire philosophical system. Concession felt like philosophical suicide.
  4.  **Misunderstanding Impossibility:** Hobbes genuinely struggled with the concept of *logical* impossibility separate from constructive possibility. If he could conceive of a motion that *seemed* to generate the required figure (even if flawed), he believed it *must* be possible. Wallis's abstract proofs didn't compute within his materialist/constructivist framework.
  5.  **Ego Amplified by Philosophy:** Yes, Hobbes had a massive ego and was notoriously combative. But this wasn't *just* ego. His philosophical convictions provided a powerful, internally consistent justification for his stance. The ego made him less receptive to criticism, but the philosophy gave him a fortress from which to fight.

  **Conclusion: A Genuine Clash of Worlds**

  You are absolutely right to see more than just vanity at play. Hobbes had a **genuinely distinctive, deeply held, and philosophically motivated conception of geometry** based on materialism, constructivism, and causal demonstration through motion. This conception was **intimately tied** to his broader project of building a science of politics modeled on geometry.

  While **Wallis was mathematically correct** and Hobbes *was* demonstrably wrong about squaring the circle (and the other problems), Hobbes wasn't *merely* being vain or stupid. He was operating within a different philosophical paradigm that defined geometric truth and proof in a way that made Wallis's correct mathematical arguments seem philosophically irrelevant or invalid. His refusal to back down stemmed from a fundamental clash between his materialist-constructivist vision of geometry and the emerging abstract-algebraic approach championed by Wallis, compounded by the existential threat this clash posed to his entire philosophical system.

  So, tell your friend: **It wasn't *just* vanity and bad math. It was a deeply committed (though ultimately flawed) philosophical vision of what geometry *is* and how truth is demonstrated, a vision central to Hobbes's entire intellectual project, colliding violently with the mathematical realities revealed by new methods he couldn't accept.** The ego fueled the fire, but the philosophical conviction built the unyielding wall.
