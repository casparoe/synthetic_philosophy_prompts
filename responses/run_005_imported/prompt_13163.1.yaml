prompt: |-
  So my friend and I got into it for like an hour last night over Thomas Hobbes -- not the usual Leviathan, state-of-nature stuff, but the fact that he spent something like twenty five years insisting he'd squared the circle (plus a few other classical problems) while this Oxford mathematician, John Wallis, kept publishing takedown after takedown showing the "proofs" were bogus, and Hobbes just never backed down, not even a little. My friends whole theory was basically "the guy was bad at math and too vain to admit it," case closed. But I've got this nagging memory from an early modern philosophy class (might've been reading De Corpore, or maybe just a secondary source on it) that there's more going on than pure ego -- something about Hobbes having a genuinely different idea of what makes a geometric demonstration valid in the first place, tied up with his materialism, where geometric figures basically have to be constructed by motion, like a circle just being the path traced out by a line swinging around a fixed point, and where a "proof" is supposed to show the actual cause of a figure's properties rather than just validly deriving conclusions from a set of axioms the way we were taught in school.

  I'd like to actually get to the bottom of this instead of trading vague impressions with my friend all night. Could you compare Hobbes's conception of geometric demonstration to the more standard, generic idea of mathematical proof (axioms plus valid deduction, more or less)? Mainly I want to know what's genuinely distinctive about Hobbes's version specifically, and how it connects to the rest of his philosophy -- I doubt it's a coincidence that this is the same guy who wanted to build civil philosophy up from first principles the exact same way you'd build up geometric theorems. And if you can settle it: does any of this actually explain why he was so weirdly immovable against Wallis, or is my friend right that I'm just constructing an elaborate excuse for a guy who lost a fight and couldn't handle it?
