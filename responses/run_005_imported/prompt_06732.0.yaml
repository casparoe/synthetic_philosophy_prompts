  The committee's dilemma is balancing confessional fidelity with intellectual honesty. Some members view PSA as essential, so any exception is unacceptable. Others, including the user, recognize the candidate's deep engagement and fear stifling theological inquiry. The user's own struggle with "in our place" suggests they want a solution that respects both tradition and thoughtful critique.

  The user's explicit request is a memo with three options: approve, deny, or revise. But deeper needs emerge. They need a way to uphold confessional standards without alienating nuanced thinkers. They also need to present a united front to the presbytery, avoiding divisiveness. The memo must demonstrate rigorous engagement with the candidate's argument while safeguarding core doctrines.

  For the memo structure, I consider starting with the context and the candidate's position. Then outline the committee's concerns: confessional language vs. philosophical critique. The key is showing that the candidate's interpretation misrepresents the Confession. The Confession's "in our place" isn't about legal fiction but substitution grounded in Christ's union with humanity. This distinction is crucial—Reformed theology sees Christ as the representative head, not a third party.

  I weigh the options. Approving risks undermining confessional authority. Denying might seem harsh and dismissive of valid critique. Requesting revisions is the most balanced. It acknowledges the candidate's intellect but demands alignment with confessional essentials. The candidate must show how his view fits within the tradition's boundaries, not outside them.

  The reasoning should challenge the candidate to deepen his engagement. He needs to reconcile his view with the Confession's emphasis on real satisfaction, not just legal fiction. This approach satisfies strict members by upholding doctrine and thoughtful members by encouraging theological rigor. It turns the exception into a teaching moment, demonstrating the committee's commitment to both orthodoxy and intellectual vitality.

  Potential pitfalls include the candidate refusing to revise or the presbytery rejecting the compromise. But the memo's strength lies in its clear theological reasoning, making it hard for either side to dismiss. By focusing on the union with Christ and representative substitution, it offers a framework that's both traditional and responsive to philosophical concerns.

  Finally, I ensure the memo is pastoral yet firm. It should affirm the candidate's strengths while demanding doctrinal clarity. This approach addresses the user's unspoken need for a path that maintains unity, upholds standards, and nurtures thoughtful candidates rather than excluding them.
answer: |-
  ## CANDIDATES COMMITTEE RECOMMENDATION MEMO

  **To:** Presbytery of [Presbytery Name]  
  **From:** Candidates Committee  
  **Date:** [Date]  
  **Subject:** Recommendation Regarding Candidate [Candidate's Name] - Exception Sought on WCF 11.3 (Penal Substitution)  

  ### I. Context & Candidate's Position
  Candidate [Name] seeks an exception to the language of Westminster Confession of Faith (WCF) 11.3 concerning the nature of Christ's satisfaction, specifically the mechanics of penal substitution. His argument, grounded in philosophical analysis influenced by David Lewis's essay, contends that:
  1.  Lewis's "debt payment" analogy for penal substitution inherently requires a legal fiction if punishment does not fall upon the *deserving* party.
  2.  This renders penal substitution a "legal fiction" rather than the "real retributive justice" implied by the Confession's phraseology (e.g., "in their place," "bearing the punishment due to them").
  3.  He affirms Christ's atoning death as efficacious for salvation but questions the specific *retributive* mechanism described in WCF 11.3 as being incompatible with strict philosophical justice without resorting to fiction.

  ### II. Committee Deliberation & Key Concerns
  The Committee engaged in extensive theological discussion regarding this exception request. Key points of consideration include:

  1.  **Confessional Language (WCF 11.3):** The Confession states Christ "by His perfect obedience and sacrifice of Himself... hath fully satisfied the justice of His Father; and purchased... an everlasting inheritance... for all those whom the Father hath given unto Him." It explicitly frames this satisfaction as Christ acting "in their place," "bearing the punishment due to their sins." This language strongly emphasizes *personal substitution* and *bearing the punishment due to sin*.
  2.  **The Candidate's Argument:** The Committee acknowledges the candidate's intellectual rigor and engagement with complex theological concepts. His use of Lewis highlights a genuine philosophical tension concerning retributive justice and substitution. His desire is not to deny atonement *per se*, but to redefine the *mechanism* away from strict retribution falling on the innocent.
  3.  **"Essential Doctrine" Question:** The Committee recognizes that the *efficacy* of Christ's atoning sacrifice *for the forgiveness of sins and reconciliation with God* is undeniably an essential doctrine of the Christian faith and Reformed tradition. The specific *explanation* of *how* that atonement satisfies divine justice (penal substitution) is a primary, confessional formulation within our tradition. While alternative atonement models exist (e.g., Christus Victor, Moral Influence), penal substitution is the dominant and explicit framework of the WCF.
  4.  **"Legal Fiction" vs. "Real Satisfaction":** The crux lies here. The candidate posits that penal substitution *as understood by the Confession* necessitates a legal fiction. The Confession, however, intends to describe a *real transaction* satisfying the real demands of God's justice. The Committee finds the candidate's characterization risks undermining the Confession's intent to portray a genuine satisfaction of justice, not merely a legal artifice. The Reformed understanding hinges on:
      *   **Union with Christ:** Christ is not a *mere* third party. Through the incarnation and the covenant of redemption, He becomes the representative head of His people (the "Last Adam," Romans 5:12-21; 1 Cor 15:22). His bearing of punishment is grounded ontologically in this representation.
      *   **Divine Agency:** God the Father ordains the sacrifice; God the Son willingly offers it. This is not an external legal system mechanically applied, but the outworking of God's own righteous character and loving purpose within the Godhead.
      *   **The Nature of Divine Justice:** God's justice is not identical to human retributive systems. While it includes retributive elements, its ultimate purpose is restorative within the context of His holiness and covenant faithfulness. The Confession asserts Christ's sacrifice *really and fully* satisfied this divine justice.

  ### III. Committee Recommendation: Return for Revisions
  The Committee **recommends that the candidate's exam be returned for specific revisions** concerning this exception request. We do **not** recommend approval of the exception *as currently articulated*, nor do we recommend ending his candidacy at this stage.

  #### Reasoning:
  1.  **Insufficient Engagement with Confessional Intent:** While the candidate adeptly identifies a philosophical tension using Lewis, he has not sufficiently engaged with the *theological* framework within which the Confession articulates penal substitution (representation, union with Christ, divine agency). His critique reduces the Confession's language to a simple human legal analogy without addressing its deeper covenantal and Trinitarian context. His conclusion that it *must* be a legal fiction does not adequately grapple with the Reformed understanding of Christ's representative headship.
  2.  **Risk of Misrepresenting the Confession:** Describing the Confession's view as surviving *only* as a "legal fiction" misrepresents the intent and substance of WCF 11.3. It frames the doctrine in terms the Confession itself would reject. The candidate needs to demonstrate whether his view *can* be articulated within the bounds of the Confession's core assertion of real satisfaction achieved through Christ bearing the punishment due to sin *in the place* of sinners, or if his view fundamentally alters that core assertion.
  3.  **Need for Constructive Formulation:** The exception request is primarily framed as a *rejection* of the Confession's language based on a perceived contradiction. The Committee requires the candidate to move beyond critique and articulate a *positive, constructive* theological position on the atonement that:
      *   Affirms the *efficacy* of Christ's death for the forgiveness of sins and reconciliation with God.
      *   Explicitly addresses the language and intent of WCF 11.3 regarding satisfaction of divine justice and substitution.
      *   Explains how his view (influenced by his reading of Lewis or otherwise) either:
          a)   **Fits within** the confessional understanding (e.g., by reinterpreting "retributive justice" in a way compatible with representation and divine agency, while still affirming Christ bore the punishment *due to sin* in the place of sinners), OR
          b)   **Constitutes a genuine exception**, but one that does not undermine the essence of the gospel or the system of doctrine contained in the Scriptures as summarized in the Confession.
      *   Engages directly with the Reformed doctrine of union with Christ as the foundation for substitution.
  4.  **Preserving Rigor and Fidelity:** This path honors the candidate's intellectual engagement by taking his argument seriously and demanding deeper theological work. It simultaneously upholds the Committee's duty to ensure candidates understand, can support, and are willing to submit to the Confession's teaching, or can articulate a justifiable exception that does not strike at the vitals of Reformed soteriology. Refusing this revision request would bypass necessary theological clarification. Approving it as-is would set a precedent allowing the Confession's core soteriological framework to be dismissed as "fiction."

  ### IV. Specific Instructions for Revision
  The candidate is instructed to revise his paper section on the atonement to explicitly address the following:

  1.  Explain how his understanding of Christ's atoning work relates to the *specific language* of WCF 11.3 concerning Christ acting "in their place" and "bearing the punishment due to their sins."
  2.  Engage theologically with the concepts of:
      *   Christ as the representative/head of His people (Rom 5:12-21, 1 Cor 15:22).
      *   The role of divine agency (Father, Son, Spirit) in the atonement.
      *   How his view understands the *satisfaction of God's justice* if not through the mechanism described as penal substitution in the Confession. Does it affirm a *real satisfaction*? If so, how?
  3.  Clarify his use of the term "legal fiction." Does he believe the Confession *intends* to teach a fiction, or that its formulation *logically reduces* to one? How does his alternative avoid being a fiction while still achieving satisfaction?
  4.  State clearly whether his revised view:
      *   Represents an *interpretation* of WCF 11.3 he believes is valid, OR
      *   Constitutes a *bona fide exception* to the wording of WCF 11.3.
  5.  If taking an exception, articulate why this exception does not constitute a rejection of an essential element of the gospel or the system of doctrine in the Confession. Specifically, address how his view upholds the reality of sin's penalty being borne by Christ for the salvation of sinners.

  ### V. Conclusion
  The Candidates Committee believes Candidate [Name] possesses the intellectual capacity and theological potential to undertake this revision. We appreciate his thoughtful engagement and desire for clarity. This recommendation seeks not to stifle inquiry but to ensure that any exception taken is based on a thorough, accurate understanding of the Confession and a robust, constructive theological alternative that can be evaluated fairly by the Presbytery. We look forward to receiving his revised work for further consideration.

  Respectfully submitted,

  The Candidates Committee  
  [Presbytery Name]
