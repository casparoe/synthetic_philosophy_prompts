prompt: |-
  I somehow ended up on my university's conflict-of-interest committee this year, and we've got a case that reads like something out of my own seminar. A colleague who works on Confucian role ethics hired his nephew as a paid research assistant without disclosing it, flatly violating our nepotism policy. When called on it, he didn't deny anything -- he argued the policy assumes a liberal individualist self his own view rejects, that theres no self prior to its roles to be 'impartial' in the way we're demanding, and that favoring his nephew is just what being a good uncle requires. Half the committee wants to sanction him like anyone else; half thinks its hypocritical to make him perform a commitment he doesn't hold. Can you draft the memo for next week's meeting -- an actual recommendation on what happens to him and whether the policy needs rethinking, that takes his defense seriously on its own terms (including whether his own tradition really backs him up) rather than assuming our norms just win by default?
