prompt: |-
  I'm taping a podcast episode next week with a guest who's spent her career defending Strawson's line that reactive attitudes -- resentment, gratitude, indignation -- are the bedrock of moral responsibility, not something that needs backing from a metaphysical verdict on free will vs determinism. Her favorite dodge when pushed is to say that asking whether the reactive attitudes are themselves justified isn't even a question you can ask from outside the practice. Can you draft me 7-8 interview questions that don't just let her restate Strawson? I want at least one that forces her to engage the Watson/Wolf complaint that naturalism describes our practices but doesnt vindicate them, one on whether the "objective attitude" toward psychopaths and "he's not himself today" cases is a sharp binary or something that creeps outward as we learn more neuroscience, and one on how her view handles Pereboom-style manipulation cases, where the reactive attitudes still fire even though we don't think the agent's responsible. Throw in a follow-up for each keyed to the reply she'll probably give.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a guest who strongly supports P.F. Strawson's view on reactive attitudes and moral responsibility. They want challenging questions that go beyond just restating Strawson's arguments. Let me break down their request.

  First, the user mentioned specific points they want addressed: the Watson/Wolf critique about naturalism not vindicating practices, the spectrum of the objective attitude with neuroscience, and Pereboom's manipulation cases. I need to make sure each of these is covered in the questions.

  The guest's common dodge is dismissing justification questions as external to the practice. So, each question must bypass that by staying internal or forcing engagement. For example, asking how participants themselves might question the practice from within.

  For the Watson/Wolf point, the question should challenge whether describing practices suffices. Maybe frame it as internal doubts within the community. Follow-up could push on whether participants seek deeper grounding.

  On the objective attitude, the key is whether it's binary or a spectrum. Neuroscience advancements might blur lines, like in addiction or trauma. Follow-up needs to address how reactive attitudes adjust as understanding grows.

  Pereboom's cases show reactive attitudes firing without responsibility. Questioning why they persist and if that's problematic. Follow-up could explore if this persistence indicates a flaw in the practice.

  The user probably wants to push the guest into deeper philosophical engagement, avoiding easy retreats to Strawson's basics. They might also want to highlight tensions in the theory for listeners. Need questions that are precise but open-ended enough for discussion. Ensuring each question has a follow-up that anticipates the guest's possible responses is crucial. That way, the host can keep the conversation moving forward without letting the guest off the hook. Also, considering the podcast format, questions should be accessible yet thought-provoking to engage the audience.
answer: |-
  Here are 8 interview questions designed to push beyond Strawsonian restatement, targeting the specific concerns you raised, with anticipated dodges and sharp follow-ups:

  1.  **The Watson/Wolf Challenge (Description vs. Vindication):**
      *   **Question:** "Strawson famously argues that asking whether the *entire framework* of reactive attitudes is 'justified' from some external, metaphysical standpoint is illegitimate. But Gary Watson and Susan Wolf argue that Strawson merely *describes* our moral responsibility practices; he doesn't *vindicate* them against skeptical worries. He tells us *what* we do, but not *why* it's ultimately *correct* or *rational* to do it, especially if determinism is true. Isn't there a genuine internal demand *within* the practice itself – perhaps voiced by the reflective participant experiencing doubt – for some deeper grounding beyond 'this is just what we do'?"
      *   **Anticipated Dodge:** "That demand *is* the external question in disguise. The practice *is* its own vindication; justification is internal to the form of life. Asking for more is like asking if the rules of chess are 'really' justified."
      *   **Follow-up:** "But participants *within* chess *can* question if a particular rule makes the game better or worse, fairer or less fair. Similarly, within our moral practice, participants *do* grapple with questions like 'Is blame *ever* truly fair if our actions stem from causes beyond our ultimate control?' Isn't *that* internal doubt precisely the space where Watson/Wolf's demand for vindication arises *from within*, not from some impossible external perch? How do you answer *that* participant?"

  2.  **The Scope of the Objective Attitude (Binary vs. Spectrum):**
      *   **Question:** "Strawson contrasts the participant reactive attitudes with the 'objective attitude' we take towards children, the severely mentally ill, or someone 'not themselves'. You mentioned 'he's not himself today' cases. As neuroscience reveals more about the mechanistic underpinnings of *all* behavior – showing how addiction, trauma, psychopathy, or even ordinary decision-making involve complex causal chains – does the objective attitude risk becoming a slippery slope? Couldn't a naturalistic understanding gradually *expand* the scope of who we see as 'not themselves' or as appropriate targets for the objective stance, potentially hollowing out the domain of reactive attitudes?"
      *   **Anticipated Dodge:** "The distinction is practical, not metaphysical. It's based on whether *engagement* with the reactive attitudes is *possible* or *fruitful* in a specific relationship or context. Neuroscience might inform *when* we judge engagement fruitful, but it doesn't dissolve the fundamental distinction in our interpersonal responses."
      *   **Follow-up:** "Exactly. So, isn't the boundary inherently *fluid* and *context-dependent*? If neuroscience shows us that the mechanisms underlying, say, chronic impulsivity or pathological selfishness are remarkably similar to those in milder forms we *do* hold people responsible for, doesn't this force a continuous, case-by-case negotiation *within* the practice about where to draw the line for 'fruitful engagement'? Doesn't this fluidity undermine the idea of reactive attitudes as a stable, non-negotiable 'bedrock'?"

  3.  **Pereboom's Manipulation Cases (Reactive Attitudes Firing "Falsely"):**
      *   **Question:** "Derk Pereboom's manipulation cases (like 'Professor Plum') are designed to show that our reactive attitudes can be triggered even in scenarios where, upon reflection, we *don't* think the agent is genuinely morally responsible – perhaps because they were covertly manipulated by neuroscientists. The reactive attitude 'fires', but we judge it *inappropriate*. Doesn't this suggest that the mere *occurrence* of the reactive attitude isn't sufficient to establish genuine responsibility? That we *do*, in fact, rely on implicit metaphysical assumptions (like 'he wasn't manipulated') for the attitude to be *warranted*, even within the practice?"
      *   **Anticipated Dodge:** "Pereboom's cases are science fiction. In real life, discovering such manipulation *would* immediately shift us to the objective stance towards the manipulated agent. The reactive attitude *itself* carries the sensitivity to such defeating conditions; it's not 'firing falsely,' it's our initial response being *revised* based on new information *within* the framework."
      *   **Follow-up:** "But isn't the key point *why* we revise it? When we learn of the manipulation, we don't just *lose* the feeling of resentment; we judge that the resentment we *did* feel was *mistaken* or *unfitting*. We appeal to something *about the agent's actual condition* (lack of true control, being a puppet) that made the attitude inappropriate *even when we felt it*. Doesn't this reveal that our practice *does* implicitly track a deeper condition for the *fittingness* of the attitude – a condition that looks suspiciously like a metaphysical requirement for control – rather than the attitude *itself* being the sole arbiter?"

  4.  **The "Internal" Justification Dodge:**
      *   **Question:** "You often emphasize that asking whether the reactive attitudes are 'justified' from outside the practice isn't a coherent question. But let's stay *inside*. Within the practice, participants hold each other *accountable*. Part of that accountability involves giving *reasons* for our reactive attitudes: 'I resent you *because* you knowingly betrayed me.' Doesn't this demand for reasons implicitly open the door to asking for the *grounds* of the entire framework? If a skeptic *within the moral community* asks, 'But why *should* we structure our lives around resentment and gratitude at all?', how do you answer *them* without appealing to something beyond the practice's own existence?"
      *   **Anticipated Dodge:** "The 'should' here is internal too. The answer lies in showing the skeptic what they lose: the possibility of deep friendship, love, trust, meaningful relationships – the very fabric of a recognizably human life. The framework is constitutive of these goods."
      *   **Follow-up:** "But couldn't a sophisticated skeptic reply: 'I understand those goods are *contingently* tied to this framework *for beings like us*, but if determinism is true, isn't it ultimately an elaborate, painful fiction? Isn't the 'good' of resentment just the sting of a mechanism we can't escape?' How do you convince *that* internal skeptic that the framework isn't just a biologically ingrained illusion, but something genuinely *normative*?"

  5.  **Emotional Responsiveness vs. Moral Desert:**
      *   **Question:** "Strawson grounds responsibility in *our* emotional responses to the quality of others' wills towards us. But this seems to shift the focus from something being *deserved by the agent* to something being *elicited from us*. How does your view handle the strong intuition that moral responsibility is fundamentally about what the agent *merits* – punishment, blame, praise – based on their own deeds and capacities, *independently* of whether anyone actually feels resentment or gratitude towards them? Doesn't reducing it to our reactions risk making responsibility overly dependent on the sensitivities of the reactor?"
      *   **Anticipated Dodge:** "The idea of 'desert' detached from any possible community of reactors is empty. What could it mean? The reactive attitudes *are* the natural expression of perceiving ill- or good-will; they *constitute* our recognition of (im)propriety and thus of desert *within* the human form of life."
      *   **Follow-up:** "Consider someone who commits a terrible wrong but is universally unknown or forgotten. Do they *deserve* blame on your view? If so, in what sense, if no reactive attitudes are actually directed at them? If not, doesn't that conflict with a core intuition about responsibility? If the answer is 'They *would* deserve it *if* known,' isn't that 'would' pointing to a standard *beyond* the actual occurrence of the attitudes?"

  6.  **The Normativity of the Attitudes Themselves:**
      *   **Question:** "Strawson stresses that reactive attitudes aren't *just* brute feelings; they involve demands and expectations. But where does the *normative force* of *these demands and expectations* come from? When I resent you, I don't just *feel* upset; I feel you *ought not* to have done that, you *owe* me something. How does the Strawsonian account explain the intrinsic *oughtness* embedded within the reactive attitudes themselves? Is this 'ought' simply another feature of the psychological response, or does it gesture towards something justificatory beyond it?"
      *   **Anticipated Dodge:** "The 'ought' is built into the attitude's intentional structure. To resent is *ipso facto* to experience the other as having violated a legitimate expectation. The normativity is internal to the attitude's form."
      *   **Follow-Up:** "But doesn't this risk circularity? We have the attitude because we perceive a normative violation, and the perception of normative violation *is* the attitude. How do we distinguish *appropriate* resentment grounded in a *genuine* wrong from *inappropriate* resentment based on a misunderstanding or neurosis, *without* appealing to some standard independent of the feeling itself? Doesn't making that distinction require resources potentially *outside* the pure phenomenology of the attitude?"

  7.  **Alternatives and Moral Progress:**
      *   **Question:** "If our responsibility practices are solely grounded in our current, contingent reactive attitudes, how does your view account for the possibility of *moral progress* in those practices? For instance, we largely reject resentment based on caste, gender, or sexual orientation in ways previous societies did not. If we criticize past practices (e.g., blaming victims of assault), are we appealing to a better *internal* calibration of our reactive attitudes, or are we implicitly appealing to a standard *external* to the attitudes prevalent at that time?"
      *   **Anticipated Dodge:** "Progress happens through *internal* critique and extension – recognizing the humanity of others previously excluded, seeing inconsistencies in applying reactive attitudes, expanding our sense of the 'moral community'. We use the resources *within* the evolving practice."
      *   **Follow-up:** "But *what drives* this 'recognizing humanity' or 'seeing inconsistencies'? When abolitionists argued against resentment towards escaped slaves, weren't they appealing to fundamental facts about human equality and autonomy that they believed held *regardless* of whether slaveholders *felt* the reactive attitudes were appropriate? Doesn't this suggest the critique relies on values or truths perceived as *constraining* the practice, not just emerging from it?"

  8.  **Psychopathy as a Test Case for "Quality of Will":**
      *   **Question:** "Psychopaths are often the paradigm case for the objective stance. Strawson says they lack the 'general capacity' for ordinary interpersonal relationships. But psychopaths often display superficial charm, understand moral language descriptively, and can manipulate others – they grasp the *instrumental* value of appearing to have goodwill. How does your view distinguish between someone who merely *fakes* the outward signs of a quality of will (perhaps skillfully) versus someone who genuinely *has* the capacity underlying the reactive attitudes? Isn't determining this crucial for applying the objective stance, and doesn't it require looking *beneath* the surface of behavior to cognitive/affective capacities – potentially stepping onto metaphysical ground?"
      *   **Anticipated Dodge:** "The distinction is made within the practice based on sustained interaction. We recognize the *hollowness* or *instrumentality* of their responses; genuine reactive attitudes involve reciprocal engagement they cannot sustain. It's a practical discernment."
      *   **Follow-up:** "But isn't this 'discernment' precisely an attempt to assess an *internal capacity* – the capacity for reciprocal regard or empathy? And when neuroscience claims to identify the neural correlates for the *absence* of this capacity in psychopathy, isn't it providing evidence relevant to that discernment *within* the practice? Doesn't this show that the practice *does* rely on implicit assumptions about underlying cognitive/affective machinery, even if it doesn't require a full-blown libertarian metaphysics?"

  **Key Strategies Embedded:**

  *   **Internalizing the Challenge:** Framing skeptical worries (Watson/Wolf, Pereboom) or normative demands as arising *from within* the practice or the perspective of a participant.
  *   **Highlighting Tensions:** Pointing out potential conflicts within the Strawsonian view itself (e.g., desert vs. elicitation, attitude persistence in manipulation cases).
  *   **Focusing on Nuance:** Pushing on the practical complexities (spectrum of objective attitude, discerning genuine quality of will) that challenge clean Strawsonian binaries.
  *   **Demanding Explanation:** Asking for the *source* of key features (normativity, progress, fittingness) without allowing a retreat to "it's just part of the practice."
  *   **Anticipating Dodges:** The follow-ups are designed to cut off the most likely retreats to pure Strawsonian orthodoxy by tightening the focus on the specific implication of the initial question.

  Good luck with the interview! These should make for a lively and philosophically rigorous discussion.
