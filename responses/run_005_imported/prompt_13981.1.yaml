prompt: |-
  I'm the CTO at a small startup and I sit on the committee deciding how far to keep going in a bidding war to acquire another startup for its team. We lost a similar bidding war to this same rival last year. Our offer used to match our own internal valuation of the target; after several rounds of back and forth we're now 40% over that number, and we've already burned $250k in legal/diligence fees that we lose no matter what happens. Half the committee wants to raise again -- "we're already this deep, no point loosing that 250k for nothing" -- and the other half wants to walk. Someone joked this is basically the dollar auction thing from that game theory post everyone shared a while back, except "lol sunk cost fallacy" doesn't feel like the full answer here, since there's an actual live competitor still bidding against us, and the founders of the company we're fighting over come out ahead either way, which feels relevant but I can't say why. Write me the memo I'd bring to the committee: a clear recommendation (raise, hold, walk, or something else), a concrete stopping rule, and honest engagement with the "we're already this deep" argument instead of just waving it off as a bias.
reasoning: |-
  Okay, the user is the CTO of a startup involved in a bidding war to acquire another company primarily for its team. They've already exceeded their internal valuation by 40% and spent $250k in sunk costs. The committee is split between continuing or walking away, with some referencing the dollar auction paradox but feeling it's more complex here due to an active competitor and founders benefiting regardless.

  First, I need to unpack the key elements. The sunk cost fallacy is a major factor—they've already spent $250k they can't recover, which shouldn't influence future decisions. But the committee's "we're already this deep" argument needs addressing beyond just labeling it a fallacy. How can I validate their feelings while steering them toward rational decision-making?

  The dollar auction analogy is relevant but not perfect. In a classic dollar auction, two bidders escalate bids for a dollar, often paying more than it's worth due to commitment. Here, the stakes are higher with a real competitor and strategic implications. The rival won the last bidding war, which might indicate a pattern—maybe they have deeper pockets or higher valuation thresholds. That historical context is crucial.

  The founders of the target company benefit regardless of who wins. This introduces a psychological element: the acquirer might feel they're enriching the founders unnecessarily by driving up the price. But economically, the target's gain doesn't affect the acquirer's costs—only the price paid matters. Still, the committee might perceive this as a reason to avoid overpaying, which is valid.

  The user's explicit request is for a memo with a clear recommendation, a stopping rule, and engagement with the sunk cost argument. The deeper needs include preserving the startup's financial health, avoiding past mistakes, and making a defensible decision that unites the divided committee. They might also want to prevent future bidding wars from draining resources.

  I should recommend walking away. The price is already 40% above their valuation, and continuing risks escalating losses. The sunk costs are gone, and throwing good money after bad isn't rational. The stopping rule needs to be concrete: define a hard cap based on strategic value, not exceeding a certain percentage over valuation, and include non-price factors like integration risks.

  For the sunk cost argument, acknowledge the emotional weight—$250k is significant for a small startup—but emphasize that recovering it isn't possible. Continuing only increases losses. Reframe it: the real loss isn't the sunk cost but the additional funds wasted if they overpay. This shifts focus to future costs.

  The rival's presence is a red herring. They might be using similar logic or have deeper pockets. The startup can't control the rival's actions, so focusing on their own limits is wiser. The founders benefiting is emotionally frustrating but irrelevant to the acquisition's value. The priority should be the startup's strategic gain, not the target's windfall.

  Including an alternative approach, like disengaging now but revisiting later if the deal falls through, offers a pragmatic compromise. It addresses FOMO while avoiding further bidding. This could appeal to both factions in the committee.

  Finally, structure the memo clearly: summarize the situation, state the recommendation upfront, explain the reasoning, provide the stopping rule, and address counterarguments. Use bullet points for readability. End with a call to action for a united decision, reinforcing that walking away is a strategic choice, not defeat.
answer: |-
  **MEMORANDUM**  
  **TO:** Acquisition Committee  
  **FROM:** CTO  
  **SUBJECT:** Bidding War Strategy & Recommendation for [Target Startup]  
  **DATE:** [Current Date]  

  ---

  ### **Executive Summary**  
  **Recommendation: Withdraw from the bidding immediately.** Our current offer (40% above internal valuation) exceeds strategic value, and escalating further risks material harm. We will implement a **hard stopping rule: Cease bidding at 25% above internal valuation in future acquisitions.** The sunk $250K is irrelevant to future bids—proceeding now would compound losses. If the target team remains critical, we re-engage post-deal if the acquirer fails to retain them.  

  ---

  ### **1. Context & Key Risks**  
  - **Current Bid:** 140% of our maximum justified valuation ($X → $1.4X).  
  - **Sunk Costs:** $250K in diligence/legal fees (irrecoverable).  
  - **Competitor:** Same rival that outbid us last year (likely deeper pockets/higher pain threshold).  
  - **Founders’ Incentive:** They profit regardless of winner, accelerating bid inflation.  

  This mirrors a **dollar auction** (where bidders escalate beyond rational limits to "avoid losing" prior investments), but with added complexity:  
  - A known, motivated competitor with asymmetric resources.  
  - A target incentivized to prolong bidding.  

  ---

  ### **2. Why "We’re Already This Deep" Is Dangerous (and Misapplied Here)**  
  The sunk cost fallacy argues that past losses shouldn’t influence future decisions. **However, this undersells the psychological trap in competitive bidding.**  

  - **The Real Issue:** Our sunk costs create emotional momentum to "justify" prior losses. But the $250K is gone whether we win, lose, or walk today. *Winning the bid does not recover it.*  
  - **Competitor Dynamics:** Our rival knows we’re emotionally/financially invested. They may bid *because* they expect us to overpay, not because the target is worth more to them.  
  - **Founders’ Role:** They benefit from our sunk costs—by dragging out the process, they inflate the final price. Our $250K loss is their leverage.  

  **Consequence:** Continuing bids to "salvage" sunk costs invites exploitation by both the rival and target.  

  ---

  ### **3. Recommendation: Withdraw Immediately**  
  #### **Why?**  
  - **Valuation Discipline:** We exceeded our max valuation for sound reasons (integration risk, market shifts, ROI thresholds). Winning at 140% guarantees a bad deal.  
  - **Competitor Asymmetry:** If the rival has consistently outbid us, they likely value this team 50–100%+ higher. We cannot win without catastrophic overpayment.  
  - **Opportunity Cost:** Capital spent here could fund alternative talent acquisitions (e.g., hiring 5–10 senior engineers directly).  
  - **Precedent:** Escalating teaches rivals we’ll overpay, painting a target on future bids.  

  #### **Stopping Rule for Future Bids:**  
  > **"Cease bidding at 25% above internal valuation. Exceptions require full committee consensus + proven strategic leverage (e.g., IP blocking a competitor)."**  

  ---

  ### **4. Addressing Objections**  
  #### **Q: "But we lose the $250K if we walk!"**  
  - **A:** We lose the $250K regardless. Raising bids *adds* new losses: legal fees for new offers, and worse—an overpriced acquisition. Sunk costs are drowned money; bidding more is throwing good money after bad.  

  #### **Q: "What if the rival walks after we bid again?"**  
  - **A:** Unlikely. They outbid us last year and remain active. If they *do* walk, we still overpay by 40%+ for an asset we valued lower. That’s a Pyrrhic victory.  

  #### **Q: "Aren’t we letting the rival win twice?"**  
  - **A:** Yes—but winning a bad deal is worse. We’ll track this team post-acquisition. If the rival fails to retain them (common in acquisitions), we hire them individually at lower cost.  

  ---

  ### **5. Strategic Alternatives**  
  - **Short-Term:** Withdraw and contact the target’s key engineers. Signal interest in hiring them if the acquisition sours.  
  - **Long-Term:** Allocate the saved capital to:  
    - **Build:** Internal team expansion.  
    - **Alternative Targets:** Startups without auction dynamics.  
    - **Countermeasures:** Poison pills (e.g., retention bonuses for *our* team if rivals poach).  

  ---

  ### **6. Conclusion**  
  **Withdraw today.** The sunk $250K is a painful lesson, not leverage. Winning this bid would cost us $1.4X + new fees + integration risk—far exceeding sunk losses. Our rival’s presence and the founders’ incentives make escalation predictable and exploitative. Implement the 25% stopping rule immediately for future deals.  

  **Action:** Vote to withdraw by EOD. I recommend we:  
  ✅ **Formally exit the bid.**  
  ✅ **Alert the target we’re withdrawing but open to talent discussions post-acquisition.**  
  ✅ **Allocate $100K to proactively recruit the target’s team if the rival stumbles.**  

  This isn’t surrender—it’s strategic discipline. Last year’s loss saved us from overpaying; this year’s walk saves us from a worse mistake.  

  // Signed //  
  CTO
