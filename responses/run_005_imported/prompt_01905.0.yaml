  Aquinas held that political authority exists only for the sake of the common good, so that a ruler who governs solely for his own advantage forfeits that authority and becomes, in effect, a private aggressor whom any citizen may justly kill in self-defense. On this view, what would Aquinas's natural law theory say about a private citizen today who assassinates a dictator without any sanction from a court, legislature, or foreign government?
