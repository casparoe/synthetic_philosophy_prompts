  The user needs to know the differences, especially regarding the predictor. Newcomb's relies on a predictor with near-perfect accuracy, making evidential decision theory (EDT) prefer one-boxing. The toxin puzzle doesn't need a predictor; the benefactor only checks the intention at a specific time. Here, EDT might suggest forming the intention to get the money, but causal decision theory (CDT) says you won't drink the toxin since the intention's already formed. 

