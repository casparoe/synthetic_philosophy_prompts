  The user's deeper need might be to impress their advisor with their new understanding but also show respect for her expertise. They might want to engage in a meaningful discussion rather than declare her work obsolete. The advisor's possible counterarguments: Harsanyi assumes vNM axioms for the social planner, which prioritarians might reject. Also, Pareto indifference might not account for fairness or equity concerns that prioritarians emphasize.

