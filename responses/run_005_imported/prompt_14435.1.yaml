prompt: |-
  I've read enough rationalist-blogosphere discussion of Pascal's Mugging to know the standard fix: give the agent a bounded utility function, and no vanishingly improbable, astronomically large payoff can ever swamp its decisions. What usually gets glossed over is why boundedness specifically is doing the work, rather than the more modest patch Bernoulli himself proposed for the original St. Petersburg game -- just making utility a concave function of the payoff, such as log utility. Please argue for the claim that no utility function that is unbounded above, however slowly it grows, can be safe from every St. Petersburg-style gamble: for any such function one can design an escalated ('super') version of the game -- same halving probabilities, faster-growing prizes -- whose expected utility is still infinite, so that only genuine boundedness above is safe across the board. I'd like the argument to actually sketch, for an arbitrary unbounded utility function, how those escalated prizes would be chosen, rather than simply asserting that they exist.
reasoning: |-
  We are given an arbitrary unbounded utility function U, which we assume is defined on the nonnegative reals (representing payoffs) and takes real values. We assume U is increasing (so that more money is better) and unbounded above: for any real number M, there is a payoff x such that U(x) > M.

  We wish to construct a St. Petersburg-style gamble that has infinite expected utility. The classic St. Petersburg game has payoffs that double: starting at $2, then $4, $8, etc., with probabilities 1/2, 1/4, 1/8, etc. In that game, if utility is linear, the expected utility is infinite. But we are considering an arbitrary unbounded utility function. The idea is to design a new gamble with the same probability structure (i.e., probability of outcome n is 1/2^n for n=1,2,3,...) but with payoffs that grow fast enough so that even under U, the expected utility is infinite.

  Specifically, we will choose a sequence of payoffs {x_n} for n=1,2,3,... such that:
     x_n is the payoff in outcome n (which occurs with probability 1/2^n)
  and we require that:
     sum_{n=1}^{∞} [ U(x_n) * (1/2)^n ] = ∞.

  How do we choose the x_n? We will choose them recursively so that U(x_n) is large enough to make each term in the series at least as big as 1 (or some positive constant) but note that we can do even better: we can make the terms grow so that the series diverges. However, to ensure the series diverges, we can require that each term is at least 1 (so the sum is at least the harmonic series which diverges). But note: we have the freedom to choose x_n arbitrarily large because U is unbounded above.

  Let's construct the sequence {x_n}:

  Start with n=1:
     We want: U(x_1) * (1/2) >= 1   =>   U(x_1) >= 2.
     Since U is unbounded above, we can choose x_1 such that U(x_1) >= 2.

  For n=2:
     We want: U(x_2) * (1/4) >= 1   =>   U(x_2) >= 4.
     Choose x_2 (with x_2 > x_1, but that's not strictly necessary, though we can if we wish) such that U(x_2) >= 4.

  In general, for the n-th term, we require:
     U(x_n) * (1/2)^n >= 1   =>   U(x_n) >= 2^n.

  Because U is unbounded above, we can choose x_n (for each n) so that U(x_n) >= 2^n. Specifically, since U is unbounded, there exists some x such that U(x) >= 2^n. We choose such an x and set x_n = x. We can even choose x_n to be the smallest such x to keep the payoffs as low as possible, but that's not necessary.

  Now, consider the expected utility of the gamble:
     EU = sum_{n=1}^{∞} [ U(x_n) * (1/2)^n ] 
          >= sum_{n=1}^{∞} [ 2^n * (1/2)^n ] 
          = sum_{n=1}^{∞} 1 
          = ∞.

  Therefore, the expected utility is infinite.

  But note: we must also ensure that the payoffs are nonnegative and increasing? Actually, the problem doesn't require the payoffs to be increasing, but we can choose them so that they are. However, even if we don't, the expected utility is still infinite.

  However, there is a catch: we must be able to choose the x_n without bound. That is, since U is unbounded, we can indeed choose x_n such that U(x_n) >= 2^n for each n. Therefore, for any unbounded utility function, we can construct such a gamble.

  This shows that if the utility function is unbounded above, then there exists a gamble (with probabilities halving each time) that yields infinite expected utility. Therefore, the agent would be willing to pay any finite amount to play this game, which is problematic (like Pascal's Mugging).

  Hence, the only way to avoid this problem across the board is to have a bounded utility function.

  Note: The argument does not require that U is concave. Even if U is concave (like log), as long as it is unbounded, we can still construct such a gamble. For example, with log utility (base e), U(x) = ln(x). Then we require:
     ln(x_n) >= 2^n   =>   x_n >= e^{2^n}.
  Then the payoff in the n-th outcome is at least e^{2^n}, which is extremely large. The expected utility would be at least the sum of 1, which diverges.

  This is why the standard fix is to bound the utility function: so that there is some maximum utility that cannot be exceeded, and then no matter how large the payoff, the utility cannot exceed that bound. Then the expected utility of any gamble would be finite.

