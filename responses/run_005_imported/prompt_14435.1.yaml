answer: |-
  To address why boundedness is essential for a utility function to avoid infinite expected utility in all St. Petersburg-style gambles, we must demonstrate that for any unbounded utility function \(U\) (which is increasing and defined for all positive payoffs), we can construct a gamble with halving probabilities but escalating payoffs that forces expected utility to diverge to infinity. Here's a step-by-step argument:

  ### 1. **Setup of the Super St. Petersburg Game**
  - **Probabilities**: Retain the classic halving structure: outcome \(n\) occurs with probability \(p_n = \frac{1}{2^n}\) for \(n = 1, 2, 3, \ldots\)  
    (Thus, \(\sum_{n=1}^\infty p_n = 1\).)
  - **Payoffs**: Design payoffs \(x_n > 0\) for each outcome \(n\), chosen such that \(U(x_n)\) grows sufficiently fast to ensure \(\sum_{n=1}^\infty p_n U(x_n) = \infty\).

  ### 2. **Key Insight: Exploiting Unboundedness**
  Since \(U\) is unbounded above, for any real number \(M\), there exists a payoff \(x\) such that \(U(x) > M\). We leverage this to select \(x_n\) recursively, ensuring each \(U(x_n)\) is large enough to dominate the decaying probability \(p_n\).

  ### 3. **Constructing the Payoffs \(x_n\)**
  Define a sequence of payoffs \(\{x_n\}\) where each \(x_n\) is chosen to satisfy:  
  \[
  U(x_n) \geq \frac{2^n}{p_n} = 2^n \cdot 2^n = 4^n.
  \]  
  This is possible because \(U\) is unbounded above:  
  - For \(n=1\), since \(U\) is unbounded, pick \(x_1\) such that \(U(x_1) \geq 4^1 = 4\).  
  - For \(n=2\), pick \(x_2 > x_1\) (to ensure increasing payoffs, though not strictly necessary) such that \(U(x_2) \geq 4^2 = 16\).  
  - In general, for each \(n\), choose \(x_n\) such that \(U(x_n) \geq 4^n\).  
    (Such \(x_n\) exists because \(\lim_{x \to \infty} U(x) = \infty\).)

  ### 4. **Expected Utility Diverges**
  Compute the expected utility:  
  \[
  \mathbb{E}[U] = \sum_{n=1}^\infty p_n U(x_n) = \sum_{n=1}^\infty \frac{1}{2^n} U(x_n).
  \]  
  By construction, \(U(x_n) \geq 4^n\), so:  
  \[
  \mathbb{E}[U] \geq \sum_{n=1}^\infty \frac{1}{2^n} \cdot 4^n = \sum_{n=1}^\infty \left(\frac{4}{2}\right)^n = \sum_{n=1}^\infty 2^n.
  \]  
  The series \(\sum_{n=1}^\infty 2^n\) diverges (as \(2^n \to \infty\)), so \(\mathbb{E}[U] = \infty\).

  ### 5. **Why Concavity (e.g., Log Utility) Fails**
  Suppose \(U(x) = \log_b(x)\) (concave and unbounded). The classic St. Petersburg game (payoffs \(x_n = 2^n\)) yields finite expected utility:  
  \[
  \mathbb{E}[U] = \sum_{n=1}^\infty \frac{1}{2^n} \log_b(2^n) = \log_b(2) \sum_{n=1}^\infty n \left(\frac{1}{2}\right)^n < \infty.
  \]  
  **However**, our super-game escalates payoffs: \(x_n = b^{4^n}\) (since \(U(x_n) = \log_b(b^{4^n}) = 4^n\)). Then:  
  \[
  \mathbb{E}[U] \geq \sum_{n=1}^\infty \frac{1}{2^n} \cdot 4^n = \sum_{n=1}^\infty 2^n = \infty.
  \]  
  Thus, even slowly growing unbounded utilities (e.g., \(\log\), \(\sqrt{x}\)) are vulnerable to a suitably accelerated gamble.

  ### 6. **Boundedness as the Only Fix**
  If \(U\) is bounded above by \(B\), then for any gamble:  
  \[
  \mathbb{E}[U] \leq \sum_{n=1}^\infty p_n B = B \cdot \sum_{n=1}^\infty \frac{1}{2^n} = B < \infty.
  \]  
  Only boundedness guarantees finite expected utility against *all* probability-payoff combinations.

  ### Conclusion
  No unbounded utility function is immune to a super St. Petersburg gamble. By exploiting unboundedness to construct payoffs growing as \(x_n = U^{-1}(4^n)\) (or faster), we force expected utility to diverge. Concave functions (e.g., log utility) only avoid divergence in the *original* game, not in all possible escalations. **True safety requires boundedness above.**
