answer: |-
  Your friend's argument hinges on maximizing expected value (EV) per bet, which is indeed positive: each dollar staked has an expected profit of 10 cents (EV = 0.55 × 1 + 0.45 × (-1) = 0.10). However, **betting the entire bankroll every time is irrational even for risk-neutral individuals** (those indifferent to risk) because it guarantees eventual ruin with probability 1. Here's why, and what fraction to bet instead.

  ### Why Betting Everything Fails
  - **Inevitable Ruin**: With a 45% chance of losing each bet, the probability of surviving \(n\) bets without ruin is \(0.55^n\). As \(n\) grows, this probability approaches 0. Even with a positive EV, you will lose your entire bankroll almost surely over time. This violates the goal of long-term profitability.
  - **Expected Value Misleading**: While the expected bankroll *appears* to grow exponentially (after \(n\) bets, \(E[\text{Bankroll}] = \text{Initial} \times 1.1^n\)), this is driven by astronomically unlikely scenarios where you win every bet. In almost all realistic paths (99.99...% of them), the bankroll hits $0$. Rationality requires considering the entire distribution of outcomes, not just the average.

  ### The Rational Alternative: Kelly Criterion
  The Kelly criterion maximizes the long-term growth rate of your bankroll. It is optimal for risk-neutral bettors because:
  - It avoids ruin.
  - It maximizes the exponential growth rate of wealth.
  - It outperforms any other strategy in the long run (almost surely).

  For a bet with win probability \(p = 0.55\), loss probability \(q = 0.45\), and even-money payout (winning doubles your stake), the Kelly fraction \(f^*\) of your bankroll to bet is:
  \[
  f^* = p - q = 0.55 - 0.45 = 0.10 \quad (10\%).
  \]

  #### Why 10%?
  - **Growth Rate Optimization**: The Kelly fraction maximizes the expected logarithm of wealth per bet. After a win, your bankroll grows by \(1 + f\) (e.g., staking 10% → bankroll × 1.10). After a loss, it shrinks by \(1 - f\) (e.g., bankroll × 0.90). The expected growth rate \(G\) is:
    \[
    G(f) = p \ln(1 + f) + q \ln(1 - f).
    \]
    Substituting \(p = 0.55\), \(q = 0.45\):
    \[
    G(f) = 0.55 \ln(1 + f) + 0.45 \ln(1 - f).
    \]
    Maximizing \(G(f)\) (by solving \(dG/df = 0\)) yields \(f^* = p - q = 0.10\).
  - **Results of Betting 10%**:
    - **No Ruin**: Since you bet a fraction (not all) of your bankroll, you can never go bankrupt.
    - **Long-Term Growth**: The bankroll grows exponentially at rate \(G(0.10) \approx 0.005\) per bet. For example:
      - After 100 bets, initial bankroll × \(e^{0.5} \approx 1.65\).
      - After 500 bets, initial bankroll × \(e^{2.5} \approx 12.2\).
    - **Expected Value Comparison**: Though EV per bet is lower than betting everything, the probability of long-term success is 100%, making it superior in practice.

  ### Key Implications
  1. **Risk-Neutral Justification**: Betting 10% isn't about risk aversion; it's about avoiding almost-sure ruin and maximizing long-term growth. Risk-neutral players still care about survival.
  2. **Fraction vs. Fixed Amounts**: Always stake a *fraction* of your current bankroll (not a fixed dollar amount). This adjusts for wins/losses and compounds growth.
  3. **Edge Dependency**: The 10% comes directly from your edge (\(p - q\)). If your win probability were 53%, you'd bet 6% (since \(0.53 - 0.47 = 0.06\)).

  ### Practical Recommendation
  - **Stake exactly 10% of your current bankroll on each bet**.
  - **Never withdraw winnings or add external funds**. Let the bankroll compound.
  - **Verify model stability**: If your edge shrinks (e.g., due to market changes), recalculate \(f^*\).

  By betting 10%, you exploit your edge while ensuring you survive to benefit from it. Betting everything sacrifices almost all future EV for a fleeting, illusory gain.
