answer: |-
  Here’s a toast that threads the needle: playful for the philosophers, warm for everyone, and cheeky enough to honor your endurantist soul while tipping your hat to the groom’s spacetime worm:

  **(Clink glass gently, warm smile)**  

  "Hi everyone. For those who don’t know me, I’m [Your Name], [Bride]’s best friend and very honored maid of honor. And for those who *do* know [Groom], well… you know he thinks about time and identity in ways that make the rest of us need a strong drink. *(Light chuckle, glance at groom/philosophers)*  

  Now, [Groom] wrote a whole book—a *very* big book—arguing that we aren’t just… *us*, standing here wholly in this moment. Oh no. On his view, each of us is more like a magnificent, sprawling, four-dimensional… *worm*. Stretching from our first cry to our last sigh. Made up of countless slices, or parts: Baby-[Groom], Teen-[Groom], Right-Now-[Groom], and hopefully someday, Slightly-Crusty-But-Still-Lovable-[Groom]-At-90.  

  *(Turn to Bride and Groom, playful tone)*  

  So, [Bride], when you fell head-over-heels for *this* particular slice of [Groom]-worm – *(gesture to Groom)* – the slice that laughs at your terrible puns, remembers your coffee order, and somehow convinced you *this* haircut was a good idea… *(wink)* … you weren’t *just* saying 'yes' to him.  

  According to the groom’s own impeccable logic… you were saying ‘yes’ to the *whole magnificent worm*. You were committing to *every* temporal slice. The slice that snores. The slice that will inevitably lose the TV remote *inside* the couch cushions. The slice that might, decades from now, try to explain perdurantism *again* to very patient grandchildren.  

  *(Pause, shift to sincere warmth)*  

  And that’s the beautiful, slightly mind-bending thing about their love, isn’t it? Because even if, technically speaking, the ‘me’ you fall for today isn’t *strictly identical* to the ‘me’ you share your dentures with tomorrow… what [Bride] and [Groom] are doing today is declaring that their love *binds those parts together*. It’s the golden thread running through every moment, every chapter, every single slice of their shared spacetime worm.  

  Which brings me to ‘till death do us part.’ Now, to an endurantist like me *(point playfully to self)*, that sounds like a clean break! But to our dear perdurantist groom… *(turn to Groom, feigning seriousness)* …death is just the *final temporal part* of the worm! So really, ‘till death do us part’ becomes… ‘till the very last slice!’ It’s not an ending, it’s a commitment to see *every single part* through – the joy, the challenges, the weird phases, the quiet moments – right up to the very edge of the story.  

  *(Raise glass higher, full warmth and focus on the couple)*  

  So, [Bride] and [Groom], here’s to you. To the incredible, complex, beautiful worms you are individually, and to the spectacular, intertwined, four-dimensional worm you become together today. Here’s to loving *every single slice* – the radiant bride *right now*, the dashing groom *right now*, and every single ‘now’ that’s still to come, all the way to that final, peaceful, well-loved part. May your love be the constant that makes every moment, every chapter, and yes, every *temporal part*, feel utterly and completely… whole.  

  To the Bride and Groom! To the Whole Worm! Cheers!"

  **Why this works:**

  1.  **Wins the Philosophers:** Uses "temporal parts," "strictly identical," "four-dimensional worm," "final temporal part," and contrasts endurantism/perdurantism correctly. They'll appreciate the accurate playfulness.
  2.  **Accessible to All:** Explains the core idea simply ("slices," "chapters," "magnificent worm") using relatable examples (snores, lost remote, dentures, grandkids). The *emotional* message of lifelong commitment is crystal clear.
  3.  **Cheeky but Warm:** The "haircut," "snores," "dentures," and "explaining perdurantism to grandkids" bits are gentle teases. Framing the vow as "till the very last slice!" is playful metaphysics but lands as a *deeper* commitment. The "golden thread" and "feeling utterly whole" bring it back to profound love.
  4.  **Honors Both:** Celebrates their specific love story (Bride falling for *this* slice) while respecting Groom's intellectual passion. Your endurantism is a lighthearted aside, not a challenge.
  5.  **"Don't Let the Philosophers Win":** The toast is *about* love and commitment, using the worm as a *metaphor* and a source of humor. The philosophy serves the romance, not the other way around. Ending on "whole" is a lovely nod to your own view without undermining his.

  **Delivery Tip:** Practice the slightly more technical lines so they flow naturally. Smile warmly, especially during the teases and the sincere parts. Your affection for both of them should shine through the cleverness. Good luck!
