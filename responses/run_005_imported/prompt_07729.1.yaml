  ## Dialogue: The Weight of Stones

  **Setting:** A university common room after hours. Empty coffee cups litter the table. **ALEX** (early 30s, earnest, gesturing emphatically) and **BLAKE** (mid-40s, calm, leaning back thoughtfully) are deep in conversation.

  **Alex:** ...and *that’s* why Senator Vance’s latest tirade against Senator Croft’s affair lands so badly. It’s not that Croft didn’t do wrong. Infidelity *is* a serious betrayal. But Vance? His *own* three-year affair with that lobbyist was front-page news barely a year ago! He’s lost the *standing* to blame Croft for it.

  **Blake:** Ah, the ‘standing’ argument. Classic move. But Alex, I worry you’re confusing several things. Croft did wrong. Vance points it out. Why isn’t that the end of the story? Vance might be a hypocrite, but that doesn’t magically make Croft’s action *less* wrong, or mean Vance’s *statement* about its wrongness is false.

  **Alex:** It’s not about the *truth* of the judgment, Blake! It’s about Vance’s *authority* or *position* to deliver that particular criticism *to Croft*. Think of T.A. Cohen’s point: “He that is without sin among you, let him first cast a stone.” It’s not a claim that the adulteress *didn’t* sin. It’s saying that *you*, guilty of the same or similar, forfeit the normative standing to be the one *casting* the stone of condemnation. You’ve quietly exempted yourself from the standard you’re wielding against another. That exemption is a distinct moral failure – a failure of *integrity* or *fairness in enforcement* – that undermines your role as a blamer *in this specific instance*.

  **Blake:** But what *is* this ‘standing’? It sounds mystical. Isn’t it just that we doubt Vance’s *sincerity*? Maybe he doesn’t *really* believe affairs are wrong; he’s just weaponizing morality for political gain. Or, perhaps it’s about *tone* – his condemnation rings hollow and offensively self-righteous given his history. Both are objections *to Vance*, sure, but neither bears on the core issue: *Croft did wrong*. Vance pointing it out, even hypocritically, doesn’t change that fact. And Croft shouldn’t get a free pass just because his critic is flawed.

  **Alex:** It’s more than sincerity or tone, though those might be symptoms. The core failure is *the hypocrite’s exemption*. Vance implicitly claims the authority to hold Croft accountable to a standard – marital fidelity – while having *himself* blatantly violated that standard and likely never faced equivalent accountability. He’s acting *as if* he occupies the moral high ground necessary to dispense blame, but his own actions show he doesn’t. He’s trying to enforce a rule from which he’s secretly excused himself. That corrupts the very act of blaming. It turns it from a communal upholding of norms into a selective weapon.

  **Blake:** Okay, let’s grant that *feels* icky. But follow your logic down the rabbit hole. If hypocrisy *forfeits standing*, then the worse your own track record on a particular vice, the *less* able you are to criticize others for it. Right?

  **Alex:** In a specific sense, yes. Your *credibility as an enforcer* of *that particular norm* is compromised.

  **Blake:** Precisely! So, the world’s most notorious philanderer couldn’t criticize *anyone* for infidelity? The recovering addict who stole to feed their habit decades ago loses standing to condemn a shoplifter? Worse still, since *everyone* is guilty of *some* hypocrisy somewhere – maybe I lose my temper while condemning anger, or indulge luxuries while criticizing consumerism – does *anyone* ever have standing to blame *anyone* for *anything*? Your theory seems to bootstrap us into moral silence! If standing is this fragile and easily forfeited, the whole practice of moral criticism collapses under the weight of universal human frailty. Surely that’s absurd. We *need* to be able to call out wrongs, even imperfectly.

  **Alex:** **(Leans forward, tapping the table)** No, it doesn’t lead to silence, and it’s not universal forfeiture. Three crucial points. First, forfeiture is *specific* to the *relevantly similar* wrong. Vance forfeits standing to blame for infidelity *because* of his own unaddressed infidelity. He *doesn’t* necessarily forfeit standing to blame, say, Croft for embezzlement if Vance has a clean record there. Second, standing isn’t necessarily *permanently* lost. Genuine repentance, accountability, restitution – these can potentially *restore* standing. Vance acknowledging his affair, showing remorse, maybe even stepping down? That changes things. Third, and crucially, *other people* still have standing! The wronged spouses, colleagues who upheld fidelity, even citizens scandalized by both – *they* can still legitimately blame Croft. The problem isn't that Croft's wrong vanishes; it's that *Vance* is disqualified from being its official prosecutor *because of his own identical, unaddressed guilt*. The moral criticism doesn't disappear; it just shouldn't come *from him* on *this topic*. The practice continues, just not through compromised agents.

  **Blake:** **(Nods slowly)** Hmm. Okay, that addresses the bootstrapping worry somewhat. Standing is context-specific, recoverable, and others retain it. But Alex, why does the hypocrite’s blame feel *so* uniquely galling? Worse than just an insincere or self-righteous critic? Why this specific sense of “You have no *right* to say that!” if it’s not reducible to doubting their belief or disliking their tone?

  **Alex:** Because it’s an assault on fairness itself. It’s the jarring dissonance of someone demanding adherence to a rule they flout, positioning themselves as judge from a bench they’ve soiled. It feels like a *fraud* being perpetrated on the moral community. When Vance blames Croft, he implicitly asks us to see *him* as aligned with the norm and Croft as the violator. But his own actions reveal he’s *also* a violator, pretending otherwise. This covert self-exemption undermines the *impartiality* that moral norms ideally represent. It turns blame into a power play, not a shared commitment to value. That’s why it generates that specific, deep sense of *injustice* in being blamed *by that person* – it compounds the original wrong with the insult of unfair enforcement. It’s not just annoying; it feels *illegitimate*.

  **Blake:** **(Sighs, swirling cold coffee)** Illegitimate... I see the pull. That feeling *is* powerful. And your point about the hypocrite implicitly claiming an impartiality they’ve violated by self-exemption... that’s sharper than just insincerity. It captures why it feels like a distinct *kind* of wrong *in the act of blaming itself*. Maybe... maybe it *is* a distinct normative failure. Not one that negates the underlying wrong, but one that poisons the well of *who* can credibly call it out. I still worry about practical adjudication – how similar must the wrongs be? How recent? What counts as "addressed"? But... **(smiles faintly)** you’ve given me more to chew on than I expected. This stone might be heavier than I thought.

  **Alex:** **(Returns the smile)** That’s the point of the seminar, right? To make the stones visible, even if we don't always agree on who should throw them. More coffee? I think we need it.

