  Character B thinks this is basically confused -- that "losing standing" just reduces to doubting the hypocrite's sincerity as a judge, or objecting to their tone, or a rhetorical deflection that shouldn't get any uptake, since none of that bears on whether the rival actually did wrong. B should also press the bootstrapping worry hard: if hypocrisy really strips standing, don't we get the perverse result that the worse and more numerous your own sins, the more people become immune to your criticism -- and since pretty much everyone's a hypocrite about something, doesn't the whole practice of moral criticism collapse?

  I want real back-and-forth, not two people talking past each other or a strawman for B -- A needs an actual answer to the bootstrapping worry, not just a restatement of the view, and B has to grapple with why hypocritical blame feels so specifically bad and not just garden-variety annoying.
