answer: |-
  ## Bell Debate: Roots in the Weeds

  **Characters:**  
  *   **Brenna (Bohmian):** Sharp, impatient, sees nonlocality as inescapable bedrock.  
  *   **Eliot (Everettian):** Calm, analytical, sees locality preserved via branching.  

  **(The setting is a worn sofa in a grad student lounge, empty coffee cups littering the table.)**

  **Brenna:** ...so the Aspect experiments slam the door. No local hidden variables. Nature *is* nonlocal. Bohm shows *how* – particles guided instantaneously by the wavefunction. Trying to dodge it with *many worlds* just relabels the spookiness.

  **Eliot:** Hold on. The *spookiness*, as you call it, arises entirely from assuming there’s a single, definite outcome on each wing *before* measurement correlation is established. Everett rejects that premise. There’s no definite ‘up’ or ‘down’ for Alice until decoherence branches the universal wavefunction. No definite outcome means no *thing* for a nonlocal influence to *act upon* instantaneously.

  **Brenna:** Fine, ditch the definite outcome. But the *correlation* remains. Alice measures spin-z and gets *some* branch. Instantly, Bob’s state is correlated – his branch structure is fixed relative to hers, regardless of distance. That *is* the nonlocality! Jarrett decomposed the Bell violation into **Parameter Independence** (PI: my setting choice doesn't affect your *probabilities*) and **Outcome Independence** (OI: my specific outcome doesn't affect your probabilities *given the settings*). Which one are you violating to save your precious locality?

  **Eliot:** Neither, fundamentally. Jarrett’s decomposition assumes a *single* outcome occurs. In Everett, *all* outcomes occur. The joint probability isn’t about a single outcome pair, it’s about the *weight* of the branch where Alice sees +z *and* Bob sees -z (for example). The correlation is baked into the initial entangled state – a **common cause** in their shared past light cone. Decoherence just reveals it locally on each wing.

  **Brenna:** Oh, come on! The ‘revelation’ is instantaneous and correlated across space-like separation! How is that ‘local’? Bob’s local environment doesn’t decohere independently; its decoherence basis *depends* on what happened light-years away with Alice. That sounds like Outcome Independence violation to me – Alice’s *specific outcome branch* instantly fixes the relevant basis for Bob’s local decoherence.

  **Eliot:** Not instantly *fixes*, Brenna. The entanglement defines a *global* decoherence event. Think **spacetime state realism**: the wavefunction assigns amplitudes to entire spacetime histories. The correlation between Alice’s result and Bob’s result is encoded in a *single, non-separable* chunk of spacetime – their shared past light cone interaction. There’s no *propagation* of influence *from* Alice’s measurement event *to* Bob’s. The correlation is a property of the four-dimensional block.

  **Brenna:** But *within* that block, the event ‘Alice measures z+’ and the event ‘Bob measures z-’ are space-like separated! To get the perfect correlations QM predicts, the branching *has* to be coordinated across that gap. Your ‘global decoherence event’ *is* the nonlocality! It’s just hidden in the definition of the branching. You’ve traded Bohm’s explicit pilot-wave nonlocality for a mysterious, instantaneous, space-like *branch synchronization*.

  **Eliot:** It’s not synchronization *after* the fact; it’s the *unfolding* of a pre-existing correlation defined by the initial state. Crucially, **no signalling** holds *empirically* within any single branch. Observers *within* a branch only see local events and outcomes consistent with local probabilities. The ‘coordination’ is only apparent from the outside God’s-eye view of the whole wavefunction. From *inside* a universe, physics is local. The weirdness is in the global structure, not in dynamical influences between space-like separated events.

  **Brenna:** So you admit the weirdness! You just shunt it into the metaphysics of branching. But that branching *is* the dynamical process creating the definite experiences! And for that process to match QM, it *must* correlate space-like events. Jarrett’s OI is violated *in the branching dynamics*: the specific branch that becomes real for Alice *immediately determines* which branch becomes real for Bob, faster than light. You deny definite outcomes exist *before* measurement, but the *correlation* of their *emergence* is nonlocal.

  **Eliot:** I see the point of tension. But ‘determines’ is the wrong word. There’s no *causal determination* between the space-like separated decoherence events. They are two aspects of a *single* global transition in the quantum state. The correlation is fundamental, not mediated. It’s like asking which part of a pair of gloves ‘determines’ the handedness of the other – the property is relational, defined at creation. The locality I defend is the absence of *controllable, dynamical influence* propagating between space-like separated regions. Branching reveals the pre-existing relational properties locally.

  **Brenna:** *Sighs.* So we agree the perfect correlations happen. You say it’s a static, pre-determined correlation revealed locally. I say that ‘revelation’ process itself requires nonlocal coordination to match experiment. The glove analogy only works if the gloves were separated *after* being made a pair. If they’re made light-years apart, how do they *know* to match? You need that common cause, sure, but the *manifestation* of the correlation when measured seems… spooky. Just spooky in the branching, not in the particles.

  **Eliot:** Perhaps. But I’ll take ‘spooky branching’ confined to the global wavefunction description over ‘spooky action’ between localized particles any day. At least my spookiness doesn’t violate relativistic covariance at the level of observable events *within* a history.

  **Brenna:** *Smirks.* Touché. But don’t think you’ve dodged the bullet. You’ve just painted it a different color. Let's get more coffee. This requires caffeine.
