prompt: |-
  I'm TAing our department's graduate proseminar on modality this term, and during office hours last week a student hit me with pretty much verbatim Kripke's "Humphrey" complaint against counterpart theory — that footnote in Naming and Necessity everyone ends up quoting — and I honestly fumbled the reply. You know the gist: when we say Humphrey could have won the election, we obviously mean something about Humphrey's own unrealized chances, not about some other guy in another world who merely resembles him, someone Humphrey could care less about — so Lewis's counterpart-theoretic paraphrase looks like it's just changing the subject. I mumbled something vague about counterpart relations being interest-relative and moved on, but it's been bugging me since, especially because my advisor (a pretty committed Lewisian) insists the objection is just question-begging, and I'd like to actually have that argument built out properly before it comes up again.

  So here's what I want: argue, as rigorously as you can, that the Humphrey objection fails because it presupposes exactly the kind of literal transworld-identity semantics that counterpart theory denies from the outset, rather than establishing anything against counterpart theory on independent grounds. The hard part, I think, is explaining why this "you're just begging the question against me" rejoinder actually has teeth here and isn't a move available to literally any theory against literally any counterexample, which would make it worthless as a defense. If it helps sharpen things, feel free to bring in the way Lewis handles cases like the statue and the lump of clay via multiple, sortal-relative counterpart relations, or the problem of accidental intrinsics, to show the underlying picture is principled rather than ad hoc patchwork. Mainly I want a version of this arguement that could survive being said out loud to a room of annoyingly sharp second-years.
