  I should start by attacking the Boltzmann brain probability. The key point is that ordered regions like our universe could be more probable than isolated brains. The math for a brain-sized fluctuation versus a universe-sized one matters. Larger fluctuations might have lower entropy per particle, making them more likely. Also, the observer selection effect: even if Boltzmann brains are numerous, they're short-lived, so we're more likely to be in long-lived structures.

