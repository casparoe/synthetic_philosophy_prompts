prompt: |-
  hey so for my seminar on Bentham/early utilitarianism we got assigned part of that unpublished essay of his on paederasty (written like 1785, arguing against criminalizing gay sex waaay before that was a normal position), and i'm stuck on the bit where he deals with the "antipathy" argument for punishing it anyway. he writes:

  "Meanwhile the antipathy, whatever it may arise from, produces in persons how many soever they be in whom it manifests itself, a particular kind of pain as often as the object by which the antipathy is excited presents itself to their thoughts. This pain, whenever it appears, is unquestionably to be placed to the account of the mischief of the offence, and this is one reason for the punishing of it. More than this—upon the view of any pain which these obnoxious persons are made to suffer, a pleasure results to those by whom the antipathy is entertained, and this pleasure affords an additional reason for the punishing of it. There remain however two reasons against punishing it. The antipathy in question ... is grounded only in prejudice. It may therefore be assuaged and reduced to such a measure as to be no longer painful only in bringing to view the considerations which shew it to be ill-grounded ... if the propensity to punish were admitted in this or any case as a sufficient ground for punishing, one should never know where to stop. Upon monarchical principles, the Sovereign would be in the right to punish any man he did not like; upon popular principles, every man, or at least the majority of each community, would be in the right to punish every man upon no better reason."

  what i don't get is why he even grants the first part. it sounds like hes admitting that other ppl's disgust at gay sex, and even the pleasure bigots get from seeing "deviants" suffer, count as genuine pains and pleasures in the felicific calculus, so by his own logic they really are reasons in favor of punishment, before he tries to walk it back with the "it's just prejudice, you can educate it away" move and the "you'd never know where to stop" move. isn't that a huge concession for a hedonist to make? and doesnt granting that antipathy-pain counts at all kind of clash with the stuff elsewhere (like in the Introduction to Principles of Morals and Legislation) where he says sympathy/antipathy is not a legitimate rival to the principle of utility? is there an actual principled reason this kind of pleasure/pain should be weighted differently or excluded, or is Bentham just fudging it here?
