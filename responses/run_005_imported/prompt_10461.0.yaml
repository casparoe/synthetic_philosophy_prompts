answer: |-
  ## The Hollow Core: Assessing Harsanyi's Decision-Theoretic Foundation for Utilitarianism

  Harsanyi's Aggregation Theorem presents an elegant and compelling formal argument: if individuals and society exhibit rational preferences under uncertainty (satisfying the von Neumann-Morgenstern axioms) and society respects a minimal Pareto indifference condition, then the social utility function *must* be a weighted sum of individual utilities. This appears to derive the core tenet of utilitarianism – maximizing the sum of utilities – from seemingly innocuous decision-theoretic principles. However, a closer examination reveals that the theorem, while mathematically impeccable, fails to provide a genuinely self-sufficient decision-theoretic foundation for utilitarianism as an ethical doctrine. The objections raised by Sen and Diamond expose critical gaps concerning interpersonal comparability and fairness that the theorem itself cannot bridge without importing substantive ethical assumptions.

  **The Chasm of Comparability: Sen's Objection**
  The theorem's fatal flaw lies in its treatment of utility scales. While vNM utility functions are cardinal, this cardinality reflects only an individual's *attitudes towards risk* within their own preference ordering. Crucially, the zero point and unit of each individual's utility function are arbitrary; any affine transformation (multiplying by a positive constant and adding a constant) represents the *same* underlying preferences over lotteries. Harsanyi's theorem aggregates these arbitrarily scaled functions. The resulting social welfare function `W = Σ a_i * U_i` (where `a_i` are weights) is equally dependent on these arbitrary choices.

  As Sen forcefully argued, this poses an insurmountable problem for interpreting the sum as a measure of social welfare suitable for interpersonal trade-offs. The theorem tells us *how* to aggregate given a specific cardinalization, but it provides *no decision-theoretic basis* for choosing *which* specific cardinalization to use for aggregation. Choosing the `a_i` weights and the specific scales for each `U_i` requires making judgments about how much one person's utility gain "counts" relative to another's loss – precisely the interpersonal comparisons of welfare levels and units that utilitarianism requires, but which the vNM framework does not provide. Harsanyi's own appeal to "extended preferences" (imagining oneself in the position of others with equal probability) is an attempt to ground comparability, but it constitutes a distinct, substantive *ethical* assumption about impartiality and universalizability, not a consequence of the decision-theoretic axioms alone. The theorem shows that *if* interpersonally comparable cardinal utilities exist, *then* social welfare is a weighted sum. It does not, and cannot, using only its premises, demonstrate that such comparable utilities exist or how to construct them. The gap between risk-based cardinality and interpersonally significant cardinality remains unclosed by the theorem.

  **The Mirage of Fairness: Diamond's Objection**
  Diamond's objection strikes at the heart of the theorem's ethical implications, highlighting how the Pareto indifference condition, combined with the additive form, erases important considerations of fairness and procedure. Consider the choice between:
  1.  **Procedure A:** Giving an indivisible good (e.g., a lifesaving drug) outright to Person A.
  2.  **Procedure B:** Giving the good outright to Person B.
  3.  **Procedure C:** A fair coin flip determining whether A or B gets the good.

  Assume Persons A and B derive identical, high utility from receiving the good and zero otherwise. The Pareto indifference condition implies that if society is indifferent between A and B (e.g., because `a_A * U_A(good) = a_B * U_B(good)`), then society *must* also be indifferent between A, B, and C, since all yield the same expected utility sum (`0.5 * U_A(good) + 0.5 * U_B(good) = U_A(good) = U_B(good)` under the assumption of equal weights and utilities).

  Intuitively, however, Procedure C (the coin flip) seems distinctly fairer than arbitrarily choosing A or B. It gives each person an equal *ex-ante chance*, embodying a principle of procedural fairness or ex-ante equality of opportunity that Procedures A and B lack. Harsanyi's theorem, demanding indifference between C and the arbitrary allocation whenever the sum is equal, renders this intuition formally irrelevant.

  **Diagnosing Diamond: Beyond Ex-Ante/Ex-Post**
  Diamond's challenge is often framed as a clash between *ex-ante* fairness (equality of expected utility before the lottery) and *ex-post* fairness (equality of outcome after the lottery). The theorem prioritizes the ex-ante perspective, finding C equivalent to A or B because ex-ante expected utilities are equal. Our intuition favoring C values something else: the *distribution of risk* or the *procedural guarantee* of an equal chance, regardless of the ex-ante expectation or the ex-post outcome.

  However, the root cause of this clash lies precisely in the theorem's treatment of *interpersonally comparable cardinal utility* and its exclusive focus on the sum. The theorem assumes that once individual vNM utilities are fixed (on scales reflecting only individual risk attitudes), and weights are chosen, the *only* relevant information for social choice is the expected value of the weighted sum. It dismisses the *pattern* of how utility is distributed across states of the world (e.g., the state where A wins the flip vs. the state where B wins) or the *process* generating that distribution. Our fairness intuition recognizes that the coin flip creates a correlation between individual outcomes that embodies equal respect in a way the arbitrary allocation does not, even if the abstract sum of expected utilities is identical. The theorem, by reducing social welfare to the expectation of a linear sum, makes this correlation invisible and irrelevant. Thus, Diamond's objection is not merely about timing (ex-ante vs. ex-post) but about the *sufficiency* of the additive, expectation-based social welfare function to capture ethically relevant properties like the fairness of procedures or the ex-post distribution of chances. It highlights that the theorem's aggregation mechanism, predicated on interpersonal comparability, actively suppresses dimensions of fairness that many find normatively essential.

  **Verdict: A Formally Valid but Ethically Incomplete Skeleton**

  Harsanyi's Aggregation Theorem is a remarkable formal result demonstrating that a minimal Pareto condition, combined with vNM rationality for individuals and society, *implies* an affine aggregation of individual utility functions. **However, it fails to provide a genuine, self-contained decision-theoretic foundation for utilitarianism as an ethical theory.** The theorem is ethically inert without crucial, independent assumptions it cannot supply:

  1.  **The Comparability Assumption:** The theorem requires, but does not derive, the existence of interpersonally comparable cardinal utility functions. The vNM axioms provide cardinality reflecting risk attitudes, not interpersonal significance. Choosing specific scales and weights (`a_i`) to make the sum meaningful for interpersonal trade-offs requires distinct ethical justification (e.g., Harsanyi's veil of ignorance), moving beyond pure decision theory into normative ethics. Sen's objection stands: the theorem solves the aggregation problem *given* comparability, but provides no decision-theoretic basis *for* comparability.
  2.  **The Sufficiency Assumption:** The theorem assumes that the expectation of a weighted sum of individual utilities is the *sole* determinant of social welfare. Diamond's objection powerfully demonstrates that this excludes ethically salient considerations like procedural fairness and the ex-post distribution of chances. The theorem's structure renders these concerns formally invisible, showing that its conception of social welfare, even if comparability were granted, is too narrow to capture widely held ethical intuitions about fairness.

  Therefore, Harsanyi's theorem succeeds brilliantly as a formal demonstration of the *structure* social preferences must take *if* they satisfy vNM rationality and Pareto indifference. It does *not* succeed in deriving utilitarianism as a compelling ethical doctrine solely from decision-theoretic premises. It provides a powerful framework, but one that remains hollow without importing substantive, contestable ethical assumptions about the interpersonal comparability of welfare and the exclusive ethical relevance of the sum of expectations. The theorem illuminates a possible path to utilitarianism, but it does not lay the entire foundation. The ethical heavy lifting – justifying comparability and defending the sufficiency of the sum against fairness objections – occurs outside its elegant but limited formal confines.
