prompt: |-
  I chair my university's Academic Integrity Board, which can impose sanctions ranging from a warning to expulsion but currently applies one evidentiary standard, 'clear and convincing evidence,' to every case. A subcommittee proposes a sliding scale instead -- easier to prove for a warning, harder for expulsion -- and members disagree about why this would be justified. Some argue that the same evidence can amount to knowledge that a student cheated when only a warning is at stake but not when expulsion is -- echoing pragmatic encroachment; others reply that the facts never change, only the contextually salient standard for 'proven' does -- closer to epistemic contextualism; a third group worries that either way, letting the sanction fix what counts as proven makes guilt depend on our choice of punishment. Please draft the short decision memo I'll bring to the Board: recommend a specific evidentiary policy, say which (if either) of these framings it commits us to, and engage seriously with the strongest objection to your recommendation.
reasoning: |-
  Okay, the user chairs a university's Academic Integrity Board and is dealing with a proposal to change their evidentiary standards. Currently, they use a single "clear and convincing evidence" standard for all cases, regardless of sanction severity. A subcommittee suggests implementing a sliding scale where lower sanctions require less stringent evidence while higher sanctions like expulsion demand more proof. 

  There are three philosophical camps in the board's debate: one group argues that the same evidence can constitute knowledge under lower stakes but not higher stakes (pragmatic encroachment); another group maintains the facts don't change but contextual standards do (epistemic contextualism); and a third worries that linking proof standards to sanctions essentially makes guilt dependent on punishment choice - a due process concern.

  The user needs a decision memo recommending a specific policy, aligning it with one philosophical framework, and addressing the strongest objection. This is a delicate balance between practical governance and philosophical coherence. 

  Hmm... the sliding scale makes practical sense because expulsion is life-altering and deserves higher certainty, but the third group's objection about circularity is powerful. How to preserve integrity while acknowledging stakes? The "burden-sensitive sliding scale" model seems best - it explicitly ties standard to consequence severity not guilt determination. 

  For the philosophical commitment, epistemic contextualism fits cleanly because it allows standards to shift contextually without changing factual guilt. Pragmatic encroachment would be messier as it suggests the same evidence constitutes different facts under different stakes - that could undermine objectivity. 

  The toughest counterargument is definitely the "tail wagging the dog" concern. The memo must confront this head-on by emphasizing: 1) the pre-existing factual determination of misconduct, 2) how sanctions serve different institutional purposes, and 3) that the sliding scale actually protects students from disproportionate harm. 

  Notably, the user didn't mention appeal mechanisms - that's worth including as a safeguard. Also should affirm unanimous votes for expulsion to reinforce gravity. Tone must be decisive but collegial since this is for internal debate. The "Recommendation" section should mirror academic governance language with clear rationale bullets.
answer: |-
  ## MEMORANDUM  
  **TO:** Academic Integrity Board Members  
  **FROM:** Chair, Academic Integrity Board  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Evidentiary Standards for Sanctions  

  ### I. RECOMMENDATION  
  **Adopt a sliding scale of evidentiary standards tied to sanction severity:**  
  *   **Warning/Reprimand:** **Preponderance of the Evidence** (more likely than not)  
  *   **Probation/Course Failure:** **Clear and Convincing Evidence** (high probability)  
  *   **Suspension/Expulsion:** **Beyond a Reasonable Doubt** (near certainty)  

  ### II. RATIONALE  
  The current uniform "clear and convincing" standard fails to account for the profound difference in consequences between minor sanctions (e.g., a warning) and severe ones (e.g., expulsion). Expulsion is an academic death penalty, irrevocably altering a student's life trajectory. The gravity of this outcome demands the highest certainty in our findings. Conversely, a warning, while serious, is primarily corrective and does not warrant the same level of procedural burden. A sliding scale:  

  1.  **Aligns Proof with Stakes:** Reflects the fundamental principle that the more severe the potential deprivation, the greater the certainty required. This is consistent with legal systems and ethical risk assessment.  
  2.  **Enhances Fairness:** Protects students from catastrophic errors in high-stakes decisions while allowing efficient resolution of lower-stakes cases.  
  3.  **Preserves Integrity:** Maintaining a high bar for expulsion upholds the Board's credibility and the university's values. Lowering the bar for minor sanctions acknowledges proportionality without condoning misconduct.  

  ### III. PHILOSOPHICAL COMMITMENT  
  This policy aligns most closely with **Epistemic Contextualism**.  

  *   **Why Contextualism?** The *fact* of whether misconduct occurred is objective and fixed. However, the *standard* for what counts as sufficient proof for a specific *purpose* (imposing sanction X) is context-dependent. The severity of the sanction defines the context and the requisite level of certainty. We are not saying the *facts* change based on the sanction; we are saying the *justificatory threshold* for acting upon those facts changes based on the potential harm of the action (the sanction).  
  *   **Why Not Pragmatic Encroachment?** Pragmatic encroachment suggests the *very content of knowledge* (e.g., "the Board knows Student X cheated") depends on practical stakes. This policy does not commit us to that view. We can consistently hold that the objective fact of guilt is fixed, while recognizing that the standard for *acting decisively to impose a specific sanction* must vary with the sanction's severity. Our policy changes the *action threshold*, not the underlying epistemic state concerning the facts.  

  ### IV. ADDRESSING THE STRONGEST OBJECTION  
  **Objection:** "Letting the sanction fix the standard of proof makes guilt depend on our choice of punishment, not the facts. It's circular: we choose a sanction, which lowers the proof needed to impose it."  

  **Serious Engagement:**  
  This is a profound and valid concern about circularity and due process. Our recommendation **does not** make factual guilt depend on the sanction. Here’s why:  

  1.  **Factual Determination Precedes Sanction Selection:** The Board must first determine, based on evidence presented *against the applicable standard*, whether misconduct occurred. Only *after* a finding of misconduct does sanctioning begin. The sliding scale dictates the standard *for the finding of misconduct*, but that finding is still about the *objective fact* of whether the violation happened.  
  2.  **Standard is Tied to *Potential* Sanction, Not Chosen Sanction:** The evidentiary standard is set *before* deliberation based on the *most severe sanction under consideration* for the alleged violation type (per established guidelines). We don't first pick expulsion and then demand "beyond a reasonable doubt"; rather, because expulsion *is a potential outcome* for a major violation, the higher standard applies *from the outset* to the factual finding.  
  3.  **Sanction Severity Reflects Objective Harm, Not Arbitrary Choice:** The severity levels (and corresponding standards) are tied to predefined, objective criteria about the nature of the violation and its consequences (e.g., core course vs. elective, first offense vs. repeat). This minimizes arbitrariness.  
  4.  **Higher Burden for Severe Sanctions Protects the Accused:** The objection's logic could equally condemn the status quo: applying a single, high standard to *all* cases means we demand unreasonable certainty for minor sanctions, potentially letting guilty students off lightly. The sliding scale *increases* protection where it matters most (expulsion).  

  **In essence:** The sanction doesn't *define* guilt. The potential sanction *defines the level of certainty we require* to make a finding of guilt that could *justify* that sanction. This is a safeguard, not circularity.  

  ### V. IMPLEMENTATION & SAFEGUARDS  
  To ensure fairness and mitigate concerns:  
  1.  **Clear Guidelines:** Define sanction ranges for violation types upfront.  
  2.  **Standard Set Early:** Determine the applicable standard *before* reviewing evidence, based on the alleged violation's potential sanctions.  
  3.  **Unanimity for Expulsion:** Require unanimous Board agreement for findings under "Beyond a Reasonable Doubt."  
  4.  **Robust Deliberation:** Maintain rigorous discussion separating factual findings from sanctioning.  
  5.  **Appeals Process:** Ensure a clear, independent appeals mechanism.  

  **CONCLUSION:** Adopting a burden-sensitive sliding scale is ethically sound, procedurally fair, and philosophically grounded in contextualism. It strengthens our commitment to both academic integrity and student justice. I urge the Board to approve this policy.  

