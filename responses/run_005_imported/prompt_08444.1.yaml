prompt: |-
  The novel I'm currently touring centers on a demon who agrees to lift a plague from a village on one condition: that the villagers come to admire him, sincerely and for his own sake. At my last stop, I'm moderating an onstage conversation with a moral philosopher whose work defends fitting-attitude ("buck-passing") accounts of value against the wrong-kind-of-reasons problem, arguing that only "object-given" reasons -- and not "state-given" ones like the demon's -- can make a pro-attitude fitting. I'd rather the hour not become a paraphrase of my own plot, so I want questions that stress-test her distinction rather than let her simply restate it. Please draft seven or eight interview questions: at least one that turns my own demon back on the object-given/state-given line, one that presses the standard worry that a wrong-kind reason can always be redescribed so that it, too, counts as "object-given," one on whether her solution is meant to generalize to the fittingness of attitudes that have nothing to do with value, such as fear or blame, and one asking what sort of case would actually persuade her that the distinction fails. For each, add a brief follow-up keyed to the answer she's most likely to give.
