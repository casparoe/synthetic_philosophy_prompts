  First, I need to reconstruct why undermining futures cause inconsistency. Let me visualize it: Suppose current chance theory T assigns 5% probability to some future event F. But if F occurs, it would mean T wasn't the actual chance theory all along. That's spooky - like a prophecy that falsifies itself. Now, applying the Principal Principle naïvely: My credence in F given ch(F)=0.05 should be 0.05. But if F happens, ch(F) wasn't actually 0.05! So the condition "ch(F)=x" becomes self-undermining. 

  Lewis's fix - declaring undermining futures "inadmissible" - feels like moving the goalposts. The user asks if this is principled or ad hoc, which suggests they suspect it's the latter. I should acknowledge that while Lewis's move saves consistency, it comes at a cost. Making admissibility hinge on chance's metaphysical basis (Humean supervenience) feels circular. It's like saying "trust chance theory T, except when T predicts its own falsehood" - which is exactly when we'd want calibration! 

  The user might be probing whether alternative Humean approaches (like Ismael's) fare better. I'll note that but stay focused. Deep down, they're probably wrestling with whether objective chance can coexist with Humeanism. That tension is the real "bug" - and Lewis's fix might just highlight how gnarly it is.
answer: |-
  The conflict between the Principal Principle (PP) and Humean Supervenience (HS) arises from **undermining futures**, leading to potential inconsistency. Here's a breakdown:

  ### 1. **Why Undermining Futures Threaten Inconsistency**
     - **PP Requirement**: If you know the present chance of A is *x* (chₜ(A) = *x*) and your evidence is *admissible*, your credence in A should be *x*:  
       Cr(A | chₜ(A) = *x* ∧ E) = *x*  
       (where E is admissible evidence).
     - **Humean Supervenience (HS)**: Chances at time *t* supervene on the *entire* Humean mosaic (past, present, *and future*). A "undermining future" F is a possible future consistent with chₜ that, if actualized, would make chₜ *false*.  
       Example: Let T be the true chance theory at *t*. T assigns a positive probability (e.g., 0.01) to a future F where events unfold such that T *itself* is not the best systematization of the mosaic. Thus:  
       - chₜ(F) = 0.01 (according to T),  
       - But if F occurs, the chance at *t* was *not* T (contradicting the initial premise).

     - **Inconsistency**: Apply PP to F:  
       Cr(F | chₜ(F) = 0.01 ∧ E) = 0.01.  
       However, if E includes knowledge that HS is true, then:  
       - F implies ¬(chₜ = T),  
       - But the conditioning statement asserts chₜ = T (since chₜ(F) = 0.01 entails T is true).  
       Thus, F is inconsistent with chₜ = T, making Cr(F | chₜ = T) undefined or 0—contradicting PP's demand for 0.01.

  ### 2. **Lewis's Response: Inadmissibility of Undermining Propositions**
     Lewis resolves this by declaring propositions about undermining futures **inadmissible** as evidence:  
     - **New Admissibility Clause**: Evidence E is inadmissible if it "pertains to whether F obtains and is not already settled by history up to *t*" (paraphrased).  
     - **Effect**: You cannot conditionalize PP on chₜ(F) = *x* while *also* conditionalizing on F (or its possibility). In evaluating Cr(F | chₜ(F) = 0.01), E must exclude information about F’s occurrence if F is undermining.  
     - **Justification**: Admissible evidence should only include historical facts (up to *t*) and *theories of chance*. Undermining futures are "hidden" from the present; their exclusion preserves PP's role as a guide to rational credence given *current* chances.

  ### 3. **Is This Principled or Ad Hoc?**
  Lewis's move is **systematically motivated but philosophically costly**:
     - **Principled Aspects**:  
       - **Internal Consistency**: It resolves the contradiction while preserving PP and HS.  
       - **Role of Admissibility**: Admissibility *already* excludes knowledge of future outcomes (e.g., knowing a coin *will* land heads makes evidence inadmissible). Undermining futures extend this to "meta" outcomes about chance itself.  
       - **Metaphysical Foundation**: HS defines chances as patterns in events—so propositions altering those patterns are naturally exceptional.

     - **Ad Hoc Criticisms**:  
       - **Circularity**: Admissibility is defined by what preserves PP, which is circular. Lewis concedes this but argues it’s unavoidable.  
       - **Limited Scope**: PP becomes inapplicable to hypotheses central to Humeanism (e.g., "this chance theory is true").  
       - **Epistemic Cost**: Agents must ignore logically possible information about undermining, which seems arbitrary if HS is true.  
       - **Alternative Theories**: Rivals (e.g., primitivist chances) avoid undermining by denying HS, suggesting Lewis's fix is tailored to save his metaphysics.

  **Conclusion**: Lewis's response is a **principled adjustment within his system** but highlights a tension in Humeanism. It prioritizes consistency by restricting PP's scope, reflecting HS's revisionary view of chance. However, it sacrifices intuitive applications of PP and relies on a gerrymandered notion of admissibility. Critics see this as evidence that HS cannot coherently ground objective chance (*the "big bad bug"*), while defenders view it as a necessary refinement.
