prompt: |-
  A few weeks ago I had a long, increasingly technical argument with a friend of mine, a biostatistician, about what it even means to say that a particular patient has a given percent chance of surviving five years. He maintained that any such figure is hostage to the reference class used to compute it: that a given patient belongs to indefinitely many equally legitimate comparison classes, that there is no non-arbitrary way to privilege one over the rest, and that a clinician who quotes a single number to a patient is dressing up a convention as a measurement. I pushed back that medicine cannot simply throw up its hands at this, since patients still have to make real decisions and need some number to act on. The disagreement has become more than academic, because I sit on the shared decision-making committee at the hospital where I work — the body that sets standards for how prognostic statistics are presented in patient decision aids — and a case matching our argument almost exactly has landed on the agenda.

  A 43-year-old patient with a rare sarcoma subtype is choosing between an aggressive resection with significant expected morbidity and a palliative approach, and wants a five-year survival estimate to help her decide. Her surgical oncologist quoted 61 percent, computed from a large national registry's broad category for her tumor site and stage. A specialist she consulted for a second opinion quoted 22 percent, computed from a pooled case series of fourteen patients matched on her specific genomic subtype and comorbidities. Both figures are correctly calculated from real data; they differ only in which population of "similar patients" was treated as the relevant comparison class, and a third reasonable clinician could very plausibly produce a third number from a third defensible class. The patient's family has concluded that someone on her care team is incompetent, and is demanding that the hospital simply state "the real number." On the committee itself, opinion has already split three ways: some members want to mandate the narrowest available reference class on the theory that specificity trumps everything; others want to mandate the broadest adequately powered class on the theory that small samples are unreliable; a few want to abandon point estimates for ranges entirely.

  Please draft the short memo I will circulate ahead of next week's meeting, recommending a concrete policy for how our oncologists should present survival statistics in cases like this one. I want the memo to commit to an actual recommendation rather than merely cataloguing the options already on the table, and I want it to engage seriously with my friend's underlying objection — that no such rule can be anything more than a convention dressed up as a methodology — rather than treating the choice of reference class as a narrow technical detail that any competent statistician could resolve.
reasoning: |-
  Okay, the user is dealing with a complex ethical and statistical dilemma in a hospital setting. They're on a decision-making committee that needs to establish standards for presenting survival statistics to patients, and they're caught in a debate about reference class problems. 

  The core tension here is between statistical purity and clinical practicality. The biostatistician friend raises a valid philosophical point about reference classes being arbitrary, but the hospital can't just tell patients "it's all relative" when they're facing life-altering decisions. 

  I notice the user is clearly frustrated by the family's reaction (accusing someone of incompetence) and the committee's fragmentation. They need a solution that both acknowledges the statistical ambiguity and provides concrete guidance for clinicians. The memo needs to walk a tightrope: honoring the truth of the reference class problem while refusing to abandon patients to complete uncertainty.

  What's interesting is how the user frames this - they're not just asking for a technical fix but for a way to institutionalize epistemic humility. That's sophisticated. The memo should model the very transparency it recommends to patients.

  The emotional subtext feels urgent. This isn't academic; a real patient is stuck between 22% and 61% with surgeons waiting. The family's panic ("demanding the real number") shows why the hospital must respond thoughtfully. Any policy needs to address both the intellectual problem and the human distress it causes.

  Hmm... the three committee factions each have merit but miss the bigger picture. Mandating narrowest class ignores reliability issues; mandating broadest loses precision; switching to ranges just kicks the can. The solution probably lies in structure rather than singularity - requiring disclosure of multiple estimates with context about their tradeoffs.

  Key principles emerging: 1) Honesty about uncertainty isn't unprofessional, it's scientific integrity. 2) Patients deserve to know why numbers differ. 3) The goal isn't to eliminate judgment but to make it transparent. 

  The memo should probably require presenting at least two estimates from different classes with plain-language explanations of why they differ. That turns the reference class problem from a bug into a feature - showing patients how perspective shapes prediction. Clinicians would hate the extra time, but the policy could provide templated language.

  Most importantly, it must validate the biostatistician's point while refusing therapeutic nihilism. Something like: "All survival estimates are conventions, but some conventions better serve patients when presented with context about their construction." That disarms the philosophical objection by embracing it.
answer: |-
  ## MEMORANDUM  
  **TO:** Shared Decision-Making Committee  
  **FROM:** [Your Name/Title], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Policy Recommendation: Presenting Survival Estimates in Cases of Conflicting Reference Classes  

  The case of the 43-year-old sarcoma patient highlights a fundamental challenge in prognostic statistics: **survival estimates are not objective measurements of an individual’s fate, but probabilistic projections based on selected reference classes.** As my colleague, the biostatistician, rightly argues, *any single estimate is inherently conventional*—dependent on which population we deem "similar enough" to the patient. No "real number" exists independently of this choice.  

  However, clinical decisions cannot await philosophical resolution. Patients deserve transparent, actionable guidance that acknowledges uncertainty without paralysis. Our policy must balance three imperatives:  
  1. **Honesty** about the limitations of all estimates,  
  2. **Utility** for patient decision-making,  
  3. **Rigor** in statistical methodology.  

  ### Recommended Policy: The "Triangulated Estimate with Context" Approach  
  When reference classes yield materially different survival estimates (e.g., >15% absolute difference), oncologists **must** provide:  

  1. **Multiple Estimates with Sources:**  
     - Present at least **two survival estimates** derived from defensible reference classes (e.g., broad registry data *and_ narrow genomic cohort).  
     - Cite the source and defining characteristics of each reference class (e.g., "61% based on National Registry [Year], Stage III Pelvic Sarcomas, n=1,200"; "22% based on Genomic Subtype B7 Pooled Series, n=14").  

  2. **Contextual Explanation:**  
     - **Explicitly state why estimates differ:**  
       *"Survival estimates vary based on which patient groups we compare you to. Broader groups (like large registries) provide more stable numbers but may overlook unique factors. Narrower groups (like specific genomic subtypes) may be more relevant but less reliable due to small numbers."*  
     - **Acknowledge uncertainty:**  
       *"No single number perfectly predicts your outcome. These estimates are guides based on past patients. Your actual result could be higher or lower."*  

  3. **Clinician Interpretation:**  
     - Require the treating oncologist to state **which estimate they find most clinically relevant** and **why**, based on their judgment of the patient’s overall picture (e.g., comorbidities, tumor biology, functional status).  
     - Example: *"Given your specific genomic profile and overall health, I believe the 22% estimate from the subtype cohort is more relevant, though the larger registry’s 61% suggests potential for better outcomes."_  

  4. **Decision-Aid Structure:**  
     - Present estimates visually (e.g., bar chart comparing ranges/estimates) alongside plain-language explanations of trade-offs between specificity and reliability.  
     - Include a prompt for patient questions: *"Which of these numbers feels most relevant to you? What questions do you have about them?"_  

  ---

  ### Why This Addresses the Reference Class Problem  
  - **Rejects false precision:** By presenting multiple estimates, we concede that no single class is "true." This disarms the illusion of objectivity while providing actionable data.  
  - **Makes convention explicit:** Explaining *why* estimates differ transforms the reference class dilemma from a hidden bias into a transparent, discussable factor.  
  - **Empowers without misleading:** Patients gain insight into how medical judgment interprets statistical ambiguity. Families understand discrepancies reflect methodology, not incompetence.  
  - **Balances specificity and reliability:** Mandating multiple estimates avoids dogmatism about "broadest" or "narrowest" classes. Clinicians retain flexibility while adhering to transparency.  

  ### Why Alternatives Fall Short  
  - **Mandating a single class (broad/narrow):** Ignores the legitimate trade-offs. A narrow class may be statistically unsound; a broad class may be clinically irrelevant.  
  - **Switching to ranges only:** Ranges obscure the *reason* for uncertainty (e.g., is the range wide due to noise or heterogeneity?). Patients still need a starting point for discussion.  
  - **Abandoning estimates:** Unacceptable. Patients require quantitative anchors to weigh risks/benefits of treatment.  

  ---

  **Conclusion:**  
  Survival estimates are conventions—but conventions grounded in evidence and expert judgment. Our policy must embrace this reality rather than conceal it. By presenting **multiple estimates with clear context**, we honor the statistical truth *and_ the patient’s need for clarity. This approach transforms the reference class problem from a liability into an educational tool, fostering shared understanding rather than mistrust.  

  I move that we adopt this framework for all prognostic estimates where materially conflicting reference classes exist, and develop standardized decision-aid templates to support clinicians.  

  **Recommended Vote:** Approve the "Triangulated Estimate with Context" policy.  
  **Attached:** Draft patient-facing diagram illustrating conflicting estimates and their origins.  

  ---  
  *This memo synthesizes statistical epistemology, patient autonomy, and clinical pragmatism. It accepts that all reference classes are conventions while asserting that transparent conventions—presented with humility—are superior to false certainty or therapeutic nihilism. The policy forces clinicians to articulate their reasoning, turning ambiguity into dialogue.*
