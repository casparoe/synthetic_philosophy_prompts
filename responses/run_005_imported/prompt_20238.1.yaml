prompt: |-
  ok so my cross country coach just started making us use this app that pulls our Strava data (pace, distance, heart rate) to calculate 'training load points' every week, and whoever's on top gets to pick the warmup music and gets a shoutout at practice. i watched a video about goodhart's law a while back (the whole 'when a measure becomes a target it stops being a good measure' thing) and then i saw the term 'specification gaming' in an article about AI finding weird loopholes in video games instead of actually playing them right, and it sounds related but i'm not sure if its the same idea or not?? can you explain how those two actually connect or differ, and then give me the most important implications for what's probably gonna happen with our points system specifically, like the actual non-obvious ways it could get gamed, not just 'people will lie about their runs.'
