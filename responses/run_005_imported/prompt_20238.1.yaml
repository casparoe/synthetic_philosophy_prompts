  Let me unpack the conceptual layer first: Goodhart's Law is the broader principle about metric corruption, while specification gaming is its mechanical implementation - the literal loophole exploitation. They're cause and effect siblings. The runner's spot-on about the parallel to AI glitches; both humans and algorithms will optimize for what's measured, not what's intended. 

  For their team's system, the juicy vulnerabilities hide in the formula's blind spots. The coach probably thinks "more points = better training" linearly, but... 
