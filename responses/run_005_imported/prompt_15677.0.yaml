answer: |-
  Your dinner debate touches on a deep and well-known issue in probability theory, particularly when reasoning from a state of complete ignorance about a continuous parameter. The core problem is that the principle of indifference (or insufficient reason)—which suggests assigning equal probabilities to possibilities when no information distinguishes them—depends critically on how the "possibilities" are defined. In this case, defining possibilities in terms of edge length (\(s\)), volume (\(V = s^3\)), or surface area (\(A = 6s^2\), or equivalently \(s^2\) for simplicity) leads to different probabilities for the event that \(s < 35\) cm. As you calculated:

  - **Uniform edge length (\(s\))**: \(P(s < 35) = (35 - 20) / (50 - 20) = 15/30 = 0.500\)
  - **Uniform volume (\(V\))**: With \(V_{\min} = 20^3 = 8000\), \(V_{\max} = 50^3 = 125000\), and \(V(35) = 35^3 = 42875\),  
    \(P(V < 42875) = (42875 - 8000) / (125000 - 8000) = 34875 / 117000 \approx 0.298\), so \(P(s < 35) \approx 0.298\)
  - **Uniform surface area (\(A\))**: Using \(A = s^2\), \(A_{\min} = 400\), \(A_{\max} = 2500\), and \(A(35) = 1225\),  
    \(P(A < 1225) = (1225 - 400) / (2500 - 400) = 825 / 2100 \approx 0.393\), so \(P(s < 35) \approx 0.393\)

  You could also consider a uniform distribution in log space (e.g., \(u = \ln s\)), which is sometimes used for scale parameters:  
  - **Uniform \(\ln s\)**: With \(u_{\min} = \ln 20 \approx 2.9957\), \(u_{\max} = \ln 50 \approx 3.9120\), and \(u(35) = \ln 35 \approx 3.5553\),  
    \(P(u < \ln 35) = (\ln 35 - \ln 20) / (\ln 50 - \ln 20) = \ln(35/20) / \ln(50/20) = \ln(1.75) / \ln(2.5) \approx 0.5596 / 0.9163 \approx 0.611\), so \(P(s < 35) \approx 0.611\)

  Each of these approaches seems "reasonable" under ignorance, but they yield inconsistent results. This inconsistency arises because a uniform distribution in one variable implies a non-uniform distribution in another due to the nonlinear relationships (e.g., \(V \propto s^3\), so a uniform \(V\) concentrates more probability density toward smaller \(s\)). The problem is underdetermined because you lack information about how the "randomness" is parameterized—that is, which quantity (edge length, volume, etc.) should be considered "uniformly spread" in the absence of information.

  ### Is there a defensible, principled way to resolve this?
  In short, no—not with the given information. Here's why:

  - **No unique "correct" parameterization**: The choice of which quantity to treat as uniform depends on context or assumptions that aren't provided. For example:
    - If customers order based on linear size (e.g., "I want a 30 cm cube"), uniform edge length might be natural.
    - If soil cost drives orders (volume matters), uniform volume could make sense.
    - If material cost is key (surface area matters), uniform surface area might be appropriate.
    - If relative sizes are perceived logarithmically (e.g., a 10% increase feels the same at any scale), uniform \(\ln s\) could be defensible.  
    Since you have no information about ordering behavior, all are equally plausible, and no principled reason favors one over the others.

  - **Limitations of ignorance priors**: This issue is a manifestation of Bertrand's paradox, a classic problem highlighting how probabilities for continuous parameters can be ill-defined under ignorance. The principle of indifference works well for discrete, symmetric cases (e.g., a fair coin with two clearly distinct outcomes) but breaks down for continuous spaces where the "symmetry" depends on the chosen metric. Resolving this requires additional constraints, such as:
    - **Invariance principles**: For example, Jeffreys prior (used in Bayesian statistics) aims for invariance under reparameterization by using the Fisher information metric. But this requires a statistical model (e.g., a likelihood function), which you don't have here. For a scale parameter like edge length, Jeffreys prior would suggest a uniform distribution in log space (\(\propto 1/s\)), giving \(P(s < 35) \approx 0.611\). However, without data or a model, this is still a choice, not an objective truth.
    - **Practical defaults**: In many real-world contexts, the variable with the given range (here, edge length) is treated as uniform for simplicity. This is common in engineering or business settings where linear dimensions are specified. But this is pragmatic, not principled—it doesn't resolve the arbitrariness.

  ### Broader implications for the principle of indifference
  Your example exposes a fundamental flaw in applying the principle of indifference naïvely to continuous parameters:
  - **It doesn't "make sense" in general for continuous spaces**: As shown, the principle is sensitive to parameterization, leading to contradictory probabilities. This implies that ignorance does not uniquely determine a probability distribution; it only reflects subjective choices about what is "equally likely."
  - **The habit is rescuable—but only with care**: The principle can be salvaged in limited cases:
    - **Discrete, finite outcomes**: If you discretize the edge length (e.g., assuming 1 cm increments from 20 to 50 cm, giving 31 possible sizes), \(P(s < 35)\) is well-defined (e.g., 15/31 ≈ 0.483 with endpoints included). This avoids the parameterization issue but introduces arbitrariness in the discretization step size.
    - **When context defines the metric**: If external information specifies the relevant quantity (e.g., "customers order based on volume"), the principle works. But here, there is no context.
    - **As a subjective Bayesian prior**: You can choose a prior based on convenience or convention (e.g., uniform on \(s\) for simplicity), but this admits the subjectivity rather than eliminating it. Probability assignments under complete ignorance are inherently subjective.

  In summary, for your specific puzzle, the probability that \(s < 35\) cm is underdetermined—there is no single "correct" answer based on ignorance alone. This underscores that the principle of indifference, while useful in simple discrete cases, cannot be blindly applied to continuous parameters without additional structure. For reasoning under ignorance, it's better to acknowledge the ambiguity (e.g., by reporting a range of probabilities or refusing to assign one) rather than assuming uniformity in a specific variable. If you had data on past orders, you could estimate a distribution, but as posed, this is a lesson in the limits of probabilistic reasoning from pure ignorance.
