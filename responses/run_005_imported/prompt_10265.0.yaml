  Philosophically, Solomonoff induction is sound in theory, but its application is problematic. The convergence is asymptotic, meaning it requires infinite data. In practice, with finite data, a more complex model might be better. Also, the choice of programming language affects Kolmogorov complexity, which isn't unique. This relativity could undermine the objectivity they seek.

