  First, I need to unpack Solomonoff induction. It combines Occam's razor with Bayesian inference. The key points are: shorter programs have higher prior probability, and the method converges to the true model with more data. But the advisor's claim that Kolmogorov complexity gives a provably correct answer might be an overstatement.

