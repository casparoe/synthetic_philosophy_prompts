  ## BENCH MEMO: Doe v. Reproductive Genetics Associates

  **TO:** Justice [Justice's Name]  
  **FROM:** [Your Name], Law Clerk  
  **RE:** No. SC-XXXX, *Doe, a minor, by her GAL v. Reproductive Genetics Associates, P.C.* - Recommendation for Disposition  
  **DATE:** October 26, 2023  

  **I. RECOMMENDATION:** Affirm the lower court's dismissal of the minor plaintiff's "wrongful life" claim. While Benatar's asymmetry argument presents a novel and intellectually provocative challenge to the traditional baseline problem, recognizing a "wrongful life" tort based on this theory would represent an unprecedented, philosophically contentious, and judicially unmanageable expansion of tort law. Prudence counsels adherence to the near-unanimous position of U.S. jurisdictions rejecting such claims.  

  **II. THE THEORY OF HARM (Benatar's Asymmetry):**  

  Plaintiff's claim hinges entirely on Professor David Benatar's asymmetry argument as presented in *Better Never to Have Been* (2006). The core propositions relevant to this tort claim are:  

  1.  **The Presence of Pain is Bad:** Suffering constitutes a harm to the being experiencing it, regardless of other circumstances. Plaintiff's severe, degenerative condition guarantees significant suffering.  
  2.  **The Absence of Pleasure is Not Bad (for the Non-Existent):** The potential well-being a non-existent person *would have missed* is *not* a harm *to anyone*, because there is no subject to experience the deprivation.  
  3.  **Asymmetry Creates Harm Without Comparison:** Therefore, coming into existence under conditions of severe suffering is *always* a net harm *to the person who comes into existence*. The harm lies in the imposition of suffering itself, measured against the neutral state of non-existence (where no harm occurs from the absence of pleasure). No comparison between an "impaired life" and a "healthy life" (or non-existence) is necessary. The baseline is the *absence of harm* inherent in non-existence.  

  **Applied to this Tort Claim:**  
  *   **Harm:** Being brought into existence with a condition guaranteeing severe suffering constitutes the harm itself.  
  *   **Causation:** The clinician's negligence (failing to detect the condition, depriving parents of the choice to terminate) was the but-for cause of the child's existence and thus her suffering.  
  *   **Damages:** Compensable damages would theoretically flow from the suffering endured due to the existence the defendant's negligence caused. Calculation would focus on the costs associated with mitigating suffering (medical care, adaptive equipment, pain management) and potentially a separate award for the pain and suffering inherent in living with the condition.  

  **III. FAIR ACCOUNT OF WHY A COURT MIGHT STILL DECLINE TO RECOGNIZE THE CLAIM:**  

  Despite the ingenuity of Benatar's argument, compelling reasons exist for rejecting the "wrongful life" tort:  

  1.  **Judicial Role and Philosophical Overreach:**  
      *   Adopting Benatar's asymmetry commits the court to a specific, controversial metaphysical and ethical stance: that non-existence is preferable to a life with profound suffering. This is a deeply philosophical question about the value of existence itself, traditionally outside the purview of common law adjudication.  
      *   Courts are ill-equipped to resolve fundamental debates about the meaning of life, suffering, and non-existence. Legislatures, informed by broader societal debate, are better suited for such profound policy shifts.  

  2.  **The Intractable Baseline Problem (Reprised):**  
      *   Benatar attempts to sidestep the comparison, but tort law fundamentally relies on quantifying harm *relative to a baseline state*.  
      *   **Damages Calculation:** How does a jury measure the harm of "existence with suffering" against the "neutrality of non-existence"? Benatar provides a qualitative argument for harm, but offers no coherent methodology for translating "it is better never to have been" into dollars and cents. Juries would be asked to assign a monetary value to the very fact of existence under adverse conditions – a task bordering on the metaphysical and inherently arbitrary.  
      *   **Causation Nuance:** While negligence caused existence *in this state*, it did not cause the *genetic disorder itself*. The harm claimed stems from the combination of existence and the disorder. Untangling the clinician's role in causing the "harm of existence" from the natural biological cause of the suffering remains problematic.  

  3.  **Slippery Slope and Unforeseen Consequences:**  
      *   **Expansive Liability:** If existence with *this* genetic disorder is actionable harm, what about existence with less severe disorders? With profound poverty? In a war-torn region? The logic of Benatar's asymmetry could theoretically extend to any life where suffering outweighs pleasure, raising profound questions about societal values and the limits of tort liability.  
      *   **Devaluation of Life:** Recognizing the claim risks sending a message that the lives of severely disabled individuals are legally cognizable harms, potentially undermining societal efforts toward inclusion, respect, and support for people with disabilities.  

  4.  **Alternative Avenues for Redress:**  
      *   **Wrongful Birth:** Parents retain a robust claim for *their* extraordinary damages – the significant costs of lifelong care necessitated by the child's condition, which they would have avoided through termination. This directly addresses the financial impact of the clinician's negligence without requiring the court to adjudicate the value of the child's existence.  
      *   **Regulation & Malpractice:** Professional discipline and traditional malpractice actions (by the parents) remain available to deter negligent prenatal testing.  

  5.  **Overwhelming Jurisdictional Consensus:**  
      *   Every U.S. state appellate court to consider a "wrongful life" claim has rejected it, primarily due to the baseline/comparison problem and policy concerns. Straying from this consensus requires extraordinarily compelling justification not met by reliance on a contested philosophical theory.  

  **IV. CONCLUSION:**  

  Plaintiff's reliance on Benatar's asymmetry is a serious attempt to overcome the traditional barrier to "wrongful life" claims. It forces a re-examination of the concept of harm. However, adopting this theory would require this Court to make a profound philosophical judgment about the nature of existence and harm, create insurmountable practical difficulties in awarding and calculating damages, risk significant unintended societal consequences, and break ranks with every other jurisdiction in the nation. The existing remedy of "wrongful birth" adequately addresses the tangible financial harms flowing from the defendant's negligence without venturing into the ethically fraught territory of declaring a specific life a legally cognizable injury. The lower court's dismissal should be affirmed.  

  **Prepared for Oral Argument:** Plaintiff will likely emphasize the unique, profound suffering inherent in this specific degenerative condition and argue that traditional rejection doctrines are callous and illogical in the face of Benatar's asymmetry. Defense will stress judicial restraint, the impossibility of damages calculation, the existing "wrongful birth" remedy, and the dangerous implications of recognizing the claim. Be prepared to probe both sides rigorously on the *practical judicial application* of Benatar's theory and the precise limits of any potential cause of action.  

  Respectfully submitted,  
  [Your Name]  
