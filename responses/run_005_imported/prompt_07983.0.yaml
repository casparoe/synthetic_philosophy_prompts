prompt: |-
  So I co-host this tiny history-and-philosophy-of-science podcast with two other people from my program (we've got maybe 40 regular listeners, mostly our own labmates, lol), and next week's guest is a philosopher whose whole research program is defending scientific realism against the pessimistic meta-induction using the structural realist move -- the Worrall-style "it's the mathematics that carries over, not the ontology" line. My co-host already wrote the warm-up questions (career trajectory, why phil of sci, all that), so I got stuck writing the ones that actually engage the view, and I want them sharp enough that he can't just retreat to the Fresnel-to-Maxwell example everytime, which is what he does in basically every paper and talk of his Ive read.

  Could you draft me something like eight questions, arranged as a sequence that builds? Start by making him actually distinguish his structural realism from the Kitcher/Psillos "divide et impera" selective realism (the working-posits-vs-idle-posits move) -- he tends to slide between the two like they're interchangeable. Then give me two or three that walk him through cases from Laudan's original list that are way less friendly to the "structure survives" story than Fresnel's equations: phlogiston theory, and separately caloric theory (Carnot's efficiency result got carried over into real thermodynamics even though caloric itself turned out to be fictional -- is that a point in his favor, or does it just show his criterion is loose enough to retrofit onto literally any case?). Somewhere in there work in a question tying this to Stanford's unconceived-alternatives problem, since that seems like a genuinely different threat that structural continuity doesn't even touch. Close with a question that forces him to say what an actual counterexample to his view would look like, so "no refuting instance has turned up yet" can't be the answer. For at least two or three of the questions, give me the reply he's most likely to give and a sharp follow-up, so I'm not stuck improvising on the spot.
