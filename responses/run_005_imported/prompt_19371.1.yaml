answer: |-
  ## Dialogue: Tickets or Tangibles? Berkeley's Money Debated

  **Characters:**  
  *   **Nominalist (Nora):** Defends the Caffentzis reading. Emphasizes Berkeley's conventionalism and linguistic parallels.  
  *   **Pragmatist (Pat):** Argues for the "productive capacity" grounding, rooted in Berkeley's economic anxieties.

  **(1) Pat:** Nora, your nominalist reading is elegant, linking money to words and signs. But how does it square with Berkeley’s palpable terror of *unbacked* credit? Query 23 is explicit: "Whether the credit or paper money issued by a public bank, without a sufficient fund, be not dangerous?" Pure convention can't explain this fear. If it's just a ticket, why does backing matter at all?

  **(2) Nora:** Because, Pat, even a ticket system requires *trust in the system's ability to settle obligations*. Berkeley’s "power" isn't a physical *thing* backing the note; it’s the *expectation* that the ticket can reliably command industry *within the functioning economic community*. The "sufficient fund" isn't a hoard of gold, but a *demonstrated capacity* for production, ensuring the ticket's conventional role holds. Backing is about *systemic confidence*, not intrinsic value.

  **(3) Pat:** But where does that confidence *come from*? You reduce "sufficient fund" to mere expectation, yet Berkeley ties the national bank directly to "land and industry" (Query 416). That sounds like grounding in real assets! If confidence is purely conventional, why anchor the bank specifically to tangible national productivity? Why not just declare tickets by fiat?

  **(4) Nora:** Because convention isn't arbitrary whim! It arises *from* material reality and social practice. The "land and industry" *are* the source of the "power" the tickets represent and circulate. The bank ties tickets *to* that concrete reality to *establish* the convention reliably. It's not that land *is* the money's value; it's the *referent* that gives the sign (the ticket) its meaning and utility within the economic 'language'. Without that link, the sign is empty, like a word without a referent.

  **(5) Pat:** You invoke "meaning" and "utility," but Berkeley’s 1721 South Sea essay diagnoses collapse precisely when signs *detach* from real activity – "projecting" overtakes "industry." Query 480 asks: "Whether the ruin of credit be not the ruin of the nation?" Your conventionalism risks making credit collapse seem arbitrary. For Berkeley, isn't the "ruin" caused precisely when tickets *exceed* the actual "power" (productive capacity) they purport to represent?

  **(6) Nora:** Exceeding productive capacity *undermines the convention*, Pat! It’s like using a word to mean something utterly disconnected from established usage – communication breaks down. When tickets are issued far beyond what the existing social and productive network can realistically support with industry, the convention *fails*. Confidence evaporates because the system proves *unreliable* at facilitating the transfer of power. The collapse is in the *sign system's* functionality, triggered by its disconnect from the underlying reality it signifies.

  **(7) Pat:** But what *principled limit* does your conventionalism impose on issuance? If value is *only* convention, couldn't a sufficiently confident public sustain *any* amount of paper? Berkeley clearly thinks there *is* a limit defined by something non-conventional: "Whether the circulating cash ought not to be proportioned to the number of people and the dispatch of business?" (Query 295). That "proportion" points to real economic activity, not just belief.

  **(8) Nora:** The "proportion" is dictated by the *requirements of the convention itself*! The convention exists to facilitate the exchange of "power" (industry). Too few tickets? Exchange is hampered. Too many? The link between ticket and power becomes diluted, *weakening the convention's reliability*. The limit isn't some mystical intrinsic value of gold; it's the practical limit of how many tokens the system can manage *without confusing or breaking the conventional link* to the real flow of industry. It's operational, not metaphysical.

  **(9) Pat:** Yet Berkeley consistently appeals to "real" things: land, industry, population – the "stock and industry of the nation" backing the bank (Query 416). He fears paper that "hath no real foundation in the wealth of the country" (Query 24). If it's *all* convention, why constantly invoke "real foundation" and "wealth"? Doesn't this language betray an appeal to something *prior* to convention?

  **(10) Nora:** The "real foundation" *is* the source of the "power" the convention *represents and circulates*. It's prior as the *object* of signification, not as the *substance* of the sign's value. Berkeley isn't reverting to commodity theory; he's emphasizing that the sign system (money) must faithfully track and mediate the *actual productive relations* ("power") of the community. The "wealth" is the *content*, the convention is the *medium* for exchanging it. Failing to track it makes the medium malfunction. His nominalism describes money's *nature*; his pragmatism dictates its *sound management* within the real world it serves.

  **(11) Pat:** So the "backing" is the *reality signified*, not value infused? But doesn't Berkeley's constant worry about *misrepresentation* – tickets claiming power that isn't there – suggest that for the system to work, the sign *must* accurately correspond to a non-conventional reality? Convention alone can't enforce that correspondence.

  **(12) Nora:** Precisely! The correspondence *is* the condition for the convention's *stability and utility*. Berkeley’s genius is showing that money's *value* is conventional (no intrinsic worth needed), but its *functionality* and *stability* depend critically on its accurate representation of the underlying, non-conventional productive reality ("power"). The "ticket" has no value in itself, but it utterly fails if it doesn't reliably point to the real capacity for industry. That's the tightrope he walks, and both readings capture essential strands.
