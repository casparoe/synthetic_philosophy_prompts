  Hey so in my philosophy of mind seminar we just went through the "objections" section of Turing's 1950 imitation game paper, and the last one is this odd bit about extrasensory perception. From what I can tell, Turing basically shoots down every other objection (the mathematical one, Lady Lovelace's, the consciousness one, etc) but then for ESP he kind of just concedes that telepathy is probably real given the statistical evidence available at the time, and his fix is just to isolate the players so the human cant cheat using psychic powers. Doesnt that mean Turing basically admitted the imitation game can be broken by ESP, and isnt that the actual reason philosophers today dont treat the Turing test as a serious criterion for machine intelligence? Kinda surprised my prof didnt spend more time on it if its that big of a deal.
