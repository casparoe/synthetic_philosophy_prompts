  ## The Bloodstained Mirror: Dissolving the Myth of Moral Equality in War

  The debate over the moral status of combatants – whether soldiers fighting cleanly for an unjust cause possess the same moral permissions as their just adversaries – strikes at the heart of our understanding of war, responsibility, and life itself. Your impassioned debate with your friend captures the profound tension between Michael Walzer’s entrenched doctrine of the moral equality of combatants and Jeff McMahan’s radical revisionism. While both frameworks grapple with the grim realities of organized violence, a rigorous examination reveals that McMahan’s individual-liability model, despite its practical challenges, provides the more compelling account of the *deep morality* of killing in war, fundamentally dissolving the traditionalist symmetry. Walzer’s institutional view, while pragmatically potent for law, ultimately rests on a morally unsustainable separation of the soldier from the unjust war they prosecute.

  **I. The Traditionalist Fortress: Walzer’s Defense of Combatant Equality**

  Walzer’s defense, articulated in *Just and Unjust Wars*, is built upon twin pillars: the institutional nature of war and the combatant’s epistemic plight.

  1.  **War as a Separate Realm:** Walzer conceptualizes war as a distinct social practice, a "realm of necessity and duress," governed by its own rules. Within this realm, soldiers are not autonomous moral agents but functionaries of the state, stripped of their private moral identities. Their job is to fight, not to judge the *jus ad bellum*. The *in bello* rules (discrimination, proportionality) constitute a "war convention" that applies equally to all combatants, creating a level moral playing field. Killing an enemy combatant who fights cleanly is not murder; it is the tragic but permissible consequence of their shared status as warriors engaged in a mutual enterprise sanctioned (however grimly) by the practice of war itself. The conscript fighting for the aggressor is coerced into this role; his killing, within the rules, is an act of war, not personal murder.
  2.  **The Epistemic Abyss:** Walzer powerfully argues that expecting individual soldiers to discern the justice of their nation’s cause is profoundly unrealistic. Enmeshed in the "fog of war," subjected to state propaganda, lacking access to crucial information, and facing immense coercive pressures (especially conscripts), soldiers are simply not positioned to make reliable *ad bellum* judgments. Holding them morally liable for killings committed under these conditions, while fighting according to the shared *in bello* rules, is therefore unjust. The moral equality of combatants acts as a shield, protecting soldiers from being judged as murderers for actions compelled by a situation they cannot accurately assess or escape.
  3.  **The Practical Imperative:** Finally, Walzer emphasizes the catastrophic consequences of abandoning symmetry. If only just combatants were permitted to kill, and unjust combatants were treated as murderers, the laws of war would collapse. Unjust combatants would have no incentive to follow *in bello* constraints, leading to greater brutality against civilians and combatants alike. Maintaining the *in bello / ad bellum* separation and combatant equality is essential for preserving any semblance of humanitarian restraint in the hellish reality of warfare. It is a tragic but necessary compromise for a world where unjust wars happen.

  **II. The Revisionist Siege: McMahan’s Liability-Based Assault**

  McMahan, in *Killing in War*, launches a direct assault on Walzer’s core premises, grounding his argument in individual moral responsibility and the ethics of self-defense.

  1.  **Liability Tracks Responsibility:** McMahan rejects the notion of war as a morally insulated realm. The deep morality of killing, he argues, is fundamentally individualistic and governed by principles akin to self-defense. A person is liable to defensive killing only if they are morally responsible for an *unjustified threat* to others. Merely posing a threat is insufficient; the threat must be unjust, and the individual must bear responsibility for it. A just combatant poses a *justified* threat to the unjust aggressors; killing them is therefore permissible defense. An unjust combatant, however, poses an *unjustified* threat, even if they fight "cleanly." Therefore, killing them is permissible defense against their unjust aggression.
  2.  **Dissolving the Excuse/Justification Distraction:** McMahan directly confronts the epistemic argument and Walzer’s potential refuge in excuses. He concedes that many unjust combatants are *excused* for their participation due to duress, ignorance, or epistemic limitations. They are not morally *blameworthy* in the same way a knowing, willing aggressor might be. **However, crucially, an excuse does not negate liability.** Excuses mitigate or eliminate *culpability* (deserving of blame/punishment), but they do not transform an unjust threat into a justified one. A soldier coerced into fighting for an aggressor may be excused for his actions – we may not condemn *him* as vicious – but the threat he poses remains objectively unjust. The just combatant defending himself or his compatriots against that threat is therefore morally *permitted* to kill the excused but still threatening unjust combatant. Conversely, the excused unjust combatant, even while blamelessly fighting, is **not morally permitted** to kill just combatants. Doing so compounds the initial injustice. The moral *permission* to kill is asymmetric.
  3.  **The Collective Practice Illusion:** McMahan rejects Walzer’s claim that war’s collective and political nature fundamentally changes the underlying moral calculus. While war involves collective entities, the actual killing is done by individuals against individuals. The moral justification for killing must ultimately reside in the relationship between those individuals – primarily, whether the victim is liable to attack due to their responsibility for an unjust threat. State authorization cannot magically confer a moral permission to kill that the individual lacks under basic principles of morality. The "separate equality" of the warrior is a dangerous fiction that obscures the fundamental moral asymmetry between the defender and the aggressor, regardless of uniforms or state decrees.
  4.  **The Law/Morality Divide Conceded (But Not Conclusive):** McMahan readily acknowledges the practical difficulties and potential dangers of translating his deep morality into positive international law. Maintaining symmetric *legal* rules (like the Geneva Conventions) might be pragmatically necessary to preserve humanitarian constraints and incentivize compliance. However, this concession about *law* does not undermine the *moral* argument. We can recognize that symmetric laws are a tragic practical necessity while simultaneously affirming that the underlying moral reality is asymmetric. To confuse the pragmatic legal framework with the deep morality is to commit a category error. The challenge of law does not invalidate the moral truth.

  **III. The Verdict: Dissolving the Mirror**

  While Walzer’s framework offers pragmatic utility for governing the horrors of war through law, McMahan’s individual-liability model provides the superior account of the *fundamental morality* of killing in war. The traditionalist fortress crumbles under the weight of three decisive objections:

  1.  **The Liability Principle is Irresistible:** The core insight that liability to defensive harm stems from moral responsibility for an *unjust* threat is compelling and consistent with our deepest intuitions about self-defense and responsibility outside of war. Walzer’s attempt to suspend this principle within the "realm of war" feels like a morally arbitrary concession to necessity, not a reasoned ethical position. Why should donning a uniform sever the link between moral responsibility for unjust harm and liability to defensive force?
  2.  **Excuse ≠ Justification:** McMahan successfully navigates the epistemic challenge by wielding the crucial distinction between excuse and justification. Walzer’s powerful description of the soldier’s plight explains why unjust combatants are often *excused*, mitigating or eliminating their *culpability*. However, it does not, and cannot, demonstrate that their lethal actions are morally *justified* or that they possess the same *moral permission* to kill as just combatants. An excused threat remains an unjust threat. The unjust combatant, even the blameless conscript, fundamentally lacks the moral right to kill those defending a just cause. Their actions, while perhaps understandable, remain morally *impermissible* at the deepest level.
  3.  **The Moral Cost of Symmetry:** Maintaining moral equality forces us to affirm that a soldier fighting cleanly for a genocidal aggressor possesses the *same moral permission* to kill a defender resisting genocide as that defender has to kill him. This is morally grotesque. It grants a normative equivalence where none exists. Walzer’s institutional view, while aiming to protect soldiers, ultimately provides a moral shield for participation in profound injustice, obscuring the fundamental moral difference between fighting for a just cause and fighting for an unjust one, even under duress.

  **The Qualified Conclusion:**

  Therefore, **McMahan’s revisionist position prevails on the core question of deep morality: there is no moral equality of combatants.** Soldiers fighting cleanly for an unjust cause are not morally permitted to kill just combatants; they are liable to be killed because they contribute to an unjust threat, even if excused; and just combatants possess a moral permission to kill them that is not reciprocated.

  **However, this moral verdict necessitates a crucial qualification regarding law.** Implementing McMahan’s deep morality directly into the laws of war would likely be disastrous. Determining individual *ad bellum* liability in the fog of war is impossible. Asymmetric rules would remove all incentive for unjust combatants to follow *in bello* constraints, potentially leading to catastrophic humanitarian consequences. Therefore, **Walzer’s symmetry should be retained as a matter of practical international law and military doctrine.** The Geneva Conventions' equal application of *in bello* rules remains a vital, tragic necessity for mitigating suffering.

  This is not a contradiction, but a recognition of the gap between ideal morality and the grim realities of political conflict. We should strive to create a world where unjust wars are prevented, reducing the need for such tragic compromises. But until then, we must hold two truths: the deep moral truth that killing for an unjust cause is never permissible, even when excusable; and the practical necessity of symmetric rules to prevent war from descending into even greater barbarity. McMahan shatters the mirror of moral equality, revealing the stark asymmetry beneath. Walzer provides the essential, if morally flawed, framework for navigating the broken glass. The challenge is to live with the tension between the moral truth we recognize and the practical necessities we cannot yet escape.
