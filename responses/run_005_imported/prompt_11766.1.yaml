answer: |-
  Here’s a draft memo for your exhibits committee, weaving together scientific accuracy, philosophical nuance, and practical museum pedagogy. It directly engages the Lewis-inspired objection while providing concrete recommendations:

  ---

  **MEMORANDUM**  
  To: Exhibits Committee, [Museum Name]  
  From: [Your Name], Exhibits Committee  
  Date: [Current Date]  
  Subject: Recommendation for Pluto Signage in the Solar System Hall  

  ### Background
  The reclassification of Pluto (IAU Resolution 2006) presents a unique challenge: it conflates a *scientific taxonomy* with a *cultural-linguistic convention*. While the IAU’s definition (celestial body that orbits the Sun, is spherical, and has "cleared its neighborhood") is the formal standard for astronomical classification, it does not automatically overwrite 76 years of entrenched public convention. As David Lewis argued in *Convention* (1969), the meaning of terms like "planet" emerges from shared expectations and precedents—not decrees—and shifts only when a critical mass of participants *coordinate* on a new understanding.  

  Our signage must acknowledge that **two distinct conventions now coexist**:  
  1. **Scientific**: Pluto is a "dwarf planet" (per IAU).  
  2. **Cultural**: Pluto retains "planetary" status for many, supported by ongoing dissent within planetary science (e.g., the "Great Planet Debate" conference, 2008; consistent public pushback).  

  ### Recommendation: The "Evolving Language" Approach  
  We propose a dual-part sign that **teaches scientific literacy through the lens of linguistic evolution**, satisfying our educational mandate while honoring the complexity:  

  #### **Sign Text Draft**  
  **HEADER**: PLUTO & THE DYNAMIC SOLAR SYSTEM  
  > *For 76 years, Pluto was called the ninth planet—a term reflecting early 20th-century understanding. In 2006, the International Astronomical Union (IAU) established a new definition requiring a planet to "clear its orbit" of debris. Pluto shares its orbit with icy bodies in the Kuiper Belt, so it was reclassified as a "dwarf planet"—a category highlighting its similarity to other small, round worlds beyond Neptune.*  
  >  
  > *This change remains debated. Many astronomers note that "clearing its orbit" applies unequally across the Solar System (e.g., Earth wouldn’t clear its orbit if placed in the Kuiper Belt). Others argue definitions must evolve with discovery. Whether you call Pluto a planet or not, it remains a fascinating world that reshaped our understanding of the Solar System’s complexity.*  
  >  
  > **Explore Here**: Compare Pluto to the eight IAU planets *and* other dwarf planets like Eris and Ceres. What traits matter most?  

  #### Why This Works  
  1. **Acknowledges both conventions** without equivocation:  
     - Clearly states the IAU’s definition and Pluto’s reclassification.  
     - Legitimizes dissent by citing substantive scientific critiques (e.g., orbital clearance as location-dependent).  
  2. **Reframes controversy as pedagogy**:  
     - Shows science as a process of refining language to match new evidence.  
     - Invites visitors to engage critically ("What traits matter most?") rather than passively accept authority.  
  3. **Uses precise terminology**:  
     - "Dwarf planet" is employed (respecting IAU’s role) but explicitly presented as a *subcategory debate*.  
     - Avoids the false binary of "Is Pluto a planet? Yes/No."  

  ### Handling Potential Backlash  
  1. **Preemptive Context**: Add a small panel near the exhibit entrance titled *"Why Do Definitions Change in Science?"* explaining how terms like "planet" have always shifted (e.g., asteroids were "planets" in the 1800s; exoplanets forced new thinking).  
  2. **Tiered Response Guide for Angry Letters**:  
     - **Level 1 (Public)**: "Our exhibit highlights how scientific language evolves with discovery. The IAU’s definition helps astronomers categorize objects, but ongoing debate shows science is alive and self-correcting."  
     - **Level 2 (Scientific)**: Cite peer-reviewed critiques (e.g., Stern & Levison’s 2002 paper on orbital clearance; Kirby Runyon’s geophysical definition proposal) to show IAU’s rule isn’t monolithic.  
     - **Level 3 (Pedagogic)**: "We aim to foster critical engagement, not dictate orthodoxy. Visitors leave understanding *why* definitions matter—not just memorizing labels."  

  ### Why Not the Other Options?  
  - **IAU-Only Approach**: Ignores legitimate linguistic/scientific dissent, alienating visitors who see Pluto’s demotion as arbitrary. Fails to teach *how* science negotiates meaning.  
  - **"Controversy" Placard Alone**: Avoids taking an educational stand, reducing us to journalists rather than educators. Our compromise integrates controversy into a larger narrative.  

  ### Conclusion  
  The IAU’s vote didn’t instantly rewire 76 years of convention; it *initiated* a slow recalibration. By presenting Pluto’s status as a case study in how science and language co-evolve, we honor astronomy’s rigor while acknowledging that words gain meaning through use—not just votes. This approach turns a polarizing debate into a masterclass in scientific literacy.  

  **Vote Recommended**: Approve the "Evolving Language" signage draft.  

  ---  

  ### Key Philosophical Points Embedded  
  - **Lewis’s Coordination Principle**: The sign acknowledges that the pre-2006 "planet" convention solved a coordination problem (labeling Solar System objects) but new data disrupted equilibrium. The IAU’s definition is *one* attempt to re-coordinate—not an absolute decree.  
  - **Authority vs. Convention**: The museum respects the IAU’s taxonomic authority while noting that linguistic conventions require broader buy-in (thus the "two conventions" framing).  
  - **Dynamic Language**: By highlighting historical definition shifts (asteroids, exoplanets), we show Lewis’s point: conventions endure only while they serve shared goals.  

  This memo gives your committee a defensible, educational path forward that treats the public’s attachment to Pluto not as ignorance, but as evidence of how deeply language conventions shape our cosmos.
