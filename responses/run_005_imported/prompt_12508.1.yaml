prompt: |-
  F. H. Bradley's regress purports to show that uniting a relation with its terms requires a further relation, which in turn requires another, and so on ad infinitum, so that mere relation-positing can never by itself secure the unity of a proposition. Please rank the following proposed solutions from most to least successful at genuinely blocking the regress, as opposed to merely stipulating the unity they are meant to explain: Frege's doctrine that concepts are unsaturated; Russell's multiple-relation theory of judgment; Wittgenstein's picture theory in the Tractatus; Armstrong's treatment of states of affairs as ontologically fundamental, non-mereological wholes; and trope theorists' appeal to a primitive relation of compresence. Please give your answer as a JSON block, formatted as follows:

  ```json
  ["Frege", "Russell", "Wittgenstein", "Armstrong", "Trope theory"]
  ```
reasoning: |-
  We are ranking the proposed solutions to Bradley's regress from most to least successful at genuinely blocking the regress (as opposed to stipulating the unity). The solutions are:

  1. Frege: doctrine that concepts are unsaturated.
  2. Russell: multiple-relation theory of judgment.
  3. Wittgenstein: picture theory in the Tractatus.
  4. Armstrong: states of affairs as ontologically fundamental, non-mereological wholes.
  5. Trope theory: appeal to a primitive relation of compresence.

  Bradley's regress: When we try to unite a relation R with its terms a and b (as in aRb), we might think we need a relation to unite R with a and b. But then that new relation would need another relation to unite it, and so on ad infinitum.

  The key is to block the regress by providing a genuine explanation of unity without requiring further relations.

  Let's evaluate each:

  1. Frege: Concepts (relations) are unsaturated, meaning they have gaps that are filled by objects. This intrinsic incompleteness means that when we plug in the right number of objects, the whole becomes complete without needing an external unifier. The unity is inherent in the nature of the concept. This seems to block the regress by making the unity internal to the components.

  2. Russell: Multiple-relation theory of judgment. In this theory, judgment is a multiple relation between a subject and the various objects and relations that constitute the proposition. However, this theory has been criticized for not providing a genuine unity. The multiple relation itself would need to be unified with the terms, potentially leading to a new regress. Russell later abandoned this theory because of difficulties in explaining the unity of the proposition.

  3. Wittgenstein: Picture theory (Tractatus). Propositions are pictures of states of affairs. The unity of the proposition comes from the fact that the elements of the proposition are arranged in a determinate way, mirroring the arrangement of objects in the world. The structure of the proposition is what unifies it. This is an internal feature and does not require an additional relation. However, one might argue that the arrangement itself is a kind of relation, but Wittgenstein would say that the logical form is what provides unity without requiring further relations. This is a strong candidate.

  4. Armstrong: States of affairs are fundamental, non-mereological wholes. The idea is that a state of affairs (like a's being R to b) is a basic entity that is not composed of its parts in a mereological way. Therefore, there is no need to unite the parts because the whole is prior to the parts. This avoids the regress by denying that we have to build the state of affairs from its constituents. However, one might argue that this is stipulative because it simply posits that states of affairs are unified without explaining how.

  5. Trope theory: Tropes are particular properties. The compresence relation is a primitive relation that bundles tropes together to form objects. But then the compresence relation itself would need to be related to the tropes, which might start the regress again. Since compresence is primitive, it might be seen as a stipulation to stop the regress, but it doesn't provide an explanation.

  Ranking from most to least successful:

  - Most successful: Frege. The unsaturatedness of concepts provides an intrinsic explanation for unity without requiring a further relation.

  - Next: Wittgenstein. The picture theory provides a structural unity that is inherent in the proposition as a fact itself.

  - Then: Armstrong. By taking states of affairs as fundamental, he avoids the regress by denying the need for composition. However, it might be seen as less explanatory because it doesn't explain how the unity arises, it just posits it.

  - Then: Trope theory. The primitive compresence relation might be seen as a stipulation that halts the regress but without a deep explanation. It is similar to introducing a primitive unifier.

  - Least successful: Russell. The multiple-relation theory seems to fall prey to the regress because the multiple relation itself would require a further relation to relate it to the terms.

  Therefore, the ranking from most to least successful:

  1. Frege
  2. Wittgenstein
  3. Armstrong
  4. Trope theory
  5. Russell

  But note: There is debate about Wittgenstein. Some might put him first because the picture theory is very robust. However, Frege's unsaturatedness is often seen as the classic and most direct solution.

  Also, Armstrong's view is sometimes considered a strong candidate because it avoids the regress by making states of affairs basic. But the criticism is that it doesn't explain the unity, it just takes it as primitive.

  Trope theory: compresence is primitive, so it is a stipulation.

  Russell: generally considered a failure in this context.

  So, I think:

  1. Frege: because the unsaturated concept naturally absorbs the terms without needing an external unifier.

  2. Wittgenstein: because the proposition is a fact and the arrangement of names in the propositional sign is what unifies it, without needing a further relation.

  3. Armstrong: by making states of affairs fundamental, he avoids the regress, but it might be seen as a brute-force solution.

  4. Trope theory: compresence is primitive, so it's a stipulation.

  5. Russell: the multiple-relation theory leads to a new regress.

  But note: Some might argue that Wittgenstein's solution is the most successful because it dissolves the problem by showing that the proposition must share the logical form with the state of affairs. However, I will stick with the above.

  Alternatively, Armstrong might be considered more successful than trope theory because he doesn't use a relation at all (states of affairs are non-relational wholes). Trope theory uses a primitive relation (compresence) which might be vulnerable.

  So, Armstrong over trope theory.

  Final ranking:

  1. Frege
  2. Wittgenstein
  3. Armstrong
  4. Trope theory
  5. Russell

