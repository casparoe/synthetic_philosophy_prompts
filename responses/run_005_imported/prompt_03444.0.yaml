  First, I need to ensure I understand both arguments deeply. The realist stance hinges on the arbitrariness—codons aren't chemically determined, which suggests a symbolic system. The skeptic view, via parity thesis, argues that DNA isn't uniquely informational; cellular machinery matters equally. The user wants a dialogue that presses each side's strongest points, not superficial debate.

