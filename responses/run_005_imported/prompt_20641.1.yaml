  Part (c) is surprisingly strong on moral necessity vs contingency. The "possible in name only" phrasing is dangerously reductive but captures Leibniz's tension well. Should dock points for implying alternative worlds aren't genuinely possible though.

  *checks rubric weights* Part (b) carries the most points (7) and has the biggest errors, so that's where the score drops most. The overall B+ feels right - competent but with significant metaphysical misunderstandings in key areas.

  User definitely needs the specific comments to justify scores, especially since they'll be attaching feedback to blue books. I'll flag the perfection misconception hardest because (1) it's central to Leibniz and (2) the utilitarian slant suggests deeper misunderstanding. Might add a teaching tip about preempting this confusion next term.
