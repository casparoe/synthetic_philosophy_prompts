prompt: |-
  I'm working through the axiomatic bargaining literature for my dissertation and keep getting tripped up on one point regarding the Kalai–Smorodinsky solution. My understanding is that Kalai and Smorodinsky (1975) essentially patched Nash's solution by adding restricted monotonicity as an extra axiom on top of Pareto optimality, symmetry, and independence of irrelevant alternatives, which is why the KS solution is generally regarded as an improvement on Nash's — it inherits all of Nash's appealing properties while also being monotonic in the size of the feasible set. Given that, I'm confused about why so many papers still treat KS and Nash as genuinely rival solution concepts rather than treating KS as a strict refinement of Nash's. If KS just adds monotonicity while preserving IIA, shouldn't every KS solution point also satisfy Nash's original axioms, making the "rivalry" between the two solutions more a matter of historical framing than actual substance? I'd appreciate help understanding what I'm missing here, since my advisor's reaction when I raised this suggested I've gotten something fundamentally wrong about how the two axiom systems relate.
