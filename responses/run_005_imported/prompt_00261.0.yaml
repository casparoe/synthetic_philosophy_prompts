  First, I need to recall the axioms. Nash has four: Pareto optimality, symmetry, independence of irrelevant alternatives (IIA), and invariance to affine transformations. KS replaces IIA with monotonicity. The user thinks that since KS adds monotonicity but keeps the others, KS should be a refinement. But that's not right because KS drops IIA. 

