prompt: |-
  So my older sister Maya is getting married in like 3 weeks and she asked ME (her annoying 16 year old sibling) to give the toast at the rehearsal dinner, which is already terrifying on its own. Backstory: we had to read big chunks of Franklin's autobiography for APUSH this semester, and the part where he makes that whole chart of 13 virtues and tracks himself with a dot every time he messes up literally made me think of Maya, bc she has done the EXACT same thing since she was like 12 -- color coded bullet journals, a habit tracker app with streaks, an actual laminated chore chart from middle school that my mom still has taped inside a cabinet. I want to build the toast around that comparison (like, "here's a guy who invented a whole moral self-improvement system 250 years before habit trackers were a thing, and my sister basically reinvented it from scratch") and get into the part where Franklin admits he never actually nailed all the virtues, especially humility, plus that bit about the guy who wants his axe polished all the way and eventually decides he likes it "speckled" because its way less work than he thought -- I think that's actually the perfect note to land the toast on but I have no idea how to get there without it sounding mean, like I'm just saying she's a control freak who never finishes anything.

  The problem is the audience is SO mixed. My grandma is coming and she's pretty religious and takes "striving to be good" seriously, so she might not vibe with a joke that sounds like its about giving up on being virtuous. My sister's fiancé Dan has never read a word of Franklin in his life and will be completely lost if I go too deep into it. But also like half of Maya's friends are on the debate team with her and definitely read the same excerpt, so they'll 100% clock it if I get the Franklin stuff wrong or make it too shallow/Wikipedia-summary-of-the-13-virtues. Can you actually write the toast for me, like a full script, roughly 2-3 minutes if read out loud? I don't want the Franklin thing to just be decoration sitting on top of a normal toast -- I want it to actually be doing the work of both the joke AND the sincere part, and it has to end sweet and not cynical, even though "you're never going to actually finish becoming perfect and that's sort of fine" is a pretty cynical thing to say if you land it wrong.
