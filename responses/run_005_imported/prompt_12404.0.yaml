  I should structure the toast to start with a warm congratulations, then recount the argument humorously. Explain the paradoxes using relatable analogies. Highlight Mara's point about diverse evidence versus statistical uniformity. Conclude by connecting her stance to intellectual integrity, tying it back to her book's theme on testimony. End with a toast that celebrates her rigor and courage.

