prompt: |-
  So my brother and I had a huge blowup this weekend over our grandmas lake house and I haven't been able to stop turning it over in my head since. She passed a few weeks ago and the will just says the house goes to "the grandchildren, to divide as they see fit," which is basically useless, so it's really just the two of us who have to sort it out, and it's already made a sad enough time so much worse. A couple days ago he sent a text to the whole family group chat announcing that he's "already decided" he's keeping the house outright, that he's not open to a buyout or splitting the proceeds from a sale, and that he'd already called the estate lawyer to start drawing up paperwork before either of us had actually talked it through. When I called him on it, his reasoning was basically that by locking himself into a public, hard-to-walk-back position fast, I'd have no real choice but to go along with it, since I'd be the unreasonable one if I "made him" go back on something he'd already announced to everyone.

  I vented about the whole thing to my friend Priya and we ended up arguing about it for like an hour. Priya, who's normally the most conflict-avoidant person I know, surprised me by saying my brother played it exactly right and that I'd be an idiot not to immediately fire back with my own "done deal," like telling the lawyer I'd already promised my half to my daughter for her wedding next year (which isn't even true), so that neither of us could back down without looking weak. But it seems to me like if we both lock ourselves into hard, irreversible positions before we've even figured out what's actually fair, we're just guaranteeing a nasty legal fight, or a forced sale that leaves us both worse off then if we'd just talked like adults, all because neither of us wants to be the one who blinks first. Honestly, even sitting here trying to game out the "smart" move kind of feels like I'm already halfway into doing the exact thing that annoyed me about him doing it. Was Priya right that going first and hard is basically the rational move once someone's already done it to you, or is there an actually sane way out of a standoff like this?
