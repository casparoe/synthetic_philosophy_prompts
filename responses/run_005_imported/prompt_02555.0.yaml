  Had a long, kind of ridiculous argument with a friend last night about evidential cooperation in large worlds (we'd both been reading about it for an EA reading group). I ended up taking the position that the whole framework -- cooperating with agents you can never causally interact with -- only actually works if the many-worlds interpretation of quantum mechanics is true, since MWI is what actually gives you enough variety of agents out there for the correlation to matter. Like, if MWI turned out to be false and its just one regular (if very big) universe, there's no real 'large world' left to cooperate across, so the whole argument collapses. She thought I was wrong but couldn't say why, just that it felt off to her. Who's actually right here, does ECL really stand or fall on whether MWI is true?
reasoning: |-
