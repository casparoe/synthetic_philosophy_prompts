answer: |-
  Your reconstruction is impressively accurate, and your circularity worry hits a central nerve in the debate. Let's break this down step by step, addressing your questions directly.

  ### 1. Your Reconstruction of the Dominance Argument
  **You've nailed the core structure:**
  - **Accuracy-First Goal:** Epistemic rationality is about minimizing inaccuracy (distance from truth), not avoiding financial loss.
  - **Dominance Theorem:** If your credences violate probability axioms (non-normalized, non-additive, etc.), there exists *some probabilistic* credence function that is strictly more accurate than yours *in every possible world*.
  - **Role of Strict Propriety:** This theorem holds *only* for scoring rules (like Brier score or log loss) that are **strictly proper**. A scoring rule is strictly proper if, for any probabilistic credence function **P**, reporting **P** uniquely minimizes expected inaccuracy *according to P itself*.

  **No significant garbling:** You correctly identify the key components (accuracy measure, dominance, propriety, and the connection to probability axioms). Joyce's 1998 argument ("A Nonpragmatic Vindication of Probabilism") is indeed the seminal source.

  ### 2. The Circularity Worry: Is Propriety Question-Begging?
  **Your worry is genuine, profound, and widely recognized.** Philosophers like Patrick Maher (2002), Aaron Bronfman, and others have pressed this exact point. The core challenge:

  - **The Dilemma:**  
    - **Option A (Circularity):** If "legitimate accuracy measure" is *defined* as "strictly proper scoring rule," then the argument assumes probabilism. Why? Because strict propriety *presupposes* that the agent *has a probabilistic credence function **P*** to calculate expected accuracy! Non-probabilistic agents can't even compute the expectation that defines propriety.  
    - **Option B (Need Independent Justification):** We need an *independent*, non-question-begging justification for why only strictly proper scoring rules count as legitimate measures of *pure epistemic accuracy* – without appealing to incentives, elicitation, or probabilistic expectations.

  **Standard Philosophical Responses (and Their Limits):**  
  Defenders (Joyce, Pettigrew, Schervish) offer arguments for strict propriety grounded in *accuracy considerations alone*. Key strategies:

  1.  **Truth-Directedness + Coherence (Joyce):**  
      *   **Truth-Directedness:** A scoring rule should always reward credences closer to the truth-value (1 or 0).
      *   **Coherence (Normative Additivity):** The inaccuracy of your overall credence state should be a function *only* of the inaccuracies of your individual credences. Combining them shouldn't introduce "interaction penalties" unrelated to truth.  
      *   **Claim:** Strict propriety follows from these two intuitively plausible constraints on any adequate accuracy measure. Coherence, in particular, rules out scoring rules that penalize "mismatched" credences in ways unrelated to truth (e.g., a rule favoring 0.5 for both A and ~A, but penalizing 0.6 for A and 0.4 for ~A, even if both are equally distant from truth).

  2.  **Domination Avoidance Requirement (Pettigrew):**  
      *   A legitimate accuracy measure must be such that probabilistic credences are *never* accuracy-dominated. If a scoring rule allows a probabilistic credence to be dominated, it fails as an accuracy measure. It turns out that *only* strictly proper rules guarantee that probabilistic credences are undominated.

  3.  **The "No Self-Undermining" Argument (Selten, Schervish):**  
      *   Suppose you care *only* about accuracy. If you believe reporting **Q** minimizes your expected inaccuracy *according to your own credences **P***, then reporting anything else would be epistemically irrational *by your own lights*. Reporting **P** is the only choice consistent with your commitment to minimizing expected inaccuracy. Strict propriety formalizes this.

  **Critiques of These Responses:**  
  *   **Coherence/Additivity Assumes Probabilism?** Critics (e.g., Hájek) argue that "Normative Additivity" smuggles in probabilistic assumptions. Why *should* overall inaccuracy depend *only* on individual inaccuracies? Doesn't this assume propositions are treated as independent, which is a probabilistic norm?
  *   **Domination Avoidance is Practical?** The requirement that probabilistic credences *must* be undominated might be seen as a pragmatic constraint (avoiding guaranteed loss) disguised as an accuracy constraint.
  *   **"By Your Own Lights" Relies on Probabilism:** The "No Self-Undermining" argument only works if the agent *has* a well-defined expectation (requiring probabilistic coherence) and *uses* it to guide belief reports. A non-probabilistic agent might reject this framework.

  **Status:** This is **an active and sophisticated debate**. While defenders provide arguments for strict propriety, critics maintain that these arguments either implicitly rely on probabilistic assumptions or appeal to pragmatic considerations (like avoiding dominated strategies). **Your worry is not confusion; it's engagement with a core philosophical tension.**

  ### 3. Is Strict Propriety Pragmatic in Epistemic Clothing?
  **Your intuition is sharp and partially correct.** The connection to elicitation is undeniable:

  *   **Origin:** Strict propriety *was* developed in statistics/economics precisely for honest elicitation (e.g., Savage, 1971).
  *   **Structure:** Its definition (`argmin_{Q} E_P[S(Q, ω)] = P`) is inherently about *incentives* for an agent with credences **P**.

  **Can it be Purely Epistemic?** Defenders argue **yes**, based on:

  1.  **The Alethic Interpretation of "Expected Inaccuracy":** They claim that `E_P[S(Q, ω)]` isn't *really* about practical expectations or decisions. It represents the *hypothetical* accuracy score **Q** would achieve *if **P** were the truth*. Reporting **P** is best *if your best estimate of the truth is **P***. Failing to report **P** means you aren't accurately reporting your own best estimate of where the truth lies – an epistemic failing.
  2.  **Accuracy as "Calibration" or "Truth-Tracking":** Strict propriety ensures that a credence function is most accurate *when it matches the true chances* (if known). Reporting 0.7 on a proposition that is true 70% of the time in the long run is optimally accurate. A non-proper rule might favor reporting 0.8 or 0.6 even when you know the true frequency is 0.7, which seems to misrepresent accuracy.

  **The Counter-Punch:** Critics argue this just relabels pragmatism:
  *   **"Best Estimate of Truth" is Practical:** Deciding what to report based on minimizing `E_P[S(Q, ω)]` *is* a decision-theoretic, pragmatic move.
  *   **Calibration is Long-Run Pragmatic:** Justifying propriety via long-run calibration frequencies ties accuracy to practical success over many trials, not truth-at-a-world. Joyce's argument is meant to be *world-relative*.

  **Your Insight is Key:** The "nonpragmatic" claim of accuracy-first epistemology **is significantly challenged** by the reliance on strict propriety. While defenders provide sophisticated arguments to ground propriety in alethic (truth-related) norms, the structural link to elicitation and incentives makes it difficult to completely sever the connection to pragmatic considerations. **It's arguably *less* pragmatic than Dutch Books, but not entirely free of pragmatic flavor.**

  ### Summary & Direct Answers

  1.  **Reconstruction:** Flawless. You perfectly understand Joyce's dominance argument and the critical role of strict propriety.
  2.  **Circularity Worry:** **A genuine and central problem**, not your confusion. Philosophers like Maher raised it. Standard responses (Truth-Directedness + Coherence, Domination Avoidance, No Self-Undermining) exist but are contested. Critics argue these responses either subtly presuppose probabilism (e.g., via Normative Additivity) or reintroduce pragmatic elements. The debate is ongoing and sophisticated.
  3.  **Propriety's Nature:** **Your suspicion is well-founded.** Strict propriety's origins and formal structure are deeply tied to pragmatic elicitation. Defenders argue it *can* be reinterpreted purely alethically (as reporting your best truth-estimate, or matching true chances). However, the argument that this reinterpretation fully escapes pragmatism is **controversial and arguably incomplete**. It significantly complicates the "nonpragmatic" claim. The later information-theoretic proofs (e.g., using convexity, like Predd et al. 2009) are mathematically elegant generalizations but **do not resolve the philosophical worry**; they still assume propriety or equivalent convexity properties, shifting the justificatory burden onto those properties.

  **Where Philosophers Are Divided:**
  *   Is Normative Additivity/Coherence a legitimate, non-question-begging constraint on accuracy measures?
  *   Does the "No Self-Undermining" argument rely on a prior commitment to decision-theoretic rationality (and thus probabilism)?
  *   Can the concept of "expected inaccuracy relative to P" be understood non-pragmatically?
  *   Is avoiding accuracy dominance a purely epistemic requirement, or is it ultimately pragmatic?

  **Your ML/engineering perspective is valuable here.** You recognize strict propriety as a tool for honest elicitation. The philosophical challenge is to show why this specific tool is uniquely suited to measure *epistemic accuracy*, independent of its success in elicitation. The burden of proof lies with the accuracy-first epistemologist, and the circularity worry remains a powerful critique. Your coworker should be impressed by the depth of your engagement. Present it exactly as you have here – it demonstrates a clear grasp of the argument and its most significant vulnerability.
