  My best friend's getting married in a few weeks and I'm his best man. He's the most terminally-online rationalist I know (Less Wrong, ACX comments section, all of it), and at his bachelor party, a few drinks in, he gave us an totally unprompted rant about the St Petersburg paradox -- not the boring "Bernoulli fixed it with diminishing marginal utility of money" version everyone's already heard, but the Ole Peters ergodicity-economics angle, where the actual fix isnt about how much you value money at all, it's that expected value quietly averages you over a whole ensemble of parallel copies of yourself, when really you only get one draw, played out sequentially through time. He said something like "the ensemble average and the time average come apart, and only one of them describes the life you actually live," and it was somehow the most romantic thing I heard him say all week. I want to build the toast around that line. Half the room is his rationalist friends who'll clock it immediately; the other half is two sets of very normal parents who've never heard the word "ergodic" in their life. Can you write me something like 4 minutes long, with one joke in there that lands for the nerds without losing everyone else, and that comes off as a love letter and not a stats lecture?
