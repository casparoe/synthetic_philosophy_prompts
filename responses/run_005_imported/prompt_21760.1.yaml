answer: |-
  Here’s a 4-minute toast that turns the St. Petersburg paradox into a love letter, with a wink for the nerds and heart for everyone else:

  ---

  **(Clink glass)**  
  Alright, everyone—deep breaths. I’ve known our groom since college, which means I’ve survived approximately 1,200 of his late-night "actually, let me explain why you’re wrong about milk" rants. But last weekend, at his bachelor party? He outdid himself. A few drinks in, he hit us with the *St. Petersburg paradox*.  

  *(Pause for confused smiles from parents, knowing nods from nerds)*  

  For those thinking, "Is that a Russian ballet?"—no. It’s a coin-flip game where math says you should bet your life savings… but no sane person would. And our groom didn’t just explain it. Oh no. He launched into this *glorious* rant about "ensemble averages" vs. "time averages."  

  *(Lean in conspiratorially)*  
  He said something I haven’t stopped thinking about: **"The ensemble average and the time average come apart—and only one of them describes the life you actually live."**  

  *(Pause. Soften tone)*  
  For the non-Ph.D.s here: imagine you could flip a coin for crazy rewards in a thousand parallel universes. The math averages *all* those universes and says "Go for it!" But in reality? You only get *one* life. One coin flip at a time. One story.  

  *(Turn to groom)*  
  That’s why your rant was weirdly beautiful, man. You weren’t just talking about statistics. You were saying: **Life isn’t lived in the averages. It’s lived in the single, fragile, precious draw you’re given.**  

  *(Shift to crowd)*  
  And that’s marriage, isn’t it? You don’t get infinite rolls of the dice. You don’t average out a thousand spouses. You get *one* person. One shared story, built day by day, choice by choice. No do-overs. No ensemble cast.  

  *(Joke time—grin at rationalist corner)*  
  So yes, to my fellow nerds: he *did* use a gambling paradox to argue for monogamy. And honestly? Only our groom could make "ergodicity" sound like a vow. *(Raise brow)* Though I’m still waiting on that preprint: *Marriage as a Non-Ergodic System: A Bayesian Approach to Dirty Dishes*.  

  *(Laughter. Gentle pivot back)*  
  But here’s the romantic truth beneath the jargon: **Love is choosing to bet everything—not on infinite universes—but on *this* one. On *this* person. On building something real in the only timeline you get.**  

  *(Turn to couple)*  
  So [Groom], [Bride]—you two get it. You’re not hedging your bets across parallel worlds. You’re all-in, right here. And that’s braver than any math. Because today, you’re saying: **"This is the draw I want. This is the life I’ll live."**  

  **(Raise glass)**  
  To the newlyweds: May your time average be full of joy. May your ensemble of "what-ifs" fade beside the beautiful reality you’re building. And may you keep reminding us all—with or without whiteboards—that the only average that matters is the one you create together.  

  **Cheers!**  

  ---

  **Why this works:**  
  - **The Joke:** The fake paper title (*Marriage as a Non-Ergodic System...*) nails the nerds without losing others ("Bayesian" and "dirty dishes" make it playfully human).  
  - **Parents Follow Along:** "Parallel universes," "one life," and "betting everything" translate the math into universal stakes.  
  - **Heart Over Homework:** The groom’s line becomes a metaphor for commitment, not a puzzle.  
  - **Nod to Rationalists:** "Non-ergodic system," "preprint," and "Bayesian" are Easter eggs.  
  - **4-Minute Flow:** Opener (0:45), Explanation (1:00), Pivot to Love (1:00), Joke (0:15), Toast (0:60).  

  **Delivery Tip:** Pause *just* after the key line ("...life you actually live"). Let the room feel its weight. That’s your romantic anchor.
