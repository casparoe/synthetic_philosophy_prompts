  I notice they’re intellectually honest—they don’t want "smuggled" realism—and pragmatic. They’re not asking for a philosophy seminar but for actionable clarity: "Can I keep arguing this way without self-delusion?" The factory farming example is key; it’s their concrete stake in the abstract problem. 

  The Frege-Geach problem really is the heart of it. Expressivism traditionally struggles to explain unasserted moral sentences (like the premise in a conditional). If "torture is wrong" is just booing in one context, why does it function as a truth-apt proposition in another? Blackburn’s quasi-realism tries to solve this by saying we *project* attitudes but can still reason "as if" moral facts exist, building a logic of attitudes. Gibbard treats norms as plans and shows how to logically combine them. Both aim to save ordinary practice. 

