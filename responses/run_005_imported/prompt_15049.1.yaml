  For the user, I’d stress: expressivism *can* rescue everyday argument, but it reframes what’s happening. Logic isn’t tracking mind-independent facts but managing our own attitudes. The factory farming syllogism isn’t "smuggling realism"—it’s extending disapproval consistently. If they’re comfortable with that, they can keep arguing. If they crave something sturdier than projected attitudes, expressivism might chafe. 

  Their metaethical tension mirrors the rationalist community’s own dissonance: wielding logic while denying its traditional ontology. That’s why this matters—it’s about intellectual integrity in their tribe. I’ll validate that discomfort but reassure them that expressivism, sophisticatedly deployed, doesn’t force silence or hypocrisy. They can boo cruelty and reason about it too.
answer: |-
  You've pinpointed a profound tension at the heart of contemporary metaethics, especially relevant within communities that value logical rigor while questioning moral realism. The Frege-Geach problem is indeed the central challenge for expressivists who want to preserve ordinary moral reasoning. Let's break down the implications and how responses like quasi-realism attempt to resolve them.

  **Core of the Frege-Geach Problem:**

  1.  **The Expressivist Claim:** When you *assert* "Torturing animals for fun is wrong," you are primarily expressing a negative attitude (disapproval, condemnation) or issuing a prescription ("Don't torture animals for fun!"), not describing a mind-independent fact.
  2.  **The Problem of Embedding:** Moral sentences constantly appear *unasserted* and embedded in complex logical contexts:
      *   **Conditionals:** "If torturing animals for fun is wrong, then factory farming is wrong." (Premise 1 of the factory farming argument)
      *   **Disjunctions:** "Either factory farming isn't wrong, or it doesn't cause gratuitous suffering."
      *   **Negations:** "It's not the case that factory farming is wrong."
      *   **Belief Reports:** "Alice believes that factory farming is wrong."
      *   **Modus Ponens:** The whole factory farming argument relies on this.
  3.  **The Challenge:** What do these embedded moral sentences express? Expressivism seems plausible for *asserted* moral claims. But in "If P, then Q," "P" isn't being asserted. If "P" ("torturing is wrong") just *expresses* disapproval when asserted, what is it doing inside the "if" clause? It can't be expressing disapproval *at that moment* because the speaker isn't asserting it. Yet, the conditional clearly means something and functions logically. The argument seems valid *because* the meaning of "wrong" is consistent across its asserted and unasserted occurrences.

  **The Stakes for You:**

  *   **The Threat:** If expressivism cannot explain the meaning and logical behavior of embedded moral sentences, then:
      *   Your everyday moral arguments (using modus ponens, reductio, etc.) are *semantically incoherent*. The logical connectives ("if...then", "not", "and", "or") require their components to have truth-apt content (propositions that can be true or false).
      *   It *seems* like you must be smuggling in realism, because only realist claims (genuine propositions about mind-independent facts) behave seamlessly in logic.
      *   Expressivism would force you to abandon standard logical reasoning in ethics, making your arguments impossible.

  **Standard Expressivist Responses: Do They Rescue Practice?**

  The goal of responses like Blackburn's Quasi-Realism and Gibbard's Norm-Expressivism is precisely to explain how logical reasoning works *without* presupposing moral realism. They try to show how attitudes can be the subject of logic.

  1.  **Blackburn's Quasi-Realism:**
      *   **Core Idea:** We *project* our attitudes onto the world, talking *as if* there were moral facts. The key is to show how this "as if" talk develops systematically to mimic realist discourse, including logic.
      *   **Solving Frege-Geach:** Blackburn analyzes complex sentences as expressions of *higher-order attitudes* towards combinations of lower-order attitudes.
          *   "If torturing is wrong, then factory farming is wrong" expresses a *higher-order attitude*: disapproval of the combination of disapproving of torture *while not* disapproving of factory farming. You are expressing a commitment to consistency in your attitudes.
          *   **Modus Ponens Rescue:** Accepting "If P, then Q" (disapproving of disapproving-P but not disapproving-Q) and accepting "P" (disapproving-P) *forces* you, on pain of *inconsistency in your attitudes*, to accept "Q" (disapprove-Q). If you don't disapprove of Q while disapproving of P and holding the conditional, you violate the commitment expressed by the conditional. Logic becomes about the consistency of commitments.
      *   **Rescues Practice?** **Largely Yes, with a Caveat:** Quasi-realism aims to show that *all* the trappings of realism – including truth-aptness, logical validity, and even talk of "moral facts" and "moral knowledge" – can be reconstructed *within* an expressivist framework. It claims to fully vindicate ordinary moral reasoning without ontological commitment to mind-independent moral properties. The logical operations *work* because they track the consistency requirements of our projected attitudes and commitments.

  2.  **Gibbard's Norm-Expressivism:**
      *   **Core Idea:** Moral judgments express the acceptance of *norms* (systems of rules) that govern planning and feeling. "Wrong" means roughly "forbidden by the norms I accept."
      *   **Solving Frege-Geach:** Gibbard develops a sophisticated formal semantics where normative sentences denote sets of "fact-norm worlds" (combinations of descriptive facts and norms).
          *   "Torturing is wrong" expresses acceptance of a norm that forbids torturing.
          *   "If torturing is wrong, then factory farming is wrong" expresses acceptance of a norm that links the two: *if* you accept a norm forbidding torture, *then* you must also accept a norm forbidding factory farming (or that the latter follows from the former). It's a norm about norms.
          *   **Modus Ponens Rescue:** Accepting the conditional norm and accepting the norm forbidding torture *logically entails* (within the system of norms and planning) accepting the norm forbidding factory farming. Validity is defined in terms of "planning consistency" or the coherence of the norms one accepts.
      *   **Rescues Practice?** **Yes, with a Different Foundation:** Gibbard provides a rigorous formal framework demonstrating how logical operators can combine normative contents understood as plans/norms. He explicitly aims to show that expressivism *can* account for the full logic of moral discourse.

  **Do They Merely Relocate the Difficulty? The Critical Question**

  This is the heart of your concern. Critics argue that sophisticated expressivism:

  1.  **Mimics Realism Too Well:** Quasi-realism ends up saying *everything* the realist says ("It's true that torture is wrong," "We know torture is wrong," "The argument is valid," "There are moral facts") but insists it's all just a projection of attitudes. The worry is that this is *indistinguishable* from realism in practice, making the expressivist claim hollow or merely terminological. Blackburn would reply that the *explanation* of *why* we talk this way (projection vs. description) is the crucial difference.
  2.  **The Problem of Truth & Representation:** Can attitudes genuinely be *true* or *false* in the way expressivists like Blackburn want to say they can be (as part of the quasi-realist project)? Or is this stretching the concept of "truth" beyond recognition? Realists argue that only beliefs aiming to represent the world can be properly truth-apt.
  3.  **The Problem of Normativity:** Both Blackburn and Gibbard ground logic in *consistency of attitudes/plans*. But why *should* we be consistent? Is this a further norm? Does explaining logical necessity via the norm of avoiding attitudinal inconsistency ultimately presuppose a kind of realism *about rationality itself*? This is the "location problem" pushed further – the norm of consistency might be the new, relocated difficulty. Expressivists try to explain this norm expressively too, but critics remain skeptical.

  **Implications for Your Position:**

  1.  **You *Can* Keep Arguing Logically as an Expressivist:** The sophisticated expressivist programs (Blackburn, Gibbard, and others like Allan Gibbard's later work, Simon Blackburn's developments, Mark Schroeder) are explicitly designed to allow this. They provide semantic frameworks showing how logical operations apply to non-descriptive, attitude-expressing content.
  2.  **It Requires Sophisticated Expressivism:** Simple "Boo/Hurrah" emotivism (Ayer) or naive prescriptivism (early Hare) *cannot* handle Frege-Geach. You need the resources of quasi-realism or norm-expressivism (or similar programs).
  3.  **The Justification for Logic Shifts:** The validity of modus ponens in your factory farming argument isn't grounded in mind-independent moral facts tracking logical laws "out there." It's grounded in the *internal consistency requirements of your own normative commitments or planning states*. Logic is about the coherence of your attitudes/plans. When you point out the argument to someone, you are challenging them to make their attitudes consistent.
  4.  **The "Smuggling Realism" Charge is Premature:** The commenter was wrong to claim the argument *only* works with realism. Sophisticated expressivism provides a non-realist account of why the argument is valid. However, the critic might counter that the expressivist account *presupposes* norms of rationality that are themselves problematic for strict anti-realism.
  5.  **The "Relocation" Worry Persists Philosophically:** While quasi-realism/norm-expressivism rescue the *practice* of moral argument, deep philosophical questions remain about whether they ultimately:
      *   Succeed in avoiding any covert realism (especially about rationality/logic).
      *   Provide a sufficiently robust explanation of moral truth and objectivity *within* a projectivist framework.
      *   Whether the complex semantics they develop are ultimately just a way of *simulating* propositional content for attitudes, rather than showing attitudes genuinely *have* such content.

  **Conclusion:**

  For your practical purpose – wanting to engage in rational ethical debate using standard logic while maintaining an expressivist metaethical view – sophisticated expressivism (Blackburn, Gibbard) provides a viable and well-developed path. **It does rescue the practice.** You are not "smuggling realism" by using modus ponens; you are relying on the consistency requirements inherent in the expression of your own attitudes and normative commitments.

  However, the philosophical debate about *whether this rescue is ultimately fully satisfactory* or merely relocates the core metaethical difficulties (especially concerning truth, representation, and the normativity of logic/rationality itself) remains live. As a participant in ethical arguments, you can confidently use logic within an expressivist framework, knowing that major philosophical programs are designed to support this. But as a metaethically reflective person, you should acknowledge that the expressivist account of *why* logic works is fundamentally different from the realist account, and that this difference continues to be a central topic of philosophical scrutiny. Your practice is saved, but the deepest philosophical justification for that practice remains contested territory.
