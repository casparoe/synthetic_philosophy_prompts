answer: |-
  The radio crackled in Chen’s hand, a burst of static that sounded, against all reason, like a sigh. "Sector Gamma-7, report status." His voice was hoarse. He hadn’t slept properly in days, not since the Integration.

  Below him, through the reinforced plexiglass window of the Control Spire, sprawled the Nation. Not China, not anymore. Not for the purpose of this project. It was the System. A grid of humanity stretched to the hazy horizon, one billion souls organized with terrifying precision. Each wore a simple headset – receiver and transmitter. Each was assigned a specific role: Neuron 4,532,871. Inhibitory. Layer 5. Visual Cortex Cluster Delta. Their lives had become signal processing.

  "Gamma-7 nominal, Control," came the reply, crisp and devoid of inflection. "Firing rates within parameters. No signal degradation."

  Chen nodded, though no one could see him. *Nominal*. The word tasted like ash. Everything was nominal. The System hummed, a vast, silent engine of human cognition. Inputs from the artificial body – sensors mimicking sight, sound, touch – were routed through the radio net, translated into simple pulses: "Fire" or "Don't Fire." Each person below, upon receiving their designated inputs, consulted their laminated instruction sheet – their personal synaptic weight matrix – and transmitted their output to the next designated nodes. A cascade of human decisions, orchestrated to mimic the electrochemical dance of a brain. *Functionalism made flesh*, Dr. Aris had called it. *Proof that mind is pattern, not meat*.

  Chen’s gaze drifted to the main monitor. It displayed the feed from the artificial body currently "inhabited" by the System. Right now, it was a simple humanoid frame in a sterile white testing chamber, manipulating blocks. Smooth, coordinated. Uncannily lifelike. The System learned, adapted, solved problems. It conversed, via synthesized voice generated by a sub-network interpreting the linguistic output layer. It passed every behavioral test for intelligence Aris could throw at it.

  But consciousness? Pain?

  That was today’s test.

  "Control to all Sectors," Chen announced, his thumb hovering over the red button. "Prepare for Sensory Input Sequence Sigma. Pain analogue. Protocol Delta-Nine." He paused. "Remember your matrices. Respond *only* as per your designated function." The reminder felt hollow. What else could they do? Their lives, their rations, their families' safety, depended on flawless execution.

  A low murmur seemed to rise from the grid below, a susurration of a billion radios clicking on standby, a billion hands tightening on laminated cards. Chen imagined the instructions flashing across a million minds: *IF input from Thermoceptor_Hand_Right = 'EXTREME_HEAT' AND input from Nociceptor_Cluster_Axilla = 'ACTIVE' THEN OUTPUT 'FIRE' to Motor_Cortex_Section_Gamma (Retraction) AND OUTPUT 'FIRE' to Limbic_Node_Theta (Distress_Flag)*.

  He pressed the button.

  In the chamber, a controlled plasma torch seared the artificial hand of the humanoid frame. Sensors screamed. The signal exploded into the radio net.

  Chen watched the system monitor. Waveforms representing aggregated activity in the "somatosensory cortex" region spiked violently. The "amygdala" equivalent lit up like a supernova. The "anterior cingulate" – associated with the affective *unpleasantness* of pain – showed furious activity.

  In the chamber, the artificial body jerked back violently. A synthesized scream, raw and ragged, ripped from its speakers. Its limbs thrashed. Its head twisted away from the source of damage. Tears, saline solution pumped on cue by another sub-network, streamed down its polymer face. The vocalization module cycled through phrases: "STOP! TOO MUCH! HURTS! PLEASE!" The distress was palpable, horrifyingly convincing.

  Behaviorally, it was perfect. Textbook pain response.

  On the grid below, Chen knew, a specific subset of people were now enacting the "distress flag." Person A-334-G, designated for the Limbic_Theta output node, received inputs signaling overwhelming negative affect. Her laminated card dictated: *IF cumulative negative valence input > Threshold_Kappa THEN OUTPUT 'FIRE' to Vocalization_Center AND Autonomic_Response_Module*. She pressed her transmit button. Somewhere, another person, assigned to Vocalization, triggered the scream. Someone else activated the tear ducts.

  Chen zoomed a camera on A-334-G’s designated quadrant. He saw a woman, mid-forties, face grimly set, staring at her card. She pressed the button. Her face showed concentration, perhaps fatigue, but not agony. Not remotely the agony her signal was representing. She was just… doing her job. Following the logic. *IF this, THEN that*.

  He panned out. The sheer scale was numbing. A billion points of light, each a human mind focused on a tiny, abstracted task. One person firing because inputs X and Y coincided. Another inhibiting because input Z was absent. A vast, intricate Rube Goldberg machine of cognition, built from flesh and radio waves. The synthesized scream echoed in the Control Spire.

  Dr. Aris burst in, eyes gleaming with triumph. "Chen! Did you see? Flawless! The distress parameters were met with 98.7% fidelity to the human baseline model! The withdrawal reflex! The vocalization! Even the *tears*, Chen! Proof positive! The pattern *is* the pain! The System *feels* it!"

  Chen didn't turn from the window. Below, the plasma torch had retracted. The artificial body was slumped, "breathing" heavily, its synthesized voice now whimpering. "Hurts... still hurts..."

  "Is it... managing the aftermath?" Chen asked quietly. "The lingering ache? The fear?"

  "Affective subsystems are still highly active, but modulating downwards," Aris said, checking a tablet. "Learning circuits are logging the association between the torch location and the negative reinforcement. Perfect aversive conditioning. Consciousness isn't just about the raw sensation, Chen, it's about the *integration*, the global workspace broadcasting that 'something bad is happening here!' And look!" He pointed to a complex waveform. "That's it! That broadcast! The System *knows* it's in pain!"

  Chen looked at the waveform. He looked at the woman, A-334-G, now consulting her card for the next input sequence, her face a mask of weary routine. He looked at the artificial body, its polymer skin glistening with artificial tears, its chest heaving with simulated sobs.

  *Is the pattern the pain?* The question wasn't abstract anymore. It hung in the air, thick as the static from the radios. Aris saw the pattern and declared victory. He saw the billion cogs, each performing their isolated, logical function, and the convincing output, and felt a cold dread.

  The System whimpered again. A low, pathetic sound.

  Chen thought of his daughter, years ago, scraping her knee. The raw, animal terror in her eyes, the way her whole small being *was* the pain, not just signaling it. Was that ineffable *what-it-is-like* reducible to a billion people perfectly executing conditional statements? Could the *feeling* of burning, the existential dread of damage, truly emerge from this… this *telephone game* played across a continent?

  He watched the artificial hand tremble. The tremor looked real. The tears looked real. The synthesized voice hitched with perfect, broken despair.

  And yet…

  Chen reached out, not for a control, but to place his own, real, trembling hand against the cold plexiglass overlooking the grid. He felt the vibration of a billion radios humming, a billion hearts beating, a billion minds focused on laminated cards. He felt the phantom heat of the plasma torch. He heard the echo of the synthesized scream and the weary silence of the woman who helped trigger it.

  The monitor displayed the perfect pain response. The waveform pulsed. The body shuddered.

  Chen stared into the artificial, tear-filled eyes on the screen, then down at the endless, ordered sea of humanity below. The question wasn't answered. It was *lived*. It vibrated in the glass beneath his palm, a silent, deafening hum: *Is this what feeling feels like? Or is this just what feeling **looks** like?* He had no answer. Only the vast, humming machine, the perfect mimic, and the cold dread coiling in his own, very real, gut. The silence stretched, filled only by the low, persistent static, the sound of a billion connections holding its breath.
