answer: |-
  **MEMORANDUM**  
  **TO:** Allocations Committee  
  **FROM:** [Your Name]  
  **DATE:** [Current Date]  
  **SUBJECT:** Resolving Our Voting Paradox & A Recommendation for Procedural Clarity  

  ---

  ### **The Problem: Why We’re Stuck**  
  Last quarter’s borderline grant exposed a tension in our process:  
  - **Bar-by-bar voting** (current bylaws) required separate majority votes on cost-effectiveness (CE) and capacity. Result: **CE passed 3–2, Capacity passed 3–2 → FUND**.  
  - **Gut poll** (direct "fund/don’t fund" vote) would have failed: only **2 members supported funding** outright.  

  This isn’t a fluke—it’s a known paradox in social choice theory called the **"Doctrinal Paradox"** (or "Discursive Dilemma"). When a group decision depends on multiple premises (here, CE + Capacity), voting *separately* on premises can contradict a direct vote on the conclusion ("fund"). Both outcomes are logically defensible but prioritize different values:  
  - **Bar-by-bar** prioritizes *procedural rigor* (each bar must independently pass).  
  - **Gut poll** prioritizes *holistic judgment* (individuals weigh both bars simultaneously).  

  Neither approach is "broken," but both have weaknesses:  
  - **Bar-by-bar risk**: Funds grants lacking *consensus support* (e.g., only 2/5 fully endorse).  
  - **Gut poll risk**: Allows strong feelings on *one bar* to override nuanced evaluation (e.g., "I hate CE, so I vote no" despite strong capacity).  

  ---

  ### **Why Neither Solution Is Ideal**  
  1. **Sticking with bar-by-bar**:  
     - ✅ Ensures both criteria are formally satisfied.  
     - ❌ May fund grants with weak overall support (as happened), risking distrust.  

  2. **Switching to gut polls**:  
     - ✅ Reflects true willingness to fund.  
     - ❌ Undermines our bylaws’ intent: a grant could fail *even if all agree CE and Capacity pass*, if members doubt minor details.  

  ---

  ### **Recommendation: Adopt Approval Voting**  
  I propose **approval voting** as a **third option** that resolves the paradox while honoring our dual-bar requirement:  

  #### **How It Works**  
  1. Each member votes **"approve" or "don’t approve"** *per grant*.  
  2. A grant is funded if **≥3 members approve** (majority).  
  3. **Critical nuance**: Members should approve a grant **only if they believe it clears *both* CE and Capacity bars**.  

  #### **Why This Solves Our Problem**  
  - **Example**: For last quarter’s grant:  
    - The 2 members who supported both bars vote **approve**.  
    - The 3 partial supporters (yes on one bar, no on the other) vote **don’t approve** (since they reject one bar).  
    - Result: **2 approve → NOT FUNDED** (matches gut poll outcome).  
  - **But crucially**: It forces voters to explicitly weigh *both criteria* before approving, preserving our commitment to rigorous evaluation.  

  #### **Advantages Over Competing Options**  
  | **Method**       | **Preserves Dual Bars?** | **Avoids Paradox?** | **Reflects True Support?** |  
  |------------------|--------------------------|---------------------|----------------------------|  
  | Bar-by-bar       | ✅                       | ❌                  | ❌ (may fund w/ low consensus) |  
  | Gut poll         | ❌                       | ✅                  | ✅                          |  
  | **Approval Vote** | ✅ (implicitly)         | ✅                  | ✅                          |  

  - **Balances structure and flexibility**: Approval voting respects our two-bar framework *without* decoupling them into independent votes.  
  - **Simple and decisive**: No ambiguous "partial yes" outcomes.  
  - **Proven in EA circles**: Used by GiveWell, LTFF, and others to capture holistic judgment while maintaining criteria discipline.  

  ---

  ### **Counterarguments Addressed**  
  **Q: "This is just a dressed-up gut poll!"**  
  A: Not at all. A gut poll asks "Should we fund?" without structure. Approval voting asks: **"Does this grant satisfy *both* criteria *to you*?"**—tying the vote directly to our two-bar standard.  

  **Q: "But our bylaws require separate votes!"**  
  A: Bylaws exist to serve our mission, not vice versa. We can amend them to adopt approval voting while keeping the *spirit* of evaluating both bars.  

  **Q: "What if someone approves a grant that fails one bar?"**  
  A: This is a feature, not a bug. It reveals misalignment in how we interpret bars. We should clarify bar definitions (e.g., "What does 'capacity’ mean?") through discussion *before* voting.  

  ---

  ### **Next Steps**  
  1. **Vote on adopting approval voting** at our next meeting.  
  2. **Clarify evaluation standards**: Draft brief guidelines (e.g., "Capacity means X, CE means Y") to align judgments.  
  3. **Pilot for one quarter**: Test approval voting on 1–2 grants, then reassess.  

  This approach honors our EA principles: it’s **consistent, legible, and optimizes for truth-seeking**—not just procedural mechanics. Let’s fix the system, not the symptom.  

  *Appendices*:  
  - [Short primer on doctrinal paradox](https://plato.stanford.edu/entries/discursive-dilemma/)  
  - [EA-aligned arguments for approval voting](https://forum.effectivealtruism.org/posts/hwLZcDgJgBNf3whWF/approval-voting-for-grantmaking)  

