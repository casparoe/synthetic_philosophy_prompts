  so for my philosophy of law class we just spent two weeks on the Hart-Fuller exchange (the 1958 Harvard Law Review papers, positivism vs natural law, the whole "no vehicles in the park" core/penumbra thing) and now, completely by coincidence, I'm the student rep on my university's Grounds & Transportation Policy Committee and we've got a real case that's basically the same problem. Our campus rule says "no motor vehicles on the Quad," written back in the 70s to keep cars and mopeds off the lawn. Dining Services just rolled out a fleet of knee-high autonomous delivery robots that cross the Quad on the paved paths (never the grass, capped at walking speed) to bring food from the union to the library. Grounds staff filed a complaint saying the robots are plainly motor vehicles under the rule's wording and have to be banned like anything else with a motor and wheels; Dining Services says the rule was obviously aimed at things that tear up the lawn or endanger people at speed, the robots do neither, and everyone already lets motorized wheelchairs cross the Quad all the time without anyone treating that as a "vehicle" violation. Some committee members also worry that if we start deciding cases by what the rule was "really for" instead of what it actually says, we loose any predictability and every future gadget (e-scooters, drones, whatever) turns into a fresh fight. I have to draft the short memo the committee votes on next week -- can you write it? Give an actual recommendation (ban, allow, allow with conditions, whatever you think is best) with a timeline, actually use Hart's core/penumbra point and Fuller's purposive reply to do the reasoning instead of just quoting the rule at people, and give whichever side you don't land on a real hearing rather than a strawman.
