answer: |-
  Your experience perfectly captures the painful reality of social choice theory: no voting system is immune to strategic manipulation when stakes are high enough and coordination is possible. What you observed is **not an avoidable defect specific to Ranked-Choice Voting (RCV/Instant Runoff)**; it's a fundamental vulnerability of *any* non-dictatorial voting system under the Gibbard-Satterthwaite theorem. Here's a breakdown:

  1.  **What Happened: "Burying" in RCV:**
      *   The bloc you described employed a classic RCV strategy called **"burying"** or **"bullet voting"** (though bullet voting more strictly means ranking only one). By ranking their *second* most preferred viable candidate (the one they feared) *last*, below a non-viable candidate, they ensured that candidate would be eliminated *before* the non-viable one.
      *   **Why it worked:** RCV eliminates the candidate with the *fewest first-place votes* each round. Ranking a strong candidate last artificially depresses their *first-place* count in the initial rounds. If this pushes them below the "joke" candidate in first-place votes, they get eliminated prematurely. The bloc's votes then flow to their *actual* preferred candidate in the next round.
      *   **Manipulation was Key:** This strategy *only* worked because the bloc *cooperated* and *insincerely* ranked the feared candidate lower than their true preference. They traded off the small risk of the joke candidate winning (which they likely deemed impossible) to eliminate the candidate they strongly disliked.

  2.  **The Universal Problem: Gibbard-Satterthwaite Theorem:**
      *   Your business school friend pointed to Arrow (about aggregating preferences consistently), but the theorem directly relevant to your problem is the **Gibbard-Satterthwaite Theorem**.
      *   **It states:** For any voting system that has at least three possible outcomes and where every possible ranking of candidates is permissible (unrestricted domain), it is *impossible* to design a system that is simultaneously:
          *   **Non-Dictatorial:** No single voter always decides the outcome.
          *   **Strategyproof (Incentive-Compatible):** It's *never* advantageous for any voter to vote insincerely.
      *   **In plain English:** If a voting system isn't dictatorial and has three or more choices, *some* voter, in *some* situation, *can* get a better outcome for themselves by lying about their true preferences. This is precisely what your bloc did. Their coordinated insincere voting ("burying") yielded a better outcome (their preferred candidate winning) than their sincere votes likely would have (the polarizing candidate winning, or potentially the candidate they feared).

  3.  **Every System Has Flaws:**
      *   **RCV:** Vulnerable to burial strategies (like you saw), non-monotonicity (a candidate can lose *because* they got *more* first-place votes), and can fail the Condorcet criterion (beating all others head-to-head).
      *   **Plurality (First-Past-the-Post):** Highly vulnerable to vote-splitting/spoilers (like your first election), encourages strategic desertion of minor candidates, fails Condorcet criterion.
      *   **Borda Count:** Assigns points based on rank (e.g., 1st=3pts, 2nd=2pts, 3rd=1pt). **Highly manipulable!** Voters have a huge incentive to rank strong competitors *last* to hurt them and boost their favorite. Your bloc's strategy would be *even easier* and potentially *more effective* under Borda. It also fails the Condorcet criterion.
      *   **Approval Voting:** Voters select *all* candidates they find acceptable. Simpler, good at finding broadly acceptable winners, reduces vote-splitting. **Manipulation still exists:** Voters must decide *where to draw the line* between "approve" and "not approve." A bloc could strategically *disapprove* a viable candidate they slightly dislike to boost their favorite's chances. It doesn't capture strength of preference well.
      *   **Condorcet Methods:** Find the candidate who beats every other in a head-to-head matchup. Complex to count/manage manually, can result in cycles (A>B, B>C, C>A), vulnerable to strategic ranking manipulation to *create* cycles or break them favorably.

  4.  **Practical Advice for Your Association: Mitigating, Not Eliminating**

      Given the impossibility of a perfect system, focus on *minimizing harm* and *reducing incentives/opportunities for manipulation*:

      *   **Acknowledge the Reality:** Explain to the association that *no* system is perfect or strategy-proof. Transparency about limitations builds realistic expectations. Frame the choice as "which flaws are we most willing to tolerate?"
      *   **Prioritize Simplicity & Understandability:** Complex systems breed distrust and accusations of manipulation (even if unfounded). Residents need to grasp how votes are counted.
      *   **Reduce the Stakes:** Consider term limits for the chair position. Explore splitting responsibilities among a small committee instead of concentrating power in one chair. Lower stakes = less incentive for cutthroat tactics.
      *   **Discourage Bloc Coordination:** While hard to enforce, emphasize that the *spirit* of the election is for individuals to express their sincere preferences. Publicly discussing coordinated strategies undermines community trust. Secret ballots are essential.
      *   **System Choice - Weighing the Options:**
          *   **Sticking with RCV:** It solved your initial vote-splitting problem. While vulnerable to "burying," this requires significant *coordination* (like your dozen voters). Smaller blocs or sincere voting make it less likely. Emphasize the importance of ranking sincerely.
          *   **Approval Voting (Strong Contender):** Highly recommended for your context. It's simple ("vote for all acceptable candidates"), eliminates vote-splitting instantly, and is **significantly harder to manipulate effectively in small elections** like yours. The main strategy ("bullet approval" - approving only your absolute favorite) carries a high risk of helping a disliked candidate win if others approve more broadly. It naturally favors consensus candidates. The counting is trivial.
          *   **Avoid Borda Count:** Its high manipulability makes it a poor choice for a situation where strategic voting has already occurred.
          *   **Avoid Condorcet:** Likely too complex for a building association to administer and explain confidently.
      *   **Transparency & Norms:** Ensure the voting process is transparent, the ballot is clear, and results are reported fully (e.g., in RCV, show the round-by-round elimination counts). Foster a culture where winning gracefully and losing gracefully are valued.

  **Conclusion:**

  You witnessed the Gibbard-Satterthwaite theorem in action: a coordinated group manipulated RCV via insincere ranking ("burying") to achieve a preferred outcome. This isn't a fixable flaw of RCV; it's an inherent limitation of *any* democratic voting system with three or more choices. There is no "fair" system immune to strategy.

  For your association, **Approval Voting** currently offers the best practical balance: it solved the vote-splitting issue that plagued your plurality election, is simple to understand and count, and presents higher barriers to effective coordinated manipulation than RCV or Borda in a small community setting. Combine this with efforts to lower the perceived stakes of the election and promote norms of sincere voting and good sportsmanship. While you can't eliminate the theoretical possibility of manipulation, you can create an environment where it's less likely to succeed or be deemed necessary. Your role is challenging, but your analytical approach is exactly what's needed to navigate this social choice dilemma.
