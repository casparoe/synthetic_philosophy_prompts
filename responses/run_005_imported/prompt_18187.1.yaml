  So I spent my whole career as a nuclear physicist, and only really got properly into philosophy after I retired -- feels a bit like closing the barn door after the horse bolted, given what my old field made possible. Lately I've been reading Elizabeth Anscombe's pamplet against Oxford giving Truman an honorary degree, where she argues Hiroshima and Nagasaki don't even count as a hard case for the doctrine of double effect, because the whole point of the bombs was to kill masses of civilians and terrify Japan into surrendering -- the deaths were the means, not a foreseen side-effect of hitting some legitimate target nearby. She died in Jan 2001, before the whole drone strike / signature-strike era of the war on terror, where a lot of targeting gets done off patterns of behaviour rather than confirmed identities, and civilian deaths get chalked up as regretted-but-unintended fallout of hitting a legitimate target. Working it through with her actual reasoning rather than just a vibe of 'she'd have disapproved', do you reckon she'd have judged that kind of campaign the same way she judged Truman, or is the means/side-effect structure different enough that it would've counted as a genuinely hard case for her?
