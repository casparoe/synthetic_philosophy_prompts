answer: |-
  Your approach is defensible and astute—it captures a crucial nuance in Aquinas's thought. The tension between the two texts reflects not inconsistency in principle but a distinction between **moral permissibility** (established in the *Sentences*) and **prudential advisability** (emphasized in *De Regimine Principum*). Here’s how to frame your argument and address the emphatic language in *De Regimine*:

  ### Core Argument Structure:
  1. **The *Sentences* Establishes the Moral Principle**:  
     Aquinas’s commentary (II *Sent.* d. 44) treats tyranny as a violation of natural law, framing the tyrant as a *hostis publicus* (public enemy). Since the tyrant forfeits legitimacy by undermining the common good, killing him is not murder but a licit act of defense. The agent is a *vindex libertatis* (avenger of liberty) deserving reward. This is a **theoretical moral judgment** grounded in natural law.  

  2. ***De Regimine* Addresses Prudential and Political Realities**:  
     Here, Aquinas shifts focus to **practical governance**. His warnings against "private presumption" are not a retraction but a recognition that:  
     - Private action risks chaos (e.g., failed attempts triggering worse repression).  
     - Legitimacy requires procedural justice: only public authority (e.g., representatives, nobles acting *as a body*) can licitly *authorize* removal to avoid anarchy.  
     - This is **prudence**, not morality: he concedes that tyrannicide *can* be justified (I.6: "if to provide for the common good it is indeed just to kill a tyrant") but stresses that reckless attempts often backfire.  

  ### How to Handle the Emphatic Language in *De Regimine*:
  - **Contextualize the Rhetoric**:  
    Aquinas’s harsh tone ("private presumption," "rashness") targets *imprudent* action, not the *moral permissibility* itself. He fears vigilante chaos, not principled resistance. Note his concession: he never says private tyrannicide is *intrinsically evil*—only that it is dangerously prone to abuse.  

  - **Distinguish "Private" vs. "Public" Authority**:  
    Argue that Aquinas’s *Sentences* view assumes the tyrant has *already been judged* an enemy of the common good (a "public" verdict implicit in his tyranny). *De Regimine* clarifies that *executing* this judgment ideally requires institutional safeguards. The "private citizen" he condemns is one acting *without communal mandate*, not one defending the community *as its last resort*.  

  - **Leverage Aquinas’s Own Exceptions**:  
    In *De Regimine* (I.6), Aquinas leaves a door open: if no public authority can act, and the tyrant’s oppression is intolerable, he implies necessity may override prudence. Cite his example of the Old Testament’s Ehud (Judges 3), a private individual praised for killing a tyrant—showing his prudential warnings aren’t absolute.  

  - **Reconcile Through Natural Law**:  
    Unify both texts under Aquinas’s hierarchy of law:  
    - The *Sentences* affirms natural law: tyranny voids the ruler’s claim to obedience.  
    - *De Regimine* emphasizes human law’s role in *ordering* licit resistance to preserve social stability.  
    **Your thesis**: The later text operationalizes the earlier principle within a framework of ordered liberty.  

  ### Key Evidence for Your Paper:
  - ***Sentences* Passage**:  
    > "Tyrannus enim est qui violenta dominatione populum premit […] et ideo occidere eum non est illicitum, sed laudabile et rectum" (*In II Sent.*, d. 44, q. 2, a. 2).  
    *(A tyrant rules by violent oppression […] thus to kill him is not illicit but praiseworthy and right.)*  

  - ***De Regimine* Nuances**:  
    > "Non autem est ex prima intentione multitudinis instituentis regem ut in tyrannidem convertatur" (I.6).  
    *(The multitude does not initially appoint a king so that he may become a tyrant.)*  
    → This implies the community retains latent authority to depose him.  

    > "Si vero non sit ad quem recurratur contra tyrannum, recurritur ad Deum […] *sed non est cuiuslibet*" (I.6).  
    *(If there is no recourse against a tyrant, we appeal to God […] *but this is not for just anyone*.)*  
    → He acknowledges divine justice over tyrants but cautions against individual rashness.  

  ### Why Your Thesis Works:
  - **Scholarly Support**: Brian Tierney, J.H. Burns, and Harro Höpfl argue that later scholastics like Mariana *did* extrapolate from Aquinas’s core principles. *De Regimine*’s caution reflects its genre (advice to kings), not a doctrinal U-turn.  
  - **Philosophical Consistency**: Aquinas’s ethics prioritize intentionality and circumstances. The *Sentences* establishes the act’s *object* (killing a tyrant) as licit; *De Regimine* evaluates *circumstances* (risk, authority, consequences).  
  - **Historical Context**: The *Sentences* (1250s) targets academic debates; *De Regimine* (1260s) advises the King of Cyprus amid real political fragility—explaining its risk-averse tone.  

  ### Potential Counterargument & Rebuttal:
  - **Counter**: "Aquinas calls private tyrannicide 'presumption' and stresses public authority. How is this not a contradiction?"  
    **Rebuttal**: Presumption arises when individuals *usurp* a community’s rightful role. The *Sentences* position assumes the killer acts *as an agent of justice* (implied by "frees his country"), not a lone avenger. *De Regimine*’s emphasis on procedure safeguards this communal dimension.  

  ### Conclusion for Your Paper:
  > "Aquinas’s *Sentences* establishes tyrannicide as morally permissible under natural law when a ruler becomes a *hostis publicus*. *De Regimine Principum*, far from reversing this, layers on prudential and political caveats to prevent vigilante chaos and preserve the common good. The later text’s vehement warnings target not the *principle* of resistance, but the *anarchic misapplication* of that principle. Mariana’s 'innovation' was thus to extend Aquinas’s core ethics into an era where institutional checks had collapsed."  

  This framework honors both texts while showing how Aquinas’s ethics bridge theory and practice—a strength, not a contradiction.
