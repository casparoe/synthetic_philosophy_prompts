  ## Dialogue: Coffee and Conceptions

  **Setting:** A quiet corner of a campus coffee shop. Rain streaks the windows. Dana stirs her latte, Priya sips black coffee. The unresolved debate hangs in the air.

  **Priya:** Dana, I’ve been replaying our conversation. That ‘bite the bullet’ position... it feels like it hollows out the concept of parental responsibility entirely in cases like our friend’s. You’re saying that *deliberately* choosing a path where you know one outcome is a child born with a severe, lifelong illness like CF – suffering that’s wholly avoidable with available technology – isn’t wronging *that child*?

  **Dana:** It feels counterintuitive, Priya, I grant you that. It *feels* wrong. But Boonin’s point, and Parfit’s before him, is structurally sound. To wrong *that specific child*, you have to make *that child* worse off than they otherwise would have been. But what’s the alternative for *that child*? If they do IVF with PGD, the embryo that becomes *that child* with CF *never exists*. The alternative isn’t *that child* without CF; it’s a *different*, healthy child. So, *that child* with CF isn’t worse off than they would have been if PGD was chosen – because if PGD was chosen, they wouldn’t *be*. They only exist in the scenario where they have CF. Choosing natural conception doesn’t make *this particular child* worse off; it’s the condition for their existence.

  **Priya:** But Dana, that reduces harm to purely *comparative welfare for a specific identity*. Elizabeth Harman argues compellingly that we can wrong someone by *causing them to suffer a serious harm*, period, regardless of whether an alternative existence was possible for *them*. Seana Shiffrin adds the dimension of consent. We impose a profound, avoidable burden – the pain, the treatments, the shortened lifespan of CF – onto a person who never had a say in their own creation. Isn’t *that imposition itself* the wrong, independent of whether we could have created someone else who was better off?

  **Dana:** Okay, let’s test the boundaries of that non-comparative harm principle. Suppose a couple decides to have a child naturally *knowing* there’s a 25% chance of CF, and the child *is* born with CF. According to you, they wronged the child by imposing avoidable suffering. Now, consider a different couple: they *don’t* carry CF genes. They conceive naturally, and their child is born healthy but later develops, say, a severe peanut allergy – also a serious burden, also unavoidable *for that child* once conceived naturally. Did *they* wrong their child? They didn’t impose a *genetic* burden, but the burden is just as real and unavoidable for that child. If your principle is just "imposing serious unavoidable suffering = wronging the child," then *all* parents wrong their children, because life inevitably involves suffering no parent can fully shield them from.

  **Priya:** (Leans forward, pensive) That’s a fair push. I need to refine. Shiffrin’s consent framework helps here. The wrong isn't *just* the suffering; it's the *deliberate creation* of a situation where severe suffering *that could have been prevented at the point of creation* is inflicted. The peanut allergy wasn’t foreseeable or preventable *at conception* for that couple. The burden wasn’t *chosen*. For our CF carriers, the *specific, severe burden* of CF *was* foreseeable, known to be highly probable (25% per child!), and *could have been prevented* by choosing a different reproductive path (PGD) *at the point of creation*. The wrong lies in the *deliberate* creation of a person *when you know, at the moment of choosing how to create them, that you are likely condemning them to severe, avoidable suffering*. It’s the *agency* and *foreseeability* combined with the severity of the burden.

  **Dana:** (Nods slowly) Alright, I see the distinction you’re drawing: foreseeable & preventable *at creation* vs. unforeseeable or unpreventable suffering. But here’s my deeper worry: Doesn’t this *still* risk condemning almost all procreation? Suppose a couple *could* wait 5 years, become vastly wealthier, *then* have a child who would have a materially much better life, free from certain hardships the child born now would face. By having the child *now*, they knowingly impose avoidable burdens – relative poverty, maybe worse schools, more stress – burdens foreseeable and preventable by waiting for a "better-off" child. Does your principle say they wrong the child born now by not waiting for the potentially better-off one? That seems absurd. We don’t think parents *owe* it to their future children to create the *best possible* child.

  **Priya:** (Sighs) Another good point. This is where the *severity* and *kind* of burden matters immensely. Shiffrin talks about burdens that are "intrinsically inimical to a decent human life" or severely compromise fundamental capacities. CF, with its chronic pain, lung deterioration, shortened lifespan, and demanding treatments, arguably crosses that threshold. Relative poverty or slightly worse schools, while burdensome, generally don’t. The threshold is high: it’s not about minor disadvantages or failing to create the *optimal* child. It’s about *knowingly creating a child who will very likely suffer a severe, debilitating, and largely unavoidable illness* when a simple alternative (PGD) exists to create a different child who won’t have that *specific, crushing burden*. It’s about *this particular, severe harm* being *directly chosen* via the method of conception.

  **Dana:** (Takes a long sip, thinking) Okay, I’m starting to see the contours of your position better. You’re emphasizing: 1. **Severity Threshold:** Only burdens like severe genetic disease qualify, not comparative life disadvantages. 2. **Direct Link to Creation Method:** The harm must be inextricably linked to the *chosen method* of conception itself (natural conception with known high genetic risk). 3. **Avoidability via Alternative Path:** A viable alternative path (PGD) exists that avoids *that specific severe burden* for *a* child, even if it’s a different child. So, it’s not wronging the *specific identity* (I still hold that’s conceptually impossible here), but it’s a profound moral failure *in the act of creation itself* to choose a path that knowingly manufactures severe suffering.

  **Priya:** Exactly. It’s an *impersonal* wrong committed *in bringing a person into existence under those burdensome conditions*, rather than a wrong *to that specific person* in the comparative sense. We wrong *by creating suffering persons* when we could have created non-suffering persons, given the specific, severe nature of the suffering and its direct link to our reproductive choice. The moral failure attaches to the *decision*, not to the comparative state of the resulting person. That child with CF *is* harmed – grievously – by the disease we knowingly risked imposing. The non-identity problem shows we didn't make *them* *worse off*, but we *did* create *a harmed person* when we could have created an unharmed one.

  **Dana:** (Leans back) Hmm. I’m not fully abandoning the comparative framework – I think it still accurately captures why we *can’t* say the *child with CF* would have been better off if PGD was chosen. But... I’ll concede that your non-comparative, impersonal perspective provides a powerful and, frankly, more intuitively satisfying account of the *moral weight* of the parents' choice. It captures the sense of responsibility for *creating avoidable suffering* that the comparative view dismisses too easily. It avoids the absurdity of excusing *any* imposition of suffering as long as it's "identity-affecting," while also avoiding condemning all non-optimal procreation by focusing on truly severe, preventable burdens linked to the creation act. It makes sense of the *special responsibility* genetic knowledge imposes.

  **Priya:** And I’ll concede that the comparative view exposes a crucial logical constraint: we can’t coherently say we harmed *that particular child* by not choosing PGD. The harm isn’t *relational to their alternative existence*; it’s intrinsic to the conditions of their existence, which we knowingly chose. So, perhaps we refine: Choosing natural conception in this high-risk scenario is a serious moral wrong *because it knowingly creates a person likely to suffer severe, avoidable harm*. It’s wrong *to bring someone into existence under those burdens*, not wrong *to that person* in the sense of worsening *their* lot.

  **Dana:** (Smiles faintly) So, we end not with a draw, but with a messy, qualified synthesis? The non-identity problem blocks the claim of wronging *that specific child* in the comparative sense, but a strong non-comparative view grounded in avoiding the deliberate creation of severe suffering captures the core moral failure of the choice itself.

  **Priya:** (Raises her coffee cup) A messy, qualified synthesis born of mutual refinement. Just like... well, perhaps not *just* like the choices we were debating. But yes. I think our friend has two sharp, but ultimately compatible, perspectives to weigh now. The logic bites the bullet; the moral intuition demands responsibility for creating suffering.

  **Dana:** (Clinks her mug against Priya’s) Agreed. Now, about that Kant reading for next week…
