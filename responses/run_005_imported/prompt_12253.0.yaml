answer: |-
  You've zeroed in on the *exact* pressure point where Shoemaker's elegant subset strategy risks buckling under multiple realizability. The core challenge is this: **If the causal powers of a multiply realizable mental property M must be a *proper subset* of the causal powers of *each and every* vastly different physical realizer P1, P2, P3..., how do we specify *which* subset constitutes M without functionally defining M, thereby collapsing the view?** Let's tackle this rigorously, dissecting Shoemaker's resources and defending against the collapse.

  **1. The Threat Stated Forcefully:**

  *   **Premise 1 (Subsets & Multiple Realizability):** For M to be multiply realizable, its causal powers must be identical (or near-identical) across all realizers (e.g., human pain, octopus pain, AI pain share causal powers like causing avoidance, distress signals, learning).
  *   **Premise 2 (Distinct Realizers):** Physical realizers P1 (human neurochemistry), P2 (octopus neurophysiology), P3 (silicon circuit) possess vastly different *total* causal powers (P_total).
  *   **Premise 3 (Subset Requirement):** M's causal powers (C_M) must be a proper subset of P1_total, *and* a proper subset of P2_total, *and* a proper subset of P3_total.
  *   **Problem:** For C_M to be the *same* subset across P1, P2, P3, which are radically different, C_M must be specifiable *independently* of the idiosyncratic details of P1, P2, or P3. It must pick out a *common core*.
  *   **The Functionalist Slippery Slope:** The only apparent way to specify this common core C_M across diverse realizers is by its *functional role* – the inputs it responds to, the outputs it produces, and its relations to other states. This seems to *define* M functionally. If C_M *is* defined by this role, then citing M *is* citing that functional role, making Shoemaker's "subset" move just a redescription of standard functionalism, not a distinct solution to exclusion. Alternatively, if we insist C_M isn't functionally defined, it seems arbitrary or impossible to identify the *same* subset across wildly different P_total sets.

  **2. Shoemaker's Defense: Powers Individuation & Realization-Relative Subsets**

  Shoemaker has resources to resist this collapse. His core move is to ground the subset relation in the *metaphysics of properties and realization itself*, not in a prior functional definition:

  *   **a. Properties are Individuated by Causal Powers:** For Shoemaker, a property *just is* the set of causal powers it contributes to its bearers. What makes property M the property it is *is* its specific set of causal powers (C_M). This is fundamental.
  *   **b. Realization as Causal Power Subsumption:** Property M is realized by property P iff the causal powers conferred by M are a *subset* of the causal powers conferred by P. This is the *definition* of realization for Shoemaker. P "includes" M's powers.
  *   **c. The Subset is Fixed by M, Not Functionally Defined:** Crucially, C_M is fixed *by what M is*. We don't *define* M by its functional role *first* and then find its powers; M *is* its powers. When we discover that different physical properties P1, P2, P3 *each* have a subset of their total powers that *is identical to C_M*, that *is* what it means for them to realize M. M's identity is prior.
  *   **d. Multiple Realizability Explained by Overlapping Power Subsets:** Multiple realizability occurs precisely when distinct physical properties P1 and P2 have *overlapping* subsets of their total causal powers, and *that overlapping subset is C_M*. P1_total and P2_total are different, but they *share* the subset C_M. It's not that C_M is defined *by* the overlap; the overlap *is* C_M because that's what M *is*.

  **3. Addressing the "Functionalist Specification" Worry Directly:**

  This is where the objection bites hardest. How do we *know* or *specify* what C_M is *without* talking functionally?

  *   **The Epistemic vs. Metaphysical Distinction:**
      *   *Metaphysically:* C_M exists as the essential nature of M. Its identity is intrinsic to M, not derived from functional role. When P realizes M, P's powers *include* C_M *because* M is instantiated by virtue of P being instantiated.
      *   *Epistemically:* Yes, *we humans* identify and talk about mental properties like *pain* or *belief* primarily through their characteristic functional roles – what they cause (avoidance, assertions) and what causes them (damage, evidence). This is how we *pick out* the property in the world.
      *   **The Crucial Point:** This epistemic reliance on functional *characterization* does *not* mean that the property *M* is *metaphysically constituted* by that functional role. We use the functional role to *refer* to the property, but the property itself is individuated by its causal powers (C_M), which are realized by the physical property's subset. Shoemaker distinguishes *how we identify properties* from *what properties are*.
  *   **Specifying C_M Non-Arbitrarily:** C_M is not an arbitrary collection of powers plucked from P_total. It is the *essential causal contribution* that constitutes the property M. For *pain*, C_M includes powers like *tending to cause withdrawal from the source, causing aversive learning, causing distress vocalizations (in species that have them)*. These powers are *causally interrelated* and constitute the *nature* of pain. Different realizers P1, P2, P3 *each* have a subset of their powers that *is exactly this set* (or a very similar set – see point 4 below). We specify C_M by specifying *the causal powers essential to being pain*, not by specifying a functional role *within a system* that pain must occupy. The powers *are* the role, but the role isn't prior; it's constitutive.

  **4. Handling Variation: Near-Enough Subsets & Determinables**

  *   **Not Strict Identity, but Sufficient Similarity:** Shoemaker (especially in later work) acknowledges that realizers of the same mental property across vastly different systems might confer *slightly different* subsets of powers. Octopus pain might not cause *exactly* the same vocalizations as human pain (lacking vocal cords), but it causes functionally analogous avoidance/distress behaviors. The subsets C_M1 (human pain powers), C_M2 (octopus pain powers), C_M3 (AI pain powers) are *sufficiently similar* in their core causal contributions (e.g., causing avoidance of harm, influencing learning negatively) to count as realizing the *same type* M. This avoids requiring absolute identity of powers across all possible realizers, which is implausible.
  *   **The Determinable Strategy:** Shoemaker can appeal to properties at different levels of determinacy. *Pain* might be a determinable property. Its different realizers (human neurochemical state P1, octopus state P2, etc.) are determinates *of* that determinable. What defines the determinable *pain* is that its determinates *each* confer a core set of causal powers (C_M) – powers to cause harm-avoidance, distress, etc., in ways appropriate to the system. The subset relation holds between the powers of the *determinable* M and the powers of *each determinate* realizer P_i. The determinable's powers are the *common core* abstracted from the powers of its determinates. This core is fixed by the nature of the determinable property itself, not by a functional role external to it.

  **5. Why This Isn't (Strict) Type Identity or Standard Functionalism:**

  *   **Not Type Identity:** Different physical types (P1, P2, P3) realize the *same* mental type M. M is not identical to P1, P2, or P3. The *only* identity is that M = C_M (its causal powers). P1 has C_M *plus* other powers (P1_total - C_M). P2 has C_M *plus* a *different* set of other powers (P2_total - C_M). M is multiply realizable because different physical properties can include the *same* set of causal powers C_M within their distinct total sets.
  *   **Not Standard Functionalism:** Standard functionalism defines a mental state *solely* by its relations to inputs, outputs, and other states within a functional economy. The state is a "role filler." Shoemaker's view is *richer*:
      *   **Metaphysical Primacy of Powers:** For Shoemaker, the causal powers *are* the property. Functionalism typically treats the role as primary and the occupant as secondary (or even non-essential).
      *   **"Thick" Properties:** M is a genuine, causally efficacious property in its own right, identical to C_M. Standard functionalism is often seen as ontologically thinner, making the mental state *nothing but* a node in a causal network.
      *   **The Subset Relation Itself:** Shoemaker's core solution to exclusion – that M's powers are a *subset* of P's powers, making M's causation *non-competitive* with P's – is a distinct *metaphysical* claim about realization that isn't inherent in standard functionalism. A functionalist still faces the exclusion problem head-on (Why isn't the functional role causally excluded by the physical realizer filling it?). Shoemaker's subset relation *is* his answer to exclusion.

  **Conclusion: Survival, Not Collapse**

  Shoemaker's strategy survives the multiple realizability challenge by grounding the identity of the mental property M directly in its causal powers (C_M). The requirement that C_M be a subset of each realizer P_i's total powers is the *definition* of realization. While *we* epistemically identify M via its functional profile, M is metaphysically constituted by C_M, not defined by a functional role within a system. Different realizers P1, P2, P3 realize M because each possesses a subset of its powers that *is* C_M (or a sufficiently similar core set). This allows genuine multiple realizability without reducing M to a functional role description or collapsing into type-identity.

  The "subset" move remains distinct from standard functionalism because it provides a specific *metaphysical account of realization* (subset inclusion of powers) that directly addresses Kim's exclusion worry by making mental causation a *part* of physical causation, not a competitor. While functional characterization is our primary *access route* to mental properties, Shoemaker argues that their *causal efficacy* and *non-arbitrary subset identity* across realizers is secured by the metaphysics of properties as clusters of causal powers. It's a robust, non-reductive physicalism that takes both mental causation and multiple realizability seriously. Your nagging doubt highlights the tension, but Shoemaker's framework provides the tools to resolve it without collapse.
