  The user mentions examples like human brains, octopus nervous systems, and silicon systems. They want a rigorous defense that Shoemaker's approach doesn't fall back on functionalism. I should check Shoemaker's original arguments, especially his later works where he addresses realization and properties.

  Shoemaker distinguishes between core and total realizers. Core realizers are the minimal physical properties that suffice for the mental property. Total realizers include everything in the physical system. The causal powers of the mental property come from the core realizer. But multiple realizability means different cores for the same mental property. So the subset of powers must be common across different cores. How?

  Shoemaker uses forward-looking causal powers (what the property can cause) and backward-looking ones (what can cause it). For a mental property, the powers are tied to inputs and outputs. But that sounds functional. The challenge is to show that this isn't just functionalism. 

  The user might be conflating two issues: specifying the powers abstractly versus metaphysically grounding them. Shoemaker's properties are individuated by their powers, so the subset is metaphysically tied to the property, not defined functionally. But the user's concern is that in practice, identifying the subset requires functional definitions. 

  I need to argue that Shoemaker's view is a form of non-reductive physicalism where properties are causal. The subset relation avoids overdetermination by ensuring the mental isn't an additional cause. For multiple realizability, the common powers are those essential to the mental property, abstractly described, but grounded in each realizer's physical powers. 

  But how abstract? For pain, it's the power to cause withdrawal, distress signals, etc. Different realizers share these powers via different physical mechanisms. The subset is the same at a high level of abstraction. The user might see this as functionalism. However, Shoemaker insists that the property is defined by its powers, not by functional role. 

  The key is that functionalism defines mental states by causal roles, while Shoemaker's properties are intrinsic, though realized physically. The subset strategy focuses on the causal profile being a subset, not the role in a system. But the user might not find this distinction convincing. 

  I should address whether specifying powers without functional language is possible. Shoemaker would say powers can be specified by their effects, but that's necessary for any causal theory. The difference is that for functionalism, the role defines the state, whereas for Shoemaker, the powers constitute the property. 

  Also, the user worries about sneaking in type-identity. But Shoemaker avoids this because different physical properties realize the same mental property by having overlapping subsets of powers. The mental property is not identical to any single physical type. 

  The user's deeper need is to preserve mental causation without overdetermination or reduction. They want a robust non-reductive solution. Shoemaker offers that by making mental causation a part of physical causation. The multiple realizability concern is valid, but the subset strategy can handle it by allowing that the same set of causal powers can be instantiated differently across realizers. 

  I should emphasize that the subset is specified by the mental property's essential effects, not by a functional role. For example, pain's power to cause avoidance is the same across species, even if the physical mechanisms differ. The subset is the same causal contribution, making it non-arbitrary. 

