  Ok this is a weird one but I'm hoping you can help me sanity check some philosophy for my novel. I've got a scene where an aging, arrogant philosopher of science corners a young biologist at a faculty dinner and goes off about how evolution by natural selection isn't "real science." Hes loosely modeled on Karl Popper. Here's roughly what I have him saying so far:

  "Ask a Darwinian what makes an organism 'fit' and the honest answer is: it survived and left offspring. So 'survival of the fittest' really just means 'survival of the survivors' — it explains nothing, it just labels the outcome after the fact. Thats why I'd never call it a proper scientific theory, testable the way relativity is testable. It's more of a metaphysical scaffolding you hang real, falsifiable theories on — useful, maybe even indispensable, but not itself science."

  I want him arguing in good faith, not spouting a strawman, so before I go further, can you check the substance against what Popper actually said? Two things specifically: is the tautology complaint and the "metaphysical scaffolding" bit a fair rendering of his real position, and — this is the part I'm shaky on — I have this nagging memory that he backed off some of this later in life, maybe even called it a mistake, but I can't remember the details and don't want to quietly cut that if it's actually the more interesting part of the story. Also, separately, tell me straight: does this read like an actual crank genius talking, or like a Wikipedia stub wearing a lab coat?
