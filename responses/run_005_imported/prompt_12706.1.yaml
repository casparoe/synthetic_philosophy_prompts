answer: |-
  This is brilliant novel fodder – and you've nailed the *core* of Popper's early critique remarkably well. Let's break it down:

  1.  **The Tautology Complaint:** **Spot on.** This was Popper's *central* criticism of natural selection for decades. He argued that defining "fitness" solely by survival/reproduction made "survival of the fittest" a tautology (A = A) – it explained nothing because it couldn't predict *which* traits would lead to survival *before* the fact. It merely described the outcome. Your character's phrasing ("survival of the survivors") is essentially verbatim Popper. (Sources: Numerous essays, including "Darwinism as a Metaphysical Research Programme" and discussions in "Objective Knowledge").

  2.  **The "Metaphysical Scaffolding" Bit:** **Also accurate and a perfect Popperian phrase.** Popper explicitly called Darwinism (specifically natural selection) a **"metaphysical research programme"** – *exactly* the "metaphysical scaffolding" your character describes. He argued it wasn't falsifiable *itself* (because you could always explain *any* outcome with *some* post-hoc story about fitness), but it was incredibly fertile ground for generating *specific, falsifiable* theories (e.g., about specific adaptations, speciation mechanisms, phylogenetic relationships). He saw it as a powerful framework, indispensable for biology, but not scientific in the same way as, say, Newtonian mechanics or Relativity. (Source: Primarily "Unended Quest" and the essay mentioned above).

  3.  **The Backing Off / Calling it a Mistake:** **YES, THIS IS CRUCIAL AND FASCINATING.** Your memory is correct. Popper significantly modified his view, particularly in response to developments in genetics and evolutionary biology. Around **1978** (notably in his "Intellectual Autobiography" within "The Philosophy of Karl Popper" and later in revised prefaces/reprints), he publicly stated:
      *   **He had been "severely mistaken"** about the testability of natural selection.
      *   He recognized that **specific predictions *could* be derived** from the theory (e.g., predicting the existence of certain transitional forms in specific geological strata, predicting genetic drift patterns, predicting outcomes of artificial selection experiments).
      *   He acknowledged that **"survival of the fittest" *isn't* a tautology** *if* "fitness" is defined *independently* of mere survival – e.g., through measurable traits like speed, camouflage, metabolic efficiency, fecundity under controlled conditions *before* the survival test. Modern evolutionary biology defines fitness operationally in these ways.
      *   He **reaffirmed natural selection as testable science**, while still seeing it as a broad framework generating specific hypotheses.

      **Why this is the *more interesting part* for your novel:**
      *   **Intellectual Honesty (or Lack Thereof?):** Does your aging philosopher *know* Popper changed his mind? If he does and ignores it, that shows arrogance/dogma. If he doesn't, it shows he's intellectually stagnant, frozen in time – a powerful character flaw for an aging academic. Either way, it adds layers.
      *   **Dramatic Potential:** The young biologist could *know* about Popper's retraction and use it as a devastating rebuttal: *"Even Popper himself admitted he was wrong about that, Professor..."* This instantly puts the arrogant philosopher on the back foot.
      *   **Nuance:** It shows the evolution (pun intended) of philosophy of science itself, reflecting how science informs philosophy. Ignoring this nuance makes the philosopher seem more like a fossil.

  4.  **Does it sound like a crank genius or Wikipedia in a lab coat?**
      *   **Strengths (Crank Genius Vibes):**
          *   The core argument is distilled perfectly – tautology and metaphysical framework. It's sharp, provocative, and captures Popper's essence.
          *   The dismissive tone ("I'd never call it a proper scientific theory") feels authentic for an arrogant intellectual.
          *   The comparison to Relativity is classic Popperian framing (falsifiability as the gold standard).
      *   **Weaknesses (Risk of Wikipedia Stub):**
          *   It's *very* condensed. A real Popperian crank would likely use more jargon: "falsifiability," "demarcation problem," "metaphysical research programme," "ad hoc hypotheses," "immunizing stratagems."
          *   He might elaborate slightly on *why* Relativity is testable (e.g., predicting light bending, gravitational redshift) vs. the *perceived* unfalsifiability of natural selection.
          *   The phrasing is extremely clean. A real arrogant academic, especially slightly inebriated at a dinner, might be more discursive, use rhetorical flourishes, or pepper it with condescending asides ("As any first-year student of the philosophy of science knows...").

  **Suggestions for Enhancement (Crank Genius Upgrade):**

  1.  **Inject Popperian Jargon:** "It fails the demarcation criterion, my dear chap! Utterly unfalsifiable! A metaphysical research programme, fertile perhaps, but not science *proper*."
  2.  **Sharpen the Relativity Contrast:** "...testable the way relativity is – make a prediction about starlight bending near the sun, Eddington observes it during the eclipse, *boom*, confirmation. Or refutation! What's the equivalent *risky prediction* from 'survival of the fittest'? None! Just endless *post hoc* storytelling."
  3.  **Hint at Stagnation (Using the Retraction):** Have him dismiss the later developments: "Oh, I've heard the apologists bleat about genetics and 'independent measures' of fitness. Word games! Redefinitions to save the theory! The core tautology remains untouched!" (This shows he knows Popper backtracked but contemptuously rejects the revision).
  4.  **Add a Condescending Aside:** "...useful, perhaps even indispensable for organizing biological data, I grant you that much – like Linnaean taxonomy – but don't confuse your useful filing system with fundamental scientific *explanation*."
  5.  **Make the Biologist's Rebuttal Leverage the Retraction:** The young biologist could respond calmly: "With respect, Professor, even Sir Karl came to see that view as a mistake. He acknowledged that specific predictions *about* selection pressures, rates of change, and genetic outcomes *are* testable and falsifiable. Defining fitness operationally through measurable traits *before* survival isn't circular; it's how we design experiments."

  **Conclusion:**

  Your draft is **excellent** on substance for Popper's *early* position. The tautology and metaphysical scaffolding points are precisely correct. **However, the most compelling dramatic and philosophical hook is Popper's later retraction.** Incorporating awareness of this (either through the philosopher's dismissive knowledge of it or the biologist's use of it as a rebuttal) adds immense depth, historical accuracy, and tension. It transforms the scene from a recitation of an old argument into a clash about intellectual rigidity, the progress of science, and the humility (or lack thereof) required of thinkers.

  **Tweak the language slightly towards more Popperian jargon and condescension, and let the shadow of Popper's changed mind hang over the scene.** You've got the foundation for a fantastic, authentic, and thought-provoking encounter. Good luck!
