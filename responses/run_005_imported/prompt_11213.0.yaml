answer: |-
  Here is a substantive dialogue between W.V. Quine (QV) and a Cornell-style naturalist moral realist (NR), designed to engage their core arguments without forced resolution. The dialogue locates the fundamental disagreement in the *nature of empirical constraints* and the *threshold for ontological commitment* within Quine's empiricist framework.

  **Setting:** A spartan office lined with logic texts and anthropological field reports. Coffee steams between them.

  **NR:** Professor Quine, thank you for this discussion. My concern stems from profound admiration for your naturalized epistemology. You showed how knowledge-claims, however theoretical, are ultimately answerable to sensory input – not directly, but holistically, through their role in a web of belief tested at the periphery by prediction and observation. Yet when we turn to ethics, you deny moral values this same holistic, naturalistic treatment. You argue they lack "observation sentences" – stimulus-triggered, intersubjective verdicts anchoring them to experience. Doesn’t this asymmetry violate your own holism from "Two Dogmas"?

  **QV:** Admiration is mutual, though I suspect we part ways soon! Let’s be clear. Holism teaches that individual sentences aren’t tested in isolation. *Yes.* But the *entire web* must be anchored, however indirectly, to the sensory periphery. Epistemology naturalized shows *how* this happens: through conditioning to observation sentences. "Red here now!" commands immediate, intersubjective assent upon shared stimuli. This sensory input is the tribunal. Theoretical posits like electrons earn their keep by contributing to systems that successfully predict such observation sentences.

  **NR:** Precisely. Now, consider moral discourse. Take "That act caused unnecessary suffering." While not triggered by a *single* sense-datum like "red," isn't it responsive to patterns in the *holistic periphery of human practice*? Suffering manifests in observable behaviors: screams, withdrawal, physiological stress. Cooperation shows in shared labor, reciprocal exchanges. The stability of communities is measured in observable phenomena: low violence, functional institutions, sustainable resource use. Moral verdicts are tested *holistically* against this complex empirical periphery. We posit "wrongness" or "justice" because they help systematize, predict, and navigate this observable terrain – just like electrons systematize pointer-readings.

  **QV:** The analogy limps. Crucially, observation sentences have **stimulus meaning**: a fairly stable, intersubjective correlation between a specific range of sensory stimuli (patterns of light, sound) and the speaker’s assent or dissent. "Red here now" is keyed directly to retinal irradiations. Now, point me to a class of moral sentences commanding comparable *stimulus-triggered, intersubjective agreement* across competent speakers. Consider "That act is cruel." What specific sensory input *invariably* triggers assent? One observer sees a necessary veterinary procedure; another sees torture. The stimulus doesn’t determine the verdict; background theory – values, beliefs about intentions, consequences – does. There’s no *stimulus synonymy* for moral terms.

  **NR:** But isn't the requirement of *direct* stimulus meaning too stringent? Even in science, many observation sentences aren't pure. "That's copper" depends on background knowledge of tests and properties. Stimulus meanings for "red" vary slightly at the margins (is burgundy red?). We tolerate this conventionality because the term earns its keep within the larger system. Why demand stricter purity for ethics? Moral terms like "cruel" might have *fuzzy* stimulus conditions tied to observable distress behaviors, but their core reference is stabilized by their role in a theory explaining and predicting observable social phenomena – suffering, conflict resolution, group flourishing. The "stimulus" for ethical theorizing isn't a momentary irradiation, but a pattern of human interactions over time.

  **QV:** The difference is one of degree hardening into kind. Perceptual consensus on "red" or "rabbit" is remarkably robust across cultures, modulo marginal fuzziness. This robustness underwrites the intersubjectivity of science. Moral consensus? Radically fragile. Anthropological evidence abounds: headhunting, infanticide, polygamy – practices deemed obligatory in one society, abhorrent in another, all amidst comparable sensory inputs. This profound divergence suggests no shared *empirical tribunal* is governing moral verdicts. The "patterns" you cite – suffering, cooperation – are interpreted through thick cultural lenses. What one sees as noble sacrifice, another sees as oppression. The stimuli don’t anchor the meanings; the meanings color the stimuli.

  **NR:** I grant cross-cultural moral variation is greater than perceptual variation. But doesn't your holism predict this? Moral claims sit deeper in the web, further from the sensory periphery, hence more sensitive to changes in auxiliary hypotheses. Consider Boyd's "homeostatic property cluster" theory of moral kinds. "Justice" might not have a Platonic essence, but it refers to a *natural* cluster of properties – fair distribution, impartial procedures, reciprocity – that co-occur reliably because they contribute to the *observable* homeostasis of societies (stability, productivity, low internal conflict). Different environments (scarce resources vs. abundance) or beliefs (about personhood, causality) lead societies to weight these properties differently, explaining variation. But the core functional role – tying "justice" to observable social outcomes – remains empirically constrained.

  **QV:** You invoke "observable social outcomes," but what makes an outcome "good" or "stable"? Isn't that already a *moral* evaluation smuggled in? A tyrannical regime can be stable. A society can be highly productive based on observable exploitation. Your "homeostasis" needs a normative gloss. Science avoids this: we agree on what counts as a successful prediction (e.g., the voltmeter needle hits 5) without smuggling in values. The empirical check is value-neutral.

  **NR:** Not entirely value-neutral! Choosing which predictions matter, which theories are simpler or more fruitful, involves epistemic values. But grant your point. However, the naturalist argues that *moral* value terms like "flourishing" or "harm" *can* be given naturalistic, empirical content. Neuroscience studies pain; sociology studies trust and cooperation breakdowns; game theory models fairness equilibria. We build a theory where "wrong" = "tends to cause avoidable suffering or undermine necessary social cooperation," and *these* variables are observable. We then test this theory holistically: Does positing "wrongness" help us better explain and predict observable patterns of conflict, social collapse, or successful cooperation? Isn't this analogous to positing electrons to explain tracks in cloud chambers?

  **QV:** The analogy stumbles on causation and explanation. Positing electrons genuinely *causally explains* why the vapor condensed along that path. The electron is part of the causal chain leading to the observation. Now, does positing "moral wrongness" *causally explain* any observation in a way irreducible to the natural facts? Gilbert Harman pressed this. I see a child setting a cat on fire. I judge "That's wrong!" Does the *wrongness* cause my judgment? Or is my judgment fully explained by my psychological aversion (conditioned by evolution and culture), my beliefs about pain, and the observable flames and screams? The "moral property" seems explanatorily redundant. Science posits entities that earn their keep by *causing* or being necessary to explain the sensory evidence. Moral properties seem to float free.

  **NR:** That’s Harman’s challenge, distinct but related. The Cornell realist responds: Moral properties *are* natural properties – they don’t "float free." Wrongness *is* (say) the natural property of causing unjustified suffering. Observing the act causes my judgment *because* I perceive the natural property (suffering) constitutive of wrongness. It’s no more redundant than saying "water is H₂O" makes "water" redundant in explaining wetness. Water *is* H₂O; wrongness *is* causing suffering. The property does the causal work *as* the natural property. Furthermore, moral theories *do* explanatory work: Why did the community ostracize the individual? Because he violated trust (a moral property reducible to natural patterns of reciprocity). The moral description provides the relevant *level* of explanation for social phenomena.

  **QV:** Your reduction hinges on identifying "unjustified" suffering. That qualifier reintroduces the normativity that resists clean reduction to the purely descriptive. But set that aside. My deeper point is about the *entry conditions* for ontology. In "On What There Is," I said we commit to entities when they are indispensable to our best scientific theory of the world. The criterion is *indispensability for science*. Moral discourse, lacking the robust, stimulus-anchored observational checkpoint, and exhibiting such radical divergence, seems more akin to poetry or theology than to the systematic, empirically anchored enterprise of science. It doesn’t meet the threshold for generating ontological commitments. We can study the *psychology* of morals naturalistically, but not posit moral values as real entities.

  **NR:** But here’s where your holism bites back. If *all* knowledge is ultimately one web, and science itself relies on epistemic values (simplicity, coherence, empirical adequacy), and if ethical claims can be systematically integrated into a broader naturalistic web explaining human behavior and social dynamics using empirical methods (psychology, anthropology, neuroscience), why exclude them? Reflective equilibrium – the back-and-forth adjustment between moral intuitions, principles, and empirical facts about human needs and social consequences – functions as the ethical analogue of the observational checkpoint. It’s messier, more theory-laden, but it *is* a process of testing against experience, broadly construed. Isn't your refusal to allow this an *a priori* restriction on what counts as "experience" for ontology, one your holism should reject?

  **QV:** *[Pauses, sips coffee]* You press hard on holism. Let me try to locate our core divergence. For me, empiricism demands that the ultimate constraint – the tribunal – must be *sensory stimulation*. This is non-negotiable. It’s what roots language and theory in a shared, external world. Observation sentences, with their stimulus meanings, are the vital conduits. While holistic, the web must have *sensory* pegs. Moral discourse, as I see it, lacks these pegs. Its "empirical" inputs you cite – suffering, cooperation – are already thickly conceptualized, often normatively so. The consensus on their *significance* for moral verdicts is precisely what’s fragile, unlike the consensus on "red" or "heat." My asymmetric treatment isn't a double standard applied *to* holism; it's a *consequence* of demanding that holism be grounded in sensory evidence. Ethics seems grounded elsewhere – in sentiment, convention, or perhaps nothing objective at all. Naturalizing epistemology works because sensory evidence provides the anchor. Ethics lacks that anchor. My holism binds sentences *within* the web; it doesn't magically create new anchors *for* the web where none existed.

  **NR:** And I contend you set the threshold for an "anchor" too high. The sensory peg is crucial, but it doesn't need to be a *direct*, stimulus-synonymous peg for *every* term. The anchor for ethics is the complex, observable pattern of human well-being, suffering, and social functionality. Our theories, including moral ones, are tested against *this* periphery through the holistic methods of science itself – prediction, explanation, coherence. The lack of direct stimulus meaning for moral verdicts reflects their complexity and depth in the web, not their disconnect from experience. Denying them ontological status because they lack the *simplest* kind of observational peg seems to violate the spirit of your own attack on reductionism. The disagreement, then, bottoms out here: Must the empirical tribunal consist *only* of immediate sensory stimulations triggering assent, or can it encompass complex, sustained patterns of human interaction interpreted through evolving naturalistic theory?

  **QV:** *[Nods slowly]* You state the opposition clearly. For me, empiricism is thin, lean, and rooted in the triggering of sensory surfaces. Expanding the tribunal to include "patterns of human interaction interpreted through theory" risks diluting empiricism beyond recognition, opening the door to entities justified by appeal to forms of "experience" I cannot countenance as foundational. Your holism is more expansive, willing to grant ontological rights based on indispensability within a web constrained by a broader, more theory-laden periphery. We agree on naturalism and holism as methods. We disagree fundamentally on the *empirical foundation* those methods require. That, I suspect, is where we must leave it – not with a double standard, but with a deep, perhaps irreconcilable, difference about the very nature of empirical evidence and what it can underwrite. The sensory itch remains, for me, the non-negotiable starting point.

  **NR:** And for me, the itch is just the beginning; understanding the *meaning* of the scratch, and the patterns of scratching across a lifetime and a society, is where the richer, empirically tractable reality lies – including the reality of value. Thank you, Professor Quine. The argument continues.

  **Key Disagreement Bottomed Out:**
  *   **Quine:** Empiricism's tribunal **must** be immediate sensory stimulation captured by stimulus meanings. Moral discourse lacks the necessary intersubjective, stimulus-triggered observational sentences to anchor it in this sensory foundation. Holism operates *within* this sensory-anchored web; it cannot create a new anchor where the sensory link is absent or too indirect/fragile.
  *   **Naturalist Realist:** The empirical tribunal can be **broader**, encompassing complex, observable patterns of human practice (suffering, cooperation, social stability) testable *holistically* through naturalistic methods (prediction, explanation, reflective equilibrium). Moral properties are indispensable posits within a naturalistic theory explaining this observable periphery, analogous to theoretical posits in science. Requiring *direct* stimulus meaning sets an unfairly high and reductionistic bar inconsistent with Quine's own holism and critique of the analytic/synthetic divide.

  The dialogue reveals Quine's asymmetry as a *principled consequence* of his strict sensory empiricism, not an arbitrary double standard. However, it also shows how this strictness appears *unnecessarily restrictive* to the naturalist realist, who leverages Quine's own holism and naturalism to argue for a broader conception of empirical constraints capable of accommodating ethics. The core clash is over the *minimal unit of empirical significance*: immediate sensory stimulus (Quine) vs. complex, theory-mediated patterns of human interaction (Cornell Realist).
