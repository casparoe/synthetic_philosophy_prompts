answer: |-
  ## TA Handout: Post-Kim Debate (Dialogue Extract)

  **Setting:** Empty seminar room after reading group. Coffee cups scattered. Whiteboard still covered in fading diagrams of exclusion arguments. **ALEX** (Kim-sympathetic, methodical) packs their bag while **SAM** (non-reductive physicalist, Yablo-inspired) stares thoughtfully at the board.

  **ALEX:** ...so I still think the students who keep shouting "multiple realizability!" are missing the force of the exclusion *pressure*. Even if belief *can* be realized in silicon, or octopus goo, or whatever – Kim’s point is that *this particular instance* of belief, right here, right now, is realized by some specific physical state P1. And *that* state is causally sufficient for the arm movement, M. Closure demands it. So what causal work is left for the belief *over and above* P1? Invoking multiple realizability doesn’t dissolve that pairing; it just kicks the can down the road to the next instance.

  **SAM:** (Turns from board) Agreed, shouting the slogan isn’t enough. But that’s precisely why the Yablo move is crucial. It’s not *just* about multiple realizability. It’s about *proportionality* and the metaphysics of determinables and determinates. Look – P1 is the *determinate* physical realizer: hyper-specific, every micro-detail fixed. The belief-state M is the *determinable*: it abstracts away from the physical specifics, capturing the causally relevant functional role – say, ‘believing water is needed’.

  **ALEX:** Right, the belief is a coarser-grained property. But how does that grant it *independent* causal efficacy? P1 is still down there, doing the heavy lifting, metaphysically necessitating M via supervenience, and being causally sufficient for the movement. Exclusion still bites: either M causes M *instead of* P1 – violating closure – or *alongside* P1 – implying systematic overdetermination. Your ‘proportional cause’ seems epiphenomenal in this local context.

  **SAM:** It’s not independent efficacy, Alex, and it’s not overdetermination in the worrisome sense. Think about the window breaking. The baseball’s *determinable* property – ‘having momentum > X Ns’ – is the proportional cause of the shattering. The *determinate* property – ‘having momentum of precisely 42.7 Ns delivered by molecular configuration C’ – is causally sufficient too, but it’s *not* a distinct, independent cause. The determinate *realizes* the causal power of the determinable. The shattering depends counterfactually on the determinable momentum – if the momentum had been below X, no shatter, regardless of the precise determinate. But crucially, *fixing* the determinable fixes the relevant causal capacity; the determinate fills in the details *within* that capacity.

  **ALEX:** (Leans forward, elbows on table) Okay, I see the appeal. You’re saying the mental property M *is* the causally relevant one because it’s the minimal property that screens off the effect – the movement happens iff M is instantiated, regardless of *which* P realizes it. P1’s sufficiency is derivative; it’s just *how* M got realized *this time*. So no overdetermination because P1 isn’t an *additional* cause; it’s the *mode of realization* of the *single* cause, M.

  **SAM:** Exactly! The causal work is done by the functional role captured by M. P1 implements that role. Kim’s exclusion dilemma forces a false choice between the physical realizer and the mental property because he assumes causation only operates at the maximally specific, physical level. But causation can be proportional – picking out the relevant *level* of difference-making.

  **ALEX:** (Pauses, tapping finger) But here’s my worry, Sam: haven’t you just relocated the problem? You’ve dissolved the *apparent* overdetermination between M and P1 by making M the ‘real’ cause and P1 its mode. But now look up a level. What about the *physical* base properties that *constitute* P1? Call them P-micro. P-micro is causally sufficient for M, right? And M is now claimed to be causally sufficient for the movement. But closure demands that P-micro is *also* causally sufficient for the movement. So now we have *two* sufficient causes for the movement: M *and* P-micro. Doesn’t exclusion rear its head *again*, now between M and its own microphysical base? Your elegant determinable/determinate relation between M and P1 doesn’t seem to automatically resolve the relation between M and the lower-level physical *subvenient* base. Have you truly escaped overdetermination, or just redescribed it as existing between functional levels?

  **SAM:** (Sighs, runs a hand through hair) That’s… a sharper pushback. The Yablo move feels intuitively right for the mental/physical realizer pair *at the same level of granularity*. But you’re right, Kim’s closure/exclusion engine runs *all the way down*. If causation is fundamentally about microphysical production, then *any* higher-level property, no matter how proportional, might inherit its efficacy parasitically. Its sufficiency might just be a consequence of the microphysical sufficiency.

  **ALEX:** Precisely. Kim would say your proportional cause M only ‘makes a difference’ *because* the microphysical base P-micro *produces* both M and the movement. The counterfactual dependence tracks a real dependency, but the *production* might still lie entirely at the microphysical level. M is a difference-maker, but perhaps not a *producer*.

  **SAM:** And that’s the rub, isn’t it? We’ve been circling it all along. Kim’s argument *assumes* causation is fundamentally about microphysical production – a kind of energy/momentum transfer chain. Closure is framed in those terms. Exclusion relies on that notion of sufficiency implying preemption. My Yablo-inspired move assumes causation is fundamentally about systematic, proportional difference-making – counterfactual dependence at the right level of abstraction. The determinable/determinate relation is a way to cash that out *locally*, but it doesn’t necessarily ground that difference-making in fundamental *production* if production is microphysical.

  **ALEX:** Exactly. So the real disagreement isn’t just about functionalization or reduction. It’s about what causation *is* in the first place. Is it fundamentally about generating, producing, or bringing about an effect through some physical mechanism? Or is it fundamentally about being a minimally sufficient difference-maker in a network of counterfactual dependencies? Kim’s exclusion argument is powerful *if* you accept the former. Your proportional reply is compelling *if* you accept the latter. But the determinable/determinate move, elegant as it is, doesn’t by itself bridge *that* gap. It just shows how a difference-making view avoids the local exclusion problem *for that level*.

  **SAM:** (Nods slowly, looking back at the whiteboard) So maybe next week, when the students inevitably ask "But *is* mental causation possible?", the honest answer is: "It depends on what you think causation *is*." The exclusion argument isn't just a puzzle about minds; it's a probe into the metaphysics of causation itself. The determinable/determinate strategy is a sophisticated tool, but it operates *within* a particular conception of causation. Kim operates within another. The stalemate reflects that deeper divide.

  **ALEX:** (Stands, shouldering bag) Precisely. The handout should highlight *that* fork in the road. The rest is commentary. See you next week, Sam.

  **SAM:** (Gathers notes) See you, Alex. And… thanks. This helped.

  *(Both exit, leaving the diagrams of exclusion and proportionality fading on the board.)*

  ---

  **Handout Note:** This dialogue explores the Yablo proportionality/determinable-determinate strategy as a *sophisticated* non-reductivist reply to causal exclusion, moving beyond simple appeals to multiple realizability. Key points:
  1.  **Yablo's Core:** Mental property M (determinable) is the proportional cause; its physical realizer P1 (determinate) *implements* M's causal power, avoiding overdetermination *at that level*.
  2.  **Kim-Sympathetic Pushback (Alex):** Does this *resolve* overdetermination or *relocate* it? If microphysical properties P-micro are sufficient for *both* M and the effect, doesn't exclusion re-emerge between M and P-micro?
  3.  **The Deeper Issue:** The disagreement hinges on the fundamental nature of causation. Is it **production** (microphysical, generative, Kim's assumed view) or **difference-making** (systematic, counterfactual, proportional, Yablo's assumed view)? The exclusion argument gains its force from the former; the proportional reply is compelling under the latter. The determinable/determinate move is elegant within a difference-making framework but doesn't necessarily reconcile the two views of causation.
