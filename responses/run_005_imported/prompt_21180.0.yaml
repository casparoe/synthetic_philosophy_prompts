  Also, Schopenhauer’s view on melody: it’s not about depicting specific emotions but the abstract form of striving—departure, journey, resolution. A Bach fugue, with its complex interplay of voices, embodies the constant struggle and resolution that mirrors the Will’s ceaseless motion. The absence of text allows for a purer expression. 

