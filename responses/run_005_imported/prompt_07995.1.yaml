prompt: |-
  im giving my old cognitive science department's commencement speech this spring (they invite one alum back every year and this year it's me), and I want to build it around the frame problem, because I've basically been living it at work all year -- I'm on an AI agents team and half our incident reports are some version of "we told it to change one thing and it decided forty unrelated things also needed changing, because nothing told it what to leave alone." I want to use the actual philosophical version of this (McCarthy and Hayes, then Dennett and that whole 80s fight with Fodor and the rest over what "relevant" even means) to say something true about leaving a place where someone else decided what counted as relevant for you, not just namedrop it and move on. Problem is half the audience is graduating CS/cogsci majors who'll clock it immediately if I fake the depth, and the other half is parents who've never heard the term in their life. Can you write me the speech -- about 6 minutes read aloud -- where the frame problem is actually doing the work and not just decorating it?
