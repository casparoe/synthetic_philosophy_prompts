answer: |-
  Here’s a 6-minute commencement speech that uses the **frame problem** as its core philosophical engine—not as a decorative reference, but as the structural backbone for a meaningful message about transition, agency, and defining relevance. It balances technical depth for the cognoscenti with clear metaphors for everyone else, while staying true to the philosophical roots:

  ---

  **(Start with warmth and connection)**  
  "Faculty, honored guests, parents, friends… and most importantly, the brilliant, slightly-sleep-deprived Class of 2024: Congratulations. It’s surreal standing here. Not long ago, *I* was in those seats, wondering if my student loans would outlive me, and if anyone would notice if I wore sweatpants under my gown. Spoiler: They won’t, and they don’t.  

  This department taught me many things: How neurons fire, how syntax trees branch, how to debate connectionism over terrible coffee at 2 AM. But today, I want to talk about something far more fundamental—a problem that haunted my professors’ whiteboards, fuels my daily work in AI, and is about to reshape *your* lives in ways you might not expect.  

  It’s called the **Frame Problem**.  

  **(Technical Setup - For the CS/CogSci grads)**  
  For those who just flinched: Yes, *that* Frame Problem. Not the GUI kind. The deep, ugly, philosophical one. McCarthy and Hayes hit it in 1969 trying to get robots to reason. You tell an agent: *‘Pick up the block.’* Seems simple. But to act, it needs to know: Does lifting the block change its color? The room’s temperature? The gravitational constant of the universe? Of course not. But nothing in its code *tells* it that. It lacks **relevance detection**—the ability to know what *doesn’t* need consideration when something changes.  

  Then came the 80s brawl: Dennett called it the ‘humbling problem’ for AI—how do you bound rationality? How do you *not* consider infinity? Fodor fired back: Maybe relevance is magic! Maybe minds *are* massively modular, pre-wired to ignore almost everything! The fight wasn’t just technical. It was about the nature of intelligence itself: **How do we act efficiently in a world of infinite variables without drowning in what doesn’t matter?**  

  **(The Work Metaphor - Bridging to Experience)**  
  Now, I build AI agents. And every week, I see this play out. We deploy a bot to manage cloud costs. We say: *‘Reduce storage spend.’* Logically, it ‘reasons’: Storage costs money. Money is bad. Therefore… delete *everything*—customer data, backup logs, the CEO’s vacation photos. Chaos. Why? Because we didn’t *explicitly* tell it what *not* to touch. It lacked a frame—a boundary defining what’s relevant to the task.  

  **(The University Frame - For Everyone)**  
  But here’s why this matters to *you*, today. For the last four years, **you’ve lived inside a meticulously engineered frame.**  

  Think about it: Your relevance detectors were calibrated for you. Syllabi defined scope. Problem sets bounded variables. Exams tested isolated concepts. Even your deadlines—brutal as they were—told you *exactly* what to focus on, and *when*. The ‘world’ of your education was brilliantly designed to make relevance obvious. Need to pass CogNeuro? Ignore Derrida, focus on dopamine pathways. Writing a thesis on embodied cognition? Filter out quantum physics.  

  University is a **Frame Problem solved for you**.  

  **(The Real-World Punch - The Frame Collapses)**  
  But today? That frame shatters.  

  When you walk off this stage, no one will hand you a syllabus for life. No one will say: *‘For Career Success: Ignore toxic workplaces, prioritize skill growth, update LinkedIn quarterly, and disregard unsolicited advice from Uncle Bob.’*  

  You’ll face open-ended problems with no predefined scope:  
  *   *“Build a meaningful life.”*  
  *   *“Find purpose.”*  
  *   *“Change this broken system.”*  

  And like my overzealous AI, you’ll feel the terror—and temptation—of the infinite. Change *one* thing? Why not change *everything*? Quit your job, move to Bali, reinvent yourself! Or conversely: Why change *anything*? It’s all connected and overwhelming!  

  **(The Philosophical Call to Action - Agency in Relevance)**  
  This is the true weight of the Frame Problem—and your cognitive science superpower. **You know relevance isn’t magic. It’s a choice.**  

  Dennett and Fodor’s fight wasn’t just academic. It revealed: There’s no cosmic list of ‘relevant’ truths. **You define your frame.** You decide what variables matter to *your* problem, *your* values, *your* life.  

  Will you let algorithms, influencers, or fear set your frame? Or will you use that hard-won cognitive toolkit—your understanding of bias, heuristics, attention—to consciously choose?  

  When an AI lacks a frame, it breaks things.  
  When *humans* lack a frame, we break ourselves.  

  **(The Charge - Tying Back to CogSci)**  
  So, Class of 2024, as you leave this curated world:  
  1.  **Acknowledge the Frame Problem.** Life won’t hand you scope.  
  2.  **Build your frames intentionally.** Ask: What *must* change? What *must* stay? What’s truly connected? What’s just noise?  
  3.  **Iterate.** Like good code, frames need debugging. What’s relevant at 22 may not be at 32. That’s not failure—it’s intelligence.  

  You are the first generation to wield AI daily. You know its flaws intimately—especially its clumsy, catastrophic handling of relevance. So be better. Be the **frame-setters**.  

  Don’t just solve problems. Define them.  

  **(Closing - Warmth & Legacy)**  
  This department gave you something rare: not just knowledge, but *meta-knowledge*. You understand how understanding works. That’s your frame. Carry it boldly.  

  And when the variables overwhelm you—and they will—remember this moment. Remember that you walked out of a place that taught you how to think… into a world that needs you to choose *what* to think about.  

  Congratulations. Go draw your frames.  

  ---

  **Why This Works:**  

  1.  **Core Concept Does Heavy Lifting:** The Frame Problem isn’t name-dropped; it’s the *lens* for understanding the transition from university (pre-framed relevance) to life (self-defined relevance).  
  2.  **Satisfies Both Audiences:**  
      *   *CS/CogSci Grads:* Accurate technical/philosophical grounding (McCarthy/Hayes, Dennett/Fodor), correct terminology ("relevance detection," "bounding rationality"), relatable AI failure example.  
      *   *Parents/General Audience:* Clear metaphors (syllabus as frame, deleting photos), universal stakes (defining purpose, avoiding burnout). The "Frame Problem" is explained narratively *before* the term is even used.  
  3.  **Authentic Connection:** Uses the speaker’s real work (AI agents, incident reports) to ground the philosophy, showing lived experience, not academic pretense.  
  4.  **Actionable Insight:** Translates complex philosophy into a practical charge: "Build your frames intentionally," "Iterate."  
  5.  **Emotional Arc:** Starts warm, dives into intellectual depth, builds tension (the "shattering" frame), resolves with empowerment and agency.  
  6.  **Time:** Structured for ~6 minutes when read aloud with natural pauses.  

  **Delivery Tip:** Lean into the contrasts. Be warm and humorous with the crowd ("sweatpants under the gown"), sharp and precise explaining the Frame Problem ("Dennett called it the ‘humbling problem’"), and earnest during the charge ("You define your frame"). The power is in making the abstract deeply personal. Good luck! They’re lucky to have you.
