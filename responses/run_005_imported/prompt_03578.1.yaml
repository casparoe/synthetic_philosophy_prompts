  Let me unpack their three pain points:  
  First, frequentism (Von Mises) collapses for single cases because probabilities only exist in infinite collectives. The reference class problem is fatal—that lone atom belongs to countless classes (this isotope, this sample, this lab's history), and no theory picks which one matters.  

  Second, propensities (Popper) try to rescue single cases by tying probability to physical setups. But Humphreys' paradox shows propensities can't handle Bayesian inversion since they're causal arrows pointing forward—yet we constantly use Bayes in science (e.g., updating decay probabilities after measurements).  

  Third, subjectivism (e.g., de Finetti) freely assigns single-case credences but severs the link to objective chance. Without something like Lewis' Principal Principle—which says credences should track physical chances—probability becomes "just an opinion," undermining science's authority.  

