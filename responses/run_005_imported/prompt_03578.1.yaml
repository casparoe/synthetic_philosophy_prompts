  - For epistemology: Scientists *can't* know single-case probabilities directly—they're inferred from frequencies. But via Lewis' principle, these frequencies *calibrate* rational credences about single cases.  

  This preserves objectivity while acknowledging human limitations. The verdict: Single-case probability talk *isn't* confused—it's essential—but requires recognizing that "probability" blends physical reality (chance) and rational epistemology (credence).  

