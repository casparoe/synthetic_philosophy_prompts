  Potential risks include alienating both parties or appearing biased. The memo needs to stress transparency and due process. Investigate the noise complaint thoroughly, hold a hearing if needed, and apply any penalties fairly. For Frank's Airbnb, start enforcement procedures now, possibly with fines. This approach treats both violations seriously without linking them.

