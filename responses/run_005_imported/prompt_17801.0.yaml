  The user also asks why reliabilists might not see this as a problem. Here, I should distinguish between the process being reliable and one knowing it's reliable. Reliabilism focuses on the mechanism's actual reliability, not the believer's awareness. But in this case, the user hasn't verified the mechanism's reliability externally. So even under reliabilism, without evidence of the process's reliability, the belief might not qualify as knowledge. 

