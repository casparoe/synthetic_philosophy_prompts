  For the assessment part, I should validate their suspicion: normative solutions do relocate rather than resolve the core problem. But I'll also emphasize that this philosophical ambiguity is precisely why blameless postmortems exist - because human systems need actionable fixes, not causal absolutes. Might mention how NASA's incident frameworks handle this tension.

