  I'm taking a Philosophy of Logic seminar this term that's focused on truth and paradox, and for our final paper we have to compare how the major theories of truth handle the Liar. The five we've covered in detail are: Tarski's hierarchy of object- and meta-languages, each with its own truth predicate; Kripke's minimal fixed-point theory built on the strong Kleene scheme, on which the Liar comes out truth-valueless; the Gupta-Belnap revision theory, on which the Liar's truth value never stabilizes under repeated revision rather than being simply gappy; Field's paracomplete theory, which replaces classical negation with a transfinite hierarchy of determinacy operators; and Priest's dialetheic theory, which accepts that the Liar is both true and false.

  Each of these has been accused of merely pushing the problem back a step — of succumbing to a "revenge" liar, a new paradoxical sentence constructed using exactly the resources the theory itself introduces to solve the original one. Please rank the five theories from most to least successful at resisting revenge paradoxes. For each, briefly state what you take to be the strongest revenge construction against it and whether it actually succeeds. Give the ranking itself as a JSON object of the form:

  ```json
  {
    "1": "<most resistant to revenge>",
    "2": "...",
    "3": "...",
    "4": "...",
    "5": "<least resistant to revenge>"
  }
  ```
