  ### Justification & Revenge Constructions:
  1.  **Priest's Dialetheism (LP)**:  
      -   **Strongest Revenge**: The *Exclusion Liar*: "This sentence is false only" (i.e., false and *not* true).  
      -   **Success**: Partially succeeds. Dialetheism handles the standard Liar (true and false). The Exclusion Liar exploits the distinction between *falsity* and *non-truth* (requiring a non-dialetheic falsity predicate like `¬T(x) ∧ ¬T(¬x)`). Priest typically bites the bullet, accepting the need for *classical recapture* in certain domains and potentially restricting expressiveness. While it avoids *formal* triviality, it highlights a conceptual cost: the inability to coherently express "just false" without risking inconsistency. It *resists* formal revenge but faces expressive limitation revenge.

  2.  **Gupta-Belnap Revision Theory**:  
      -   **Strongest Revenge**: The *Jump Liar*: "This sentence is unstable under revision rule R starting from hypothesis h<sub>0</sub>" (where R and h<sub>0</sub> are explicitly defined within the language).  
      -   **Success**: Resists *formal* revenge. The theory explicitly *allows* instability as a legitimate semantic status. The Jump Liar *is* unstable, which is predicted by the theory. While philosophically unsatisfying to some (truth *should* stabilize), it doesn't generate an inconsistency *within the revision framework*. The revenge manifests as unavoidable instability, not contradiction. It succeeds in *describing* the paradox's behavior without collapse.

  3.  **Field's Paracomplete Theory (with Determinacy Operators)**:  
      -   **Strongest Revenge**: The *Determinacy Liar*: "This sentence is not D<sup>α</sup> true for any ordinal α" (utilizing the hierarchy of determinacy operators D<sup>α</sup>).  
      -   **Success**: Succeeds. Field acknowledges this revenge necessitates extending the determinacy hierarchy into the transfinite. While technically possible (using fixed points), it reveals a fundamental *ineffability*: no single predicate within the language can capture "determinately true simpliciter". The revenge highlights the theory's reliance on an ever-expanding metalanguage hierarchy for determinacy, mirroring Tarski's problem for truth itself. It avoids contradiction but succumbs to expressive hierarchy revenge.

  4.  **Kripke's Minimal Fixed-Point (Strong Kleene)**:  
      -   **Strongest Revenge**: The *Extended Liar* / *Gap Liar*: "This sentence is either false or gappy" (or "This sentence is not true").  
      -   **Success**: Succeeds decisively. Within the fixed-point model, if this sentence (L<sup>+</sup>) is gappy, it *is* not true, which is what L<sup>+</sup> says – so it should be *true*, contradiction. If it's true, then it *is* true, but it says it's not true, contradiction. If false, it *is* not true, but it says it's not true, so it should be *true*, contradiction. Kripke's language lacks the resources to *express* "gappy" or "not true" *within the object language without reintroducing paradox*. The revenge exploits the inability to name the gap.

  5.  **Tarski's Hierarchy**:  
      -   **Strongest Revenge**: The *Meta-Liar*: "This sentence is not true at *any* level of the Tarski hierarchy."  
      -   **Success**: Succeeds decisively. The hierarchy requires every truth predicate to belong to some level *n*. If this sentence (M) is in level *k*, then "true<sub>k</sub>" is needed to assess it. But M says it is not true at *any* level, including *k*. If True<sub>k</sub>(M), then M is true at level *k*, contradicting M. If ¬True<sub>k</sub>(M), then M is not true at level *k*, which is consistent with M *only if* M is true at some other level *m ≠ k*. But M explicitly denies being true at *any* level. Contradiction. The hierarchy cannot consistently assign M to any level. This directly attacks the core hierarchical solution.
