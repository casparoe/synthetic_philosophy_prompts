answer: |-
  You've hit on a fascinating and contentious debate! The ergodicity economics argument (championed by Ole Peters) makes a provocative claim: maximizing expected value (EV) for repeated bets where wealth compounds is *mathematically wrong* because averaging over an ensemble (many parallel copies) doesn't reflect the time-average growth of a single trajectory. Kelly maximizes the growth rate, which *is* ergodic, hence it's argued to be the "correct" objective.

  While the ergodicity perspective is insightful and highlights crucial limitations of naive EV maximization for long-term wealth, calling EV maximization a "mathematical mistake" is an overreach. Here's the strongest case for why EV maximization remains defensible and why the ergodicity critique, while valuable, doesn't render EV obsolete or "wrong":

  1.  **Different Objectives, Different "Correctness":**
      *   **Kelly/Growth Rate Maximization:** Aims to maximize the *long-run rate* of wealth growth (`g = lim (T→∞) (1/T) log(W_T / W_0)`). This is the "geometric mean criterion." It prioritizes *survival* and *compounding efficiency* over the very long term. It inherently incorporates risk aversion via the logarithm.
      *   **Expected Value (Linear Utility) Maximization:** Aims to maximize the *expected wealth* at a specific future point in time (`E[W_T]`). It cares about the *arithmetic mean* of outcomes. This might be driven by:
          *   **Finite Time Horizons:** You're not investing forever. You need `W_T` for retirement in 30 years, a house down payment in 5 years, or next month's poker bankroll. Maximizing `E[W_T]` is a rational goal for that specific terminal wealth.
          *   **Non-Linear Utility of Terminal Wealth:** Your happiness/satisfaction (`U(W)`) might not be logarithmic. If `U(W)` is linear (e.g., you need a fixed sum `W_T` for a specific goal, and anything above is gravy, anything below is failure), then maximizing `E[W_T]` *is* maximizing expected utility (`E[U(W_T)] = E[W_T]` if `U(W) = W`).
          *   **External Capital/Income:** Your gambling/investing bankroll isn't your entire wealth. You have a steady income stream or other assets. Maximizing the EV of this *specific* bankroll might be optimal for your *overall* financial picture, even if it's riskier for the bankroll itself. Kelly assumes the bankroll *is* your entire relevant wealth.
      *   **Calling EV maximization "wrong" assumes everyone's objective *must* be maximizing long-run growth rate.** This is a normative claim, not a mathematical truth. If your objective is `E[W_T]` for a finite `T` or under linear utility, then maximizing EV *is* mathematically correct *for that objective*. The ergodicity argument critiques the *applicability* of the ensemble average to a *specific* objective (long-run growth), not the mathematics of expectation itself.

  2.  **The Practical Realities of "Long-Run":**
      *   **We Don't Live Infinitely Long:** True ergodicity requires `T→∞`. Humans have finite lives and investment horizons. The "long run" might be long enough for significant compounding, but rarely infinite. The relative performance of Kelly vs. higher-EV/higher-variance strategies depends critically on `T`. For shorter `T`, higher-EV strategies often outperform Kelly in terms of `E[W_T]`.
      *   **Model Risk & Parameter Uncertainty:** Kelly is notoriously sensitive to accurate estimates of probabilities and payoffs (`p` and `b`). Overestimating your edge (`p`) by even a small amount leads Kelly to drastically overallocate, increasing ruin risk. An EV maximizer might take a position with a large estimated EV but high uncertainty/variance, potentially leading to large gains *or* losses. Neither is immune to model error, but the fragility of Kelly in the face of uncertainty makes a pure growth-max strategy risky in practice. Estimating `E[W_T]` might sometimes be more robust, or simply reflect the best estimate available.

  3.  **Beyond the Logarithm: Other Legitimate Utilities:**
      *   The ergodicity argument relies heavily on the logarithmic utility function, which makes the growth rate ergodic. But why *must* utility be logarithmic?
      *   Individuals have different risk tolerances and utility functions. Someone might have:
          *   **CRRA Utility (`U(W) = W^(1-γ)/(1-γ)`):** More general than log-utility (`γ=1`). γ>1 implies greater risk aversion.
          *   **CARA Utility (`U(W) = -e^(-αW)`):** Absolute risk aversion.
          *   **S-Shaped Utility (Prospect Theory):** Risk-seeking in losses, risk-averse in gains.
      *   **Maximizing `E[U(W_T)]` is the fundamental principle of rational choice under uncertainty.** Kelly is a *special case* of this (`U(W) = log(W)`). If your `U(W)` is *not* logarithmic (and there are valid reasons why it might not be), then maximizing `E[U(W_T)]` is the correct objective, which might involve strategies very different from Kelly, including EV maximization under linear utility.

  4.  **Practical Implementation & Constraints:**
      *   **Liquidity Needs & Withdrawals:** Real investors don't continuously reinvest 100% of their wealth. They make withdrawals for living expenses. This breaks the pure compounding assumption and alters the optimal strategy. Maximizing EV of the portfolio *before* planned withdrawals might be a reasonable heuristic.
      *   **Fixed Bet Sizes/Position Sizing:** Often, bets aren't a continuous fraction of wealth. You bet fixed dollar amounts or fixed lot sizes (e.g., 1 futures contract). In these cases, maximizing the EV *per bet* is a natural and often sensible objective for growing the bankroll, even if the *path* matters.
      *   **Correlation and Diversification:** In complex portfolios with correlated assets, maximizing overall portfolio growth rate is computationally challenging and requires knowing the joint distribution of *all* assets. Maximizing a weighted sum of EVs (like in traditional MPT) is a more tractable (though imperfect) approach that often performs well enough in practice. Calling it a "mathematical mistake" ignores computational and informational constraints.

  5.  **The "Bait and Switch" You Sense:**
      *   **Equivocation on "Value":** The ergodicity argument subtly shifts the definition of "value." It correctly points out that the *ensemble average* (`E[W]`) isn't the same as the *time-average growth rate* (`g`). However, it then concludes that maximizing `E[W]` is therefore "wrong." This conflates two different things: `E[W]` *is* a mathematically valid measure of central tendency for the distribution of possible wealth outcomes at a point in time. It's "wrong" *only* if you incorrectly believe maximizing `E[W]` also maximizes `g`. Kelly proponents knew this decades ago – that's why Kelly *exists*! Framing this well-known limitation as a fundamental mathematical error in expectation itself is misleading.
      *   **Overstating the Novelty:** The insight that geometric mean maximization prevents ruin and optimizes long-run growth under logarithmic utility is not new (Kelly 1956, Latane 1959, Markowitz even considered it in the 50s). The ergodic framing is novel and elegant, but the core conclusion – that maximizing `g` is optimal for long-run wealth under log utility – was well-established. Calling EV maximization a "mathematical mistake" implies a deeper flaw than just "not optimal for a specific long-run goal."

  **In Conclusion:**

  The ergodicity economics perspective provides a powerful and elegant framework for understanding why maximizing expected value can be disastrous for long-term wealth growth under compounding and why Kelly (or growth-rate maximization) is optimal *for the specific goal of maximizing the long-run growth rate under logarithmic utility*. It highlights a crucial limitation of naive EV maximization for repeated bets.

  **However, it does *not* prove that maximizing expected value is a "mathematical mistake" in general.** It proves that maximizing `E[W]` is not equivalent to maximizing `g`. Maximizing `E[W]` remains mathematically sound and rationally defensible when:

  1.  **The time horizon `T` is finite and relatively short.**
  2.  **The utility function over terminal wealth `W_T` is linear (or sufficiently close).**
  3.  **The bankroll is a small part of overall wealth.**
  4.  **Practical constraints (liquidity needs, fixed bets, model uncertainty) make growth-rate maximization difficult or risky to implement.**
  5.  **The objective is explicitly `E[W_T]` or `E[U(W_T)]` with a non-log utility function.**

  The strongest argument is one of pluralism: **Different optimization objectives are mathematically valid and practically rational depending on the investor's specific goals, time horizon, risk tolerance (utility function), and constraints.** Kelly is optimal for one very important objective (long-run growth under log utility). Expected value maximization is optimal for other important objectives (finite horizon terminal wealth under linear utility). Neither is universally "correct" or "a mistake"; they are tools suited for different jobs. The ergodicity critique rightly warns against using the EV tool for the growth-rate job, but it errs by declaring the EV tool inherently flawed.
