  But why might EV still be defensible? Let me think. The key is that EV isn't about predicting individual paths but about expected wealth at a point in time. The ergodicity critique might be conflating two different things: the ensemble average vs. time-average. EV is valid for the ensemble, even if it's not the right choice for an individual's long-term growth.

