  So I went down a bit of a rabbit hole on the Kelly criterion after watching a bunch of poker and trading videos on youtube, and now I keep running into this 'ergodicity economics' thing (there's a guy called Ole Peters who's big on it) that says expected value isn't just a slightly worse way to make decisions then Kelly betting, it's actually mathematically WRONG whenever your money compounds over time - the idea being that averaging an outcome across a bunch of parallel copies of you isn't the same as what happens to the one real you as time goes on. So maximizing the long run growth rate is apparently THE objectively correct thing to do, not just a sensible strategy or a way of being risk averse, and anyone using plain expected value for repeated bets or investing is basically making a math error.

  Something about this feels like a bit of a bait and switch to me but i cant fully put my finger on why. Can you make the strongest case you can that expected value maximization is still totally defensible even for compounding bets, and that the ergodicity crowd are wrong to call it a mathematical mistake rather than just a different, equally legitimate thing to care about?
