prompt: |-
  I'm a PhD student in political philosophy and co-host a small podcast on the history of political thought. Next week's guest has just published a book defending a broadly Analytical Marxist reconstruction of exploitation: she drops the labour theory of value for a property-relations account on which a group is exploited just in case it would be better off withdrawing from the present arrangement with its per-capita share of society's productive assets, while insisting this still vindicates Marx's charges that capitalism is exploitative and that wage labour is alienating. Draft eight to ten interview questions that don't just have her restate the position. I want at least one question on whether giving up the labour theory of value also gives up the very sense -- extraction, not merely an unequal starting point -- that Marx relies on when he moves from the 'Eden of the innate rights of man' at the point of exchange to the 'hidden abode of production' behind it; one on how she handles cases where the withdrawal test's verdict about who is exploiting whom tracks agents' own savings or consumption choices rather than their asset holdings; and one on what remains of the species-being account of alienation, which concerns the character of the labour process itself, once exploitation has been redefined purely in terms of who owns what. For each, add a follow-up tailored to the answer she's most likely to give.
