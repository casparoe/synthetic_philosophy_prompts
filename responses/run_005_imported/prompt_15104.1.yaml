  The user wants intuition, so analogies might help. Like how a crooked ruler can't measure straightness properly. Or how a non-strictly proper rule is like a faulty compass—misleading the forecaster. Also, emphasizing the difference between proper and strictly proper: the latter has unique minima, so honest reporting is the only rational choice.

