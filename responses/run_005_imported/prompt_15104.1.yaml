  For the practical part: Absolute difference isn't strictly proper. That means forecasters can game the system. For example, if the true probability is 70%, reporting 100% minimizes expected absolute error. That's bad—it pushes forecasters to extremes, distorting their true beliefs. They'd overreport 0% or 100%, making forecasts useless. I should illustrate this with concrete numbers to make it intuitive.

