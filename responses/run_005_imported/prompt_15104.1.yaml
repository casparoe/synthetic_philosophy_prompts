answer: |-
  Your question cuts to the heart of why strict propriety isn't just a technical nicety—it's the linchpin holding together both the practical incentives for honest forecasting *and* the philosophical argument for probabilism. Let's break down what shatters if you use absolute difference (`|p - x|` where `x=0` or `1`) instead of a strictly proper rule like Brier (`(p - x)^2`).

  ### 1. **What Breaks in Practice: Forecasters' Incentives**
     Absolute difference creates **perverse incentives** that actively punish honest reporting. Here's why:

     - **The "Extremization" Incentive**:  
       Suppose an analyst believes the true probability of an event is **0.7**.  
       - If they report **p = 0.7**, their *expected* absolute error is:  
         `(0.3 * |0.7 - 1|) + (0.7 * |0.7 - 0|) = (0.3*0.3) + (0.7*0.7) = 0.09 + 0.49 = 0.58`  
       - If they report **p = 1.0**, their expected error is:  
         `(0.3 * |1.0 - 1|) + (0.7 * |1.0 - 0|) = (0.3*0) + (0.7*1) = 0.7`  
       - If they report **p = 0.0**, their expected error is:  
         `(0.3 * |0 - 1|) + (0.7 * |0 - 0|) = (0.3*1) + (0.7*0) = 0.3`  

       **Surprise!** Reporting `p=0` (extreme pessimism) gives a *lower* expected error (0.3) than their true belief (0.58). Their incentive is to lie, reporting `0%` regardless of their actual credence.  

     - **Why This Happens**:  
       Absolute difference is **proper but not strictly proper**. It only requires that the *minimum* expected score occurs at the true probability. But it allows other points (like `0%` or `100%`) to *also* achieve that minimum. Forecasters can "cheat" the system by always reporting 0% or 100% without penalty.  

     - **Real-World Consequence**:  
       Analysts would quickly learn to report only **0%** or **100%** on every question. Your scoring system would degenerate into measuring who guesses the outcome correctly, not who assesses *uncertainty* best. Subtle distinctions (e.g., 60% vs. 70%) would vanish.

  ### 2. **What Breaks in Theory: The Argument for Probabilism**
     The accuracy-dominance argument (Joyce, Pettigrew) says: **If your credences violate probability axioms, there exists a coherent (probabilistic) alternative that is *more accurate* no matter how the world turns out.**  
     Strict propriety is essential here. With absolute difference:

     - **Accuracy-Dominance Fails**:  
       Consider an analyst with incoherent credences:  
       - **P(A) = 0.6**, **P(B) = 0.7** for mutually exclusive events A and B.  
       (Violates probability: P(A) + P(B) > 1).  

       Now, compare them to a coherent alternative: **P*(A) = 0.5**, **P*(B) = 0.5**.  
       - **If A occurs, B does not**:  
         Analyst: `|0.6 - 1| + |0.7 - 0| = 0.4 + 0.7 = 1.1`  
         Coherent: `|0.5 - 1| + |0.5 - 0| = 0.5 + 0.5 = 1.0` → Coherent wins.  
       - **If B occurs, A does not**:  
         Analyst: `|0.6 - 0| + |0.7 - 1| = 0.6 + 0.3 = 0.9`  
         Coherent: `|0.5 - 0| + |0.5 - 1| = 0.5 + 0.5 = 1.0` → **Incoherent wins!**  
       - **If neither occurs** (C happens):  
         Analyst: `|0.6 - 0| + |0.7 - 0| = 0.6 + 0.7 = 1.3`  
         Coherent: `|0.5 - 0| + |0.5 - 0| = 0.5 + 0.5 = 1.0` → Coherent wins.  

       **Result**: No dominance. The incoherent forecaster isn't universally beaten—they win when B occurs. The argument for probabilism collapses because incoherence isn't always penalized.

     - **Why This Matters for Epistemology**:  
       The dominance argument relies on the scoring rule being **strictly convex** (like Brier). Absolute difference is linear, so it doesn't "see" violations of additivity. It only cares about point estimates independently, not how they relate as a whole. Strict propriety forces the scoring rule to be sensitive to coherence across all propositions.

  ### Key Intuition: Strict Propriety as a "Truth Serum"
  Think of strict propriety as a **uniqueness guarantee**:  
  - **Strictly proper rules (Brier)**: The *only* way to minimize your expected score is to report your true belief.  
  - **Non-strictly proper rules (Absolute difference)**: Multiple reports (like 0% or 100%) minimize your expected score. Honesty isn't the uniquely rational strategy.  

  This is why philosophers insist on strict propriety:  
  1. **Incentive alignment**: Without it, rationality *permits* (or even *demands*) dishonesty.  
  2. **Coherence enforcement**: Without it, violating probability axioms isn't necessarily "less accurate" in a dominance sense.  

  ### What Should You Use? Practical Advice
  - **Brier score** `(p - x)^2` is the simplest strictly proper rule. It works for binary events and generalizes to multiple outcomes.  
  - **Log score** `-log(p)` if outcome occurs (else `-log(1-p)`) is also strictly proper and highly sensitive to extreme predictions.  

  Both incentivize honesty and underpin the accuracy-dominance argument. Absolute difference fails catastrophically on both fronts—it rewards extremism and can’t ground a defense of probabilism. Stick to strictly proper rules to keep your analysts honest and your epistemology sound.

  *P.S.: If your analysts dislike quadratic scoring, the log score is a compelling alternative—just be wary of its sensitivity when p≈0 or p≈1.*
