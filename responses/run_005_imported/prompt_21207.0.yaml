  However, note that the student's explanation of the independence axiom application could be more explicit. The standard way to show the violation is to note that:

  In Problem 1: A = ($1M for sure) vs B = (0.10: $5M, 0.89: $1M, 0.01: $0)

  In Problem 2: C = (0.11: $1M, 0.89: $0) vs D = (0.10: $5M, 0.90: $0)

  Note that we can write:
  A = (0.11: $1M, 0.89: $1M) [since it's $1M regardless]
