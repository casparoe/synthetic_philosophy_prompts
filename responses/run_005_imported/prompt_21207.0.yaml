  Now, if we consider a mixture with a common outcome (Z) that is $1M with probability 0.89, then:
  A = 0.11 * (degenerate $1M) + 0.89 * (degenerate $1M) [but that doesn't help]

  Alternatively, we can reframe:

  Consider a common lottery Z that pays $1M with probability 1 (but that doesn't match). 

  The standard independence argument is:

  Let:
  X = $1M for sure.
  Y = 10/11 chance of $5M and 1/11 chance of $0.   [This is not exactly the same as B]

  Actually, the common way is to note that:

  A = (1.0 * $1M)
  B = (0.10 * $5M, 0.89 * $1M, 0.01 * $0)

  Now, we can write:
  C = (0.11 * $1M, 0.89 * $0)
  D = (0.10 * $5M, 0.90 * $0)

  But note that we can also write:

  A = (0.11 * $1M, 0.89 * $1M)   [because 0.11+0.89=1, and both pay $1M]
  B = (0.11 * [10/11 chance of $5M and 1/11 chance of $0], 0.89 * $1M)   [because 0.11 * (10/11) = 0.10 and 0.11*(1/11)=0.01]

  Similarly, 
  C = (0.11 * $1M, 0.89 * $0)
  D = (0.11 * [10/11 chance of $5M and 1/11 chance of $0], 0.89 * $0)

  So, the independence axiom would require that if you prefer A over B, then you should prefer the lottery that gives $1M with probability 0.11 and $1M (from the common part) with 0.89 (i.e., A) over the lottery that gives [10/11 $5M, 1/11 $0] with 0.11 and $1M with 0.89 (i.e., B). 

