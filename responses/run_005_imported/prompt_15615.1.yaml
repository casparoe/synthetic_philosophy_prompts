answer: |-
  ## Dialogue: Espresso & Equipoise  
  *(Sam defends parity; Alex defends vagueness. They meet at a philosophy conference coffee cart)*  

  **Alex:** ...so I still don’t see why we need Chang’s ‘parity’. Take your composer-versus-lawyer case. The indeterminacy screams *vagueness*. We know how to model that – supervaluation, degrees of truth, whatever. Why invent a fourth relation?  

  **Sam:** Because vagueness *doesn’t* capture the normative structure. Suppose the law firm offers you a 1% raise. Is the job now determinately better than being a composer?  

  **Alex:** Not necessarily. Vagueness has borderline cases. A 1% bump might still sit squarely within the ‘roughly equal’ zone.  

  **Sam:** Agreed. Now suppose they offer a 5% raise. Then 10%. Then 20%. Then *double* the salary. At what precise point does it become determinately better?  

  **Alex:** There is no precise point! That’s the *essence* of vagueness. ‘Roughly equal’ doesn’t have sharp boundaries. Asking for a threshold is like asking “Exactly how many grains make a heap?” It’s a category error.  

  **Sam:** But here’s the rub: Even if the firm offered *ten times* the salary, I could still imagine a reasonable person—perhaps someone who despises corporate life or values artistic creation immensely—sincerely choosing the composer’s path *without irrationality*. The sweetened job isn’t *better*; it’s just *differently good*. Vagueness implies that enough sweetening *must* eventually make one option determinately superior. But that intuition feels wrong here. The values are incommensurable in a way sand piles aren’t.  

  **Alex:** I think you’re conflating epistemology with metaphysics. That a reasonable person *might still choose* the composer life doesn’t prove the options are metaphysically ‘on a par’. It just shows the *reasons* are complex and hard to weigh precisely. Vagueness in the *betterness relation* explains why we can’t say definitively which is better, even after large sweeteners. Higher-order vagueness means there’s no sharp line between ‘definitely not better’ and ‘definitely better’.  

  **Sam:** But that reduces hard choices to ignorance or imprecision. My claim is stronger: In true parity cases, *there is no fact of the matter* about whether ten times the salary makes the job better, full stop. Not because our concepts are fuzzy, but because the alternatives belong to different evaluative ‘domains’—material security vs. creative fulfillment—that aren’t fully reducible to a common scale. The sweetener makes the job better *along one dimension*, but doesn’t resolve the *overall* comparison.  

  **Alex:** So what explanatory work does ‘parity’ do that vagueness doesn’t? Calling it ‘parity’ just gives a name to the indeterminacy.  

  **Sam:** No! Vagueness suggests the indeterminacy is *accidental*—a blurry boundary in an otherwise unified evaluative space. Parity posits a *structural* feature: The alternatives are comparable (we *can* say one isn’t clearly better), yet their values are constitutively heterogeneous. This explains *why* small improvements along one dimension (salary) don’t accumulate to overturn the comparison—they’re altering only one ‘axis’ of a multi-dimensional space. Like adding red paint to one of two abstract paintings: it might make that painting redder, but doesn’t necessarily make it *better overall* if ‘goodness in art’ isn’t reducible to chroma.  

  **Alex:** But why can’t vagueness handle multi-dimensionality? If ‘overall goodness’ is a function of security, meaning, salary, etc., and that function is vague, then small changes in one input might not shift the vague output from ‘roughly equal’ to ‘better’ until a *significant* threshold is crossed.  

  **Sam:** Because in parity cases, there *is no such function*. The values aren’t fungible. An improvement in salary doesn’t ‘compensate’ for a deficit in meaning; they’re different *kinds* of reasons. Your ‘function’ model assumes a single, latent cardinal scale—precisely what parity denies. Vagueness operates *within* a dimension; parity explains the *failure of aggregation across* dimensions.  

  **Alex:** I still think you’re reifying a psychological limit. We find choices hard because we’re bad at aggregating disparate values under vague predicates. Positing a sui generis relation feels like giving up. What test distinguishes ‘true parity’ from ‘mere high-dimensional vagueness’?  

  **Sam:** The persistence of the ‘merely on par’ intuition even under radical sweeteners *is* the test. If you can keep improving Option A along dimension X without ever making it determinately better than Option B—and crucially, without this seeming paradoxical or requiring ever-more-complex appeals to higher-order vagueness—that suggests the relation isn’t vague equality but something else. Vagueness predicts eventual tipping; parity doesn’t.  

  **Alex:** ...But maybe ‘eventual tipping’ is a misnomer. With higher-order vagueness, the transition isn’t just gradual—it’s essentially *ungovernable* by precise thresholds at any level. The sweetener argument assumes a false dichotomy: either precise equality or precise betterness, with vagueness as a messy middle. But if vagueness is fundamental, there’s no ‘middle’ to escape *to* via small improvements.  

  **Sam:** Then your account risks becoming unfalsifiable. If *no* amount of sweetening can compel the judgment that A is better—not because of parity, but because vagueness is infinitely elastic—haven’t you dissolved the distinction between indeterminacy and incommensurability?  

  **Alex:** Perhaps I have. And perhaps that’s where we should be. *[Sips coffee, looks unconvinced]* Your ‘parity’ still feels like a label for when the vagueness is especially stubborn... or when we value the struggle itself.  

  **Sam:** Or perhaps vagueness is the label we use when we haven’t grasped the deeper structure of the values at stake. *[Pauses]* Another espresso? This might take a while.  

  **Alex:** ...Make it a double.  

  *(The dialogue ends unresolved, mirroring the literature: Alex sees parity as an unnecessary complication of established vagueness phenomena; Sam sees vagueness as failing to capture the normative disunity underlying hard choices. The epistemological/metaphysical tension remains.)*  

  ---

  **Key Philosophical Moves:**  
  - **Sam (Parity):** Distinguishes *structural incommensurability* (parity) from *measurement imprecision* (vagueness). Argues sweeteners fail because values are heterogeneous, not because boundaries are fuzzy.  
  - **Alex (Vagueness):** Defends vagueness as sufficiently rich (via multi-dimensionality & higher-order vagueness) to explain persistent indeterminacy *without* a new relation. Charges parity with being explanatorily empty.  
  - **Core Sticking Point:** Whether the persistence of ‘on a par’ judgments under large sweeteners is best explained by *value heterogeneity* (Sam) or *complex vagueness* (Alex).
