answer: |-
  Your colleague's objection points to a genuine, philosophically rich asymmetry between aesthetic evaluation and other forms of knowledge—though her delivery may have been uncharitable. The discomfort you felt isn't just embarrassment; it stems from a fundamental difference in how we validate claims about art versus factual or interpretive claims. Here's a breakdown:

  ### 1. **The Epistemic Asymmetry: Testimony vs. Aesthetic Experience**
     - **Factual/Descriptive Claims** (e.g., "The novel uses a motif tracking memory loss"):  
       These are **testimony-transmissible**. Like historical/scientific facts, they can be verified indirectly. If trusted critics note a structural borrowing, you can reasonably adopt this observation. Your group accepted these because they function as *reports*.
     - **Evaluative Claims** (e.g., "The structure fails to earn its emotional payoff"):  
       These require **first-person aesthetic experience**. As Kant argued, aesthetic judgment demands *subjective universality*: you assert that others *ought* to agree, but only if they experience the work themselves. Repeating a critic’s verdict without that experience is like announcing a verdict on a symphony you haven’t heard—it lacks the grounding that makes aesthetic judgments meaningful. Your colleague wasn’t gatekeeping; she was defending the **phenomenology of reading**: the ending’s affective impact can’t be proxy-mediated.

  ### 2. **Why Aesthetic Verdicts Resist Delegation**
     - **The "What It’s Like" Problem**:  
       Dementia narratives rely on cumulative affective force. A critic’s description of the ending’s "failure" is a *report of their experience*, not a substitute for yours. As Scruton noted, aesthetic concepts like "earned payoff" are *response-dependent*—they exist only in the encounter between reader and text.  
     - **Hermeneutic Completeness**:  
       Fragmented structures (e.g., achronological dementia narratives) often derive meaning from their resolution. Assessing whether fragmentation "works" requires experiencing the *whole* pattern. A review can’t replicate the disorientation/revelation dynamic central to such texts.  
     - **Critical Consensus ≠ Truth**:  
       While convergent reviews suggest reliability, aesthetic value isn’t democratically determined. Your presentation masked the difference between *"Critics broadly conclude X"* and *"I conclude X"*. The latter implies personal warrant.

  ### 3. **Academic Context: Rigor vs. Gatekeeping**
     - **Legitimate Expectation**:  
       In a PhD reading group, primary engagement is the norm. Your colleague rightly noted that evaluating a novel’s success without reading it all is akin to analyzing a film’s third act based on its trailer. This isn’t gatekeeping but upholding disciplinary standards of evidence.  
     - **Nuance in Gatekeeping**:  
       Had you said, "Multiple critics argue the ending doesn’t land—here’s their evidence," objections might have been muted. Framing it as *your* verdict crossed into territory where your epistemic access was incomplete.  

  ### 4. **A Defense of Your Approach (and Its Limits)**
     - **Critical Synthesis as Scholarship**:  
       Your method—synthesizing reputable reviews—is valid *scholarly labor*. It becomes problematic only when presented as *personal aesthetic judgment*. Distinguish:  
       - ✅ **Acceptable**: "Critical consensus suggests the structure’s payoff falters, arguing that..."  
       - ❌ **Problematic**: "The structure fails to earn its emotional payoff."  
     - **Practical Reality**:  
       Academia demands triage. It’s unreasonable to expect full reading of every text. Transparency resolves this: "I haven’t finished yet, but prominent reviews like X and Y contend that..."  

  ### 5. **Resolving Your Unease**
     - **Your Embarrassment Isn’t Unjustified, But It’s Instructive**:  
       It signals your recognition that aesthetic evaluation carries an experiential burden absent in other domains. Historical facts rely on testimony; aesthetic judgments rely on *participation*.  
     - **Colleague’s Accuracy**:  
       She was right about the asymmetry but overly rigid in dismissing your contribution. A better response: "Can you elaborate on which critical arguments you find most convincing?"  

  ### Moving Forward: A Framework
  | **Type of Claim**       | **Epistemic Basis**        | **Acceptable via Testimony?** |  
  |--------------------------|----------------------------|-------------------------------|  
  | **Descriptive**          | Factual observation        | Yes (e.g., motifs, influences)|  
  | **Interpretive**         | Contextual analysis        | Partially (cite sources)     |  
  | **Evaluative (Aesthetic)**| Subjective experience      | **No**—requires direct engagement |  

  **Practical Advice**:  
  - **Own Your Synthesis**: Frame critical consensus as a curated scholarly insight, not personal verdict.  
  - **Defend the Method**: Point out that surveying reviews *is* legitimate literary analysis—it studies reception.  
  - **Read the Ending**: If the novel matters to your work, revisit it. The debate itself proves its stakes.  

  This asymmetry isn’t about elitism—it’s about what makes art *art*. Your colleague highlighted a core tenet of aesthetics: we can’t outsource the work of feeling. That’s not gatekeeping; it’s a reminder of why literature compels us.
