  Hmm, what's their real need here? They're a journalist, not a philosopher, so they need an intuitive explanation that won't lose their readers. The core tension is explaining why these two theories diverge on preemption cases like the assassin example, and why that matters practically. 

  First, let's unpack that rock-throwing paradox: Suzy throws first and shatters the bottle, Billy's throw is redundant. Counterfactual theory struggles because if you remove Suzy's throw ("but for" her), Billy would've broken it anyway - making her seem non-causal. But intuitively she clearly caused it. That's the breakdown they mentioned.

  Meanwhile interventionist theory asks: what if we physically intervened to stop Suzy's throw? Then Billy breaks it. But what if we fix Billy's throw as "not thrown" and wiggle Suzy's? When Suzy throws, bottle breaks; when she doesn't, it doesn't. So Suzy becomes causal through active manipulation.

  Why does this matter for self-driving cars? Imagine two systems: BrakeGuard (fails) and CollisionAlert (also fails, but redundantly). Counterfactual might say "but for BrakeGuard failing, the crash still happens due to CollisionAlert failing" - wrongly absolving BrakeGuard. Interventionist would test: if we force BrakeGuard to work, does crash still happen? Only if CollisionAlert also fails, but that's separate. 

