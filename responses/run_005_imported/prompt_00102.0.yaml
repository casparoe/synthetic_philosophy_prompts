answer: |-
  The problem of old evidence (POE) is indeed a profound challenge for strict Bayesian confirmation theory, and the Mercury-GR case is its canonical illustration. Glymour's critique exposes a tension between Bayesian formalism and the dynamics of scientific practice. Let's dissect the implications, solutions, and philosophical stakes.

  ### Core Problem & Implications
  1.  **Violation of Intuitive Confirmation:** POE shows that Bayesianism *as standardly formalized* cannot capture cases where known evidence E (Mercury's precession) confirms a new hypothesis H (GR) precisely because H *explains* or *entails* E. This contradicts scientific intuition and historical practice.

  2.  **Challenge to Logical Omniscience:** POE crucially depends on the idealization of **logical omniscience**. If an agent knows E (P(E)=1) and H entails E, then logically, P(E|H) = 1. The Bayesian likelihood ratio (P(E|H)/P(E)) collapses to 1, eliminating confirmation. The problem arises because real scientists (like Einstein) *discover the entailment relation* H ⊢ E *after* knowing E. This discovery is informative. POE thus reveals that modeling agents as logically omniscient (knowing all logical truths and consequences instantly) is inadequate for capturing the epistemic significance of *learning logical relationships*.

  3.  **Diachronic vs. Synchronic Tension:** Strict conditionalization is diachronic (update P_old to P_new upon learning E). POE highlights a different diachronic process: learning a *logical fact* (H ⊢ E) *after* E is already known. Standard Bayesianism struggles to model this "second wave" learning event cleanly.

  4.  **"Fatal" or "Wrinkle"?** It's not *fatal* to Bayesianism as a broad framework (probabilism + conditionalization), but it is a significant *wrinkle* exposing limitations in its *standard* idealizations (logical omniscience) and its *exclusive* reliance on synchronic probabilities for confirmation. It forces Bayesianism to become more nuanced or supplemented.

  ### Leading Proposed Solutions & Their Concessions
  Solutions aim to make the *discovery of the entailment* epistemically significant. All involve relaxing idealizations:

  1.  **Counterfactual Probabilities (Garber, Jeffrey, Niiniluoto):**
      *   **Idea:** Don't use the *actual* prior probability where P(E) = 1. Instead, consider the probability the agent *would have assigned* to E *before learning E*, but *after learning the conceptual framework/language necessary to formulate H* (and crucially, *without* knowing E yet). Calculate confirmation relative to this counterfactual prior P_cf.
      *   **Mercury Example:** Imagine Einstein *before* knowing Mercury's anomalous precession, but *after* developing the mathematical/conceptual tools of GR (or relativistic gravity generally). What probability P_cf(E) would he assign to the specific value of the precession? P_cf(E) would likely be very low (based on Newtonian expectations). When he then *discovers* GR entails E, P(E|H) = 1 (within this framework). The likelihood ratio P(E|H)/P_cf(E) is large, confirming H.
      *   **Concessions/Limitations:** Requires defining a plausible counterfactual prior, which can be messy and context-dependent. Moves away from purely synchronic actual probabilities. Raises questions about how to individuate "conceptual frameworks." Preserves core conditionalization for *new* evidence but relies on counterfactuals for *old* evidence.

  2.  **Learning Logical/Mathematical Facts (Garber, Field, Jeffrey):**
      *   **Idea:** Treat the discovery "H entails E" as learning a *new proposition*, often formalized as a logical truth L (H ⊢ E). Updating on L *changes the probability of H*, even though E is already known. Formally: P_new(H) = P_old(H | L).
      *   **Mercury Example:** Einstein learns L: "GR entails the precise Mercury precession value." Before learning L, P_old(H) might be moderate. Crucially, P_old(L) < 1 (he didn't *know* GR entailed it). P_old(H | L) is likely much higher than P_old(H | ~L) (if GR didn't entail it, it would be badly flawed). Updating on L significantly increases P(H).
      *   **Concessions/Limitations:** Requires abandoning logical omniscience (P_old(L) < 1). P_old(H | L) must be specified – often justified by the idea that H's ability to entail precise known data is surprising and explanatory. Strictly speaking, this update isn't *conditionalization on E*, but conditionalization on L *about* the relationship between H and E. Preserves conditionalization but shifts the object of learning.

  3.  **Explanationist/Abductive Bayesianism (Lipton, Douven, Psillos - often inspired by Salmon):**
      *   **Idea:** Confirmation isn't *just* about raising probability via conditionalization. The *explanatory power* of H with respect to E is crucial. Old E confirms H if H provides a *good explanation* for E, especially if E was previously anomalous or unexplained. Bayesianism needs supplementation with a theory of explanation.
      *   **Mercury Example:** Mercury's precession was a known anomaly unexplained by Newtonian physics. GR provided a deep, novel explanation derived from its core principles. This explanatory success constitutes confirmation, even if formal probability raising is tricky.
      *   **Concessions/Limitations:** This is often seen as a *supplement* or even a *competitor* to pure Bayesianism. It concedes that strict conditionalization alone is insufficient to capture confirmation and that concepts like explanation, coherence, and anomaly-resolution play irreducible roles. It moves Bayesianism closer to abduction (inference to the best explanation).

  4.  **Algorithmic/Information-Theoretic Approaches (e.g., inspired by Solomonoff, Hutter):**
      *   **Idea:** Focus on the *computational effort* or *compression* involved. Discovering that H entails E reveals that H concisely *describes* or *generates* the known data E. This compression of information is confirmatory.
      *   **Mercury Example:** GR provides a compact set of laws (H) from which the complex observational data (E) can be derived. Discovering this derivation shows GR efficiently captures the information in E.
      *   **Concessions/Limitations:** Shifts focus from subjective degrees of belief to objective algorithmic properties. May be less directly applicable to descriptive epistemology of human scientists. Complements Bayesianism but operates at a different level.

  ### Broader Philosophical Stakes & Implications

  1.  **Nature of Scientific Confirmation:** POE forces us to acknowledge that a significant part of scientific confirmation involves **re-evaluating known data in light of new theoretical structures**. It's not just about predicting the unknown; it's about *retrospectively making sense* of the known. Bayesianism must account for the epistemic weight of *explanatory integration* and *anomaly resolution*.

  2.  **Normative Model of Rationality:** POE challenges the **idealization of logical omniscience** as normatively desirable *or* descriptively adequate. It suggests a normative model of rationality must incorporate **bounded cognition** – agents learn logical/mathematical relationships over time, and this learning is rationally significant. Solutions 1 & 2 explicitly embrace this boundedness. This links Bayesianism to fields like computational epistemology and bounded rationality.

  3.  **Diachronic Rationality:** POE highlights the need for richer models of **diachronic rationality** beyond simple conditionalization on evidence propositions. Learning involves acquiring different *kinds* of knowledge: empirical data (E), theoretical hypotheses (H), *and* logical/mathematical relationships between them (H ⊢ E). A complete model needs to handle updates on all these types.

  4.  **Scope of Bayesianism:** POE tests whether Bayesian conditionalization can be the *universal engine* of rational belief update. Solutions 1 & 2 preserve conditionalization but alter the inputs (counterfactual priors or logical propositions). Solution 3 suggests Bayesianism needs fundamental supplementation. This impacts the ambition of Bayesianism as a complete epistemology.

  5.  **Link to Other Problems:** POE connects deeply to other challenges:
      *   **The Problem of New Theories (Poincaré, Worrall):** How to assign priors to radically new concepts (like curved spacetime)? Counterfactual approaches often rely on this.
      *   **Theory-Ladenness of Evidence:** The meaning and relevance of E might depend on H. POE solutions often implicitly assume E is stable.
      *   **Ravens Paradox & Instance Confirmation:** Issues of relevance and what constitutes "supporting evidence" are amplified when evidence is old.

  **Conclusion:** The problem of old evidence isn't a death knell for Bayesianism, but it is a powerful diagnostic tool. It reveals that **strict Bayesian conditionalization, coupled with logical omniscience, is insufficient to model the dynamics of scientific confirmation**, particularly the crucial role of *discovering entailments* and *explanatory power*. Successful solutions generally involve **relaxing logical omniscience** (allowing agents to learn logical truths) and/or **incorporating counterfactual or explanatory considerations**. This forces Bayesianism to become more psychologically realistic regarding logical learning and more integrated with other epistemic virtues like explanation. The core machinery of probabilism and conditionalization often survives, but its application becomes more complex and context-dependent, acknowledging the bounded nature of real agents engaged in discovery. The Mercury case isn't just an anecdote; it's a window into the fundamental interplay between logic, evidence, explanation, and rational belief change in science.
