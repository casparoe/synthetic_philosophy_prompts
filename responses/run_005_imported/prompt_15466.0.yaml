answer: |-
  Here’s a toast that threads the needle—honoring Marion’s intellectual legacy while keeping it warm, personal, and deeply human. It’s structured for ~5 minutes, with humor, heart, and a clear through-line on moral luck that *works* without lecturing:

  ---

  **(Clink glass lightly, warm smile)**  
  "Friends, family, colleagues—and especially you, Marion—gather ‘round. We’re here to celebrate a force of nature who, for 38 years, made the rest of us look like we were moving in slow motion.  

  When I first met Marion as a terrified intern, she ran the investigations desk like a chess master playing ten games at once. And she had this… *seminar*. A rite of passage. She’d describe two reporters: same thin tip, same relentless digging, same story filed. One wins prizes; the other watches a source’s life implode for reasons no fact-check could’ve caught. Then she’d ask the room: *Who deserves the bigger raise?*  

  *(Pause, glance at colleagues)*  
  …I see half of you shifting uncomfortably in your seats right now. *Yes*, you know that pause. That agonizing silence where you realized the ‘obvious’ answer felt suddenly monstrous. Marion would let that silence hang just long enough for sweat to form. Then she’d dissect why so many of us instinctively wanted to reward luck—the great cosmic dice roll—over integrity.  

  *(Turn to Marion, fondly)*  
  Marion, you never just *taught* that lesson. You *lived* it. For decades. You built a career staring down that paradox: How do we judge ourselves—how do we judge *anyone*—when so much hinges on winds we never controlled?  

  And here’s the thing: You didn’t just *ponder* it. You made it your moral architecture.  
  - When a story *you* broke won awards? You’d deflect praise onto the copy editor who caught the dangling modifier on page 7.  
  - When a tip quietly crumbled despite flawless work? You’d sit alone in your office, shoulders tight, quietly absorbing the weight.  

  That asymmetry—refusing credit for luck’s gifts, yet accepting blame for its cruelties—drove philosophers like Williams and Nagel up the wall. *‘Why hold yourself hostage to chance?’* they’d ask. But you understood something deeper: Journalism isn’t algebra. It’s alchemy. And the only way to navigate the chaos with honor is to plant your feet on what’s *yours*: The rigor. The empathy. The courage to question your own assumptions.  

  *(Lighten tone, smile)*  
  Now, her family might be thinking: *‘Moral luck? Asymmetry? Did we walk into a faculty meeting?’* Don’t worry. Here’s what it means in Marion-Voss-at-home terms:  
  - It means she taught her kids to own their mistakes fiercely—but wave away praise like it’s a mosquito.  
  - It means she’d spend 45 minutes crafting the *perfect* sarcastic birthday card… but blush if you called her ‘thoughtful’.  
  - It means her husband knows the exact sigh she makes when someone credits her for ‘good luck’—a sound equal parts humility and profound irritation.  

  *(Pivot, sincere warmth)*  
  So no, Marion. We’re not here because your gambles ‘paid off’. Luck’s a fickle co-author. We’re here because for 38 years, you showed us how to write *our* lines with integrity—regardless of how the universe edited them. You judged yourself only on the drafts you controlled: The care in your sourcing. The respect for the vulnerable. The relentless, principled *process*.  

  In a world obsessed with results, you championed character. In a profession haunted by chance, you became its moral compass.  

  So—raise your glasses. Not to the stories that won prizes. Not to the luck that smiled or didn’t. But to Marion Voss: The journalist who taught us that the only thing worth measuring is the depth of your dedication, the strength of your principles, and the courage to stand by both—no matter how the dice fell.  

  To Marion. The rarest kind of force: A truly *earned* legacy."  

  **(Raise glass higher)**  
  "To Marion!"  

  ---

  ### Why this works
  1. **Moral Luck as Engine, Not Decoration**: The toast *uses* the seminar & her asymmetry to explain *why* she’s remarkable—framing her refusal of unearned praise as heroic consistency.  
  2. **Avoids Both Traps**:  
     - No praising outcomes: Explicitly rejects "gambles paying off" as the reason for celebration.  
     - No Nagelian vertigo: Focuses on what *was* in her control (process, character) as her defining legacy.  
  3. **Family-Friendly Philosophy**: Translates complex ideas into homey, relatable moments (the birthday card, the sigh).  
  4. **Warmth & Humor**: The "faculty meeting" joke, specific quirks (deflecting praise to the copy editor), and familial love anchor the intellect in heart.  
  5. **Emotional Arc**: Starts with shared memory (colleagues), explains her significance (intellectual/ethical), pivots to her humanity (family), ends on universal admiration.  

  The final line ties it all together: Her legacy isn’t luck-dependent—it’s *earned* through unwavering character. That’s what makes it both philosophically sound and deeply moving.
