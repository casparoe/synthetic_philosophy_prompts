answer: |-
  You've hit on two profound tensions in Hume's account that remain live debates today. Let's untangle them systematically:

  ### 1. The Counterfactual-Regularity Equivalence Claim
  Hume *does* present the counterfactual ("if A had not been, B never had existed") as interchangeable with constant conjunction ("all similar A's followed by similar B's"). This equivalence is **not logically necessary**, and Hume likely fudges it. Here's why:

  - **The Gap**: Constant conjunction describes *observed patterns* (what *has* happened). Counterfactuals describe *what would happen* in unobserved scenarios. Hume bridges this gap with his radical empiricism:
    - For Hume, we have no impression (experience) of "necessary connection" or modal force. The *only* content for the idea of causation comes from experience of constant conjunction *plus* the feeling of expectation/custom.
    - The counterfactual statement is **epistemically parasitic** on the regularity: We *infer* the truth of the counterfactual *solely* from our experience of constant conjunction and the customary transition of thought it induces. If we've *always* seen B follow A, and never seen B without A, our mind naturally concludes "No A, no B." It's a psychological extrapolation, not a logical deduction.
    - **Hume's Implicit Premise**: He assumes a **closed, deterministic universe** where constant conjunction is absolute and exceptionless. In such a world (which Hume presupposes for causal relations), the two statements *are* co-extensive: Universal regularity *entails* the counterfactual dependence *for the observed instances*. If A *always* causes B, then *this* B wouldn't have occurred without *this* A. Modern counterfactual theories (like Lewis's) explicitly build on this but use possible worlds to handle exceptions and overdetermination – tools Hume lacked.

  **Verdict:** It's a **fudge driven by empiricist constraints**. Hume reduces the counterfactual's meaning *to* the evidence we have for it: observed regularity and custom. He denies any deeper metaphysical "oomph" making the counterfactual true independently. For Hume, "If A hadn't happened, B wouldn't have" *just means* "In all my past experience, B-like things only happened after A-like things, so I expect this B wouldn't have happened without this A."

  ### 2. The Modern Humeans & the "Dropped" Second Definition
  Your observation is astute. Contemporary Humeans (Lewis, Loewer, Cohen, etc.), especially Best System Analysis (BSA) proponents, **radically downplay or explicitly reject Hume's second, psychological definition**. This is a **significant departure** from Hume's core project, but arguably a *principled* one within their framework:

  - **Why Modern Humeans Drop Definition #2:**
    - **Target: Objectivity of Laws/Chance:** Their goal is to provide a *metaphysical* account of laws of nature and objective chance *without* invoking necessary connections or non-Humean powers. Definition #1 (constant conjunction/regularity) provides the raw material for this project.
    - **Psychologism is Problematic:** Definition #2 makes causation intrinsically mind-dependent. If laws are *just* patterns that induce expectations in human minds, then:
      * Laws wouldn't exist without minds (absurd for science).
      * Aliens or AI with different psychologies might have different "laws."
      * Laws seem subjective or species-relative.
    - **BSA's Solution:** They reinterpret the core insight of regularity *objectively*. Laws are the true, objective regularities that best balance **simplicity** and **strength** in describing the universe's entire spacetime history (the "Humean Mosaic"). "Best" is defined by the standards of science (e.g., compression, predictive power), not individual psychology. Custom/expectation becomes an *epistemic consequence* of the laws, not constitutive of them.

  - **Is This Principled? Yes and No:**
    - **Principled:** They preserve Hume's core *denials*: no necessary connections, no irreducible modality in the world, supervenience of laws/chance/causation on the "Humean Mosaic" (the pattern of particular matters of fact). They provide a rigorous, non-psychological account of *objective* laws based *only* on regularities (Definition #1).
    - **Unprincipled/Domesticating:** They fundamentally **reject Hume's projectivism** (Definition #2). For Hume, the *feeling* of necessity/custom *is part of the concept* of causation. Modern Humeans treat the psychological aspect as purely *epistemological* (how we *know* laws/causes) or even eliminable. They aim for a "realist" (though non-governing) picture of laws *in the world*, whereas Hume located necessity *only* in the mind. **Modern "Humeanism" is more accurately "Humean Supervenience" – it inherits the ontology but jettisons the psychology.**

  **The Crux:** Modern Humeans want **objective, mind-independent laws** grounded *only* in regularities. Hume himself, via Definition #2, implies that **causal necessity *is* the mind's projection** onto regularity. Modern Humeans effectively say: "We'll take the regularity foundation (Definition #1), but instead of grounding necessity in psychology (Definition #2), we'll use an objective standard (like BSA's simplicity/strength) to *define* laws (and thus necessity/causation) *within* the mosaic."

  **Conclusion for Your Seminar:**

  1.  **On the Counterfactual:** Hume's equivalence claim rests on his strict empiricism and implicit determinism. He *reduces* the counterfactual's meaning to the evidence for it (observed regularity + custom), denying any independent modal truth. It's a fudge only if you believe counterfactuals have deeper metaphysical grounding.
  2.  **On Modern Humeanism:** Contemporary Humeans *do* fundamentally alter Hume's view by dropping Definition #2. They preserve his core *ontology* (no necessary connections, supervenience on particulars) but replace his *psychologistic account of necessity* with an *objective, functional* account (e.g., laws as axioms of the best system). **Yes, this makes modern "Humeanism" significantly less projectivist than Hume himself.** Hume saw the *mind* as injecting necessity; modern Humeans see necessity (as lawhood) as an objective *feature of the pattern* itself, defined by scientific virtues. They aim to save the objectivity of science from Hume's psychological subjectivism.

  **In short:** Modern Humeanism is a *revision* of Hume, strategically dropping the psychology to salvage an objective account of laws from the rubble of his empiricist critique. Whether this is faithful or heretical depends on whether you prioritize Hume's core denials or his specific psychological account of necessity. For understanding laws of nature as objective features of the world, modern Humeans *need* to drop Definition #2.
