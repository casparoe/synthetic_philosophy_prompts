  I'll avoid name-dropping Aumann or technical terms. Instead, phrases like "everyone seeing everyone see it" can convey common knowledge intuitively. For the laugh, a light tease about Priya's academic habits ("if Priya had her way...") feels warm and insider-y without excluding others. 

