answer: |-
  ## The Whiskey & Likelihood Debate: Optional Stopping at the Conference Bar  

  **Setting:** *A dimly lit conference bar, post-session on replication crises. Dr. Evelyn Frost (Frequentist, sharp, mid-50s) sips whiskey. Dr. Leo Vance (Bayesian, calm, late-40s) swirls sherry. The conversation turns to stopping rules.*  

  **Evelyn:** ...So, Leo, that talk on p-hacking—utterly predictable. But what terrifies me is how *normalized* optional stopping remains. Like that poor PhD student’s case today. Collect data until *p*<.05? It’s statistical fraud wrapped in methodological ignorance.  

  **Leo:** Ah, the optional stopping boogeyman. Evelyn, you know I respect your rigor, but this fixation on sampling intentions is precisely why psychology’s drowning in uninterpretable *p*-values. The data’s evidence is *in the data*, not the ghost of an experimenter’s unobserved intentions.  

  **Evelyn:** *(Leans forward)* It’s not about "ghosts"! It’s about verifiable error control. Let me simulate it for you: Generate 10,000 *true null* experiments. After each participant, test at *α*=0.05. Stop when *p*<.05 or at *n*=100. What’s the false-positive rate?  

  **Leo:** I know the answer—it’s not 5%. It balloons toward 20%, 30%, even higher depending on when you peek. But that’s an indictment of *p*-values as evidence measures, not of stopping when data looks compelling.  

  **Evelyn:** Exactly! And that inflated Type I error is a *fact*. Ignoring the stopping rule means reporting *p*=0.04 as if it came from a fixed-*n* design, when its long-run false-positive rate might be 25%. You’re selling a false guarantee of reliability.  

  **Leo:** *(Raises a finger)* But that "long-run" is a hypothetical sequence of experiments *I didn’t run*. I ran *one* experiment. The likelihood function—*L*(θ | x₁, x₂, ..., xₙ)—depends *only* on the observed data. Stopping because *p*<.05 or because funding ran out doesn’t change *L*(θ). Why should it change my inference?  

  **Evelyn:** Because inference isn’t just about *this* dataset! It’s about building procedures that *control error rates across hypothetical repetitions*. Science is cumulative! If I use your optional-stopping procedure 100 times, I’ll falsely reject true nulls far more than 5% of the time. That’s catastrophic for replication.  

  **Leo:** And if I use *your* fixed-*n* procedure 100 times, I’ll waste resources collecting data long after evidence is clear! But let’s press your "repetitions" argument. What if the researcher *never* had a clear stopping intention? Say they planned *n*=50, but got tired at *n*=42. Or they just kept adding subjects until "it felt right." What’s your error rate *then*?  

  **Evelyn:** *(Sighs)* That’s messy. Ideally, we pre-register stopping rules. But if intentions are vague, we must bound the worst-case error rate or use sequential methods. The point is—  

  **Leo:** —The point is your approach collapses under the weight of undefined counterfactuals. My Bayesian posterior *P*(θ | data) or a likelihood ratio depends only on the actual data. It doesn’t care if I stopped at *n*=42 because of *p*<.05, a headache, or an asteroid warning. The *evidence* is invariant. That’s the Likelihood Principle (LP).  

  **Evelyn:** And the LP ignores performance! Look—suppose two researchers study the same effect. Researcher A plans *n*=100. Gets *p*=0.04 at *n*=100. Researcher B checks every 10 subjects, stops at *n*=60 with *p*=0.04. Same data up to *n*=60. You’d give them identical inferences?  

  **Leo:** Yes! Because they have identical data! The fact that B *might* have continued if *p*>0.05 is irrelevant to what the data *at n=60* says about θ.  

  **Evelyn:** But their procedures have radically different error properties! Under B’s approach, a *true null* would have produced *p*<0.05 at *some n* ≤60 with much higher probability than 5%. Ignoring that is ignoring a quantifiable risk of false discovery.  

  **Leo:** You’re conflating *evidence* with *decision rules*. The *p*-value *is not evidence*; it’s a tail probability under H₀. A Bayes factor (BF) *is* evidence. Calculate the BF for A and B using the *same data up to n=60*. It’s identical. The stopping rule is irrelevant for evidential interpretation.  

  **Evelyn:** But BF’s *calibration* can depend on the stopping rule! If you use optional stopping with Bayes factors, you can also inflate false positives unless you adjust your priors or use proper sequential designs.  

  **Leo:** True, but the *adjustment is in the prior or decision rule*, not in the likelihood. The core evidential summary—the BF—respects the LP. We *can* design Bayes-friendly sequential tests. But for *retrospective interpretation of existing data*, the stopping rule is epistemologically inert. Your approach demands knowing unknowable intentions.  

  **Evelyn:** *(Pauses, swirls whiskey)* ...Alright, point taken on vague intentions. But science needs *standards*. If we let people peek and stop freely, even with Bayes, sloppy researchers *will* exploit it. We need procedures robust to human bias.  

  **Leo:** Agreed! That’s why *pre-registration* and *planned analyses* matter—for *design*, not for *analysis*. Design to control error rates; analyze based on evidence. The PhD student’s sin wasn’t stopping at *p*<.05 *per se*; it was using a procedure unfit for frequentist inference *without reporting it*.  

  **Evelyn:** *(Nods slowly)* So... we agree optional stopping invalidates *uncorrected* frequentist inference?  

  **Leo:** Absolutely. And we agree science needs transparency and error control?  

  **Evelyn:** Of course.  

  **Leo:** Then here’s the synthesis:  
  1. **For Frequentists:** Report *sequential* p-values or use alpha-spending functions if you peeked.  
  2. **For Bayesians:** Report Bayes factors or posteriors (respecting the LP), but beware optional stopping can distort BFs if priors are weak.  
  3. **For Everyone:** Pre-register stopping rules and analyses. If you deviated, *say so*.  

  **Evelyn:** *(Raises glass)* So, the student should re-analyze their data with a proper sequential method or a Bayesian approach—and transparently report the stopping rule. No hiding.  

  **Leo:** *(Clinks glass)* Precisely. Ignoring the stopping rule is fatal for *p*-values, irrelevant for likelihoods, and dangerous for science without transparency. The LP tells us *how to interpret data*; frequency properties tell us *how to design studies*. Both matter, but don’t conflate them.  

  **Evelyn:** ...Alright, Leo. For once, I’ll drink to that.  

  ### Key Dialectical Progress  
  1. **Frequentist Concession:** Vague stopping "intentions" undermine strict frequentist error-rate calculations.  
  2. **Bayesian Concession:** Optional stopping *can* affect Bayesian decision rules/calibration if not handled properly.  
  3. **Synthesis:**  
     - Stopping rules *do* affect *p*-value interpretation (invalidating them if ignored).  
     - Stopping rules *do not* affect the likelihood function/Bayesian evidence *for fixed data*.  
     - **Transparency and design** are paramount: Pre-register stopping rules, and choose analyses consistent with your design (frequentist sequential tests) or your philosophy (Bayesian respecting LP).  

  **For Your Revisions:** Re-analyze your data using a Bayesian approach (reporting the posterior/Bayes Factor) *or* a corrected frequentist sequential test. Crucially, **disclose the stopping rule prominently** and discuss its implications. The reviewer’s objection is valid for frequentist inference; your co-advisor’s view holds for evidential interpretation under the LP. The path forward is transparency and methodological consistency.
