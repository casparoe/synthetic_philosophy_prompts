prompt: |-
  Okay, I need a tiebreaker because my friend Dan and I got into it again last night (we do this every couple months, it's a whole thing) about what Bell's theorem actually proves, and neither of us walked away happy. Dan's position, which he insists is just "the standard physics view," is that Bell's theorem refutes local realism, and that this leaves an escape hatch: you can keep locality and just ditch "realism" instead (i.e., say particles don't have definite properties until they're measured, sort of a Copenhagen move), so nonlocality is a choice we make by insisting on hidden variables, not something forced on us. I was arguing something I half remember from a philosophy of physics book, I think it was Maudlin or someone from that Bohmian-mechanics crowd, that Bell never actually smuggled in a seperate "realism"/determinism assumption to begin with: in the original 1964 paper he derives determinism from locality plus the perfect EPR correlations rather than assuming it, and by the later 1976 and 1990 papers he'd reformulated the whole argument around something called "local causality," applied directly to theories with random (not just deterministic) hidden variables, with no determinism assumption anywhere, and you still land on the same inequality. So on my reading "keep locality, drop realism" was never really a coherent third option, it's locality doing all the work under a misleading label.

  We never actually settled it, mostly because neither of us could reconstruct the 1964-versus-1976 argument carefully enough on the spot, and a few beers in isn't exactly conducive to doing algebra on hidden-variable correlation functions. Could you write me an essay that actually reconstructs both derivations well enough to judge this properly, and then commits to a real answer instead of hedging? I want to know: is "local realism" a fair name for what Bell's theorem rules out, such that you can genuinely save locality by rejecting "realism," or is that just a sloppy way of talking that obscures what the theorem is actually doing? Weigh it like a philosopher of physics would in an actual paper, but don't leave me with a wishy-washy "it depends what you mean by realism" -- pick a side and defend it.
