  1.  **Core Asymmetry:** The joke turns *entirely* on the fact that Alice isn't dominated by any pure strategy (Bob or Charlie individually fails the strict inequality test against her across all opponent plays), but *is* dominated by a specific mixed strategy (the 50/50 mix of Bob and Charlie).
