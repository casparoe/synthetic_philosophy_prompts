  3.  **"By Hand" Nuance:** It references the need to check payoffs "across all their possible moves" (the columns) for pure dominance, contrasting it with the dominance holding "in every contingency" against the mix. The "sad, non-convex spot" is a direct nod to the geometric interpretation and the linear algebra involved in checking mixed strategy dominance via systems of inequalities.
