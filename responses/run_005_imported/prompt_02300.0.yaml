  **The Setup:**  
  Alice, Bob, and Charlie are three pure strategies nursing drinks at the *Rational Actor's Saloon*. Alice is feeling smug.

  **Alice:** (Raising her glass) "Cheers, boys! Just survived the first round of elimination. Clean sweep! Bob, you can't dominate me. Charlie, you can't dominate me. Individually, neither of you touches my payoff profile against the column players. I'm undominated! Safe for good."

  **Bob:** (Grunting into his beer) "Against Player 2's Strategy X, I beat you soundly."
  **Charlie:** (Adjusting his glasses) "And against Player 2's Strategy Y, *I* outperform you significantly."
  **Alice:** "Exactly! But Player 2 doesn't *only* play X or *only* play Y! Against any *single* pure strategy they might pick, neither of you is strictly better than me across *all* their possible moves. Bob, you lose to me when they play Y. Charlie, you lose when they play X. I'm robust against you *individually*."

  **The Punchline:**  
  The Bartender (a wizened figure known as "Mix Master Max") leans over the bar, polishing a glass shaped suspiciously like a simplex.  
  "Hold your horses, Alice," he rumbles. "You're right, neither Bob *nor* Charlie dominates you alone. But see this?" He pours Bob's pint and Charlie's lager into a single, frothy stein. "This here's a 'Half-Bob, Half-Charlie' Special. Against *this* mixed strategy... well, let's just say the expected payoff for Player 2 choosing it against you is strictly higher than against either Bob or Charlie *by themselves*, no matter what Player 2 does. Your payoffs? Strictly lower against that mix in every contingency. Individually, they couldn't touch you. But averaged together? Sorry, Alice. You just got dominated. Time to settle your tab and vanish from existence."

  *(Alice's smug expression fades as she realizes her payoffs form a sad, non-convex spot easily dominated by the convex combo of Bob and Charlie. She dissolves into a faint shimmer of dominated strategy regret.)*

