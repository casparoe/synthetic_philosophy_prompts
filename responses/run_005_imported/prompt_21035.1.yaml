answer: |-
  Based on Bentham's core principles and methodology, his approach to legal recognition for multi-partner relationships would likely involve rigorous application of the utility calculus, not automatic endorsement driven by hostility to antipathy. Here's a reconstruction of his probable reasoning, grounded in his conceptual apparatus:

  1.  **Immediate Decriminalization of Private Conduct:** Bentham would unequivocally oppose criminalizing private, consensual sexual acts between adults, regardless of number, based on his established arguments:
      *   **Principle of Asceticism/Sympathy & Antipathy:** Criminalization based *solely* on perceived "unnaturalness," disgust, or religious doctrine violates the utility principle. These are "groundless antipathies" without calculable harm.
      *   **Taxonomy of Offences:** Such acts, if private and consensual, fall outside his categories of public offences, offences against person, property, reputation, or condition. They are "self-regarding" or purely "consensual" acts causing no direct, non-consensual harm to assignable individuals or the security framework essential for happiness.
      *   **Felicific Calculus:** Criminalization creates immense negative utility: pain of punishment, fear, stigma, enforcement costs, blackmail potential, and suppression of pleasure – all without demonstrable countervailing prevention of harm to others.

  2.  **Legal Recognition (Marriage-Equivalent Status): A Separate Utility Calculation:** Extending formal legal recognition is fundamentally different from decriminalization. It involves *creating or modifying a complex legal institution* with wide-ranging social and economic consequences. Bentham's support would be contingent *entirely* on a positive net utility calculation, weighing:
      *   **Potential Benefits (Pleasures):**
          *   **Security & Expectation:** Formalizing relationships provides security (emotional, financial), stabilizes expectations, and reduces anxiety for participants, generating significant pleasure.
          *   **Contractual Clarity:** Legal frameworks could potentially resolve ambiguities in multi-party obligations (support, inheritance, medical decisions, property) more effectively than private contracts alone, preventing future disputes and pains.
          *   **Reduced Stigma:** Recognition might reduce social stigma and associated psychological pain for participants.
          *   **Happiness Gains:** Increased happiness for individuals whose relational preferences are formally recognized and supported.
          *   **Efficiency:** *If* well-designed, a standardized framework *might* be more efficient than bespoke legal arrangements for every polycule.
      *   **Potential Costs (Pains) & Complications:**
          *   **Evidentiary & Contractual Complexity:** Bentham was acutely aware of the "fictitious entity" of legal relations and the need for clarity. Multi-party obligations introduce significant complexity:
              *   Defining consent, entry, and exit for individuals within the group.
              *   Distributing responsibilities (support, debts) equitably and enforceably.
              *   Resolving internal disputes legally (e.g., division of assets upon partial dissolution).
              *   Potential for increased litigation due to ambiguity.
          *   **Children's Welfare:** Bentham prioritized the interests of children as vulnerable, non-consenting parties. He would demand rigorous evidence on:
              *   Stability and security of care arrangements in multi-adult households.
              *   Clarity of legal parental rights and responsibilities among multiple adults.
              *   Potential for conflict or confusion affecting child well-being.
              *   Inheritance and support obligations towards children.
          *   **Institutional Integrity & Social Utility:** Bentham saw marriage (or civil union) primarily as a utilitarian institution promoting stability, security of expectations, orderly property transmission, and child-rearing – all contributing to general happiness. He would question:
              *   Whether multi-party recognition *enhances* or *undermines* this institutional utility.
              *   Potential for fraud or exploitation (e.g., using recognition for immigration or tax benefits without genuine relationships).
              *   Administrative costs and burdens on the legal system.
          *   **Unintended Consequences:** Bentham was cautious about radical changes to foundational institutions without evidence. He would worry about unforeseen ripple effects on areas like taxation, social security, inheritance law, and even concepts like next-of-kin in emergencies.

  3.  **The Likely Benthamite Conclusion: Cautious, Evidence-Based Pragmatism, Not Ideological Commitment**
      *   **Hostility to Antipathy ≠ Automatic Support:** His rejection of antipathy as a basis for law compels him to *consider* recognition seriously and reject arguments based *only* on disgust. It does *not* compel him to support it regardless of consequences. His commitment is to utility, not libertarian maximalism.
      *   **Presumption for Individual Liberty, Burden of Proof on Institutional Change:** Bentham would start with a presumption that individuals should be free to form consensual relationships. However, *extending state recognition and the legal privileges/obligations of marriage* is an affirmative act requiring a positive demonstration of net utility. The burden of proof lies on proponents to show the benefits outweigh the complexities and risks.
      *   **Empirical Scrutiny is Paramount:** Bentham would insist on evidence before proceeding. He would demand studies on:
          *   The prevalence and stability of multi-partner relationships seeking recognition.
          *   Outcomes for children raised in such households compared to other structures.
          *   The feasibility and effectiveness of proposed legal frameworks for handling multi-party contracts, disputes, and responsibilities.
          *   Comparative analysis of administrative costs and societal impacts.
      *   **Incrementalism & Neutral Frameworks:** Facing uncertainty and complexity, Bentham might advocate for:
          *   **Enhanced Private Contracting:** Robust legal recognition and enforceability of private agreements (cohabitation, financial, parental) between multiple adults as a first step, allowing solutions to evolve without redefining core institutions immediately.
          *   **Civil Union/Partnership Models:** Exploring legal recognition through new, potentially more flexible partnership frameworks distinct from traditional marriage, designed specifically to handle multi-party complexities, as a test case. He preferred functional, neutral legal mechanisms over sentiment-laden institutions.
          *   **Phased Implementation:** Starting with limited recognition (e.g., healthcare decisions, inheritance among partners) and expanding cautiously based on evidence of success and manageable complexity.
      *   **Opposition Without Evidence of Net Utility:** If the evidence suggested significant unresolved complexities causing demonstrable harm (especially to children), increased litigation, administrative chaos, or a net undermining of the security and stability functions of legal relationship recognition, Bentham would likely oppose formal state recognition *at that time*, regardless of his sympathy for the individuals' desires. He might still support decriminalization and improved private contracting options.

  **In essence:** Bentham would champion the decriminalization and social toleration of multi-partner relationships, fiercely attacking any laws based solely on antipathy. However, regarding formal legal recognition equivalent to marriage, his utilitarian calculus would make him an **empirically-driven pragmatist, not an automatic advocate**. He would demand compelling evidence that the benefits (security, reduced stigma, happiness) demonstrably outweigh the significant potential costs and complexities (contractual/evidentiary challenges, risks to children, institutional strain). Without such evidence, his characteristic caution regarding institutional reform would likely lead him to support enhanced private contracting solutions but hesitate or even oppose state-sanctioned multi-party marriage, viewing it as a potentially utility-reducing experiment until proven otherwise. His commitment was to consequences, not consistency with a simplistic reading of his sexual liberalism.
