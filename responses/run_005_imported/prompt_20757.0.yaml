answer: |-
  You've hit on a fundamental tension in human interaction – how to reconcile legitimate frustration with genuine compassion when someone's personal suffering impacts your work. Your partner's options are **logically clean but emotionally incomplete** because they ignore the messy reality that humans operate in shades of grey. There *is* a coherent middle ground that honors both your feelings and Dave's situation. Here's how to navigate it:

  **The Middle Ground: Compassionate Accountability**

  This isn't about pretending you're not annoyed or treating Dave like a broken server. It's about separating the **person** from the **impact**, and managing both with different tools:

  1.  **Acknowledge Both Realities Simultaneously:**
      *   **"Dave is going through hell, and his capacity is severely diminished right now."** (Compassion for the person)
      *   **"Dave's diminished capacity is causing significant, repeated problems that impact me, the team, and the company, and that frustration is valid."** (Accountability for the impact)
      *   **These statements are NOT mutually exclusive.** Holding both in your mind *is* the logical consistency you seek. It's the difference between *blame* (which often requires full agency) and *responsibility* (which exists regardless of cause).

  2.  **Redirect Your Annoyance Towards Constructive Action (Not Dave):**
      *   **Target the Process/Safeguards:** Instead of seething at *Dave* for the midnight hotfix, channel that energy into asking: "What systemic changes can prevent *anyone* (including someone struggling like Dave) from causing this outage again?" Push for:
          *   Better hotfix deployment checklists (automated if possible).
          *   Mandatory pre-deployment peer review for critical fixes, *especially* from someone under duress.
          *   Improved monitoring/alerting to catch failures *before* they take down prod.
          *   Clearer handoff protocols ("Dave, can you confirm the fix is deployed and verified in staging before we mark this resolved?").
      *   **Target Management:** Your manager is responsible for balancing team output with individual support. Your valid frustration should be *directed upwards* constructively:
          *   "Manager, I understand Dave is going through a tough time, and I want to support him. However, the incident last Friday highlights a real risk. What temporary adjustments can we make to his responsibilities or what additional safeguards can we put in place to protect the team and production while he works through this? I'm concerned about burnout for others picking up the slack during critical incidents."
          *   "Can we discuss temporary workload redistribution or pairing him with a buddy for critical tasks until his capacity stabilizes?"

  3.  **Adjust Your *Behavior* Towards Dave (Not Necessarily Your Feelings):**
      *   **Be Professionally Neutral, Not "Short":** You don't need to be his best friend. Focus on being calm, factual, and task-oriented in interactions. Instead of a curt "Is it done yet?", try "Dave, what's the status update on X? Do you need any blockers cleared?" (This isn't forgiveness; it's de-escalation).
      *   **Set Gentle but Firm Boundaries:** "Dave, I see you're still working on Y. Since the deadline was yesterday, I need to take it over now to meet the client commitment. Can you hand off what you have?" (Protects the work, acknowledges the miss without personal attack).
      *   **Separate the Action from the Person:** Think/Say: "That *decision* caused a problem," not "Dave *is* a problem."

  4.  **Manage Your Own Resentment & Guilt:**
      *   **Acknowledge the Feelings are Valid:** Tell yourself: "It's okay to be furious that I was up until midnight fixing something preventable. It's *also* okay to feel sad that Dave is suffering. Both feelings can exist."
      *   **Focus on What You Control:** You control your reactions, your communication with your manager, your push for better systems. Pour energy into *those* things, not into ruminating on Dave's actions.
      *   **Protect Your Time:** If Dave is chronically late/missing deadlines, *stop relying on his output for your own critical path work*. Build buffers where possible. This isn't "routing around him like infrastructure," it's pragmatic risk management for *your* sanity. Tell your manager this is necessary.
      *   **Seek Support (Professionally):** Talk to your manager *again* about the *ongoing impact*. Frame it as a team health/risk issue: "The current situation is unsustainable for team morale and reliability. What's the plan?"

  **Why This Isn't a Contradiction:**

  1.  **Complex Causality:** Dave's depression/divorce *explains* his unreliability, but it doesn't *erase* the consequences. Explanation ≠ Absolution. You can understand the *why* without being okay with the *what*.
  2.  **Shared Responsibility:** Your manager has a responsibility to the *whole* team. Allowing one person's struggles to chronically burden others without mitigation *is* a management failure. Your resentment is partly misdirected – some should rightly land on management for not creating adequate safeguards or adjustments.
  3.  **Professionalism vs. Friendship:** You can behave professionally and supportively towards a colleague in crisis *while* holding the professional standard that their output needs to be managed differently (by them *and* management) to prevent harm.

  **Concrete Actions:**

  1.  **Document (Privately/For Manager):** Keep factual notes on incidents caused by Dave (date, impact, root cause - e.g., "Missed deployment step," "Missed deadline causing delay for X"). Use this for discussions with your manager about risk, not to shame Dave.
  2.  **Push for Systemic Fixes:** Be the advocate for better processes that protect the team *from any single point of failure*, human or machine.
  3.  **Communicate Needs to Manager:** "I need Dave's tasks to have clearer ownership handoffs if deadlines are missed," or "I need assurance that critical path work isn't solely dependent on someone whose capacity is currently volatile."
  4.  **Practice Neutral Language:** Replace accusatory tones with factual, solution-focused communication *to* Dave.
  5.  **Accept the Ambiguity:** Understand that "compassionate accountability" requires ongoing effort. Some days the annoyance will win, some days the compassion will. That's human.

  **What This Middle Ground Avoids:**

  *   **False Forgiveness:** You aren't pretending Dave's actions were fine. You're acknowledging the harm while understanding the context.
  *   **Dehumanization:** You aren't treating Dave like a broken server. You're recognizing his humanity (he's suffering) AND his agency (he's still responsible for his work, even if impaired, and management is responsible for supporting him appropriately).
  *   **Passive Suffering:** You're actively protecting yourself and the team through process changes and communication.

  The logic here is the logic of complex systems and human psychology: inputs (Dave's crisis) lead to outputs (errors) that have consequences (your frustration, prod outages). Your role isn't to excuse the inputs or ignore the outputs, but to work with the system (your team, your manager) to install better safeguards and feedback loops to manage the consequences constructively. That's the coherent path forward.
