answer: |-
  You're right to feel uneasy—your friend's actions raise significant ethical concerns, even if her intentions are benign. While she may believe no harm is done, the issue involves multiple layers of potential wrongdoing:

  ### 1. **Violating the Child's Future Autonomy & Dignity**
     - **Consent Matters**: A child can't consent to their private moments being broadcasted. By the time her son *is* old enough to understand (likely 8–12 years old), his childhood vulnerability will already be permanently documented online. Even if deleted, content can persist through screenshots, reposts (as happened with the birthday video), or archives.
     - **Embarrassment Isn't the Only Harm**: It’s not just about future embarrassment—it’s about **agency**. Her son might resent his intimate struggles being used for content, regardless of whether others see it. Parenting struggles are human, but turning a child’s rawest moments into public content commodifies their vulnerability.
     - **Digital Footprint**: She’s creating a permanent digital identity *for him* without his input. Future peers, educators, or employers *could* encounter these images if they resurface, regardless of her deletion plans.

  ### 2. **Safety and Exploitation Risks**
     - **Uncontrolled Circulation**: The birthday party video’s spread proves she can’t guarantee privacy. Content shared online can be downloaded, reshared, or end up on predatory sites (e.g., "tantrum compilations" or worse).
     - **Normalizing Oversharing**: Posting meltdowns/potty training risks normalizing the exploitation of children’s distress for engagement. Even "supportive" comments can incentivize sharing increasingly private moments.

  ### 3. **The Parent-Child Relationship**
     - **Trust Implications**: If her son later discovers these posts, it could damage trust. He may feel betrayed that his most vulnerable moments were broadcasted for strangers’ consumption.
     - **Objectification**: Framing his struggles as content for her social circle shifts focus from his needs to her narrative. The *child* becomes a prop in her parenting story.

  ### 4. **Societal Harm**
     - **Cultural Precedent**: It reinforces a culture where children’s privacy is disregarded because they "won’t remember" or can’t object. This erodes norms protecting minors.
     - **Dignity of Childhood**: Children deserve dignity even if they can’t articulate it. Documenting their lowest moments for public consumption treats them as less than full human beings with inherent privacy rights.

  ### Why Her Reasoning Falls Short:
  - **"He won’t see it"**: Unverifiable. Deletion isn’t foolproof, and algorithms/archives exist.
  - **"He can’t be embarrassed now"**: True, but future harm is foreseeable. We protect infants from things they can’t comprehend (e.g., sunburn) because harm is *inevitable* without intervention.
  - **"I’ll delete it later"**: Ignores the *current* audience (strangers, acquaintances) witnessing his private moments.

  ### How to Address This (Without Judging Her Parenting):
  - **Lead with empathy**: *"I know you’re sharing to connect with other parents, and parenting is tough! But after the birthday video spread, I worried about [Son]’s privacy long-term. What if he feels exposed in 10 years?"*
  - **Shift focus to solutions**: Suggest anonymized sharing ("My toddler had a public meltdown today—solidarity, parents!") or private groups.
  - **Cite experts**: Refer to the [American Academy of Pediatrics’ guidelines](https://www.healthychildren.org/) on digital sharing or resources like [Wait Until 8th](https://www.waituntil8th.org/) advocating for children’s online privacy.
  - **Respect your role**: *"I know I’m not a parent, so I might not get it all—but I care about you and [Son], so I had to speak up."*

  ### The Bottom Line:
  Yes, your friend is likely doing something wrong—**to her son**. She’s prioritizing her momentary need for support/validation over his lifelong right to control his digital identity. Even if the content never resurfaces, the act disregards his personhood. Privacy isn’t just about avoiding embarrassment; it’s about respecting a human’s inherent dignity, regardless of age. Trust your instinct—this isn’t about parenting experience, it’s about ethics.
