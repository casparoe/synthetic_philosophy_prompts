prompt: |-
  I never studied philosophy formally, but a while back I went down a Wikipedia rabbit hole about why so many everyday rules feel completely made up and yet nobody ever breaks them—things like which side of the road everyone drives on. That's how I first ran into David Lewis's book Convention, or really just summaries of it, since the actual text is heavy going for someone without a background in logic. As far as I can piece together, Lewis's idea is that a "convention" is the solution to what he calls a coordination problem: there are at least two ways a group could act that would work out fine for everyone as long as everyone expected everyone else to do the same thing, and the group settles on one of them, which then perpetuates itself purely through precedent and the fact that everyone expects everyone else to keep it up—but it only counts as a genuine convention, on Lewis's account, if some other way of acting would have worked just as well, so that the one people actually landed on is arbitrary rather than forced on them. I've been telling anyone who will listen about this ever since, including my friends Mara and Colin, which is presumably why, a couple of weekends ago, an ordinary bit of queue-jumping turned into a proper argument between the two of them.

  We were waiting for a table at a busy brunch place when a guy walked straight past the whole line and got seated because he knew the host. After he left, Mara and Colin spent a good fifteen minutes arguing about whether queueing even counts as a "Lewis convention" in the first place, and it went roughly like this. (1) Mara said queueing is a textbook case: like driving on the right, it's arbitrary, it solves the coordination problem of who gets served in what order without anyone having to negotiate, and it keeps going purely because everyone expects everyone else to hold their place in line. (2) Colin said that's not the same structure at all: driving on the right works because deviating is bad for the deviator too, whereas the guy who walked to the front did great for himself, at everyone else's expense—that's not a coordination equilibrium in Lewis's sense, where conforming already has to be your own best move given what others are doing; queueing survives on glares and awkward confrontations, not on it being independently rational to comply. (3) Mara answered that once you count the risk of a glare or a confrontation as part of what you stand to gain or lose, conforming still comes out as everyone's best response given what everyone else is doing, so it's still a coordination equilibrium—Colin is just refusing to count the social cost as part of the situation. (4) Colin replied that this move proves too much: if any social pressure at all can be folded into "the payoffs" after the fact, then literally any norm whatsoever, including ones we'd normally call moral obligations rather than mere conventions, could be redescribed as a coordination equilibrium, and Lewis's entire distinction between conventions and other kinds of norms collapses into nothing.

  Neither of them budged, and I don't know this material well enough to referee it myself. Could you go through the exchange move by move and say who has the stronger argument at each of the four steps, rather than just declaring an overall winner? I'd also like to know whether either of them is simply missing something obvious—for instance, a thought that occurred to me afterward, which neither of them raised: doesn't Lewis's account also require that some other regularity could have worked just as well as the one that actually caught on, and if first-come-first-served is really the uniquely fairest way to allocate scarce spots in a line, rather than just one arbitrary option among equally good alternatives, wouldn't that undercut Mara's opening claim on completely different grounds than anything Colin said?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're describing a debate between Mara and Colin about whether queueing qualifies as a Lewis convention. The user wants a step-by-step analysis of each argument and who has the stronger point at each stage. They also mention an additional thought about the arbitrariness condition in Lewis's theory.

  First, I need to recall David Lewis's definition of convention. From what I remember, Lewis defines conventions as solutions to coordination problems. Key elements include: multiple possible equilibria, arbitrariness (meaning other solutions could have worked), and the equilibrium being maintained because everyone expects others to follow it, and it's in their interest to conform given that expectation.

  The user's scenario involves queue-jumping at a brunch place. Mara argues queueing is a convention like driving on the right. Colin disagrees, saying queueing isn't a coordination equilibrium because violators benefit without inherent downside, unlike driving where deviation is immediately harmful. 

  Breaking down each step:

  1. Mara's initial point: Queueing is arbitrary and solves coordination. Similar to driving rules. Colin counters that in driving, deviating is self-harming, while queue-jumping benefits the individual at others' expense. So Colin's argument hinges on the lack of inherent incentive to conform without social enforcement.

  2. Mara's response includes social costs (glares, confrontations) as part of the payoff. If these are considered, then conforming becomes the best response. Colin retorts that this makes any norm a convention, blurring the line with moral norms. 

  3. The user's added point: Lewis requires arbitrariness. If first-come-first-served is uniquely fair, not arbitrary, that challenges Mara's claim independently. 

  I need to assess each step. For step 1, Mara is correct in structure but Colin has a point about the equilibrium type. Driving is a pure coordination game where deviation harms oneself. Queueing might be more like an "assurance game" or involve sanctions. Lewis actually allows for sanctions in conventions, as long as the primary motivation is expectations. 

  Step 2: Mara's inclusion of social costs is valid within game theory. Lewis does consider disapproval as part of payoffs. But Colin's worry about over-inclusiveness is valid—moral norms could be framed similarly. However, Lewis distinguishes conventions by their arbitrariness and how they solve coordination problems, not just equilibrium. 

  Step 3: Colin's argument about equilibrium is strong because without sanctions, queueing lacks self-policing. But Mara correctly notes that sanctions can be part of the system. The key is whether the norm is arbitrary. 

  Step 4: Colin's slippery slope argument has merit but might be overstated. Lewis's arbitrariness condition helps differentiate conventions from moral norms. For example, moral norms aren't considered arbitrary; they're based on intrinsic rightness. 

  The user's afterthought is crucial. If queueing is uniquely fair, it might not be arbitrary, thus not a convention. However, in practice, queues can vary (e.g., priority lanes), suggesting alternatives exist. But fairness might make it non-arbitrary in a moral sense, which Lewis excludes from conventions. 

  So overall, Colin is stronger in highlighting the enforcement mechanism difference, but Mara rightly points out that social sanctions are part of conventions. The user's point about arbitrariness adds depth, showing queueing might not be purely conventional if fairness is intrinsic. 

  I should structure the response to address each of the four steps, evaluate who's stronger at each, and then discuss the arbitrariness point separately. Also, clarify Lewis's actual stance on sanctions and arbitrariness to resolve the debate.
answer: |-
  Let's break down the argument step-by-step, evaluating each move against Lewis's actual framework in *Convention* (1969), while addressing your insightful afterthought about arbitrariness. The core tension revolves around whether queueing qualifies as a Lewisian convention, particularly concerning the nature of the equilibrium and the role of sanctions.

  **Step 1: Mara's Opening Claim (Queueing as Textbook Convention)**
  *   **Mara's Argument:** Queueing solves a coordination problem (orderly service) through an arbitrary rule (first-come-first-served). It persists because everyone expects others to follow it, and conforming is rational given those expectations. Analogy: Driving on the right/left.
  *   **Evaluation:** **Mara is largely correct on the surface structure.** Queueing *is* a paradigmatic example of solving a coordination problem. Lewis explicitly discusses conventions like "calling back" (p. 42), driving (pp. 5-7, 36-38), and linguistic meaning (central to the book) – all relying on precedent, expectations, and solving coordination issues. The arbitrariness condition (your key afterthought) *seems* met: many ordering rules could work (lottery, priority for certain groups, even a different queuing etiquette like "take a number"). First-come-first-served isn't *logically* unique.
  *   **Strength:** **Strong.** Mara correctly identifies the core elements: coordination problem solved, arbitrary regularity, perpetuated by precedent and expectations.

  **Step 2: Colin's Rebuttal (Not a Coordination Equilibrium)**
  *   **Colin's Argument:** Driving on the right is a *coordination equilibrium*: deviating (driving left) is directly harmful *to the deviator* because they cause a crash. Queueing lacks this self-policing property. Deviating (jumping the queue) benefits the deviator *at the expense of others*. Conforming isn't inherently your best move; queueing relies on external enforcement (glares, confrontations), not internal incentives.
  *   **Evaluation:** **Colin identifies a crucial nuance and has the stronger argument here.** Lewis defines a coordination equilibrium as a combination of strategies where *no one would be better off if any one agent alone acted differently* (pp. 14, 24). Driving on the right fits perfectly: if you alone swerve left, you crash. Queue-jumping does *not* inherently harm the jumper; it benefits them (they get seated faster). The *only* reason not to jump is the *risk of sanctions* (glares, arguments, ejection). Lewis distinguishes conventions from situations requiring enforcement: "Conventions may be *enforced*... But the existence of the convention does not *depend* on enforcement... Conformity is conditional upon the conformity of others, but *not* conditional upon sanctions" (Paraphrasing key points from pp. 97-99, 177). The driving convention is self-enforcing *because* deviation directly harms the deviator; the queueing convention is *not* self-enforcing in the same way – it requires the *added* threat of social sanctions.
  *   **Strength:** **Stronger than Mara's Step 1.** Colin correctly highlights that pure queueing, without social sanctions factored into payoffs, does *not* meet Lewis's strict definition of a coordination equilibrium. The jumper's unilateral deviation *does* make them better off, absent sanctions. Driving is a "pure coordination" game; queueing is more akin to an "assurance game" or even a "prisoner's dilemma" without sanctions.

  **Step 3: Mara's Counter (Folding Social Costs into Payoffs)**
  *   **Mara's Argument:** If we include the *social costs* (risk of glares, confrontation, social disapproval, potential ejection) as part of the potential losses from deviating, then conforming *does* become the best response. Given that everyone expects others to queue, the cost of jumping (social sanction) outweighs the benefit (faster service), making conformity rational. Thus, it *is* a coordination equilibrium once payoffs are defined realistically.
  *   **Evaluation:** **Mara has a valid point, strengthening her position.** Lewis *does* allow that payoffs can include social and psychological factors (pp. 97-99). He explicitly states that conventions can be sustained by "punishments and rewards" (p. 98) and that disapproval is a common sanction. If the *expectation* of sanction is high enough (because the convention is strong), and the sanction cost outweighs the benefit of jumping, then conforming *becomes* the best response given others' conformity. This moves queueing closer to a Lewisian convention *if* the sanctions are sufficiently internalized or reliably expected. It shifts the "game" from one where jumping is beneficial to one where it's not, conditional on the convention and its associated sanctions.
  *   **Strength:** **Strong, and partially counters Colin's Step 2.** Mara correctly leverages Lewis's acceptance that sanctions *can* be part of the system upholding a convention. This makes queueing potentially qualify as a Lewisian convention *if* the social enforcement mechanism is robust enough to make conformity the rational choice.

  **Step 4: Colin's Riposte (Collapsing the Convention/Morality Distinction)**
  *   **Colin's Argument:** If we allow *any* social pressure (like disapproval for queue-jumping) to be folded into the payoffs after the fact to *make* conformity rational, then *any* norm can be redescribed as a coordination equilibrium. This includes moral norms (e.g., "don't steal" – deviation might bring social/legal sanctions making conformity rational). This collapses Lewis's distinction between *conventions* (arbitrary solutions to coordination problems) and other *norms* (like moral rules).
  *   **Evaluation:** **Colin raises a profound and valid concern, making this his strongest point.** This is a major philosophical debate surrounding Lewis. Mara's move *does* risk making the definition too broad. Lewis *does* want to distinguish conventions from other norms (pp. 97-106). His key differentiators are:
      1.  **Arbitrariness:** A genuine convention requires that *another* regularity *could* have served the same purpose just as well (pp. 69-76). While moral rules might *have* alternatives, we usually don't consider them *arbitrary* in the same way – we think one is *right* (e.g., "don't steal" vs. "stealing is fine").
      2.  **Coordination Problem Origin:** Conventions specifically solve problems where coordination itself is the primary goal, and mutual expectations are paramount (pp. 24-25, 42). Moral rules often address conflicts of interest, harm, or intrinsic right/wrong beyond just coordination.
      3.  **Reason for Conformity:** For conventions, the *primary* reason to conform is the expectation others will too, *plus* a preference for coordination (pp. 42, 76). For moral rules, the reason often involves a belief in the intrinsic rightness of the act *independent* of expectations (though sanctions may still apply).
      While Mara's inclusion of sanctions is *permitted* by Lewis, Colin correctly warns that *solely* relying on this to define the equilibrium risks ignoring Lewis's core criteria of arbitrariness and the specific coordination-problem context. Queueing *can* still be distinguished from a moral norm like "don't steal" because its *core function* is coordination (ordering service), it *is* arbitrary (other orderings work), and the *primary* reason to conform *is* the expectation others will too *and* the desire for orderly service. Folding in sanctions doesn't *necessarily* collapse the distinction if arbitrariness and the coordination context are given primacy.
  *   **Strength:** **Strongest argument in the exchange.** Colin identifies a genuine tension in Lewis's framework and how Mara's move could lead to over-inclusiveness. However, it doesn't *automatically* mean queueing isn't a convention; it means Mara needs to argue *why* queueing meets the arbitrariness and coordination-problem criteria *in addition* to being an equilibrium when sanctions are included.

  **Your Key Afterthought: The Role of Arbitrariness**
  *   **Your Point:** If first-come-first-served (FCFS) queueing is the *uniquely fairest* way, rather than just one arbitrary option among equals, doesn't that undercut its status as a Lewisian convention?
  *   **Evaluation:** **Absolutely correct and crucial.** This is a separate, powerful point Colin *didn't* make. Lewis's arbitrariness condition is essential (pp. 69-76): "A regularity R in the behavior of members of a population P... is a *convention* if and only if... *there is at least one other possible regularity R'* such that almost everyone in P would prefer that any one more conform to R', on condition that almost everyone in P conform to R'" (Paraphrased). If FCFS is perceived as *uniquely* fair, then it fails the arbitrariness test. People conform *because* it's fair, not (or not just) because it's the arbitrary solution everyone expects.
  *   **Impact:** This significantly complicates Mara's case. While many *alternative* orderings *could* work (lottery, priority groups, last-come-first-served), if FCFS is widely seen as *distinctly fairer* than the alternatives, its status as a *pure* Lewisian convention is weakened. People conform partly due to a belief in its intrinsic fairness/justice, not solely due to precedent, expectations, and a desire for coordination. It starts blending into a norm with a moral or fairness component. Lewis acknowledges this: norms perceived as uniquely just or efficient might not be "arbitrary" conventions (pp. 97-106). Whether FCFS *is* uniquely fair is debatable (some contexts use alternatives), but if it *is* perceived that way in a given society, it weakens the "convention" label under Lewis's strict definition.

  **Overall Verdict on the Exchange:**

  1.  **Mara (Step 1):** Strong start, correctly identifies core structure. *Slightly weaker* than Colin's rebuttal due to overlooking the self-policing aspect.
  2.  **Colin (Step 2):** Stronger argument, correctly identifies the lack of inherent self-policing equilibrium in pure queueing.
  3.  **Mara (Step 3):** Strong counter, validly incorporates sanctions as Lewis allows, restoring viability for queueing as convention *if* sanctions are robust.
  4.  **Colin (Step 4):** Strongest point, validly warns about over-inclusiveness and the risk of collapsing Lewis's distinction. Forces Mara to rely on arbitrariness/coordination context.

  **Conclusion:** Neither is wholly wrong, but **Colin has the overall stronger case** in this specific exchange. He successfully challenges the easy equation of queueing with driving conventions by highlighting the crucial difference in the incentive structure (lack of self-harm in deviation). While Mara rescues the possibility using sanctions, Colin's final point exposes a genuine vulnerability in Lewis's framework when social pressure is heavily relied upon. **Your afterthought about arbitrariness is perhaps the most potent objection to Mara's initial claim:** If FCFS queueing is seen as uniquely fair, it ceases to be a *purely* arbitrary Lewisian convention and becomes a norm infused with fairness principles, even if it still coordinates. Ultimately, queueing likely sits on a spectrum – it has strong conventional elements (precedent, expectations, solving coordination) but relies more on social sanctions than pure self-policing and may incorporate a fairness element that challenges pure arbitrariness.
