  I recall that Proffitt's work is central here. The visual matching task (explicit) shows changes with affect, while the haptic adjustment (implicit) doesn't. The key debate is whether the explicit measure reflects genuine perceptual experience or post-perceptual judgment. Firestone & Scholl's critique about confounds is relevant here, especially demand characteristics. 

  For move 1, Nadia is right that the tilted disk task is better than verbal estimates, but it's still an explicit judgment. So it's right but narrower. Theo's point in move 2 is strong because the dissociation suggests the effect isn't perceptual. But he might overstate by implying action measures are the only true perceptual readout. 

  Nadia's move 3 correctly notes that action and perception systems can dissociate, but she needs to justify why the explicit measure should be trusted. Theo's burden-shifting in move 4 is valid because without independent evidence, it's hard to confirm if the explicit measure isn't influenced by cognition. 

