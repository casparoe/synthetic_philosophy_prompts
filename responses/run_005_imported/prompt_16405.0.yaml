prompt: |-
  I've spent the last few weeks working through the classical arguments for the existence of God with a small reading group that grew out of some LessWrong-adjacent blogs and Discord servers I've followed for years, and this week's text was Aquinas's Third Way from the Summa Theologica. I already had a decent feel for cosmological arguments from contingency in their modern dress — Leibniz's version via the Principle of Sufficient Reason, or Alexander Pruss's contemporary defenses of it — but Aquinas's own formulation is terser and more thoroughly Aristotelian, and I keep getting stuck on one specific inferential move. Here is the relevant passage, in the standard Dominican Fathers translation:

  "The third way is taken from possibility and necessity, and runs thus. We find in nature things that are possible to be and not to be, since they are found to be generated, and to corrupt, and consequently they are possible to be and not to be. But it is impossible for these always to exist, for that which is possible not to be at some time is not. Therefore, if everything is possible not to be, then at one time there could have been nothing in existence. Now if this were true, even now there would be nothing in existence, because that which does not exist only begins to exist by something already existing. Therefore, if at one time nothing was in existence, it would have been impossible for anything to have begun to exist; and thus even now nothing would be in existence — which is absurd."

  (Aquinas then goes on to conclude that there must therefore be something whose existence is necessary in itself, which he identifies with God, but that final stretch isn't what's tripping me up.)

  The move that bothers me is the slide from "every contingent thing is, at some time or other, not in existence" to "there was some one time at which nothing at all was in existence." One person in the reading group, who did graduate work in philosophy of religion, said this looks like the same complaint Anthony Kenny made against the Third Way: that it's a quantifier-shift fallacy, structurally identical to inferring "there was a moment when every seat in the theater was empty" from the much weaker "every seat was, at some point during the run, empty." I'd like help thinking through whether that charge really sticks. Is there a charitable reading of Aquinas — maybe turning on the per se/per accidens distinction, or on background Aristotelian commitments about matter, corruption, and an eternally old universe — that blocks the fallacious inference and lets the argument go through in something like its original form? And if the move can't be salvaged, does the broader contingency-style cosmological argument survive in some other guise, such as Leibniz's or a contemporary modal formulation, that doesn't rely on this particular piece of temporal-frequency reasoning at all?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're stuck on Aquinas's Third Way, specifically the inference from each contingent thing being non-existent at some time to there being a time when nothing existed. They mention Kenny's quantifier-shift fallacy critique and want to know if there's a charitable reading that saves the argument or if modern versions avoid this.

  First, I need to recall Aquinas's argument structure. The key point is the move from perishing individually to a universal nothingness. The user’s analogy with theater seats is spot-on. Kenny's objection seems valid here—shifting from "each thing has a time it doesn't exist" to "there's a time when all things don't exist" is logically flawed. 

  But maybe Aquinas had a different framework. His medieval context involved an eternal universe without a beginning. Contingent things depend on necessary beings. If everything were contingent, they couldn't sustain existence over time. Each contingent thing requires something else to bring it into existence. If all were contingent, there might be times when no contingent things exist, but that doesn't necessarily mean a single time with nothing. 

  The user’s friend mentioned per se vs. per accidens. Aquinas might mean that contingency implies a chain of causes needing a necessary ground. Without it, existence couldn't persist. But the temporal aspect is problematic. Maybe Aquinas conflated logical possibility with temporal actuality. Modern modal logic separates these, so contingency is about possible non-existence, not temporal non-existence. 

  Then there's the dependency on eternal universe. If the universe is eternal, contingent things are always coming and going. But for there to be a time with nothing, all contingent things would need to cease simultaneously, which isn't necessary. Aquinas might think that without a necessary being, contingent things would eventually all fail to exist at once. But that assumes simultaneous failure, which isn't justified. 

  The user also asks if modern versions like Leibniz's or Pruss's avoid this. Leibniz uses the Principle of Sufficient Reason (PSR) focusing on why there is something rather than nothing. It's modal, not temporal. Pruss’s account uses possible worlds and grounding. These don’t rely on temporal sequences, so they sidestep the quantifier-shift issue. 

  So, Kenny's critique holds against Aquinas's temporal formulation. However, the core idea—that contingent existence requires a necessary ground—can be preserved in modern modal arguments. The user might be seeking reassurance that while Aquinas's version has flaws, the broader argument still stands. They’re likely interested in rigorous philosophical analysis and alternatives that maintain the argument's essence without the fallacy. 

  I should confirm that the quantifier shift is indeed a fallacy, explore any defenses using medieval metaphysics, then transition to modern versions. Highlighting that Leibniz and Pruss offer stronger formulations would address their deeper need for a robust defense of the cosmological argument.
answer: |-
  Your analysis is sharp, and the Kenny-style quantifier-shift objection is indeed a major hurdle for Aquinas's temporal formulation. Let's break this down:

  **1. The Problem: The Quantifier Shift Fallacy**
  *   Aquinas asserts: For every contingent thing (x), there exists some time (t_x) such that x does not exist at t_x.
      *   `(∀x ∃t) ~Exists(x, t)`
  *   He infers: There exists some time (T) such that for every contingent thing (x), x does not exist at T.
      *   `(∃T ∀x) ~Exists(x, T)`
  *   Kenny is correct: This is a textbook quantifier-shift fallacy. The temporal non-existence of each contingent entity is spread out over time; there's no logical requirement that *all* contingent entities are non-existent *simultaneously*. Your theater seat analogy perfectly captures the error.

  **2. Charitable Readings: Salvaging the Core Insight?**

  Can we defend Aquinas within his Aristotelian framework? Possible avenues exist, but they face significant challenges:

  *   **The Eternity of the Universe & Perpetual Generation/Corruption:**
      *   Aquinas *assumed* an eternal universe without a temporal beginning. Contingent things ("possible to be and not to be") are constantly coming into existence ("generated") and passing away ("corrupting"). Matter itself is eternal.
      *   **Charitable Interpretation:** Aquinas might be arguing that *if* there were *no* necessary being(s), the *totality* of contingent existence would be unstable *over infinite time*. Given infinite past time, the *probability* (or perhaps even the *necessity*, given Aristotelian principles of potentiality) that *at some point* all contingent things *happen* to be non-existent simultaneously becomes 1. The "at one time" (`∃T`) refers to *some specific moment* within this infinite past.
      *   **Problems:**
          *   **Probability vs. Necessity:** Infinite time doesn't *guarantee* simultaneous non-existence. It's logically possible (and arguably probable under many models) that contingent existence is *perpetually sustained* – as one thing ceases, another begins, in an overlapping chain. Aquinas needs the *necessity* of simultaneous non-existence.
          *   **The Sustaining Cause:** Aquinas's deeper point (echoed later) is that contingent things require a *sustaining cause* for their existence *at every moment*, not just an initial cause. If *everything* was contingent and lacked this sustainer, existence *could not persist*. The temporal argument might be an imperfect attempt to express this modal dependency. The "absurdity" (nothing now) stems from the *lack of an ontological ground* for existence *at any time*, not specifically from a past temporal void.
          *   **Matter as Quasi-Necessary?:** Aristotelian prime matter is eternal and indestructible. If matter counts as "something," then there was *never* "nothing." Aquinas would likely counter that prime matter is pure potentiality; it cannot exist without form, and formed matter (substances) *are* contingent. So "nothing" means "no actually existing contingent *substances*." But even then, the quantifier shift problem remains for substances.

  *   **Per Se vs. Per Accidens Series & Dependency:**
      *   Aquinas distinguishes between chains of causes ordered *per accidens* (a sequence in time: grandfather -> father -> son) and *per se* (simultaneous dependence: hand moving stick moving stone *right now*).
      *   **Charitable Interpretation:** The argument might primarily concern *per se* causal dependency *at a given moment*. The temporal language ("at some time," "at one time") is a heuristic. The core claim is: *Right now*, if every existing thing were contingent (i.e., dependent for its existence on something else *right now*), and if there were no necessary being to terminate these dependency chains, then *nothing could exist right now*. The temporal scenario ("then at one time there could have been nothing") is meant to illustrate the *consequence* of lacking a necessary ground *at any time*, including now. The absurdity ("even now nothing would be in existence") is the direct result of this *current* lack of grounding, not *caused* by a past void.
      *   **Problems:** This is a very generous reading. The text strongly emphasizes temporal generation/corruption and explicitly states "at one time there *could have been* nothing" and "if at one time nothing *was* in existence." It reads as a temporal sequence argument. While the *per se* dependency is crucial to Aquinas's overall metaphysics, it's not the explicit engine driving *this specific inference* in the Third Way text.

  **Conclusion on Aquinas:** Kenny's objection is robust. While sophisticated defenses exist, they often involve reconstructing Aquinas's argument using his broader metaphysics (eternal universe, *per se* dependence, matter/form) to *replace* or *radically reinterpret* the literal temporal inference. These reconstructions salvage the *spirit* of the cosmological argument from contingency but effectively abandon the *literal temporal quantifier-shift inference* as presented in the text. The move, as stated, is fallacious.

  **3. Do Modern Contingency Arguments Avoid This?**

  **Absolutely.** This is the crucial point. Leibnizian and contemporary modal versions of the cosmological argument explicitly *jettison* the problematic temporal reasoning. They operate purely in the realm of *modal* (necessity/contingency) and *explanatory* (Principle of Sufficient Reason - PSR) logic, often independent of temporal considerations. Here's how they differ:

  *   **Leibniz (Based on PSR):**
      1.  Everything that exists must have a sufficient reason for its existence.
      2.  The sufficient reason for any contingent thing (C1) must lie either in another contingent thing (C2) or in a necessary thing (N).
      3.  A chain or set of *only* contingent things (C1, C2, C3, ...) cannot provide a sufficient reason for existence. Why does *this specific set* of contingent things exist, rather than some other set, or nothing at all? The set's existence itself is contingent and requires explanation.
      4.  Therefore, there must exist a necessary being (N) whose sufficient reason for existence lies within itself, and which provides the sufficient reason for the existence of the entire contingent realm. **No temporal sequence is invoked. The argument is about the *current* ground of *current* existence.**

  *   **Contemporary Modal Arguments (e.g., Pruss, Rasmussen, Koons - variations exist):**
      *   **Premise 1:** Contingent beings exist. (e.g., I exist).
      *   **Premise 2:** If contingent beings exist, then either (a) there exists a necessary being that explains/contingently grounds them, or (b) there is an infinite regress of contingent explanations, or (c) they have no explanation (violating PSR).
      *   **Premise 3:** An infinite regress of contingent explanations is impossible/vicious (it fails to provide an ultimate explanation; the whole collection of contingent things is itself contingent and unexplained).
      *   **Premise 4:** The Principle of Sufficient Reason (PSR) holds (at least for the existence of contingent beings/collections). Things don't just exist for no reason.
      *   **Conclusion:** Therefore, a necessary being exists that explains/contingently grounds the existence of contingent beings. **Again, this is modal and explanatory. Time is irrelevant. The argument asks for the ground of *why there is something contingent right now*, not *what happened before*.**

  **Why Modern Arguments Survive:**

  1.  **No Quantifier Shift:** They don't infer a past state of nothingness from individual contingent histories. They focus on the *current* ontological or explanatory dependence of contingent things.
  2.  **Focus on Totality/Set:** They explicitly consider the *entire collection* of contingent things. The key question is: Why does *this contingent universe/totality* exist? Its contingency demands an explanation outside itself.
  3.  **Modal Necessity:** They rely on the distinction between contingent existence (could not exist) and necessary existence (must exist) and the impossibility of explaining the contingent solely by the contingent.
  4.  **PSR-Driven:** The engine is the Principle of Sufficient Reason, demanding an explanation for existence itself, not a temporal narrative.

  **In Summary:**

  *   **Aquinas's Temporal Move:** Kenny's quantifier-shift critique is valid and difficult to fully overcome within the literal text. While his broader Aristotelian framework (eternal universe, *per se* dependence) offers context for a more charitable reading emphasizing *sustaining cause*, it doesn't fully rescue the inference `(∀x ∃t) ~Exists(x, t)` => `(∃T ∀x) ~Exists(x, T)` as logically sound.
  *   **Modern Contingency Arguments:** Leibnizian and contemporary modal arguments successfully avoid this pitfall. By focusing on *modal status*, *explanatory grounding*, and the *contingency of the totality* (using the PSR or similar principles), they provide robust defenses of a necessary being without relying on the problematic temporal frequency reasoning. **The core intuition of Aquinas's Third Way – that contingent existence demands a necessary ground – survives and thrives in these modern formulations precisely because they abandon the vulnerable temporal inference.** Your engagement with Leibniz and Pruss is well-placed; they represent the more resilient path for the contingency argument.
