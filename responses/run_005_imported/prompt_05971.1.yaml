  I recall that some philosophers propose "cluelessness-proof" versions of consequentialism, like focusing on institutional effects or rule consequentialism. The ensemble approach might not address the core issue of long-term unpredictability. The user’s idea is insightful but may not overcome the epistemic barriers highlighted in complex cluelessness.

  He’s right to worry about the lack of symmetries. In physics, symmetries underpin the ensemble; in ethics, there's no equivalent. His analogy is clever but might only shift the problem to justifying the probability distribution. The literature, like Greaves' work, likely addresses this, pointing out that without objective chances, expected value calculations aren't reliable.

  Also, the user’s background in turbulence is interesting. Turbulent systems have sensitive dependence, similar to chaotic moral consequences. But even in turbulence, models rely on physical laws. Ethics lacks such laws. So the analogy might break down there.

