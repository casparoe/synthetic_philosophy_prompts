prompt: |-
  I've been on a bit of a consciousness-studies kick lately (it started with some youtube videos about whether AI chatbots could ever be conscious, then I fell down a wikipedia hole from there). The thing that really stuck with me was reading about this blowup from a couple years back where a big group of neuroscientists signed an open letter basically saying that Integrated Information Theory of consciousness -- the "phi" theory associated with Giulio Tononi and Christof Koch -- should basically be labeled pseudoscience. From what i understood, one of the big complaints is that IIT makes claims that can never really be checked either way, like the idea that some totally static grid of connected logic gates, doing nothing anyone would call "thinking," could in principle have a higher "phi" value (and therefore supposedly be MORE conscious) than an actual human brain. Tononi and Koch obviously pushed back hard on the pseudoscience label though, so it's not like the critics just won by default.

  This got me thinking about Karl Popper and his whole falsifiability/demarcation problem thing (I only really know this from an old philosophy of science podcast episode, so bear with me if I get some of the terminology slightly wrong). Popper died in 1994, long before this specific IIT fight happened, and honestly before "consciousness science" was even really a field people took seriously the way it is now. So there's no way to just look up "what Popper thought of IIT" -- he never got the chance to think about it.

  So here's what I want: actually reconstruct, as best you can, what Popper's real verdict on IIT would be if he had this whole controversy explained to him today. Don't just say "well he cared about falsifiability so he'd probably say it's not science" -- actually use his more specific machinery (degree of falsifiability, what he called conventionalist twists/stratagems for patching up a theory instead of risking a real prediction, corroboration vs. mere confirmation, that sort of thing) and apply it properly to IIT's actual claims. Also give Tononi and Koch's side a fair shake before you land on an answer -- I don't want a cop-out "it's complicated" ending, I want you to actually commit to what you think Popper's verdict would be and why.
