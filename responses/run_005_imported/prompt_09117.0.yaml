  For the ruling: A middle path feels right here. The student isn't malicious, but she skipped the final human verification step. "Negligence" fits better than "fabrication." 

  Consequence idea: Mandatory source-checking tutorial + resubmission feels proportional. It educates rather than punishes, and the timeline (1 week) is tight but feasible.

  Future guidance needs teeth: The Council should demand the tool either:
