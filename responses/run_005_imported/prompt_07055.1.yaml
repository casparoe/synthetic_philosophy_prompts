answer: |-
  That's a fantastic question that cuts to the heart of Hobbes's philosophical project. Your professor's anecdote and your math-major roommate are both right: it *was* stubbornness, but it was stubbornness driven by a deep, non-negotiable metaphysical commitment. The connection to his materialism is absolutely fundamental, not overstated. Let's break down the intuition:

  **Hobbes's Materialist Core: The World is Bodies in Motion**

  1.  **The Only Reality is Corporeal:** For Hobbes, *everything that exists* is a material body ("substance corporeal"). There are no immaterial souls, no Platonic Forms, no abstract entities floating in a metaphysical realm. "Substance incorporeal" is, to him, as nonsensical as "round quadrangle" or "immaterial body" (Leviathan, Ch. 34, 46).
  2.  **Properties are Modes of Body:** All properties (color, hardness, thought (!), geometric figures) are simply ways bodies interact with our senses or with each other. They aren't independent things.
  3.  **Motion is Fundamental:** The primary way bodies interact and cause change is through *motion*. Motion is the key to understanding everything, from physics to psychology to politics.

  **Why Standard Euclidean Geometry is Metaphysically Offensive:**

  1.  **The Problem of the Point:** Euclid defines a point as "that which has no part" – dimensionless, extensionless. To Hobbes, this is **metaphysically impossible**. *Nothing* that truly exists can lack magnitude. If it exists, it *must* have some size, however small. A dimensionless point is as unreal as a ghost.
  2.  **The Problem of Abstraction:** How do we get these perfect circles, straight lines, and dimensionless points? Traditional geometry seems to rely on abstracting away all imperfections and physical properties. But for Hobbes, abstraction isn't conjuring a perfect Platonic form; it's just *ignoring* certain aspects of a specific, real body. We can *consider* a tiny speck *as if* it were a point *for practical purposes*, but we must never forget it *is* a body with magnitude. Geometry must be grounded in the manipulation of *real things*.
  3.  **The Need for a Genetic Definition:** This is where "generation by motion" comes in. It solves both problems:
      *   **Solves the Point Problem:** We start with a *real body* (a small particle, a stylus tip). We don't pretend it's dimensionless; we accept it has size, but we use it *as the generator*.
      *   **Solves the Abstraction Problem:** We define geometric objects *dynamically* by describing *how they are produced* by the motion of real bodies:
          *   A **Line**: The *path traced* by a moving point-body (e.g., dragging a stylus).
          *   A **Straight Line**: The path traced by a point-body moving *in the simplest, most direct way* between two bodies (Hobbes connects this to his physics).
          *   A **Plane**: The surface *swept out* by a moving straight line.
          *   A **Circle**: The path traced by a point-body moving while keeping a fixed distance from a central body.
      *   **The "Gain" (for Hobbes):** This grounds geometry entirely in the *physics* he believes is fundamental – bodies and their motions. Geometry becomes the science of the *possible motions* of real bodies. It banishes the need for impossible, abstract entities. The "point" isn't an abstract entity; it's the *act of designating a position* by a moving body. The line isn't an abstract collection of points; it's the *trace* of a *physical motion*.

  **The Intuitive Gut-Level Sense:**

  Imagine you're Hobbes. You've built an entire philosophical system – physics, psychology, politics (Leviathan!) – on one core idea: **Everything real is body moving in space.** This system explains thunder, fear, and why we need an absolute sovereign. It feels incredibly powerful and unified.

  Then you look at geometry, the science of space itself. The way mathematicians talk about it feels *alien* to your core belief. They talk about:
  *   **Things with no size at all (points).** But your whole system says *nothing real has no size!* That's like saying "colorless color" exists.
  *   **Perfect shapes existing in a perfect, abstract realm.** But your system says *only physical bodies exist!* Where is this realm? What are these shapes made of?
  *   **Constructions that seem impossible with real bodies** (like drawing a perfectly straight line of zero width). How can your physics explain that?

  This isn't just an academic quibble. It feels like a **threat to the foundation of your entire worldview.** If geometry *requires* immaterial, dimensionless abstractions, then maybe your whole materialist system is wrong! Maybe immaterial things *do* exist? That thought is terrifying because it potentially unravels everything – including your political theory which relies on a materialist account of human nature.

  **So, you *have* to fix geometry.** You *have* to show that the truths of geometry can be derived *solely* from definitions based on the motions of real bodies. You have to prove that your materialist physics can generate geometric truth. Squaring the circle isn't just a math puzzle; it's the ultimate **test case**. If you can solve it using *your* genetically defined, motion-based geometry, it would be **vindication** that your entire materialist metaphysics is sufficient to explain even the most profound truths about space and quantity.

  **Enter Wallis and the Stubbornness:**

  1.  **Wallis's Methods:** Wallis, a brilliant mathematician, used the latest tools: algebra, symbolic notation, and crucially, nascent concepts involving *limits* and *infinitesimals*. He treated curves algebraically and accepted results involving infinite series and processes tending towards a limit. He demolished Hobbes's specific constructions mathematically.
  2.  **Why Hobbes Saw Wallis as the Enemy (Metaphysically):** Hobbes didn't just see wrong math. He saw Wallis using tools that were **metaphysically illegitimate** from his perspective:
      *   **Infinitesimals/Actual Infinity:** Wallis's methods involved quantities becoming "infinitely small" or summing infinitely many parts. For Hobbes, this was nonsense. You can have potential infinity (you can always divide a body further), but not *actual* infinity or things *with* magnitude that are infinitely small. Bodies always have finite magnitude.
      *   **Abstract Algebra:** Wallis's symbolic algebra felt like manipulating abstract entities divorced from physical generation by motion. Where was the *body moving* in an algebraic equation?
      *   **"Sneaky" Abstraction:** Hobbes felt Wallis was smuggling in the very kind of abstract, non-physical concepts (like dimensionless points via limits) that Hobbes's system was designed to eliminate. Wallis's solutions seemed like clever tricks based on metaphysically dubious foundations.
  3.  **The Stubbornness Explained:** Admitting Wallis was right about squaring the circle *using those methods* would have been tantamount to admitting:
      *   That his materialist genetic definitions *weren't* sufficient for fundamental geometry.
      *   That mathematics *did* require concepts (infinitesimals, actual infinity) that had no place in his physics/metaphysics.
      *   That his entire philosophical edifice, built on bodies and motion, had a fatal flaw at its geometric core.

  For Hobbes, this wasn't just about being wrong on a math problem; it was about the potential collapse of his life's work and the core truth he believed he had uncovered about reality. **To concede to Wallis was philosophically impossible.** His ego was certainly involved, but it was an ego utterly fused with, and defending, his fundamental metaphysical vision of the world. The geometry error *was* downstream of the metaphysical commitment because the "error" (in rejecting Wallis's methods) was dictated *by* the commitment. He wasn't just mathematically wrong; he was philosophically incapable of accepting the mathematical tools that provided the correct answer because those tools violated his deepest convictions about what is real.

  **In essence:** Hobbes's stubbornness over squaring the circle wasn't *just* about the circle; it was a desperate, decades-long fight to prove that his vision of a universe consisting *only* of bodies in motion could account for the most perfect truths of mathematics itself. Wallis, using methods Hobbes saw as metaphysically corrupt, kept proving that, at least in this specific case, it couldn't. Hobbes chose his metaphysics over mathematical consensus, right up until the end.
