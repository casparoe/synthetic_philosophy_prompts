  No deus ex machina. The takeaway is visceral: However you tune it, someone dies unfairly. That's what "impossible" means.
answer: |-
  ## The Triage Constant

  The air in Mercy General’s data lab hummed with the sterile energy of servers and low-grade caffeine. Dr. Aris Thorne, lead data scientist for the hospital’s new Predictive Triage Optimization System (PTO-Sys), tapped her stylus against the massive central display. Charts glowed with the satisfying precision of a solved equation. "Base model validation complete," she announced, a flicker of pride in her voice. "Ninety-three percent accuracy predicting critical deterioration within twenty-four hours of ER admission. Calibration curve hugging the ideal line like it’s glued there. This," she gestured at the screen, "is what perfectly curated, unbiased data looks like."

  Her audience – Dr. Lena Hassan, the sharp-eyed clinical lead, and Raj Singh, the skeptical bioethicist – leaned closer. The data *was* impeccable. Years of anonymized electronic health records, meticulously cleaned: vital signs, lab results, past diagnoses, even carefully encoded socioeconomic proxies derived from anonymized community health surveys, all stripped of direct identifiers. Aris had fought tooth and nail for this dataset, rejecting anything hinting at bias. This was pure signal.

  "Show us the group splits," Lena requested, her voice calm but probing. "By primary catchment zip."

  Aris obliged, filtering the performance metrics. Two new curves materialized: one for affluent Eastgate (Zip 10001), one for the economically strained Crossings neighborhood (Zip 10034). The overall calibration – the beautiful alignment of predicted risk score with actual mortality rates – held remarkably well *within* each group. A patient in Eastgate predicted at 15% risk genuinely had a 15% chance of critical deterioration. Same for a patient in the Crossings predicted at 30%. PTO-Sys wasn’t over or under-estimating risk based on zip code.

  "Good," Lena murmured. But her brow furrowed as she scanned the subsidiary metrics. "Now show me the error rates. False negatives and false positives."

  Aris clicked. The pride curdled in her stomach.

  The graphs diverged violently. For Eastgate (Zip 10001):
  *   **False Positive Rate (FPR):** 8% (Patients flagged as high-risk who *didn't* deteriorate)
  *   **False Negative Rate (FNR):** 5% (Patients flagged as low-risk who *did* deteriorate)

  For the Crossings (Zip 10034):
  *   **FPR:** 4% (Low)
  *   **FNR:** 12% (High)

  Raj whistled softly. "Ouch. So your perfectly calibrated, unbiased-data model flags more Eastgate folks as critical when they’re fine, but misses more actual critical cases in the Crossings."

  "Statistically," Lena translated, her voice tightening, "a critically ill patient from the Crossings is significantly more likely to be mistakenly sent to a lower-acuity bed, or even discharged, than one from Eastgate. While healthy Eastgate residents are more likely to get unnecessary, resource-intensive monitoring."

  Aris felt a familiar heat rise in her cheeks. "The base rates are different! Look!" She pulled up the underlying statistics. The actual rate of critical deterioration was 8% in Eastgate, but 18% in the Crossings – a stark reflection of disparities in chronic disease burden, environmental stressors, and access to preventative care captured faithfully by her pristine data. "The model *has* to be more sensitive in the Crossings just to catch the higher number of actual cases! That inherently pushes the FNR down *there*, but to keep calibration perfect *here*, it means... it means..." She trailed off, the mathematical reality hitting her again.

  "It means you can't have both," Lena finished for her, not unkindly. "Perfect calibration within groups *and* equal error rates across groups. Not unless the base rates magically equalize or your model predicts flawlessly. Which it doesn't. Nobody's does."

  "But the *data* is clean!" Aris insisted, frustration edging her voice. "We scrubbed it! We used fair representation sampling! We incorporated every relevant non-demographic factor we could ethically access! This *shouldn't* be happening!"

  "Shouldn't it?" Raj interjected softly. "The data isn't *causing* the disparity, Aris. It's *reflecting* it. The different base rates are real. The impossibility theorem isn't saying your data is bad. It's saying that the *concept* of fairness, when split into these two desirable properties, becomes mathematically incompatible under these real-world conditions. It’s baked into the universe of probabilities, not your dataset."

  Lena nodded, her gaze distant. "I saw it last week. Mrs. Evangeline, 62, from the Crossings. Came in with fatigue, mild shortness of breath. PTO-Sys assigned her a moderate risk score – predicted deterioration probability 25%. Calibration-wise, spot on for her group. But… her *actual* risk factors? History of untreated hypertension, borderline EKG, living alone in a walk-up. My gut screamed 'cardiac watch'. But resources were tight, the algorithm said moderate, so she went to a step-down unit. She coded two hours later. A false negative. We got her back, barely." Lena looked back at the screen, the cold numbers reflecting her lived horror. "Meanwhile, Mr. Peterson from Eastgate, a hypochondriac with a panic attack and perfect vitals, scored high-risk because of some statistical echo in his pristine health record. Occupied a critical care bed for six hours. A false positive. Wasted resources while Mrs. Evangeline nearly died."

  The lab fell silent except for the hum of the servers. The beautiful calibration curves now looked like indictments.

  "I can fix this," Aris said, determination hardening her voice. "We'll adjust the thresholds. Re-weight the features. There has to be a configuration..."

  ---

  Over the next grueling weeks, Aris became a prisoner of the impossibility.

  **Attempt One:** *Force Equal False Negative Rates (FNR).* She tweaked the model to be hyper-sensitive in the Crossings, lowering the threshold for a high-risk flag. The Crossings FNR dropped to match Eastgate's 5%. Triumph faded as she saw the cost:
  *   **Calibration Broken (Crossings):** Now, patients predicted at 30% risk only deteriorated 20% of the time. The model was overcalling risk, leading to rampant false positives (FPR jumped to 15%). Resources strained under unnecessary alerts.
  *   **Error Rates Diverged:** Eastgate FPR stayed low (8%), but the Crossings FPR soared (15%). Unfair burden of unnecessary intervention.

  **Attempt Two:** *Force Equal False Positive Rates (FPR).* She made the model more conservative in Eastgate, raising the bar for a high-risk flag to reduce their false alarms. Eastgate FPR dropped to match the Crossings' original 4%.
  *   **Calibration Broken (Eastgate):** A predicted risk of 10% now corresponded to an actual 15% deterioration rate. Under-prediction. Dangerous complacency.
  *   **Error Rates Diverged:** Eastgate FNR skyrocketed to 10%, while the Crossings FNR remained stubbornly high at 12%. Now *more* critically ill Eastgate patients were missed, while Crossings patients *still* faced higher missed-case rates.

  **Attempt Three:** *"Better Data" Fantasy.* Aris threw herself into finding new features. She incorporated more detailed social determinants of health indices, subtle biomarkers, even natural language processing of nursing notes. The overall accuracy inched up to 94.5%. The calibration within groups became even tighter, more beautiful, more precise. The base rate difference (8% vs. 18%) remained. And the error rate disparity? It persisted, etched into the results with the same cruel clarity. The improved model simply made the unfairness *more precise*.

  One late night, Lena found Aris slumped at her desk, surrounded by printouts showing the same irreconcilable trade-off graphed a hundred different ways. Aris gestured helplessly at the screens. "Look! It's like… like a seesaw. Push FNR down in the Crossings, FPR there flies up. Push FPR down in Eastgate, FNR there explodes. Hold calibration perfectly? The error rates split based on the base rate. It’s… constant. A tax paid in human cost, dictated by the initial conditions."

  Lena pulled up a chair. "Show me the math again. The core of it."

  Aris grabbed a marker and stalked to the whiteboard. "Here," she drew furiously. "Group A, Eastgate. Base Risk: P_A = 0.08. Group B, The Crossings. P_B = 0.18. Our model has some predictive power, quantified by its accuracy or AUC, but it’s not perfect, say… 0.93. Now," she drew overlapping probability distributions. "To have *calibration within groups*, the score has to map correctly to the *actual* risk distribution *within* each group."

  She sketched the distributions – Eastgate's risk scores clustered lower, Crossings higher. "Now, to have *equal FNR*," she drew a vertical line representing the decision threshold, "this threshold has to catch the same *proportion* of the true positive distribution in each group. But because the actual risk distributions are shifted," she gestured at the separation between the two groups' high-risk clusters, "applying the *same* proportion cut-off means the *absolute position* of the threshold is different relative to each group's distribution. That difference *forces* the FPR to be different."

  She erased and started again. "Conversely, if I try to set the threshold to give *equal FPR* – catching the same *proportion* of the *non-critical* patients incorrectly – that threshold lands in a different spot relative to each group's *critical* distribution, guaranteeing unequal FNR."

  Finally, she drew the calibration requirement. "And if I insist the score *means* the same thing probabilistically in each group – perfect calibration – then the *entire shape and position* of the score distribution relative to the actual risk is fixed within each group. Trying to force the error rates to be equal by moving the threshold just breaks that calibration immediately. The only way out?" She wrote two conditions:
  1.  P_A = P_B (Equal Base Rates)
  2.  Model Accuracy = 1.0 (Perfect Prediction)
  "Neither exists here. The base rates are different because the world is unjust. Perfect prediction is a fantasy. So," she capped the marker, her voice hollow, "we pick our poison. Who gets the false negatives? Who gets the false positives? The math *forces* us to choose which unfairness we inflict. 'Fairness' isn't one thing. It's two, and they're at war."

  Lena stared at the board, the elegant lines of probability theory translating into Mrs. Evangeline's pale face, into the hypochondriac wasting a critical bed. "The Triage Constant," she murmured.

  ---

  The Ethics Committee meeting was tense. Aris presented the data, the beautiful calibration, the ugly error disparities, and the brutal, inescapable math. She showed her failed attempts. She pointed to the whiteboard, still bearing the proof Lena had asked for.

  "We have three options," Aris stated, her voice stripped of its earlier zeal, leaving only weary honesty. "Option One: Prioritize Calibration Within Groups. This is statistically 'honest.' A score of X means X risk, equally truthful in Eastgate and the Crossings. The cost: Critically ill patients in the Crossings are significantly more likely to be missed than those in Eastgate. Mrs. Evangeline was nearly a statistic under this model. Option Two: Prioritize Equal False Negative Rates. We ensure an equally low chance of missing a critical case, regardless of zip code. The cost: We will massively over-triage patients in the Crossings, flooding limited resources with false alarms, potentially delaying care for *truly* critical patients elsewhere, *and* breaking calibration – a score of 30% in the Crossings won't mean 30% risk anymore. Option Three: Prioritize Equal False Positive Rates. We minimize unnecessary interventions equally. The cost: We will miss *more* critical cases in Eastgate than in the Crossings, *and* also break calibration there."

  She paused, letting the grim choices hang in the air. "There is no Option Four. Not with this model. Not with *any* model predicting this outcome with imperfect accuracy on populations with different base rates. We can't 'fix it with better data' because the data *isn't* the root cause. The root cause is the underlying disparity in health outcomes, and the mathematical reality that these two definitions of fairness cannot coexist under these conditions. We have to choose… and understand that whichever fairness we choose, the other kind of unfairness becomes mathematically inevitable. We are choosing *which* group bears the greater burden of the system's imperfection."

  The room was silent. The committee members looked at the graphs, the equations, the human cost estimates projected beside them. The pristine data, meticulously gathered and scrubbed, hadn't provided an answer. It had only illuminated the dimensions of the trap.

  Aris walked out of Mercy General later, the weight of the Triage Constant heavy on her shoulders. She looked at the ER doors – the same entrance for Eastgate and the Crossings. Inside, an algorithm, tuned one way or another, would silently, mathematically, dictate different probabilities of error based on the postal code the ambulance reported. Her perfect data hadn't built a fair system. It had only proven, irrevocably, that under the harsh light of unequal reality, perfect fairness was a mirage fractured into two incompatible truths. The math held. The choice remained. And the cost, she knew, would be measured not in server cycles, but in human lives unfairly lost or disrupted, no matter which path they took. The impossibility wasn't a bug. It was the brutal equation at the heart of their broken world.
