          max(300(1-p), 300p) = 300 * max(1-p, p)
          and max(1-p, p) is at least 0.5 (and strictly greater than 0.5 unless p=0.5, then equal to 0.5). So the maximum expected profit from a non-random policy is at least 150 (when p=0.5) and more otherwise.
