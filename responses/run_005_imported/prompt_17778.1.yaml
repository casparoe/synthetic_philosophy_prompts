      Therefore, she argues that Split is not beaten by any single policy in every scenario.

  (3) Callum: Introduces a randomized strategy: flip a coin to choose between Sun and Rain. 
      - With probability 0.5, we get Sun: then if sunny, profit=300; if rainy, profit=0.
      - With probability 0.5, we get Rain: then if sunny, profit=0; if rainy, profit=300.
      The expected profit in either state of the world (sunny or rainy) is:
          If sunny: 0.5*300 + 0.5*0 = 150
          If rainy: 0.5*0 + 0.5*300 = 150
      So the coin-flip plan yields $150 regardless of the weather. Since 150 > 100, this plan beats Split in every scenario.

  (4) Nadia: Argues that the coin-flip plan is hypothetical and not practical because you have to place one order and live with the weather. Therefore, she says, a hypothetical randomizing scheme that you wouldn't use cannot show that ordering Split every week is a mistake.

