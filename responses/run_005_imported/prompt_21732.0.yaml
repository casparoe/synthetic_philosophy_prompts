  - **The Greatest Goods**: Moore identifies the enjoyment of beautiful objects (involving true cognition and fitting emotional response) and personal affection (based on accurate appreciation of good qualities) as the highest intrinsic goods. These form organic unities where the whole is far more valuable than the sum of the parts.
  - **Method of Isolation**: Value is assessed based on the case alone, ignoring any consequences. For instance, unperceived beauty (A) has intrinsic value, while unperceived ugliness (C) has intrinsic disvalue.
  - **Principle of Organic Unities**: 
    - A combination of true cognition and fitting emotion (e.g., B, D, G) creates high intrinsic value, exceeding the value of the parts separately.
    - Cases with mismatched or artificial elements (e.g., E, H) lack this organic unity and have negligible value.
    - Accurate negative responses to bad qualities (F) involve a fitting organic unity but are intrinsically disvaluable due to the negative emotions.
  - **Value Tiers**:
    - **Great Goods**: High positive intrinsic value, representing the "greatest goods" Moore describes (e.g., B and D).
    - **Minor Goods**: Positive intrinsic value but less significant, often due to the absence of full organic unity or experiential elements (e.g., G and A).
    - **Negligible**: Minimal or neutral intrinsic value; typically involve flaws like false beliefs or artificiality that undermine organic unity (e.g., E and H).
    - **Minor Evils**: Negative intrinsic value but not severe; often involve isolated disvalues (e.g., F).
    - **Great Evils**: Strong negative intrinsic value; represent fundamental disvalues like ugliness (e.g., C).

  ### Sorting Rationale:
  - **D (Personal affection with accurate appreciation)**: This is a prime example of Moore's greatest good—lifelong mutual affection based on true appreciation of good character traits forms a highly valuable organic unity.
  - **B (Perceived beauty with fitting admiration)**: Also a great good, combining true cognition of beauty and fitting emotion, creating a strong organic unity. Slightly less valuable than D because personal affection involves interpersonal goods, which Moore may prioritize.
  - **G (Lonely appreciation of beauty)**: A minor good; involves true cognition and fitting emotion, forming an organic unity, but lacks personal affection, making it less valuable than B or D.
  - **A (Unperceived beauty)**: A minor good; beauty has intrinsic value per the isolation method, but no cognition or emotion reduces its value compared to cases involving experience.
  - **E (Misplaced affection)**: Negligible; affection and emotion have some positive value, but the false belief about qualities undermines the organic unity, making it almost valueless.
  - **H (Artificial admiration)**: Negligible; the emotion is positive but pharmacologically induced with no true cognition, so it lacks any real organic unity and has no intrinsic value. Slightly worse than E because E at least involves a (flawed) belief-based affection.
  - **F (Accurate negative emotion)**: A minor evil; true cognition of bad qualities with fitting emotion forms an organic unity, but the intense negative emotions (contempt, resentment) make it intrinsically disvaluable.
  - **C (Unperceived ugliness)**: A great evil; ugliness has intrinsic disvalue per the isolation method, worse than cases involving experience (like F) because it represents a fundamental disvalue in reality.

