answer: |-
  You've hit on a fascinating and sophisticated debate in formal epistemology! The leap from "proper scoring rules incentivize honesty" to "incoherent credences are *always* epistemically defective" is indeed significant and relies on a powerful concept called **accuracy dominance**. Let's break down Jim Joyce's argument step-by-step, address your core concern, and examine its vulnerabilities.

  **Core Concepts & Assumptions:**

  1.  **Credence (c):** Your degree of belief in a proposition, represented as a number between 0 (certainly false) and 1 (certainly true).
  2.  **Coherence:** A set of credences obeys the Kolmogorov probability axioms (non-negativity, normalization, additivity). An *incoherent* set violates at least one axiom (e.g., c(A) + c(not-A) ≠ 1, or c(A or B) ≠ c(A) + c(B) when A and B are mutually exclusive).
  3.  **Accuracy:** The fundamental epistemic goal is to have credences that are *close to the truth*. A credence of 1 in a true proposition is maximally accurate; a credence of 1 in a false proposition is maximally inaccurate. Accuracy is measured relative to the *actual world* (which proposition is true/false).
  4.  **Scoring Rule (S):** A function that assigns a numerical *score* S(c, ω) based on your credence `c` and the actual world `ω`. *Lower* scores are better (like Brier score - it's a penalty). An *accuracy measure* is a scoring rule where:
      *   **Truth-Directedness:** If ω makes proposition X true, then for any two credences c1 > c2 in X, S(c1, ω) < S(c2, ω) (higher credence in truth is better). Similarly, if ω makes X false, then c1 < c2 implies S(c1, ω) < S(c2, ω) (lower credence in falsehood is better).
      *   **Propriety (Strict):** For any coherent credence function C, the *expected score* E[S(C, ω)] calculated using C itself is *strictly lower* than the expected score E[S(C', ω)] for any *different* credence function C' ≠ C. (Honesty is the uniquely best policy *if* your credences are coherent).
  5.  **Accuracy Dominance:** A credence function C is *accuracy-dominated* by another credence function C* if, *in every possible world ω*, S(C*, ω) < S(C, ω). C* is uniformly more accurate than C, no matter how the world turns out.

  **Joyce's Accuracy-Dominance Argument for Probabilism (Structure):**

  1.  **Premise 1 (Measure of Accuracy):** There exists a scoring rule S that is *truth-directed* and *strictly proper*. (The Brier score is the canonical example: S(c, ω) = (1 - c)^2 if ω makes X true, or (0 - c)^2 if ω makes X false. Summed over all propositions in your agenda).
  2.  **Premise 2 (Dominance Principle):** If a credence function C is *accuracy-dominated* by some alternative credence function C* relative to a reasonable measure of accuracy (like S), then C is *epistemically defective* or *irrational*. (Holding C is guaranteed to be less accurate than holding C*, regardless of truth).
  3.  **Key Mathematical Theorem (Joyce, 1998, 2009):** For *any incoherent* credence function C defined over a set of propositions, and for *any* strictly proper and truth-directed scoring rule S, there exists a *coherent* credence function C* such that C* *accuracy-dominates* C relative to S. That is:
      *   For *every possible world ω*, S(C*, ω) < S(C, ω).
      *   C* is coherent.
  4.  **Conclusion (Probabilism):** Therefore, *all* incoherent credence functions are epistemically defective/irrational. Only coherent (probabilistic) credence functions avoid the flaw of being accuracy-dominated.

  **Bridging Your Gap: From Honesty Incentive to Universal Defect**

  This is where the **dominance theorem** does the heavy lifting, going far beyond the propriety of the scoring rule:

  *   **Propriety (Your Club):** *Given* that your credences `C` are coherent, the *expected* score (using `C`) is minimized only by reporting `C` honestly. It tells you what to report *if* you are coherent. It doesn't directly say anything about incoherent states.
  *   **Dominance Theorem (Joyce):** It directly targets *incoherent* credences. It says: **No matter what your incoherent credences are, and no matter how the world actually turns out, there is *always* some specific coherent set of credences (C*) that would have been *strictly more accurate* in that world.** Your incoherent credences are *guaranteed* to be less accurate than C* in every conceivable scenario.
  *   **The Epistemic Punch:** The argument claims that this guaranteed sub-optimality relative to a genuine measure of accuracy (truth-directed & proper S) constitutes a fundamental *epistemic* flaw. Holding incoherent credences means you *could have had* credences (C*) that were *unambiguously better* at tracking the truth, no matter what the truth turned out to be. Avoiding this kind of guaranteed inaccuracy is presented as a core requirement of epistemic rationality itself, independent of any practical competition.

  **Why Truth-Directedness & Propriety Matter for "Genuine Accuracy"**

  1.  **Truth-Directedness:** This is non-negotiable. A scoring rule that doesn't reward higher credence in truths and lower credence in falsehoods isn't measuring accuracy at all. It might be measuring something else (e.g., "boldness" regardless of truth).
  2.  **Propriety:** This ensures the scoring rule "respects" coherent credences in a specific way. It guarantees that coherent credences are *self-recommending* – they judge *themselves* to be the best bet for minimizing expected inaccuracy. This prevents situations where a coherent agent would think, "Hmm, I believe P to degree 0.7, but I expect reporting 0.8 would get me a better score *on average*." Propriety anchors the scoring rule to the agent's own best (coherent) judgment about truth. It makes the score a plausible measure of *epistemic utility* from the agent's perspective. Without propriety, the dominance result wouldn't have the same force, as the scoring rule might be arbitrarily favoring certain credences regardless of their link to truth-tracking.

  **Where Philosophers Find the Argument Vulnerable:**

  1.  **The Arbitrariness of the Scoring Rule:**
      *   **Critique:** While the Brier score is strictly proper and truth-directed, so are *infinitely many others* (e.g., the Logarithmic Score: S(c, ω) = -log(c) if true, -log(1-c) if false). Crucially, **the dominating coherent credence function C* depends on the specific scoring rule S used.** Different proper scoring rules can disagree on which coherent function dominates a given incoherent one, and even on *how much* better it is in different worlds. This raises the question: If "accuracy" isn't uniquely defined by these rules, and the dominance result is rule-relative, how can it ground an *absolute* requirement of coherence? Maybe coherence is only required relative to a *chosen* (arbitrary?) measure of accuracy.
      *   **Response (Joyce & others):** The argument only requires that *for any reasonable measure* (i.e., truth-directed and proper), incoherent credences are dominated. The *existence* of such a dominating coherent alternative under *any* reasonable measure is the flaw. The fact that different measures pick different dominators doesn't negate the guaranteed flaw under each measure.

  2.  **Weighting & Agenda Relativity:**
      *   **Critique:** Standard dominance arguments (like Joyce's original) assume all propositions are scored equally (e.g., equal weight in the summed Brier score). But why should all propositions matter equally for measuring *overall* epistemic accuracy? What if some propositions are more important? Further, the dominance result holds relative to a specific set of propositions (the "agenda"). Adding or removing propositions can change whether a credence function is dominated.
      *   **Response:** More sophisticated versions try to address weighting (e.g., using weighted sums) or argue that the basic flaw exists regardless of weighting as long as the agenda is rich enough (e.g., includes a partition).

  3.  **Is Accuracy the *Only* Epistemic Good? (Value Pluralism):**
      *   **Critique:** Epistemic value might not be *solely* about accuracy. Other goods like:
          *   **Respecting Evidence:** A coherent credence function C* might dominate an incoherent C, but C* could be *wildly out of step* with the agent's actual evidence (e.g., C* could assign extreme values based on no evidence). Is C* *really* epistemically better than an incoherent C that mostly respects the evidence but has a minor miscalibration? Accuracy dominance seems to ignore *how* the credences are justified.
          *   **Informational Value/Content:** Sometimes holding *less* precise (even seemingly incoherent) credences might be warranted if the evidence is ambiguous. Forcing coherence might require artificially precise commitments.
      *   **Response:** Proponents argue that while respecting evidence is crucial, *given* a body of evidence, the rational *response* to that evidence should still be coherent. Accuracy-dominance shows that incoherence *itself* introduces an unnecessary inaccuracy risk. They might concede that dominance identifies *a* flaw, but perhaps not the *only* flaw or one that always trumps other considerations (though they often argue it's fundamental).

  4.  **Scope: Does it Apply to All Belief States?**
      *   **Critique:** The argument cleanly applies to *precise* numerical credences. It's less clear how it applies to:
          *   **Imprecise Credences (Sets of Probabilities):** Some argue rational agents should sometimes have sets of probability functions, not a single one. Can these sets be accuracy-dominated? The argument might not straightforwardly generalize.
          *   **Full Beliefs (Outright Acceptance):** The argument targets degrees of belief, not necessarily the rationality of categorical belief or disbelief.

  5.  **"Epistemic Defectiveness" vs. Practical Irrationality:**
      *   **Critique:** Even granting the dominance, does this show incoherent credences are *epistemically* defective, or just that they are *pragmatically* suboptimal for achieving accuracy (like in your forecasting club)? Is the guarantee of doing worse on *this specific score* sufficient to ground a purely *epistemic* norm?
      *   **Response:** The argument hinges on the claim that accuracy *is* the fundamental epistemic goal. If you accept that premise, then guaranteed suboptimality relative to accuracy *just is* epistemic defectiveness.

  **In Summary:**

  The argument moves from "proper scoring rules incentivize honest reporting of coherent credences" to "incoherent credences are universally epistemically defective" via the powerful **accuracy dominance theorem**: for *any* reasonable (truth-directed, proper) measure of accuracy, *every* incoherent credence function is strictly less accurate than *some* coherent alternative *in every single possible world*. This guaranteed suboptimality is claimed to be a core epistemic flaw.

  The main vulnerabilities lie in:
  1.  **The apparent arbitrariness** of choosing one proper scoring rule over another (and the rule-dependence of the dominator).
  2.  **Questioning whether accuracy is the sole epistemic good** (vs. evidence-resonance, etc.).
  3.  **Concerns about weighting propositions and the relativity to the agenda.**
  4.  **Scope limitations** regarding imprecise credences or full belief.

  Joyce's argument remains a cornerstone of formal epistemology because it provides a compelling, mathematically rigorous link between coherence and the seemingly fundamental epistemic aim of accuracy. However, the debates surrounding its assumptions and implications are very much alive, highlighting the complexity of grounding rational norms. Your intuition that the leap is significant is spot-on – the dominance theorem is the crucial, non-obvious bridge.
