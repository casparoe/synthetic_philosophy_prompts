  For the first topic, connectionism as implementation. Fodor and Pylyshyn famously argued that connectionism is just implementation-level, not cognitive-level. The guest will likely echo this. The follow-up needs to address whether connectionist models can explain systematicity without classical structure. Maybe reference Smolensky's tensor product representations as a rebuttal. The user wants to challenge the dismissal of connectionism.

