answer: |-
  That's a fantastic rabbit hole to be in! Anscombe's pamphlet is a dense but crucial text in the ethics of war, and her definition of "innocent" is central to her absolutist position. Let's break down the philosophical mechanics and its role in her broader argument:

  **1. Dissecting the "Act vs. Role" Distinction:**

  You've nailed the core move: Anscombe wants a purely *functional*, *causal* definition of "innocent" stripped of moral desert or subjective guilt. "Innocent" = "not engaged in harming" (i.e., not posing an unjust threat).

  *   **The Problem (Sleeping Soldier):** If "harming" only meant the *immediate physical act* (pulling a trigger, thrusting a bayonet), then:
      *   Attacking soldiers in their sleep, on leave, eating, marching unarmed towards a position, or even reloading would be murder.
      *   Warfare as conventionally understood becomes practically impossible.
  *   **Anscombe's Solution ("Role"):** She argues that "what someone is doing" can encompass their *status* or *role within an ongoing hostile enterprise*. A soldier "under arms" (meaning enlisted, uniformed, part of a military unit engaged in conflict) is *functionally* part of the apparatus causing harm, even when temporarily inactive. Their *role* makes them a legitimate threat *by participation*.

  **Is this genuine philosophical work or convenient stretching?**

  It's **genuine philosophical work**, but it operates on a specific foundation and has significant implications:

  *   **Rooted in Action Theory:** Anscombe (drawing on Aristotle and Aquinas) sees human actions as *intentional* and often *extended* in time. Joining an army, taking an oath, wearing a uniform, and following orders constitute a *complex intentional action* – "waging war" or "participating in hostilities." Sleeping is a *phase within* that ongoing action, not a complete cessation of it. Think of it as "being a combatant" is the action, and specific acts (shooting, sleeping, marching) are modes of participation or necessary pauses within it.
  *   **Status vs. Conduct Debate:** You're right to identify this as the core debate. Anscombe leans heavily towards a **status-based account** for combatants. Once you willingly assume the *role* of a combatant (even conscripted, as she argues the role itself involves harming), you enter a class of people who can be targeted *because of that status*, not solely based on your instantaneous conduct. This aligns with the traditional laws of war distinction between combatants and civilians.
  *   **Why it's Not *Merely* Convenient Stretching (Though it has that effect):**
      *   **Internal Consistency:** For an absolutist like Anscombe, who absolutely prohibits *intentionally* killing the innocent (defined functionally), this move is *necessary* to make *any* warfare potentially permissible. Without it, her principle would forbid almost all combat. It's a logical requirement of her system.
      *   **Moral Foundation:** The justification hinges on the combatant's *participation* in the collective act of unjust aggression (assuming the war is unjust, which she argued WW2 was for the Axis). By joining the harming enterprise, they make themselves liable to defensive/retaliatory force aimed at stopping *that enterprise*. Sleeping is part of sustaining the force needed for that enterprise.
      *   **Limiting Principle:** Crucially, she adds the proportionality rider: even while targeting the combatant *because of their role*, you can only use force *necessary* to achieve the military objective (putting them *hors de combat*). Bombing a sleeping camp is permissible *only* if it's militarily necessary to disable that unit; gratuitous slaughter or disproportionate force is still forbidden. This prevents the definition from becoming a blank check.
  *   **Where the "Stretch" Criticism Bites:**
      *   **Ambiguity of "Role":** How far does "role" extend? Does a cook in a rear base count? A clerk processing payroll? Anscombe implies "under arms" or directly supporting the *fighting function*, but the line can be blurry. Her definition focuses on the *fighting soldier* primarily.
      *   **Temporal Scope:** When does the "role" definitively start and stop? Is a soldier on leave in their hometown a target? Anscombe likely relies on context (wearing uniform? subject to recall? actively part of the conflict?) but it's less clear-cut than the surrender case.
      *   **Moral Nuance:** It deliberately excludes considerations of personal motivation (reluctant conscript vs. enthusiastic volunteer) or immediate threat level. For Anscombe, this is a feature (focusing on the objective wrong of killing non-harmers), but it can feel morally crude.

  **2. Does this Technical Definition do Real Work for Hiroshima/Nagasaki?**

  **Absolutely, critically so.** It's not a detour; it's the bedrock of her condemnation. Here's how:

  1.  **Establishing the Absolute Prohibition:** Her entire case against Truman rests on the absolute moral prohibition against *intentionally killing the innocent*. The technical definition rigorously defines who counts as "innocent" in this context: **anyone not currently participating in the harming enterprise (war) by role or act.**
  2.  **Directly Applying to Civilians:** The populations of Hiroshima and Nagasaki were overwhelmingly civilians – non-combatants. By Anscombe's definition:
      *   They were *not* "under arms."
      *   They were *not* fulfilling a direct combat *role*.
      *   Therefore, they were categorically **innocent** (not harming).
  3.  **Blocking Consequentialist Defenses:** Truman's defenders argued necessity: ending the war swiftly, saving lives overall. Anscombe rejects this utterly. *If* the atomic bombs intentionally killed the innocent (which, by her definition, they clearly did), then no alleged good consequence (even if true) can justify it. The prohibition is absolute. Her precise definition of "innocent" makes this charge stick. Blurring the definition (e.g., "they worked in factories," "their city supported the war effort") would open the door to consequentialist justifications she wants to slam shut.
  4.  **Distinguishing from Legitimate Targeting:** Her definition *allows* attacking military installations *even if* some civilians nearby might be killed *collaterally* (under double effect, if proportionate and the target is legitimate). But Hiroshima/Nagasaki were chosen *as cities*, targeting the civilian population *as such* to induce terror and surrender. The bombs were weapons of *massacre*, intentionally using the killing of innocents as the means to the end. Her "role"-based definition of innocence makes this intentional targeting crystal clear and absolutely impermissible.
  5.  **The Core of Her Indignation:** Her fury stems from Oxford honoring a man who, by this strict definition, ordered the intentional killing of tens of thousands of innocents – an act she equates with murder on a vast scale. The technical definition provides the unassailable (in her view) moral logic for this condemnation.

  **In Conclusion:**

  Anscombe's "act vs. role" distinction for defining "innocent" is a sophisticated philosophical move essential to her absolutist framework. It's grounded in action theory and a status-based view of combatancy, allowing warfare while maintaining a strict prohibition. While it inevitably involves some conceptual stretching (defining the precise boundaries of "role"), it's far more than a convenient dodge; it's a necessary and coherent part of her system.

  Crucially, this definition is **paramount** to her argument against Truman and the atomic bombings. It provides the precise, functional criterion that definitively classifies the victims as "innocent," thereby triggering the absolute prohibition against their intentional killing and rendering any consequentialist defense morally null and void in her eyes. Understanding this definition is key to grasping the full force and uncompromising nature of her condemnation. It's the scalpel she uses to dissect the ethical failure she believed the bombings represented. Good luck with your piece – it's a vital and challenging topic!
