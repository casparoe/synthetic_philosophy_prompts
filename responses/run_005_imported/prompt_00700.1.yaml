  Okay, the user is a law clerk for a federal appellate judge who's a textualist. They're dealing with a case involving statutory interpretation, specifically a catch-all phrase like "or any other similar device." The judge uses ejusdem generis to interpret this, ignoring the House committee report. The user discussed this with a co-clerk who argues that canons are just linguistic conventions, not about intent. But the user isn't convinced.

  They mention John Manning's 2003 article about the absurdity doctrine. Manning says that in a public-choice framework, where legislation is a result of compromises, it's hard to say what "the legislature" intended as absurd. So he suggests narrowing the absurdity doctrine. The user's query is whether Manning's argument also applies to other canons like ejusdem generis, whole-act rule, etc. They want an argument that a textualist accepting Manning's critique but still using these other canons is inconsistent.

  First, I need to recall Manning's core argument. He points out that textualism rejects collective intent due to public-choice insights—legislation is a product of deal-making, not coherent purpose. So the absurdity doctrine, which relies on what the legislature "must have" intended, doesn't fit. 

  Now, the user is extending this to structural canons like ejusdem generis. These canons assume a coherent scheme or purpose in the statute. For example, ejusdem generis looks at a list and assumes the catch-all is similar, implying a common theme. But if the statute is a bundle of compromises, there might not be a coherent scheme. So using these canons might also rely on an assumed collective intent, which Manning's reasoning undermines.

  The co-clerk's defense is that these canons are linguistic conventions, not about intent. They're how language works. So the question is whether this defense holds. I need to argue that even as linguistic conventions, these canons still implicitly assume coherence in the statute that public-choice theory challenges. For instance, noscitur a sociis depends on words sharing a common context. But if different parts of the statute were added by different factions, that context might not exist. 

  Key points to address:
  1. **Coherence Assumption**: Structural canons assume the statute has an integrated structure. Public-choice says it might not.
  2. **Intent vs. Convention**: Even if canons are linguistic, applying them to statutes requires assuming the drafters intended coherence, which public-choice disputes.
  3. **Inconsistency**: If textualists reject absurdity doctrine for lacking collective intent, they should reject these canons for the same reason.

  Also, consider examples. The whole-act rule presumes consistent usage of terms across the statute. But if different sections were drafted by different committees or compromised, terms might be used inconsistently. Ejusdem generis assumes a list has a common theme, but items might be added to please different interest groups, making the list heterogeneous. 

  The user wants the strongest version of the "linguistic convention" defense. So I need to present that before countering. The defense says: these canons are rules of language, like grammar. They apply regardless of drafter intent. For example, in everyday language, we interpret catch-alls based on context without knowing the speaker's mind. So in law, it's the same—relying on semantic conventions.

  Counter: But statutes aren't like everyday language. They are multi-authored, amended over time, with political compromises. The linguistic conventions assume a coherent speaker, but a legislature isn't a single speaker. Public-choice shows that statutory text is often inconsistent. Applying ejusdem generis might impose coherence where none exists, overriding the actual compromises made.

  Furthermore, Manning's point about path-dependency applies. A statute's form might be due to last-minute changes or riders, not a deliberate scheme. So using structural canons could disregard the political reality, similar to how absurdity doctrine imposes an assumed intent.

  Conclusion: A textualist who adopts Manning's critique but uses these canons is inconsistent unless they can show these canons don't rely on coherence. But they do, so the critique generalizes. The linguistic defense fails because statutes' nature as political products undermines the coherence assumption required by the canons.
answer: |-
  Here’s a rigorous argument that Manning’s critique of the absurdity doctrine logically extends to structural/semantic canons (e.g., *ejusdem generis*, *noscitur a sociis*, whole-act rule), rendering textualist reliance on them inconsistent under public-choice premises. I’ll first articulate the strongest linguistic-convention defense (your co-clerk’s view) before demonstrating its inadequacy.

  ---

  ### **I. The Core of Manning’s Absurdity Doctrine Critique**
  Manning’s argument rests on two pillars of modern textualism:
  1. **Public-Choice Realism**: Statutes reflect political bargains among self-interested actors, not coherent collective intent. Drafting is path-dependent, riddled with compromises, omissions, and linguistic accidents.
  2. **Rejection of Imputed Intent**: Textualists cannot attribute unexpressed purposes to "the legislature" as a unitary actor. What matters is the *objective public meaning* of the enacted text, not subjective aims.

  The absurdity doctrine—which allows courts to depart from text to avoid "absurd" outcomes—requires judges to assert that "the legislature *could not have intended*" a particular result. But under public-choice theory, legislatures lack a singular intent, and any result (no matter how odd) *could* be the product of logrolling, oversight, or strategic concession. Thus, Manning concludes, invoking "absurdity" covertly smuggles in discredited intentionalism.

  ---

  ### **II. The Target Canons: Same Logical Vulnerability**
  The structural/semantic canons you cite (*ejusdem generis*, *noscitur a sociis*, whole-act rule) face identical problems because they **depend on imputing coherence to the statutory scheme**:
  - **Ejusdem generis**: Interprets a catch-all ("other similar devices") by reference to a *shared characteristic* of the listed items.  
    *Assumes* the list reflects a deliberate, coherent category.  
  - **Noscitur a sociis**: Gives meaning to ambiguous terms based on *associated words*.  
    *Assumes* neighboring terms share a thematic unity.  
  - **Whole-act rule**: Presumes *consistent meaning* of terms across the statute and *harmonious operation* of provisions.  
    *Assumes* the statute is an integrated design rather than a patchwork.  

  **The inconsistency**: These canons all require judges to infer a "scheme," "purpose," or "coherent design" from statutory structure—precisely the kind of collective intent Manning deems fictitious under public-choice theory. If legislatures don’t have a unitary intent to avoid absurdity, they also lack a unitary intent to create consistent, harmonious schemes.

  ---

  ### **III. The Linguistic-Convention Defense (And Why It Fails)**
  **The Strongest Rejoinder (Your Co-Clerk’s View)**:  
  *"These canons are mere conventions of language use. Competent English speakers naturally interpret catch-alls in light of specific lists (*ejusdem generis*), ambiguous words in context (*noscitur a sociis*), and recurring terms consistently (whole-act rule). This is about how language works—not legislative intent. Textualists apply them because they reflect ordinary linguistic practice, not because they presume a ‘coherent scheme’ in the drafter’s mind."*  

  **Why This Defense Collapses Under Manning’s Premises**:  
  1. **Language Conventions Presume a Coherent Speaker**:  
     Linguistic conventions work because ordinary communication assumes a *single rational speaker* trying to convey meaning efficiently. But public-choice theory denies that legislatures operate like such a speaker. Statutes are multi-author, path-dependent bargains where:  
     - Terms may be deliberately ambiguous to secure votes.  
     - Lists may be expanded haphazardly to appease factions (e.g., adding unrelated items to a catch-all).  
     - Provisions may be drafted by rival committees with divergent goals.  
     
     Applying linguistic conventions *as if* the statute had a single author imposes coherence where none exists—effectively overriding the very compromises textualism claims to respect.  

  2. **The "Background Facts" Are Statutorily Contingent**:  
     Your co-clerk is right that canons encode general linguistic practices. But *statutory* language lacks the stable context of everyday speech. In Manning’s public-choice world:  
     - **Consistent usage?** A term’s meaning might shift mid-statute due to last-minute amendments traded for votes.  
     - **Associated words?** A word grouping might result from political horsetrading, not semantic kinship (e.g., "vehicles, aircraft, and dairy subsidies" to satisfy lobbies).  
     - **Harmonious operation?** Provisions may be deliberately inconsistent to limit a statute’s scope or delegate cleanup to agencies.  

     Insisting on linguistic conventions *despite* these realities functionally assumes drafters *intended* coherence—the very fiction Manning rejects.  

  3. **Textualism’s Claim to Neutrality Undercut**:  
     Textualists use canons to avoid judicial subjectivity. But if public-choice is correct, mechanically applying linguistic conventions *creates* subjectivity by:  
     - Erasing evidence of statutory fragmentation (e.g., committee reports showing catch-all phrases were political safety valves).  
     - Prioritizing artificial coherence over the enacted text’s true, disjointed meaning.  
     
     This replicates the absurdity doctrine’s error: overriding text based on imputed intent (here, intent to be linguistically conventional).  

  ---

  ### **IV. Concrete Implications for Your Judge’s Opinion**
  In your case, the judge uses *ejusdem generis* to narrow "any other similar device" by reference to listed items, while excluding committee reports about drafters’ aims. But:  
  - If public-choice is true, the catch-all might be *deliberately broad* to secure a pivotal vote, even if it undermines the list’s "scheme."  
  - Using *ejusdem generis* to "fix" this assumes drafters intended a coherent category—exactly the collective intent Manning condemns.  

  **The textualist dilemma**:  
  → If the judge rejects absurdity doctrine because legislatures "can’t intend" things, they must also reject canons that assume legislatures "intend" coherence.  
  → To use these canons *consistently*, textualists must either:  
     (a) Reject public-choice realism (undermining Manning’s critique), or  
     (b) Admit that canons covertly serve normative goals (e.g., promoting predictability), abandoning textualism’s claim to passive objectivity.  

  ---

  ### **V. Conclusion: The Inescapable Inconsistency**
  Manning’s reasoning is a universal acid. If public-choice theory dissolves the collective intent needed to justify overriding text for "absurdity," it equally dissolves the intent needed to justify *imputing coherence* to statutory structure or semantics. The "linguistic convention" defense fails because statutes are not ordinary speech acts—they are political artifacts devoid of a unitary speaker. A textualist who wields *ejusdem generis* or the whole-act rule while accepting Manning’s critique of absurdity is indeed inconsistent: both moves rely on imagining a coherent legislative designer, a fiction public-choice exposes. The solution isn’t to abandon these canons (they’re pragmatically useful), but to acknowledge that textualism, as Manning hints, must relax its hostility to purpose when structure or semantics demand it—or risk self-contradiction.  

  *Recommended reading:* For a fuller treatment, see Caleb Nelson’s "Statutory Interpretation and Decision Theory" (74 *U. Chi. L. Rev.* 329, 2007), which shows how public-choice dynamics destabilize semantic canons.*
