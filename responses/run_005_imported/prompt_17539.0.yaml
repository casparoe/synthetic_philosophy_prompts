prompt: |-
  I'm a PhD student working on the economics of information, and I've noticed that discussions of the value of information often conflate two results that actually pull in opposite directions. Good's theorem holds that a Bayesian decision-maker who is free to act optimally on new evidence should never expect, in advance, to be worse off for having observed it. Hirshleifer's classic rejoinder shows, however, that once such evidence becomes available to an entire community rather than a lone agent, it can unravel the very risk-sharing arrangements that depended on the relevant uncertainty persisting a while longer, leaving the group worse off precisely because the information arrived. Please write a short story of roughly 700-900 words in which a community's access to some new and sharper form of foresight is individually rational for each member to seek out, yet corrosive once it actually spreads, with the harm traceable specifically to the collapse of an insurance-like arrangement rather than to the news merely being unwelcome. The ending should make clear -- through the situation itself, not through a character reciting the theorem -- why this outcome is fully compatible with Good's theorem rather than a refutation of it.
reasoning: |-
  Okay, the user is a PhD student specializing in the economics of information. They're pointing out a tension between Good's theorem and Hirshleifer's critique. Good's theorem says that for a Bayesian decision-maker, more information shouldn't make you worse off in expectation. But Hirshleifer showed that when information becomes public, it can destroy risk-sharing mechanisms, making everyone worse off. 

  The user wants a story that illustrates this paradox, specifically showing how individually rational information-seeking becomes collectively harmful when it collapses insurance-like arrangements. The challenge is to demonstrate the compatibility with Good's theorem without characters explicitly stating it. 

  Hmm, they're clearly deep in their research - this isn't just an abstract request but relates directly to their work. The specificity about avoiding "characters reciting theorems" suggests they want an elegant demonstration through narrative causality. 

  For the setting... something with tangible risks and communal support systems. Coastal village with storm risks? Too common. Ah - mountain agriculture with late frosts! The "frost-watch" tradition creates perfect social insurance. 

  Key elements needed:
  1) A valuable but imperfect predictive technology (weather satellites)
  2) Individually rational adoption (each farmer benefits from early frost warning)
  3) Collective harm mechanism (premature crop harvesting destroys mutual aid)
  4) Subtle Good's theorem validation (those who accessed satellite data privately DID benefit)

  The protagonist should be conflicted - someone who sees both sides. Elara, head of the frost-watch, makes sense. Her internal struggle between tradition and technology can carry the theme. 

  Important to show the transition: 
  - First satellite user gains advantage (proving Good right)
  - As adoption spreads, everyone harvests early "just in case"
  - The communal safety net unravels
  - Final scene must show Elara realizing that those who got the data early objectively profited, thus preserving Good's theorem while society collapsed

  The frost-watch ritual needs visceral details - the cold vigil, the bell, the shared risk. Contrast with sterile satellite feeds. Ending should have her see frost-killed blossoms where mutual trust died too. 

  Must resist urge to over-explain. Trust the narrative to show why Hirshleifer's scenario doesn't violate Good's theorem - it's about the aggregation effect on institutions, not the information itself being harmful to individuals ex ante.
answer: |-
  ## The Frost-Watch Fracture

  The village of Lasting Blossom clung to the slopes of the Rimepeak Mountains, its terraced orchards a defiant splash of green against the grey stone. Life here was measured in petals and peril. The greatest peril was the *Late Kiss* – a sudden, deep frost that could strike weeks after winter’s official retreat, turning nascent fruit blossoms into brittle, blackened ghosts. For generations, survival depended on the **Frost-Watch**.

  The Frost-Watch wasn’t a person, but a pact. When the mountain air grew suspiciously still and cold on a spring night, the eldest orchardist, chosen by lot each year, would climb the high Sentinel Rock. Bundled against the biting air, they’d watch the fragile blossoms below through the long, dark hours. If frost began to glint, silver death creeping across the petals, they’d ring the great bronze bell. The clamor would shatter the stillness, rousing every villager. Lanterns would bloom like frantic stars as families scrambled into their orchards, lighting smudge pots filled with damp, smoky herbs. The combined heat and smoke, rising from hundreds of pots across the terraces, could sometimes push back the frost, saving the collective harvest. It was imperfect, exhausting, and required near-universal participation. But it was *theirs*. It was insurance, paid in vigilance and shared effort.

  Then came the whispers of the **Sky-Seeing Stone** – a rugged, solar-powered tablet offered by passing traders. For a hefty sum, it tapped into newly deployed weather satellites. It promised not just weather forecasts, but *hyper-local microclimate predictions*, including the precise risk of frost events down to the hour, pinpointed to specific elevations.

  Elara, whose family had tended the highest, most frost-vulnerable orchards for five generations, was the first to buy one. The logic was impeccable, *individually rational*. The Frost-Watch was a gamble – the watcher might miss the frost’s first kiss, or the warning might come too late for the highest slopes. The Sky-Seeing Stone promised certainty. Elara studied the glowing screen. A 92% probability of a Late Kiss three nights hence. She didn’t ring the bell. She quietly harvested every single blossom bud on her trees that very afternoon – a heartbreaking sacrifice yielding only bitter greens and paltry preserves, but guaranteeing *something* survived. When the frost came, savage and deep, Elara’s stripped branches were untouched. Her neighbours’ trees, reliant on the Frost-Watch which *had* sounded (too late for many high slopes), suffered devastating losses. Elara’s cellar, while not overflowing with fruit, held security. Good’s theorem held: *for her, alone, with the information and the freedom to act optimally (harvest early), the information was beneficial.*

  The lesson was stark. One by one, orchardists scraped together coins for Sky-Seeing Stones. The logic was irresistible. *Why gamble on the communal bell and frantic, smoky effort when you could know for sure?* Individually, each purchase made perfect sense. Protect your own.

  The next spring, the Stones predicted a Late Kiss, but with only 65% probability. Uncertainty lingered. Yet, the Stones’ logic began to corrode the old pact. Old Man Bren, drawing the Frost-Watch lot, climbed Sentinel Rock out of duty, but villagers watched their Stones, not the sky. Elara, checking her Stone obsessively, saw the probability tick up to 68% at midnight. Fear, sharp and personal, overrode communal trust. *What if Bren nods off? What if the frost hits *my* slope first?* She couldn’t risk it. She lit her smudge pots. Seeing Elara’s smoke, others panicked. One by one, across the terraces, defiant plumes rose, fueled by individual doubt amplified by the shared technology. The Stones predicted frost, but the *premature, uncoordinated* response wasted precious fuel and created only localized, ineffective heat pockets. When the *real* frost intensity arrived later, the fuel was spent, the effort fragmented. The communal shield was broken. Losses were worse than any year before the Stones.

  The final unraveling came the following spring. The Stones unanimously predicted a *severe* Late Kiss with 98% certainty. No one even considered the Frost-Watch. Why watch when you *knew*? Why coordinate when saving your own was certain? Every orchardist, acting on the crystal-clear information, harvested *all* their buds days early. The village square filled with carts piled high with useless, unopened blossoms. The air hung heavy with the sweet-sick scent of lost potential and communal despair.

  The frost came, precisely as predicted, brutal and beautiful in its deadly certainty. It silvered the barren branches of Lasting Blossom, untouched by frantic bells or futile smoke. It found nothing left to kill. The harvest was zero. Utterly, completely zero.

  Elara stood on Sentinel Rock, not as a watcher, but as a mourner. Below, the frost-kissed terraces glittered under the moon, heartbreakingly pristine. Her Sky-Seeing Stone, clutched in her numb hand, showed the plummeting temperature, confirming what she already knew. The information had been perfect. Her action – harvesting early – *had* been the optimal response to that information, just as it had been the first time. It hadn’t *caused* the frost. It had simply allowed her to act perfectly to mitigate its *personal* impact. Theoretically, if she’d been the *only* one with the Stone, she’d have saved her crop while others relied on the still-intact Frost-Watch.

  The catastrophe wasn't because the news was bad. It wasn't even directly because of the frost. It was because the *shared certainty* had destroyed the *shared uncertainty* upon which their fragile insurance, the Frost-Watch pact, depended. When everyone *knew* the frost was coming with near certainty, the incentive to participate in the risky, coordinated communal defense vanished. Why rely on others when you could act alone, optimally, on perfect information? The very act that was rational for each individual – harvesting early based on the Stone’s prediction – dissolved the mutual dependence that made collective resilience possible. The Stones hadn't lied; they’d illuminated the truth so brightly it had blinded them to the value of shared, managed doubt. The insurance arrangement, predicated on a lack of perfect foresight, collapsed under its weight.

  Elara looked at the frost-encrusted bell, silent and useless. She understood, in her bones, the cold equations. The Sky-Seeing Stone had served *her* perfectly. It was the *spread* of its truth, dissolving the communal glue of necessary ignorance, that had turned individual salvation into collective ruin. The information was good. The freedom to act on it was good. But the *shared* knowledge had shattered the only thing that made enduring the mountain's cruelty possible: their dependence on each other in the face of the unknown. The frost hadn't killed the harvest; perfect foresight had killed their shared shield against it.
