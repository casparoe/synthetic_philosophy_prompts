  First, I should construct a minimal example to show Nash's failure. Imagine a symmetric setup: disagreement point (0,0), initial feasible set is a triangle with vertices at (0,0), (1,0), (0,1). Nash solution is (0.5,0.5). Now expand the set only upward for Player 2—say new vertices at (0,0), (1,0), (0,1.5). Visually, Player 2's utopia jumps to 1.5 while Player 1's remains 1. But the Pareto frontier is now the line from (1,0) to (0,1.5), and Nash still maximizes x*y on this line. The calculus shows the new point is (0.6,0.9)—Player 1 gains while Player 2 loses share? That's unintuitive but mathematically clear. 

