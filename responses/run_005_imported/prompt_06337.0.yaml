  For why economists still use Nash: IIA is useful when bargaining sets are uncertain. If parties negotiate subsets first, Nash ensures consistency. Also, Nash is computationally easier and symmetric cases are common. But for asymmetric power? KS or others might be better. 

  The user needs this dichotomy: Nash's strength (predictability via IIA) vs. weakness (rigidity in monotonicity). I'll emphasize the trade-off—it's not that Nash is "wrong," but its axioms prioritize different virtues. 

