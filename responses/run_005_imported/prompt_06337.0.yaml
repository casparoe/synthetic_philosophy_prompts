  I'm about halfway through a game theory course this semester, and we just finished axiomatic bargaining theory -- Nash's solution first, then the Kalai-Smorodinsky (KS) solution as the "fix" for one of its weird properties. I can reproduce the mechanics fine: Nash picks the point maximizing the product of the two players' utility gains over the disagreement point, while KS instead takes the point on the Pareto frontier sitting on the straight line from the disagreement point to the "utopia point" (the vector of each player's best feasible payoff). I also know the headline result -- that Kalai and Smorodinsky basically swapped out Nash's independence-of-irrelevant-alternatives axiom for something called individual monotonicity, and that's what pins KS down as the unique solution instead of Nash's.

  What I don't have is any real gut feeling for why maximizing a product would ever punish a player for getting strictly better options in the first place. In lecture the professor raced through the standard picture where the feasible set expands in a way that only raises player 2's ceiling (player 1's best case stays put), and yet the Nash solution doesn't even weakly move in player 2's favor -- I just nodded along without actually getting it, and now there's a problem set due that assumes I do. Could you build up the intuition for why the Nash product rule can misbehave like that, why KS's "move proportionally toward your own ideal point" construction sidesteps it, and whether there's a principled reason economists still default to Nash's solution in practice even though its got this weird feature? A small worked example would help alot -- I don't need the formal uniqueness proofs, just something that'll actually stick this time.
