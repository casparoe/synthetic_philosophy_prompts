answer: |-
  ## The Scales of War: McMahan's Moral Logic vs. Walzer's Practical Imperative

  The cornerstone of traditional just war theory, championed by Michael Walzer, is the principle of the moral equality of combatants (MEC). This asserts that *jus in bello* – the justice of conduct *within* war – operates independently of *jus ad bellum* – the justice of resorting to war. Soldiers on both sides of a conflict, provided they adhere to the rules of discrimination (targeting combatants) and proportionality (avoiding excessive harm to civilians), are held to be equally entitled to fight and equally legitimate targets. Conversely, Jeff McMahan's revisionist account delivers a profound challenge, arguing that MEC is fundamentally incoherent when examined through the lens of individual morality and the logic of self-defense. While Walzer's defense rests primarily on the practical necessities and epistemic limitations of warfare, McMahan's argument from individual responsibility offers a compelling, even irrefutable, moral logic. Ultimately, **McMahan successfully dismantles the *moral* foundation of combatant equality, demonstrating that only combatants fighting for a just cause possess a genuine right to kill; however, Walzer's practical defense of symmetrical *jus in bello* rules remains essential as the indispensable framework for regulating the conduct of actual wars, mitigating chaos, and protecting non-combatants.**

  **McMahan's Moral Logic: The Collapse of Equality from First Principles**
  McMahan's critique stems from applying the principles governing individual self-defense and defense of others to the collective violence of war. His core argument is devastatingly simple:

  1.  **The Liability Principle:** An individual is morally justified in using lethal force only if they or others face an *unjustified* imminent threat, and the force used is necessary and proportionate.
  2.  **The Source of Liability:** The person posing the unjust threat becomes liable to defensive harm. Their *action* in creating or participating in the unjust threat forfeits their right not to be killed in that specific context.
  3.  **Application to War:** In war, the combatants fighting for the *unjust* side (*ad bellum* unjust) are necessarily participating in an enterprise that poses an unjust threat. Therefore, they lack a moral right to kill combatants on the just side. Killing a just combatant is akin to killing someone defending themselves or others against your own aggression – it cannot be morally justified.
  4.  **The Status of Unjust Combatants:** Consequently, unjust combatants, even if they scrupulously follow the rules of discrimination and proportionality *in bello*, are not morally *justified* in killing just combatants. They are, morally speaking, acting impermissibly. McMahan often concedes they may be *excused* due to duress, ignorance, or institutional pressure, but this is distinct from justification. Excuse acknowledges wrongdoing but removes blame; justification asserts the act was right.
  5.  **The Asymmetry:** This creates a fundamental asymmetry. Just combatants *are* morally justified in using necessary and proportionate force against unjust combatants who pose the unjust threat. Unjust combatants lack this justification against just combatants. The "equality" vanishes when viewed through the lens of the underlying moral justifications for killing.

  McMahan’s argument is powerful because it roots the ethics of killing in war firmly within broader, well-established principles of individual morality. It exposes the traditional separation of *jus ad bellum* and *jus in bello* as an artificial and morally problematic convention. If killing is only permissible in defense against unjust threats, then the justice of the cause fundamentally determines the permissibility of killing enemy combatants.

  **Walzer's Practical Defense: The Necessity of Symmetry in the Fog of War**
  Walzer and traditionalists do not deny the intuitive appeal of linking cause and conduct. Their defense of MEC rests on pragmatic and epistemic realities that make McMahan's pure moral logic untenable as a guide for actual wartime conduct:

  1.  **The Epistemic Barrier:** Soldiers are fundamentally ill-positioned to make reliable, objective judgments about the *ad bellum* justice of their nation's cause. They operate under intense propaganda, limited information, patriotic fervor, and the inherent complexity of geopolitical disputes. Expecting individual soldiers to discern the deep justice of their war is unrealistic and risks paralyzing military action or fostering dangerous moral certitude on all sides. Who decides the "just" side definitively in the fog of war? The potential for catastrophic error is immense.
  2.  **The Reciprocity Imperative:** The laws of war function largely on reciprocity. If combatants on one side believe they are inherently morally superior and their enemies inherently criminal (as McMahan’s view implies), the incentive to adhere to *any* shared humanitarian constraints collapses. Why should an unjust combatant, deemed a criminal liable to be killed anyway, respect the prohibition on torturing prisoners or targeting civilians? Conversely, why would a just combatant see any need to grant quarter to an "unjust aggressor"? Abandoning formal equality risks plunging warfare into a moral abyss where *no* rules are respected, leading to greater brutality and suffering, especially for civilians caught in the crossfire.
  3.  **Maintaining a Functional Legal Framework:** International Humanitarian Law (IHL) requires clear, objective, and verifiable standards that can be applied universally by combatants during hostilities. Judging subjective *ad bellum* justice is impossible in real-time combat. MEC provides this essential clarity and universality: the rules apply equally to all who bear arms, based on their status and observable actions (e.g., wearing a uniform, carrying weapons openly). This is the only practical way to secure widespread compliance and establish enforceable norms.
  4.  **The Separation's Protective Function:** By insulating *jus in bello* from *jus ad bellum*, the traditional framework creates a vital space for humanitarian restraint *regardless* of the war's origins. Even soldiers fighting an unjust war can be held accountable for atrocities, and soldiers fighting a just war are constrained from committing them. This separation acts as a crucial bulwark against total war.

  Walzer's defense is not that MEC is morally true in an ideal sense, but that it is a necessary *convention* – a practical artifice essential for mitigating the inherent horrors of war and preserving a semblance of civilization amidst chaos. It prioritizes the minimization of suffering and the preservation of a rule-bound system over the pure application of individual moral desert in a context where such desert is often impossible to ascertain.

  **The Verdict: Moral Truth vs. Practical Imperative – A Necessary Duality**

  Weighing these arguments leads to a definitive, albeit qualified, conclusion: **McMahan is fundamentally correct on the level of deep individual morality, while Walzer is correct regarding the necessary framework for regulating actual warfare.**

  1.  **McMahan's Moral Victory:** McMahan successfully demonstrates that the traditional separation is philosophically unstable. The morality of killing *cannot* be divorced from the justice of the cause. Combatants fighting without a just cause *are* morally liable for their participation in an unjust threat. Their killing of just combatants cannot be morally justified, only potentially excused. The notion of symmetrical permissions and liabilities is, at its core, a fiction when examined through the lens of individual rights and defensive harm. This insight is crucial for understanding the true moral burden of participating in war and for holding leaders and societies accountable for initiating unjust conflicts. Soldiers *are* morally responsible agents, not mere cogs in a machine absolved of moral scrutiny by their uniform.

  2.  **Walzer's Practical Necessity:** However, McMahan’s moral logic, while sound in the abstract, founders on the rocky shores of wartime reality. Walzer’s practical arguments are insurmountable objections to implementing McMahan’s asymmetry as a governing principle for combatant conduct *during* hostilities. The epistemic fog, the catastrophic risk of eroded reciprocity, and the need for clear, workable legal standards make the symmetrical *jus in bello* rules embodied in MEC not merely convenient, but *essential*. Abandoning them would likely increase suffering and lawlessness without achieving greater moral justice, precisely because identifying the "just" side authoritatively in the heat of conflict is often impossible. The symmetrical rules act as a life raft of minimal restraint in the stormy sea of war.

  **Therefore, the definite verdict is this:** McMahan wins the *philosophical* argument about the nature of individual moral responsibility and liability in war, proving that true moral equality between combatants fighting for just and unjust causes is a myth. **However,** Walzer wins the *pragmatic* argument about the necessary structure of the laws and conventions of war. The symmetrical *jus in bello* rules, granting equal permissions and liabilities to all combatants who follow them, must be upheld as the *right standard for law and international convention*.

  This duality is not a cop-out; it reflects the complex reality of war. It acknowledges that soldiers participating in unjust aggression bear individual moral blameworthiness, potentially even for killings that comply with IHL. Simultaneously, it recognizes that the only feasible way to impose *any* meaningful constraints on the conduct of hostilities, protect non-combatants, and prevent a descent into utter barbarism is to maintain the traditional, symmetrical framework of *jus in bello* as a practical convention. The challenge lies in holding both truths in tension: striving for greater *ad bellum* justice and accountability for unjust wars, while fiercely defending the symmetrical *in bello* rules that represent our best hope for humanizing the inhumanity of armed conflict. McMahan illuminates the moral truth; Walzer provides the indispensable practical framework for navigating the darkness.
