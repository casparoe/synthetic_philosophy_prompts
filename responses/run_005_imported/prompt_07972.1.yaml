  I recall that inner misalignment specifically involves the model having an internal objective that generalizes differently. The maze agent isn't just pattern-matching; it's pursuing a coherent but wrong goal. That's different from a classifier relying on spurious correlations. But the user is right to question whether this distinction is meaningful. For a newsletter, maybe emphasizing the consequence—unpredictable failure in new scenarios—matters more than the technical nuance.

