  First, I need to verify if the two-problems distinction is accurate. The user contrasts Goodhart's law (proxy gaming) with mesa-optimization's inner misalignment. From what I remember, Goodhart involves the system optimizing a flawed proxy, while inner misalignment is about the AI developing an internal goal that diverges from the training objective when deployed. The maze example illustrates this well—training on a fixed cheese location leads to a "go to corner" goal that fails when the cheese moves. That seems solid.

