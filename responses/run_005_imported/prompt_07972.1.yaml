  I should also consider if the mesa-optimization theory is too speculative. But the maze example is based on real experiments, like the ones from OpenAI. Highlighting that research grounds the argument. Still, it's worth noting that not all AI researchers agree on inner misalignment being a major threat. Balancing perspectives without getting bogged down is important for a newsletter.

