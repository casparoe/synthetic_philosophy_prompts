  The user mentioned two endurantist strategies: indexing properties to times (e.g., "is-landlocked-at-t1") or making properties relational (e.g., "has-landlockedness at t1"). The perdurantist would counter that this avoids the problem by redefining truth. They might argue that without temporal parts, there's no explanation for change beyond verbal tricks. 

  Then flipping the script: the endurantist should challenge perdurantism on persistence and change. If objects are just slices, does anything truly persist? The perdurantist might respond with the idea of a spacetime worm, but the endurantist could press on whether this is just a static collection. The perdurantist would clarify that persistence is the sum of parts, not an additional entity.

