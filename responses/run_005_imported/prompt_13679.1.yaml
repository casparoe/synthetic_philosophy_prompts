answer: |-
  ## The Fourth Relation at the Crossroads: Adjudicating Chang's Parity Against Broome's Vagueness

  The structure of practical reason hinges on how we understand the comparative relations between options. When faced with genuinely "hard choices" – like selecting between a stable legal career and a riskier, potentially more fulfilling artistic path – Ruth Chang and John Broome offer fundamentally different diagnoses. Chang posits a novel, irreducible fourth relation: **parity**. Broome insists the phenomenon is fully explicable through **vagueness** in the standard trichotomy (better than, worse than, equally good). The linchpin of this dispute is the "small-improvement argument" (SIA). To resolve the impasse, we must dissect the SIA's required work, assess its success against both equality and vagueness, and determine if parity earns its status as *sui generis*.

  **The Stakes and the Small-Improvement Argument**

  Chang's core claim is that in hard choices, options A and B are not related by the standard relations relative to a covering consideration (e.g., "overall choiceworthiness"). They are not equally good, one isn't better than the other, and crucially, they are not *incomparable* (like comparing a symphony to a banana). Instead, they stand in **parity**: they are "on a par," meaning they are comparable but neither trumps nor equals the other; they belong to the same evaluative league but differ in ways that resist precise ranking. Her primary weapon for establishing this is the SIA:

  1.  **The Test:** In a hard choice between A and B, consider a slightly improved version of one option, A+ (e.g., the artistic career with a tiny bit more financial security).
  2.  **The Phenomenon:** A+ is *not* determinately better than B. Yet, crucially, A+ is also *not* determinately worse than B, nor are they determinately equally good. Furthermore, A and B *are* comparable – choosing one *matters*, unlike with genuinely incomparable items.
  3.  **The Inference:** If A and B were *equally good*, then improving A to A+ *should* make A+ determinately better than B (just as adding $1 to one pile of $100 makes it better than the other). The fact that it doesn't rules out equality.
  4.  **The Challenge:** The persistence of non-betterness/non-worseness/non-equality even after a small improvement suggests the original relation wasn't equality, nor straightforward betterness/worseness. It points towards a distinct relation where the options are "in the same neighborhood of value" but differ in kind, making small tweaks insufficient to force a determinate ranking.

  **Ruling Out Equality: The SIA's Clear Success**

  The SIA performs admirably against the hypothesis that A and B are *equally good*. The logic is compelling:

  *   **The Equality Requirement:** If A = B (in value), then any improvement to A, however small, creates A+ > B. This is constitutive of the equality relation combined with the transitivity of "better than."
  *   **The Hard Choice Contradiction:** In paradigmatic hard choices (career A vs. career B), making a small improvement to A (A+) demonstrably *fails* to yield the judgment that A+ is determinately better than B. We remain in a state of indecision or see A+ and B as still "in the same ballpark," neither clearly superior.
  *   **Conclusion:** Therefore, A and B cannot have been equally good. The SIA successfully eliminates equality as an explanation for the original impasse.

  **The Real Battle: Ruling Out Vagueness**

  Broome's challenge is potent: the SIA's results are *exactly* what we should expect if the comparative predicate "better than" (relative to the covering value) is **vague**. Vagueness involves borderline cases where the application of a predicate is indeterminate. Consider "tall" – is someone 5'11" tall? It might be indeterminate. Similarly, Broome argues:

  1.  **Vagueness in "Better Than":** The predicate "better than" (or "at least as good as") has borderline cases. There can be a range where it's indeterminate whether A is better than B, B is better than A, or they are equally good.
  2.  **The SIA Pattern Explained:** Suppose A and B are in the borderline region for "better than." Slightly improving A to A+ might *still* leave A+ and B within this vague borderline zone. Moving A+ doesn't necessarily push it decisively into the "determinately better than B" zone; it might just shift its position slightly within the penumbra. Hence, A+ is not determinately better than B. This perfectly mirrors the SIA phenomenon without needing a fourth relation.
  3.  **Comparability Preserved:** Vagueness doesn't imply incomparability. We can meaningfully compare items within a vague domain (e.g., comparing the heights of two borderline-tall people); the indeterminacy is about the *sharp application* of the comparative predicate, not a complete lack of a common scale.

  **The SIA Against Vagueness: Assessing the Counterattack**

  For Chang to establish parity, the SIA must do more than rule out equality; it must also rule out Broome's vagueness explanation. This requires demonstrating that the SIA reveals a phenomenon *incompatible* with or *unexplained* by vagueness. Chang argues this on several fronts, with mixed success:

  1.  **Symmetry and the Failure of Sweetening:** Chang emphasizes that in hard choices, the indeterminacy is *symmetric*. Not only is A+ not better than B, but a small improvement to B (B+) would similarly not be better than A. Broome's model *can* accommodate this if the borderline zone is broad enough and symmetric around the point where "better than" flips. However, Chang argues that the *reason* for the persistence of indeterminacy under sweetening differs. In vagueness, it's epistemic or semantic indeterminacy about where the sharp cut-off lies. In parity, it's because the values are *different in kind*, making small quantitative improvements irrelevant to resolving the qualitative difference. **Assessment:** This is a point in Chang's favor, suggesting a different *explanation* for the same phenomenon. The SIA alone doesn't *prove* this qualitative difference, but it highlights a feature (persistent symmetric indeterminacy under sweetening) that *motivates* seeking an explanation beyond borderline vagueness. Broome must posit a *specific type* of broad, symmetric vagueness, which might feel *ad hoc* for the structure of value comparison.
  2.  **The Nature of the Alternatives:** Chang often uses examples involving radically different *kinds* of value (security vs. creativity, family life vs. career ambition). She argues that vagueness typically applies within a single dimension (e.g., height), while the indeterminacy in hard choices arises precisely from the *incommensurability* of distinct values contributing to the covering consideration. Broome's vagueness model treats "better than" *simpliciter* as vague, which might gloss over the underlying source of the indeterminacy – the difficulty of trading off heterogeneous values. **Assessment:** This is persuasive. While Broome *can* model the vagueness of the overall predicate, Chang's point reveals that parity might offer a more ontologically satisfying account of *why* the vagueness arises in these specific multi-value choices. The SIA, by revealing the resistance to resolution via small quantitative changes, hints at this underlying qualitative divergence.
  3.  **Normative Implications:** Chang argues that recognizing parity changes how we understand rational choice in hard cases. Under vagueness, there is (arguably) no fact of the matter about which is better; rationality might only require picking an option within the permissible set defined by the vagueness. Under parity, Chang argues, both options might be *on a par*, meaning neither is rationally required, but the agent can *create* reasons through commitment, making a justified choice even without one option being objectively better. **Assessment:** This is a significant potential advantage for parity. If Chang is right about the normative implications, it provides a *functional* reason to distinguish parity from vague trichotomy. However, the SIA itself doesn't *demonstrate* these normative consequences; it primarily serves to eliminate equality and motivate the search for an alternative to vague trichotomy.

  **Verdict: Parity as a Credible, Though Not Fully Victorious, Fourth Relation**

  The small-improvement argument successfully discharges its duty against the equality hypothesis. Its performance against Broome's vagueness challenge is more nuanced:

  *   **It Does Not *Definitively* Rule Out Vagueness:** Broome provides a coherent, technically viable model that explains the SIA pattern using only the standard trichotomy plus the well-established concept of vagueness. Philosophical economy favors this approach.
  *   **It Reveals Limitations of the Vagueness Model:** The SIA, especially when combined with Chang's emphasis on symmetric resistance to sweetening and the qualitative heterogeneity of options in hard choices, exposes potential weaknesses in the vagueness explanation. It can feel like a *description* rather than a deep *explanation* of why the vagueness arises specifically in these value conflicts. The symmetry required feels less natural than the asymmetry typical of vague predicates.

  Therefore, while the SIA alone cannot deliver a knockout blow to vagueness, it successfully establishes a *prima facie* case for something beyond the standard relations, motivating the need for an alternative. Chang's concept of **parity** emerges as a credible and philosophically significant contender:

  1.  **Explanatory Power:** Parity offers a distinct and arguably richer explanation for the *persistence* and *symmetry* of indeterminacy under sweetening, rooted in the incommensurability of different kinds of value contributing to the covering consideration. It directly addresses the qualitative difference Broome's model potentially glosses over.
  2.  **Normative Fertility:** Parity potentially unlocks a more nuanced understanding of rational agency in hard choices, emphasizing commitment and reason-creation rather than just picking within an indeterminate set.
  3.  **Sui Generis Status Justified?** Does parity *deserve* the status of a *sui generis* fourth relation? **Yes, but cautiously.** It captures a distinctive evaluative phenomenon – comparable options resistant to decisive ranking by the standard relations *even under minor perturbations*, due to a qualitative divergence in their grounds of value – that is not *fully* or *most perspicuously* captured by either the standard trichotomy or by attributing the indeterminacy solely to vagueness in "better than." While the vagueness model remains a formidable competitor on grounds of parsimony, parity provides a compelling alternative framework that offers deeper insight into the structure of value conflict inherent in practical reason. It deserves recognition as a distinct *conceptual category* essential for accurately describing and normatively understanding a fundamental class of human choices. The unresolved tension persists, but parity emerges not as a desperate postulate, but as a philosophically robust and explanatorily potent candidate for the fourth relation at the heart of hard choices.
