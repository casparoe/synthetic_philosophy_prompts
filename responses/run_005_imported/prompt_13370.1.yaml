answer: |-
  You're absolutely right to be skeptical of the "Peirce beat Popper" claim. While both grapple with demarcating science and emphasize external reality, their core projects, criteria, and implications are fundamentally different. Your instinct is spot-on – Peirce is drawing the line elsewhere. Let's break down the key differences point-by-point, using the "Fixation of Belief" passage as our anchor:

  1.  **Core Problem & Goal:**
      *   **Peirce:** His goal is to find the most reliable **method for fixing belief** (settling doubt). He critiques other methods (Tenacity, Authority, A Priori) for failing to produce *stable, durable* beliefs independent of individual whim or social fashion. Science is presented as the *solution* to this problem because it grounds belief in something external and permanent, leading to eventual convergence.
      *   **Popper:** His goal is to solve the **problem of demarcation**: distinguishing *empirical science* from non-science (metaphysics, pseudo-science). He critiques verificationism and induction. Falsifiability is the *criterion* for demarcation, not primarily a method for fixing belief (though it implies one).

  2.  **The Defining Criterion:**
      *   **Peirce:** The defining feature of the scientific method is grounding belief in **"external permanency"** (an objective reality independent of thought) and the **convergence of belief** among all investigators *in the long run*. The *process* involves observation, hypothesis, testing, and self-correction *driven by* this external reality, leading inevitably towards the "ultimate opinion" (Truth).
      *   **Popper:** The defining feature of a scientific theory is its **falsifiability** (or refutability). A theory is scientific if it *logically possible* to conceive of an observation or experiment that *could* disprove it. "It must be possible for an empirical scientific system to be refuted by experience" (*Logic of Scientific Discovery*). Convergence is not a necessary criterion.

  3.  **Role of Testing & Refutation:**
      *   **Peirce:** Testing against experience (experiment/observation) is *essential* to the scientific *process* and *how* it accesses the "external permanency." Failure (refutation) is a crucial *driver* of the self-correcting process that leads towards convergence and truth. Refutation is a *mechanism* within the method.
      *   **Popper:** Falsifiability is the *logical precondition* for a theory being scientific. The *potential* for refutation defines science. Actual refutation is the *key event* in scientific progress – it forces conjecture of new, hopefully better, falsifiable theories. Science progresses *through* refutation.

  4.  **Convergence & Truth:**
      *   **Peirce:** Convergence on a single conclusion ("the ultimate opinion") by the community of investigators *in the indefinite long run* is **essential** to the definition of the scientific method and its claim to access truth ("external permanency"). Truth *is* that ultimate convergence point. The method *guarantees* convergence on truth.
      *   **Popper:** Convergence is **not a requirement** for science. Scientists might converge on a theory for a time, but Popper is deeply skeptical of *any* guarantee of convergence on ultimate truth. We can never *verify* a theory as true; we can only corroborate it (it hasn't been falsified *yet*) or falsify it. Science is conjectural and forever tentative. Truth is a *regulative ideal*, not a guaranteed outcome.

  5.  **Handling "A Priori" (Metaphysics, Fashionable Reason) & Astrology:**
      *   **Peirce's Criterion:** He explicitly rejects the "a priori method" (metaphysics, agreeable-to-reason) because it lacks "external permanency" and fails to produce convergence – it swings like fashion. Astrology would likely fail for the same reasons: it's not grounded in an external permanency accessible to all in a way that forces convergence (Peirce would argue its "explanations" are flexible and not truly constrained by external reality).
      *   **Popper's Falsifiability:** The key question is *falsifiability*.
          *   **A Priori Systems (e.g., Pure Logic, Math):** Not falsifiable by experience? Then **not science** (Popper agrees with Peirce here). *However*, Popper might argue that *some* metaphysical systems (like atomism pre-1900) *inspired* falsifiable science, while others didn't. Falsifiability focuses on the *empirical content* of specific theories, not whole systems labeled "metaphysics".
          *   **Astrology:** Popper's classic example! He argues astrology is **not scientific** *not primarily* because it lacks convergence (though it does), but because its core claims are typically formulated vaguely or with numerous auxiliary hypotheses ("escaping clauses") that allow practitioners to explain away *any* failed prediction. It avoids *genuine* falsification. It *could* be scientific if it made precise, risky predictions that *could* be clearly refuted – but historically, it doesn't.

  6.  **Demarcation Line:**
      *   **Peirce:** Demarcates **methods of inquiry**. Science is the method characterized by its *source* (external permanency) and its *outcome* (long-run convergence). Non-science (Tenacity, Authority, A Priori) lacks one or both.
      *   **Popper:** Demarcates **theories or systems of statements**. A theory is scientific if it is *falsifiable*. Non-scientific theories (metaphysical, pseudo-scientific, logical/mathematical) are *not falsifiable*.

  **Why Your Quote Shows the Difference:**

  Peirce says science determines beliefs by "some external permanency... by something upon which our thinking has no effect" leading to "the ultimate conclusion of every man [being] the same." This is core to his *definition of the scientific method's reliability and goal*.

  Popper would agree science *should* try to be about reality, but his criterion is purely logical: **Can you specify what would prove this specific theory wrong?** He wouldn't require the *guarantee* of convergence that Peirce does. For Popper, a theory could be perfectly falsifiable *now* (e.g., Newtonian mechanics was) even if scientists later *diverged* on how to replace it after a falsification, or if it took centuries to falsify it. The *potential* for refutation defines it as science, not the eventual convergence.

  **In Summary:**

  | Feature             | Peirce (Fixation of Belief)                          | Popper (Falsifiability)                          |
  | :------------------ | :--------------------------------------------------- | :----------------------------------------------- |
  | **Core Project**    | Finding the best *method to fix belief*              | Solving the *demarcation problem* (Science vs. Non-Science) |
  | **Defining Criterion** | Grounding in **External Permanency** + **Long-Run Convergence** | **Falsifiability** (Logical possibility of refutation) |
  | **Role of Refutation** | Crucial *mechanism* within the self-correcting method | *Defining feature* & *engine* of progress        |
  | **Convergence**     | **Essential:** Guaranteed outcome of the method (Truth) | **Not Required:** Science progresses without guaranteed convergence on truth |
  | **Truth**           | **Achievable:** Ultimate opinion reached by convergence | **Unattainable (Verification):** Only falsification is certain; truth is a regulative ideal |
  | **Handles A Priori** | Rejects - lacks external permanency & convergence    | Rejects - typically not falsifiable by experience |
  | **Handles Astrology**| Likely rejects - lacks external permanency & convergence | Rejects - typically avoids genuine falsifiability via ad-hoc adjustments |
  | **Demarcates**      | **Methods of Inquiry**                               | **Theories/Systems of Statements**               |
  | **Epistemology**    | Realist, Optimistic (convergence on truth)           | Critical Rationalist, Fallibilist (no guarantees) |

  **Conclusion:** Peirce wasn't "beating Popper to falsifiability." He was solving a different problem (fixing belief reliably) with a different solution (science defined by external permanency and guaranteed convergence). While both value empirical testing and oppose dogmatism, Popper's falsifiability is a *logical criterion for demarcation* focused on the *testability* of specific theories, explicitly rejecting the notions of verification, induction, and *guaranteed convergence* that are central to Peirce's pragmatist conception of scientific inquiry. Your chemist's intuition is correct: the line Peirce draws sorts "a priori method" and astrology differently *because* convergence and grounding in external permanency are his primary filters, not the specific logical structure of testability.
