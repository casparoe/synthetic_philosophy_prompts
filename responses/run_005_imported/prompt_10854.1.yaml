  Let me unpack the key challenges:
  - The compassion argument (all suffering matters) vs responsibility argument (fix what we broke)
  - The real resource constraints (money, space, volunteer bandwidth)
  - The slippery slope fear - if they treat one coyote victim, why not starvation cases?
