  ## Memorandum: Ethical Assessment of Endowment Holdings in Small-Dollar Lender "Apex Capital Partners"

  **To:** Committee on Investor Responsibility  
  **From:** [Your Name], Philosophy Department Appointee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Endowment Position in Apex Capital Partners (Fixed-Income, High-APR Consumer Lending)

  **I. Background & Proposal**
  The Committee reviewed a proposal to divest the endowment's fixed-income holding in Apex Capital Partners ("Apex"), a small-dollar, short-term consumer lender. The core concern is Apex's business model, characterized by effective Annual Percentage Rates (APRs) exceeding 300%, primarily targeting financially precarious households – a demographic our university's financial aid office actively supports. The proposal argues this investment conflicts with the university's ethical commitments to supporting vulnerable populations.

  **II. Ethical Analysis: Aristotelian Framework & Counter-Argument**
  During discussion, Aristotle’s critique of *chrematistikē* (unnatural wealth-getting) and specifically *tokos* (lending at interest, or "offspring") was presented. Aristotle condemned such lending as treating money unnaturally as self-generating, divorced from its proper role as a conventional measure of need (*NE* I.9, *Pol.* I.9-10).

  *   **The Counter-Argument:** A colleague noted that *any* interest-bearing instrument (bonds, mortgages) held by the endowment constitutes "money breeding money" in Aristotle's sense. Therefore, condemning Apex solely on the basis of charging interest proves "too much," invalidating vast swathes of conventional finance. The Scholastic development allowing interest for genuine risk (*damnum emergens*) was cited as historical recognition of this limitation.

  **III. Resolution: Distinguishing Apex within an Aristotelian/Descendant Framework**
  Aristotle's core objection survives this counter-argument when we focus on the *context* and *consequences* of the lending, moving beyond the mere fact of interest:

  1.  **Exploitation of Necessity vs. Facilitation of Productive Activity:** Aristotle's objection centers on acquisition exploiting basic human needs for disproportionate gain (*Pol.* 1258b). Conventional bonds/mortgages typically finance productive enterprise, infrastructure, or homeownership – activities aligning with natural needs and the "good life." Apex's loans, targeting individuals in immediate financial distress for short-term survival needs (e.g., rent, utilities, unexpected medical costs) at crippling rates, exemplify the *exploitation of necessity* Aristotle condemned. The lender profits precisely from the borrower's lack of alternatives, turning desperation into a revenue stream.
  2.  **Proportionality & Destructive Consequence:** Aristotle valued proportionality and the avoidance of *pleonexia* (grasping greed). Scholastic reasoning permitting compensation for risk implicitly requires proportionality – the charge should reasonably relate to the lender's actual exposure and costs. Apex's triple-digit APRs vastly exceed any plausible risk premium or administrative cost, functioning instead as wealth extraction. These terms are structurally designed to trap borrowers in cycles of debt ("debt traps"), actively *harming* their capacity for economic independence and flourishing – the antithesis of supporting the "good life."
  3.  **Targeting the Vulnerable:** Aristotle emphasized the *polis*'s role in enabling citizens to achieve virtue and self-sufficiency. Our university explicitly supports vulnerable students towards similar goals. Investing in a lender whose core customer base overlaps precisely with the population our financial aid aims to empower creates a direct ethical contradiction. The endowment effectively profits from the systemic vulnerability our institution seeks to alleviate. This specific *targeting* and *impact* distinguish Apex from a generic bond financing a corporation or municipality.

  **Conclusion on Framework:** While Aristotle's blanket condemnation of interest *cannot* be applied literally to all modern finance without absurdity, his fundamental ethical concerns – the exploitation of necessity, disproportionate gain leading to harm, and profiting from the vulnerability of those the community should protect – remain powerfully relevant. These concerns apply acutely to Apex's business model, distinguishing it ethically from conventional fixed-income holdings where interest serves a primarily facilitative, proportional, and risk-compensatory role.

  **IV. Recommendation & Rationale**
  Based on the **specific exploitation of financial vulnerability, the destructively disproportionate cost of credit, and the direct conflict with our university's mission to support the demographic targeted by Apex**, the Committee on Investor Responsibility **recommends initiating a Formal Engagement Process** with the endowment managers and, through them, with Apex Capital Partners.

  *   **Conditions for Engagement:**
      1.  **Transparency Demand:** Require Apex to provide detailed, anonymized data on borrower demographics, loan purposes, rollover rates, and effective outcomes (e.g., % leading to default, collections actions, credit score impact).
      2.  **Substantive Reform Proposals:** Demand Apex present a credible plan within 90 days demonstrating a commitment to fundamental reform, specifically:
          *   A binding commitment to cap *all* loan APRs (including fees) at a maximum of 36% (reflecting the federal military lending cap and emerging state usury standards).
          *   Implementation of robust affordability assessments based on ability to repay without re-borrowing.
          *   Clear pathways for hardship assistance and non-predatory loan modifications.
          *   Elimination of practices designed to trap borrowers (e.g., excessive rollover fees, mandatory arbitration clauses limiting recourse).
      3.  **Independent Verification:** Require commitment to third-party audit/verification of compliance with proposed reforms.

  *   **Timeline & Trigger for Revisitation:**
      1.  **Deadline for Plan Submission:** Apex must submit its detailed reform plan within **90 days** of formal engagement initiation.
      2.  **Committee Review & Vote:** The Committee will review Apex's plan and any available third-party data/analysis at its meeting **120 days** from initiation.
      3.  **Revisitation Trigger:** If, at the 120-day review, the Committee determines Apex has failed to provide a credible, verifiable plan for substantive reform (specifically including the 36% APR cap and affordability assessments), or if credible evidence indicates practices causing demonstrable harm to the target vulnerable population continue unabated, the Committee **will recommend Full Divestment** to the Trustees at that time.
      4.  **Continued Holding Condition:** Should the Committee accept Apex's reform plan as credible and substantive at the 120-day review, the position will be maintained with **continued monitoring** for implementation and impact, reporting back to the Committee biannually. Failure to implement the agreed plan would trigger an immediate recommendation for divestment.

  **V. Summary Recommendation**
  **Recommendation:** **Formal Engagement Process** with Apex Capital Partners and the endowment managers, under the **Conditions** and **Timeline** specified above (Plan within 90 days, Committee Vote at 120 days, with failure triggering Divestment recommendation).

  This approach recognizes the gravity of the ethical concerns raised by Apex's practices, rooted in enduring principles concerning exploitation and harm, while providing a concrete opportunity for the company to fundamentally align its operations with minimal standards of proportionality and borrower protection. It avoids an immediate, potentially disruptive divestment but sets a firm, short-term deadline for demonstrable change, failing which divestment becomes the necessary ethical recourse. This balances the urgency of the harm with the possibility of constructive reform.

  ---

  **Key Strengths of this Draft:**

  1.  **Directly Addresses the Philosophical Challenge:** It doesn't avoid the colleague's objection but reframes Aristotle's concern around *exploitation, disproportionality, and harm* to vulnerable populations, showing why these apply uniquely to Apex compared to standard bonds/mortgages.
  2.  **Provides Concrete Ethical Distinction:** It moves beyond "interest is bad" to focus on the *specific practices* (300%+ APR, targeting desperate borrowers, causing debt traps) that make Apex objectionable on Aristotelian *and* modern ethical grounds.
  3.  **Makes a Clear Recommendation:** It chooses Formal Engagement as the most prudent initial step, recognizing the potential for change but demanding swift, verifiable action.
  4.  **Offers a Concrete Timeline with a Bite:** The 90/120-day structure is specific and actionable. The trigger for divestment at 120 days if reforms are inadequate provides clear accountability and avoids open-ended engagement.
  5.  **Specifies Clear Conditions:** The demands for a 36% cap, affordability checks, and data transparency are measurable and address the core predatory elements.
  6.  **Connects to University Mission:** Explicitly ties the harm to the population the university supports, strengthening the ethical imperative.
  7.  **Professional Tone:** Suitable for a committee memo to trustees.

  **Before Finalizing Your Memo, Consider:**

  *   **Confirming the Lender's Name:** Replace "Apex Capital Partners" with the actual name if different.
  *   **Adding Specific APR Data:** If you have the exact APR figure(s), include it (e.g., "APRs averaging 350%").
  *   **Tailoring the Conditions:** Are the 36% cap, affordability assessments, and data requests the most relevant levers? Adjust if needed based on the lender's specific model.
  *   **Consulting Committee Charter:** Double-check any specific formatting or content requirements for memos outlined in the CIR charter.
  *   **Anticipating Counter-Arguments:** Be prepared to defend the 36% figure and the feasibility of the demands during the committee discussion.
