answer: |-
  Here’s a toast that threads the needle – celebrating Priya’s incredible achievement while honoring the deeper, unresolved question Keynes posed exactly for this moment, in language that resonates with both sides of the room:

  **(Clink glass gently, warm smile)**  
  "Alright, everyone. Priya. First, obviously: *Cheers*. To Priya. To hitting that FI number after a decade that probably felt like three. To walking away at 33 with no safety net except the one you meticulously, brilliantly wove yourself. That’s not just impressive, it’s… frankly, a little bit terrifying to the rest of us still clocking in! We’re all in awe. Truly.

  **(Shift tone slightly, more thoughtful but still warm)**  
  Now, being the token econ PhD, I was tasked with saying *something* beyond 'Cheers'. And my mind kept circling back to an odd coincidence. Almost exactly a hundred years ago – like, *this* year is basically the deadline – this economist, John Maynard Keynes, wrote an essay wondering what life would look like once humanity finally solved the 'economic problem'. Once scarcity wasn’t the driving force. His bet? We’d be down to about a fifteen-hour week, wrestling not with spreadsheets or survival, but with what he called the ‘permanent problem’: how to ‘live wisely and agreeably and well’ with all that freedom. How to fill the days meaningfully when you don’t *have* to do anything.

  **(Acknowledge the room's split knowledge with a light touch)**  
  Now, half of you are thinking, *‘Fifteen hours? Keynes, you sweet summer child, bless your heart.’* And yeah, globally, he was off. Big time. But, Priya? For *you*? Right here, right now? You’ve personally, spectacularly, solved the economic problem *for yourself*, landing right on Keynes’s hundred-year schedule. You’ve arrived at the exact frontier he imagined: the frontier of *leisure*, not labor. The place where the real work – the work of figuring out what ‘living well’ actually means – begins.

  **(Introduce the deeper, unresolved tension from Keynes's later thoughts)**  
  Here’s the thing Keynes realized later, though, looking back on his own younger, idealistic self. He’d once thought the answer was simple: just pursue ‘good states of mind’ – love, beauty, truth, the big, beautiful things. Easy! But as he got older, he saw how… *fragile* that idea could be. He saw civilization, and the good life within it, as this ‘thin and precarious crust’ over something much messier underneath. He realized that after generations trained only to strive and accumulate, actually knowing how to *live* in freedom – deeply, wisely, sustainably – isn’t automatic. It’s hard. It’s the ultimate challenge.

  **(Bring it home to Priya, celebrating her readiness for the challenge)**  
  So, Priya, that’s the extraordinary, slightly daunting, utterly fascinating space you’re stepping into. You haven’t just earned your freedom; you’ve earned the right to wrestle with Keynes’s ‘permanent problem’. And while the world at large might not be on that fifteen-hour week, *you* are. And here’s why we all know you’re uniquely equipped for this next chapter: You’ve got the same fierce intelligence you used to crack markets, but you’ve also got this incredible depth – the curiosity, the warmth, the loyalty to your people, that sense of humor that got us all through… well, *everything*. You weren’t *just* grinding spreadsheets; you were building a life worth living *outside* of them.

  **(Concrete, celebratory, unifying finish)**  
  So, we’re not just celebrating the end of the grind today. We’re celebrating the *beginning* of Priya’s grand experiment in living wisely and agreeably and well. We’re celebrating that she gets to ask the big questions Keynes posed a century ago, on her own terms. Will it always be easy? Probably not – meaningful things rarely are. But will it be fascinating, fulfilling, and full of the good stuff? Knowing Priya? Absolutely.

  So let’s raise our glasses again: To Priya! To hitting the number, to leaving on her own terms, and to the incredible adventure of figuring out what comes *after* the spreadsheet. May your freedom be as rich, complex, and deeply satisfying as you are. Cheers!"

  **Why this works:**

  1.  **The Hook:** Starts with pure celebration and awe, instantly relatable to all.
  2.  **The Coincidence:** Clearly frames the Keynes connection without jargon ("hundred years ago," "solved the economic problem," "fifteen-hour week").
  3.  **Bridging the Divide:**
      *   *For Finance Folks:* Acknowledges Keynes's global miss ("sweet summer child") but validates the *personal* relevance ("for *you*? Right here, right now?"). Uses "frontier," "spreadsheet," nods to their understanding.
      *   *For Family/Friends:* Explains Keynes's core idea ("live wisely," "freedom," "meaningfully") in accessible terms. Focuses on Priya's happiness, depth, relationships ("warmth," "loyalty," "life worth living").
  4.  **The Deeper Cut (Resolved/Unresolved):** Introduces Keynes's later doubt ("thin and precarious crust," "isn't automatic," "hard") as the *real* challenge Priya faces. This isn't doom-and-gloom; it's acknowledging the *weight* and *significance* of her choice, making her leap even more admirable.
  5.  **Celebrating Priya's Qualities:** Explicitly links her skills (intelligence) to her character (curiosity, warmth, humor) as the tools she needs for this next phase. Reassures everyone she's not just capable, but *built* for this exploration.
  6.  **The Finish:** Brings it back to pure celebration ("grand experiment," "adventure"), uniting both audiences in well-wishes for her *future* happiness and fulfillment. "After the spreadsheet" is a concrete image everyone gets.
  7.  **Tone:** Warm, celebratory, thoughtful, slightly wry ("token econ PhD," "sweet summer child"), never lecture-y. The "unresolved" aspect is presented as an exciting challenge, not a warning.
  8.  **Length & Flow:** Reads comfortably in ~3 minutes. Sentences are varied but generally short and punchy for spoken delivery. Natural pauses are built in.

  This toast honors the intellectual coincidence Priya embodies, acknowledges the genuine complexity Keynes foresaw, celebrates her achievement and character fiercely, and leaves everyone feeling optimistic about her journey into that "permanent problem" – all without losing the party vibe. Good luck!
