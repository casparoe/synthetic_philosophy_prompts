answer: |-
  David Lewis's framework provides profound insights into the unwritten norms of rationalist communities. Here's a breakdown of the key implications, focusing on emergence, maintenance, and erosion:

  ### 1. **How Conventions Arise Without Agreement: The Role of Precedent & Mutual Expectations**
     - **Organic Emergence:** Norms like steelmanning or epistemic status disclaimers emerge as **solutions to recurring coordination problems** in discourse:
       - *Problem:* How to debate without descending into unproductive conflict or misunderstanding.
       - *Solution:* Early adopters experiment (e.g., explicitly stating uncertainty). When successful (e.g., reducing backlash), this creates a salient precedent.
     - **Mutual Adjustment:** No "founding contract" is needed. A norm crystallizes when:
       1. Individuals notice others using a tactic (e.g., steelmanning) successfully.
       2. They adopt it *expecting* others to recognize/reciprocate.
       3. Success reinforces the behavior as mutually beneficial ("preferring to conform").
     - **Common Knowledge Formation:** Repeated public adherence (e.g., "Here's my steelman of your position") builds layered expectations:
       - "I steelman because I expect you to recognize it."
       - "I expect you to steelman because you expect me to expect it."
       - This becomes self-reinforcing common knowledge.

  ### 2. **Why These Norms Are Fragile Conventions (Lewis's "Arbitrariness")**
     - **Equilibrium Dependence:** Rationalist norms persist *only* because everyone expects compliance. Alternatives *could* work (e.g., formal logic-only debates, strict moderation), but the current norm is focal due to precedent.
     - **No Inherent Moral Force:** Norms against ad hominem aren't "true" but *useful*. If expectations shift, the incentive to comply vanishes, regardless of the norm's intellectual merit.
     - **Vulnerability to Preference Shifts:** Conventions rely on shared preferences for coordination. If newcomers prioritize "winning" over truth-seeking, they lack the core preference sustaining the norm.

  ### 3. **Erosion Scenarios: When Conventions Unravel**
  Lewis's model predicts failure under three key pressures:

  - **Scaling & Newcomer Influx (Common Knowledge Breakdown):**
    - **Problem:** Common knowledge requires *known* shared expectations. Newcomers lack the history observing the norm's operation.
    - **Mechanism:** New members violate norms (e.g., uncharitable replies) not out of malice, but ignorance. Old members, seeing violations, reduce *their* compliance ("Why steelman if others won't?"). The mutual expectation chain collapses.
    - **Example:** A surge of Reddit users joining LessWrong may skip "epistemic status" tags, making veterans question the norm's universality.

  - **Heterogeneous Preferences (Undermining the "Prefer to Conform" Condition):**
    - **Problem:** Conventions require participants to *prefer* conformity *given others' conformity*. Communities attracting status-seekers or culture warriors lack this preference.
    - **Mechanism:** Those valuing "debate wins" over truth gain by violating norms (e.g., ad hominem). Their non-compliance reduces others' incentives to comply, destroying equilibrium.
    - **Example:** A community focused on AI risk attracts political activists who prioritize persuasion over epistemic rigor, eroding norms against motivated reasoning.

  - **Coordination Problem Shift (Irrelevance):**
    - **Problem:** Norms solve *specific* coordination problems. If the problem changes (e.g., shift from truth-seeking to mobilization), old norms become maladaptive.
    - **Mechanism:** When norms no longer serve a salient coordination need (e.g., "epistemic status" in a meme-focused subgroup), compliance feels costly and unnecessary.
    - **Example:** A forum pivoting from philosophy to grassroots organizing may find steelmanning counterproductive to rallying support.

  ### 4. **Key Implications for Community Stewardship**
    - **Precedent is Paramount:** Early, consistent enforcement of norms sets focal points. Ambiguity or laxity in founding stages makes conventions harder to establish.
    - **Common Knowledge Requires Reinforcement:** Regular *explicit* references to norms ("Remember to steelman!") maintain common knowledge with newcomers. Archives/wiki help but aren't sufficient alone.
    - **Homogeneity Aids Stability:** Shared values (e.g., Bayesian epistemology) sustain the "prefer to conform" condition. Diversity of goals accelerates erosion.
    - **Scale Demands Formalization:** Lewis notes conventions thrive in small groups. At scale, norms may need codification/moderation (moving beyond pure convention) to prevent collapse.
    - **Erosion is Asymmetric:** Building conventions is slow; collapse can be rapid once mutual expectations falter (a coordination "bank run").

  ### In Summary:
  Lewis shows rationalist norms are **precarious social equilibria**, not natural laws. They emerge from successful precedent, hinge on common knowledge of mutual expectations, and decay when scaling dilutes shared context or attracts those rejecting core preferences. Their "arbitrariness" means communities must actively maintain the conditions for mutual expectation—or accept that norms will inevitably shift under pressure. This framework warns against assuming norms are self-sustaining; without deliberate cultivation of common knowledge and aligned preferences, erosion is the default.
