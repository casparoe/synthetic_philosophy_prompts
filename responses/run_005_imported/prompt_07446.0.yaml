answer: |-
  ## Memo: Recommendation on Futarchy Pilot for Mental Health Crisis Response Expansion

  **To:** Pilot Programs Committee  
  **From:** [Your Name], Graduate-Fellow Seat  
  **Date:** October 26, 2023  
  **Subject:** Recommendation and Conditions for Proposed Futarchy Pilot on Mental Health Crisis Response  

  This memo addresses the proposal to pilot a bounded futarchy mechanism ("vote on values, bet on beliefs") to inform the city's decision between expanding unarmed civilian mobile crisis teams or co-responder units. While the mechanism offers a theoretically intriguing approach to aggregating dispersed knowledge on an empirically tractable question, significant concerns raised by our community representatives demand rigorous safeguards. **We recommend conditional approval of the pilot, subject to the concrete conditions outlined below.** This approach allows testing the mechanism's utility while directly mitigating the core objections on value-neutrality and manipulation risk.

  ### Taking Community Representatives' Objections Seriously
  The objections are not merely operational hurdles but strike at fundamental assumptions of the futarchy framework in this specific context:

  1.  **The Non-Neutrality of the Metric ("Adverse Outcomes"):**
      *   **The Concern:** Defining "adverse outcomes" inherently embeds values. Including involuntary holds (e.g., 5150/Baker Acts) or arrests as "adverse" implicitly favors the civilian team model, as these are less likely outcomes under that approach. Excluding them implicitly favors the co-responder model by ignoring significant community concerns about coercion and criminalization. The metric *itself* pre-decides the core value conflict about what constitutes a "good" outcome in a mental health crisis.
      *   **Futarchy's Limitation:** Hanson's framework assumes the chosen metric *is* the agreed-upon value. Here, the most contentious issue *is* defining that value. The prediction market cannot resolve this; it can only predict the metric's outcome.

  2.  **Manipulation Risk Beyond Simple Subsidy:**
      *   **The Concern:** The standard rejoinder – that manipulators subsidize accurate predictors – assumes actors only care about direct financial gain within the market. This pilot faces actors with powerful *extrinsic* incentives:
          *   **Police Unions:** May benefit financially or politically from expanding co-responder units (justifying larger budgets/overtime) and could profit by betting *against* the civilian model's success, even if they believe it *would* reduce adverse outcomes (as defined).
          *   **Potential Contractors:** Entities seeking to operate a civilian program could profit by betting *for* its success, regardless of true belief, to secure the contract.
      *   **The Risk:** These actors may trade heavily based on *desired outcomes* rather than *beliefs*, potentially distorting prices significantly. Their financial resources could overwhelm "truthful" betting, especially from less-resourced community members or clinicians. The potential payoff from securing a lucrative contract or protecting union interests could dwarf any market losses.

  ### Recommendation: Conditional Approval with Robust Safeguards
  Given the potential value of evidence-based decision-making but acknowledging the serious objections, we recommend proceeding with the pilot **only under strict conditions designed to address the specific concerns raised**:

  1.  **Metric Definition (Addressing Value-Neutrality):**
      *   **Condition:** The definition of "adverse outcome" **must be developed through a transparent, inclusive public deliberation process** facilitated by the Committee *before* market launch. This process must explicitly debate and decide on the inclusion/exclusion of:
          *   Involuntary holds (detentions for evaluation).
          *   Arrests (related to the crisis incident).
          *   Use of force (any level).
          *   Deaths & serious injuries.
          *   Repeat crisis calls within X days (indicating unresolved need).
      *   **Rationale:** This forces the value judgment about what constitutes harm into the open democratic process ("vote on values") *before* the betting ("bet on beliefs") begins. The final metric must be explicitly justified in the Committee's report to Council. *Recommendation:* Given community concerns, a strong case exists for *including* involuntary holds and arrests as adverse outcomes, as their minimization is a core value proposition of the civilian model. However, this must be decided through deliberation.

  2.  **Trader Eligibility and Position Limits (Mitigating Manipulation & Power Imbalances):**
      *   **Condition A (Eligibility):** Trading access limited to:
          *   Verified city residents (via secure portal, capped per household).
          *   The pre-selected, paid panel of clinicians and dispatchers (ensuring informed participation).
          *   **Explicit Exclusion:** Employees of the Police Department, the Officers' Union, and any organization likely to bid on contracts for *either* expansion model (civilian teams OR co-responder support services) for the duration of the pilot and subsequent contract period. University researchers studying crisis response may be included.
      *   **Condition B (Position Limits):** Strict, low dollar-amount limits on individual positions (e.g., $500 max exposure per trader) and potentially aggregate limits per outcome during the trading period. The subsidy structure should incentivize early participation but prevent massive late swings.
      *   **Condition C (Transparency & Audit):** Real-time disclosure of large trades (anonymized but timestamped and sized) to the Committee. Mandatory post-market audit by an independent third party (e.g., academic economists/political scientists) focusing on trading patterns, potential manipulation attempts, and the influence of the paid panel vs. residents.
      *   **Rationale:** Directly addresses the power imbalance by excluding actors with the clearest extrinsic incentives and overwhelming resources. Low position limits reduce the impact any single manipulator can have. Transparency and auditing are crucial for legitimacy and learning.

  3.  **Pilot Design and Oversight:**
      *   **Condition:** Explicit inclusion of **robust qualitative evaluation alongside the market outcome.** This includes:
          *   Tracking implementation fidelity of the chosen model.
          *   Structured interviews/focus groups with community members (especially those with lived experience), frontline responders (both models), and impacted individuals/families *during* the two-year period.
          *   Monitoring unintended consequences (e.g., changes in call volume patterns, impact on other services, officer morale).
      *   **Condition:** The mandatory **two-year sunset and reevaluation** must include a specific assessment of:
          *   The prediction market's accuracy against the *actual* measured adverse outcome rate.
          *   The perceived legitimacy and fairness of the process by the community and stakeholders.
          *   The cost-effectiveness and administrative burden of the market mechanism itself.
      *   **Condition:** A clear, pre-defined **decision rule** for Council if the market prediction is very close (e.g., prices imply <5% difference in outcomes) or if auditing reveals significant anomalies. (Recommendation: Default to Committee recommendation based on traditional analysis in such cases).

  ### Clear Recommendation
  Based on the above analysis and conditions, **the Pilot Programs Committee recommends that the City Council APPROVE the bounded futarchy pilot for the mental health crisis response expansion decision, contingent upon the implementation of ALL the following conditions:**

  1.  **Inclusive Metric Definition:** A transparent public process defines "adverse outcomes," explicitly addressing involuntary holds and arrests.
  2.  **Restricted Trader Pool:** Exclusion of police department employees, unions, and potential contractors; access limited to residents and the paid expert panel.
  3.  **Strict Position Limits:** Low individual and aggregate trading limits.
  4.  **Enhanced Transparency & Audit:** Real-time large-trade monitoring and mandatory post-hoc independent audit.
  5.  **Comprehensive Mixed-Methods Evaluation:** Integration of qualitative data collection and analysis alongside the market outcome.
  6.  **Sunset Review Focus:** Explicit evaluation of market accuracy, process legitimacy, and mechanism cost-effectiveness.

  ### Conclusion
  This conditional approval recognizes the potential of prediction markets to inform difficult policy choices but takes the community representatives' profound concerns about embedded values and power dynamics head-on. The proposed conditions are not merely procedural; they are essential safeguards to ensure the pilot tests the mechanism's utility *without* sacrificing democratic accountability or fairness, and without being captured by actors with extrinsic incentives. If these conditions cannot be met, the pilot should not proceed. If they are met, the pilot offers a unique, albeit bounded, opportunity to gather evidence and learn about a novel decision-making tool under real-world constraints, with a built-in expiration date and rigorous evaluation.
