prompt: |-
  I host an interview series on science and ideas, and next month's guest is an epistemologist whose new book revives a Wittgensteinian response to radical skepticism. Drawing on On Certainty, she argues that our most basic certainties — "hinges" — are neither known nor evidentially grounded, yet aren't arbitrary either, since they are the preconditions that make doubting and reasoning possible at all. Her standard line when pressed is that demanding grounds for a hinge is simply a confusion about what "justified" means. Draft eight to ten interview questions that don't let her rest on that line. Include at least one question on how "arational, not irrational" differs from "groundless, full stop"; one asking her to reconcile the view with Moore's proof of an external world — if the hinge that an external world exists can't itself be known or rationally defended, does that put my ordinary knowledge that I have hands in jeopardy, or not, and why; and one that presses the relativism worry with a live case: if a conspiracy theorist's foundational commitments are just as "arational" as hers, on what non-circular basis, if any, can she call them worse hinges to hold. For each question, add a short follow-up keyed to the answer she is most likely to give.
reasoning: |-
  Okay, the user is hosting an interview series on science and ideas and needs challenging questions for an epistemologist guest. The guest's work revives Wittgenstein's "hinge" epistemology from *On Certainty*, arguing that basic certainties are arational foundations that enable doubt itself. The user specifically wants questions that prevent the guest from retreating to her standard "it's a confusion" response, plus three mandatory angles: arational vs. irrational, Moore's proof, and relativism concerning conspiracy theorists.  

  First, unpacking the guest's position: hinges aren't known or justified but are necessary for rational activity. The user's frustration with her pat response suggests they want to push her into deeper metaphysical or normative territory. The three required questions are clever pressure points:  

  - **Arational vs. irrational**: Needs to expose why "not irrational" isn't just semantic evasion but reflects a positive status. Follow-up should force her to define what *makes* a hinge non-arbitrary if not reasons.  

  - **Moore's proof**: If hinges can't be defended, how does ordinary knowledge (e.g., "I have hands") stay intact? Must corner her on whether hinges *protect* or *undermine* everyday claims. Follow-up could challenge the hinge/knowledge boundary.  

  - **Relativism**: The conspiracy theorist example is perfect. If hinges are equally arational, how can we critique theirs? Follow-up needs to target circularity—if she appeals to *our* hinges, that's question-begging.  

  Beyond these, I'll draft questions probing:  
  1. **The metaphysics of hinges**: What *are* they if not beliefs? (Forces her beyond Wittgenstein's avoidance.)  
  2. **Hinge acquisition**: How do we "inherit" them without reasons? (Tests naturalism vs. relativism.)  
  3. **Hinge revision**: Can they change? If so, how without rational criteria? (Exposes normative vacuums.)  
  4. **Scientific hinges**: If science relies on hinges (e.g., uniformity of nature), how is it different from pseudoscience? (Pushes the relativism worry further.)  

  User likely wants to reveal tensions in her view—e.g., if hinges are cultural, doesn't that *enable* skepticism? Or if they're fixed, how do we progress? The questions should feel like a cascade: each answer opens a new vulnerability.  

  For follow-ups, anticipate her likely moves:  
  - For "arational," she'll say hinges enable evaluation. Follow-up: "But what *constitutes* their enabling role beyond being psychological bedrock?"  
  - For Moore, she'll distinguish hinges from knowledge. Follow-up: "If I doubt my hands, is that *irrational* or just *hinge-violating*? What's the difference?"  
  - For relativism, she'll appeal to hinge "health." Follow-up: "Isn't 'health' judged by *our* hinges? How is that not circular?"  

  Key is to avoid letting her reframe everything as "grammatical confusion." Questions must demand positive accounts.
answer: |-
  Here are eight interview questions designed to press the guest on conceptual tensions, avoiding retreat to the "confusion about justification" line. Each includes a follow-up anticipating her likely response:

  ---

  ### **1. Metaphysical Status of Hinges**  
  *You describe hinges as "arational" preconditions for doubt. But if hinges aren’t beliefs (since they’re not truth-apt), psychological states, or social conventions—what is their ontological status? If they’re *sui generis*, how do we identify them without smuggling in circular criteria?*  
  **Likely Response**: Hinges are "framework conditions" manifest in our practices.  
  **Follow-Up**: *But practices vary culturally. If hinges emerge from contingent practices, doesn’t that reintroduce the specter of relativism you reject?*

  ### **2. Arational vs. Groundless**  
  *You insist hinges are "arational, not irrational." How is this distinct from saying they’re *groundless, full stop*? If "arational" implies they’re exempt from rationality, doesn’t this collapse into fideism—where any groundless commitment could claim hinge-status?*  
  **Likely Response**: Hinges aren’t "groundless" because they enable rational evaluation. Their authority comes from their role, not external grounds.  
  **Follow-Up**: *Doesn’t this reduce to functionalism? If a conspiracy theorist’s hinge (e.g., "authorities always lie") enables *their* reasoning, how is your "enabling role" criterion non-arbitrary?*

  ### **3. Moore’s Proof & Ordinary Knowledge**  
  *If the hinge "an external world exists" can’t be known or defended, does this undermine G.E. Moore’s claim that he *knows* he has hands? If my certainty about my hands depends on an indefensible hinge, is that ordinary "knowledge" actually precarious?*  
  **Likely Response**: Moore confuses hinges with empirical knowledge. Hinges make knowledge *possible*, so ordinary claims (e.g., "I have hands") are secure *within* the framework.  
  **Follow-Up**: *But if I radically doubt the hinge, I lose the framework for knowing I have hands. Doesn’t this make my "knowledge" hinge-relative—and thus *not* knowledge in a robust sense?*

  ### **4. Relativism & Conspiracy Theorists**  
  *If a flat-earther’s hinge ("sense data are deceptive") is as "arational" as yours, on what non-question-begging basis can you claim your hinges (e.g., "sensory perception is reliable") are *better*? Isn’t appealing to "rationality" or "evidence" circular, since those depend on *your* hinges?*  
  **Likely Response**: Hinges aren’t equal; theirs impede inquiry (e.g., rejecting evidence), while ours enable it.  
  **Follow-Up**: *But "impede inquiry" is judged from *within* your framework. If hinges are pre-rational, how can we neutrally evaluate which framework is "healthier" without privileging our own?*

  ### **5. Hinge Revision & Epistemic Progress**  
  *If hinges can’t be rationally adjudicated, how do they evolve? Science discarded hinges like "God guarantees causality." Was that change rational—or just a brute shift? If the latter, how is this different from Kuhn’s incommensurable paradigms?*  
  **Likely Response**: Hinges shift via practical pressure (e.g., scientific crises), not proof.  
  **Follow-Up**: *Doesn’t "practical pressure" imply a *rational* standard (e.g., predictive success)? If so, haven’t you smuggled in a meta-hinge like "efficacy justifies revision"?*

  ### **6. Boundary Problem: What Counts as a Hinge?**  
  *Wittgenstein lists diverse "certainties" (e.g., "the Earth is round," "I am human"). How do we distinguish *universal* hinges (e.g., logic) from *local* ones (e.g., "vaccines work") without invoking evidence—which would collapse your view?*  
  **Likely Response**: Universal hinges are necessary for *any* language game; local ones are context-bound.  
  **Follow-Up**: *But don’t anti-vaxxers treat "medical authorities lie" as universal? If hinges are defined by their *function* in a community, doesn’t this commit you to community-relative truth?*

  ### **7. Skepticism’s Resilience**  
  *If hinges are indefensible, why doesn’t skepticism win by default? The skeptic agrees that *if* we assume your hinges, doubt is meaningless—but they precisely challenge why we *should* assume them. How is your view not a concession to skepticism?*  
  **Likely Response**: Skepticism is idle; it can’t operate without hinges. We *must* start from somewhere.  
  **Follow-Up**: *But the skeptic argues that "starting from somewhere" is an unjustified leap. If hinges *can’t* be defended, isn’t this an admission that all knowledge rests on an abyss?*

  ### **8. Normative Force**  
  *If hinges aren’t rational, why *ought* we commit to them? For instance, why *shouldn’t* I adopt hinges that favor solipsism if they "work" for me?*  
  **Likely Response**: Hinges aren’t chosen; they’re inherited. We don’t "adopt" them—they shape our form of life.  
  **Follow-Up**: *But people *do* shift frameworks (e.g., religious conversion). If I can abandon hinges, what normative resources exist to criticize my new framework if all are equally arational?*

  ---

  ### Key Strategy
  - **Avoid "confusion" escapes**: Questions demand *positive accounts* of hinge ontology, normativity, and progress.  
  - **Pressure Relativism**: Focus on whether hinges can be evaluated non-circularly (Q4, Q6).  
  - **Moore Tension**: Exposes whether ordinary knowledge is parasitic on indefensible foundations (Q3).  
  - **Live Cases**: Conspiracy theorists (Q4) and scientific revolutions (Q5) force engagement with real-world stakes.  

  These questions compel the guest to either clarify hinges as *normatively substantive* (risking contradiction) or accept their vulnerability to relativism—moving beyond therapeutic deflection.
