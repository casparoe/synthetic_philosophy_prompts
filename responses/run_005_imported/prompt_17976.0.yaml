answer: |-
  Here’s a dialogue between **Quasi-Quentin** (Blackburn-style quasi-realist) and **Plan-Penny** (Gibbard-style norm-expressivist), debating whose solution *genuinely* solves Frege-Geach. They start simple but quickly dive into harder cases, exposing their core philosophical rift:

  ---

  **Setting:** *A cramped graduate office after hours. Coffee cups litter the desk. Quentin leans back, skeptical. Penny paces, gesturing with a whiteboard marker.*  

  **Quasi-Quentin (QQ):** Alright, Penny. I’ll grant you that your "hyperplan" trick *looks* elegant. Assign truth conditions relative to a world *plus* a fully resolved normative plan? Fine, modus ponens works: If "Lying is wrong" is true relative to hyperplan H, and "If lying is wrong, getting your brother to lie is wrong" is true relative to H, then sure, the conclusion follows. But that’s *cheating*. You’ve smuggled in truth-conditional semantics through the back door! Expressivism is supposed to explain moral language as *expressing attitudes*, not describing some shadowy "plan-laden" reality.  

  **Plan-Penny (PP):** Quentin, it’s not cheating – it’s *reconstructing* truth conditions *out of* planning states! The attitude *is* the state of having a hyperplan. Saying "Lying is wrong" *expresses* my plan to disapprove of lying. The "truth conditions" are just a way to model the *logic* of planning states. Your "higher-order attitudes" are the ad hoc patch! When I say "If lying is wrong, getting your brother to lie is wrong," what am I expressing? Some *third-order* attitude of… disapproving of not disapproving of…? It’s a Rube Goldberg machine!  

  **QQ:** *[Leans forward]* No! It’s elegantly economical! For modus ponens, disapproving of A (lying) while *also* disapproving of *not* disapproving of B (getting brother to lie) *just is* what accepting the conditional *means* for the expressivist. It’s directly tracking the *inferential commitment*, not inventing phantom truth-makers. But let’s get serious. **Negation.** What does "Lying is *not* wrong" express for you?  

  **PP:** Easy. Relative to hyperplan H, "Lying is not wrong" is true iff H *does not* plan to disapprove of lying. It expresses *not planning* to disapprove of lying. Logic works: ~W iff not (H plans to disapprove of lying). Contradiction is straightforward: "W and ~W" corresponds to an *inconsistent planning state*, which is impossible. Logic falls out of plan consistency. Your turn. What’s "not wrong" for you?  

  **QQ:** *[Smirks]* Disapproving of *the attitude of disapproval* toward lying. I disapprove of anyone who feels that negative vibe about lying. It’s a higher-order *rejection* of the first-order attitude.  

  **PP:** *[Eyes widen]* Hold on. So your "not wrong" is… *disapproving of disapproval*? That sounds *positive*! Like *endorsing* lying! But "not wrong" isn’t necessarily *good*; it might just be *permissible*. You’ve conflated negation with endorsement!  

  **QQ:** *[Frowns]* Fine, nuance. Maybe it’s *not disapproving* of lying, expressed by… withholding disapproval? But we express *withholding* via complex attitudes too. The point is, it’s *about the attitude structure*, not inventing a parallel truth-tracking realm like your hyperplans. **Now, disjunction.** "Either stealing is wrong or donating all your money is obligatory." What’s *that* express for you, Penny? Some mega-hyperplan that plans for *one or the other*?  

  **PP:** *[Nods firmly]* Exactly! "W_s ∨ O_d" is true relative to H iff H plans to disapprove of stealing *or* H plans to demand donating all money. The *disjunction* is built into the *possible content* of the hyperplan. The logical role of "∨" is handled by the standard truth-functional connective applied to these plan-laden propositions. **Your move, Quentin.** How do you express that disjunction without collapsing into gibberish?  

  **QQ:** *[Taps desk]* I express a *higher-order attitude*: disapproval of *both* tolerating stealing *and* tolerating not demanding donations. Disapproving of the *conjunction* of those permissive attitudes mimics disapproval of the *negation* of the disjunction. It’s inferentially equivalent!  

  **PP:** *[Scoffs]* "Inferentially equivalent" *here*, maybe, by brute force! But it’s *ad hoc* stitching! For every new logical complexity, you invent a *new*, bespoke higher-order attitude. How do you handle **mixed embeddings**, like "If either stealing is wrong or donating is obligatory, then we should investigate charity laws"? Your attitude zoo explodes! My hyperplan framework handles any embedding *compositionally* – the logic is inherited from the standard semantics operating on plan-relative truth values. Yours is a patchwork of psychological contrivances.  

  **QQ:** *[Voice rising]* Compositionality! That’s rich! Your "truth values" are *parasitic* on realism! You start with attitudes, then *pretend* they generate truth conditions robust enough to run standard logic, but the *only* thing grounding those "truth conditions" is the *attitude itself* (the hyperplan)! It’s a *simulacrum* of realism. Quasi-realism earns the *right* to talk of truth *through* the successful projection of our attitudes via this higher-order machinery. You just *assume* a truth-conditional format from the start. That’s not solving Frege-Geach *as an expressivist*; it’s *capitulating* to cognitivism!  

  **PP:** *[Calmly]* Quentin, the *point* of expressivism is to explain the *nature* of moral judgment. For Gibbard, that nature *is* planning. The logic works *because* plans are, by their nature, objects that can be consistent or inconsistent, that can stand in entailment relations *when modeled a certain way*. It’s not "capitulation" – it’s showing how a *non-descriptive* state (a plan) can underwrite *logical structure* when we understand its functional role. **Let’s hit non-assertorics.** What about wondering aloud: "Hmm, is lying wrong?" What’s happening in your attitude psychology?  

  **QQ:** *[Pauses]* Expressing… uncertainty? A lack of a settled higher-order disapproval structure? It’s the *absence* of the complex attitude that would constitute endorsement or rejection.  

  **PP:** *[Shakes head]* Vague. For me, it’s considering *different possible hyperplans*. "Is lying wrong?" corresponds to wondering *which* hyperplans (consistent with my factual beliefs) include planning to disapprove of lying. It’s exploring the *space of possible normative perspectives*. That’s how questions function logically – they partition possibilities. My framework naturally extends to questions, commands, everything! Your attitude states only seem built for *assertions*.  

  **QQ:** *[Stands up]* But those "possible hyperplans" – they’re *abstract objects*! You’ve reified planning states into a modal landscape! The genuine expressivist explains everything from the *internal dynamics* of actual, psychologically real attitudes and their inferential connections. Blackburn’s "logic of attitudes" *shows* how commitment, negation, conditionality arise *within* our practical stances. Your "hyperplans" are a convenient fiction that *hides* the expressive work behind a veil of ersatz truth conditions. You haven’t solved Frege-Geach; you’ve *bypassed* it by changing the subject to a quasi-cognitive model!  

  **PP:** *[Sighs]* And you, Quentin, haven’t *solved* the compositional generality of logic; you’ve provided a *series* of ingenious but disconnected psychological models for each connective. Gibbard gives a *unified, systematic* account where the logic works *for the same reason it always does* – truth preservation (relative to plans!). That’s the *real* solution. Earning the right to logic isn’t about *mimicking* it with attitudes; it’s about showing how the *objects* of our attitudes *inherit* logical structure.  

  **QQ:** Mimicry *is* earning! If my higher-order booing and hissing perfectly tracks logical consequence in practice, *that’s* quasi-realism’s triumph. Your plan-laden truth… it’s a Trojan Horse for realism.  

  *(They glare, realizing the chasm is fundamental: QQ sees PP’s solution as abandoning expressivism’s core by smuggling in truth-conditions; PP sees QQ’s solution as a fragile, non-compositional patchwork. The Frege-Geach solution reveals their deepest divergence on what expressivism *is* and what logic requires.)*  

  ---

  **Key Disagreements Illuminated:**

  1.  **The Nature of the Solution:**
      *   **QQ (Blackburn):** Solves Frege-Geach by *directly mirroring logical structure within the expressive, attitudinal content itself* using higher-order attitudes. Logic is *projected* from the inferential commitments of our non-cognitive states.
      *   **PP (Gibbard):** Solves Frege-Geach by *reconstructing truth-conditional semantics* (relative to hyperplans) *out of* non-cognitive planning states. Logic "falls out" because plans can be modeled as consistent/inconsistent objects supporting entailment.

  2.  **Accusations:**
      *   **QQ Accuses PP:** Of "cheating" by smuggling in truth-conditional semantics, abandoning pure expressivism for a quasi-cognitivist model. Hyperplans are suspiciously realist abstract objects.
      *   **PP Accuses QQ:** Of providing only *ad hoc*, case-by-case "patches" using increasingly complex and psychologically implausible higher-order attitudes that fail to provide a *general, compositional* account of logic for embedded contexts (especially non-assertorics).

  3.  **Hard Cases Highlighting Differences:**
      *   **Negation:** QQ risks conflating "not wrong" with endorsement; PP handles it via plan-relative truth.
      *   **Disjunction:** QQ uses complex disapproval of conjunctions of permissive attitudes; PP uses standard truth-functional disjunction over plan-laden propositions.
      *   **Mixed Embeddings/Complexity:** PP claims compositional generality; QQ's approach seems combinatorially explosive.
      *   **Non-Assertorics (e.g., Wondering):** QQ struggles (absence of attitude); PP models it as considering possible hyperplans.

  4.  **Core Philosophical Divide:**
      *   **QQ:** Believes genuine expressivism must explain logic *solely* from the internal inferential dynamics of non-cognitive attitudes. Truth-talk is *earned* as a useful projection *after* solving the problem this way.
      *   **PP:** Believes expressivism's core is identifying normative judgments *as* planning states. Showing these states *support a truth-conditional model* that delivers standard logic *is* the solution. The "truth" is plan-relative, not robustly realist.

  **Why Your Professor Cares:** This debate cuts to the heart of what expressivism *is* and what it takes to *genuinely* solve Frege-Geach. Blackburn prioritizes *purity of expressivist explanation* (attitudes all the way down). Gibbard prioritizes *systematicity and compositional generality*, accepting a reconstructed notion of "truth" as the price. Your professor will likely probe whether Gibbard's "truth-conditions" are sufficiently *expressivist* or whether Blackburn's attitudes can *really* handle all of logic without collapsing. Be ready to articulate this tension! Good luck!
