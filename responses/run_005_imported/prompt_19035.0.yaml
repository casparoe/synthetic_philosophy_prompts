  First, I need to unpack Berkeley's core principles. His focus on money as a social tool based on trust and its role in facilitating exchange is crucial. He valued circulation and productive use of money for public welfare. Now, applying that to crypto: Bitcoin as a decentralized asset versus stablecoins pegged to fiat currencies.

  For Bitcoin, Berkeley might see it as a ticket but question its lack of intrinsic value and volatility. Since it doesn't circulate widely for everyday transactions and isn't backed by a state, he'd likely criticize it. Stablecoins, being pegged to fiat, might get more approval for facilitating transactions, but he'd worry about private control versus a national bank.

