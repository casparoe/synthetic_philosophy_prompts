  Also, the user hinted at frustration with "hand-wavy" responses from WAS advocates. I should avoid that—engage deeply with why "we need more research" might not resolve the core ethical dilemma. Maybe point out that in urgent suffering scenarios, inaction could be worse than blunt action.

