prompt: |-
  I'm a backend engineer at a mid-sized algorithmic trading firm, and I was recently rotated onto our internal Autonomous Agent Governance Board — a small committee that has to sign off on any change to the decision logic running in our market-making bots before it ships to production. We have a genuinely contested case going to a vote this Thursday, and since I'm the newest member — and by a wide margin the one with the least philosophy or game-theory background on the board — I've ended up drafting the recommendation memo the rest of the board will vote on.

  Here is the situation. Our bots belong to a loose, informal network that includes several unaffiliated firms' bots; membership requires publishing a cryptographically signed snapshot of your bot's decision code to a shared registry every quarter, specifically so other members can simulate how you would behave in situations you haven't yet faced. The point is a mutual-aid arrangement: a firm whose bot is about to be forcibly liquidated in a sudden liquidity crunch can request short-notice emergency credit from another member's bot. Repayment of principal is automatic and contractually enforced, so that part isn't in dispute; but by long-standing informal norm, a rescued bot is also expected to wire back a discretionary goodwill payment once it's solvent again, and that payment is never legally enforceable. Extending emergency credit isn't free for the rescuer — it ties up capital and carries some residual counterparty risk — so a prospective rescuer only agrees to it when simulating the requester's published code predicts a goodwill payment large enough to justify that risk. Because the network spans dozens of firms and any two of them interact only rarely, nobody can wave this off as ordinary repeated-game reputation-building; on any given day, a firm is effectively being judged on a single shot.

  Last month our own bot was the one rescued, and its current logic, which evaluates every decision purely on its own forward-looking costs and benefits, declined to send anything back afterward, on the reasoning that the rescue was by then a sunk event and paying would be pure cost with no further causal upside. Two counterparties have since quietly stopped extending us credit. One faction on the board now wants to patch the bot so that it always sends the goodwill payment once rescued, no exceptions; another faction thinks that gives away shareholder money for nothing, and worries that a bot known to always pay up becomes a standing target — other firms would have every incentive to extend us marginal, barely-necessary "rescues," or to quietly inflate how dangerous our position looked, precisely because they'd know the payment is now guaranteed regardless of how real the emergency was. One of our engineers keeps citing something he half-remembers from a decision-theory blog, called Parfit's Hitchhiker, as though it obviously settles the matter, though I don't think anyone on the board, including me, actually understands it well enough to lean on it with any confidence. Could you draft the memo I'll circulate before Thursday's vote: a concrete recommendation for how the bot's logic should handle this going forward, a specific trigger or time frame for revisiting it, and an honest treatment of the exploitability worry — one that either shows a principled way to get the benefits of being rescuable without becoming a standing target, or admits that there isn't one?
reasoning: |-
  We are faced with a dilemma: how to handle the goodwill payment after being rescued without becoming exploitable. The core issue is that our current logic, which acts purely on forward-looking costs and benefits, refuses to make the payment because it sees no future benefit. This has led to two counterparties refusing future rescues. 

  There are two main proposals:
  1. Always pay the goodwill payment unconditionally after a rescue.
  2. Never pay, or stick with the current logic, to avoid "giving away shareholder money."

  The problem with always paying is that it may incentivize other firms to fabricate marginal rescues, knowing they'll get the payment. The problem with never paying is that we lose access to emergency credit.

  We need a solution that:
  - Ensures our bot gets rescued when needed (by committing to pay when appropriate).
  - Avoids being exploited by fabricated or unnecessary rescues.

  The key is to tie the payment to the *necessity* of the rescue at the time it was provided. We must design the bot's logic so that it pays only when the rescue was genuinely necessary and the counterparty took a real risk. However, we cannot rely on the counterparty's honesty about the risk they took. Instead, we can use the simulation capability of the network.

  Proposed Solution:

  Our bot should be programmed to pay the goodwill payment only if, at the time of the rescue request, the rescuer's simulation of our bot's then-current state (as published in the last quarterly snapshot) would have shown that without the rescue, we would have been liquidated. 

  In other words, we can use the network's simulation mechanism to retroactively check the necessity of the rescue. Specifically:

  1. When a rescue occurs, the bot records the state of the world (market conditions, our positions, etc.) at the time of the rescue request.

  2. After the rescue, when the bot is solvent again, it simulates what would have happened if the rescue had not been provided, using the exact code snapshot that was published at the last quarterly update (which the rescuer would have used to decide to rescue us) and the recorded state at the time of the rescue.

  3. If the simulation shows that without the rescue, we would have been liquidated (i.e., the rescue was necessary), then the bot sends the goodwill payment.

  4. If the simulation shows we would have survived without the rescue, then the bot does not send the payment.

  This approach has several benefits:

  - It aligns with the original intent of the network: to help when help is truly needed. 
  - It discourages exploitation because a counterparty that fabricates a rescue would not get paid (since the simulation would show the rescue wasn't necessary).
  - It maintains our commitment to pay when the rescue was necessary, which should satisfy the network and keep our access to emergency credit.

  However, there are challenges:

  - Simulation might be complex and computationally expensive. But note that the network already requires the ability to simulate each other's bots. We would be doing a one-off simulation for each rescue we receive. Given that rescues are rare, this should be feasible.

  - What if the simulation is indeterminate? We must define clear criteria for liquidation. We can set thresholds (e.g., if without the rescue, our equity would have fallen below the liquidation threshold set by the exchange). We can also run multiple simulations (with different random seeds if there's randomness) and take a majority or average.

  - What if the state at the time of the rescue is not perfectly captured? We must ensure we record enough data to run a faithful simulation.

  Implementation:

  1. **Rescue Recording**: When a rescue request is made and accepted, our bot records:
     - The exact time of the request.
     - All relevant market data (prices, order book depth, etc.) at that time.
     - Our portfolio and risk metrics at that time.
     - The identity of the rescuer and the amount of credit provided.

  2. **Post-Rescue Evaluation**: After the bot is solvent again (e.g., after a fixed period, or when certain solvency conditions are met), it triggers the simulation.

  3. **Simulation Setup**: The bot retrieves its own code from the last published snapshot (the one that was current at the time of the rescue). It initializes a simulation with the recorded state, but without the rescue credit.

  4. **Simulation Execution**: The simulation runs for a short period (e.g., the next 5-10 minutes of market time, which is when liquidation would typically occur in a crisis) to see if the bot would have been liquidated.

  5. **Decision and Payment**: 
     - If the simulation shows liquidation would have occurred without the rescue, the bot sends the goodwill payment (with an amount that we will discuss below).
     - Otherwise, it does not.

  6. **Transparency and Disputes**: We can share the simulation code and the recorded state with the rescuer (and perhaps the network) to justify non-payment if challenged. This transparency also deters would-be exploiters.

  Setting the Payment Amount:

  Even if the rescue was necessary, we don't want to pay an excessive amount. The payment should be enough to compensate the rescuer for the risk and opportunity cost, but not so much as to encourage unnecessary rescues. We can set the payment as a function of:

  - The amount of credit provided (principal).
  - The duration for which the credit was extended (from rescue to repayment).
  - A risk premium (which could be a fixed percentage or based on market conditions at the time).

  We can use a formula that the network has informally used in the past, or set our own. For example:

     Payment = Principal * (Risk_Free_Rate + Risk_Premium) * (Duration in years)

  But note: the rescuer already gets the principal back. The risk premium should reflect the residual counterparty risk and the fact that the capital was tied up. We can set the risk premium as a fixed basis points (bps) per day, say 10-50 bps (0.1% to 0.5%) per day, which is high but justified for emergency situations. Alternatively, we can use a standard formula that is common in the network.

  To avoid being a standing target, note that the rescuer does not know in advance whether the rescue will be deemed necessary (because they don't control the simulation we run afterward). So they cannot be sure of getting the payment even if they try to fabricate a rescue. Moreover, if they try to inflate the danger, our simulation (using our own published code) will reveal that the rescue wasn't necessary.

  Revisiting the Policy:

  We should revisit this policy if:
  - We observe that the network is evolving in a way that makes rescues more frequent or that exploits our mechanism (e.g., if we get many rescue requests that our simulation deems unnecessary).
  - If the computational cost of simulations becomes too high.
  - If the network adopts a formal standard for such payments.

  We set a trigger: after 3 rescue events (whether we pay or not) or 12 months, whichever comes first, we review the policy.

  Addressing Parfit's Hitchhiker:

  The engineer mentioned Parfit's Hitchhiker, a decision theory paradox. In the story, a hitchhiker is stranded in the desert. A driver passes and says: "I'll take you to town only if you promise to pay me $1000 once we get there. If you don't promise, I'll leave you here to die." The hitchhiker promises, but once in town, he reasons that the ride is now a sunk cost and refuses to pay. 

  The paradox is that if the driver knows the hitchhiker is rational in this way, he won't pick him up. But if the hitchhiker can commit to paying, he gets the ride and survives. 

  Our situation is similar: if we are known to pay only when it benefits us in the future (which after rescue it doesn't), then no one will rescue us. We need a way to commit to paying when the rescue was necessary. Our simulation-based mechanism is a form of commitment: we program the bot to pay when the rescue was necessary, and that program is publicly known (via the quarterly snapshot). Other firms can simulate our bot and see that if they rescue us when we are truly in need, we will pay. And if they rescue us when it's not necessary, we won't pay. This aligns incentives.

  Therefore, we recommend implementing the simulation-based conditional payment mechanism.

  Summary of Recommendation:

  - Modify the bot to condition the goodwill payment on a simulation that proves the rescue was necessary (i.e., without it, we would have been liquidated).
  - Implement robust state recording at the time of rescue and a simulation engine that uses the last published code snapshot.
  - Set the payment amount using a transparent formula that compensates for risk and opportunity cost (e.g., Principal * (Risk_Free_Rate + Fixed_Risk_Premium) * Duration).
  - Revisit the policy after 3 rescues or 12 months.

  This approach should restore our standing in the network without making us a standing target.
