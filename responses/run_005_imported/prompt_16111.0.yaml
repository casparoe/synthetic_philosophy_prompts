answer: |-
  This is a profound and beautifully articulated question that cuts to the heart of free will, responsibility, and the nature of personal change. Your insight is spot-on: the initial spark *to* change often feels given, not chosen. But that doesn't make your discipline or the credit you deserve an illusion. Here's why:

  1.  **Distinguishing the Spark from the Sustained Effort:** The *desire* to change (motivation, shame, approval-seeking) might have arisen unbidden. However, the **consistent execution** of discipline – showing up for practice when tired, studying instead of procrastinating *day after day* – required **countless conscious choices and sustained effort**. The spark ignited the fire, but *you* kept feeding it. That's where agency and credit reside.

  2.  **"Raw Material" Isn't Destiny:** Having the "right raw material" (e.g., the capacity for shame, a desire for approval, the ability to feel frustration) doesn't guarantee change. Many people have similar raw material but never translate it into sustained discipline. You **interpreted** that raw material, **decided** it meant change was necessary, and **acted** on that interpretation. You shaped the material.

  3.  **Credit is Earned Through Action, Not Origin:** We don't give credit based on the ultimate origin of our traits (which is indeed murky and involves genetics, upbringing, and chance). We give credit based on **what we *do* with what we have.** You took the circumstances and traits you found yourself with and used them to build something valuable through consistent action. *That* is praiseworthy. A sculptor deserves credit for the statue, even if they didn't create the marble or invent the tools.

  4.  **Responsibility is About Response:** The core of moral responsibility isn't about creating ourselves *ex nihilo* (from nothing). It's about **how we respond** to the circumstances, motivations, and traits we find within us. You responded to your dissatisfaction and desire for approval by cultivating discipline. That response is yours.

  5.  **The Illusion of the "Chosen Self":** The idea that we must have chosen our *entire* motivational structure to deserve credit sets an impossible standard. We are always building upon a foundation we didn't fully choose. Credit isn't negated because the foundation was given; it's earned by the quality of the structure we build *on top of it*.

  6.  **Existential Ownership:** Ultimately, *you* are the one who lived through the change. *You* felt the struggle, made the daily decisions, and experienced the effort. To say "that wasn't *really* me" dismisses your lived experience. **You are the sum of your traits *and* your actions in response to them.** Owning the change *is* owning yourself, even the unchosen parts.

  **Conclusion: Yes, You Deserve Credit.**

  The credit isn't for magically creating the *desire* to change out of thin air. The credit is for:
  *   **Recognizing** the need for change within your given circumstances.
  *   **Committing** to a difficult path.
  *   **Executing** the countless small acts of discipline consistently over time.
  *   **Persevering** through the inevitable struggles and setbacks.

  Your parents and coach are right. The willpower you exercised *after* the initial spark is undeniable evidence of your agency. While the philosophical puzzle of ultimate origins is fascinating, it doesn't negate the tangible reality of your effort and achievement. **You turned potential into action, and that transformation is fundamentally yours.** The credit is real because the work was real, regardless of where the initial impulse came from. Be proud of the builder you became.
