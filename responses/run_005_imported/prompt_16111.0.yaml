  First, I need to validate their effort. They’ve clearly worked hard, so acknowledging that is important. But their deeper concern seems philosophical. They’re stuck on the idea that the initial motivation wasn’t chosen. Maybe they’re worried their achievements aren’t truly theirs, which could undermine their sense of accomplishment.

