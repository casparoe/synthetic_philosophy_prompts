  First, I need to recall Tarski's core views. In "The Concept of Truth in Formalized Languages," he argued that natural languages are inconsistent because they allow self-referential statements like the Liar. His solution was a hierarchy of languages: each level has a truth predicate only for the level below, preventing circularity. His Convention T requires a truth definition to entail all instances of "s is true iff p" for sentences in the object language. Classical logic is essential here—truth is bivalent and consistent.

