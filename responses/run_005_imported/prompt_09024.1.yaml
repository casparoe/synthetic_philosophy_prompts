answer: |-
  Here’s a rigorous pushback against Lewis, targeting the core retributivist assumptions he relies on. I’ll argue that punishment *can* be vicariously discharged without abandoning retributive justice, by rethinking "desert," "liability," and the metaphysical structure of the debt owed:

  ### 1. **Reframing "Desert" as a Transferable Obligation (Not Personal Suffering)**
     Lewis assumes retributive justice *requires* the guilty party to *experience suffering personally*. But this conflates two distinct elements:
     - **Guilt** (the culpable state of the wrongdoer).
     - **Liability** (the obligation to discharge a debt owed to justice/society/victim).

     Guilt is non-transferable: Only the wrongdoer *is* guilty. But **liability is a debt-like obligation** that *can* be transferred or assumed by another, *if* the substitute has both the capacity and legitimacy to satisfy it.  
     - **Analogy**: If I owe you $100, *I* am the debtor. But if my friend pays you $100 with my consent (and yours), *my debt is extinguished*. The obligation wasn’t "my friend must suffer losing $100"; it was "$100 must be paid to the creditor."  
     - **Applied to Punishment**: The retributivist "debt" is not "the guilty must *feel pain*" but "a proportionate burden must be borne *for the crime*." If a substitute *willingly* bears that burden *as payment for the specific wrong*, the debt is paid. The guilty party’s *liability* is discharged, even if their *guilt* remains a historical fact. Justice isn’t cheated—it’s satisfied.

  ### 2. **The Role of Consent and Substitution in Moral Accounting**
     Lewis dismisses vicarious punishment because it "isn’t the guilty suffering." But retributive justice cares about **restoring moral equilibrium**, not inflicting pain for its own sake. Consent transforms the act:
     - **Unwilling Substitute**: Suffering imposed on an innocent third party (e.g., punishing a family member) *does* compound injustice. It doesn’t "count" as punishment for the crime.
     - **Willing Substitute**: A voluntary agent (e.g., a guarantor, a religious figure) who *accepts liability* for the debt converts their suffering into **punitive payment**. The suffering is now *for the crime*, not random or coercive.  
       - **Key Move**: The substitute’s consent *moralizes the transaction*. It becomes an act of solidarity or exchange, not a violation. The guilty party’s debt is cleared because the owed burden is definitively shouldered by one *authorized* to bear it.

  ### 3. **Liability Transfer in Practice: Legal and Moral Precedents**
     Retributivists often overlook that liability transfer exists in secular law/morality:
     - **Debt Guarantors**: If I default on a loan, my guarantor pays *my* debt. The creditor is satisfied; *my* obligation is extinguished.
     - **Corporate Liability**: When a company pays fines for executives’ crimes, it *is* accepted as discharging liability (even if imperfectly). The "debt to society" is paid via the corporation’s resources.
     - **Military Sacrifice**: A soldier taking a bullet for a comrade bears the physical consequence *in their place*. We recognize this as "their sacrifice saved X," not "X wasn’t saved because the bullet didn’t hit them."
     - **Moral Argument**: If we accept that *reparative* debts (e.g., paying restitution) can be vicarious, why not *punitive* debts? Both are obligations arising from guilt. The difference is cultural, not logical.

  ### 4. **Addressing the "Punishment Must Target the Guilty" Objection**
     Lewis’s strongest point: Punishment is *expressive*—it condemns *the wrongdoer*. A substitute’s suffering might not convey that message.  
     - **Counter**: The substitute’s act *reinforces* condemnation. By accepting the punishment, they affirm:  
       *"This debt was so real, so demanding, that an innocent bore it to spare the guilty. The guilty deserved this burden, but grace intervened."*  
       This doesn’t absolve the wrongdoer; it highlights the enormity of their debt. The guilty party escapes suffering *despite deserving it*, which can deepen shame/repentance (e.g., "I owed this, but another paid").

  ### 5. **Metaphysical Parity with Monetary Debt**
     Lewis argues money is fungible, punishment is not. But **punishment’s "non-fungibility" is psychological, not metaphysical**:
     - Money is fungible because we *agree* units are interchangeable.  
     - Punishment *could* be fungible if society/justice-system/moral-framework *accepts* a valid substitute.  
       - **Example**: Ancient "ransom" practices or religious sacrifices (e.g., Yom Kippur scapegoat) treated punishment as transferable *by design*. The suffering *was* the guilty party’s punishment, discharged symbolically.  
       - **Retributivist Consistency**: If "an eye for an eye" demands literal suffering by the guilty, why do we accept fines (money) or community service (labor) as punishment? We already accept *commutation* of suffering into other burdens. Vicarious punishment is an extreme commutation—but not a categorical break.

  ### Conclusion: A Retributivist Case for Substitution
  Lewis is right that vicarious punishment *feels* intuitively different from paying a friend’s debt—but that’s because retributivism often smuggles in **unexamined assumptions about personal suffering as inherently necessary**. Strip those away, and the core retributive demand—"a burden equivalent to the wrong must be borne *because of the wrong*"—*can* be met vicariously if:
  - The substitute **consents** and is **capable** of bearing the burden,  
  - The suffering is **exclusively assigned** to discharge *that specific debt*,  
  - The guilty party’s **liability** (not guilt) is extinguished by the act.  

  This doesn’t make vicarious punishment *wise* or *fair* in all cases. But it shows that Lewis’s "punishment isn’t fungible" claim is a feature of *how we frame desert*, not an immutable truth. Retributive justice can accommodate substitution without self-contradiction—if we conceptualize the debt as separable from the debtor’s flesh. 

