  Hmm, this is a classic Aristotle tension—he's layering metaphysical truth (demand) over practical convention (money). The user's confusion is understandable because Aristotle deliberately presents them as two levels of the same phenomenon. They've done excellent close reading by spotting the "unit in truth" versus "representative" distinction. 

  The user is clearly a philosophy student engaging deeply with primary texts. Their question reveals they're not just skimming but trying to reconcile apparent contradictions. That's sophisticated. I should avoid oversimplifying while making the distinction tangible. They might be preparing for a seminar or paper—this is exactly the kind of nuance professors love to probe.

  Breaking it down: Aristotle's demand (chreia) is the invisible force—the shared human need that creates the possibility of exchange. Without mutual but unequal needs, why trade? Money (nomisma) enters as society's solution to make this messy, qualitative need quantitatively actionable. The key is that demand is ontological (why exchange exists) while money is epistemological (how we measure it). 

  I recall Marx later praised Aristotle for this very insight—that money hides the social labor relation. Aristotle was groping toward the idea that value is relational, not intrinsic. But the user doesn't need Marxist theory; they need the internal logic of the Ethics. Should emphasize that for Aristotle, money is a brilliant human convention that approximates natural justice but remains fragile (remember his "make it useless" warning). 

  The reciprocity angle is crucial too. When Aristotle says "neither would there be association without exchange," he's grounding economics in ethics—polis survival requires fair trading. Money enables that fairness by being the agreed-upon measure. So demand is the cause, money the instrument. Like a builder's need for shelter (demand) versus their ruler (money). 

