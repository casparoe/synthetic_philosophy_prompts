answer: |-
  You've pinpointed a crucial and sophisticated tension in Aristotle's analysis of exchange! He *is* presenting two related but distinct concepts – **demand (chreia)** and **money (nomisma)** – each playing a vital, yet different, role in enabling just exchange. Here's the breakdown of their functions and why both are necessary:

  1.  **Demand (Chreia - χρεία): The Foundational "Unit in Truth"**
      *   **Function:** Demand is the fundamental, underlying *social reality* that makes exchange conceivable and necessary. It represents the *mutual need* between individuals or parties.
      *   **Why it's the "Unit in Truth":**
          *   **Creates the *Possibility* of Exchange:** If A has what B needs, and B has what A needs, the *potential* for exchange exists. Without this reciprocal need ("if men did not need one another's goods at all"), exchange simply wouldn't occur.
          *   **Creates the *Motive* for Exchange:** The desire to fulfill a need drives individuals to seek exchange.
          *   **Establishes the *Purpose* of Exchange:** The goal is to satisfy mutual deficiencies or desires.
          *   **Implies a *Relational Value*:** The value of a good *in exchange* arises primarily from how much it is needed (desired) by the other party relative to how much the offered good is needed by the first party. Value isn't seen as intrinsic but relational, based on reciprocal need.
          *   **"Holds all things together":** Demand is the glue of economic society. It's the reason humans enter into economic relationships and associations ("neither would there have been association if there were not exchange").

  2.  **Money (Nomisma - νόμισμα): The Conventional "Representative" and Measure**
      *   **Function:** Money is the practical, human-invented *tool* that solves the immense problem of *measuring* and *comparing* the diverse goods and services demanded.
      *   **Why it's the "Representative" and "Measure":**
          *   **Solves Commensurability:** Demand is real but intangible and infinitely variable. How do you compare the "need" for a house to the "need" for a pair of shoes? How do you express the value of a doctor's skill against a farmer's wheat? Money provides a *common denominator*, a single scale against which all goods can be measured ("makes goods commensurate and equates them").
          *   **Enables Practical Equality:** For exchange to be *just* (reciprocally proportional), it needs to be *equal* in value ("nor exchange if there were not equality"). Money allows us to *express* that equality numerically (e.g., 1 house = 10,000 units of money; 1 pair of shoes = 100 units; therefore, 1 house = 100 pairs of shoes). It operationalizes the equality implied by reciprocal need.
          *   **Facilitates Indirect Exchange:** Without money, exchange requires a "double coincidence of wants" (A has shoes and wants wheat; B has wheat and wants shoes). Money acts as a universally accepted intermediary, allowing A to sell shoes for money to anyone, then use that money to buy wheat from someone else.
          *   **Conventional & Contingent:** Money has no inherent, natural value tied to need. Its value and existence depend entirely on social convention and law (`nomos`). We agree to accept it as a representation of demand ("representative of demand"). This is why it can be changed or become useless – its power rests solely on collective trust and legal enforcement.

  **Why Both Concepts Are Necessary: The Relationship & Difference**

  Think of it as the difference between the *underlying force* and the *practical instrument*:

  1.  **Demand is the Cause; Money is the Effect/Enabler:** Demand creates the *necessity* for exchange and the *potential* for reciprocal value. Money is the *solution* invented *because* demand exists and needs a practical mechanism for fair exchange.
  2.  **Demand is Subjective & Relational; Money is Objective (Conventionally) & Standardized:** Demand exists in the minds and needs of individuals relative to each other. Money provides an *objective* (within the convention) and *standardized* unit to quantify and compare those subjective needs.
  3.  **Demand is Foundational; Money is Derivative:** Exchange could theoretically exist without money (barter), but it would be incredibly inefficient and struggle to achieve proportional equality. Exchange *cannot* exist without some form of reciprocal demand. Money *derives* its purpose and function entirely from the existence of demand.
  4.  **Demand Creates Value; Money Measures It:** Demand is the *source* of exchange value (why something is worth trading for). Money is the *tool* we use to *measure* and *express* that value numerically for the purpose of establishing equivalence.

  **Aristotle's Key Insight:**

  Aristotle brilliantly identifies that the *real* basis for exchange value lies in the complex web of human needs and social interdependence (`chreia`). However, he also recognizes that this social reality is too amorphous and variable to function as a practical measure in daily transactions. Therefore, society creates a conventional symbol (`nomisma`) – money – to *represent* that underlying demand and serve as a precise, measurable unit. Money doesn't *create* the fundamental value relationship; it *reflects* and *manifests* it in a usable form.

  **In short:** **Demand (`chreia`)** is the *why* and the *foundation* of exchange. **Money (`nomisma`)** is the *how* and the *instrument* that makes fair, proportional, and efficient exchange practically possible by providing a conventional measure of commensurability and equality. You need both concepts to fully explain the phenomenon of just exchange – the underlying social force and the practical societal tool.
