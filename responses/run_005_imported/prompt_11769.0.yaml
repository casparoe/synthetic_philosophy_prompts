  ok so i'm on my school's Honor Council (6 students + 2 teachers, we decide academic integrity cases and can rewrite the actual policy). current case: a kid used his friend's finished essay as a 'guide,' rewriting almost every sentence in his own words but keeping the exact same structure, examples, and order of the argument. policy only calls it a violation if the wording is 'substantially similar,' so half the council says he's technically fine, which feels wrong since he obviously didn't think it through himself. the other half wants to just ban using someone's paper as a 'guide' period, but thats basically what happens whenever friends study together, so idk where the real line even is. can you write the memo i'll bring to our meeting next week -- need an actual verdict on his case, plus a rewrite of the similarity rule so we're not just picking a random cutoff (like 40% identical wording) and calling it fair, and it has to seriously deal with the argument that any cutoff's gonna be arbitrary for cases right on the edge, not just brush that off.
reasoning: |-
  Okay, the user is part of their school's Honor Council dealing with a tricky plagiarism case. A student used a friend's essay as a guide, rewording sentences but keeping the same structure, examples, and argument order. The current policy defines violations based on "substantially similar" wording, leading to a split decision. Half think it's technically okay since the words changed, while the other half wants to ban using others' papers as guides entirely. The user needs help drafting a memo with a verdict and a revised policy that addresses the ambiguity without arbitrary cutoffs.

  First, I need to assess the core issue. The student didn't copy the wording but replicated the entire framework. This is a case of structural plagiarism, which isn't clearly covered by the current policy. The council's dilemma highlights a gap in the policy—focusing only on wording ignores other forms of intellectual theft. The user feels the verdict should account for the lack of original thought, even if the words differ.

  The user's explicit request is for a memo with a verdict and policy rewrite. But deeper needs include wanting a fair, principled approach that prevents future similar cases and addresses the arbitrariness of cutoffs. They also need to reconcile the practical aspects of peer collaboration (like studying together) with academic integrity. The memo must provide clarity without being overly restrictive.

  Next, considering the verdict. The student's actions undermine academic goals. Even with paraphrasing, the intellectual work isn't original. The verdict should be a violation, emphasizing that using someone else's structure and ideas without attribution is wrong. This sets a precedent and addresses the council's split.

  For the policy rewrite, replacing "substantially similar wording" with "structure, sequence, or ideas" makes sense. Including "derivative work" covers cases like this. Adding "original analysis" clarifies expectations. The policy should have tiers: minor (accidental, no citation), moderate (like this case), and severe (direct copying). This avoids fixed percentages and uses intent and extent.

  The memo structure: start with the case summary, then verdict rationale, policy changes, implementation notes. Highlighting that collaboration is allowed but must be cited, and derivative works are violations. Addressing the arbitrary cutoff by focusing on holistic assessment—considering structure, ideas, and originality rather than word counts.

  Also, the user mentioned that banning guides entirely might hinder legitimate study. The revised policy should differentiate between collaboration (discussing ideas) and copying frameworks. Examples help: using a friend's thesis vs. brainstorming together. Training for teachers and students on the new policy will aid understanding.

  Finally, the memo should propose a review period for the policy and a subcommittee for updates. This shows adaptability and reduces future ambiguities. Ensuring the language is clear and accessible avoids confusion.
answer: |-
  ## Honor Council Memo: Case Verdict & Policy Revision Proposal

  **To:** Honor Council Members  
  **From:** [Your Name], Student Representative  
  **Date:** [Date]  
  **Subject:** Verdict on Case # [Case Number] & Proposal for Revised Academic Integrity Policy Language  

  ### I. Case # [Case Number] Verdict: Violation

  *   **Summary:** Student X obtained a completed essay from Student Y. Student X rewrote Student Y's sentences in their own words but retained the **identical structure, sequence of arguments, specific examples used, and overall analytical framework** without proper attribution.
  *   **Current Policy Cited:** Policy states violation occurs when wording is "substantially similar."
  *   **Council Division:** Half argued no violation due to changed wording; half argued violation due to lack of original intellectual work.
  *   **Recommended Verdict:** **Violation of Academic Integrity.**
  *   **Rationale:**
      *   While the *wording* was changed, the core intellectual architecture – the blueprint of the argument, the selection and deployment of evidence, and the analytical progression – was directly appropriated from Student Y.
      *   The purpose of the assignment was to demonstrate individual understanding, analysis, and synthesis. Using another student's completed work as a structural template bypasses this fundamental requirement.
      *   "Rewriting" another's argument structure and evidence selection, even with paraphrased sentences, constitutes **derivative work** and **unacknowledged dependence**. It fails the test of independent scholarship.
      *   The current policy's exclusive focus on "wording" is insufficient to address this form of intellectual appropriation. This case exposes a critical gap.

  ### II. Problem with Current Policy & Arbitrary Cutoffs

  The core challenge is that relying *solely* on "substantially similar wording":
  1.  **Ignores Structural/Theft:** Fails to address copying the underlying intellectual structure, analysis flow, and evidence selection.
  2.  **Creates a "Paraphrasing Loophole":** Encourages the exact behavior seen here – superficial rewording of another's core work.
  3.  **Forces Arbitrary Metrics:** Leads to unworkable debates about percentage similarity thresholds (e.g., 40% identical wording), which are:
      *   **Technologically Flawed:** Plagiarism software struggles with effective paraphrasing and structural similarity.
      *   **Pedagogically Unsound:** A paper with 39% copied wording but original structure might demonstrate *more* independent thought than a paper with 0% copied wording but entirely derivative structure/examples.
      *   **Inherently Unfair at Margins:** Creates injustice for cases near any arbitrary line and incentivizes gaming the system.

  **We cannot simply pick a random cutoff and call it fair.** We need a policy based on the *principle* of independent intellectual work.

  ### III. Proposed Policy Revision: Addressing the Core Issue

  Replace the current "substantially similar wording" standard with language focusing on **originality of intellectual contribution and proper attribution**:

  **Proposed Revised Policy Language (Academic Integrity - Unauthorized Collaboration/Plagiarism Section):**

  > "Students are expected to submit work that reflects their own original analysis, synthesis, and expression. **Submitting work that is substantially derivative of another source (including another student's work, online sources, or generative AI), without proper attribution, is a violation.** This includes, but is not limited to:
  >
  > *   **a) Verbatim copying or paraphrasing of wording without citation.**
  > *   **b) Appropriating the structure, sequence, logic, or specific analytical framework of another's work without citation.**
  > *   **c) Using specific examples, data selections, or unique solutions developed by another without citation in a manner that forms the core of the submission.**
  > *   **d) Submitting work generated substantially by another person or AI tool.**
  >
  > **Collaboration vs. Submission:** Discussing ideas, studying together, or reviewing each other's work for feedback is permitted and encouraged *unless explicitly prohibited* by the instructor. However, **the final submitted work must be the product of the individual student's own intellectual effort, structure, and expression.** Relying on another student's completed assignment as a template or guide for one's own structure, argument flow, or evidence selection constitutes unauthorized use and is prohibited."

  ### IV. Why This Revision Works

  1.  **Addresses the Core Issue (Structural/Theft):** Explicitly names appropriation of "structure, sequence, logic, or analytical framework" (Point b) as a violation.
  2.  **Closes the Paraphrasing Loophole:** Defines "substantially derivative work" as the key violation, encompassing both wording *and* structure.
  3.  **Avoids Arbitrary Cutoffs:** Focuses on the *nature* of the dependence ("substantially derivative," "forms the core of the submission") rather than a percentage. This requires holistic judgment by the Council based on the evidence.
  4.  **Acknowledges Edge Cases Realistically:** Admits judgment is required for cases "on the edge" but provides clear principles (originality, derivation, core contribution) to guide that judgment, moving beyond *just* wording similarity.
  5.  **Clarifies Collaboration:** Explicitly distinguishes permitted collaboration (idea discussion, study groups, feedback) from prohibited submission practices (using another's work as a structural template/core). It ties permissibility to the *instructor's guidelines*.
  6.  **Future-Proofs for AI:** Includes derivative work from AI (Point d) and generalizes sources.

  ### V. Implementation & Addressing Concerns

  *   **Holistic Assessment:** The Council must examine *how* the student developed their work. Did they create their own outline based on research? Did they develop their own examples? Or does the work demonstrably follow the blueprint of another source? Proximity of access (e.g., having a friend's essay) is a factor.
  *   **"Substantially Derivative":** This isn't about incidental similarities. It means the borrowed structure/ideas form the *essential foundation* of the work. Did the student merely "fill in" someone else's framework?
  *   **"Guide" vs. Template:** Discussing *how* to structure *an* argument is collaboration. Using *someone's specific, completed structure* for *your* argument is derivation. The revised policy makes this distinction.
  *   **Teacher Training:** This shift requires clear communication to faculty. They should emphasize expectations for original structure/analysis in assignments and clarify when collaboration is/isn't allowed. Assignment design can help (e.g., requiring outlines/drafts, unique prompts).
  *   **Student Education:** A major education campaign is crucial. Students need to understand that "putting it in your own words" isn't enough if you're just repackaging someone else's entire intellectual process.

  ### VI. Recommendation & Next Steps

  1.  **Vote to Uphold:** Violation finding for Student X in Case #[Case Number] based on the appropriation of structure, sequence, and examples constituting unoriginal, derivative work under the *intent* of the current policy and necessitating the proposed revision.
  2.  **Vote to Adopt:** The proposed revised policy language for the Academic Integrity policy, replacing the outdated "substantially similar wording" standard.
  3.  **Form Subcommittee:** Establish a small group (2 students, 1 teacher) to finalize wording integration and plan the education/communication rollout for the revised policy.
  4.  **Set Review Date:** Schedule a review of the new policy's effectiveness in 6 months.

  This approach moves us beyond counting words and towards evaluating the integrity of the intellectual work itself. It provides principled guidance for the Council, closes critical loopholes, and upholds the true purpose of academic assignments: fostering independent thought and learning.

  **Respectfully submitted,**

  [Your Name]
  Honor Council Student Representative
