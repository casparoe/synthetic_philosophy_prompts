answer: |-
  Your question cuts to the heart of a fascinating tension between Hume's naturalistic, evolutionary account of convention and the more formal, epistemic demands of modern game theory. Let's reconstruct Hume's epistemic structure and evaluate its relationship to common knowledge (CK):

  **1. Deconstructing Hume's Epistemic State:**  
  Hume describes a process where the convention arises from:
  -   **Mutual Expression:** Each party *observably signals* their sense of common interest through behavior (e.g., not seizing goods, rowing in rhythm).
  -   **Mutual Recognition ("known to both"):** Each party *perceives* the other's signal and understands the *shared basis* for action ("it will be for my interest... provided he will act in the same manner...").
  -   **Gradual Reinforcement:** This mutual recognition isn't instantaneous. It's solidified through "repeated experience" of the *inconveniences of transgression* and the *benefits of conformity*. This repeated success builds "confidence of the future regularity of their conduct."

  **2. Does Hume Achieve *Strict* Common Knowledge?**  
  **No, not in the infinite-regress sense formalized by Lewis and used in epistemic game theory (EGT).** Here's why:

  *   **Against Infinite Regress:** Hume explicitly rejects the need for a single foundational act of mutual acknowledgment (like a promise or public announcement) that *logically generates* the infinite hierarchy ("I know that you know that I know..."). His mechanism is fundamentally *causal* and *experiential*, not *logical* or *deductive*.
  *   **Finite Orders from Experience:** "Repeated experience" builds high, *pragmatically sufficient* orders of mutual knowledge:
      *   **Order 0:** I have an interest in cooperation (conditional on you).
      *   **Order 1:** I observe *your behavior* conforming to the rule, signaling *your* conditional interest.
      *   **Order 2:** I infer *you* observe *my behavior* conforming, signaling *my* interest to you.
      *   **Order n:** Repeated positive interactions reinforce my belief that you believe that I believe... (up to some high `n`).
  *   **Confidence ≠ CK:** The resulting "confidence" Hume describes is a *robust expectation* based on habit and observed regularity. It's a *psychological state of assurance* built inductively, not the *logical necessity* implied by CK. It functions *as if* there were CK for practical purposes within the established pattern, but its genesis and justification are different.

  **3. Reconstructing Hume's Convention: Beyond Strict CK**  
  Hume's account aligns remarkably well with concepts in modern game theory that *do not strictly require* infinite CK:

  *   **Evolutionarily Stable Strategy (ESS):** This is the *strongest* fit.
      *   **Gradual Emergence:** The convention arises and stabilizes through a process of variation (transgression), selection (inconveniences/punishment), and replication (imitation of successful conformity).
      *   **Stability via Punishment:** Transgression is met with "inconveniences" (negative payoffs), making conformity the stable strategy against small invasions of non-conformity.
      *   **Epistemic Modesty:** ESS requires only that players *respond adaptively to past/present payoffs and behaviors*, not that they possess CK of rationality or the game structure. Hume's "repeated experience" and "confidence" map perfectly onto this adaptive learning.
  *   **Correlated Equilibrium (CE):** Also a good fit, particularly for coordination (like rowing).
      *   **Correlation Device:** Hume's "repeated experience" and the established *regularity itself* act as the correlation device. Players learn to condition their actions on observing the established pattern ("possession is stable," "rowing requires synchronicity").
      *   **Mutual Expectations:** Players follow the rule because they expect others to follow it, based on the shared history (the correlation device). This aligns with Hume's "confidence of future regularity." CE only requires that players know the *equilibrium strategy profile* and best-respond to it *given their information* (the correlation signal - the established regularity). It doesn't strictly require CK *of rationality* or the *entire structure*; mutual knowledge of the established rule and the expectation others follow it (built via experience) suffices.

  **4. The "Gap" vs. Vocabulary/Framework Difference:**  
  It's **primarily a difference in framework and explanatory goals**, not necessarily a fatal gap in Hume:

  *   **Hume's Goal:** Provide a *naturalistic, causal explanation* for the *origin and stability* of fundamental social conventions (property, promises, justice) without invoking implausible rationalist foundations (promises, CK at inception) or divine command. He focuses on the *process* of emergence.
  *   **Lewis/EGT Goal:** Provide a *formal, rationalist justification* for *why* a particular coordination pattern persists *once established*, defining convention precisely in terms of CK and equilibrium. They focus on the *logic* of stability.
  *   **The "Gap":** Hume doesn't provide the *formal epistemic justification* for *equilibrium play* that EGT demands (i.e., CK of rationality justifying why players *should* play the equilibrium). His mechanism explains *how the equilibrium emerges and becomes salient* through experience, not why perfectly rational agents with CK *would* play it from the start.
  *   **Hume's Strength:** His account explains *how CK-like states can emerge naturally* without presupposing them. The "confidence" *is* the functional equivalent of CK *for the purposes of sustaining the convention within its established context*. It explains the *empirical reality* of conventions better than models requiring unrealistic initial CK.

  **Conclusion:**

  Hume's gradual, experience-based mechanism delivers **high-order mutual knowledge and robust mutual expectations**, functionally equivalent to common knowledge *within the context of the established regularity*. However, it falls short of the *infinite-regress, logically deduced common knowledge* formally required in epistemic justifications of Nash equilibrium. 

  His account is best reconstructed as describing the emergence of an **Evolutionarily Stable Strategy or a Correlated Equilibrium**, where the "repeated experience" and the established regularity itself act as the stabilizing force and the correlation device. These concepts demonstrate that stable conventions *can* arise and persist without presupposing infinite CK. 

  The appeal to common knowledge in Lewis and later EGT is **not merely an add-on, but a shift in focus**: it's a formal tool for justifying equilibrium play *given rational agents and a known game structure*. Hume, however, provides the deeper *genealogy* of how such structures and expectations arise *without* those initial rationalist assumptions. His "gap" is the space filled by evolutionary and learning dynamics in modern game theory, showing that his naturalistic account was remarkably prescient. The difference is less a flaw in Hume and more a reflection of the distinct questions being asked (origin & stability via experience vs. formal justification via rationality & CK).

  For your seminar, emphasize that Hume offers a *precursors* to evolutionary game theory and learning models, providing a powerful explanation for *how* conventions become salient and self-reinforcing, even if he doesn't provide the formal EGT *justification* for why rational agents *must* play them under CK. His mechanism delivers *pragmatic common knowledge* (mutual expectations grounded in reliable experience), not *logical common knowledge*.
