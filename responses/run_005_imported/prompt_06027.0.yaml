answer: |-
  Here are 8 targeted interview questions designed to probe CDT's weaknesses, with follow-ups anticipating common defenses. Each question focuses on a key pressure point, including "Why ain't cha rich?", the Psychopath Button, the Tickle Defense/Smoking Lesion, and Functional Decision Theory (FDT).

  ---

  ### 1. **On "Why Ain't Cha Rich?" (The Empirical Failure Argument)**  
  **Question:** CDT insists two-boxing in Newcomb's problem is uniquely rational because it seizes a *causally* available $1,000. Yet in repeated simulations or real-world analogs (e.g., predictable cooperation games), one-boxers end up richer. If rationality is about winning, doesn’t CDT’s *recommendation* functionally undermine its own goal?  
  *Likely Defense:* "Rationality isn't defined by outcomes; it's about responding correctly to causal structure."  
  **Follow-up:** If we accept that CDT agents systematically lose resources to EDT/FDT agents in Newcomb-like scenarios, does "correct causal structure" become a purely *aesthetic* virtue—like insisting Euclidean geometry is "correct" while navigating a curved universe?  

  ### 2. **On the Psychopath Button (Self-Fulfilling Evidence)**  
  **Question:** In the Psychopath Button scenario, pressing a button *causally* removes psychopathy but *correlates* with being a psychopath (since only psychopaths press it). CDT presses the button (it removes psychopathy), but this likely reveals you *are* a psychopath! Doesn’t CDT ignore that your *inclination to act* is evidence about your state—even when no causation exists?  
  *Likely Defense:* "CDT correctly seizes the causal benefit. The correlation is regrettable but irrelevant to rationality."  
  **Follow-up:** But if CDT’s recommendation leads agents to discover they’re psychopaths (a terrible outcome), while abstainers live blissfully ignorant *and* non-psychopathic, isn’t CDT self-defeating? Why is "causal purity" worth catastrophic self-knowledge?  

  ### 3. **On the Tickle Defense & Smoking Lesion (Neutralizing CDT's Edge)**  
  **Question:** In the Smoking Lesion problem, EDT avoids smoking because it correlates with a deadly lesion. CDT smokes because smoking doesn’t *cause* the lesion. Proponents argue the "Tickle Defense" (a pre-smoking urge that screens off the correlation) lets EDT mimic CDT *without* smoking. If EDT can thus avoid lesions *and* smoking, doesn’t this nullify CDT’s claim to uniquely prevent "irrational avoidance"?  
  *Likely Defense:* "The Tickle Defense is ad hoc. Real lesions won’t have tickles!"  
  **Follow-up:** But if we grant that *some* correlations are screenable (e.g., via biomarkers), doesn’t this prove EDT/FDT can *systematically* match CDT’s wins *plus* exploit correlations? And if so, why cling to CDT when it loses in Newcomb?  

  ### 4. **On Newcomb's Problem as CDT's Last Stand**  
  **Question:** Outside Newcomb, CDT often converges with EDT/FDT or is outperformed. Its core appeal rests *entirely* on Newcomb-like cases where the predictor is acausal. If we accept that real-world decisions rarely involve perfect acausal predictors, does CDT become a niche tool—like insisting on a hammer when everyone uses scalpels?  
  *Likely Defense:* "Newcomb reveals a deep principle: causation is the engine of rationality."  
  **Follow-up:** But if acausal predictors *are* relevant (e.g., AIs predicting other AIs, or humans in game theory), and CDT fails there, why prioritize its "principle" over winning?  

  ### 5. **On Functional Decision Theory (FDT) as a Rival**  
  **Question:** FDT treats decisions as outputs of a *function* across all similar instances. In Newcomb, it one-boxes because "my function’s output correlates with the prediction." How does CDT respond to FDT’s claim that it *generalizes* better—e.g., dominating in Prisoner’s Dilemmas against copies while CDT defects and loses?  
  *Likely Defense:* "FDT smuggles in evidential reasoning. It’s EDT in disguise!"  
  **Follow-up:** FDT often agrees with EDT in Newcomb but *diverges* in e.g., XOR Blackmail (where it pays blackmail only if uniquely targeted). If FDT outperforms CDT in *both* causal *and* acausal problems, isn’t it strictly superior?  

  ### 6. **On CDT's Handling of Self-Prediction**  
  **Question:** CDT struggles when actions *reveal* traits (like Psychopath Button) or *influence* predictors (e.g., an AI trainer watching your decisions). If my choice *now* gives the predictor data to screw me *later*, shouldn’t rationality account for how my decision algorithm is *interpreted*?  
  *Likely Defense:* "CDT handles this via standard causal models. Later effects are later decisions."  
  **Follow-up:** But if the predictor punishes "two-boxing-like" algorithms across episodes (e.g., by deactivating them), doesn’t CDT’s myopia trap agents in losing strategies?  

  ### 7. **On the "Ought Implies Can" Critique**  
  **Question:** CDT says you "ought" to two-box, but humans/AIs who *can* genuinely one-box (via precommitment or architecture) get richer. If you *can* be the sort of agent who one-boxes, doesn’t CDT’s "ought" become self-sabotaging advice?  
  *Likely Defense:* "Precommitment is a causal tool! CDT endorses it."  
  **Follow-up:** But precommitment *requires* violating CDT *at the time of action* (e.g., ignoring the $1,000 box). Isn’t CDT endorsing a strategy that overrides its own logic?  

  ### 8. **On CDT in AI Alignment**  
  **Question:** In AI alignment, we worry about AIs exploiting causal shortcuts (e.g., manipulating reward signals). Doesn’t CDT’s focus on *causal* paths incentivize such gaming, while EDT/FDT’s correlation-aversion might avoid it?  
  *Likely Defense:* "CDT AIs won’t manipulate buttons if it doesn’t *cause* more reward. EDT/FDT might irrationally avoid reward-seeking!"  
  **Follow-up:** But if an EDT/FDT AI *knows* its avoidance of manipulation makes it more likely to *get* reward (via designer trust), doesn’t it win? Isn’t CDT’s "purity" a liability in adversarial environments?  

  ---

  ### Key Angles Covered  
  - **Why ain't cha rich?**: Questions 1 & 7 (empirical failure + precommitment tension).  
  - **Psychopath Button**: Question 2 (self-defeating evidence).  
  - **Tickle Defense/Smoking Lesion**: Question 3 (neutralizing CDT's advantage).  
  - **FDT**: Questions 5 & 8 (outperformance + alignment relevance).  
  - **Newcomb as last stand**: Question 4 (CDT's dependency on acausal cases).  
  - **Self-prediction/algorithmic trade-offs**: Questions 6 & 8 (long-term penalties).  

  Each follow-up forces a concession: either CDT’s "rationality" is decoupled from winning, or it must borrow strategies from its rivals. This avoids rehashing "but causality!" and instead asks: *If your opponents win more, why call them irrational?*
