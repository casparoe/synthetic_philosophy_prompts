prompt: |-
  I started a new job about two months ago at a small AI-safety-adjacent research outfit, and I swear at least once a week someone in our team channel brings up Newcomb's problem to argue about whether a sufficiently advanced AI should "one-box," precommit, or whatever. I nodded along for a while before actually sitting down and reading the decision theory literature properly, and it turns out the popular version of the puzzle (weird boxes, free million dollars, shrug) barely scratches what people are actually fighting about.

  Anyway, I also co-run a tiny podcast on the side (like a few hundred listeners, mostly friends and family lol), and next month's guest is a decision theorist who's spent basically her whole career defending causal decision theory -- the two-boxing view -- against the usual pile-on. I don't want the interview to just be her re-deriving why two-boxing maximizes expected utility given the causal structure for the hundredth time; I want questions that actually push on where the view is weakest. Can you draft me like 8-10 interview questions along those lines? I want atleast one question each on: the "why ain't cha rich" objection (that consistent one-boxers just end up richer, so what's supposedly so rational about two-boxing), on those newer counterexamples -- I think one's called the psychopath button case, or something close to that -- where the mere act you're inclined toward seems to be terrible evidence about yourself even though it doesn't cause the bad trait, and on whether the "tickle defense" that evidential decision theorists use for the smoking lesion problem basically neutralizes CDT's best selling point, so two-boxing ends up resting on the Newcomb intuition alone. If you can also work in something on that "functional decision theory" stuff that keeps getting name-dropped in AI-alignment circles, even better. For each question, tack on a short follow-up keyed to whatever answer she's most likely to give, so we don't just stall out on the standard lines she's probably given in every interview before mine.
