  Let me unpack why Plantinga's reply feels unsatisfying. The Curley example works because it relies on *actual* human psychology and patterns—we observe how people act in similar situations. But Molinist CCFs (counterfactuals of freedom) are different. They're about *non-actual* agents in *non-actual* worlds, known by God *before* creation. There's no concrete agent or history to ground them! 

  Ah, and here's the kicker: mundane counterfactuals are inferred inductively (e.g., "Curley is greedy, so he'd take more money"), while Molinist CCFs are brute facts. God doesn't infer them; He just knows them directly. But what makes them true? If there's no agent yet, no divine will causing them, and no possible world where they're realized... that's metaphysically spooky. 

