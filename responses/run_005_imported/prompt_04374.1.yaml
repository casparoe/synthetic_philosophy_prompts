answer: |-
  ## The Grudge Informer: A Dialogue at Bamberg

  **Setting:** A dimly lit study in post-war Germany, books piled high. **Herr Hartmann** (Hartian Positivist) and **Frau Fullerstein** (Fullerian Natural Lawyer) debate over steaming cups of ersatz coffee.

  **Herr Hartmann:** (Gesturing at a case file) This Bamberg judgment, Frau Fullerstein... it troubles me deeply. That woman denounced her husband under a Nazi statute for insulting Hitler. He died in a camp. A moral horror, unquestionably. But the court's reasoning? Declaring the Nazi statute *invalid* in '44 because it offended the "sound conscience and sense of justice of all decent human beings"? That's judicial sleight of hand!

  **Frau Fullerstein:** Sleight of hand, Herr Hartmann? Or necessary moral clarity? The court recognized that a decree commanding citizens to denounce political dissent – especially within the sacred space of marriage – for execution or imprisonment, wasn't merely *bad* law. It failed the most basic test of *being* law. It was tyranny masquerading as legality. Fuller would say it lacked the "internal morality of law."

  **Herr Hartmann:** I understand Fuller's appeal – the eight desiderata: generality, promulgation, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between declared rule and official action. But Professor Hart's point stands: the court *pretended* the law didn't exist *at the time she acted*. That dodges the core dilemma! Legally, under the *operative* rule of recognition in Nazi Germany in 1944 – however repugnant – that statute *was* valid law. She broke no *positive* law then in force.

  **Frau Fullerstein:** And therein lies the positivist trap! You reduce law to mere pedigree – whatever the sovereign commands, stamped by the system's rule of recognition, is law. But that ignores the *purpose* of law! Law exists to subject human conduct to the governance of *rules*. A "law" that is secret, retroactive, impossible to follow, or commands utter immorality – like requiring a wife to betray her husband to his death for a private remark – is self-defeating. It ceases to *function* as law. It provides no guide; it only terrorizes. The Nazi decree, by demanding such an act, violated the very principles of reciprocity and procedural fairness that make a legal *system* possible. It was a nullity *ab initio*.

  **Herr Hartmann:** So, because it was profoundly immoral, it was never law? That's precisely the subjectivity I fear! Where do you draw the line? Is every unjust statute automatically invalid? What about a harsh tax law? A discriminatory zoning ordinance? Your approach destroys legal certainty – the bedrock citizens need to plan their lives. If judges can void laws based on their view of "decency," haven't we replaced the rule of law with the rule of judges?

  **Frau Fullerstein:** You exaggerate the danger, Herr Hartmann, and misrepresent Fuller. We aren't talking about judges invalidating laws merely because they find them *unjust* in some abstract sense. Fuller's internal morality is *procedural*. It's about the conditions necessary for law to *be* law. The Nazi decree wasn't just "unjust"; it was *impossible* to reconcile with the very concept of governance by rules. It demanded an act so fundamentally destructive of human relationship and conscience that no one could *understand* it as a genuine legal obligation. It was a weapon, not a rule. Judges voiding such monstrosities isn't subjectivity run amok; it's recognizing a *systemic failure*. It draws a bright line at the extreme edge of perversion. Ordinary unjust laws remain valid, however regrettable, because they still *function* within the framework of legality. Citizens can still understand and (grudgingly) comply. This wasn't that.

  **Herr Hartmann:** But the *honest* approach, the one that preserves clarity, would have been to say: "Under the law *as it stood* in 1944, your act was legal. But we, as a new society founded on justice, condemn that act so utterly that we are enacting a *new* statute, retroactive to cover the Nazi era, criminalizing such denunciations that led to arbitrary imprisonment or death. We punish you under *this* new law." It's retroactive, yes, but it's transparent. We admit the moral horror required a break in legality, rather than pretending the old legality wasn't real.

  **Frau Fullerstein:** "So retroactive punishment is fine as long as you're upfront about it?" Is *that* your answer to the abyss? Herr Hartmann, that proposition chills me more than the Bamberg reasoning! You admit the core evil – retroactive punishment, the very definition of violating the rule of law – but justify it with candor? Fuller's whole point is that retroactivity *itself* is a cardinal sin against the internal morality of law. It destroys the citizen's ability to know the rules *before* acting. Punishing someone under a law created *after* their act, even for something monstrous, sacrifices the principle that law must *guide* behavior. It replaces guidance with raw, *ex post facto* power. The Bamberg court avoided *that* greater evil.

  **Herr Hartmann:** And created the evil of legal uncertainty! You claim only "extreme" cases, but who defines "extreme"? "Sound conscience and sense of justice of all decent human beings" – that's hopelessly vague! One judge's "extreme perversion" is another's "regrettable necessity." My approach, however distasteful the retroactivity, at least confines the exception to the *legislature*, the body empowered to make new law, and makes the exception explicit and limited. It doesn't empower *every* judge to potentially invalidate *any* law they deem sufficiently immoral based on an undefined "internal morality."

  **Frau Fullerstein:** But your legislature, enacting retroactive criminal law, commits the very act it condemns – wielding power arbitrarily *ex post facto*! It validates the positivist claim that law is *only* power, just wielded by a different sovereign. The Bamberg court, by declaring the Nazi "law" a nullity, *preserved* the continuity of legality. They affirmed that true law, even amidst tyranny, has inherent moral boundaries. They punished her for violating a *preexisting* principle – the prohibition on unlawful deprivation of liberty – which the Nazi decree could not legitimately override because it wasn't law. It *restored* legal certainty based on enduring principles, rather than plunging into the uncertainty of retroactive legislation. The certainty they preserved is the certainty that *no command, however stamped by power, can utterly destroy the foundations of law itself.*

  **Herr Hartmann:** (Sighs deeply) So we are left with a tragic choice, it seems. On one hand, the horror of retroactive punishment, even if legislated. On the other, the specter of judges wielding a moral veto over positive law, risking instability. Bamberg chose the latter path to avoid the former abyss.

  **Frau Fullerstein:** Precisely. And in the face of a system that so utterly perverted law into its opposite, I believe they chose the path that best honored law's *aspiration*. They refused to let the Nazis define what law is. They drew a line, not just against evil, but *for* the possibility of law itself. The uncertainty you fear is the price of rejecting absolute tyranny. The certainty you seek in pure pedigree is the certainty of the guillotine's blade falling according to the sovereign's latest whim. Bamberg sought a deeper certainty, rooted in law's moral purpose.

  **Herr Hartmann:** (Stares into his coffee) A deeper certainty... or a dangerous precedent? The dilemma remains, Frau Fullerstein. The abyss remains. I fear we will be debating which edge is less perilous for a very long time. Pass the sugar, please. This coffee needs all the help it can get.
