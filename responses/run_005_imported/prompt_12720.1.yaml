prompt: |-
  Ok so this has been rattling around in my head since Christmas dinner and I need an outside opinion. My cousin (he's doing a PhD in something computer-sciencey, formal verification type stuff) got into a whole thing with my very Catholic aunt about religion, and to poke at her a bit he brought up how a couple of logicians actually ran Gödel's ontological proof of God through an automated theorem prover back in like 2013, and the computer confirmed the proof checks out. He was half-joking but also seemed genuinely smug about it, like "even Gödel, one of the smartest guys who ever lived, mathematically proved God exists, and a machine independently double checked his work, so what more do you want." I'd never heard of this before, looked it up afterward, and it does seem to be a real thing that happened and not some internet myth.

  Here's my problem though: I'm not religious myself, but I also don't know enough modal logic to explain why this isn't actually the slam-dunk case my cousin thinks it is. If a computer, something that cant be swayed by wishful thinking the way a person can, checked the argument line by line and it came back valid, doesn't that basically mean the proof is bulletproof at that point? Like once the logic itself has been mechanically verified, what's even left for a skeptic to push back on? I'd like to actually understand what's going on well enough to hold my own next time this comes up at a family thing, instead of just shrugging and saying "yeah but I still don't buy it" without being able to say why.
