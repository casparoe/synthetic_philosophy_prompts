  I should validate her insight that it feels like a distinction without a difference. Many share this view. Yet, Molinism does attempt a middle path: affirming libertarian freedom (choices aren't causally determined) while preserving divine sovereignty via exhaustive foreknowledge. 

  Her unspoken needs likely include peace in her relationship, avoiding theological conflicts during a stressful decision, and feeling confident in her beliefs without being dismissed. She might want reassurance that her skepticism is reasonable and that she doesn't have to adopt Molinism to find common ground.

