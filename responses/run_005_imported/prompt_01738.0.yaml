answer: |-
  ## The Pragmatist's Progress: Defending Rorty's Contingent Solidarity

  Richard Rorty's vision in *Contingency, Irony, and Solidarity* is undeniably alluring, especially for novelists: literature, not philosophy, drives moral progress by expanding our sense of "us" through vivid depictions of suffering. Yet, the critique spearheaded by thinkers like Norman Geras strikes at the heart of its coherence: **If Rorty rejects representationalism (the idea that beliefs "mirror" an independent moral reality) and any notion of universal "common humanity," how can he possibly claim that expanding solidarity represents genuine *progress*, rather than merely a contingent shift in vocabulary or power?** Geras argues Rorty loses the normative ground to condemn cruelty or praise solidarity as anything more than personal preference. This is not a mere debater's trick; it's a profound challenge. However, **Rorty *can* consistently defend the superiority of expanding solidarity within his antirepresentationalist framework, not by appealing to hidden truths, but by embracing a robust, pragmatic standard of "better" grounded in reducing suffering and increasing human flourishing within a shared ethical project.** The cost is high – relinquishing claims to objective, transcultural moral truth – but it doesn't render his hope incoherent or empty.

  **The Bind: Contingency vs. Normativity**

  Rorty's core arguments create the tension:
  1.  **Antirepresentationalism:** Language doesn't "mirror" reality; it's a tool for coping with the world. Beliefs, including moral ones, are justified by their social utility within a community, not by correspondence to an external moral order. There is no "God's-eye view" or inherent human essence grounding morality.
  2.  **Contingency:** Our moral vocabularies, like our languages and cultures, are historical accidents. Concepts like "human dignity" or "rights" are contingent achievements of specific traditions (e.g., Enlightenment liberalism), not discoveries of eternal verities.
  3.  **Solidarity as Creation, Not Discovery:** Expanding "us" isn't finding pre-existing moral kin; it's *creating* wider networks of identification and mutual obligation through sentiment and imagination, often spurred by narratives exposing cruelty.
  4.  **The Novel's Primacy:** Novels achieve this better than philosophy by *showing* the particularity of pain, making it difficult to ignore or rationalize away, thus *persuading* us to care about strangers.

  Geras's critique is devastatingly simple: **If all is contingent redescription, then the shift from "cruel exclusion" to "inclusive solidarity" is merely a change in vocabulary, not progress towards a truer moral state.** Why is Rorty's preferred vocabulary (liberal solidarity) any "better" than the vocabulary of the exclusionary town? If he rejects a common humanity suffering under cruelty, what *objective* basis remains to condemn the town closing ranks? Rorty seems stuck cheering for his team without being able to explain why his team is playing the right game.

  **Defending Pragmatic Normativity: "Better" Without Mirrors**

  Rorty escapes this bind by radicalizing pragmatism. He rejects the critic's demand for an *external*, non-contingent foundation for normativity. Instead, he locates the standard for "better" *within* the historically contingent project of liberal hope itself:

  1.  **The Pragmatic Standard of Suffering:** While Rorty denies a metaphysical "common humanity," he emphatically does not deny the brute reality of *suffering*. Pain and humiliation are fundamental human experiences. The pragmatic question becomes: **Which redescription, which way of organizing society, *works better* at *reducing suffering*?** Expanding solidarity isn't "truer" in a correspondence sense; it's demonstrably *more effective* at minimizing the pain inflicted by exclusion, marginalization, and cruelty. The town closing ranks increases suffering; expanding "us" reduces it. This is a practical, observable criterion rooted in human experience, not metaphysical mirroring. Your novel makes this suffering vivid, making the *practical cost* of exclusion undeniable.
  2.  **"Better" as Functional within the Liberal Project:** Rorty is unapologetically ethnocentric. He argues *from within* the tradition of liberal democracy, inheriting its core hope: to diminish cruelty and expand human freedom and the chance for individual flourishing. **Progress isn't movement towards an abstract Truth, but the successful realization of the goals internal to *this specific historical project*.** Expanding solidarity *is* progress *for liberalism* because it fulfills its defining aspiration. It makes the liberal project *work better* on its own terms. A vocabulary that shrinks "us" and increases cruelty is a *worse* vocabulary *for achieving what liberals want*. The critic demanding an external justification misses the point – justification is always internal to a practice.
  3.  **Persuasion, Not Proof; Sentiment, Not Reason:** Rorty doesn't claim to *prove* solidarity is objectively better through philosophical argument (which he deems futile for this purpose). Instead, he champions *persuasion* through sentiment and imagination – the novelist's domain. Showing the particular cruelty inflicted on the undocumented family makes their suffering *matter* to the neighbors in a way abstract arguments about rights cannot. **The "betterness" of the solidarity-redescription lies in its capacity to *move* people, to align sentiment with the pragmatic goal of reducing suffering.** It works. The closed-ranks redescription fails because it fosters indifference to palpable suffering, making society harsher and less functional even for the "in-group" in the long run (fear, distrust, instability).
  4.  **Solidarity as the Foundation of Moral Discourse:** Ironically, Rorty argues that the *very possibility* of meaningful moral discourse *depends* on a prior sense of solidarity. To see someone as a participant in a moral conversation, we must first see them as "one of us" in some relevant sense. **Expanding solidarity isn't just a consequence of moral progress; it's the *precondition* for recognizing more beings as moral subjects worthy of consideration.** The closed-ranks town isn't just choosing a different, equally valid moral framework; it's actively *shrinking* the sphere where moral discourse is even possible, making genuine moral disagreement with the excluded impossible. This is pragmatically regressive.

  **The Cost: Relinquishing the Comfort of Foundations**

  This defense comes at a significant cost, which Rorty readily acknowledges:

  1.  **No Transcultural Knock-Down Arguments:** Rorty cannot prove to a committed theocrat or fascist that liberal solidarity is "objectively better" in a way that compels their assent *if they reject the entire project of minimizing cruelty and maximizing individual freedom*. He can only say, "Look at the suffering your way causes," and hope the depiction is vivid enough to move them, or argue that his way better serves *their* unspoken desires for security or flourishing (a harder sell). He offers no philosophical shield against those who revel in cruelty or prioritize purity/order over suffering-reduction.
  2.  **Fragility of Hope:** Progress is contingent, reversible, and dependent on continued effort, sentiment, and luck. There's no guarantee history bends towards justice. The hope for expanding solidarity rests on our commitment to the liberal project and our ability to keep making the suffering of others vivid. It's a hope sustained by effort, not guaranteed by ontology. Your novel depicts precisely this fragility – solidarity isn't a law of nature, it's a human achievement constantly under threat.
  3.  **Ethnocentric Justification:** Calling solidarity "progress" is ultimately a statement of allegiance to the values of a particular historical tradition (liberalism). It lacks the universal, transcendent authority critics crave. For Rorty, this is simply honesty – all justification is ethnocentric. We start from where we are.

  **Verdict: Coherence Through Radical Pragmatism**

  **Rorty *can* coherently defend the idea that expanding solidarity represents progress within his antirepresentationalist framework.** He does so by:

  1.  **Anchoring "better" in the pragmatic reduction of suffering and the functional success of the liberal project.**
  2.  **Defining progress as the successful realization of the goals internal to the contingent tradition of liberal hope.**
  3.  **Locating the power to drive this progress in sentiment and imagination (the novelist's tools), not representational proof.**

  He avoids reimporting correspondence by **rejecting the demand for external foundations altogether.** The "betterness" of solidarity isn't a mirror of reality; it's a measure of its practical success in achieving the goals *we* (as inheritors of the liberal project) value: less cruelty, more flourishing, wider webs of mutual recognition.

  **The Cost – relinquishing universal, objective moral truth and acknowledging the fragility and ethnocentric roots of our hope – is the price of his radical contingency.** This doesn't invalidate the hope; it makes it profoundly human, demanding constant vigilance and effort. For your novel, this is potent: the tragedy of the neighbors isn't that they violate an eternal law, but that they fail a practical, human test – they close their eyes to suffering they could alleviate, diminishing their own world. Rorty gives you the tools to make that failure *hurt*, not just philosophically, but viscerally, and that's where the real moral work – the expansion of "us" – begins. Your career rests not on proving abstract truths, but on wielding that visceral power. Rorty, consistently antirepresentationalist, gives you permission and purpose to do exactly that.
