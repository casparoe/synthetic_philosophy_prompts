answer: |-
  ## Kitchen Table Philosophy (After the Wake)

  **LEO (Older Brother):** ...So yeah, sitting there all those years, thinking. Really *thinking*. About blame. About this whole… *industry* of pointing fingers. Especially at me. And it’s just… air, Mike. Hot air. It means nothing. Less than nothing.

  **MIKE (Younger Brother):** Means nothing? Tell that to Mrs. Henderson whose pension Dad stole. Tell that to *me*, Leo, trying to explain to Mum why her eldest wasn’t at Dad’s funeral last year. Blame might be messy, but pretending it’s meaningless? That’s a luxury you bought with prison time. We lived it out here.

  **LEO:** I’m not saying people don’t *feel* it, Mike. God knows I felt enough of it aimed at me. I’m saying the *foundation* is rotten. Completely. Look: Why did I do what I did? Because I’m *me*. Leo, the guy who saw a shortcut, who thought he was smarter than the system, who got desperate. Okay. Fine. But who made me *that* guy? Where did *that* Leo come from? The genes Mum and Dad gave me? The crap neighbourhood? The fact Dad was a gambler and Mum worked three jobs and we were always one step from disaster? The teachers who wrote me off? The mates who thought ripping off credit cards was clever? Did I *choose* any of that? Did I sit down at age ten and design my own personality, my own wiring, my own bloody *hungers*?

  **MIKE:** Nobody designs themselves, Leo. That’s not the point. We *become* who we are, through all that crap, through choices we *do* make along the way, even if the menu was limited.

  **LEO:** Exactly! We *become*. We don’t *create*. We’re shaped. Molded. Pushed. So every single choice I ever made, every stupid, reckless, greedy choice… it flowed *from* the Leo that circumstances built. The Leo *I* didn’t build. I didn’t author the initial conditions. I didn’t write the code. So how can I be *ultimately* responsible? How can anyone? It’s a chain going back forever. You do X because you’re Y. You’re Y because of Z. You didn’t choose Z. So why blame Y for X? It’s like blaming the rain for being wet. It’s just… what it *is*.

  **MIKE:** So what? We just… shrug? Treat everyone like malfunctioning appliances? “Oh, Leo stole the pension fund? Must be faulty wiring. Send him for recalibration.” Is that it? That feels… inhuman. Worse than blame.

  **LEO:** Think about it like this. Picture two guys. Identical twins, raised exactly the same. Identical brains. Everything. One gets born into a world where everyone believes in heaven and hell. He’s terrified of eternal damnation, so he behaves. Mostly. The other twin gets born into a world where everyone knows it’s all just physics and biology, no afterlife, no cosmic scorekeeper. He does whatever the hell he wants. Same starting point, same person, essentially. One behaves “better” because of a random belief system he didn’t choose, absorbed from the culture he didn’t choose. Is the “good” twin *more* deserving of heaven? Is the “bad” twin *more* deserving of hell? Or is it just luck? Dumb, arbitrary luck? That’s us, Mike. We’re just… products. Acting out the script we were handed. Blaming the actor for the lines is pointless.

  **MIKE:** Luck? Sure. Luck plays a part. Huge part. But you’re jumping from “luck is involved” to “nothing matters, no response is justified.” That’s the leap I can’t make. That heaven and hell thing? It *assumes* cosmic justice needs some ultimate self-author to be meaningful. I don’t think our *actual* blame and praise work like that down here. We don’t need God or perfect freedom for resentment to be real, or for forgiveness to matter.

  **LEO:** Then what’s it based on, Professor? If it’s not based on me *actually* being the ultimate source of my choices?

  **MIKE:** It’s based on… *us*. On being in this messy human dance together. When you screw me over, I *resent* it. Not because I’ve calculated you have some magical free will juice, but because you’re my *brother*. Because we have a history, expectations, a relationship. That resentment isn’t some philosophical error; it’s the natural reaction when someone you’re connected to treats you badly. It’s part of holding each other *to account*, as people. Not as atoms bouncing around.

  **LEO:** Holding me to account for what? The inevitable outcome of my unlucky construction? That’s just taking your anger out on a puppet.

  **MIKE:** It’s not about anger for its own sake! It’s about… the stance we take towards each other. Look, there’s this other way you *could* look at people. This “objective” stance. Like a doctor looking at a sick patient, or a mechanic at a broken car. You see the cause, you see the fault, you fix it or manage it. No anger, no resentment, just… treatment. And sometimes, yeah, you *have* to do that. With a kid, or someone truly insane, or… maybe sometimes in prison, just to survive. But stepping *into* that stance? Treating someone *only* as a broken mechanism? That’s a *move*, Leo. A deliberate choice *you* make to step *out* of the normal human engagement. It’s not the default truth you land on just because you realize we’re all products of circumstance. The *default* is seeing each other as agents, worthy of praise, blame, resentment, gratitude… even when we *know*, intellectually, about luck and genes and all of it.

  **LEO:** So… what? I should just *pretend* the resentment is justified? Play along with the game? Even though I know, deep down, it’s all just cause and effect? That feels like lying.

  **MIKE:** It’s not lying! It’s… living in the reality we have. The reality where your actions *hurt* people. Where Mum cried herself to sleep for years. Where I had to pick up the pieces. We don’t *need* you to be some uncaused cause for that pain to be real, or for our reaction to it to be valid. Stepping back and saying, “Ah, but determinism!” – that’s the *unnatural* move. It’s a shield *you’re* using right now. To keep us at arm's length. To avoid facing what your actions *did*, in this world, to these people who care about you, flawed reactions and all.

  **LEO:** And what if the shield is just… true? What if seeing it clearly *is* facing it? Maybe the resentment *is* the delusion. A useful one, maybe, for social order, but a delusion nonetheless. You can’t just *wish* responsibility into existence because it feels bad to let go of anger.

  **MIKE:** It’s not about wishing! It’s about recognizing what anger and blame *are for*. They’re part of the fabric of how we relate. Saying “no one is *ultimately* responsible” doesn’t dissolve that fabric; it just tempts you to step outside it. And maybe sometimes you have to. But don’t pretend stepping outside is the only rational place to be. It’s its own choice. Its own… stance. And frankly, brother, right now, it feels like a cop-out. Like you’re building a philosophy bunker to hide from Mum’s eyes across this table.

  **LEO:** Cop-out? After seven years inside? You think it’s easy to carry this… this weight everyone piles on you, knowing it’s based on a misunderstanding? Knowing I was just… the unlucky confluence of forces? Like a storm that wrecked your house? Do you blame the storm?

  **MIKE:** I don't *invite* the storm for Christmas ten years running hoping it’s changed! I don’t *love* the storm! Leo, storms aren’t part of the moral community. Brothers are. That’s the difference your neat little regress ignores. We hold *people* responsible because they’re *people* to us, not because we’ve solved metaphysics.

  **LEO:** Funny you mention regress and metaphysics... Reminds me of something I read inside. There was this philosopher, Galen Strawson. Made this exact argument. Turns out his *dad*, P.F. Strawson, wrote the book decades earlier basically saying what you just did – that we don't need the metaphysics for the practice. Father and son, going at it. Kid literally spent his career arguing against the kind of responsibility his own dad said we never needed in the first place. Kind of perfect, isn't it? The family business of arguing about blame.

  **MIKE:** (A beat, a tired, almost reluctant half-smile) Yeah. Perfect. Almost poetic. Like some cosmic joke. Doesn’t make either of them right, though. Or wrong. Just… human. Trying to make sense of the mess. Like us right now, sitting at Mum’s table, picking at leftover sausage rolls after burying her. Trying to figure out if we can even *be* brothers again, or if all we have left is… arguments about arguments.

  **LEO:** (Quieter) Maybe figuring out *how* to argue is the start. Even if we never figure out *why* we can.

  **(Silence hangs, heavy with grief and unyielding positions, the philosophical tension unresolved, mirroring the fractured relationship.)**
