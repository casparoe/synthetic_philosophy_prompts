  ### Justifications:
  1. **Score: 1 (Mostly right)**  
  Denise correctly identifies that narratives often rely on *implicit* regularities (e.g., regimes losing coercive capacity tend to collapse). Hempel *would* call this an "explanation sketch." However, she overstates the *necessity* of universal laws for historical explanation. Many philosophers (e.g., Weber) argue historical explanations invoke probabilistic tendencies, not ironclad laws.

  2. **Score: 2 (Clearly right)**  
  Marcus exposes the critical flaw in retrofitting covering laws: it risks being unfalsifiable. If any narrative can be "covered" by ad hoc generalizations (e.g., "miscommunication sometimes triggers revolutions"), the model loses explanatory power. Narrative explanations *do* work by showing how contingent events "hang together" (per Danto/Mink), offering understanding through contextual sequence.

  3. **Score: -1 (Mostly wrong)**  
  Denise rightly notes that narrative connectors imply causation, but wrongly insists singular causation *requires* general laws. Hempel's view that "A caused B" always implies a universal law (e.g., "All A-like events cause B-like events") is widely rejected. Historians can establish *singular causal claims* through evidence (documents, testimonies) without invoking cross-case regularities.

  4. **Score: 1 (Mostly right)**  
  Marcus correctly distinguishes singular causation (testable via case-specific counterfactuals) from Hempelian laws. His Schabowski example shows how narrative explanations can rely on *local* causality without cross-case regularities. He slightly overstates when claiming *no* regularity exists—but his core point stands: Hempel's "law" requirement is unnecessary here.

  ---

  ### Key Considerations Neither Raised:
  1. **Mechanisms over Laws**:  
     Contemporary philosophy (e.g., Machamer, Darden, Craver) emphasizes **causal mechanisms** (e.g., "how miscommunication triggers collective action") as superior to covering laws. Narratives explain by tracing step-by-step mechanisms—*how* Schabowski’s slip interacted with East German dissent structures—without needing universal laws.

  2. **Explanatory Pluralism**:  
     Historians *combine* narrative with analytical layers. Your committee likely wants explicit **causal analysis** embedded in the narrative: *Why* did guards yield? (e.g., eroded loyalty, lack of clear orders). Highlighting these factors—without inventing "laws"—bridges narrative and explanation.

  3. **Contingency & Path Dependence**:  
     The Berlin Wall’s fall exemplifies **contingency**: a minor event (Schabowski’s error) tipping a system into chaos. Narrative excels here by showing how prior conditions (e.g., mass protests) made the system vulnerable. Your committee may want this contingency *thematized*, not just described.

  ---

  ### Practical Defense Strategy:
  - **Reframe your narrative** with explicit "why" signposts:  
    *"Schabowski’s misstatement triggered immediate crowds not merely because it was heard, but because East Germans had spent weeks testing state resolve—revealing a regime already losing coercive legitimacy."*  
  - **Use targeted counterfactuals**:  
    *"Had Schabowski clarified the delay, the regime might have contained protests that night—but mass defiance had eroded guard compliance irreversibly by November 9."*  
  - **Cite historians who blend narrative/analysis**:  
    E.g., Timothy Gaddis (on contingency) or William Sewell (on eventful temporality).  

  Your committee’s critique signals they want the *analytical engine* behind the story made visible. Anchor narrative sequencing to causal mechanisms and historical actors’ motivations—this satisfies "explanation" without forcing artificial covering laws.
