  ## Memorandum: Honorary Degree Nomination - General [Redacted]

  **To:** Members of the Honorary Degrees Committee  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Nomination of General [Redacted] – Addressing the Moral Threshold Raised by Anscombe  

  The nomination of General [Redacted] presents a profound moral challenge demanding rigorous ethical scrutiny. His subsequent decades of demonstrably "extraordinary service to humanity" in disaster relief are undeniable. However, we cannot evaluate this nomination without confronting the specific act of ordering the firebombing of [City Name], an act resulting in the deliberate deaths of an estimated eleven thousand civilians. The faculty opposition, invoking Elizabeth Anscombe's "Mr Truman's Degree," compels us to engage directly with the *nature* of that act, moving beyond utilitarian calculus to the question of *intention* and its inherent moral weight. After careful consideration of Anscombe's argument and the nature of the act itself, I recommend **withdrawing the nomination at this time**.

  **I. The Core of Anscombe's Argument: Intention and the Prohibition Against Killing the Innocent**

  Anscombe's critique rests on a fundamental principle of moral philosophy: the absolute prohibition against *intentionally killing the innocent*. Her argument against honoring Truman was not merely that the atomic bombings caused immense suffering, but that they constituted a *deliberate choice* to use innocent non-combatants as a means to a military end. For Anscombe:

  1.  **The Act Defines the Agent:** The moral character of an agent is irrevocably shaped by their *willingness* to perform certain kinds of acts. Deliberately killing the innocent is such an act.
  2.  **Intention is Paramount:** The moral quality hinges on the intention *in* the act. If the death of innocents is chosen *as a means* (e.g., to demoralize the enemy, break resistance, or send a message), it is murder, regardless of the end sought. Consequences, even overwhelmingly positive ones achieved later, do not retroactively alter the intrinsic moral nature of that original intentional act. One cannot "balance" an intrinsically unjust act with subsequent good deeds.
  3.  **Honor Implies Endorsement:** Bestowing an honor, especially an academic one symbolizing the highest ideals of humanity, constitutes institutional approval. To honor someone who has committed such an act is to imply that the act itself, or the willingness to perform it, is not fundamentally incompatible with "extraordinary service to humanity." Anscombe argued this corrodes the moral integrity of the institution.

  **II. Applying Anscombe's Lens to General [Redacted]'s Decision**

  The firebombing of [City Name] must be examined under this light:

  1.  **The Nature of the Act:** Firebombing a densely populated provincial capital known to be held by rebels, resulting in an estimated 11,000 civilian deaths, constitutes an attack where non-combatants were inevitably the primary victims. While the *ultimate strategic aim* may have been to end a bloody insurgency, the *immediate military objective* – breaking resistance within the city – was pursued *through* the method of area bombardment known to cause catastrophic civilian casualties.
  2.  **The Question of Intention:** Did the General intend *only* the military effect on the rebels, with civilian deaths being a foreseen but unintended side-effect? Or were the deaths and suffering of the civilian population *themselves* part of the mechanism chosen to achieve the military aim – i.e., to terrorize the population into submission, demoralize the rebels by targeting their support base, or simply render the city unusable? The scale of civilian death (11,000), the nature of firebombing (an indiscriminate area weapon), and the targeting of an entire *city* held by rebels (implying civilians were present in large numbers) strongly suggest the latter. Civilian casualties were not merely collateral damage; they were a predictable and integral part of the tactic's destructive logic. **The death of innocents was chosen as a *means*.** Under Anscombe's framework, this constitutes the deliberate killing of the innocent.
  3.  **The Act and the Agent:** This decision represents a moment where the General, as commander, willed an act of mass killing of non-combatants as a tactic. This act, by Anscombe's reasoning, constitutes a grave moral failing that defines a fundamental aspect of his agency in that context. The subsequent humanitarian work, however laudable, does not erase the moral nature of this prior choice. The later work demonstrates a different aspect of his character, but it does not negate the reality or the moral quality of the earlier act.

  **III. The Bylaws and the Moral Threshold**

  Our bylaws require "extraordinary service to humanity." Anscombe forces us to ask: Can "service to humanity" coherently include an act that *fundamentally violates* the most basic principle of humanity – the prohibition against targeting the innocent? The answer must be no. While the subsequent decades of relief work are indeed extraordinary service, they exist alongside, not in place of, the firebombing. Honoring the General *for his service to humanity* unavoidably casts his entire career, including the firebombing decision, in a positive light. It implies the university finds no fundamental contradiction between his "service" and the act of mass killing civilians as a tactic. This risks endorsing, or at least minimizing, the moral gravity of that act.

  **IV. Why Not Defer or Proceed?**

  *   **Utilitarian Calculation is Insufficient:** Simply weighing 11,000 deaths against "lives saved" by ending the insurgency *or* against the subsequent relief work falls precisely into the consequentialist trap Anscombe rejected. It bypasses the core ethical violation – the *intentional killing of innocents* – and treats lives as fungible units. Our decision must reflect the *kind* of act we are willing to associate with our highest honor, not just a net outcome.
  *   **Deferral Avoids the Issue:** Deferring implies the problem is one of timing or gathering more information, not the intrinsic nature of the act. It fails to address the fundamental ethical question Anscombe raises. If the act itself is judged incompatible with the honor (as I argue it is), deferral is merely postponing the necessary conclusion.
  *   **Proceeding Risks Institutional Complicity:** Awarding the degree, however well-intentioned due to the General's later work, risks making the university complicit in diminishing the moral significance of the deliberate mass killing of civilians. It signals that such acts, if followed by sufficient good deeds, can be absolved and even celebrated by an institution dedicated to truth and human dignity.

  **V. Recommendation: Withdraw the Nomination**

  The nomination forces us to confront a moral threshold. Elizabeth Anscombe's argument provides a powerful, non-utilitarian framework centered on the inviolable prohibition against intentionally killing the innocent. Applying this framework to the firebombing of [City Name], the evidence strongly indicates an act where civilian deaths were not merely foreseen but were an integral part of the chosen military tactic – they were *intended as a means*.

  This act constitutes a fundamental violation of the principle underpinning any genuine concept of "service to humanity." While General [Redacted]'s subsequent humanitarian work deserves recognition and respect *in other forums*, bestowing our highest honor, an *honorary doctorate*, unavoidably implies institutional approval of his entire career trajectory, including this morally defining act. To do so would undermine the university's moral authority and implicitly endorse a calculus that allows the deliberate killing of innocents to be outweighed by later good deeds.

  Therefore, I recommend **withdrawing the nomination** for General [Redacted]. This decision is not a denial of his later work, but a necessary affirmation that certain acts, due to their intrinsic nature and the intention behind them, create a moral barrier that subsequent service, however extraordinary, cannot cross in the context of our highest academic honor. It upholds the principle that "extraordinary service to humanity" cannot be built upon, or coexist with institutional honor when it includes, the deliberate mass killing of the innocent.
