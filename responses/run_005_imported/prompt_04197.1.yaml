  The user mentions Ted Chiang and Greg Egan as inspirations, so the story needs a similar vibe—intellectually rigorous yet emotionally resonant. They want the tension to come from the character's internal struggle, not a didactic resolution. The key is to make the abstract theory feel visceral through narrative.

