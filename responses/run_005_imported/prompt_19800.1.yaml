  ### Memorandum  
  **To:** Grade Appeals Panel  
  **From:** [Your Name], Graduate Student Representative  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Discrete Math Grade Appeal (Sequence Problem) and Guidelines for Future Questions  

  ---

  ### **Case Summary**  
  The appeal concerns a final exam question in Discrete Math asking for the sixth term of a sequence introduced in class. The sequence arises from the combinatorial problem: *"How many regions are created by connecting every pair of n points on a circle with straight lines?"* The first five terms were presented as **1, 2, 4, 8, 16** during lectures, framed as a "spot the pattern" exercise. The instructor intended the sequence to follow a known recurrence where the sixth term is **31**. However, approximately 25% of students answered **32**, extrapolating a doubling pattern from the given terms. These students now appeal, arguing that the doubling pattern fits the provided data as well as the intended rule.  

  ### **Key Arguments**  
  1. **Student Perspective (32 is valid)**:  
     - The instructor **never stated a closed-form rule or recurrence** during lectures; only examples were given.  
     - The doubling pattern (each term = 2 × previous) perfectly fits all five terms. Simplicity (Occam’s razor) favors doubling as the most natural extrapolation.  
     - In pattern-spotting contexts, "obvious" continuations (e.g., linear, quadratic, geometric) are routinely accepted unless explicitly contradicted.  
     - Penalizing 32 assumes students *should have known* the combinatorial context overrides the pattern, but this was not communicated.  

  2. **Instructor Perspective (31 is correct)**:  
     - The sequence is tied to a specific combinatorial problem with a well-defined recurrence:  
       \[
       R(n) = R(n-1) + \binom{n-1}{3} + \binom{n-1}{2} + 1 \quad \text{(or equivalent closed form)}.
       \]  
     - The recurrence yields 31 for \(n=6\), while doubling fails for \(n \geq 6\).  
     - Discrete math courses emphasize deriving sequences from first principles, not superficial patterns.  

  ### **Assessment of the Appeal**  
  **The students’ argument has merit.** While the instructor’s rule is mathematically correct, the pedagogical context matters:  
  - The sequence was taught **purely by example** without derivation. Students received no tools to deduce the recurrence.  
  - Exams must assess **taught material**. If the recurrence was not covered, testing it is unfair.  
  - "Spot the pattern" questions prioritize observed regularities, not latent mathematical truths. Doubling is a reasonable inference.  

  **However**, the combinatorial context *was* part of the course. Students should have questioned whether a geometric pattern aligned with the problem’s constraints.  

  ### **Recommendation: Grading**  
  - **Award partial credit (50%) to students who answered 32**.  
    - **Reasoning**:  
      - Doubling is a justifiable pattern based **solely on provided data**.  
      - The instructor’s failure to clarify the recurrence or warn against overfitting the initial terms contributed to the confusion.  
    - **Why not full credit?**  
      The problem’s context (circle divisions) implies a combinatorial rule. Students should recognize that pattern-spotting in math requires validation against the underlying model (e.g., testing \(n=3\) or \(n=4\) terms against known cases).  

  - **Uphold 31 as the "full-credit" answer**, but acknowledge the ambiguity.  

  ### **Guidelines for Future "Pattern" Questions**  
  To prevent recurrence, adopt these principles:  
  1. **Avoid underdetermined sequences**:  
     - Never use sequences where ≥2 simple patterns fit all given terms (e.g., 1, 2, 4, 8, 16).  
     - If unavoidable, explicitly state: *"Multiple patterns may fit; justify your reasoning."*  

  2. **Teach and test recurrence explicitly**:  
     - If a sequence follows a non-obvious rule, **derive the recurrence in class** and emphasize its priority over empirical patterns.  
     - Exam questions should reference the recurrence (e.g., *"Using the recurrence taught in class, compute term n."*).  

  3. **Clarify expectations in questions**:  
     - **Poor**: *"Find the next term in 1, 2, 4, 8, 16."*  
     - **Better**: *"Using the combinatorial rule for circle divisions, compute the sixth term. Show work."*  
     - **Best**: *"A sequence is defined by [recurrence/formula]. Compute term n."*  

  4. **Accept multiple valid patterns with justification**:  
     - If a question permits empirical patterns, state: *"Find a pattern fitting the terms and use it to compute the next term. Explain why your pattern is reasonable."*  
     - Award full credit for **any** mathematically sound pattern (e.g., \(2^{n-1}\) for \(n=1–5\)) with justification.  

  ### **Conclusion**  
  This case highlights a disconnect between pedagogical intent and student inference. While 31 is mathematically correct, the students’ reliance on doubling was rational given the information provided. Award partial credit to acknowledge this, and revise question design to prioritize clarity and explicit recurrence-based reasoning.  

  ---  
  **Action Items for Friday’s Meeting:**  
  1. Vote on partial credit (50%) for students who answered 32.  
  2. Approve draft guidelines for future sequence questions.  
  3. Discuss instructor training on ambiguous pattern-spotting exercises.  

  Let me know if you’d like to refine these recommendations further.
