  I'm a CS PhD student, and this term I'm the grad rep on my department's three person grade-appeals panel. Heres Friday's case: in discrete math the instructor taught a recursively defined sequence purely by example -- 1, 2, 4, 8, 16 for the first five terms (it's the "how many regions do you get connecting n points on a circle with straight lines" count), framed as a "spot the pattern" warm-up -- then the final exam asked for the sixth term. The "obvious" doubling pattern gives 32; the rule the instructor was actually using gives 31. About a quarter of the class wrote 32 and is now appealing, since doubling fit every example we ever actually showed them just as well as the rule the instructor was using. Two of the three panelists think it's an easy call -- the instructor's rule is simply the correct one and doubling was a mistake -- but I'm not convinced that's principled, since the assignment never stated a closed form, only examples, and I don't see why "what the instructor meant" automatically beats "the simplest continuation of the data we actually gave them." Can you draft the memo I'll circulate before Friday? I need an actual recommendation on grading the disputed problem, plus some guidance for how we word "find the pattern" questions from now on -- and please really engage with the case for the doubling answers instead of just asserting the instructor's rule wins.
