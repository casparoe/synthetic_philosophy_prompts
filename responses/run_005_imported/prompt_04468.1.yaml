prompt: |-
  I've been going down a bit of a rabbit hole after a medieval Jewish philosophy class and wanted to get your take on something. We were reading the part of Maimonides' Guide for the Perplexed (book III, ch. 32ish) where he argues that God never actually wanted or needed animal sacrifice in the first place — it was basically a concession to the fact that the Israelites grew up in a world where every form of worship involved sacrificing animals, so the Torah redirected that impulse toward the one God instead of trying to abolish it outright, with the implicit long game being that people would eventually graduate to "higher" forms of worship like prayer. (Nahmanides apparently hated this reading, called it something like "preposterous" in his own commentary, for what it's worth.) What stopped me in my tracks is that in the Mishneh Torah — Maimonides' actual law code — he just straightforwardly codifies all the sacrificial laws in detail and says the messianic king will rebuild the Temple and get sacrifices running again, with no hint that it's a lesser or temporary form of worship.

  So here's what I actually want to know: there are groups today, like the Temple Institute in Jerusalem, that are training kohanim, sewing priestly garments, and breeding red heifers so they're literally ready to resume animal sacrifice the moment they get acess to the Temple Mount. Based on Maimonides' own stated logic for why sacrifice was ever commanded to begin with, would he be rooting for a project like that, or does his own reasoning kind of commit him to thinking it'd be a step backwards? And is there a good way to square that with the Mishneh Torah just assuming sacrifice comes roaring back in the messianic era, or is he genuinely stuck holding two views in tension? Give me your actual reasoning, not just a recap of the two positions.
