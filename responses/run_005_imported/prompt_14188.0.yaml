answer: |-
  That's an excellent set of questions that cuts right to the heart of a *very* common misunderstanding about Bell's theorem and its implications. The pop-science narrative you've encountered is significantly flawed. Let's break it down:

  **1. What Bell's Theorem Actually Proved:**

  *   **Bell did NOT prove hidden variable theories impossible.** What he proved was that **local hidden variable theories are impossible**.
  *   **Crucial Definitions:**
      *   **Hidden Variables:** Any theory where quantum randomness is due to our ignorance of underlying, definite properties ("elements of reality") possessed by particles *before* measurement.
      *   **Locality:** The requirement that no influence can travel faster than light. What happens at location A cannot *instantaneously* affect what happens at a distant location B (spacelike separation). This is also called "Einstein locality" or "no spooky action at a distance."
  *   **Bell's Result:** *Any* theory that aims to reproduce *all* the predictions of quantum mechanics **must** violate *either*:
      1.  **Locality:** Allow faster-than-light influences (non-locality), OR
      2.  **Realism:** Abandon the idea that particles have definite properties independent of measurement (i.e., reject hidden variables).
  *   **Experiments (e.g., Aspect, et al.):** Confirmed that quantum predictions (like violation of Bell inequalities) are correct. Therefore, *nature itself* violates the assumptions of *local realism*. Locality *or* realism (as defined by hidden variables) must be abandoned.

  **2. Where Bohmian Mechanics Fits In:**

  *   **Bohmian Mechanics IS a Hidden Variable Theory:** It explicitly assigns definite positions to particles at all times (the "hidden variables").
  *   **Bohmian Mechanics IS NON-LOCAL:** The wavefunction ("pilot wave") guiding the particles is fundamentally non-local. The velocity of a particle at point A depends *instantaneously* on the wavefunction's configuration *everywhere else* in the universe. This is how it achieves entanglement correlations without violating Bell's theorem – it embraces non-locality.
  *   **Why It's Still a "Live Option":**
      *   **It Matches QM Predictions:** It reproduces *all* the standard predictions of quantum mechanics empirically (in the non-relativistic domain).
      *   **It Solves the Measurement Problem:** Measurement is just a specific interaction within the deterministic evolution guided by the wavefunction. There's no "collapse" or ambiguity about when it happens.
      *   **Determinism:** It provides a completely deterministic description of particle trajectories.
      *   **Clear Ontology:** It offers a clear picture of "what is real" at all times: particles have definite positions, guided by a real wavefunction existing in configuration space.
      *   **Philosophical Appeal:** For those prioritizing determinism and a clear, observer-independent reality (like Maudlin), Bohm provides a coherent framework achieving this *without* resorting to many worlds. Its non-locality is seen as a price worth paying for these benefits.
  *   **Why It's Not the Dominant Interpretation (The "Historical Footnote" Misconception):**
      *   **Non-Locality:** Many physicists find its explicit, instantaneous non-locality philosophically unappealing and incompatible with the spirit of relativity (though it doesn't *technically* allow signalling FTL).
      *   **Complexity:** The dynamics (particles guided by a wave in high-dimensional configuration space) are seen as less elegant than just dealing with the wavefunction alone.
      *   **Lack of Natural Relativistic Extension:** Developing a fully relativistic, Lorentz-covariant version is challenging (though work continues).
      *   **The Wavefunction's Status:** Is the wavefunction in configuration space truly "real"? This is debated.
      *   **Historical Marginalization:** It was overshadowed by the Copenhagen interpretation early on and later by the rise of Many-Worlds. Its association with Bohm's political issues didn't help.
      *   **"Shut Up and Calculate" Pragmatism:** Most physicists don't *need* an interpretation to do their work.

  **Philosophers like Maudlin defend it precisely because it *is* a viable, coherent interpretation that satisfies certain philosophical desires (determinism, realism) *despite* its non-locality. They argue its strengths outweigh its weaknesses, especially compared to the perceived vagueness of Copenhagen or the ontological extravagance of Many-Worlds. Bell's theorem *allows* it because it is explicitly non-local.**

  **3. Many-Worlds (Everettian Interpretation) and Locality:**

  *   **Is Many-Worlds "Local"? Yes and No – It's Complicated.**
      *   **Dynamically Local:** The *fundamental dynamical law* of Many-Worlds is the Schrödinger equation. This equation is *local*: how the wavefunction changes at a point in configuration space depends *only* on the wavefunction and its derivatives *at that point* and *at that time*. There are no instantaneous influences from distant regions written into the fundamental law.
      *   **Non-Separable & Effectively Non-Local:** However, the wavefunction itself is a global object. Entanglement means the state of the entire system cannot be described by specifying the states of its spatially separated parts alone (non-separability). While the *dynamics* are local, the *resulting state* after evolution exhibits correlations (entanglement) that are indistinguishable *in their effects* from the kind of non-local influences seen in Bohm or implied by Copenhagen collapse. You cannot describe the outcome of a measurement on one part without referencing the state of the distant entangled part.
      *   **Why it's Seen as a "Local" Alternative:** Compared to Bohm (which has explicit non-local guidance) or Copenhagen (which has explicit non-local collapse), Many-Worlds avoids *adding* any non-local mechanism *beyond* the local Schrödinger evolution. The non-locality we see is an emergent property of the entangled global wavefunction evolving via local rules, not a fundamental faster-than-light influence added to the theory.
      *   **The Locality Claim is Often Oversimplified:** Saying Many-Worlds is "local" can be misleading. While its fundamental law is local, the *ontology* it describes (a massively entangled universal wavefunction) is inherently non-separable, and the *phenomenological consequences* (correlations between distant measurements) are just as "spooky" and non-local *in effect* as in any other interpretation. The key difference is the *mechanism*: no *additional* non-local law or process is needed beyond local unitary evolution.

  **Summary & Key Clarifications:**

  1.  **Bell's Theorem:** Ruled out **local hidden variables**, not hidden variables *in general*. Bohmian mechanics is a **non-local hidden variable theory**, explicitly allowed by Bell's result.
  2.  **Bohmian Mechanics is Viable:** It's a complete, empirically adequate interpretation. Philosophers defend it because it offers determinism, a clear ontology, and solves the measurement problem, even if physicists often favor other approaches due to its non-locality or complexity.
  3.  **Many-Worlds and Locality:** Its fundamental *dynamics* (Schrödinger equation) are local. However, the resulting entangled *state* is non-separable, and the *observed correlations* are just as non-local *in effect* as in any other interpretation. It avoids *adding* a non-local mechanism like collapse or pilot-wave guidance, making it "more local" in that specific sense than Bohm or collapse-based interpretations, but not "local" in the sense of denying the reality of quantum non-separability.
  4.  **Entanglement is Universal:** You are absolutely correct. The Bell correlation results and the phenomenon of entanglement are **interpretation-independent experimental facts**. *All* interpretations must account for them. The difference lies in *how* they explain them:
      *   **Copenhagen:** Collapse is inherently non-local.
      *   **Bohm:** Explicit non-local guidance via the pilot wave.
      *   **Many-Worlds:** Emerges from local evolution of a global entangled state (non-separability).
      *   **GRW/Spontaneous Collapse:** Adds stochastic, non-local collapse terms.

  The persistence of Bohmian mechanics defended by serious philosophers is strong evidence that Bell did *not* kill hidden variables; it killed *local* hidden variables. Bohm survives precisely by embracing the non-locality that Bell's theorem forces upon any realistic interpretation aiming to reproduce quantum predictions. The claim about Many-Worlds offering locality is nuanced, referring to its local dynamical law, but shouldn't obscure the fundamental non-separability inherent in quantum mechanics that all interpretations grapple with.
