  I've been going down a bit of a pop-science rabbit hole on interpretations of quantum mechanics lately (started with a podcast episode, now I'm like three books deep), and there's a claim that keeps coming up that I want to sanity-check with someone who actually knows the physics and philosophy here, since I don't really have anyone in my life to ask. The claim is basically that Bell's theorem in the 1960s proved once and for all that hidden variable theories are impossible, which is supposedly why the field settled into a Copenhagen vs. Everett/many-worlds split, and why Bohmian mechanics (pilot-wave theory) gets treated as a historical footnote that only a handful of stubborn holdouts still bother with.

