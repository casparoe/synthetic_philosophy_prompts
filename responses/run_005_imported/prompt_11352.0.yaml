answer: |-
  Your friend's habits can be rationally justified within a rigorous decision-theoretic framework, even in light of Good's theorem. The key lies in recognizing that **Good's theorem makes specific assumptions that don't hold in your friend's cases**, primarily because her utility function likely includes *psychological states* or *beliefs themselves* as direct arguments. When utility depends directly on what you know (or don't know), avoiding information can be optimal. Below, I'll explain the loopholes, formalize the reasoning, and address each of your friend's examples.

  ### 1. **The Core Loophole in Good's Theorem**
  Good's theorem states:
  > For a rational Bayesian agent facing a decision, the *expected value* of acquiring cost-free evidence relevant to that decision is non-negative.

  This relies on three critical assumptions:
  - **Utility depends only on actions and states of the world.** Utility cannot depend directly on the agent's *beliefs* or *knowledge state*.
  - **The evidence is genuinely "free."** Acquiring it has no direct cost (e.g., time, effort, or psychological distress).
  - **The evidence informs an upcoming decision.** If no decision follows, the theorem doesn't apply.

  **Your friend's habits exploit two loopholes:**
  - **Psychological costs of information:** Learning certain facts directly reduces utility (e.g., anxiety from bad news), violating the "free evidence" assumption.
  - **No decision to be made:** In some cases, information doesn't (or shouldn't) affect actions, making the evidence irrelevant to a decision.

  When utility includes psychological states (e.g., "peace of mind"), avoiding information can rationally maximize *expected utility*.

  ---

  ### 2. **Decision-Theoretic Model: Belief-Dependent Utility**
  To formalize this, we extend the standard decision model to include beliefs/knowledge as direct sources of utility. Let:
  - \(s \in S\): State of the world (e.g., "football team won," "genetic condition present").
  - \(a \in A\): Action chosen (e.g., "watch recording," "invest in stocks").
  - \(d\): Data/evidence (e.g., spoilers, test results, market data).
  - \(U(a, s, d)\): Utility function. Crucially, \(U\) now depends on \(d\) (the information known).

  **Expected utility of avoiding information:**  
  If your friend avoids evidence \(d\), she bases decisions on her prior beliefs \(P(s)\). Her expected utility for action \(a\) is:
  \[
  EU_{\text{avoid}}(a) = \sum_{s} U(a, s, \text{no } d) \cdot P(s)
  \]

  **Expected utility of acquiring information:**  
  If she acquires \(d\), she updates beliefs to \(P(s|d)\) and chooses the best action \(a^*(d)\). Her expected utility is:
  \[
  EU_{\text{acquire}} = \sum_{d} P(d) \left[ \max_{a} \sum_{s} U(a, s, d) \cdot P(s|d) \right]
  \]

  **Rational avoidance occurs when:**
  \[
  \max_{a} EU_{\text{avoid}}(a) > EU_{\text{acquire}}
  \]
  This happens if:
  - \(U(a, s, \text{no } d) > U(a, s, d)\) for critical \((a,s)\) pairs (psychological costs), or
  - Evidence doesn't improve decisions enough to offset psychological costs.

  Good's theorem assumes \(U(a, s, d) = U(a, s)\) (no dependence on \(d\)), reducing \(EU_{\text{acquire}}\) to the standard formula where it dominates \(EU_{\text{avoid}}\). But if \(U\) depends on \(d\), \(EU_{\text{acquire}}\) can be lower.

  ---

  ### 3. **Analysis of Your Friend's Examples**
  #### a. **Skipping Football Spoilers**
  - **Decision:** Watch the recording or not? (Assume she watches regardless.)
  - **Psychological utility:** Suspense and surprise during viewing are major sources of enjoyment. Knowing the outcome (\(d\)) reduces utility.
  - **Model:**  
    Let \(s = \text{outcome}\), \(a = \text{watch}\).  
    - If she avoids spoilers: \(U(\text{watch}, s, \text{no } d)\) is high (enjoyment of suspense).  
    - If she learns \(d\): \(U(\text{watch}, s, d)\) is lower (spoiled surprise).  
    Since no decision changes (she watches either way), \(EU_{\text{acquire}}\) is just \(\sum_s U(\text{watch}, s, d) \cdot P(s)\)—lower than \(EU_{\text{avoid}}\) due to spoiler-induced utility loss.  
  - **Why Good's theorem fails:** No decision is informed by \(d\), and \(d\) directly reduces utility.

  #### b. **Declining Genetic Testing**
  - **Decision:** None (no treatment exists). Actions (e.g., lifestyle) may be unaffected by the test.
  - **Psychological utility:** Ignorance preserves hope/peace of mind; knowing a positive result causes anxiety.
  - **Model:**  
    Let \(s = \text{has condition}\), \(a = \text{do nothing}\) (only action).  
    - \(U(\text{nothing}, s, \text{no } d)\): Constant if she assumes low risk (e.g., \(U_{\text{peace}}\)).  
    - \(U(\text{nothing}, \text{condition}, d=\text{positive})\): Very low due to distress.  
    \[
    EU_{\text{avoid}} = U_{\text{peace}} \quad > \quad EU_{\text{acquire}} = P(\text{positive}) \cdot U_{\text{distress}} + P(\text{negative}) \cdot U_{\text{relief}}
    \]
    If \(U_{\text{distress}}\) is sufficiently negative, avoidance wins.  
  - **Why Good's theorem fails:** No decision exists for the evidence to inform, and \(d\) directly affects utility.

  #### c. **Avoiding Retirement Account During Market Drops**
  - **Decision:** Change investments? (Assume she follows a passive strategy and won't act).  
  - **Psychological utility:** Seeing losses causes stress; not knowing preserves calm.
  - **Model:**  
    Let \(s = \text{portfolio value}\), \(d = \text{current balance}\).  
    - If she avoids \(d\): \(U(\text{hold}, s, \text{no } d)\) is stable (assumes long-term growth).  
    - If she sees a drop (\(d = \text{low}}\)): \(U(\text{hold}, s, d)\) drops due to anxiety, even if \(s\) is unchanged.  
    Since she won't change actions (e.g., sell), \(EU_{\text{acquire}}\) is penalized by distress when \(d\) is bad.  
  - **Why Good's theorem fails:** Evidence doesn't affect decisions (if she commits to passive strategy), and \(d\) directly reduces utility.

  ---

  ### 4. **When Avoidance Is Rational vs. Irrational**
  - **Rational avoidance:**  
    - Psychological costs outweigh decision benefits (e.g., genetic test with no treatment).  
    - No decision to be made (e.g., football spoilers).  
    - Information might trigger irrational actions (e.g., panic-selling stocks).  
  - **Irrational avoidance:**  
    - Evidence informs a high-stakes decision (e.g., genetic test for a *treatable* condition).  
    - Psychological costs are negligible (e.g., checking retirement account monthly).  
    - Self-deception prevents optimal decisions (e.g., avoiding budget tracking while overspending).

  ---

  ### Conclusion
  Your friend's avoidance of information is **rational** under a utility function that values psychological well-being (e.g., suspense, hope, calm). Good's theorem does not apply to her cases because:  
  1. Utility depends directly on knowledge states (violating \(U(a,s,d) = U(a,s)\)).  
  2. Evidence often doesn't inform meaningful decisions (e.g., genetic testing with no treatment).  
  3. Evidence has psychological costs, making it non-"free."  

  Her habits reflect a coherent preference for minimizing distress—not a rejection of rationality. To change her mind, you'd need to argue that:  
  - Psychological costs are irrational (e.g., "anxiety about markets is overblown").  
  - Hidden decisions exist (e.g., "genetic results could affect life planning").  
  But as described, her choices are defensible within decision theory. Good's theorem remains valid in its narrow scope, but human rationality encompasses more than actions and states—it includes the mind itself.

  *Final note: This aligns with modern extensions of Bayesian decision theory (e.g., "information aversion" in economics) and the concept of "mental accounting."*
