  Okay, I need to tackle this user's query about whether it's rational to avoid information. The user and their friend argued about this during a car ride, and the user is convinced by Good's theorem that avoiding information is irrational. But their friend has habits like skipping football spoilers, declining genetic tests, and avoiding checking her retirement account during market drops. The user wants a rigorous explanation why these habits are mistakes despite Good's theorem.

