answer: |-
  Here’s a draft that honors the weight of the moment, celebrates the new citizens warmly, and acknowledges the philosophical tension *without* undermining the ceremony’s significance. It frames the "boundary problem" as democracy's *strength*, not a flaw:

  **Draft Keynote (Approx. 5 minutes):**

  **(Warm Smile, Pause, Look around at the crowd - families, new citizens in their seats, officials)**

  "Good morning. What an extraordinary day. Look around this room. Feel that energy? That’s the sound of hope meeting history. That’s the culmination of journeys measured in miles, in years, in perseverance, and in dreams. To our newest fellow citizens: **Welcome. We are genuinely, profoundly glad you are here.** Today isn't just paperwork; it's a transformation. You step across a threshold.

  **(Directly to the new citizens)**

  For you, today is deeply personal. It’s the answer to sacrifices made by you and your families. It’s the reward for studying, for waiting, for believing in the promise held within the idea of America. It’s about the chance to build a life, contribute your talents, raise your families, and have your voice heard *as citizens* in the community you call home. That voice matters. That belonging matters. Cherish this moment. Celebrate it fully. You have earned this.

  **(Shift tone slightly - thoughtful, inclusive of the whole room)**

  Now, as someone who spends perhaps too much time thinking about *how* democracies work, I have to confess something: **Democracy has a beautiful, messy question at its very heart.** Who exactly are "We the People"? It’s a question that’s never finally settled, not even here, not even today. Philosophers debate it endlessly – is it everyone affected by decisions? Everyone subject to the laws? How do we draw that circle fairly? The truth is, there’s no single, perfect, unchanging answer pulled from a rulebook somewhere. **The boundaries of ‘us’ are always being defined, debated, and redefined.** It’s inherent to the project.

  **(Pivot to the positive power of this tension)**

  But here’s why that isn’t a weakness – **it’s the engine.** That very tension – the constant questioning of who belongs, who decides, who is heard – *that* is the dynamic energy of a living democracy. It’s what forces us to look outward, to listen, to argue, and ultimately, to *choose* who we want to be together. It demands that we keep reaching for a more perfect union, knowing perfection is always just beyond our grasp, but striving for it anyway.

  **(Connect directly to the ceremony and new citizens as the ANSWER to the tension)**

  **And this ceremony? This is where that abstract tension meets human courage and commitment.** You, our newest citizens, aren’t passive observers of that question. **You are the active answer.** By taking this oath today, you aren't just stepping into a pre-defined, static 'us'. **You are choosing to help *shape* it.** You are declaring, with your presence and your pledge, that you *belong* here, that you *claim* your place in this ongoing experiment, and that you accept the responsibility that comes with it.

  **(Emphasize Participation & Shared Future)**

  You bring your unique stories, your perspectives, your hopes, and your willingness to contribute. You expand the 'we'. You enrich the conversation. You help determine what "We the People" means for the *next* generation. Your journey to citizenship is a powerful act of faith in that messy, demanding, and ultimately hopeful process.

  **(Conclude with warmth and shared responsibility)**

  So today, we celebrate your incredible achievement. We welcome you wholeheartedly into the shared work of citizenship. **Your choice to join this ‘us’ strengthens our collective resolve to keep building a democracy worthy of everyone who calls it home.** It reminds *all* of us – those born here and those who chose to come – that this project belongs to everyone willing to pledge allegiance to its ideals and roll up their sleeves.

  **(Final, strong, warm closing)**

  Congratulations, citizens. We are honored to stand with you. Now, let’s build the future – together."

  ---

  **Why this works:**

  1.  **Warms First:** Starts with genuine celebration, recognition of sacrifice, and direct welcome. Families and new citizens feel seen and valued.
  2.  **Acknowledges the Tension Honestly:** Uses accessible language ("beautiful, messy question," "no single perfect answer," "boundaries... redefined") to nod to the boundary problem *without* diving into jargon (Whelan, all-affected, etc.).
  3.  **Reframes the Problem as Strength:** Explicitly states the tension isn't a flaw but the *source of energy* for democracy ("engine," "dynamic energy"). This is crucial.
  4.  **Makes New Citizens the Heroes/Action:** Positions their oath-taking not as passively entering a fixed group, but as an *active choice* that *answers* the question and *shapes* the "us." ("You are the active answer," "You are choosing to help shape it").
  5.  **Emphasizes Participation & Future:** Focuses on their future role ("contribute," "voice heard," "shared work," "build the future") which is the practical heart of belonging.
  6.  **Includes Everyone:** The "reminds *all* of us" section subtly addresses the court staff/lawyers, acknowledging the shared responsibility and the ongoing nature of the project. It reinforces that citizenship is active for everyone.
  7.  **Ends Warm & Unified:** Returns to celebration and shared purpose ("build the future – together").
  8.  **Respects the Occasion:** Maintains dignity and the gravity of the oath while being intellectually honest.

  This approach allows you to be true to your knowledge without turning the ceremony into a lecture. The professionals will appreciate the subtle, accurate nod to the complexity, while the new citizens and families will feel welcomed, celebrated, and empowered as vital participants in the ongoing story of American democracy. Good luck! It's a wonderful honor.
