  Now, Lewis's BSA relies on natural properties to avoid triviality. These properties are primitive and objective, which Hume would likely see as reintroducing hidden necessities. Hume viewed properties as derived from impressions, so positing elite properties might seem like a metaphysical imposition. The Principal Principle ties laws to objective chances, but Hume would argue that chances are just measures of ignorance, not real features of the world. He'd see this as another layer of hidden necessity.

  Humean supervenience requires that everything supervenes on local matters of particular fact. Quantum entanglement challenges this with non-local connections. Hume might accept supervenience if based purely on perceptions, but entanglement's non-locality would conflict with his separability principle. He'd probably reject the supervenience base as inadequate.

  Regarding induction, the BSA assumes simplicity and strength indicate true patterns. But Hume's skepticism questions why we expect simplicity to continue. Using these criteria to pick the best system presupposes nature's uniformity, which Hume argued is unjustifiable. He'd see this as circular, relying on the very assumption his critique targets.

  The user also mentioned undermining futures and the Principal Principle's patches. Hume would find these ad hoc solutions problematic, as they introduce complexities to save the theory. He preferred a more straightforward, psychological account of laws as habits of mind.

  Where might Hume agree? He valued simplicity in explanations, so the BSA's emphasis on economy aligns with his thinking. But only if it stays within the boundaries of perceptions without adding metaphysical commitments. The core of BSA, however, goes beyond that.

  The user wants specific points where Hume would resist. Natural properties, objective chance, and the reliance on induction for simplicity are key sticking points. Quantum entanglement's challenge to supervenience would be another. Hume might accept the supervenience base if strictly phenomenal, but Lewis's physical spatiotemporal points aren't that. So, overall, Hume would see BSA as a sophisticated but still metaphysically laden system that reintroduces the necessities he rejected.
answer: |-
  Here’s a rigorous reconstruction of Hume’s likely response to Lewis’s full Best System Analysis (BSA), pinpointing his objections while acknowledging nuanced points of agreement. Hume would recognize BSA’s *spirit* as kin to his project but reject its *metaphysical commitments* as a betrayal of his core skeptical and anti-metaphysical principles. Key objections would cluster around natural properties, objective chance, and the presupposition of uniformity—all seen as illicit reintroductions of necessity.

  ### 1. **Natural Properties: Smuggling in "Real Kinds" (Hume’s Core Objection)**  
     - **Hume’s View:** Properties are bundles of resembling perceptions. There are no "elite" natural properties; all resemblances are mind-dependent (Treatise 1.1.7). Classifications are pragmatic, grounded in custom, not ontology.  
     - **Objection to BSA:** Lewis’s appeal to "perfectly natural" properties (e.g., fundamental physical quantities) would strike Hume as resurrecting the very "real essences" he dismantled. For Hume:  
       - **Triviality Avoidance ≠ Ontology:** BSA uses natural properties to block gerrymandered laws (e.g., "grue"), but Hume would argue this replaces *his* psychological/pragmatic solution (custom-guided expectation) with a *metaphysical* one.  
       - **Necessity Through the Back Door:** If laws depend on *which* properties are "natural," this implies nature has an objective structure that *necessitates* certain regularities—contradicting Hume’s claim that regularity is all there is.  
     - **Hume’s Counter:** He’d suggest a psychological basis for privileging certain predicates (e.g., "green" over "grue" due to *our* perceptual habits), rejecting any mind-independent naturalness.

  ### 2. **Objective Chance & the Principal Principle: Hidden Necessity in Probabilistic Form**  
     - **Hume’s View:** "Chance" is just a measure of ignorance; there are no objective probabilities in nature (Enquiry, Sect. VI). All events are equally "loose and separate"; probabilities describe human uncertainty, not worldly tendencies.  
     - **Objection to BSA:**  
       - **Principal Principle as Covert Necessity:** Hume would see Lewis’s Principal Principle (rational credence aligns with objective chance) as smuggling in necessity. If chances are *law-governed* (via BSA), they imply a modal structure: what *must* (or is *disposed* to) happen in type-identical situations.  
       - **Undermining Futures & Metaphysical Glue:** The need to "patch" the Principal Principle against undermining futures (e.g., non-zero chance of law-violations that invalidate current chances) would confirm Hume’s suspicion: BSA’s "laws" are trying (and failing) to do the work of necessary connections.  
     - **Hume’s Counter:** Chance statements are shorthand for observed frequencies plus psychological expectations. No "objective" probability exists beyond this.

  ### 3. **Humean Supervenience & Quantum Entanglement: A Fatal Flaw**  
     - **Hume’s View:** All knowledge derives from separable impressions. While he assumes spatial/temporal contiguity for causation, he never commits to a *metaphysical* thesis about the fundamental structure of reality (Treatise 1.3.2).  
     - **Objection to BSA:**  
       - **Entanglement Violates Separability:** Quantum non-locality (e.g., Bell’s theorem) shows that the world’s state cannot supervene on *local* point-by-point facts. For Hume, this wouldn’t refute his epistemology (based on perceptions), but it *fatally undermines* Lewis’s *metaphysical* supervenience claim.  
       - **Hume’s Response:** He’d likely shrug: "I never said reality *was* separable—only that we cannot observe necessary connections. If science shows non-separability, it confirms my point: we discover regularities, not necessities." Lewis’s *commitment* to local supervenience as a metaphysical foundation would seem dogmatic.

  ### 4. **Simplicity, Strength & Induction: Begging the Uniformity Question**  
     - **Hume’s View:** Simplicity and strength in theories are *practical virtues* for organizing ideas, but they provide no epistemic guarantee. His "problem of induction" (Enquiry, Sect. IV) shows we cannot justify the assumption that nature is uniform or that simplicity will hold.  
     - **Objection to BSA:**  
       - **Circularity:** BSA selects laws based on simplicity/strength *because* these virtues are thought to track truth in a uniform world. But for Hume, this *presupposes* the uniformity of nature—the very thing induction cannot prove.  
       - **No Privileged Epistemic Access:** Hume would ask: How do we know that "simplicity" (as defined by BSA) isn’t a parochial human preference? BSA risks conflating *our* cognitive preferences with the structure of reality.  
     - **Hume’s Counter:** Laws are psychological habits—the "best system" is simply the one most useful for human minds to navigate constant conjunctions. It carries no ontological weight.

  ### Where Hume *Might* Concede (Grudgingly)
  - **Economy of Thought:** Hume would applaud BSA’s emphasis on simplicity and systematicity as pragmatic tools for human understanding (Treatise, Intro). He’d endorse it as a *descriptive* account of how scientists *actually* reason.  
  - **Anti-Modal Realism:** Hume would prefer BSA’s reduction of laws to regularities over rival theories (e.g., Armstrong/Dretske) that posit irreducible necessitation. But he’d insist BSA doesn’t go far enough in purging modality.

  ### Conclusion: Hume’s Verdict
  Hume would see BSA not as a "faithful continuation" but as a **sophisticated relapse into pre-critical metaphysics**. Key elements—natural properties, objective chance, and the presumption that simplicity maps to truth—would be anathema. He’d argue:
  1. **Natural properties** reintroduce "real kinds,"  
  2. **Objective chance** reinvents necessity probabilistically,  
  3. **Simplicity-as-truth-tracker** ignores his inductive skepticism, and  
  4. **Humean supervenience** is an unjustified metaphysical dogma shattered by modern physics.  

  For your seminar: Frame BSA as a *post-Humean* project wrestling with problems Hume exposed but unable to fully escape metaphysical commitments. Highlight how Lewis’s machinery aims to *salvage* lawhood without necessity—but at the cost of posits Hume would deem unacceptably "occult." This tension—between Hume’s radical empiricism and Lewis’s quasi-realist metaphysics—is where the deepest philosophical friction lies.
