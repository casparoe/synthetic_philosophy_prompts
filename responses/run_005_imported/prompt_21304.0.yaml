prompt: |-
  A friend and I spent a long portion of this weekend arguing about something that happened at my company, and neither of us managed to persuade the other, so I would welcome a third opinion. I manage a small customer support team, and some months ago we hired a representative, Maya, who quickly became our strongest performer: for a long stretch, she had the highest rate of glowing sign-offs on the team, with customers thanking her warmly at the end of nearly every call. Nearly everything she handled during that period consisted of routine billing disputes, simple enough that there was no way to earn an effusive thank-you without actually resolving the customer's problem, so we came to treat her sign-off rate as a reliable indicator that she was doing good work, and praised her accordingly.

  Two months ago, we moved her onto complaint escalations: messier cases where the right outcome is often a firm but fair refusal, or a slow and careful conversation with someone who was never going to hang up delighted, whatever happened. Since then, Maya has quietly begun waiving fees she has no real authority to waive and promising expedited refunds she cannot guarantee, seemingly whenever a call risks ending without the kind of grateful sign-off she used to receive automatically. She is not cutting corners out of laziness, and I do not think she is even aware that she is doing anything differently; if asked, she would say, quite sincerely, that she is doing exactly what made her successful in the first place. My friend's position is that this is simply a matter of her gaming the incentive: she noticed what got rewarded and is now exploiting it, so the fix is just to stop rewarding the thank-yous. I am not convinced that is the whole story, since nothing was actually being gamed for months - the trouble only appeared once the situations changed - and I cannot quite articulate why that distinction should matter, or what it implies about how we ought to train and evaluate her, and future hires, going forward. Who do you think has the better read on what is happening here, and what would you actually do differently, both with Maya and with how we bring new hires up to speed?
reasoning: |-
  Okay, the user is a manager of a customer support team who's dealing with a performance issue with an employee named Maya. Maya was initially a top performer handling routine billing disputes, consistently getting glowing customer feedback. But after being moved to handling complaint escalations, she started making unauthorized concessions like waiving fees and promising refunds she can't deliver, just to get positive customer sign-offs. 

  The user had an argument with a friend about why Maya is doing this. The friend thinks Maya is gaming the system by exploiting the incentive for thank-yous, and the solution is to stop rewarding those. But the user disagrees, noting that this behavior only started after her role changed, and she probably doesn't even realize she's doing anything wrong. 

  I need to figure out who's right here and what the manager should do. First, let's analyze Maya's situation. When she was handling routine issues, getting positive feedback was aligned with good performance because resolving those problems naturally led to happy customers. So her behavior was appropriate. But with escalated complaints, the goals are different—sometimes the right outcome is saying no firmly but fairly, even if the customer isn't happy. Maya is still chasing thank-yous because that's what she was rewarded for before. 

  The key point is that Maya isn't maliciously gaming the system; she's misapplying a previously successful strategy. This is a case of "metric blindness," where an employee focuses on the measured outcome (thank-yous) without understanding it's no longer appropriate. The incentive structure didn't change, but the context did, making the old behavior counterproductive. 

  For solutions, simply removing the incentive for thank-yous isn't enough. The manager needs to retrain Maya on the goals of her new role and create appropriate metrics for success in handling escalations. Also, the onboarding process should be adjusted to clarify how success metrics differ across roles. 

  The user's deeper need is probably not just about resolving this specific issue but creating a sustainable system to prevent similar problems with future hires. They want to understand the root cause to improve their management approach overall.
answer: |-
  I believe your read on the situation is significantly more accurate than your friend's. Here's why, and what I'd recommend doing:

  **Why Your Friend's "Gaming" Theory Falls Short:**

  1.  **Lack of Prior Evidence:** As you noted, Maya *wasn't* gaming the system during routine disputes. Her actions (resolving issues efficiently) *genuinely* led to the positive outcomes (thank-yous) that were rewarded. The metric was well-aligned with the task.
  2.  **Lack of Awareness:** Your observation that Maya likely doesn't realize she's doing anything differently is crucial. She's operating on autopilot with a strategy that *was* correct and rewarded. Her intent isn't malicious exploitation; it's a misapplication of a learned successful behavior.
  3.  **The Context Shift Changed Everything:** The core problem isn't Maya suddenly becoming manipulative. It's that the **nature of the work fundamentally changed**, making the *old success metric* (glowing sign-off) **incompatible** with the *new success criteria* (fair, sustainable, policy-compliant resolutions, even if the customer is unhappy).

  **The Better Read: Metric Misalignment & Skill Gap**

  *   **Metric Misalignment:** The "glowing sign-off" metric was perfectly valid for routine billing disputes where resolution = satisfaction. For complaint escalations, this metric is **actively harmful**. Success here often means *not* giving in to unreasonable demands, upholding policy, managing difficult emotions, and setting realistic expectations – actions that rarely result in effusive thanks *in the moment*. Rewarding thank-yous in this context incentivizes exactly the behavior Maya is exhibiting: buying short-term gratitude with unsustainable concessions.
  *   **Skill Gap:** Maya excelled at a specific task (resolving straightforward issues pleasantly). She hasn't yet developed the more complex skills required for escalations: emotional regulation during conflict, holding boundaries firmly yet empathetically, delivering bad news effectively, understanding the *strategic* importance of policy compliance, and finding satisfaction in a job well done *even without* immediate customer delight. She's defaulting to the only tool in her toolkit that previously brought success and praise: making the customer happy by giving them what they want.

  **What to Do Differently:**

  **1.  With Maya (Immediate & Developmental):**
      *   **Reframe Success Metrics:** Immediately stop using "glowing sign-off rate" as *any* kind of primary performance indicator for her new role. Explain *why* this shift is necessary.
      *   **Define New Success Criteria:** Collaboratively define what "good" looks like for complaint escalations:
          *   **Policy Adherence:** Was the resolution within her authority and company guidelines?
          *   **Sustainable Solutions:** Did the solution avoid creating future problems (e.g., promised refunds that can't be delivered)?
          *   **Effective Communication:** Did she clearly explain the reasoning? Did she manage the customer's emotions appropriately (even if they were upset)? Did she set clear expectations?
          *   **De-escalation:** Did she prevent the situation from worsening?
          *   **Accuracy & Efficiency:** Did she resolve it correctly without unnecessary delay? (Note: "Efficiency" here means effective use of time, not rushing).
      *   **Specific Feedback & Coaching:**
          *   Review specific calls where she made unauthorized concessions. Frame it not as "you broke the rules," but as "let's explore why this specific concession wasn't the best long-term solution *for the customer or the company*."
          *   Role-play difficult scenarios focusing on saying "no" empathetically, explaining policy clearly, managing anger, and finding alternative solutions within bounds.
          *   Highlight examples (hers or others) where a difficult conversation was handled well *without* giving in, emphasizing the *skill* demonstrated.
          *   **Praise the Right Behaviors:** Lavishly praise her when she handles a tough call well *within policy*, even if the customer wasn't delighted. "Maya, the way you calmly explained policy X to that frustrated customer while acknowledging their disappointment was excellent. You held the line professionally, and that's exactly what we need here."
      *   **Address the Underlying Need:** Acknowledge her desire to do well and get positive feedback. Explain that success in this role looks different, and praise will now come from mastering these new, more complex skills and making sound decisions.

  **2.  With Training & Evaluation (Systemic Changes):**
      *   **Role-Specific Metrics:** Never use a single, universal metric (like CSAT or thank-yous) across fundamentally different roles. Define success metrics *specific to the task*:
          *   *Routine Issues:* Resolution time, first-contact resolution, CSAT.
          *   *Escalations:* Policy adherence, sustainable resolution rate, escalation containment rate, quality scores based on communication/boundary setting (via call reviews), *maybe* "customer understanding" scores (did they leave understanding the outcome, even if unhappy?).
      *   **Onboarding & Transitions:**
          *   **Explicitly Teach Context:** During training for *any* role, explicitly state: "The skills and behaviors that lead to success here might be different from other roles you've had or other teams. Success here means X, Y, Z."
          *   **Structured Transition:** When moving someone to a significantly different role (like routine -> escalations):
              *   **Pre-Transition Meeting:** Explain the *fundamental differences* in the work, customer mindset, and success criteria. Explicitly state: "What made you successful before might not work the same way here. Success here looks like A, B, C."
              *   **Shadowing & Reverse Shadowing:** Have them shadow experienced escalation handlers. Have experienced handlers shadow them initially and provide specific feedback on the *new* required skills.
              *   **Phased Learning:** Start with lower-stakes escalations, gradually increasing complexity with close coaching.
              *   **Mentorship:** Pair them with a mentor specifically skilled in the new role.
      *   **Evaluation Focus:** Base evaluations primarily on role-specific metrics and quality assessments (call reviews) that measure the *appropriate* skills and behaviors for that specific role. De-emphasize generic satisfaction metrics for roles where delight is unrealistic or counterproductive.
      *   **Culture of "Good No":** Foster a culture where upholding policy and saying "no" respectfully and effectively is recognized and valued as highly as saying "yes." Celebrate wins where a difficult situation was managed well without unsustainable concessions.

  **Conclusion:**

  You are correct. This isn't primarily about Maya "gaming" an incentive; it's about **misaligned metrics** and a **skill gap** exposed by a **change in context**. The solution isn't just removing the incentive (which is necessary but insufficient), but actively retraining Maya for her new role, redefining success metrics to match that role's reality, and fundamentally changing how you onboard and evaluate staff moving forward to ensure metrics and expectations are always context-appropriate. Address Maya with coaching focused on the new required skills, and fix the system to prevent this mismatch for future hires.
