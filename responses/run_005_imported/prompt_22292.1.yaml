  First, I need to recall what money-pump arguments are. They show that with intransitive preferences, someone could exploit the agent by making it trade in a cycle, losing money each time. For example, starting with A, trading to C, then to B, then back to A, paying each time, ending up with the same asset but less money. That's a serious issue for a trading bot.

  But I should consider if this theoretical exploit is practical. In real markets, transaction costs might prevent the cycle, or the agent might not encounter the exact sequence. However, relying on that is risky. An adversary could design trades to exploit this, especially in competitive trading environments. So while it might not happen often, the vulnerability exists, which is problematic.

  Next, the user asks about principled ways to avoid exploitation without expected utility maximization. I remember there are models like regret minimization or heuristic approaches that might be robust. Also, context-dependent preferences where the agent evaluates pairs, not individual options, could prevent cycling. But these have trade-offs. The agent might miss opportunities or require more computational resources.

