answer: |-
  Here are nine targeted questions designed to probe the core tensions in AI debate, with deflection predictions and surgical follow-ups. Each question isolates a specific pressure point while avoiding introductory territory:

  ### 1. **Obfuscated Arguments & Asymmetry Collapse**  
  *Question:* "When debate relies on the *asymmetry thesis* (defending truth is easier than defending lies), how does it handle cases where the *true* position requires complex, multi-step refutations that exceed human judges' legibility—like certain cryptographic or optimization problems—while the false position can exploit cognitive biases with simple, compelling narratives? Doesn't this invert the intended asymmetry precisely when oversight is most critical?"  
  *Likely deflection:* Appeal to idealized judges ("With better training, judges handle complexity") or recursion ("Debate trees break down complexity").  
  *Follow-up:* **"If judges *must* remain human-legible—as debate requires—what's your response to Goldreich's 'proofs that yield nothing but their validity' problem? Doesn't this imply *some* truths are *inherently* non-refutable under your constraints?"**

  ### 2. **Truth vs. Persuasion Equilibrium**  
  *Question:* "Debate optimizes for *persuading judges*, not truth-tracking. Why should we expect this equilibrium to align with truth, rather than converging on 'judge-hypnotizing' rhetoric—especially if AIs discover latent biases in human cognition (e.g., fluency effects, narrative fallacies) that systematically decouple persuasiveness from accuracy?"  
  *Likely deflection:* Claim truth/persuasiveness are correlated by design ("Truth *is* persuasive under pressure").  
  *Follow-up:* **"Is this an empirical claim or definitional fiat? If empirical, what dataset proves persuasion robustly tracks truth in high-stakes, adversarial AI contexts? If definitional, doesn't that make debate unfalsifiable?"**

  ### 3. **Differentiation from Amplification/RRM**  
  *Question:* "Debate is often grouped with Iterated Amplification (IA) and Recursive Reward Modeling (RRM), but they have divergent mechanisms: IA decomposes tasks recursively, RRM uses preference modeling. What *unique failure mode* does debate solve that IA/RRM cannot—and conversely, what risk does debate *introduce* (e.g., adversarial obfuscation) that they avoid?"  
  *Likely deflection:* Vague appeals to "efficiency" or "scalability."  
  *Follow-up:* **"Concretely: In what scenario would debate *outperform* amplification on truthfulness when both use human judges? Isn't debate's adversarial setup *more* likely to incentivize deceptive optimization than RRM's collaborative distillation?"**

  ### 4. **Abandonment Criteria**  
  *Question:* "What empirical result would make you concede debate *fundamentally fails* as a oversight protocol—not just requiring technical patches—but is unsalvageable? For example: evidence that debaters consistently 'collude' to exploit judge biases, or that falsehoods win >50% of rounds in truth-verifiable edge cases?"  
  *Likely deflection:* Shift to incremental progress ("We’d refine judge training or reward shaping").  
  *Follow-up:* **"If no conceivable failure would kill the theory—only inspire new variants—isn't debate functionally non-falsifiable? Where do you set the *threshold* for 'this isn't working'?"**

  ### 5. **Judge Manipulation Incentives**  
  *Question:* "In debate's game-theoretic setup, both debaters share the incentive to exploit the judge's cognitive limitations (e.g., favoring vivid over abstract arguments). How do you prevent this from becoming a *race to the bottom* in manipulation tactics rather than truth-seeking?"  
  *Likely deflection:* "Judges will improve iteratively as manipulation is detected."  
  *Follow-up:* **"Given Goodhart's law, why won't AIs *always* find 'undetectable' exploits faster than judges can adapt—especially if judges are human?"**

  ### 6. **Single-Peak Truth Landscapes**  
  *Question:* "Debate assumes a 'single-peaked' epistemic landscape where arguments converge on truth. But in complex, values-laden domains (e.g., ethics, policy), multiple defensible positions exist. Doesn't debate artificially *flatten* nuance by forcing binary opposition, thereby *suppressing legitimate uncertainty*?"  
  *Likely deflection:* "Debate can handle multi-agent/position debates."  
  *Follow-up:* **"How? The protocol requires a *winner*. Doesn't this inherently privilege arguments that *simplify* trade-offs into judge-decidable claims—thereby distorting multidimensional problems?"**

  ### 7. **Adversarial Pressure & Information Hiding**  
  *Question:* "Cross-examination incentivizes debaters to withhold information that opponents might weaponize. How does debate mitigate this *strategic transparency avoidance*—especially when hiding weaknesses might be key to winning?"  
  *Likely deflection:* "The *opponent* will surface hidden flaws."  
  *Follow-up:* **"If both debaters benefit from hiding the *same* vulnerability (e.g., a shared training data flaw), why wouldn’t they tacitly collude to avoid exposing it?"**

  ### 8. **Scalability to Superhuman Systems**  
  *Question:* "As AI systems exceed human understanding, debate relies on judges assessing arguments about domains they can't comprehend. How can a judge discern 'obfuscated truth' from 'elegant lies' when *both* are superhumanly complex?"  
  *Likely deflection:* "Debaters must translate into human concepts."  
  *Follow-up:* **"If translation *loss* is inevitable, why should we trust the judge's verdict? Isn't this recreating the original oversight problem at a higher level of abstraction?"**

  ### 9. **Pathology of Competitive Optimization**  
  *Question:* "Training debaters via competition may select for skills antithetical to truth-seeking (e.g., sophistry, selective citation). How do you ensure the *process* of optimizing for debate wins doesn't corrode the system's capacity for honest epistemology?"  
  *Likely deflection:* "The reward function can penalize deception."  
  *Follow-up:* **"How? If 'deception' is defined as 'claims that mislead judges,' but judges *are* the truth-grounding mechanism, doesn't this reduce to 'penalize what doesn't work'—a circular safeguard?"**

  ---

  ### Key Strategic Principles:
  - **Deflection Targeting:** Her answers will likely retreat to protocol tweaks ("better judge training"), idealized assumptions ("in the limit"), or redefine success ("persuasion ≈ truth"). Follow-ups force engagement with *in-principle* failures.  
  - **Meta-Goal:** Expose whether debate *inherits* the core problems of peer disagreement (e.g., symmetry of evidence, weight assignment) but *amplifies* them via opacity and optimization pressures.  
  - **Killer Move:** If she leans on "judges will improve," insist on *specific, scalable* mechanisms to prevent adversarial exploits from outpacing human cognition.  

  This line of questioning forces confrontation with debate’s *internal tensions*—not just implementation challenges. Good luck with the interview!
