  First, I need to ensure both characters are well-represented. The Humean (probably inspired by David Lewis) should defend the "best system" view—laws as elegant summaries of patterns. The anti-Humean (maybe channeling Maudlin or Armstrong) must argue for laws as active governing forces. The challenge is making their arguments nuanced, not caricatures.

