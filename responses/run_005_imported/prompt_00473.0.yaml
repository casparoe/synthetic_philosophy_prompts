  3. **Dispositional HOTs**: Silas argues that Aris's ability to report later (when device is off) suggests dispositional HOTs. Lena counters that immediate subjective experience is missing. This debate should be explicit in dialogue.
  4. **Verbal Reports**: Aris can answer questions accurately, but are these generated without higher-order thoughts? The story should question whether his responses are mere first-order outputs.
