  Structure the story to build tension through these tests. Start with Aris's confidence, then show Lena's growing unease during experiments. Include Silas's rigid interpretations. The climax could be Lena testing Aris with a personal artifact (the ammonite fossil), revealing the absence of personal connection, which even Silas can't dismiss.

  Ensure philosophical terms are woven naturally into dialogue and narrative. Avoid jargon but make concepts clear through context. For example, when Silas talks about dispositional HOTs, Lena can challenge him with immediate experience examples.

  End without resolution: Aris is functional but devoid of inner life when monitored. The lingering question is whether dispositional HOTs suffice or if occurrent states are necessary. The reader should ponder what truly constitutes consciousness.

