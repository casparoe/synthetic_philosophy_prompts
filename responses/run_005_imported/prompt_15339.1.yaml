  - MaxEnt IRL: The student says it treats the human as Boltzmann-rational, and the probability is proportional to the exponential of the reward. They also mention that it maximizes entropy subject to matching feature expectations.

  But note: the student says "maximizing the entropy of the recovered reward function" — this is incorrect. Maximum Entropy IRL does not maximize the entropy of the reward function. Instead, it maximizes the entropy of the distribution over trajectories (conditioned on the reward) such that the expected feature counts match the demonstrated ones. The reward function is recovered by maximizing the likelihood of the demonstrations under the Boltzmann model.

  Correcting: MaxEnt IRL finds a reward function such that the distribution over trajectories under the Boltzmann policy has maximum entropy (i.e., is as non-committal as possible) while matching the expected feature counts of the demonstrations.

  The student's description of Boltzmann-rational is correct, but the entropy maximization is misattributed. This is a significant error.

