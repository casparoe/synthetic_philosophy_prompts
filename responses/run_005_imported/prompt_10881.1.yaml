  For the anti-weak-discernibility position (let's call them Sam), I'll focus on the charge of circularity: relations like "is 5m from" only make sense if we already accept two distinct entities. Sam should argue that weak discernibility dresses up numerical diversity in relational clothing without explaining its origin, making non-qualitative haecceities unavoidable.

  The dialogue needs key moves: 
