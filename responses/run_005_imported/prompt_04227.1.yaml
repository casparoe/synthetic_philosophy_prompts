answer: |-
  That's an *excellent* observation and question! Sidgwick's deep dive into psychical research wasn't a quirky hobby; it was a desperate philosophical quest directly linked to the most profound problem he identified in his ethics: **The Dualism of Practical Reason.** Here's the chain of reasoning:

  1.  **The Core Problem: Dualism of Practical Reason (DoPR):**
      *   In *The Methods of Ethics*, Sidgwick rigorously analyzed the main ways humans make ethical decisions (Intuitionism, Egoistic Hedonism, Utilitarian Hedonism).
      *   He concluded that both **Egoism** (act to maximize your *own* happiness) and **Utilitarianism** (act to maximize the *general* happiness) were equally rational and fundamental principles when examined from their own internal perspectives. Neither could be *logically* reduced to the other.
      *   **The Conflict:** In many situations, what maximizes *my* happiness conflicts with what maximizes *everyone's* happiness. Do I sacrifice my life to save others? Do I take a high-paying job I hate or a low-paying job helping others?
      *   **The Dualism:** Sidgwick saw no inherent, rational principle *within human experience* that could definitively resolve this conflict and prove that one principle *must* override the other when they clash. Reason seemed to point in two irreconcilable directions. This was deeply unsettling for him, as it suggested a fundamental incoherence at the heart of practical reason.

  2.  **The Need for a "Synthesis":**
      *   Sidgwick desperately wanted to find a way to *synthesize* or *reconcile* these two rational principles. He believed ethics needed a coherent foundation.
      *   **The Traditional Synthesis: Divine Sanction:** Historically, religion provided this synthesis. God (or cosmic justice) ensured that acting morally (utilitarianly) would ultimately be *rewarded* in an afterlife, aligning it perfectly with rational self-interest (egoism). Virtue = Happiness, eventually. Kant's postulates (God, Immortality, Freedom) served a similar function for his deontology.
      *   **Sidgwick's Skepticism:** Sidgwick, operating in a post-Darwinian, increasingly secular age, found traditional religious arguments for God and an afterlife unconvincing based on reason and empirical evidence alone. He couldn't base his ethical system on faith he didn't rationally possess.

  3.  **Enter Psychical Research: The Quest for Empirical Proof:**
      *   This is where psychical research comes in. Sidgwick saw it not as superstition, but as a rigorous, *empirical scientific investigation* into phenomena that *might* provide evidence for:
          *   **The Survival of Personal Consciousness After Death:** Proof of an afterlife.
          *   **Telepathy/Clairvoyance:** Evidence of non-physical connections between minds, potentially hinting at a deeper, unifying reality beyond the physical.
          *   **A Benevolent Cosmic Order:** Evidence suggesting the universe isn't indifferent, but structured in a way that *could* support moral order and justice.
      *   **The Philosophical Stakes:** If such phenomena could be scientifically proven, it would provide the *empirical foundation* Sidgwick craved for the ethical synthesis:
          *   **Proof of an Afterlife:** Would mean actions have consequences beyond this finite life. A just God (or cosmic principle) could ensure that self-sacrifice for the greater good is *ultimately* rewarded, aligning Egoism and Utilitarianism in the *long run*. My rational self-interest *includes* maximizing universal happiness because I'll be compensated/rewarded/punished accordingly in the hereafter.
          *   **Proof of Telepathy/Interconnectedness:** Could suggest a fundamental unity of consciousness, making the sharp distinction between "self" and "others" less absolute, potentially weakening the egoistic impulse or showing how the happiness of others is intrinsically linked to one's own.
          *   **Evidence of Cosmic Benevolence:** Would support the idea that the universe *is* structured to reward virtue and punish vice, even if not immediately apparent in this life.

  4.  **The Chain of Reasoning Summarized:**
      1.  **Problem:** Ethics is paralyzed by the Dualism of Practical Reason (Rational Egoism vs. Rational Utilitarianism conflict).
      2.  **Desired Solution:** A synthesis proving these principles are ultimately harmonious.
      3.  **Traditional Solution (Rejected):** Religious faith in God/Afterlife providing cosmic justice (lacked rational/empirical proof for Sidgwick).
      4.  **Sidgwick's Alternative Approach:** Use *science* (empirical investigation via psychical research) to find evidence for:
          *   Survival after death (an arena for cosmic justice).
          *   Non-physical mind/interconnectedness (hinting at unity).
          *   A benevolent cosmic order.
      5.  **If Successful:** This evidence would provide the *rational foundation* for believing that acting utilitarianism *is* aligned with rational self-interest over an infinite timescale/in a deeper reality, thus resolving the Dualism.
      6.  **The Stakes:** Without this proof, ethics remains fundamentally divided and potentially incoherent.

  **Why Sidgwick Took it So Seriously:**

  *   **Philosophical Desperation:** He genuinely believed the DoPR was the deepest problem in ethics. Solving it was paramount.
  *   **Scientific Rigor (as he saw it):** He co-founded the SPR specifically to apply rigorous, skeptical scientific methods (investigation, exposure of fraud) to these phenomena. He wasn't credulous; he was desperately seeking *reliable evidence* where traditional philosophy and religion had failed.
  *   **Integrity:** He felt compelled to follow the argument and the evidence wherever it led, even into unpopular territory, to resolve the core tension in his life's work.

  **The Outcome & Irony:**

  *   Sidgwick investigated for decades but ultimately found the evidence from mediums and telepathy experiments unconvincing. He died deeply pessimistic, famously writing to a friend that "the prolonged effort of the last years of my life to get at the truth about these mysterious phenomena" had ended in "complete failure" to find proof of survival. He felt the Dualism remained unresolved.
  *   The irony is profound: The arch-rationalist, seeking empirical proof to ground ethics rationally, spent his later life investigating the seemingly irrational, driven by the very rational despair caused by the problem *in* his rational ethics.

  In essence, Sidgwick wasn't looking for ghosts for fun; he was looking for the **cosmic glue** that could bind rational self-interest and rational morality together into a coherent system, because without it, he feared ethics itself might rest on sand. His psychical research was a tragic, deeply serious, but ultimately failed, philosophical experiment.
