  That's a brilliantly sharp application of a classic debate to a modern headache! Let's break down how Hart and Devlin would likely analyze the "legal but harmful" saga, sticking rigorously to their core arguments:

  **Lord Patrick Devlin (Pro-Morals Legislation):**

  1.  **"Disintegration Thesis Applied to the Digital Commons":** Devlin would argue the *internet itself* is now a primary arena for forming and maintaining shared moral sentiment – the "shared morality as glue" thesis extended to the digital public square. He'd see unregulated "legal but harmful" content (extreme misogyny, racism, pro-suicide/self-harm material, severe bullying) as actively *corroding* that shared morality, especially among the young who are heavily immersed online. The *potential* for disintegration isn't just physical proximity anymore; it's constant digital exposure fragmenting shared values.
  2.  **The "Disgust Test" in the Digital Age:** This is trickier, but Devlin wouldn't abandon it. He'd likely argue:
      *   **Measurable Outrage:** Widespread public campaigns *against* specific types of harmful content (e.g., revenge porn, racist trolling, pro-ana communities) *are* manifestations of collective "intolerance, indignation, and disgust." The sheer volume of complaints to regulators/platforms, media coverage, and political pressure *is* evidence the "bounds of tolerance" are being tested.
      *   **Harm as Proxy for Disgust:** He might reinterpret "disgust" in the context of online harm. The profound societal *concern* (a cousin of disgust) about the impact of certain content on mental health, democratic discourse, or vulnerable groups could function similarly. If "ordinary decent people" feel a deep sense of *wrongness* and *danger* about certain online phenomena, that signals a threat to the social fabric.
      *   **Platforms as Society's Agents:** He'd likely support the *concept* behind the "legal but harmful" duty – that platforms, as de facto governors of massive digital spaces, have a responsibility to uphold the minimum moral standards necessary for societal cohesion, acting as proxies for the law where direct legislation is impractical.
  3.  **On the Dropped Provision:** Devlin would see its removal as a dangerous capitulation to a false notion of liberty. He'd argue critics focused on "being offended" missed the point – it wasn't about offense, but about preventing the *gradual erosion of the moral foundations* necessary for a functioning society in the digital era. He'd likely blame "Hartian liberalism" for prioritizing abstract liberty over concrete social glue.

  **H.L.A. Hart (Anti-Morals Legislation):**

  1.  **"Where's the Disintegration Evidence?":** Hart would pounce on this. Decades of massive moral shifts (sexual norms, gender roles, family structures, religious adherence) *without* societal collapse are his strongest ammunition. He'd argue:
      *   **Resilience Over Fragility:** Societies demonstrably adapt and absorb radical moral changes. The persistence of "legal but harmful" content online, however unpleasant, is just another facet of this. Where is the concrete evidence that tolerating (while perhaps countering via education/social pressure, *not law*) racist forums or pro-self-harm content has caused *societal disintegration*? Correlation isn't causation.
      *   **The Slippery Slope of "Harmful":** He'd savage the vagueness of "harmful." Whose definition? The government's? A majority's? A vocal minority's? He'd see it as a classic example of legislating morality based on subjective distaste disguised as societal harm. The critics calling it "legislating against being offended" would resonate deeply with Hart – he'd see it as precisely that, dressed up in social preservation language.
      *   **The "Chilling Effect" is Real Harm:** Hart would argue the *real* harm comes from the *suppression itself*. Vague "legal but harmful" categories create uncertainty and stifle legitimate, albeit controversial or offensive, debate, art, and minority viewpoints. This *chilling effect* on free expression is a tangible harm to individual liberty and democratic discourse, far more demonstrable than speculative societal disintegration.
  2.  **The State's Proper Role:** Hart maintained the law should only prevent tangible "harm to others" (physical, psychological coercion, fraud) – Mill's Harm Principle. He'd argue:
      *   Much "legal but harmful" content falls outside this. Feeling insulted, disgusted, or having one's values challenged isn't "harm" in the legal sense justifying state coercion (or state-mandated platform suppression).
      *   Platforms *choosing* moderation policies is a matter of *private* governance, not state-imposed morality. State *mandating* suppression based on vague "corrosiveness" crosses the line into enforcing public morality.
  3.  **On the Dropped Provision:** Hart would see its demise as a victory for liberty and evidence-based lawmaking. He'd argue the critics were right – it *was* fundamentally about using state power to suppress expression deemed morally objectionable by some, lacking proof it prevented actual societal collapse. He'd point to its removal as proof that vague moralistic legislation is unstable and rightly contested.

  **Your Core Questions:**

  *   **Does Devlin's Disgust-Test Work Online?** It's **strained but not dead.** He'd rely on measurable public outrage campaigns and profound societal concern as modern proxies. However, the fragmentation of online spaces ("echo chambers") makes identifying a singular "public feeling" incredibly difficult. Does outrage from one segment constitute the "intolerance of the ordinary man"? This is a major weakness Hart would exploit.
  *   **Does Hart's "No Evidence of Disintegration" Hold Up?** **It holds up remarkably well on the macro level.** Societies *have* weathered massive moral shifts without collapsing. Hart's core point – that Devlin assumes fragility without proof – remains strong. **However:** The internet introduces *new dynamics* (unprecedented scale, speed, algorithmic amplification, impact on vulnerable groups like teens) that Hart couldn't foresee. While not "disintegration," we *do* see tangible harms (radicalization, epidemic teen mental health issues linked to social media, erosion of trust). Hart might need to refine his definition of "harm" slightly to account for these *demonstrable, widespread psychological and social impacts* facilitated by the online environment, potentially creating a stronger justification for *some* regulation that goes beyond traditional "harm to others" but is still grounded in evidence, not just disgust. He wouldn't accept "disintegration," but might acknowledge new forms of *collective harm* warranting a response.

  **Conclusion:** Plopped down in 2022:

  *   **Devlin** would champion the *intent* of the "legal but harmful" duty as essential for preserving the moral fabric of society in the digital age, using measurable outrage/concern as his disgust-test proxy. He'd lament its removal as a failure to protect society's glue.
  *   **Hart** would condemn the provision as a classic, dangerous overreach of state power into the realm of enforcing vague public morality, lacking evidence that suppression was necessary to prevent societal collapse, and highlighting the concrete harm of stifling free expression. He'd cheer its demise.

  The debate isn't settled. The internet forces a re-examination: Does its unique nature make Devlin's fears of moral corrosion *more* plausible, even if "disintegration" is too strong? Or does it make Hart's defense of liberty and evidence *more* crucial, given the unprecedented scale of potential suppression? Your piece is grappling with the exact right tension.
