answer: |-
  Here’s a dialogue between **Elena (Everettian)** and **Ben (Bohmian)**, both sharp and well-versed, engaging in a no-strawman showdown. They tackle the "empty waves" critique head-on, quantum non-equilibrium, ontological economy, and the nature of reality:

  ---

  **Elena (Everettian):** Ben, let’s cut to the chase. Bohmian mechanics *pretends* to be a single-world theory, but it’s MWI in denial. Your pilot wave guides *one* particle along *one* branch, but the entire universal wavefunction – all those "empty" branches – still evolves unitarily forever. They’re physically real waves! You’ve just hidden the many worlds in configuration space and called them "inactive." That’s not ontology shaving; it’s ontological hoarding.

  **Ben (Bohmian):** Elena, you’re conflating mathematical structure with physical ontology. The wavefunction ψ is real, yes – it’s a *pilot wave* in 3N-dimensional space. But what’s *actually realized* in 3D space – where we live – is *only* the trajectory of the particles guided by *one* branch. The other branches? They’re part of the wave’s dynamics, but they have *no particles* in them. No particles, no measurement records, no observers – just a complex field component. That’s not a "world"; it’s a *potential* without actualization.

  **Elena:** But the wavefunction is the fundamental entity! Those "empty" branches are still physically present, evolving, and can even interfere if paths reconnect. You’ve got all the same structure as MWI – decohered branches with identical amplitude – but you add *extra* particles that "select" one branch. Why multiply entities? MWI needs only ψ evolving unitarily. Occam says your particles are superfluous.

  **Ben:** Because without the particles, *you* have no actualization! MWI has a profound *incoherence*: all outcomes are "real," but no branch is *singled out* as the one we experience. You have no account for *this* experience. Bohm gives a clear ontology: particles have definite positions at all times. The wavefunction *informs* their motion, but the stuff of reality – tables, pointers, neurons – is made of particles *here*, not superposed waves *everywhere*. Your "many worlds" are *possibilities* in ψ; only one is *populated*.

  **Elena:** But your "population" is arbitrary! The particle positions are guided by ψ, but ψ itself treats all branches equally. The particles just "happen" to be on one branch due to initial conditions. That’s not fundamental physics; it’s hidden variables papering over the measurement problem. And those "empty" waves? They’re not benign! They’re *required* to explain interference in delayed-choice experiments or quantum erasers. If they weren’t physically real, you couldn’t recover QM predictions. So you *need* all that structure – same as me.

  **Ben:** You’re right that ψ’s full structure is needed for empirical adequacy – but its *physical role* is different. In Bohm, ψ is a *pilot*: it *acts* on particles, but the particles are the *substance*. In MWI, ψ *is* the substance, and "worlds" are emergent patterns within it. Crucially, in a *decohered* branch, the empty part of ψ becomes *dynamically inert* relative to the particles. It doesn’t influence their future motion; it’s quantum noise. We don’t call every ripple in the quantum vacuum a "world," do we?

  **Elena:** Fair, but decoherence *also* gives me emergent quasi-classical worlds without extra particles. And your "dynamically inert" waves are still there, inflating the ontology! MWI’s elegance is that ψ alone suffices. You add particles *and* retain the full ψ. That’s less parsimonious.

  **Ben:** Parsimony isn’t just about counting mathematical objects; it’s about *explanatory power*. Bohm explains why we see *one* outcome with zero ambiguity. MWI either denies the uniqueness of experience or appeals to poorly defined "subjective uncertainty." And don’t forget the *preferred basis problem*: decoherence gives you many bases, but which decomposition is "real"? Bohm avoids this: particles pick a basis *automatically* via position.

  **Elena:** Ah, but *that’s* where your empty waves bite back! If ψ has multiple decohered branches, and particles are only in one, what happens if the wavefunction evolves to *re-cohere* branches? Suddenly, your "empty" wave isn’t empty – it can push particles around again! So you *still* depend on decoherence to make branches permanently isolated, just like MWI. Your particles don’t *solve* the problem; they *hide* behind the same decoherence dynamics I use.

  **Ben:** Touché. Decoherence is crucial for both. But even if branches re-cohere (rare for macroscopic systems), the particles *still* follow a single, continuous trajectory. There’s never a "branching" of particles, only of ψ. The *narrative* of definite history is preserved. And here’s a key point you overlook: **quantum non-equilibrium**. In principle, ψ could evolve so that "empty" branches *never* affect the particles. Standard QM assumes Born rule statistics, but Bohm allows non-equilibrium states where ψ and particle positions aren’t coupled that way. We could have worlds where empty branches truly *are* irrelevant.

  **Elena:** (Smirking) Now who’s adding epicycles? Quantum non-equilibrium is speculative, untested, and breaks the statistical connection to standard QM. You’re invoking hidden variables *for the hidden variables*! MWI derives the Born rule from unitary dynamics and decision theory. Bohm *postulates* it via initial particle distributions. Which is more elegant?

  **Ben:** Elegance is subjective. But let’s land this: the core disagreement is **actuality vs potentiality**. In Bohm, the universe has *one* actual state (particle positions) at all times, guided by a wave encoding potentials. In MWI, *all* possibilities encoded in ψ are equally actual. Your "empty waves" critique assumes that a complex-valued field component *must* constitute a "world." But without localized matter (particles), it’s just a field ripple. Bohm draws a clear line: a "world" requires *both* ψ-branch *and* particles in it. You reject that distinction – but that rejection forces you into the incoherence of counting indiscernible worlds.

  **Elena:** And your distinction forces you to keep infinitely many undetectable field configurations that do nothing but satisfy Schrödinger’s equation. We’re both realists about ψ, Ben. But MWI accepts the austere beauty of letting ψ be everything. Bohm clings to a classical intuition – "stuff must be *here*" – by adding particles. That’s the real Occam’s violation: not the waves, but the *particles*.

  **Ben:** Then I’ll retire with my particles and definite outcomes. You enjoy your plenitude of worlds. Just don’t call me a closeted Everettian. We’ve made our ontological commitments clear. *Raises coffee mug.* To the quantum schism!

  **Elena:** *Clinks mug.* May our wavefunctions never decohere this debate.

  ---

  ### Key Points Landed:
  1. **Empty Waves = Many Worlds?**  
     - Everettian: Full ψ exists ⇒ all branches physically real. Bohm’s particles are superfluous.  
     - Bohmian: Branches without particles aren’t "worlds"; they’re unactualized potentials. Particles ground actuality.  

  2. **Occam’s Razor:**  
     - E: Bohm adds particles + retains full ψ → less parsimonious than ψ-alone (MWI).  
     - B: Particles explain definite outcomes → MWI’s "emergent worlds" lack actualization → Bohm is *explanatorily* leaner.  

  3. **Decoherence Dependence:**  
     - Both rely on decoherence for classicality, but Bohm uses it to *isolate* empty waves dynamically.  

  4. **Preferred Basis:**  
     - Bohm’s position basis avoids MWI’s preferred basis problem.  

  5. **Quantum Non-Equilibrium:**  
     - Bohm’s speculative counter: ψ could evolve such that empty branches *never* affect particles.  

  6. **Fundamental Divide:**  
     - **Actuality (Bohm):** Particles + ψ. One world actualized.  
     - **Plenitude (MWI):** ψ alone. All possibilities actualized.  

  Both leave bruised but unbeaten – a testament to quantum interpretation’s depth. Where’s the retiree’s allegiance leaning? 😉
