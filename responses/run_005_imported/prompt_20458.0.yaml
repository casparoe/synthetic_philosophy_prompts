  I’ll start by mapping the core conflict: 
  - **Nyaya (pro-upamana)**: Recognition of the gavaya *feels* immediate—not a conscious inference. Like seeing fire and knowing it’s hot without verbalizing steps. 
  - **Mimamsa (anti-upamana)**: All cognition is either direct perception (you see brown, horns, etc.) or inference based on testimony ("cow-like" = bovine features). Comparison is just shorthand for these. 

  For the story to work, the characters must *need* to resolve this. Maybe a dispute where someone’s testimony hinges on whether upamana is valid? Like a witness who ID’d a rare animal via comparison… and now a village’s fate depends on it. 

