  Climax: Mitra doesn’t "win" by logic alone. He reveals the villagers already saw the gavaya—and their instant recognition mirrors the witness’s experience. Their raw, wordless certainty proves upamana’s validity better than any syllogism. Jagati concedes because she can’t deny lived truth. 

