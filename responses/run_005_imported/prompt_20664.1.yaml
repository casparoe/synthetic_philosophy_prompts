  The user's deeper need is understanding why the formalism doesn't allow such "cheat codes." They want the mechanical reason, not just a dismissal. So I should emphasize the implementation on a UTM. The intelligent designer program must include the exact state of the universe, which isn't compressed by the short description. Whereas physical laws leverage regularity. 

