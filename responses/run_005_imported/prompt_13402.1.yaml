answer: |-
  You've pinpointed the exact tension that makes the dollar auction so fascinating and pedagogically powerful. The behavioral intuition clashes provocatively with a naive backward induction, and resolving this requires carefully unpacking the game-theoretic assumptions. Let's break down the rigorous treatment and its implications for your core question about rationality vs. structure.

  **Core Assumptions & The Game Tree:**

  1.  **Players:** Two rational players (A & B).
  2.  **Prize:** $1.00.
  3.  **Bidding:** Sequential bids in fixed increments (e.g., $0.05, $0.10). The smallest meaningful increment is crucial; call it `c`.
  4.  **Rules:**
      *   Highest bidder wins the dollar.
      *   Second-highest bidder pays their last bid and gets nothing.
      *   Bidding continues until one player concedes (stops bidding) after the other bids.
  5.  **Information:** Players observe all previous bids.
  6.  **Payoffs:** For the winner: `$1.00 - (Final Winning Bid)`. For the loser: `-(Final Losing Bid)`.

  **The Backward Induction Conundrum & Its Resolution:**

  Your intuition is correct: pure backward induction *in a finite game with a known, commonly known maximum bid* unravels the escalation.

  *   **Finite Horizon (Known Max Bid M):**
      *   Suppose it's common knowledge that no bid can exceed `M` (e.g., $5.00). Start at the end.
      *   Suppose Player A just bid `M - c`. Player B can:
          *   **Bid M:** Pay `M`, win $1, net payoff = `$1 - M` (likely negative if M > $1).
          *   **Concede:** Pay `M - c` (their last bid), net payoff = `-(M - c)`.
      *   If `-(M - c) > $1 - M` (which simplifies to `c > $1`), conceding is better. But since `c` is small (e.g., $0.05), `$1 - M` is *less negative* than `-(M - c)`. Bidding `M` is *less bad* than conceding. Player B bids `M`.
      *   Now go back one step: Player A, seeing they will be forced to bid `M` if they bid `M - c` (and then lose `M`), realizes bidding `M - c` leads to a loss of `M`. But if they concede *now* (before bidding `M - c`), they only pay their *previous* bid, say `M - 2c`. This is better than losing `M`. So Player A concedes earlier.
      *   This logic unravels *all the way back to the start*. Player B, facing the first bid, realizes if they bid `c`, Player A (foreseeing the spiral to `M` and massive losses) will concede immediately, making Player B pay `c` for the dollar (net `$1 - c`). But Player A, anticipating this, might bid `c` first to get the dollar for `$1 - c`. However, Player B could then outbid to `2c`... but both foresee the spiral and the risk of huge losses. Crucially, *neither wants to be the one who makes the* first *bid that commits them to being the second-highest bidder later*. The only pure-strategy Nash equilibrium (NE) in this finite game is often **no initial bid at all**, or immediate concession after the first small bid, depending on who moves first. Escalation doesn't occur.

  **So Why Escalation? The Crucial Relaxations:**

  The behavioral reality emerges when we relax the unrealistic assumptions of a commonly known finite horizon (`M`) and perfect symmetry:

  1.  **Infinite/Unknown Horizon & Private Valuations/Resolve (War of Attrition Connection):** This is the key. Realistically:
      *   Players don't know each other's maximum willingness to pay ("depth of pockets" or "resolve"). Player A might value "winning" at $1.50 due to ego, reputation, or strategic reasons beyond the dollar. Player B values it at $1.20. These valuations (`v_A`, `v_B`) are private information.
      *   There is no commonly known hard ceiling `M`. Players only know their *own* limit.
      *   **This transforms the dollar auction into a dynamic game of incomplete information, specifically a *War of Attrition* (WOA).** In a WOA:
          *   Two players compete for a prize by persisting over time.
          *   Persisting is costly per unit time (analogous to paying the bid increment `c`).
          *   The player who persists the longest wins the prize.
          *   The loser pays their cost of persistence up to the point they quit.
          *   Players have private valuations/resolve (`v_i`) for the prize.

  2.  **Equilibrium in the War of Attrition (Dollar Auction):** Under incomplete information, rational players *do* escalate, often beyond the prize's nominal value.
      *   **Mixed-Strategy Equilibrium:** Players randomize their "drop out" point based on their private valuation.
          *   A player with valuation `v` will be willing to persist (bid) up to some cost `s(v)`.
          *   Crucially, the equilibrium strategy involves players with higher `v` persisting longer (bidding higher) *on average*.
          *   **Escalation Mechanism:** When a player observes the opponent hasn't quit yet, it signals the opponent *might* have a higher valuation. Quitting now means incurring the sunk cost. Continuing offers a chance to win (recouping sunk costs + getting the prize) *if* the opponent quits soon. The cost of the next increment `c` is small relative to the potential loss of sunk costs and the prize. **The local rationality ("just one more bid") dominates.**
      *   **Expected Losses:** In equilibrium, both players expect *negative* payoffs on average! The winner often pays more than $1 (`$1 - Winning Bid < 0`), and the loser always pays a positive amount (`-Loser Bid < 0`). The auctioneer extracts significant revenue (`Winning Bid + Loser Bid > $1`).
      *   **Reproducing Spirals:** This equilibrium perfectly reproduces the destructive escalation:
          *   Players start bidding rationally (`c < $1`).
          *   Once bids surpass `$1 - c`, winning yields a negative payoff (`$1 - Winning Bid < 0`). *But*, the player in second place faces an immediate loss equal to their last bid if they quit. The cost of bidding one more increment (`c`) is often smaller than this immediate loss. They bid to become the high bidder, hoping the opponent quits.
          *   The opponent faces the same logic. Escalation continues.
          *   Players quit only when the expected cost of continuing (probability opponent quits soon * value of winning minus cost) becomes worse than the certain loss of quitting (sunk cost).
          *   **The Sunk Cost is a Real Cost:** Unlike the behavioral "sunk cost fallacy" where past costs *irrationally* influence decisions, here the sunk cost *is* a real, unavoidable future loss if the player quits *now*. Bidding more is a rational (though painful) attempt to avoid crystallizing that loss.

  3.  **Role of Bid Increment (`c`):** The size of `c` is critical:
      *   **Small `c`:** Makes escalation *longer* and *more severe*. Each step seems "cheaper" relative to the immediate loss of sunk costs, making players willing to go much higher. It increases the auctioneer's revenue and the total losses.
      *   **Large `c`:** Can prevent escalation before it passes `$1`. If `c` is large (e.g., $0.50), the jump from a $0.60 bid (loss if quit = $0.60) to $1.10 (net win = -$0.10 if win) might not look appealing compared to just taking the $0.60 loss. Backward induction might hold better.

  **Connection to War of Attrition (WOA):**

  *   **Core Model:** The dollar auction is a discrete-time, two-player WOA with publicly observable costly actions (bids) and a clear definition of the current "leader" (high bidder) and "laggard" (second-highest bidder).
  *   **Escalation Logic:** Both games share the fundamental driver: the cost of persisting/bidding is paid incrementally, while the loser pays their entire cost incurred. This creates the "sunk cost trap" that makes rational escalation inevitable under incomplete information.
  *   **Evolutionary Biology/Economics:** WOA models are foundational in these fields:
      *   **Biology:** Modeling animal conflicts (e.g., stags locking antlers) where persistence signals strength/fighting ability (private valuation). The cost is time/energy/injury risk.
      *   **Economics:** Patent races, R&D competition, market entry deterrence, strikes, and *exactly* the corporate bidding wars you're studying. Firms have private estimates of a target's value or the cost of delay. Paying consultants/fees/bids are the incremental costs. The loser wastes all their investment.

  **Answering Your Core Question: Bias vs. Structure?**

  The game-theoretic treatment provides a clear answer: **Escalation of commitment in the dollar auction (and analogous real-world situations like bidding wars) is primarily a structural feature of competitive situations with specific characteristics, which fully rational agents with incomplete information *can and do* fall into.**

  1.  **Structural Drivers:**
      *   **Incomplete Information:** Unknown opponent resolve/valuations.
      *   **Sunk Costs as Real Costs:** The loser pays their bid; this is a future loss avoided only by winning.
      *   **Small Incremental Costs:** The next step always seems cheaper than the immediate sunk cost loss.
      *   **Endogenous Commitment:** Each bid publicly signals commitment (or bluff), influencing the opponent's beliefs.
      *   **"Winner's Curse" Risk:** Winning often means you overpaid (paid more than your private valuation, or more than the prize is worth).

  2.  **Role of Cognitive Biases:** While the *structure* makes escalation rational under incomplete information, cognitive biases **amplify** the effect in reality:
      *   **Overconfidence:** Players overestimate their own valuation/resolve or underestimate the opponent's.
      *   **Sunk Cost Fallacy (Proper):** Focusing *too much* on recouping past losses relative to future costs/benefits, even beyond the rational point dictated by their `v_i`. The game theory says *some* focus on sunk costs is rational; the fallacy is taking it too far.
      *   **Loss Aversion:** The pain of crystallizing the sunk cost (a certain loss) feels worse than the prospect of an even larger loss with a chance of winning (Kahneman & Tversky). This makes quitting *psychologically* harder than the pure monetary calculation.
      *   **Escalation Bias/Competitive Arousal:** The desire to win, avoid humiliation, or punish the opponent can inflate `v_i` beyond objective value during the heat of the auction.

  **Conclusion:**

  Martin Shubik's dollar auction is brilliant because it isolates a devastatingly simple structural trap. Game theory, specifically modeling it as a War of Attrition with incomplete information, shows that destructive escalation is **not** inherently irrational. Rational players, lacking perfect knowledge of each other's limits and facing the unavoidable reality that the loser pays their sunk costs, *will* engage in bids exceeding the prize's value. The small bid increment fuels this fire.

  However, in the messy reality of human decision-making, cognitive biases like overconfidence, intense loss aversion, and competitive arousal pour gasoline on this structural fire, making escalation more likely, faster, and more severe than even the rational model predicts. For your piece on corporate bidding wars, the key insight is that these spirals arise from a toxic combination of the *inherent logic of the competitive structure* (captured by the WOA) and the *psychological vulnerabilities* of the players involved. The dollar auction isn't just a demonstration of irrationality; it's a demonstration of how a specific competitive structure can make rational behavior lead to mutually destructive outcomes, which human psychology then exacerbates.
