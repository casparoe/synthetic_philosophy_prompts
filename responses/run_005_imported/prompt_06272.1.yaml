  Now, evaluate each account:

  (a) Equal-standing: This emphasizes equality in moral community. Hypocrisy violates reciprocity. Philosophically, this is strong because moral authority often depends on not exempting oneself. In Renata's case, by hiding her own padding, she acts as if she's above the rules, so she can't genuinely hold others accountable as equals. This seems defensible.

  (b) Unfair-advantage: Focuses on free-riding—benefiting from norms without complying. When blaming, she's reinforcing norms she exploited. This is also strong; it highlights unfairness. In expense padding, if everyone pads, it might inflate costs, but by not padding while others do, one loses out, so hypocrite gains by cheating and then enforcing. Applied to blaming, it makes sense.

  (c) Audience-relativity: Distinguishes between public and private blame. Public condemnation relies on the speaker's authority, which hypocrisy undermines. Private judgment might still be valid. In Renata's case, since she's publicly calling out, her standing could be compromised for public blame, but not necessarily for private views. This is nuanced and might be defensible, especially in social contexts.

  (d) Epistemic-unreliability: Hypocrisy suggests bias, so her blame might be less credible, but it doesn't make it invalid. For example, she might still be right about the padding, but her own history makes her judgment suspect. This is pragmatic but less about moral standing and more about evidence. Philosophically, it might not directly address standing but rather the weight of the accusation.

