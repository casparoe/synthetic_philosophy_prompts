  2. **Contradictory miracles**: Here's where it gets spicy. If Fatima "proves" Catholicism, what about identical mass visions in other religions? Hume would pile up Buddhist/Hindu/etc. miracles to show mutual cancellation. The user hinted at this—they want this angle explored.  

  3. **Psychological/cultural filters**: Even secular witnesses operate within frameworks. 1917 Portugal was soaked in Marian expectation. Those reporters arrived primed for *something* extraordinary. Hume would dissect how expectation shapes perception.  

