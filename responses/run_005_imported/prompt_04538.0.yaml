  Okay, the user is working on a poker bot and has implemented a solver that removes dominated strategies. They've handled pure vs. pure dominance but their friend mentioned they need to consider mixed strategies for IESDS. The user is skeptical because blending strategies that each lose in some scenarios shouldn't create a strategy that dominates everywhere. Let me unpack this.

