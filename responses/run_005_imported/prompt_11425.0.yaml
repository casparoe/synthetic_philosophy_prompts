prompt: |-
  I have been reporting on anthropic reasoning for a piece on cosmological selection effects, and every account I encounter illustrates the divergence between the self-sampling assumption (SSA) and the self-indication assumption (SIA) using Nick Bostrom's "presumptuous philosopher." Before turning to the cosmology, I want a simpler, mundane analogy to walk readers through the underlying logic. Please devise a new scenario -- not a repackaging of that thought experiment, the Doomsday argument, or the Sleeping Beauty problem -- in which two rival hypotheses imply different numbers of observers within a specified reference class. Walk through the credences SSA and SIA would each assign, pinpoint exactly where and why they part ways, and note whether that divergence survives if the reference class is drawn more narrowly or more broadly. Finally, state which verdict strikes you as more defensible in your own example, and name the strongest unresolved objection that its defenders face.
reasoning: |-
  We are to create a new scenario that illustrates the difference between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) without repackaging existing thought experiments. The scenario should involve two rival hypotheses that imply different numbers of observers in a reference class. We will then compute the credences (degrees of belief) assigned by SSA and SIA, pinpoint where they diverge, and discuss the effect of changing the reference class. Finally, we will state which verdict seems more defensible and note the strongest unresolved objection.

  Scenario: The Forgotten Experiment

  Setup:
  Imagine that in the 1950s, a secret government project conducted a series of experiments. The project had two phases, but due to a fire, the records were partially destroyed. Only the following is known:

  - In Phase 1, the experiment was run in a small facility with only one room. Exactly one participant was involved. We'll call this hypothesis H1.
  - In Phase 2, the experiment was expanded to a large facility with 100 identical rooms. Each room had one participant, so there were 100 participants. This is hypothesis H2.

  The records do not specify which phase was actually conducted (or if both were, but we are concerned with a particular experiment run that we know occurred). You, the reader, are an observer who has just been informed that you are one of the participants in this experiment. However, you have amnesia about the details and are in a featureless room. You don't know if you are in the small facility (H1) or the large facility (H2). You are also told that the project leaders flipped a fair coin to decide which phase to run: heads for Phase 1 (H1) and tails for Phase 2 (H2). Therefore, initially, you assign equal prior probability to H1 and H2: P(H1) = P(H2) = 0.5.

  The reference class: We'll start with the reference class of "participants in the experiment". Under H1, there is 1 participant. Under H2, there are 100 participants.

  Now, we apply SSA and SIA.

  Self-Sampling Assumption (SSA):
  SSA says: One should reason as if one were a random sample from the set of all observers in one's reference class.

  Given that you are a participant, we condition on being a participant. The probability of being you (or any particular participant) given H1 is 1 (since there's only one). Given H2, it is 1/100. Therefore, by Bayes' theorem:

  P(H1 | you are a participant) = P(you are a participant | H1) * P(H1) / P(you are a participant)
  P(H2 | you are a participant) = P(you are a participant | H2) * P(H2) / P(you are a participant)

  But note: P(you are a participant | H1) = 1 (because if H1 is true, there is one participant and you are that one). Similarly, P(you are a participant | H2) = 1 (because if H2 is true, there are 100 participants and you are one of them). So that doesn't help.

  Wait, let's think again. SSA says we should consider ourselves as a random sample from all participants. So the probability of being in a particular room (or being a particular participant) is:

  Under H1: there is only one participant, so if H1 is true, you must be that one. So the probability of your current indexical information (that you are a participant) is 1 under H1.

  Under H2: there are 100 participants. The probability that you are a particular one (say, the one in room 1) is 1/100. But note: we are not conditioning on being a particular participant. We are conditioning on the fact that you are one of the participants. That is always true in both hypotheses. So we need to compute the probability of the observation "I am a participant" under each hypothesis.

  But note: in both cases, you are a participant. So P(I am a participant | H1) = 1 and P(I am a participant | H2) = 1. Therefore, the observation does not update the prior. Then we would have:

  P(H1 | I am a participant) = P(H1) = 0.5
  P(H2 | I am a participant) = P(H2) = 0.5

  But that doesn't seem to capture the idea of SSA. The key is that SSA conditions on being a random observer from the reference class. The reference class is "all participants in the experiment". Under H2, there are 100 participants, so the chance that you are the one who exists (if H1 is true) is 1, but under H2, there are 100 participants. However, the indexical information "I am a participant" is not what we are updating on. We are updating on the fact that we are a participant and we want to know which hypothesis is true.

  The standard way to apply SSA in such cases is to note that if H2 is true, there are 100 times as many participants. Therefore, if H2 is true, you are 100 times less likely to be any particular participant. But note: we are not a particular participant in the sense of having an identity. We are just a participant. So the probability of observing that you are a participant (without specifying which) is:

  Under H1: 1 (only one participant, and you are that one)
  Under H2: 1 (there are 100 participants, and you are one of them)

  So again, no update.

  This is a common point of confusion. The key in the SSA is to consider the chance of having your specific indexical information (or lack thereof) given the hypothesis. But in this case, we don't have any specific indexical information beyond being in the experiment. Therefore, we need to consider the chance of being in the experiment at all.

  Alternatively, we can think of the observation as: "I exist as a participant in the experiment". Then:

  Under H1: there is 1 participant. The probability that you are that participant? But note: if H1 is true, then there is only one participant and you are that one. So P(you exist as a participant | H1) = 1.

  Under H2: there are 100 participants. The probability that you are one of them? This depends on how we model the generation of observers. Typically, in such problems, we assume that the observer-moments are created by the experiment. In H1, one observer is created; in H2, 100 are created. If we assume that we could have been any of the observers that ever exist, then the chance that you are in this experiment is:

  P(you are in the experiment | H1) = (number of participants in H1) / (total number of observers in the universe) 
  P(you are in the experiment | H2) = (number of participants in H2) / (total number of observers in the universe)

  But we don't know the total number of observers in the universe. This is where the reference class becomes tricky.

  To avoid that, we can restrict the reference class to only the participants in the experiment. Then, under SSA, we reason as if we are a random sample from the participants in the experiment. Then, the probability that we are in a particular room (if we had that information) would differ. But we don't have room information. So the only thing we can condition on is that we are a participant. And that is always true.

  Therefore, let us try a different approach: the typical way the presumptuous philosopher is set up is by having two theories that predict different numbers of observers, and then we update based on our existence. But in our scenario, we are told that we are a participant. So we are conditioning on that.

  We can reframe the problem by asking: what is the probability that the coin came up heads (H1) given that you are a participant? 

  Using SSA:

  The probability of being a specific participant in H1 is 1 (if H1 is true, you are the one participant). In H2, the probability of being a specific participant is 1/100. But note: we are not a specific participant. We are just a participant. So we must use the fact that under H2 there are 100 participants, so the chance that you are a participant (without specifying which) is 100 times the chance of being a specific one? That doesn't make sense.

  Alternatively, we can use the fact that under H2 there are 100 participants, so there are 100 opportunities for you to be a participant, while under H1 there is only one. But then we have to consider the prior over the creation of observers.

  This leads us to the Self-Indication Assumption.

  Self-Indication Assumption (SIA):
  SIA says: Given the fact that you exist, you should reason as if your existence is more likely in worlds with more observers. Specifically, SIA weights each hypothesis by the number of observers it contains.

  In other words, the probability of observing that you exist is proportional to the number of observers in that hypothesis.

  So, P(I exist | H) is proportional to the number of observers in H.

  In our case, the prior is P(H1)=P(H2)=0.5. Then, the likelihood of your existence under H1 is proportional to 1, and under H2 to 100. Therefore, the posterior probabilities become:

  P(H1 | I exist) = (1 * 0.5) / (1*0.5 + 100*0.5) = 0.5 / 50.5 ≈ 0.0099
  P(H2 | I exist) = (100 * 0.5) / (1*0.5 + 100*0.5) = 50 / 50.5 ≈ 0.9901

  So SIA strongly favors H2.

  But what about SSA? In the standard application of SSA to such problems, we condition on being in the reference class. The reference class is the set of all participants. Under SSA, the probability of being a participant (given that you exist) is:

  Under H1: 1 (because there is one participant and you are that one)
  Under H2: 1 (because there are 100 participants and you are one of them)

  So the observation doesn't update the prior. Thus, SSA leaves the prior unchanged: P(H1)=P(H2)=0.5.

  But note: this is a point of debate. Some might argue that SSA should condition on the fact that we are a random participant. Then, if H2 is true, there are more participants, but we are equally likely to be any of them. However, we have no distinguishing information. So the probability of the observation (which is simply that we are a participant) is the same under both hypotheses. Hence, no update.

  Therefore, the divergence is clear: SSA does not update the prior (remains 50-50), while SIA updates to strongly favor the hypothesis with more observers (H2).

  Now, let's see what happens when we change the reference class.

  Case 1: Narrower reference class.
  Suppose we define the reference class as "participants in the experiment who are in a room with a green wall". But in our scenario, we don't know the wall color. However, we can imagine that we are told that the room you are in has a green wall. And we know that in both phases, all rooms have green walls. Then, the reference class becomes the same as before because every participant is in a room with a green wall. So the result doesn't change.

  But let's change it: suppose in H1 (the small facility) the room has a red wall, and in H2 (the large facility) all rooms have green walls. Now, you look and see that your room has a green wall. How would SSA and SIA update?

  First, note that if H1 is true, then there are no green-walled rooms. So if you see a green wall, H1 is falsified. Therefore, both SSA and SIA would assign P(H1|green wall)=0 and P(H2|green wall)=1. So they agree.

  But what if we have a reference class that is broader?

  Case 2: Broader reference class.
  Suppose we define the reference class as "all human beings alive at the time of the experiment". Let N be the total number of humans at that time (say, 3 billion). Then:

  Under H1: the experiment has 1 participant. So the probability that you are one of the participants, given that you are a human alive at that time, is 1 / 3e9.
  Under H2: the experiment has 100 participants. So the probability is 100 / 3e9.

  Then, using SSA, we condition on being a random human from that time. The probability of being a participant in the experiment is:

  P(participant | H1) = 1 / 3e9
  P(participant | H2) = 100 / 3e9

  Then, by Bayes:

  P(H1 | participant) = [P(participant|H1) * P(H1)] / [P(participant|H1)*P(H1) + P(participant|H2)*P(H2)]
  = [ (1/3e9) * 0.5 ] / [ (1/3e9)*0.5 + (100/3e9)*0.5 ]
  = [1] / [1 + 100] = 1/101

  Similarly, P(H2|participant) = 100/101.

  So in this case, SSA also updates in favor of H2, but only by a factor of 100. This is because we are conditioning on being a human alive at that time, and the experiment is a small part of humanity. The update is proportional to the number of participants in the experiment relative to the reference class.

  But note: in the original SSA with the reference class of participants, we did not update. Now with a broader reference class, we do update. This shows that the choice of reference class is crucial for SSA.

  SIA, on the other hand, in the broader reference class would still weight by the total number of observers in the entire reference class? Actually, SIA is typically applied by weighting the hypothesis by the total number of observers in the entire universe (or the reference class). But in our case, the total number of humans (3e9) is the same in both H1 and H2? The hypotheses only change the number of participants in the experiment, not the total human population. So under both H1 and H2, there are 3e9 humans. Therefore, SIA would not update based on the experiment because the total number of humans is the same. But wait, we are conditioning on being a participant. How does SIA handle that?

  In SIA, we are weighting by the total number of observers. Since the total number of humans is the same in both worlds, SIA would not shift the prior. But then we have the observation that we are a participant. How do we update? 

  We must compute the probability of being a participant given the hypothesis and the SIA. The SIA prior is:

  P_SIA(H) ∝ P_prior(H) * N_H

  where N_H is the total number of observers in H. But in both H1 and H2, N_H = 3e9 (the total humans) plus possibly others? We are only considering humans as the reference class. So if the reference class is all humans, then N_H is the same in both. So the SIA prior is the same as the prior: 0.5 for each.

  Then, we condition on being a participant. The probability of being a participant given H1 is 1 / 3e9, and given H2 is 100 / 3e9. Therefore, the update is:

  P(H1 | participant) = [ (1/3e9) * 0.5 ] / [ (1/3e9)*0.5 + (100/3e9)*0.5 ] = 1/101

  P(H2 | participant) = 100/101

  So in the broader reference class, both SSA and SIA give the same result: they update in favor of H2 by a factor of 100. This is because the total number of observers (humans) is the same in both worlds, so the SIA prior doesn't shift the prior, and the update is the same as the SSA update in the broader reference class.

  Therefore, the divergence between SSA and SIA is most pronounced when the reference class is restricted to the participants of the experiment. In that case, SSA does not update the prior (remains 50-50) while SIA updates to strongly favor the hypothesis with more participants (H2).

  Which verdict is more defensible?

  In this specific scenario, the SIA verdict (strongly favoring H2) may seem more intuitive to many. After all, if the experiment was run in the large facility, there are 100 times as many participants. Therefore, if we are a participant, it is 100 times more likely that we are in the large facility. This is the typical reasoning of SIA.

  However, the SSA proponent would argue that we must condition on being a participant, and that in both cases we are a participant. Therefore, we have no reason to update. They would say that the fact that there are more participants in H2 doesn't make H2 more likely because we would not have been able to observe not being a participant (if we weren't a participant, we wouldn't be here to observe). This is the "observation selection effect".

  The strongest unresolved objection against SIA is that it seems to lead to what Bostrom calls the "presumptuous philosopher" problem: if we have two theories that predict different numbers of observers, SIA would always favor the theory with more observers, even if there is no evidence for it. For example, if one theory says the universe is very big and contains many observers, and another says it is small, SIA would favor the big universe theory regardless of the empirical evidence. This seems to allow us to confirm theories without empirical data.

  In our scenario, the objection to SIA might be: why should we favor H2 just because it has more participants? The coin flip was fair. Without any evidence about the size of the facility, why should we update? The SSA proponent would say we have no new evidence because we already knew we were a participant.

  On the other hand, the objection to SSA in this scenario is that it leads to a counterintuitive result: even though H2 would produce 100 participants and H1 only one, we don't update at all. That means if the coin had come up heads (H1), we would have been the only participant, and if tails (H2), we would have been one of 100. But we have no way of knowing which, and the fact that we are a participant doesn't tell us anything? That seems to ignore the fact that it's easier to "find ourselves" in a world with more participants.

  Conclusion:

  In the Forgotten Experiment scenario, SSA and SIA diverge when the reference class is the participants of the experiment. SSA remains at 50-50, while SIA shifts to about 1% for H1 and 99% for H2. This divergence disappears when the reference class is broadened to all humans (then both update to 1/101 and 100/101). 

  Personally, I find the SIA verdict more defensible in this scenario because it accounts for the increased chance of being in the larger experiment. However, the unresolved objection to SIA (the presumptuousness) remains a significant challenge.

  Note: The above reasoning follows standard presentations of SSA and SIA. However, there are nuances and alternative approaches in the literature.
answer: |-
  Below is a novel scenario designed to illustrate the divergence between the Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA) without repurposing existing thought experiments. I'll walk through the setup, rival hypotheses, reference class, credences under each assumption, and the implications of reference class changes. Finally, I'll offer a verdict and note key objections.

  ---

  ### **Scenario: The Isolated Labs Experiment**
  **Setup:**  
  A research foundation runs an experiment across two isolated, identical labs. Due to budget constraints, a coin flip determines which lab configuration is used:  
  - **Heads (H1)**: Only Lab A is operational, with 1 researcher.  
  - **Tails (H2)**: Both Lab A and Lab B are operational, with 1 researcher each (2 total).  

  You wake up as a researcher in one of the labs. You know:  
  - The coin was fair: \( P(\text{H1}) = P(\text{H2}) = 0.5 \).  
  - Labs are indistinguishable; you have no information about which lab you’re in.  
  - **Reference class**: "Researchers in this experiment" (initially).  

  **Rival Hypotheses:**  
  - **H1**: 1 observer (you, in Lab A).  
  - **H2**: 2 observers (one in Lab A, one in Lab B).  

  ---

  ### **Credence Calculations**
  #### **1. Self-Sampling Assumption (SSA)**  
  SSA states: *Given a reference class, reason as if you are randomly selected from that class.*  
  - **Prior**: \( P(\text{H1}) = P(\text{H2}) = 0.5 \).  
  - **Observation**: "I am a researcher."  
  - **Likelihoods**:  
    - Under H1: 1 researcher exists → probability you are that researcher = \( \frac{1}{1} = 1 \).  
    - Under H2: 2 researchers exist → probability you are a specific researcher (e.g., "you") = \( \frac{1}{2} \).  
  - **Posterior** (via Bayes' theorem):  
    \[
    P(\text{H1} | \text{I exist}) = \frac{P(\text{I exist} | \text{H1}) P(\text{H1})}{P(\text{I exist})} = \frac{1 \times 0.5}{1 \times 0.5 + (1/2) \times 0.5} = \frac{0.5}{0.75} \approx 0.67.
    \]  
    \[
    P(\text{H2} | \text{I exist}) \approx 1 - 0.67 = 0.33.
    \]  
  **SSA verdict**: H1 (1 researcher) is twice as likely as H2 (67% vs. 33%).  

  #### **2. Self-Indication Assumption (SIA)**  
  SIA states: *Your existence as an observer is evidence for hypotheses that imply more observers.*  
  - **Prior adjustment**: Weight hypotheses by observer count:  
    \[
    P_{\text{SIA}}(\text{H1}) \propto P(\text{H1}) \times N_{\text{H1}} = 0.5 \times 1 = 0.5,  
    \]  
    \[
    P_{\text{SIA}}(\text{H2}) \propto P(\text{H2}) \times N_{\text{H2}} = 0.5 \times 2 = 1.0.  
    \]  
    Normalize: \( P_{\text{SIA}}(\text{H1}) = \frac{0.5}{1.5} \approx 0.33 \), \( P_{\text{SIA}}(\text{H2}) \approx 0.67 \).  
  - **Observation**: "I exist" is already factored into the prior. No further update is needed.  
  **SIA verdict**: H2 (2 researchers) is twice as likely as H1 (67% vs. 33%).  

  ---

  ### **Where and Why SSA and SIA Diverge**  
  - **Divergence point**: SSA and SIA disagree on how to interpret the observation "I exist."  
    - SSA treats "I exist" as a selection effect: *Given* observers exist, you are random among them. This favors smaller observer pools (H1).  
    - SIA treats "I exist" as evidence: More observers increase the chance of your existence. This favors larger pools (H2).  
  - **Why**: SSA conditions on the reference class without favoring hypotheses a priori, while SIA uses observer count to weight hypotheses before observation.  

  ---

  ### **Effect of Changing the Reference Class**  
  #### **Case 1: Narrower Reference Class**  
  - **New class**: "Researchers in Lab A."  
  - Under H1, you are certainly in Lab A (probability = 1).  
  - Under H2, probability you are in Lab A = \( \frac{1}{2} \) (since labs are identical).  
  - **SSA**:  
    \[
    P(\text{H1} | \text{I am in Lab A}) = \frac{1 \times 0.5}{1 \times 0.5 + (1/2) \times 0.5} \approx 0.67 \quad (\text{same as before}).
    \]  
  - **SIA**: Unchanged (weights H2 twice as much → \( P(\text{H1}) \approx 0.33 \)).  
  - **Result**: Divergence persists. Narrowing the class doesn’t resolve disagreement.  

  #### **Case 2: Broader Reference Class**  
  - **New class**: "All scientists on Earth" (assume 1,000,000 total).  
  - Researchers in the experiment are a tiny subset.  
  - **Likelihoods**:  
    - \( P(\text{I am in experiment} | \text{H1}) = \frac{1}{1,000,000} \),  
    - \( P(\text{I am in experiment} | \text{H2}) = \frac{2}{1,000,000} \).  
  - **SSA**:  
    \[
    P(\text{H1} | \text{I am in experiment}) = \frac{(1/10^6) \times 0.5}{(1/10^6) \times 0.5 + (2/10^6) \times 0.5} = \frac{1}{3} \approx 0.33.
    \]  
  - **SIA**:  
    - Prior weights: \( P_{\text{SIA}}(\text{H1}) \propto 0.5 \times 10^6 \), \( P_{\text{SIA}}(\text{H2}) \propto 0.5 \times 10^6 \) (same total observers).  
    - Posterior same as SSA: \( P(\text{H1}) \approx 0.33 \).  
  - **Result**: **Divergence vanishes**. Broader classes dilute the "observer-count" effect, aligning SSA and SIA.  

  ---

  ### **Verdict and Objections**  
  - **Defensible verdict**: SIA is more plausible **in this scenario**.  
    - **Why**: The coin flip makes H1 and H2 equally likely a priori. SIA correctly notes that H2 implies twice as many "slots" for you to exist, making your existence under H2 less surprising. SSA’s 67% credence for H1 feels unduly skeptical of H2 despite its higher capacity to produce observers.  
  - **Strongest unresolved objection for SIA defenders**:  
    - **The "Presumptuousness" Problem**: SIA prioritizes observer count over empirical evidence. If H2 claimed 1,000 labs (not 2), SIA would assign >99% credence to H2 *regardless of the coin flip*, potentially overriding other evidence. This violates intuition that extravagant claims require strong evidence. Defenders must justify why observer count alone should sway beliefs without data.  

  ---

  ### **Summary**  
  - **SSA**: Favors hypotheses with fewer observers (67% for H1).  
  - **SIA**: Favors hypotheses with more observers (67% for H2).  
  - **Reference class**: Divergence holds for narrow classes (e.g., "researchers in Lab A") but vanishes for broad classes (e.g., "all scientists").  
  - **Verdict**: SIA’s focus on "slots for existence" is more intuitive here, but its susceptibility to presumptuousness remains a critical challenge.  

  This example isolates the core tension: Is your existence *evidence* for more observers (SIA), or does it merely reflect your place in a random sample (SSA)? The answer shapes how we weigh cosmological hypotheses—making this more than an academic puzzle.
