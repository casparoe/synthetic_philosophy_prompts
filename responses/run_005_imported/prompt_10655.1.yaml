   Finally, we need to add a short paragraph on the strongest consideration neither raises.

     Neither Owen nor Nadia addresses the potential for acausal trade to break down in the presence of agents with radically different decision theories or agents who are not "cooperative" in the same way. For example, if there are agents who defect regardless of what others do, or who use a decision theory that doesn't condition on their own actions in the same way, then the evidential link might be disrupted. This could lead to a situation where ECL cooperators are exploited by defectors, even acausally. The stability of acausal cooperation in a universe with diverse decision algorithms is a deep challenge that isn't addressed in their exchange.
