   Move 6: Nadia grants some correlation but then shifts to the problem of weighting different value systems. She argues that even with correlation, the policy becomes arbitrary because of the need to weight value systems, and that the real disagreement is about how to weight.

     - This is an important point. ECL requires a way to aggregate or compromise among value systems, and the weighting is arbitrary and can lead to instability. This is a valid criticism that goes to the heart of implementing ECL.
     - Score: 2 (clearly correct and a significant challenge)

