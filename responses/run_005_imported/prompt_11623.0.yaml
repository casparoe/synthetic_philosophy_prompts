answer: |-
  Here’s the steel-manned circularity objection to Joyce-style accuracy-dominance arguments, stripped of diplomacy and aimed squarely at the core vulnerability:

  ### The Core Circularity: Strict Propriety as a Trojan Horse for Probabilism
  1.  **The Argument's Dependency:** Joyce's proof *only* shows that incoherent credences are accuracy-dominated *if* we measure accuracy using a **strictly proper scoring rule** (SPSR). Without this restriction, counterexamples exist:
      *   **Example:** Consider a scoring rule that rewards extreme confidence (e.g., `S(c, ω) = -|1 - c|` if ω=true, `-|c|` if ω=false). An incoherent credence of 1.0 for all propositions might *not* be dominated, as it scores perfectly if everything is true (however unlikely). An SPSR *forbids* such rules.
      *   **Key Point:** The dominance result **vanishes** if we admit scoring rules that aren't strictly proper.

  2.  **Why Strict Propriety? The Allegedly "Neutral" Justification:**
      *   Proponents claim SPSRs are uniquely "legitimate" because they satisfy seemingly intuitive axioms about accuracy measurement:
          *   **Truth-Directedness:** More accurate if credence moves toward truth-value.
          *   **Propriety (Strict):** *Each* coherent credence function expects itself to be more accurate than any *other specific* credence function. (This is where the circularity bites).
      *   **The Circularity Exposed:** The justification for demanding **Strict Propriety** *itself* **presupposes the rationality of probabilistically coherent expectations**.
          *   **What "Expects" Means:** The expectation calculation `E[S(c, ·)] = ∑_ω P(ω) * S(c, ω)` used to define propriety **requires `P(ω)` to be probabilistic**! The definition *assumes* the agent uses a coherent `P` to calculate their expected score.
          *   **The Question-Begging Move:** Requiring that a rational agent's credence `c` must minimize expected inaccuracy *according to its own expectation calculation* **already builds in the assumption that the agent's credences (`P` used in the expectation) *are* coherent.** You are demanding that the scoring rule treats coherent credences as *locally optimal* **by definition**, using the very probabilistic machinery you're trying to vindicate. It's not a neutral constraint; it's a constraint *designed* to make coherent credences look uniquely rational *from the perspective of someone already using coherent credences*.

  3.  **Smuggling in Coherence via the Backdoor:**
      *   The argument doesn't start from a truly pre-probabilistic notion of "closeness to truth." Instead, it says: *"If we measure 'closeness' using a rule that is constructed to make coherent credences self-recommending (via probabilistic expectation), then only coherent credences avoid dominance."*
      *   **Analogy:** It's like defining a "legitimate speedometer" as one that always shows 55 mph when you are driving at exactly 55 mph (propriety), and then using this definition to "prove" that driving 55 mph is the only speed that avoids getting a worse speedometer reading than some alternative speed in every possible scenario. The definition rigs the game in favor of the desired outcome.

  4.  **Rejecting the "Neutral Axioms" Defense:**
      *   Proponents argue Truth-Directedness and Propriety (or weaker axioms leading to SPSRs) are intuitively obvious pre-theoretic constraints on accuracy measures.
      *   **Objection:** This intuition is **contaminated by prior acceptance of probabilism**.
          *   **Truth-Directedness Alone is Weak:** Many improper rules are truth-directed (e.g., the extreme confidence rewarder above). Truth-directedness doesn't get you close to SPSRs.
          *   **Propriety's Loaded Demand:** The intuition that *your own* credence should uniquely *expect* itself to be best isn't a raw intuition about accuracy; it's an intuition deeply intertwined with the coherentist Bayesian ideal of rational assessment *using your own probability function*. An accuracy-first epistemologist starting without probabilism might have no strong intuition that "closeness" *must* be measured in a way that satisfies this self-referential coherentist property. Demanding it *is* demanding probabilism at the meta-level.

  5.  **The Illusion of a "Purely Alethic" Vindication:**
      *   The accuracy-first program promises a vindication of coherence based *solely* on the goal of believing truths, avoiding pragmatic "Dutch book" considerations.
      *   **The Objection's Conclusion:** This promise is illusory. **Strict Propriety is a covertly pragmatic/coherentist constraint disguised as an alethic one.** It smuggles in the requirement for coherent expectations (a core tenet of probabilism) as a necessary condition for *defining* what "accuracy" even means in the argument. The dominance result doesn't flow from a truly independent concept of accuracy; it flows from an accuracy measure meticulously crafted to align with the dictates of probabilism itself. The argument is **epistemically circular**: it assumes the legitimacy of probabilistic reasoning (via the expectation in the propriety condition) in order to conclude that probabilistic reasoning is rationally obligatory.

  ### Strengthening the Objection: Key Tactics
  *   **Hammer Propriety's Expectation:** Constantly emphasize that the expectation `E[S(c, ·)] = ∑_ω P(ω) * S(c, ω)` **requires a coherent `P`** to even be defined. This is the linchpin. The definition of propriety *forces* the use of the very thing being justified.
  *   **Demand a Non-Expectation-Based Justification for SPSRs:** Challenge the proponent to justify Strict Propriety *without* appealing to the rationality of minimizing expected inaccuracy or the unique optimality of coherent credences from their own perspective. If they can't (and they generally can't within this framework without sneaking it back in), the circularity stands.
  *   **Concede Ground Ruthlessly (to Show the Knife's Edge):** Acknowledge that *if* you accept that accuracy *must* be measured such that coherent credences are *uniquely* self-recommending via their own expectations, *then* the dominance argument works. But stress that **this "if" clause *is* the assumption of probabilism**, merely relocated. It doesn't provide an independent foundation; it *is* the foundation, dressed up.
  *   **Invoke Critics:** Cite Aaron Bronfman ("A Gap in Joyce's Proof...") and Miriam Schoenfield ("Chilling out on...") who forcefully articulate versions of this circularity worry. Bronfman specifically highlights how the justification for propriety relies on probabilistic expectations.

  ### In Essence
  The strongest circularity objection asserts that **Strict Propriety isn't a neutral, pre-theoretic constraint on "accuracy" derived purely from the goal of truth; it is a technical condition *defined* using probabilistic expectations, designed to ensure that coherent credences are the fixed points of self-assessment.** Joyce's proof doesn't derive probabilism from accuracy; it derives probabilism from an *accuracy measure* that has probabilism hardwired into its definition via the Strict Propriety requirement. The "vindication" is not a derivation but a *re-description* of probabilism in alethic terms, achieved by building probabilism into the chosen measure of alethic success. The question-begging isn't subtle; it's structural.
