  I recall that defenders of Solomonoff induction might counter by emphasizing the dominance property: the prior of any machine dominates others multiplicatively. Over time, the true hypothesis will outperform others regardless of the machine. But the user’s concern is about finite evidence, where dominance alone doesn’t resolve machine-dependence. Convergence theorems are asymptotic, so for practical purposes, the choice of machine still matters.

