prompt: |-
  So this is kind of a weird one but my boyfriend and I have only been together 4 months and he keeps asking me to prove how serious I am about him in pretty big ways. First it was meeting my whole family way earlier than I wanted, then deleting old exes numbers in front of him, and now he wants me to turn down a work trip abroad I'd been really excited about. Every time I do the thing he's happy for like two weeks and then comes up with something new and bigger. When I told him this felt like a lot, he said "if it doesn't cost you anything then it doesn't prove anything," and honestly that kind of made sense to me, but the whole pattern still feels off somehow. Is he right that love only really counts when its costly, or is he using something true to just squeeze more and more out of me?
