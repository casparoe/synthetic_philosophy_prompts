  Point 4: Alina answers that order is a non-issue for strict dominance (with mixed strategies allowed) because the iterative removal of strictly dominated strategies (in any order) leaves the same reduced game. She also warns that this guarantee disappears for weak dominance.

    This is correct. The result of iteratively removing strictly dominated strategies is unique (order-independent) because if a strategy is strictly dominated in the original game, it remains strictly dominated in any subgame that does not remove the dominating strategy. Moreover, if a strategy is not strictly dominated in the original game, it will never become strictly dominated after removing other strategies. Therefore, the set of strategies that are strictly dominated can be removed in any order and we end up with the same reduced game.

    However, for weak dominance, the situation is different: removal of weakly dominated strategies can be order-dependent and might remove strategies that are part of some Nash equilibria.

