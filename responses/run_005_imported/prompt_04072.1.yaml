  Okay, let me start by understanding the user's background. They're a backend engineer with a hobby in Bayesian reasoning and forecasting. They're active on prediction markets like Metaculus and Manifold, and they engage with LessWrong-adjacent content. They already grasp the synchronic Dutch book argument for probabilism—the idea that violating probability axioms makes you vulnerable to a sure loss. Now, they're questioning the diachronic argument for conditionalization. The user feels the inference that conditionalization is equally mandatory is too quick, but they can't pinpoint why. They want arguments against generalizing from synchronic to diachronic Dutch books.

  First, I need to recall the key differences between the two arguments. The synchronic argument is about having consistent beliefs at a single time. The diachronic one involves bets across different times—before and after evidence. The user suspects there's a disanalogy because updating over time introduces new factors. They mentioned commitments that might differ when beliefs change.

  The user's main queries are: whether sure-loss vulnerability indicates the same irrationality in both cases, and what extra assumptions the diachronic argument relies on. I should break down the added assumptions in diachronic Dutch books. The core issues are commitment and diachronic consistency. In the synchronic case, all bets are simultaneous, so your beliefs must cohere now. But diachronic bets require you to pre-commit to future betting strategies, which might not align with how you'll actually feel after seeing new evidence.

  Another point is that conditionalization assumes your prior and likelihoods are fixed. But in reality, learning E might change your understanding of the hypothesis space, not just update credences. For example, if E reveals new variables, your old conditional probability might not apply. The diachronic argument treats evidence as a simple update trigger, but evidence can be ambiguous or transformative.

  Also, sure-loss vulnerability in diachronic cases depends on the bookie knowing your updating rule and your future credences. But in real life, you might not pre-specify how you'll update. The bookie needs to predict your behavior, which adds a layer of complexity. In contrast, synchronic vulnerability is about immediate inconsistency.

  The user might also be hinting at practical rationality vs. epistemic rationality. Synchronic incoherence is a clear inconsistency, like saying 2+2=5. Diachronic issues involve changing beliefs over time, which could be rational if new insights emerge. For example, if you realize your prior was flawed, sticking to conditionalization might be irrational. The diachronic argument enforces a rigid update rule, ignoring legitimate belief changes.

  I should also address whether vulnerability to Dutch books is equally damning. In synchronic cases, it's a clear sign of inconsistency. In diachronic, it might just show you didn't pre-commit, which isn't necessarily irrational. Maybe you value flexibility. The argument assumes that avoiding sure loss is paramount, but real-world decisions might prioritize other values.

  The user might appreciate examples. Suppose before seeing evidence, you set bets based on conditional probabilities. After seeing E, you update but realize your likelihoods were wrong. Adjusting away from conditionalization avoids a loss, but the Dutch book setup penalizes that. So the argument forces you to ignore new insights.

  Underlying all this is the distinction between static and dynamic coherence. Synchronic coherence is uncontroversial for a single time. Diachronic coherence imposes dynamic consistency, which is more demanding. Philosophers like David Lewis argued for it, but critics like Isaac Levi point out that learning can change legitimate preferences.

  The user needs concrete differences: commitment, possible world richness, ambiguity of evidence, and the value of flexibility. They might also want to know if there are alternative updating rules that avoid Dutch books. Some, like Jeffrey conditionalization, handle uncertain evidence but still face similar critiques.

  In summary, the diachronic argument requires extra assumptions about pre-commitment, fixed hypothesis space, and unambiguous evidence. The irrationality isn't the same because synchronic is about logical consistency, while diachronic is about adherence to a prior plan, which might not be rational after new information.
answer: |-
  You're absolutely right to be skeptical of equating the diachronic Dutch book argument for conditionalization with its synchronic counterpart for probabilism. While both involve sure-loss vulnerability, the diachronic version relies on *significantly stronger and more contestable assumptions* about rationality over time. The inference that conditionalization is "forced" in the same way as the probability axioms is indeed too fast. Here's a breakdown of the key disanalogies and extra assumptions:

  1.  **The Core Disanalogy: Commitment vs. Coherence**
      *   **Synchronic (Probabilism):** The bookie exploits an *immediate logical inconsistency* in your beliefs *at a single point in time*. If your credences violate the probability axioms (e.g., P(A) + P(not A) != 1), the bets offered *simultaneously* exploit that contradiction. Your irrationality is manifest *now* in the structure of your beliefs. Avoiding the Dutch book requires only internal logical coherence *at this moment*.
      *   **Diachronic (Conditionalization):** The bookie exploits a *failure to adhere to a pre-committed plan* across *two distinct times*. The bets are offered sequentially: some *before* seeing evidence E, based on your prior credences, and some *after* seeing E, based on your posterior credence in H. The guaranteed loss arises if your posterior P_new(H) deviates from your prior conditional probability P_old(H|E). Crucially, the argument **assumes it is irrational to ever deviate from the plan implied by your prior conditional probabilities**, even *after* you've learned E. This requires a strong notion of **diachronic commitment**.

  2.  **The Critical Extra Assumption: Diachronic Consistency as Paramount**
      The synchronic argument only assumes that rationality requires avoiding logical contradictions *at a time*. The diachronic argument imposes a much stronger requirement: that rationality demands **adherence to your prior conditional probabilities as a binding plan for future belief revision**, regardless of what you learn or how you feel when you learn it. This assumes:
      *   **Your prior fully captures everything relevant:** It assumes your prior P_old(H|E) perfectly encodes how you *should* respond to E, and that learning E *only* provides the information that E is true, without fundamentally altering your understanding of H, E, or the relationship between them. This ignores the possibility that learning E might:
          *   Reveal flaws or oversights in your prior model.
          *   Change your interpretation of the hypothesis space.
          *   Provide unexpected context that makes H seem more or less plausible *in a way your prior didn't anticipate*.
      *   **Rationality requires sticking to the plan:** Even if, upon seeing E, you genuinely feel P_old(H|E) is no longer the right credence for H (perhaps because E revealed something unexpected about the world or your own reasoning), the diachronic Dutch book argument deems it irrational to change your mind *away from that pre-specified value*. This elevates *diachronic consistency* (sticking to your prior commitments) above *synchronic coherence* (having coherent beliefs *now*, after learning E). Critics argue that synchronic coherence *at the later time* is actually more fundamental.

  3.  **The Nature of Sure-Loss Vulnerability: Exploiting a Plan, Not an Inconsistency**
      *   **Synchronic Loss:** The loss stems directly from a logical flaw *in your current state of belief*. You hold beliefs that literally cannot all be true simultaneously. The bookie merely mirrors this inconsistency in the bet structure.
      *   **Diachronic Loss:** The loss stems from your *willingness to bet based on prior commitments at T1* and your *actual posterior beliefs at T2*. The bookie isn't exploiting an inconsistency *at T1* or *at T2* individually. At T1, your prior beliefs (including P_old(H|E)) might be perfectly coherent. At T2, your posterior beliefs might also be perfectly coherent *given what you now know*. The "incoherence" only exists *across time* relative to the *bookie's strategy*, which is designed specifically to punish *deviations from the path laid out by P_old(H|E)*. This vulnerability depends crucially on the bookie knowing **both** your prior beliefs *and* your updating rule (or lack thereof). The irrationality, if it exists, lies in the *combination* of accepting the prior bets and then holding the deviant posterior, not necessarily in the posterior itself.

  4.  **Other Problematic Assumptions in the Diachronic Argument:**
      *   **The Bookie's Knowledge & Strategy:** The synchronic bookie only needs to know your *current* credences. The diachronic bookie needs to know your *prior* credences *and* correctly predict that you *won't* conditionalize (or know your specific non-conditionalizing rule). This introduces elements of **foreknowledge and strategic interaction** absent from the synchronic case. It assumes the bookie can perfectly anticipate your future epistemic state or irrationality.
      *   **Evidence is Costless, Instantaneous, and Unambiguous:** The argument assumes learning E happens instantly and without cost, and that E is unambiguously identified when it occurs. Real learning is often gradual, costly, and involves interpreting ambiguous signals. Rules like Jeffrey conditionalization handle *uncertain* evidence, but the basic diachronic Dutch book assumes certainty.
      *   **No Change in Tastes/Values/Meaning:** It assumes your utility function (simply wanting money) and the meanings of H and E remain constant. Learning E could theoretically change how you value outcomes or how you conceptualize H, making prior bets based on old valuations potentially undesirable even if they were coherent then. The synchronic argument avoids this by being timeless.
      *   **Possible World Richness:** Some argue the diachronic book requires assuming a sufficiently rich set of possible states of the world to isolate the effect of learning E specifically, which might not always hold. The synchronic argument works with any state space.

  **Why Sure-Loss Vulnerability Might *Not* Indicate the Same Kind of Irrationality:**

  *   **Synchronic Vulnerability:** Universally accepted as indicating a profound flaw – *logical inconsistency*. Holding contradictory beliefs *at the same time* is indefensible. The Dutch book vividly demonstrates this practical consequence.
  *   **Diachronic Vulnerability:** Indicates a failure of *diachronic commitment to a specific plan* (conditionalization). However:
      *   **Changing your mind might be rational:** If learning E genuinely convinces you your prior P_old(H|E) was wrong (e.g., E revealed a hidden variable you hadn't considered), deviating might be the *epistemically responsible* thing to do. The diachronic Dutch book penalizes this responsible updating! Avoiding the loss requires dogmatically sticking to your prior plan.
      *   **Vulnerability requires specific prior actions:** The loss only materializes *if* you accepted the specific prior bets the bookie offered *based on* your prior. If you simply declined those prior bets (perhaps because you suspected your updating might deviate, or for unrelated reasons), you avoid the Dutch book *even if you don't conditionalize*. Your posterior beliefs at T2 might be perfectly coherent *then*. The synchronic loss is unavoidable once you state your incoherent odds; the diachronic loss is avoidable by not engaging in the prior betting.
      *   **Focuses on Betting Behavior, Not Just Belief:** The argument primarily shows a vulnerability in a *sequence of betting decisions* governed by your beliefs. It doesn't *directly* prove the beliefs themselves are inconsistent *at any single time*; it shows the *strategy* of holding belief state S1 and then transitioning to belief state S2 (where S2 != conditionalization of S1) makes you exploitable *in this specific betting scenario*.

  **Conclusion: The Limits of the Diachronic Generalization**

  While the diachronic Dutch book is a clever and important argument highlighting the *pragmatic coherence* of conditionalization, it **does not** demonstrate that violating conditionalization involves the *same fundamental, undeniable irrationality* as violating the probability axioms. The synchronic argument exposes a *logical contradiction in current beliefs*. The diachronic argument exposes a *vulnerability arising from failing to adhere to a prior epistemic plan*, a plan that assumes your prior perfectly anticipates the epistemic impact of future evidence and that adherence to prior commitments trumps current judgment.

  **The key extra assumptions are:**

  1.  **Diachronic Commitment:** Rationality requires sticking to the belief revision plan encoded in your prior conditional probabilities.
  2.  **Prior Omniscience:** Your prior model perfectly captures how any future evidence *should* affect your beliefs.
  3.  **Bookie's Strategic Knowledge:** The bookie knows your prior *and* your updating disposition.

  Therefore, while the diachronic Dutch book provides a *pragmatic reason* to adopt conditionalization (it makes you invulnerable to *this specific kind* of exploitative strategy across time), it does not prove that non-conditionalizing updating is *inherently logically inconsistent* in the same way that violating P(A) + P(¬A) = 1 is. Rationality *might* sometimes demand deviating from conditionalization when faced with surprising evidence that challenges the foundations of your prior model. The synchronic argument leaves no such room for doubt. Your initial skepticism about the equivalence was well-founded.
