answer: |-
  Your question cuts to the heart of a major debate in Nyāya epistemology! The tension you've identified in NS 1.1.4 between `avyapadeśya` and `vyavasāyātmaka` is precisely why later commentators *had* to introduce the `nirvikalpaka/savikalpaka` distinction. It's not just a "fix" arbitrarily imposed later; it's the necessary logical consequence of resolving the apparent contradiction within the sūtra itself, driven by fundamental epistemological concerns. Let's break it down:

  1.  **The Core Tension (Exactly as you stated):**
      *   **Avyapadeśya (Non-verbal):** Vātsyāyana interprets this primarily as excluding cognitions derived from *śabda* (testimony/words), ensuring perception is *sensory* in origin. He argues it *doesn't* preclude conceptual content like "cow" – you *can* perceive "this is a cow" directly via the senses.
      *   **Vyavasāyātmaka (Determinate/Certain):** This explicitly requires the cognition to have a *specific, determinate content* (e.g., "This is a pot," "This is white," "This is a cow"). It excludes indeterminate sensory impressions, doubts ("Is that a post or a person?"), and erroneous cognitions (though `avyabhicāri` covers error specifically).
      *   **The Problem:** If `avyapadeśya` *only* rules out testimony-derived cognitions and *allows* for conceptual, nameable content ("this is a cow"), then what distinct role does `vyavasāyātmaka` play? Calling a cognition "determinate" (`vyavasāyātmaka`) inherently involves conceptual identification and predication – the very thing a strict reading of "non-verbal" (`avyapadeśya`) might seem to *forbid* if interpreted as "non-conceptual."

  2.  **The Nirvikalpaka/Savikalpaka Distinction as the Solution:**
      Later Naiyāyikas (starting prominently with Uddyotakara and Jayanta Bhaṭṭa) explicitly introduced the two-stage model to resolve this tension:
      *   **Nirvikalpaka Pratyakṣa (Non-conceptual Perception):** This is the *initial*, immediate sensory registration *before* any conceptualization or naming. It's the raw datum: contact of sense-organ (e.g., eye) with object results in cognition of bare features (e.g., a unique particular `svalakṣaṇa` possessing colour, shape, etc.), *without* any identification ("cow"), predication ("is brown"), or relation to universals (`jāti`). Crucially, **this stage is `avyapadeśya` in the stronger sense of being non-verbalizable/non-conceptual.** It's also `avyabhicāri` (non-erroneous) at this basic level – the sense organ correctly registers the sensory input. However, **it is *not* `vyavasāyātmaka`** – it lacks determinateness and specific content.
      *   **Savikalpaka Pratyakṣa (Conceptual Perception):** This arises *based on* the nirvikalpaka input, mediated by memory, concepts (`vikalpa`), and recognition (`pratyabhijñā`). Here, the indeterminate sensory data is synthesized and identified ("This is a cow," "The cow is brown"). **This stage is `vyavasāyātmaka`** – it's the determinate, judgmental cognition. It is also `avyapadeśya` *in Vātsyāyana's sense* – its origin is still sensory contact, not testimony, even though concepts (learned via testimony/experience) are now applied. It is also `avyabhicāri` (non-erroneous) when the identification is correct.

  3.  **Is the Split in the Sūtra?**
      *   **Explicitly? No.** Gautama's sūtra 1.1.4 presents a single, unified definition. There is no explicit mention of two types of perception.
      *   **Implicitly? Yes, according to the commentators.** They argue the *combination* of `avyapadeśya` and `vyavasāyātmaka` *logically necessitates* an initial non-conceptual stage. If `vyavasāyātmaka` requires determinateness/conceptualization, and `avyapadeśya` requires sensory origin *excluding* testimony-derived concepts, then the conceptual content (`vikalpa`) applied in savikalpaka *must* be applied to *something* non-conceptual provided directly by the senses – the nirvikalpaka stage. The sūtra defines the *complete perceptual process* culminating in determinate cognition (savikalpaka), but this process *presupposes* an initial non-conceptual input (nirvikalpaka).

  4.  **Distinct Jobs for Each Qualifier (Resolving the Tension):**
      With the two-stage model, each qualifier finds its distinct role:
      *   **Indriyārthasannikarṣotpanna (arising from sense-object contact):** The *cause* or origin of the entire perceptual process (covering both stages).
      *   **Avyapadeśya:** Primarily functions to **exclude cognitions derived from testimony (śabda)** as the *source*. Crucially, in its *stronger application* to nirvikalpaka, it also signifies **non-conceptual content** at that initial stage. For savikalpaka, it means the *judgment's origin* is sensory, even if concepts are used.
      *   **Avyabhicāri (non-erroneous):** Ensures **veridicality**. It applies to both stages: the nirvikalpaka must accurately reflect the sensory input, and the savikalpaka must correctly identify/conceptualize that input.
      *   **Vyavasāyātmaka:** Specifies the **nature of the final perceptual cognition** as **determinate, judgmental, and conceptual (savikalpaka)**. It excludes the indeterminate nirvikalpaka stage itself, doubts, and errors (though `avyabhicāri` also covers error).

  5.  **Was it a "Patch" or a Necessary Development?**
      It's less a "patch" covering an oversight and more the **inevitable working out of the logical implications** embedded in the sūtra and Vātsyāyana's initial commentary. The tension was *always there*:
      *   Nyāya needed perception to be sensory (`avyapadeśya` excluding śabda).
      *   Nyāya also needed perception to be the foundation of knowledge (`pramāṇa`), which requires it to yield *cognitions with specific, usable content* (`vyavasāyātmaka`) – you need to know *what* you're perceiving to act or reason.
      *   However, conceptual content (names, universals) is learned through testimony/experience. How can a cognition *originating solely* from sense-object contact *contain* such concepts without violating its sensory origin?
      *   The **nirvikalpaka/savikalpaka distinction provides the solution:** The *core sensory input* is non-conceptual (`avyapadeśya` in the strong sense). The *determinate judgment* (`vyavasāyātmaka`) arises from the *interaction* of this pure sensory input *with* memory and concepts (`vikalpa`), while still being `avyapadeśya` in the sense that its *existential ground* ("*this* thing here now") is given by the senses, not by words alone.

  **Conclusion:**

  You've hit the nail on the head. The tension between `avyapadeśya` (interpreted minimally by Vātsyāyana) and `vyavasāyātmaka` in NS 1.1.4 is the *precise catalyst* for the later, explicit development of the nirvikalpaka/savikalpaka distinction within the Nyāya school. While the sūtra itself doesn't explicitly mention two types, the commentators (starting with Uddyotakara) are not merely "patching" but rigorously demonstrating that this distinction is the *only coherent way* to satisfy *all* the criteria laid out by Gautama: perception *must* originate purely in sense-contact (`avyapadeśya` excluding śabda), *must* be non-erroneous (`avyabhicāri`), and crucially, *must* result in a usable, determinate cognition (`vyavasāyātmaka`). The nirvikalpaka stage provides the pure sensory foundation (`avyapadeśya` in its strong sense), while the savikalpaka stage provides the determinate knowledge (`vyavasāyātmaka`) built upon it, still grounded in sensory origin (`avyapadeśya` in Vātsyāyana's sense). The distinction is thus a profound and necessary elaboration of the epistemology implied by the sūtra.
