answer: |-
  Here’s a toast that works like a double-layered love story—surface-level romance for the room, hidden mechanics for the sister. Every metaphor *is* the theory, quietly:

  ---

  **(Raise your glass, pause for warmth)**  

  "Eleven years.  
  Most love stories give you the ‘once upon a time,’ then fast-forward to the ‘happily ever after.’ But yours? Yours lived in the ‘*what if*.’ The ‘*not yet*.’ The ‘*almost there*.’  

  We all watched you orbit each other — drifting close, then spinning apart. Every reunion felt like coming home. Every goodbye felt like losing the map back. And if I’m honest? We worried. Not because you didn’t love, but because you loved *so much* it became a place you could leave… but never really leave behind.  

  **Here’s the miracle though:**  
  You didn’t just *find* your way. You *built* it. Brick by stubborn brick.  

  All those years weren’t a detour — they were the foundation. Because every time you chose to walk away, you were learning the cost of life without the other. And every time you chose to return, you were paying a toll in hope. **You were proving, heartbeat by heartbeat, that every other path led back here.**  

  **And today?**  
  Today isn’t another turn in the cycle. It’s the **lock**. The vow that says: *No more almosts. No more exits. This choice resolves all others.*  

  You closed the loop.  
  You stopped the pendulum.  
  After eleven years of testing every variable… you became each other’s constant.  

  So raise your glasses —  
  To the final, resolute choice.  
  To the love that paid every toll, and built the bridge.  
  To the story that *had* to take the long way… to know exactly where it belonged.  
  **To [Groom] & [Bride] — the architects of always.**"

  ---

  ### Why This Works:
  1. **For the Room**:  
     - "Orbit," "pendulum," "toll," "loop" = poetic metaphors of struggle & resolution.  
     - Emotional arc: Long struggle → Proof of devotion → Triumphant closure.  
     - Tears & laughter land on "almosts," "map back," "architects of always."  

  2. **For the Sister (Decision Theorist)**:  
     - **"Paying a toll in hope"** = Literal cost of cycling (money pump’s "bleeding value").  
     - **"Every other path led back here"** = Revealed preference for each other as dominant.  
     - **"Lock," "resolute choice," "closed the loop"** = Vow as commitment device stopping the pump.  
     - **"Testing every variable"** = Exploration phase; **"constant"** = Stable equilibrium.  

  3. **The Hidden Nod**:  
     The entire toast *is* a money pump argument in narrative form: *Cycling preferences → Paying emotional costs → Commitment as the stabilizing choice*. The sister will hear the subtext: *"They rationalized their preferences and became dynamically consistent."*  

  **Delivery Tip**: Lean into the novelist’s voice — linger on "eleven years," smile at "stubborn brick," soften at "heartbeat by heartbeat." The theory will resonate because the *story* holds true.  

  Cheers — your toast honors their journey in two languages at once.
