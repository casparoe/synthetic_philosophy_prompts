  Williams' interpretation is crucial here—highlighting the opera's ambiguity between moral order and theatricality. This allows me to mention the statue's offer and Giovanni's refusal, but pivot to Marcus choosing differently. That contrast avoids misrepresenting the opera while celebrating Marcus's personal growth.

  The audience mix matters. Most guests won't know the opera, so the toast must be accessible. Using humor ("staggering achievement in dating") softens the past, and phrases like "legendary appetites" keep it light. For the few opera-savvy guests (the aunt, Priya), precise references like "repent or burn" and "no seam between comedy and damnation" validate their knowledge without derailing the speech.

  The emotional core is celebrating Marcus finding love with Sarah. Emphasizing her impact as the "better invitation" mirrors the statue scene but flips it: Marcus accepts love instead of rejecting repentance. Ending with a toast to their "real story" ties it together—acknowledging the opera's darkness while elevating their relationship beyond it.

