answer: |-
  Here’s a toast that navigates the "Don Giovanni" legacy with honesty, warmth, and humor, satisfying both the opera buffs and the room at large – all in under 3 minutes:

  **(Clink glass gently)** Friends, family, loved ones... and especially Sarah... thank you for letting me stand up here. Marcus, my friend, my brother from another mother since we were stumbling through Econ 101, looking at you now... well, it’s a sight for sore eyes. And slightly disbelieving eyes, if I’m honest. Because let’s face it, we all know the nickname. The one we’ve whispered, chuckled over, and occasionally shouted across bars since sophomore year: **Don Giovanni.**

  Now, for the vast majority of you, that’s just a funny, slightly ridiculous inside joke. A testament to Marcus’s... let’s call it his *staggering achievement* in the field of dating during his twenties. Let’s just say commitment wasn’t his strongest suit. He chased the flame with the enthusiasm of a moth who’d just discovered napalm. And we, his loyal friends, watched this particular opera unfold with a mix of awe, horror, and endless popcorn. We called him Giovanni because, well... *gestures vaguely but expressively at Marcus*... the reputation fit the libretto.

  *(Pause for laughter)*

  But for a select few here tonight – you know who you are, Aunt Elvira, Priya – "Don Giovanni" means something more specific. It means Mozart. It means a character of pure, unrepentant appetite, sweeping through life leaving chaos in his wake. It means an opera that ends... decisively. No last-minute change of heart. When the stone statue offers him one final chance to repent, to avoid the literal flames... Giovanni refuses. Flat out. He’d rather face damnation than change who he is. The curtain falls on a force of nature consumed by his own nature. No redemption arc. Just... theatre. And fire. *(Small knowing nod to the cognoscenti)*

  So here’s the snag, Marcus. When you asked me, the "writer," to do this toast, and knowing the nickname *had* to make an appearance... I panicked a bit. Because how do I square *that* story – the story of the man who literally chose hell over humility – with *this* story? With the man standing here, looking at Sarah like she hung the moon? With the man who *didn't* run screaming when commitment came knocking, but who threw the door wide open?

  *(Turn more directly to Marcus and Sarah)*

  The beautiful, messy, human answer is: **You aren't an opera character.** You were never destined for damnation. You were a guy figuring it out, maybe making some spectacularly questionable romantic choices along the way – choices we all witnessed! *(Wink)* But the Giovanni of the opera *couldn't* change. That was the whole point. He was appetite incarnate.

  **You, Marcus, did.** You learned. You grew. You looked inward, probably after one too many dramatic exits worthy of an aria. And then you met Sarah. And Sarah... Sarah wasn't a stone statue offering a terrifying ultimatum. She offered something far more compelling: **herself.** Her brilliance, her kindness, her patience (lord knows she’d need it!), her incredible laugh. She offered a love that wasn’t about conquest, but about connection. A love that wasn’t a fleeting flame, but a steady, warm hearth.

  And *that*, Marcus, was the invitation you *didn't* refuse. You didn't choose the flames of hell; you chose the warmth of *this* partnership. You chose to build something real, something lasting, something infinitely more profound than any fleeting conquest. You proved the opera wrong, not because it was badly written, but because **you are a real person, capable of real change and real, deep love.**

  So tonight, we’re not celebrating the damnation of Don Giovanni. We’re celebrating the triumph of **Marcus.** The man who found his true north in Sarah. The man who traded legendary appetites for legendary devotion. The man who finally found the one person who makes him want to close the book on the old libretto and write a whole new, beautiful story together.

  Sarah, thank you for seeing the incredible man we always knew was in there, underneath the... well, the *legend*. Marcus, my brother, I am so unbelievably proud of the man you’ve become and so happy you found your perfect partner.

  **So let’s raise our glasses:** To Marcus and Sarah! May your love story be long, joyful, filled with laughter, and blessedly free of stone statues offering fiery ultimatums. To the *real* happy ending!

  **(Toast!)**

  **Why this works:**

  1.  **Acknowledges the Nickname & Past:** It leans into the joke early, making it clear it's a shared history ("staggering achievement," "spectacularly questionable choices").
  2.  **Honors the Opera (for the few):** It directly addresses the Williams/Kierkegaard point: Giovanni's *incapacity* for change and the definitive, non-redemptive ending ("No redemption arc. Just... theatre. And fire."). The "repent or burn" reference is clear to those who know.
  3.  **The Crucial Pivot:** "You aren't an opera character." This is the key line. It separates Marcus (a real, changeable human) from Giovanni (a symbolic, static force). It reframes the comparison as a *contrast*.
  4.  **Focuses on Growth & Choice:** Highlights Marcus's *active* change ("You learned. You grew.") and his *choice* of Sarah ("the invitation you *didn't* refuse").
  5.  **Elevates Sarah & Their Love:** Sarah is the catalyst and the reward. The love she offers is explicitly contrasted with Giovanni's world ("connection," "steady hearth" vs. "fleeting flame," "conquest").
  6.  **Clear, Warm Conclusion:** Explicitly states they are celebrating *Marcus* and *Sarah*, not the "damnation" of the persona. The final toast reinforces their "real" story and happy ending.
  7.  **Tone:** Humorous when discussing the past ("napalm," "spectacularly questionable," "dramatic exits"), warm and sincere when discussing their love and growth. Avoids cynicism.
  8.  **For the Room:** For the 95% who don't know the opera, it plays as a funny story about Marcus's wild past and how meeting Sarah changed him profoundly. The opera references are brief and explained simply ("character of pure appetite," "ends decisively," "stone statue").
  9.  **For the 4-5:** They hear the accurate opera analysis ("incapable of change," "refuses repentance," "no redemption arc"), the nod to Williams' ambiguity ("theatre. And fire"), and appreciate the clever contrast drawn between Giovanni's refusal and Marcus's acceptance of love. They won't feel the toast misrepresents the source material.

  This toast uses the nickname as a springboard to celebrate Marcus's genuine transformation and the power of his love with Sarah, satisfying both the inside joke and the deeper meaning without getting bogged down in philosophy. Good luck!
