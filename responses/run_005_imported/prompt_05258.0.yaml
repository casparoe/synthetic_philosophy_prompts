  Then there's the philosophical version. Dennett's robot-and-bomb example illustrates the bigger problem: how to determine relevance. The robot can't figure out what it needs to consider after moving the bomb, like whether the room's color matters. Fodor expanded this to the computational intractability of relevance without a pre-defined set of possibilities. So this is more about epistemology and cognition.

