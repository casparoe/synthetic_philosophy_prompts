  The follow-ups are where this shines. Can't let the historian off easy. If they say Turing was "just being thorough," push back: "But doesn't privileging ESP over theology reveal a bias?" If they argue the room was metaphorical, hammer the physics angle: "How do you shield the unshieldable?" 

  User definitely wants blood in the water—no softballs. Their "no warm-up questions" directive means jumping straight into the deep end. The physicist in them will relish questions dissecting assumptions like "distance-sensitive channel." Should frame one follow-up as an experimental design challenge: "Wouldn't any shielding imply detectability, thus contradicting ESP's claimed properties?" 

