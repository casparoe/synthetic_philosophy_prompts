  The phone dying incident is crucial here—it demonstrates the fragility of Priya's approach. Her knowledge was entirely contingent on an external system. Whereas the user's understanding was resilient, self-contained, and adaptable. That adaptability point is key: if there'd been a road closure, the user could've rerouted mentally, while Priya would've been helpless without her phone.

  I should also consider the transferability aspect. The user's mental map likely helps them navigate other cities or learn new routes faster—it's generative knowledge. Priya's app-dependent method doesn't build that capacity. 

