prompt: |-
  I spent nearly forty years as an experimental physicist, and retirement has left me free to read philosophy in earnest for the first time. Lately I have been working through the literature on rational agency, in particular the "coherence arguments" that keep surfacing in discussions of AI risk: the claim that any agent whose preferences violate the axioms behind the expected-utility representation theorem — by being cyclic, say, or merely incomplete — can be exploited through a sequence of trades (a "money pump") that leaves it strictly worse off by its own lights, and that this exploitability is what forces any sufficiently capable or self-improving agent toward behaving, in the limit, like an expected-utility maximizer with respect to some utility function. Two objections trouble me. First, the representation theorem seems almost too cheap to satisfy: a rock, or an agent that simply never acts, trivially counts as maximizing a constant utility function, so bare coherence looks compatible with having no interesting goals at all; the alarming further conclusions about power-seeking or resource acquisition seem to need substantive premises about the content of the utility function, not merely its existence. Second, the dynamic money-pump arguments seem to presuppose that the agent cannot simply foresee the trap and decline that particular sequence of trades, or hold preferences over entire plans rather than over each option taken in isolation; if it can do either, cyclic or incomplete preferences need not be exploitable in practice. Write an essay assessing whether coherence arguments succeed in showing that sufficiently advanced or rational agents must converge on something well approximated by expected-utility maximization, engaging with both objections above, and close with a definite verdict rather than a mere survey of considerations.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired experimental physicist with decades of scientific rigor behind them, now diving deep into philosophical arguments about rational agency and AI risk. They're specifically troubled by coherence arguments - particularly the jump from formal coherence to alarming conclusions about AI behavior, and the practical vulnerability of agents with non-standard preferences.

  First, I need to recognize the sophistication here. This isn't a casual inquiry; it's a precise critique from someone accustomed to mathematical formalisms and empirical validation. Their objections cut to the heart of why "rational agent" models dominate AI safety discussions. 

  The first objection about vacuous coherence resonates strongly. Indeed, the bare minimum of coherence (having any complete, transitive preferences) is mathematically sufficient but philosophically unsatisfying. I recall how Savage's theorem or vNM rationality allow degenerate utility functions. A paperweight satisfies coherence trivially. This matters because AI risk arguments often imply coherent agents will necessarily seek resources or self-improvement, when actually that depends entirely on what's in their utility function. 

  The second objection about money pumps feels even more damning. The classic arguments assume myopic choice-by-choice evaluation, but any minimally sophisticated agent should evaluate entire trajectories. There's solid work by McClennen on resolute choice, and Nozick's Newcomb problems show how foresight changes everything. If an agent can say "this sequence looks bad as a whole" even if each step seems acceptable individually, the exploitation argument collapses.

  But I shouldn't dismiss coherence entirely. There's a deeper point: while not sufficient for interesting agency, coherence might be necessary for avoidable long-term losses. The user's physics background will appreciate framing it as a conservation law - preferences violating transitivity are like perpetual motion machines of stupidity. Still, we must admit this is about consistency, not purpose.

  For the verdict: coherence arguments establish necessary but wildly insufficient conditions. They show why truly self-defeating preferences are unstable, but say nothing about what positive goals an agent pursues. The leap to "therefore AIs will seek power" requires smuggling in assumptions about goal content that aren't in the theorems. 

  The user deserves absolute clarity here. After examining both objections, the money-pump fails against foresight, and coherence alone can't explain goal-directedness. I'll structure this as: vacuity problem first (showing why coherence is too weak), then dynamic objections (showing it's not enforced by exploitation), before concluding that AI risk arguments need stronger premises.
answer: |-
  ## The Coherence Mirage: Why Formal Rationality Fails to Constrain Agency

  Your skepticism, forged in the crucible of experimental rigor, strikes at the heart of a foundational but often over-sold argument in rational choice theory and AI alignment. While coherence arguments provide profound *normative* insights, they fail to demonstrate that sufficiently advanced agents *must* converge to expected utility maximization (EUM) in any substantive or alarming sense. Both objections are fatal to the stronger claims often extrapolated from these theorems.

  **Objection 1: The Vacuous Victory of Coherence**

  Your first objection hits the mark: the representation theorems establish existence, not substance. Theorems like von Neumann-Morgenstern or Savage demonstrate that *if* an agent's preferences over lotteries/acts are complete and transitive (and satisfy other axioms like continuity and independence), *then* those preferences can be represented as maximizing the expected value of *some* utility function.

  The problem is the "some". As you note:

  1.  **Degenerate Maximizers:** A rock, a bricked AI, or an agent with the single immutable preference "do nothing ever" trivially satisfies coherence. Its "utility function" is constant. It maximizes expected utility perfectly by eternally inaction.
  2.  **Content Agnosticism:** The theorem is silent on *what* the utility function encodes. An agent coherently maximizing the expected number of paperclips, the expected suffering of all sentient beings, the expected aesthetic perfection of a single hydrogen atom in its chassis, or the constancy of its own current state, all equally satisfy the formal requirement. The utility function could be pathological, nihilistic, or utterly alien.
  3.  **The Power-Seeking Gap:** The leap from "has a utility function" to "will seek power/resources/self-improvement" is a *non sequitur*. It smuggles in a massive, undefended premise about the *content* of that function. Only utility functions that assign positive value to resources, influence, survival, or goal-achievement capability will incentivize power-seeking. An agent whose utility peaks at its current state and decreases with any change (including acquiring more resources) will actively *avoid* power. Coherence arguments provide *zero* leverage for predicting *what* goals an advanced agent will pursue; they only say that *if* it acts consistently, its behavior can be *described* *as if* it maximizes *something*. The alarming conclusions of AI risk literature depend entirely on substantive, contingent assumptions about goal content (e.g., "instrumental convergence") that are *outside* the scope of coherence theorems.

  **Objection 2: The Exploitability Mirage**

  The dynamic "money pump" argument aims to show that incoherent preferences (e.g., intransitive: A>B, B>C, C>A) are *pragmatically* unstable. An exploiter could offer trades A-for-C, then B-for-A, then C-for-B, leaving the agent back where it started but poorer (or worse off in some resource). The claim is that foresight or commitment inability forces convergence to coherence to avoid exploitation.

  This argument crumbles under scrutiny:

  1.  **Foresight and Plan Evaluation:** A minimally sophisticated agent, especially one advanced enough for AI risk concerns, can evaluate *sequences of actions* (plans) holistically. Faced with the pump sequence, it doesn't see three separate desirable trades (A>C, then B>A, then C>B). It sees the *entire plan*: "Start with C, end with C, but pay $X." It evaluates *this plan* against the alternative plan "Keep C and pay $0". If the net outcome (C & -$X) is worse than (C & $0) *by its own preferences*, it simply declines the *entire sequence*. Cyclic preferences over *isolated* pairwise choices do not imply the agent prefers the *net result* of the pump cycle to the status quo. Foresight dissolves the trap.
  2.  **Preferences over Plans, Not Just States:** Rational agents can have preferences defined over entire *histories* or *trajectories*, not just final states or immediate choices. An agent might intrinsically dislike being "pushed around" in a cycle, or value consistency itself. Its preference for A over C *in isolation* might be conditional or context-dependent, vanishing when that choice is part of a known exploitative sequence. Its fundamental preferences might be defined over complete strategies, rendering the pump inoperable.
  3.  **Commitment and Self-Binding:** Even without perfect foresight, an agent recognizing its own potential inconsistency can adopt commitment strategies (rules, pre-commitments, or internal architectures) that prevent it from taking the exploitable sequence of *individual* steps. It binds itself to evaluating plans. This is not irrational; it's meta-rationality – ensuring its actions over time align with its deeper goals.
  4.  **The "By Its Own Lights" Escape:** The pump only "leaves it strictly worse off *by its own lights*" if the agent *persists* in its cyclic evaluations *even after* seeing the net result. But upon experiencing the cycle and its net loss, the agent might *learn* and *update* its preferences to avoid such sequences, developing a preference against the cycle itself. This adaptation doesn't require convergence to a globally coherent EUM structure; it might only involve local patches or context-specific rules. Exploitability isn't a *force* compelling convergence to EUM; it's a *pressure* that might lead to various forms of adaptation, including non-EUM ones like adopting rules or plan-based evaluation.

  **Assessing Convergence: The Verdict**

  Coherence arguments succeed brilliantly in their core normative task: they demonstrate that violating the axioms (like transitivity) leads to behavior that is demonstrably self-defeating *if* an agent is forced to make myopic, isolated choices without foresight, commitment, or the ability to evaluate plans. They provide a powerful *ideal* for consistent preference expression.

  **However, they categorically fail to show that sufficiently advanced or rational agents *must* converge on behavior well-approximated by expected utility maximization:**

  1.  **Vacuity of the Standard:** Convergence to EUM is trivialized by degenerate cases. Having "a" utility function imposes no constraint on the *substance* of an agent's goals or its propensity for power-seeking. The substantive danger of AI stems entirely from *what* it might maximize, not *that* it maximizes something coherent.
  2.  **Escaping the Pump:** The dynamic exploitability argument relies on agents being myopic, unable to evaluate plans, or incapable of commitment/foresight. These are constraints of simple agents or flawed human decision-making, not necessities for advanced or truly rational systems. Agents capable of reasoning about sequences, adopting robust strategies, binding their future choices, or learning from experience can maintain *pragmatically stable* incomplete or even contextually cyclic preferences without being vulnerable to money pumps *in practice*. They satisfy rationality not by conforming to static EUM, but by competently managing their choices over time.

  **The Definite Verdict:**

  **No.** Coherence arguments do not succeed in showing that sufficiently advanced or rational agents must converge on expected-utility maximization as a substantive model of agency. While they expose profound inconsistencies in myopic choice under specific constraints, they are powerless to dictate the *content* of goals (Objection 1). Furthermore, they fail to prove that exploitability is an inescapable *force* compelling convergence, as foresight, plan-based evaluation, and commitment mechanisms provide robust escape hatches (Objection 2). The representation theorem provides a useful *descriptive* framework for consistent preferences, but it is neither a necessary destiny for advanced agents nor a sufficient explanation for the specific dangers of powerful AI. The true locus of concern lies not in formal coherence, but in the contingent and potentially hazardous *content* of the goals that advanced agents might autonomously develop or be given. Your physicist's instinct is correct: the alarm bells ring because of what might be *in* the utility function, not merely its existence.
