  First, I need to recall Frege's anti-psychologism. In Grundlagen, he insists logic and arithmetic are objective, not products of human psychology. In "Der Gedanke," he posits a "third realm" where thoughts exist independently of minds. This is central to his argument against psychologism, which he sees as making logic subjective and relative.

  Now, the challenge is to connect this to his politics. The diary shows Frege advocating for excluding Jews and opposing democracy. The key link might be his rejection of subjective or collective will in favor of objective authority. In logic, he denies that psychological processes determine truth; similarly, in politics, he might reject the electorate's will as unreliable.

  I should focus on structural parallels. Both realms require authority independent of human minds: logical laws from the third realm, political laws from some objective source. Frege's disdain for the "merely psychological" could extend to democratic decisions, seen as capricious. His anti-democratic stance might mirror his anti-psychologism—democracy is like psychologism in logic, both relying on subjective factors.

  Also, his concept of objectivity involves universal accessibility to thoughts, but only by "properly functioning" minds. This could imply a hierarchy where some minds aren't capable, paralleling his exclusionary politics. The emphasis on purity in logic (avoiding psychological contamination) might translate to a desire for cultural or racial purity in society.

  I must avoid biographical inferences and base arguments on his texts. Highlight how his arguments against psychologism structurally oppose pluralism and subjectivity, which are essential to democracy. Point out that his third realm's indifference to thinkers mirrors his dismissal of democratic consensus. The epistemic authority in logic requires a similar political authority, unchanging and absolute.

  Ensure each step references specific doctrines: the third realm, the critique of psychologism in Grundlagen, the need for an objective basis for laws. Then map these to political concepts: rejecting electorate will as psychological, needing an objective political authority, excluding those deemed incapable of accessing objective truth. This creates a coherent link beyond coincidence.
answer: |-
  Here is a carefully constructed argument for a substantive philosophical continuity between Frege's anti-psychologism and his authoritarian politics, grounded in core doctrines from the *Grundlagen* preface and "Der Gedanke":

  1.  **The Core Anti-Psychologistic Doctrine & Its Political Resonance:** Frege's foundational argument against psychologism in logic (e.g., *Grundlagen*, Preface) is that it renders logical laws *subjective* and *contingent*. If logic depends on human psychology, its truths become relative to the specific mental constitution of individuals or groups: "what if beings were found whose laws of thought flatly contradicted ours?" This contingency, for Frege, is fatal to logic's claim to universal validity and objective truth. He insists logic must be grounded in something *objective*, independent of any particular mind's workings. This doctrine structurally mirrors his political rejection of democracy. He views the democratic electorate's will as inherently *subjective* and *contingent* – the shifting, pluralistic, "merely psychological" product of individual minds and their potentially flawed or "corrupt" (as he saw it) inclinations. Just as psychologism makes logic hostage to the vagaries of individual cognition, democracy makes legitimate political authority hostage to the vagaries of popular opinion. Both positions, in Frege's view, surrender necessary objectivity to unreliable subjectivity.

  2.  **The "Third Realm" as the Source of Authority & Its Political Analogue:** Frege's solution to psychologism in "Der Gedanke" is the "third realm" (*drittes Reich*). Thoughts reside here, objective and immutable, accessible to any "properly functioning mind." Crucially, **accessibility does not imply participation in creation or validation.** Thoughts are *grasped*, not constructed or voted upon. Their truth is *recognized*, not determined by consensus. This establishes an **epistemic hierarchy**: the objective realm *authoritatively dictates* what is true; minds *receive* and (if functioning correctly) *submit* to this authority. This structure directly parallels his political vision. He seeks a source of political authority *analogous to the third realm* – objective, immutable, not subject to the contingent will of the people. Just as the laws of logic derive their authority from the objective structure of the third realm, legitimate political laws would derive authority from an objective source (e.g., a conception of the true German *Volk*, natural order, or perhaps a philosopher-king figure implied by his elitism). The populace's role, like the mind's role regarding thoughts, is not to *will* or *decide* the law but to *recognize* and *submit* to the authority objectively grounded. Democracy, by placing authority in the contingent popular will, commits the political equivalent of psychologism – grounding law in the subjective instead of the objective.

  3.  **"Properly Functioning Minds" and the Exclusionary Impulse:** Frege's objectivity requires minds capable of accessing the third realm. While theoretically universal, this access depends on the mind's "proper functioning." Logic itself cannot be corrupted by a malfunctioning mind, but such a mind fails to grasp objective truth. This concept of "proper functioning" is inherently vulnerable to normative interpretation. His logic doesn't define malfunction, but his political writings reveal his criteria: he explicitly excludes Jews (and implicitly Catholics, Social Democrats, the French) from possessing the capacity for correct political judgment or belonging to the true German *Volk*. The *structural parallel* is clear: just as anti-psychologism logically *requires* the exclusion of subjective, psychologically contingent factors from the *source* of truth (the third realm), his politics *requires* the exclusion of groups he deems sources of subjective "corruption" (Jewish influence, Catholic dogma, socialist ideology, French culture) from the *source* of legitimate political authority (the purified German state). The excluded groups are seen as embodying the very "psychologism" – the contingent, subjective, pluralistic will – that threatens objective authority in *both* domains. Their political disenfranchisement or expulsion is the practical implementation of insulating the "objective" political realm from contaminating subjectivity, mirroring the insulation of logical truth from psychological contamination.

  4.  **The Rejection of Pluralism as a Unifying Principle:** At the heart of Frege's anti-psychologism is a profound rejection of *pluralism* in the foundations of logic. There cannot be "your logic" and "my logic"; there is only *the* logic. Pluralism equals psychologism equals the collapse of objectivity. This intolerance of foundational pluralism finds its direct political counterpart in his authoritarianism. Parliamentary democracy *is* the institutionalization of pluralism – competing parties, shifting coalitions, compromise based on diverse interests and viewpoints. Frege's diary reveals utter contempt for this. He sees it as chaotic, weak, and inherently illegitimate because it lacks a single, objective source of authority. Just as pluralism in logic is anathema (leading to subjective contingency), pluralism in politics is anathema (leading to the rule of the "merely psychological" mob or corrupting influences). The demand for a single, objective source of authority – the third realm for logic, the purified state for politics – is the unifying thread, necessitating the exclusion of pluralistic foundations (psychologism, democracy) and the exclusion of elements deemed incompatible with that singular objectivity (subjectivist philosophers, Jews, etc.).

  **Conclusion: Beyond Coincidence**

  This argument contends that Frege's anti-psychologism and his authoritarian politics are connected not merely biographically but *structurally and motivationally* through a shared core commitment: **the necessity of grounding authority (logical or political) in an objective realm utterly insulated from the contingent, subjective, and pluralistic elements of human psychology and collective will.** The doctrines are mutually reinforcing expressions of a profound aversion to contingency and pluralism as foundations.

  *   **Logic:** Psychologism introduces contingency/pluralism → undermines objectivity → Solution: Objective Third Realm, accessible only to "properly functioning" minds, excluding psychological processes from validation.
  *   **Politics:** Democracy introduces contingency/pluralism (popular will) → undermines objective authority → Solution: Objective Source of Authority (purified state/nation), governed by those with "proper functioning" (excluding "corrupting" groups), excluding the democratic process itself.

  Dummett's quarantine fails because the very *structure* of Frege's solution to the problem of psychologism in logic – its demand for an objective authority immune to subjective will and its inherent potential for normative exclusion based on "proper functioning" – provides the conceptual blueprint and justification for his rejection of democratic pluralism and his exclusionary politics. The dry, exacting prose is the same because the underlying drive for objective purity, intolerant of subjective contamination, is the same. The connection lies not in a word ("third realm") but in the philosophical architecture built to defend objective truth against the perceived threat of the psychological and plural.
