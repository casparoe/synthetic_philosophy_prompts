answer: |-
  The salt-stained windows of the Compass Rose Inn rattled with the pre-dawn wind, a low moan that matched the anxiety humming in Mara’s chest. Outside, the harbor of Haven’s End churned, slate-grey waves capped with white. The Storm Council’s latest advisory was pinned to the wall: *'Cyclone Veridian: 70% probability of major impact within 48 hours. Confidence: Low.'* Seventy percent was terrifying. Thirty percent was terrifyingly uncertain. For Haven’s End’s fishers, uncertainty was the bedrock of survival, traded upon like currency.

  For generations, they’d relied on Silas Thorne’s "Futures Market." Not for fish, but for weather. Silas, a retired mariner with shrewd eyes, acted as broker. Fishers could buy or sell "Storm Shares." If you feared a storm might wreck your boat, you *bought* shares. If a storm missed, you *sold* shares, effectively betting against disaster. When Veridian hit, those who bought shares received payouts from the pooled contributions of those who sold. It wasn’t perfect, but it spread the crippling risk of total loss across the fleet. The system thrived on divergent beliefs, on the hope of some clashing with the dread of others.

  Then came Pathfinder.

  A slick representative from a mainland tech firm had arrived a month prior, hawking a subscription service: hyper-localized, AI-driven storm-path predictions, updated hourly with unprecedented resolution. "Know where Veridian *will* hit, not where it *might*," the brochures proclaimed. The price was steep, a month’s profit for a small boat like Mara’s *Kelp Sprite*.

  Mara wrestled with the decision. Good’s theorem echoed in her mind, a lesson from her brother studying economics on the mainland: *More information can’t hurt a rational decision-maker.* If Pathfinder showed Veridian definitely sparing Haven’s End, she wouldn’t waste money buying Storm Shares. If it showed a direct hit, she could buy maximum coverage, or better yet, not sail at all, saving her boat and life. Individually, it seemed foolproof. Rational.

  She scraped together the coin. So did Jory, whose trawler was mortgaged to the gills. So did Lena, widowed last season and terrified for her sons crewing her boat. One by one, the most vulnerable, the most leveraged, signed up. Silas watched, his usual geniality replaced by a deep frown.

  Pathfinder’s first major Veridian update arrived at noon. Mara’s screen flashed: **'Impact Probability: Haven’s End >98%. Estimated Landfall: 36 hours. Seek Immediate Shelter.'** The blood drained from her face. Relief warred with dread. Relief because she *knew*. Dread because she knew *everyone else with Pathfinder knew too*.

  She rushed to Silas’s harborside shack, the traditional hub for trading Storm Shares. A crowd was already gathering, faces pale, eyes fixed on tablets and phones. The air crackled with a terrible certainty.

  "Silas!" Jory shouted, voice tight. "I need to buy shares! Maximum! Veridian’s coming straight for us!"

  "Me too!" Lena echoed, pushing forward. "All I can afford!"

  But Silas stood behind his worn ledger, arms crossed. He looked old, defeated. "There’s no market," he said, his voice flat.

  "What do you mean? Open the book!" Jory demanded.

  "Think, man!" Silas snapped, uncharacteristically sharp. "Who’s selling? Who in their right mind, knowing what Pathfinder says, would *sell* Storm Shares betting against Veridian hitting? There are *no sellers*. The uncertainty is gone. The risk isn’t shared anymore; it’s concentrated. On *you*." He gestured around the room, at the anxious faces of the Pathfinder subscribers. "The market… it only works when some think the storm will miss. Pathfinder killed that doubt."

  A collective groan rose. Mara understood instantly. The insurance-like arrangement – Silas’s Futures Market – depended on the persistence of the very uncertainty Pathfinder had vaporized. With near-perfect foresight shared by all subscribers, divergent beliefs vanished. Everyone knew they needed payout. No one could afford to be the payout provider. The mechanism collapsed under the weight of shared knowledge.

  Panic set in. Those without Pathfinder, seeing the reaction, scrambled to buy shares too, but Silas refused. "Without sellers, the price would be infinite. Pointless." The safety net was gone, ripped away not by the storm itself, but by the clarity of its arrival.

  Thirty-six hours later, Cyclone Veridian struck Haven’s End with brutal precision. Mara’s *Kelp Sprite*, hauled onto the highest slip she could manage, survived, battered but intact. Jory’s mortgaged trawler, caught trying to secure extra lines, was smashed against the breakwater. Lena’s boat, sheltering in the supposedly safe inner cove Pathfinder hadn’t flagged as vulnerable to surge, was swamped and sunk, though her sons escaped. The damage was catastrophic, concentrated on those already financially fragile, those who had rationally sought information to protect themselves.

  In the sodden, wreckage-strewn dawn, Mara stood on the quay. Silas was nearby, sifting through waterlogged timbers that had once been Jory’s livelihood. He caught her eye and shook his head, not in blame, but in shared, bitter understanding.

  Mara looked at her Pathfinder device, still miraculously working, now showing post-storm analysis. *Individually*, it had been the rational choice. It had told her the storm was coming, allowing her to save the *Sprite*. Good’s theorem held: she was better off *for having the information*, given her ability to act. She’d secured her boat, avoided a futile voyage. The information itself hadn’t harmed her; it had empowered her specific actions.

  But the *collective* adoption of that same sharp foresight? That had destroyed the communal mechanism designed to soften the blow *for everyone*. Pathfinder hadn’t changed the storm’s path; it had changed the economic landscape around it, dissolving the shared uncertainty that allowed risk-sharing. The harm wasn’t from the *content* of the news (the storm was coming regardless), but from its universal accessibility *before* the event, specifically unraveling the insurance arrangement that depended on ongoing doubt. She’d acted rationally on her information and saved her boat. Yet, the community, stripped of its shared hedge against disaster, was far worse off. The theorems weren’t contradictory; they operated on different levels. Good illuminated the individual’s optimal path in a fixed environment. Hirshleifer revealed how that path, when taken by all, could reshape – and shatter – the environment itself. The wind moaned again, carrying the scent of salt and loss, a lament for the certainty that had cost them more than the storm alone ever could.
