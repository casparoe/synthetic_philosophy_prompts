  First, I need to recall Adams's probabilistic account. He linked assertability to conditional probability P(C|A) without committing to truth conditions. His thesis was restricted to simple conditionals, not embedded ones. Stalnaker, on the other hand, proposed a truth-conditional semantics using selection functions and wanted probabilities of conditionals to equal conditional probabilities universally, even with embeddings.

  Lewis's triviality results showed that if conditionals have truth conditions and their probability always matches conditional probability, it leads to triviality—only certain credence functions can exist. This is a problem for Stalnaker because his account requires conditionals to be propositions that obey this probability rule in all contexts. Adams avoids this because he doesn't assign truth values to conditionals; they aren't propositions, so the probability-conditional probability equation is about assertability, not truth.

  The user's deeper need is to understand the structural reasons behind the asymmetry. They want to articulate this in their paper without just relying on authority. So, I should clarify the commitments: Adams's restrictions (no embeddings, no truth values) versus Stalnaker's universal claims. Lewis's proof assumes propositions with truth conditions, which Adams rejects. Thus, the result doesn't touch Adams's core claims.

  The user also asks which position is more defensible. Adams is technically safer from Lewis, but his account's limitations (handling embeddings) might be problematic. Stalnaker's response strategies (contextual parameters) add complexity. I should weigh both post-triviality: Adams's modest approach versus Stalnaker's revised truth-conditional model. The user might need to consider if embeddings are crucial or if a hybrid approach is viable. Emphasizing that Adams survives Lewis but faces other challenges, while Stalnaker adapts with modifications could provide a balanced view.
answer: |-
  Here's a detailed breakdown of Adams's and Stalnaker's theses, the impact of Lewis's triviality results, and a comparative assessment, designed to help you work through the asymmetry:

  **1. Adams's Thesis: The Restricted Probabilistic Account**

  *   **Core Commitment:** The *assertability* of a simple indicative conditional "If A, then C" is given by the speaker's conditional probability P(C|A). A conditional is assertable to the degree that one is confident in C, *on the supposition that A*.
  *   **Crucial Restrictions:**
      *   **Non-Propositional:** Adams explicitly **denies** that indicative conditionals express propositions with standard truth conditions. They are not truth-apt. There is no "A → C" proposition whose truth value can be evaluated across worlds or contexts.
      *   **Non-Embeddable:** The thesis applies *only* to "simple" conditionals occurring *unembedded* in assertoric contexts. Adams argues that conditionals cannot coherently embed within truth-functional contexts (like negation, conjunction, disjunction) or under operators like belief or probability (e.g., "P(If A, then C)") *when interpreted as conditionals*. Embedded occurrences often force a different interpretation (e.g., material implication).
      *   **Probabilistic Primacy:** Probability (specifically conditional probability) is fundamental to the meaning and function of the indicative conditional *as used in communication*. The conditional is a device for managing suppositional uncertainty.
  *   **What Adams is NOT Committed To:**
      *   Indicative conditionals having truth conditions.
      *   Indicative conditionals expressing propositions that can be embedded freely in logical compounds.
      *   The equation P(If A, then C) = P(C|A) holding for a proposition "A → C" within a standard probability calculus.

  **2. Stalnaker's Thesis: The Truth-Conditional Account**

  *   **Core Commitment:** Indicative conditionals *do* express propositions with truth conditions. The proposition expressed by "If A, then C" is true in world w iff C is true in the world w' that is the *closest* (or most similar) world to w where A is true (w' is selected by a selection function f). Crucially, Stalnaker endorses **Equation (E)**: For any rational credence function P, and for any propositions A and C (where P(A) > 0), the probability of the conditional proposition *If A, then C* is equal to the conditional probability of C given A: **P(A → C) = P(C|A)**.
  *   **Crucial Features:**
      *   **Propositional & Truth-Conditional:** "A → C" is a genuine proposition. It has a truth value (true/false) at possible worlds relative to a contextually supplied selection function.
      *   **Embeddable:** Because it's a proposition, it *should* be able to embed freely within truth-functional compounds and under operators. Stalnaker provides a compositional semantics for such embeddings.
      *   **Universal Scope:** Equation (E) is presented as a *universal principle* of rational belief for the proposition expressed by the conditional. It should hold across all rational credence states and for all pairs of propositions A, C (where P(A)>0), within a standard probability space.
  *   **What Stalnaker is Committed To:**
      *   Indicative conditionals express propositions (A → C).
      *   The proposition A → C has determinate truth conditions.
      *   Equation (E) holds universally for rational agents: P(A → C) = P(C|A).

  **3. Lewis's Triviality Results: The Asymmetric Impact**

  Lewis's proofs (1976, 1986) demonstrate that Equation (E) **cannot** hold universally if the conditional "A → C" is a proposition within a standard Boolean algebra of propositions, and if we assume a sufficiently rich space of propositions and credence functions closed under conditionalization.

  *   **The Core Argument (Simplified):** Assume (E) holds universally. Consider two incompatible propositions A and B. Lewis shows that under plausible assumptions (like the existence of at least 3 pairwise incompatible propositions with positive probability, and closure under conditionalization), (E) forces P(C|A) to equal P(C) for *all* C. This means learning A tells you *nothing* about C – your credence in C is completely independent of A. But this is absurdly restrictive; rational agents can have beliefs where learning A *does* change their credence in C. The only way (E) can hold universally is if the agent's credence function is trivial in the sense that it cannot represent any non-independent relationships between propositions. This violates the "sufficiently rich" assumption.
  *   **Impact on Stalnaker:** Lewis's result strikes at the **heart** of Stalnaker's project. Stalnaker is committed to **both** key premises Lewis needs:
      1.  **Propositionality:** "A → C" *is* a proposition within the Boolean algebra.
      2.  **Universality of (E):** Stalnaker asserts (E) holds universally for rational credence functions over the relevant propositional space.
      Lewis proves these two commitments are *incompatible* with a non-trivial probability space. Stalnaker must therefore abandon either the propositional nature of conditionals or the universality of (E). Neither is palatable for his core semantic project.
  *   **Impact on Adams:** Adams's account is **largely immune** to Lewis's result because it **rejects both premises** Lewis needs:
      1.  **Non-Propositionality:** Adams *denies* that "If A, then C" expresses a proposition. There is no "A → C" entity within the Boolean algebra of propositions for Lewis's proof to operate on. The conditional simply isn't part of the domain over which standard probability is defined in the way Lewis requires.
      2.  **Restricted Scope:** Adams only applies the equation P(*assertability* of If A, C) ≈ P(C|A) to *simple, unembedded* occurrences. He never claims it holds for the probability *of* a conditional *proposition* (because he denies there is one), nor does he claim it holds when conditionals are embedded (where his thesis doesn't apply). Lewis's proof crucially relies on embedding conditionals (e.g., considering probabilities like P((A → C) | B) or P(B → (A → C))) and manipulating them within the probability calculus. Adams explicitly avoids committing to the coherence of such embeddings *under the conditional interpretation*. The "probability" relevant to Adams is about *assertability strength*, not the probability *of* a truth-conditional content.

  **4. Defensibility Post-Triviality: Adams vs. Stalnaker**

  *   **Adams's Restricted Account:**
      *   **Strengths Post-Triviality:** It emerges **largely unscathed** technically. By denying propositionality and restricting scope, it sidesteps Lewis's formal argument. It retains its core virtue: offering a compelling explanation of how we *use* and *evaluate* simple indicative conditionals based on conditional probability, which aligns well with intuition and linguistic practice. It provides a clear account of the *Ramsey Test* intuition.
      *   **Weaknesses:** Its main weaknesses are independent of Lewis:
          *   **The Embedding Problem:** Its inability to handle embedded conditionals within its core suppositional framework is a significant limitation. Explaining the apparent meaningfulness and truth-evaluability of conditionals in complex sentences (e.g., "Either if A then C, or if B then D"; "It's likely that if A then C"; negations of conditionals) is difficult and often requires ad-hoc maneuvers or switching to a different interpretation (like material implication). This feels like an inadequacy in a full semantic theory.
          *   **Explaining Robustness:** Why does conditional probability govern assertability so pervasively? The non-propositional view struggles to explain why conditionals *feel* truth-apt and participate in some logical inferences if they lack truth conditions.

  *   **Stalnaker's Truth-Conditional Account:**
      *   **Weaknesses Post-Triviality:** Lewis's result is a **major blow**. Stalnaker must abandon the universality of (E), which was central to his motivation and explanation of the Ramsey Test intuition within a truth-conditional framework. His account *cannot* maintain both propositionality and universal (E).
      *   **Responses & Strengths:** Stalnaker (and defenders) have pursued responses:
          1.  **Contextual Parameters:** Making the selection function (and thus the truth conditions of A → C) highly sensitive to context, including the speaker's beliefs or the probabilistic context. This allows (E) to hold *locally* within a specific context where the selection function aligns with the speaker's conditional probability, but not universally across all credence functions. This preserves propositionality but sacrifices universality.
          2.  **Restricting (E):** Limiting (E) to contexts where P(A) > 0 and perhaps other conditions, acknowledging it doesn't hold in the full generality Lewis assumed. This weakens the initial claim.
          3.  **Explanatory Power:** Even with (E) restricted, the account retains significant strengths: it provides a unified, compositional semantics handling embeddings naturally, explains many logical properties of conditionals, integrates with possible worlds semantics, and offers a clear (though context-sensitive) account of truth conditions. It explains why conditionals *feel* truth-apt and behave logically.

  **Conclusion: Which is More Defensible?**

  *   **Technical Survival:** Adams's account demonstrably **survives Lewis's triviality proofs better**. Its core claims are not directly threatened by them. Stalnaker's original project, requiring both propositionality and universal (E), is refuted by Lewis.
  *   **Overall Defensibility:** However, defensibility requires weighing *all* factors, not just triviality:
      *   Adams provides an elegant, empirically grounded account of simple conditionals but struggles severely with embedding and the intuitive truth-aptness of conditionals. Its restriction feels like a significant theoretical limitation.
      *   Stalnaker's account, while wounded by Lewis, offers a more comprehensive semantic framework. Responses involving contextual sensitivity to preserve a *form* of (E) locally, while sacrificing universality, are complex but viable. Its ability to handle embeddings and provide truth conditions remains a powerful advantage.

  **Therefore, the most defensible position *once triviality results are taken into account* depends on your priorities:**

  1.  **If minimizing vulnerability to formal triviality proofs and prioritizing the core assertability intuition for simple conditionals is paramount:** **Adams's restricted account** is more defensible. It achieves its limited goals without internal contradiction revealed by Lewis.
  2.  **If providing a unified, truth-conditional, compositional semantics capable of handling embeddings and explaining logical behavior is paramount, and accepting contextual sensitivity/restricted (E) is an acceptable cost:** A **revised Stalnakerian account** (incorporating contextual parameters for the selection function and accepting that (E) holds only locally) is arguably more defensible *as a full semantic theory*. It addresses the major weakness of Adams's view while finding a way to accommodate the core probabilistic insight, albeit in a modified form.

  Most contemporary philosophers of language, acknowledging the force of Lewis, have gravitated towards non-truth-conditional (Adams-inspired "suppositional") or highly context-sensitive truth-conditional (Stalnaker-inspired) views. The choice often hinges on how severely one judges the embedding problem versus the desire to avoid radical context-sensitivity in truth conditions. Neither position emerges entirely unscathed, but Lewis forces a fundamental choice: abandon propositionality (Adams) or abandon the universality of (E) (Stalnaker). Adams chose the former path explicitly from the outset, which is why his project appears comparatively unscathed by Lewis's specific formal argument.
