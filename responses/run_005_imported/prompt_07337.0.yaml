answer: |-
  Here’s a dialogue between "Traditionalist" (defending Walzer’s symmetry) and "Revisionist" (defending McMahan’s asymmetry), pressing each other’s key vulnerabilities and ending with their double cruxes:

  ---

  **Traditionalist:** Let’s begin with what’s practical. War is collective, chaotic, and epistemically opaque. Soldiers can’t reliably adjudicate *ad bellum* justice mid-combat. If we tie *in bello* permissions to *ad bellum* justice, we dissolve the firewall protecting civilians and captured combatants. How can your theory avoid collapsing into moral anarchy?

  **Revisionist:** By recognizing that *moral reality isn’t symmetric just because epistemology is hard*. A civilian unjustly threatened has a right to self-defense; why does that vanish when she puts on a uniform? Your "equal liability" forces a just defender to absorb unjust aggression—like telling a homeowner she must let a manipulated burglar shoot first. Excuses might mitigate blame, but they don’t grant rights.

  **Traditionalist:** But the burglar isn’t conscripted by a state he can’t defy! Your analogy ignores *institutional reality*. Soldiers aren’t vigilantes; they’re agents of a political order. Treating war as aggregated self-defense ignores how authority and obedience structure responsibility. A conscripted 18-year-old deceived by propaganda isn’t morally equivalent to a terrorist—yet you’d make both "liable to kill" equally?

  **Revisionist:** Actually, no. Liability tracks *contributing to an unjust threat*, not mere participation. A deceived conscript might be excused or minimally responsible—so killing him could be disproportionate. But if he’s *voluntarily advancing an unjust invasion*, why does his uniform shield him? Your symmetry *protects the blameworthy*: the SS guard gets the same *in bello* rights as the Allied liberator.

  **Traditionalist:** Because the SS guard *as a combatant* is functionally identical to the Allied soldier: both follow orders, face identical risks, and uphold reciprocal restraints. Severing *in bello* from *ad bellum* is what lets us regulate targeting, POW treatment, and distinction. If only "just combatants" can kill licitly, doesn’t that incentivize *unjust* combatants to abandon all restraints?

  **Revisionist:** Only if we assume soldiers are amoral realists. But laws shape behavior through legitimacy, not just expediency. If we clearly reject combatant equality, we *discourage* unjust wars by denying aggressors moral cover. As for reciprocity: why should a soldier defending her homeland forfeit rights because her aggressor ignores norms?

  **Traditionalist:** Because without symmetry, *every combatant* claims moral superiority. Imagine two conscripts in trenches—each convinced their cause is just. Who determines objective justice? There’s no cosmic court. Your theory replaces workable conventions with unclaimable high ground. And what of *coerced* unjust combatants? If they’re "excused but liable," how does that differ functionally from my equality?

  **Revisionist:** It forces us to minimize harm to the less responsible. A coerced conscript might be a legitimate target only if unavoidable—but never *deserves* to die like a volunteer in an aggressive militia. Your equality erases that distinction. It also *absolves commanders*: if all combatants are equal, the general ordering atrocities shares liability with the scared private.

  **Traditionalist:** Not at all! Commanders bear greater responsibility under *both* our systems. But you conflate *moral guilt* with *liability to lethal force*. War isn’t criminal justice; it’s about managing irreducible conflict. When states fight, combatants become instruments—their personal guilt is secondary. That’s why POW status isn’t conditional on *ad bellum* review.

  **Revisionist:** And that’s precisely what’s monstrous: reducing humans to "instruments." If a state sends me to kill your family unjustly, why do I become a licit target *for you*? My threat is *your* justification for self-defense; my state’s authority doesn’t annul your right to life.

  **Traditionalist:** Because in war, the *collective threat* overrides individual moral positions. Soldiers consent to mutual risk by joining the institution. A Ukrainian draftee and a Russian conscript are both tragically caught in a machine—but accepting equal liability is what binds them to spare each other upon surrender.

  **Revisionist:** Then let’s find the crux. For me, symmetry stands or falls on this: **Can an institution (like the state) licitly confer moral permissions that override baseline rights against unjust harm?** If yes, your view holds. If no—if institutions can only *mediate* pre-existing rights—mine follows.

  **Traditionalist:** And for me, the crux is: **Does the chaos of war create a context where individualized moral liability is functionally unworkable, necessitating symmetric conventions to prevent total moral collapse?** If yes, we need combatant equality. If no, your view might hold—but I’ve yet to see how.

  ---

  ### Key Pressures Applied
  - **To Revisionist:** Epistemic limits ("Who judges justice mid-combat?"), institutional reality ("War isn’t vigilante justice"), and slippery slopes ("Does rejecting symmetry destroy humanitarian law?").
  - **To Traditionalist:** Moral consistency ("Why should defenders absorb aggression?"), coercion/deception ("What about the scapegoated conscript?"), and hidden injustices ("Equality protects the blameworthy").

  ### Double Cruxes Clarified
  - **Revisionist’s Crux:** Institutions cannot create *novel* moral permissions to harm; they can only coordinate pre-existing rights.
  - **Traditionalist’s Crux:** War’s unique chaos makes individualized liability unworkable, requiring symmetric conventions as a pragmatic moral necessity. 

  Neither side concedes, but both isolate the bedrock assumptions that would force revision.
