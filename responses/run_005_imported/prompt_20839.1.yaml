answer: |-
  That's a profoundly human question—one that cuts to the heart of agency, causality, and how we assign meaning to our efforts. Your friend's counterfactual thinking is valid, but it risks oversimplifying a complex system. Here's a structured way to break it down:

  ### 1. **The "Necessary vs. Sufficient Cause" Distinction**
     - Your campaign was likely a **sufficient cause** (it *could* produce the outcome) but not a **necessary cause** (the outcome *could* have happened without it).  
     - Example: Lighting a match is sufficient to start a fire, but not necessary if lightning strikes first.  
     - *Applied to your case*: Your organizing was sufficient to stop the hike, but not strictly necessary if policy changes would have forced the landlord's hand eventually. That doesn’t make your effort meaningless—it accelerated and shaped the outcome.

  ### 2. **Counterfactual Realism: What Actually Changes?**
     Consider what *likely* would have happened without your committee:
     - **Timing**: Landlords often delay concessions without pressure. Your campaign may have secured the rollback months earlier, saving tenants thousands.
     - **Terms**: Policy changes might have mandated a smaller reduction. Your group’s leverage (e.g., public shaming at council meetings) could have secured better terms.
     - **Secondary Effects**: Your campaign may have emboldened other buildings or even influenced the *implementation* of the new rent rules. (Politicians notice organized blocs.)

  ### 3. **The "Overdetermination" Problem**
     - Historians debate whether WWI was "overdetermined"—tensions made war inevitable, so the assassination was merely a catalyst.  
     - *Key insight*: **Catalysts matter.** Without Gavrilo Princip, the war might have started later, under different pretexts, with altered alliances. Outcomes aren’t interchangeable.  
     - *Your scale*: Without your committee, the landlord might have:
       - Delayed the rollback until legally forced (costing tenants money),
       - Imposed hidden fees or reduced services,
       - Set a precedent for future hikes.

  ### 4. **The Agency Multiplier Effect**
     Collective action often transforms latent possibilities into concrete wins:
     - **Policy without pressure** is often weakly enforced. Your campaign ensured the landlord couldn’t ignore the new rules.
     - **Information asymmetry**: Landlords assume tenants won’t organize. You disrupted that calculus, making concessions cheaper than fighting.
     - **Community capital**: Your group now exists. Future threats (e.g., maintenance neglect) can be challenged faster.

  ### 5. **A Rigorous Framework: "But For" vs. "Better Because"**
     - **"But for" causation**: "But for our campaign, would the rollback have happened?" *Answer:* Probably yes, eventually.  
     - **"Better because" causation**: "Was the outcome *better* because of our campaign?" *Almost certainly:*  
       - Faster resolution ✅  
       - Potentially better terms ✅  
       - Empowerment/community resilience ✅  
       - Contribution to broader tenant momentum ✅ (e.g., your local paper mention may have pressured politicians).

  ### Why Your Gut Is Right (and It’s Not Just Sunk Cost Fallacy)
  You intuit your campaign mattered because **agency isn’t just about necessity—it’s about shaping outcomes in real time**. In complex systems (housing markets, geopolitics), causes are *distributed*:
  - The policy change created the *opportunity*.
  - Your campaign exploited it *efficiently* and *advantageously*.

  ### Conclusion: A Principled Answer
  **Your campaign mattered, but not in a vacuum.** It was a force multiplier that:  
  ① Accelerated the win,  
  ② Likely improved its quality,  
  ③ Built capacity for future action, and  
  ④ Contributed to the ecosystem of tenant power that sustains policy wins.  

  The "what if" question doesn’t dissolve—it reframes. Causality isn’t binary; it’s about influence gradients. You didn’t just "win"—you **created a better class of victory** than passive reliance on policy. Those 200 hours bought speed, certainty, and community agency. That’s far from "dumb"; it’s how local change *actually* works.  

  > *"History is made by those who show up—not because they’re the only ones who* could*, but because they’re the ones who* do *when it counts."*
