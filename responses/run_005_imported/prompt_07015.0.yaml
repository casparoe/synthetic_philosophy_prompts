  The key differences jump out: Leibniz is about explanation/reduction - we can't find perception in parts. Jackson is about knowledge - Mary gains non-physical knowledge. Leibniz targets mechanism/machines specifically; Jackson targets all physical facts. Leibniz concludes perception requires simple substances; Jackson concludes physicalism is incomplete.

  The user specifically wants to avoid the superficial "both anti-materialist" answer. They're clearly a thoughtful teacher who values precision. The student's pushback made them reconsider, showing intellectual honesty. I should acknowledge the student was perceptive but also show where parallels exist without conflation.

  Important to note: Leibniz's "explanatory gap" is different from Jackson's "knowledge gap." One is about reducing properties to mechanisms, the other about deducing experiences from facts. The monism vs physicalism distinction matters too. 

