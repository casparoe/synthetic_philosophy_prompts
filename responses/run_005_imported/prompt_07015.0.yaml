  The user wants me to spell out Leibniz's logical structure precisely. Let me break it down: Premise 1: Perception/perceptual states are irreducible. Premise 2: Machines are reducible to mechanisms. Premise 3: If perception existed in a machine, we should find perceptual properties in components. But we only find mechanistic interactions. Conclusion: Perception can't reside in machines (only in simple substances/monads).

