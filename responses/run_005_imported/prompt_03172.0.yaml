  First, I need to unpack Hobbes' exact wording. His key move is rejecting the idea of anything truly indivisible in nature. When he says "there is no such thing in Nature," he's grounding his philosophy in physical reality. For Hobbes, even the smallest natural thing must have some magnitude because existence equals corporeality. 

  The "indivisible vs undivided" distinction isn't sophistry—it's epistemological. Hobbes is saying: when we do geometry, we're not claiming points are metaphysical atoms; we're choosing to neglect size for practical demonstration. This avoids contradicting his materialism because the "undivided" point remains theoretically divisible in reality. 

  The user's intuition about materialism is sharp. Hobbes absolutely needs this redefinition to reconcile geometry with his physics. If he accepted Euclid's points, they'd be incorporeal abstractions—heresy to his "only bodies exist" worldview. 

  I should emphasize how radical this was. Contemporary mathematicians like Wallis mocked Hobbes for it, but Hobbes was consistent: even his political theory (Leviathan) models society as physical systems. The "endeavour" definition shows this physics-first thinking—motion needs minimum real units, not mathematical ideals. 

  The user might appreciate knowing this wasn't just about geometry; it was about building a materialist worldview where math describes physical behavior without invoking mysticism. That's why he redefines "point" as a methodological tool rather than a metaphysical primitive.
answer: |-
  That's an *excellent* catch! You're absolutely right to be intrigued by this passage. Hobbes isn't just playing word games here; he's making a fundamental philosophical move rooted in his radical materialism and his desire to ground all knowledge, including geometry, in the physical world. Here's a breakdown of why he redefines the point:

  1.  **Hobbes's Core Materialism:** Hobbes was a strict materialist. For him, **only bodies exist.** Everything that exists is a physical body occupying space. Abstract, incorporeal entities like Platonic forms or immaterial souls were nonsense to him. Reality is matter in motion.

  2.  **The Problem with Euclid's Point:** Euclid's definition ("that which has no part") describes a pure mathematical abstraction. It has zero size, zero extension. It's indivisible *by definition* because it has nothing *to* divide. For Hobbes, this presented a huge problem:
      *   **Nothing in Nature is Like That:** As he explicitly says, "there is no such thing in Nature" that has no quantity or cannot be divided. If only bodies exist, and all bodies have size and are divisible (at least in principle), then an indivisible, extensionless point cannot be a real *thing*. It's an impossible abstraction.
      *   **Geometry Must Describe Reality:** Hobbes believed geometry was the fundamental science precisely because it described the real properties of real bodies (their shape, motion, etc.). If its basic building block (the point) didn't correspond to anything physical, the whole edifice seemed suspect.

  3.  **Hobbes's Solution: The "Undivided Thing" (A Methodological Abstraction):** To rescue geometry for his materialist physics, Hobbes redefines the point:
      *   **It Has Quantity:** He explicitly rejects the idea it has *no* quantity. A point, in reality, is a very small *body* with some minute but non-zero size.
      *   **We Choose to Ignore Its Size:** The key move is epistemological. When we *call* something a "point" in a geometric demonstration, we are **not considering its quantity.** We are deliberately neglecting its size and internal structure for the purposes of the specific argument or construction we are making. "Neither quantity nor any part is computed in demonstration."
      *   **Indivisible vs. Undivided:** This is the crucial distinction:
          *   **Indivisible:** Means fundamentally incapable of being divided (like Euclid's point). Hobbes says this doesn't exist in nature.
          *   **Undivided:** Means *not currently divided* or *not considered as divided* in this specific context. It's a body small enough that, *for the current purpose*, we treat it as having no parts *relevant to the demonstration*. It *could* be divided physically (because it's a body), but we are choosing not to think about that division in this geometric proof.

  4.  **Why This Matters (Philosophically & Physically):**
      *   **Grounds Geometry in Physics:** Geometry isn't about abstract, non-existent entities. It's about the properties of real, physical bodies, abstracted *methodologically* for ease of reasoning. The "point" is a stand-in for a body so small its size is irrelevant *to the specific problem at hand*.
      *   **Makes "Endeavour" Possible:** This directly relates to the passage you found. "Endeavour" is motion at the very beginning of motion – the absolute minimum motion possible. For Hobbes, motion requires a body moving through space over time. If space were made of *truly* extensionless points, motion through a single point would be instantaneous and meaningless. If time were made of *truly* durationless instants, motion in an instant would be impossible. By redefining both "point" (in space) and "instant" (in time) as **undivided minima with some (neglected) quantity**, Hobbes creates conceptual room for "endeavour" – the smallest *conceivable* unit of motion performed by a physical body moving through a physical space over a physical duration. It's the "motion made through the length of a Point" (a tiny undivided body) "and in an Instant or Point of Time" (a tiny undivided duration).
      *   **Avoids Contradiction with Materialism:** This redefinition allows Hobbes to *use* geometry without having to admit the existence of non-bodily, extensionless entities. Points and instants are mental tools for handling bodies and motions at scales where their internal complexity isn't relevant, not fundamental constituents of reality.

  **Is it "Fudging"?** From a purely mathematical perspective (especially a modern one focused on abstraction), it might seem like it. Mathematicians are generally comfortable with idealizations like extensionless points. However, **for Hobbes, it was a necessary and deliberate philosophical move.** He wasn't trying to "fix" mathematics; he was trying to make mathematics *compatible* with his fundamental belief that only bodies exist and that science must describe the physical world.

  **Think of it like this:** Imagine zooming in on a computer screen. At normal zoom, a pixel appears as a "point" of color. For most purposes (looking at the image), you ignore its internal structure and treat it as a single, undivided unit. But you *know* it's actually made of sub-pixels (RGB), and if you zoomed in further, you could see them. The pixel is "undivided" in the context of viewing the whole image, but it's clearly "divisible" upon closer inspection. Hobbes is saying geometric points are like those pixels – real, physical things with size, but treated as minimal units *within the specific context of a geometric demonstration*.

  **In Conclusion:** Hobbes isn't just being weird or slippery. He's rigorously applying his materialist philosophy to the foundations of geometry. He redefines the point to:
  1.  Avoid positing non-physical entities.
  2.  Ground geometry in the properties of real, divisible bodies.
  3.  Provide a conceptual basis for his physics of motion, particularly the concept of "endeavour" as the minimal physical motion.
  The "indivisible vs. undivided" distinction is the linchpin – it allows him to *use* geometric concepts without violating his core principle that only divisible bodies exist. It's a fascinating example of how deeply metaphysics can shape even the most fundamental concepts in science and mathematics. Your instinct about his materialism driving this was spot on!
