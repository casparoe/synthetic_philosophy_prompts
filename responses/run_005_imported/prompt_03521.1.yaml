  First, I need to recall Pascal's context. He's a 17th-century philosopher and theologian, writing after the Fall of Man in Christian theology. That's crucial for understanding "we have it no more." The "it" here is "veri juris" or "true justice." Pascal believes true justice was lost with original sin, so humans can't access it directly anymore. That explains why we rely on customs—without true justice, customs become our practical stand-in.

  Next, the user is confused about why having true justice would make us use customs. This seems counterintuitive. But Pascal's point is that if we still had true justice, customs would align with it naturally. Since we don't, customs are arbitrary, and we default to force. This ties into the second fragment where justice and might are discussed. 

  The user wonders if Pascal is saying justice is fake or just what the powerful decide. But Pascal isn't that cynical. He's describing a fallen world's reality: justice without power is ignored, power without justice is tyranny. Humans try to combine them but end up legitimizing the strong as just because they can't do the reverse. 

  The theological angle is key here. Pascal's view is rooted in the Fall—true justice exists with God, but humans can't achieve it alone. So he's not endorsing might makes right; he's critiquing human attempts at justice post-Fall. The user might be missing this theological layer, thinking it's purely political. Clarifying that could help them see Pascal's deeper argument about divine justice vs. human failure.

