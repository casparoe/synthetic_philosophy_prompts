answer: |-
  That's a fantastic core idea for a novel, and you're asking exactly the right question. The "warring halves" framing is **a very common modern projection, but it's fundamentally anachronistic and misrepresents Newton's own worldview.** While the tension and secrecy you describe are absolutely real and dramatic, the *source* of the conflict was external, not an internal battle between "science" and "mysticism."

  Here's a breakdown based on current scholarship (Keyes, Westfall, Iliffe, Mandelbrote, Snobelen):

  1.  **No Compartmentalization:** Newton did *not* see his alchemical, theological, and mathematical/physical pursuits as separate, let alone warring, domains. To him, they were all facets of a single, unified quest: **to understand the mind and actions of God through His creation.**
      *   **Alchemy:** Wasn't "mysticism" in a vague, spiritual sense. Newton saw it as **experimental natural philosophy**, investigating the hidden, active principles God embedded in matter (e.g., forces of attraction/repulsion). He believed alchemical processes revealed the *prima materia* and how God actively sustained and transformed creation. This directly informed his concept of active principles and forces in the *Principia*.
      *   **Theology (Anti-Trinitarianism & Prophecy):** This was arguably his *primary* intellectual passion. Rejecting the Trinity wasn't a "mystical" whim; it was the result of **intense, text-critical, historical scholarship.** He believed the doctrine was a fraudulent corruption introduced in the 4th century, obscuring the true relationship between God the Father (the supreme Monarch) and Jesus Christ (His subordinate, albeit divine, agent). Decoding prophecy was about **understanding God's providential plan for history**, using historical events as keys – a rational (to him), data-driven process.
      *   **Mechanistic Universe:** The *Principia* described the *mathematical laws* governing the motion of bodies under God's active force (gravity). But for Newton, this **didn't imply a cold, godless machine.** Gravity *was* God's active presence and sustaining power in the universe. The "clockwork" needed a Divine Clockmaker who actively intervened to maintain order (e.g., preventing the fixed stars from collapsing due to gravity). His universe was deeply providential.

  2.  **The Source of Secrecy & Tension:**
      *   **External Threat, Not Internal Conflict:** Newton hid his anti-Trinitarianism because **it was heretical and illegal.** Professing Arianism (or similar views) after the Restoration could lead to loss of position, imprisonment, or worse. His Lucasian Professorship, Fellowship at Trinity (ironically!), and later position at the Mint all required oaths affirming Trinitarian orthodoxy. His secrecy was pragmatic and necessary for survival and continued work.
      *   **Alchemical Secrecy:** Alchemy itself was often secretive by tradition ("the Art"), associated with dangerous chemicals and processes, and technically illegal under an old statute against "multiplying gold." Secrecy protected his reputation (alchemy had crackpot associations) and his position.
      *   **Tension with *Public* Persona:** The tension existed between Newton's **public identity** as the great mathematician and natural philosopher who described a law-governed cosmos, and his **private, all-consuming passions** for radical theology and experimental alchemy. He knew that revealing his true beliefs would destroy his public standing and ability to work. The conflict was between his inner convictions and the demands of the orthodox Anglican state/society.

  3.  **The "Emotional Engine" - A More Nuanced Approach:**
      *   **Unified Vision, Fractured Expression:** The drama lies in a man driven by a single, profound vision of uncovering God's truth in nature and scripture, **forced by circumstance to fracture his life's work into public and secret compartments.** The pain isn't "I'm betraying science with mysticism," it's **"The world forces me to hide the deepest truths I know, truths that connect my greatest public work back to God."** He fears exposure not because he doubts his theology/alchemy, but because he knows society will punish him for it.
      *   **Fear of Exposure & Isolation:** The emotional core could be profound **isolation** (knowing truths he can't share), **fear** (of ruin), and perhaps **frustration** that the world misunderstands the *true* foundation of his work. He might see his public scientific work as *part* of the truth, but incomplete without the theological and alchemical keys.
      *   **The Furnace Scene:** Instead of "hiding from himself," the scene could be far more powerful if Newton explains he's hiding **from the world that would destroy him for pursuing the *full* truth.** He could passionately argue that the furnace *is* part of understanding God's active principles in matter, just as mathematics reveals His laws in motion, and theology reveals His plan in history. He burns the notes not out of shame for the *content*, but out of fear of the *consequences* if they are found. His housemate catching him highlights the terrifying vulnerability of his hidden life.

  **Recommendations for Your Novel:**

  1.  **Drop the "Warring Halves":** Avoid framing it as "rational scientist vs. secret mystic." It misrepresents him.
  2.  **Embrace the Unified Quest:** Portray Newton as a man with one overarching goal: understanding God's creation and plan through *all* available means – mathematics, experiment (alchemy), and rigorous textual/historical scholarship (theology).
  3.  **Focus on External Conflict:** The primary tension is between his deep, unifying convictions and the dangerous, intolerant world he lives in. The secrecy is a shield, not a sign of internal doubt about the validity of his "mystical" pursuits *within his own framework*.
  4.  **Reframe the "Mystical":** Be precise. His theology was radical scholarship. His alchemy was experimental investigation. They were "occult" (hidden) and "esoteric," but driven by a fierce, almost hyper-rational desire for evidence and system-building.
  5.  **The Emotional Pain:** Explore the loneliness of holding forbidden truths, the constant fear of discovery, the anger at corruption (in church history, in alchemical frauds), and the frustration of not being able to fully integrate and proclaim his life's work.
  6.  **The Housemate Scene:** Make his explanation passionate and defiant about the *value* of what he hides, coupled with desperate pragmatism about the need to destroy evidence. "This isn't folly, it's the key! But if the Master found it... my work, my position, *everything* would be ashes."

  **Conclusion:**

  You are absolutely onto something true – Newton's secret life and the tension it caused are fascinating and dramatic. However, the "warring halves" model is a modern imposition. The deeper, more historically defensible, and arguably *more* dramatic conflict is **a brilliant, obsessive man pursuing a unified vision of divine truth, forced by a hostile world to live a dangerous double life.** His secrecy wasn't hiding from himself; it was hiding from the authorities and society that would crush him for his deeply held, meticulously researched, but heretical convictions. **Commit to that arc – it's rich, true to the history, and makes for incredible drama.** Good luck with the novel!
