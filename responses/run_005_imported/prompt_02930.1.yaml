prompt: |-
  Not a plot question for once, but this has been bugging me all week. My editor and three separate beta readers all flagged my novel's ending as not working, though they don't even agree on why - too abrupt, too neat, one just says it 'feels off.' Four people converging like that should be enough for me to just trust them and rewrite it, except I've now reread the chapter a dozen times and every time I finish it I still feel completely convinced its the strongest part of the book, not in a defensive way, I genuinely can't find what they're all sensing that I'm not. So I basically believe I should trust their read over my own here, but I can't actually make myself doubt the chapter while im in it - is that a real bind, or am I just overthinking normal feedback?
