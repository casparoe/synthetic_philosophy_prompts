answer: |-
  Here is a eulogy grounded solely in your aunt's Platonist convictions, offering comfort within her own philosophical framework, while respecting her naturalism and wishes:

  ---

  **Eulogy for [Aunt's Name]**

  We gather today to remember and honor [Aunt's Name] – a brilliant mind, a dedicated scholar, a cherished family member, and a woman of profound intellectual integrity.

  [Aunt's Name] devoted her life to exploring the most abstract and fundamental structures of mathematics, particularly the rarefied heights of set theory and large cardinal axioms. Her work wasn't just a job; it was a lifelong conversation with the deepest layers of reality as she understood it. She was a passionate, unwavering mathematical Platonist. For her, mathematics wasn't invented; it was discovered. Theorems weren't clever human constructions; they were eternal truths, waiting patiently in the vast, timeless landscape of mathematical reality to be uncovered.

  She believed, with absolute conviction, that the truths she pursued – the intricate dance of infinite sets, the properties of unimaginably large cardinals, the elegant proofs she crafted – existed long before she drew her first breath. They were true when dinosaurs roamed, true when the first human looked up at the stars in wonder, and true in the silence before life began. Crucially, she knew these truths would remain just as true, just as real, long after her own light had gone out. They are untouched by time, untouched by our mortality.

  This was her eternity. Not an afterlife of personal consciousness, which her naturalist convictions firmly rejected, but the enduring, unchanging reality of the mathematical universe she spent her life mapping. Her brilliance wasn't in *creating* this reality, but in *perceiving* it, in forging pathways through its complex terrain and returning to share breathtaking vistas with the rest of us.

  And this is where we find our comfort today, rooted entirely in *her* truth, not borrowed from elsewhere:

  **[Aunt's Name] lives on in the only way her deepest convictions would allow: through the permanent, indestructible truths she discovered and proved.** Her intellectual courage, her relentless curiosity, her sheer brilliance – they are forever inscribed onto the fabric of mathematical reality itself. The theorem she proved yesterday, ten years ago, or decades ago, wasn't just a temporary achievement; it became, through her work, a *permanent feature* of that timeless landscape. It stands there now, as solid and enduring as any mountain range, a testament to her unique journey through that realm.

  She didn't just learn about eternity; she *participated* in it. Her mind touched something unchanging and absolute. She didn't need to "watch over us" in some disembodied way to achieve a form of immortality. She achieved it through the sheer, undeniable persistence of the truths she unveiled. Every time a mathematician uses her work, builds upon her insights, or marvels at the depth of a large cardinal axiom she explored, they are encountering *her* – her intellect, her discovery, now part of the shared, eternal foundation of mathematical knowledge.

  For the family, know this: Her love for you, her personality, her laughter – these are the precious, irreplaceable memories we hold in our hearts, the human legacy she leaves with us. But her *intellectual* legacy, the work that defined so much of her purpose and passion? That transcends memory. It is secured, forever, in the very structure of the universe as she understood it. It cannot be lost, forgotten, or diminished by time. It simply *is*, and will always be, true. That was her faith, her reality, and her anchor.

  So, while we mourn the vibrant, questioning, wonderfully human presence that is gone from our daily lives, we can also find profound solace in the knowledge that **[Aunt's Name] succeeded in her deepest quest.** She connected with something truly eternal. She left permanent marks on a reality that outlasts stars and galaxies. Her discoveries are not footnotes in history; they are enduring landmarks in an unchanging realm. That is the unique, powerful, and honest immortality her Platonism affords her.

  She glimpsed eternity, not beyond this world, but woven into its most fundamental fabric. And in doing so, she secured her place within it, forever. Let us remember her brilliance, honor her integrity, and take comfort in the enduring truth of her work.

  ---

  **Key elements addressed:**

  1.  **Uncompromising Platonism:** Clearly states her belief in timeless mathematical truths existing independently of minds.
  2.  **Respect for Naturalism/No Afterlife:** Explicitly rejects personal consciousness surviving death ("not an afterlife," "didn't need to 'watch over us'").
  3.  **Comfort from Platonism:** The core comfort is that *her work and discoveries* are permanent features of the eternal mathematical reality she believed in. This is her "immortality" – not of soul, but of discovery and truth.
  4.  **"Lives On" Redefined:** Explains "lives on" strictly as her contributions enduring within the timeless mathematical structure.
  5.  **Mathematical Audience:** Uses accurate language ("set theory," "large cardinal axioms," "theorems," "proofs," "mathematical reality," "permanent feature") and acknowledges the depth of her work.
  6.  **Family Audience:** Clearly separates her human legacy (memories, love) from her intellectual legacy (the eternal truths). Explains the Platonist comfort in accessible terms ("permanent landmarks," "unchanging realm," "enduring truth," "secured her place").
  7.  **Honors Her Wishes:** Avoids any blurring with religious concepts of soul or afterlife. Comfort is derived solely from the nature of mathematical truth as she saw it.
  8.  **Tone:** Respectful, celebratory of her intellect and integrity, honest about loss, but offering the specific solace her own philosophy provides.

  This eulogy respects her fierce intellectual honesty while providing genuine comfort based on the reality she dedicated her life to understanding. It allows both mathematicians and family to mourn and celebrate her within the framework she herself held sacred.
