answer: |-
  ## The Coherent Desperation: Sidgwick's Psychical Research as Ethical Imperative

  Your friend's objection rests on a common but flawed assumption: that rigorous philosophical reasoning and the investigation of ostensibly "irrational" phenomena like telepathy or spiritualism must inhabit separate, incompatible spheres of the intellect. For Henry Sidgwick, however, his decades-long commitment to psychical research was not a lapse in philosophical coherence, but a direct, necessary, and tragically consistent consequence of the profound impasse he reached at the conclusion of *The Methods of Ethics*. Far from being "two projects awkwardly sharing one biography," Sidgwick’s philosophy and his psychical research constituted a single, unified, albeit ultimately frustrated, project: the desperate search for empirical evidence that could resolve the "Dualism of the Practical Reason" and salvage the rational foundation for a moral life.

  **The Heart of the Matter: The Dualism and its Existential Threat**

  Sidgwick's philosophical rigor led him to a devastating conclusion. He meticulously demonstrated that both Utilitarianism (the greatest happiness for the greatest number) and Rational Egoism (the greatest happiness for oneself) were self-evident and rational principles when examined independently. The problem arose when they conflicted. Sidgwick found no *rational* argument to prove that an individual *must* sacrifice their own paramount happiness for the greater good when the two demands clashed. This "Dualism of the Practical Reason" was not a minor theoretical puzzle; it was an existential crisis for ethics. It meant that the fundamental project of his life's work – establishing ethics on a rational basis – was incomplete, potentially fatally flawed. If reason could not ultimately reconcile duty and self-interest, morality rested on an unstable foundation, vulnerable to collapse whenever self-sacrifice became extreme.

  **Psychical Research as the Empirical Lifeline**

  Faced with this rational dead end, Sidgwick turned to the empirical world, not in abandonment of reason, but in pursuit of evidence that *reason itself demanded he seek*. His hope, explicitly stated, was that **empirical proof of personal survival after death, and potentially a moral order in the universe, could bridge the gap that pure reason could not.**

  1.  **Resolving the Dualism:** If consciousness survived death, and if that post-mortem existence was governed by a moral law where virtue was ultimately rewarded and vice punished (a theistic or providential order), then the conflict between egoism and utilitarianism dissolved. Acting morally *would* be in one's enlightened long-term self-interest, stretching into eternity. The happiness of the virtuous individual and the demands of the greater good would be harmonized by cosmic justice. Psychical evidence for survival offered the *only conceivable empirical pathway* to validate this necessary postulate for a rationally coherent ethics.
  2.  **Methodological Continuity:** Crucially, Sidgwick did not abandon his philosophical rigor when entering the séance room. His approach to psychical research mirrored his philosophical methodology:
      *   **Epistemic Scrupulousness:** He demanded the highest standards of evidence, employing cross-examination, controls, statistical analysis (for thought-transference), and relentless skepticism towards fraud, precisely *because* the stakes were so high. He wasn't seeking comforting illusions; he was demanding proof that could withstand the scrutiny applied to any other empirical claim. The "darkened rooms" were laboratories for existential questions.
      *   **The Burden of Proof:** Sidgwick understood the immense burden of proof required. He wasn't looking for ambiguous raps or vague "feelings"; he sought repeatable, verifiable phenomena that defied normal explanation and pointed unequivocally to supernormal agency or survival. His involvement in founding the Society for Psychical Research (SPR) institutionalized this demand for rigorous, scientific investigation.
      *   **Facing the Null Hypothesis:** His philosophical honesty compelled him to confront the possibility – indeed, the likelihood – that the phenomena were fraudulent or misperceived. His decades of work were partly a testament to his willingness to let the evidence lead, even towards disappointment.

  **The Late Doubts and the Enduring Coherence**

  Sidgwick's late-life expressions of doubt and disappointment ("waver[ing] on whether the whole project had been worth the effort") are often cited as evidence of a fractured pursuit. However, they are better understood as the tragic culmination of his *coherent* project, not its refutation.

  1.  **The Failure of Evidence:** Despite immense effort and scrupulous investigation, the "clear proof" Sidgwick sought never materialized. The SPR exposed countless frauds, and the residue of unexplained phenomena remained tantalizingly ambiguous, falling far short of the conclusive evidence needed to resolve the dualism. This failure was a profound blow precisely *because* the project mattered so deeply to his philosophical system.
  2.  **Doubts as Intellectual Honesty:** His wavering wasn't a betrayal of philosophy, but its expression. A less rigorous thinker might have clung to belief despite the evidence. Sidgwick's doubts demonstrate his unwavering commitment to *truth* over comfort. If the empirical lifeline proved frayed, he had the integrity to acknowledge it. His lament about the effort's worth reflects the crushing weight of the unanswered dualism, now stripped of its potential empirical solution.
  3.  **The Enduring Impasse:** The failure of psychical research left Sidgwick exactly where *The Methods of Ethics* had placed him: facing the unresolved dualism. His late doubts confirm that the psychical research was never a hobby or a separate interest; it was an integral, high-stakes gamble to resolve the core problem of his philosophy. Its failure meant the problem remained.

  **The Verdict: A Single, Tragically Coherent Quest**

  Therefore, the verdict is clear: **Sidgwick the philosopher and Sidgwick the psychical researcher were unequivocally engaged in a single, coherent project.** The psychical research was the empirical arm of his ethical inquiry, a desperate but rationally justified attempt to find in the observable world the evidence that would vindicate the rational harmony of the universe and secure the foundation of morality. It was born directly from the "Dualism of the Practical Reason," fueled by the same relentless intellectual honesty that identified the dualism in the first place, and conducted with the methodological rigor demanded by his philosophical training.

  The tragedy lies not in incoherence, but in the project's ultimate failure. Sidgwick sought a rational universe where duty and self-interest were reconciled. Philosophy showed him the necessity of this harmony but couldn't prove it. Psychical research offered the only conceivable path to empirical proof. When that path led nowhere conclusive, Sidgwick was left with the stark, unresolved tension he had so candidly laid bare. His decades in the darkened rooms were not a contradiction of his philosophical rigor; they were its most poignant and human expression – the rigorous, heartbreaking search for a light that never came. This makes your protagonist not incoherent, but profoundly authentic to the real Sidgwick's existential and intellectual struggle. His evenings in the séance room were the direct, logical, and deeply human consequence of the unresolved conflict he grappled with in his morning lectures. It is this very tension that makes him such a compelling figure for your novel.
