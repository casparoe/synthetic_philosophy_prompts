  First, they want to clarify whether the guest is defending Zahavi's original idea (cost as the point) or Grafen's model (differential cost gradients). The guest might blur these, so the question needs to force a distinction. The follow-up should address if the guest conflates the two.

  Next, the Getty objection: indices can ensure honesty without cost, which directly challenges the necessity of handicaps. The guest's usual dodge is "that's just an index," so the follow-up must push why indices aren't signals and how they fit into communication systems without costs.

