prompt: |-
  I'm a PhD student in behavioral ecology, and my labmate and I run a tiny philosophy-of-biology podcast on the side (we record in her office, very glamorous setup). Next week's guest is a theoretical biologist turned philosopher of science who's spent his career, and now a whole book, defending a pretty hardcore Zahavian reading of the handicap principle -- not the watered-down "costly signals can be honest" claim everyone already accepts, but the stronger one that reliable communication between parties with conflicting interests *requires* cost, and that Grafen's 1990 game-theoretic reformulation vindicated Zahavi's original 1975 hunch rather than quietly swapping in a weaker claim. The last third of the book extends this to humans -- costly religious ritual, conspicuous displays of virtue, that kind of thing -- as evidence that our gut sense of who to trust is tracking real handicap logic and not just vibes. He's a good talker but has a tell: whenever someone brings up a signal that looks cheap and still seems to work fine, he says "that's not a signal, that's an index" and moves on before anyone can pin down what's actually doing the work in that move.

  Can you write me six to eight interview questions that don't just let him replay the greatest-hits version of the theory? I want one question that forces him to say outright whether he's defending Zahavi's original claim -- that the cost itself is the point -- or Grafen's reformulation, where what actually matters is that the cost (or benefit) gradient is steeper for low-quality signalers, not that the signal is expensive per se, since I think he benefits from those two getting blurred together; one that raises the Getty-style objection that indices and other non-costly routes can sustain honest communication without any handicap at all, which seems to threaten the word "requires" in his thesis directly; one that uses the efficacy-cost/strategic-cost distinction to ask how you'd actually tell, for something like stotting in gazelles, whether the cost is buying honesty or just buying detectability; and one about cheap-talk equilibria from game theory, where real information gets through for free as long as interests aren't too opposed -- doesnt that mean his necessity claim only survives in adversarial cases, a much thinner claim than the one in his book (something like *Costly Truths*, i don't remember the exact title). For each question, throw in a short follow-up keyed to the dodge he'll probably reach for -- especially "that's just an index" -- so we're not stuck if he just repeats himself more confidently.
