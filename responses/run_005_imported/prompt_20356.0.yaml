answer: |-
  Here are 6 targeted interview questions designed to probe the core claims and potential weaknesses of your guest's strong Zahavian position, complete with anticipated dodges and follow-up counter-moves:

  1.  **Core Claim Clarification:**
      *   **Question:** "Your book strongly defends Zahavi's 1975 core idea that the *cost itself* is the signal's essential feature for honesty under conflict. Yet Grafen's 1990 model showed that what mathematically enforces honesty isn't *absolute cost*, but a *differential cost structure* where the marginal cost is higher for low-quality signalers – a signal could even be net *beneficial* if that benefit is sufficiently *steeper* for high-quality individuals. Are you defending Zahavi's original 'cost as the point' thesis, or Grafen's 'differential cost/benefit gradient' as the necessary and sufficient condition? If the former, how do you reconcile it with Grafen's formal proof?"
      *   **Anticipated Dodge:** Blurring the distinction, emphasizing Zahavi's intuition vindicated.
      *   **Follow-Up:** "But mathematically, Grafen's condition *isn't* equivalent to 'signal must be costly'. A net-beneficial signal fulfilling his gradient condition *is* stable and honest. Doesn't this mean Zahavi's specific emphasis on *cost* was technically imprecise, even if his core intuition about differential *investment* was correct? Shouldn't the 'handicap principle' label now apply strictly to Grafen's more general differential condition?"

  2.  **The Index Challenge (Getty Objection):**
      *   **Question:** "A major criticism of the *necessity* claim – that conflict *requires* cost for reliability – is the existence of 'indices'. These are signals whose form is physically, physiologically, or developmentally linked to the underlying quality (e.g., deep voice and testosterone, antler size and nutrition). They seem to provide honest information *without* requiring strategic waste or 'handicap' costs imposed by receivers. How does your framework account for the reliable communication achieved by indices, and why doesn't this demonstrate that cost is *not* universally necessary for honesty under conflict?"
      *   **Anticipated Dodge:** "That's not a signal, that's just an index!" (implying it's outside the domain of 'true' signals/signaling theory).
      *   **Follow-Up:** "But indices *are* a core category within biological signaling theory – they *are* signals conveying information. If an index reliably informs a receiver about a sender's quality (say, body size via vocal resonance) despite potential conflicts of interest (e.g., a smaller individual might benefit from appearing larger), hasn't honest communication occurred *without* the Zahavian handicap cost? Doesn't this directly falsify the claim that conflict *requires* cost for reliability?"

  3.  **Efficacy Cost vs. Strategic Cost:**
      *   **Question:** "Let's take stotting in gazelles. You'd likely argue the energetic cost and increased visibility to *other* predators is the handicap ensuring honesty to the current predator about the gazelle's fitness. But critics point to the 'efficacy cost' vs. 'strategic cost' distinction. Couldn't the primary cost of stotting be an unavoidable *efficacy cost* – the price paid simply to make the signal *detectable* or *salient* to the predator at a distance (like shouting costs energy), rather than a *strategic cost* specifically imposed *because* it handicaps low-quality individuals? How can we empirically distinguish whether the cost in such cases is primarily buying *detectability* or buying *honesty*?"
      *   **Anticipated Dodge:** Arguing that detectability cost *is* a strategic cost enforcing honesty because low-quality individuals can't afford it.
      *   **Follow-Up:** "But if the *only* function of the cost is to ensure the signal reaches the receiver effectively (like amplification), and there's no *additional* cost that differentially burdens low-quality gazelles *beyond* what's needed for detectability, does it still qualify as a Zahavian handicap? Isn't this just a necessary cost of communication, not a strategic cost enforcing honesty *per se*? Where's the evidence for the *differential* burden?"

  4.  **Cheap Talk & the Scope of Necessity:**
      *   **Question:** "Game theory shows that 'cheap talk' – cost-free signals – *can* sustain informative equilibria when the interests of sender and receiver are sufficiently *aligned*, even if not identical. Your book's title, *Costly Truths*, implies a much broader necessity for cost. Doesn't the existence of cheap-talk equilibria mean that your 'conflict requires cost' thesis only holds robustly in cases of *strong* conflict of interest? Doesn't this significantly narrow the scope of the *necessity* claim compared to how it's presented, especially when extending it to humans where interests can be complex and partially aligned (e.g., within cooperative groups)?"
      *   **Anticipated Dodge:** Downplaying the relevance of cheap talk in 'real' biological conflicts, arguing interests are rarely sufficiently aligned in high-stakes biological (or human social) scenarios.
      *   **Follow-Up:** "But even within adversarial contexts like predator-prey or mate choice, aren't there often elements of *partial* alignment? (e.g., both prey and predator benefit from quick decisions, both potential mates benefit from avoiding wasted effort). More crucially, for your human extensions – costly rituals, virtue signaling – aren't these often occurring *within* groups where shared goals and norms create significant alignment? If cheap talk can work under partial alignment, how do you rule out that the costs observed in human rituals aren't primarily serving other functions (group bonding, commitment) rather than being *necessary* for honesty *because* of underlying conflict?"

  5.  **The "That's Just an Index" Dodge - Definitional Work:**
      *   **Question:** "You often respond to putative counter-examples of cheap, reliable signals by classifying them as 'indices, not signals'. This seems crucial for maintaining the necessity claim. Could you explicitly define the operational distinction you use between a 'signal' and an 'index' in a way that clarifies *why* indices don't count against the claim that reliable *signaling* under conflict requires cost? Specifically, what is the mechanism that ensures index reliability *without* cost, and how does this mechanism fail in situations you classify as 'true signaling' requiring handicaps?"
      *   **Anticipated Dodge:** Repeating a standard definition (e.g., indices are causally linked, signals are evolved displays) without addressing the mechanism vs. cost issue.
      *   **Follow-Up:** "Many classic 'signals' studied by behavioral ecologists (like bird song, which has developmental links to condition) arguably have index-like components. Conversely, couldn't a receiver *impose* a cost based *on* an index (e.g., challenging an individual with a weak-sounding roar)? If the *reliability* of the roar (as an index) allows the receiver to impose a strategic cost efficiently, doesn't this blur the line? Isn't the key question really about the *mechanism ensuring reliability* (causal constraint vs. strategic cost), rather than a strict categorical boundary? How does your index/signal dichotomy map onto this reliability mechanism distinction?"

  6.  **Human Application - Internalization & Reduced Conflict:**
      *   **Question:** "Extending to humans, you argue costly displays (rituals, conspicuous virtue) are handicaps proving trustworthiness. But a key feature of human societies is the internalization of norms and values via culture. Doesn't this internalization *reduce* the fundamental conflict of interest between individuals? If I genuinely internalize a norm of honesty or group loyalty, signaling my trustworthiness might require *less* cost because my interests are now more aligned with the group's/receiver's. How does your model account for the potential *reduction* in underlying conflict due to norm internalization, and wouldn't this predict *cheaper* signals of trustworthiness in humans compared to, say, gazelles and lions?"
      *   **Anticipated Dodge:** Arguing that internalization is imperfect, hidden conflicts persist, and cost is still needed to prove commitment *despite* norms.
      *   **Follow-Up:** "But if internalization significantly reduces conflict, shouldn't we observe a *spectrum* of signal cost in humans, correlating with the degree of internalization or group cohesion? Where are the examples of genuinely *cheap*, reliable signals of trustworthiness in humans that arise precisely *because* of strong norm internalization reducing conflict? If these exist, doesn't it challenge the universality of the cost-necessity claim even within your human domain?"

  **Key principles used in these questions:**

  *   **Forcing Conceptual Precision:** Questions 1 & 5 directly tackle ambiguities (Zahavi vs. Grafen, Signal vs. Index).
  *   **Targeting the Necessity Claim:** Questions 2, 4, and 6 challenge the "requires" part using indices, cheap talk, and reduced conflict.
  *   **Demanding Empirical Distinction:** Question 3 asks how to test the core mechanism in practice.
  *   **Anticipating & Countering Dodges:** Each follow-up is designed to cut off the expected escape route ("vindicates Zahavi", "just an index", "detectability cost *is* strategic", "cheap talk irrelevant", "standard definition", "conflict persists").
  *   **Leveraging the Extension:** Question 6 uses the human application to probe a potential weakness (reduced conflict via culture).

  Good luck with the interview! This sounds like a fascinating (and potentially feisty) discussion. Remember to keep the tone collegial but persistent – your follow-ups are key to preventing the conversation from stalling on his standard moves.
