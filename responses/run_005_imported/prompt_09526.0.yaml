prompt: |-
  So here's a weird one a friend hit me with. She teaches high school and just caught one of her best students cheating on a final, and she can't decide what to do about it. Report it, and it's a permanent mark that could tank his college applications; handle it quietly with a talk, and it doesn't. She admits either path might be the thing that straightens him out, or the thing that convinces him the whole system's rigged against kids like him -- and there's genuinely no way to trace out which, twenty years down the line. So now she's arguing that since neither of us can know how it plays out that far ahead, theres no real rational basis for saying one choice is better than the other, its basically just guesswork with extra steps. That feels off to me but I couldn't say why on the spot. Is she actually right that this kind of not-knowing makes the choice rationally undecidable, or is there a hole in her reasoning somewhere?
