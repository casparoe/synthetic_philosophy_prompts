  Key points to address:
  1. **Rigid Designation for Morality**: Yudkowsky claims that "right" refers to a fixed computation tied to human psychology. But natural kinds like water have external referents (H₂O), while morality's referent is internal to human cognition. This internal anchor makes it contingent on human evolution, leading to relativism.

  2. **Subjunctive Objectivity**: Yudkowsky compares math's objectivity to morality, but math's truths are necessary, while moral computations are contingent. If humans evolved differently, morality changes, unlike 2+2=4. So the "subjunctive objectivity" might not hold.

  3. **Open-Question Argument**: Even if we know the computation, asking if its output is "good" remains open. This suggests the computation doesn't capture normativity, a gap Yudkowsky's naturalism might not bridge.

  4. **Three Worlds Collide**: In the story, different species have irreconcilable moral computations. Yudkowsky sees this as clarifying disagreement, but it actually highlights that without a shared computation, there's no common ground. This undercuts his claim of a single referent for "right."

  Building the argument:
  - Start by explaining Yudkowsky's position clearly to show understanding.
  - Contrast natural kind reference (external) vs. moral reference (internal). The contingency of human psychology makes the designation arbitrary in a way that natural kinds aren't.
  - Address subjunctive objectivity: Moral truths aren't necessary like math. Different evolutions lead to different moral truths, so they're relative to species.
  - Open-question argument: Moore's point that identifying good with a natural property always leaves a question. Here, identifying "right" with a computation doesn't resolve why we should care about that computation's output.
  - Three Worlds Collide: Shows that each species' "right" is tied to their psychology. No shared computation means no objective resolution, just relativism indexed to each species.

  The user might also want to know if Yudkowsky's naturalism inherits standard problems. Yes, because he reduces morality to a natural process (computation), but fails to address why that process is normative. The is-ought gap persists.

