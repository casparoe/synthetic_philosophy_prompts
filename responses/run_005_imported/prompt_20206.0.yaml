answer: |-
  Here’s the strongest case against Yudkowsky’s dissolution of the realism/anti-realism debate, engaging his rigid-designation framework on its own terms, addressing naturalism’s pitfalls, and leveraging *Three Worlds Collide* as a counterexample. The core claim: **Yudkowsky’s model smuggles in relativism by rigidly designating a *contingently fixed* computation, thereby relocating—not resolving—the arbitrariness inherent in anti-realism. His position collapses into a species-relative projectivism with realist rhetoric.**

  ### 1. **The Contingency Problem: Relocating, Not Eliminating, Arbitrariness**
     Yudkowsky argues that rigid designation fixes morality’s referent (a specific computation) "once and for all," making it non-arbitrary like water or arithmetic. But this confuses *fixation* with *necessity*:
     - **Natural kinds (e.g., water)**: Rigid designation picks out H₂O based on *actual-world microstructure*, which is *contingent* (water could have been XYZ on Twin Earth) but *objectively discoverable*. Crucially, the property "being H₂O" exists independently of human cognition.  
     - **Morality in Yudkowsky’s model**: The referent of "right" is fixed by the *actual causal history of human moral psychology*. This computation is staggeringly complex but *contingent on human evolutionary history*. If humans had evolved with different neurobiology (e.g., reptilian empathy circuits), the "fixed" computation would output different values.  
     - **The arbitrariness objection**: Calling this "non-arbitrary" because it’s rigidly designated misses the point. The *content* of the computation is arbitrary relative to possible alternatives. Rigid designation ensures we point to the same human-specific computation across worlds, but it doesn’t justify why *that specific computation* has normative authority. This is not analogous to arithmetic: 2+2=4 is *necessary* (true in all possible worlds), whereas human moral computation is *contingent* (varies across worlds with different cognitive evolution).  
     - **Result**: The "arbitrariness" isn’t eliminated—it’s moved from the *semantics* of morality (where anti-realists locate it) to the *contingent origins* of the computation. Moral truth becomes "objective" only relative to human cognition, which is relativism by another name.

  ### 2. **The Naturalism Problem: Open Questions and Normative Authority**
     Yudkowsky’s model is a form of naturalistic moral realism (morality reduces to facts about cognitive computations). But this inherits classic problems:
     - **The open-question argument (Moore)**: Even if we know the exact computation outputting "right," we can still ask, "But is this output *truly good*?" For example:  
       - *Human moral computation condemns torture. But is it *actually wrong*?*  
       The question remains open because identifying "right" with a computational output doesn’t capture normativity—it only describes what humans *do* value. Yudkowsky might reply that "truly good" *just is* the output, but this begs the question against anti-realists who see normativity as irreducible.  
     - **Normative authority**: Why *should* we care about the computation’s output? Yudkowsky argues that rejecting it is "incorrect," like rejecting 2+2=4. But math’s necessity stems from logical structure, while moral computation’s authority stems from evolved psychology. If evolution had favored selfishness, the computation would command "be selfish," but we could still ask, "Why obey?" This reduces morality to a psychological imperative, not a normative truth.  
     - **The is-ought gap**: The model derives "ought" from the *is* of human cognition. But unless human psychology has privileged normative status (which Yudkowsky doesn’t argue), this commits the naturalistic fallacy. Anti-realists can grant that moral facts exist *as psychological facts* while denying they are *genuinely normative*.

  ### 3. **The *Three Worlds Collide* Problem: Relativism in Practice**
     Yudkowsky’s story *Three Worlds Collide* (TWC) is intended to illustrate how moral disagreements are factual disputes about a fixed computation. Instead, it exposes his model’s relativistic core:
     - **The dilemma**: Humans, Babyeaters, and Superhappies each have irreconcilable "extrapolated volitions" (their ideal moral computations). Yudkowsky treats these as *discovering different truths* because each species’ referent for "right" is fixed by their distinct cognitive histories.  
     - **Contradiction**: If morality rigidly designates a species-specific computation, then:  
       - Humans are "correct" that eating babies is wrong *relative to human computation*.  
       - Babyeaters are "correct" that eating babies is obligatory *relative to their computation*.  
       This is *definitional relativism*: moral truth is indexed to a contingent cognitive framework. Yet Yudkowsky insists humans can "objectively" condemn Babyeaters—but this only works if he smuggles in a *trans-species* standard (e.g., "avoid preventable suffering"), which his model excludes.  
     - **The key takeaway**: TWC shows that when cognitive histories diverge (as they do across species), there is no "single computation" to rigidly designate. Thus, moral truth is fragmented across minds, and disputes reduce to clashes of preference ("We value our computation, you value yours"). This is anti-realism, not realism.  

  ### 4. **The Reference Problem: Why Morality Isn’t a Natural Kind**
     Yudkowsky borrows Kripke-Putnam semantics, but moral terms lack key features of natural kinds:  
     - **No causal-historical "grounding"**: "Water" is fixed by ostension to a physical substance (e.g., "this liquid is water"). But "right" is fixed by ostension to *intuitions* or *feelings* (e.g., "torturing innocents feels wrong"). These are subjective states, not external entities.  
     - **No discovery of essence**: We discover water’s essence (H₂O) empirically. But the "essence" of morality is *defined* as "whatever our idealized psychology outputs." This is circular—it’s not an independent property we discover but a reflection of ourselves.  
     - **Result**: Rigid designation for morality picks out a *contingent feature of human minds*, not a mind-independent property. This is projectivism (we project psychology onto the world) disguised as realism via semantic sleight-of-hand.  

  ### Conclusion: What Yudkowsky Achieves (and Doesn’t)
  Yudkowsky *successfully* reframes moral discourse as factual disagreement about a fixed target, avoiding non-cognitivism. But he fails to escape the realism/anti-realism dilemma:  
  - **What he dissolves**: The false dichotomy that morality must be *either* mind-independent *or* "not real." His model makes morality "real" but mind-dependent.  
  - **What he doesn’t dissolve**: The anti-realist challenge that mind-dependent moral facts lack normative authority and are arbitrary relative to alternative cognitive frameworks. By rigidly designating a human-specific computation, he offers a *coherent* moral semantics—but one that is functionally relativistic.  
  - **Net effect**: Yudkowsky provides a sophisticated defense of *species-relative naturalism*, not realism. Moral truths are "objective" in the thin sense that they are fixed facts about our cognition, but they remain arbitrary in the broader landscape of possible minds. *Three Worlds Collide* doesn’t merely illustrate this—it highlights how his resolution collapses when faced with cognitive divergence, revealing the relativism beneath the realist veneer.  

  This position may be defensible (e.g., as "Human Moral Functionalism"), but it concedes the core anti-realist claim: morality is ultimately anchored in contingent features of us, not the universe.
