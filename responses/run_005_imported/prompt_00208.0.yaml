  So I'm in this philosophy club at my school and we've been going down a rabbit hole on theories of consciousness, specifically higher-order theories (like Rosenthal's HOT theory) where a mental state is only conscious if there's some higher-order thought representing that you're in that state. While reading some background stuff I found out that Locke actually defined consciousness kind of similarly, like "the perception of what passes in a man's own mind," and he used this to build his whole theory of personal identity. That got me wondering — if Locke were alive today and had to grapple with modern HOT theories (and the objections to them, like the whole "misrepresentation" problem or the debate over whether animals/infants can be phenomenally conscious if they lack the right higher-order machinery), what do you think his actual position would be? Would he count as a proto-higher-order theorist, or would his other commitments (like his empiricism or his views on personal identity) push him toward rejecting HOT theories in some interesting way? I'd also love to know what he might've said about whether an AI system that models its own internal states could count as conscious on his account. Trying to write something for club that's more than just "here's what Locke said about consciousness" from Wikipedia, so any deeper analysis would help a ton.
