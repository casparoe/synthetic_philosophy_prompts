answer: |-
  That's a fantastic rabbit hole, and your worry about the apparent arbitrariness of the scoring rule cutting the legs out from under Joyce's dominance argument hits a *major* nerve in accuracy-first epistemology. This is **the central objection** proponents grapple with. Let's break down the responses and assess their strength.

  **The Core Problem (As You Stated It):**

  1.  **Joyce's Argument:** Probabilistic incoherence is irrational because incoherent credences are *strictly accuracy-dominated* by *some* coherent credence function under a *proper scoring rule* (like the Brier score). No matter the world-state, the coherent alternative is at least as accurate, and strictly more accurate in at least one state.
  2.  **The Arbitrariness Worry:** Why *that* scoring rule? There exist other scoring rules (often "improper" or non-strictly-proper) that seem intuitively plausible as measures of accuracy where:
      *   Some incoherent credences are *not* dominated.
      *   Or worse, some *coherent* credences *are* dominated by incoherent ones!
      *   **Conclusion Feels Rigged:** Probabilism only "wins" because we chose a scoring rule tailor-made to make incoherence look bad. Change the rule, and the dominance argument fails, undermining the case for probabilism as *the* standard of rationality.

  **How Accuracy-First Epistemologists Respond:**

  Defenders don't deny the dependence on the scoring rule. Instead, they argue that *only* a specific class of scoring rules – **Strictly Proper Scoring Rules (SPSRs)** – are legitimate measures of epistemic accuracy. The Brier score is one SPSR; the logarithmic score is another prominent example. Here's the reasoning:

  1.  **The Incentive Argument (Pragmatic Justification for Propriety):**
      *   **Core Idea:** A scoring rule should incentivize an agent to report their *true* credences. If you believe P with credence 0.7, the scoring rule should be structured such that *reporting* 0.7 yields the highest *expected* accuracy score *according to your own credences*.
      *   **Why?** If a rule isn't strictly proper, an agent could be epistemically better off (by their own lights, in expectation) by *misrepresenting* their actual beliefs. This seems deeply irrational for a measure of *epistemic* accuracy. Accuracy should be about matching belief to truth, not gaming the system.
      *   **Result:** Only SPSRs have this "truth-telling" incentive property. Under an SPSR, your best move (in expectation, by your own lights) is to be honest about your credence. Non-SPSRs incentivize dishonesty about one's own doxastic state.
      *   **Addressing Arbitrariness:** This argues that propriety isn't arbitrary; it's a *minimal rationality constraint* on what counts as an accuracy measure. A rule that incentivizes misreporting your beliefs can't be a genuine measure of how *accurately* those beliefs represent the world.

  2.  **Axiomatic Characterizations (Principled Derivation):**
      *   **Core Idea:** Instead of starting with propriety, start with intuitive, fundamental axioms that *any reasonable measure of accuracy for credences* should satisfy. Then prove mathematically that *only* SPSRs (or slight variants) satisfy these axioms.
      *   **Key Axioms (e.g., from Pettigrew, Predd et al.):**
          *   **Truth-Directedness:** If one credence assignment is uniformly closer to the truth values (0 or 1) than another across all propositions, it must be more accurate.
          *   **Propriety (or Stronger "Normality"):** Often included as a core requirement based on the incentive argument.
          *   **Separability/Additivity:** The accuracy of your whole credence function is the sum of the accuracy for individual propositions (or partitions). This simplifies calculation and avoids holistic weirdness.
          *   **Continuity/Differentiability:** Small changes in credence lead to small changes in score. Avoids pathological sensitivity.
          *   **Strict Convexity (or Strict Propriety Implied):** Penalizes being "spread out" between truth values more than being confidently wrong. (Crucial for the dominance result!).
      *   **The Theorems:** Work by Predd, Seiringer, Lieb, Osherson, Poor, and Kulkarni (2009), and later authors like Schervish, Pettigrew, and Levinstein, show that scoring rules satisfying plausible combinations of axioms like Truth-Directedness, Continuity, Strict Convexity, and Additivity/Separability **must** be (equivalent to) Strictly Proper Scoring Rules. The Brier and Log scores are the prime examples.
      *   **Addressing Arbitrariness:** This argues that the choice isn't arbitrary; SPSRs are *uniquely characterized* by fundamental, intuitive principles about what accuracy *means* for graded beliefs. If you accept the axioms, SPSRs are forced upon you. The "bad" rules violating dominance fail one or more core axioms (often convexity or propriety).

  3.  **The Limited Scope of "Bad" Rules:**
      *   **Defenders Argue:** The scoring rules where incoherent credences avoid dominance or coherent ones get dominated are deeply flawed *as accuracy measures*.
      *   They often violate Truth-Directedness (e.g., being wildly confident in a falsehood could score better than being slightly off a truth).
      *   They frequently violate Convexity, meaning they don't sufficiently penalize indecision or "splitting the difference" arbitrarily.
      *   They almost always violate Propriety, introducing the perverse incentives described above.
      *   **Addressing Arbitrariness:** The claim is that these "bad" rules only *look* plausible "on paper" at first glance. Upon closer inspection, given what accuracy *is*, they fail basic tests. The dominance argument *reveals* their inadequacy.

  **Your Honest Read: Does Probabilism Survive? Is the Crack Fatal?**

  *   **The Defense is Strong, But Not Knockdown:** The axiomatic characterizations are impressive and provide a principled foundation. The incentive argument is powerful. It's far from arbitrary; SPSRs are *heavily* constrained by deep principles. This significantly mitigates the "rigged" feeling.
  *   **The Crack Persists (But It's a Debate, Not a Collapse):** However, the arbitrariness worry *cannot be completely eradicated*. It transforms into a debate about the axioms themselves:
      *   **Are the Axioms Themselves Arbitrary?** Why *must* accuracy be additive? Is strict convexity *really* essential? (Some argue moderate convexity suffices for weaker rationality constraints). The "bad" rules often violate additivity or convexity – if you have strong intuitions against those axioms, the defense weakens.
      *   **Multiple SPSRs:** Even *within* SPSRs, dominance results can differ subtly. The Brier score guarantees dominance for *all* incoherent credences. The Log score guarantees it only for credences violating the probability axioms in specific ways (like failing additivity over partitions), but *not* necessarily for credences that are merely subadditive in a different way. Does this variation undermine the universality of the argument? (Proponents argue the core irrationality of dominance remains).
      *   **Is Propriety Truly Epistemic?** The incentive argument is pragmatic. Is this the *right kind* of justification for a purely epistemic norm? Some argue yes (rationality involves managing expectations, even epistemic ones). Others feel uneasy.
  *   **My Honest Assessment:**
      1.  **Probabilism Survives (for now):** The case for probabilism via accuracy-dominance under SPSRs remains the most compelling, rigorous, and *principled* justification available within the accuracy-first framework. The arguments against the arbitrariness worry are robust and sophisticated. It's not a crack large enough to abandon the project.
      2.  **But the Worry is Valid and Important:** It highlights that the accuracy-first project rests on substantive commitments about the *nature* of epistemic accuracy for credences (embodied in the axioms: truth-directedness, propriety, additivity, convexity). These commitments are reasonable but not *logically* unavoidable.
      3.  **It's the Engine Driving the Literature:** This "crack" isn't a secret flaw defenders ignore; it's the *central problem* generating immense research. Papers constantly refine axioms, explore alternative characterizations, investigate the implications of different SPSRs, and debate the epistemic status of propriety/convexity.
      4.  **Accuracy-First Isn't the Only Game:** The persistence of this worry is why many philosophers see accuracy-first as a powerful *tool* or *perspective*, but not necessarily the *sole foundation* for all epistemology. Dutch books, representation theorems, and other arguments for probabilism coexist, though they have their own issues. Accuracy-dominance provides a uniquely "epistemic" (rather than pragmatic Dutch book) flavor to the justification.

  **Conclusion:** You've hit the bullseye of a profound debate. The arbitrariness worry is serious and forces accuracy-first epistemologists to ground scoring rules in deeper principles (incentives/axioms). Their responses are sophisticated and make a strong case that SPSRs are uniquely qualified, rendering the dominance argument non-arbitrary *if you buy the premises*. Probabilism survives this challenge within the accuracy-first framework, but the framework itself relies on contestable axioms defining "accuracy." It's a productive crack, not a fatal one, constantly pushing the field forward. Your skepticism is healthy and places you right in the middle of cutting-edge epistemological discussion. The rabbit hole goes deeper – exploring the specific axiomatic derivations (Predd et al., Pettigrew) and critiques of convexity/additivity (e.g., by Mayo-Wilson, Wheeler) is the logical next step!
