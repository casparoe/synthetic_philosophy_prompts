        "comment": "Misattributes the core argument. Du Châtelet makes this point *specifically and emphatically for women*: Study provides vital internal resources and occupation precisely because women are *excluded* from public honors and roles (§71-73). 'Love of study is... necessary for the happiness of women' (§71)."
