  We are given a decision problem for a giving circle that pools $80,000 per quarter and must allocate it among speculative interventions. The current rule is to allocate the entire pool to the single intervention with the highest estimated expected impact per dollar (i.e., expected value maximization). An alternative proposal is to use a Kelly-style rule that splits the allocation to maximize the expected long-run geometric growth rate. A third voice argues that Kelly is not justified because the circle's utility is over impact and it's unclear if impact compounds.

  Key features of the situation:
  1. The same pool is reinvested quarter after quarter (compounding).
  2. The interventions are speculative and hard to evaluate (high uncertainty).
  3. The committee is concerned about the risk of ruin (going broke) with expected value maximization when compounding.
  4. The utility function over impact is not necessarily logarithmic (the justification for Kelly).

  The memo must decide on one concrete rule and explain why, addressing the specific features.

  Analysis:

  The Kelly criterion is derived for maximizing the long-term growth rate of wealth when bets are independent and there is a fixed fraction of wealth bet each time. It assumes that the utility is logarithmic in wealth (or that we are maximizing the geometric mean of returns). However, in this case, we are dealing with "impact" rather than money. Moreover, the interventions are not necessarily independent and the "returns" (impact) may not be in the same units as the money invested (since impact is the goal).

  However, note that the giving circle is reinvesting the same pool of money. The money is being used to fund interventions, and the "return" is the impact generated. The key question is: does the impact compound? That is, is the impact from one quarter used to generate more impact in the next? 

  In the setting described, the money is what is being compounded: the pool of money is reinvested each quarter. The interventions produce impact, but the impact does not get reinvested because the impact is the outcome (e.g., lives saved, diseases prevented) and is not converted back into money. Therefore, the money is the resource that is being managed and compounded, but the goal is to maximize the cumulative impact over time.

  We can model the process as follows:
  - Let W_t be the size of the pool at time t (quarter). Initially, W_0 is the starting pool (but note that each quarter they get $80,000 in donations, so the pool is replenished each quarter? Actually, the problem says they pool $80,000 a year, but then every quarter they have a pool. Let me re-read: "every quarter our ... team ranks ... and routes the entire quarter's pool". So each quarter they have $80,000/4 = $20,000? Actually, the problem says "around $80,000 a year" and "every quarter", so likely they allocate about $20,000 per quarter? But the exact amount per quarter is not critical.

  However, note: the donations are pooled and then allocated. The pool is fixed each quarter. They are not compounding the monetary returns of the interventions because the interventions are not generating monetary returns. They are generating impact. The money is spent. Then the next quarter, they get a new pool of donations. 

  Wait, the problem says: "we reinvest the same pool round after round". This is ambiguous. Let me clarify:

  The problem states: "our standing rule has been to route the entire quarter's pool" and "reinvest the same pool round after round". But if the entire pool is spent each quarter, then there is no monetary compounding. The "pool" is the donations collected that quarter. So each quarter, they start with a fresh $20,000 (approximately). 

  But then the derivative trader's argument about compounding and going broke doesn't hold because they are not betting with a bankroll that can go broke. They get a fixed amount each quarter. Therefore, each quarter is independent. The only connection is that the same committee is making decisions, but the monetary resource is not carried over (except that they have the same amount each quarter).

  However, the problem also says: "across enough quarters the law of large numbers will vindicate us" and the derivative trader's argument: "compounding one shared pot". This suggests that the committee might be thinking of the entire sequence of allocations as a single long-term investment strategy where the impact from one quarter might lead to more donations? Or perhaps they are saving the money? The problem does not specify.

  But the problem states: "the fact that we reinvest the same pool instead of making one-off bets". This implies that the pool is being carried over and compounded. However, if they are spending the entire pool each quarter, then there is no carryover. 

  Re-examining: "our circle pools around $80,000 a year in undesignated donations from roughly thirty members, and every quarter ...". This suggests that each quarter they have a portion of the annual pool. So each quarter they have about $20,000 to allocate. They spend it. Then next quarter, they get another $20,000. There is no compounding of the money because they are spending it all. 

  But then the derivative trader's argument about going broke doesn't apply because they cannot go broke: they get a fixed amount each quarter regardless of past performance. Therefore, the Kelly criterion is not applicable in the traditional sense because there is no bankroll that grows or shrinks based on past bets.

  However, note that the interventions might have different risk profiles. The expected value maximization rule might lead to a high chance of zero impact in a given quarter (if the intervention fails) and a small chance of very high impact. The Kelly advocate is worried about the possibility of ruin, but in this setup, ruin (zero impact in one quarter) does not affect the next quarter's allocation because the next quarter they get a fresh $20,000. 

  Therefore, the committee member's concern about going broke is misplaced because the giving circle is not at risk of losing its ability to give in the future. Each quarter is independent.

  In independent trials, maximizing expected value each time is optimal for maximizing the total expected impact. The law of large numbers ensures that the average impact per dollar will approach the expected value, and since the total impact is the sum of the impacts each quarter, maximizing the expected value each quarter maximizes the total expected impact.

  But wait: what if the interventions are not independent? For example, if an intervention in one quarter affects the impact of an intervention in a future quarter? The problem does not specify, but typically for such speculative interventions (like early-stage biosecurity advocacy) they might be independent. However, if there are dependencies, then we might need a multi-period optimization. But without more information, we assume independence.

  Therefore, the current rule (winner-take-all expected value maximization) is justified.

  However, the Samuelson-reader's point: the Kelly rule is only for log utility. But if we are not compounding, then we don't need to worry about the growth rate. We are simply maximizing the expected impact per quarter.

  But what if the giving circle's utility over impact is nonlinear? For example, if they are risk-averse over impact? The problem does not state that they are. The goal is to maximize expected impact. The committee member who has read Samuelson is correct that if we are not compounding, then we don't need Kelly. But also, if the utility is linear in impact (which is the implicit assumption when we maximize expected impact), then expected value maximization is optimal.

  However, the derivative trader might be concerned about the variance. Even if each quarter is independent, a strategy that has a high chance of zero impact and a small chance of huge impact might be less desirable than one with more consistent positive impact, if the giving circle has a concave utility function over impact per quarter. But the problem does not specify any risk aversion. The current rule assumes risk neutrality.

  But note: the problem says that the interventions are "speculative, hard-to-evaluate". This suggests that the estimates of expected impact are highly uncertain. In such cases, expected value maximization can be problematic because it might be dominated by interventions that have a tiny chance of astronomical impact, and the expected value estimate might be based on flawed models. However, the memo should not address the uncertainty in estimation unless the problem states it.

  The problem does not state that the giving circle has a concave utility function. Therefore, we assume linear utility over impact.

  Conclusion:

  Given that:
  1. The giving circle receives a fixed amount each quarter to allocate, and the entire amount is spent (no carryover to the next quarter's principal).
  2. Therefore, there is no compounding of the monetary resource across quarters.
  3. Each quarter's allocation is independent.

  Then, the optimal strategy to maximize the total expected impact is to maximize the expected impact each quarter. This is achieved by the current rule: allocating the entire quarter's pool to the intervention with the highest estimated expected impact per dollar.

  The derivative trader's argument about Kelly is based on a misunderstanding: the giving circle is not compounding a fixed bankroll. They are getting a fixed amount each quarter. Therefore, the risk of ruin (in the sense of losing the entire bankroll and having nothing to bet) does not exist.

  The Samuelson-reader is correct that without compounding and without a logarithmic utility function, the Kelly rule is not justified. Moreover, since the utility is linear in impact (by the objective of maximizing expected impact), we should maximize expected impact per dollar each quarter.

  Therefore, the memo should recommend maintaining the current rule: winner-take-all expected value maximization.

  However, note: the problem says that the committee member who trades derivatives says that naive expected-value maximization in a compounding process is a great way to go broke. But we have established that there is no compounding process. So that argument does not apply.

  But what if the giving circle is saving some of the money? The problem does not say that. It says they route the entire quarter's pool. So we assume they spend it all.

  But what if the interventions themselves generate money that is then added to the pool? The problem does not suggest that. The interventions are about impact (e.g., saving lives) and not about generating financial returns.

  Therefore, the recommendation is to stick with the current rule.

  Draft Memo:

  ---

  **To:** Allocation Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Allocation Rule for Next Year  

  After careful consideration of the arguments for changing our allocation rule, I recommend that we maintain our current practice: each quarter, we allocate the entire pool to the single intervention with the highest estimated expected impact per dollar. 

  ### Key Reasons:

  1. **Independence of Quarters**: Our giving circle receives a fixed amount of donations each quarter (approximately $20,000) and spends the entire amount. The next quarter's allocation is not contingent on the outcomes of the current quarter's intervention because we receive a fresh pool of donations. Therefore, we are not compounding a fixed bankroll over time. Each quarter is an independent decision.

  2. **Objective is Expected Impact Maximization**: Our goal is to maximize the total expected impact over time. Given the independence of quarters, the total expected impact is the sum of the expected impacts of each quarter. Thus, maximizing the expected impact each quarter separately maximizes the total expected impact.

  3. **The Kelly Criterion is Not Applicable**: The Kelly criterion is designed for situations where an agent is repeatedly betting a fixed fraction of a bankroll that compounds over time. In our case, there is no compounding bankroll. Moreover, the Kelly criterion assumes that the agent's utility is logarithmic in the bankroll, but our utility is linear in impact (not in money). Even if we were compounding, without log utility over impact, Kelly would not be justified. However, since we are not compounding, this point is secondary.

  4. **Risk of Ruin is Absent**: The concern that expected value maximization might lead to ruin (having no money left for future bets) does not apply because we are not betting with a cumulative bankroll. Even if an intervention fails and returns zero impact in one quarter, we still receive the next quarter's donations and can allocate it anew.

  ### Addressing Counterarguments:

  - **The Derivative Trader's Argument**: The analogy to a compounding trading account is flawed because we do not have a trading account that grows or shrinks based on our interventions. We have a fixed, recurring donation pool. Therefore, the caution against naive expected-value maximization in a compounding setting is inapplicable.

  - **The Samuelson Argument**: This argument correctly points out that the Kelly criterion is only justified for log utility and when the quantity being bet compounds. We agree and note that neither condition holds: we do not have log utility over impact (we have linear utility) and we are not compounding impact (or money) across quarters.

  ### Conclusion

  Our current rule of winner-take-all expected value maximization remains the most appropriate for our situation. It maximizes expected impact without introducing unnecessary complexity. We should continue with this rule for the coming year.

