answer: |-
  Let's dissect this asymmetry between finks and masks at a structural level. The core issue hinges on *when* and *how* the interfering mechanism operates relative to the stimulus, manifestation, and the disposition's intrinsic basis. I'll break it down step-by-step, then address the implications for dispositional essentialism and possible patches.

  **1. The Simple Conditional Analysis (SCA) & Its Vulnerability:**
  - **SCA:** Object O is disposed to manifest M in response to stimulus S iff: If S were to occur, M would occur.
  - **Fink Vulnerability (Martin):** SCA fails when the stimulus *destroys* the disposition *before* it can manifest.
    - *Electro-Fink Example:* A wire is disposed to conduct electricity when touched (S). But a device (the fink) detects touch and *instantly removes* the conductivity property. When touched (S occurs), the wire *doesn't* conduct (M doesn't occur). SCA falsely says the wire *lacks* the disposition.
    - **Structural Problem:** S *causes the loss* of the disposition *before* M can occur. The conditional is false, but the disposition *was* present before S.
  - **Mask/Antidote Vulnerability (Bird):** SCA fails when the disposition is present and triggered, but something *prevents* the manifestation *despite* the disposition being active.
    - *Poison/Antidote Example:* A substance is disposed to kill when ingested (S). But an antidote is present. When ingested (S occurs), the poison *is* triggered and active, but the antidote *interferes* with its causal pathway. Death (M) doesn't occur. SCA falsely says the poison *lacks* the disposition.
    - **Structural Problem:** S occurs, the disposition *is* triggered, but an *extrinsic interferer* blocks the causal chain *between* the disposition's activation and M. The conditional is false, but the disposition *is* present and active.

  **2. Lewis's Reformed Conditional Analysis (RCA) & Why it "Fixes" Finks:**
  Lewis's fix: O is disposed to manifest M in response to S iff:
  *There exists some intrinsic property B (the "causal basis") of O, such that:*
  *If S were to occur and O were to retain B throughout the relevant process, then S and B would jointly cause M.*
  *Why this works against Finks:*
  - **Targets the Fink's Mechanism:** Finks work by *removing* B *in response to S*. RCA explicitly requires that B be *retained* for the conditional to hold.
  - **Electro-Fink Revisited:** The wire has intrinsic basis B (e.g., free electron structure). The fink *removes B instantly upon S*. RCA asks: "If S occurred *and B were retained*, would M occur?" Yes, it would. But since B is *not* retained in the actual scenario (thanks to the fink), the RCA conditional doesn't apply to the actual finked wire. Crucially, RCA *doesn't* say the wire *lacks* the disposition; it says the disposition requires the *retention* of B, which the fink prevents. It correctly identifies the disposition as present but "finked away" upon stimulation.
  - **Structural Victory:** RCA isolates the vulnerability of SCA to *temporal fragility* – dispositions being destroyed *by* the stimulus itself. By requiring B's persistence *through* the causal process initiated by S, it blocks finks.

  **3. Why RCA Fails Against Masks/Antidotes:**
  - **The Mask's Mechanism:** Masks *do not* remove or alter B. They leave the intrinsic basis *intact* and *active*. They intervene *downstream* in the causal chain *after* S has occurred and *after* B has been triggered.
  - **Poison/Antidote Revisited under RCA:**
    1. The poison has intrinsic basis B (e.g., specific molecular structure).
    2. S (ingestion) occurs.
    3. B is retained throughout (the poison's molecules don't change).
    4. RCA asks: "If S occurred and B were retained, would S and B jointly cause M (death)?" **Yes, they would.** *In the absence of the mask/antidote*, S and B *do* cause M.
  - **The Problem:** The RCA conditional **is true** for the masked poison! S and B *are* sufficient to cause M *in the mask's absence*. The presence of the mask is an *extrinsic*, *interfering* factor that RCA *doesn't account for*. RCA only cares that B is retained and that B+S *would* cause M *if nothing interfered*. The mask *does* interfere, but RCA's conditional doesn't require "no masks present"; it only requires B's retention and the sufficiency of S+B for M *ceteris paribus*.
  - **Structural Failure:** Masks exploit a vulnerability to *causal interference*, not temporal fragility. RCA successfully patches the hole where the disposition is *destroyed by* the stimulus (finks), but it does nothing to address cases where the disposition is *intact, triggered, and active*, yet its effect is *prevented* by something extrinsic *after* activation. The requirement to retain B is satisfied, and the conditional linking the *retained* B + S to M is true (in the mask's absence). RCA thus incorrectly ascribes the disposition to the masked object.

  **4. The Core Asymmetry: When the Interferer Acts Relative to the Disposition's Activation**
  | Feature          | Fink (Electro)                 | Mask (Antidote)                | Why RCA Fixes/Doesn't Fix      |
  | :--------------- | :----------------------------- | :----------------------------- | :----------------------------- |
  | **Effect on B**  | **Destroys/Removes B** upon S. | **Leaves B intact & active.**  | Fixes: Requires B retention.   |
  | **Timing**       | **Before/Simultaneous with** M. | **After** B is triggered, **during** causal process to M. | Doesn't Fix: B retained; conditional true. |
  | **Target**       | The **existence** of B/D.      | The **causal output** of B+D.  | Fixes existence hole. Doesn't fix causal hole. |
  | **SCA Failure**  | False negative (disposition present but conditional false). | False negative (disposition present but conditional false). | |
  | **RCA Result**   | **Correctly** doesn't ascribe D (due to B loss). | **Incorrectly** ascribes D (B retained & S+B sufficient *ceteris paribus*). | |
  | **Vulnerability**| **Temporal Fragility** (D destroyed *by* S). | **Causal Interference** (D active but output blocked). | Patches fragility. Ignores interference. |

  **5. Does This Push Toward Dispositional Essentialism (DE)?**
  Bird argues yes, and the mask problem is central:
  *   **Primitiveness of Dispositions:** DE holds dispositions (powers) are irreducible fundamental properties. Mask cases show that reducing dispositions to conditionals (like RCA) fails because the conditional's truth depends on the *absence* of masks – which is itself a dispositional notion ("the absence of masking conditions"). This risks circularity.
  *   **Masking as Fundamental:** For DE, masking is a fundamental feature of how powers interact. A power *can* be present and triggered but fail to manifest due to the interfering power of another object (the antidote). RCA tries to reduce this to non-dispositional conditionals and fails.
  *   **"Would Cause" is Dispositional:** RCA's appeal to "S and B *would cause* M" smuggles in dispositional/causal notions. What grounds this counterfactual? For DE, it's grounded in the essential, irreducible dispositions of B and the relevant causal partners. RCA doesn't *eliminate* dispositions; it presupposes them.

  **6. Possible Patches to CA (Without Abandoning Conditionals)?**
  Conditionalists haven't surrendered. Strategies focus on strengthening the *ceteris paribus* clause:
  1.  **"No Masks Present" Clause:** Add "...and no masking conditions are present." *Problem:* Circularity. What is a "masking condition"? It's something that prevents a disposition from manifesting. This defines dispositions partly in terms of the absence of things that prevent dispositions.
  2.  **"Manifestation-Enabling Circumstances" Clause:** Add "...and circumstances are suitable for the manifestation." *Problem:* Vagueness/Circularity. What counts as "suitable"? Likely defined as circumstances where the disposition *would* manifest if triggered – again, dispositional.
  3.  **Finkish/Mask-Proof Causal Bases (Lewis, later):** Suggest some dispositions have bases whose very nature makes them immune to finks/masks. *Problem:* Ad hoc, doesn't cover all dispositions (like fragile glass), and masks seem always possible in principle.
  4.  **Hierarchy of Powers (Vetter):** Analyze masks as dispositions of *higher orders*. The poison has D1 (to kill). The antidote has D2 (to mask D1). *Problem:* While descriptively useful, it doesn't *reduce* D1 to non-dispositional conditionals; it just adds more dispositions. The conditional analysis for D1 *still* needs to account for the possible presence of D2.

  **Conclusion:**
  The asymmetry between finks and masks stems from a fundamental difference: **Finks destroy the disposition *in response to* the stimulus, while masks allow the disposition to be triggered but block its output.** Lewis's RCA successfully patches the temporal fragility exploited by finks by requiring the retention of the intrinsic causal basis (B) throughout the causal process. However, it fails against masks because masks leave B intact and active; the RCA conditional linking the *retained* B and S to M remains true *in the mask's absence*, and RCA lacks the resources to exclude extrinsic interferers operating *after* activation.

  This gap *does* provide a strong argument for dispositional essentialism (Bird). Masking appears to reveal an ineliminable dispositional residue – grounding the truth of counterfactuals like those in RCA seems to require irreducible dispositions or powers. While conditionalists propose further patches (like "no masks" clauses), these struggle with circularity or vagueness. The mask problem suggests that dispositions might be ontologically prior to, rather than analyzable in terms of, counterfactual conditionals.
