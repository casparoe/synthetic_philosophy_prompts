answer: |-
  Your struggle cuts to the heart of moral philosophy and psychology, and your frustration is completely understandable. The tension you describe—between seeing behavior as determined by history versus holding someone accountable—isn't a flaw in your thinking; it's grappling with one of humanity's oldest unresolved questions: **free will vs. determinism**. Here's how to navigate this:

  ### Key Insights from Your Situation:
  1. **The Pattern is Real (and Validated):**  
     Your brother's behavior *is* deeply patterned, rooted in family dynamics where he was cast as the "difficult child." The therapist confirms this. His failed attempts to change suggest his struggles aren't from lack of desire, but possibly from ingrained neural pathways, emotional blocks, or self-fulfilling beliefs. Like a muscle he never developed, "showing up" may feel neurologically or emotionally inaccessible on many days.

  2. **Your "Reliability" is Also Conditioned:**  
     Recognizing that your own dependability stems from positive reinforcement ("rewarded for competence") is profound. This doesn’t diminish your efforts, but it complicates the idea that you "choose" virtue while he "chooses" failure. Both behaviors emerge from adaptive strategies formed early in life.

  3. **The Unanswerable Question:**  
     Your friend’s question—*"When do we stop being products of circumstance?"*—has no clean answer. Neuroscience suggests **all decisions are influenced by biology and history**. Yet society (and our emotions) demand accountability. This is the crux of your anguish.

  ### A Practical Framework: Responsibility as Response-Ability
  Instead of seeing responsibility as a metaphysical "free choice," reframe it as **practical agency**: the ability to *respond* to circumstances, even within constraints. This shifts the focus from blame to problem-solving:

  - **For Your Brother:**  
    His history explains his behavior but doesn’t negate your mother’s needs. He may never "choose" reliably, so:
    - Assign concrete, limited tasks matching his *current* capacity (e.g., "Handle pharmacy pickups every Tuesday" instead of open-ended care).
    - Use external supports (e.g., paid caregivers) where he’s inconsistent.  
    *This isn't excusing him—it's protecting your mother (and yourself) from the fallout of his limitations.*

  - **For Yourself:**  
    Acknowledge your conditioning, but own your *present* choices:  
    - You can **choose** to set boundaries ("I cannot cover your shifts last-minute").  
    - You can **choose** to seek therapy to unpack resentment.  
    - You can **choose** to redefine "dependability" so it doesn’t consume you.  
    Your history may explain your impulse to over-function, but you retain agency to modulate it.

  ### Why Anger and Blame Still Have a Place (But Not the Only Place)
  - **Anger as Information:** Your frustration signals a real injustice—**unequal labor**. This deserves acknowledgment, not dismissal. Even if his behavior is "caused," the impact on you and your mother is material.  
  - **Blame as Social Tool:** Society uses blame to enforce norms. If your brother faces no consequences, the imbalance persists. Practical accountability (e.g., "If you cancel, you arrange backup") is fair.  
  - **But Compassion as Corrective:** Recognizing his struggle lessens *existential* blame ("He’s evil/lazy") while upholding *practical* accountability ("Your actions have consequences").

  ### The Troubling Truth You’ve Nailed
  You’re right: **We never fully escape being "products" of our past.** Biology, trauma, and upbringing constrain our capacities. Yet we also inhabit a society that requires mutual responsibility. The solution isn’t choosing between determinism or free will—it’s holding both realities in tension:

  1. **Compassionate Pragmatism:**  
     "Your struggles are real, brother, and so are Mom’s needs. Since you can’t provide consistent care, here’s how you can contribute financially/logistically instead."  
  2. **Focus on Impact, Not Intent:**  
     Judge actions by their consequences, not their origins. His cancellations harm your mother regardless of *why* they happen.  
  3. **Redirect Your Energy:**  
     Invest less in diagnosing his "responsibility" and more in building systems that work *despite* his limitations (respite care, sibling contracts, professional help).

  ### Final Thought
  **What makes someone "deserve" blame or credit isn’t metaphysical freedom, but their engagement with their own constraints.** Your brother avoids his; you confront yours. That engagement is where "responsibility" lives. You can’t force him into that space, but you can insist his choices have practical repercussions—while tending to your own conditioned need to overextend. This isn’t about who is "right," but how to care for your mother (and yourself) amidst imperfect human beings shaped by an imperfect past. The work is hard precisely because it matters so much.
