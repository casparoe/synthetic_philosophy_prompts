  My aunt worked as an ICU nurse and OPO coordinator for almost 30 years and had zero patience for people who said DCD donors "aren't really dead yet" when they're wheeled back for organs a few minutes after the heart stops. Last month she died by that exact pathway herself -- massive stroke, but not brain-dead by whole-brain criteria, so no DBD, just withdrawal of care, heart stops, wait a few minutes, declared dead, off to the OR. My uncle (her husband, no medical backround at all) has been quietly telling people "they took her too soon," because her circulation had only permanently stopped at that point, not irreversibly -- nobody was about to try ECMO on her, but in principle it might've worked, and that permanent-vs-irreversible gap is literally the thing she spent decades explaining to nervous families. I'm a bioethics PhD student (so this whole situation is extremely on the nose) and I got asked to give the eulogy, like 5 minutes, at the funeral this weekend. A few of her old OPO coworkers are coming and will clock it immediately if I fudge the concepts, but most of the room is just sad family, some of who are now side-eyeing my uncle. Can you write it -- something honest to what she actually believed, that doesn't turn into a bioethics lecture, and doesn't just leave my uncle's comment hanging there awkwardly.
