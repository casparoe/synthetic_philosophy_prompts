  ## The Self-Immolation of Genius: Tolstoy's Theory and the Torching of His Own Masterpieces

  Tolstoy's late-career treatise, *What Is Art?*, reads like a philosophical auto-da-fé, where the author gleefully throws his own towering achievements – *War and Peace* and *Anna Karenina* – onto the pyre alongside Shakespeare, Beethoven, and Wagner, condemning them as "bad art." This act of radical self-repudiation isn't merely eccentric; it's the logical, albeit devastating, endpoint of a theory meticulously constructed to serve a religious and social agenda already fixed in Tolstoy's mind. Understanding the "machinery" of this theory – the "infection" concept, the triad of individuality/clarity/sincerity, and the separate "goodness" test – reveals not only how Tolstoy justified his iconoclasm but also the profound flaws that render the theory ultimately unsustainable, sacrificing artistic complexity on the altar of moral absolutism.

  **The Mechanics of Infection:**

  Tolstoy defines art not by beauty, form, or skill, but by its function: **communication of feeling.** Genuine art, for him, is an act of **"infection."** The artist experiences a feeling, embodies it in a work (words, sounds, images), and transmits that *specific* feeling to the audience. The success of this transmission hinges on three interdependent qualities determining the **strength** of the infection:

  1.  **Individuality:** The feeling conveyed must be **unique and personal** to the artist. It shouldn't be a generic or borrowed sentiment, but something freshly experienced and deeply felt. A cliché feeling produces a weak infection.
  2.  **Clarity:** The feeling must be expressed with **utmost precision and accessibility**. The medium must be transparent, allowing the feeling to pass unimpeded from artist to receiver. Obscurity, ambiguity, or excessive complexity muddies the transmission.
  3.  **Sincerity:** This is the linchpin. The artist must **genuinely feel** the emotion *while* creating the work. Artifice, calculation, or emotional detachment breaks the circuit. The audience intuitively senses this lack of authentic feeling, preventing true infection.

  **The "Goodness" Gauntlet: Universal Brotherhood vs. Elite Entertainment:**

  Passing the infection test qualifies a work as *art*, but not necessarily as *good* art. Tolstoy imposes a separate, decisive moral criterion: **the nature of the feeling transmitted.** Good art, he argues, transmits feelings that promote the **"union of man with man and with God,"** specifically feelings of **universal brotherhood grounded in Christian love.** Crucially, this "good" feeling must be accessible to *everyone*, transcending class, education, and culture. Art that transmits feelings exclusive to a privileged elite, that reinforces social divisions, or that serves merely to entertain or astonish the wealthy is not just inferior, but actively harmful.

  **Applying the Machinery to Tolstoy's Own Fiction:**

  Here's where the guillotine falls:

  1.  **Infection Test (Passing?):** *War and Peace* and *Anna Karenina* undoubtedly possess immense **individuality** (Tolstoy's unique vision of history, psychology, and society). Their **clarity** is debatable – while psychologically penetrating, their sheer scale, intricate plotting, and philosophical digressions arguably violate Tolstoy's late demand for crystalline simplicity. Most damningly, in Tolstoy's late view, they likely fail **sincerity**. He came to see his earlier masterpieces as products of artistic ambition, aristocratic vanity, and intellectual pride – emotions incompatible with the humble sincerity demanded by his theory. The complex motivations of his characters (ambition, lust, jealousy, existential despair) were feelings he now deemed unworthy or insincerely explored without the lens of religious morality.
  2.  **Goodness Test (Failing):** This is the fatal blow. Tolstoy categorizes the feelings explored in his epics – aristocratic striving, romantic passion, philosophical doubt, the horrors of war experienced by the elite, the nuances of high-society betrayal – as fundamentally **elitist**. They are feelings comprehensible primarily to the educated upper classes. They do not transmit the simple, universal feeling of Christian love and brotherhood accessible to a peasant. They entertain and provoke the sophisticated, but fail to unite *all* people across class lines. They are, by his definition, art for the "dissolute rich," not for humanity.

  **Theory or Rationalization? The Verdict on the Machinery:**

  While Tolstoy builds an intricate framework, the conclusion feels preordained by his radical religious conversion. The machinery *is* largely dressing up a conclusion already handed to him. The theory is meticulously calibrated to valorize the simple, morally unambiguous, universally accessible folk tales and religious parables (like the two stories he spared) that embodied his late ethos, while condemning the complex, psychologically rich, socially embedded art he himself had mastered.

  **Does the Theory Collapse? A Clear Verdict:**

  **Yes, Tolstoy's theory collapses under its own weight.** While it identifies crucial elements of artistic power (sincerity *is* vital, art *can* unite), its rigid, reductive structure fails to account for the true complexity and value of art:

  1.  **The Tyranny of "Goodness":** Reducing art's value solely to the promotion of a single, specific moral feeling (Christian brotherhood) is brutally prescriptive. It dismisses art that explores the full, often dark and conflicted, spectrum of human experience – precisely the territory of *Anna Karenina* and *War and Peace*. Can art that profoundly examines jealousy, despair, or the absurdity of war not be "good" because the feeling isn't *immediately* unifying? Tolstoy's answer is a dogmatic "no."
  2.  **The Vagueness of the Triad:** "Individuality," "clarity," and especially "sincerity" are nebulous and subjective. How is "sincerity" measured, especially across time? Tolstoy retroactively denied it in his own work based on his *later* beliefs. His dismissal of Beethoven and Shakespeare based on perceived insincerity or lack of clarity feels more like personal bias than objective critique.
  3.  **The False Dichotomy of Accessibility:** Tolstoy conflates *immediate, universal accessibility* with *universal value*. Great art often *does* transcend its initial context or audience. *War and Peace*, though rooted in aristocracy, explores themes of love, death, history, and free will that resonate far beyond its class origins. Accessibility evolves; complexity isn't inherently elitist. The theory ignores art's power to *cultivate* understanding, not just transmit pre-existing, simple feelings.
  4.  **The Rejection of Craft and Complexity:** By prioritizing pure "infection" of feeling above all else, the theory dismisses the value of formal innovation, structural complexity, and intellectual depth – the very qualities that make his own novels masterpieces. It elevates didactic simplicity over artistic exploration.

  **Conclusion:**

  Tolstoy's machinery in *What Is Art?* is a fascinating, deeply personal, but ultimately flawed construct. It provides the *mechanics* for his self-immolation: by defining "good art" as the simple, sincere transmission of feelings of universal Christian love accessible to all, he could logically condemn his own complex, psychologically nuanced, socially specific epics as failed infections of elitist sentiment. However, the theory collapses because it imposes an impossibly narrow moral straitjacket on art, relies on vague and subjective criteria, mistakes immediate accessibility for universal value, and dismisses the profound worth of complexity, ambiguity, and formal mastery. While his crisis about art's purpose resonates – especially for your novelist narrator wrestling with meaning – Tolstoy's solution sacrifices the vast, challenging, and often morally ambiguous landscape of true artistic greatness on the altar of a rigid, post-conversion dogma. He disowned his masterpieces not because the theory objectively proved them bad, but because the theory was designed to reach precisely that conclusion, proving only the power of a brilliant mind to rationalize its own profound contradictions. His genius as a novelist ultimately exposes the poverty of his theory.
