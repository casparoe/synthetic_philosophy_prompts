   - Supervaluationism: It preserves classical logic for statements that are settled (true in all branches) and also for tautologies. It allows for truth-value gaps for contingents. This is a well-known approach. Ordinary talk: It captures our intuition that we cannot say either way for a future contingent, but we can say disjunctions. However, it does not allow for the possibility that a future contingent might be true (or false) in an absolute sense now, but that might be acceptable.

   - Łukasiewicz: It has a third truth value. It breaks classical logic (excluded middle fails). Also, it's not clear how to handle nested modalities or conditionals. Ordinary talk: We are used to true/false, but we also use "maybe". However, the truth tables can be counterintuitive (e.g., the disjunction of two indeterminate statements is indeterminate, but we might want to say that "Either it will rain or it will not" is true).

