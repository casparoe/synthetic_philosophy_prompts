prompt: |-
  I'm a PhD student in philosophy of science, and this term our Friday reading group has been working through Bayesian confirmation theory -- we just finished the section on the "problem of old evidence" in Earman's *Bayes or Bust?*, using the standard example of Mercury's perihelion: the ~43 arcsec/century anomaly in its orbit that Newtonian mechanics couldn't explain but that dropped straight out of Einstein's field equations once he worked them out in 1915. Afterwards two people in the group, Reza and Ilana, got into an argument over drinks that turned into a real back-and-forth, and I can't referee it myself, so hoping you can.

  (1) Reza opened by saying the old-evidence case just refutes Bayesian conditionalization as a theory of confirmation, full stop: the community's credence in the perihelion data was already 1 (or near enough) decades before 1915, so conditionalizing on it literally cannot move anyone's credence in GR, and yet everyone agrees this was one of the most dramatic confirmations in the history of physics -- so the model gets its own field's most famous case exactly backwards. (2) Ilana said this moves too fast: what actually happened in November 1915 wasn't a change in anyone's credence in the perihelion data, it was the discovery that GR *entails* that exact number, so you should conditionalize on "GR entails E" rather than on E itself, and once you do that the confirmation shows up fine -- she said she thinks this is basically the standard "Garber" move here, though don't quote me on the name. (3) Rezas comeback was that this quietly gives up logical omniscience, the assumption baked into the whole conditionalization framework that an ideal agent already assigns credence 1 to every entailment among the propositions in their space -- and you don't get to just drop that and keep calling the result "conditionalization" without owing a totally new account of how learning a logical fact even works. (4) Ilana said that's a cost worth paying, since nobody serious thought real scientists were logically omniscient anyway, and everything else about the framework can stay as is. (5) Reza's last move was that it's not that cheap: if merely discovering that a theory entails already-known data is what does the confirming, then any theory you gerrymandered after the fact to entail that same data should get an identical boost, which seems to erase the distinction between GR's result and ordinary ad hoc curve-fitting -- and the only thing that seems to block that is some notion of how surprising or unforced the entailment is, which isn't a Bayesian notion at all.

  Neither of them budged, and honestly I go back and forth every time I retell it. Could you go through moves (1) through (5) and say who's got the better of it at each stage, not just who wins overall -- and flag anything you think both of them are missing? And then stand back for a second: given move (5), is there actually a way to rescue a Bayesian treatment of old evidence, or does the exchange show that whatever's doing the confirming in cases like this isn't Bayesian updating at all?
reasoning: |-
  Okay, let me start by unpacking this philosophy of science debate. The user is a PhD student dealing with a heated argument in their reading group about Bayesian confirmation theory and the problem of old evidence, specifically using Mercury's perihelion as a case study. They want me to referee the five moves between Reza and Ilana, assess who has the better point at each stage, and then step back to see if Bayesianism can be salvaged here.

  First, I need to recall the core issue. The problem of old evidence arises when evidence E (like Mercury's orbit anomaly) is already known, so its probability is 1. According to strict Bayesian conditionalization, learning E shouldn't change credence in a theory T. But historically, Einstein's GR got a huge confirmation boost from explaining this exact anomaly. That's the paradox.

  Looking at move (1): Reza claims this refutes Bayesianism because conditionalization can't handle cases where P(E)=1. He's right about the mathematical limitation—if E has probability 1, conditionalizing on it does nothing. And he's correct that this case is a major challenge to strict conditionalization. His point is strong here because it exposes a clear weakness in the standard model.

  For move (2): Ilana's Garber-style solution suggests conditionalizing on "T entails E" instead of E itself. This makes sense intuitively—scientists didn't learn new data; they learned a new logical relationship. I think Ilana has the better hand here because she addresses the actual historical event (Einstein's derivation) and offers a formal fix within the Bayesian framework. Her approach reflects what changed in 1915.

  Move (3): Reza counters that this abandons logical omniscience. He's technically correct—standard Bayesianism assumes agents know all logical truths. Ilana's move requires relaxing this assumption. But as Ilana notes in move (4), logical omniscience was always unrealistic. Her point is valid: if we want Bayesianism to model real scientists, we must drop this idealization. This seems like a reasonable trade-off, so Ilana still edges ahead.

  But move (5) is where it gets thorny. Reza argues that Ilana's solution can't distinguish between genuine theories (like GR) and ad hoc gerrymandered theories that just entail E. This is a serious problem because confirmation should require explanatory depth, not just logical entailment. Reza lands a solid blow here—Ilana's solution risks making confirmation too easy. Bayesianism struggles with this qualitative aspect of "surprising" entailments.

  Stepping back: Both miss that the issue might be deeper than conditionalization. The real problem may be that Bayesianism reduces confirmation to probability shifts, but cases like Mercury's perihelion involve appreciating theoretical virtues (unification, non-ad-hocness) that aren't captured by credence changes alone. Perhaps what made GR impressive was how naturally the anomaly emerged from its core principles—something Bayesian probabilities don't encode.

  As for rescuing Bayesianism: Hybrid approaches might help (e.g., including "surprise" via likelihood ratios), but they feel tacked on. The exchange suggests that while Bayesian tools can be patched to handle old evidence (via Garber-like moves), they still miss the essence of why some entailments confirm better than others. That distinction seems to live outside the Bayesian framework.
answer: |-
  Let's break down this excellent dialectic step-by-step, assessing each move and identifying overlooked nuances. I'll conclude with a broader verdict on Bayesianism's viability here. (Spoiler: Both have valid points, but the exchange exposes deep cracks.)

  ### Move-by-Move Analysis
  **Move (1): Reza's Opening Salvo**  
  *Claim:* Strict conditionalization fails because \( P(E) \approx 1 \) pre-1915, so \( P(T|E) = P(T) \), yet GR was massively confirmed by E.  
  **Assessment:** Reza is **largely correct** here. This *is* the core paradox: if evidence is fully "baked in" (credence 1), conditionalization mathematically *cannot* increase credence in T. The Mercury case is indeed a canonical counterexample to naïve Bayesianism.  
  *Overlooked:* Reza underplays that Bayesians *acknowledge* this as the "problem of old evidence" (POE) – it's a known challenge, not a silent killer. His "refutes full stop" overreaches; it refutes *strict* conditionalization without amendments.

  **Move (2): Ilana's Garber-Style Defense**  
  *Claim:* Scientists conditionalized on *"GR entails E"* (call this proposition L), not E itself. Since \( P(L) < 1 \) pre-discovery, \( P(GR|L) > P(GR) \).  
  **Assessment:** Ilana **wins this round**. This (Garber 1983, later refined by Jeffrey, Earman himself, and others) is the standard Bayesian escape hatch. It captures the historical moment: Einstein didn't *reobserve* Mercury; he *derived* E from GR. Formally, for non-omniscient agents, learning L *can* boost T even if \( P(E) = 1 \).  
  *Overlooked:* Ilana doesn't emphasize that \( P(L) \) must be *non-trivially less than 1* pre-discovery. If scientists already suspected GR entailed E, \( P(L) \) might be high, diminishing the boost. But in 1915, L was genuinely new.

  **Move (3): Reza's Logical Omniscience Counter**  
  *Claim:* Conditionalization assumes logical omniscience. Dropping it requires a new account of "learning logical facts" (e.g., Jeffrey conditioning? Belief revision?).  
  **Assessment:** Reza **scores decisively**. Logical omniscience *is* baked into standard conditionalization (Kolmogorov axioms imply \( P(A) = 1 \) for all logical truths A). Garber’s move *does* require a modified framework (e.g., "logical learning" models like Gaifman’s). Ilana can’t claim this is "standard conditionalization" without qualification.  
  *Overlooked:* Both miss that *all* Bayesian models idealize agents. The question is whether dropping omniscience is *more damaging* than, say, ignoring computational limits. Reza implies it’s catastrophic; Ilana sees it as a minor patch.

  **Move (4): Ilana's Pragmatic Reply**  
  *Claim:* Sacrificing logical omniscience is a worthy trade-off for modeling real scientists.  
  **Assessment:** Ilana **edges this**. Most contemporary Bayesians (e.g., Strevens, Weisberg) agree logical omniscience is untenable for epistemology of science. Real agents learn math/logic incrementally (e.g., Einstein struggled for years to derive E). The framework *can* be extended (e.g., assigning credences over logical propositions).  
  *Overlooked:* She doesn’t address *how* to formalize this. Merely saying "conditionalize on L" glosses over thorny issues: How does an agent set \( P(L) \)? What’s the sample space for logical discoveries? Reza’s demand for a "new account" isn’t frivolous.

  **Move (5): Reza's Gerrymandering Gambit**  
  *Claim:* If confirmation hinges on L, gerrymandered theories ad hoc designed to entail E get equal boosts, erasing the distinction from GR.  
  **Assessment:** Reza **lands a fatal blow**. This is the "tacking paradox" on steroids. Let T’ be GR + "and Mercury’s perihelion is 43 arcsec" – then \( P(T' \text{ entails } E) = 1 \), so learning L gives T’ the same boost as GR. Yet intuitively, GR is profoundly confirmed while T’ is ad hoc garbage. Bayesianism lacks resources to distinguish them without smuggling in non-Bayesian virtues (e.g., simplicity, non-ad-hocness).  
  *Overlooked:* Ilana could retort that *prior* probabilities handle this (\( P(GR) >> P(T') \) pre-L), but Reza preempts this: if the boost is identical, and priors are arbitrary, the *incremental* confirmation (likelihood ratio) is the same. Bayesians *need* a way to make \( P(L|T) \) higher for "natural" theories – which requires a notion of "intrinsic fit" or "explanatory centrality" alien to standard Bayesianism.

  ### Who "Wins" Overall?
  - **Dialectically:** Ilana wins moves (2) and (4) – her Garber-style solution *is* the best Bayesian fix, and dropping logical omniscience is defensible.  
  - **Philosophically:** Reza wins moves (1), (3), and crucially (5). His gerrymandering objection shows that even *if* Bayesianism technically "saves the phenomena" (by making confirmation *possible*), it fails to capture *why* GR’s confirmation was so compelling (its *non*-ad-hoc, unifying explanation).  
  - **Net verdict:** **Reza has the stronger case.** The POE isn’t just a technical glitch; it reveals Bayesianism’s blindness to *theoretical context* in confirmation. GR wasn’t confirmed *merely* because it entailed E; it was confirmed because E emerged *naturally* from its core principles, resolving a decades-old anomaly. Bayesianism flattens this into a credence shift.

  ### Can Bayesianism Be Rescued? A Way Forward?
  The exchange suggests **Bayesianism cannot fully capture old-evidence confirmation without external help**. Still, hybrid approaches exist:
  1. **"Ur-Prior" Maneuvers:** (e.g., Howson 1985) Pretend you never learned E, revert to a pre-E "ur-prior," then conditionalize on E. But this is psychologically fictional and vague on choosing ur-priors.  
  2. **Likelihood-Focused Fixes:** Shift focus to the *likelihood ratio* \( \frac{P(E|T)}{P(E|\neg T)} \). For GR, \( P(E|\neg T) \) (chance of E without GR) was *very low* given failed Newtonian fixes, while \( P(E|T) \approx 1 \). This avoids POE since likelihoods don’t require \( P(E) < 1 \). But \( P(E|\neg T) \) is often ill-defined.  
  3. **Non-Propositional Learning:** (e.g., Jeffrey conditioning) Treat "learning L" as changing *credences over logical space*, not propositional belief. Still struggles with gerrymandering.  

  **Ultimate Verdict:** The Mercury case shows that **Bayesian updating is insufficient alone**. What made GR’s confirmation "dramatic" was:  
  - The *surprising fit* between a *deep, unifying* theory and an *intractable* anomaly.  
  - The *explanatory asymmetry*: GR *made sense* of E, while ad hoc theories merely appended it.  
  Bayesianism quantifies credence shifts but cannot distinguish profound entailments from trivial ones. To rescue it, you’d need to:  
  - Add a theory of *theoretical virtues* (simplicity, unification) as prior constraints.  
  - Formalize "explanatory centrality" – e.g., E is "expected" under T iff T’s *core* (not tacked-on parts) entails it.  
  But these steps import non-Bayesian elements. **The POE suggests that confirmation is not *just* about probabilities; it’s about *why* a theory entails evidence.** That "why" remains Bayesianism’s blind spot.  

  *Recommendation for your group:* Read Glymour’s "Why I Am Not a Bayesian" (1980) for the anti-Bayesian view, and Earman’s later work on weighing solutions. The debate isn’t settled, but Reza’s skepticism is well-founded. Einstein’s triumph over Mercury may be Bayesianism’s Waterloo.*
