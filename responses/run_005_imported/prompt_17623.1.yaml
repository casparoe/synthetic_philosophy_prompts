  We are faced with a decision on how to implement a predictive algorithm for our transitional-care program. The goal is to flag recently discharged patients who are at high risk for readmission within 30 days, so that we can offer them a beneficial home-nursing visit. Due to limited capacity, only about 20% of patients can be enrolled. 

  The challenge: Our data shows that Medicaid patients are readmitted at nearly three times the rate of commercially insured patients, largely due to disparities in access to outpatient care. This creates a tension in setting a threshold for the risk score. We have two proposals:

  1. **Insurance-blind threshold (single threshold for all):** Use one risk threshold for all patients, regardless of insurance type. The risk score is calibrated to predict the actual probability of readmission.

  2. **Separate thresholds by insurance type:** Set different thresholds for Medicaid and commercially insured patients so that the false negative rate (missed cases) and false positive rate (false alarms) are equal across groups.

  **Key considerations:**
  - **False positives (FP):** Flagging a patient who would not be readmitted. This wastes a visit that could have gone to someone else, but the patient still receives a beneficial visit (though they might not need it as much).
  - **False negatives (FN):** Not flagging a patient who would be readmitted. This withholds help from someone who could have benefited, which is a more serious error because it denies care to a patient in need.

  Given that the program is a benefit and the harm of a false negative (withholding help) is greater than that of a false positive (wasting a visit), we must prioritize reducing false negatives, especially in the group that is more vulnerable.

  **The committee's split:**
  - Half the committee favors the insurance-blind threshold because it treats every patient equally by the same standard of predicted risk. This approach ensures that the flag "high risk" means the same predicted probability of readmission for every patient, regardless of insurance.
  - The other half favors separate thresholds to achieve equal error rates (both FPR and FNR) across insurance groups. This would address the disparity in baseline risk and might lead to more equitable outcomes in terms of who gets the benefit.

