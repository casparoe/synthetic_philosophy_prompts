  4. **Fairness Perspective:** The insurance-blind approach is consistent with the principle of allocating resources based on need (predicted risk). It does not explicitly use insurance status to determine who gets the benefit, but because insurance is correlated with risk, it indirectly helps the more vulnerable group.

  **The Strongest Argument for Separate Thresholds:**
  The primary argument for setting separate thresholds by insurance type is to achieve equal error rates, particularly equal false negative rates. This would mean that the chance of missing a patient who will be readmitted is the same for both Medicaid and commercially insured patients. Given that the harm of a false negative (withholding help) is the same for any patient, it is argued that it is unfair for one group to have a higher chance of being missed. In our example above, the false negative rate for commercial was 40% and for Medicaid 16.7% - which seems to disadvantage commercial patients. Setting separate thresholds would adjust for the baseline risk difference and make the false negative rate (and/or false positive rate) equal. For instance, we might set a lower risk threshold for commercial patients to catch more of their true positives, even if they are at a lower absolute risk than some Medicaid patients who are above the Medicaid threshold. This approach is motivated by the idea of equalizing the opportunity to receive the benefit, regardless of group membership.

  **Why I do not recommend separate thresholds:**
  While the goal of equalizing error rates is laudable, it comes at a cost. By setting a lower threshold for commercial patients, we might flag some commercial patients who are at lower risk than some Medicaid patients who are not flagged (because they are just below the higher Medicaid threshold). This would mean that a commercial patient with a risk score of, say, 15% might be flagged while a Medicaid patient with a risk score of 20% might not be. This violates the principle of targeting the highest risk. It would result in fewer total true positives (i.e., fewer readmissions prevented) because we are diverting resources to lower-risk commercial patients instead of higher-risk Medicaid patients. Given the scarcity of resources, we should aim to prevent as many readmissions as possible. Moreover, the separate thresholds approach might be seen as explicitly using insurance status to determine the threshold, which could raise ethical and legal concerns.

  **Conclusion:**
  We recommend the insurance-blind threshold to maximize the overall impact of the program and to ensure that the resource is allocated to the patients at the highest risk of readmission. We will implement a single risk threshold set to flag the top 20% of patients by predicted risk. We will closely monitor the program for equity, paying particular attention to the false negative rates in both groups and the representation of Medicaid patients. If we find that the false negative rate in the commercial group is unacceptably high, we might consider increasing the program capacity or improving the model, but we should not compromise on the principle of targeting the highest risk.

