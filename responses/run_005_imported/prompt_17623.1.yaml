  **MEMORANDUM**

  To: Committee Members  
  From: [Your Name]  
  Date: [Current Date]  
  Subject: Recommendation on Implementation of Risk Score for Transitional-Care Program  

  As we prepare to vote on the implementation of the predictive algorithm for our transitional-care program, I offer the following recommendation and rationale. The goal is to flag high-risk patients for home-nursing visits, with capacity to enroll only 20% of discharged patients. Our data shows that Medicaid patients have a much higher readmission rate than commercially insured patients, largely due to disparities in outpatient care. 

  **Recommendation:**  
  I recommend using a single, insurance-blind threshold on a calibrated risk score. This approach will flag the top 20% of patients with the highest predicted risk of readmission, regardless of insurance type.

  **Implementation Plan:**  
  1. **Model Calibration:** The risk score will be calibrated to predict the probability of 30-day readmission. We will use all relevant clinical and social factors to build the model. (Note: We will decide in a separate meeting whether to include insurance as a feature, but the threshold will be set without regard to insurance.)  
  2. **Threshold Setting:** We will rank all patients by predicted risk and set a single threshold to flag the top 20%.  
  3. **Monitoring:** We will track:  
     - The proportion of flagged patients by insurance type.  
     - The false negative rate (missed readmissions) and false positive rate (unnecessary visits) for each insurance group.  
     - The actual readmission rates for flagged and non-flagged patients by group to ensure calibration.  
     We will review these metrics quarterly and adjust the model or program as needed.

  **Strongest Argument for Separate Thresholds:**  
  Proponents of separate thresholds by insurance type argue that it would equalize the false negative rates between Medicaid and commercially insured patients. This would ensure that the chance of missing a patient who will be readmitted is the same for both groups. Given that the harm of a false negative (withholding help) is the same for any patient, they contend that it is unfair for one group to have a higher chance of being missed. This approach aims to achieve equity in the distribution of errors.

  **Why We Recommend Against Separate Thresholds:**  
  While the goal of equalizing false negative rates is important, it would come at the cost of reducing the overall effectiveness of the program. Setting a lower threshold for commercial patients would divert resources to patients at lower absolute risk than some Medicaid patients who are not flagged. This would result in fewer prevented readmissions overall. The insurance-blind approach maximizes the program's impact by targeting the highest-risk patients. Additionally, we expect that Medicaid patients will be overrepresented in the high-risk group, which is appropriate given their higher baseline risk. 

  We believe the insurance-blind threshold is the most clinically coherent and effective approach. It ensures that "high risk" means the same level of predicted risk for every patient and allocates our limited resources to those who need them most.

  I urge the committee to support this recommendation.

