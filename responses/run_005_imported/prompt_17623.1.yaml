answer: |-
  ### MEMORANDUM  
  **To:** Transitional-Care Program Committee  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Risk-Score Threshold Strategy for Transitional-Care Enrollment  

  ---

  ### **Recommendation**  
  I recommend implementing a **single insurance-blind threshold** for the risk score, calibrated to predict true readmission probability. This approach prioritizes targeting the *highest-risk patients across all groups*, maximizing the clinical impact of our limited transitional-care resources. Under this model:  
  - The top 20% of patients with the **highest predicted readmission risk** (regardless of insurance) will be flagged.  
  - Medicaid patients will naturally comprise a larger share of flagged cases due to their higher baseline risk (3× readmission rate), aligning resource allocation with clinical need.  

  ### **Implementation Plan**  
  1. **Model Calibration:**  
     - The data team will ensure the risk score is **calibrated to predict true 30-day readmission probability** (e.g., a score of 0.25 = 25% chance of readmission).  
     - Insurance status may be included as a model feature *only if it improves accuracy* by capturing unmeasured social determinants (e.g., access barriers). However, the **threshold will not vary by insurance type**.  

  2. **Threshold Setting:**  
     - Post-discharge, all patients will be ranked by risk score.  
     - The top 20% of the entire cohort (highest to lowest risk) will be flagged for enrollment.  

  3. **Equity Safeguards:**  
     - **Monitor outcomes quarterly:** Track readmission rates, false negatives (missed high-risk patients), and false positives (low-risk enrollees) stratified by insurance.  
     - **Adjust capacity if feasible:** If data show persistent disparities in false negatives (e.g., under-flagged high-risk Medicaid patients), advocate for program expansion.  

  ### **Strongest Argument for Separate Thresholds**  
  Proponents of separate thresholds by insurance type argue that matching error rates (e.g., equal false negative rates) ensures **procedural fairness**:  
  - **Core concern:** A blind threshold may yield a higher *false negative rate* for commercially insured patients (since their baseline risk is lower). This could deny care to some high-risk individuals in this group while disproportionately flagging Medicaid patients.  
  - **Moral rationale:** If the harm of a false negative (withheld help) is equal across groups, fairness demands equal likelihood of being flagged when *actually* high-risk—even if absolute risk differs.  

  ### **Why I Recommend Against Separate Thresholds**  
  While the argument for procedural fairness is valid, **separate thresholds introduce greater risks**:  
  1. **Clinical Inequity:**  
     - A lower-risk commercially insured patient (e.g., 15% readmission risk) could be flagged while a higher-risk Medicaid patient (e.g., 20% risk) is not, violating the principle of allocating scarce resources to those in greatest need.  
     - **Example:** With separate thresholds, we might flag commercial patients at ≥15% risk and Medicaid at ≥25%. This risks excluding a Medicaid patient at 24% risk to include a commercial patient at 15%—even though the former is objectively higher-risk.  

  2. **Operational and Ethical Risks:**  
     - **Stigmatization:** Explicitly using insurance status to set thresholds may appear discriminatory, eroding trust.  
     - **Efficiency Loss:** Diverting visits to lower-risk patients reduces overall readmissions prevented. Given capacity limits, we must maximize impact.  

  3. **Blind Thresholds Address Disparities Proactively:**  
     - Because Medicaid patients have higher baseline risk, they will represent >20% of flagged cases (e.g., 30–40%), directly addressing inequities in access.  
     - **False negatives in low-risk groups:** While commercially insured patients may experience higher false negative *rates*, their lower baseline risk means fewer *absolute* missed cases. Monitoring will ensure no group is systematically excluded.  

  ---

  ### **Conclusion**  
  The insurance-blind threshold prioritizes clinical impact and allocates resources to the patients at greatest risk, while passive overrepresentation of Medicaid patients redresses known disparities. Though separate thresholds aim for procedural parity, they risk misallocating care and exacerbating inequities. I urge the committee to endorse a single threshold and commit to rigorous equity monitoring.  

  **Vote recommendation:** Adopt the insurance-blind threshold.
