  First, I need to break down the two scenarios. In the first dispute, the friend chose a guaranteed $60,000 over a gamble with a small chance of nothing. In the second, she chose a lower probability but higher reward option when both choices had high chances of nothing. The user mentioned that no single utility function explains both choices. The friend's explanation is about aversion to losing a sure thing versus taking a risk when nothing is likely anyway.

  I recall that standard Expected Utility Theory (EUT) would require consistent utility values. Let me calculate the expected utilities. For the first choice, the guaranteed $60k has utility U(60k). The gamble has 0.12*U(300k) + 0.83*U(60k) + 0.05*U(0). Since she chose the sure thing, U(60k) > that gamble. For the second choice, she preferred 0.12*U(300k) over 0.17*U(60k). So 0.12*U(300k) > 0.17*U(60k). 

  These inequalities conflict unless U(300k) is much larger than U(60k), but the first choice suggests U(60k) is high relative to U(300k). Specifically, the math shows that U(300k) would need to be over 1.4 times U(60k) from the second choice, but the first choice implies it should be less. So EUT can't reconcile both without changing utilities, which she claims she didn't.

  Next, Prospect Theory comes to mind. The key elements here are reference points and loss aversion. In the first scenario, the sure $60k is a gain relative to the status quo (no settlement). Giving that up for a risk that includes a 5% chance of nothing feels like a loss. Loss aversion makes that 5% chance of zero feel worse than its probability suggests. Hence, she avoids the gamble.

  In the second scenario, both options are framed as gains but with high chances of nothing. Since the status quo is zero, she's not losing anything. The overweighting of small probabilities might make her prefer the 12% chance for $300k, as the higher reward is more appealing despite lower probability. This explains her switch in risk preference based on framing.

  Other theories like rank-dependent utility or regret theory could also apply. Rank-dependent might overweight the worst outcome in the first scenario, making the 5% chance of zero seem more significant. In the second scenario, since both have high chances of zero, the focus shifts to the best outcome. Regret theory might involve her anticipating regret if she gave up the sure thing and got nothing, which isn't a factor in the second scenario.

  The user's deeper needs include understanding if their friend's choices are irrational or if existing frameworks can accommodate them. As a PhD student, they might be exploring how well different theories handle real-life deviations from EUT. They also might want to discuss this in academic contexts, so providing a comprehensive analysis of multiple theories is valuable.

  I should also address the philosophical aspect: is this rational? Under EUT, it's inconsistent, but under descriptive models like Prospect Theory, it's predictable. Normatively, it depends on whether we accept that reference points and loss aversion are rational. Some argue that minimizing regret or emotional toll is rational, especially in personal contexts. So, while not instrumentally rational in a strict EUT sense, it might be ecologically rational given human psychology.

