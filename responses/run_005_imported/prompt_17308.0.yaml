answer: |-
  Your friend's choices present a fascinating case study that challenges strict Expected Utility Theory (EUT) but finds coherent explanation within several modern descriptive frameworks, particularly **Prospect Theory (PT)**. Here's a breakdown of the rationality question through major decision-theoretic lenses:

  ### 1. **Expected Utility Theory (EUT): The Inconsistency**
     - **The Problem:** EUT requires choices to maximize expected utility based on a *single*, stable utility function U(·) over outcomes.
     - **Analysis:**
       - *Choice 1 (Guaranteed $60k vs. Gamble):*  
         She preferred U($60k) > [0.12 × U($300k) + 0.83 × U($60k) + 0.05 × U($0)]  
         Simplifying: **U($60k) > 0.12 × U($300k) + 0.05 × U($0) + 0.83 × U($60k)**  
         → Subtract 0.83 × U($60k) from both sides:  
         **0.17 × U($60k) > 0.12 × U($300k) + 0.05 × U($0)**  
         → If we assume U($0) = 0: **0.17 × U($60k) > 0.12 × U($300k)**  
         → **U($300k) < (0.17/0.12) × U($60k) ≈ 1.42 × U($60k)**
       - *Choice 2 (17% of $60k vs. 12% of $300k):*  
         She preferred 0.12 × U($300k) > 0.17 × U($60k)  
         → **U($300k) > (0.17/0.12) × U($60k) ≈ 1.42 × U($60k)**
     - **Conclusion:** The inequalities **directly contradict** each other under EUT. No single utility function rationalizes both choices if U($0) = 0. Even if U($0) < 0, the contradiction persists unless U($0) is implausibly negative.

  ### 2. **Prospect Theory (Kahneman & Tversky): Coherent Explanation**
     - **Core Mechanisms:** 
       - **Reference Dependence:** Utility is defined over *gains/losses* relative to a reference point.
       - **Loss Aversion:** Losses hurt more than equivalent gains.
       - **Probability Weighting:** Small probabilities are overweighted, moderate/large ones underweighted.
     - **Analysis:**
       - *Choice 1:*  
         - **Reference Point = $0 (status quo).**  
         - Guaranteed $60k is a *sure gain*.  
         - The gamble risks a *loss* (5% chance of $0, which feels like losing $60k relative to the sure thing).  
         - **Loss aversion** makes the 5% chance of $0 feel devastating. The sure gain is preferred.
       - *Choice 2:*  
         - **Reference Point = $0 (status quo).**  
         - Both options are *risky gains* with high chances of $0. No sure thing to "lose".  
         - **Probability weighting:** Low probabilities (12%, 17%) are *overweighted*. The 12% chance for $300k feels subjectively larger than 12%, while 17% for $60k feels smaller than 17%.  
         - The *ratio* of potential gains ($300k/$60k = 5) dominates the slightly better probability (17%/12% ≈ 1.42). The overweighted 12% chance for the larger prize wins.
     - **Conclusion:** PT explains both choices naturally. The key is the **shift in reference point** and the **presence/absence of a potential loss** in Choice 1.

  ### 3. **Other Frameworks: Alternative Explanations**
     - **Rank-Dependent Utility (RDU):** 
       - Overweights *extreme outcomes* (best or worst). 
       - *Choice 1:* Overweighting the 5% worst outcome (getting $0) makes the gamble unattractive. 
       - *Choice 2:* Overweighting the best outcome ($300k) makes it preferable despite lower probability. 
     - **Regret Theory:**
       - *Choice 1:* Choosing the gamble and getting $0 would cause massive regret ("I gave up $60k for nothing!").
       - *Choice 2:* No salient source of regret (neither option had a sure thing to regret passing up).
     - **Security-Potential/Aspiration Theory:**
       - *Choice 1:* The $60k satisfies a "security" need (avoiding disaster).
       - *Choice 2:* With security unattainable, she focuses on "potential" (maximizing upside).

  ### Is This Rational?
  - **Instrumental Rationality (EUT):**  
    Strictly, **no**. Her choices violate the independence axiom (consistency across gambles with shared outcomes). She can be "Dutch-booked" via cleverly constructed compound choices.
    
  - **Ecological Rationality (PT/RDU):**  
    **Yes, contextually.** Her choices reflect deeply human psychological responses to risk:
    - **Loss Aversion:** Protects against catastrophic setbacks (e.g., needing funds for medical bills post-injury).
    - **Probability Weighting:** Sensible when small probabilities are salient or ambiguous (e.g., legal outcomes).
    - **Framing:** The *description* of options matters ("sure thing" vs. "long shot among long shots"). This isn't irrational if the frame alters perceived welfare.

  - **Normative Critique:**  
    If she truly values $300k < 1.42 × $60k in one context and >1.42× in another *solely due to framing*, this is a cognitive bias. However, if the disputes carried different emotional stakes (e.g., injury vs. wages) or liquidity needs, differing utilities could be justified.

  ### Philosophical Implications
  Your friend’s intuition—that the *context* of risk matters—highlights limitations of orthodox EUT:
  1. **Reference Points Matter:** Welfare isn’t evaluated in a vacuum. A "sure thing" creates a new reference point that transforms risk into potential loss.
  2. **Rationality as Ecological:** PT shows that "biases" can be adaptive. Avoiding small risks of ruin (Choice 1) and chasing high upside when ruin is likely anyway (Choice 2) often aligns with biological and economic survival.
  3. **Formalization vs. Phenomenology:** Her description captures the *experience* of decision-making better than EUT. Formal models must account for this to avoid being normatively inert.

  ### Conclusion
  Her choices are **descriptively rational** (explained by PT/RDU) but **instrumentally irrational** (violating EUT axioms). Whether this constitutes a "genuine failure" depends on your normative commitments:
  - **EUT Purist:** Yes, she should correct her "inconsistent" preferences.
  - **PT Advocate:** No, her preferences reflect how humans *actually* experience value under risk, and forcing EUT consistency may misrepresent welfare.
  - **Pragmatist:** Her choices are ecologically rational in context. Coherence should be sought across *meaningfully similar* decisions, not abstractly across all gambles.

  For your work, this case underscores the need for models incorporating **reference dependence** and **affective responses to risk**—especially in high-stakes, real-world decisions where the "utility" of avoiding despair or regret isn't captured by money alone.
