prompt: |-
  Last spring my grandmother made me promise that I would keep her rose garden alive after she died, and I have kept that promise ever since. In my philosophy class we read T. M. Scanlon's expectation-based account of promissory obligation from *What We Owe to Each Other*, on which breaking a promise is wrong principally because it defeats an expectation that one has intentionally and voluntarily led another person to form. This account seems to face a serious difficulty in my case: my grandmother no longer exists to have her trust betrayed or her expectations disappointed, yet it seems exactly as wrong for me to let the roses die now as it would have been while she was alive. Please argue, on Scanlon's behalf, that his expectation-based framework can fully accommodate the continuing bindingness of promises made to people who have since died — engaging with the strongest form of this objection rather than dismissing it too quickly, and without quietly importing independent rule-based or virtue-based considerations that have nothing to do with defeated expectations.
reasoning: |-
  Okay, the user presents a philosophical dilemma about promissory obligations to deceased individuals, specifically challenging T.M. Scanlon's expectation-based account. They've made a promise to their grandmother to maintain her rose garden after her death, and now question how Scanlon's framework—which centers on not defeating intentionally induced expectations—can explain why breaking this promise remains wrong when the promisee no longer exists to experience disappointment.

  Hmm, this is a sophisticated objection. The user clearly understands Scanlon's theory well and has identified its apparent weakness regarding posthumous promises. Their emotional stake in the rose garden promise adds depth—this isn't just academic but relates to personal loss. They want Scanlon defended rigorously, without smuggling in non-expectation elements like rules or virtues.

  First, I should acknowledge why this case seems problematic for Scanlon: if wrongness comes from disappointing actual expectations, a dead person can't be disappointed. But the user feels the obligation persists undiminished. The strongest version of their objection would note that even if others know about the promise, the core wrong was specifically to grandmother, yet she can't experience betrayal now.

  Scanlon's best defense probably lies in his broader view of expectations as social structures. In *What We Owe to Each Other*, he emphasizes how promises create normative positions—not just psychological states in individuals. When we promise, we invite others to rely on us in ways that reshape relationships and obligations. 

  For posthumous promises, the key might be that the expectation was created while the promisee lived, and its normative force extends beyond their death because the promisor's intentional act established an ongoing duty. Letting the roses die wouldn't just disappoint grandmother's past self; it retrospectively violates the trust she placed while alive, damaging the value of what was shared. 

  Also worth considering: Scanlon might argue that the promisee's reasonable expectations include arrangements lasting beyond their lifetime. Grandmother didn't just expect compliance while she breathed; she trusted the user to sustain the garden as a continuing commitment. The wrongness now lies in betraying that temporal extension of trust.

  The user might counter that this still avoids the core issue—how can you "betray" someone who doesn't exist? Here Scanlon could pivot to the relational damage: promises create moral bonds whose violation stains the past relationship. Letting the roses die makes it true that grandmother's trust was misplaced all along, which is a present harm to the meaning of her past act.

  This defense must stay strictly within expectation-based logic. No sneaking in "duty to the dead" as an independent moral rule. The focus should stay on how promises generate expectations with inherent temporal scope, and how violating them retroactively poisons the original act of trust.
answer: |-
  Here is a defense of Scanlon's framework against your powerful objection, grounded strictly in his expectation-based principles and engaging its strongest form:

  1.  **Reframing the "Defeated Expectation": From Present Psychological State to Retrospective Normative Position:** Scanlon's core principle (Principle F, §7.5) focuses on the *reasonableness* of the expectation created by intentionally invoking the *institution* of promising. The wrongness isn't *solely* about causing present disappointment in a conscious mind *at the moment of breach*. It's about **defeating the normative position the promisor intentionally created for the promisee *through* the promise.** When you made the promise to your grandmother, you intentionally placed her in a specific normative position: she was entitled to rely on your future performance. Her death doesn't erase the historical fact of that normative relationship *she occupied* while alive. Breaking the promise now **retroactively defeats the very entitlement you conferred upon her *then*.** It makes it true that the assurance you gave her – the normative position you created for her – was ultimately invalid. The wrong is to the *trust she placed in you during her life*, making that trust retrospectively misplaced.

  2.  **The Temporal Scope of Reasonable Expectations:** A crucial aspect Scanlon emphasizes is that the reasonableness of the expectation depends on the *content* of the promise and the *context* in which it was made. When your grandmother extracted the promise about the rose garden "after she died," the **very content of the promise explicitly created an expectation intended to persist beyond her lifetime.** It was reasonable for her, *at the time of promising*, to form the expectation that you would keep the garden alive *specifically after her death*. This wasn't an expectation limited to her conscious lifespan; it was an expectation *about future states of affairs* that would occur after she was gone. Her reliance on you included reliance on your performance *during that future period*. Breaking the promise now defeats *that* specific, temporally extended expectation she reasonably formed based on your voluntary assurance.

  3.  **The "Intentional Invitation to Rely" and its Enduring Moral Consequences:** Scanlon argues the wrong stems from "intentionally... inviting another to form an expectation" and then defeating it (WWOTEO, p. 306). You intentionally invited your grandmother to rely on your future care for the roses *after her death*. By making that promise, you assumed a moral burden tied to that future act. Her death doesn't dissolve the moral significance of that deliberate invitation. **Failing to perform now means you retrospectively failed the specific reliance you knowingly and voluntarily induced.** You exploited the institution of promising to gain her trust (or peace of mind) concerning a future she wouldn't witness, without fulfilling the resulting obligation. This violates the principle of due regard for others' expectations that Scanlon sees as foundational.

  4.  **Addressing the Strongest Objection: "No One is Harmed Now":** The strongest form of your objection is that since your grandmother no longer exists, she cannot *experience* betrayal, disappointment, or harm. Therefore, no expectation *belonging to a presently existing person* is defeated. Scanlon's reply would be that **the morally relevant "harm" or "defeat" is not the *felt experience* of disappointment, but the *violation of the normative relationship established at the time of the promise*.** The wrong is located in the *breach of the duty* you freely undertook *towards her*. Her death prevents her from *experiencing* the disappointment, but it doesn't change the fact that you are *violating the duty you owed specifically to her* by defeating the reliance you intentionally induced. The moral residue of that broken commitment remains, even if the original promisee cannot feel its sting. It renders the promise itself, and the trust it embodied, null.

  5.  **Why it's Still Specifically Wrong *to Her* (Not Just to Others or Yourself):** One might argue the obligation persists only because others know you promised, or because of your own integrity. Scanlon's framework avoids this. **The enduring wrong is directly *to the promisee*, your grandmother, because it concerns the *specific normative position you created for her and her alone*.** While others might *observe* the breach, and your character might suffer, the core wrong identified by Scanlon is the defeat of *the expectation she was entitled to form based on your word*. Letting the roses die makes it true that *her* trust, placed in you during her life regarding this specific future act, was broken. The relational bond of trust created *between you and her* is damaged retrospectively.

  **Conclusion from Scanlon's Perspective:**

  Scanlon can argue that his expectation-based framework *does* fully accommodate posthumous promises. The key is shifting focus from the promisee's *present psychological state* (which ceases at death) to the *normative position* intentionally created by the promisor *during the promisee's life*. When a promise explicitly concerns performance after the promisee's death, the reasonableness of the expectation formed *at the time of promising* inherently includes reliance on that future performance. Breaking the promise defeats *that* specific, invited reliance. It retroactively invalidates the assurance given and violates the duty assumed towards the promisee when the promise was made. The wrongness persists not because of rules, virtues, or effects on others, but because of the enduring moral significance of defeating the trust intentionally invoked in a specific individual through the act of promising itself, regardless of whether they live to witness the breach. Your obligation to the roses remains binding because failing them now would be a fundamental betrayal of the trust your grandmother placed in you *then*, defeating the expectation *you led her to form* about *this exact future*.
