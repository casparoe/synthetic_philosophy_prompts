  First, I need to break down each exchange between Denise and Marcus. Denise argues that species concepts are arbitrary because taxonomists change classifications based on hunches. She points to the flycatcher example where they were split in 1989 and lumped back in 2023, claiming nothing changed but the labels. Marcus counters that this is science self-correcting with new evidence. Then Denise brings up the Cassia Crossbill, which was split based on vocal differences alone, questioning why vocal differences mattered there but not for the flycatchers. Marcus explains it's about reproductive isolation in contact zones. Denise rebuts with the Mallard and American Black Duck hybridizing but still being considered separate species, showing inconsistency.

  The user wants a move-by-move analysis of each argument and who had the better point. They also want to know if there's something both are missing about the species concept itself. I should assess each exchange based on ornithological principles. 

  For the first exchange, Marcus is more correct. The lumping of the flycatchers was based on genetic, vocal, and physical evidence showing no consistent differences in contact zones, which is a valid application of the biological species concept. Denise's view oversimplifies the process as arbitrary when it's actually evidence-based.

  On the Cassia Crossbill, Marcus is again stronger. The split was due to consistent vocal differences and behavioral isolation despite sympatry, supported by genetic studies. Denise's comparison to the flycatcher is flawed because the crossbill maintains isolation where they overlap, unlike the flycatchers.

