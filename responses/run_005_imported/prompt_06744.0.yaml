    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```

  A sentence or two of justification after the JSON would be welcome, though I would like the JSON itself to reflect a genuine ranking rather than a diplomatic tie between everything. And since I spent my career around statistical mechanics, I am well aware that this is a different question from whether quantum theory makes nature itself indeterministic, so I would ask that you keep the ranking to the logical and metaphysical merits of each position on its own terms, rather than importing considerations from physics.
