  I need to assess if the Sadistic Conclusion is more defensible. Proponents might argue that adding lives below the critical level doesn't contribute positively, so avoiding them is better, even if it means some suffering. Critics would say this violates the principle of not preferring suffering. Also, the critical level itself is arbitrary, which is a problem.

