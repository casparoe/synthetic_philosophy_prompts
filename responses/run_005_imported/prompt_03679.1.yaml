  First, I need to recall Kim's argument clearly. Causal closure means every physical event has a sufficient physical cause. Non-overdetermination says events aren't typically caused twice. So if a mental event causes a physical one, but there's already a physical cause, mental causation is redundant or excluded. Kim targets non-reductive physicalism, which says mental properties aren't reducible to physical ones. Reductive physicalists might avoid this by saying mental states are identical to physical states, so no overdetermination. 

  The user’s point is valid: all physicalists accept closure, so why isn't everyone affected? The key is in how different theories handle the relationship between mental and physical properties. Non-reductive physicalists (like property dualists under physicalism) see mental properties as distinct but dependent on physical bases. Here, when a mental property M causes a physical effect P, there's already a physical cause P* for P. So M seems excluded. 

  But reductive physicalists, like identity theorists, say mental states just are physical states. So when M causes P, it's the same as P* causing P. No overdetermination. That's why they're untouched. 

  Also, emergentists might have different takes, but Kim targets non-reductive views. The user might not realize that physicalism isn't monolithic. Different branches interpret mental causation differently. The user's friend is right that only non-reductive physicalists are the main target. 

  The user's deeper need might be understanding the nuances in physicalist positions. They might feel that philosophers are avoiding the argument, but actually, it's about how each theory's framework addresses the exclusion problem. Clarifying the distinctions between reductive and non-reductive physicalism is crucial here. Also, explaining why identity theory avoids overdetermination by equating mental and physical causes. 

  I should check if there are other responses like compatibilist approaches or realization physicalism, but the main point is the reductive vs. non-reductive split. Emphasizing that accepting closure doesn't automatically lead to exclusion if mental properties are seen as identical or realized in a way that doesn't compete. 

  The user's background as an electrician might appreciate analogies. Maybe comparing it to electrical systems where the same current can be described at different levels without overdetermination. But the response already uses the spark plug example, which is good. 

  Also, addressing their suspicion that some philosophers ignore logic. It's not about ignoring but differing premises on overdetermination or identity. Non-reductive theorists might accept systematic overdetermination or deny that mental causes are distinct. But Kim argues that's implausible. 

