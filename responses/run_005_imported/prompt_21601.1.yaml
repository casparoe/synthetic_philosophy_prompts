answer: |-
  ## MEMORANDUM  
  **TO:** Fund Risk Committee & General Membership  
  **FROM:** [Your Name], Risk Committee  
  **SUBJECT:** Proposed Staking Policy - Balancing Growth & Robustness  
  **DATE:** [Current Date]  

  ---

  ### **I. Core Principles & Acknowledged Concerns**  
  We recognize two valid perspectives:  
  1.  **The Kelly Argument:** Maximizing long-run geometric growth is mathematically optimal *if* edge and odds are known precisely. Last semester’s success demonstrates its power.  
  2.  **The Uncertainty Argument:** Our estimated edge ("p") is inherently noisy, especially in prediction markets. Full-Kelly sizing is fragile to overestimation and can lead to catastrophic drawdowns ("going to zero").  

  **Neither side is "wrong."** The disagreement stems from differing weight given to model uncertainty. Kelly is optimal *within* a model; our challenge is *model risk*.  

  ---

  ### **II. Recommended Staking Policy**  
  **General Rule: Fractional Kelly with Position Caps & Uncertainty Discounts**  
  *   **Base Sizing:** `Position Size = f * (bp - bq) / b`  
      *   `b` = Net Odds (e.g., Decimal Odds - 1)  
      * `p` = Our Estimated Probability of Winning  
      * `q` = 1 - p (Estimated Probability of Losing)  
      * `f` = **Fractional Multiplier (Proposed: f = 0.25)**  

  *   **Why f=0.25 (1/4 Kelly)?**  
      *   **Robustness:** Dramatically reduces drawdown risk (e.g., full Kelly drawdowns can exceed 50%; 1/4 Kelly rarely exceeds 15%) while preserving ~75% of the growth potential of full-Kelly under accurate `p` (Ed Thorp, William Poundstone).  
      *   **Edge Uncertainty:** Implicitly assumes our `p` estimate has a ~50% margin of error – a prudent buffer for noisy real-world estimates.  
      *   **Behavioral:** Mitigates the psychological impact of large losses, preserving capital and committee cohesion.  

  *   **Absolute Position Cap:** **5% of Bankroll.**  
      *   Applies *after* fractional Kelly calculation.  
      *   Prevents single positions (even high-conviction/low-`b` ones) from dominating the portfolio.  
      *   Addresses the "go to zero" fear explicitly.  

  *   **Prediction Market Discount:** **Apply an additional 50% haircut (f_effective = 0.125) for Kalshi/Event Contracts.**  
      *   *Rationale:* Edge (`p`) estimation is significantly harder here than in systematic equity strategies (backtested data, clearer factors). Odds (`b`) are often efficient. This acknowledges greater model uncertainty.  

  ---

  ### **III. Addressing Both Sides**  
  *   **To the "Math" Side:**  
      *   This *is* mathematically grounded. Fractional Kelly maximizes the utility function `U(W) = W^(1-f)` for `0<f<1`, explicitly trading off growth (`f=1`) for security (`f=0`).  
      *   It preserves the *geometry* of compounding. We target long-run growth, but robustly.  
      *   A 25% fraction captures most growth (concave region of return vs. risk) while avoiding the dangerous convexity of near-full Kelly sizing under uncertainty. (See Fig 1 below).  
  *   **To the "Go to Zero" Side:**  
      *   The 1/4 fraction and 5% cap directly limit maximum loss exposure.  
      *   The prediction market haircut explicitly weights the fuzziness of edge.  
      *   This policy prioritizes *survival* first, optimal growth *second* – a necessity when capital is finite and irreplaceable.  

  **Figure 1: Simplified Return vs. Risk vs. Kelly Fraction**  
  ```
  Expected Growth Rate
      ^
      |                     * (Full Kelly - Max Growth)
      |                    /
      |                   /
      |                  /
      |-----------------* (f=0.25 - Robust Optimum)
      |                /
      |_______________/________________________> Risk (Drawdown/Vol)
      0                                       
  ```

  ---

  ### **IV. Implementation & Rationale**  
  1.  **Systematic Equity Book:** `Size = min( 0.25 * Kelly, 5% of Bankroll )`  
      *   *Why:* Edges are based on backtests with quantifiable uncertainty. Kelly framework is well-suited.  
  2.  **Prediction Market Book:** `Size = min( 0.125 * Kelly, 5% of Bankroll )`  
      *   *Why:* Edges are often qualitative, situational, and harder to quantify. Requires a larger uncertainty discount.  
  3.  **Bankroll Definition:** Liquid Net Asset Value (NAV), reviewed monthly.  
  4.  **Reporting:** Traders must document `p` and `b` estimates for each position for committee review and post-trade analysis.  

  ---

  ### **V. Why This Isn't "Just Log Utility"**  
  We acknowledge the philosophical debate: maximizing long-run growth *is* a specific risk preference (aversion to ruin). However, for a collective fund with finite capital, irreversible losses, and a mandate to *persist*, it is the *operationally rational* choice. Fractional Kelly implements this preference *conservatively* by prioritizing robustness to our own estimation errors. A flat 2% rule ignores opportunity cost and edge differentiation; full-Kelly ignores model risk. This policy balances both.  

  ---

  ### **VI. Recommendation**  
  Adopt the **Fractional Kelly Policy (f=0.25 base, f=0.125 for prediction markets) with a 5% position cap** as the official staking policy. This:  
  1.  Respects the mathematics of compounding growth.  
  2.  Explicitly accounts for model uncertainty and estimation error.  
  3.  Provides clear, differentiated rules for different strategies.  
  4.  Limits catastrophic risk while capturing significant upside.  
  5.  Offers a defensible, non-arbitrary compromise grounded in decision theory.  

  **Vote to adopt this policy.**  

  ---  
  *Appendix Available:* Simplified sizing table examples, references (Thorp, Poundstone, Peters, Mauboussin re: uncertainty).  
  *Draft for Vote: [Date of Vote]*
