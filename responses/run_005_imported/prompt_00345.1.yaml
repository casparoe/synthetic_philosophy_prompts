prompt: |-
  So I spent my career doing bench chemistry, and I always figured I had a decent handle on Bayesian reasoning from analyzing experiemental data. But I recently stumbled into this "problem of old evidence" thing in Bayesian epistemology and it's been bugging me. The classic case is Mercury's perihelion precession -- that data had been sitting around for decades before Einstein came up with GR, and everyone agrees GR deserves a ton of credit for explaining it. But if the evidence was already known (so P(E) is basically 1), how can conditionalizing on it ever raise your credence in the theory? Can you walk me through why this is actually a deep problem and not just a technical quirk, and maybe sketch how people like Garber or Jeffrey try to wriggle out of it?
