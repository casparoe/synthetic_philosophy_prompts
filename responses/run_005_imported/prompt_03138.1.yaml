answer: |-
  ## Diner Debate: Trout, Turkey, and the Troubles of Togetherness

  **Setting:** A slightly worn but cheerful diner. Vinyl booths, chrome accents. STEVE (Universalist, late 30s, slightly rumpled tweed jacket over a band t-shirt) is picking at a massive turkey club. AMARA (Organicist, early 40s, sharp blazer, nursing a coffee) has a half-eaten trout plate in front of her. Rain streaks the window.

  **Steve:** (Gesturing at Amara's trout with a french fry) Still can't believe you ordered the trout. After all those sessions on *Material Beings*? Doesn't staring at a dead fish on a plate just scream "problem case" for your view? When *exactly* did it stop being a living organism and become... dinner? Was it the moment the hook pierced its jaw? When its gills stopped moving on the boat? When the chef filleted it? Seems like a textbook vagueness generator to me, Amara. Van Inwagen’s kryptonite.

  **Amara:** (Smirks, pushing the plate slightly away) Nice try, Steve, but you’re confusing cessation with constitution. *This* (taps the plate) is a collection of simples *formerly* arranged trout-wise, undergoing rapid decomposition. The *life* – the self-sustaining, immanent causal processes that made it an organism – ceased. The precise moment of death *is* tricky epistemically, maybe even metaphysically fuzzy at the absolute boundary, but *that* fuzziness doesn’t infect the *existence* question van Inwagen cares about.

  **Steve:** Oh, come on! How does that help? Let’s say it *is* vague exactly when the trout died. Doesn’t that make it vague whether the simples *right now* compose something (a dead trout) or just lie there (trout-parts)? Van Inwagen says dead things aren’t *composite* objects in the relevant sense – they’re just simples arranged corpse-wise. So, if it’s vague *when* it became a corpse, it’s vague *when* composition ceased! Therefore, vague how many objects were on the boat, vague how many are on your plate *now*? Voila! Vagueness in the number of concrete particulars! Van Inwagen’s supposed reductio against Contact and Fastening applies right here to his precious "life"!

  **Amara:** (Leans forward, intense) No, Steve. You’re conflating two things. First, the ontological *category* shift: living organism to aggregate of simples. That shift *happened*. Second, the *temporal boundary* of that event. The fuzziness is about *when* a clear-cut change occurred, not *whether* it’s a clear-cut change. Van Inwagen’s point is that for Contact, the *condition itself* (being in contact) doesn’t specify a *joint in nature*. Contact is just a relation; it doesn’t create a new kind of causal unity. Life *does*. It’s a fundamental, objective, natural discontinuity. The simples participating in a life *are* caught up in a distinctive, self-maintaining causal network. That network either exists or it doesn’t. Its *emergence* or *dissolution* might have fuzzy temporal boundaries, but the *state* of being alive is not a vague *property* in the way ‘being in contact enough to count as one object’ is. The vagueness attaches to the *transition*, not to the *existence* of the composite *during* the life.

  **Steve:** (Takes a large bite of his turkey club, talks while chewing slightly) Fine, fine. Transition vagueness vs. state vagueness. But what about the *edges*? What about viruses? Prions? Are they alive? What about a slime mold – one amoeba? A colony? What about Terry Schiavo? Was she an organism *right up until* the plug was pulled? Or had the essential causal unity already frayed? If your answer is "It’s complicated, biologists debate it," then guess what? You’ve got vagueness *in the criterion itself*! It’s not just "when does life start/stop?" but "what *counts* as life?" That seems *exactly* like the problem with "what counts as *enough* contact or fastening?" Your joint in nature looks suspiciously arbitrary and blurry under a microscope.

  **Amara:** Biologists debate the *definition*, Steve, because biology is messy and operational definitions are useful. But van Inwagen isn’t offering a *definition* for biologists. He’s pointing to a fundamental *metaphysical category*: entities whose parts are unified by engaging in immanent causation – activities directed *at* the persistence of the whole *by* the whole. *That* phenomenon is real and distinct. Viruses lack intrinsic metabolism; they hijack it. Prions are just misfolded proteins causing havoc. A coma patient’s organs are still functionally integrated, sustained by internal processes, even if consciousness is gone. The zygote question *is* hard, but the *process* of development exhibits a clear trajectory *towards* that distinctive causal unity from the moment of fertilization. The *phenomenon* is sharp enough metaphysically, even if our epistemic access or linguistic classifications sometimes stumble. Contrast that with "fastened": glued? nailed? taped? velcroed? There’s *no* underlying natural kind there, just a continuum of increasing stickiness!

  **Steve:** (Grins, wipes mayo from his chin) Okay, Professor, let’s grant you your precious "life" joint for argument's sake. But look at this! (He holds up his turkey club – thick layers of turkey, bacon, lettuce, tomato, bread). According to *me*, there’s at least *three* objects here Steve didn't order: this delicious entity, *and* the mereological sum of the top bread slice and this piece of turkey, *and* the sum of the bacon and the tomato. According to *you*, only *one* composite object exists here – Steve. Because *I'm* alive. The sandwich is just simples arranged sandwich-wise. Right?

  **Amara:** (Nods cautiously) Correct. Only organisms are composite material objects. The sandwich is an aggregate.

  **Steve:** Excellent. Now, watch closely. (He picks up the top slice of bread with one hand and a piece of turkey with the other). Behold! The Turkey-Bread Slice Fusion! (He holds them close together). According to Universalism, this sum – this *thing* composed of *just* this bread slice and this piece of turkey – existed a second ago when they were part of the sandwich, exists now as I hold them, and will exist even after I eat them (as parts of Steve!). It’s a perfectly good object. It just has wildly disconnected temporal parts! It’s scattered now, was unified in the sandwich, will be unified again inside me. You, Amara, deny this bizarre entity exists at all. You think the only composite object involving this bread and turkey is *me*, once I digest them. But tell me, honestly, isn’t my view *simpler*? No special conditions! Composition just *always* happens! No worrying about life, consciousness, fastening, or... (he gestures dismissively at her trout)...dead fish ontology. Just sets and their members, all the way down. Lewis had it right: it’s a different *sense* of 'object'. The Trout-Turkey is weird, but it’s no weirder than negative numbers or curved space. We get used to it. Your organicism forces you to deny the existence of perfectly intelligible, causally inert sums like my Turkey-Bread Slice Fusion. Isn’t *that* the bigger bullet to bite?

  **Amara:** (Sips coffee, eyes gleaming) Simpler? Maybe ontologically parsimonious in *one* way – only one rule. But Steve, your ontology is *ludicrously* overpopulated! Every arbitrary gerrymandered fusion, every momentary coincidence, every scattered monstrosity like the sum of my left shoe and the Andromeda Galaxy *right now* – you grant them all equal ontological standing as *composite material objects* alongside you, me, and that trout *when it was alive*! That’s not simplicity; it’s profligacy! It completely severs the concept of a "material object" from any coherent notion of unity, cohesion, or causal integration. Van Inwagen’s point is that *only* life provides the *right kind* of unity to warrant saying composition occurs. Your Turkey-Bread Slice Fusion has *no unity* beyond spatial proximity *at some times* and being parts of *me* at others. It’s a mereological accident, not a thing. Denying its existence isn’t biting a bullet; it’s good metaphysical hygiene. We *should* be restrictive about composition. The cost of your "simplicity" is an ontology utterly disconnected from our fundamental ways of understanding and interacting with the world. Life *is* the joint because it marks where genuine, intrinsic unity emerges from the chaos of simples. Your universalism dissolves all joints into dust.

  **Steve:** (Chuckles, pushing his empty plate away) Hygiene, huh? Feels more like pruning reality to fit human intuitions. But... (he taps the table thoughtfully) ...point taken about the disconnect. Maybe Lewis was too quick to dismiss the 'queerness' of the Trout-Turkey. Still... (He eyes her trout plate again) ...I’ll sleep better tonight knowing my ontology includes that magnificent, if short-lived, Turkey-Bread Slice Fusion. And I still think van Inwagen’s "life" joint is leakier than he admits. Slime molds await your seminar paper, Amara. They await.

  **Amara:** (Smiles, signaling for the check) And gerrymandered fusions await your defense, Steve. Good luck explaining why *that* (she points to his plate) isn’t a fundamental object alongside you. The debate continues. Pass the ketchup? This metaphysical warfare is hungry work.
