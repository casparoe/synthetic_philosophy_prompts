answer: |-
  You've put your finger on the *exact* core tension in the supervaluationist response to fatalism, and your intuition that there's a significant departure from classical logic is widely shared by critics. Here's a breakdown:

  1.  **The Supervaluationist Claim:** Your friend is correct that supervaluationism *formally preserves* classical tautologies and validities *at the level of super-truth*. Specifically:
      *   **Super-Truth:** A statement is **super-true** (true *simpliciter*) iff it is true in *all* histories in the model. Super-false iff false in all histories. Indeterminate (neither) iff true in some histories and false in others.
      *   **The Disjunction "P v ~P":** For any future contingent `P` ("Sea battle tomorrow"), `P v ~P` is true in *every single possible history*. In histories where the battle happens, `P` is true. In histories where it doesn't, `~P` is true. Therefore, `P v ~P` is true in *all* histories.
      *   **Therefore:** `P v ~P` is **super-true**. The Law of Excluded Middle (LEM) holds *at the level of super-truth*.

  2.  **Your Intuition (The Core Problem):** Your objection hits the nail on the head:
      *   For a future contingent `P`, on the day before:
          *   `P` is **not** super-true (indeterminate).
          *   `~P` is **not** super-true (indeterminate).
      *   Yet, `P v ~P` **is** super-true.
      *   **This violates the classical understanding of disjunction.** Classically, for a disjunction `A v B` to be true, at least one disjunct (`A` or `B`) must be true. Here, neither `P` nor `~P` is super-true, yet their disjunction *is* super-true.

  3.  **The Sleight of Hand? Distinction?** The supervaluationist relies on a crucial distinction:
      *   **Truth *simpliciter* (Super-truth) vs. Truth *in a history*.**
      *   They argue that classical logic governs **truth *simpliciter*** (super-truth). At this level, LEM holds (`P v ~P` is always super-true).
      *   They concede that **truth *in a history*** (the truth value relative to a specific complete future) behaves classically: within any *single* history, `P` is either true or false, and `P v ~P` is true *because* one disjunct is true *in that history*.
      *   **The Gap:** The "sleight of hand" you perceive is the introduction of a level of semantic evaluation (truth *simpliciter*) where a disjunction can be true even though *neither* disjunct possesses that level of truth (super-truth). They *define* truth *simpliciter* in a way that severs the classical, compositional link between the truth of a disjunction and the truth of its disjuncts *at that same level*.

  4.  **What Has Been Preserved? What Has Been Lost?**
      *   **Preserved:** The set of **valid formulas and inferences** of classical logic. Every classical tautology (like `P v ~P`) is super-true. Every classically valid argument form (like Modus Ponens) preserves super-truth.
      *   **Lost (or Modified):** The **classical semantics for the connectives** at the level of truth *simpliciter*. Specifically:
          *   **Disjunction (`v`):** `A v B` can be super-true without either `A` or `B` being super-true.
          *   **Conjunction (`&`):** `A & B` can be super-false without either `A` or `B` being super-false (if `A` is true in some histories and `B` false in those, while `B` is true in histories where `A` is false).
          *   **Negation (`~`):** `~A` is super-true iff `A` is super-false. This holds, but the crucial point is that `A` can be *neither* super-true nor super-false.
          *   **Bivalence:** The principle that every meaningful statement is either true or false is explicitly abandoned for future contingents. Truth *simpliciter* has three possible statuses: super-true, super-false, indeterminate.

  5.  **Is Your Friend "Wrong"?**
      *   **Formally/Technically:** Your friend is *technically correct* that the *system* validates all classical tautologies and inference rules *when "true" means super-true*. Supervaluationism is a *conservative extension* of classical logic in terms of validities.
      *   **Philosophically/Substantively:** You are *absolutely correct* that this preservation comes at the cost of abandoning core classical *semantic principles* governing how the truth values of compounds are determined by the truth values of their parts *at the same level of evaluation*. The classical compositional semantics is modified. Many philosophers (like Timothy Williamson, Graham Priest) argue that abandoning bivalence and the classical semantics for connectives *is* a significant departure from the *spirit* of classical logic, even if the validities are formally preserved. The disjunction *feels* like it shouldn't be true if neither disjunct is determinately true.

  **Conclusion:**

  Your friend is **formally correct** that supervaluationism preserves classical *validity* and declares `P v ~P` to be super-true. However, your intuition that this involves a **substantial departure from classical semantic principles** (bivalence and the classical truth-functional definitions of the connectives, especially disjunction) is **well-founded and widely acknowledged as the major cost of the supervaluationist approach.** The disjunction is true *because* it's true in every possible world/history, *not* because one of its disjuncts is true *simpliciter* today. Whether this counts as "preserving classical logic" depends heavily on whether one prioritizes the preservation of validities or the preservation of the classical compositional semantics. Your skepticism is philosophically legitimate.
