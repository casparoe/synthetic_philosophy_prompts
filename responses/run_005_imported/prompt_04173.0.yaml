  (1) Theo says Dana's partial reading makes her blurb dishonest because aesthetic judgments require full experience. That seems fundamentally correct - you can't claim a book is "fully realized" if you haven't experienced its full realization. Score +1 (strong but not perfect).

  (2) Dana compares blurbs to restaurant recommendations. But this analogy fails because blurbs are presented as personal evaluations, not hearsay. When I say "this restaurant is incredible," it implies I've tried it. Score -1 for Dana here.

  (3) Theo nails the distinction: blurbs lack the implicit "I heard" framing of recommendations. The first-person presentation is the core issue. That's airtight logic. +2 for Theo.

  (4) Dana points to critics who echo consensus. But there's a difference between synthesizing existing discourse and fabricating personal judgment. Her example actually supports Theo's point about framing. Score -2 for this weak defense.

  Now for the bigger picture: both miss how aesthetic judgments function. Theo overlooks that all criticism involves interpretation, not just raw experience. Dana ignores how institutional roles create different truth obligations - a blurb's purpose is promotion, but it still needs ethical boundaries. The literary ecosystem runs on these tensions between experience, testimony and institutional roles.

  The user's skin in the game makes this personal - they've written blurbs themselves. Underneath the philosophy question, they're probably wrestling with professional guilt. I should acknowledge that blurbs exist in a gray area between criticism and marketing, where partial truths are normalized but still ethically shaky.

  My closing thought: Dana violated the implicit contract of blurbs (personal reading as basis for judgment), but Theo's absolutism misses how all criticism builds on collective frameworks. The solution isn't purity tests, but clearer signaling about what blurbs actually represent.
