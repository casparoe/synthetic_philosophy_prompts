  First, I need to recall the key points of each philosophical theory. The etiological approach, championed by Neander and Millikan, ties function to evolutionary history—natural selection. A trait's function is what it was selected for. On the other hand, Cummins' causal-role theory defines function by what a trait does within a system, regardless of its history. 

