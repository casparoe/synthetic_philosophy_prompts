  Moreover, Neurath himself admitted that Isotype isn't perfect and can be revised. But the marketing pitch emphasized its objectivity and universality. That overselling might contradict the boat metaphor's emphasis on perpetual revision. The user might be pointing out that Neurath didn't fully reconcile these aspects in practice. 

