prompt: |-
  A friend of mine works remotely for a company based elsewhere and just got a raise, but she's not sure it means much. She lives in a smallish town that has absorbed a lot of well-paid remote workers like her over the past several years, and local wages, rents, and everyday prices have all risen sharply along with them, to the point that her raise may not buy her any more than her old salary did. And yet the town doesn't feel poorer to her—there is visibly more building, more employment, more general bustle than five years ago, even though the same stock of real goods should, on paper, just be chasing a bigger pile of dollars. She's asked me whether the town is actually better off or whether this is some kind of collective illusion, and while I've seen the phrase "money illusion" thrown around on economics blogs, I don't think it actually settles the question. What's the right way to think this through?
reasoning: |-
  Okay, let me try to unpack this user's question. Their friend lives in a small town that's seen an influx of remote workers. Even though she got a raise, the increased local costs mean her real income might not have improved. Yet the town seems more prosperous—more construction, jobs, activity. The user wonders if this is real or just "money illusion."

  First, I need to recall what money illusion is. It's when people mistake nominal price changes for real ones. But here, it's more complex. The town's economy is transforming, so nominal rises might reflect real growth. 

  Looking at the key elements: higher rents and prices due to increased demand from remote workers. That suggests real changes. These workers bring in outside money, boosting local demand. Businesses expand, creating jobs. So the visible growth—construction, bustle—isn't just inflation; it's real economic activity.

  But the friend's situation is different. Her raise might not keep up with local inflation, so her purchasing power could be stagnant. That's a redistribution effect. Remote workers gain, while locals without remote salaries might struggle. 

  I should explain both aggregate and individual perspectives. The town's overall wealth increases because of the inflow of external money. New businesses and jobs add to real output. However, distribution matters. Some benefit more, others less. The friend might be treading water despite her nominal raise.

  Also, considering Baumol's cost disease makes sense. Services like cafes can't easily scale, so prices rise faster. That affects locals more. Plus, the town's increased economic activity isn't an illusion; it's tangible, but the friend's personal experience of stagnation is real too. 

  The user might need to reconcile these two views. Emphasize that both can be true: the town is better off overall, but individuals may not feel it equally. Highlighting the importance of real versus nominal income, and the role of external money inflows in driving genuine growth beyond just inflation.
answer: |-
  This is a fascinating situation that captures the tension between nominal and real economic changes, and it's absolutely not just "money illusion." Here's how to think through it systematically:

  **1. The Town is Likely *Actually* Better Off (Aggregate Real Growth):**

  *   **Injection of External Wealth:** Remote workers bring money earned *elsewhere* into the town. This is **new money entering the local economy**, not just existing money being reshuffled. This directly increases the town's aggregate income and purchasing power.
  *   **Increased Economic Activity & Supply Response:** The new demand (from remote workers spending their salaries) stimulates local businesses:
      *   **New Businesses:** Cafes, restaurants, gyms, boutiques, service providers (repairs, cleaning, etc.) emerge to serve the increased and often higher-income population.
      *   **Expansion:** Existing businesses expand operations, hire more staff, and invest.
      *   **Construction:** New housing (apartments, homes), commercial spaces, and infrastructure projects are built to meet demand. This represents a real increase in the town's physical capital stock.
  *   **Job Creation:** The new businesses and expansion create jobs *within* the town. These jobs wouldn't exist without the influx. While these jobs might pay local-market rates (lower than remote salaries), they still represent new employment opportunities and income sources for residents.
  *   **"The Bustle" is Real:** The visible building, more shops, more people employed locally, and general bustle are tangible signs of this increased economic activity and investment. This isn't an illusion; it's the physical manifestation of the town's economy growing in *real* terms – producing more goods and services.
  *   **Increased Tax Base:** Higher property values, more sales, and potentially higher incomes boost local government revenue, potentially funding better public services (schools, parks, roads) over time.

  **2. Why Your Friend Might Not Feel Better Off (Redistribution & Relative Price Shifts):**

  *   **Local Inflation (Cost-Push & Demand-Pull):**
      *   **Housing:** This is the biggest factor. The influx of remote workers with high salaries drives up demand for a relatively fixed supply of housing in the short/medium term. Landlords raise rents, property values soar. *This directly eats into your friend's real income.*
      *   **Non-Tradable Services & Goods:** Prices for services that can't be imported (restaurants, haircuts, local tradespeople, locally sourced goods) rise due to:
          *   **Increased Demand:** More people with money wanting these services.
          *   **Increased Costs:** Local businesses face higher rents themselves and may need to pay higher wages to attract/retain staff in a tighter labor market.
          *   **"Baumol's Cost Disease":** Services are inherently harder to make more productive than manufacturing. When wages rise generally (due to competition), service prices *must* rise significantly.
  *   **Her Raise vs. Local Inflation:** Her nominal raise might simply be keeping pace with the *local* inflation rate driven by the influx. If her raise is 7%, but local rents are up 15% and restaurant prices up 20%, her *real purchasing power within the town* has likely decreased, even if her nominal income increased.
  *   **Changing Consumption Basket:** The *mix* of goods and services available and that she consumes may have shifted. She might be priced out of her favorite local spots replaced by higher-end options catering to remote workers. This *feels* like a loss of welfare, even if aggregate town output is up.
  *   **Distributional Effects:** The benefits of the boom are not evenly distributed:
      *   **Winners:** Property owners (landlords, homeowners selling), owners of businesses serving the new demographic, local workers in high-demand sectors (construction, specific services).
      *   **Losers/Less Benefited:** Renters (like your friend?), lower-income locals without in-demand skills, people whose consumption basket heavily overlaps with the new high-spenders, those who valued the town's previous character/affordability.

  **3. Why "Money Illusion" Doesn't Quite Fit:**

  *   Money illusion typically refers to individuals misinterpreting nominal changes (like a nominal wage increase) as real changes, ignoring inflation. That's *part* of your friend's concern (her nominal raise might not be real).
  *   However, the core issue here is **structural economic change driven by an external shock** (influx of remote workers). This has caused:
      *   **Real aggregate growth** (new businesses, jobs, buildings).
      *   **Significant shifts in relative prices** (housing skyrocketing vs. other goods).
      *   **Redistribution of income and welfare** within the town.

  **The Right Way to Think About It:**

  1.  **The Town is Richer Overall:** The influx of external income has acted like an export boom. It has stimulated real investment, job creation, and increased the production of local goods and services. The aggregate "pie" is larger.
  2.  **But the *Distribution* of Gains is Uneven:** The benefits accrue disproportionately to asset owners (especially property) and specific businesses. The costs (higher local living expenses) fall heavily on those whose incomes don't rise as fast as *local* inflation, particularly renters and those consuming heavily impacted services.
  3.  **Your Friend's Stagnant Real Income is Real:** Her nominal raise is likely being eroded by the *specific inflation* hitting the goods and services she consumes locally (especially housing). Her *local purchasing power* might be flat or down.
  4.  **The "Bustle" Reflects Real Growth:** The construction, new businesses, and job creation are tangible evidence of the town's increased economic capacity and activity. This isn't an illusion; it's a real response to the increased demand fueled by external income.
  5.  **It's About Relative Prices & Winners/Losers:** The key conflict isn't just nominal vs. real in a macroeconomic sense, but the *dramatic change in relative prices* (housing becoming much more expensive relative to other goods) and who wins/loses from that shift. Your friend is likely on the losing end of that relative price change.

  **What to Tell Your Friend:**

  "Your town *is* genuinely better off overall. The remote workers brought in significant new money, leading to real growth: new businesses, construction, and local jobs that didn't exist before. That 'bustle' you see is real economic activity.

  However, *your personal experience* of not feeling richer is also completely valid and likely real. The surge in demand, especially for housing and local services, has caused prices in those areas to skyrocket. Unless your raise specifically matched or exceeded that *local* inflation (especially rent), your actual purchasing power *within the town* might not have improved, or could even have decreased. You're experiencing the downside of this boom – higher living costs – without necessarily capturing the full upside that property owners or certain businesses are seeing. It's less about a 'money illusion' and more about how the costs and benefits of this economic transformation are being distributed."
