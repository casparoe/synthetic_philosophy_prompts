  Had a long argument with my friend last night about the cosmological argument for God's existence -- he's really into William Lane Craig and was running the classic kalam line on me: whatever begins to exist has a cause, the universe began to exist, so it has a cause. I countered that physicists don't even agree the universe had a beginning (eternal inflation, Hawking's no-boundary proposal, that kind of thing), so premise 1 never gets off the ground and the whole argument just collapses. He didnt have a good comeback in the moment but said next time he'd bring up 'a different version' of it. Since the eternal-universe point already knocks out the premise the whole thing rests on, how should I explain to him ahead of time that switching versions isn't gonna save him?
