  The user probably needs concrete talking points about why "whatever exists contingently must have a cause" or "actual infinities are impossible" aren't slam dunks either. Bonus points if I can subtly hint that demanding a "cause" for the universe might be a category error—physical causality may not apply pre-Big Bang. 

