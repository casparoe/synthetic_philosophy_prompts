  The treasurer raised several objections: market depth issues due to small participant numbers, the index being a poor proxy leading to manipulation, and the risk of self-fulfilling prophecies where losing bettors might sabotage outcomes. The user needs a memo that addresses these points without dismissing them, offering a balanced view and a clear recommendation.

