answer: |-
  Here's a novel Allais-style paradox using **medical outcomes** instead of money:

  **Scenario Pair 1:**  
  You must choose a treatment for a serious illness:  
  - **Option A:** *Guaranteed* full recovery.  
  - **Option B:** 90% chance of a *complete cure* (better than full recovery), 10% chance of *no improvement*.  

  *Most people choose A (guaranteed safety).*  

  **Scenario Pair 2:**  
  A different (less severe) illness:  
  - **Option C:** 10% chance of *full recovery*, 90% chance of *no improvement*.  
  - **Option D:** 9% chance of *complete cure*, 1% chance of *partial improvement* (manageable symptoms), 90% chance of *no improvement*.  

  *Most people choose D (avoiding "no improvement" at all costs, even though partial improvement is worse than full recovery).*  

  ---

  **Why this violates the independence axiom (and isn't random):**  
  The independence axiom requires that adding an identical outcome (here, 90% chance of *no improvement*) to both options shouldn’t reverse preferences. Notice that:  
  - **Option C** = 10% full recovery + 90% no improvement  
  - **Option D** = (9% complete cure + 1% partial improvement) + 90% no improvement  

  If you preferred **A** (100% full recovery) over **B** (90% complete cure + 10% no improvement) in Pair 1, consistency demands you prefer **C** over **D** in Pair 2. But people flip to **D** because the *certainty of safety* in Pair 1 is gone, making them hyper-averse to the worst outcome (*no improvement*). This is a **systematic cognitive bias** (certainty effect + loss aversion), not randomness, as it predictably reappears across contexts when certainty is removed.
