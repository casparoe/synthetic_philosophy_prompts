  So I've been reading about the lottery paradox and the preface paradox, and it seems like they're basically the same paradox wearing two different outfits: in both cases you're individually justified in believing each of a bunch of claims, but also justified in believing atleast one of them is false. I've just been assuming that whatever solution fixes one (deny that justified belief is closed under conjunction, or whatever) automatically fixes the other too. Is that the standard take, or is there an actual disanalogy between the two cases that epistemologists care about?
