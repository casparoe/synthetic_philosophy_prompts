  **Driving force for coherentism (0.45):** Bayesian updating exemplifies systemic justification – priors gain warrant *retrospectively* through predictive coherence and resilience across likelihood updates. No belief is truly "basic"; even perceptual inputs are theory-laden and evaluated against global consistency. This maps to modern formal epistemology (e.g., Weisberg's "Varieties of Bayesianism") where justification emerges from the network's explanatory fertility, not axiomatic foundations. The regress halts pragmatically when further questioning reduces predictive power or violates constitutive constraints of the model.

  **Biting the bullet on coherentism's objection:** The strongest challenge is that coherentism permits arbitrary priors if internally consistent (the "isolation objection"). I accept that *initial* priors lack non-circular justification – but contend that under repeated updating with empirical feedback, maladaptive priors get washed out through calibration. The bootstrapping isn't vicious if the system exhibits *diachronic self-correction*. This concedes foundationalism's point about starting points but denies they carry justificatory weight independent of their role in the evolving web.
