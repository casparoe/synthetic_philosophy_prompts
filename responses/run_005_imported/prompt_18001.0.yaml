  Here’s a 5-minute memorial speech that honors your aunt’s Madhyamaka practice, avoids the forbidden extremes, and speaks to both her sangha and family with honesty and warmth. It translates emptiness into accessible terms while respecting Nagarjuna’s razor-sharp logic:

  ---

  **(Begin with quiet gratitude)**  
  Thank you all for being here. My aunt loved this community deeply—her Tuesday night meditators, her colleagues from the lab, her far-flung family. She’d be quietly pleased to see you together.  

  **(Address the elephant in the room)**  
  Now, she gave me very… *specific* instructions about today. She asked me not to say she’s "in a better place," or "watching over us." But she also made me swear not to say she’s "just gone, nothing more." If I said either, she wrote, she’d be mortified—and knowing her, she’d find a way to let me know.  

  **(Introduce the core concept simply)**  
  This wasn’t stubbornness. It was the heart of what she spent 35 years exploring in her living room: the profound teaching of **emptiness**. Not nothingness—but the understanding that reality doesn’t settle into neat boxes, especially not the biggest boxes of all: life and death. Her teacher, Nagarjuna, spent centuries ago dismantling the four easy answers we crave when someone dies: *Gone? Still here? Both? Neither?* He showed why each one, when taken literally, cracks under its own logic. My aunt didn’t just study this—she *lived* by it.  

  **(Make it personal and experiential)**  
  So how do we speak of her now? Not by clinging to comforting fictions she rejected, nor by collapsing into a void that misrepresents her life’s work. We speak of her by recognizing what **was** real, and what **remains** real:  

  1.  **The Space She Held:** That living room on Tuesday nights wasn’t about finding eternal souls or chasing bliss. It was about courage. The courage to sit still, look directly at the fluid, unfixable nature of experience—fear, joy, grief, the coffee going cold—and not flinch. She created a space where people could touch that raw, shimmering aliveness *without* needing to nail it down. That space persists in everyone who sat with her.  
  2.  **The Ripples:** Think of her laugh. Her sharp questions. The way she’d listen until you felt *seen*. These aren’t ghostly traces or cosmic energy—they’re **causes and conditions** still unfolding. The patience she taught? It’s in how *you* handle frustration today. The insight she shared? It’s reshaping someone’s tough decision next week. Like a pebble dropped in a pond, the ripples don’t "go somewhere else" when the pebble sinks; they *are* the water moving. Her actions are still moving through us.  
  3.  **The Empty Chair:** Her absence *hurts*. Profoundly. And emptiness isn’t a spiritual bypass for that pain. It’s the permission to feel the ache fully—because this loss isn’t generic. It’s *her* chair empty. *Her* voice silent. That very specificity, that unique constellation of memories and grief, is proof of how thoroughly she existed *in relationship*, not as some isolated soul. Our grief is the mirror of her impact.  

  **(Bridge to the non-Buddhists with warmth)**  
  For those thinking, "This sounds way headier than the aunt who made killer apple pie?"—you’re right. But here’s what it meant practically for her: She met life with radical openness. No dogma about how things "should" end. No fear of uncertainty. Just a deep, abiding curiosity about the texture of each moment. That’s why she could be so present with your heartbreak, your promotion, your silly story. She wasn’t waiting for a "better place." She found wonder right here.  

  **(Concrete invitation – speaks to Sangha & comforts others)**  
  So how do we honor that? Not by grasping for her in some imaginary beyond, nor by resigning ourselves to barren absence. We honor her **by tending what she cultivated**:  
  *   **To her Sangha:** Keep sitting in that living room. Wrestle with Nagarjuna’s verses. Laugh when it’s frustrating. That’s the best shrine.  
  *   **To us all:** When you feel lost, pause. Breathe. Meet the next moment—the messy, impermanent, unfixable moment—with her kind of fearless attention. That’s where she lives now: not as a "what," but as a **"how."** How to be present. How to question gently. How to leave space for others to find their own ground.  

  **(Closing)**  
  She wasn’t headed somewhere else. She isn’t simply erased. She’s woven into the fabric of all she touched—which is everyone here. So let’s meet this aching, grateful, empty space… not with answers, but with her own quiet courage. Thank you.  

  ---

  **Key elements handled:**  

  *   **Avoids the Horns:** Explicitly rejects eternalism ("better place") *and* annihilationism ("just ended") without using the banned phrases. Explains *why* via Nagarjuna’s project (dismantling tetralemma) in accessible terms ("neat boxes cracking").
  *   **Emptiness ≠ Nihilism/Mystery:** Defines emptiness positively as "unfixable nature," "causes and conditions," "existing in relationship." Shows it as a practical lens for living ("radical openness," "fearless attention").
  *   **Sangha Cred:** Uses precise language ("causes and conditions," Nagarjuna by name, "tetralemma" implied, "unfixable nature," focus on direct experience). The "keep sitting" line directly honors her practice.
  *   **Universal Comfort:** Grounds concepts in visceral human experience (grief, her laugh, the empty chair, apple pie, ripples in water). Focuses on her *impact* and *continuing influence* ("how to be present," "woven into the fabric," "ripples unfolding"). Offers concrete action ("tend what she cultivated," "pause. breathe.").
  *   **Honors Her Request:** Centers *her* specific philosophy and instructions as an act of love and respect.

  This walks the middle way: intellectually honest for the Sangha, emotionally resonant for others, and fiercely true to your remarkable aunt’s life and practice. Speak it slowly, from the heart, and you’ll do her proud.
