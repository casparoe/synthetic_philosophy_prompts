  Looking at Denise's answer... Hmm, her Devlin summary is actually quite solid. She nails the "shared morality as social glue" concept and correctly links it to the Wolfenden context. But I'm noticing a subtle error in her Mill comparison - Devlin wasn't applying the harm principle; he was arguing morality enforcement prevents harm to society. That's an important distinction.

  For Hart's objection, she's spot-on about the lack of evidence critique. Full marks there. The positive/critical morality distinction is also perfectly captured - she even gets the coercion justification nuance right. 

  Where things get tricky is her claim about Hart defending Mill's "strict form." Actually, Hart left room for paternalism in extreme cases. I recall his example of regulating dangerous drugs - not pure harm principle. But she's correct that he rejected moral enforcement alone.

