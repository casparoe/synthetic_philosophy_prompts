  I notice they mention cryonics specifically, which gives me a concrete hook. The "later point where life extension has succeeded" suggestion sparks an idea: set it in a future where immortality tech exists but remains imperfect/unequal. That creates natural tension—someone choosing mortality becomes more provocative when immortality is attainable. 

