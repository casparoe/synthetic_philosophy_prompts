answer: |-
  Here’s a toast weaving KS into its core, warm for family, insightful for theorists, with one clean bargaining joke:

  **(Raise glass, warm smile)**
  "Everyone, if I could have your attention. As [Bride's Name]'s former advisor, I’m deeply honoured she asked me to speak tonight. Though, I confess, when she mentioned her dissertation – the one proving Kalai-Smorodinsky is a *better* theory of justice than Nash – I felt a familiar wave of ‘advisor panic’. Because half of you [gesture to game theory cohort] could probably recite her axioms in your sleep, and the other half [gesture to family] are wondering if ‘Pareto frontier’ is the latest TikTok dance. So, my mission: explain why her work is actually the *perfect* lens to celebrate her and [Partner's Name]... without needing a whiteboard.

  **(Lean in slightly, conversational tone)**
  "See, both Nash and KS are theories about how two incredibly rational, deeply invested people – like our brilliant couple – should divide something wonderful, but limited. Call it happiness, call it the future, call it... well, wedding cake. Nash has its strengths, absolutely. But [Bride's Name] argued powerfully that it misses something vital. It focuses intensely on the starting point, on the minimum each person *must* get. It never looks up. It never asks, *‘What did each of you dream was possible?’*

  **(Shift focus to the couple)**
  "That’s where Kalai-Smorodinsky shines. It defines the ‘Utopia Point’ – the beautiful, maybe slightly unreachable dream where *both* partners get absolutely everything they could possibly desire. The perfect job *and* the perfect work-life balance. Adventure *and* security. Gourmet meals *and*... well, sometimes just ordering pizza. [Bride's Name] and [Partner's Name], when I see you together, I see two people who haven't just *found* each other's Utopia Point – you *inspire* it in each other. You constantly push each other to dream bigger, to envision that highest possible joy you could achieve *together*. Your relationship isn’t just about settling the current negotiation; it’s about constantly expanding the horizon of what you believe is possible as a team.

  **(Introduce Monotonicity naturally)**
  "And that brings me to the second beautiful idea from KS that fits you two: **Monotonicity**. Sounds fancy, right? It simply means something profoundly fair: If suddenly *more* wonderful opportunities open up in life – say, a dream job offer, a chance to travel the world, a new passion – your partner’s share of happiness shouldn’t *shrink* because of it. Their slice of the pie shouldn’t get smaller just because the pie itself got bigger! In fact, a truly just outcome means that new abundance benefits *both* of you. [Bride's Name], [Partner's Name] – that’s the rhythm of your partnership I’ve witnessed. When one of you grows, when one of you succeeds, when one of you discovers a new passion, the other doesn't feel diminished. They feel *lifted*. You instinctively understand that your partner’s expanding world makes *your* world richer. You build each other up, ensuring that every new opportunity, every new dream, becomes a shared victory, making both your lives fuller. That’s not just fair; that’s the foundation of something truly extraordinary.

  **(The Bargaining Joke - Light & Universal)**
  "Now, any good partnership involves negotiation. [Bride's Name]’s work taught me bargaining solutions are complex beasts! But watching you two navigate life, it’s clear you’ve mastered the most important rule: **Always negotiate in good faith, and remember the goal isn’t to ‘win’ the argument, but to find the outcome that makes *both* of you genuinely excited about the future.** *(Pause, slight grin)* Though, I suspect the *real* masterstroke was outsourcing the toughest bargaining of all... to the wedding planners! Let’s just say, navigating seating charts and cake flavors makes dividing international fisheries look straightforward. But you did it! And you did it *together*.

  **(Conclusion - Tie it back to the couple & Utopia)**
  "So, [Bride's Name] and [Partner's Name], your love story isn't just a Nash equilibrium – a stable point where neither wants to walk away. It’s a living, breathing Kalai-Smorodinsky solution. You constantly reach towards that shared Utopia Point, dreaming big *as a couple*. And you embody Monotonicity every day, ensuring that each other’s growth, each other’s joy, only amplifies the love and happiness you share. You don’t just divide the pie fairly; you keep baking bigger, more delicious pies together.

  **Here’s to constantly expanding the pie. Here’s to always reaching for your shared Utopia. And here’s to a lifetime of joy, growth, and fairness, beautifully solved by the two of you. To [Bride's Name] and [Partner's Name]!"**

  **(Clink glasses!)**

  **Why this works:**

  1.  **KS as Spine:** Monotonicity and the Utopia Point are explicitly named and explained in simple, relational terms. The contrast with Nash ("never looks up") is clear without bashing it.
  2.  **Accessible for Family:** Uses "dream big," "share of happiness," "slice of the pie," "build each other up," "expanding world." Avoids jargon after initial setup. Focuses on universal themes of partnership, growth, and shared dreams.
  3.  **Respectful for Theorists:** Uses the correct terms (Monotonicity, Utopia Point, Nash equilibrium), accurately reflects the core ideas KS emphasizes (relative aspirations, fairness under growth), and contrasts it correctly with Nash's reliance on the threat point/independence of irrelevant alternatives (implied by "never looks up" and "focuses intensely on the starting point"). The joke about wedding planning > fisheries is a safe, relatable nod to complexity.
  4.  **The Joke Lands:** It's warm ("negotiate in good faith," "excited about the future"), relatable (everyone knows wedding planning is hard!), and the punchline ("outsourcing... to wedding planners") is safe and funny for all. It gently acknowledges complexity without diving into IIA or specific axioms.
  5.  **Heartfelt:** The KS framework serves purely to *celebrate* the couple's dynamic – their mutual support, shared dreams, and collaborative growth. It's not a lecture; it's a metaphor for their love.
  6.  **Pacing:** Should fit comfortably within 5 minutes. Starts personal, weaves in the theory naturally, focuses on the couple, ends with a clear, uplifting toast.
