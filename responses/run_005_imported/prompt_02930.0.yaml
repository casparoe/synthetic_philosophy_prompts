  First, I should validate that this is a real and common bind. The "can't see it" phenomenon happens because writers live inside their story's logic. Then I should unpack why multiple people might agree something's wrong while disagreeing on why - that actually points to something fundamental being off. 

  The key insight here might be about resonance versus resolution. The user may have nailed the technical resolution but missed the emotional resonance. Or perhaps there's a subconscious pattern only outsiders can spot. 

  I'll suggest concrete diagnostic methods: looking at structural alignment, character consistency, theme payoff. The "cover letter" trick often works wonders - if they struggle to summarize the ending's purpose, that's telling. Also recommending they analyze chapter transitions might reveal abruptness they've normalized. 

  Most importantly, I should emphasize this isn't about doubting their craft but about bridging intention and reception. The solution isn't to scrap what they love but to find why its power isn't transmitting. Maybe suggest they sleep on specific questions about their ending to engage subconscious problem-solving. 

