  ...Wait, the memo must land next week. Needs to be actionable. Should outline concrete safeguards: private consent spaces, council's role defined as gatekeepers not decision-makers, ongoing community dialogue. And emphasize that Western ethics boards can't just impose standards - they have to co-create with communities. 

