  Priya's point seems strong: Ramsey's math enables longtermism, but his philosophy might contradict it. The challenge is reconciling his formal framework with his personal ethos. I should explore his objections to infinite values and his emphasis on knowable truths. Ramsey was skeptical of probabilities that can't be grounded in evidence, which longtermism often relies on for far-future predictions.

  Also, Ramsey's pragmatism about truth—beliefs as habits for action—could clash with speculative longtermist claims. If future predictions don't influence current actions meaningfully, he might dismiss them. His focus on finite human concerns over cosmic scales suggests he'd prioritize present, tangible ethics over reorganizing for uncertain futures.

  But would he bite the bullet? His utility framework can technically handle any probability and value, but his philosophical constraints likely prevent that. He'd probably criticize longtermism's speculative probabilities and moral weights as detached from human experience. Genuinely holding both positions might involve using expected utility for near-term decisions while rejecting its extension to astronomical timeframes due to epistemic and ethical limits.

