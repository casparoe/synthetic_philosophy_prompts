  The issue with the Nash solution is that it violates a property called "monotonicity". Specifically, if the set of feasible outcomes expands (i.e., more possibilities become available) in a way that is "favorable" to one player, then that player should not end up worse off. However, the Nash solution might actually make that player worse off because of the IIA axiom. The KS solution, on the other hand, ensures that when the feasible set expands, the utility of a player does not decrease.

  Let me explain with a concrete example.

  **Step 1: Define a bargaining problem.**
  A bargaining problem is defined by:
  - A set of players (we'll consider two players for simplicity: Player 1 and Player 2).
  - A feasible set S of utility pairs (u1, u2) that the players can achieve by agreement.
  - A disagreement point d = (d1, d2) which is the outcome if they fail to agree.

  We assume that S is convex and compact (to ensure solutions exist). The disagreement point is typically taken to be (0,0) for simplicity, but we can have non-zero.

  **Step 2: The Nash Bargaining Solution (NBS)**
  The NBS maximizes the product of the gains over the disagreement point:
     max (u1 - d1) * (u2 - d2)   subject to (u1, u2) in S and u1>=d1, u2>=d2.

  **Step 3: The Kalai-Smorodinsky Solution (KSS)**
