  ### Explanation of Nash vs. Kalai-Smorodinsky (KS) Solutions

  The Nash Bargaining Solution (NBS) and Kalai-Smorodinsky Solution (KSS) are two approaches to fairly allocate resources between competing entities. The key difference lies in their adherence to specific fairness axioms. NBS violates **resource monotonicity**, while KSS violates **independence of irrelevant alternatives (IIA)**. Here's a concrete breakdown:

  #### Core Issue: Violation of Resource Monotonicity by Nash
  - **Resource Monotonicity**: If the feasible set of resources expands (i.e., more bandwidth becomes available), no agent should receive *less* than they did in the original smaller set. This ensures that adding resources doesn’t penalize any party.
    
  - **Nash’s Failure**: NBS maximizes the product of utilities. When the feasible set expands asymmetrically (e.g., one agent gains more opportunities), the Nash solution may reallocate resources in a way that *reduces* one agent’s share, violating monotonicity.

  - **KS Fix**: KSS ensures that when the feasible set expands, an agent’s allocation never decreases if their *ideal* (maximum possible) utility increases or stays the same. It equalizes the ratio of each agent’s gain to their ideal gain.

