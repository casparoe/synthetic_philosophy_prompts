prompt: |-
  I write about science and ideas for a living, and on the side I run a little interview podcast where I get academics to explain their weirder-sounding views to a general audience. Next week's guest has built her whole career defending a Hirsch-style "quantifier variance" line in metaontology -- the idea that a lot of classic ontology fights (is there really a table over and above the atoms arranged tablewise, does composition happen whenever any two things touch, etc.) are merely verbal, because each side's quantifier secretly means something slightly different and both sentences come out true in their own language. I've done my homework -- read the SEP page on ontological deflationism and skimmed the Hirsch/Sider back-and-forth in the Metametaphysics volume -- but I don't trust myself to improvise sharp follow-ups live on air, so I want a script going in.

  Can you draft 8-10 interview questions that push past her just restating the thesis? I want at least one question on the "bootstrapping" worry -- that calling a dispute merely verbal is itself a substantive claim made from inside some particular quantifier-meaning, so how does she get the neutral vantage point she needs without already begging the question against the realist who thinks his quantifier is the joint-carving one. I want one on Sider's reference-magnetism comeback, specifically whether the fact that ordinary speakers converge on pretty stable usage over time is itself evidence for exactly the kind of objective naturalness she's trying to explain away. And I want one where you actually make her cash the view out on a concrete case -- the statue-and-the-lump-of-clay puzzle, or van Inwagen's line that only living things ever really compose anything -- rather than letting her stay safely up at the abstract "quantifier" level. For each of those three, tack on a quick follow-up keyed to whatever dodge shes most likely to reach for first. Then close the list with a question asking her to describe what a genuinely substantive, non-verbal metaphysical dispute would even look like by her own lights -- that's the one I actually care about most, since I keep wondering if "it's merely verbal" is doing real philosophical work for her or if its just a move she plays whenever a debate gets uncomfortable.
