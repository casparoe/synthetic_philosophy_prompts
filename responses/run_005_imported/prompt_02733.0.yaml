  Okay, let me start by unpacking the user's situation. They're a third-year PhD student in social psychology tasked with drafting statistical guidelines for their department's research reform committee. The immediate trigger is the replication crisis, and they discovered that their advisor's lab used questionable practices like repeated significance testing and stopping when p<0.05. Now, their advisor proposes mandating Bayes factors as a solution, claiming it avoids the stopping-rule problem due to the likelihood principle. But the user is concerned about the Jeffreys-Lindley paradox and whether this is a complete fix.

  First, I need to address the core of their query: the implications of the likelihood principle and Lindley paradox for their advisor's proposal. The user wants to know if Bayes factors would have protected their old studies and how this policy compares to other reforms like preregistration. They’re not just asking for a theoretical explanation; they need practical advice to inform a policy that will affect their department long-term.

  The user’s explicit needs are clear, but there might be deeper concerns. As a PhD student, they might feel caught between their advisor’s authority and their own critical findings. They need to present a balanced view to the committee without undermining their advisor. Also, their dissertation builds on papers using these flawed methods, so there’s personal stake in understanding the validity of prior work.

  Breaking down the advisor’s proposal: Bayes factors rely on the likelihood principle, which states that all evidence from data is in the likelihood function. This makes them immune to stopping rules because the likelihood doesn’t change based on when you stop. So, for the old studies where they peeked and stopped at p<0.05, using Bayes factors would have avoided the inflated Type I error. That’s a valid point.

  But the Lindley paradox introduces a problem. When sample sizes are large, a frequentist test might show significance (p<0.05), but the Bayes factor could favor the null if the prior is too vague. This happens because the Bayes factor penalizes complex models if the effect size isn’t large enough relative to the prior’s spread. So, even if the data looks significant under NHST, the Bayes factor might not support the alternative. This is critical because it shows that simply switching to Bayes factors isn’t a panacea; prior choice is crucial.

  The user needs to convey that while Bayes factors solve the stopping-rule issue, they introduce other challenges. The committee must understand that priors aren’t just technical details but affect results. Forcing Bayes factors without guidelines on priors could lead to inconsistency or researcher degrees of freedom in choosing priors that favor desired outcomes.

  Comparing to preregistration: Preregistration prevents p-hacking and data peeking by planning analyses upfront. It’s a procedural fix that complements Bayes factors. The user should advocate for both. Preregistration handles the design and analysis transparency, while Bayes factors address the statistical interpretation post-data collection. Together, they’re stronger.

  Also, the user might worry about department buy-in. Mandating Bayes factors requires training and resources. If researchers don’t understand Bayesian methods, they might misuse them. Preregistration is easier to implement initially. The policy should phase in Bayes factors with training and emphasize preregistration as a foundation.

  In summary, the user needs to present that Bayes factors solve the stopping-rule problem but have their own issues (priors, Lindley paradox). The policy should include preregistration, specify prior choices, and require training. This balanced approach addresses both technical and procedural weaknesses in current practices.
answer: |-
  This is an incredibly astute observation – you've pinpointed exactly the core tension between the *theoretical appeal* and *practical complexities* of mandating Bayes factors as a solution to the stopping-rule problem. Let's break down the implications of the Likelihood Principle and the Jeffreys-Lindley Paradox for your advisor's proposal and the broader reform effort.

  **1. The Likelihood Principle: The Core Appeal (Why Bayes Factors Solve the Stopping-Rule Problem)**

  *   **What it states:** All evidence about a parameter θ contained in the data is embodied in the likelihood function L(θ | data). The sampling plan (including *when* you decided to stop collecting data) is irrelevant for inference once the data is in hand.
  *   **Implication for Bayes Factors (BF):** A BF compares the probability of the observed data under two hypotheses (e.g., H0 vs H1). Since it depends *only* on the likelihood function (and the prior densities under each hypothesis), **the BF is indeed invariant to the stopping rule.** Whether you planned to collect exactly N=100, stopped at N=50 because p<.05, or stopped at N=200 because you got bored, **the BF calculated on the final dataset will be the same.** This is the key mathematical argument your advisor is relying on.
  *   **Protection for the Old Studies?** **Yes, in this specific aspect.** If your advisor's lab had calculated a BF on the *final dataset* (the one where they eventually stopped after peeking), that BF value would *not* have been invalidated or inflated *purely* by the peeking and optional stopping behavior. The BF correctly quantifies the evidence *in that final dataset* relative to the prior and the hypotheses specified. This is a genuine and powerful advantage over p-values in scenarios involving flexible designs or sequential analysis.

  **2. The Jeffreys-Lindley Paradox: The Core Caveat (Why Bayes Factors Aren't a Panacea)**

  *   **What it demonstrates:** The paradox highlights a stark conflict between frequentist p-values and Bayesian BFs in large samples. Specifically:
      *   A frequentist test might yield a highly significant p-value (e.g., p = 0.01), strongly rejecting H0.
      *   The corresponding BF *can* favor H0 *over* H1, depending critically on the prior specification for the effect size under H1.
  *   **Why it happens:**
      *   **P-value:** Measures the probability of data *as extreme or more extreme* than observed *assuming H0 is true*. It focuses on falsifying H0 but doesn't directly quantify evidence *for* H1. Its scale is heavily influenced by sample size.
      *   **BF:** Directly compares the probability of the *observed data* under H0 vs. H1. Crucially, the BF penalizes H1 for making vague predictions. If the prior under H1 is too diffuse (spread out over unrealistically large effect sizes), the model becomes less "efficient" at predicting the *specific* observed data, especially when the observed effect size is modest relative to the sample size. The BF rewards precise predictions.
      *   **The Conflict:** A significant p-value often occurs with a large N and a modest observed effect size. If the prior under H1 is vague, the BF can favor H0 because H1 didn't predict the observed effect size (which is consistent with H0) very well; it predicted a huge range of possibilities. The paradox is most pronounced when H0 is a point null (e.g., θ=0) and H1 is a vague alternative (e.g., θ ≠ 0 with a broad prior).
  *   **Implications for the Proposal & Policy:**
      *   **Not "Just Swap Frameworks":** The Lindley Paradox demonstrates that **BFs are critically sensitive to the prior specification for the alternative hypothesis (H1).** The BF result isn't an objective, framework-inherent truth; it's contingent on a modeling choice (the prior) that inherently involves subjectivity or domain knowledge. Mandating "use BFs" without mandating *how* to specify H1 and its prior is insufficient and potentially dangerous.
      *   **The Stopping Rule "Fix" Creates a New Problem:** While BFs solve the *procedural* bias (peeking/stopping rule), they introduce a *modeling* bias. Researchers retain substantial discretion through prior choice. A researcher motivated to find an effect could (consciously or unconsciously) choose a very diffuse prior for H1, making it harder for the BF to favor H1 (paradoxically, even with significant p-values), or choose a conveniently located narrow prior to boost evidence for H1. **The "researcher degrees of freedom" problem doesn't disappear; it shifts from the stopping rule to the prior specification.**
      *   **Validity of Old Results Revisited:** If your advisor's lab had used BFs *with a vague/default prior for H1*, the Lindley Paradox suggests that **some of their "significant" findings (based on p<.05 after peeking) might have yielded BFs favoring H0 or being only weakly diagnostic (e.g., BF ~1-3)**. The BF might have protected against false positives *induced by peeking*, but it might also have *failed to support* effects they found significant via NHST, purely due to prior choice. The "fix" might have changed the substantive conclusions on some studies.
      *   **Burden on the Committee/Policy:** A policy mandating BFs **must** address prior specification. Key questions:
          *   Will default priors be mandated (e.g., Cauchy(0, 0.707))? Which ones? Why?
          *   Will context-specific, informed priors be required? How will "informed" be defined and justified? Who reviews this?
          *   How will sensitivity analyses (showing how BF changes with different reasonable priors) be handled? Will they be mandatory?
          *   How will researchers be trained to understand and specify priors appropriately?

  **3. Bayes Factors + Preregistration: A Necessary Synergy**

  *   **BFs Alone are Not Enough:** Mandating BFs without addressing prior specification leaves a major loophole for subjective influence. It doesn't prevent HARKing (Hypothesizing After Results are Known), selective reporting, or other questionable practices *outside* of the stopping rule.
  *   **Preregistration as the Foundational Reform:** Preregistration forces researchers to specify *in advance*:
      *   **Hypotheses:** Clear H0 and H1.
      *   **Design:** Planned sample size, stopping rules (ideally fixed-N or clearly defined sequential boundaries *designed* for BF/NHST), variables.
      *   **Analysis Plan:** *Crucially, including the specification of the alternative hypothesis model and the prior distribution(s) for effect sizes under H1.*
  *   **How They Work Together:**
      1.  **Preregistration** locks in the design, hypotheses, *and prior specification* before data collection begins. This eliminates researcher degrees of freedom in choosing a convenient prior *after* seeing the data and directly addresses the vulnerability exposed by the Lindley Paradox.
      2.  **Bayes Factors** are then calculated *using the preregistered prior* on the final dataset. The Likelihood Principle ensures the BF is valid regardless of whether the researcher stuck perfectly to the stopping rule or encountered unexpected events (as long as the *final dataset* is analyzed as planned with the pre-specified prior).
  *   **Strength of the Combined Policy:** This combination directly tackles both core problems:
      *   **Stopping Rule Problem:** Solved by the BF's adherence to the Likelihood Principle.
      *   **Prior Specification Problem/Lindley Paradox Vulnerability:** Solved by preregistering the prior, making the choice transparent and pre-data.
      *   **Other QRP's:** Significantly mitigated by preregistration (HARKing, selective reporting, flexible analysis choices).

  **Recommendations for Your Committee Draft:**

  1.  **Acknowledge the Strengths & Limits of BFs:** Clearly state that while BFs are *mathematically* immune to the stopping rule problem (Likelihood Principle), their interpretation is *highly sensitive* to the prior specification for the alternative hypothesis (Lindley Paradox).
  2.  **Mandate Preregistration as the Primary Guardrail:** Position preregistration (on OSF, AsPredicted, etc.) as the *essential* first step for all confirmatory research. Emphasize it locks in hypotheses, design, analysis plan, *and crucially, prior specification for Bayesian analyses*.
  3.  **Recommend/Require Bayes Factors *with Preregistered Priors*:** Advocate for BFs as a valuable tool *when combined with preregistration*. The policy should require that any Bayesian analysis used for confirmatory hypothesis testing must use priors specified and justified in the preregistration.
  4.  **Address Prior Specification:** Provide guidance or requirements:
      *   Encourage contextually informed priors based on past literature or expert knowledge, with justification.
      *   Allow reasonable default priors (e.g., Cauchy(0, 0.707) for standardized effects in psychology), but mandate sensitivity analyses showing how the BF changes across a range of plausible priors.
      *   Require justification for any non-default prior.
  5.  **Training & Resources:** Emphasize that implementing this requires substantial training in Bayesian methods, prior specification, interpretation of BFs, and preregistration practices. Budget for workshops/resources.
  6.  **Clarify Scope:** Specify this applies to *confirmatory* studies. Exploratory research has different goals and norms, though transparency (preregistration of exploration plans) is still valuable.

  **In Conclusion:**

  Your advisor is correct that Bayes factors, *due to the Likelihood Principle*, mathematically solve the specific distortion caused by optional stopping and data peeking that plagued their old lab practices. **However, the Jeffreys-Lindley Paradox reveals that simply swapping p-values for BFs without careful safeguards (especially preregistration of priors) merely trades one set of problems (inflated Type I error from peeking) for another (potentially misleading evidence quantification due to arbitrary or undisclosed prior choices).** Preregistration is not complementary; it's foundational. The robust policy your department needs mandates **preregistration (including prior specification) as the non-negotiable standard, with Bayes factors being a strongly recommended (or required) analytical tool *for confirmatory tests* within that preregistered framework.** This combination directly addresses the vulnerabilities exposed by both the replication crisis *and* the deeper statistical paradoxes.
