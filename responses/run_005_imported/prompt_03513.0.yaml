  I recall psychological concepts like informational social influence and cascade effects. When early jurors express strong opinions, others might defer, thinking those opinions are based on better insight. Anchoring could also play a role, where initial opinions set a reference point. The Abilene paradox is relevant too—people privately disagree but go along, fearing isolation. 

