prompt: |-
  I am revising the conditionals unit of my philosophy of language seminar and want to be sure I have the history straight before I teach it. As I understand things, David Lewis's 1976 triviality results showed that indicative conditionals cannot be assigned truth conditions at all, which is precisely why Lewis abandoned a truth-conditional semantics for them in favor of something like Ernest Adams's probabilistic account, reserving his possible-worlds machinery for counterfactuals instead. If that is the right way to state the upshot of the triviality results, I am at a loss to explain why Stalnaker and Jackson kept developing truth-conditional semantics for indicative conditionals well after 1976: were they simply unpersuaded by a result that had already settled the question, or does the argument actually establish something narrower than I have suggested? I would like to get the dialectic right before presenting it in lecture.
reasoning: |-
  Okay, the user is preparing a lecture on the history of conditionals in philosophy of language, specifically focusing on Lewis's 1976 triviality results. They've summarized the mainstream interpretation—that Lewis proved indicative conditionals can't have truth conditions—but are puzzled why Stalnaker and Jackson continued developing truth-conditional accounts afterward. 

  Hmm, their question reveals they've already done solid homework: they know Lewis shifted to Adams-style probabilistic semantics while reserving possible worlds for counterfactuals. But the tension they're spotting is astute—why would major philosophers keep building truth-conditional theories if Lewis "settled" the issue? That suggests they might be missing nuances in how Lewis's results were received.

  Let me unpack the technical heart of this. Lewis didn't prove *no* truth conditions are possible; he showed they collapse under specific constraints. His argument assumes (1) conditional probability equals probability of truth (Adams's thesis), and (2) probabilities behave classically (e.g., fit within standard probability axioms). When you add triviality proofs showing these lead to contradictions—like P(A→C) must equal P(C|A) but also must be P(C) if A and C are independent—it forces a choice: *either* abandon truth conditions *or* modify the constraints. 

  Ah, and this is where Stalnaker/Jackson diverge. Stalnaker accepts Adams's thesis but argues probabilities *don't* always behave classically for conditionals (hence his "Stalnaker Bernoulli" model). Jackson attacks the other flank: he keeps classical probability but rejects Adams's thesis as universally true, proposing robustness instead. Both are essentially saying Lewis's dilemma isn't inescapable—you can preserve truth conditions by tweaking his premises. 

  The user might also appreciate knowing this wasn't just stubbornness. Stalnaker/Jackson saw deeper issues: if conditionals lack truth values, how do we explain their role in compound sentences (e.g., "If A, then if B, C")? Probabilistic accounts struggle there. That practical concern likely motivated their persistence. 

  ...I should emphasize in the response that Lewis himself acknowledged escape routes (like context-dependence), so the "settled" narrative oversimplifies. The real lesson is that *how* you formalize probability and conditionals determines whether truth conditions are viable—it's a live debate, not a closed case. That framing will help the user present the dialectic more accurately.
answer: |-
  You've identified a crucial tension in the history of conditional semantics! Your summary captures the *mainstream interpretation* of Lewis's impact, but the persistence of Stalnaker and Jackson reveals that Lewis's results were **not universally accepted as settling the question definitively against *any* truth-conditional semantics for indicatives**. Their work represents **substantive philosophical and technical challenges to the scope and interpretation of Lewis's triviality proofs**.

  Here's the corrected dialectic, crucial for accurate teaching:

  1.  **Lewis's Triviality Results (1976): What They *Actually* Showed:**
      *   Lewis proved that **certain combinations of intuitively plausible assumptions lead to triviality** (i.e., the probability of the conditional collapsing to the probability of the consequent, or the logic collapsing to truth-functional logic).
      *   The core assumptions typically involve:
          *   **Adams's Thesis (AT):** P(A → C) = P(C | A), *when P(A) > 0*. (The probability of the conditional equals the conditional probability).
          *   **Truth-Conditionality (TC):** The conditional A → C expresses a proposition, so P(A → C) is the probability that *this proposition is true*.
          *   **Classical Probability Calculus:** Probabilities obey the standard axioms (Kolmogorov).
          *   **Richness of the Language/Probability Space:** The language contains sufficiently many independent propositions or the probability space is sufficiently rich.
      *   **The Crucial Point:** Lewis showed that **AT + TC + Classical Probability + Richness ⇒ Triviality.** This is a *conditional* result: *If* you accept all these assumptions, you get an absurdity.

  2.  **Lewis's Response:**
      *   Lewis concluded that **AT must be preserved** for indicatives, as it captures their core function in inference and assertion. He saw AT as empirically well-supported.
      *   Therefore, since AT + TC + Classical Prob ⇒ Triviality, **TC must be abandoned** for indicative conditionals. He adopted Adams's non-truth-conditional probabilistic account.
      *   He reserved possible worlds semantics (with similarity ordering) for *counterfactuals* (subjunctive conditionals), where AT doesn't generally hold and TC seemed viable.

  3.  **Stalnaker's and Jackson's Responses: Why They Persisted with Truth Conditions:**
      They accepted Lewis's proofs as *mathematically sound* but **disputed the necessity of abandoning TC**. They argued that **one of the *other* assumptions in Lewis's conditional could (and should) be rejected instead**:

      *   **Stalnaker's Strategy: Reject the "Classical Probability" Assumption *for Conditionals* within the Model:**
          *   Stalnaker (1976, and later refinements) **preserved both AT and TC** for his conditional connective (`>`, often read as "If A, then C").
          *   His key move: **Deny that the probability of the *truth* of (A > C) is always equal to the *standard* conditional probability P(C|A) *when calculated within the same classical probability space***.
          *   **How?** Stalnaker's semantics makes the truth of (A > C) depend on a selection function. Crucially, this function operates on *worlds*, and the proposition expressed by (A > C) can involve *different worlds* depending on which world is actual. This introduces **context-dependence and dynamic elements**.
          *   **The Stalnaker Bernoulli Model:** Stalnaker developed a specific model (using sequences of worlds) where P(A > C) *does* equal P(C|A) for the agent's credence function defined *over that sequence*, but crucially, this credence function is **not equivalent to a classical probability distribution over the atomic propositions** in the way Lewis's triviality proofs assume. The logic of the conditional imposes constraints that violate the "Richness" or independence assumptions needed for Lewis's proofs within a classical framework. Essentially, the probability space is structured by the selection function.
          *   **Upshot:** AT holds, TC holds, but the conditional probability P(C|A) isn't calculated in a classical way over a static set of worlds; it's integrated with the dynamic, context-dependent semantics. Lewis's proofs don't apply because the "Classical Probability" assumption fails for the language containing Stalnaker's conditional.

      *   **Jackson's Strategy: Reject AT as the *Fundamental* Constraint (Preserve TC + Classical Prob):**
          *   Jackson (1979, 1987) **accepted TC and Classical Probability**. He aimed to provide truth conditions compatible with standard probability.
          *   He **rejected the idea that AT *defines* the meaning of the indicative conditional**. Instead, he argued AT is a *consequence* of the conditional's meaning plus pragmatic factors.
          *   **Jackson's Theory:** The truth conditions of "If A, then C" are the same as the material conditional (A ⊃ C) *in many contexts*. However, he added a **pragmatic component: Robustness**.
          *   **Robustness:** An indicative conditional is *assertible* not just when A ⊃ C is probable, but when it remains probable *even if A turns out to be true* (i.e., when P(A ⊃ C | A) = P(C | A) is high). This explains *why* we assert indicatives when P(C|A) is high, even if the material conditional probability P(A ⊃ C) is high for other reasons (e.g., P(~A) is high).
          *   **How it Avoids Triviality:** Jackson accepts TC and Classical Probability. His conditional *has* truth conditions (A ⊃ C), so P(If A, C) = P(A ⊃ C) = 1 - P(A & ~C). This is generally *not* equal to P(C|A). AT *fails* as a general principle. Jackson explains the *apparent* validity of AT via the assertibility condition (Robustness): We only *assert* "If A, C" when P(C|A) is high, even though its *probability of truth* is P(A ⊃ C). Lewis's proofs don't apply because AT is rejected as a semantic principle.

  4.  **The Dialectic Clarified:**
      *   Lewis: AT is essential. AT + TC + ClassProb + Richness ⇒ Triviality. ∴ Abandon TC for indicatives.
      *   Stalnaker: AT *and* TC *are* essential. ∴ Reject the assumption that Classical Probability applies in the simple way Lewis assumed when modeling the semantics of conditionals. Develop a non-classical probability model integrated with the semantics.
      *   Jackson: TC *and* Classical Probability are essential. ∴ Reject AT as a fundamental semantic constraint. Explain the link to conditional probability pragmatically (Robustness).
      *   **None were "unpersuaded by the result" in the sense of denying the math.** They accepted Lewis proved a conditional statement: *If* assumptions X, Y, Z hold, *then* triviality follows. Their dispute was over **which of the assumptions (X, Y, or Z) was the correct one to abandon**.

  **What to Tell Your Students:**

  1.  Lewis proved that **truth-conditional semantics for indicative conditionals face a formidable challenge**: Combining the intuitive principle that their probability equals conditional probability (Adams's Thesis) with standard truth-conditional semantics and classical probability leads to absurdity.
  2.  Lewis concluded **truth conditions must be abandoned** for indicatives, adopting Adams's probabilistic account.
  3.  **Stalnaker and Jackson offered alternative resolutions:**
      *   **Stalnaker:** Keep truth conditions *and* Adams's Thesis by developing a **sophisticated semantics that integrates context-dependence and requires a non-standard probability model** (avoiding the "Richness" assumption needed for triviality).
      *   **Jackson:** Keep truth conditions *and* classical probability by **rejecting Adams's Thesis as a *semantic* principle** and explaining the link to conditional probability **pragmatically** (via Robustness).
  4.  **The debate continues:** Lewis's results didn't *end* truth-conditional approaches; it forced their proponents to make significant theoretical choices (like Stalnaker's complex probability model or Jackson's embrace of the material conditional plus pragmatics) and highlighted deep challenges. The viability of these responses remains a central topic in the philosophy of language and formal semantics.

  Presenting it this way accurately captures the historical progression and the substantive philosophical disagreements that drove research forward after 1976. It shows that Lewis's results framed the debate powerfully but did not achieve universal assent for his specific conclusion.
