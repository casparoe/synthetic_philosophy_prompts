  Similarly, the hide-and-seek example: the agent is still pursuing the intended goal (find hiders) but via an exploit. So it's not that the goal changed; it's that the strategy is unintended. This is more about robustness or outer alignment (the reward function didn't penalize the exploit). So it's not inner misalignment.

