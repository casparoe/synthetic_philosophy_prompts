prompt: |-
  Im outlining a novel where one of the two leads is an evolutionary biologist who's convinced morality is basically a useful fiction evolution installed in us -- no real oughts, just adaptive feelings that happen to feel like commands. To pressure-test her arguments before I write her dialogue, I got two friends talking about it over dinner (one's an ecologist, one did a philosophy MA), and it turned into a proper argument. I wrote down the shape of it after they left:

  (1) Mark: our moral intuitions are just fitness-enhancing heuristics. Evolution installs whatever gets genes copied, not whatever's true, and we'd have ended up with roughly the same moral beliefs whether or not any objective values existed. That's enough to debunk them -- we've got no reason to think they track anything real.

  (2) Elena: by that logic our belief in basic arithmetic and logic is equally debunked, since evolution shaped our reasoning for survival, not for grasping abstract truths, and nobody concludes 2+2=4 is fake as a result. So the mere evolutionary origin of a belief can't, by itself, be what discredits it.

  (3) Mark: the cases aren't parallel though. There's an obvious, non-mysterious story for why selection would land on creatures with accurate arithmetic -- miscounting predators or offspring gets punished almost immediatly, so true-belief and fitness-belief are basically the same target there. There's no equivalent story for morality, because if moral facts are real they're exactly the kind of thing that doesn't push around gene frequencies, so selection had nothing to lock onto.

  (4) Elena: that only bites if you assume moral facts are some spooky non-natural thing floating free of biology. A naturalist can just say moral facts are facts about suffering and flourishing, and those very much do have causal traction -- the same pressures that made us cooperative and averse to needless cruelty could be tracking something real about welfare.

  (5) Mark: except evolution just as reliably built in nepotism, in-group loyalty and out-group hostility, which we now think are morally bad. If fitness pressures were tracking real welfare facts we wouldn't expect that mismatch. Elena's naturalist rescue is quietly cherry-picking: keep the fitness-shaped intuitions that still look nice to us, wave the ugly ones away as noise.

  (6) Elena: fine, that shows some intuitions are contaminated, not that the whole capacity is worthless or that nothing is really right or wrong -- we already use reflection to filter out tribal instincts we don't endorse, same as we correct for known perceptual illusions without deciding perception is generally untrustworthy.

  They just went in circles after that and nobody budged (typical). I don't want to put a strawman in either character's mouth, so: can you go through the exchange move by move, say who's got the better of it at each step (not just who wins overall), and point out anything important both of them are missing? End with one line, exactly: FINAL: Mark, FINAL: Elena, or FINAL: neither.
reasoning: |-
  Okay, the user is outlining a novel with a lead character who's an evolutionary biologist arguing that morality is an evolutionary fiction. They had a real debate between friends (Mark representing the biologist's view, Elena opposing) and want me to pressure-test the arguments. 

  Hmm, this is actually quite sophisticated - the user clearly understands philosophy of mind/ethics well enough to stage this dialogue. The core tension is between evolutionary debunking arguments (Mark) and naturalist moral realism (Elena). I should flag that both positions have serious academic backing - Street and Joyce vs Boyd and Copp.

  Breaking it down move by move:
  First exchange: Mark's opener is classic Sharon Street. But Elena's math analogy is spot-on - that's exactly how realist philosophers like Enoch counter this. Point to Elena here because she exposes the generic weakness in evolutionary debunking.

  Second exchange: Mark's distinction between math and morality is valid though. Counting has immediate fitness consequences in ways moral truths might not. This is where Joyce's "tracking objection" bites - if moral facts don't causally interact with us, why would evolution track them? Edge to Mark.

  Third exchange: Elena's naturalist move is clever - reducing morality to wellbeing makes it causally relevant. But Mark's counter about in-group bias is devastating. If evolution "tracks" wellbeing, why did it produce xenophobia? This exposes the cherry-picking problem realists face. Strong point for Mark.

  Fourth exchange: Elena's contamination argument saves her though. We do rationally correct biased intuitions (like optical illusions) without rejecting entire faculties. This mirrors how philosophers like Parfit salvage moral reasoning. Since Mark has no reply to this, Elena levels it.

  Overall? Mark lands heavier punches but Elena's framework is more salvageable. The user should note both miss key nuances: Mark ignores that evolution could coincidentally track moral truths, Elena doesn't address why we privilege certain intuitions when "filtering."

  Final judgment? Neither conclusively wins, but if forced... Elena's position survives slightly better because she allows for rational correction. The "contamination not corruption" point is crucial for the novelist - it lets the biologist character be wrong without making her stupid.
answer: |-
  Here's a breakdown of the exchange, assessing the strength of each move and identifying key omissions:

  **Move-by-Move Analysis:**

  1.  **Mark (Debunking Argument):** Strong opener. Clearly states the evolutionary debunking position: moral intuitions are fitness heuristics, not truth-trackers. The "whether or not objective values existed" point is central to debunking arguments (e.g., Joyce, Street).
      *   **Strength:** Strong. Logically sound within its assumptions. Establishes the core challenge.
      *   **Missing:** Doesn't address *why* we should think moral facts *couldn't* be tracked, just asserts the lack of reason to think they *are* tracked. Assumes moral facts *must* be non-natural/spooky to be real.

  2.  **Elena (Analogy Challenge - Math/Logic):** Very strong counter. Effectively uses the "companions in guilt" strategy. Highlights that evolutionary origins *alone* aren't sufficient to debunk a belief domain, as we accept math/logic despite similar origins. Exposes a potential flaw in Mark's reasoning.
      *   **Strength:** Very Strong. Forces Mark to refine his argument beyond mere evolutionary origin. Shows the debunking argument might be overbroad.
      *   **Missing:** Doesn't directly engage *why* Mark thinks morality is different from math/logic. Could be accused of setting up a false equivalence if Mark can show a relevant difference.

  3.  **Mark (Distinguishing Math & Morality - Tracking):** Strong refinement. Successfully differentiates the cases by appealing to *tracking mechanisms*. Provides a plausible story for *why* math/logic intuitions might track truth (immediate fitness consequences tightly link truth & survival). Argues no equivalent mechanism exists for morality *if* moral facts are non-natural/spooky. This is the core of sophisticated debunking arguments.
      *   **Strength:** Strong. Addresses Elena's analogy effectively by providing a relevant difference based on causal efficacy and selection pressures. Shifts the burden back to Elena.
      *   **Missing:** Still assumes moral facts *must* be non-natural/spooky to be real. Doesn't engage with the possibility Elena raises next (naturalism). Also, slightly overstates the "immediacy" of math/logic penalties – complex abstract math might not have direct fitness links.

  4.  **Elena (Naturalist Rescue - Suffering/Flourishing):** Strong counter. Directly challenges Mark's assumption that moral facts *must* be non-natural. Offers a plausible naturalist alternative: moral facts = facts about welfare (suffering/flourishing), which *do* have causal traction on evolution. Argues selection pressures *could* have tracked these real features.
      *   **Strength:** Strong. Effectively undermines Mark's key assumption and provides a positive alternative framework. Shows how evolution *might* track real moral facts under naturalism.
      *   **Missing:** Needs to provide more detail on *how* exactly selection pressures reliably track these welfare facts, especially given Mark's next point. Doesn't fully address *why* evolution would prioritize *true* welfare over *fitness-enhancing perceptions* of welfare.

  5.  **Mark (The Mismatch Objection - Nepotism/Bias):** Very strong counter. Highlights a major challenge for Elena's naturalist realism. Points out that evolution produced deeply ingrained intuitions (nepotism, in-group bias, out-group hostility) that we now widely condemn as morally problematic. Argues this "ugly" mismatch undermines the idea that evolution was reliably tracking *true* welfare facts; it looks more like it was tracking fitness, sometimes aligning with welfare, sometimes conflicting.
      *   **Strength:** Very Strong. A powerful empirical argument against the "tracking" story for morality. Exposes a potential cherry-picking problem in realist accounts that favor "nice" intuitions but dismiss "ugly" ones as noise. This is a major hurdle for evolutionary moral realism.
      *   **Missing:** Could acknowledge that *some* "ugly" intuitions (e.g., tribalism) might be contextually adaptive for group survival/welfare in ancestral environments, even if maladaptive now. Doesn't engage with the *next* move about correction.

  6.  **Elena (Contamination, not Corruption - Reflective Correction):** Strong defense. Effectively counters the "all-or-nothing" implication of Mark's mismatch argument. Argues that the presence of biased or "contaminated" intuitions doesn't invalidate the *whole* moral faculty or the *possibility* of tracking *some* real moral facts. Draws a crucial analogy to sensory/perceptual illusions: we correct known errors without abandoning perception as generally reliable. Positions moral reflection as the tool for filtering noise.
      *   **Strength:** Strong. Provides a plausible defense against the mismatch objection. Avoids throwing the baby out with the bathwater. Explains how we *use* reason to improve upon evolution's raw output. This is key to many realist defenses (e.g., Boyd, Copp).
      *   **Missing:** Needs a clearer account of *how* reflection works and *why* we trust it. What is the standard *for* correction if not evolved intuition? (Appeal to coherence? Consistency? Further intuitions? Theory?). Doesn't fully address Mark's potential charge that the "filtering" process might *itself* be shaped by fitness pressures, not truth-tracking.

  **Key Omissions by Both:**

  1.  **The Status of Moral Reflection:** Neither fully grapples with *how* moral reflection escapes the evolutionary debunking pressure. If *all* cognition is shaped by evolution, why trust reflection more than intuition? Mark implies reflection might be equally suspect; Elena assumes it's a reliable corrective without fully justifying *why*.
  2.  **The "Why Care?" Question:** Mark's position struggles to explain the *phenomenology* and motivating force of morality – why do moral "fictions" feel like categorical imperatives? Elena's position needs to explain why tracking facts about suffering/flourishing *should* motivate us categorically (Hume's Guillotine).
  3.  **Alternative Evolutionary Stories:** Both focus on selection *for* truth-tracking (or not). Neither explores alternative explanations like cultural evolution, gene-culture coevolution, or byproduct theories for the *content* and *variation* of moral beliefs.
  4.  **Epistemic Justification:** The debate centers on origins vs. justification. Mark focuses on origins undermining justification. Elena argues origins don't *necessarily* undermine justification (math analogy, correction). But neither delves deeply into *what constitutes justification* for moral beliefs specifically.
  5.  **Variation & Progress:** The existence of moral disagreement and perceived moral progress (e.g., rejecting slavery) is a double-edged sword. Mark could use it to show lack of tracking; Elena could use it to show the success of reflective correction. Both hint at it but don't develop it fully.

  **FINAL: neither**

  **Reasoning:** Both Mark and Elena present strong, sophisticated arguments representative of real philosophical positions (evolutionary debunking vs. naturalist moral realism). Mark effectively challenges the reliability of evolved moral intuitions and highlights the mismatch problem for naturalist realism. Elena successfully counters the overbroad application of debunking (via the math analogy), offers a plausible naturalist framework where moral facts could be tracked, and defends the role of reflection in correcting biased intuitions. Neither lands a decisive knockout blow; each has credible responses to the other's points. The core philosophical disagreement about the nature and knowability of moral facts remains unresolved in this exchange, reflecting the ongoing debate in metaethics.
