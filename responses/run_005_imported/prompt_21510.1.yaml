answer: |-
  Here's that exchange, digging into the core philosophical conflict while keeping it grounded in the urgency of the moment and the respect between Priya and Hollis. Priya channels the core of Taurek's argument, while Hollis counters with a blend of consequentialism and practical rescue ethics.

  **The Scene:**

  The inflatable raft bucks violently as Hollis fights the current, aiming for the near bank where the five backpackers huddle under a precarious rock overhang. Rain lashes Priya's face as she scans the opposite bank, spotting the lone figure – a young woman clinging to a bent sapling, the water already swirling around her ankles. The radio crackles again, confirming what Priya already knows: no other teams can get here in time.

  Hollis grunts, muscles straining against the oar. "Hold on, Priya! Almost there. Get ready to secure the line!"

  Priya doesn't move to grab the coiled rope. Her knuckles are white on the raft's edge. "Hollis... wait."

  He throws a sharp glance back, water streaming down his weathered face. "What? No time!"

  "Just listen for thirty seconds!" Priya shouts over the roar. Her voice isn't panicked; it's focused, intense. "Going for the five... it *isn't* automatic."

  "Five lives versus one? Course it is!" Hollis snaps, wrestling the raft another foot towards the bank. "Basic math!"

  "That's *exactly* the problem!" Priya leans forward, her eyes locked on his. "You're adding them up. Making it a numbers game. But Hollis, lives aren't numbers. You can't stack them like firewood. Saving five isn't *objectively* better than saving one. Not to the individuals involved."

  Hollis pauses, genuinely taken aback. The raft drifts slightly sideways. "What the hell are you talking about? Five people get to live instead of one! How is that not better?"

  "Better for *whom*?" Priya presses, her voice cutting through the storm. "Better for the five, sure. But what about *her*?" She jabs a finger towards the solitary figure across the churning water. "If we save the five, *she* dies. For her, the outcome isn't 'five lived instead of one' – the outcome is *she dies alone*. And saving her wouldn't be 'just saving one' – *for her*, it would be saving her *entire world*."

  She takes a breath, forcing clarity. "You're looking at it from the outside, like a god counting beans. But from *inside* each life? Each person stands alone in their claim to be saved. That solo hiker has just as much right *as an individual* to our help as any one of those five over there. Choosing the five *because* there are more is saying her life matters less *simply because she's alone*. It's giving her a smaller chance, a lesser claim, based purely on the bad luck of who happened to be stranded where. That's... profoundly unfair *to her*."

  Hollis stares at her, the rain plastering his hair flat. The raw logic, focused on the individual being sacrificed, hits him differently than a simple "numbers don't matter" argument. He sees the stark terror on the solo hiker's face, truly sees it for the first time in this context. He swallows hard.

  "Priya..." His voice is lower, rougher. "I hear you. I do. That woman... hell, she deserves a shot. But look." He gestures not just at the five, but at the raging creek, the collapsing banks upstream. "This ain't philosophy class on a sunny Tuesday. This is *now*. If we go for her..." He points the oar towards the lone hiker. "...and we *do* get her, that's it. Game over. The current'll be impassable by the time we get back here. Those five..." He nods towards the overhang, where a small rockfall splashes into the rising water near their feet. "...they *will* die. Every single one. Guaranteed."

  He meets her eyes, his gaze fierce, not dismissive. "You talk about the unfairness *to her* if we choose the five. But Priya, what about the unfairness *to them* if we choose her? Five individuals, each with their own world, just like her. Choosing her means *deliberately* letting five other worlds end, five other people who had an equal claim *as individuals*, when we had the *capacity* to save them all together. It's not about stacking lives; it's about the sheer, brutal *waste* of preventable death we'd be choosing. Saving one *when we could have saved five* feels... like an active betrayal of the duty we have *to everyone* who needs us *right now*."

  He grips the oar tighter, knuckles white. "It's not that her life is worth less. It's that the *cost* of saving her, in *this* moment, with *this* boat, is five other lives we *know* we could save instead. We don't get to save everyone. But when we *can* save more... choosing to save fewer feels like failing everyone who relies on us not to make sentimental choices when the math of survival is this damned clear."

  Silence hangs between them, thick with the roar of water and wind. Priya looks back at the lone hiker, the weight of Hollis's counter pressing down. The unfairness to the one versus the preventable loss of the five. Neither answer feels clean. Neither absolves them of the cost.

  **The Philosophical Underpinnings:**

  *   **Priya's Argument:** She's channeling the core of **John Taurek's 1977 paper "Should the Numbers Count?"**. Taurek argues that when saving one group necessarily means letting another die, we shouldn't aggregate the value of lives. Each individual has an equal, incomparable claim to be saved. Choosing the larger group simply because it's larger is unfair to the individuals in the smaller group, whose lives are effectively discounted based on the bad luck of their circumstances. It prioritizes the *sum* over the irreducible value of each *person*.
  *   **Hollis's Counter:** Hollis draws on a mix of:
      *   **Consequentialism (specifically Utilitarianism):** Focusing on the outcome – saving five lives produces more "good" (prevented suffering/death) than saving one. The "cost" (the one death) is outweighed by the "benefit" (five lives saved). He emphasizes the *preventable loss*.
      *   **Rescue Ethics & Duty:** He frames the choice in terms of the team's duty and capacity. When resources are *this* limited and the outcome for the larger group is certain death without intervention, the duty to use those resources to prevent the *greatest preventable loss* becomes paramount. It's not sentimentality, but fulfilling the practical mandate of their role.
      *   **(Implicitly) Scanlonian Contractualism (T.M. Scanlon):** While not directly stated, Hollis's point about the "betrayal" touches on Scanlon's idea that principles must be justifiable to each person affected. Could the five reasonably accept a principle that says "rescuers should save one when they could have saved five"? He argues they could not, especially given the rescuers' specific role. The "waste" is a violation of a principle others could reasonably reject.

  **Why this works:**

  1.  **Priya's Strongest Point:** She avoids naive "all lives are equal" platitudes. She focuses on the *unfairness to the sacrificed individual* inherent in aggregation. It forces Hollis to confront the *specific victim* of his choice.
  2.  **Hollis's Strong Counter:** He doesn't dismiss her. He acknowledges the individual cost ("That woman... she deserves a shot"). Then he pivots to the *consequences of her choice*: the *active, preventable loss of five individuals* and the *betrayal of their duty and capacity*. He reframes "numbers" as "preventable deaths given our specific capability *right now*."
  3.  **Respect & Stakes:** Both arguments are grounded in genuine concern – Priya for individual fairness, Hollis for preventing catastrophic loss and fulfilling their duty. The urgency of the storm and the physical struggle with the raft keep the tension high.
  4.  **No Easy Answer:** The scene ends unresolved. Priya *feels* the weight of Hollis's point about preventable loss. Hollis *felt* the force of Priya's argument about the sacrificed individual. The reader is left with the agonizing dilemma.

  **What to Read:**

  *   **John Taurek: "Should the Numbers Count?"** (Philosophy & Public Affairs, 1977) - The core source for Priya's argument.
  *   **Responses to Taurek:** Many philosophers have critiqued him. Look for pieces by Derek Parfit, John Broome, or T.M. Scanlon discussing aggregation and saving lives. Scanlon's *What We Owe to Each Other* (1998) is dense but relevant to the "justifiability" angle Hollis hints at.
  *   **Rescue Ethics:** Less formal philosophy, but research on Triage ethics (especially in disaster/disaster medicine contexts) or mountain rescue protocols can inform Hollis's practical perspective.

  This exchange gives Priya a powerful, philosophically grounded objection, forces Hollis to articulate a deeper justification beyond simple math, and leaves both characters (and the reader) wrestling with the genuine, insoluble tension of the situation. Good luck with the chapter! It's a fantastic dilemma.
