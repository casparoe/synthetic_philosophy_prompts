  ok so in AP stats our teacher gave us this practice dataset to teach simpsons paradox and it kicked off a whole argument between my friends owen and naomi at lunch that never got resolved, curious what you think.

  the setup: Mr. Kessler (80 kids in honors, 20 in regular) has a 90% pass rate in honors and 40% in regular, for an 80% overall pass rate. Ms. Alvarez (20 kids in honors, 80 in regular) has a 95% pass rate in honors and 50% in regular, for a 59% overall pass rate. so she beats him in BOTH categories but he crushes her overall, purely bc of how the sections got divided up.

  (1) owen: this is literally the textbook point of simpsons paradox, the 80 vs 59 number is garbage, you gotta compare like with like, so alvarez is objectively the better teacher here

  (2) naomi: wait but how do we know class track is the only thing getting mixed together here? what if kessler just happens to get the stronger kids within honors and alvarez gets the weaker ones within honors, theres nothing saying there's not ALSO a confound inside each subgroup

  (3) owen: ok but you could say that about literally any comparison ever, theres always some hypothetical factor you havent controlled for, thats not a real objection its just generic doubt, at some point you gotta go with the best breakdown available, which is the one by track

  (4) naomi: its not generic doubt tho. theres a real difference between splitting on something decided before the year even started, like which track a kid got placed in, vs splitting on something that happens because of the teaching itself, like if we only compared pass rates among kids who came to a teacher's optional review sessions. that second kind of split is caused by how good the teacher already is, so conditioning on it can hide the real effect or even fake a paradox that isnt there. so no, not every breakdown deserves equal trust just for being more "detailed"

  (5) owen: sure, but doesnt that just mean you can always say "well THAT variable is secretly a confound" or "secretly caused by teaching" whenever you dont like a result? at some point dont you just have to pick one of the two tables and trust it?

