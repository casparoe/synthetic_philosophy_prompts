answer: |-
  That's an excellent question that cuts to the heart of the frequentist/Bayesian divide and the replication crisis. Let's break down the mechanism step-by-step:

  ### The Core Mechanism: Why Stopping Rules Matter for Frequentists, But Not Bayesians

  1.  **Frequentist Inference Relies on the *Sampling Distribution*:**
      *   Frequentist methods (like p-values and confidence intervals) are fundamentally based on the long-run behavior of a procedure *if the experiment were repeated an infinite number of times under identical conditions*.
      *   The p-value answers: "Assuming the null hypothesis (H₀) is true, what is the probability of obtaining data *as extreme as or more extreme than* what I actually observed, *given the specific experimental procedure I planned to use*?"
      *   **The Crucial Point:** The "experimental procedure" includes the *stopping rule*. The sampling distribution (the distribution of possible data outcomes under H₀) depends critically on *how* you decided to stop collecting data. Different stopping rules generate different sampling distributions.

  2.  **How Stopping Rules Change the Sampling Distribution:**
      *   **Fixed Sample Size (n=100):** Under H₀, the sampling distribution is well-defined (e.g., Binomial(100, p₀) for coin flips). The p-value is calculated directly from this distribution. Extreme results are rare.
      *   **Optional Stopping (Run until p<.05):** This rule *guarantees* you will eventually stop with p<.05 *even if H₀ is true*, simply because of random fluctuations. You're sampling from a *different* distribution – one defined by the stopping rule itself. Under this rule, extreme results (p<.05) are *common* under H₀ (eventually 100% of infinite runs would stop with p<.05!). The sampling distribution under H₀ has a much higher probability of producing a small p-value.

  3.  **Bayesian Inference Relies on the *Likelihood Principle*:**
      *   Bayes' Theorem: Posterior ∝ Likelihood × Prior
      *   The Likelihood Principle (LP) states: *All* the information about the parameter θ contained in the observed data **x** is encapsulated in the *likelihood function* L(θ | **x**). Two datasets yielding proportional likelihood functions provide *identical* evidence about θ.
      *   **The Crucial Point:** The stopping rule does *not* appear in the likelihood function L(θ | **x**) = P(**x** | θ). It only affects P(**x** | θ) through the data **x** itself. If two experiments, using different stopping rules, produce the *exact same dataset* **x**, then L(θ | **x**) is identical. Therefore, the posterior distribution depends *only* on the observed **x** and the prior, *not* on how you decided to stop collecting **x**.

  4.  **Illustrative Coin Flip Example:**
      *   **Scenario 1 (Fixed n=100):** You flip 100 times, get 62 Heads, 38 Tails. P-value for H₀: p=0.5 is ~0.02 (significant).
      *   **Scenario 2 (Optional Stopping):** You plan to flip until |Heads - Tails| >= 24. You happen to stop at flip 100 with 62 Heads, 38 Tails (same data!).
      *   **Frequentist Analysis:**
          *   Scenario 1: P-value ~0.02 (Significant).
          *   Scenario 2: The sampling distribution under H₀ includes *all paths* that hit |H-T|=24 *for the first time* at *any* n. The probability of hitting |H-T|=24 *by n=100* under H₀ is much higher than getting exactly 62/100. P-value is much larger (>0.05, not significant).
          *   *Why?* The procedure in Scenario 2 is *designed* to eventually find an imbalance, making an imbalance at n=100 less surprising under H₀ than in the fixed-n design.
      *   **Bayesian Analysis:**
          *   Both Scenarios: Observed data: 62 Heads in 100 flips. Likelihood L(p | data) ∝ p⁶²(1-p)³⁸. This is identical regardless of why you stopped at 100 flips. The posterior distribution for p depends *only* on 62 Heads, 38 Tails, and the prior. It's identical for both scenarios.

  ### Why This is a Major Driver of the Replication Crisis (Beyond Generic P-Hacking)

  1.  **Invisible Inflation of False Positive Rates:** Optional stopping is often *unplanned* and *undisclosed*. A researcher collects some data, checks for significance (p<.05), doesn't find it, collects more data, checks again... and stops when they finally get p<.05. **This dramatically inflates the Type I error rate (false positive rate) well above the nominal 5%.** Simulations show it can easily exceed 20-30% or more. The published p-value (calculated assuming a fixed-n design) is misleadingly small.
  2.  **Misinterpretation of Evidence:** The nominal p-value (calculated ignoring the stopping rule) vastly overstates the evidence against H₀ obtained via optional stopping. What looks like strong evidence (p=0.04) might actually be very weak evidence when the stopping rule is accounted for.
  3.  **Prevalence and Incentives:** The "collect some data, peek, collect more" workflow is extremely common in research (especially under pressure to publish positive results). Stopping rules are rarely pre-registered or reported accurately. The flexibility of optional stopping makes it easy to "find" significant results by accident.
  4.  **Systematic Bias in the Literature:** Journals preferentially publish "significant" results (p<.05). Studies that used optional stopping to achieve significance are more likely to be published, but their results are less likely to be true (higher FDR) and much less likely to replicate, precisely *because* the p-value was miscalculated by ignoring the stopping rule.
  5.  **Bayesian Robustness (Theoretical Solution):** Bayesian analysis, by adhering to the Likelihood Principle, automatically accounts for optional stopping *in the evidence reported*. The posterior distribution reflects the evidence *actually in the data*, regardless of the path taken to collect it. While priors are crucial and can be debated, the stopping rule itself doesn't corrupt the reported measure of evidence. Pre-registration and planned stopping are still good scientific practice for Bayesians to avoid bias in design/analysis choices, but the core inference isn't invalidated by the stopping rule like it is for frequentists.

  **In essence:** The replication crisis is fueled by statistical results (p-values) that claim a certain level of reliability (e.g., 5% false positive rate) but are actually much less reliable due to undisclosed flexibility in data collection, primarily optional stopping. Frequentist inference *requires* strict adherence to the planned experimental protocol (including stopping rules) for its error rate guarantees to hold. Bayesian inference, by relying solely on the observed data via the likelihood principle, is immune to this specific problem. The core issue isn't just that p-hacking is "bad," but that the *fundamental meaning and calibration of the p-value* are destroyed by optional stopping, leading to systematically over-optimistic and unreplicable published findings.
