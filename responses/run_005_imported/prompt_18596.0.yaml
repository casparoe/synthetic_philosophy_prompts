answer: |-
  ## Investment Committee Memo: Recommendation on Trend-Following Manager Position Sizing

  **To:** Investment Committee Trustees  
  **From:** [Your Name], Trustee  
  **Date:** [Date]  
  **Subject:** Recommendation on Dynamic ("Half-Kelly") Sizing for Trend-Following Strategy (8% Sleeve)  

  ### Background
  Our trend-following manager (8% of AUM) proposes replacing the current fixed volatility-targeted allocation with a dynamic "half-Kelly" sizing rule. This approach would size positions based on his real-time estimates of edge (expected return) and payoff odds, aiming to maximize long-run geometric growth. The current approach targets a fixed volatility band.  

  ### Recommendation: **Reject the Pure Half-Kelly Proposal**  
  **Approve a Hybrid Approach with Strict Guardrails** (details below).  

  ### Reasoning: Balancing Theoretical Appeal with Prudent Fiduciary Reality  
  The debate centers on two valid but conflicting frameworks for rational risk-taking:  

  1.  **The Geometric Growth (Ergodicity) Perspective (Ravi’s View):**  
      *   **Core Argument:** Wealth compounds multiplicatively *along a single path*. Maximizing long-run growth requires optimizing for geometric returns (via Kelly), not arithmetic averages. Fixed vol-targeting ignores the manager’s perceived edge, potentially leaving returns "on the table" or taking inefficient risk. Half-Kelly is a conservative implementation aiming for most of the growth benefit with reduced risk.  
      *   **Theoretical Strength:** Mathematically sound for maximizing growth *if* the estimated probabilities and payoffs are accurate and stable, and the time horizon is sufficiently long.  

  2.  **The Expected Utility & Uncertainty Perspective (Linda’s View):**  
      *   **Core Argument:** Kelly (even half-Kelly) *is not utility-free*. It implicitly assumes logarithmic utility, which is highly risk-averse over large losses – precisely the scenario we must avoid. Crucially, **"edge" is never known with certainty.** Underestimation leads to forgone gains, but overestimation leads to ruinous overallocation. Real-world uncertainty, parameter drift (especially in trend-following), and path dependency mean the "long run" may never arrive after severe drawdowns. Samuelson's critique highlights that Kelly isn't universally optimal; its superiority depends heavily on specific, often unrealistic, assumptions.  
      *   **Fiduciary Imperative:** Our mandate prioritizes capital preservation ("don't blow it up"). A strategy susceptible to catastrophic loss due to estimation error is fundamentally misaligned, regardless of its theoretical long-run promise.  

  ### The Crux: Uncertainty vs. Optimization
  The genuine disagreement isn't about mathematics, but about **context and applicability:**  
  *   **Ravi/Rational Choice Context:** Assumes reliable probability/edge estimates and a sufficiently long, uninterrupted time horizon. Focuses on maximizing a specific objective (growth).  
  *   **Linda/Fiduciary Context:** Prioritizes robustness under *uncertainty* and *parameter misestimation*. Focuses on avoiding existential risk, acknowledging that foundations operate in the real world of finite horizons and fragile confidence.  

  **For a $40M foundation with a preservation mandate, Linda's concerns are paramount.** Kelly's vulnerability to "garbage-in, garbage-out" (overestimated edge) poses an unacceptable tail risk. Trend-following edges are notoriously unstable and hard to estimate reliably.  

  ### Recommendation: Hybrid Approach with Guardrails
  Rejecting the manager's pure half-Kelly proposal is necessary for prudence. However, completely dismissing the potential for more dynamic sizing based on opportunity would be overly conservative. Therefore, I recommend:  

  1.  **Approve Dynamic Sizing *Conditionally*:** Allow the manager to implement a *modified* dynamic sizing approach **only if** the following guardrails are strictly adhered to:  
      *   **a) Hard Volatility Cap:** The *ex-post* volatility of the sleeve, measured monthly (using a 30-60 day lookback), **must not exceed** the *current* fixed vol target. This is non-negotiable. It ensures the foundation's overall risk tolerance is respected, regardless of the manager's "edge" claims.  
      *   **b) Formalized Edge Estimation Protocol:** The manager must provide a *rigorous, transparent, and documented methodology* for estimating edge and payoff odds *in real-time*. This must include:  
          *   Explicit formulas and data sources.  
          *   Clear confidence intervals around estimates (acknowledging uncertainty).  
          *   Backtesting demonstrating robustness of the estimation process across regimes.  
          *   Independent verification (by CIO or consultant) of the methodology's soundness.  
      *   **c) "Half-Kelly" as a *Ceiling*, Not a Target:** Position sizing should be calculated as **min(Half-Kelly Output, Fixed-Vol Sizing Equivalent)**. This explicitly prevents overallocation beyond the foundation's established risk tolerance based solely on the manager's optimistic edge estimates.  

  2.  **Reject Pure Half-Kelly:** The manager's original proposal, lacking a hard volatility cap and relying solely on his internal edge estimates without robust external verification and an allocation ceiling, is rejected due to unacceptable tail risk under uncertainty.  

  3.  **Implement Enhanced Monitoring:**  
      *   Report sleeve volatility (realized) vs. target monthly.  
      *   Report the calculated "Half-Kelly" size vs. the actual allocated size monthly.  
      *   Require formal review of the edge estimation methodology and its performance quarterly.  

  ### Why This Approach?
  *   **Preserves Capital First:** The hard vol cap ensures we don't exceed our fundamental risk tolerance.  
  *   **Captures *Some* Opportunity:** Allows the manager to *reduce* position sizes when his estimated edge is low (potentially protecting capital), and *increase* towards (but not beyond) the fixed-vol size when edge is high and volatility allows.  
  *   **Forces Discipline on Edge Estimation:** Mandating transparency and verification tackles the core weakness Linda identified – the peril of overestimating edge.  
  *   **Explicitly Manages the Utility Conflict:** By capping the size at the fixed-vol equivalent, we acknowledge that the foundation's utility function (highly loss-averse) differs from log-utility implied by pure Kelly.  
  *   **Actionable & Monitorable:** Provides clear rules and reporting requirements.  

  ### Conclusion
  The geometric growth perspective is theoretically compelling but rests on assumptions too fragile for our fiduciary duty under real-world uncertainty. Linda's emphasis on parameter misestimation and path dependency is well-founded and decisive for a capital-preservation focused foundation.  

  Rejecting the manager's pure half-Kelly proposal is essential. However, a tightly controlled hybrid approach, mandating a hard volatility cap, rigorous edge estimation, and using half-Kelly only as a potential *downside* filter (not an upside lever), offers a prudent middle path. It allows for some responsiveness to perceived opportunity while strictly prioritizing the foundation's paramount objective: **not blowing it up.**  

  **Recommendation:**  
  ☑ **Approve the Hybrid Approach with Guardrails (1a, 1b, 1c) and Enhanced Monitoring.**  
  ☐ Reject the Manager's Half-Kelly Proposal.  
  ☐ Maintain Status Quo (Fixed Vol-Targeting).  

  **Submitted for discussion and vote at the meeting on [Date].**
