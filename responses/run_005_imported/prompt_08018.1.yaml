  ## Williamson's Anti-Luminosity Argument and the Fate of the KK Principle: A Verdict

  Timothy Williamson’s anti-luminosity argument, presented forcefully in *Knowledge and Its Limits*, is a landmark challenge to internalist conceptions of knowledge. Its implications for the KK principle (Kp → KKp) – the idea that knowing entails knowing that you know – are profound and, I argue, largely successful. While objections highlight important nuances, Williamson’s core argument provides compelling, non-question-begging reasons to reject KK as a universal epistemic principle. Here’s a detailed reconstruction, engagement with a key objection, and a defended verdict.

  **I. The Argument Reconstructed: Margin for Error and the Sorites of Self-Knowledge**

  Williamson targets **luminosity**: the idea that certain conditions (especially mental states like feeling cold) are such that whenever they obtain, one is automatically *in a position to know* they obtain. His weapon is a Sorites paradox applied to gradual, imperceptible change, coupled with a "margin for error" principle derived from the fallibility of our discriminatory capacities.

  1.  **The Scenario:** Imagine you are sitting in a room that warms up very slowly over a period of time, starting very cold and ending comfortably warm. The warming is so gradual that between any two adjacent moments, you cannot detect any difference in how cold you feel. At time t0, you feel cold. At time tn, you do not feel cold.
  2.  **The Luminosity Hypothesis (Target):** Suppose "feeling cold" is luminous. Then:
      *   Whenever you feel cold, you are in a position to know you feel cold.
      *   Whenever you do not feel cold, you are in a position to know you do not feel cold. (This is often implicit; luminosity claims typically assume the condition is knowable when it obtains, implying its negation is knowable when *it* obtains).
  3.  **The Margin for Error Principle (Crucial Premise):** Williamson argues that for you to *know* at time ti that you feel cold, it must be that you feel cold not only at ti, but also at times sufficiently close to ti. Why? Because your discriminatory capacities are imperfect.
      *   If the condition (feeling cold) could change imperceptibly between ti and a very nearby time tj, then if you *didn't* feel cold at tj but judged at ti that you *did* feel cold (based on your state at ti), your judgment at ti would be unsafe. It could easily have been false (if the change had occurred slightly earlier).
      *   Knowledge requires **safety**: a belief constitutes knowledge only if it is not easily mistaken in nearby possible worlds. In this context, "nearby worlds" means worlds where the relevant conditions (temperature, your sensory state) are very similar.
      *   Therefore: **K(Feeling cold at ti) → Feeling cold at ti+1** (for adjacent times in the series). Your knowledge at ti requires the condition to hold with a "margin for error" extending to ti+1 to ensure safety against imperceptible change. (The argument generalizes: knowledge at ti requires the condition to hold at all times within a certain interval around ti, determined by the fineness of your discrimination).
  4.  **The Sorites Setup:** Consider the sequence of times: t0, t1, t1, ..., tn. By hypothesis:
      *   At t0: You feel cold. (True)
      *   At tn: You do not feel cold. (True)
      *   Adjacent Indiscriminability: For any adjacent times ti and ti+1, you cannot discriminate your feeling of coldness between them.
  5.  **The Contradiction (Assuming Luminosity + Margin for Error):**
      *   **Base Step:** At t0, you feel cold. By Luminosity, you are in a position to *know* you feel cold at t0 (K-Cold(t0)).
      *   **Margin for Error Application:** K-Cold(t0) requires, by the safety/margin principle, that you feel cold at t1. (Because if you *didn't* feel cold at t1, your judgment "I feel cold" at t0 could easily have been false – the change could have happened slightly earlier).
      *   **Induction Step:** Suppose you feel cold at ti (established for i=0, now assume for i=k). By Luminosity, you are in a position to know this (K-Cold(tk)). By the Margin for Error principle, K-Cold(tk) requires you feel cold at tk+1.
      *   **Conclusion:** By induction, you feel cold at *all* times, including tn. But this contradicts the initial stipulation that you do *not* feel cold at tn.
  6.  **Conclusion of the Anti-Luminosity Argument:** The assumption that "feeling cold" is luminous leads to a contradiction (you both do and do not feel cold at tn). Therefore, "feeling cold" is not luminous. There is a time ti where you feel cold but are *not* in a position to know you feel cold.

  **II. Generalization to KK**

  Williamson’s target isn't just feeling cold; it's *any* non-trivial condition vulnerable to imperceptible change. Crucially, this includes **the condition of knowing that p (Kp)**.

  1.  **KK as Luminosity Applied to Kp:** The KK principle (Kp → KKp) *is* precisely the claim that the condition *knowing that p* is luminous. If Kp obtains, KKp claims you are thereby automatically in a position to know that Kp obtains.
  2.  **The Slow-Warming Room for Knowledge:** Imagine a sequence of very similar evidential situations regarding a proposition p. At the start (S0), your evidence is clearly sufficient for Kp. Gradually, imperceptibly, your evidence weakens (e.g., lighting fades for a visual proposition, memory degrades, counter-evidence accumulates subtly). At the end (Sn), your evidence is clearly *insufficient* for Kp. Adjacent situations Si and Si+1 are evidentially indiscriminable to you.
  3.  **Applying the Argument:**
      *   **Luminosity Target:** Kp is luminous (KK principle: Kp → KKp).
      *   **Margin for Error for Knowledge of Knowledge:** For you to know that you know p at Si (KKp(Si)), your belief "I know p" must be safe. This requires that you *actually* know p not only at Si, but also at situations sufficiently similar to Si (i.e., at Si+1). If you *didn't* know p at Si+1, but judged "I know p" at Si, that judgment could easily have been false (if the evidential weakening had happened slightly earlier). Thus: **KKp(Si) → Kp(Si+1)**.
      *   **The Sorites Contradiction:**
          *   At S0: Kp holds. By Luminosity/KK, KKp holds (you know you know).
          *   KKp(S0) requires Kp(S1) (Margin for Error).
          *   Kp(S1) implies KKp(S1) (KK principle), which requires Kp(S2).
          *   ...Continuing inductively...
          *   Therefore, Kp(Sn). But by stipulation, Kp does *not* hold at Sn. Contradiction.
  4.  **Conclusion:** The assumption that Kp is luminous (i.e., that the KK principle holds universally) leads to a contradiction. Therefore, the KK principle is false. There is some situation Si where you know p but are *not* in a position to know that you know p. Self-knowledge of one's knowledge is not always available on demand; it too requires a margin for error and can fail in borderline epistemic situations.

  **III. Engaging a Strong Objection: The Circularity/Smuggling Charge**

  The most persistent objection, championed by philosophers like Ram Neta and Guy Rohrbaugh ("Luminosity and the Safety of Knowledge", *Pacific Philosophical Quarterly* 2004), argues that Williamson’s Margin for Error principle **smuggles in the denial of luminosity** it purports to prove. The charge is one of **circularity** or **question-begging**.

  *   **The Objection Stated:** The argument relies on the claim that K-Cold(ti) requires Cold(ti+1). Why should we accept this? It seems plausible *only if we already assume that our judgment at ti isn't based on some luminous, infallible access to our state at ti*. If feeling cold *were* luminous, then at ti, you would have direct, certain access to your state *at ti*. The possibility of a change *after* ti (at ti+1) shouldn't threaten knowledge *of the state at ti*. Your knowledge at ti is about ti, not ti+1. The requirement that Cold(ti+1) must hold for K-Cold(ti) seems to demand that your knowledge at ti guarantees the state at ti+1 – a demand only justified if your access at ti is *already* fallible and world-involving (i.e., non-luminous). Williamson assumes the falsity of luminosity (specifically, the non-existence of infallible, purely internal access) to justify the premise that proves the falsity of luminosity. The premise presupposes its conclusion.
  *   **Williamson's Defense (Safety and the Nature of Knowledge):** Williamson counters that the Margin for Error principle is *not* derived from assumptions about luminosity, but from a general, externalist condition on knowledge: **safety**.
      *   Knowledge requires that your true belief could not easily have been false.
      *   In the Sorites series, your belief "I feel cold" at ti is formed based on your current sensory state. However, due to the imperceptibility of change between ti and ti+1, the *method* you use to form the belief "I feel cold" at ti (relying on your feeling) is a method that, in a situation indiscriminable from ti (namely ti+1), would deliver the *false* belief "I feel cold" if you were at ti+1 (where you don't feel cold).
      *   Therefore, for your belief "I feel cold" at ti to be *safe*, it must be that in all very similar situations (including ti+1), you *do* feel cold. If you didn't feel cold at ti+1, then your belief at ti *could easily have been false* – you could easily have been in ti+1 (or a state indiscriminable from ti but where you don't feel cold) and formed the same belief falsely. Safety *demands* Cold(ti+1) as a condition for K-Cold(ti).
      *   **Crucially:** Safety is presented as a *general*, *independent* necessary condition for knowledge, grounded in an externalist, anti-lucky-true-belief conception. It does not *presuppose* the failure of luminosity; it *explains why luminosity must fail* in non-trivial cases. Luminosity claims that the condition's obtaining *suffices* for being in a position to know. Safety shows that even if the condition obtains, being in a position to know *also* requires that the condition holds with a margin for error, which fails at the Sorites boundary. The argument uses a general constraint on knowledge (safety) to show a specific claim about access (luminosity) is untenable.
  *   **Assessment of the Objection:** The circularity charge is powerful and exposes the deep rift between internalist and externalist intuitions. However, Williamson's defense is robust:
      1.  **Safety as Independent:** Safety is a widely accepted (though debated) condition on knowledge, defended on grounds independent of the luminosity debate (e.g., lottery/gettier cases). Demanding that knowledge be safe from error in close counterfactual scenarios isn't *ad hoc* for this argument.
      2.  **The Method Matters:** Williamson correctly emphasizes that the method of belief formation (introspecting feeling) is the same across indiscriminable situations. The safety condition applies *to beliefs formed by that method*. If the method yields false beliefs in indiscriminable situations, it cannot yield knowledge in the actual situation. This directly challenges the internalist idea that introspection provides a special, methodologically immune route to certainty.
      3.  **The Luminosity Claim is Strong:** The objection relies on interpreting luminosity as providing *infallible* access. Williamson is targeting precisely this strong claim. If the internalist retreats to a weaker claim (e.g., access is usually reliable, but not infallible or luminous), they concede Williamson's core point: luminosity fails. The argument effectively shows that infallible access is incompatible with our gradual, world-embedded existence. The margin for error arises *because* we are fallible discriminators, not as a premise smuggled in to *make* us fallible.

  **IV. The Verdict: Yes, Anti-Luminosity Provides Good Reason to Reject KK**

  Williamson's argument successfully undermines the KK principle. Here's why:

  1.  **The Core Insight Stands:** The Sorites structure combined with the safety requirement powerfully demonstrates that conditions subject to gradual, imperceptible change cannot be known with the kind of infallible, on-demand certainty required by strong luminosity. This applies directly to knowledge itself (Kp) as a condition. The existence of "borderline knowledge" cases – situations where we know p, but our evidence is so close to the threshold of insufficiency that we cannot safely discriminate our state from one of non-knowledge – is a compelling consequence of our finite discriminatory capacities. KK denies such borderline cases exist; Williamson shows they must.
  2.  **Safety Trumps Infallible Access:** The safety-based defense against the circularity objection is convincing. The demand for a margin for error stems from a plausible, general, and independently motivated externalist constraint on knowledge, not from a covert assumption of anti-luminosity. It reveals that the internalist hope for luminous access, especially to a state as world-involving as knowledge, is incompatible with the safety condition knowledge demonstrably requires.
  3.  **Defeats Strong Internalism:** The argument delivers a decisive blow to access internalist views that posit a necessary, privileged, and luminous connection between being in an epistemic state (like knowing) and being aware of being in that state. It forces internalists towards more modest positions (e.g., default justification, defeasible access) that acknowledge the possibility of knowing without knowing that you know.
  4.  **Scope and Significance:** While the argument doesn't eradicate *all* self-knowledge or render KK *never* true (in clear-cut cases far from thresholds, KK may hold), it demonstrates that KK cannot hold *as a necessary, universal principle* governing all knowledge. This is a significant result. It means epistemology must accommodate the possibility of "unknowing knowledge" at the margins, undermining a cornerstone of internalist and rationalist traditions that emphasize transparent access to our own minds as the foundation of justification and knowledge.

  **Caveat and Nuance:** The victory is for Williamson's *target*: the strong luminosity thesis applied to Kp, interpreted as requiring infallible, on-demand access that guarantees KKp whenever Kp holds. One might salvage a *weaker* KK principle (e.g., Kp typically or defeasibly supports KKp, or KKp is achievable upon sufficient reflection) by rejecting the strong luminosity claim. However, Williamson's argument shows that *any* principle demanding that Kp *entails* being in a position to know Kp (i.e., the core KK principle) is untenable due to the margin for error required by safety. The knowledge relation itself is not luminous.

  **Conclusion:** Williamson's anti-luminosity argument, grounded in a margin-for-error requirement derived from the safety condition on knowledge and applied via a Sorites series to the state of knowing itself, provides a powerful, non-circular, and well-supported reason to reject the KK principle as a universal epistemic law. It compellingly demonstrates that our capacity for self-knowledge, even of our own epistemic states, is constrained by our fallible, gradualist interaction with the world, leaving room for knowing without knowing that we know. The burden now lies with defenders of KK to either refute the safety condition itself, demonstrate a fatal flaw in the Sorites application to knowledge states, or significantly weaken their principle to accommodate Williamson's ineliminable margin for error.
