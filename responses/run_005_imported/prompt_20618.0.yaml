answer: |-
  You've hit upon a genuinely fascinating and complex aspect of Sidgwick's intellectual life, far beyond a mere "quirky footnote." While your supervisor is correct that it shouldn't *dominate* an EE focused on *The Methods of Ethics*, understanding Sidgwick's psychical research **is crucial for grasping the depth of his philosophical character, his motivations, and the existential anxieties underlying his rigorous utilitarianism.** Dismissing it risks misunderstanding Sidgwick himself.

  Here's why your suspicions need refinement and why the connection is deeper than compartmentalization:

  1.  **Context is Crucial: Victorian Science & Crisis of Faith:**
      *   **Not "Ghost-Hunting":** The SPR (co-founded 1882) was explicitly formed as a *scientific* body. Its founding members included prominent scientists (Lord Rayleigh, Nobel laureate in Physics), philosophers (James Ward, William James), and scholars. Their goal wasn't credulity, but applying rigorous scientific methods (controlled experiments, statistical analysis, exposure of fraud) to phenomena widely reported but poorly understood (telepathy, hypnosis, clairvoyance, mediumship).
      *   **Legitimate Frontier:** In the late 19th century, the boundaries of science were rapidly expanding. Physics was revealing unseen forces (electromagnetism, X-rays), biology was grappling with evolution and consciousness, and psychology was nascent. Investigating "psychical" phenomena was seen by many serious thinkers as a legitimate, albeit highly speculative, frontier of inquiry – akin to early investigations into radiation or neurology.
      *   **The Crisis of Faith:** Sidgwick, like many Victorians (e.g., Tennyson, George Eliot), experienced a profound crisis of religious faith. He resigned his Cambridge Fellowship in 1869 because he could no longer subscribe to the Anglican creed in good conscience. This loss was deeply personal and philosophically significant.

  2.  **Sidgwick's Motivation: The Foundation of Ethics:**
      *   **The "Dualism of Practical Reason":** This is the *core* problem Sidgwick grappled with in *Methods*. Reason, he argued, points towards two ultimately irreconcilable principles: **Utilitarianism** (maximize general happiness) and **Rational Egoism** (maximize one's own happiness). He desperately sought a way to reconcile them.
      *   **The Need for Sanctions:** Sidgwick saw that Utilitarianism, especially demanding self-sacrifice, lacked a *rational* guarantee that virtue would be rewarded or that the universe was fundamentally just. Traditional religion provided this via divine sanctions and an afterlife. Without faith, where was the rational basis for believing that acting morally (especially when costly) aligned with one's ultimate good?
      *   **Psychical Research as Empirical Hope:** Sidgwick saw psychical research, particularly evidence for **survival after death** and potentially **telepathy** (suggesting a non-material basis for mind), as the *only possible empirical path* to resolving the Dualism. If consciousness survived death, perhaps a just cosmic order existed where virtue *was* ultimately rewarded, providing the needed sanction for Utilitarian sacrifice. As he wrote to a friend: *"I have always felt that to hold our position in the universe with any satisfaction we must have the prospect of survival... I cannot imagine any evidence that would be sufficient to prove survival except that afforded by telepathy."*

  3.  **Methodological Rigor Applied Consistently:**
      *   **Skepticism in Both Fields:** Sidgwick brought the same relentless critical scrutiny to psychical research that he applied to ethics. He was instrumental in developing rigorous protocols for testing mediums, meticulously documenting séances, exposing fraud (he helped expose several famous mediums), and demanding high standards of evidence. His approach was the *antithesis* of credulous ghost-hunting; it was skeptical, demanding, and frustrated by the elusive nature of the evidence.
      *   **Driven by Doubt, Not Belief:** Sidgwick wasn't a believer seeking confirmation; he was a profound skeptic desperately *hoping* for evidence to resolve a foundational philosophical problem. His involvement stemmed from intellectual honesty in confronting the implications of his own ethical conclusions. As philosopher C.D. Broad later noted, Sidgwick investigated psychical phenomena "not because he *wanted* to believe, but because he *had* to know."

  4.  **The Connection to Ethics: Not Compartmentalized, but Foundational:**
      *   **The Unresolved Tension:** Sidgwick never found the conclusive evidence he sought. His psychical research ended in disappointment. This failure left the "Dualism of Practical Reason" unresolved in *Methods*. The book famously ends on a note of profound, almost tragic, intellectual honesty: he sees no rational way to fully reconcile duty and self-interest without some postulate like a divine moral order, which reason alone cannot establish.
      *   **Motivational Source:** Psychical research wasn't a separate hobby; it was the *empirical arm* of his lifelong struggle to find a rational foundation for ethics that could satisfy both the demands of universal benevolence and individual rationality after the collapse of religious faith. It was driven by the *same* deep anxiety about the rationality of morality that animated *Methods*.

  **Conclusion & Advice for Your EE:**

  *   **You are partially right:** His psychical research *doesn't directly alter the logical arguments* within *The Methods of Ethics*. The ethical theory stands on its own reasoning.
  *   **You are likely wrong:** To see it as merely lowering his credibility as a rigorous thinker or as a compartmentalized hobby **misses the profound existential and motivational link to his ethical project**. It demonstrates the *depth* of his commitment to rationality and the *seriousness* with which he confronted the bleak implications of his own conclusions.
  *   **What you're missing:**
      *   The specific historical/scientific context of Victorian psychical research.
      *   Sidgwick's personal crisis of faith as the *engine* driving both his ethical rigor and his empirical quest.
      *   The direct link between the unresolved "Dualism" and the *hope* that psychical evidence could provide a rational sanction for Utilitarianism.

  **How to Handle This in Your EE (Without Wasting Word Count):**

  1.  **Brief Context in Introduction/Biography:** Mentioning his psychical research *very briefly* when introducing Sidgwick as a thinker adds crucial depth. Frame it as: "A deeply rigorous and self-critical philosopher, Sidgwick was also profoundly concerned with the rational foundations of morality in a post-theistic world, leading him to co-found the Society for Psychical Research in a decades-long, albeit ultimately unsuccessful, empirical search for evidence that might resolve the fundamental tension he identified between duty and self-interest." (1-2 sentences).
  2.  **Crucial for Understanding the "Dualism":** When discussing the "Dualism of Practical Reason" and the book's famously unresolved conclusion, you *can* briefly reference this motivation: "Sidgwick's personal struggle with this dualism was so intense that he spent decades pursuing empirical psychical research, hoping to find evidence for survival or a cosmic moral order that could rationally reconcile the two principles, an effort that ultimately proved fruitless." (1 sentence). This adds immense weight to understanding the *significance* and *stakes* of the Dualism.
  3.  **Demonstrating Intellectual Character:** A sentence noting his consistent methodological rigor across ethics *and* psychical research can underscore his commitment to reason and evidence, even in unpromising areas.

  **In essence:** Sidgwick's psychical research wasn't a lapse in rigor; it was rigor applied to the deepest, most unsettling question his own ethics raised. It doesn't change the logic of *Methods*, but it illuminates the profound human and philosophical urgency behind it. Mentioning it concisely, *in the context of his motivation and the unresolved Dualism*, is not a waste of words; it enriches the reader's understanding of Sidgwick the philosopher and the existential weight carried by his masterwork. It shows that his ethics wasn't just an intellectual exercise, but a desperate search for meaning in a potentially indifferent universe. This context makes his rigorous utilitarianism even more compelling and human.
