  Hmm, this is a sophisticated philosophical challenge. The key tension is between the consequentialist-friendly framing of moral trade (which focuses on states of affairs) and non-consequentialist views that care about agents' reasons and motivations. 

  First, I should articulate the objection powerfully: for theories where moral worth depends on acting from duty (Kant) or expressing virtue (Aristotle), a trade-based abstention might be morally worthless or even worse than doing nothing. Like Kant's shopkeeper example - honest dealing for profit lacks moral worth. Similarly, if I care about you not factory farming because you genuinely respect animal dignity, your abstention as a transactional bargain might not satisfy my moral concerns at all. 

  Then I need steelman the pro-trade replies: 
  1) Most theories still care about acts occurring, even if motives matter too. Preventing factory farming still reduces suffering, which matters to many non-consequentialists. 
  2) Traders could have mixed motives - both honoring the trade and believing the act is wrong. 
  3) We might distinguish between what's traded (the act) and why it's done (which isn't part of the bargain). 
  4) For pluralistic agents, the trade might still be net positive by their own lights.

  But these replies have weaknesses. The first downplays how central motive is for some theories. Mixed motives might still "contaminate" the action's moral status. And if my theory says your bad motive makes your abstention morally irrelevant, then I haven't gained anything.

  My verdict leans toward the objection having real force but not being fatal. Moral trade works cleanly for consequence-focused views but gets messy with motive-sensitive ones. Still, in practice, many trades involve acts where the outcome matters more than the motive (like reducing animal suffering), so the framework remains useful - just with important limitations that Ord should acknowledge. The user should stress this in their reading group: moral trade isn't universally applicable but remains powerful where consequences dominate.
answer: |-
  Here's a rigorous analysis of the motive-sensitivity objection to moral trade, structured as requested:

  ### The Strongest Form of the Objection
  Moral trade fundamentally misrepresents the ontology of moral value for motive-sensitive theories by assuming moral value resides solely in *states of affairs* (e.g., "factory farms cease operating"). For Kantians, virtue ethicists, and other reason-focused views, moral value is *constituted* by the agent's reasons for acting. When you trade abstention for concession:

  1.  **Kantian Collapse**: Kant's core distinction between acting *from duty* vs. *in conformity with duty* renders abstention-for-trade morally inert. If you stop factory farming *because I paid you* (via concession), you act merely in conformity with duty (if duty even applies here), not *from* duty. The moral worth I (as a Kantian) value is absent. Your abstention is no more morally significant than a broken vending machine failing to dispense meat. I gain nothing of *moral value* by my lights.

  2.  **Virtue-Ethical Degradation**: Virtue ethics often ties an act's moral status to the character it expresses. Abstention-for-trade expresses *prudence* (enlightened self-interest) or *bargaining*, not compassion, justice, or respect. For the virtue ethicist who values the cultivation/reward of virtuous dispositions, your trade-motivated abstention might be *worse* than continued wrongdoing. At best, it's non-virtuous; at worst, it instrumentalizes morality itself, expressing a vice like moral mercantilism.

  3.  **The Double-Bind for the Motive-Sensitive Trader**:
      *   If *I* hold a motive-sensitive view and trade *my* abstention (e.g., forgoing trophy hunting to get you to stop factory farming), I act for the *wrong reason* (bargain, not conviction). By my *own* lights, I've corrupted my own action's moral worth. My "gain" (your abstention) is purchased at the cost of my moral integrity.
      *   If *you* hold a motive-sensitive view, your abstention lacks the moral quality I (even if I'm consequentialist) might hope for (e.g., genuine respect for animals). But crucially, if *I* am motive-sensitive, your abstention's lack of proper motive renders it morally irrelevant to me.

  **Conclusion of the Objection**: Moral trade promises a Pareto improvement in "the world" as assessed by each agent's values. However, for motive-sensitive agents, the relevant "world" includes the *reasons* and *motives* behind acts. The trade transforms the act of abstention into a qualitatively different, and often morally inferior or even worthless, kind of event. Thus, the "improved" state of affairs is not actually better *by their own lights* because the essential moral component (proper motivation) is absent. Ord's framework implicitly assumes moral value supervenes solely on physical/behavioral outcomes, ignoring the constitutive role of reasons.

  ### Best Replies from a Defender of Moral Trade

  1.  **Outcomes Still Matter (Even to Non-Consequentialists)**:
      *   *Argument:* Few plausible ethical theories are *purely* motive-based with zero concern for consequences. The Kantian cares that duties *are fulfilled* (even if moral worth requires more). The virtue ethicist cares that harmful *acts cease* (even if the agent's character is imperfect). Preventing animal suffering in factory farms *is* a good state of affairs, distinct from the motive behind its prevention. The trade secures this tangible good.
      *   *Strength:* Acknowledges motive matters but insists outcome matters too. The trade delivers a concrete benefit that wasn't present before.
      *   *Weakness:* Doesn't address whether the *specific* moral value sought by the motive-sensitive agent (e.g., recognition of duty, expression of virtue) is achieved. The outcome might be necessary but insufficient for the full moral improvement they desire.

  2.  **Distinguishing the Act from the Agent's Motive**:
      *   *Argument:* The trade agreement specifies *actions* (e.g., "You refrain from factory farming"). It does not specify *why* the agent performs the action. The trading partner *could* perform the action for the "right" reason, even within the trade context. They might privately endorse the duty/virtue *and* recognize the trade as a coordination mechanism. The trade provides the *opportunity* for right action without dictating the motive.
      *   *Strength:* Separates the contractual terms (the act) from the psychological state (the motive), preserving the possibility of genuine moral action within the trade.
      *   *Weakness:* This seems psychologically unstable or disingenuous. Can one *sincerely* abstain from trophy hunting *because it's cruel* while simultaneously knowing one is only doing it as part of a bargain to get the vegetarian to comply? The explicit instrumentalization of the act for personal gain (the concession) threatens to dominate or corrupt the non-instrumental motive.

  3.  **Moral Trade as Catalyst for Moral Development**:
      *   *Argument:* Engaging in the trade might *lead* to the development of better motives. By abstaining from an act initially for trade reasons, the agent might come to appreciate the intrinsic reasons for abstention (e.g., experiencing life without factory farm products might foster genuine concern for animals). The trade serves as a stepping stone.
      *   *Strength:* Offers a dynamic, long-term perspective where the immediate motive-insensitivity is a temporary cost on the path to genuine moral improvement.
      *   *Weakness:* Highly speculative. It provides no guarantee and doesn't address the *immediate* moral assessment of the traded act itself by the motive-sensitive agent. The trade might just as easily entrench instrumental reasoning.

  4.  **Pluralism and Thresholds within Motive-Sensitive Views**:
      *   *Argument:* Many motive-sensitive agents are pluralists or accept thresholds. While ideal moral action requires pure motives, *preventing significant harm* (e.g., ending factory farming) might be so important that it outweighs concerns about the *other party's* motive for abstaining. By their own pluralistic lights, the net state of affairs (harm prevented, even for the "wrong" reason) is better than the status quo.
      *   *Strength:* Leverages the complexity of real-world moral views. Few Kantians would argue that stopping genocide for selfish reasons is morally equivalent to allowing it.
      *   *Weakness:* Concedes the core point: the abstention *itself* lacks its full moral value. It argues this deficiency is outweighed, not that it doesn't exist. It also doesn't resolve the trader's own potential corruption if they act for the bargain.

  ### Considered Verdict: The Objection Succeeds in Exposing a Critical Limitation, But Not a Fatal Flaw

  1.  **Success of the Objection:**
      *   The objection successfully demonstrates that Ord's core presentation of moral trade **implicitly assumes a consequentialist or strongly outcome-focused ontology of moral value**. It struggles significantly with theories where moral value is constitutively tied to the agent's reasons or character.
      *   It forces a crucial clarification: Moral trade reliably delivers a Pareto improvement *only in the dimension of physical/behavioral outcomes*. It cannot guarantee an improvement *in the dimension of moral motivation or the realization of motive-dependent goods*.
      *   For agents holding *purely* motive-sensitive views (e.g., a strict Kantian who values *only* actions done from duty, deeming all others morally irrelevant), moral trade is likely impossible or even counterproductive. Your abstention-for-consideration provides me with no moral gain by my lights, and my participation in the trade may corrupt my own actions.

  2.  **Where Moral Trade Can Still Function (With Caveats):**
      *   **Outcome-Sensitive Components:** Most real-world ethical views, even Kantian or Virtue-Ethical ones, incorporate *some* concern for consequences. Moral trade can deliver improvements on *this* dimension. The vegetarian Kantian *does* value fewer animals suffering, even if the butcher's motive is impure.
      *   **Mixed Motives & Pluralism:** Agents often have mixed motives or accept plural sources of value. The trade can be structured to minimize motivational corruption (e.g., focusing on clear behavioral commitments) and leverage the outcome-focused elements of their view. The net improvement in tangible harms prevented might outweigh the motivational deficit *by their own complex lights*.
      *   **Focus on Harm Prevention:** Trades concerning acts primarily defined by their harmful consequences (suffering, death, rights violations) are more resilient. Preventing the harm retains significant value even if the motive is imperfect. Trades focused on symbolic acts or expressions of virtue are far more vulnerable.

  **Conclusion:** The motive-sensitivity objection does not destroy the concept of moral trade, but it **fundamentally qualifies its scope and promise**. It reveals that the advertised "Pareto improvement by each partner's own lights" is only guaranteed for the *outcome* aspect of their moral view. For agents with views where motive is not merely a contributor but a *constitutive element* of the relevant moral value, or for whom instrumentalizing morality is itself a vice, moral trade may fail to deliver a genuine improvement *by their own full lights*. Proponents must explicitly acknowledge this limitation: moral trade is a powerful tool primarily for resolving conflicts where the contested values are predominantly outcome-focused. Its applicability diminishes as the sensitivity to reasons and motives increases in the trading partners' moral frameworks. Future work needs to explicitly model motive-dependent utilities and explore whether "motivational side-payments" or refined trade structures could mitigate these concerns.
