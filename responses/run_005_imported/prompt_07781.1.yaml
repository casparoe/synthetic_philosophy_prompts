  The core disagreement seems to be: Sofia thinks Davidson's framework makes global skepticism incoherent because interpretation requires attributing mostly true beliefs anchored to reality through triangulation. Marcus counters that this only secures agreement relative to an interpreter's framework, not actual truth about the world.

  Looking at the moves:
