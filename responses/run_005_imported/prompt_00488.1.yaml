  But wait, what about the bot that we call "EvilBot" above? We saw that against FairBot, both defect. So EvilBot doesn't get an advantage. Then what is the vulnerability?

  The real vulnerability of FairBot is that it might cooperate with a bot that is not as cooperative as itself. Specifically, consider a bot that we'll call "FoolBot": FoolBot cooperates with FairBot if and only if it can prove that FairBot cooperates. That is, it has the same code as FairBot. But wait, that's FairBot again. So that's not the issue.

  The issue is with a bot that is not fully cooperative but can trick FairBot into cooperating while it defects. How? Consider a bot that is defined as:

    If I can prove that FairBot cooperates with me, then I defect.
    Otherwise, I cooperate.

  But note: this is the EvilBot we considered earlier. And we saw that against FairBot, both defect. So EvilBot doesn't get an advantage.

  However, there is another bot: the one that always defects (DefectBot). FairBot defects against DefectBot, so no loss. But what if there is a bot that sometimes cooperates and sometimes defects? The problem is that FairBot might cooperate with a bot that is not reciprocal.

  But note: FairBot only cooperates if it can prove that the opponent cooperates. So if the opponent is DefectBot, FairBot doesn't cooperate. But what about a bot that cooperates only when it is facing a bot that is not FairBot? That is, it cooperates with everyone except FairBot. Then when facing FairBot, it defects. Then FairBot, as above, will defect. So again, mutual defection.

  So why do we need PrudentBot?

  The answer lies in the interaction with another type of bot: the one that is willing to cooperate only if it is facing a bot that will not cooperate with DefectBot. In other words, we want a bot that is not a "sucker": it doesn't want to cooperate with a bot that would also cooperate with DefectBot (because then that bot is not discriminating).

  PrudentBot is designed to avoid being exploited by such agents. The definition of PrudentBot (PB) is:

    PB cooperates with X if and only if 
