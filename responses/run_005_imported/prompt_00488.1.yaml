prompt: |-
  So I've been going down a rabbit hole on program equilibrium stuff - the setup where instead of picking a strategy directly, players submit programs that get to read each other's source code before acting (Tennenholtz's original idea, and then later the MIRI-adjacent paper "Robust Cooperation in the Prisoner's Dilemma" with FairBot and PrudentBot). The part that's melting my brain is this: FairBot cooperates with its opponent iff it can *prove* (in some fixed formal system like PA) that the opponent cooperates with it. That sounds hopelessly circular - to know whether the other guy cooperates you'd need to already know whether it proves that you cooperate, and so on forever. But apparently when you pit two FairBots against each other, they do end up providing mutual cooperation, and the trick hinges on Löb's theorem somehow. I've seen the formal proof sketch (something like assuming provability of cooperation and then discharging it via Löb) but I want the actual "aha" intuition for why Löb's theorem is precisely the tool that breaks the apparent infinite regress, not just a re-derivation of the symbol-pushing. As a bonus, could you also explain what specifically motivated PrudentBot as an upgrade over plain FairBot - like what bad behavior or vulnerability does FairBot have that PrudentBot is designed to patch?
