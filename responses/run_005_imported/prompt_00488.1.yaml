  Why condition (b)? Because if X cooperates with CooperateBot, then X is not a bot like DefectBot. But note: condition (b) is about proving that X cooperates with CooperateBot. This means that PrudentBot will only cooperate with agents that are "cooperative" in the sense that they cooperate with the unconditionally cooperative agent.

  The motivation is that if a bot cooperates with CooperateBot, then it is not a bot that defects against everyone. But note: a bot might cooperate with CooperateBot but defect against FairBot. That would be a bot that is trying to exploit FairBot. However, PrudentBot requires both that it can prove the opponent cooperates with it (like FairBot) and that the opponent cooperates with CooperateBot.

  But why is this safe? Because if PrudentBot cooperates with X, then it has proven that X cooperates with CooperateBot. Therefore, X is not a bot that defects against everyone. Moreover, by condition (a), X cooperates with PrudentBot.

