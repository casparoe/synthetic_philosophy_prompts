answer: |-
  The rain blurred the Fourteenth Circuit courthouse windows into streaks of light. Inside Judge Aviva Korman’s chambers, the air hummed with the tension of a decision unmade. Case files formed precarious towers on her desk, the top one labeled *United States v. Webb*. Across from her, Judge Daniel Petrosky leaned back in the leather armchair, fingers steepled, his usual geniality replaced by a focused intensity.

  “He invoked counsel, Daniel,” Korman began, her voice low but insistent. She tapped a highlighted transcript page. “Detective Miller walks right past it. ‘I want a lawyer.’ Full stop. Then the ‘oh, but if you just tell us where the gun is…’ routine. It’s textbook *Edwards* violation. Textbook.”

  Petrosky sighed, running a hand through his silver hair. “Aviva, I grant you the error. Miller should have stopped. He didn’t. It’s sloppy, maybe reckless. But *harmless*? Marcus Webb told three separate witnesses *before* the arrest he was going to ‘hit that payroll truck.’ He was found with the stolen cash *stuffed in his gym bag*. The confession was icing, maybe sprinkles, on a very sturdy cake. Without it, any jury convicts. Beyond a reasonable doubt.”

  “That’s the *second* question,” Korman countered, leaning forward. “The standard is clear, sequential: Error? If yes, Harmless beyond a reasonable doubt? We *have* to answer them separately. That’s the structure the Supreme Court gave us. Chapman demands it.” She gestured towards the door, implicitly including Ellis, absent but pivotal. “Constance says no error. Fine. You say error but harmless. I say error and harmful. Issue-by-issue: Majority finds error – you and me against Constance. Majority finds it *not* harmless beyond a reasonable doubt – me and Constance’s hypothetical against you.”

  Petrosky’s eyes narrowed. “Ah. There it is. The paradox. The gears grinding. Because if we vote issue-by-issue, as you propose, the *machine* spits out reversal. Two to one on error, two to one on harm. But Aviva, look around this room. Who *actually* believes Marcus Webb’s conviction should be overturned? Just you. Me? I think it’s solid. Constance? She thinks the whole confession question is irrelevant bunk! Yet, by this… procedural alchemy, we manufacture a reversal only you genuinely support. How is that a *judgment*? It’s a trick of the light!”

  “It’s not alchemy, Daniel, it’s *analysis*!” Korman’s voice rose slightly. “The law isn’t just ‘should Webb go free?’ It’s a framework of rights and tests. We apply the test. Step one: Constitutional violation? Majority says yes. Step two: Harmless? Majority says no. Therefore, reversal. It’s mechanical *because the rules are clear*. To skip to the bottom line – ‘affirm or reverse?’ – ignores the reasoning the law requires. It reduces us to three people in a room taking a show-of-hands on a man’s fate, giving him no explanation beyond ‘Two of us think you stay in prison.’ Webb deserves a *reasoned opinion*, not just a headcount!”

  “He deserves a judgment that reflects what a majority of *this court* actually believes about the *outcome* of *his case*,” Petrosky shot back, leaning forward now, matching her intensity. “What good is a ‘reasoned opinion’ built on a foundation of hypotheticals and aggregated fragments that no single judge stands behind? Constance *doesn’t believe there was error*. Her comment about harm is dicta, a throwaway line in a hypothetical universe she rejects! Binding her to that hypothetical ‘harm’ finding to manufacture a reversal she explicitly opposes? That perverts her vote. It perverts *my* vote! I believe there was error but *not* harm. The issue-by-issue tally forces me, against my own conclusion, into a coalition *reversing* based on harm. A reversal I explicitly reject! How is that honest? How is that the court speaking its mind?”

  “Because the court isn’t speaking *its* mind on the disposition first,” Korman argued, pacing a short step behind her desk. “It’s applying the law’s structure to the facts. The harm question *only exists* if we find error. Constance’s view on harm is contingent, yes, but it’s *on the record*. She stated clearly: *If* there was error, she would *not* find it harmless beyond a reasonable doubt. That’s a legal finding relevant to the second prong. Ignoring it because she found no error in the first place… that’s ignoring part of her reasoning. The issue-based approach captures the full legal landscape of the panel’s views.”

  “It captures fragments and assembles a Frankenstein’s monster of a judgment!” Petrosky retorted. “The *essence* of appellate judging, Aviva, is deciding whether the trial court got it right. The bottom-line disposition: Affirm or Reverse. That’s what matters to Webb sitting in his cell. That’s what the law reports will record. Shouldn’t *that* vote reflect what a majority of us genuinely conclude? Here, two of us – Constance and I – believe the conviction should stand. Only you believe it should fall. Why should a procedural choice override the actual distribution of judicial belief about the *merits of the outcome*?”

  Korman stopped pacing, facing him directly. “Because the ‘merits of the outcome’ aren’t a monolith! They are built from discrete legal conclusions. If we vote only on disposition, we give Webb no explanation. We just say ‘Affirmed.’ Based on what? Did the majority think no error? Or error but harmless? He won’t know. The legal community won’t know. It stifles the development of doctrine. It reduces us to oracles, not judges. Issue-by-issue forces transparency. It forces us to grapple with *why*.”

  “And forces a result only one judge supports substantively!” Petrosky countered. “Transparency about *what*? About a conclusion the court doesn’t collectively hold? You talk about Webb deserving reasons. Does he deserve a reversal that two of his three judges actively oppose? Does that instill confidence? Or does it feel like a loophole?” He softened slightly. “Look, I understand the appeal of the clean, logical structure. Kornhauser and Sager laid it out starkly. It’s elegant in theory. But in practice, in *this* room, deciding *this* man’s life? It feels… artificial. Disconnected from our actual judicial duty to render a judgment we believe in as a panel.”

  “And what if the shoe were on the other foot?” Korman asked quietly, her gaze steady. “Suppose Constance found error *and* harm, wanting reversal. You found no error, so you’d affirm. I found error but harmless, so I’d affirm. Dispositional vote: Affirm, 2-1. But issue-by-issue: Error found (Constance and me: 2-1), Harm found (Constance only: 1-2). Disposition: Affirm, since harm wasn’t found by a majority. Constance’s strong view on harm gets lost. Her belief in a constitutional violation gets diluted. Is that *more* honest? Or just convenient for the affirmance?”

  Petrosky was silent for a moment, acknowledging the thrust. “It’s symmetrical. Uncomfortable either way. But in *that* scenario, the dispositional vote *would* reflect the majority’s bottom-line belief: two judges affirm. Only one reverses. The outcome aligns with the genuine convictions of the majority. In *this* case, the issue-based approach creates an outcome – reversal – supported by only one judge’s genuine conviction. The symmetry highlights the problem: The issue-based method can produce a disposition *no single judge intended* and *opposed by a majority of judges*.”

  “But it’s the disposition the *law* dictates, given the majority findings on the constituent elements!” Korman insisted. “The law isn’t about our personal comfort or aggregated intentions. It’s about applying rules. The rule says: If constitutional error, and if not harmless beyond reasonable doubt, then reverse. We have majority findings satisfying both prongs. Ergo, reverse. Our personal views on the *net* outcome are secondary. We are servants of the legal structure.”

  “We are servants of justice,” Petrosky said firmly. “And justice requires that a court speak with a voice that reflects its true collective judgment on the matter before it. Sending Marcus Webb home because two judges found error (one of whom thinks it doesn't matter) and two judges found harm (one of whom thinks there was no error to *be* harmful)… that voice is garbled. It’s a cacophony, not a judgment. It’s a win on paper, procured by a technicality Webb will never understand, that contradicts what two of his three judges believe should happen. Does that feel like justice served? Or justice gamed?”

  Korman looked out at the rain-streaked night, the city lights smeared on the glass. She thought of Marcus Webb, the coerced confession, the weight of the procedural choice. Petrosky’s argument resonated with an undeniable human truth: a court’s authority stemmed partly from its perceived integrity and coherence. But the law’s demand for structured reasoning, for fidelity to its own tests, was equally compelling.

  “It feels like the law,” she said finally, turning back, her voice heavy. “Complex, sometimes counterintuitive, demanding we follow its logic even when it leads somewhere uncomfortable. Voting dispositionally… it feels like taking a shortcut because the path laid out by precedent leads to a destination we find aesthetically displeasing. Even if,” she met his eyes, acknowledging the elephant, “that destination happens to be the one I favor.”

  Petrosky nodded slowly, a grim acknowledgment. “And dispositional voting feels, to me, like honoring the substance of our judicial responsibility over the form. Even if,” he echoed, a wry twist to his mouth, “it secures the outcome I prefer. The paradox bites both ways, doesn’t it? Neither path is neutral.”

  Silence descended, thick with the weight of the doctrinal dilemma and the tangible consequence for Marcus Webb. The rain tapped insistently against the window.

  “So,” Petrosky said, rising slowly, the movement breaking the stillness. “It seems we understand each other perfectly, Aviva. And disagree fundamentally.” He picked up his briefcase. “I imagine Constance will be equally… decisive. Whichever way this falls, Webb’s fate hinges on a choice about *how* we count, not just what we count. A choice with more philosophical baggage than I think any of us realized when we took the bench.” He paused at the door. “Let’s hope whichever procedure wins, Webb can live with the result. And that we can live with the choice.”

  He left, closing the door softly behind him. Korman remained standing, staring at the *Webb* file. The elegant, brutal logic of the doctrinal paradox was no longer abstract theory. It was the hinge on which a man’s liberty turned, and the path forward felt less like a clear judicial road and more like a precipice shrouded in philosophical fog. The reasoned opinion, whichever way it would ultimately be written, would now bear the invisible scar of this fundamental, unresolved tension.
