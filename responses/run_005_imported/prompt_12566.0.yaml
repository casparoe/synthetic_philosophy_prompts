answer: |-
  Here's a dialogue between **Dr. Aris Thorne** (Structural Realist) and **Dr. Lena Voss** (Pessimistic Meta-Induction Advocate), both deeply versed in philosophy of science, battling over the Fresnel-Maxwell case and its implications. They engage directly, cite specifics, and escalate the tension with historical cases.

  ---

  **Setting:** *A university common room, late evening. Coffee cups litter the table between them.*

  **THORNE:** (Leaning forward, fingers steepled) Lena, your pessimistic meta-induction *ignores* how structural continuity rescues realism. Take Fresnel’s ether theory. Yes, the ontological commitment to a mechanical luminiferous ether was discarded. But Fresnel’s *equations for reflection and refraction* survived Maxwell’s revolution intact. The *structure* of the relationships between light intensity, angles, and polarization—that was preserved. Maxwell didn’t just get lucky; he *reinterpreted* the same mathematical skeleton in a new ontological framework: electromagnetic fields. That’s structural realism in action—we track the *relations*, not the furniture.

  **VOSS:** (Scoffs) Aris, that’s retrospective gloss. *Nobody* in 1820 could have known *which* parts of Fresnel’s theory were the immortal “structure” versus the doomed ontology. Fresnel himself derived those equations *from* the mechanics of the ether! The equations were *inseparable* from the belief in a material medium vibrating longitudinally. Maxwell later showed light was transverse electromagnetic waves—fundamentally incompatible! If the equations survived, it was *despite* Fresnel’s ontology, not because he’d latched onto eternal structure.

  **THORNE:** But that’s precisely the point! The equations survived *because* they accurately described observable phenomena—interference patterns, Brewster’s angle—regardless of ontology. The structure *constrained* what could come next. Maxwell *had* to recover Fresnel’s equations or fail empirically. That’s not luck; it’s evidence the structure was latching onto something real: the wave nature of light and its boundary behavior.

  **VOSS:** Oh, please. Let’s stress-test this with another corpse: **caloric theory**. Lavoisier’s equations for heat flow worked beautifully—predicting thermal equilibrium, expansion of gases. The math described conservation and flow perfectly. By your logic, that structure should have survived. But what survived? The *math* for equilibrium? Sure, folded into thermodynamics. The *ontology* of caloric as a conserved fluid? Dead. The *structure* of heat “flowing like a substance”? Dead—replaced by statistical mechanics where heat is disordered kinetic energy. If structural realism is right, why did the *core structural analogy* (flowing fluid) turn out to be utterly misleading?

  **THORNE:** (Taps the table) Fair challenge—but you’re conflating *analogies* with *mathematical structure*. What survived from caloric was the *conservation principle* (energy conservation) and the *equations for reversible processes* (Carnot’s work, refined by Clausius). The *mathematical form* of heat transfer in specific cases persisted. The fluid analogy was scaffolding, not the structure itself. Structural realism doesn’t commit to analogies; it commits to the invariant equations governing phenomena.

  **VOSS:** (Eyes flashing) Invariant? Carnot’s *specific* equations assumed caloric conservation. When energy conservation replaced it, the *meaning* of the equations changed entirely! Caloric’s “conservation” was false—heat isn’t conserved, energy is. The structure *shifted underfoot*. And back to Fresnel: Maxwell didn’t just reinterpret the equations; he *changed* them. Fresnel had no displacement current, no electromagnetic coupling, no prediction of EM waves in a vacuum. Maxwell’s structure was richer and *incompatible* with Fresnel’s mechanics. Survival? More like a zombie equation shambling into a new theory.

  **THORNE:** You’re exaggerating the discontinuity. Fresnel’s equations for *reflection/refraction at interfaces* are *literally identical* in Maxwell’s formalism. They’re derived from boundary conditions on fields—no ether needed. The structural core—the sinusoidal solutions, the continuity conditions—was retained. As Worrall put it: “The *form* of the laws survived.” That’s not zombie math; it’s a kernel of truth enduring ontological upheaval.

  **VOSS:** And I say it’s cherry-picking. Why focus *only* on Fresnel’s reflection equations? What about his *longitudinal* ether waves? His mechanical stress tensors for the ether? All that “structure” evaporated. Realism can’t just point to the bits that survived and say, “See? Truth!” while ignoring the graveyard of discarded structures. For every Fresnel equation that survived, there’s a hundred phlogiston-affinity bonds or ether-vortex diagrams that didn’t. Your “structure” is just whatever we retroactively decide was useful.

  **THORNE:** But science *progresses* by preserving successful structure! When Maxwell subsumed Fresnel, he didn’t just salvage equations—he *explained why they worked*: light *is* waves, but *electromagnetic* ones. That’s convergent success! If structural realism is false, why does mathematical structure so often persist through revolutions? Why does quantum field theory reduce to Maxwell in the classical limit? Coincidence?

  **VOSS:** (Leaning back, voice colder) Because we’re clever at *re-describing* past successes in new languages. The Fresnel equations survived because they were *instrumentally useful*, not because they carved nature at the joints. Quantum field theory “reduces” to Maxwell? Only if you ignore that fields are operator-valued distributions in a Hilbert space—ontologically alien to Maxwell’s continuous fields. The “structure” you cling to is a pragmatic shadow. Tomorrow, quantum gravity might replace spacetime with entanglement relations, and your “structural continuity” will be retconned again. The track record says: bet on the predictions, not the ontology—or the structure.

  **THORNE:** And without some ontological anchor, science becomes mere prediction-mongering. Structural realism *is* the anchor: the equations that endure across revolutions are our map to reality’s skeleton. The rest—ether, caloric—is mutable flesh.

  **VOSS:** A skeleton that keeps shapeshifting? (Stands up) We’re back where we started, Aris. You see a scaffold getting stronger. I see a cycle of creative destruction. Fresnel’s math survived because it was *useful*, not because it was *true*. Until you can tell me *now*, for *today’s* theories, which bits are the eternal “structure” and which are the next ether—not after the revolution, but *before* it—I’ll stick with the meta-induction: assume today’s ontology is probably wrong, but the math? That’s worth keeping… until it isn’t.

  **THORNE:** (Quietly) Then we’re left with a world where math works miracles for no reason. I’ll take the structure—and the mystery of why it persists.

  *(They hold each other’s gaze, the coffee gone cold between them. Neither has conceded; the tension hangs, unresolved.)*

  ---

  **Key Touches:**  
  - **Fresnel Specifics:** Explicit debate over longitudinal vs. transverse waves, boundary conditions, and Maxwell’s displacement current.  
  - **Caloric Stress-Test:** Voss forces Thorne to confront a case where the *core analogy* (fluid flow) was abandoned, not just ontology.  
  - **Structural Ambiguity:** Voss hammers the "retroactive cherry-picking" problem—we only know what survived *after* the fact.  
  - **No Winner:** Thorne appeals to progress and convergence; Voss to unpredictability and instrumentalism. The Fresnel equations remain both realist evidence and anti-realist ammunition.  

  This mirrors your stalemate: the realist sees a lifeline in preserved structure; the anti-realist sees a pattern of creative destruction with no reason to trust current ontologies. Both positions hold weight—and both know the history too well to retreat.
