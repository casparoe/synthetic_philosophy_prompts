  ## The Hypocrite's Gavel: When Standing to Blame Cracks Under Contradiction

  The class president's reprimand—issuing from a mouth that regularly utters late apologies—ignited a firestorm precisely because it embodies a timeless ethical puzzle: does hypocrisy strip a person of the moral authority, or "standing," to blame others for the very fault they embody? Philosophers like G.A. Cohen argue persuasively that it can, even when the *substance* of the criticism is correct. Weighing the arguments reveals that while hypocrisy doesn't negate wrongdoing, the unrepentant hypocrite often forfeits their standing to act as a legitimate moral agent of blame, transforming their criticism into an illegitimate exercise of power rather than a valid moral appeal.

  **The Core Divide: Substance vs. Standing**

  The fundamental tension lies in separating two questions:
  1.  **Aptness:** Was the blamed act genuinely wrong? (e.g., Was the officer's lateness disruptive?).
  2.  **Standing:** Does the blamer have the moral authority or right to level this specific blame *against this specific person*?

  Proponents of the "substance is all" view argue that the wrongness of the act exists independently of the blamer's character. Pointing out the president's lateness (a *tu quoque* argument) is merely a deflection, an *ad hominem* fallacy distracting from the officer's own transgression. The truth of the criticism ("lateness is bad") stands firm regardless of the president's flaws. Her hypocrisy might make her *unpersuasive* or *unlikable*, but it doesn't magically make the officer's lateness acceptable or beyond reproach.

  Cohen and defenders of the "standing" view counter that moral blame isn't merely a statement of fact; it's a *performative act* laden with presuppositions. When we blame, we implicitly claim a position of moral authority relative to the wrongdoer. We presuppose that we are not ourselves guilty of the same fault *in a way that undermines that very authority*. Hypocrisy violates this presupposition. It creates a contradiction: "Lateness is blameworthy when *you* do it, but not when *I* do it?" This contradiction isn't just awkward; it exposes the blame as potentially grounded in arbitrariness, malice, or a willful disregard for the principle supposedly being defended, rather than genuine moral concern.

  **Addressing the Core Questions:**

  1.  **Is "Lacking Standing" Separate from Aptness?**
      Absolutely. Consider Cohen's terrorist example: a state condemning terrorism while engaging in acts morally equivalent to terrorism (e.g., targeting civilians) may be *correct* that terrorism is abhorrent. The *aptness* of condemning the terrorist group remains. However, the state *lacks standing* because its own identical actions fatally undermine its moral authority to deliver that condemnation. Its condemnation rings hollow, revealing hypocrisy rather than moral principle. In the classroom, the president correctly identifies lateness as disruptive (apt), but her own identical, unrepented pattern strips her of the moral high ground needed to issue a legitimate *reprimand*. The failure is distinct: the officer failed the rule; the president fails the *act of blaming* by violating its implicit conditions.

  2.  **Is "Tu Quoque" Always Fallacious?**
      No. While often used fallaciously to deflect *all* criticism ("I hit you, but you hit me back first, so my hitting you doesn't matter!"), it can be a legitimate objection to the *critic's standing* when the hypocrisy is *relevant* and *undermines the presuppositions of the blame*. Relevance is key. If the president criticized the officer for plagiarism while she herself was late, "you're late too!" *would* be a mere deflection. But when the criticism and the critic's fault concern the *identical norm* ("be on time"), pointing out the hypocrisy directly challenges the blamer's credibility and right to invoke that specific norm authoritatively. It asks, "By what authority do *you* condemn this, given you openly flout the same rule?" This isn't denying the rule's validity; it's denying *this person's* right to enforce it in *this instance*.

  3.  **Does Being Unrepentant Matter Crucially?**
      Immensely. This is often the deciding factor. A *reformed* hypocrite, like the president who *used* to be late but diligently corrected her behavior *before* criticizing others, arguably regains standing. Her repentance demonstrates a commitment to the norm she now seeks to uphold. Her blame reflects a hard-won understanding of the fault and a desire to prevent others from erring similarly. It aligns her actions with her words. In contrast, the *unrepentant, current* hypocrite (like the actual president) embodies active contempt for the norm she wields as a weapon. Her blame isn't an appeal to shared values; it's an assertion of power or privilege ("Rules for thee, not for me"). This active contradiction makes her blame illegitimate. It signals that the norm is not truly binding, but merely a tool for her convenience when applied to others. Her lack of repentance confirms that her criticism isn't grounded in genuine respect for the principle, but in something else entirely.

  **The Verdict: When Hypocrisy Removes Standing**

  Hypocrisy does not merely make blaming "awkward"; it can actively *remove* the standing to blame when specific conditions are met. The unrepentant hypocrite lacks standing to blame another for the *same fault* when:

  1.  **The Fault is Identical:** The blamer is guilty of conduct that violates the *same norm* they are invoking against the target.
  2.  **The Hypocrisy is Current and Unrepented:** The blamer is actively engaged in the faulty behavior without remorse or effort to change *at the time of blaming*. (Reformed hypocrites can regain standing).
  3.  **The Blame Assumes Moral Authority:** The act of blaming implicitly claims a position of relative moral superiority or legitimacy regarding adherence to that specific norm.

  Under these conditions, the hypocrite's blame becomes an illegitimate performance. It is not a valid moral appeal but a performative contradiction that exposes the blamer's disregard for the very principle they invoke. The substance of the criticism (the aptness) may remain true – the officer *was* late, and lateness *is* disruptive – but the president, by embodying the fault she condemns without repentance, forfeited her right to be the one to deliver that condemnation as a legitimate moral judgment. Her gavel of blame was made of the same crumbling stone as the offense she sought to judge. True moral authority requires not just identifying the fault in others, but aligning one's own actions with the principles one presumes to enforce.
