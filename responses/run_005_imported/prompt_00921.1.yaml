  Modern critiques come to mind. Materialists might argue that the brain is still processing internal states, even without external stimuli. The sense of self could be a product of neural activity, not a separate substance. Also, the user's prior knowledge of the flying man might have influenced their interpretation. That's the framing effect.

  Then there's the distinction between phenomenology and metaphysics. The feeling of a disembodied self doesn't necessarily mean such a self exists independently. It's about subjective experience versus objective reality. The user might be conflating the two. 

