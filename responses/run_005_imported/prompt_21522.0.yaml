answer: |-
  Here’s a eulogy that honors Frank’s warmth while honoring his philosophy—without turning into a seminar. Strawson’s insight is woven in subtly, focusing on the *human experience* Frank embodied:

  ---

  ### Eulogy for Frank

  When I was twelve, I broke a window at Uncle Frank’s house playing baseball. Terrified, I stammered out an apology. He just put a hand on my shoulder and said, “Kid, the wind changed, your grip slipped, and that pane was older than your dad. Go get the broom.”  
  No blame. Just causes.  
  Thirty years on the bench, and Frank believed—*really* believed—that no one *ultimately* deserves praise or condemnation. The threads of cause and effect, he’d say, weave back long before any of us arrive. “Desert,” to him, was a story we tell ourselves. A necessary fiction, maybe, but a fiction all the same.  

  **And yet.**  

  This was the same man who wept when a stranger returned his lost wallet. Who’d squeeze your arm, voice thick, if you brought soup when he was sick. Who forgave betrayals that would’ve hardened anyone else—not with resignation, but with a startling, disarming tenderness.  

  If that feels like a contradiction—the judge who dismissed desert but overflowed with gratitude, who saw us all as swept along by forces beyond our making yet held us fiercely accountable to kindness—well, Frank would’ve grinned at that. “Contradiction?” he’d murmur. “Or just the whole messy point?”  

  I think I finally understand what he meant. He didn’t *deny* our feelings—our fury at injustice, our awe at generosity, our need to say “thank you” or “I’m sorry.” He felt them deeper than most. What he dismissed was the idea that these feelings depend on some cosmic scale of deserving. He didn’t forgive because people *deserved* it in some ultimate sense. He forgave because forgiveness is what *he* did. He didn’t feel gratitude because kindness *earned* it. He felt it because that was Frank—he noticed, he treasured, he welled up. The warmth wasn’t a verdict. It was his way of being human.  

  A philosopher he liked, Peter Strawson, put it best: We don’t need “desert” for resentment or love to be real. They’re part of how we *see* each other—not as cosmic debtors, but as people. Participants in this tangled life. Frank didn’t just believe that; he *lived* it. On the bench, he saw causes. At this table? He saw *us*. Fully. Tenderly. Without the illusion that any of us could stand outside the stream of time and earn our place in his heart. We were already there.  

  So we don’t have to ignore his warmth today, or treat it as some quirk. It wasn’t inconsistent with his philosophy. It *was* his philosophy. Wrapped in a bear hug. Served with extra gravy. Eyes shining over something as small as you remembering how he took his coffee.  

  He knew we’re all shaped by a thousand things we didn’t choose. And yet—how could you not love him back? How could you not try, however clumsily, to be worthy of that gaze?  

  Thank you, Frank. Not because you earned it. But because we’re grateful. And that’s enough.  

  ---

  ### Why this works
  1.  **Strawson, Simplified:** It captures his key point—reactive attitudes (gratitude, resentment) exist independently of "ultimate desert"—without naming the essay ("Freedom and Resentment"). The clerks/philosophers will recognize "participants," "see each other," and the core idea.
  2.  **Honors the Warmth:** Frank's forgiveness and gratitude are centered as *active choices* and expressions of *who he was*, not contradictions to his determinism.
  3.  **Uses Story, Not Lecture:** The window anecdote grounds the philosophy immediately. "Causes" are concrete (wind, grip, old pane). The "And yet" pivot is emotional.
  4.  **Resolves the Tension:** Explicitly states the feelings weren't *dependent* on desert; they were expressions of Frank's nature within the causal flow. "The warmth wasn't a verdict. It was his way of being human."
  5.  **Authentic Voice:** Feels like a nephew writing – personal, slightly irreverent ("extra gravy," "older than your dad"), loving.
  6.  **Ends on Emotion:** Moves from philosophy back to pure love and loss ("How could you not love him back?").
  7.  **Accessible:** For non-philosophers, it's a touching portrait of a complex, loving man. The philosophy serves the *story* of Frank, not the other way around.

  This lets you honor the whole Frank – the razor-sharp mind on the bench, and the tender heart at the dinner table – without apology or academic pretense. It shows how his belief *deepened* his humanity, rather than contradicting it.
