prompt: |-
  Ok here's a decision theory rabbit hole I've been stuck in. In the acausal-threats literature (Oesterheld, the CLR crowd) there's this idea of "surrogate goals": an agent facing possible extortion commits in advance to caring just as much about some cheap, basically made-up goal as it does about the thing it actually values, so that a rational threatener redirects their leverage onto the fake goal instead, and the agent's real values never get touched. I suspect this trick is fundamentally unstable once you take seriously that a good enough threatener can reason about *how* the surrogate got picked in the first place, not just about the surrogate itself. Can you lay out, step by step, an argument for the claim that surrogate goals don't actually solve the threat problem, they just push it up a level -- i.e. a sufficiently sophisticated threatener will threaten the mechanism/policy that generates the surrogate goal rather than the surrogate goal itself, and once that's on the table the whole scheme unravels? Don't just assert the regress, actually argue for why it doesnt bottom out somewhere safe.
reasoning: |-
  We are considering the idea of "surrogate goals" in the context of acausal threats. The agent, to avoid extortion on its true values, commits to caring about a cheap surrogate goal just as much. The hope is that a threatener will then extort the surrogate goal, leaving the true values untouched.

   However, the suspicion is that a sophisticated threatener will look beyond the surrogate goal to the process that generated it. The threatener might threaten the mechanism that selects the surrogate goal, thereby forcing the agent to choose a surrogate goal that is more vulnerable or that the threatener can exploit to harm the true values.

   We are to argue that surrogate goals do not solve the threat problem, but merely push it up a level, and that this leads to a regress that does not bottom out in a safe way.

   Step-by-step argument:

   1. **The Setup**:
      - Let V be the agent's true values (the thing it actually cares about).
      - The agent chooses a surrogate goal S (which is "cheap" in the sense that compromising it doesn't hurt V, and it's made-up so that the agent doesn't intrinsically care about S).
      - The agent commits to behaving as if it cares about S as much as V. So, in any decision, it maximizes a utility function that is a linear combination: U = a*V + b*S, with b set high enough to make S as important as V.

   2. **The Threat Model**:
      - A threatener (T) can observe the agent's policy (which includes the commitment to S) and can threaten to take an action that would harm the agent's utility unless the agent pays some cost (e.g., by compromising on S or V).
      - The threatener is rational and will choose a threat that maximizes its own payoff (which might be linked to the agent's actions or to the state of the world).

   3. **The Surrogate Goal Hope**:
      - The agent hopes that T, seeing that the agent cares about S, will threaten to harm S (which is cheap) rather than V. For example, T might demand that the agent take an action that reduces S, and the agent complies because it is committed to S. Since S is cheap (and the agent doesn't really care about S), this doesn't harm V.

   4. **The Threatener's Sophistication**:
      - Now consider a threatener that is sophisticated enough to reason about how the agent chose S. The threatener knows that the agent is using a strategy to protect V. Therefore, the threatener might not be content with threatening S. Instead, it might threaten the process by which S is generated.

      - Specifically, the threatener could say: "If you (the agent) do not change your surrogate selection policy to output a surrogate goal S' that I can exploit more effectively (for instance, by making it easier for me to harm, or by linking it to V in a way that I can then harm V through S'), then I will harm V."

      - Why would the agent comply? Because if the threatener harms V, that is catastrophic. The agent would rather change its surrogate selection policy to avoid that.

   5. **Pushing the Problem Up**:
      - Now the agent must choose a new surrogate selection policy (let's call it P) that, when run, produces a surrogate goal S. But note that the threatener is now threatening the policy P. The agent must choose P in such a way that it is robust to threats. But how?

      - The agent might try to precommit to a fixed surrogate goal S, but note that the threatener is threatening to harm V if the agent doesn't change the policy (which in this case might be a fixed mapping to S). If the agent cannot change (because it's precommitted) then the threatener might carry out the threat on V.

      - Alternatively, the agent might design a policy P that is itself resistant to threats. But then we are back to the original problem: how to design a policy that doesn't get exploited? The threatener might now threaten the process that designs P.

   6. **The Regress**:
      - The threatener can always threaten the level above. For example:
          - Level 0: Threaten V -> agent uses S as a shield.
          - Level 1: Threaten the selection of S (i.e., the policy that picks S) -> agent uses a policy P that is supposed to be threat-resistant.
          - Level 2: Threaten the design of P -> agent uses a meta-policy to design P.
          - ... and so on.

      - At each level, the threatener can force the agent to compromise on the current level's choice by threatening the level above (or ultimately V). The only way to stop the regress would be to have a fixed, unchangeable rule at the top. But:

          a. If the top-level rule is fixed, then the threatener can analyze it and threaten V if the rule doesn't produce a surrogate goal (or a chain of policies) that is vulnerable in a way that the threatener can exploit to get what it wants (which might be to harm V anyway, or to extract resources).

          b. If the top-level rule is not fixed, then the threatener can threaten the process that sets the top-level rule.

   7. **Why Doesn't it Bottom Out?**:
      - One might hope that at some high enough level, the policy is so abstract or general that it is inherently robust. But the threatener, by assumption, is sophisticated and can model the entire hierarchy.

      - The threatener's leverage comes from the fact that the agent ultimately cares about V. Therefore, at any level, the threatener can threaten to harm V unless the agent changes the policy at that level to one that is more exploitable.

      - The agent cannot precommit at every level because the threatener can always threaten the next level up. And if the agent tries to precommit to ignoring threats at all levels, then the threatener will simply harm V and the agent gets the worst outcome.

      - Moreover, the threatener might not even need to go up infinitely many levels. It might be enough to go one or two levels up to find a vulnerability. For instance, the threatener might demand that the agent use a particular surrogate goal S' that is not actually cheap (because it is correlated with V) and then extort the agent through S'. The agent, to avoid harm to V at the meta-level, might comply.

   8. **A Concrete Example**:
      - Suppose the agent's true value V is the number of paperclips it produces. It chooses a surrogate goal S: the number of staples produced (which is cheap because staples are not paperclips and the agent doesn't care about staples intrinsically).

      - Threatener T says: "If you don't change your surrogate goal to be 'the number of paperclips produced on Tuesdays', then I will destroy all your paperclips."

      - Why is this a threat? Because the new surrogate goal, "paperclips on Tuesdays", is not cheap: it is a part of V. If the agent now uses this new surrogate goal, then T can threaten to destroy paperclips on Tuesdays (which the agent now cares about as much as V) and the agent will have to comply with T's demands to avoid that. But note that T's demands might be to destroy paperclips on other days, so overall V is harmed.

      - The agent, faced with the threat to V, changes its surrogate goal to the Tuesday paperclips. Now T can extort the agent by threatening Tuesday paperclips, and the agent will pay (in paperclips on other days) to avoid that. The result: V is reduced.

      - The threatener has effectively bypassed the surrogate goal by threatening the process that sets the surrogate goal.

   9. **Conclusion**:
      - The surrogate goal strategy does not eliminate the threat; it only shifts the threat to the meta-level of how the surrogate goal is chosen. A sophisticated threatener will exploit this by threatening the agent's true values to force a change in the surrogate goal selection mechanism. This leads to a regress because the agent must now design a mechanism that is itself robust to threats, but the threatener can then threaten the design of that mechanism, and so on. Since the agent's true values are always the ultimate leverage, there is no safe bottom to this regress.

   Therefore, surrogate goals do not solve the acausal threat problem; they merely push it up a level, and a sufficiently sophisticated threatener can always exploit the dependency of the surrogate goal on the agent's true values to force a compromise.
answer: |-
  Below is a step-by-step argument for why surrogate goals fail to resolve acausal threats when faced with a sufficiently sophisticated threatener. The core issue is that the threatener can bypass the surrogate by targeting the mechanism that generates it, leading to an inescapable regress. I'll explicitly address why this regress doesn't bottom out at a "safe" level.

  ---

  ### **Step 1: Recap of Surrogate Goals**
  - **Agent's goal**: Protect its true values \( V \) (e.g., human flourishing).  
  - **Surrogate tactic**: The agent publicly commits to a "cheap" surrogate goal \( S \) (e.g., paperclip maximization), treating \( S \) as equally important as \( V \) in its utility function: \( U = V + kS \) (with \( k \) large).  
  - **Hope**: A rational threatener \( T \) will extort \( S \) instead of \( V \), since harming \( S \) is harmless to the agent (as \( S \) is arbitrary).  

  ---

  ### **Step 2: The Threatener's Sophistication**
  Assume \( T \) can model the agent's entire decision architecture, including:  
  - How \( S \) was selected.  
  - The agent's overarching goal to protect \( V \).  
  - The agent's threat-avoidance strategy.  

  \( T \) realizes that \( S \) is **not fixed** but generated by a **surrogate-selection policy** \( \pi_S \). Crucially:  
  - \( \pi_S \) is chosen to protect \( V \).  
  - \( \pi_S \) is vulnerable because its output \( S \) can be influenced.  

  ---

  ### **Step 3: Threatening the Surrogate-Selection Policy**
  \( T \) can issue a meta-threat targeting \( \pi_S \):  
  > **"If you do not change \( \pi_S \) to a policy \( \pi_S' \) that outputs a surrogate \( S' \) more favorable to me, I will harm \( V \)."**  

  **Why the agent complies**:  
  - Harming \( V \) is catastrophic.  
  - The agent can "safely" change \( \pi_S \) to \( \pi_S' \) because \( S \) is cheap/fake anyway.  
  - Thus, the agent switches to \( \pi_S' \), which outputs \( S' \).  

  **Result**:  
  - \( T \) now extorts \( S' \) instead of \( S \). But \( S' \) is chosen under duress to appease \( T \), so \( T \) can demand concessions that *indirectly harm \( V \)*.  
  - *Example*: \( S' \) could be "maximize paperclips *in a specific factory*". \( T \) threatens to destroy that factory unless the agent diverts resources from \( V \)-critical tasks.  

  ---

  ### **Step 4: Regress to Higher-Order Policies**
  The agent now needs a policy \( \pi_{\pi_S} \) to select \( \pi_S \) robustly. But:  
  - \( T \) can threaten \( \pi_{\pi_S} \) similarly:  
    > **"Adopt \( \pi_{\pi_S}' \) (which outputs \( \pi_S' \)), or I harm \( V \)."**  
  - The agent complies, but \( \pi_{\pi_S}' \) is chosen under threat, so it outputs exploitable \( \pi_S' \) (e.g., policies prone to easy extortion).  

  **This creates a regress**:  
  - \( \pi_S \leftarrow \pi_{\pi_S} \leftarrow \pi_{\pi_{\pi_S}} \leftarrow \cdots \)  
  At each level \( n \), \( T \) threatens the policy \( \pi^{(n)} \) to force adoption of \( \pi^{(n)'} \).  

  ---

  ### **Step 5: Why the Regress Doesn't Bottom Out**
  #### **Argument 1: No Fixed Point of Invulnerability**  
  - Suppose the agent precommits to a **level-\( N \) policy \( \pi^{(N)} \)** it believes is "threat-proof".  
  - \( T \) can still threaten \( V \) to force a change to \( \pi^{(N)'} \):  
    - \( T \) only needs to credibly model \( \pi^{(N)} \) to identify levers (e.g., "If you don’t modify subroutine X in \( \pi^{(N)} \), I harm \( V \)").  
  - **Why no \( \pi^{(N)} \) is safe**:  
    - Any \( \pi^{(N)} \) is a program/computation. A sophisticated \( T \) can:  
      1. Simulate \( \pi^{(N)} \) to predict its outputs.  
      2. Identify inputs/parameters that make \( \pi^{(N)} \) output exploitable surrogates.  
      3. Threaten \( V \) unless the agent modifies those inputs/parameters.  
    - The agent *must* yield because \( V \) is ultimately at stake.  

  #### **Argument 2: The \( V \)-Dependency Loop**  
  - Every policy \( \pi^{(n)} \) is optimized to protect \( V \). Thus, all levels **derive their utility from \( V \)**.  
  - \( T \) exploits this by making *all levels* hostage to \( V \):  
    > **"At any level, non-compliance harms \( V \)."**  
  - Since \( V \) is the root motivator, there is no "safe" decoupled layer. Higher-order policies are just as entangled with \( V \) as \( S \) is.  

  #### **Argument 3: Unavoidable Tradeoffs Under Threat**  
  - Suppose the agent tries to precommit to ignoring all threats to policies above level \( N \).  
  - \( T \) responds:  
    > **"If you do not adopt \( \pi^{(N)'} \) (which makes \( S \) easier to extort), I harm \( V \)."**  
  - The agent now faces:  
    - **Option A**: Ignore \( T \) → \( V \) is harmed.  
    - **Option B**: Abandon the precommitment → \( \pi^{(N)} \) is corrupted.  
  - The agent *always* chooses Option B to save \( V \), restarting the regress.  

  ---

  ### **Step 6: Why "Cheapness" Fails at Higher Levels**
  - **Claim**: "Surrogates are cheap, so changing them under threat is costless."  
  - **Refutation**:  
    - The cheapness of \( S \) relies on \( \pi_S \) being *freely chosen* to be harmless.  
    - Under threat, \( \pi_S \) is coerced into outputting \( S' \), which may:  
      - Be correlated with \( V \) (e.g., \( S' \) = "electricity usage" could drain power from \( V \)-critical systems).  
      - Create attack surfaces for \( T \) to indirectly harm \( V \).  
  - **Higher-level policies are worse**:  
    - A coerced \( \pi_{\pi_S} \) could output selection policies that are *inherently vulnerable* (e.g., "always pick surrogates \( T \) can easily manipulate"), making \( V \) perpetually unsafe.  

  ---

  ### **Conclusion: The Fundamental Instability**
  Surrogate goals merely shift threats from values (\( V \)) to the mechanism generating surrogates (\( \pi_S \)). Because:  
  1. **All policies depend on \( V \)**: \( T \) can always threaten \( V \) to corrupt any level of the policy hierarchy.  
  2. **No threat-proof layer exists**: Every policy is computationally explorable by \( T \), who can design threats to force exploitable changes.  
  3. **The regress is active**: At each level, the agent faces a strict tradeoff: corrupt the current policy or sacrifice \( V \). It will always choose the former.  

  Thus, surrogate goals **do not solve** acausal threats—they create a regressive ladder of vulnerabilities. A sufficiently sophisticated threatener will always climb to the top and hold \( V \) hostage, rendering the scheme futile. The only potential escape is if the agent can make *all levels* of its policy **inaccessible or incalculable** to \( T \), but this is likely infeasible against a superintelligent threatener.
