answer: |-
  Dr. Aris Thorne wiped sweat from her brow, the humid air of the Bornean research station clinging like a second skin. Thirty years observing orangutans had taught her the intricate calculus of reciprocity. She’d documented food sharing, coalition formation, the subtle debts incurred and paid in grooming sessions – the raw scaffolding of sociality sculpted by natural selection for survival. Now, retired from fieldwork but restless, she grappled with the foundations of the very concepts she’d spent her life quantifying: fairness, obligation, the *ought*.

  Sharon Street’s dilemma haunted her late-night readings. *Either evolution shaped our moral intuitions to track mind-independent truths (implausible!), or it shaped them purely for adaptive fitness, leaving their potential truth a staggering coincidence.* Aris felt the biological absurdity of the first horn deep in her bones. Evolution cared about reproductive success, not Platonic Forms of Goodness. But the second horn… it made the fierce moral conviction currently twisting her gut feel like an illusion, a useful trick played by selfish genes.

  That conviction centered on Kamal. A local hunter, found delirious and dehydrated two days ago near their remote station, suffering from a severe infection likely contracted trespassing in the protected reserve Aris’s team monitored. The expedition medic, Ben Carter, a sharp young philosopher-biologist Aris had taken under her wing, had stabilized him, but Kamal needed advanced care – a risky, day-long boat journey downstream. The official protocol was clear: report the situation, await instructions. Intervening directly risked bureaucratic entanglement, jeopardizing their research permits.

  But Aris *knew* they had to take him. Not out of reciprocity – Kamal was a stranger, potentially a poacher. Not out of calculated benefit. It felt like a brute, non-negotiable *must*. Seeing him suffer was viscerally wrong. This conviction felt as real as the data she’d once meticulously recorded.

  "Ben," she said, finding him checking Kamal’s fever. "We need to prep the boat. We're taking him to Sangkulirang."

  Ben looked up, surprised. "Aris, the director explicitly said–"

  "I know what he said," Aris interrupted, her voice tight. "But look at him, Ben. We *can’t* leave him. It’s… unconscionable."

  Ben sighed, adjusting Kamal’s saline drip. "The debunking itch bothering you again?"

  "It’s not an itch, Ben. It’s a chasm. Why does this feel so *real*, so binding? My whole career screams that this feeling – this ‘ought’ – is just neural circuitry tuned by selection to promote cooperation *within groups*, to manage reputation, to avoid costly conflicts. Useful for fitness, sure. But *true*? Independent of that? The odds seem… astronomical. Why should the wiring installed to help my kin or reciprocal partners also correctly identify an objective moral truth about helping a stranger who might be harming the very creatures I dedicated my life to? It feels like believing the thermoreceptors in my skin are miraculously attuned to the absolute Kelvin scale."

  Ben finished his task and met her gaze. He knew her struggles well. "Street’s dilemma is sharp, Aris. I grant you that. The ‘tracking truth’ hypothesis *does* seem biologically extravagant. But maybe the coincidence isn’t as wild as it seems. What if the *same facts* that make certain behaviors adaptive *also* ground the moral truths? A third factor?"

  Aris crossed her arms. "Go on."

  "Think Parfit," Ben said. "He argued that necessary normative truths, like mathematical ones, don't *need* a causal history. We don’t worry that evolution didn’t shape our brains to ‘track’ the truth of 2+2=4; we recognize its necessity regardless of how we came to grasp it. Maybe some moral truths are similarly necessary – truths about reasons, about what suffering *is* and why it matters intrinsically. Evolution *had* to stumble upon cooperative strategies to build complex social organisms like us. And those strategies necessarily involve recognizing vulnerability, need, and the badness of suffering – because that’s *what suffering is*. The adaptive behavior and the moral truth aren't coincidental; they're responses to the same fundamental, necessary features of conscious existence."

  Aris stared out the window at the dense, green wall of the rainforest. She saw a mother orangutan high in a fig tree, patiently feeding her infant. An image of pure, costly care. Adaptive? Ultimately, yes, for gene propagation. But was the *goodness* of that care, the inherent value of the infant’s survival and flourishing, *just* an adaptive illusion? Parfit’s point resonated, offering a lifeline out of the coincidence. Could suffering’s intrinsic badness be a necessary truth, like mathematics, that evolution inevitably brushed against in its blind groping for survival strategies?

  But the evolutionary biologist in her pushed back. "Necessary truths? Ben, evolution stumbles. It produces useful fictions all the time. The sweetness of fruit signals calories, but artificial sweeteners hijack that. Is the moral ‘sweetness’ of helping Kamal real, or just a cognitive sweetener wired in because it *usually* paid off? Even if suffering is intrinsically bad, why should my *feeling* that it’s bad be a reliable indicator, rather than just a fitness-promoting aversive response? Selection didn't care about truth; it cared about what worked."

  Kamal moaned softly. The sound cut through the philosophical tension. Aris’s conviction surged anew, undeniable. *He needs help. We must go.*

  "You’re right about the coincidence seeming impossible," Ben conceded quietly. "But maybe the impossibility cuts both ways. Maybe the *depth* and *inescapability* of this conviction – not just in you, but across humanity, however imperfectly expressed – is itself evidence we’re responding to something real, something necessary. Maybe evolution didn't *track* the truth, Aris. Maybe it *stumbled into* it, because conscious beings interacting in a world of scarcity and vulnerability *couldn't avoid* confronting these necessary normative landscapes. The truth was always there; evolution just built lenses that, however imperfectly, couldn't help but partially refract it."

  Aris looked at Kamal, then at Ben, then back at the suffering man. The dilemma wasn't resolved. Street’s challenge still loomed, a specter of biological skepticism. Parfit’s necessary truths felt abstract, almost ethereal against the gritty reality of infection and bureaucratic risk. The third-factor explanation was elegant but speculative.

  Yet, the conviction held. It felt less like a coincidence now, and more like… gravity. An undeniable force, perhaps as fundamental as mathematics, pulling her towards the boat. The *why* remained shrouded in metaethical mist, but the *what* was clear.

  "Prep the boat, Ben," Aris said, her voice firm, the biologist still wrestling, the moral agent already decided. "We leave in an hour. We’ll deal with the consequences." She turned back to Kamal, her hand briefly resting on his fevered brow. The act felt necessary, not just adaptive. And in that moment, facing the concrete reality of suffering and her response, the evolutionary story, for all its power, couldn’t quite shake the stubborn, irreducible reality of the *ought* driving her forward. The dilemma remained, but so did the commitment, standing like a rock in the swirling currents of explanation.
