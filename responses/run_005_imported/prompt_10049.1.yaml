answer: |-
  The candle guttered, throwing monstrous, wavering shadows across the low ceiling of Isaac Newton’s chambers in Trinity College. Parchment, weighted down by an astrolabe and a chunk of raw mercury ore, covered the large table. At its center lay a single sheet, densely covered in his precise, angular script – the letter destined for John Locke, containing the explosive treatise *Two Notable Corruptions of Scripture*. Beside it, a draft of the urgent recall he’d just penned sat drying, its ink still dark and wet.

  Newton leaned back in his chair, the worn leather sighing. The fire had died to embers, but a deeper chill had settled in his bones. His gaze drifted past the theological notes to the complex astronomical diagrams pinned nearby – calculations derived from Daniel’s seventy weeks, projections of cometary paths intersecting prophetic timelines. *2060*, the number echoed in his mind. *Not before.* But the apocalypse felt distant, abstract, compared to the heresy crackling on the page before him.

  He traced a finger over his argument concerning 1 John 5:7 – the infamous *Comma Johanneum*. *"For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one."* Pure fabrication, he knew. Absent from the oldest Greek manuscripts, a clumsy interpolation by later scribes desperate to bolster the shaky trinitarian edifice against Arius. He’d meticulously charted its absence across the patristic writings, its sudden appearance centuries later. A corruption, plain and simple.

  Then, 1 Timothy 3:16: *"Great is the mystery of godliness: God was manifest in the flesh…"* His lips tightened. The Greek uncials told the true story. The original text read **Ὃς** (Hos – *Who*), not **Θεὸς** (Theos – *God*). Some overzealous scribe, centuries after Christ, had seen the abbreviation **ΘΣ** – which could stand for *Theos* – and misinterpreted it, overwriting the ambiguous shorthand as the divine name. A simple scribal ambiguity, amplified by Athanasius and his followers at Nicaea into a cornerstone of a false doctrine. *"Who was manifest in the flesh"* – referring to Christ, yes, but *not* declaring him the uncreated God Almighty. Christ was the divine **Λόγος**, the Logos, the creative Word and Wisdom of God, pre-eminent above all creation, worthy of worship – but *created*, subordinate, distinct from the one true, indivisible God, the Father Almighty.

  This was the heart of it. The truth he’d wrestled from ancient texts, codices, and the very fabric of language. The truth Athanasius had buried beneath layers of political maneuvering and doctrinal decrees at Nicaea, forging the monstrous, illogical idol of the Trinity to cement the power of an imperial church. Original Christianity, the faith of the Apostles, was Arian – acknowledging Christ’s divinity as God’s supreme Agent, His Son, but not co-equal, not consubstantial. The Father *alone* was autotheos, God-in-Himself.

  A log collapsed in the grate, sending a shower of sparks up the chimney. Newton started, his hand instinctively covering the incriminating letter to Locke. The shadows seemed to leap towards him. *Heresy.* The word echoed in the silence, louder than the settling embers. It wasn’t just an abstract danger; it was the ruin of reputation, expulsion, the loss of his position here… *at Trinity College*. The irony tasted bitter on his tongue. Master of the Mint, President of the Royal Society, Lucasian Professor – titles built on reason and mathematics, yet his lodgings stood within walls dedicated to the very doctrine he knew was a corruption.

  He thought of William Whiston, brilliant, earnest, his successor in the Lucasian Chair. Whiston hadn't hidden his Arian sympathies. He’d proclaimed them, published them. And the result? Expulsion. Stripped of his position, cast out from Cambridge, branded a heretic. Whiston’s fate was a stark warning written in fire. Newton had seen the venom, the irrational fury that theological deviation provoked. His own work on the prophecies, his alchemical pursuits – they could be dismissed as eccentricities. But this… this was the core. To challenge the Trinity was to challenge the very foundation of the established Church and the state intertwined with it.

  His eyes flickered to a heavy, locked drawer in his writing desk. Within lay the bulk of his theological writings – thousands of pages dissecting prophecies, tracing doctrinal history, proving the corruption of Nicaea. Years of secret labor, conducted in the silent hours, hidden even from his closest associates. He’d intended this smaller treatise, *Two Notable Corruptions*, to be a test, a cautious probe sent to Locke, a trusted friend, shielded by anonymity. But now, even that felt reckless. The arguments were sound, unassailable by textual scholarship. But soundness wouldn’t save him from the mob, the bishops, the politicians who equated orthodoxy with order.

  He imagined the treatise circulating. Whiston’s fate would be his own, magnified tenfold. His life’s work, his position, his legacy – all consumed by the flames of orthodoxy. The cold logic that governed his celestial mechanics warred with a primal fear. The truth was a burden, a dangerous secret. Was revealing it worth the sacrifice of everything he’d built? Was the restoration of primitive Christianity possible in an age still shackled by Nicaean dogma?

  His hand trembled slightly as he picked up the recall letter. The ink had dried. The arguments in *Two Notable Corruptions* were correct; he had no doubt. The Comma Johanneum *was* a fraud. The reading in Timothy *was* a scribal error exploited by Trinitarians. The Trinity *was* a monstrous corruption of the pure monotheism of the early Church. But the world wasn’t ready. *He* wasn’t ready.

  With a sigh that seemed to empty his lungs, Isaac Newton reached for the sealing wax. He held it over the candle flame until a fat drop fell onto the folded recall letter. He pressed his signet ring firmly into the molten red pool, the image of the Newton crest sinking into the wax, binding the decision shut. The truth would remain locked away, another secret guarded within the walls of Trinity, known only to God, the silent books, and the man who feared the consequences of revealing it. The treatise for Locke would be recalled. The fire of his conviction would continue to burn, but hidden, banked deep within, illuminating only the private darkness of his chambers.
