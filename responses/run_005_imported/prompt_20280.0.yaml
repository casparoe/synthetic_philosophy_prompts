  First, I need to break down the buck-passing theory. It reduces value to reasons for pro-attitudes. The demon example shows a reason to admire that doesn't make the demon admirable. The friend's solution is distinguishing object-given (features of the object) vs. state-given (consequences of the attitude) reasons. The user suspects circularity here because defining "object-given" might implicitly rely on value concepts.

  The circularity worry: If "object-given" reasons are those grounded in the object's value-relevant features, but value is what's being defined, that's circular. For example, saying a reason is object-given because it's based on features that make admiration fitting already assumes a notion of fittingness, which is tied to value. So, the buck-passer needs to specify which features count without referencing value. But how? Features like cruelty or wit seem value-laden. Even if we list properties, the selection criteria might rely on prior value judgments.

  Possible non-circular approaches? One idea is to use constitutive norms. For admiration, what makes it the attitude it is? Admiration is responsive to perceived excellence. So, reasons must align with that aim. But this shifts from source to content: reasons must bear on the object's excellence. However, this still invokes the attitude's nature, which might presuppose value. Another approach is formal: reasons must be about the object, not the attitude's consequences. But that might exclude too much or too little, and without content restrictions, it could include irrelevant features.

  Now, the belief analogy. Pascal's Wager gives pragmatic reasons to believe, but these aren't evidence-based. Evidentialists say only truth-related reasons count. This mirrors the object-given/state-given distinction. However, belief's constitutive aim is truth, making the restriction more straightforward. Pro-attitudes like admiration don't have a single clear aim. So, while structurally similar, belief's case is easier because truth provides a clearer criterion. Admiration's criteria are more varied and value-laden.

  The user's deeper needs: They want a clear argument against their friend's position, showing the circularity isn't resolved. They also seek understanding of whether the belief case is analogous. They might be preparing for a discussion or their dissertation, needing thorough counterarguments. Their frustration with circular discussions indicates a desire for a decisive, logical breakdown.

  Are there solutions? Hybrid approaches might help, like combining source and content constraints. Or naturalistic accounts linking reasons to human psychology. But these face challenges. The user might need to conclude that while the distinction is useful, it doesn't fully reduce value without residue. Highlighting the parallels and differences with belief can strengthen their argument, showing that pro-attitudes lack a unified criterion like truth.
answer: |-
  Your skepticism is well-founded. The "object-given vs. state-given" distinction (OG/SG) is a crucial tool for buck-passers, but its adequacy in *non-circularly* solving the Wrong Kind of Reasons (WKR) problem remains deeply contested. Here's a careful reconstruction of the circularity worry and why OG/SG *alone* is often seen as insufficient:

  **The Core Circularity Worry: Why OG/SG Might Be Question-Begging**

  1.  **The Buck-Passer's Aspiration:** The buck-passing account (BPA) aims to *analyze* value (e.g., goodness, admirability) solely in terms of *reasons* for pro-attitudes (favoring, admiring, desiring). "X is good" = "There are reasons to favor X."
  2.  **The WKR Challenge:** The demon case shows that "There is a reason to admire X" (even a conclusive reason) does *not* entail "X is admirable." The reason provided (avoiding torture) is intuitively the *wrong kind* of reason for admirability.
  3.  **The OG/SG Response:** The buck-passer restricts the analysis: "X is admirable" = "There are *object-given* reasons to admire X." OG reasons are grounded *solely* in features intrinsic to X (its properties, nature, actions). SG reasons are grounded in the *consequences* of having the attitude (admiring X leads to Y).
  4.  **The Circularity Charge:** The worry is that the *only* non-arbitrary way to identify *which* features of X ground *object-given* reasons for admiration is to appeal to a *prior*, unreduced understanding of what *makes* something *admirable* in the first place. In other words:
      *   *Why* do features like X's courage, intelligence, or kindness ground OG reasons for admiration?
      *   *Why* do features like X's ability to torture you, or the fact that admiring X makes you rich, *not* ground OG reasons (even if they ground SG reasons)?
      *   The natural answer seems to be: "Because courage, intelligence, and kindness are *admirable* qualities, while the ability to torture or the causal consequence of admiring are not *themselves* admirable qualities."
      *   **The Problem:** If this is the answer, then the notion of an "object-given reason" is *defined* in terms of the very value property (admirability) it's supposed to *analyze*. The analysis becomes circular: X is admirable iff there are reasons to admire it grounded in features that *make it admirable*.

  **Why "Source" Alone Isn't Enough (The Smuggling Charge)**

  Your friend emphasizes distinguishing reasons by their *source* (object's features vs. attitude's consequences) rather than their *content* (value properties). The circularity worry argues that specifying the *relevant* source still smuggles in value:

  *   **Not All Object Features Are Relevant:** An object has infinitely many features. Pointing to its location at a specific nanosecond, its atomic composition, or its weight don't ground OG reasons for admiration. *Which* features of the object are reason-providing? The buck-passer needs a principle to select *value-relevant* features.
  *   **The Selection Problem:** What principle selects the *reason-grounding* subset of X's intrinsic features? The buck-passer cannot say "features that are good-making" or "admirability-conferring" without circularity. But any *other* principle (e.g., "features that are salient," "features mentioned in folk psychology") seems arbitrary or fails to capture the normative essence of value. The suspicion is that the *only* coherent selection principle is implicitly value-laden: we pick out features *because we recognize them as potentially value-conferring*.
  *   **"Grounded In" is Normatively Loaded:** Saying a reason is "grounded in" a feature of the object implies a *normative connection* between that feature and the appropriateness of the attitude. Why is cruelty a ground for disapproval? Why is wit a ground for admiration? Explaining *this grounding relation* seems to require invoking the very evaluative concepts the BPA seeks to reduce. The "grounding" relation looks suspiciously like the "making fitting" or "making appropriate" relation that older fitting-attitude analyses used – which the buck-passer wants to avoid defining value in terms of, precisely to escape circularity worries associated with *those* views.

  **Is There a Non-Circular Way to Draw the OG/SG Line?**

  The buck-passer's challenge is to define "object-given reason" *without* relying on unreduced value concepts. Some attempts:

  1.  **Formal/Structural Constraint (Pure Source):** Define OG reasons *solely* by their source: reasons whose existence depends *only* on properties of the object of the attitude, and *not at all* on the consequences of holding the attitude. SG reasons depend (at least partly) on the consequences.
      *   **Problem:** This seems insufficient. A feature like "being such that admiring it pleases the demon" is an intrinsic property of the demon, but it still seems to ground only a SG reason, not an OG reason relevant to *admirability*. The restriction needs a *content* constraint as well.
  2.  **Content Constraint via Attitude Nature:** Define OG reasons as reasons that bear on the *content* or *point* of the specific attitude-type. What is the *nature* of admiration? Arguably, admiration is an attitude *responsive to perceived excellence* or *merit*. Therefore, OG reasons for admiration must be reasons that relate to X's *excellence* or *merit*. Similarly, OG reasons for desire relate to X's *desirability* (being desirable).
      *   **Appeal:** This avoids direct appeal to *value* by appealing to the *constitutive norms* or *aim* of the attitude itself. We can analyze the attitude-type independently.
      *   **Problems:**
          *   **Circularity Resurfacing:** Does defining admiration as "responsive to perceived excellence" smuggle in the value concept "excellence"? If "excellence" is just a synonym for "admirability," circularity returns. The buck-passer needs a non-evaluative account of the attitude's constitutive aim.
          *   **Attitude-Specificity:** This makes the BPA attitude-relative. The analysis of "good" becomes complex: reasons for which *kind* of pro-attitude? Admiration? Desire? Approval? Different attitudes have different constitutive aims. What unifies them under "good"? (Buck-passers like Scanlon focus on "being a reason" in general, but the WKR problem forces attitude-specificity).
          *   **The Belief Analogy Looms:** This solution looks *very* similar to the evidentialist solution for belief.
  3.  **Naturalistic Constraint:** Ground the relevant features in natural properties identified by our best (e.g., evolutionary, psychological) theories of why humans have pro-attitudes. OG reasons track features our attitudes evolved to respond to.
      *   **Problem:** This risks collapsing into a form of naturalism the buck-passer might want to avoid and may not capture the *normative force* of reasons. It also faces the "Open Question" argument: "I know this feature is what our admiration-response evolved to track, but is it *admirable*?"

  **The Belief Analogy: Same Problem or Different?**

  Your intuition is sharp. The WKR problem for pro-attitudes and the challenge to evidentialism about belief (Pascal's Wager) are **structurally identical instances of the same core problem.**

  1.  **The Common Structure:**
      *   **Target Normative Property:** For pro-attitudes: Value (Goodness, Admirability, etc.). For Belief: Truth/Alethic justification.
      *   **Reductive Account:** BPA: Value = Reasons for pro-attitude. Evidentialism: Justified belief = Belief supported by reasons (evidence) bearing on truth.
      *   **Counterexample:** WKR (Demon): SG reason (avoid torture) to admire, but demon not admirable. Pascal: SG reason (infinite reward) to believe, but belief not alethically justified/true.
      *   **Proposed Solution:** Restrict reasons to the "right kind": OG reasons (object's features) for value; Evidential reasons (bearing on truth) for belief.
      *   **Circularity Worry:** Defining "OG reason" non-circularly for value; Defining "evidential reason" non-circularly for belief (does "bearing on truth" presuppose an understanding of truth-conduciveness?).

  2.  **Why Belief Might Seem Easier (But Isn't Fundamentally Different):**
      *   **Clearer Constitutive Aim:** Belief has a single, widely agreed-upon constitutive aim: *truth* (or representing reality accurately). This provides a seemingly clear, non-evaluative criterion for "the right kind" of reason: reasons must bear on the *truth* of the proposition. "Bearing on truth" can be cashed out in terms of logical probability, evidence, etc.
      *   **Pro-Attitudes are Messier:** Admiration, desire, approval, etc., lack a single, uncontroversial constitutive aim. Is admiration's aim tracking excellence? Or promoting social cohesion? Is desire's aim tracking the desirable? Or motivation? This lack of clarity makes defining their "right kind" reasons harder *in practice* and more susceptible to the circularity charge.
      *   **The Illusion:** The ease in the belief case comes from the clarity of the *target* (truth), not from a fundamental difference in the *structure* of the problem. The buck-passer for value faces the same task: clarify the *target* of the pro-attitude in a way that doesn't presuppose value. If they could define "admiration" non-circularly as an attitude constitutively aimed at "excellence" (and define "excellence" non-circularly), they'd be on par with the evidentialist. The difficulty lies in doing this for evaluative properties.

  **Conclusion**

  Your friend is right that the OG/SG distinction *addresses* the WKR problem, and many buck-passers believe it *solves* it non-circularly. However, the persistent circularity worry stems from the challenge of *non-arbitrarily specifying* which object-features ground OG reasons without implicitly relying on the very notion of what *makes* something valuable or admirable. Appeals to the *source* alone seem insufficient; appeals to the *nature of the attitude* (like the belief case) offer a path but risk either circularity (if "excellence" is evaluative) or require a robust, non-evaluative account of the attitude's constitutive aim – which is precisely what's at stake in reducing value. The belief case highlights that the problem *can* potentially be solved if the target of the attitude is clear and non-evaluative (truth), but replicating this for pro-attitudes remains the core challenge. The debate often "goes in circles" because the buck-passer feels the OG/SG distinction *is* the non-circular specification, while the critic insists that any non-arbitrary application of it *must* tacitly rely on unreduced value concepts. The most promising non-stipulative path involves a deep, independent account of the nature of the relevant pro-attitudes and their constitutive aims.
