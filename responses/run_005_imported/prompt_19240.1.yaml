     - This is mostly correct. However, there is a potential issue: van Inwagen does think that life might have borderline cases? Actually, in his book "Material Beings", he does argue that life does not admit of vagueness? But is that true? In fact, van Inwagen does claim that life is not vague? Let me recall: he says that either an event is a life or it is not, and there are no borderline cases. However, this is controversial and one might object that there are borderline cases (e.g., viruses, or during the process of dying). But the student is representing van Inwagen's view correctly: van Inwagen does hold that life is not vague. So the student is right to say that, according to van Inwagen, Organicism avoids the vagueness argument because life is not vague.
