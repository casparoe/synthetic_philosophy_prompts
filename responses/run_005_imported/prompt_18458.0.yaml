  The editor's "bet your job" proposal feels psychologically intuitive but philosophically shaky - confidence without justification is just gut feeling. For the memo, I should probably:
  First clearly define the competing standards (justification-first vs. truth-first)
  Then analyze both cases through each lens
  Make a firm recommendation since the user explicitly wants no fence-sitting
  Acknowledge but firmly reject the alternative position
