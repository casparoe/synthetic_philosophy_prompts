  First, I need to understand the core tension. The friend argued Daniel had consistent judgment but failed to act (weakness of will), while the user favored the temporal self-model (hyperbolic discounting). The criticism was that the latter view might excuse relapses as rational choices. Daniel himself describes his drinking as a "betrayal," which leans toward the weakness-of-will perspective.

  The toast must navigate this carefully. For recovery guests, terms like "surrender" and "willpower" carry deep meaning. For others, academic concepts might alienate. The challenge is validating both frameworks while centering Daniel's lived experience.

  I consider structuring the toast to: 
