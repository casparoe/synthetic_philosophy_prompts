  3. Present the two interpretations neutrally as "different lenses"
  4. Bridge to what changed at sobriety (the pivotal shift)
  5. Frame 20 years as continuous choice, not one-time fix
  6. Close with communal celebration

  Key phrases to include: 
  - "Betrayal" (validating Daniel's own words) 
