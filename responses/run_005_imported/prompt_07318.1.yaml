  Crucially, I'll avoid resolving the argument. Instead, show how both views point to the same awe at Daniel's sustained commitment. The real focus is the man who stood in the gap between his selves for two decades.
answer: |-
  Here’s a toast that honors Daniel’s journey while respecting both perspectives, staying warm, inclusive, and focused on his achievement:

  **(Raising a glass of sparkling cider or water)**  
  "Friends! Twenty years! Twenty years of showing up, clear-eyed and present, for his life, for his people, for himself. Daniel, we are *so* incredibly proud of you tonight. Truly.

  Celebrating this milestone – two whole decades of sobriety – it’s impossible not to reflect on the journey that got you here. And if we’re honest, most of us in this room can only glimpse the edges of what that journey truly entailed. It was fought in private moments, in quiet struggles most of us never saw.

  Now, trying to understand that struggle… well, smart people can see it differently. Some might look at the battle with addiction and see a war within a single self – a person knowing deeply, rationally, what was best, but finding themselves unable, time and again, to act on that knowing. A profound clash of judgment and action.

  Others might see it differently. They might picture not one self at war, but a series of selves stretched across time – a future self pleading for health and connection, and a present self, overwhelmed by immediate need or pain, making choices that future self would scream against. A disconnect between who you were *right then* and who you knew you wanted to *become*.

  **(Pause, looking at Daniel warmly)**  
  Daniel, what’s remarkable, what we *all* celebrate tonight, regardless of how we frame the past struggle, is what happened *next*. What changed.

  You found a way to bridge that gap. Whether it was through immense willpower, through surrender to a greater strength, through community, through a profound realignment of priorities – or some incredible combination of them all – you did something extraordinary. You stopped the cycle. You made the choice, not just once, but day after day, week after week, year after heartbreaking year, to align your actions with your deepest values. You chose the future Daniel over the moment’s desperation, consistently and courageously.

  And when you talk about your drinking days now, you don’t talk about a different *person*, but you *do* talk about a betrayal. A betrayal of what you *knew*, deep down, you truly wanted for your life. That feeling – that sense of having acted against your own core desires – that’s real. It’s powerful. It speaks to the incredible integrity you’ve built in these twenty years. You’ve become astonishingly whole.

  **(Turning to the room)**  
  For those in recovery here, you know the daily language of will, surrender, and choice intimately. You live it. You understand the mountains Daniel climbed. For those newer to these concepts, maybe you see the incredible result: a friend, steadfast, reliable, vibrantly *here*, who made a monumental change and stuck with it. Both views are valid. Both lead us to the same awe tonight.

  Because however we understand the *before*, the *after* is crystal clear: For twenty years, Daniel has shown us what commitment looks like. What resilience looks like. What choosing life, choosing connection, choosing *yourself* – your *whole* self, across all time – looks like. He hasn’t just *stopped* doing something; he’s *built* an incredible life, full of purpose and love, brick by brick, sober day by sober day.

  So, Daniel, we raise our glasses to *you*. To the profound courage it took to start this journey. To the unwavering discipline and grace it takes to walk it, every single day. To the man who faced down the chaos and chose peace. Who faced the fracture and chose wholeness. Who faced the moment and chose the future – *our* future with you.

  Here’s to twenty years of showing up. Here’s to your strength, your wisdom, and your beautiful, sober life. May the next twenty be even brighter. Cheers to Daniel!"

  **Why this works:**

  1.  **Honors Daniel:** Focuses relentlessly on *his* achievement, *his* courage, *his* consistency, and *his* wholeness now.
  2.  **Acknowledges the Argument Neutrally:** Presents both the "weakness of will" perspective ("knowing deeply... unable to act") and the "hyperbolic discounting/temporal selves" perspective ("future self pleading... present self overwhelmed") as valid *ways people try to understand the struggle*, without declaring either the winner. It frames them as different lenses.
  3.  **Centers the Change:** The crucial pivot is on *what Daniel did* – bridging the gap, aligning action with values, making consistent choices. This transcends the argument about the *nature* of the prior struggle.
  4.  **Validates Daniel's Experience:** Explicitly mentions *his* feeling of "betrayal" as a key piece of evidence, honoring his lived reality without needing it to definitively settle the philosophical question.
  5.  **Works for Both Audiences:**
      *   **Recovery Community:** Uses concepts like "surrender," "willpower," "choice," "community," "integrity," "wholeness," "daily discipline," which resonate deeply. Acknowledges the "war" and "gap" that needed bridging.
      *   **Others:** Explains the concepts simply ("future self vs. present self," "disconnect," "aligning actions with values"). Focuses on the observable result: a reliable friend who made an amazing life change. Uses accessible language like "commitment," "resilience," "built an incredible life."
  6.  **Warmth and Celebration:** Starts and ends with pure celebration and pride. Uses language like "proud," "incredible," "remarkable," "extraordinary," "courage," "grace," "beautiful life," "cheers."
  7.  **Avoids Excusing Relapse:** By focusing on the *change* Daniel achieved and the *integrity* he built, it implicitly highlights that sobriety *was* the necessary and right choice, without needing to dissect the rationality of past relapses. The "betrayal" language directly counters any notion of excusing.

  This toast allows everyone to celebrate Daniel's monumental achievement from their own understanding, united in respect and admiration for the man and his twenty years of hard-won freedom.
