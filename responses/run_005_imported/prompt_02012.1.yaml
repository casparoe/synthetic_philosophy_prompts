  Okay, the user is asking for a comparison between Anscombe's and Walzer's views on the moral status of the Hiroshima and Nagasaki bombings. They had a debate with a friend and are looking for a rigorous analysis. Let me start by recalling both philosophers' positions.

  Anscombe, in "Mr. Truman's Degree," argues that intentionally killing innocents is always murder, no matter the consequences. She relies on the doctrine of double effect, where intention matters. If the act intends to kill civilians as a means, it's impermissible. So for her, the bombings are absolutely forbidden.

  Walzer, in "Just and Unjust Wars," introduces the "supreme emergency" exception. He allows targeting civilians only in extreme, existential threats where the alternative is worse. But he argues that in 1945, Japan wasn't an existential threat to the US, so the bombings didn't meet this criterion. 

  The user wants to know if these are fundamentally different structures—exceptionless rule vs. defeasible rule with a high bar—or if they converge in practice. Specifically, whether Walzer's exception would ever permit what Anscombe forbids.

  First, I need to outline their core principles. Anscombe's is absolute prohibition based on intention. Walzer's is a conditional prohibition with an exception clause. The key difference is structural: one has no exceptions, the other does. 

  But does Walzer's exception ever apply? He mentions Britain in 1940 facing Nazi domination as a possible supreme emergency. If such a scenario existed, Walzer might permit intentional civilian killings, which Anscombe would still forbid. So in theory, they diverge. 

  However, Walzer sets such a high bar—existential threat, imminence, no alternatives—that these cases are extremely rare. In practice, both would condemn most actions, including Hiroshima. But theoretically, Walzer allows what Anscombe doesn't.

  The user also asks if Walzer's criteria end up functioning like absolutism. While Walzer's bar is high, it's still a consequentialist override, whereas Anscombe rejects any such calculation. So even in rare cases, they differ fundamentally on whether consequences can justify intentional killing.

  Concrete example: Britain bombing German cities early in WWII. Walzer sees it as potentially excusable under supreme emergency. Anscombe would condemn it as murder. So yes, there are scenarios where Walzer permits what Anscombe forbids.

  The user’s deeper need might be understanding if moral frameworks can reconcile or if they’re irreconcilable. They might also want clarity on how each theory applies beyond this historical case, perhaps for academic or personal ethical consistency. 

  Need to ensure the answer stays focused on internal logic, not personal views. Highlight the structural divergence but note practical overlap due to rarity of supreme emergencies. Emphasize that Anscombe's absolutism vs. Walzer's threshold-based exception creates a fundamental difference in moral reasoning, especially in hypothetical extreme scenarios.
answer: |-
  Here's a rigorous comparison of Anscombe's and Walzer's frameworks for condemning the Hiroshima and Nagasaki bombings, focusing on their internal structures, potential points of conflict, and whether Walzer's "supreme emergency" ever permits what Anscombe absolutely forbids:

  **Core Structures of Moral Reasoning:**

  1.  **G.E.M. Anscombe: Absolutism via the Intention/Foresight Distinction (Double Effect):**
      *   **Foundation:** A deontological constraint grounded in the absolute moral prohibition against *intentionally killing the innocent* as a means or an end. This is intrinsically evil.
      *   **Mechanism:** The Doctrine of Double Effect (DDE) provides the critical analytical tool:
          *   An act with both good and bad effects is permissible *only if*:
              1.  The act itself is not intrinsically evil (e.g., bombing a military target).
              2.  The *intention* is only the good effect (e.g., destroying the military target).
              3.  The bad effect (e.g., civilian deaths) is *not intended* (neither as an end nor a means), but merely *foreseen*.
              4.  There is a proportionately grave reason for permitting the foreseen bad effect.
      *   **Application to Bombings:** Targeting Hiroshima/Nagasaki *intended* the mass killing of civilians (non-combatants) as the *means* to coerce Japan's surrender. This violates condition (2) and (3) of DDE. The act of deliberately targeting a civilian population center *is* intrinsically evil (violating condition 1). Therefore, **no calculation of "greater good" or "lives saved" can justify it.** It is murder, full stop. The prohibition is *exceptionless*.

  2.  **Michael Walzer: Threshold Deontology with "Supreme Emergency":**
      *   **Foundation:** A presumption against targeting non-combatants, grounded in their rights and the fundamental distinction between combatants and non-combatants essential to the "war convention" (the laws and customs of war).
      *   **Mechanism:** This presumption can be *overridden*, but **only** under conditions of "supreme emergency":
          *   **Imminence:** The threat is immediate and catastrophic.
          *   **Nature of the Threat:** The threat is of an *existential* nature – the literal or moral annihilation of a political community (e.g., Nazi victory meaning the end of any meaningful political freedom or the destruction of a people).
          *   **Proportionality:** The evil averted by violating the rule is *significantly greater* than the evil of the violation itself.
          *   **Last Resort:** There are *no morally permissible alternatives* available to avert the catastrophe.
      *   **Application to Bombings:** Walzer argues that by August 1945, Japan posed no *existential* threat to the United States. Its defeat was inevitable. Alternatives existed (continued blockade/conventional bombing, awaiting Soviet entry, exploring surrender signals, even a costly invasion). Therefore, the threshold of "supreme emergency" was **not met**. Bombing civilians was a war crime, not excusable necessity.

  **Comparing the Condemnations:**

  *   **Common Ground:**
      *   **Shared Presumption:** Both views start from a very strong, near-absolute presumption against deliberately killing civilians. Neither treats it as a routine tool of warfare.
      *   **Condemnation of Hiroshima/Nagasaki:** Both views definitively condemn these bombings, though for different primary reasons (Anscombe: intrinsic evil of the intention; Walzer: failure to meet the supreme emergency threshold).
      *   **Rejection of Simple Consequentialism:** Both reject the argument that "saving more lives overall" is sufficient justification *by itself* for targeting civilians. Anscombe rejects consequentialism entirely in this domain; Walzer demands an extreme, non-consequentialist threshold (existential threat) before consequences can even be considered as potentially overriding the rule.

  *   **Fundamental Differences:**
      *   **Structure of the Rule:**
          *   **Anscombe:** **Exceptionless Absolutism.** The prohibition on *intending* the death of innocents is a moral absolute. No consequences, no matter how catastrophic, can render it permissible. It defines the act itself as intrinsically wrong.
          *   **Walzer:** **Defeasible Rule with Extreme Threshold.** The prohibition is a powerful rule of the war convention, but it is *defeasible* under the extraordinary, narrowly defined conditions of "supreme emergency." Consequences *can* override the rule, but only when they involve averting an existential catastrophe.
      *   **Role of Intention vs. Threshold Conditions:**
          *   **Anscombe:** The *intention* is the decisive factor. If the killing of innocents is intended (as a means or end), the act is murder, period. The nature of the threat or the balance of consequences is irrelevant to permissibility (though it might affect culpability or excuse in a different sense).
          *   **Walzer:** The decisive factor is whether the *objective situation* meets the threshold conditions (imminent, existential threat, last resort). *If* the threshold is met, then deliberately killing civilians *can* become permissible (or at least excusable), *regardless of the specific intention* framing the act (as long as the act aims to avert the catastrophe). The act is redefined from "murder" to a "tragic necessity" under these unique circumstances.
      *   **Moral Logic:** Anscombe's view is fundamentally **deontological**, prioritizing the inherent wrongness of the intentional act. Walzer's view is **threshold deontological**, where strong deontological rules hold sway until a catastrophic consequentialist threshold is crossed.

  **Does Walzer's Doctrine Ever Permit What Anscombe Forbids? The Crucial Test:**

  **Yes, absolutely. This is the core theoretical divergence.**

  *   **Walzer's Explicit Example:** Walzer argues that Britain's bombing of German cities in 1940-41 (before strategic bombing shifted more towards specific military/industrial targets) *might* be excusable under the "supreme emergency" doctrine. Nazi victory at that point posed an *imminent, existential threat* to Britain and, more importantly, to the very possibility of a free Europe. The threat was of enslavement and genocide. Conventional military defeat seemed likely. Walzer sees this as a plausible, though deeply tragic, candidate for the supreme emergency exception.
  *   **Anscombe's Inevitable Condemnation:** For Anscombe, the British bombing campaign described by Walzer would **still be murder.** The *intention* in area bombing was to kill German civilians and destroy their morale as a *means* to force the Nazi regime to surrender or collapse. This intention to kill innocents as a means makes the act intrinsically evil, regardless of the existential nature of the Nazi threat or the lack of alternatives. The consequences cannot justify the intentional evil.
  *   **The Permitted/Forbidden Gap:** Therefore, in the scenario Walzer describes as a potential supreme emergency (Britain, 1940-41), **Walzer's framework *permits* (or excuses) the deliberate targeting of civilians, while Anscombe's framework *absolutely forbids* it as murder.** This is the clearest possible case where the structures diverge in their moral verdicts.

  **Does Walzer's "Supreme Emergency" Effectively Function Like Absolutism in Practice?**

  *   **Rarity, Not Absolutism:** Walzer sets the threshold for "supreme emergency" so extraordinarily high (imminent, existential, no alternatives) that he argues it has likely only been met a handful of times in history (Britain 1940 being his primary example, with deep reservations). This makes violations *extremely rare in practice*, but **not impossible in principle.** The rarity stems from the severity of the criteria, not from an absolute prohibition.
  *   **Anscombe's True Absolutism:** For Anscombe, the prohibition *is* absolute in principle and practice. No set of circumstances, no matter how dire, can make the *intentional killing of innocents* morally permissible. It is *always* forbidden.
  *   **Practical Overlap vs. Theoretical Divergence:** In the overwhelming majority of historical cases, including Hiroshima/Nagasaki, *both* frameworks will condemn the deliberate killing of civilians. However, this practical overlap in condemnation **does not** mean the frameworks are functionally identical or that Walzer's threshold does the "same work" as Anscombe's absolutism. The existence of *any conceivable scenario* (like Britain 1940 as Walzer frames it) where Walzer permits what Anscombe forbids demonstrates a fundamental structural difference. Walzer builds in an escape hatch for catastrophic consequences; Anscombe welds the door shut.

  **Conclusion:**

  Your intuition is correct: Anscombe and Walzer represent **fundamentally different structures of moral reasoning** regarding the deliberate killing of civilians in war. Anscombe offers an **exceptionless, intention-based absolutism** grounded in deontology and Double Effect: intending innocent death is always murder. Walzer offers a **threshold-based defeasible rule** grounded in the war convention: the prohibition can be overridden *only* by a supreme emergency (imminent, existential threat, last resort).

  While both strongly condemn the Hiroshima and Nagasaki bombings and share a deep aversion to targeting civilians, they diverge crucially in principle. **Walzer's framework explicitly permits, under the narrowest conceivable conditions, what Anscombe absolutely forbids.** The paradigmatic case is Walzer's own example of Britain's early WWII bombing campaign. For Walzer, the existential nature of the Nazi threat *could* (with immense regret) justify the intentional killing of German civilians as a necessary evil. For Anscombe, that same act remains intrinsically evil murder, regardless of the catastrophic consequences it might avert. The difference lies not in their assessment of 1945 Japan, but in the very structure of their moral theories and the existence of Walzer's catastrophic consequentialist override for his otherwise strong deontological rule.
