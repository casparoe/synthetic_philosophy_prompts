prompt: |-
  So I'm meant to be writing my dissertation chapter on fitting-attitude accounts of value but I've fallen down a side-tunnel on the wrong-kind-of-reasons problem instead, and I want someone to pressure-test an argument before I bring it to my advisor (this came up at reading group last week and I couldn't quite articulate it on the spot). Quick recap of the setup in case it helps to have it stated the way I'm using it: buck-passers say X is good iff X has properties that give us reason to favor X. The standard trouble case is the evil-demon scenario -- I think it's originally Rabinowicz and Ronnow-Rasmussen's, though I might be misremembering the source -- where a demon will torture you unless you come to desire some worthless saucer of mud. You now have a reason to desire the mud, but obviously not because the mud is good, so the buck-passing analysis threatens to spit out the wrong verdict unless "reason" in the analysis can somehow be restricted to the right kind.

  There's the state-given/object-given move (say the demon's reason doesn't count because its grounded in facts about the state of desiring rather than the object desired), but I'm less interested in that one right now. What I actually want pressure-tested is the fancier "higher-order" fix, which I believe traces to Danielsson and Olson: the idea that the demon doesn't really give you reason to desire the mud, just reason to want to desire it, so the wrong-kind reason gets pushed up a level and never touches the attitude the buck-passing analysis is actually about. Please argue, as forcefully as you can, that this move fails because it's just a regress wearing a solution's clothes: for any level you push the corruption to, I can build a new demon (or a new case, doesn't have to be a demon) that attaches a wrong-kind reason to that level instead, and there's no principled place to call a halt. So the buck-passer either has to admit every level is potentially corruptible, which seems to just concede the original problem, or stipulate that some level is off-limits, which needs an argument they don't obviously have. Don't just assert the regress though -- take seriously the best reply on the buck-passer's behalf, something like: the hierarchy has to bottom out at a state (a brute desire, or something Frankfurt-style like an identification) that isn't itself the kind of thing reasons attach to, so there's nothing left to corrupt -- and tell me whether that stopping point is principled or just a stipulation with a fancier name.

  If it actually strengthens things, feel free to bring in the thought (Jonathan Way's, I think, though again don't quote me) that this whole problem generalizes way past buck-passing, to basically any account that tries to explain a normative status via reasons for a response -- but only if it sharpens the regress point, I don't want a lit review, I want the single strongest version of the specific objection above.
reasoning: |-
  Okay, the user is working on their dissertation chapter about fitting-attitude accounts of value, specifically focusing on the wrong-kind-of-reasons (WKR) problem in buck-passing theories. They've gotten sidetracked into this issue and want to pressure-test an argument against the higher-order solution proposed by Danielsson and Olson. They need a forceful critique that the higher-order fix leads to a regress, and they want someone to examine whether a potential stopping point in the hierarchy is principled or just a stipulation.

  First, I need to recap the core problem. Buck-passing says something is good if it has properties that give us reasons to favor it. The evil demon case is a classic counterexample: the demon gives you a reason to desire a saucer of mud to avoid torture, but the mud isn't actually good. The higher-order fix claims the demon only gives you a reason to want to desire the mud, not to desire it directly. So the WKR is pushed to a higher level, leaving the first-order attitude untouched.

  The user's argument is that this leads to a regress. For any level, you could have a demon attaching a reason to that level. The buck-passer might say the hierarchy bottoms out at a state not subject to reasons, like a brute desire or Frankfurtian identification. The user wants to know if this stopping point is principled or arbitrary.

  I should structure the critique. Start by clearly explaining the higher-order solution and the regress threat. Then, present the stopping point response: that at some level, attitudes are brute or identified with, not reason-based. Argue that this is problematic. Maybe use an adapted demon scenario targeting that brute state. For example, a demon threatens torture unless you have a brute pro-attitude towards mud. If you can't control brute attitudes, the threat seems incoherent, but the buck-passer might say reasons don't apply here. However, that seems ad hoc.

  Key points: The buck-passer needs to explain why brute states are immune to reasons while higher-order attitudes aren't. If brute states are beyond reasons, then the higher-order reasons don't actually govern them, making the account collapse. Also, Frankfurtian identification might involve reasons, leading to a regress again. If identification is itself based on reasons, then a demon could target those reasons. If it's reason-independent, it's arbitrary.

  The user mentioned Jonathan Way's point about the problem generalizing. I can note that the regress issue affects any account explaining normativity via reasons for responses, but focus on how it sharpens the critique here. The higher-order solution just relocates the problem without solving it.

  Strongest version: The stopping point is either arbitrary (no reason why that level is immune) or it undermines the buck-passing account (if brute states aren't reason-responsive, then the analysis fails). Conclude that the higher-order fix doesn't resolve the WKR problem and might concede the original issue.
answer: |-
  Here’s a pressure-tested argument against the higher-order solution to the WKR problem, targeting its vulnerability to regress and the instability of its proposed "stopping point." I’ll reconstruct the buck-passer’s strongest defense (the Frankfurt-style identification move) and show why it fails to halt the regress convincingly. The core objection is that **the hierarchy doesn’t bottom out in a way that escapes corruption, and any attempt to stipulate a "reason-immune" attitude either begs the question or collapses the buck-passing project**.

  ### Step 1: The Higher-Order "Solution" and the Regress Threat
  - **Danielsson/Olson maneuver**: The demon gives you a reason to *want to desire* the mud (a second-order attitude), not a reason to *desire* it (first-order). Since buck-passing analyzes goodness in terms of reasons for *first-order* favoring (e.g., desire), the mud isn’t deemed good.  
  - **Your regress objection**: For any level *n* the buck-passer designates as the "relevant" one for the analysis (e.g., first-order desire), I can construct a variant where the demon threatens torture unless you form an attitude *at level n+1*. For example:  
    - Demon 1: "Torture unless you *desire* the mud."  
      → Higher-order fix: "Ah, but this only gives reason to *want to desire* it!"  
    - Demon 2: "Torture unless you *want to desire* the mud."  
      → Now the reason corrupts the second-order attitude.  
    - Demon 3: "Torture unless you *want to want to desire* the mud."  
      → Ad infinitum.  
    If every level is corruptible, the buck-passer must either:  
    (a) **Concede the WKR problem persists** at every level (undermining the analysis), or  
    (b) **Stipulate a "fixed point"** where attitudes aren’t reason-responsive.  

  ### Step 2: The Buck-Passer’s Best Defense: The Frankfurtian "Stopping Point"  
  The buck-passer might invoke **hierarchical theories of agency** (e.g., Frankfurt) to block the regress:  
  - **The proposal**: The hierarchy bottoms out in a **brute, reason-immune state of "identification"** (e.g., a desire you endorse wholeheartedly without further reflection). At this level, attitudes aren’t held *for reasons*; they’re pre-rational commitments that *anchor* the chain of higher-order attitudes.  
    - *Example*: You might "identify" with desiring friendship intrinsically. This identification isn’t based on reasons—it’s the bedrock of your agency. The demon can’t corrupt it because it’s not reason-responsive.  
  - **Why this seems promising**:  
    - It mirrors Frankfurt’s solution to infinite regress in volitional hierarchies.  
    - It distinguishes *attitudes we have reasons for* (higher-order) from *constitutive attitudes* (identification) that define our practical identity.  

  ### Step 3: Why the Stopping Point Fails (It’s a Stipulation, Not a Solution)  
  **Objection 1: The "brute identification" move is question-begging.**  
  - To claim identification is "reason-immune" assumes **precisely what’s in dispute**: that some pro-attitudes are *by definition* beyond the reach of normative reasons. But the WKR problem challenges whether *any* attitude can be insulated from instrumental/coercive reasons.  
    - *Counter-demon*: "I’ll torture you unless you *identify with desiring mud*."  
      - If identification is truly reason-immune, this threat is incoherent—you can’t form identifications *for reasons*. But this is **empirically and normatively implausible**. People *do* cultivate new identifications under duress (e.g., Stockholm syndrome), and we can rationally ask, *"Should I identify with this desire?"*  
      - If the buck-passer insists identification *can’t* be reason-responsive, they’re **stipulating a dogma**, not solving the problem. The demon scenario shows that *any* attitude, including identification, *could* have WKRs attached if we adjust the threat.  

  **Objection 2: It collapses the buck-passing project.**  
  - Buck-passing aims to **reduce value to reasons for pro-responses**. If the "fitting" attitude (e.g., desire) is ultimately grounded in a brute identification *unresponsive to reasons*, then:  
    - Goodness is no longer analyzed *solely* in terms of reasons—it tacitly relies on arational commitments.  
    - This concedes that the buck-passing analysis is **incomplete**: it needs an additional, non-reason-based component (identification) to avoid the WKR regress. But if brute identifications aren’t reason-governed, *why are they "fitting"?* The account loses its explanatory unity.  

  **Objection 3: Frankfurtian identification doesn’t halt the regress—it relabels it.**  
  - Frankfurt himself acknowledges that identification can be **iterated**: "Do I *identify with my identification*?" If so, the regress resurges:  
    - Demon 4: "Torture unless you *identify with your identification* with desiring mud."  
  - If the buck-passer replies that identification is "where reasons run out," they’re just **asserting a stopping point without justification**. Nothing in the concept of identification *itself* prevents WKRs from applying; it’s simply declared immune to avoid the regress.  

  ### Step 4: Generalization (Sharpening the Regress Point)  
  - As Jonathan Way notes, this regress threatens **any reason-based analysis of normative properties** (e.g., reasons to blame, reasons to admire). The core issue is: **Reasons can always be "hijacked" by external incentives unless the target attitude is arbitrarily walled off from practical rationality**.  
    - The higher-order fix *heightens* this problem: by pushing WKRs upstairs, it forces the buck-passer to either:  
      - (i) **Deny that higher-order attitudes can have WKRs** (implausible, as Demon 2 shows), or  
      - (ii) **Admit a non-reason-based "foundation"** (which abandons the reductionist project).  

  ### Conclusion: The Higher-Order Fix Fails  
  The Danielsson/Olson maneuver doesn’t resolve the WKR problem—it **relocates it up a level and exposes a deeper instability** in buck-passing accounts. The Frankfurtian "stopping point" is a dressed-up stipulation: declaring identification reason-immune doesn’t withstand demonic repackaging, and it undermines the buck-passer’s goal of reducing value to reasons. **The regress shows that as long as reasons can be instrumentally manufactured for *any* attitude, the analysis remains vulnerable.** To block this, the buck-passer must either accept that WKRs *are* reasons (implausible, as it equates "good" with "coerced favor") or abandon the reduction. Either way, the higher-order fix is regressively inadequate.  

  **Next step for your advisor**: Frame this as a dilemma: *If the hierarchy bottoms out in a reason-immune state, buck-passing loses its reductive force; if it doesn’t, the WKR regress persists. Neither option saves the analysis.* This forces a reevaluation of the state-given/object-given distinction or the viability of buck-passing itself.  

  Would you like a condensed version of this for your chapter draft, or a follow-up on how this regress interacts with other WKR solutions?
