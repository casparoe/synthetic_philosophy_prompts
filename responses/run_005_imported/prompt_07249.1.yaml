prompt: |-
  So I've been reading around in the "embedded agency" corner of decision theory / AI-safety for a seminar on rational self-trust, and I keep running into this thing that comes up under "tiling agents" -- apparently there's a hard obstacle, named after Löb's theorem, to an agent ever fully trusting that a future or successor version of itself will act well, even when that successor reasons in exactly the same way and theres no independent reason to doubt it. Every writeup I find just gives me the formal derivation, and I dont come away with any real feel for why this is philosophically inevitable rather than just an artifact of how proof-based agents happen to be built. Can you give me the intuitive version -- why does trying to formally justify trust in your own future reasoning end up undermining itself?
