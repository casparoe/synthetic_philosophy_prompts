  Also, Neurath's work on unified science and the encyclopedia model required constant negotiation and revision, which contrasts with Isotype's static, finalized presentations. The boat metaphor is dynamic, while Isotype images are fixed, potentially misleading users into seeing them as unmediated facts. This could be a point of tension: the medium's nature versus the philosophy of perpetual revision.

