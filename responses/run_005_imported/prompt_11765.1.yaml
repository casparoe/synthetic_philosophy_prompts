  Random thought while re-reading Arendt for next week's seminar. In "Truth and Politics" and the Pentagon Papers essay ("Lying in Politics"), her point isn't just "lying is bad" -- it's that modern political lying, unlike the old-fashioned kind, goes after the whole fabric of factual truth rather than just misrepresenting isolated facts within a shared picture of reality, and that the people doing the lying often end up deceiving themselves too. She obviously never saw deepfakes, social media virality, or a press secretary casually talking about "alternative facts." Based on the actual distinctions she draws (rational vs. factual truth, organized image-making, the self-deception of the liars themselves), what do you htink she'd say about our current disinformation enviroment? Would she see it, on her own terms, as a difference in degree from what she diagnosed in the Pentagon Papers essay, or a genuine difference in kind? Don't just hand-wave it, tie your answer back to her specific arguments.
