  Now, the moral core question. The user wants to know which aspect—preserved choice or low cost—really justifies nudges. I think low cost is more fundamental. Even if choice is restricted slightly, if the burden on the rational is negligible, the policy feels fair. But if costs are high, preserving choice alone doesn't save it. The cooling-off period example shows that people accept mild constraints when the cost is trivial. Whereas the green energy opt-out, despite preserving choice, faces backlash due to hassle. 

