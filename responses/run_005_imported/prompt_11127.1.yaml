answer: |-
  You've hit on a crucial and subtle distinction within the hypocrisy/standing-to-blame literature. While Wallace, Cohen, and others firmly establish that **hypocrisy undermines the *standing* to blame**, they generally **do not** claim that hypocrisy undermines the *truth* or *validity* of the underlying moral norm being invoked. Your friend's argument conflates these two distinct concepts. Here's a breakdown:

  1.  **The Core Insight of Standing-to-Blame Theory:**
      *   Blaming is a normative practice with conditions for legitimate participation. Key conditions often include:
          *   **Fairness/Non-Hypocrisy:** The blamer must not be guilty of the same fault *without adequate excuse or justification*.
          *   **Appropriate Relationship/Authority:** The blamer must stand in a relevant relationship to the blamed (e.g., community member, victim, authority figure).
          *   **Sincerity/Commitment:** The blamer must genuinely endorse the norm they are invoking.
      *   **Hypocrisy Violates Fairness/Sincerity:** When a blamer commits the same fault without justification, they violate the fairness condition (holding others to a standard they flout) and often the sincerity condition (their actions suggest they don't *truly* endorse the norm's force).
      *   **Forfeiture of Standing:** Because they violate the constitutive norms of the blaming practice itself, the hypocrite lacks the *moral authority* or *right* to issue that specific blame. Their criticism becomes *normatively impotent* or *inapt* – it loses its proper force *as blame*. The target can rightly say, "You have no right to say that *to me* in *that way*."

  2.  **Why This Does NOT Mean the Accusation Itself is False:**
      *   **Separation of Norm and Speaker:** The *truth* or *validity* of the moral norm ("Tax avoidance of type X is wrong") exists independently of *who* asserts it or *whether they follow it themselves*. A truth doesn't cease to be true because a liar says it.
      *   **Focus of the Theory:** Standing-to-blame theory focuses on the *relational* and *performative* aspects of blaming – the interaction between blamer and blamed. It asks, "Is *this person* entitled to level *this rebuke* at *this target*?" It does *not* primarily address the objective moral status of the act being blamed.
      *   **The Cheating Professor Analogy:** Imagine a professor who constantly cheats on their spouse lecturing students on the importance of academic honesty. They absolutely lack the *standing* to blame students for cheating – their hypocrisy makes their lecture hypocritical and ineffective *as a form of blame*. However, this does *not* mean the underlying claim ("Academic cheating is wrong") is false. The students caught cheating are still culpable *for cheating*, even if *this particular professor* is the worst possible person to point it out.
      *   **The Council Member Case:** The revelation shows the council member lacks the *standing* to blame corporations for tax avoidance. Her criticism rings hollow, is unfair, and she forfeits the moral authority to demand accountability *from others* on this specific issue. **However, it does *not* prove that the tax avoidance she condemned (and practiced) is actually morally permissible.** The *substance* of her accusation – that routing income through offshore shells to avoid taxes is wrong – remains untouched *as a moral claim*. Its truth depends on arguments about fairness, social contract, harm to public services, etc., not on her personal conduct.

  3.  **When Might Hypocrisy *Indirectly* Challenge the Norm? (Cautiously):**
      *   **Practical Contradiction as Weak Evidence (Not Proof):** If a hypocrite's *actions* consistently demonstrate a *rejection* of the norm they preach, one *might* argue their actions reveal a tacit belief that the norm isn't actually binding or important. However, this is weak evidence:
          *   People act against their sincerely held beliefs all the time (weakness of will).
          *   They might have specific (even if unjustified) excuses for their *own* violation that don't apply generally.
          *   Their actions might reflect selfishness or corruption, not a genuine rejection of the norm's validity for others.
      *   **Undermining Persuasive Force, Not Truth:** Hypocrisy massively undermines the *persuasive power* of an argument. If the speaker doesn't live by their words, it suggests they don't truly believe them or that the norm is impractical, making others less likely to *accept* the norm. But "less persuasive" is not the same as "false."
      *   **Revealing Inconsistency in *Application* (Not the Norm Itself):** Hypocrisy might show the accuser applies the norm selectively or based on self-interest, which could challenge their *interpretation* or *prioritization* of the norm, but not necessarily the core validity of the norm itself (e.g., "She only calls it wrong when others do it, implying it's really about power, not principle" – this critiques *her use* of the norm, not the norm).

  4.  **Answering Your Core Questions:**

  *   **Should you treat a critic's hypocrisy as *evidence* that their underlying accusation was mistaken?**
      *   **Generally, No.** Hypocrisy is primarily evidence about *the critic's relationship to the norm and their standing to blame*, not about the objective truth of the norm itself. It's weak and indirect evidence at best for the norm's falsehood, easily outweighed by arguments supporting the norm's validity. Treating it as direct evidence commits a fallacy (a form of ad hominem circumstantial: dismissing the claim because of the claimant's behavior).

  *   **Does pointing out hypocrisy rebut the *substance* of the criticism?**
      *   **No, not directly or logically.** Pointing out hypocrisy effectively **rebuts the *standing* of the critic** to level that specific blame. It discredits *them* as a legitimate blamer *in this instance* and undermines the *force* of their rebuke *as an act of blaming*. It is a powerful way to say, "*You* have no right to say *that* to *me* (or *them*)."
      *   **It does *not* logically demonstrate that the *action* they criticized was permissible.** The substance of the criticism ("Action X is wrong") needs to be addressed on its own merits (e.g., "No, action X is wrong because of reasons Y and Z, regardless of who points it out or their hypocrisy").

  **Conclusion:**

  The standing-to-blame literature powerfully shows that hypocrisy **silences the hypocrite** as a legitimate voice of blame. It strips them of the moral authority to condemn others for the fault they share. However, it **does not vindicate the blamed action** or prove the underlying moral norm false. Your friend's argument overextends the theory. The council member's hypocrisy destroys her standing to blame corporations, making her criticism hypocritical and ineffectual *as blame*. But it does not magically make corporate tax avoidance morally acceptable. The truth of her original claim stands or falls on arguments about tax justice, not on her personal failings. Pointing out hypocrisy is a legitimate way to deflect the blame *from oneself* by disqualifying the blamer, but it is not a legitimate way to refute the substance of the moral claim being made. It targets the speaker's authority, not the proposition's truth.
