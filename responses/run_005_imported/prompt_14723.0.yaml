answer: |-
  Here are ten interview questions designed to systematically challenge the deflection that differential judgments are *merely* psychological, pushing the control principle to its limits on circumstantial luck, agent-regret, and constitutive luck, culminating in the skepticism dilemma. Each core question targets a specific weakness, with a pre-emptively crafted follow-up based on the predicted "will vs. person" distinction defense.

  **Core Question 1: Circumstantial Luck & the Untested Virtue**
  > "Professor, let's take Nagel's circumstantial luck seriously. Consider two individuals: Person A lives under a brutal occupation but resists, displaying courage. Person B lives in peaceful times, never facing a serious moral test. The control principle seems to demand we *cannot* credit Person B with the *virtue* of courage – they simply lacked the opportunity to *fail* or succeed. Doesn't this mean the control principle excuses the untested from lacking virtues *as readily* as it excuses the merely unlucky (like the reckless driver who didn't hit anyone) from blame? Both seem victims of circumstance regarding the manifestation of a trait."

  *   **Predicted Defense:** *"Ah, but we assess the *will* or *disposition* based on the choices actually made. Person B *may* have had a latent disposition, but without a test, we cannot *know* or *credit* it as an actual virtue. We assess what was manifested under their control."*
  *   **Follow-Up Question:** "But if we can't credit Person B with courage, doesn't that imply that possessing a virtue *requires* the circumstantial luck of being tested? If Person B had faced the occupation, they *might* have resisted – but the control principle forbids assigning credit or blame for counterfactuals. Isn't the *value* we place on actual courage (manifested only due to luck) then inconsistent with the principle's insistence that luck shouldn't affect desert? Are we valuing the lucky circumstance as much as the will?"

  **Core Question 2: Agent-Regret & First-Person Appropriateness**
  > "Moving to Bernard Williams' agent-regret: imagine a truck driver who, through no negligence on his part (a freak mechanical failure he couldn't have foreseen), kills a child. He experiences profound agent-regret – a specific sorrow *that it was him* who did it. A bystander, knowing all the same facts, feels sympathy but not this specific agent-regret. If differential judgments are purely psychological errors, why does this sentiment of agent-regret feel uniquely *appropriate* specifically *to the agent*, even when he knows he wasn't blameworthy? Why wouldn't a purely psychological account predict that, knowing he lacked control, he *shouldn't* feel this distinct form of regret?"

  *   **Predicted Defense:** *"Agent-regret is a natural human response tied to being causally involved in a terrible outcome. It's about the *causal role*, not about desert or blameworthiness *per se*. It reflects a deep psychological truth about our relationship to our actions' consequences, even unintended ones, but doesn't imply a metaphysical difference in blame."*
  *   **Follow-Up Question:** "But if it's *only* about the causal role and not about desert, why is the sentiment specifically structured as *regret* directed at *one's own agency* ('that *I* did it'), rather than just generic horror or sadness about the event itself? Doesn't the very structure of 'agent-regret' suggest a connection to the perspective of agency that a mere bystander, even a causally proximate one, doesn't share? If it's purely causal, shouldn't the mechanic who last serviced the truck feel the *same* specific agent-regret?"

  **Core Question 3: Constitutive Luck & the Quality of the Will**
  > "Your defense relies heavily on blameworthiness tracking the 'quality of the will' at the moment of action. But constitutive luck – the temperament, capacities, and inclinations we're born with or develop unchosen – seems deeply embedded *in* that will. Take someone with an innate, severe impulsivity disorder making a reckless choice. If we blame based on the poor quality of their will *in that moment*, but that poor quality itself stems largely from constitutive bad luck – factors utterly beyond their control – haven't we simply relocated the problem of luck *into the will itself*? How does appealing to the 'will' solve the luck problem if the will's core features are luck-laden?"

  *   **Predicted Defense:** *"We distinguish between assessing the *particular will* manifested in the action and assessing the *whole person* or their constitutive traits. Blameworthiness attaches to the *exercise* of the will *in that choice*, regardless of how that will was formed. We hold people responsible for how they *deploy* their capacities, even if the capacities themselves are unchosen."*
  *   **Follow-Up Question:** "But doesn't this 'deployment' distinction risk becoming arbitrary? If the constitutive traits (e.g., impulsivity, empathy deficit, low frustration tolerance) significantly determine *how* the will is likely to be deployed in specific situations, and these traits are unchosen, how is blaming the 'deployment' meaningfully different from blaming the luck-laden traits? If the deployment *is* substantially shaped by constitutive luck, isn't blaming the deployment still, ultimately, blaming the luck? Can the 'will in the moment' be meaningfully isolated from the constitutive self?"

  **Culminating Question: The Skepticism Dilemma**
  > "Pursuing the control principle rigorously – through resultant, circumstantial, *and* constitutive luck – seems to lead to a profound dilemma. If *every* factor relevant to desert (intention, capacity, circumstance of choice, manifestation of traits) must be under the agent's control to ground true desert, and yet the regress seems endless (what controls the controller?), doesn't this strict principle ultimately undermine the very notion of basic desert it aims to protect? Doesn't it push us towards the 'hard luck' skepticism of philosophers like Galen Strawson or Neil Levy, who argue that ultimate responsibility is impossible because we are never the ultimate source of our wills? If the control principle, taken seriously, leads to the conclusion that *no one* is ever *ultimately* blameworthy or praiseworthy in the basic desert sense, hasn't it proven too much, sacrificing responsibility *to* luck rather than rescuing it *from* luck?"

  These questions force engagement beyond the simple "psychology vs. metaphysics" deflection by:
  1.  **Targeting Specific Luck Categories:** Moving beyond resultant luck to the trickier circumstantial and constitutive forms.
  2.  **Challenging the Appropriateness of Sentiments:** Questioning *why* certain feelings (like agent-regret) attach specifically to the agent if not reflecting something metaphysically relevant.
  3.  **Pushing the Individuation Strategy:** Demanding how the "will in the moment" can be cleanly separated from its constitutive, luck-laden foundations.
  4.  **Highlighting Potential Inconsistencies:** Pointing out how the principle might lead to counterintuitive conclusions about the untested or seem to merely relocate the luck problem.
  5.  **Forcing the Skepticism Confrontation:** Explicitly framing the potential self-defeating nature of a hyper-strict control principle.

  The pre-planned follow-ups anticipate the most likely defense ("will vs. person/deployment") and immediately challenge its coherence or sufficiency, preventing the deflection from settling the issue and pushing the conversation deeper into the metaphysics of agency and luck. Good luck with the interview!
