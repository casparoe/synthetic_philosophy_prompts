answer: |-
  The candle guttered, throwing Arnaud’s shadow like a restless giant against the damp stone of the scriptorium. Before him lay not just parchment and ink, but the coiled tension of a city-state held hostage. Toulouse groaned under two tyrants, and Arnaud, its reluctant scholar-clerk, felt the weight of Aquinas’s *Summa Theologiae* pressing harder than any mailed fist.

  **Tyrant One: Lord Balthasar.** Seized power during the chaos of the Great Fever. No bloodline claim, no council election, just hired swords and opportunism. He ruled with capricious cruelty, squeezing Toulouse for coin to fund his mercenary court. *Tyrannus in titulo*, Aquinas called it. A ruler without title, without legitimacy. Arnaud traced the Latin: *"Unde si ad jus humanum aliquid potestas accedat, non erit justa."* Such power, lacking human law's sanction, *is not just*. And Aquinas seemed clearer here: removing such a usurper wasn't necessarily regicide, but restoring rightful order. A flicker of grim hope. But by whom? Aquinas hedged: *"Non tamen ad quemlibet privatum hominem, sed ad eum pertinet cui commissum est..."* Not to any private individual, but to whomever has the public authority...

  **Tyrant Two: King Raimond.** Legitimate heir, crowned with full papal blessing. For ten years, a just steward. Then, after the death of his queen? A slow, chilling descent. Taxes became ruinous, laws arbitrary, dissenters vanished. *Tyrannus in regimine*. A legitimate ruler turned tyrannical in his governance. Here, Aquinas turned cautious, almost frustratingly so. Arnaud reread the passage: *"Si vero ad jus humanum potestas accedat, et ille tyrannice abutatur..."* If the power *is* legitimately acquired, and he abuses it tyrannically... *"...non est consiliandum quod per se aliquis privatam violentiam inferat."* It is not advisable that any private individual inflict violence. The remedy lay elsewhere – with the ruler’s superiors (the Pope? A distant Emperor?), or... *"etiam per multitudinem subditorum"*... even through the multitude of subjects. But how? When? Aquinas offered no blueprint, only warnings against the chaos of individual vengeance.

  A sharp knock. Elara, her face pale beneath her hood, slipped in. "Word from the docks. Balthasar’s men seized the *Silver Heron*. Cargo confiscated, the master hanged for 'smuggling'... his own goods."

  Arnaud’s fist clenched. *Tyrannus in titulo*. Illegitimate. A thief ruling by force. Removing him *was* justice. But Aquinas’s question echoed: *By whom?* Arnaud was no public body. He was a clerk, keeper of the city’s neglected archives.

  "And Raimond?" Arnaud asked, dreading the answer.

  "A new levy," Elara whispered. "The 'Crown's Comfort.' Half the harvest, they say. Old Man Theroux refused... his mill is burning now."

  *Tyrannus in regimine*. Legitimate in origin, monstrous in action. Aquinas’s caution felt like chains. *"Non est consiliandum..."* Not advisable for a private individual. But the 'multitude'? Toulouse was cowed, divided. The remnants of the city council? Powerless puppets under Balthasar’s thumb, ignored by Raimond’s distant court.

  Later, Arnaud stood before the dimly lit niche holding the city’s charter – granted by a long-dead Count, affirmed by the Pope. He ran his fingers over the wax seals. *Public authority*. It resided here, in this parchment, in the *idea* of Toulouse as a self-governing commune. Not extinguished, only suppressed. The council still existed, in name, its members chosen (theoretically) by the guilds and burghers. *Eum cui commissum est*... To whomever the authority is committed. Could *this* be the public body Aquinas implied?

  **Balthasar:** Illegitimate. Removal was *just*. But the act needed legitimacy itself. Could the council, the repository of the city’s ancient authority, even in its weakened state, *commission* action? Or was Arnaud, desperate, twisting the text?

  **Raimond:** Legitimate. A private blade against him wasn't just regicide; Aquinas suggested it was morally perilous, potentially damning. Only a superior power or the organized "multitude" – which Arnaud interpreted as the *reconstituted, acting council* – could rightfully judge and depose him. But how? Petition the Pope? Hope for imperial intervention? While Theroux’s mill smoldered?

  Days bled into nights filled with hushed meetings. Arnaud argued Aquinas like a weapon. With Balthasar, he found reluctant allies among the council members: "He has *no right*," Arnaud insisted, pointing to the charter, then to Aquinas. "Removing him isn't murder; it’s reclaiming stolen property. But *we* must authorize it. *We* are the public body, even now. To act alone is to become another Balthasar."

  With Raimond, the argument stalled. "He *is* the King," muttered Master Taillefer, the weaver's representative. "God anointed him."

  "God anointed Saul," Arnaud countered, "and yet David spared him, leaving judgment to God and the course of events. Aquinas says we *cannot* act alone against a legitimate ruler turned tyrant. We must *collectively* resist, or appeal higher. To strike him ourselves... it risks damnation and anarchy." It felt like cowardice. Theroux’s face haunted him. But Aquinas’s distinction was a chasm he couldn't cross with a dagger.

  The plan for Balthasar solidified. The council, in secret session, invoked the city charter and Aquinas. They declared Balthasar a usurper and authorized "faithful citizens" to remove him "for the restoration of right order." Arnaud wouldn’t wield the blade, but his words provided the scaffold of legitimacy. It felt terrifyingly fragile, yet grounded in the *Summa*.

  The night Balthasar fell (a swift, brutal affair in his own guard tower, orchestrated by the Captain of the Watch, acting under the council's secret writ), Arnaud felt no triumph, only a sickening relief. The *titulo* mattered. The public sanction mattered.

  Then came the rider from Raimond’s court. The "Crown's Comfort" levy was doubled. Non-payment meant forfeiture of land and title. The legitimate King’s tyranny tightened its grip.

  Arnaud sat again in the scriptorium. The candle flame danced. Before him lay the *Summa*, open to the fraught passage on *tyrannus in regimine*. He had navigated the first Thomistic fork: illegitimate ruler, public body sanctioning removal. Now, the deeper, murkier water: legitimate ruler, turned monster. Petition the Pope? Months, years away. Hope the council could somehow *become* the "multitude" capable of resisting? How? Open rebellion against an anointed king?

  Elara entered, her eyes hollow. "They took the Theroux children. Surety for the levy, they say."

  Arnaud looked at Aquinas’s words: *"Non est consiliandum..."* Not advisable for a private individual. The gears of Thomistic reasoning ground within him, heavy and slow. The distinction was real, agonizingly so. Balthasar’s blood was one thing. Raimond’s...? To lift his hand, even in righteous fury, felt like stepping off a cliff Aquinas had specifically warned against. Yet, the council’s authority seemed laughably insufficient against the Crown. Was the only Thomistic path now passive suffering and prayer? Or was the *multitudo* stirring in the terrified eyes of the people, waiting for a sign he couldn't give?

  He closed the *Summa*. The gears kept turning, meshing logic with desperation, authority with impotence, leaving him suspended in the awful, unresolved tension Aquinas himself had forged. The candle flickered, casting long, uncertain shadows. The reasoning wasn't decoration; it was the cage, and the only key he had might not fit this lock. The silence of the scriptorium offered no answer, only the echo of a question: *Who acts when the tyrant wears the crown of legitimacy, and the public body is but a whisper?* Arnaud dipped his quill, not knowing if the next word he wrote would be a plea, a plan, or an epitaph for justice.
