answer: |-
  Below is a finite normal-form game constructed to demonstrate the distinction between pure-strategy dominance and mixed-strategy dominance in iterative elimination. The game involves two players: Row (with strategies **R1, R2, R3**) and Column (with strategies **C1, C2, C3**). Payoffs are given as (Row, Column). Column's payoffs are uniformly 0 to ensure no Column strategy is dominated, isolating the focus on Row's strategies.

  ### Payoff Matrix:
  |        | **C1**    | **C2**    | **C3**    |
  |--------|-----------|-----------|-----------|
  | **R1** | (4, 0)    | (0, 0)    | (5, 0)    |
  | **R2** | (0, 0)    | (4, 0)    | (1, 0)    |
  | **R3** | (1, 0)    | (1, 0)    | (0, 0)    |

  **Key properties**:
  - **R3** is not dominated by **R1** or **R2** under pure strategies.
  - **R3** is strictly dominated by the mixed strategy **σ = (2/3 R1, 1/3 R2)** (asymmetric weights).
  - Column's payoffs are identical across all cells → no Column strategy is ever dominated.

  ---

  ### Iterative Elimination: Pure-Strategy Dominance Only
  **Round 1**:  
  - Check Row:  
    - **R1 vs. R2**:  
      - C1: 4 > 0 → R1 better  
      - C2: 0 < 4 → R2 better  
      - C3: 5 > 1 → R1 better  
      → Neither dominates the other.  
    - **R1 vs. R3**:  
      - C1: 4 > 1 → R1 better  
      - C2: 0 < 1 → R3 better  
      → R3 not dominated by R1.  
    - **R2 vs. R3**:  
      - C1: 0 < 1 → R3 better  
      - C2: 4 > 1 → R2 better  
      → R3 not dominated by R2.  
  - Check Column: All payoffs = 0 → no dominance.  
  **Result**: No strategies eliminated. **R3 survives**.  

  **Subsequent Rounds**: No further eliminations.  
  **Final surviving strategies**: {R1, R2, R3} for Row; {C1, C2, C3} for Column.  

  **Conclusion for pure-strategy elimination**: R3 is never eliminated.  

  ---

  ### Iterative Elimination: Mixed-Strategy Dominance Allowed
  **Round 1**:  
  - **R3** is strictly dominated by **σ = (2/3 R1, 1/3 R2)**:  
    - C1: (2/3)(4) + (1/3)(0) = **8/3 ≈ 2.67** > 1 (R3's payoff)  
    - C2: (2/3)(0) + (1/3)(4) = **4/3 ≈ 1.33** > 1 (R3's payoff)  
    - C3: (2/3)(5) + (1/3)(1) = **11/3 ≈ 3.67** > 0 (R3's payoff)  
  → Eliminate **R3**.  

  **Reduced game**:  
  |        | **C1**    | **C2**    | **C3**    |
  |--------|-----------|-----------|-----------|
  | **R1** | (4, 0)    | (0, 0)    | (5, 0)    |
  | **R2** | (0, 0)    | (4, 0)    | (1, 0)    |

  **Round 2**:  
  - Check Row:  
    - R1 and R2 are not dominated by each other (same as Round 1 pure-strategy check).  
    - No mixed strategy of R1/R2 dominates R1 or R2 (e.g., R1 is uniquely best if Column plays C1 or C3; R2 is uniquely best if Column plays C2).  
  - Check Column: Still no dominance (payoffs = 0).  
  **Result**: No further eliminations.  

  **Final surviving strategies**: {R1, R2} for Row; {C1, C2, C3} for Column.  

  **Conclusion for mixed-strategy elimination**: R3 is eliminated immediately.  

  ---

  ### Why This Distinction Matters for Epistemic Foundations
  - **"Not dominated by a pure strategy"** (e.g., R3) only means no single pure strategy dominates it in every state. However, it **can still be irrational** if a mixed strategy dominates it, as shown.  
  - **"Never a best response to any belief"** is equivalent to being **strictly dominated by a mixed strategy** (by the equivalence theorem). Here, R3 is strictly dominated by σ → it can *never* be a best response to *any* belief over Column's actions.  
  - **Epistemic implication**: Common knowledge of rationality (CKR) implies players only play strategies that survive mixed-strategy elimination (rationalizable strategies). Pure-strategy elimination is insufficient to capture CKR, as it retains strategies like R3 that are never best responses. This gap arises because beliefs can be probabilistic, and mixed strategies encode how a rational player "hedges" against uncertainty.  

  This example demonstrates that rationalizability requires mixed-strategy dominance to fully characterize the consequences of CKR. Pure-strategy dominance leaves "irrational" strategies intact.
