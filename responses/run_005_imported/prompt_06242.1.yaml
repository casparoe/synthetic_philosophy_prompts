answer: |-
  You've articulated a profound and widely recognized challenge to Joyce's program—one that strikes at the heart of whether accuracy-first epistemology truly delivers a *nonpragmatic* foundation for probabilism. Your summary, aligning with Maher's critique (and expanded by others like Hájek, Levinstein, and Schoenfield), is fundamentally correct. Let's refine the objection and map the dialectic to ensure your paper captures the nuances.

  ### Core Objection: The Scoring-Rule Relativity Problem
  1.  **The Claim of Nonpragmatic Superiority:** Joyce argues his dominance argument avoids Dutch Books' reliance on controversial "pragmatic" bridge principles (e.g., "you ought to avoid bets leading to sure loss"). Instead, it appeals purely to the *epistemic* goal of accuracy.
  2.  **The Dependency on Scoring Rules:** The dominance result is proven *relative to the Brier score*. As you note, many other scoring rules exist:
      *   **Log Score (Negative Log-Probability):** `-log(b(X))` if X true, `-log(1-b(X))` if X false. Favored in information theory; strictly proper.
      *   **Spherical Score:** `b(X)/sqrt(b(X)^2 + b(¬X)^2)` if X true (similarly for ¬X). Strictly proper, bounded.
      *   **Absolute Value Score:** `|1 - b(X)|` if X true, `|0 - b(X)|` if X false. Not strictly proper, but intuitive.
  3.  **The Relativity Problem:** For some incoherent credence functions `c`:
      *   **Under Brier:** `c` is dominated by some coherent `c*` (Joyce's result).
      *   **Under Log Score:** Maher (and others) showed some incoherent `c` are *not* dominated by *any* coherent `c*`. They might even *dominate* some coherent credences in specific cases. Similar results hold for other rules.
  4.  **The Illusion of Nonpragmatism?** The objection is:
      *   If dominance under *the Brier score* is the justification for probabilism, this justification depends entirely on the *choice* of scoring rule.
      *   This choice appears **arbitrary** from the perspective of pure "accuracy" or "closeness to truth." Why is squared error more fundamentally "accurate" than absolute error or logarithmic divergence?
      *   Therefore, the argument seems to *replace* the Dutch Book's pragmatic assumption ("avoid sure loss") with an equally contestable *epistemic* assumption ("accuracy *just is* Brier inaccuracy minimization"). The "nonpragmatic" advantage vanishes if the scoring rule choice is itself unmotivated or pragmatic.

  ### Nuances & Proponents' Responses (For Your Dialectic)
  Your paper should engage with these responses to show the debate's depth:

  1.  **Joyce's Refinement (2009): Axiomatizing "Reasonable" Scores:**
      *   Joyce concedes the Brier-specificity problem. His later work seeks axioms *any* "reasonable" measure of accuracy should satisfy, aiming to show that *only* probabilistic credences avoid dominance *under any scoring rule satisfying these axioms*.
      *   **Key Axioms:**
          *   **Truth-Directedness:** If `c` is uniformly closer to truth-values than `c'` at a world, `c` is strictly more accurate.
          *   **Propriety (Strictly Proper):** Each coherent credence function `c` expects itself to be more accurate than any alternative `c'` (prevents "immodesty"). *This is crucial.*
          *   **Continuity:** Small changes in credence cause small changes in inaccuracy.
          *   **Convexity/Additivity:** Often assumed for technical reasons (e.g., global inaccuracy is sum of local inaccuracies).
      *   **The Result:** Joyce (2009) argues that if a scoring rule satisfies these (or similar) axioms, then any incoherent `c` is dominated by some coherent `c*`, and no coherent `c` is dominated by another coherent `c*`.
      *   **The Retort:** Critics (e.g., Predd et al. 2009, building on Savage) show dominance holds *if* the scoring rule is **strictly proper and additive (separable)**. However:
          *   **Log Score IS Strictly Proper & Additive:** Yet, as Maher noted, some incoherent credences aren't dominated under Log Score! How is this possible? The dominance result under strictly proper rules typically requires the *entire agenda* of propositions to have a specific structure (like being a partition or an algebra). For arbitrary agendas, dominance *only* holds under specific rules like Brier, not necessarily under Log.
          *   **Axioms as Stipulative?** Why are *these specific axioms* constitutive of "accuracy" itself? Are convexity or additivity genuinely part of the *concept* of accuracy, or are they convenient mathematical properties? Is propriety epistemic (about rational estimation) or pragmatic (about self-endorsement under expected utility)?

  2.  **The "Immodesty" (Propriety) Defense:**
      *   Proponents argue **strict propriety** is non-negotiable: A rational agent should expect their *own* credences to be most accurate. Using a scoring rule that isn't strictly proper would allow rational agents to prefer *other* credences as more accurate estimates of their own accuracy – an epistemic absurdity.
      *   **The Retort:** While propriety has intuitive appeal, it's not self-evident that it's the *only* or *most fundamental* epistemic constraint. Further, it doesn't single out Brier; Log is also strictly proper. The key issue remains that *dominance results vary across strictly proper rules* depending on the agenda. Probabilism is *necessary* for avoiding dominance *under all* strictly proper scores only under specific agenda constraints.

  3.  **The "No Coherent Loss" Argument:**
      *   Some argue that even if *some* incoherent credences escape dominance under *some* reasonable rules, *no* coherent credence is *ever* dominated under *any* reasonable (truth-directed, proper) rule. The defect of incoherence is that it *can* (under common/scorable contexts) lead to avoidable inaccuracy, while coherence *never* suffers this defect. Coherence is a "safe harbor."
      *   **The Retort:** This weakens the original claim. Joyce's initial argument promised that incoherence *necessarily* leads to dominance (under Brier). If the best defense is that incoherence *sometimes* leads to dominance (under *some* reasonable rules, in *some* contexts), while coherence *never* does, this is a significantly weaker, more contingent vindication. It doesn't establish probabilism as a *strict* epistemic requirement derived purely from accuracy.

  4.  **The "But Brier is Natural!" Response:**
      *   Some defend Brier based on mathematical elegance (differentiability, ties with Euclidean distance) or frequency in statistics (Mean Squared Error).
      *   **The Retort:** This justification leans heavily on mathematical convenience or statistical tradition, not on a pure analysis of "accuracy" as an epistemic concept. It risks being pragmatic or aesthetic.

  **Conclusion for Your Paper: Stating the Objection Fairly & Precisely**

  Your objection is sound and central to the literature. State it clearly:

  > *While Joyce's accuracy-dominance argument avoids the explicit pragmatism of Dutch Book arguments, its normative force depends critically on the choice of inaccuracy measure (scoring rule). Joyce's original result relies on the Brier score. However, alternative scoring rules—such as the log score or spherical score—which also satisfy plausible constraints like truth-directedness and strict propriety, do not accuracy-dominate all incoherent credence functions in the same way, and may even allow some incoherent functions to dominate coherent ones under specific conditions. Consequently, the justification for probabilism derived from accuracy-dominance appears relative to the choice of scoring rule. This raises the concern that the argument has not escaped dependence on an auxiliary assumption—the selection of a specific inaccuracy measure—any less contestable than the pragmatic assumptions underpinning Dutch Book arguments. The "nonpragmatic" advantage is arguably illusory if the choice of scoring rule lacks a compelling, purely epistemic justification grounded solely in the concept of accuracy itself.*

  **Is it Fatal?** That's your argument to make! The literature shows:
  *   **Yes, to the Strong Claim:** The ambition for a *single*, scoring-rule-independent, purely accuracy-based *proof* that *every* incoherent credence is strictly dominated (like under Brier) is likely untenable.
  *   **Debatable for the Weaker Claim:** Accuracy-first proponents argue their refined axioms *do* provide a nonpragmatic foundation, grounding propriety/convexity in epistemic rationality itself. Critics argue the axioms remain inadequately motivated or reintroduce pragmatic elements (e.g., propriety via expected utility). The program delivers a *different kind* of argument—one centered on immodesty and dominance-avoidance under "sensible" measures—but whether it's decisively *less pragmatic* than Dutch Books remains contested. Your paper could productively argue that while the approach shifts the *location* of the auxiliary assumptions, it doesn't eliminate the need for them, undermining the claim of a purely nonpragmatic vindication.

  This is a rich debate, and your grasp of the core issue is excellent. Engage deeply with Joyce (2009), Predd et al. (2009), Maher's critiques, and more recent discussions (e.g., by Pettigrew, Levinstein, Schoenfield) on the status of the axioms. Good luck with the paper!
