prompt: |-
  Quick one (well, not that quick) — I'm redoing the philosophy of mind unit for next term and fell down a bit of a rabbit hole rereading Leibniz's Monadology this weekend instead of grading, which probably says something about my priorities. Anyway, section 17 — the bit where he says imagine a machine that could think blown up to the size of a mill, so you could walk around inside it, and all you'd find is parts pushing on other parts, nothing you could point to as "the perceiving" — it struck me as basically Searle's Chinese Room three hundred years early. I mentioned this to a collegue at lunch and she thought I was overselling the similarity, so now I want a second opinion before I put the two texts on the same syllabus week.

  Could you actually compare Leibniz's mill argument and Searle's Chinese Room in some depth, rather then just noting the surface resemblance? Specifically I'm curious: (1) are they really targeting the same thesis, or is Leibniz going after mechanism/materialism about perception in general while Searle is only after a much narrower claim about syntax and computation; (2) does something like the "systems reply" work against both equally, or does Leibniz's background metaphysics — his views on genuine unities vs. mere aggregates — give him a principled way of blocking that move that Searle doesn't have available; and (3) what do we make of the fact that the two arguments cash out in totally different positive pictures of the mind — monads and pre-established harmony for Leibniz, "biological naturalism" for Searle. Basically, is Searle just re-skinning Leibniz for the computer age, or is there real philosophical work being added, and if so, what is it?
