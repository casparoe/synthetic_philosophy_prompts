  ## The Circularity Charge Against Joyce's Accuracy-Dominance Argument: A Critical Assessment

  James Joyce's accuracy-dominance argument for probabilism is a landmark in formal epistemology. By claiming that non-probabilistic credences are *accuracy-dominated* (guaranteed to be less accurate in every possible world than some probabilistic alternative), Joyce grounds rational coherence in the purely epistemic virtue of truth-tracking. However, the restriction to "legitimate" inaccuracy measures—specifically, additive, continuous, strictly proper scoring rules—raises a significant circularity concern. Does defining propriety using probabilistic expectation presuppose the very probabilism the argument seeks to establish? Let's weigh the case.

  **The Core Circularity Charge:**
  The accusation is straightforward:
  1.  **Propriety is defined probabilistically:** A scoring rule is strictly proper *if and only if* reporting your true credence uniquely maximizes your *expected score* relative to *that same credence function*. This explicitly relies on probabilistic expectation (i.e., calculating expectations using the credences themselves).
  2.  **The argument assumes propriety:** Joyce's dominance theorem requires the inaccuracy measure to be strictly proper (alongside additivity and continuity) to guarantee that only non-probabilistic credences are dominated.
  3.  **Begging the Question?** Therefore, by demanding propriety, the argument already assumes that rational agents *ought* to evaluate potential credence functions using probabilistic expectation. This appears to presuppose that credences are fit for such expectation calculations – i.e., that they *are* probabilities satisfying the axioms (normalization, non-negativity, additivity). If probabilism isn't already assumed, why privilege probabilistic expectation as the standard for evaluating scoring rules?

  **Defending the Restriction: Independent Motivations for Propriety**

  Proponents of the accuracy-dominance argument offer several compelling, non-question-begging motivations for restricting scoring rules to proper ones:

  1.  **The Truth-Centered Incentive (No "Gaming"):** Propriety ensures that a rational agent, motivated solely by the goal of being accurate (and not by, say, pleasing an audience or hedging bets), has no incentive to misrepresent their *own sincere best estimate* of the truth. A non-proper rule would allow situations where an agent genuinely believes P has probability 0.7, but expects a *better* score by reporting 0.8. This violates a core epistemic norm: the scoring rule should incentivize honesty with oneself about one's actual state of uncertainty. Propriety operationalizes this norm without *initially* assuming full probabilism; it demands coherence between belief and reporting strategy under the agent's *own* perspective on uncertainty.
  2.  **Dominance Avoidance as the Driving Intuition:** The core force of Joyce's argument isn't derived *from* propriety; it's derived from the intuitive epistemic disaster of being *dominated*. If your credences are such that, no matter how the world turns out, there's another set of credences that was *more accurate*, then your credences are objectively deficient as a guide to truth. Propriety enters primarily as the *mathematical key* that unlocks the connection between probabilistic coherence and the *avoidance* of this dominance. Crucially, the *undesirability* of being dominated seems like a primitive epistemic norm – it means your credences are *never* the best (or even tied for best) choice for accuracy, making them pragmatically self-defeating for a truth-seeker.
  3.  **The Formal Link to Convexity:** Propriety is mathematically equivalent to the inaccuracy measure (seen as a loss function) being strictly convex in the reported probabilities. Convexity captures the intuitive idea that inaccuracy should increase more sharply the further one's report is from the truth. While convexity can be expressed via expectations, it can also be understood geometrically: mixtures (probabilistic averages) should be less inaccurate than the average inaccuracy of the mixed points. This geometric interpretation emphasizes the "averaging" or "hedging" property that makes incoherent credences vulnerable to domination, providing a motivation for propriety grounded in the structure of accuracy comparisons rather than probabilistic rationality per se.
  4.  **The "No Self-Sabotage" Principle:** Even without a fully developed theory of rational expectation, one can argue that a rational agent should not adopt a scoring rule that *guarantees* they could have done better *by their own lights* had they reported differently, *even when they report truthfully*. Non-proper rules allow this form of guaranteed self-sabotage relative to the agent's own credences. Propriety rules this out, ensuring that truthful reporting is at least *self-endorsed* as optimal under the agent's own view of the possibilities.

  **Weighing the Verdict: A Survivable Challenge, Not a Fatal Blow**

  The circularity charge highlights a genuine tension and underscores that the accuracy-dominance argument doesn't operate in a complete justificatory vacuum. **However, the charge does not defeat the argument.** The independent motivations for propriety, particularly the **Truth-Centered Incentive** and the **Dominance Avoidance Intuition**, provide sufficient non-circular grounding for restricting scoring rules to proper ones.

  *   **The Core Defense:** The undesirability of accuracy-domination is an *intuitive* and *powerful* epistemic failing. It renders a credence function *pragmatically useless* for a truth-seeker; you might as well have used the dominating alternative. Propriety is the mathematically precise condition that *explains why* probabilistically coherent credences are the *only* ones immune to this catastrophic flaw under reasonable scoring rules. While propriety is *defined* using probabilistic expectation, its *justification* within the argument primarily rests on the non-circular goals of incentivizing truthful reporting and avoiding guaranteed suboptimality *from the agent's own perspective*. The expectation calculation is a *tool* used to characterize the rules that achieve these goals, not the foundational assumption of probabilism itself.

  *   **The Lingering Vulnerability:** The defense relies heavily on the premise that avoiding being accuracy-dominated *is* a fundamental epistemic good and that incentivizing truthful reporting is essential. An opponent who rejects these premises might remain unconvinced. Furthermore, the argument doesn't *derive* the concept of expectation from scratch; it leverages a formal tool. But this is a feature of most compelling philosophical arguments – they build upon pre-theoretic intuitions and useful formalisms.

  **Conclusion:**
  The circularity charge against Joyce's accuracy-dominance argument is insightful but ultimately unsuccessful in defeating it. While propriety is formally defined using probabilistic expectation, its role in the argument is justified by independent, pre-theoretic epistemic norms: the imperative to avoid being universally accuracy-dominated (an intuitively disastrous epistemic state) and the requirement that a scoring rule should not incentivize misrepresenting one's own genuine beliefs. These norms motivate the restriction to proper scoring rules without presupposing the full machinery of probabilism. Consequently, the accuracy-dominance argument stands as a powerful, non-question-begging justification for probabilism, grounded in the fundamental epistemic aim of accuracy. The definitional link to expectation is a formal necessity for characterizing propriety, but the *justification* for demanding propriety rests on more basic epistemic desiderata.
