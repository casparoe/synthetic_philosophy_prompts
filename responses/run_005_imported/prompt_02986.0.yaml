answer: |-
  ## The Metaphysics of Missing Rollbacks: On Omissions as Causes

  Your experience with the postmortem perfectly crystallizes a profound and contentious debate in metaphysics: can the mere *absence* of an action genuinely cause an event, or is such talk merely a shorthand for assigning blame against a backdrop of expectations? The asymmetry you observed—where the on-call engineer's inaction is deemed causal while identical inactions by others are not—strikes at the heart of this question and exposes the central problem of **causal profligacy**. Let us dissect the competing theories, their attempts to handle this profligacy, and arrive at a defensible verdict.

  **The Counterfactual Onslaught: Lewis and the Profligacy Problem**

  David Lewis’s counterfactual theory provides the starkest answer: **yes, omissions are literal causes**. According to Lewis, causation is defined by counterfactual dependence: event C causes event E if and only if, had C not occurred, E would not have occurred (or would have occurred differently in a significant way). Applied to omissions, the "non-occurrence" of an action (like the rollback) is the cause. If the on-call engineer *had* rolled back within 15 minutes, the outage *would have* been shorter. This counterfactual holds true. Crucially, Lewis (as in "Void and Object") insists the logic applies universally: *any* agent who *could* have performed the rollback action and whose failure to do so satisfies the counterfactual test is equally a cause. Your failure, your director's failure, and even the failure of the engineer on the unrelated team *are*, on this strict view, literal causes of the prolonged outage. If any of you *had* acted, the effect *would* have been different.

  *   **Handling Profligacy?** Lewis acknowledges the resulting explosion of causes but embraces it as a feature, not a bug. He argues our *practical* interests and focus naturally limit which causes we *mention* or *blame*. Metaphysically, however, the vast network of counterfactually dependent absences genuinely constitutes the causal landscape. The asymmetry in your postmortem is purely pragmatic, masking an underlying metaphysical symmetry.

  **The Physicalist Pushback: Dowe and the Absence of Process**

  Phil Dowe and proponents of the **physical process** or **conserved quantity** theory offer a stark rebuttal: **no, omissions cannot be literal causes**. True causation, they argue, requires a spatiotemporally continuous physical process involving the transfer or exchange of conserved quantities (like energy or momentum). A cause must physically *produce* its effect. An omission—the *absence* of an action—involves no such physical process connecting the non-event to the outcome. The bad deploy code actively interacted with the system, causing errors; the *lack* of a rollback command sent no physical signal halting the deploy. Dowe labels omissions "quasi-causes": they play a role in our explanatory practices, often linked to responsibility, but they lack the genuine metaphysical "oomph" of real causation.

  *   **Handling Profligacy?** This view elegantly dissolves the problem. If only positive physical events are causes, then the director's inaction, your inaction, and the unrelated engineer's inaction are simply *not* causes at all, any more than the absence of a meteor strike preventing the outage is a cause. The profligacy vanishes because absences are categorically excluded. The on-call engineer's omission is also not a *literal* cause; the outage was caused solely by the active processes initiated by the bad deploy. We might *say* "the failure to roll back caused the outage," but this is shorthand for "given the bad deploy, the absence of the *expected* rollback action (by the responsible agent) meant the system remained in a faulty state." The asymmetry arises because we pragmatically focus on the *most relevant expected intervention* that was missing.

  **The Normative Middle Ground: McGrath and Contextual Causation**

  Sarah McGrath and others propose a middle path: **omissions can be causes, but only relative to a normative or statistical baseline**. Causation-by-omission isn't primitive; it depends on a contextually specified norm, expectation, or statistical norm about what *should* or *usually* happens. The on-call engineer's failure to roll back counts as a cause *because* they had a specific duty defined by the SLA. Your director's failure, while counterfactually identical, isn't a cause *in this context* because there was no norm or expectation that *they* would personally execute rollbacks within 15 minutes. The unrelated engineer's failure isn't a cause at all relative to any plausible norm concerning this service.

  *   **Handling Profligacy?** The normative baseline acts as a powerful filter. It restricts "cause" status only to those omissions that violate a relevant standard or expectation within the specific causal inquiry. This explains the postmortem asymmetry perfectly: the norm (the SLA) singled out the on-call engineer. Countless other potential actors whose inaction also satisfies the counterfactual test are irrelevant because their action wasn't normatively expected. Profligacy is avoided by relativizing causation to contextually salient norms.

  **Verdict: Omissions as Causes, But Only Under Normative Constraints**

  While Lewis's counterfactual approach captures an undeniable logical truth, its embrace of radical profligacy renders it metaphysically untenable and practically useless. It conflates mere counterfactual dependence with robust causation. Dowe's physicalist purity, while elegant, proves too restrictive. It dismisses the undeniable causal *explanatory power* of omissions in contexts like engineering, medicine, or law, where the *failure* of a safety mechanism or a *breach* of duty is intuitively causal. The physical process requirement seems arbitrarily biased towards "positive" events, ignoring how systems depend on the *presence* of maintaining or corrective actions.

  Therefore, **McGrath's norm-relative view offers the most principled and defensible account**. Omissions *can* be genuine causes, but *only relative to a contextually specified normative or expectational baseline**. This is not a "cop-out," but a recognition of how causation functions in complex, goal-directed, and norm-governed domains like human technology and social organization.

  *   **Why Principled?**
      1.  **Grounding in Practice:** It aligns with how we actually identify causes. In your postmortem, the inquiry wasn't "What are all possible counterfactual dependencies?" but "What went wrong *given our established procedures and responsibilities*?" The SLA *defined* the relevant normative baseline.
      2.  **Solving Profligacy:** It provides a non-arbitrary criterion (violation of norm/expectation) to distinguish the on-call's omission as causal from the director's identical counterfactual omission as non-causal *in this specific context*. The norm does the essential filtering work that bare counterfactual dependence cannot.
      3.  **Accommodating Physicalism (Partially):** It doesn't require abandoning physical processes. The *effect* (prolonged outage) is still caused by the *ongoing physical processes* initiated by the bad deploy. The omission *explains* why those harmful processes *persisted* rather than being halted, relative to the norm that they *should* have been halted by a specific agent. The omission is a cause of the *persistence* or *duration* of the effect, given the normative expectation of intervention.
      4.  **Explaining Asymmetry:** It directly explains why identical inactions are treated differently – the norms attached to the roles differ.

  **Objections and Defense:**

  *   **Objection (Lewisian):** "You're confusing causation with responsibility! The metaphysics shouldn't care about norms." *Reply:* Causation *in human explanatory contexts* is inherently intertwined with agency, design, and expectation. The norm-relative view captures this complexity without denying underlying physics. It explains *why* we pick out certain absences as causal.
  *   **Objection (Dowean):** "Norms are subjective/social; causation is objective." *Reply:* The *effect* (system failure) is objective. The identification of *which absence caused its persistence* depends on the *objective fact* of the system's design and the assigned responsibilities (the SLA). The norm (SLA) is an objective feature of the socio-technical system under analysis.
  *   **Objection:** "This makes causation relative/context-dependent. Isn't that messy?" *Reply:* Causation *is* often context-dependent. Asking "What caused the outage?" in engineering differs from asking in fundamental physics. The norm-relative view honestly reflects the context-laden nature of causal inquiry in domains involving human agency and designed systems.

  **Implication for Postmortems and "Root Cause":**

  Your intuition is correct. Calling any single factor the "root cause" is always a simplification, often laden with normative assumptions. The norm-relative view of omissions reinforces this:

  1.  **Multiple Contributing Factors:** The outage was likely caused by a *chain*: the bad deploy (positive event) *plus* the failure of the safety mechanism (rollback omission) relative to the SLA norm. The "root cause" label often focuses on the most salient *failure point* relative to norms or procedures.
  2.  **"Root Cause" as Normative Focus:** Labeling "the on-call engineer's failure" as the root cause primarily signifies it was the *key normative breach* that allowed the initial fault to persist beyond the expected recovery window. It highlights the point where the *expected control mechanism* failed.
  3.  **Suspicion Warranted?** Yes, absolutely. Your analysis shows that "root cause" pronouncements often mask complex causal webs and smuggled-in normative judgments. We should be more precise: "The primary factor assigned responsibility for the failure to mitigate within SLA was the on-call engineer's omission, following the established procedure. Contributing factors included the bug in deployment X and the lack of automated rollback triggers for failure mode Y." This acknowledges the causal complexity and the normative underpinning of the blame assignment without pretending the omission exists in a metaphysical vacuum.

  **Conclusion:**

  The sentence "the missing rollback caused the outage" is not *merely* loose talk or pure blame assignment. It expresses a genuine causal claim, but one that is **ineluctably relative to a normative baseline**—in this case, the expectation defined by the SLA that the on-call engineer *would* act. While Lewis forces us to confront the counterfactual truth that countless others *could* have acted, and Dowe reminds us that absences lack physical "push," McGrath's framework provides the necessary structure: omissions are causes only when they represent a departure from what was *supposed* to happen, making sense of our causal intuitions while avoiding metaphysical absurdity. Your postmortem identified the *normatively significant* omission. Recognizing this normative dependence doesn't weaken the analysis; it strengthens it by revealing the true structure of our causal explanations in the human world. It should also make us more humble and precise when declaring single "root causes," acknowledging the interplay of active faults, missing safeguards, and the expectations that bind them together.
