answer: |-
  Here's a reconstruction of Moore's argument from the passages you cited, followed by an analysis of its vulnerability to the synthetic naturalist objection:

  **Moore's Open-Question Argument (Reconstructed):**

  1.  **Premise (Indefinability of Simple Concepts):** Some concepts are simple and indefinable (like "yellow"). You cannot analyze them into component parts or define them using other concepts without circularity or losing their essential meaning. (From: *"good is a simple notion... you cannot explain what good is"*).
  2.  **Premise (Simplicity of Goodness):** "Good" is such a simple, indefinable concept. (From: *"good is a simple notion"*).
  3.  **Premise (The Open-Question Test):** For any proposed definition of "good" in terms of a natural property N (e.g., "pleasant," "desired," "evolutionarily fit"), it always remains a coherent, non-trivial, and meaningful question to ask: "But is N *really* good?" or "Is this pleasant thing *good*?" (From: *"it always remains a meaningful, non-trivial question whether a thing with that property is in fact good"*).
  4.  **Premise (Meaningfulness Implies Non-Identity):** If it is always a coherent and non-trivial question whether things possessing property N are good, then "good" cannot *mean* the same thing as N. If "good" *meant* N, the question "Is N good?" would be equivalent to "Is N N?" – which is trivial, tautological, and closed. (Implied by the meaningfulness of the open question).
  5.  **Premise (Target of Argument):** Naturalistic ethical theories attempt to *define* "good" (i.e., give its meaning/connotation) in terms of some natural property N.
  6.  **Conclusion (Non-Naturalism):** Therefore, "good" cannot be defined in terms of any natural property N. Goodness is not identical to any natural property; it is a simple, non-natural property. (From 2, 3, 4, 5).

  **The Synthetic Naturalist Objection & Moore's Vulnerability:**

  You are absolutely correct. **Moore's argument, as explicitly reconstructed from the passage above, primarily threatens *analytic* or *definitional* naturalism, not *synthetic a posteriori* naturalism.** Your water/H2O analogy perfectly captures the objection:

  1.  **The Analogy:** Pre-scientific competent speakers could coherently ask "Is this water H2O?" or "Is the liquid in this lake H2O?". This question was meaningful and non-trivial. Yet, we now accept that water *is* H2O as a matter of synthetic, a posteriori identity. The openness of the question *before* the discovery does *not* preclude an identity relation *after* the discovery. The question "Is water H2O?" is now closed *because we discovered the identity*, not because it was analytically true all along.
  2.  **Application to Ethics:** A synthetic naturalist (like the later Cornell Realists - Boyd, Brink, Sturgeon) argues that "good" *rigidly designates* a complex natural property (e.g., promoting human flourishing under ideal conditions, maximizing coherently informed desires). They claim this identity is discovered *a posteriori* through empirical and theoretical investigation into ethics, similar to how science discovered water is H2O.
  3.  **Why Moore's Argument Falters:**
      *   **Against Premise 5:** The synthetic naturalist *rejects* Premise 5. They are *not* claiming to offer a *definition* or *analysis* of the *meaning* of "good." They are claiming that the *property referred to* by "good" is identical to a complex natural property, even though speakers don't *know* this meaning analytically. The open question only shows that speakers don't *know* the identity *a priori* or hold it as part of the word's meaning – it doesn't show the identity is *false*.
      *   **Against Premise 4:** The synthetic naturalist argues that the meaningfulness of "Is N good?" only implies that "good" and "N" are not *synonymous* (not analytically identical). It does *not* imply that the properties they designate are distinct. "Is water H2O?" was meaningful because "water" and "H2O" were not synonymous; the identity was synthetic.
      *   **Against Premise 2 (Indirectly):** The synthetic naturalist challenges Moore's core assumption that "good" *must* be simple. Why couldn't it be a complex natural property, whose essence we discover empirically, just like water or temperature? Moore asserts its simplicity but doesn't definitively *prove* it against this alternative model.

  **Can Moore's Argument Be Repaired Using Only the Passage? (Spoiler: No)**

  *   **The core weakness is Premise 5.** Moore frames his target *exclusively* as definitions (meaning analyses). He writes: "**define** good in terms of some natural property," "you cannot **explain** what good is," contrasting with explaining yellow. His open-question test is explicitly presented as a test for whether a proposed definition captures the *meaning* ("My point is that 'good' is a simple notion... you cannot explain what good is").
  *   **The passage lacks resources to counter the synthetic model:** There is no argument in the quoted passage specifically addressing the possibility that "good" rigidly designates a complex natural property whose identity is discovered *a posteriori*. Moore doesn't engage with the distinction between sense and reference, analytic vs. synthetic identity, or rigid designation – concepts central to the Kripke/Putnam model you invoke. He simply assumes that if the question is open, it *must* mean the proposed identity is false *because* it's trying to be a definition.

  **The Gap Exploited by Cornell Realists & Others:**

  **Yes, this is precisely the gap exploited by later naturalists, especially the Cornell Realists.**

  1.  **Rejection of Analytic Naturalism:** They agreed with Moore that *analytic* naturalism (defining "good" in terms of natural properties) fails the open-question test. "Good" isn't analytically equivalent to "pleasant," "desired," etc.
  2.  **Embrace of Synthetic Naturalism:** They argued Moore's argument doesn't touch *synthetic a posteriori* identity claims. Moral terms like "good" and "right" *refer* to natural properties (e.g., functional properties related to human flourishing, social cooperation, or stable desires), but this reference is fixed by complex causal or functional roles, not by an analytic definition.
  3.  **The Open Question Explained:** The open question persists because competent speakers grasp the *concept* of goodness (its role in moral reasoning, its normative force) without knowing the underlying *natural essence* that realizes this role. Asking "Is the pleasant good?" is like asking "Is the stuff in lakes H2O?" before chemical theory – it's meaningful because we don't know the underlying identity, not because no identity exists.
  4.  **A Posteriori Discovery:** They argued that empirical investigation (psychology, sociology, anthropology, evolutionary theory) could reveal the complex natural properties that constitute moral properties, just as science reveals the nature of water or heat. Moral epistemology becomes partly empirical.

  **In Conclusion:**

  Moore's open-question argument, as presented in *Principia Ethica* Chapter 1, is a powerful critique of *definitional* or *analytic* naturalism. It successfully shows that "good" cannot be *defined* in terms of natural properties without losing its essential normative character. **However, it does not, on its own, threaten *synthetic a posteriori* naturalism**, which posits an identity of reference without identity of meaning. The persistent openness of the question "Is N good?" shows only that the identity is not analytic or known *a priori*, not that it is false. This limitation is indeed the crucial gap exploited by later naturalists like the Cornell Realists, who developed sophisticated theories of moral reference and synthetic identity to defend ethical naturalism against Moore's challenge. Yudkowsky's view, as you describe it, aligns more with this synthetic naturalist/rigid designation approach than with Moore's non-naturalism.
