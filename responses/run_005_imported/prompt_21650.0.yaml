  Here's a brand new, everyday example of the "Death in Damascus" decision-theory loop, set in a mundane context with no supernatural elements—just a student trying to choose a study spot. The core structure forces evidential decision theory (EDT) into endless flip-flopping due to a self-undermining predictor signal, while causal decision theory (CDT) escapes the loop by ignoring correlational evidence.

  ### **The Library Study Dilemma**
  **Setup:**  
  Sam has two identical libraries to choose from for exam studying: **North Library** and **South Library**. Both offer the same resources, noise level, and comfort. The *only* factor affecting Sam's study quality is crowding—a less crowded library means more space and better focus.  

  A **university algorithm** (a predictive tool used for space planning) has already forecasted which library Sam will pick. This algorithm is highly accurate (say, 95% correct) because it uses historical data like Sam's past behavior, class schedule, and campus movement patterns. Crucially:  
  - If the algorithm predicted Sam would choose **North Library**, it assigned *extra study groups* to North (making it crowded) and left South underutilized.  
  - If it predicted **South Library**, it assigned extra groups to South (crowding it) and left North underutilized.  

  Sam doesn't know the prediction but *does* see a **public dashboard** showing real-time "recommended" library availability. This dashboard is designed to reduce crowding: it displays ⚠️**"High Capacity"** for the library the algorithm predicted Sam would choose (indicating it will be crowded) and ✅**"Low Capacity"** for the other (indicating it will be empty).  

  Sam’s payoff:  
  - Studying in a **crowded library** = **0 points** (distracting, stressful).  
  - Studying in an **empty library** = **10 points** (productive, calm).  

  ---

  ### **Why Evidential Decision Theory (EDT) Loops Forever**  
  EDT evaluates choices based on *evidence* (i.e., conditional probabilities). Sam uses the dashboard as evidence about the algorithm's prediction—and thus the crowding. This creates a loop:  

  1. **Sam considers North Library:**  
     - *EDT reasoning:* "If I choose North, that’s strong *evidence* the algorithm predicted I’d choose North (since it’s 95% accurate). If it predicted North, the dashboard shows ⚠️'High Capacity' for North (making it crowded) and ✅'Low Capacity' for South (empty). So South must be better. I’ll switch to South!"  

  2. **Sam now considers South Library:**  
     - *EDT reasoning:* "If I choose South, that’s strong *evidence* the algorithm predicted South. If it predicted South, the dashboard shows ⚠️'High Capacity' for South (crowded) and ✅'Low Capacity' for North (empty). So North must be better. I’ll switch back to North!"  

  Each act of "committing" to a library becomes evidence that the algorithm predicted that choice, making the dashboard signal *imply* the *other* library is better. No choice is **ratifiable**—once Sam commits, the evidence flips to support switching. EDT traps Sam in an endless cycle of second-guessing.  

  ---

  ### **Why Causal Decision Theory (CDT) Doesn’t Loop**  
  CDT evaluates choices based on *causal impact* (i.e., "Does my action *change* the outcome?"). Sam recognizes:  
  - The algorithm’s prediction and dashboard signals are **already fixed** before he decides.  
  - His choice **cannot causally affect** past predictions or the dashboard.  
  - Crowding is determined *solely* by the algorithm’s prediction, not his actual choice.  

  *CDT reasoning:*  
  > "The dashboard shows ⚠️'High Capacity' at North and ✅'Low Capacity' at South. This *suggests* the algorithm predicted I’d choose North (making North crowded and South empty). But since the prediction is fixed, choosing South *doesn’t cause* South to become empty—it was *already* empty because the algorithm predicted North! Similarly, if I choose North, I’m stuck with crowding. I’ll pick South to get the empty library, regardless of what the dashboard 'implies' about my choice."  

  CDT ignores the self-referential evidence—Sam’s choice doesn’t retroactively alter the algorithm’s output, so he picks the library *currently indicated* as empty. No loop.  

  ---

  ### Key Features  
  - **Predictor:** The algorithm (non-omniscient but highly accurate) uses correlational data.  
  - **Signal:** The dashboard reflects the prediction *indirectly* (⚠️/✅ labels).  
  - **Payoff symmetry:** Both libraries are identical except for crowding.  
  - **Non-ratifiability under EDT:** Committing to either library makes the dashboard "prove" the other is better.  
  - **Everyday flavor:** No fate/death—just a student optimizing study conditions using flawed university tech.  

  This preserves the EDT loop from "Death in Damascus" while replacing prophecy with predictive algorithms and dashboard interfaces. The loop arises from EDT treating your *own choice* as diagnostic evidence about the world, even when it can’t change it. CDT cuts the loop by focusing on causation.
