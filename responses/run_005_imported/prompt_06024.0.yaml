answer: |-
  ## Dialogue: The Righteousness Tax

  **Setting:** A sun-drenched corner of a university library. Coffee cups rest beside open philosophy texts. Dr. Aris Thorne (defending the importance of "standing") leans forward intently. Professor Mara Vance (the skeptic) gestures with measured frustration.

  **Aris Thorne (Standing Defender):** Mara, consider the core *act* of blaming. It’s not merely stating a fact – "X is wrong." It’s a *performative* act. It demands recognition, repentance, adjustment. When I blame you, I implicitly position myself as someone entitled to make that demand, someone whose moral perspective you *ought* to take seriously in *this specific context*. Hypocrisy, especially relevant hypocrisy, fundamentally undermines that entitlement. It’s not *tu quoque*; it’s about the *conditions of possibility* for the blame to function as intended.

  **Mara Vance (Skeptic):** Aris, I hear the performative angle. But isn't the danger here making blame contingent on the *blamer's* virtue rather than the *act's* wrongness? Let me grant your premise: blame is a demand. Why should the *identity* of the demander invalidate the *validity* of the demand itself? If I steal your wallet, does it suddenly become *permissible* because *you* once shoplifted? The wrongness of theft doesn't vanish based on who points it out. Your view seems to let the offender off the hook by shifting focus to the accuser.

  **Thorne:** Not off the *moral* hook, Mara. The thief is still wrong! But *your* act of blaming *me* for theft, while you actively engage in it, isn’t a genuine moral appeal. It’s corrupted. You lack the *standing* to levy that particular demand *against me* precisely because your own identical actions demonstrate you don’t genuinely endorse the norm you’re invoking *in practice*. Your blame becomes a weapon, not a communication. It poisons the well. How can you demand I respect a norm you visibly flout? The inconsistency robs your words of moral force *in this relationship*.

  **Vance:** Okay, let's press that relationship angle. Suppose we have a deeply corrupt institution – say, a council where *every* member takes bribes. One member, Silas, takes a slightly *bigger* bribe than usual on a specific vote. Another member, Elara, who took her *own* standard bribe, calls him out. By your "standing" view, Elara lacks the standing to blame Silas because she's guilty of the same *type* of wrong. But that means *no one* in the council can legitimately call out *any* corruption, because everyone is tainted! Does Silas get a free pass? Does systemic corruption become immune to internal criticism? That seems morally disastrous.

  **Thorne:** (Sighs) That *is* the hardest case. And you’re right – Silas isn't absolved. His act is wrong. But Elara’s *blame* is illegitimate *as a performative act of moral condemnation*. It rings hollow. It might even be strategic, aimed at eliminating a rival, not upholding integrity. The solution isn’t that Silas escapes censure, but that the censure *cannot legitimately come from Elara* in that corrupted context. Perhaps only an external party, or someone demonstrably clean, has standing. Or perhaps the focus shifts to systemic reform, not individual blame *within* that rotten structure. The lack of standing highlights the *depth* of the corruption, it doesn't excuse the individual act.

  **Vance:** But Aris, that feels like moral paralysis in the real world! Where do we find these perfectly clean accusers? And what about the *intuition* behind "who are you to talk?" It’s powerful because it points to *credibility* and *fairness*. If you demand I adhere to a standard you flout, your demand feels *unfair*. It imposes a burden you refuse to shoulder. It’s not just about the message being true; it’s about the *unearned authority* of the messenger. Isn't "standing" just capturing that deep-seated sense of unfairness in wielding moral power you haven't earned through your own conduct?

  **Thorne:** Exactly! You've hit the nail on the head. It *is* about fairness and credibility in the moral exchange. The hypocrite seeks a kind of unearned moral high ground. They demand submission to a rule they exempt themselves from, exploiting the moral force of the norm without submitting to its discipline. That *is* unfair. It violates a fundamental reciprocity implicit in the practice of moral community. Why should *I* accept *your* moral authority over me on this point when you disregard it yourself? Your authority is self-undermined.

  **Vance:** Yet, doesn't that risk making morality purely relational and contingent? If standing depends on reciprocal adherence within a specific dyad or group, what happens to universal wrongs? If a serial liar calls out *my* single lie, does their hypocrisy negate the wrongness of *my* lie *or* just their standing to call *me* out? And practically, if we silence every hypocritical critic, we lose valuable correctives. The thief *might* still be the only one who sees *you* stealing. Shouldn't truth sometimes trump the messenger's tainted hands?

  **Thorne:** Truth isn't the currency of blame, Mara. *Accuracy* is necessary but not sufficient. The thief *can* state the fact: "You stole." But *blaming* – "You *ought not* to have stolen; you must make amends!" – that’s different. The hypocritical thief lacks the standing to make *that* demand *effectively* or *legitimately*. The *wrongness* of the act remains. The *fact* remains. But the *moral force* of the hypocrite's *condemnation* is nullified. Perhaps someone else *can* blame effectively. Or perhaps the hypocrite's statement serves as *evidence* others can use. But *their* performative act of blame is defective. It’s not about silencing truth; it’s about recognizing that moral communication has conditions.

  **Vance:** So we’re left with a world where valid criticism can be morally disarmed by the critic's flaws, and deeply corrupt systems might lack internal voices with standing to initiate repair. That feels... unsettling. Necessary perhaps, but heavy with the potential for injustice when the only 'clean' hands are nonexistent or silent. The truth might be spoken, but by a voice stripped of its power to morally compel.

  **Thorne:** (Nodding slowly) Unsettling, yes. Perhaps it reveals how fragile genuine moral community is, how easily poisoned by our own inconsistencies. The burden of maintaining standing is the price of having a voice that truly commands moral attention. It *is* heavy. But evading it, letting hypocrisy wield moral force unchallenged... that feels like a deeper corruption of the practice itself. The silence in that corrupt council is the sound of standing evaporating. The tragedy is real.

  **(They both sip their coffee, the weight of the unresolved tension hanging in the air between them.)**
