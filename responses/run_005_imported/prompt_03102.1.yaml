  Ok so my friend and I had this whole argument last night that I can't stop thinking about. She drove home from a party at 2am and said she felt totally alert the whole way so there was nothing to worry about. I said that's kind of exactly the problem - if you were just barely tired enough to actually be a danger, would you even be able to tell? And honestly, even on nights when I feel sure I'm fine to drive, I'm not sure I should trust that feeling of being sure either, if that makes sense. She says thats a dumb standard because by that logic you could never trust anything you feel about yourself, ever, which is obviously false, so my worry must just be confused. I didn't have a good comeback tbh. Is she right that this collapses into total self-doubt, or is there a more precise version of what's bugging me that actually survives her objection?
