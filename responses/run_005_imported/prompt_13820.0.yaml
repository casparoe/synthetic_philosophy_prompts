  Now, analyzing each move:
  1. Owen's first point is technically sound in classical logic but ignores Nāgārjuna's target (svabhāva ≠ existence simpliciter). Mira correctly spots this. 
  2. Mira's presupposition analogy is apt for loaded cases but stretched for mundane ones. Owen rightly questions its universality.
  3. Mira's appeal to the text's structure is strong—Nāgārjuna *does* dismantle svabhāva in ordinary phenomena systematically. Owen's demand for "independent argument" slightly misses that the text *is* the argument.
  4. Owen's regress objection is potent and hits a genuine tension in Madhyamaka. Mira's lack of response here is a gap.

  What both might miss:
