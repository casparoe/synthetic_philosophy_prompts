d increase others by a little than have one state increase a lot and another decrease a lot. In the fixed-marginal update, we have one state (Red HQ) increasing a lot (to 0.375) and another (Red Second Company) decreasing a lot (to 0.125). In the infomin update, we have a moderate increase in the Blue states (to about 0.266) and a moderate increase in Red HQ (to 0.3506) and a moderate decrease in Red Second Company (to 0.1169). The large increase in Red HQ in the fixed-marginal update is heavily penalized, and that penalty is avoided by reducing the marginal of Red and spreading the change more evenly. Hence, the infomin update is less disruptive overall."

