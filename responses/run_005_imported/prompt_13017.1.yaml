  We are in a war-games scenario with four quadrants: Red HQ, Red Second Company, Blue HQ, Blue Second Company. Initially, each has probability 1/4.

  The radio message: "can't tell if you've wandered into Red territory, but if you have, it's 3-to-1 you're in their HQ area."

  This gives us:
  - Conditional on being in Red territory, P(Red HQ | Red) = 3/4 and P(Red Second Company | Red) = 1/4.
  - The message says nothing about Blue territory. We assume that without evidence, we don't change the relative probabilities within Blue? But note: the constraint only directly affects the Red partition.

  Jeffrey's rule is for when we get direct evidence that shifts our probabilities on a partition. But here, the evidence is conditional: it only tells us about the internal division of Red, not about whether we are in Red or Blue.

  The proposed update method is to minimize the cross-entropy (or Kullback-Leibler divergence) from the prior, subject to the constraint that the conditional probability given Red is 3/4 for Red HQ and 1/4 for Red Second Company.

  Let:
  - R = Red territory (which includes Red HQ and Red Second Company)
  - B = Blue territory
  - RH = Red HQ
  - RS = Red Second Company
  - Similarly, BH and BS for Blue.

  Prior: P(RH) = P(RS) = P(BH) = P(BS) = 1/4.

  Constraint: P(RH | R) = 3/4, which implies P(RS | R) = 1/4.

  We want to update the entire probability distribution to a new distribution Q that satisfies:
  - Q(RH) / [Q(RH)+Q(RS)] = 3/4   =>   Q(RH) = (3/4) * Q(R)
  - Similarly, Q(RS) = (1/4) * Q(R)

  But note: Q(R) = Q(RH) + Q(RS) = (3/4)Q(R) + (1/4)Q(R) = Q(R) [tautology].

  We also have no constraint on Blue. The idea of cross-entropy minimization (infomin) is to choose Q that is as close as possible (in the KL-divergence sense) to the prior P, subject to the constraint.

  The KL-divergence from Q to P is: 
    D_KL(Q || P) = sum_{x} Q(x) log(Q(x)/P(x))

  We minimize this subject to the constraint on the conditional probabilities for Red.

  We have four states: RH, RS, BH, BS.

  Prior P: 
    P(RH)=1/4, P(RS)=1/4, P(BH)=1/4, P(BS)=1/4.

  We set:
    Q(RH) = (3/4) * Q(R)
    Q(RS) = (1/4) * Q(R)

  But note that Q(R) = Q(RH) + Q(RS) = Q(R) [so that's fixed by the constraint once we set Q(R)].

  Also, we have Q(B) = 1 - Q(R). And within Blue, we have no constraints. So we have freedom in how we split Q(B) between BH and BS.

  The KL-divergence is:
    D_KL = Q(RH) * log(Q(RH)/P(RH)) + Q(RS) * log(Q(RS)/P(RS)) 
          + Q(BH) * log(Q(BH)/P(BH)) + Q(BS) * log(Q(BS)/P(BS))

  We can write Q(RH) = (3/4)*r, Q(RS) = (1/4)*r, where r = Q(R). Then Q(B) = 1-r, and we let Q(BH) = s, Q(BS) = 1-r-s.

  Now, note that the prior P is uniform. So P(RH)=1/4, etc.

  Therefore, the KL-divergence becomes:
    D_KL = [ (3/4)r * log( ( (3/4)r ) / (1/4) ) ] + [ (1/4)r * log( ( (1/4)r ) / (1/4) ) ]
          + [ s * log( s / (1/4) ) ] + [ (1-r-s) * log( (1-r-s) / (1/4) ) ]

  Simplify the log terms:
    For RH: log( (3r/4) * 4 ) = log(3r)
    For RS: log( (r/4) * 4 ) = log(r)
    For BH: log(4s)
    For BS: log(4(1-r-s))

  So:
    D_KL = (3/4)r * log(3r) + (1/4)r * log(r) + s * log(4s) + (1-r-s) * log(4(1-r-s))

  But note: we can also split the log terms:

    = (3/4)r [ log(3) + log(r) ] + (1/4)r [ log(r) ] + s [ log(4) + log(s) ] + (1-r-s) [ log(4) + log(1-r-s) ]

    = (3/4)r log(3) + (3/4)r log(r) + (1/4)r log(r) + s log(4) + s log(s) + (1-r-s) log(4) + (1-r-s) log(1-r-s)

    = (3/4)r log(3) + r log(r) + (1-r) log(4) + s log(s) + (1-r-s) log(1-r-s)

  Now, we minimize this over r and s (with 0<=r<=1, 0<=s<=1-r).

  Note that the terms involving s are:
     s log(s) + (1-r-s) log(1-r-s)

  and also note that (1-r) log(4) is independent of s.

  We can minimize the function f(s) = s log(s) + (1-r-s) log(1-r-s) for fixed r.

  This function is convex in s. Taking derivative w.r.t. s:

     df/ds = log(s) + 1 - [log(1-r-s) + 1] = log(s) - log(1-r-s)

  Set to zero: log(s) = log(1-r-s)  => s = 1-r-s => 2s = 1-r => s = (1-r)/2.

  Thus, the optimal s is (1-r)/2, meaning that without constraints on Blue, we split the Blue territory equally between BH and BS.

  Now, we are left to minimize over r:

    D_KL(r) = (3/4)r log(3) + r log(r) + (1-r) log(4) + f(s*)

  where f(s*) = s* log(s*) + (1-r-s*) log(1-r-s*) with s* = (1-r)/2.

  Plug in s*:

     s* = (1-r)/2
     1-r-s* = (1-r)/2

  So f(s*) = 2 * [ (1-r)/2 * log((1-r)/2) ] = (1-r) [ log( (1-r)/2 ) ]

  Therefore:

    D_KL(r) = (3/4)r log(3) + r log(r) + (1-r) log(4) + (1-r) [ log( (1-r)/2 ) ]

  Simplify:

    = (3/4)r log(3) + r log(r) + (1-r) [ log(4) + log( (1-r)/2 ) ]
    = (3/4)r log(3) + r log(r) + (1-r) [ log(4) + log(1-r) - log(2) ]
    = (3/4)r log(3) + r log(r) + (1-r) [ log(2) + log(1-r) ]   [because log(4)-log(2)=log(2)]

    = (3/4)r log(3) + r log(r) + (1-r) log(2) + (1-r) log(1-r)

  Now, we take the derivative of D_KL(r) w.r.t. r:

    dD/dr = (3/4) log(3) + [ log(r) + r*(1/r) ] + [ -log(2) ] + [ -log(1-r) - (1-r)*(1/(1-r))*(-1) ] 
          = (3/4) log(3) + log(r) + 1 - log(2) - log(1-r) - 1
          = (3/4) log(3) + log(r) - log(2) - log(1-r)
          = (3/4) log(3) + log( r / (2(1-r)) )

  Set to zero:

     log( r / (2(1-r)) ) = - (3/4) log(3)

  Exponentiate:

     r / (2(1-r)) = 3^(-3/4)

  Let k = 3^(-3/4). Then:

     r = 2k (1-r)
     r = 2k - 2k r
     r (1 + 2k) = 2k
     r = 2k / (1+2k)

  Now, k = 3^(-3/4) = 1 / (3^(3/4)) ≈ 1 / (3^0.75) ≈ 1 / (2.2795) ≈ 0.4387

  Then r = 2*0.4387 / (1+2*0.4387) = 0.8774 / (1+0.8774) ≈ 0.8774 / 1.8774 ≈ 0.4675

  So Q(R) ≈ 0.4675, and then Q(B) = 1 - r ≈ 0.5325.

  Thus, the probability of Blue territory increases from 0.5 to about 0.5325.

  Now, the dialogue:

  Two philosophers: Let's call them Alex (defender of the infomin update) and Bailey (skeptic).

  Setting: Crouched over Judy's map, right after the radio cuts out.

  Alex: "Alright, so we've got the message. It tells us that if we're in Red, then it's 3:1 for being in HQ. But that doesn't tell us anything about whether we're in Red or Blue, right? However, when we update our probabilities to respect that constraint, we have to do it in the way that minimally disturbs our prior beliefs. And that leads to a slight increase in the probability of being in Blue."

  Bailey: "Wait, that can't be right. How on earth does learning about the internal structure of Red territory make us more confident that we're in Blue? That's absurd. The message didn't say anything about Blue. It didn't even give us any information that distinguishes Red from Blue. So why should our probability for Blue change at all?"

  Alex: "But Bailey, consider: the constraint only directly affects the Red part. We have to set the conditional probabilities within Red to 3:1. But we don't have any constraint on Blue. So the update has to choose a new distribution that satisfies the constraint and is otherwise as close as possible to the prior. And the prior was symmetric. However, the constraint breaks the symmetry between Red and Blue because it forces the Red side to become more concentrated in HQ. The Blue side remains symmetric, but the update method chooses to keep Blue symmetric because that's the least disruptive way. But note: the prior had Red and Blue each at 0.5. Now, we are forced to change the distribution within Red. The least disruptive way is to adjust the overall probability of Red downward a bit and then split Blue equally. Why? Because if we kept Red at 0.5, then we would have to set Red HQ to 0.5 * 0.75 = 0.375 and Red Second Company to 0.125. But that would leave Blue at 0.5, split equally as 0.25 and 0.25. But that distribution is more disruptive than the one we found? How? Because we are minimizing the KL-divergence. And the KL-divergence penalizes moving probability mass from a state with low prior probability to one with high? Actually, no. The KL-divergence is minimized when the new distribution is as 'similar' as possible to the prior in the information-theoretic sense. In this case, the prior was uniform. The constraint forces Red to be non-uniform. To stay close to uniform, we reduce the total probability of the non-uniform part (Red) and keep the unconstrained part (Blue) uniform. That way, the overall distribution is as uniform as possible given the constraint."

