  Part (c): Explain how Augustine's dispute with Jerome over Galatians 2:11-14 illustrates what is at stake.

  The student says:
  - Jerome proposed that Paul's rebuke of Peter was staged (a fiction for pedagogical purposes).
  - Augustine sided with this reading? Actually, the student says: "Augustine sided with this reading, arguing that such a well-intentioned fiction was no different in kind from the officious lies he elsewhere treats as merely venial."

  But this is incorrect. In fact, Augustine opposed Jerome's interpretation precisely because it would make Paul and Peter engage in a lie (a staged rebuke). Augustine, in his letter to Jerome (Letter 40 and then more fully in Letter 82), argues that if the rebuke was staged, then it would be a lie. And since lying is always sinful, Paul could not have done that. Therefore, Augustine insists that the rebuke must have been real.

  The student has it backwards: Augustine did not side with Jerome's reading; he vehemently opposed it. Jerome was the one who proposed the staged rebuke (to avoid the scandal of a real dispute between apostles). Augustine argued that such a staged event would be a lie and therefore unacceptable.

