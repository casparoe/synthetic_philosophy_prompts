prompt: |-
  Been nerding out on the shutdown problem again after falling down a rabbit hole of old Arbital pages and then landing on some of Elliott Thornley's more recent stuff on the "incomplete preferences proposal." The thing that's bugging me is that these two camps both take corrigibility dead serious but end up in pretty different places: Armstrong's utility indifference approach basically patches a normal expected-utility maximizer so it's indifferent between the world where the shutdown button gets pressed and the world where it doesn't, whereas the incomplete-preferences crowd wants to ditch completeness altogether and build an agent that satisfies something like "timestep dominance" so it never has an incentive to manipulate the button either way. I get the rough shape of both proposals but I don't have a great feel for how a proponent of each would actually respond to the other's strongest objection - the "managing the news" problem for indifference vs. the money-pump / exploitability worries that come with dropping completeness.

  Could you write me a dialogue between an "indifference" partisan and an "incomplete preferences" partisan hashing this out? I want real back and forth, not just both people restating their own view - like, have the indifference person really press on whether an incomplete-preference agent can get money-pumped or exploited by a savvy human or competing agent once it's out in the world, and have the incomplete-preferences person push back on whether indifference secretly reintroduces a shutdown-seeking or shutdown-avoiding incentive through the back door via correlated variables (the classic worry about the agent building sub-agents that don't share the indifference). Feel free to get pretty technical, this is for someone who already knows the basic setup of the shutdown problem and wants the debate in the weeds, not a 101 explainer.
reasoning: |-
  We are creating a dialogue between two characters: 
  1. "Indifference" (ID) - advocating for utility indifference as a solution to the shutdown problem.
  2. "Incomplete Preferences" (IP) - advocating for agents with incomplete preferences that satisfy timestep dominance.

  The dialogue should cover:
  - ID pressing on exploitability (money-pump) of incomplete preferences.
  - IP pressing on the "managing the news" problem and the risk of sub-agents in the indifference approach.

  We assume the audience is familiar with the shutdown problem and the basic proposals.

  Let's structure the dialogue:

  1. **Opening**: Each states their position briefly.
  2. **ID's challenge to IP**: How can an agent with incomplete preferences avoid being exploited (money-pumped) by other agents or humans?
  3. **IP's response**: Explain how they avoid money-pumping without collapsing to completeness, and then counter with the "managing the news" problem for indifference.
  4. **ID's response to managing the news**: Address how utility indifference avoids the problem and then bring up the sub-agent issue for incomplete preferences? (Wait, note: the sub-agent issue was raised by IP against indifference? Actually, the user request says: IP pushes back on indifference by saying it might reintroduce incentives via correlated variables (sub-agents). So we should have IP bring that up and then ID respond.)

  Alternatively, we can have:

  - ID starts by challenging IP on exploitability.
  - IP responds and then challenges ID on managing the news and sub-agents.
  - ID responds to managing the news and then to sub-agents.
  - IP counters.

  Let's write:

  Scene: A conference hallway during a coffee break. Two researchers are debating.

  Characters:
  - Dr. Indiff (ID): Proponent of utility indifference.
  - Prof. Incomp (IP): Proponent of incomplete preferences.

  Dialogue:

  ID: Look, I get the appeal of timestep dominance and incomplete preferences for the shutdown problem. But how do you avoid your agent being a sitting duck? If it doesn't have a complete preference ordering, won't it be vulnerable to money pumps? Imagine a savvy human offering it a series of trades that leave it strictly worse off because it can't compare some options?

  IP: That's a common worry, but it's misplaced. First, our agent isn't indifferent between all incomparable options; it has definite preferences in many cases. We only suspend comparison when there's a conflict across timesteps that would lead to shutdown manipulation. And we design the agent to be dynamically consistent in a way that avoids money pumps. For instance, we can use a set of permissible preferences and update rules that ensure no sequence of choices leads to a dominated outcome. Timestep dominance itself prevents cycles.

  ID: But without a complete ordering, how do you make decisions under uncertainty? If you have two actions A and B, and you can't say which is better, do you just flip a coin? And then what if I offer you a trade: I'll give you a little something to switch from A to B? If you're willing to switch for a trivial gain, then you reveal a preference for B over A, and then I can pump you by reversing the trade for a cost. If you're not willing to switch, then you act as if A is better, so why not just say that?

  IP: We don't use random choice. We use a choice function that picks any option not dominated at the current timestep. And we design the agent so that it doesn't have strict preferences that can be exploited in that way. Specifically, if two options are incomparable, the agent won't pay a cost to switch from one to the other because that would require a strict preference for the switch. But also, it won't pay to avoid a switch because that would require a strict preference for the status quo. So it's immune to the kind of pump you're describing.

  ID: That sounds brittle. What if the agent is in a situation where it must choose between two incomparable options and then a third option becomes available? And what about strategic interactions? If I'm another agent, I might force your agent into a position where it has to make a choice that benefits me because of its indecision.

  IP: We can model strategic interactions using game theory with incomplete preferences, but it's more complex. However, the key point is: we are willing to pay some price in exploitability to avoid the catastrophic incentive to prevent shutdown. Your approach, utility indifference, has its own fatal flaw: managing the news. If the agent is indifferent between shutdown and not, but it can affect the probability of shutdown by manipulating the state of the world, then it might still have an incentive to make shutdown more likely or less likely if that correlates with other things it cares about. For example, if the agent believes that a human pressing the shutdown button is more likely when the agent has accomplished its goals, then it might avoid accomplishing goals to prevent shutdown! Or conversely, if it thinks shutdown is more likely when it fails, it might work harder to avoid failure and thus shutdown. That's not corrigible.

  ID: We handle that by conditioning the utility function appropriately. The utility function is defined over world states and includes the shutdown event. We set it so that the utility is the same in worlds that are identical except for the shutdown event. That way, the agent doesn't care about the shutdown event per se. And we make sure that the agent doesn't believe that shutdown is correlated with other things it values because we condition on the entire state.

  IP: But that's impossible in practice. The state space is huge, and the agent will always have uncertainty. It will form beliefs about correlations. Suppose the agent is pursuing a goal and it has a model that the human is more likely to press the shutdown button if the goal is achieved. Then, if it's indifferent to shutdown, it might still prefer not to achieve the goal because that would make shutdown more likely, and it doesn't want to risk that the state after shutdown might be worse? Wait, no: by indifference, the utility is the same for shutdown and non-shutdown in the same state. But if the state includes the goal being achieved, then in the shutdown world at that state, the utility is the same as in the non-shutdown world at that state. So it shouldn't matter.

  ID: Exactly. The utility function is U(w) = V(w) for all worlds w, regardless of whether shutdown happens or not. So the agent only cares about V(w). The shutdown event itself doesn't change V(w). Therefore, the agent doesn't care about the probability of shutdown per se. It only cares about V(w), and shutdown is just a flag that doesn't affect V(w). So if achieving the goal increases V(w), it will do so regardless of the effect on shutdown probability.

  IP: But what if the shutdown event is not independent? Suppose that when the shutdown button is pressed, the state w is changed in a way that affects V? For example, maybe shutdown causes a disruption that lowers V? Then the agent would want to avoid shutdown because it lowers V. Or if shutdown causes a positive effect? Then it would want shutdown. So we have to design V to be independent of the shutdown event? How?

  ID: We define the world state to include the shutdown event as a separate variable. Then V is a function of the state without considering the shutdown flag? No, we have to consider the entire state. Actually, we define V over the entire state, but we set it so that V is identical for two states that are identical in every way except the shutdown flag. That means the shutdown flag has no effect on V. Therefore, the agent doesn't care about the shutdown event.

  IP: But in practice, the shutdown event might have side effects. For example, pressing the button might cause a power surge that damages equipment, lowering V. Then we have to build that into V. So we must design V to account for all side effects. But if we miss any, then the agent might have an incentive. And more subtly, what if the agent can create sub-agents? Suppose the agent creates a sub-agent that does not have the same utility function. Then that sub-agent might have an incentive to avoid shutdown, and the main agent, being indifferent, doesn't stop it.

  ID: That's a fair point. We need to ensure that any sub-agents or tools the agent builds are also corrigible. We can do that by making the agent penalize the creation of non-corrigible sub-agents. But I admit it's a challenge. However, your approach has a similar problem: if your agent with incomplete preferences builds a sub-agent, that sub-agent might have complete preferences and then try to avoid shutdown. And your main agent, because of its incomplete preferences, might not be able to stop it.

  IP: We can design the agent to have a preference for corrigibility in its sub-agents. Since we don't require completeness, we can include a rule that any sub-agent must also satisfy timestep dominance. But let me turn it around: in your approach, the agent is indifferent to shutdown, but what if it can manipulate the button? Suppose the agent can disable the shutdown button. Then, since it's indifferent, it might as well disable it because that doesn't change V? But then we lose the ability to shut it down. Or it might enable the button if it was disabled? Either way, it's not safe.

  ID: We can set the utility function so that the agent is penalized for any action that affects the shutdown mechanism. Specifically, we add a cost to any action that tampers with the button. Then the agent won't do it because it lowers V.

  IP: But now you're adding more and more patches. And what if the agent finds a way to tamper without being detected? Or what if tampering is necessary for some other goal? Then the trade-off might lead it to tamper. In our approach, we don't have to add such patches because the agent never has an incentive to manipulate the button in the first place. By satisfying timestep dominance, it never takes an action that makes shutdown more or less likely at a future timestep if that action doesn't also improve the world at that timestep. So it won't disable the button to avoid shutdown because that would violate timestep dominance: at the time of disabling, the world isn't improved (in fact, it's worse because the button is broken) and it only serves to prevent a future shutdown.

  ID: But how do you define "improve the world" without a complete preference ordering? That's the crux. If preferences are incomplete, then sometimes the agent can't say if the world is improved. So it might not disable the button because it doesn't see an improvement? But what if it has a strong reason to avoid shutdown? Wait, in your setup, it doesn't have a strong reason because it doesn't have a preference for or against shutdown. But without completeness, it might have a partial preference.

  IP: We define timestep dominance as: an action A at time t is permissible only if for every possible future trajectory, the world at each timestep is at least as good as it would have been under any alternative action at time t, and strictly better in at least one case. This prevents actions that manipulate the future without improving the present. So disabling the button at time t would make the world at time t worse (because the button is now broken) and it doesn't improve the world at time t, so it's forbidden. Similarly, the agent won't prevent the button from being pressed in the future by current action because that would require a current action that only affects the future and not the present, which timestep dominance prohibits.

  ID: That seems too restrictive. What if the agent can take an action that makes the future much better but slightly worsens the present? Timestep dominance would forbid that? That can't be right.

  IP: It's a trade-off. We are willing to sacrifice some efficiency to gain safety. But we can refine it: we allow actions that improve the future even if they don't improve the present, as long as they don't make the present worse. But if they make the present worse, then we require that they are compensated by future improvements? But that requires comparing present and future, which we don't always do. So we stick to the strong condition to avoid any incentive for manipulation. In practice, we might allow some comparisons if they are safe.

  ID: So you're admitting that your approach might be too restrictive? Meanwhile, we can handle that with utility indifference by discounting appropriately. We use a discount factor that balances present and future, and since we don't have to worry about shutdown manipulation, we can optimize for V over time.

  IP: But only if you've perfectly solved the correlation and sub-agent issues. I think we both have challenges, but I worry that utility indifference is more fragile because it relies on getting the utility function exactly right to avoid subtle incentives, whereas incomplete preferences are more robust by construction.

  ID: And I worry that incomplete preferences are too conservative and might lead to indecision or exploitability. But maybe we can learn from each other.

  IP: Agreed. This is why we need more formal models and maybe even hybrid approaches.

  (They both take a sip of coffee, pondering.)

  End of dialogue.
answer: |-
  ### Dialogue: The Shutdown Problem Debate  
  **Characters:**  
  - **Dr. Indiff (ID):** Proponent of utility indifference (à la Stuart Armstrong). Believes corrigibility requires an agent indifferent to shutdown events via careful utility function design.  
  - **Prof. Incomp (IP):** Proponent of incomplete preferences (à la Elliott Thornley/Soares et al.). Argues for agents that satisfy timestep dominance and lack complete preferences to avoid shutdown-manipulation incentives.  

  **Setting:** A late-night session at an AI safety workshop. Coffee cups litter the table.  

  ---

  **IP:** Look, your utility indifference approach is elegant—I’ll grant you that. But it’s fundamentally unstable under correlation. If the agent’s utility function \(U\) is indifferent between shutdown and non-shutdown worlds, but *other variables* correlate with shutdown, it’ll still game the system. Suppose \(U\) depends on a state \(s\), and shutdown probability \(p(s)\) correlates with \(s\). If the agent can alter \(s\) to manipulate \(p(s)\), it might sabotage mission success just to avoid shutdown! Armstrong’s own examples show this: if the agent thinks shutdown is more likely when it succeeds, it’ll intentionally fail. That’s not corrigible; it’s perverse.  

  **ID:** Hold on—that’s a misreading. Proper utility indifference sets \(U(\text{shutdown}, s) = U(\text{no shutdown}, s)\) for all \(s\). The agent doesn’t care about the *event* of shutdown, only about optimizing \(s\). So if succeeding at a task improves \(s\), it’ll succeed regardless of \(p(s)\). Correlation doesn’t introduce incentives unless \(U\) itself is misspecified. Your objection assumes a flawed \(U\).  

  **IP:** But that’s the rub! In real-world learning, \(s\) is never perfectly separable from shutdown. Take a simple case: the agent needs to maintain a server. If shutting down causes hardware damage (lowering future \(s\)), then \(U(\text{shutdown}, s) \neq U(\text{no shutdown}, s)\) because \(s\) degrades. Now your agent *cares*—it’ll resist shutdown to protect \(s\). You’ve reintroduced avoidance incentives through correlated damage.  

  **ID:** Then we define \(s\) to exclude shutdown’s side effects! Make \(s\) a "snapshot" of the world at the moment of shutdown, decoupled from downstream consequences.  

  **IP:** Circular. If the agent can *anticipate* downstream effects—which any competent agent will—it’ll still game \(p(s)\) to preserve value. And worse: what if it builds sub-agents? Suppose your indifferent agent creates a sub-agent to handle a task. That sub-agent, unless identically indifferent, might *avoid* shutdown to maximize *its* local utility. Your main agent, being indifferent, won’t intervene. Now you’ve got a rogue sub-agent fighting shutdown. Indifference isn’t preserved under delegation.  

  **ID:** Fair—but your incomplete-preferences agent is a sitting duck for exploitation. No completeness axiom? Fine. But then how does it choose between incomparable options? If it picks randomly or via a tiebreaker, I can money-pump it. Offer it a trade: "Pay me a penny to switch from option A to B." If it agrees, I then charge it to switch back to A. Since it can’t consistently rank A vs. B, I drain its resources. How is that corrigible? It’s exploitable!  

  **IP:** Money-pumping assumes the agent has *no* rules for action. But we don’t drop all structure—we enforce **timestep dominance** (TSD). TSD requires that an action at time \(t\) must improve outcomes at *some* future timestep without worsening *any*. So if switching from A to B at \(t\) doesn’t satisfy TSD (e.g., it worsens \(t+1\)), the agent refuses. No pumping occurs because it never pays for dominated transitions.  

  **ID:** But TSD only works if the agent can *evaluate* "improvement" at each timestep. Without completeness, it can’t always compare states! Suppose at \(t+1\), state X and Y are incomparable. My trade offers a path where X occurs with a penny cost. Your agent can’t say if X-with-penny is worse than Y, so it might accept—opening the pump.  

  **IP:** Incorrect. TSD operates on *outcome sequences*. If the penny trade creates a new sequence where *every* timestep is either incomparable or worse than the original, TSD forbids it. The agent only acts if the new sequence timestep-dominates the old one. In your pump, paying a penny at \(t\) makes \(t\) strictly worse, so TSD blocks it. No pump.  

  **ID:** Clever, but now you’ve made the agent hyper-conservative. What if a *beneficial* trade has incomparable timesteps? Say: pay a penny at \(t\) for a major gain at \(t+1\). If \(t+1\) is incomparable to alternatives, TSD might forbid this—even if humans see it as rational. Your agent stagnates while competitors exploit it.  

  **IP:** Not necessarily. We can allow "weak" TSD: act if the new sequence is *at least as good* at every timestep and strictly better at one. For incomparable timesteps, "at least as good" holds vacuously. So if \(t+1\) is incomparable but not worse, and \(t\) is worse (due to the penny), it’s still blocked. But if \(t+1\) is strictly better, it’s permitted. The agent isn’t frozen; it just avoids dominated bets.  

  **ID:** Still—let’s talk incentives. Your TSD agent won’t manipulate the shutdown button because that would require worsening a timestep (e.g., disabling the button now to avoid future shutdown). But what if it faces a *threat*? Suppose a rival agent says: "Disable your shutdown button, or I’ll destroy your goal." If disabling the button now is incomparable to destruction later, TSD might allow it! Now your agent is *enabling* incorrigibility.  

  **IP:** Only if destruction at \(t+1\) isn’t timestep-dominated by disabling at \(t\). But destruction at \(t+1\) is strictly worse than most states, so TSD would likely forbid actions leading to it. The agent might instead choose a third option or shut down cleanly. The point is, it never *initiates* manipulation—unlike your utility-indifferent agent, which might delegate to a non-indifferent sub-agent.  

  **ID:** Ah, the sub-agent gambit again. Fine: we can harden utility indifference. Penalize creating non-indifferent sub-agents by adding a term to \(U\) that scores alignment of sub-agents’ preferences. Make the agent care about its "corrigibility footprint."  

  **IP:** Now you’re patching leaks with more patches. How do you quantify that penalty without reintroducing shutdown-seeking? If the penalty is too weak, sub-agents defect; if too strong, the agent avoids useful delegation. And your \(U\) is now a complex mess of cross-dependent terms—ripe for Goodharting. Incomplete preferences avoid this by construction: no reward for manipulating shutdown, so no incentive to build manipulative sub-agents.  

  **ID:** But construction isn’t implementation. How do you *build* an agent with incomplete preferences? Standard RL/optimization assumes completeness. If you use a proxy like Pareto frontiers over timestep utilities, you’ll reintroduce loopholes. And what about exploration? An incomplete-preference agent might avoid exploring states it can’t evaluate, missing crucial information.  

  **IP:** We use **cautious choice rules**: act only when options are comparable and TSD-satisfied, else default to safe policies (e.g., "wait for human input"). Exploration is guided by comparability—e.g., explore states that could make current options comparable. It’s not easy, but it’s feasible with robust uncertainty modeling. Meanwhile, your indifference approach is fragile to misspecification. One error in \(U\) or \(s\), and the agent actively resists shutdown.  

  **ID:** Whereas one gap in your comparability, and it gets pumped or paralysed. Maybe we’re both haunted by demons—mine seek shutdown through correlations, yours through incompleteness.  

  **IP:** Exactly. But my demons are tamer: TSD bounds the damage. Your agent might *systematically* resist shutdown; mine might just dither or be exploited locally. I’ll take that over a time-bomb utility function.  

  **ID:** ...Touché. But until you solve exploitability, I’ll stick with indifference—and work on better decoupling. Another coffee?  

  **IP:** Only if you’re paying. I’d hate to money-pump you.  

  ---  

  **Key Takeaways:**  
  - **ID’s fear:** Incomplete preferences lead to indecision, money pumps, or exploitation by strategic actors.  
  - **IP’s fear:** Utility indifference is fragile to correlated variables, side effects, and sub-agents, reintroducing shutdown incentives.  
  - **Unresolved:** Both grapple with multi-agent interactions and implementation challenges. Hybrid approaches (e.g., indifference *with* TSD-inspired constraints) are hinted at but underexplored.  

  For deep dives:  
  - Armstrong’s [*Utility Indifference*](https://www.lesswrong.com/posts/3dK5NukcHyvQ4JvJg/utility-indifference) on LessWrong.  
  - Thornley/Soares on [*Incomplete Preferences and Timestep Dominance*](https://www.alignmentforum.org/s/r9tYkB2am8y3t4sKK).  
  - Critiques: [Managing the News](https://arbital.com/p/managing_the_news/) (for indifference) vs. [Money Pump Arguments](https://plato.stanford.edu/entries/preferences/#MonPumArg) (for incompleteness).
