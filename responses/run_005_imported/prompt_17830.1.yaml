  Here is the strongest argument that Hart's concessions fatally undermine his rejection of Devlin, collapsing his position into a qualified legal moralism despite his intentions:

  **The Core Contradiction:** Hart’s fundamental claim is that societal cohesion requires only a shared *critical morality* focused on preventing harm to others (the "minimum content of natural law"), explicitly rejecting Devlin's claim that enforcing a society's *positive morality* (its specific contingent moral beliefs) is necessary to prevent disintegration. However, Hart’s concessions for paternalism and public indecency rely on justifications *other than preventing harm to others*, importing elements of positive morality or non-harm-based rationales into the core function of the criminal law. This creates a fatal inconsistency:

  1.  **Paternalism Undermines the Harm Principle's Primacy:**
      *   Hart justifies prohibiting consensual serious harm (e.g., gladiatorial combat, extreme body modification) on paternalistic grounds: protecting individuals *from themselves* by preserving their "valuable capacities" for autonomy in the future.
      *   **The Problem:** This justification *explicitly rejects the harm-to-others principle*. The harm prevented is *self-inflicted* with consent. Hart argues this is necessary to protect the *conditions* for meaningful choice.
      *   **The Devlinian Leverage:** If preserving "valuable capacities" or protecting individuals from their own (informed, voluntary) choices is a legitimate state interest sufficient to override consent and justify criminalization, Hart has conceded that preventing harm *to others* is *not* the *only* fundamental basis for law necessary for social order. He has introduced a distinct, morally laden value ("valuable capacities," human flourishing) as a basis for coercion. This value, while perhaps part of a *critical* morality, is far thicker and more contestable than the bare minimum harm principle and relies on a substantive view of human good that Devlin could argue is part of a society's positive morality.

  2.  **Public Indecency Relies on Offense, Not Harm:**
      *   Hart allows restrictions on public indecency (e.g., nudity, certain sexual acts in public) not primarily to prevent tangible harm (like public health risks or direct assault), but to prevent *profound offense* or "outrage" to unwilling witnesses.
      *   **The Problem:** Defining "profound offense" as a type of *harm* sufficient to warrant legal coercion is highly contentious. It blurs the line Hart tries to draw. The "harm" here is purely psychological and stems *directly* from the violation of deeply held *positive moral beliefs* of the onlookers. The law, in this case, is effectively protecting individuals from having their *moral sensibilities* profoundly shocked.
      *   **The Devlinian Leverage:** Devlin argued precisely that the law should protect society from behavior that causes "intolerance, indignation, and disgust" among ordinary citizens because this outrage, if widespread and unaddressed, *is* the feeling that leads to social disintegration. Hart's concession here validates Devlin's core mechanism: the law *can* legitimately restrict behavior *because* it causes profound moral offense to the community, recognizing that such widespread offense *is* a threat to social cohesion. Hart tries to frame it as "harm," but its source and nature are indistinguishable from the protection of positive morality that Devlin advocated.

  **The Collapse into Qualified Legal Moralism:**

  1.  **No Principled Distinction:** Having conceded these two significant exceptions grounded in non-harm-to-others principles (paternalism protecting a substantive view of the good; preventing profound offense rooted in positive morality), Hart lacks a *principled* basis to reject Devlin's broader claim. Why is *this* specific positive moral belief (avoiding profound offense in public) protectable via law, but *other* deeply held positive moral beliefs (e.g., about marital fidelity, blasphemy, certain forms of "private" vice) are not? Hart offers no clear, consistent line. His reliance on "profound offense" effectively adopts a key element of Devlin's thesis – that sufficiently strong communal moral sentiment *can* be a legitimate basis for law.
  2.  **The Minimum Content Expands:** Hart's "minimum content" necessary for cohesion inflates dramatically. It now includes:
      *   Preventing harm to others (Core Harm Principle).
      *   Preventing profound offense to sensibilities (Positive Morality Protection - Devlin's core).
      *   Preventing serious self-harm to preserve future capacities (Paternalism - Substantive Moral Good).
      This expanded list looks remarkably like a *subset* of a society's positive morality – specifically, the parts Hart personally finds reasonable or widely shared in modern liberal societies. It ceases to be a truly *critical*, harm-based minimum and becomes a *qualified positive morality*.
  3.  **Hart as Qualified Legal Moralist:** Hart's position, in practice, becomes: The criminal law *can* legitimately enforce moral principles beyond harm-to-others, *provided* they meet certain thresholds of importance (protecting fundamental capacities, preventing profound offense). This *is* a form of legal moralism. It's qualified (not *all* morality is enforced, only that deemed sufficiently serious by the liberal legislator/philosopher), but it abandons the core liberal tenet that *only* harm to others justifies criminalization. Hart ends up agreeing with Devlin *that law can enforce morality for social cohesion*, while disagreeing only on the *scope* of the morality that can be enforced. This is a concession Devlin could readily accept as validating his core claim against radical Millian liberalism.

  **Conclusion:** Hart's concessions reveal an internal contradiction. He cannot simultaneously maintain that *only* preventing harm to others is necessary for cohesion *and* justify criminalization based on paternalism (protecting individuals from themselves based on a substantive view of their good) and profound offense (protecting sensibilities rooted in positive morality). By endorsing these grounds, he implicitly concedes Devlin's point: upholding *some* shared positive moral standards *is* necessary for social order, even if those standards go beyond direct harm-to-others. Hart's "critical morality" collapses into a qualified form of the very legal moralism he sought to defeat, differing from Devlin only in the *extent* of morality enforced, not the fundamental principle that law *can* legitimately enforce non-harm-based moral norms for the sake of social cohesion. His self-understanding as a defender of a narrow harm principle against moralism is unsustainable given his own concessions.
