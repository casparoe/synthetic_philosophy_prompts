answer: |-
  Your focus on the "argumentative engineering" is spot-on—Hume's genius lies in his systematic demolition of *both* possible justifications for induction. Let's reconstruct his logic step-by-step, then tackle the Goodman connection.

  ---

  ### **Hume's Two-Pronged Argument: Step-by-Step**
  **Stage 1: Ruling Out Demonstrative (A Priori) Justification**  
  *(EHU 4.18: "All reasonings may be divided into two kinds...")*  

  1.  **Premise 1:** All reasoning is either:  
      - *Demonstrative* (concerning "relations of ideas," e.g., logic/math), or  
      - *Moral/Probable* (concerning "matter of fact," e.g., empirical inferences).  

  2.  **Premise 2:** Demonstrative reasoning deals only with truths that are *necessarily true* (their denial implies a contradiction).  

  3.  **Hume's Test:** Denying the uniformity of nature (UN) implies no contradiction. We can *clearly conceive* radical changes in nature:  
      - Snow falling but tasting like salt or feeling like fire.  
      - Trees flourishing in winter and decaying in summer.  
      → *Therefore: UN cannot be established demonstratively.*  

  **Key Insight:** Hume leverages the *conceivability criterion* for possibility. If we can conceive non-uniformity without contradiction, UN isn't necessary—and thus can't be proven a priori.  

  ---

  **Stage 2: Ruling Out Probable (Empirical) Justification**  
  *(EHU 4.19: "If we be, therefore, engaged by arguments...")*  

  1.  **Premise 3:** All probable reasoning about matters of fact relies on *causal inference* (A causes B).  
  2.  **Premise 4:** Knowledge of cause/effect is derived *entirely from experience* (observing constant conjunctions).  
  3.  **Premise 5:** All empirical inferences *presuppose UN* (that the future resembles the past).  
      - When we infer fire will burn tomorrow because it burned yesterday, we assume nature’s operations are uniform.  

  4.  **The Circularity Trap:**  
      - To justify UN via probable argument (e.g., "UN has held in the past, so it will hold in the future"), we must:  
        a) Use causal inference (past regularity → future regularity),  
        b) Which *itself depends on UN* (Premise 5).  
      → **Thus, we assume UN to justify UN.**  

  **Exact Location of Circularity:**  
  Hume’s objection is **specifically tied to his account of probable reasoning**. Any empirical argument for UN would:  
  - Depend on causal inference (from past observations),  
  - But causal inference is *defined* as relying on UN.  
  → The justification *presupposes the very principle it aims to prove*.  

  > 🔍 **The Trapdoor:** Probable reasoning is *constituted by* inference from past conjunctions. Using it to certify UN is not just "assuming what you’re proving" in a vague sense—it’s using a tool *built on UN* to prove UN.  

  ---

  ### **Goodman’s Riddle: Sequel or Hidden Premise?**
  **The Core Tension:**  
  - Hume’s argument shows induction lacks *justification* (the "why trust it?" problem).  
  - Goodman’s riddle shows induction lacks *determinate content* (the "how to apply it?" problem).  

  **Your Question:** *If Hume’s gap were closed, would Goodman still undermine induction?*  
  **Yes—absolutely.** A non-circular justification for UN would still leave Goodman’s challenge unanswered:  

  1.  **Hume’s Minimal Uniformity:**  
      Hume assumes a *bare* notion of resemblance (objects "seemingly like" past ones). He never specifies *which properties* must resemble each other for UN to hold.  
      - E.g., Is "snow" defined by its appearance? Its chemical structure? Its temperature? Hume leaves this open.  

  2.  **Goodman’s Attack on Resemblance:**  
      Goodman shows that "resemblance" is predicate-relative. For any induction we make (e.g., "emeralds are green"), there’s a gerrymandered predicate ("grue") that fits past data but yields conflicting predictions.  
      - Justifying UN doesn’t tell us whether to project "green" or "grue."  

  3.  **Is Resemblance Implicit in Hume?**  
      - **Superficially, yes:** Hume’s examples (snow, trees) rely on intuitive similarity.  
      - **But crucially:** He never *thematizes* it. His argument works even if we grant intuitive resemblance—Goodman exposes that resemblance itself is the problem.  

  **Verdict:**  
  - Goodman’s riddle **isn’t embedded in Hume’s text**. Hume’s focus is on the *justificatory gap*, not the *descriptive underdetermination* of predicates.  
  - The two problems are **complementary but distinct**:  
    - Hume: Why believe *any* inductive inference? (Epistemic problem)  
    - Goodman: *Which* inductive inference to make? (Semantic/scientific problem)  
  - **Closing Hume’s gap would not resolve Goodman**: Even with UN justified, we’d need a way to privilege "green" over "grue" (e.g., via entrenchment, laws, simplicity).  

  ---

  ### **Teaching Recommendations**
  1. **Map Hume’s Logic Visually:**  
     ```  
     [Justification for Induction?]  
          │  
          ├──[Demonstrative?] → ✗ (No contradiction in non-uniformity)  
          │  
          └──[Probable?] → ✗ (Circular: presupposes UN)  
     ```  

  2. **Highlight the Circularity’s Mechanism:**  
     Emphasize that probable reasoning, *by Hume’s definition*, is "experimental conclusions proceed[ing] upon the supposition that the future will be conformable to the past" (EHU 4.19). Using it to prove UN is textbook *petitio principii*.  

  3. **Goodman as a "Second Layer" Puzzle:**  
     - Hume: "Why trust past experience to guide future expectations?"  
     - Goodman: "Even if you trust it, *which expectations* does it license?"  
     - **Analogy:** Hume questions the engine’s fuel; Goodman questions the steering wheel.  

  4. **Provocative Question for Students:**  
     > "Could Hume have formulated the grue problem? If not, what prevents his argument from addressing it?"  
     → *Answer:* Hume’s skepticism targets *justification*; Goodman targets *projectibility*. Hume’s "resemblance" is pre-theoretical; Goodman demands a theory of it.  

  This framing preserves Hume’s historical novelty while showing how Goodman radicalizes (but doesn’t duplicate) his challenge. Both reveal induction’s vulnerability, but at different depths.
