prompt: |-
  Retired chemist here - only got properly into philosophy after I shut the lab down, and lately I've fallen down a rabbit hole reading old LessWrong posts on decision theory. Everyone seems to use "updateless decision theory" (UDT) and Yudkowsky's "timeless decision theory" (TDT) almost interchangably, like they're the same idea under different branding, but that doesn't feel right to me. Could you spell out precisely where the two actually diverge, using the counterfactual mugging case (Omega flips a coin, demands $100 from you on tails, would've handed over $10,000 on heads if you're the type who pays) to make it concrete - does TDT genuinely pay up there on its own terms, or does it only get the right answer by quietly smuggling in the "updateless" move? And overall, which of the two do you think is the more defensible theory once cases like that are on the table?
