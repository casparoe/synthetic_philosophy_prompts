answer: |-
  What an excellent question - and kudos for spotting the subtle tension between TDT and UDT that many gloss over! As a former chemist, you'll appreciate that the divergence hinges on *when and how* the agent conditions on its knowledge state. Let's dissect Counterfactual Mugging (CM) to reveal the crucial split:

  **The CM Setup Recap:**
  1. Omega flips a fair coin (H/T).
  2. **Heads:** Omega *would have* given you $10,000 *if and only if* it predicts you pay on tails. (You never see this branch).
  3. **Tails:** Omega appears, asks for $100. You must decide now.

  **Timeless Decision Theory (TDT) - The Logical Conditioning Approach:**
  - TDT evaluates actions based on their *logical consequences* across all mathematically possible worlds where your decision algorithm exists.
  - In CM, TDT reasons: *"My decision in the Tails branch is logically entangled with the hypothetical Heads branch. If my algorithm is the 'type' that pays on Tails, that same logical property causes Omega to pay $10,000 in the Heads branch. Refusing on Tails means I get $0 in both branches."*
  - **TDT Pays:** It sacrifices $100 on Tails to "logically cause" the $10,000 gain in the counterfactual Heads branch. The *physical causality* of paying after a tails outcome is irrelevant; what matters is the *logical consistency* of the agent's output across linked possibilities.

  **The TDT Tension:**
  - **Crucially, TDT makes this decision *after* learning it's Tails.** It conditions on being in the Tails branch but argues that the *logical implications* of its decision function extend to the unseen Heads branch. This is where your suspicion arises: TDT's output depends on reasoning about a branch it *knows* didn't occur. Is this "smuggling in updatelessness"?

  **Updateless Decision Theory (UDT) - The Pre-Commitment Approach:**
  - UDT doesn't condition on the agent's current knowledge state (e.g., "I see Tails"). Instead, it chooses a *single, fixed policy* (a function mapping inputs to actions) *before* knowing which branch it's in.
  - In CM, UDT asks: *"Which policy (π) maximizes my expected utility *across all branches* from an *initial* ignorance position?"*
  - Policy 1 (π_Pay): Pay if asked.  
    EU = (0.5 × -$100) + (0.5 × $10,000) = $4,950  
  - Policy 2 (π_Refuse): Refuse if asked.  
    EU = (0.5 × $0) + (0.5 × $0) = $0  
  - **UDT Pays:** It pre-commits to π_Pay because it has higher expected utility *before* the coin flip. When Tails occurs, it pays simply because its optimal policy dictates it – **without needing to counterfactually reason about Heads *after* updating.**

  ### Where They Diverge (The Rabbit Hole Deepens)
  1. **Conditioning vs. Pre-Commitment:**  
     - **TDT** uses *logical conditioning*: Even after updating on Tails, it considers the logical dependence of the Heads outcome on *the type of decision-maker it is now*.  
     - **UDT** is *fundamentally updateless*: It selects a policy *prior* to any branch-specific information. When in a branch, it mechanically follows the policy.  

  2. **The "Smuggling" Question:**  
     **Yes, TDT arguably smuggles in an updateless move.** Its reasoning in the Tails branch *requires* treating its current decision as logically identical to the decision it *would have made* in the Heads branch – essentially evaluating a *policy* (always pay/refuse). Pure "logical conditioning" without this policy-level thinking might not compel paying when you *know* the $10,000 is forever out of reach. TDT implicitly relies on the *updateless optimality* of the "pay" policy to justify the counterfactual link. UDT makes this explicit and foundational.

  3. **CM as a Litmus Test:**  
     - A theory that **truly updates** on seeing Tails (e.g., Evidential/ Causal Decision Theory) sees no causal/logical link to the dead Heads branch. It refuses, losing $4,950 in expected value.  
     - **TDT pays** by bending its "logical conditioning" to mimic a pre-commitment.  
     - **UDT pays** by explicitly optimizing the policy pre-update.  

  ### Which is More Defensible?
  Given cases like CM, **UDT is the cleaner, more robust foundation:**

  1. **Conceptual Clarity:** UDT's policy-first approach directly addresses the core problem in CM and other "acausal" dilemmas: you need to optimize *before* indexical information (like which branch you're in) creates a conflict between individual decisions and global optimality. TDT's logical dependency arguments feel like clever retrofitting to get UDT's correct answers.
  2. **Formal Elegance:** UDT reduces decision theory to a single, well-defined computation: find the policy π maximizing expected utility over the world model. TDT's "logical conditioning" is fuzzier about how far logical dependencies extend.
  3. **Handles Weirder Edge Cases:** UDT naturally scales to dilemmas like **Absent-Minded Driver** or **Parfit's Hitchhiker** without ad-hoc adjustments. TDT can be coaxed into working, but its reliance on logical correlations becomes strained in complex self-referential scenarios.
  4. **The Philosopher's Nod:** UDT generalizes better to embedded agents (e.g., AIs considering their own code) and avoids the "update then pretend you didn't" tension in TDT.

  **In essence:** TDT is a powerful *heuristic* that often points to the UDT-optimal policy by reasoning about logical correlations. But UDT provides the *formal machinery* justifying why that policy is optimal. For a chemist seeking rigorous foundations: **UDT is the more defensible theory.** It treats decision-making as finding a fixed function (policy) maximizing expected utility from the *initial state of ignorance*, making counterfactual mugging and its kin resolve naturally. TDT feels like UDT wearing a clever disguise – brilliant, but philosophically less pristine once you peek behind the curtain. Welcome to the rabbit hole – it only gets deeper from here!
