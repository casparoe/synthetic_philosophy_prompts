  Morpheus should open with the classic coherence pressure: "At sufficient capability, any agent that *isn't* a coherent EU maximizer gets outcompeted—money pumps eat it alive." But Eris needs to counter effectively: "Your 'EU maximizer' is a spherical cow. Real systems are messy webs of context-triggered heuristics. Look at CoinRun—no unified goal, just a reinforced 'run right' shard activated by level-end cues." 

