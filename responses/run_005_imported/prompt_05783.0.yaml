  Their grief context makes me think they're wrestling with theodicy beneath the technicalities. When drafting the kasb question, I'll subtly acknowledge how responsibility feels different when suffering is fresh - not as academic exercise but as lived anguish. The guest scholar might miss that nuance unless prompted.

  For the cotton-fire follow-up: must anticipate her likely "no necessary connections" reply and have the secondary question ready about whether this makes divine action arbitrary. That's Ghazālī's own worry in Tahafut - if God can do anything anytime, why trust consistency? The scholar's answer here will reveal if she leans toward voluntarist or rationalist theology.

  Averroes' objection is the kill shot. If causal connections don't exist, how can we have demonstration (burhān)? The guest might counter that God's reliable will substitutes for necessity - but then the follow-up about whether this reduces to "God wills it" as the only explanation must press hard. That's where occasionalism either becomes tautological or opens to evidence.

  Final evidence question needs teeth. Not just "what would falsify it" but "what empirical difference would occasionalism make?" If the answer is "none," that's problematic. If she offers something testable, we've got drama for the podcast.
answer: |-
  Here’s a sequenced interview draft designed to push beyond restatements, challenge the "custom" deflection, and target your specified themes. Each question includes a likely answer and a strategic follow-up.

  **Interview Structure:**  
  *Sequenced to escalate pressure on "custom," move from metaphysics to epistemology, and end on falsifiability.*  

  ---

  ### 1. **The Cotton-and-Fire Test**  
  **Question:** *"Al-Ghazālī’s famous cotton-and-fire example denies that fire ‘causes’ combustion. Is this primarily rejecting creaturely *causal powers* (fire’s innate ability to burn), or *necessary connections* (the logical/metaphysical link between fire and cotton’s burning), or both? And why focus on this distinction?"*  
  *Likely Answer:* She’ll emphasize rejecting *necessary connections* (no inherent "must" in nature), while allowing God to grant fire a *habitual power* (qudra) within His custom.  
  **Follow-Up:** *"If fire has no *inherent* power, but God *gives* it power within His custom, doesn’t this reintroduce a derived causal power in creatures? Or is ‘power’ here just a misleading label for constant conjunction under divine will?"*  
  *(Sets up tension between "custom" and true causal delegation.)*  

  ---

  ### 2. **Human Responsibility & Kasb**  
  **Question:** *"Ashʿarite *kasb* (acquisition) holds humans ‘acquire’ acts created directly by God. How does this differ from hard determinism? If God creates the act *and* the human ‘acquisition’ of it, what, metaphysically, does the human actually *contribute* to responsibility?"*  
  *Likely Answer:* She’ll stress intention (niyya) or that God creates the act "in conjunction with" the human’s capacity/moment of choice, making responsibility meaningful.  
  **Follow-Up:** *"But if God is the sole agent creating *both* the act *and* the capacity/choice at that exact moment, isn’t ‘acquisition’ just God causing responsibility *in us* rather than us *being* responsible? Is this a solution or a semantic relocation of the problem?"*  
  *(Highlights agency as a core tension, distancing from "custom" deflection.)*  

  ---

  ### 3. **The Explanatory Vacuum of ‘Custom’**  
  **Question:** *"When you say God’s ‘custom’ (ʿāda) explains nature’s regularity, how is this *metaphysically thicker* than a Humean regularity theory? Doesn’t ‘God wills it’ just restate the regularity without explaining *why* this custom holds or *how* it imposes order?"*  
  *Likely Answer:* She’ll argue divine will provides a *personal, intentional grounding* for laws, unlike blind regularity.  
  **Follow-Up:** *"But if God could alter the custom *arbitrarily* at any moment (as Ghazālī insists), doesn’t this make the grounding *voluntarist* rather than *rational*? If so, can ‘God wills it’ ever *explain* a specific regularity (e.g., why fire correlates with heat, not cold), or does it merely assert that regularity exists?"*  
  *(Forces her to confront whether "custom" explains anything beyond "it happens.")*  

  ---

  ### 4. **Ibn Rushd’s Epistemological Challenge**  
  **Question:** *"Averroes attacked occasionalism for making *demonstrative knowledge* (ʿilm burhānī) impossible: if there’s no necessary connection between cause and effect, we can’t reason from effect to cause (or vice versa). How can occasionalism account for scientific knowledge if all inference relies on a divine habit that could, in principle, change?"*  
  *Likely Answer:* She’ll argue God’s *faithfulness* to His custom allows justified confidence in induction, mirroring scientific practice.  
  **Follow-Up:** *"But doesn’t reducing necessity to divine faithfulness collapse *demonstration* (certainty via necessity) into *induction* (probability via observation)? If so, has occasionalism sacrificed Aristotle’s (and science’s ideal of) *certain* knowledge for the sake of theological voluntarism?"*  
  *(Directly ties the "custom" defense to the collapse of epistemic certainty.)*  

  ---

  ### 5. **Escalating the ‘Custom’ Problem**  
  **Question:** *"If God’s custom is *reliable* but *non-necessary*, does this imply nature’s order is *contingently* necessary (i.e., necessary *given* God’s choice) or *radically contingent* (could cease without contradiction)? If the latter, can ‘laws of nature’ be meaningfully said to *govern* or merely *describe*?"*  
  *Likely Answer:* She’ll likely affirm radical contingency but insist descriptions remain scientifically useful.  
  **Follow-Up:** *"If laws are merely descriptive regularities of God’s *current* custom, doesn’t this undermine *nomic necessity*—the idea that laws *constrain* what can happen? For example, could God make fire freeze cotton *while sustaining the exact same physical properties* of fire and cotton? If yes, what content does ‘law’ retain beyond ‘what usually happens’?"*  
  *(Pushes "custom" to its breaking point by questioning the very concept of physical law.)*  

  ---

  ### 6. **Evidence Against Occasionalism?**  
  **Question:** *"Occasionalism is often called unfalsifiable. But if we take it as a *metaphysical* thesis, what *could* count as evidence against it? For instance, if we discovered a particle whose behavior was *truly* random (indeterminate) yet law-governed statistically, would this support or undermine the view that all events are directly willed by God?"*  
  *Likely Answer:* She’ll likely say occasionalism accommodates randomness (God willing each indeterminate event).  
  **Follow-Up:** *"If *any* observable pattern—deterministic, probabilistic, or chaotic—can be attributed to God’s direct will and ‘custom,’ does occasionalism make any *testable* claim about the world? If not, does it risk becoming a *metaphysical gloss* on science rather than a competitor?"*  
  *(Ends on falsifiability, forcing a defense of its metaphysical substance.)*  

  ---

  **Why this sequence works:**  
  1. **Builds Pressure:** Starts with concrete examples (cotton/kasb), moves to "custom’s" explanatory poverty (Q3), then its epistemic cost (Q4), and finally its conceptual instability (Q5).  
  2. **Preempts Deflections:** Follow-ups anticipate appeals to divine will/custom and force deeper justification.  
  3. **Core Themes Covered:** Causal powers/necessity (Q1), kasb (Q2), custom’s emptiness (Q3), Ibn Rushd (Q4), and falsifiability (Q6).  
  4. **Closes Strong:** Ends with a challenge to occasionalism’s empirical content, leaving listeners with critical questions.  

  **Delivery Tip:** Frame follow-ups as clarifications ("Help me understand...") to maintain dialogue while pressing the point. Your guest’s responses to Q3 and Q5 will be especially revealing about whether "custom" is substantive or a placeholder.
