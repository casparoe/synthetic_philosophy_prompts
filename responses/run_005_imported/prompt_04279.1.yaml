prompt: |-
  Below is a passage from Aristotle's discussion of reciprocal justice in exchange, Nicomachean Ethics, Book V, chapter 5 (Rackham's Loeb translation):

  "Now proportionate requital is effected by diagonal conjunction. For example, let A be a builder, B a shoemaker, C a house, and D a shoe. It is required that the builder shall receive from the shoemaker a portion of the product of his labor, and give him a portion of the product of his own. Now if proportionate equality between the products be first established, and then reciprocation take place, the requirement indicated will have been achieved; but if this is not done, the bargain is not equal, and intercourse does not continue. [...] Hence all commodities exchanged must be able to be compared in some way. It is to meet this requirement that men have introduced money; money constitutes in a manner a middle term, for it is a measure of all things, and so of their superior or inferior value, that is to say, how many shoes are equivalent to a house or to a given quantity of food. [...] It is therefore necessary that all commodities shall be measured by some one standard, as was said before. And this standard is in reality demand, which is what holds everything together, since if men cease to have wants or if their wants alter, exchange will go on no longer, or will be on different lines. But demand has come to be conventionally represented by money; this is why money is called nomisma (customary currency), because it does not exist by nature but by custom (nomos), and can be altered and rendered useless at will."

  I can follow the broad idea that exchange requires some common measure, but the argument's details resist me. First, what does "diagonal conjunction" actually pick out mathematically in the builder/shoemaker/house/shoe example: which terms are supposed to be proportional to which, and why would a "straight" pairing fail where a "diagonal" one succeeds? Second, Aristotle appears to say both that demand (chreia) is the real measure of value, of which money is merely a conventional stand-in, and that money itself is what "makes things commensurable." Can these two claims be reconciled, and if so, does the resulting position amount to a needs-based theory of value, a convention-based one, or something that resists that dichotomy? A step-by-step reconstruction of the argument would help, including a note on where translators or commentators have disagreed about how to read the proportion.
