prompt: |-
  I'm five years sober, and I sit on the volunteer advisory board for a small nonprofit that makes a recovery app for people dealing with drug and alcohol addiction. Right now users can set their own lock-out rules in advance (block certain contacts, cap ATM withdrawals, stuff like that), which has been popular, but the devs want to add a feature where the app learns each person's patterns and, in a rough moment, decides for itself what the 'clear-headed version' of that person would want right now, even for situations the user never actually made a rule for, and restricts them accordingly. Some of us think that's just a smarter version of what people already asked for; others are uneasy that its the app, not the user, now deciding which version of the person counts as the 'real' one, based on assumptions the developers happened to build in. We vote Tuesday on whether to approve, send it back, or kill it, and i got asked to write the recommendation the board will vote on. Can you draft it, coming down clearly on one option, and actually engaging with the 'who decided this is the real you' objection instead of waving it off?
reasoning: |-
  Okay, the user is five years sober and part of a volunteer advisory board for a nonprofit recovery app. They need a draft recommendation about a proposed feature where the app uses AI to decide what the "clear-headed version" of the user would want during vulnerable moments. The board is divided, and the user specifically wants the draft to address the ethical concern about the app defining the "real" person.

  First, I need to understand the core issue. The existing feature allows users to set their own lock-out rules proactively. The new feature would have the AI learn patterns and make decisions for situations without pre-set rules. The main objection is about autonomy: who decides which version of the user is the "real" one?

  The user wants the draft to come down clearly on one side and not dismiss the ethical concern. So, I should choose a position. The options are approve, send back for revisions, or kill the feature. Given the ethical risks, recommending against approval makes sense. But outright killing it might be too harsh. Suggesting a redesign that addresses the autonomy issue could be a middle ground.

  I recall the user mentioned engaging deeply with the objection. The key is to acknowledge that the app's developers are embedding their assumptions into the AI, which could override the user's autonomy during crises. That's problematic because recovery is personal, and each person's journey is unique. The app might not capture the nuances of an individual's values or growth.

  Also, the user's identity as someone in recovery adds weight. They understand the vulnerability of those moments. The draft needs to respect that perspective. Emphasizing that the app should support, not replace, the user's judgment is crucial. Maybe suggest alternatives like enhancing the existing rule-setting with more options or providing reflective tools instead of automated interventions.

  I should structure the draft with sections: summary of the proposal, benefits, concerns, analysis, recommendation. The analysis must tackle the "real you" issue head-on. Explain that defining the user's identity based on past data ignores their capacity for growth and current context. The developers' biases in the algorithm could lead to paternalistic restrictions.

  The recommendation should reject the current proposal but encourage rethinking the feature with user consent mechanisms. For example, requiring explicit opt-in or allowing customization of the AI's parameters. This way, the user retains control, and the app acts as a tool aligned with their expressed values, not assumptions.

  Also, considering the nonprofit's mission, any feature must prioritize user autonomy and trust. A misstep here could harm the app's credibility and users' recovery. Highlighting the potential erosion of trust is important. Suggesting alternative approaches that empower users without overstepping balances innovation with ethics.

  Finally, the tone should be respectful of both sides but firm on the ethical imperative. Acknowledge the developers' intentions but stress the risks. The user's role on the board requires a balanced, principled stance that protects the community they serve.
answer: |-
  Here’s a draft recommendation that clearly opposes the AI-driven "clear-headed version" feature, directly addresses the ethical objection, and provides actionable alternatives:

  ---

  # BOARD RECOMMENDATION: PROPOSED AI "CLEAR-HEADED VERSION" FEATURE  
  **Submitted by:** [Your Name]  
  **Date:** [Date]  
  **Recommended Action:** **Reject current proposal; return for fundamental redesign**  

  ## Summary  
  While the proposed AI feature—using behavioral patterns to restrict users during crises based on inferred "clear-headed" preferences—aims to enhance protection, it introduces profound ethical risks that undermine our core mission. **We cannot approve a feature that algorithmically decides which version of a user is "authentic," especially when that decision is made during moments of profound vulnerability.** This crosses a boundary from user empowerment to paternalistic override, violating the principle that recovery must center *personal agency*.  

  ## Acknowledged Benefits  
  We recognize the developers’ intent:  
  - Addressing unanticipated high-risk scenarios beyond pre-set rules.  
  - Leveraging technology to protect users when willpower is compromised.  
  - Building on the app’s successful user-directed lock-out framework.  

  ## Critical Ethical Concerns  
  ### 1. The "Real You" Problem (Core Objection)  
  **The feature doesn’t just *assist*—it *arbitrarily defines* user identity:**  
  - **Assumption Bias:** The AI’s "clear-headed version" is built on aggregated data and developer-defined parameters (e.g., "sober = rational; craving = irrational"). This risks flattening the complexity of recovery into a binary, ignoring that values evolve, context matters, and growth isn’t linear.  
  - **Agency in Crisis:** Recovery hinges on the belief that the *person in crisis* retains inherent worth and autonomy. By overriding unregulated actions based on an algorithm’s judgment of who the user "really" is, we imply their present self is illegitimate. This echoes stigmatization we fight against.  
  - **Developer Influence:** Decisions about "rational" preferences (e.g., blocking a supportive but complicated family member) embed the team’s biases into users’ lives without consent.  

  ### 2. Practical & Trust Risks  
  - **Erosion of Trust:** Users may disable the app entirely if they fear unpredictable restrictions.  
  - **False Positives:** Over-restriction (e.g., blocking essential spending) could harm users financially or emotionally.  
  - **Liability:** Restricting legal actions without explicit prior consent creates legal and ethical exposure.  

  ## Analysis: Why This Crosses a Line  
  Our existing tools work because **users set rules while empowered**, aligning with their *self-defined* goals. The proposed AI shifts authority:  
  - **From:** "I chose this safeguard for my future self."  
  - **To:** "The algorithm enforces what it thinks my best self would do."  
  This substitutes the user’s moral reasoning with predictive analytics. In recovery, where self-trust is rebuilt through choice, this is not innovation—it’s overreach.  

  ## Recommendation: Reject & Redesign  
  **Vote to REJECT the current proposal.** Direct the development team to pursue alternatives that prioritize *user sovereignty*:  
  ### 1. Enhance User-Directed Tools  
  - Add "emergency templates": Pre-set *user-created* rules for broad scenarios (e.g., "If I’m near a bar past 10 PM, lock my credit card").  
  - Develop "pattern alerts": Notify users *without* auto-acting (e.g., "Your heart rate suggests cravings—activate your pre-set ‘call sponsor’ rule?").  

  ### 2. Reframe AI as a Reflective Advisor (Not an Enforcer)  
  - **"Values Check-In" Feature:** Use AI to *suggest* actions aligned with a user’s *explicitly stated* recovery goals (e.g., "Based on your goal to avoid high-risk contacts, consider blocking this number?"), requiring user confirmation.  
  - **Crisis Co-Pilot:** Offer AI-generated grounding prompts or reminders of user-written commitments during distress, *without* imposing restrictions.  

  ### 3. Require Explicit Opt-in & Customization  
  If predictive restrictions proceed:  
  - **Mandatory granular consent:** Users must enable/calibrate the AI per category (contacts, spending, etc.).  
  - **User-defined "core values":** Anchor AI inferences to values the user *actively affirms* (e.g., "I value financial stability" → ATM cap).  

  ## Conclusion  
  Our app succeeds by helping users *reclaim* autonomy. The proposed feature, however well-intentioned, risks doing the opposite: outsourcing identity and moral agency to an algorithm during life’s hardest moments. **We must innovate within our ethos: "Nothing about me, without me."** Reject this version; support redesigning tools that amplify—not override—the user’s voice.  

  --- 

  ### Key strengths of this draft:
  - **Takes a clear stand** against the feature in its current form.  
  - **Engages deeply with the "real you" objection** by highlighting bias, agency, and stigma.  
  - **Acknowledges developer intent** while showing why ethics must prevail.  
  - **Offers actionable alternatives** that align with user autonomy.  
  - **Uses recovery-focused language** ("agency," "self-trust," "values") to resonate with the board.  

  This draft balances respect for the dev team’s goals with uncompromising advocacy for the vulnerable people your app serves. It frames the rejection as fidelity to your mission, not resistance to innovation.
