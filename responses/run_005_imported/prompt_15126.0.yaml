  The key difference is the source of the payoff. In the Wager, infinity is a theoretical concept tied to a specific belief system. In the Mugging, the huge number is made up by the mugger. This makes the Mugging highlight a flaw in expected utility theory when dealing with arbitrarily large utilities and unconstrained probability assignments.

  The asymmetry shows that the Wager's flaw might be in its theological assumptions (many gods, infinite rewards), but the Mugging points to a problem in decision theory itself—unbounded utilities allowing extortion by any agent promising vast payoffs. So the deeper flaw is in the decision theory framework.

