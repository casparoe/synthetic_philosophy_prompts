answer: |-
  You've hit on a profound and subtle point that troubles many mathematically-inclined minds! Your intuition about the strength of the evidence is absolutely correct, but the distinction between the **proven mathematical equivalences** and the **unprovable metaphysical claim** of the Church-Turing Thesis (CTT) is crucial. Here's why CTT remains a thesis, not a theorem:

  1.  **The Proven Equivalence vs. The Unprovable Claim:**
      *   **The Proven Theorem (Church-Turing-Kleene Equivalence):** It's rigorously proven that the class of functions computable by:
          *   Turing Machines (with any finite alphabet and infinite tape)
          *   Lambda Calculus
          *   General Recursive Functions (Kleene)
          *   Post Systems
          *   Register Machines
          *   ...and many other formalisms developed later (like most modern programming languages modulo resource constraints)
          ...is **exactly the same class**. This is a mathematical fact.
      *   **The Unprovable Claim (CTT):** The Church-Turing Thesis asserts that **this specific class of functions coincides exactly with the class of functions that are *intuitively computable* by a human following an algorithm, or by any physically realizable process.**

  2.  **Why the Intuitive Notion Can't Be Formally Captured (and Thus Proven):**
      *   **"Computable" is Informal:** The concept we're trying to capture ("computable by a finite, mechanical procedure") is an *intuitive, pre-formal* notion rooted in human practice and understanding. It exists *before* and *outside* of any specific formal system.
      *   **No Independent Definition:** To *prove* CTT, you would need a rigorous, universally agreed-upon, *non-circular* mathematical definition of "intuitively computable" that exists *independently* of Turing machines, lambda calculus, etc. **This independent definition does not exist.** Any attempt to formalize "intuitive computability" *becomes* one of the formalisms whose equivalence has been proven. You can't step outside the circle of formalisms to compare the class to the "true" intuitive class.
      *   **The Problem of Novel Formalisms:** CTT makes a claim about *all possible* formalisms for computation, including those not yet invented. How can you mathematically prove that no future, radically different formalism could capture a broader notion of "intuitive computability"? You can only prove equivalences *between known formalisms*.

  3.  **The Role of Evidence (Why We Believe It):**
      *   **Convergence:** As you rightly observe, *every* serious, plausible attempt to formalize "algorithm" or "effective calculability" has converged on the same class. This is extremely powerful evidence.
      *   **Robustness:** The class is incredibly robust. Minor changes to the formalisms (e.g., multiple tapes, different instruction sets for register machines, non-determinism) *still* compute the same class of functions (though efficiency may change).
      *   **Failure of Counter-Proposals:** Attempts to define a "more powerful" notion of computation that still seems "intuitively algorithmic" have consistently failed. Proposed models like the "analog computer" (with infinite precision), "hypercomputation" (using hypothetical physics like Malament-Hogarth spacetimes or accelerating Turing machines), or "computations requiring infinite steps" generally violate fundamental intuitions about being "finite," "mechanical," or "realistically implementable step-by-step." They don't align with the core idea of a human clerk following finite instructions.
      *   **Lack of Counter-Examples:** No one has ever produced a convincing example of a function that is:
          1.  Clearly computable by a human following a finite, mechanical procedure (i.e., intuitively computable).
          2.  Provably *not* computable by a Turing Machine (or equivalent formalism).

  4.  **The Status of CTT:**
      *   **Not a Conjecture in Doubt:** It's *not* treated as something likely to be false. The evidence you cite is overwhelming. It's considered as solid as any unprovable foundational principle can be (like the consistency of sufficiently strong axiomatic systems, which Gödel showed is unprovable within the system itself).
      *   **A Foundational Axiom/Definition:** In practice, within mathematics and computer science, CTT functions as a **definition**. We *define* "computable function" to mean "computable by a Turing Machine" (or any equivalent formalism). This definition is incredibly successful and fruitful.
      *   **A Philosophical Thesis:** Its status as a "thesis" acknowledges that it bridges the gap between the formal mathematical world and the informal world of human intuition and physical realizability. It's a statement about how we interpret mathematics in relation to the physical world and our cognitive abilities. This interpretation cannot be mathematically proven; it must be accepted based on evidence and argument.

  **Analogy:** Imagine trying to prove mathematically that "the set of all objects identifiable as a `chair` by humans coincides exactly with the set of objects satisfying formal specification X." You can show that many different attempts to formalize `chair` (Spec X, Spec Y, Spec Z) all pick out the same set of objects. You can show that no object satisfying Spec X has ever been rejected as a `chair` by humans, and no object rejected by Spec X has ever been universally accepted as a `chair`. This is strong evidence Spec X captures `chair-ness`. But can you *prove* there isn't some bizarre object humans would call a `chair` that violates Spec X, or vice-versa? No, because "`chair`" is ultimately an intuitive, culturally influenced concept. CTT faces a similar, though more abstract, challenge with "computable."

  **In Summary:**

  *   **What's Proven:** All serious formalizations of computation are equivalent (a theorem).
  *   **What's Not Proven (and Likely Unprovable):** That this specific formal class exhausts *everything* we mean by "computable" in the broadest intuitive or physical sense (the thesis).
  *   **Why it Matters:** Recognizing CTT as a thesis acknowledges the fundamental gap between formal mathematical models and the informal concepts they model. It highlights that computation, as we understand it mathematically, rests on a very well-supported but ultimately unprovable assumption about the nature of algorithms and mechanical processes.

  Your discomfort stems from correctly seeing the immense weight of evidence. Textbooks call it a "thesis" not because of doubt, but out of philosophical precision regarding the nature of the claim and the limits of formal proof. It's a testament to the robustness of the concept that the evidence *is* so overwhelming that we confidently build vast theoretical edifices upon it. Nothing is "open" in the sense that anyone expects it to be falsified; the "openness" is inherent in the type of claim it is.
