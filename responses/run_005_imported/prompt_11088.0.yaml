answer: |-
  ## The Knobe Effect: Not a Bug, But a Feature of Intentionality Itself

  The Knobe effect is indeed a cognitive gut-punch. That stark asymmetry – condemning indifference as "intentional" harm while absolving it of "intentional" help – feels intuitively inconsistent. While competing explanations abound, a critical analysis of the evidence reveals that the effect is not merely a performance error or pragmatic quirk. Instead, it exposes a fundamental, evaluative dimension deeply embedded within our folk-psychological concept of intentional action, though perhaps not *exclusively* moral in the way Knobe initially proposed. **The Knobe effect wins: moral (or broadly normative) evaluation is genuinely constitutive of how ordinary people judge intentionality.**

  ### The Contenders: Explanations on the Table

  1.  **Knobe's Original Claim: Moral Evaluation as Constitutive:**
      *   **Thesis:** The asymmetry arises because moral badness is a core component of the *concept* of intentional action itself. When evaluating "did X do Y intentionally?", we don't just neutrally assess mental states (desire, belief, awareness); we inherently consider whether the outcome *violates a salient norm*. Harming the environment is a salient moral norm violation; helping it is a norm conformity. Indifference plus a bad outcome triggers the "intentional harm" judgment because the badness is integral to the intentional action concept.
      *   **Strength:** Directly explains the core asymmetry. Aligns with the powerful intuitive pull of the effect. Predicts that manipulating moral valence should robustly flip judgments.

  2.  **Performance Error / Bias:**
      *   **Thesis:** The concept of intentionality *is* purely descriptive (based on awareness, desire, etc.). The asymmetry arises from *extraneous* factors:
          *   **Blame/Emotion:** Negative outcomes trigger anger/blame, which then biases the judgment of intentionality. We *want* to blame the chairman, so we inflate the intentionality judgment.
          *   **Pragmatics:** Saying someone "intentionally harmed" conveys strong condemnation pragmatically, even if technically the harm was a side-effect. In the help case, "intentionally helped" would imply undeserved praise, so we avoid it. It's about conversational implication, not conceptual structure.
      *   **Strength:** Preserves a traditional, "clean" philosophical view of intentionality. Explains why people might give inconsistent answers under emotional influence or conversational pressure.

  3.  **Cost/Benefit Asymmetry (Non-Moral):**
      *   **Thesis:** The core driver isn't morality *per se*, but a general asymmetry in how we treat outcomes relative to an agent's *primary goal*. An outcome that *counts against* the agent's main concern (like harming the environment when profit is the goal) is treated differently than one that *counts for* it (helping the environment). This "counting against" creates a conflict, making the outcome seem more agentially connected, hence more intentional. Morality amplifies this, but the basic structure is goal-relative cost/benefit.
      *   **Strength:** Accounts for key non-moral variants (e.g., chairman *harms* sales target vs. *helps* sales target while pursuing profit). Suggests morality is a powerful *instance* of norm-violation, not the sole cause.

  ### Weighing the Evidence: Why the Evaluative View Wins

  1.  **The Failure of the "Pure" Performance Error View:**
      *   **Robustness:** The effect persists across diverse populations, phrasing variations, and contexts. It's not easily eliminated by instructions to be "objective" or by reducing emotional language. If it were just a bias or conversational shortcut, it should be fragile and manipulable.
      *   **Predictive Power:** The bias view struggles to explain *why* blame inflates intentionality judgments specifically. It posits an *ad hoc* link. In contrast, the evaluative view provides a principled explanation: norm-violation is *part of* the intentionality judgment in such cases. Blame arises *because* the action is judged intentional *under that evaluative lens*.
      *   **Pragmatics Undermined:** Studies controlling for pragmatic factors (e.g., asking "Did the chairman *bring about* the harm intentionally?" instead of just "intentionally harm?") still show the asymmetry. People genuinely believe the chairman *intentionally brought about the harm* due to his indifference to the norm violation.

  2.  **The Non-Moral Evidence: Refining, Not Refuting, Knobe:**
      *   **The Challenge:** Findings that the asymmetry appears in non-moral scenarios (e.g., harming/helping a *sales target*) seem to directly challenge Knobe's *specifically moral* constitutive claim.
      *   **The Refinement:** This evidence doesn't destroy the evaluative view; it *broadens* it. It reveals that the core driver is **normative assessment relative to context**. What matters is whether the side-effect *violates a salient norm relevant to the agent's situation*. In the classic case, the norm is moral (don't harm environment). In the sales case, the norm is prudential/strategic (don't harm the sales target *if that's a concern*, even if the agent only cares about profit). The key is that the bad outcome *counts against* something the agent *should* care about (or is normatively expected to care about) in that context.
      *   **Morality's Amplifying Role:** Crucially, when morality *is* introduced, the effect is significantly *stronger*. Harming the environment elicits higher intentionality ratings than harming a sales target. This shows morality isn't incidental; it's a particularly potent form of norm-violation that deeply engages the intentionality judgment mechanism. The non-moral cases reveal the underlying cognitive structure; the moral cases demonstrate its most powerful instantiation.

  3.  **The Cost/Benefit Asymmetry as Mechanism, Not Alternative:**
      *   The "counting against" vs. "counting for" asymmetry provides the crucial *cognitive mechanism* underlying the effect. Our concept of intentional action is sensitive to **agential conflict**. When an agent knowingly brings about an outcome that clashes with a salient normative standard (moral, prudential, conventional) *and* displays indifference to that clash, we judge the outcome as more intentionally produced. The indifference signifies acceptance of the norm-violation as part of the plan. Good outcomes that align with norms or the agent's sole goal lack this conflict; indifference doesn't signal the same agential endorsement of a problematic outcome.

  ### The Verdict: Deep Structure, Not Discountable Bias

  The evidence decisively favors the view that the Knobe effect reveals something deep and structural about our ordinary concept of intentional action. It is not merely a performance error, a pragmatic distortion, or an artifact of blame. Instead:

  1.  **Intentionality is Inherently Evaluative:** Our judgment of whether an action was performed intentionally is not a purely mechanical assessment of belief and desire. It is fundamentally shaped by a normative assessment: did the agent knowingly bring about an outcome that *violated a salient norm* relevant to the context, demonstrating indifference to that violation?
  2.  **The Core is Normative Conflict:** The asymmetry arises from a deep-seated cognitive sensitivity to agential conflict with norms. "Counting against" a norm (be it moral harm, prudential loss, or strategic disadvantage) triggers the judgment that the agent intentionally brought about that negative outcome through their indifference. "Counting for" does not.
  3.  **Morality is Special, But Not Sole:** While the effect is robust in non-moral contexts, morality acts as a powerful amplifier. Violating a moral norm produces the strongest intentionality judgments, highlighting how deeply moral evaluation is woven into our understanding of agency. The non-moral cases show the *structure*; the moral cases reveal its most potent *expression*.

  **Therefore, the Knobe effect is not a glitch to be discounted; it is a profound insight into the architecture of folk psychology.** It demonstrates that our concept of intentional action is not value-neutral. It inherently incorporates an assessment of the agent's relationship to the normative landscape – their awareness of potential violations and their attitude (indifference) towards them. Knobe was fundamentally right about the deep entanglement of evaluation and intentionality, even if the specific mechanism involves a broader range of norms than purely moral ones. The chairman who knowingly, indifferently harms the environment *is* judged to have intentionally caused that harm, not because we are biased, but because our very concept of intentional action demands we hold him accountable for his disregard of a salient norm. The effect doesn't mess with our heads; it reveals how our heads actually work when making sense of responsibility in a norm-governed world.
