  Okay so I've never studied this stuff formally, I just fall down internet rabbit holes at like midnight, but lately I can't stop thinking about the Condorcet Jury Theorem. From what I understand it's this old probability idea (some French guy from the 1700s) that says if you get a group of people to vote on something, and each person is only a little bit more likely than not to be right, like 51% right, and crucially they all vote totally independently without talking it over first, then the bigger the group gets the closer the majority vote gets to being correct, like it approaches 100% as you add more people. Which is probly a pretty wild claim when you actually sit with it, cause it basically means a herd of mediocre people can out-perform a genius as long as those two conditions actually hold.

  I was trying to explain this to my buddies at trivia night after our team lost because everybody caved and went with the loudest guy's guess instead of voting seperately, and it hit me that there's probably a decent joke buried in there somewhere, about juries, or committees, or trivia teams, being sold as this amazing wisdom-of-crowds machine that in practice falls apart the second the "independent" part gets violated, or the second everyone's actually worse than a coin flip and more people just makes things worse instead of better. Could you take a crack at writing that joke for me? I want it to actually be funny to someone who already gets the theorem, like the punchline should really depend on knowing the independence assumption and the "just barely better than a coin flip" part, not just be some generic "committees are dumb, amirite" type joke.
