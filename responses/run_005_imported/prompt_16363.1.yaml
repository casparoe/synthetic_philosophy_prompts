answer: |-
  You've hit on a fascinating interdisciplinary connection! While both **pure time preference (PTP)** and **hyperbolic discounting (HD)** involve "discounting the future," they are fundamentally **different concepts operating at different levels, with different justifications, and facing different types of controversy.** Here's a breakdown and comparison:

  **1. Pure Time Preference (PTP): The Ethical & Intergenerational Argument**

  *   **What it is:** The practice of assigning a lower weight to the well-being of future generations *simply because they exist in the future*. It's an *ethical* discount rate applied to *utility* (well-being, consumption).
  *   **Core Justification (Disputed):** Proponents might argue for uncertainty about the future existence of humanity, human impatience as a fundamental trait, or a philosophical view that "existence now" has inherent priority. Stern Review rejects this as ethically indefensible for long-term issues like climate change.
  *   **Key Features:**
      *   **Normative & Ethical:** It's about *how we should value* future people's well-being.
      *   **Intergenerational:** Focuses on welfare across different generations (e.g., us vs. people 100 years from now).
      *   **Constant Rate (Exponential):** Traditional economic models using PTP typically apply a *constant* discount rate per year (e.g., 3% per year, compounded). $1 of utility in year T is worth $1 / (1+r)^T today.
      *   **Controversy:** The core ethical premise is highly contested. Philosophers (e.g., Derek Parfit) and economists (e.g., Stern, Ramsey before him) argue there is no *moral justification* for valuing the well-being of a future person less than an otherwise identical present person *solely* because of the date of their birth. It's seen as discrimination based on temporal location. Stern argued for a near-zero PTP (≈0.1%) primarily reflecting extinction risk, not time preference itself.

  **2. Hyperbolic Discounting (HD): The Behavioral & Intrapersonal Quirk**

  *   **What it is:** A *descriptive model* of how individuals *actually behave* when making choices involving immediate vs. delayed rewards for *themselves*. It reveals *time-inconsistent preferences*.
  *   **Core Observation:** People show a much stronger preference for immediate rewards over slightly delayed rewards than they do for more distant rewards over even longer delays. The discount rate is *higher* in the short term than the long term.
  *   **Key Features:**
      *   **Descriptive & Behavioral:** It describes *how people actually choose*, not how they *should* choose.
      *   **Intrapersonal:** Focuses on choices made by a *single individual* across different points in *their own lifetime* (e.g., "eat cake now vs. diet later," "spend now vs. save for retirement").
      *   **Time-Inconsistent Discounting:** The discount rate *changes* dramatically depending on the time horizon. For example:
          *   You might prefer $100 today over $110 tomorrow (high discount rate for immediate delay).
          *   But you might prefer $110 in 366 days over $100 in 365 days (low discount rate for distant delay).
          *   This leads to procrastination, undersaving, and addiction ("I'll quit tomorrow").
      *   **Controversy:** Less about core *ethical justification* and more about:
          *   **Descriptive Accuracy:** Does it truly capture the cognitive mechanisms?
          *   **Rationality Challenge:** It violates the standard economic assumption of "exponential discounting" and consistent time preferences.
          *   **Policy Implications:** Should policy "nudge" or "correct" these biases (e.g., automatic enrollment in retirement plans)?

  **Comparison: Are They the Same?**

  | Feature         | Pure Time Preference (PTP)        | Hyperbolic Discounting (HD)        |
  | :-------------- | :-------------------------------- | :--------------------------------- |
  | **Level**       | **Societal/Intergenerational**    | **Individual/Intrapersonal**       |
  | **Focus**       | Value of future *generations'* well-being | Value of *own* future rewards/utility |
  | **Nature**      | **Normative/Ethical** (Should we?) | **Descriptive/Behavioral** (Do we?) |
  | **Core Reason** | (Disputed) Philosophical stance on time | Cognitive bias, impulsivity, self-control failure |
  | **Discount Form**| Typically **Constant Exponential** (r) | **Decreasing Rate (Hyperbolic)** (k/(1+kD)) |
  | **Key Problem** | **Ethical Justification** (Is it fair?) | **Time Inconsistency** (Self-sabotage) |
  | **Example**     | Valuing climate damage to 2124 less than damage today *just because it's later* | Choosing to watch TV tonight instead of studying, even though you *planned* to study. |

  **The Philosophical Controversy: Why PTP is Shakier**

  1.  **The Discrimination Argument:** PTP explicitly devalues the well-being of individuals based *only* on when they are born. Philosophers argue this is analogous to discrimination based on race, gender, or location – morally arbitrary characteristics. Discounting for *risk* (e.g., extinction) or *expected higher wealth* (opportunity cost) is different; it doesn't devalue the *person*, it accounts for uncertainty or growth potential. HD describes a *cognitive flaw* within an individual, not a societal decision to devalue a class of people.
  2.  **The Parfitian "Non-Identity Problem":** Derek Parfit highlighted that different climate policies create different future populations (different people are born). PTP becomes even more problematic because we aren't just discounting *the same* future people's well-being; we're potentially choosing policies that determine *which* future people exist and *how well-off* they are. Assigning lower weight just because they are future beings seems arbitrary.
  3.  **Practical Impact:** The choice of PTP rate has *massive* implications for climate policy. A high PTP (e.g., 5%) makes severe future damages seem trivial today, justifying weak action. A near-zero PTP (Stern) makes those damages appear very costly now, demanding strong immediate action. The ethical stakes of choosing the PTP rate are enormous. HD's controversy is more about modeling individual behavior and designing effective nudges.
  4.  **Lack of Foundational Justification:** While proponents offer justifications (impatience, uncertainty), critics argue none withstands rigorous ethical scrutiny as a reason to intrinsically value future lives less. HD, conversely, is well-supported empirically as a description of common, if flawed, human behavior.

  **Conclusion:**

  Pure Time Preference (PTP) and Hyperbolic Discounting (HD) are **distinct concepts.** PTP is an **ethical stance** about **intergenerational justice**, controversially arguing that future people's well-being intrinsically matters less. HD is a **behavioral observation** of **individual decision-making**, revealing a time-inconsistent cognitive bias causing self-control problems.

  **PTP is the more philosophically shaky and controversial idea.** Its core assertion – that the well-being of a future person is inherently less valuable than that of a present person *solely* because they exist later in time – faces powerful ethical objections that it constitutes unjust discrimination based on temporal location. The choice of PTP rate has profound, potentially catastrophic, consequences for long-term policy like climate action. HD, while descriptively challenging for rational choice models and practically important for designing interventions, describes a common psychological phenomenon without making the same foundational ethical claim about the *inherent worth* of future beings. It's a bug in human cognition, not a (disputed) feature of ethical theory.
