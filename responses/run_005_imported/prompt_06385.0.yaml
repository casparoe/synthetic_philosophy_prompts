  First, I need to recall Leibniz's core arguments from the New Essays. His key points are: innate rational principles, intelligible extension, and unconscious perception. He believed geometric properties are grasped by intellect, not senses, so a newly sighted person should recognize shapes through reason. This contrasts with Locke's empiricism and Berkeley's radical sensory heterogeneity.

