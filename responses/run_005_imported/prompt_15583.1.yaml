answer: |-
  ## The Unblinking Eye: Anscombe's Absolutism Against the Firestorm

  Elizabeth Anscombe's 1956 pamphlet "Mr Truman's Degree" is not merely a historical protest against a wartime president. It is a stark, unflinching declaration of moral absolutism that cuts through the fog of consequentialist justifications like a laser. Her core argument, prefiguring her devastating critique of consequentialism in "Modern Moral Philosophy," is breathtakingly simple and terrifyingly absolute: **Deliberately killing innocent non-combatants as a means to an end is murder, intrinsically evil, and cannot be justified by any appeal to consequences, however seemingly beneficial.** To honor Truman, who ordered the atomic bombings of Hiroshima and Nagasaki precisely as such a means, was to honor a mass murderer. Let's take this absolutism seriously as live philosophy, steelman the consequentialist counter-arguments, and see whose logic holds when pressed to the limit.

  ### Steelmanning Anscombe: The Architecture of Absolutism

  1.  **Intention is Paramount:** Drawing on Aquinas and the Doctrine of Double Effect (DDE), Anscombe posits that *what you intend* morally defines the act. Dropping the bomb *intended* to kill civilians (workers, families, children) to break Japan's will or force surrender uses their deaths as a *means*. This is categorically distinct from foreseeing but not intending civilian deaths while targeting a legitimate military objective (e.g., bombing a munitions factory knowing nearby homes might be hit). The former is murder; the latter, while tragic, may be permissible under DDE's strict conditions.
  2.  **The Corrupting Logic of Consequences:** Anscombe argues that justifying murder by good consequences inevitably corrupts moral reasoning. Once we accept "the ends justify the means" in extreme cases, the threshold for "extreme" becomes malleable. Who defines the "greater good"? How many lives saved outweigh a thousand innocent deaths? Ten thousand? A million? This calculus, she insists, dissolves fixed moral boundaries, paving the way for ever-greater atrocities rationalized by ever-shifting notions of necessity.
  3.  **The Sanctity of the Innocent:** Innocent non-combatants possess an inviolable moral status. Using them instrumentally, as pawns or leverage, fundamentally violates their inherent dignity and reduces them to objects. This violation is an intrinsic evil, a wrong done *to them* regardless of the wider outcome. A world where this violation is normalized, even in "supreme emergencies," is a morally impoverished and dangerous world.
  4.  **Moral Coherence Demands Absolutes:** For morality to have any real meaning, it must contain absolute prohibitions. Prohibitions against intentionally killing the innocent are foundational. If these can be overridden by consequentialist calculations, morality becomes mere pragmatics, contingent on outcomes we can never fully predict or control. Anscombe demands a moral framework that stands firm even – *especially* – when the abyss stares back.

  ### Steelmanning the Consequentialist Reply: Facing the Abyss

  1.  **Supreme Emergency Exists:** Philosophers like Michael Walzer argue that true "supreme emergencies" – moments where a political community faces imminent, catastrophic destruction threatening its very existence and the values it embodies – create a tragic moral necessity. Facing a fanatical, suicidal regime like Imperial Japan in mid-1945, which had already demonstrated horrific brutality and was mobilizing its entire population for a fight to the death (e.g., Ketsu-Go plan), constituted such an emergency. The alternative wasn't just defeat, but potentially the annihilation of the concept of humane civilization itself.
  2.  **The Calculus of Horror:** The projected casualties for Operation Downfall (the invasion of Japan) were staggering. Estimates ranged from hundreds of thousands to *millions* of Allied casualties, and *tens of millions* of Japanese casualties (military and civilian), dwarfing the toll of Hiroshima and Nagasaki. Starvation, disease, and prolonged conventional bombing would have continued daily. The bombs, however horrific, offered a swift, decisive end. Paul Fussell's visceral "Thank God for the Atom Bomb" embodies the soldier's perspective: for those slated to die on the beaches, the bomb was salvation. It saved lives *overall*, ending the war faster than any alternative.
  3.  **The Intentionality Trap is Misplaced:** Consequentialists argue Anscombe focuses too narrowly on the *micro*-intention of killing civilians. The broader, overriding *macro*-intention was to end the war swiftly and save lives overall. While civilian deaths were a foreseen and necessary part of the mechanism, they were not the *ultimate objective*, which was surrender. The primary means were the demonstration of overwhelming destructive power and the threat of more, not the corpses themselves. This satisfies a broader interpretation of DDE or challenges Anscombe's strict reading as unrealistic in total war.
  4.  **Moral Bankruptcy of Inaction:** Refusing to use available means to end the war swiftly, knowing the horrific cost of delay, becomes itself a morally culpable act. It prioritizes abstract principle (non-targeting of civilians) over the concrete, massive, ongoing suffering of millions – soldiers and civilians, Allied and Japanese. This, consequentialists argue, is a perverse form of moral purity achieved through others' suffering.

  ### The Collision: Who Stands Firm?

  The consequentialist arguments are powerful, born of genuine horror and the weight of projected suffering. They force us to confront the unbearable choices leaders sometimes face. **Yet, Anscombe's absolutism ultimately proves more philosophically robust and morally necessary.**

  1.  **The Slippery Slope is Real:** Consequentialism's fatal flaw is its lack of a non-arbitrary stopping point. If Hiroshima/Nagasaki are justified by the "supreme emergency" of avoiding invasion, what about Dresden? Tokyo firebombing? The deliberate targeting of civilians to break morale in lesser conflicts? Once the line is crossed based on consequences, the line vanishes. The 20th century is littered with atrocities justified by "necessity" and "greater good." Anscombe's line – *never intentionally kill innocents as a means* – is bright, clear, and defensible. It prevents normalization.
  2.  **Intentionality Matters Crucially:** The consequentialist attempt to split "macro" and "micro" intention is sophistry. Truman and his advisors *knew* the bombs would annihilate cities filled with non-combatants. They *chose* those targets precisely *because* destroying them (and their inhabitants) would deliver the maximum psychological shock to force surrender. The civilians' deaths were not a regrettable side-effect of hitting a military base; they were the *direct, intended mechanism* of the policy. This is the essence of using them as a means. Redefining the "intention" as "ending the war" doesn't erase the chosen *method* of achieving it.
  3.  **The "Numbers Game" Degrades Morality:** Basing justification on casualty projections (notoriously uncertain, as Downfall estimates varied wildly) reduces human life to arithmetic. It implies some lives (the victims of the bomb) are expendable to save others. Anscombe insists each innocent life possesses inherent, equal, and inviolable value. Sacrificing some to save others treats them as mere resources, violating fundamental justice. The soldier's perspective (Fussell) is understandable but doesn't change the moral status of the act; saving one group by murdering another group of innocents remains murder.
  4.  **Supreme Emergency Doesn't Dissolve Prohibitions:** Even accepting the "supreme emergency" concept, it doesn't follow that *any* means become permissible. Walzer himself struggles with this, suggesting such acts leave a "moral stain." Anscombe would argue that certain acts remain intrinsically evil *even in emergencies*. Murdering the innocent is such an act. Facing catastrophe may force tragic choices, but it doesn't transform murder into a morally neutral or positive act. The moral horror of Hiroshima remains, regardless of the context. The alternative isn't necessarily "inaction," but exhausting *all* other avenues that don't involve intentional mass murder of innocents (e.g., demonstrating the bomb on an unpopulated area, awaiting Soviet declaration of war, continuing blockade/conventional bombing while exploring negotiated surrender).

  ### Conclusion: The Unblinking Eye Sees True

  The consequentialist arguments appeal to our visceral fear of catastrophe and our desperate desire to mitigate suffering. They represent the agonized cry of pragmatism in the face of the abyss. **But Anscombe wins.** Her victory is not one of comfort, but of uncompromising moral clarity.

  To accept Truman's act as justified, even tragically, is to accept that under sufficient pressure, the deliberate mass murder of innocents becomes a legitimate tool of statecraft. It erodes the foundational prohibition that protects *all* non-combatants in *all* conflicts, however "lesser." It makes morality hostage to constantly shifting calculations of utility and fear. Anscombe's absolutism, while brutally demanding, preserves the core of morality: the unconditional prohibition against using human beings as mere instruments. It forces us to confront the true horror of certain acts, unsoftened by appeals to necessity.

  Hiroshima and Nagasaki were not a tragic necessity; they were a profound moral catastrophe. Truman, by Anscombe's unblinking standard, was indeed a mass murderer. Honoring him was an act of moral blindness. Her argument survives contact with the firestorm not because it offers an easy answer, but because it refuses to look away from the absolute evil at the heart of the act. In a world perpetually tempted by the logic of "lesser evils," Anscombe's voice remains a vital, unsettling, and essential reminder: **Some doors, once opened, can never be closed. Some lines must never be crossed, lest we lose what makes us human in the very act of trying to survive.** The prohibition against intentionally murdering the innocent is that line. It stands.
