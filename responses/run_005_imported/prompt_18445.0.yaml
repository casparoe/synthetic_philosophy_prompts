answer: |-
  ## The Toast: Where Reasons Meet Promises

  (A gentle tap on the glass)

  Family, friends, colleagues… and esteemed philosophers who might be wondering if this is a wedding or a symposium… thank you. It is my profound joy and slight terror to toast my brilliant niece and her wonderful partner as they embark on this grand adventure.

  As her uncle – a physicist who stumbled into philosophy like a curious cat into a library – I’ve been thinking deeply about what it means to stand here. My niece, who dissects practical reasons with the precision she once reserved for taking apart my old oscilloscope, asked *me*. And my preparation kept circling back, inevitably, to a question philosophers wrestle with, but that every couple marrying *lives*: the question of vows.

  Specifically, to a distinction made by Bernard Williams – internal reasons and external reasons. Bear with me, family, I promise this ends in love, not jargon! An *internal* reason springs from our own desires, our motivations, what *moves* us from within. "I want to be with you forever, so I *will*." It’s the heart’s compelling argument. An *external* reason, however, exists outside our current desires. It’s an obligation, a rule, a promise made, that might command us *even when* the internal desire flickers or changes. "I *said* I would, so I *must*."

  **(Pause, look at the couple)**

  And here you stand, at the beautiful, terrifying intersection of these two worlds. You say “I will.” Is that a declaration of a current, overwhelming internal desire – a reason burning so brightly today that it projects itself infinitely into the future? Or is it the forging of an external reason – a promise that becomes a star to navigate by, a commitment that stands *apart* from the shifting sands of feeling, demanding fidelity *because it was given*?

  **(Smile gently at the philosophers)**

  To my niece’s department: please don’t worry. I haven’t flattened the distinction. I feel its weight profoundly today. Because a wedding vow sits squarely, almost precariously, on top of this very tension. It’s born in the furnace of internal desire – that fierce, undeniable "Yes!" you feel right now. But it aspires to become something external – a structure built to weather storms the heart alone might not foresee.

  **(Turn back to the couple and the family)**

  Family, this isn’t some abstract puzzle. This is the raw material of a life built together. The romantic in us, the part that wants the perfect, neat wedding toast, might wish this tension resolved. That desire *always* perfectly aligns with duty. That the "I want to" and the "I said I would" are forever identical.

  But life isn’t that neat, is it? There will be days – perhaps many days – when the internal desire flows like a river, making the promise effortless. And there *might* be days… moments… when the current feels slow, when weariness or doubt or simply the complexity of life makes the *desire* feel distant. It’s human. It’s real.

  **(Lean in slightly)**

  The breathtaking courage of your vow today isn't that you promise perpetual, unchanging desire. It’s that you stand here, eyes wide open to this very human tension, and you *choose* to build something that encompasses *both*. You plant the flag of your internal "Yes!" firmly in this moment. **And** you forge the external promise – the "I will" – as a covenant. You create a reason that *transcends* the moment, a reason that says, "Even when the *why* feels complex, the *what* remains: I am here. I chose you. I choose you still."

  You aren’t ignoring the distinction; you are building your marriage *within* it. You are saying your desire is the foundation, the fire that starts it all. But your promise is the architecture, the walls and the roof you commit to maintaining, *especially* when the wind blows cold.

  **(Raise glass)**

  So, my brilliant niece and your remarkable partner: Today, we celebrate the glorious internal fire that brought you here. And we honor the profound external promise you make – a promise that doesn’t erase the complexity, but commits you to navigate it, together, with wisdom, grace, and enduring love.

  May your desires remain strong. May your promise hold firm. And may your life together be a testament to the beautiful, necessary, and utterly human dance between the reasons of the heart and the reasons of the vow.

  To the couple! To love, in all its complex, binding, magnificent glory!
