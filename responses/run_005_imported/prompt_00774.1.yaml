answer: |-
  ## The Unmasking of Fragility: Why Finks and Masks Sink the Simple Conditional Analysis (But Not Necessarily Dispositional Realism)

  The simple conditional analysis (SCA) of dispositions – defining "x is fragile" as "x would break if struck" – possesses an elegant appeal. It promises to reduce seemingly mysterious dispositional properties to straightforward counterfactual conditionals grounded in actual events. However, the seemingly devastating counterexamples of finks and masks expose fatal flaws in this simplicity, demonstrating that the SCA cannot adequately capture the nature of dispositions. While sophisticated revisions like David Lewis's offer significant improvements, they ultimately struggle to fully reconcile the core intuition behind dispositions with the complexities revealed by masks. This suggests that while finks and masks sink the *simple* analysis for good, and cast serious doubt on *any* purely conditional reduction, they do not compel us to abandon dispositional realism; instead, they point towards dispositions being genuine, potentially irreducible, properties of things.

  **The Devastating Blows: Finks and Masks Exposed**

  Finks and masks attack the SCA from different angles, exploiting the gap between a thing's intrinsic nature and its actual counterfactual behavior under specific circumstances.

  1.  **Finks (The Disappearing Disposition):** Consider the "live" wire hooked to the electro-fink. According to the SCA, for the wire to be "live" (disposed to shock when touched), it *must* be true that "if touched, it would shock." Yet, the electro-fink ensures that the instant before contact, the current is cut. The conditional "if touched, it would shock" is false – no shock occurs. However, intuitively, the wire *is* live right up until the moment the fink activates; its shocking power is a real, present property. The fink reveals the SCA's vulnerability to *changes in the disposition itself* precisely at the moment the test condition (C) is about to occur. The SCA wrongly concludes the wire wasn't live *before* the touch, simply because a fink *interfered* during the manifestation process. The disposition existed, but the conditional failed due to extrinsic, interfering mechanisms.

  2.  **Masks (The Prevented Manifestation):** The fragile glass wrapped in bubble wrap delivers the second blow. The SCA claims fragility means "if struck (sufficiently hard), it would break." But with the bubble wrap, even if struck very hard, it *wouldn't* break. Therefore, according to the SCA, the wrapped glass is *not fragile*. This contradicts our strong intuition: the glass itself hasn't changed; its inherent brittleness remains. The bubble wrap merely *masks* or *interferes* with the manifestation of that fragility without destroying the disposition itself. Masks show that the conditional can be false even while the disposition persists robustly. The SCA fails because it cannot distinguish between the *absence* of a disposition and the *presence* of a disposition whose manifestation is *prevented* by extrinsic factors.

  **Lewis's Patch: Intrinsic Bases and Ceteris Paribus**

  David Lewis recognized these threats and proposed a sophisticated revision. He argued that "x is disposed to M when C" means something like: "x has some intrinsic property B (the 'causal basis') such that, *if C were to happen and x were to retain B throughout the triggering situation*, then C would cause M." This addresses finks directly: the electro-fink prevents the wire from *retaining* its intrinsic live-ness (the current) during the touch, so the conditional (requiring retention of B) doesn't apply to the finked scenario. The intrinsic basis B *was* present beforehand.

  However, **masks remain a persistent thorn**. The bubble wrap doesn't change the glass's intrinsic brittle structure (B). The glass retains B throughout the striking. Yet, the conditional "if struck, it would break" is still false *because* of the extrinsic bubble wrap. Lewis's analysis, requiring only the retention of the intrinsic basis, would (correctly) affirm the glass *is* fragile. But the problem is that the *manifestation conditional itself* ("if struck, it would break") remains false in the masked scenario. While Lewis's analysis *identifies* the disposition correctly via the intrinsic basis, it doesn't make the original counterfactual conditional true. The mask shows that even with the intrinsic basis held fixed, *extrinsic* factors can prevent the manifestation. Lewis saves the *attribution* of the disposition but at the cost of divorcing it from the simple, observable counterfactual behavior the SCA originally relied upon. His analysis becomes a claim about hidden intrinsic structures guaranteeing a manifestation *only under highly idealized, interference-free conditions* – conditions rarely met in the actual world.

  **The Case for Primitive Dispositions: Beyond Conditionals**

  Given the enduring challenge of masks to even the best conditional analyses, a strong case emerges for considering dispositions as fundamental, irreducible properties. This view, dispositional primitivism, holds that fragility, solubility, etc., are real, categorical properties of objects, not *reducible* to counterfactuals or intrinsic structures alone, though they *ground* or *explain* such conditionals.

  1.  **Explanatory Power:** We constantly explain events and categorize objects using dispositions. We say the glass *broke because it was fragile*. The SCA reduction turns this into "it broke because if struck, it would break," which is circular. Primitive dispositions offer a genuine, non-circular explanatory basis: the breaking was caused by the *fragility itself* interacting with the striking. Similarly, the masked glass is fragile *because* it possesses this primitive property, even if masked.
  2.  **Capturing the Intuition:** Primitive dispositions directly capture the intuition that the glass in bubble wrap *is* fragile in a way that conditional analyses struggle with. The fragility is a persistent *state* of the glass, not merely a conditional fact about what *would* happen under (often unrealized) ideal conditions. The mask prevents the *effect* of the disposition, not the disposition itself.
  3.  **Handling Finks and Masks Elegantly:** For the finked wire, its disposition (liveness) is a real but transient property causally interrupted. For the masked glass, its fragility is a real property whose causal pathway to breaking is blocked by an external interferer. The ontology of dispositions remains intact; the problems arise from *extrinsic interference* in their operation, not from the dispositions not being real. This aligns with scientific practice – chemists posit solubility as a real property of salt, even if a particular sample is prevented from dissolving (e.g., encased in plastic).

  **Conclusion: SCA Sunk, Realism Afloat**

  Finks and masks definitively scuttle the *simple* conditional analysis of dispositions. They prove that a disposition cannot be straightforwardly identified with a single, unqualified counterfactual conditional about what *would* happen. Sophisticated revisions, like Lewis's, mitigate the damage, particularly against finks, by incorporating intrinsic bases and idealization. However, masks expose the deep problem: dispositions seem to be *intrinsic* properties whose *manifestation* can be thwarted by *extrinsic* circumstances. This persistent challenge to conditional reductionism provides strong justification for taking dispositions seriously as primitive, irreducible properties. While their manifestation depends on context and can be interfered with, dispositions themselves are best understood as fundamental causal powers inherent in objects, explaining *why* things *would* behave in certain ways *if* conditions were right, rather than being *defined* by those conditional behaviors. Finks and masks don't show dispositions aren't real; they show reality is more complex than the simple conditional analysis allowed, pointing us towards a metaphysics where powers and potentialities are bedrock features of the world.
