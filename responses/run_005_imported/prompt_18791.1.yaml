  The explanation for stochastic dominance is also correct: since the outcomes are ranked and the weighting depends only on the rank and the cumulative probabilities, if one gamble stochastically dominates another, then at every rank the cumulative probability of at least that outcome is at least as high in the dominating gamble, and because r is increasing, the REU will be higher.

