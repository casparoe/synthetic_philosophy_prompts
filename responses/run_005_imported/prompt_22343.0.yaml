  First, I need to recall why Kant sees a gap between pure practical reason and empirical actions. The moral law is supersensible and formal, while actions exist in the sensible world governed by natural causality. Applying a freedom-law to nature-bound actions seems absurd because they belong to different realms. This parallels the schema problem in the first Critique where categories need mediation to apply to intuitions, but here it's harder since moral law can't have schemata at all. 

  For the second question about "type" vs "schema": Schemata (from theoretical reason) are procedures for making concepts sensible, while the typic is a law of nature serving as an analogical model. Kant isn't saying we literally test against physical laws but uses nature's lawfulness as a structural mirror for moral lawfulness. The key is whether we can conceive our maxim as functioning like a law in a hypothetical nature-system. This seems constitutive for judgment because without this bridge, we'd have no way to render the moral law applicable.

  Third, comparing this to the Groundwork: The Groundwork's "law of nature" formula primarily establishes what the moral law demands (universalizability), while the Typic addresses how we apply it through judgment. The Groundwork focuses on formulation; the second Critique on implementation. So the friend has a point—this is about closing the application gap Kant later realized needed solving.

