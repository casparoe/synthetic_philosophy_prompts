prompt: |-
  In my seminar on moral psychology this term, we've been contrasting two rival accounts of moral worth that both reject Kant's requirement that a right action must be done specifically "from duty" in order to be praiseworthy. On Julia Markovits' view, an action has moral worth just when the agent is motivated by the very considerations that in fact make the action right, whether or not she conceives of these as moral considerations at all. On Nomy Arpaly's view, by contrast, moral worth requires only that the agent's motivating desire be appropriately responsive to the action's right-making features, even if the agent explicitly disavows the correct moral verdict about her own conduct—as, Arpaly argues, is true of Huckleberry Finn, who helps Jim escape despite consciously believing this to be wrong. Since we've already spent a full session discussing that case, could you devise a different example of an action that would count as morally worthy on one of these views but not on the other, and briefly explain what exactly generates the divergence between them?
reasoning: |-
  Okay, the user is asking for help with a moral psychology seminar. They're contrasting two views on moral worth: Julia Markovits' and Nomy Arpaly's. Both reject Kant's idea that an action must be done "from duty" to be praiseworthy. The user wants a new example that shows how an action could be morally worthy on one view but not the other, since they've already discussed Huckleberry Finn.

  First, I need to recall the key differences between Markovits and Arpaly. Markovits requires that the agent is motivated by the actual right-making reasons, even if they don't see them as moral. Arpaly focuses on responsiveness to right-making features, even if the agent consciously believes the action is wrong. 

  The challenge is to find an example that fits one view but not the other. Huck Finn is Arpaly's classic case: he helps Jim despite thinking it's wrong. For Markovits, he might not qualify because his motivation isn't explicitly tied to the right-making reasons (justice, equality). 

  I should create a new scenario. Let's consider an environmental activist. Suppose someone recycles solely because they like the satisfying sound of cans crunching. If recycling is right because it reduces waste, Markovits would say this lacks moral worth because the motivation isn't the right-making reason. Arpaly might still see worth if the action aligns with right-making features, regardless of the motive. 

  Wait, but that might not clearly split the views. Need something where the agent's motivation is responsive but not based on right-making reasons. How about a doctor who treats patients in a disaster zone? The doctor does it because they enjoy the adrenaline rush of high-pressure situations, not because of the moral duty to save lives. 

  Markovits would say no moral worth since the motivation (adrenaline) isn't the right-making reason (saving lives). Arpaly might say yes if the action is responsive to the right-making features, even if the motive isn't moral. But is the doctor's action responsive? The desire for adrenaline leads them to be where they're needed, so arguably responsive. 

  But maybe I need a case where the agent is motivated by right-making reasons but doesn't recognize them as moral. Let's try a whistleblower. Suppose someone exposes corporate fraud because they hate dishonesty but think morality is nonsense. They see their motive as personal integrity, not moral. 

  For Markovits, this has moral worth because they're motivated by the right-making reason (preventing fraud/harm), even if they don't label it as moral. Arpaly might also agree since they're responsive to the right features. But where's the divergence? 

  Ah, the key is when the agent consciously rejects the moral verdict. Like Huck Finn. So for a divergent case, I need someone motivated by right-making reasons but unaware they're moral, versus someone responsive but believing the action is wrong. 

  Back to the whistleblower: if they think exposing fraud is morally wrong but still do it because they can't stand dishonesty, that would align with Arpaly but not Markovits. Markovits requires motivation by the right-making reasons. If the whistleblower believes it's wrong, their motivation (hating dishonesty) might not align with what they think are the right reasons. 

  Let me construct the example: A whistleblower exposes wrongdoing because they have a deep aversion to deception. But they believe that loyalty to the company is the highest moral duty, so they think exposing is wrong. 

  Arpaly: The action is responsive to the right-making features (preventing harm), so it has moral worth. 

  Markovits: The agent isn't motivated by the right-making reasons because they don't recognize those reasons; instead, they're conflicted. Their motivation (aversion to deception) isn't connected to the actual right-making reasons in their mind. 

  That should work. The divergence comes from Markovits requiring the motivation to align with the right-making reasons, while Arpaly only requires responsiveness, even with moral disagreement. 

  Now, I need to make sure the example is clear and distinct from Huck Finn. The whistleblower is motivated by a factor that is a right-making reason but doesn't see it as moral, whereas Huck is motivated by sympathy but believes it's immoral. 

  Yes, this should illustrate the difference. Time to write it up concisely.
answer: |-
  Here's a novel example designed to highlight the divergence between Markovits' and Arpaly's views:

  ### The Case: The Reluctant Whistleblower
  **Agent:** Sam, a mid-level accountant at a large corporation.  
  **Action:** Sam leaks evidence of the company's deliberate tax fraud to regulators.  
  **Moral Context:** The fraud harms public welfare (the *right-making feature*).  
  **Sam's Psychology:**  
  - Sam discovers the fraud and feels intense personal disgust at the *dishonesty* itself ("I can't stand liars and cheats").  
  - However, Sam is a staunch moral relativist who consciously believes:  
    a) *No objective moral truth exists.*  
    b) *Loyalty to one's employer is the highest pragmatic virtue in business.*  
    c) *Leaking information is therefore morally wrong* (violating loyalty) *and irrational* (risking their career).  
  Despite this, Sam leaks the data *solely* because their visceral hatred of deception overwhelms their pragmatic loyalty.  

  ---

  ### Divergence in Moral Worth Assessment  
  1. **Arpaly's View: MORALLY WORTHY**  
     - Sam's motivating desire (aversion to deception) is **appropriately responsive** to the actual right-making feature of the action (preventing harm caused by fraud).  
     - Sam's *conscious moral belief* ("leaking is wrong") is irrelevant; what matters is that their desire tracks the *objective moral reasons* (exposing harm).  
     - *Analogy to Huck Finn:* Like Huck helping Jim despite believing it's wrong, Sam acts from a desire aligned with the right-making feature, even while disavowing the moral verdict.  

  2. **Markovits' View: NOT MORALLY WORTHY**  
     - Sam is **not motivated by the considerations that make the action right**. The right-making feature is *preventing public harm*, but Sam is motivated *only* by a personal aversion to deception.  
     - Sam sees their motive as a non-moral psychological quirk ("I hate cheats"), not as a recognition of the moral reason (upholding public welfare).  
     - Crucially, Sam *denies* that preventing harm is a moral consideration at all (due to relativism). Thus, they fail to act "for the right reasons" *as moral reasons*, even implicitly.  

  ---

  ### Key Source of Divergence  
  The disagreement stems from **whether moral worth requires the agent to *represent* the right-making features *as normative reasons_** (Markovits) versus whether it merely requires **motivational responsiveness to those features** (Arpaly).  

  - **Markovits** demands that the agent’s motivation must *track the right-making features **as justifications***. Sam’s motivation (disgust at deception) doesn’t engage with the *moral justification* (preventing harm) – it treats the fraud as a *personal affront*, not a *public wrong*.  
  - **Arpaly** requires only that desires *reliably correlate* with right-making features. Sam’s desire (anti-deception) is contingently aligned with the right-making feature (harm prevention), so the action has moral worth *despite* Sam’s false moral beliefs.  

  This case isolates how Arpaly accepts "accidental" alignment of desires with moral truth, while Markovits requires the agent’s motivation to *embody* the moral rationale, even if not labeled "moral."
