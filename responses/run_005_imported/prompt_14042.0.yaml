answer: |-
  ## MEMORANDUM  
  **TO:** Student Government Elections Commission  
  **FROM:** [Your Name], Elections Commissioner  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation for Revised Presidential Election System  

  ### 1. Our Core Problem & Goal
  We consistently face **vote-splitting** in presidential elections, where a candidate preferred by a majority loses to a plurality winner due to multiple similar candidates. Our primary goal is to **ensure the winner has broader support** and reduce the "spoiler effect," while maintaining a practical, transparent, and trusted process for March.  

  ### 2. Evaluation of Proposed Systems
  All systems address vote-splitting better than plurality, but have trade-offs in strategy, simplicity, and fairness:  

  *   **Ranked-Choice Voting (RCV - Instant Runoff)**  
      *   **Strengths:** Eliminates vote-splitting instantly; ensures winner has majority support after eliminations; widely adopted (NYC, Maine, Australia); reflects voter preferences beyond 1st choice.  
      *   **Weaknesses:** Complex tallying; "Donkey voting" (random ranking) is possible; *Theoretical strategic vulnerability:* Gibbard-Satterthwaite confirms *no* ranked system is immune to strategy (e.g., burying a strong opponent). However, **empirical evidence suggests strategic voting is rare and often backfires** in real-world RCV elections.  

  *   **Borda Count (Ranked Points)**  
      *   **Strengths:** Values all rankings; mathematically simple tally.  
      *   **Weaknesses:** **Highly vulnerable to strategy** (e.g., ranking weak candidates highest to hurt rivals); encourages "clone" candidates; winner often lacks majority 1st-choice support; rarely used in major elections due to manipulability. Not optimal for our "strongest majority support" goal.  

  *   **Top-Two Runoff**  
      *   **Strengths:** Simple concept; guarantees majority support in final round; reduces vote-splitting.  
      *   **Weaknesses:** Requires two separate elections (cost/logistics); lower turnout in runoff; limits choice to two finalists, potentially excluding consensus candidates.  

  *   *(Regarding Approval/Non-Ranked Systems):* Gibbard-Satterthwaite *does* apply to any deterministic voting system choosing a single winner with ≥3 options, including Approval. While Approval has strengths (simplicity), it introduces different strategic considerations (e.g., "bullet voting" vs. "hedging") and wasn't a primary commission proposal.  

  ### 3. Recommendation: Ranked-Choice Voting (Instant Runoff)
  **We recommend adopting RCV for the Student Body President election.**  

  *   **Why RCV?**  
      *   **Directly Solves Our Problem:** Guarantees a majority-supported winner in one election, eliminating vote-splitting and "spoilers" – our most urgent issue.  
      *   **Balances Fairness & Practicality:** While *no* system is perfectly strategy-proof (per Gibbard-Satterthwaite), RCV’s real-world performance shows **minimal successful strategy** and **maximizes voter expression** safely.  
      *   **Proven & Understood:** Used successfully in student governments, cities, and states. Voter education materials are readily available.  
      *   **Aligns with Commission Goals:** Most directly achieves the desired outcome of majority support while addressing the specific frustration voiced over years.  

  *   **Addressing Concerns:**  
      *   *"But what about strategy?"* Acknowledged! However, the risk is low in our context (high-information peers, clear frontrunners), and the *benefit* of eliminating vote-splitting far outweighs this theoretical concern. RCV makes sincere voting the overwhelmingly best strategy for most voters.  
      *   *"Is it too complex?"* Modern ballot-counting software (or even manual counts for our scale) handles this efficiently. Clear voter instructions (e.g., "Rank your favorites: 1, 2, 3...") mitigate confusion.  

  ### 4. Implementation Plan for March
  1.  **Ballot Design:** Simple column-style rankings.  
  2.  **Voter Education:**  
      *   Launch "Rank Your Vote" campaign: Infographics, short videos, mock election.  
      *   Emphasize: "Rank candidates in order of TRUE preference. Your vote counts!"  
  3.  **Tallying:** Designate a small committee (or use simple software) for quick, transparent counting after polls close.  
  4.  **Pilot:** Use RCV *only* for President this cycle to ensure smooth adoption.  

  ### 5. Why Not the Others?
  *   **Borda:** Too easily manipulated; doesn't ensure majority support; lacks real-world validation for fairness.  
  *   **Top-Two:** Logistically heavier (2nd election); risks lower runoff turnout; delays results. A good backup, but RCV is more efficient.  

  ### 6. Conclusion
  No voting system is a utopian solution to strategy, but **Ranked-Choice Voting (Instant Runoff) is the most effective, practical, and proven method to achieve our core objective: electing a Student Body President with majority support in a single election, finally ending vote-splitting.** It empowers voters to express their true preferences without fear of wasting their vote. Let's move forward with RCV for March and ensure our president truly represents the will of the student body.  

  **Recommended Motion:** *"Move to adopt Ranked-Choice Voting (Instant Runoff) for the election of Student Body President, effective for the March election cycle."*  

  ---  
  **Key Talking Points for Discussion:**  
  *   Focus on solving *our specific, recurring problem* (vote-splitting).  
  *   Acknowledge Gibbard-Satterthwaite proves *no* ranked system is perfect, but emphasize **RCV minimizes the *practical impact* of strategy** compared to its benefits.  
  *   Highlight RCV’s real-world success and suitability for our scale.  
  *   Frame it as a significant, measurable upgrade from plurality.
