  First, the user's friend argues for maximizing the average payout, which is rational under uncertainty—everyone has an equal chance of any role. The user prefers maximizing the minimum payout (maximin), prioritizing the worst-case scenario. The user wonders if this is just risk aversion or if there's a principle behind it.

