prompt: |-
  I'm doing my econ phd, and completely unrelated to my research, a few friends and I are starting a small worker co-op and were arguing about how to set the pay rule before anyone's actually assigned a role. we've agreed some roles can pay more than others, but only if that still leaves the lowest-paid role better off than under a strict equal split (paying more for scarce skills can grow the pie enough that even the lowest-paid role gains). where we disagree is how to choose between versions of that rule when nobody yet knows who'll land which role: one friend says just pick whichever version gives the highest average payout across the group, since that's the rational bet if you might end up anywhere. i want to instead pick whichever version makes the worst-paid role as good as possible, even if that's not the highest-average option, because it feels reckless to optimize for the average when it might be my actual paycheck on the line. am i just being risk-averse, or is there a real principle behind my instinct?
