answer: |-
  Your instinct is **not just risk aversion**—it's grounded in sound economic and philosophical principles, particularly **John Rawls' "maximin" rule under the veil of ignorance**. Here’s why your approach has merit:

  ### 1. **The Rawlsian Veil of Ignorance**  
     Rawls argued that fair rules are chosen when people don’t know their future position ("veil of ignorance"). In this state, rational actors prioritize protecting the worst-off, because *you could be that person*. Your stance ("make the worst-paid role as good as possible") aligns perfectly with this. It’s a **justice-as-fairness** principle, not just risk avoidance.

  ### 2. **Risk Aversion ≠ Irrationality**  
     Your friend assumes risk-neutrality (optimizing average pay), but humans are typically risk-averse—especially when livelihoods are involved. If pay disparities could leave you struggling if you land the lowest role, prioritizing a robust safety net is rational. Economists model this via **diminishing marginal utility of wealth**: losing $1 hurts more if you’re poor than gaining $1 helps if you’re rich.

  ### 3. **Cooperative Stability**  
     Worker co-ops thrive on solidarity. A rule that ensures the lowest-paid role is viable long-term prevents resentment and turnover. If the worst role is unbearable, your co-op could fracture. Maximizing the floor (maximin) builds **resilience**, while average-maximizing might create a "lottery" where some members lose badly.

  ### 4. **Pareto Efficiency vs. Equality**  
     Your friend’s average-maximizing might grow the pie (Pareto improvement), but it could allow extreme inequality. Your maximin rule ensures any inequality **strictly benefits the least advantaged**—a stronger fairness criterion. Example:
     - **Option A:** Average pay = $100, lowest role = $60  
     - **Option B:** Average pay = $95, lowest role = $75  
     *Rawls would pick B; your friend picks A.*  
     If you end up in the lowest role, $75 > $60 is life-changing—even if the group sacrifices $5 on average.

  ### When Your Friend’s View *Might* Make Sense:
  - If roles are **frequently rotated** or skills are similar, optimizing average could work.  
  - If pay gaps are small, or the co-op has strong social insurance (e.g., shared profits cushioning low wages).

  ### Practical Suggestion: Hybridize Both Views
  1. **Set a floor**: Use maximin to ensure the worst role’s pay meets a livable threshold.  
  2. **Optimize above the floor**: Allow higher pay for scarce skills *only if* it demonstrably grows the pie (e.g., attracting a key engineer doubles revenue).  
  3. **Simulate scenarios**: Model pay under different rules using dummy role assignments. Show how maximin vs. average affects outcomes.  

  ### Key Economic Concepts Supporting You:
  - **Rawls’ Difference Principle**: Inequality is justified only if it benefits the least advantaged.  
  - **Knightian Uncertainty**: When probabilities of roles are unknown (not just risky), protecting against worst-case dominates.  
  - **Contract Theory**: Rules pre-commit the group to fairness, preventing ex-post exploitation.  

  **Bottom line**: Your instinct reflects a deeper principle—**prioritizing fairness and stability over aggregate efficiency**—which is defensible and common in cooperative economics. Don’t dismiss it as mere risk aversion. In a co-op, where mutual aid is core, maximin may better serve your collective long-term health.
