  Next, the user points out that this seems like a redefinition of sedition. That's a valid point. Aquinas is shifting the semantic ground. By defining tyranny as inherently seditious, resistance becomes defense of the common good. But the harm caveat adds a layer of prudence, not principle. 

  Then there's De Regimine Principum. Aquinas warns against private citizens acting because they might lack authority, competence, or cause worse chaos. This seems to conflict with the Summa, but actually, it's complementary. Summa addresses the principle (resisting tyranny isn't sedition), while De Regimine focuses on the practical execution (who and how). 

  So, the coherent doctrine: Resistance is permissible in principle but must be done properly. Public authority should handle it, not private individuals. The harm caveat in both texts emphasizes the importance of the common good. 

  The user might be trying to reconcile Aquinas's seemingly permissive stance with his cautious advice. They might need this for their article to show that Aquinas isn't advocating assassination but structured resistance. Also, they might be interested in how medieval thinkers balanced theory and practicality. 

