answer: |-
  ## Hotel Bar Dialogue: The Stopping Rule Standoff

  **Setting:** A muted hotel bar after a conference on the replication crisis. Soft jazz plays. DR. ARTHUR FINCH (Frequentist, late 60s, precise, slightly weary) nurses a neat scotch. DR. ELARA BAYES (Bayesian, mid-50s, intense, animated) sips a craft IPA. They recognize each other from the heated Q&A.

  **Finch:** (Nodding curtly) Dr. Bayes. That session... predictable. Everyone wants a single villain for the replication mess. Bad actors, p-hacking, yes. But they danced around the *real* schism. The one that makes honest researchers trip over their own feet.

  **Bayes:** (Leaning forward) Dr. Finch. Agreed. The core assumptions matter more than sloppy pipetting. Your tribe spent the whole session clutching your Type I error rates like life rafts, terrified a single unauthorized glance at the data would sink the ship. It’s paralyzing.

  **Finch:** It’s *necessary* rigor! The life raft, as you dismissively call it, keeps us from drowning in false positives. Take optional stopping. You think it’s harmless. But run a simulation: Flip a fair coin. Test H0: p(heads)=0.5. Stop when you hit p<0.05. What happens?

  **Bayes:** You hit it eventually. Almost surely. The false positive rate balloons far above 5%. I know your textbook example. But it’s a *procedural* critique, not an *evidential* one. It confuses the *plan* with the *evidence in hand*.

  **Finch:** Precisely! The *plan* defines the *error properties*! If you peek and stop early only when it looks good, you’ve rigged the procedure. The nominal p-value becomes meaningless. It no longer represents the probability of seeing such an extreme result *under the null hypothesis and the pre-defined stopping rule*. You’ve violated the very definition upon which its interpretation rests! Researchers *think* they have a 5% error rate, but it might be 20%, 30%... who knows? That’s the cost – **unquantifiable, uncontrolled error.** It erodes trust in the reported significance. *That’s* what feeds the replication crisis – results published with spuriously low p-values.

  **Bayes:** Arthur, the *evidence* is the sequence of coin flips you observed: say, T, H, H, H, H. Stopped at 5 flips because p<0.05. The *likelihood* of that specific sequence, under any hypothesis about p(heads), depends *only* on the data. Not on whether you planned 5 flips, 20 flips, or decided to stop because you saw a bird outside! The **Likelihood Principle** tells us that *all* the evidence is in that likelihood function. Your stopping rule – whether fixed-N, peek-and-stop, or triggered by a dream – is irrelevant to what the data *say*. The cost of *your* position is forcing researchers to **ignore relevant information** (the accumulating data) or **waste resources** (running pre-planned samples even when the result is blindingly obvious early, *or* when it's hopelessly noisy).

  **Finch:** "Irrelevant"? Only if you live in a Bayesian fantasy where priors magically solve everything! My "cost" is the price of **objective error control**. You want to peek? Fine. But then you *must* use methods that account for it – sequential testing with adjusted thresholds, spending functions. That *quantifies* the true error rate under the *actual* procedure used. Your "ignore the procedure" stance discards this objectivity. It pretends the *intent* behind the data collection doesn't shape the *interpretation*. What about publication bias? If labs peek, stop when significant, and *only publish those*, your posterior odds look great – but the overall literature is flooded with exaggerated effects! Your framework, naively applied, is **blind to selection effects** created by the *process*.

  **Bayes:** And your framework is **blind to the actual state of knowledge**! You fixate on hypothetical long-run error rates over non-existent repetitions of the *entire experimental procedure*. But the researcher has *this specific data set*, *now*. My posterior distribution tells me, given *this* data and *my* prior (which should be stated!), how probable different effect sizes are. If I see strong evidence early (high likelihood ratio), stopping is rational! The cost of *not* stopping is inefficiency. As for publication bias, that's a sociological problem, not a statistical one inherent to Bayesian updating *given the data you have*. We need better practices (pre-registration, reporting *all* results), not to shackle inference to arbitrary stopping rules. Your methods **confound evidence with decision protocol**.

  **Finch:** "Arbitrary"? The protocol defines the *meaning* of the statistic! Without it, your posterior is **contingent on subjective choices** – the prior and the likelihood model. Two Bayesians, same data, different priors (or different models for optional stopping!), get different posteriors. Where's the objectivity? My p-value, under a *strictly adhered-to protocol*, has a clear, objective frequentist interpretation. Your cost is **subjectivity masquerading as evidence**. Researchers peek, slap on a vaguely informative prior, get a nice-looking posterior, and call it "evidence" – oblivious that their stopping rule might have profoundly shaped *which* data they ended up with. It *looks* robust, but it’s fragile to the path taken.

  **Bayes:** And your objectivity is a **procedural illusion**! You achieve it only by ignoring *all* information external to the pre-specified protocol and the *current* null hypothesis. It’s rigid and impractical. Most real-world research *is* sequential and adaptive – new data informs the next step! Forcing a fixed-N straitjacket leads to either underpowered studies (if the effect is smaller than hoped) or ethical issues (continuing when harm or benefit is clear). My cost is embracing uncertainty in the prior; your cost is **ignoring the informational value of the data collection process itself**. The Bayesian approach naturally handles sequential analysis – the updating is coherent. Your approach requires complex, often opaque, corrections that most biologists don't understand or implement correctly, *leading to the very misapplications you fear*!

  *(A pause. They sip their drinks, the tension lingering but now tinged with mutual, grudging respect for the depth of the other's commitment.)*

  **Finch:** So, to our biologist friend listening in, haunted by all those times they peeked? From *my* perspective: **You should never have peeked without a pre-specified sequential analysis plan and adjusted your alpha spending accordingly.** If you didn't have that plan, every peek invalidated your subsequent frequentist inference. Your p-values were likely lies. You contributed to the noise. Fix your design next time, or use resampling/bootstrap methods *explicitly* designed for your actual stopping rule *after the fact* if you must, but acknowledge the inflation.

  **Bayes:** And from *my* perspective: **You *should* have peeked – but you should have done it *Bayesianly*.** Start with a defensible prior (even if skeptical), update your beliefs *honestly* with each new data point using Bayes' theorem, and stop when your posterior probability for the hypothesis of interest (or the Region of Practical Equivalence) reaches a pre-planned level of certainty, *or* when resources are exhausted. Crucially, **report your prior, your data, and your stopping rule transparently.** The cost of peeking isn't in the peeking itself; it's in pretending you were following a fixed-N frequentist protocol when you weren't, or in hiding your prior and stopping rule. Own your sequential process and analyze the evidence you have coherently.

  **(They raise their glasses slightly, a tacit acknowledgement of the impasse, then turn back to their drinks, the unresolved dispute hanging in the air alongside the jazz.)**
