answer: |-
  You've hit on one of the most fascinating and consequential metaphysical fault lines. Lewis's dismissal of adverbialism (or "indexed instantiation") as desperate or covert perdurantism is rhetorically powerful but ultimately unfair. Let me make the strongest possible case for adverbialism as a coherent, ontologically economical, and *distinct* alternative to both perdurantism and relationalism. I'll also wield the rotating disc problem as a potent counterattack.

  **The Core Case for Adverbialism: Solving the Contradiction Without Fragmentation or Reduction**

  1.  **Rejecting the "Simpliciter" Presupposition:** Lewis's entire problem rests on the assumption that intrinsic properties must be held *simpliciter* – absolutely and timelessly. But why must this be the case for *enduring* entities? For an entity that persists through time, *having a property* is fundamentally a *tensed* or *temporally situated* affair. Adverbialism argues that instantiation itself is inherently temporal. It's not that "bent" becomes relational ("bent-at-t1"), nor that the object fragments into parts. Instead, the *whole object* instantiates *bentness* **in a t1-ish manner** and *straightness* **in a t2-ish manner**. The "adverb" modifies the *how* of instantiation, not the property itself or the object's parts.
      *   **Analogy:** Consider "moves quickly." "Quickly" isn't a property of the mover independent of moving, nor is it a property of a part of the mover. It modifies *how* the moving happens. Similarly, "bent-ly-at-t1" modifies *how* the enduring object instantiates bentness – specifically, *when* it does so.

  2.  **Preserving True Wholeness and Avoiding Ontological Profligacy:** Perdurantism's "solution" comes at a massive cost: it denies that *you*, the whole person, are ever present at any time. What's present at t1 is merely a *temporal part* of you. Adverbialism, in contrast, genuinely maintains that the *entire you* is present at t1 *and* at t2. This aligns powerfully with phenomenology and common sense: when you sit, *you* (all of you) are bent; when you stand moments later, *you* (that same entire you) are straight. Adverbialism explains this *without* fragmenting you into instantaneous slices or reducing your intrinsic shape to a relation. It keeps the object whole and intrinsic properties genuine, but grounds their instantiation in time. This feels *cheaper* because it avoids multiplying entities (temporal parts) for *every persisting object* – a vast ontological inflation Lewis embraces but adverbialism rejects.

  3.  **Distinct from Perdurantism (No Smuggling):** Lewis charges adverbialism with smuggling in temporal parts. This is incorrect. Temporal parts theory says:
      *   At t1, temporal part P1 exists and is bent.
      *   At t2, temporal part P2 exists and is straight.
      *   "You" are the mereological sum P1 + P2 + ... + Pn.
      Adverbialism says:
      *   At t1, the *whole enduring object* O exists and instantiates bentness *t1-ly*.
      *   At t2, the *same whole enduring object* O exists and instantiates straightness *t2-ly*.
      The key difference is stark: perdurantism has distinct *entities* (P1, P2) bearing incompatible properties; adverbialism has one *entity* (O) bearing properties *in distinct temporal modes*. There are no temporal parts O is "composed of"; O is wholly present at each time, instantiating properties in a time-indexed way. The "indexing" is built into the instantiation relation, not the object's composition.

  4.  **Primitive, But Not Uniquely or Unreasonably So:** Lewis dismisses the time-indexed instantiation as a "mysterious primitive." But *every* fundamental theory needs primitives.
      *   Perdurantism primitively assumes **temporal parthood** and the existence of instantaneous (or arbitrarily short-lived) objects as parts of persisting wholes. This is a significant ontological commitment.
      *   Relationalism primitively assumes that seemingly intrinsic properties like shape are actually **relations to times**. This fundamentally alters the *nature* of the property.
      *   Adverbialism primitively assumes that **instantiation has a temporal mode**. It adds complexity to *how* properties are held, but preserves the *object* as whole and the *property* as intrinsic.
      Is "temporal instantiation mode" any *more* mysterious than "temporal parthood"? Arguably less so, as it doesn't require us to believe that the chair you're sitting on *right now* is only a tiny, instantaneous fragment of a larger 4D worm, and that the "real" chair is something you never directly experience.

  **The Rotating Homogeneous Disc: Perdurantism's Achilles' Heel**

  This is where adverbialism gains significant traction. Imagine a perfectly homogeneous disc (no markings, uniform color/density) rotating uniformly in empty space.

  *   **The Problem for Perdurantism:** If the disc is just a sum of temporal parts (disc-slices), what grounds the fact that it is *rotating* rather than *static*? Each instantaneous temporal part is intrinsically identical to the next (homogeneous!). The spatial arrangement of matter within each slice is identical. Perdurantism, focusing *only* on the intrinsic properties of each temporal part, cannot distinguish between:
      1.  A disc rotating.
      2.  A disc sitting still.
      3.  A disc instantaneously replaced at each moment by a qualitatively identical but numerically distinct disc in a slightly different orientation.
      All three scenarios have identical temporal parts with identical intrinsic properties arranged in the same spatial pattern within each slice. The *only* difference between rotation and non-rotation lies in the *relationship* between the states at different times – the *change* in orientation.

  *   **Perdurantism's Desperate Moves:** To ground rotation, the perdurantist *must* appeal to something beyond the intrinsic properties of temporal parts:
      *   **Vector Properties:** They might posit intrinsic *velocities* or *momentums* as fundamental properties of temporal parts. But this is highly suspect – velocity is inherently *differential*, involving change *over* time. Attributing it to an instantaneous part seems contradictory. It's arguably *more* mysterious than adverbial instantiation.
      *   **Primitive Relations:** They might posit irreducible *transition relations* or *laws of temporal development* between temporal parts. This adds a layer of primitive structure *between* the parts.
      *   **Privileged Direction/Flow:** They might implicitly rely on a metaphysically privileged direction of time or temporal flow to order the parts and define "rotation." This contradicts the static, "block universe" picture perdurantism often inhabits and is itself a major primitive commitment.
      **In short, to solve the rotation problem, perdurantism must either:**
      *   **Smuggle in change/difference-over-time** as an intrinsic property of an instantaneous entity (velocity), which seems incoherent, or
      *   **Smuggle in irreducible temporal relations/transitions**, adding complexity beyond just temporal parts.

  *   **Adverbialism's Clean Solution:** The endurantist adverbialist has a straightforward account:
      *   The *whole disc* exists at t1 and instantiates orientation O1 *t1-ly*.
      *   The *same whole disc* exists at t2 and instantiates orientation O2 *t2-ly*.
      *   The fact that O2 is related to O1 by rotation (rather than being random, or identical, or reversed) is grounded in the *diachronic nature of the object itself* and the *temporal profile of its property instantiations*. The disc *persists* and *changes* its orientation over time. The rotation *is* this pattern of time-indexed property instantiation by the enduring whole. No appeal to mysterious instantaneous velocities or primitive inter-part relations is needed. The change is built into the way the enduring object holds its properties at different times.

  **Conclusion: Adverbialism's Defensible Economy**

  Lewis is too quick. Adverbialism isn't a desperate dodge; it's a coherent metaphysical stance that:

  1.  **Solves the Contradiction:** By making instantiation inherently temporal ("t-ly").
  2.  **Preserves Wholeness:** The *entire* object is present at each moment it exists. You *really* sat on the whole chair, touched the whole apple, *are* wholly here now.
  3.  **Maintains Intrinsicality:** Shape remains intrinsic, not reduced to a relation. It's *how* the object instantiates it that's time-indexed.
  4.  **Avoids Fragmentation:** No commitment to the vast ontology of temporal parts.
  5.  **Handles Rotation Naturally:** Explains change and motion without needing incoherent instantaneous velocities or primitive inter-part relations, leveraging the diachronic nature of the enduring object itself.
  6.  **Uses a Reasonable Primitive:** Temporalized instantiation is no more (and arguably less) mysterious than temporal parthood or the relationalization of intrinsics. Its "mystery" stems from the inherent difficulty of persistence and change, not ad-hocness.

  The cost of perdurantism – that nothing you've ever interacted with was wholly present, that you are merely a slice of a worm, that rotation requires either mysterious velocities or primitive transitions – is far greater than the cost of adverbialism's single primitive: that objects instantiate their properties *in time*. Adverbialism offers a genuinely endurantist, non-fragmented, and ontologically cheaper solution to temporary intrinsics, and the rotating disc exposes the hidden complexities perdurantism must embrace. It deserves serious consideration, not dismissal. The worm theorists may have elegant diagrams, but the adverbialists have the whole chair.
