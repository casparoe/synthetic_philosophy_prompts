  I should break down why the dust specks problem challenges aggregation. Key points include the non-linear nature of harm, the threshold effect, and the psychological difference between distributed minor harms and concentrated extreme suffering. For radiation, this translates to whether summing negligible individual risks (like 0.000001% increased cancer risk) can be equated to actual cancer deaths.

