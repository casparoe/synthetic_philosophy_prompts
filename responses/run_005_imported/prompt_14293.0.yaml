  First, I need to recall the torture vs. dust specks scenario. The original thought experiment by Eliezer Yudkowsky presents a choice: torture one person for 50 years or let 3^^^3 people each get a tiny dust speck in their eye. The vast majority would choose the dust specks, but the aggregate harm—each person's minor annoyance multiplied by a huge number—could theoretically exceed the torture. This highlights issues in aggregating disutility.

