     This example is simple enough for a problem set.
answer: |-
  Below is a complete two-person bargaining problem where the Kalai-Smorodinsky (KS) and Nash solutions yield different outcomes. I'll define the feasible utility set explicitly, compute both solutions step by step, and provide an intuitive fairness comparison. This example is simple enough for a problem set.

  ---

  ### **Bargaining Problem Setup**
  - **Disagreement point**: \(d = (0, 0)\) (if no agreement is reached, both get 0).  
  - **Feasible utility set \(S\)**: The convex hull of the points \((0, 0)\), \((1, 0)\), \((0, 1)\), and \((0.4, 0.8)\).  
    - \(S\) can be described as:  
      \[
      S = \left\{ (u_1, u_2) \,\middle|\, \begin{array}{l} 
      u_1 \geq 0, \, u_2 \geq 0 \\
      u_1 + u_2 \leq 1.4 \\
      u_2 \leq 1 \\
      u_2 \leq -0.5u_1 + 1 \quad \text{if} \quad u_1 \leq 0.4 \\
      u_2 \leq -\frac{4}{3}u_1 + \frac{4}{3} \quad \text{if} \quad u_1 > 0.4 
      \end{array} \right\}
      \]
    - **Pareto frontier**: The boundary of \(S\) consists of two segments:  
      1. From \((1, 0)\) to \((0.4, 0.8)\): \(u_2 = -\frac{4}{3}(u_1 - 1)\)  
      2. From \((0.4, 0.8)\) to \((0, 1)\): \(u_2 = -0.5u_1 + 1\)  

  - **Ideal point**:  
    - \(m_1 = \max \{ u_1 \mid (u_1, u_2) \in S \} = 1\) (achieved at \((1, 0)\)).  
    - \(m_2 = \max \{ u_2 \mid (u_1, u_2) \in S \} = 1\) (achieved at \((0, 1)\)).  
    - Thus, ideal point \(m = (1, 1)\).  

  ---

  ### **Step 1: Compute the Kalai-Smorodinsky (KS) Solution**
  The KS solution equalizes the ratio of gains relative to the ideal point:  
  \[
  \frac{u_1 - d_1}{m_1 - d_1} = \frac{u_2 - d_2}{m_2 - d_2} \implies \frac{u_1}{1} = \frac{u_2}{1} \implies u_1 = u_2.
  \]  
  We find the highest \(u_1 = u_2\) on the Pareto frontier:  
  - **Segment 1** (\(u_1 \in [0.4, 1]\)): \(u_2 = -\frac{4}{3}u_1 + \frac{4}{3}\).  
    Set \(u_1 = u_2\):  
    \[
    u_1 = -\frac{4}{3}u_1 + \frac{4}{3} \implies u_1 + \frac{4}{3}u_1 = \frac{4}{3} \implies \frac{7}{3}u_1 = \frac{4}{3} \implies u_1 = \frac{4}{7} \approx 0.571.
    \]  
    Check feasibility: \(u_1 = \frac{4}{7} > 0.4\), so this is valid. Thus, \(u_2 = \frac{4}{7}\).  
  - **Segment 2** (\(u_1 \in [0, 0.4]\)): \(u_2 = -0.5u_1 + 1\).  
    Set \(u_1 = u_2\):  
    \[
    u_1 = -0.5u_1 + 1 \implies 1.5u_1 = 1 \implies u_1 = \frac{2}{3} \approx 0.666 > 0.4 \quad \text{(not in segment)}.
    \]  
  **KS solution**: \(\left( \frac{4}{7}, \frac{4}{7} \right) \approx (0.571, 0.571)\).  

  ---

  ### **Step 2: Compute the Nash Solution**
  The Nash solution maximizes the product of utilities \((u_1 - d_1)(u_2 - d_2) = u_1 \cdot u_2\) over \(S\). We evaluate this on both Pareto frontier segments:  
  - **Segment 1** (\(u_1 \in [0.4, 1]\)): \(u_2 = -\frac{4}{3}u_1 + \frac{4}{3}\).  
    Product: \(P_1(u_1) = u_1 \left( -\frac{4}{3}u_1 + \frac{4}{3} \right) = -\frac{4}{3}u_1^2 + \frac{4}{3}u_1\).  
    Derivative: \(P_1'(u_1) = -\frac{8}{3}u_1 + \frac{4}{3}\). Set to 0:  
    \[
    -\frac{8}{3}u_1 + \frac{4}{3} = 0 \implies u_1 = \frac{1}{2} = 0.5 \quad \text{(in [0.4, 1])}.  
    \]  
    Then \(u_2 = -\frac{4}{3}(0.5) + \frac{4}{3} = \frac{2}{3} \approx 0.667\), and \(P_1 = 0.5 \times \frac{2}{3} = \frac{1}{3} \approx 0.333\).  
  - **Segment 2** (\(u_1 \in [0, 0.4]\)): \(u_2 = -0.5u_1 + 1\).  
    Product: \(P_2(u_1) = u_1(-0.5u_1 + 1) = -0.5u_1^2 + u_1\).  
    Derivative: \(P_2'(u_1) = -u_1 + 1\). Set to 0: \(u_1 = 1 \quad \text{(not in [0, 0.4])}\).  
    Maximum at endpoint \(u_1 = 0.4\): \(u_2 = -0.5(0.4) + 1 = 0.8\), \(P_2 = 0.4 \times 0.8 = 0.32\).  
  Compare: \(P_1 = \frac{1}{3} \approx 0.333 > 0.32\).  
  **Nash solution**: \(\left( \frac{1}{2}, \frac{2}{3} \right) \approx (0.5, 0.667)\).  

  ---

  ### **Step 3: Fairness Comparison**
  - **KS outcome**: \((0.571, 0.571)\)  
    Both players get **equal utility** and achieve **57.1% of their ideal payoff** (\(1\)). This satisfies "proportional equity": concessions relative to the ideal are equal (\(1 - 0.571 = 0.429\) for both).  
  - **Nash outcome**: \((0.5, 0.667)\)  
    Player 2 gets more than Player 1. The product \(u_1 u_2\) is maximized, reflecting the **bargaining set's asymmetry**: near \((0.4, 0.8)\), Player 2 can gain more with less sacrifice from Player 1 (e.g., moving from \((0.5, 0.667)\) to KS costs Player 2 more utility than Player 1 gains).  

  #### **Which is more "fair"?**
  - **Argument for KS**:  
    The ideal point \((1,1)\) is symmetric, so utilities should be equal. KS respects this symmetry and ensures both players benefit equally from cooperation. Player 1 would view Nash as unfair since they get less despite equal "claim" to the ideal.  

  - **Argument for Nash**:  
    The feasible set favors Player 2 (e.g., Player 2 can achieve \(0.8\) while Player 1 gets only \(0.4\), a better trade-off). Nash rewards Player 2 for this advantage and maximizes joint gains. KS forces equality by ignoring the set's asymmetry, which Player 2 might see as unfair.  

  #### **Key trade-off**:  
  - KS prioritizes **symmetric outcomes** relative to ideals.  
  - Nash prioritizes **efficiency and opportunity-sensitive splits**.  
  In this case, Nash better reflects the underlying opportunities, making it more defensible if you value responsiveness to the bargaining set's shape. However, KS is preferable if symmetry in outcomes is paramount.  

  ---

  ### **Why This Example?**
  - **Simple for problem sets**: Only four points, linear constraints, and clear calculations.  
  - **Highlights core difference**: KS and Nash diverge due to asymmetry in \(S\) (Player 2 has better options).  
  - **Illustrates monotonicity**: If \(S\) expands to favor one player (e.g., adding \((0.4, 0.8)\)), KS increases both utilities equally, while Nash rewards the advantaged player. This shows why KS satisfies *individual monotonicity* (expansions benefiting one player raise their outcome) and Nash does not.  

  **Exercise for students**:  
  > *"Compute KS and Nash for \(d = (0,0)\) and \(S = \text{convex hull of } (0,0), (1,0), (0,1), (0.4,0.8)\). Argue which solution is fairer."*
