     In the Nash solution, it maximizes the product of utilities. At (0.5, 2/3), the product is 0.5*(2/3)=1/3≈0.333, while at (4/7,4/7) the product is (4/7)^2≈0.3265, so slightly higher for Nash.

     However, the fairness argument:

       KS: both players are treated equally in terms of the proportion of their ideal utility they achieve.

       Nash: it is based on the product of utilities, which can be seen as a compromise that gives more weight to the player who has a better opportunity (i.e., the set is more favorable to player 2 in the sense that player 2 can get more without hurting player 1 as much).

     Which one is more defensible? It depends. In this set, player 2 has the possibility to achieve a high utility (up to 1) even if player 1 is not getting much, but player 1 cannot achieve more than 1 even if player 2 gets nothing. However, the ideal point for both is 1. 

     The KS solution says: both should get the same fraction of their ideal. That seems symmetric.

     But the Nash solution gives more to player 2. Why? Because the set is asymmetric in a way that favors player 2: the trade-off between the players is not constant. In the region near the KS solution, to transfer utility from player 2 to player 1, we have to give up more of player 2's utility to get a little for player 1? Let me check the slope:

          At the KS solution (0.5714,0.5714) on the second segment: 
            The frontier is u2 = (-4/3)u1+4/3.
            The slope = -4/3 ≈ -1.333, meaning that to get 1 unit of u1, we have to give up 4/3≈1.333 units of u2.

          At the Nash solution (0.5,0.6667): also on the same segment, slope=-4/3.

          But the Nash solution is at a different point. The reason is that the Nash product is maximized by moving to a point where the marginal rate of substitution (which is u2/u1) equals the slope of the frontier? 

          The condition for Nash: at the maximum, the slope of the frontier should equal the negative of the ratio of the gains: 
              (du2/du1) = - (u2 / u1)

          In our linear segment: du2/du1 = -4/3.
          At the Nash point: u2/u1 = (2/3)/0.5 = 4/3, so the absolute value of the slope equals u2/u1 -> 4/3=4/3. This condition holds.

          At the KS point: u2/u1=1, but the slope is -4/3, which is not equal to -1. So the Nash condition does not hold.

     Therefore, the Nash solution is efficient and satisfies the marginal condition.

     The fairness argument for Nash: it equalizes the marginal utility loss of moving away from the solution. For player 1, the loss per unit of utility gained by player 2 is the slope (in absolute terms) 4/3, and the ratio of the utilities (u2/u1) is also 4/3, so the product is maximized.

     The fairness argument for KS: both players get the same proportion of their ideal utility.

     In this case, one might argue that since the ideal point is symmetric (both 1) but the set is asymmetric in a way that favors player 2 (because player 2 can achieve higher utility with less sacrifice from player 1 in some regions), then the Nash solution is recognizing that asymmetry and rewarding player 2.

     However, an alternative view: the ideal point is symmetric, so both players have the same maximum possible utility. Therefore, they should get the same utility. That is the KS solution.

     It's a matter of perspective.

     For the problem set, we can present:

          Bargaining problem: 
            Disagreement point: d = (0,0)
            Feasible set S: the convex hull of the points (0,0), (1,0), (0,1), and (0.4,0.8)

          Compute the KS solution and the Nash solution.

          Answer:

            KS: (4/7,4/7)
            Nash: (0.5, 2/3) = (1/2, 2/3)

          Then ask which one they think is fair and why.

     To compute KS:

          Ideal point: m1 = 1, m2=1.
          Solve: u1 = u2, and (u1,u2) on the Pareto frontier.

          The Pareto frontier consists of two segments:

            Segment 1: from (1,0) to (0.4,0.8): 
                  u1 = 1 - 0.6t, u2=0.8t, for t in [0,1]
                  Set u1=u2: 1-0.6t=0.8t -> 1=1.4t -> t=1/1.4=5/7 -> then u1=u2=1-0.6*(5/7)=1-3/7=4/7.

            Segment 2: from (0.4,0.8) to (0,1): 
                  u1 = 0.4 - 0.4s, u2=0.8+0.2s, for s in [0,1]
                  Set u1=u2: 0.4-0.4s=0.8+0.2s -> 0.4-0.8=0.2s+0.4s -> -0.4=0.6s -> s=-2/3 -> not in [0,1].

          Therefore, the KS solution is (4/7,4/7).

     To compute Nash:

          We maximize u1*u2 over the Pareto frontier.

          Segment 1: u1=1-0.6t, u2=0.8t, t in [0,1]
              P1 = (1-0.6t)(0.8t) = 0.8t - 0.48t^2
              dP1/dt = 0.8 - 0.96t = 0 -> t=0.8/0.96=5/6≈0.8333 (in [0,1])
              Then u1=1-0.6*(5/6)=1-0.5=0.5, u2=0.8*(5/6)=4/6=2/3.
              P1=0.5*(2/3)=1/3≈0.3333.

          Segment 2: u1=0.4-0.4s, u2=0.8+0.2s, s in [0,1]
              P2 = (0.4-0.4s)(0.8+0.2s) = 0.4(0.8)+0.4(0.2)s -0.4s(0.8)-0.4s(0.2)s
                  = 0.32 + 0.08s - 0.32s - 0.08s^2
                  = 0.32 -0.24s -0.08s^2
              dP2/ds = -0.24 -0.16s <0 for all s in [0,1], so maximum at s=0: 
                   u1=0.4, u2=0.8, P2=0.4*0.8=0.32.

          Since 1/3≈0.3333>0.32, the Nash solution is (0.5, 2/3).

     So the example is complete.

     Now, to argue which is more defensible:

          In the KS solution, both players get 4/7≈0.571. This solution treats both players equally in terms of the proportion of their ideal utility they achieve. Since the ideal utility is 1 for both, they get the same utility.

          In the Nash solution, player 1 gets 0.5 and player 2 gets 0.6667. This solution gives more to player 2. The reasoning is that the bargaining set is asymmetric and the product of utilities is maximized at that point. The asymmetry is that player 2 has a more favorable trade-off: when player 1's utility is around 0.5, player 2 can get a relatively high utility (0.6667) without having to give up as much as player 1 would have to give up to get the same increase.

          Which is fair? 

          - If we value symmetry in outcomes, then KS is fair.
          - If we value efficiency and the idea that the solution should reflect the underlying opportunities (i.e., the shape of the set), then Nash is fair.

     This example highlights the difference in the two solution concepts.

     We can also note that in the KS solution, the outcome is on the ray of symmetry, but the set is asymmetric, so one might argue that it does not take into account the asymmetry. On the other hand, the Nash solution does account for the asymmetry.

     However, the individual monotonicity property of KS says that if the feasible set expands in a way that benefits one player more, then that player should get more. In this example, if we compare with a symmetric set, say the triangle (0,0), (1,0), (0,1), then both solutions would be (0.5,0.5). Now, by adding the point (0.4,0.8), we have expanded the set in a way that benefits player 2 more (since the new point has u2=0.8>0.5). 

          In the KS solution: 
              Without the point: (0.5,0.5)
              With the point: (4/7,4/7)≈(0.57,0.57) -> both players get more, and equally more? But note that the ideal point changed: in the symmetric triangle, the ideal point was (1,1) and now it is still (1,1). So the expansion did not change the ideal point? But the set expanded. So the KS solution moved from (0.5,0.5) to (0.57,0.57) for both.

          In the Nash solution:
              Without the point: (0.5,0.5) [in the symmetric triangle, the Nash solution is (0.5,0.5)]
              With the point: (0.5,0.6667) -> player 1 remains at 0.5, player 2 increases to 0.6667.

          The property of individual monotonicity says that if the set expands in a way that the ideal utility of one player increases (and the other remains the same), then that player should get at least as much as in the original solution. In this expansion, the ideal point did not change (both remain 1). So individual monotonicity doesn't require that player 2 gets more? 

          But note: the expansion did not increase the ideal point of player 2: it was 1 and remains 1. However, the set expanded in a region that is more beneficial to player 2. 

          The KS solution does satisfy individual monotonicity, but note that individual monotonicity is defined for expansions that are such that the ideal point of one player increases and the other remains the same. That is not the case here: the ideal point of player 2 was 1 and remains 1. So the property doesn't require a change.

          However, in our expansion, we added a point (0.4,0.8) which is above the old frontier. The old frontier in the symmetric triangle was u1+u2=1. The new set includes points above that line. The ideal point did not change, but the set expanded in a way that is especially beneficial to player 2 (since we added a point with high u2). 

          The KS solution does give more to both players (0.57>0.5) but equally. The Nash solution gives more only to player 2. 

          Which one is more monotonic? 

          Individual monotonicity (as defined by Kalai and Smorodinsky) requires: if T contains S and m1(S)=m1(T) and m2(T)>=m2(S), then the KS solution for T should give player 2 at least as much as in S. In our case, m2(S)=1 and m2(T)=1, so it doesn't change. Therefore, the property doesn't require player 2 to get more. 

          However, one might intuitively expect player 2 to get more because of the new opportunity. The Nash solution reflects that by giving player 2 more and player 1 the same. The KS solution gives both players more.

          Which is better? It depends on whether we think the new opportunity should be shared equally or only benefit the player who is directly favored by it.

     This example should generate good discussion.

     Let me summarize the problem set exercise:

          Consider the two-person bargaining problem with disagreement point d=(0,0) and feasible set S being the convex hull of the points (0,0), (1,0), (0,1), and (0.4,0.8).

          (a) Compute the ideal point.

          (b) Compute the Kalai-Smorodinsky solution.

          (c) Compute the Nash bargaining solution.

          (d) Which solution do you think is more fair? Explain.

     Answers:

          (a) Ideal point: 
               m1 = max {u1 : (u1,u2) in S} = 1 (achieved at (1,0))
               m2 = max {u2 : (u1,u2) in S} = 1 (achieved at (0,1))
               So (m1, m2) = (1,1)

          (b) KS: as above, (4/7,4/7)

          (c) Nash: (1/2, 2/3)

          (d) Open.

