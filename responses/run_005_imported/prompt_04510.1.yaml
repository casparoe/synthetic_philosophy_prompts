  so ok this might be a weird one but i went down a total rabbit hole. my psych teacher mentioned this "Knobe effect" (aka the side-effect effect) for like one slide during our theory of mind unit and now i can't stop thinking about it. the basic idea, i think, is that if a CEO tanks the environment as a side effect of some policy that boosts profits, most people say he did it "intentionally," but if the exact same policy happens to HELP the environment as a side effect instead, people say that wasn't intentional — even tho the CEO's actual mental state (he just doesnt care either way, profit is literally the only thing he's after) is identical in both versions. so naturally i started googling this and found out theres basically a whole cottage industry of philosophers arguing about WHY this asymmetry happens, and i wrote down 6 different accounts in my notes app, but i honestly can't tell anymore which ones are still taken seriously by researchers vs which ones got pretty much shot down by later experiments: Knobe's own "moral bias" story, Machery's "trade-off hypothesis," Adams & Steadman's pragmatics/implicature account, Sripada's "deep self concordance" model, Uttich & Lombrozo's statistical norm-violation account, and some kind of blame-driven/motivated-reasoning story that people trace back to Alicke's work.

