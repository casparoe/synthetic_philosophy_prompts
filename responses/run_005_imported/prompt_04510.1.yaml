reasoning: |-
  We are ranking 6 accounts of the Knobe Effect based on current empirical support. The Knobe Effect (side-effect effect) is the asymmetry in intentionality judgments: people are more likely to say a side effect was brought about intentionally when it is harmful (e.g., harming the environment) than when it is beneficial (helping the environment), even when the agent's mental state (indifference) is the same.

  The six accounts to be ranked:

  1. **Knobe's Moral Bias**: The original account by Joshua Knobe. He proposed that moral judgments (about the badness of the side effect) influence intentionality judgments. People are more likely to judge a side effect as intentional when it is bad because they are biased by the negative moral valence.

  2. **Machery's Trade-Off Hypothesis**: Edouard Machery suggested that the effect arises because in the harm condition, the agent is seen as trading off the negative side effect for the primary goal (profit), which implies awareness and acceptance of the harm, hence intentional. In the help condition, there's no such trade-off.

  3. **Adams & Steadman's Pragmatics/Implicature**: Fred Adams and Annie Steadman argued that when people say the CEO "intentionally" harmed the environment, they are not making a claim about mental states but are pragmatically implicating blame. The intentionality attribution is a way to express blame.

  4. **Sripada's Deep Self Concordance**: Chandra Sripada proposed that people judge an action as intentional if it concordes with the agent's "deep self" (enduring values and character). Harming the environment concordes with a greedy CEO's deep self, but helping does not.

  5. **Uttich & Lombrozo's Statistical Norm-Violation**: Kevin Uttich and Tania Lombrozo suggested that the effect arises because harmful side effects are statistically rare (violate norms) and thus stand out, making people more likely to attribute intentionality to rare outcomes.

  6. **Blame-Driven/Motivated Reasoning (Alicke)**: This account, drawing from Mark Alicke's work on blame, posits that people have a motivation to blame the agent for bad outcomes, which leads them to overattribute intentionality for harms. For benefits, there's no such motivation.

  Now, we need to rank these from best-supported (S) to discredited (D) based on the current state of empirical research.

  After reviewing the literature (as of my knowledge cutoff in 2023), here's a summary of how these accounts have fared:

  - **Knobe's Moral Bias**: This was the initial explanation and has been supported by many studies. However, subsequent research has shown that the effect is not limited to moral valence but can occur with other valences (e.g., aesthetic, conventional). But the core idea of valence asymmetry (negative vs. positive) being a key driver remains influential.

  - **Machery's Trade-Off Hypothesis**: This account has received some support, but it has been challenged by experiments that control for trade-offs and still find the asymmetry. It might explain part of the effect but not all.

  - **Adams & Steadman's Pragmatics**: This account has been largely discredited by experiments that control for pragmatic factors (e.g., by asking about intentionality in a way that doesn't imply blame) and still find the asymmetry. Also, the effect persists in non-verbal measures.

  - **Sripada's Deep Self Concordance**: This has garnered support from studies that manipulate the agent's character and values. However, it doesn't explain all cases (e.g., when the agent's deep self is neutral) and may be one factor among others.

  - **Uttich & Lombrozo's Statistical Norm-Violation**: This account has been challenged because the asymmetry persists even when the harmful outcome is statistically common (thus not violating a norm). Also, the effect is stronger for moral norms than statistical ones.

  - **Blame-Driven/Motivated Reasoning (Alicke)**: This has strong support. Experiments show that when blame is controlled for (e.g., by having the agent be blameless for some reason), the intentionality attribution decreases. Also, the effect is mediated by blame judgments.

  Current consensus (based on meta-analyses and reviews):

  The most robust accounts are those that incorporate the role of blame or moral evaluation. The motivated reasoning (blame-driven) account is well-supported. Knobe's original moral bias is still a contender but has evolved to include a broader range of evaluative judgments. The trade-off and deep self accounts have partial support but are not as comprehensive. The norm-violation account has been largely refuted for the Knobe effect, and the pragmatics account has also been refuted.

  Ranking:

  S: Blame-Driven/Motivated Reasoning (Alicke) - Strongest empirical support; blame attributions mediate the effect and manipulating blame changes intentionality judgments.

  A: Knobe's Moral Bias - Still influential and partially supported, but the effect is now seen as part of a broader phenomenon of evaluative judgments.

  B: Sripada's Deep Self Concordance - Supported in some contexts, especially when character is salient, but not as general as blame.

  C: Machery's Trade-Off Hypothesis - Some support in specific scenarios, but fails in others (e.g., when there's no explicit trade-off).

  D: Adams & Steadman's Pragmatics - Largely discredited by evidence that the effect is not due to conversational pragmatics.

  D: Uttich & Lombrozo's Statistical Norm-Violation - Discredited by experiments showing that moral norm violations, not statistical rarity, drive the effect.

  Note: Some accounts might share the same tier. We have 6 accounts and 5 tiers (S, A, B, C, D). We can put two in D.

  But note: The norm-violation account (Uttich & Lombrozo) and the pragmatics account (Adams & Steadman) are both considered discredited in the context of the Knobe effect. So we put both in D.

  However, let me double-check the literature:

  - For Adams & Steadman: Subsequent experiments (e.g., by Knobe) showed that the effect holds even when the question is phrased to avoid implicature, and in non-linguistic tasks.

  - For Uttich & Lombrozo: Experiments have shown that the effect occurs even when the harmful outcome is common (so not a statistical norm violation) and that moral norm violations are key.

  Therefore, the ranking:

  S: Blame-Driven/Motivated Reasoning (Alicke)
  A: Knobe's Moral Bias
  B: Sripada's Deep Self Concordance
