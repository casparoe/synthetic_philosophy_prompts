  Breaking down Aristotle’s argument: The builder-shoemaker example uses geometric proportion, where the ratio of their work (A:B) equals the ratio of their products (C:D). Here, money measures the products, but the underlying equality comes from reciprocal need. Then, demand (chreia) is introduced as the true unit, with money as its conventional symbol. This isn’t circular because demand mediates value before money formalizes it. The "impossibility" of true commensurability refers to intrinsic properties, while money achieves practical commensurability through social agreement. 

  The shift from geometric to arithmetic isn’t a mistake; it shows money simplifying exchange. Geometric proportion links producer value, arithmetic handles product exchange via money. Aristotle’s point is that demand enables this system, with money as a tool. The user’s worry about circularity might stem from missing how demand anchors value independently. 

  Marx’s interest makes sense—Aristotle’s demand-based value prefigures subjective theory, challenging intrinsic value. The user needs to see that Aristotle’s "contradiction" is a dialectical tension: money artificially commensurates what’s naturally incommensurable, relying on social need. This resolves the apparent conflict and avoids circularity by prioritizing demand over money. 

  I should emphasize Aristotle’s pragmatic view: convention bridges the gap between natural diversity and economic necessity. Highlighting the farmer-shoemaker example might help show demand’s role. Also, clarifying that "impossible" refers to ontological commensurability, while money provides functional equivalence. 

  The user’s deeper need is confidence in interpreting tricky texts and leading discussions. Providing clear distinctions between Aristotle’s layers—demand as real basis, money as convention—should empower them. Avoiding jargon, stressing the social agreement aspect, and linking to Marx’s footnote contextually will address their unspoken aim to engage critically with their group.
answer: |-
  You've pinpointed the exact tension that makes Aristotle's argument in *NE* V.5 so fascinating and challenging. It's not a contradiction, but rather a sophisticated dialectic exploring the relationship between natural need, social convention, and the artificial tool of money. Let's break it down step by step, focusing on the demand-commensurability-money nexus:

  1.  **The Problem: Reciprocity Requires Commensurability:**
      *   Aristotle starts from the premise of reciprocal justice in exchange (`antipeponthos`). For exchange to be fair and associative life possible, the goods exchanged must be *equal* in some meaningful sense.
      *   The builder's house and the shoemaker's shoes are fundamentally different kinds of things. How can we say "X houses = Y shoes" fairly?
      *   He proposes a *proportion* to solve this: `Builder : Shoemaker :: Shoe : House`. The value lies not just in the objects, but in the *relative worth* or *function* of the producers within the community. The ratio expresses the relative value placed by the community on the *work* of building vs. shoemaking.

  2.  **Enter Money as a Measuring Tool:**
      *   Aristotle immediately identifies a practical problem: how do you actually *use* this proportion involving people and things in the marketplace? "Builder : Shoemaker" isn't a number you can easily apply.
      *   **Money's first role:** It acts as a *practical measuring instrument*. It "measures all things" by providing a common denominator. It translates the complex proportional relationship `(Builder/Shoemaker) = (Shoe/House)` into a simple numerical equivalence: `House = Price (in money) = N x Shoes`.
      *   **Key Point:** At this stage, money is presented as the *solution* to the commensurability problem, *enabling* the expression of the proportion derived from the relative value of producers/needs.

  3.  **The Foundational Role of Demand (Chreia):**
      *   Here's the crucial turn. Aristotle asks: What *underlies* this whole system? What makes exchange possible *at all* and gives meaning to the proportion and the money measurement?
      *   **Demand/Need (Chreia) is the True Unit:** "All goods must therefore be measured by some one thing... Now this unit is in truth demand (`chreia`)." Demand is the fundamental social force that creates the *necessity* for exchange and establishes the *relative urgency or desirability* of different goods. Without mutual need of differing intensities, exchange wouldn't happen or wouldn't take the form it does.
      *   **Money's Second (and Deeper) Role: Conventional Representation of Demand:** "but money has become by convention (`kata synthēkēn`) a sort of representative (`hypallagma`) of demand." Money isn't the *source* of value or commensurability. It's a *socially agreed-upon symbol* (`nomisma` from `nomos` - law, convention) that *stands in for* the complex, fluid, and subjective reality of aggregate social demand (`chreia`). Its value and its power to measure derive entirely from this social agreement based on underlying needs.

  4.  **Resolving the "Impossibility" of Commensurability:**
      *   Aristotle states the stark reality: "Now in truth it is impossible (`adynaton`) that things differing so much should become commensurate (`symmetra genesthai`)." A house and a bed are ontologically different. There is no *natural*, intrinsic common property (like length or weight) that allows us to say one house *is* five beds in any absolute, physical sense. Their uses (`chreia`) are incommensurable at this fundamental level.
      *   **Conventional Commensurability "with reference to demand":** "but with reference to demand (`pros tēn chreian`) they may become so sufficiently (`hikanōs`)." This is the key.
          *   Demand (`chreia`) provides the *context* and the *basis* for comparison. We don't compare a house and a bed *as physical objects*, but *as objects satisfying human needs* within a specific social context.
          *   Money, *as the conventional representation of demand*, provides the *practical mechanism* for establishing this need-based commensurability "sufficiently" for the purposes of exchange and social life. It creates an *artificial equivalence* based on social agreement (`synthēkē`) rooted in shared needs.
          *   **The "Parasitic" Commensuration:** Yes, this is precisely the view. Money supplies *only* a workable, convention-fixed commensuration (`symmetria`) that is entirely *parasitic on demand*. Demand (`chreia`) is the real, underlying force creating the *potential* for equivalence based on social valuation of need-satisfaction. Money is the socially constructed *tool* that actualizes this potential into a usable numerical scale. Neither is a "real" common measure like length; demand is a social/psychological force, and money is its conventional token.

  5.  **The Shift in Proportions: Geometric to Arithmetic (and Why It Matters, But Doesn't Break the Argument):**
      *   **Builder-Shoemaker (Geometric Proportion):** `A (Builder) : B (Shoemaker) :: C (Shoe) : D (House)`. This emphasizes the *relational* aspect of value based on the *relative social standing/need for the producers' functions*. It's about ratios of worth.
      *   **House-Bed-Minae (Arithmetic Equivalence):** `A (House) = 5 minae; C (Bed) = 1 mina; Therefore A (House) = 5 x C (Bed)`. This is the practical outcome *after* money has done its measuring work. It translates the complex social ratios into simple numerical equivalence for transaction.
      *   **Does the Shift Matter?** Yes, it reflects the movement from the *theoretical foundation* of value (relative social need for functions/goods) to its *practical application* in exchange via the conventional tool of money. It shows *how* money operates.
      *   **Does it Invalidate the Argument?** No. The arithmetic equivalence (`House = 5 Beds`) is *derived from* and *expresses* the underlying proportional relationships mediated by money, which itself represents demand. The minae price *is* the numerical representation of the house's and the bed's position within the network of social demand (`chreia`). The geometric proportion explains *why* the arithmetic equivalence holds (it's based on relative valuations), while the arithmetic equivalence shows *how* it functions in practice.

  **Avoiding Circularity:**

  The argument avoids circularity because Aristotle establishes a clear hierarchy and direction of dependence:

  1.  **Foundation:** Mutual but differing social need (`chreia`) creates the *necessity* for exchange and establishes the *relative* desirability/urgency of goods/functions.
  2.  **Social Solution:** To facilitate exchange based on this need, society develops a convention (`nomos`): money (`nomisma`).
  3.  **Function of Convention:** Money acts as a *representative* (`hypallagma`) of that underlying demand, providing a common numerical measure.
  4.  **Practical Outcome:** Using this conventional measure, disparate goods become *artificially commensurate* "sufficiently" for exchange, expressed as arithmetic equivalence (X minae = Y goods = Z other goods).
  5.  **Limitation:** This commensurability is purely conventional and functional; it doesn't imply any *natural* equivalence between the goods themselves (`adynaton`).

  **In Summary:**

  Aristotle's argument is consistent and profound. He argues that:

  *   The *possibility* of fair exchange rests on an underlying foundation: social demand/need (`chreia`), which establishes relative valuations.
  *   True, natural commensurability between fundamentally different goods is impossible.
  *   Money is a brilliant social invention (`kata synthēkēn`). It is *not* the source of value but a *conventional token* (`nomisma`) that *represents* (`hypallagma`) the complex reality of social demand.
  *   *As this representation*, money performs the vital *function* of creating a *practical, artificial commensurability* sufficient for exchange and social association. It translates the relational values established by demand into numerical prices, enabling the arithmetic equivalence used in markets (`House = 5 minae = 5 Beds`).
  *   The geometric proportion (`Builder : Shoemaker :: Shoe : House`) reveals the theoretical basis in relative social valuation, while the arithmetic equivalence (`House = 5 Beds`) shows the practical outcome mediated by money-as-demand-representative.

  You are right to focus on `chreia` (demand/need) as the linchpin. Money's power is entirely derivative and conventional, acting as a practical proxy for the force that truly binds the economic community together: mutual need. This passage is indeed a locus classicus for seeing Aristotle grappling with a concept of value rooted in social relations and subjective need, foreshadowing later developments Marx would seize upon. Bring this analysis to your group – it directly addresses the core of the argument you found elusive.
