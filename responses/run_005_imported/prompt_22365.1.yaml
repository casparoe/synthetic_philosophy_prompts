  First, the user is stuck on the apparent contradiction: Aristotle says money makes goods commensurate, but then claims true commensurability is impossible due to the diverse nature of goods. How can both be true? The user also questions if Aristotle shifts from geometric proportion to arithmetic equivalence and if that matters. They want clarity beyond the usual chrematistics discussions.

