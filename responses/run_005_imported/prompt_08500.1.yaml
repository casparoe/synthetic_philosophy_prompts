prompt: |-
  So this semester I'm taking a research methods class for my psych major, and last week we spent basically a whole lecture on Simpson's paradox -- my professor's big line was that the paradox doesn't actually get "solved" by crunching more numbers, it gets solved by figuring out the causal story behind why the groups differ in the first place, which I'm still chewing on. Anyway, I ended up arguing about this with my roommate last night because it turns out to be extremely relevant to something happening on the Learning Support Advisory Committee, which I sit on as the student rep.

  Here's the situation: the committee has to decide by next Tuesday whether to renew, expand, or cut funding (about $80k/year) for our college's Supplemental Instruction (SI) program, where upperclassmen run extra study sessions attached to specific gateway courses. The provost's office gave us the pass-rate data, and depending on how you slice it, it tells opposite stories. Overall, across the whole student body, kids who went to SI passed their course at about 77% (347/450) vs about 86% (475/550) for non-attendees -- so on paper SI attendees do worse, and two committee members want to kill the program over this. But broken down by course it flips: in Calc I, SI attendees passed at 75% (300/400) vs 65% (65/100) for non-attendees, and in Intro Psych, SI attendees passed at 94% (47/50) vs about 91% (410/450) for non-attendees -- SI attendees do better in both courses individually. The reversal happens because SI attendance is way more concentrated in Calc I (which has a much lower baseline pass rate for everybody, SI or not) than in Psych. Our committee chair pointed this out and wants to expand SI, but the member who wants to cut it says breaking the data down by course just lets us keep slicing it until we land on whatever story we already wanted, and that the trustees are only ever gonna ask about the topline number anyway.

  I have to actually write the one-page recommendation memo for Tuesday, and I dont want to just yell "Simpson's paradox!" and call it a day -- I want it to seriously engage with the "you're just cherry-picking your slice" objection, since it kind of nags at me too even though I suspect it's wrong here. Could you draft that memo for me: a clear recommendation with a timeline for how we'd check it's actually working, and reasoning solid enough that it'd definately survive being read out loud to the one committee member who thinks this is all statistical sleight of hand?
reasoning: |-
  Okay, the user is a psychology major student representative on a Learning Support Advisory Committee. They're dealing with a funding decision for the Supplemental Instruction (SI) program, where the data shows Simpson's Paradox in action. The overall pass rates suggest SI attendees do worse, but when broken down by course, attendees actually do better in both Calc I and Intro Psych. The user needs to write a recommendation memo that addresses the committee's concerns about cherry-picking data and withstands scrutiny from skeptical members.

  First, I need to unpack the paradox here. The overall numbers show SI attendees with a 77% pass rate versus 86% for non-attendees. But when split by course, Calc I attendees have 75% vs 65%, and Psych attendees have 94% vs 91%. The reversal happens because more students attend SI in Calc I, which has a lower pass rate overall. The key is the confounding variable: the course difficulty and baseline pass rates. 

  The user's professor emphasized that Simpson's Paradox isn't solved by more data but by understanding the causal story. So the memo must explain why breaking down by course isn't cherry-picking—it's necessary to account for the confounding factor. The objection that slicing data can be manipulative is valid in general, but here it's justified because the course type directly affects both SI participation and pass rates. 

  The user's deeper needs include wanting a memo that's logically robust, addresses the cherry-picking accusation head-on, and provides actionable steps for verification. They also need to convince trustees who might only look at top-line numbers. The recommendation should balance immediate action with a plan to gather more evidence.

  For the memo structure, I'll start with a clear recommendation to renew and expand SI, supported by the course-level analysis. Then, address the cherry-picking concern by explaining why course is a relevant stratification variable. Include a plan for a randomized trial or A/B testing to eliminate selection bias, which tackles the skepticism about causality. A phased timeline (renew now, pilot expansion, rigorous evaluation) shows prudence without delaying support.

  The causal story: Students self-select into SI, likely based on perceived need. In harder courses like Calc I, more students attend, but their baseline risk of failing is higher. SI helps, but not enough to overcome the course difficulty entirely. Without stratification, this selection bias makes SI look harmful. The memo needs to make this intuitive—maybe with a car analogy or simple language about uneven distribution.

  Also, the user mentioned the committee chair supports expansion, but some members want to cut funding. The memo must bridge this gap by not dismissing the overall numbers but explaining their limitations. Emphasizing that the topline is misleading without context could preempt trustee questions. Including a verification plan (randomized encouragement design) adds credibility, showing commitment to evidence over ideology.

  Finally, the tone should be professional yet accessible, avoiding statistical jargon. Since the user is a student rep, the memo should bolster their credibility with clear reasoning. Highlighting the committee's due diligence in analyzing both aggregated and stratified data positions them as thorough and unbiased.
answer: |-
  **To:** Learning Support Advisory Committee  
  **From:** [Your Name], Student Representative  
  **Date:** [Current Date]  
  **Subject:** Evidence-Based Recommendation for Supplemental Instruction (SI) Program Funding  

  **Recommendation:** Renew and strategically expand the SI program for one year, coupled with a rigorous validation plan to confirm causality. *Do not cut funding.*  

  ### Key Findings from Data Analysis  
  1. **Overall Pass Rates (Misleading):**  
     - SI Attendees: 77% (347/450)  
     - Non-Attendees: 86% (475/550)  
     *Superficially suggests SI correlates with lower pass rates.*  

  2. **Course-Specific Pass Rates (Reveals True Impact):**  
     - **Calc I:**  
       - SI Attendees: 75% (300/400) → **+10% advantage**  
       - Non-Attendees: 65% (65/100)  
     - **Intro Psych:**  
       - SI Attendees: 94% (47/50) → **+3% advantage**  
       - Non-Attendees: 91% (410/450)  
     *SI attendees outperform non-attendees in both courses.*  

  ### Addressing the "Cherry-Picking" Objection  
  Breaking down data by course isn’t arbitrary—it’s **essential** to correct for a critical confounding factor: *baseline course difficulty and self-selection bias*.  
  - **Why course matters:**  
    - Calc I has a low baseline pass rate (≈68% overall). Students at higher risk of failing are more likely to seek SI.  
    - Psych has a high baseline pass rate (≈91%). Fewer students need SI, so attendees are often high-achievers seeking enrichment.  
  - **The paradox explained:**  
    SI is disproportionately used in harder courses (Calc I). Aggregating data *hides this imbalance*, making SI appear harmful. Disaggregating by course removes this distortion, revealing SI’s true benefit. **This isn’t slicing data until it fits—it’s adjusting for a known bias.**  

  ### Why Cutting SI Would Harm Students  
  - SI provides the greatest lift (10%) in our most challenging gateway course (Calc I), where failure risks derailing majors (STEM, economics).  
  - Killing SI based on aggregated data would punish students in high-risk courses who benefit most.  

  ### Validation Plan: Confirming Causality Within 6 Months  
  To address concerns about selection bias (e.g., "maybe SI attendees would’ve passed anyway"), we propose:  

  1. **Phase 1 (Immediate):**  
     - **Randomized Encouragement Design:** For Spring 2024, randomly assign 300+ students in Calc I/Psych to receive "strong encouragement" to attend SI (emails, incentives). Compare outcomes vs. non-encouraged group.  
     - **Track Pre-Course Metrics:** Control for incoming GPA/course preparedness.  

  2. **Phase 2 (By Mid-Semester):**  
     - **Pilot Expansion:** Add SI to 1–2 new high-risk courses (e.g., Gen Chem) with randomized encouragement.  

  3. **Phase 3 (End of Semester):**  
     - **Report:** Compare pass rates, persistence, and GPA impact between encouraged/non-encouraged groups. Use regression analysis to isolate SI’s effect.  

  ### Response to Trustees’ Topline Concerns  
  If trustees question the overall 77% vs. 86%:  
  > *"This number is skewed because SI attracts students in our toughest courses. When we compare students in the same course, SI attendees consistently perform better. Cutting SI would hurt precisely those students working hardest to succeed."*  

  ### Conclusion  
  The data reversal is a textbook case of Simpson’s Paradox—resolved by examining the *causal context* (course difficulty driving self-selection). The SI program demonstrably supports students in high-risk courses and warrants renewal. However, we commit to validating causality via randomized assessment within 6 months. This balances urgent student needs with rigorous accountability.  

  **Recommended Vote:** Renew funding ($80k) + $15k for validation study. Re-evaluate in June 2024 with causal evidence.  

  ---  
  **Key Strengths of This Approach:**  
  - **Preempts "cherry-picking" claims:** Framing stratification as bias-correction (not manipulation).  
  - **Addresses causality gaps:** Randomized design tackles selection bias.  
  - **Builds trustee trust:** Clear path to causal evidence + immediate accountability.  
  - **Prioritizes equity:** Protects support for vulnerable students during validation.  

  Let me know if you’d like to workshop specific phrasing for the randomized trial!
