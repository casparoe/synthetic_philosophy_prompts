  Okay so this has been rattling around in my head for a while and I can't shake it. Say someone made a perfect fake of a painting, like literally molecule for molecule identical, so good that no expert or machine on earth could ever tell which one is the "real" one. Why does everyone still act like the original is worth millions and the fake is basically worthless garbage, even though nothing about looking at it changed? I read once about a Dutch guy (Van Meegeren, i think?) who forged old Vermeers so well he fooled pretty much every expert alive, even sold one to a nazi bigwig during the war, and when they arrested him after for basically treason he had to prove his own painting was a fake by knocking out a brand new "Vermeer" right there in custody, just to save his own neck. Anyway, could you write me a short story that actually sits inside this weirdness instead of just being a heist/con-man plot? I want the ending to actually make me feel why the original is supposed to matter more, or make me doubt that it should. Keep it fairly short, a few pages is plenty.
