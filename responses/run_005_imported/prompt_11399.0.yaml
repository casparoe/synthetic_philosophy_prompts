  But the crayfish project clearly pushes ethical boundaries. The documented anxiety-like response and pharmacological reversibility suggest this isn't just reflex testing - it's probing distress states uncomfortably close to vertebrate experiences. Letting it proceed with zero oversight might violate the spirit of humane science education, even if it technically complies.

  The memo needs to acknowledge both concerns. I'll propose a middle path: require basic documentation (supervising scientist, pain/distress minimization plan) without full vertebrate-level restrictions. This respects the rule's structure while adding safeguards for borderline cases. Crucially, I'll recommend formalizing this approach for future projects to avoid arbitrariness - perhaps by defining "higher-functioning invertebrates" based on measurable criteria like pharmacological sensitivity.

