answer: |-
  Here's the strongest possible case for why omissions are **never** genuine causes, only bases for responsibility:

  1.  **Causation Requires Positive Action or Event:** The fundamental nature of causation involves *something happening* – an event, a force, a change in the state of affairs. The lifeguard *doing nothing* involves no physical event emanating from them. The drowning victim dies because of the *positive actions* they took (getting into difficulty, inhaling water) interacting with the *positive properties* of the water (its depth, its ability to suffocate). The lifeguard's non-intervention introduces no new force or event into this causal chain. They are physically inert. To call an absence a "cause" stretches the concept beyond its logical breaking point – it's mistaking a condition for an agent.

  2.  **The Absurdity of Infinite Causes (The Over-Inclusion Problem):** If "failure to prevent" constitutes causation *simply because* the outcome would have been different if they acted, then you immediately create an infinite regress of "causes." *Every single entity* that *could* have intervened but didn't becomes a "cause" of the death:
      *   The bystander who can't swim but could have thrown a lifebuoy (they didn't).
      *   The passerby on the phone who didn't notice.
      *   The manufacturer who didn't install more lifeguard stations.
      *   The government that didn't mandate stricter safety regulations.
      *   The Olympic swimmer three towns over who *could* have been there and saved them but wasn't.
      *   *You*, sitting at home reading this, who *could* theoretically have been there and saved them but weren't.
      This is demonstrably absurd. It renders the concept of "cause" utterly meaningless by diluting it to include every possible non-actor in the universe whose action *might* have altered the outcome. Causation loses all explanatory power if it points everywhere at once. The fact that we intuitively *know* the lifeguard is uniquely significant while the Olympic swimmer isn't proves that something *other than causation* is at work.

  3.  **The Lifeguard's Significance is Moral/Legal, Not Causal:** The *only* thing distinguishing the lifeguard from the random bystander or the distant swimmer is a **duty**. The lifeguard occupies a specific role defined by social contract, employment, and expectation, where intervention is explicitly required. This duty creates a moral and legal obligation. The bystander lacks this duty. The non-action of the lifeguard is a *breach of duty*, not a causal force. The causal chain leading to death remains entirely within the domain of the victim and the water. The lifeguard's inaction is merely the *failure to break* that pre-existing causal chain. They didn't *cause* the chain; they failed to *interrupt* it, which they were uniquely obligated to do.

  4.  **The "But For" Test is Misapplied:** Proponents of omissions-as-causation rely on the "but for" test: "But for the lifeguard's inaction, the death wouldn't have occurred." This fundamentally misapplies the test. "But for" identifies *necessary conditions*, not necessarily *causes*. Oxygen is a necessary condition for the drowning (no oxygen, no drowning), but we don't say oxygen *caused* the drowning. The lifeguard's presence and capability are *background conditions* enabling possible rescue, not active causal agents. Their inaction is the *absence* of a potential interrupting condition, not the *presence* of a causing condition. Applying "but for" to omissions inevitably leads to the over-inclusion problem (#2), proving it identifies conditions, not causes.

  5.  **Clarity Requires Separation:** Conflating omission-as-cause with action-as-cause creates profound confusion. It blurs the line between *creating a harmful state of affairs* (pushing someone in) and *failing to alter an independently harmful state of affairs* (not pulling them out). Maintaining a strict definition of cause as *positive agency* provides essential clarity. Responsibility for harm can then be accurately assigned based on **breach of duty** (for the lifeguard) or **creation of harm** (for the pusher), without muddying the metaphysical waters. The lifeguard is blameworthy *because they failed in their specific duty*, not because their non-action mysteriously *caused* the water to enter the victim's lungs.

  **Conclusion:** Insisting that omissions are genuine causes is a category error born of linguistic and moral confusion. It ignores the fundamental requirement of causation – a positive event or force. It leads to the absurd and useless conclusion that countless non-actors are "causes." The unique significance of figures like the lifeguard stems entirely from their *duty*, not from any causal power inherent in their inaction. The drowning was caused by the victim's actions and the properties of water. The lifeguard's failure to act is a morally and legally culpable *breach of obligation* that allowed that pre-existing causal chain to complete, but it introduced no new cause. Responsibility arises from duty breached, not causation supplied by absence. Omissions are voids; they cause nothing. We hold people accountable for omissions for powerful moral and legal reasons, but we must resist the sloppy temptation to call that void a cause.
