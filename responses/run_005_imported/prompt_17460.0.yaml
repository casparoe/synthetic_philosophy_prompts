  ok this might be a weird one but in my ethics elective we got stuck on this: can NOT doing something actually cause something, or can we only ever say its fair to blame someone for it? like is a lifeguard who just sits there while someone drowns an actual cause of the death (same as if they'd pushed them in), or is that just us being sloppy with the word "cause"? i went down a rabbit hole and there's apparently a real problem here: if an omission counts as a cause just because "if they had acted, the person wouldn't have died," then doesn't that same logic make literally every other person who could've jumped in but didn't (random bystanders, some great swimmer three towns over, whoever) just as much of a "cause," which feels obviously wrong since the lifeguard clearly matters more than they do. can you make the strongest one-sided case you can that this problem can't actually be patched, and that the real conclusion is that omissions are never genuine causes of anything, just things we choose to hold people responsible for, for totally separate moral/legal reasons. dont hedge or give me both sides pls, i want the most convincing version of just that one position.
