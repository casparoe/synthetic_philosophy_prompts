  First, I need to acknowledge how layered this dilemma is. It's not just "is the book good?" but "what does it do to us?" and "what responsibilities do we have as jurors?" The user's suspicion about unexamined biases is key—disgust often masquerades as morality, especially with taboo subjects. But outright dismissing the concerned jurors as squeamish would be just as reductive as calling the others morally reckless. 

