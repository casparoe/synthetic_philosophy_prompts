  Van Fraassen's Reflection Principle is about future credences. It says that if you're certain your future credence in P will be x, then your current credence in P, given that future credence, should also be x. Importantly, this applies regardless of how that future credence comes about—whether through rational updating or something irrational like memory loss or coercion.

  Yudkowsky's principle, on the other hand, is derived from the law of total probability. It states that the expected value of your posterior probability (after updating on evidence) must equal your prior. This is specific to Bayesian updating where evidence is involved. So, it's tied to rational evidence-based changes.

  The key difference is that Reflection doesn't care about the reason for the credence change, while Conservation only applies when updating on evidence. The user wants to know if Reflection is just a temporal restatement of the Bayesian result or if it's stronger. They also want an example where credence changes for a non-rational reason to see which principle holds up.

  Let me think of an example. Suppose someone knows they'll have memory loss. They're certain that tomorrow they won't remember some evidence, so their future credence will be lower. According to Reflection, their current credence should match that future lower credence, but that doesn't make sense because they currently have more evidence. So Reflection fails here. But Conservation of Expected Evidence still holds because it only applies when updating on actual evidence, not irrational changes.

  The user might be interested in this because they're trying to understand the nuances in decision theory or epistemology. They might be writing something or debating these concepts in forums. Their deeper need is to clarify misconceptions in rationalist circles where these principles are conflated. They want a clear distinction to apply correctly in their reasoning or discussions.

  I should also note that van Fraassen intended Reflection as a norm for rational planning, but it's controversial. The example shows that Reflection is stronger and more easily refuted, while Conservation is more robust as it's a mathematical consequence of probability theory. Highlighting the memory loss case makes the difference clear. The user benefits from understanding when each principle applies and why they shouldn't be equated.
answer: |-
  Here's a detailed comparison of van Fraassen's Reflection Principle and Yudkowsky's Conservation of Expected Evidence (CEE), highlighting their key differences and susceptibility to counterexamples involving non-rational belief change:

  **Core Principles Restated:**

  1.  **van Fraassen's Reflection Principle (RP):**
      *   *Formal Statement:* If you are certain that at future time *t* your credence in proposition *P* will be *x* (i.e., Cr(Crₜ(*P*) = *x*) = 1), then your current credence in *P*, conditional on Crₜ(*P*) = *x*, must itself be *x*: Cr(*P* | Crₜ(*P*) = *x*) = *x*.
      *   *Key Feature:* **Indifference to Source.** RP demands that your current credence defer to your anticipated future credence *no matter how that future credence comes about* – whether through rational Bayesian updating, irrational bias, forgetting evidence, coercion, hypnotism, or a blow to the head. It treats the future credence state itself as a *direct reason* for your current belief.

  2.  **Yudkowsky's Conservation of Expected Evidence (CEE):**
      *   *Formal Statement:* For any proposition *P* and any potential piece of evidence *E*, your current credence in *P* is the weighted average of your possible posteriors after seeing *E* or not-*E*, weighted by your current probability of seeing that evidence: Cr(*P*) = Cr(*E*) * Cr(*P* | *E*) + Cr(¬*E*) * Cr(*P* | ¬*E*).
      *   *Key Feature:* **Conditional on Evidence.** CEE is a direct mathematical consequence of the law of total probability and the definition of conditional probability. It *only* applies when considering how your beliefs *should* change *in response to anticipated specific evidence* within a Bayesian framework. It governs *rational updating rules*, not arbitrary future credences.

  **Is RP Just CEE Restated Temporally?**

  **No.** While both deal with current and future credences, the core difference lies in **RP's indifference to the *source* of the future credence versus CEE's strict dependence on *evidence-based updating*.**

  *   **RP is more general temporally but crucially *also* in its mechanism:** It demands deference to *any* future credence you are certain of, regardless of how it arises. This makes it a *substantively stronger* and *more controversial* normative claim about rational planning and belief coherence over time.
  *   **CEE is narrower but more robust:** It's a theorem of probability theory describing how prior expectations constrain *rational responses to evidence*. It says nothing about credence changes due to non-evidential factors.

  **Illustrating the Difference: The Case of Anticipated Memory Loss**

  **Scenario:** You are taking a medication tonight that you are *certain* will cause you to completely forget a crucial piece of evidence *E* relevant to proposition *P* by tomorrow morning. Currently:
  *   You have evidence *E*, making Cr(*P*) = 0.8.
  *   You know that without *E*, your rational credence in *P* (based only on the evidence you *will* remember tomorrow) should be Cr(*P* | ¬*E*) = 0.3.
  *   Since you are *certain* you will forget *E*, you are certain that tomorrow your credence will be Crₜ(*P*) = 0.3.

  **Applying the Principles:**

  1.  **Reflection Principle (RP):**
      *   Premise: Cr(Crₜ(*P*) = 0.3) = 1 (You are certain tomorrow's credence will be 0.3).
      *   RP Demand: Cr(*P* | Crₜ(*P*) = 0.3) must equal 0.3.
      *   **Problem:** Your *current* credence in *P*, given your *current* evidence *E*, is 0.8. Conditioning on the *fact* that you will later have Crₜ(*P*) = 0.3 (due to forgetting *E*) doesn't magically make *P* less likely *now*. Knowing you'll forget crucial evidence tomorrow doesn't change the truth *today*. RP forces you to lower your current credence to 0.3, which seems irrational. **RP fails in this scenario.** It demands deference to a future state known to be based on *less information*.

  2.  **Conservation of Expected Evidence (CEE):**
      *   Premise: CEE governs how credences *should* change *if you were to learn specific evidence*.
      *   **Analysis:** This scenario doesn't involve *learning* new evidence tomorrow; it involves *forgetting* current evidence. CEE doesn't directly model the *loss* of evidence. However, we can analyze the situation *before* taking the medication:
          *   "Forgetting *E*" is equivalent to learning the new evidence "¬*E*" *tomorrow*, but crucially, you *already know E today* and are *certain* you will "learn ¬*E*" tomorrow *only because you will forget E*.
          *   CEE *today* says: Cr(*P*) = Cr(See ¬*E* tomorrow) * Cr(*P* | See ¬*E* tomorrow) + Cr(See *E* tomorrow) * Cr(*P* | See *E* tomorrow)
          *   Given you are *certain* you will "see ¬*E*" tomorrow (because you'll forget *E*): Cr(See ¬*E* tomorrow) = 1, Cr(See *E* tomorrow) = 0.
          *   Cr(*P* | See ¬*E* tomorrow) = Cr(*P* | ¬*E*) = 0.3 (based on the evidence you *will* have).
          *   Therefore, CEE gives: Cr(*P*) = (1 * 0.3) + (0 * Cr(*P* | *E*)) = 0.3.
      *   **Interpretation:** CEE, applied *before* taking the medication, *does* tell you that your *current* expectation of what your credence *should be* tomorrow *after rationally updating on the evidence you will have* (which is only ¬*E*) is 0.3. **This aligns perfectly with your certainty about your future credence.** Crucially, CEE *does not demand that your current credence in P, given your current evidence E, be 0.3*. Your current credence Cr(*P*) is 0.8, based on *E*. CEE only tells you that your *expectation* of your *future rational posterior* (after the "evidence" of forgetting arrives) equals your *current prior* (0.8) *only if the future update is rational and based on anticipated evidence*. Here, the "evidence" (¬*E*) is misleading because it results from forgetting. CEE *describes* the math of the transition you anticipate, but it doesn't *endorse* Crₜ(*P*) = 0.3 as the *correct* credence *now*; it simply states that your *current expectation* of that future credence is 0.3 *because you are certain about the misleading evidence you'll have*. **CEE survives this scenario.** It accurately describes the relationship between your current prior (0.8) and your expected future posterior (0.3) *given your belief about the evidence you will receive*, without forcing your current belief to match the future one.

  **Which Principle Better Survives?**

  *   **CEE (Conservation of Expected Evidence) clearly survives.** It is a mathematical theorem describing the constraints of rational updating *in response to anticipated evidence*. In the memory loss case, it correctly calculates your expectation of your future rational credence *given the impoverished evidence set you anticipate having*. It makes no claim that your current credence should match that future credence when the future state is known to be epistemically compromised.
  *   **RP (Reflection Principle) fails decisively.** Its demand that your current credence match a future credence you are certain of, even when that future credence is known to be based on *less or misleading information* (like forgotten evidence), leads to an intuitively irrational result: lowering your current justified belief simply because you know you'll forget the justification later. This violates the core intuition that more (relevant) evidence should lead to better justified beliefs.

  **Conclusion:**

  Van Fraassen's Reflection Principle and Yudkowsky's Conservation of Expected Evidence are **fundamentally distinct**. RP is a stronger, more general, and more easily refuted *normative* claim about temporal coherence, demanding deference to any anticipated future credence state. CEE is a narrower, more robust *descriptive* theorem of probability theory, governing only how rational expectations constrain updates in response to *specific anticipated evidence*. The memory loss/persuasion-by-bad-argument scenarios vividly illustrate this difference: RP fails by demanding irrational current belief deference to a compromised future state, while CEE survives by accurately describing the (flawed) epistemic transition without endorsing the compromised state as correct for the present. Rationalist discussions often conflate them because both involve future credences, but RP's indifference to the source of belief change makes it a significantly different and more controversial principle.
