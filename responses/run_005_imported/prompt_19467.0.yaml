answer: |-
  You're misreading Anscombe's core argument, though it's an understandable mistake given the numbers discussion in her pamphlet. Here's why your friend is correct and how Anscombe's position differs from utilitarian calculus:

  1.  **Her Rejection of Utilitarianism:** Anscombe was a staunch opponent of consequentialism/utilitarianism. Her entire moral philosophy (rooted in Aristotle and Aquinas) emphasized intention, action-types, and absolute moral prohibitions. **She explicitly argues that deliberately killing the innocent is intrinsically evil, *regardless* of the consequences.**

  2.  **The Numbers Serve a Different Purpose:** While she does discuss estimates of potential invasion casualties versus atomic bomb deaths, **she doesn't use them to prove the bombs were "worse" in a utilitarian sense.** Her purpose is twofold:
      *   **To Refute the "Necessity" Argument:** She challenges the dominant narrative that the bombs *were necessary* to avoid a bloody invasion, arguing the estimates were unreliable, alternatives weren't exhausted, and Japan was likely closer to surrender than claimed. She uses numbers to show the claimed "necessity" justifying the act wasn't as clear-cut as proponents claimed.
      *   **To Highlight the Scale of the Evil:** She cites the huge number of civilian dead (over 100,000 instantly) to emphasize the sheer magnitude of the *intrinsically evil act* Truman ordered – the mass killing of non-combatants. The numbers demonstrate the horrific scale of the violation of the absolute prohibition.

  3.  **The Core Argument is About the Nature of the Act:**
      *   Anscombe argued that intentionally targeting a civilian population center with a weapon of mass destruction constitutes **the deliberate killing of innocent non-combatants.**
      *   In traditional Just War Theory and natural law ethics (which Anscombe adhered to), **deliberately killing the innocent is always murder.** It is a type of action that is categorically forbidden.
      *   Truman's decision wasn't a tragic choice between bad options where the "lesser evil" was chosen (a utilitarian framing). For Anscombe, **it was the choice to commit mass murder.** Choosing to murder innocents to achieve a good end (saving lives, ending the war) is never morally permissible. The end does not justify the means.

  4.  **The "Murderer" Charge:** Calling Truman a murderer flows directly from this deontological (duty-based) framework. He authorized an act that inherently involved the deliberate killing of innocents. That act, by its very nature, constitutes mass murder. **The utilitarian calculation of net lives saved is irrelevant to this moral judgment for Anscombe.** Even *if* the bomb saved more lives overall (which she disputed), it would still be murder – an intrinsically evil act.

  **Key Quotes from Anscombe Illustrating This:**

  *   "For men to choose to kill the innocent as a means to their ends is always murder."
  *   "Murder is the deliberate killing of the innocent, whether for its own sake or as a means to some further end."
  *   "With regard to the two bombs dropped on Japan... the people who decided that those bombs should be dropped were making themselves murderers. For to choose to kill the innocent as a means to your ends is always murder."
  *   On the honorary degree: "If you do *honour* such men... you can no longer maintain that murder is a horrible crime... you have abandoned the prohibition: 'Thou shalt do no murder.'"

  **In Summary:**

  *   **Your View:** Anscombe argues the bombs were worse *because* the utilitarian calculation shows more civilians died than would have died in an invasion. Therefore, Truman is a murderer based on the negative outcome.
  *   **Anscombe's Actual Argument:** Deliberately targeting and killing innocent civilians is murder *by its very nature*, an absolute moral evil. Truman authorized such an act. The discussion of numbers primarily aimed to undermine the *necessity* justification and highlight the scale of the evil act. **The charge of "murderer" stems from the intrinsic nature of the action he chose, *not* from a comparative utilitarian calculation showing a net loss of life.**

  Your interpretation flips her argument into the consequentialist framework she vehemently rejected. Her core case was deontological: the act itself was murder, regardless of consequences. The numbers were secondary, used to challenge the dominant justification and underscore the horror of the chosen means.
