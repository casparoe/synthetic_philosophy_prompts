  Then there's the tension with impartial benevolence. Sidgwick believes impartial benevolence is a self-evident principle, yet here he suggests withholding the full theory from most people. The reconciliation lies in the utilitarian calculus: universal access might lead to worse overall outcomes, so limiting it maximizes happiness. But this creates a paradox where the theory's dissemination could undermine its goals.

