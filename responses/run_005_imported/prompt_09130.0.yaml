answer: |-
  You've hit on a crucial tension in field linguistics: the gap between philosophical indeterminacy and practical lexicography. While Quine's gavagai problem highlights a profound theoretical limit, your intuition is largely correct for practical documentation work – **indeterminacy *can* be reduced to negligible levels through extensive, targeted data collection, though absolute certainty remains philosophically elusive.** 

  Here's a framework for achieving practical certainty before dictionary publication, focusing on scope rather than just raw corpus size:

  **Key Strategies to Mitigate Indeterminacy (Beyond Just Corpus Size):**

  1.  **Contextual Saturation, Not Just Quantity:**
      *   **Goal:** Document the lexeme in *all* plausible relevant contexts where ambiguity *could* arise.
      *   **Actions:**
          *   **Elicitation Scenarios:** Systematically test the word with pictures/videos/realia depicting: whole rabbits, rabbit parts (ears, feet, detached fur), live rabbits, dead rabbits, cooked rabbits, rabbit stages (baby, adult), multiple rabbits, rabbits interacting with other objects, rabbits at different times of day, rabbits in motion vs. stationary.
          *   **Natural Discourse:** Record hours of narratives, conversations, descriptions, and procedural texts (e.g., hunting, cooking, skinning) where rabbits (or the target concept) naturally occur. Look for co-occurring verbs (e.g., "see," "chase," "eat," "cut," "hold"), adjectives, quantifiers, and spatial terms.
          *   **Grammatical Frames:** Elicit the word in all relevant grammatical constructions: subject/object of verbs, with possessives, with demonstratives ("this gavagai," "that gavagai"), with plurals (if they exist), with classifiers (if used).
          *   **Negation & Contrast:** Test what *isn't* "gavagai" (e.g., "Is this fox a gavagai?" "Is this rabbit ear a gavagai?" "Is this rabbit from yesterday still gavagai?").

  2.  **Native Speaker Metalinguistic Judgments (Crucial):**
      *   **Goal:** Elicit explicit judgments *about* meaning, usage, and boundaries.
      *   **Actions:**
          *   **Translation & Paraphrase:** Ask for translations *into* the dominant contact language(s), but crucially, ask for paraphrases *within* the target language ("What does 'gavagai' mean?", "How would you explain it to a child?").
          *   **Acceptability Judgments:** Present constructed scenarios or sentences involving potential ambiguities ("If I see only a rabbit's ear sticking out, can I say I see 'gavagai'?", "If I cook the rabbit, is it still 'gavagai'?", "Can I use 'gavagai' for a rabbit I saw yesterday?"). Record *why* speakers accept or reject usages.
          *   **Boundary Testing:** Systematically probe edges (e.g., "Is a very young baby rabbit still 'gavagai'? What about a hare? What about a rabbit made of stone?").
          *   **Multiple Speakers:** Ensure judgments come from diverse speakers (age, gender, dialect, expertise) to identify consensus vs. variation. Document disagreements as valuable data.

  3.  **Exploiting Linguistic Structure:**
      *   **Goal:** Leverage the language's own grammatical system to disambiguate.
      *   **Actions:**
          *   **Pluralization/Mass/Count:** How does the word pluralize (if at all)? Does it behave like a count noun ("one gavagai, two gavagai") or a mass noun ("some gavagai")? This strongly argues against "undetached rabbit part" (typically mass) vs. "whole rabbit" (typically count).
          *   **Verbal Compatibility:** What actions can "gavagai" undergo? Verbs like "run," "jump," "see (whole)" strongly favor "whole enduring rabbit." Verbs like "cut," "attach," "be part of" might favor "part." Verbs like "appear," "vanish," might favor "temporal stage" (though this is rare as a primary meaning).
          *   **Spatial/Temporal Marking:** How does the language mark location or time on nouns? Does "gavagai" readily take temporal modifiers ("yesterday's gavagai")? This argues against "fleeting stage."

  **Practical Benchmarks for "Sufficient" Data (Before Dictionary Finalization):**

  It's impossible to give a single number (hours, words), but you should aim for **saturation** where:

  1.  **Contextual Coverage:** You have clear, unambiguous examples of the lexeme used in natural speech covering the core meaning (e.g., seeing/chasing/holding/killing/eating whole rabbits) *and* have explicitly tested the problematic edge cases (parts, stages, temporal persistence) via elicitation and judgments.
  2.  **Consensus & Variation:** You have documented judgments from multiple speakers (ideally 5-10+ representing key demographics) on the critical ambiguities. Consensus emerges on the core meaning and the boundaries. Any significant variation is documented in the dictionary entry.
  3.  **Grammatical Constraints:** The word's behavior within the language's grammar rules out the most philosophically troubling alternatives. For example, if it pluralizes like a count noun and takes possessive markers ("my gavagai"), "undetached rabbit part" becomes highly implausible as the *primary* meaning. If it readily takes temporal modifiers ("that gavagai from last week"), "fleeting temporal stage" is implausible.
  4.  **Absence of Counter-Evidence:** After extensive searching and targeted questioning, you find *no* natural examples or acceptable judgments supporting the "gavagai" meaning "undetached rabbit part" or "temporal rabbit stage" in isolation.
  5.  **Cultural Integration:** The word's usage aligns coherently with cultural knowledge and practices (e.g., stories about rabbits, hunting terms, kinship terms possibly derived from animal names).

  **What "Practical Certainty" Looks Like & Dictionary Presentation:**

  *   **You won't disprove Quine philosophically.** You *will* gather overwhelming evidence that "gavagai" functions *in all practical, communicative, and cultural contexts* as meaning "rabbit" (or "Rabbit" as a species, etc.).
  *   **The dictionary entry should reflect this practical reality:** Gloss it confidently as "rabbit" (or equivalent).
  *   **Transparency is Key:** Use notes to address potential ambiguities *if they arose during research* or are culturally relevant. E.g., "Primarily refers to the whole animal (*Oryctolagus cuniculus*). While rabbit parts (e.g., meat, fur) are referred to with specific terms (see `gavagai-kut` 'rabbit meat', `gavagai-pul` 'rabbit fur'), the whole animal term `gavagai` may be used metonymically in some contexts (e.g., 'There's gavagai in the pot' meaning rabbit meat). Speakers consistently reject `gavagai` for isolated parts or as referring only to momentary stages."
  *   **Document the Process:** Archive your elicitation protocols, judgment session notes, and examples used. This allows future linguists to see *why* you glossed it as "rabbit."

  **Conclusion:**

  For practical lexicography in an endangered language context, Quine's gavagai is less a show-stopper and more a **rigorous methodological checklist.** By proactively seeking disambiguating contexts, eliciting explicit native speaker judgments on potential ambiguities, and leveraging the language's own grammatical structures, you can reduce indeterminacy to a level where it no longer poses a *practical* problem for dictionary accuracy. Aim for **saturation of contexts and speaker consensus on boundaries**, documented transparently, rather than a specific corpus size. Your goal is to show that "rabbit" is the *only* meaning that makes consistent sense across the entire linguistic and cultural system you've documented. Proceed confidently with publication once this saturation and consensus are achieved.
