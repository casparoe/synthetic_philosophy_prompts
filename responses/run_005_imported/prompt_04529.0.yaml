answer: |-
  Here's the joke, playing directly on the epistemic logic of the no-trade theorem:

  ---

  Two hyper-rational economists, Alice and Bob, meet at a conference bar.  
  Alice says, "I'll bet you $50 that stock X will double by tomorrow. I’ve crunched the numbers—it’s 80% likely!"  
  Bob raises an eyebrow. "If you truly believed that, you’d mortgage your house to buy it, not waste time betting *me*. Your offer reveals you think the probability is lower."  
  Alice nods. "Ah, but if I *didn’t* believe it, I wouldn’t propose the bet. So by offering, I signal my confidence. You should accept!"  
  Bob smirks. "Unless you suspect *I* have private information. Your eagerness to bet against me suggests you think I’m underestimating the upside. That makes *me* update upward... which means I now agree with your 80%! So why trade?"  
  Alice pauses. "Damn. If we both assign 80% after updating, the expected value is symmetric. No gains from trade."  
  They sigh in unison.  
  Bob mutters, "Worse—your initial offer was evidence you overfit your model. I’m revising my prior *down*."  
  Alice throws up her hands. "Fine! Forget the bet. But since we’re here... can I sell you this pen?"  
  Bob stares at it. "The fact you’re selling tells me you value it less than my offer. No deal."  
  They sit in defeated silence, nursing warm sodas.  

  **Punchline:** The bartender slides them two whiskeys. "On the house. Watching you two update in real time was the most entertaining thing all week."  

  ---

  ### Why it works for the audience:  
  - **Turns on epistemic logic**: Each agent’s willingness to trade forces Bayesian updating (Alice’s offer makes Bob question her confidence, then Alice uses Bob’s refusal to argue for her sincerity).  
  - **Highlights common priors**: Both start rational/symmetric, but Alice’s offer injects asymmetry, triggering updates that collapse the trade’s profitability.  
  - **Nerdy payoff**: The bartender (outsider) profits from their rationality—underscoring how the theorem "kills" speculative deals but not non-speculative acts (free whiskey).  
  - **No lazy tropes**: No greedy traders—just agents rationally self-sabotaging via mutual updating. The pen bit mirrors real-world "revelation" paradoxes.  

  *Bonus: Economists would also chuckle at the whiskey—a Pareto improvement via external subsidy, sidestepping the theorem entirely.*
