  We are writing a joke that plays on the no-trade theorem. The theorem states that if two rational agents have common prior beliefs and there is no asymmetric information (or they have symmetric information), then they cannot agree to a trade that both expect to be profitable. The idea is that if one is willing to trade, the other should infer that there might be something wrong and update their beliefs accordingly.

   The joke should turn on the epistemic logic: one trader's willingness to trade should reveal information to the other, leading them to update and thus not trade.

