prompt: |-
  I'm taking a graduate seminar on experimental philosophy this term, cross-listed with cognitive science, and this week's unit is Joshua Knobe's side-effect effect. We started, like everyone does, with the original 2003 chairman vignette: a CEO who adopts a profitable new policy knowing it will, as a side effect, harm the environment is overwhelmingly judged to have harmed it "intentionally," while a CEO who adopts an equally profitable policy knowing it will help the environment is mostly judged not to have helped it intentionally, even though the two scenarios are identical in structure and differ only in the moral valence of the foreseen side effect. What I'm now struggling with is the thicket of rival explanations that has grown up around that single result, because next week I owe a short position paper that has to adjudicate between them rather than just redescribe the chairman case, and a few of us got into an argument after seminar about which explanation is actually winning at this point in the literature.

  The five accounts on our reading list are: Knobe's own claim that the folk concept of "intentional action" is itself partly constituted by moral evaluation, so the concept genuinely applies differently across the two cases; Adams and Steadman's pragmatic account, on which the concept applies the same way in both cases and only the conversational appropriateness of asserting "intentionally" shifts, since denying it in the harm case would seem to excuse the CEO and asserting it in the help case would seem to give him credit he does not deserve; Machery's trade-off hypothesis, on which the asymmetry is really driven by whether the agent knowingly imposes a cost on someone else to secure a benefit for himself, with moral valence as such doing no independent work; Sripada's deep self concordance model, on which the judgment tracks whether the outcome is concordant with the agent's stable cares and values rather than merely incidental to them; and a more general "evaluative bias" position, for which the strongest evidence is that Beebe and Buckwalter later found essentially the same harm/help asymmetry for knowledge attributions, suggesting the phenomenon has nothing special to do with the concept of intentional action at all.

  Could you rank these five accounts by how well they hold up against that whole accumulated record, including the trade-off cases designed to strip out moral valence, the omission variants, and the parallel effects on knowledge and causal judgments, rather than by how elegant or intuitive each sounds taken on its own? Please give the ranking as a JSON object with categories running from "S" (currently the best-supported account) down to "D" (an account you think the later evidence has largely undermined), formatted like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  You may leave a category empty, or place more than one account in it if you genuinely think they are tied. After the JSON, add no more than one sentence per non-empty category explaining the single hardest placement decision you had to make.
reasoning: |-
  We are ranking five accounts of the Knobe effect (side-effect effect) based on empirical support from the literature, including variations like trade-off cases, omission variants, and parallel effects on knowledge/causal judgments.

  The accounts:
  1. Knobe's own account: Moral evaluation partly constitutes the folk concept of intentional action.
  2. Adams and Steadman's pragmatic account: The concept of intentional action is the same, but conversational pragmatics make "intentionally" appropriate in harm and inappropriate in help.
  3. Machery's trade-off hypothesis: Asymmetry is driven by the agent imposing a cost on others for self-benefit, not moral valence per se.
  4. Sripada's deep self concordance: Judgment depends on whether the outcome aligns with the agent's stable values (concordant) or not.
  5. General evaluative bias: The asymmetry is not specific to intentional action but extends to knowledge and causal judgments (Beebe & Buckwalter).

  Key evidence to consider:
  - Trade-off cases: Machery (2008) showed that when the side-effect is harmful but the agent does not benefit (e.g., harming the environment without profit), the intentionality judgment drops, suggesting that the trade-off (self-benefit at others' cost) is key. However, in the original Knobe case, the harm condition has a trade-off and the help condition does not (the CEO benefits without imposing a cost). But note: in the help condition, the CEO helps without imposing a cost? Actually, in the help case, the CEO gets a benefit and the environment is helped. There is no cost to anyone. So the trade-off hypothesis says that the asymmetry arises because in harm, the agent imposes a cost on others for self-benefit, whereas in help, there is no such imposition. This account can explain why in non-trade-off harm cases (e.g., harming without benefit) the intentionality judgment is low. But what about help? If we have a case where helping imposes a cost on the agent, does it become intentional? Evidence is mixed.

  - Omission variants: In some studies, when the side effect is brought about by omission (e.g., not acting to prevent harm) the effect is weaker or reversed. This challenges some accounts.

  - Parallel effects: Beebe and Buckwalter (2010) found that people are more likely to say the CEO "knew" the harm would occur than that he "knew" the help would occur, even though the epistemic conditions are identical. This has been extended to causal judgments and other concepts. This suggests a general evaluative bias that is not specific to intentional action.

  Ranking against the accumulated evidence:

  - The general evaluative bias account (account 5) is strongly supported by the extension to knowledge and causal judgments. If the same asymmetry appears for "knowingly" and "caused", then it cannot be about the concept of intentional action per se. This account is the most parsimonious and has broad empirical support.

  - Machery's trade-off hypothesis (account 3) also has strong support because it can explain why the effect disappears when there is no trade-off (e.g., the agent does not benefit). However, note that the trade-off hypothesis is about the structure of the action (imposing costs on others for self-benefit) and not about moral valence per se. But the trade-off hypothesis does not easily explain the knowledge asymmetry, unless we posit that the same mechanism applies to knowledge, which is possible but not directly addressed.

  - Sripada's deep self concordance (account 4) has some support because it can explain why the effect might be sensitive to the agent's values. For example, if the CEO is an environmentalist, then helping might be judged as intentional. However, the standard Knobe case does not specify the CEO's values, so the default might be that harming is taken as revealing a callous deep self. But the omission cases are problematic: if the CEO omits to prevent harm, does that show his deep self? Also, the knowledge effect is not obviously explained by deep self.

  - Knobe's original account (account 1) is challenged by the extension to knowledge. If the same asymmetry appears for knowledge, then it cannot be that the folk concept of intentional action is uniquely constituted by moral evaluation. However, Knobe might argue that the moral evaluation affects multiple concepts. But the parsimony of the general evaluative bias account undermines this.

  - Adams and Steadman's pragmatic account (account 2) has been largely undermined by evidence that the asymmetry persists in non-pragmatic contexts (e.g., when participants are asked about the CEO's mental state without using the word "intentionally", or in within-subjects designs). Also, the knowledge effect is hard to explain pragmatically because denying knowledge in the help case doesn't seem to have the same pragmatic implications (e.g., excusing) as denying intentionality. Moreover, the effect is found in cases where the agent is not blameworthy or praiseworthy (e.g., when the side effect is neutral).

  Given the above:

  - The general evaluative bias (5) seems the most robust because it accounts for multiple concepts (intentional, knowledge, causal) and is supported by the Beebe and Buckwalter findings and others.

  - Machery's trade-off (3) is also strong but might be a specific instance of the evaluative bias? Or it might be a separate factor. However, the trade-off hypothesis does not explain why the asymmetry occurs for knowledge. So it might be that the trade-off triggers the evaluative bias, but the bias is more general.

  - Sripada's account (4) has some support but is challenged by omission cases and the knowledge effect.

  - Knobe's account (1) is challenged by the knowledge effect and the omission cases.

  - Adams and Steadman (2) has been largely refuted by empirical tests.

  But note: recent work has shown that the effect is modulated by the agent's values (supporting Sripada) and by the presence of a trade-off (supporting Machery). However, the general evaluative bias might be the overarching phenomenon.

  Ranking:

  S: General evaluative bias (5) - because it explains the breadth of the phenomenon across concepts and is parsimonious.

  A: Machery's trade-off hypothesis (3) - because it accounts for many variations in the intentionality judgments, especially when trade-off is manipulated, but it doesn't extend as naturally to knowledge.

  B: Sripada's deep self concordance (4) - it has explanatory power for intentional action, especially in cases where the agent's values are specified, but it doesn't easily explain the knowledge effect.

  C: Knobe's original account (1) - while it started the field, the evidence from other concepts (knowledge) suggests it's too narrow.

  D: Adams and Steadman's pragmatic account (2) - it has been largely undermined by evidence that the asymmetry is not due to conversational pragmatics.

  But note: the trade-off hypothesis might be compatible with the evaluative bias. However, the question is about how well each holds up against the whole record. The evaluative bias is the most comprehensive.

  Another point: the trade-off hypothesis might be seen as a refinement of the conditions under which evaluative bias occurs. But the ranking should be by empirical support.

  Also, in the omission cases, the effect is sometimes reversed (people are more likely to say an omission to prevent harm is intentional than an omission to help). This is hard for the trade-off hypothesis because omission doesn't involve an active imposition. The evaluative bias account can handle this if the omission is seen as blameworthy.

  Placement:

  S: [5] (evaluative bias)
  A: [3] (trade-off)
  B: [4] (deep self)
  C: [1] (Knobe)
  D: [2] (pragmatic)

  But note: there might be ties? The literature is complex and no single account explains everything. However, the evaluative bias is the most supported overall.

  Hardest decision: Placing the trade-off hypothesis (3) in A and not in S. The reason is that while it explains many intentional action cases, it does not extend to the knowledge asymmetry without additional assumptions. The evaluative bias account, however, explains both.

