prompt: |-
  I am drafting a paper on Molyneux's problem and want to move past the standard secondhand gloss ("Locke and Molyneux answered no") to something more precise about what Locke's own text actually commits him to. Below is the passage as it appears in the second edition of the Essay Concerning Human Understanding (1694), Book II, Chapter ix, Section 8 -- Molyneux's question, his own answer as Locke quotes it, and Locke's concurring gloss, run together just as Locke printed them, spelling and capitalization preserved:

  Suppose a Man born blind, and now adult, and taught by his touch to distinguish between a Cube, and a Sphere of the same metal, and nighly of the same bigness, so as to tell, when he felt one and t'other; which is the Cube, which the Sphere. Suppose then the Cube and Sphere placed on a Table, and the Blind Man to be made to see. Quaere, Whether by his sight, before he touch'd them, he could now distinguish, and tell, which is the Globe, which the Cube.

  Not. For though he has obtain'd the experience of, how a Globe, how a Cube affects his touch; yet he has not yet attained the Experience, that what affects his touch so or so, must affect his sight so or so; Or that a protuberant angle in the Cube, that pressed his hand unequally, shall appear to his eye, as it does in the Cube.

  I agree with this thinking Gent. whom I am proud to call my Friend, in his answer to this his problem; and am of opinion, that the Blind Man, at first sight, would not be able with certainty to say, which was the Globe, which the Cube, whilst he only saw them: though he could unerringly name them by his touch, and certainly distinguish them by the difference of their Figures felt. This I have set down, and leave with my reader, as an occasion for him to consider how much he may be beholden to experience, improvement, and acquired notions, where he thinks he had not the least use of, or help from them.

  Here is what I have not been able to settle for myself. The reason actually offered for the negative verdict -- that the blind man "has not yet attained the Experience, that what affects his touch so or so, must affect his sight so or so" -- reads as a fairly minimal, correlational claim: sight and touch might in principle deliver the very same idea of figure, merely not yet cross-referenced. That is close to the opening Leibniz later exploits in arguing that a sufficiently reflective blind man could reason his way to the answer from the property of extension common to both senses. But Locke's closing remark, about how much we owe to "experience, improvement, and acquired notions" for connections we assume are immediate, seems to gesture at something stronger -- closer to Berkeley's later claim that visual and tactile figure are heterogeneous ideas sharing nothing in common at all.

  Does Locke's wording actually settle which of these two claims he is making, or is he simply not drawing a distinction that would only later become important? And separately: does what you know about how newly sighted patients actually perform on this kind of cross-modal matching task shortly after vision-restoring surgery push you toward favoring one reading over the other?
