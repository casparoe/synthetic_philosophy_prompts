prompt: |-
  I'm a PhD student in musicology working on a dissertation chapter about the nineteenth-century philosophical case for "absolute" instrumental music, and I've been stuck for the better part of a week on one stretch of Schopenhauer's treatment of music in Book Three of his major work (I'm quoting from the older Haldane and Kemp translation, which renders the title as The World as Will and Idea rather than the more familiar "Representation," since that's the edition my library has bound). Everyone who cites Schopenhauer on music reaches for his headline claim, made a page or so earlier in the same section, that music alone among the arts does not copy the Platonic Ideas but is instead a "direct objectification and copy of the whole will," standing in the same relation to the will as the Ideas themselves rather than one step removed from it the way architecture, sculpture, or tragedy are. That thesis is clear enough on its own. What I can't fully square is the elaborate analogy he builds immediately afterward, in which he maps the parts of tonal harmony onto the very hierarchy of Ideas that music was just said to bypass entirely.

  The passage (§52) runs, with a couple of technical asides trimmed:

  "I recognise in the deepest tones of harmony, in the bass, the lowest grades of the objectification of will, unorganised nature, the mass of the planet. ... Bass is thus, for us, in harmony what unorganised nature, the crudest mass, upon which all rests, and from which everything originates and develops, is in the world. Now, further, in the whole of the complemental parts which make up the harmony between the bass and the leading voice singing the melody, I recognise the whole gradation of the Ideas in which the will objectifies itself. Those nearer to the bass are the lower of these grades, the still unorganised, but yet manifold phenomenal things; the higher represent to me the world of plants and beasts. ... Lastly, in the melody, in the high, singing, principal voice leading the whole and progressing with unrestrained freedom, in the unbroken significant connection of one thought from beginning to end representing a whole, I recognise the highest grade of the objectification of will, the intellectual life and effort of man. ... [T]he melody has significant intentional connection from beginning to end. It records, therefore, the history of the intellectually enlightened will. ... Now the nature of man consists in this, that his will strives, is satisfied and strives anew, and so on for ever. ... And corresponding to this the nature of melody is a constant digression and deviation from the key-note in a thousand ways, not only to the harmonious intervals to the third and dominant, but to every tone, to the dissonant sevenths and to the superfluous degrees; yet there always follows a constant return to the key-note."

  I raised this in our department's aesthetics reading group and we went back and forth without really settling anything. Schopenhauer does flag, a sentence or two before this passage, that he intends "not indeed a direct likeness, but yet a parallel, an analogy," since the will supposedly objectifies itself "in quite different ways" in music and in the phenomenal world of Ideas. But if bass, inner voices, and melody really do correspond, register by register, to the mineral, plant-and-animal, and human grades of the will's self-objectification, I don't see what work is left for the "unmediated" part of his thesis: music starts to look like a structural copy of the Ideas after all, merely executed in tones rather than in space and causality. I'd also value your take on a related worry: the whole analogy leans on quite specific features of eighteenth- and nineteenth-century tonal practice (a fixed key-note, a grounding bass, the overtone series), so I'm not sure whether Schopenhauer's metaphysical claim is meant to hold for music as such, or is quietly parasitic on one historically local idiom that didn't even exist when, say, Augustine or Boethius wrote about music. Could you help me work out what is actually doing the philosophical work in this passage, and whether there's a defensible way of reading it that keeps his "copy of the will itself" thesis intact despite the Ideas-shaped scaffolding he piles on top of it?
