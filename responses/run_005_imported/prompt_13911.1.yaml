  Looking at Priya's essay, she does a solid job explaining Kuhn's framework: normal science, anomalies leading to crisis, and revolutions. Her historical example with Priestley and Lavoisier is accurate - she correctly identifies that Priestley called his discovery "dephlogisticated air" while Lavoisier named it "oxygen." She also captures the core of incommensurability well: the idea that paradigms lack shared vocabulary, making transitions non-logical.

