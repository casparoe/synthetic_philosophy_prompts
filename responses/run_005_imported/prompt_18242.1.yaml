prompt: |-
  So in my research methods seminar this week we got into the whole frequentist vs Bayesian thing and my prof gave us this example that kind of broke my brain a little. She said imagine two researchers end up with the exact same data, like 9 heads out of 12 coin flips, but researcher A had decided beforehand "I'm flipping exactly 12 times" while researcher B decided "I'm gonna keep flipping until I get 3 tails," and it just happened to also take him 12 flips to get there. Even though the observed data is literally identical, apparently the p-value you get for testing whether the coin is fair comes out different for A vs B, because it depends on the stopping rule/sampling plan and not just on what was actually observed. She said this ties into something called the "likelihood principle" that Bayesians like to invoke, and that its also connected to why "optional stopping" (peeking at your data partway through and deciding whether to collect more) counts as one of those shady researcher-degrees-of-freedom things that fed into the replication crisis.

  Honestly I got kind of lost on the actual mechanics of why the math comes out different for A vs B, and I'm a little skeptical of the bigger claim too — like is this stopping-rule stuff actually a real driver of failed replications in fields like psych and biomedicine, or is it more of a cute textbook paradox that doesn't matter that much next to stuff like publication bias and small sample sizes? We've got a short response paper due on this next week and I don't just want to parrot back what she said in lecture without actually getting it myself. Could you break down (1) why the p-values genuinely diverge between the two designs despite the identical data, (2) how the likelihood principle is supposed to explain why a Bayesian analysis wouldn't run into this problem, and (3) give me your honest take on how much explanatory weight this stopping-rule issue really deserves for the replication crisis compared to the other usual suspects?
reasoning: |-
  Okay, the user is grappling with a complex statistical concept from their research methods seminar. They're confused about why two researchers with identical data (9 heads in 12 coin flips) get different p-values based on their stopping rules (fixed N vs. fixed tails). They're also skeptical about how much this stopping rule issue actually contributes to the replication crisis compared to other factors like publication bias.

  Hmm, this is a classic example that reveals the philosophical rift between frequentist and Bayesian statistics. The user needs both a technical explanation of the p-value divergence and a practical assessment of its real-world importance. Their underlying concern seems to be: "Should I care about this beyond passing my assignment?"

  First, I should unpack why the p-values differ. For Researcher A (fixed N=12), the p-value calculation considers all possible outcomes with 12 flips - specifically how extreme 9+ heads are in a binomial distribution. But Researcher B (flipped until 3 tails) implies a negative binomial scenario. Here, "more extreme" means getting 9+ heads faster (in fewer flips) or taking more flips to get 3 tails. The sample space includes possibilities like getting 3 tails in 9 flips (which would be even more extreme) or needing 15 flips (less extreme). That's why the math differs even with identical data.

  The likelihood principle point is crucial here. Bayesians only care about the actual data observed (9H/3T), not unobserved possibilities. Their posterior distribution depends solely on this data plus prior, ignoring the sampling plan. This feels more intuitive but introduces its own controversies about priors.

  Now for the real-world impact question... The user's skepticism is healthy. While optional stopping absolutely can inflate false positives, in practice it's probably not the main villain of the replication crisis. I'd estimate it contributes maybe 10-20% compared to giants like low power, p-hacking, publication bias, and flexibility in analysis. Still, it's insidious because it's often unintentional - researchers don't realize how much peeking corrupts their error rates.

  The user seems to want permission to acknowledge this as theoretically important without overstating its practical role. That's balanced. I'll emphasize that stopping rules matter most in strict Neyman-Pearson testing contexts, whereas many modern psychologists use mixed approaches. Still, teaching researchers about this quirk exposes deeper issues about how statistical paradigms shape interpretation.

  For their response paper, they should demonstrate understanding of the mechanics (maybe sketch the probability distributions), articulate why likelihood principle resolves it for Bayesians, then critically evaluate its real-world weight. The prof will appreciate that they didn't just swallow the lecture whole.
answer: |-
  You've hit on one of the deepest conceptual rifts in statistics! Your professor's example is brilliant because it exposes the frequentist dependence on the *sampling plan*, not just the data. Let's break this down step-by-step.

  **1. Why the p-values diverge for Researcher A vs. Researcher B:**

  The key is understanding **what the p-value actually measures** under the frequentist paradigm: *The probability of observing data **as extreme as, or more extreme than,** what was actually observed, **assuming the null hypothesis (H0: coin is fair) is true, AND given the specific sampling plan/stopping rule.***

  *   **Researcher A (Fixed N = 12):**
      *   **Sampling Distribution:** Binomial(n=12, p=0.5 under H0).
      *   **Test Statistic:** Number of Heads (k).
      *   **Observed Data:** k = 9 Heads.
      *   **P-value:** Probability of k >= 9 Heads under Binomial(12, 0.5).
          *   P(k=9) = (12 choose 9) * (0.5)^12 ≈ 0.0537
          *   P(k=10) ≈ 0.0161
          *   P(k=11) ≈ 0.0029
          *   P(k=12) ≈ 0.0002
          *   **Total P-value (one-tailed):** ≈ 0.0537 + 0.0161 + 0.0029 + 0.0002 = **0.0730**
      *   *Interpretation:* Under H0, there's a 7.3% chance of getting 9 or more Heads in exactly 12 flips.

  *   **Researcher B (Fixed Tails = 3):**
      *   **Sampling Distribution:** Negative Binomial (number of successes (Heads) until r=3 failures (Tails) occur, with p=0.5 under H0).
      *   **Test Statistic:** Total number of flips (N) required to get 3 Tails (equivalent to number of Heads + 3). "More extreme" means evidence *even more strongly favoring Heads* than getting 9 Heads in 12 flips.
      *   **Observed Data:** N = 12 flips to get 3 Tails (implies k=9 Heads).
      *   **P-value:** Probability of needing *N <= 12 flips* to get 3 Tails under H0? **No!** "More extreme" evidence *for an excess of Heads* (the alternative) would be getting the 3rd Tail *even sooner* (i.e., with *more* Heads relative to Tails in fewer flips), or taking *even longer* to get the 3rd Tail (i.e., getting *even more* Heads relative to the fixed Tails).
          *   *Getting 3 Tails faster (more extreme Heads bias):* e.g., Getting 3 Tails in N=9 flips (k=6 Heads), N=10 flips (k=7 Heads), N=11 flips (k=8 Heads). These outcomes have *more* Heads relative to flips or relative to the fixed Tails than the observed data.
          *   *Getting 3 Tails slower (more extreme Heads bias):* e.g., Needing N=13 flips (k=10 Heads), N=14 flips (k=11 Heads), etc. These outcomes have *even more* Heads before reaching the 3rd Tail.
      *   **Calculating P-value:** Sum probabilities of all sequences where it takes *<= 12 flips AND has k >= 9 Heads* **OR** takes *> 12 flips* (which inherently means k > 9 Heads when the 3rd Tail finally occurs).
          *   P(N <= 12 *and* k >=9): This includes the observed outcome (N=12, k=9) and more extreme "faster" outcomes (N=9/k=6, N=10/k=7, N=11/k=8). Calculate using Negative Binomial PMF.
          *   P(N > 12): This is equivalent to P(k >= 10 Heads *before* the 3rd Tail occurs in the first 12 flips). Calculate using the complement of the CDF of the Negative Binomial (or equivalently, using the Binomial probability of having fewer than 3 Tails in 12 flips: P(fewer than 3 Tails in 12 flips) = P(0T) + P(1T) + P(2T) under Binomial(12, 0.5)).
              *   P(0 Tails in 12) = (0.5)^12 ≈ 0.0002
              *   P(1 Tail in 12) = (12 choose 1) * (0.5)^12 ≈ 0.0029
              *   P(2 Tails in 12) = (12 choose 2) * (0.5)^12 ≈ 0.0161
              *   **P(N > 12) = P(fewer than 3 Tails in 12 flips)** ≈ 0.0002 + 0.0029 + 0.0161 = **0.0193**
          *   **Total P-value:** P(N<=12 and k>=9) + P(N>12) ≈ [Calculated Prob for N=9,10,11,12 with k>=9] + 0.0193. *Crucially, this sum will be LARGER than Researcher A's p-value.* (Detailed calculation often lands around **0.0325 - 0.035**).
      *   *Interpretation:* Under H0, there's only a ~3.3% chance of either getting 3 Tails in 12 or fewer flips *with at least 9 Heads* OR needing more than 12 flips to get the 3rd Tail.

  **Why the Difference?** The p-value depends on the *space of possible unobserved outcomes* defined by the stopping rule. Researcher A's plan defines "more extreme" as more Heads *in exactly 12 flips*. Researcher B's plan defines "more extreme" as getting the fixed number of Tails *faster with high Heads counts* OR *slower* (which implies even higher Heads counts). The sampling distributions (Binomial vs. Negative Binomial) and the sets of "more extreme" outcomes are fundamentally different, leading to different p-values for the same observed data (9H, 3T in 12 flips).

  **2. The Likelihood Principle & Bayesian Immunity:**

  *   **The Likelihood Principle (LP):** Simply stated, the LP says: *All the information about an unknown parameter θ (e.g., probability of Heads) contained in the observed data (D) is provided by the likelihood function, L(θ | D) = P(D | θ). Furthermore, if two experiments yield proportional likelihood functions for θ, they provide identical evidence about θ.*
  *   **Applying LP to the Coin Example:**
      *   **Observed Data (D):** 9 Heads, 3 Tails, regardless of stopping rule.
      *   **Likelihood Function (L(p | D)):** The probability of observing *this specific sequence* of 9H and 3T under a probability `p` of Heads. For *any* sampling plan that resulted in exactly 9H and 3T in some order, this likelihood is proportional to `p⁹ * (1-p)³`.
      *   **Key Point:** The stopping rule (fixed N or fixed Tails) only affects the probability of *sequences that weren't observed*. The LP says these unobserved possibilities are irrelevant for inference about `p` once you have D. Only the actual data matters.
  *   **Bayesian Analysis & LP:**
      *   Bayes' Theorem: Posterior ∝ Likelihood * Prior → `P(p | D) ∝ P(D | p) * P(p) = [p⁹ * (1-p)³] * P(p)`
      *   **The likelihood term `P(D | p)` is IDENTICAL for both researchers** because the observed data D (9H, 3T) is identical. Any difference in the posterior distribution between Researcher A and B would *only* come from them choosing different prior distributions `P(p)`, **not** from the stopping rule.
      *   Bayesians condition *only on the observed data D*. The sampling plan, which dictates how data *could have been* but wasn't, doesn't factor into the calculation of the posterior probability about `p`. The Bayesian answer for the strength of evidence about `p` depends only on D (via the likelihood) and the prior, not on the researcher's intentions.

  **3. Honest Take: Stopping Rules & the Replication Crisis - Weight and Context**

  This is where statistics meets messy scientific practice. Your skepticism is warranted.

  *   **It IS a Real Problem (Theoretical & Practical):**
      *   **Theoretical Validity:** Frequentist error rates (Type I, Type II, coverage of confidence intervals) *are* guaranteed *only* if the pre-specified sampling plan is adhered to. Optional stopping (peeking and deciding whether to collect more data based on interim results) **systematically inflates Type I error rates** and makes p-values essentially meaningless in the frequentist paradigm. The coin example is a stark demonstration of why.
      *   **Real-World Occurrence:** Optional stopping ("data peeking") is **extremely common** in practice, often unintentionally or due to pressure to find significant results. Researchers running a study with N=50, peeking at N=30, seeing a promising p=0.07, and deciding "let's collect 20 more subjects" is a classic example. This inflates the false positive rate far above 5%.
      *   **Contribution to False Positives:** Simulation studies clearly show optional stopping can substantially inflate false positive rates. If many researchers in a field engage in it, it contributes directly to a glut of published, but unreliable, statistically significant findings.
  *   **BUT, It's NOT the Biggest Driver (Explanatory Weight):**
      *   **The Usual Suspects are Heavier:**
          *   **Low Statistical Power:** Small sample sizes are endemic (especially in older psych/biomed). Low power (< 80%) drastically increases the **False Negative** rate *and* means that the few "significant" results that *do* get published have a high probability of being **False Positives** (low positive predictive value), especially when combined with publication bias. This is arguably the single biggest technical contributor.
          *   **Publication Bias / The File Drawer Problem:** Non-significant results rarely get published. This massively distorts the literature, making effects appear more consistent and larger than they are. A "significant" p-value from a small, underpowered study is much more likely to be published than 5 non-significant ones.
          *   **P-Hacking / Researcher Degrees of Freedom (RDF):** Optional stopping is just *one* form of RDF. Others are far more prevalent and impactful: selectively choosing which variables/covariates to include/exclude, trying multiple analyses (e.g., different outcome transformations, subgroup analyses), selectively reporting dependent variables or conditions, hypothesizing after results are known (HARKing). These flexibilities allow researchers to "torture the data until it confesses," drastically inflating false positives across the board.
          *   **Questionable Research Practices (QRPs):** Encompasses p-hacking, optional stopping, HARKing, selective reporting. Surveys suggest QRPs were widespread.
      *   **Relative Weight:** While crucial conceptually, I'd argue optional stopping *specifically* is likely a **secondary contributor** compared to **low power, publication bias, and broader p-hacking/RDF.**
          *   *Reasoning:* Many failed replications involve studies where the *original* study was underpowered and likely benefited from publication bias or other forms of p-hacking *more directly* than optional stopping (though they often co-occur). Stopping rules are harder to track/audit than sample size or analysis choices. Broader RDF offers more "flexibility" to find significance than just optional stopping.

  **Synthesis for Your Response:**

  1.  **Explain the Math:** Clearly articulate how the p-value definition depends on the sampling distribution defined by the stopping rule. Researcher A uses the Binomial distribution ("more Heads *in N=12*"). Researcher B uses the Negative Binomial distribution ("more Heads *relative to fixed Tails=3*", including outcomes with N<12 *or* N>12). The sets of "more extreme" outcomes differ, hence the p-values differ.
  2.  **Explain the LP & Bayesianism:** Emphasize that the LP states that only the observed data matters for inference. The likelihood `p⁹(1-p)³` is identical for both researchers. Bayesians use this likelihood combined with a prior to form the posterior; the stopping rule doesn't enter the equation. Frequentist inference violates the LP by depending on the sampling plan.
  3.  **Balanced Assessment:** Acknowledge that optional stopping **is a real and serious problem** that inflates false positives and contributed to unreliable findings, demonstrating a deep flaw in how frequentist inference is often (mis)applied. **However, argue convincingly that it is likely a secondary driver compared to the powerhouse trio of chronically low statistical power, pervasive publication bias, and the broader spectrum of p-hacking/researcher degrees of freedom.** These factors are more easily observable, more widespread in their application, and demonstrably have a larger distorting effect on the published literature. The stopping rule issue is a profound conceptual illustration of the fragility of p-values when protocols aren't strictly followed, but the replication crisis stems from a much wider ecosystem of methodological and incentive problems.

  This nuanced view shows you understand both the technical depth of the statistical issue *and* the practical realities of scientific research. Good luck with your response paper!
