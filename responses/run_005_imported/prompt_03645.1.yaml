  So I'm outlining a novel where my protagonist gets a corpus callosotomy for severe epilepsy. From what I've read, that surgery basically reveals that she'd secretly been two seperate conscious minds sharing one skull the whole time, just cooperating so smoothly before the surgery that she never noticed there were two of her. I'm planning a slow-burn scene where the 'other' mind starts asserting itself in everyday choices, disagreeing with the one that narrates the book. Whats the most realistic version of that kind of conflict, going off how split-brain patients actually behave day to day?
reasoning: |-
