answer: |-
  Here's a logical reconstruction of Hobbes's argument from the passage, addressing your specific questions point-by-point:

  **Hobbes's Core Argument (Reconstructed):**

  1.  **Premise 1 (Criterion for Demonstrative Science):** A science is demonstrable *if and only if* the scientist has **precognition of the causes, generation, and construction** of its subject matter.
  2.  **Premise 2 (Source of Precognition):** Such precognition is only possible when the scientist is the **maker (artist)** of the subject matter itself. Only the maker has direct, certain knowledge of *how* and *why* the thing is constructed as it is (its causes and generation).
  3.  **Premise 3 (The Maker's Knowledge Principle):** Therefore, **demonstration is only possible where the subject is constructed by the knower.** Demonstration is the deduction of necessary consequences from the known operations performed in the construction.
  4.  **Application to Geometry:**
      *   Geometrical objects (lines, figures) are **constructed by the geometer** (drawn, described).
      *   Therefore, the geometer has precognition of their causes/generation/construction (e.g., a circle is generated by rotating a line segment around one endpoint).
      *   Therefore, geometry is demonstrable. The geometer deduces properties from the definitions and postulates describing their own constructive operations.
  5.  **Application to Civil Philosophy:**
      *   Commonwealths (states, civil societies) are **constructed by humans** through covenant (the social contract).
      *   Therefore, the political philosopher (as a participant/observer of this human artifice) can have precognition of its causes/generation/construction (human fear, reason, agreement).
      *   Therefore, civil philosophy is demonstrable. The philosopher deduces the necessary properties and consequences of sovereignty, law, obligation, etc., from the known principles of human nature and the act of covenanting.
  6.  **Application to Natural Philosophy (Physics):**
      *   Natural bodies (e.g., stones, trees, planets) are **not constructed by humans.** We did not make them; we encounter them as given.
      *   Therefore, we **lack precognition of their true causes, generation, and construction.** We only observe their effects.
      *   Therefore, natural philosophy **cannot be demonstrative in the strict sense.** We cannot deduce properties from known, certain first causes of generation.
      *   **Consequence:** We can only reason hypothetically ("of what they *may* be") from observed effects back to *possible* causes. This yields probable knowledge, not certainty.

  **Addressing Your Questions:**

  1.  **What does the epistemic work? Construction vs. Axioms/Inference:**
      *   Hobbes *is* saying that the certainty of geometry stems **primarily from our role as makers.** While valid inference from clear definitions and axioms is crucial, the *ultimate foundation* of that certainty is that the objects defined and reasoned about are products of our own constructive acts.
      *   **Why?** Axioms and definitions gain their clarity and indubitability *because* they describe operations we perform and understand perfectly (e.g., "a straight line is the shortest distance between two points" describes the act of drawing such a line). We know the cause (our drawing) and the effect (the line) with absolute certainty. The inference is valid *because* the premises are certain *because* they describe our own operations. The "maker's knowledge" is the bedrock.

  2.  **How does "maker's knowledge" license demonstrability in Civil Philosophy? What is preserved?**
      *   **The Preserved Element:** What is preserved is the **artificiality and deliberate construction.** Hobbes's key move is conceptualizing the commonwealth not as a natural growth or historical accident, but as an *artifact* deliberately created by human reason and agreement to solve the problem of the state of nature.
      *   **Relevant Sense of "We Make":** "We" refers to humans collectively acting rationally. The "making" is the act of covenanting – individuals mutually transferring rights and authorizing a sovereign power. This act of creation is analogous to the geometer drawing a figure: it's a defined operation with a clear intended purpose (security/peace).
      *   **Handling the "Messiness":** Hobbes acknowledges the messiness of *actual* historical states. His claim is about the *principles* and *rationale* of the commonwealth *as such*. He argues we can demonstrate with certainty the *necessary conditions* for a stable commonwealth (absolute sovereignty, the logic of authorization, the definition of law as command, the source of obligation) *because* these flow logically from the purpose (peace/security) and the means (covenant/authorization) of its construction. Actual states may deviate from this rational model, but the model itself is demonstrable.

  3.  **Different/Weaker Science in Physics? Underdetermination or More?**
      *   **Genuinely Different and Weaker:** Hobbes *is* committed to a fundamentally weaker notion of scientific knowledge in physics compared to geometry and politics.
      *   **Beyond Underdetermination:** While underdetermination (multiple causes for same effect) is a major *consequence*, Hobbes's core point is deeper: **Lack of Access to True Generation.** We simply *cannot know* the true, efficient causes and processes by which natural bodies were originally formed and internally constructed. We see the finished product and its behaviors (effects), but the "how it was made" is hidden.
      *   **Consequence:** Physics is **hypothetical-deductive**, not demonstrative. We posit *possible* causes (hypotheses or "suppositions") that *could* generate the observed effects, and then deduce what else *should* follow *if* that cause were true. We test these deductions against further observation. This yields useful, probable knowledge ("knowledge of fact" or "knowledge of phenomena"), but **not the certain, causal knowledge derived from knowing the maker's process.** It's "knowledge *that*" (descriptive, predictive) vs. "knowledge *why*" (causal, certain).

  **Tension with Materialism:**

  This is a **significant tension** in Hobbes's system and a major point of criticism:

  1.  **The Problem:** Hobbes is a thoroughgoing materialist and mechanist. He believes *everything*, including minds and commonwealths, is ultimately matter in motion governed by mechanical laws. If nature is *just* matter in motion, why can't we have the same kind of certain, demonstrative knowledge of natural bodies that we have of geometrical figures or commonwealths? Shouldn't physics be just as demonstrable as geometry, if both are matter?
  2.  **Hobbes's Implicit Defense (Likely):**
      *   **Scale and Complexity:** While nature is matter in motion, the fundamental particles and motions are too small and complex for us to directly perceive or manipulate. We cannot "construct" a rock or a tree from first principles like we construct a line or a covenant.
      *   **Lack of Maker's Perspective:** Even if we understand the *general* laws of motion, we lack the specific knowledge of the *initial conditions* and the precise sequence of motions that generated any *particular* natural body. We weren't the makers. We only see the endpoint.
      *   **Geometry/Polity as Idealized Abstractions:** Geometry deals with abstract, idealized figures defined by us. Politics deals with an artificial construct *defined by us* (the covenant). Natural bodies are concrete, complex, and *given*; their internal construction wasn't defined by human concepts. Our knowledge of matter-in-motion *in general* might be certain, but applying it to deduce the specific construction of *this* oak tree is impossible without knowing its unique generative history.
  3.  **The Tension Remains:** Critics argue Hobbes *should* be more optimistic about natural science given his ontology. His strict "maker's knowledge" criterion seems to arbitrarily limit science in a way his materialism doesn't necessitate. Why can't careful observation and experiment, combined with mechanical principles, give us knowledge of causes? Hobbes concedes this yields *probable* knowledge but insists it lacks the *certainty* derived from construction. This strict separation is arguably the point of greatest friction within his system.

  **In Summary:**

  Hobbes grounds scientific certainty exclusively in "maker's knowledge": we can only demonstrate necessary truths about things whose generation we control and understand because we built them. Geometry (abstract figures) and Civil Philosophy (the artificial commonwealth) meet this criterion. Natural Philosophy does not; we encounter nature pre-made, so physics is limited to hypothetical reasoning about possible causes based on effects, lacking true demonstrative certainty. While stemming from his core epistemology, this creates a tension with his materialist worldview that sees nature itself as a complex machine we *should*, in principle, be able to understand causally, even if not as makers.
