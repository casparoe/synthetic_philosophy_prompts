prompt: |-
  Okay so this whole thing started because a few of us were at dinner last weekend and my friend Owen, who's finishing a PhD on early Chinese philosophy, went on a tangent about Gongsun Long's "white horse is not a horse" dialogue, and it turned into a genuine two-hour argument. I kept saying it's obviously just wordplay, the guy's equivocating on "is" between identity and class-membership. Owen wouldnt have it — he said that's the lazy Western-logic-class dismissal, and the actual argument is about names and what they pick out: "horse" names a shape and any horse of any color answers to it, but "white horse" names shape-plus-color, so a yellow or black horse satisfies "bring me a horse" but does not satisfy "bring me a white horse," which means the two names aren't coextensive. Something about "ming" and "shi," names and actualities, not just a cheap trick with "is." I still think there's something off about the conclusion but by 1am I could not tell you exactly what.

  Reason I'm dumping this on you: I sit on my town's zoning board of appeals (riveting volunteer gig, I know) and we've got a hearing this Thursday that is, weirdly, the same structural problem wearing a suit. Our bylaw zones a district "single-family residential" and defines "family" narrowly. Last year the state passed a law requiring towns to allow "accessory dwelling units" by right wherever single-family homes are allowed, defined as a unit "accessory to," i.e. subordinate to, the main house. A homeowner in that district wants to build a detached ADU and rent it long-term to someone unrelated to her. Her lawyer's whole position is basically Gongsun Long's: an ADU is by definition accessory, not a second family or a second dwelling in the zoning sense, so a lot with one on it is still, categorically, a single-family lot, no matter who's in the ADU. The neighbors are running the opposite, Xunzi-ish move: call it whatever you like, two kitchens, two leases and four extra cars parked on the street is a two-family property in every way that actually matters, and "accessory" is just a label doing the work "white" supposedly isn't allowed to do to "horse."

  Could you draft the memo I'd circulate to the rest of the board before Thursday? I need an actual recommendation — grant the permit, deny it, or grant it with specific conditions — plus a realistic next step and timeline, not a "both sides have a point" shrug. But I also want it to take the neighbors' best argument seriously rather than wave it off, and to actually engage with the naming-vs-actuality problem underneath this instead of just quoting the bylaw at people.
reasoning: |-
  Okay, let me unpack this user's situation. They're on a zoning board facing a philosophical dilemma disguised as a legal case - the "white horse" paradox applied to accessory dwelling units. 

  The user's dinner debate about Chinese philosophy is actually central here. Owen's point about names ("ming") versus actualities ("shi") is the key to resolving the zoning conflict. The homeowner argues the name "accessory" defines the reality, while neighbors argue the physical reality (two kitchens, two leases) should define the classification.

  Hmm... the user needs more than just a legal ruling - they want to honor both the letter and spirit of the law while addressing community concerns. The memo must avoid philosophical abstractions but still engage the core naming-versus-reality tension. 

  First, I should establish the legal baseline: state ADU law clearly allows detached units "accessory to" primary residences. The zoning definition of "single-family" isn't overridden by ADU presence. That's straightforward. 

  But the neighbors' substantive concerns about parking and density are valid even if their legal argument isn't. The solution is to grant the permit with conditions addressing the actual impacts - parking rules, occupancy limits, design standards. This mirrors how Gongsun Long's name/reality distinction works: we accept the "single-family" classification while regulating the tangible effects. 

  For the memo structure: start with a clear recommendation upfront, then explain the legal reasoning while acknowledging the neighbors' perspective. Include enforceable conditions that make the ADU truly "accessory" in practice. Timeline-wise, approval with conditions keeps the process moving while protecting community interests. 

  The philosophical resolution? Names establish categories but don't erase material consequences - which is exactly what zoning conditions exist to manage.
answer: |-
  Here’s a memo addressing both the legal/philosophical dilemma and your practical need for a decisive recommendation. It engages the "naming vs. actuality" conflict while prioritizing enforceable zoning principles:

  ---

  **MEMORANDUM**  
  **TO:** Zoning Board of Appeals Members  
  **FROM:** [Your Name]  
  **SUBJECT:** Recommendation for [Address] Detached ADU Permit (Hearing: [Date])  
  **DATE:** [Current Date]  

  ### I. RECOMMENDATION
  **Grant the permit for the detached ADU** with the following binding conditions:  
  1. **Occupancy Restriction:** The ADU may not be leased or occupied separately from the primary dwelling for terms of less than 30 days (prohibiting short-term rentals).  
  2. **Parking:** Two additional off-street parking spaces must be provided exclusively for ADU occupants.  
  3. **Design Subordination:** The ADU’s scale, height, and exterior materials must be clearly subordinate to the primary residence (per §[Bylaw#] Accessory Structure standards).  
  4. **Deed Restriction:** A recorded covenant affirming the ADU’s accessory status and compliance with conditions.  

  **Denial is legally untenable**, and unconditional approval ignores material impacts. Conditions reconcile the "name" (accessory) with the "actuality" (use).  

  ### II. ANALYSIS: THE NAMING-ACTUALITY DILEMMA & ITS RESOLUTION
  The core dispute mirrors Gongsun Long’s "white horse" paradox:  
  - **Homeowner’s Argument (The "Name"):** "Accessory Dwelling Unit" is *defined* by its legal subordination. Just as "white horse" specifies color, "ADU" specifies functional dependence. A compliant ADU cannot alter the lot’s "single-family" classification because the *name* (and definition) excludes standalone status.  
  - **Neighbors’ Argument (The "Actuality"):** Two full-time residential units with separate utilities, leases, and entrances function as a multi-family property *in substance*. Ignoring this conflates labeling with reality—akin to insisting a white horse isn’t a horse because "horse" ignores color.  

  **Resolution:** Zoning reconciles this by conditioning the *use* of the name.  
  - **The "Name" (ADU Status) is Legally Valid:** State law (§[State ADU Law]) mandates ADUs as permitted accessory uses in single-family zones. The bylaws define "accessory" as "subordinate and incidental" to the primary use. The *label* "ADU" is not arbitrary—it carries specific legal criteria (size, ownership, non-saleability) ensuring subordination.  
  - **The "Actuality" (Impacts) Must Be Mitigated:** Unregulated, an ADU *can* function as a second principal dwelling (e.g., via unrelated tenants, excessive density). This violates the *spirit* of "accessory" and creates material impacts (parking, noise).  

  **Thus:** Granting the permit while imposing **enforceable conditions** binds the *actuality* to the *name*. Conditions ensure the ADU remains functionally accessory (e.g., no transient use, visual subordination) and mitigate externalities (parking). This honors both state law and zoning’s purpose: regulating use, not just semantics.  

  ### III. LEGAL RISK ASSESSMENT
  - **Denial Risk:** High. State ADU law preempts local barriers to compliant ADUs. Denial based on "functional two-family use" would likely be overturned in court, exposing the town to liability and legal fees.  
  - **Unconditional Approval Risk:** Ignores legitimate concerns about neighborhood character and precedent.  
  - **Conditional Approval:** Legally defensible if conditions are:  
    - Tied to impacts (parking, scale, permanence of occupancy).  
    - Explicitly allowed by state law/bylaws (e.g., MA Gen. Laws Ch. 40A §9 allows "reasonable regulations" for parking and dimensional compliance).  

  ### IV. REALISTIC NEXT STEPS & TIMELINE
  - **Hearing (Thursday):** Move to approve with conditions. Frame as balancing statutory compliance with neighborhood preservation.  
  - **Post-Hearing:**  
    - **Within 48 hours:** Draft written decision with conditions for board signature.  
    - **Within 5 days:** File decision with Town Clerk. Applicant may build upon obtaining building permits (subject to condition verification).  
    - **Ongoing:** Monitor compliance via Building Commissioner. Violations of conditions (e.g., short-term rental) trigger enforcement (fines, revocation of certificate of occupancy).  

  ### V. CONCLUSION
  The ADU’s "name" (accessory) is not mere wordplay—it is a legal classification with defined criteria. However, zoning cannot ignore that physical realities (e.g., two long-term households) create impacts if unmanaged. **Conditions bridge this gap:** They enforce the ADU’s *accessory actuality* while upholding its *legal name*. Recommend approval with the proposed conditions to satisfy state law, protect neighborhood interests, and resolve the paradox through enforceable use standards.  

  ---  

  ### WHY THIS WORKS
  1. **Decisive & Actionable:** Clear "approve with conditions" avoids legal risk while addressing neighbors’ concerns. Conditions target tangible impacts (parking, scale, transient use).  
  2. **Engages the Philosophy:** Uses the "white horse" analogy to explain the conflict but resolves it through zoning tools (conditions), showing *how* to bind names to realities.  
  3. **Legal Fidelity:** Grounded in state ADU law’s preemption, avoiding a "two-family" reclassification that would violate statute.  
  4. **Practical Timeline:** Ensures swift implementation with enforceable mechanisms.  
  5. **Precedent-Setting:** Establishes a template for future ADU cases—conditions ensure "accessory" reflects both legal form and practical function.  

  This approach respects Owen’s point (names matter legally) while conceding to your neighbors that actual use must align with the label. The conditions force the ADU to *function* as "accessory" in substance, not just name.
